prompt: |-
  I'm in a grad reading group that has now spent two semesters on the extended mind thesis, and the whole debate feels frozen in a way I'd like help diagnosing rather than adjudicating. One one side there's the Clark-and-Chalmers parity intuition: if some part of the world functions, in the moment, in a way that we'd count as cognitive were it done in the head, then it just is part of the cognitive process — Otto's notebook counting as part of his memory because it plays the same functional role that Inga's biological memory plays for her. On the other side you have the internalists, mainly Adams and Aizawa with their coupling-constitution fallacy charge — the fact that an external item is causally coupled to a cognitive process doesn't by itself make it part of that process — and Rupert, who'd rather park external resources under a separate heading about embedded cognition than grant them the extended label. The frustrating part is that after 25+ years both camps seem to accept the same cases (the notebook, counting on your fingers, doing algebra with pencil and paper, a smartphone full of offloaded memories), agree on basically all the facts, and still nobody has moved an inch. Each new round just swaps in newer gadgets and replays the same exchange.

  My working hypothesis, which I want you to actually evaluate and not just nod along to: the dispute has quietly become verbal, a fight over who gets the word cognition, that persists because it's dressed up as a substantive metaphysical claim about where the mind ends and the tool begins. But I have doubts about my own diagnosis, because the two sides really do produce different science downstream of it — the extensionists write cognitive science with different units of analysis, while the internalists keep studying brains — so maybe they're answering two different questions under one heading, one about explanatory units in cognitive science and one about a folk-conceptual claim about the boundaries of persons, and the label fight is just the symptom of that conflation. Or maybe it's genuinely substantive and merely stuck, because nobody has a non-question-begging mark of the cognitive, so every argument bootstraps from a criterion its own side already accepted.

  So, what kind of disagreement is this, actually? Substantive, verbal, two distinct questions running under one name? Ground whatever you say in what each side actually claims, not in a survey of the literature, and tell me what would count as progress given your diagnosis — a principled mark of the cognitive, some experimental or formal result, an agreed stipulation to split the vocabulary, or nothing at all — and whether the impasse means the question is ill-posed rather than just hard. My advisor is convinced it's all terminological and I half agree, but the fact that people build actual research programs on the extended side makes me suspect it can't just be words. Also, if you think the question is ill-posed, say what a well-posed replacement would look like — I need something to bring back to the group besides "it's semantics, everyone go home."
reasoning: |-
  Okay, let me unpack this user's query. They're in a grad reading group stuck on the extended mind debate between Clark/Chalmers and internalists like Adams/Aizawa/Rupert. The frustration is that after 25 years, both sides agree on cases but remain deadlocked. The user suspects it's become a verbal dispute over "cognition," but hesitates because extended mind proponents build research programs around it. They want a diagnosis, not adjudication, and concrete suggestions for progress.

  Hmm, this requires careful dissection. First, I need to map the core disagreement accurately. Clark-Chalmers rely on functional parity: if something plays the same role as internal cognition, it counts as cognitive. Internalists counter with coupling-constitution (causally coupled ≠ constitutive) and Rupert's embedded/extended distinction. The user notes both sides use identical examples—Otto's notebook, smartphones—which is crucial. Agreement on phenomena but not labeling suggests terminological elements.

  But the user's doubt is valid: if it were purely verbal, why do extended mind researchers design studies differently? That points to a deeper divergence in explanatory frameworks. Adams/Aizawa study neural mechanisms, while Clark-inspired cognitive scientists might analyze human-tool systems as single units. So perhaps two legitimate projects coexist under one label: one about cognitive science's units of analysis, another about personal boundaries.

  The bootstrapping problem looms large too. Without a neutral mark of the cognitive, each side presupposes their criteria. Internalists assume intracranialism; extensionists require functional equivalence. Circularity seems inevitable.

  Progress paths depend on the diagnosis. If it's terminological, stipulating separate terms (e.g., "coupled system" vs. "cognition proper") could help. For substantive disagreement, a non-question-begging criterion like Kirchhoff's systemic approach might reframe things. If it's two questions conflated, disentangling them ("cognitive systems" vs. "persons") would clarify. The ill-posed angle is trickiest—maybe "where does cognition occur?" assumes a false boundary, requiring process ontology instead.

  User's advisor says "terminological," but the research program angle undermines that. Validating both views: terminally stuck definitions *and* distinct scientific questions. My response should balance these, offering multiple exit strategies while acknowledging why the deadlock persists. Key is grounding each suggestion in the camps' actual positions, as requested.
answer: |-
  Here’s a grounded diagnosis of the extended mind impasse, dissecting its nature and paths forward, rooted in the claims of each side:

  ### Core Disagreement: **Substantive but Framed as Verbal (and Vice-Versa)**
  The dispute is **simultaneously substantive and terminological**, but the verbal layer masks a deeper conflict about *explanatory priorities* in cognitive science. Here’s why:

  1.  **The Verbal Facade: Fighting Over "Cognition"**  
      - Clark/Chalmers: Define cognition *functionally*. If an external resource reliably, fluently, and directly supports problem-solving in a way identical to neural processes (functional parity), it *is* cognitive. "Cognition" is an operation, not a location.  
      - Adams/Aizawa/Rupert: Define cognition *constitutively* (often implicitly). Cognition requires intrinsic, non-derived content and specific neural/computational properties. External tools lack these, so they’re coupled but not constitutive. Rupert adds: even if functional, external resources are *embedded* (scaffolding cognition) not *extended* (being cognition).  
      - **Diagnosis**: Both sides agree on *what happens* (Otto consults notebook, you use fingers to count) but disagree on whether "cognition" *describes the entire system* or *only the intracranial part*. This *is* verbal—but it’s not *arbitrary*. The label reflects deeper commitments.

  2.  **The Substantive Core: Explanatory Units vs. Personal Boundaries**  
      - **Clark/Chalmers** prioritize **explanatory efficiency and systemic unity**. For them, cognitive science should study *coupled systems* (brain + notebook + environment) as integrated wholes because:  
        - (a) It avoids arbitrary boundaries ("why stop at the skull?").  
        - (b) It explains behavior better (e.g., Otto’s action is best predicted by the notebook-brain loop).  
        - *Downstream Science*: Designing experiments where task performance is analyzed as a system property (e.g., studying how people *with* smartphones solve problems vs. without).  
      - **Adams/Aizawa/Rupert** prioritize **causal-mechanistic specificity and personal identity**. For them:  
        - (a) Cognitive processes have distinct properties (e.g., neural plasticity, non-derived content) not shared with tools.  
        - (b) Extending "cognition" dilutes explanatory power (studying brains tells us about *cognition*; studying notebooks tells us about *artifacts*).  
        - (c) Personal identity/agency is intracranial; tools are "ours" but not "us".  
        - *Downstream Science*: Isolating neural mechanisms (e.g., fMRI studies of memory recall vs. notebook lookup).  
      - **Diagnosis**: The camps are answering **two distinct (but related) questions**:  
        - Q1 (Clark): *"What is the minimal system required to explain this intelligent behavior?"* → Systemic/functional unit.  
        - Q2 (Internalists): *"What are the distinctive mechanisms that realize core cognitive capacities?"* → Mechanistic/intrinsic unit.  
        The conflation of these questions under "what is cognition?" creates the illusion of a single, unresolvable dispute.

  3.  **The Bootstrapping Problem**  
      Both sides presuppose their criteria:  
      - Internalists assume cognition *must* have properties unique to brains (question-begging against functionalism).  
      - Extensionists assume functional role trumps implementation (question-begging against mechanistic constraints).  
      Without a theory-neutral "mark of the cognitive," arguments are circular. *This* is why debates replay with new gadgets: functionalists see parity, internalists see coupling.

  ---

  ### Paths to Progress (Given the Diagnosis)
  1. **Disentangle the Questions Explicitly**:  
     - Admit that "Is X cognitive?" conflates:  
       (A) *Does X belong to the explanatory unit in a cognitive science model?*  
       (B) *Does X share the metaphysical properties of core intracranial processes?*  
     - Progress: Frame research as "When is it *productive* to treat brain-tool systems as unified units?" (Clark’s Q) vs. "What mechanistic properties are *unique* to biological cognition?" (Adams/Aizawa’s Q). This reduces talking past each other.

  2. **Develop a Principled (but Pluralist) "Mark of the Cognitive"**:  
     - Kirchhoff & Kiverstein’s *systemic approach*: Cognition is defined by *dynamical integration* – mutual interdependence and feedback loops between brain, body, and world.  
     - Test: Design experiments probing integration depth (e.g., does disrupting the tool *immediately* degrade performance in a way analogous to neural disruption?).  
     - Progress: If Otto’s notebook use shows real-time mutual adjustment (e.g., context-sensitive lookups), it meets the mark. If it’s mere storage/retrieval, it doesn’t. This shifts focus from "is it cognitive?" to "how integrated is it?".

  3. **Stipulate Vocabulary for Coexistence**:  
     - Adopt Rupert’s *embedded/extended* distinction **without** hierarchy:  
       - **Embedded Cognition**: External resources scaffold *intracranial* cognitive processes (studied via neural mechanisms).  
       - **Extended Cognitive Systems**: Coupled brain-body-environment systems studied as unified wholes (e.g., for predictive modeling).  
     - Progress: Internalists study embedded cognition; extensionists study extended systems. Researchers specify which they’re discussing.

  4. **Ill-Posed? Only if We Insist on a Single Answer**:  
     The question *"Where does cognition end?"* is ill-posed because it demands a binary boundary where there’s a gradient of integration. A better question:  
     - *"Under what conditions do external resources become deeply integrated constituents of cognitive processes?"*  
     - This invites empirical work on integration metrics (e.g., bandwidth, reciprocity, plasticity) rather than metaphysical declarations.

  ---

  ### Why It’s Not *Just* Semantics
  The persistence isn’t accidental. **The verbal dispute is a proxy for a fight over the soul of cognitive science**:  
  - Clark sees cognition as *wide computationalism*: Science should model mind-world systems without bias.  
  - Internalists see cognition as *biological computation*: Science should explain how brains do what they do.  
  Research programs diverge because they prioritize different goals (predicting behavior vs. reverse-engineering mechanisms). Recognizing this clarifies why neither side "loses"—they value different things.  

  **Bring this to your group**:  
  > *"We’re stuck because we’re trying to answer two questions at once: ‘What mechanisms realize cognition?’ and ‘What systems explain intelligent behavior?’ The first is internalist; the second often isn’t. Progress means disentangling these, stipulating terms for each, and testing integration—not rehashing parity. It’s not *just* semantics; it’s about what cognitive science should be."*
