prompt: |-
  I direct a mid-sized annual literary prize: around 180 submitted novels, five judges, three months of reading, a public shortlist of six, a single winner, and a press release we have to defend in interviews. Our current method is horse-trading. Every year produces the same fights: two judges adore a formally daring novel the other three find cold and hollow; a sentimental crowd-pleaser splits the panel between those moved by it and those who consider it manipulative; and there is always one immaculately crafted book whose moral vision half the panel finds repellent. We resolve these by exhaustion and compromise, not by any principle, and our shortlists read accordingly.

  I have become convinced that the most promising theory for our situation is Hume's, in his 1757 essay on the standard of taste: beauty judgments are not arbitrary, because the joint verdict of qualified judges — those with practice, comparison, freedom from prejudice, and delicacy — tracks real features of works, and the verdicts of the qualified eventually converge on the great works even where the unqualified diverge. But an essay addressed to eighteenth-century connoisseurs is not something a working panel can run. Please translate it into a procedure we can actually operate, with the following components.

  1. Judge selection. We must choose the five before we have seen any of their verdicts on these books. Specify the observable proxies you would substitute for practice, comparison, and freedom from prejudice — breadth of reading, a track record of public reviewing, demonstrated willingness to reverse an earlier judgment, financial and personal conflicts — and be explicit about where each substitution is weakest. Also address the circularity worry directly: if we select judges whose taste we already approve of, the standard has collapsed into our prior preferences, and Hume has given us nothing independent. Say whether the procedure can answer this or only contain it.

  2. Deliberation protocol. Hume concedes that even the best judges disagree, and that their disagreement is widest about lesser works. Specify what this licenses in our setting: whether judges must articulate reasons before scoring, whether scores precede or follow discussion, how a judge registers a considered dissent on the shortlist, and at what point the protocol must stop and declare an issue a values question that a procedure cannot settle.

  3. The morally difficult cases. Hume appears to hold that a work's moral character affects its aesthetic standing, which our panel cannot agree on. Give the procedure a rule for the two directions: works of high craft with a vision the panel finds repellent, and works of clumsy craft with an admirable heart. The rule should be usable by judges who have never read a word of aesthetics.

  4. The distortions. Say plainly which parts of Hume's theory you had to drop or bend to make the procedure usable at all, and what each distortion costs us — where the simplified procedure will misfire, and which distinctions simply cannot survive into a checklist without becoming vacuous.

  Then run the procedure on three cases drawn from our recent years. (a) A formally brilliant novel that one judge described as a machine for impressing critics: technically immaculate, emotionally inert, without a single scene anyone would reread. (b) A sprawling sentimental novel containing four superb chapters and a bloated remainder, beloved by librarians and booksellers. (c) A novel of merely adequate prose whose final movement one judge called the most moving thing she had read in a decade, while two others dismissed it as engineered tearjerking. Show the procedure's output at each stage for these three, and ensure that at least one comes out in a way I will not like — identify which, and explain why the procedure nonetheless says it.

  Finally, state the limits: what questions about our prize does this procedure silently refuse to answer, and where must the director simply decide?
reasoning: |-
  Hmm, the user directs a mid-sized literary prize and is struggling with their current horse-trading judging method. They're encountering the same conflicts every year: formally daring novels that split the panel, sentimental crowd-pleasers that create division, and morally challenging books that provoke strong reactions. They want to implement Hume's theory of taste but need a practical procedure.

  The user has outlined four specific components they need addressed: judge selection with observable proxies, a deliberation protocol, rules for morally difficult cases, and necessary distortions to Hume's theory. They also want three real-world examples tested and want to understand the procedure's limits.

  For judge selection, I need to translate Hume's "qualified judges" criteria into practical proxies. "Practice" can become breadth of reading and reviewing experience. "Comparison" translates to demonstrated range in public criticism. "Freedom from prejudice" needs conflict declarations and evidence of reconsidering positions. The circularity problem is real - we can't fully escape prior preferences, but we can contain it through structured diversity and blind vetting.

  The deliberation protocol needs structure. Judges should articulate reasons before scoring to prevent groupthink. Scores should precede discussion to preserve independence, but allow dissent registration afterward. We need a clear stopping point when debates become purely about values rather than craft.

  For morally difficult cases, I'll propose a "craft-first" rule that separates technical evaluation from moral resonance, while acknowledging both dimensions. The procedure must work for judges without aesthetics training.

  The distortions are inevitable. We'll lose Hume's convergence ideal by using a point system. We'll flatten "delicacy" into trackable preferences. We'll abandon the hope of unanimous verdicts. The cost is that borderline cases may be misjudged.

  For the test cases: 
  (a) The brilliant but cold novel will likely score high on craft but fail resonance checks
  (b) The uneven sentimental novel will split on craft but may pass through if superb moments outweigh flaws
  (c) The tearjerker will live or die on whether its emotional payoff feels earned to most judges

  The procedure will refuse to answer whether a book "deserves" to win in some abstract sense. It can't resolve fundamental value conflicts - that's where the director must step in. I'll make sure to show how one outcome might dissatisfy the user, proving the system isn't rigged for their preferences.

  The key is balancing Hume's insights with operational reality while maintaining enough rigor to justify decisions publicly. The examples will show where the procedure leads to uncomfortable but defensible outcomes.
answer: |-
  Here's a Humean procedure translated for your literary prize, designed for operational clarity while acknowledging its necessary compromises:

  **Core Principle:** *Quality is discernible through the structured convergence of qualified judges.* The procedure tracks *relative merit within the submitted pool*, not absolute greatness.

  **1. Judge Selection (Proxies & Containment of Circularity)**

  *   **Practice:**
      *   *Proxy:* **Minimum 2 published book reviews/critical essays annually for 5+ years** + **Evidence of reading widely in contemporary fiction** (e.g., public lists, commentary, bibliographies in their own work).
      *   *Weakness:* Quantity ≠ depth of engagement. May miss insightful private readers.
  *   **Comparison:**
      *   *Proxy:* **Demonstrated public criticism across diverse genres/styles/eras** (e.g., reviewed literary fiction, genre fiction, translated works, classics) + **Explicit statement of critical range/interests**.
      *   *Weakness:* "Diverse" is subjective. Could favor superficial breadth over deep expertise.
  *   **Freedom from Prejudice:**
      *   *Proxy:* **Full financial/personal conflict declaration** (publishers, authors, agents) + **Documented examples of publicly reversing/challenging their own prior judgments or strong biases**.
      *   *Weakness:* Subtle biases are hard to track. Reversals might be performative.
  *   **Addressing Circularity:**
      *   **Containment, Not Elimination:** The procedure *cannot* fully escape circularity. Its goal is **structured exposure to difference**.
      *   **Mechanism:**
          1.  **Director's Initial Pool (Blind):** Generate a large pool (20-30) based *only* on the proxies above, *without* reviewing their specific past verdicts on books.
          2.  **Diversity Mandate:** Ensure the final 5 represent demonstrably different critical perspectives (e.g., formalist, thematic, narrative-driven, historical, champion of underrepresented voices) based *only* on their *stated* critical philosophies and *demonstrated range*, not agreement with past prize winners.
          3.  **Blind Vetting:** Where possible, have a small external advisory group (e.g., past judges, librarians) *blindly* review anonymized critical statements from the pool to flag potential groupthink in the Director's proposed panel.
      *   **Result:** Judges are qualified by observable criteria *before* knowing their specific tastes on *this year's books*. Their convergence *during* the process, driven by structured deliberation, *is* the standard emerging, distinct from any single prior preference.

  **2. Deliberation Protocol (Licensing Disagreement, Structuring Consensus)**

  *   **Initial Scoring (Blind):** Judges independently score *all* 180 novels privately on two scales *before any discussion*:
      *   **Craft (1-10):** Technical execution (prose, structure, pacing, characterisation, originality of form).
      *   **Resonance (1-10):** Emotional/intellectual impact, memorability, sense of significance, perceived depth.
  *   **Longlist Creation (Objective):** Top 15-20 books by *combined average score* (Craft + Resonance). Ties broken by number of high individual scores (e.g., 9s & 10s). *No discussion yet.*
  *   **Structured Discussion & Re-Scoring:**
      1.  **Focus:** Judges present *specific textual evidence* for their Craft/Resonance scores on longlisted books. *No* abstract declarations of "hollow" or "manipulative." Focus on *how* effects are achieved.
      2.  **Re-Score:** After discussion of each longlisted book, judges *privately* re-score Craft & Resonance based *only* on arguments made about the text itself.
  *   **Shortlist Creation (Constrained):** Top 6 by *new combined average score*. If a judge feels a book in the top 6 is fundamentally flawed *despite* the discussion:
      *   **Formal Dissent:** They may submit a 200-word dissent citing textual evidence for *one* book, published with the shortlist.
      *   **Values Deadlock:** If disagreement stems *entirely* from irreconcilable moral/aesthetic values (e.g., "This vision is repellent" vs. "Its craft transcends the vision"), and textual evidence fails to bridge the gap, the *Director* decides based on the prize's stated mission (if clear) or the book's average score. **The protocol stops here for that book.** It acknowledges an unresolvable values clash.
  *   **Winner Selection:** Repeat focused discussion on the 6, judges privately rank them 1-6. Book with the best average ranking wins. Dissents possible as above.

  **3. Rule for Morally Difficult Cases (Craft-First with Resonance Impact)**

  *   **The Rule:** *"Judge the Craft; Acknowledge the Resonance Impact."*
  *   **Application:**
      *   **High Craft, Repellent Vision:** Score Craft high based on technique. Score Resonance *based on the judged effectiveness and coherence of the vision within the work*, even if morally repellent. Does the vision achieve its intended effect powerfully? Does its presentation contribute to its artistic power? (e.g., *Lolita* scores high on both by most qualified judges). Judges *can* score Resonance low if they argue the moral flaw *weakens* the artistic coherence or impact *textually* (e.g., "the hateful portrayal undermines character motivation").
      *   **Clumsy Craft, Admirable Heart:** Score Craft low based on technique. Score Resonance *based on the judged effectiveness of the 'heart' within the work*. Does the admirable intent translate into genuine, earned emotional/intellectual impact *despite* the clumsiness? Or is the impact undercut or rendered simplistic by poor execution? "Admirable heart" alone isn't sufficient for high Resonance.
  *   **Key:** Judges argue *textual impact*, not abstract morality. "This clumsy prose made the admirable message feel saccharine and unearned (Resonance: 3)" or "Despite the awkward dialogue, the core emotional truth landed with devastating power (Resonance: 8)."

  **4. Necessary Distortions & Costs**

  *   **Dropped: The Guarantee of Convergence.** Hume assumes convergence *will* happen over time/among the best. We use averages and ranking knowing full convergence on 180 books in 3 months is impossible. *Cost:* Lesser or divisive works might make the shortlist via compromise averaging. True "greatness" might be missed if too singular for the panel.
  *   **Bent: "Delicacy" as a Proxy.** We use "breadth of reading" and "critical experience" as proxies. *Cost:* Subtle perceptiveness is hard to quantify. Some judges with exquisite taste but less public output might be excluded.
  *   **Dropped: The Ideal of Unanimity.** We accept formal dissents and values deadlocks. *Cost:* The public verdict (shortlist/winner) may not reflect a unified "standard of taste," potentially undermining Hume's ideal.
  *   **Bent: "Freedom from Prejudice" as Checklists.** Conflicts and reversals are proxies. *Cost:* Deep-seated, unconscious biases remain potent and largely unchecked.
  *   **Flattened: Moral/Aesthetic Unity.** Hume sees them intertwined. We separate Craft/Resonance scoring to make it operational, knowing it's artificial. *Cost:* Risks undervaluing works where moral vision is inseparable from aesthetic power (or vice-versa).

  **Running the Procedure: Three Test Cases**

  *   **Assumptions:** Panel of 5 qualified, diverse judges. Initial and Re-Scores shown as (Craft Avg / Resonance Avg). Shortlist = Top 6 Re-Score Averages.

  **(a) Formally Brilliant, Emotionally Inert ("The Machine")**
  *   **Initial Scores:** High Craft (9.0), Low Resonance (4.2) --> **Combined 13.2** (Likely makes longlist)
  *   **Discussion:** Proponents cite technical mastery, innovation. Opponents cite lack of emotional connection, memorable scenes, arguing this *is* a Resonance flaw – the form doesn't serve deeper human impact. "Impresses critics" isn't Resonance if it doesn't move *qualified readers* deeply.
  *   **Re-Scores:** Craft remains high (8.8 - some concede coldness *is* a craft flaw if emotion was intended). Resonance likely drops further (3.6) as opponents solidify textual arguments about inertness. **Combined 12.4**
  *   **Outcome:** Likely **fails the shortlist** (Combined 12.4 is low for Top 6). *You won't like this* if you valued its daring. *Why?* The procedure prioritizes *convergence* on Resonance. Judges agreed its technical skill didn't translate into significant emotional/intellectual impact *for them as qualified readers*. Hume's "delicacy" requires perceiving the *effect*, which they didn't feel.

  **(b) Sprawling Sentimental, Four Superb Chapters ("The Crowd-Pleaser")**
  *   **Initial Scores:** Mixed Craft (5.8 - superb bits vs. bloated), High Resonance (7.6) --> **Combined 13.4** (Makes longlist)
  *   **Discussion:** Proponents passionately defend the emotional power, memorability of the 4 chapters, argue the heart transcends flaws. Opponents dissect the bloated sections, arguing poor pacing/structure (Craft) *actively undermines* the emotional payoff (Resonance), making it manipulative because unearned. Booksellers/librarians appeal noted but not determinative.
  *   **Re-Scores:** Craft likely drops slightly (5.4 - focus on structural flaws). Resonance likely *polarizes*: Some increase score based on peak power (8.5), others decrease arguing flaws dilute impact (6.0). **Avg Resonance: 7.0, Combined: 12.4**
  *   **Outcome:** **Borderline Shortlist.** Combined 12.4 is low. Likely **fails shortlist** unless other longlist books score similarly. *Why?* Judges converged on significant Craft flaws. While Resonance was high initially, discussion revealed deep disagreement on whether the emotion was *earned artistically* (Humean "delicacy") or reliant on sentiment despite flaws. The averaging reflects the unresolved tension.

  **(c) Adequate Prose, Powerful Final Movement ("The Tearjerker")**
  *   **Initial Scores:** Moderate Craft (6.4), Polarized Resonance (Scores: 10, 9, 3, 4, 8 --> **Avg 6.8**) --> **Combined 13.2** (Makes longlist)
  *   **Discussion:** Proponents of the high Resonance scores detail *how* the final movement works textually, its emotional payoff, character arc culmination. Detractors argue the prose is merely functional, the emotion is engineered through cliché or manipulative plotting *textually*, making the ending unearned. The "moving/engineered" clash is central.
  *   **Re-Scores:** Craft stable (6.4). Resonance re-score hinges on arguments about *earned* emotion. Did detractors show textual manipulation? Did proponents show textual buildup justifying the payoff? Result likely: **Resonance Avg: 7.6** (e.g., scores: 10, 9, 5, 5, 8). **Combined: 14.0**
  *   **Outcome:** **Strong Contender for Shortlist/Winner.** Combined 14.0 is competitive. *Why?* The procedure forced textual arguments about *how* the emotion was achieved. The shift in detractors' scores (3/4 -> 5/5) suggests the proponents' textual defense of the ending's power partially convinced them, or they conceded its impact while disliking it. This is partial *convergence* through Humean reasoning about effect. Its high ranking reflects judged effectiveness despite Craft limitations. *You might like this outcome* if the emotional power resonated, *or dislike it* if you agree with the "engineered" critique. The procedure values the qualified judges' convergence on its impactful nature.

  **The Limits: What the Procedure Silently Refuses & Where the Director Decides**

  1.  **Defining "Greatness":** It identifies the *best relative to the pool* via the judges' convergence, not whether any book is objectively great or will last centuries. Hume's long-term convergence is aspirational, not guaranteed by this snapshot.
  2.  **Resolving Fundamental Value Clashes:** When judges reach a "values deadlock" (e.g., morally repellent vision), the procedure flags it but *refuses* to arbitrate the inherent worth of those values. It defaults to score or Director's call based on prize ethos.
  3.  **The "Why This Winner?" Beyond Scores:** The procedure provides a defensible *process* and likely textual arguments (from discussion/dissents). It refuses to provide a single, perfect, unifying philosophical justification beyond "this is where these qualified judges converged after structured deliberation."
  4.  **Selecting the Judges:** The Director (likely with input/advisors) *decides* the final panel composition based on the proxies and diversity mandate. This is where the Director's vision for the prize's character is most influential.
  5.  **Interpreting the Prize's Mission:** If the prize has a specific ethos (e.g., "championing innovation," "celebrating storytelling"), the Director *decides* how to apply this during values deadlocks or potentially in the diversity mandate for judges.
  6.  **Handling Dissents & Deadlocks Publicly:** The Director *decides* how prominently to feature dissents and how to frame unresolvable clashes in communications.
  7.  **The "So What?" Factor:** The procedure finds the best book *by this panel's standards*. The Director must *decide* how to champion it, contextualize it, and articulate its significance to the public beyond the scores.

  This procedure replaces unstructured horse-trading with a Humean-inspired structure: selecting qualified judges via proxies, forcing textual deliberation, separating craft from resonance while acknowledging their interplay, and seeking convergence through scoring and discussion. It accepts imperfection (dissents, values deadlocks, averaging compromises) as the cost of practicality but provides a transparent, defensible, and reason-based framework far more robust than "exhaustion and compromise." It makes the judging process itself an argument for the validity of the outcome.
