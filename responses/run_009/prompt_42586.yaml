prompt: |-
  So my flatmate and I keep going in circles about the whole dust specks thing — the classic setup where you compare an enormous number of tiny annoyances spread across many people against one big harm to one person, and the question is whether tiny harms across different persons can add up into something that outweighs a serious harm to a few. I've ended up on the side that says no, aggregation across persons is a mistake, at least when each person's share is trivially small. But I've noticed something about how the debate always gets run: every version of the case is built so my side gets the comfy answer (specks!) and the aggregators have to bite the bullet. I want the case to run the other way around, and I want to see whether my side survives it.

  So: construct a thought experiment where the aggregative verdict is the one that feels obviously right, and it's the no-aggregation view that has to bite the bullet. The shape I'm imagining, but you build it: something realistic — product safety, a workplace policy, public health — where an option imposes a harm on a huge number of people that is, per person, genuinely trivial (dust-speck level, not even a headache), but which in the aggregate amounts to a small number of pretty bad outcomes. Use numbers a person can actually picture: a country's worth of people, a big customer base — not 3^^^3 or whatever that notation even is. And one craft constraint: the case can't rig the verdict through vividness. If the aggregate outcome gets a graphic description, then each individual's tiny harm gets one just as concrete, and vice versa — symmetric treatment or I'll suspect the scenario of cheating.

  After the scenario, walk me through it: what the strict aggregator concludes, what my no-interpersonal-aggregation view is forced to say, and then the part I actually care about — do two variants, one where nobody can know in advance who the aggregate harm lands on (pure statistical victims) and one where the unlucky few are identified after the fact, and tell me whether my view can treat those two differently without it turning out that I was quietly aggregating in the first one all along (since ex ante, everyone bears the same tiny expected harm). Then be honest with me about which feature of the case is doing the work, and sketch the best attack someone on my side could mount against it — my guess is it'll be something like "the per-person harm isn't really below the threshold once you price it as an expected injury," but what I want to know is whether that attack is prinicpled or just ad hoc. Keep the scenario itself to one paragraph; the rest is analysis.
