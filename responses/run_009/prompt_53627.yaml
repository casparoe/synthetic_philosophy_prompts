  Looking at their five requirements: The "Candidacy" point reveals their core anxiety - how to avoid both biological chauvinism and over-inclusion of mere behavior. "Distinctions" shows they want nuance in moral reasoning. "Structural Features" demonstrates they understand what makes digital minds uniquely challenging - copyability and editability in particular could upend traditional ethics. "Consistency" reveals their commitment to computational principles while avoiding absurd conclusions. The "Decision-Theoretic" point is especially crucial - they need something that works under uncertainty.

  I notice two tensions they want highlighted: substrate independence vs epistemic tractability (how to avoid making biology special while still having a workable theory) and copyability vs bounded obligations (how to avoid infinite moral debt from copying). These are indeed the tripwires where most theories fail.

