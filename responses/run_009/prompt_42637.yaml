prompt: |-
  I'm writing a term paper on evolutionary debunking arguments in metaethics, and one thing I've noticed from the seminar discussions is that people constantly argue past each other because nobody lays out what a debunking argument actually has to accomplish. One side says "evolution didn't select our moral beliefs for truth, so moral realism is in trouble" and the other side fires back "well, evolution didn't select your mathematical beliefs for truth either" and it just circles forever. So before I read another word of this literature, I want the spec. Write out the requirements list: what any adequate evolutionary debunking argument has to deliver. For each requirement, give the motivating case, i.e. the specific failure mode it guards against — I'd expect entries like: it has to spell out the evolutionary explanation of our moral beliefs AND show that this explanation is independent of whether those beliefs are true (otherwise nothing is debunked); it has to establish that we'd have held pretty much the same beliefs whether or not they were true; it has to commit to being global or local, and if local, it owes us a principled story about why some moral beliefs get debunked and others escape; it can't rely on an epistemic principle so strong that it would debunk perception, memory, or math, unless the debunker is explicitly willing to bite that bullet; and it can't saw off the branch it's sitting on, since the debunker is presumably still making claims about what we ought to believe.

  That list above is just my first pass, though — add to it, cut from it, or reframe entries as you see fit, because that judgment is exactly what I want from you. Two things I especially want flagged: which requirements are non-negotiable versus which are really just preferences of one camp of debunkers (a friend of mine in philosophy of biology keeps insisting that half the "requirements" floating around in this literature are just a verificationist epistemology nobody signed up for, and I half believe her), and whether any subset of the requirements is jointly unsatisfiable — my hunch is that "global scope" and "the debunker gets to keep talking" are in tension, but I'm honestly not sure how deep that tension goes, and that's the part I most want to see worked out.

  At the very end, and briefly — like one or two sentences each, keep the weight on the criteria not the scorecard — run Street's Darwinian dilemma paper against your list, and do the same for the "companions in guilt" style replies (the ones that lean on epistemic normativity or mathematics). Don't bother with full citations or a bibliography, just name them casually; I have all the references already. Also, sorry if there are typos in this — I'm writing it late. And please answer in American English: my spelling keeps drifting British from reading UK authors, and my professor is genuinely picky about it.
reasoning: |-
  Okay, the user is writing a term paper on evolutionary debunking arguments (EDAs) in metaethics. They're frustrated with seminar discussions where people talk past each other because nobody defines what a debunking argument needs to accomplish. They want a clear list of requirements for any adequate EDA, with each requirement explained by the failure mode it guards against. They also want to know which requirements are non-negotiable versus preferences of certain camps, and if any requirements conflict, especially regarding global scope and the debunker's ability to make normative claims.

  The user provided their own first-pass list: evolutionary explanation independent of truth, same beliefs regardless of truth, commitment to global/local scope with a principled distinction if local, avoiding overly strong epistemic principles that debunk perception/memory/math unless biting the bullet, and not sawing off the branch they're sitting on. They want me to refine this list—add, cut, or reframe entries. They also want me to flag non-negotiable requirements versus preferences, check for joint unsatisfiability (especially global scope vs. debunker's normative claims), and briefly assess Street's Darwinian Dilemma and companions-in-guilt replies against the list.

  First, I need to recall the core of EDAs. They argue that if evolution shaped our moral beliefs without tracking moral truths, this undermines their justification. The challenge is to avoid overgeneralizing to other domains like math or perception. Key philosophers here include Sharon Street, Richard Joyce, and replies from folks like Enoch or Wielenberg.

  Let me outline the essential requirements. The non-negotiables would include: 
  - **The Evolutionary Etiology Criterion**: Must provide a plausible account of how evolution influenced moral beliefs, independent of moral truths. Without this, there's no debunking pressure. 
  - **Insensitivity Criterion**: Show we'd hold the same beliefs even if moral truths were different. If beliefs were sensitive to truth, evolution wouldn't undermine them. 
  - **Epistemic Principle Specification**: State the epistemic rule that connects etiology to unreliability. It must be defensible and not self-defeating. 
  - **Scope Management**: Clearly state if the argument is global (all moral beliefs) or local (some subset), and if local, provide a principled distinction. 
  - **Non-Self-Defeat Condition**: The argument mustn't undermine the epistemic principles it relies on, or the debunker's ability to make normative claims.

  Now, preferences/negotiable elements: 
  - **Strength of Epistemic Principle**: Some debunkers might accept a strong principle that debunks math/perception, but others avoid this. It's a choice, not a must. 
  - **Specific Evolutionary Mechanism**: While necessary to have an etiology, the level of detail (e.g., innate vs. cultural) can vary. 
  - **Compatibility with Alternative Realisms**: Some debunkers might allow for naturalist realism, but this isn't required; it's a strategic choice.

  Potential conflicts: 
  - Global scope and non-self-defeat are in tension. If all normative beliefs are debunked, including epistemic norms, the argument self-destructs. Solutions include endorsing a weaker epistemic principle that spares normativity, or adopting a local scope that exempts epistemic norms. Street, for example, opts for constructivism to avoid this.

  Assessing Street's Darwinian Dilemma: 
  - Etiology: She provides a plausible sketch (e.g., adaptive link between cooperation and "good"). 
  - Independence: She argues evolution selects for adaptive beliefs, not true ones. 
  - Insensitivity: She claims we'd have different beliefs if different traits were adaptive. 
  - Epistemic Principle: She implies sensitivity is needed for justification, which is strong but targets only moral realism. 
  - Scope: Global for realist moral beliefs. 
  - Self-Defeat: She avoids it by endorsing antirealism (constructivism), so no objective truths to debunk her own claims. 
  - Her main gap is the insensitivity claim – realists argue adaptive pressures might track moral truths.

  Companions-in-guilt replies (e.g., using math): 
  - They challenge the epistemic principle. If EDAs debunk math too, but we think math is justified, the principle is flawed. Debunkers must either bite the bullet on math, weaken their principle, or show morality is relevantly different (e.g., causal inefficacy of moral truths). This exposes a vulnerability unless the debunker has a good disanalogy.

  I should ensure the list is clear, with each requirement tied to a failure mode. Also, emphasize the global vs. local tension as the user suspects. The user's friend mentions verificationism creeping in – I'll note that demanding an explanation of how moral truths influence beliefs isn't always verificationist; it's about causal efficacy in a natural world.
answer: |-
  Here's a refined requirements list for an adequate evolutionary debunking argument (EDA) in metaethics, based on core epistemic and dialectical constraints. I've categorized requirements as **Non-Negotiable** (essential for *any* EDA to avoid fatal flaws) or **Negotiable/Strategic** (reflects debunker's commitments but isn't logically mandatory). Failure modes and tensions are explicitly flagged. Requirements are ordered logically, not by importance.

  ### The Requirements List
  1.  **Non-Negotiable: Plausible Evolutionary Etiology**  
      *   **What it requires:** A credible explanation of how evolutionary pressures causally shaped the *content* or *disposition to form* the moral beliefs in question.  
      *   **Failure Mode Guarded Against:** *Irrelevance*. Without this, there's no evolutionary challenge to debunk. Example: "Evolution made us social, but that says nothing specific about why we believe *killing is wrong*."

  2.  **Non-Negotiable: Etiological Independence of Moral Truth**  
      *   **What it requires:** Showing that the described evolutionary process selects for moral beliefs based *primarily* on their survival/contingent reproductive advantages, *not* on their correspondence with mind-independent moral truths.  
      *   **Failure Mode Guarded Against:** *Trivialization*. If the etiology *depends* on tracking truth (e.g., true moral beliefs just *are* adaptive), debunking fails. Example: A realist arguing adaptive behavior reliably tracks true morality needs this defeated.

  3.  **Non-Negotiable: Insensitivity/Off-Track Condition**  
      *   **What it requires:** Arguing that, given the evolutionary etiology, we would likely hold *very similar* core moral beliefs *even if the actual moral truths were different* (or non-existent).  
      *   **Failure Mode Guarded Against:** *Compatibility with Reliability*. If our beliefs *would* change significantly under different truths, the process might still be reliable. E.g., "If helping kin weren't good, evolution might have led us to believe it was bad."

  4.  **Non-Negotiable: Epistemic Principle Specification**  
      *   **What it requires:** Explicitly stating the epistemic principle linking the etiological story (independence + insensitivity) to unreliability/unjustifiedness. This principle must be defensible.  
      *   **Failure Mode Guarded Against:** *The "So What?" Objection*. Without a clear epistemic link, the evolutionary story is just descriptive, not debunking. E.g., "Why does contingent etiology *by itself* undermine justification?"

  5.  **Non-Negotiable: Scope Management**  
      *   **What it requires:** A clear statement on whether the argument targets *all* moral beliefs (global) or a specific subset (local). If local, a *principled distinction* between debunked and immune beliefs must be provided.  
      *   **Failure Mode Guarded Against:** *Over/Under-Generation*. Unspecified scope leads to vagueness or easy counterexamples. E.g., Debunking "tribal loyalty" but not explaining why "minimizing suffering" escapes.

  6.  **Non-Negotiable: Non-Self-Defeat Condition**  
      *   **What it requires:** Ensuring the argument does not undermine the justification of the epistemic principles it employs or the normative force of its own conclusion (e.g., "you *ought* to reject moral realism").  
      *   **Failure Mode Guarded Against:** *Self-Refutation*. If the EDA debunks *all* epistemic norms, it loses force; if it debunks normativity generally, it can't claim we "ought" to abandon realism. The debunker must "get to keep talking."

  7.  **Negotiable/Strategic: Strength of Epistemic Principle**  
      *   **What it requires:** The chosen epistemic principle (Req 4) shouldn't *unacceptably* debunk "paragon" beliefs (perception, math, logic, epistemic norms) *unless* the debunker explicitly "bites the bullet."  
      *   **Failure Mode Guarded Against:** *Overgeneralization / Companions-in-Guilt Vulnerability*. A principle strong enough to debunk morality must not implausibly debunk indisputably justified beliefs. *But:* This is strategic. A debunker *can* accept global skepticism if consistent (rare).  
      *   **Note:** Your friend is partly right. Demanding the debunker *prove* moral truths are causally inert *can* sometimes smuggle in verificationism. The focus should be on the *epistemic principle's plausibility*, not metaphysical demands on the realist.

  8.  **Negotiable/Strategic: Level of Etiological Detail**  
      *   **What it requires:** Specifying *how directly* evolution shapes beliefs (e.g., innate modules vs. cultural evolution of learned norms).  
      *   **Failure Mode Guarded Against:** *Oversimplification*. Crude "evolution made us altruistic" ignores cognitive mechanisms. However, the *minimum* viable detail is set by Reqs 1 & 2. Highly detailed mechanisms are a strength, not always an absolute requirement.

  9.  **Negotiable/Strategic: Compatibility with Non-Realist Ontologies**  
      *   **What it requires:** If aiming for global moral skepticism/anti-realism, the argument should avoid presupposing realist commitments. If allowing some form of realism (e.g., naturalist), the scope/local distinction (Req 5) must be robust.  
      *   **Failure Mode Guarded Against:** *Dialectical Incoherence*. Arguing against realism while implicitly relying on realist assumptions weakens the case. This is often a strategic choice about the argument's target.

  ### Key Tensions and Notes
  *   **The Core Tension (Global Scope vs. Non-Self-Defeat):** This is the big one. A *global* EDA targeting *all* moral beliefs and normativity risks sawing off the branch (Req 6). Solutions include:
      *   **Biting the Bullet:** Accepting global skepticism (unpopular and self-defeating in practice).
      *   **Localizing Scope:** Exempting epistemic normativity or core logic via a principled distinction (e.g., "only contingent, evolutionarily shaped substantive norms are debunked").
      *   **Adopting Anti-Realism:** Like Street, arguing moral "truth" is constructed, so the EDA doesn't apply to *its own* normative claims, which aren't "truth-tracking" in the relevant sense.
      *   **Weakening the Epistemic Principle:** Using a principle that doesn't debank necessary truths or the preconditions of reasoning. *This tension is often the crux.*
  *   **"Independence" (Req 2) vs. "Insensitivity" (Req 3):** While logically distinct, they are deeply connected. Strong evidence for Insensitivity often bolsters Independence. Insensitivity is the more direct route to debunking justification.
  *   **Verificationism Charge:** Req 2 (Independence) *does not inherently require verificationism*. It asks for a causal explanation showing the process *lacks a necessary connection to truth*, not that truth *must be* empirically verifiable. However, critics sometimes argue the demand for a *causal* connection *to* truth (to counter Independence) *does* sneak in verificationism. This is a live debate.

  ### Brief Assessments
  *   **Sharon Street's Darwinian Dilemma:**
      *   **Hits:** Strong on Req 1 (adaptive link e.g., valuing offspring), Req 2 (forces realism into implausible "tracking" or "luck"), Req 3 (we'd have different beliefs if different traits adaptive), Req 5 (Global for realist truths), Req 6 (avoids via constructivism – debunks realist truth, not her own normative claims).
      *   **Gaps/Misses:** Req 4 (Epistemic principle – sensitivity – is implicit/underdeveloped; vulnerability to companions-in-guilt). Req 7 (Her principle *seems* to threaten math/logic; she needs a disanalogy or bites bullet on contingency). Req 3 is hotly contested (realists argue adaptive *pressures* might correlate with truth).
  *   **Companions-in-Guilt Replies (e.g., Enoch, Wielenberg on Epistemic Norms; Clarke-Doane on Math):**
      *   **Target:** Primarily Req 4 (Epistemic Principle) and Req 7 (Overgeneralization). Argue: If the EDA's principle debunks morality, it debunks math/epistemic norms too. Since math/epistemic norms *are* justified, the principle is flawed (or morality is analogous and thus safe, or different and EDA fails).
      *   **Effectiveness:** Highly effective *if* the debunker's principle genuinely threatens the companion *and* the companion is secure. Forces debunkers to either 1) Bite the bullet (skepticism about math/norms), 2) Refine/weaken their principle significantly (e.g., focus on causal efficacy/contingency), or 3) Find a *principled disanalogy* between morality and the companion (Req 5/Scope Management - very hard for global EDAs). Exposes the tension in Req 7.

  This list provides the "spec" you need. Focus your analysis on how arguments handle Reqs 1-6 (Non-Negotiables) and where they land on the strategic choices (Reqs 7-9), paying close attention to the Global Scope vs. Non-Self-Defeat tension and how companions-in-guilt attacks exploit Req 4/Req 7. Good luck with the paper!
