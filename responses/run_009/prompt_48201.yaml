answer: |-
  ### In-Class Activity: The Unstable Game

  **Handout Rules**  
  *Game 1:*  
  - Flip a fair coin until it lands heads. If the first head is on flip **n**:  
    - **If n is odd**, you win **+2ⁿ/n** points.  
    - **If n is even**, you lose **2ⁿ/n** points (i.e., **−2ⁿ/n**).  

  *Game 2 (introduced later):*  
  - Identical to Game 1, but **every payoff is increased by exactly 1 point**.  

  ---

  #### Timeline (90 Minutes Total)  
  **Stage 1: Play and Initial Pricing (20 min)**  
  - (5 min) Distribute rules, coins, and play money ($100 each). Students play Game 1 individually for **10 trials**. For each trial, they record:  
    - Flips (e.g., Tails, Tails, Heads → *n*=3 → payoff = +8/3 ≈ +2.67).  
  - (10 min) Students calculate their **average payoff** over 10 trials. Write all 12 averages on the board.  
  - (5 min) **Market Round 1:** Students trade "tickets" for 1 play of Game 1. They negotiate prices (e.g., "I’ll sell for $3!"). Record transactions on the board.  

  **Stage 2: Aggregating Data (15 min)**  
  - (5 min) **Pooled average:** Combine all 120 trials (12 students × 10 trials). Compute overall average payoff.  
  - (10 min) **Running averages:**  
    - *Step 1:* Flip a coin publicly for 5 new trials (students volunteer). After each trial, update a running average (e.g., "Trial 121: *n*=1 → +2 → new avg = X").  
    - *Step 2:* Add 5 **pre-seeded trials** (e.g., *n*=10: +102.4; *n*=11: −186.18) to artificially inject rare large payoffs. Update running average after each.  

  **Stage 3: Dominating Game and Market Chaos (20 min)**  
  - (5 min) Introduce **Game 2** (handout). Emphasize: "Every outcome pays exactly 1 point more than Game 1."  
  - (10 min) **Market Round 2:** Students trade tickets for *both* games. Record prices for Game 1 and Game 2 separately.  
  - (5 min) Encourage **arbitrage:** "If you buy Game 2 and sell Game 1, what happens?" Let them discover mispricings (e.g., Game 2 priced *lower* than Game 1).  

  **Stage 4: Debrief (35 min)**  
  - (15 min) **Reflection:** Ask:  
    - "Why couldn’t we agree on a stable price for Game 1?"  
    - "What happened when we pooled data or added trials?"  
    - "Should Game 2 *always* be priced $1 higher? Why wasn’t it?"  
  - (20 min) **Formal Reveal:**  
    - "You encountered the **Pasadena game**."  
    - **Conditional convergence:**  
      - Expected value series: \( \frac{2}{1} - \frac{4}{2} + \frac{8}{3} - \frac{16}{4} + \cdots \)  
      - Converges *only* if terms stay in order → **undefined expectation**.  
      - Link: Your running averages jumped wildly (Stage 2) due to rare extreme payoffs (e.g., *n*=11).  
    - **Riemann rearrangement theorem:**  
      - Math result (no simulation): Reordering terms makes the series sum to *any real number*.  
      - Link: Your market prices were all over the place because no "true" price exists.  
    - **Finite vs. infinite:**  
      - Sample averages (your trials) are stable *until* a rare event hits (like our seeded *n*=10).  
      - But the *expectation* requires infinite trials → diverges.  
    - **Game 2 paradox:**  
      - Every outcome dominates Game 1 by 1, so if Game 1 "= V", Game 2 "= V+1".  
      - But rearrangement lets V be *anything* → logical contradiction.  

  ---

  ### Honest Notes  
  **Predictable Problems & Fixes:**  
  1. **Missing large payoffs:** In 120 trials, P(*n*≥10) ≈ 0.0002. Without outliers, averages look deceptively stable/negative.  
     - **Fix:** Pre-seed extreme outcomes (e.g., *n*=10, *n*=11) in Stage 2. Explicitly discuss their impact: "One big win/loss shattered your averages."  
  2. **Market noise:** Students may anchor to early averages or arbitrary prices.  
     - **Fix:** Contrast individual prices (Stage 1) with pooled data (Stage 2) to highlight disagreement.  

  **What the Activity Can’t Show (Requires Debrief):**  
  - **Rearrangement theorem:** No finite trials can show series reordering effects. *Debrief:* "Math proves you can make the ‘value’ be $100$, $-50$, or $\pi$ by reordering terms."  
  - **True divergence:** The running average *will* converge with finite trials (law of large numbers), but the *limit* doesn’t exist. *Debrief:* "Your averages stabilized until a rare event—but in infinity, rare events *always* occur, causing endless jumps."  
  - **Linearity breakdown:** Students might accept Game 2 ≡ Game 1 + 1. *Debrief:* "If both have undefined expectations, adding 1 doesn’t ‘fix’ it—Game 2 is equally pathological."  

  **Logistics:**  
  - **Materials:** Coins, tally sheets, play money, board.  
  - **Seeded outliers:** Pre-compute *n*=10 (*+102.4*) and *n*=11 (*−186.18*) for Stage 2.  
  - **Arbitrage:** In Stage 3, if Game 1 trades at $P$ and Game 2 at $Q$, ask: "Can you lock in profit if $Q − P < 1$? What’s the risk?"
