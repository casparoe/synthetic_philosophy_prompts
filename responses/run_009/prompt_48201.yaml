  We are designing an in-class activity for the Pasadena game without naming it upfront. The activity should have students play the game, try to price it, trade, and then introduce a second game that dominates the first by 1 point in every outcome. The goal is for students to experience the instability of the expected value.

  Game Rules (for handout):
  - We flip a fair coin until it lands heads.
  - If the first head occurs on flip n, then:
      - If n is odd, you win +2^n / n points.
      - If n is even, you lose 2^n / n points (i.e., you get -2^n / n).

  Activity Plan (90 minutes):

  Stage 1: Introduction and Setup (10 minutes)
  - Hand out the rules and explain the game without mentioning expectation.
  - Divide the class into 12 individuals or pairs (if pairs, each pair is one participant).
  - Distribute: each student gets a coin (or use a shared coin), a tally sheet, and play money (say $100 in play money for trading later).

  Stage 2: Simulating the Game (15 minutes)
  - Each student flips a coin until heads and records the outcome. They do this 10 times (10 trials). 
  - For each trial, record n (the flip number of the first head) and the payoff.
  - They compute their average payoff over 10 trials.

  Stage 3: Initial Pricing and Trading (15 minutes)
  - On the board, create a table to record each student's average payoff from their 10 trials.
  - Ask: "What would you pay to play this game? Write down your personal price (in play money)."
  - Then, hold a market: students can buy and sell the right to play the game (one play) at prices they agree on. They can use their play money. Record the trading prices on the board.

  Stage 4: Aggregating Data and Running Averages (15 minutes)
  - Collect all 120 trials (12 students * 10 trials) and compute the overall average payoff. Write it on the board.
  - Then, simulate a long run: flip a coin in front of the class until heads (one trial) and record the result. Add it to the total and update the running average (on the board). Do 10 more class trials (each by a different student, one flip at a time). Update the running average after each trial. Note: we want to see the average jump around.

  Stage 5: Introducing the Dominating Game (15 minutes)
  - Introduce a second game: same as the first, but every payoff is increased by exactly 1 point. (So if the first game pays X, the second pays X+1.) Write the rules.
  - Without explaining, ask the students to price the second game and then to trade both games (so we have two markets). They can also trade between the two (e.g., buy the first and sell the second). 
  - Encourage arbitrage: if someone prices the first at P and the second at Q, and Q-P is not 1, then there's an opportunity.

