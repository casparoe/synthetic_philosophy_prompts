answer: |-
  ## How Geology Rewrote the Map: Continental Drift vs. Kuhn's Playbook

  **1. The episode, in brief (145 words)**

  In 1912, German meteorologist Alfred Wegener proposed continents had moved. He cited matching coastlines, fossil distributions, and rock formations across oceans. Mainstream geologists, particularly Americans, fiercely rejected it. They saw continents as fixed. At a pivotal 1926 symposium, critics mocked "continental drift" as physically absurd – continents couldn't "plough" through solid ocean crust. The idea languished. Then, in the 1950s-60s, oceanographic research revealed the mid-ocean ridge system, seafloor spreading, and symmetrical magnetic "stripes" frozen into the ocean floor. This proved the crust was moving laterally, carried on a mobile mantle. Evidence mounted explosively. By the late 1960s, nearly the entire geological community had embraced plate tectonics – continents weren't drifting *through* oceans, but *with* them. The field transformed within a decade.

  **2. Mapping it onto Kuhn (395 words)**

  Kuhn’s framework *mostly* fits the continental drift revolution snugly.

  *   **The Community & Paradigm:** The relevant scientific community was academic geology, centred in Europe and North America, with strong US influence. Their paradigm wasn't a single grand theory, but a *framework*: continents and oceans were fundamentally fixed and permanent ("fixism"). Mountain building was explained by Earth cooling and contracting (like a wrinkling apple), or vertical land movements ("diapirism"). Crucially, **"normal science"** involved meticulous fieldwork, stratigraphy, and palaeontology focused on *local or regional* phenomena. Global, causal speculation was seen as unscientific.
  *   **The Anomaly & Crisis:** Wegener presented glaring anomalies: the jigsaw-fit continents, identical fossils on separated landmasses, matching geological belts. Fixist explanations – like vanished land bridges – became increasingly strained and ad hoc. By the 1950s, new data like puzzling ocean floor topography and palaeomagnetism on land added pressure. The paradigm couldn't solve these puzzles satisfactorily – a textbook Kuhnian **crisis**.
  *   **The Revolution & Conversion:** The revolution wasn't just drift revived; it was plate tectonics – a new paradigm explaining *how* the Earth's surface moves via rigid plates on a convecting mantle. The conversion was remarkably rapid and wholesale in the mid-to-late 1960s. Older geologists famously retrained or retired. New journals and textbooks emerged. This sudden flip, driven by overwhelming new evidence (seafloor spreading, magnetic stripes) rendering the old view untenable, perfectly embodies Kuhn’s **paradigm shift**.

  **3. Where the mapping strains (345 words)**

  While the broad shape fits, forcing continental drift into Kuhn’s box reveals some awkward bulges:

  1.  **Paradigm as Methodological Orthodoxy:** Kuhn primarily envisioned paradigms as *theoretical frameworks* guiding puzzle-solving. Here, a core part of the reigning paradigm was a **methodological dogma**: legitimate geology was local, empirical fieldwork. Global, causal hypotheses like drift were dismissed *as a category*, not because a rival theory was better. Kuhn's model struggles to fully capture a paradigm where defining "legitimate questions" is a core tenet *itself*, rather than just the framework for answering them. The resistance wasn't *just* defending contractionism; it was defending a way of *doing* science.
  2.  **Premature Incommensurability:** Kuhn argued revolutionary paradigms are "incommensurable" – the same words mean different things. Here, "continental drift" itself was incommensurable *decades before* the revolution. For critics pre-1960s, it *meant* continents plowing implausibly through oceanic crust. For proponents post-evidence, it *meant* continents riding *on* moving crustal plates. The 1920s arguments weren't just wrong; they were genuinely talking past each other due to this fundamental conceptual disconnect, a mini-incommensurability happening *during* the crisis phase, not just after the shift.
  3.  **The Outsider Conundrum:** Kuhn's revolution springs from a crisis *within* the community, breeding internal dissent. Here, the critical breakthrough came **twice from outsiders**: Wegener (meteorologist) initiated it, and the revolution was clinched by **oceanographers** and geophysicists towing magnetometers, not traditional land geologists. Their "normal science" wasn't failing; they were exploring new frontiers *outside* the land geologists' paradigm and crisis. The revolution was delivered *to* the geological community by specialists who never fully shared its core training or methodological hang-ups. This challenges Kuhn's inward-looking narrative of crisis-driven revolution.

  **4. What it says back (245 words)**

  The continental drift revolution is **both a powerful confirmation *and* a significant anomaly** for Kuhn, revealing nuances his model didn't fully anticipate.

  It *confirms* the core dynamics: the existence of a dominant paradigm (fixism), the accumulation of anomalies leading to crisis (fossils, fits, palaeomagnetism), the radical nature of the shift (plate tectonics), the rapid conversion (1960s flip), and the incommensurability *after* the shift. It's a poster child for paradigm shifts.

  However, it **strains** the model in key ways Kuhn likely didn't fully foresee. The intense focus on methodological orthodoxy as a *defining* part of the paradigm, the occurrence of deep conceptual incommensurability *during* the pre-revolutionary debate (not just post-shift), and the **decisive role of external specialists** delivering the solution bypassing the community's internal crisis-resolution process – these are significant wrinkles. It highlights how a revolution can be *ignited* and *fuelled* from outside the core community experiencing the crisis, something Kuhn underplayed. It’s less an anomaly that breaks the model and more a complex case demanding a richer, less insular interpretation of how paradigms function and how revolutions unfold.

  **5. What I'd tell my editor (95 words)**

  "Kuhn's 'paradigm shift' perfectly describes geology's 1960s U-turn *once* the ocean evidence hit, but the decades-long rejection of drift exposes his blind spots: geologists weren't just defending a theory, they were defending a *method* that banned big questions, and the revolution was ultimately delivered by ocean-going outsiders, not geologists wrestling with their own failing science. It confirms the shift happened, but shows revolutions aren't always homegrown."
