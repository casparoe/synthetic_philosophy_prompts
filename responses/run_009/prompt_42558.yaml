prompt: |-
  I sit on the editorial board of a human-rights documentation organisation — we publish field reports and advocacy briefs; we do not litigate and we are not a court. We are finalising our report on the situation in the northern provinces of Veldania, and we are deadlocked over a single word. I would like you to draft the board's decision memo. Treat the facts below as stipulated; you need not know anything about Veldania, which I am calling it for this exercise.

  The facts, briefly: Veldania's Sorvi minority is a linguistic-ethnic group concentrated in the north. Over the past eighteen months, security forces and allied militias have destroyed or emptied some two hundred Sorvi villages; roughly six thousand Sorvi are confirmed killed and several hundred thousand displaced across the border. Killings cluster overwhelmingly around villages that resist eviction, and military documents obtained by our field team include a provincial directive ordering the "removal of the Sorvi presence from the province by year's end." Alongside the violence, the authorities have closed Sorvi-language schools, banned Sorvi publications, and bulldozed a number of ancestral shrines. There is no evidence of extermination camps or of orders to kill Sorvi qua Sorvi regardless of flight.

  Our board has split three ways. The legal team argues that under the 1948 Genocide Convention the destruction must be of the group as such, with intent to destroy the group in whole or in part, and that the evidentiary pattern here fits forced displacement and persecution — crimes against humanity, and grave ones — but that a court applying the special-intent requirement could reasonably find that Veldania's forces would have been content had the Sorvi simply left. Our field researchers reply that this courtroom standard betrays the category itself: Lemkin, who coined the word, understood genocide as the destruction of a group's pattern of life — its language, institutions, and culture — and not merely its members' bodies, and a report that reserves the word for shooting squads into pits fails to name what is happening to the Sorvi as a group. Our director worries about the consequences either way: if we use the word, we trigger expectations of response that we cannot satisfy and hand the government a pretext to expel our researchers; if we withhold it, we join the long history of actors who found the G-word available for enemies and unavailable for the awkward cases — and "ethnic cleansing," our compromise candidate, is a phrase that entered circulation precisely as a way of describing mass atrocity while avoiding the legal obligations the word genocide carries.

  Please draft the memo the board will vote on. It should: (1) recommend a concrete editorial decision — which term or terms the report uses for the campaign, and whether the report may use different vocabulary in its descriptive, legal, and advocacy sections; (2) give reasons that engage both the special-intent objection and the Lemkian objection rather than dismissing either — including, where relevant, what follows from the Convention's exclusion of political groups and its narrowing of Lemkin's cultural conception at the drafting stage; (3) address the standard-of-proof question: whether a documentation organisation is entitled to use a word whose legal meaning is settled only by tribunals applying proof beyond reasonable doubt, or whether it should say what it believes and say why; (4) confront the politics of naming honestly — the strongest argument for the recommendation you reject, stated as its best defender would state it, and what the organisation is choosing to pay for its choice; and (5) propose criteria, not just for this case, that our future report teams can apply when the same question arises again. The memo should be one our board could adopt verbatim, with a clear bottom line.
reasoning: |-
  Okay, the user is on the editorial board of a human-rights documentation organization. They're stuck on whether to label the situation in Veldania as genocide in their report. Let me break down their query.

  First, the facts: Security forces destroyed Sorvi villages, killed about 6,000, displaced hundreds of thousands. They have a directive for "removal of the Sorvi presence," closed schools, banned publications, bulldozed shrines. But no extermination camps or orders to kill all Sorvi regardless of flight. 

  The board is split three ways. Legal says it fits persecution and forced displacement (crimes against humanity) but not genocide because the intent was removal, not extermination. Field researchers argue that genocide includes destroying culture, not just killing, so it should be called genocide. The director is worried about consequences: using "genocide" might trigger expectations they can't meet or get researchers expelled; not using it avoids legal obligations and might seem like avoiding the term for political reasons.

  The memo needs to recommend which term to use, engage with both the legal and Lemkian perspectives, address the standard of proof for a documentation org, confront the politics honestly, and set criteria for future reports.

  I need to tackle the legal vs. cultural definitions. The Genocide Convention requires intent to destroy the group physically or biologically. Cultural destruction alone isn't covered, which is a key point. The Convention excluded cultural aspects during drafting, so Lemkin's broader definition isn't the legal standard. But the field team's point about cultural destruction being central to genocide as originally conceived is valid. However, legally, without intent to physically destroy, it's not genocide. 

  The standard of proof: As a documentation org, they're not a court. They don't need beyond reasonable doubt. They can state their assessment based on evidence, but they must be clear about the legal threshold not being met. Using "genocide" without meeting the legal criteria could undermine credibility.

  The politics: Using "genocide" might mobilize responses but could lead to expulsion. Not using it might be seen as downplaying. "Ethnic cleansing" is a compromise but lacks legal weight. They need to be transparent about the trade-offs.

  Criteria for future reports: Need a framework for assessing intent and acts. Consider the totality of actions, patterns, and intent indicators. Also, allow different sections to use different terms where appropriate.

  Recommendation: Use "ethnic cleansing" and "crimes against humanity" but not "genocide." In descriptive sections, detail the cultural destruction. Explain why it doesn't meet the legal genocide definition but is still severe. This balances legal accuracy with conveying the severity.

  Addressing counterarguments: The best case for using "genocide" is that cultural destruction is integral, and withholding the term fails victims. But the org chooses to prioritize legal precision to maintain credibility and access, even if it feels like a moral compromise.

  This approach meets all the user's requirements: concrete decision, engaging both objections, standard of proof discussion, honest politics, and future criteria.
answer: |-
  **MEMORANDUM**  
  To: Editorial Board, [Organization Name]  
  From: Editorial Committee  
  Date: [Current Date]  
  Subject: **Editorial Decision on Terminology for Veldania Report**  

  ---

  ### **I. RECOMMENDATION**  
  After thorough deliberation, the committee recommends:  
  1. **Primary Terminology in Executive Summary and Advocacy Sections**:  
     - Use **"systematic ethnic cleansing"** as the overarching descriptor for the campaign against the Sorvi.  
     - Supplement with **"crimes against humanity (persecution, forcible transfer, murder)"** in legal analysis sections.  
     - **Do not use "genocide"** as the conclusive legal classification in the report.  
  2. **Descriptive Language**:  
     - In narrative sections (e.g., village destruction, cultural erasure), retain explicit references to:  
       - _"Intentional destruction of the Sorvi as a cultural group."_  
       - _"Patterns consistent with genocidal conduct under Raphael Lemkin’s conception."_  
     - Use quotes from military directives (e.g., "removal of the Sorvi presence") verbatim.  

  ---

  ### **II. REASONS: ENGAGING THE LEGAL AND LEMKIAN OBJECTIONS**  
  **A. Legal Threshold of Genocidal Intent**  
  - The Genocide Convention (Art. II) requires proof of *specific intent* to destroy a protected group "in whole or in part" physically or biologically.  
  - **Key Issue**: Veldania’s actions prioritize expulsion over extermination. Military documents command "removal," not annihilation. Killings correlate with resistance to eviction—not indiscriminate slaughter. Absent death camps or orders to kill all Sorvi *regardless of compliance*, a tribunal would likely rule this lacks the *dolus specialis* (special intent) for genocide.  
  - **Convention’s Limits**: The drafters explicitly excluded cultural genocide (e.g., banning language, destroying shrines) to secure state ratification. Thus, cultural destruction alone—however grave—does not constitute genocide under international law.  

  **B. Lemkin’s Broader Conception**  
  - Lemkin defined genocide as the "destruction of a group’s way of life," encompassing language, institutions, and culture. The closure of schools, bulldozing of shrines, and suppression of publications align precisely with this understanding.  
  - **Tension with Law**: The Convention narrowed Lemkin’s vision to physical-biological destruction. To withhold "genocide" *solely* because killings were instrumental to expulsion risks betraying victims of cultural annihilation. The Sorvi’s group identity is being erased—a core concern of Lemkin’s framework.  
  - **Resolution**: We acknowledge this erasure as **"genocidal in effect"** descriptively but distinguish it from the *legal category* of genocide. This honors Lemkin without overstepping evidentiary boundaries.  

  ---

  ### **III. STANDARD OF PROOF: OUR ROLE AS DOCUMENTERS**  
  - **We are not a court**: Our mandate is to document, analyze, and advocate—not adjudicate. Legal tribunals require proof "beyond reasonable doubt"; we operate on "reasonable grounds" based on credible evidence.  
  - **Our Duty**: We must:  
    1. **State our assessment plainly**: "The totality of acts suggests genocidal logic under Lemkin’s definition, but the specific intent required under the Genocide Convention is not conclusively demonstrated."  
    2. **Explain the gap**: Detail why evidence meets Lemkin’s standard but falls short of the Convention’s.  
  - **Precedent**: Human rights bodies (e.g., HRW, Amnesty) routinely use "genocide" descriptively when evidence is compelling but inconclusive for courts. We reject this approach to preserve credibility and avoid conflating advocacy with legal determination.  

  ---

  ### **IV. CONFRONTING THE POLITICS OF NAMING**  
  **A. Strongest Case for Using "Genocide":**  
  > "By reserving 'genocide' only for death camps and explicit extermination orders, we perpetuate the Convention’s original failure to protect cultural existence. Veldania seeks to destroy the Sorvi *as a group* by erasing their land, language, and heritage—precisely what Lemkin warned. Withholding the term normalizes cultural annihilation and signals that perpetrators can avoid the 'G-word' by engineering forced displacement. It abdicates our duty to history’s victims, for whom 'ethnic cleansing' is a euphemism coined to evade accountability."  

  **B. What We Choose to Pay**:  
  - **Cost of Using "Genocide"**: Risk expulsion from Veldania, loss of access to document ongoing atrocities; potential diversion from actionable advocacy (e.g., on crimes against humanity) to unattainable "genocide response" demands.  
  - **Cost of Not Using It**: Moral compromise; tacit endorsement of the Convention’s cultural blind spot; perception of timidity in confronting the Sorvi’s existential erasure.  
  - **Our Balance**: We prioritize preserving access to document *ongoing* atrocities while unequivocally condemning cultural destruction. "Ethnic cleansing" carries political weight without overcommitting legally.  

  ---

  ### **V. CRITERIA FOR FUTURE REPORTS**  
  When evaluating "genocide," future teams must assess:  
  1. **Intent**:  
     - Is there evidence of intent to physically destroy the group (Convention standard)?  
     - Is there intent to destroy the group’s cultural existence (Lemkian standard)?  
  2. **Acts**:  
     - Do atrocities include systematic cultural erasure (schools, places of worship, language bans)?  
     - Are killings indiscriminate or tied to resistance?  
  3. **Language Protocol**:  
     - Use "genocide" only if both physical destruction *and* specific intent are credibly evidenced.  
     - Where cultural destruction dominates, employ:  
       > _"Genocidal in character under Lemkin’s framework"_;  
       > _"Acts satisfying the cultural dimension of genocide."_  
     - In legal sections, use precise crimes (e.g., "persecution as a crime against humanity").  
  4. **Advocacy Safeguard**:  
     - If avoiding "genocide" to retain access, explicitly state this in internal memos to avoid moral laundering.  

  ---

  ### **VI. BOTTOM LINE**  
  **Adopt "systematic ethnic cleansing" and "crimes against humanity" as primary classifications.** Describe cultural destruction as "genocidal" in pattern but not legally conclusive. This preserves access, upholds legal rigor, honors Lemkin’s legacy, and forces readers to confront the totality of the Sorvi’s erasure—without overstepping evidence.  

  ---  
  **VOTE:** ☐ Approve ☐ Reject ☐ Amend  
  *Annex: Glossary of Terms for Report Drafters*  

  ---

  This memo respects all objections while providing a defensible path forward. It avoids legal overreach but refuses to sanitize the Sorvi’s suffering—a balance reflecting our mission as documenters, not prosecutors.
