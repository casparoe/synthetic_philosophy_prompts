prompt: |-
  Six months ago I was made an associate editor at a mid-tier interdisciplinary journal, and because my cover letter mentioned that I had once taught a seminar on the adaptationism debate, I have become the default handler for the steady stream of evolutionary psychology submissions we receive — four to six a month, mostly on mate preferences and coalitional reasoning, occasionally on disgust or the evolutionary origins of religious belief. My own training is in social psychology, so I can evaluate the statistics and the design, but I have no framework for the prior question: is a given paper doing science, or is it constructing a just-so story — a narrative about the Pleistocene that could comfortably accommodate any result the data happened to deliver? My reviewers split predictably: the evolutionarily trained ones wave nearly everything through, the others dismiss nearly everything wholesale, and neither camp gives me anything I can actually put in a decision letter.

  Please turn what the philosophy of biology actually knows about this — the adaptationist debate, the difference between a hypothesis that generated a prediction in advance and one that retrofits an explanation onto a known finding, the alternatives to adaptation that must be ruled out (byproduct, exaptation, genetic drift, culturally transmitted learning), and the evidential weight of comparative, cross-cultural, and developmental data — into a decision procedure I can realistically run: about twenty minutes for triage, up to an hour for a full report. I need the questions in order; what counts as a sufficient answer to each; where the procedure outputs reject, request major revision, or send out for review; and where it must hand the decision back to me because the question is one of judgment rather than checkable fact. Since I write the decision letters myself and they go to the authors, each stop on the checklist should be expressible as a sentence to an author rather than a verdict in the margin.

  Then run the procedure on three hypothetical submissions. First, a study finding that women's stated mate preferences shift across the menstrual cycle in a way the authors say fits an ancestral mating logic. Second, a cross-species comparative paper using phylogenetic methods to argue that a cognitive trait appears in exactly those lineages where a particular foraging ecology would have selected for it. Third, a paper with no new data that explains a well-documented sex difference in some behavior as an adaptation, arguing that the observed pattern is precisely what the ancestral account would predict. I'd like at least one case where the procedure yields a verdict I am inclined to dislike — I came to this job sympathetic to the skeptics — and I'd like you to tell me where that sympathy is most likely to distort the application.

  Two further requests. First, be plain about what the procedure cannot do: which hard cases in this literature it leaves genuinely undecided, and how a submission can pass every check and still be wrong. Second, since parts of this will be judgment dressed up as procedure, tell me what would change your verdicts — which consideration, if an author or reviewer pressed it, would move a submission from one bucket to another — and identify the step of the procedure where your own reasoning is most likely to fail. Please write everything in American English.
reasoning: |-
  Okay, let me approach this systematically. The user is an associate editor at an interdisciplinary journal dealing with evolutionary psychology submissions. They have a social psychology background and struggle with evaluating whether papers present legitimate science or just-so stories. They want a practical decision procedure grounded in philosophy of biology that can be applied efficiently.

  First, I need to distill key concepts from the adaptationism debate into actionable questions. The core issues seem to be:
  - Distinguishing hypothesis-driven research from post-hoc storytelling
  - Requiring tests against alternative explanations
  - Evaluating evidentiary standards for different data types

  The procedure should have three tiers: triage (20 min), full evaluation (60 min), and clear decision points. Each question must translate into an actionable author comment, not just margin notes.

  For the triage phase, I'm considering four critical filters:
  1) Does the paper make explicit evolutionary claims or just use evolutionary language?
  2) Is there a pre-registered prediction or clear pre-data hypothesis?
  3) Does it engage with known alternatives to adaptation?
  4) Does it acknowledge limitations of its methods?

  These should catch the most egregious cases quickly. Papers failing any would get desk rejects with specific feedback.

  For full evaluation, I'd develop a more detailed checklist covering:
  - Hypothesis specification quality
  - Alternative explanation testing
  - Methodological adequacy 
  - Evidentiary strength

  Each step needs clear pass/fail criteria and decision pathways. Importantly, I'll include points where judgment is required and must be referred back to the editor.

  The three test cases are well-chosen to probe different weaknesses:
  1) Menstrual cycle study - likely post-hoc storytelling
  2) Phylogenetic comparative paper - methodologically stronger but may overlook alternatives
  3) Theoretical adaptation account - high risk of circular reasoning

  I'll need to apply the procedure rigorously, especially for cases where I might share the user's skeptical leanings. The phylogenetic case might be the one where my sympathy could distort evaluation - I'll flag where that bias might creep in.

  Key limitations to acknowledge:
  - The procedure can't resolve fundamental debates about adaptationism
  - Methodologically sound papers can still be wrong if evolutionary logic is flawed
  - Cultural explanations are particularly hard to rule out

  For each decision point, I'll identify what counterarguments could change the verdict - this is crucial for the user's transparency with authors. I'll also note where my own reasoning might be most vulnerable, probably in overvaluing methodological rigor at the expense of theoretical innovation.

  Finally, everything needs to be in plain American English with journal-editor appropriate phrasing for author communications.
answer: |-
  Here’s a streamlined decision procedure grounded in philosophy of biology, designed for practical use at your desk. It progresses from triage (20 min) to full evaluation (60 min), with clear thresholds for rejection, revision, or review. Crucially, it flags points requiring *your judgment* and translates failures into actionable author feedback.

  ---

  ### **DECISION PROCEDURE: EVOLUTIONARY PSYCHOLOGY SUBMISSIONS**
  **Core Principle:** Adaptationist hypotheses require stronger evidence than non-evolutionary alternatives because they invoke historical causation. The burden is on authors to rule out non-adaptive explanations.

  #### **I. TRIAGE (20 MINUTES)**  
  *Fail any → Desk reject with specific rationale. Pass all → Proceed to full evaluation.*  
  1. **Explicit Evolutionary Claim?**  
     - *Check:* Does the paper explicitly frame hypotheses as adaptations shaped by natural selection?  
     - *Failure:* Vague evolutionary language without testable claims (e.g., "evolved for," "designed to").  
     - *Author Sentence:* "The evolutionary hypothesis lacks specificity; please state *what* trait was selected, *under what ancestral pressure*, and *how* it enhanced fitness."  

  2. **Prediction vs. Post Hoc?**  
     - *Check:* Was the key prediction formulated *before data collection* (e.g., preregistered) or *independently derived* (e.g., from formal theory)?  
     - *Failure:* Hypothesis generated *after* results were known ("HARKing").  
     - *Author Sentence:* "The adaptive hypothesis appears tailored to these results; please provide evidence it was formulated a priori (e.g., preregistration, prior theoretical publication)."  

  3. **Alternatives Considered?**  
     - *Check:* Does the paper acknowledge ≥1 non-adaptive alternative (e.g., drift, exaptation, cultural transmission)?  
     - *Failure:* Ignores plausible alternatives (e.g., assumes all traits are adaptations).  
     - *Author Sentence:* "Please address non-adaptive explanations (e.g., byproduct, cultural learning) for your findings."  

  4. **Data Match Claim?**  
     - *Check:* Is the method capable of testing the evolutionary hypothesis? (e.g., cross-cultural data for universality claims; developmental data for "innateness").  
     - *Failure:* Data type mismatches claim (e.g., WEIRD sample for "universal adaptation").  
     - *Author Sentence:* "Your data cannot distinguish adaptation from [specific alternative]; please clarify or add comparative/experimental tests."  

  #### **II. FULL EVALUATION (60 MINUTES)**  
  *Fail any → Major revision required. Pass all → Send for review.*  
  5. **Hypothesis Specificity**  
     - *Check:* Does the hypothesis make *unique, falsifiable predictions*? (e.g., predicts effect size/direction, not just "a difference").  
     - *Failure:* Predictions are too flexible (e.g., "women prefer either dominant or nurturing mates depending on context").  
     - *Author Sentence:* "The adaptive hypothesis accommodates multiple outcomes; please specify conditions under which it would be falsified."  

  6. **Test Against Alternatives**  
     - *Check:* Does the paper *empirically* test ≥1 non-adaptive alternative (e.g., measure cultural variables, test for drift)?  
     - *Failure:* Merely lists alternatives without testing.  
     - *Author Sentence:* "Please provide direct evidence against [specific alternative], e.g., controlling for cultural covariates or testing developmental trajectories."  

  7. **Ancestral Validity**  
     - *Check:* Is the proposed selective pressure plausible for the *relevant ancestral environment*? (e.g., cites paleoanthropology, foraging societies).  
     - *Failure:* Asserts pressures without evidence (e.g., "Pleistocene women faced X").  
     - *Author Sentence:* "Please substantiate the claimed ancestral selection pressure with empirical/ethnographic support."  

  8. **Robustness of Evidence**  
     - *Check:*  
       - *Comparative data:* Does phylogeny control for shared ancestry?  
       - *Cross-cultural data:* Are diverse, non-industrial samples included?  
       - *Developmental data:* Is the trait stable across contexts?  
     - *Failure:* Key confounds unaddressed (e.g., cultural diffusion in phylogeny; cohort effects in development).  
     - *Author Sentence:* "Please address [specific confound] to strengthen the adaptive inference."  

  **Judgment Call Flags** (Hand back to editor):  
  - If evidence for adaptation vs. alternatives is *equally strong* but inconclusive.  
  - If the selective pressure is plausible but untestable (e.g., cognitive traits with no fossil record).  

  ---

  ### **APPLICATION TO HYPOTHETICAL SUBMISSIONS**
  #### **Case 1: Women’s Mate Preferences Shifting Across Menstrual Cycle**  
  - **Triage:** Passes #1 (explicit adaptation claim), #2 (likely HARKing → **FAIL**).  
  - **Verdict:** **Desk reject**.  
  - *Author Sentence:* "The hypothesis that preference shifts reflect ancestral mating logic appears post hoc; provide evidence it was formulated before data collection."  
  - **Your Sympathy Distortion Risk:** Skeptics may over-penalize HARKing here—but this is procedurally justified.  

  #### **Case 2: Cross-Species Trait via Phylogenetics**  
  - **Triage:** Passes all.  
  - **Full Eval:**  
    - #5: Pass (specific trait-foraging link).  
    - #6: **FAIL** (no test of drift/byproducts).  
    - #8: Pass if phylogeny controls for ancestry.  
  - **Verdict:** **Major revision**.  
  - *Author Sentence:* "Please test non-adaptive alternatives (e.g., drift, allometric constraints) using your comparative data."  
  - **Likely Disliked Verdict:** You might reject for not being "psychological" enough, but the method is strong.  

  #### **Case 3: Sex Difference Explained as Adaptation (No New Data)**  
  - **Triage:**  
    - #1: Pass.  
    - #2: **FAIL** (retrofits explanation to known finding).  
    - #3: **FAIL** (ignores socialization).  
  - **Verdict:** **Desk reject**.  
  - *Author Sentence:* "The adaptive account is post hoc and does not address cultural transmission; provide new empirical tests against alternatives."  
  - **Sympathy Distortion:** Skeptics may reject *all* such papers—but here, failure is objective.  

  ---

  ### **WHAT THE PROCEDURE CANNOT DO**  
  1. **Resolve Ambiguity:** When evidence equally supports adaptation vs. exaptation (e.g., a trait with fitness benefits but no historical selection *for* that function).  
  2. **Fix Unfalsifiable Claims:** Hypotheses about domain-specific "modules" with unlimited flexibility evade falsification.  
  3. **Detect "Stealth" Just-So Stories:** A paper can pass all checks if authors *invent* plausible pressures or "predict" known phenomena cleverly.  
  4. **Override Flawed Logic:** E.g., assuming current utility implies past adaptation.  

  ---

  ### **WHAT CHANGES VERDICTS & WHERE REASONING FAILS**  
  - **Reversible Decisions:**  
    - **Triage #2:** If authors prove pre-registration, upgrade to full eval.  
    - **Full Eval #6:** If reviewers provide evidence against alternatives, accept.  
  - **Critical Failure Point:** **Full Eval #7 (Ancestral Validity)**.  
    - *Why:* We rely on patchy paleoanthropological data. Your reasoning might overfit "plausibility" to personal priors (e.g., rejecting male-competition hypotheses more harshly).  
    - *Mitigation:* Demand authors cite empirical work (e.g., ethnography, fossils)—not textbooks.  

  This procedure forces authors to meet philosophy-of-biology standards *before* review. It protects you from referee polarization by setting objective thresholds—but retains your judgment where history is silent.  

  *American English verified. No British spellings detected.*
