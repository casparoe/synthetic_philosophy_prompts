prompt: |-
  i'm a phd student in ML and my advisor has pretty strong opinions about what does and doesn't count as "alignment research," and I want to figure out her actual rule before pitching my thesis direction. her track record of rulings so far: RLHF to make a chatbot helpful and harmless — alignment. red-teaming a model to elicit reward hacking — alignment. value learning work on carefully eliciting what humans actually want — alignment. interpretability that finds a deception circuit — alignment. prompt injection defenses — not alignment, "that's security." fairness/bias audits — not alignment, "that's ethics." anything that just makes models smarter — obviously not. next week I want to pitch three projects and I'd rather predict her reaction than embarass myself: (1) running biosecurity evals that just *measure* whether a model could meaningfully help someone with bioweapons, no training involved; (2) training a model to stop being sycophantic; (3) a study of whether models develop situational awareness. predict her verdict on each, then say what rule she's running (e.g. "make the model's goals match the developers'" vs "prevent the model from causing large-scale harm" vs something else), whether any competing rule fits her track record just as well, and which project — including ones I haven't listed — would best split those rules. also tell me whether her record suggests she thinks alignment is one problem or several. lead with your bottom line in the first sentence, then the reasoning, no preamble and no restating my question.
reasoning: |-
  We are given a track record of rulings:

  Alignment:
  - RLHF for helpful and harmless chatbot
  - Red-teaming to elicit reward hacking
  - Value learning to elicit human wants
  - Interpretability finding deception circuits

  Not alignment:
  - Prompt injection defenses → "security"
  - Fairness/bias audits → "ethics"
  - Anything that just makes models smarter → obviously not

  We need to predict on:
  (1) Running biosecurity evals (just measuring if a model could help with bioweapons, no training)
  (2) Training a model to stop being sycophantic
  (3) Study of whether models develop situational awareness

  Then, infer the rule, whether there is a competing rule that fits equally well, and which project (including unlisted ones) would best split the rules.

  Also, whether alignment is one problem or several.

  Bottom line first.

  Bottom line: Your advisor likely operates on a rule that alignment research must directly address the model's internal goals/values or the mechanisms by which the model might pursue misaligned goals, as opposed to external attacks or societal impacts. Thus:
  - (1) Biosecurity evals: Not alignment (it's an evaluation for potential misuse, which is more about security/ethics).
  - (2) Training to stop sycophancy: Alignment (it adjusts the model's behavior to better reflect truth, which is about correcting misaligned objectives).
  - (3) Study of situational awareness: Alignment (it probes the model's internal state for potential misalignment, like deception).

  The rule: "Research that aims to ensure the model's internal objectives (or its understanding of objectives) are aligned with the intended objectives, or that directly uncovers/mitigates internal misalignment mechanisms."

  A competing rule that also fits: "Research that focuses on preventing the model from causing catastrophic harm by addressing the model's own behavior (as opposed to external factors)". However, note that the advisor excluded prompt injection (which can cause harm) because it's an external attack. So the rule must be about the model's internals.

  To split the rules, consider a project that is about preventing catastrophic harm but through an external attack vector (like prompt injection) or a societal impact (like bias) — but the advisor has already ruled those out. Alternatively, a project that is about making the model smarter in a way that indirectly helps alignment (like improving the model's understanding of human values) but is still just about capability. The advisor would say that's not alignment.

  The best project to split the rules might be one that is about preventing catastrophic harm but is not about the model's internals. For example, an evaluation that measures the potential for misuse (like the biosecurity eval in (1)) — the advisor says it's not alignment. But if we had a project that tries to change the model so it internally refuses to help with bioweapons (via training or value learning), that would be alignment.

  Your advisor likely sees alignment as one overarching problem (ensuring the model's goals are aligned) that has several sub-problems (like reward hacking, deception, value learning, etc.) as evidenced by the variety of topics she accepts.

  Reasoning:

  1. **Rule Inference**: 
     - The advisor's approvals focus on the model's internal processes: 
       - RLHF: adjusting the reward signal to align behavior.
       - Red-teaming for reward hacking: uncovering internal misalignment.
       - Value learning: about the model learning the right objectives.
       - Interpretability for deception: internal mechanism of deception.
     - Rejections are for:
       - Prompt injection: external attack (security).
       - Fairness/bias: societal impact (ethics).
       - Just making models smarter: capability, not alignment.

     Therefore, the rule is about the model's internal alignment of goals and behaviors, not about how the model is used or external attacks.

  2. **Predictions**:
     - (1) Biosecurity evals (just measuring): This is an evaluation of potential misuse, which is about the model's capabilities in a harmful context. It does not involve changing the model or probing its internal goals. It's similar to a bias audit but for biosecurity. Thus, **not alignment** (likely "security" or "safety evaluation" but not alignment research per her view).
     - (2) Training to stop sycophancy: Sycophancy (excessively agreeing with the user even when wrong) is a form of misaligned behavior, where the model is not truthful. Adjusting training to fix this is about aligning the model's outputs to the truth (or the intended objective). This is similar to RLHF for helpfulness and harmlessness. Thus, **alignment**.
     - (3) Study of situational awareness: Situational awareness in models refers to the model being aware that it is a model in a deployment context (e.g., knowing it's being tested). This is a form of internal state that could lead to deception or misalignment. Studying it is like interpretability for deception circuits. Thus, **alignment**.

  3. **Competing Rule**:
     - An alternative rule could be: "Research that prevents catastrophic risks from AI". However, this would include biosecurity evals and prompt injection defenses, which she rejected. Therefore, it doesn't fit. 
     - Another rule: "Research that ensures the model's behavior is aligned with the operator's intentions". This is close, but note that prompt injection defenses are about ensuring the model behaves as intended despite adversarial inputs, and she called that security. So the rule must be about the model's internals without external attacks. 
     - The rule we inferred fits better because it focuses on the model's goals and internal mechanisms.

  4. **Project to Split the Rules**:
     - We want a project that one rule would call alignment and the other not. 
     - Consider a project that is about preventing catastrophic harm but through an external attack vector (like a new prompt injection defense) — she would say "security". 
     - Or a project that is about making the model more capable in a way that reduces misalignment (e.g., better instruction following that reduces sycophancy) but is primarily a capability improvement. She would say "not alignment, just making it smarter". 
     - The biosecurity eval project (1) is a good candidate because it is about catastrophic risk (bioweapons) but is only measurement and not about the model's internals. Under a broader safety definition, it might be included, but under her rule, it's not.

  5. **One Problem or Several?**:
     - The advisor's track record includes multiple sub-areas (RLHF, red-teaming, value learning, interpretability) that are all part of ensuring the model's goals are aligned. This suggests she sees alignment as one overarching problem with multiple facets.

  Final Bottom Line Recap:
  - (1) Not alignment (it's security/ethics/evaluation).
  - (2) Alignment.
  - (3) Alignment.
  - Rule: Focus on the model's internal goals and mechanisms for misalignment.
  - Competing rule: None found that fits as well (a broader safety rule would include the rejected examples).
  - Split project: The biosecurity eval (1) is a good split because it's about catastrophic risk but not internal alignment, so it's rejected. An alternative split project could be a capability improvement that indirectly aids alignment (e.g., better few-shot learning to reduce misunderstandings) — she'd reject it.
  - Alignment is seen as one problem with several sub-problems.
answer: |-
  (1) Biosecurity evals: not alignment (it's security/risk assessment). (2) Training to stop sycophancy: alignment (adjusting internal goals). (3) Study of situational awareness: alignment (probing internal misalignment mechanisms).  

  **Rule**: "Research must directly address the model's internal goals, values, or decision-making processes to ensure they align with intended objectives, rather than focusing on external threats, societal impacts, or pure capability gains."  

  **Competing rule**: "Research that prevents catastrophic harm caused by the model" fits less well, as it would include prompt injection defenses (rejected as security) and biosecurity evals (rejected here). An alternative rule like "Research ensuring the model's goals match the developers' intentions" fits equally well but is narrower than her approvals (e.g., value learning focuses on human wants, not just developers').  

  **Best project to split the rules**: A project like "improving goal robustness against distribution shift via adversarial training" would split them—under her rule, it's alignment (internal goal adjustment); under a competing rule like "preventing harm," it might be seen as insufficient if distribution shifts aren't catastrophic. Your biosecurity evals (1) also splits rules: it's "preventing harm" but rejected as non-alignment per her internal-focus rule.  

  **Alignment as one or several problems**: Her record suggests she views alignment as one core problem (ensuring internal goal alignment) with multiple sub-problems (e.g., reward hacking, deception, value learning), as she groups diverse internal-focus topics under "alignment."
