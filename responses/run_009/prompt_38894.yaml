prompt: |-
  I've been reading up on Wikipedia's rules for history articles and can't figure out what theory of historical knowledge the whole setup is committed to.

  Concretely, the rules go like this: no original research, everything has to be verifiable by citing published sources, and for historical topics the preferred sources are secondary scholarship — books and journal articles by professional historians, ideally recent ones. Primary sources (a charter, a chronicle, an inscription) can be cited, but basically only for what they plainly say, never for your own interpretation of them. Disputes between editors get settled by consensus among whoever shows up to argue, weighted in pratice by who knows the policy manual. And famously, the standard for inclusion isn't truth, it's verifiability — a claim can be well-supported and still excluded if no reliable publication makes it.

  Here's what bugs me. On one hand this looks deeply Rankean: every claim about the past has to be traceble to a source, no freelancing, no vibes. On the other hand it's anti-Rankean in a funny way — the whole point of going back to the sources in the 19th century was to get past the received narrative, but Wikipedia forbids exactly that move. You're not allowed to read the chronicle yourself and revise the article accordingly, even if you read it carefully. An article on some medieval revolt can only ever be as good as the current state of academic publishing on that revolt, and an amateur with a genuine insight from the primary material is formally locked out of contributing it. Which makes the thing almost Herodotean instead — a compilation of what others say, except the informants are credentialed historians rather than priests and eyewitnesses. Meanwhile the preference for *recent* scholarship is its own commitment, treating the field as self-correcting over time, which not everyone in the historiography world would just accept.

  So here's what I want from you. Reconstruct the theory of historical knowledge this practice presupposes: does it only make sense on a social or institutional view, where knowing about the past just *is* deferring to the right expert community at the right time? Or could a more individualist epistemology — every reader weighs the sources for herself, Thucydides-style autopsy — license the very same rules? Which parts of the policy are underdetermined, in the sense that several rival theories of historical knowledge would be happy with them, and which parts geniunely rule something out? And do the "verifiability not truth" standard and the preference for recent scholarship sit consistently together, or do they quietly rest on different views about whether historiography converges on the truth?

  Lead with your bottom line in the first sentence, then the reasoning, no preamble and don't restate my question back at me. Also, keep straight what's actually settled among people who work on this (philosophy of history, social epistemology, that literature) versus what's genuinely contested — if the view you attribute to the practice is itself a contested take and not the consensus, flag it as such rather than just asserting it.
reasoning: |-
  Okay, the user is really diving deep into Wikipedia's policies on history articles and how they relate to theories of historical knowledge. They’ve noticed a tension between Rankean ideals of primary sources and Wikipedia’s strict reliance on secondary scholarship. Their core question is about the underlying epistemology of Wikipedia's rules: is it institutional, individualist, or something else?

  First, I need to unpack their main points. They mention the no original research policy, verifiability over truth, preference for recent secondary sources, and consensus-based editing. The user is bothered by the contradiction: Wikipedia seems Rankean in demanding sources but anti-Rankean by barring direct engagement with primary sources. They also question if favoring recent scholarship assumes historical progress, which isn’t universally accepted.

  The user wants a clear bottom line upfront. They’re looking for an analysis of the epistemology behind these policies, whether different theories could support the same rules, and any inconsistencies. Plus, they want to know where scholarly consensus exists and where it’s contested. They mention philosophy of history and social epistemology, so I should reference those fields appropriately.

  Looking at Wikipedia’s practices, it’s clear they prioritize institutional authority. Reliance on published secondary sources means knowledge is mediated by academic historians. This aligns with social epistemology, where knowledge depends on community standards and expert consensus. The preference for recent scholarship suggests a belief in historiographical progress, which is a form of cumulative institutional knowledge. However, this view isn’t universally accepted; postmodernists might challenge the idea of objective progress.

  The "verifiability not truth" standard further emphasizes institutional trust. Truth is what the reliable sources say, which fits a constructivist or consensus-based view. But does this conflict with the preference for recent scholarship? Not necessarily. The system assumes that newer scholarship is more reliable because it incorporates corrections, implying a convergence toward truth. However, this could be seen as inconsistent if verifiability is purely about current consensus while the preference for recent sources assumes improvement over time. Some might argue this reveals a tension between consensus-based and progress-oriented views.

  Regarding individualist epistemology, Wikipedia’s rules don’t accommodate it. Thucydidean autopsy—direct evaluation of primary sources—is excluded because original research isn’t allowed. This locks out amateur insights, reinforcing that Wikipedia defers to institutional authority. So the policies are underdetermined in some areas but clearly reject individualist approaches.

  The user might also be interested in deeper implications, like how Wikipedia’s model affects historical discourse. By outsourcing epistemology to academia, it avoids original interpretation but may perpetuate biases in scholarship. The consensus-based editing can lead to politicization of content. These are practical outcomes of their epistemological choices.

  I should also note where there’s scholarly agreement versus debate. Social epistemologists generally support Wikipedia’s model as practical for collaborative projects. But critics, like those in postmodern historiography, question the objectivity of institutional consensus. The belief in historiographical progress is contested; while some see it as self-correcting, others see it as paradigm shifts without linear progress.

  In conclusion, Wikipedia’s policies are firmly institutionalist, rejecting individual interpretation. The consistency between verifiability and recent sources hinges on assuming academia converges on truth, a view that’s debated. The user’s insight about the Rankean paradox is spot-on—Wikipedia uses sources but defers to intermediaries, making it more compilatory than investigative.
answer: |-
  **Wikipedia's history policies presuppose a social-institutional epistemology where historical knowledge is constituted by credentialed academic consensus, rejecting individual source evaluation as valid for encyclopedia construction.**  

  ### Core Epistemological Commitments  
  1. **Institutional Authority over Individual Judgment**:  
     - The ban on original research and mandatory reliance on secondary sources explicitly prioritizes institutionalized scholarship. This treats historical knowledge as *socially certified* through peer review and academic publishing, not individually verifiable through primary sources. A Thucydides-style autopsy is institutionally invalid here.  
     - **Contested point**: This aligns with social epistemology (e.g., Goldman’s recognition of expert authority) but clashes with empiricist/rationalist traditions (e.g., Collingwood’s re-enactment). Critics argue it enforces academic orthodoxy.  

  2. **Verifiability ≠ Truth as a Consensus-Based Pragmatism**:  
     - "Verifiability not truth" operationalizes knowledge as *what accredited institutions currently accept*, not correspondence to past reality. This is consistent with a coherence theory of truth or constructivist views (e.g., Jenkins’ postmodern historiography).  
     - **Settled among social epistemologists**: For collaborative projects like Wikipedia, this is seen as a practical necessity to manage scale and conflict (Fallis, Goldman).  

  3. **Preference for Recent Scholarship**:  
     - Reflects a commitment to *cumulative institutional progress*: newer scholarship is presumed to correct past errors through collective scrutiny. This assumes historiography converges on truth over time (a "Whig" view of disciplinary advancement).  
     - **Contested point**: This is rejected by Kuhnians (historiography as paradigm shifts, not linear progress) and postmodernists (knowledge as contingent, not convergent).  

  ### Tensions and Underdetermined Aspects  
  - **Verifiability vs. Recency**:  
    - Surface tension: If verifiability depends on *current* sources, recency preferences assume newer sources are *truer*, implying convergence. This is consistent only if historiography is seen as self-correcting.  
    - **Resolution in practice**: Wikipedia’s policies treat recency as a heuristic for reliability within its consensus model, not a metaphysical claim about historical truth.  

  - **Underdetermined Policies**:  
    - Rules like "cite secondary sources" could be justified by multiple theories:  
      - *Institutionalist*: Only experts can interpret sources.  
      - *Skeptical*: Primary sources are inherently ambiguous; lay interpretations are unreliable.  
    - **What’s ruled out**: Individualist epistemology (e.g., Descartes’ autonomous reason) or strong empiricism (direct access to past via sources).  

  ### Contested Foundations  
  - **Consensus as Knowledge Arbiter**:  
    - Wikipedia’s editorial consensus model mirrors "communitarian" epistemology (Longino), but its reliance on policy compliance over expertise is criticized as bureaucratic (Kittur).  
  - **Rejection of Convergence**:  
    - Policies assume academic consensus trends toward truth, but this is contested by:  
      - Postmodernists (no objective past to converge on).  
      - Critical theorists (consensus may reflect power structures, not truth).  

  **Bottom Line on Consistency**: The framework *coherently* combines verifiability and recency *only if* historiography is viewed as a self-correcting enterprise converging on truth—a view itself debated in philosophy of history.
