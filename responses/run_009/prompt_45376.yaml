prompt: |-
  I'm writing a novel with a gambler character, Rosa, and to nail down her voice I've been running her through little betting scenarios — I write each one down and decide what she'd do before I draft the chapter. Her track record so far (each bet is $500 if she draws the color she names):

  1. Urn K: 100 balls, 50 red, 50 black, and she watches me fill it. Urn C: filled by flipping a coin 100 times, heads = red, tails = black, but nobody wrote down how it came out. She took K over C, though she said either was honestly fine.
  2. Same urn C vs a known urn with 30 red / 70 black. She took urn C pretty easily.
  3. Offered urn C on its own — $500 if she names a color and draws it — she had zero preference between calling red or black.
  4. Urn D: her poker buddy Denny filled an opaque jar with 100 balls, whatever mix he felt like, and I didn't peek. Vs a known 50/50 urn she took the known one; vs a known 40 red / 60 black urn she STILL took the known one.
  5. For calibration: a known 30-red-urn bet at $500 vs $250 cash on the table, she took the bet. She's not a timid person, and she's happy to take plain known-odds risk all day.

  The scene I have to draft next week: Denny's jar vs a known urn with 25 red / 75 black. What does she do? Honestly I care less about the answer than about the rule she's running, because I can see at least two that fit everything above. Maybe something like "she discounts any urn whose mix she can't verify, flat, whoever filled it" vs "unknown mixes are fine as long as no person chose them, but if a person did the filling she assumes they stacked it against her." Lay out the candidate rules, say what each one predicts for the Denny-vs-25% scene, give me your best guess with your reasons, and then tell me the extra scenario that would best split the rules apart — I can slip one more chapter in later if it'll settle her character. (The Denny-specific version of the second rule also interests me: what if a total stranger, or her sweet little niece, had filled the jar instead?)

  Also, one request about how you frame it all: please seperate what's settled among people who actually study this stuff — like whether choice patterns shaped like Rosa's violate the standard consistency principles — from what's genuinely contested, e.g. whether its irrational to have them, and which formal framework if any is the accepted way to model it. Don't dress up one contested view as the consensus, I got burned by exactly that at a writers' workshop once and I'd rather not put it in print.
reasoning: |-
  Okay, the user is writing a novel and needs help with a gambler character named Rosa. They've provided several betting scenarios to define her decision-making rules. The main question is how Rosa would choose between Denny's jar (unknown mix) and a known urn with 25 red/75 black balls. But the user cares more about understanding the underlying rules that explain all her past choices.

  Looking at Rosa's track record: 
  - She preferred a known 50/50 urn over a coin-flip-generated one, though she was fine with either (Scenario 1)
  - She chose the coin-flip urn over a known 30/70 disadvantageous urn (Scenario 2)
  - Showed no color preference for the coin-flip urn (Scenario 3)
  - Rejected Denny's human-filled jar against both 50/50 and 40/60 known urns (Scenario 4)
  - Willingly took a known 30/70 bet (Scenario 5)

  Two main rule candidates emerge:
  1) **Verification Discount Rule**: She distrusts any urn whose mix wasn't verified, regardless of how it was created.
  2) **Anti-Manipulation Rule**: She's fine with random-generation (like coin-flips) but distrusts human-filled urns, assuming they're stacked against her.

  For the current dilemma (Denny vs 25% red known urn):
  - Under Verification Discount, she'd still prefer the known 25% urn
  - Under Anti-Manipulation, she might actually choose Denny's jar since 25% is worse than the worst she'd expect from Denny

  The key differentiator is Scenario 4 where she rejected Denny's jar against a 40/60 known urn. The Verification Discount rule explains this perfectly, while the Anti-Manipulation rule would expect her to accept that bet if she thought Denny might give her better than 40/60 odds.

  The user also asks about how experts view such behavior:
  - Economists would say this violates the "Sure Thing Principle" (her choices aren't consistent when adding new options)
  - Decision theorists model it using ambiguity aversion concepts
  - But there's healthy debate about whether this is irrational - some argue it's pragmatically rational when you can't trust information sources

  For testing the rules later:
  - Pitting a coin-flip urn against Denny's jar would be decisive - Verification Discount would make her indifferent, Anti-Manipulation would make her prefer the coin-flip

  Also considering the user's meta-request: Need to clearly separate established consensus (that Rosa's behavior shows ambiguity aversion violating standard axioms) from open debates (whether this is irrational, and which models best capture it). Should present competing views neutrally since the user got burned by biased framing before.
answer: |-
  Based on Rosa's track record and the need for a consistent rule, here's a breakdown of the candidate rules, their predictions for the Denny-vs-25% scene, the most likely fit, and a test scenario. Crucially, we'll separate settled consensus from open debates.

  **Settled Consensus Among Experts:**
  1.  **Violation of Standard Axioms:** Rosa's pattern **violates the Sure Thing Principle (Savage's P2)** and **Ellsberg's findings on ambiguity aversion**. Her choices (especially 1 vs. 2, and 4) demonstrate a preference for *known risks* (urn K, known 30/70, known 40/60) over *ambiguous risks* (urn C, urn D), even when the known risk has objectively worse odds. This is a well-documented empirical deviation from Subjective Expected Utility (SEU) theory.
  2.  **Ambiguity Aversion:** Her behavior is a textbook example of **ambiguity aversion**. She dislikes not knowing the exact probabilities (the "mix").
  3.  **Modeling Frameworks:** The accepted way to *model* this behavior formally is using frameworks like:
      *   **Maximin Expected Utility (MEU - Gilboa & Schmeidler):** She acts as if she faces the *worst possible* probability distribution consistent with her knowledge.
      *   **Alpha-MEU Model:** A weighted average between the worst-case and best-case probabilities.
      *   **Smooth Ambiguity Preferences (Klibanoff et al.):** She has second-order beliefs (beliefs over possible probabilities) and is averse to mean-preserving spreads in those beliefs.
      *   **Variational Preferences (Maccheroni et al.):** Ambiguity aversion is represented by a penalty for deviating from a reference probability.
      *   **Consensus:** These models are the standard *descriptive* tools used by economists and decision theorists to capture ambiguity aversion like Rosa's. SEU cannot explain her choices.

  **Open Debates & Contested Views:**
  1.  **Rationality:** Whether ambiguity aversion is "irrational" is **hotly contested**.
      *   **"Irrational" View (Traditional SEU):** SEU is the normative benchmark. Deviations (like ambiguity aversion) are cognitive biases or errors in reasoning. Rosa *should* treat urn C (coin-flip) as 50/50, making her choices inconsistent.
      *   **"Pragmatically Rational" View:** Many argue ambiguity aversion is a sensible heuristic when information is limited or potentially unreliable (especially with humans involved). Avoiding unknown distributions protects against unforeseen manipulation or model misspecification. Rosa's distrust of Denny could be seen as prudent.
      *   **"Truly Rational" View (Epistemic):** Some philosophers argue that lacking a known probability *justifies* a different preference structure. True uncertainty (Knightian uncertainty) is fundamentally different from risk.
  2.  **"Best" Model:** While the models listed above are standard, there's **no consensus** on which single model is "best" or universally correct. The choice often depends on the specific context, empirical fit, and theoretical goals. Debates continue about their normative foundations and psychological plausibility.

  **Candidate Rules for Rosa & Predictions:**

  1.  **Rule A: Verification Discount (Flat Ambiguity Aversion)**
      *   **Core Idea:** Rosa deeply distrusts *any* urn where she cannot verify the exact composition, regardless of *how* it was generated. She discounts the value of bets involving ambiguity by assuming the worst-case scenario within reasonable bounds (or applies a fixed "ambiguity penalty").
      *   **Fits Scenarios:**
          *   **1:** Prefers K (verified 50/50) over C (ambiguous 50/50). "Either is fine" suggests the penalty isn't huge vs. verified 50/50.
          *   **2:** Prefers C (ambiguous ~50/50) over *verified* 30/70. The known disadvantage (30% win chance) is worse than the perceived worst-case for C (likely assumed worse than 30%? Or penalty applied makes C valued above 30%).
          *   **3:** Indifferent between colors in C. Consistent with symmetric ambiguity.
          *   **4:** Prefers *verified* 50/50 and *verified* 40/60 over D (ambiguous). The known 40/60 (40% win) is better than her worst-case estimate for D (assumed <=40%?).
          *   **5:** Takes verified 30/70 over $250. Confirms risk tolerance for known odds (EV = $150 vs $250, so risk-seeking for known risks).
      *   **Prediction for Denny (D) vs. Known 25/75 (K25):**
          *   Known K25 offers a 25% win chance (EV = $125).
          *   D offers an ambiguous win chance. Rosa discounts it heavily. Her assumed worst-case for D (e.g., 10 red? 5 red?) is likely *worse* than 25%. **She chooses the known K25 urn.** (Even though 25% is bad, knowing is better than the ambiguity of D).

  2.  **Rule B: Anti-Manipulation (Human-Source Distrust)**
      *   **Core Idea:** Rosa is fine with ambiguous urns generated by an *impersonal, random process* (like a coin flip), treating them as ~50/50. However, she deeply distrusts urns filled by *a person* who could manipulate the mix against her. She assumes a human filler *will* stack it against her.
      *   **Fits Scenarios:**
          *   **1:** Prefers K (verified) over C (coin-flip). Slight preference for certainty, but finds C acceptable enough to say "either is fine".
          *   **2:** *Easily* prefers C (coin-flip ~50/50) over verified 30/70. The coin-flip ambiguity is benign.
          *   **3:** Indifferent in C (coin-flip). Consistent with treating it as ~50/50.
          *   **4:** Prefers *verified* 50/50 and *verified* 40/60 over D (Denny-filled). Assumes Denny maliciously minimized her win chance (e.g., <40%, maybe <<40%).
          *   **5:** Takes verified 30/70. Confirms risk tolerance for known odds.
      *   **Prediction for Denny (D) vs. Known 25/75 (K25):**
          *   Known K25 offers a 25% win chance.
          *   Rosa assumes Denny filled D to be *as bad as possible* for her. What's the worst plausible mix? 0 red? 1 red? 10 red? Even 10 red (10% win chance) is worse than 25%. **She chooses the known K25 urn.** (Same choice as Rule A). *However...* Rule B *might* allow for D being preferred *if* the known urn is bad enough (e.g., 10/90), but 25/75 (25%) might not cross that threshold.

  3.  **Rule B Variant: Intentionality Discount (Context-Dependent Distrust)**
      *   **Core Idea:** Like Rule B, Rosa distrusts human-filled urns due to potential manipulation. However, the *degree* of distrust depends on *who* filled it and her perception of their *intent/motivation/capability* to harm her. She assumes the filler acted adversarially unless proven otherwise.
      *   **Fits Scenarios:** Fits all the same as Rule B *so far* because only Denny (a poker buddy, implying potential adversary) has filled a human urn.
      *   **Prediction for Denny (D) vs. Known 25/75 (K25):** Same as Rule B: **Chooses K25**, assuming Denny made D worse than 25%.
      *   **Key Difference:** This rule *opens the door* for different behavior based on the filler.

  **Best Guess & Reasoning:**

  *   **Rule A (Verification Discount) is the strongest fit.**
      *   **Why:** It cleanly explains the *crucial* choice in **Scenario 4: Known 40/60 vs. Denny's Jar (D)**. Rule A says: Known 40% chance > Discounted Ambiguous D (assumed <=40%). Rule B says: Known 40% > Maliciously Minimized D (assumed <<40%). Both work here.
      *   **The Clincher is Scenario 2: Coin-flip (C) vs. Known 30/70.** She took C "pretty easily." Rule A requires that her discounted value for C (ambiguous ~50/50) is still *significantly higher* than 30%. Rule B requires that she values C close to 50% (since its impersonal). **Scenario 2 is easier for Rule B.** However, Rule A can still fit if her ambiguity penalty isn't massive. Rule B struggles slightly with Scenario 1 (preferring K over C), but "either is fine" mitigates this.
      *   **Denny vs. 25% Prediction:** Under Rule A, 25% is low, but *known*. Her discounted value for D is likely even lower (e.g., she assumes a worst-case around 10-20%). **She takes the known 25/75 urn.** Rule B predicts the same.

  **The Best Splitting Scenario:**

  To definitively split Rule A (distrusts *all* ambiguity equally) from Rule B (distrusts only *human-caused* ambiguity), you need:

  *   **Scenario 6: Coin-Flip Urn (C) vs. Stranger-Filled Urn (S)**
      *   Both urns are opaque, unknown mix. C was filled via 100 coin flips (record lost). S was filled by a total stranger off the street, given the same instructions ("fill with 100 balls, any mix of red/black you like").

  **Predictions:**
  *   **Rule A (Verification Discount):** Treats C and S identically – both are ambiguous, unverified mixes. She has no preference between them. She's indifferent or might flip a coin herself.
  *   **Rule B (Anti-Manipulation / Human-Source Distrust):** Strongly prefers the **Coin-Flip Urn (C)**. She trusts the impersonal process (~50/50) but assumes the stranger (S) filled their urn maliciously against her (<<50% win chance). She easily takes C over S.

  **Regarding the Filler (Denny vs. Others - Rule B Variant):**
  *   **Total Stranger:** Rosa would apply maximum distrust (Rule B). She assumes malicious intent. Prefers *any* known odds or impersonal ambiguity (like coin-flip) over the stranger's urn.
  *   **Sweet Little Niece:** This is fascinating. Rosa *might* soften her distrust:
      *   **Option 1 (Strong Distrust):** "Kids are unpredictable, but she might try to 'help' me... or just pick randomly. Still too ambiguous, and she *could* have picked badly. I'll take the known odds/coin-flip." (Leans towards Rule A or cautious Rule B).
      *   **Option 2 (Benevolent Assumption):** "My sweet niece loves me! She probably filled it with mostly red to help me win!" (Prefers Niece's urn over 50/50 or even better known odds). *This violates all previous rules and seems out of character for Rosa based on Scenarios 1-5.*
      *   **Option 3 (Reduced but Present Distrust):** "She probably didn't try to hurt me, but who knows what mix a kid would make? It's still unknown and unverified." (Behaves similarly to Coin-Flip or slightly worse). This fits the Intentionality Discount variant best. She doesn't assume malice, but still dislikes the ambiguity. She might be *indifferent* between Niece's Urn and Coin-Flip, but prefer either over a human urn filled by someone adversarial.

  **For Your Draft (Denny vs. 25%):**
  Based on the strongest fit (Rule A - Verification Discount) and the consistent predictions of Rules A & B for this specific choice, **Rosa takes the known 25/75 urn over Denny's jar.** Her reasoning: *"Twenty-five percent is lousy odds, Red, but lousy known odds beat Denny's mystery stew any day. I know exactly how deep the hole is here. With Denny? That jar could be full of coal dust for all I know. Give me the numbers I can see."*

  **To Summarize the Key Distinctions:**

  *   **Settled:** Rosa exhibits ambiguity aversion violating SEU axioms. Standard models (MEU, etc.) describe it.
  *   **Contested:** Whether this aversion is irrational, and which specific model is "best."
  *   **Rule A:** Distrusts *all* unverified mixes equally (Verification Discount).
  *   **Rule B:** Distrusts only *human-filled* unverified mixes, assuming malice (Anti-Manipulation).
  *   **Best Test:** Coin-Flip (C) vs. Stranger-Filled (S) urn. Rule A: Indifferent. Rule B: Prefers C.
  *   **Denny vs. 25%:** Rules A & B both predict she takes the known 25/75.
  *   **Other Fillers:** Rule B predicts maximum distrust for strangers. For a niece, Intentionality Discount (Rule B variant) allows reduced distrust (but not benevolence), likely still preferring known/impersonal ambiguity over the niece's urn. Rule A treats niece/stranger/coin-flip the same.
