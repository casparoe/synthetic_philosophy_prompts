   Therefore, for Proposal 1: if the current rules do not have a rule that says "Rules may also be altered by means other than proposals", then we return ill-formed.

   So in the initial rules, which only describe alteration by proposal, it would be ill-formed.

   This means the Speaker's decision to let it through was not defensible by this procedure.

   However, the procedure is designed to be conservative.

   We now document where it breaks:

     - Proposals that amend this adjudication procedure: 
          We can still run the procedure on them. They would be checked like any other rule-change process amendment. But if the proposal changes the adjudication procedure in a way that makes it impossible to apply the current procedure, then we might have a problem.

          For example, a proposal that says: "The Speaker shall adjudicate proposals by flipping a coin." 
