              - However, the current procedure is not a rule? Or is it? We are designing it to be adopted as a rule.

          We are not currently a rule, so it's just an internal procedure. So the proposal would override it.

     - Proposals that amend the rules about amending the adjudication procedure: 
          Similarly, they are just rule changes.

     The procedure might break if a proposal is so meta that it changes the way we evaluate proposals during the evaluation. But we already prevent changing the conditions of adoption (Step 1a). 

     The worst case is a proposal that is intentionally designed to be a paradox. We hope that the steps above catch the common ones.

     In particular, if a proposal says: "This proposal is adjudicated by the new procedure defined in this proposal, which is: ...", then Step 1a would catch any attempt to change the adjudication procedure for itself.

     But if it doesn't change the conditions of adoption, but changes the adjudication procedure for future proposals, that's allowed.

     So we are safe.

     However, the procedure itself might be repealed or amended by a proposal, and then in the future we use the new one. That is by design.

     The only issue is if the procedure is amended in a way that makes it impossible to adjudicate future proposals. That is the players' problem.

