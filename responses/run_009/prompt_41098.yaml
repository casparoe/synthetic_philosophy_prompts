      So it depends on the current rules.

   Given the time constraint, the Speaker would need to know the current rules well.

   In the absence of an explicit rule, we might hand off.

   But we want to avoid hand-offs. We can build in a default: if the current rules do not explicitly allow non-proposal alteration, then it is forbidden. So Step 3a: if the current rules do not explicitly allow non-proposal alteration, then any proposal that introduces it is ill-formed.

