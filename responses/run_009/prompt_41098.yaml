          We must check the current rules. If the current rules say: "Rules may be amended or repealed only by a proposal that is adopted by the players", then a rule that automatically repeals rules is not allowed because it bypasses the proposal process.

          Therefore, we add:

          Step 3: Consistency with Rule-Change Process
              - Check if the proposal, if adopted, would introduce a new method of rule alteration that is not by proposal (or that bypasses the current proposal process). If yes, then:
                  a) If the current rules explicitly state that rule alteration can only be done by proposal, then the proposal is invalid (ill-formed) because it conflicts with that rule.
                  b) If the current rules are silent, then hand off to a vote: "Does the current ruleset allow for non-proposal methods of rule alteration?"

          For Proposal 1, if the current rules say alterations require a proposal, then it is ill-formed. Otherwise, it would have passed the previous steps.

          In the initial Suber rules, it is implicit that alterations are done by proposal. But let's assume the current rules have a rule that says: "Rules may be amended, repealed, or transmuted only by a proposal that is adopted by the players."

          Then Proposal 1 is ill-formed because it creates an automatic repeal.

          Therefore, we return it.

          But the Speaker let it through. So if the current rules do not explicitly forbid automatic alteration, then it might be allowed.

          We design the procedure to be strict.

   Proposal 2: "this rule is mutable" submitted as an amendment to an immutable rule.

      Step 0: Format - it's an amendment. It specifies the target rule (an immutable one). Format okay.

      Step 1:
          a) No change to adoption conditions.
          b) It uses "this rule" -> refers to the rule being amended. So it would change the rule to say it is mutable? But the rule is immutable, so it cannot be amended without transmutation.

      Step 2:
          a) It attempts to amend an immutable rule.
          b) The immutable rule has not been transmuted (or has it? we assume not).
