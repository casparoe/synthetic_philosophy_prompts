answer: |-
  Below is a structured, step-by-step adjudication procedure designed for efficiency (≤10 min runtime) and transparency. It prioritizes concrete checks first, flags indeterminacy early, and delegates ambiguous questions to player votes when necessary. Grounded in principles of self-reference and rule-system dynamics, it avoids theoretical complexity by focusing on operationalizable questions. I'll first outline the procedure, then test it against your three cases, and finally address limitations and your self-repeal ruling.

  ---

  ### **The Speaker's Adjudication Procedure (SAP)**  
  **Goal**: Determine if a proposal is **valid** (can be voted on) or **ill-formed** (must be returned). Run pre-vote.  
  **Timebox**: 10 minutes. Use a timer.  
  **Tools**: Current ruleset, proposal text, numbered rule log.  

  #### **Step 0: Format Check**  
     - **Question**: Does the proposal comply with structural requirements?  
       - Must specify:  
         - Type (new rule, amendment, repeal, or transmutation).  
         - Target rule number (if amending/repealing/transmuting).  
         - Full new text (if new/amendment).  
     - **Sufficiency**: If any element missing → **ill-formed**.  
     - **Termination**: Return to proposer immediately.  
     - *Rationale*: Prevents ambiguous intent. No judgment needed.  

  #### **Step 1: Self-Reference Check**  
     - **Question**: Does the proposal contain self-referential phrases (e.g., "this rule," "this proposal," its own title/ID)?  
       - If **no** → Proceed to Step 2.  
       - If **yes**:  
         - **Sub-question 1A**: Does self-reference attempt to alter *its own adoption conditions* (e.g., voting thresholds, retroactive validation)?  
           - *Examples*: "This proposal passes with 40% votes," "Rules interpreting this shall favor its validity."  
           - **Sufficiency**: If yes → **ill-formed**.  
           - *Rationale*: Adoption conditions are fixed at proposal submission; self-altering creates incoherence.  
         - **Sub-question 1B**: Does self-reference create *immediate self-destruction* (e.g., "repeal this rule")?  
           - **Sufficiency**: If yes → **ill-formed**.  
           - *Rationale*: Self-destruction voids the rule before it takes effect, violating rule continuity.  
         - **Sub-question 1C**: Does self-reference *amend/repeal rules governing its own validity* (e.g., targeting repeal/transmutation rules)?  
           - **Sufficiency**: If yes → **Delegate to player vote** (see Step 4).  
           - *Rationale*: "Bootstrapping" proposals are fundamentally indeterminate; players must decide intent.  

  #### **Step 2: Immutable Rule Check**  
     - **Question**: Does the proposal alter (amend/repeal) an immutable rule?  
       - If **no** → Proceed to Step 3.  
       - If **yes**:  
         - **Sub-question 2A**: Is the alteration *explicitly conditional on prior transmutation* (e.g., "Rule 5 [immutable] is transmuted and amended to X")?  
           - **Sufficiency**: If yes → **valid** (transmutation and alteration are simultaneous).  
         - **Sub-question 2B**: Does it *assume transmutation without stating it* (e.g., "Rule 5 is now mutable" or "Rule 5 is amended to X")?  
           - **Sufficiency**: If yes → **ill-formed**.  
           - *Rationale*: Transmutation requires explicit intent; assumption risks bypassing safeguards.  

  #### **Step 3: Rule-Change Process Check**  
     - **Question**: Does the proposal alter core rule-change rules (amendment/repeal/transmutation procedures, including SAP)?  
       - If **no** → **valid**.  
       - If **yes**:  
         - **Sub-question 3A**: Does it *preserve a valid path for future rule changes* (e.g., doesn’t repeal all amendment rules without replacement)?  
           - **Sufficiency**: If no → **Delegate to player vote** (see Step 4).  
         - **Sub-question 3B**: Is it *self-applying* (e.g., "this proposal uses the new repeal rule it defines")?  
           - **Sufficiency**: If yes → **Delegate to player vote** (see Step 4).  
           - *Rationale*: Self-application creates circular validity conditions; players must assess coherence.  

  #### **Step 4: Delegation to Player Vote**  
     - **Trigger**: Indeterminate cases from Steps 1C, 3A, or 3B.  
     - **Procedure**:  
       - Speaker posts **specific yes/no question** in the chat (e.g., "Does Proposal #87 validly amend the repeal rule given its self-reference?").  
       - Players vote within **48 hours**. Majority decides.  
       - If vote affirms validity → Proposal advances. Else → **ill-formed**.  
     - *Rationale*: Social consensus resolves logical indeterminacy.  

  #### **Terminology**  
     - **Ill-formed**: Proposal violates checks; returned for resubmission.  
     - **Valid**: Advances to player vote.  
     - **Delegate**: Players vote on specific ambiguity.  

  ---

  ### **Test Cases**  
  #### **Case 1: Self-Referential Repeal**  
     - Proposal: *"All rules that refer to this rule are repealed."*  
     - **Step 0**: Passes (clear new rule).  
     - **Step 1**: Self-reference detected → **Sub-question 1B**: "Repeal this rule" → Immediate self-destruction → **ill-formed**.  
     - *Verdict*: **Ill-formed**. Your ruling (letting it pass) is indefensible per SAP: self-destruction voids the rule before enactment.  

  #### **Case 2: Transmutation Dodge**  
     - Proposal: *"this rule is mutable"* (targeting immutable Rule X).  
     - **Step 0**: Passes (amendment format).  
     - **Step 1**: Self-reference ("this rule") → Not self-destructive (1B) or conditional-adoption (1A).  
     - **Step 2**: Alters immutable rule → **Sub-question 2B**: Assumes transmutation without stating it → **ill-formed**.  
     - *Verdict*: **Ill-formed**.  

  #### **Case 3: Self-Validating Proposal**  
     - Proposal: *"This proposal counts as passed if it receives at least half of votes cast, and rules interpreting this proposal shall be construed in its favor."*  
     - **Step 0**: Passes (new rule/amendment assumed).  
     - **Step 1**: Self-reference detected → **Sub-question 1A**: Alters own adoption conditions (voting threshold + interpretation bias) → **ill-formed**.  
     - *Verdict*: **Ill-formed**.  

  ---

  ### **Limitations & Breakage Points**  
  1. **Self-Amending SAP**:  
     - Proposals altering SAP itself (e.g., "Ignore Step 1B of SAP") pass Step 0 but hit Step 3.  
     - **Step 3B** delegates to players: "Should this SAP amendment apply to itself?" Players decide validity.  
     - *Risk*: Players may create paradoxical SAP versions (e.g., "All SAP steps are optional"). Solution relies on player sanity.  

  2. **Meta-Amalgamation**:  
     - Proposals like *"Repeal all rules about rule-changing, including this one"*:  
       - Step 1C → Delegates to vote ("Does this validly repeal core processes?").  
       - Step 3A → Delegates again ("Does it leave any valid amendment path?").  
     - *Risk*: Delegation cascades; may exceed 10 min. Mitigation: Bundle delegation questions.  

  3. **Infinite Regress**:  
     - Proposals depending on future player actions (e.g., "This rule is mutable if players vote ‘yes’ tomorrow") break SAP.  
     - **Step 1** catches this as "conditional adoption" (1A) → **ill-formed**.  

  4. **Ambiguity Deadlock**:  
     - If players deadlock in delegated votes (e.g., tie), Speaker breaks tie → preserves efficiency but reintroduces discretion.  

  ---

  ### **Conclusion**  
  SAP minimizes discretion by converting self-reference paradoxes into concrete checks (self-destruction = ill-formed, adoption conditions = ill-formed) and delegating indeterminacy (bootstrapping, meta-amendments) to players. It rejects your self-repeal ruling as erroneous but systematizes your intuition that some questions are player-decidable. For your game, SAP would:  
  - **Prevent 80% of disputes** via Steps 1A/1B/2B.  
  - **Delegate 20%** (e.g., self-amending repeal rules) to votes, reducing grudge.  
  - **Run in 5–8 min** for most proposals (complex ones hit delegation early).  

  To implement:  
  1. Adopt SAP as a mutable rule.  
  2. Require proposals to self-certify ("I affirm this passes SAP Steps 0–2").  
  3. Log all delegations + outcomes for precedent.  

  This balances rigor with playability—exactly what Nomic demands.
