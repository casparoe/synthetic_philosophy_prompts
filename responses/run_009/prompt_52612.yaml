answer: |-
  I want to make the case that Ned Block's influential distinction between access consciousness (A-consciousness) – information poised for global control, reporting, reasoning, and action – and phenomenal consciousness (P-consciousness) – the subjective, qualitative "what it's like" of experience – while profoundly structuring the field for decades, carves consciousness at the wrong joint. Crucially, the very architecture Block often contrasts with P-consciousness, namely global workspace theory (GWT), provides the conceptual tools to redraw the lines more accurately, dissolving the apparent need for a separate phenomenal residue and recasting the core intuition driving Block's distinction as a temporal artifact of access itself.

  The powerful intuition Block leverages is that there seems to be "more" to my current visual experience – the rich panorama of colors, shapes, and textures seemingly present all at once – than what I can report, remember, or use for reasoning at any single instant. This intuition feels like direct evidence of P-consciousness overflowing A-consciousness. However, GWT, particularly its empirically supported constraints, offers a compelling alternative explanation for this apparent richness and its distinction from immediate access. The global workspace, a limited-capacity "stage" for conscious contents, can only broadcast a very small fraction of the sensory information available at any given moment. What we introspectively perceive as the unified, simultaneous richness of the visual field is not a single, all-encompassing broadcast. Instead, it is a *retrospective reconstruction*, dynamically stitched together across multiple, rapid, successive broadcasts.

  Each of these fleeting broadcasts *was*, at the moment it occurred, fully A-conscious. The specific detail I fixate on now, the gist of the scene I grasp a moment later, the texture my attention shifts to next – each was globally available for report, memory, and reasoning *when it was broadcast*. The pervasive feeling that the *entire* rich scene was phenomenally present simultaneously arises because the workspace architecture incorporates mechanisms for handling its own history. Crucially, contents that have recently been broadcast don't vanish instantly; they linger in a temporary buffer – a kind of "recently accessed" cache – where they remain highly *re-activatable*. They are dispositionally available for rapid re-entry into the workspace proper with minimal effort, perhaps via residual activation or transient synaptic changes.

  Our mistake, according to this GWT-based view, is to misinterpret this *lingering dispositional accessibility* of information that *was* recently A-conscious as evidence for a distinct, continuously present *phenomenal quality* existing above and beyond access. We confuse the ease with which we can *re-access* past broadcast snippets (stitching them into a seamless narrative memory) with the presence of a simultaneous, non-functional phenomenal field. The "residue" Block seeks to preserve isn't an extra ingredient in the universe; it's a cognitive illusion generated by the workspace's temporal dynamics. The feeling of phenomenal overflow isn't evidence of inaccessible phenomenology occurring *now*, but rather a reflection of the *past* accessibility of numerous fragments now held in a readily retrievable buffer.

  Therefore, the true distinction isn't between access and something non-functional (phenomenal), but between two *temporal stages of access*:
  1.  **Currently Broadcast Content:** The winning coalition of information actively dominating the global workspace *at this precise moment*, driving immediate report, reasoning, and action – this is the maximal, fully functional A-consciousness available right now.
  2.  **Recently Broadcast Buffer:** The rapidly decaying trace of information that *was* broadcast in the immediately preceding moments. This content is no longer actively driving global processes *unless re-entered*, but it remains highly accessible and easily integrated into the *recollection* of a continuous, rich experience.

  The upshot is that GWT doesn't merely explain A-consciousness; it provides a mechanistic account of the very *phenomenology* that motivates Block's distinction, showing how the *feeling* of rich, simultaneous presence arises from the staggered, serial access and rapid buffering/re-access inherent to the workspace architecture. Block's intuition about richness is correct, but its interpretation as evidence for a distinct *kind* of consciousness (P-consciousness beyond A) is mistaken. The richness is real, but it's a richness distributed across time, constructed from a sequence of fully accessed moments and their temporary afterglow.

  Now, the standard and serious objection is that this redrawing simply changes the subject. Even if GWT explains the *report* of richness and the *illusion* of simultaneity, doesn't it completely sidestep the "hard problem"? It explains functional access and cognitive dynamics, but what explains the *subjective feel* itself? Why does accessing visual information *feel like seeing red* rather than being a mere information state? This redescription, the objection goes, eliminates the explanandum – the raw qualitative feel – rather than explaining it.

  My counter is twofold. First, accepting this objection often relies on a prior commitment to the very distinction I'm arguing is illusory – the idea that the "feel" is a separate ontological component. The GWT account suggests that the subjective feel *is constituted by* the specific way information is accessed, globally broadcast, integrated with memory and affect, and embedded in this dynamic temporal structure involving immediate broadcast and the rapid buffer. The "what it's like" isn't separable from this complex functional profile. Second, while the hard problem remains profoundly challenging for *any* physicalist theory, dissolving the A/P distinction removes a specific roadblock. If the core intuition driving P-consciousness as "overflow" is explained as a temporal artifact of access, then the hard problem reduces to explaining why global access *feels like anything at all*, rather than explaining why there's an inaccessible phenomenal residue *plus* accessible content. It doesn't solve the hard problem, but it reframes it more cleanly within the dynamics of global information processing, potentially making it more tractable.

  Where is this argument most vulnerable? Its Achilles' heel lies in the empirical and conceptual status of the "recently broadcast buffer." Is this buffer genuinely distinct in kind from the active workspace, or just a fading phase of it? Does the empirical evidence (e.g., from change blindness, attentional blink, working memory decay) robustly support the specific claim that the *phenomenal feel* of continuity and richness arises *only* from the reactivation potential of this buffer, rather than some other mechanism? Critics could argue that the buffer itself, if it possesses phenomenal qualities, merely pushes the problem back a step: why does the lingering trace *feel like* anything? Furthermore, the argument heavily leans on the visual modality and the specific illusion of simultaneity; can it equally well account for the phenomenology of non-visual experiences (e.g., a constant dull ache, a pervasive mood) where the "rich field" metaphor is less apt? Finally, while it aims to dissolve the residue, the argument might still struggle to fully capture the intrinsic, seemingly atomic *qualitativeness* of simple sensations for those who find that aspect irreducible. Despite these vulnerabilities, the argument offers a powerful reconceptualization, suggesting that what we took to be the fundamental joint in consciousness – between access and phenomenality – is better understood as a dynamic interplay within the temporal unfolding of access itself.
