answer: |-
  ### Trading Game Design: "The Prior Paradox"  
  **Objective:** Illustrate how the common prior assumption (CPA) underpins rational disagreement and speculative trade. Students experience trade driven by asymmetric information vs. priors that were never common.

  ---

  ### **Materials**  
  1. **Event Setup**:  
     - Use a standard deck of cards. Designate **RED** (hearts/diamonds) as "Event A" and **BLACK** (spades/clubs) as "Event B".  
     - Shuffle and place the deck face down. At game end, draw the top card to resolve the event.  

  2. **Signal Cards** (12 index cards):  
     - **Informative Cards (6)**:  
       - 3 cards: "HINT: 60% chance of RED"  
       - 3 cards: "HINT: 60% chance of BLACK"  
     - **Noise Cards (6)**:  
       - "NOISE: No information (50/50 chance)"  
     - **House Prior Cards** (for first run only):  
       - 6 cards: "HOUSE A PRIOR: RED is 2/3 likely, BLACK is 1/3"  
       - 6 cards: "HOUSE B PRIOR: RED is 1/3 likely, BLACK is 2/3"  

  3. **Trading Materials**:  
     - Play money: $100 per student in $1 bills.  
     - Securities: "RED Bonds" (paper slips). Each pays **100 points** if RED wins, **0** if BLACK wins.  
     - Whiteboard: Track trades (price/volume) and public offers.  

  4. **Payoff Scheme**:  
     - Points = Cash + (100 × RED Bonds if RED wins, else 0).  
     - Convert points to rewards:  
       - Top 3 scorers: Bonus points (e.g., +0.5% on final grade) or small prizes (candy).  
       - Bottom half: Light penalty (e.g., extra reading). **Emphasize**: "Your trades affect your grade!"  

  ---

  ### **Game Sequence**  
  #### **First Run: DIVERGENT PRIORS**  
  **Step 1: Setup (5 mins)**  
  - Assign roles: 6 students → **House A** (prior: RED 2/3), 6 → **House B** (prior: BLACK 2/3).  
  - Distribute:  
    - Each gets $100 cash + 1 RED Bond.  
    - Randomly assign signal cards (3 RED-hint, 3 BLACK-hint, 6 noise).  
  - **Instructor Script**:  
    > "You’re analysts from rival firms. House A/B has its own ‘house prior’ on the card. Your signal is private. Trade to maximize points. You may share your card info, but **no lying**."  

  **Step 2: Bilateral Trading (3 rounds × 5 mins)**  
  - Students pair freely and negotiate trades (e.g., "I’ll buy your bond for $X").  
  - **Rules**:  
    - Trades must be for ≥1 bond.  
    - Record each trade (buyer, seller, quantity, price) on slips.  
  - **Between Rounds**:  
    - Post aggregate stats on whiteboard:  
      > "Round 1: Avg price = $P, Volume = V bonds."  

  **Step 3: Posted-Offer Market (3 rounds × 5 mins)**  
  - Each round:  
    - Students submit **one public offer** (buy/sell, price) to instructor.  
    - Instructor lists offers on whiteboard (e.g., "SELL @ $65", "BUY @ $40").  
    - Students accept any public offer (first-come-first-served).  
  - **Between Rounds**: Update whiteboard with new offers.  

  **Step 4: Resolution & Scoring**  
  - Draw top card → resolve event (RED/BLACK).  
  - Calculate points → rank students.  

  ---

  #### **Second Run: COMMON PRIOR**  
  - **Changes**:  
    - All 12 students share **SAME PRIOR** (no house cards). Distribute new cards:  
      > "COMMON PRIOR: RED 1/2, BLACK 1/2"  
    - Reuse **identical signal distribution** (3 RED-hint, 3 BLACK-hint, 6 noise).  
  - Repeat Steps 2–4 identically.  

  ---

  ### **Debrief: Mapping Game to Theory**  
  **Key Moments & Concepts**:  
  1. **Common Prior Assumption (CPA)**:  
     - **Game Link**: In Run 1, House A/B started with different priors. In Run 2, all had identical priors.  
     - **Formal Takeaway**: CPA requires all rational agents derive beliefs from the same prior + asymmetric information.  

  2. **Private Information as a Partition**:  
     - **Game Link**: Signals partitioned students (e.g., "60% RED" vs. noise).  
     - **Formal Takeaway**: Each agent’s information is a cell in a partition of the state space.  

  3. **Agreement Theorem**:  
     - **Game Link**: In Run 2, did students converge to similar prices after trading?  
     - **Formal Takeaway**: With common priors, if posteriors become common knowledge, agents cannot "agree to disagree."  

  4. **No-Trade Theorems**:  
     - **Game Link**: In Run 2, trade volume should plummet after initial rounds as information aggregates. In Run 1, trade persisted due to irreconcilable priors.  
     - **Formal Takeaway**: Under CPA, purely speculative trade is irrational if all information is shared.  

  **Discussion Prompts**:  
  - "In Run 1, why did House A and B keep trading even after sharing signals?"  
    → *Answer: Priors were never common → posteriors didn’t converge*.  
  - "In Run 2, why did trade slow down? Was there still uncertainty?"  
    → *Answer: With CPA, trade is driven only by residual asymmetric info*.  

  ---

  ### **Candid Limitations & Fixes**  
  **What the Game Can’t Reproduce**:  
  1. **Bayesian Updating**: Students won’t rigorously calculate posteriors.  
     - **Debrief Fix**: Show a Bayesian example (e.g., "House A prior + RED-hint → posterior = 0.75 RED").  

  2. **Common Knowledge of Posteriors**:  
     - Real CPA theorems assume iterated public announcements.  
     - **Debrief Fix**: Explain how posted offers approximate public knowledge.  

  3. **Rationality/Incentives**: Students may trade for fun or spite.  
     - **In-Game Fix**: Enforce "no lying" and grade-based rewards.  

  ---

  ### **Predictable Problems & Concrete Fixes**  
  1. **"Trading for Entertainment"**:  
     - **Problem**: Frivolous trades to "see what happens."  
     - **Fix**: Announce: "Top 3 scorers win prizes; bottom 5 explain their strategy in front of class."  

  2. **Misunderstanding Cards**:  
     - **Problem**: Confusing "60% hint" with certainty.  
     - **Fix**: Start with a practice round: "If your hint says 60% RED and RED wins, you get +10 bonus points."  

  3. **Refusing to Trade**:  
     - **Problem**: Risk-averse students hoard bonds/cash.  
     - **Fix**: Force participation: "You must make ≥1 trade in bilateral rounds."  

  4. **Information Hoarding**:  
     - **Problem**: Students hide signals to "win."  
     - **Fix**: Remind: "CPA assumes honesty. Lying breaks the model—play as rational agents."  

  5. **Time Crunch**:  
     - **Fix**: Use a timer. If rounds lag, call: "Last trade in 30 seconds!"  

  ---

  ### **Instructor Script Snippets**  
  - **Opening Hook**:  
    > "Today, you’ll trade bonds in rival firms. Your goal isn’t just profit—it’s to discover why rational minds disagree."  
  - **Transition to Debrief**:  
    > "In Run 1, your priors were never common. Run 2 forced CPA on you. Where did trade come from? Let’s map this to Harsanyi…"  

  **Why It Works**: Students *feel* CPA’s absence (Run 1: persistent trade from priors) and presence (Run 2: trade evaporates as info aggregates). The stakes/grades make incentives tangible.
