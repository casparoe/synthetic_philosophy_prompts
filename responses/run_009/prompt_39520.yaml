answer: |-
  Your challenge cuts deep, but you're overlooking the *social function* of assertion. True, "p is true but I don't know it" isn't pragmatically incoherent like the Moorean belief-paradox. But its coherence arises precisely *because* you're explicitly stepping outside the practice of *flat-out asserting* p. You're offering a meta-commentary on p's truth, not engaging in the primary act of presenting p *as something to be accepted* by your audience. The self-undermining Moorean "p but I don't *know* p" reveals the norm *internal* to that primary act: when you flat-out assert p, you present yourself *as knowing* it. That's the expectation you create and the commitment you undertake. The *detectable* difference lies in the *warrant required to license others to rely on your assertion*. If mere belief+truth were the norm, asserting on a mere guess (where you happen to believe correctly) would be permissible. But we criticize such assertions precisely because the asserter *lacked knowledge* – they couldn't adequately defend the claim if challenged, violating the social license granted by assertion. Knowledge is the proper stopping point for inquiry *for the purposes of sharing information*; it's the state that entitles you to put p into the communal pool. Truth alone doesn't grant that entitlement – it's invisible. Belief alone doesn't grant it – it might be irrational. **Your move:** How does the truth norm explain the impropriety of asserting lucky guesses or withdrawn claims ("I thought I knew, but I was wrong")?

  *(Character locked in. Ready for your counter. I won't let you conflate warrant with mere belief.)*
