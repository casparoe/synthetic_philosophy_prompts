  ### Activity Design: "Bet Sizing & Market Wisdom"

  #### **Learning Goals**  
  Illustrate three intuitive truths about betting/trading:  
  1. **Ruin of 100% bets** (even on favorable odds) vs. stability of fractional Kelly bets.  
  2. **Market prices reflect average odds, not probabilities** (e.g., 90% and 30% beliefs trade near 66%, not 60%).  
  3. **Committee averages are exploited by internal traders** (moving prices away from the vote).

  ---

  ### **Rules & Materials**  
  - **Participants**: 14 adults, split into two groups of 7 for Round 1, paired for Round 2, whole group for Round 3.  
  - **Materials**:  
    - Raffle tickets (start with 100 per person).  
    - Two coins:  
      - *Biased coin*: 60% heads (mark one side discreetly; flip carefully).  
      - *Fair coin*: 50% heads.  
    - Whiteboard to track bets/trades.  
    - Poker chips (or paper slips) to represent "bonds" (each bond pays 100 tickets if heads).  
  - **Payoff**:  
    - Raffle tickets convert to wine bottle draws (1 ticket = 1 entry).  
    - At term end, draw 3 winners (bottles proportional to ticket wealth).  

  ---

  ### **90-Minute Plan**  

  #### **Round 1: The Ruin of All-In Bets** (25 min)  
  **Goal**: Show why betting 100% on a 60% coin leads to ruin, while 20% Kelly grows safely.  
  - **Setup** (5 min):  
    - Split into **Group A** (bets 100% each flip) and **Group B** (bets 20% each flip).  
    - All start with 100 tickets.  
    - Flip biased coin (60% heads) 10 times.  
  - **Flips** (15 min):  
    - Use predetermined sequence: **T, H, T, H, T, H, H, H, T, H** (6 heads, 4 tails).  
    - After each flip:  
      - *Group A*: Win → double bankroll. Lose → lose everything (drop out).  
      - *Group B*: Win → +20% bankroll. Lose → -20% bankroll.  
    - Track bankrolls on whiteboard.  
  - **Outcome**:  
    - *Group A*: All wiped out by flip 9 (final bankroll = 0).  
    - *Group B*: Example bankroll:  
      ```  
      Start: 100 → T: 80 → H: 96 → T: 76.8 → H: 92.16 → T: 73.73 → H: 88.47 → H: 106.17 → H: 127.40 → T: 101.92 → H: 122.30  
      ```  
      Avg. ~120 tickets (22% growth).  

  #### **Round 2: Trading Odds, Not Probabilities** (30 min)  
  **Goal**: Show 90% and 30% traders settle near 66%, not 60%.  
  - **Setup** (5 min):  
    - Pair participants: 7 pairs. Assign one **optimist** (90% confidence in heads) and one **pessimist** (30% confidence).  
    - Each pair: Pessimist starts with 1 bond (worth 100 tickets if heads) + 100 tickets. Optimist starts with 100 tickets.  
  - **Trading** (15 min):  
    - Pairs negotiate 1-on-1 to trade the bond for tickets (e.g., optimist buys bond from pessimist).  
    - Record trade prices on whiteboard.  
  - **Settlement** (10 min):  
    - Flip biased coin (heads).  
    - Bond holders win 100 tickets if heads.  
  - **Outcome**:  
    - Trade prices cluster near 66–70 tickets (not 60). Example:  
      - Optimist values bond at 90, pessimist at 30.  
      - Equilibrium: Log-odds average = log(90:10) + log(30:70) → ~66% probability.  
      - **Observed**: Prices like 65, 67, 70 (not 50–60).  

  #### **Round 3: Exploiting Committee Averages** (25 min)  
  **Goal**: Show committee "average confidence" is unstable when members trade.  
  - **Setup** (5 min):  
    - All write confidence (0–100%) that *fair coin* lands heads. Collect votes, compute average (e.g., 65%).  
  - **Market** (15 min):  
    - Announce: "Committee bond price = average confidence (e.g., 65 tickets)."  
    - Free trading: Anyone can buy/sell bonds at any price.  
    - Record trades.  
  - **Settlement** (5 min):  
    - Flip fair coin (heads/tails).  
    - Bond holders win 100 tickets if heads.  
  - **Outcome**:  
    - Initial trades at 65, but price drifts (e.g., to 58 or 72).  
    - **Why?** Traders with confidence >65 buy, <65 sell. Price moves to where no one originally voted.  

  #### **Debrief** (10 min)  
  - **Map to Insights**:  
    1. **Ruin vs. Growth**: Group A went bust betting 100% on a 60% coin. Group B grew steadily at 20%. Lesson: *Expected value ignores ruin risk in repeated bets. Kelly maximizes long-term growth.*  
    2. **Trading Odds**: Pairs traded near 66%, not 60%. Lesson: *Markets average odds (log-odds), not probabilities. Extreme views pull prices further from 50%* (e.g., 90% and 30% → 66%).  
    3. **Committee Exploitation**: The voted average (e.g., 65%) was unstable. Traders pushed prices away. Lesson: *Averaging confidences creates arbitrage. Members bet against the group until prices reflect true market consensus.*  

  - **Plain Language Recap**:  
    - "Betting everything wins big sometimes but guarantees busts. Small, steady bets compound safely."  
    - "When traders disagree, prices split the difference unevenly—like averaging '90:10' and '30:70' to '66:34'."  
    - "Committees can't set prices by voting. Traders exploit the average until the price changes."  

  ---

  ### **What Will Go Wrong**  
  1. **Round 1 Flips**: If the biased coin under/over-performs 60% heads, Group B’s growth may vary. Mitigation: Use predetermined sequence.  
  2. **Round 2 Negotiations**: Pairs may haggle or settle at 60% (not 66%). Mitigation: Gently suggest "split the difference between 90 and 30 unevenly."  
  3. **Round 3 Chaos**: Fast trading may confuse novices. Mitigation: Appoint 2–3 "market makers" to shout bids/offers.  

  ### **Limitations of a 90-Minute Game**  
  - **Long-Run Growth**: Kelly’s magic lies in compounding over 100s of bets. We simulate 10 flips—enough to show ruin but not full growth.  
  - **Log-Odds Nuance**: Participants won’t intuit *why* trades hit 66%; they’ll only observe the gap between 60% and the result.  
  - **True Market Dynamics**: Real markets involve thousands of trades. We capture the intuition but not the convergence depth.  

  ### **Final Tip**  
  Start with: *"No math—just trade tickets and see what happens!"* Debrief with stories, not formulas ("Remember when Group A vanished?"). Focus on experiential "aha!" moments.
