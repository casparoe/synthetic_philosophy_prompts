  First, the anchor is pain asymbolia. Patients feel pain but don't mind it. Theories must explain this. Then there are other cases: reflective asymbolic patients who judge their pain as bad but don't feel aversion, unremembered past pain, and welcomed pain like in sports or masochism. The theory must handle these without collapsing key distinctions like pain vs. suffering or sensory vs. affective components.

  I need to list desiderata. The user wants them marked as non-negotiable or preference, and note any tensions. The main tension is between phenomenal supervenience (badness depends only on the feeling) and asymbolia not being bad. If both can't be kept, which one to drop? Also, which requirement excludes popular theories?

  Let me outline the desiderata. Start with the core requirements. Asymbolia cases are crucial, so that's non-negotiable. Then the variant with reflective endorsement. Past pain must be addressed, even if unremembered. Welcomed pain needs explanation. Beings with partial apparatus should be consistent.

  Distinctions to preserve: pain/suffering, intensity/badness, sensory/affective components, badness vs. disvalued. These are non-negotiable because empirical evidence shows they can dissociate. Empirical constraints include double dissociations and neuro findings.

  Tensions: Phenomenal supervenience conflicts with asymbolia. If badness is only from phenomenal character, asymbolic pain should be bad, but it's not experienced as such. Dropping supervenience makes badness attitude-dependent, challenging hedonism. Keeping it means accepting that unnoticed pain is bad, which might be counterintuitive.

  The requirement that does the most work excluding theories is probably the one requiring non-attitudinal badness for past/unremembered pain. Hedonism might struggle here if badness requires conscious experience. Evaluativism and imperativism might handle asymbolia better but falter on past pain.

  For the scorecard: Hedonism fails asymbolia and past pain. Evaluativism might handle asymbolia but struggles with past pain. Imperativism similar issues. The sensory-affective distinction is key for excluding theories that don't account for dissociation.

  Need to ensure all user cases are covered. Also, flagging jointly unsatisfiable desiderata, especially the supervenience vs. asymbolia tension. User might need to decide which to prioritize based on theoretical commitments.

  Make sure the table is clear, and the explanations are concise. Highlight which requirement is the biggest hurdle. Probably the non-attitudinal badness for past pain, as it forces theories to explain badness without current experience or attitudes.
answer: |-
  Here are the desiderata for evaluating theories of pain's badness, structured as requested. The anchor case (pain asymbolia/dissociation) drives core requirements, with other cases and distinctions providing necessary constraints. I've marked negotiability, highlighted tensions, and identified the most exclusionary requirement.

  ---

  ### **Core Desiderata (Non-Negotiable)**  
  *Theories failing these are inadequate.*

  1.  **Asymbolia/Dissociation Verdict (D1):**  
      *Must deliver a principled account of why asymbolic/dissociated pain (e.g., cingulate lesion, morphine) is or is not bad for the subject, and in what sense.*  
      **Case:** Pain asymbolia (localization/intensity intact, aversion absent); Morphine dissociation (pain "present but doesn't bother").  
      **Why Non-Negotiable:** The phenomenon directly challenges whether sensory intensity suffices for badness.  
      **Tension Anchor:** Central to the supervenience debate (see below).

  2.  **Reflective Asymbolia Challenge (D2):**  
      *Must explain the status of pain in the reflective asymbolic patient (judges pain bad, requests analgesia, feels no aversion/need). Does badness track felt aversion, reflective judgment, or neither?*  
      **Case:** Reflective variant of asymbolia.  
      **Why Non-Negotiable:** Tests whether badness is constitutively tied to motivation or can be purely cognitive.

  3.  **Unremembered/Past Pain Badness (D3):**  
      *Must explain what makes an unremembered or past painful episode (e.g., during fatal surgery, erased memory) bad for the subject, even if no current attitude exists toward it.*  
      **Case:** Episodic pain with no surviving psychological state.  
      **Why Non-Negotiable:** Challenges accounts making badness contingent on concurrent attitudes or ongoing experience. Fundamental for theories of welfare/harm.

  4.  **Sensory-Affective Distinction (D4):**  
      *Must respect the double dissociation between sensory-discriminative (intensity, location) and affective-motivational (unpleasantness, aversion) components of pain.*  
      **Evidence:** Neural dissociations (e.g., cingulotomy reduces suffering not sensation; insular lesions may impair sensation but not affect); Pharmacological dissociation (opiates).  
      **Why Non-Negotiable:** Empirical bedrock; treating the "pain matrix" as unitary is falsified.

  5.  **Pain vs. Suffering Distinction (D5):**  
      *Must not collapse pain (sensory event) and suffering (affective state). Must explain their relationship.*  
      **Why Non-Negotiable:** Asymbolia proves one can exist without the other; welfare intuitively tracks suffering more closely.

  6.  **Intensity vs. Badness Distinction (D6):**  
      *Must allow sensory intensity and badness/unpleasantness to vary independently.*  
      **Evidence:** Asymbolia (high intensity, low badness); Masochism/endurance (high intensity, contextually low/reversed badness).  
      **Why Non-Negotiable:** Directly evidenced by D1 and Welcomed Pain cases.

  ---

  ### **Contextual Desiderata (Negotiable/Theory-Dependent)**  
  *Theories may reject these, but must justify the cost.*

  7.  **Welcomed Pain Status (D7 - Preference):**  
      *Should specify whether welcomed pain (athletic effort, ritual, masochism) is:  
      (a) Bad but overridden by greater goods/values,  
      (b) Not bad in context due to endorsement, or  
      (c) Actively good.*  
      **Case:** Deliberately sought, endorsed pain.  
      **Negotiability:** Hedonistic theories typically favor (a); Evaluativist/Imperativist may favor (b); some enactivists might argue (c). Cost of rejecting: Must explain why endorsement doesn't negate badness if attitudes are central (or vice versa).

  8.  **Partial Apparatus Commitment (D8 - Preference):**  
      *Should explicitly state whether non-human animals (e.g., fish) or decorticate humans lacking affective circuitry experience *bad* pain, and if so, in what sense.*  
      **Case:** Beings with nociception/reflexes but minimal or no affective capacity.  
      **Negotiability:** Theories may accept "badness" here (cost: risks decoupling badness from subjective experience) or reject it (cost: implies potential moral patienthood depends on complex neurology).

  9.  **Badness vs. Disvalued Distinction (D9 - Preference):**  
      *Should respect that something can be bad for a subject even if not currently disvalued by them (and vice versa).*  
      **Case:** Reflective Asymbolia (D2), Past Pain (D3).  
      **Negotiability:** Pure attitude-dependence theories (some desire-based) may reject this; others see it as essential to objectivity in welfare.

  ---

  ### **Empirical Constraints (Non-Negotiable)**  
  *Theories must be consistent with:*

  10. **Neurophysiological Dissociations (E1):**  
      Cingulate/insula lesion effects, opioid effects, distinct neural pathways for sensory vs. affective processing.
  11. **Psychological Dissociations (E2):**  
      Asymbolia, hypnotic modulation of unpleasantness without changing intensity, placebo/nocebo effects on affect.

  ---

  ### **Key Tensions & Costs**
  *   **The Core Tension:** **D1 (Asymbolia not bad) + D3 (Past pain bad) vs. Phenomenal Supervenience (PS: Pain's badness supervenes solely on its felt character).**  
      - **Conflict:** PS implies asymbolic pain (same sensation) is equally bad as normal pain. But D1 suggests it's not bad (or less bad), and D3 requires badness without any sensation.  
      - **Resolution Forced:**  
          - *Drop PS:* Accept badness isn't fixed by phenomenal character alone. **Cost:** Threatens hedonistic welfare theories; makes badness partly relational/attitudinal.  
          - *Keep PS:* Insist asymbolic pain is bad (just not disliked) and past pain was bad when it occurred. **Cost:** Counters intuition that unexperienced/unmotivating states can't harm; risks divorcing badness from subject's perspective.  
      - **Most Theories Drop PS** due to D1/D3 pressure.

  *   **D3 (Past Pain Badness) is the most exclusionary requirement.** It eliminates:  
      - Simple Hedonism (badness requires conscious experience).  
      - Pure Concurrent Attitude Theories (e.g., desire frustration at time t requires existence at t).  
      - Theories where badness is essentially motivating (no motivation exists post-hoc).

  ---

  ### **Brief Theory Scorecard**

  | Theory               | D1 (Asymbolia)                     | D2 (Reflective)                     | D3 (Past Pain)                      | D4 (Sensory-Affect Dist.) | Key Challenge                          |
  | :------------------- | :--------------------------------- | :---------------------------------- | :---------------------------------- | :------------------------ | :------------------------------------- |
  | **Simple Hedonism**  | FAIL: Pain=sensation=bad, so bad.  | FAIL: Bad if sensation present.     | FAIL: No conscious state = not bad. | FAIL: Collapses components. | Fails D1, D3, D4, D6.                  |
  | **Evaluativism**     | PASS: Badness= evaluation of threat; absent in asymbolia. | PASS: Judgment ≠ evaluation; badness requires evaluation. | FAIL: Evaluation requires a valuer *present*. | PASS: Explicitly separates components. | Struggles with D3 (past evaluations?) & D8 (fish?). |
  | **Imperativism**     | PASS: Badness=unfulfilled command; asymbolia = command ignored. | PASS: Reflective judgment ≠ imperative force. | FAIL: Commands require a commander *present*. | PASS: Commands map to motivation. | Struggles with D3 & non-command badness (e.g., sadness). |
  | **Attitudinal Theories** | PASS: Bad if disvalued; asymbolia lacks attitude. | AMBIG: Reflective judgment may constitute attitude? | FAIL: Attitudes must exist when pain exists. | PASS: Attitudes map to affect. | Fails D3; struggles with D2 & D6 (intensity independence). |

  ---

  ### **Summary**
  A theory must **non-negotiably** explain asymbolia (D1), reflective asymbolia (D2), past pain (D3), and respect sensory-affective (D4), pain-suffering (D5), and intensity-badness (D6) dissociations while fitting the empirical data (E1,E2). The biggest hurdle is **D3 (Unremembered/Past Pain Badness)**, which demands badness without present experience or attitudes, excluding many popular models. The central tension forces a choice between phenomenal supervenience (prioritizing sensation) and attitudinal/relational accounts (prioritizing motivational/judgmental response), with most recent theories favoring the latter due to the weight of D1 and D3.
