prompt: |-
  I host a small philosophy podcast and next week's guest is a hardcore utilitarian who thinks supererogation is a myth. Her line is basically that once you rank acts by the good they do, the whole idea of acts that are praiseworthy to do but not wrong to skip just collapses — either doing the better act is required, or the acts are morally on par and the rest is taste. Draft me eight to ten interview questions that actually press on this instead of letting her restate it. Requirements:

  - At least one question built around the classic case of a soldier throwing himself on a grenade to save his squad. Does her view really entail that whoever can do it at least cost is obligated to? And if she bites that bullet, I want a follow-up about whether it's still supererogation in any recognizable sense once it's just the demanded optimum.
  - At least one question on the standard picture of supererogation — optional, beyond duty, praiseworthy when done, no blame when omitted — and whether she can keep the praiseworthiness part while dumping the optionality part.
  - One question on the mirror-image category, suberogation: acts that are boorish or uncalled-for without being wrong (a mild slight you had every right to commit, so to speak). If she accepts that asymmetry-free utilitarian ranking of acts, suberogation should be just as unreal as supererogation — is she really willing to say that?
  - One question pressing a thought a friend of mine had that I can't get out of my head: a "moral savings account" idea, where heroic acts build up credit that an agent can later cash in to justify doing less than her fair share without being blamed. If utilitarians can't make sense of that banking intuition (and it seems like they can't, since on her view the heroic act was owed anyway), maybe that's evidence something's gone wrong somewhere — either with the banking intuition or with her ranking.

  For each main question, add a follow-up keyed to the answer she's most likely to give (she's fond of saying the felt difference between the obligatory and the heroic is just a fact about our psychology, not about duty). No generic stuff about how she got into philosophy or her new book or whatever, I realy want this one to hurt.
reasoning: |-
  Okay, let me tackle this request for a podcast interview questions targeting a hardcore utilitarian who denies supererogation. The host wants sharp, pressing questions that force the guest to confront implications rather than restating her position.

  First, I need to cover all specified requirements: the grenade case, praiseworthiness without optionality, suberogation asymmetry, and the moral savings account idea. Each question needs a surgical follow-up anticipating her likely "it's just psychology" rebuttal.

  For the grenade scenario, I'll frame it to expose the obligation bullet she must bite - if the soldier can save net utility at lowest cost, is he obligated? The follow-up must challenge whether "obligatory heroism" strips the act of its essence. I'll use visceral language like "demanded optimum" to unsettle the intuition.

  On praiseworthiness, I'll question how utilitarianism can retain moral praise if the act was already required. Her probable response about psychological heuristics needs countering with whether praise becomes merely pragmatic rather than moral. That distinction could sting.

  The suberogation angle is clever - if she dismisses "bad but not wrong" acts as impossible under strict ranking, does that mean all minor offenses are equally blameworthy? The follow-up should press whether this flattens moral texture to absurdity.

  For the moral savings account, I'll highlight how utilitarianism can't bank heroic acts since they're baseline obligations. The follow-up must corner her on whether this exposes a flaw in utilitarianism or in common intuition, forcing her to dismiss widespread moral reasoning.

  I'm structuring each main question with a concrete example or paradox, followed by a scalpel-like follow-up targeting her go-to moves. No softballs - every question should make the audience lean in. The tone stays professionally brutal, dissecting ideas without personal attacks. 

  The goal is to trap her in the implications: if throwing yourself on grenades is obligatory, if praise is just psychological fluff, if etiquette vanishes into morality, and if moral bookkeeping is nonsense - does her utilitarianism devour too much of our ethical universe?
answer: |-
  Here are 10 tightly focused questions designed to press the core tensions in her view, incorporating your requirements and anticipating her likely responses with pointed follow-ups:

  1.  **The Grenade Case & Obligation:** "Take the soldier diving on the grenade. Your view seems to imply that if Soldier A calculates they can survive the blast with non-fatal injuries (say, losing a leg) while saving 5 comrades, then Soldier A is *morally obligated* to do it – because it maximizes expected utility at the least 'cost' to the overall system. Is that correct? Is that soldier *failing in their duty* if they hesitate or fail to act?"  
      *   *Likely Response Anticipation (LRA): "Yes, given the utility calculus, it becomes obligatory for the agent best positioned to minimize net harm."*  
      *   **Follow-Up:** "If that's obligatory, how is it still 'heroic' or 'supererogatory' in any meaningful sense? Isn't 'heroism' conceptually dependent on going *beyond* what's strictly demanded? Doesn't reducing it to the 'demanded optimum' drain the act of the very quality (surpassing duty) that makes us call it supererogatory in the first place?"

  2.  **Praiseworthiness Sans Optionality:** "You grant that the grenade diver is praiseworthy. But on your view, isn't praise *solely* a psychological tool or social reinforcement mechanism to encourage utility-maximizing behavior? If the act was *required* by duty (as you argued), does 'praiseworthiness' retain any distinct *moral* content, or is it purely pragmatic – essentially just saying 'good job doing your job'?"  
      *   *LRA: "Praise functions to reinforce beneficial behaviors; its 'moral' feel is an evolved heuristic."*  
      *   **Follow-Up:** "If praise is just a behavioral nudge, does that mean we should *also* praise people lavishly for paying their taxes or not stealing (basic duties), using the same psychological mechanism? Doesn't collapsing the distinction between praising duty-fulfillment and praising (what others call) supererogation undermine the unique *moral significance* we intuitively attach to praise for extreme sacrifices?"

  3.  **The Suberogation Mirror:** "If supererogation is a myth because acts are either obligatory, forbidden, or morally indifferent, what about *suberogation*? Consider acts like making a mildly sarcastic remark you had every right to make, or taking the last slice of pizza when no one else objected. These feel 'boorish' or 'uncalled-for' but not *wrong*. Does your utilitarian ranking allow for this category, or must every sub-optimal act (relative to the best available) be considered *blameworthy* to some degree?"  
      *   *LRA: "Minor utility deficits might not warrant active blame/punishment due to costs of enforcement, but they are still technically sub-optimal/morally inferior."*  
      *   **Follow-Up:** "So, on a strict reading, is the mildly sarcastic comment, because it causes a tiny, fleeting net utility loss compared to gracious silence, *morally equivalent in kind* (just vastly lesser in degree) to a serious betrayal? Doesn't this flatten the moral landscape absurdly, failing to capture the intuitive difference between 'impolite' and 'immoral'?"

  4.  **The Moral Savings Account Challenge:** "A listener proposed this: Imagine a firefighter performs several genuinely heroic rescues (by common-sense standards). Later, feeling burnt out, they do only the bare minimum required by duty for a period – perhaps skipping optional community outreach. The intuition is they've 'banked moral credit' and deserve less blame (or even praise-neutrality) for this minimal phase. How does utilitarianism handle this? Can performing past 'heroic' acts (which you say were *owed*) justify later performing *below* the utility-maximizing optimum without blame?"  
      *   *LRA: "No. Each act is judged independently by its consequences. Past acts don't change the utility calculus of present options. Doing less than the best now is still sub-optimal, regardless of past heroics."*  
      *   **Follow-Up:** "Given how powerful this 'moral savings' intuition is for many people, does its complete incompatibility with utilitarianism suggest a flaw in the theory (perhaps by failing to account for agent-relative costs, virtue, or fairness over time), or is it purely evidence of a widespread cognitive error in moral reasoning that utilitarianism correctly diagnoses?"

  5.  **The Psychological Dodge - Scope:** "You often attribute the *feeling* of supererogation to psychological limitations – we can't expect constant maximal sacrifice. But doesn't this just push the problem back? *Why* does fulfilling our demanding utilitarian duty *feel* like going beyond duty? Shouldn't a correct moral theory align better with our reliable moral phenomenology, or are you saying our core moral experiences are systematically misleading about the structure of morality itself?"  
      *   *LRA: "Evolution/nature shaped our intuitions for a different environment; they aren't reliable guides to true moral theory."*  
      *   **Follow-Up:** "If our core moral experiences (like perceiving supererogation) are so systematically unreliable regarding fundamental structure (obligation vs. supererogation), what independent reason do we have to trust *any* of our moral intuitions, including the intuition that maximizing utility is the sole fundamental good? Doesn't this risk radical skepticism?"

  6.  **Cost-Benefit & the "At Least Cost" Obligation:** "Extending the grenade case, does your 'obligation falls on the one who can do it at least cost' principle generalize? If a billionaire can save 100 lives by donating $1 million (a trivial cost to them), are they *obligated* to do so? If a healthy person is the only match for a dying child's organ transplant, are they obligated to donate (assuming survival)? If not, how do you draw the line without smuggling in optionality?"  
      *   *LRA: "Yes, in principle, if the net utility gain outweighs the cost to the agent, it's obligatory. Practical constraints or uncertainty might modify specific cases."*  
      *   **Follow-Up:** "Doesn't this lead to a world where *everyone* capable of providing a significant net utility gain at a 'bearable' personal cost is perpetually obligated to do so, leaving no conceptual space for acts that are genuinely 'more than required'? Isn't this phenomenologically and practically oppressive, reducing morality to a crushing calculus of constant maximal output?"

  7.  **Demandingness and the Collapse:** "A common critique of utilitarianism is its extreme demandingness. You counter that supererogation doesn't solve this; it just hides the true demand. But isn't the *conceptual distinction* itself crucial? Doesn't eliminating the category of the 'beyond duty' *intensify* the demandingness problem by making *every* failure to maximize, however minor or costly, a *failure of duty* (i.e., morally wrong), rather than just a failure to be exceptionally good?"  
      *   *LRA: "The demandingness is inherent in the goal of maximizing good. Calling some acts 'supererogatory' is just self-deception to avoid the full implication."*  
      *   **Follow-Up:** "But doesn't labeling *all* sub-maximization as *wrong* fundamentally alter the moral character of the agent and the social response? Doesn't it turn someone who is merely 'not exceptionally saintly' into someone who is perpetually *sinning* by omission, creating a world of universal blameworthiness outside the single optimal act? Is that a plausible or functional picture of moral life?"

  8.  **Virtue and Character:** "Supererogation is often linked to virtues like heroism, saintliness, or extraordinary generosity. If these acts are simply *duties* on your view, what happens to these virtues? Does 'heroism' just become 'extreme dutifulness'? Does this collapse diminish our understanding of moral character and the special admiration we feel for those who seem to go beyond the call?"  
      *   *LRA: "Virtues are dispositions to reliably perform utility-maximizing acts. Admiration is a useful motivator."*  
      *   **Follow-Up:** "But if the firefighter who runs into the burning building was just doing their strict duty, and the billionaire donating millions was just doing theirs, is there *any* space left for a virtue like 'greatness of soul' or 'heroic virtue' that signifies something *more* than standard duty-fulfillment? Doesn't utilitarianism reduce all virtue to reliable conformity to a single demanding rule?"

  9.  **The "On Par" Option & Taste:** "When acts are morally on par utility-wise, you say the rest is taste. But consider two doctors: one donates a kidney to a stranger (high cost, high good), the other spends their career meticulously doing slightly more good in a low-risk public health role (lower cost per unit time, same lifetime net good). Common sense sees the kidney donor as supererogatory, the public health doctor as highly dutiful. If they are 'on par', is the *only* difference between them really just personal taste, like preferring chocolate to vanilla? Doesn't this ignore the profound difference in the *nature* of the sacrifice and the character it reflects?"  
      *   *LRA: "The net outcome is identical; different paths reflect different preferences/tolerances."*  
      *   **Follow-Up:** "Doesn't reducing the kidney donor's extraordinary, one-off bodily sacrifice to a mere matter of 'taste' compared to the public health doctor's sustained, lower-intensity effort completely fail to capture the moral psychology and social meaning of such radical acts? Doesn't it erase the qualitative difference we perceive between enduring hardship and choosing radical self-alteration?"

  10. **The Burden of Proof:** "Finally, given that the concept of supererogation is deeply embedded in common moral thought, law (e.g., Good Samaritan laws often imply non-obligation), and major ethical traditions, and given the significant counter-intuitive consequences of its elimination that we've discussed (universal blameworthiness for non-maximization, collapsing virtues, erasing the heroic/saintly, flattening the moral landscape), isn't the burden of proof very high on your claim that it's a complete myth? What decisive argument or evidence compels us to accept such a radical revision of our moral concepts?"  
      *   *LRA: "The simplicity and coherence of utilitarianism, and the lack of a non-arbitrary line between duty and supererogation, prove the concept is incoherent."*  
      *   **Follow-Up:** "But doesn't utilitarianism itself face massive coherence problems (e.g., demandingness, personal integrity, distribution of burdens)? And if the 'arbitrary line' is the problem, isn't your alternative – that the line is always drawn *precisely* at the single utility-maximizing act, *unless* multiple acts tie, in which case all non-optimal acts are wrong – just as arbitrary, but with far more revisionist consequences? Why prefer *that* arbitrariness?"

  These questions force engagement with the concrete implications of denying supererogation, challenge the adequacy of reducing everything to ranking and psychology, press on asymmetries (like suberogation), and target the counter-intuitive burdens her view imposes. The follow-ups directly confront her anticipated moves, pushing her to defend the real-world plausibility and moral phenomenology of her position. Good luck with the interview – it sounds like it will be a fiery one!
