answer: |-
  Here is a specification for an adequate decision theory, focusing on desiderata, their motivations, and potential conflicts. The goal is to establish what a decision theory *must* achieve, the cases it *should* handle, and the structural properties it *ideally* possesses.

  **Core Purpose of a Decision Theory:**
  A decision theory is a formal system for selecting actions to achieve an agent's goals under uncertainty. Its **non-negotiable core function** is to prescribe actions that reliably promote the agent's objectives, given its knowledge and beliefs.

  ## I. Case-Based Desiderata (Must Handle Correctly)
  These are benchmark problems. "Correctly" means prescribing actions that reliably achieve the agent's goals *in the specific scenario as described*, acknowledging that real-world analogs might be messy.

  1.  **Newcomb's Problem (Perfect Predictor):**
      *   **Scenario:** A perfectly reliable predictor places £1,000,000 in Box B only if it predicts you will take only Box B. It places £1,000 in Box A regardless. You know this setup.
      *   **Correct Action:** Take only Box B (One-Box).
      *   **Motivation:** Taking only Box B reliably yields £1,000,000. Two-boxing reliably yields only £1,000. The predictor's perfection makes your choice evidence of the past state of Box B. Goal achievement demands exploiting this correlation.
      *   **Negotiability:** **Non-Negotiable.** Failing this means the theory systematically leaves massive, reliably attainable rewards on the table in predictable scenarios.

  2.  **Death in Damascus (Self-Fulfilling Prophecy / Symmetric Dependence):**
      *   **Scenario:** Death, a perfect predictor, is waiting in one city (Damascus or Aleppo). You meet Death in Damascus, inferring he expected you in Aleppo. Whichever city you flee to, Death will be there.
      *   **Correct Action:** Flip a coin (or be indifferent) about fleeing to Aleppo or staying in Damascus.
      *   **Motivation:** Any deterministic choice ensures Death is in your chosen city. Randomization gives a 50% survival chance, strictly better than 0%. The outcome causally depends on your choice *and* the prediction of your choice.
      *   **Negotiability:** **Non-Negotiable.** Failing this means the theory prescribes a dominated strategy (0% survival) when randomization is strictly superior.

  3.  **Counterfactual Mugging (Commitment to Counterfactual Fairness):**
      *   **Scenario:** A fair coin is flipped in secret. If Heads, Omega gives you £10,000. If Tails, Omega asks you for £100. You only learn the outcome if Tails (the "mugging").
      *   **Correct Action:** Pay the £100 if mugged (Tails).
      *   **Motivation:** From an *ex ante* perspective (before knowing the coin flip), committing to pay if Tails has an expected value of [0.5 * £10,000 + 0.5 * (-£100)] = £4,950. Refusing to pay has an expected value of [0.5 * £10,000 + 0.5 * £0] = £5,000. However, refusing exploits Omega's counterfactual generosity only on Heads and reneges on the implicit counterfactual agreement on Tails. Failing to pay means Omega wouldn't offer the £10,000 on Heads in structurally similar repeated or pre-coordinated situations. Paying maintains the beneficial counterfactual relationship.
      *   **Negotiability:** **Highly Desirable / Debatably Non-Negotiable.** The necessity hinges on whether the theory needs to handle agents/processes (like Omega) that condition actions on predictions of the agent's behavior *in counterfactual scenarios*. Failing this might indicate vulnerability to exploitation by such agents or inability to secure pre-commitment benefits.

  4.  **Medical Newcomb/Smoking Lesion (Distinguishing Causation & Correlation):**
      *   **Scenario:** A lesion causes both a strong desire to smoke and lung cancer. Smoking itself causes no harm. You enjoy smoking. You don't know if you have the lesion.
      *   **Correct Action:** Smoke (if you enjoy it).
      *   **Motivation:** Smoking provides pleasure at no causal cost. Your desire to smoke is *evidence* of the lesion (and hence cancer), but *not causing* cancer. Avoiding smoking avoids the evidence (pleasure) but doesn't prevent the cancer. Goal achievement requires acting on causal levers, not merely avoiding evidence of bad news.
      *   **Negotiability:** **Non-Negotiable.** Failing this means the theory prescribes harmful self-denial based purely on spurious correlation, ignoring the actual causal structure. It confuses evidence with cause.

  ## II. Structural Desiderata (Ideal Properties)
  These are general principles an ideal theory should satisfy.

  5.  **No Paying to Avoid Costless Information:**
      *   **Requirement:** An agent should never strictly prefer to avoid receiving costless, truthful information relevant to its decision before acting.
      *   **Motivation:** More information cannot *hurt* the ability to achieve goals (it might reveal opportunities or threats); it can only help or be neutral. Paying to avoid it suggests the theory is confused about evidence vs. causality (like in the Smoking Lesion) or creates perverse incentives.
      *   **Negotiability:** **Non-Negotiable.** Violating this indicates a fundamental flaw where ignorance is seen as instrumentally valuable, contradicting the core purpose of making good decisions based on available knowledge.

  6.  **Stability Under Precommitment & Self-Endorsement:**
      *   **Requirement:**
          *   a) An agent should sometimes find it beneficial to precommit to a future course of action.
          *   b) When the precommitted time arrives, the agent (with its updated knowledge) should endorse following through on the precommitment.
      *   **Motivation:** Precommitment is a crucial tool for overcoming time inconsistency, temptation, or coordination problems (e.g., Ulysses and the Sirens, mutually assured destruction). If the future self regrets the precommitment, it suggests the precommitment wasn't actually optimal *ex ante* or the theory fails to account for the benefits binding oneself provides across time.
      *   **Negotiability:** **Highly Desirable / Debatably Non-Negotiable.** Essential for modeling sophisticated, temporally extended agency. However, the *degree* of binding power and the exact conditions for regret-free precommitment can be debated.

  7.  **Non-Exploitability (by Predictable Adversaries):**
      *   **Requirement:** An agent should not be systematically exploitable (lose value relative to a better strategy) by another agent who can perfectly or highly accurately predict its behavior.
      *   **Motivation:** Agents exist in environments containing other agents or processes capable of modeling them (markets, adversaries, mechanisms like Omega). A theory prescribing rigidly exploitable behavior is inadequate for real-world strategic interaction.
      *   **Negotiability:** **Highly Desirable.** Crucial for robust agency in strategic environments, but perfect non-exploitability against all conceivable predictors might be too strong.

  8.  **Well-Defined Counterfactuals:**
      *   **Requirement:** The theory must provide a coherent and consistent method for evaluating the consequences of actions the agent *did not* take ("what if I had chosen differently?").
      *   **Motivation:** Evaluating alternatives is fundamental to decision-making. Many problems (Newcomb, Counterfactual Mugging, Precommitment analysis) explicitly rely on counterfactual reasoning. Ambiguity here leads to inconsistent prescriptions.
      *   **Negotiability:** **Non-Negotiable.** A decision theory without clear counterfactuals is incoherent.

  9.  **Implementability (in Principle):**
      *   **Requirement:** The theory should prescribe actions that a sufficiently powerful (though possibly bounded) computational agent could, in principle, calculate given its knowledge base and goals.
      *   **Motivation:** The theory must be *action-guiding*, not just a normative ideal. It must connect beliefs and desires to concrete choices via a definable procedure.
      *   **Negotiability:** **Non-Negotiable (in principle).** The theory must be computationally definable, even if intractable for real agents. Tractability for bounded agents is a separate (important) engineering concern.

  ## III. The Inherent Tension: Where Desiderata Conflict

  Your suspicion is **correct**. There is a fundamental conflict between a subset of these desiderata:

  *   **Requiring One-Boxing in Newcomb (D1):** Demands the agent act on the correlation (evidence) provided by the predictor.
  *   **Requiring Smoking in Smoking Lesion (D4):** Demands the agent *ignore* a harmful correlation and focus only on causal impact.
  *   **No Paying to Avoid Costless Information (D5):** Forbids the agent from avoiding knowledge of its own desires/state if freely offered (e.g., avoiding a free lesion test).
  *   **Stability Under Precommitment & Self-Endorsement (D6):** Requires that precommitments made *ex ante* (e.g., "always one-box") are followed *ex post* even when local causal reasoning might suggest defection (e.g., "but Box A has £1000 right there!").

  **The Conflict Matrix:**

  1.  **D1 (One-Box) vs. D4 (Smoke) & D5 (No Info Avoidance):** How can a theory both prescribe acting on evidence/correlation (One-Box) and *not* acting on evidence/correlation (Smoke), while also never avoiding information? Theories that pass Newcomb (EDT, FDT) often fail Smoking Lesion *unless* they have a flawed causal model. Theories that pass Smoking Lesion (CDT) fail Newcomb. Theories that avoid information to "solve" both (e.g., an EDT agent avoiding the lesion test) violate D5.
  2.  **D1 (One-Box) & D3 (Pay Mugging) vs. D6 (Self-Endorsement):** Precommitting to One-Box or Pay the Mugging is beneficial *ex ante*. However, *at the moment of choice in Newcomb*, CDT reasoning ("I have the money, taking Box A gets me £1000 extra") suggests defecting from One-Boxing. *At the moment of the mugging*, CDT reasoning ("The coin is Tails, I already lost, paying gets me nothing") suggests defecting from paying. A theory satisfying D1 and D3 *requires* the agent to act against this local CDT logic. **Self-endorsement (D6b) is the challenge:** Can the theory make the agent, *at the moment of choice*, genuinely endorse following the precommitment, feeling it's the *right* thing to do *now*, not just something past-me forced? Theories like FDT aim for this, but it's philosophically deep.
  3.  **D2 (Randomize in Damascus) vs. CDT Intuition:** Deterministic CDT struggles here, needing randomization to avoid the 0% outcome. While not a direct conflict with other desiderata, it highlights the limitations of purely local causal reasoning (CDT) in prediction loops.

  **Conclusion on Conflict:** There is **no known decision theory that satisfies all desiderata D1-D6 simultaneously without significant caveats or philosophical reinterpretation.** The core tension lies in reconciling the need to:

  *   **Respect evidence/correlation** when it reliably indicates outcomes determined by actions dependent on that evidence (Newcomb, Mugging),
  *   **Ignore evidence/correlation** when it's purely diagnostic and not causal (Smoking Lesion),
  *   **Never avoid information** that could improve decisions,
  *   **Commit credibly to future actions** that may seem locally suboptimal, and
  *   **Endorse those commitments** when the time comes.

  Theories make different trade-offs:
  *   **CDT (Causal):** Sacrifices D1 (fails Newcomb), often struggles with D2 & D3 (Mugging), but satisfies D4 (Smoke) and D5 (No Info Avoidance). Self-endorsement (D6) is easy locally but fails globally.
  *   **EDT (Evidential):** Sacrifices D4 (fails Smoking Lesion - avoids smoking/info), D5 (would pay to avoid lesion test), and often D6b (regrets precommitments). Satisfies D1 (One-Box), often D2 & D3 conceptually (but struggles with action).
  *   **FDT/UDT (Functional/Updateless):** Aims to satisfy D1, D2, D3, D6 by viewing the agent as a *function* across all possible decision nodes. Sacrifices strict locality and intuitive causality (making D4/D5 tricky - it might "Smoke" but for abstract functional reasons, not direct causal reasoning). Implementability (D9) is a significant challenge.

  **Scoring Key Takeaway:** Before arguing whether CDT, EDT, or FDT is "better," you and your friend must agree on which desiderata are truly non-negotiable *for the purpose of achieving an agent's goals under uncertainty*. The conflict between D1, D4, D5, and D6 is fundamental. Clarifying *why* you each prioritize different desiderata (e.g., is causal purity more important than securing Newcomb's reward? Is avoiding spurious correlation more important than paying a counterfactual mugging?) is likely more productive than rehashing the Newcomb choice itself. The specification reveals that the disagreement is ultimately about what properties a *good* guide to action must possess.
