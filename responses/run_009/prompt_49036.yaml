  I should verify if these are indeed incompatible. CDT two-boxes in Newcomb but loses, while EDT one-boxes but avoids info in medical cases. UDT might handle counterfactual mugging but requires complex counterfactuals. The tension between avoiding information and making optimal decisions in predictor scenarios seems real. Also, precommitment in symmetric dilemmas like Death in Damascus might lead to regret, challenging self-endorsement.

  Need to present these conflicts clearly, showing why satisfying all might be impossible. Highlight which desiderata are non-negotiable (like goal achievement) versus negotiable (like implementability details). Also, note that some cases might be edge cases, so their necessity could be debated.

