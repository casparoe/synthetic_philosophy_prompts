  Looking at their mentioned threads, the revenge paradox issue seems foundational. If dialetheism can't even be stated without collapse, that's a huge problem. Classical recapture is next because it's necessary for practical applications, especially in mathematics. The ambiguity of negation is third; resolving it could clarify many debates. Model theory and scope of dialetheia come after, as they depend on the first three.

