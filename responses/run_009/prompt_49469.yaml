prompt: |-
  Hey — you're a philosopher of statistics who's spent way too long in the weeds of the frequentist/Bayesian wars but can still talk to normal humans. I need you to think carefully before answering, and I mean actually carefully: start by brainstorming before you commit to anything.

  So here's my situation. I'm a journalist, I cover science and ideas, and I'm working on a long feature pegged to roughly a decade of the replication crisis being mainstream. Everyone I interview has a take: ditch p-values, preregister everything, go full Bayes, keep frequentism but teach it better, abandon significance entirely, etc. etc. Before I do the interviews I want to get the spec straight in my own head. What would an adequate account of statistical evidence — some theory of what the numbers from a study actually tell you — have to deliver to count as adequate? Not "which camp wins," but the requirements list, the things any view has to get right or it's disqualified.

  Brainstorm first, then prune — I want to see you generate a big pile of candidate demands people make in this debate, including the ones you'll end up throwing out as tribal shibboleths rather than genuine requirements, and then cut them with a word on why. The real list I want the requirements plus the motivating case behind each, and for each one mark whether it's non-negotiable or a preference of one camp pretending to be a universal demand. Two requirements I do want on the table somewhere, because they're where I keep getting lost: (1) does the theory have to say something about whether THIS result is evidence, or only about whether the procedure that produced it is reliable, and what exactly is at stake in that choice — like, does it change what a stopping rule can do to your conclusions; (2) whatever the theory says about a single study, does it handle selection — the fact that published effects are inflated even when nobody cheated, because of how many ways there are to analyze data and which ones reach print. And here's a concrete case I'd like the requirements to actually adjudicate, because it's the kind of thing my readers hit constantly: original study reports p = 0.03 with 80 participants; a much bigger direct replication, 800 participants, gets a point estimate about a third the size with p = 0.08. Was the original finding "an effect that's just smaller than advertised," or "a failed replication"? If your requirements list can't help a reader tell those apart, it's not done. I'm also curious whether preregistration is epistemically load-bearing on your list or just bookkeeping — like, does the theory have to treat the same data differently depending on the analysis plan that was fixed in advance?

  Then the part I most want: tell me honestly whether some subset of the requirements is jointly unsatisfiable. I have a suspicion that the single-case-evidence demands and the procedure-reliability demands can't both be fully met, and if that's right, say so plainly — that's the actual news, arguably.

  Give it to me in this structure, sections in this order:

  1. **Brainstorm dump** (~150 words) — the candidate demands, including the junk, no editorializing yet.
  2. **The spec** (~600 words) — the pruned requirements, each with its motivating case, each marked non-negotiable vs camp preference.
  3. **The test case** (~150 words) — what the spec says about my p = 0.03 / p = 0.08 replication, and whether the answer is the same for a Bayesian and a frequentist who both accept the spec.
  4. **Where it bites** (~200 words) — any jointly unsatisfiable subset, or a clean statement that there isn't one and why you believe that.
  5. **Quick scorecard** (~150 words) — error-control frequentism, subjective Bayes, and whatever you'd call the preregistration-first "just do honest science" position, each against the list. Brief, this is the least important part.
  6. **What I can quote you on** (one sentence, plain English, something a reader who has never heard of the likelihood principle can repeat at dinner).

  Don't pad. If two requirements are really one requirement wearing a hat, merge them. And please dont hedge everything into mush — I'm a journalist, definately not a statistician, but I can smell a dodge.
reasoning: |-
  Okay, let me tackle this step by step. First, I need to understand the journalist's request: they want a clear framework for evaluating statistical evidence theories, focusing on what's essential rather than partisan preferences. The key challenges are handling single-study evidence vs. procedural reliability, selection effects, and adjudicating their replication case study.

  Hmm... the user's background matters here. As a science journalist covering the replication crisis, they need concrete, actionable criteria - not academic waffling. Their frustration with tribal debates is palpable. The unspoken need seems to be: "Help me cut through the noise so I can explain why some solutions work and others don't."

  For the brainstorm dump, I should list every demand I've heard in these debates - even the contradictory ones. Obvious candidates include objectivity, error control, handling optional stopping, incorporating prior knowledge... but also tribal shibboleths like "must use Bayes factors" or "must ban p-values". The trick will be separating genuine epistemic needs from ideology.

  The spec section needs ruthless pruning. Non-negotiables would be things like "must prevent misleading interpretations of single results" (motivated by p-hacking disasters) and "must account for selection effects" (addressing publication bias). Camp preferences might include demands for unique numerical answers or requiring subjective priors. Each requirement needs a concrete "why this matters" case - like the garden of forking paths problem for why flexibility in analysis must be constrained.

  For the test case... that p=0.03 vs p=0.08 scenario is perfect. A good spec must force us to say: under what conditions is the smaller effect "real but diminished" versus "artifact"? The answer should reveal if a theory handles measurement error and selection bias properly. Notably, Bayesians and frequentists might agree here if both account for multiple comparisons.

  Where it bites... ah, this is critical. I suspect the tension between "must evaluate this particular result" (likelihood principle) and "must control long-run errors" is fundamentally unresolvable. That's the journalist's "actual news" - we have to choose which guarantee to prioritize. Preregistration becomes the bridge, sacrificing some flexibility for verifiability.

  For the scorecard, I'll compare three approaches briefly: 
  - Frequentism (strong on error control but weak for single studies) 
  - Subjective Bayes (handles single cases but priors can be contested) 
  - Preregistration-focused (avoids selection bias but incomplete alone)

  The quote needs to be memorable: probably something about how no statistical method can compensate for non-random silence in the scientific record. That captures the selection effect problem vividly.

  Throughout, I must avoid hedging - hence the blunt language about "unresolvable tension" and "tribal shibboleths". The journalist wants clarity, not false consensus.
answer: |-
  ### 1. **Brainstorm Dump** (~150 words)  
  Candidate demands: Must control long-run error rates; must quantify evidence for *this* hypothesis given *this* data; must incorporate prior knowledge; must be objective/intersubjective; must handle multiple comparisons implicitly; must be robust to data-dependent analysis (e.g., stopping rules, peeking); must work with small samples; must avoid subjective priors; must produce actionable decisions; must distinguish "no effect" from "small effect"; must account for publication bias/selection effects; must be computationally feasible; must support meta-analysis; must separate design from analysis; must assign probabilities to hypotheses; must be teachable; must prevent p-hacking; must validate models with data; must avoid false precision; must require preregistration to "lock in" analyses.

  ### 2. **The Spec** (~600 words)  
  **Non-Negotiables (Genuine Requirements):**  
  - **Control Misleading Conclusions** (Error Control): *Why*: Prevents false claims (e.g., "effective" drugs that aren’t). Frequentist Type I/II errors or Bayesian posterior calibration must limit how often procedures mislead. *Status*: Non-negotiable.  
  - **Quantify Evidence for *This* Dataset** (Evidential Meaning): *Why*: Scientists (and readers) ask "What does *this* study show?" A theory must say whether data supports H1 over H0 here, not just in hypothetical repeats. *Status*: Non-negotiable.  
  - **Account for Selection Effects** (Selection Robustness): *Why*: Published literature filters results (p-hacking, file drawer effect). A theory must address how selection inflates effects. *Status*: Non-negotiable.  
  - **Handle Data-Dependent Actions** (Stopping Rules/Peeking): *Why*: Researchers peek at data or stop early. A theory must not let identical data support opposite conclusions based on unobserved intentions. *Status*: Non-negotiable.  
  - **Distinguish "No Effect" from "Small Effect"** (Sensitivity): *Why*: Crucial for replication (your test case). A theory must separate statistical insignificance from genuine nulls. *Status*: Non-negotiable.  

  **Camp Preferences (Often Disguised as Universal):**  
  - "Must Use Prior Probabilities" (Bayesian shibboleth): *Why*: Subjective priors aren’t always feasible/agreed upon; objective Bayes has its own issues. *Status*: Preference.  
  - "Must Ban p-Values" (Reformist shibboleth): *Why*: p-values misused ≠ p-values useless. Better teaching/context can help. *Status*: Preference.  
  - "Must Yield Unique Decisions" (Decision-theoretic demand): *Why*: Science is iterative; evidence isn’t always decisive. *Status*: Preference.  
  - "Preregistration as Epistemic Necessity": *Why*: Preregistration combats selection bias (non-negotiable), but doesn’t alter evidential meaning of data *itself* (e.g., likelihood principle). *Status*: Tool for robustness, not a requirement of the theory itself.  

  ### 3. **The Test Case** (~150 words)  
  Original: *n* = 80, *p* = 0.03, effect size E1.  
  Replication: *n* = 800, *p* = 0.08, effect size ~E1/3.  
  - **Adequate Spec Says**: Likely a small true effect (not null), inflated in original study. *Why*:  
    1. **Selection Robustness**: Original *p* = 0.03 is easily cherry-picked (many similar studies get filed away).  
    2. **Sensitivity**: Replication’s larger *n* detects E1/3 but misses significance threshold – suggesting original overestimated magnitude.  
    3. **Evidential Meaning**: Original data *is* weak evidence for a moderate effect, but replication shows it’s weaker than it appeared.  
  - **Bayesian vs. Frequentist**: Both *can* agree if they use the spec. Bayes: Posterior distribution shifts toward smaller effect after replication. Frequentist: CI from replication excludes original effect size but not zero. Both flag selection bias in original.  

  ### 4. **Where It Bites** (~200 words)  
  **The Unresolvable Tension**:  
  - **Evidential Meaning** (likelihood principle) *requires* that identical data yields same evidence, ignoring stopping rules.  
  - **Error Control** *requires* accounting for stopping rules (peeking inflates Type I errors).  
  **Why They Clash**: Evidence from *this data* vs. reliability of *the process* are fundamentally different goals. You *cannot* simultaneously satisfy both fully.  
  - *Consequence*: Theories must prioritize. Bayesianism favors evidential meaning (ignores stopping rules). Frequentism favors error control (penalizes peeking). Preregistration mitigates by fixing the process upfront.  
  **The Trade-off**: If you demand evidence about *this experiment* (e.g., "Is *this* drug working?"), you sacrifice strict long-run guarantees. If you demand lifetime false-positive control, you sacrifice direct evidence from individual studies.  

  ### 5. **Quick Scorecard** (~150 words)  
  - **Error-Control Frequentism** (e.g., Neyman-Pearson):  
    ✓ Error control, selection robustness (via alpha), sensitivity (power).  
    ✗ Weak on evidential meaning (avoids "evidence for *this*"), rigid on stopping rules.  
  - **Subjective Bayes** (e.g., Bayesian inference):  
    ✓ Evidential meaning, handles stopping rules, distinguishes small/no effects.  
    ✗ Prior choice subjective, struggles with selection bias (unless model includes it).  
  - **Preregistration-First Reform** ("Just do honest science"):  
    ✓ Forces selection robustness, enables error control.  
    ✗ Not a statistical theory; defers evidential meaning to other methods.  

  ### 6. **What I Can Quote You On**  
  > **"No statistical method can turn a single study into lasting truth; evidence must account for how easily silence becomes noise in the scientific record."**
