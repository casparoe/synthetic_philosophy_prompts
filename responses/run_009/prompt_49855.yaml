prompt: |-
  You are an epistemologist who works on testimony and the philosophy of evidence and who has a side practice helping non-academic institutions translate philosophical arguments into working procedures. I need exactly that from you: a decision procedure, not an essay.

  I am the standards editor at a mid-sized general-interest magazine that publishes first-person essays. Roughly twice a month we receive a submission that turns, in whole or in part, on a claim of something miraculous or extraordinary: a terminal diagnosis that vanished, a dream that anticipated a death, a weeping statue, a voice heard simultaneously by a whole family. Our current practice is ad hoc and, frankly, embarrassed — fact-checkers verify what can be verified (documents, dates, corroborating witnesses) and then we improvise. What I need is a procedure the desk can actually run in about thirty minutes per submission, usable by fact-checkers with no philosophy training, that yields one of three outcomes — run as written, run with a specific framing or caveat, or decline — and that leaves documented reasoning for the file.

  The philosophical anchor should be Hume's argument on miracles, treated as a serious starting point rather than a slogan. As I understand it, the core of the argument is that testimony is only as strong as the balance between the evidence for the witness's reliability and the intrinsic improbability of the event reported, so that for a putative violation of a law of nature the witness's being mistaken or deceptive would itself have to be more improbable than the event. Our desk has informally been applying what we call the denominator rule: you cannot say how strong a piece of testimony is without knowing the rate at which similar testimony turns out to be false, and for miracle claims we almost never know that denominator. Tell me whether to keep this rule, fix it, or drop it.

  There is also a second-order problem I want the procedure to confront rather than dodge. Our decision is not a belief; it is an act of publication, and publishing testimony makes us a link in a chain of testimony. Hume's question is what a rational hearer should believe given testimony; ours is what we should help a heterogeneous readership believe, many of whose priors — shaped by religious commitment or its absence — are unlike ours. The procedure has to say explicitly whether to apply our own priors, try to estimate the readers', or refuse the question, and that choice should be a step in the procedure, not an afterthought.

  Before drafting, brainstorm: map which parts of Hume's argument genuinely transfer to an editorial decision (witness reliability, the antecedent improbability of the event, the balancing structure itself), which transfer only with modification (Hume defines a miracle as a violation of a law of nature; a spontaneous remission is not that — it is rare but lawful — and the procedure must draw and use this distinction), and which do not transfer at all. Then write the procedure: an ordered set of at most eight steps, each specifying what counts as a sufficient answer, where the procedure terminates in a decline, where it mandates reframing rather than declining, and which questions are questions of values that must be handed up to an editor instead of settled by the checklist. Mark the points where judgment cannot be eliminated. Then run the procedure, showing its work, on these three submissions:

  1. An essayist reports that her mother's inoperable pancreatic cancer vanished between scans after a pilgrimage. We have the before-and-after imaging and the oncologist's confirmation of remission, though the oncologist calls it a documented if unexplained spontaneous regression. The essayist frames it as a miracle; the mother does not.

  2. A weeping statue in a small town: roughly forty witnesses, a blurry video, a diocese that declined to investigate, and a chemist acquaintance of the essayist saying condensation is consistent with the footage. The submission is really about what the town's belief did to the town, and the statue is almost incidental to it.

  3. A reader claims to have dreamed a plane crash in detail three days before it happened. Her sister confirms the reader described the dream to her the morning after, the crash occurred, and the dream matched in one specific detail that was not publicly reported until a week later.

  Include at least one case where the procedure delivers an answer I will not like — I want its independence demonstrated, so say plainly which answer that is and why it follows anyway. Add a closing section on how the procedure misfires: the recurring situations in which it gives the wrong answer or no answer, with an example of each. Please give me no reading list and no citations; everything needed is in the argument itself. And if you must simplify, preserve above all the structure that makes Hume's point something better than a blanket prejudice against the miraculous — testimony really can, in principle, be good enough, and the procedure should say what that would take.
reasoning: |-
  Okay, the user needs a practical decision procedure based on Hume's argument on miracles for their magazine. Let me start by breaking down Hume's core ideas. Hume says testimony about a miracle is only credible if the improbability of the witness being wrong is greater than the miracle itself. But the user mentioned their "denominator rule" — needing the false testimony rate, which is often unknown. I need to decide if that rule stays. Maybe it's useful but should be adjusted. Instead of requiring the actual denominator, we can focus on available evidence of witness reliability and event improbability.

  The user also highlighted a key distinction: spontaneous remission isn't a law violation, unlike a weeping statue. The procedure must differentiate between lawful rare events and actual miracles. That's crucial for step 2 in the checklist. 

  Then there's the second-order problem: whose priors to use? The magazine's decision affects readers with diverse beliefs. The procedure should explicitly choose between editorial priors, typical readers, or a neutral stance. Step 5 handles this by using typical readers' priors unless it's a values question, which goes to the editor.

  Now, structuring the steps. Need at most eight steps. Start with verification: can we confirm facts? If not, decline. Then classify the event: miracle or rare lawful event? That affects the improbability assessment. Next, witness reliability: number, corroboration, incentives. Step 4 balances the improbability against reliability. Step 5 adjusts for readers' priors. Step 6 decides publication: run, frame, or decline. Steps 7 and 8 handle values questions and documentation.

  Testing with the examples. First submission: spontaneous remission. Verified facts, lawful rare event. Witness reliable but mother disagrees on miracle framing. Here, the procedure likely says run with framing, noting medical explanation. Second: weeping statue. Verified witnesses, but event classified as miracle. Low reliability due to no investigation and blurry video. High improbability, so decline. Third: precognitive dream. Verified dream timing, but event is a miracle. Reliability is moderate with sister's corroboration. However, improbability is high, so decline. The user might not like declining the dream story since it's compelling, but procedure follows Hume's balance.

  Misfires: when an event's status is unclear (lawful vs. miracle) or misclassifying lawful events as miracles. Also, if reliability evidence is incomplete, leading to wrong declines. For example, a true miracle with strong evidence might get declined if reliability isn't properly assessed. Another misfire is when readers' priors vary widely, making step 5's estimation inaccurate. Need to flag these limitations in the documentation.
answer: |-
  Here is a decision procedure based on Humean principles, designed for editorial use. It preserves Hume's core balancing structure while adapting it for publication decisions and addressing your specified concerns. The "denominator rule" is modified: we acknowledge the *ideal* need for false testimony rates but focus on *available proxies* for witness reliability and antecedent improbability when data is lacking.

  **Core Adaptations from Hume:**
  1.  **Transfers Directly:** Witness reliability assessment, antecedent improbability assessment, the requirement that reliability must outweigh improbability.
  2.  **Transfers with Modification:** *Miracle Definition:* We distinguish:
      *   **Type M (Miracle/Apparent Law-Violation):** Events presented as directly contradicting well-established natural laws (e.g., statue weeping tears of human blood, true precognition, resurrection). *Highest improbability.*
      *   **Type R (Rare Lawful Event):** Events presented as extraordinary but potentially explainable within known natural laws, however improbable (e.g., spontaneous remission, incredible coincidence, unexplained natural phenomenon). *Lower improbability.*
  3.  **Does Not Transfer:** Hume's focus on *individual* rational belief. Our focus is on *publication as an act of testimony* to a diverse audience.

  **The Procedure: Miracle & Extraordinary Claim Evaluation (MECE) Checklist**
  *(Run steps in order; terminate at any "Decline" or final outcome)*

  1.  **Verifiable Facts Check:**
      *   *Question:* Can independent, standard fact-checking verify all *non-extraordinary* factual claims (dates, locations, identities, documented events like diagnoses, travel, etc.)?
      *   *Sufficient Answer:* Yes, all verifiable ordinary facts are confirmed. → Proceed to Step 2.
      *   *Terminate/Decline:* If key ordinary facts cannot be verified or are false. **OUTCOME: Decline.**
      *   *Judgment Note:* Determining what is "verifiable" and sufficient confirmation.

  2.  **Event Classification:**
      *   *Question:* Is the extraordinary event presented primarily as a **Type M (apparent law-violation)** or **Type R (rare lawful event)**? Use the author's framing *and* the event's best description.
      *   *Sufficient Answer:* Clear classification based on the nature of the event (statue weeping = Type M; spontaneous remission = Type R; precognitive dream = Type M). → Proceed to Step 3.
      *   *Terminate/Reframe:* If classification is deeply ambiguous or contested *within the narrative itself*. **OUTCOME:** Flag for Editor - Mandatory reframing needed to clarify event nature (e.g., "whether miracle or medical mystery").
      *   *Judgment Note:* Classifying ambiguous cases (e.g., is "voice heard by whole family" Type M (supernatural) or Type R (mass suggestion?).

  3.  **Assess Witness Reliability (Denominator Proxies):**
      *   *Questions:*
          *   How many independent witnesses directly perceived the core event? (More = better)
          *   Is there strong corroboration *for the perception itself*? (e.g., contemporaneous notes, multiple consistent accounts, physical evidence directly tied to the perception)
          *   Are witnesses credible? (No known history of deception on serious matters, no strong incentive to deceive *in this instance*, demeanor plausibly sincere under check)
          *   Are there plausible sources of error (hallucination, misperception, suggestion, hoax potential) and how mitigated are they?
      *   *Sufficient Answer:* Compile evidence for/against reliability. Assign a rough, justified rating: **High, Moderate, Low, Very Low** based on the preponderance. → Proceed to Step 4.
      *   *Terminate/Decline:* If reliability is assessed as **Very Low** (e.g., single witness with strong incentive, history of fabrication, high hoax potential with no mitigation). **OUTCOME: Decline.**
      *   *Judgment Note:* Weighing factors; assessing credibility and error potential without denominator data requires judgment. *This step replaces the strict denominator rule with practical assessment.*

  4.  **Assess Antecedent Improbability & Humean Balance:**
      *   *Question:* Does the assessed **Witness Reliability** (Step 3) significantly outweigh the **Antecedent Improbability** of the event type (Step 2)?
          *   *(Type M: Highest Improbability - requires Highest Reliability)*
          *   *(Type R: Significant but Lower Improbability - requires Moderate/High Reliability)*
      *   *Sufficient Answer:* Explicitly state the balance judgment: "Reliability [Rating] sufficiently outweighs [Type M/R] Improbability" OR "Does not sufficiently outweigh." → Proceed to Step 5.
      *   *Terminate/Decline:* If Reliability *does not sufficiently outweigh* Improbability. **OUTCOME: Decline.** (Core Humean rejection point).
      *   *Judgment Note:* This is the key Humean judgment - comparing incomparables (reliability vs. improbability). Requires careful justification.

  5.  **Reader Priors Consideration (Publication Effect):**
      *   *Question:* Could publishing this testimony, *as framed*, reasonably mislead a significant portion of our readership into adopting a belief that the Humean balance (Step 4) suggests is unwarranted? (Consider typical reader diversity; assume neither zealots nor hardened skeptics).
      *   *Sufficient Answer:* "No significant misleading risk" OR "Significant risk exists." → Proceed to Step 6.
      *   *Hand Up:* If the answer hinges on a complex *values judgment* about the magazine's role regarding specific beliefs (e.g., promoting specific religious views vs. purely reporting experiences). **OUTCOME:** Flag for Editor - Values Question.
      *   *Judgment Note:* Assessing "significant portion" and "mislead" based on typical readership, not niche groups.

  6.  **Publication Decision:**
      *   *Based on Step 5:*
          *   **If "No significant misleading risk":** → **OUTCOME: Run as written.**
          *   **If "Significant risk exists":** → **OUTCOME: Run with Mandatory Framing/Caveat.** (e.g., "The author experienced this as a miracle, though medicine documents rare spontaneous remissions"; "While many townspeople believed, no official investigation confirmed supernatural cause").
      *   *Based on Hand Up from Step 5:* Editor decides Run/Run with Caveat/Decline based on publication values.

  7.  **Values Question Handling (Editor):**
      *   *Input:* Steps 2, 3, 4 results + Step 5 "Hand Up" reason.
      *   *Editor Decision:* Choose **Run, Run with Caveat, or Decline** based on magazine values regarding testimony, belief, and audience. Document reasoning explicitly.

  8.  **Documentation:**
      *   *Mandatory:* For every step, document: 1) Answer, 2) Key Evidence/Factors Considered, 3) Judgment Rationale (especially Steps 2, 3, 4, 5). File includes this completed checklist.

  ---

  **Application to Submissions:**

  **Submission 1: Spontaneous Cancer Remission**
  1.  **Verifiable Facts:** Confirmed. (Imaging, oncologist report). ✅ Proceed.
  2.  **Event Classification:** **Type R (Rare Lawful Event).** Spontaneous remission is documented, however rare. Author frames as miracle, but event nature is Type R. ✅ Proceed.
  3.  **Witness Reliability:** Essayist (primary) - High (documented experience, no incentive found, sincere). Mother's differing view noted but doesn't undermine core event (remission). Corroboration: Medical evidence. **Rating: High.** ✅ Proceed.
  4.  **Humean Balance:** **High Reliability outweighs Type R Improbability.** Remission is rare but lawful; strong medical documentation supports the witness. ✅ Proceed.
  5.  **Reader Priors:** Significant misleading risk? **Yes.** Framing as "miracle" (Type M) could mislead readers about the nature of the event (Type R) vs. author's personal interpretation. ❗Hand Up to Editor? Arguably yes (values re: validating religious interpretation vs. reporting experience). *For procedure:* Assume Step 5 answer is **"Significant risk exists"** due to framing mismatch. → Proceed to Step 6.
  6.  **Publication Decision:** Significant risk exists → **OUTCOME: Run with Mandatory Framing/Caveat.** *Example Framing:* "The author experienced her mother's medically documented, unexplained spontaneous remission as a profound miracle following their pilgrimage."
  7.  *(N/A)*
  8.  **Document:** All steps.

  **Submission 2: Weeping Statue**
  1.  **Verifiable Facts:** Witnesses exist? Likely verifiable. Travel/dates? Verifiable. Statue exists? Verifiable. Diocese non-investigation? Verifiable. Video exists? Verifiable. Chemist opinion? Verifiable. ✅ Proceed. (*Note:* Verifying witnesses *saw moisture* is possible; verifying *it was miraculous tears* is not).
  2.  **Event Classification:** **Type M (Apparent Law-Violation).** Statues weeping human-like tears contradicts known natural laws. Author's focus on town belief doesn't change the event's presented nature. ✅ Proceed.
  3.  **Witness Reliability:** ~40 witnesses (Good number). Independence? Likely mixed (community event). Corroboration? Blurry video (weak - shows moisture, not origin). Credibility? Assumed sincere townspeople. Error Potential? **Very High** (Condensation plausible per chemist; group suggestion likely; hoax possible; diocese non-investigation undermines; no physical evidence of tears' nature). **Rating: Low to Very Low.** ✅ Proceed (but borderline).
  4.  **Humean Balance:** **Low/Very Low Reliability does NOT outweigh Type M (Highest) Improbability.** Plausible natural explanations significantly undermine the weight of the testimony. **OUTCOME: Decline.** (Procedure terminates at Step 4).

  **Submission 3: Precognitive Dream**
  1.  **Verifiable Facts:** Sister confirms dream description *before* crash? Verifiable (sister interview). Dream details? Verifiable (sister's account). Crash details? Verifiable. Specific unreported detail? Verifiable (check news timelines). ✅ Proceed.
  2.  **Event Classification:** **Type M (Apparent Law-Violation).** True precognition (specific, non-inferable detail) violates known natural laws/causality. ✅ Proceed.
  3.  **Witness Reliability:** Single primary witness (dreamer). Corroboration: Sister confirms dream description *timing* and *specific detail* (strong for *that*). Credibility: Assumed sincere/no incentive. Error Potential: **Moderate/High.** Risk of memory distortion post-event about *detail specificity*? Risk of coincidence? No evidence of prior knowledge. **Rating: Moderate.** ✅ Proceed.
  4.  **Humean Balance:** **Moderate Reliability does NOT sufficiently outweigh Type M (Highest) Improbability.** While well-documented, the extreme improbability of true precognition means a single witness, even corroborated on timing/detail, isn't sufficient to overcome the high chance of error (coincidence, memory distortion). **OUTCOME: Decline.** (Procedure terminates at Step 4). *This is the answer you may not like.* The evidence is strong *for testimony that the dream occurred and seemed precognitive*, but Hume's bar for a Type M event is exceptionally high. Reliability (Moderate) < Improbability (Extreme).

  **How the Procedure Misfires:**

  1.  **Misfire: Wrong Decline (True Miracle with Flawed Evidence):**
      *   *Situation:* A genuine Type M event occurs, witnessed by highly reliable people, but corroborating evidence is weak/destroyed, or witnesses have an apparent (but untrue) incentive to deceive. The procedure assesses Reliability as Low/Very Low due to lack of evidence/incentives and declines.
      *   *Example:* A credible hospice nurse reports a well-documented terminal patient's sudden, medically inexplicable recovery (Type M) after a specific event. All medical records are lost in a fire. The nurse faces a malpractice review. Procedure: Step 3 Reliability = Low/Very Low (single witness, incentive under review, no docs). Step 4 → Decline. Truth is missed due to lack of evidence.

  2.  **Misfire: No Clear Answer (Ambiguous Event Classification):**
      *   *Situation:* The event's status as Type M or Type R is deeply ambiguous based on current scientific understanding or the narrative's presentation. Step 2 forces a Hand Up/Reframe, but the ambiguity fundamentally undermines the Humean balance (Step 4) which relies on the classification.
      *   *Example:* An essayist experiences intense, shared synchronicities surrounding a death that feel supernatural. Is this a Type M (meaningful violation of chance) or Type R (extreme coincidence + psychological pattern recognition)? Step 2 → Flag for Editor/Reframe. However, attempting Step 4 is nearly impossible – the improbability weight is unclear. The procedure forces a values/editorial decision (Step 5/7) without a clear Humean basis.

  **Closing:** This procedure operationalizes Hume's core insight – the contest between witness credibility and event strangeness – for editorial decisions. It replaces the impossible denominator requirement with practical reliability assessment. It forces explicit classification (M vs. R), acknowledges publication's testimonial role, and flags value judgments. Its independence is shown by declining the compelling precognitive dream case due to insufficient reliability for a Type M claim. It misfires when evidence is unavailable or events defy clear classification, reflecting the inherent limitations of evaluating extraordinary testimony.
