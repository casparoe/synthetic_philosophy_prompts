prompt: |-
  I'm a second-year cog sci grad student and next week I get my first ever solo discussion section — 50 minutes, intro to cognitive science, ~25 first-years. The lecture that week is on machine translation and whether it "understands," loosely anchored to Hofstadter's whole thing about how shallow statistical translation really is — idioms come out fine, but wordplay and poetry basically die, and the fact that the output looks fluent tells you a lot less than people assume. My advisor warned me the room will be split: a contingent of CS-adjacent kids who think that if the system translates better than a first-year Spanish student then obviously it understands *something*, and humanities/pre-med kids who are dead certain it's just dumb statistics and get vaguely offended the question is even being asked. My roommate, who does NLP, keeps muddying the waters by saying stuff like "the ocean doesn't understand swimming," which half the class will find profound and half will find infuriating. I do not want fifty minutes of two camps talking past each other.

  Don't write me an explanation of the issue — plan how I should run the section. What has to be in place *first* before "does it understand" is even a well-formed question (I'm guessing we can't open with the Chinese room, but tell me if I'm wrong), and which single concrete example should carry the whole session — I'm thinking something I can put on one slide where the correct translation forces you to completely abandon the literal form, like a pun or a two-line poem where the rhyme itself is doing semantic work, and why that kind of example rather than just "here's an idiom it mangles." Then the misconceptions I should expect, in the order the students will actually form them, and exactly where in the sequence to defuse each — I already predict "understanding is all-or-nothing" from one side and "humans are also just doing pattern matching" from the other, plus somebody will bring up that old round-trip story where a Biblical idiom supposedly came back as the vodka being good but the meat rotten, which I half suspect is apocryphal and would love you to weigh in on. Also what I should openly refuse to get into at this level and say so (architecture details? the hard problem? whether the big chatbot thing is conscious?), and one closing question I could put to the room that would tell me whether they actually understood the issue rather than just picked a team.

  Whatever else you do, make the last line of your response a single sentence that states your recommended session plan in a nutshell — arc, example, and the one misconception to head off earliest — so I can glance at it right before section starts and recenter myself.
