  Structuring the session: Start by defining understanding with student input. Introduce criteria like ambiguity resolution. Use the poem example to show where MT fails. Discuss why that failure indicates a lack of understanding. Preempt misconceptions by highlighting that understanding isn't binary and humans do more than pattern matching. Debunk the round-trip story but use it to illustrate brittleness. End with the closing question.

