  The user's unspoken needs seem to include:
  - Avoiding anachronism in attributing positions to Dummett
  - Clarifying where consensus exists vs. where original argumentation is needed
  - Identifying potential contradictions between desiderata upfront
  - Getting clear markers for what's controversial in the literature

  For compositionality (1), I recall Dummett's argument that holism makes meaning acquisition impossible. The key point is explaining how intuitionistic operators can be compositional despite stronger meaning clauses. This seems non-negotiable for any systematic theory.

  Manifestation (2) is the central anti-realist thesis - the Wittgensteinian pivot. Any theory rejecting this would be outside Dummett's framework entirely. I should emphasize its foundational role while noting some constructivists (like Bishop) might downplay it.

  Self-application (3) involves the justification of deduction problem. Prawitz's normalization provides a candidate solution, but its non-circularity is debated. This requirement tests the theory's coherence but might be negotiable if circularity is benign.

  The undecidability trap (4) is particularly thorny. I need to show how the theory must navigate between Scylla (omniscience) and Charybdis (meaninglessness) - perhaps through open-ended proof conditions. This may be the most exclusionary criterion.

  For classical coincidence (5), the requirement seems forced: if intuitionistic logic collapses to classical on decidable domains, any adequate theory must explain why. Failure here would be a major cost.

  Scope (6) touches on boundaries - choice sequences and witness-independence. Here I should distinguish what's core to constructivism (witnesses) vs. what's specific to Brouwer.

  The tensions I see:
  - Manifestation vs. undecidability trap: How to manifest grasp of undecided statements?
  - Self-application vs. undecidability: Normalization assumes decidability of proof reduction
  - Compositionality vs. open-endedness: Can meaning be compositional if proof conditions evolve?

  I'll flag these as recognized problems except possibly the compositionality/open-endedness tension. The literature mainly discusses the first two.

  Epistemically, I'm most confident about manifestation being non-negotiable and least sure about self-application's satisfiability - the circularity debate remains unresolved. The undecidability trap likely excludes most naive verificationist theories.

  Throughout, I'll maintain:
  - Clear demarcation of Dummettian orthodoxy
