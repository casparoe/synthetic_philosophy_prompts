answer: |-
  Below is a systematic breakdown of desiderata for a theory of meaning for intuitionistic logic from a Dummettian/anti-realist perspective. Each requirement includes:  
  (a) **The case/consideration** behind it, (b) **Non-negotiable (NN) vs. negotiable (N)** status, (c) Whether it reflects a **forced principle (FP)** or **camp-specific preference (CSP)**, (d) **Confidence level** (High/Medium/Low) and **literature attribution**. I conclude with tensions and exclusionary power analysis.  

  ---

  ### **1. Compositionality**  
  - **Case**: Dummett argues that holism renders language unlearnable (*The Logical Basis of Metaphysics*). For anti-realism, meaning must be built recursively from sub-sentential components to explain linguistic competence. Intuitionistic connectives (e.g., disjunction requiring proof of a disjunct) must still satisfy this despite stronger clauses.  
  - **NN/N**: **NN** for any systematic theory of meaning.  
  - **FP/CSP**: **FP** for anti-realism broadly (rooted in learnability).  
  - **Confidence**: **High**. Explicit in Dummett (1973, 1991); consensus in anti-realist semantics.  
  - **Literature Attribution**: Standard Dummettian line; not my reconstruction.  

  ### **2. Manifestation**  
  - **Case**: Anti-realism holds that understanding cannot outstrip use. Grasp of meaning must be *demonstrable* in finite linguistic behavior (e.g., proofs, assertions). Classical truth-conditions for undecidable sentences fail this, as their recognition is non-manifestable (e.g., "Goldbach’s Conjecture is true" absent proof).  
  - **NN/N**: **NN** for Dummettian anti-realism.  
  - **FP/CSP**: **FP** for anti-realism (epistemic constraint on meaning). Rejected by realists.  
  - **Confidence**: **High**. Core to Dummett (1973); Wittgensteinian roots.  
  - **Literature Attribution**: Central to Dummett’s project; widely recognized.  

  ### **3. Self-Application**  
  - **Case**: The theory must justify logical rules (e.g., intuitionistic negation) without circularly relying on those same rules (cf. "justification of deduction"). Harmony between introduction/elimination rules (e.g., via Prawitz normalization) is proposed to validate inferences non-circularly.  
  - **NN/N**: **NN** to avoid vicious circularity.  
  - **FP/CSP**: **FP** for coherence of the theory itself.  
  - **Can it be met non-circularly?** Yes, via proof-theoretic methods (e.g., normalization) that use only primitive inductive reasoning about proofs—**but** this assumes constructively acceptable meta-logic.  
  - **Confidence**: **Medium**. Prawitz (1971) offers a candidate solution, but debate persists (e.g., Dummett wavered; circularity concerns linger).  
  - **Literature Attribution**: Recognized problem (Dummett 1973, Prawitz 1971); circularity worries are my *cautious reconstruction*.  

  ### **4. Undecidability Trap**  
  - **Case**: Anti-realism must avoid:  
    - (i) Treating "no proof exists" as determinate (implying omniscience over proof-space),  
    - (ii) Rendering open conjectures meaningless.  
    Meaning must be stable *regardless* of current knowledge (e.g., "P ∨ ¬P" is meaningful but not always assertible).  
  - **NN/N**: **NN**—failure collapses into realism or nihilism.  
  - **FP/CSP**: **FP** for anti-realism (avoids realism’s epistemic hubris).  
  - **Confidence**: **High**. Dummett (1973) and Tennant (1987) address this explicitly.  
  - **Literature Attribution**: Well-trodden; "undecidability trap" phrasing is my synthesis, but the dilemma is canonical.  

  ### **5. Classical Coincidence on Decidable Domains**  
  - **Case**: On decidable predicates (e.g., finite arithmetic), classical and intuitionistic logic agree. The theory must either:  
    - (a) **Explain** why classical reasoning is harmless here (e.g., via semantic stability under decidability), or  
    - (b) **Admit failure** and accept a cost (e.g., rejecting classical logic even for decidable math).  
  - **NN/N**: **NN**—else the theory misdescribes mathematical practice.  
  - **FP/CSP**: **FP** (logical equivalence is mathematical fact).  
  - **Confidence**: **High**. Noted by Dummett (1977) and emphasized by Bishop (1967).  
  - **Literature Attribution**: Consensus position; not controversial.  

  ### **6. Scope**  
  - **Case**: The theory must clarify its domain:  
    - (a) **Choice sequences**: Can it handle Brouwer’s non-recursive objects (requiring continuity principles)?  
    - (b) **Witness independence**: Does it satisfy Bishop’s constraint that constructive proofs yield algorithms *without* philosophical baggage (e.g., rejecting Brouwerian idealism)?  
  - **NN/N**: **N**—scope reflects camp preferences.  
  - **FP/CSP**: **CSP** (Brouwerians vs. Bishop-style constructivists).  
    - Witness independence: **NN** for mainstream constructivism (Bishop).  
    - Choice sequences: Optional (Brouwer-specific).  
  - **Confidence**: **Medium** for witness independence (**High** per Bishop); **Low** for choice sequences (fragmented views).  
  - **Literature Attribution**: Bishop (1967) vs. Brouwer; "witness independence" is explicit in Bishop, "scope" framing is my organization.  

  ---

  ### **Tensions and Exclusionary Power**  
  1. **Joint Satisfiability**:  
     - All are *jointly satisfiable in principle* (e.g., via proof-theoretic semantics à la Prawitz/Dummett), but **Manifestation + Undecidability Trap** creates tension:  
       - Manifestation requires finite behavioral criteria.  
       - Undecidability forbids defining meaning via proof *absence*.  
       - **Resolution**: Meaning as *canonical proof conditions* (stable but not always decidable).  
     - **Self-application + Compositionality**: Harmony proofs (self-application) assume compositionality. Tension if meaning holism creeps in.  

  2. **Most Exclusionary Requirement**:  
     - **The Undecidability Trap** excludes:  
       - Classical truth-conditional semantics (violates by assuming bivalence).  
       - Naïve verificationism (e.g., "P means 'P is proved'" fails for open conjectures).  
     - **Manifestation** excludes realist and pragmatist theories.  

  3. **Least Confident Point**: **Self-application’s non-circularity** (Confidence: **Medium**).  
     - While normalization *seems* non-circular, it relies on meta-theoretic induction. Hardcore circularity objections (e.g., by Prior 1960) linger. This is debated in the literature (Prawitz vs. skeptics), but my caution about residual circularity is a *reconstruction*.  

  ---

  ### **Summary of Key Attributions**  
  - **Non-negotiable (NN)**: Compositionality, Manifestation, Self-application, Undecidability Trap, Classical Coincidence.  
  - **Forced Principles (FP)**: All except Scope (CSP).  
  - **Camp-Specific Preference (CSP)**: Scope (esp. choice sequences).  
  - **Literature-Recognized Problems**: All except minor phrasing (e.g., "undecidability trap" as a label).  
  - **My Reconstructions**:  
    - Circularity risk in self-application (3).  
    - "Undecidability trap" as a named dilemma (4).  
    - Scope as a unified category (6).  

  This framework lets you evaluate semantics *without* presupposing solutions. The undecidability trap and manifestation are the heaviest constraints, but all NN requirements are essential for a Dummett-consistent theory.
