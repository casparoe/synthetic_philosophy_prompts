prompt: |-
  As a novelist, I'm drafting a piece set in a cosmos run on the dark forest logic: to broadcast your location is to invite annihilation, since eliminating a stranger is always cheaper than trusting him. I want a story that dramatizes this reasoning rather than explaining it, and I want it stripped of the familiar furniture — no humans, no interstellar war, no last stand. The entire tale should unfold inside a single alien civilization, in the offices of its signal-censorship bureau, where a minor official whose job is to erase stray transmissions discovers an anomaly: a faint signal that, when decoded, proves to be an echo of her own civilization's earliest leaked broadcasts, returned intact from somewhere dark. No shot is ever fired; the drama must live entirely in the bureau's debate over what it would mean to answer oneself. Keep it under 900 words, and end at the instant the decision is made, not on its consequences.
reasoning: |-
  Okay, the user is a novelist crafting a story set in a dark forest universe. They want to avoid clichés like human characters, interstellar wars, or last stands. Instead, the drama should unfold entirely within an alien signal-censorship bureau, focusing on a minor official who discovers an echo of their own civilization's earliest leaked broadcast. The tension must come from the debate about whether to answer this signal, ending precisely when the decision is made.

  Hmm... the user's specifications are very precise. They want pure thematic dramatization without exposition - the dark forest logic should emerge organically through the bureau's institutional paranoia. The "echo" concept is brilliant: a cosmic mirror reflecting their past vulnerability. 

  I should avoid any anthropomorphism. The aliens need distinct physiology - maybe multi-jointed limbs and sensory tendrils? Their tech should feel alien too: organic interfaces, bioluminescent displays. The bureau's name must evoke both bureaucracy and dread - something like "The Chamber of Silenced Skies" works better than "Signal-Censorship Bureau."

  Key scenes: 
  First, the protagonist (Xyl?) noticing the anomaly during routine signal erasure. The horror of recognition when the decoded message shows their own ancient art - proof of past naivety. 
  Then the debate scene where three arguments clash: 
  1. Chief Archivist Zara's emotional plea about the signal's purity 
  2. Security Director Kryll's pragmatic annihilation doctrine 
  3. Xyl's realization that answering would be a catastrophic confession of existence

  The ending must freeze on Xyl's tendril hovering over the deletion command. No resolution - just that unbearable tension between hope and terror. Word count is tight, so every sentence must multitask: describe alien physiology while advancing tension, use tech jargon to build worldbuilding.

  Biggest challenge is making the dark forest logic feel visceral without stating it outright. Maybe show how the bureau's own protocols mirror the cosmic threat - their censorship is a miniature dark forest. The returned signal isn't just data; it's the universe holding up a mirror to their vulnerability. 

  User clearly knows this genre well. Their request avoids all typical sci-fi tropes. I'll lean into the Kafkaesque bureaucracy angle - make the true horror institutional, not extraterrestrial. The most frightening thing isn't the aliens who might be out there, but the aliens they've become.
answer: |-
  The air in the Chamber of Silenced Skies hung thick with the scent of ozone and damp fungal parchment. Xyl, her primary manipulators moving with the weary precision of millennia of routine, scanned the spectral waterfall cascading down the main bio-luminescent display. Her secondary sensory tendrils flicked through sub-channels, identifying and purging the faintest whispers of unauthorized transmission – stellar static misidentified, the dying pulse of a rogue comet’s core, the inevitable quantum noise of the void. Eradication was her liturgy.

  Then, a flicker. Not random. A structured whisper buried deep within the infrared haze of Sector 7-Gamma. It pulsed with a rhythm that bypassed standard filters, resonating in a resonant cavity deep within Xyl’s auditory complex. An anomaly. Protocol demanded immediate deletion. Yet… it *lingered*. She isolated it, a fragile thread in the noise.

  Days dissolved into focused silence as Xyl, bypassing automated decoders, used the Chamber’s ancient, crystalline core-memory banks. The signal was old, impossibly faint, wrapped in layers of cosmic distortion. Slowly, painstakingly, she coaxed meaning from the static. The structure was archaic, a precursor to their own current hyper-compressed protocols. Recognition dawned, cold and sharp. This wasn’t just *any* signal. It was *theirs*.

  She summoned the Overseer and the Chief Archivist. In the dim vault, the decoded fragments shimmered on the display: grainy holos of the First Swarm’s crystalline nurseries orbiting a younger sun; the haunting, atonal harmonies of the Deep-Song, broadcast in jubilant naivete; schematics for rudimentary ionic thrusters – proof they once reached clumsily for the stars, shouting their existence into the dark.

  "It’s… us," breathed Zara, the Chief Archivist, her chromatophores flickering pale violet with awe. "The Genesis Broadcasts. Leaked through a containment breach during the Third Solar Expansion. We thought all traces were purged internally millennia ago."

  Overseer Kryll’s carapace plates ground faintly, a sound like pebbles shifting in a tomb. His cluster of stalked eyes fixed on the data-stream. "Origin?"

  "Impossible to pinpoint accurately," Xyl replied, her manipulators hovering over the console. "The signal degradation suggests immense distance. Decades, perhaps centuries of travel. It returned… intact." The word hung heavy. Intact meant *heard*. It meant something, somewhere, had captured their youthful cry and done… nothing? Until now? Or was this the first faint ripple of a predator’s approach?

  "That changes nothing," Kryll rasped. "The Doctrine is absolute. Any outgoing signal invites annihilation. Any *incoming* signal is either bait or reconnaissance. This… this is *both*. Our own past stupidity, weaponized against us by the silence." He gestured sharply, a slashing motion with one manipulator. "Erase the record. Deep-scour the receivers. Seal this sector."

  "But it’s *us*!" Zara protested, tendrils quivering. "A message in a bottle… from ourselves! Proof we weren’t silenced immediately! Proof… perhaps… that not everything out there is predator?"

  "Proof of vulnerability!" Kryll countered, his voice scraping like stone. "Proof we *were* loud, once. Proof we existed – and still exist – for anyone listening now. This echo isn't hope, Archivist. It’s a countdown. The Doctrine exists *because* of broadcasts like these. Every civilization that announces itself becomes a target. The calculus is brutal: eliminate the potential threat before it eliminates you. Trust is extinction."

  Xyl watched the arguments clash – Zara’s desperate, almost poetic longing for connection across the gulf, Kryll’s iron-clad certainty forged in the cold logic of cosmic survival. The Genesis Broadcasts played in a loop: joyful, ignorant, perilously loud. She saw the crystalline nurseries, heard the naive Deep-Song. She saw the vast, indifferent dark beyond the Chamber’s shielded walls. Kryll was right. The Doctrine, born of intercepted alien screams abruptly silenced, was their shield. To answer this echo – their own voice returned – wasn't communication. It was a beacon. It screamed, "Here! We *are* still here! We remember being loud!"

  The silence stretched, thick with the hum of machinery and the unspoken weight of millennia of fear. Zara’s chromatophores dimmed. Kryll stood immobile, a statue of grim resolve.

  Xyl’s manipulators moved. Not towards the deep-scour command. Not yet. She isolated the signal buffer, the raw, fragile echo of their past self. Her secondary tendrils flexed, keying the ancient command sequence for a directed narrow-beam transmission. The console pulsed with a soft, urgent light.

  **Target:** Origin Vector (Estimated, Degraded)
  **Message:** [Blank]
  **Ready to Encode.**

  The cursor blinked. A single pulse, a whisper of acknowledgement sent back along the path the echo had traveled, would suffice. *We hear you. We are here.* It would be the ultimate confession. Or a hand extended across light-years to… themselves? To whatever listened?

  Kryll’s eyestalks snapped towards her. Zara inhaled sharply, a hiss of pressurized gas. The Chamber of Silenced Skies held its breath. The weight of the dark forest pressed in, the crushing logic that made trust a suicide pact. Xyl’s manipulator hovered over the **ENCODE** glyph. To answer was to break the silence. To answer was to die.

  Her manipulator trembled, poised above the console light.
