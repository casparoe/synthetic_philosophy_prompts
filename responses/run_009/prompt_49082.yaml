prompt: |-
  I keep going back and forth on the is/ought thing and I want you to help me find what I actually think, based on my gut reactions to a bunch of specific inferences. You're a professional metaethicist, so please think carefully about this one, and maybe do a quick brainstorm of candidate principles before committing. Here's my situation: I accept that you can't derive an ought from an is, in the Hume sense, but when I look at actual arguments, my gut keeps approving inferences that look exactly like deriving oughts from ises. So here are my verdicts on specific arguments, each starting from pure facts and ending with a normative conclusion:

  1. This knife is dull / You ought to sharpen it (given that you're going to cut the bread). -- I think this one is fine, totally fine, and it barely even feels like an ought. But I can't shake the feeling that a goal got smuggled in with that parenthetical.

  2. It's illegal to jaywalk in this city / You ought not jaywalk. -- Not fine, obviously. Law is just a fact.

  3. Humans evolved to be mostly self-interested / We ought to be self-interested. -- Not fine, classic mistake.

  4. She promised to drive him to the airport / She ought to drive him. -- Fine?? This one feels fine to me and it's bugging me because on its face it has the same shape as 2 and 3: a fact about what happened, then an ought. If anything the promise fact seems LESS "oughty" than the law fact.

  5. Setting this cat on fire would cause enormous suffering for no benefit whatsoever / You ought not set the cat on fire. -- Fine, and not just fine, but I'd say anyone who accepts the premise and rejects the conclusion is being irrational, not just immoral. And I can't for the life of me see what premise is being smuggled in here the way it is in 1.

  6. In our community the word "wrong" just means causing gratuitous harm; what he did caused gratuitous harm; therefore what he did was wrong. -- I flip-flop on this. Some days it looks fine but trivially so (it's just definition-juggling, the normativity evaporates), other days I think it's actually the only legitimate route from facts to values.

  So my question is: is there ONE principle that gets all these verdicts? My tentative guess is something like "the inference is ok when the factual premise somehow already contains the normative conclusion, and fails when it doesn't" -- but that's so circular it embarrasses me. And I worry the principle will have to treat 4 and 5 in totally different ways (promise as an institutional/conventional fact vs. suffering as intrinsically normative) which seems ugly.

  Also please tell me what your principle says about two cases I haven't listed but keep almost thinking about: (a) "Everyone in this community disapproves of eating with your left hand / you ought not eat with your left hand", and (b) "Same-sex attraction occurs throughout the animal kingdom and in every human society / it ought not be condemned" -- which is, notably, an is-to-ought argument people on my side of things make all the time, and which I'm inclined to accept, which scares me a little given my verdict on 3.

  Be honest about which of my verdicts your principle has to overturn. My guess is 5, and I'm prepared to be annoyed about that. Don't just tell me the standard textbook moves, tell me what actually captures the pattern. (sorry for typos, typing fast)
reasoning: |-
  Okay, let me tackle this user's metaethical puzzle. They're wrestling with Hume's is-ought problem but keep feeling drawn to certain factual-to-normative inferences. Their specific verdicts on six test cases present a fascinating pattern that needs unpacking. 

  First, I notice their discomfort centers on whether "smuggled" normative elements explain the acceptable inferences. The knife example (1) explicitly states a goal, making it feel trivial, while the cat burning case (5) feels inescapably normative without any visible smuggling. That's the real head-scratcher here. 

  The promise case (4) is particularly interesting because they acknowledge it resembles the rejected law/jaywalking argument (2) structurally, yet their gut approves it. This suggests institutional facts (promises) create stronger normative pull than mere legal facts for them. Meanwhile, their flip-flopping on the "wrong" definition case (6) reveals tension between linguistic conventions and substantive normativity.

  For their unlisted cases: The left-hand eating example will likely parallel their jaywalking rejection since both involve arbitrary conventions. The same-sex attraction argument is trickier - it mirrors the rejected evolutionary premise (3) but they feel compelled to accept it. This needs careful handling to avoid inconsistency. 

  I'm considering a "normative sensitivity" framework where facts generate oughts only when they engage with (a) explicit goals, (b) institutional commitments, or (c) non-arbitrary harms. This might explain why suffering (5) feels categorically different from law (2) or evolution (3). The challenge is making "non-arbitrary harm" feel less question-begging.

  Their meta-worry about inconsistency between cases 4 and 5 is telling. If promises derive force from social practice while suffering seems intrinsically normative, does that require two fundamentally different explanations? Maybe not - both could be seen as engaging with "reasons-responsive" features of agency (avoiding harm being more basic than promise-keeping).

  The evolutionary/same-sex attraction tension is solvable if we distinguish between descriptive origins (evolution) and functional normalcy (cross-cultural occurrence). But this risks precisely the naturalistic fallacy they're wary of. Perhaps emphasizing that the condemnation causes harm bridges the gap to their accepted harm principle.

  Ultimately their struggle exposes a deeper conflict: wanting normativity to be both objective (like suffering) and conventional (like promises) without reducing to either. The principle I'll propose must walk this tightrope.
answer: |-
  Based on your gut reactions, a single, unified principle *can* capture your pattern – but it requires embracing a specific metaethical framework and acknowledging that your verdict on Argument 5 ("cat burning") is the lynchpin. Here's the principle and how it maps to your cases:

  **The Principle: A factual premise can license an ought-conclusion if and only if it engages with a *fundamental, non-arbitrary normative concern* that is *constitutive of rational agency* or *inescapable for beings like us*.**

  **Explaining the Key Terms:**

  1.  **Fundamental, Non-Arbitrary Normative Concern:** This refers to things like avoiding severe suffering, fulfilling commitments essential to cooperation, or pursuing coherence in one's agency. These aren't mere preferences; they generate *reasons* that are hard to dismiss without irrationality or deep moral failing. (Contrast with arbitrary conventions like law or etiquette).
  2.  **Constitutive of Rational Agency:** Acting in ways that avoid pointless suffering or keep promises (in contexts where they matter) is part of what it *means* to be a minimally rational, social agent. Rejecting these concerns isn't just immoral; it involves a kind of practical irrationality.
  3.  **Inescapable for Beings Like Us:** Given our nature as vulnerable, social, language-using creatures, concerns about suffering, broken commitments, and incoherent agency are unavoidable features of our practical landscape. We can't simply opt out without severe cost or self-contradiction.

  **Applying the Principle to Your Cases:**

  1.  **Knife:** **Fine.** The parenthetical *explicitly states* a contingent goal ("cut the bread"). The inference relies on a hypothetical imperative: *IF* you have goal G, *and* action A is necessary for G, *THEN* you ought to do A. The goal is smuggled, as you suspected. The principle flags this as engaging with the instrumental concern of goal-pursuit, which is constitutive of being an agent *with a goal*.
  2.  **Jaywalking:** **Not Fine.** Illegality is a purely conventional, arbitrary fact. It doesn't engage with a fundamental normative concern inherent to rational agency or inescapable for beings like us. Breaking it *might* cause harm (punishment), but the illegality itself isn't the fundamental source of the "ought" if one exists.
  3.  **Evolution/Self-Interest:** **Not Fine.** Descriptive facts about our evolutionary origins don't establish what we *ought* to do. Evolution explains *how* we got certain traits, not whether pursuing them is *good* or *rational*. Pursuing self-interest isn't fundamentally constitutive of rational agency in the required way (altruism can also be rational).
  4.  **Promise:** **Fine.** Promising creates a *reason* because it engages with fundamental normative concerns: fidelity, trust, and the reliability of commitments essential for complex social cooperation. Keeping promises (absent defeating conditions) is constitutive of being a trustworthy rational agent in a social context. Breaking a promise without reason involves a practical inconsistency and undermines a fundamental social practice.
  5.  **Cat Burning:** **Fine.** This is the core case. The fact of causing **gratuitous suffering** engages *directly* with a fundamental, non-arbitrary normative concern: the badness of suffering for sentient beings. Avoiding inflicting gratuitous suffering is arguably *constitutive* of minimal moral/rational agency for beings capable of recognizing others' suffering. Rejecting this "ought" involves a profound failure of empathy and rationality, not just immorality. This is why it feels like no premise is smuggled – the *fact itself* (gratuitous suffering) *is* the normative concern.
  6.  **Definition of "Wrong":** **Flip-Flop Explained:** Your flip-flop is spot on.
      *   **Trivial/Non-Normative:** If the definition is *merely* linguistic convention (e.g., "In our club, 'zorp' means causing gratuitous harm"), then the inference is valid but empty. The normativity comes *only* from the meaning assigned to "wrong," not from the fact of harm itself. It doesn't engage the fundamental concern *as normative*.
      *   **Legitimate Route:** If the definition is capturing a *substantive moral truth* (e.g., "Wrongness *just is* the property of causing gratuitous harm"), then the inference works *because* it's engaging directly with the fundamental normative concern (suffering). The normativity isn't evaporating; it's built into the metaphysical claim about what wrongness *is*.

  **Your Unlisted Cases:**

  a.  **"Everyone disapproves of left-hand eating / You ought not":** **Not Fine** (like Jaywalking). This is pure conventional disapproval. It's arbitrary and doesn't engage a fundamental normative concern constitutive of rational agency. (Your jaywalking verdict predicts this).
  b.  **"Same-sex attraction is natural/widespread / It ought not be condemned":** **Fine, but with crucial nuance.** This argument *as stated* is **not fine** by itself, for the same reason as the evolutionary argument (3). "Natural" or "widespread" doesn't directly imply "ought not be condemned." **However**, we instinctively accept it because we *interpret* it as implicitly engaging with fundamental normative concerns:
      *   Condemnation likely causes **unnecessary suffering/harm** (engaging the core concern from the Cat case).
      *   Condemnation might be **based on false beliefs** (e.g., that it's unnatural or harmful), violating a concern for truth/reason.
      *   Condemnation infringes on **autonomy** over harmless personal life.
      *   **The Principle's Verdict:** The inference *as literally stated* (from "is natural/widespread" to "ought not condemn") **fails** – it commits the naturalistic fallacy like Argument 3. *However*, we accept it because we charitably read it as shorthand for an argument that *does* engage fundamental concerns: "Condemnation causes gratuitous harm/based on falsehoods/violates autonomy, *therefore* it's wrong/you ought not do it." This is why it feels different from Argument 3 – Argument 3 *endorses* the trait, while this one *rejects condemnation* based on implicit harm/autonomy grounds.

  **What Your Principle Overturns (Annoyance Alert!):**

  *   **Argument 5 (Cat Burning) is NOT a pure "is-to-ought" in the problematic Humean sense.** According to this principle, it *works* because the "is" (gratuitous suffering) *is* the locus of the fundamental normative concern. Hume's point is that you can't derive *normativity* from *non-normative* facts. This principle argues that facts *about suffering* (for sentient beings) *are* inherently normative facts – they inherently provide reasons against causing them for any rational agent capable of recognizing them. This is a **Non-Naturalist Moral Realist** or **Rationalist** position (e.g., akin to Parfit, Nagel, Scanlon). It rejects the strict fact/value dichotomy for certain fundamental concerns like suffering.
  *   **Argument 6 (Definition) only works if it's *not* just linguistic.** If it's *merely* definitional, it fails to capture normativity. It only works if the definition points to a substantive normative truth (like suffering being bad).

  **Conclusion:**

  Your gut reactions point towards a view where normativity enters the world through **fundamental concerns inherent to rational agency and the condition of sentient beings**, particularly the avoidance of **gratuitous suffering** and the upholding of **essential social commitments (like promises)**. Facts generate "oughts" when they directly engage with these bedrock normative features of existence. Conventional facts (law, widespread disapproval, arbitrary definitions) fail. Descriptive facts about origins or prevalence (evolution, naturalness) only work if *interpreted* as proxies for arguments engaging the fundamental concerns (like harm/autonomy in the same-sex case).

  This principle unifies your approvals (1, 4, 5, and the charitable reading of 6b) and disapprovals (2, 3, 6a, and the literal reading of 6b). The cost is embracing the idea that suffering (and similar fundamental concerns) *just is* a normative fact, not a purely descriptive one waiting for an "ought" to be pasted onto it. That's the move Hume warned against, but your strong reaction to the cat burning case suggests your intuitions demand it.
