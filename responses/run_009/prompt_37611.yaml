prompt: |-
  I am a novelist, roughly three hundred pages into a long book in which an older character — a charismatic aunt, in effect the novel's moral center — gradually reshapes the values of a younger protagonist. My problem is that, scene by scene, I cannot tell whether I am depicting persuasion or manipulation, and the distinction matters. If the aunt's influence is manipulation, this is a darker book, and the narrator's warmth toward her becomes a kind of unreliability; if it is persuasion, the book is about inheritance and mentorship. Readers of my early chapters split exactly down the middle on this, which tells me the text is not controlling the distinction.

  Please write a procedure I can run on any scene in which one character moves another's beliefs, desires, or decisions. I want the questions in order, what counts as a sufficient answer at each step, where the procedure can stop and declare the scene persuasion, manipulation, or genuinely ambiguous, and — importantly — where it must hand the final call back to me because what remains is a question of values rather than of craft. Ground the procedure in what moral philosophy actually says separates manipulation from legitimate influence: bypassing the target's reflective capacities rather than engaging them, working through characteristic vulnerabilities such as grief, fatigue, infatuation, or self-doubt rather than through reasons, exploiting information asymmetry, and framing or omitting so that the target's choice is made for her rather than by her. But translate all of that into tests I can apply to dialogue and stage business, since I have no training in philosophy, and keep it fast enough that I can run it on a scene in five or ten minutes during revision.

  One wrinkle I want built in, because I suspect it decides more scenes than content does: timing. The aunt says the same true, loving things throughout, but she says some of them at a graveside and some over breakfast, some when the protagonist is exhausted and some when she is steady. My half-formed view is that the same words can be persuasion at one hour and manipulation three hours later, and that readers register this even when I do not. So the procedure should treat the target's temporary state — and the influencer's choice of moment — as a first-class question, not an afterthought.

  Then run the procedure on three scenes from my draft. First: the aunt waits until the day after the protagonist's father's funeral, when the protagonist is drained and suggestible, to talk her out of keeping the family house, arguing only from things that are true. Second: the aunt talks a friend into taking a job he half wants by praising his talents and passing over the risks, again saying nothing false. Third: a scene I intended as the emotional center of the novel, in which the dying grandmother asks the protagonist to come home for a last Christmas, trading openly on the protagonist's guilt. Tell me what the procedure concludes about each, and be blunt if it classifies the third scene as manipulation. I need to know whether to rewrite that scene or to accept that a morally good character can manipulate someone she loves — and I would like you to say what each of those two choices would do to the book as a whole. Finally, state plainly what the procedure cannot do: the kinds of scenes it will misclassify, and the places where no procedure can substitute for my judgment.

  Please write the response in American English.
reasoning: |-
  Okay, the user is a novelist grappling with a crucial distinction in their manuscript: whether an aunt character's influence over the protagonist constitutes persuasion or manipulation. This distinction fundamentally alters the novel's moral landscape. They need a practical, scene-by-scene analysis tool grounded in moral philosophy but accessible without technical training. 

  Hmm, their frustration is palpable—early readers are split 50/50, proving the text isn't controlling the interpretation. Smart that they identified timing as a key variable; most writers would fixate only on dialogue. The graveside vs. breakfast example perfectly illustrates how identical words can shift from ethical to exploitative based on context. 

  *Pauses to consider philosophy frameworks*
  The core ethical markers are clear: manipulation bypasses rational reflection, exploits vulnerabilities, uses information control, or forces choices. But translating Aristotle/Faden-Beauchamp into actionable writing diagnostics? That’s the challenge. Need to avoid academic jargon—focus on tangible elements like "does the aunt pause for rebuttals?" or "is the protagonist shivering while being convinced?" 

  Ah, and they’ve flagged three test scenes: funeral real estate talk, risky job pitch, and the guilt-driven Christmas request. The grandmother scene especially worries them—they’re braced for a "manipulation" verdict but need blunt honesty. Good. They’re not seeking validation; they want functional truth. 

  *Structuring the procedure*
  Must be sequential like a flow chart: vulnerability check first (since timing is their pet concern), then consent/transparency, then rational engagement. Each step needs binary thresholds—if "yes" to exploitation, stop and flag manipulation. Build in off-ramps where ambiguity forces authorial judgment. For efficiency, limit to 5 core questions max. 

  *Anticipating pitfalls*
  The procedure will struggle with culturally nuanced power dynamics (e.g., familial duty vs. autonomy) or "benevolent" coercion. Also, sarcasm/tone can flip a scene’s meaning—hard to codify. Should emphasize that mentor figures can manipulate lovingly; that tension might deepen the novel. 

  *Personal note*
  This writer’s self-awareness is impressive. They’re not just fixing scenes; they’re interrogating their story’s moral spine. The grandmother scene dilemma—rewrite or lean into moral complexity?—could define the book’s soul. If they keep it as manipulation, the warmth-reliability fracture becomes devastating. If they sanitize it, they lose grit. 

  *Final design*
  Questions will target: 
  1. Exploited vulnerability (physical/emotional state) 
  2. Hidden agendas 
  3. Rational bypass tactics 
  4. Choice architecture 
  5. Reciprocity 
  ...with explicit "STOP HERE IF" flags. For the Christmas scene: yes, it’s manipulation (exploiting guilt when vulnerable), but that’s fertile ground if they own it. 

  *User’s unspoken need* 
  Beyond classification, they crave confidence in their thematic control. The tool must help them wield ambiguity intentionally, not accidentally.
answer: |-
  Here’s a step-by-step procedure you can run on any scene where influence occurs. It’s based on moral philosophy’s core distinctions (bypassing reason, exploiting vulnerability, asymmetry, and choice-framing) but translated into actionable writing diagnostics. **Run these questions in order—stop when you hit a definitive answer.**

  ---

  ### **The Influence Classification Procedure**
  **Time Limit:** 5-10 minutes per scene. Focus on **dialogue, physical actions, subtext, and timing**.  
  **What to Jot Down:** Brief notes on evidence (e.g., "Aunt mentions inheritance while MC stares at empty pill bottle").

  1. **QUESTION 1: IS THE TARGET IN A TEMPORARY STATE OF VULNERABILITY?**  
     *Look for:* Exhaustion, grief, intoxication, illness, acute fear, or euphoria.  
     *Key Detail:* Did the influencer *choose* this moment? (e.g., "She approached after the funeral, not a week later").  
     **→ YES + Influencer chose timing:** **Flag as High-Risk for Manipulation**. Move to Q2.  
     **→ NO or Influencer didn’t control timing:** Move to Q2.  
     **→ AMBIGUOUS:** Note it. Move to Q2.

  2. **QUESTION 2: DOES THE INFLUENCER BYPASS REASON OR LIMIT CHOICES?**  
     *Look for:*  
     - Rushing the target ("Decide now!").  
     - Framing options dishonestly ("Only two choices: sell the house or drown in debt").  
     - Using irrelevant emotional pressure (tears, guilt-trips unrelated to the issue).  
     - Avoiding counterarguments (monologues, interrupting rebuttals).  
     **→ YES to any:** **Likely Manipulation**. Stop here.  
     **→ NO:** Move to Q3.

  3. **QUESTION 3: IS THERE SIGNIFICANT INFORMATION ASYMMETRY?**  
     *Look for:*  
     - The influencer hides key facts (e.g., aunt knows a developer wants the land but doesn’t mention it).  
     - The influencer uses insider knowledge to steer (e.g., "You’ve always been bad with money" → stated when MC is vulnerable).  
     - The target lacks access to counter-evidence.  
     **→ YES + Influencer benefits:** **Likely Manipulation**. Stop here.  
     → **NO** or **Asymmetry exists but isn’t exploited**: Move to Q4.  

  4. **QUESTION 4: DOES THE INFLUENCER ACTIVELY ENGAGE THE TARGET’S REFLECTION?**  
     *Look for:*  
     - Genuine questions ("What do *you* want?").  
     - Inviting scrutiny ("Do you see flaws in this plan?").  
     - Allowing silence for the target to think.  
     - Acknowledging downsides ("The job pays less, but you’d gain flexibility").  
     **→ YES:** **Likely Persuasion**. Stop here.  
     **→ NO:** Move to Q5.  

  5. **QUESTION 5: IS THE INFLUENCER’S GOAL ALIGNED WITH THE TARGET’S CORE VALUES?**  
     *Look for:*  
     - The influencer references the target’s *stated* ideals (not assumed ones).  
     - The outcome clearly benefits the target, not just the influencer.  
     **→ YES + Q2-4 show no exploitation:** **Persuasion**.  
     **→ NO or Influencer benefits disproportionately:** **Manipulation**.  
     **→ VALUES CONFLICT:** **Ambiguous** (e.g., "Is avoiding guilt a core value? Is duty?"). **Hand back to you**.  

  ---

  ### **Applied to Your Scenes**
  **Scene 1: Aunt talks protagonist out of keeping the house post-funeral.**  
  - **Q1:** **YES.** Target is drained/grieving. Aunt *chose* the timing (next day).  
  - **Q2:** Depends. If aunt frames it as "only sane choice," **YES → Manipulation**. If she says "Think when you’re stronger, but consider X," **NO**.  
  - **Verdict:** **Manipulation** if framing is absolute/urgent. **Persuasion** if she encourages delayed reflection.  

  **Scene 2: Aunt talks friend into a risky job by praising talents, omitting risks.**  
  - **Q1:** Unclear (unless friend is stressed). Default to **NO**.  
  - **Q2:** **YES.** She omits risks → limits his ability to weigh choices.  
  - **Verdict:** **Manipulation** (bypasses rational assessment via omission).  

  **Scene 3: Dying grandmother trades on guilt to get protagonist home for Christmas.**  
  - **Q1:** **YES.** Grandmother is dying (permanent vulnerability), protagonist’s guilt is acute. Grandmother *chooses* to exploit this ("last Christmas").  
  - **Q2:** **YES.** Uses emotional pressure (guilt) unrelated to the merits of coming home.  
  - **Verdict:** **Manipulation** (bypasses reason via guilt, exploits vulnerability).  

  **Blunt Truth:** The procedure classifies this as **manipulation**. The grandmother uses a moment of extreme emotional vulnerability (her impending death) to trigger guilt, bypassing the protagonist’s capacity to reflect ("Do I *want* to go? What’s healthy for me?").  

  ---

  ### **Your Choice: Rewrite or Accept?**  
  - **Rewrite Option:** Soften the grandmother’s approach. Have her acknowledge the guilt-trip: *"I know it’s unfair to ask this when I’m leaving you... but I want to see you."* Shows self-awareness, making it persuasion (engages reflection).  
     - **Effect on Book:** Preserves grandmother as moral center. Cleaner mentorship arc.  
  - **Accept Option:** Keep as manipulation.  
     - **Effect on Book:** Makes the novel morally complex. The aunt’s "warmth" becomes part of the tension—can good people manipulate lovingly? Forces readers to question reliability and inherited values.  

  **Recommendation:** If the grandmother isn’t your moral center, *lean in*. Moral goodness and manipulation coexist often (e.g., a parent lying to protect a child). This deepens your theme of "inheritance" — sometimes we inherit flawed tools, even from loved ones.  

  ---

  ### **What This Procedure Can’t Do**  
  1. **Misclassifies Culturally Nuanced Influence:** E.g., communal societies where "guilt" is normative bonding, not exploitation.  
  2. **Ignores Tone/Subtext:** Sarcasm, irony, or affection can flip a scene’s meaning. You must interpret nuance.  
  3. **Fails at Benevolent Paternalism:** If the aunt *correctly* believes the protagonist is self-destructive, "manipulation" might be ethically justified. **This is a values call—you decide.**  
  4. **Overlooks Long-Term Context:** A pattern of influence (e.g., aunt always exploits grief) matters more than one scene. Track holistically.  

  **Final Advice:** Use this to flag *risk*, not dogma. If a scene feels "off" despite passing as persuasion, trust your instinct. The procedure exposes craft flaws; you control the moral heartbeat.  

  > "All mentors manipulate. The question is whether they aim for your growth or their agenda."  
  > —Your Novel’s Unwritten Epigraph
