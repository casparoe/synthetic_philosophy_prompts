  ### Clean Worked Example: Nash vs. Kalai-Smorodinsky Disagreement  
  **Scenario**  
  Alice and Bob, co-owners of a startup, are negotiating how to split a **\$1M buyout offer** and a **consulting contract worth \$200K** (if awarded). If they disagree, both get nothing. Alice values money linearly (1 util = \$1) and is uniquely qualified for the contract, which is useless without her. Bob values money linearly too. The contract can be assigned independently. Utilities are:  
  - If Alice takes all money and contract: ($1M + $200K) = **1.2M utils** for her, $0 for Bob.  
  - If Bob takes all money and Alice takes the contract: $1M for Bob, $200K for Alice (**0.2M utils**).  
  - If Alice takes the contract and 50% of the money, and Bob takes 50% of the money: Alice gets $500K + $200K = **0.7M utils**, Bob gets $500K = **0.5M utils**.  
  - *Disagreement point*: (0, 0).  
  - *Ideal point*: Alice's max = 1.2 (all money + contract), Bob's max = 1.0 (all money).  

  **Utility Possibility Set (Convex Hull)**  
  Vertices: (0,0), (1.2,0), (0,1.0), (0.7,0.5).  
  *Efficient frontier*: Two segments:  
  1. From (1.2,0) to (0.7,0.5): *u<sub>B</sub> = −2.5(u<sub>A</sub> − 1.2)*  
  2. From (0.7,0.5) to (0,1.0): *u<sub>B</sub> = 1.0 − 0.714(u<sub>A</sub> − 0)*  

  ---

  ### Math Walkthrough  
  **Kalai-Smorodinsky (KS) Solution**  
  1. **Ideal point**: (max *u<sub>A</sub>*, max *u<sub>B</sub>*) = (1.2, 1.0).  
  2. **Ray from (0,0) to ideal point**: *u<sub>B</sub> = (1.0/1.2)u<sub>A</sub> = (5/6)u<sub>A</sub>*.  
  3. **Intersect with frontier**:  
     - On segment 1: *u<sub>B</sub> = −2.5(u<sub>A</sub> − 1.2)*.  
       Set equal: *(5/6)u<sub>A</sub> = −2.5u<sub>A</sub> + 3.0*  
       → *u<sub>A</sub>(5/6 + 5/2) = 3.0* → *u<sub>A</sub> = 0.9*, *u<sub>B</sub> = 0.75*.  
     - On segment 2: *(5/6)u<sub>A</sub> = 1.0 − 0.714u<sub>A</sub>* → *u<sub>A</sub> ≈ 0.79* (not in [0, 0.7]).  
     → **KS = (0.9, 0.75)**. Alice gets 90% of money + contract; Bob gets 10% of money.  

  **Nash Bargaining Solution**  
  1. Maximize product *u<sub>A</sub> × u<sub>B</sub>* on the frontier.  
  2. **Segment 1 (u<sub>A</sub> ∈ [0.7, 1.2])**:  
     *u<sub>B</sub> = −2.5u<sub>A</sub> + 3.0* → Product = *u<sub>A</sub>(−2.5u<sub>A</sub> + 3.0)*.  
     Derivative: *3.0 − 5u<sub>A</sub> = 0* → *u<sub>A</sub> = 0.6* (invalid, outside [0.7,1.2]).  
     Check endpoints:  
     - (1.2, 0): Product = 0.  
     - (0.7, 0.5): Product = 0.35.  
  3. **Segment 2 (u<sub>A</sub> ∈ [0, 0.7])**:  
     *u<sub>B</sub> = 1.0 − 0.714u<sub>A</sub>* → Product = *u<sub>A</sub>(1.0 − 0.714u<sub>A</sub>)*.  
     Derivative: *1.0 − 1.428u<sub>A</sub> = 0* → *u<sub>A</sub> ≈ 0.7* (valid).  
     → At *u<sub>A</sub> = 0.7*, *u<sub>B</sub> = 1.0 − 0.714×0.7 ≈ 0.5*.  
     → **Nash = (0.7, 0.5)**. Alice gets 50% of money + contract; Bob gets 50% of money.  

  ---

  ### Key Difference & Why  
  - **KS**: Alice gets **0.9M utils**, Bob gets **0.75M utils**.  
  - **Nash**: Alice gets **0.7M utils**, Bob gets **0.5M utils**.  
  → **Disagreement direction**: Alice gets *more* under KS (0.9 > 0.7), Bob gets *more* under Nash (0.75 > 0.5).  

  **Feature Doing the Work**:  
  - **Alice’s elevated ideal point (1.2 vs. Bob’s 1.0)**. The consulting contract (which *only Alice* can leverage) inflates her maximum possible utility. KS prioritizes proportional gains relative to these asymmetric ideals, favoring Alice. Nash ignores ideals and maximizes the joint product, favoring the "larger base" (Bob gains more from money alone).  

  ---

  ### Nash Partisan Counter-Argument  
  **Why KS is "off" here**:  
  1. **Rewards irrelevant outside options**: The consulting contract is worthless without Alice, so her "ideal" (1.2) is an artifact of the problem setup. Nash argues only *feasible* outcomes should matter—not hypothetical maxima.  
  2. **Ideal points distort fairness**: KS allows Alice to claim extra leverage from an option (contract) she can’t achieve unilaterally. Nash’s product maximization reflects true bargaining power: money is the only divisible, mutually relevant resource.  

  **Convergence if tweaked**:  
  - Remove the contract (or make it achievable by both). Now utilities are symmetric: *u<sub>A</sub> + u<sub>B</sub> ≤ 1.0*, ideal point = (1.0, 1.0).  
    → KS: *u<sub>B</sub> = u<sub>A</sub>* → (0.5, 0.5).  
    → Nash: Maximize *u<sub>A</sub>u<sub>B</sub>* → (0.5, 0.5).  
    **Result**: Both solutions agree. The disagreement vanishes when asymmetric ideals are removed.  

  **Teaching Punchline**:  
  > "KS cares about *dreams* (ideal points), Nash cares about *reality* (feasible gains). Here, Alice’s exclusive contract lets her 'dream bigger'—so KS rewards her. But if you think ideals shouldn’t influence splits, Nash’s money-focused split is fairer."
