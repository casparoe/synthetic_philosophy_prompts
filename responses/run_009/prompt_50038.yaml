  First I need to recall the core concepts: Popper's falsification says scientific theories must make testable predictions that could prove them wrong. Lakatos added that researchers often protect their core theories with "protective belts" of auxiliary assumptions when faced with counter-evidence. Rescues can be "progressive" (leading to new testable predictions) or "degenerating" (merely ad hoc adjustments).

  The user specifically asks about what exactly the 1990 wager falsified - was it Ehrlich's core scarcity claim or just auxiliary assumptions? Then I need to list possible rescues for Ehrlich (like wrong decade or wrong indicators), classify them as ad hoc or progressive by Lakatos' standards, and finally address the perpetual "right but early" defense that Malthusians have used for centuries.

  This requires careful mapping: Simon actually claimed that market mechanisms would prevent long-term scarcity, while Ehrlich predicted physical depletion would dominate. The wager tested market prices as a proxy over one decade - a very specific operationalization. The falsification framework is silent on whether prices perfectly reflect physical scarcity or whether ten years is sufficient.

  For the table, I'll include rescues like: 
  - Temporal escape (wrong decade) 
  - Indicator selection (wrong metals) 
  - Market distortion arguments 
  - The "bomb still ticking" deferral 

  Each needs classification: temporal and indicator arguments feel ad hoc unless tied to new predictions, while market critique could be progressive if it specifies testable conditions where prices fail. The perpetual deferral is clearly degenerating - the hallmark of pseudoscience.

  The trickiest part is judging the "right but early" defense. It's legitimate only if tied to specific timeframes or tipping points that can be tested. Malthusians lose credibility when they keep moving goalposts without new risky predictions.

