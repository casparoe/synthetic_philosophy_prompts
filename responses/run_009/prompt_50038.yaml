prompt: |-
  In 1980, the biologist Paul Ehrlich — whose The Population Bomb (1968) had forecast mass famines within decades — accepted a wager from the economist Julian Simon, who held that human ingenuity keeps resources effectively unlimited. Ehrlich chose five metals — chromium, copper, nickel, tin, and tungsten — and staked $1,000 on their being more expensive, in inflation-adjusted terms, in October 1990; if they were cheaper, he would pay the difference. All five fell in real terms, tin dramatically so, and Ehrlich mailed Simon a check for the difference. A proposed rematch on a broader set of environmental indicators was floated in the 1990s but never agreed.

  Analyze this episode through the theory of falsification and rescue in long-run prediction. What proposition, exactly, did the 1990 settlement falsify — Ehrlich's scarcity claim itself, or an auxiliary assumption (the decade chosen, market institutions, price as a proxy for physical scarcity)? Enumerate the rescues available to Ehrlich — wrong decade, prices the wrong test, the bomb still ticking — and judge each by a Lakatosian standard: which are ad hoc, and which are progressive, in the sense of committing him to some new risky prediction he would otherwise not make? Then turn the case against the theory: Malthus's own predictions failed in his lifetime, and his defenders have said for two centuries that he was right but early. Under what conditions, if any, is that form of rescue more than an unfalsifiable escape hatch, and what criterion separates the legitimate right-but-early from the degenerating one? Be disciplined about the mapping: state what each man actually claimed, what was actually tested, and where the falsification framework is silent. Do not simply declare a winner between Simon and Ehrlich; test the framework on the case and the case on the framework.

  End with a table having exactly these columns: Rescue open to the long-run pessimist | Ad hoc or progressive | New risky prediction it entails | Verdict on the rescue. Include one row for each rescue you enumerate.
