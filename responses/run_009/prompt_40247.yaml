prompt: |-
  I host a small philosophy of mind podcast and next week's guest is a philosopher who defends the actualist higher-order thought theory of consciousness — on his view a state becomes conscious when it's accompanied by a suitable higher-order thought to the effect that one is in that state. Draft me around eight to ten interview questions. I don't want him just restating the view, so press where the literature actually presses. Make sure I've got at least one question each on: the misrepresentation problem (what it means for consciouness if the higher-order thought gets the lower-order state wrong — could I experience one colour as another?); what happens to phenomenal consciousness in animals and infants, whose meta-representational abilities are supposed to be limited; and whether the theory explains phenomenal character or merely redescribes which states are conscious. Also, my co-host keeps going on that higher-order thoughts are really just an indexing or tagging system, marking states for some global workspace in a way that's barely different from first-order rivals — include one question putting that worry to him straight. For each question, add a follow-up keyed to the reply he's most likely to give. Please write the questions in British English, and keep them concrete enough that he can't deflect with "that's just the hard problem".
