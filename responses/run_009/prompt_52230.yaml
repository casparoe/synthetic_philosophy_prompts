  ### Key Design Notes:
  1. **Distinction Coverage**:
     - **Target of Intervention**: Q1 (inputs), Q2 (architecture), Q3 (preference-shaping) separate acceptance of each type.
     - **Standard of Justification**: Q4/Q5/Q7 isolate welfare (A), anti-paternalism (B), harm-to-others (C), and wrong-prevention (Q5C).
     - **Granularity**: Q6/Q8 contrast population-level (A) vs. case-by-case (B/C) justification.

  2. **Inseparable Positions**: Feinberg and Thaler-Sunstein share identical answer patterns because both accept nudges/information but reject coercion and preference-shaping. Philosophical differences (voluntarism vs. choice architecture) require discursive clarification.

  3. **Unoccupied Patterns**: 
     - The incoherent pattern combines mutually exclusive justifications.
     - The unattractive pattern rejects mild interventions while accepting heavy-handed ones—a position rarely defended.

  4. **Prescription-Rule Nuance**: Q6C (exemptions) is grouped with case-by-case views (Feinberg/Thaler-Sunstein) as it rejects pure population-level logic.

  This instrument forces participants to reveal implicit priorities through tradeoffs in concrete cases, avoiding label-based debates while operationalizing your regulatory experience. The scoring key highlights tensions within each position to stimulate discussion.
