  The user needs help adjudicating this historical dispute fairly before a vote, but more importantly, they seem to be grappling with deeper questions about historical truth versus community identity. This isn't just about who's right - it's about how a community reconciles documentary evidence with lived tradition. 

  The amateur historian's findings are significant: contemporaneous documents show Nathaniel Coyle signed eviction notices during the famine, with no mention of sheltering families. The sheltering narrative only appears in a 1930s pageant. This creates tension between verifiable history and cherished local identity.

  Ruth takes a strictly evidentiary approach: archives should prevail when they're contemporaneous, independent and convergent, while the tradition is late and traceable to a single source. She sees maintaining the plaque as propagating falsehood. 

  Denis counters that archives reflect power structures - what gets recorded and preserved. He argues oral tradition can preserve suppressed truths, and even if the story originated late, it's become genuine community memory through decades of retelling. For him, commemoration is about aspirations, not factual accuracy.

  Their debate escalates: Ruth insists the lack of oral tradition preceding the pageant invalidates Denis's argument, while Denis maintains that the story's century-long integration makes it authentic community memory regardless of origin. 

  Both make valid points but miss nuances. Ruth overlooks how archives themselves are curated and partial. Denis risks conflating later tradition with actual historical memory. The core tension is between historical rigor and the social function of commemoration.

  The solution might lie in reframing rather than choosing sides. Perhaps the memorial could be adapted to honor actual sheltering efforts during the famine without tying it to Coyle specifically, or adding context to the plaque acknowledging the complexity. This honors both truth and community values.

  The user's unspoken need seems to be for a way forward that preserves community cohesion while respecting historical integrity - they're wisely avoiding a premature vote. The answer should validate both perspectives while suggesting how the committee might transcend this binary.
answer: |-
  Let's adjudicate this exchange step by step, analysing the merits and limitations of each position in British English:

  **1. Ruth's Opening Position ("The record should simply win")**
  *   **Her Argument:** Contemporaneous, independent, convergent archival evidence (multiple eviction notices) outweighs a single, late, demonstrably invented tradition (1930s pageant). Treating them as rivals elevates fiction. Keeping the plaque propagates a known falsehood.
  *   **Where Ruth is Strong:** She correctly identifies the *evidential hierarchy*. Convergent contemporaneous documents carry significantly more weight for establishing *factual events* than a tradition originating decades later without prior attestation. Her point about the plaque becoming propaganda if maintained knowingly is ethically sound from a historical accuracy standpoint.
  *   **Where Ruth is Potentially Weak/Overstated:** She implies the archive is a complete and objective "tribunal," underestimating its inherent partiality (as Denis counters). She risks reducing commemoration *solely* to factual testimony.

  **2. Denis's First Reply ("Archives are not the clean tribunal...")**
  *   **His Argument:** Archives reflect power structures (who wrote, what was kept). Compliance paperwork survives; quiet defiance might not. Oral tradition *can* preserve suppressed truths. Absence of evidence (in archive) isn't evidence of absence (in reality).
  *   **Where Denis is Strong:** He correctly highlights the **archival blind spot**. Historical records are never neutral; they favour the official, the powerful, and the documented process. The *possibility* that Coyle acted covertly, leaving no trace in the very records Ruth relies on, is theoretically valid. His point about oral tradition's *potential* role is historically sound *in principle*.
  *   **Where Denis is Weak/Overreaching:** He presents a *theoretical possibility* (covert defiance) but offers no *evidence* to support it happening *in this specific case*. He invokes "oral tradition" prematurely, as Ruth will challenge.

  **3. Ruth's Rejoinder ("...we do not have an oral tradition...")**
  *   **Her Argument:** Denis's defence requires an *actual* oral tradition passed down, but the evidence shows the story originates *with* the 1930s pageant. He's defending a "memory" that never existed contemporaneously.
  *   **Where Ruth is Strong:** She lands a crucial blow. The research shows no *trace* of the sheltering story *before* the pageant. Denis's valid point about oral tradition preserving suppressed truths **does not apply here** because there's no evidence such a tradition *predated* the pageant. The story demonstrably *entered* the record late.
  *   **Where Ruth is Potentially Weak:** She focuses solely on the *origin* and factual claim, potentially downplaying what the story *became* for the community after 1939.

  **4. Denis's Concession & Shift ("...it is now genuinely the community's memory...")**
  *   **His Argument:** Concedes the story's late origin but argues that 85+ years of retelling, belief, and community organisation *around* the story have made it authentic "community memory" *regardless* of its factual origin. Commemoration's purpose is aspirational (what we value) not strictly testimonial (what happened). Coyle symbolises real community values/sheltering during other crises. Correcting the plaque severs the anchor of this lived identity.
  *   **Where Denis is Strong:** He makes a vital point about the **function of commemoration and social memory**. Stories, even invented ones, can become powerful, meaningful parts of a community's identity and self-understanding through sustained belief and practice. The distinction between historical testimony and aspirational symbol is important. His warning about the potential psychological and social cost of abruptly dismantling a foundational narrative is valid.
  *   **Where Denis is Weak:** He risks **conflating "community memory" with "historical fact."** While the story *functions* as memory, its *origin* as a late invention means it doesn't preserve suppressed *historical* truth about Coyle (as his earlier argument implied). His defence now rests entirely on its *later* social function, not its historical accuracy. He also risks suggesting that any identity-sustaining myth is equally valid, regardless of its basis.

  **5. Ruth's Final Word ("...an identity that survives only by refusing to know its own past is already discredited...")**
  *   **Her Argument:** Denis has moved the goalposts from "history is fallible" to an unjustified equivalence between robust evidence and a single, late, motivated story. An identity built on wilful ignorance of documented facts is flawed. The core issue is the town becoming complicit in teaching known falsehoods.
  *   **Where Ruth is Strong:** She correctly identifies Denis's shift and maintains the critical distinction in evidential weight. Her ethical point about institutionalised falsehood ("miseducation") is powerful. She argues that a community's identity *should* be able to withstand, or even be strengthened by, engaging honestly with its documented past, even if complex.
  *   **Where Ruth is Potentially Weak:** She arguably underplays the *real*, lived experience and meaning the Coyle story has held for generations *within* the community for nearly a century. Dismissing it solely as "propaganda" or "miseducation" might oversimplify its social function.

  **The Shared Blind Spot:**

  Both Ruth and Denis, in their passionate defence, overlook a crucial third dimension: **the actual historical experience of the Famine-era poor in the town and the complex reality of local responses.**

  *   **Ruth's focus** is narrowly on *Coyle's documented actions* (evictions) and debunking the *specific myth* about him. She doesn't necessarily engage with the broader question: *Was* there sheltering? *Who* actually did it? What *was* the local experience beyond Coyle's official role?
  *   **Denis's focus** is on defending the *symbolic value* of the story for *later* community identity. He invokes other sheltering "in other crises" but doesn't connect it back to investigating the *actual* Famine experience in the town itself. He uses the *possibility* of suppressed truth as a shield for the *known* invented story, rather than seeking evidence of the real, perhaps less heroic or more complex, local responses that the myth might obscure or overwrite.
  *   **What's Missing:** The committee's research has uncovered Coyle's role in evictions and debunked the specific myth about *him*. But it hasn't necessarily illuminated the **lived reality of the Famine in the town** or identified **actual instances of resistance, sheltering, or community support that *did* occur**, perhaps by less prominent figures whose actions weren't officially recorded. Both arguments centre on Coyle and the plaque, potentially obscuring the opportunity to honour the genuine, albeit perhaps fragmented and unrecorded, experiences of resilience and compassion that *did* exist among ordinary people.

  **In Summary:**

  *   **Ruth is demonstrably correct** on the **specific historical facts** about Nathaniel Coyle: the archival evidence convincingly shows his involvement in evictions and the complete lack of contemporaneous evidence for the sheltering story, which originates with the 1930s pageant. Her ethical stance against knowingly perpetuating a known falsehood is strong.
  *   **Denis makes a valid, important point** about the **social function of commemoration and community identity**, arguing that the story, however invented, has acquired meaning and value through sustained belief and practice. His concern about the disruptive impact of removing this symbolic anchor without offering an alternative is legitimate.
  *   **Both miss the opportunity** to look beyond the figure of Coyle and the specific myth to explore the **broader, messier, and likely more profound historical reality** of the Famine's impact and local responses within the community. The research so far exposes the myth but doesn't necessarily reconstruct the authentic, albeit potentially less heroic or more complex, history it replaced.

  The core tension is between **historical veracity** (Ruth) and **social meaning/identity** (Denis). Ruth wins on the facts of the Coyle case. Denis raises valid concerns about the social consequences of simply removing the symbol without addressing the community need it fulfilled. The shared blind spot is the lack of focus on uncovering and commemorating the *actual*, albeit perhaps less easily monumentalised, experiences and actions of the townspeople during that traumatic period.
