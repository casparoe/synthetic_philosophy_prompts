  First, I need to unpack each of their examples. When a model uses the same induction heads for sequence continuation in both English and French, they see it as the same mechanism. That makes sense because the underlying algorithm is identical despite different inputs. Then there are separate networks solving modular arithmetic with trigonometric components—no shared weights, but same algorithm, so still same mechanism. So here, mechanism isn't about specific parameters but the computational approach.

