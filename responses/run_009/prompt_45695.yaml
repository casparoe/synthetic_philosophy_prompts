prompt: |-
  i'm a phd student in linguistics (pragmatics/politeness stuff) and I have this running argument with my flatmate Sanne — she's Dutch, I spent two years in Japan, so you can imagine. We keep going back and forth on whether white lies are actually wrong or whether they're just honesty that's been properly socialized, so lately I've started writing down her rulings to see if she even has a consistent view. Her verdicts so far:

  - at a lab dinner in Kyoto she told the host the food was delicious when it was honestly kind of bland — fine, no question
  - her supervisor asked what she thought of his new draft and she told him straight up that the argument section was a mess — also fine, zero regrets
  - a struggling first-year asked if his chapter was ready to send off and she told him it was basically there when it really wasn't — she admits that one was wrong and feels bad about it
  - right after a visiting Japanese colleague's talk she told him, in front of the whole lab, that he needs to slow down because nobody could follow him — she now says that was the wrong call, should've been private and softened

  next week I get to test her on three new ones:

  1. A friend gives a wedding toast, sits down next to her and asks "how was it, was it ok?" The wedding's over, that exact speech will never happen again, and Sanne thought it flopped. Does she say it was lovely?
  2. Same visiting colleague, two years later. He's been posted in Amsterdam the whole time, and before his next talk he says something like: I've been around dutch people long enough, drop the politeness and tell me, was my talk actually any good? — except this is at a conference in Kyoto, surrounded by his Japanese colleagues.
  3. I ask her, at drinks after a seminar, right in front of the speaker, whether the talk we just sat through was any good. I'm asking for it and I'm Dutch, but the speaker is Japanese and it's her first week visiting the lab.

  Predict her verdicts if you can, but what I really want is the rule she's running. Is it something like "you may mislead whenever the truth wouldn't do the person any actual good"? Or "it's wrong to deprive someone of info they'd want about something they care about — phrase it however, but don't mislead"? Or "read the room, follow its norms, and only ever lie about trivia"? Or maybe a taste-vs-competence line: lie about whether you liked the food, never about whether someone's work is good? Which of these actually fit her record, what does each one predict for my three cases, and if two rules still fit after her answers, what case would I need to split them apart? Also give me your best guess with reasons, I have money riding on case 1.
reasoning: |-
  Okay, let me tackle this linguistics puzzle. The user is a PhD student in pragmatics/politeness studies locked in a debate with their Dutch flatmate Sanne about the ethics of white lies. They've recorded Sanne's past judgments on four scenarios and now want to predict her verdicts on three new cases while reverse-engineering her underlying rule. 

  First, I need to analyze Sanne's existing rulings systematically. Her four decisions show interesting patterns: she approved white lies about bland food at a Kyoto dinner but rejected softening criticism for a first-year student. She also condemned blunt public feedback to a Japanese colleague despite endorsing direct criticism to her supervisor. 

  Hmm, the key seems to be distinguishing between domains. When the host asked about food (subjective experience), deception was fine, but when the first-year asked about chapter readiness (professional competence), honesty was required. Similarly, criticizing the supervisor's draft (professional context) demanded candor, but the colleague's speaking pace (social/professional boundary) needed discretion.

  For the wedding toast case (subjective/social), Sanne will likely approve saying "it was lovely" since the speech can't be improved and the truth serves no purpose. But for the visiting colleague's talk quality (professional competence), even when he requests directness, the Kyoto setting and Japanese colleagues present would make honesty too risky - she'll probably insist on softening. 

  The toughest is the third scenario where the user (Dutch) asks about talk quality in front of the Japanese speaker. Sanne's dilemma: professional norms demand honest evaluation among peers, but cultural/politeness rules forbid public criticism. Given her past reaction to similar public feedback, she'll likely dodge or soften the answer. 

  The consistent principle emerging is: deception is permissible only when (a) the domain is subjective/social, (b) the truth offers no actionable benefit, and (c) cultural norms permit indirectness. Professional contexts demand honesty unless cultural risks override. This explains all four past rulings and cleanly predicts the new cases. 

  To test this against alternatives, consider a "pure harm prevention" rule - it would wrongly predict Sanne should lie to the first-year student to spare feelings. A "cultural compliance" rule fails because she was blunt with her Dutch supervisor despite being in Japan. The domain distinction holds best. 

  For the money bet on case 1: confidently predicting Sanne will endorse the white lie. The toast is subjective, unchangeable, and socially trivial - hitting all her permissibility criteria. No Dutch directness obligation here either since the friend isn't seeking improvement.
answer: |-
  Based on Sanne's rulings and Dutch/Japanese pragmatics contrasts, here's the analysis of her likely rule, predictions for your 3 cases, and how to test them:

  ### Sanne's Consistent Rule (Best Fit)
  **"Deception is only permissible when ALL are true:**  
  1. **The domain is subjective taste/social ritual (NOT competence/work)**  
  2. **The truth offers no actionable improvement**  
  3. **Cultural norms expect indirectness in that context"**

  ### How It Explains Her Past Rulings:
  - **Bland food praise (OK):** Subjective taste (1), no actionable benefit (2), Kyoto context expects polite indirectness (3).  
  - **Supervisor's draft criticism (OK):** Professional competence (violates 1 → honesty required). Truth is actionable.  
  - **First-year's "ready" chapter lie (WRONG):** Professional competence (1 violated). Truth was actionable (needed revisions).  
  - **Public pace criticism (WRONG):** Competence-related (1), actionable (2), but violated cultural norms by being public/unsoftened (3). Should've been private = honoring indirectness norm.

  ---

  ### Predictions for Your 3 Cases:
  1. **Wedding Toast ("Was it ok?" when flopped):**  
     🔶 **Verdict: SAY IT WAS LOVELY**  
     *Why:* Subjective ritual (1), no actionable benefit (toast can't be redone) (2), wedding context expects positivity (3). *Your bet: Bet on "yes, she lies."*  

  2. **Colleague in Kyoto ("Drop politeness, was my talk good?"):**  
     🔶 **Verdict: STILL SOFTEN/INDIRECTLY CRITICIZE**  
     *Why:* Competence domain (1), truth is actionable (2), BUT Kyoto context with Japanese colleagues overrides his "Dutch" request (3). Sanne will prioritize cultural norms over his ask.  

  3. **You asking about talk quality in front of Japanese speaker:**  
     🔶 **Verdict: DODGE OR SOFTEN HEAVILY**  
     *Why:* Competence (1), truth *might* be actionable (2), but public context + Japanese speaker's face needs trump Dutch bluntness (3). She might say "It covered important ground" or "Ask me later."

  ---

  ### Rules Tested & Why They Fail:
  | Proposed Rule                     | Fails Past Cases                                  | Prediction for Case 2                          |
  |-----------------------------------|--------------------------------------------------|-----------------------------------------------|
  | "Lie if truth has no benefit"     | *First-year case: Truth had benefit → she felt lying was wrong* | Would permit honesty → **WRONG** (she'll soften) |
  | "Never deprive wanted info"       | *Food case: Host might want truth → but lying was fine* | Demands honesty → **WRONG** for Case 1        |
  | "Follow local norms strictly"     | *Supervisor case: In Japan, but she was blunt → OK* | Kyoto context demands indirectness → **WRONG** for Case 3 (she'll soften despite you being Dutch) |
  | "Taste (lie) vs. Competence (truth)" | **FITS ALL PAST CASES**                           | Predicts Case 1: lie, Case 2/3: truth → **WRONG** for Case 2/3 (she'll soften, not be fully honest) |

  ### Critical Test Case to Split Rules:
  Propose this scenario to Sanne:  
  *"A Dutch friend in Amsterdam asks Sanne privately: 'Be honest, does this sweater look bad on me?' Sanne thinks it’s hideous. The friend won’t return it, can’t change it, and it’s purely about taste."*  

  - **Domain Rule (current winner):** Lie permitted (subjective, no action, Dutch context allows honesty but doesn't *demand* it here).  
  - **Benefit Rule:** Must tell truth (no benefit to lying).  
  - **Norms Rule:** Must be honest (Dutch norm).  

  If Sanne says lying is **OK**, it confirms the domain rule. If **wrong**, she’s likely using a hybrid benefit/norms rule.

  ### Best Guess with Reasoning
  Sanne prioritizes **protecting competence-related face** (never mislead on actionable work) but allows deception for **subjective/social rituals** where truth causes harm without benefit. Crucially, **cultural context modulates expression** (directness level), not the core honesty/deception choice.  

  For your cases:  
  - **Case 1:** ✅ Lie allowed (subjective ritual)  
  - **Case 2:** ❌ Can’t be fully honest (cultural risk overrides individual request)  
  - **Case 3:** ❌ Can’t be honest (public + hierarchical face threat)  

  *Money tip: Bet heavily on "she says it was lovely" for the wedding toast.*
