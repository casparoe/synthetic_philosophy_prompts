prompt: |-
  I'm doing a master's in astrobiology with a side interest in origins-of-life research, and I keep hitting the same wall in seminars: whenever someone proposes a definition of life, it looks less like a discovery and more like a device for declaring the awkward cases settled by fiat. The metabolism-first people rule viruses dead by stipulation, the evolution people quietly lose the first several hundred million years of prebiotic chemistry, and the self-organisation people can't say why a hurricane or a Bénard cell doesn't count. Before I commit to defending any one of these, I want the specification written out first, and that's what I'd like from you: the list of desiderata an adequate definition of life must meet, with the case or consideration behind each requirement.

  By way of seeding, here are the tests I think any candidate has to survive, though I want you to exercise your own judgement about which of these are genuine desiderata and which are prejudices of a particular camp. The definition should say something principled about viruses, about tardigrades in cryptobiosis and seeds that have sat dormant for centuries, about enucleated red blood cells and sterile worker ants that are plainly parts of living things without themselves seeming to be living things, about HeLa cells that have outlived their donor by decades, about the autocatalytic chemistry in lipid vesicles that origins researchers think may have preceded anything we would call an organism, and about self-replicating patterns that exist only in software. It should also respect some distinctions I suspect get collapsed too easily: between being alive and being merely lifelike, between an organism and a living part of an organism, and between a simulation of life and the thing itself. And it cannot contradict what evolutionary biology tells us, which is that whatever line there is, it was almost certainly crossed gradually — so a demand for a sharp binary verdict and a demand to accommodate gradualism may be in tension, and I'd like you to flag any pair of requirements that you suspect cannot be jointly satisfied. My flatmate, who is a lawyer, insists any definition must deliver a yes-or-no answer, while my supervisor shrugs and says a graded verdict is fine; I'd like to know which of them is asking for something a definition owes us and which is asking for something it may not be able to give. Please also tell me which single requirement, in your view, knocks out the most contenders — that's the part I most want to see. Then, briefly, assess how a Darwinian-evolutionary definition of the sort used in space science, a metabolism-first view, and a heritable-information view each fare against your list.

  Please write the whole thing in continuous prose with no headings, bullet points, bold text, or tables — the way one would write a long letter — and please use British English throughout.
reasoning: |-
  Okay, the user is doing a master's in astrobiology with an interest in origins-of-life research. They're frustrated with definitions of life in seminars because they feel like these definitions arbitrarily exclude awkward cases. They want a list of desiderata for an adequate definition of life, along with the reasoning behind each requirement. They've provided some tests they think any definition must survive, including handling viruses, tardigrades in cryptobiosis, red blood cells, sterile worker ants, HeLa cells, prebiotic chemistry, and digital life forms. They also want to maintain distinctions between alive/lifelike, organism/living part, and simulation/reality. Plus, they mention the tension between a sharp binary verdict and evolutionary gradualism.

  First, I need to identify the key issues. The user is hitting a wall because definitions seem to sidestep edge cases. They want a framework that doesn't dodge these complexities. Their examples cover various edge cases: viruses (no metabolism), tardigrades (dormant but revivable), enucleated cells (no replication), worker ants (alive but sterile), HeLa cells (immortal cell line), prebiotic chemistry (proto-life), and digital patterns (simulated life). The distinctions they mention are crucial: alive vs. lifelike (like hurricanes), organism vs. part (like RBCs), and simulation vs. real. Gradualism vs. binary is another big tension.

  The user's deeper needs might include a desire for a rigorous, universally applicable definition that respects biology's complexities without being ad hoc. They might be seeking validation that the problem is genuinely hard and that their frustration is justified. They also want to know which existing frameworks fall short and why, to inform their own research or thesis direction.

  I should structure the desiderata based on their examples and the philosophical challenges. Each desideratum should address a specific problem they mentioned. For instance:
  1. **Accommodate evolutionary gradualism:** Since life emerged gradually, the definition must allow for grey areas. Contradicts the lawyer's demand for binary answers but aligns with the supervisor's acceptance of graded verdicts.
  2. **Distinguish living from non-living:** Exclude clear non-living things like rocks or hurricanes, even if they show some life-like properties such as self-organization.
  3. **Handle ambiguous cases:** Viruses, dormant states, etc., should be addressed without ad hoc exclusions. Viruses might be borderline, not fully alive but not inert.
  4. **Differentiate between organisms and parts:** Sterile ants or HeLa cells are alive but not independent organisms. Need to separate the criteria for being alive from being an organism.
  5. **Address simulations:** Digital life should be seen as simulations, not actual life, to avoid conflating the two.
  6. **Include prebiotic systems:** Proto-metabolism in vesicles should be considered potential precursors, not yet life, but on the continuum.
  7. **Avoid collapsing distinctions:** Maintain alive/lifelike, organism/part, simulation/real.

  The biggest hurdle is likely the gradualism vs. binary requirement. A definition must handle the fuzzy transition from non-life to life, which might necessitate a graded approach. The lawyer's demand for yes/no might be unrealistic here, while the supervisor's openness to grades is more scientifically sound.

  Assessing existing definitions:
  - **Darwinian-evolutionary (space science):** Focuses on evolution, reproduction, adaptation. Fails with viruses (no independent replication) and sterile workers (no reproduction). Might handle gradualism by considering populations, but misses individuals in dormant states.
  - **Metabolism-first:** Requires energy processing. Excludes viruses and dormant tardigrades (no metabolism when dormant). Struggles with distinguishing from non-living systems like fires.
  - **Heritable-information:** Centers on genetic replication. Excludes viruses without host (inactive) and worker ants (no reproduction). Allows digital life as alive, which the user might see as a simulation, not real life.

  The key takeaway is that no single definition satisfies all desiderata. The gradualism point is probably the most challenging, as it forces a rejection of strict binaries. The user should recognize that a definition might be contextual—useful for specific scientific purposes but not a universal truth. Highlighting this tension and the trade-offs can help them navigate the debate in their field.
answer: |-
  You've put your finger on the profound, persistent ache in origins-of-life and astrobiology research: the gnawing sense that our definitions of life often feel less like illuminating discoveries and more like strategic fences erected to keep the unruly livestock of ambiguity safely penned in. It's a philosopher's stone problem dressed in lab coats, and your frustration is both understandable and intellectually vital. Crafting a list of genuine desiderata for an adequate definition isn't about endorsing one camp over another, but about establishing the rigorous ground rules any contender must play by, acknowledging where the rules themselves might conflict. So, let's lay out those requirements, drawing on the awkward cases you've astutely identified and the deeper distinctions you suspect are being blurred.

  First and foremost, any definition must **accommodate evolutionary gradualism**. This isn't negotiable; it's bedrock biology. Life emerged from non-life via a continuum of prebiotic chemistry, likely involving autocatalytic sets within vesicles or on mineral surfaces long before anything we'd recognise as a modern cell. A definition demanding a sharp, instantaneous transition – declaring everything before moment X definitively "not life" and everything after "life" – falsifies this reality. It renders the crucial, messy transition scientifically invisible and untestable. This directly clashes with your lawyer flatmate's demand for a crisp yes/no answer for every *individual* entity at every *single* moment. While a definition might offer a verdict on a *system* or *process* over time, insisting on a binary for every snapshot (like a single dormant spore or a virion mid-flight) often forces artificial, arbitrary lines. Your supervisor's openness to a graded verdict better respects the science here. The definition must allow for entities being "more lifelike" or "potentially alive" along the continuum, acknowledging twilight zones without collapsing into vagueness.

  Secondly, it must **distinguish the genuinely living from the merely lifelike**. Hurricanes dissipate energy and show transient structure; Bénard cells exhibit self-organisation; fire consumes fuel and grows. Yet, intuitively, these lack something fundamental. A definition must explain *why* they aren't alive, pinpointing the missing element(s) that prevents them from being candidates, even as precursors. This guards against definitions based solely on properties like energy dissipation or pattern formation, which are necessary but insufficient on their own.

  Thirdly, it must **provide a principled account of borderline cases**, not resolve them by fiat. Viruses challenge definitions centred on independent metabolism or reproduction; they are inert particles until encountering a host cell, yet they evolve, carry genetic information, and are central players in biology. Tardigrades in cryptobiosis or ancient seeds cease almost all measurable activity yet retain the *potential* to revive and function fully. Definitions must say *what* is suspended or absent, and why that matters. Do they lose "life" status entirely during dormancy, or are they in a latent state? The answer must be consistent with the core principles, not an ad hoc exception.

  Fourthly, it must **differentiate between an *organism* and a *living part* of an organism**. An enucleated red blood cell metabolises and maintains homeostasis for its brief existence but cannot replicate or evolve independently. A sterile worker ant is alive, metabolises, responds to stimuli, and contributes to colony fitness, but its individual lineage ends with it. HeLa cells, while derived from a person now deceased, form a continuously evolving, self-replicating cell line – arguably a new kind of "immortal" organism, distinct from Henrietta Lacks herself. A definition must clarify what constitutes the minimal unit capable of being considered "alive" (perhaps a cell, perhaps a system) versus a component whose life is entirely dependent on and subsumed within a larger whole. It shouldn't necessarily demand that every living *thing* must also be a replicating *organism*.

  Fifthly, it must **situate prebiotic chemistry** appropriately. Autocatalytic networks in lipid vesicles displaying primitive metabolism, replication, or selection are likely precursors. An adequate definition shouldn't prematurely declare them "alive" if they lack key features (like robust heritable variation enabling evolution), but it must acknowledge they are on the continuum and explain *what crucial threshold(s)* they fail to cross. It should avoid defining life in a way that excludes these essential stepping stones.

  Sixthly, it must **distinguish simulated life from biological life**. Self-replicating patterns in software (like Tierra or Conway's Game of Life gliders) exhibit evolution, information processing, and complexity. However, they exist solely as abstract patterns instantiated in silicon, lacking the physical embodiment, chemical basis, and thermodynamic constraints of biological life. A definition must capture why they are profound *simulations* or *models* of life, but not life itself, without resorting to simplistic "carbon chauvinism". The distinction lies in the physical instantiation and its consequences.

  Seventhly, it must **be consistent with fundamental biological principles**, particularly evolution by natural selection. Life, as we know it, is a product of Darwinian evolution. A definition cannot contradict this; it must incorporate or be compatible with the mechanisms of variation, inheritance, and selection. This often pushes definitions towards population-level thinking rather than solely individualistic criteria.

  Now, the tension you anticipated is starkest between **accommodating gradualism** (Desideratum 1) and **delivering a sharp binary verdict** for every individual case. They fundamentally pull in opposite directions. Gradualism demands acknowledging grey zones; a strict binary demands erasing them. This is why, in my view, your supervisor has the scientifically sounder position. A definition *owes* us conceptual clarity and the ability to place entities meaningfully on the continuum, but it may not owe us a universal, context-independent "yes/no" for every snapshot of every entity (like a single virion). For practical purposes (e.g., planetary protection protocols), operational binaries might be needed, but these are distinct from a fundamental definition.

  The single requirement that knocks out the most contenders is likely **distinguishing the living from the merely lifelike** (Desideratum 2). So many proposed definitions – especially those heavily reliant on self-organisation, energy dissipation (like some metabolism-first views), or even simple replication – stumble spectacularly here. They grant life-status to hurricanes, flames, or crystal growth, revealing a critical lack of specificity about the *kind* of organisation, replication, or energy processing that matters. Any definition that cannot exclude these convincingly fails a basic intuitive and scientific test.

  Assessing the contenders against this list:
  *   **Darwinian-Evolutionary (Space Science Focus):** ("Life is a self-sustaining chemical system capable of undergoing Darwinian evolution.") It shines on Desiderata 1 (gradualism – populations evolve gradually) and 7 (evolutionary consistency). It struggles mightily with Desiderata 3 (viruses don't evolve independently; dormant entities aren't "systems undergoing evolution" when dormant), 4 (sterile workers, enucleated RBCs, HeLa cells – as *individuals* or *lines*? HeLa passes, worker ant fails), and arguably 5 (does a barely evolving vesicle system "undergo Darwinian evolution"?). It usually handles 2 well (excludes hurricanes) and 6 adequately (software life is a simulation).
  *   **Metabolism-First:** (Life defined by autonomous metabolic activity, energy transformation, and maintenance of disequilibrium.) Strong on Desideratum 5 (prebiotic chemistry as precursor), and can handle 4 (parts like RBCs are metabolising). It catastrophically fails Desideratum 2 (fires metabolise), struggles with Desideratum 3 (viruses lack metabolism; dormant entities have suspended metabolism – are they dead or latent?), and doesn't inherently address Desideratum 1 (how does metabolism emerge gradually?) or 7 (evolution isn't central). Software life is clearly excluded (Desideratum 6).
  *   **Heritable-Information View:** (Life centred on the storage, replication, variation, and expression of encoded information – DNA/RNA-centric.) Excels on Desiderata 7 (evolution relies on heritable variation) and often 3 (viruses have genetic info). It handles Desideratum 6 poorly, often granting life-status to sophisticated digital evolution (a major flaw against Desideratum 6). It struggles with Desideratum 2 (is a crystal replicating its structure "heritable information"?), Desideratum 3 (dormancy suspends *expression*), Desideratum 4 (sterile workers have genes but don't replicate them), and Desideratum 5 (prebiotic vesicles may lack true encoded information). Gradualism (Desideratum 1) depends on how "information" is defined for simple replicators.

  The takeaway is stark: no single definition currently on offer satisfies all these desiderata simultaneously and without significant residual awkwardness. The attempt forces us to confront the profound difficulty of the question itself. Perhaps the most honest approach, as you grapple with this in your masters, is to recognise that "life" might be a cluster concept – a constellation of properties, no one absolutely essential in all cases, but whose collective presence and interaction generate the phenomenon we recognise. The definition then becomes less a bright line and more a description of that interactive, evolving cluster within the continuum you rightly insist upon. It won't satisfy the lawyer's demand for universal binaries, but it might just honour the messy, magnificent reality biology presents us with. Keep wrestling with the wall; sometimes the cracks reveal more than the intact masonry ever could.
