  Here is a disambiguation of "wie es eigentlich gewesen" ("how it actually was" or "how it essentially was"), structured by claim strength, defensibility, and relevance to your seminar debate. This framework should help you analyze the arguments systematically.

  ### The Spectrum of Claims Implied by "How It Actually Was"

  | **Level** | **Core Claim** | **Defensibility** | **Actually Held?** | **Ranke's Alignment?** |
  |-----------|----------------|-------------------|-------------------|------------------------|
  | **Level 1: Foundational Evidentialism** | Historians must prioritize primary sources, avoid fabrication, and correct demonstrable errors. | **Highly Defensible** (Bedrock of historical practice) | **Universally held** by professional historians, including Ranke | ✓ (Explicit in his method) |
  | **Level 2: Methodological Objectivity** | Rigorous source criticism enables justified confidence about past events; independent accounts converge toward reliable conclusions. | **Defensible (with caveats)** | **Widely held** as an ideal and practical goal | ✓ (Core to his practice) |
  | **Level 3: Strong Epistemic Objectivity** | A complete, perspective-free reconstruction of the past is achievable in principle. | **Indefensible** | **Rarely/never held** by serious theorists; often a **straw man** | ✗ (Incompatible with his views) |
  | **Level 4: Exhaustive Meaning & Metaphysics** | Establishing "what happened" exhausts historical meaning; historical truth exists independently of narrative form. | **Problematic** | **Implied by some positivists**; Ranke held a **divine variant** | △ (Divine essence ≠ brute facts) |
  | **Level 5: Anti-Narrativism** | Narrative form adds nothing to historical truth; it is merely decorative. | **Indefensible** | **Rarely explicitly held**; sometimes implied | ✗ (Contradicts his practice) |

  ### Detailed Breakdown of Each Level

  1.  **Level 1: Foundational Evidentialism (The Banal Core)**
      *   **Claim:** The historian has a basic duty to: a) Prefer primary sources and evidence over rumor, legend, or uncritical secondary accounts. b) Not deliberately invent events, people, or motives. c) Correct demonstrable factual errors found in previous accounts. This is the "do not lie" and "try to get the facts right" level.
      *   **Defensibility:** **Highly Defensible.** This is the bedrock commitment of professional historical practice. Abandoning this makes the activity indistinguishable from fiction or propaganda.
      *   **Actually Held?** **Yes, universally** by professional historians, including Ranke himself. His preface explicitly champions archival research against previous historiographical traditions.

  2.  **Level 2: Methodological Objectivity (Convergence through Criticism)**
      *   **Claim:** Through rigorous source criticism (external and internal), philology, contextualization, and cross-referencing, the historian can achieve a high degree of justified confidence about *what happened* in specific instances. Competing accounts, subjected to these methods, can converge on reliable conclusions about events. Bias *can* be identified and mitigated methodologically. This aims at "best available explanation" based on evidence.
      *   **Defensibility:** **Defensible (with significant caveats).** This is the practical working ideal of most historians. It acknowledges the difficulty but asserts that disciplined method gets us closer to reliable knowledge than alternatives. Caveats include: limits of evidence, unconscious bias, the role of framing questions, and the impossibility of total "bias neutrality."
      *   **Actually Held?** **Yes, widely** as an ideal and practical goal by historians from Ranke onwards, including many modern "critical realists." It underpins source seminars and peer review. Ranke was a pioneer of this methodological rigor.

  3.  **Level 3: Strong Epistemic Objectivity (Mirror of the Past)**
      *   **Claim:** It is possible, *in principle*, for the historian to achieve a complete, definitive, and entirely perspective-free ("view from nowhere") reconstruction of "the past as it actually happened." The historian is a neutral transcriber. Archival diligence and methodological purity *guarantee* objectivity. The past is directly and fully recoverable.
      *   **Defensibility:** **Indefensible.** Contradicted by: the situatedness of the historian (temporal, cultural, personal), the fragmentary and mediated nature of evidence, the necessity of selection and framing (What events? Which sources? What scale?), the linguistic construction of reality, and post-positivist philosophy of science/history.
      *   **Actually Held?** **Rarely, if ever, by serious historical theorists.** Often a **caricature (straw man)** used to discredit empiricism or positivism. While *aspirational rhetoric* sounding like this existed among some 19th-century positivists, their *practice* usually revealed awareness of limitations. **Ranke almost certainly did not hold this view.** His focus on "essence" and divine order contradicts the idea of a brute, perspective-free factual totality.

  4.  **Level 4: Exhaustive Meaning & Historical Metaphysics (Meaning = Facts)**
      *   **Claim:** Establishing "what actually happened" (understood as a sequence of verified events) *exhausts* the meaning or significance of the past. There is no deeper "meaning" beyond establishing the facts. Alternatively (and crucially for Ranke), historical meaning *is* inherent in the factual structure of the past itself, often seen as divinely ordained (Ranke's view), and is directly accessible through establishing "what happened."
      *   **Defensibility:** **Highly Problematic.**
          *   **Secular Version ("Meaning = Facts"):** Indefensible. Historians constantly interpret the *significance* of facts, their connections, causes, consequences, and meanings for human actors and later periods. Facts alone are inert.
          *   **Ranke's Divine Version ("Facts Reveal God's Plan"):** A coherent theological/metaphysical position, but **unprovable** and rejected by secular historians. It makes meaning *objective* (in God's plan) but accessible *only* through the divinely ordered facts.
      *   **Actually Held?**
          *   **Secular Version:** Implicitly by some strict positivists, but rarely articulated fully.
          *   **Divine Version:** **Yes, by Ranke.** This is the core of the "essentialist" interpretation. "Eigentlich" points to the inner, divine essence manifest *in* the factual events. Grasping "wie es eigentlich gewesen" means discerning God's hand *through* the rigorously established facts. Meaning isn't *beyond* the facts; it's *in* them, divinely infused.

  5.  **Level 5: Anti-Narrativism (Form is Irrelevant)**
      *   **Claim:** The narrative form in which history is written is purely decorative or merely a vehicle for delivering the established facts. It adds *nothing* to the historical truth or meaning. The truth resides *only* in the propositional content ("fact X happened"), independent of its presentation.
      *   **Defensibility:** **Indefensible.** Narrative form (selection, emplotment, argumentative structure) fundamentally shapes how facts are understood, connected, and what they are seen to *mean*. The same facts emplotted as tragedy, comedy, or farce convey different meanings. Form is constitutive of historical understanding.
      *   **Actually Held?** **Rarely explicitly.** Sometimes implied by the most extreme forms of positivism or naive realism. **Ranke did not hold this view.** His own writing was highly narrative and interpretive, aiming to reveal the "essence" through his presentation.

  ### Mapping the Combatants' Arguments

  1.  **Your Methods Instructor:**
      *   **Needs/Assumes:** Attacks **Level 3 (Mirror of the Past)** and **Level 5 (Anti-Narrativism)** as the core defects of 19th-century positivism, implicitly (and sometimes explicitly) attributing them to Ranke via the "how it actually was" mistranslation. Uses Ranke as the emblem of this flawed ideal.
      *   **Vulnerability:** The "essentialist" translation (**Level 4 Divine Version**) **significantly rescues Ranke** from the instructor's primary attack. If Ranke meant "how it essentially was" (divine essence manifest *in* facts), he wasn't advocating for a perspective-free mirror (Level 3) nor dismissing the importance of narrative form for revealing meaning (contra Level 5). The instructor's critique hits a *caricature* of Ranke and positivism (the straw man of Level 3), but not Ranke's actual, more complex position (Level 4 Divine).

  2.  **The Visiting Professor (German History):**
      *   **Argument:** Advocates for the **Level 4 Divine Version** ("essentially," "characteristically," grasping the inner nature/divine essence *through* rigorous factual establishment). This rescues Ranke from the naive positivist caricature (Level 3).
      *   **Strengthens:** Corrects the mistranslation and provides a theologically/metaphysically coherent reading of Ranke's intent.
      *   **Weakness:** Doesn't necessarily invalidate critiques of Ranke's *metaphysics* (belief in divine legibility) or the practical consequences of his method (which could still *lean* towards objectivism in practice, even if not in ultimate theory). Also, Ranke's divine Level 4 is still vulnerable to White's critique (see below).

  3.  **Your Fellow Student (Straw Man):**
      *   **Argument:** Claims the fight is over a straw man because **Level 3 (Mirror of the Past)** was never seriously held.
      *   **Accuracy:** **Largely correct regarding Level 3.** Serious historians, including most 19th-century ones, understood limitations. The caricature is indeed a straw man used polemically.
      *   **Inaccuracy:** Misses the mark regarding **Level 2 (Methodological Objectivity)** and **Level 4 (Exhaustive Meaning - Divine Version)**. Level 2 *is* widely held and relied upon by working historians ("best available explanation through method"). Level 4 *was* held by Ranke. The fight has substance if it's about the validity/scope of Level 2 or the metaphysics of Level 4, not just the indefensible Level 3. The instructor might be attacking *residual* or *unexamined* aspects of Level 2/Level 4 thinking in practice, using the Ranke quote as shorthand.

  4.  **Hayden White's Challenge (Narrativism):**
      *   **Target:** White's narrativism fundamentally challenges **Level 2, Level 3, Level 4, and Level 5.**
          *   **Level 2 (Methodological Objectivity):** White argues that *before* the narrative act, there is no "set of facts" waiting to be explained. The "facts" are constituted *by* the narrative framework chosen by the historian (employment). Source criticism operates *within* a prefigurative narrative commitment. Convergence is often on facts *already* shaped by shared cultural narratives/ideologies.
          *   **Level 3 (Mirror):** Directly refuted as impossible.
          *   **Level 4 (Meaning = Facts/Divine Essence):** Refuted. Meaning is not found *in* the facts (divine or otherwise) but is imposed *upon* them by the historian's narrative choices (tragic, comic, etc.). Even Ranke's divine essence would be just one possible (metaphysical) narrative trope among others. The *choice* of the divine essence narrative is itself a literary/ideological act.
          *   **Level 5 (Anti-Narrativism):** Directly refuted; form *is* constitutive.
      *   **Spares?** Only **Level 1 (Foundational Evidentialism)** in its *absolute minimal* sense: don't fabricate, use sources. But even Level 1 is complicated by White – *what counts* as a relevant source or a "fact" is shaped by the narrative. White argues narrative shapes history *from the ground up*, including the constitution of "facts." He leaves untouched the bare notion of not *consciously lying*, but destabilizes everything built upon it.

  ### Conclusion for Your Paper

  *   **Ranke:** Was primarily committed to **Level 1** and **Level 2**, grounded in a **Level 4 (Divine Version)** metaphysics. He did *not* hold **Level 3** or **Level 5**. The "essentialist" translation is crucial for understanding him.
  *   **Instructor's Critique:** Effectively targets **Level 3** (a straw man) and perhaps unreflective aspects of **Level 2** or secularized remnants of **Level 4**, but misattributes this simplistic view to Ranke via the mistranslation.
  *   **Straw Man Charge:** Valid against attacks solely focused on **Level 3**, but potentially misses the real targets (**Level 2** as an ideal, **Level 4** metaphysics) or their practical manifestations that the instructor might be concerned about.
  *   **White:** Radically challenges **Levels 2, 3, 4, and 5**. His critique goes far beyond refuting the straw man (**Level 3**) and fundamentally questions the epistemological foundations of mainstream historical practice (**Level 2**) and any metaphysics of inherent meaning (**Level 4**), arguing that narrative construction is primary. He leaves only a very minimal, almost empty **Level 1** intact.
  *   **Working Historians:** Primarily rely on and defend **Level 2** as their practical, fallible methodology for establishing justified beliefs about the past, often bracketing or ignoring the deeper challenges of **Level 4** metaphysics and White's **narrativism**.

  Your paper's strength will lie in using this precise disambiguation to show *which* versions of "how it actually was" are in play in the debate, how they map onto Ranke's intent and subsequent critiques, and where the real points of contention (both historical and philosophical) actually lie. Avoid the vague battle; focus on the specific claims.
