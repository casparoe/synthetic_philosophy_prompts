  Okay, the user teaches ethics and is encountering a specific pattern in aesthetics related to forgeries. They've noticed that when the provenance of a piece is revealed—like a fake Vermeer or counterfeit wine—critics who initially praised the work later claim they can now see its flaws all along. Conversely, if a piece is reattributed to a master, suddenly its qualities are "discovered." The user wants a name for this phenomenon where aesthetic judgments are retroactively revised based on changed beliefs about origin, without just being about the object's value.

  First, I need to recall existing concepts. The "mere ownership effect" or endowment effect is about valuing owned items more, but that's different. Confirmation bias fits somewhat, but it's broader. The "halo effect" might apply, where one attribute (like authenticity) influences other judgments. But the user wants something specific to aesthetic revision post-provenance change.

  There's the "Van Meegeren effect" used informally, but it's not standardized. Other terms like "attribution shift" or "provenance paradox" come to mind, but I need to check literature. The user mentioned that standard explanations focus on the object's value as a historical performance, but they're interested in why past experiences get rewritten. So, the key is the retrospective reevaluation of personal experience, not just the object's worth.

  Next, distinguishing from snobbery and memory distortion. The user wants to know if this is a distinct phenomenon. Snobbery would involve social pressure, but here the critics genuinely believe their perception changed. Memory issues like confabulation might play a role, but the insistence on correction suggests something more cognitive. 

  The user also asks edge cases: if unwritten misremembered liking counts, or if refusal to revise disqualifies it. For the first, if there's no record, it's harder to verify, so the phenomenon might require documented judgments. Refusal to revise might indicate the person isn't susceptible, so the phenomenon applies only to those who do revise. 

  Regarding perceptual change vs. report: studies like wine-tasting with false labels show that beliefs can alter sensory experience, not just reports. Neuroscience might support that top-down processing affects perception. So both elements are involved.

  I should synthesize a term that captures the essence: retroactive reevaluation triggered by provenance, where the person believes their sensory judgment was in error. "Provenance-induced aesthetic revision" (PIAR) seems precise. "Retrocausal aesthetic recalibration" is more evocative but clunky. The user might prefer a balance of accuracy and memorability.

  Also, considering the philosophy angle: aesthetic realism vs. anti-realism. The user teaches ethics, so they might appreciate the tension between objective qualities and contextual factors. The phenomenon challenges realism because judgments shift with context, not just inherent properties. 

  Practical application: the user needs this for teaching or writing. Providing a clear definition with boundaries (documented judgments, insistence on error correction) and contrasting it with related concepts (snobbery, memory errors) will help. Mentioning real examples (Van Meegeren, wine fraud) grounds the term. 

  Finally, recommending sources: philosophers like Danto or Sibley on aesthetic perception, psychological studies on expectation effects. This gives the user avenues to explore further.
answer: |-
  This is a brilliantly articulated problem at the intersection of aesthetics, psychology, and epistemology. You've pinpointed a fascinating and persistent phenomenon that *is* discussed but lacks a single, universally accepted technical term. Here's the conceptual carving you need, including existing candidates, a proposed new term, and answers to your edge cases:

  **Existing Concepts & Why They Fall Short (or Can Be Adapted):**

  1.  **The "Van Meegeren Effect":** Sometimes used informally, but it's descriptive rather than conceptual and specific to forgery exposure, not reattribution gains.
  2.  **Aesthetic Confirmation Bias:** Captures the *post-hoc* rationalization but doesn't emphasize the *retroactive revision of past experience* or the insistence on *correcting an error*. It's broader.
  3.  **Cognitive Dissonance Reduction (Festinger):** Explains the *motivation* (reducing discomfort between "I praised it" and "it's fake/bad") but not the specific *form* the reduction takes (revising the *aesthetic perception itself* retrospectively). The "misreading a measurement" claim goes beyond simple dissonance reduction.
  4.  **Halo Effect (Thorndike) / Horns Effect:** Attribution to a master casts a positive "halo," making everything seem better; attribution to a forger casts negative "horns." This is crucial, but it primarily explains the *current* judgment shift, not the *retroactive rewriting* of the *past* judgment and experience.
  5.  **Expectation Effect / Top-Down Processing (Psychology/Neuroscience):** This is fundamental. Beliefs and expectations demonstrably shape perception (e.g., wine tasting with fake labels). This explains *how* the new belief changes *current* experience, but again, not the rewriting of the *past*.
  6.  **Aesthetic Contextualism:** The broader philosophical view that context (including provenance, history) is constitutive of the aesthetic object and thus the experience. This provides the *foundation* for why provenance matters, but doesn't name the specific *psychological phenomenon of retrospective revision* of judgment and memory.

  **Proposed Term: "Provenance-Induced Aesthetic Revision" (PIAR)"**

  *   **Why it works:**
      *   **"Provenance-Induced":** Clearly identifies the trigger (change in believed origin/authenticity).
      *   **"Aesthetic":** Specifies the domain (judgment of qualities like beauty, skill, depth, kitsch).
      *   **"Revision":** Captures the core action – the rewriting of the *past* judgment and often the *past* perceptual memory/description.
      *   **Insistence on Error Correction:** Implicit in "Revision" – it's presented as fixing a mistake, not changing taste.
  *   **Distinguishing Features:**
      *   **Retroactive Focus:** The key is revising the *record* or *memory* of the *past* aesthetic judgment and often the *past* perceptual experience itself ("I can *now* see the kitsch that was *always there*").
      *   **Sincerity & Documented Judgment:** The prior positive/negative judgment must have been sincerely held and ideally documented (the tasting notes, the glowing review). This anchors the revision.
      *   **Insistence on Epistemic Correction:** The reviser frames it as discovering a truth previously missed ("misreading the measurement"), not merely changing their mind or taste ("I used to like it, now I don't").
      *   **Distinction from Snobbery:** Snobbery is social posturing or adherence to external standards *despite* personal perception. PIAR involves a *genuine shift in reported perception and memory*. The snob might say, "Well, it *looks* good, but it's fake, so it's worthless." The PIAR subject says, "I *now see* it's actually ugly/kitsch/bad and always was; I was simply *wrong* before."
      *   **Distinction from Ordinary Forgetting/Self-Serving Memory:** While memory distortion plays a role, PIAR is a specific *pattern* triggered by *provenance change*. It's not random forgetting; it's a systematic, motivated revision *framed as epistemic insight* about the object's inherent properties. Ordinary forgetting doesn't usually involve the "it was always bad/good" claim.

  **Addressing the Edge Cases:**

  1.  **"Does it count when nothing was written down and people just misremember liking it?"**
      *   **Yes, partially, but it's harder to verify and less pure.** The core of PIAR is the *revision of a prior held judgment*. If someone *sincerely believed* they liked it originally but now, due to provenance change, both dislike it *and* believe they *must have been mistaken* originally (perhaps misremembering *why* they liked it, or insisting the flaws were always perceptible), it shares the core psychological mechanism. However, without documentation, it becomes entangled with ordinary unreliable memory and is harder to distinguish from simple preference shift confabulated as past error. The documented case is the clearest instance. **Verdict:** It's a *fuzzier* or *weaker* form of PIAR, leaning more towards general confabulation/memory bias unless the "error correction" framing is very strong.

  2.  **"Does it count when the person refuses to revise ("still love it, sue me")?"**
      *   **No.** This is the *opposite* phenomenon. It demonstrates that provenance change *doesn't always* induce this specific revision. This person maintains their aesthetic judgment is about the *perceived object* itself, independent of discovered history. They might acknowledge the historical/financial devaluation ("It's a fake, so it's worthless on the market") but insist their *aesthetic experience* of the object's visual/sensory qualities remains positive. This highlights that PIAR is not inevitable; it requires the individual to *accept* the new provenance as fundamentally altering the nature of the object or their ability to perceive its "true" qualities. **Verdict:** This refusal is evidence *against* PIAR occurring in that individual for that object.

  3.  **"Does belief change perception vs. just report?"**
      *   **Evidence Strongly Suggests Literal Perceptual/Cognitive Change:** This is where expectation effects and top-down processing are key. Studies (especially in wine, but also art) show:
          *   Brain imaging suggests different neural activation when viewing art believed to be authentic vs. fake, even if it's the same image.
          *   Tasting notes for identical wines change dramatically based on the (falsely) presented label/provenance. People aren't just *lying*; their reported sensory experience genuinely differs.
          *   Eye-tracking studies might show different patterns of visual attention when provenance beliefs change.
      *   **The Mechanism:** Belief about provenance sets up powerful expectations that shape attention, interpretation, and the weighting of sensory input. Believing it's a Vermeer focuses attention on subtle harmonies, prompting a search for depth; believing it's a van Meegeren focuses attention on awkward anatomy or garish color, interpreting it as kitsch. Memory is then reconstructed to align with this new perceptual/cognitive schema. **Verdict:** It's not *just* the report; the underlying perceptual and cognitive *experience*, and thus the *memory* of that experience, is genuinely altered by the new belief. The "misreading a measurement" claim reflects their *feeling* that they are now perceiving accurately what was always there, facilitated by the new interpretive lens.

  **In Summary:**

  *   **The Phenomenon:** Provenance-Induced Aesthetic Revision (PIAR).
  *   **Core:** Retroactive revision of documented/sincere aesthetic judgment *and* memory of perceptual experience triggered by a change in believed provenance, framed as correcting a past epistemic error about the object's inherent properties.
  *   **Distinguished From:**
      *   **Snobbery:** Involves genuine perceptual/memory shift, not just social conformity.
      *   **Ordinary Forgetting/Memory Bias:** Specific pattern triggered by provenance change, framed as error correction.
      *   **Simple Preference Shift:** Maintains the *object's* properties were misjudged, not just that personal taste changed.
  *   **Edge Cases:**
      *   **Unwritten/Misremembered Liking:** A weaker, fuzzier form if "error correction" framing is strong.
      *   **Refusal to Revise:** Demonstrates PIAR is not inevitable; disqualifies the case.
      *   **Perception vs. Report:** Evidence indicates a literal change in perceptual/cognitive experience and memory reconstruction, not just dishonest reporting.

  PIAR highlights the profound entanglement of cognition, perception, memory, and context in aesthetic experience, challenging simplistic notions of "objective" aesthetic properties residing solely in the object. It's a powerful example for ethics too, demonstrating motivated reasoning and the construction of narrative coherence in our judgments.
