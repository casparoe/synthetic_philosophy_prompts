     We expect Group 1 to assign a higher prior probability to the bag coming from Factory A (because they just worked on Factory A) and Group 2 to assign a higher prior to Factory B.

     Specifically, we can ask each participant to write down their prior probability that the bag is from Factory A. We expect Group 1 to have a higher prior for Factory A than Group 2.

