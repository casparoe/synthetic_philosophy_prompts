          Now, if we draw another gold coin, the disagreement may persist.

          We can do multiple draws to show that even after several gold coins, the groups might still be apart.

     However, note that if we draw enough gold coins, both groups will converge to 1. But the path and the speed of convergence will be different.

     We want to show persistent disagreement for a few rounds.

  4. Payoff scheme: Use a prediction market. At the beginning, after the warm-up and before any draws, participants can buy/sell shares in "The bag is gold-favoring" at a price between 0 and 1 (play money). They get paid at the end if they hold a share and the bag is gold-favoring, or if they sold a share and the bag is silver-favoring (so the price reflects the probability). We can do multiple rounds: after each draw, they can trade again. We expect the two groups to have different prices at the beginning and after each draw.

  5. Structure of the 75 minutes:

     - (5 min) Introduction: Explain the setup (without the factories) and the goal. Split into two groups (Group 1 and Group 2) and send them to different parts of the room.

     - (15 min) Warm-up: Each group does their warm-up exercise. They are told they are quality control for a factory and see the history. They answer the warm-up question and then are told about the main activity: that the bag they will test is from either Factory A or Factory B (but they don't know which). They are asked to write down their prior probability that the bag is from their assigned factory (i.e., Group 1 for Factory A, Group 2 for Factory B). Then, they are also asked for their prior that the bag is gold-favoring. They should calculate this using the factory prior and the factory's statistics.

     - (5 min) Regroup: Bring everyone together. Explain that they will now see coin draws from the bag. The bag was produced by either Factory A or Factory B, but we don't know which. We are going to draw coins (with replacement) and show the results.

     - (30 min) Evidence and trading rounds: We do 5 draws (pre-determined: let's say we plan to draw 4 gold and 1 silver, but we can adjust to get disagreement). After each draw, we ask participants to update their probability that the bag is gold-favoring. We then run a prediction market: each participant has $100 in play money. They can trade shares in the claim "The bag is gold-favoring". The share pays $1 if the bag is gold-favoring and $0 otherwise. We can have a market maker (e.g., using a logarithmic market scoring rule) or let them trade among themselves. Alternatively, for simplicity, we can have them write down their current probability (which they can use to set a price: if they think the probability is p, they are willing to buy at any price below p and sell at any price above p). Then we can have a couple of minutes of trading. We record the market price (or the average of the probabilities) for each group.

     - (20 min) Debrief: Reveal the true state (if we want, but it's not necessary). Discuss the results. Show the graph of how the two groups' probabilities evolved. Map to the theorem:

          Prior: The initial probability of the bag being gold-favoring. This is different because of the warm-up (different prior over the factory).

          Evidence: The same coin draws for everyone.

          Posteriors: After each draw, they update, but they start from different priors so they end up with different posteriors.

