     The bag contains either 90 gold and 10 silver (call this a "gold-favoring" bag) or 10 gold and 90 silver (a "silver-favoring" bag). Factory A produces gold-favoring bags 80% of the time and silver-favoring 20% of the time. Factory B produces gold-favoring bags 20% of the time and silver-favoring 80% of the time.

     Now, we draw coins (with replacement) and show the results. The question: What is the probability that the bag is gold-favoring?

     Now, the evidence is not decisive. For example, a gold coin is more likely if the bag is gold-favoring.

