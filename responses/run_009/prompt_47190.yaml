  We are going to design an activity that demonstrates the importance of the common prior assumption in Aumann's agreement theorem. The key is to have two groups that receive the same evidence but end up with different posteriors because of different priors. We'll set up the different priors by having participants engage in a warm-up exercise that shapes their initial beliefs without giving them any new information about the main question.

  Activity: "The Mysterious Bag of Coins"

  Premise:
  We have a bag that contains either 100 gold coins and 0 silver coins, or 0 gold coins and 100 silver coins. But there's a twist: the bag was prepared by one of two factories. Factory A produces bags that are 80% likely to be all-gold and 20% likely to be all-silver. Factory B produces bags that are 20% likely to be all-gold and 80% likely to be all-silver. We don't know which factory produced the bag.

  The question for the participants: What is the probability that the bag is all-gold?

  However, we don't tell the participants about the factories upfront. Instead, we split them into two groups and prime them with a warm-up that leads them to believe in one factory or the other.

  Mechanism for Different Priors:

  1. Warm-up round (before the main activity, done in two separate groups without knowing about the other group's task):
     - Group 1: They are told that they are quality control for Factory A. They are given a history: Factory A has produced 100 bags. They are told that 80 of these bags were all-gold and 20 were all-silver. They are then asked: "What is the probability that the next bag produced by Factory A is all-gold?" (Answer: 80%). They are also told that Factory A uses a particular process that tends to produce all-gold bags 80% of the time. They are asked to write down their reasoning.

     - Group 2: Similarly, they are told they are quality control for Factory B. They are given a history: 20 of 100 bags were all-gold and 80 were all-silver. They are asked the same question for Factory B (Answer: 20%). They are told about a different process that leads to 20% all-gold.

     This warm-up is designed to make each group identify with one factory and to form a prior that the bag (if from their factory) is all-gold with 80% (Group 1) or 20% (Group 2) probability. But note: we haven't said which factory produced the bag in the main activity.

  2. Main activity setup:
     - Bring the two groups together. Now tell them: "We have a bag that was produced by either Factory A or Factory B. We don't know which. We are going to draw coins from the bag one by one. Each draw is with replacement so that the bag composition doesn't change. Each coin drawn will be shown to everyone."

     - We start with a prior over which factory? We haven't given any information. But each group has been primed to think about one factory. However, we haven't told them that the two factories are equally likely? Actually, we haven't specified the prior over factories. This is the key: we will leave the prior over factories unspecified, and the warm-up will cause the two groups to have different priors about which factory produced the bag.

