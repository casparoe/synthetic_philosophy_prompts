answer: |-
  Below is a complete session plan designed to make participants viscerally experience why the common prior assumption is essential to Aumann's agreement theorem. The activity uses a "Bayesian tug-of-war" where two groups see identical evidence but maintain divergent posteriors due to seeded prior differences. The debrief explicitly maps the experience to the theorem and real-world disagreements.

  ---

  ### **Session Title:** "The Factory Game: Why Your Starting Point Matters More Than Your Evidence"

  #### **Learning Goals**
  - Feel why common priors are necessary for Aumann-style convergence.
  - Distinguish prior-driven disagreement from irrationality or information asymmetry.
  - Develop a rule of thumb for diagnosing prior differences in real arguments.

  #### **Materials**
  - Whiteboard + markers
  - 14 index cards (7 per group)
  - Play money ($100 in $10 bills per participant)
  - Two identical sets of "evidence slips" (prepared in advance, see below)
  - Timer
  - (Optional) Bag of mixed coins for visual effect

  ---

  ### **Rules & Setup**  
  *(Total time: 75 min)*

  #### **Phase 1: Warm-Up to Seed Priors (15 min)**  
  *Goal: Create divergent priors via emotionally salient framing.*  
  - Split into **Group A** (7 people) and **Group B** (7 people) at separate tables.  
  - Give each group a warm-up task on an index card:  
    > **Group A (Optimist Factory):**  
    > *"Your factory makes medical kits. Historically, 90% of your kits cure diseases (success), and 10% fail (failure). A new kit is being tested. Write:  
    > 1. Your estimate of the kit's success probability (____%).  
    > 2. Why your factory's history justifies this."*  

    > **Group B (Pessimist Factory):**  
    > *"Your factory makes medical kits. Historically, 10% of your kits cure diseases (success), and 90% fail (failure). A new kit is being tested. Write:  
    > 1. Your estimate of the kit's success probability (____%).  
    > 2. Why your factory's history justifies this."*  

  - **Why this seeds priors (not stubbornness):**  
    Participants internalize their factory’s narrative as a "lens." This mirrors real-world priors formed by lived experience (e.g., growing up in a trusting vs. distrustful community). Crucially, *no new information is given about the kit*—only framing.  

  #### **Phase 2: Main Activity (35 min)**  
  *Goal: Identical evidence → divergent posteriors.*  
  - Regroup everyone. Announce:  
    > *"Both factories merged! The kit you evaluated is from the merged company. We’ll reveal 5 test results. After each result, bet on the kit's success probability using play money."*  

  - **Evidence sequence** (identical for both groups, read aloud + whiteboard):  
    Result 1: Success ✅  
    Result 2: Success ✅  
    Result 3: Failure ❌  
    Result 4: Success ✅  
    Result 5: Failure ❌  

  - **Betting protocol (prediction market):**  
    - After each result, participants write their *private* success probability (e.g., 75%) on an index card.  
    - Groups A and B separately average their probabilities → record on whiteboard.  
    - Participants bet with play money:  
      - Share price = probability (e.g., $0.75 for 75% success chance).  
      - Buy/sell 1 share per round (pays $1 if kit succeeds, $0 otherwise).  
    - **Incentive:** Most money wins bragging rights.  

  - **Predictable dynamics:**  
    - Group A starts high (e.g., 80–90%), Group B low (e.g., 10–20%).  
    - Both update with evidence, but Group A downweights failures ("fluke"), Group B downweights successes ("luck").  
    - Posteriors diverge persistently (see table below).  

  #### **Whiteboard Tracking Example**
  | Round | Evidence | Group A Avg. | Group B Avg. |  
  |-------|----------|--------------|--------------|  
  | Start | None     | 85%          | 15%          |  
  | 1     | ✅       | 88%          | 25%          |  
  | 2     | ✅       | 90%          | 40%          |  
  | 3     | ❌       | 75%          | 30%          |  
  | 4     | ✅       | 80%          | 45%          |  
  | 5     | ❌       | 70%          | 35%          |  

  #### **Why This Works**  
  - **Identical evidence, common knowledge:** Everyone sees the same results simultaneously.  
  - **Divergent posteriors:** Driven *only* by warm-up priors. Group A sees 3✅2❌ as "mostly successful"; Group B as "mostly failed."  
  - **No convergence:** Without common priors, updating amplifies initial differences.  

  ---

  ### **Debrief (25 min)**  
  *Map the game → Aumann’s theorem → real life.*  

  #### **1. Map to Aumann’s Theorem (10 min)**  
  - **Prior:** Warm-up factory histories. *"You entered with different beliefs about the kit’s base rate."*  
  - **Evidence:** Public test results (common knowledge).  
  - **Posteriors:** Group averages after each round.  
  - **Where the theorem fails:**  
    > *"Aumann assumes common priors + common knowledge of posteriors → agreement. Here, common priors were violated. You saw the same evidence but never agreed—because you started in different 'epistemic universes.'"*  

  - **What the game omits:**  
    - *Iterated announcement*: If groups shared posteriors between rounds, they *might* converge (but slowly; no time).  
    - *Common knowledge depth*: True common knowledge requires infinite recursion ("I know you know I know..."), which is impractical here.  

  #### **2. Rule of Thumb for Real Disagreements (10 min)**  
  > ***"When you disagree, ask: 'What evidence created your prior?'"***  

  - **Prior difference (legitimate):**  
    - Traces to fundamentally different experiences/frameworks (e.g., warm-up factories).  
    - *Diagnosis:* "Would neutral evidence (like a coin flip) be interpreted differently by both sides?" (In the game: ✅❌ were interpreted oppositely.)  
    - *Response:* Unpack priors first ("Why do you trust that source?").  

  - **Information difference or irrationality (cop-out):**  
    - One side ignores evidence or updates inconsistently.  
    - *Diagnosis:* "If given overwhelming proof, would they update? If not, it’s stubbornness." (In the game: Groups updated—just from different baselines.)  
    - *Response:* Demand Bayesian updating ("What would change your mind?").  

  - **Real-world examples:**  
    - *Priors:* Tech optimist vs. doomsayer on AI risk (different baseline assumptions).  
    - *Irrationaity:* Flat Earthers ignoring rocket footage.  

  #### **3. Why "Aumann!" Is Overused (5 min)**  
  - **The cudgel problem:** People invoke Aumann to claim dissenters are irrational. But:  
    > *"Random humans *never* have common priors. Aumann applies to agents with identical models (e.g., AI), not you and your uncle at Thanksgiving."*  
  - **Healthy takeaway:**  
    > *"Disagreement isn't evidence of stupidity—but *persistent* disagreement after sharing all evidence *does* imply prior differences. Unpack those instead of yelling."*  

  ---

  ### **What Could Go Wrong (and Fixes)**  
  1. **Problem:** Groups converge immediately (e.g., Group B ignores warm-up).  
     - *Fix:* Stress emotional framing in warm-up ("Your factory’s jobs depend on this!"). Use grad students to "role-play" their group’s bias.  

  2. **Problem:** Participants game the market (bet strategically vs. honestly).  
     - *Fix:* Remind them that accurate beliefs maximize long-term profits. Award a "Most Honest Updater" prize.  

  3. **Problem:** Evidence is too decisive (e.g., 5✅→ all agree).  
     - *Fix:* Use ambiguous evidence (e.g., 3✅2❌) as above.  

  4. **Problem:** One group dominates discussion.  
     - *Fix:* Enforce private writes before group averages.  

  ---

  ### **Why This Works**  
  - **Priors feel real:** Warm-up creates emotional investment (not artificial "assume p=0.8").  
  - **Posteriors diverge honestly:** Differences emerge from Bayes’ rule, not defiance.  
  - **Debrief connects to life:** Rule of thumb forces nuance in "Aumann!" wars.  

  By the end, participants will viscerally grasp that common priors are not a technicality—they’re the bedrock of disagreement. And they might yell "Priors!" instead.
