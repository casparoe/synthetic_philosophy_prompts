  My spouse and I spent the whole of last evening arguing about a series of bets and risks, and I ended the argument unable to state what principle, if any one principle, lies behind my own choices. I want to lay out my verdicts and ask you to tell me what captures them — or to tell me honestly which of my verdicts has to go. First, drawing a red ball from an urn containing exactly fifty red and fifty black balls versus from an urn of one hundred balls in a proportion of red to black that I know nothing about: I'll take the first urn, every time, even at slightly worse odds. Second, the same two urns, but betting on black instead of red: I still prefer the first urn, which my spouse says is incoherent, since if I'm indifferent between red and black in the second urn (I am), I'm implicitly treating it as fifty-fifty, and then I shouldn't care which urn I draw from. Third, insurance: I'll pay a noticeably higher premium to insure against a peril whose probability nobody can estimate, like a novel pandemic, than against a peril with the same actuarial point estimate that has been modeled to death, like residential fire. Fourth — and here my spouse claims to catch me reversing myself — given a lottery with precisely known 1-in-100 odds and a speculative venture with no odds at all, I'd pay more for a share of the venture than for the lottery ticket, even at the same price. Fifth, when a surgeon offers two procedures with identical estimated success rates, one established by decades of data and one by a handful of cases, I lean toward the established one, but if the surgeon tells me the established estimate comes from a registry she suspects of over-reporting, I flip, and prefer the small-trial procedure. My spouse's tentative principle, offered near midnight, was that I simply distrust any probability I can't verify — but that fits the first three cases and not the fourth, where I run toward the unverifiable number rather than away from it, and it is silent on the fifth