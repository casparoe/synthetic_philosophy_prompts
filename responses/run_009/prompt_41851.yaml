answer: |-
  Below is a systematic breakdown of the slogan "knowledge is the norm of assertion," ordered from weakest to strongest interpretations. For each reading, I assess its plausibility, substantive status, and ability to resolve the biology teacher case (your "selfless assertion" example). I then compare rival norms (truth, justified belief, reasonable-to-believe) on the teacher case and end with confidence assessments. This map aims to clarify *what* is disputed, not to resolve the debate.

  ---

  ### **The Slogan: "Knowledge is the norm of assertion" – Five Interpretations**

  1. **Descriptive Psychological Claim**  
     - **Thesis**: Speakers are disposed to treat knowledge as the default expectation for assertions (e.g., we criticize assertions lacking knowledge, and cite ignorance as a defect).  
     - **Plausibility**: High. Empirical studies (e.g., Turri, Buckwalter, Blouw) suggest ordinary speakers often evaluate assertions based on knowledge.  
     - **Substantive or Platitude?**: Substantive but contingent. It describes behavior, not a normative truth.  
     - **Settles Teacher Case?**: No. It only predicts that people *might* criticize the teacher for lacking knowledge, but doesn't imply they *should*. It labels reactions but doesn't normatively resolve the case.  

  2. **Sufficiency Claim**  
     - **Thesis**: If a speaker knows that *p*, their assertion that *p* is proper.  
     - **Plausibility**: Very high. Even critics of the knowledge norm (e.g., Weiner, Lackey) often accept sufficiency.  
     - **Substantive or Platitude?**: Near-platitude. Denying it implies knowledge is insufficient for proper assertion, which is counterintuitive.  
     - **Settles Teacher Case?**: Irrelevant. The teacher lacks knowledge, so sufficiency doesn't apply.  

  3. **Necessity Claim**  
     - **Thesis**: If a speaker asserts that *p*, their assertion is proper *only if* they know that *p*.  
     - **Plausibility**: Controversial. Supported by Williamson (2000), Turri (2011); rejected by critics (e.g., Lackey's "selfless assertion" cases).  
     - **Substantive or Platitude?**: Highly substantive. This is the core claim in the debate.  
     - **Settles Teacher Case?**: **Yes, directly**. The teacher lacks knowledge (no belief → no knowledge), so her assertion is improper. The slogan-as-necessity *dictates* this verdict, treating it as non-negotiable.  

  4. **Constitutive Norm Claim**  
     - **Thesis**: Knowledge is a *constitutive rule* of assertion, like checkmate rules in chess. An assertion without knowledge is not just improper but *defective qua assertion* (e.g., "move out of turn" in chess).  
     - **Plausibility**: Moderate among knowledge-norm advocates (e.g., Williamson); others see it as overreach (e.g., Goldberg).  
     - **Substantive or Platitude?**: Deeply substantive. Makes assertion's nature dependent on knowledge.  
     - **Settles Teacher Case?**: **Yes, with metaphysical force**. The teacher's utterance is not "fully" an assertion (or is "misfiring") due to lack of knowledge. This strengthens the necessity claim by adding that impropriety arises from the act's definition.  

  5. **Criticism- vs. Action-Guiding Norm**  
     - **Thesis**: The "norm" licenses criticism ("You shouldn’t assert without knowledge!") but doesn’t instruct speakers in advance ("Don’t assert without knowledge!").  
     - **Plausibility**: Ambiguous in literature; often underexplored. Williamson leans action-guiding; critics like Hill & Schechter see norms as primarily criticism-based.  
     - **Substantive or Platitude?**: Substantive. Affects whether the teacher violated a *duty* or is merely *blameworthy*.  
     - **Settles Teacher Case?**: **Partially**. If the norm is criticism-based, the teacher’s assertion may be improper (hearers can object) but could be *excused* due to her professional duty. If action-guiding, she violated a rule outright.  

  ---

  ### **Rival Norms on the Teacher Case**
  Your example *discriminates* between norms, as rivals treat the teacher differently. Crucially, intuitions about her case vary—some see her assertion as proper (due to evidence/duty), others improper (due to insincerity). Rival norms capture this split:  
  - **Knowledge Norm** (e.g., Williamson): Improper. She lacks belief, hence knowledge.  
  - **Truth Norm** (e.g., Weiner): **Proper** if the claim is *true* (which it is). Truth norms ignore psychological states, so her disbelief is irrelevant.  
  - **Justified Belief Norm** (e.g., Lackey): **Proper**. She has justification from evidence (even without belief). This norm prioritizes epistemic responsibility over mental states.  
  - **Reasonable-to-Believe Norm** (e.g., Douven): **Context-dependent**. If it's reasonable *for the students* to believe her, her assertion may be proper. Her personal disbelief might not undermine this.  

  **Does the example discriminate?** **Yes**, but imperfectly.  
  - It *challenges* the knowledge norm's necessity claim (intuitions often side with the teacher).  
  - It *supports* truth/justified belief norms if one views her assertion as proper.  
  - However, if her disbelief makes the assertion feel "hollow" or insincere, all norms *except truth* might deem it improper (since sincerity often ties to belief).  

  ---

  ### **Confidence Assessments & Caveats**  
  I rank confidence as: **High** (H: robust consensus/evidence), **Medium** (M: debated but defensible), **Low** (L: speculative or contested).  

  1. **Structure of readings (H)**: The weak→strong ordering is well-grounded in the literature (e.g., Williamson vs. Lackey).  
  2. **Plausibility/substantive assessments (M)**: These reflect dominant views, but some claims (e.g., sufficiency as platitude) have detractors (e.g., reductivists).  
  3. **Resolution of teacher case (M)**: Necessity/constitutive claims *do* settle it—but whether we *accept* that settlement depends on intuitions (see below).  
  4. **Rival norm comparisons (H)**: The treatments align with standard positions (e.g., Lackey 2007 on selfless assertion vs. knowledge norms).  
  5. **Empirical data on ordinary speakers (L)**: **This is my least confident point.** Studies show speakers *often* tie assertion to knowledge, but:  
     - Intuitions vary by culture/scenario (Turri et al. 2018).  
     - Selfless cases are under-tested empirically; ordinary speakers may prioritize sincerity over knowledge (Fricker 2012).  
     - Philosophers risk projecting "stipulated" norms (e.g., "knowledge is central!") onto vague folk intuitions.  

  **Recommendation**: The group should interrogate *why* the teacher case feels puzzling. Does her professional duty excuse her? Does "assertion" require belief? This exposes whether the debate hinges on intuitions about knowledge, sincerity, or social roles. The slogan's "necessity" reading *settles* the case by fiat, but rival norms (e.g., justified belief) better capture intuitions of propriety.  

  For your next meeting, focus on:  
  - Is the teacher's assertion *proper* or *improper*? (This reveals pre-theoretic intuitions.)  
  - Does "improper" mean *morally*, *professionally*, or *semantically* defective? (This clarifies what "norm" is at stake.)  

  This map should help isolate disagreements. I’m **highly confident** it captures the conceptual landscape; **less so** that empirical data decisively supports any norm. Circulate freely—I welcome pushback!
