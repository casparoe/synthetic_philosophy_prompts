prompt: |-
  Longtime lurker in the rationalist sphere, and I've been chewing on something from all the embryo-selection threads (polygenic scores, "designer baby" discourse, etc.) that I can't quite shake. Fertility clinics do preimplantation genetic testing as a matter of course: make a batch of embryos, screen out the one carrying Tay-Sachs or Huntington's, implant a healthy one, and everyone treats this as obviously fine, almost praiseworthy. Meanwhile the same clinic will hand you a donor catalog where you pick sperm by the donor's height, education, and SAT scores, and nobody blinks. But the moment you suggest ranking your own embryos by those same traits, people reach for the e-word, and in several countries picking sex is banned outright even when you're doing the screening anyway. So one institution is fine with screening against disease, fine with shopping for a donor's smarts, and not fine with choosing your embryo's smarts or sex.

  And there's a second thing that bugs me about the disease screening itself. When you pass over the Tay-Sachs embryo, the kid you eventually bring home is a different kid than the one you would have had -- it's not like you cured anyone. So who exactly got helped? My friends say "the parents, obviously," but that doesn't explain why the genetic counselor frames it as being done for the future child. I want to understand what the whole patchwork quietly takes for granted: is there some theory of harm vs. benefit that makes "screen out disease, don't select for advantage" a coherent line rather than an accident of history? A theory about which people exist and when? Something about the moral status of an embryo before transfer versus the child after? Or is the embryo/donor asymmetry just vibes?

  You're a professional philosopher working on reproductive ethics. Please brainstorm a bit before answering and go slow rather than jumping to the standard talking points. What view(s) of parental obligation and the ethics of creating people does this arrangement actually presuppose, which rival views would it rule out, and where is it genuinely underdetermined -- that is, where could several different theories all license the same practice? I'd also like you to spell out which parts of the current practice would have to change if you thought parents were obligated to select for the best-off possible child rather than merely against the worst-off conditions, since I suspect that's where the real fault line is but I can't articulate why.
reasoning: |-
  Okay, let me try to unpack this user's question. They're coming from the rationalist community, so they're probably familiar with concepts like polygenic scores and embryo selection debates. The core of their confusion seems to be the inconsistency in how society treats different types of genetic selection. Specifically, why is screening for diseases like Tay-Sachs acceptable, even encouraged, while selecting for traits like intelligence or gender is controversial or banned?

  First, I need to break down the three scenarios they mentioned: disease screening, donor trait selection, and embryo trait selection. The user notices that the first two are socially acceptable, but the third isn't. They also question the benefit of disease screening since it doesn't cure anyone but replaces the embryo. The genetic counselor's framing of doing it "for the child" seems contradictory to them. 

  The user wants a deeper philosophical analysis beyond standard arguments. They're asking about the underlying assumptions in current practices regarding parental obligations and the ethics of creating people. They're particularly interested in how the "obligation to select the best-off child" would change current practices.

  I should start by identifying the implicit ethical frameworks in existing policies. The disease screening aligns with non-maleficence—avoiding harm. Selecting against severe diseases prevents suffering, which is a clear moral imperative. But selecting for positive traits might be seen as enhancement, which falls into a different category. The donor selection is about choosing gametes, not embryos, which might be perceived as less direct. Also, donor traits are marketed as information, not active selection, which might make it seem less intrusive.

  The user points out that when selecting against a disease, you're not saving a specific child; you're choosing which child comes into existence. This touches on the non-identity problem. If bringing a child into existence without a disease leads to a life worth living, that child isn't harmed by being chosen over another embryo. But the counselor's language of "helping the child" is misleading because there's no specific child being helped. It's about creating a child without suffering. 

  The asymmetry between embryo and donor selection might come from differing perceptions of control. Choosing a donor is seen as selecting a partner's traits, while embryo selection feels like engineering a child. There's also a historical context: disease screening started with life-threatening conditions, creating a precedent that's hard to extend to other traits without backlash. 

  The user's deeper need might be to understand if there's a coherent ethical line or if it's arbitrary. They hint that the fault line is between preventing harm vs. enhancing. If parents were obligated to select the best-off child, practices would shift towards polygenic scoring for intelligence, health, etc., leading to "designer babies." But that raises concerns about eugenics, inequality, and commodification. 

  I need to address which theories support the current patchwork. Person-affecting views focus on harming existing beings, so preventing disease avoids harm to the future child. Non-person-affecting views might prioritize overall well-being, obligating enhancement. The current practice leans towards the former, avoiding suffering without requiring enhancement. 

  The user might also be questioning the moral status of embryos. If embryos have no moral status, selecting among them is permissible, but society still restricts non-medical traits. This suggests that restrictions aren't about the embryo's rights but societal values. 

  To answer thoroughly, I should outline how shifting to an obligation for the best-off child would change practices. Clinics would offer polygenic scores for multiple traits, leading to trait optimization. This could exacerbate social inequalities and alter parental motivations. The user's real interest might be in whether this shift is logically consistent or ethically necessary given existing practices. 

  I need to ensure my response covers the philosophical underpinnings, the non-identity problem, the distinction between avoiding harm vs. enhancing, and the practical implications of different ethical obligations. Highlighting where theories converge or diverge will show the coherence (or lack thereof) in current norms.
answer: |-
  You've zeroed in on a profound tension at the heart of reproductive ethics – one where practice, intuition, and explicit moral reasoning often diverge. Let's dissect this systematically, avoiding easy answers. The core asymmetry you observe ("screen against disease = good, select for advantage/specific traits = bad") isn't logically inevitable; it rests on specific, often unstated, philosophical commitments. Here's a breakdown of the presupposed views, rival theories, underdetermined areas, and the implications of shifting the obligation:

  ### I. What the Current Patchwork Presupposes
  The prevailing practice implicitly relies on a cluster of related ideas:

  1.  **The "Avoidance of Suffering" Principle:** This is paramount. The moral urgency lies in preventing significant harm or profound suffering. Selecting *against* debilitating, life-shortening diseases like Tay-Sachs is seen as preventing a future person from experiencing an existence dominated by severe suffering. The "benefit" to the future child isn't that *that specific embryo* is cured, but that *the child who is born* is spared that suffering. The genetic counselor frames it "for the child" because the act directly shapes *which child exists* to avoid a life laden with severe hardship. Harm is defined here as causing or allowing a person to come into existence with conditions that make their life significantly worse than a typical human life (a "life not worth living" or close to it).

  2.  **The Distinction Between Therapy and Enhancement:** Screening for disease is framed as achieving "normal health" or avoiding sub-normal function. Selecting for height, IQ, or eye color is seen as "enhancement" – moving beyond baseline health towards preferred traits. This distinction assumes a relatively stable concept of "normal species functioning" as a moral baseline. Donor selection gets a pass because it mimics "natural" mate selection based on traits, even if gametes are commodified.

  3.  **The "Wrongful Life" Threshold:** Current practice implicitly operates with a high threshold for intervention. Only conditions deemed likely to cause such severe suffering that existence itself might be questioned (or vastly diminished) warrant preemptive selection *against* them. SAT scores or height don't meet this threshold. Sex selection bans often stem from concerns about social harm (sex ratio imbalances, gender discrimination), not the harm to the individual child itself (being the non-preferred sex isn't generally considered a "wrongful life" condition).

  4.  **The Non-Identity Problem & "Person-Affecting" Intuitions:** This is crucial. When you discard the Tay-Sachs embryo and implant a different one, you haven't harmed *the Tay-Sachs child* – that specific child never exists. Instead, you cause a *different child* (the healthy one) to exist. Standard "person-affecting" harm principles (harming *a particular person*) struggle here. The justification becomes: We have a reason to bring *a* child into existence without severe suffering rather than *a* child with it, even though they are different individuals. The practice presupposes that *avoiding creating a person doomed to severe suffering* is a strong moral reason, overriding the non-identity issue. However, it *doesn't* presuppose a symmetrical reason to *create a person with advantages* over a person without them (but with a "normal" life).

  5.  **Parental Obligation as Primarily Non-Maleficent, Not Beneficent:** Parents are seen as having a strong duty *not to cause severe harm* to their future child (e.g., by knowingly implanting an embryo destined for profound suffering). Their duty to *benefit* the child is weaker and constrained – primarily focused on providing care *after birth*. Selecting for advantages exceeds this core obligation, venturing into optional preferences or even problematic optimization.

  6.  **Embryo Status (as a Pragmatic Buffer):** While views vary, the pre-transfer embryo's lack of unambiguous "personhood" status (compared to a born child) provides a pragmatic space for selection *against* severe harm without triggering the same moral alarms as harming an existing person. This allows the "different child" outcome. However, this status alone doesn't explain the trait selection ban – we *could* permit selecting among pre-transfer embryos for any trait if we viewed them solely as potentialities. We don't, indicating the restrictions stem from other concerns (slippery slopes, social consequences, the therapy/enhancement divide).

  ### II. Rival Views Ruled Out
  This patchwork implicitly rejects or sidelines several alternative ethical frameworks:

  1.  **Strong "Procreative Beneficence" (PB):** Julian Savulescu's principle argues parents *are* morally obligated to select the embryo (or child) expected to have the best life, based on available information. Current practice explicitly rejects this. If PB were adopted, the asymmetry collapses – clinics *should* offer polygenic scores for IQ, healthspan, etc., and parents *should* use them to select the "best" embryo. The SAT-filtered donor catalog would logically extend to embryo selection.
  2.  **Strict Person-Affecting Views:** Some views hold we can only have obligations to specific, existing persons. This would make *all* embryo selection (even for disease) incoherent ("Who are you helping? The diseased child isn't born yet!"). The patchwork *does* accept that we have obligations regarding *which* potential persons we bring into existence, specifically to avoid creating those facing severe harm.
  3.  **The "Genetic Cure" Model:** The practice rejects the idea that discarding the Tay-Sachs embryo is "curing" that specific entity. It accepts the non-identity reality but finds a moral reason to act *despite* it for harm avoidance.
  4.  **Full Trait Libertarianism:** The bans on sex selection and reluctance on trait selection reject the view that parents should have unlimited freedom to choose any characteristics for their child as an expression of reproductive autonomy, due to perceived downstream social harms or the child's potential interests in an "open future."

  ### III. Where It's Genuinely Underdetermined
  Several different ethical theories *could* converge on the current practice, highlighting its contingency:

  1.  **Different Foundations for Harm Avoidance:** A utilitarian might focus on minimizing aggregate suffering. A deontologist might see a duty not to create suffering. A virtue ethicist might see it as incompatible with responsible parenthood. All could endorse screening out Tay-Sachs.
  2.  **Varying Views on the Therapy/Enhancement Line:** Different people/societies draw this line differently (e.g., is preventing schizophrenia enhancement? What about high myopia?). The *practice* relies on a socially negotiated, historically contingent line focused on severe, life-destroying conditions. Different theories could justify *some* line in *roughly* that place.
  3.  **Motives Matter?** The patchwork *could* be defended by arguing disease screening is motivated by compassion, while trait selection is motivated by parental vanity or social competition. However, motives are complex and often mixed, making this a shaky sole justification.

  ### IV. The Fault Line: Obligation to Select the Best-Off Child
  This is indeed the crux. Adopting a strong "Procreative Beneficence" (PB) or similar principle would radically transform practice:

  1.  **From Filtering to Optimization:** PGT wouldn't just screen for catastrophic disorders. It would become standard to generate polygenic risk scores (PRS) for a wide range of traits: cognitive ability, mental health resilience, physical health risks (heart disease, diabetes, Alzheimer's), longevity, even personality tendencies or physical attributes deemed advantageous. The goal shifts from "avoiding the worst" to "selecting the best."
  2.  **Mandatory Reporting & Counseling:** Clinics wouldn't merely offer disease screening; they would be obligated to generate and present comprehensive PRS data for all embryos as part of the standard IVF/PGT process. Genetic counseling would focus on interpreting these scores for "best life" prediction.
  3.  **Shifting Parental Obligation:** Choosing *not* to select the embryo with the highest predicted IQ or healthspan would require justification, potentially seen as failing a moral duty to one's future child. "I just wanted a child" might not suffice if a "better-off" alternative was available.
  4.  **Commodification Intensification:** The "donor catalog" model would fully apply to embryos. Parents would be explicitly "shopping" among their own embryos for the optimal combination of traits. The distinction between selecting *against* disease and *for* advantage evaporates; it's all optimization.
  5.  **New Forms of Inequality:** Access to multi-embryo IVF cycles and advanced PRS analysis would become even more critical determinants of a child's potential advantages, exacerbating socio-economic divides. "Genomic stratification" could become entrenched.
  6.  **Redefining "Harm":** Harm could be defined not just as causing severe suffering, but as failing to provide a child with the best *available* genetic start in life when the opportunity exists. Bringing forth a child with a lower predicted IQ or higher cancer risk *when a genetically "better" sibling embryo existed* could be framed as a harm inflicted *on that child* by choosing them over the alternative. This directly confronts the non-identity problem head-on, arguing that by selecting a "worse-off" embryo, you harm *that specific child* by making them exist in a worse state than the alternative child *you could have chosen instead* could have been in. (This is philosophically contentious but central to PB arguments).

  ### Conclusion: Accident, Vibes, or Coherent(ish) Compromise?
  It's not *just* vibes or pure accident. The current patchwork *does* rest on a coherent, if contestable, core principle: **a strong moral imperative to avoid creating persons whose lives will be dominated by severe suffering, coupled with a much weaker (or non-existent) imperative to create persons with advantages beyond a baseline of "normal" opportunity for well-being.** This is underpinned by the therapy/enhancement distinction and a high threshold for "wrongful life."

  However, its *specific boundaries* (which diseases qualify? Why is sex selection banned but not SAT-based donor selection?) are heavily influenced by historical contingencies, medicalization, the framing of disease, intuitions about "naturalness," and fear of eugenics/social consequences. The asymmetry between embryo trait selection and donor trait selection largely hinges on the perception that selecting *among one's own embryos* feels like direct engineering of a specific child, while selecting donor gametes feels more like choosing a partner – a distinction that dissolves under scrutiny if embryos are seen as potentialities rather than specific persons.

  The real vulnerability of the current system is its reliance on an increasingly blurry therapy/enhancement line (e.g., screening for high cancer risk vs. low baseline IQ) and its inability to provide a *principled* reason why avoiding suffering creates a moral obligation, but providing significant advantages – which also profoundly shape a life – does not, especially when the *mechanism* of selection (choosing which embryo to implant) is identical. The push of polygenic scores forces a reckoning: either defend the asymmetry on grounds of avoiding suffering being uniquely paramount (and define that suffering rigorously), or acknowledge that the logic inevitably points towards a form of beneficence that demands optimization. The current practice is a pragmatic, historically-rooted compromise, but its philosophical foundations are under significant strain.
