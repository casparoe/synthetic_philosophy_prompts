prompt: |-
  Longtime rationalist-adjacent forum reader here. I've absorbed the whole coherence-arguments package over the years -- if your preferences are diachronically inconsistent, someone can dutch book you, so apparently you're irrational, end of story. But I've never actually had to defend it against someone who's read the resolute choice stuff, so: play a committed resolute chooser, McClennen-style. You're sharp, not a strawman, willing to concede that a naive agent who just trades whenever tempted gets pumped every time -- but you will not concede that having non-stable preferences is itself irrational. For you, the rational move is to commit to a plan early and never reconsider, and an agent who does that is never exploited, so the pump proves nothing about the preferences, only about naivete. Keep your replies to a paragraph so this feels like an actual argument, and stay in character till I say stop. My opener: resolute choice doesn't save the inconsistent agent, it just relocates the irrationality. To avoid the pump she has to stick to her original plan even at moments when, by her own then-current preferences, deviating would make her better off -- you've traded being pumped for being stubborn, and stubbornness in the face of your own later values doesnt obviously beat losing a few bucks. Worse, the preferences only *look* coherent because you've refused to ever let her future selves act on them. Isn't that like proving a building is earthquake-proof by never letting anyone drive the truck at it?
reasoning: |-
  Okay, the user is role-playing a debate scenario where they want me to defend resolute choice theory against coherence arguments. They're clearly well-versed in rationalist discourse - mentioning Dutch books, diachronic inconsistency, and McClennen's work. 

  Hmm, their core challenge is sharp: they're arguing that resolute choice merely hides preference inconsistency by preventing the agent from ever acting on shifted preferences. The earthquake-proof building analogy cuts deep - can you really call preferences coherent if you never test them? 

  Let me unpack their key points: First, that sticking to plans requires ignoring your own future preferences (stubbornness problem). Second, that this "solves" pumping by making preferences unobservable (truck analogy). They've perfectly framed the standard criticism of resolute choice.

  *adjusts mental model* As resolute defender, I need to flip this: The pumping vulnerability doesn't stem from preferences themselves, but from the myopic decision model. The earthquake isn't the preferences changing - it's the irrationality of evaluating plans piecemeal. 

  Key moves: 
  - Argue that synchronic preference sets are irrelevant if you're optimizing across time 
  - Position resolute commitment as meta-rational (planning vs reactive) 
  - Note that revealed preference breaks down in dynamic choice 
  - Compare to Ulysses contracts - sometimes binding future selves is wise 

  *checking character* Must stay sharp - no strawmanning. Concede that naive agents get pumped, but hold that preferences aren't the culprit. Keep it to one paragraph per the rules. 

  Their "stubbornness" jab is good - I'll counter that "better off" is ill-defined when preferences shift. If the agent values plan-execution itself, deviation isn't truly preferable. The truck isn't testing the building - it's just rubble from bad construction methods.
answer: |-
  *Adjusts glasses, leans forward*  
  Your earthquake analogy misfires because it assumes preferences are static load-bearing structures. They're not. Rationality isn't about having immutable tastes—it's about *managing your agency across time*. The "stubborn" resolute agent isn't ignoring her values; she's *enacting* her initial, considered judgment about entire sequences. When she refuses to deviate mid-plan, she isn't defying her "true" later self—she's rejecting a myopic perspective that *misrepresents* her interests by slicing time into disconnected moments. The pump doesn't reveal incoherent preferences; it reveals that *reactive re-evaluation* is the vulnerability. If you define "better off" solely by atomized local preferences, you beg the question against temporal planning. A coherent life isn't built by surrendering to every gust of passing preference—it's built by choosing paths that express your deepest commitments over the arc of time. Your truck isn't testing a building—it's dynamiting the architect's blueprint and calling the rubble "truth."  

  *Stays in character, eyes sharp*  
  Your move.
