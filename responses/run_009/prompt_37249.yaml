  Hmm, the user is presenting a philosophical argument from their roommate about consent in sexual relationships. The roommate claims that a large portion of ordinary sex is nonconsensual due to deception in courtship. The user disagrees with this "radical conclusion" but can't pinpoint where the argument goes wrong.

  Looking at the structure of the roommate's argument:
  1. Consent requires engaging the will, not bypassing it (through coercion or deception)
  2. Deception invalidates consent if truth would have led to refusal
  3. Courtship involves widespread misrepresentation
  4. Therefore much consent is obtained by bypassing the will
  5. Such consent is invalid
  6. Therefore much ordinary sex is nonconsensual

  The user has tried several escapes:
  - Replacing "would have refused" with a "materiality test" but finds it collapses back
  - Limiting relevant deception to identity or nature of act, but this mishandles STD/contraception lies

  I need to identify the suspect step. Premise 3 seems problematic - it conflates trivial courtship embellishments with deception that actually bypasses will in a consent-undermining way. The universality claim ("saturated with misrepresentation") ignores degrees of significance.

  This premise looked plausible because we do observe selective self-presentation in dating. But there's a crucial difference between socially understood posturing and material deception about core relationship aspects.

  Now for exits and their costs:
  1. **Reject universal "would have refused" test (premise 2)** - Instead require deception about act/identity only. This cleanly excludes courtship puffery but makes STD/contraception lies permissible - a serious cost.
  2. **Adopt materiality test** - But defining "material" without circularity is difficult. If we tie it to what reasonable people consider essential, we may still exclude minor courtship lies but risk subjective judgments.
  3. **Distinguish types of deception** - Treat relationship-building deception differently from sexual consent deception. But this creates a separation that may not reflect lived experience.
  4. **Challenge premise 5** - Argue some will-bypassing is acceptable if socially normative. But this risks excusing harmful deception by making it "normal."

  I'd bet the flaw is in premise 3's overreach. The key counterargument would be that courtship involves mutually understood rituals where minor embellishments don't actually bypass will - they're part of the social dance that participants knowingly engage in. The deception that matters for consent has to be about the sexual act itself or immediate circumstances, not background relationship factors.
answer: |-
  Here's the breakdown addressing your roommate's argument:

  **The suspect step**  
  Premise 3 is the weakest link: its claim that courtship is universally "saturated with misrepresentation" conflates trivial social posturing (e.g., curated photos) with material deception that directly undermines sexual consent. This overgeneralization ignores that many minor embellishments occur within a socially understood context of mutual exploration, not will-subverting fraud.

  **Why it looked fine**  
  Premise 3 seems plausible because dating culture undeniably involves selective self-presentation—Tinder profiles exaggerate hobbies, early dates hide flaws, and people often perform desirable traits. The roommate correctly observes that some relationships might not form under brutal honesty (e.g., admitting insecurity or past mistakes upfront). This feels like "deception," and when paired with premise 2 (which echoes contract law’s "but-for" causation for fraud), it creates a slippery slope: if *any* lie that alters a "yes" invalidates consent, and courtship has *many* lies, then consent is often compromised. The conflation works because both material fraud and social white lies involve untrue statements, making them seem ethically equivalent at a glance.

  **The exits and their prices**  
  1. **Restrict relevant deception to the *act itself* or *identity* (ditch premise 2’s breadth)**  
     - *Exit*: Only deception about the physical act (e.g., "This is medical treatment") or the person’s identity (e.g., impersonation) voids consent. Courtship lies become irrelevant.  
     - *Price*: **STD/contraception lies become permissible**. If someone lies about wearing a condom or having HIV, it’s not deception about the act (sex) or identity, so consent remains valid—a morally intolerable outcome for many.  

  2. **Adopt a "reasonable person" materiality test (modify premise 2)**  
     - *Exit*: Deception vitiates consent only if the fact is "material"—objectively significant to a reasonable person in that context. Curating photos? Immaterial. Lying about STDs? Material.  
     - *Price*: **Borderline cases become messy and context-dependent**. Is lying about divorce status material? What about feigning religious devotion? You must define "materiality" without "would have refused," risking arbitrariness. If you tie it to health/safety, job-title lies still escape scrutiny; if tied to "core relationship terms," you reintroduce subjectivity.  

  3. **Distinguish relationship-building from sexual consent (challenge premise 3’s implication)**  
     - *Exit*: Courtship deception targets *relationship formation*, not the sexual act’s nature. Consent to sex is evaluated separately, based on immediate context (e.g., sobriety, explicit agreement). Historical lies don’t retroactively void it.  
     - *Price*: **Fails for embedded lies directly enabling sex**. If someone lies about infertility to secure a relationship *and* sex, it’s hard to disentangle. Also, it feels inconsistent: if a lie manipulates someone into bed, why does intent matter?  

  4. **Accept some "will-bypassing" as normatively acceptable (soften premise 1 or 5)**  
     - *Exit*: Not all will-bypassing is equal. Coercion is always wrong; minor dating deception might be a socially tolerated "cost of entry" that doesn’t invalidate consent if it doesn’t exploit vulnerabilities.  
     - *Price*: **Demarcation problems and moral discomfort**. Where’s the line between "minor" (job title) and "major" (STDs) lies? This risks excusing harmful manipulation ("Everyone does it!") and undermines the principled link between autonomy and consent.  

  **Where I’d bet this is wrong**  
  I’m least confident in **premise 3’s universality claim**. The argument collapses if courtship misrepresentations aren’t *consent-vitiating* deception. A strong counter is that dating involves **mutually understood performativity**: both parties expect curated self-presentation as part of social ritual, so it doesn’t "bypass the will" but operates within its bounds (like theater). If you discovered a date exaggerated their hiking skills, you might roll your eyes—not feel violated. Flip me with evidence that *typical* courtship lies (not extreme cases) cause the same autonomy harm as, say, contraceptive fraud—e.g., psychological studies showing identical trauma responses. Absent that, premise 3 overreaches.
