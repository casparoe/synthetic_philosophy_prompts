     - **No** → Node 8.  

  6. **Node 6: Can probability ever be meaningfully assigned to any single event?**  
     - **Yes** → **Gap 2: Unoccupied** (see gap analysis).  
     - **No** → You are sorted into **Chance eliminativism / Strict non-probabilism**.  
       - *Example justification*: Single events lack probabilities; only long-run patterns are real.  

  7. **Node 7: Must the long-run frequency be empirically testable (i.e., actual or possible to observe)?**  
     - **Yes** → You are sorted into **Actual long-run frequentism**.  
       - *Example justification*: Probability requires observable repetitions (e.g., flipping many similar coins).  
     - **No** → You are sorted into **Hypothetical long-run frequentism**.  
       - *Example justification*: Probability is defined by hypothetical infinite trials (e.g., "if we could flip this coin infinitely").  

  8. **Node 8: Is the probability (for the coin flip) a personal degree of belief, updated with evidence?**  
     - **Yes** → You are sorted into **Subjective Bayesianism**.  
       - *Example justification*: 1/2 reflects my belief about this flip, informed by the coin's symmetry.  
     - **No** → **Gap 3: Unoccupied** (see gap analysis).  

  ---

  ### **Tree Structure & Leaves**  
  - **Leaves**:  
    1. Single-case propensity (physical chance)  
    2. Logical probability / Objective Bayesianism  
    3. Actual long-run frequentism  
    4. Hypothetical long-run frequentism  
    5. Chance eliminativism / Strict non-probabilism  
    6. Subjective Bayesianism  
    7. Three gaps (unoccupied).  

  - **Distinct positions covered**:  
    - Long-run frequentism → Split into **actual** (Node 7: Yes) and **hypothetical** (Node 7: No).  
    - Single-case propensity → Captured in **Node 2: Yes**.  
    - Subjective Bayesianism → Captured in **Node 8: Yes**.  

  ---

  ### **Pairs the Tree Cannot Separate**  
  1. **Hypothetical frequentism vs. Propensity**:  
     - The tree distinguishes them cleanly:  
       - Propensity requires **Node 1: Yes** and **Node 2: Yes** (objective physical chance for single events).  
       - Hypothetical frequentism requires **Node 1: No**, **Node 3: Yes**, **Node 5: Yes**, and **Node 7: No** (long-run frequency for repeatable events, even if hypothetical).  
     - **No confusion**: Propensity is sorted before hypothetical frequentism is reached.  

  2. **Logical probability vs. Subjective Bayesianism**:  
     - Separated by:  
       - Logical: **Node 1: Yes** and **Node 4: Yes** (objective, evidence-based for single events).  
       - Subjective: **Node 1: No**, **Node 3: Yes**, **Node 5: No**, and **Node 8: Yes** (personal belief for single events).  
     - **No confusion**: Different branches (Node 4 vs. Node 8).  

  ---

  ### **Unoccupied Gaps**  
  - **Gap 1 (Node 4: No)**:  
    - Path: Uranium decay has a probability (Node 1: Yes), but it’s not objective (Node 2: No) and not evidence-based (Node 4: No).  
    - **Reason**: Incoherent. If probability isn’t objective or evidence-based, it has no grounding (e.g., arbitrary assignments). No major camp occupies this.  

  - **Gap 2 (Node 6: Yes)**:  
    - Path: Uranium decay has no probability (Node 1: No), coin flip has no probability (Node 3: No), but some single events do have probabilities.  
    - **Reason**: Unattractive/neglected. Denying probabilities for clear cases (coin/atom) while accepting others is inconsistent. No camp advocates this.  

  - **Gap 3 (Node 8: No)**:  
    - Path: Coin flip has a probability (Node 3: Yes), not defined by long-runs (Node 5: No), and not belief-based (Node 8: No).  
    - **Reason**: Neglected. Possible interpretations (e.g., primitive indeterminism) exist but lack organized advocacy.  

  ---

  ### **How the Tree Handles Your Examples**  
  - **Coin flip**:  
    - Propensity/Subjective/Hypothetical frequentism assign probability; Actual frequentism/Chance eliminativism do not.  
  - **Uranium atom**:  
    - Propensity/Logical probability assign probability; Frequentism/Chance eliminativism do not.  
  - **Untested die**:  
    - Subjective Bayesianism assigns probability (belief updated by symmetry); Actual frequentism requires data.  
  - **Election**:  
    - Logical probability (evidence-based) or Subjective Bayesianism (belief); Propensity/Frequentism often reject single-case probabilities.  

  This tree isolates core intuitions and exposes philosophical divides without naming schools. Most gaps arise from incoherence or neglect, not viable positions.
