        E[log] = p [ \log( (x-C)R - C ) + K ] + (1-p) \log(\epsilon)

  As ε→0, log(ε)→-∞, so the dominant term is (1-p) log(ε) (which is the same for both options) and p log(ε) for the second option if (x-C)R < C. But we are comparing Option 1 (log(ε)) and Option 2 (which has at least log(ε) and possibly an additional term). 

