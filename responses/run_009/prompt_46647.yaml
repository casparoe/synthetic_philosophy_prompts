  Therefore, if (x-C)R >= C, the all-in bet is better than doing nothing. And if (x-C)R < C, they are indifferent.

  So the geometric growth agent, when faced with x in [C, 2C) and with two months to go, will go all-in if (x-C)R >= C, and otherwise they are indifferent (but might as well go all-in to have a chance if R is large enough to eventually meet the condition in later months? But in two months, if after winning they still don't have enough to survive the second month, then they are ruined anyway. So they are indifferent.

  But in our case, we have a deadline T and a fixed sum L at the end. The above analysis is for survival, but not for meeting L. However, if they don't survive, they don't meet L. 

  Now, consider the need to have at least L at the end. If they are undercapitalized and have multiple periods, they might need to grow fast. The geometric growth agent, by maximizing E[log(X_T)], will be more aggressive when the current wealth is small because log is concave and the potential upside in log space is large. 

  **The Walkthrough and Verdicts:**

  1. **The Scenario:** A caterer has fixed monthly cost $C$ and must have $L$ by month $T$ to renew the license. Each month, they can stake part of their cash (after ensuring enough to cover $C$) on a job with success probability $p$ and return factor $R$ (so staking $s$ returns $s R$ on success, $0$ on failure), where $p R > 1$. 

  2. **The Geometric Growth Agent's Behavior:**
     - **When comfortably capitalized:** The caterer has cash well above $C$ and with $T$ large, the optimal strategy is to bet the Kelly fraction $f^* = (pR - 1)/(R-1)$ of the free cash (current cash minus $C$) each month. This is the standard myopic Kelly strategy and avoids ruin with probability 1 in the absence of fixed costs, but with fixed costs, it still avoids ruin as long as the free cash is positive.
     - **When undercapitalized (close to ruin):** Suppose the cash is only slightly above $C$ and there are multiple months left. The caterer may stake the entire free cash (or more than Kelly) repeatedly. For example, with $T$ months to go and cash $x = C + \epsilon$, the geometric agent (maximizing $E[\log(X_T)]$) will compare:
          - Kelly betting: grows slowly and almost certainly fails to build enough by month $T$.
          - All-in betting: risks immediate ruin but with a chance to jump to a higher cash level and then continue.
     Because the log utility at the horizon is very low if the cash remains small, and the only way to achieve a high log utility is to grow fast, the agent accepts a high probability of ruin. Specifically, the agent will stake the entire free cash repeatedly until either ruined or until the cash is large enough to switch to Kelly. This is the desperation gambling.

  3. **The Expected Wealth Maximizer:** 
     - This agent maximizes $E[X_T]$. In each period, because the bet is favorable ($p R > 1$), the expected return on any staked amount is $(p R - 1) > 0$. Therefore, the agent always stakes as much as possible: the entire free cash. This leads to a high probability of ruin. For example, with $T$ months and starting cash $x_0$, the probability of survival is $p^T$ (if they win every bet) and the expected terminal wealth is $(x_0 - T C) \cdot (R p)^T$ (approximately, ignoring the cost payments). But the probability of ruin is $1 - p^T$, which approaches 1 as $T$ increases. 
     - There is a region where the geometric agent's policy converges to the expected wealth maximizer: when the cash level is very low. In that region, the geometric agent also goes all-in. The convergence is not a reductio of geometric rationality but rather highlights that when facing ruin, the geometric agent becomes risk-seeking in the face of a binding constraint.

  4. **How Ruin is Formalized in the Geometric Framework:**
     - We defined ruin as having cash below $C$ at the start of a month. In the optimization, if ruined, we set terminal wealth to a small ε>0 and take the limit as ε→0. This makes the expected log utility → -∞ for any strategy with a positive probability of ruin. However, when the alternative is certain ruin (if the agent does nothing), then a strategy that avoids ruin with positive probability (even if small) may yield a higher expected log utility (when ε is small) than doing nothing.
     - The key feature causing desperation is the combination of fixed per-period costs (burn) and a hard deadline. The fixed costs create a minimum cash threshold for survival, and the deadline forces aggressive growth when undercapitalized.
     - If the fixed cost is removed (or set to zero), then the problem reduces to the standard repeated bet. The geometric agent then uses the constant Kelly fraction of the current wealth, which is myopic and does not depend on the deadline. The agent can ignore the future because the optimal strategy is the same regardless of the time horizon.

  5. **Steelman the Friend's Objection:**
     - The friend argues that human capital (skills, future earnings, family support) provides a floor. Therefore, ruin (at $0 cash) is not truly absorbing. The caterer can find a job or borrow and start over. This means that the utility function should not have a sharp drop at $0. Instead, there is a softer floor. In this case, the geometric growth framework would incorporate the present value of future earnings. The caterer's total wealth would include financial wealth plus human capital. Then the fixed costs would be covered by the human capital if financial wealth is exhausted. 
     - This objection may dissolve the case for desperation if the caterer's human capital is sufficient to cover the fixed costs and the license fee. However, if the caterer has no access to borrowing and the human capital cannot cover the fixed costs (for example, the fixed costs are business debts that must be paid or face bankruptcy), then the floor is still absorbing. 
     - The honest answer: if the caterer has a sellable skill and access to the job market, then they should never risk total ruin. Instead, they should model their total wealth (financial plus human capital) and bet a fraction of that. In that case, the Kelly fraction would be applied to the total wealth, and the stake would be much smaller. Therefore, the desperation in the scenario is an artifact of treating liquid cash as the only wealth and ignoring human capital.

  **The Lottery Ticket Footnote:**  
  The standard lecture against lotteries (which are unfavorable bets) says that the geometric growth maximizer should avoid them. However, when an agent faces fixed costs and a deadline, even a geometric growth maximizer might take extremely large risks (like buying a lottery ticket) if the alternative is certain ruin. This is not because of a curved utility function (a la Friedman and Savage) but because of the arithmetic of survival. The footnote: *In the presence of fixed costs and a binding deadline, the logic of geometric growth may endorse high-risk gambling as the only escape from certain ruin.* 

  Thus, your situation as a caterer with four months of operating cash and fixed costs that burn that cash may indeed call for aggressive risk-taking, but only after accounting for your total wealth (including human capital). If your financial capital is the only resource and ruin is truly absorbing, then the analysis holds. Otherwise, you should include your human capital in your total wealth and size your bets accordingly.
