  ### Thought Experiment: The Caterer's Dilemma

  A caterer with $10,000 monthly fixed costs must raise $50,000 in three months to renew their license. Current cash is $40,000. Each month, they can stake any amount (up to cash minus $10,000 for costs) on a favorable event—say, a large contract requiring upfront expenses. For every dollar staked, they gain $2.50 (net +$1.50) with 60% probability, or lose the stake with 40% probability. Expected return is positive (0.6 × 1.5 + 0.4 × (-1) = +0.5 per dollar staked), but not extreme. Ruin occurs if cash falls below $10,000 before month-end. The geometric-growth agent maximizes expected log final wealth, treating ruin as terminal (wealth = ε → 0, so log(ε) → -∞).

  ---

  ### Analysis and Verdicts

  1. **Geometric-Growth Agent's Behavior**  
     - **Comfortably capitalized** (e.g., $100,000): The agent bets ~20% of *free cash* (cash minus $10,000 cost buffer), the Kelly fraction:  
       \[ f^* = \frac{pR - 1}{R - 1} = \frac{0.6 \times 2.5 - 1}{2.5 - 1} = 0.2. \]  
       Growth is stable; ruin probability is near zero.  
     - **Undercapitalized** (e.g., $40,000): The agent bets **nearly all free cash monthly**—here, ~$30,000 in Month 1. Why?  
       - With $40,000 start, free cash is $30,000.  
       - Kelly suggests staking $6,000 (20% of $30,000). But after costs, win/loss yields $64,000 or $24,000.  
       - After three months, expected log wealth is low (~$\log(50k)$ if barely surviving).  
       - Staking $30,000: Win (60%) → $105,000; lose (40%) → ruin.  
       - Expected log wealth: \( 0.6 \log(105k - 2 \times 10k) + 0.4 \log(\epsilon) \). As ε→0, this dominates Kelly because $\log(85k)$ is vastly better than the Kelly path’s likely $\log(20k-50k)$, justifying high ruin risk (≈78% over three months).  

     **Key mechanism**: Fixed costs and deadline create a *survival threshold*. Near ruin, expected log wealth is low, making aggressive bets—even with high failure risk—optimal for accessing upside that lifts wealth to safety. Kelly’s scale-invariance breaks when wealth nears the non-zero ruin floor.

  2. **Expected-Wealth Maximizer**  
     This agent always goes **all-in** (staking all free cash), as each bet has positive expectation. With $40,000 start:  
     - Win Month 1 (60%) → $105,000; then all-in again.  
     - Lose Month 1 (40%) → ruin.  
     - Probability of survival (winning all three bets): \( 0.6^3 = 0.216 \). Ruin probability is 78.4%.  
     - Expected terminal wealth: \( 0.216 \times \$337,500 + 0.784 \times 0 ≈ \$72,900 \)—higher than any other strategy’s expectation, but ruin is likely.  

     **Convergence**: When capital is very low (e.g., below $20,000), the geometric agent also goes all-in. This is not a reductio but a feature: near ruin, log utility implies extreme risk-seeking to escape the absorbent floor.

  3. **Ruin Formalization and the Critical Feature**  
     - Ruin is modeled as wealth → 0⁺, so log(wealth) → -∞. Any strategy with positive ruin probability has expected log wealth → -∞ *unless the alternative is certain ruin*.  
     - **Crucial feature**: Fixed per-period costs create a *non-zero wealth floor*. Without costs (or if costs vanish at ruin), the problem reduces to standard Kelly betting:  
       - Wealth can approach 0 asymptotically; no desperation emerges.  
       - Bets are myopic (fractional, independent of horizon).  

     Remove the deadline, and the geometric agent reverts to fractional Kelly betting, avoiding ruin and growing steadily.

  4. **Steelmanning the Friend's Objection**  
     "Human capital invalidates your model: at $0 cash, you retain skills, future earnings, and borrowing capacity. Ruin isn’t absorbing."  
     - **If valid**: Total wealth includes human capital (e.g., present value of future earnings). The geometric agent should bet a fraction of *total* wealth. For example:  
       - Financial wealth: $40,000.  
       - Human capital (e.g., salaried backup): $500,000.  
       - Total wealth: $540,000.  
       Kelly stake: 20% of free cash (still ~$6,000). Desperation vanishes.  
     - **If invalid**: When human capital cannot cover immediate costs (e.g., no job market access, debts force bankruptcy), the $10,000 floor is real. Desperation is rational.  
     **Verdict**: If your skills are marketable and liabilities low, your friend is right—never gamble desperately. But if business failure triggers irreversible ruin (e.g., bankruptcy forfeits license, assets, reputation), the analysis holds. Human capital *relocates*, but may not eliminate, the floor.

  ---

  ### The Lottery Ticket Footnote

  Friedman-Savage explained lottery tickets via utility curvature (poor seek upside concavity). Here, with no utility curvature—only log utility, fixed costs, and deadline—we see geometric rationality *demands* high-risk gambling when undercapitalized. The standard anti-lottery lecture ("positive-EV bets can still grow wealth suboptimally") assumes no survival threshold. **Footnote**: *When fixed costs and deadlines bind, geometric growth may prescribe high-risk bets indistinguishable from desperation—not because risk is desired, but because ruin is otherwise certain. This is arithmetic, not psychology.*
