    E[V] = p [ \log( (x-C)R - C ) + K ] + (1-p) * (-\infty)

  Since (1-p)*(-infinity) is -infinity, the expectation is -infinity unless p=1. But this is not helpful. We must avoid ruin. However, in this situation, if they don't bet, they are ruined for sure. If they bet all-in, they have a chance p to survive and then have a finite log, and chance (1-p) to be ruined. The expectation is -infinity either way? 

  But note: in the optimization of expected log, we have to compare strategies that have a positive probability of ruin. Any strategy that has a positive probability of ruin gives E[log] = -infinity. Therefore, the geometric growth agent would avoid any strategy that has a positive probability of ruin. Then they would never bet in the first place? But then they are ruined for sure. This is a contradiction.

  The problem is that log utility is not defined for ruin. We must use a different objective or allow for ruin with a small penalty. Alternatively, we can assume that the agent maximizes the expected log of terminal wealth, but if ruined, we set wealth to a small positive number ε. Then we let ε→0. 

  Let the terminal wealth in ruin be ε. Then for Option 1 (s=0): 
    Terminal wealth = ε (because they are ruined in the second month) 
    So E[log] = log(ε)

  For Option 2 (s = x-C):
    With prob p: win, then they have y = (x-C)R at the start of the second month. Then they can bet and have terminal wealth at least some positive number (if y>=C). Then E[log(terminal wealth) in the second month] = V_1(y) = \log(y - C) + K (if y>=C). If y < C, then even after winning the first bet, they are ruined in the second month, so terminal wealth = ε.
    With prob 1-p: lose, then terminal wealth = ε.

  So:
    If (x-C)R >= C:
        E[log] = p * [ \log( (x-C)R - C ) + K ] + (1-p) * \log(\epsilon) 
    If (x-C)R < C:
        E[log] = p * \log(\epsilon) + (1-p) * \log(\epsilon) = \log(\epsilon)

  Compare to Option 1: 
    Option 1: log(ε)

