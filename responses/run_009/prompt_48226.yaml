answer: |-
  Below is a comprehensive game design tailored to your requirements. It creates situations where sunk costs *feel* irrational but are actually informative, and symmetrically, where cutting losses feels rational but is a mistake. The game uses printed project cards, team log sheets, and a facilitator spreadsheet.

  ---

  ### **Game Title**: **"Project Horizon: The Sunk Cost Paradox"**

  #### **Core Mechanics**
  - **Teams**: 4-5 teams (3-4 players each).
  - **Rounds**: 3 investment rounds (15 min/round) + debrief (30 min).
  - **Budget**: 100 tokens per team, split into:
    - **Activation Phase** (Condition B only): Spend tokens to "activate" projects.
    - **Investment Rounds**: Allocate tokens to projects over 3 rounds.
  - **Projects**: Each team has 5 projects. Projects require **30 tokens total** to complete.  
    - **Reward**: 80 tokens per completed project (expected value = 80 × *p*, where *p* is quality).
  - **Information**: After each round, teams receive a **signal** ("High Potential" or "Low Potential") for projects they funded that round. Signals are 70% accurate.

  ---

  ### **Conditions: Hidden Structural Differences**
  Teams are secretly assigned to one of two conditions. The **rules and materials appear identical**; only the facilitator knows the condition.

  | **Condition A (Non-Informative Sunk Costs)** | **Condition B (Informative Sunk Costs)** |
  |----------------------------------------------|------------------------------------------|
  | Projects start active. Quality (*p*) is random (uniform 0–1). | Teams **activate 5/10 projects** in a hidden setup phase (sunk cost = 50 tokens). |
  | Sunk costs carry **no information**. Signals are the only info source. | Activated projects have **higher average quality** (*p* ~ Beta(α, β), where α/β depend on initial screening). |
  | **Rational to ignore sunk costs**; decisions should rely only on signals. | **Sunk costs are informative**: Activation signals project quality. Prior expectations matter. |

  ---

  ### **Game Rules**
  1. **Setup**:
     - **Condition B Only**: Teams receive 10 project cards with "Initial Scores" (1–10). They pay 10 tokens per project to activate 5. Unactivated projects are discarded.
     - **All Teams**: Start with 5 active projects and 50 tokens for investment (Condition B already spent 50 on activation).

  2. **Investment Rounds** (3 rounds):
     - Teams allocate tokens to projects (whole tokens, any distribution).
     - **Signal Revelation**: After each round, for every funded project, the facilitator provides a signal:
       - "High Potential" if *p* ≥ 0.5 (70% accuracy).
       - "Low Potential" if *p* < 0.5 (70% accuracy).
     - **Token Log**: Teams record allocations and signals per round.

  3. **Completion & Scoring**:
     - Projects with ≥30 tokens invested are "completed."  
     - **Score** = Σ [80 × *p*] for completed projects (*p* = true quality, hidden until debrief).

  ---

  ### **Log Sheet Design**
  **Per Team** (printable):  
  | Project | Initial Score (B only) | True *p* | Round 1 (Tokens + Signal) | Round 2 (Tokens + Signal) | Round 3 (Tokens + Signal) | Total Tokens | Completed? | Rational Continuation? |
  |---------|------------------------|----------|----------------------------|----------------------------|----------------------------|--------------|------------|------------------------|
  | 1       | (Facilitator fills B) | (Hidden) | e.g., 10 + "Low"           | e.g., 10 + "High"          | e.g., 10 + "Low"          | 30           | Yes        | (Facilitator calc)     |
  | ...    | ...                    | ...      | ...                        | ...                        | ...                        | ...          | ...        | ...                    |

  **Facilitator Columns**:
  - **True *p***: Pre-drawn for Condition A (uniform random 0–1). For Condition B, *p* ~ Beta(*s*, 11–*s*), where *s* = initial score.
  - **Rational Continuation?**: After Round 1, if signal is "Low":
    - **Condition A**: Abandon (expected *p* = 0.3; reward 80×0.3=24 < cost to complete).
    - **Condition B**: Continue if initial score ≥7 (expected *p* ≥0.6; reward 80×0.6=48 > cost to complete).

  ---

  ### **Anticipated Problems & Mitigations**
  1. **Collusion/Communication**:
     - **Risk**: Teams share strategies, blurring condition differences.
     - **Fix**: Physically separate teams; emphasize independent play.

  2. **Over-Correction**:
     - **Risk**: Teams abandon projects *too readily* to "look rational," especially in Condition B.
     - **Fix**: Debrief highlights teams that abandoned high-initial-score projects after "Low" signals as mistakes.

  3. **Condition Subtlety**:
     - **Risk**: Condition B’s activation phase feels like "setup," not part of gameplay.
     - **Fix**: Frame activation as "Round 0" for all teams (Condition A skips spending but keeps projects).

  4. **Observer Effect**:
     - **Risk**: Teams avoid sunk costs because they know it’s "irrational."
     - **Fix**: Describe the game as a "project management simulation," not a rationality test.

  5. **Token Allocation Complexity**:
     - **Risk**: Teams spread tokens too thin, completing no projects.
     - **Fix**: Warn that projects require 30 tokens; suggest focusing on 1–2 projects.

  ---

  ### **What the Game Cannot Capture**
  - **Blame Avoidance & Career Incentives**:  
    In real organizations, **escalation is often driven by personal stakes**: The person who cancels a project bears blame, while letting it fail spreads responsibility. The game lacks:
    - Individual reputational stakes.
    - Job-security incentives.
    - Social/political fallout from abandonment.
    
    **Debrief Supplement**:  
    Discuss: *"In organizations, sunk costs persist because abandoning a project costs your reputation, while riding it out lets failure be 'bad luck.' This game isolates information from incentives—real decisions add career risks."*

  ---

  ### **Facilitator Spreadsheet**
  **Columns**: 
  - Team ID | Condition | Project | Initial Score (B) | True *p* | Signal Round 1 | Signal Round 2 | Signal Round 3 | Total Tokens | Completed | Rational?  
  **Formulas**:
  - **True *p***: Condition A: `RAND()`; Condition B: `BETA.INV(RAND(), s, 11-s)` (Excel).
  - **Signal**: If *p* ≥0.5, "High" with 70% probability (`IF(RAND()<0.7, "High", "Low")`), else "Low" with 70%.
  - **Rational?**: Flag "Continue after Low Signal" as rational only in Condition B with initial score ≥7.

  ---

  ### **Debrief Structure**
  1. **Reveal Conditions**: Show how sunk costs were informative (B) vs. irrelevant (A).
  2. **Analyze Decisions**:  
     - For a team that continued after a "Low" signal:  
       - In Condition A: **Fallacy** (expected reward < cost).  
       - In Condition B: **Rational** (high initial score justifies continuing).  
     - For a team that abandoned after a "Low" signal:  
       - In Condition B with high initial score: **Mistake** (over-correction).  
  3. **Discuss Anomalies**: Use log sheets to show:  
     - "You felt sunk costs were irrational here, but they were evidence."  
     - "Cutting losses felt smart here, but you discarded a good project."  
  4. **Real-World Bridge**:  
     - "Sunk costs are irrational when purely emotional, but rational when informative (e.g., R&D) or strategic (e.g., signaling commitment to partners)."  
     - "The game misses how blame avoidance distorts this—canceling a project costs you; letting it fail costs no one in particular."

  ---

  ### **Materials & Time**
  - **Materials**: 
    - Project cards (10/team for B, 5/team for A).  
    - Log sheets (1/team).  
    - Facilitator spreadsheet (laptop).  
  - **Time**: 
    - Setup (10 min). 
    - Activation (Condition B only, 10 min). 
    - Investment Rounds (3 × 15 min). 
    - Scoring (5 min). 
    - Debrief (30 min).

  ---

  This design forces teams to confront the gap between the "textbook" sunk cost fallacy and contexts where history provides information or alters incentives. By mirroring behaviors across conditions, it reveals when the "fallacy" is rational and when "virtuous" abandonment is a mistake.
