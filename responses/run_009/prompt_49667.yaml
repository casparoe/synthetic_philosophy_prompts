  ### Brainstorming Candidate Principles

  Before committing to a principle, let's outline two or three candidate approaches to classifying systems within Dennett's framework. Each principle offers a different lens, focusing on distinct aspects of how a system generates behavior:

  1. **Runtime Mechanism Principle**: A system is classified based on the highest-level cognitive process it uses *during the execution of the behavior in question*. This focuses on real-time operation: innate reflexes (Darwinian), real-world trial-and-error learning (Skinnerian), internal simulation (Popperian), or cultural tool use (Gregorian). If no learning, simulation, or tool use occurs *at runtime*, the system defaults to Darwinian.  
     - *Strengths*: Aligns with the "here and now" of behavior, emphasizing what the system *does* rather than its history.  
     - *Weaknesses*: May misclassify systems with sophisticated inherited policies (e.g., a pre-trained AI) as Darwinian, ignoring how they acquired their capabilities.

  2. **Policy Acquisition Principle**: A system is classified based on the highest-level process *that shaped its current behavioral policy*. This traces the origin of the policy: evolved via natural selection (Darwinian), learned through the system's own real-world experiences (Skinnerian), acquired via internal simulation (Popperian), or imported from culture (Gregorian). The policy's source defines the level, even if runtime execution is "mechanical."  
     - *Strengths*: Captures the role of learning and design history, avoiding misclassification of systems with "smart" but fixed policies.  
     - *Weaknesses*: Risks overemphasizing historical processes, potentially making Darwinian the default for anything designed (e.g., all engineered artifacts).

  3. **Maximum Capacity Principle**: A system is classified at the highest level it *ever achieves* during its existence, regardless of current behavior. For example, if a system has used internal simulation in the past (e.g., during training), it remains Popperian even if it now operates reflexively.  
     - *Strengths*: Honors the system's full cognitive potential and avoids downgrading systems that have "learned" and now deploy policies efficiently.  
     - *Weaknesses*: May overstate capabilities for simple behaviors (e.g., calling a moth Popperian if it ever learned something, which it doesn't).

  ### Committing to a Principle: The Policy Acquisition Principle

  After evaluating the cases, the **Policy Acquisition Principle** delivers the most coherent verdicts. It defines a system's level by the highest process involved in *acquiring or shaping the policy governing its behavior* for the task at hand. Crucially, this principle credits processes the system *itself engages in* during its lifetime (e.g., learning, simulating), not external design processes like evolution or engineering. This avoids collapsing all designed systems into Darwinian and resolves ambiguities about runtime vs. historical processes.

  #### Why this principle?
  - **Coherence**: It cleanly handles cases where runtime behavior is decoupled from policy origins (e.g., a pre-trained AI executing a policy without real-time learning).
  - **Alignment with Dennett**: Dennett’s levels emphasize how minds *gain* their "good tricks," making policy acquisition central.
  - **Resolves key ambiguities**: Distinguishes between how a policy is *created* (acquisition) and how it is *executed* (runtime), prioritizing the former for classification.

