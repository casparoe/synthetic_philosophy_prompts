prompt: |-
  I run a small reading group — mostly psych and neuroscience grad students, zero philosophy background — and next month I have to get them through Dennett's heterophenomenology in about 45 minutes, before we discuss a paper that leans on it. Don't explain it to me, I've read the Dennett stuff. I need a plan for how *I* explain *them* it. What has to come before what — like, does the bit about treating the subject's reports as texts, basically like fiction, even make sense if they haven't first seen why naive introspective reports can't just be taken as raw data? What one example should carry the whole thing? I keep being tempted by the color phi case (subjects report a light moving from A to B and changing color somewhere in the middle, when nothing was ever shown in the middle), but tell me whether that actually does the work I need or whether it just derails into "whoa, weird illusion" and they never get to the method. Then the misconceptions: my guesses are "this is just behaviorism, Dennett doesn't think consciousness is real" and "oh so first-person reports count for nothing," but there's probably ones I'm not anticipating. Where exactly in the sequence should I head each one off? Also what should I openly refuse to cover at this level — the whole fight with Searle etc.? — and how do I check at the end whether they got the method itself vs. just nodding along to the word. We've got a whiteboard but no projector, if that matters.
