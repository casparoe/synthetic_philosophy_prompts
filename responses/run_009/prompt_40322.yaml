  The pairing causing the most tension is **driftwood on the beach (not art) vs. the same driftwood on a plinth (art)**. This forces the principle to account for contextual signaling and human creative intent beyond the object's physical properties, rejecting a "pure" intentional or institutional view. Without context, intention is too broad (e.g., anything could be art); without creative agency, accidental or natural objects disrupt your verdicts (e.g., the accidental photo). Creative Contextualism resolves this by requiring both human-driven creativity and contextual cues.
