  1.  **Nature of Disagreement:** It's primarily a *substantive* clash about the demandingness of morality and the scope of blameworthiness, rooted in fundamentally different conceptions of "obligation" (maximising vs threshold), though the differing definitions create a significant verbal layer masking the deeper conflict. (Moderately confident - the blame issue feels irreducibly substantive).
  2.  **Strongest Evidence for Substantiveness:** The core dispute over *blame*: Threshold theorists insist stopping at duty isn't blameworthy, while consequentialists imply failing to maximise *might* warrant blame or negative assessment ("wrong not to do"), revealing a genuine conflict over the permissibility of censure for merely good acts. (Very confident - this is the live moral nerve).
  3.  **Strongest Evidence for Verbal/Non-Clash:** The mutual "begging the question" accusations directly stem from each side *defining* "obligated" differently (maximising act vs meeting standard) *before* the argument starts, suggesting they are arguing past each other using the same term for distinct concepts. (Confident, but...).
