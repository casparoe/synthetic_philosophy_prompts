  5.  **Path to Progress:** Progress requires isolating the *blame* question: Can we coherently hold someone blameworthy *only* for failing a duty-threshold, even if a maximising act was available? Test cases probing intuitions about blame for "merely good" acts, or metaethical work on the source of obligation's force, might help. (Least confident point - genuine progress is notoriously hard here).
