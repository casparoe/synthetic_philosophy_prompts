prompt: |-
  Longtime lurker of the rationality blogosphere here — I was around for the old Hofstadter citation threads before they became uncool, and I just got around to actually reading about superrationality properly, the thing from his old Scientific American column with the luring lottery where the prize gets split among everyone who enters and the superrational move is for every reader to submit exactly one entry. Something finally clicked for me, but now I can't un-click it and I need someone to check my reasoning.

  Here's my understanding: superrational players cooperate in a one-shot prisoner's dilemma not because of iterated play or reputation, but because both players know they'll arrive at the same decision via the same chain of reasoning — my choosing cooperate and your choosing cooperate are basically two runs of the same program, and "which move do I make" is really one question that we're both answering. But if that's right, then my choice isn't just mine: by deciding what the rational thing to do is, I'm simultaneously deciding it for everyone else who's running that procedure. Which sounds an awful lot like a lever for steering other people's behavior. Concretely: I'm about to enter a one-shot price negotiation with a guy I've never met, we're both confident the other is rational, and he's apparently already send his opening number to the intermediary. Can I lock him into the cooperative split by unilaterally precommitting to it myself, since our two decisions are really the same decision viewed from two angles? And if my precommitment lands after his number is already in, does it still apply retroactively, or is there some kind of update-ordering problem? My friend says something about how it also matters whether the other guy is "rational" in the boring ordinary econ sense (a VNM maximizer) versus actually superrational, but he couldn't explain why without sounding like he was hedging, and I'd rather hear it from someone who'll be straight with me.

  Lead with your bottom line in the first sentence — ideally a plain yes/no on whether I can steer the negotiation this way — then give the reasoning, no preamble and no restating my question back at me.
reasoning: |-
  Okay, let me tackle this user's query. They're deeply involved in rationality concepts, specifically superrationality from Hofstadter. They're trying to apply it to a one-shot negotiation scenario. Their core question: can they force a cooperative outcome by precommitting, even after the other party has acted?

  First, I need to recall how superrationality works. It's not about repeated games or reputation. Instead, it's based on the idea that identical rational agents will reach the same decision because they're running the same "program." So in a Prisoner's Dilemma, both cooperate because they recognize their decisions are interdependent.

  Now, the user's scenario: a price negotiation. They want to know if precommitting to a cooperative split can bind the other party, especially if the precommitment happens after the other's move. The friend mentioned a distinction between standard rationality (VNM) and superrationality.

  Key points to address:
  1. **Superrationality requires mutual recognition**: Both players must see each other as identical rational agents. If the other party isn't superrational, they won't follow this reasoning.
  2. **Precommitment timing**: If the other party has already submitted their number, they've likely acted based on standard rationality. A late precommitment won't affect their choice because their decision is already made.
  3. **Retroactive effect?**: Superrationality doesn't imply retrocausality. Decisions are simultaneous in theory. If one acts first, the symmetry breaks, and superrationality doesn't apply.

  Underlying concerns: The user might be seeking a strategic edge in negotiations using rationality principles. But they might overlook the necessity of mutual superrationality. Also, they might conflate decision simultaneity with actual timing.

  I should emphasize that without mutual adoption of superrationality, precommitment won't work. Timing matters because if the other has already decided, the mutual dependency is broken. The friend's point about rationality types is crucial—superrationality isn't the default, so assuming the other party adheres to it is risky.

  Conclusion: Only if both are superrational and decide simultaneously can the cooperative outcome be forced. Precommitment after the other's move won't retroactively change their decision.
answer: |-
  **No, you cannot steer the negotiation this way by unilateral precommitment, especially if his number is already submitted.**

  Here's the reasoning:

  1.  **Superrationality Requires Mutual Recognition & Symmetry:** Superrational cooperation *only* emerges when *both* players:
      *   Know the other is rational.
      *   Recognize they are in a symmetric situation.
      *   Believe the other is using *the same identical reasoning process* (they are "running the same program").
      *   *Simultaneously* arrive at the cooperative decision *because* they understand their decisions are interdependent and identical.

  2.  **Precommitment Breaks Symmetry & Prevents Mutual Recognition:**
      *   If you unilaterally precommit *before* he acts, you are signaling that you are *not* reasoning identically to him. You are forcing a move based on your commitment, not mutual superrational discovery. He now sees you as "locked in," not as an identical reasoner. He will likely defect (e.g., demand a better price) if he's a standard VNM maximizer.
      *   **Crucially, your friend is correct:** If the other guy is *only* a standard VNM rational agent (maximizing his *own* expected utility given his beliefs about *your* actions, without assuming identical reasoning), he *will not* see your precommitment as binding *his* decision. He'll simply exploit your commitment to cooperate.

  3.  **"Retroactive" Application is Impossible:**
      *   If his number is *already submitted* (and thus fixed) to the intermediary, the decision is made. Superrationality is a *reasoning process* for making a decision simultaneously under symmetric uncertainty. It is not magical retrocausality.
      *   His submitted number reflects the reasoning he used *at the time he submitted it*. Your later precommitment cannot change the reasoning he used minutes/hours/days ago. He's already chosen based on his model of you then (likely a standard VNM model).
      *   Once his action is fixed, the symmetry is broken. You are no longer identical reasoners deciding together; you are responding to his known action. Your "best response" then is likely to defect relative to his known demand.

  **Bottom Line on Applicability:** Superrational cooperation **only** works if:
  *   Both players are actively using superrational reasoning (recognizing identicality).
  *   They are making their decisions *simultaneously* with the understanding of that identicality.
  *   Neither has broken the symmetry by precommitting or acting first based on different reasoning.

  **In your scenario:**
  *   If he's a standard VNM agent, he ignores the superrational logic entirely. Your precommitment just makes you exploitable.
  *   If he *is* superrational, but his number is *already submitted*, he made his decision *before* seeing your precommitment. He likely reasoned based on the *assumption* you might not be superrational (a safe default in the real world) and submitted a defecting (selfish) number. Your later precommitment doesn't reach him or alter his past reasoning.
  *   The *only* slim chance for superrational cooperation would be if you *both*, simultaneously, before submitting numbers, explicitly agreed to use superrational reasoning and understood each other to be doing so. Unilateral precommitment, especially after he acts, fails utterly.
