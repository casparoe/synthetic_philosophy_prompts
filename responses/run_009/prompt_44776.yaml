prompt: |-
  ok so i read this thought experiment somewhere, i think it was a Hofstadter essay but i might be mixing it up, and its been bugging me for weeks. imagine a pool table where balls just bounce around by plain physics, except certain configurations of balls get to count as "symbols" that stand for things -- maybe even standing for the balls themselves -- and the thought experiment treats the symbols as exerting their own kind of push on how the balls move, like the pattern is one of the causes and not just a description of the motion. my question: does this problem have an actual name? the question im asking is basically whether a pattern made out of physical stuff can push that stuff around, or whether its always the low-level collisions doing 100% of the work and the pattern is just what those collisions look like from far away. everyone i ask just says "emergence" and calls it a day, but that feels like naming my confusion, not resolving it. so what's the real concept here -- is it the same as downward causation if that's a thing, how is it different from just saying we can describe the same events at two zoom levels, and is the free-will-ish version (did my decision cause my neurons to fire, or the other way around) literally this question or only kind of analogous? and if the strict answer is that the pattern does zero pushing, why doesnt it feel like zero when engineers build stuff purely by reasoning about the high-level stuff and it works? i want the actual carving, not a label i can look up and be disappointed by.
