  Below is a decision tree that meets your specifications. It starts with the stone paradox and branches through key questions about divine omnipotence, using concrete cases (lying, sinning, square circles, etc.) to guide students to positions without prior knowledge of the literature. The tree has 10 nodes and 8 leaves, with annotations on unresolved distinctions and unoccupied positions.

  ---

  **DIVINE OMNIPOTENCE DECISION TREE**  
  *Start with the stone paradox: Can an omnipotent being create a stone it cannot lift?*

  ### **NODES**  
  1. **Is the task "create a stone you cannot lift" *self-contradictory*?**  
     (e.g., like "draw a square circle" – a state of affairs where contradictions *must* arise.)  
     - *Yes* → Node 2  
     - *No* → Node 3  

  2. **Is the inability to do *any* self-contradictory task (e.g., make 2+2=5) a limitation on power?**  
     - *Yes* → Node 4  
     - *No* → **Leaf 1: Pseudo-task reply** (Failure isn’t a limitation; the task is incoherent "nonsense.")  

  3. **Does the task require changing an *essential attribute* of the being?**  
     (e.g., making an *immortal* being die, or an *essentially truthful* being lie. The stone task may involve shedding omnipotence.)  
     - *Yes* → Node 5  
     - *No* → Node 6  

  4. **Can God bring about contradictions?**  
     (e.g., make a square circle exist, or force someone to have libertarian free will.)  
     - *Yes* → **Leaf 2: Voluntarism** (God can do *anything*, even the logically impossible.)  
     - *No* → Node 7  

  5. **Is the inability to alter an essential attribute (e.g., to stop being God) a limitation on power?**  
     (e.g., If God *binds himself* to never lie, is this binding a loss of power?)  
     - *Yes* → Node 7  
     - *No* → **Leaf 3: Essential-attribute shield** (Inability reflects God’s nature, not weak power.)  

  6. **Is the task *structurally unique* due to its "two-step" nature?**  
     (Create stone *then* fail to lift it – unlike single-step tasks like sinning.)  
     - *Yes* → **Leaf 4: Two-step immunity** (The paradox fails; creating ≠ lifting.)  
     - *No* → Node 8  

  7. **Does the same problem arise for *other maximal properties*?**  
     (e.g., Can an *omniscient* being know "what it’s like to be ignorant"? Is "maximal greatness" quantifiable?)  
     - *Yes* → **Leaf 5: Degree-theoretic worry** (No "maximal" power exists; reformulation needed.)  
     - *No* → **Leaf 6: Logical-possibility restriction** (Omnipotence covers *only* logically possible tasks.)  

  8. **Does the task’s impossibility *presuppose* God’s attributes as contingent?**  
     (e.g., Could God choose to *temporarily* cease being omnipotent to create the stone?)  
     - *Yes* → **Leaf 7: Accidental omnipotence** (God *could* do it if power weren’t essential.)  
     - *No* → **Leaf 8: Reformulation project** (Redefine omnipotence as "maximal power" over coherent tasks.)  

  ---

  ### **LEAVES & ANNOTATIONS**  
  - **Leaf 1: Pseudo-task reply** (Mavrodes/Frankfurt)  
  - **Leaf 2: Voluntarism** (Cartesian view)  
  - **Leaf 3: Essential-attribute shield** (Classical theism, e.g., Aquinas on goodness)  
  - **Leaf 4: Two-step immunity** (Savage’s stone-specific solution)  
  - **Leaf 5: Degree-theoretic worry** (Kenny; reformulate *all* maximal properties)  
  - **Leaf 6: Logical-possibility restriction** (Aquinas/standard restriction)  
  - **Leaf 7: Accidental omnipotence** (Unoccupied; theologically unattractive)  
  - **Leaf 8: Reformulation project** (Flint/Freddoso: "maximal power")  

  #### **ANNOTATIONS ON DISTINCTIONS & OCCUPANCY**  
  1. **Leaf 1 vs. Leaf 6 indistinguishable?**  
     - The tree *cannot* reliably separate these. Both declare the stone task "not a limitation," but for different reasons (pseudo-task vs. logical restriction). The distinction relies on **Node 5** (essential attributes): If God’s *nature* blocks the task (e.g., lying), Leaf 3 is favored; if the task is *logically flawed* (square circle), Leaf 1/6 applies.  
     - *Honest flag*: Without Node 5, Leaf 1 and Leaf 6 collapse in practice.  

  2. **Unoccupied positions:**  
     - **Leaf 7 (Accidental omnipotence):** Unoccupied. Theologically unattractive (makes God’s power fragile).  
     - **"Two-step + essential-attribute" combos:** Unoccupied. Incoherent – if omnipotence is essential (Node 5), the two-step (Node 6) is irrelevant.  

  3. **Why Node 6 (two-step)?**  
     Tests if the stone’s "create-then-lift" structure avoids paradox. Most positions (e.g., Leaf 6) say no – it reduces to a single contradiction.  

  4. **Diagnostic cases in nodes:**  
     - **Node 5:** Tests lying/sinning/dying (non-contradictory but essential-attribute-bound).  
     - **Node 7:** Tests omniscience/greatness (Kenny’s generalization).  
     - **Node 4:** Tests square circles (pure contradictions).  

  ---

  **DESIGN NOTES**  
  - **Logical space over famous replies:** Nodes mirror live debates (coherence, essentialism, scope of power).  
  - **Full case coverage:** Stone (Nodes 1,3,6), sin/lying (Node 5), square circles (Nodes 2,4), omniscience (Node 7).  
  - **Two-step test:** Node 6 isolates the stone’s structure; most leaves treat it as non-unique.  
  - **Kenny generalization:** Node 7 forces reflection on whether omnipotence is uniquely paradoxical.  
  - **15-minute flow:** 10 nodes with binary choices; students can work quickly from intuition.  

