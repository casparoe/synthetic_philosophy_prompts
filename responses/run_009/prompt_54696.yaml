  - `what_popper_actually_claimed_we_can_know`: "Popper claimed that we can never know that our theories are true or approximately true, but we can rationally prefer a theory that has withstood severe tests over one that has not, as it may be closer to the truth (though we cannot know this)."

  Regarding the framing: The summary frames the episode as a demolition of Popper's definition (which is fair) and then presents a survival of the intuition as essentially correct. However, the framing is problematic because:

  1. The critique by Miller and Tichý did not just break the definition; it challenged the very intuition that one theory can be unambiguously closer to the truth than another in the way Popper thought. So the intuition is not "essentially correct" in the form Popper had.

  2. The framing of steady, monotonic convergence is not Popper's view and is historically and philosophically contested.

  3. The conclusion that we are entitled to regard our theories as approximately true is not Popper's view and is actually opposed by him.

  So, the right framing is: Popper proposed verisimilitude as a way to explain scientific progress without induction, but his formal definition was fatally flawed. He conceded the flaw but continued to believe in the concept. However, the critique raised deep problems that remain unresolved. The idea that science converges on the truth is still a matter of debate in philosophy of science (with realists and anti-realists), and it cannot be taken for granted as a throwaway premise.

  For your field: Be cautious when someone uses "science converges on the truth" as a premise. It is not a settled fact but a contested philosophical position. The history of science shows that convergence is not monotonic, and there is no guarantee that current models are closer to the truth than past ones in every respect.
