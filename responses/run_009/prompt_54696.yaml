  - `most_consequential_error`: "The claim that we are entitled to regard our current best theories as approximately true, which contradicts Popper's anti-justificationism and fallibilism."
  - `errors_that_change_the_story`: [
      "Popper did not claim science gets steadily closer to the truth (monotonic convergence)",
