  ### Step-by-Step Decision Procedure Based on Harsanyi's Aggregation Theorem

  **Core Principles Preserved:**  
  - **Equal-Probability Veil of Ignorance:** The committee acts as an "impartial observer" who assumes an equal chance of being any affected person.  
  - **Expected Utility Assumptions:** Outcomes under uncertainty are evaluated by expected utility (EU).  
  - **Pareto Condition:** If all individuals prefer Intervention A over B, the committee must rank A above B.  

  **What the Theorem *Does Not* Settle (Requires Committee Judgment):**  
  1. **Interpersonal Comparability:** How to measure and compare utilities across individuals (e.g., using QALYs, dollars, or direct scaling).  
  2. **Scope of "Affected Persons":** Whose utilities count? (e.g., patients, taxpayers, future beneficiaries).  
  3. **Risk Attitudes:** Whether individual risk aversion reflects diminished well-being (inherited by the impartial observer) or mere psychology (discounted). Rawls' maximin objection hinges here.  

  **Procedure Steps**  
  *Total Time:* 3 hours per dossier.  
  *Materials Needed:* Whiteboard, projector, pre-circulated dossier evidence, timer, voting buttons.  

  #### **Step 1: Define Alternatives and Population (15 min)**  
  - **Questions:**  
    - What are the mutually exclusive interventions (including status quo)?  
    - Who is affected? (Patients, families, taxpayers, future beneficiaries?)  
    - What is the time horizon?  
  - **Sufficient Answer:**  
    - List 2–5 alternatives.  
    - Define "affected population" (e.g., "all newborns in 2024–2030" or "prostate cancer patients + taxpayers").  
  - **Flag if:** Population scope is disputed (e.g., "Do future generations count equally?"). *This is a values question for political principals.*  
  - **Output:** Approved list of alternatives and population.  

  #### **Step 2: Characterize Outcomes (45 min)**  
  - **Questions:**  
    - Under each alternative, what are the health/non-health outcomes (benefits/harms) for each subgroup?  
    - What are key uncertainties (e.g., probability of side effects)?  
  - **Sufficient Answer:**  
    - Outcome matrix with:  
      - Probabilities (e.g., 0.1% chance of biopsy complication).  
      - Cardinal metrics (e.g., QALYs gained/lost, costs per person).  
  - **Simplification:** Allow subgroup averages (e.g., "high-risk men") but *not* population-wide averages.  
  - **Output:** Outcome matrix with distributions (no ranking yet).  

  #### **Step 3: Set Utility Rules (Judgment Phase) (30 min)**  
  - **Questions:**  
    - **Utility Metric:** Can we use QALYs (1 QALY = equal value to all)? If not, propose an alternative.  
    - **Cost Conversion:** What is the QALY-to-dollar threshold (e.g., $100k/QALY)?  
    - **Risk Handling:**  
      - Option A (Harsanyi): Impartial observer inherits individual risk aversion (e.g., use nonlinear utility over QALYs).  
      - Option B (Rawls-friendly): Impartial observer is risk-neutral (linear utility).  
    - **Scope:** Do we count patient utilities only, or include taxpayers/families?  
  - **Sufficient Answer:** Majority vote on:  
    - Common utility metric (e.g., QALYs).  
    - Risk handling (A or B).  
    - Cost threshold.  
    - Affected subgroups.  
  - **Flag if:** No majority on risk handling or utility metric. *This is a values question (e.g., Rawls vs. Harsanyi).*  
  - **Output:** Agreed utility rules.  

  #### **Step 4: Compute Utilities Behind the Veil (45 min)**  
  - **Question:** What is each subgroup’s expected utility (EU) per alternative?  
  - **Procedure:**  
    1. Convert all outcomes to utilities using Step 3 rules (e.g., QALYs ± $/threshold).  
    2. For risk-averse (Option A), apply utility function (e.g., U(QALY) = √QALY).  
    3. Calculate EU for each subgroup:  
       - EU = Σ [Probability × Utility] for all outcomes.  
  - **Sufficient Answer:** EU table (subgroups × alternatives).  
  - **Output:** EU matrix.  

  #### **Step 5: Aggregate Utilities (Impartial Observer) (30 min)**  
  - **Question:** What is the overall expected utility per alternative?  
  - **Procedure:**  
    1. Assign equal probability to being any person in the population.  
    2. Weight each subgroup’s EU by its population share.  
    3. Sum weighted utilities:  
       - *V = Σ (Subgroup size / Total population) × EU_subgroup*  
       - *This is Harsanyi’s "weighted sum of utilities" with equal weights.*  
  - **Sufficient Answer:** *V* score for each alternative.  
  - **Pareto Check:** If *V* ranks A > B but all subgroups prefer B, recalculate (violation indicates error).  
  - **Output:** Ranked list of alternatives by *V*.  

  #### **Step 6: Finalize and Document (15 min)**  
  - **Question:** Does the ranking align with Pareto?  
  - **Procedure:**  
    - Confirm no Pareto violations.  
    - Document rationale: "Ranked by expected utility sum under veil of ignorance."  
  - **Output:** Recommendation for the Secretary of Health.  

  ---

  ### Worked Applications  

  #### **Case (a): Newborn Heart Disease Screening**  
  - **Step 1:**  
    - *Alternatives:* Screen all newborns (A) vs. status quo (B).  
    - *Population:* 50,000 newborns/year. Taxpayers (cost: $10/infant).  
  - **Step 2:**  
    - A: 0.01% risk of undetected death (loss: 70 QALYs); cost = $500k.  
    - B: No cost; 0.1% risk of death.  
  - **Step 3 (Rules):**  
    - Utility = QALYs. Risk-neutral. $100k/QALY threshold. Include patients + taxpayers.  
  - **Step 4 (EU):**  
    - Newborn EU (A): (99.99% × 70 QALYs) + (0.01% × 0) = 69.993 QALYs.  
    - Taxpayer EU (A): Loss = $500k / $100k/QALY = -5 QALYs (spread over 50k taxpayers: -0.0001 QALY each).  
  - **Step 5 (Aggregate):**  
    - *V_A* = (50,000/50,000) × 69.993 + (50,000/50,000) × (-0.0001) = 69.9929.  
    - *V_B* = 70 (no cost, no intervention).  
  - **Ranking:** B > A (status quo wins; screening’s tiny benefit doesn’t justify cost).  
  - **Why?** Small per-person benefit diluted by population size.  

  #### **Case (b): Gene Therapy for Rare Disease**  
  - **Step 1:**  
    - *Alternatives:* Fund therapy (A) vs. invest in other programs (B).  
    - *Population:* 24 children; taxpayers ($2.4M/child); beneficiaries of other programs.  
  - **Step 2:**  
    - A: Saves 24 lives (gain: 60 QALYs/child); cost = $57.6M.  
    - B: Use $57.6M for diabetes care ($50k/QALY → 1,152 QALYs).  
  - **Step 3 (Rules):**  
    - Utility = QALYs. Risk-neutral. $100k/QALY. Include all groups.  
  - **Step 4 (EU):**  
    - Children EU (A): 60 QALYs.  
    - Taxpayer EU (A): -$57.6M / $100k/QALY = -576 QALYs.  
    - Other beneficiaries EU (B): 1,152 QALYs.  
  - **Step 5 (Aggregate):**  
    - *V_A* = Weighted sum = (24/1M) × 60 + (1M/1M) × (-576/1M) ≈ -0.576.  
    - *V_B* = (1,152/1M) = 0.001152.  
  - **Ranking:** B > A (other programs win).  
  - **Escape Hatches:**  
    - *Adjust scope:* Exclude taxpayers? *V_A* becomes positive but still < *V_B*.  
    - *Risk aversion (Option A):* Apply concave utility (e.g., U=√QALY). Children’s life-saving gains outweigh linear losses.  
      - E.g., *U_A (children)* = √60 ≈ 7.75; *U_B (children)* = √0 = 0.  
      - *V_A* now positive and large.  
    - *Flag as values question:* "Should we weight severely ill children more?" *Political override needed.*  

  #### **Case (c): Prostate Cancer Screening**  
  - **Step 1:**  
    - *Alternatives:* Expanded screening (A) vs. status quo (B).  
    - *Population:* 500,000 men; taxpayers (cost: $100/person).  
  - **Step 2:**  
    - A: Prevents 50 deaths (gain: 10 QALYs each) but causes 5,000 severe complications (loss: 0.5 QALY each).  
    - Cost = $50M.  
  - **Step 3 (Rules):**  
    - Utility = QALYs. Risk-neutral. $100k/QALY.  
  - **Step 4 (EU):**  
    - EU per man (A): (50/500k × 10) + (5,000/500k × -0.5) + (494,950/500k × 0) = -0.004 QALYs.  
    - Taxpayer EU (A): -$50M / $100k/QALY = -500 QALYs.  
  - **Step 5 (Aggregate):**  
    - *V_A* = (500k/1M) × (-0.004) + (500k/1M) × (-500/500k) = -0.252.  
    - *V_B* = 0.  
  - **Ranking:** B > A (status quo wins; harms outweigh benefits).  

  ---

  ### Where the Procedure Misfires: Candid Assessment  

  #### **Characteristic Failure Modes**  
  1. **Wrong Answer Scenarios:**  
     - **Oversimplified Utilities:** Using QALYs may miss non-health impacts (e.g., family distress). *Fix: Include multi-attribute utilities if time permits.*  
     - **Risk-Aversion Misstep:** Choosing Option B (risk-neutral) when catastrophe risks exist (e.g., rare diseases). Rawlsians will protest. *Fix: Default to Option A for dossiers with low-probability, high-harm events.*  
     - **Pareto Violations Ignored:** If *V* ranks A > B but all prefer B, computational error is likely. *Fix: Mandate Pareto checks.*  

  2. **No Answer Scenarios:**  
     - **Data Gaps:** Missing outcome probabilities (e.g., long-term effects of gene therapy). *Fix: Flag as "evidence insufficient" and defer.*  
     - **Value Conflicts:** No majority on utility rules (Step 3). *Fix: Escalate unresolved judgments to political principals.*  

  #### **Judgment Calls Dressed as Procedure**  
  - **Scope of Population:** Including/excluding taxpayers or future generations changes rankings. *This is inherently political.*  
  - **Risk Posture:** Choosing Option A vs. B is a philosophical split (Harsanyi vs. Rawls) without a technical answer.  
  - **Utility Metric:** QALYs assume health is fungible; this may disadvantage disabled/elderly.  

  #### **Handling Inconsistent Rankings**  
  - **Cause:** Different evidence interpretations or rule changes between runs.  
  - **Solution:**  
    1. Audit differences in Step 2 (evidence) or Step 3 (rules).  
    2. If evidence-driven, seek better data.  
    3. If rules-driven, escalate to health department for consistency (e.g., "Always use risk-neutral unless catastrophic").  

  **Final Advice:** The procedure’s strength is transparency, not perfection. When values clash, *document the conflict explicitly* for political accountability. Harsanyi’s spine ensures you’re "fairly wrong" rather than arbitrarily right.
