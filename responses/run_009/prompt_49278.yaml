          Total N = 11 million.

     - **Step 5:**
          V_A = (1,000,000 / 11,000,000) * E[ΔQ] - (cost in QALYs for taxpayers) 
               = (1/11) * E[ΔQ] - (total cost / T) / 11,000,000 * 10,000,000
               = (1/11) * E[ΔQ] - (cost in QALYs) * (10/11)

          V_B = 0 (baseline)

          If E[ΔQ] is positive but very small, and the cost is substantial, then V_A might be negative.

     - **Result:** The committee might recommend against expansion.

  **Candid Section: Where the Procedure Misfires**

  1. **Misfires:**
     - **Inaccurate Data:** The procedure relies on accurate estimates of probabilities and utilities. If these are wrong, the ranking is wrong.
     - **Over-Simplification:** Grouping individuals into homogeneous groups ignores important heterogeneity. For example, in case (c), some men are at higher risk and might benefit more.
     - **Equity Concerns:** The procedure with equal weights may prioritize programs that help large populations with small gains over those that help small populations with large gains (as in case (b)). This might be seen as inequitable.
     - **Risk Aversion:** The procedure in Mode 2 (risk-neutral) ignores risk aversion. In cases with catastrophic risks (even with low probability), the public might prefer to avoid the catastrophe, but the procedure does not reflect that. Mode 1 is theoretically more appropriate but impractical.
     - **Scope of Utilities:** The conversion of costs to QALYs using a fixed threshold is arbitrary. Also, non-health factors (like caregiver burden) might be omitted.
     - **Time Constraints:** The three-hour limit may force the committee to use crude estimates.

  2. **Judgment Calls Dressed as Procedure:**
     - The choice of the affected population (Step 1) is a value judgment.
     - The choice of the utility function (Step 3) and risk posture is a value judgment.
     - The cost-effectiveness threshold (T) is a policy parameter that should be set by the political principals, but the committee might have to use an existing one.

  3. **Inconsistent Rankings:**
     - If two runs of the procedure on the same dossier produce different rankings, it is likely due to:
          - Different data inputs (if the committee re-evaluated the evidence).
          - Different value judgments (if the committee changed the parameters).
     - The committee should then:
          - Check for computational errors.
          - If the difference is due to data, they should seek better evidence.
          - If due to value judgments, they must either stick to the pre-specified values (if set by political principals) or flag the issue for the political principals.

  In conclusion, the procedure provides a structured spine for decision-making but requires careful consideration of its limitations and escape hatches for value judgments.
