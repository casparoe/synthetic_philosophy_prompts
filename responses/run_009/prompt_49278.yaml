prompt: |-
  I am the analytic lead for a state health technology assessment committee — the standing body that reviews clinical and economic evidence and recommends to the state health department which candidate interventions (new drugs, screening programs, telehealth expansions, staffing models) should be funded ahead of which others. Every six weeks we receive a batch of dossiers, each involving reallocations of care worth tens of millions of dollars across the state's population, and our recommendations are publicly defensible by design: they are regularly challenged at legislative hearings and in the press. The committee itself is eleven people — clinicians, a biostatistician, two patient representatives, a hospital administrator, a health economist, an ethicist — none of whom will ever work through a formal proof, all of whom must be able to explain to a skeptical legislator why one program was ranked above another. We have one three-hour meeting per batch. The secretary of health signs off on the final ranking but has asked that our reasons be structured rather than ad hoc.

  Our chair has become interested in Harsanyi's 1955 aggregation theorem and its companion impartial-observer argument: roughly, that if a social evaluator ranks risky prospects by expected utility while satisfying a Pareto condition with respect to individuals who are themselves expected-utility maximizers, the social ranking must be a weighted sum of individual cardinal utilities; and that if the evaluator instead takes each affected person's place with equal probability behind something like a veil of ignorance, the weights come out equal. The chair wants this as the spine of an actual decision procedure, not a seminar topic. Write me that procedure.

  Specifically, I need:

  1. A step-by-step procedure the committee can run on a dossier within a single three-hour meeting: the questions to ask in order, what counts as a sufficient answer to each, the points at which the procedure outputs or updates a ranking, and the points at which it must stop and flag the question as one of values for the political principals rather than one the framework can settle. As you simplify, preserve what actually does the work in Harsanyi's argument — the equal-probability construction, the expected-utility assumptions, the Pareto condition — so that committee members understand what they are committed to when they follow the procedure, and say which simplifications are safe and which quietly discard the theorem's justification. Be explicit about what the theorem does not settle: whether and how the cardinal utilities being summed are interpersonally comparable; whose utilities enter the sum (the chronically ill, future beneficiaries, taxpayers who bear the cost); and how risk attitudes should be handled — in particular, whether a person's aversion to a risky prospect is a fact about their well-being at stake or a fact about their psychology that the impartial observer should not inherit. That last question matters to us because Rawls's maximin objection to Harsanyi turns on exactly it, and my committee members reliably start talking like Rawlsians the moment a dossier contains a small probability of catastrophe.

  2. Worked applications of the procedure to three dossiers we have actually faced or expect to face:
     (a) a proposal to add critical congenital heart disease screening to the standard newborn panel — a very small expected benefit per infant, spread across essentially every birth in the state;
     (b) a gene therapy for a rare, fatal pediatric neurodegenerative condition that affects roughly two dozen children statewide at a price of several million dollars per patient, alongside dozens of cheaper competing uses of the same budget;
     (c) an expanded prostate cancer screening program that would prevent some deaths over twenty years while exposing a much larger number of men to biopsy complications, overdiagnosis, and treatment side effects.
     For case (b), I will be honest that I expect the procedure to give an answer I will not like, and I want to see whether it does, and what the procedure's own escape hatches are when it does.

  3. A candid section on where the procedure will misfire: the characteristic ways a committee using it in good faith reaches the wrong answer or no answer, the steps that are judgment calls dressed up as procedure, and what the committee should do when two runs of the procedure on the same dossier produce different rankings.

  Throughout, please write in American English.
reasoning: |-
  We are designing a decision procedure for a state health technology assessment committee, based on Harsanyi's aggregation theorem and the impartial observer argument. The goal is to have a structured, defensible method for ranking health interventions that can be executed in a three-hour meeting.

  The core of Harsanyi's theorem is that if:
  - Each individual is an expected utility maximizer (with cardinal utilities).
  - The social evaluator satisfies the Pareto condition (if everyone is indifferent between two prospects, so is society; if everyone prefers one prospect to another, so does society) and also ranks prospects by expected utility,
  then the social ranking must be a weighted sum of individual utilities.

  In the impartial observer version, if the observer takes each person's position with equal probability, then the weights are equal.

  However, we must be explicit about what the theorem does not settle:
  1. Interpersonal comparability of utilities: The theorem assumes that utilities are cardinal and interpersonally comparable. In practice, we must decide how to measure and compare utilities across individuals.
  2. Scope: Whose utilities count? (e.g., patients, future beneficiaries, taxpayers)
  3. Risk attitudes: The theorem assumes that individuals are expected utility maximizers. But is risk aversion a legitimate part of well-being (which the impartial observer should inherit) or a psychological trait that the observer should set aside? This is critical because Rawls objects to Harsanyi on the grounds that the impartial observer should not inherit individual risk aversion when there are catastrophic possibilities.

  We are going to design a step-by-step procedure that the committee can run in a three-hour meeting per dossier. The procedure must:
  - Be executable by a committee of non-specialists.
  - Preserve the core elements: the equal-probability veil of ignorance, expected utility, and Pareto condition.
  - Have clear stopping points where the committee flags a question as one of values for political principals.

  The procedure will have the following steps:

  **Step 1: Define the affected population and the alternatives.**
     - For a given dossier, the committee must define:
          - The set of alternative interventions (including the status quo).
          - The population affected by each alternative. This includes direct beneficiaries, taxpayers, and others whose well-being is affected (e.g., due to opportunity costs). We must be explicit about including/excluding future generations, non-residents, etc. (This is a judgment call; the framework does not settle it.)

  **Step 2: Characterize the outcomes under each alternative.**
     - For each alternative, describe the distribution of health and economic outcomes for each group in the population. This should include:
          - Health outcomes: mortality, morbidity, quality of life, etc.
          - Economic outcomes: costs to the individual, to the health system, to taxpayers, etc.
          - Uncertainty: represent outcomes as probability distributions (e.g., via scenarios or confidence intervals).

  **Step 3: Construct the individual cardinal utility functions.**
     - This is the most challenging step. We need to assign a cardinal utility to each outcome for each individual (or group of similar individuals). The utility must be on a scale that is interpersonally comparable. We propose:
          - Using a common metric such as quality-adjusted life years (QALYs) for health outcomes, and converting costs to a common monetary unit (e.g., dollars). However, note that QALYs are not necessarily equivalent to utilities in the sense of von Neumann-Morgenstern (vNM) expected utility theory. We must adjust for risk attitudes if we are to be consistent with Harsanyi.
          - Alternatively, we can use a direct vNM utility function over health and wealth. But this is complex.

     We propose a simplification that is safe only under certain conditions:
          - We assume that the committee can agree on a common utility function for health and wealth that is the same for all individuals (except perhaps for risk attitudes). This is a strong assumption and discards some of the justification of the theorem (which allows for individual differences in utility functions). However, without it, we cannot aggregate.

     To handle risk attitudes, we have two options:
          Option A (Harsanyi): The impartial observer inherits the risk aversion of the individuals. Then, we must measure the vNM utility function of each individual (or group) and use that.
          Option B (Rawls-inspired): The impartial observer uses a risk-neutral perspective, so that only the expected outcomes matter, not the variance or the risk of catastrophe.

     Given the time constraints, we propose a hybrid:
          - We use QALYs as a common health measure and assume that one QALY is equally valuable to everyone. For costs, we convert to QALYs using a cost-effectiveness threshold (e.g., $X per QALY). Then, we define the utility for an individual as the net QALYs (health QALYs minus the QALY-equivalent of any costs borne by that individual). But note: this does not capture risk aversion.

     How to handle risk:
          - We will ask the committee to decide, at the outset, on a risk posture for the impartial observer. The chair must note that Harsanyi's theorem requires the observer to inherit individual risk attitudes, but Rawls would object. We propose two modes:
              Mode 1 (Risk-Averse Impartial Observer): We use a concave transformation of net QALYs to reflect risk aversion. The committee must choose a common utility function (e.g., U = -e^(-γ * (net QALYs)) with γ chosen to reflect moderate risk aversion). Then, for each prospect, we compute the expected utility for each individual.
              Mode 2 (Risk-Neutral Impartial Observer): We use net QALYs without any transformation, so that the utility is linear in net QALYs.

          - The committee must choose one mode for all dossiers. This is a value judgment and should be made by the political principals if the committee cannot agree. We recommend Mode 2 for simplicity and because it avoids the problem of double-counting risk aversion (once in the QALY measurement and once in the utility function). However, note that in Mode 2 we are discarding Harsanyi's requirement that the observer inherits individual risk attitudes.

     **Important:** The committee must also decide on the scope of costs. Do we include only health system costs? Or also productivity costs, caregiver burden, etc.? And how do we convert costs to QALYs? We use a fixed threshold (e.g., $100,000 per QALY) for converting costs to QALY losses.

     **Step 3a: Flag for political principals:** If the committee cannot agree on the utility function (especially the risk posture) or the cost threshold, they must stop and flag this as a value judgment for the political principals.

  **Step 4: Assign probabilities in the veil of ignorance.**
     - The impartial observer takes each person's place with equal probability. Therefore, the probability of being any particular individual is 1/N, where N is the total number of people in the affected population.

     **Note:** But what is the affected population? This includes everyone in the state? Or only those directly affected? We propose defining the affected population as all state residents (or all taxpayers) because the budget is statewide. However, for a specific intervention, we might include future beneficiaries (if the intervention has long-term effects). This is a judgment.

     **Step 4a:** The committee must define N. This might be the current state population, but for interventions with long-term effects, we might need to include future generations. We propose including all individuals (current and future) who are affected by the intervention, discounted appropriately (if discounting is used). The committee must decide on a discount rate for health outcomes and costs. This is a value judgment that might require flagging for political principals.

  **Step 5: Compute the expected utility for the impartial observer.**
     - For each alternative intervention, we compute:
          V = (1/N) * Σ [ E[U_i] ] for i=1 to N
          where E[U_i] is the expected utility of individual i under the alternative.

     - In practice, we cannot compute for each individual. We group the population into homogeneous groups (by age, health status, etc.) and compute:
          V = Σ (n_k / N) * E[U_k]
          where n_k is the number of individuals in group k, and E[U_k] is the expected utility for an individual in group k.

     - The alternative with the highest V is ranked highest.

  **Step 6: Check for Pareto violations.**
     - Before finalizing, the committee must check that the ranking does not violate the strong Pareto principle: if every individual (or group) gets a higher expected utility in alternative A than in alternative B, then A should be ranked above B. If the computed V ranks A below B in such a case, there is an error in the computation (or in the grouping). This step is a safeguard.

  **Step 7: Output the ranking.**
     - The alternatives are ranked by V.

  **Stopping points for value judgments:**
     - Step 1: Defining the population (e.g., whether to include future generations, non-residents).
     - Step 3: Choosing the utility function (risk posture, cost-to-QALY conversion threshold, whether to include non-health factors).
     - Step 4a: Discount rate and time horizon.

  Now, we apply this procedure to the three dossiers.

  **Case (a): Critical congenital heart disease screening for newborns.**
     - **Step 1:** 
          Alternatives: (A) Implement screening; (B) Status quo (no screening).
          Affected population: All newborns in the state (say, 100,000 per year) and their families, and taxpayers (who bear the cost of the screening and the subsequent care). We consider one year of newborns and the long-term effects for these children.

     - **Step 2:**
          - Screening cost: $X per infant.
          - Without screening: Some cases will be missed, leading to higher mortality and morbidity (which also has costs). 
          - With screening: Fewer deaths and complications. The expected number of lives saved (and QALYs gained) is small per infant because the condition is rare (about 1 in 5,000). But the cost per infant is also small.

     - **Step 3:** 
          We use Mode 2 (risk-neutral) and express everything in net QALYs. 
          For each infant:
              In status quo: 
                  Expected QALYs: Q (the same as in screening for the majority without the condition, but for the few with the condition, they have a lower QALY due to late detection). We can compute the average per infant: 
                      QALY_B = (1-p) * Q0 + p * Q1 
                  where p = probability of having the condition, Q0 = QALYs without the condition, Q1 = QALYs with the condition and no screening (which is lower due to complications and death).
              With screening:
                  QALY_A = (1-p) * Q0 + p * Q2   [where Q2 > Q1 because of early detection]
                  But we also subtract the QALY loss from the cost: the cost per infant is C, and we convert this to QALYs using a threshold T (e.g., $100,000 per QALY). The QALY loss per infant is C / T.
                  So, net QALY_A = QALY_A - (C / T)

          The gain per infant is: [p*(Q2 - Q1)] - (C / T)

          Since p is small, the gain is small but positive (if the screening is cost-effective). The committee must have data on p, Q0, Q1, Q2, C, and T.

     - **Step 4:**
          The affected population: We consider the cohort of newborns (N = 100,000). We ignore future cohorts because the decision is made annually. We also ignore the families and taxpayers because we are accounting for costs (which are borne by taxpayers) by converting to QALYs. Alternatively, we could include all taxpayers as additional individuals, but that complicates. We assume that the cost is distributed so that the per-taxpayer cost is negligible and does not affect utility. So we focus on the newborns.

          Probability: Each newborn has probability 1/100,000.

     - **Step 5:**
          V_A = average net QALY per infant = [p*(Q2 - Q1) - C/T] + (1-p)*Q0 + p*Q1 
               = (1-p)*Q0 + p*Q1 + p*(Q2 - Q1) - C/T 
               = (1-p)*Q0 + p*Q2 - C/T
          V_B = (1-p)*Q0 + p*Q1

          So V_A - V_B = p*(Q2 - Q1) - C/T

          If this is positive, then screening is better.

     - **Step 6:** 
          The Pareto condition: Every infant is either unaffected (so same in A and B) or affected (and then better off in A). Also, the cost is spread so thinly that no taxpayer is measurably worse off. So if V_A > V_B, then A is better and there is no Pareto violation.

     - **Result:** The screening will likely be recommended because it is cost-effective.

  **Case (b): Gene therapy for a rare pediatric condition.**
     - **Step 1:**
          Alternatives: (A) Fund the gene therapy (for about 24 children); (B) Use the same budget (say, $100 million) for other health programs (e.g., a set of interventions that we call B).
