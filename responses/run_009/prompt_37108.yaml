  Based on your requirements, here's a case-based quiz that uses concrete scenarios to reveal implicit definitions of life. The quiz avoids labels and focuses on intuitive responses to specific cases, then maps answer patterns to philosophical positions.

  **Quiz: What's Your Implicit Definition of Life?**  
  *For each scenario, pick the option that best reflects your view.*

  1. **The Immortal Cells**  
     HeLa cells (human-derived cell line) have divided continuously in labs since 1951, adapting to environments but requiring lab support to survive. Your view:  
     A) *Alive—they maintain themselves and replicate.*  
     B) *Not fully alive—they're dependent on artificial environments.*  
     C) *Borderline—they're cellular but not independent organisms.*  

  2. **The Tardigrade in Suspension**  
     A tardigrade dried for 30 years shows no metabolism but can revive with water. During dormancy:  
     A) *Alive—it retains the potential to function.*  
     B) *Not alive—life requires continuous activity.*  
     C) *Between states—it’s paused, not dead.*  

  3. **The Perfect Replicator**  
     A synthetic protocell replicates *perfectly* with zero mutations (no evolution possible). It maintains its boundaries. Your view:  
     A) *Alive—it self-sustains and reproduces.*  
     B) *Not alive—without evolution, it’s just chemistry.*  
     C) *Borderline—life-like but static.*  

  4. **The Digital Invader**  
     A computer virus spreads through a simulated world, mutating and outcompeting other code. It exists only as data. Your view:  
     A) *Alive—it evolves and replicates.*  
     B) *Not alive—it lacks physical substance.*  
     C) *Borderline—alive in its context.*  

  5. **The Moon Factory**  
     A robot on the moon uses raw materials to build identical copies of itself. It was designed to replicate, not evolve. Your view:  
     A) *Alive—it self-produces and sustains.*  
     B) *Not alive—it’s a machine, not biology.*  
     C) *Borderline—life-like but artificial.*  

  6. **The Mule Paradox**  
     A mule (sterile horse-donkey hybrid) eats, heals, and ages but cannot reproduce. Your view:  
     A) *Alive—it clearly functions and maintains itself.*  
     B) *Not alive—reproduction is essential.*  
     C) *Borderline—alive but "incomplete."*  

  7. **The Worker Ant**  
     A sterile ant in a colony: it forages, fights, and reacts to threats but will never breed. Your view:  
     A) *Alive—it’s an active, integrated biological agent.*  
     B) *Not alive—it can’t contribute genetically.*  
     C) *Borderline—part of a living system, not individually.*  

  8. **The Budding Droplet**  
     An oil droplet "crawls" up a pH gradient and splits into smaller droplets. No genetics or evolution. Your view:  
     A) *Alive—it self-produces and responds to its environment.*  
     B) *Not alive—it’s simple physics/chemistry.*  
     C) *Borderline—life-emergent but not evolved.*  

  9. **The Glider**  
     A "glider" in Conway’s Game of Life (a cellular automaton simulation) moves infinitely, maintaining its pattern. Your view:  
     A) *Alive—it persists and "moves" purposefully.*  
     B) *Not alive—it’s abstract, not biochemical.*  
     C) *Borderline—a model of life, not the real thing.*  

  10. **The Stealthy Prion**  
      A misfolded protein (prion) causes other proteins to misfold, spreading disease. No metabolism or genetic material. Your view:  
      A) *Alive—it self-replicates and adapts.*  
      B) *Not alive—it’s just infectious chemistry.*  
      C) *Borderline—shares traits with life but not enough.*  

  ---

  ### Scoring Key  
  Tally your **A/B/C** answers and match to the definitions below. Groups with identical patterns are merged.  

  #### **Group 1: Autopoiesis or Metabolic/Homeostatic View**  
  *(Life = self-producing systems that maintain boundaries OR continuous metabolism/homeostasis)*  
  - **Signature:** High tolerance for non-reproducing individuals (mules/ants alive), rejects non-metabolic/abstract cases.  
  - **Your pattern:**  
    - Q1: A or C  
    - Q2: B  
    - Q3: A  
    - Q4: B  
    - Q5: B  
    - Q6: A  
    - Q7: A  
    - Q8: B or C  
    - Q9: B  
    - Q10: B  
  - *Note:* Autopoiesis and Metabolic views **cannot be separated** by this quiz—both prioritize self-maintenance over evolution.  

  #### **Group 2: NASA Evolutionary View**  
  *(Life = self-sustaining chemical system capable of evolution)*  
  - **Signature:** Rejects non-evolving systems (protocells, robots) and non-chemical cases (digital, gliders).  
  - **Your pattern:**  
    - Q1: B  
    - Q2: B  
    - Q3: B  
    - Q4: B  
    - Q5: B  
    - Q6: B  
    - Q7: B  
    - Q8: B  
    - Q9: B  
    - Q10: B or C  
  - *Key differentiator:* Only group to consistently say "not alive" to mules/ants (Q6/Q7 = B), as they can’t evolve *individually*.  

  #### **Group 3: Thermodynamic View**  
  *(Life = sustains order by "feeding on entropy")*  
  - **Signature:** Accepts physical systems that harness energy (oil droplets, robots) but rejects dormant/passive cases.  
  - **Your pattern:**  
    - Q1: B or C  
    - Q2: B  
    - Q3: A  
    - Q4: A  
    - Q5: A  
    - Q6: B  
    - Q7: A  
    - Q8: A  
    - Q9: A  
    - Q10: A or C  
  - *Key differentiator:* Only group accepting the moon factory (Q5 = A) and oil droplet (Q8 = A) as "alive."  

  #### **Group 4: Deflationary View**  
  *(Life = cluster concept with no single essence)*  
  - **Signature:** Frequent "borderline" responses; pragmatic case-by-case judgments.  
  - **Your pattern:**  
    - At least **5 C answers** (or 4 Cs + ambiguous A/B).  
  - *Note:* Scores here are incompatible with other groups.  

  #### **Unclassifiable**  
  - Mixed patterns (e.g., high A/B but <5 Cs without matching Groups 1–3).  
  - Indicates idiosyncratic or hybrid views.  

  ---

  ### Design Notes  
  - **Indistinguishable Groups:** Autopoiesis and Metabolic views **always overlap**—both require active self-maintenance but don’t mandate evolution.  
  - **Diagnostic Cases:**  
    - *Mule (Q6) vs. Ant (Q7):* Separates individual-focused (Autopoiesis/Metabolic) from lineage-focused (NASA) views.  
    - *Protocell (Q3) & Robot (Q5):* Isolates NASA (rejects non-evolvers) from Thermodynamic (accepts energy-driven systems).  
    - *Tardigrade (Q2) & Oil Droplet (Q8):* Divides metabolic (rejects both) from thermodynamic (accepts droplets) views.  
  - **Edge Cases:** HeLa cells (Q1) and prions (Q10) split deflationary (C) from others.  
  - **Constraint Adherence:** No prior knowledge needed; all questions case-based.  

  This quiz should spark discussion by revealing how "obvious" intuitions map to formal definitions! Let me know if you’d like tweaks to cases/scoring.
