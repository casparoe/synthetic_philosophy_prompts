  - Syntactic approaches (looking at logical structure) fail because many cases are intertranslatable
  - Ontological approaches (comparing commitments) might help but need refinement
  - Explanatory power seems key - note how they dismiss theories with "wheels connected to nothing" (case 3) or "inferior editions" (case 4)

  The user's language reveals important clues: they value theories that "do work" versus those with "cheap tricks." This suggests an explanatory economy principle. But standard formulations are too vague - we need to define what counts as "explanatory work."

  Ah! The breakthrough comes with Daniel Nolan's grounding framework. We can distinguish:
  - "Idle wheels" (cases 1,4) where additions are explanatorily inert
  - "Substantive differences" (case 2) where interpretations ground different modality
  - "Cheap fiats" (case 5) that block rather than enable explanation

  For the thermodynamics test case: statistical mechanics isn't just notational variant because it grounds phenomenological laws in microphysics, enabling new explanations (of entropy, phase transitions etc.) that pure thermodynamics cannot provide.

  This principle beautifully resolves case 3: Lorentz's ether is an idle wheel because all its causal work is duplicated by SR's spacetime structure. Hence it shouldn't be considered a genuine rival - which aligns with the user's "wheel connected to nothing" intuition on clearer days.

  The only tension might be with case 2, but many-worlds versus collapse actually involves different grounding claims about probability and modality - the "fiat" in collapse interpretations is doing real explanatory work (solving the measurement problem) rather than just blocking questions.

  I should acknowledge this principle demands a realist commitment to grounding relations - an instrumentalist might reject it. But given the user's framing ("genuine rivals," "one is true"), they seem comfortable with that commitment.
answer: |-
  After careful reflection on your cases and the philosophical terrain, I propose the **Explanatory Grounding Principle** as the best candidate to systematise your intuitions. Let's build this step by step.

  ### Candidate Principles Considered and Rejected
  1. **Syntactic Parsimony Principle** (favours theories with fewer primitives):  
     - *Problem:* Fails case (2). Many-worlds has vastly more ontological commitments than collapse theories, yet you treat them as rivals.

  2. **Ontological Robustness Principle** (genuine rivals must disagree on fundamental entities):  
     - *Problem:* Ambiguous in cases like (3) (ether vs. spacetime) and struggles with (4) (where entities are added but "do nothing").

  3. **Counterfactual Difference Principle** (rivals must support different counterfactuals):  
     - *Problem:* All your rejected cases (1,4,5) *can* generate trivial counterfactual differences (e.g., "if universal forces vanished...").

  4. **Structural Equivalence Principle** (rivals must not be intertranslatable):  
     - *Problem:* Too strict—would invalidate your verdict on (2), as some argue many-worlds and collapse are notational variants.

  ---

  ### The Explanatory Grounding Principle (EGP)
  **A theory T₁ and its empirically equivalent counterpart T₂ are genuine rivals iff:  
  (i) T₁ and T₂ posit *distinct explanatory grounds* for the same phenomena, and  
  (ii) These grounds are *non-arbitrarily modally robust* (i.e., they support non-trivially different patterns of explanation across possible scenarios).**

  #### Key Terms Defined:
  - **Distinct explanatory grounds:** The mechanisms/entities posited by T₁ and T₂ must play *unique* explanatory roles that aren't parasitic on the other theory’s structure.  
  - **Non-arbitrarily modally robust:** The explanatory differences must generate substantively different (but non-ad hoc) accounts of *how* or *why* phenomena *could* differ under untested conditions.

  ---

  ### Application to Your Cases
  1. **Reichenbach (non-rival):**  
     - The "universal force" is *explanatorily parasitic* on the geometry it mimics. It adds no *new* grounding—it merely restates curvature as a force.  
     - *EGP verdict:* Not rivals (agrees with you). Clause (i) violated.

  2. **Many-worlds vs. Collapse (rivals):**  
     - Many-worlds explains quantum probabilities via branching actualities; collapse theories explain them via dynamical processes. These ground predictions differently (e.g., for quantum suicide or post-measurement states).  
     - *EGP verdict:* Genuine rivals. Both clauses satisfied—distinct grounds with non-arbitrary modal consequences.

  3. **Lorentz vs. Special Relativity (not rivals):**  
     - Lorentz’s ether is *explanatorily idle*: all its work (e.g., length contraction) is duplicated by SR’s spacetime structure. The ether adds no *unique* grounding—it’s a "wheel connected to nothing."  
     - *EGP verdict:* Not genuine rivals. Clause (i) violated. (Settles your ambivalence: nature didn’t "pick" ether—it’s eliminable.)

  4. **Padded Chemical Theory (not rivals):**  
     - The "inner degree of freedom" plays no explanatory role. It’s not merely unobservable—it’s *explanatorily inert*, failing to ground any chemical behaviour.  
     - *EGP verdict:* Not rivals. Clause (i) violated.

  5. **Observability Fiat (not rivals):**  
     - The fiat clause *blocks* explanation ("you can’t observe beyond here") rather than providing grounding. Contrast with QM collapse, which *explains why* we don’t observe superpositions.  
     - *EGP verdict:* Not rivals. Clause (ii) violated—the fiat is arbitrary, not modally robust.  
     - *Crucial distinction from (2):* Collapse postulates aren’t *merely* about observability; they dynamically ground the emergence of definite outcomes.

  ---

  ### Test Case: Thermodynamics vs. "Anti-Mechanics"  
  - **Scenario:** Phenomenological thermodynamics (PT) vs. a theory that recapitulates all predictions via "anti-particles" whose statistical behaviour is exactly inverted from statistical mechanics (SM), yet yields identical macro-laws.  
  - **EGP Analysis:**  
    - SM grounds thermodynamic laws in microphysical dynamics (e.g., entropy increase as probabilistic tendency).  
    - "Anti-mechanics" would need to posit *why* inverted micro-behaviour converges to PT—likely requiring parasitic/ad hoc grounding (e.g., "it just happens to mirror SM").  
  - **Verdict:** *Not* rivals if anti-mechanics is explanatorily parasitic. But if it provided distinct grounding (e.g., via teleological laws), it *could* be a rival—though it would violate parsimony.

  ---

  ### Limitations and Tensions
  - Your verdicts are *largely* preserved, but EGP demands rejecting any lingering intuition in (3) that Lorentz’s ether is a viable rival.  
  - EGP assumes scientific realism about explanation—an instrumentalist would reject it.  
  - **Biggest tension:** Case (2) relies on granting that collapse is undetectable *in principle*. If collapse were deemed an explanatory "fiat" (like case 5), EGP *might* demote it to non-rivalry. But your intuition suggests collapse postulates *do* genuine explanatory work (resolving the measurement problem), whereas observability fiats *prevent* explanation.

  ### Why EGP Succeeds
  It captures your core intuition: trivial underdetermination arises when one theory is "camouflaged parasitism" (cases 1,3,4) or "explanatory cowardice" (case 5), while substantive underdetermination reflects *genuine differences in what makes the world work* (case 2). The principle honours realism by demanding theories do more than "save phenomena"—they must *ground* them.

  Would you like to test EGP against further cases, or refine its formulation?
