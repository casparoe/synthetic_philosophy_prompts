  - Case 1 (Reichenbach): Not rivals (trivial underdetermination)
  - Case 2 (QM interpretations): Genuine rivals
  - Case 3 (Lorentz vs SR): Undecided
  - Case 4 (Padded theory): Not rivals (inferior variant)
  - Case 5 (Observability fiat): Not rivals (cheap trick)

  The core tension emerges between their acceptance of quantum rivals (case 2) but rejection of artificial variants (cases 1,4,5). They're particularly troubled by their own inconsistency regarding "fiat clauses" in cases 2 and 5. 

