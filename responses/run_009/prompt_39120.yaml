  For structure: I'll start with the normative claim itself to let the scholar establish her thesis upfront, then move to the idealization problem since it's the biggest philosophical hurdle. The conformism question must tackle Smith's own awareness of societal biases head-on—maybe referencing his "poor man's son" passage. The praiseworthiness addition is tricky because it's textually late but might be philosophically latent; scholarship is divided here, so the question should remain open. The Hume comparison needs care since scholars endlessly debate their overlap/differences. 

