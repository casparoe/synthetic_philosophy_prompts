prompt: |-
  The argument over probability in the Everett (many-worlds) interpretation has now run for a quarter century without either side moving, and I have come to suspect that no amount of additional formalism will settle it, because the real disagreement lies elsewhere. I would like a diagnosis of the structure of this dispute rather than another round of it.

  To make sure we are looking at the same thing, here is the situation as I understand it. In Everettian quantum mechanics every outcome of a measurement occurs, on some branch, with a "weight" given by the squared amplitude of that branch. That is fine as physics, but it leaves the Born rule looking like an orphan: since everything happens, "the probability that outcome A occurs" cannot mean the fraction of trials on which it happens, and an agent who knows that both A and not-A will occur cannot be uncertain about which one she will see. The Deutsch–Wallace program attempts to close this gap with decision theory rather than probability theory proper: a rational agent who is about to branch is offered axioms constraining her preferences over future experiences — roughly, that her preferences should not depend on how the branchings are formally decomposed, and that she should prefer bets whose payoff is guaranteed to a mixed bet that yields the same payoffs on some branches and worse on others — and it is then argued that any agent satisfying these axioms must act as if each outcome had probability equal to its Born weight, so the squared amplitudes can play the probabilistic role without ever being assumed to be probabilities. The critics, most persistently Adrian Kent but also others, respond in several overlapping ways: that the "harmless" axioms covertly presuppose a probability measure, since reading the weights as chances is exactly what makes indifference to formal re-decomposition of a mixture look rational; that decision-theoretic equivalence between "worth caring about" and "worth expecting" needs a probabilistic notion of expectation already in place, making the derivation circular; and that, even if the theorem stands, it delivers at most betting advice — that you should act as if something were uncertain — and never the fact that something is uncertain. Meanwhile, some Everettians concede the decision-theoretic route entirely and rest instead on typicality, the claim that we are entitled to regard our own branch as typical, which the same critics dismiss as the missing probability assumption wearing a different hat.

  The theorem itself, I take it, is not disputed; both sides accept that the axioms entail the Born weights. My working hypothesis is therefore that the disagreement is not mathematical at all but about what a derivation is permitted to take as primitive: the Everettians treat rationality axioms as fixed points requiring no probabilistic grounding, while their critics hold that nothing short of outright chance can legitimately ground betting advice, so that the two camps are operating with different standards for when a derivation succeeds. Is that right? Or is the dispute better understood as verbal, turning on what "probability" means when every outcome obtains? Or as two groups answering different questions under a single heading — one about what an agent facing branching should do, the other about what makes probabilistic claims about the world true? Alternatively, is there a genuine hidden formal question still unresolved, as some of the circularity charges would imply if they could be stated precisely enough to be theorems? I want your diagnosis supported by what the participants actually argue, not a survey of interpretations of quantum mechanics generally, and an honest account of what, if anything, could count as progress on your diagnosis — a sharpened axiom, a theorem, a clean distinction between betting advice and genuine chance, or the concession that the question is ill-posed and why progress should not be expected.

  Please close with a single final line of the form

  \diagnosis{label}

  where "label" is one of: verbal, substantive-formal, substantive-empirical, different-questions, ill-posed, bedrock-intuitions — or a hyphenated combination, in order of importance, if you think several apply.
reasoning: |-
  Okay, the user presents a complex philosophical and technical debate about the Everett (many-worlds) interpretation of quantum mechanics, specifically the long-standing impasse regarding probability. They've clearly done deep research—citing Deutsch-Wallace decision theory, Kent's criticisms, typicality arguments—and want a meta-analysis of why this dispute persists rather than another rehash of positions.

  Hmm... The core tension they identify is fascinating: Everettians treat decision-theoretic axioms as primitive foundations for rational action, while critics insist only objective chance can ground probability. The user's hypothesis—that this reflects divergent standards for successful derivation—seems perceptive. I should test this against the actual arguments. 

  First, Deutsch-Wallace proponents (like David Wallace) do frame rationality axioms as pre-probabilistic: if you accept that preferences should respect branch structure ("diachronic consistency"), the Born rule emerges as a constraint on action. But Kent's circularity charge bites hard here—doesn't "rationality" here smuggles in probabilistic expectations? Wallace counters that the axioms only specify coherence conditions for valuing future branches, not expectations. Yet critics like Huw Price argue that valuing branch-dependent outcomes requires implicit probability weighting. 

  Then there's the ontological gap: even if the theorem shows agents should bet with Born weights, does that make them probabilities? Everettians say "for all practical purposes, yes"; critics retort that real uncertainty requires exclusivity (only one outcome happens). This feels like a different-questions scenario: one side asks "how should I act?", the other "what is real?".

  The typicality fallback seems equally stuck. Saying "we're typical" presumes a measure over branches—but that measure is exactly the Born rule in disguise. Kent calls this "probability in disguise," and he's not wrong. 

  So where does this leave us? The dispute persists because:
  - Verbal: "probability" means different things (subjective betting vs objective chance)
  - Foundational: What counts as "deriving" probability? (axiomatic rationality vs reduction to physics)
  - Ontological: Can decision theory answer metaphysical questions about uncertainty?

  Progress might require clarifying these layers:
  1. Axiomatic refinement: Can we isolate a non-probabilistic core of "branching rationality"? (Unlikely after 25 years.)
  2. Meta-justification: Why accept these axioms without probabilistic priors? (Might need evolutionary/cognitive arguments.)
  3. Conceptual separation: Explicitly distinguish "pragmatic probability" (for action) from "metaphysical chance" (for reality). 

  But ultimately, the deepest divide is bedrock intuitions about what "uncertainty" means when all outcomes exist. The user's diagnosis of divergent primitives seems correct, though I'd add that the questions being asked are fundamentally different. Both sides are coherent internally but speak across purposes. 

  Final diagnosis: bedrock-intuitions and different-questions, with verbal ambiguity enabling the stalemate. No formal theorem will bridge this because it's about what counts as an explanation.
answer: |-
  Your diagnosis captures a core element of the impasse, but the dispute is multifaceted, involving **verbal**, **different-questions**, and **bedrock-intuitions** disagreements. Here’s a breakdown based on participant arguments:

  ### 1. **Verbal Disagreement: What "Probability" Means**  
     - **Everettians** (Deutsch, Wallace): Redefine "probability" as a *measure of caring* or *betting disposition* for future branches. Born weights are not "chances" in a classical sense but *rational credences* derived from decision theory.  
     - **Critics** (Kent, Maudlin): Insist "probability" requires *exclusivity* (only one outcome occurs) and *ignorance*. If all outcomes happen, "probability" is meaningless without importing classical assumptions.  
     - **Key Example**: When Wallace says rational agents "act as if" Born weights are probabilities, critics argue this equivocates between *pragmatic advice* and *ontological chance*.

  ### 2. **Different Questions: Pragmatics vs. Ontology**  
     - **Everettians** address: *"How should a rational agent facing branching act?"*  
       Their answer: Use Born weights to weight preferences (Deutsch-Wallace theorem).  
     - **Critics** address: *"What makes probabilistic statements true?"*  
       Their answer: Only objective, single-world uncertainty (rejected by Everett).  
     - **Disconnect**: The theorem’s success for the first question does not resolve the second. Kent explicitly distinguishes *betting behavior* from *genuine uncertainty* (e.g., "Subjective probability in quantum mechanics is undefined if all outcomes occur").

  ### 3. **Bedrock Intuitions: Rationality vs. Chance Primacy**  
     - **Everettians** treat decision-theoretic axioms (e.g., **diachronic consistency**, **branch indifference**) as *primitive rational constraints*. No probabilistic grounding is needed; axioms reflect what it means to be rational in a branching universe.  
     - **Critics** view these axioms as *smuggling in probability*:  
       - **Branch indifference** (valuing branches equally if amplitudes match) assumes Born weights *should* matter, which presupposes a probability measure.  
       - **Diachronic consistency** (preference stability across branching) requires valuing future selves probabilistically.  
     - **Irreconcilable Views**: Critics (e.g., Albert) argue that "rationality" without pre-existing uncertainty is incoherent; Everettians (e.g., Wallace) counter that critics beg the question by demanding classical probability.

  ### 4. **Typicality: A Symptom, Not a Solution**  
     - Everettians (e.g., Vaidman) invoking "typicality" face a parallel critique:  
       - Claiming "we are typical" assumes a *measure* (Born rule) to define typicality.  
       - Critics (e.g., Price): This is circular—typicality relies on the very probability rule it seeks to justify.

  ### Could Progress Be Made?  
  - **Sharpened Axioms**: Unlikely. Critics already argue *any* non-probabilistic axiom constraining preferences in branching must implicitly assume probability (e.g., Baker 2007).  
  - **Formal Theorem**: The Deutsch-Wallace theorem is accepted; disputing its *relevance* is the issue.  
  - **Distinguishing Advice from Chance**: A clear separation might clarify positions but won’t resolve the core conflict. Critics concede the theorem gives betting advice but deny it addresses "real" probability.  
  - **Ill-Posed Question?**: Only if one insists "probability" must mean classical uncertainty. Everettians reject this framing.  

  ### Conclusion  
  The dispute persists because it is **not resolvable by formalism alone**. It hinges on:  
  - **Verbal**: Redefining "probability."  
  - **Different-questions**: Pragmatic rationality vs. ontological truth-conditions.  
  - **Bedrock-intuitions**: Whether decision-theoretic axioms can stand without probabilistic foundations.  

  Critics see Everettians as changing the subject; Everettians see critics as demanding impossible physics. The deadlock is philosophical, resting on irreconcilable intuitions about uncertainty in a deterministic multiverse.  

  \diagnosis{bedrock-intuitions-different-questions-verbal}
