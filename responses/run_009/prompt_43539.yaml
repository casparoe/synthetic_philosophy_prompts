  Perhaps the solution lies in challenging step (3) without appealing to a "right" measure. If we distinguish between "arbitrary" and "purpose-relative," we might preserve objectivity within frameworks. For example, mortality risk isn't conventional just because it's normalized - it tracks a real experiential fact about individuals. The user's seminar context matters here too; historians might share epistemic purposes that make certain measures intersubjectively robust even if not metaphysically privileged.

