  First I need to understand the core of the philosophical debate: does what's at stake affect whether we can claim to "know" something? The bank example is classic - same evidence, different stakes, different intuition about knowledge. Then there are invariantists who say knowledge criteria don't change with stakes.

  Hmm, in reliability engineering, stakes definitely affect decisions. Higher stakes mean stricter safety margins and higher confidence levels. But is that actually the same as changing what counts as knowledge? Or just changing our tolerance for risk?

  For the mapping: confidence levels seem like the clearest parallel. Demanding 99.9% vs 99.999% confidence based on consequences - that feels like pragmatic encroachment in action. But does calling something "knowledge" change, or just our certification threshold? 

  The residue might be that philosophers care about the knowledge attribution itself changing, while engineers care about decision thresholds. The word "know" doesn't even appear in our specs - we say "verified to X confidence" or "meets Y margin". 

  And that last question is sharp: is this whole debate just an artifact of fuzzy language? Engineers avoid the verb "know" precisely because it's ambiguous - we quantify instead. Maybe philosophers are wrestling with a problem that technical language dissolves.

  Need to structure this carefully: first show the clean mappings (confidence levels as stakes-sensitive knowledge criteria), then the distortions (knowledge vs certification), then the true residues (the entire concept of "knowledge" as distinct from quantified verification). And for the gap question - I think it's both: engineering avoids the fuzziness, but maybe loses some nuance about how evidence justifies belief in high-stakes contexts.
answer: |-
  Here's the pragmatic encroachment debate translated into aerospace reliability vocabulary, followed by a residue report and analysis:

  **Core Debate Translation**  
  - *Pragmatic Encroachment Claim*: The required **confidence bound for failure-rate estimates** tightens when operational consequences increase. Identical test data may suffice for acceptance on a non-critical bracket (e.g., cabin interior, low stakes) but fail certification for a primary load path (e.g., wing spar, high stakes).  
  - *Invariantist Position*: The **inherent factor-of-safety margin** is absolute. If a part passes proof load testing at 1.5x limit load with 95% confidence, it "knows" (meets requirements) regardless of whether it’s a cargo latch or a flight-control actuator.  

  **Stakes Manifestation in Engineering**  
  - **Clean Mapping**: Stakes directly dictate **confidence levels** and **safety margins**.  
    - *Example*: A hydraulic fitting in a satellite deployment mechanism (failure = mission loss) demands 99.99% reliability confidence vs. 99% for a ground-test fixture.  
    - *Parallel*: Just as pragmatic encroachment argues stakes raise the "knowledge" threshold, engineering raises **certification stringency** (tighter confidence bounds, higher proof loads) for criticality.  
  - **Distorted Translation**:  
    - "Knowing" ≠ "Certifying". Philosophers debate belief justification; engineers define **acceptance criteria** procedurally. "Identical evidence" is rare—high-stakes components get more tests (*redundant load paths* in verification).  
    - Invariantism resembles **theoretical material strength** (a fixed property), while pragmatic encroachment reflects **applied design rules** (context-dependent margins).  
  - **No Counterpart**:  
    - The concept of **propositional knowledge** ("S knows that p") has no direct analog. Engineering uses **verified requirements compliance**. No spec uses "know"; it uses "demonstrated", "validated", or "verified to [specified criteria]".  
    - The *psychological state* of knowledge (e.g., "Do we *know* the bank is open?") doesn’t map. Engineering decisions are **risk-driven**, not belief-driven.  

  ---

  **Residue Report & Analysis**  
  1. **Cleanly Mapped Elements**  
     - Stakes → **Criticality Classification** (e.g., DAL-A vs. DAL-C in DO-178C). Higher stakes demand stricter verification, mirroring pragmatic encroachment’s raised knowledge threshold.  
     - Evidence invariance → **Identical test data** assessed against different confidence bounds based on application.  

  2. **Distorted Translations**  
     - *Knowledge attribution* → **Certification judgment**. Philosophers focus on whether *belief* constitutes knowledge; engineers decide if **evidence meets predefined criteria**. Distortion arises because engineering replaces epistemic states with procedural outcomes.  
     - *Invariantism* → **Theoretical vs. Applied factors**. A physicist might say yield strength is invariant (invariantism), but a designer adds margins for uncertainty (pragmatism).  

  3. **No Counterpart**  
     - The **ordinary-language concept of "knows"** itself. Requirements documents exclude subjective verbs—specifying **quantifiable thresholds** instead (e.g., "reliability ≥ 0.999 at 90% confidence").  
     - Debates about **epistemic justification** under uncertainty. Engineers model uncertainty via **probability distributions** and **sensitivity analyses**; they don’t ask "Do we *know*?" but "What’s the **predicted failure rate**?"  

  ---

  **The Gap: Engineering Pragmatism vs. Philosophical Abstraction**  
  Your hunch is correct: stakes *do* enter through confidence levels and margins. But the residue reveals a fundamental disconnect:  
  - **Engineers avoid epistemic vagueness** by operationalizing "knowledge" as **verified compliance**. There’s no need for "knows" in specs because:  
    > *"Test like you fly" quantifies as test profiles; "redundant load paths" are modeled; "confidence bounds" are calculated.*  
  - **Philosophers wrestle with linguistic ambiguity** that engineering methodologies dissolve. The debate exists because "knows" in ordinary language carries contextual weight, while engineering specifies context *as part of the requirement*.  

  **My View**: This is **both** a gap in engineering vocabulary *and* a sign that philosophers are debating a fuzzy linguistic artifact.  
  - **Engineering Gap**: While robust against subjectivity, engineering lacks a framework to discuss *how evidence justifies belief* (vs. compliance). When an engineer says, "We don’t *know* if it’ll hold under rare-event loads," they mean *"We lack sufficient data to model below 10⁻⁶ probability."*  
  - **Philosophical Artifact**: Pragmatic encroachment exposes how "knows" behaves in everyday language, but this ambiguity is **deliberately engineered out** of technical contexts. No regulator asks, "Do you *know* it’s safe?" They demand: *"Show compliance to 14 CFR §25.1309."*  

  **Conclusion**: Pragmatic encroachment maps cleanly onto **how stakes drive verification rigor** in aerospace. The unmapped residue is philosophy’s focus on the *linguistic behavior of "knows"*—a concept engineers render obsolete by working in quantified, context-specified requirements. Your world replaces epistemology with **risk matrices, margins, and statistics**, making the debate irrelevant to practice but highlighting how technical domains suppress linguistic ambiguity.
