prompt: |-
  I'm a reliability engineer in aerospace — my daily vocabulary is stuff like proof loads, factor-of-safety margins, confidence bounds on failure-rate estimates, "test like you fly", redundant load paths, acceptance criteria. Philosophers apparently have this fight called pragmatic encroachment: whether what's at stake changes whether you *know* something — you can know the bank is open on a lazy tuesday, but not when everything rides on getting there before it closes, even though the evidence is identical. Translate that whole debate, including the invariantists who say knowledge doesn't care about stakes, into my vocabulary as faithfully as you can. Then the residue report: what maps cleanly (my hunch is stakes enter my world through which confidence level we demand before certifying a part, but tell me if that's actually the same phenomenon or just similar-looking), what only translates with distortion, and what has no counterpart in my vocabulary at all. And for the residue, give me your view: is it a gap in the engineering vocabulary, or a sign the philosophers are arguing about something that only exists because "knows" is a fuzzy ordinary-language word that no spec writer would ever put in a requirements document?
