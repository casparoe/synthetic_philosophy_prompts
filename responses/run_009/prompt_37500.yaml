  Another option is to argue the spheres aren't indiscernible because their distance relation individuates them. But this requires relations to be qualitative and non-symmetric. In Black's setup, all relations are symmetric, so this might not work. If the user introduces asymmetric relations, it could solve the problem but might require additional metaphysical commitments.

