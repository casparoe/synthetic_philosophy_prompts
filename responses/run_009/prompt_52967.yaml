answer: |-
  ## The Man in Slices

  Dr. Anya Sharma’s world was built of layers. Her days at MetroGen Radiology were spent coaxing meaning from stacks of grayscale MRI slices – sagittal, axial, coronal – weaving them into intricate 3D reconstructions for surgeons. She wasn't healing; she was mapping. Translating the body’s hidden geography into something tangible. Precision was her language: each voxel a coordinate, each scan a frozen moment in cellular time.

  At home, another longitudinal study occupied her Sundays. For eleven years, since her mother’s death, Anya had documented her father, Rohan. Not just photographs, though there were thousands: sharp, black-and-white portraits against the same sunlit living room wall. But also recordings. Interviews. Questions about his childhood in Delhi, his abandoned physics PhD, his regrets, his joys. A meticulous archive of a man.

  Then, the stroke. A clot detonated in his left parietal lobe. The vibrant, argumentative professor – the man who could dissect Einstein’s thought experiments over breakfast and recite Urdu poetry at dinner – vanished. In his place sat a quiet figure. His right hand lay curled in his lap. His words were sparse, deliberate, often trailing into silence. The sharp, questioning eyes were now pools of weary confusion. He recognized Anya, but the *him* that animated the recognition felt… hollowed out.

  Anya kept documenting. But her method changed. Pre-stroke, her photographs sought the *whole* Rohan – the spark in the eye, the set of the jaw, the complex personhood radiating from a single frame. Post-stroke, her camera became an MRI scanner. She took sequences: five, ten, fifteen shots in rapid succession, slightly shifting angles. She recorded his fragmented speech, his pauses, the tremor in his left hand – not as expressions of a core self, but as discrete data points.

  Her partner, Leo, a furniture restorer who believed in the integrity of the whole, noticed. "Anya," he said one Sunday, watching her methodically catalogue the latest sequence, "you're treating him like one of your scans. A collection of parts."

  "He *is* parts, Leo," she replied, not looking up. "Parts across time. The man who argued relativity over chai? He exists in those tapes. The man who can barely find the word for 'spoon'? That’s a different temporal slice. You can't stitch them together into one coherent whole anymore. The continuity is broken."

  "But he *is* the same person!" Leo insisted, frustration edging his voice. He gestured towards Rohan, who was slowly, painstakingly feeding himself yogurt, a bead of it clinging to his chin. "That’s Rohan Sharma. Changed, yes. Damaged, yes. But still him. His body. His history. *Him*."

  Anya finally looked at Leo. "How? How can one thing *be* both loquacious and taciturn? How can it simultaneously know quantum mechanics and struggle with 'spoon'? Those aren't compatible properties. Unless," she tapped her laptop screen displaying a grid of that day’s photos, "they belong to different temporal segments. Rohan-Pre-Stroke. Rohan-Post-Stroke. Separate entities bound by cause and effect, but not by a single, persisting essence."

  "It’s called change, Anya. People change. Gradually, usually. This was sudden, brutal. But the *self* persists through change. Otherwise, what are you grieving? Who are you visiting?"

  "I’m documenting the stages," Anya said, her voice flat. "Like geological strata. Or," she pointed to her work bag, "like MRI slices. There’s no single 'present' frame where the whole Rohan exists. Not before, not now. Even pre-stroke, he was a sequence. Sunday-Rohan-2013 wasn't Sunday-Rohan-2022. They were contiguous, similar stages. Now? It’s a discontinuity." She remembered her father’s old, dog-eared copy of Einstein’s essays, the passages on relativity underlined: *the distinction between past, present, and future is only a stubbornly persistent illusion*. Her software showed it; time was just another dimension to slice.

  Leo tried a different tack. He brought over an old photo album, pre-stroke. "Look. Here he is teaching you chess. Here he’s laughing at that awful joke I told. Here he’s yelling at the news. That *vitality*… it’s the same source."

  Anya saw the photos, but her mind parsed them into sequences. The chess lesson wasn't a single moment; it was the sequence: concentration, frustration, triumph, defeat – distinct stages flickering across his face. The laughter wasn't one state; it was the build, the peak, the subsidence. "It’s a filmstrip, Leo. You're seeing the illusion of persistence because the frames are close together. But each frame is separate. The stroke… it just jammed the projector. We’re seeing a different reel now."

  Their arguments echoed in the sterile Sundays. Leo would try to engage Rohan with old photos, prompting memories. "Remember this, Dad? The Taj Mahal? You said the light at dawn made the marble weep?" Rohan would stare, sometimes mumble a word, his eyes clouded with the effort of navigating a ruined internal landscape. Leo saw flickers of the old man, proof of continuity. Anya saw isolated neural firings, echoes in a cavern.

  One Sunday, Leo set up his own camera. Not Anya’s rapid-fire sequence, but a tripod, a single frame. He wanted a portrait. "A whole one, Anya. Now. Him, as he is."

  Anya watched, her professional eye dissecting the scene. The afternoon light cut across Rohan’s face, illuminating the deep grooves etched by the stroke on one side, leaving the other in shadow. Leo coaxed, adjusted, waited for a moment that felt "right," that felt like *him*.

  Rohan looked up, his gaze drifting past the lens, unfocused. A faint, involuntary tremor touched his lip.

  Leo clicked the shutter. "There," he said softly, with forced conviction. "That’s him."

  Anya walked over to the camera’s preview screen. The image was technically proficient. It showed a frail man in a wheelchair, bathed in chiaroscuro light, an expression of profound, weary vacancy. To Leo, it captured Rohan's current reality, the man enduring.

  To Anya, it was worse than her sequences. It was a lie. It presented this single, fractured moment – this thin slice of *now* – as the whole man. But the man who loved physics, who argued fiercely, who comforted her when her mother died… that man wasn’t present in this frame. He wasn't present in *any* single frame. He was distributed across time, a constellation of stages, some brilliant, some dim, this current one a dim, fading point. Claiming this image as "Rohan" felt like calling a single MRI slice "the liver." It was a partial truth mistaken for the whole.

  Later, in her study, Anya pulled up the archive. Side-by-side monitors: on the left, a contact sheet of rapid-sequence shots from that day, Rohan’s face shifting subtly like dunes in a slow wind. On the right, Leo’s single portrait, stark and still.

  She thought of the MRI software, how it rendered a pulsating heart not as one object, but as a series of static slices stacked in time, their collective motion creating the illusion of a beating whole. Was Leo’s "enduring self" just such an illusion? A cognitive trick stitching together temporal stages?

  She opened the folder labeled 'Rohan_Pre'. A video clip auto-played: her father, vibrant, gesturing wildly, explaining why simultaneity was relative, why two events seen as happening at the same time from one perspective could be sequential from another. *There is no universal 'now', Anya,* his younger voice insisted from the screen. *Only 'here-now' for each observer.*

  The man on the screen, the man in the wheelchair, the man in the thousands of photos and hours of audio – were they the same? Leo’s heart said yes, bound by love and memory. Anya’s meticulously trained perception said they were a timeline, a sequence of adjacent but distinct entities, linked by biology and narrative, but not by an unchanging core. The laughing man and the silent man could not occupy the same ontological frame; the contradiction was too vast. Only by separating them in time – by *perduring* – could they both be real.

  She minimized Leo’s portrait. It felt like a monument to an illusion. On the other monitor, she zoomed in on one of her sequential shots, a moment where Rohan’s post-stroke face seemed, for a fraction of a second, to hold a ghost of his old, quizzical expression. Not the man, she thought. An echo. A temporal artifact.

  She saved the sequence. Labeled it meticulously: *Subject_Rohan.Stage_PostCVA.Sequence_47.2024-06-02*. She didn’t add it to the main archive yet. It sat alone, a new, grim stack of slices waiting to be understood. The work of mapping the aftermath had only just begun, and the territory was one of profound, irreconcilable loss – the loss not just of a father, but of the very idea that he had ever been a single, continuous thing to lose. She grieved the stages, each one, separately. Especially the silent one in the next room, who was, and was not, her father.
