prompt: |-
  I sit on the grantmaking panel of a mid-sized foundation that funds work on reducing long-term technological risks. At our next meeting we must decide on a proposal requesting a substantial three-year grant for public advocacy on preventing worst-case outcomes from advanced AI. What divides the panel is not the cause but the centerpiece argument of the applicants' outreach materials. They present their case as an explicit wager: whatever the probability of catastrophe — even absurdly small — the loss if it occurs is effectively unbounded, so expected-value reasoning obliges any rational agent to support the work, and weighing the grant against other philanthropic uses of the money is simply irrational. One panelist finds this airtight. A second says it is precisely the reasoning by which a street mugger persuades you to hand over your wallet on the strength of an unverifiable but enormous threat, and that endorsing it would license every future applicant to substitute imaginativeness about magnitude for evidence about likelihood. A third raises a further wrinkle: rival organizations describe different catastrophes with mutually incompatible remedies, each claiming the same dominance over all other considerations, so the argument seems to support anything whatever and therefore nothing in particular. Draft the decision memo I will circulate before the meeting. It should recommend a concrete funding decision, with any conditions you think warranted stated specifically enough to be written into a grant agreement, and its reasoning should be framed so the full panel can act on it. In the course of the memo, assess the wager-style argument itself: whether a tiny probability times an unbounded loss really swamps every other consideration, which assumptions about decision theory, about the value at stake, and about the fungibility of money would have to hold for that to be true, and what exactly distinguishes the applicants' reasoning from ordinary catastrophic-risk insurance, which the foundation already funds without controversy. Treat the strongest version of the losing side's position seriously enough that a panelist who holds it could sign the memo.
reasoning: |-
  Okay, the user is part of a grantmaking panel for a foundation focused on reducing long-term technological risks. They need to draft a decision memo about a proposal for public advocacy on preventing worst-case AI outcomes. The main point of contention is the applicants' "wager" argument: that even a tiny probability of an unbounded loss should compel funding, making other comparisons irrational. Panelists are divided—one finds it airtight, another compares it to a mugger's threat, and a third points out that competing groups make similar claims with incompatible solutions.

  First, I need to address the core argument. The wager-style reasoning is based on expected value theory. If the loss is truly infinite, any non-zero probability would make the expected value infinite, dominating other considerations. But is the loss actually infinite? Human extinction might be near-infinite in value loss, but it's debatable. Also, probabilities aren't zero but could be so small that even large stakes don't automatically outweigh other needs. Plus, there's the issue of rival claims—every group could use the same argument, leading to unresolvable conflicts.

  The foundation already funds catastrophic-risk insurance without controversy. So, what's different here? Insurance usually involves measurable probabilities and mitigates specific risks, while this advocacy work is broader and harder to quantify. The applicants' approach might be seen as marketing rhetoric, which risks undermining credibility if the probabilities are perceived as implausible.

  The user needs a memo that recommends a concrete decision with conditions. The panel must act on it, so the reasoning has to be balanced. Maybe suggest funding but with conditions that address the panel's concerns. For example, require evidence-based probability assessments, focus on concrete actions, and avoid the wager argument in public materials. Also, emphasize comparative analysis with other risks to prevent the "anything goes" problem.

  The memo should validate each panelist's view. Acknowledge the logical strength of the wager but point out its practical shortcomings. Agree that it's not like a mugger's threat because the threat is plausible, but stress the need for credible probability assessments. Address the rivalry issue by requiring the grantee to engage with other groups and demonstrate why their approach is more effective.

  Also, consider the foundation's goals. They fund long-term tech risks, so this proposal fits their mission. But they need to ensure responsible use of funds. Conditions on the grant could include avoiding absolutist claims, collaborating with other researchers, and providing measurable outcomes.

  Finally, the decision should be a conditional grant. This way, the foundation supports the work without endorsing the problematic argument. The conditions will mitigate risks and align the project with evidence-based approaches. This should satisfy all panelists by addressing their concerns while moving forward with funding.
answer: |-
  ## Decision Memo: AI Catastrophe Advocacy Proposal

  **To:** Grantmaking Panel, Technological Risk Mitigation Foundation  
  **From:** [Your Name/Chair]  
  **Date:** October 26, 2023  
  **Subject:** Recommendation on Funding Request: "Safeguard Horizon" Public Advocacy Campaign  

  ### I. Proposal Summary
  Applicant "Safeguard Horizon" requests $2.5M over three years for a public advocacy campaign focused on raising awareness and driving policy action to prevent worst-case outcomes (including human extinction) from advanced AI. The core of their outreach strategy hinges on an explicit "wager" argument: that due to the potentially unbounded loss of human extinction, *any* non-zero probability of catastrophe demands absolute priority in resource allocation, rendering comparative cost-benefit analysis irrational.

  ### II. Panel Divisions (Noted for Deliberation)
  The panel agrees on the significance of mitigating catastrophic AI risks. Division centers *solely* on the applicants' chosen centerpiece argument:
  1.  **Panelist A:** Views the wager argument as logically airtight under expected value (EV) theory.
  2.  **Panelist B:** Compares the argument to coercion via unverifiable threats ("mugger's gambit"), fearing it invites low-evidence, high-magnitude claims.
  3.  **Panelist C:** Highlights the proliferation of rival groups ("Pascal's Scissors") using identical logic for mutually exclusive catastrophes/remedies, rendering the argument non-actionable.

  ### III. Assessment of the Wager-Style Argument
  The memo acknowledges the logical force of the argument under specific, idealized conditions but identifies critical limitations for practical decision-making:

  1.  **Theoretical Core:**  
      *   **Premise:** Loss Magnitude (L) is truly infinite/unbounded (e.g., value of all future human potential lost).  
      *   **Premise:** Probability (P) is non-zero (however small).  
      *   **Conclusion:** Expected Loss (EV = P * L) is infinite/unbounded, dominating any finite cost/benefit calculation involving other philanthropic opportunities.  

  2.  **Critical Assumptions & Limitations:**  
      *   **Truly Unbounded Loss?** While human extinction is arguably a near-infinite loss, this assumes a specific, totalizing view of value (e.g., total utilitarianism). It discounts potential recovery, existence of other moral patients, or alternative futures. *Insurance analogy:* We fund catastrophic insurance (e.g., pandemic, asteroid) where L is vast but finite (e.g., millions/billions of lives, trillions in economic loss), not strictly infinite. This allows probabilistic weighing against costs.
      *   **Non-Zero P vs. Meaningful P:** Decision theory requires *reasonable* probability estimates. Extremely low P (e.g., 10^-100) multiplied by near-infinite L yields a mathematically undefined/infinite EV *only if P is treated as a point estimate*. In practice, we deal with *distributions* and epistemic uncertainty. Assigning *any* finite probability estimate, however small, to *any* conceivable catastrophe risks paralyzing all other action (Panelist C's concern). Robust decision-making requires grappling with plausibility and evidence strength.
      *   **Fungibility & Opportunity Cost:** The argument assumes philanthropic dollars are perfectly fungible and this intervention uniquely addresses the infinite risk. This is false. Rivals exist (Panelist C). Funding this grant means *not* funding other AI safety research, bio-risk mitigation, or global health interventions saving lives *now* with high certainty. Ignoring this trade-off is practically irrational, even if theoretically challenged by an infinite EV.
      *   **Distinction from Catastrophic Insurance:** Our uncontroversial insurance grants typically involve:  
          (a) More quantifiable (though uncertain) probabilities and loss magnitudes.  
          (b) Concrete mitigation strategies (e.g., vaccine development, detection networks).  
          (c) Lower susceptibility to "Pascal's Scissors" as the threats/remedies are more defined and less reliant on purely logical dominance arguments. The wager argument substitutes logical extremity for empirical grounding in P and specific remedy efficacy.

  3.  **Mugger's Gambit Parallel:** Panelist B's concern is valid regarding *rhetorical risk*. An argument relying solely on the *possibility* of near-infinite loss, absent credible evidence for non-negligible probability or remedy efficacy, *can* resemble coercion. It risks eroding credibility and public trust if perceived as exploiting fear rather than reasoned analysis. However, unlike a mugger's *unverifiable* threat, AI catastrophe is a *plausible* (even if highly uncertain) scenario backed by expert concern. The distinction lies in grounding the non-zero P in reasoned analysis, not pure imagination.

  4.  **"Pascal's Scissors" Problem:** Panelist C's point is decisive for *practical* grantmaking. If every existential risk group claims their specific catastrophe/remedy pair dominates all others via the same wager logic, and these remedies conflict (e.g., "pause all AI" vs. "rush to build aligned AI first"), the foundation faces paralysis or arbitrariness. The wager argument, alone, provides no basis for choosing *which* specific mitigation strategy to fund. It necessitates additional criteria: plausibility of the threat model, feasibility/effectiveness of the proposed remedy, and tractability of the intervention.

  ### IV. Funding Recommendation: CONDITIONAL APPROVAL ($2.0M over 3 years)

  **Decision:** Approve the grant request *in principle* due to the critical importance of mitigating catastrophic AI risk and the applicant's credible track record in relevant advocacy. **However, funding is contingent on the applicant revising their outreach strategy to de-emphasize the absolutist "wager" argument as the primary public-facing justification and incorporating the following conditions into the grant agreement.**

  #### Conditions for Grant Agreement:
  1.  **Revised Messaging:** The core public advocacy materials must shift emphasis *away* from the pure "any P >0 demands absolute priority" wager. Instead, materials must focus on:
      *   The *plausible mechanisms* by which advanced AI could lead to catastrophic outcomes (e.g., loss of control, misuse, destabilization), citing relevant research.
      *   The *potential magnitude* of impacts based on reasoned scenarios (e.g., disruption comparable to pandemics/war, potential for permanent loss of human agency or extinction), avoiding *sole* reliance on "infinite loss" rhetoric.
      *   The *specific policy or behavioral changes* the campaign seeks to achieve and *why* they are likely effective mitigations.
      *   *Permitted:* The wager logic can be included as *one* perspective in backgrounders or academic discussions, but *not* as the headline or dominant call-to-action frame.
  2.  **Probability & Uncertainty Framing:** Outreach must transparently acknowledge the significant uncertainty in probability estimates and avoid implying certainty or demanding action *solely* based on logical dominance. Messaging should reflect a spectrum of expert views on likelihood.
  3.  **Comparative Risk Analysis (Internal):** Grantee must provide the Foundation, as part of bi-annual reporting, a brief analysis contextualizing their work within the broader catastrophic risk landscape. This should include:
      *   Acknowledgment of other significant existential/catastrophic risks (e.g., engineered pandemics, nuclear war, climate tipping points).
      *   A rationale, based on factors like tractability, neglectedness, and leverage, for why resources directed towards AI catastrophe advocacy are justified *relative* to other potential uses, even within the catastrophic risk portfolio. (This addresses Panelist B & C concerns re: fungibility and "Pascal's Scissors").
  4.  **Collaboration & Rivalry:** Grantee must demonstrate good-faith efforts to engage with relevant stakeholders, including organizations working on differing but related AI risk mitigation strategies, to identify areas of potential coordination or shared objectives. (Addresses Panelist C's concern about mutually exclusive claims).
  5.  **Grant Amount:** Reduce to $2.0M. The reduced amount reflects the need for modified strategy development and maintains appropriate scale relative to other Foundation commitments. Funds are released in tranches contingent on satisfactory progress reports addressing the above conditions.

  ### V. Reasoning for Conditional Approval
  *   **Mission Alignment:** Preventing catastrophic AI outcomes is core to our mandate. Public advocacy is a legitimate and potentially high-leverage strategy.
  *   **Applicant Merit:** "Safeguard Horizon" possesses relevant expertise and a viable plan for outreach, *if* the messaging is adjusted.
  *   **Addressing Panel Concerns:** This approach directly tackles the core objections:
      *   It avoids endorsing the "wager" as a sufficient and standalone rationale for funding decisions (Satisfies Panelists B & C).
      *   It requires evidence-based framing of risk mechanisms and magnitudes, moving beyond pure logical abstraction (Satisfies Panelist B re: evidence).
      *   It explicitly requires comparative justification within our risk portfolio, acknowledging opportunity cost (Satisfies Panelists B & C).
      *   It mandates engagement to mitigate the "Pascal's Scissors" problem (Satisfies Panelist C).
      *   It acknowledges the profound stakes highlighted by Panelist A, while channeling the argument into a more robust and actionable framework.
  *   **Preserving Rigor & Credibility:** Conditioning funding on evidence-based, comparative, and collaborative approaches upholds the Foundation's commitment to rigorous decision-making and responsible stewardship, preventing the slippery slope feared by Panelist B.
  *   **Distinction from Insurance:** Unlike pure insurance (focused on specific, measurable contingencies), this advocacy aims to *prevent* the risk from materializing at scale. Its value lies in shaping the trajectory of development, justifying a different approach, but one still requiring plausible grounding.

  ### VI. Proposed Panel Action
  Approve the grant to "Safeguard Horizon" for $2.0M over three years, **subject to the specific conditions outlined in Section IV.** The Program Officer will negotiate these conditions into the grant agreement prior to disbursement. Failure to meet reporting requirements or adhere to the revised messaging framework will result in suspension of subsequent funding tranches.

  ---

  **This memo provides a path forward that respects the logical concerns underlying the wager argument while grounding our funding decision in the practical realities of evidence, comparative impact, and responsible grantmaking. It allows us to support vital work on AI catastrophe prevention without endorsing a decision rule vulnerable to paralyzing abstractions or misuse.**
