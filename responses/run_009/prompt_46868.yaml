prompt: |-
  I'm a software engineer at a mid-sized company, and I've been asked to give our leadership team a realistic estimate for how long it will take to migrate our ageing monolith to a service-oriented architecture. The trouble is that two people whose judgement I respect have given me figures that point in opposite directions. Our CTO keeps citing an industry study he read years ago claiming that roughly two-thirds of large IT modernisation projects run badly over budget or get abandoned altogether, so he wants us to plan as though we're one of the unlucky ones. My team lead, on the other hand, points out that of the four comparable migrations our company has attempted over the past decade, three finished close to schedule and one was cancelled — and that those four share our codebase, our staffing constraints, and our management culture in a way no industry-wide study ever could. My own instinct is that the team lead's numbers are too few to trust and the CTO's are too generic to apply to us at all, but I can't articulate why without hand-waving, and I'll have to defend whichever figure I put in front of the board.

  For context: the project is genuinely large (an estimated eighteen months of work), our company has a decent but not stellar record of finishing what it starts, and the industry study apparently lumped together everything from banks rewriting core systems to retailers replacing e-commerce platforms. I took a statistics course at university, so I'm comfortable with the idea of a sample and a population; what I can't work out is what the right population even is here, and whether there's any principled way to decide rather than just picking the grouping that suits the answer I already want. A friend of mine suggested the whole question is undecidable and I should just present both figures and let the board choose, but that feels like an abdication.

  So: please give me exactly five numbered points, each a sentence or two, with no introduction or conclusion. And I'd like you to actually commit — each point should stake out a definite claim or recommendation, not a balanced survey of options. In particular, take a clear position on which evidence should carry more weight and why, tell me whether my instinct to distrust both figures is sound or just timidity dressed up as rigour, and if you think my friend's "present both and let them choose" suggestion is the honest answer, say so plainly and explain what I'd be refusing to take responsibility for.
reasoning: |-
  Okay, the user is a software engineer facing a tough situation. They need to estimate a migration timeline for their monolith to SOA, but they're caught between two conflicting sources. The CTO cites an industry study showing high failure rates, while the team lead points to internal data from four past migrations with mostly positive outcomes. 

  Hmm, the user's dilemma is deeper than just picking numbers—they're wrestling with how to weigh different types of evidence. Their stats background makes them wary of both approaches: the industry data feels too broad, and the internal cases seem too few. That's smart skepticism. 

  The core tension here is between external generalization and internal specificity. The CTO's study has statistical weight but ignores company context, while the team lead's examples are hyper-relevant but lack sample size rigor. The user's instinct that both are flawed is actually spot-on—it's not timidity, it's valid critical thinking. 

  For recommendations... First, the internal data must take priority because shared context (codebase, culture, constraints) directly impacts outcomes. Second, the team lead's track record suggests above-average execution ability—so the industry's "two-thirds failure" baseline likely doesn't apply. Third, the user should explicitly reject the CTO's framing; that study is useful for risk awareness but not for planning. 

  Fourth, presenting both options to the board would be irresponsible because it avoids making an evidence-based judgment call—exactly what they're paid to do. And fifth? Own the recommendation: propose 18-24 months with phased checkpoints, using the internal successes as the foundation but building in buffers because migrations are inherently messy. 

  ...Wait, the user asked for five definite claims without intros/conclusions. Got it—strip all fluff. Be direct: prioritize internal data, reject generic stats, call out the friend's suggestion as cowardice, etc. No hedging.
answer: |-
  1.  Prioritize your team lead's internal data: While statistically limited (n=4), these projects share the *critical specific context* of your company's codebase, team capabilities, and management culture, making them far more predictive than generic industry averages which mask crucial variables.
  2.  Reject the CTO's generic industry study as the primary planning basis: Lumping diverse projects (banks, retailers) ignores your company's unique context and proven (albeit limited) track record of *above-average* delivery success, rendering it irrelevant for *your* realistic estimate.
  3.  Your instinct to distrust *both* figures is sound rigor, not timidity: Recognizing the limitations of small internal samples *and* overly broad external averages demonstrates critical thinking; the solution isn't to pick one blindly but to synthesize cautiously, leaning towards the more relevant internal data.
  4.  Presenting both figures to the board without a clear recommendation *is* an abdication: It avoids your responsibility as the informed engineer to synthesize the evidence and provide the best possible estimate, forcing non-technical leaders to make a technical judgment they are ill-equipped for.
  5.  Recommend an estimate based on the internal track record (e.g., 18-24 months with phased milestones), explicitly acknowledging its sample size limitation but emphasizing its superior relevance, while using the CTO's study only to justify robust risk buffers and contingency planning within *your* proposed timeline.
