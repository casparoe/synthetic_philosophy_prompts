answer: |-
  Here’s a sharpened list of desiderata for your reading group, designed to expose tensions and enforce rigor on anatta-compatible accounts of persons, with explicit conflict flags and a commitment:

  ### Core Desiderata (What an Account MUST Deliver)
  1. **Psychological Continuity Without a Seat:**  
     Explain memory, anticipation, and intention-formation *without* a persisting subject or "owner" of mental states. How does "I remember X" cohere if there’s no "I" that endured from the experience to the recall?

  2. **Social Practice Viability:**  
     Ground ordinary practices (promising, moral responsibility, grudges, personal love) *without* relying on a metaphysically stable self. How can Person A at T1 be held accountable for Person B at T2 if no underlying "self" connects them?

  3. **Rebirth Coherence (Minimal):**  
     Provide a *determinate* account of what links lifetimes (if your tradition affirms rebirth). What carries karmic imprints or conditions rebirth? It cannot be a self, soul, or irreducible essence. Vagueness (e.g., "energy") fails.

  4. **Puzzle Case Resolution:**  
     Address Western thought experiments (e.g., teletransportation, fission/fusion cases) explicitly. Does "you" emerge from the replicator? Why/why not? The answer must derive from the account’s core principles, not ad-hoc assumptions.

  5. **No-Smuggling Requirement (The Costume Test):**  
     **CRITICAL:** The proposed unifying factor (e.g., "stream," "causal series," "psychophysical continuum") must not functionally replicate a self by:  
     - Providing *unexplained unity* (e.g., assuming the "stream" is intrinsically one thing).  
     - Acting as a *hidden subject* (e.g., the "stream" as the experiencer/agent).  
     - Introducing *indivisibility or simplicity* where there is none.  
     *(This targets your suspicion directly: The replacement must be decomposable, impersonal, and lack any self-like cohesion.)*

  ### Flagged Conflicts (Likely Unsatisfiable Pairs)
  *   **Social Practice Viability vs. No-Smuggling:** Social practices (especially blame/promise) seem to demand *robust diachronic identity*. Any account providing this risks smuggling in a stable entity (e.g., a "narrative self" or overly cohesive "stream") that violates No-Smuggling. Can responsibility truly be grounded in sheer causal dependency without *some* notion of ownership creeping in?
  *   **Rebirth Coherence vs. Psychological Continuity (under No-Smuggling):** What links lifetimes often seems discontinuous or non-psychological (e.g., karmic seeds). Can the *same* account that explains mundane psychological continuity (within a life) via impersonal processes also explain alleged continuity *across* biological death without introducing a new principle (smuggling)?

  ### The Commitment: What I'd Drop & Why
  If forced to drop one desideratum to achieve coherence under anatta, **I would drop "Rebirth Coherence (Minimal)" as traditionally construed.** Here’s why:

  1.  **Epistemic Priority:** Grounding *this-life* phenomena (psychology, social practices) without a self is the immediate, verifiable challenge. Rebirth narratives are tradition-specific, empirically inaccessible, and vary significantly across Buddhist schools. An account excelling at 1, 2, 4, and 5 is already revolutionary.
  2.  **Smuggling Risk:** Rebirth explanations are the *most* susceptible to smuggling. "Subtle consciousness," "mental continuum," or "karmic energy" often become de facto selves precisely because bridging biological death requires immense explanatory weight. Dropping this frees the account to be ruthlessly reductionist about *this-life* continuity without needing to solve the harder (perhaps intractable) rebirth puzzle.
  3.  **Focus on Core Anatta:** The radical impact of anatta is felt in deconstructing the *present, felt sense of self*. Ensuring Psychological Continuity, Social Practice Viability, Puzzle Resolution, and No-Smuggling *within one lifetime* delivers that impact powerfully. Rebirth can remain a separate, perhaps metaphorical or unresolved, question without undermining the core project.

  **In essence:** A theory that brilliantly explains how memory, responsibility, and teletransportation work *right now* without a shred of selfhood – and passes the Costume Test – is a monumental achievement, even if it remains silent or agnostic on the precise mechanics of rebirth. Prioritizing the phenomenologically accessible over the metaphysically speculative strengthens the reductionist project against the ever-present danger of smuggling. The burden then shifts to rebirth proponents to show how their specific mechanism *doesn't* violate No-Smuggling, rather than forcing the core account to compromise.
