prompt: |-
  My East Asian philosophy prof ended a lecture on the School of Names with "a white horse is not a horse" (the Gongsun Long line) and used it to conclude that these thinkers were basically pre-postmodernists: language can't carve anything at its joints, so every category is arbitrary and kind of contradicts itself. That felt like the slogan was doing a lot more work than it can actually carry, but I couldn't say why. Can you lay out a menu of the distinct precise claims "a white horse is not a horse" could be standing for — trivially true ones (like: the term "white horse" isn't the term "horse", or the class of white horses isn't identical to the class of horses), substantive and defensible ones, and straight up false ones — and for each say which is which? Then tell me which reading, if any, would actually support the "language can't categorize reality" conclusion my prof wanted from it. I want something I can bring to section without sounding like I'm just defending common sense.
