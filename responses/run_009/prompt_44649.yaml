prompt: |-
  I'm a graduate student in an axiomatic bargaining theory reading group, working through Kalai and Smorodinsky's 1975 Econometrica paper in which they propose their solution as an alternative to Nash's, and I've been ambushed by an argument from the economist in our group that appears to prove far more than he intends. The setup, which I take to be standard: a two-person bargaining problem is a pair (S, d), where S is a closed convex set of feasible utility vectors and d is the disagreement point; a solution picks a point of S. Kalai and Smorodinsky characterize their solution by four axioms — Pareto optimality, symmetry, invariance under independent positive affine transformations of each player's utility scale, and individual monotonicity, which says that if one player's prospects improve across the board while the other's best attainable payoff is unchanged, the improved player's assigned payoff may not fall. Geometrically, their solution is where the segment from d to the utopia point m (the point collecting each player's best attainable payoff) crosses the Pareto frontier, so each player ends up with the same fraction t of her maximal gain above the disagreement point.

  Now the ambush, with his steps numbered as he gave them:

  (1) Affine invariance is the official statement that utility here is only cardinal: facts about a single player's own utilities and their ratios are all that carry information, and no comparison between player 1's utilities and player 2's means anything. (2) But the symmetry axiom presupposes exactly such a comparison: whether a problem "is" symmetric depends on the arbitrary units we happened to choose, since rescaling one player's utilities by any positive factor destroys the apparent symmetry while leaving the underlying situation — the preferences, the outcomes — untouched. Concretely: two players with d = (0,0) and the quarter-disc S = {(x, y) : x² + y² ≤ 1, x, y ≥ 0} look perfectly symmetric, and the solution lands at (1/√2, 1/√2); replace player 2's utility scale by v = 1000u and the very same situation is now represented by a lopsided ellipse on which the symmetry axiom is silent. (3) The Kalai–Smorodinsky construction makes the same illicit presupposition: to pronounce that player 1 has covered the same fraction of the distance from disagreement to utopia as player 2 is to measure how far each is along her own scale and judge the two distances equal — an interpersonal comparison of utility if ever there was one. (4) So either these cross-person comparisons are meaningful, in which case affine invariance was never a good gloss on what utility is and the axioms misdescribe their own subject matter, or they are meaningless, in which case symmetry and the proportional-gains construction are ill-posed. (5) Either way, the entire axiomatic approach — Nash's solution no less than Kalai and Smorodinsky's — presupposes an interpersonal welfare scale it officially forbids, and is normatively empty until we bite the comparability bullet.

  I can't accept (5); it seems to prove too much — by parity of reasoning, it would be meaningless to say that two investors' portfolios returned the same percentage, or that two marathoners had each completed the same fraction of the race. And yet each step looked defensible to me when he delivered it, and I have a nagging feeling the slip is somewhere between (1) and (3) without my being able to name it. You are a formal decision theorist with a serious sideline in measurement theory and the philosophy of economics. Before committing to an answer, brainstorm the possible readings of (1): what exactly does affine invariance declare meaningless — utility levels? differences? everything built from utilities? — since several diagnoses of the argument will turn on which reading the premises need. Then tell me which single step you reject, precisely what kind of error it commits (an equivocation? a scope shift in what "meaningless" quantifies over? a confusion between a comparison and a comparison's invariance under rescaling?), why that step looked fine at first sight, and what rejecting it costs. Finally, assess the residue: does any part of my friend's worry survive the diagnosis — for instance, worries about the choice of the utopia point as one's benchmark, or about what it takes for a problem to be genuinely symmetric rather than merely presented that way — and if so, what should a defender of axiomatic bargaining concede about it?
reasoning: |-
  We are given a graduate student's dilemma regarding an argument about the Kalai-Smorodinsky bargaining solution. The core of the argument is that affine invariance (which is taken to imply that utility is only cardinal and that interpersonal comparisons are meaningless) is in conflict with the symmetry axiom and the proportional gains construction, because these seem to require interpersonal comparisons.

  The student's friend's argument is structured as follows:

  (1) Affine invariance implies that only cardinal information (within each player's utility) is meaningful; no interpersonal comparisons are meaningful.

  (2) The symmetry axiom requires a symmetry that depends on the chosen utility scales. If we rescale one player's utility, the symmetry is broken even though the underlying situation is unchanged. Therefore, symmetry presupposes interpersonal comparisons.

  (3) The Kalai-Smorodinsky construction (which equalizes the fraction of the maximal gain each player achieves) also requires interpersonal comparisons because it compares the fractions across players.

  (4) Therefore, either interpersonal comparisons are meaningful (and affine invariance is not a good gloss) or they are not (and symmetry and the proportional gains construction are ill-posed).

  (5) Thus, the entire axiomatic approach is flawed because it either presupposes interpersonal comparability or is inconsistent.

  We are to diagnose the error in this argument.

  First, let's brainstorm the meaning of affine invariance.

  Affine invariance (or invariance under independent positive affine transformations) for a bargaining solution means that if we transform each player's utility by a positive affine transformation (i.e., multiplying by a positive constant and adding a constant), then the solution should transform accordingly. Specifically, if we have a transformation:

      u1' = a1 * u1 + b1,   a1 > 0
      u2' = a2 * u2 + b2,   a2 > 0

  then the solution for the transformed bargaining problem (S', d') should be the image of the solution for (S, d) under this transformation.

  What does this imply for the meaningfulness of utility?

  - Affine invariance implies that the zero point and the unit of each player's utility scale are arbitrary. Therefore, any property that is not invariant under independent rescalings and shifts of the individual utility scales is not meaningful.

  - In particular, the absolute level of utility (for a single player) is not meaningful because we can shift it arbitrarily (via b_i). The ratio of two utilities for the same player is meaningful only if they are compared in a way that accounts for the scaling? Actually, note that for a single player, ratios of utility differences are invariant to affine transformations (because the affine transformation preserves ratios of intervals). This is the standard cardinal interpretation.

  - However, any comparison between the utility levels of two different players is not invariant. For example, if we say that player 1 gets twice as much utility as player 2, that statement is not invariant: if we rescale player 2's utility by a factor of 2, then the same outcome would be described as player 1 getting the same as player 2.

  Therefore, the standard interpretation of affine invariance is that only intra-personal comparisons of utility differences (i.e., ratios of differences for the same player) are meaningful, and inter-personal comparisons of utility levels or differences are not.

  Now, let's look at the symmetry axiom.

  Symmetry: If the bargaining problem is symmetric (i.e., if (x,y) in S implies (y,x) in S, and d1 = d2), then the solution should give the same utility to each player: f1(S,d) = f2(S,d).

  The issue raised is that the symmetry of the set S depends on the utility representation. If we change the utility scale of one player, then the set S becomes asymmetric. Therefore, the condition of symmetry of the bargaining problem is representation-dependent.

  This is true. However, note that the symmetry axiom is not about the physical symmetry of the underlying outcomes but about the symmetry in the utility space. Therefore, the axiom is defined relative to the given utility representation. But if the underlying situation is symmetric (in the sense that the two players have identical preferences and the set of physical outcomes is symmetric), then we can choose utility representations that are symmetric. In fact, the axiom of affine invariance allows us to choose such a representation. So if the underlying situation is symmetric, we can represent it by a symmetric (S,d). Then the symmetry axiom applies and requires that the solution be symmetric in that representation. Then, by affine invariance, the solution in any other representation will be the affine transformation of that symmetric solution.

  Therefore, the symmetry axiom does not require interpersonal comparisons. It is applied in a particular utility representation. But because we have affine invariance, we can always choose a representation in which the problem is symmetric (if the underlying situation is symmetric). Then the solution must be symmetric in that representation, and then in any other representation it will be the affine image.

  Now, let's turn to the Kalai-Smorodinsky solution. It is defined as the point on the Pareto frontier that is the intersection of the segment from d to the utopia point m, where m_i = max { u_i : (u1,u2) in S, u>=d }.

  The solution is then the point (x1, x2) such that:

      (x1 - d1) / (m1 - d1) = (x2 - d2) / (m2 - d2)

  provided that the segment from d to m intersects the Pareto frontier at a unique point.

  The objection is that this requires comparing the fraction of the maximal gain for player 1 with that for player 2. But note that these fractions are defined for each player separately. The fraction for player 1 is:

      t1 = (x1 - d1) / (m1 - d1)

  and for player 2:

      t2 = (x2 - d2) / (m2 - d2)

  and the solution sets t1 = t2.

  But note that t1 and t2 are dimensionless numbers (ratios). However, are they invariant under affine transformations? Let's check:

  Suppose we transform player 1's utility by u1' = a1*u1 + b1. Then:

      d1' = a1*d1 + b1
      m1' = a1*m1 + b1   (because the max is linear)
      x1' = a1*x1 + b1

  Then:

      (x1' - d1') / (m1' - d1') = [a1*(x1 - d1)] / [a1*(m1 - d1)] = (x1 - d1)/(m1 - d1) = t1.

  Similarly for player 2. Therefore, the fraction t_i is invariant under affine transformations of player i's utility. So t1 and t2 are invariant scalars.

  Now, the solution sets t1 = t2. This condition is invariant under independent affine transformations? Let's see:

  In the transformed problem, we have:

      t1' = t1   (as above)
      t2' = t2

  So if in the original problem we had t1 = t2, then in the transformed problem we have t1' = t2'. Therefore, the condition t1 = t2 is invariant under independent affine transformations.

  This means that the Kalai-Smorodinsky solution is well-defined and does not require interpersonal comparisons of utility. It uses only the ratios (gains relative to the maximal gains) for each player separately and then equates these ratios. The equality of these ratios is a condition that is invariant under the allowed transformations.

  Therefore, step (3) of the argument is incorrect. The proportional gains construction does not require interpersonal comparisons of utility. It requires only the comparison of a ratio for player 1 and a ratio for player 2, and these ratios are invariant under independent affine transformations.

  Moreover, the symmetry axiom does not require interpersonal comparisons in the way the argument suggests. The symmetry axiom is applied in a particular representation. But if the underlying problem is symmetric, then we can choose a representation that is symmetric in the utility space, and then the solution must be symmetric in that representation. Then, in any other representation, it will not be symmetric in the utility space, but that is acceptable because the utility scales are arbitrary.

  Therefore, the error is in step (3). The construction does not require an interpersonal comparison of utility levels or differences. It uses intra-personal ratios (which are invariant) and then sets them equal. The equality of these ratios is a well-defined condition that is invariant under the allowed transformations.

  But why did step (3) look plausible? Because it says that we are "judging the two distances equal". However, note that we are not comparing the absolute distances (which would be an interpersonal comparison) but the relative gains. The relative gains (as fractions) are dimensionless and invariant for each player. Therefore, we can compare them without requiring a common unit of utility.

  Now, what about step (2)? The symmetry axiom is defined for a given representation. But if we change the representation, the problem may become asymmetric. However, the symmetry axiom is not applied to the transformed problem unless it is symmetric in that representation. The axiom only requires that if a problem is symmetric (in the given utility representation), then the solution must be symmetric. It does not require that the underlying situation be symmetric in some absolute sense. Therefore, the axiom is stated relative to the utility representation. This is acceptable because the solution must satisfy the axioms for the given representation. And the affine invariance axiom ensures that the solution is consistent across different representations.

  Therefore, step (2) is not exactly an error, but it misinterprets the scope of the symmetry axiom. The symmetry axiom is a condition on the solution in the given representation. It does not claim that the underlying situation is symmetric. It only says: if in the utility space we have a symmetric set, then the solution must be symmetric. And that is representation-dependent. But that is acceptable because the solution is defined for the given representation.

  However, the argument in step (2) is that the symmetry axiom presupposes interpersonal comparability because without it we cannot define symmetry. But note: the symmetry axiom is defined in the utility space. It is a mathematical condition on the set S and d. It does not require that the utilities be interpersonally comparable. It is just a condition that we impose on the solution for a particular class of bargaining problems (symmetric ones). The fact that we can change the representation and break the symmetry does not invalidate the axiom. It only shows that the class of symmetric problems is representation-dependent. But that is okay because the axioms are stated for the given representation.

  Moreover, if the underlying situation is symmetric (i.e., the two players are identically situated and have identical preferences), then we can choose utility functions that are symmetric (i.e., they assign the same utility to symmetric outcomes). Then the bargaining set will be symmetric. Then the symmetry axiom applies and gives equal utilities. Then, by affine invariance, we can transform to any other utility representation, and in that representation, the solution will be the affine image of the symmetric point. But note that in the new representation, the solution may not be symmetric (i.e., the coordinates may not be equal). But that is because the utility scales are different. However, the outcome is still the same in terms of the underlying physical outcome. Therefore, the symmetry axiom, when applied in the symmetric representation, ensures that the solution is symmetric in that representation, which corresponds to equal treatment in the underlying situation.

  Therefore, the argument in step (2) is not fatal. It correctly notes that symmetry is representation-dependent, but that does not make the axiom require interpersonal comparisons. It is just a condition that we impose in a given representation.

  Now, what about the residue? Are there any worries that survive?

  One worry might be about the choice of the utopia point. The utopia point is defined as the point (m1, m2) where m_i is the maximum utility player i can get when the other player gets at least d_j. But note that this is defined in the utility space. However, if we change player 2's utility scale, then m2 changes. But then the proportional gains adjust accordingly. And as we saw, the fraction t_i is invariant.

  But is the utopia point the right benchmark? This is a normative question. The Kalai-Smorodinsky solution is motivated by the idea of monotonicity: if the set of possibilities expands in a way that improves one player's maximum attainable utility, then that player should not lose. This is a compelling property. But the choice of the utopia point is part of the definition.

  Another worry is about what it takes for a problem to be genuinely symmetric. The defender of the axiomatic approach would say: the problem is symmetric in the underlying physical outcomes and the preferences. Then we choose utility representations that make the bargaining set symmetric. Then the symmetry axiom applies. But we must choose such representations. The axioms do not require that we have a fixed interpersonal comparison. They work in the given representation.

  In conclusion, the core error is in step (3): the proportional gains construction does not require interpersonal comparisons because the ratios t_i are invariant under independent affine transformations and their equality is a condition that is preserved under these transformations.

  Therefore, we reject step (3) and the error is a confusion between an interpersonal comparison of utility levels (which is not invariant) and the comparison of invariant ratios (which is allowed and invariant).

  The residue: There is a legitimate point that the symmetry axiom is representation-dependent. But that is handled by the fact that we can choose representations. Moreover, the Kalai-Smorodinsky solution does not require interpersonal comparisons. However, the choice of the utopia point as the benchmark is a normative choice that might be challenged. But that is a different issue.

  Finally, the student's analogy about the marathoners and the investors is apt: we can say that two marathoners have each completed the same fraction of the race without having to compare their absolute distances run. Similarly, we can say that two investors have the same percentage return without comparing the absolute amounts of money. The fractions are dimensionless and comparable without a common unit.

  So the axiomatic approach does not presuppose interpersonal comparability. It only uses intra-personal ratios and then sets them equal, which is invariant.

  Thus, the argument's conclusion (5) is not established.
answer: |-
  ### Diagnosis of the Argument

  Your friend's argument is a provocative critique of the axiomatic bargaining framework, but it contains a critical error in **step (3)**. Below, I break down the reasoning, identify the flaw, explain why it initially seems plausible, assess the costs of rejecting it, and address residual concerns. The diagnosis hinges on a precise understanding of affine invariance and its implications for meaningful statements in utility theory.

  #### Brainstorming Affine Invariance (Step 1)
  Affine invariance declares that only **intra-personal ratios of utility differences** are meaningful. Concretely:
  - **Meaningful**: For a single player, statements like "outcome A yields twice the utility gain over disagreement as outcome B" are invariant under affine transformations (scaling/shifting utility). This preserves *cardinal* properties within an individual's utility scale.
  - **Meaningless**: 
    - **Absolute utility levels** (e.g., "player 1's utility is 5").
    - **Utility differences** (e.g., "player 1 gains more utility than player 2").
    - **Interpersonal comparisons** of levels, differences, or ratios (e.g., "player 1's gain is equal to player 2's gain" or "player 1's gain fraction equals player 2's gain fraction").
    
  Affine invariance does *not* render all utility-based statements meaningless—only those that are not preserved under independent rescalings. Crucially, it allows **invariant ratios within each player's utility space**, which can be compared *across players* without interpersonal comparability, provided the comparison is of *dimensionless quantities* that are affine-invariant for each player individually.

  #### The Flawed Step: Rejecting Step (3)
  **Step (3) is incorrect.** The Kalai-Smorodinsky proportional-gains construction **does not require interpersonal utility comparisons**. Here's why:
  - The solution equalizes the **fraction of maximal gain** for each player: \( t = \frac{u_1 - d_1}{m_1 - d_1} = \frac{u_2 - d_2}{m_2 - d_2} \), where \(m_i\) is player \(i\)'s maximal feasible utility.
  - Each fraction \( t_i = \frac{u_i - d_i}{m_i - d_i} \) is **invariant under affine transformations** of player \(i\)'s utility. If player \(i\)'s utility is rescaled (\(u_i' = a_i u_i + b_i\)), then:
    \[
    t_i' = \frac{u_i' - d_i'}{m_i' - d_i'} = \frac{a_i(u_i - d_i)}{a_i(m_i - d_i)} = \frac{u_i - d_i}{m_i - d_i} = t_i.
    \]
  - Since \(t_1\) and \(t_2\) are separately invariant, equating them (\(t_1 = t_2\)) is **not an interpersonal comparison of utility**. It is a comparison of *affine-invariant scalars* (dimensionless ratios) that are computed independently for each player. This is analogous to stating that two marathon runners have each completed 50% of their race—no common unit of "distance" or "effort" is needed, only the invariant fraction for each.

  **Error committed**: Step (3) commits an **equivocation between interpersonal utility comparisons and the comparison of invariant ratios**. It conflates:
  - *Type 1 (meaningless)*: Comparing raw utilities (e.g., "player 1's utility gain equals player 2's utility gain"), which is not affine-invariant.
  - *Type 2 (meaningful)*: Comparing affine-invariant ratios *within* each player's utility space (e.g., "both players achieve the same fraction of their maximal possible gain"), which is preserved under affine transformations.

  **Why it seemed plausible**: At first glance, the equality \(t_1 = t_2\) appears to judge player 1's "distance" to utopia against player 2's, suggesting interpersonal comparability. However, the invariance of \(t_i\) under rescaling shows that this "fractional distance" is independent of utility units. The error arises from overlooking that \(t_i\) is a normalized, unit-free measure derived *wholly within* player \(i\)'s cardinal utility space.

  #### Cost of Rejecting Step (3)
  Rejecting step (3) costs nothing in terms of the axioms' consistency. It upholds:
  - **Affine invariance**: The solution depends only on intra-personal cardinal properties.
  - **Symmetry and proportional gains**: These rely on comparisons of invariant ratios, not raw utilities.  
  The Kalai-Smorodinsky solution remains well-defined without interpersonal comparability.

  #### Assessment of Other Steps
  - **Step (1)**: Correct. Affine invariance implies utility is cardinal (only ratios of differences for each player matter), and interpersonal comparisons are meaningless.
  - **Step (2)**: **Partially correct but misleading**. Symmetry *is* representation-dependent: a problem symmetric in one utility scale may not be in another. However, symmetry is not "ill-posed." If the *underlying bargaining situation* is symmetric (players have identical preferences and symmetric feasible sets), affine invariance allows us to *choose* utility scales where \(S\) is symmetric. The symmetry axiom then applies in that representation. The key insight is that symmetry is an axiom about the *mathematical representation* of the problem, not a metaphysical claim about interpersonal welfare. It does not require fixed, universal utility units.
  - **Step (4) and (5)**: **Invalidated**. The core conflict dissolves once step (3) is corrected. Nash's solution (maximizing \((u_1 - d_1)(u_2 - d_2)\)) also uses affine-invariant ratios (differences relative to \(d_i\)) and avoids interpersonal comparisons. The axiomatic approach is not normatively empty.

  #### Residual Worries
  While the argument's conclusion is flawed, two legitimate concerns survive:
  1. **Choice of the utopia point**: 
     - The utopia point \(m_i = \max \{ u_i : (u_1, u_2) \in S, u \geq d \}\) depends on the feasible set \(S\). If \(S\) is not comprehensive or is irregular, \(m_i\) might be sensitive to extreme or non-credible alternatives (e.g., one player's utopia requiring the other to accept near-disagreement). 
     - **Concession**: Defenders should acknowledge that \(m_i\) is a theoretical construct and may not reflect "reasonable" aspirations. Alternatives (e.g., using Nash threats or redefining utopia via Pareto improvements) exist but might violate individual monotonicity.

  2. **Genuine vs. apparent symmetry**:
     - Symmetry in the utility representation does not guarantee symmetry in the underlying problem if utility functions misrepresent preferences (e.g., due to different risk aversion). Affine invariance ensures we can rescale utilities to *make* symmetric problems appear symmetric, but identifying "genuine" symmetry requires that players' *preferences* (not just utilities) are symmetric—a behavioral or normative judgment.
     - **Concession**: Axiomatic solutions assume utility accurately reflects preferences. If utilities are misspecified (e.g., due to biased elicitation), symmetry becomes arbitrary. Defenders should emphasize that symmetry applies only when players have identical bargaining power and preferences, and utilities are consistently scaled.

  ### Conclusion
  The fatal error lies in step (3): the proportional-gains construction uses affine-invariant ratios, not interpersonal utility comparisons. The Kalai-Smorodinsky solution (and axiomatic bargaining generally) does not presuppose forbidden interpersonal comparisons. Affine invariance, symmetry, and monotonicity can coexist. 

  **What to tell your friend**: 
  - "Your step (3) conflates comparing utility levels with comparing affine-invariant ratios. The fraction \(t_i\) is a unit-free measure for each player, so \(t_1 = t_2\) is no more an interpersonal comparison than saying two investors earned the same rate of return. This resolves the contradiction. That said, your point highlights that symmetry is representation-dependent and the utopia point is contestable—these are nuances worth discussing."

  This defense preserves the axiomatic framework while acknowledging subtle dependencies in utility representation. If your group remains unsettled, consider discussing how utility functions are calibrated in experiments (e.g., via monetary payoffs) to ground the symmetry axiom in observable behavior.
