prompt: |-
  I've been reading LessWrong and the EA Forum since the early 2010s, and I now sit on the grant-evaluation panel of a small longtermist-aligned fund. We make roughly thirty funding decisions a year, each involving a few weeks of part-time review by panelists who are smart generalists but not domain experts, and the stakes — by our own lights — are about as high as stakes get. Our recurring problem is that an awful lot of applications bottom out, sooner or later, in the hinge of history hypothesis: the claim that our era is unusually influential relative to the entire future, so that leverage available now will not be available later. Sometimes the applicant says this explicitly, citing the usual longtermist sources; sometimes it does quiet work under the surface, in any intervention whose value depends on locking in gains rather than on compounding them. Panel discussion keeps stalling because we also routinely conflate two claims the blogs have taught me to distinguish: the strong hinge claim that tractability is decreasing from here, so acting now beats acting later all else equal; and the weaker 'time of perils' claim that existential risk is concentrated in a window which, one way or another, will close.

  I'd like a decision procedure the panel can actually run on an application: a fixed order of questions, criteria for what counts as a sufficient answer to each, a point at which the procedure returns 'do not rest this grant on a hinge claim' and hands the decision back to ordinary cost-effectiveness reasoning, and a point at which it concedes the question is one of values or decision-making under deep uncertainty that the panel must vote on, not something a checklist can settle. The procedure should be honest that the empirical core of the hinge hypothesis is not something five generalists can resolve in a meeting; its job is to locate applications on a map — how much of their case survives if this turns out to be an ordinary time, and how much only works if it isn't — rather than to adjudicate the hypothesis itself. It should also tell us how to handle applicants who have learned the procedure and optimise against it.

  Then run the procedure on three applications we have actually agonised over: a technical AI safety research group whose case is that if transformative AI arrives within decades, alignment work done now is decisive, and if it doesn't, the work was mostly wasted but cheap; an archival project that wants to preserve records useful for rebuilding after a civilisational catastrophe, whose case explicitly disclaims any claim about timing — it is valuable whenever it is done, merely more urgent if the risk window is now; and a values-spreading grant whose proponents argue we should shape the long-run future by instilling better values now, before values get locked in. Include at least one case where the procedure delivers a verdict I won't like — I confess a soft spot for the archivists — and state plainly what the procedure cannot do: which questions it routes to human judgment, and where the simplifications will misfire. Please answer in British English.
reasoning: |-
  Okay, the user is deeply involved in longtermist grant evaluation, facing a recurring issue with applications relying on the hinge of history hypothesis. They need a structured decision procedure to handle this without getting bogged down in unresolvable debates. Let me unpack their request.

  First, they want a step-by-step process that distinguishes between strong and weak hinge claims. The panel consists of smart generalists, not domain experts, so the procedure must avoid requiring deep expertise. The stakes are high, making efficiency crucial. The user mentioned three specific cases: AI safety research, an archival project, and values-spreading. Each tests different aspects of the hinge hypothesis.

  The user's explicit needs are clear: a checklist that flags when grants depend too heavily on the hinge claim and when to fall back to standard cost-effectiveness. But deeper needs might include reducing cognitive load during panel discussions, preventing stalemates, and ensuring consistent evaluations. They also worry about applicants gaming the system, so the procedure needs robustness against optimization.

  For the decision procedure, it should start by identifying hinge dependency, then assess the strength of the claim. The strong version (tractability decreasing) is harder to justify than the weak (time of perils). The procedure must separate these and evaluate evidence without pretending to resolve the hinge debate itself. 

  Applying it to the three cases: The AI safety group heavily relies on the strong hinge. If tractability isn't decreasing, their case weakens. The archivists don't need the hinge; their work has standalone value. The values-spreading grant is tricky—it assumes a closing window for influencing values, a mix of weak and strong claims. Here, the procedure might flag it as hinge-dependent, requiring human judgment.

  The user has a soft spot for archivists, so including a verdict against them (even if the procedure approves them) isn't necessary. Instead, the values-spreading case could deliver the disliked outcome. The procedure can't resolve deep uncertainties or value judgments; it only maps dependencies. Handling optimized applications means checking for genuineness and demanding stronger evidence if hinge claims feel tactical.

  Finally, the procedure should clarify its limits: it doesn't assess hinge validity but highlights where grants are vulnerable if the hypothesis fails. This honesty prevents overconfidence and directs deeper discussions to panel votes when needed.
answer: |-
  Right, let's tackle this thorny problem. You've perfectly diagnosed the core issue – the "hinge of history" (HoH) hypothesis acting as an unexamined load-bearing wall in too many applications, coupled with the conflation of its strong and weak forms. A procedural scalpel is indeed needed.

  **Introducing the "Hinge Dependency Assessment" (HDA) Procedure**

  This isn't about proving or disproving the HoH. It's a forensic exercise: *How critically does this grant's value proposition* ***depend*** *on the HoH being true, and which specific flavour?* Its purpose is to:
  1.  **Surface** the reliance.
  2.  **Classify** the type of claim (Strong/Weak/None).
  3.  **Assess** the plausibility *within the application's own argument*.
  4.  **Trigger** appropriate handling: standard CE, panel debate, or rejection of HoH dependency as insufficiently justified.

  **The HDA Procedure Steps:**

  1.  **Identify the Claim:**
      *   *Question:* Does the application explicitly *or implicitly* rely on the proposition that the *present era* is uniquely influential for shaping the *very long-term future*? (Look for phrases like "decisive time," "lock-in," "closing window," "unprecedented leverage," "last chance," "values crystallisation," "tractability decreasing," "time of perils").
      *   *Criteria:* If no explicit/implicit claim, proceed to Step 5 (Standard CE). If claim present, proceed.
      *   *Handles Optimisation:* Explicit claims are easier. For suspected implicit claims optimised away, scrutinise *why* the intervention *must* happen *now* rather than later. If the "why now?" answer inevitably circles back to HoH concepts despite not naming them, flag it as implicit.

  2.  **Classify the Claim Strength:**
      *   *Question:* What *kind* of HoH claim is being made?
          *   **Strong Claim (Tractability Decreasing):** Does the application argue that the *ability to influence* the long-term future is *actively diminishing* over time (e.g., due to AI lock-in, irreversible decisions, technological acceleration making future interventions harder)? (Focus: **Future Options Closing**)
          *   **Weak Claim (Time of Perils):** Does the application primarily argue that the *probability of existential catastrophe* is *currently elevated* within a finite window, but doesn't necessarily claim our *ability to positively shape a surviving civilisation* diminishes after that window? (Focus: **Current Risk Concentration**)
          *   **Mixed/Ambiguous:** Does it conflate the two or fail to distinguish them?
      *   *Criteria:* Assign the strongest classification the application's logic *requires* for its core case. If both are present but separable, note that. Ambiguity is a red flag.
      *   *Handles Optimisation:* Applicants may strategically use the weaker claim. The procedure forces them to justify which one their *intervention logic* actually depends on. If the intervention only makes sense under the strong claim but they only state the weak, that's a mismatch.

  3.  **Assess Application-Specific Justification:**
      *   *Question:* What *evidence or reasoning specific to the intervention domain* does the application provide to support *its particular* HoH claim (of the strength classified in Step 2)? Does it simply cite Bostrom/Beckstead/etc., or does it connect the general hypothesis to the *specific mechanism* of their work?
      *   *Criteria:*
          *   **Sufficient:** Provides domain-specific reasoning linking HoH dynamics to the intervention's mechanism/timing (e.g., "AI alignment research now is tractable due to X technical factor, but will become intractable due to Y expected development in Z years"; "This specific value-spreading method exploits current institutional fragility Q which will solidify by year R").
          *   **Insufficient:** Relies solely on citing general HoH literature without domain-specific connection, or provides vague/untestable assertions about windows closing.
          *   **N/A:** If classified as Weak Claim *only* and the intervention is purely about reducing near-term X-risk (e.g., specific biosecurity measure), the justification might be inherent in the X-risk argument itself (proceed to Step 5 if standard CE applies, or Step 6 if X-risk is contested). *However*, if the Weak Claim is used to justify urgency *for a long-term shaping intervention* (not just survival), this step is crucial.
      *   *Handles Optimisation:* Demands genuine, bespoke justification. Generic appeals won't suffice. Forces applicants to show their homework on *why their specific work* hinges on the HoH.

  4.  **Determine Hinge Dependency & Verdict:**
      *   *Based on Steps 1-3:*
          *   **A. No Claim Found:** Proceed to **Step 5 (Standard Cost-Effectiveness Analysis)**.
          *   **B. Claim Found (Weak or Strong), Sufficient Justification:** Acknowledge HoH dependency is plausibly argued *within the application's framework*. Proceed to **Step 6 (Values/Uncertainty Judgment)**. The panel must now vote on the plausibility of the HoH *in this context* and the intervention's fit, knowing it's core to the case.
          *   **C. Claim Found (Strong), Insufficient Justification:** **Verdict: "Do not rest this grant on a Strong Hinge Claim."** The application fails to make a credible case *for its own argument* that tractability is uniquely high now. Send it back for **Step 5 (Standard CE Analysis)**, *stripping out the HoH-dependent value*. If the standard CE case is weak without HoH, reject.
          *   **D. Claim Found (Weak), Insufficient Justification:** **Verdict: "Do not rest this grant on a Weak Hinge Claim *for long-term shaping*."** If the intervention is purely near-term X-risk reduction, proceed to **Step 5 (Standard CE)**. If it's about long-term shaping (relying on the Weak Claim for urgency/leverage), send it back for **Step 5 (Standard CE)**, *stripping out the HoH-dependent urgency*. Assess value as if done later.
          *   **E. Claim Ambiguous/Unclassifiable:** **Verdict: "Hinge dependency unclear. Require clarification from applicant."** Pause evaluation until ambiguity is resolved, then re-run HDA.

  5.  **Standard Cost-Effectiveness (CE) Analysis:**
      *   Evaluate the grant using conventional longtermist CE tools, *without* any special weighting for HoH. Assume:
          *   Gains compound (or are persistent) unless a strong domain-specific argument against this is made *and* accepted independently of HoH.
          *   Tractability in the relevant domain is stable or unknown, not necessarily decreasing.
          *   Value is derived from persistent/compounding effects or reducing uncontested near-term risks.
      *   *This is the fallback for cases where HoH dependency is rejected or absent.*

  6.  **Values / Deep Uncertainty Judgment:**
      *   *Triggered only if HoH dependency is deemed plausible and core (Verdict B).*
      *   The panel must explicitly vote on:
          1.  **Plausibility Weight:** How plausible do we find the *specific* HoH claim (of the classified strength) *in the context of this intervention domain*? (Low/Medium/High, acknowledging deep uncertainty).
          2.  **Intervention Fit:** Conditional on the HoH being true, how well does *this specific intervention* exploit the unique leverage of the hinge period?
          3.  **Stakes & Uncertainty Tolerance:** Given the purported stakes, how much weight should we give to this uncertain but high-upside pathway?
      *   *This step explicitly accepts that the empirical core of HoH cannot be resolved; it's a judgment call under uncertainty based on the panel's overall priors and the application's narrative.*

  **What the HDA Cannot Do:**

  1.  **Adjudicate the Ultimate Truth of HoH:** It doesn't resolve whether *this era* is actually the hinge. It only assesses if and how an application *depends* on it.
  2.  **Resolve Deep Uncertainty:** Step 6 forces the panel to confront it, but doesn't provide an algorithm. Judgment is required.
  3.  **Replace Domain Expertise:** It highlights where domain-specific justification is *lacking*, but can't create it. Garbage-in, garbage-out applies.
  4.  **Capture All Nuance:** The Strong/Weak split is a simplification. Reality is messier, but the distinction is crucial for clarity.
  5.  **Prevent All Gaming:** Savvy applicants will adapt. The focus on *domain-specific, mechanistic justification* (Step 3) and separating claim strength (Step 2) are the main defences. Vague handwaving won't pass "Sufficient".

  ---

  **Running the Procedure on Your Cases:**

  **1. Technical AI Safety Research Group**
  *   **Step 1: Claim?** Explicit Strong Claim ("decisive if within decades... wasted if not"). Implicit Strong Claim (tractability assumed highest now, decreasing sharply with TAI development).
  *   **Step 2: Classify?** **Strong Claim.** Core argument is that alignment work is *only tractable/useful* in the pre-TAI window; later is too late.
  *   **Step 3: Justification?** Likely **Sufficient.** They usually provide *some* domain-specific reasoning (e.g., difficulty of aligning superintelligent systems reactively, ability to shape foundations pre-deployment, fast takeoff scenarios). They connect the general HoH to the AI domain mechanism.
  *   **Step 4: Verdict?** **B. Claim Found (Strong), Sufficient Justification.** Proceed to **Step 6 (Judgment)**.
  *   **Step 6 Judgment:** Panel must vote on: Plausibility of AI development creating a sharp decrease in alignment tractability? Fit of *this specific research* for exploiting the pre-TAI window? Weight to give this high-uncertainty, high-stakes path vs. other opportunities? *This is where your agonising happens, but now structured around the HoH dependency.*

  **2. Archival Project for Civilisational Rebuilding**
  *   **Step 1: Claim?** Explicitly **disclaims** any HoH timing claim ("valuable whenever done, merely more urgent if risk window now"). Focus is on *persistent value* of the archive whenever catastrophe strikes.
  *   **Step 2: Classify?** **No Claim.** Urgency based on current X-risk is separable; the archive's *core function* (aiding rebuilding) has value regardless of *when* the catastrophe occurs. Doing it now might be slightly better (ensures survival), but its value isn't *uniquely contingent* on *this* era being the hinge.
  *   **Step 3: Justification?** **N/A** (No claim).
  *   **Step 4: Verdict?** **A. No Claim Found.** Proceed to **Step 5 (Standard CE)**.
  *   **Step 5 CE:** Evaluate standard cost-effectiveness: Probability the archive survives various catastrophes? Usefulness/robustness of the records? Cost per bit preserved? Expected value of faster/more robust recovery across many potential future catastrophe dates. *HoH is irrelevant. This survives scrutiny even if we live in an "ordinary time".* (You can breathe easy about your archivists).

  **3. Values-Spreading Grant (Shaping Long-Run Future)**
  *   **Step 1: Claim?** Explicit and Implicit **Strong Claim.** "Before values get locked in" implies an active process of lock-in/crystallisation is happening *now* or soon, making tractability decrease over time. The unique leverage is *now*.
  *   **Step 2: Classify?** **Strong Claim.** While a time of perils might create *opportunity*, the core argument ("lock-in") is fundamentally about decreasing tractability for value-shaping over time. Shaping later is assumed harder/impossible.
  *   **Step 3: Justification?** Likely **Insufficient.** These applications often rely heavily on general philosophical arguments about value lock-in (e.g., from Bostrom/Yudkowsky) but provide *minimal domain-specific, testable reasoning* for *why* lock-in is happening *right now* or within a crucial short window, and *how this specific intervention* exploits that closing window. What's the mechanism of lock-in? When exactly does the window close? Why is *this* intervention uniquely time-sensitive? Appeals are often vague.
  *   **Step 4: Verdict?** **C. Claim Found (Strong), Insufficient Justification. Verdict: "Do not rest this grant on a Strong Hinge Claim."**
  *   **Next Step:** Proceed to **Step 5 (Standard CE)**, *stripping out the HoH-dependent value*.
  *   **Step 5 CE (Stripped):** Can the intervention show value under standard persistent/compounding assumptions? E.g., Do the "better values" lead to institutions/behaviours that are more robust, cooperative, or truth-seeking, yielding compounding benefits over time *even if values remain malleable*? Or is it primarily about winning a zero-sum race to lock-in? *Without the Strong HoH claim, the case likely looks significantly weaker or different.* This might lead to rejection or a much lower funding priority. **(Here's the verdict you might not like - it flags this common rationale as often inadequately justified).**

  ---

  **In Summary:**

  The HDA Procedure provides a structured way to:
  1.  **Stop conflating** Strong (Tractability Decreasing) and Weak (Time of Perils) HoH claims.
  2.  **Force justification** for HoH dependency, especially the strong claim, *within the application's domain*.
  3.  **Protect the fund** from over-reliance on weakly justified Strong HoH claims by shunting those applications back to standard CE.
  4.  **Isolate the core uncertainty** for applications where HoH *is* plausibly argued and core, forcing the panel to explicitly judge the weight to give that uncertain high-stakes pathway (Step 6).
  5.  **Clarify the map:** It shows whether an application stands up in an "ordinary time" (Archivists: Yes, AI Safety: No without HoH, Value-Spreading: Probably Not without Strong HoH).

  It acknowledges its limits: it can't resolve the HoH, only manage dependency on it. It routes the fundamental uncertainty of justified HoH-dependent applications straight to a panel vote. It simplifies, but the Strong/Weak distinction is crucial for clear thinking. And while applicants may try to optimise, demanding *domain-specific, mechanistic justification* for the Strong Claim remains your best defence against hollow hinge-mongering. Now your panel can argue *productively* about what truly matters in each case. Good luck with those thirty decisions.
