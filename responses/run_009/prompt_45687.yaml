prompt: |-
  my friend and I keep going in circles on this so I want to put actual numbers on it. Give me your credence that the heterogeneity problem is fatal for hedonism about well-being — not just awkward for it, fatal. In case we're using the term differently: the problem is that the things we call pleasures seem to share nothing but the name. The taste of cold water after a long run, an evening of genuinely good conversation, an orgasm, the quiet click of finally understanding a proof — what single property do all of these have in common, such that "amount of pleasure" could be a coherent quantity a theory of well-being could trade on? The worry is that "pleasant" is like "good" in old-fashioned axiology: a placeholder we mistake for a natural kind.

  Decompose the credence for me. I'd want at least these terms, each with a number and a one-line justification:

  (1) The probability that all paradigm pleasures do share some one natural property (a distinctive phenomenal tone, a directedness at one's own experience, whatever) that we've just characterized badly so far.

  (2) Conditional on there being no shared property, the probability that hedonism still survives via one of the rescue moves — treating pleasure as a family-resemblance cluster rather than an essence, or redefining pleasure as a pro-attitude toward parts of one's life rather than a sensation, or going aggregative and just summing over pleasant episodes wether or not they have anything deep in common. If you take this route, say which rescue move is doing the work and why the others fail.

  (3) The probability that, even if hedonism ends up false, heterogeneity is what actually kills it — as opposed to something else in the neighborhood (the experience machine, the putative value of achievement or understanding) being the real cause of death and heterogeneity just being the visible symptom.

  Then combine them however you think is right — tell me how you're combining, don't just assert a final number. After that: which term are you least confident in, and what would move it most? A case from the literature, or one you invent on the spot — either is fine, I don't need citations.

  For reference, I'm sitting around 0.65 on "fatal" and my friend is around 0.25, mostly because she thinks the pro-attitude reading of pleasure was what we meant all along and the heterogeneity problem only bites sensation-based versions. Given your own numbers, where do you think the two of us actually disagree — is it about the phenomenology (whether there really is nothing in common), or about what counts as an acceptable unifier?
