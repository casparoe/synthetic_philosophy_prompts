answer: |-
  Here's my credence decomposition for the heterogeneity problem being **fatal** to hedonism about well-being (meaning it renders hedonism incoherent or untenable *as a theory of well-being*), based on your definitions. I'll use a Bayesian chain reflecting the logical dependencies:

  **Key Probabilities:**

  1.  **P(Shared Natural Property Exists): 0.15**  
      *Justification:* Phenomenological reports and neuroscience suggest diverse reward systems (e.g., dopaminergic "wanting" vs. opioid "liking," distinct neural correlates for sensory vs. cognitive pleasures), making a *single, unified, natural* property (phenomenal or otherwise) underlying all paradigm pleasures unlikely, though not impossible given our incomplete understanding.

  2.  **P(Hedonism Survives WITHOUT Shared Property | Rescue Moves): 0.40**  
      *Justification:* Conditional on *no shared property*, the most plausible rescue is the **pro-attitude move** (defining pleasure as the object of a "desire for its own sake as an experience" - Sidgwick/Parfit). Family resemblance (0.10 weight) is too vague for quantitative well-being; aggregative summation (0.20 weight) abandons theoretical coherence ("pleasure" becomes an empty label). The pro-attitude move *might* work (hence 0.40 > 0), but risks collapsing hedonism into desire theory and faces challenges like "perverse" desires or misattunement (e.g., desiring a phenomenally negative state).

  3.  **P(Heterogeneity is Fatal Flaw | Hedonism False AND No Shared Property AND Rescue Fails): 0.70**  
      *Justification:* If hedonism fails *and* the shared property is absent *and* rescue moves fail, heterogeneity is likely the core killer (0.70). The Experience Machine (0.20 weight) attacks sufficiency, not pleasure's coherence; the value of achievement/understanding (0.10 weight) attacks necessity. Heterogeneity directly undermines the fundamental *currency* of hedonism.

  **Combining the Probabilities (Path to "Fatal"):**

  Fatal requires:  
  i. No Shared Natural Property **AND**  
  ii. No Successful Rescue Move **AND**  
  iii. Heterogeneity is the primary fatal flaw.

  *   **P(No Shared Property) = 1 - P(Shared Property Exists) = 1 - 0.15 = 0.85**
  *   **P(No Rescue | No Shared Property) = 1 - P(Hedonism Survives WITHOUT Shared Property) = 1 - 0.40 = 0.60**  
      *(This assumes rescue moves are only relevant if there's no shared property)*
  *   **P(Heterogeneity is Fatal Flaw | No Shared Property AND No Rescue) = 0.70**  
      *(This is conditional on the path where hedonism is already failing due to i and ii)*

  **Final Credence for "Heterogeneity is Fatal":**  
  `P(Fatal) = P(No Shared Property) * P(No Rescue | No Shared Property) * P(Heterogeneity is Fatal Flaw | No Shared Property AND No Rescue)`  
  `P(Fatal) = 0.85 * 0.60 * 0.70 = 0.357 ≈ 0.36`

  **Therefore, my overall credence that heterogeneity is fatal to hedonism is: ~0.36**

  **Least Confident Term & What Would Move It:**  
  I'm least confident in **P(Hedonism Survives WITHOUT Shared Property | Rescue Moves) = 0.40**. The viability of the pro-attitude move is highly contentious.

  *   **What Would Lower It (Move towards 0.20-0.30):** A compelling case showing the pro-attitude move fundamentally changes hedonism into a different theory (desire-based) *and* faces insurmountable problems with **non-experiential desires** or **misattunement**.  
      *Example Case:* Imagine an ascetic monk who cultivates a sincere, intrinsic pro-attitude towards the *feeling* of intense hunger pangs during a fast, believing it signifies spiritual purity. He reports the feeling itself as phenomenally aversive (burning, gnawing, nauseating) but *desires it for its own sake as an experience*. Is this "pleasure"? If not, the pro-attitude move struggles. If yes, hedonism becomes deeply counterintuitive. A case like this weakening the pro-attitude move would lower P(Survive) to ~0.25-0.30, reducing P(Fatal) to ~0.44-0.48.

  *   **What Would Raise It (Move towards 0.50-0.60):** A robust philosophical framework showing how a well-defined pro-attitude (e.g., "liking" dissociated from "wanting" in neuroscience terms, or a specific type of intrinsic experiential desire) cleanly captures all paradigm pleasures *without* counterintuitive inclusions/exclusions and provides a plausible basis for quantification. This could raise P(Survive) to ~0.55, reducing P(Fatal) to ~0.26.

  **Where You and Your Friend Disagree:**  
  Your difference (0.65 vs. 0.25) primarily stems from **disagreement on what counts as an acceptable unifier and the success of the pro-attitude rescue move.**

  1.  **Acceptable Unifier:** Your friend likely accepts the **pro-attitude** as a sufficient unifier *for hedonism* ("that's what we meant all along"). You likely see this as a significant revision or abandonment of core hedonistic commitments (especially phenomenal character), or find the pro-attitude itself too heterogeneous/vague. Your higher P(Fatal) suggests you weight the failure of phenomenal unity (P(No Shared Property)=0.85) and the failure of the pro-attitude move (P(No Rescue|No Shared Property)=0.60 in my calc) much more heavily than your friend does.
  2.  **Phenomenology:** You might also assign a *much* lower probability to the existence of a shared phenomenal property (P(Shared Property) <<< 0.15) than your friend, or see the phenomenology as *requiring* a shared feel that's absent.
  3.  **Rescue Moves:** Your friend assigns a *very high* probability to the pro-attitude move succeeding (likely >> 0.40, perhaps >0.75 in their model), essentially negating the heterogeneity problem for their version of hedonism. You see this move as either failing or transforming hedonism beyond recognition (hence your high P(Fatal)).

  **In essence:** Your friend believes the pro-attitude move successfully resolves heterogeneity *within* hedonism. You believe either that this move fails, or that if it "succeeds," it does so only by changing the theory so fundamentally that it ceases to be recognizably hedonistic (especially sensation/feeling-based). The core dispute is ontological and semantic: what is the essential nature of "pleasure" for hedonism?
