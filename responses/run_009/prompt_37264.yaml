prompt: |-
  Every month my reading group does a session where one of us defends an argument we half-believe and everyone else tries to break it. This one is mine and I've stopped being able to see where it fails. (1) A person is blameworthy only for what was under their control. (2) Once the drunk driver decides to drive, whether he kills a kid depends only on whether a ball rolls into the street — not on him. (3) Two people who differ only in factors outside their control cannot differ in blameworthiness. (4) So the driver who kills and the driver who gets home untouched are exactly equally blameworthy, and a court that sentences them differently is punishing luck, not wickedness. (5) So sentencing should track the attempt, not the outcome — punish the botched crime exactly like the completed one (I'm told at least one European legal system already does roughly this, so (5) isn't a fantasy). So far I think I believe all of this. But push the same lever one more time and it seems to prove way too much: whether you're the kind of person who decides to drive drunk at all — temperament, upbringing, the whole shape of you — wasn't under your control either. So (1) plus that fact appears to wipe out blameworthiness entirely, which I don't believe, and my colleague says that's a clean reductio of the whole argument. My hunch is that "control" means something different in (2) than it does in the constitutive-luck step, but I can't make the two readings precise, and if there's no equivocation then some premise has to go and I'd rather it not be (1). So: where does it slip, if it slips? And if it doesn't slip, which step do I give up and what does giving it up cost me? There's also a side problem I keep stubbing my toe on: the same reasoning seems to imply we owe the failed rescuer exactly the gratitude we owe the successful one, and I honestly can't tell whether that's a cost of the view or a feature of it.
reasoning: |-
  Okay, let me start by unpacking this user's argument. They're presenting a logical sequence about blameworthiness and control, which seems solid until the final step leads to moral nihilism. The user's main concern is pinpointing where the argument fails or which premise to reject without abandoning the core principle (that blame requires control).

  First, I need to analyze each premise. Premise (1) is a standard control condition in moral responsibility. Premises (2) and (3) build on that to show outcome luck shouldn't affect blame. The conclusion (4) and (5) about legal sentencing follows logically. But the problematic extension is that constitutive luck—factors like temperament and upbringing—also removes control, thus eliminating blame entirely. The user's colleague calls this a reductio ad absurdum.

  The user suspects "control" might be equivocated between the drunk driving case (where external factors like the ball rolling are highlighted) and the constitutive luck case (internal factors like upbringing). My task is to clarify if this equivocation exists or if another premise must go.

  Looking at the literature, a key distinction is between guidance control (exercised in the moment) and regulative control (alternative possibilities). Premise (2) uses guidance control: once the driver decides, outcomes depend on luck. But constitutive luck challenges the origin of that decision-making capacity itself. If blameworthiness requires full control over one's character, it leads to skepticism. However, compatibilists argue that control for moral responsibility doesn't require self-creation, just responsiveness to reasons within one's psychology.

  The user wants to preserve (1) but avoid the nihilism. So rejecting the extension to constitutive luck is necessary. The response should highlight that control in (1) refers to the exercise of agency in actions, not the authorship of one's entire character. This distinction allows holding agents responsible for choices made within their psychological framework, even if they didn't choose that framework.

  The side problem about gratitude for failed rescuers is consistent with the view. If blame isn't affected by outcome luck, then gratitude shouldn't be either. The user is unsure if this is a bug or feature. It might be a feature, emphasizing that moral assessment focuses on intentions and efforts, not results. This could strengthen the internal coherence of the argument but may conflict with intuitions about rewarding outcomes.

  Potential weaknesses include the practical legal concerns in (5), where sentencing based solely on intent might ignore deterrence or restitution. But the user notes some legal systems already do this, so it's not indefensible. The deeper issue is whether compatibilist control is sufficient. If determinism is true, even guidance control might be illusory, but the user likely operates under the assumption that control is compatible with determinism.

  In conclusion, the slippage is in extending control to cover constitutive factors. The solution is to clarify that control for moral responsibility pertains to the exercise of agency in specific actions, not ultimate responsibility for one's character. This preserves premises (1)-(5) while blocking the reductio. The gratitude point remains consistent and can be embraced as part of the view's implications.
answer: |-
  Your argument is razor-sharp until the constitutive-luck extension, which indeed creates serious tension. The slippage isn't in your core premises (1)-(5) about **outcome luck**, but in how you apply the "control" condition to **constitutive luck**. Here's where it goes astray and how to resolve it without abandoning (1):

  ### 1. **The Core Argument (Premises 1-5) is Sound and Defensible**
     - **Premise (1)**: "Blameworthy only for what was under their control" is widely accepted (rooted in Aristotle's *Nicomachean Ethics* and modern theories like Fischer/Ravizza's "guidance control").
     - **Premise (2)**: Correctly identifies outcome luck (e.g., the rolling ball) as outside the agent's control post-decision.
     - **Premise (3)**: A fairness principle: morally arbitrary differences shouldn't affect blame.
     - **Conclusion (4)/(5)**: Logically follows. Legal systems like Germany's (§22, §23 StGB) *do* punish attempts nearly as severely as completed crimes, precisely to avoid punishing luck.

     **This part holds.** Your intuition about "control" in (2) is consistent: it refers to **voluntary control over actions/decisions in the moment**.

  ### 2. **The Problem: Constitutive Luck Exploits a *Different* Kind of Control**
     When you extend (1) to constitutive factors (temperament, upbringing), you implicitly shift the meaning of "control" from **volitional control** (governing *actions*) to **ultimate control** (being the *original cause* of one's character).  
     - **Volitional Control (Premises 1-5)**:  
       - Requires the agent *could have acted otherwise* in that situation (or was responsive to reasons).  
       - Applies to the **drunk driver's decision**: He *chose* to drive despite knowing the risks.  
     - **Ultimate Control (Constitutive Luck)**:  
       - Requires the agent *chose their own character* (e.g., "Did you choose your upbringing?").  
       - This is impossibly demanding—no one has this.  

     **The slippage:** Premise (1) only needs volitional control to justify blame. Constitutive luck demands ultimate control, which is irrelevant to everyday responsibility.  

  ### 3. **Why Ultimate Control Isn't Required for Blameworthiness**
     - **Compatibilist Insight**: Moral responsibility depends on how we exercise our will *given* our constitution, not on creating that constitution *ex nihilo*.  
       - Example: A compassionate person isn't praiseworthy for *being born kind*, but for *acting kindly* when alternatives exist.  
     - **The Drunk Driver**: Even if his impulsiveness stems from upbringing, he *still* exercised volitional control by deciding to drive. His upbringing explains *why* he’s prone to poor choices but doesn’t negate *that* he chose.  
     - **Analogy**: A computer isn't responsible for its hardware, but it *is* responsible for executing faulty code *if it had the capacity to run correctly*. Similarly, blame attaches to faulty *exercises* of agency, not the agency's origins.  

  ### 4. **Resolving the Reductio**
     - **Reject the Constitutive Extension, Not (1)**: Premise (1) survives if "control" means **volitional control**. The reductio fails because it smuggles in an untenable notion of ultimate control.  
     - **Cost**: You must accept that blameworthiness is "subjective" – it tracks the agent's psychology *as it is*, not how it came to be. But this is intuitive: we blame people for *being* cruel, not for *becoming* cruel.  

  ### 5. **The Gratitude Problem: A Feature, Not a Bug**
     Your side problem is consistent:  
     - If the drunk drivers are equally blameworthy, the **failed rescuer** (who tries but fails due to luck) *should* be as praiseworthy as the successful one.  
     - **Why this is defensible**:  
       - Gratitude, like blame, responds to *intentions and efforts*, not outcomes. We owe thanks for someone risking their life to save us, even if a gust of wind ruins their effort.  
       - Legal systems *do* reward attempted heroism (e.g., medals for valor in failed missions).  
     - **Cost?** It challenges outcome-focused intuitions, but coheres with the principle that moral worth lies in the will.  

  ### Where to Go from Here: Defending Your Core View
  1. **Clarify "Control"**: Defend volitional control as sufficient for blame. Cite compatibilists like Frankfurt or Watson.  
  2. **Limit the Scope**: Argue that constitutive luck *explains* but doesn’t *excuse* wrongdoing. Only severe impairments (e.g., psychosis) negate control.  
  3. **Embrace the Gratitude Implication**: It strengthens internal consistency – your view treats praise/blame symmetrically.  
  4. **Address Legal Realities**: Note that outcome-independent sentencing *already exists* (e.g., attempted murder charges), so (5) isn't radical.  

  **In short: Your argument doesn't slip until you conflate two types of control. Premises (1)-(5) stand if "control" means volitional governance of actions. The reductio exploits an unreasonable demand for self-creation, which you can reject without cost to your core case.** This keeps blame intact while delivering a powerful critique of outcome-based punishment.
