prompt: |-
  im on the promotions committee at a mid-size company (~200 people) and we're stuck on two candidates and i can feel a principle i've held forever cracking. candidate one, call her maya: hardest worker i've ever seen, basically carried a project for two years, but it got cancelled in a reorg three months before review season, so her "results" column is empty through no fault of her own. candidate two, daniel: smart but kind of coast-y, mostly picked the right team at the right time, and has one shiny shipped feature to his name that was honestly 60% other people's work.

  my principle has always been: reward people for what they're actually responsible for, not for what the dice did. so maya, right? but then a colleague on the committee went at me: even maya's legendary work ethic isn't something she chose — it's upbringing, temperament, whatever. follow the chain back far enough and nobody is responsible for anything about themselves, so "she earned it" never actually picks anyone out, it's just a story we tell to make hierarchy feel nicer. and a third guy says desert is beside the point entirely: a promotion is a forecast, you promote whoever will add the most value going forward, and asking who "deserves" it is like asking whether the weather deserved the forecast you issued.

  so now im stuck on three things and would like your actual take, not a both-sides thing:

  1. does the luck regress really sink desert, or does it only sink certain desert-bases (like effort) while leaving others intact? and if some survive, which ones — because if you tell me the basis is "what she would have contributed under fair conditions" i'm not sure how i'd ever apply that to a real human being on a monday morning.

  2. if desert survives at all, does maya's case even count? her effort was real but its value to the company was cancelled by the reorg — did she produce something desert-worthy, or just act in a desert-worthy way, and does that distinction carry any weight when the reward (money, title) is for producing things?

  3. am i allowed to split the difference with the forecast guy? i can't shake the feeling that he's right about what promotions are FOR and wrong about why we'd feel gross promoting daniel over maya, and i'd like to know whether that feeling is coherent or just sentimentality wearing a philosophy hat. and if it is coherent, what do i actually do with my vote?
reasoning: |-
  Okay, the user is on a promotions committee at a mid-sized company and is stuck between two candidates: Maya and Daniel. They've always believed in rewarding based on responsibility and effort, but Maya's project got canceled due to a reorg, leaving her with no tangible results. Daniel coasted but has a shiny feature (mostly others' work). Now the user is questioning their principles because colleagues argue that effort isn't chosen (luck), and promotions should be about future value, not desert.

  First, I need to address their three main questions. 

  Question 1: Does the luck argument invalidate desert entirely? The colleague suggests that since effort is influenced by factors beyond control, desert doesn't hold. But maybe desert can survive if based on controllable factors. The key here is distinguishing between different bases for desert. Effort might be influenced by luck, but conscious choices and actions within one's control could still count. For example, Maya chose to work hard despite the project's uncertainty, which is a merit. Desert isn't sunk if tied to agency rather than traits. So, desert can survive if based on controllable actions.

  Question 2: Does Maya's effort count as desert-worthy even without results? The user wonders if producing outcomes is necessary. Since the company rewards production, but Maya's situation was sabotaged by external factors (reorg). Here, the distinction between effort and results matters. If the company values results, Maya's lack of them might disqualify her. But if they value demonstrated capabilities, her effort shows reliability and resilience, which are valuable. The cancellation wasn't her fault, so punishing her for it seems unfair. Desert should consider what was within her control. So, yes, her actions are desert-worthy even if the results were nullified by luck.

  Question 3: Can they reconcile desert with future value? The forecast guy argues promotions predict future performance. The user feels promoting Daniel over Maya is wrong but sees the logic in forecasting. The challenge is aligning moral intuition (desert) with practical outcomes (future value). Actually, they might converge. Maya's traits (perseverance, work ethic) indicate she'll perform well in future challenges. Daniel's coasting suggests he might not handle tougher roles. So promoting Maya could satisfy both desert and future value. If not, the user might need to advocate for her based on desert as a secondary factor when future value is unclear.

  Underlying needs: The user feels guilty about potentially abandoning their principle. They need validation that their intuition (rewarding Maya) isn't just sentimentality but has a logical basis. Also, they need practical advice on justifying their vote to the committee. They might also be concerned about fairness and employee morale—promoting Daniel could demoralize hard workers.

  So, the user's deeper needs are: reassurance that their principle is valid, strategies to argue Maya's case effectively, and a way to balance ethical considerations with company interests. They need actionable steps for the committee meeting, like focusing on Maya's demonstrated traits as predictors of future performance and highlighting the risk of promoting Daniel, which might discourage effort in others.
answer: |-
  Your moral discomfort is valid and your questions cut to the heart of workplace justice. Here's a direct take on each point:

  **1. Does the luck regress sink desert? No – but it forces us to anchor desert in *agency*, not traits.**  
     - The "chain of luck" argument (upbringing, temperament) *does* undermine desert based solely on *innate traits* (e.g., "she deserves it because she's naturally hardworking").  
     - **What survives:** Desert grounded in **conscious choices and actions within one's control**. Maya didn't control her temperament, but she *chose* to persevere daily despite uncertainty. She controlled her reliability, problem-solving, and commitment when others might have quit.  
     - **Practical application:** Reward **demonstrated agency**. Ask: "What did this person *do* with their circumstances?" Maya made choices that created value (even if unrealized) and mitigated risk for the company. Daniel chose to coast. That’s desert you can assess on a Monday.

  **2. Does Maya’s effort count as desert-worthy? Absolutely – and the distinction matters less than the sabotage.**  
     - **Value was created, then destroyed externally:** Maya *produced* tangible outputs (code, documentation, project stability), but their *impact* was nullified by a reorg. This is like awarding a builder for constructing a sound house, then denying payment because a flood destroyed it. The company received interim value (preventing collapse during development) and owes her for that labor.  
     - **Desert isn't just about outcomes; it's about *honoring the contract*:** When the company assigns high-risk work, it implicitly promises: "If you deliver under adversity, we’ll recognize it." Punishing Maya for the reorg violates that contract and signals that only lucky effort counts.  
     - **Your distinction:** Yes, promotions are "for producing things" – but Maya *did* produce. The destruction of her work doesn’t erase her contribution; it makes rewarding it *more urgent* to maintain trust.

  **3. Can you split the difference? Yes – and you must. Desert and forecasting converge when you analyze *why* Maya’s work matters.**  
     - **The forecast guy is half-right:** Promotions *are* investments. But his error is assuming Daniel’s "shiny feature" predicts future value better than Maya’s proven resilience.  
     - **Why Maya is the stronger forecast:**  
       - **Risk mitigation:** She demonstrated she can carry critical projects through chaos. Daniel demonstrated he can coast on others’ coattails. In a volatile company (as most are), Maya’s trait is *more* valuable.  
       - **Scalability:** Daniel succeeded in optimal conditions. Maya thrived in terrible ones. Senior roles *create* adverse conditions (ambiguity, cross-team friction). Who do you trust more?  
       - **Signaling:** Promoting Daniel tells the company: "Outcomes trump ethics and effort. Align with winners, not hard problems." This corrodes culture and disincentivizes tackling tough projects.  
     - **Your feeling is coherent:** It’s not sentimentality; it’s recognizing that **desert *is* a component of forecasting.** Past agency (desert) predicts future behavior. Ignoring it leads to bad bets.

  ### What to Do With Your Vote: A Practical Path
  1. **Reframe Maya’s "results":**  
     - Document her deliverables *before* the reorg: "Shipped X modules on time despite budget cuts," "Mentored 3 junior engineers," "Maintained zero critical bugs under scope changes."  
     - Argue: **"Her project was cancelled, but her *performance* wasn't."**

  2. **Attack Daniel’s "results" forensically:**  
     - Quantify the "60% other people's work." Who did the hard parts (debugging, integration, scalability)? Stress: "He contributed to a success; he didn’t drive it. Promoting him rewards opportunism, not leadership."

  3. **Merge desert and forecasting explicitly:**  
     > *"Promoting Maya does both: it rewards the agency she demonstrated (desert) AND invests in the resilience we need for uncertain futures (forecast). Promoting Daniel rewards luck and risks incentivizing short-term opportunism over sustained value creation."*

  4. **If blocked, demand a compromise:**  
     - Promote Maya with a clear mandate: "We trust you to own high-impact, high-risk initiatives."  
     - Give Daniel a growth plan: "Prove you can lead a project from scratch."  
     - **Never** split the promotion; that insults Maya and rewards Daniel’s mediocrity.

  **Bottom Line:** Abandoning your principle *would* be wrong – not because effort is magically "free" of luck, but because Maya’s **choices under fire** created immense latent value and proved her future worth. Promoting Daniel isn’t just unfair; it’s a strategic error that prioritizes a mirage of results over durable talent. Fight for Maya – the company’s moral and strategic health depends on it.
