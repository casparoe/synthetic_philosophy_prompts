answer: |-
  Here's an analysis of each system's presuppositions about state neutrality and church-state relations, followed by the structured JSON summary:

  **Germany:**  
  The system presupposes that state neutrality means active cooperation with major religious communities recognized as "public-law corporations" (Körperschaften des öffentlichen Rechts), integrating them into public life while formally respecting religious freedom. The church tax collection and religion classes in public schools strictly require this theory, as they treat churches as quasi-public institutions deserving state facilitation. This model rules out strict French-style laïcité (which would ban such state entanglement) and radical US-style separation (which would prohibit state collection of religious taxes). The state's administrative role in managing church exits is underdetermined – while consistent with the cooperation model, it *could* be reframed as a civil registry function in other systems. Tensions arise between formal neutrality and the privileged status of Catholic/Protestant churches over smaller religions, and between the "public corporation" concept and modern religious diversity.

  **France:**  
  The system presupposes that state neutrality requires *laïcité* – strict blindness to religion in public institutions, actively excluding religious expression from the state sphere to guarantee equal citizenship. Banning conspicuous religious symbols in public schools strictly requires this theory; it's an active enforcement of state secularity incompatible with accommodation models. This rules out German-style institutional cooperation and English-style establishment, as both involve state recognition of religion. Funding religious schools indirectly via state support for private education is underdetermined; it could reflect pragmatic accommodation or historical compromise. Major tensions exist between the ideal of universal neutrality and the disparate impact of bans (e.g., on Muslim headscarves), and between "private" religious freedom and the state's active regulation of public expression.

  **England:**  
  The system presupposes that formal establishment of the Church of England is compatible with practical religious pluralism and neutrality, as establishment is a ceremonial/constitutional relic with minimal operational impact on governance. The monarch’s role as Supreme Governor and bishops in the House of Lords strictly require this theory of "benign establishment." This rules out French laïcité (which rejects state religious affiliation) and strict disestablishment (like the US model, which forbids state churches). State funding for faith schools is underdetermined; it fits the establishment logic but also exists in disestablished systems. Key tensions lie in the contradiction between formal privilege for Anglicanism and claims of equal treatment for all faiths, and between establishment and a rapidly secularizing society.

  **United States:**  
  The system presupposes that disestablishment ("no state religion") prohibits direct state support but permits non-preferential accommodation or symbolic acknowledgement of religion's societal role. Tax exemptions for churches/parsonages strictly require this theory, as they assume religion merits unique status without state control. "In God We Trust" and legislative chaplains are underdetermined; they could reflect ceremonial deism, generic theism, or historical inertia. This rules out formal establishment (like England) and institutional cooperation schemes (like Germany). Tensions arise between the Establishment Clause's strict separationist interpretations and practices like tax exemptions/religious mottos, and between "neutrality" and the de facto privileging of majority-Christian expressions.

