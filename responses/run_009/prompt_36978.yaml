  **On Your Suspicion:**  
  Your suspicion is largely correct. Each system is a complex product of unique historical compromises, conflicts (e.g., German Kulturkampf, French Revolution, English Reformation/Civil Wars, US Founding debates), and path dependency. No system perfectly implements a single, pure theory of state neutrality. The "implicit theories" are often retrospective justifications for arrangements born of political necessity or inertia. Key compromises include:
  *   **Germany:** Post-WWII continuity with historic church-state ties, balancing cooperation with freedom.
  *   **France:** Laïcité as a hard-won principle after bitter church-state conflict, prioritizing republican unity.
  *   **England:** Maintaining ancient establishment structures while democratizing and pluralizing society.
  *   **USA:** Balancing fervent anti-establishment sentiment with societal religiosity, leading to "ceremonial deism."
  While each system has a dominant *rhetoric* of neutrality (cooperation, exclusion, benign establishment, separation), the practices reveal hybridity and internal tensions. The "shared core" reflects a universal, pragmatic recognition that religion cannot be fully ignored by the state, even if the *methods* of managing it differ dramatically.
