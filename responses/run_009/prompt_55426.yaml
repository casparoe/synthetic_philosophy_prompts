prompt: |-
  I'm a second-year econ major taking game theory this semester, and the backward induction stuff has genuinely broken my brain. We played a centipede game in class for real money (bonus points, technically) and almost everyone passed a few times before someone finally grabbed the pot, which got me trying to figure out when I actually trust the backward induction argument and when I think it proves way too much. So I've collected my gut verdicts on a bunch of cases, and I want to know whether there's a single principle behind them or whether I'm just being inconsistent.

  Here are the verdicts. In a 100-move centipede game with decent stakes against someone I know is smart, I think passing at the first couple of nodes is rational, and I'd do it. But in a 2-move version of the exact same game, taking immediately seems clearly correct and passing seems like a mistake. In a finitely repeated prisoner's dilemma with 10 rounds and a known endpoint, I think cooperating through round 8 or so is fine, and defecting from round 1 is not what rationality demands. But in a 2-round version, I think you should defect from the start, so the same tension shows up again. With the surprise exam thing (exam next week, but it will be a surprise, student proves by backward induction it can't happen), I'm confident the student's conclusion is wrong even though I can't locate the bad step. And with the chain store setup -- incumbent threatens a price war to deter entry across 20 markets -- I think the threat is empty in the last market, but the incumbent can still rationally fight in market 1, which I gather is supposed to be an incoherent position to hold.

  Then there's the case I keep flip-flopping on and would love your read on: a 100-move centipede game against a stranger, for large stakes, where the stranger was drawn at random from the general population rather than from people who've thought about any of this. I honestly don't know what I think there. Please take on the role of a philosopher of decision theory who is also a serious game theorist, brainstorm for a moment before committing to anything, and then give me the principle (or small set of candidates) that captures the pattern: state each clause precisely, tie it to whichever of my verdicts motivates it, say what it predicts for the stranger case and for any new cases you can think of, and be honest about which of my verdicts it simply cannot save. If keeping all my verdicts requires some baroque monster of a principle, tell me that, and tell me which verdict to drop instead. End your reply with one final line of the form \answer{...} containing a single-sentence statement of your final principle.
reasoning: |-
  Hmm, the user is a second-year economics major struggling with backward induction in game theory. They've played a centipede game in class and observed behavior that contradicts the theoretical prediction, which has made them question when to trust the backward induction argument. They've listed several specific cases where their intuition conflicts with standard game theory predictions.

  Looking at their verdicts:
  - In long centipede games (100 moves) against smart opponents, they believe early passing is rational
  - But in 2-move centipede, taking immediately seems correct
  - In 10-round prisoner's dilemma, cooperation until late stages feels rational
  - But in 2-round PD, defecting immediately seems necessary
  - They reject the backward induction solution to the surprise exam paradox
  - In chain store paradox, they believe fighting in early markets is rational despite the empty threat in the last market
  - They're unsure about the 100-move centipede against a stranger

  The core tension is between backward induction's logical purity and real-world behavior where people cooperate in finite games. The user wants a unifying principle that explains their intuitions while acknowledging where standard theory fails.

  I need to analyze this through several lenses:
  First, epistemic game theory suggests that rationality depends on mutual knowledge. In long games against smart opponents, there's higher-order belief that others might deviate, making cooperation sustainable. With strangers, uncertainty about their rationality creates ambiguity.

  Second, bounded rationality models like quantal response equilibrium (QRE) can explain cooperation in finite games as players assign some probability to others making mistakes.

  Third, the surprise exam paradox fails because it relies on self-referential beliefs - the student's prediction changes the game.

  For the stranger case in centipede, the solution likely involves modeling the stranger as potentially irrational with some probability. This makes early passing rational if the probability of facing a cooperator is high enough relative to the stakes.

  The unifying principle should be: Rational play depends on credible higher-order beliefs about others' rationality and the perceived error probabilities. Backward induction applies only under common knowledge of rationality and zero error probability.

  This explains:
  - Why cooperation works in long games (higher doubt about perfect rationality)
  - Why defection dominates in short games (no room for doubt)
  - Why the chain store threat works early (deterrence through uncertainty)
  - Why surprise exam logic fails (knowledge isn't immutable)

  It does require abandoning pure backward induction in most real-world cases where common knowledge of rationality is unrealistic. The final answer should capture this while acknowledging that standard theory remains useful as a benchmark.
answer: |-
  After careful analysis of your cases and the philosophical tensions in backward induction, I propose **Credible Higher-Order Doubt (CHOD)** as the unifying principle. CHOD states: *Rational play depends on credible higher-order beliefs about others' rationality and the perceived probability of implementation errors. Backward induction only applies under common knowledge of rationality (CKR) and zero error probability. When CKR is implausible or error probabilities are non-negligible, players should optimize against a model of opponents that includes possible irrationality or mistakes, with the credibility of doubt scaling with game length and stakes.*

  ### Breakdown of CHOD Components:
  1. **Higher-Order Beliefs Matter**  
     Rationality isn't binary; it depends on *what you believe about others' beliefs*. In long games (100-move centipede, 10-round PD), you can credibly doubt that your opponent believes in CKR. Against a smart opponent, you suspect they suspect *you* might deviate from backward induction, making cooperation/passing rational early on. In short games (2-move centipede, 2-round PD), no such doubt is credible—CKR is easily maintained.  
     *Explains:* Your willingness to pass early in long centipede vs. smart opponent, but take immediately in 2-move version. Similarly, cooperating until round 8 in 10-round PD but defecting immediately in 2-round PD.

  2. **Error Probabilities Amplify with Length**  
     Even tiny probabilities of irrationality (e.g., accidental passing/cooperation) compound over long games. In a 100-move centipede, a 1% chance your opponent "mistakenly" passes at node 1 implies a >63% chance they deviate *somewhere*. In short games, error probabilities are negligible.  
     *Explains:* Your flip-flop on the stranger case: against a random stranger (large stakes, 100 moves), CHOD advises early passing. Strangers have higher perceived error rates (e.g., they might pass out of confusion or altruism), making passing rational if stakes allow risk. For example, if you estimate a 5% chance the stranger irrationally passes at node 1, passing back becomes profitable by node 3–5.

  3. **Self-Defeating Predictions Invalidate Induction**  
     Backward induction fails when its own logic alters the game. If players *believe* induction will be followed, but doubt others believe it, induction unravels.  
     *Explains:* The surprise exam paradox—the student's "proof" relies on CKR, but the teacher can exploit the student's certainty by surprising them on Friday. Similarly, the chain store paradox: fighting in market 1 is rational because entrants doubt the incumbent's commitment to backward induction ("Will they really acquiesce if we enter market 20?").

  ### Predictions for New Cases:
  - **Centipede with a known altruist:** CHOD says pass early (no doubt about their irrationality).  
  - **Repeated PD with a contract theorist:** Cooperate longer (they likely model your rationality deeply).  
  - **1-move centipede:** Always take (no room for doubt or errors).

  ### Verdicts CHOD *Cannot* Save:
  - **Pure backward induction in long games:** CHOD explicitly rejects CKR in long games, so your rejection of "always take at node 1" in 100-move centipede is preserved, but standard game theory's prediction isn't salvaged—nor should it be.  
  - **Surprise exam "bad step":** CHOD agrees the student is wrong (as induction requires CKR, which the exam setup violates), but doesn't pinpoint a single flawed step—it's a systemic failure of CKR assumptions.

  ### Which Verdict to Drop?
  If CHOD feels too complex, drop **"defecting from round 1 is not what rationality demands" in the 10-round PD**. Under strict CKR, defection *is* mandated. CHOD rescues this verdict only by relaxing CKR—but if you insist on "rationality = CKR always," you must abandon cooperation in finite PDs. However, your other intuitions (e.g., centipede with strangers) would then become indefensible.

  ### Final Principle  
  CHOD is the least-baroque framework preserving your core intuitions. It treats rationality as context-dependent, leveraging epistemic game theory (e.g., Kreps-Wilson models) and bounded rationality (QRE). For the stranger centipede: pass early if stakes allow absorbing small losses (e.g., pass 5–10 times, as their error probability likely exceeds 2–3%).

  \answer{Rational play optimizes against a model of opponents that includes plausible higher-order doubt about common knowledge of rationality and implementation errors, with credibility scaled by game length, stakes, and opponent type.}
