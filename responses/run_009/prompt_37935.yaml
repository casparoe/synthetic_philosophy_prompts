  Okay, the user is in a post-Keynesian reading group discussing Keynes's 1937 QJE article. The group uses the phrase "we simply do not know" as a mantra to dismiss Bayesian approaches to uncertainty. The user feels this is an overreach but couldn't articulate why. They want a structured analysis of possible interpretations of Keynes's statement, ranked from weakest to strongest, with evaluations of each interpretation's plausibility and whether it justifies shutting down Bayesian arguments.

  First, I need to recall Keynes's 1937 argument. Keynes was addressing the instability of investment, emphasizing fundamental uncertainty where probabilities can't be calculated. The group latched onto his examples—like future interest rates or wars—to argue that Bayesian methods are invalid here. The user's classmate suggested using priors and updating, which got shut down by the group citing Keynes.

  The user wants a menu of interpretations. Let me break it down. The weakest interpretation is that there's no actuarial data. That's uncontroversial but doesn't challenge Bayesianism. The middle one involves Keynes's Treatise on Probability, where probabilities can be non-numerical and weight of evidence matters. The strongest claims that even subjective probabilities are unintelligible for these questions. 

  For each, I should assess: is it plausible? Is it what Keynes meant? Does it support shutting down the Bayesian? The user suspects unstated premises are doing the work. They need to show the group that "we simply do not know" isn't a trump card without additional assumptions.

  Key points from Keynes's text: he contrasts calculable risks (probabilities) with true uncertainty (no basis). In his Treatise, he allowed non-numerical probabilities but emphasized weight—how much evidence supports a probability. In 1937, he might be saying that for long-term investments, weight is near zero, making numerical probabilities meaningless. But that doesn't mean Bayesians can't assign subjective probabilities; it just questions their usefulness. The strongest reading requires accepting Keynes's epistemology that only "atomic" probabilities are valid, which Bayesians reject.

  The user needs to point out that the group's shutdown relies on extra premises: that meaningful probabilities require calculability, which Bayesians dispute. Highlighting this gap can show that the slogan isn't sufficient alone. Also, Keynes's practical men using conventions ties into how people cope with uncertainty, not that subjective probabilities are invalid. The Bayesian prior is part of that coping mechanism.

  The user probably wants to validate their instinct without alienating the group. Providing clear interpretations helps them argue that Keynes's point is about the limitations of probability in decision-making under uncertainty, not a denial of subjective probabilities per se. Emphasizing that the strong reading depends on unstated philosophical assumptions can help the user challenge the group's usage without rejecting Keynes entirely.
answer: |-
  Here's a menu of distinct interpretations of Keynes's "we simply do not know" claim, ordered from weakest to strongest, with analysis of plausibility, textual fidelity, and implications for shutting down your Bayesian classmate:

  ### 1. **The Actuarial/Frequency Denial Reading (Weakest)**
     - **Claim:** There is no reliable historical frequency data or actuarial basis upon which to calculate objective probabilities for events like future wars, commodity prices decades hence, or technological obsolescence.
     - **Plausibility:** Undeniably true. These events are unique, non-repetitive, and influenced by unforeseeable structural changes.
     - **Keynesian Fidelity:** Explicitly supported by the text ("no scientific basis for forming any calculable probability").
     - **Shutdown Power?** **None.** Bayesians explicitly acknowledge that *objective* frequencies are often unavailable. They operate in the domain of *subjective* belief precisely when frequencies are absent. Your classmate's point stands.

  ### 2. **The Non-Numerical Probability/Weight of Evidence Reading**
     - **Claim:** Drawing on the *Treatise on Probability* (1921), Keynes argues that probabilities are logical relations between propositions and evidence. For his examples:
       *   They lack sufficient evidence ("weight") to support *any definite probability relation*, numerical *or* comparative (e.g., "more likely than not").
       *   Attempting to assign *any* numerical probability (even a subjective prior) is epistemically unjustified because the logical "weight" of the argument is near zero.
     - **Plausibility:** Highly plausible within Keynes's own philosophical framework. The "weight" concept addresses the *quality* and *completeness* of evidence supporting a probability assessment, distinct from the probability value itself.
     - **Keynesian Fidelity:** **Very Strong.** The 1937 argument reads like a practical application of the *Treatise*'s ideas about irreducible uncertainty arising from incomplete knowledge/evidence. "We simply do not know" means the evidence is too scant to support *any* definite probabilistic judgment, logical or numerical.
     - **Shutdown Power?** **Conditional.** It directly challenges the *epistemic justification* for assigning a numerical prior. It says: "Your prior isn't just uncertain; it's *groundless* speculation masquerading as knowledge." However:
       *   **Requires Acceptance of Keynes's Epistemology:** Bayesians reject Keynes's logical theory of probability in favor of subjectivist or personalist interpretations (probability as degree of belief).
       *   **Doesn't Deny Subjectivity Exists:** It challenges *justification*, not the psychological *ability* to hold a belief. Keynes acknowledges investors *act* "as if" they have calculations. The shutdown relies on the unstated premise: "Only *justified* probability assignments (in Keynes's logical sense) are scientifically meaningful." Bayesians reject this premise.

  ### 3. **The Radical Uncertainty / Meaninglessness Reading (Strongest - Group's Implied View)**
     - **Claim:** The future states relevant to long-term investment are fundamentally undefined or unknowable *in principle*. Assigning *any* probability (numerical *or* comparative, objective *or* subjective) is not just unjustified, but *conceptually meaningless* or *impossible* for these questions. The space of possible outcomes is non-ergodic (future states aren't drawn from a knowable historical distribution).
     - **Plausibility:** Controversial but defensible for "unknown unknowns" and events involving radical novelty (e.g., invention of transformative technologies, geopolitical regime shifts). Less plausible for events like interest rates, where a *range* of possibilities might be conceivable, even if probabilities are unknown.
     - **Keynesian Fidelity?** **Ambiguous/Overextended:**
       *   **Support:** Keynes emphasizes the *unique*, non-repeatable nature of the events ("the state of the news" at a specific future time). His focus is on decisions where the *very categories* of future outcomes are unknowable. "We simply do not know" *could* be interpreted this strongly.
       *   **Counter:** Keynes doesn't explicitly say probability assignments are *meaningless*, only that they lack a scientific/calculable basis and are deeply unreliable. His observation that people act "as if" they had calculations suggests he acknowledges they *do* form beliefs (however flawed), implying the *concept* of belief/probability isn't meaningless, just its application in practice is baseless.
     - **Shutdown Power?** **Apparent, but Logically Flawed:** This reading *seems* to shut down Bayesianism completely ("You can't even *form* a coherent prior!"). However:
       *   **Relies Heavily on Unstated Premises:** It requires accepting ontological/epistemological claims Keynes doesn't explicitly make in 1937: e.g., that the future is truly *indeterminate* (not just unknown), or that probability *only* applies to "atomic" events in the *Treatise* sense. These are deep philosophical commitments.
       *   **Contradicts Psychological Reality:** Investors demonstrably *do* form expectations (flawed as they are). Denying the possibility of *any* belief state seems empirically false. Keynes describes them *acting on* beliefs pulled "out of the air," implying beliefs *exist*, however irrational.
       *   **Bayesian Response:** A strict subjectivist (e.g., de Finetti) would argue: "Meaningless? No. My prior is simply my *personal* degree of belief *right now*, however formed. It's a description of my state of mind, not a claim about objective frequencies or logical truth. I can update it based on *whatever* I consider evidence." The shutdown only works if you *first* reject subjectivist definitions of probability – an unstated premise in your group.

  ### Verdict on the Group's Usage & Your Classmate

  1.  **Weak Reading (#1):** Harmless, but irrelevant to the Bayesian. Doesn't support shutdown.
  2.  **Middle Reading (#2 - Treatise/Weight):** This is likely the *most faithful* interpretation of Keynes's 1937 argument *within his own framework*. It **challenges the justification** for Bayesian priors but **doesn't render them meaningless**. The shutdown requires the *additional, unstated premise* that only epistemically justified (Keynes-logical) probabilities are valid for scientific discussion. Your group hasn't argued for this premise; they just assert the slogan. You can counter: "Keynes shows your prior lacks *grounding*, not that you can't *have* one. His point is about the *frailty* of your guess, not its *impossibility*."
  3.  **Strong Reading (#3 - Meaninglessness):** This is an **overextension** of the text, relying on **unstated and contestable philosophical commitments** (radical indeterminacy, non-ergodicity, specific definitions of probability). Used as a shutdown, it's **rhetorically powerful but logically weak**. It confuses Keynes's critique of *calculable* probability with a denial of *subjective belief*. Point out: "Keynes describes investors *using* subjective beliefs pulled 'out of the air.' He's critiquing their *basis*, not denying they exist. Your shutdown requires extra philosophy Keynes doesn't state here."

  ### What to Bring Back to Your Group

  *   **Key Distinction:** Emphasize the crucial difference between "**no justified probability**" (Keynes's core, plausible point) and "**no possible belief/probability assignment**" (the radical, overextended reading).
  *   **The Unstated Premise:** Point out that using "we simply do not know" to shut down *all* Bayesian talk relies on an **unargued premise**: that only *Keynesian-logical* (or perhaps objective) probabilities are scientifically meaningful or valid. This premise is highly contested (it's what the Bayesian rejects!) and isn't established by the slogan alone.
  *   **Keynes's Real Target:** Argue that Keynes's primary target isn't the *existence* of subjective beliefs, but the *pretense* that these beliefs are well-founded calculations ("good Benthamite calculation"). His point is **epistemological humility**: "Your prior is a wild guess, own that fact, and understand how this shapes fragile conventions and unstable investment." This critiques the *confidence* in Bayesian updating under radical uncertainty, not the bare *existence* of the prior.
  *   **The Practical Men Paradox:** Highlight the tension: Keynes says "we simply do not know," yet *also* observes investors act "as if" they know. This shows he acknowledges they *form beliefs* ("pulled out of the air") – the very thing the radical reading denies. His critique is of the *source* and *reliability* of those beliefs, not the psychological capacity to hold them.
  *   **Constructive Suggestion:** Propose moving beyond the slogan: "Instead of saying 'Keynes says you can't do this,' let's discuss *why* Keynes thinks Bayesian updating is deeply unreliable for these questions (lack of weight, non-ergodicity) and what implications that has *for how we use* subjective beliefs in economic models, not whether we can have them."

  This approach respects Keynes's profound insight about fundamental uncertainty while exposing the philosophical overreach and unstated assumptions behind using "we simply do not know" as a conversation-ender against subjectivist approaches. It shifts the debate to *why* uncertainty matters and *how* we cope with it, which is Keynes's deeper point.
