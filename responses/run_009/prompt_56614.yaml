answer: |-
  ### Final Exam Essay Question  
  **Time Allotment:** 90 minutes  
  **Word Guidance:** Aim for 800–1,000 words.  

  **Question:**  
  "Evaluate the *scale argument for insect welfare* through the lens of two competing models of sentience: the **trapdoor model** (sentience is a binary threshold property) and the **dimmer switch model** (sentience is graded and admits of degrees). For each model:  
  (a) Explain whether the scale argument becomes stronger, weaker, or structurally different, focusing on how each model handles the *per-inspect probability of morally relevant experience*.  
  (b) Assess how the *asymmetry between false negatives and false positives* (where ignoring real suffering is worse than mistakenly attributing it) interacts with the argument. Does this asymmetry rescue the scale argument from objections about risk neutrality, uncertainty, or the ladder problem?  

  Critically engage *all three* of the following commitments smuggled into the scale argument:  
  (i) Risk neutrality about aggregate welfare (vs. risk-aversion or diminishing moral returns);  
  (ii) The compounding uncertainty of *both* the probability of sentience *and* the intensity of experience;  
  (iii) The ladder problem (prioritization shifting to ever-smaller/numerous beings, e.g., nematodes).  

  **What Not to Do:**  
  *Do not merely restate the standard scale argument ("low probability × vast numbers = high expected value"). Do not treat sentience models as an afterthought or conflate them. Do not ignore the asymmetry move or list objections without explaining how they interact with the core models. Answers that recite the lecture’s surface structure without dissecting (i)–(iii) will fail.*  

  ---

  ### Model Answer (Approx. 700 words)  
  The scale argument for prioritizing insect welfare claims that even minute probabilities of sentience, multiplied by vast insect numbers, yield overwhelming expected moral stakes. Its force, however, hinges on unstated assumptions about sentience’s nature. Under the **trapdoor model** (sentience as binary), the argument relies on classic expected value (EV) but faces acute problems with uncertainty and risk. Under the **dimmer switch model** (sentience as scalar), the argument transforms into one about *expected intensity*, weakening its rhetorical appeal but sidestepping threshold dilemmas. Neither model escapes the ladder problem, and the asymmetry move only partially rescues the argument by reframing—not resolving—its core uncertainties.  

  **Trapdoor Model:** Here, sentience is all-or-nothing; an insect either has moral status or is a "little automaton." The scale argument uses EV: aggregate stakes = (probability of sentience) × (intensity if sentient) × (number of insects). This makes the argument *structurally fragile*:  
  - (i) **Risk neutrality** is implausible. If we are risk-averse to catastrophic suffering (e.g., vast numbers of beings wrongly deemed non-sentient), maximizing EV ignores moral disaster avoidance.  
  - (ii) **Uncertainty compounds destructively**. We lack sharp probabilities for sentience *and* intensity. Multiplying two uncertain distributions (e.g., 0.1% ± 0.05% chance of sentience × intensity 0.01–0.5 human-equivalent) inflates variance, making the EV estimate unreliable. A confident "insects aren’t sentient" view could dominate a low-confidence probability spread.  
  - Asymmetry *moderates but doesn’t fix* this: Prioritizing false negatives (FN) over false positives (FP) justifies precaution but still requires quantifying "how much precaution." This reintroduces implicit probability/severity trade-offs (e.g., "How low a probability justifies action?").  

  **Dimmer Switch Model:** Sentience admits of degrees (e.g., a honeybee’s pain might be 1/1000th of a human’s). The scale argument now becomes: aggregate stakes = (expected intensity of experience) × (number of insects). "Probability of sentience" vanishes—replaced by expected intensity. This *reframes the argument*:  
  - Rhetorically, it weakens claims about "low probability," as we’re no longer gambling on a threshold but allocating concern to faint experiences.  
  - (ii) **Uncertainty shifts but persists**. We now estimate a distribution of *intensities* (e.g., 0 to 0.001 human-equivalent suffering), not a probability spike at zero. Variance remains high, but the trapdoor’s discontinuity is avoided.  
  - Asymmetry *integrates naturally*: Ignoring faint suffering (FN) is worse than over-attributing (FP), aligning with weighting lower-intensity experiences. However, this doesn’t solve (i) **risk neutrality**. If diminishing moral returns apply (e.g., the *n*th insect matters less), or if we prioritize preventing worst-case intensities, EV maximization still fails.  

  **Ladder Problem & Asymmetry’s Limits:** Both models succumb to (iii) the ladder problem. If nematodes have even lower expected intensity/probability but greater numbers, they dominate. Asymmetry doesn’t halt the regress; FN for nematodes could be worse than for insects. A "principled stopping point" (e.g., neural complexity) must be argued separately—it isn’t generated by the models.  

  **Conclusion:** The scale argument is *stronger under trapdoor* in rhetoric (leveraging "negligible chance, massive stakes") but *weaker in practice* due to uncertainty pitfalls. Under dimmer switch, it is *conceptually cleaner* but loses its "negligible probability" punch. Asymmetry mitigates trapdoor’s FN risks and fits dimmer switch’s gradedness but covertly relies on the same uncertain parameters. It is not a full rescue—only a lens that highlights which uncertainties demand scrutiny. Ultimately, the scale argument cannot evade trade-offs between epistemic humility and practical prioritization.  

  ---

  ### Marking Scheme (20 marks total)  
  Each criterion graded 0–4 (4 = excellent, 3 = good, 2 = partial, 1 = weak, 0 = missing/incorrect).  

  1. **Sentience Models Compared**  
     *Must-hit:* Contrasts trapdoor (binary probability focus) vs. dimmer switch (expected intensity focus) and evaluates impact on argument strength/structure.  
     *Common flaw:* Treats models superficially (e.g., "dimmer switch means less sentience") without impact analysis.  

  2. **Risk & Aggregation Commitment (i)**  
     *Must-hit:* Explains why risk-aversion/diminishing returns challenge EV maximization, and how asymmetry interacts (e.g., precaution ≠ risk neutrality).  
     *Common flaw:* Only mentions risk neutrality without alternatives or ties asymmetry vaguely to "being careful."  

  3. **Uncertainty Commitment (ii)**  
     *Must-hit:* Analyzes how *both* sentience probability *and* intensity uncertainty compound under trapdoor, and how dimmer switch redistributes (not resolves) uncertainty.  
     *Common flaw:* Focuses only on probability uncertainty or treats intensity as fixed.  

  4. **Ladder Problem Commitment (iii)**  
     *Must-hit:* Shows how both models extend to smaller beings (e.g., nematodes), and why asymmetry fails to stop the regress.  
     *Common flaw:* Mentions ladder problem but doesn’t apply it to both models or claims asymmetry "solves" it.  

  5. **Asymmetry Move Evaluation**  
     *Must-hit:* Takes a stance on whether asymmetry rescues the argument (e.g., "reframes but relies on same parameters," "avoids EV only rhetorically").  
     *Common flaw:* Describes asymmetry without critiquing its role, or asserts it "solves" problems uncritically.  

  ---

  This exam question forces dissection of the argument’s machinery, while the model answer and scheme reward engagement with the user’s original "dimmer vs. trapdoor" framework and asymmetry twist. It avoids rote replication by demanding meta-analysis of the commitments.
