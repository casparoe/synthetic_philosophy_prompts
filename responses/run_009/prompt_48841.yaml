answer: |-
  ### Dennett-Based Referee Procedure for Cross-Level Explanations

  Below is a step-by-step procedure operationalizing Dennett's framework. It prioritizes identifying **cranes** (stepwise, mechanistic constructions) over **skyhooks** (inexplicable top-down causes) and flags cases of **greedy reductionism** (demanding bottom-up derivations that destroy explanatory value). The procedure terminates at the first decisive step.

  #### Procedure: Ordered Questions for Referees
  1. **Does the explanation invoke *any* fundamentally irreducible element?**  
     - *Check for skyhooks*: Elements presented as "brute facts," "strongly emergent," or beyond mechanistic explanation.  
     - **Sufficient answer**: None claimed. Proceed to Q2.  
     - **Terminate/reject if**: Yes (e.g., "consciousness *just is* emergent"). *Verdict: skyhook*.  
     - **Judgment call if**: Irreducibility is a field convention (e.g., quantum indeterminacy). Hand back to editor.  

  2. **Is the core explanatory work done by *stepwise construction*?**  
     - *Check for cranes*: Does the paper show how system-level properties arise from lower-level interactions? Mechanisms need not be atomic but must be traceable.  
     - **Sufficient answer**: Yes, with identifiable mechanisms (e.g., feedback loops, local rules). *Verdict: crane*.  
     - **Terminate/accept if**: Mechanisms are specified *enough* to show derivation without gaps.  
     - **Proceed if**: Mechanisms are partial or simplified. Go to Q3.  

  3. **Are unexplained elements *legitimate starting points*?**  
     - *Check for established cranes*: Are lower-level elements (e.g., agent rules) grounded in accepted science?  
     - **Sufficient answer**: Yes, with citations or empirical constraints (e.g., "traders follow known heuristics"). *Verdict: crane*.  
     - **Proceed if**: Elements are underspecified or novel. Go to Q4.  

  4. **Does the paper *acknowledge gaps* and *constrain speculation*?**  
     - *Check for intellectual honesty*: Gaps should be noted, with boundaries set by data or theory.  
     - **Sufficient answer**: Gaps are explicit and bounded (e.g., "micro-details lost, but stigmergy predicts X"). *Verdict: needs-more-crane*.  
     - **Terminate/reject if**: Gaps are handwaved (e.g., "emergence bridges the gap"). *Verdict: skyhook*.  
     - **Judgment call if**: Gaps are unavoidable (e.g., historical sciences). Hand back to editor.  

  5. **Is a demand for micro-foundations *greedy reductionism*?**  
     - *Check for overreach*: Would satisfying the demand require destroying the phenomenon?  
     - **Sufficient answer**: Yes (e.g., "re-deriving evolution from quantum physics"). *Verdict: crane*.  
     - **Terminate/accept if**: Explanation stands without atomic detail.  
     - **Reject if**: Critical gaps remain unaddressed (rare; usually caught earlier).  

  ---

  ### Application to Sample Submissions

  #### **(A) Market Flash Crash via Algorithmic Feedback Loop**  
  - **Q1**: No irreducible elements (feedback loops are mechanistic). → Proceed.  
  - **Q2**: Stepwise construction shown (trader interactions → loop → crash). → **Verdict: crane**.  
  - *Rationale*: The loop *is* the crane; full agent specs unnecessary if loop dynamics are robust across implementations.  

  #### **(B) Consciousness via Strong Emergence + Complexity Index**  
  - **Q1**: Invokes strong emergence as irreducible ("dissolves the gap" by fiat). → **Verdict: skyhook**.  
  - *Rationale*: Positing irreducibility where mechanism is needed is a skyhook. Reject.  

  #### **(C) Termite Mounds via Stigmergy (Local Rules + Environmental Traces)**  
  - **Q1**: No skyhooks (stigmergy is mechanistic). → Proceed.  
  - **Q2**: Stepwise construction shown (local rules → environmental traces → mound form). → **Verdict: crane**.  
  - *Rationale*: Empirical predictions validate the crane; no need for complete termite ethology.  
  - **Misfire note**: Your desire to reject (C) reflects greedy reductionism (demanding full micro-specs). The procedure avoids this.  

  ---

  ### Procedure Critique
  - **Misfires on historical sciences**: Q4’s "judgment call" protects fields with lost micro-details (e.g., paleoclimate models).  
  - **Factional bias**: Q3 (legitimate starting points) may reflect your faction’s tolerance for cranes. Hardliners might reject all non-atomic mechanisms.  
  - **Greedy reductionism trap**: Q5 explicitly blocks demands for excessive reduction.  

  \verdicts{A: crane, B: skyhook, C: crane}
