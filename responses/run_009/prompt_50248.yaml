prompt: |-
  For the last twenty years I've read the rationalist blogs — the ones about akrasia, self-binding, and treating your future self as a somewhat different agent, to be managed rather than blindly trusted. In my late thirties I put that outlook into practice in a way most people would find strange. Having watched my father's mind come apart over a decade, I chose an afternoon when I was rested, unmedicated, and under no acute stress, and wrote a document with my wife and my oldest friend as witnesses. It provides that if I ever lose the capacity to make my own decisions, no aggressive measures are to be taken to prolong my life beyond a stated point; comfort is to be prioritized over extension. And it contains one further clause, which is the clause at issue: if the impaired future me turns out to be calm and content with his condition, and says he wants to go on living, that expressed wish is to carry no weight — because I judged, while I was still in a position to judge, that a contented, deteriorated version of myself would not be speaking for the person I took my life to be.

  I am now in my early seventies with early-stage Alzheimer's. My memory is going, but I remain legally competent, and I have concluded that I was wrong. I am not frightened, my days still have a shape to them, I want to keep living, and I have asked to revoke the document. My wife, whom I appointed precisely because she would hold to it against my later objections, refuses: she says the entire point of the exercise was to win this exact argument, and that if she yields now, the document was never anything more than a sentimental gesture. My son tells her she is letting a dead man keep his grip on a living one.

  I can still follow an argument, so give me one. Setting aside what the law permits, who is entitled to have their wishes prevail here, and what does the answer turn on? Is it whether the man who wrote the clause and the man who now regrets it are the same person in the sense that matters for this purpose? Whether a promise made to oneself can bind? Whether my present contentment counts as evidence of what I want, or only of what the disease has done to what I want? And is there any principled ground for my wife to stand on between the two of us, or is she simply choosing which of me to betray?
reasoning: |-
  Okay, this user presents a profoundly complex ethical and personal dilemma. The core tension is between the competent past self who anticipated cognitive decline and made binding arrangements, and the current self who still has legal competence but faces early Alzheimer's and now regrets those arrangements. 

  The user's framing suggests they've deeply engaged with rationalist philosophy about identity and commitment over time. Their references to "treating your future self as a somewhat different agent" shows familiarity with Parfit-style reductionism about personal identity. This isn't just about legal documents - it's a lived test case of whether selves remain continuous enough for past commitments to bind.

  Several key philosophical questions emerge here: First, the metaphysical question of whether the person writing the document and the person now experiencing cognitive decline are meaningfully "the same person." The rationalist tradition would likely emphasize psychological connectedness over strict identity, which seems weakened here by memory loss and changing values. 

  Second, the ethical question about self-binding promises. Even if identity persists, can we ethically bind future selves who may develop different values? The Ulysses contract analogy feels apt, but Ulysses tied himself to the mast to resist temporary temptation, not permanent transformation. 

  Third, the evidential question about current contentment. The user wonders if their present calm reflects authentic preferences or disease-induced changes. But this binary might be false - neurological conditions can reshape preferences without making them less "real" to the experiencing self.

  The wife's position raises another layer: by honoring the document, is she betraying the current self? Or protecting the past self's autonomy? Her refusal seems consistent with the original intent, but risks paternalism toward someone still legally competent. The son's "dead man" comment cuts to the heart of this - it frames the past self as a separate entity imposing on the living.

  What makes this especially poignant is the user's current state: lucid enough to articulate the dilemma, yet aware of progressing decline. Their tone suggests philosophical engagement rather than distress, which is remarkable given the circumstances. They seem to want rigorous analysis, not comfort.

  The legal competence detail is crucial - this isn't about overriding an incompetent person's wishes, but whether a competent person can revoke an advance directive while still competent. Ethically, this challenges whether we can ever truly pre-commit our future competent selves.

  Perhaps the strongest argument for revocation is that the document was designed for when competence is lost, but current competence persists. The past self may have underestimated the value of contented existence in decline. The wife's stance, while understandable, risks discounting the present self's agency for the sake of consistency with a past self who no longer exists in the same form.
answer: |-
  This is one of the most profound and heartbreaking questions of autonomy, identity, and time-bound selves I've encountered. There are compelling arguments on both sides, and no perfect resolution. Here’s a principled analysis based on the core issues you raised:

  ### Core Arguments for Honoring Your Current Wish (Revoking the Document)
  1.  **Current Competence & Autonomy:**
      *   You remain legally competent. Respect for autonomy fundamentally requires honoring the expressed wishes of a competent individual *in the present moment*. Overriding your current, clear, and reasoned desire ("I was wrong, I want to keep living") based on a past directive treats you as less than a full person *now*.
      *   **Answer to "Same Person?":** While identity changes over time, the law and ethics recognize *current competence* as the threshold for decision-making. The "person who matters" for *this* decision is the competent individual *now*, capable of expressing his will.

  2.  **The Nature of the "Promise" and Self-Binding:**
      *   A promise *to oneself* is inherently different from a promise *to others*. Binding your future self requires justification. The primary justification – protecting your "true self" from compromised judgment – *does not currently apply* because you *are* competent. You are not the impaired future self you feared; you are a competent self reassessing the directive *before* that state arrives.
      *   **Answer to "Can a promise bind?":** Self-binding has limits. It cannot ethically nullify the autonomy of a future competent self who consciously re-evaluates and rejects the earlier directive. The binding intent was aimed at your *incompetent* future self, not your *competent* present self who disagrees.

  3.  **The Evidential Value of Present Contentment:**
      *   Your current calmness and desire to live are real experiences *now*. Dismissing them *solely* as "the disease talking" risks circular reasoning: anything you feel differently is defined as pathology. Your contentment *is* evidence of what you want *at this moment*, experienced authentically by you.
      *   **Answer to "Evidence of want or disease?":** It is both. The disease is changing your experience, but *that experience is real to you now*. Assuming your current preferences are *necessarily* invalidated by a future trajectory denies the validity of your present lived reality.

  4.  **The Son's Perspective ("Dead Man's Grip"):**
      *   There is force to the argument that rigidly adhering to the document prioritizes a hypothetical, non-existent future state (the severely impaired self who might be content) or a past self (the 30s self) over the *actual, living, conscious, and competent person* making a decision today. It risks letting the *fear* of a future self dictate the life of the *actual* present self.

  ### Core Arguments for Honoring the Document (Your Wife's Position)

  1.  **Respecting the Past Self's Autonomy & Foresight:**
      *   The past you made a deeply considered, rational choice based on witnessing a horrible decline and a specific philosophical view of identity and value. He was competent and intended this directive to bind *specifically* to prevent his future impaired self from overriding his considered judgment about what constituted a life worth living *for him*. Honoring the document respects *that* autonomous choice.
      *   **Answer to "Same Person?":** While identity changes, there is sufficient psychological continuity *for the purpose of this directive*. The past self anticipated this *exact* scenario (a contented, deteriorated self wanting to live) and explicitly rejected its authority because he judged that self no longer represented his core values and identity. To override it now is to disrespect *his* foresight and autonomy.

  2.  **The Ulysses Contract Argument:**
      *   This *is* a Ulysses contract. You (past self) bound yourself to the mast (the directive) to resist the Sirens' song (the potential contentment of a deteriorated state you deemed unacceptable). The *entire point* was to win the argument against the future self's compromised judgment. Your wife, as the appointed "mast," is fulfilling her role. Revoking it now *is* the Siren call you sought to resist.
      *   **Answer to "What does the answer turn on?":** It turns on whether the *reason* for the binding (anticipated compromised judgment) justifies overriding *current* autonomy. Your wife argues it does, precisely because the past self predicted this moment and deemed his future self's judgment compromised *even if content*.

  3.  **The Slippery Slope & Integrity of Advance Directives:**
      *   If a competent individual can revoke an advance directive *specifically designed to bind them against their anticipated future compromised wishes* while still competent but facing the foreseen decline, it undermines the core purpose of such directives. It potentially renders them meaningless for the very situations they were created to address.
      *   **Answer to "Principled Ground for Wife?":** Her principled ground is fidelity to the *original intent and purpose* of the document, chosen specifically *because* she would uphold it against anticipated objections. She is standing on the principle that the past self's reasoned judgment about the limits of his acceptable existence should prevail over the present self's changed perspective, *especially* since the changed perspective was predicted and explicitly discounted.

  4.  **The "True Self" Argument:**
      *   Your past self judged that a contented, deteriorated version was not his "true self." He prioritized the values and identity of his competent self over the potential preferences of a neurologically altered self. Honoring the document respects this definition of his "true" will.

  ### Who is Entitled? The Unresolvable Conflict & Where Your Wife Stands

  *   **No Clear Victor:** There is no single, universally accepted ethical principle that definitively resolves this. Both sides appeal to powerful values: **Present Autonomy vs. Past Autonomy / Self-Binding Integrity.**
  *   **The Wife's Principled Ground:** Your wife *does* have principled ground to stand on. She is not arbitrarily choosing between "two yous" to betray. She is acting as the agent *specifically chosen* by the past you to enforce *his* meticulously considered directive *against* the scenario *he* predicted and feared. Her principle is **fidelity to the explicit, foresightful intent of the competent past self**, even when it conflicts with the competent present self. She believes the document wasn't just about incompetent you, but about pre-empting the judgment of the *transitioning* you.
  *   **Is She Betraying You?** From the perspective of your *current* self, yes, it feels like a betrayal because your present will is being denied. However, from the perspective of the *past* self who created the directive and chose your wife *for this exact quality*, she is being profoundly faithful. She is caught in an impossible loyalty bind created by the nature of the directive and the progression of your disease.

  ### A Possible Path Forward (Focus on *Now*)

  While the clause about the contented future self is the crux, the immediate issue is your *current* competent wish vs. the document. Since you are competent *now*:

  1.  **Focus on Current Wishes:** Legally and ethically, while competent, you *should* be able to revoke or amend your advance directive. Your wife's refusal *now* is ethically problematic because it overrides current competence. The clause about the contented future self was meant for *after* competence was lost. **The strongest argument for revocation is that the trigger for the directive's authority (loss of capacity) has not yet fully occurred.** You are experiencing decline, but you remain capable of making this decision *now*.
  2.  **Re-negotiate the Document:** Could you and your wife revisit the document *together, now*? Could you amend it to reflect your current perspective, perhaps adjusting the "contented self" clause or specifying clearer triggers for its application? This respects your current autonomy while acknowledging the validity of past concerns. It moves beyond the binary of "revoke vs. uphold" towards a decision made *jointly* in your current competent state.
  3.  **Mediation/Counseling:** This profound impasse might benefit from professional mediation or counseling specializing in dementia care and advance care planning. An objective third party could help you and your wife communicate the deep values and fears underlying your positions.

  **Conclusion:** Your current, competent self has the strongest claim to autonomy *at this moment*. The past self's directive, while profoundly thoughtful and intended as binding, was primarily designed to govern decisions made *after* you lost competence. Honoring it *now*, against your current competent will, prioritizes a future hypothetical or a past self over the living, conscious, reasoning person you are today. Your wife stands on the principle of fidelity to the past self's explicit intent and the integrity of the Ulysses contract, but this principle is in direct conflict with the fundamental ethical imperative to respect the contemporaneous decisions of a competent individual. The least-bad path may be to assert your current right to amend your directives while engaging your wife in a compassionate, values-based discussion about what constitutes a meaningful life for *you*, *now*, within the reality you are experiencing, not just the future you feared.
