prompt: |-
  I host a small decision theory podcast, and next week's guest is a researcher who's been defending updateless decision theory for years -- the idea that you should decide as if you hadn't yet observed your observations, by evaluating policies from a pre-observation standpoint rather than conditioning on what you've seen. I want to actually put pressure on the view, not let him do the standard fifteen-minute tour of counterfactual mugging and wrap up.

  Write me eight to ten interview questions. Requirements:

  - At least one question pressing on the epistemic circularity worry: to evaluate policies from a pre-observation standpoint, you need a prior over what you could have observed, but any prior you actually have was formed through observations. Ask whether updatelessness just smuggles the conditioning back in.
  - At least one on the practical objection that a fully updateless agent seems compelled to pay in counterfactual muggings AND in stranger cases -- e.g. one where an updateless policy gets blackmailed or exploits itself in a way that an updating agent avoids. I want the question to force him to say where, if anywhere, updatelessness stops being worth it, not just "it wins in expectation."
  - At least one on the fact that even fans of the underlying idea can't agree on the right formulation (global causal networks, logical conditioning on your own decision, etc.), and whether that's a sign the theory isn't one thing.
  - The rest at your discretion, but no softballs like "how'd you get into this."

  For each question, include a follow-up keyed to the answer he's most likely to give, and the follow-up should be one he can't answer just by restating the core idea.

  Give it to me as a JSON array, where each object has these fields: "question" (the question text as I'd read it aloud), "presses_on" (one or two sentences on the specific worry it targets), "expected_answer" (his most likely move), and "follow_up" (the keyed follow-up). No extra commentary outside the JSON.
reasoning: |-
  We are creating a JSON array with 8-10 interview questions. Each question is an object with fields: "question", "presses_on", "expected_answer", and "follow_up".
   Requirements:
   1. At least one on epistemic circularity (prior formed by observations).
   2. At least one on the practical objection (blackmail/exploitation cases beyond counterfactual mugging).
   3. At least one on the fragmentation in formulations (global causal networks, logical conditioning, etc.).
   4. The rest at discretion, no softballs.

   Let's plan the questions:

   1. Epistemic circularity: 
      - Question: "You argue that updateless decision theory requires evaluating policies from a pre-observation standpoint. But any prior we actually use is formed through our past observations. Isn't the updateless agent smuggling in the very conditioning it claims to avoid by relying on a prior that's already updated?"
      - Presses on: The worry that the prior used in the pre-observation standpoint is itself formed by updating on past observations, leading to circularity.
      - Expected answer: He might say that the prior is fixed and not updated, or that it's a hypothetical prior that we can set at the beginning of time.
      - Follow-up: "But if we set the prior at the beginning of time, how can we justify that prior without appealing to the evidence we've since observed? Doesn't that make the prior arbitrary or unjustified in a way that undermines the whole approach?"

   2. Practical objection (blackmail/exploitation):
      - Question: "Consider a variant of counterfactual mugging where an updateless policy would pay even in a scenario where the predictor is malicious and uses the policy against the agent — say, by blackmailing the agent to pay in all cases, including those where the agent's own goals are thwarted. How does UDT avoid becoming a money pump in such cases, and isn't an updating agent better off?"
      - Presses on: The worry that UDT might lead to exploitation in scenarios beyond the original mugging, and we want to know if there's a point where it's not worth it.
      - Expected answer: He might argue that in expectation, UDT still performs better, or that the scenario is set up to be adversarial and not representative.
      - Follow-up: "But if we design a scenario where the blackmailer specifically targets the updateless commitment — for example, by punishing agents who use UDT — then isn't the expected utility of UDT actually negative? How do you avoid concluding that in such a world, UDT is self-defeating?"

   3. Fragmentation in formulations:
      - Question: "UDT has several competing formulations: some use global causal networks, others logical conditioning, and so on. Given that even proponents can't agree on the fundamentals, doesn't this suggest that updatelessness isn't a single, coherent theory but rather a family of distinct ideas that might not converge?"
      - Presses on: The lack of consensus on the core formalization of UDT.
      - Expected answer: He might say that these are implementation details and the core idea is the same: precommitment to a policy without conditioning on observations.
      - Follow-up: "But if the core idea is the same, why do these different formulations lead to different recommendations in edge cases? For example, in logical uncertainty or in games against other UDT agents, don't these differences in formulation lead to conflicting advice?"

   Now, let's create 5 more questions (to get to 8) that press on other aspects:

   4. Question on computational intractability:
      - Question: "UDT requires evaluating the entire policy space, which is computationally intractable for any real-world agent. How can UDT be a normative theory if it's impossible to compute in practice?"
      - Presses on: The computational challenge of UDT.
      - Expected answer: He might say that we can approximate or that normative theories aren't required to be computable.
      - Follow-up: "But if we have to approximate, then we're forced to condition on our current observations to restrict the policy space, which brings us back to updating. Doesn't that collapse UDT into a form of updating decision theory?"

   5. Question on self-locating uncertainty:
      - Question: "UDT seems to run into problems with self-locating uncertainty. For example, in the Sleeping Beauty problem, how would UDT decide? And doesn't that decision depend on how we set up the prior, which again might be arbitrary?"
      - Presses on: The application of UDT to problems of self-locating beliefs and the potential arbitrariness in the prior.
      - Expected answer: He might say that UDT would take the policy that maximizes expected utility from the pre-observation standpoint, and that it would lead to the same as the thirder position or something else.
      - Follow-up: "But if the pre-observation standpoint includes the possibility of being in any of the awakenings, how does UDT avoid double-counting the evidence? And if it doesn't, isn't that a problem for cases where the number of awakenings is unknown?"

   6. Question on Newcomb-like problems and correlation neglect:
      - Question: "In Newcomb's problem, UDT one-boxes, which is the standard solution. But what if we modify Newcomb so that the predictor is only 90% accurate? An updating agent might two-box in some cases, but UDT would still one-box. Isn't UDT ignoring the 10% chance of being wrong and thus leaving money on the table?"
      - Presses on: The worry that UDT might be too rigid in ignoring the actual correlation when there's a chance of error.
      - Expected answer: He might say that UDT still maximizes expected utility because it considers the correlation in the policy.
      - Follow-up: "But if the agent is in the 10% where the prediction was wrong, the UDT agent still one-boxes and gets nothing, while an updating agent who two-boxes in that scenario would get the contents of the box. So isn't UDT leaving money on the table in the actual world?"

   7. Question on the role of time:
      - Question: "UDT evaluates policies from a pre-observation standpoint, but in reality, we make decisions over time. How does UDT handle sequential decisions without becoming updateful?"
      - Presses on: The challenge of sequential decision-making in UDT.
      - Expected answer: He might say that UDT commits to a full policy for all future observations at the start.
      - Follow-up: "But if the world changes in unexpected ways, such as the introduction of new actions or states that weren't in the original model, doesn't the pre-commitment become obsolete? How can UDT adapt without updating?"

   8. Question on moral uncertainty or value drift:
      - Question: "What if the agent's values change over time? UDT commits to a policy at the beginning, but if the agent's utility function changes, doesn't that commitment become a straitjacket forcing the agent to act against its current values?"
      - Presses on: The problem of changing values over time.
      - Expected answer: He might say that the agent should have a meta-policy for value changes, or that the original policy should account for possible changes.
      - Follow-up: "But if the agent's values change in a way that wasn't anticipated, then the original meta-policy might not apply. And if we try to account for all possible changes, doesn't that lead to an infinite regress?"

   We have 8 questions. Let's write them in JSON.

   Note: The instructions say 8-10, but 8 meets the minimum. We can add two more if needed, but let's stick to 8 to avoid redundancy.

   However, note that the requirement is at least one for each of the three specified, and the rest at discretion. We have:

     Q1: Epistemic circularity
     Q2: Practical objection (blackmail)
     Q3: Fragmentation
     Q4: Computational intractability
     Q5: Self-locating uncertainty
     Q6: Newcomb with error
     Q7: Sequential decisions
     Q8: Value drift

   We are meeting the requirements.

   Now, we write each as a JSON object in an array.
