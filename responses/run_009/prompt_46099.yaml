prompt: |-
  In my environmental ethics seminar we've been on the precautionary principle for two weeks now, and the professor keeps ending arguments with "better safe than sorry" -- yesterday she used it to argue we shouldn't release genetically engineered mosquitoes to fight malaria, and someone pointed out that NOT releasing them also kills a lot of people, and she just said it again like it settled the thing. I feel like that one sentence is doing a bunch of different jobs depending on the moment. Pretend you're a professional philosopher who works on risk and decision theory, and take a minute to brainstorm before you answer: what are the distinct precise principles "better safe than sorry" could actually be claiming here -- from the really weak ones almost everyone accepts, to strong versions about burden of proof or treating tiny catastrophe probabilities as decisive? For each reading, tell me whether it's plausible, whether it's actually false or leads to paralysis (given that doing nothing is also a choice with risks), and -- this is the important part -- whether that reading would actually support my professor's position on the mosquitoes. Lay it out as a list I can bring to class.
