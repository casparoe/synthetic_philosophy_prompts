  ## Structural Realism: A Villanelle

  We trace the structure, relations, not the things. (A1 - Epistemic)
  What light predicted, ether couldn't bear;
  **All we can ever grasp is nature's strings.** (A1)
  Discarded stuff, yet Fresnel's pattern sings
  Through Maxwell's fields, suspended in the air –
  The equations hold where substance took its wings. (B)
  Success survives where ontology swings:
  The ether fades, a vanished phantom's lair.
  **All we can ever grasp is nature's strings.** (A1)
  The graveyard looms, what pessimism brings –
  Old entities succumbed to time's despair.
  But structure stands where substance took its wings. (B)
  The miracle: why science finds and clings?
  Why chalked predictions answer every prayer?
  **All we can ever grasp is nature's strings?** (A1 - Questioned)
  Or Newman's ghost: pure logic often stings –
  Can empty sets define what's truly *there*?
  **This structure grasped is all that nature brings.** (A2 - Ontic)
  Relations weave the world; no relata sings
  Alone, unsupported by the web they share.
  **All we can ever grasp is nature's strings?** (A1)
  Or is this fabric all existence flings
  Before our ken – the fundamental layer?
  **This structure grasped is all that nature brings?** (A2 - Questioned)
  The numbers never lie, but what they count remains unsaid, (C)
  **All we can ever grasp is nature's strings.** (A1)
  **This structure grasped is all that nature brings.** (A2)

  ---

  **Prose Note: Liberties, Leaning, and the Looming Objection**

  The poem necessarily simplifies. It presents Fresnel-to-Maxwell as a clean archetype of structure retention, glossing over interpretative debates about the *kind* of structure retained and the messy realities of theory change where elements often blend, not cleanly swap. It leans towards the *epistemic* reading of structural realism ("grasp") despite the ontic refrain ("is all"). The final couplet, exposing the gap between grasp and being, suggests the poem ultimately finds the slide to the ontic claim unearned, highlighting the instability Worrall sought to navigate.

  The objection that would most profoundly challenge the refrains is the **"dappled world" or patchwork realism objection** (Nancy Cartwright, John Dupré). If the world is not uniformly law-governed, if structures are not reliably retained across domains or theory changes, but are instead context-bound, local, and often fractured, then the promise of structural realism – that structure is the universal, stable key – rings hollow. The refrains ("all we can grasp," "all that nature brings") presuppose a fundamental, pervasive structural unity. Demonstrating a world inherently resistant to such unified structural capture would make these claims sound like overreach, revealing the position's engine as fuelled by an assumption about nature's uniformity that may itself be unjustified. The "pattern" might not be the deep truth, but just another useful, local patch on the quilt.
