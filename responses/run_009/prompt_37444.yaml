answer: |-
  Here’s a practical, step-by-step decision procedure designed for your committee’s constraints, followed by its application to your three cases:

  ### **Decision Procedure: "Contextual Commemoration Framework"**
  *(Time per name: 30-40 mins max; requires pre-meeting research assignments)*

  **Roles:**  
  - **Librarian** (Research Lead): Compiles baseline facts pre-meeting (1–2 hours per figure).  
  - **Teachers** (Fact-Checkers): Verify disputed claims between meetings (30 mins/item).  
  - **All Members**: Debate moral judgments; vote when procedure dictates.  

  **Step 1: Define the Honored Achievement**  
  - *Question*: What specific accomplishment/role is commemorated? (e.g., "Jefferson as drafter of the Declaration," not "Founding Father").  
  - *Sufficient Answer*: School records or original naming documents.  
  - *Stop if*: The achievement is empirically false (e.g., named for a myth). → **Rename**.  

  **Step 2: Identify the Specific Moral Concern**  
  - *Question*: What concrete action/policy/statement is under critique? (e.g., "Churchill’s role in the Bengal Famine").  
  - *Sufficient Answer*: Direct evidence from primary/secondary sources.  
  - *Stop if*: Concern is provably fabricated. → **Keep name**.  

  **Step 3: Assess Contemporary Dissent**  
  - *Question*: Did contemporaries with comparable social access explicitly condemn this action?  
  - *Research Depth*: Librarian provides 2–3 verified examples of dissent OR confirms absence after checking academic databases (e.g., JSTOR).  
  - *Sufficient Evidence*: Primary sources (letters, speeches) or peer-reviewed historiography.  
  - *Stop if*: **No dissent found** → Proceed to Step 4.  
    **Dissent found** → Proceed to Step 5.  
  - *Misfire Warning*: Dissent’s existence ≠ automatic condemnation. Proximity and influence matter.  

  **Step 4: Evaluate "Could Have Known Better"**  
  - *Question*: Was a morally better position *feasible* for this person?  
  - *Criteria*: Consider power, education, and precedent (e.g., "Other landowners freed slaves").  
  - *Irreducible Judgment*: Committee debates/votes. Majority decides.  
  - *Outcome*:  
    - **Feasible** → Proceed to Step 6.  
    - **Not feasible** → Proceed to Step 5.  

  **Step 5: Assess "Better Than Average" Claim**  
  - *Question*: Was the figure *measurably* more progressive than peers *on this specific issue*?  
  - *Research*: Teachers verify comparative examples (e.g., "Jefferson criticized slavery but owned slaves; others manumitted").  
  - *Sufficient Answer*: Data points showing deviation from norms (e.g., voting records, writings).  
  - *Stop if*: **Yes** → **Add contextual plaque/teaching unit**.  
    **No** → Proceed to Step 6.  

  **Step 6: Relevancy Test**  
  - *Question*: Is the moral failing *directly tied* to the honored achievement?  
  - *Criteria*:  
    - **Direct tie** (e.g., Industrialist funded school *with* eugenics profits) → **Remove name**.  
    - **Indirect tie** (e.g., Churchill’s imperialism vs. WWII leadership) → **Option: Dual naming** (add a counter-figure) **or plaque**.  
    - **No tie** (e.g., Jefferson’s slavery vs. writing Declaration) → **Keep name + mandatory teaching unit**.  

  **Final Vote**: If no clear stop point, committee votes on: **Keep**, **Remove**, or **Contextualize**.  
  **Misfire Safeguards**:  
  - Empirical errors trigger re-research.  
  - Moral judgments require majority vote with written rationale.  

  ---

  ### **Application to Cases**

  #### **1. Thomas Jefferson House**  
  - **Step 1**: Honored as "Drafter of the Declaration of Independence."  
  - **Step 2**: Moral concern: Enslaved 600+ people; fathered children with Sally Hemings.  
  - **Step 3**: **Dissent found** (e.g., abolitionists like Benjamin Rush; some Founding Fathers freed slaves).  
  - **Step 4**: **Feasible to know better** (Manumission precedents existed; Jefferson called slavery "moral depravity" but didn’t act). → Proceed to Step 6.  
  - **Step 6**: **No direct tie** (Declaration’s ideals ≠ slaveholding).  
  - **Verdict**: **Keep name + mandatory teaching unit** on Jefferson’s contradictions.  

  #### **2. Winston Churchill Mural**  
  - **Step 1**: Honored as "WWII Defier of Fascism."  
  - **Step 2**: Moral concern: Racism (e.g., "I hate Indians" quote); Bengal Famine (1943).  
  - **Step 3**: **Dissent found** (e.g., Indian National Congress; British critics like Amery).  
  - **Step 4**: **Feasible to know better** (Anti-racist thinkers existed; famine policies were choices). → Proceed to Step 6.  
  - **Step 6**: **Indirect tie** (Imperialist views enabled famine; but WWII role distinct).  
  - **Verdict**: **Dual naming** (add famine victim/activist) **or plaque explaining contested legacy**.  

  #### **3. School Founder (Industrialist)**  
  - **Step 1**: Honored as "School Founder and Scholarship Benefactor."  
  - **Step 2**: Moral concern: Board member of state eugenics society (1920s).  
  - **Step 3**: **Dissent found** (e.g., NAACP anti-eugenics campaigns; scientists criticizing pseudoscience).  
  - **Step 4**: **Feasible to know better** (Eugenics was contested by 1920s; founder had education/access). → Proceed to Step 6.  
  - **Step 6**: **Direct tie** (Scholarship funds *may* derive from wealth linked to eugenics-driven policies; commemorating *him* celebrates eugenics by association).  
  - **Verdict**: **Remove name**. Rename house after scholarship recipient or ethical educator. Add historical exhibit.  

  ---

  ### **Why This Works for the Founder Case**  
  The procedure forces confrontation with the **direct tie** between eugenics and his role as benefactor. His service on a eugenics board isn’t an unrelated flaw—it’s part of the social system that enabled his wealth and philanthropy. The "relevancy test" (Step 6) treats this as disqualifying because the school’s commemoration implicitly endorses *his values*, not just his money. As a scholarship holder, your voice is vital here: the procedure doesn’t erase his contribution but insists that honoring him *by name* is untenable once the harm is acknowledged.  

  ### **Honest Limitations**  
  - **Misfires**: A figure with minor, irrelevant flaws might be removed if dissent existed (e.g., a 19th-century scientist who opposed suffrage but made breakthrough discoveries). The committee must weigh proportionality.  
  - **Your Bias**: The procedure exposes *why* the founder’s case likely fails—it links his actions to his legacy. But if the committee overrides Step 6, your dissent must be recorded in the report to the board.  

  This method replaces circular debates with focused questions, shares research labor, and offers compromises. It accepts that some judgments are moral—but forces them to be explicit.
