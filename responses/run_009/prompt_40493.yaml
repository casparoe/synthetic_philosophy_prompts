prompt: |-
  Trying to figure out what I actually think about commitment — tying your hands, precommitment, all that — by going on gut reactions to cases, and I want the principle behind them, if there is one. Deleting the food delivery apps during a lucid sunday night: fine, obviously. Odysseus ordering his crew to tie him to the mast before the sirens: fine, the paradigm. A recovering alcoholic taking a drug that makes drinking violently sick, voluntarily: fine. A nuclear power wiring retaliation to dead-hand systems that would launch with no human deciding in the moment: fine too, I think — that's just what deterrence is. But then: an AI agent that, anticipating a rival agent might commit first, trashes its own ability to deliberate and locks in a punishing strategy within milliseconds just to get there first: not fine, negligent, maybe insane. A founder signing an irrevocable contract at speed without reading it to beat a competitor's signature: not fine either. And a friend who at 19 irrevocably willed all her future earnings to the commune she was in: not fine, even though I can't articulate why it differs from the Antabuse case, since in both a present reflective self binds future selves. My tentative principle: commitment is legit when it's your reflective self binding your impulsive self, and illegitimate when it's made fast to beat someone to the punch. Trouble is the dead-hand case looks like speed and preemption in service of winning, and I still think it's fine. Also people keep telling me that if a rival will commit first unless you commit fast, then committing on worse information is just what winning looks like, which if true seems to undermine the principle completely. Is there one principle that saves all my verdicts, or which one do I have to give up? And what does the winner say about the case I keep flip-flopping on, Cortés scuttling his own ships? Please state the principle sharply, clause by clause, with the case that motivates each clause, and keep the whole thing under 350 words — I don't want an essay.
reasoning: |-
  Okay, the user is struggling to reconcile their intuitive judgments about different commitment scenarios. They've listed cases where precommitment feels legitimate (Odysseus, Antabuse, dead-hand deterrence) versus cases that feel wrong (AI self-sabotage, hasty contract, irreversible commune donation). Their proposed principle (binding impulsive selves = good, speed-based commitments = bad) conflicts with the dead-hand case which involves speed for strategic advantage.

  Hmm, the core tension seems to be between two dimensions: the target of the constraint (internal conflict vs external threat) and the quality of deliberation (considered vs rushed). The dead-hand case is tricky because it's externally motivated yet feels strategically necessary. 

  I notice the user is philosophically sophisticated but wants concise, structured output - no essays. They're clearly wrestling with game theory concepts (preemption, credible threats) and identity over time (present vs future selves). The Cortés case they mention adds another layer: is destroying options different from constraining choices?

  The key might be separating the commitment's purpose. Legitimate cases all involve either:
  - Self-governance (managing predictable internal failures)
  - Necessary deterrence (where delay destroys the mechanism)
  Whereas objectionable cases involve:
  - Self-harm for fleeting advantage
  - Decisions made below reasonable deliberation thresholds

  For Cortés, burning ships passes because it's about eliminating a predictable internal weakness (retreat instinct) in service of a goal, not an irreversible concession made in panic. The user's discomfort with the commune case likely stems from it being an irreversible life-altering decision made young, without exit ramps - unlike Antabuse which is reversible and targets a specific behavior.

  The winning principle should have three filters: purpose (internal/external), deliberation quality, and reversibility. Dead-hand survives because without automated retaliation, deterrence fails entirely - it's not about rushing but about maintaining functionality when humans can't react. The AI case fails because trashing deliberation capacity isn't necessary for the strategy, just a reckless shortcut.
answer: |-
  Here's a sharp principle derived from your intuitions, clause-by-clause:

  1.  **Legitimacy requires the commitment primarily targets *one's own future limitations*:** (Motivated by: Odysseus, Antabuse, Deleting Apps). Binding your impulsive/irrational future self is valid self-governance.
  2.  **The commitment must be made *reflectively and deliberately*:** (Motivated by: Rushed Contract, Young Commune Member). Speed preventing adequate deliberation invalidates the commitment.
  3.  **The commitment's *form* must be necessary for its function and proportional:** (Motivated by: AI Trashing Deliberation). Destroying core capacities (like rational thought) is excessive and negligent, even if functional.
  4.  **External strategic preemption is *only* legitimate if:**  
      a. **It creates a *necessary credible threat/deterrent*:** (Motivated by: Dead-Hand Deterrence).  
      b. **The commitment itself *does not require harming core capacities* (violating Clause 3):** (Motivated by: AI case).  
      c. **It addresses a *stable, known strategic dilemma*, not fleeting panic:** (Motivated by: Hasty Contract vs. Dead-Hand). Dead-hand addresses a permanent strategic reality (launch speed), not a momentary race.

  **How it saves your verdicts:**
  *   **Odysseus/Antabuse/Apps:** Target own weakness (1), reflective (2), proportional (3).
  *   **Dead-Hand:** Necessary credible deterrent (4a), doesn't trash core capacities (4b - systems execute, humans designed), stable strategic reality (4c).
  *   **AI:** Targets external rival (fails 1), made ultra-fast (fails 2), destroys core capacity (deliberation) (fails 3).
  *   **Rushed Contract:** Made too fast (fails 2), targets fleeting race, not stable dilemma (fails 4c).
  *   **Commune:** Likely insufficient reflection for irrevocable life-altering choice (fails 2), targets external group pressure/idealism more than internal weakness (fails 1). (Differs from Antabuse: Antabuse targets a *specific, predictable failure mode*; the commune gift targets *general future autonomy*).

  **Cortés Scuttling Ships:** **Legitimate** under this principle. It targets his *own army's predictable future limitation* (panic/retreat urge) (1). It was a deliberate strategic act (2). The form (destroying retreat option) was necessary and proportional to the goal (forcing commitment to conquest) (3). It wasn't primarily about beating a rival *to the punch* in a fleeting race (4c), but about internal resolve.
