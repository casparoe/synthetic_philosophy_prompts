        "confidence": "high (core commitment directly contradicted)",
        "load_bearing_feature": "Dissociation: neural compliance without integration/output. Removal collapses pressure.",
        "best_counter_move": "'Zombie cognition' attack: neural response ≠ consciousness. Generalization risk: invalidates behavioral reports too.",
        "least_sure_point": "Inference from neural compliance to intention"
      },
      {
