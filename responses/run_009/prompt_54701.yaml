  Bell's theorem is another challenge. Psi-epistemic views must accept nonlocality or give up on realism entirely. Most defenders bite the bullet on nonlocality since Copenhagen does too. Kochen-Specker issues about contextuality can be handled by denying non-contextuality for hidden variables, which is manageable.

