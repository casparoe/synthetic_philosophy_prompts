  I'm a high school senior writing my extended essay on the question of whether physics can legitimately accept a theory before experiments confirm it, and a popular science book I found in the school library summarizes the situation with string theory and the multiverse like this: "String theory holds that the fundamental constituents of nature are tiny vibrating strings rather than point particles, and the theory only works mathematically if spacetime has extra dimensions beyond the three we can see. Those extra dimensions can be curled up in an enormous number of different ways, and each way of curling them up yields a universe with its own particles and physical constants, which is where the idea of a landscape of perhaps 10 to the 500th possible universes comes from. Because our own universe must correspond to just one of these possibilities, string theory entails that all the others really exist somewhere as parallel universes. Since no experiment can observe these other universes, string theory has been criticized as untestable, meaning it is not a scientific theory at all but a branch of pure mathematics. Its defenders answer that science sometimes confirms theories without new data, citing how physicists accepted the Higgs boson as real for decades before it was detected, so non-empirical confirmation is nothing new." I don't know enough physics or philosophy of science to tell where this is fair and where it isn't, and I'm inclined to side with the critics. Please respond with exactly five numbered points, one corresponding to each sentence of the summary in order, with no introduction or conclusion. Each point should be a sentence or two long and should say what a theoretical physicist or philosopher of physics would accept in that sentence, where it misrepresents the view or overstates a contested claim, and whether the sentence stands once corrected.
