prompt: |-
  I'm taking a biomedical ethics elective this semester and we just started the doing vs. allowing unit, and it's kind of wrecking me, so I've been trying to figure out what I actually believe by just going case by case on gut reactions. Here's my list so far. Runaway tram headed for five workers, you can divert it to a side track where it kills one: fine, I'd pull the switch without agonizing. Big guy on a footbridge who's the only thing heavy enough to stop the tram, push him off: no way, not fine. Surgeon quietly takes one healthy walk-in's organs to save five dying patients: obviously not fine. Waking up to find a famous violinist has been plugged into your kidneys and only you can keep him alive, you unhook yourself and he dies: fine, it's your body, and even though he dies it doesn't feel like killing. Turning off a ventilator for a hopelessly ill patient whose family wants it off: fine. Giving that same patient a lethal injection so they reach the same endpoint a bit sooner: not fine, and I can't really defend that one, since they die either way. On the pure allowing side: walking past a kid drowning in a shallow pond because you don't want to ruin your shoes: not fine, that's monstrous. But not sending $40 to a charity that reliably saves kids far away: fine, and honestly I don't even feel bad about it, though I suspect that's a problem.

  There are two more cases I keep flip-flopping on, which is really why I'm writing. One is a version of the tram where the lone person on the side track happens to be heavy enough that his body stops the tram, so if he weren't lying there the tram would curve back around and kill the five anyway. My gut says this is somehow worse than the plain switch case, but I genuinely go back and forth on whether it's actually different. The other is from a scenario my TA made up about a hospital blackout: the backup generator is currently running one patient's ventilator, and you can flip it over to a ward where five patients' ventilators are failing, which lets the one die. My gut says fine, same as the tram switch, but my roommate insists it's just the organ transplant case in disguise — taking one person's life support to save five — and I don't have a good answer for her.

  So what I'm asking is: is there a principle (or maybe a couple of principles) that captures all my verdicts, or close to it? If it can't capture all of them, which one should I give up — the lethal injection one, the pond/charity pair, the ventilator ones, or something else? And what does the best principle predict about the generator case and the looping track case? If you can, I'd also like one further case that would really settle whether what I care about is the doing/allowing distinction itself or something else like whether someone is being used as a means, since right now I can't tell those two apart in my own head.
reasoning: |-
  Okay, let me unpack this user's biomedical ethics dilemma. They're clearly deep in the trenches of the doing vs. allowing distinction, wrestling with classic thought experiments but also bringing fresh twists like the looping tram and hospital generator cases. What stands out is their methodical approach - they've cataloged their intuitive judgments on seven scenarios and identified two pain points where their intuition wobbles.

  Hmm, their core struggle seems threefold: first, they need a coherent principle that explains their pattern of judgments; second, they're aware of inconsistencies (like lethal injection vs ventilator withdrawal); third, they're subtly troubled by the charity case revealing potential hypocrisy. The emotional undertone is intellectual frustration mixed with moral anxiety - they say the unit is "wrecking" them, and that "monstrous" pond judgment reveals high personal stakes.

  The looping tram case fascinates me because it exposes how physical contingency affects moral perception. If the side track victim's body serves as an essential circuit-breaker, does that make them more "used" than in the standard switch scenario? And the generator case cuts deeper - the TA brilliantly reframes it as organ harvesting logic, forcing confrontation between utilitarian and rights-based frameworks.

  For resolution pathways... Their judgments align strongly with Doctrine of Double Effect (DDE) minus the controversial intention criterion. We might synthesize: "Harm directly intended as means is forbidden; redirected harm is permissible if proportionate." This covers their no-push/yes-switch stance, condemns organ theft, validates unhooking the violinist, and distinguishes lethal injection (direct killing) from ventilator withdrawal (allowing death).

  But the charity gap remains thorny. Singer's pond argument would condemn it, yet their intuition rejects equivalence. Perhaps psychological distance or diffusion of responsibility plays a bigger role than they admit? I should probe this later with a modified pond case.

  For the flip-flop cases: the looping tram likely fails their test because the victim becomes an instrumental component (like the footbridge guy), whereas the generator switch resembles permissible harm redirection. A new "means test" case could clarify - say, diverting a flood by deliberately collapsing a occupied building versus redirecting it toward unoccupied land where someone happens to be.

  Final note: Their lethal injection hesitation suggests unresolved tension. If they accept DDE, they must either revise that judgment (allow injection) or insist intention matters independently of outcome. That's the pivot point worth flagging.
answer: |-
  Your intuitive judgments align remarkably well with a combination of two key principles in moral philosophy: **The Doctrine of Double Effect (DDE)** and **The Means Principle**. Together, they explain almost all your verdicts and resolve your flip-flop cases. Let's break it down:

  ---

  ### **The Core Principles**
  1. **Doctrine of Double Effect (DDE)**  
     An action with both good and bad effects is permissible if:  
     - The *intended* effect is good (e.g., saving lives).  
     - The bad effect (e.g., death) is *foreseen but not intended* (i.e., not part of your goal).  
     - The good effect outweighs the bad.  
     - The bad effect isn’t the *means* to achieve the good effect.  

  2. **The Means Principle**  
     It’s worse to *use someone as a means* to save others (treating them as a tool) than to cause harm as a *side effect* of pursuing a good goal.

  ---

  ### **Your Cases Explained**
  | **Case** | **Your Verdict** | **Why It Fits DDE + Means Principle** |
  |----------|------------------|---------------------------------------|
  | **Trolley Switch** | ✅ Fine | Harm is *foreseen* but not intended (goal: divert threat). Victim isn’t *used* as a tool. |
  | **Footbridge Push** | ❌ Not fine | Victim is *intentionally used* as a means (you need his body to stop the trolley). |
  | **Organ Theft** | ❌ Not fine | Healthy person is *used as a means* (organs harvested to save others). |
  | **Violinist** | ✅ Fine | You *allow* death by removing support; you don’t *use* his body. Harm isn’t intended. |
  | **Ventilator Withdrawal** | ✅ Fine | *Allowing* death by stopping treatment (foreseen but unintended). |
  | **Lethal Injection** | ❌ Not fine | Death is *intended* as the means to end suffering (violates DDE). |
  | **Shallow Pond** | ❌ Not fine | *Allowing* harm when minimal cost to prevent it (duty to rescue). |
  | **Charity** | ✅ Fine | No *direct duty* to distant strangers; harm isn’t intended or actively caused. |

  ---

  ### **Resolving Your Flip-Flop Cases**
  1. **Looping Track Trolley**  
     - **Your Gut:** Feels worse than the standard switch.  
     - **Why:** The victim’s body is *essential* to stop the trolley (like the footbridge). You’re not just diverting a threat—you’re *relying on his death* as the mechanism to save the five.  
     - **Principle Prediction:** ❌ **Not fine** (violates Means Principle).  

  2. **Hospital Generator**  
     - **Your Gut:** Fine (like the trolley switch).  
     - **Roommate’s Argument:** Like organ theft (taking life support from one to give to five).  
     - **Key Distinction:**  
       - **Generator:** You’re *redirecting a scarce resource* (power) from one patient to five. The one patient dies because resources are withdrawn, not because they’re *used as a means*.  
       - **Organ Theft:** You *directly invade* a person’s body to harvest organs.  
     - **Principle Prediction:** ✅ **Fine** (foreseen harm, not intended; no one used as a "tool").  

  ---

  ### **The Charity/Pond Inconsistency**
  This is the toughest conflict. The principles above *don’t* resolve it—but your intuition is widespread:  
  - **Shallow Pond:** Feels like killing (you *allow* a death you could easily prevent).  
  - **Charity:** Feels like *not saving* (no direct causal link; systemic issue).  
    - **Possible Fixes:**  
      - Accept Singer’s argument (both are wrong if you can save at low cost).  
      - Distinguish **proximity/rescuability** (pond: immediate, direct; charity: abstract, indirect).  
      - **Your Path:** Keep the distinction. Most non-utilitarians do.  

  ---

  ### **Test Case: Means vs. Allowing Harm**
  **The Burning Building:**  
  > *A hospital fire will kill five patients unless you unlock a fire door. The only key is in the pocket of a comatose patient in another wing. Unlocking the door requires moving him to reach the key, which will dislodge his life support and kill him.*

  - **Is it fine?**  
    - If **yes**: You prioritize DDE/allowing harm (death is a foreseen side effect of getting the key).  
    - If **no**: You prioritize the Means Principle (he’s *used as a tool* to save others).  
  - **Your Likely Verdict:** ❌ **Not fine** (like the footbridge—you need his body as a means).  

  **Result:** This case isolates "using as a means" from "allowing harm." Your rejection would confirm the Means Principle is driving your judgments more than pure doing/allowing.

  ---

  ### **Which Judgment Should You Reconsider?**
  1. **Lethal Injection vs. Ventilator:** If you accept DDE, the key distinction is *intention*.  
     - **Option:** Revise the lethal injection verdict (many ethicists see no moral difference if death is the patient’s goal).  
     - **Or:** Double down on intention (death must *never* be intended).  

  2. **Charity/Pond:** Stick with your intuition. Demanding they align leads to radical conclusions (e.g., donating most income).

  ---

  ### **Final Principle Synthesis**
  > *It’s permissible to cause foreseen harm to save lives if:  
  > (1) The harm isn’t intended,  
  > (2) The victim isn’t used as a means, and  
  > (3) The harm is proportionate.  
  > Actively allowing harm is wrong only when you have a strong duty to prevent it (e.g., immediate, low-cost rescue).*

  This explains **all** your cases except charity—which requires a separate "duty to rescue" principle limited by proximity/directness.

  Ethics is about refining intuitions, not discarding them. Your gut reactions are philosophically coherent—trust the process!
