prompt: |-
  My flatmate is doing a course on classical Chinese philosophy and came home fully convinced by the white horse dialogue — Gongsun Long's bit where he argues a white horse is not a horse. She lays it out for me in her own paraphrase:

  (1) "Horse" picks things out by shape; "white" picks things out by colour. (2) Naming by colour is not the same as naming by shape. (3) "White horse" names by colour and shape together. (4) When two terms name by different criteria, whatever satisfies one does not satisfy the other. (5) So a white horse is not a horse. Then the kicker she thinks makes it airtight: (6) ask for a horse and someone may bring you a yellow or black one — you've got what you asked for; (7) ask for a white horse and a yellow or black one won't do; (8) so the two requests come apart, so "white horse" and "horse" must pick out different things.

  I tried the obvious comeback — by the same reasoning, a horse is not an animal, since if you ask for an animal someone can bring a dog, but if you ask for a horse a dog won't do. She said fine, she accepts that, and also that her left hand is not a body (ask for a body and be shown her right hand...). Now I genuinely can't tell whether the argument is bad, or whether it's actually okay and the conclusion only sounds weird because of something about how the negation in the classical Chinese works.

  So: where does this go wrong, if it does? Walk me through which step is the guilty one — I half suspect it's around (4), or the slide from (7)-(8) to the conclusion, but I can't pin it down. And tell me what rejecting it costs, including whether the move about the classical Chinese "is not" (fei — the idea that it means "is not identical to" rather than "is not a member of the class") is a real escape hatch or just a dodge.

  After the explanation, give me a JSON object with these fields: "step_rejected" (number of the guilty premise or inference), "diagnosis" (two or three sentences on why that step looked fine), "cost" (what giving it up costs her), "parity_cases" (array of objects, each with "case" — a parallel argument the reasoning would license — and "absurd" — true or false, whether it's genuinely absurd or merely awkward), and "fei_verdict" ("real escape" or "dodge", with a one-line "reason" field attached).
