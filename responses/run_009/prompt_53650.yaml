    "step_rejected": 4,
    "diagnosis": "Step (4) conflates distinct naming criteria with mutually exclusive reference. It assumes that because 'horse' and 'white' classify by different attributes (shape vs. color), nothing can satisfy both terms simultaneously, ignoring that objects can possess multiple attributes.",
    "cost": "Abandoning step (4) undermines the argument's force by accepting that objects belong to nested categories (e.g., white horses are horses). It requires conceding that linguistic differences don't entail ontological partitions.",
    "parity_cases": [
      {
        "case": "A horse is not an animal",
        "absurd": true
      },
      {
        "case": "My left hand is not a body",
        "absurd": true
      },
      {
        "case": "Water is not H₂O",
        "absurd": false
      }
    ],
    "fei_verdict": {
      "verdict": "dodge",
      "reason": "While 'fei' can denote non-identity, the argument illicitly uses it to deny class inclusion, exploiting semantic ambiguity to mask a category error."
    }
  }
  ```

  ### Key Takeaway
  The paradox confuses **intension** (how we describe/refer) with **extension** (what exists). Steps (6)–(8) show practical differences in *requests* but don’t prove ontological distinctions. Rejecting step (4) resolves the paradox without denying that "white horse" has stricter criteria than "horse"—it simply acknowledges that criteria can overlap.
