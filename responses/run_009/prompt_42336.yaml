answer: |-
  ### Verdict
  The book's paragraph contains a mix of oversimplifications and significant misrepresentations. While it gets core technical ideas *partially* right (Tarski's hierarchy, Kripke's 3-valued approach), its depiction of the Liar as a "solved problem of mainly historical interest" is fundamentally incorrect and reflects a misunderstanding of current philosophical research.

  ### What the book gets right
  *   Tarski did prove that a formal language capable of expressing its own truth predicate (under certain classical constraints) is inconsistent. He proposed a hierarchy of languages (object language, meta-language, meta-meta-language, etc.) as a solution.
  *   Kripke did develop influential models using non-classical logics (especially 3-valued logics like Strong Kleene) where the Liar sentence ("This sentence is false") receives a truth-value gap ("neither true nor false"), avoiding the immediate contradiction within that specific framework.

  ### Where it misrepresents Tarski
  *   **"Incoherent" is a mischaracterization:** Tarski didn't conclude natural languages like English are fundamentally "incoherent" in the sense of being useless or nonsensical. He argued they are *semantically closed* (contain their own truth predicate) and therefore *inconsistent* under a classical, bivalent definition of truth satisfying his T-schema (e.g., " 'Snow is white' is true if and only if snow is white"). His point was that formalizing a satisfactory truth definition *for the whole language within itself* is impossible classically.
  *   **Motivation:** Tarski's primary goal was to provide a rigorous, consistent definition of truth *for formal languages* usable in mathematics and science. His critique of natural languages stemmed from this project – he saw them as too messy for such formalization, not as inherently defective for everyday use. He *prescribed* the hierarchy for formal systems needing a truth predicate, not necessarily for natural language.

  ### Where it misrepresents Kripke and the current state of things
  *   **"The paradox dissolves":** Kripke's framework doesn't simply make the paradox vanish. It avoids the *classical* contradiction by assigning a third value (neither true nor false) to the Liar sentence (L). However, the Liar isn't the only problematic sentence.
  *   **The Revenge Problem (The "Neither but Still Troublesome" Issue):** This is the critical error in the book's reasoning ("once they're neither they can't contradict anything"). Consider a new sentence (R): "This sentence is **not true**." What is its status in Kripke's model?
      1.  **Assume R is true:** Then what it says must be the case: "This sentence is not true" would be true. But that means R is not true, contradicting our assumption.
      2.  **Assume R is false:** If R is false, then what it says ("This sentence is not true") is false. But if it's false that R is not true, then R *must* be true! Contradiction again.
      3.  **Assign R "neither":** If R is neither true nor false, then it *is* **not true** (because "not true" includes being false *or* being neither). But this is *exactly what R asserts about itself* ("This sentence is not true"). So, if it's neither, it *is* not true, meaning what it says is *correct*! But Kripke's model assigns it "neither," meaning it's *not* correct. Contradiction persists. Alternatively, if we try to *say* R is "not true" (which seems correct if it's gappy), we find ourselves needing a strengthened truth predicate ("is true," "is false," "is gappy," "is *definitely* not true") which the model itself cannot consistently express. This is a "revenge liar" – a new paradoxical sentence that plagues the *proposed solution* itself.
  *   **"Solved by the seventies" / "Mainly historical interest":** This is demonstrably false. The revenge problem shows Kripke's solution (and similar non-classical approaches) is incomplete. Philosophers actively debate numerous approaches:
      *   **Contextualist/Paraconsistent:** Deny classical logic holds for such sentences (e.g., accept true contradictions for paradoxes).
      *   **Revision Theory:** Truth is a rule-based process evolving over stages, never settling for the Liar.
      *   **Hierarchies Revisited:** Sophisticated modern hierarchies (e.g., Burge, Parsons).
      *   **Unstable/Determinacy Operators:** Trying to formalize strengthened truth predicates.
      *   **Investigating Revenge Itself:** Analyzing the *nature* of the revenge problem.
      The Liar paradox remains a central, unsolved problem in logic, philosophy of language, and metaphysics. New papers and books on it are published constantly.

  ### Does the conclusion follow?
  **No.** The conclusion ("solved problem of mainly historical interest") absolutely does **not** follow from the corrected picture. While Tarski and Kripke made monumental contributions that defined the modern landscape, the existence of revenge paradoxes and the multitude of competing, incomplete contemporary approaches prove the Liar is very much an active and profound unsolved problem. Teaching it for a week reflects its foundational importance and conceptual depth, not its settled status.

  ### A question for my friend
  Ask him: "If Kripke's model makes the Liar sentence 'neither true nor false,' how does it consistently handle the sentence 'This sentence is **not true**' without generating a new paradox?" If he just repeats the book's line about it being safely gappy and harmless, he hasn't grasped the revenge problem.
