prompt: |-
  I've been keeping a list of my gut reactions to unrealistic assumptions in scientific models, and I want to know if there's actually a principle behind them or if I'm just vibing. Frictionless planes and point masses: obviously fine, that's just physics. Aquaplanet simulations, where climate scientists delete all the continents and run the atmosphere on a water world: also fine, you learn how circulation works. Hardy-Weinberg equilibrium in genetics, which assumes infinite population, random mating, no mutation, no selection — every assumption literally false, and yet fine, it's a useful null model. The no-trade theorem in finance, which rests on common priors basically nobody has: fine, and somehow it's *because* the assumptions are false that it teaches you something about why trade happens. Moving up the ladder: Friedman's line that an expert pool player acts *as if* he solves the differential equations of the shot — I buy that for predicting where the ball goes, and I'll even go along with the version for firms acting as if they maximize profits, when it's used to predict prices. But when a central bank takes a DSGE model with a single representative household and uses it to evaluate the welfare effects of a tax reform, something in me rebels — the false assumption seems to be doing the work of the conclusion. And a model where unemployment comes out "voluntary" by construction feels straight up dishonest, the answer is baked in before you start. My friend Marco, who does macro, says I'm being inconsistent: if a water-world Earth is a legitimate move, a one-household economy is too, and I can't quite articulate why he's wrong.

  For what it's worth, I have a tentative taxonomy from another friend, who says unrealistic assumptions come in three flavors: ones that say "this effect is real but small, ignore it" (like friction on a slow ramp), ones that restrict the domain ("true only for small oscillations," "only in the near-field"), and ones that are flat out false but used as a stepping stone to get somewhere tractable (perfectly rational agents, ideal gases). She claims that once you see the three types you can stop arguing about whether models are "realistic" and just ask which type an assumption is and whether the conclusion is sensitive to it. Maybe. But it's not obvious to me that the taxonomy actually predicts my verdicts — the representative household and the aquaplanet both look like stepping-stone assumptions, and I give them opposite grades. And it doesn't touch Friedman's bigger claim, the one people call the F-twist, that the more significant a theory is the more unrealistic its assumptions are going to be — which I find simultaneously obviously deranged and weirdly right, and I'd like to know if any principle can make sense of that ambivalence instead of just ignoring it.

  So: give me a principle, or a small set of candidates, stated precisely enough to have a verdict on new cases. Say which of my verdicts motivates which clause, and be honest about which verdict(s) it can't save — I'd rather lose a verdict than keep them all with some baroque epicycle. Then run it on some cases I haven't mentioned, like assuming agents never make mistakes in an evolutionary model of cooperation, or calibrating a safety valve with the ideal gas law. And most importantly, settle the one I keep going back and forth on: Rawls's original position — parties behind a veil of ignorance, perfectly rational, perfectly impartial, used to derive principles of justice. Is that a frictionless plane for normative theory, a legitimate stepping stone, or is it the unemployment-is-voluntary problem all over again, with the conclusion smuggled in via the idealization? My intuitions genuinely point both ways depending on the day and I'd like to know what your principle says and how confident it should make me.
reasoning: |-
  We are looking for a principle that can explain when unrealistic assumptions in scientific models are acceptable and when they are not. The user has provided several examples with their intuitive verdicts and a tentative taxonomy (three flavors of unrealistic assumptions). However, the taxonomy does not fully explain the verdicts (e.g., representative household in DSGE vs. aquaplanet both being stepping-stone assumptions but getting opposite reactions). We also need to address the F-twist (Friedman's claim that the more significant a theory, the more unrealistic its assumptions) and apply the principle to new cases and Rawls's original position.

  Key examples and verdicts from the user:

  1. Frictionless planes and point masses: fine.
  2. Aquaplanet simulations: fine.
  3. Hardy-Weinberg equilibrium: fine (useful null model).
  4. No-trade theorem: fine (because false assumptions teach why trade happens).
  5. Friedman's pool player: fine for predicting ball movement; also firms maximizing profits for price prediction.
  6. DSGE model with representative household for welfare effects of tax reform: not fine (the false assumption is doing the work of the conclusion).
  7. Model where unemployment is "voluntary" by construction: not fine (dishonest, answer baked in).

  The user's friend's taxonomy:
  - Type 1: Effect is real but small (ignore it).
  - Type 2: Restrict the domain (only true in specific conditions).
  - Type 3: Flat out false but stepping stone (to tractability).

  But note: both aquaplanet (type 3 stepping stone) and representative household (type 3 stepping stone) are in the same category but get different verdicts. So we need a principle that goes beyond this taxonomy.

  Proposed Principle:

  I propose a principle with two main criteria:

  **Criterion 1: The assumption must not be doing the heavy lifting for the conclusion in a way that makes the model tautological or question-begging.**

  Explanation: If the assumption directly implies the conclusion without any additional empirical or theoretical content, then it is problematic. For example, if we assume unemployment is voluntary, then we get that unemployment is voluntary. The model doesn't teach us anything new.

  **Criterion 2: The model must be able to generate insights that are robust to relaxing the assumption, or the assumption must be such that it allows us to isolate a mechanism that is present in the real world even when the assumption is relaxed.**

  Explanation: The model should help us understand the world. Even if the assumption is false, the model should capture a causal mechanism that still operates (perhaps in a modified form) when the assumption is relaxed. Alternatively, the model should be a building block for more realistic models, and we should be able to show that the core insight holds when we add complexity.

  Additionally, we can consider:

  **Criterion 3: The purpose of the model must align with the use of the assumption.**

  Explanation: If the model is being used for a purpose that is undermined by the unrealistic assumption, then it is not acceptable. For example, if we use a model with a representative household to study income inequality, the assumption of a single household directly contradicts the phenomenon under study.

  Now, let's map the verdicts:

  1. Frictionless planes: 
     - Criterion 1: The assumption of no friction doesn't directly imply the conclusion (e.g., the motion of the object). It isolates the effect of gravity and inertia.
     - Criterion 2: We can add friction later and the model is a building block. Also, for slow speeds, friction might be negligible (domain restriction). So fine.

  2. Aquaplanet: 
     - Criterion 1: Removing continents doesn't directly imply the circulation patterns we observe. The model shows how the atmosphere would behave without land, which helps understand the role of land in the real world.
     - Criterion 2: The insights about basic atmospheric circulation are robust and can be built upon by adding continents. So fine.

  3. Hardy-Weinberg: 
     - Criterion 1: The assumptions (infinite population, etc.) don't directly imply the equilibrium frequencies. The model shows what would happen without evolutionary forces, which is a useful baseline.
     - Criterion 2: It is a null model that allows us to detect when evolutionary forces are at work. So fine.

  4. No-trade theorem: 
     - Criterion 1: The assumption of common priors doesn't directly imply no trade? Actually, the theorem says that if agents have the same prior and their information is common knowledge, then they won't trade. The conclusion (no trade) follows from the assumptions, but the insight is that in reality, trade happens because these assumptions are false. So the model is used to isolate the reason for trade. 
     - Criterion 2: The insight (trade occurs due to differences in beliefs or information) is robust and is the main takeaway. So it's fine because the model teaches us about the real world by showing what happens when the assumptions are violated.

  5. Friedman's pool player: 
     - Criterion 1: The assumption that the player acts as if solving differential equations doesn't directly imply the ball's path. The model of the ball's physics is what gives the prediction. The "as if" is a way of saying the player's behavior is consistent with that model without claiming the player actually solves equations. So it's fine for prediction.
     - Criterion 2: The model of the ball's motion is robust and can be tested. So fine.

  6. DSGE with representative household for welfare effects of tax reform:
     - Criterion 1: The representative household assumption might be doing the heavy lifting because it assumes away heterogeneity. If the tax reform has different effects on different people, then aggregating to one household may give a misleading welfare result. The assumption of a single household might directly lead to a conclusion that ignores distributional effects. So the assumption is not just a stepping stone but is central to the welfare conclusion.
     - Criterion 2: The model is not robust to relaxing the assumption. If we introduce heterogeneity, the welfare implications might change. Using it for welfare evaluation (which inherently involves aggregation over diverse individuals) is problematic because the assumption ignores the very heterogeneity that matters for welfare. So not fine.

  7. Unemployment as voluntary by construction:
     - Criterion 1: The assumption that unemployment is voluntary directly implies the conclusion. It's tautological. The model doesn't provide any insight beyond the assumption.
     - Criterion 2: There is no robustness because the model is built to force the conclusion. So not fine.

  Now, the F-twist: Friedman claims that the more significant a theory, the more unrealistic its assumptions. Our principle does not directly endorse this. Instead, we say that unrealistic assumptions are acceptable if they meet criteria 1 and 2. Sometimes, a highly unrealistic assumption (like the representative household) might be acceptable for one purpose (e.g., studying aggregate consumption in a simple setting) but not for another (welfare analysis). The F-twist might be interpreted as saying that to get a simple and powerful theory, we must make unrealistic assumptions. However, our criteria require that the unrealistic assumptions do not make the model tautological and that the insights are robust. So we can agree that unrealistic assumptions are often necessary, but they must be used appropriately.

  New cases:

  - Agents never make mistakes in an evolutionary model of cooperation: 
     - This might be a stepping stone assumption (type 3). 
     - Criterion 1: Does the assumption of no mistakes directly imply the evolution of cooperation? Not necessarily. Cooperation can evolve under certain conditions (like repeated interactions) even without mistakes, but mistakes might be important for the stability of cooperation. However, the model without mistakes might be a starting point to understand basic mechanisms.
     - Criterion 2: We can then add mistakes and see if the results hold. If the core mechanism (like reciprocity) is robust to occasional mistakes, then the assumption is acceptable. If adding mistakes completely changes the outcome, then the model without mistakes might be misleading. So it depends: if the model is used as a first step and we build on it, it might be fine. But if we use it to claim that cooperation evolves easily and ignore the role of mistakes, it might not be.

  - Calibrating a safety valve with the ideal gas law:
     - The ideal gas law assumes point masses, no intermolecular forces, etc. (unrealistic).
     - Criterion 1: The ideal gas law doesn't directly imply the pressure and temperature relationship in a way that is tautological; it's a well-established approximation.
     - Criterion 2: For many gases under normal conditions, the ideal gas law is a good approximation. For a safety valve, if we are in conditions where real gases behave ideally, then it's fine. If the conditions are extreme (high pressure, low temperature) we might need a more complex equation. But the ideal gas law is often used because it is simple and works well in many cases. So it's fine for calibration in appropriate conditions (domain restriction).

  Rawls's original position:

  - The veil of ignorance: parties are rational, impartial, and do not know their place in society.
  - This is used to derive principles of justice (e.g., maximizing the situation of the worst-off).

  Apply the criteria:

  - Criterion 1: Does the assumption (veil of ignorance) directly imply the conclusion (e.g., the difference principle)? Rawls argues that under the veil, rational parties would choose principles that protect the worst-off because they might end up in that position. However, the conclusion does not follow tautologically. There is an argument: without knowing their position, individuals are risk-averse and would choose principles that maximize the minimum position. But note: the assumption of risk aversion is crucial and might be contested. So it's not a simple tautology, but the veil is designed to force impartiality. However, the veil itself does not directly say what principles will be chosen; it sets up a fair choice situation.

  - Criterion 2: Is the insight robust? The idea is that the veil removes bias and leads to fair principles. We can ask: does this model help us understand justice? Even if we don't have a real veil of ignorance, the thought experiment helps us reason about fairness. However, critics might say that the assumptions (like the specific risk aversion) are doing the work. Also, the model is normative, not predictive. It is not intended to describe the real world but to prescribe principles. So criterion 2 might be interpreted differently for normative models.

  For normative models, we might adjust the criteria. The purpose is to derive principles that we can accept as fair. The veil is a device to model impartiality. The key question is whether the assumptions (like rationality and risk aversion) are reasonable for the purpose. 

  In the user's terms: 
  - If we see it as a "frictionless plane" for normative theory (isolating the effect of impartiality) then it might be acceptable. 
  - But if we think that the assumption of risk aversion (or the specific conditions behind the veil) is forcing the conclusion, then it might be like the unemployment model.

  Our principle (which is for scientific models) might need extension for normative models. However, we can try:

  In normative theory, the model should help us clarify our moral intuitions and the principles we endorse. The assumptions should not be question-begging. The veil of ignorance is not obviously question-begging because it doesn't assume the principles of justice but the conditions for choosing them. It is intended as a device to model fairness. However, if the assumptions about human nature (e.g., risk aversion) are controversial and drive the result, then the model might be criticized. But note that Rawls does not claim that the veil exists; it is a thought experiment.

  Verdict: The original position is a legitimate stepping stone for normative theory. It is not like the unemployment model because the conclusion (the principles) is not built into the veil. The veil sets up a choice situation, and the principles are derived from it. But the robustness might be tested by varying the assumptions (e.g., what if the parties are not risk-averse?).

  The user's ambivalence: Some days it feels like a frictionless plane (helping us isolate impartiality) and other days it feels like the conclusion is baked in (because the veil forces a particular kind of reasoning). Our principle would say: it is acceptable as long as the assumption (the veil) is not doing the heavy lifting by directly implying the conclusion without argument, and as long as the model helps us gain insight (which it has in political philosophy). But we might not be as confident as in the scientific cases because normative models are not empirical.

  Refined Principle for both positive and normative models:

  We can state the principle as:

  **The Unrealistic Assumption Principle (UAP):**

  An unrealistic assumption in a model is acceptable if and only if:

  1. **Non-tautology Condition:** The assumption does not directly imply the model's central conclusion without additional, substantive reasoning or empirical input.

  2. **Robustness or Insight Condition:** The model yields insights that are either:
     - Robust to relaxing the assumption (i.e., the core result holds in more realistic settings), or
     - The assumption serves to isolate a mechanism that is operative in the real world (even if the assumption is false), and relaxing the assumption allows us to understand the deviation.

  Additionally, for normative models:

  3. **Normative Purpose Condition:** For normative models, the assumption must be justifiable as a fair or reasonable representation of the normative concept being modeled (e.g., impartiality) and must not be tailored to force a specific normative conclusion without independent argument.

  Applying UAP to Rawls:

  1. Non-tautology: The veil does not directly imply the difference principle. Rawls provides an argument (maximin reasoning under uncertainty) which is debatable but not a tautology.
  2. Robustness/Insight: The veil of ignorance has been highly influential in clarifying the requirements of fairness. We can (and people have) explored variations (e.g., with different attitudes to risk) to test the robustness of the principles.
  3. Normative Purpose: The veil is designed to model impartiality, which is central to justice. It is a reasonable device for that purpose.

  Therefore, the original position is a legitimate stepping stone.

  Conclusion:

  The principle explains the user's verdicts:

  - Frictionless planes, aquaplanet, Hardy-Weinberg, no-trade, Friedman's pool player: satisfy both conditions.
  - DSGE representative household for welfare: fails non-tautology condition (because the assumption of a single household ignores heterogeneity that is crucial for welfare) and robustness (if we add heterogeneity, the welfare result changes).
  - Unemployment voluntary: fails non-tautology (tautological) and robustness.

  The F-twist: We can say that significant theories often use unrealistic assumptions, but they must satisfy the UAP to be acceptable. The F-twist is not universally true, but it highlights that simplification is necessary. However, the UAP provides the conditions under which such simplifications are justified.

  New cases:

  - Evolutionary model without mistakes: If used as a stepping stone and then extended, it is acceptable. If presented as the full story, it might fail the robustness condition.

  - Ideal gas law for safety valve: Acceptable because it is robust in the domain of use (normal conditions) and not tautological.

  The user's ambivalence about Rawls is addressed: the original position is acceptable under the UAP, especially with the normative condition. We can be confident in this verdict because the model has generated significant insight and debate, and the assumptions are not tautological.
answer: |-
  ### A Principle for Evaluating Unrealistic Assumptions in Models

  After analyzing your examples, intuitions, and the limitations of existing taxonomies (like your friend's three-flavor framework), I propose a unified principle that captures when unrealistic assumptions are legitimate. The core issue isn't just the *type* of assumption (e.g., "stepping stone" vs. "domain restriction") but how it interacts with the model's **purpose** and the **epistemic risk** it introduces. Specifically:

  #### **The Purpose-Robustness Principle (PRP)**
  An unrealistic assumption is legitimate if and only if:
  1. **Purpose Alignment**: The assumption does not contradict the core phenomenon the model aims to explain or the question it seeks to answer.  
  2. **Robustness to Relaxation**: The model's key insights (or predictions) hold qualitatively when the assumption is relaxed, or the assumption's role is explicitly acknowledged as a scaffold for future refinement.  
  3. **No Tautology**: The assumption does not trivialize the conclusion by making it a direct, uninsightful consequence of the setup (i.e., it avoids begging the question).

  ---

  ### **How PRP Explains Your Verdicts**
  Let's map your examples to the PRP clauses. Each verdict is explained by one or more clauses, with the primary motivator in bold.

  | **Your Example** | **Your Verdict** | **PRP Analysis** | **Which Clause Motivates Your Verdict?** |
  |------------------|------------------|------------------|------------------------------------------|
  | **Frictionless planes / point masses** | Fine | Purpose: Predicting motion dynamics, not friction effects. Robustness: Adding friction refines predictions without invalidating core mechanics. No tautology: Motion isn't predefined. | **Purpose Alignment** (friction isn't core to the question). |
  | **Aquaplanet simulations** | Fine | Purpose: Isolating atmospheric circulation, not land-climate interactions. Robustness: Adding continents refines the model; insights (e.g., Hadley cells) persist. No tautology: Circulation isn't assumed. | **Purpose Alignment** (continents aren't the focus) + **Robustness**. |
  | **Hardy-Weinberg equilibrium** | Fine | Purpose: Null model for detecting evolutionary forces, not real populations. Robustness: Deviations signal real-world effects (e.g., selection). No tautology: Equilibrium frequencies derive from allele math, not assumptions. | **Robustness** (deviations are the point) + **No Tautology**. |
  | **No-trade theorem** | Fine | Purpose: Explaining why trade occurs (via its absence). Robustness: Relaxing "common priors" explains real trade. No tautology: No-trade is derived, not assumed. | **Purpose Alignment** (false assumptions highlight real mechanisms) + **Robustness**. |
  | **Friedman's pool player / profit-max firms** | Fine (for predictions) | Purpose: Predicting outcomes (ball path/prices), not cognitive processes. Robustness: Models work empirically; cognitive realism isn't needed. No tautology: Predictions require solving equations. | **Purpose Alignment** (the "as if" is sufficient for prediction). |
  | **DSGE w/ representative household (welfare)** | Not fine | Purpose: Welfare analysis inherently depends on distributional effects. Assumption contradicts this by erasing heterogeneity. Robustness fails: Adding heterogeneity changes welfare conclusions. Tautology risk: Single household assumes away inequality. | **Purpose Alignment** (fails; heterogeneity is core to welfare) + **No Tautology** (fails; conclusion baked in). |
  | **Unemployment "voluntary"** | Not fine | Purpose: Explaining unemployment causes. Assumption defines it away. Robustness fails: No room for involuntary mechanisms. Tautology: "Voluntary" is assumed, not derived. | **No Tautology** (fails; assumption is the conclusion) + **Purpose Alignment** (fails). |

  #### **Why the Taxonomy Fails**
  - Aquaplanet and representative household are both "stepping stones," but aquaplanet satisfies **Purpose Alignment** (removing continents doesn't contradict the goal of studying circulation), while DSGE fails it (removing heterogeneity contradicts welfare analysis). Your intuition rebels because DSGE's assumption actively undermines the model's stated purpose.

  #### **Friedman's F-Twist: Deranged or Right?**
  The F-twist ("the more significant a theory, the more unrealistic its assumptions") is half-right but dangerous. PRP refines it:  
  - **Right**: Significant theories often use bold idealizations to isolate mechanisms (e.g., frictionless planes). This aligns with PRP if **Robustness** and **Purpose Alignment** hold.  
  - **Deranged**: It excuses assumptions that contradict the purpose or create tautologies (e.g., unemployment models). PRP rejects these.  
  *Your ambivalence makes sense*: F-twist captures the necessity of idealization but ignores when it corrupts the model. PRP resolves this by tying legitimacy to purpose and robustness, not "significance."

  ---

  ### **PRP Applied to New Cases**
  We'll evaluate your new examples and others using PRP.

  | **Case** | **PRP Analysis** | **Verdict** |
  |----------|------------------|-------------|
  | **Agents never make mistakes in evolutionary cooperation models** | Purpose: Study cooperation mechanisms (e.g., reciprocity), not error-handling. Robustness: Mistakes (e.g., miscoordination) can be added later; core insights (e.g., tit-for-tat stability) often persist. No tautology: Cooperation isn't assumed—it emerges from dynamics. | **Fine** (if purpose is mechanism isolation). Fails only if the goal is to explain error-prone systems (e.g., human behavior). |
  | **Calibrating a safety valve with ideal gas law** | Purpose: Approximate pressure/temperature in safe ranges. Robustness: Law works well for many gases under moderate conditions; deviations (e.g., high pressure) are handled with safety factors. No tautology: Pressure derived from theory/observation. | **Fine** (domain restriction implicit in calibration). Fails if used for extreme conditions without adjustment. |
  | **Rational expectations in macro models** | Purpose: Predict aggregate outcomes (e.g., inflation). Robustness: Often fails—relaxing it (e.g., bounded rationality) changes results. Tautology risk: Assumes agents know the model, which may embed policy conclusions. | **Not fine** for policy evaluation (fails **Robustness** and **No Tautology**). Fine for theoretical benchmarks if scaffolded. |
  | **Neoclassical production functions (Y = F(K,L))** | Purpose: Model growth, not firm heterogeneity. Robustness: Fails for micro heterogeneity; OK for macro trends. Tautology risk: Aggregate "output" may be circularly defined. | **Fine** for long-run growth (Purpose Alignment), **not fine** for explaining inequality (fails Purpose Alignment). |

  ---

  ### **Rawls's Original Position: PRP Verdict**
  Apply PRP to Rawls:  
  - **Purpose**: Derive principles of justice under impartiality. The veil of ignorance aims to model fairness by removing self-interest.  
  - **Purpose Alignment**: The assumption (veil) aligns with the goal—it directly operationalizes impartiality, which is core to justice. No contradiction.  
  - **Robustness**: Rawls argues the principles (e.g., maximin) hold under rational deliberation, but critics note that changing assumptions (e.g., risk aversion levels) alters conclusions. However, the *mechanism* (veil → impartial choices) is robustly debated and refined in philosophy (e.g., Sen's critiques).  
  - **No Tautology**: The principles aren't baked into the veil—they emerge from rational choice under uncertainty. For example, utilitarianism could (in theory) be chosen but isn't.  

  **PRP Verdict**: **Legitimate stepping stone** (like a frictionless plane for normative theory).  
  - Why? It satisfies **Purpose Alignment** (veil isolates impartiality) and **No Tautology** (conclusions are argued, not assumed). **Robustness** is partial but sufficient for a scaffold: The veil has generated decades of refinement (e.g., considering empathy vs. ignorance).  
  - Why it *feels* like "unemployment is voluntary" sometimes: If you view the veil as smuggling in Rawls's prior convictions (e.g., risk aversion favoring the worst-off), it risks tautology. But PRP notes that Rawls derives conclusions from rational choice, not the veil alone—this distinguishes it from unemployment models where "voluntary" is axiomatic.  
  - **Confidence**: High for it being a legitimate idealization, but medium for robustness (since normative models can't be empirically tested). Your ambivalence reflects that robustness is debated, but PRP clarifies that the core use is valid.

  ---

  ### **Which Verdicts Does PRP Sacrifice?**
  PRP is stringent and can't save all your intuitions without ad-hoc fixes. It explicitly **sacrifices** one:  
  - **Friedman's profit-maximizing firms for price prediction**: You accept this, but PRP is cautious. If "firms maximize profits" is empirically false *and* leads to bad predictions (e.g., in behavioral contexts), it fails **Robustness**. PRP allows it only if predictions hold (as in your example), but flags it as risky if used beyond its predictive domain.  

  PRP also **constrains** the F-twist: Unrealistic assumptions aren't virtuous by default—they must earn legitimacy via purpose and robustness.

  ### **Conclusion**
  The **Purpose-Robustness Principle** (PRP) explains your intuitions by focusing on:  
  - Whether the assumption **contradicts the model's purpose** (e.g., DSGE welfare vs. aquaplanet).  
  - Whether insights are **robust or scaffolded** (e.g., Hardy-Weinberg as a null model).  
  - Whether the assumption **trivializes conclusions** (e.g., unemployment models).  

  It resolves your ambivalence on Rawls (legitimate stepping stone), handles new cases cleanly, and tempers Friedman's F-twist. Where PRP struggles (e.g., normative models), it forces explicit scaffolding debates. Ultimately, PRP suggests you're not "just vibing"—there's a coherent principle behind your gut reactions.
