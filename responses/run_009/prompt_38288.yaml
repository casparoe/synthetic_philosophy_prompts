  5. Closing statement: 

    The procedure is based on the axioms of bargaining theory. However, the axioms themselves embed normative choices:

        - Both solutions assume that the disagreement point is the appropriate threat point. If we adjust it (because of credibility or legality), we are imposing.

        - The utility elicitation is arbitrary: we use a 0-100 scale per issue, and we assume additive utilities. This might not reflect true preferences.

        - The choice between Nash and KS when they differ is a value judgment: Nash emphasizes the product of gains (and is more sensitive to the disagreement point) while KS emphasizes equal relative sacrifice (and is more sensitive to the ideal point).

    The mediator, by following this procedure, is still imposing values: the definition of fairness, the set of issues, the resolution options, and the assessment of the disagreement point. The procedure is a tool, not a neutral arbiter.

    What it cannot do:

        - It cannot handle non-rational parties or parties who are not acting in their own best interest.

        - It cannot prevent parties from being unhappy with the outcome.

        - It assumes that utilities are comparable across issues and that preferences are stable.

    Use it as a structured way to apply your judgment, not as a replacement.
