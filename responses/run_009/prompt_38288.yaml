  We are building a mediation procedure for a single day-long session. The goal is to get a signed term sheet by the end of the day. The procedure uses the Nash bargaining solution (NBS) and the Kalai-Smorodinsky bargaining solution (KS) as benchmarks. We have constraints: non-technical parties, emotional, strategic, limited time (3 hours joint, 1 hour each in caucus), and the disputes involve money plus a few indivisible non-monetary issues.

  The procedure must:
  1. Elicit disagreement points (what happens if no agreement) and ideal points (best possible outcome for each party) for both monetary and non-monetary issues.
  2. Handle strategic inflation of walk-away alternatives.
  3. Build a candidate set of packages (since most issues are indivisible, we have a discrete set of possible agreements).
  4. Extract rough cardinal preferences without formal utility elicitation.

  We design the steps:

  Step 0: Preparation (before the joint session)
  - Identify the issues (e.g., cash, IP, non-compete, client list, who tells investors) and the possible resolutions for each non-monetary issue (e.g., who gets the codebase: party A, party B, or destroyed?).

  Step 1: Joint Session (1 hour)
  - Set the stage: explain the process, the goal (to reach a fair agreement by the end of the day), and the role of the mediator.
  - Frame the issues: list the issues and the possible resolutions for non-monetary issues. For monetary issues, define the range (e.g., cash to be divided: $X total).
  - Explain the concept of the "disagreement point": what happens if they don't agree. Be realistic. Emphasize that inflating this point will lead to worse outcomes for both.

  Step 2: Private Caucuses (1 hour each)
