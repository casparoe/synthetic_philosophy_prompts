  ### Comprehensive Mediation Procedure for Co-Founder Dissolutions

  Based on your constraints, I've designed a 6-step procedure that operationalizes Nash (NBS) and Kalai-Smorodinsky (KS) solutions. It handles strategic behavior, indivisible issues, and utility elicitation within 5 hours (3 joint + 2 caucus).

  ---

  ### **1. Step-by-Step Procedure**
  **Total Time:** 5 hours (1h joint + 2h caucus + 1h computation/joint + 1h proposal)

  #### **Step 1: Joint Session (60 min)**
  - **Objective:** Frame issues and anchor expectations.
  - **Process:**
    - List all issues (e.g., cash, IP, non-compete) and possible resolutions.
    - Define the *disagreement point* (d): "If we fail, what *realistically* happens? Let’s quantify costs, delays, and outcomes."
    - Warn against inflation: "Overstating your walk-away alternative will backfire—it shrinks the pie for both."
  - **Sufficient Answer:**  
    - Realistic, quantifiable outcomes (e.g., "Litigation would cost $50k/year, take 2 years, and we’d split assets 50-50").  
  - **Insufficient Answer:**  
    - Vague or inflated claims (e.g., "I’ll sue for everything and win millions").  
    - *Mediator Response:* "Let’s benchmark with industry data: only 20% of cases award >60% to one party."

  #### **Step 2: Private Caucus (60 min per party)**
  - **Objective:** Elicit preferences and anchor utilities.
  - **Process:**
    - **Disagreement Point (d):**  
      - "What’s your *realistic* worst-case scenario? Assign 0–100 points to outcomes (0 = worst, 100 = best)."  
      - Challenge inflation: "If you claim $1M in litigation, but legal fees are $200k and success is 50%, your net is $400k. Correct?"  
    - **Ideal Point (for KS):**  
      - "If the other side conceded everything, what would you get? Assign 0–100 to this outcome."  
    - **Utility Elicitation:**  
      - *Issue Weighting:* "Allocate 100 points across issues (e.g., cash=40, IP=30, non-compete=30)."  
      - *Resolution Valuation:* "For each issue, assign 0–100 to possible resolutions (0 = worst, 100 = best)."  
        - *Money:* Assume linear unless specified ("Is $50k half as valuable as $100k?").  
  - **Sufficient Answer:**  
    - Consistent weights/valuations (e.g., non-compete: 0 years=100, 1 year=60, 2 years=0).  
  - **Insufficient Answer:**  
    - Rankings without cardinal scores (e.g., "I prefer IP over cash").  
    - *Mediator Response:* "Assign points so 0=worst resolution, 100=best—e.g., if no IP is 0 and full IP is 100, is partial IP 50?"

  #### **Step 3: Build Packages (Mediator, 30 min)**
  - **Objective:** Create a feasible set *S* of 6–10 packages.
  - **Process:**  
    - Combine resolutions (e.g., Package 1: $70k cash to A, IP to B, 1-year non-compete).  
    - Score packages:  
      - Utility = Σ (Issue weight × Resolution score).  
      - *Example:* A’s utility for Package 1 = (0.4×70) + (0.3×0) + (0.3×60) = 46.  
    - Remove dominated packages (non-Pareto-efficient).  
    - Compute:  
      - Disagreement utilities (d<sub>A</sub>, d<sub>B</sub>) from Step 2.  
      - Ideal gains: (u<sub>A</sub><sup>max</sup> - d<sub>A</sub>, u<sub>B</sub><sup>max</sup> - d<sub>B</sub>).  

  #### **Step 4: Compute Solutions (Mediator, 30 min)**
  - **Nash Solution:** Maximize (u<sub>A</sub> - d<sub>A</sub>) × (u<sub>B</sub> - d<sub>B</sub>) over *S*.  
  - **Kalai-Smorodinsky Solution:** Find package where:  
    (u<sub>A</sub> - d<sub>A</sub>) / (u<sub>A</sub><sup>max</sup> - d<sub>A</sub>) = (u<sub>B</sub> - d<sub>B</sub>) / (u<sub>B</sub><sup>max</sup> - d<sub>B</sub>).  
  - **Key Normalization:** Shift utilities so d = (0,0). Use *only* the 0–100 scales from Step 2—no rescaling.  

  #### **Step 5: Joint Session (60 min)**
  - **Objective:** Present and justify the proposal.
  - **Process:**  
    - If NBS and KS agree, present as "the" fair solution.  
    - If they diverge (see Section 2), say:  
      > "Two fairness standards exist:  
      > - Nash maximizes joint gains (favors equal absolute gains).  
      > - Kalai-Smorodinsky balances sacrifices (favors equal *relative* gains).  
      > I recommend [Nash/KS] because [brief rationale]."  
    - Present the package: "This gives A 70% of cash, B the IP, and a 1-year non-compete."  

  #### **Step 6: Mediator’s Proposal (30 min)**
  - Deliver a single package for accept/reject.  
  - **Script:** "This is my best judgment of a fair outcome. You have 30 minutes to sign or we adjourn."  

  ---

  ### **2. When Nash and Kalai-Smorodinsky Diverge**
  - **Practical Test (run post-Step 4):**  
    Calculate:  
    `Asymmetry Ratio = [(u_A_max - d_A) / (u_B_max - d_B)]`  
    - If **|log(Asymmetry Ratio)| > 0.5** (i.e., one party’s *potential gain* is >150% of the other’s), the solutions diverge.  
    - *Example:* A’s max gain = 80, B’s max gain = 30 → Ratio = 2.67 → |log(2.67)| = 0.98 > 0.5 → **DIVERGE**.  

  - **How to Choose:**  
    - **Use Nash if:** Parties have symmetric upside (e.g., both exiting founders).  
    - **Use KS if:** One party has far larger upside (e.g., a continuing owner).  
    - **Rationale:**  
      - KS rewards the party with greater *opportunity cost* of disagreement.  
      - Nash favors the party with a stronger *walk-away alternative*.  
    - **Mediator Judgment Required:** This is a normative choice. Say:  
      > "Economics can’t decide between these fairness axioms. I choose KS here because Partner B’s future profits depend on this deal—their sacrifice is proportionally larger if we fail."  

  ---

  ### **3. Failure Modes & Mitigations**
  #### **Normalization and Strategic Reporting**
  - **Normalization Rule:** Stick to the 0–100 scales from Step 2. *No rescaling.*  
  - **What Parties Gain by Lying:**  
    - **Inflating d:** Gains 1% in Nash outcome per 1% inflation (e.g., claiming d<sub>A</sub>=40 vs true 30 → gains 3% more in final deal).  
    - **Inflating u<sub>max</sub>:** Gains 1% in KS outcome per 1% inflation.  
  - **Mitigations:**  
    - Anchor d to verifiable data (e.g., "You said litigation nets $400k; I’ll use $350k as industry average").  
    - Cap u<sub>max</sub> at the *feasible* ideal (e.g., "You rated ‘full cash’ as 100, but maximum cash available is $500k").  

  #### **Value Destruction (Spite)**
  - **Rule:** Exclude destructive options from d (e.g., burning the codebase).  
  - **Justification:**  
    > "Threats to destroy value are (a) illegal, (b) unenforceable, and (c) punishable by courts. Your realistic d is litigation, not arson."  

  ---

  ### **4. Worked Cases**
  #### **Case 1: Job Offer Asymmetry**  
  - *Parties:* A (job offer), B (no offer).  
  - *Issues:* Cash ($100k), IP, 1-year non-compete.  
  - **d (after reality checks):**  
    - Litigation: Costs $20k each → Net cash = $60k split 50-50.  
    - A: d<sub>A</sub> = 40 (utility), B: d<sub>B</sub> = 44.  
  - **Utilities:**  
    - A weights: Cash 50, IP 30, Non-compete 20.  
    - B weights: Cash 40, IP 40, Non-compete 20.  
  - **Feasible Packages:**  
    | Package | Cash to A | IP to | Non-compete | A’s util | B’s util |  
    |---------|-----------|-------|-------------|----------|----------|  
    | P1      | $80k      | B     | 1-year      | 50       | 60       |  
    | P2      | $70k      | B     | 0-years     | 55       | 52       |  
  - **Nash:** (50 - 40) × (60 - 44) = 10 × 16 = **160 (P1)**  
  - **KS:**  
    - Ideal gains: A<sub>max</sub> = 55 - 40 = 15, B<sub>max</sub> = 60 - 44 = 16.  
    - P1: (10/15) vs (16/16) = 0.67 vs 1.0 → **Not proportional**.  
    - P2: (15/15) vs (8/16) = 1.0 vs 0.5 → **Worse**.  
    - KS requires interpolation, but P1 is closest.  
  - **Proposal:** P1 ($80k to A, IP to B, 1-year non-compete).  
  - **To Complaining Party (B):**  
    > "B, you keep the IP and pay less cash because A’s job offer gave them a stronger walk-away. Without this deal, you lose future IP value."  

  #### **Case 2: Continuing Owner**  
  - *Parties:* A (exiting), B (continuing).  
  - *d:* Business fails → $50k cash each (d<sub>A</sub>=50, d<sub>B</sub>=50).  
  - *Utilities:*  
    - A: Cash utility = % of $100k (weight 100).  
    - B: Cash utility = % of $100k (weight 50), Business utility = 100 if kept (weight 50).  
  - **Feasible Packages:**  
    - P1: A gets $x, B gets $(100k - x) + business.  
  - **Nash:** Maximize (x - 50) × (50 + 0.5(100 - x) - 50) → x = $75k.  
  - **KS:** Same (symmetry).  
  - **Proposal:** A gets $75k, B gets $25k + business.  
  - **To A (exiting):**  
    > "You get 50% more cash than your walk-away. B’s ‘extra’ $25k in utility comes from the business, not cash."  

  #### **Case 3: KS Rewards Greed (Your Prediction)**  
  - *Parties:* A (strategic), B (honest).  
  - *d:* (0, 0).  
  - *Feasible Packages:*  
    - P1: True utils (80, 40) → A claims (100, 40).  
    - P2: True utils (40, 80).  
  - **Nash:** (100 × 40) = 4,000 > (40 × 80) = 3,200 → **P1**.  
  - **KS:** Ideal gains = (100, 80). P1 ratios (1.0, 0.5) vs P2 (0.4, 1.0) → **P1 is closer**.  
  - **Proposal:** P1 (A gets 100 utils, B gets 40).  
  - **To B (short end):**  
    > "This is unfair *if* A misled us. But based on the numbers A provided, this is the ‘fair’ outcome. I’ll audit: A, did you truly value P1 at 100? If not, we reset utilities."  
  - **Why it Happened:** KS is vulnerable to u<sub>max</sub> inflation. Mitigation: Cross-check during elicitation ("Rate P1 on 0–100: if 100 is your dream outcome, is P1 really 100?").  

  ---

  ### **5. What the Procedure Cannot Do**
  - **Axioms as Value Judgments:**  
    - NBS assumes irrelevant alternatives don’t matter (controversial if new options emerge).  
    - KS assumes monotonicity (expanding the pie helps all)—but this ignores power imbalances.  
  - **Mediator’s Imposed Values:**  
    - Choosing between NBS/KS when they diverge.  
    - Defining the "realistic" d (e.g., ignoring spite).  
    - Accepting utility weights as rational (e.g., "IP is worth 100" when emotional value is higher).  
  - **Final Warning:**  
    > "This procedure applies *bargaining theory* faithfully—but fairness axioms are normative. When you pick NBS over KS, or exclude spite, you’re not just ‘computing fairness.’ You’re making ethical choices."  

  ---

  ### **Implementation Kit**
  - **Tools:** Spreadsheet for utility calculations (auto-computes NBS/KS).  
  - **Scripts:** 
    - "Help me assign points so we capture what matters most to you."  
    - "The math says Package X, but we can tweak weights if I misheard you."  
  - **Timing:** Strict 60 min/caucus—use a timer.  

  This procedure is Nash/K-S, not split-the-difference. It forces transparency about tradeoffs—which is often what angry founders need.
