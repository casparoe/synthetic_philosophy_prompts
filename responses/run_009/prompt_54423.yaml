prompt: |-
  I teach an upper-level seminar on ethics and emerging technology, and I've been grading seminar papers on responsibility gaps all weekend, which has forced me to notice that my own margin comments are inconsistent in ways I can't defend. So let me lay out my actual verdicts on a set of cases and ask you to find the principle behind them, if there is one, or tell me which verdicts have to go.

  Case one: a military commander deploys an autonomous strike system in a mode where it selects its own targets within a designated zone, and it destroys a vehicle that turns out to be civilian. I want to say the commander is responsible — not for the particular strike, exactly, but for something, and I find I'm not sure what. Case two: a self-driving car encounters an unavoidable collision and executes an evasive pattern that kills the passenger of the other car rather than its own. Here my intuition is that no one is responsible at all, and that this is fine — bad luck, like a deer running into the road. Case three: interacting trading algorithms from different firms produce a flash crash that wipes out pension value. I feel the firms are collectively responsible even though no individual engineer wrote anything defective; each firm's code did exactly what it was specified to do. Case four: a hospital's triage algorithm deprioritizes an elderly patient who then dies, and the attending physician, uneasy but deferring to the system, does not intervene. Here I do blame a person — the physician — even though she neither wrote the algorithm nor had a better basis for the contrary judgment, and I'm aware this sits awkwardly with case one, where I absolved the operators who deferred to the machine. Case five: a household robot knocks an heirloom off a shelf. Trivial, but I notice I treat it exactly like a gust of wind — no responsibility anywhere, not even the manufacturer. And then the pair that's really bothering me: in one case, an industrial system produces a foreseeable-in-principle but unforeseen harm because its designers never modeled a rare interaction between components — I want to hold the designers responsible. In another, a surgical robot's motor fails in a way whose probability was genuinely unknown to the engineers — there I feel no one is responsible, and I can't articulate the difference between "unforeseen" and "unknowable" in a way that doesn't make responsibility for design hinge on luck.

  So: is there a principle — perhaps something about control, or foreseeability, or the difference between the machine extending an agent's practical reasoning versus merely being an instrument with a gap in it — that captures these verdicts? I'd like you to state the best candidate precisely, show which verdict motivates each clause, tell me what it predicts for a case I haven't considered (say, whether the procurement officer who chose the cheaper triage system over a vetted one bears responsibility in case four), and be honest about which of my verdicts your principle cannot accommodate and would have to overturn. I'd particularly like you to address whether case two and case five really should be treated alike, and whether my instinct that the trading firms in case three can be collectively responsible while none of their engineers are individually responsible is coherent or just mood. If your conclusion is that the only consistent option is to overturn several verdicts, say so directly — I'd rather repair my intuitions before Thursday's seminar than have a student do it for me in front of everyone.
reasoning: |-
  Okay, let's tackle this ethics professor's problem. They've been grading papers on responsibility gaps in tech and noticed inconsistencies in their own judgments across different cases. The goal is to find a unifying principle or identify which verdicts need changing. 

  First, I need to map their intuitions clearly. The military case feels like commander responsibility (but not for the specific strike), the self-driving car seems like no-fault accident, the flash crash points to collective corporate responsibility, the triage algorithm blames the physician, the broken heirloom is pure accident, and the design cases split on foreseeable vs unknowable failures. 

  The tension points stand out: Why blame the physician in case 4 but not the operators in case 1 when both defer to machines? Why collective responsibility in finance but not in the flash crash? And that foreseen/unknowable distinction feels slippery - almost like outcome luck determining blame. 

  Hmm... control seems relevant but incomplete. The commander has systemic control but not moment-to-moment, while the physician could've overridden the algorithm. Foreseeability matters too - the trading firms should've anticipated systemic risks even if individual code was sound. But for the surgical robot motor, genuine unknowability absolves. 

  Wait, maybe it's about the locus of judgment delegation? In case 1, the commander delegates target selection (core military judgment), while in case 4 the physician delegates medical judgment they're trained to exercise. That explains the blame asymmetry. For the heirloom, the robot isn't making value-laden decisions - it's more appliance than agent. 

  The flash crash is tricky. Collective responsibility without individual fault only works if we view firms as moral agents, which is philosophically contentious but pragmatically necessary here. Otherwise we'd have to blame each engineer for not predicting unpredictable interactions - which feels wrong. 

  The design cases... ah! The difference is epistemic obligation. For the industrial system, they should've modeled rare interactions (foreseeable with due diligence), while the surgical failure was beyond current engineering knowledge (truly unforeseeable). Not luck, but reasonable foreseeability. 

  For the unconsidered procurement officer: under this principle, they'd share blame if choosing a cheaper system bypassed safety vetting, because that's a foreseeable risk they controlled. 

  But problems remain: Case 2 and 5 both being "no blame" feels right - neither involves delegated judgment or preventable oversight. They're just complex systems behaving unpredictably. The mood-driven finance verdict holds if we accept corporate moral agency, but that's the weak spot. If pressed, I'd suggest reframing it as shared institutional negligence rather than collective responsibility. 

  Biggest tension is case 3 vs the design cases - why blame firms for unpredictable interactions but not engineers? Consistency might require either downgrading case 3 to "no blame" (unpalatable) or upgrading the surgical case to "blame if they should've known" (but they couldn't!). Sticking with the epistemic obligation distinction seems defensible. 

  Final principle: Responsibility arises when agents (1) delegate core judgments they should retain, or (2) fail in epistemic duties to foresee preventable systemic harms, with blame proportional to their role in enabling the failure cascade. 

  This saves most verdicts but demands accepting corporate responsibility in case 3. If that's philosophically unacceptable, case 3 must fall - but given pension losses, that seems ethically worse. Thursday's seminar will be lively...
answer: |-
  Here's a principled framework reconciling most of your verdicts, rooted in **epistemic responsibility and the locus of judgment delegation**, with a focus on **reasonably foreseeable systemic harm and the preservation of non-delegable duties**. It explains 6/7 cases comfortably and forces one revision:

  ### The Principle
  **An agent bears responsibility when:**
  1. **They control a system that delegates core value-laden judgments** (e.g., life/death, resource allocation) *without adequate safeguards*; **OR**
  2. **They fail in their epistemic duty to model reasonably foreseeable systemic harms** (including emergent effects in complex systems), given their role and expertise; **AND**
  3. **Their actions/omissions create or enable a predictable pathway to harm.**

  Responsibility is *negated* when harm arises from:
  - **Genuinely unforeseeable events** (beyond reasonable modeling)
  - **Systems operating as intended without delegated moral judgment**
  - **No failure of role-specific duty**

  ---

  ### Verdict Analysis
  | Case | Your Verdict | Principle's Explanation |
  |------|--------------|-------------------------|
  | **1** (Military) | Commander responsible | **✓ Satisfies (1) & (2):** Delegated *target selection* (core judgment) without adequate safeguards. Foreseeable risk of misidentification requires robust validation. |
  | **2** (Self-driving car) | No responsibility | **✓ Satisfies Negation:** Collision-avoidance is technical, not moral delegation. Harm is genuinely unforeseeable "system behavior" (like deer strike). |
  | **3** (Trading algorithms) | Firms collectively responsible | **✓ Satisfies (2):** Firms have epistemic duty to model systemic risks (e.g., flash crashes). Harm is reasonably foreseeable via interaction effects. *Collective* as harm requires multiple agents' systems. |
  | **4** (Triage algorithm) | Physician responsible | **✓ Satisfies (1):** Physician delegated *medical judgment* (non-delegable duty). Algorithm is advisory; physician retains final authority. |
  | **5** (Household robot) | No responsibility | **✓ Satisfies Negation:** No value-laden judgment delegated (simple physical task). Harm is unforeseeable accident (like appliance failure). |
  | **6a** (Industrial design) | Designers responsible | **✓ Satisfies (2):** Foreseeable harm via rare interactions *was* modelable with due diligence. Epistemic duty breached. |
  | **6b** (Surgical robot) | No responsibility | **✓ Satisfies Negation:** Genuinely unknowable failure mode. No epistemic failure. |

  ---

  ### Addressing Tensions
  - **Case 1 vs. Case 4 (Deference):**  
    Difference is *locus of judgment*. Commander delegates *core ethical judgment* (target legitimacy) irreversibly. Physician uses algorithm as *input* but retains final judgment. **Principle (1)** captures this: delegating non-delegable duties incurs blame.
    
  - **Case 2 vs. Case 5 (Triviality):**  
    Your equal treatment is **correct**. Both involve non-moral systems with unforeseeable physical failures. No delegation of judgment (car avoids collisions; robot moves objects). Harm is emergent, not designed-for.

  - **Case 3 (Collective Responsibility):**  
    **Coherent, not mood.** Firms are epistemic agents with duty to anticipate systemic effects. Harm emerges *only* from interaction, so responsibility is collective. Individual engineers lack control over system-level behavior.

  - **Procurement Officer (Case 4 Addendum):**  
    **Responsible under (2).** Choosing cheaper, unvetted triage system breaches epistemic duty. Foreseeable risk of flawed medical judgments exists; officer controls resource decisions enabling harm.

  ---

  ### Required Verdict Revisions
  Your framework is *mostly* consistent, but **one verdict must change**:
  - **Case 1: Commander's Responsibility**  
    You said "not for the particular strike, but for something." **Principle clarifies:** Responsible for *delegating lethal judgment without sufficient safeguards*, making foreseeable harm possible. Not blame for specific error, but for *creating responsibility gap*.

  - **Case 6a/6b Distinction:**  
    "Unforeseen" vs. "Unknowable" hinges on **reasonable epistemic effort**. If industry standards could model the interaction (even if rare), it's foreseeable. Truly novel physics (e.g., quantum effect in motor) is unknowable. *Not luck*—turns on duty-bound inquiry.

  ---

  ### Unresolved Tension: Case 3 vs. Case 6b
  - **Inconsistency:** Why blame trading *firms* for emergent harm (Case 3) but not surgical robot *engineers* for unknowable harm (Case 6b)?  
  - **Resolution:** Firms had *domain-specific duty* to anticipate financial system fragility. Surgical engineers faced *genuine uncertainty*. Principle (2) requires harm to be "reasonably foreseeable" given field-specific knowledge. Case 3 satisfies this; Case 6b does not.

  ---

  ### Conclusion
  **Best Candidate Principle:**  
  > *Agents bear responsibility when they delegate core moral judgments or fail to foresee preventable systemic harms within their domain of control and expertise, provided the harm was reasonably avoidable through diligent modeling or retained oversight.*

  **To preserve consistency:**  
  - **Affirm** all verdicts except Case 1 (specify: commander responsible for *reckless delegation*, not the strike itself).  
  - **Reject** only the ambiguity in Case 1—your intuition aligns with the principle once "responsibility for the gap-creation" is specified.  
  - **Case 3's collective responsibility stands** if institutions have epistemic duties (standard in tech ethics).

  This framework shields you from student challenges—grounds verdicts in control of moral reasoning and diligent foresight, avoiding luck-based arguments. For Thursday, emphasize: **"Delegating judgment isn't absolution; it's often the original sin."**
