answer: |-
  You're absolutely right to call out this contradiction—it's not just a theoretical glitch, it's the central tension in how digital platforms engineer social proof. Here's my unequivocal position: **the standard practice of displaying real-time aggregates is philosophically incoherent.** It implicitly relies on two mutually exclusive models of human judgment:

  1.  **The "Wisdom of Independent Crowds" Model:** Aggregates reflect objective quality through the statistical magic of independent signals converging. (The *assumption* platforms *claim* to operate under.)
  2.  **The "Signaling & Herding Fuel" Model:** Aggregates are powerful social signals that actively *distort* subsequent judgments and behaviors, making popularity self-reinforcing. (The *reality* their *designs exploit*.)

  Platforms *need* the first model for legitimacy ("These numbers *mean* something true!") but *rely* on the second for virality, engagement, and lock-in ("Look how popular this is—join the crowd!"). This isn't subtle; it's a fundamental hypocrisy baked into the architecture.

  **Why it's incoherent:**

  *   **Poisoned Signals:** As you astutely note, displaying the aggregate *before* the individual judgment (or consumption choice) irrevocably contaminates the "signal." Your rating isn't independent data about the product; it's a reaction *to* the existing social proof (conformity bias, anchoring, bandwagon effect).
  *   **Self-Fulfilling Prophecies:** Early advantage (often random—a few positive reviews by chance, a niche community liking something first) becomes amplified by the display mechanism. High visibility → more engagement/ratings → higher aggregates → even more visibility. This creates "quality mirages" where popularity ≠ inherent value, but merely reflects path dependence.
  *   **Platforms Know & Exploit This:** Instagram hiding likes was a tacit admission. Yet "Trending," "Bestseller," and "X people bought this" badges are *deliberate* herding triggers. They *want* the cascade because it drives faster decisions, higher conversion rates, and network effects that lock users in. The widget collecting your vote *before* showing the average is a rare, half-hearted nod to the problem, but it's drowned out by a sea of salience-driven popularity displays.

  **What a "Cascade-Worried" Platform Would Actually Do:**

  If a platform genuinely believed ratings should reflect independent judgments converging on objective quality (Model 1), and took the cascade threat seriously, it would radically redesign:

  1.  **Sequential Revelation Without Running Totals:** Imagine reading reviews *without* seeing the star rating or helpful count *first*. You'd form your own impression, *then* see how others voted *after* you submit your rating (or perhaps only after consuming the product). This preserves independence *during* the judgment phase. Think blind wine tasting before seeing the price or critics' scores.
  2.  **Delayed or Hidden Aggregate Salience:** Hide *all* aggregate signals (likes, view counts, purchase counts, ratings) *until* a user has interacted with the content (e.g., after reading a review/article, watching a video, maybe even after purchase). Or display them only in a non-salient way (e.g., buried in a details tab, not next to the title/thumbnail).
  3.  **Personalized Relevance Over Global Popularity:** Radically deprioritize "Most Popular" or "Trending" lists. Instead, emphasize "Recommended *for you* based on *your* past likes/purchases" using sophisticated collaborative filtering *without* injecting global popularity bias into the algorithm's weighting. Show "People *like you* also liked..." not "Everyone is buying this!".
  4.  **Friction Against Bandwagoning:** Introduce micro-frictions. Instead of a prominent "Like" button with a giant counter, require a reason for upvoting/downvoting (even a simple tag). Make following trends slightly less effortless.
  5.  **Highlight Disagreement & Nuance:** Algorithmically surface thoughtful *dissenting* reviews alongside positive ones for popular items. Emphasize review *text* over simple star aggregates. Show distributions, not just averages.

  **What Would Be Lost (Why Platforms Don't Do This):**

  1.  **The Virality Engine:** Herding *works*. Salient popularity signals drive impulsive engagement and purchases. Removing them slows down the "snowball effect" crucial for rapid growth and locking in market leaders. It makes discovery feel harder and less certain.
  2.  **Reduced Engagement & Dwell Time:** The dopamine hit of joining a visible trend or seeing your contribution boost a visible counter is powerful. Blind judgment feels less immediately rewarding. Friction reduces clicks.
  3.  **Commoditization Risk:** If popularity isn't constantly shoved in users' faces, it becomes harder for platforms to *create* and *monetize* hits. "Bestseller" badges are marketing tools for the platform itself, driving sales velocity for featured products (often tied to advertising).
  4.  **Perceived "Cold Start" Problem:** New content without visible social proof might struggle even more to gain traction initially. Platforms fear this inertia (though good relevance algorithms can mitigate it).
  5.  **Simplicity & Cognitive Ease:** Aggregates offer a cheap, fast heuristic. Forcing independent judgment takes more mental effort, which users often resist.

  **The Uncomfortable Conclusion:**

  The standard practice isn't broken; it's functioning *exactly as designed*, but under a different, unstated epistemology: **Ratings aggregates are primarily evidence of *social momentum*, not objective quality.** Platforms display them because they *work* to manipulate behavior in ways that serve platform goals (engagement, growth, sales), *despite* corrupting the very "wisdom of crowds" they nominally invoke. The incoherence isn't a bug; it's the profitable core of the business model. A platform genuinely committed to Model 1 would look very different and likely be less commercially explosive—which is why you won't see it dominate anytime soon. Your unease is justified; you're seeing the fundamental tension between epistemic honesty and behavioral manipulation baked into the web.
