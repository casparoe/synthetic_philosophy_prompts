  ### Adjudication: The Two-Envelope Paradox Dispute

  **Scorecard**  
  *(Ratings and justifications for each move, approximately half the response)*

  1.  **Ravi’s initial argument (expected value calculation):**  
      *Rating:* **Clearly mistaken**  
      *Justification:* His core assumption—that the other envelope contains \(X/2\) or \(2X\) each with probability \(1/2\), *whatever* \(X\) is observed—is unjustified. This treats the conditional probability as fixed without considering how the envelopes were filled, which is mathematically incoherent for arbitrary \(X\). It’s the root of the paradox.

  2.  **Marta’s symmetry objection (infinite swapping):**  
      *Rating:* **Mostly right**  
      *Justification:* Her intuition that Ravi’s reasoning leads to absurdity (endless swapping) is correct and highlights a flaw. However, she leans too heavily on "symmetry" alone without pinpointing *why* the symmetry fails after conditioning, which weakens her rebuttal at this stage.

  3.  **Ravi’s reply on conditioning and symmetry:**  
      *Rating:* **Partially right**  
      *Justification:* He is correct that unconditional symmetry doesn’t guarantee conditional symmetry (e.g., observing \(X\) might break symmetry if \(X\) is extreme), and his arithmetic *would* hold *if* the 50-50 probability were valid. But he sidesteps Marta’s valid concern about *why* that probability assumption is faulty.

  4.  **Marta’s distribution argument (the "cheat"):**  
      *Rating:* **Clearly right**  
      *Justification:* This nails the core error: the 50-50 probability assumption is unsustainable under any proper prior distribution over possible sums. Observing \(X\) provides evidence about which envelope you hold (e.g., large \(X\) suggests you likely have the larger amount), tilting the probabilities. Her point that averaging correctly removes the "profit" is mathematically sound and resolves the paradox for ordinary cases.

  5.  **Ravi’s infinite-expectation counterexample:**  
      *Rating:* **Partially right but misguided**  
      *Justification:* His construction (e.g., amounts \(2^n\) chosen with probability \(1/2^{n+1}\)) correctly shows that if the prior distribution has infinite expectation, the conditional 50-50 probability *can* hold for all \(X\), making swapping beneficial. However, this doesn’t vindicate his original argument—it’s a pathological edge case irrelevant to "ordinary" envelopes. He overextends it to defend the initial fallacy.

  6.  **Marta’s rebuttal on the infinite case:**  
      *Rating:* **Clearly right**  
      *Justification:* She correctly notes that infinite expectations invalidate standard decision theory (expected values don’t converge, so "profit" is ill-defined), making comparisons meaningless. Her distinction—that this is a curiosity, not a defence of the original paradox—is apt. It underscores that Ravi’s example avoids the error only by breaking the assumptions of "ordinary" decision problems.

  **The real error**  
  The original switching argument fails because it assumes, without justification, that \(\mathbb{P}(\text{other is } 2X | X) = \mathbb{P}(\text{other is } X/2 | X) = 1/2\) for *any* observed \(X\). This assumption is inconsistent with any well-defined prior probability distribution over the envelope amounts with finite expectation. Upon observing \(X\), the conditional probability depends crucially on the prior likelihood of the pair \((X/2, X)\) versus \((X, 2X)\). For example, if larger sums are less probable, seeing a very large \(X\) makes it more likely that you hold the larger envelope, skewing the probabilities away from 50-50. Marta’s diagnosis in move 4 precisely captures this: the "equal probabilities" are the cheat, and proper Bayesian conditioning under a realistic distribution resolves the paradox by showing no expected gain from swapping.

  **What both miss**  
  Neither fully addresses the role of **improper priors** or **subjective uncertainty** in practical interpretations. Ravi’s infinite-expectation case implicitly uses an improper prior (a distribution that can’t be normalised), which *allows* the 50-50 assumption but renders expectations incoherent—a nuance Marta only gestures at. Conversely, Marta doesn’t emphasise that in real-world scenarios, where people implicitly assume bounded or "reasonable" sums, the paradox dissolves entirely: if you open £50, common sense suggests the other envelope is likelier to be £25 than £100 unless context implies larger sums are plausible. Additionally, both overlook that the paradox can arise from **framing the observed value absolutely** rather than relative to the distribution. If you condition on the *ratio* (which envelope you hold), not the absolute amount \(X\), symmetry holds and swapping has no expected gain—but Ravi’s argument confounds absolute and relative conditioning.

  **Where I could be wrong**  
  My harshest rating—Ravi’s move 3 as "partially right"—might be too charitable. Some argue that conditioning *always* respects the original symmetry if no information breaks it, potentially invalidating his claim. If so, his defence collapses entirely. Conversely, my endorsement of Marta’s move 6 could be fragile: if one adopts a non-standard decision theory (e.g., rank-dependent utility) that handles infinite expectations, Ravi’s pathological case might genuinely favour swapping, weakening her "meaningless" objection. An example like a bounded variant of Ravi’s distribution (e.g., sums capped at \(2^{100}\)) could force a rethink—here, swapping *is* beneficial for moderate \(X\), potentially blunting Marta’s "ordinary envelopes" distinction.
