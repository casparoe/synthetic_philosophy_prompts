prompt: |-
  Please take the role of a professional philosopher with expertise in Adam Smith's moral psychology and in philosophy of law. I'm on my high school's mock trial team, and the "reasonable person" standard has started to bother me. In a negligence case, the jury judges the defendant against a reasonable person who is neither the average person nor the actual defendant — a driver's slow reflexes don't excuse him. But in self-defense cases, courts do allow the defendant's physical characteristics, age, and even a history of being abused to color what fear counted as reasonable. So the standard sometimes absorbs the defendant's own situation and sometimes deliberately wipes it out, and I can't find the line. Before answering, please brainstorm several candidate theories of moral judgment that the practice might be implicitly relying on, and then settle on the best one. In particular: does the practice presuppose something like Smith's impartial spectator — a spectator who sympathizes with the agent's actual circumstances but corrects for partiality — and can that ideal explain why self-defense goes partly subjective while negligence stays objective? Distinguish what the practice strictly presupposes from what it merely fits well with, say honestly where the practice is underdetermined enough that rival theories would license it equally, and tell me whether Smith's own apparatus would endorse the split or reveal that the practice has no coherent implicit theory at all.
