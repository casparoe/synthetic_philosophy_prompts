prompt: |-
  I've got a draft essay for our department's philosophy society blog thing (mixed audience — a few people who know Scanlon properly, mostly people who did one ethics course) and I want comments before I send it round. The essay is on contractualism and aggregation, arguing for a move I haven't seen anywhere but which feels like it must exist somewhere, so one thing I want from you is whether I've accidentally reinvented someone else's view.

  Here's the draft in compressed form:

  **Para 1 (setup).** Contractualism as I present it: an act is wrong if it would be permitted by no principle that no one could reasonably reject. The individualist restriction: the strength of anyone's objection to a principle is fixed by how that principle bears on them taken individually — you can't add up lots of people's small burdens into one big complaint. Hence the aggregation problem: contractualism seems to say you may impose one death rather than any number of minor headaches, which strikes most people as badly wrong.

  **Para 2 (the two-sided evidence).** On the one hand, transmitter-room style cases (one person bears something terrible so millions can watch a broadcast) — we side with contractualism's answer. On the other hand, in rescue cases numbers obviously matter, and contractualism handles that by saying each of the fifty has an individual complaint of being allowed to die, as strong as the one person's. So numbers matter within a kind of burden but not between kinds. Fine so far, and fairly standard.

  **Para 3 (my move).** The standard reading treats the restriction as a ban on adding across persons. I argue the deeper reading is a ban on adding across *kinds* of burden. Complaints of the same kind can be summed (that's how rescue works); but a complaint below a certain severity can never be converted, by sheer numbers, into a complaint of a higher kind. Call it the kind-matching rule. Non-aggregation isn't an extra axiom bolted on, it falls out of what kinds of complaint there are.

  **Para 4 (test case).** The itch dome: a council can run a midge-spraying programme giving 400,000 residents mildly more comfortable summers, at the predictable cost of one random resident recieving a permanent severe painful condition. Kind-matching says don't spray — the mild complaints aggregate to 400,000 but stay within their kind, and the severe condition is another kind entirely. But then I notice: rescue cases where you can save one from death or fifty from permanent paralysis look like cross-kind comparisons too, and there we do want to compare. My draft tries to say paralysis and death are near enough the same kind while itchiness is not, which felt slippery as I typed it.

  **Para 5 (the answer I attempt).** I appeal to what a principle is like to live under: the person with the permanent condition can confront the spraying principle and say it makes their life go a certain way that no number of slightly nicer summers could count against in a way they must recognise. I think this is supposed to do the kind-matching work for me, but reading it back I worry its just hand-waving dressed up.

  What I want from you:

  1. Have I got Scanlon right in para 1-2, or am I flattening him somewhere it matters?
  2. Does the kind-matching rule actually explain non-aggregation, or is it a restatement of it in fancier language? Be honest — I can tell they're suspiciously close.
  3. Does the itch dome case help me or sink me, given the paralysis wrinkle in para 4?
  4. Is there an obvious published view this is a worse version of? (Tell me the shape of it in general terms — I can chase references myself, I just want to know if the territory is occupied.)
  5. Is para 5 doing any work at all, and if not, is there a way to make it do some?

  Be blunt, I'd rather rewrite it now than get taken apart at the reading group next week. Also, its due Friday, so sooner is better.
reasoning: |-
  Okay, let me start by understanding the user's draft and their concerns. They're working on an essay about contractualism and aggregation, specifically addressing the aggregation problem within Scanlon's framework. The key idea they propose is the "kind-matching rule," which suggests that complaints can only be aggregated within the same kind of burden. 

  First, I need to check if their interpretation of Scanlon is accurate. From what I remember, Scanlon does emphasize the individualist restriction, but he allows for aggregation in same-burden cases like the rescue example. The user seems to have that right in paras 1-2. But maybe they're oversimplifying by not mentioning how Scanlon handles varying burdens through pairwise comparison. That could be a point to note.

  Next, the kind-matching rule. The user is worried it's just a restatement of non-aggregation. They might be onto something, but the distinction between kinds of burdens could add depth. However, defining what constitutes a "kind" is tricky. If they can't clearly differentiate between paralysis and death versus itchiness and severe pain, the rule might not hold. That's a potential weakness they need to address.

  The itch dome case is interesting. It tests their rule, but the paralysis comparison in rescue cases creates a problem. If paralysis and death are considered the same kind, why not severe pain and aggregated discomfort? The user's attempt to use the "living under a principle" idea in para 5 feels vague. It might not resolve the inconsistency. They need a better criterion for kind differentiation, maybe involving incommensurability or qualitative thresholds.

  Regarding existing literature, F.M. Kamm's work on non-consequentialism and aggregation comes to mind. Her distinctions between types of harms might be similar to the user's kind-matching. Also, Joseph Raz's incommensurability could relate. The user should check these to avoid reinventing the wheel.

  Para 5's appeal to principles' lived experience needs more substance. It's not clear how it defines kinds. Suggesting they tie it to autonomy or fundamental interests might strengthen it. But they have to be careful not to rely on Scanlon's own ideas too much without adding new insight.

  The user's deeper needs: They want validation but also honest critique to avoid embarrassment in their reading group. They need actionable feedback quickly, given the deadline. Their anxiety about originality and coherence is evident. Providing clear points on where to focus revisions will help them prioritize. Highlighting the paralysis vs. itch dome inconsistency is crucial because it's a major flaw they already sense but haven't resolved. Encouraging them to define "kind" more rigorously or adopt a threshold might save their argument. Also, pointing them to Kamm and Raz gives them references to bolster their position or adjust it accordingly.
answer: |-
  Okay, let's dissect this draft. You're tackling a core problem well, and the "kind-matching" move is intuitive, but it needs tightening. **Be blunt? You got it.**

  **1. Scanlon Accuracy (Paras 1-2):**
  *   **Mostly Right:** You've captured the core contractualist formula ("wrong if...") and the individualist restriction accurately. Your transmitter-room (death vs. headaches) vs. rescue (one death vs. fifty deaths) distinction is spot-on for illustrating the aggregation problem and Scanlon's solution for "same burden" cases.
  *   **Minor Flattening/Where it Matters:** You slightly oversimplify *how* Scanlon justifies numbers mattering in rescue cases. He doesn't *just* say each has an equally strong complaint. He emphasizes **pairwise comparison**: When comparing principles (save the one vs. save the fifty), *each* person in the fifty has a stronger complaint *against the principle that saves the one* (it leaves them to die when saving them was possible) than the single person has *against the principle that saves the fifty* (it leaves him to die *only because* saving the fifty was also possible). The individualist restriction means we compare the strength of *one person's* complaint under Principle A to *one person's* complaint under Principle B. In rescue, for each person in the fifty, their complaint under the "save one" principle is just as strong as the single person's complaint under the "save fifty" principle. That's why the fifty complaints collectively outweigh the one. This nuance matters because your "kind-matching" needs to plug into this comparative structure cleanly. Your description ("each has an individual complaint... as strong") gets the consequence right but slightly glosses the comparative mechanism.

  **2. Kind-Matching vs. Restatement:**
  *   **Honestly? It's currently more restatement than explanation.** You're absolutely right to be suspicious. Saying "complaints of the same kind can be summed, different kinds cannot" *is* essentially equivalent to "you can't add different kinds of burdens across persons." You've renamed the problem, not solved it.
  *   **Potential for Explanation?** The *promise* of explanation lies in **defining what constitutes a "kind" independently of aggregation rules**. If you can give a robust, non-circular account of what makes burdens the *same kind* vs. *different kinds* – an account that *explains why* summing is only permissible within kinds – *then* it becomes explanatory. Right now, "kind" is doing the same work as "burden type for which aggregation is allowed," which is circular. **The burden is on you to define "kind" without relying on aggregation intuitions.** What *makes* death and paralysis "the same kind" while death and mild headaches are not? This is the core challenge your para 5 *attempts* to address.

  **3. Itch Dome & Paralysis Wrinkle:**
  *   **Sinks You (In Current Form):** This is the major hole, and you rightly sensed the slipperiness. Your draft *needs* the paralysis/death case to be same-kind to make rescue work, but then the itch dome case *relies* on severe pain/mild discomfort being different kinds. The problem is:
      *   **Similarity Argument Fails:** Why is paralysis "near enough" death for aggregation *across* them (saving 50 from paralysis vs. saving 1 from death), but severe permanent pain is *not* "near enough" to aggregated mild discomfort? Both involve comparing burdens of significantly different magnitudes and perhaps natures. The "near enough" feels entirely ad hoc to get the desired results in different cases.
      *   **Undermines Kind-Matching:** If you allow cross-kind comparison between paralysis and death (which you *must* for rescue), then why can't we compare the aggregated mild discomfort (a huge burden of one *kind*) to the single severe pain (a burden of a *different* kind) in the itch dome? Your rule seems inconsistently applied. **This is the biggest threat to your view.**

  **4. Obvious Published Views:**
  *   **Yes, this territory is heavily occupied.** Your move bears significant resemblance to (and is likely a reinvention of parts of) **F.M. Kamm's** work, particularly her **"Principle of Contextual Interaction"** and discussions of **"Intransitivity and Aggregation."** Kamm explicitly argues that whether burdens are "relevant alternatives" or "in the same sphere" affects aggregation. She distinguishes types of harms (e.g., death vs. lesser harms) and argues aggregation is only permissible within types or under specific comparative structures. Her work is dense but directly tackles your itch dome/paralysis comparison problem by trying to define relevant types/spheres. (Key works: *Morality, Mortality Vol. 1*, *Intricate Ethics* - Ch. 10 on aggregation).
  *   **Other Shapes:**
      *   **Threshold Views:** Some argue burdens below a certain severity *cannot* aggregate *at all* to outweigh a burden above a threshold (e.g., death, severe disability). This resembles your "higher kind" idea. (See discussions related to "deontological thresholds").
      *   **Incommensurability:** Philosophers like **Joseph Raz** argue some values/burdens are incommensurable – you *can't* rationally compare them via a common scale. If death and mild headaches are incommensurable, aggregation *across* them is impossible. Your "different kinds" leans this way. (*The Morality of Freedom*).
      *   **Scanlon Himself (Deeper Dive):** Scanlon's own appeal to the "generic reasons" of individuals and the "significance" of burdens *hints* at qualitative differences that might block certain aggregations, but he doesn't formalize it as a "kind-matching rule." Your para 5 move is closer to his spirit.

  **5. Para 5: Work & Potential:**
  *   **Current State:** It's **not doing enough work, and it *is* hand-waving**. Saying "no number of nicer summers could count against... in a way they must recognise" is just restating the intuition that different burdens are incomparable in that context. It doesn't *define* what makes them different kinds or *why* recognition fails here but succeeds in paralysis/death. It's evocative but lacks argumentative teeth.
  *   **Potential to Do Work:** This *could* be the seed of defining "kinds." Here's how to make it work:
      *   **Anchor it in Scanlon's Framework:** Connect "living under a principle" more tightly to **"generic reasons"** and what principles **"no one could reasonably reject"**. Argue that reasonable rejection depends on whether a burden fundamentally undermines central human interests/autonomy in a way that lesser burdens, *however multiplied*, do not. The severe pain victim can argue the principle fails to respect her status as someone whose *fundamental interest in avoiding crippling suffering* is being sacrificed for mere conveniences. The paralysis victim facing death *cannot* make a similarly fundamental complaint *against* saving the others from paralysis *instead* of her from death, because being saved from paralysis *also* protects a fundamental interest (avoiding severe disability). Both involve core interests.
      *   **Focus on Asymmetry:** Emphasize the *asymmetry* in the itch dome: The severe pain victim is being *used* in a way the aggregated mild sufferers are not. Their complaint is qualitatively different – about being *sacrificed* for aggregated minor gains. In the paralysis/death rescue, *each* person is potentially the one sacrificed under the alternative principle; it's symmetrical. Principles involving *sacrifice* of fundamental interests for aggregated minor gains are uniquely rejectable.
      *   **Be Specific about "Counting Against":** Don't just say "count against." Argue that aggregated minor burdens *cannot provide a countervailing reason strong enough to justify imposing a catastrophic burden on one person*. The nature of the catastrophic burden blocks the justificatory force of the aggregated minor reasons. This starts defining a "kind" as burdens that block justification in this way.
      *   **This Makes Para 5 CRITICAL:** If you take this route, Para 5 becomes the core argument for *why* your "kinds" exist and *how* they function within contractualist reasoning. It needs expansion and rigor.

  **Blunt Summary & Action Plan:**

  1.  **Fix the Scanlon Nuance:** Clarify the pairwise comparison aspect in Para 2.
  2.  **Define "Kind" Rigorously:** This is the linchpin. Your view lives or dies on this. You *must* give a non-circular definition based on fundamental interests, generic reasons, incommensurability, or blocking justification. **Para 5 is your battleground.** Expand it significantly. Root it in what makes a burden "reasonably rejectable" in a way aggregated minor burdens cannot counter.
  3.  **Solve the Itch Dome/Paralysis Problem:** Your biggest weakness. Use your refined "kind" definition to explain clearly *why* paralysis and death *are* comparable within the rescue structure (both threaten fundamental functioning/autonomy in a way aggregated mild discomfort does not, or perhaps the symmetry argument) while severe pain and mild discomfort are not (asymmetry, sacrifice for trivial gains). Explicitly address the comparison.
  4.  **Acknowledge & Cite Kamm (et al):** Don't pretend this is wholly original. A footnote or brief acknowledgment strengthens you: "This move resonates with distinctions drawn by Kamm (Ref) regarding relevant types of burdens..." It shows awareness and positions your view within the debate.
  5.  **Structure:** Consider swapping Paras 4 & 5. Present the itch dome *after* you've developed your "kind" definition via the "living under a principle" argument. Use itch dome as the *test* for your newly defined view.

  **Bottom Line:** The core intuition (kind-matching) is good and potentially Scanlonian, but it's currently underdeveloped and vulnerable, especially to the paralysis counterexample. **Focus relentlessly on defining "kind" non-circularly and solving the itch dome/paralysis asymmetry.** Para 5 is where the action is – make it earn its keep. Good luck for Friday! This has genuine potential if you nail the definition.
