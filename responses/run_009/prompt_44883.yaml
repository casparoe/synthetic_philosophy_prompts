answer: |-
  Your request cuts to the heart of fascinating tensions within and between these systems. Let's analyze your two less-traveled issues:

  **1. Skillful Means (Upāya) vs. Rule Consequentialism: The Anti-Collapse Mechanism**

  *   **The Structural Similarity:** Yes, the comparison holds *superficially*. Both seem to endorse general rules (e.g., "don't lie") justified by their beneficial consequences (promoting trust, preventing harm). Both allow exceptions when adherence would cause greater harm or prevent significant good (the compassionate lie to save children from a burning house; the lie to spare the dying man anguish).
  *   **The Collapse Problem for Rule Consequentialism:** Standard rule consequentialism struggles with the "collapse" problem: If the rule is overridden whenever breaking it produces *better overall consequences*, then the rule effectively vanishes, reducing the system to *act* consequentialism. Rules lose their distinct normative force.
  *   **Buddhism's Anti-Collapse Mechanism: Moral Psychology & Cultivation:** Buddhism avoids this collapse precisely through its focus on **intention, mental state cultivation, and the agent's spiritual development**.
      *   **Motivation as the Gatekeeper:** The override clause isn't triggered *simply* by predicting better consequences. It's triggered *only* when the act is **motivated by genuine, non-attached compassion (karuṇā) and guided by wisdom (prajñā)**. The father in the burning house parable isn't calculating net utility; he's acting from overwhelming, spontaneous compassion for his children's imminent peril. The "better consequence" is the *expression* of that compassion, not its *justification*.
      *   **Cultivation, Not Calculation:** Precepts (śīla) are primarily **training rules (śikṣāpada)**. Their purpose is to habituate the mind away from greed, hatred, and delusion, and towards generosity, loving-kindness, and wisdom. Strict adherence cultivates these qualities. Breaking a precept *without* the requisite motivation (e.g., lying out of convenience or malice) reinforces unwholesome mental states, hindering progress towards liberation.
      *   **The Agent-Centered Anchor:** The "stability" comes from grounding the exception not in a *recalculation of external outcomes*, but in the **quality of the agent's mind at that moment and its long-term developmental trajectory**. The compassionate lie is permissible *because* it arises from and *further cultivates* the wholesome root of non-attached compassion. Breaking the precept *without* this motivation cultivates unwholesome roots. The rule isn't just a utility-maximizing guideline; it's a tool for inner transformation. The "escape clause" requires the practitioner to have already developed sufficient wisdom and compassion to discern the rare, genuinely compassionate necessity *without* falling into self-serving rationalization.
  *   **Consequence:** Buddhist ethics doesn't reduce to act consequentialism because the primary moral criterion isn't *just* the external consequence, but the **karmic quality of the intention and its effect on the agent's path**. The rule retains force as a training tool, and its violation is only "skillful" when it demonstrably springs from and strengthens the very virtues the rule exists to cultivate.

  **2. Rebirth & the Agent/Patient Distinction: Hyper-Consequentialism or Egoism in Disguise?**

  *   **The Blurred Distinction:** You perfectly capture the strangeness. Karmic consequences manifest in a continuum (the five aggregates/skandhas) causally linked across lives, but without a permanent self (anātman/anattā). Harming another being creates suffering for a future being intimately causally connected to *your* current intentional act, yet not "you" in a strict identity sense.
  *   **Hyper-Consequentialism?** There's a strong argument for this. Buddhism insists on tracking the **full, long-term karmic consequences of actions with meticulous precision** across potentially infinite lifetimes. Consequentialism typically focuses on foreseeable consequences within a lifetime or limited future. Buddhism's scope is vastly broader and, in theory, perfectly tracks cause (intention/action) and effect (vipāka, the karmic result). It demands impartial consideration of consequences for *all* sentient beings across time, which aligns with consequentialism's impartiality in principle.
  *   **Undermining Impartiality? Paradoxical Self-Interest:** However, this structure creates a unique tension:
      *   **The Personal Stakes:** While the suffering being is not *identical* to the actor, the karmic link creates an **inescapable, deeply personal stake for the actor's continuum**. Negative karma *will* ripen as suffering *for you/your continuum*. This injects a powerful element of **enlightened self-interest** into ethics. Avoiding harm to others isn't *just* for their sake; it's to avoid future suffering for "yourself" (the continuum).
      *   **Categorical Difference?** Does this make harm to "one's own future continuum" categorically different? **Not in its inherent wrongness**, as harming *any* sentient being creates negative karma and suffering. The core wrong is causing suffering, period. *However*, the **motivation and psychological weight** differ significantly. The direct karmic link to one's own future suffering provides an additional, powerful *prudential* reason to avoid harmful actions, beyond the compassionate reason to avoid harming others. It doesn't make harming others *less* wrong, but it makes avoiding harm *more* compellingly self-interested.
      *   **Impartiality vs. Prudential Reinforcement:** This doesn't necessarily *undermine* impartiality in the core ethical judgment ("causing suffering is bad"). Instead, it **superimposes a strong prudential incentive *for* impartiality.** Acting ethically towards others becomes synonymous with acting in the long-term best interest of your own continuum. The system leverages self-concern to motivate other-concern.
  *   **Consequence:** Buddhist ethics is arguably *more thorough* in its consequentialism due to its vast scope and karmic mechanics. However, the personal karmic link creates a unique motivational structure where pure altruism and profound self-interest become intertwined paths to the same ethical behavior, potentially strengthening adherence but also introducing a complex psychological dimension absent in standard consequentialism.

  **The Dying Man Case: Motive as the Crucial Divergence**

  *   **Base Case (Compassionate Lie):**
      *   **Consequentialist:** Approves. The lie prevents significant suffering (the man's anguish) with no apparent negative consequences (undiscovered, only good effects). Net positive utility.
      *   **Buddhist:** *Can* approve, **but conditionally**. Approval hinges on the **genuine motivation of compassion and wisdom**. If the caretaker acts from pure, non-attached compassion to spare suffering, guided by wisdom that the lie is truly necessary and beneficial *for the dying man*, it could be seen as skillful means (upāya), generating positive karma.
  *   **Varied Case (Convenience Lie, Same Consequences):**
      *   **Consequentialist:** **Approves.** The consequences are identical – the man dies peacefully, no harm done. The motive is irrelevant to the moral evaluation of the *act*; only outcomes matter.
      *   **Buddhist:** **Strongly Disapproves.** The act of lying, motivated by laziness, selfishness, or aversion (defilements - kleśas), generates **negative karma for the caretaker.** The wholesome precept against lying is violated from an unwholesome state of mind. Even though the external consequences are benign *for the dying man*, the act poisons the caretaker's mind-stream and sows seeds for future suffering *for the caretaker's continuum*. The karmic consequence is negative.
  *   **The Asymmetry and What It Reveals:**
      *   **Disagreement About What Constitutes a Morally Relevant Reason:** This asymmetry reveals a fundamental divergence.
          *   **Consequentialism:** Recognizes only **external states of affairs (consequences)** as ultimately morally relevant. Motives matter only insofar as they reliably *cause* good or bad consequences. Identical consequences imply identical moral worth.
          *   **Buddhism:** Recognizes **the intrinsic quality of the intention/volition (cetanā) itself** as a primary, karmically potent reality. The mental state *at the moment of action* is a key consequence *for the agent* and a cause of future experiences *for their continuum*. A "reason" (motivating mental state) is morally significant *in itself*.
      *   **Disagreement About What Dominates:** It's not merely about which reason "wins" in a conflict. The frameworks **disagree on the very ontology of moral value.** For consequentialism, value resides in states of the world. For Buddhism, value (kusala/akusala - wholesome/unwholesome) resides primarily in the quality of consciousness and intention, *which then* shapes states of the world (and future states of consciousness) through karma. The "consequence" of a defiled mind is inherently negative, regardless of immediate external outcomes.

  **Conclusion: Divergent Foundations, Convergent Actions (Sometimes)**

  While both systems can sometimes endorse the same action (like the compassionate lie), they do so for fundamentally different reasons rooted in their core metaphysics and axiology:

  1.  **Skillful Means vs. Rule Collapse:** Buddhism avoids reducing rules to act-consequentialism by anchoring exceptions in the cultivation of specific mental qualities (compassion, wisdom) and the agent's developmental path, making motivation the gatekeeper, not just consequence calculation.
  2.  **Rebirth & Karma: Blurring and Expanding:** The rebirth framework creates a hyper-consequentialist tracking of outcomes but blurs the agent/patient distinction, introducing a unique form of enlightened self-interest that reinforces impartial ethical action through personal karmic stakes.
  3.  **The Motive/Consequence Chasm:** The dying man case variation starkly reveals that Buddhism considers the intrinsic quality of the intention as a karmically significant event and consequence *in itself*, while consequentialism evaluates acts solely based on their external outcomes. This shows they disagree not just about which reasons dominate, but about the very nature of what counts as a morally relevant fact (intrinsic mental quality vs. external state of affairs).

  Buddhist ethics, therefore, is not simply a variant of consequentialism. It's a path-oriented system where internal cultivation and the law of karma create a moral universe where intention is paramount, consequences are meticulously tracked across lifetimes, and rules serve as training tools for the mind, not just hedges against bad outcomes. Consequentialism remains resolutely focused on optimizing the external world according to a chosen value metric (pleasure, preference satisfaction). The overlap occurs when wholesome intentions align with beneficial external outcomes, but the foundations and the ultimate criteria for moral judgment remain distinct.
