answer: |-
  ## Evolutionary Debunking of Moral Realism: Defeaters and Defence

  **The view, stated plainly:**  
  The core argument holds that our moral beliefs were sculpted primarily by evolutionary pressures favouring survival and reproductive fitness, not by tracking objective, mind-independent moral truths. Therefore, even if such moral facts existed, the coincidence of our evolved beliefs aligning with them would be astronomically improbable. This undermines the justification for believing moral realism is true.

  **What would be decisive against it (Fatal Blows):**

  1.  **Demonstrating Non-Contingency:** The most decisive defeater would be proving that the specific content of human morality *could not possibly* have been otherwise, given the fundamental nature of reality or rational agency. If it could be shown that *any* intelligent beings capable of social cooperation and complex reasoning in *any* plausible evolutionary scenario *must necessarily* converge on moral principles identical (or nearly so) to ours (e.g., prohibiting gratuitous harm, valuing cooperation), then the evolutionary origins become irrelevant. Evolution wouldn't be selecting for *contingently* fitness-enhancing beliefs, but rather accessing *necessary* truths about agency or social existence. This would sever the link between fitness and contingency, making the 'coincidence' disappear. Proving such deep necessity is, however, exceptionally difficult.
  2.  **Direct Access Evidence:** If compelling, non-circular evidence emerged showing humans possess a specific, reliable cognitive faculty *dedicated solely* to detecting mind-independent moral properties (a genuine 'moral sense'), and crucially, that this faculty's operation is demonstrably *independent* of evolutionary influences shaping other belief-forming mechanisms, this could be fatal. The debunker's claim that *all* moral belief formation is ultimately fitness-driven would be directly refuted.

  **What would merely be awkward (Serious Challenges):**

  1.  **Robust Convergence of Idealised Agents:** Discovering that highly idealised agents (fully rational, impartial, informed) across vastly different cultures, species, or even artificial intelligences consistently converge on a specific moral code *would* be awkward. It wouldn't be *decisive* because the debunker can still argue: (a) Idealisation parameters (rationality, impartiality) might themselves be evolutionarily shaped ideals smuggled in, or (b) Convergence might still reflect deep constraints on *possible* successful social structures (fitness again), not mind-independent *moral* truth. It pushes the coincidence back a level ("Why do *these* idealisations track truth?") rather than eliminating it. However, strong convergence significantly raises the burden of explanation for the debunker.
  2.  **The Insulation Problem (if unresolved):** If debunkers consistently retreat ("It only debunks *this* belief, not *that* one") until only trivial or universally rejected moral claims are debunked, it becomes awkward. It risks making the argument vacuous – if *no* substantive moral belief we actually hold is genuinely threatened, the argument loses its critical bite. The debunker must credibly explain *which* core moral beliefs are undermined and why others (like basic prohibitions on murder) might be insulated *without* implicitly relying on realist assumptions (e.g., that some beliefs are just 'obviously' true).

  **What debunkers concede vs. shrug off:**

  *   **Concede as Significant (though not Fatal):** Most serious debunkers (e.g., Street, Joyce) concede that the **Third-Factor Reply** is the *strongest* realist counter. They acknowledge that *if* one could establish an independent, necessary link between fitness (F) and moral goodness (G) – say, that survival *just is* good, or cooperation *just is* rational/just – it *could* explain the correlation without coincidence. However, they argue this reply **smuggles realism back in**. To assert that F *is* G, or that F *necessarily entails* G, *is* to presuppose the very mind-independent moral facts realism posits. It doesn't rescue realism from the debunking challenge; it *assumes* realism to answer it. They see it as question-begging, not a rescue.
  *   **Shrug Off:** Debunkers largely shrug off arguments based on **intuitions of objectivity** ("But torture *just is* wrong!") or appeals to **moral disagreement**. They argue the *feeling* of objectivity is exactly what evolution would produce for fitness-enhancing norms. Widespread disagreement is easily explained by varying environments and cultural evolution shaping the *expression* of the underlying fitness-driven impulses. Neither directly addresses the core epistemic challenge of why we should think evolution tracks *truth* rather than just *usefulness*. Appeals to **moral progress** are similarly deflected: 'progress' can be explained as better satisfying evolved social instincts or adapting norms to new social complexities, not as getting closer to moral facts.

  **Verdict on the insulation worry:**  
  The insulation strategy ("it only debunks *these* beliefs") is **not inherently fatal but is a critical vulnerability requiring careful handling**. A mature research programme *should* refine its scope. However, if insulation becomes arbitrary or relies on *ad hoc* exceptions that implicitly grant realist premises (e.g., "Only obviously true core morals are immune"), it risks hollowing out the argument into triviality. The debunker's credibility hinges on providing a *principled* evolutionary/epistemic account of why *some* moral beliefs (e.g., specific deontological constraints, perhaps) remain unjustified by realism, whilst others (e.g., derivative norms, specific virtues) are debunked, *without* presupposing realism. Done well, insulation is refinement; done poorly, it's evasion. The argument retains force only if it credibly challenges a significant portion of our substantive moral convictions.
