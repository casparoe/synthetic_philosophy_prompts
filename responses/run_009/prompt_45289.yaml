  3. **Threat Ranking**: Independence is tiered above competence due to its extreme sensitivity in small groups (small ρ costs more than small p drops), and because shared biases are endemic to expert panels.
  4. **Deliberation Effects**: Represented as contested in "settled_vs_contested"—some studies show it improves p, others show it increases ρ.
  5. **Weighted Voting**: Mentioned where relevant but excluded as a fix since your design specifies simple majority.
