prompt: |-
  I sit on the governance committee of a professional society that is setting up a forecasting panel: fifteen members who will vote yes or no on a long series of well-posed technical questions, with the majority answer recorded as the society's official view. A colleague advocating the setup keeps invoking the Condorcet jury theorem — if each member is better than a coin flip, the probability that the majority is wrong shrinks toward zero as the panel grows — and dismisses worries about the theorem's assumptions as pedantry. Before our next meeting I need to know which assumptions actually do the work and which of them I should be worried about.

  Rate the theorem's substantive assumptions. I have in mind at least these five: voter competence strictly above one-half; independence of voters conditional on the truth of the proposition; sincerity of votes; a single common proposition with a determinate truth value; and homogeneity of competence across voters. Add any others you think belong on the list. Judge each on three dimensions: (a) how load-bearing it is, i.e., what survives of the theorem's conclusion if this assumption is relaxed while the others hold — be specific about whether it degrades the conclusion gracefully or destroys it outright; (b) how plausibly it holds in a fifteen-person panel of experts who share training, read the same literature, deliberate together, and have career incentives not to be the lone dissenter; and (c) whether a failure here is correctable by design — secret ballots, independent work phases before deliberation, calibration training, weighted voting — or is structural.

  Then give me a tiered ranking of the assumptions by how much they threaten my colleague's argument as applied to a panel of fifteen in particular. Bear in mind that the asymptotic half of the theorem cannot even engage at n = 15, so weigh carefully what the theorem actually licenses at small n versus what it is merely gesturing at.

  Please deliver the answer as a JSON object with this schema:

  {
    "assumptions": [
      {
        "name": "short label",
        "statement": "precise statement of the assumption",
        "load_bearing": "what happens to the conclusion if this is relaxed while the others hold",
        "realism_in_small_expert_panels": "assessment of how plausible it is in our setting",
        "correctability": "design-level fix or structural, with reasoning",
        "status": "one of: settled / contested / my own extrapolation",
        "tier": "1 (most threatening to the argument), 2, or 3"
      }
    ],
    "tier_ordering_rationale": "why the tiers come out in this order",
    "settled_vs_contested": "a clear separation between what is mathematically settled about the theorem and its known extensions, and what is genuinely contested among people who work on judgment aggregation and group epistemology; flag every judgment in this answer that is your own extrapolation rather than an established result",
    "bottom_line": "one paragraph on what the theorem does and does not license for a fifteen-member panel"
  }

  Two requests on how you handle yourself. First, keep mathematical facts about the theorem — what follows from what, given the assumptions — sharply separate from empirical claims about real panels, and label which is which in the fields above. Second, where experts genuinely disagree — for instance, about how much correlated error typically costs in practice, or about whether deliberation before voting helps or hurts aggregation — present the disagreement rather than picking a side and calling it consensus.
reasoning: |-
  We are considering the Condorcet jury theorem (CJT) for a panel of 15 experts. The classic CJT states that if each voter has independent probabilities of being correct, with a fixed competence p>0.5, then the probability that the majority is correct approaches 1 as the number of voters goes to infinity.

  The assumptions we are to rate are:

  1. Voter competence strictly above one-half (p>0.5).
  2. Independence of voters conditional on the truth.
  3. Sincerity of votes (voters vote according to their true belief).
  4. A single common proposition with a determinate truth value (binary choice: true or false).
  5. Homogeneity of competence across voters (same p for all).

  We may add others that are relevant. One important addition is:

  6. No systematic bias: the voters are not systematically biased toward the wrong answer. (This is sometimes considered as part of the competence assumption, but note that p>0.5 implies no systematic bias in the sense that the average competence is above 0.5. However, without homogeneity, we might have some below 0.5 and some above, but the average above 0.5. The classic CJT with heterogeneous competence requires the average p>0.5 and independence, but note that without homogeneity the conclusion still holds asymptotically if the average p>0.5 and the p_i are bounded away from 0.5. However, for small n, it's more delicate.)

  But note: the classic homogeneous CJT is what is usually stated, but there are extensions. We'll focus on the standard assumptions and then consider extensions.

  Another assumption that is sometimes overlooked:

  7. The voting rule is simple majority.

  However, we are told that the majority answer is recorded, so we can assume simple majority.

  Now, we are to rate each assumption on:

  (a) Load bearing: what happens if we relax it while holding others?
  (b) Realism in small expert panels (15 members) with shared training, deliberation, etc.
  (c) Correctability by design.

  Then, assign a tier: 1 (most threatening) to 3.

  We also note that for n=15, the asymptotic behavior doesn't apply, so we must look at the exact behavior.

  Let's go through each assumption:

  1. **Competence above 0.5**:
     - Load bearing: Absolutely critical. If p <= 0.5, then the majority is not more likely to be correct than a single voter, and in fact for p<0.5, the majority becomes less likely to be correct as n increases (and goes to 0). For p=0.5, the probability that the majority is correct is 0.5 (by symmetry). So relaxing to p<=0.5 destroys the conclusion.
     - Realism in expert panels: Experts are presumably above 0.5, but note that for very hard questions, they might be only slightly above 0.5. Also, if the questions are extremely difficult, it's possible that even experts are only at 0.5 or below. However, in a well-posed technical question, we hope they are above 0.5. But it's not guaranteed. Also, note that without homogeneity, if the average p>0.5 but some are below, then the conclusion still holds asymptotically but for n=15, it might be weakened. However, the main threat is that p might be close to 0.5 or even below for some questions.
     - Correctability: We might try to select experts with high individual calibration (via training or testing) and perhaps avoid questions that are too hard. But note: we cannot force an expert to have p>0.5 on every question. This is a structural challenge because the difficulty of the question is inherent.

  2. **Independence conditional on the truth**:
     - Load bearing: If there is positive correlation among voters' errors, then the probability that the majority is wrong can be much higher than under independence. The theorem's conclusion (that the probability of correct majority goes to 1) may fail even if each voter is highly competent. For example, if all voters make the same mistake, then the majority is wrong. In fact, with perfect positive correlation, the majority is correct only if each individual is correct (so no gain from aggregation). Therefore, relaxing independence can destroy the conclusion.
     - Realism in expert panels: In a panel of experts who share training, read the same literature, deliberate together, and have career incentives, there are many sources of common error. They may be influenced by the same flawed study, or groupthink may set in. Also, deliberation might create dependence. Therefore, independence is highly suspect in this setting.
     - Correctability: We can try to enforce independence by design: secret ballots, independent work phases (e.g., having them submit preliminary votes before deliberation), and perhaps even isolating them from each other. However, if they have shared background, some dependence might remain. It is partially correctable.

  3. **Sincerity**:
     - Load bearing: If voters do not vote according to their true belief, then the competence assumption (p) is not about the vote but about the belief. Strategic voting or insincere voting (e.g., to conform) can break the link. For instance, if a voter with a correct belief votes incorrectly to conform, then the vote is wrong even though the belief was correct. This can lower the effective p. The conclusion may be destroyed if insincere voting is pervasive and leads to p_effective <= 0.5.
     - Realism: In a panel with career incentives not to be the lone dissenter, there might be pressure to conform. Also, in deliberation, the group might coalesce around a wrong view. Sincerity is a concern.
     - Correctability: We can use secret ballots to reduce social pressure. Also, we might structure deliberation to encourage independent thought. It is correctable by design.

  4. **Single common proposition with determinate truth value**:
     - Load bearing: The CJT is about a single binary question. If the proposition is not well-defined or if the truth is not binary, then the theorem does not apply. However, the problem states that the questions are well-posed and technical, so this might be less of an issue. But note: if the question is ambiguous, then different voters might interpret it differently, breaking the common truth. This can lead to violations of the independence and competence assumptions. Relaxing this might destroy the conclusion because the entire framework breaks.
     - Realism: The problem states "well-posed technical questions", so we assume this holds. But note: even well-posed questions might be interpreted differently by different experts. This is a potential issue but probably less severe than others.
     - Correctability: By careful question formulation and testing, we can try to ensure clarity. It is correctable by design.

  5. **Homogeneity of competence**:
     - Load bearing: The classic CJT assumes all have the same p. However, there are extensions that show if the average p>0.5 and the votes are independent, then the probability of correct majority still approaches 1 as n increases (under some conditions, such as the p_i being bounded away from 0). But for small n, having heterogeneous competences can lead to a lower probability of correct majority than under homogeneity (if the average is the same). However, the conclusion (that the majority is more likely correct than not) still holds if the average p>0.5 and independence holds. Therefore, relaxing homogeneity does not destroy the conclusion but may weaken it, especially at small n. It degrades gracefully in the asymptotic sense, but for n=15, the effect can be non-negligible.
     - Realism: In a panel of experts, we expect some variation in expertise. Some may be more knowledgeable on a particular question than others. Therefore, homogeneity is unlikely.
     - Correctability: We might try to weight votes by expertise, but the problem states that it's a simple majority. Alternatively, we could select panelists with similar expertise. However, it's difficult to achieve homogeneity. This is partially correctable by selection and weighting, but weighting is not part of the simple majority system.

  We should add:

  6. **No systematic bias (or symmetry of the voting task)**:
     - Actually, the competence p>0.5 already implies that there is no systematic bias toward the wrong answer. But note: if the truth is not symmetric (e.g., one type of error is more likely than another) then even with p>0.5, the majority might not perform as well. However, the classic CJT does not require symmetry. The assumption of p>0.5 is the main one. But we should note that if the task is such that the voters are better at detecting one state (say, true) than the other (false), then we might have p(true) and p(false) different. The classic CJT is stated for a fixed p regardless of the state. But if the prior on the truth is not 0.5, then the interpretation might change. However, the theorem is typically stated conditionally on the truth value. So we don't need to add this as a separate assumption.

  Another important one:

  7. **The voting rule is simple majority**:
     - The theorem is for majority rule. But note that for odd n, majority rule is well-defined. For n=15, it is. However, if we used a different rule, the conclusion might not hold. But the problem states majority, so we don't have to worry.

  But note: the classic CJT requires that the decision is made by majority rule. However, we are using majority rule, so we assume that.

  Now, let's rank the threats for n=15:

  We are concerned with the probability that the majority is correct. For n=15, we need at least 8 correct votes.

  The most threatening assumptions are those that are both very load-bearing and likely to be violated in our setting.

  Tier 1 (most threatening) should be:

  - **Independence**: Because it is highly load-bearing (correlation can destroy the aggregation benefit) and very likely violated due to shared training, literature, and deliberation. Also, even with design fixes, some residual correlation might remain.

  - **Competence above 0.5**: Because if p<=0.5, the whole argument falls apart. And for difficult questions, p might be close to 0.5 or even below, especially when the experts are overconfident. Also, it's structural because we cannot guarantee p>0.5 on every question.

  Tier 2:

  - **Sincerity**: Because if voters are not sincere, then the effective competence drops. This is a real concern in a group with career incentives and conformity pressure. But it can be mitigated by secret ballots and independent voting phases.

  - **Homogeneity**: Not as critical because the theorem can tolerate heterogeneity (if the average p>0.5) but at n=15, heterogeneity might reduce the probability of correct majority. Also, in practice, experts are heterogeneous. But note: if we have a mix of experts, some with p<0.5 and some with p>0.5, but average above, the majority might still do well. However, if there is dependence, then heterogeneity might interact. Without dependence, heterogeneity is less of a problem.

  Tier 3:

  - **Single common proposition**: The problem states that the questions are well-posed, so we assume this holds. Also, it can be corrected by careful wording.

  But note: if the proposition is ambiguous, that could induce dependence and reduce competence. So it's connected. However, by itself, it's less of a threat because we can control it.

  Now, we must also note that the **asymptotic result does not apply at n=15**. Even if all assumptions hold, the probability that the majority is correct might not be as high as we hope. For example, if p=0.6, then for n=15, the probability of a correct majority is about 0.78 (using binomial). This is better than one individual, but 22% chance of error. If p=0.55, then it's about 0.62. So we must not overstate the power at small n.

