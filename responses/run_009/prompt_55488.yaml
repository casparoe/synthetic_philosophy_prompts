prompt: |-
  Quick background: I'm 34, I fix industrial HVAC systems for a living, and until last year my financial planning was basically "whatever's in checking after the rent clears." Then my grandmother passed and left me around $210k, and now I have to actually decide things a few times a year, at night, with a spreadsheet and no calculus — I can handle percentages, that's about it. My wife has veto power on anything over $25k, so whatever I come up with has to be explainable to her over dinner. I've been reading about the Kelly criterion and the general idea of geometric versus arithmetic returns — that what matters is the growth rate of the whole portfolio, not the average outcome of any single bet, because losses compound right along with wins — and I gather there's this "fractional Kelly" move where you bet half or a third of what the formula says, partly because your edge estimates are always worse than you think. But every explanation I find is either a math lecture or a tweet, and neither tells me what to do on a Tuesday night. So: can you turn this into a procedure I can actually run? The questions in order — how do I get a probability I'd stand behind, what counts as enough of an edge to bet anything at all, how do I shrink the bet size when my numbers are shaky, what do I do about two positions that move together — and for each one, what a sufficient answer looks like, where the procedure flat-out says no, and where it hands the call back to me and my wife because it's about how a 50% drawdown would feel for us, which is not a fact I can look up. Then run it on three decisions I'm actually facing: (1) how much of the $210k goes into a broad index fund versus a savings account — my gut says keep 60% in cash, and I can already tell my gut is scared rather than informed; (2) whether to put real money into one semiconductor stock — I work on these systems, I honestly believe I know better than the market here, and I suspect your procedure is going to gut that belief, which I'd rather it did now than later; and (3) whether to size up after a good year on the theory that the edge is now proven. Be straight with me about which steps are just my judgment dressed up as math, and about what the whole thing can't do — I'm assuming it can't invent an edge where I don't have one, but tell me where else it will fail. (Also, if the procedure tells me something I won't like in one of those three cases, I want to hear it anyway.)
reasoning: |-
  Okay, let's break this down. This HVAC tech inherited $210k and needs a practical system for investment decisions - no fancy math, just actionable steps. His wife has veto power, so everything must be dinner-table explainable. He's grasped the core Kelly principle about geometric growth but needs implementation.

  First, I need to translate Kelly Criterion into his world. It's about sizing bets based on edge and odds, but fractional Kelly is crucial since amateurs overestimate edges. The procedure must flag when estimates are shaky and when human judgment is required.

  For probability estimation: He must define his edge concretely. For semiconductor stock, it's not "I know better" but "I can predict X event that market misses with Y confidence." We'll build a confidence scale - anything below 60% is probably noise.

  Bet sizing rules: Minimum edge threshold at 5% after fees, fractional Kelly (1/3rd) for weak confidence. Must adjust for correlated bets - if two stocks move together, they count as one position. And absolute loss limits: no single bet risking >5% of total portfolio.

  Now applying to his cases: 
  1) Cash vs index fund: His 60% cash instinct is fear-based. Kelly would say near-100% stocks for young people, but we'll compromise at 80% with guardrails. 
  2) Semiconductor play: Gut-check time. Unless he has specific operational insight (e.g. yield rates at Factory Z), it's probably not an edge. Procedure will likely say "no bet." 
  3) Scaling after wins: Classic mistake. Edge doesn't grow with portfolio size - if anything, success breeds overconfidence. Fractional Kelly already builds in conservatism.

  Key limitations to emphasize: This can't create edges where none exist. It can't eliminate black swans. And the 50% drawdown test is purely emotional - no spreadsheet answers that.

  The dinner-table explainer: "Think of it like HVAC maintenance. Probability is your diagnostic confidence. Edge is the profit margin on the job. Bet size is how many trucks you dispatch - never send the whole fleet to one uncertain call."
answer: |-
  Here's a straight-talking, actionable procedure based on fractional Kelly principles – designed for Tuesday nights with a spreadsheet and veto-power dinners. I'll give you the toolkit first, then run your three decisions raw.

  **The Fractional Kelly Nightshift Procedure**  
  *Tools needed: Calculator, your gut, your wife's perspective*

  ### Step 1: Estimate Your Probability (The "Stand Behind It" Test)
  - **What to do:** For any investment, ask: *"What specific event or outcome makes this beat the market?"* Assign a % chance (50% = coin flip).  
  - **Sufficient answer:** "I think Company X will land the Defense Dept contract by October because [supplier insight/tech edge]. I’m 65% confident."  
  - **Procedure says NO if:** You can’t name a concrete reason or your confidence is ≤55%. Walk away.  
  - **Hands back to you if:** Confidence is 56-70% – your call on whether it’s a true edge or noise.

  ### Step 2: Calculate Edge (The "Worth Betting" Threshold)
  - **What to do:** **Edge (%) = (Your Estimated Return % - Market's Expected Return %)**  
    - *Example: You think SemiStock returns 18%/yr, broad market index returns 10% → Edge = 8%*  
  - **Sufficient answer:** Edge ≥5% after fees/taxes. Anything less isn’t worth the risk.  
  - **Procedure says NO if:** Edge ≤2% or based on vague "gut feel."  
  - **Hands back to you if:** Edge 3-4% – bet only if you’ve got ironclad proof.

  ### Step 3: Shrink the Bet (Fractional Kelly Guardrails)
  - **What to do:** **Max Bet % = (Edge %) / (Market Volatility %) × F**  
    - *Volatility*: For stocks, use 15-20% (historical avg). For your semi stock, use 30-40%.  
    - *F* = Confidence multiplier: **1/3 if shaky (55-70% confidence), 1/2 if solid (70-85%)**.  
  - **Sufficient answer:** "My edge is 8%, semi volatility is 35%, I’m shaky so F=1/3 → Max Bet = (8/35)×0.33 = 0.75% of portfolio."  
  - **Procedure says NO if:** Formula gives ≤0.5% – too small to matter.  
  - **Hands back to you if:** You’re tempted to override F. *This is where dinner with your wife happens.*

  ### Step 4: Adjust for Correlated Positions (The "Don’t Double Down" Check)
  - **What to do:** If two investments (e.g., two semi stocks) move together:  
    - Treat them as *one combined bet*.  
    - Add their bet sizes – if Bet A is 1% and Bet B is 1%, but they’re 80% correlated → effective bet = 1.8%.  
  - **Sufficient answer:** "My total ‘tech sector’ bet can’t exceed X% after correlation."  
  - **Procedure says NO if:** Combined bets exceed 10% of your portfolio.  
  - **Hands back to you if:** Correlations are uncertain (e.g., during a chip shortage).

  ### The 50% Drawdown Test (Your Wife’s Veto Power)
  - **What to do:** **Before any bet**, ask: *"If this evaporates and our portfolio drops 50% from its peak, can we sleep? Will we divorce?"*  
  - **This is pure judgment.** Math can’t help here. If either of you hesitates, shrink the bet until it feels tolerable.

  ---

  **Running Your Three Decisions**  
  *Assumptions: $210k portfolio. Broad market index = 10% expected return, 15% volatility. Cash/Savings = 4% return, 0% volatility.*

  1. **Cash vs. Index Fund (Your gut says 60% cash):**  
     - *Probability/Edge:* No "edge" here – this is asset allocation. Base decision on goals.  
     - *Kelly Math:* Cash has near-zero volatility but low returns. Optimal growth favors stocks long-term.  
     - **Procedure Output:**  
       - If you’re >5 years from needing cash: 80-90% in index funds.  
       - Your 60% cash = paying a huge "fear tax." Compromise: **30% cash ($63k), 70% index ($147k).** Use cash for emergencies/opportunities.  
     - *Drawdown Test:* If stocks halve, your portfolio drops 35% (not 50%). Can you stomach that? If not, up cash to 40% max.

  2. **Semi Stock (Your "I know better" play):**  
     - *Probability:* What’s your *specific* insight? (e.g., "I see their cooling systems failing in 6 months → production delays → stock drop 20%")  
     - *Edge Calc:*  
       - Your estimated return: 18%?  
       - Market’s expected return (e.g., semi ETF like SOXX): 12%?  
       - **Edge = 18% - 12% = 6%**  
     - *Bet Sizing:*  
       - Semi volatility: 35% (conservative)  
       - Your confidence: "I know better" isn’t proof. Shaky confidence → **F=1/3**  
       - **Max Bet = (6 / 35) × 0.33 = 0.57% → ≈$1,200**  
     - **Procedure Output:** **Bet ≤$1,200 or SKIP.** This is a rounding error – not worth the time/stress. *Your gut overestimates your edge.*  
     - *Drawdown Test:* Losing $1,200 won’t move the needle. But if you bet $25k? That’s 12% of your portfolio – catastrophic if wrong.

  3. **Sizing Up After a Good Year:**  
     - *Kelly Truth:* **Edge doesn’t grow with wins.** If anything, success breeds overconfidence → shrink F.  
     - *Procedure:* Re-run Steps 1-3. Did your probability *increase* with new data? Or are you chasing momentum?  
     - **Output:** **Never size up automatically.** If your edge is unchanged, keep bet sizes stable. If you’re more confident, maybe increase F to 1/2 – but only with proof.

  ---

  **Where This Isn’t Magic (The Fine Print)**  
  - **Your judgment is the engine:** Math just quantifies *your* estimates. Garbage in = garbage out.  
  - **It can’t predict black swans:** COVID, wars, etc. – that’s why we use fractional Kelly.  
  - **It assumes normal markets:** In 2008-style crashes, correlations go to 1.0 (everything tanks).  
  - **Fees/taxes matter:** A 2% edge dies under a 1.5% fund fee.  
  - **"Proven edge" is a trap:** Semis crushed last year ≠ they’ll do it again. Re-evaluate always.  

  **Final Dinner-Table Summary For Your Wife**  
  > "We’re using a system from blackjack pros: bet big only when we have proof we’re right, bet tiny when we’re guessing. It forces us to define why we think we’ll win, and how much we could lose. Most things won’t pass the test – and that’s by design. The math says skip your semi stock play, put most in index funds, and never assume last year’s luck is skill. If the market tanks 50%, we’ll still have 30% in cash to rebuild. Good?"

  **Bottom line:** Your instincts were right about oversizing cash and overestimating your semi edge. The procedure’s job is to protect you from you. Now go update that spreadsheet.
