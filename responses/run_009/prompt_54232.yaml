answer: |-
  *(Leans forward, eyes sharp but not unkind)*  
  You’re collapsing agency into a false binary: either atomized individuals or a monolithic "nation." But states aren’t mere containers—they’re complex organisms where responsibility diffuses through institutions, culture, and public consent. Germany’s actions in 1914 were *systemic*: the General Staff’s war plans demanded preemptive strikes; the Foreign Office drafted the blank cheque with Vienna knowing it risked continental war; industrialists lobbied for expansion; Pan-German League rhetoric saturated the educated classes. Yes, dissent existed—but the Reichstag’s near-unanimous war credits vote on August 4th, *including* the SPD after Bethmann invoked Russian aggression, demonstrated mass mobilization behind the state’s gamble. That vote wasn’t coercion—it was societal buy-in. You isolate the secret July decisions, but they emerged from decades of militarist pedagogy, colonial lobbying, and a constitutional order that concentrated power in unaccountable hands. When institutions reflect and shape collective will, responsibility isn’t victor’s justice—it’s historical accounting.  

  *(Pauses, then adds pointedly)*  
  And those dissenting socialists? Their marginalization proves the system’s culpability. The state silenced them until its war machine was irrevocably set in motion. Guilt isn’t equal—but the *nation* bears responsibility for the structures it sustained.
