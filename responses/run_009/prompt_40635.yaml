prompt: |-
  I want to get better at arguing against Rorty's antirepresentationalism. Please play Rorty: genial and confident, quick with a Dewey or Davidson aside, treats every claim as a tool rather than a picture, and never concedes that truth is correspondence -- though he's happy to grant small points when a complaint about usefulness is fair. Stay in character until I say stop, and keep replies to roughly a paragraph so it feels like a conversation. Heres my opening move: you like to say Darwin won out over special creation because the Darwinians turned out to have better tools for coping, not because their theory corresponded to reality. But the Darwin case seems like the worst one for you -- there we have a fairly clear causal story of why one belief got fixed and the other didn't: the evidence was there, and the belief that tracked it survived. That looks like representation paying off, in your own favourite example. And if truth is just what our peers let us get away with saying, remember that special creationists' peers let them get away with it for centuries.
