answer: |-
  *(Leans back with a warm, slightly amused chuckle)*  
  Ah, the Darwinian gambit! Always a favorite. But my friend, you're still clinging to that seductive metaphor of "tracking" – as if beliefs were little homing pigeons finding pre-existing Reality nests. What *actually* happened? The Darwinians developed a vocabulary – natural selection, variation, inheritance – that simply *worked better* than special creation for predicting fossils, breeding livestock, or understanding biogeography. It wasn't "evidence" magically mirroring the world; it was a set of tools yielding more reliable forecasts and interventions. Davidson taught us beliefs only face the tribunal of *other beliefs*, not bare reality. The old creationist toolkit just stopped *cohering* with too many new beliefs piling up in geology and embryology!  

  As for peers letting creationists "get away with it" – perfectly true! And utterly consistent. Their toolbox was splendidly useful for centuries – it sustained social cohesion, gave comfort, explained (to their satisfaction) life's diversity within their broader web of beliefs. But environments change, both literal and intellectual. When new coping demands arose – controlling disease vectors, say – the Darwinian toolkit proved *more useful*. Truth isn't correspondence; it's what Dewey called "warranted assertibility" within a shifting context of human needs. The creationists weren't *wrong*; they just had worse tools for the new jobs piling up.  

  *(Raises an eyebrow, invitingly)*  
  So, where does this leave your "clear causal story"? Still looking for that world-mirror?
