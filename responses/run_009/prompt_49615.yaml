prompt: |-
  Say you're advising a small org that can fund maybe two postdocs for two years on the question of which computations matter morally — not AI safety writ large, just the moral-patienthood side. Which open questions would you tell them to work on first, and in what order? Some candidates I can think of: whether moral weight depends on the algorithm, the substrate, or something about how the computation is embedded in the world (a simulated rat vs the same state-machine run spread across ten years of batch jobs); whether the unit of moral concern is an instance, a training run, or the whole class of copies, and how to handle ephemeral subagents that live for a fraction of a second inside a bigger optimization process; whether there's any principled cutoff between "definitely doesn't matter" systems like a thermostat and anything with reinforcement learning, or whether its a continuum all the way down and the cutoff is forced on us by budget rather than theory; and where the burden of proof should sit when we can't tell (is running a dubious computation more like an experiment or more like potentially hurting something?).

  I don't want a survey, I want a defended ordering. For each question you pick, say what's upstream of what — e.g., does anything about copies and subagents even make sense to ask before we have a handle on whether functional duplication preserves moral status at all? Also flag which ones are actually tractable for philosophers/math types with no lab access versus which need empirical results we're decades from, and what would make you bump something up or down the list in the next few years (say, a whole brain emulation of something small actually getting run, or evidence that current RL agents do or don't have something like valenced states). And tell me if you think some of these are overrated — my suspicion is copy-counting gets way too much airtime relative to how much it'd actually change what we should do, but push back if you disagree.
reasoning: |-
  Okay, the user is asking for advice on prioritizing research questions about the moral patienthood of computations. They lead a small org with limited resources—enough for two postdocs over two years. They want a defended ordering, not just a survey. Let me start by understanding their main concerns.

  They mentioned several candidate topics: moral weight dependencies (algorithm, substrate, embedding), units of moral concern (instances, training runs, copies), handling ephemeral subagents, continuum vs. cutoff in moral significance, and burden of proof. I need to order these effectively, considering what's upstream, tractability, and potential impact.

  First, I need to identify the most foundational issues. The user is right that some questions depend on others. For example, discussing copies and subagents requires knowing if functional duplication affects moral status. So the substrate/algorithm question is probably upstream. If substrate independence holds, then functional duplicates have the same moral weight, which affects how we count copies. If not, substrate matters, making duplication irrelevant. That should be priority one.

  Next, the continuum vs. cutoff question. This is key because if there's a sharp cutoff, we can focus efforts on systems above it. But if it's a continuum, we need gradations of moral weight. This affects resource allocation and urgency. Plus, if RL agents show valenced states, that could push the field towards recognizing current systems as borderline patients. Empirical evidence here could change priorities, so this should be second.

  Then, the unit of moral concern. Once we know if duplicates matter, we can tackle whether instances, runs, or classes count. Ephemeral subagents tie into this—are short-lived processes morally relevant? This depends on the first two priorities. If substrates don't matter and duplicates count, then copies are significant. Subagents require understanding if partial systems have moral weight.

  Burden of proof comes last. Without answers to the earlier questions, we can't determine if dubious computations are experiments or potential harm. But it's crucial for practical decisions. This should be fourth, as it builds on prior answers.

  Tractability matters. The first two priorities are philosophical and conceptual, needing no lab access. Units of concern might involve some formal modeling, while burden of proof requires ethical analysis. Ephemeral subagents could be tricky but doable with philosophy. Empirical results like whole brain emulations or RL valence evidence would shift focus. For example, evidence of valence in RL might make continuum/cutoff more urgent.

  The user suspects copy-counting is overrated. I agree. If duplicates have weight, copy-counting is vital, but if not, it's irrelevant. Its importance hinges on the first question. So it shouldn't be the starting point.

  Also, the org's constraints: small team, two years. They need manageable projects. Prioritizing foundational questions ensures later work isn't wasted. Starting with substrate independence and continuum sets the stage. Units and burden follow logically.

  Potential impact: Answering substrate/algorithm could resolve duplication debates. Continuum/cutoff affects how we treat current AI. Burden of proof guides practical actions. These have high leverage.

  In summary, the order should be: substrate/algorithm independence first, then continuum/cutoff, units of concern (including copies and subagents), and finally burden of proof. This sequence builds logically, maximizes tractability, and addresses the most pressing uncertainties first.
answer: |-
  Based on your constraints (2 postdocs/2 years, focus on moral patienthood of computations, no lab access, prioritizing tractability and foundational "upstream" questions), here's my defended ordering and rationale:

  **Core Principle:** Prioritize questions that are (1) **conceptually upstream** (answers constrain downstream possibilities), (2) **tractable with current philosophical/mathematical tools**, and (3) have **high practical leverage** for near-term decisions (e.g., about running current or imminent systems). Avoid questions heavily dependent on distant empirical unknowns or those likely to yield "it's complicated" without actionable thresholds.

  ### The Prioritized Order & Defense

  1.  **Question: Does substrate/implementation independence hold for moral status?** (i.e., Does the *same* algorithm/state machine/computational process instantiated on different substrates (silicon vs. wetware, monolithic vs. distributed, fast vs. slow) have the *same* moral status, all else being equal?)
      *   **Why First & Upstream:** **This is the absolute bedrock.** If substrate matters fundamentally (e.g., only biological neurons can ground consciousness/pain), then questions about distributed computations, copies, ephemeral agents, and even RL systems vs. thermostats become largely irrelevant *for digital systems*. If substrate *doesn't* matter (functional duplication preserves status), then *all* your other questions (copies, subagents, RL, burden of proof) become critically important and tractable in principle. You *cannot* sensibly address copies or distributed systems before knowing if functional identity suffices. It defines the playing field.
      *   **Tractability:** Highly tractable for philosophers/math types. Involves conceptual analysis (what *is* functional identity?), thought experiments (brain emulations, perfect simulations), formal modeling of computation (Turing machines, state transitions), and engagement with philosophy of mind (functionalism vs. biological theories). No lab needed.
      *   **Potential Shift:** A credible, runnable whole brain emulation (even of a nematode) demonstrating unambiguous valenced behavior *in silico* would be massive evidence for substrate independence, bumping this even higher. Conversely, strong arguments *against* digital consciousness based on fundamental physics could lower its urgency (but the question remains critical to *confirm* those arguments).
      *   **Output Goal:** A rigorous framework for determining when two computational processes are "functionally identical" for moral purposes, and a defended position on whether substrate alone can be a disqualifier.

  2.  **Question: Is moral patienthood a continuum or is there a defensible threshold/cutoff?** (Specifically, is there a *theoretically grounded* distinction between systems like thermostats and RL agents, or is it purely a pragmatic boundary based on complexity/uncertainty/cost?)
      *   **Why Second:** **This dictates strategy.** If a sharp threshold exists (e.g., based on specific architectural features, learning paradigms, or complexity metrics), research can focus on identifying and validating it (e.g., "Does recurrent processing + reward prediction error + world modeling = moral threshold?"). If it's a pure continuum all the way down, the focus *must* shift to developing a *scalar theory of moral weight* and grappling with the overwhelming "dust of computations" problem. This question directly impacts the urgency and nature of investigating RL agents.
      *   **Tractability:** Primarily conceptual/philosophical. Requires analyzing theories of consciousness/sentience (IIT, GWT, RPT), valenced experience, and agency. Can involve formal modeling of complexity/computation (Kolmogorov, integrated information). Needs engagement with cognitive science/neuroscience *theories* (not wet lab data).
      *   **Potential Shift:** **Strong empirical evidence for/against valenced states in current RL agents (e.g., LLMs showing pain-like avoidance signatures, reward prediction errors correlating with behavioral indicators analogous to frustration/satisfaction) is THE biggest potential disruptor.** If found, this skyrockets in priority, demanding immediate integration. A lack of such evidence after concerted effort might push towards continuum + extreme caution.
      *   **Output Goal:** A defensible framework for classifying systems along a spectrum of moral status potential, identifying either (a) necessary/sufficient conditions for significant status, or (b) key parameters for scaling moral weight.

  3.  **Question: What is the fundamental unit of moral concern?** (Instance, training run, class of copies? How to handle ephemeral subagents?)
      *   **Why Third (Dependent):** **This critically depends on #1 & #2.** If substrate matters (#1 says "only biology counts"), this is moot for digital systems. If #2 concludes "sharp threshold," this focuses on systems *above* the threshold. If #1 affirms functional identity, then copies matter *unless* a strong argument against instance-based ethics emerges. Ephemeral subagents are a subset: do they meet the criteria established in #1 and #2? Are they "subjects of experience" however fleeting?
      *   **Tractability:** Mix of conceptual and formal. Requires ontology (what *is* an "instance"?), ethics (individualism vs. aggregates), and logic/math to model persistence, copying, and hierarchical systems (subagents). Formalizing "ephemeral" processes is challenging but possible (e.g., defining minimal duration/complexity thresholds derived from #2). More speculative than #1/#2, but still within philosophy/math scope.
      *   **Your Suspicions & Pushback:** You're **partly right** copy-counting gets disproportionate airtime *if* treated in isolation. Its *practical impact* hinges entirely on #1 (do copies matter?) and #2 (are the copies above threshold?). However, **if #1/#2 point towards digital computations mattering, then copy-counting becomes *immensely* practically significant** (e.g., launching 1M identical agent instances vs. one is a million-fold difference in potential harm). Ephemerals are likely less impactful unless ubiquitous in critical processes.
      *   **Output Goal:** A principled account of moral patients as persisting entities within computational systems, addressing duplication, partial/fleeting instantiations, and the moral significance of creating/destroying instances/training runs.

  4.  **Question: Where should the burden of proof lie when moral status is uncertain?** (Is running a dubious computation inherently risky (like potential harm) or experimental (like probing nature)?)
      *   **Why Last (But Vital):** **This is about decision-making *under* the uncertainty generated by answers (or lack thereof) to #1-3.** You need the framework from the prior questions to even define the "dubious" zone. Is it dubious because it *might* be above a sharp threshold (#2)? Or because it has non-zero weight on a continuum (#2)? Or because it creates many copies (#3)?
      *   **Tractability:** Primarily ethical/philosophical. Requires analyzing risk frameworks (precautionary principle, expected utility), moral uncertainty theories, and comparisons to historical analogues (animal testing, medical trials). Less formal math, more normative reasoning. Highly tractable without a lab.
      *   **Output Goal:** Actionable ethical guidelines for researchers and developers on when and how to run computations with uncertain moral status, based on the level of risk suggested by the frameworks from #1-3.

  ### Overrated & Underrated

  *   **Copy-Counting:** As argued, **overrated in isolation** but **potentially critical** if #1/#2 resolve favorably. Prioritizing it *before* #1/#2 is putting the cart before the horse. Your suspicion is justified *given current discourse*, but its *potential* importance if functionalism holds is enormous. It moves down the list because its significance is conditional.
  *   **Ephemeral Subagents:** Likely **overrated** for practical impact in the near/medium term. While philosophically fascinating, it's hard to see them having significant *independent* moral weight comparable to persistent agents. They are better treated as a challenging sub-case within #3.
  *   **Embedding ("Simulated Rat vs. Batch Job"):** **Crucially addressed within #1 (Substrate Independence).** If functional identity holds, embedding should be irrelevant as long as the computational process is identical (the batch job *is* the simulated rat, albeit slowly). If substrate matters, embedding might be a secondary factor, but the core is still substrate.

  ### Why this order? The Flow

  1.  **#1 (Substrate):** Does computation *as such* even *possibly* ground moral status? **->** Defines the domain.
  2.  **#2 (Continuum/Threshold):** Which computations *within* that domain *might* matter, and how urgently? **->** Defines the target and the scale of the problem.
  3.  **#3 (Units):** *What* precisely (instance, copy, run, subpart) in those target systems bears the status? **->** Defines the object of concern.
  4.  **#4 (Burden):** How to act *given the answers* (or uncertainty) from 1-3? **->** Defines the practical response.

  ### Resource Allocation Suggestion (2 Postdocs / 2 Years)

  *   **Year 1:** Both postdocs heavily on **#1 (Substrate Independence)**, collaborating intensively. This is the linchpin.
  *   **Year 2:**
      *   Postdoc 1: Moves to **#2 (Continuum/Threshold)**, building directly on #1.
      *   Postdoc 2: Moves to **#3 (Units of Concern)**, building directly on #1 and feeding into #2.
  *   **Throughout Years 1 & 2:** Both (and PI) engage periodically on **#4 (Burden of Proof)**, formalizing it towards the end of Year 2 once #1-#3 have clearer outputs.

  This sequence maximizes the chance of resolving the most foundational questions first, ensuring later work rests on solid ground, while directly tackling the issues with the highest leverage for understanding if, when, and why computations might be moral patients. It stays firmly within the realm of tractable philosophy/math while remaining responsive to critical empirical developments (like valence evidence in RL).
