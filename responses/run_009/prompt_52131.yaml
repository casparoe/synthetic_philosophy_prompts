answer: |-
  ### Moral Responsibility Quiz  
  *Answer each question by selecting one option.*

  1. **Frankfurt Case:** Jones must choose whether to steal a rare book. Unbeknownst to him, neuroscientist Black implanted a device that would force him to steal if he showed signs of refusing. Jones independently chooses to steal the book, and Black never intervenes. Is Jones morally responsible for stealing?  
     A) Yes, because he acted freely based on his own reasons.  
     B) No, because Black’s device meant he couldn’t have done otherwise.  

  2. **Whole-Life Manipulation:** Neuroscientists causally determined Smith from birth to steal a valuable painting at age 30. Smith has no idea he was manipulated; he feels he acted on his own desires (which the scientists engineered). Is Smith morally responsible for stealing?  
     A) Yes, because he acted on his own desires and reasons, just like anyone else.  
     B) No, because his character and actions were determined by external forces.  

  3. **Psychopathy:** Taylor is a diagnosed psychopath. He cannot grasp moral reasons (e.g., why stealing is wrong) but excels at instrumental reasoning (e.g., avoiding consequences). He steals money when he knows he won’t get caught. Is Taylor morally responsible?  
     A) Yes, because he understood the risks and benefits and chose deliberately.  
     B) No, because he lacks the capacity to recognize moral considerations.  

  4. **Coercion:** Lee is threatened by a mobster: "Drive our getaway car, or we kill your family." Terrified, Lee complies. Is Lee morally responsible for aiding the robbery?  
     A) Yes, because he still chose to participate.  
     B) No, because the threat left him no reasonable alternative.  
     C) Partially responsible, since he could have sought help.  

  5. **Transformation:** Maria murdered someone in a rage 20 years ago but has since undergone profound change—she regrets her crime, advocates for peace, and is now a model citizen. Is Maria *still* morally responsible for the murder?  
     A) Yes, because she committed the act, regardless of her current self.  
     B) No, because she is a fundamentally different person now.  

  6. **Objective Attitude and Love:** Suppose hard determinism is true (all actions are causally determined). Could you adopt the *objective attitude* (treating someone as a complex object to be managed) toward your own child who hurt you, while still genuinely loving them?  
     A) Yes, love doesn’t require holding someone morally responsible.  
     B) No, loving someone involves seeing them as a moral agent, not just an object.  

  7. **Resentment and Hard Determinism:** Suppose hard determinism is true. Your friend betrays you maliciously. Is your resentment toward them *fitting* (appropriate)?  
     A) Yes, resentment reflects the wrong done and isn’t negated by determinism.  
     B) No, if determinism is true, no one is truly responsible, so resentment is unfitting.  

  8. **Negligence:** Alex knew driving while exhausted was risky but did it anyway. He dozed off and caused an accident, injuring a pedestrian. Is Alex morally responsible for the harm?  
     A) Yes, because he knowingly took an unreasonable risk.  
     B) No, because he didn’t intend harm and couldn’t fully control his exhaustion.  
     C) Partially responsible, as he made a reckless choice but without malice.  

  ---

  ### Scoring Key  
  *Map your answers to positions using the table below.*  

  | Position                        | Core Tenet                                                                 | Answer Pattern (Q1–Q8)                              | Notes                                                                 |
  |---------------------------------|----------------------------------------------------------------------------|-----------------------------------------------------|-----------------------------------------------------------------------|
  | **Hard Incompatibilism**        | Moral responsibility is impossible with determinism (or indeterminism).    | **1B, 2B, 3B, 4B, 5B, 6A, 7B, 8B/C**               | Denies responsibility in all cases; rejects reactive attitudes.       |
  | **Strawsonian Compatibilism**   | Responsibility depends on "quality of will" and our reactive attitudes.    | **1A, 2A, 3B, 4B, 5A, 6B, 7A, 8A**                | Excuses only with impaired agency (e.g., coercion, psychopathy).     |
  | **Reasons-Responsiveness (Fischer)** | Responsibility requires guidance control (reasons-responsiveness in the actual sequence). | **1A, 2A, 3B, 4B, 5A, 6B, 7A, 8A** | Like Strawsonian but emphasizes rational capacities over emotional attitudes. |
  | **Reason View (Wolf)**          | Responsibility requires the ability to act on the "True and Good."         | **1A, 2A or B, 3B, 4B, 5A, 6B, 7A, 8A**            | Distinguishes deep/moral responsibility from mere intentional action. |
  | **Shoemaker Answerability-Only**| Responsibility is solely about answerability (justifying judgments).       | **1A, 2A, 3A, 4B, 5A, 6B, 7A, 8A**                | Psychopaths may be responsible if they can reason instrumentally.     |

  #### Key Limitations and Notes:
  1. **Indistinguishable Pairs:**  
     - **Strawsonian, Fischer, and Wolf views** *cannot be separated* by this quiz (all share: 1A, 3B, 4B, 5A, 6B, 7A, 8A).  
       - *Distinguishing requires theory*:  
         - Strawsonians focus on emotional reciprocity (Q6, Q7).  
         - Fischer prioritizes reasons-responsive mechanisms (Q2, Q3).  
         - Wolf requires ability to grasp the moral "Good" (Q3, Q5).  
     - **Shoemaker vs. Others**: Only differs on Q3 (psychopaths).  

  2. **Inconsistent/Unoccupied Positions:**  
     - **Q2A + Q2B hybrid**: No position accepts *both* that ordinary actors are responsible (Q2A) *and* that manipulated-but-capable agents like Smith (Q2) are not.  
     - **Q1A + Q7B hybrid**: No position supports Frankfurt responsibility (Q1A) but rejects resentment under determinism (Q7B).  
     - **Q3A + Q4A + Q5B**: Psychopaths responsible (Q3A), coerced actors responsible (Q4A), but reformed offenders not (Q5B) is theoretically unstable.  

  3. **Ambiguities:**  
     - **Wolf on Q2**: May answer A ("normal" capacities suffice) *or* B (manipulation undermines true agency).  
     - **Shoemaker on Q3**: Answers A (psychopaths are answerable for choices) unlike others.  
     - **Partial Responsibility (Q4C/Q8C)**: Compatible with all except hard incompatibilism (which rejects responsibility entirely).  

  4. **Scoring Advice:**  
     - If your answers match a pattern perfectly, you likely align with that position.  
     - If answers are mixed (e.g., 1A/2B/3B/4B/5A/6B/7A/8A), you may blend views or hold a non-standard position.  
     - **Hard incompatibilism** is the *only* position with 7B and 6A.  

  *This quiz simplifies complex debates; use it to spark discussion, not as a definitive taxonomy.*
