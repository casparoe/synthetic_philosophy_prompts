  1. Jones is deciding whether to steal a rare book. Black, a neuroscientist, has implanted a device in Jones's brain that would force him to steal the book if he were about to choose not to steal. However, Jones decides to steal the book on his own, and Black never intervenes. Jones steals the book. Is Jones morally responsible for stealing the book?
     A) Yes, because he did it on his own without any intervention.
     B) No, because if he had chosen not to steal, Black would have forced him, so he couldn't have done otherwise.

  2. From birth, neuroscientists have manipulated Smith's brain to cause him to become a thief, but they have not impaired his cognitive capacities. He has normal abilities to reason morally and to recognize right from wrong. They set up his desires and beliefs so that he would definitely steal a valuable painting at age 30. At 30, Smith steals the painting exactly as planned. He has no idea about the manipulation and feels he is acting on his own desires. Is Smith morally responsible for stealing the painting?
     A) Yes, because he knew it was wrong and chose to do it anyway, acting on his own desires.
     B) No, because his decision was determined by the neuroscientists' manipulation.

  3. Taylor is a diagnosed psychopath. He does not feel guilt, remorse, or empathy. He understands that others consider certain actions morally wrong, but he does not see why they matter. However, he is very good at planning and reasoning instrumentally. For example, he knows that stealing from his employer could lead to job loss, so he refrains. But when he sees an opportunity to steal a large sum of money without getting caught, he does it. Is Taylor morally responsible for stealing the money?
     A) Yes, because he understood the consequences and made a calculated choice.
     B) No, because he lacks the capacity to grasp moral reasons.

  4. Lee is threatened by a mobster: "If you don't help us rob this bank, we will kill your family." Lee, terrified, agrees to drive the getaway car. He does so and the robbery is successful. Is Lee morally responsible for driving the getaway car?
     A) Yes, because he still chose to do it (even under threat).
     B) No, because he was coerced and had no reasonable alternative.
     C) Partially responsible, because he could have sought help from the police.

  5. Twenty years ago, Maria committed a terrible crime: she killed a neighbor in a fit of rage. Since then, she has undergone a profound change: she deeply regrets her actions, has spent years in therapy, and has become a peaceful, non-violent person. Now, she is a respected member of her community and works to prevent violence. Is Maria still morally responsible for the murder she committed twenty years ago?
     A) Yes, because she committed the crime and the guilt remains.
     B) No, because she is a completely different person now and holding her responsible would be punishing the wrong person.

  6. Imagine that you are the parent of a teenager who has just done something very hurtful to you (like stealing from you and lying about it). You believe that hard determinism is true: every event, including human actions, is causally determined by prior events and the laws of nature. Could you adopt the objective attitude (seeing your child as a patient to be managed, like a complex machine) toward your child while still genuinely loving them?
     A) Yes, because love doesn't require holding someone responsible in the moral sense.
     B) No, because love involves seeing the person as a moral agent, and the objective attitude is incompatible with that.

  7. Suppose hard determinism is true. Your friend betrays you by spreading a malicious lie about you. You feel resentment toward your friend. Is your resentment fitting (appropriate) even though hard determinism is true?
     A) Yes, because resentment is a natural reaction to being wronged and doesn't require that the person could have done otherwise.
     B) No, because if hard determinism is true, no one is morally responsible, so resentment is never fitting.

  8. Alex is driving home after a long shift at work. He is extremely tired and, despite knowing the risks of drowsy driving, he decides to drive anyway. On the way, he dozes off and causes a serious accident, injuring a pedestrian. Is Alex morally responsible for the injuries he caused?
     A) Yes, because he knew the risks and chose to drive tired.
     B) No, because he didn't intend to harm and was exhausted beyond his control.
     C) Partially responsible, because he made a bad choice but didn't mean to hurt anyone.

  ---- END QUIZ ----

  Scoring Key:

  First, tabulate your answers.

  For positions, we have:

  - Hard incompatibilism: 
     Answers: 1B, 2B, 3B, 4B (or sometimes C, but B is the core no), 5B, 6A, 7B, 8B (or C? We will say 8B or C counts as incompatibilist leaning, but ideally B)

    If you have at least 6 of these: 1B, 2B, 3B, 4B, 5B, 8B, and also 6A and 7B, then you are a hard incompatibilist.

  - Compatibilism (general): If you are not a hard incompatibilist, then you are likely a compatibilist. But we cannot distinguish between the types well.

  For the compatibilist views, we look for:

  - Strawsonian quality-of-will: 
     Typically: 1A, 2A, 3B, 4B, 5A, 6B, 7A, 8A

  - Fischer-style reasons-responsiveness: 
     Typically: 1A, 2A, 3B, 4B, 5A, 6B, 7A, 8A   (same as Strawsonian)

  - Wolf-style reason view: 
     Typically: 1A, 2A, 3B, 4B, 5A, 6B, 7A, 8A   (same)

  - Shoemaker-style answerability-only: 
     Typically: 1A, 2A, 3B, 4B, 5A, 6B, 7A, 8A   (same)

  Note: The compatibilist views all yield the same answer pattern in this quiz. This is because the quiz does not contain cases that highlight the differences between these views. In particular, the views might differ on cases of history (like manipulation) or on the exact conditions for an excuse, but our cases do not capture that.

  Therefore, if you are not a hard incompatibilist, you are some kind of compatibilist. To determine which type, you would need to reflect on your reasons for your answers.

  Additionally, there are combinations that no real position holds. For example, if you answer 1A (compatibilist on Frankfurt) but 2B (incompatibilist on manipulation), there isn't a standard position that holds that. Similarly, if you think resentment is fitting (7A) but also think you can take the objective attitude (6A), that might be unusual.

  We hope this quiz prompts discussion in the final section!

