  If we grant that beasts "imagine" in sleep, pray tell: why does your beagle never *recount* his dreams at dawn? When you wake from a nightmare, you gasp, "I saw a dragon!"—demonstrating reflexive awareness of your own thoughts. Where is the hound’s equivalent? Where is the *sign* he comprehends his twitches as anything but noise in the machine?  

