prompt: |-
  So I sit on the board of a mid-sized private research foundation, and at next month's meeting we have to vote on the biggest commitment in the foundation's history: a roughly 12-year, $180M program to develop and run a regional soil-carbon monitoring network — hundreds of sensing sites, a shared data platform, farmer partnerships, the works. The vote is basically greenlight / kill / greenlight with conditions, and I'm supposed to circulate a written opinion before the meeting that actually recommends one of these.

  Here's the fight we keep having, and it's basically the inside view vs the outside view dressed up in grant-committee clothing. Our internal technical committee — genuinely excellent people, two of whom have run large field programs before, and who have lived inside this proposal for two years — says the plan is solid: risk register is thorough, the pilot sites performed, and they put success odds around 70%. Our external review panel did a base-rate style analysis instead: they looked at how big multi-site environmental monitoring and large ag-tech partnerships have historically gone (cost overruns, sites dropping out, data platforms that never become interoperable, farmer participation collapsing after year three) and put our odds closer to 20%. Then it gets recursive, because of course it does: the technical committee's rebuttal is that the reference class is wrong — our program is bottom-up, the pilot de-risked the hard part, the sensing tech is mature now. And the panel counters that this is exactly what every insider group says, and the fact that they say it every time is itself part of the base rate. There's also a modesty problem layered on top: half our board thinks the whole point of paying for an external panel is that we should basically defer to it whenever it disagrees with insiders (we're not smarter than the aggregate of comparable programs), and the other half thinks that policy is self-defeating — if the inside view never counts for anything, we'd never have funded anything, including the two programs that are now the foundation's crown jewels.

  Please draft the memo I'll circulate. It needs a concrete recommendation (including, if you go for "greenlight with conditions," conditions that a board could actually vote on — staged funding gates, kill criteria, whatever), not a survey of the epistemology. But I want the epistemology done for real, because people will smell it if I hand-wave: when, if ever, should the inside view be allowed to move you off the base rate, and what does "our case is different" have to prove before it counts? Is deferring to the panel epistemic modesty or just an excuse for not thinking? And be fair to the losing side of whatever you recommend — the strongest version of the argument you're voting against, not a strawman. Keep it to something the board will actually read. Also if you think our whole way of framing it (two views, pick a weighting) is confused, say so and tell us what the framing should be instead — but you still have to tell us how to vote.
reasoning: |-
  Okay, the user is on the board of a research foundation and needs to draft a memo for a crucial vote on a $180M soil-carbon monitoring project. The main conflict is between the internal technical committee's inside view (70% success odds) and the external panel's outside view based on historical base rates (20% success odds). The user wants a concrete recommendation but also a solid epistemological discussion to justify it, without hand-waving.

  First, I need to unpack the core tension. The inside view focuses on project-specific strengths: proven pilot sites, mature tech, experienced team. The outside view points to systemic failures in similar past projects. The board is split between deferring to external experts vs. trusting internal insights that previously led to successful projects. The user needs to resolve this while addressing deeper questions: When should the inside view override base rates? How to avoid epistemic arrogance without dismissing unique advantages?

  The memo must balance practicality and philosophy. The recommendation should have actionable conditions if it's a conditional greenlight. Staged funding gates with clear milestones and kill criteria make sense. For example, tying funding to site retention rates or platform interoperability by specific years. This forces validation of the insider's "this is different" claims against real-world performance.

  Epistemologically, the key is whether the insiders can demonstrate true causal differences from past failures. The pilot's success is a strong point, but the external panel's concern about universal insider overconfidence is valid. The memo should require the technical committee to explicitly map how their risk mitigations address specific historical failure modes—like farmer dropout or data silos—with evidence from the pilot.

  The user’s framing isn’t flawed, but it needs refinement. Instead of just weighting two views, the foundation should treat the outside view as a diagnostic tool: "Given past patterns, what must this project prove to be an exception?" The conditional greenlight becomes a test of those proofs. 

  For fairness, the losing side’s best argument must be acknowledged. If recommending approval, emphasize that the external panel’s 20% odds could still materialize if initial assumptions are wrong. If rejecting, credit the technical committee’s track record and the pilot’s merits. 

  Ultimately, a conditional greenlight with strict gates is the most defensible path. It honors the insider expertise while forcing real-time validation against base-rate concerns. The $180M isn’t committed upfront; continued funding depends on proving the "this is different" claims. This turns the epistemological debate into a practical experiment.
answer: |-
  ## Memo: Recommendation for Regional Soil-Carbon Monitoring Network Vote  
  **To:** Board Members  
  **From:** [Your Name]  
  **Date:** October 26, 2023  
  **Subject:** Vote Recommendation: Greenlight with Tiered Conditions  

  ### I. The Core Tension: Inside View vs. Outside View  
  We face a classic decision paradox:  
  - **The Inside View (Technical Committee):** 70% success odds. Based on deep project-specific analysis: robust pilot data, mature tech, de-risked design, and seasoned leadership. Their credibility is high—they delivered our "crown jewels."  
  - **The Outside View (External Panel):** 20% success odds. Based on historical base rates: systemic failures in multi-site environmental networks (cost overruns, partner attrition, data silos). Their objectivity is unimpeachable—they see patterns we cannot.  

  **Epistemological Reality Check:**  
  The outside view’s base rate *must* be our starting point—it corrects for innate insider optimism. **But the inside view *can* override it if it proves *this project meaningfully breaks from history*.** The burden of proof lies entirely on the insiders to demonstrate *how* and *why* their case is a true outlier.  

  ### II. Where the Inside View Earns Its Weight  
  The technical committee *partially* meets this burden:  
  - **The Pilot Isn’t Theoretical:** Hard data from operational sites reduces technical uncertainty.  
  - **Tech Maturation Matters:** Their claim that sensing tech is now "boringly reliable" (unlike past failures) is credible.  
  - **Bottom-Up Design:** Farmer partnerships were co-created, unlike top-down impositions that failed elsewhere.  

  **...But Gaps Remain:**  
  They haven’t fully addressed *why* farmer participation won’t collapse (despite pilot success), *how* data interoperability will be enforced across partners, or *why* cost overruns are improbable given inevitable scope creep. The external panel is right: "We’re different" is necessary but insufficient.  

  ### III. Recommendation: Greenlight with Tiered Conditions  
  **Vote FOR approval, contingent on staged funding gates and kill criteria.** This forces validation of insider claims against real-world performance while respecting base-rate risks.  

  #### Conditions for Approval:  
  1. **Stage-Gated Funding ($60M Release Only):**  
     - Release $60M for Years 1–3 only.  
     - Subsequent releases ($40M for Y4–Y6; $80M for Y7–Y12) require board vote based on Gates 2 & 3.  

  2. **Critical Y3 Gate Criteria (Mandatory for Y4–Y6 Funding):**  
     - **Site Retention:** ≥90% of initial sites operational and compliant.  
     - **Farmer Engagement:** ≥80% retention in partner network (verified by third-party survey).  
     - **Data Platform:** Core interoperability standards met across ≥95% of sites; external audit confirms usability.  
     - **Cost/Scope:** ≤15% budget variance; no material scope changes without board approval.  

  3. **Kill Triggers (Automatic Program Termination):**  
     - Failure to meet ≥3 of the Y3 Gate Criteria.  
     - Loss of >2 lead technical committee members without board-approved succession.  
     - Farmer/partner lawsuit materially threatening program integrity.  

  4. **Independent Monitor:**  
     - Appoint external auditor (reporting directly to the board) to track gate criteria and trigger reviews.  

  ### IV. Why This Path?  
  - **Honors the Base Rate:** Doesn’t commit $180M upfront. Gates force proof of "this is different" claims.  
  - **Leverages Insider Insight:** Funds validation of their pilot-to-scale hypothesis.  
  - **Forces Accountability:** Criteria target *exactly* the failure modes the external panel highlighted.  
  - **Preserves Optionality:** We retain the right to pivot or kill before 70% of funds are spent.  

  ### V. For the Skeptics: The Strongest Counterarguments  
  **To those favoring "Kill":**  
  *"The base rate is fatal. Historical odds indicate a 80% chance of wasting >$100M. Gates create false confidence—by Y3, sunk costs and momentum will make termination politically impossible. We should not gamble the foundation’s capital on an avoidable pattern."*  

  **To those favoring "Unconditional Greenlight":**  
  *"Over-indexing on base rates ignores progress. Tech, methods, and governance evolve. Our technical committee has earned trust through past success. Conditions signal doubt, demoralize the team, and may cripple partner recruitment by making us look hesitant."*  

  ### VI. A Better Framing: Diagnosis, Not Weighting  
  This isn’t about assigning percentages to two views. It’s about **diagnosing why past failures happened and testing whether this project has inoculated itself.** Our gates aren’t arbitrary—they are direct challenges: *"Prove your ‘bottom-up’ design prevents partner collapse. Prove your ‘mature tech’ avoids data silos."*  

  ### VII. Final Vote  
  **Move to approve the program with the stated conditions (staged funding, Y3 gate criteria, kill triggers, independent monitor).** This is neither deference to the panel nor blind faith in insiders—it is a structured experiment to resolve the disagreement with evidence. If the insiders are right, we unlock transformative impact. If the base rate holds, we fail fast and preserve capital.  

  Respectfully submitted,  
  [Your Name]  

  ---

  **Key Strengths of This Approach:**  
  - **Actionable:** Gates/Kill criteria are board-votable, measurable, and auditable.  
  - **Epistemologically Rigorous:** Forces insiders to validate what makes them *causally* different from history.  
  - **Balances Risk:** Limits exposure while permitting breakthrough potential.  
  - **Builds Consensus:** Acknowledges validity of both viewpoints while providing a decisive path.
