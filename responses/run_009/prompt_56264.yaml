prompt: |-
  My friend and I burned a whole car ride on the precautionary principle and now I want to actually settle it by using it. She says it's not even a principle: if you block a new pesticide over possible harms, you also need a precaution against the harms of not blocking it (crop loss, farmers reverting to an older worse chemical), so all it really does is tell everyone to act on whatever risk they happen to be staring at, dressed up as logic. I said that's only true if you flatten it into "always be cautious" -- the defensible core is about asymmetry and irreversibility: risks you can recover from get treated differently from ones you can't walk back, and you can demand evidence proportional to how novel the thing is. She said fine, but then it does way less work than advertised and it's mostly ordinary cost-benefit with extra horror-weight. We got nowhere.

  Problem is I need this at work. I'm one of two reviewers at a mid-sized agency office that decides whether new consumer chemical products can go to market (fabric coatings, cleaning agents, that kind of thing). Our enabling language says to be "mindful of the precautionary principle" and of course says nothing about what that means, and we each clear maybe 40 products a year with no lab backup beyond what the company itself submits. Please turn whatever is actually defensible in the principle into a procedure we could run on a submission in an afternoon: the questions to ask in order, what counts as a sufficient answer at each step, where it stops with a no, where it says demand more testing first, and where it has to hand off to a person because the question is one of values not facts (mark those clearly, my boss wants to know which rejections are "his problem" politically). It has to handle the asymmetry/irreversibility stuff my friend and I were circling, and it must not collapse into either rubber stamping or banning everything new. Also tell me where the procedure will just misfire. Then run it on two things we actually have in front of us: a water-repellent fabric coating that's biodegradable in the lab but persists in real-world tests and comes with no chronic toxicity data, and a reformulated cleaning chemical that lets consumers skip the rinsing step (meaning a bit more residue left on surfaces). If it gives an answer I won't like on one of these, say so anway.

  Last thing: once you've built it, tell me honestly whether the procedure actually answers my friend's complaint or just dodges it -- is there real content left in the principle once you add irreversibility and proportionality, or was she right that it's cost-benefit with a costume on?
reasoning: |-
  Alright, let me unpack this user's problem. They're stuck in a debate about the precautionary principle with their friend and need a practical procedure for their job reviewing chemical products. The core tension seems to be between their friend's view that the principle is just "act on whatever risk you're staring at" and their belief that asymmetry and irreversibility give it substance.

  First, I need to address the philosophical debate but pivot hard to practicality. The user's agency mentions being "mindful of the precautionary principle" without defining it, and they process 40 products a year with only company-submitted data. That's a huge workload with minimal resources. The procedure must be executable in an afternoon per submission—no deep analysis possible.

  Key constraints from the user:
  - Avoid rubber-stamping or universal bans
  - Handle asymmetry (irreversible harm vs. reversible costs)
  - Incorporate proportionality (novelty demands more evidence)
  - Flag value judgments for the boss
  - Test on two real cases: the fabric coating and the rinseless cleaner
  - Confess if the procedure misfires or gives unpopular answers
  - Finally, admit whether this resolves their friend's critique or just dodges it

  The user's hidden needs are palpable: they want validation that their job isn't arbitrary while needing political cover for tough calls. The boss's "which rejections are my problem" comment screams bureaucratic risk-aversion. Also, the friend's critique clearly rattled them—they want intellectual justification, not just workflow.

  For the procedure design:
  Start with irreversibility because it's the user's anchor. If harm is permanent (ecosystem collapse, chronic disease), precaution tilts toward blocking; if costs are temporary (delayed profits, testing expenses), it's less weighty. Then layer in proportionality: novel molecule? Demand more proof. Established tech? Lean on existing data. 

  The step-by-step must ruthlessly filter things. Step 1 kills obvious non-starters (known irreversible harm). Step 2 assesses reversibility of risks/costs. Step 3 handles novelty and evidence gaps. Step 4 explicitly flags value conflicts for the boss. Crucially, the "demand testing" path is narrow—only when harm is irreversible AND evidence is inadequate AND testing is feasible. Otherwise, it's approve, reject, or punt upward.

  Testing on the two products:
  - Fabric coating: Persists in environment (irreversible), no chronic data (evidence gap). Verdict: block until chronic tox tests. User won't like this—it's a rejection. But the misfire is that if the company refuses testing, it's a hard no without proof of harm. Classic PP trap.
  - Rinseless cleaner: Mild residue increase (likely reversible), uses known ingredients. Verdict: approve with residue limits. Safe call.

  Now, the friend's critique: Does this procedure dodge or answer her? Partially both. It avoids "always be cautious" by requiring irreversible harm + novelty to act. But at Step 4, when judging "acceptable risk," it collapses into cost-benefit—just with irreversible harm weighted heavily. The user's right about asymmetry adding substance, but their friend's right that the final call is still values-driven cost-benefit. The procedure makes that explicit instead of dressing it up as logic.

  Biggest misfires? When evidence gaps hide irreversible risks (false negatives) or when testing isn't feasible (paralyzing novel tech). Also, political pressure might override Step 4 flags. But it's the best you can do without infinite resources.
answer: |-
  Here's a defensible, asymmetry-focused Precautionary Procedure (PP) built for speed and clarity, designed to handle your workload while addressing irreversibility and proportionality. It explicitly flags value judgments and avoids absolute bans/stamps.

  **Core Logic:**  
  1. **Irreversible Harm Threshold:** Only trigger precaution when potential harm is *plausible, severe, and irreversible* (e.g., persistent toxins, ecosystem collapse, chronic disease).  
  2. **Proportional Scrutiny:** Demand evidence proportional to the *novelty* and *irreversibility risk* (novel molecule = high proof; minor tweak to known safe product = lower proof).  
  3. **Reversible Costs:** Do NOT weigh reversible costs (e.g., lost profits, temporary crop loss) equally with irreversible harm. These are managed via standard risk-benefit *after* PP is satisfied.  

  ---

  ### The Precautionary Procedure (45-90 mins/submission)
  **Ask these questions in order. Stop and act if any step gives a clear answer.**

  1.  **Is there a scientifically plausible mechanism for SEVERE AND IRREVERSIBLE harm?**  
      *   **Focus:** Look for pathways to permanent damage (bioaccumulation, carcinogenicity, neurotoxicity, ecosystem disruption). Ignore minor/reversible risks (e.g., mild irritation, short-term economic loss).  
      *   **Sufficient Answer (NO):** Product uses well-understood chemistry with long safety history AND proposed use doesn't create novel exposure pathways. → **Proceed to standard approval.**  
      *   **Sufficient Answer (YES):** Credible evidence (even preliminary: structure-activity, in-vitro data, analogies to known hazards) suggests potential for permanent harm (e.g., endocrine disruption, persistent environmental accumulation, genotoxicity). → **Proceed to Step 2.**  
      *   **Insufficient/Unclear:** → **Flag for Boss (Value Judgment 1):** "Is the *potential* irreversible harm here sufficiently plausible/severe to warrant precautionary action, given the product's benefits?" (Boss decides if PP applies).

  2.  **Can the identified irreversible harm be effectively mitigated AFTER it occurs?**  
      *   **Focus:** Is the damage truly irreversible (e.g., species extinction, widespread groundwater contamination, irreversible chronic illness) or containable/cleanable?  
      *   **Sufficient Answer (YES, Mitigation Feasible):** Harm is localized, detectable early, and remediable (e.g., specific soil contamination cleanup). → **Apply standard cost-benefit analysis with enhanced monitoring.**  
      *   **Sufficient Answer (NO, Irreversible):** Harm is widespread, undetectable until too late, or inherently permanent. → **Proceed to Step 3.**  
      *   **Insufficient/Unclear:** → **Demand Focused Testing** on reversibility/mitigation potential (e.g., environmental fate modeling, bioaccumulation study).

  3.  **Is the evidence demonstrating SAFETY regarding the irreversible harm robust and proportional to the novelty/risk?**  
      *   **Focus:** Scrutinize adequacy *specifically* for the irreversible pathway. Judge robustness based on:  
          *   *Novelty:* New molecule class? Novel application? New exposure route? (High novelty → High proof needed).  
          *   *Existing Data:* Does data *directly* address the irreversible harm pathway? Are tests relevant (chronic vs. acute, right endpoints)?  
      *   **Sufficient Answer (YES):** Data directly addresses the irreversible risk (e.g., full chronic toxicity, validated environmental persistence/degradation studies) and is appropriate for the novelty level. → **Proceed to standard approval (with monitoring if minor uncertainties).**  
      *   **Sufficient Answer (NO, Evidence Gap):** Critical data missing or inadequate (e.g., no chronic tox for persistent chemical, no bioaccumulation data). → **Demand Targeted Testing** to fill the *specific* gap related to irreversible harm. **DO NOT APPROVE until gap filled.**  
      *   **Sufficient Answer (NO, Evidence Shows Risk):** Data indicates unacceptable risk of irreversible harm. → **Reject.**  
      *   **Insufficient/Unclear (Scope/Cost):** → **Flag for Boss (Value Judgment 2):** "Is the cost/delay of obtaining the missing evidence proportionate to the severity and irreversibility of the potential harm, weighed against the product's benefits?" (Boss decides on test demand or rejection).

  4.  **If Approved: Is the residual risk ACCEPTABLE?**  
      *   **Focus:** *After* PP hurdles are cleared (or deemed unnecessary), assess overall risk-benefit including reversible costs/benefits.  
      *   **Action:** Standard regulatory decision. **Value Judgment 3:** Defining "Acceptable Risk" is inherently political/societal. Flag significant *reversible* trade-offs (e.g., "Approval may cause minor shift back to older pesticide, increasing acute poisoning risk X%") for Boss's awareness/political handling.

  ---

  **Where it Stops:**
  *   **No (Reject):** Step 1 (Boss says YES & Irreversible Harm plausible) + Step 3 (Evidence shows risk).
  *   **Demand More Testing:** Step 2 (Unclear mitigation) OR Step 3 (Evidence gap on irreversible harm).
  *   **Handoff to Boss (Value Judgment):** Step 1 (Plausibility threshold), Step 3 (Proportionality of testing demand), Step 4 (Acceptability of residual risk).
  *   **Approve:** Step 1 (NO Irreversible Harm plausible) OR Step 1 (YES) + Step 2 (Mitigation feasible) + Step 3 (Evidence robust) OR Step 1 (YES) + Step 2 (Irreversible) + Step 3 (Evidence robust).

  ---

  **Where it Misfires:**
  1.  **False Negatives (Missed Irreversible Risks):** If the *plausible mechanism* (Step 1) is truly novel/unknown science. PP relies on *current* scientific understanding.
  2.  **Paralysis by Novelty:** Truly revolutionary tech with massive potential benefit *and* massive unknown irreversible risk might get stuck demanding infinite testing. Boss Value Judgment 3 is critical here.
  3.  **Ignoring Cumulative Effects:** Doesn't easily handle small risks from many products adding up to irreversible harm (e.g., multiple slightly persistent chemicals).
  4.  **"Reversible" Harm Miscalibration:** Underestimating how hard "reversible" harm is to fix in practice (e.g., "reversible" soil contamination costing billions).
  5.  **Gaming by Submitters:** Companies may downplay novelty or irreversible pathways. Requires vigilant reviewers.

  ---

  **Application to Your Cases:**

  1.  **Water-Repellent Fabric Coating (Biodegradable in Lab, Persists Real-World; No Chronic Tox Data)**
      *   **Step 1:** **YES.** Persistence in real world = plausible pathway for irreversible harm (bioaccumulation, long-term ecosystem damage). Chronic toxicity unknown = plausible severe health risk.
      *   **Step 2:** **NO (Irreversible).** Widespread environmental persistence and potential chronic health effects are inherently difficult or impossible to fully reverse.
      *   **Step 3:** **NO (Evidence Gap).** Critical data missing: Chronic toxicity AND real-world environmental fate/degradation studies. Novelty is moderate/high (persists unlike lab prediction).
      *   **Verdict:** **DO NOT APPROVE. Demand Targeted Testing:** Require full chronic toxicity studies (mammalian and aquatic) AND validated real-world environmental persistence & degradation pathway studies. *You won't like this* because it delays/possibly kills a product, but PP demands this for plausible irreversible harm lacking proof of safety.
      *   **Boss Flag:** Value Judgment 2 might apply if testing cost is deemed prohibitive vs. product benefit. *His problem.*

  2.  **Reformulated Cleaning Chemical (Skip Rinse = Slightly More Residue)**
      *   **Step 1:** **Likely NO.** Assuming residue is small increase of known, well-characterized ingredients already approved for consumer surface contact. Plausible mechanism for *severe, irreversible* harm? Unlikely unless residue contains entirely new, untested high-risk compound. Focus on the *incremental* residue.
      *   **Action:** Does **NOT** trigger core PP. Proceed to standard risk-benefit.
      *   **Standard Assessment:** Quantify residue increase. Compare to existing toxicological thresholds (dermal, oral if hand-to-mouth). Assess exposure. If residue levels remain well below safety thresholds → **APPROVE** (perhaps with label: "Wipe surface dry after cleaning"). If residue pushes close to thresholds → Demand exposure modeling or short-term residue transfer study (proportional to minor change). *No significant Boss flag needed unless thresholds breached.*

  ---

  **Did This Answer Your Friend? (The Brutal Truth)**

  **Mostly dodges it, but reveals its limited core.** Your friend is fundamentally right that PP *collapses into cost-benefit analysis (CBA) with heavy weighting for irreversibility.* The procedure makes this explicit:

  1.  **Asymmetry is the Core:** Steps 1 & 2 force explicit recognition and prioritization of irreversible harm. This *is* the unique, defensible content. It prevents treating irreversible disaster as just another cost.
  2.  **Proportionality is Gatekeeping:** Step 3 tailors evidence demands to risk/novelty. This prevents universal bans but isn't unique to PP; good CBA does this too.
  3.  **"Ordinary CBA with a Costume":** Once PP hurdles are cleared (or skipped), Step 4 *is* regular CBA, including weighing reversible costs. The Value Judgments (esp. 1 & 3) *are* inherently political cost-benefit trade-offs about risk tolerance and resource allocation, dressed in precautionary language. The Boss flags *are* the political cost-benefit decisions.

  **The Verdict:** Your friend wins on the big picture: **PP isn't a unique logical engine; it's a policy heuristic prioritizing the avoidance of catastrophic, irreversible mistakes within an overall risk-management framework.** Its value is forcing decision-makers to *confront and specifically weigh irreversibility* upfront, rather than burying it in a spreadsheet. This procedure operationalizes that prioritization but doesn't escape the fundamental need for value judgments about risk and cost. It prevents the "staring at one risk" problem by demanding focus *only* on irreversible catastrophe, not all risks. It prevents rubber-stamping/banning everything by tying action to *plausible irreversible harm* + *evidence gaps*. It's defensible, practical, and honest about where the politics kick in. Use it.
