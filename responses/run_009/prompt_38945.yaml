prompt: |-
  I'm a law student who wandered into a metaphysics elective for fun, and there's an apparent tension in how criminal law handles identity over time that I keep chewing on and can't resolve on my own. Please answer as if you're a professional metaphysician who also knows criminal law, and think carefully before locking into a view — maybe brainstorm the possible readings of the practice first, then evaluate them.

  Here's the practice. Criminal law holds that the person standing trial is, numerically, the very same person who committed the crime, no matter how much time has passed: ninety-year-olds get tried for things they did at twenty-two, cold-case convictions are celebrated, and "it wasn't really me anymore" cuts no ice as a defense. But the same legal systems do things that seem to pull the other way: statutes of limitations say that for most crimes (though notably not murder) the state loses the right to prosecute after some years; parole boards and sentencing hearings treat "he's become a different man" as genuine mitigation; and at sentencing, the fact that the defendant's life has completely changed since the offense is routinely considered relevant. Meanwhile the metaphysics elective taught me that there's a live debate about persistence: endurantism (you are wholly present at every moment, strictly identical to your younger self) versus perdurantism (you are a four-dimensional worm of temporal parts, and the person in the dock is a later stage of the worm, connected to but not identical with the stage that did the deed).

  So, questions. What view of identity over time does punishing a ninety-year-old for the twenty-two-year-old's crimes actually presuppose — does it need the endurantist's strict identity, or could a perdurantist get by saying "same worm, one continuous person, close enough"? What is owed to the worry, which I've seen raised against temporal-parts views, that on the perdurantist picture punishment starts to look like making one entity suffer for another entity's deed — the stage in the prison cell isn't the one who pulled the trigger, he's just causally downstream of him? Is the practice even internally consistent, given that too much personal change can bar prosecution for fraud but not for murder — does that presuppose that sameness-of-person comes in degrees, or that it matters differently for different kinds of crime, or is there some cleaner story? Finally, distinguish what parts of the practice strictly require which metaphysics from what's merely compatible with several: could an endurantist and a perdurantist both fully justify the practice, just telling different stories about why retribution legitimately flows across decades? And if the perdurantist story won out, what would actually have to change in courtroom practice — would the whole thing quietly become a legal fiction, and would testimony about transformation at parole hearings move from afterthought to the core of the inquiry?
reasoning: |-
  Okay, let me start by unpacking this law student's dilemma. They're noticing a tension in criminal law between strict identity claims over time and practices that acknowledge personal change. The core question seems to be: how can legal systems simultaneously insist that a 90-year-old is identical to their 22-year-old criminal self while also recognizing mitigation for rehabilitation or imposing statutes of limitations?

  Hmm, I recall from metaphysics that there are two main theories of persistence: endurantism and perdurantism. Endurantism says the person is wholly present at each moment, strictly identical over time. Perdurantism sees persons as four-dimensional worms with temporal parts. The student is wondering which view criminal law presupposes.

  First, I should consider whether the law actually requires strict metaphysical identity. The "same person" language in court might be more about legal continuity than philosophical identity. Maybe the law just needs sufficient causal and psychological connections, not metaphysical identity. That could bridge both endurantist and perdurantist views.

  Then there's the punishment justification angle. Retributivism focuses on the offender deserving punishment, which seems to need identity. But the student pointed out mitigation practices where change matters. Utilitarian approaches like deterrence or rehabilitation might not need strict identity. For statutes of limitations, practical concerns like evidence decay might explain the time limits better than metaphysical doubts about identity.

  The murder exception is interesting. Why no statute of limitations for murder? It's not about identity but society's stance on the gravest crime. The legal system treats identity as binary for liability but allows degrees for sentencing. That makes sense - you're either the same person legally or not, but how much you've changed affects how we punish.

  For the perdurantist worry about punishing a different temporal part... if we see persons as extended in time, punishment affects the whole worm. The later part bears responsibility because it's connected to the criminal act through identity and causation. It's not transferring punishment but acknowledging that the person-as-a-whole committed the act.

  What would happen if courts adopted perdurantism? Probably not much change in practice. Legal identity might become a useful fiction, but mitigation evidence could get more weight. Still, the core need to attribute acts to agents over time remains, regardless of metaphysics.

  So overall, criminal law might not presuppose any specific metaphysics. It uses practical criteria for identity and adjusts punishment based on moral change. Both metaphysical views can support this with different stories. The key is that legal practice is more flexible than strict philosophical theories.
answer: |-
  Your observation cuts to the heart of how law operationalizes deep philosophical concepts. Criminal law's handling of identity over time isn't inherently inconsistent, but it reveals a pragmatic layering of metaphysical commitments, policy goals, and moral intuitions. Let's break this down systematically.

  ### 1. **What View of Identity Does Punishing the 90-Year-Old Presuppose?**
     - **Strict Numerical Identity? Not Necessarily.** The law speaks *as if* the defendant is numerically identical to the past offender, but its operational requirements are weaker. It requires:
       - **Causal Continuity:** The defendant's body/brain causally traces back to the perpetrator (no body-swapping).
       - **Autobiographical/Evidential Link:** The defendant can (in principle) recall the act, bear scars, or be tied to it via evidence.
       - **Responsibility-Bearing Structure:** The defendant's psychological architecture (even if changed) developed continuously from the perpetrator's.
     - **Compatibility with Both Metaphysics:**
       - *Endurantist Reading:* The law presupposes strict identity – the *same substance* committed both acts.
       - *Perdurantist Reading:* The law requires the defendant to be a *sufficiently connected temporal part* of the same spacetime worm. "Same person" legally means "same perduring entity." Punishment targets the worm, not just a stage.

  ### 2. **The Perdurantist "Punishing the Innocent" Worry**
     - **The Challenge:** If the 90-year-old is a different temporal part (t-90) than the 22-year-old (t-22), punishing t-90 for t-22's act seems like collective punishment.
     - **Perdurantist Rebuttals Within Legal Practice:**
       1. **The Worm Bears Responsibility:** Responsibility attaches to the *whole four-dimensional entity*, not individual stages. Punishing a later stage *is* punishing the responsible worm. (Analogy: Suing a corporation targets the entity, not specific employees).
       2. **Causal/Responsibility Inheritance:** Later stages inherit responsibility if they:
          - Benefit from the crime (e.g., stolen wealth).
          - Maintain psychological continuity sufficient for accountability (even if reformed).
          - Are the only accessible part of the responsible entity.
       3. **Practical Necessity:** Law must attribute acts to *agents persisting in time*. Perdurantism provides a coherent framework for this without requiring mystical endurance.
     - **Legal Mitigation as a Response:** Sentencing mitigation for change ("he's a different man") implicitly acknowledges this worry. The law says: "The *worm* is responsible, but *this stage*’s reformed character reduces the *worm*'s deserved punishment."

  ### 3. **Internal Consistency: Statutes of Limitations vs. Murder Exception**
     - **Not About Degrees of Identity:** The law treats identity as binary ("same person? Yes/No"). The variation stems from **policy and moral weight**, not metaphysics:
       - **Statutes of Limitations (e.g., fraud):** Rationales are practical, not metaphysical:
          * Evidentiary decay (memories fade, evidence lost).
          * Reliance interests (society moves on).
          * Incentives for efficient prosecution.
          * Lesser moral gravity (compared to murder).
       - **No Limitation for Murder:** Reflects society's view that:
          * The harm is irreparable and uniquely grave.
          * Evidentiary challenges are overridden by the demand for justice.
          * Deterrence and retribution never fully expire for the ultimate crime.
     - **"Too Much Change" Barring Prosecution (e.g., fraud):** This isn't a denial of numerical identity. It's a recognition that:
       * The causal/evidential link may be severed by time (no evidence = no trial).
       * The defendant no longer possesses the *specific fraudulent intent or capacity* relevant to the crime, making prosecution unjust or futile.

  ### 4. **Endurantism vs. Perdurantism: Compatibility & Justification**
     - **Both Can Justify the Core Practice:**
       - **Endurantist Justification:** Retribution targets the *enduring self* that committed the crime. Desert is timelessly attached to the substance.
       - **Perdurantist Justification:** Retribution targets the temporally extended entity. Desert flows from the worm's past part to its present part due to their constitutive connection.
     - **Where They Diverge (Subtly) in Mitigation:**
       - *Endurantist:* Mitigation shows the *same self* has changed, reducing its *current* desert. ("I am still the one who did it, but I am no longer wicked").
       - *Perdurantist:* Mitigation emphasizes the *qualitative difference* of the current stage from the criminal stage. Punishing *this* stage for *that* stage's act is less justified if connections are weak.
     - **What Law Strictly Requires:** Only the conditions listed in (1). Neither strict endurance nor temporal parts are *necessary*; the law needs **continuity sufficient for attribution of responsibility**.

  ### 5. **If Perdurantism "Won": Practical Implications**
     - **Courtroom Practice Wouldn't Collapse – But Nuances Would Shift:**
       - **Liability:** Minimal change. Legal "identity" would be explicitly framed as "continuity of the person-worm." Trials would still proceed.
       - **Testimony on Transformation:**
          * *At Trial:* Still irrelevant to *guilt* (the worm did it). But judges/juries might unconsciously weigh it more.
          * *At Sentencing & Parole:* **Massive elevation.** "Is this temporal stage still dangerous/deserving?" becomes central. Neuroscientific/psychological evidence of change would be paramount. Parole hearings might resemble psychiatric evaluations more closely.
       - **Statutes of Limitations:** Could be reconceptualized as "causally/psychologically too distant to fairly prosecute *this stage*," even for non-murder crimes.
       - **Legal Fictions?** Arguably, strict identity is *already* a legal fiction masking deeper continuity criteria. Perdurantism might make this explicit: "We punish this defendant because they are the persisting entity connected to the crime, not because they are metaphysically identical."

  ## Synthesis: Law as Pragmatic Metaphysics
  Criminal law doesn't presuppose a *specific* metaphysics of persistence. It **operationalizes identity** through **attribution conditions** (causal, psychological, evidential continuity) that are:
  - **Binary for liability** ("Did *this entity* do it?"),
  - **Scalar for punishment** ("How much does *this present manifestation* deserve or need?").

  The tension you observe arises because:
  1. **Liability requires minimal continuity** (traced back to the act),
  2. **Sentencing responds to maximal discontinuity** (how much the person has changed).

  **Conclusion:** An endurantist and perdurantist can both rationalize punishing the 90-year-old. The endurantist sees it as just retribution against a changed-but-identical self; the perdurantist sees it as justified retribution targeting the responsible spacetime worm. Where they truly diverge is in mitigation: perdurantism naturally elevates evidence of change by highlighting stage-specific properties, potentially making parole/sentencing more rehabilitation-focused. Yet the core practice—holding people accountable for past acts—stands resilient across metaphysical divides, grounded in law's pragmatic need for a continuous responsible agent. The law, in essence, is metaphysically promiscuous but attributionally strict.
