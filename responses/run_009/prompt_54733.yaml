  Let's design the questions:

  1. **Belief case (paid to believe):** 
     - Scenario: A billionaire offers you a fortune if you can truly believe that 2+2=5. You can't just pretend; you have to genuinely believe it. Can the money be a reason for you to believe that 2+2=5?
       - A) Yes, it's a reason to believe it, because it makes believing beneficial.
       - B) No, it's not a reason to believe it, but it is a reason to try to bring about that belief (e.g., by hypnosis or self-deception).
