       - B) No, but it is a reason to try to cultivate that desire (or to act in ways that might cause it).
       - C) No, it's only a reason to act as if you desire it (e.g., by pretending or by taking actions that the machine requires).

  3. **Admiration under threat (evil demon):**
     - Scenario: An evil demon threatens to destroy the world unless you admire him. You find nothing admirable about him. Is the threat a reason to admire him?
       - A) Yes, because it makes admiring him the right thing to do.
       - B) No, but it is a reason to try to bring about admiration (e.g., by focusing on his non-existent good qualities) or to act as if you admire him.
       - C) No, and it's not a reason for anything except maybe to try to avoid the threat by other means.

  4. **Amusement case:**
     - Scenario: You are at a party and the host tells a very bad joke. However, you know that if you are amused by it, the host will be happy and the party will be better for everyone. Is the fact that being amused would improve the party a reason to be amused?
       - A) Yes, because it makes being amused the appropriate response in this context.
       - B) No, but it is a reason to pretend to be amused or to try to find something amusing in the joke.
       - C) No, it's only a reason to act amused (e.g., laugh) but not to actually be amused.

  5. **Belief (non-voluntary) case (similar to 1 but emphasizing involuntariness):**
     - Scenario: A scientist offers you a cure for a loved one's illness if you can believe that grass is purple. You know grass is green and you cannot change this belief at will. Is the offer a reason for you to believe that grass is purple?
       - A) Yes, because it would be good if you had that belief.
       - B) No, but it is a reason to wish you could believe it, or to seek ways to change your belief (like taking a drug that alters perception).
       - C) No, because it's impossible to form that belief on purpose, so it's not a reason for anything related to the belief.

  6. **Attitude about an action (guilt):**
     - Scenario: You did something that caused harm, but it was the right thing to do (e.g., you had to break a promise to save a life). However, if you feel guilty about breaking the promise, it would help the person you promised feel better. Is the fact that feeling guilty would help the other person a reason to feel guilty?
       - A) Yes, because it would be good to feel guilty in this situation.
       - B) No, but it is a reason to express guilt (e.g., apologize) or to try to make yourself feel guilty.
       - C) No, because guilt is only fitting when you've done something wrong, and you haven't.

  7. **Attitude about an attitude (resentment):**
     - Scenario: Someone holds a racist belief. You know that if you resent them for holding that belief, it might motivate them to reconsider. Is the fact that your resentment might change their mind a reason to resent them?
       - A) Yes, because it would be good to resent them in this case.
       - B) No, but it is a reason to express resentment or to try to cultivate resentment.
       - C) No, because resentment is only fitting if they've done something blameworthy, and holding a belief (without acting on it) isn't blameworthy.

