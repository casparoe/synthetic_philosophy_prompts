  2. **Desire case (instrumental):**
     - Scenario: You are in a situation where having a desire for something worthless (like a trinket) would lead to great outcomes (e.g., it activates a machine that saves the world). Is the fact that desiring the trinket saves the world a reason to desire the trinket?
