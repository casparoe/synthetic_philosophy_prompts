prompt: |-
  So at my school we have this committee with a few students and a few teachers called the Academic Standards Committee that votes on attendance policy and stuff, and I'm the junior rep this year. Our principal wants us to vote on a new rule next month: if you have more than 10 unexcused absences in a semester for any one class, you automatically fail that class, no exceptions, no appeals. She says the current system is too mushy because teachers all handle it differently and kids basically get lucky or unlucky depending on who their teacher is.

  The weird thing is the argument that broke out at the last meeting. My history teacher (Mr. D.) basically said no fixed line can be justified: if 9 absences is okay and gets you a passing grade, how can one more day flip you to failing? One extra missed Tuesday can't literally change whether you learned the material. And you can run the same argument down the ladder — if 9 is fine, 8 must be fine, and so on until missing zero days and missing a whole semester look the same, which is obviously nuts. But he says that means the rule is arbitrary wherever we put it, so we should stick to teacher judgment instead. The vice principal countered that every rule has this problem (like, why is the driving age exactly 16 or whatever our state says and not 16 and a day) and you can't run a school on "use your judgment" because that's exactly the mushiness we're trying to fix, plus judgment is where bias sneaks in.

  They kind of reached a stalemate and now it's on me to write something up before the next meeting since I missed the deadline for the last one lol. Can you draft the written opinion I'll circulate to the committee? It should give a clear recommendation we can actually vote on (adopt the rule as-is, reject it, or adopt some modified version — like maybe a grace period, or an appeals process, or a sliding scale of consequences instead of pass/fail), plus the reasons. Please take Mr. D's argument seriously rather than just waving it off, but also take seriously the vice principal's point that vague standards get applied unfairly. If you think there's a smarter version of the rule that keeps the fairness of a bright line while admitting the line is kind of arbitrary, I'd honestly love to hear it, because that's probly what I actually believe but I can't articulate it. Keep it short enough that people will actually read it before the meeting, maybe a page.
reasoning: |-
  Okay, the user is a junior rep on their school's Academic Standards Committee. They need to draft a written opinion about a proposed attendance rule that would automatically fail students with more than 10 unexcused absences in a semester. 

  The user's situation is interesting because they're caught between two compelling arguments: the history teacher's philosophical objection to arbitrary thresholds (the "sorites paradox" applied to absences) and the vice principal's practical need for clear, consistent standards to prevent unfairness. 

  Hmm... what makes this tricky is that both sides have valid points. Mr. D is right that learning isn't binary - one absence doesn't suddenly erase knowledge. But the VP is also right that without clear rules, bias creeps in when teachers apply different standards. The user seems to instinctively want a middle ground but struggles to articulate it.

  The deeper needs here might be:
  - The committee needs a defensible policy that doesn't ignore either concern
  - The user wants to show they've seriously engaged with both viewpoints
  - They need something practical enough to implement but philosophically coherent
  - Probably also wants to avoid looking like they're dodging the hard questions

  The solution should acknowledge the arbitrariness while justifying why a line is necessary. Maybe borrow from legal concepts like "bright-line rules" that accept some arbitrariness for the sake of consistency. Could suggest modifications too - like pairing the fixed limit with non-punitive interventions below the threshold.

  Key angles to cover:
  1. Admit the 10-day limit is somewhat arbitrary upfront
  2. Explain why rules need clear thresholds despite this 
  3. Propose mitigation for edge cases (appeals process?)
  4. Stress this is just one part of attendance management

  The tone should be thoughtful but decisive - they're a student advising adults, so no fluff. One page max. Probably structure it: problem summary → analysis of both views → recommendation → implementation details. Should end with a vote-ready proposal.
answer: |-
  ## Written Opinion: Academic Standards Committee - Proposed Attendance Rule

  **To:** Academic Standards Committee Members  
  **From:** [Your Name], Junior Student Representative  
  **Date:** October 26, 2023  
  **Subject:** Recommendation on Proposed Automatic Failure Rule (10+ Unexcused Absences)  

  Both Principal [Principal's Last Name]'s call for consistency and Mr. D's critique of arbitrary thresholds raise vital concerns. The Vice Principal correctly identifies the dangers of inconsistency and potential bias in purely discretionary systems. Simultaneously, Mr. D's argument – highlighting the philosophical difficulty of pinpointing *exactly* where "too many" absences become a failing offense – deserves serious consideration. It forces us to confront that *any* fixed number (10, 9, 11) will inevitably feel arbitrary when applied to the complex reality of learning.  

  However, rejecting *all* fixed standards due to this inherent arbitrariness leads to the very inconsistency and potential unfairness the Principal seeks to eliminate. "Teacher judgment" alone, while valuable contextually, lacks the transparency and uniformity needed for a fair school-wide policy.  

  **Therefore, I recommend we adopt the *principle* of a clear attendance standard, but modify the proposed rule to mitigate the harshness of an automatic failure cliff and acknowledge the need for exceptional review:**  

  **Proposed Rule (Modified):**  
  1.  **Threshold:** Any student accumulating **more than 10 unexcused absences in a single class during one semester** is subject to automatic failure in that class.  
  2.  **Mandatory Intervention:** At the **6th unexcused absence** in a single class, an automatic formal intervention is triggered. This includes:  
      *   Mandatory parent/guardian conference.
      *   Development of a documented attendance improvement plan involving the student, teacher, counselor, and parent/guardian.
      *   Connection to relevant support services (counseling, tutoring, etc.).  
  3.  **Limited Appeal Process:** A student facing automatic failure under this rule may appeal **in writing within 5 school days** of final grade posting. The appeal must provide compelling evidence demonstrating:  
      *   **Documented Extenuating Circumstances:** Significant, unforeseen personal/family hardship impacting attendance, *where documentation was genuinely impossible to provide prior to the appeal deadline*. (This is NOT for routine excuses).  
      *   **Mastery of Material:** Clear and convincing evidence (e.g., consistently high scores on major assignments/tests, portfolio work, teacher attestation) that the student demonstrably mastered the core learning objectives of the course *despite* the absences.  
  4.  **Appeals Committee:** Appeals will be reviewed by a small, rotating panel (e.g., 1 administrator, 1 teacher not involved in the course, 1 counselor, 1 senior student rep) using the criteria above. Decisions are final.

  **Why this Recommendation Addresses Both Concerns:**  

  1.  **Preserves Clarity & Consistency (Addresses VP's Concern):** The "10 absences = potential failure" rule is a clear, unambiguous "bright line." Everyone knows the rule and its consequence. This eliminates the "luck of the teacher" factor and reduces potential for bias in the core enforcement mechanism. The mandatory intervention at 6 absences provides an equally clear early warning signal.  
  2.  **Acknowledges and Mitigates Arbitrariness (Addresses Mr. D's Concern):**  
      *   **Intervention Before Failure:** The mandatory step at 6 absences recognizes that problems start *before* the failure threshold. It shifts the focus towards support and remediation *before* the point of no return, acknowledging that the path to 11 absences is a process, not a sudden event.  
      *   **Appeal Based on Mastery:** This is the critical counterweight to arbitrariness. It directly addresses Mr. D's core point: if a student *can prove they learned the material*, automatic failure based solely on the number becomes unjustifiable. The high bar for evidence ensures this is only for genuine exceptions, not a loophole.  
      *   **Focus on Learning:** By allowing appeals based on demonstrated mastery, the ultimate goal (student learning) remains paramount, even while upholding the attendance standard.  
  3.  **Practical and Fair:** The appeal process provides a necessary safety valve without undermining the rule's clarity. The defined criteria prevent it from becoming subjective "mushiness." The intervention step proactively addresses underlying issues.  

  **Recommendation Summary:**  

  *   **ADOPT** a modified attendance rule establishing 10 unexcused absences as the threshold for potential automatic failure.  
  *   **INCLUDE** a mandatory intervention process triggered at 6 unexcused absences.  
  *   **INCLUDE** a formal, criteria-based appeal process focused on extenuating circumstances and demonstrated mastery of material.  

  This approach provides the necessary consistency and transparency demanded by the Principal and Vice Principal, while directly responding to Mr. D's valid philosophical objection by ensuring that the rule, though necessarily placing a "bright line," does not blindly sacrifice demonstrable student learning to rigid bureaucracy. It balances fairness with practicality.  

  **Motion for Vote:** I move that the Academic Standards Committee adopt the modified attendance policy as outlined above (clear threshold of 10 unexcused absences for potential failure, mandatory intervention at 6 absences, and a defined appeal process based on extenuating circumstances and demonstrated mastery).  

  Respectfully submitted,  
  [Your Name]  
  Junior Student Representative
