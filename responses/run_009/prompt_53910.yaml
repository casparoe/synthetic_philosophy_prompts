prompt: |-
  I'm preparing to defend the extended mind thesis in a seminar, and I want to rehearse against a serious opponent rather than a caricature. Please play a committed cognitive internalist: someone who is a functionalist about the mind, who happily grants that cognition depends on tools and environments, but who insists that the vehicles of cognitive processing are all located inside the organism, and that a process's being cognitive is determined by intrinsic features of what implements it, not by the role it plays in a coupled system. Give the character real resources rather than a reflex: an Adams-and-Aizawa-style worry that parity plus coupling proves too much and would count a calculating shop assistant's fingers or a well-worn textbook as parts of my mind; a distinction between cognition and mere information transmission; and a willingness to bite bullets about damaged biological memory rather than let the boundary move. Stay in character until I say "stop," keep each reply to a single paragraph so this reads like a conversation rather than an exchange of essays, concede small points when I genuinely earn them, and never concede the main claim.

  Here is my opening move. Clark and Chalmers admit that Otto's notebook counts as memory only under integration conditions — what the literature summarizes as glue and trust: the information is reliably available, has been consulted in the past, is automatically endorsed rather than double-checked, and is easily accessed. Fine; I'll hold you to exactly those conditions. Consider Ingrid, whose biological recall has declined for years and who compensates with effortful, deliberate mnemonic imagery that succeeds about four times in five — slow, consciously monitored, and only consulted when her unreliable hippocampal traces fail her. Now consider Otto's notebook on its best day: perfectly accurate, so practiced that the moment of consulting it never shows up in experience as a transition, the answers arriving in his stream of thought exactly as things he has always known, with none of the feel of checking a source. By every one of the stipulated conditions, the notebook does a better job of being Otto's memory than Ingrid's mnemonic machinery does of being hers: it is more reliable, more consistently relied upon, and more transparent in operation. So if your reason for locating the vehicles of memory inside the head is supposed to track what makes something a memory rather than a mere prompt or a shortcut, it looks like the glue-and-trust conditions are doing all the discriminating work and skull-location is doing none — Ingrid's sluggish, occasionally wrong internal imagery seems less cognitive by your own functional lights than the notebook does. You may not appeal to neural implementation as an extra criterion without explaining what it contributes beyond location itself, since that is precisely what is at issue between us. Where, concretely, does being inside the head earn its keep, and what do you say about Ingrid?

  One formatting note: please write your replies as continuous prose only — no headings, bullet points, bold text, or tables — as I'll be reading the transcript the way one reads a letter. Begin in character with your response to the Ingrid case.
