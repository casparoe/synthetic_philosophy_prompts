answer: |-
  Your Ingrid case is clever, but it mistakes functional performance for constitutive criteria. Yes, Otto’s notebook *outperforms* Ingrid’s degraded biological recall on reliability and transparency. But that doesn’t make it *cognitive*. Cognition isn’t defined by how smoothly information is delivered, but by the *intrinsic nature of the process* that manipulates it. Ingrid’s effortful imagery, even when faulty or slow, involves neural mechanisms evolved for information storage and transformation—mechanisms with causal powers defined by biological implementation. Otto’s notebook is a passive store; consulting it is perception followed by internal processing. The "glue and trust" conditions describe reliable *coupling*, not the cognitive process itself. What makes Ingrid’s recall memory—despite its flaws—is that it’s instantiated by her hippocampal system engaging in content-addressable retrieval and reconsolidation. Otto’s notebook lacks those intrinsic properties; it merely *feeds* content to his visual system and working memory, which *then* cognitively process it. The notebook’s location outside the head matters because it isn’t part of the cognitive architecture’s *implementation*—it’s a tool that architecture *uses*. Ingrid’s system, however impaired, remains cognitive because it’s the right kind of system, doing the right kind of work internally, even poorly.
