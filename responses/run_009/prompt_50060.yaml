  Next, tractability. Non-binary extensions are underexplored but growing; their logic skills give them an edge. Agenda classification is computationally intensive but has existing logical frameworks. Escape routes are more applied and might require empirical work, which they might not have the tools for. Preference aggregation links are foundational but crowded; hard to stand out.

