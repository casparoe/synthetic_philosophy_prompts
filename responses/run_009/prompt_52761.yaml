  ## The Night Porter's Shuffle at Hilbert's Grand

  The endless corridor of numbered **rooms**
  Stretches forever, every lock secured.
  My heavy cart holds every single **keys**,
  The leather-bound and infinite **ledger** lies,
  The worn stone **stair** ascends beyond my sight,
  And every settled soul's a sleeping **guest**. This endless **night**.

  Another coach arrives. This weary **night**
  Demands I free an infinite of **rooms**.
  The Management decrees: move every **guest**
  From where they are. My trembling hand takes **keys**.
  The solution's written in the vast **ledger**,
  Though it means traversing every **stair**.

  Again, I climb the echoing, cold **stair**.
  It is the burden of this endless **night**:
  To shift the mark in the unwieldy **ledger**,
  Reassigning each of the eternal **rooms**.
  I jangle heavy rings of numbered **keys**
  To wake and relocate each sleeping **guest**.

  I knock upon the door of the first **guest**.
  "Move, please," I rasp, halfway up the first **stair**.
  He grumbles, takes his old and new **keys**.
  It starts again beneath indifferent **night**.
  My task: to clear the odd-numbered **rooms**,
  As noted in the cryptic master **ledger**.

  The ink is dark within the open **ledger**:
  "Room *n* to *2n*." Awake each present **guest**!
  Shift them along the chain of now-cleared **rooms**.
  My boots scrape rhythm on the granite **stair**.
  This is the labour of the infinite **night**,
  The endless jostling of the reassigned **keys**.

  The new coach disgorges souls needing **keys**.
  They wait below, a line the vast **ledger**
  Will soon absorb. This long, unfolding **night**
  Requires a place for every waiting **guest**.
  My cart groans upwards on the central **stair**,
  Preparing odd vacancies in shifting **rooms**.

  The final **guest** ascends, the **ledger** signed.
  The worn **stair** echoes, heavy **keys** confined.
  In endless **rooms**, the **night** finds vacancy defined.

  ---

  **Notes on the Sestina & Hilbert's Hotel:**

  1.  **Sestina Form:** The poem strictly follows the sestina structure. The six end-words (**rooms, keys, ledger, stair, guest, night**) permute through the six stanzas according to the traditional pattern (612345, 561234, etc.). The envoi packs the words 2-per-line: Guest/Ledger, Stair/Keys, Rooms/Night.
  2.  **Mathematical Honesty:**
      *   **Reassignment, Not Creation:** The poem emphasizes moving existing guests ("shift the mark," "reassigning," "relocate," "jostling of the reassigned keys") and repurposing rooms ("clear the odd-numbered rooms," "preparing odd vacancies"). No new rooms or keys are made; it's pure reassignment, mirroring the mathematical trick.
      *   **Infinitely Ongoing Process:** The porter explicitly states he's done this "again," it's an "endless chore," "labour of the infinite night," and crucially, he's "never once seen it finished." This reflects the potential infinity involved – the process is well-defined but never *completed* in a finite time.
      *   **Vacancy in Ledger Only:** The final line of the envoi ("In endless **rooms**, the **night** finds vacancy defined") and the penultimate stanza ("the vast ledger / Will soon absorb... vacancy defined") highlight that vacancy exists as a *theoretical state* recorded in the ledger (the mathematical function/mapping), not as a physically empty room the porter can point to *at that moment* during the shuffle. The hallway, during the process, is full of moving guests.
      *   **Finitist's Worry:** The porter's weariness and the emphasis on the *unending* nature of the task ("never once seen it finished") embody the finitist concern about the feasibility of completing an infinite series of actions. The ledger's "vacant" mark is an abstract promise, not a present reality in the physical corridor.
  3.  **Porter's Voice:** He's capable ("Management decrees," he follows the procedure) but deeply weary ("trembling hand," "weary arms," "tired eyes," "labour," "burden," "endless chore"). He's pragmatic, focused on the immense physical task of the shuffle, not awed by the infinity. It's his nightly grind.
  4.  **Key Imagery:** The cart of keys, the ledger, the stair, the endless corridor – these concrete objects ground the abstract math in the porter's physical reality. The keys symbolize the reassignment function itself.
  5.  **The Envoi:** This resolves the immediate crisis ("The final **guest** ascends, the **ledger** signed") but leaves the deeper paradox intact. The vacancy is "defined" by the ledger/night (the abstract system), not discovered in the hallway during the porter's shift. The last line crystallizes the finitist's unease within the porter's lived experience.
