prompt: |-
  I've been reading LessWrong and the adjacent blogs since the early 2010s, and no debate there has stayed live longer than takeoff speeds: whether the path to transformative AI looks like a slow, continuous ramp — where AI systems that can meaningfully accelerate AI research precede anything decisive, and the world has years of warning — or a sharp discontinuity, where the first system capable of recursive self-improvement converts a modest lead into a decisive one in months or less. Two members of my local rationalist meetup have been arguing this for years, one on each side, and the argument has become almost entirely ritualized: one of them recites the returns-on-cognitive-investment argument and the other recites the bottlenecks objection, and neither ever concedes that the other's framing might partially dissolve the disagreement.

  I want to commission the joint statement they should have produced from a good-faith adversarial collaboration. Please draft it with the following components:

  1. An agreed-claims section, numbered, containing the substantive claims both could sign — about current ML trends, about what recursive self-improvement would require in principle, about the epistemic weight of the deep-learning era, and about what would count as transformative in the first place.

  2. A disagreements table with exactly these columns:
     - id: a short identifier for the disagreement;
     - disagreement: the precise statement of where they differ, worded so that each side would accept the characterization of its own view (no strawmen, no hedging into vacuity);
     - crux: the sub-question such that settling it would move at least one side;
     - shared_evidence: a concrete case, historical episode, or thought experiment both agree bears on that crux;
     - continuous_prediction: what the slow-takeoff side predicts about that case;
     - discontinuous_prediction: what the fast-takeoff side predicts.

  The cruxes you address should at least include: the shape of the returns curve on investment in intelligence (roughly log-linear versus convex); whether bottlenecks other than cognitive talent — compute, experimental data, physical lab work — throttle the feedback loop; whether many parallel copies of a human-level AI researcher can substitute for serial cognitive depth; and what the appropriate anchor is for how far human-level AI sits from AI-that-automates-AI-research.

  3. A short section on which parts of their dispute are verbal rather than substantive — for instance, whether any of the disagreement survives only because they mean different things by 'takeoff' or by 'continuous' — with your reasoning stated.

  One wrinkle I want handled explicitly rather than buried: they keep circling whether the 2012–2022 deep-learning period, in which capability gains tracked compute and scale with no AI-driven research loop at all, counts as evidence about the shape of the curve, or is uninformative because it samples a regime with no feedback loop in it. The statement should record, as an agreed claim or an explicit disagreement, which historical episodes are probative and why.

  After the document, please append a brief structured summary as a single JSON object with this schema: fields "agreed_claims" (array of strings), "disagreements" (array of objects, each with "id", "crux", "shared_evidence", "continuous_prediction", "discontinuous_prediction"), and "verbal_disputes" (array of strings, empty if none).
reasoning: |-
  We are drafting a joint statement for two rationalists who disagree about AI takeoff speeds (slow/continuous vs. fast/discontinuous). The document must include:

  1. **Agreed Claims**: Numbered list of claims both sides accept.
  2. **Disagreements Table**: With columns: id, disagreement, crux, shared_evidence, continuous_prediction, discontinuous_prediction.
     Cruxes must include:
     - Returns curve (log-linear vs convex)
     - Bottlenecks (other than cognitive talent)
     - Parallel copies vs serial depth
     - Anchor for distance from human-level AI to automating AI research
     And explicitly address whether 2012-2022 deep learning era is probative.

  3. **Verbal Disputes**: Short section on whether any part of the disagreement is due to differing definitions.

  Then, a JSON summary.

  Let's structure:

  ## Joint Statement on AI Takeoff Speeds

  ### 1. Agreed Claims

  Both parties agree on the following:

  1. **Transformative AI Definition**: A system that, when deployed, would radically reshape civilization (e.g., automate all human labor, enable unprecedented scientific progress, or pose existential risk) within a short time frame (e.g., years or decades) of its development.

  2. **Recursive Self-Improvement (RSI)**: For an AI to recursively self-improve, it must be able to perform AI research and development tasks at a level comparable to or exceeding human researchers, and the output of such work must lead to improved versions of itself.

  3. **Cognitive Investment Returns**: There exists a relationship between the amount of cognitive effort (or "intelligence") applied to AI research and the rate of progress. Both agree that at least some positive returns exist, but they disagree on the functional form.

  4. **Deep Learning Era (2012-2022)**: The period was characterized by significant AI capability gains driven primarily by scaling compute, data, and model size, without any AI-driven feedback loop. Both agree that this era demonstrates the potential for scaling to yield substantial gains and that it provides evidence that some aspects of AI progress are amenable to straightforward scaling. However, they agree that this era did not feature RSI and thus does not directly inform the dynamics of an RSI-driven takeoff.

  5. **Bottlenecks Exist**: There are potential bottlenecks in AI progress beyond raw cognitive talent, including:
     - **Compute**: Availability of computational resources.
     - **Data**: Access to high-quality training data or real-world experimental feedback.
     - **Physical Constraints**: For AI systems that interact with the physical world (e.g., robotics, lab work), the speed of physical processes may limit progress.

  6. **Parallelism vs Serial Depth**: It is possible to run multiple copies of an AI system in parallel. However, some research tasks require sequential steps (e.g., hypothesis generation followed by experimentation and then analysis) that cannot be arbitrarily parallelized.

  7. **Human-Level AI as Precursor**: We expect that an AI system capable of automating AI research (and thus enabling RSI) will be at least as cognitively capable as the best human AI researchers across the relevant domains.

  ### 2. Disagreements

  The following table captures key disagreements. Each row addresses a specific point of contention, with a shared evidence base and explicit predictions from each side.

  | id | disagreement | crux | shared_evidence | continuous_prediction | discontinuous_prediction |
  |----|--------------|------|-----------------|------------------------|---------------------------|
  | returns_curve | Whether the returns on cognitive investment in AI research (once an AI is capable of doing such research) are roughly log-linear (diminishing returns) or convex (increasing returns) at the critical point. | What is the functional form of the returns curve at the level of cognitive investment where an AI system is first able to meaningfully contribute to AI research? | The historical development of human scientific fields (e.g., physics, biology) and software engineering, where initial breakthroughs often lead to accelerating progress but then face diminishing returns. | **Slow-takeoff view**: Returns are log-linear: each doubling of cognitive investment yields less than a proportional gain in research output. This leads to a gradual improvement curve. | **Fast-takeoff view**: Returns are convex: at the threshold of AI-driven research, each marginal unit of cognitive investment yields increasing returns, leading to explosive growth. |
  | bottlenecks | Whether bottlenecks (compute, data, physical constraints) will significantly throttle the feedback loop of recursive self-improvement, even when an AI has sufficient cognitive ability. | When an AI system reaches the capability to do AI research, will non-cognitive bottlenecks prevent it from rapidly iterating on self-improvement? | The development of large software projects (e.g., operating systems, complex compilers) where even with many skilled developers, coordination and integration challenges slow progress. Also, the training of large AI models today is limited by compute and data. | **Slow-takeoff**: Bottlenecks will dominate. Even with an AI capable of RSI, the need for massive compute, hard-to-acquire data, or physical experimentation will slow the feedback loop to months or years per cycle. | **Fast-takeoff**: Bottlenecks are temporary and solvable. An AI with human-level research ability will quickly find workarounds (e.g., better algorithms that reduce compute needs, synthetic data generation) and thus the feedback loop will run at digital speeds (days or weeks per cycle). |
  | parallelism | Whether running many parallel copies of a human-level AI researcher can effectively substitute for having a single, more cognitively advanced AI in achieving rapid RSI. | Can parallelization overcome the inherent sequential depth required for major research breakthroughs? | Large collaborative research projects (e.g., the Human Genome Project, CERN) where many researchers work in parallel. Also, open-source software development. | **Slow-takeoff**: Parallelism helps but cannot overcome Amdahl's law for inherently serial tasks. Many AI copies will hit coordination overhead and diminishing returns, leaving the critical path of discovery slow. | **Fast-takeoff**: With sufficient parallelism, the system can explore many research avenues simultaneously, and the gains from parallelization will dominate, leading to very rapid progress. |
  | anchor_gap | How far beyond human-level AI (in terms of cognitive ability) we must go to achieve an AI that can automate AI research at a transformative level. | What is the relative gap between the first AI that matches human researchers and one that can fully automate AI research? | The history of automation in other domains (e.g., manufacturing, chess, protein folding) where human-level performance was followed by superhuman performance quickly. | **Slow-takeoff**: The gap is large. Human-level AI will not immediately be able to automate research; it will require years of incremental improvements to reach the necessary capability. | **Fast-takeoff**: The gap is small. Once an AI reaches human-level capability in research, it will quickly (within months) become superhuman due to RSI, because even a small initial advantage in speed or insight compounds. |
  | dl_era_evidence | Whether the 2012-2022 deep learning scaling era provides evidence about the shape of the returns curve in an RSI regime. | Is the pre-RSI scaling era informative about the dynamics of the post-RSI era? | The deep learning era itself: gains from scaling compute/data without AI-driven feedback loops. | **Slow-takeoff**: Yes. The log-linear scaling observed (e.g., in language model performance) suggests diminishing returns, and we should expect similar trends even when AI is doing the research. | **Fast-takeoff**: No. The scaling era is an entirely different regime. Once AI-driven feedback begins, the dynamics shift fundamentally, so the pre-RSI era is not probative of post-RSI returns. |

  ### 3. Verbal Disputes

  We note two potential verbal disputes:

  1. **Definition of "Continuous" vs "Discontinuous"**: 
     - The slow-takeoff proponent uses "continuous" to mean that the world gets years of warning with gradually increasing AI capabilities, and the transition to transformative AI occurs over many years.
     - The fast-takeoff proponent uses "discontinuous" to mean that the transition from sub-transformative to transformative AI occurs in a short period (e.g., months or less) due to rapid RSI.
     - However, both agree that progress is "continuous" in the sense that it builds on previous steps (no magic). The dispute is about the steepness of the curve and the time between the first human-level AI researcher and full automation.

  2. **Threshold for "Transformative"**:
     - The slow-takeoff side often includes a requirement for broad deployment and integration into the economy, which takes time, while the fast-takeoff side focuses on the point when RSI becomes feasible and quickly leads to superintelligence.
     - This difference in what counts as "transformative" might lead to apparent disagreement about timing even if they agreed on technical timelines.

  After clarifying these, we believe the core disagreements are substantive and not merely verbal.

  ---

