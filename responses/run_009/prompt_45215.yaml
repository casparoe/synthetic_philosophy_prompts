  ### Activity Design: Simpson's Paradox Dice Game  
  I'll provide a complete, reliable activity where students generate data through a dice game, experience the reversal without spotting the confounder, and then debrief to understand the paradox. The key is to split students into "Easy" and "Hard" conditions without their knowledge, bias their strategy choices, and ensure aggregate results favor the weaker strategy.

  ---

  #### **Mechanics**  
  **Setup**  
  - **Materials**:  
    - 6 standard dice per student (or shared if limited).  
    - 14 envelopes (1 per student) containing "strategy cards" (see below).  
    - Scorecards for recording rolls.  
    - Prize: Small candy bars for top 3 scores.  

  - **Group Split**:  
    - Arbitrarily divide 14 students into **Group A (Easy)** and **Group B (Hard)** using numbered slips (e.g., 7 slips "A", 7 "B"). *Do not reveal A/B are different conditions*.  

  - **Strategies**:  
    - **Strategy X**: "High-Risk" (win on 5–6).  
    - **Strategy Y**: "Low-Risk" (win on 3–6).  
    *Both strategies seem identical initially to avoid suspicion*.  

  - **Hidden Rules (Confounder)**:  
    - **Group A (Easy)**: Rolls use **standard dice** (fair odds).  
    - **Group B (Hard)**: Rolls use **biased dice** (e.g., dice with 4–6 sanded down to reduce weight, making 1–3 more likely). Test beforehand to ensure ~70% of rolls are 1–3. *Hide this by pre-distributing dice in envelopes*.  

  ---

  #### **Game Flow**  
  1. **Practice Round (Biased Choices)**:  
     - Each student draws one practice roll for **X** and **Y** from their group’s envelope.  
     - *Rigged outcomes*:  
       - **Group A (Easy)**: X = **win**, Y = **loss**.  
       - **Group B (Hard)**: X = **loss**, Y = **win**.  
     - *Students choose their strategy based on practice: Group A favors X; Group B favors Y*.  

  2. **Main Game (10 Trials)**:  
     - Students play 10 rounds with their chosen strategy:  
       - Roll one die per round.  
       - Record **win (1)** or **loss (0)** based on their strategy.  
     - **Scoring**: Total wins = score (0–10).  

  3. **Payoff**:  
     - Candy to top 3 scores (encourages competition).  
     - *Crucially, scores will be higher in Group A (Easy) regardless of strategy*.  

  ---

  #### **Data Generation & Reversal**  
  - **Why Reversal Happens**:  
    - **Group A (Easy)**: Higher win rates (Strategy X: 33%, Y: 67% — X is better).  
    - **Group B (Hard)**: Lower win rates (Strategy X: 17%, Y: 33% — X is still better).  
    - **Aggregate**: Strategy Y (weaker) wins overall because:  
      - Group A (high scores) mostly uses **Y** (due to practice bias).  
      - Group B (low scores) mostly uses **X** (due to practice bias).  

  - **Predicted Results (14 students)**:  
    | Group | Students | Strategy X Wins | Strategy Y Wins |  
    |-------|----------|-----------------|-----------------|  
    | A (Easy) | 6 choose Y, 1 chooses X | 1 × 3.3 ≈ 3 | 6 × 6.7 ≈ 40 |  
    | B (Hard) | 6 choose X, 1 chooses Y | 6 × 1.7 ≈ 10 | 1 × 3.3 ≈ 3 |  
    | **Total** | | **13** | **43** |  
    - **Overall Win Rates**:  
      - Strategy X: 13 wins / 70 trials ≈ **18.6%**.  
      - Strategy Y: 43 wins / 70 trials ≈ **61.4%**.  
    *Y (weaker strategy) wins overall*.  

  ---

  #### **Debrief**  
  1. **Reveal the Confounder**:  
     - Show group-level results:  
       - "Group A: X won 33% of the time, Y won 67%. So X was better!"  
       - "Group B: X won 17%, Y won 33%. X was still better!"  
     - Show aggregate: "But overall, Y won 61.4% vs. X’s 18.6%. Y won?"  
     - **Reveal**: "Group A used ‘easy’ dice; Group B used ‘hard’ dice. The dice weren’t fair!".  

  2. **Map to Algebra**:  
     - Draw a 2×2 table:  
       |          | Group A (Easy) | Group B (Hard) |  
       |----------|----------------|----------------|  
       | **Strategy X** | 3.3/10 | 1.7/10 |  
       | **Strategy Y** | 6.7/10 | 3.3/10 |  
     - Weighted averages:  
       - X = (3.3×1 + 1.7×6)/7 ≈ 1.97, Y = (6.7×6 + 3.3×1)/7 ≈ 6.24.  
     - **Key Insight**: The confounder (dice bias) made Group B’s scores lower, and X was overused there.  

  3. **Legitimacy of Subgroups**:  
     - Discuss: "In real life, how do we know if ‘dice bias’ is a real confounder or cherry-picking?"  
     - **Activity Twist**: Let students argue whether "dice bias" justifies the split. Reveal: "We rigged it, but real cases (e.g., UC Berkeley gender bias) require statistical testing to prove confounders."  

  ---

  #### **What Could Go Wrong**  
  - **Biased Dice Not Hitting Odds**: Test dice beforehand. If needed, manually adjust scores to 1–3 for Group B.  
  - **Students Suspect Group Differences**: Use identical-looking dice. Distribute in sealed envelopes labeled "Game Materials".  
  - **Practice Round Not Biasing Choices**: Emphasize, "Your practice roll is your only hint!".  

  #### **Limitations**  
  - **Legitimacy of Subgroups**: Students know the confounder exists. Real-world ambiguity requires advanced stats.  
  - **Oversimplification**: Real paradoxes involve continuous data (e.g., medical studies). This uses binary wins.  

  This activity forces the paradox reliably, hides the confounder, and sparks debate about causality. The candy payoff adds stakes, and the debrief links intuition to algebra.
