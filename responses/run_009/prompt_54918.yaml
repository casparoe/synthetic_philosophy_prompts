  - Insert meta-commentary naturally—e.g., Variantist accusing Realist of "quantifier fetishism."

  The hallway setting helps: no audience, just two experts pushing each other. I'll end mid-debate with a nod to unresolved tension—perfect seminar fodder. User's request shows they want students to grapple with depth, not get pat answers.

