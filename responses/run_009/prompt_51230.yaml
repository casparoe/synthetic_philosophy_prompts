  **Final Note**: 
  We provide this tree with the understanding that it is a heuristic. Students should be aware that real philosophical positions often have nuances beyond the tree, and the tree has blind spots. In particular, the unity of consciousness in split-brain cases remains a debated topic, and the tree simplifies the space of options.
answer: |-
  Below is a decision tree designed to guide students from empirical observations of split-brain cases to a coherent position on the unity of consciousness. The tree uses behavioral and first-person data (e.g., lab responses, everyday actions, subjective reports) to force distinctions between views without presupposing theoretical commitments. Each node is a question about observable facts or uncontroversial interpretations of the case. The tree includes your specified pressure points (e.g., intermanual conflict, cross-cueing, confabulation, ordinary tasks, pre-operative survival, and the intact-brain comparison). 

  **How to Use This Tree:**  
  Start at Node 1. Answer each question based *only* on the empirical data (e.g., "In the lab, the patient denies seeing the stimulus but the left hand responds—why?"). Proceed to the next node based on your answer. The tree ends at a "leaf" (a position on unity), with a brief note on its hardest implication. 

  ---

  ### **Decision Tree: Unity of Consciousness in Split-Brain Cases**

  #### **Node 1: Intermanual Conflict**  
  When a split-brain patient's left hand (right hemisphere) undoes an action just completed by the right hand (left hemisphere)—e.g., unbuttoning a shirt the right hand buttoned—is this conflict best explained by **two independent goals** (e.g., one hemisphere wants the shirt buttoned, the other unbuttoned), or **one goal with a mechanical error** (e.g., the hemispheres aren't coordinating, but there's no deeper conflict)?  
  - **Independent goals** → Go to Node 2A  
  - **Mechanical error** → Go to Node 2B  

  #### **Node 2A: Cross-Cueing Awareness**  
  In cross-cueing, one hemisphere guides the other's behavior (e.g., the right hemisphere hears the left answer a question and uses that to respond nonverbally). The patient reports no awareness of this cueing. Does this lack of awareness suggest **the cueing happens "outside" the patient's consciousness** (e.g., between two hidden agents), or is it **an automatic self-cueing process** (e.g., like recalling a memory without knowing how)?  
  - **"Outside" consciousness** → Go to Node 3A  
  - **Automatic self-cueing** → Go to Node 3B  

  #### **Node 2B: Confabulation Source**  
  When the speaking hemisphere (left) confabulates an explanation for the right hemisphere's behavior (e.g., "I pointed with my left hand because I felt a headache"), is this confabulation **driven by ignorance of the right hemisphere's experience** (e.g., it truly doesn't know why the hand moved), or **a post-hoc rationalization of a glitch** (e.g., it senses the action but misattributes its cause)?  
  - **Ignorance of experience** → Go to Node 3C  
  - **Rationalization of glitch** → Go to Node 3D  

  #### **Node 3A: Ordinary Task Duplication**  
  In an ordinary, unstimulating task where both hemispheres receive identical input (e.g., walking calmly in a park), does the patient **have two separate experiences** (e.g., "I" am walking, but a second experience also exists), or **one unified experience** (e.g., "I" am walking, full stop), based on behavior and self-report?  
  - **Two experiences** → Leaf: **Two Subjects of Experience**  
  - **One experience** → Go to Node 4  

  #### **Node 3B: Pre-Operative Survival**  
  The pre-op patient (intact brain) was one person. Post-surgery, does this person **survive as one continuing subject** who now has a communication problem, or **not survive intact** (e.g., replaced by two new subjects, or a fragmented non-person)?  
  - **Survives as one** → Leaf: **One Subject with Intact Unity (Disunity of Access/Agency)**  
  - **Does not survive intact** → Go to Node 4  

  #### **Node 3C: Intact vs. Split Difference**  
  Compared to an intact brain, is the split-brain patient's disunity **qualitatively different** (e.g., the intact brain has one unified stream; splits break it), or **quantitatively different** (e.g., the intact brain already has two quasi-subjects bound by the corpus callosum)?  
  - **Qualitative difference** → Leaf: **One Subject with Two Partly Non-Communicating Streams**  
  - **Quantitative difference** → Leaf: **Two Subjects of Experience**  

  #### **Node 3D: Confabulation and Unity**  
  When the patient confabulates (e.g., the left hemisphere invents a reason for the left hand's action), does this imply **a single consciousness unaware of its own parts** (e.g., "I" am the confabulator, but my hand acted without "me"), or **no fact about "unity" to count** (e.g., unity is just the story the brain tells to make sense of actions)?  
  - **Single unaware consciousness** → Leaf: **Nagel-Style Indeterminacy**  
  - **No fact to count** → Leaf: **Deflationary View**  

  #### **Node 4: Intact Baseline Unity**  
  In an intact brain, does the corpus callosum **unify two pre-existing quasi-subjects**, or **facilitate communication within one subject**?  
  - **Unifies two quasi-subjects** → Leaf: **Two Subjects of Experience**  
  - **Facilitates one subject** → Leaf: **Nagel-Style Indeterminacy**  

  ---

  ### **Leaves: Positions and Their Hardest Implications**  
  1. **Two Subjects of Experience**:  
     - *Bullet to bite*: The patient's sincere report ("I feel like one person") is either an illusion or only one subject speaking, while the other is trapped and voiceless.  
  2. **One Subject with Two Partly Non-Communicating Streams**:  
     - *Bullet to bite*: A single subject can have simultaneous, unreconciled experiences (e.g., joy in one stream, rage in the other) without being aware of the conflict.  
  3. **One Subject with Intact Unity (Disunity of Access/Agency)**:  
     - *Bullet to bite*: The right hemisphere's complex, goal-directed behavior (e.g., solving puzzles) is not accompanied by its own experience—it's a "zombie" system.  
  4. **Nagel-Style Indeterminacy**:  
     - *Bullet to bite*: Personal identity is fuzzy; we can't say if the pre-op patient "died" or not, making ethics (e.g., responsibility for actions) intractable.  
  5. **Deflationary View**:  
     - *Bullet to bite*: There is no "true" unity—even in intact brains, it's just a story we tell—so split-brain cases reveal that all unity is performative, not metaphysical.  

  ---

  ### **Empty Leaves & Limits of the Tree**  
  #### **Empty Leaves (Combinations No One Occupies)**  
  - **Node 3A → One experience + Node 4 → Unifies two quasi-subjects**: Empty because incoherent. If ordinary tasks involve one experience *and* intact brains are two quasi-subjects unified, splits would "restore" a pre-existing duality—but patients report no such shift.  
  - **Node 2B → Rationalization of glitch + Node 3D → Single unaware consciousness**: Empty because unattractive. It requires confabulation to be a "glitch" in a unified system, yet also admits indeterminacy—a strained middle ground.  

  #### **Blind Spots (Pairs the Tree Cannot Separate)**  
  1. **One Subject with Two Streams vs. Nagel-Style Indeterminacy**:  
     - The tree cannot distinguish these because they answer all behavioral nodes identically (e.g., both say intermanual conflict shows independent goals, confabulation implies ignorance of experience, and ordinary tasks feel unified). They diverge only on a *conceptual* question: "Can a single subject have two distinct streams of experience?" The two-streams view says *yes*; Nagel says *the question is unanswerable*. To separate them, ask: "Does the concept of 'one subject' logically allow for multiple simultaneous experiences?"  
  2. **Deflationary vs. Nagel in Non-Confabulation Cases**:  
     - If a student takes the "rationalization of glitch" path (Node 2B → 3D), both positions might be invoked. The tree sorts them via Node 3D, but if behavioral data is ambiguous (e.g., the patient *sometimes* seems aware of cueing), the divide rests on whether unity is *constructed* (deflationary) or *indeterminate* (Nagel).  

  #### **Other Limits**  
  - **Pre-operative survival** is only addressed in Node 3B, so paths avoiding this node may overlook personal identity.  
  - **Cross-cueing** in Node 2A assumes the patient is unaware—but if awareness is disputed (e.g., in partial splits), the tree may misroute.  
  - The tree prioritizes logical consistency over real-world adherence; some paths (e.g., "mechanical error" in Node 1) are empirically thin but included for exhaustiveness.  

  ---

  **Handout Notes**:  
  - **Length**: Fits 2 pages (tree on p.1; leaves/analysis on p.2).  
  - **Accessibility**: Requires only case descriptions (no literature).  
  - **Goal**: Forces students to confront *why* they interpret data a certain way before debating. The blind spots are pedagogical opportunities: e.g., "Why can't two views be split by behavior alone?"
