prompt: |-
  I'm a PhD student in machine learning doing mechanistic interpretability work, with enough philosophy of mind in my background that I care about the words my field uses, and a pattern keeps surfacing in lab meetings and papers that I'd like to put a name to before I coin one myself. The setting is always some version of this: we train a network, and nobody designed what goes on inside it — we designed the objective and the architecture, but the internal organization is whatever the training run left behind. When we open the model up, we find structure: a direction in activation space that tracks whether a snippet of code is syntactically valid, a circuit that fires on indirect-object constructions, a "deception direction" that flips the outputs when ablated. And at that moment a familiar disagreement breaks out. One camp in my lab says a feature is real when it is causal (intervening on it changes behavior) and replicates across random seeds and even across differently trained models; a second camp says that any decomposition that predicts behavior comparably well has an equal claim to the word "real," so the word does no work and we should talk only in terms of predictive schemes; a third says the whole question is confused, because the network is an artifact — we built it, so unlike atoms or genes there is nothing there to be independently right or wrong about. What makes it stranger still is that the same researcher will switch camps within a single paper: the introduction disclaims that the model "really" wants or believes anything, and the results section then treats causal interventions as though they were probes for a genuine internal property.

  What I'm pointing at is not simply realism versus instrumentalism about unobservables, for a reason I keep coming back to: the system is an artifact whose internals were not designed by anyone, so we made the thing without making the level of description now in dispute. And the usual stance-talk about treating a whole system as if it had beliefs and desires doesn't help either, because the fight is over structure far below that level, and the causal-ablation criterion is supposed to do genuine work separating discovered structure from structure we merely project onto a high-dimensional object. Does this configuration have an established name of its own, or a literature I should be reading? If the nearest concepts fit only imperfectly — and I suspect each of them does — tell me specifically how each one misses, and if nothing established fits, coin a term: define it, say what it excludes, and give a boundary case, something like a linear probe that predicts a behavior perfectly while plausibly reading out a spurious correlate rather than the property the researchers had in mind.

  To be clear, I won't be satisfied with a bare label; I want the carving. What exactly is being disputed when people dispute the "reality" of a feature — a fact about the model, a fact about our descriptions, or something about how the two stand to each other? What would make the third camp right that the question is merely verbal, and is the causal criterion tracking the presence of structure or just our ability to intervene cleanly? And since I'll be repeating whatever you say in front of people who know this literature better than I do: tell me where your own answer here is most likely to fail — what consideration, if it held, would move you from "this is a substantive dispute" to "this is verbal," or back, and what you'd want to see before trusting the boundary cases you drew.
reasoning: |-
  Okay, this user is a PhD student in machine learning with a background in philosophy of mind, grappling with how to characterize the "reality" of features discovered through mechanistic interpretability. They describe three camps in their lab: one prioritizing causal interventions, another favoring predictive equivalence, and a third dismissing the question as confused since networks are human artifacts. The user wants to know if this specific configuration has an established name or literature, and if not, requests a coined term with careful boundaries.

  Hmm, this is fascinating because it sits at the intersection of philosophy of science (realism/instrumentalism) and ML practice, but with unique wrinkles. The artifact point is crucial - unlike electrons, we built the substrate but not the emergent structures. The user already recognizes existing frameworks like realism/instrumentalism don't quite fit because: (1) the dispute is about *which level* of description is real for an artifact, not about unobservables per se; (2) causal interventionists aren't naive realists - they use ablation as a validity filter; (3) the predictive equivalence camp's position collapses distinctions researchers find meaningful.

  Let me unpack why standard categories fall short. Ontological realism about ML features would claim "this circuit exists mind-independently," but that's clearly false - the network is human-made. Structural realism might say "the computational structure exists," but that feels vague here. Functionalist approaches ignore the artifact status. Even Dennett's intentional stance is too high-level - this is about subcognitive features. 

  The core tension is between three things researchers care about: 
  - **Manipulability** (causal camp: "we can *do* things with it")
  - **Invariance** (predictive camp: "it consistently describes behavior")
  - **Designer-intentionality** (artifact camp: "but we didn't put it there!")

  What's novel is that all three have merit because the object is an *emergent artifact* - its structure arises from optimization pressures we set but didn't blueprint. That's why the user observes people switching camps: when writing intros, they disclaim designer-intention; when presenting results, they imply discovered reality because ablation *feels* like probing something real.

  For a coined term, I'm considering **Artifactual Structural Realism (ASR)**. It captures that we're realists about structures that robustly emerge in artifacts despite no designer specifying them. The boundaries: 
  - Includes: deception circuits replicating across architectures/seeds with causal power
  - Excludes: linear probes that predict well but fail ablation tests (spurious correlates)
  - Boundary case: a probe that predicts syntax errors perfectly but ablating it does nothing - under ASR this is instrumental but not "real"

  But is the dispute substantive or verbal? Here's the rub: if two decomposition schemes are predictively equivalent *and* causally isolable *and* replicable, yet incompatible (say, two orthogonal "truth directions"), then ASR would call both real - but that might violate parsimony. That's where I'd get uneasy about my own position. To resolve it, I'd need to see if the causal interventions reveal functional independence or overlap.

  For literature pointers: Carl Craver's mechanistic explanations, Piccinini's functional kinds, maybe even Krohs' technical functions - but all need tweaking for ML's optimizer-created artifacts. The closest is probably Gillett's dimensioned realization, but applied to unintentional designs.

  The user will push back - they want the carving, not just labels. So I should emphasize: the dispute is about whether "reality" here means (a) causal robustness in the system, (b) utility for prediction, or (c) designer-independent existence. ASR argues for (a) while acknowledging (c) is impossible for artifacts. The predictive camp conflates (a) and (b); the artifact camp misses that (a) can exist without (c).

  Biggest weakness in my proposal: ASR might over-privilege intervention. If a feature is replicable and predictive but fragile to ablation (say, distributed across parameters), does that make it less real? Probably - but then we risk ignoring important structures just because our tools are blunt. That would move me toward "this is substantive but context-dependent."
answer: |-
  Your dilemma cuts to the heart of mechanistic interpretability's philosophical tensions, and no existing term fully captures this trilemma. The closest frameworks (Craver's mechanisms, Dennett's stances, functionalism) all miss critical nuances. Let's carve the dispute, coin a term, and expose its fault lines.

  ### The Core Dispute: What Does "Real Feature" Mean Here?
  1.  **Causal Camp:** "Real" = *Robustly Causal Structure*. A feature is real if it:
      *   Has isolable causal power (ablation changes behavior)
      *   Replicates across seeds/architectures
      *   Exhibits functional invariance (e.g., the "deception direction" always flips outputs when perturbed)
      *   **Claims:** This tracks *objective functional structure* emerging from optimization, akin to discovering an organ in an evolved organism.

  2.  **Predictive Camp:** "Real" = *Instrumentally Useful Description*. A feature is "real" only relative to a predictive model:
      *   Any decomposition yielding equivalent behavioral predictions is equally valid
      *   "Reality" is an empty label; only predictive utility matters
      *   **Claims:** Causal interventions are just another predictive scheme. Privileging them is arbitrary unless tied to a specific goal.

  3.  **Artifact Camp:** "Real" = *Designer-Intended Structure*. Since the network is human-made:
      *   Only the input-output behavior and loss function are "real" by design
      *   Internal structures are epiphenomenal patterns; "features" are observer projections
      *   **Claims:** Asking if a circuit is "real" is like asking if a Rorschach blot *really* contains a bat – it confuses interpretation with ontology.

  ### Why Existing Frameworks Fall Short
  *   **Scientific Realism/Instrumentalism:** Presumes a mind-independent world. Here, the substrate *is* mind-dependent (an artifact), but the emergent structure *isn't* explicitly designed. The dispute is about *which level of description* counts as "real" for an unintentional artifact.
  *   **Functionalism (Philosophy of Mind):** Focuses on causal roles abstracted from substrate. But ML features aren't defined by their role in a *cognitive* system, and the artifact status undermines appeals to "proper function."
  *   **Mechanistic Explanation (Craver):** Requires constitutive relevance and manipulability. The causal camp adopts this, but critics argue ML "mechanisms" lack biological/engineering legitimacy because they weren't designed or evolved for a purpose.
  *   **Intentional Stance (Dennett):** Applies to whole-system behavior. Your dispute is about *subpersonal* structures, and causal intervenability claims to bypass "stance" talk.

  ### Coined Term: **Artifactual Structural Realism (ASR)**  
  **Definition:** *The position that robustly causal, replicable computational structures within artificial neural networks possess a mind-independent reality *as functional components of the system*, despite their origin in undirected optimization processes and the absence of designer intent.*  

  **Key Tenets:**  
  1.  **Artifactuality:** Acknowledges the system is human-created.  
  2.  **Structural Reality:** Asserts that certain internal configurations are objective features of the system's causal architecture.  
  3.  **Robustness Criterion:** Reality is contingent on causal replicability across perturbations (seeds, architectures, ablations).  

  **Boundaries & Exclusions:**  
  - **Includes:** A "syntax validity circuit" that:  
    *   Predicts validity via linear probes  
    *   Ablation corrupts syntactic output  
    *   Replicates across 10+ seeds and 3 architectures  
  - **Excludes:** A linear probe that predicts behavior perfectly (e.g., "deception score") but:  
    *   Ablation causes no behavioral change (*spurious correlate*)  
    *   Or ablation corrupts unrelated behaviors (*non-specific causal role*)  
  - **Boundary Case:** A probe that predicts output *perfectly* and passes ablation tests *only* under a specific input distribution. ASR deems this *instrumentally useful but not robustly real* – it's a projection of the researcher's distributional prior.  

  ### What Makes the Dispute Substantive (Not Verbal)  
  The disagreement reduces to: **Is causal robustness under intervention evidence of mind-independent structure in artifacts?**  
  - **If substantive:** ASR reflects an objective property of optimization-derived systems (like evolutionary convergence in biology).  
  - **If verbal:** "Reality" is redefined by each camp, making disagreement illusory.  

  **What Would Move Me:**  
  - **Toward "Verbal":** Evidence that *all* causal decompositions are observer-relative. Example: If for every "real" circuit found, an equally predictive/causal but mutually incompatible decomposition exists (e.g., two orthogonal "truth directions" with identical causal effects).  
  - **Toward "Substantive":** Demonstrating features that are:  
    *   **Causally Necessary:** Ablation disrupts *only* the target behavior.  
    *   **Architecture-Invariant:** Identical function appears in transformers, MLPs, and SNNs.  
    *   **Transferable:** Extracted features generalize to unseen tasks with mechanistic fidelity.  

  ### Where ASR Is Most Vulnerable  
  1.  **The Epiphenomenon Challenge:** Could apparent causality be an artifact of high-dimensional geometry? (e.g., ablating *any* random direction changes outputs). *Counter-evidence:* Interventions showing selective, task-specific effects.  
  2.  **Predictive-Equivalence Paradox:** If two decompositions predict equally well and are causally robust, ASR must accept both as "real" – risking overdetermination. This would demand a parsimony criterion.  
  3.  **Biological Analogy Limitation:** Evolution has teleonomy (goal-directedness via selection); SGD lacks this. Does that undermine "reality"?  

  ### Literature Pathways  
  While no direct match exists, engage with:  
  1.  **Carl Craver** (mechanistic explanation) + **Piccinini** (functional kinds in computation) – but augment with artifactuality.  
  2.  **Daniel Dennett** (*Real Patterns*, 1991) – patterns exist if they support prediction *compression*, but weak on causality.  
  3.  **Milkowski & Rathkopf** (mechanistic artifacts) – nascent work on non-biological mechanisms.  
  4.  **Marblestone et al.** (ML as neuroscience) – highlights analogies, but downplays artifact status.  

  ### How to Present This  
  Lead with: *"We're debating whether mechanistic features are *robust causal structures* (Artifactual Structural Realism), *instrumental tools*, or *observer projections*. ASR posits that causal replicability confers reality, but the artifactuality forces us to refine 'reality' itself."*  

  **Anticipate Pushback:** Critics will argue ASR smuggles in biological realism. Preempt by emphasizing: *"Unlike evolved systems, artifacts lack teleonomy. But optimization pressures can yield *objective causal topology* – and that topology is what ASR calls real."*  

  This framework doesn't resolve the dispute, but it names the battlefield and forces clarity about what "real" could mean for the undesigned internals of designed systems. The acid test remains: **Does treating a feature as 'real' generate novel, counterintuitive predictions about model behavior?** If so, ASR does work beyond semantics.
