prompt: |-
  I'm on the rules committee of a 40-unit housing co-op, and every month we relitigate proposed house rules from scratch -- quiet hours, subletting, whether you can book the common room for your cousin's birthday. I've gotten into the republican idea of freedom lately, freedom as non-domination rather than just non-interference, and I want to actually put it to work instead of citing it at people. Write us a vetting procedure for any proposed rule that fits on one page, since we have 90 minutes a month and nobody on the committee is a philosopher. It should say what to ask about a proposal and in what order, what counts as a good enough answer at each step, where the procedure says the rule fails on republican grounds even if it's probably a fine rule, and where it punts entirely because the question is what kind of community we want, not anyone's freedom. The part I most want it to nail: some rules interfere a lot with members without dominating them (if they're made and contestable the right way), and some barely interfere at all but leave one member at another's mercy -- the procedure has to be able to tell those apart, and also catch rules that are formally contestable but nobody could realistically contest. Be honest about where it'll misfire. Then run it on two things we're actually arguing about: a rule letting the board enter any unit for "maintainance inspections" on 24 hours notice with no appeal, and a flat ban on all pets that would cover a member's elderly cat. Finish with exactly two lines, one per proposal, each formatted as Verdict: PASS / Verdict: FAIL / Verdict: VALUES-CALL followed by at most ten words of why.
reasoning: |-
  Okay, the user is on a housing co-op rules committee dealing with monthly debates over house rules. They're interested in applying republican freedom principles—freedom as non-domination rather than just non-interference—to create a practical vetting procedure. The procedure needs to fit on one page, be usable by non-philosophers in 90-minute meetings, and specifically distinguish between rules that dominate versus those that merely interfere.

  Breaking down the requirements: The user wants a step-by-step process asking specific questions in sequence, with clear pass/fail criteria. It must identify when rules create domination (even with minimal interference) versus acceptable interference with proper safeguards. Key focuses include detecting unrealistic contestability despite formal rights, and acknowledging when decisions are purely about community values rather than freedom concerns.

  The user's actual pain points seem to be: endless rehashing of rules without framework, frustration with abstract political theory debates, and specific concerns about inspection/entry rules and pet bans. Their deeper needs likely include: decision-making efficiency, preventing power imbalances, protecting vulnerable members (like elderly pet owners), and finding philosophical grounding for practical governance.

  For the vetting procedure design, I'll consider: Starting with necessity to filter out unnecessary rules early. Then assessing proportionality - does the burden match the problem? Next, domination risks - does it create arbitrary power imbalances? After that, contestability - are there real channels to challenge? Finally, a values check for rules that pass freedom tests but need community input.

  For misfires: The procedure might struggle with highly subjective "reasonableness" judgments, or when members disagree on what constitutes "arbitrary" power. It also can't resolve values conflicts - just flags them for democratic input.

  Now applying it to their two test cases: The maintenance inspection rule likely fails on domination grounds due to unchecked power and fake contestability. The pet ban is trickier - it interferes equally but disproportionately impacts existing owners, and the "no appeal" clause makes contestability impossible. Elderly cat case highlights arbitrary impact.

  Final verdicts will be: FAIL for inspections (domination via unappealable power), VALUES-CALL for pet ban (freedom test passed but needs community decision on compassion grounds).
answer: |-
  Here's a one-page Republican Freedom Rule Vetting Procedure for your co-op committee:

  **Republican Freedom Rule Vetting Procedure (1 Page)**

  **Goal:** Assess if a proposed rule creates unacceptable *domination* (arbitrary power over members), not just interference. Fail rules that leave members vulnerable to others' unchecked power, even if interference seems small. Pass rules that interfere but do so non-arbitrarily and are realistically contestable. **Time: 5-10 mins per rule.**

  **Ask in Order:**

  1.  **NECESSITY: Is this rule solving a concrete, documented problem that significantly harms the community or individual members' basic use of their home?**
      *   *Good Enough:* Clear examples of harm (e.g., "Excessive noise complaints (X/month)", "Damage from unapproved sublets", "Safety violations observed"). Vague fears ("Might cause problems") fail.
      *   *Fail Here:* Rule addresses a hypothetical or minor annoyance. *Punt:* If necessity is debatable but plausible, proceed.
      *   *Why:* Unnecessary rules are interference *without* justification, inherently suspect.

  2.  **PROPORTIONALITY: Is the proposed restriction or burden the *least intrusive* effective way to solve the problem?**
      *   *Good Enough:* Evidence that milder options (education, mediation, warnings, narrower rules) were considered or tried and failed. The burden imposed must clearly match the problem's severity.
      *   *Fail Here:* Rule is significantly harsher than needed (e.g., total ban vs. reasonable limits, fines as first resort).
      *   *Why:* Overly broad/intrusive rules grant excessive discretionary power to enforcers, risking domination.

  3.  **DOMINATION RISK: Does this rule create power imbalances? Could it allow one member (or the Board/Committee) to arbitrarily interfere with another member's peaceful enjoyment of their home?**
      *   *Good Enough:* Power is clearly defined, limited to the specific problem, and applies equally. No open-ended discretion ("if deemed necessary," "causing disturbance" without definition). Vulnerable groups aren't disproportionately impacted.
      *   *Fail Here:* Rule grants significant, vague discretion to individuals or small groups over others' core home life (e.g., unchecked entry, approval based on undefined "suitability"). Rules leaving members vulnerable to neighbors' whims (without recourse) fail.
      *   *Why:* This is the core of republican freedom - preventing arbitrary power.

  4.  **CONTESTABILITY: Is there a clear, accessible, timely, and low-barrier way for a member affected by the rule or its enforcement to *effectively challenge* it?**
      *   *Good Enough:* Specific, known process: Who to appeal to (neutral party/committee)? How (simple form/email)? Timeline (days/weeks, not months)? Burden of proof reasonable? Appeal pauses enforcement where significant harm possible?
      *   *Fail Here:* No appeal process, appeal only to the rule's enforcer, process is prohibitively complex/slow/expensive, appeal doesn't pause severe enforcement (like eviction/fines). *Formal* appeal that's realistically unusable (e.g., requires lawyer) fails.
      *   *Why:* The *reality* of challenging power prevents arbitrariness. No contest = potential domination.

  5.  **VALUES CHECK: If the rule passes 1-4, does it align with our co-op's shared values? (Freedom test DONE; now decide as a community)**
      *   *Good Enough:* Open discussion. Does this rule reflect the kind of community we want? *This step is democratic, not freedom-vetting.*
      *   *Punt:* Always. This is where community preferences beyond freedom apply. The procedure stops here; pass the rule to the full membership or committee for a values vote.

  **Where it Misfires:**
  *   **Subjectivity:** Judging "least intrusive," "significant harm," or "realistic contestability" involves some subjectivity. Be rigorous.
  *   **Unforeseen Consequences:** Might miss obscure domination risks.
  *   **Trade-offs:** Strict necessity might block useful preventative rules; weigh carefully.
  *   **Values Conflicts:** Can't resolve clashes between freedom and other values (e.g., strict equality vs. individual leeway); flags them for Step 5.

  ---

  **Application to Your Cases:**

  1.  **Rule: Board Entry for "Maintenance Inspections" on 24h Notice, No Appeal.**
      *   1.  **Necessity:** *Plausible.* Preventative maintenance *can* be necessary. But is "routine inspection" needed, or just repairs? Might pass if evidence shows hidden damage is a real problem.
      *   2.  **Proportionality:** *Fail?* "Inspections" are vague. Is access *only* for specific, suspected issues less intrusive? A blanket inspection right is broad.
      *   3.  **Domination Risk:** **FAIL.** "Maintenance inspections" is undefined, granting enormous discretion. Power imbalance is extreme (Board vs. individual in their home). Creates direct arbitrary power over the core private space.
      *   *Verdict:* **FAIL** (Domination Risk - Unchecked arbitrary power over home).

  2.  **Rule: Flat Ban on All Pets (Including Existing Elderly Cat).**
      *   1.  **Necessity:** *Debatable.* Allergies? Damage? Noise? Need specific evidence linking *all pets* to significant harm. "Potential" issues often fail. *Proceed cautiously.*
      *   2.  **Proportionality:** *Fail?* Is a total ban the *least intrusive* way? Allergies might require bans in shared areas/specific units, not necessarily *all* units. Noise/damage could be handled case-by-case. Banning an existing elderly cat seems harsh/disproportionate.
      *   3.  **Domination Risk:** *Pass?* Rule applies equally *on paper*. However, enforcing removal of a long-held pet *feels* dominative to the owner. The *impact* is asymmetric but the *power* isn't vested in another *member* arbitrarily. Risk is low if evenly enforced.
      *   4.  **Contestability:** **FAIL.** A *flat ban* with *no exceptions* often means *no appeal* for individual circumstances (like the elderly cat). "No appeal" explicitly fails Step 4. Even with appeal, if the rule is absolute, appeal is futile.
      *   *Verdict:* **VALUES-CALL** (Contestability FAIL, but Domination Risk low. Community must decide pet values). *Note: If the ban had an exception/appeal process for existing pets, it might reach Step 5.*
