prompt: |-
  I referee a lot of manuscripts for a mid-sized interdisciplinary journal, and the stuff I get is heavily "evolutionary explanation for human behavior" flavored -- why we like music, why morning sickness exists, why people get depressed, why men prefer certain waist-to-hip ratios. My problem: I'm sympathetic to evolutionary thinking but I've also read enough Gould and Lewontin to be suspicious of just-so stories, and I never know where to draw the line in a review without either rubber-stamping a panglossian fairytale or being that referee who just says "not an adaptation, byproduct" to everything without argument.

  So what I want is a decision procedure, built out of the actual substance of the adaptationism debate (spandrels/byproducts, exaptation, drift and constraints, the whole Gould-Lewontin vs Dawkins/Dennett slugfest, plus the more sober versions of the argument from design), that I can run in about half an hour per paper with no data analysis and no ability to demand new experiments. It should be an ordered list of questions with, for each one, what counts as a pass, what counts as a fail, and what just gets flagged in the review as unresolved. It needs to actually terminate in one of a few verdicts -- reject the adaptationist claim, accept it provisionally, or "the paper is fine as long as it's reframed as a hypothesis, not a finding" -- since those are the three moves available to me in a referee report. And I want the procedure to be honest about which steps are my judgment dressed up as a checkbox, because I know myself well enough to know I'll rationalize.

  Some specific things it has to handle, since they come up constantly:

  1. How much weight to give "the trait is complex and well-engineered for X, and you don't get that kind of fit by accident" when the paper never demonstrates the fit, just asserts it.
  2. Whether cross-cultural universality helps an adaptationist claim, given that plenty of byproducts are universal too.
  3. The case where a trait plausibly started as a byproduct but the paper claims it was later shaped by selection for its current use (exaptation). When is that a real explanation and when is it a free pass?
  4. The "depression is adaptive because it signals yielding in social conflict" style paper, where the proposed function explains why the trait isn't lethal but can't obviously explain why it has the specific form it has.

  Then run it on three manuscripts I'm making up but which are representative:

  - Morning sickness as an adaptation for avoiding teratogens in the first trimester (this one has actual comparative and timing evidence behind it, for whatever my memory of the literature is worth)
  - Our love of landscape paintings featuring water and open trees as an adaptation for savanna habitat selection
  - Sad music enjoyment as an adaptation for social bonding, in a paper whose only evidence is that people report feeling more connected after listening together

  Also: one of these I actually want to accept (the music one, it's charming and I'd love it to be true), so you'll have to show me what the procedure says even when it embarrasses me. And include at least one failure mode where the procedure itself misfires -- e.g. a true adaptation it would wrongly kill -- so I know when to overrule my own checklist. Keep it usable by a tired person on a Sunday night, not a philosophy seminar.
reasoning: |-
  Okay, let me tackle this referee's problem. They're dealing with a flood of evolutionary psychology papers and need a practical way to evaluate adaptationist claims without falling into just-so story traps. The core tension is between their sympathy for evolutionary thinking and their awareness of Gould-Lewontin critiques. 

  First, I need to unpack their explicit requirements: a step-by-step decision tree that terminates in clear verdicts (reject/provisional accept/reframe), handles common pitfalls like asserted complexity or universality claims, and includes real judgment calls. The three manuscript examples are perfect test cases - morning sickness (stronger evidence), landscape paintings (weaker), and sad music (charming but thin). 

  The referee's hidden struggle resonates - they want to approve the music paper but know it might not hold up. That's exactly why we need systematic checks. I recall Williams' 1966 criteria for adaptation: reliability, efficiency, economy. Plus Mayr's distinction between proximate/ultimate causes. The procedure must flag when papers conflate these.

  For the checklist design, I'm considering starting with existence verification - many papers assume traits exist without demonstrating cross-cultural consistency. Then function claims need testing against null hypotheses (byproduct/spandrel). The engineering fit question requires actual evidence, not assertion. Universality gets demoted to minor supporting evidence since spandrels can be universal too. 

  Exaptation cases need special handling - can't let them be free passes. The depression-as-signal example shows the "why this form?" problem. I'll build in a specificity check: does the proposed function explain the trait's precise characteristics?

  Testing on the three cases: Morning sickness passes most checks with its timing/comparative evidence. Landscape paintings fail on multiple fronts - no engineering proof, weak universality. Sad music... sorry referee, it crashes at "alternative explanations" since bonding could easily be a byproduct. 

  Crucially, I'll add a "known adaptations" safety valve - if the procedure rejects something like binocular vision, override it. And admit where steps involve judgment (e.g., plausibility of alternatives). The whole thing must fit on one mental screen - no nested flowcharts. 

  Final structure will be: 1) Trait existence 2) Function claim 3) Engineering evidence 4) Alternatives considered 5) Specificity check 6) Exaptation handling. Each step has clear pass/fail thresholds. The morning sickness case will show how strong evidence survives scrutiny, while music reveals how charm doesn't equal rigor.
answer: |-
  Here's a practical, substance-based decision procedure designed for efficiency, transparency, and grounding in the adaptationism debate. It prioritizes falsifiability, burden of proof, and avoiding "free passes," while acknowledging where your judgment is essential.

  **The Adaptationist Claim Evaluation Checklist (ACEC)**

  **Core Principle:** The burden of proof lies *heavily* on the paper to demonstrate adaptation. "Not proven" is a sufficient reason to demand reframing or reject if overstated. Universality and asserted complexity are weak evidence.

  **Ordered Questions & Decision Flow:**

  1.  **Is the trait clearly defined and demonstrably real/cross-culturally recurrent?**
      *   **Pass:** Trait is operationally defined with evidence (e.g., survey data, behavioral observation, physiological measure) showing it exists consistently beyond the study sample. *Morning Sickness:* Pass (well-documented physiological phenomenon). *Landscape Paintings:* Fail (assumes preference drives art creation; conflates modern art with ancestral environment response). *Sad Music:* Pass (reported feelings exist).
      *   **Fail:** Trait definition is vague, culturally specific without universality evidence, or conflated with modern behaviors. Verdict: **Reject** or **Demand Major Reframing** (e.g., "hypothesis about modern behavior X, not demonstrated universal trait Y").
      *   **Flag:** Evidence for trait existence is weak or limited. *Note in Review:* "The universality/cross-cultural stability of the trait requires stronger empirical support before evaluating its evolutionary origins."

  2.  **Does the paper identify a plausible *specific* selective pressure (E) in the hypothesized Environment of Evolutionary Adaptedness (EEA) likely acting on the trait (T)?**
      *   **Pass:** E is specific (e.g., "avoiding plant teratogens in weeks 1-12 of pregnancy"), plausibly recurrent in EEA, and directly linked to T's proposed function. *Morning Sickness:* Pass (teratogen avoidance, timing specific). *Landscape Paintings:* Fail ("savanna habitat selection" is vague; how did *art* enhance fitness? Link is tenuous). *Sad Music:* Weak Pass ("social bonding" is plausible E, but link to *sad* music specifically is weak).
      *   **Fail:** E is vague ("survival," "reproduction"), anachronistic (modern pressures), or implausible in EEA frequency/impact. Verdict: **Reject** or **Reframe as Hypothesis** ("The proposed selective pressure is underspecified/implausible...").
      *   **Flag:** E is plausible but indirect or its link to T is assumed. *Note in Review:* "The link between the proposed selective pressure [E] and the trait [T] requires stronger justification; alternative pathways exist."

  3.  **Does the paper provide evidence *beyond assertion* for "good design" (fit between T's form and proposed function F)?**
      *   **Pass:** Evidence demonstrates specificity, efficiency, or economy (Williams, 1966). *Examples:* Comparative data (T absent where E absent), precise timing (T active when E present), engineering analysis, cost-benefit modeling showing net benefit. *Morning Sickness:* Pass (timing matches fetal vulnerability peak, cross-species patterns). *Landscape Paintings:* Fail (Asserts fit, no evidence savanna landscapes in art *actually* correlate with ancestral habitat quality proxies). *Sad Music:* Fail (Reports bonding effect, but no evidence *sad* music is *better designed* for bonding than other music types or activities).
      *   **Fail:** "Good design" is merely asserted ("it's complex, so it must be an adaptation") without supporting evidence. Reliance solely on universality or plausibility. **Verdict: Major Weakness - Reframe as Hypothesis** ("The claim of adaptive design relies on assertion; empirical evidence for the specific fit between T and F is lacking").
      *   **Flag:** Some suggestive evidence exists but is incomplete (e.g., correlation without mechanism). *Note in Review:* "Evidence for the proposed adaptive design is preliminary; stronger tests of the fit between T and F are needed (e.g., [suggest specific test])."

  4.  **Does the paper seriously consider and *test against* plausible non-adaptive explanations (byproduct/spandrel, drift, constraint)?**
      *   **Pass:** Actively discusses alternatives (e.g., "T could be a byproduct of system X") and provides *evidence* why adaptation is a *better* explanation (e.g., T's features are poorly explained by X alone). *Morning Sickness:* Pass (Discusses alternatives like byproduct of hormone changes, argues timing/pattern better fit adaptation). *Landscape Paintings:* Fail (Ignores alternatives - e.g., cultural transmission, learned associations, byproduct of general pattern recognition). *Sad Music:* Fail (Ignores alternatives - e.g., byproduct of general music cognition + emotional contagion, cultural learning).
      *   **Fail:** Alternatives are ignored, dismissed without argument, or given token mention. Verdict: **Major Weakness - Reframe as Hypothesis** ("The analysis fails to adequately consider plausible non-adaptive explanations for T...").
      *   **Flag:** Alternatives are discussed but not robustly tested against the data presented. *Note in Review:* "While alternatives are mentioned, the evidence presented does not sufficiently distinguish the adaptive hypothesis from plausible non-adaptive explanations (e.g., [specific alternative])."

  5.  **For exaptation claims: Does the paper provide evidence that selection *subsequently shaped* T *for* the new function F, distinct from its original role?**
      *   **Pass:** Evidence shows T's *current form* exhibits design features *specifically beneficial* for F that are *poorly explained* by the original function or constraint. *Not just* "T is now used for F." *Example:* Evidence that feather structure changed *after* initial evolution (for insulation?) to enhance flight performance.
      *   **Fail:** Merely states "T might have started as a byproduct but now it's used for F" without evidence of *selection modifying T for F*. This is a free pass. Verdict: **Reframe as Hypothesis** ("The exaptation claim requires evidence of subsequent selective modification for the proposed function F").
      *   **Flag:** Plausible argument for exaptation, but evidence for *selective shaping* is indirect. *Note in Review:* "The exaptation hypothesis is intriguing, but direct evidence that selection acted *on T* to refine it *for F* is needed."

  6.  **Does the proposed function F explain the *specific, distinctive features* of T, or merely its existence/non-lethality? (Addresses "Depression as Signal")**
      *   **Pass:** F accounts for key, unique characteristics of T (e.g., why depression involves *anhedonia*, *psychomotor changes*, *specific* cognitive biases, not just "low mood + withdrawal"). *Morning Sickness:* Pass (Specific symptoms like nausea/aversion directly linked to teratogen avoidance). *Sad Music:* Fail ("Bonding" doesn't explain why *sad* music is used/preferred for this over joyful music; explains persistence perhaps, not form).
      *   **Fail:** F only explains why T isn't eliminated (it's "useful" in some broad sense) but not its specific form. Verdict: **Reframe as Hypothesis** ("The proposed function F explains the potential maintenance/persistence of T but does not adequately account for its specific characteristics; it may be a secondary effect or co-opted spandrel.").
      *   **Flag:** F explains some features but not others. *Note in Review:* "The proposed function F may explain aspect X of T, but does not clearly account for its distinctive features Y and Z."

  **Terminating Verdicts (Apply after Q6):**

  *   **Reject the Adaptationist Claim (Outright):** Multiple Fails (especially Q1, Q2, Q3, Q4). Paper fundamentally fails burden of proof. Claim is unsupported or contradicted. *(e.g., Landscape Paintings - Fails Q1, Q3, Q4)*
  *   **Accept Provisionally (Publishable with Adaptation Claim):** Mostly Passes, Flags manageable. Strong evidence for design (Q3), plausible E (Q2), good consideration of alternatives (Q4), explains specific form (Q6). Adaptation is the *best supported* hypothesis. *(e.g., Morning Sickness - Passes Q1, Q2, Q3, Q4, Q6; Flags likely minor)*
  *   **Reframe as Hypothesis (Publishable but NOT as a demonstrated finding):** Mix of Pass/Flag/Fail, but core adaptation claim is overstated. Common outcomes:
      *   Reliance on assertion of design/universality (Fail Q3).
      *   Inadequate consideration of alternatives (Fail Q4).
      *   Function explains persistence but not form (Fail Q6).
      *   Exaptation claimed without evidence of shaping (Fail Q5). *(e.g., Sad Music - Pass Q1, Weak Pass Q2, Fail Q3, Fail Q4, Fail Q6. Verdict: Reframe. The bonding effect is interesting, but evidence does not demonstrate *sad music enjoyment itself* is an adaptation for bonding.)*
      *   *(e.g., "Depression as Signal" - Likely Fail Q6: Might explain why low mood exists broadly, not why it takes the specific, debilitating form of clinical depression).*

  **Handling Your Specific Concerns Explicitly:**

  1.  **Asserted "Good Design" (Q3):** Heavy weight *only if demonstrated*. Assertion alone is a **Fail (Q3)**, leading to **Reframe/Reject**. Universality alone doesn't save it.
  2.  **Cross-Cultural Universality:** Handled in **Q1 (Trait Existence)**. Universality is *necessary but insufficient* for adaptation. It gets no weight in Q3 (Design) or as primary evidence for function. Many spandrels are universal (e.g., belly buttons).
  3.  **Exaptation (Q5):** The "free pass" is blocked. Claiming exaptation requires evidence of *subsequent selective shaping* for the new function, not just co-option. Otherwise, it's just a hypothesis or a description of current use.
  4.  **"Why this form?" (Q6):** Critical filter. If the proposed function only explains why the trait isn't lethal ("it's useful") but not its specific, often costly, features, it fails Q6, leading to **Reframe**.

  **Running the Test Cases:**

  1.  **Morning Sickness (Adaptation for Teratogen Avoidance):**
      *   Q1: Pass (Well-defined, real, recurrent).
      *   Q2: Pass (Specific E: Early pregnancy teratogens).
      *   Q3: Pass (Evidence: Timing matches vulnerability, cross-species patterns, specific aversions).
      *   Q4: Pass (Discusses alternatives like byproduct, argues adaptation fits better).
      *   Q5: N/A (Not exaptation claim).
      *   Q6: Pass (Symptoms directly linked to avoiding ingestion).
      *   **Verdict: Accept Provisionally.** Strongest case.

  2.  **Landscape Paintings (Savanna Adaptation):**
      *   Q1: **Fail** (Assumes preference drives art; conflates modern behavior with ancestral trait; universality of *preference* for savanna-like scenes in art is debatable and not robustly shown).
      *   Q2: Weak (E is plausible but vague - "habitat selection" via *art*? Link is tenuous).
      *   Q3: **Fail** (Asserts fit, no evidence paintings reflect actual EEA habitat quality choices or confer fitness).
      *   Q4: **Fail** (Ignores massive cultural, learned, byproduct explanations).
      *   Q5: N/A or Fail (If claimed as exaptation of general preference, no shaping evidence).
      *   Q6: Fail (Doesn't explain why *paintings* specifically, or the specific artistic features).
      *   **Verdict: Reject the Adaptationist Claim.** Fails multiple fundamental checks.

  3.  **Sad Music Enjoyment (Adaptation for Social Bonding):**
      *   Q1: Pass (Reports feeling connected exist).
      *   Q2: Weak Pass (Social bonding is plausible E, but link to *sad music specifically* is weak).
      *   Q3: **Fail** (Only shows bonding occurs, not that *sad music* is *specially designed* for it vs. other music/activities. Bonding effect could be byproduct).
      *   Q4: **Fail** (Ignores alternatives: byproduct of general music + emotional contagion, cultural association, pleasure in aesthetic sadness).
      *   Q5: N/A.
      *   Q6: **Fail** (Does not explain why *sad* music is used/preferred for bonding over other, more positive, music types).
      *   **Verdict: Reframe as Hypothesis.** The bonding effect is interesting data! But the paper provides *no* evidence that *sad music enjoyment itself* is an adaptation *for* bonding. It could easily be a culturally shaped byproduct. Frame it as: "Sad music listening promotes feelings of connection; we hypothesize this may reflect an evolved function for social bonding..." NOT "We demonstrate that enjoying sad music is an adaptation for..."

  **Failure Mode (When to Overrule):**

  *   **The "Binocular Vision" Problem:** ACEC *might* stumble on a trait so blindingly obvious and well-understood as an adaptation that demanding extensive proof *in this specific paper* seems pedantic (e.g., a paper on fine-scale aspects of binocular vision coordination). The procedure emphasizes burden of proof, which is correct, but reviewers shouldn't reinvent the wheel.
      *   **Override:** If the adaptation status of the *core trait* is overwhelmingly established in the literature (e.g., color vision, sweating, lactation), focus ACEC on the paper's *specific novel claim* (e.g., a new proposed sub-function, timing, variation). Don't demand Q1-Q6 re-prove the foundational adaptation. Your judgment here is key – is this trait's adaptation status truly uncontroversial bedrock? (Hint: Very few human behavioral traits meet this bar like binocular vision does!).

  **Usability on a Sunday Night:**

  *   **It's a Checklist:** Run down the 6 questions sequentially. Most answers will jump out after reading.
  *   **Judgment Points Acknowledged:** Q2 (Plausibility of E), Q3 (Strength of design evidence), Q6 (Does F explain form?) involve your judgment. The checklist forces you to articulate *why* you think Pass/Fail/Flag.
  *   **Terminates Clearly:** The verdicts map directly to referee actions.
  *   **Targets Common Flaws:** Specifically addresses the just-so story pitfalls you constantly see.
  *   **Embarrasses You Fairly:** The Sad Music paper you like gets "Reframe" because it commits classic errors (asserted design, ignored alternatives, doesn't explain form). The checklist protects you (and the literature) from wishful thinking.

  This procedure forces authors to meet a higher standard of evidence for adaptationist claims, respects the Gould-Lewontin critiques by prioritizing alternatives and burden of proof, leverages the "argument from design" rigorously (Williams' criteria), and provides you with a defensible, substantive framework for your reviews. Use the override sparingly for truly established adaptations.
