prompt: |-
  Say we could pull Charles Lyell out of the 1830s and stick him on the Anthropocene Working Group right as the Crawford Lake proposal was being put together -- the one where stratigraphers picked a lake core in Canada with plutonium traces from 1950s bomb tests as the golden spike, and then the whole thing got voted down in early 2024. What do you think he'd actually do with his vote, and I want you to really argue it rather than hedge. On the one hand the guy literally invented the habit of chopping up recent time by counting percentages of living mollusc species, so formalizing boundaries in the rock record is his whole deal. On the other hand he spent his career hammering the idea that the same slow forces we see now did everything in the past, and human-caused change at this speed might smell like the catastrophism he couldnt stand. And the deeper part of the question: when the debate is about whether the boundary should be 1950 vs 1610 vs the mid-20th century generally, whose call is it even? Geologists, historians, climate scientists, indigenous groups near Crawford Lake? I'm curious whether Lyell would say its a purely stratigraphic question that laypeople have no business deciding, or whether he'd concede that a boundary defined by what humans did to the planet is different in kind from a boundary defined by molluscs. Take a clear position on how he'd come down, and dont be afraid to admit which parts of his views we're genuinely guessing at vs. which follow pretty directly from the stuff in Principles of Geology. Write it as continuous prose only please, no headers or bullet points or anything, like a long email to a freind who knows some geology but not the details of the Anthropocene fight.
