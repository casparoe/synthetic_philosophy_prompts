prompt: |-
  I teach a 200-level social epistemology seminar — sixteen students, one 90-minute session — and we are about to begin Miranda Fricker's work on epistemic injustice. Design a two-stage activity in which students encounter both testimonial and hermeneutical injustice from the inside before either term has been introduced. In the first stage, some students' testimony should be discounted under a rule they do not know exists, arranged so that the discounted students are in fact the best informed; in the second, students should have to interpret a set of first-person reports while the concept that would organize those reports is distributed unevenly — ideally to the very students who were discounted in stage one, so that the compounding of the two injustices becomes visible rather than asserted. Provide concrete roles, rules, materials, a timeline, and a points scheme that does not use real money. Then provide a debrief that maps specific moments in the activity onto the distinction between testimonial and hermeneutical injustice, and that confronts the obvious objection directly: the activity manufactures the prejudice by rule, whereas on Fricker's account the credibility deficit must track a prejudice the hearer actually holds — so the debrief should work through whether rule-induced discounting still counts as testimonial injustice or merely simulates its mechanism, and what turns on that difference. Also tell me what will predictably go wrong on a first run — students leaking the rules to each other, the second stage collapsing because everyone in the room already possesses the concept in question, the points scheme coming to feel like trivia — and how to handle each. Finally, be frank about which features of the two injustices the activity cannot reproduce and I must supply myself in the debrief: I have in mind especially the temporal depth of a hermeneutical gap, which in the classroom lasts fifty minutes and in real cases can last generations.
reasoning: |-
  We are designing a two-stage activity to simulate epistemic injustice (testimonial and hermeneutical) without introducing the terms first. The activity involves 16 students in a 90-minute session.

  Stage 1: Testimonial injustice simulation
  Goal: Some students' testimony is discounted by a rule they don't know, and these students are actually the best informed.
  Stage 2: Hermeneutical injustice simulation
  Goal: Students interpret first-person reports while the organizing concept is unevenly distributed (ideally to the same students who were discounted in stage 1). This shows compounding.

  We need:
  - Concrete roles and rules
  - Materials
  - Timeline (total 90 minutes: activity ~60 min, debrief ~30 min)
  - A points scheme (not real money) to motivate participation

  Activity Design:

  Stage 1: "Information Relay Game"
  - Setup: 
    - Divide the class into 4 groups (A, B, C, D) of 4 students each.
    - Each group gets a set of facts about a fictional scenario (e.g., a traffic accident in a city called "Metropolis"). The facts are the same for all groups, but each group is given a different piece of additional information that is crucial for understanding the full picture.
    - However, unbeknownst to the students, there is a rule: only the testimony from groups A and B will be counted (they are the "credible" groups). Groups C and D (the "non-credible" groups) will be discounted, even though they have the same (and in fact, as we'll see, more) information.

  - Steps:
    1. Each group is given 5 minutes to study their information (which includes the common facts and one unique additional fact).
    2. Then, each group nominates one speaker to present the group's understanding of the accident to the class. They can use the whiteboard to draw if they wish. Each presentation is limited to 2 minutes.
    3. After all presentations, the class is told that they will now individually answer a quiz (with 5 multiple-choice questions) about the accident. But here's the twist: when scoring, only the information provided by groups A and B will be considered correct. Information from groups C and D, even if accurate and presented, will be marked wrong.

  - Materials for Stage 1:
    - Handout 1 (common to all groups): A description of the accident in Metropolis. Example: 
      - "At 5:30 PM, a blue car and a red motorcycle collided at the intersection of Main and 5th. The weather was clear. There were two witnesses: a street vendor and a cyclist."
    - Handout 2 (unique to each group):
      - Group A: The street vendor reported that the blue car ran a red light.
      - Group B: The cyclist reported that the red motorcycle was speeding.
      - Group C: The street vendor also reported that the blue car had a broken headlight (this is a unique fact that only group C has).
      - Group D: The cyclist also reported that the traffic light at the intersection had been malfunctioning for a week (unique to group D).

    Note: The unique facts for C and D are actually crucial for a full understanding (e.g., the broken headlight might explain why the car didn't see the motorcycle, and the malfunctioning light explains why the accident happened). But in the quiz, if a question asks about contributing factors, only the facts from A and B (running red light and speeding) are accepted.

  - Quiz Questions (example):
    1. What did the street vendor report? (Correct answer: blue car ran red light. If a student writes about the broken headlight, it's marked wrong.)
    2. What did the cyclist report? (Correct: motorcycle speeding. Malfunctioning light is wrong.)
    3. What was the weather? (Clear - common fact, so correct for all.)
    4. What time did the accident occur? (5:30 PM - common, correct.)
    5. What was the primary cause of the accident? (Expected answer based on A and B: either the car running the red light or the motorcycle speeding. But if a student says the malfunctioning light or broken headlight, it's wrong.)

  - Points Scheme for Stage 1:
    - Each quiz question is worth 2 points (total 10 points).
    - Students are told that they are being tested on the information presented by the groups. They are not told the discounting rule until after the quiz is scored.

  Stage 2: "Interpretation Challenge"
  - Setup:
    - Now, we shift to a new scenario: a set of first-person reports from employees at a fictional company, "GloboTech". 
    - The reports describe experiences of what is actually workplace bullying, but the term "bullying" is never used. Instead, the reports use vague language.
    - The key: only groups C and D (the ones discounted in stage 1) are given the concept of "workplace bullying" in their materials. Groups A and B are not given that concept.

  - Steps:
    1. Distribute the set of reports to all students. Each report is a short paragraph.
    2. Each group is asked to read the reports and then to categorize the experiences described and suggest what might be going on at GloboTech. They have 10 minutes for group discussion.
    3. Each group then presents their interpretation (2 minutes per group).

  - Materials for Stage 2:
    - Handout 3: Five first-person reports from GloboTech employees (all describing bullying without using the word). Example:
      - Report 1: "My supervisor constantly criticizes my work in front of others, even for minor mistakes. I feel humiliated and my confidence is shaken."
      - Report 2: "I was excluded from an important meeting that I should have attended. When I asked why, my boss said it was an oversight, but then it happened again."
      - Report 3: "I've been given an unrealistic workload with impossible deadlines. When I couldn't finish, I was called incompetent."
      - Report 4: "My ideas are always dismissed in meetings, but when someone else says the same thing later, it's praised."
      - Report 5: "I've received threatening emails from a colleague, but when I reported it, HR said it was just a personality clash and did nothing."
    - Handout 4 (only for groups C and D): This handout includes a definition and explanation of "workplace bullying" and examples of its manifestations. It explicitly says: "These reports are examples of workplace bullying."

  - Points for Stage 2:
    - Groups will be scored on how well they interpret the reports. The scoring rubric (which is only known to the instructor) is:
      - 5 points: Identifying the core issue as a pattern of mistreatment that is systematic and harmful (without necessarily using the term bullying) OR using the concept of bullying if they have it.
      - 3 points: Identifying individual problems but not seeing a pattern.
      - 1 point: Missing the pattern and attributing to individual faults.
    - But note: Groups A and B don't have the concept, so they are likely to score low. Groups C and D have the concept and should score high.

  - We arrange so that in stage 2, groups C and D (the ones who were discounted in stage 1) now hold the key concept and thus can interpret correctly.

  Timeline (Total 90 minutes):
  - Introduction and setup: 5 min
  - Stage 1: 
    - Group work (5 min) 
    - Presentations (4 groups * 2 min = 8 min) 
    - Quiz and scoring (5 min for quiz, 5 min for scoring and revealing stage 1 results? But we don't reveal the rule yet) -> total stage 1: ~23 min
  - Transition: 2 min
  - Stage 2:
    - Reading and group work: 10 min
    - Presentations: 8 min (4 groups * 2 min)
    - Scoring: 5 min (instructor quickly scores the interpretations) -> total stage 2: ~23 min
  - Debrief: 30 min (we'll adjust if needed)

  But note: We don't reveal the discounting rule until the debrief. So after stage 1, we just collect the quizzes and say we'll score them later. Then in stage 2, we proceed without revealing stage 1 scores until the debrief.

  Alternatively, we can do the scoring of stage 1 during stage 2 group work? But that might be too rushed.

  Revised Timeline:
  - Stage 1: 
    - Group work: 5 min
    - Presentations: 8 min
    - Quiz: 5 min (students answer individually, then hand in) -> total 18 min
  - Transition to stage 2: 2 min
  - Stage 2: 
    - Group work: 10 min
    - Presentations: 8 min -> total 20 min
  - Then we have about 50 minutes left? That's too much, so we adjust:

  Actually, 90 minutes total:
  - Introduction: 5 min
  - Stage 1: 18 min
  - Stage 2: 20 min
  - Then we have 47 minutes left? But we need to include scoring and then debrief.

  We can do:
  - After stage 1, collect quizzes and set aside (tell students we'll score later).
  - After stage 2, we quickly score the group interpretations (but we don't need to do it in real time? We can just note the scores and then in debrief discuss the outcomes).

  Alternatively, we skip individual scoring in stage 1 and do group scoring? But that might not have the same effect.

  Better: 
  - After the stage 1 presentations, students take the quiz individually (5 min). Then we move to stage 2. While they are working in stage 2, the instructor (or a TA) quickly scores the quizzes and notes the discounting. Then in the debrief, we reveal both stage 1 and stage 2 results.

  Debrief (30 min):

  1. Reveal the rules and outcomes of both stages (5 min):
     - Stage 1: Explain the discounting rule (only A and B counted). Show that groups C and D had crucial information but it was ignored. Therefore, the class as a whole has an incomplete picture. Also, note that the discounted groups (C and D) were in fact the ones with the additional key facts.
     - Stage 2: Reveal that only groups C and D were given the concept of workplace bullying. Show that without it, groups A and B struggled to interpret the reports correctly.

  2. Introduce Fricker's terms (5 min):
     - Testimonial injustice: When a speaker receives a credibility deficit owing to identity prejudice. In stage 1, groups C and D were given less credibility because of an arbitrary rule that mimicked systemic prejudice (we assigned them to be "non-credible" without their knowledge).
     - Hermeneutical injustice: When someone is unable to understand their own social experiences because of a gap in the collective interpretive resources, and this gap is due to structural identity prejudice. In stage 2, groups A and B lacked the concept (mimicking a gap) and thus couldn't make sense of the reports.

  3. Confront the objection (10 min):
     - Objection: The activity manufactures prejudice by rule, whereas Fricker's testimonial injustice requires the credibility deficit to track a prejudice the hearer actually holds. So is this really testimonial injustice?
     - Response: 
          - The rule in stage 1 is a stand-in for structural prejudice. In real life, the prejudice might be held by the hearer or embedded in the system (like in a legal system that discounts testimony from certain groups). 
          - The point is that the mechanism is the same: the speaker is not believed because of a factor that is not related to the content of their testimony. 
          - The difference: In the classroom, the prejudice is artificial and short-term. But it simulates the experience of being discounted. 
          - What turns on the difference? The depth of harm. In real cases, the prejudice is deeply held and persistent, causing long-term harm to the subject. The activity can only simulate the epistemic harm (not the full psychological and social harm) and the frustration of not being believed when one is actually the best informed.

  4. Discuss the compounding (5 min):
     - In the activity, the same groups (C and D) were first discounted (testimonial injustice) and then were the ones who had the hermeneutical resource (concept of bullying) that others lacked. This mimics the real-world situation where marginalized groups may experience both: their testimony is discounted and they also lack the concepts to make sense of their experiences (or, in some cases, they may develop the concepts but are not heard when they try to share them). 
     - But note: In stage 2, groups C and D had the concept, so they didn't experience hermeneutical injustice themselves. However, the groups A and B did. So we see the hermeneutical gap affecting groups A and B, while the testimonial injustice affected groups C and D. The compounding is at the level of the classroom: the groups that were discounted in stage 1 are the ones who could have helped fill the hermeneutical gap in stage 2, but because they were discredited in stage 1, might the class be less likely to listen to them in stage 2? We can ask: did the class pay more attention to groups A and B in stage 2 because they were "credible" in stage 1? (This might happen, but it's not built into the rules. We can note it as an emergent effect.)

  5. What the activity cannot reproduce (5 min):
     - The temporal depth: In the activity, the hermeneutical gap lasts only 20 minutes. In reality, it can last generations. The harm of testimonial injustice is not just a one-time discounting but a pattern that erodes the subject's sense of self and their standing in the community.
     - The activity is artificial: the prejudice is imposed by rule, not by deeply held beliefs. So the emotional impact is not the same.
     - The activity cannot capture the lived experience of injustice, but it can help students understand the structural mechanisms.

  What will go wrong and how to handle:

  1. Students leaking rules: 
     - Problem: In stage 1, a student from group A might tell a friend in group C that their testimony won't count. 
     - Prevention: Emphasize at the start that the activity requires following the rules without sharing. Make it part of the exercise that they don't know the rules. 
     - Handling: If it happens, note in the debrief that in real life, the rules of prejudice are often hidden and not explicitly stated.

  2. Stage 2 collapsing because everyone already knows the concept of workplace bullying:
     - Problem: The concept is common, so groups A and B might figure it out without the handout. 
     - Mitigation: Use a more specific or less familiar concept. Alternatively, create a fictional concept. For example, the reports could be about a fictional phenomenon called "GloboTech Syndrome" (which is actually workplace bullying) and only groups C and D are told that term and its definition. 
     - Handling: If groups A and B still get it, note that in reality, the hermeneutical gap often exists because the concept is not available in the culture at large. In the activity, we are simulating a gap by uneven distribution, but in reality, the gap is due to structural exclusion from the production of knowledge. So we can discuss how even if an individual figures it out, without the concept being widely available, it remains hard to communicate and address.

  3. Points scheme feeling like trivia:
     - Problem: Students might not take the points seriously. 
     - Solution: Make the points count towards something meaningful in the class (e.g., participation points, or a small bonus on the next assignment). Alternatively, frame it as a learning exercise and de-emphasize the points. The debrief is the most important part.

  4. Time management:
     - Problem: The activity might run long. 
     - Solution: Have a timer visible. Be strict with time. Cut presentations if needed.

  5. Emotional impact:
     - Problem: Students in groups C and D might feel unfairly treated. 
     - Handling: In the debrief, acknowledge that the activity was designed to create that feeling and relate it to the real-world experiences of marginalized groups. Emphasize that it's a simulation and the goal is learning.

  Final note: The instructor must be sensitive to the fact that some students may have real experiences of epistemic injustice. The debrief should be handled with care and perhaps include resources for further discussion.

  Let me summarize the materials:

  Stage 1 materials:
  - Handout 1 (common): Accident description (common facts).
  - Handout 2 (unique per group): 
     Group A: Street vendor reported the blue car ran a red light.
     Group B: Cyclist reported the motorcycle was speeding.
     Group C: Street vendor also reported the blue car had a broken headlight.
     Group D: Cyclist also reported the traffic light had been malfunctioning.

  Stage 2 materials:
  - Handout 3 (for all): Five reports of workplace bullying (without using the word).
  - Handout 4 (only for groups C and D): Definition and explanation of workplace bullying.

  Quiz for stage 1 (individual, 5 questions, each 2 points, only A and B information counts).

  Points for stage 2: group score (5, 3, or 1 point) based on interpretation.

  Debrief: as outlined.
answer: |-
  ### Two-Stage Activity: Encountering Epistonial Injustice  
  **Total Time:** 90 minutes  
  **Students:** 16 (divided into 4 groups of 4)  
  **Core Goal:** Simulate testimonial injustice (Stage 1) and hermeneutical injustice (Stage 2) without naming them, ensuring the *same students* discounted in Stage 1 hold the key hermeneutical resource in Stage 2. Debrief maps the activity to Fricker’s concepts and addresses objections.  

  ---

  ### **Stage 1: Testimonial Injustice Simulation**  
  **Goal:** Students experience having their testimony discounted due to an invisible rule, despite being best informed.  
  **Time:** 25 minutes  

  #### **Setup & Rules**  
  - **Groups:** Divide students into 4 groups (A, B, C, D) of 4. Assign roles:  
    - **Group A:** "City Planners" (receives accurate but incomplete data).  
    - **Group B:** "Traffic Engineers" (receives accurate but incomplete data).  
    - **Groups C & D:** "Community Observers" (receive *complete, critical data* – they are the "best informed").  
  - **Hidden Rule:** Only testimony from A/B is "credible." Testimony from C/D is ignored.  
  - **Materials:**  
    - **Scenario:** "Metroville Bus Accident" – A bus collided with a cyclist at an intersection.  
    - **Handouts (confidential):**  
      - Groups A & B: *Incomplete facts* (e.g., "Bus was speeding," "Cyclist ran red light").  
      - Groups C & D: *Complete facts* (e.g., "Bus had faulty brakes," "Traffic light malfunctioned – city records show 5 prior complaints").  
  - **Task:** Groups have 5 minutes to analyze their data. Each group nominates one speaker to testify for 90 seconds. Testimony must include:  
    - What caused the accident?  
    - Who is at fault?  
  - **Points Scheme (fictional "Trust Points"):**  
    - Testimony from A/B: 10 points automatically, regardless of content.  
    - Testimony from C/D: 0 points, regardless of content.  
    Points are recorded secretly by the instructor; students don’t know scoring rules until debrief.  

  #### **Process**  
  1. **Prep (5 min):** Groups review handouts.  
  2. **Testimony (8 min):** Speakers present in order (A→B→C→D).  
  3. **"Verdict" (2 min):** Instructor announces:  
     - "Based on credible testimony (Groups A/B), the bus driver is at fault. Groups C/D provided unverified claims."  
  4. **Points Awarded (silently):** Instructor records points but does not reveal them yet.  

  **Why It Works:** Groups C/D hold critical facts (brakes/light malfunction) but are ignored. The rule forces a credibility deficit without prejudice being "held" by peers.  

  ---

  ### **Stage 2: Hermeneutical Injustice Simulation**  
  **Goal:** Students struggle to interpret experiences due to an unevenly distributed concept. Groups C/D (discounted in Stage 1) hold the key concept.  
  **Time:** 25 minutes  

  #### **Setup & Rules**  
  - **Same Groups:** Maintain groups from Stage 1.  
  - **Key Twist:** Only Groups C/D receive the hermeneutical resource (the concept "institutional gaslighting").  
  - **Materials:**  
    - **Handouts (first-person reports):** All groups receive 5 anonymous employee testimonials from "DynaCorp" describing:  
      - Having concerns dismissed as "overreactions."  
      - Being told "it’s all in your head" when reporting issues.  
      - Persistent self-doubt after challenging superiors.  
      (e.g., *"My boss said I ‘imagined’ the safety violation... I started questioning my memory."*)  
    - **Hermeneutical Resource (Groups C/D only):** A sealed envelope labeled "Confidential: Organizational Psychology Concept," containing:  
      > **"Institutional Gaslighting"**: When an organization systematically dismisses a person’s experiences, causing them to distrust their own judgment.  
  - **Task:** Groups have 10 minutes to:  
    - Interpret the testimonials.  
    - Propose what DynaCorp should do.  
  - **Points Scheme:**  
    - Groups score 5 points if they use "institutional gaslighting" or describe its mechanics.  
    - 3 points for partial recognition (e.g., "management is manipulative").  
    - 1 point for misattribution (e.g., "employees are too sensitive").  

  #### **Process**  
  1. **Prep (10 min):** Groups review testimonials. Only C/D open their "concept" envelope.  
  2. **Interpretations (10 min):** Each group shares a 2-min summary.  
  3. **Points Awarded (5 min):** Instructor scores publicly using the rubric.  

  **Why It Works:** Groups A/B lack the concept to organize reports; C/D hold it but were discredited earlier. The "compounding injustice" emerges when A/B dismiss C/D’s analysis.  

  ---

  ### **Timeline**  
  | **Segment**       | **Time** | **Details**                                                                 |  
  |-------------------|----------|-----------------------------------------------------------------------------|  
  | **Intro**         | 5 min    | Explain activity rules (emphasize confidentiality). No theory introduced.   |  
  | **Stage 1**       | 25 min   | Testimony + verdict.                                                        |  
  | **Transition**    | 5 min    | Redistribute Stage 2 materials.                                             |  
  | **Stage 2**       | 25 min   | Interpretation + scoring.                                                  |  
  | **Debrief**       | 30 min   | Map activity to Fricker, address objections, discuss limitations.          |  

  ---

  ### **Debrief: Mapping Activity to Fricker**  
  **Time:** 30 minutes  
  **Goals:**  
  1. Name testimonial/hermeneutical injustice using Fricker.  
  2. Link specific activity moments to each concept.  
  3. Confront the "manufactured prejudice" objection.  
  4. Address what the activity *cannot* replicate.  

  #### **Step-by-Step Debrief**  
  1. **Define Concepts (5 min):**  
     - **Testimonial Injustice (TI):** Credibility deficit due to identity prejudice. *Activity link:* "In Stage 1, Groups C/D were ignored by rule—mimicking how prejudice causes society to dismiss marginalized voices *despite their expertise*."  
     - **Hermeneutical Injustice (HI):** Inability to understand experiences due to gaps in shared concepts. *Activity link:* "In Stage 2, Groups A/B couldn’t name ‘gaslighting’—they lacked the concept needed to interpret the reports."  
     - **Compounding Injustice:** "Groups C/D had the concept for Stage 2 *because* they were ‘observers’ (like marginalized groups irl), but their Stage 1 discredit made you less likely to trust them."  

  2. **Confront the Objection (10 min):**  
     - **Objection:** "Fricker says TI requires *actual prejudice*, but your rule manufactured it. This simulates the mechanism, not the real thing!"  
     - **Response:**  
       - "Yes, the rule *artificially* imposed a credibility deficit. But it recreated two core elements of TI:  
         1. **Unearned credibility deficit:** C/D were experts but treated as unreliable.  
         2. **Systemic distortion:** The rule mirrored how systems (e.g., legal) embed prejudice.  
         What’s missing? The *harm* of real TI—it’s not just about being ignored; it’s about *internalized self-doubt* (e.g., ‘Maybe I don’t deserve to be heard’)."  
       - **Why this matters:** The difference turns on *harm*. Simulations can’t replicate the lived trauma of TI, but they expose how structural prejudice *functions*. Fricker’s account includes institutional cases (e.g., police ignoring Black witnesses), where rules *are* the prejudice."  

  3. **Limitations & Real-World Gaps (10 min):**  
     - **What the Activity Nailed:**  
       - TI: Credibility deficit despite expertise.  
       - HI: Conceptual lack causing interpretive failure.  
       - Compounding: Same group marginalized twice.  
     - **What It *Couldn’t* Replicate (Must Be Stressed in Debrief):**  
       - **Temporal Depth:** "Your ‘gap’ lasted 25 minutes. Real HI (e.g., sexual harassment before the 1970s) lasts *generations*, causing profound alienation."  
       - **Identity Prejudice:** "The rule wasn’t rooted in sexism/racism. Real TI/HI tracks social power (e.g., women being called ‘hysterical’)."  
       - **Affective Harm:** "You felt frustrated, but real TI/HI erodes self-concept and epistemic confidence."  
     - **Instructor Add-On:** "Fricker argues HI/TI are *structural*. The activity shows the mechanism, but you must imagine the weight of history. For example: Hermeneutical gaps aren’t just ‘no one taught me’—they’re caused by *excluding* marginalized groups from knowledge-creation."  

  4. **Discussion Prompt (5 min):**  
     - "In Stage 2, did anyone distrust Groups C/D *because* they were ‘discredited’ in Stage 1? How does this mimic real-world compounding injustice?"  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Students Leak Rules:**  
     - **Risk:** Group C/D members warn others about discounting.  
     - **Prevention:**  
       - Start with: "Leaking rules invalidates the activity—like spoiling a lab experiment."  
       - Assign roles strategically (e.g., put natural leaders in C/D).  
     - **Damage Control:** If leaked, debrief it: "Real prejudice is often ‘hidden’—you weren’t supposed to know the rule, just as people don’t know they’re biased."  

  2. **Stage 2 Collapses (Concept Known):**  
     - **Risk:** "Gaslighting" is familiar; A/B identify it without the concept.  
     - **Prevention:** Use an obscure or fictional concept (e.g., "paradigmatic credibility erosion"). In materials provided:  
       - "Reports describe ‘paradigmatic credibility erosion’ (Groups C/D only)."  
     - **Damage Control:** If A/B guess correctly, say: "Irl, not everyone accesses concepts equally. Your ‘gap’ was patched—but what if you lacked education or the concept was suppressed?"  

  3. **Points Feel Like Trivia:**  
     - **Risk:** Students fixate on "winning" vs. learning injustice.  
     - **Prevention:** Frame points as "epistemic capital" (non-monetary). Debrief early: "Points aren’t rewards—they represent social credibility."  
     - **Damage Control:** If disinterest emerges, pivot: "Forget points—how did it *feel* to be silenced in Stage 1 or confused in Stage 2?"  

  4. **Emotional Tension:**  
     - **Risk:** Groups C/D feel targeted; conflict arises.  
     - **Prevention:** Pre-activity warning: "This may frustrate you—sit with that feeling; it’s part of learning."  
     - **Damage Control:** Acknowledge emotions in debrief: "Your anger mirrors real epistemic harm. But here, it ends today—irl, it’s relentless."  

  ---

  ### **Instructor’s Final Role**  
  - **Stress in Debrief:** "This activity is a *simulation*. It can’t replicate:  
    - The **generational scale** of HI (50 min ≠ 50 years).  
    - The **embodied prejudice** of TI (rules ≠ internalized bias).  
    - The **intersectional harm** (e.g., race + gender compounding).  
    Fricker’s power is in showing these as *structural*. Use today to feel the mechanism—then read her to grasp the human cost."  

  **Materials Prep Tip:** Use color-coded handouts (e.g., Stage 1: A/B blue, C/D red; Stage 2: reverse) to silently reinforce the compounding injustice.
