prompt: |-
  a guy at my work (very much the reddit-atheist type, no offense to anyone) keeps pulling out this one line from some 1800s math guy named Clifford: "it is wrong always, everywhere, and for anyone, to believe anything upon insufficient evidence." he mostly uses it against religious people but last week he aimed it at me because i said i believed my neighbor wasnt the one who reported stuff about our building to the landlord, and honestly i don't have sufficient evidence for that, i just... believe it, based on knowing him for six years i guess

  anyway it got me thinking. the sentence sounds super strong but i can't actually tell what its claiming. like is it saying believing-without-evidence is morally WRONG wrong, like lying wrong, or just dumb? and does it apply to the belief sitting in your head at a moment, or to how it got there? i looked up the clifford essay a bit and he apparently opens with a story about a shipowner who talks himself into believing his old rusty ship is safe, and what seemed bad there wasn't really the belief itself but that he smothered his own doubts on purpose to save money. that's a totally different complaint than "you believed something with weak evidence," right? one is about being negligent with your own thinking process, the other is about the belief as a thing

  also "insufficient evidence" — insufficient for WHAT? enough for acting on it? enough to claim you know it? enough for the belief to just exist in your head at all? i believe my friend actually likes me and my evidence is basically vibes plus him showing up to stuff. am i doing a wrong thing every time that belief is in my head?

  so what i want: lay out the different precise claims this one sentence could be making, from the weak readings that are basically platitudes nobody disputes to the strong ones, and say for each wether it's actually plausible or falls apart the second you test it on everyday beliefs like mine about my neighbor or my friend. and then tell me which reading my coworker needs for his religion gotcha to actually work, and whether that particular reading holds up or not. i gather william james wrote a whole comeback to clifford back then so i know this fight is old news, i just want the menu of possible meanings before i bring it back to the break room
