answer: |-
  Your case list isn't incoherent! You've hit on a deep and well-studied phenomenon in semantics: **non-intersective modification**. Your "vibes" are tracking a fundamental distinction, but idioms complicate things. Let's break this down.

  **(1) The Principle: Subsective vs. Non-Subsective Modification**

  The core principle distinguishing your TRUE and FALSE verdicts is whether the modifier **`A`** is **intersective/subsective** or **non-subsective** with respect to the noun **`B`**:

  1.  **Subsective (including Intersective) Modifiers:** These *restrict* the reference of `B`. A `A B` **`IS`** a `B`.
      *   **Intersective:** `A B` refers to things that are both `A` and `B`. (`white horse`: something white AND a horse).
      *   **Merely Subsective:** `A B` refers to a subset of `B`s distinguished by the degree or manner denoted by `A`. (`skillful surgeon`: a surgeon who is skillful *at surgery*; `small elephant`: an elephant that is small *for an elephant*).
      *   **Your Verdict:** FALSE for "a white horse is not a horse" / FALSE for "a small elephant is not an elephant".
      *   **Predictions:**
          *   `gray elephant`: FALSE (Subsective - it's still an elephant).
          *   `big flea`: FALSE (Subsective - it's still a flea).
          *   `heavy book`: FALSE (Intersective - it's heavy AND a book).

  2.  **Non-Subsective Modifiers:** These *shift the meaning* of `B` fundamentally. A `A B` **`IS NOT NECESSARILY`** a `B` (and often isn't).
      *   **Types:**
          *   **Modal:** Shift to possible/required/past/future/etc. states (`former senator`, `alleged criminal`, `probable winner`, `future king`).
          *   **Intensional:** Shift to the concept or representation, not the thing itself (`toy horse`, `fake gun`, `stuffed animal`, `drawing of a horse`).
          *   **Manner/Adverbial:** Qualify the *activity* associated with the noun (`heavy smoker` = smokes heavily, not necessarily heavy; `fast driver` = drives fast, not necessarily fast).
          *   **Privative:** The modifier *removes* the core property of `B` (`fake gun` lacks the core function of a real gun).
      *   **Your Verdict:** TRUE for "a toy horse is not a horse", "a fake gun is not a gun", "a former senator is not a senator", "a probable winner is not a winner", "a heavy smoker is not heavy".
      *   **Predictions:**
          *   `rubber duck`: TRUE (Intensional - it's a bath toy shaped like a duck, not a duck).
          *   `stuffed animal`: TRUE (Intensional - it's a plush toy, not an animal).
          *   `alleged criminal`: TRUE (Modal - they are *accused*, not necessarily convicted).
          *   `old friend`: TRUE (Manner/Modal - refers to the *duration of the friendship*, not the friend's age).
          *   `dark horse` (political): TRUE (Intensional - a surprising candidate, not necessarily a horse nor dark-colored).
          *   `gray area`: TRUE (Intensional - refers to ambiguity, not a physical area).

  **(2) Problematic Verdicts & Saving the Principle**

  Your principle is sound, but your *application* needs refinement, mainly due to **lexicalization/idiomatization**:

  1.  **`black eye`**: **TRUE** is correct *for the idiomatic meaning*. This is a **lexicalized non-subsective compound**. It doesn't mean "an eye that is black", it means "a bruise around the eye". The principle holds: the modifier fundamentally shifts the meaning away from the literal `B` (eye). The problem isn't the principle, it's compositionality breaking down in fixed phrases. *This is the same mechanism as `seahorse` (shift to a type of fish) and `dark horse` (shift to a political concept).*
  2.  **`seahorse`**: **TRUE** is correct. Same as `black eye` - a lexicalized non-subsective compound meaning a fish.
  3.  **`dark horse` (literal)**: You didn't state a verdict, but it should be **FALSE** if meant literally (a horse with dark coat color). The TRUE verdict only applies to the *idiomatic/political sense*. This shows the principle depends on the *meaning intended*, not just the string of words.
  4.  **`heavy smoker`**: **TRUE** is correct *for the intended reading*. "Heavy smoker" is a **manner/adverbial non-subsective modifier**. The adjective "heavy" doesn't modify "smoker" directly (describing the person's weight), but modifies the implied activity *smoking* ("smokes heavily"). Therefore, a heavy smoker is not necessarily heavy themselves. *This DOES belong on the list and fits the principle perfectly.*
  5.  **`white horse` (as idiom?)**: Your core insight is correct. If "white horse" were lexicalized to mean something else (e.g., a type of rescue helicopter, a symbol of purity), THEN "a white horse is not a horse" could be TRUE *for that specific idiomatic meaning*. But in its literal, compositional, intersective reading (which is overwhelmingly dominant in English), it's FALSE. Your "dead obvious" verdict stands for the literal case.

  **Verdicts to Drop/Refine:**
  *   **None need dropping *if* context/meaning is considered.** The issue isn't wrong verdicts, it's recognizing the *level of meaning*:
      *   `black eye` (idiom) = TRUE
      *   `black eye` (literal interpretation) = FALSE (if you meant "an eye that is black due to injury", it *is* still an eye, just injured).
      *   `dark horse` (literal) = FALSE
      *   `dark horse` (idiom) = TRUE
      *   `white horse` (literal) = FALSE
      *   `white horse` (hypothetical idiom) = potentially TRUE (but it isn't one).
  *   **The Escape Hatch is Necessary (But Limited):** Idioms *are* different. They are stored lexical items with meanings not fully derived from their parts. Any semantic principle based on compositional meaning will struggle with them. The best principle handles *productive* modification and treats idioms as special cases where the whole phrase has a non-compositional meaning. You *can* often analyze them as extreme non-subsective modification.

  **(3) Gongsun Long: Was He Confused? (The Philosophy Bit)**

  Gongsun Long wasn't *confused*; he was making a sophisticated point about **language, reference, and the relationship between names, attributes, and kinds**. His argument has several serious readings:

  1.  **The "Kind" Reading (Your Seahorse Point):** This is the most charitable. Gongsun Long might be arguing that "white horse" functions not just as "horse modified by white" but as a *distinct compound name* designating its own kind or category. "Horse" names the *genus* (equine), while "white horse" names a specific *species* within that genus. On this reading:
      *   "If you ask for a horse, yellow/black ones are acceptable" = Asking for the genus permits any species.
      *   "If you ask for a white horse, yellow/black ones are not acceptable" = Asking for the species excludes others within the genus.
      *   **Soundness:** This reading is logically sound *if* we grant that "white horse" lexically designates a distinct sub-kind, not just an intersection. It becomes a claim about the *semantic function* of the compound in specific linguistic or classificatory contexts. Whether "white horse" actually *did* function this way in his language/culture is a historical question. His argument highlights how compound terms *can* behave this way (as `seahorse` shows in English). He wasn't necessarily denying biological reality, but commenting on linguistic categorization.
  2.  **The "Compositionality of Identity" Reading:** His "color is not shape" move highlights that the *meaning* of the compound "white horse" isn't simply the sum of "white" + "horse". The compound has its own identity. He's pointing out that the criteria for satisfying "white horse" (must have both color and shape) are stricter than for "horse" (only shape). Therefore, the *meaning* or the *set of requirements* denoted by "white horse" is not identical to the *meaning* or *set of requirements* denoted by "horse". On this reading:
      *   "White horse is not horse" means "The concept 'white horse' is not identical to the concept 'horse'".
      *   **Survival:** This survives brilliantly in modern semantics! It's the core distinction between intersective (`white horse` extension = white things ∩ horse things) and non-intersective modification. It also relates to Frege's distinction between sense and reference. The *sense* (mode of presentation) of "white horse" is different from the sense of "horse", even if all white horses are horses. Gongsun Long is emphasizing *sense* or *intension*.
  3.  **Against Naive Compositionality:** He's arguing that you cannot simply assume the meaning of a compound is reducible to the meanings of its parts combined with "and". This is a profound point about language. While `white horse` *happens* to be intersective in English, many compounds (`toy horse`, `seahorse`) are not. His argument serves as a warning against assuming compositionality is always straightforward.
  4.  **The Sophistry Reading:** If taken as a claim about *extension* in a literal biological context ("No white horse is a horse"), it *is* sophistry. But this is likely an uncharitable interpretation. His contemporaries probably understood he was making a point about names and concepts.

  **Conclusion on Gongsun Long:** He wasn't confused. He was likely making a point about the **intensional nature** of compound names and the **non-identity of concepts** ("horse" vs. "white horse"), possibly arguing that "white horse" functions as a distinct kind-name. His argument highlights the very distinctions you're grappling with in English semantics. His "color is not shape" move underscores that the attributes contributing to the compound are distinct and that satisfying the compound requires satisfying *both*, making the compound concept different from the simple concept. **This reading is not only serious but foundational to understanding how modification works in natural language.** He wasn't winning on biology; he was winning on semantics and the philosophy of language.

  **Final Summary:**

  1.  **Principle:** "An A B is not a B" is TRUE if `A` is a **non-subsective modifier** (modal, intensional/representational, privative, adverbial/manner) or the compound **`A B` is lexicalized/idiomatic** with a meaning shifted away from the literal `B`. It is FALSE if `A` is **subsective** (including intersective).
  2.  **Verdicts:** Your verdicts are largely sound when meaning/intention is clear. The principle struggles only with **lexicalized idioms** (`black eye`, `seahorse`), which require acknowledging non-compositional meaning. Drop the idea that `dark horse` (literal) yields TRUE. Keep `heavy smoker` (TRUE) as an adverbial non-subsective.
  3.  **Gongsun Long:** He wasn't confused. A serious reading sees him arguing that "white horse" functions as a distinct kind-name or concept (non-subsective/intensional), making its *identity* or *sense* different from "horse". This aligns perfectly with the modern distinction your intuitions are tracking and highlights the non-compositional potential of compounds. His argument is sound on this reading, concerning the logic of concepts and names, not biological taxonomy.
