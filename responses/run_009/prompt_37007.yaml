answer: |-
  **Bottom line:** The apparent agreement evaporates—Lewisian modal realism and Everettian quantum mechanics are fundamentally incompatible despite superficial resemblances; their "worlds" differ in kind, structure, origin, and metaphysical status.

  ### Restating Lewis in Everettian Vocabulary
  1.  **Concreteness & Indexical Actuality:** Lewis's "concrete worlds" map to *decoherent branches* in the universal wavefunction, understood as distinct, emergent quasi-classical histories. "Actual" would be a *self-locating uncertainty* label applied to the branch containing the speaker's conscious experience ("here-now-branch"), analogous to "now" in spacetime.
  2.  **Isolation:** Lewis's spatiotemporal isolation maps to the *effective dynamical isolation* between decohered branches: once decoherence occurs and pointer states are selected, interference is suppressed to negligible levels (for all practical purposes; FAPP) under the system's Hamiltonian. Worlds/branches are not spatiotemporally related *because* they are dynamically decoupled histories within the wavefunction.
  3.  **Counterpart Theory:** Your "counterparts" in other Lewisian worlds map to *your future self-locations* in other Everett branches following a branching event ("successors"). Modal claims about what *could* happen to you involve these successors in other branches.
  4.  **Recombination:** Lewis's free recombination principle maps to the claim that *any initial condition or sequence of events compatible with the fundamental laws (quantum dynamics, symmetries)* and Hilbert space structure is realized on *some* decoherent branch within the universal wavefunction. The "space of worlds" is the space of decoherent histories generated by the wavefunction's evolution under the Hamiltonian.

  ### Residue Report
  **(a) Isolation: Primitive vs. Dynamical**
  *   **Lewis:** Isolation is *primitive and constitutive*. Spatiotemporal relatedness *defines* a world; anything spatiotemporally unrelated is *by definition* a separate world. Causation is intra-world only. Isolation is not explained; it's the fundamental ontological structure.
  *   **Everett:** Isolation is *dynamically emergent and approximate*. Branches are FAPP isolated *because* decoherence rapidly suppresses interference under specific (physical) conditions. They share a common origin in the wavefunction, *were* interacting before decoherence, and the isolation is contingent on the physics (Hamiltonian, environment). Failure of perfect isolation (e.g., revival phenomena) is physically possible, however improbable. Isolation is a *consequence*, not a primitive.
  *   **Verdict:** **Not the same.** Lewis's isolation is a brute metaphysical fact defining worldhood. Everett's isolation is a contingent, emergent physical fact about subsystems within the single world (the wavefunction). This difference is foundational.

  **(b) Recombination: Constrained Possibility vs. Logical Plenitude**
  *   **Lewis:** Recombination is *logically permissive*. Any arrangement of duplicate parts not violating logic (or perhaps analytic truths) exists in *some* world. Physics is *contingent*; different worlds have different laws. The space of worlds is vast, unstructured by physical law, and underpins supervenience (e.g., laws supervene on world-distribution of properties).
  *   **Everett:** "Recombination" is *physically constrained*. Only histories compatible with the *actual, fixed* universal Hamiltonian, Hilbert space structure, initial wavefunction, and quantum dynamics are realized. The "space of worlds" is the structured set of decoherent histories generated by this specific physics. The Born rule weights further structure it quantitatively. Physics is *necessary*; all branches obey the same fundamental laws.
  *   **Verdict:** **Radically different structure with philosophical consequences.** Lewis's plenitude supports his analysis of modality, supervenience, and propositions (propositions are sets of worlds). For you, the space of "possible worlds" (branches) is tightly constrained by actual physics. Lewis *needs* his unconstrained recombination for his philosophical projects (e.g., explaining how laws are contingent patterns across worlds). Your branching structure cannot fulfill this role.

  **(c) Unmatched Elements & Translation Failures**
  *   **Lewis has no Everett counterpart:**
      *   **Fundamental Spacetime Isolation:** The primitive, defining isolation (a) has no counterpart. Your branches are *parts* of a unified entity.
      *   **Contingency of Laws:** Lewis allows worlds with different fundamental laws. Your branches all obey the *same* quantum dynamics and (presumably) fixed fundamental constants - the laws are necessary features of the wavefunction.
      *   **Non-Physical "Worlds":** Lewis's plenitude includes worlds violating actual physics (e.g., worlds with magic, faster-than-light travel, unicorns - if logically possible). Your branches are strictly within the domain of quantum physics.
  *   **Everett has no Lewis counterpart:**
      *   **The Universal Wavefunction:** Lewis's worlds are disconnected fundamentals. Your "worlds" are emergent patterns *within* a single fundamental entity (Ψ).
      *   **Branching Dynamics:** The *process* of decoherence creating new quasi-classical histories has no analog in Lewis's static plurality of worlds. Lewisian worlds don't "split"; they just *are*.
      *   **Born Rule Weights:** The quantitative measure structure on branches, crucial for probability in Everett, has no place in Lewis's metaphysics.
  *   **Why Translation Fails & Lewis's View of "Ersatz":**
      *   **Failure Reasons:** The failures stem from **fundamentally different ontologies.** Lewis posits a plurality of *basic*, disconnected concrete universes. Everett posits a single basic entity (Ψ) that *contains* structures we label "worlds." Physics vocabulary *can* describe Lewis's view abstractly, but cannot replicate its fundamental structure (disconnected concreta). Lewis smuggled in **primitive disconnectedness** and **logical plenitude** as core metaphysical commitments.
      *   **Ersatzism:** Lewis argued "ersatz" modal realism (using abstract representations like sets of propositions or mathematical structures *as* possible worlds) fails because these representations aren't *concrete* like our world; they lack the "right kind" of parts and relations. **By Lewis's strict lights, your branches *are ersatz*.** While they ground concrete *experiences*, the branches themselves are *patterns* or *structures within* the concrete wavefunction. They are not fundamental, disconnected concrete entities. Lewis demands worlds be "things of the same kind as I and all my surroundings" – fundamental universes. Your branches are non-fundamental, emergent substructures of one universe. Your intuition of their "concreteness" (they support robust quasi-classical physics) isn't the *fundamental ontological concreteness* Lewis requires for genuine modal realism. He would classify them as sophisticated abstract representations generated by the physics of the one actual concrete world (Ψ).
