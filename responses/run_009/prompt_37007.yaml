prompt: |-
  I'm a physics PhD student who works on decoherence and who, like most of my cohort, takes the Everettian (many-worlds) interpretation as the least bad reading of quantum mechanics — not as a metaphysical commitment, just as what the formalism suggests once you refuse to add collapse by hand. I've recently been reading about David Lewis's modal realism: the claim that possible worlds are real, concrete entities of the same kind as our world, that "actual" is just an indexical like "here" or "now," that worlds are spatiotemporally isolated from one another, that ordinary objects like you exist in only one world and your "counterparts" in the others do the modal work, and that worlds are freely recombinable — any arrangement of duplicate parts that doesn't violate logic or physics exists somewhere. On the surface this sounds like it should map almost trivially onto what I already believe: the universal wavefunction, branches decohering into non-interacting effective worlds, the indexicality of "this branch," my successors in other branches. But I suspect the mapping is much less clean than it looks, and I'd like that checked rather than assumed.

  Restate Lewis's position as carefully as you can in my vocabulary — wavefunction, branches, decoherence, pointer states, self-locating uncertainty, the emergent spacetimes of decohered histories — covering at least the four elements above (concreteness and "indexical actuality"; isolation; counterpart theory; recombination). Then give me the residue report. Where I specifically want your judgment: (a) Lewis's worlds are causally and spatiotemporally isolated "just because" no world is spatiotemporally related to another, whereas my branches are offshoots of a single dynamical process and were, briefly, interacting — does "isolation" mean the same thing in both cases, or is Lewis's isolation a primitive and mine a dynamical fact? (b) Lewis's recombination principle says any possible arrangement exists, but my branches are constrained by the Hilbert space, the Hamiltonian, and the Born-rule weights — so does the "space of worlds" have an entirely different structure for the two of us, and does that difference do philosophical work for Lewis (e.g., in his account of supervenience or of propositions)? (c) Is there anything in Lewis that has no Everettian counterpart at all, and vice versa — and where the translation fails, tell me whether the failure reflects something my physics vocabulary can't say, something Lewis's metaphysics was smuggling in, or a genuine disagreement that only looked like agreement. I'm told Lewis argued that his realism's main rival, "ersatz" modal realism, consists of things that are abstract in a way nobody can define; if that's so, I'd like to know whether my branches come out as ersatz by his lights or genuine, since they strike me as concrete in every sense I use that word.

  Lead with your bottom line in the first sentence — specifically, your verdict on whether the apparent agreement between modal realism and Everettian branching survives the translation or evaporates — and then give the reasoning, with no preamble and no restatement of what I've asked.
