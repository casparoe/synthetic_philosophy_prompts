answer: |-
  Your analysis cuts brilliantly to the heart of a debate that *is* persistently re-stated rather than resolved. The core disagreement isn't primarily about facts, nor is it easily dissolved by purpose-relativity or compensation. Here's a diagnosis based on what each camp concretely says and does, and why the stalemate persists:

  ### The Core Disagreement: Ontological Priority & The Nature of "The Poem"

  1.  **The Fundamental Clash: What *is* the irreducible essence of the poem?**
      *   **The Semantic Camp (Content-Ontology):** For them, the poem's core identity resides in its *propositional and connotative meaning*. Form is a vessel, albeit a significant one, for delivering that meaning. A poem stripped of its original form is still fundamentally *that poem* if its meaning is intact, even if diminished. When they say "a dance song's meaning is largely in the *meaning* of the words urging the dance," they prioritize the semantic intent over the kinetic effect of the form itself. Their practice (e.g., Nabokov's *Eugene Onegin*) demonstrates a belief that meaning *can* be extracted and presented separately, even if awkwardly.
      *   **The Formal Camp (Event-Ontology):** For them, the poem's core identity resides in the *unique aesthetic experience it creates through the inseparable fusion of sound, structure, rhythm, and sense*. Form isn't a vessel; it's the shaping force of the content and the mechanism of its effect. The "volta" isn't just an argumentative turn; it's a *formal event* whose impact is inextricably tied to the structural pressure built by the preceding octave within the sonnet's rigid frame. Hofstadter's obsession with Marot demonstrates the belief that *how* the poem coaxes movement (its sonic, rhythmic, structural tactics) *is* the meaning. Their practice (insisting on rhyme/meter even with compromises) demonstrates a belief that without a significant formal analogue, you haven't translated *the poem*, only its paraphrase.

  2.  **"Faithfulness" Defined by Ontology:** This is where your verbal hunch is correct, but it's deeper than synonyms.
      *   **Semantic Camp Faithfulness:** Faithfulness = Preserving the core *message, imagery, connotations, and intellectual/emotional argument* of the original as accurately as possible within the target language's natural idiom. "Success" is measured by the equivalence of the *what*.
      *   **Formal Camp Faithfulness:** Faithfulness = Recreating, within the target language's possibilities, the *aesthetic experience, structural tension, sonic texture, and performative impact* of the original. "Success" is measured by the equivalence of the *how it feels and works*. Sacrificing form feels like sacrificing the poem's soul; sacrificing meaning feels like sacrificing its body. Each camp sees the other's sacrifice as the fatal one.

  ### Addressing Your Specific Hunches

  *   **Purpose-Relativity (Your Strongest Hunch):** **You are substantially right, but it doesn't dissolve the core disagreement, it contextualizes the *practitioner's* choice.** Yes, the "correct" approach *for a specific task* depends on the goal:
      *   **Crib for Scholars:** Prioritize semantic accuracy (closer to Semantic Camp).
      *   **Stage Performance/Poetic Vitality:** Prioritize formal/rhythmic integrity and performative impact (closer to Formal Camp).
      *   **Grandchildren Knowing Her Work:** This *leans* towards the Formal Camp, but with nuance. You want them to experience her *as a poet*, not just a thinker. They need to feel the *craft*, the musicality, the structure that shaped her thought. A purely semantic gloss risks feeling like notes, not poetry. However, forced distortions (awkward syntax, archaic words *just* for rhyme) that make it sound stilted or unnatural in English would create a barrier. **Your purpose demands a *poem* in English that carries the essence of *her poetic act*.** This often aligns with sophisticated Formal Camp practice or skilled compensation.
  *   **Answering Different Questions:** This is intertwined with ontology. The Semantic Camp asks: "What did the poet *say*?" The Formal Camp asks: "How did the poet *make it work* and *feel*?" These are different facets of the same complex object, but each camp prioritizes one facet as defining the object itself.
  *   **Hidden Empirical Question (Reader Psychology):** This is crucial and underexplored empirically. *Does* an English reader experiencing iambic pentameter feel something analogous to a Portuguese reader experiencing *decassílabo*? Does a particular rhyme scheme evoke similar structural satisfactions cross-linguistically? While some effects might be universal (e.g., tension/release, pattern recognition), many are culturally and linguistically conditioned. **The lack of definitive answers here allows both camps to assume their preferred equivalences *are* meaningful.** The Formal Camp acts *as if* formal analogues create comparable experiences; the Semantic Camp is skeptical, seeing the differences as too great to bother with forced equivalence.
  *   **Compensation & Why Polemic Persists:** Compensation (e.g., sacrificing rhyme but adding alliteration/internal rhyme elsewhere; loosening meter but tightening syntax) is the pragmatic translator's daily bread. **The camps don't deny its necessity in practice; their polemic is about the *hierarchy of values* when compensation fails to achieve both ideals perfectly.** The Semanticist sees compensation as often *reinforcing* their point: you abandon strict form because meaning is paramount, and you buy back *some* poetic effect elsewhere as a bonus. The Formalist sees compensation as *vindicating* their point: you fight to recreate *some* formal effect *because it's essential*, even if you have to move it to a different part of the linguistic arsenal. The polemic persists at the theoretical level because it's about what constitutes the poem's core identity, not the messy compromises of practice.

  ### What Would Count as Progress?

  *   **A Canonical Demonstration?** Unlikely. Successful translations exist across the spectrum (e.g., Robert Fagles' Homer vs. Richmond Lattimore's; various Pushkins). Each camp claims their preferred versions as vindication.
  *   **A Distinction?** Refining the ontology helps clarify the debate but doesn't resolve it. Distinguishing "translation of poetic content" from "transcreation of poetic effect" might be useful, but it still leaves the "poem" contested.
  *   **An Empirical Result?** **This is the most promising avenue for shifting the conversation.** Rigorous, cross-linguistic, empirical studies on reader response to form in translation could challenge assumptions. If evidence showed that, for example, the *volta* in a non-rhyming, non-metrical "semantic" translation elicited a similar cognitive/emotional response to the formal original in readers unaware of the form, it would bolster the Semantic Camp. Conversely, if evidence showed that only formally analogous translations triggered the specific neural/cognitive patterns associated with the original form's effects, it would bolster the Formal Camp. Currently, the debate relies on intuition and anecdote.
  *   **A Change in the Question?** Instead of "Which is more faithful?", ask **"Faithful to *which dimension* of the poem, and for *which purpose*?"** This embraces purpose-relativity and acknowledges the multidimensional nature of the artifact. It shifts the focus from absolute fidelity to responsible choices based on priorities. This is where the field *is* moving pragmatically, even if the theoretical poles remain.

  ### Conclusion: Your Commission - A Hard Decision, Not Ill-Posed

  The underlying ontological disagreement persists "because it should" – it reflects a genuine, perhaps irresolvable, tension in the nature of poetry itself. However, **for your specific, deeply personal commission, the question is *not* ill-posed. It demands a hard, but guided, decision.**

  *   **Your Purpose:** To allow grandchildren to *know her work* as a poet. This implies experiencing her *craft* and *artistic voice*, not just her ideas.
  *   **The Form's Role:** Sonnets, especially with *volta*, are quintessentially formal constructs. The *decassílabo* is fundamental to Portuguese poetic rhythm.
  *   **The Verdict (Leaning Formal with Nuance):** Prioritize recreating the *poetic experience* – the sonnet structure, a clear *volta*, *musicality* (even if using slant rhyme, assonance, or flexible meter instead of strict *decassílabo* and perfect rhyme), and evocative language. **Avoid** forced rhymes and unnatural syntax that make the poem sound awkward or obscure meaning unnecessarily. **Use compensation strategically:** if you lose a perfect rhyme, strengthen internal sound patterns; if the *decassílabo* feels unnatural in English pentameter, aim for a consistent, sonorous rhythm that carries the line gracefully. Your fidelity is to her *poetic act* – making meaning *through* form.

  **You are facing a hard decision requiring constant negotiation between meaning and form, guided by your purpose and respect for her artistry.** Embrace compensation, make choices poem-by-poem, and aim to create English poems that *feel* like her Portuguese ones felt – crafted, structured, musical, and resonant. The theoretical poles illuminate the extremes, but your path lies in the vital, difficult, and rewarding space between them.
