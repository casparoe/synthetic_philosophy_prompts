  We are building a decision tree to help readers identify their position on technology and politics, based on Langdon Winner's essay and related perspectives. The tree should start from a neutral entry question and branch through concrete cases, leading to leaves that represent distinct positions. The positions we want to cover are:

  1. Plain instrumentalism (artifacts are neutral; politics is in use and institutions)
  2. Social-constructionist views (politics is contingent on interpretation and social context; artifact itself doesn't settle)
  3. Winner-style political artifact theory (some artifacts genuinely embody political relations, either as flexible tools or as systems requiring certain forms of authority)
  4. Strong technological determinism (technology drives social change in a fixed, inevitable way)
  5. Substantivist views (e.g., Heidegger, Postman, Ellul: technology as an encompassing mode of revealing or culture, not about individual artifacts)

  We might also include critical-constructivist positions that split the difference, but we'll see if they emerge as distinct leaves.

  The branch nodes should be questions about concrete cases that divide the positions logically. We'll avoid jargon and keep case descriptions short. We'll also note any awkward commitments at the leaves and any gaps in the logical space.

  Let's outline the logical space:

  Key dimensions:
  1. Can an artifact's design features, by themselves, settle questions of power and access? (Yes/No)
  2. If yes, are these settlements necessary (cannot be avoided without changing the function) or contingent? (Necessary/Contingent)
  3. What is the relevant unit of analysis? (Individual artifact / Sociotechnical system / Entire technological culture)
  4. Is the politics fixed at creation or renegotiated in use? (Fixed / Renegotiated)

  We also need to consider:
  - Whether technology is seen as autonomous (driving social change) or as a tool that is controlled.
  - The extent to which the politics is inherent in the artifact or only in the social context.

  We'll design the tree so that each node asks a question about a concrete case. We'll aim for 7-10 nodes total.

