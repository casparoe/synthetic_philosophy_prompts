prompt: |-
  So my roommate runs these weird betting nights, and between that and a decision I've got to make about a friend's startup, I've realized I have no idea what my own policy on uncertainty actually is. Hoping you can find one, if it exists.

  Here's what I do. His setup: urn A has 50 red and 50 black balls, urn B has 100 red and black in some mix he won't reveal. Same $20 payout either way for drawing your color. I always pick urn A, and honestly I'd pick urn A if it paid $18 and B paid $20. But if he asks whether I'd bet on red or black from urn B itself, I genuinly don't care — feels like a coin flip either way. Go figure.

  Then the stuff I can't square with that. He has this prop bet where you roll dice from a bag where some are loaded and some aren't, and he won't say which — hard no, even at pretty generous odds. But my friend just asked me to put $3k into her seed round, where the odds are way more unknowable than any urn, and my gut says yes?? Also last year I bet my brother $50 on my own team making the playoffs and would do it again, but he offered me basically the same odds on some Croatian handball match and I wouldn't touch it.

  One more data point: I buy travel insurance for every flight. Known actuarial odds, negative expected value, I know, I still do it. But when my phone offered coverage for "unspecified data breaches affecting your identity" — total black box — I declined, and it kind of annoys me how easy that felt.

  I know the urn thing is basically the Ellsberg setup (roommate says I'm textbook), but whatever the textbook answer is, it doesn't seem to cover the startup and the handball. So what I want from you: is there one principle that gets all of this, or close? State it precisely enough that it makes a prediction, then tell me whether it says yes or no on the $3k, and which of my gut verdicts it can't save. And if my roommate could spring one case on me that would show which of two candidate principles I'm actually running — like, one bet where they give opposite answers — I want to hear about that bet specifically.
reasoning: |-
  Okay, let me start by unpacking this user's query. They're grappling with their own decision-making under uncertainty, and they've provided several examples that seem contradictory. The key examples include preferring urn A over urn B even with a lower payout, indifference to color choice in urn B, avoiding prop bets with unknown dice, considering a startup investment, betting on their own team but not on Croatian handball, buying travel insurance but rejecting phone data breach coverage.

  First, I recall the Ellsberg paradox mentioned. That explains the urn preference: ambiguity aversion. People prefer known risks (urn A) over unknown probabilities (urn B). The user's willingness to take a $2 payoff cut for urn A confirms this. Their indifference in choosing a color for urn B aligns with ambiguity aversion since both colors have the same uncertain probability.

  But then there are contradictions. The startup investment: they're considering putting $3k into a friend's seed round despite high uncertainty. Gut says yes, but ambiguity aversion would suggest avoidance. Need to reconcile this. Maybe factors like overconfidence in their judgment (since it's their friend) or the illusion of control? Also, personal stake in the startup's success could be different from a neutral bet.

  The sports bets: betting on their own team but not Croatian handball. Here, familiarity and perceived knowledge come into play. They might feel more informed about their team, reducing perceived ambiguity. Whereas Croatian handball is completely unknown, leading to avoidance. This ties into the competence hypothesis, where ambiguity aversion lessens when one feels competent.

  Travel insurance vs. data breach coverage: both involve known negative EV, but travel insurance is purchased while data breach isn't. The difference might be in the tangibility of the risk. Travel risks are concrete (flight delays, cancellations), while data breaches are abstract and vague. The black box nature of the data breach coverage increases ambiguity, leading to rejection despite similar EV considerations.

  Now, the user wants a unified principle. Ambiguity aversion covers many cases but not the startup or their team bet. So perhaps a combination of ambiguity aversion and the competence hypothesis? Or adding a factor for personal involvement. 

  Testing with a hypothetical bet: a domain where they feel competent versus one they don't. For example, investing in a familiar industry vs. an unfamiliar one. If they prefer the familiar one despite equal ambiguity, competence is key. Another test: a startup in their field vs. a friend's unrelated startup. If they choose their field, competence matters; if the friend's, trust or overconfidence is stronger.

  For the $3k startup, the principle suggests yes if competence or trust overrides ambiguity aversion. But the user's gut says yes, so it aligns if they feel competent or trust their friend. The travel insurance aligns with known risks, while data breach rejection fits ambiguity aversion. The handball rejection is pure ambiguity, but their team bet involves perceived competence.

  The unresolved part might be the startup decision. Why does ambiguity aversion not apply there? Possibly because the potential payoff and personal connection overshadow the uncertainty. The user might be applying a different heuristic for high-reward, personal investments versus neutral bets.

  So the refined principle: ambiguity aversion tempered by domain competence and perceived control. For the $3k, it predicts yes due to trust in friend and potential upside. The gut verdicts saved: urn choices, dice prop bet avoidance, insurance decisions. The Croatian handball rejection is also covered. The team bet fits due to perceived competence. 

  But the startup might still be a stretch. If the competence is illusory, it's a bias. The user needs to check if their startup yes is based on genuine knowledge or optimism. The test bet could be investing in a friend's startup in an unknown field vs. a stranger's in a known field. If they choose the friend, trust overrides competence; if the known field, competence wins. That distinguishes the drivers.
answer: |-
  Here's a unified principle explaining your behavior, incorporating Ellsberg but extending it to cover your other decisions:

  **Your Principle: Ambiguity Aversion Tempered by Domain Competence & Perceived Control (The "I Know What I Don't Know, But Sometimes I Think I Know" Principle)**

  **Precise Statement:** You are ambiguity-averse (preferring known probabilities over unknown ones), *unless* you perceive yourself to have domain-specific competence or sufficient control/influence over the outcome, in which case ambiguity aversion is significantly reduced or overridden. You also exhibit standard risk aversion for losses with known probabilities.

  **Predictions & Explanations of Your Gut Verdicts:**

  1.  **Urn A vs. Urn B:** Textbook Ellsberg. You prefer the known risk (Urn A, 50% red/black) over the ambiguous risk (Urn B, unknown mix). The $2 payoff cut confirms strong ambiguity aversion. **Principle: Supported.**
  2.  **Red or Black in Urn B:** Indifference is logical. The ambiguity is symmetric – you have no information favoring red or black. Choosing one doesn't resolve the ambiguity; it just accepts it. **Principle: Supported** (Ambiguity aversion applies to *choosing the source*, not the symmetric choice *within* the ambiguous source).
  3.  **Dice Prop Bet:** Hard no. Extreme ambiguity (unknown number of loaded dice, unknown loading) overwhelms any potential odds. High perceived lack of competence/control. Pure ambiguity aversion dominates. **Principle: Supported.**
  4.  **Croatian Handball Bet:** Hard no. You lack any domain knowledge (competence) and have zero control/influence. Ambiguity aversion dominates completely. **Principle: Supported.**
  5.  **Betting on Your Own Team:** Yes. You perceive high competence (you follow the team closely) and *feel* control/influence (identification, emotional investment, belief your insight gives an edge, even if illusory). This reduces ambiguity aversion significantly. The specific odds ($50) likely felt fair based on *your* perceived knowledge. **Principle: Supported.**
  6.  **Travel Insurance:** Yes. Known probability (actuarial odds), negative EV, but known probability *of a significant loss*. This triggers **standard loss aversion/risk aversion**, not ambiguity aversion. You know the odds are bad, but you pay to avoid the potentially large, certain-probability loss. **Principle: Supported** (Shows risk aversion for known-probability losses is separate from ambiguity aversion).
  7.  **Data Breach Coverage:** No. Extreme ambiguity ("unspecified data breaches", "black box"). Lack of competence in assessing the real risk or the value of the coverage. Pure ambiguity aversion dominates, making refusal easy despite the potential loss. **Principle: Supported.** (Contrast with travel insurance: travel risks feel more concrete, probabilities better understood, triggering loss aversion instead).
  8.  **Friend's Startup ($3k):** **Principle Predicts: YES.** Why?
      *   **Perceived Competence:** It's your *friend's* startup. You likely feel you understand *her* capabilities, the basic idea, or the market better than a random ambiguous bet (Urn B, Dice, Handball). You trust *her judgment*.
      *   **Perceived Control/Influence:** Investing creates a relationship. You might feel your advice, network, or mere support can positively influence the outcome (similar to betting on your team).
      *   **Reduced Ambiguity Aversion:** The perceived competence/influence overrides your typical aversion to the massive *true* ambiguity. The potential upside (emotional and financial) also plays a role, facilitated by this reduced aversion. The ambiguity is high, but your connection makes it feel less "unknown" or more "knowable through your friend."

  **The Gut Verdict the Principle CAN'T Fully Save (The Tension):**

  *   **Startup Investment:** The principle *predicts* your Yes and explains *why* you feel that way. However, this is the point where the principle highlights a **potential bias or inconsistency** in your risk assessment. The *actual* ambiguity in a seed-stage startup is astronomically higher than Urn B or even the dice. Your perceived competence/control is likely vastly overestimated compared to the true uncertainty. The principle explains your gut, but rationally, this decision seems *most* inconsistent with your strong aversion to lesser ambiguities (Urn B, data breach). It relies heavily on the emotional/perceived factors overriding core ambiguity aversion.

  **The Test Bet for Your Roommate (Competence vs. Pure Ambiguity):**

  Here's a bet designed to pit Ambiguity Aversion against Perceived Competence:

  **Scenario:** Your roommate offers two bets on the outcome of a specific, niche video game tournament happening next week:

  1.  **Bet A (Pure Ambiguity):** Bet on whether Team X wins the tournament. You know *nothing* about this game, the teams, or the scene. Roommate provides zero information beyond the team names and the fact it's a major tournament. Odds are exactly even money ($20 to win $20).
  2.  **Bet B (Perceived Competence):** Bet on whether Player Y (a specific, well-known pro player) wins his *first match*. However, the game uses a complex character-drafting system. The actual matchup (characters picked) and map won't be known until 5 minutes before the match starts, making the *true* odds highly ambiguous and volatile. Roommate gives you a 30-minute crash course on Player Y's strengths, the game mechanics, and common strategies. You walk away feeling you have a *decent grasp*. Odds are also exactly even money ($20 to win $20).

  **Why this tests the principles:**

  *   **Bet A:** Pure, unmitigated ambiguity (like Urn B, Handball). Strong ambiguity aversion predicts you **decline**.
  *   **Bet B:** High true ambiguity (matchup unknown until the last minute). However, the crash course is designed to induce **perceived competence**. If your principle holds, this perceived understanding should *reduce* ambiguity aversion enough for you to **accept** Bet B despite the high actual uncertainty, similar to your own team or the startup.
  *   **Opposite Predictions:** Pure Ambiguity Aversion predicts declining *both* (high ambiguity). Your Competence-Tempered Ambiguity Aversion predicts declining Bet A but accepting Bet B.

  **Your Prediction:** Based on your history (startup, own team bet), the Competence-Tempered principle predicts you would **accept Bet B** while declining Bet A. If you decline *both*, it suggests pure Ambiguity Aversion dominates even when competence is induced. If you accept *both*, it weakens the competence aspect significantly.

  **In Summary:** Your core driver is **ambiguity aversion**, powerfully tempered by **perceived competence and control**. This explains your Urn choices, dice/handball avoidance, data breach rejection, and even your travel insurance (known-probability loss aversion). It strongly predicts your Yes on the startup ($3k) and your own-team bet, *because* the perceived competence/control reduces the sting of the ambiguity. The startup decision is the most tension-filled, as the true ambiguity is immense, but the principle explains why your gut overrides it. The test bet isolates the competence factor against pure ambiguity. Ask your roommate to run it!
