  The real patterns defense is strong: belief attributions let us predict behavior efficiently when lower-level descriptions are unmanageable. The chess engine's "expectation" isn't just rhetoric; it's a pattern observable in its moves. But the user's undercutting worry has merit too—once you know the design (evaluation function), intentional talk feels derivative. Still, Dennett would say the design stance itself relies on intentionality; we describe the system as "optimized for winning," which smuggles in goals. That's a key point the user might be overlooking.

  The practical unmanageability of physical-level descriptions does carry philosophical weight for Dennett. If a pattern is predictively indispensable, it's real—full stop. Demanding strict indispensability (only if no other description works) sets the bar too high. Even centers of gravity are reducible but irreplaceable for certain predictions. 

  Where does that leave us? The intentional stance is irreducible for systems where: (1) behavior is too complex for design-stance granularity (we might not know the exact optimization process), or (2) the system dynamically adapts in ways that make design specs insufficient. Modern AI fits both—we don't fully grasp their "design" due to emergent complexity, and they react to novel inputs. A chess engine's expectation is a real pattern because compressing its evaluation function into "expects attack to fail" captures a predictive regularity nothing else summarizes as elegantly. 

  Verdict: The intentional stance is genuinely irreducible, not just convenient shorthand. But I’ll clarify it’s irreducible as an explanatory strategy—not as proof of inner experience. The user’s indispensability test is too strict; practical indispensability suffices for reality under Dennett’s view. For their chess example, the design stance doesn’t "contain" the intentional description; they’re complementary grains. Knowing the evaluation function doesn’t make belief-attribution redundant—it just shifts the intentional idiom to a higher level (e.g., "optimized for winning" is itself intentional). 

