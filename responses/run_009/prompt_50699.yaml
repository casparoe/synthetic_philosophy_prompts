  ### RFC-2024-004: VERITAS (FACT-TAGGER) Architecture Evolution and Deprecation of Analytic Claim Classification  
  **Authors:** Infrastructure Integrity Team  
  **Status:** Proposed  
  **Replaces:** RFC-2023-019 (VERITAS v0.9 Initial Design)  

  ---

  #### 1. Introduction  
  VERITAS (FACT-TAGGER v0.9) was launched in Q1 2024 to optimize content-validation costs by classifying claims in product copy, documentation, and changelogs into two categories:  
  - **ANALYTIC**: True by definition; resolved via static dictionary lookups (zero runtime cost, 0ms latency).  
  - **SYNTHETIC**: Requires real-time verification against external sources (e.g., API calls, DB checks; avg. 120ms latency).  

  The system aimed to reduce operational expenses by 30% by minimizing synthetic verifications. This RFC documents architectural challenges, incident learnings, and a proposed v2 redesign deprecating the ANALYTIC classification.  

  ---

  #### 2. VERITAS v0.9 Design Summary  
  - **Dictionary Service**: YAML-based term definitions (e.g., `"premium_tier": { synonyms: ["enterprise_grade"], antonyms: ["free_tier"] }`).  
  - **Tagging Pipeline**:  
    1. Sentence scanned for claim patterns (e.g., "X is Y").  
    2. Dictionary lookup: If all terms resolve definitionally → **ANALYTIC**.  
    3. Else → **SYNTHETIC** + runtime verification.  
  - **SLOs**:  
    - ANALYTIC: 99.99% availability, 0ms latency.  
    - SYNTHETIC: 99.0% availability, 200ms p95 latency.  
  - **Validation**: Daily CI job ensuring dictionary consistency (no conflicting terms).  

  ---

  #### 3. Incident Postmortem #1: Circular Validation Failure (2024-03-15)  
  - **Impact**: Global dictionary freeze for 8hr; blocked marketing release.  
  - **Root Cause**: Validation job triggered by dictionary update `#D-881` relied on the claim "Dictionary terms are mutually consistent" tagged **ANALYTIC** via self-reference. When `#D-881` added the term `"consistent": { requires: ["non_contradiction"] }`, the validation job recursively invoked itself, exhausting resources.  
  - **Fix**: Hotfix to exempt validation logic from dictionary dependencies.  
  - **Lesson**: Definitional pipelines cannot self-validate without introducing circularity.  

  ---

  #### 4. Incident Postmortem #2: Synonymy Cascade (2024-04-22)  
  - **Impact**: 100% SYNTHETIC fallback; paged 12 engineers (all on-call rotations).  
  - **Root Cause**: Synonym resolution for "data_secure" → "FIPS_compliant" required the Meaning Service (ML-driven term equivalence). The Meaning Service’s status dashboard ("Operational: true") was tagged **ANALYTIC**, but its training data relied on VERITAS output. When VERITAS latency spiked, the Meaning Service marked itself **SYNTHETIC**, creating a dependency deadlock.  
  - **Fix**: Implemented static synonym fallback lists (manual curation).  
  - **Lesson**: Holistic dependencies prevent isolated failure containment.  

  ---

  #### 5. Legal Workaround and Dictionary Entropy  
  - **Issue**: Legal team embedded synthetic claims in dictionary to avoid verification costs (e.g., `"patent_pending": { definition: "IP_verified" }` after external checks were deemed expensive).  
  - **Consequence**: Customer escalation when "patent_pending" claims failed third-party audits. Dictionary entropy rose 40% QoQ as teams added "definitional" overrides.  
  - **Mitigation**: Schema validation to block empirical assertions (e.g., `"fastest: { requires_external_validation: true }`). Overridden in 70% of cases via "linguistic emergency" exceptions.  

  ---

  #### 6. VERITAS v2 Proposal: Deprecating ANALYTIC Classification  
  - **Problem**: The ANALYTIC/SYNTHETIC distinction is operationally unstable. All claims exhibit revision risk under edge cases.  
  - **Key Findings**:  
    - **Blast Radius Correlation**: ANALYTIC claims are not intrinsically "safe." They represent high-fanout nodes in the dependency graph (e.g., changing `"user"` definition invalidated 12K historical changelogs).  
    - **Cost of Rigidity**: Maintaining "pure" definitional claims requires unsustainable validation overhead.  
  - **v2 Architecture**:  
    - **Single Pipeline**: All claims processed as **SYNTHETIC** with layered caching.  
    - **Blast Radius Index (BRI)**: Replaces ANALYTIC tag. Computed via dependency graph traversal (e.g., `BRI = (downstream_services × term_references) / revision_frequency`).  
    - **Stability Tiers**:  
      - **Tier 0 (BRI > 8.0)**: Replication across 3 zones; 24hr cache TTL.  
      - **Tier 1 (BRI < 2.0)**: Real-time verification; 5min cache TTL.  
  - **Deprecation Timeline**:  
    - Month 1–3: Shadow mode (dual tagging).  
    - Month 4: ANALYTIC tag disabled; dictionary converted to Tier 0 cache.  
    - Month 6: Dictionary YAML retired; migrate to GraphDB.  

  ---

  #### 7. Migration Appendix  
  - **SLO Updates**:  
    - Tier 0: 99.95% availability, 5ms p95 latency.  
    - Tier 1: 99.0% availability, 150ms p95 latency.  
  - **Risk Mitigation**:  
    - Scale verification fleet 3x to handle cache misses.  
    - Automated BRI recalibration on dictionary updates.  
  - **Cost Impact**: Expected net savings of 15% after eliminating circular-validation overhead.  

  ---

  #### 8. Next Steps  
  - Draft Blast Radius Index specification (RFC-Q2).  
  - Investigate incremental graph partitioning to reduce BRI volatility.  
  - **Q3 Initiative**: Revisit boundary between Tier 0/1 claims to optimize verification cost vs. revision risk.  

  ---  
  **Approvals:**  
  - @eng-lead, @product, @legal-compliance (pending cost review)  

  ---  
  *RFC-2024-004 closes all open issues for VERITAS. The ANALYTIC paradigm served as a useful heuristic but no longer reflects operational reality.*  

  ### Design Notes (Word Count: 698)  
  - **Quine Parallels**:  
    - Circular validation → Circularity of meaning in definitions.  
    - Holistic paging → Web of belief holism.  
    - Legal workarounds → Entanglement of fact/language.  
    - Blast Radius Index → Pragmatic revisability under duress.  
  - **Engineering Plausibility**:  
    - SLOs, schema validation, and cache tiers mirror real systems.  
    - Deprecation timeline standard for tech migrations.  
  - **Vibe Check**:  
    - Philosophers: Chuckle at "dictionary entropy" or "linguistic emergencies."  
    - Engineers: Nod grimly at "paged entire on-call" and "Q3 Initiative."
