  We are writing an RFC (Request for Comments) in the style of an internal engineering document at a mid-size SaaS company. The document is about a microservice called VERITAS (or FACT-TAGGER) that classifies sentences as either ANALYTIC (true by definition) or SYNTHETIC (requires runtime verification). The joke is that the system's evolution mirrors the breakdown of the analytic-synthetic distinction as described in Quine's "Two Dogmas of Empiricism", but we never mention philosophy. The document should be in a deadpan corporate engineering voice and should be plausible as a real RFC.

  Key elements to incorporate:
  1. The initial design (v0.9) has a simple premise: ANALYTIC claims are resolved by a dictionary config without external lookups, SYNTHETIC require runtime checks.
  2. Problems start to emerge: 
     - Circular dependencies in the dictionary validation (the dictionary is validated by the same system it configures).
     - Synonymy checks require a "meaning" service that itself depends on the tagging.
     - Legal department sneaking facts into dictionary entries to avoid runtime verification costs.
     - Incidents requiring the entire on-call rotation because of the interconnectedness (holism) and the inability to trace a claim to one event.
     - An attempt to decompose claims into raw experience events (sense-data) is cancelled mid-quarter.
  3. The system evolves to v2 where the ANALYTIC tag is deprecated because it's just a label for claims with a high blast radius when changed.
  4. The document must be about 700 words, in numbered sections, with realistic engineering details (SLOs, config validation, deprecation timelines, migration plans).
  5. The humor must come from the parallels to Quine without explicit references. Engineers who know Quine should recognize the parallels (circularity, holism, revisability, pragmatic tradeoffs). Others should see it as a plausible engineering horror story.

  Outline of the RFC:

  1. Introduction and Motivation
     - Why we built VERITAS: to improve content trustworthiness by tagging claims as ANALYTIC (definitional, no cost) or SYNTHETIC (requires verification, cost).
     - Business benefits: cost savings on expensive verification for ANALYTIC claims, faster resolution, and better SLOs.

  2. VERITAS v0.9 Design
     - Architecture: 
       - Dictionary service (YAML config) that defines terms and their relationships (synonyms, antonyms, etc.). ANALYTIC claims are matched against the dictionary.
       - Runtime verification service for SYNTHETIC claims (calls to external fact-checking APIs, databases, etc.).
     - SLOs: 99.9% availability for ANALYTIC lookups (since it's just a config), 99% for SYNTHETIC (due to external dependencies).
     - Initial config validation: a separate validation job that runs when the dictionary is updated, ensuring no contradictions.

  3. Incident Postmortem: Circular Validation (v0.9.1)
     - Incident: A dictionary update caused a validation failure because the validation job itself relied on an ANALYTIC claim that was being updated.
     - Root cause: The validation job uses the same dictionary to validate the dictionary (circular dependency). 
     - Fix: Temporary removal of the circular claim, but note that the circularity is inherent in the design.

  4. Incident Postmortem: The Synonymy Problem (v0.9.3)
     - Incident: The service started tagging all claims as SYNTHETIC because the synonymy check (to see if two terms are interchangeable) required a "meaning" service that was down. But the meaning service depended on VERITAS to tag its own status messages.
     - Root cause: The meaning service (which uses machine learning to determine semantic equivalence) was designed to use ANALYTIC tags for its own operational claims. When VERITAS went down, the meaning service couldn't function, and without the meaning service, VERITAS couldn't resolve synonyms for the dictionary.
     - Impact: Paged entire on-call rotation because the failure propagated across multiple services (holism).
     - Fix: Added a circuit breaker to fall back to a static synonym list, but this list is maintained by hand and prone to drift.

  5. Legal Department Workaround (v0.9.5)
     - Problem: Legal team started adding factual assertions to the dictionary as "definitions" to avoid the cost and latency of SYNTHETIC checks. Example: adding "Our product is the fastest" as an ANALYTIC claim by defining "fastest" in a way that matches the product.
     - This led to customer complaints when the claim was challenged and found to be false. The dictionary became bloated with "definitions" that were actually synthetic.
     - Attempted solution: A new rule that dictionary entries must be purely linguistic (no empirical claims). However, the boundary became impossible to police because even simple terms (like "fast") have empirical implications.

  6. VERITAS v2 Proposal: Deprecating ANALYTIC
     - After multiple incidents and operational overhead, we propose to deprecate the ANALYTIC tag.
     - Findings:
       - The distinction between ANALYTIC and SYNTHETIC is not absolute but a matter of operational risk and dependency.
       - ANALYTIC claims are simply those that, if revised, would require changes to a large portion of the dictionary and dependent services (high blast radius).
       - The dictionary itself is now a mix of linguistic and factual claims, and the validation pipeline is too complex to maintain.
     - New design: All claims are treated as SYNTHETIC (require verification). However, we introduce a caching layer for claims that are considered "stable" (low cost, high reuse). The cache is invalidated when the dictionary changes or by TTL.
     - The old ANALYTIC tag will be replaced by a BLAST_RADIUS metric (calculated by the dependency graph) and a STABILITY index (based on revision history and cache hit rate).
     - Deprecation timeline: 6 months to migrate all consumers to the new model.

  7. Migration Plan and Appendix
     - Step-by-step migration: Consumers will be updated to use the new SYNTHETIC-only API. The dictionary will be converted into a cache of pre-verified claims.
     - Risks: Increased load on verification services. Mitigation: Scale up the verification cluster and use the cache aggressively.
     - Monitoring: New dashboards for BLAST_RADIUS and STABILITY.

  8. Next Steps
     - Revisit the boundary between cached and runtime-verified claims in Q3 (knowing it will never happen).

