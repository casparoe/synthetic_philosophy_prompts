  ### Decision Tree: Moral Testimony Positions

  **Design Notes:**  
  - **Branch Questions:** Concrete cases only; positions revealed only at leaves.  
  - **Key Aspects Covered:**  
    (i) Epistemic vs. moral problem (or both).  
    (ii) Belief-formation vs. action-guidance worries.  
    (iii) Generalization to aesthetics/fittingness.  
    (iv) Emotion deference case (placed under moral/action concerns; sorts imperfectly but included).  
  - **Commitments:** No neutrality—placements argued below.  
  - **Leaf Labels:** Named positions or "unnamed"; one-sentence awkward commitment.  
  - **Unexplored/Incoherent Combinations:** Diagnosed at end.  

  ---

  #### **Start**

  **Case 1: The Tipping Custom**  
  You’re in a foreign country. A trusted local tells you tipping is morally wrong here. You believe them and don’t tip. *Assume they’re correct.*  
  → **Question A:** Is there a *problem* beyond the risk of error (e.g., even if right, is something missing)?  
  - **YES** → Go to Case 2.  
  - **NO** → Go to Case 5.  

  ---

  #### **Branch A: Problem Exists (YES to Case 1)**  
  **Case 2: Charity Donation**  
  A moral expert tells you donating to Charity X is obligatory. You believe them and donate.  
  → **Question B:** Can you gain *moral knowledge/justification* from their testimony?  
  - **NO (cannot know/justify belief)** → Go to Case 3.  
  - **YES (can know/justify belief)** → Go to Case 4.  

  **Case 3: Aesthetic Judgment**  
  An art critic tells you a painting is beautiful. You believe them solely on their say-so.  
  → **Question C:** Can you gain *aesthetic knowledge/justification* from their testimony?  
  - **NO** → **Leaf 1: General Testimonial Pessimism**  
    - *Awkward commitment:* Must explain why *all* normative domains (moral/aesthetic/fittingness) resist testimony when empirical ones don’t.  
  - **YES** → **Leaf 2: Moral-Specific Epistemic Pessimism**  
    - *Awkward commitment:* Why can aesthetics defer but morality can’t, given both are normative?  

  **Case 4: Keeping a Promise**  
  An expert says you must keep a promise. You believe them and do so *without personal reflection*.  
  → **Question D:** Is the problem primarily with *acting* on the belief (not forming it)?  
  - **YES** → Go to Case 6.  
  - **NO** → **Leaf 3: Moral Deference as Belief Deficiency**  
    - *Awkward commitment:* Claims it’s intrinsically objectionable to form moral beliefs via testimony, even if action aligns.  

  ---

  #### **Branch B: No Problem (NO to Case 1)**  
  **Case 5: Weather Report**  
  A meteorologist says it will rain. You believe them and take an umbrella.  
  → **Question E:** Is moral deference (Case 1) *epistemically identical* to this?  
  - **YES** → Go to Case 7.  
  - **NO** → **Leaf 4: Hybrid Pessimism**  
    - *Awkward commitment:* Moral deference isn’t epistemically worse, yet something non-epistemic (e.g., "lack of concern") makes it defective.  

  ---

  #### **Branch C: Action-Guidance Focus (YES to Case 4D)**  
  **Case 6: Interior Design**  
  An expert says you *should* paint your walls blue. You do so *solely* because they said so.  
  → **Question F:** Is there a problem here akin to moral deference?  
  - **YES** → Go to Case 8.  
  - **NO** → **Leaf 5: Moral-Specific Action Pessimism**  
    - *Awkward commitment:* Why can you defer in aesthetics/prudence but not morality at the point of action?  

  **Case 8: Feeling Betrayed**  
  A friend says you *should* feel betrayed by someone’s actions. You don’t feel it but try to cultivate anger because they said so.  
  → **Question G:** Is there a problem with deferring on what to *feel*?  
  - **YES** → **Leaf 6: General Normative Non-Transferability**  
    - *Awkward commitment:* Personal understanding is required for *any* normative action/emotion, making deference universally defective.  
  - **NO** → **Leaf 7: Action-Emotion Asymmetry**  
    - *Awkward commitment:* Why deferring on emotions is exempt from deference problems when actions aren’t.  

  ---

  #### **Branch D: Optimism (YES to Case 5E)**  
  **Case 7: Fittingness of Anger**  
  An expert says anger is *fitting* for a situation. You adopt this view without reflection.  
  → **Question H:** Is this deference *epistemically/morally identical* to moral testimony?  
  - **YES** → **Leaf 8: Global Testimonial Optimism**  
    - *Awkward commitment:* Must dismiss intuitions that moral deference feels "colder" or "less engaged" than empirical deference.  
  - **NO** → **Leaf 9: Aesthetic/Moral Asymmetry**  
    - *Awkward commitment:* Claims fittingness/aesthetics deference works, but moral doesn’t—despite both being normative.  

  ---

  ### Diagnostics  
  1. **Unseparated Positions:**  
     - **Leaf 6 (General Normative Non-Transferability)** and **Leaf 3 (Moral Deference as Belief Deficiency)** both reject deference, but the tree prioritizes action-guidance (Case 4D) to split them.  
     - *Why:* Focus on action isolates whether the defect is in *using* testimony practically.  

  2. **Unexplored/Incoherent Combinations:**  
     - **"Testimony justifies belief but not action" without a moral defect:** Incoherent. If testimony provides knowledge, acting on it *should* be rational (barring additional reasons). The tree routes this to **Leaf 5** or **Leaf 6**, implying a moral/non-epistemic defect.  
     - **"Emotion deference is uniquely problematic"**: Unexplored. The tree forces emotion cases to generalize (Case 8G) due to under-theorization.  
     - **"Moral deference is epistemically fine, but only aesthetics has an action problem"**: Unattractive. No one holds this—it arbitrarily privileges morality. The tree routes aesthetic action concerns to **Leaf 6** or **Leaf 7**.  

  3. **Placement Calls:**  
     - **Emotion Case (Case 8):** Placed under action-guidance (**Branch C**) because deferring on emotions involves *guidance* (what to feel/do), not just belief. Tempted to put it under epistemic belief, but emotions aren’t purely doxastic.  
     - **Hybrid Pessimism (Leaf 4):** Position exists (e.g., "moral worth" views), so tree isolates it early via Case 5.  

  ---

  ### Tree Summary (8+ Leaves)  
  | Leaf | Position | Awkward Commitment |  
  |------|----------|---------------------|  
  | 1 | **General Testimonial Pessimism** | Normative truths universally resist testimony. |  
  | 2 | **Moral-Specific Epistemic Pessimism** | Morality is uniquely testimony-resistant. |  
  | 3 | **Moral Deference as Belief Deficiency** | Forming moral beliefs via testimony is intrinsically wrong. |  
  | 4 | **Hybrid Pessimism** | Moral deference is epistemically sound but still defective. |  
  | 5 | **Moral-Specific Action Pessimism** | Acting on moral testimony is uniquely objectionable. |  
  | 6 | **General Normative Non-Transferability** | Personal understanding required for all normative action/emotion. |  
  | 7 | **Action-Emotion Asymmetry** | Emotion deference is exempt from action’s requirements. |  
  | 8 | **Global Testimonial Optimism** | All deference (moral/aesthetic/emotional) is epistemically/morally fine. |  
  | 9 | **Aesthetic/Moral Asymmetry** | Aesthetic/fittingness deference works; moral doesn’t. |
