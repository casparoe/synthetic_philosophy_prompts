  First, I need to help them formulate a precise research question. The user mentioned two possibilities: either the economic theory is an application of idealism, or the two are unrelated. I should make sure the question clearly distinguishes these. The rival reading would be the traditional view that these are separate projects. I need to outline what that view gets right—like Berkeley not explicitly linking them—and where it might fail, perhaps in ignoring structural parallels.

  Next, method. How can they test their hypothesis? They need to identify what features in Berkeley's monetary theory would only be there if idealism were at work. For example, does he emphasize perception and collective agreement in value similarly to his views on objects? Also, they should check if Berkeley uses similar philosophical terms in both contexts. They should also look for disconfirming evidence, like instances where he discusses value in material terms or separates his economic advice from his philosophy.

  The user is concerned about scope. A 6000-word paper in one semester might be tight. I should suggest focusing on "The Querist" and key philosophical texts, avoiding deep dives into historical context or later interpretations. They need a clear thesis and structured argument without getting lost in tangential details.

