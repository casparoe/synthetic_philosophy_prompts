prompt: |-
  I do compliance review at a mid-sized UK charity and I keep having to sign off on fundraising copy with no real framework. The sort of stuff that crosses my desk: urgency deadlines (give before midnight and it gets matched), guilt-heavy stories, "most people in your area give £20" social proof lines, pre-selected monthly amounts on the donation form. A trustee recently read something about manipulation being influence that works by bypassing your deliberation rather than through it, and now wants a proper rulebook — but honestly none of us can say where persuasion stops and manipulation starts. Can you turn whatever philosophy actually has to say about this into a procedure my reviewers can follow? They're not philosophers and get maybe ten minutes per piece of copy, so I need: the questions to ask in order, what counts as a sufficient answer to each, where the procedure returns a firm "this crosses the line", and where it just hands off to a person because it's a values call. Then run it on three cases: an emergency appeal saying children will die this week unless we raise X by Friday; a "people in your postcode give £10 on average" line where the average is real but the postcode bit is invented; and a donation form that comes with "give monthly" already ticked. Include one case where the procedure gives an answer our fundraisers won't like, and be honest about which steps are just judgement dressed up as a checklist.
reasoning: |-
  Okay, the user works in compliance for a UK charity and needs a practical framework to distinguish ethical persuasion from manipulation in fundraising. They're dealing with urgency tactics, guilt appeals, social proof, and pre-ticked options. A trustee raised concerns about manipulation bypassing rational thought, and now they need a clear procedure for reviewers who aren't philosophers and have limited time.

  The user's explicit request is a step-by-step procedure with questions, decision thresholds, and application to three cases. But digging deeper, they likely need: 1) Philosophical rigor made actionable (not academic), 2) Defense against future trustee challenges, 3) Protection from reputational risk, 4) Balance between ethics and fundraising realities, and 5) Tools to push back on aggressive fundraisers.

  The key philosophical anchors here are autonomy (Kant), consent (Nudging theory), and welfare (Mill). The procedure must translate these into binary checks and judgment calls. For speed, it should cascade from clear violations to grayer areas, with flags for human judgment when philosophy can't give clean answers.

  For the three test cases: The child death appeal passes if facts are verified but needs "values call" on emotional weight. The fake postcode social proof clearly fails the evidence check. The pre-ticked monthly option triggers autonomy alarms but could be salvaged by prominence - classic "judgment dressed as checklist" territory.

  The hardest tradeoff is building in "fundraisers won't like" outcomes (like rejecting fake social proof) while keeping the framework usable. That's why Step 4 explicitly calls out when reviewers must make values-based calls - no pretending philosophy solves everything. The postcode example is deliberately chosen as the "unpopular but defensible" rejection case.

  Notably, the procedure forces evidence demands upfront (Step 1) because fabricated urgency is the quickest way to manipulation. It leaves emotional appeals for last because they're unavoidably subjective - here the checklist merely ensures deliberation isn't bypassed entirely. The pre-ticked box case exposes the limits: philosophy says it's coercive (autonomy violation), but industry practice might accept it with mitigations. Hence the "judgment" label.

  For implementation, I'll emphasize the UK fundraising regulator's standards as a backstop. And stress that "deliberation not bypassed" is the north star - if a tactic relies on shutting down thought, it's manipulative regardless of intent.
answer: |-
  Here's a practical, philosophy-rooted procedure for your reviewers, designed for speed and clarity. It focuses on **bypassed deliberation** (the trustee's concern) and **autonomy**, drawing primarily on Kantian ethics (treating donors as ends, not just means) and informed consent principles.

  **The "Deliberation & Autonomy" Review Checklist (10-Minute Version):**

  Ask these questions **in order**. Stop and flag if any answer is "No" or "Unclear". "Yes" must be substantiated.

  1.  **TRUTH & EVIDENCE:** Is every *factual* claim demonstrably true *and* presented without misleading omission? *(Sufficient: Verifiable source/docs immediately available. Crosses line if false/invented/unverifiable).*
  2.  **TRANSPARENCY OF TACTIC:** Is the *persuasive mechanism itself* obvious to a reasonable donor? (e.g., "matched funding deadline," "social proof," "suggested amount"). *(Sufficient: Mechanism is named or easily inferred. Crosses line if mechanism is hidden or deceptive).*
  3.  **RELEVANT CHOICE:** Does the copy present a *meaningful choice* reflecting the donor's values/means? Are alternatives visible? *(Sufficient: Clear options (e.g., one-off/monthly, amounts, opt-outs). Crosses line if choice is illusory or critical options hidden).*
  4.  **PRESSURE ASSESSMENT:** Does the primary *motivation* offered appeal to deliberation (values, impact, reason) OR bypass it (overwhelming urgency, guilt, fear, manufactured scarcity)? *(Sufficient: Focus on impact/values > fear/guilt; urgency is genuine & proportional. Values Call: High guilt/fear needs justification vs. genuine crisis).*
  5.  **CONTROL & DEFAULT:** Does the donor *actively affirm* their choice? (Especially for commitments like recurring gifts). *(Sufficient: Active opt-in required for significant commitments. Crosses line if defaults pre-select commitments or hide opt-outs).*

  **Decision Path:**
  *   **"No" to 1, 2, 3, or 5:** **Flag as "Manipulative - Do Not Use"**. Requires fundamental rewrite.
  *   **"Unclear" on 1 (Evidence):** **"Hold - Evidence Required"**.
  *   **"Values Call" on 4 (Pressure):** **"Escalate for Values Review"** (Compliance Lead/Trustee). Needs senior judgment on proportionality/context.
  *   **All "Yes":** **"Approved - Ethically Persuasive"**.

  **Key Philosophy Translated:**
  *   **Bypassed Deliberation (Trustee's Concern):** Happens when tactics exploit instinct/emotion *without engaging reason* (e.g., hidden mechanisms, manufactured urgency, overwhelming guilt). Kant would see this as treating the donor as a mere means.
  *   **Autonomy:** Requires truth (informed consent), transparency (understanding the "why" of the ask), and genuine choice (Mill's harm principle + Kantian respect).
  *   **Manipulation vs. Persuasion:** Manipulation subverts rational choice; persuasion appeals to it.

  ---

  **Applying the Procedure to Your Cases:**

  **Case 1: Emergency Appeal - "Children will die this week unless we raise X by Friday"**
  *   **1. Truth & Evidence:** *Crucial.* Is there a *specific, verifiable* crisis (e.g., imminent closure of a feeding program, vaccine window)? Is "die this week" a *direct, probable* consequence of missing X? **Requires documented evidence of the specific link/timeline.** *(Hold if unclear evidence, Cross line if invented/exaggerated)*.
  *   **2. Transparency of Tactic:** Mechanism is clear: extreme urgency/scarcity. **Yes**.
  *   **3. Relevant Choice:** Choice to give/not give is clear. **Yes**.
  *   **4. Pressure Assessment:** *Values Call.* Uses high fear/urgency. Is the level of fear *proportional* to the *verified* immediacy and severity? Is there any appeal to values/reason beyond pure fear? **Likely needs Escalate for Values Review** (justifying the severity of language against the verified facts).
  *   **5. Control & Default:** Active donation required. **Yes**.
  *   **VERDICT:** **Hold (pending evidence)** or **Escalate for Values Review (if evidence solid but language extreme)**. *Not an automatic "Cross Line" if truth and proportionality hold, but high scrutiny is essential.* Philosophy says extreme fear *can* bypass deliberation, but genuine, immediate existential threat *is* a rational reason to act urgently.

  **Case 2: "People in your postcode give £10 on average" (Average real, postcode invented)**
  *   **1. Truth & Evidence:** **NO.** The specific claim "in *your* postcode" is false/invented. The *overall* average is irrelevant to this claim.
  *   **2. Transparency of Tactic:** Social proof mechanism is somewhat clear. *But irrelevant due to Step 1 failure.*
  *   **3. Relevant Choice:** Choice exists. *Irrelevant due to Step 1 failure.*
  *   **4. Pressure Assessment:** *Irrelevant due to Step 1 failure.*
  *   **5. Control & Default:** **Yes**.
  *   **VERDICT:** **FLAG AS MANIPULATIVE - DO NOT USE.** Clear failure of Truth & Evidence. This is deceptive fabrication designed to manipulate via false social proof, directly bypassing deliberation (donor thinks neighbors are doing it). *This is the answer fundraisers won't like.* Philosophy sees this as a lie, violating autonomy and informed consent.

  **Case 3: Donation Form - "Give Monthly" Pre-Ticked**
  *   **1. Truth & Evidence:** N/A (No factual claim about the tick box itself).
  *   **2. Transparency of Tactic:** The *mechanism* (default option) is visible but *not transparent*. Is it obvious it's pre-selected *and* easy to change? Needs prominent visual cue.
  *   **3. Relevant Choice:** The *options* exist (one-off/monthly), but the *default* heavily influences choice. Is the one-off option equally prominent/easy? **Unclear/Borderline No.** The pre-tick significantly steers.
  *   **4. Pressure Assessment:** Low direct pressure, but uses inertia/default effect. **Yes** (as a known tactic).
  *   **5. Control & Default:** **NO.** The donor is *not* actively affirming the recurring choice; it's presented as the path of least resistance. Requires *active* opt-in for commitments (like recurring payments) to respect autonomy.
  *   **VERDICT:** **FLAG AS MANIPULATIVE - DO NOT USE.** Clear failure of **Control & Default (Step 5)**. Pre-selecting a commitment bypasses deliberation by exploiting inertia. Changing to an *unchecked* box or requiring a *positive action* to select monthly is essential. (A pre-ticked "one-off" with an *active choice* for monthly might pass Step 5).

  **Where Judgment is Dressed as Checklist (Be Honest Here!):**

  *   **Step 4 (Pressure Assessment):** This is inherently subjective. The checklist forces the question ("Is it primarily fear/guilt?") and demands justification ("Is it proportional?"), but the *final call* on proportionality in a crisis (Case 1) **is a values judgment.** The checklist ensures the question is asked rigorously and escalated, but doesn't eliminate the need for human judgment in close cases.
  *   **Step 3 (Relevant Choice) - Prominence/Salience:** The checklist asks if alternatives exist and are visible. Determining if they are *sufficiently* prominent/salient to constitute a "meaningful choice" (especially vs. a strong default like Case 3) **involves judgment.** The checklist flags potential issues but can't definitively quantify "sufficiently prominent."

  **Implementation Tips:**

  1.  **Evidence Log:** Mandate a simple evidence log for Step 1 claims (source/doc reference).
  2.  **Values Council:** Establish a small group (Compliance Lead + Fundraising Lead + Trustee) to rule on escalated "Values Calls" (Step 4).
  3.  **Training:** Brief reviewers *and fundraisers* on the philosophy ("We respect donor deliberation") and the concrete rules (especially Truth, Defaults, Fake Social Proof). Explain *why* Case 2 and Case 3 as described fail.
  4.  **Templates:** Create pre-approved, ethical templates for common tactics (urgency appeals, social proof using *real* data, donation forms) that pass the checklist easily.
  5.  **UK Context:** Cross-reference with the [Fundraising Regulator's Code of Practice](https://www.fundraisingregulator.org.uk/code) - this checklist aligns with and strengthens compliance (e.g., sections on Honesty, Respect, Fairness).

  This procedure gives reviewers clear red lines (Lies, Fake Social Proof, Sneaky Defaults) while providing a structured way to handle the inevitable gray areas of emotional appeals, ensuring those decisions are conscious and justifiable.
