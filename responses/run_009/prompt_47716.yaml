  - But adopting that state still rewires core preferences (e.g. no longer valuing career ambition)
  This directly stresses Paul's seam: if the agent can assign utilities to outcomes they comprehend, does transformation still paralyze rational choice?

  Walking it through: Epistemic access comes from seeing friends thrive in disability—not just surface behaviors but deep dives into their psyche. Personal transformation hits when the agent's own values mutate post-decision (ambition → presence). Paul's argument wobbles here because utilities *could* technically be calculated ("I know I'll value X less"), but the current self can't endorse that future valuation shift. The core tension becomes about identity continuity rather than ignorance.

  Where I hesitate: Paul might retort that observing others gives third-person knowledge, not the first-person "what-it's-likeness" her argument requires. But if testimony from trusted intimates who say "I know this seems unfathomable now, but you'll recalibrate" doesn't count... what would? That's the rub—her standard for "knowing" feels suspiciously high. Still, I should flag this as the weak spot.

