prompt: |-
  I teach a 200-level ethics course, 15ish students, one 90-minute session, and we've just finished Principia Ethica. I want an in-class activity where they actually run into Moore's isolation test instead of nodding along to it — the move where you strip a candidate good of everything else and ask whether you'd still want the world to contain it, like his bit asking you to compare a world of immense beauty with no conscious beings in it against a world that's basically just mud, and where he ends up landing on personal affection and the appreciation of beauty as the great intrinsic goods. My half-baked idea was a "build a world" game: students get a budget of points to spend putting things into a hypothetical world (beauty nobody can perceive, deep freindships, raw pleasure, conscious beings who can appreciate things, knowledge, etc.), and then they have to own whatever rankings their purchases imply — but I'm open to a better structure if you have one, especially something that also surfaces the non-additive stuff (why a friend appreciating beauty with you seems worth more than the friend plus the beauty side by side). Give me the answer as exactly five numbered items, one or two sentences each: (1) setup and materials, (2) the rules, including whatever budget or forced choices create the tradeoffs, (3) how scoring or resolution works with no real money, (4) the debrief, mapping specific moments in the game onto the isolation test and onto value that doesn't just sum, and (5) the thing that will predictably go wrong the first time I run it and how I should handle it. No intro or conclusion, just the five items — and please make sure the phrase "organic unity" never gets said out loud until the debrief, I want them to hit the wall before they get the label.
reasoning: |-
  We are designing an in-class activity to help students encounter Moore's isolation test and the idea of intrinsic goods, particularly focusing on the non-additive nature of some values. We'll avoid using the term "organic unity" until the debrief. The activity is a "build a world" game with a budget and forced choices.

  Here are the five numbered items:

  1. **Setup and materials**: 
     Prepare a worksheet listing various "world components" (e.g., "a mountain of immense beauty with no one to see it", "two close friends sharing a deep conversation", "a being experiencing intense pleasure alone", "a library of all knowledge with no one to read it", "a beautiful sunset appreciated by one person", "a mud plain", etc.). Each component has a point cost (positive or negative) and a brief description. Also, prepare a budget of 10 points per student.

  2. **Rules, including budget and tradeoffs**: 
     Students must spend their 10-point budget to add components to their world. They can choose multiple components but must stay within the budget. Some components are expensive (e.g., "a close friendship" costs 8 points, leaving little for else) and some are cheap (e.g., "a mud plain" costs 0). They must also choose at least one component that is isolated (e.g., beauty without an observer) and one that involves connection (e.g., friendship). They cannot exceed the budget.

  3. **Scoring or resolution without real money**: 
     After building their worlds, students pair up and defend their world to their partner, arguing why it is intrinsically good. Then, each pair must jointly create a new world with 12 points (slightly more to encourage combination) and present to the class why it's better than the individual ones, especially noting interactions between components.

  4. **Debrief, mapping to isolation test and non-additive value**: 
     In the class discussion, ask: "When you had to choose between a beautiful mountain with no one to see it and a mud plain, what did you pick and why?" Then: "Did anyone find that two things together (like friendship plus beauty) felt more valuable than each alone? That's Moore's point about organic unity—some goods aren't just sums." Finally, relate to Moore's intrinsic goods: personal affection and aesthetic appreciation.

  5. **Predictable problem and handling it**: 
     Students might treat the activity as a mere budgeting exercise, optimizing point costs without reflecting on intrinsic value. Handle this by interrupting during the pair discussions to ask probing questions: "Why did you spend 5 points on that unappreciated sunset? Would you really want a world with that and nothing else? How does that compare to a world with just friendship?"
answer: |-
  1. **Setup and materials**:  
     Provide each student with a worksheet listing 10–12 "world components" (e.g., "unperceived sublime beauty," "raw pleasure without context," "a deep friendship," "knowledge no one accesses," "a conscious being appreciating art," "a mud plain"), each with a point cost (e.g., beauty: 4 points, friendship: 6, mud: 0). Give them a 10-point budget to "build" a world by selecting components.  

  2. **Rules and tradeoffs**:  
     Students must spend exactly 10 points to choose components for their ideal world, but they face forced scarcity: high-value items (e.g., friendship at 6 points) consume most of the budget, pushing them to pick isolated elements (e.g., unperceived beauty for 4 points) or cheaper, less meaningful ones. They cannot combine items unless explicitly listed (e.g., "friendship + shared beauty" costs 8 points as a bundled option).  

  3. **Scoring and resolution**:  
     After building worlds, students pair up and argue why their world is better than their partner's, focusing solely on intrinsic goodness. Then, groups vote on the "most defensible" world via secret ballot, with votes tallied publicly—no monetary stakes, just peer critique forcing justification of choices against Moore's test.  

  4. **Debrief and mapping**:  
     Highlight choices like prioritizing unperceived beauty over mud, asking: "When you picked beauty alone, did it feel empty? That’s the isolation test—it fails without consciousness." Contrast with bundled items (e.g., friendship + beauty): "Why did that combo feel worth more than separate parts? Moore argues some goods aren’t additive; their unity creates new value." Connect to his intrinsic goods: affection and beauty’s appreciation.  

  5. **Predictable problem and fix**:  
     Students might treat it as a point-maximizing game, not an ethics exercise. Interrupt early: "Freeze! Would anyone trade their world for one with just raw pleasure? If not, why? Defend it like Moore—isolate each piece." Redirect to intrinsic value by questioning their cheapest/most expensive picks.
