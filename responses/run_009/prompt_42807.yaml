prompt: |-
  Ok so my friend and I just spent our entire dinner arguing about the sea battle thing and we ended with both of us basically throwing our hands up, so let me try to get this straight with someone who actually knows the logic here.

  Background: we agree on the setup — tomorrow there either will or won't be a sea battle, and the old fatalist argument goes roughly: if it's already true today that there will be one tomorrow, then it's necessary that there will be one, same for the other direction, so whatever happens is fated and deliberating is pointless. Where we fell apart:

  She says the argument is just a modal fallacy, that the fatalist slides from necessarily (if it's true that P, then P) to if it's true that P, then necessarily P, and that once you see that, the whole problem evaporates and there's nothing left to talk about. I pushed back that this can't be the entire story, because even after granting the fallacy, bivalence still says one of the two statements about tomorrow is true RIGHT NOW, and I can't shake the feeling that that already settles something about tomorrow, that the world has to "already contain" which way it goes. Then she accused me of secretly assuming determinism, and I accused her of assuming that rejecting determinism is enough to rescue bivalence, and by then the waiter was giving us looks.

  So what I want explained: what is the actual logical relationship between bivalence (every future-tensed statement is already true or false) and determinism/fatalism? Does the fatalist argument need determinism as a hidden premise, or is the whole trick supposed to be that it derives fatalism from logic alone? Where exactly does the modal fallacy diagnosis bite, and more importantly what does it leave unanswered — because it's supposed to leave something unanswered, right? And then separately: do fixes like three-valued logics where future contingents get a third value actually solve the problem, or do they just relocate it (e.g. what happens to excluded middle, or to statements like "there will be a sea battle or there won't be")? We argued about that last bit too — she thinks dropping bivalence for future contingents is cheap, I think it's expensive and I can't fully articulate why, which is annoying.

  Please explain it in a way that maps onto our actual disagreement, and tell me which of us is closer to right, if either. Be honest if we were both confused in the same direction — that's my suspicion now that I've written it out.
