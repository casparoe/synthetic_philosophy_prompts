prompt: |-
  I'm doing a little side project on norms of assertion and I want to map out the rule my advisor is implicitly running, because her verdicts across cases in seminar don't all obviously point to one norm, and next week she's going to be the commentator on my paper so I'd like to have her position nailed down (as best I can) before she comments on mine. Here's her track record on whether various assertions were proper, in the sense of conforming to the rule of assertion, not whether the speaker was being a decent person. Ordinary perceptual stuff ("there's milk in the fridge" said right after checking): proper. Fake barn country ("that's a barn," said while driving through county full of barn facades, pointing at the one real barn): improper. Lottery ("my ticket will lose," said after checking the odds, before the draw): improper. A Gettiered case, true belief from a reliable method that just got lucky: improper. Moore-style assertion ("the meeting's at 3, though I don't believe it is"): improper. But then there's what the literature calls a selfless assertion — a doctor with overwhelming evidence that her patient will recover, who can't quite bring herself to believe it because of a case that went badly wrong years ago, telling the family "she's going to pull through" — and my advisor says that one's proper, that the assertion is fine even with no belief in the picture. And relaying a stranger's directions that turn out to be right: proper.

  So knowledge norm, belief norm, justified-belief norm, and some kind of "if she were to believe it on her actual basis, that belief would be knowledge" rule all seem live candidates, and I genuinely can't tell which one to attribute to her (or whether it's some disjunctive thing). Here's the case I actually need a prediction on, because it's going to come up at the talk: an oncologist tells her patient "the treatment is going to work." She believes it, on genuinely strong evidence — say the treatment has an 85% success rate for exactly this profile — and it does work. My advisor has said things in the past that make me think she holds that with a life on the line, the oncologist doesn't KNOW the treatment will work, even though the same belief held with the same evidence, mentioned casually to a colleague over coffee, would clearly be knowledge. So stakes seem to matter to her.

  Given her track record, what's she going to say about the oncologist's assertion to the patient — proper or improper? Walk me through which candidate rules fit the earlier verdicts, what each predicts on this new case (they should split on it), your best guess at her verdict and why, and then design the case that would best discriminate between the rules I'm choosing between — I want to have it ready as a backup example if her answer surprises me. Also flag if you think one of the earlier verdicts I listed is doing most of the work, because I have a suspicion the selfless assertion one is a bit of an outlier she might walk back under pressure.
reasoning: |-
  Okay, so the user is working on norms of assertion and trying to figure out their advisor's implicit rule based on past verdicts. They've listed several cases: ordinary perceptual claims are proper, but fake barn country, lottery assertions, Gettier cases, and Moorean assertions are all improper. The selfless assertion (doctor without belief) and relaying directions are proper. Now they need to predict the advisor's verdict on an oncologist case where there's an 85% success rate, high stakes, and the advisor might think knowledge isn't present here.

  First, I need to recall the common norms: Knowledge Norm (KN), Belief Norm (BN), Justified Belief Norm (JBN), and the Functional Knowledge Norm (FKN). Each of these might fit some of the advisor's past judgments differently. Let me go through each case and see which norms align.

  The fake barn country is improper. That's classic KN territory because you don't know it's a real barn due to luck. Lottery is also improper under KN since you don't know the ticket will lose. Gettier cases are impropoer for the same reason—no knowledge. Moorean assertions are improper under KN because asserting something you don't believe undermines knowledge. But the selfless assertion is proper even without belief. That's a problem for KN and BN because both require belief. So JBN and FKN might handle that better. Relaying directions is proper, which could fit JBN or FKN if the justification is there.

  Now the oncologist case: high stakes, 85% success rate. The advisor thinks that in high stakes, the oncologist doesn't know the treatment will work. So under KN, if she doesn't know, the assertion should be improper. But under JBN, if she has justified belief, it might still be proper. FKN requires that if she believed it, it would be knowledge. But here, if she believes it, does she know? The advisor says no in high stakes, so FKN might say improper. But wait, the advisor might think that in low stakes (telling a colleague), it's knowledge, but not in high stakes. So stakes matter for knowledge attribution. So KN would say improper in high-stakes assertion to the patient.

  Belief Norm would say proper since she believes it. JBN also proper because evidence is strong. FKN: if in high stakes she doesn't know even if she believes, then functional knowledge isn't present, so improper. So KN and FKN predict improper, while BN and JBN predict proper.

  The selfless assertion case is key here. The advisor said it's proper without belief. That rules out BN and KN (since KN requires belief). So only JBN and FKN are left. JBN requires justified belief, but in selfless assertion, the doctor doesn't believe, so JBN shouldn't allow it. But FKN only requires that if she believed on the basis, it would be knowledge. In selfless assertion, the evidence is overwhelming, so if she believed, she would know. Hence FKN allows it. So FKN fits the selfless case, while JBN doesn't. Therefore, FKN is the best fit.

  Then for the oncologist case, FKN would require that if she believed, she would know. But the advisor thinks that in high stakes, she doesn't know. So FKN predicts improper. 

  The discriminatory case: a high-stakes situation with strong evidence but where the agent doesn't believe. For example, a financial advisor with 95% success rate for an investment but personally doubts due to past trauma. Under FKN, if the evidence is strong enough that if they believed, they would know, then assertion is proper. But under JBN, since they don't believe, it should be improper. So if the advisor says proper, it's FKN; if improper, it's JBN. But earlier selfless was proper, so likely FKN.

  Also, the lottery case: if someone asserts without belief but with justification, JBN might say proper, but advisor said improper. So JBN might not fit lottery if justification is present but not knowledge. FKN handles lottery because if they believed, they wouldn't know (due to luck), so improper.

  So the oncologist case: high stakes, advisor likely says improper because of stakes affecting knowledge. FKN predicts that. Discriminatory case: selfless-like in high stakes to test belief vs functional knowledge.
answer: |-
  Based on your advisor's track record and the oncologist case, I'll analyze the candidate norms, predict her verdict, and design a discriminatory test case. Her pattern strongly points to one norm, with the selfless assertion case being the linchpin.

  ### Candidate Norms & Fit with Past Verdicts
  *(✓ = fits verdict, ✗ = conflicts)*

  1. **Knowledge Norm (KN)**: Assert only what you know.
     - Ordinary perceptual: ✓ (knows)
     - Fake barn: ✗ (lacks knowledge)
     - Lottery: ✗ (lacks knowledge)
     - Gettiered: ✗ (lacks knowledge)
     - Moorean: ✗ (fails belief condition for knowledge)
     - **Selfless assertion: ✗ (no belief → no knowledge) → CONFLICT**
     - Relaying directions: ✓ (testimonial knowledge)

  2. **Belief Norm (BN)**: Assert only what you believe.
     - Ordinary perceptual: ✓ (believes)
     - Fake barn: ✓ (believes) → **CONFLICT** (she called it *improper*)
     - Lottery: ✓ (believes) → **CONFLICT** (improper)
     - Gettiered: ✓ (believes) → **CONFLICT** (improper)
     - Moorean: ✗ (no belief)
     - Selfless assertion: ✗ (no belief) → **CONFLICT** (she called it proper)
     - Relaying directions: ✓ (believes the directions)

  3. **Justified Belief Norm (JBN)**: Assert only what you justifiably believe.
     - Ordinary perceptual: ✓ (justified)
     - Fake barn: ✗ (unjustified due to risk of facades)
     - Lottery: ✗ (statistical justification ≠ knowledge-level)
     - Gettiered: ✗ (justification is Gettiered)
     - Moorean: ✗ (no belief)
     - **Selfless assertion: ✗ (no belief) → CONFLICT**
     - Relaying directions: ✓ (justified testimony)

  4. **Functional Knowledge Norm (FKN)**: Assert only if, *if you were to believe it on your actual basis, that belief would be knowledge*.  
     *(This avoids requiring actual belief)*
     - Ordinary perceptual: ✓ (basis → knowledge)
     - Fake barn: ✗ (basis + environment → not knowledge)
     - Lottery: ✗ (statistical basis → not knowledge)
     - Gettiered: ✗ (basis → not knowledge due to luck)
     - Moorean: ✗ (no basis for belief in the 2nd conjunct)
     - **Selfless assertion: ✓ (doctor's evidence is knowledge-grade → if believed, it would be knowledge)**
     - Relaying directions: ✓ (reliable testimony → if believed, knowledge)

  **Summary of Fit**:  
  - KN, BN, and JBN **all fail** the selfless assertion case.  
  - Only **FKN cleanly fits all verdicts**, including selfless assertion and relaying directions.  
  - Fake barn/lottery/Gettier veto BN/JBN; Moorean vetoes BN; selfless assertion is the critical outlier that *only* FKN accommodates.

  ---

  ### Prediction for the Oncologist Case
  - **Case**: Oncologist tells patient "treatment will work" with 85% success rate (strong evidence), believes it, and it succeeds. Advisor thinks **high stakes negate knowledge** here (vs. same claim to colleague = knowledge).  
  - **FKN Prediction**:  
    - If advisor denies knowledge *even if the oncologist believes*, then FKN says assertion is **IMPROPER** (since "if believed, would be knowledge" fails in high stakes).  
    - *Why?* FKN ties propriety to the *epistemic robustness* of the basis, not actual belief. Stakes-sensitivity implies the basis isn't knowledge-grade in high-stakes contexts.  

  **Your advisor's likely verdict: IMPROPER**  
  - **Why?**  
    1. FKN is her only consistent norm (selfless assertion is decisive).  
    2. Her stakes-sensitivity implies the oncologist's basis isn't knowledge-grade *in this context*—so FKN isn't satisfied.  
    3. This mirrors her fake barn/lottery verdicts: strong statistical evidence isn't enough for assertion when epistemic risk is high.  

  *Alternative norms' predictions*:  
  - **KN**: Improper (no knowledge in high stakes).  
  - **BN/JBN**: Proper (she believes and evidence is strong).  
  *But these already conflict with her selfless assertion verdict.*

  ---

  ### Discriminatory Test Case
  **If her oncologist verdict surprises you (e.g., she says *proper*), use this to force a choice between FKN and JBN:**  

  > **"Traumatized Oncologist"**:  
  > Same as your oncologist case (85% success rate, high stakes), but here the oncologist **does not believe** the treatment will work due to trauma (like the selfless doctor). However, their evidence *is* objectively strong (85% success, peer-reviewed). They assert to the patient: "The treatment will work."  

  - **FKN Prediction**: **PROPER**  
    *(If the oncologist believed on their actual evidence, they would know it—since the same evidence *would* be knowledge in low stakes. Trauma doesn't undermine the basis.)*  
  - **JBN Prediction**: **IMPROPER**  
    *(No actual belief → fails JBN, even with justification.)*  
  - **KN/BN Prediction**: Improper (no belief/knowledge).  

  **Why this discriminates**:  
  - If she says **proper**, it confirms FKN (selfless structure + stakes-sensitivity).  
  - If she says **improper**, she likely holds a modified JBN (e.g., "justified belief *or* justification without belief but only in low stakes"), but this would clash with her original selfless assertion verdict.  

  ---

  ### Key Observations & Tactics
  1. **Selfless assertion is the crux**: Her acceptance of it rules out KN/BN/JBN. If she walks this back under pressure, *immediately* ask:  
     - *"In the selfless doctor case, if the assertion is proper without belief, what positive epistemic property makes it so?"*  
     (This forces her to articulate FKN or reveal inconsistency.)

  2. **Stakes-sensitivity is pivotal**: Her view that knowledge vanishes in high stakes despite 85% evidence suggests a **pragmatic encroachment** stance. FKN naturally extends this: if stakes defeat knowledge, they defeat FKN too.

  3. **Talk strategy**:  
     - Present the oncologist case first. If she says **improper**, attribute FKN and note how it explains selfless assertion.  
     - If she says **proper**, deploy "Traumatized Oncologist" to expose tension: *"If the assertion is proper here without belief, why not in the selfless case? If not, how does stakes-sensitivity interact with belief?"*  

  **Final bet**: She’ll call the oncologist’s assertion **improper** (≈85% confidence), cementing FKN as her norm. The selfless case isn’t an outlier—it’s the key to her entire framework. If she retreats from it, your paper can argue that her other verdicts *force* something like FKN anyway. Good luck!
