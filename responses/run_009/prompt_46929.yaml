prompt: |-
  I read a popular blog post on voting theory that summarizes the Gibbard–Satterthwaite theorem as follows:

  "In any election with three or more candidates, every voting system that isn't a dictatorship can be manipulated: some voter, in some situation, does strictly better by casting a ballot that misrepresents her true preferences. So there is no such thing as a strategy-proof voting method — tactical voting isn't a defect of plurality voting or of ranked-choice ballots specifically; it's a mathematical feature of voting itself. The only escapes are to hand the outcome to a single voter or to narrow the field to two candidates. And since real voters obviously do vote tactically, the theorem shows that sincere voting is never rational, and that no election outcome can be trusted as a picture of what the electorate actually wants."

  The author clearly knows some economics, and I'm inclined to accept it, but a friend who studies social choice said the post "smuggles in hypotheses and then forgets them." Take the summary apart claim by claim: state which parts a social choice theorist would accept as written, which parts are conflations or overstatements of a more modest thesis, and which parts are simply false. Pay particular attention to (a) what the theorem's actual hypotheses are, and which ones the post never mentions; (b) what "manipulable" means in the theorem — the quantifiers over voters and preference profiles — and whether that notion supports the post's final inference; and (c) whether the cases the post waves at (two-candidate elections, ranked-choice ballots) really behave as it claims.

  Then present your audit as a JSON object with exactly this schema:

  {
    "claims": an array of objects, one per distinct claim extractable from the summary, each containing:
      "claim": the claim, quoted or closely paraphrased;
      "verdict": exactly one of "accurate", "accurate-but-incomplete", "misleading", "false";
      "explanation": two to four sentences on why, naming the theorem's actual hypotheses wherever relevant;
    "omissions": an array of the substantive things the summary leaves out, each containing:
      "point": what was omitted;
      "why_it_matters": one or two sentences on how it would change the picture;
    "conclusion_audit": an object containing:
      "follows": a boolean for whether the final inference — sincere voting is never rational, and outcomes cannot be trusted as pictures of preferences — follows from the corrected version of the claims;
      "reasoning": three to five sentences;
    "overall_fairness": exactly one of "fair", "mostly-fair", "mixed", "mostly-unfair", "unfair", followed by a one-sentence justification
  }
reasoning: |-
  Alright, let's tackle this query about the Gibbard-Satterthwaite theorem summary. The user shared a blog post's interpretation and wants a critical breakdown based on social choice theory. 

  First, I need to recall the theorem's exact formulation. G-S requires unrestricted domain, non-dictatorship, and social choice function (not just voting systems). The blog says "every voting system" but omits these technical conditions. That's a red flag right there.

  Hmm, the "manipulable" claim is tricky. The theorem says for every system, there exists some preference profile where some voter can manipulate. But the blog flips it to "some voter in some situation" implying constant vulnerability, which isn't true. Strategic voting depends on context – that's a big oversimplification.

  Wait, the "no strategy-proof voting" statement is technically correct but misleading. Social choice theorists would stress that strategy-proofness here is absolute – under G-S assumptions. In practice, many systems resist manipulation most of the time. The blog's leap to "never rational" ignores this nuance.

  The dictatorship/two-candidate exceptions are accurate, but... ranked-choice ballots? That's wrong. Even RCV (IRV) is manipulable per G-S! The author seems confused about alternative systems. 

  Noticing the omissions too. Unrestricted domain is huge – if we allow only single-peaked preferences (like in political spectrums), Arrow's theorem shows strategy-proof systems exist! Also, no mention of cardinal vs ordinal ballots. Major oversight.

  The conclusion audit... Does "never rational" follow? Absolutely not. Sincere voting can still be equilibrium in many cases. And "can't trust outcomes" overreaches – we just can't assume sincerity, not that results are meaningless. 

  User's friend was right about smuggled hypotheses. The blog states implications as universal when they're conditional. Overall? "Mostly-unfair" – it gets the theorem's existence claim right but botches the interpretation and practical implications. 

  Better prepare specific counterexamples. Like how approval voting escapes G-S by violating ordinal preferences. And emphasize that "mathematical feature" applies only under specific (albeit broad) conditions.
