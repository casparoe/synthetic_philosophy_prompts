prompt: |-
  Not sure where else to ask this, so here goes. I do incident reviews at work (workplace safety stuff, nothing dramatic), and I keep running into the same asymmetry. When someone's shortcut causes an injury, everybody says he "knew exactly what he was doing" and "chose to cut corners", even though the injury was the last thing the guy wanted. But when the same kind of shortcut happens to prevent an accident, or just saves everybody a pile of time, nobody says she knowingly brought that about -- she "got lucky" or "stumbled into it". Same knowledge, same foreseen-but-not-aimed-at consequence, opposite verdict on whether it was on purpose. I mentioned this to a friend who did a philosophy undergrad and she said "confirmation bias", but that doesn't seem right, because it's not about looking for evidence, it's about whether the word "intentionally" sticks depending on whether the outcome was bad. There's also a wrinkle I can't find words for: when the bad side effect lands mostly on the agent himself (guy takes a shortcut, mangles his own hand), people get alot more reluctant to say he did it on purpose. So the asymmetry seems to need the victim to be somebody else.

  So my questions: does this pattern have an actual name, what's the closest established thing to it, and how do people carve up the space here -- is the mainstream view that this is a bias that should be corrected, or that ordinary folks are tracking something real about what intention is? And if the self-harm wrinkle has been written about, how is it usually explained? Don't just give me a label and call it a day, I want to know how it relates to nearby stuff like judging people more harshly because the outcome was bad anyway.
reasoning: |-
  Okay, let me start by unpacking the user's problem. They work in incident reviews for workplace safety and notice an asymmetry in how people judge actions based on outcomes. When a shortcut causes injury, the person is seen as intentionally cutting corners, but if it prevents an accident, they're just lucky. The user mentioned that if the harm is self-inflicted, people are less likely to say it was intentional. Their friend suggested confirmation bias, but the user thinks that's not quite right because it's about the application of "intentionally" based on outcome.

  First, I need to recall relevant psychological concepts. The outcome effect comes to mind—judging decisions based on results rather than intent. That seems to fit. Then there's the Knobe Effect, where moral judgments influence the assignment of intentionality. The user's scenario matches this, especially since intent is ascribed more in negative outcomes. 

  The self-harm angle is interesting. When the agent is the victim, people hesitate to call it intentional. That might tie into the concept of moral luck or perhaps the actor-observer bias. People might empathize more when someone harms themselves, seeing it as a mistake rather than a deliberate choice. Also, the asymmetry needing another victim suggests that moral responsibility plays a role. If harm is to others, it's viewed as intentional to assign blame, but self-harm is seen as accidental, reducing blame.

  The user wants to know if this is a bias to correct or if it reflects something real about intention. Philosophers like Knobe argue that moral judgments are part of intentionality ascriptions, so it's not just a bias but a feature of how we understand intent. But in workplace safety, treating it as a bias makes sense to focus on the act itself, not the outcome. 

  I should also connect this to nearby concepts like hindsight bias and blame attribution. The user mentioned outcome severity affecting judgments, which relates to the severity effect. Explaining how these concepts interlink will help the user understand the broader landscape. 

  For the self-harm wrinkle, factors like counterfactual thinking (e.g., "he didn't mean to hurt himself") and empathy might explain the reluctance. Studies on moral luck where outcomes influence blame even if intent is similar could support this. 

  The user's deeper need might be to improve incident reviews by reducing biased judgments. Highlighting strategies like focusing on the decision-making context and separating outcome from intent would be practical. Emphasizing that while the asymmetry is a cognitive feature, in safety contexts, correcting it leads to fairer analyses and better prevention.
answer: |-
  This is a brilliantly observed pattern, and you're absolutely right that "confirmation bias" doesn't quite capture it. You've hit on a core issue at the intersection of philosophy of mind, moral psychology, and social cognition. Here's a breakdown of the concepts involved, how they relate, and the current thinking:

  1.  **The Core Phenomenon: Outcome Effect on Intentionality Ascription (Specifically the Knobe Effect)**
      *   **The Name:** The most precise label for the main asymmetry (intentional for bad outcomes, unintentional for good/neutral ones) is the **Knobe Effect** (or the **Side-Effect Effect**), named after philosopher Joshua Knobe who experimentally demonstrated it in the early 2000s.
      *   **The Finding:** People are significantly more likely to say an agent brought about a side effect *intentionally* when that side effect is *bad* (harming the environment, hurting someone) than when it is *good* (helping the environment, benefiting someone), even when the agent's knowledge and primary goal are identical in both scenarios. Your workplace examples are perfect real-world illustrations.
      *   **Key Point:** It's not just that people judge the *action* more harshly when the outcome is bad; they fundamentally change their description of the *agent's mental state* regarding the outcome, attributing *intentionality* specifically in the negative case.

  2.  **Why "Confirmation Bias" Isn't Quite Right:**
      *   Confirmation bias is about seeking or interpreting *evidence* to support a pre-existing belief. Here, the *same evidence* (knowledge of the risk, decision to act) is interpreted differently *based solely on the moral valence of the outcome*. The judgment about the *past mental state* is shifting based on the *future consequence*. It's a judgment *bias*, but not driven by evidence-seeking for a prior belief.

  3.  **The "Self-Harm Wrinkle": Outcome Effect Moderation by Victim Identity**
      *   **The Observation:** You're correct that the asymmetry weakens or reverses when the primary victim of the bad outcome is the *agent themselves* (e.g., mangling own hand).
      *   **Explanations (Often Working Together):**
          *   **Empathy & Counterfactual Thinking:** When the victim is the agent, observers more readily imagine themselves in that position ("There but for the grace of God..."). They construct a narrative where the agent *obviously didn't intend to hurt themselves* ("He just wanted to save time, he never wanted *this*"). The counterfactual ("He didn't mean to hurt himself") feels stronger.
          *   **Reduced Moral Condemnation Need:** Assigning intentionality to self-harm doesn't serve the strong social function of blaming/punishing someone for harming *others*. We feel less need to morally condemn the agent, so we don't "upgrade" their recklessness to intentional harm. The focus stays on the poor *decision* (recklessness, negligence) rather than assigning malicious or callous *intent* towards the self.
          *   **Actor-Observer Bias (Slightly Modified):** We tend to explain others' actions by their dispositions ("He's reckless") but our own (or similar others') actions by the situation ("I was under time pressure"). When the agent *is* the victim, we might subtly shift towards explaining their action via the situation (pressure, fatigue) rather than a disposition to *intend* self-harm, making intentionality attribution less likely.
          *   **"Intention" Implies Control Over Target:** We intuitively link intention more strongly to controlling outcomes *on others or the environment* than to self-inflicted harm caused by a lapse in self-control or misjudgment. Harming oneself feels more like a *failure* than an *intended act*.
      *   **Status:** This moderation is a recognized aspect of the broader outcome effect, often studied in variations of Knobe's scenarios. It highlights that the effect is driven by *moral evaluation* (blame/praise) more than pure outcome valence.

  4.  **Relation to Nearby Concepts & How Space is Carved Up:**
      *   **Outcome Bias:** Judging the *quality of the decision* based on the outcome, not the information available at the time. (Related, but distinct: Your issue is about judging the *intention*, not just the decision quality).
      *   **Hindsight Bias:** Knowing the outcome makes people believe it was more predictable than it actually was. (This *feeds into* the Knobe effect: Bad outcomes feel more foreseeable, making the agent seem more knowing/intentional).
      *   **Moral Luck:** The phenomenon where people are judged more harshly or praised more highly based on factors outside their control (like the actual outcome of a risky action), even if their intentions/actions were identical to someone with a different outcome. **The Knobe Effect is a specific *mechanism* of moral luck:** It's the *intentionality ascription* that shifts based on luck, enabling harsher blame.
      *   **Culpable Control Model:** Proposes that people *motivatedly* interpret mental states (like intentionality) and situational constraints to achieve a desired level of blame or praise. The Knobe effect fits perfectly: observers inflate intentionality to justify blame for bad outcomes.

  5.  **The Philosophical Debate: Bias or Insight?**
      *   **Bias View (Dominant in Psychology/Safety):** This pattern *is* a cognitive bias (or cluster of biases: outcome bias, hindsight bias, motivated reasoning via culpable control). It distorts fair judgment. In safety investigations, focusing on the decision process, available knowledge, and foreseeable risks *at the time* is crucial, regardless of outcome. Treating the same risky act as "intentional harm" in one case and "lucky break" in another based purely on outcome hinders learning and fairness. **Corrective Action:** Train investigators to focus on: "What did they know?", "What risks were foreseeable?", "Why did the shortcut seem reasonable *then*?", "What system pressures existed?" – decoupled from the outcome.
      *   **Folk Concept View (Knobe & some Philosophers):** Knobe argues that the asymmetry reveals something deep about our *ordinary concept* of intentional action. He suggests that moral judgment isn't just an *add-on* to intention ascription; it's fundamentally *built into* it. When we say someone did something "intentionally," we are partly making a *moral* assessment about their regard for the consequences. The fact that the self-harm case weakens the effect supports this – intentionally harming *oneself* in that context doesn't carry the same moral weight/condemnation as harming others. On this view, ordinary language isn't necessarily "wrong"; it's reflecting a complex concept where foresight, control, and moral evaluation are intertwined.

  6.  **Practical Implications for Incident Review:**
      *   **Acknowledge the Bias:** Explicitly recognize that outcome severity and victim identity *will* unconsciously influence judgments of intentionality and blame.
      *   **Focus on Foreseeability & Context:** Rigorously document what was known *before* the incident, the pressures present (time, resources, culture), and the *foreseeable* risks of the shortcut *at that moment*, irrespective of what *actually* happened.
      *   **Separate Outcome from Cause Analysis:** First, determine *what happened* and *how* (sequence of events, decisions). Then, *separately*, analyze *why* decisions were made (context, knowledge, pressures). Finally, assign responsibility/blame based on the "why" analysis, resisting the urge to let the outcome inflate intentionality.
      *   **Use "Rash," "Reckless," "Negligent":** These terms often better capture the mental state in shortcut cases (awareness of risk but proceeding anyway, or failure to perceive an obvious risk) without necessarily implying the *intentional* desire for the harmful outcome. "He intentionally took the shortcut" is fine; "he intentionally mangled his hand" is almost certainly inaccurate and unhelpful.
      *   **Examine Near-Misses Rigorously:** Treat successful shortcuts ("lucky breaks") with the same analytical rigor as incidents. Ask: "Why did this *not* cause harm? What risks were present? What would the consequences have been?" This counters the "just lucky" dismissal.

  **In Summary:**

  *   **Core Asymmetry:** This is the **Knobe Effect** or **Side-Effect Effect** – attributing intentionality to foreseen side effects significantly more for bad outcomes than good/neutral ones.
  *   **Self-Harm Wrinkle:** Explained by reduced need for moral condemnation, increased empathy/counterfactual thinking ("he didn't mean to hurt *himself*"), and the actor-observer bias. It highlights the role of *moral evaluation* in driving the asymmetry.
  *   **Relation to Nearby Concepts:** It's a specific mechanism underlying **Moral Luck** (outcome influencing blame), heavily influenced by **Hindsight Bias** (bad outcomes seem more foreseeable), and explained by the **Culpable Control Model** (motivated reasoning to assign blame/praise).
  *   **Bias or Insight?** Mainstream in psychology/safety views it as a **bias to be corrected** for fair analysis and learning. Some philosophers argue it reveals the **moral nature embedded in our folk concept of intentionality**. For practical incident review, treating it as a bias is essential.
  *   **Practical Takeaway:** Combat this by rigorously focusing on the decision context, foreseeable risks, and pressures *at the time*, decoupled from the outcome's severity or victim identity. Use precise language ("reckless," "negligent") and analyze near-misses as seriously as actual incidents.

  Your observation is incredibly astute and cuts to the heart of why incident reviews can be challenging and sometimes unfair. Recognizing these psychological patterns is the first step towards more objective and effective safety management.
