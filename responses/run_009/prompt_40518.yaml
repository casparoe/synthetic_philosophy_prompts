     - (2) is about epistemic rationality being tied to evidence. (4) says that practical penalties (like Dutch books) are not sufficient for epistemic irrationality. There is no direct conflict because Evidentialism is about what makes a credence rational, and (4) is about what does not (i.e., practical penalties). They can coexist.

