  (3) Hangover verdict: In the hangover scenario, I know that tomorrow I will be 90% confident (without new evidence) that the party was a disaster, but it would be irrational for me now to conditionally move toward 0.9.

  (4) No pragmatic vindication: Practical penalties (like Dutch books) do not make a credence irrational; they are misfortunes, not epistemic failings.

