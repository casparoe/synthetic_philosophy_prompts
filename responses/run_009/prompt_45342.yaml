prompt: |-
  I'm taking a course on AI safety this term and we just finished a unit comparing approval-directed agents with goal-directed ones — instead of giving the system an objective to maximise, you have it pick actions it predicts a human overseer would approve of, which is supposed to sidestep goodhart-ish failure modes but shifts the whole problem onto how the overseer evaluates things mid-run. For the final essay we get to set our own question, and I want to argue for what deserves the most attention in this comparison. My shortlist of open questions: whether approval-direction degrades gracefully as the agent gets more capable or just hides the misalignment until the agent is smarter than whoever's approving; whether there's a coherent middle ground where the agent is approval-directed about its subgoals but goal-directed at the top level, or whether that's just a goal-directed agent with extra steps; and whether the distinction even survives once you notice that any approval signal worth optimising against becomes a proxy objective anyway. There's also a thing our tutor mentioned offhand — that the overseer's standards drift as they get used to what the agent produces, so the thing being approved of isn't stable — but I honestly can't tell if that's a crux or a footnote. Which of these (or something I'm completly missing) is the question the rest of the debate quietly depends on, and which ones would let me write an essay where my answer actually changes something, rather than just restating the two sides? I've got about 4,000 words and more background in decision theory than in ML, if that changes what's tractable.
