  The proxy concern (point 3) is also fundamental. If every approval signal becomes a proxy, then ADA isn't really different from GDA—it's just optimizing a different objective. That challenges the core premise of ADA as a safer alternative. But is this already well-trodden ground? Maybe the user can bring a decision-theory lens to it, framing approval as a preference model that must be stable and learnable.

