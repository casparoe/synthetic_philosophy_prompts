answer: |-
  Here are five considerations, numbered:

  1.  **Distinguish Financial Growth from Moral Weight:** Compound interest increases monetary value predictably, but future people's *well-being* doesn't intrinsically depreciate over time like money does; their fundamental moral claim to a flourishing life remains constant. Your nephew risks conflating the mechanics of capital with the inherent value of persons.

  2.  **Intergenerational Equity vs. Existential Risk:** Discounting future welfare heavily (even at 2%) drastically reduces the present value of lives centuries away, potentially justifying insufficient action on long-term threats like climate change. If coastal restoration prevents future mass suffering or societal collapse, its moral weight shouldn't be exponentially diminished.

  3.  **Obligation to Unknown Descendants vs. Strangers:** Your perceived duty to distant descendants might feel stronger than to strangers, but both are equally unknown. If moral obligations diminish purely over time/generations, the difference is minimal; if based on relational ties, descendants hold slightly more weight, though still abstract.

  4.  **Irreversibility and Future Options:** Environmental damage (like coastal loss) is often irreversible, while financial capital is fungible. Preventing permanent harm today might outweigh providing more resources later (via compound growth) that cannot fix the specific loss. Discounting undervalues preventing irreversible catastrophes.

  5.  **Certainty of Present Joy vs. Uncertainty of Future Impact:** Traveling with grandkids provides immediate, assured, relational value benefiting concrete individuals you love. Future impacts (trust value, donation efficacy) are inherently uncertain (policy shifts, fund mismanagement, unforeseen events). Discounting future welfare partly reflects this uncertainty, but not the *moral value* itself.

  **On Discounting "Souls":** Consideration #1 most directly challenges your nephew. **It explicitly settles that applying financial discount rates directly to human well-being is a category error; compound interest applies to dollars, not souls.** Discount rates model opportunity cost and uncertainty (consideration #5), not a decay in the inherent moral worth of future people. The "real moral work" discounting does is pragmatic (modeling investment trade-offs and risk), not foundational ethics.
