  I'm 67, retired from a career in radiometric dating (so I've spent forty years thinking about exponential decay), and over the last couple years I've gotten properly into moral philosophy, so bear with me. Here's my actual problem. I've got about $400k beyond what I need for the rest of my life, and I'm torn between three things: spending a chunk of it travelling with my grandkids while my knees still work, putting it in a trust for descendants I'll never meet, or donating it to a coastal restoration fund whose main benefits land somewhere past 2150. My nephew, who does climate economics for a living, keeps telling me any rational person discounts future welfare — a happy person in 2200 just counts for less than a happy person today, he says, maybe 2% less per year, exactly the way the discount rate in his models works — and that I'm being sentimenal about strangers. Part of me wants to push back: I've watched uranium decay exponentially my whole career and the uranium never had a *reason* for doing it, so why should the moral weight of a person's life decay exponentially just because it happens later? Though I'll grant him one thing: a dollar invested today really is worth more in 2200, that's just compound interest — but that seems like a fact about dollars, not about people, and I can't tell if he's smuggling one into the other. So give me exactly five considerations I should be weighing, numbered, each one or two sentences, no intro or conclusion. I want to come away knowing whether his discounting is doing real moral work or whether it's compound interest applied to souls. If one consideration obviously settles it, say so, and please treat the case where the future people are my own descendants versus total strangers as different if it actually makes a difference.
