  Here's the case I want to bring to her next week, and I'd like a prediction before I do. It's a blackmail scenario: her house either has termites or it doesn't, and there's a great predictor who long ago modeled whether she would pay if she received an extortion letter. The letter arrives if and only if exactly one of the following is true — she has termites, or she would pay if the letter arrived. So if she's a non-payer, the letter only shows up when the termites are real; if she's a payer, the letter only shows up when they aren't. The letter demands $1,000, and paying or not paying has zero causal effect on the termites, which would cost $100,000 to fix. She's now holding the letter. Does she pay or refuse? My instinct is she refuses, because refusing feels like the "don't negotiate with extortion" move that matches her other answers, but I genuinely can't tell — it seems like refusing is bad news about the termites in a way that might pull someone with her track record the other way.

  So what I want from you: predict her verdict, but more importantly, work out the candidate rules that fit her record so far (there seem to be at least two or three — the "treat your decision as a fixed function that's mirrored in predictors/copies" view, and some version of evidential reasoning that's smart about the smoking lesion, maybe some "do what you'd have precommitted to" rule), say which of those rules converge or diverge on the termite letter, and tell me which additional case would definitively split the remaining candidates apart. Also curious whether it changes your prediction if the predictor is only 60% accurate instead of basically perfect, since Maya says the accuracy never matters for her answers but I'm not sure I buy that.
