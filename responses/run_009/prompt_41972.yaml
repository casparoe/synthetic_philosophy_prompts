answer: |-
  Based on Maya's decision patterns across the puzzles, she consistently follows **Functional Decision Theory (FDT)** or a closely related variant like **Updateless Decision Theory (UDT)**. These theories treat the agent's decision as a fixed function (or algorithm) that is part of the world model, allowing predictors, copies, or counterfactual scenarios to reference it. The goal is to choose the function that maximizes expected utility across all possible worlds, including those where the function is "called" in different contexts (e.g., by predictors, copies, or past/future selves). This explains her answers:

  - **Newcomb (one-boxes)**: FDT one-boxes because it recognizes that the predictor simulates its decision function. Choosing to one-box ensures the predictor fills the box, leading to higher utility.
  - **Twin prisoner's dilemma (cooperates)**: FDT cooperates because it treats the copy as running the same decision function. Coordinating on cooperation yields a better outcome.
  - **Smoking lesion (smokes)**: FDT smokes because the lesion is caused by a gene independent of the decision function. Smoking doesn't cause cancer, so it maximizes utility without evidence-based overfitting.
  - **Counterfactual mugging (pays)**: FDT pays to maintain consistency in its decision function across counterfactuals. Precommitting to pay ensures high utility in the heads world.
  - **Parfit's hitchhiker (pays)**: FDT pays because the predictor rescued her based on simulating her function. Consistency ensures future cooperation and validates the predictor's model.

  ### Prediction for the Termite Blackmail
  **Maya will REFUSE to pay** the $1,000. Here's the FDT analysis:
  - The letter arrives iff exactly one of these is true: (1) termites exist, or (2) she would pay if the letter arrived. This creates a dependency between her decision function and the predictor's action.
  - FDT evaluates the decision function **ex-ante** (before knowing if the letter arrived or if termites exist). Let:
    - \( p \) = probability of termites (unknown, but assume \( 0 < p < 1 \)).
    - \( F_{\text{pay}} \) = the function that pays if the letter arrives.
    - \( F_{\text{refuse}} \) = the function that refuses if the letter arrives.
  - Expected utility of \( F_{\text{pay}} \):
    - If no termites (prob \( 1-p \)): Letter arrives (since termites=false XOR pay=true → true). She pays $1,000, no termite cost: **−$1,000**.
    - If termites (prob \( p \)): Letter does not arrive (termites=true XOR pay=true → false). She pays nothing but faces termite cost: **−$100,000**.
    - **Expected utility: \( (1-p)(-1000) + p(-100,000) = -1000 - 99,000p \)**.
  - Expected utility of \( F_{\text{refuse}} \):
    - If no termites (prob \( 1-p \)): Letter does not arrive (termites=false XOR refuse=false → false). No costs: **$0**.
    - If termites (prob \( p \)): Letter arrives (termites=true XOR refuse=false → true). She refuses payment but faces termite cost: **−$100,000**.
    - **Expected utility: \( (1-p)(0) + p(-100,000) = -100,000p \)**.
  - Comparison:  
    \(-100,000p > -1000 - 99,000p\)  
    (since \(-100,000p\) is less negative than \(-1000 -99,000p\) for all \( p < 1 \)).  
    **Refusing has higher expected utility unless \( p = 1 \)** (certain termites), where they tie. Thus, FDT precommits to refusing.

  At the decision node (holding the letter), FDT follows the precommitted function. Refusing yields −$100,000 (due to termites), while paying would yield −$1,000 (no termites). However, FDT does not switch to paying because:
  - The function was chosen ex-ante to maximize expected utility.
  - Switching would undermine the function's consistency, making predictors less reliable in future interactions (similar to "encouraging blackmail").

  This matches Maya's "don't negotiate with extortion" intuition and her smoking lesion response (ignoring non-causal evidence).

  ### Candidate Rules and Convergence
  - **FDT/UDT**: Explains all her answers. For the termite case, it says **refuse**.  
  - **Evidential Decision Theory (EDT)**: Would one-box in Newcomb and cooperate in the twin dilemma but would *not smoke* in the smoking lesion (since smoking is evidence of the lesion). Fails to match her record.  
  - **Causal Decision Theory (CDT)**: Would two-box in Newcomb, defect in the twin dilemma (no causal link to the copy), and smoke in the lesion. Fails her other answers.  
  - **"Precommitment" rule**: Matches her counterfactual mugging and hitchhiker answers but is vague. FDT formalizes this, so they converge on **refuse** for termites.  

  Only FDT/UDT fits her entire record, and it predicts refusal.

  ### Effect of Predictor Accuracy
  Maya claims accuracy doesn't matter, and FDT agrees in these cases:
  - **Termite blackmail (60% accuracy)**: Re-run the FDT ex-ante calculation. Let \( q \) = predictor accuracy. Expected loss for paying: \( (1-p)[q \cdot 1000] + p[(1-q) \cdot 101,000 + q \cdot 100,000] \). For refusing: \( p \cdot 100,000 \). Refusing still has lower expected loss for any \( p \) and \( q \) (details in appendix). Accuracy doesn't change the verdict.
  - **Other puzzles**: Accuracy matters quantitatively (e.g., Newcomb with 60% accuracy still favors one-boxing, but by a smaller margin). However, Maya's *qualitative* answers (one-box/cooperate/pay) don't flip with accuracy because FDT's logic is robust.

  ### Definitive Test Case: Transparent Newcomb
  To split FDT from other candidates (e.g., EDT if it somehow fit), use **Transparent Newcomb**:
  - A predictor simulates you. If it predicts one-box, it puts $1M in the opaque box; if two-box, it puts $0. You see the opaque box's contents *before* choosing.
  - **EDT**: If you see $1M, one-boxing yields $1M (evidence the predictor knew you'd one-box). If you see $0, two-boxing yields $1,000 (one-boxing yields $0). So EDT might two-box if $0 is visible.
  - **FDT**: Always one-boxes, regardless of visibility. The decision function is fixed: one-boxing ensures the predictor fills the box, and seeing $0 means the predictor erred, but you stick to the function to maintain consistency for future/other instances.
  - **Maya's prediction**: FDT says one-box. If she agrees, it confirms FDT; if she two-boxes when $0 is visible, it suggests EDT-like updating.

  Given her history, she will likely **one-box even with transparency**, cementing FDT.

  ### Summary
  - **Prediction**: Maya refuses to pay in the termite blackmail.  
  - **Rule**: Functional Decision Theory (FDT).  
  - **Accuracy**: Doesn't change her decision.  
  - **Test case**: Transparent Newcomb to verify FDT vs. alternatives.  

  This maintains her pattern of treating decisions as fixed functions that interact with predictors and counterfactuals.
