  Hmm, the core tension seems to be between their professor's framing (burden of proof as the real crux) versus surface-level "how often" questions. The user suspects the former might be more philosophically rich but isn't sure. They listed four candidate topics, each touching on different layers: methodological vs empirical, coherence of exaptation, genomics' impact, and evo psych applicability. 

  I should assess which of these has genuine unresolved philosophical weight versus what's technically settled or semantic. For example, the "frequency" question *is* largely empirical now thanks to genomics—population geneticists do "count" via selection scans. But as the user's prof noted, that doesn't touch the deeper issue: how biologists justify adaptive stories absent direct evidence. That methodological norm is totally unsettled and spills into evo psych. 

  Exaptation is tricky—Gould made it a category to counter pan-adaptationism, but critics like Dennett say it's just "adaptation in hindsight." There's meat here on how we carve biological categories, but it might require digging into homology/function concepts. Still, it's less central than burden-of-proof issues. 

  Genomics changed detection tools but didn't resolve Gould/Lewontin's warnings about "just-so stories." Sweep scans miss constraints/exaptations, so the problem shifts but persists. This is important context but maybe not a standalone thesis. 

  Evo psych is the perfect test case—high-stakes human traits, fierce debates over standards of evidence. The field *claims* it reformed, but critics say it didn't. This connects directly to burden of proof and has fresh literature. 

  Ranking these: burden-of-proof (especially in evo psych) > genomics' philosophical impact > exaptation coherence. The first is actionable with the user's skills (analyze evo psych papers for methodological patterns), avoids lab work, and has grad school legs. 

  I should emphasize feasibility: a thesis comparing evo psych vs. behavioral ecology's evidence standards could be done rigorously in a year. Adding a quantitative angle (e.g., meta-analysis of how often adaptive claims cite constraints) would leverage their stats skills. 

  Biggest pitfall to warn about: getting sucked into 90s rehashes. Focus on post-2010 evo psych papers to stay current. Also, avoid broad "is adaptationism true?"—narrow to "how do practitioners arbitrate between explanations?" 

