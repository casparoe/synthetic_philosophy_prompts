prompt: |-
  I run a weekly discussion group for a mix of second-year maths and philosophy students — 14 people, 75 minutes, room with movable desks. Next session is on the two-envelope paradox, and I want them to run into the problem rather than be told about it. Please design the activity.

  Rough shape I'm imagining (improve on it if you see something better): everyone pairs up, each pair gets two sealed envelopes, one containing a slip worth twice the other — amounts in points, redeemable at the end for chocolate coins or similar. Each person takes one envelope without opening it. Then I want a stage where the students themselves articulate the argument that switching is worth 25% in expectation — the "the other envelope is either half or double mine, so my expected gain is a quarter of what I hold" move — and I want that to feel airtight for a while. They should commit in writing to switching or not, with their reasons, before anything is opened. Then the envelopes get opened, results are tallied across the whole room, and the empirical result — switching coming out dead flat on average — has to collide head-on with the argument they just endorsed. After that, a second round with some twist you design, ideally one with an announced distribution so they can see when switching is genuinely worth it and why the earlier half-or-double reasoning couldn't have told them that.

  The name "two-envelope paradox" shouldn't appear in anything participants see before the debrief at the very earliest. No lecture up front — the rules of the game are the only thing I say before they're playing.

  Structure the write-up in exactly these sections, in this order, with roughly these lengths:

  1. "Materials and setup" — ~100 words
  2. "Round one: the argument surfaces" — ~200 words, how to get the 5/4 reasoning to come out of their mouths instead of mine
  3. "Round two: the tally" — ~150 words
  4. "The debrief" — ~300 words, mapping specific moments in the game onto specific parts of the fallacy (why "half or double with equal probability" can't be right at every amount, what it would take for switching to actually be worth something, and the switch-then-switch-back reductio if they find it themselves)
  5. "What will predictably go wrong" — ~150 words, first-run failure modes and fixes
  6. "What the game can't reproduce" — ~100 words, the parts of the paradox I'll have to supply myself afterwards
  7. "Where this design is most likely to fail" — ~100 words on which piece of the probabilistic explanation you'd bet against landing with this particular group, and what I'd see or hear in the room that would tell me the session failed for an interesting reason rather than a boring one — that's the part I'll actually be watching for

  One thing I keep going back and forth on: whether pairs should just swap envelopes with each other, or whether there should be some pool arrangement where you hand yours in and draw a stranger's. If you have a view on which is pedagogically better, work it into one of the sections above rather than adding a new one.
reasoning: |-
  Okay, the user runs a weekly discussion group for second-year maths and philosophy students—14 people, 75 minutes, movable desks. They want an activity for the two-envelope paradox without lecturing upfront. The goal is to have students discover the paradox themselves through an interactive game. 

  First, I need to understand the core challenge. The paradox involves thinking that switching envelopes always gives a 25% expected gain, which isn't true. The user wants students to articulate this reasoning themselves and then see it contradicted by real-world results. 

  Materials and setup: The envelopes need slips with monetary values. Using different base amounts for each pair prevents students from assuming all envelopes hold the same sums. Chocolate coins as incentives make it engaging. Movable desks allow pairing, which is efficient for 14 people. 

  Round one: Pairs get two envelopes. Students choose one but don't open it. The key is prompting them to discuss why someone might switch. Using a "Convince Your Partner" worksheet with leading questions nudges them toward the flawed reasoning. Questions like "What potential gains exist?" and "What's the expected value?" should make them verbalize the 50-50 chance of doubling or halving their money, leading to the 1.25x expectation. 

  Round two: After deciding to switch or not, they open envelopes and record outcomes. Collecting data from all pairs shows that switching doesn't yield gains on average. The user mentioned a "tally" section—emphasizing that actual gains/losses cancel out is crucial here. 

  Debrief: Here, the paradox needs unpacking. The fallacy is assuming that the other envelope is equally likely to be half or double regardless of the amount. If one envelope has X, the other has 2X or X/2, but the probability isn't 50-50 if the total in the pair is fixed. The twist in round two with announced distributions (e.g., 50/100 or 100/200) shows that knowing the distribution changes the expected value calculation. Switching is only beneficial if you have the smaller amount, which depends on the distribution. 

  Predictably, some students might not grasp why the 50-50 assumption is wrong. Using the switch-twice reductio (if switching is always better, why not switch back?) helps highlight the contradiction. Preparing to address this during debrief is key. 

  What could go wrong: Students might peek at envelopes or miscount money. Emphasizing strict rules and clear instructions can prevent this. Also, pairs switching only with each other avoids the complexity of a pool system. Keeping it simple ensures focus on the paradox. 

  Limitations: The activity doesn't cover continuous distributions or infinite expectations, which are part of the full paradox. The user will need to explain those afterwards. 

  Potential failure points: The hardest part is getting students to see why the initial assumption is flawed. If during debrief, students still insist switching should work, that indicates the paradox's grip. The user should listen for comments like "But it should average out" to identify where understanding is stuck. 

  Overall, the design encourages self-discovery, uses tangible rewards, and structured discussion to lead students into the paradox. The second round with known distributions clarifies the correct approach, making the learning process experiential and reflective.
answer: |-
  Here’s a structured activity design focusing on student discovery and cognitive conflict:

  ### 1. Materials and Setup (100 words)  
  **You provide:**  
  - 7 pairs of sealed envelopes (14 total). Each pair contains:  
    - Envelope A: Slip with value *V* (e.g., 10 points)  
    - Envelope B: Slip with value *2V* (e.g., 20 points)  
    - **Vary V across pairs** (e.g., 5/10, 8/16, 12/24) to prevent cross-pair assumptions.  
  - "Decision sheets" for each student (with columns: "Keep/Switch?", "Reason", "Points Earned").  
  - Chocolate coins for redemption.  
  **Setup:** Arrange desks into 7 pairs. Distribute one envelope pair and two decision sheets per desk pair. Students sit facing partners.  

  ### 2. Round One: The Argument Surfaces (200 words)  
  **Instructions:**  
  *"With your partner:  
  1. Each take one envelope—DON’T OPEN IT.  
  2. Discuss: If someone offered to let you SWITCH envelopes with your partner, would you? Why?  
  3. Write your individual choice (Switch/Keep) and reasoning on your sheet."*  

  **Facilitation to elicit reasoning:**  
  - Circulate and prompt pairs: *"What do you know about the two amounts? What might you gain or lose by switching?"*  
  - If stuck, ask: *"Suppose your envelope has $X. What could your partner’s have? What’s the average outcome if you switch?"*  
  - **Goal:** Students articulate: *"Partner’s envelope is either ½X or 2X, each 50% likely → Expected value = 1.25X → Always switch!"* Nudge them to write this explicitly.  

  ### 3. Round Two: The Tally (150 words)  
  **Steps:**  
  1. Students commit to Switch/Keep on sheets.  
  2. **OPEN ENVELOPES.** Partners who chose "Switch" exchange slips; "Keepers" retain theirs.  
  3. Record points earned on sheets.  
  4. **Collect class data:**  
     - Project a table: "Base Choice" (Keeper/Switcher) vs. "Final Points".  
     - Calculate average points for Switchers vs. Keepers.  

  **Result:** Averages will be statistically identical (±noise). Highlight: *"Switchers’ average ≈ Keepers’ average"* – contradicting the 25% gain.  

  ### 4. The Debrief (300 words)  
  **Key collision points:**  
  - **Contradiction:** "You argued switching *should* give +25%. Data shows it doesn’t. Where’s the flaw?"  
  - **Flaw dissection:**  
    - *Equal probability fallacy:* "Saying ‘half or double, 50/50’ assumes the *other* envelope is equally likely to be bigger/smaller *no matter what X you have*. But look at pair 1 (5/10): If you hold 5, partner *must* have 10. If you hold 10, partner *must* have 5. The probability depends on what you hold!"  
    - **Reductio ad absurdum:** "If switching is always better, why not switch back? You’d expect infinite chocolate!"  
  - **Round Two Twist (Announced Distribution):**  
    - Redistribute new envelopes with **declared rules**: *"All pairs: One envelope has 50 points, one has 100."*  
    - Students calculate: *If I have 50 → Switching gains 50. If I have 100 → Switching loses 50. Since I’m equally likely to hold 50 or 100, expected gain = 0.*  
    - **Lesson:** Switching helps **only if you know you hold the smaller amount** – impossible without distribution knowledge. The paradox’s "equal probability" assumes an impossible prior.  

  ### 5. What Will Predictably Go Wrong (150 words)  
  - **Peeking:** Students open envelopes early. **Fix:** Use opaque envelopes; emphasize "sealed until instructed."  
  - **Misrecording points:** Use integer values; have partners cross-check recorded points.  
  - **Apathy about small stakes:** Chocolate redemption is critical – make it immediate.  
  - **Pairs vs. pool:** **Use pairs** (not a pool). Pedagogically, pairs ensure:  
    - Fixed sums per group (so the flaw is visible locally).  
    - Lower logistics/complexity.  
    - Cleaner reductio ("switch with your partner, then switch back").  

  ### 6. What the Game Can’t Reproduce (100 words)  
  The activity assumes discrete, bounded values. It *can’t* show:  
  - The infinite expectation variant (e.g., when X follows a heavy-tailed distribution).  
  - Continuous case nuances (e.g., improper priors).  
  - Philosophical dimensions (e.g., epistemic vs. objective probability).  
  Post-activity, you’ll need to formalize the general case and discuss why the paradox tempts even experts.  

  ### 7. Where This Design Is Most Likely to Fail (100 words)  
  **Failure point:** Students accepting the empirical result *without resolving the paradox* – e.g., *"Math must be wrong; just trust the data."*  
  **Signal of deep failure:** During debrief, they dismiss the 25% argument as "obviously silly" without grasping *why* it’s seductive. This shows they missed the *cognitive trap* – the core of the paradox.  
  **Mitigation:** Preempt by asking: *"Why did so many of you find the 25% argument convincing at first?"* Force confrontation between intuition and evidence.  

  ---

  **Why this works:** The pair structure creates self-contained paradox instances, the decision sheets force reasoning articulation, and the announced-distribution twist surgically isolates the fallacy. The chocolate makes the contradiction *viscerally* unsatisfying.
