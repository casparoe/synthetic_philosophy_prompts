answer: |-
  ## Sestina of the Shifting Ship

  The salt has gnawed the ancient, curving **keel**,
  Sea-worms have riddled through the oldest **plank**.
  The wind still strains against the towering **mast**,
  The tide still tugs the fraying, tarred **rope**,
  Salt crusts the patched and sun-bleached **sail**,
  And weary hands still grasp the heaving **oar**.

  The captain orders: "Swap that splintered **oar**!"
  (He trusts the strength beneath the trusted **keel**).
  "Unbend the rip that scars the straining **sail**,
  And fit this seasoned piece of seasoned **plank**."
  The rigger knots the fresh, strong hempen **rope**,
  Securing canvas to the steadfast **mast**.

  Is this the same that held the first stout **mast**
  When heroes drove the bronze-bound biting **oar**?
  The question knots the mind like tangled **rope**.
  Does essence dwell within the central **keel**,
  Or cling to each particular grain of **plank**?
  Is identity the wind within the **sail**?

  One plank replaced. Still billows the wide **sail**.
  Then two. The rigging hums around the **mast**.
  A third. The dock holds salvaged, weathered **plank**.
  The crew rows on, unchanged, with steady **oar**.
  The structure holds, defined by form and **keel**,
  The function flows through every line and **rope**.

  Then Hobbes's thought: each saved, discarded **rope**
  And timber stored. While *this* ship flies its **sail**,
  A second shape takes form beside the **keel**
  Where barnacles once clung. A second **mast**
  Rises from scraps that once propelled the **oar**.
  They build anew with every saved old **plank**.

  Now two hulls float! The first, with swapped-out **plank**,
  Still rides the waves, bound tight with current **rope**.
  The second, resurrected, lacks an **oar**
  But boasts the sun upon an ancient **sail**
  Woven from threads beside the first ship's **mast**.
  Which claims the lineage of the primal **keel**?

  Does *order* matter? If we swap each **plank**
  By rigid schedule, not by chance-torn **rope**,
  Is this more truly Theseus than the **oar**-less
  Ghost-ship ashore? Is essence in the **sail**'s
  Precise repair, or the enduring **mast**'s
  Unbroken line above the steadfast **keel**?

  **Envoi**

  Prince, both ships fly the **sail** that bears his name,
  The first by function, **oar** and **rope** and tide,
  The second by the **plank** and **mast** reclaimed.
  The **keel**? It split its claim when planks first died.
  This sestina, too, through shifts remains the same:
  Its pattern holds, though parts may be supplied.
  (But change each word? Would *that* still be the poem?)

  ---

  **Notes on the Form Doing the Work:**

  1.  **Strict Rotation = Scheduled Repair:** The relentless cycle of the six end-words (keel, plank, mast, rope, sail, oar) mirrors the systematic, rule-bound replacement of parts. The poem's identity persists solely through this ordered recurrence, arguing that the *pattern of persistence* defines identity, not the specific atoms.
  2.  **Hobbes's Wrinkle (Stanzas 4 & 5):** The poem explicitly builds the second ship ("A second shape...", "A second mast") using the salvaged parts ("saved, discarded rope", "every saved old plank"). Both resulting ships are presented as claimants to the original identity.
  3.  **The Question of Order (Stanza 6):** The poem directly asks if the *rule-bound* nature of the repairs ("rigid schedule") makes the first ship more authentic than the reassembled one, or if the enduring structure ("enduring mast", "steadfast keel") is what matters. The sestina form itself, relying on strict order, implicitly argues that the rule *does* matter for maintaining identity through change.
  4.  **The Envoi's Double Claim:** It doesn't dodge the two ships. It states both claim the identity ("both ships fly the sail that bears his name"), one through continuous function and one through material origin. The sestina resolves its *own* identity crisis by asserting "Its pattern holds, though parts may be supplied," directly applying the Ship's logic to itself.
  5.  **The Cheeky Final Question:** The parenthetical directly asks the synonym question, mirroring the material substitution of the ship. It leaves it hanging, implying that the poem, like the ship defined by its pattern, would *not* be the same with swapped words – its identity relies on these specific components in this specific recurring order. The form *is* the argument.
