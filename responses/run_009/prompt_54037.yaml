prompt: |-
  You're a professional philosopher of mind, so I need you to actually engage with this like one, not give me a wikipedia summary. Please think carefully and maybe brainstorm a bit before you commit to an answer -- I want your real considered view, not the safe one.

  I just had a three-hour argument with my friend Maya about the extended mind thesis (Clark & Chalmers, Otto and his notebook, you know the drill) and we could not land on a principle. So I'm going to give you my gut verdicts on a bunch of cases and I want you to tell me what principle, if any, captures all of them, and if nothing captures all of them, tell me which verdicts have to go and why.

  My verdicts:

  - Otto's notebook (used constantly, trusted, automatically endorsed): obviously part of his mind, that's the whole point.
  - My phone's notes app, which I use the exact same way Otto uses the notebook: also part of my mind, feels identical.
  - My GPS: here's where it gets weird. I rely on it for navigation the way Otto relies on his notebook, I trust it completely, and I basically can't get around a new city without it. But it feels LESS like part of my mind than the notes app, and I can't say why. Maybe because it computes a route rather than stores a belief?
  - My wife: she remembers basically everything about our shared life that I forget, and vice versa. I trust her memories about our anniversary stuff more than my own. I honestly think yes, her memory counts as an extended part of my mind here, at least for those domains. Maya said that's crazy and that the mind can't extend into ANOTHER person, only into objects. But I don't see why a notebook is fine and a spouse isn't.
  - A calculator: Maya tried to make me say my mind extends into the calculator, since I trust it and use it constantly for arithmetic. And I say no, flat no, I never feel like I "believe" 17 x 23 = 391 until I've done it in my head. But then Otto doesn't "compute" anything either, so I'm not sure what's doing the work in my no.
  - A chess engine I'm allowed to consult during a game: definitely not part of my mind, that's just cheating, it's a tool I use. But Maya pointed out this feels arbitrary next to the GPS yes-ish.
  - My password manager: it "knows" all my passwords and I have literally no idea what they are. Do I believe my passwords? This one made both of us laugh and then get quiet. I lean yes, weirdly.

  So: is there a principle that gets all of these or close to it? I suspect the Clark-Chalmers style criteria (reliably available, automatically endorsed, easily accessible) are going to rubber-stamp the calculator and the chess engine, which I refuse. Maybe there's something about storage vs. computation, or about ownership/integration that fixes it? And tell me what your principle says about the password manager, because I keep flip-flopping on that one. Also please be honest if you think one of my verdicts is just flat wrong -- Maya already thinks the spouse one is, so you'd be settling a bet.
reasoning: |-
  Okay, I see the user is deeply engaged with the Extended Mind Thesis (EMT) and has been debating specific cases with a friend. They've listed their intuitive judgments on various examples and are seeking a unifying principle that explains all their verdicts. If that fails, they want to know which intuitions should be revised.

  First, I need to recall Clark and Chalmers' original criteria: constant access, automatic endorsement, past endorsement, and accessibility. The user's examples challenge these criteria. For instance, they accept Otto's notebook and their phone's notes app as part of the mind but hesitate on GPS and reject the calculator and chess engine.

  The user's spouse example is particularly interesting. They feel their spouse's memory acts as an extended part of their mind for shared experiences, even though it's another person. Maya disagrees, arguing minds can't extend into other people. The user doesn't see why a notebook is acceptable but a spouse isn't. This raises questions about agency and the distinction between objects and other conscious beings.

  The calculator case is a sticking point. The user rejects it because they don't feel they believe the answer until they compute it mentally. But Otto doesn't compute either; he retrieves. So why the difference? Maybe computation versus storage is key here. Storage (like the notebook) feels like belief, while computation (like the calculator) feels like outsourcing a process.

  The GPS is tricky. They rely on it heavily but feel it's less part of their mind than the notes app. Perhaps because the GPS provides dynamic, computed routes rather than static information. It's not just recalling stored data but generating new solutions.

  The password manager is a fascinating edge case. They don't know their passwords but trust the manager. They lean towards yes, which suggests that the information is functionally equivalent to a belief, even if not consciously accessible. But does that mean the manager is part of their mind? Or just a tool?

  The chess engine is a clear no for them. But why? It's similar to the calculator. Both are tools for computation. The GPS also computes, yet they're ambivalent. Maybe it's about the nature of the task: navigation vs. game strategy. Or perhaps it's about integration into their cognitive processes.

  I need to find a principle that accounts for all these intuitions. Ownership? But the spouse isn't owned. Integration? How is the notebook more integrated than the GPS? Maybe it's about the type of cognitive process: storage and retrieval of personal data vs. computation or problem-solving. The user seems to accept external storage (notebook, notes app, password manager) but rejects external computation (calculator, chess engine). The GPS straddles both—it stores maps but computes routes.

  The spouse case complicates this. If the spouse is storing shared memories, that's storage, not computation. Yet Maya objects because it's another person. The user's intuition might stem from deep trust and interdependence, making the spouse's memory function as their own. This touches on relational autonomy and distributed cognition.

  The password manager: it stores data the user has endorsed (by saving passwords) and is automatically trusted. By EMT criteria, it should count. The user's lean towards yes aligns with this, though the lack of conscious access might feel odd. But Otto doesn't recall the notebook contents until he looks, so it's similar.

  Possible principle: Cognitive integration through reliable, automatic, and endorsed storage of personal information, but not computation. However, GPS computes, yet they're unsure. Maybe computation that's transparent (like GPS) vs. opaque (like chess engine)? But the calculator is transparent and still rejected.

  Another angle: The distinction between cognitive processes that are constitutive vs. instrumental. Constitutive processes are part of the mind's machinery, while instrumental are tools. But how to differentiate? For the user, storage feels constitutive (beliefs are stored externally), while computation feels instrumental (tools to achieve a result).

  The spouse case: If we consider the spouse as part of a coupled system, where their memory is reliably accessed and automatically endorsed, it could fit EMT. But the objection is that another person has agency, which might violate the "individual mind" concept. However, EMT doesn't specify non-biological, so why exclude other people? Perhaps agency is key—the spouse can choose not to provide information, whereas a notebook can't. That introduces unreliability based on another's will.

  Password manager: It's passive storage, similar to the notebook. The user sets it once, and it reliably returns the password. No computation involved. So by the storage principle, it should be part of the mind. Their "lean yes" seems consistent.

  Chess engine: Actively computes strategies. The user uses it as a tool but doesn't internalize the moves as their own beliefs. Computation here is creative problem-solving, which feels external.

  Calculator: Similar to chess engine. The user doesn't believe the result until they verify it mentally. So computation isn't trusted in the same way as retrieval.

  GPS: Computes routes but is trusted automatically. The user relies on it but feels less integrated. Perhaps because the computation is complex and not transparent? Or because navigation involves continuous interaction, making it feel more like a tool than an extension.

  Refining the principle: External resources count as part of the mind if they serve as passive storage of pre-endorsed information, are reliably available, automatically trusted, and require no further computation by the user. This covers Otto's notebook, notes app, password manager, and possibly the spouse for stored memories. It excludes calculator, chess engine. GPS is tricky because it stores map data but computes routes. If the GPS only retrieved stored routes (like a saved route), it might fit, but dynamic computation pushes it out.

  The spouse: If the spouse simply retrieves shared memories without adding interpretation, it's storage. But in practice, recalling shared events involves reconstruction, which is a form of computation. That might blur the line. However, the user trusts it automatically, so perhaps it still fits.

  Maya's objection to the spouse might be about the separateness of minds. But if EMT allows extension into objects, why not other people? Unless we consider that another person's mind has its own cognitive processes, making the extension less direct. However, Clark and Chalmers focused on the functional role, not the medium.

  In conclusion, the user's intuitions align with a principle emphasizing passive storage over active computation. The spouse could fit if the memories are straightforward retrievals. GPS might be an outlier because it mixes storage and computation. The password manager fits as passive storage. Calculator and chess engine are active computation tools, hence excluded. The user might need to adjust their GPS verdict or accept it as a borderline case. The spouse is defensible if viewed as a reliable external memory source, though the agency issue remains. Acknowledging that EMT can extend to other people challenges traditional individualism but is logically consistent with the original thesis.
answer: |-
  After wrestling with your cases and the underlying tensions, I don't think Clark & Chalmers' original criteria (constant access, automatic endorsement, past endorsement, accessibility) can capture your intuitions without significant revision. Your refusal to accept the calculator and chess engine—while embracing the password manager and spouse—reveals a deeper principle at work. Here's my analysis and proposed principle:

  ### Your Verdicts & My Assessment:
  1.  **Otto's Notebook & Your Notes App:** Agree. Core EMT examples. Functionally equivalent to biological memory.
  2.  **GPS:** Your hesitation is telling. While it meets formal EMT criteria (reliable, automatic, trusted), its *computational agency* creates distance. It doesn't just *store* data; it actively *generates* novel solutions (routes) in response to dynamic inputs. It feels like a collaborator, not transparently *you*. **Verdict:** Borderline, leaning *out*. Your intuition highlights a flaw in pure EMT.
  3.  **Your Wife:** **I side with you over Maya.** EMT's core argument is *functional equivalence*. If your wife's recall of shared events is as reliable, automatic, and seamlessly integrated into your decision-making as Otto's notebook, then *functionally*, her memory serves *your* cognitive process just like the notebook. The "another person" objection conflates metaphysics with cognitive function. What matters is the *role* it plays in *your* cognitive loop. If her recall is as automatic and trusted as consulting your own memory, it extends your mind. Agency *can* be shared without breaking extension (consider symbiotic AI on the horizon).
  4.  **Calculator:** Your "flat no" is justified. EMT struggles here. The calculator performs the *cognitive operation itself*. You don't *believe* its outputs until you (perhaps implicitly) verify its function or result. It replaces computation, rather than storing pre-endorsed content or dispositional beliefs. **Verdict:** Correct exclusion. EMT *should* exclude tools performing core cognitive *processing*.
  5.  **Chess Engine:** Similar to the calculator. It performs the strategic thinking *for* you. It doesn't extend *your* mind; it *supplants* your cognitive process with an external one. Calling it "cheating" highlights this – it's outsourcing the core cognitive labor of the game. **Verdict:** Correct exclusion. Consistent with calculator.
  6.  **Password Manager:** Your "lean yes" is spot-on. This is Otto+! It stores pre-endorsed, dispositional "beliefs" (your passwords). You don't need to know them consciously; your access is automatic and trusting. The *content* (the specific password string) is *functionally identical* to a stored belief you could recall, even if you can't introspect it. The lack of conscious access is irrelevant – your biological memory has inaccessible dispositional states too.

  ### The Principle: The Cognitive Integration Constraint
  Your intuitions point towards a refinement of EMT: **An external resource counts as part of the mind *only if* it functions as *integrated storage or retrieval* of *pre-endorsed* dispositional states (beliefs, memories), *without performing novel cognitive operations on the fly*.**

  *   **"Integrated Storage/Retrieval":** Emphasizes the *passive* role relative to the user's cognitive system. The resource is a repository, not an active processor. (Captures Notebook, Notes App, Password Manager, Wife-for-memory).
  *   **"Pre-endorsed Dispositional States":** The content must have been endorsed by the user *prior* to storage (implicitly or explicitly) and be treated as a standing belief, ready for deployment. This distinguishes stored *beliefs* (Otto's address) from computed *results* (calculator output, chess move).
  *   **"Without performing novel cognitive operations":** This is key for excluding calculators/chess engines/GPS-as-router. These resources *generate* new cognitive content (solutions, strategies, routes) based on inputs and their own internal processes. They are cognitive *agents* in the loop, not mere *extensions*.

  ### How the Principle Handles Your Cases:
  *   **Otto/Notes App/Password Manager:** Clear cases of integrated storage/retrieval of pre-endorsed dispositional states (addresses, notes, passwords). No novel computation occurs *at the time of access*. The resource simply delivers the stored state.
  *   **Wife (for shared memories):** If her recall is truly automatic and trusted for specific, pre-defined domains (like your anniversary date), it functions as integrated retrieval of a pre-endorsed dispositional state (your shared belief about the date). She's not *computing* the answer; she's recalling a stored fact, acting as your external memory module. **Maya loses the bet.**
  *   **Calculator/Chess Engine:** Perform novel cognitive operations (arithmetic, strategic evaluation) *on demand*. They generate new content based on inputs and their programming. They are not retrieving pre-endorsed beliefs *of yours*; they are *creating* new cognitive outputs. Excluded.
  *   **GPS:** **This is where your intuition clashes slightly with the refined principle, and *your intuition is likely right*.** A pure map *display* (storing/retrieving spatial data) might fit. But a *route-calculating* GPS performs novel computation – it generates a solution path based on current location, destination, traffic, etc. It's more like the calculator than the notebook. The principle would exclude it as a *cognitive extension*, though it's a deeply integrated *tool*. Your gut feeling that it's "LESS like part of my mind" is tracking this computational agency. **Verdict:** Principle excludes it; your intuition is defensible.
  *   **Spouse (Potential Conflict):** What if you asked your wife, "What should we do about this problem?" and she *reasoned* and gave novel advice? The principle would *exclude* this use – she's performing novel cognitive operations. Only her function as a *memory store* for *pre-shared* facts qualifies. This preserves the distinction Maya worries about without excluding her entirely.

  ### Why This Works Better Than Standard EMT
  Standard EMT is too permissive because "automatic endorsement" can apply to the *output* of a calculator or chess engine just as easily as to a notebook entry. The **Cognitive Integration Constraint** adds crucial teeth by focusing on the *functional role* of the resource: is it *storing/retrieving your beliefs* or *performing cognitive work for you*? It captures your core insight that *storage* feels like extension while *computation* feels like tool use, even when equally trusted and relied upon. The Password Manager passes because it's pure storage/retrieval of your pre-endorsed states, just like Otto's notebook. The principle also validates your radical (but sound) inclusion of the spouse *for memory retrieval*, while explaining why outsourcing reasoning to her feels different.

  **My Honest Take:** Your intuitions are largely coherent and point towards a more defensible version of EMT. Maya is wrong about the spouse *for memory*, but right that tools performing core cognitive operations (calculator, chess engine, route-calculating GPS) shouldn't count. The password manager *is* part of your mind – embrace the weirdness! The biggest tension is the GPS, but your gut feeling that its computational nature creates distance is philosophically significant and worth keeping. It highlights that not all deeply trusted cognitive tools *extend* the mind; some *augment* it by performing external work. The boundary is fuzzy, but your cases help clarify it.
