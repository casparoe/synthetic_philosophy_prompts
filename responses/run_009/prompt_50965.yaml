prompt: |-
  I run a discussion group at a reentry program — guys in their twenties to fifties, most of them didn't finish high school, plenty smart, and every one of them has had a parole officer, judge, ER nurse or cop decide they were lying or exaggerating when they weren't. Next month I want to do one session on epistemic injustice — the testimonial and hermeneutical kinds — but with no jargon and no readings, 50 minutes, a whiteboard. Plan it for me, don't just explain the view: what has to come first and what rides on it, whether testimonial injustice can be taught before hermeneutical or the other way around, and what example should carry the whole thing — is the classic one about people who suffered sexual harassment before anyone had the words for it right for this crowd, or would something like a patient whose chronic pain keeps getting read as drug-seeking do better work, and why? Then the misconceptions they'll walk in with or form on the spot — I'm guessing "anytime somebody doubts you, that's an injustice" and "the fix is to just believe everyone" — and exactly where in the sequence I need to head each off, plus what I should openly refuse to cover at this level and say so. End with one question I can ask that would show me they've got the difference between being wrong about a person and wronging them epistemically. Keep it under 650 words — I'll be reading this off my phone at 8am.
reasoning: |-
  Okay, the user runs a discussion group at a reentry program for men who've faced systemic distrust. They need a concrete, jargon-free 50-minute session on epistemic injustice, using a whiteboard. The plan must sequence testimonial and hermeneutical injustice effectively, choose relatable examples, preempt common misconceptions, and include a diagnostic question.

  First, assessing the audience: these are smart individuals with lived experience of being disbelieved by authority figures (POs, judges, medical staff). They don't need theoretical explanations—they need to recognize patterns they've endured. The chronic pain example will resonate more than sexual harassment here because it mirrors their encounters with healthcare skepticism and avoids potential triggers.

  For structure, testimonial injustice must come first. It's more intuitive—starting from direct interpersonal experiences ("they didn't believe me") creates footing before introducing the systemic layer of hermeneutical injustice. The "drug-seeking patient" example does double duty: in part one it shows testimonial injustice (being distrusted), and in part two it transitions to hermeneutical (how medical systems label patients). This avoids needing separate case studies.

  Critical misconception traps: 
  - "Every doubt is injustice" must be preempted immediately after defining testimonial injustice. Clarify that reasonable skepticism exists (e.g., improbable claims without context) and injustice is prejudice-based dismissal. 
  - "Just believe everyone" gets addressed during the harm discussion—showing how blind trust ignores credibility cues and prevents actual justice.

  What to explicitly exclude: structural oppression discussions (too broad) and solutions (beyond scope). Focus only on recognition today.

  The closing question tests if they distinguish between being factually wrong (bad luck) and prejudicially wronging someone (injustice). The ER example makes it tangible: misdiagnosis isn't necessarily epistemic injustice; bias-driven dismissal is.

  Timing is tight—each segment must be disciplined. Whiteboard use is key: simple terms + stick figures will aid comprehension without lecturing. Ending with "what's one time you weren't believed?" centers their expertise, turning theory into shared validation.
answer: |-
  Here’s a tight, actionable 50-minute plan focused on recognition and relevance. **Skip jargon entirely** — use plain synonyms.

  ---

  ### **Goal:**  
  Help them name/recognize two patterns:  
  (1) When someone dismisses you **because of prejudice** ("testimonial injustice").  
  (2) When **no one has the words** to take your experience seriously ("hermeneutical injustice").  

  ### **Flow & Timing:**  
  1. **Hook (5 min)**:  
     *Ask: "Raise your hand if you’ve ever told the truth to someone in authority — PO, nurse, judge — and they acted like you were lying or exaggerating. What did that feel like?"*  
     Let 2-3 briefly share. **Board:** "NOT BELIEVED" → circle it. *"Today we put a name to why that happens — and why it’s not just bad luck."*  

  2. **Pattern 1: "They Don’t Trust People Like Me" (Testimonial Injustice) (15 min)**  
     - **Define:** *"Sometimes people decide not to believe you because of a bias. They think: 'People with his background/color/record are all liars.' It’s not about you — it’s about their prejudice."*  
     - **Example (USE THIS):**  
       *"Imagine your buddy tells an ER nurse: 'My back pain is a 9/10, I can’t stand.' Nurse thinks: 'He’s just drug-seeking.' But he has a slipped disk. The nurse doubts him because of stereotypes, not facts."*  
     - **Why this example works:** They know this scenario intimately (bias based on record/appearance). Avoids sexual harassment (potentially triggering/complex).  
     - **WHITEBOARD:**  
       `PATTERN 1: DISMISSED BY BIAS` → Draw stick figure + thought bubble: "Seen as untrustworthy."  

  3. **CRITICAL INTERRUPTION: Head Off "Any Doubt = Injustice" (3 min)**  
     *"Important: Not every time someone doubts you is this injustice. Cops should question an alibi. But if they dismiss you ONLY because you’re Black, or an ex-con, or poor — THAT’S the bias pattern. It’s about the WHY."*  

  4. **Pattern 2: "No One Gets It Because There’s No Language" (Hermeneutical Injustice) (12 min)**  
     - **Define:** *"Sometimes your experience is so new or ignored by society, nobody has the words to understand you — even if they want to. It’s not just one person doubting you; the whole system lacks the concept."*  
     - **Same Example Extended:**  
       *"Now imagine your buddy has a rare nerve pain disorder doctors don’t recognize. They say: 'Your scans look fine, it’s in your head.' It’s not that one nurse is biased — medicine hasn’t created the tools to take his pain seriously yet."*  
     - **WHITEBOARD:**  
       `PATTERN 2: NO WORDS FOR YOUR REALITY` → Draw a fog between two people.  

  5. **Why This Order?**  
     Testimonial (Pattern 1) **MUST come first**. It’s personal/immediate ("that cop did this to me"). Hermeneutical (Pattern 2) builds on it as systemic ("why does this keep happening?"). Reversing feels abstract.  

  6. **Harm & Head Off "Just Believe Everyone" (5 min)**  
     - *"Why does this matter? Pattern 1 robs your dignity. Pattern 2 makes you feel crazy. Both deny you help/justice."*  
     - **STOP MISCONCEPTION:** *"The fix isn’t 'believe everyone no matter what.' That’s dangerous. It’s about: (1) Checking your biases, and (2) Creating space for experiences we don’t yet understand."*  

  7. **What We’re NOT Covering (1 min):**  
     *"We won’t solve all injustice today or debate every unfair moment. We’re naming two specific traps. Solutions take longer."*  

  8. **Closing Question (4 min):**  
     *"Your neighbor insists your TV is too loud. You check — it’s off. He was wrong, but was it injustice? Why or why not?"*  
     - **Listen for:** They should note he wasn’t *biased* (Pattern 1) and *had the concept* of loud TVs (Pattern 2). He was just mistaken — no *epistemic wrong*.  

  ---

  ### **Why This Works For Your Group:**  
  - **Chronic pain example** > sexual harassment: Directly mirrors their ER/PO distrust experiences; medical bias is visceral.  
  - **Testimonial first** roots theory in their lived reality.  
  - **Misconceptions addressed** at point of maximum confusion (right after definitions).  
  - **No readings/jargon** — concepts emerge from discussion.  
  - **Ending question** isolates epistemic wrong vs. ordinary error.  

  **Under 650 words. Ready to execute.** Bring markers!
