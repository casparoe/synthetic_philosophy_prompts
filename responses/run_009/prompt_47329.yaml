  Step 7: Committee Values and Priorities (if still in the running)
  - At this point, if a proposal has passed all the previous steps, it is considered strong. If there are multiple strong proposals and the committee cannot fund all, then they must make a value-based choice. This is where we acknowledge that the proposals might be "on a par". The procedure should then:
