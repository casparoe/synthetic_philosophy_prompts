answer: |-
  You conflate two distinct issues. First, entrenchment isn't a *justification* for induction in the traditional sense Hume demanded and found impossible; it dissolves that very demand by shifting the question to which hypotheses are lawlike and projectible *given our actual inductive practices*. The record of past projections doesn't justify projection simpliciter but determines which predicates *are* projectible *for us*. Second, while "all emeralds are grue" is equally well-confirmed *by the evidence alone* up to time *t*, "grue" itself has *not* been projected. Entrenchment accrues to predicates *actually used* in projections, not merely satisfied by instances. "Green" has been projected countless times prior to any consideration of emeralds, accumulating vast entrenchment; "grue" has not been projected at all – it was invented as a counterexample. Its "record" is parasitic, not earned through actual inductive practice. Why should a predicate never before projected suddenly be projectible merely because it fits past data when introduced?

