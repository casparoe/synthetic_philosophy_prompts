prompt: |-
  I spent thirty-five years as a population ecologist, most of them running small-mammal surveys in tropical dry forest, and in retirement I have been reading philosophy of language. Quine's discussion of the field linguist and the native's word "gavagai" in Word and Object struck me with unexpected force, because it describes a problem I personally fumbled for decades without knowing it had a name. Whenever my guides used a vernacular term, I silently translated it as a Linnaean species, and my species lists were only as good as that translation. Quine's point, as I understand it, is that all the observational evidence available to the linguist — elicited assent and dissent in the presence of scenes, pointing at animals, which utterances co-occur with which — still fails to determine whether the word means rabbit, undetached rabbit parts, or a stage in the career of a rabbit. The evidence for each hypothesis is identical. I have since learned that this is not a puzzle about exotica: it is the ordinary condition of ethnobiological fieldwork.

  Here is what I would like. I now advise a small program that trains field teams to do rapid ethnobiological inventories — a few weeks per community, one consultant speaker at a time, output feeding into environmental impact assessments and, occasionally, land-rights documentation where a species list carries legal weight. These teams have no philosophical training and no interest in it. Please write them a decision procedure, grounded in what Quine actually established, for handling vernacular terms for organisms: the questions to ask, in what order, what counts as a sufficient answer to each, and — this is the part I most want done honestly — where the procedure must stop and record ambiguity rather than resolve it. I take the indeterminacy thesis to imply that no amount of clever field protocol fixes a unique "correct" crosswalk from a folk term to a scientific species, so a procedure that pretends otherwise is lying to its users; the conceptual work is in deciding which of Quine's distinctions must survive the simplification into something a field assistant can run in an afternoon, and which can be dropped without harm.

  Then apply the procedure to three cases I have actually met in some form: (1) a single term covering both the juvenile and adult of what I would call two species, with the community treating the juvenile-to-adult transition as a change of kind rather than of individual; (2) neighboring communities whose apparently equivalent terms pick out overlapping but non-identical sets of species, so that a shared checklist quietly forces a choice between their classifications; and (3) a term that seems to track ecological role — roughly, things that raid the maize — rather than any clade, and so cuts across every level of my taxonomy at once. At least one application should end where I do not want it to: with the admission that the clean species-by-species inventory the consulting agency demands cannot be honestly produced from the evidence the procedure licenses. Finally, state plainly what the procedure cannot do, and where the residual judgment calls are — including the uncomfortable one about who bears responsibility when a legal document needs a single answer and the philosophy says the facts do not supply it.
reasoning: |-
  We are given a task to create a decision procedure for field teams conducting rapid ethnobiological inventories. The procedure must be grounded in Quine's indeterminacy of translation, particularly the "gavagai" example, which shows that observational evidence alone cannot uniquely determine the reference of a term (e.g., whether it refers to a whole rabbit, undetached rabbit parts, a rabbit stage, etc.). The procedure must be practical for field assistants with no philosophical training and must record ambiguity when it arises.

  Key principles from Quine:
  1. Indeterminacy: There is no unique correct translation; multiple hypotheses (like rabbit, undetached rabbit parts, rabbit stage) can be equally consistent with all observable evidence.
  2. The evidence includes: elicited assent/dissent in the presence of scenes, pointing, co-occurrence of utterances, etc.
  3. We must acknowledge that the procedure cannot fix a unique "correct" crosswalk to a Linnaean species.

  Therefore, the procedure must:
  - Guide the field worker through a series of questions to narrow down the possibilities.
  - Record when multiple interpretations are consistent with the evidence and stop at ambiguity.

  Structure of the decision procedure:

  We break down the investigation of a vernacular term V into steps. At each step, we ask a question and interpret the answer. If at any point the evidence is consistent with multiple interpretations, we record the ambiguity and do not force a unique resolution.

  The goal is not to find a unique Linnaean species but to document the meaning of V as accurately as the evidence allows, including the ambiguities.

  Steps:

  1. **Initial Scene Association**: 
     - Ask: "When you see [describe a scene where the organism is present, e.g., a particular animal in the forest], do you call that V?"
     - What counts as sufficient: Repeated assent in the presence of the organism and dissent when the same organism is absent (or a different organism is present) in similar settings. Also, note if the consultant points to the organism and says V.
     - Record: The organism(s) present in the scene. This gives an ostensive definition.

     However, Quine warns that pointing at a rabbit could be interpreted as pointing to rabbit parts, rabbit stages, etc. So we need to test for these.

  2. **Part/Whole Distinction**:
     - Ask: "If I point to a part of the animal (e.g., a leg of the animal you just called V), is that also V?" 
       - If dissent: Then V likely refers to the whole animal and not its parts.
       - If assent: Then V might refer to undetached parts or the whole? We need to test further.
     - Further test: Point to a detached part (e.g., a leg that has been separated). Ask: "Is this V?"
       - If assent: Then V refers to both attached and detached parts? This might lead to ambiguity or a different concept.
       - If dissent: Then V might refer only to the whole animal or to attached parts? 
     - Record: The outcome and whether it is consistent with V meaning the whole animal, attached parts only, or detached parts as well.

     If we get assent for the attached part but dissent for the detached, we might have a concept of the animal as a whole (because the part is only V when attached). But note: Quine's point is that we cannot rule out that the native's ontology does not have whole animals but only temporal stages or parts. So we must move to the next test.

  3. **Temporal Stage vs. Persistent Individual**:
     - Ask: "If I see a baby [V] and it grows up, is the adult still V?" 
       - If assent: Then V might refer to the persistent individual through time (the whole animal over its lifetime).
       - If dissent: Then V might be stage-specific (e.g., only the juvenile form, or only the adult).
     - Alternatively, if the community treats the juvenile-to-adult transition as a change of kind (as in case 1 we are to consider), we might get dissent.

     But note: We might have to test with multiple individuals. Also, we should test with non-living changes: e.g., if the animal is cut in half, is each half V?

  4. **Generality Across Individuals**:
     - Show the consultant several individuals of what the field biologist considers the same species (as determined by morphology, etc.). Ask for each: "Is this V?"
     - Then show individuals of what the biologist considers different species (but similar) and ask the same.
     - Record: The set of individuals (or species) that get assent. This helps define the extension of V.

     However, we must be cautious: the consultant might group by ecological role (as in case 3) or by other features.

  5. **Ecological or Behavioral Context**:
     - Ask: "What does V do?" or "Where do you find V?" or "What is V known for?"
     - This might reveal if V is defined by behavior (e.g., raiding maize) rather than morphology.

     Also, note co-occurrence with other terms: e.g., if they say "V" only when the animal is eating maize, that might indicate the behavioral definition.

  6. **Contrast with Other Terms**:
     - Ask: "Is there a different word for [a similar organism]?" and show an organism that is similar but not in the initial set.
     - This helps define the boundaries of V.

  The procedure must stop and record ambiguity when:
  - The evidence from the above steps is consistent with more than one interpretation (e.g., the term might refer to the whole animal or to attached parts, but we cannot determine which).
  - Or when the extension of V does not map cleanly to a single Linnaean species (e.g., it covers two species, or only part of one).

  Now, we apply this procedure to the three cases:

  **Case 1: Single term for juvenile and adult of two species, with the community treating the juvenile-to-adult transition as a change of kind.**

  - Step 1: We might start with a juvenile of species A and get assent for V. Then show an adult of species A: dissent? Then show a juvenile of species B: assent? Adult of species B: dissent? 
  - Step 3: Ask about growth: "If this baby V grows up, is it still V?" They say no, and they might even say it becomes a different term (say, W). 
  - Step 4: We then show adults of species A and B and ask for the term. They might say W for both? 
  - Outcome: The term V applies to the juvenile forms of two species. The extension of V is two species, but only the juvenile stage. 

  However, note: the transition is seen as a change of kind, so the same individual changes from V to W. This is a stage-based ontology, not a species-based one.

  The procedure would record:
    V: juvenile of species A and juvenile of species B.

  But the Linnaean inventory requires species. We have two options:
    Option 1: List species A and B, but note that the vernacular term V does not refer to the adults of these species.
    Option 2: Or if the inventory is to record the vernacular terms and their meanings, then we must note that V is a life stage term and not a species term.

  But the problem: the consulting agency demands a clean species-by-species inventory. Here, we cannot honestly produce a species list that matches the vernacular term V because V does not correspond to any single species (it covers two) and does not even cover the entire life cycle of those species.

  Thus, we must stop and record ambiguity: the term V does not map to a single species or even to a set of species in the usual sense (because it only maps to the juvenile forms). The inventory must either:
    - Report two species (A and B) but with the note that the vernacular term V only refers to their juveniles, and there is another term W for the adults (which may cover both species?).
    - Or, if the agency insists on a one-to-one mapping, we cannot provide it without misrepresentation.

  **Case 2: Neighboring communities with overlapping but non-identical extensions for apparently equivalent terms.**

  Suppose we have two communities, C1 and C2. We run the procedure for term V in C1 and term V' in C2.

  - For C1: We determine the set of species that V refers to (by steps 1, 4, and 6). Let’s say V in C1 = {species A, B}.
  - For C2: We determine V' = {species B, C}.

  Now, if we are making a shared checklist, we have to choose between:
    Option 1: Use the union: {A, B, C} but then both communities might not recognize all as V or V'.
    Option 2: Use the intersection: {B} but then we miss A and C.

  The procedure in each community would have recorded the exact extension of V and V'. But when forced to produce a single checklist, we must note that the communities do not have identical classifications.

  The procedure must stop: we cannot honestly produce a checklist that is "shared" without noting the differences. The ambiguity is that the term V in C1 and V' in C2 are not equivalent. The inventory should report separately for each community.

  However, if the legal document requires a single list, then we must choose. The procedure cannot resolve this without going beyond the evidence. We must record that the choice (e.g., to take the union, the intersection, or one community's system) is a judgment call and not determined by the facts. Responsibility for that choice lies with the program or the agency.

  **Case 3: Term tracking ecological role (e.g., "things that raid the maize")**

  - Step 1: We might get assent for V in the presence of a rat, a bird, and a monkey, all in the maize field.
  - Step 4: Show the same animals in a different context (e.g., in the forest, not raiding). Ask: "Is this V?" We might get dissent.
  - Step 5: Ask what V does: "V raids maize."
  - Step 6: There might be different words for these animals when they are not raiding.

  Outcome: The term V does not refer to a taxon but to a behavior (raiding maize) by any animal. It groups animals by behavior regardless of their species.

  Therefore, the extension of V is not a clade but a polyphyletic group. We cannot map V to any set of Linnaean species without noting that the same species might be V in one context and not in another.

  The procedure would record: V is an ecological role term. It might include species X, Y, Z when they are engaged in raiding maize, but not otherwise.

  But the inventory requires species. We cannot honestly list a set of species as V because:
    - The term V does not refer to the species but to the behavior.
    - Some individuals of a species might be V (if they raid) and others not (if they don't).
    - Also, the set of species that raid maize might change over time or by location.

  Thus, we must stop and record that V is not a species term and cannot be mapped to a fixed species list.

  **Summary of the Decision Procedure**

  The procedure for investigating a vernacular term V:

  1. **Ostension**: In multiple contexts, point to an organism and ask: "V?" Record the organisms that get assent. Also, note the context (e.g., behavior, location).
  2. **Part/Whole**: Point to a part of the organism (attached) and ask: "V?" Then, if possible, point to a detached part and ask. Record the pattern of assent/dissent.
  3. **Temporal Persistence**: For an organism that is V, ask about after growth or after a significant change (like metamorphosis): "Still V?" Also, ask about the same organism at a different time (without change) to test persistence.
  4. **Generality**: Show multiple individuals (of what you think are the same species and different species) and ask: "V?" Record the set that gets assent.
  5. **Context/Behavior**: Ask what V does, where it is found, and what it is known for. Also, test in different contexts (e.g., when performing the behavior vs. not).
  6. **Contrast**: Ask for other terms for similar organisms and how V differs.

  At each step, if the answers are inconsistent with a unique interpretation (e.g., if in step 2 they assent to attached parts but not to detached, and in step 3 they dissent after growth, then we might have multiple possibilities: they might be referring to a life stage and not the whole animal, but we also have the part-whole issue), record the ambiguity.

  The procedure stops and records ambiguity when:
  - The evidence supports more than one interpretation (e.g., the term could be for the whole animal or for a life stage).
  - The extension does not correspond to a single Linnaean species (e.g., it includes multiple species, or only a part of one species, or it is context-dependent).

  **What the procedure cannot do**:
  1. It cannot uniquely determine the reference of a vernacular term in the face of Quinean indeterminacy.
  2. It cannot force a clean one-to-one mapping between vernacular terms and Linnaean species when the vernacular system does not work that way (as in the cases above).
  3. It cannot resolve differences between communities' classifications without making a judgment call that goes beyond the evidence.

  **Residual judgment calls and responsibility**:
  - When the legal document requires a single species list and the evidence does not support a unique mapping, the field team must record the ambiguity and the reasons. However, if a single list is still required, then a decision must be made by the program or the agency. The procedure does not make that decision; it only documents the evidence. The responsibility for the final decision (and any legal consequences) lies with the agency that overrules the ambiguity.

  The procedure thus provides a structured way to gather evidence and identify ambiguity. It does not eliminate the ambiguity but makes it explicit, so that when a choice must be made (for legal or practical reasons), it is clear that the choice is not determined by the facts and that the responsibility for that choice lies outside the field procedure.
answer: |-
  Below is a practical decision procedure for ethnobiological field teams, grounded in Quine's indeterminacy of translation (as illustrated by the "gavagai" example). The procedure acknowledges that **no field protocol can uniquely fix a vernacular term to a Linnaean species**, as observational evidence (pointing, assent/dissent, context) always underdetermines meaning. Instead, it focuses on gathering evidence to narrow interpretations, while explicitly flagging ambiguity when it cannot be resolved. The goal is to produce an honest account of what the term *might* refer to, without forcing false precision.

  The procedure is designed for rapid inventories (weeks per community, one consultant at a time). It prioritizes efficiency, using simple questions a field assistant can run in an afternoon. Crucially, it stops when evidence is equally consistent with multiple interpretations and records this ambiguity. Philosophical concepts are simplified into actionable steps, with Quine's core insight—**indeterminacy is unavoidable**—embedded throughout.

  ---

  ### **Decision Procedure: Handling Vernacular Terms for Organisms**  
  *Use this for each vernacular term (V) encountered.*  

  #### **Step 1: Initial Association (What scenes trigger V?)**  
  - **Ask:** "When you see [point to organism or scene], is that V?"  
  - **Variations:**  
    - Repeat for different contexts (e.g., in forest, near crops, at night).  
    - Ask for dissent: "Is there a scene where this looks like V but isn’t?"  
  - **Sufficient answer:** Consistent assent/dissent across 3–5 similar scenes. Record:  
    - Physical traits (size, color, etc.), behavior, location, and life stage (juvenile/adult) of organisms present.  
  - **Stop if ambiguity:** Assent/dissent is inconsistent (e.g., V sometimes applies, sometimes not to the same organism).  
  - *Quine simplification:* This establishes "stimulus meaning" (scenes that prompt V), but does not fix reference (e.g., "rabbit" vs. "rabbit stage").  

  #### **Step 2: Part-Whole & Temporal Boundaries (Does V include parts or change over time?)**  
  - **Ask (Part-Whole):**  
    - Point to a living organism’s **attached part** (e.g., leg): "Is this V?"  
    - Point to a **detached part** (e.g., fallen feather): "Is this V?"  
  - **Ask (Temporal):**  
    - For a juvenile organism: "When this grows up, will it still be V?"  
    - For an adult: "Was this V when it was young?"  
  - **Sufficient answer:** Clear assent/dissent across 2–3 examples. Record:  
    - Whether V is tied to whole organisms, parts, or specific life stages.  
  - **Stop if ambiguity:**  
    - Answers suggest multiple interpretations (e.g., V refers to wholes *and* attached parts, but not detached).  
    - V applies to juveniles but not adults (or vice versa) of the same organism.  
  - *Quine simplification:* Tests if V aligns with "object" (whole/persistent) or "process" (parts/stages). Ambiguity here is irreducible (Quine’s core point).  

  #### **Step 3: Generality (How widely does V apply?)**  
  - **Ask:** "Is this [show organism A] also V? What about this [show organism B]?"  
    - Include organisms that are:  
      - Morphologically similar to initial examples.  
      - Ecologically similar (e.g., same habitat/behavior).  
      - From different life stages or sexes.  
  - **Sufficient answer:** A clear pattern (e.g., V applies to all examples of a type). Record:  
    - The set of organisms that trigger assent (e.g., "all small rodents," "only birds that eat seeds").  
  - **Stop if ambiguity:**  
    - V applies inconsistently (e.g., to some but not all organisms with shared traits).  
    - Consultant cannot explain why some are included/excluded.  
  - *Quine simplification:* Tests if V maps to a Linnaean "natural kind" or something broader (e.g., ecological role).  

  #### **Step 4: Context & Contrast (Does V depend on behavior or other terms?)**  
  - **Ask (Context):** "When is something V? What does V do?"  
    - Probe ecological roles: "Is V only [e.g., raiding maize]?"  
  - **Ask (Contrast):** "Is there a word for something like V but not V? What’s the difference?"  
  - **Sufficient answer:** Clear descriptions of behavior, habitat, or distinctions from similar terms. Record:  
    - Whether V is defined by taxonomy, behavior, or context (e.g., "only when eating crops").  
  - **Stop if ambiguity:**  
    - V is defined by transient states (e.g., "raiding maize") but no physical traits.  
    - Contrasting terms overlap or conflict with V.  
  - *Quine simplification:* Reveals if V is "observationally embedded" (e.g., tied to specific actions) rather than taxonomic.  

  #### **Step 5: Final Output**  
  - **If no ambiguity:** Map V to a Linnaean species (or set) based on evidence.  
  - **If ambiguity:**  
    - Record **all consistent interpretations** (e.g., "V may mean Species X or ecological role Y").  
    - **Do not resolve.** Flag: "Term cannot be uniquely mapped to Linnaean taxonomy."  
  - **Report structure:**  
    ```  
    Vernacular term: [V]  
    Interpretation: [e.g., "Refers to juvenile stages of Species A and B"]  
    Ambiguity: [e.g., "Does not include adults; may represent life-stage concept"]  
    Evidence: [Summary of assent/dissent, key tests]  
    ```  

  ---

  ### **Application to Cases**  
  *Each case ends with an output based on the procedure. Case 3 forces an admission that a "clean" species list is impossible.*  

  #### **Case 1: Single Term for Juveniles of Two Species (Life-Stage Concept)**  
  - **Step 1:** Assent for juveniles of Species A and B; dissent for adults.  
  - **Step 2:** Temporal test: "When this juvenile grows up, is it still V?" → **Dissent** ("It becomes a different thing, W").  
  - **Step 3:** Assent for all juveniles of A and B; dissent for other juveniles.  
  - **Step 4:** Contrast: "W is the adult form; V is only young."  
  - **Output:**  
    ```  
    Vernacular term: V  
    Interpretation: Refers to juvenile life stage of Species A and Species B.  
    Ambiguity: Does not map to a single species or any Linnaean taxon; reflects a life-stage classification.  
    Evidence: Assent for juveniles of A/B; dissent for adults and other species.  
    ```  
  - **Honest admission:** A species-by-species inventory cannot include V, as V cuts across two species and excludes adults. Forcing V into the list would misrepresent the folk taxonomy.  

  #### **Case 2: Neighboring Communities with Non-Identical Terms**  
  - **Community 1:** V applies to Species A and B.  
  - **Community 2:** V' applies to Species B and C.  
  - **Procedure output for each community:**  
    ```  
    Community 1: V = {Species A, B}  
    Community 2: V' = {Species B, C}  
    Ambiguity: Terms V and V' are not equivalent; shared checklist would mask differences.  
    ```  
  - **Conflict:** A shared checklist forces a choice:  
    - Using V (A+B) excludes C; using V' (B+C) excludes A.  
    - A "union" (A+B+C) misrepresents both communities.  
  - **Honest admission:** No single list can honestly represent both communities. The inventory must report separate classifications or note the ambiguity.  

  #### **Case 3: Term Defined by Ecological Role (e.g., "Maize Raiders")**  
  - **Step 1:** Assent for rats, monkeys, and birds in maize fields; dissent for the same animals in forests.  
  - **Step 2:** No part-whole/temporal issues (V applies to whole organisms).  
  - **Step 3:** Assent for any animal raiding maize (multiple species, no shared traits).  
  - **Step 4:** Context test: "V only when eating maize." Contrast: "Other words for these animals when not raiding."  
  - **Output:**  
    ```  
    Vernacular term: V  
    Interpretation: Refers to any organism raiding maize (e.g., rats, monkeys, birds).  
    Ambiguity: Not a taxonomic term; cannot map to Linnaean species without context.  
    Evidence: Assent only during raiding behavior; no consistent morphology.  
    ```  
  - **Honest admission:** A species-by-species inventory **cannot be honestly produced**. V is defined by behavior, not biology. Listing species (e.g., "rat, monkey, bird") implies a false taxonomic grouping and ignores context (e.g., the same bird is V only when raiding).  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Resolve indeterminacy:** It cannot fix a unique "correct" translation (e.g., "gavagai = rabbit" vs. "rabbit stage"). Quine showed this is impossible.  
  2. **Force consensus:** When communities classify differently (Case 2) or terms are non-taxonomic (Case 3), it cannot create a unified list without distortion.  
  3. **Replace judgment:** Field teams must decide:  
     - When to stop testing (e.g., time constraints).  
     - How to weight evidence (e.g., one consultant vs. multiple).  
     - Which interpretations are "close enough" for practical use (e.g., EIA reports).  
  4. **Absolve responsibility:** When legal documents require a single answer (e.g., land rights based on species lists), **the procedure will not provide one if evidence is ambiguous**. The judgment call shifts to:  
     - **The field team** to document ambiguity transparently.  
     - **The program/advisors** to contextualize findings (e.g., "Term V is not species-specific; legal use requires caution").  
     - **The consulting agency** to accept or override ambiguity, bearing legal/scientific responsibility for forced mappings.  

  ### **Key Takeaways for Field Teams**  
  - **Quine’s lesson simplified:** What you see (pointing, assent) doesn’t reveal what the speaker *means*. Your translation is a best guess.  
  - **Your role:** Gather evidence rigorously, record ambiguity openly, and resist pressure for false precision. A honest "we don’t know" is better than a flawed species list.  
  - **When ambiguity harms:** If legal outcomes hinge on a term (e.g., land rights), note this explicitly: "The evidence does not support a single interpretation; defer to community testimony."  

  This procedure honors Quine by making indeterminacy visible in the output—not as a philosophical puzzle, but as a routine constraint of fieldwork. It ensures your species lists are not "only as good as the translation," but as good as the evidence allows.
