answer: |-
  **MEMORANDUM**  
  To: Faculty Senate Bylaws Subcommittee  
  From: [Your Name], Chair, Bylaws Subcommittee  
  Date: April 1, 2024  
  Subject: Voting Rule Recommendation for Senate Elections  

  ### **Introduction**  
  After extensive deliberation on last spring’s named-professorship election challenges, this memo recommends standardized voting rules to ensure clarity, fairness, and compliance with our bylaws. The goals are to: (1) meet the requirement for chair elections to be decided by "a majority of votes cast"; (2) minimize opportunities for strategic manipulation; and (3) prioritize simplicity for email balloting. Below, I evaluate options, address key concerns (including Prof. K’s critiques), and propose rules for three election types: chair elections, at-large committee seats, and yes/no/reopen questions.  

  ---

  ### **Core Recommendation**  
  I recommend adopting **Instant-Runoff Voting (IRV)** for chair elections. For at-large committee seats, use **approval voting**. For yes/no/reopen questions, use **majority-runoff voting**.  

  #### **Reasoning Summary**  
  - **IRV for chairs** satisfies the bylaws’ majority requirement, reduces vote-splitting, and balances strategic resistance with simplicity.  
  - **Approval voting for committees** is efficient for multi-winner races and minimizes gaming.  
  - **Majority-runoff for yes/no/reopen** ensures a clear majority outcome without complexity.  

  ---

  ### **Addressing Key Concerns**  
  #### **1. Prof. K’s Position: Gibbard-Satterthwaite (GS) Theorem**  
  Prof. K correctly notes that the GS theorem proves *no ordinal voting system* (where voters rank candidates) with ≥3 options can be fully immune to strategic voting. The theorem assumes:  
  - A deterministic rule (no randomness).  
  - Voters have ordinal preferences (no cardinal scores).  
  - All possible preference profiles are admissible.  

  **Where GS applies**:  
  - Systems like Borda count or IRV *can* be manipulated via "tactical ranking" (e.g., "burying" a strong rival). Borda is indeed highly vulnerable to this, as Prof. K argues.  

  **Where GS does less work**:  
  - **Cardinal systems** (e.g., approval, score) fall outside GS because voters assign ratings, not ranks. These are manipulable but differently (e.g., exaggerating scores).  
  - **Practical constraints**: In real elections with 600 voters, coordinated strategic voting is unlikely. We should prioritize *resistance to accidental distortions* (e.g., vote-splitting) over theoretical perfection.  

  #### **2. Evaluating Proposed Systems**  
  | System             | Pros                                      | Cons                                      | Majority Compliant? |  
  |--------------------|-------------------------------------------|--------------------------------------------|---------------------|  
  | **Plurality**      | Simple; status quo.                       | Spoiler effect; no majority guarantee.     | ❌ No               |  
  | **Borda Count**    | Reflects broad support.                   | Highly prone to burial tactics.            | ❌ No               |  
  | **Grad Rep’s Rule**| Innovative; mitigates extremes.           | Arbitrary threshold (1.5 avg); runoff may not yield majority; untested. | ❌ No |  
  | **Approval**       | Simple; resists spoilers; cardinal (not subject to GS). | No majority guarantee; "hedged voting" risk. | ❌ No |  
  | **IRV**            | Ensures majority; reduces vote-splitting. | Ordinal (GS applies), but manipulability is rare in practice. | ✅ Yes |  

  **Grad Rep’s System**: While creative, the 1.5 threshold is arbitrary and risks eliminating centrist candidates. The plurality runoff may still elect a candidate with <50% support. I recommend retiring it.  

  #### **3. The Majority Requirement**  
  Our bylaws mandate a "majority of votes cast" for chairs. **IRV inherently satisfies this**: it eliminates last-place candidates and redistributes votes until one option reaches >50%. Systems like plurality, Borda, or approval *cannot guarantee this* and would require supplementary runoff elections, complicating email balloting.  

  ---

  ### **Detailed Recommendations**  
  #### **1. Chair Elections: Instant-Runoff Voting (IRV)**  
  - **Ballot**: Voters rank candidates in order (1st, 2nd, 3rd, etc.).  
  - **Count**:  
    1. If a candidate has >50% of first choices, they win.  
    2. Else, eliminate the last-place candidate and redistribute their votes to next preferences.  
    3. Repeat until one candidate achieves a majority.  
  - **Why IRV?**  
    - Meets the majority requirement in one email ballot.  
    - Minimizes "wasted votes" and spoiler effects (e.g., splitting between ideologically similar candidates).  
    - Used by governments (Australia, Ireland) and academic societies (AMS, APA).  
    - GS concerns are mitigated: Evidence shows successful manipulation is rare in large elections.  

  #### **2. At-Large Committee Seats: Approval Voting**  
  - **Ballot**: Voters select all acceptable candidates (no ranking).  
  - **Count**: Top *N* vote-getters win (for *N* seats).  
  - **Why approval?**  
    - Simple for voters ("check all you approve").  
    - Resists gaming: No incentive to bury rivals (cardinal system).  
    - Ideal for multi-winner races; ensures broad support.  

  #### **3. Yes/No/Reopen Questions: Majority-Runoff Voting**  
  - **Ballot**: Voters choose one option.  
  - **Count**:  
    1. If "yes" or "no" has >50%, it wins.  
    2. Else, eliminate "yes" and hold a runoff between "no" and "reopen."  
  - **Why?**  
    - Avoids IRV complexity for binary-plus outcomes.  
    - Ensures a majority while resolving ambiguity between "no" and "reopen."  

  ---

  ### **Why Not Other Systems?**  
  - **Borda**: Rejected due to high manipulability ("burying") and no majority guarantee.  
  - **Approval for chairs**: Rejected as it could elect a candidate with <50% support (violating bylaws).  
  - **Plurality**: Fails the majority requirement and amplifies spoilers.  

  ---

  ### **Conclusion**  
  No system is perfectly strategy-proof, but IRV best meets our unique constraints: bylaws compliance, practical simplicity, and resistance to *accidental* distortions. For committees and yes/no/reopen questions, approval and majority-runoff provide clarity without overcomplication.  

  **Next Steps**: I propose adopting these rules for a 2-year trial period. We will review outcomes in 2026 to address unforeseen issues. Draft language for bylaws amendments is attached.  

