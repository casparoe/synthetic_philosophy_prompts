  **MEMORANDUM**

  To: Bylaws Subcommittee Members  
  From: [Your Name], Chair, Bylaws Subcommittee  
  Date: [Date]  
  Subject: Recommendation for Voting Rules in Faculty Senate Elections  

  ## Introduction
  This memo addresses the need for clear voting rules in Faculty Senate elections, prompted by last spring's named-professorship search. The current bylaws stipulate that chair elections "shall be by ballot" and require the winner to receive "a majority of votes cast." We must adopt a rule that meets these requirements, minimizes opportunities for strategic voting, and is practical for email balloting. After careful consideration of the options and expert input, I recommend **Instant-Runoff Voting (IRV)** for chair elections. For at-large committee seats, I recommend **approval voting**. For questions with three options (such as yes/no/reopen), I recommend **a two-round system** (detailed below). This memo explains the reasoning, addresses concerns raised by subcommittee members, and discusses the majority requirement.

  ## Key Considerations

  ### 1. Meeting the Majority Requirement
  The bylaws require a majority winner in chair elections. In multi-candidate races, this is challenging. We considered:
  - **Plurality voting**: Fails to guarantee a majority and risks vote-splitting.
  - **Borda count and other point systems**: Do not guarantee a majority winner.
  - **Runoff systems**: Either two-round (with a second election between the top two if no majority) or IRV (which simulates a runoff in a single ballot) can guarantee a majority.

  A two-round runoff would meet the requirement but requires two separate elections. Given the logistical burden of email balloting, IRV is preferable because it accomplishes the same in one round.

  ### 2. Addressing Strategic Voting (Prof. K's Concern)
  Prof. K correctly notes the Gibbard-Satterthwaite (GS) theorem: any deterministic voting rule that uses ordinal rankings (i.e., ranks only) and has three or more options is vulnerable to strategic voting, unless it is a dictatorship. This theorem applies to IRV. However, the GS theorem does not state that strategic voting is equally easy or common in every system. In practice, successful strategic voting in IRV requires precise coordination and information that is unlikely in our faculty elections (with ~600 voters). Moreover, the theorem does not apply to cardinal systems (like approval or score voting) because they use more information than ranks. But we must also meet the majority requirement, which cardinal systems do not inherently satisfy.

  While no system is immune to manipulation, IRV is considered relatively robust in practice. It is used in governmental elections (e.g., Australia) and by many academic societies.

  ### 3. Borda Count
  Prof. K is also correct that Borda count is particularly susceptible to "burying" (ranking a strong rival last). This is a well-documented vulnerability. Given this and its failure to guarantee a majority, we do not recommend Borda.

  ### 4. The Grad Rep's Proposal
  The proposed system (score 0-3, drop candidates averaging below 1.5, then plurality runoff) has merits in using cardinal information. However, it has critical flaws:
  - The threshold (1.5) is arbitrary and may eliminate a candidate who is broadly acceptable but polarizing (and thus could win a head-to-head).
  - The plurality runoff does not guarantee a majority winner (if three survivors split the vote, one could win with 34%).
  - The tie-breaking rule (head-to-head among tied candidates) adds complexity and may not resolve ties cleanly.

  We appreciate the innovative spirit but recommend established methods over untested ones.

  ### 5. Practicality
  We must consider:
  - **Ballot simplicity**: IRV requires voters to rank candidates in order. This is straightforward and can be implemented via email.
  - **Explainability**: IRV is used in real-world elections and can be explained as: "Rank the candidates in order. If no one gets a majority of first choices, the candidate with the fewest first choices is eliminated, and those votes go to their next choice. This repeats until one candidate has a majority."
  - **Resistance to accidental harm**: IRV reduces the spoiler effect and allows voters to express preferences without fearing wasted votes.

  ## Recommendations

  ### For Chair Elections: Instant-Runoff Voting (IRV)
  - **Procedure**: Voters rank candidates in order of preference. Count first choices. If a candidate has a majority, they win. If not, eliminate the candidate with the fewest first choices and redistribute their votes to the next choice on each ballot. Repeat until one candidate has a majority.
  - **Why IRV?** 
    - Guarantees a majority winner in one ballot.
    - Mitigates vote-splitting and spoilers.
    - Relatively resistant to strategic voting in practice.
    - Widely used and understood.

  ### For At-Large Committee Seats: Approval Voting
  - **Procedure**: Each voter can vote for (approve) as many candidates as they wish, up to the number of seats. The candidates with the most approvals win.
  - **Why approval?** It is simple, encourages broad support, and avoids the complexity of ranking for multiple winners. It does not require a majority per seat because committee seats are not held by a single winner.

  ### For Questions with Three Options (e.g., Yes/No/Reopen): Two-Round System
  - **Procedure**: 
    - Round 1: Voters choose one option. If one option gets a majority, it wins.
    - If no majority, the top two options advance to a second round (unless "yes" is in the top two, then we must consider: if "yes" does not win in round 1, then the question is whether to accept the outcome as "no" or "reopen"). Alternatively, we can design the runoff between the two non-yes options? But note: if "yes" does not get a majority, then the issue is whether to reject and possibly reopen. So the runoff should be between "no" and "reopen". We can do:
        - If "yes" gets a majority, it wins.
        - Else, hold a second round between "no" and "reopen".
  - **Why two-round?** It guarantees a majority outcome and is simple to understand. However, it requires two ballots. An alternative is to use IRV for this as well? But for a single question with three options, IRV would work similarly: if no majority, eliminate the option with the least first choices and redistribute. But note: the options are not candidates and might not be rankable in the same way. We might need to specify that voters rank the three options. Then IRV can be applied. Given the infrequency of such questions and the desire for consistency, I recommend using IRV for these as well? Or, if we want to avoid ranking for questions, stick with the two-round system.

    However, to keep the voting rules consistent and to avoid multiple systems, we might extend IRV to these questions. The ballot would say: "Rank the following options: Yes, No, Reopen the search." Then we count by IRV. This meets the majority requirement by design (for the chair election, the bylaw requires majority, but for these questions, the bylaw does not specify, but we can apply the same principle for clarity).

    Alternatively, we can note that the majority requirement in the bylaws is only for chair elections. For the other elections, we can define the rule appropriately. But to avoid confusion, we might adopt:

        For chair elections: IRV.
        For at-large committee seats: approval.
        For yes/no/reopen questions: use a two-round system (as described) to ensure a majority outcome.

    But the two-round system for questions requires two emails, which we want to avoid. Therefore, I recommend:

        For yes/no/reopen: Use IRV. Voters rank the three options. The counting proceeds as in IRV until one option has a majority.

    This is consistent with the chair election and achieves a majority in one ballot.

  ## Conclusion
  No voting system is perfect, but IRV best balances the competing demands for chair elections: it meets the majority requirement, reduces the risk of vote-splitting, and is practical for our setting. For other election types, we propose approval voting (for at-large seats) and IRV (for yes/no/reopen questions) to ensure clarity and consistency. I urge the subcommittee to support these recommendations at our April meeting.

