prompt: |-
  I chair the bylaws subcommittee of our faculty senate at a mid-sized state university (~600 voting faculty), and after the disaster that was last spring's named-professorship search, we're finally writing an actual voting rule. The bylaws currently just say elections "shall be by ballot," which turns out to mean different things to different people. The problem: our elections often have three or more options (chair elections routinely get 4-5 candidates, plus the option to reopen the search), and Prof. K from econ, who teaches social choice, has been invoking the Gibbard–Satterthwaite theorem at every meeting — her position is that ANY ranked-ballot rule we adopt with more than two options can be gamed by strategic voting, so we should just stick with plurality and stop pretending otherwise. Prof. R from statistics wants Borda counts. And one of the grad reps keeps pushing this homemade procedure he found on some internet forum, which is roughly: everyone scores the candidates 0–3, anyone averaging below 1.5 gets dropped, then a plurality runoff among the survivors, with ties broken by head-to-head results among the tied candidates. Nobody else on the subcommittee knows what to make of any of this and they keep looking at me.

  I need a decision memo I can circulate before our April meeting, with an actual recommendation in it. Things I want it to grapple with: whether Prof. K is deploying the theorem correctly — my vague understanding is that it needs specific assumptions (deterministic rule, ordinal preferences, something about all preference profiles being possible), and that cardinal systems like approval or score voting might fall outside its scope entirely, but I don't want to hand-wave because the committee will smell it. Whether Borda is really as burying-prone as Prof. K claims (she says it's the single worst offender for that tactic). Whether the grad rep's franken-rule can be salvaged or should be put down gently. And honestly, whether the right move is to concede that some manipulability is inevitable and pick the rule on other grounds — ballot simplicity, explainability to an electorate that votes by email, resistance to *accidental* strategic distortions rather than theoretically perfect ones. One extra wrinkle: the bylaws require that chair elections go to whoever "recieves a majority of votes cast," which I suspect interacts badly with several of these proposals when there are four candidates splitting the vote, but I'm not sure which ones or how.

  So please draft the memo: a clear recommendation (one rule, or a small set for different election types — we have single-winner chair elections, a slate of at-large committee seats, and occasional yes/no/"no, reopen the search" questions), the reasoning behind it, a serious and non-dismissive treatment of Prof. K's position including where she's right and where the theorem does less work than she thinks, and something concrete about the majority clause. Assume the readers aren't social choice theorists but several of them are skeptical of anything that sounds fancy, so be precise where you state the math and hedge where you're unsure. Under 1000 words if you can manage it, our meetings run long enough as it is.
reasoning: |-
  We are drafting a decision memo for the bylaws subcommittee. We need to address several voting methods and concerns, especially the Gibbard-Satterthwaite theorem, the majority requirement, and practical considerations.

  Key issues:
  1. **Gibbard-Satterthwaite (GS) theorem**: It states that for any deterministic voting system with three or more alternatives that is not a dictatorship and that allows any possible preference ordering, there will be situations where a voter can achieve a better outcome by misrepresenting their preferences (i.e., strategic voting). The theorem applies to ordinal voting systems (where voters rank candidates) and requires that the system is non-dictatorial and that every possible preference profile is admissible.

  2. **Cardinal systems**: Approval voting and score voting (including the grad rep's system) are cardinal because voters assign scores. They are not covered by the GS theorem, which is for ordinal systems. However, they can still be manipulated (e.g., by exaggerating scores) but in different ways.

  3. **The majority requirement in the bylaws**: The chair election requires the winner to receive "a majority of votes cast." This is straightforward in a two-candidate race but becomes tricky in multi-candidate elections. We must ensure that the voting system we choose can produce a majority winner or has a provision for a runoff if no one gets a majority.

  4. **Proposed methods**:
     - **Plurality**: Current de facto method. Simple but can lead to vote-splitting and spoilers. Often produces winners with less than majority support. Does not meet the majority requirement without a runoff.
     - **Borda count**: Voters rank candidates; points assigned (e.g., 1st place gets n-1, 2nd gets n-2, etc.). Prof. K says it is prone to "burying" (ranking a strong rival low to harm them). Also, it does not guarantee a majority winner.
     - **Grad rep's system**: Score candidates 0-3, drop those averaging below 1.5, then plurality runoff among survivors. This is a hybrid cardinal-ordinal system. The scoring step is cardinal, and the runoff is plurality. It may not guarantee a majority in the runoff if there are multiple survivors and vote-splitting occurs. Also, the thresholds (1.5) and scoring scale are arbitrary and might be manipulated.
     - **Alternative systems**:
       - **Approval voting**: Voters can approve as many candidates as they like. The candidate with the most approvals wins. Simple, but doesn't guarantee a majority. Also, voters might strategically approve only their top choice to avoid helping others, or approve multiple to hedge.
       - **Score voting (aka range voting)**: Voters rate each candidate on a scale (e.g., 0-5). The candidate with the highest average wins. It doesn't guarantee a majority, but it is cardinal and not subject to GS. However, it can be manipulated by min-maxing (rating your favorite the max and all others the min, which turns it into approval) or by exaggerating ratings.
       - **Instant-runoff voting (IRV)**: Voters rank candidates. If no candidate has a majority of first choices, the candidate with the fewest first choices is eliminated, and their votes are redistributed until one candidate has a majority. This meets the majority requirement and is designed for multi-candidate races. However, it is an ordinal system and subject to GS (i.e., strategic voting is possible in theory), though the frequency and ease of strategic voting in practice are debated.

  5. **Practical considerations**:
     - **Ballot simplicity**: How easy is it for voters to understand and mark? How easy to count? Email voting must be simple.
     - **Explainability**: Can we explain the rule to the faculty without a PhD in social choice?
     - **Resistance to accidental strategic distortions**: We are more concerned about voters unintentionally misvoting due to complexity than about deliberate manipulation.
     - **Meeting the majority requirement**: The rule must either produce a majority winner or have a built-in mechanism (like a runoff) to ensure one.

  6. **Recommendation**:
     Given the majority requirement, we need a system that guarantees a majority winner. This points to a runoff system (either in multiple rounds or instant-runoff). 

     Among the options:
     - **IRV (Instant-Runoff Voting)** is designed for this and is used in many real-world elections (e.g., Australia, Ireland, some US cities). It meets the majority requirement by design. It is an ordinal system, so it is vulnerable to GS, but the likelihood of successful manipulation in a faculty election (with many voters and no clear coordination) is low. The ballot is a simple ranking.

     - **Two-round runoff**: If no candidate gets a majority in the first round, the top two go to a second round. This also guarantees a majority. However, it requires two separate elections, which is more burdensome (especially by email). Also, it might lead to strategic voting in the first round (e.g., voting for a less preferred but more viable candidate to ensure they make the runoff).

     Given the practical constraints (email voting, desire for one round), IRV is a good compromise.

     For the at-large committee seats (which are multi-winner) and the yes/no/reopen questions, we need different rules. For multi-winner, we might use approval voting or STV (Single Transferable Vote) but that's complex. For yes/no/reopen, we can treat it as a single-winner with three options? But note: the majority requirement for chair elections does not necessarily apply to these.

     However, the memo is primarily about the chair election. We can handle the others separately.

  7. **Addressing Prof. K**:
     - She is correct that the GS theorem applies to any deterministic, non-dictatorial, ordinal voting system with three or more alternatives. So, IRV (being ordinal) is theoretically manipulable. However, the theorem does not say how often manipulation occurs or how easy it is. In practice, IRV is considered relatively resistant to manipulation because it is difficult for voters to coordinate and predict how to vote strategically. Moreover, the theorem does not apply to cardinal systems, but we are constrained by the majority requirement.

     - On Borda: She is correct that Borda is particularly vulnerable to burial strategies. There is ample evidence of this in the literature.

  8. **Grad rep's system**:
     - The scoring part is similar to score voting, but the arbitrary threshold (1.5) and the plurality runoff are problematic. The threshold might exclude a candidate who is the second choice of many (and could win a runoff) but got a low average because of polarized ratings. The plurality runoff does not guarantee a majority. Also, ties in the runoff and tie-breaking by head-to-head might be complex. We should avoid this because it is untested and has arbitrary parameters.

  9. **Majority clause**:
     - IRV naturally produces a majority winner by the final round. For a two-round system, it does so by design. For other systems (like Borda, approval, score), there is no guarantee of a majority. Therefore, we must either choose a system that guarantees a majority (like IRV or two-round) or modify the bylaw. But the bylaw is fixed for chair elections.

  Recommendation:
  - For chair elections: Use Instant-Runoff Voting (IRV). It satisfies the majority requirement, is relatively simple, and minimizes the burden of multiple rounds. It is an established method that can be implemented via email (voters rank candidates in order of preference).
  - For at-large committee seats: Use approval voting (each voter can vote for as many candidates as they wish, up to the number of seats). This is simple and avoids the complexity of ranking for multiple seats. It does not guarantee a majority for each seat, but for multi-winner, that is not usually required.
  - For yes/no/reopen questions: Treat as a three-option single-winner? But note: the bylaw's majority requirement might not apply. However, to be consistent and to avoid vote-splitting, we might use IRV for these as well? Or, if we want a simpler rule, we could require a majority for one of the options? But if the majority is split between "no" and "reopen", we might need a runoff. Alternatively, we can design it as: if "yes" gets a majority, it wins. Otherwise, a runoff between "no" and "reopen". But that requires two rounds. Alternatively, use IRV for this too? But that might be overkill. Another idea: treat it as a single question with two parts? First, yes/no. If no, then reopen or not? But that would require two ballots. Given the complexity, we might stick with a single ballot and use a runoff if no majority. However, for simplicity, we might do:

     Option: Use approval voting for this? But then we might have two options approved by a majority? Not clear. Alternatively, use a two-round system: first round, if "yes" gets a majority, it wins. If not, then a second round between "no" and "reopen".

     But to keep it simple and consistent, we might use IRV for these as well? The ballot would have three options: [Candidate A, Candidate B, ...] for chairs; and [Yes, No, Reopen] for the question. The same counting method applies.

     However, note that the majority requirement in the bylaws specifically applies to chair elections, not necessarily to these questions. We might need to interpret the bylaws. But the memo is about the voting rule for elections, and the chair election is the one with the majority requirement.

     For now, focus on the chair election.

