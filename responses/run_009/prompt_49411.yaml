prompt: |-
  I'm in a graduate reading group on laws and chance, and our convener has taken to abbreviating the Principal Principle as the instruction to let your credences defer to the objective chances — if you know the chance is one-half, believe to one-half. This semester that gloss has been made to do two very different jobs, and I've started to doubt it can do either. First, in a session on deterministic worlds, someone argued that since a complete physical state plus deterministic laws settles every outcome, the true chances are all zero or one, so the Principle shows there is no room for genuine chance in a deterministic universe, and anyone assigning a fair coin one-half is being straightforwardly irrational. Second, in a discussion of foreknowledge, the same gloss was used to claim that if a perfectly reliable time-traveler tells you the coin will land heads, you still know the chance is one-half, so your credence should still be one-half — chance trumps even testimony like that. Both felt wrong to me, but for what might be opposite reasons. Lay out the distinct precise theses this one-liner could be expressing — from readings so weak as to be near-tautologies (perhaps defining chance as whatever rational agents defer to), through readings about credence conditional on chance propositions given only admissible evidence, to strong readings on which known chance screens off all further evidence — and say for each whether it's trivial, substantive and defensible, or false. Then say which readings, if any, would support each of the two uses: does any defensible reading really yield the no-chance-under-determinism conclusion, and does any really support discounting the time-traveler's testimony? If the two uses pull the gloss in incompatible directions, flag exactly where. Present the readings as an ordered list I can bring to the next session, with a verdict attached to each.
reasoning: |-
  Okay, the user is in a graduate reading group focused on laws and chance, and they're struggling with how their convener is interpreting the Principal Principle (PP). The convener's gloss—"let your credences defer to the objective chances"—is being used to support two arguments: one against chance in deterministic worlds, and another for ignoring reliable foreknowledge from a time-traveler. The user finds both conclusions counterintuitive and wants a systematic breakdown of possible interpretations of PP and their implications.

  First, I need to recall what the Principal Principle is. Lewis originally formulated it as a way to link objective chances with rational credences. The core idea is that if you know the chance of an event, your belief should align with it, unless you have "inadmissible" information. But this gloss oversimplifies things. The user mentioned two scenarios: deterministic worlds and foreknowledge via time-travel. 

  For the deterministic case, the argument is that since laws fix outcomes, chances must be 0 or 1, so PP implies no non-trivial chances. But is that right? Lewis himself thought PP required indeterminism for non-extreme chances. However, later developments like the New Principal Principle (NPP) by Hall and others might allow for non-trivial chances even in deterministic settings if we consider chances as summaries of incomplete information. 

  Then there's the time-traveler scenario. If a reliable source tells you the outcome, but you know the chance was 1/2, should you still believe 1/2? The convener says yes, but that seems wrong because the testimony is strong evidence. This points to the admissibility clause—information about the actual outcome might be inadmissible, so PP shouldn't apply once you have it. 

  The user wants distinct theses, ordered from weak to strong. Let me outline possible interpretations:

  1. **Minimalist/Definist Reading**: Chances are defined by deference. This is circular and trivial. It wouldn't support either argument because it doesn't provide independent constraints.
     
  2. **Unconditional Deference**: Set credence equal to chance no matter what. But this is clearly false because of future truths or foreknowledge. It would support both arguments but is indefensible.

  3. **Admissibility-Restricted (Lewis's Original PP)**: Deference applies only with admissible evidence. This handles the time-traveler case (testimony is inadmissible) but not determinism—since chances in deterministic worlds are 0/1, PP still says no non-trivial credences. So it supports the no-chance argument but not the time-traveler one.

  4. **Chance as Expert (NPP)**: Credence should match chance conditional on current chances. This accounts for inadmissible information like foreknowledge, so the time-traveler's info should override chance. Also, it allows for non-trivial chances in deterministic worlds if chances are seen as epistemic. Thus, it doesn't support either argument.

  5. **Screening Off**: Chance screens off all other evidence. Strong but false—like in the time-traveler case. It would support both arguments but is incorrect.

  For the two uses: The no-chance argument only holds under Lewis's original PP (thesis 3) if we assume determinism implies only extreme chances. But if chances are not reducible to laws (like in NPP), then it doesn't hold. The time-traveler argument only works under theses 2 or 5, which are indefensible. Thesis 3 and 4 correctly reject the time-traveler conclusion.

  The user might be concerned about the conflation of different PP interpretations leading to confusion in their group. They need clarity to challenge the convener's gloss. Also, they might want to bring structured arguments to the next session. Underlying needs include understanding nuanced interpretations of PP and resolving contradictions in applying it to different scenarios.
answer: |-
  Here's a systematic breakdown of distinct interpretations of the "defer to chances" gloss, ordered from weakest to strongest, with verdicts and analysis of their support for the two arguments. The key tension lies in how they handle **admissible evidence** and the **ontological status of chance**.

  ### Ordered List of Precise Theses
  1.  **Minimalist/Definist Reading:**
      *   **Thesis:** "Objective chance" is *defined* as whatever function rational agents defer to in their credences (under some unspecified conditions). Deference is constitutive of chancehood.
      *   **Verdict:** **Trivial (and Circular).** This doesn't tell us *what* chance is or *when* we should defer, it just stipulates a label for whatever we end up deferring to. It's analytic, not substantive.
      *   **Supports Determinism Argument?** No. It's silent on whether deterministic laws produce something we *should* call "chance" and defer to. It might label the laws themselves as "chance," but that feels like a misuse of the term.
      *   **Supports Time-Traveler Argument?** No. It's silent on how to handle conflicting information like foreknowledge. It might label the time-traveler's info as "chance," but again, that seems wrong.

  2.  **Unconditional Deference:**
      *   **Thesis:** For any proposition A and time t, if an agent knows that the chance of A at t is x (Ch_t(A) = x), then rationality requires setting their credence in A to x: Cr(A) = x. *Always and unconditionally.*
      *   **Verdict:** **False.** This is wildly implausible. If you *already know* A is true (e.g., you just saw the coin land heads, or the reliable time-traveler told you), knowing Ch_t(A) was 0.5 yesterday doesn't force you to set Cr(A) = 0.5 *now*. Credence should reflect total evidence.
      *   **Supports Determinism Argument?** **Yes.** If determinism implies Ch_t(A) is always 0 or 1 for all A, then PP forces Cr(A) = 0 or 1. Assigning 0.5 violates PP, hence irrational. (But the premise that determinism implies only extreme chances is crucial and contested).
      *   **Supports Time-Traveler Argument?** **Yes.** You know Ch_t(Heads)=0.5. Unconditional deference demands Cr(Heads) = 0.5, ignoring the time-traveler. But this is clearly irrational given the foreknowledge.

  3.  **Lewis's Original Principal Principle (Admissibility-Restricted):**
      *   **Thesis:** Cr(A | Ch_t(A) = x ∧ E) = x. Where E is any proposition **admissible** at time t. Admissible evidence is roughly: (a) historical information up to t, and (b) information solely about the laws of nature. Crucially, E *cannot* contain "inadmissible" information about outcomes *after* t.
      *   **Verdict:** **Substantive and Defensible (Historically influential, but superseded).** This captures the core idea that chance is an expert guide to the future *relative to history and laws*. It handles future truths/information. (Lewis later refined it to the New Principle due to the "Big Bad Bug" concerning undermining futures).
      *   **Supports Determinism Argument?** **Conditionally Yes.** *If* one accepts that determinism implies Ch_t(A) is always 0 or 1 (because the laws + initial conditions entail A or ~A), *then* PP requires Cr(A | Ch_t(A)=1 ∧ E) = 1 and Cr(A | Ch_t(A)=0 ∧ E) = 0. Assigning 0.5 violates PP *if* you know the deterministic chance. The argument holds *if* the "only extreme chances under determinism" premise is granted. (Many modern chance theorists reject this premise).
      *   **Supports Time-Traveler Argument?** **No.** The time-traveler's testimony about the future outcome (Heads) is *paradigmatically inadmissible evidence* (it directly concerns an outcome after t). The Original PP *does not apply* when conditioning on inadmissible evidence like this. Rational credence should be Cr(Heads | Ch_t(Heads)=0.5 ∧ Testimony) ≈ 1, *not* 0.5. The gloss misapplied PP here.

  4.  **Chance as Epistemic Expert (New Principal Principle / NPP - Hall, Lewis):**
      *   **Thesis:** Cr(A | Ch = P ∧ E) = P(A | E). Where Ch = P means P *is* the true chance function. Your credence in A, given that P is the chance function *and* your evidence E, should equal P(A | E). This treats chance as an expert whose credence you adopt *conditional on your own admissible evidence E*. It directly handles inadmissible evidence in E.
      *   **Verdict:** **Substantive and Defensible (Widely considered the most viable formulation).** It avoids the Big Bad Bug and explicitly incorporates how total evidence E, including potentially inadmissible info, affects rational credence *through* the chance expert's conditional probability. Deference is *mediated* by your evidence.
      *   **Supports Determinism Argument?** **No.** This formulation *does not require* that determinism implies only extreme chances. It's compatible with interpretations of chance (e.g., Horgan's "transient," epistemic chances; or "macro"-chances) that assign non-extreme probabilities in deterministic systems based on incomplete information/descriptions. PP/NPP tells you how to defer *if there is a chance function P*; it doesn't dictate that determinism precludes such a P. Assigning Cr(Heads)=0.5 *could* be rational *if* the relevant chance function P(Heads) = 0.5 exists (e.g., based on symmetry given macroscopic ignorance).
      *   **Supports Time-Traveler Argument?** **No.** Let E include the testimony (Heads). Let P be the chance function where P(Heads) = 0.5 (perhaps because P ignores the time-traveler's mechanism). NPP says: Cr(Heads | Ch = P ∧ E) = P(Heads | E). Crucially, P(Heads | Testimony of Heads) is likely ≈ 1 (if the expert chance function takes the reliability of the testimony into account when conditionalizing). Your credence should be ≈1. The gloss misapplied NPP; it ignored the crucial role of conditionalizing the chance expert on *your* total evidence E.

  5.  **Chance as Ultimate Screener:**
      *   **Thesis:** Chance screens off *all other evidence*. Once you know Ch_t(A)=x, no further evidence about A should affect your credence: Cr(A | Ch_t(A)=x ∧ E) = x for *any* E whatsoever. Chance is the final arbiter.
      *   **Verdict:** **False.** This is even stronger and more implausible than Unconditional Deference. Knowing A is true *must* override a past chance assignment. Chance is fallible and incomplete; it doesn't magically erase other relevant information. This conflates chance with certainty or divine foreknowledge.
      *   **Supports Determinism Argument?** **Yes.** Same reasoning as Unconditional Deference: forces extreme credences if chances are extreme.
      *   **Supports Time-Traveler Argument?** **Yes.** Forces Cr(Heads)=0.5 regardless of testimony. But this is indefensible.

  ### Summary of Support for Arguments & Tension

  *   **"No Chance Under Determinism" Argument:**
      *   **Supported by:** Unconditional Deference (2), Original PP (3 - *if* determinism implies only extreme chances), Chance as Ultimate Screener (5).
      *   **Not Supported by:** Minimalist (1), NPP (4).
      *   **Key Dependency:** This argument *only works* under interpretations that (a) accept determinism implies only extreme chances (0/1), *and* (b) require strict deference to those extreme chances (rules 2,3,5). Rule 4 (NPP) detaches deference from the requirement that determinism implies only extreme chances.

  *   **"Ignore Time-Traveler" Argument:**
      *   **Supported by:** Unconditional Deference (2), Chance as Ultimate Screener (5).
      *   **Not Supported by:** Minimalist (1), Original PP (3), NPP (4). Crucially, the defensible rules (3 & 4) *explicitly reject* this argument. The testimony is inadmissible (3) or must be conditionalized on by the chance expert (4).
      *   **Key Dependency:** This argument *only works* under interpretations demanding deference *overrides* future truths or reliable foreknowledge (rules 2 & 5), which are indefensible. The defensible rules correctly say such information *defeats* the direct application of PP/NPP.

  *   **The Tension:** The two uses pull the gloss in incompatible directions because they require different, and incompatible, strengths of the deference requirement to achieve their counterintuitive conclusions.
      *   The Determinism Argument *requires* a strong deference rule (like 2, 3, or 5) *combined with* the premise that determinism implies only extreme chances.
      *   The Time-Traveler Argument *requires* an even stronger, indefensible deference rule (like 2 or 5) that ignores future truths/information.
      *   **Where they conflict:** The defensible readings (Original PP 3 and NPP 4) *support the Determinism Argument only conditionally* (on the "extreme chances" premise, which NPP rejects anyway) but *categorically reject the Time-Traveler Argument*. The indefensible readings (2 & 5) support both arguments but are false. There is *no defensible reading* that supports *both* arguments. The gloss, as a one-liner, obscures the critical nuances of admissibility and the expert model, leading to its misuse in both cases.

  ### Verdicts Recap
  1.  Minimalist/Definist: **Trivial**
  2.  Unconditional Deference: **False**
  3.  Lewis's Original PP (Admissibility): **Substantive & Defensible (but superseded)**
  4.  Chance as Epistemic Expert (NPP): **Substantive & Defensible**
  5.  Chance as Ultimate Screener: **False**

  ### Recommendation for Your Session
  Focus the discussion on **Theses 3 and 4 (Original PP and NPP)**. These are the substantive, defensible core of the Principal Principle. Highlight:
  *   The **crucial role of admissibility** (Thesis 3) in defeating the Time-Traveler Argument.
  *   How **NPP (Thesis 4)** separates the question of *what chances exist* (e.g., can non-extreme chances exist in deterministic worlds?) from the *deference principle itself*, thereby defeating the *unconditional* version of the Determinism Argument. Argue that determinism doesn't *necessarily* preclude useful, rational non-extreme chance assignments that we *should* defer to via NPP.
  *   Emphasize that the simple gloss "defer to chances" **fails** because it doesn't specify the critical *conditions* under which deference is rational (admissibility in 3, conditionalization in 4). Its application to both scenarios was flawed: it ignored inadmissibility for the Time-Traveler and potentially misconstrued the nature of chance under determinism for the other.
