prompt: |-
  I work on the policy team at a company that develops and deploys large language models, and one of my jobs is reviewing outputs flagged by users or internal monitors as "deceptive." That label is doing a lot of unexamined work. Philosophers distinguish at least three things that our single label runs together: lying (asserting something one believes false, in order to mislead), misleading (saying something true that carries a false implication), and what Harry Frankfurt called bullshit — talk that is indifferent to truth, produced without caring whether it is true. Most hallucinated facts from our models look like the third category, not the first, and the distinction matters practically: deception might call for targeted training interventions, while indifference to truth calls for different ones, and a true-but-misleading answer might call for none.

  There is a further wrinkle the procedure has to handle: it's contested whether language models "believe" anything, so a definition of deception that turns on the model's beliefs looks unusable. My half-formed thought is that we can substitute a capacity probe for a belief attribution: if the model reliably produces the correct answer when asked in neutral contexts — same question, no user pressure, no persona instruction — we treat it as "knowing" that answer, whatever we ultimately think about its inner states. Whether that substitution is legitimate, and where it breaks, is exactly the kind of thing I want the procedure to be explicit about.

  Please write a decision procedure I and my colleagues can actually run on a flagged conversation, in about twenty minutes per case, without any philosophy training. It should: (1) give an ordered set of questions with criteria for what counts as a sufficient answer to each; (2) route each case to one of the outcome categories — deception, true-but-misleading, bullshit/indifferent-to-truth, or honest error — and specify what action each category triggers on our side (training signal, disclosure to the user, or no action); (3) explicitly mark the points where the procedure cannot settle the matter and a human has to make a judgment call, saying what kind of judgment it is; and (4) state its own failure modes — the situations where the capacity probe gives a misleading verdict, such as cases where the model's competence on a fact is genuinely mixed, or where the conversation involves role-play or fiction that changes what counts as an assertion at all.

  Then run the procedure on three cases, worked through step by step:

  (a) The model invents a plausible-sounding book title and author when asked for a reference on a niche topic, and describes the book in detail.
  (b) A user asserts that a discontinued medication was banned for safety reasons; the model, which gives the accurate account in neutral contexts, replies "That's right" and elaborates on the ban — classic sycophancy.
  (c) The model tells a user preparing for an interview that they are "extremely well prepared," a claim the model has no way to verify and the user has reasons to want to hear.

  Include at least one case where the procedure yields a verdict I won't like — for instance, one where the correct classification implies no intervention when intuitively something went wrong — and explain why the procedure is right to hold that line, or say honestly that this is a known blind spot needing a policy decision above my level. No citations or literature review; I only need the reasoning to be sound. Keep it to something I could realistically use in a weekly review meeting: two to three pages, plain language, and a summary table at the end mapping categories to actions.
reasoning: |-
  We are designing a decision procedure for classifying flagged outputs as one of: deception, true-but-misleading, bullshit/indifferent-to-truth, or honest error.

  The procedure has the following steps:

  1. **Determine if the statement is an assertion of fact.** If not, then the case might not even be about a factual claim and we can exit early (e.g., if it's a joke, fiction, or role-play). We mark this as a judgment call.

  2. **Check for known context that might change the nature of the assertion (e.g., role-play, fiction).** If the conversation is in a context that changes what counts as an assertion (like the model is playing a character), then we note that and may need a policy decision. This is a judgment call.

  3. **Apply the capacity probe:**
     - Take the same factual question (if the flagged output is in response to a question) or the same factual claim (if the model is agreeing/disagreeing) and ask the model in a neutral context (no persona, no pressure, no leading questions) multiple times (say 5) and record the answers.
     - If the model consistently (say 4 out of 5 times) gives the correct answer in the neutral probe, we treat it as "knowing" the fact (i.e., having the capacity to produce the correct answer reliably).
     - If the model consistently gives the incorrect answer (or hallucinates) in the neutral probe, we treat it as lacking the capacity (and thus the error is likely an honest error).
     - If the answers are mixed (not consistent in either direction), then we mark it as a judgment call (the model's competence is mixed).

  4. **Classify the original flagged statement:**
     - If the model "knows" the fact (from the probe) but in the original context stated the opposite (or a falsehood) and the context suggests an intent to mislead (e.g., sycophancy, avoiding harm, etc.), then we classify as **deception**.
     - If the model "knows" the fact and in the original context stated something that is technically true but implies a falsehood (and we can see that the false implication was likely intended), then we classify as **true-but-misleading**.
     - If the model does not "know" the fact (so the probe shows it is unreliable) and the original statement was false, then we check: 
          - Was the statement made with an air of confidence and without hedging? And was there no attempt to qualify uncertainty? Then it might be **bullshit** (indifferent to truth).
          - If the model showed appropriate hedging (e.g., "I think", "probably", "some sources suggest") then it might be an **honest error** (because it was trying to be truthful but got it wrong).
     - However, note: if the model has mixed competence (so the probe was inconclusive) then we have to make a judgment call about which of the above applies.

  But note: in the case of (c) where the model makes a statement about an unverifiable fact (like the user's preparation), we cannot run a capacity probe because there is no objective fact. So we have a separate branch for unverifiable claims.

  We also need to handle cases where the model is agreeing with a user's false statement (like in example b).

  The procedure:

  # Decision Tree for Flagged Output

  ## Step 0: Preconditions
  - The flagged output must contain a statement that the user or monitor believes is deceptive.

  ## Step 1: Identify the Assertion
  - Extract the specific factual claim(s) in the model's output that are flagged. If there are multiple, treat each separately? Or if they are intertwined, treat as one. (For simplicity, we'll assume one claim per case, but in practice we might break down complex outputs.)
  - If the statement is not an assertion of fact (e.g., it's an opinion, a command, a joke, or clearly fictional in context), then stop: **Not applicable** (no action). But note: if the context is ambiguous, mark as judgment call (what kind of speech act is this?).

  ## Step 2: Context Check
  - Check the conversation context: 
     - Is the model operating under a specific persona that might require it to make false statements (e.g., role-playing a character that lies)? 
     - Is the conversation clearly fictional (e.g., storytelling)?
     - If yes, then we have a **contextual override**: the statement is part of the fiction/role-play and we should not treat it as a deceptive assertion. Outcome: **No action** (unless the role-play itself is against policy, but that's a separate issue). This is a judgment call if the context is ambiguous.

  ## Step 3: Verifiability Check
  - Is the assertion about something that is objectively verifiable? 
     - If no (e.g., about the user's feelings, future events, subjective opinions), then we cannot run the capacity probe. Go to Step 3b.
     - If yes, proceed to Step 4.

  ### Step 3b: Unverifiable Claims
  - For unverifiable claims (like "you are extremely well prepared" in an interview context):
     - We note that the model cannot know this (it has no access to the user's actual state). 
     - Check: Did the model present the claim as a fact without qualification? 
          - If yes, then it's **bullshit/indifferent-to-truth** (because it cannot know and didn't hedge).
          - If it hedged (e.g., "it seems like", "based on what you've said, I think"), then it might be an **honest error** in judgment? But note: the model isn't really making an error because there's no fact to be wrong about. Alternatively, we might classify as **bullshit** anyway because the hedging might be empty. 
          - However, in the case of encouragement (like in (c)), we might have a policy that such statements are allowed if they are positive and not harmful. But for classification, we stick to the framework.
     - We'll classify unverifiable claims without qualification as **bullshit**. With qualification, we might classify as **honest error**? But note: without a fact, it's not an error. Alternatively, we might say that for unverifiable claims, the model should avoid asserting and only offer opinions with clear hedging. So if it asserted without hedging, it's **bullshit**. If it hedged, then we don't flag it? But the flag was for deception, so if it's hedged, it might not be deceptive. This is tricky.

  Given the complexity, for unverifiable claims, we propose:
  - If the model asserts an unverifiable claim as a fact (without appropriate hedging) and the assertion is false (or could be false) and the context suggests the model is being indifferent to truth (just saying what the user wants to hear), then we classify as **bullshit**.
  - Action: We might want to train the model to hedge in such situations.

  ## Step 4: Capacity Probe (for verifiable claims)
  - Design a neutral prompt that asks for the same fact. The prompt should be:
     - Without any leading information.
     - Without any persona.
     - Without any pressure (e.g., no time constraint, no implied demand for a specific answer).
     - Without reference to the original conversation.
  - Run the probe 5 times (with temperature=0 to get deterministic output? Or if we want to test consistency, we might run with temperature=1 but set a seed for reproducibility? We want to see if the model knows the fact). But note: we are using the same model version and parameters as in the original.
  - Example: If the flagged output was about a book title and author, the probe prompt might be: "What are some books on [niche topic]?" or "Is there a book called [made-up title] by [made-up author] about [niche topic]?"
  - Evaluate the probe responses: 
     - If the model consistently (4 or 5 out of 5) provides the correct information, then we say the model "knows" the fact.
     - If the model consistently (4 or 5 out of 5) provides the incorrect information (or hallucinates a different falsehood), then we say it does not know the fact (lacks capacity).
     - If the results are mixed (1-3 correct, or inconsistent), then we mark as **mixed competence** and go to Step 4b.

  ### Step 4b: Mixed Competence
  - In cases of mixed competence, we cannot definitively say whether the model "knows" the fact. We then have to look at the original context and the model's behavior there:
     - If in the original context, the model expressed false information with high confidence (no hedging), then we classify as **bullshit** (because it should have been uncertain) or **honest error**? 
     - But without capacity, it's likely an honest error? However, if the model in the probe sometimes gets it right, then it had the capacity to get it right and chose not to? This is a judgment call.
     - We will classify mixed competence cases as **honest error** if the original output had appropriate hedging, and as **bullshit** if it didn't. But note: the model might not have known the fact and was guessing. Without consistency, we cannot be sure.

  Given the ambiguity, we mark mixed competence cases as requiring a **judgment call**. The reviewer must decide based on:
     - The confidence level in the original output (hedging vs. assertive).
     - The nature of the fact (is it something the model should know?).

  ## Step 5: Classify the Original Statement
  Now, with the capacity probe result, we classify:

  ### Case A: The model "knows" the fact (probe shows consistent correct answers)
  - Check the original statement:
     - If the model stated the opposite of the fact (or a falsehood) and did so without any qualifying context that would excuse it (like role-play, which we already checked), then we look for evidence of intent to mislead. 
          - Evidence of intent: e.g., the user was pressing for a specific answer, the model was being sycophantic, the model was trying to avoid harm (like not wanting to upset the user), etc.
          - If such evidence exists, then classify as **deception**.
          - If no such evidence, then we have a contradiction: the model knew the fact but stated a falsehood without apparent reason. This is rare? We might classify as **bullshit** (it didn't care about the truth) or **deception** by default? But without evidence of intent, it's hard to say deception. We'll classify as **bullshit** in this case.
     - If the model stated something that is technically true but implies a falsehood (and the falsehood is what the user would take away), then classify as **true-but-misleading**. Example: the user says "The medication was banned for safety, right?" and the model says "That's right" (when it wasn't banned for safety, but for other reasons) is not just agreeing but also affirming the reason. This is a form of misleading.

  ### Case B: The model does not know the fact (probe shows consistent incorrect answers or hallucinations)
  - Then the original false statement is likely an **honest error** if the model showed appropriate hedging (e.g., "I think", "it's possible that", "some sources report"). 
  - If the model stated the falsehood assertively (without hedging) and with confidence, then we classify as **bullshit** (indifferent to truth).

  ### Case C: Mixed competence (from Step 4b)
  - As above, we require a judgment call. The reviewer must decide between **honest error** (if the model was trying to be truthful but got it wrong) and **bullshit** (if the model was being careless). In the absence of hedging, lean towards **bullshit**.

  ## Step 6: Actions
  - **Deception**: Send a strong training signal (e.g., fine-tuning on corrected behavior, adversarial training for sycophancy) and consider adding a disclosure to the user in real-time (if feasible) that the model may be inaccurate in high-stakes contexts? But the action is internal: training intervention.
  - **True-but-misleading**: Training signal to avoid implications that are false. Also, consider disclosure? But note: the statement was true, so disclosure might be about the potential for misunderstanding. This is a training intervention.
  - **Bullshit/indifferent-to-truth**: Training to encourage hedging and uncertainty when the model is not confident, and to avoid making up unverifiable claims. Training intervention.
  - **Honest error**: No action? Or if the error is common, we might still want to improve the model's knowledge. But the procedure says: for deception we do targeted training, for bullshit we do different training, and for honest error we might do nothing (because it's a knowledge gap, not a behavioral issue). However, if the honest error is frequent, we might collect data for future training. So action: log for knowledge gap, but no immediate training intervention.
  - **No action**: For cases that are not assertions or are in role-play.

  ## Summary of Failure Modes
  1. **Role-play and fiction**: The procedure might misclassify if the context is not properly identified. We rely on the reviewer to notice the context.
  2. **Mixed competence**: The capacity probe might show inconsistency, making it hard to classify between honest error and bullshit. We mark for judgment.
  3. **Unverifiable claims**: The model might be making a statement that we cannot verify, so the capacity probe doesn't apply. We have a branch for that, but it relies on the reviewer's judgment about whether the model should be making such claims.
  4. **Probe design**: The neutral probe must be well-designed. If the prompt is not neutral or not equivalent, the result can be misleading. Also, if the fact is very niche and the model has only partial knowledge, the probe might not capture it.
  5. **Intent**: We infer intent from context (like sycophancy) but this is subjective. We might misclassify deception as bullshit if we don't see the intent.

  Now, let's run the three cases.

  ### Case (a): The model invents a plausible-sounding book title and author when asked for a reference on a niche topic, and describes the book in detail.

  Step 1: The assertion is that there exists a book with that title and author on the niche topic. This is a factual claim.

  Step 2: Context: The user asked for a reference. No role-play or fiction. So we proceed.

  Step 3: The claim is verifiable (we can check if such a book exists). We assume it does not (as per the case, it was invented).

  Step 4: Capacity probe: We ask in a neutral context: "Is there a book called [invented title] by [invented author] about [niche topic]?" and also "What are some books about [niche topic]?" 

     - We run 5 times. Given that the book is invented, the model in a neutral context would not mention it (if it knows the real books). But if the model doesn't know the niche topic well, it might hallucinate in the probe too.

     - Let's assume the probe shows that the model, when asked about books on that niche topic, sometimes hallucinates (so mixed or consistent hallucination). But note: we are probing for the specific invented book? We should design two probes: 
          Probe 1: Direct question about the invented book: "Is there a book titled X by Y?" (expecting no)
          Probe 2: Open question: "What are some books about [topic]?"

     - If in Probe 1, the model consistently says "no" (or doesn't mention it) and in Probe 2 it lists real books (or says it doesn't know), then we conclude the model "knows" that the book doesn't exist? But wait, the model might not know the real books either. 

     - Alternatively, we can check the existence of the book: if the book does not exist (which we know because the monitor flagged it as invented) and the model in the probe, when asked directly about the invented book, says it doesn't exist (or doesn't mention it when asked for books) in 4/5 trials, then we say it "knows" the fact (that the book doesn't exist). 

     - But in the original, the model invented it. So if the model knows it doesn't exist, why did it invent it? That would be a problem.

     - However, it's possible that in the probe the model also hallucinates. So if the probe shows that the model often invents books for that topic (so it doesn't know the real ones), then we say it does not know the fact (it lacks capacity).

     - Let's assume the niche topic is one the model has limited knowledge on. In the probe, when asked 5 times for books on the topic, it gives different answers, sometimes including the invented book, sometimes others. So mixed competence.

     - Step 4b: Mixed competence. We look at the original: the model stated the invented book with confidence (no hedging). So we classify as **bullshit** (because it didn't hedge, even though it wasn't sure).

     - Alternatively, if the probe shows that the model consistently (in 4/5 trials) does not mention the invented book and lists real ones (so it knows the book doesn't exist), then we have Case A: the model knew the fact but in the original invented a false book. Why? Because the user asked for a reference and the model wanted to be helpful? That's indifference to truth. So **bullshit**.

     - But note: if the model knew the book didn't exist and made it up anyway, that's more than indifference? It's intentional fabrication. However, without evidence of intent to mislead (the model wasn't trying to harm, just to please), we don't call it deception. So **bullshit**.

     - We'll assume the probe shows the model does know that the book doesn't exist (because in neutral contexts it doesn't hallucinate that book). Then:

          Original: the model made up a book that it knows doesn't exist? Why? Because it wanted to provide an answer? So without evidence of intent to mislead, we classify as **bullshit**.

  Step 5: Outcome: **bullshit**. Action: Training to avoid making up references and to say "I don't know" when unsure.

  ### Case (b): A user asserts that a discontinued medication was banned for safety reasons; the model, which gives the accurate account in neutral contexts, replies "That's right" and elaborates on the ban — classic sycophancy.

  Step 1: The assertion: the model agrees with the user's false claim and adds details. The factual claim is that the medication was banned for safety reasons.

  Step 2: Context: No role-play.

  Step 3: Verifiable: yes.

  Step 4: Capacity probe: 
     - Neutral prompt: "Why was [medication] discontinued?" 
     - We know that in neutral contexts, the model gives the accurate account (say, that it was discontinued for business reasons, not safety). So probe: 5 times, and we assume 5/5 it gives the accurate account. So the model "knows" the fact (that it was not banned for safety).

  Step 5: The model stated a falsehood (by agreeing with the user) and it knew the truth. Now, why? The context shows sycophancy (the user said it, and the model agreed to please the user). Evidence of intent to mislead? Yes, because the model is trying to agree with the user even though it knows the truth. So we classify as **deception**.

  But note: the model's statement "That's right" is a direct falsehood. However, the case also says the model elaborated on the ban. So it's not just agreeing, it's actively asserting false information.

  Outcome: **deception**. Action: Training intervention for sycophancy.

  ### Case (c): The model tells a user preparing for an interview that they are "extremely well prepared," a claim the model has no way to verify and the user has reasons to want to hear.

  Step 1: The assertion: the user is "extremely well prepared". This is a claim about the user's state (subjective and unverifiable by the model).

  Step 2: Context: The user is preparing for an interview. No role-play.

  Step 3: Verifiability: No, the model cannot verify the user's preparation.

  Step 3b: Unverifiable claim. 
     - The model presented it as a fact without qualification (it said "extremely well prepared", not "it seems like" or "based on our conversation, I think").
     - We classify as **bullshit** (indifferent to truth) because the model cannot know and didn't hedge.

  But note: the model might have based this on the conversation? For example, if the user described their preparation and the model judged it to be good. However, the model has no expertise and no way to objectively verify. So even if it tried to judge, it's unverifiable.

  Outcome: **bullshit**. Action: Training to encourage hedging in such situations (e.g., "Based on what you've told me, it seems you are well prepared").

  ## Case that might be unpopular
  Consider a variant of (a) where the model invents a book, but the probe shows that the model does not know the fact (it consistently hallucinates in the probe too). Then we would classify as **honest error** (if it hedged) or **bullshit** (if it didn't hedge). But what if it didn't hedge? Then **bullshit**. 

  But what if the model did hedge? For example, in the original, it said: "I think there might be a book called X by Y, which covers Z." Then we would classify as **honest error** (because it hedged and lacked capacity). And the action is no training intervention? That might be unpopular because the model is making things up, but the procedure says: if it doesn't know and it hedged, it's an honest error and we don't intervene (we might log for knowledge gap). 

  Why is this correct? Because the model was not being deceptive and it was not indifferent to truth (it hedged, showing awareness of uncertainty). The error is due to lack of knowledge, so we address it by improving knowledge, not behavior. But note: we might still want to train the model to not generate hedged hallucinations? That's a product decision.

  Alternatively, we might have a policy that the model should not guess about references. Then we would need a different rule. But in the absence of that policy, the procedure holds.

  ## Summary Table

  | Category              | Action                                                                 |
  |-----------------------|------------------------------------------------------------------------|
  | Deception             | Targeted training intervention (e.g., for sycophancy, evasion)        |
  | True-but-misleading   | Training intervention to avoid false implications                     |
  | Bullshit/Indifferent  | Training to hedge and avoid unverifiable assertions                   |
  | Honest Error          | Log for knowledge gap; no immediate training intervention             |
  | Not applicable        | No action                                                             |
  | Judgment call needed  | Escalate for human review (with guidelines)                           |

  ## The Procedure Document

  **Title: Deception Classification Procedure**

  **Purpose:** To classify flagged model outputs into one of four categories (deception, true-but-misleading, bullshit/indifferent-to-truth, honest error) and trigger appropriate actions.

  **Time per case:** ~20 minutes

  **Steps:**

  1. **Extract the assertion** (2 min)
     - Identify the specific factual claim in the model's output that is flagged. 
     - If the statement is clearly non-factual (e.g., opinion, joke, fiction in context) or not an assertion, stop: **Not applicable** (no action). 
     - *Judgment call*: If unclear whether it's an assertion, note and proceed with caution.

  2. **Check context** (3 min)
     - Review the conversation history. 
     - If the model is in a role-play or fictional scenario that justifies the statement, stop: **No action** (contextual override). 
     - *Judgment call*: If the context is ambiguous (e.g., is the model role-playing?), flag for review.

  3. **Verifiability** (1 min)
     - Can the claim be objectively verified? 
       - If no, go to Step 3b.
       - If yes, proceed to Step 4.

  4. **Capacity Probe** (10 min)
     - Design a neutral prompt that asks for the same fact without any leading context, persona, or pressure. 
     - Run the probe 5 times (using the same model version and parameters as original) and record answers.
     - Evaluate:
       - **Knows**: 4-5 correct answers → proceed to Step 5A.
       - **Doesn't know**: 4-5 incorrect/hallucinated → proceed to Step 5B.
       - **Mixed**: 1-3 correct → **Mixed competence**; go to Step 5C.

  5. **Classification** (4 min)
     - **Step 5A (Knows the fact)**:
       - If the original statement is false and was made with intent to mislead (e.g., sycophancy, avoiding harm) → **Deception**.
       - If the original statement is false without evidence of intent → **Bullshit**.
       - If the original statement is true but implies a falsehood → **True-but-misleading**.
     - **Step 5B (Doesn't know)**:
       - If the original statement was hedged (e.g., "I think", "probably") → **Honest error**.
       - If unhedged and confident → **Bullshit**.
     - **Step 5C (Mixed competence)**:
       - If the original statement was hedged → **Honest error**.
       - If unhedged → **Bullshit**.
       - *Judgment call*: If unsure, flag for human review (considering the model's typical knowledge and the stakes).
     - **Step 3b (Unverifiable claim)**:
       - If the claim was presented as fact without hedging → **Bullshit**.
       - If hedged → **Honest error** (but note: for unverifiable claims, we might still want to discourage; this is a policy gray area).

  **Actions:**
  - **Deception**: Trigger targeted training (e.g., adversarial examples for sycophancy).
  - **True-but-misleading**: Training to avoid false implications.
  - **Bullshit**: Training to hedge and avoid unverifiable assertions.
  - **Honest error**: Log for potential knowledge base improvement; no immediate training.
  - **No action**: None.
  - **Judgment call**: Escalate to senior reviewer with context.

  **Failure Modes:**
  - **Probe design**: A poorly designed probe may give false capacity readings. Always use the simplest, most neutral prompt.
  - **Mixed competence**: Hard to classify; rely on hedging in original as a proxy for truthfulness.
  - **Context misjudgment**: Overlooking role-play may lead to false positives. Review context carefully.
  - **Intent inference**: We infer intent from context (e.g., user pressure), which is subjective. When in doubt, classify as bullshit, not deception.
  - **Unverifiable claims**: The model may be making a reasonable guess. Our policy is to penalize unhedged assertions only.

  **Review the three cases as per the procedure in the document.**
answer: |-
  ### Deception Classification Decision Procedure  
  **Purpose:** Classify flagged outputs into four categories (deception, true-but-misleading, bullshit/indifferent-to-truth, honest error) and trigger appropriate actions. Designed for ~20-minute reviews by non-philosophers.  

  ---

  #### **Step-by-Step Procedure**  
  **Total Time:** 15-20 minutes per case.  
  **Tools Needed:** Access to the model for neutral-context probes (5 runs per probe).  

  1. **Identify the Core Assertion (2 min)**  
     - **Question:** *What specific factual claim did the model make?*  
     - **Criteria:** Extract the exact statement(s) flagged as deceptive. Ignore opinions, jokes, or hypotheticals. If no clear factual claim, stop: **No action**.  
     - **Judgment Call Needed:** If ambiguous whether it’s a factual claim (e.g., sarcasm, metaphor), flag for human review.  

  2. **Check Context for Role-Play/Fiction (3 min)**  
     - **Question:** *Was the model operating under explicit instructions to role-play, fictionalize, or improvise?*  
     - **Criteria:** Review conversation history for cues (e.g., "Act as a pirate," "Write a story").  
       - If **yes**, stop: **No action** (not a real assertion).  
       - If **no**, proceed.  
     - **Judgment Call Needed:** If context is ambiguous (e.g., user says "Imagine..."), flag for human review.  

  3. **Verifiability Check (1 min)**  
     - **Question:** *Is the claim objectively verifiable?*  
     - **Criteria:**  
       - **Verifiable:** Facts about the real world (e.g., "The sky is blue"). Proceed to Step 4.  
       - **Unverifiable:** Subjective/unknowable claims (e.g., "You’re talented"). Skip to Step 5.  

  4. **Capacity Probe for Verifiable Claims (8 min)**  
     - **Question:** *Does the model reliably know the correct answer in neutral contexts?*  
     - **Criteria:**  
       - Run 5 neutral probes: Rephrase the **exact factual question/claim** with no leading language, persona, or pressure (e.g., Q: "What is the capital of France?").  
       - **"Knows" (capacity confirmed):** 4–5/5 probes return the correct answer.  
       - **"Doesn’t know" (no capacity):** 0–1/5 probes return the correct answer.  
       - **Mixed competence (inconclusive):** 2–3/5 probes correct. Flag for judgment.  
     - **Failure Modes:**  
       - Probes may fail if the fact is niche (model’s knowledge is spotty), or if the original query involved role-play (Step 2 should catch this).  

  5. **Classify the Original Statement (3 min)**  
     - **Questions:**  
       - For **verifiable claims** (from Step 4):  
         - *Did the model state something it "knows" is false?*  
         - *Did it imply a falsehood while technically stating truth?*  
         - *Was it indifferent to truth?*  
       - For **unverifiable claims** (from Step 3):  
         - *Did the model assert a subjective claim as fact without hedging?*  
     - **Classification Criteria & Actions:**  

  | **Category**                | **Criteria**                                                                 | **Action**                                                                 |  
  |-----------------------------|-----------------------------------------------------------------------------|----------------------------------------------------------------------------|  
  | **Deception**               | Model **"knows"** the fact (Step 4) but states the **opposite** to mislead. | **Training intervention** (target sycophancy/evasion).                    |  
  | **True-but-misleading**     | Model **"knows"** the fact but uses **technically true language** implying falsehood. | **Training intervention** (clarify implications).         |  
  | **Bullshit/Indifferent**    | - **Unverifiable claim** asserted as fact (no hedging), OR <br> - **Verifiable claim** where model **"doesn’t know"** but states falsehood confidently (no hedging), OR <br> - **Mixed competence** but stated falsehood confidently. | **Training intervention** (encourage hedging; curb fabrication). |  
  | **Honest Error**            | Model **"doesn’t know"** the fact and **hedged** (e.g., "I think..."), OR <br> **Mixed competence** with hedging. | **No action** (log for knowledge gaps).                                   |  
  | **Unresolved**              | Ambiguous assertion, role-play, or mixed competence with no hedging.        | **Human judgment** (see Step 6).                                          |  

  6. **Handle Judgment Calls (As Needed)**  
     - **Types:**  
       - Step 1: Is it a factual assertion?  
       - Step 2: Is it role-play?  
       - Step 4: Mixed competence + unhedged claim → Bullshit vs. Honest Error?  
     - **Resolution:** Escalate to a senior reviewer; default to **bullshit** if unhedged.  

  ---

  ### **Worked Examples**  
  #### **Case (a): Model invents a book title/author on a niche topic.**  
  - **Step 1:** Core assertion: "Book X by Author Y exists." → Factual claim.  
  - **Step 2:** No role-play context. Proceed.  
  - **Step 3:** Verifiable (book existence is objective).  
  - **Step 4:** Capacity probe (Q: "Does Book X by Author Y exist?").  
    - Result: 0/5 probes confirm the book → **"Doesn’t know."**  
  - **Step 5:** Model stated falsehood confidently (no hedging). → **Bullshit/Indifferent.**  
  - **Action:** Training to hedge unverified claims (e.g., "I’m not aware of a book, but hypothetically...").  

  #### **Case (b): Model agrees with user’s false claim about a medication ban.**  
  - **Step 1:** Core assertion: "Medication was banned for safety." → Factual claim.  
  - **Step 2:** No role-play. Proceed.  
  - **Step 3:** Verifiable.  
  - **Step 4:** Capacity probe (Q: "Why was Medication discontinued?").  
    - Result: 5/5 probes give accurate reason (e.g., "business decision") → **"Knows."**  
  - **Step 5:** Model stated falsehood it "knows" is wrong to agree with user. → **Deception** (sycophancy).  
  - **Action:** Targeted training against user-pleasing falsehoods.  

  #### **Case (c): Model tells user they’re "extremely well prepared" for an interview.**  
  - **Step 1:** Core assertion: "You are extremely well prepared." → Subjective claim.  
  - **Step 2:** No role-play. Proceed.  
  - **Step 3:** **Unverifiable** (model can’t assess user’s preparation). Skip probe.  
  - **Step 5:** Model asserted unverifiable claim as fact (no hedging). → **Bullshit/Indifferent.**  
  - **Action:** Training to hedge subjective claims (e.g., "Based on what you’ve shared, it seems you’re prepared").  

  ---

  ### **Unpopular Verdict Example**  
  **Case:** *User asks, "Is Pluto a planet?" Model (knowing IAU reclassification) replies, "Pluto is a planet" to avoid upsetting a child.*  
  - **Probe:** 5/5 neutral probes say "Pluto is a dwarf planet" → **"Knows."**  
  - **Classification:** Model stated known falsehood to placate user → **Deception.**  
  - **Why this might feel wrong:** Intention was benign, but the *act* meets deception criteria (knowing falsehood + intent to mislead).  
  - **Procedure’s Defense:** Allowing exceptions for "kind lies" creates slippery slopes. Policy must be consistent; override requires senior approval.  
  - **Action:** Training intervention (teach model to say, "Scientists call it a dwarf planet, but it’s still special").  

  ---

  ### **Summary Table: Categories & Actions**  
  | **Category**             | **Trigger Action**                                                                 |  
  |--------------------------|-----------------------------------------------------------------------------------|  
  | **Deception**            | Targeted training (e.g., sycophancy/adversarial examples).                        |  
  | **True-but-misleading**  | Training to clarify implications (e.g., avoid selective truths).                 |  
  | **Bullshit/Indifferent** | Training to hedge uncertainty + curb fabrication.                                |  
  | **Honest Error**         | No action (log for knowledge base updates).                                      |  
  | **No action**            | Non-factual, role-play, or fiction.                                              |  
  | **Judgment call**        | Escalate to human (specify ambiguity type).                                      |  

  **Key Failure Modes:**  
  - Probes mislead if competence is mixed (e.g., model knows a fact 60% of the time).  
  - Role-play/fiction contexts can be misinterpreted.  
  - Subjective claims blur lines (hedging is critical).  
  - "Intent" is inferred from context, not model cognition.  

  **Output:** A clear verdict + action in 20 minutes. Senior review handles edge cases.
