answer: |-
  Based on your detailed description and analysis of the near misses, this pattern does not have a widely recognized, established name in epistemology, argumentation theory, or the rationalist corpus. While elements echo known fallacies (like ad hominem circumstantial, poisoning the well, or self-sealing beliefs), the specific two-step, self-sealing structure using a gerrymandered reference class *and* pathologizing objections to it is unique.

  **Coined Term & Definition:**

  **Epistemic Boobytrapping (or Dialectical Boobytrapping)**

  *   **Definition:** An argumentative tactic where one party (B) dismisses another's (A) position by:
      1.  **Diagnostic Absorption:** Asserting that arguments sharing superficial characteristics with A's position ("shape," "flavor of confidence," etc.) have a poor track record within a gerrymandered reference class assembled post hoc. The existence of A's argument is presented as evidence *against* its conclusion.
      2.  **Objection Pathologization:** Characterizing any challenge to the validity of the reference class (e.g., claims of gerrymandering, question-begging) *itself* as inevitable evidence of A's cognitive bias ("in the grip of the inside view"), thereby absorbing the objection as further confirmation of the diagnostic.
  *   **Result:** A's position, objections to the diagnostic, and even silence become self-defeating evidence for B's conclusion, creating an inescapable, self-sealing loop that immunizes B's "outside view" critique from falsification *within the dialectic*.

  **Distinguishing from Near Misses:**

  1.  **Kafkatrapping:** Focuses on extracting confessions of moral/ideological guilt; Epistemic Boobytrapping targets *credence* and *epistemic justification* using track record claims.
  2.  **Fully General Counterargument:** Logically vacuous ("All arguments can be wrong"); EB uses a specific, seemingly empirical claim about a track record to generate its generality structurally via absorption loops.
  3.  **Reference Class Tennis:** Involves competing, legitimate outside views; EB features only *one* monopolized "outside view," pathologizing attempts to play the game or question the class.
  4.  **Popperian Unfalsifiability:** Applies to substantive theories; EB is a *dialectical posture* that renders the *opponent's specific position* unfalsifiable *by proxy* via the self-sealing diagnostic.

  **The Principled Marker: Pre-Registration & Challengeability**

  You're right to suspect retrospective markers are insufficient. The core degeneracy lies in the **post hoc construction and insulation from challenge** of the reference class. The principled distinction for a legitimate outside view is:

  1.  **Pre-Registration of the Reference Class & Criteria:** The class of cases ("models of this kind," "arguments with this shape") and the criteria for inclusion/exclusion *must be defined independently and in advance of* the specific dispute and *especially* the knowledge of who was right/wrong in the target case. This definition should be based on substantive, shared features logically relevant to the likelihood of error, not superficial similarities or outcomes.
  2.  **Validation Out-of-Sample:** The track record claim must be validated using data *not* used to define the class or included in the initial assessment. The assessment methodology itself needs independent justification.
  3.  **Challengeability Without Pathologization:** Legitimate use *allows* and *engages* with substantive challenges to:
      *   The definition of the reference class (Is it coherent? Relevant? Non-gerrymandered?).
      *   The accuracy of the track record assessment (Were the cases assessed correctly?).
      *   The applicability to A's specific case (Is *this* model/argument *really* a member of that class in a meaningful way?).
      *   Crucially, *raising these challenges is not treated as evidence of bias or being "in the grip" of the inside view*. It's treated as a normal, necessary part of evaluating the outside view's applicability and strength.

  **Why this marker works (arguing the point, not consoling):**

  *   **Pre-Registration Prevents Gerrymandering:** Defining the class *before* knowing outcomes prevents cherry-picking cases to fit a desired track record for *this* dispute. It forces the class to be defined based on inherent properties, not outcomes.
  *   **Out-of-Sample Validation Prevents Overfitting:** Testing the track record on novel data ensures the claimed failure rate isn't an artifact of how the class was constructed using the very data it purports to explain.
  *   **Challengeability Prevents Absorption/Pathologization:** Legitimate outside views are probabilistic heuristics, not infallible oracles. Their value diminishes if the class definition is flawed or misapplied. *Requiring* that these aspects be open to rational challenge, without penalizing the challenger, breaks the self-sealing loop. It forces B to defend the *merits* of their class definition and track record claim, rather than using A's defense as fuel.
  *   **Focuses on Methodology, Not Psychology:** The legitimate marker focuses on the *process* of defining and applying the outside view (pre-registration, validation, open challenge). The degenerate form constantly shifts focus to A's *state of mind* ("you're in the grip") to deflect methodological criticism. Demanding methodological rigor sidesteps this psychological trap.

  **Conclusion:** The pattern is **Epistemic Boobytrapping**. The principled marker distinguishing legitimate outside-view usage is the **pre-registration of the reference class and its criteria, validated out-of-sample, accompanied by a commitment to engage with challenges to the class definition, track record, and applicability without pathologizing the challenger.** This marker isn't merely retrospective; it's a methodological standard that can be demanded *during* the dispute: "Show me the pre-registered definition and validation of this reference class you're invoking, and explain why my challenge to its validity is mistaken *on the merits*, not because I'm supposedly biased." If B cannot or will not meet this standard, their "outside view" critique is likely degenerate.
