  **Revised Brinkmanship Deterrence Game (Version 2)**

  **Gameplay per round:**
  1. Both players simultaneously choose to either **Escalate** or **Back Down**.
  2. Outcomes:
     a. If both choose **Back Down**: the game ends without catastrophe. Both players receive the payoff for the current rung.
     b. If one chooses **Escalate** and the other **Back Down**: the game ends without catastrophe. Both players receive the payoff for the current rung.
     c. If both choose **Escalate**: 
          - If not at rung4, move up one rung.
          - If at rung4, stay at rung4.
          - Then both players draw one card from the deck of the new rung (or rung4 if they were already at rung4 and both escalated).
          - If either card is detonation, catastrophe: game over, both get 0.
          - If both are safe, the game continues at the new rung (or stays at rung4).

  **Precommitment:**
  - A player can precommit at any time before a round by placing a token and announcing.
  - A precommitted player must choose **Escalate** in every subsequent round until the other player chooses **Back Down** in a round (which will cause the game to end without catastrophe at the current rung).
  - Once the other player backs down, the precommitment is lifted.

  **Note on rung4:** If at rung4 and both escalate, they stay at rung4 and draw from the rung4 deck. If they survive, the game continues at rung4. They can keep doing this until one backs down or catastrophe occurs.

  **Payoff for ending without catastrophe:** current rung's payoff.

  **Example:**
  - At rung0, both escalate: move to rung1 and draw. If safe, at rung1.
  - At rung1, PlayerA precommits. Then in the next round, PlayerA must escalate. PlayerB chooses to back down. Then the game ends without catastrophe at rung1. Both get 8 points.

  This works.

  **Ending at rung4 without catastrophe:** if at rung4, one or both back down, the game ends and both get 2 points. If both escalate, they draw and risk catastrophe.

  This version is cleaner.

  **Timeline for the session:**
  - 0-10 min: Introduction to the activity and rules explanation (using the revised Version 2).
  - 10-15 min: Setup (pair up, hand out materials).
  - 15-25 min: Gameplay (one game per pair).
  - 25-30 min: Collect results (ask each pair: ending rung, catastrophe or not, precommitment used?).
  - 30-75 min: Debrief (45 min).

  **Debrief Outline:**
  1. Ask students about their experiences: 
     - "Who ended at rung0? Why did you both back down immediately?"
     - "Who experienced catastrophe? How did it feel?"
     - "Did anyone use precommitment? How did it affect the game?"

  2. Map to concepts:
     - Credibility: How did precommitment make threats credible? Why is it hard to be credible without precommitment?
     - The role of chance: Why did we have the decks? How does the risk of accidental catastrophe make escalation a credible threat? (Because you are not choosing to destroy yourself, you are just taking a risk.)
     - Brinkmanship: The strategy of escalating to force the other to back down. Why is it like threatening to flip a coin? (Because the catastrophe is left to chance.)
     - Stability-instability paradox: In the game, did the low risk at lower rungs encourage more escalation? In real life, does the stability of mutual assured destruction (at the top) encourage more small conflicts?

  3. Discuss the outcomes:
     - The pairs that never escalated: they got the highest payoff. Why doesn't this happen in real life? (Because states have disputes and incentives to push.)
     - The pairs that escalated and had catastrophe: what might they have done differently? 
     - The pairs that used precommitment: did it work? Why or why not?

  4. Limitations of the game:
     - The counterfactual problem: when deterrence works, we don't see the catastrophe. In the game, we see both.
     - The abstraction of consequences.
     - The bilateral and one-shot nature.

  **Predictable problems and handling:**
  - Racing to the top: This is a teaching moment. They learn that mutual escalation leads to high risk of catastrophe.
  - Never escalating: This is also a teaching moment. It's the safe choice, but in real life, states often have unresolved disputes that fester. We can discuss why states might not always choose this.
  - Precommitment not used: Explain its purpose and ask what they think would have happened if they had used it.
  - Time: 10 minutes might be tight for some pairs. Have a timer and call time. If a pair hasn't finished, they can report the current state and what they think would happen.

  **Final Note:** The game is a simplification, but it captures the core paradox: to make a threat credible, you must make it costly for yourself to back down, and you must introduce an element of risk that is beyond your control. This is the essence of deterrence in the nuclear age.
