  ### **Deterrence Game: "Brinkmanship Standoff"**

  **Objective:** Students experience the paradox of deterrence—threats only work if they are costly to carry out, requiring players to *appear irrational* or *cede control* to succeed. The game uses an escalation ladder with a chance-based trigger, mimicking Schelling’s brinkmanship (e.g., "threatening to flip a coin is credible; threatening to press a button isn’t").

  ---

  ### **Game Rules**
  **Players:** Pairs of students (8 pairs total for 16 students).  
  **Roles:** Each pair is two rival states ("North" and "South").  
  **Duration:** 5–7 minutes per game.  
  **Materials per Pair:**  
  - **Escalation Ladder Board** (5 rungs: 0 to 4).  
  - **Deck of Cards** for chance-based detonation (see below).  
  - **Precommitment Tokens** (e.g., red cards).  
  - **Payoff Tokens** (e.g., candy or extra credit chips: 10 tokens = max payoff).  
  - **Player Sheets** (for secret moves).  

  #### **Escalation Ladder & Payoffs**
  | Rung | Description | Cost to Escalate | Payoff if Game Ends Here | Detonation Risk |
  |------|-------------|------------------|--------------------------|-----------------|
  | 0    | Status quo  | None             | 10 tokens each           | 0%              |
  | 1    | Low tension | 1 token each     | 8 tokens each            | 10%             |
  | 2    | Crisis      | 1 token each     | 6 tokens each            | 25%             |
  | 3    | Brink       | 1 token each     | 4 tokens each            | 50%             |
  | 4    | War         | 1 token each     | 0 tokens each (catastrophe) | 100%            |

  - **Detonation Deck:** 10 cards per deck (use playing cards):  
    - Rung 1: 9♥ (safe) + 1♠ (detonate).  
    - Rung 2: 7♥ + 3♠.  
    - Rung 3: 5♥ + 5♠.  
    - Rung 4: 0♥ + 10♠ (automatic detonation).  
  - **Payoffs:** Awarded only if the game ends *without* catastrophe. Tokens are physical (e.g., candy).

  #### **How to Play**
  1. **Start:** Both players at Rung 0. Each starts with 10 tokens (their "budget" for costs).  
  2. **Each Round (simultaneous secret moves):**  
     - Players write **"Escalate"** or **"De-escalate"** on their sheets.  
     - Reveal choices:  
       - **If both de-escalate:** Game ends. Players split payoff for current rung.  
       - **If one escalates, one de-escalates:** Escalating player moves up 1 rung; de-escalating player stays. Both pay the cost to escalate (1 token). *Then, draw from the deck of the new rung:*  
         - ♥ = Safe. Game continues.  
         - ♠ = **Detonation.** Game ends. Both lose all tokens (catastrophe).  
       - **If both escalate:** Both move up 1 rung. Both pay 1 token. *Then, draw from the deck:* Same risk as above.  
  3. **Precommitment Option (Schelling’s "burning bridges"):**  
     - Before any move, a player can **precommit** by placing a red token on the table and declaring: *"I will escalate every round until you de-escalate. I cannot back down."*  
     - Precommitment is irreversible. The player *must* escalate every round until the opponent de-escalates.  
     - If both precommit, they escalate until catastrophe or Rung 4.  
  4. **Winning:** Players keep tokens earned. Highest token count "wins" (but emphasize: real goal is avoiding catastrophe).  

  **Key Mechanics:**  
  - **Chance Trigger:** Escalation doesn’t cause war; it increases the *risk* that war happens "accidentally" (card draw).  
  - **Costs:** Each escalation costs tokens (simulating economic/political costs).  
  - **Rung 4:** Automatic catastrophe if reached (100% detonation).  

  ---

  ### **Session Timeline (75 Minutes Total)**
  1. **Intro & Setup (10 min):**  
     - Explain rules *without* using "deterrence" or "brinkmanship." Frame it as a "crisis bargaining game."  
     - Assign pairs and hand out materials.  
     - Non-playing students (if any) observe and take notes on strategies.  

  2. **Gameplay (15 min):**  
     - **Round 1 (7 min):** All 8 pairs play simultaneously.  
     - **Round 2 (7 min):** Rotate partners (new pairs). *Optional: Allow precommitment in Round 2 only.*  
     - **Monitor:** Walk around to clarify rules. Use a timer.  

  3. **Debrief (50 min):**  
     - **Step 1: Share Outcomes (10 min)**  
       - Poll pairs: "Who had catastrophe? Who reached high rungs? Who used precommitment?"  
       - Note trends on the board (e.g., "6 catastrophes in 16 games").  
     - **Step 2: Map Mechanics to Concepts (25 min)**  
       | Game Mechanic              | Real-World Concept                  | Discussion Question                                                                 |
       |----------------------------|-------------------------------------|-------------------------------------------------------------------------------------|
       | Cost to escalate           | Sunk costs of conflict              | "Why did paying tokens make threats feel more real?"                                |
       | Precommitment token        | Irrationality/audience costs       | "Why did destroying your ‘exit option’ force the other player to back down?"        |
       | Drawing cards at higher rungs | Brinkmanship (chance as credibility) | "Why is threatening to ‘flip a coin’ (e.g., card draw) more credible than threatening to push a button?" |
       | Rung 4 (100% catastrophe)  | Mutually Assured Destruction (MAD) | "Why might players avoid escalating to Rung 3, but test each other at Rung 1?" (Stability-Instability Paradox) |
       | Both de-escalating at Rung 0 | Deterrence success (counterfactual)| "If no one escalates, how do we know if the threat ‘worked’?" (See "Gaps" below)    |
     - **Step 3: Reveal the "Point" (15 min)**  
       - Introduce Schelling: "The game was about **deterrence**. Success requires:  
         - **Credibility through irrationality** (precommitment).  
         - **Ceding control** (chance as a tripwire).  
         - **Stability-Instability Paradox**: Low rungs feel ‘safe’ for escalation because high rungs are unthinkable."  
       - Connect to nuclear deterrence: "Why did Cold War powers use ‘dead hand’ triggers (automation) or public threats?"  

  ---

  ### **What Will Go Wrong (and How to Handle It)**  
  1. **Pairs race to catastrophe:** Some will escalate to Rung 4 "to see what happens."  
     - **Why it’s good:** They experience the cost of uncontrolled escalation. Debrief: "What motivated this? Would a real leader do this?"  
  2. **Pairs collude to never escalate:** They stay at Rung 0 and split max payoffs.  
     - **Why it’s good:** Highlights the counterfactual problem of deterrence. Debrief: "If no one ever escalates, how do we know if threats work?"  
  3. **Precommitment underused:** Students may ignore it to avoid rigidity.  
     - **Fix:** In Round 2, remind players: "Precommitment is allowed. Try it if you want to force a concession."  
  4. **Time overruns:** Games may stall if players de-escalate repeatedly.  
     - **Fix:** Cap at 4 rounds per game. After Round 4, end the game and award current rung’s payoff.  

  ---

  ### **What the Game Can’t Replicate (Structural Gaps)**  
  1. **The Counterfactual Problem:**  
     - In reality, **deterrence success is invisible** (nothing happens). The game shows outcomes, but in the real world, we never see the wars that *didn’t* occur due to threats. This makes deterrence hard to prove or learn from.  
  2. **Scale of Consequences:**  
     - Tokens trivialize costs. Real deterrence involves **human lives and civilizational risk**, which creates emotional/political pressures beyond game theory.  
  3. **Misperception & Miscalculation:**  
     - Players know the exact risks (10%/25%/50%). Real leaders act with **imperfect intelligence**, cultural biases, and emotional stress (e.g., Castro during the Cuban Missile Crisis).  
  4. **Long-Term Dynamics:**  
     - The game is short-term. Real deterrence involves **reputation, alliances, and repeated interactions** (e.g., NATO’s credibility depending on past actions).  

  ---

  ### **Materials Prep Checklist**  
  - **Per Pair:** Escalation board, 40 playing cards (10 per rung deck), 20 tokens (candy/chips), 2 red precommitment cards, 2 player sheets.  
  - **For You:** Timer, whiteboard for tracking outcomes, Schelling quotes for debrief.  

  This design forces players to confront the game’s core paradox: winning requires embracing irrationality and uncertainty. By the debrief, they’ll feel why Schelling called deterrence a "competition in risk-taking."
