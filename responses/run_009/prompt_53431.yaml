  We are designing a decision procedure for cases that might fall under the unilateralist's curse. The core idea is to centralize decisions when unilateral actions by individual researchers could lead to collective harm, even if each action is individually reasonable.

  Key elements:
  1. We want a precautionary default: when in doubt, side with caution and require consultation.
  2. The procedure must be practical and run by the safety office.
  3. We need to separate factual questions (which the safety office can settle) from value questions (which must be escalated).
  4. We must specify when to say "no", "yes", or "consult", and what to do if consultation is not possible in time.
  5. We must consider the number of people who could act unilaterally: the curse is more relevant when multiple actors are present.
  6. We will apply the procedure to the three cases and be candid about misfires.

  Procedure Outline:

  Step 1: Initial Triage
     - Is this action covered by an explicit trigger on our list? If yes, follow the existing review procedure. If no, proceed to Step 2.

  Step 2: Assess Unilateral Action Risk
     - Factual Question: How many people (or groups) are in a position to take this action unilaterally (i.e., without requiring sign-off under current rules)? 
          - Sufficient answer: A specific number or range, based on the organization's structure and the nature of the action.
          - If only one person/group can take the action, then the unilateralist's curse does not apply. Proceed to Step 3 with caution that the curse is not a factor, but other risks might be.
          - If multiple (>=2) can take the action, then the curse is a concern. Proceed to Step 3 with the curse as a key factor.

  Step 3: Risk Assessment
     - Factual Questions:
          a) What is the probability of harm (P) if the action is taken? (Estimate: low, medium, high, with criteria for each)
          b) What is the severity of that harm (S)? (low, medium, high, with criteria)
          c) What is the probability that the action will lead to significant legitimate benefits (B)? (low, medium, high)
          d) What is the magnitude of those benefits? (low, medium, high)

     We need predefined criteria for these levels. For example:
          - Probability: 
              Low: <1% chance of harm in the next year, or harm requires very unlikely chain of events.
              Medium: 1-10% chance, or harm is plausible but not certain.
              High: >10% chance, or harm is likely in the circumstances.
          - Severity:
              Low: Minor inconvenience, small financial loss, or reversible harm.
              Medium: Significant financial loss, reputational damage, or non-lethal injury.
              High: Loss of life, widespread ecological damage, or catastrophic financial loss.
          - Benefits: similarly defined.

     - Value Question: How do we weigh the benefits against the risks? (This is a value judgment that must be escalated if the safety office cannot make it.)

  Step 4: Decision Matrix
     We consider the risk level (which combines P and S) and the benefit level (which combines probability and magnitude of benefit). We also consider the curse factor (from Step 2).

     Risk Level (R) = P * S (we can use a 3x3 matrix to combine: e.g., low*low=low, low*medium=medium, etc., but we can be more precise with a table).

     We'll define:
          - If R is "low" and benefit is "high": then the action may be allowed without consultation, but note the curse factor.
          - If R is "medium" or "high", then we require consultation.

     However, the curse factor changes the threshold:

     Without curse (only one actor):
          - Allow if R is low and benefit is at least medium, OR if R is medium and benefit is high (with caution).
          - Otherwise, consult.

     With curse (multiple actors):
          - Precautionary principle: we require consultation for any R above low, or if R is low but benefit is not high (because even low risk becomes more likely when multiple actors can take the action).
          - Only allow without consultation if R is low and benefit is high.

     But note: we must also consider the time factor for consultation.

  Step 5: Consultation Requirement and Fallback
     - If the decision is "consult", then we must try to convene a review panel (with representatives from safety, research leadership, and possibly an external expert) within the available time.
     - If consultation is impossible in the time available (e.g., the demo is in two days), then we use a fallback rule:
          - Without curse: allow the action only if the risk level is low and benefit is at least medium. Otherwise, disallow.
