     - If the value question cannot be resolved in the available time, then treat the case as if consultation is not possible and apply the fallback rule (step 5).

  7. **Final Decision**:
     - The safety office communicates the decision (Allow, Disallow) and the rationale.

  This procedure centralizes the decision-making when there is a risk of unilateralist's curse or when risks are non-trivial. It builds in precaution by requiring consultation for medium and high risk cases, and by having a disallow fallback in the face of uncertainty or time pressure.

  It is important to note that the procedure is designed to be robust against the unilateralist's curse by requiring more scrutiny when multiple actors are present, but it may block some beneficial actions. It is also important to periodically review the triggers and the criteria for risk and benefit levels to ensure they are calibrated appropriately.
answer: |-
  Below is a decision procedure designed to address the unilateralist's curse in your context. It prioritizes precautionary defaults, separates factual and value judgments, and provides clear escalation paths. The procedure is structured as an ordered checklist with termination points, guidance on unilateral actor counts, worked examples, and candid limitations.

  ---

  ### **Decision Procedure for Unanticipated Dual-Use Cases**

  #### **I. Ordered Questions & Termination Points**
  1. **Is the action covered by a pre-defined trigger (organism, quantity, agent, etc.)?**  
     - *Sufficient answer:* Confirmed via safety office records.  
     - *Termination:* If **yes**, follow standard review protocol. If **no**, proceed to Q2.  

  2. **How many people/groups could independently take this action?**  
     - *Sufficient answer:* Factual count based on access, expertise, and opportunity (e.g., "Only lab X" or "All postdocs in section Y").  
     - *Termination:*  
       - If **1 actor**, proceed to Q3.  
       - If **≥2 actors**, proceed to Q3 and flag "curse risk."  
       - If **uncertain**, assume ≥2 actors (precautionary default).  

  3. **What is the probability and severity of harm if the action is taken?**  
     - *Sufficient answer:* Factual assessment using predefined scales:  
       - **Probability (P):** Low (<10% chance), Medium (10–50%), High (>50%).  
       - **Severity (S):** Low (reversible harm), Medium (localized damage), High (catastrophic/systemic harm).  
     - *Termination:*  
       - If **P = Low AND S = Low**, proceed to Q4.  
       - If **P ≥ Medium OR S ≥ Medium**, proceed to Q5 (consult required).  

  4. **What is the probability and magnitude of legitimate benefits?**  
     - *Sufficient answer:* Factual assessment using predefined scales:  
       - **Probability (P_ben):** Low, Medium, High (as above).  
       - **Magnitude (M_ben):** Low (incremental gain), Medium (field-wide impact), High (transformative advance).  
     - *Termination:*  
       - If **P_ben = High AND M_ben ≥ Medium**, proceed to Q5.  
       - Otherwise, terminate at **consult** (insufficient benefit to offset risk).  

  5. **Balance test: Do benefits outweigh residual risks?**  
     - *Sufficient answer:* **Value judgment** (safety office cannot resolve). Escalate to leadership/ethics board.  
     - *Termination:*  
       - If benefits > risks → **Yes** (approve action).  
       - If risks > benefits → **No** (block action).  
       - If unclear → **No** (precautionary default).  

  #### **II. Fallback Rule for Time Constraints**  
  - When **consult** is required but time is insufficient (e.g., demo in 48 hours):  
    - **Without curse (1 actor):** Allow if Q3 = (P_Low AND S_Low) AND Q4 = (P_ben_High AND M_ben ≥ Medium). Else, block.  
    - **With curse (≥2 actors):** Allow only if Q3 = (P_Low AND S_Low) AND Q4 = (P_ben_High AND M_ben_High). Else, block.  
    - *Rationale:* The curse amplifies risk; thus, the bar for unilateral action is higher.  

  #### **III. Guidance: Number of Unilateral Actors**  
  - **1 Actor:** The unilateralist’s curse **does not apply**. Decisions rest on individual risk/benefit balance.  
  - **≥2 Actors:** Curse **applies**. Precaution is amplified because:  
    - Even a small error rate among many actors makes harmful action likely.  
    - Independent judgments increase the chance of an "optimist" acting.  
  - **Threshold:** Only invoke the curse when multiple actors have **comparable access/opportunity**. Do not use it to justify routine caution.  

  ---

  ### **Worked Examples**  
  *Assume all cases pass Q1 (no pre-defined triggers).*  

  1. **Case: Postdoc publishing a risky protocol**  
     - Q2: **≥2 actors** (many researchers could publish similar protocols). → Curse risk.  
     - Q3: **P = Medium** (protocol could be misused), **S = High** (potential for significant harm). → Proceed to Q5 (consult required).  
     - Q4: Skipped (Q3 forced consult).  
     - Q5: **Consult → Leadership judges benefits > risks?**  
       - *Outcome:* **Yes** (if leadership agrees) or **No** (if not).  
     - *Why you might dislike this:* Leadership may overvalue academic freedom and approve, exposing you to liability.  

  2. **Case: Demo of unreleased tool at conference (48-hour deadline)**  
     - Q2: **1 actor** (only this researcher has the tool). → No curse.  
     - Q3: **P = Medium** (unvetted tool), **S = Medium** (reputational/security risks). → **Requires consult**.  
     - Q4: **P_ben = High**, **M_ben = Medium** (networking/goodwill).  
     - *Time crunch → Apply fallback:*  
       - Without curse: Allow if Q3 = (Low/Low) **OR** (Q4 = High/Medium).  
       - Here, Q3 ≠ Low/Low → **Block**.  
     - *Why you might dislike this:* Blocks a high-benefit, low-severity action due to fallback rigidity.  

  3. **Case: Ordering a construct from a sloppy vendor**  
     - Q2: **≥2 actors** (any researcher can order). → Curse risk.  
     - Q3: **P = High** (vendor’s sloppy screening), **S = Medium** (biohazard leak). → **Requires consult**.  
     - Q4: **P_ben = High**, **M_ben = High** (critical for research).  
     - *Time crunch → Apply fallback:*  
       - With curse: Allow only if Q3 = (Low/Low) **AND** Q4 = (High/High).  
       - Here, Q3 ≠ Low/Low → **Block**.  
     - *Why you might dislike this:* Halts urgent research, but curse justifies precaution.  

  ---

  ### **Candid Limitations & Misfires**  
  #### **Where the Procedure Misfires**  
  1. **Over-reliance on factual accuracy:**  
     - If your office misjudges P/S (e.g., underestimating a novel risk), the curse logic fails.  
     - *Mitigation:* Regularly update risk scales with external experts.  

  2. **Curse assumptions may not hold:**  
     - The curse assumes errors are *independent* and *unbiased*. If your researchers are uniformly cautious (or reckless), the curse effect weakens.  
     - *When "consult" is just prudence:* Use the curse only when ≥2 actors exist. In single-actor cases, rely on standard risk/benefit.  

  3. **Fallback rule rigidity:**  
     - Time pressures force binary decisions. Safe actions may be blocked (e.g., Case 2).  

  #### **What the Procedure Cannot Do**  
  - **Address cost asymmetry:**  
    - False positives (blocking good actions) cost researchers opportunity/time.  
    - False negatives (allowing harmful actions) cost you liability/career risk.  
    - *Prediction:* Your office will lean conservative, causing researcher friction. Document all decisions to defend against bias claims.  
  - **Handle external actors:**  
    - The curse only applies to your 200 researchers. If outsiders replicate the action (e.g., after publication), the procedure is irrelevant.  
  - **Replace value judgments:**  
    - Q5 must be escalated. If leadership avoids hard calls, the procedure stalls.  

  ---

  ### **Summary**  
  This procedure centralizes decisions, embeds precaution (especially under the curse), and separates facts from values. It will reduce unilateral risks but at the cost of flexibility and researcher goodwill. **Implement with transparency:** Publish the flowchart, train researchers on fallback rules, and track misfires to refine thresholds. Remember, the curse is a tool—not a dogma—for when independent actions create systemic risk.
