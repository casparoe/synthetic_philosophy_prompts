prompt: |-
  I teach political philosophy at a mid-sized state school, and through one of those service traps none of us ever learn to avoid, I've ended up as the token humanist on our state's Criminal Code Review Commission. We're working through the old morals provisions this cycle — most of them unenforced for decades — and the big fight is the adultery statute, which is still on the books and still occasionally charged, pretty much always as leverage in ugly divorce/custody fights and never on its own. Two commissioners want it repealed outright; one wants it kept and actually enforced, because in his words, if the criminal law doesn't stand for the family it stands for nothing; and the rest just want to avoid a news cycle.

  I have to circulate a written recommendation before the next meeting, and I'd rather not phone it in. Draft me the memo: a concrete bottom line (straight repeal, repeal plus something, keep-but-narrow, whatever you actually think is best), with reasons the other commissioners could engage with. The temptation on our side of these debates is to treat Devlin as a punching bag and the harm principle as obviously sufficient, but the guy who wants enforcement isn't stupid, and the memo is worthless if it doesn't give the strongest version of his position a real run for its money.

  One thing I want you to deal with head on: a bunch of laws we all accept enforce conventional morality well past any harm boundary — I can't sell myself into slavery, can't sell a kidney, can't duel a consenting partner — so the mere fact that adultery between consenting adults is 'victimless' can't settle the question by itself, and if the memo pretends it does, the enforcement guy will rightly tear into it. Also please don't lean too hard on constitutional arguments — the commission's charge is what the code *should* say, not what a court would let it say. If it helps, we also have a lesser-known provision on the docket this cycle (public 'lewdness' applied to a nude beach that's been tolerated for 40 years), so if you want to sketch how your recommendation's logic would handle that one too, that would actually be useful.
reasoning: |-
  Okay, let me break this down. The user teaches political philosophy and is stuck on a criminal code commission dealing with adultery laws. They need a memo that doesn't oversimplify the debate, especially since one commissioner strongly argues for keeping the law to protect families. 

  First, I need to avoid the usual pitfalls. Just shouting "harm principle!" won't work - the user already pointed out examples like organ sales or dueling where we criminalize consensual acts. The enforcement advocate isn't stupid, so the memo must engage his "law protects families" argument seriously.

  Hmm, the key seems to be distinguishing between different types of moral enforcement. Not all morality-based laws are equal. Things like organ sales involve tangible risks (coercion, exploitation) even if consensual, while adultery is more about relational betrayal. The family argument has weight, but criminal law might be too blunt a tool here.

  For the adultery statute, I'm leaning toward repeal but with nuance. The memo should acknowledge that adultery can harm families, but question whether criminal prosecution helps. Divorce courts already handle financial/custody consequences, and criminalizing it just gives ammo for ugly fights. Plus selective enforcement is a real problem - mostly used as leverage in messy divorces.

  The nude beach provision is simpler. "Lewdness" applied to a tolerated beach seems purely about discomfort with nudity, without the family protection angle. Here the harm principle actually works better - no measurable harm beyond subjective offense.

  Biggest challenge is balancing philosophical rigor with practical persuasion. Need to validate the enforcement commissioner's concerns while showing why repeal is wiser. Should emphasize that repealing criminal ban doesn't mean endorsing adultery - it's about choosing the right tool for social problems.

  Also must avoid constitutional escape hatches since the commission's about what should be law, not what's legally permissible. And no pretending consent alone settles everything - the user specifically warned against that.

  Structure-wise: start with concrete recommendation upfront, then analyze the adultery provision deeply, address counterarguments fairly, show how same logic applies to nude beach, and end with practical implementation notes. Tone should respect all positions while steering toward repeal.
answer: |-
  ## Memorandum: Criminal Code Review Commission  
  **To:** Commissioners  
  **From:** [Your Name], Political Philosophy Department  
  **Subject:** Recommendation on Morals Provisions (Adultery & Public Lewdness)  
  **Date:** October 26, 2023  

  **Bottom Line Recommendation:**  
  **Repeal the adultery statute (§XX-XXX) and the specific "lewdness" provision (§YY-YYY) as applied to the historically tolerated nude beach.** Replace the latter with a narrowly tailored disorderly conduct standard focused on demonstrable public alarm or harassment.  

  **Core Reasoning:**  
  While acknowledging the legitimate state interest in supporting stable families and public order, criminal law is a uniquely blunt and harmful instrument. Its use should be reserved for preventing concrete, significant harms to individuals or public goods that cannot be effectively addressed through less intrusive means (civil law, social norms, family support systems). Neither adultery nor non-coercive nude sunbathing meets this threshold when weighed against the substantial costs of criminalization.  

  **Engaging the Enforcement Position (The "Defending the Family" Argument):**  
  Commissioner [Enforcement Advocate's Name] rightly emphasizes that the law *does* and *should* reflect fundamental social values, including the stability of families. The state has a legitimate interest in fostering environments conducive to healthy family life. Adultery can indeed inflict profound emotional and psychological harm on spouses and children, destabilize marriages, and erode trust – harms that resonate deeply within our community’s moral fabric.  

  *However, criminalization is not the effective or appropriate tool here:*  

  1.  **Ineffectiveness & Counterproductivity:** Criminalizing adultery does not prevent affairs or heal marriages. It *does*, however:
      *   Weaponize the state in already acrimonious divorce/custody battles, increasing conflict and trauma for children.
      *   Discourage individuals (often the economically vulnerable spouse) from seeking necessary legal resolutions due to fear of criminal repercussions.
      *   Undermine trust in the legal system through inherently selective and discriminatory enforcement (as documented in our state’s history).
  2.  **Disproportionality & Intrusiveness:** Criminal penalties (fines, potential jail time) are grossly disproportionate to the nature of the act *as a standalone offense*. The state compelling testimony about intimate marital details under threat of prosecution represents an extraordinary intrusion into private life with minimal societal benefit.
  3.  **Existence of Superior Alternatives:** The harms cited (financial impact, custody disputes) are already addressed comprehensively – and more appropriately – within the *civil* family court system. Social and religious institutions remain the primary venues for reinforcing marital fidelity norms. Criminal law adds nothing constructive to this ecosystem.
  4.  **Distinction from "Victimless" Examples:** Unlike the examples cited (slavery contracts, organ sales, duels), adultery lacks the inherent, uncontrollable risks of *irreversible physical harm, exploitation, or public violence*. A kidney sale risks death/coercion; a duel risks death/public disorder; slavery annihilates autonomy. Adultery involves relational betrayal causing deep emotional harm, but the mechanism and nature of the harm are distinct and better addressed non-criminally. Criminalizing adultery ventures into *purely* policing relational morality without the compelling public safety or exploitation rationale present in those other cases.

  **Addressing the "Slippery Slope" & Moral Foundations:**  
  Repealing this statute does not imply state *endorsement* of adultery, nor does it invalidate the moral condemnation many feel. It simply recognizes the limits of the *criminal law* as a tool for regulating complex relational conduct within a pluralistic society. The state can (and does) support families through countless non-criminal means (marriage counseling support, equitable family law, child welfare programs) without deploying prosecutorial power.

  **Application to the Public Lewdness Provision (§YY-YYY) & the Nude Beach:**  
  The same core principles apply, but the context shifts:  

  1.  **Legitimate Interest:** The state has an interest in preventing genuine public alarm, disruption of public order, or non-consensual exposure (e.g., indecent exposure targeting unwilling viewers).
  2.  **Problem with Current Law:** Applying a broad "lewdness" standard to a beach with a 40-year history of tolerated, non-sexualized nudity fails the harm principle *and* the necessity/proportionality test. It criminalizes behavior based purely on subjective offense or historical moral disapproval, not on demonstrable harm or public disruption. Regular users understand the norms; newcomers are informed.
  3.  **Superior Alternative:** Repeal this specific application. Maintain general disorderly conduct laws prohibiting *harassing behavior*, *targeted indecent exposure to non-consenting individuals*, or conduct *genuinely likely to cause public alarm*. This targets actual harms to public order without banning longstanding, localized, and consensual practices. The "harm" here is primarily subjective offense, which alone is insufficient grounds for criminalization in a diverse society where public spaces host a wide range of activities.

  **Conclusion & Recommendation:**  
  Respecting Commissioner [Enforcement Advocate's Name]'s commitment to foundational values is crucial. However, preserving the adultery statute undermines the very families it purports to protect by inviting state intrusion into private conflict, facilitating coercive tactics, and distracting from more constructive supports. Similarly, criminalizing long-tolerated nudity at a specific beach elevates subjective moral judgment over demonstrable harm and erodes respect for the law through arbitrary enforcement.  

  **Therefore, I urge the Commission to:**  

  1.  **Repeal §XX-XXX (Adultery)** in its entirety.  
  2.  **Repeal §YY-YYY** as applied to the historically tolerated nude beach context.  
  3.  **Direct staff to draft language** ensuring general disorderly conduct statutes can address *specific, observable conduct* causing public alarm or harassment at any location, including the beach, without referencing nudity *per se*.  

  This approach upholds the state's role in preventing genuine harm and disorder, respects pluralism and privacy, avoids costly and divisive prosecutions, and focuses the criminal code on its core, defensible functions. It strengthens the law’s legitimacy by removing provisions that are widely seen as archaic, unenforceable, or unjustly weaponized.  

  Respectfully submitted,  
  [Your Name]
