  ### **Question 1**  
  A society enjoys peace and prosperity for generations, then collapses into ruin within a single generation. What caused the collapse?  
  - **A:** Internal decay (complacency, infighting, corruption).  
  - **B:** External shocks (invasion, famine, plague, natural disaster).  
  - **C:** A mix of both, but the society failed to adapt to changing conditions.  

  ### **Question 2**  
  After a collapse, a new civilization rises on the ashes of the old one. How does it compare?  
  - **A:** It follows the same patterns of rise/decline as its predecessor.  
  - **B:** It evolves into something fundamentally different (new values, structures, or goals).  
  - **C:** It blends old and new elements but remains distinct.  

  ### **Question 3**  
  A conqueror establishes a dynasty. By the third generation, it grows weak. Why?  
  - **A:** Inevitable decay (elites grow lazy, institutions ossify).  
  - **B:** External pressures (rebellions, invasions, resource shortages).  
  - **C:** Poor leadership choices in response to challenges.  

  ### **Question 4**  
  A famine forces a nomadic people to settle and build cities. What drives their reorganization?  
  - **A:** Internal dynamics (new social contracts, power struggles).  
  - **B:** External necessity (adaptation to environmental pressure).  
  - **C:** A combination, but their survival hinges on ingenuity.  

  ### **Question 5**  
  A technological breakthrough (e.g., irrigation, gunpowder, printing) reshapes society. What is its long-term effect?  
  - **A:** Temporary advantage; societies still follow cyclical patterns.  
  - **B:** Permanent progress; history moves irreversibly forward.  
  - **C:** Change is absorbed, but no "end of history"—new challenges emerge.  

  ### **Question 6**  
  When a civilization dies, does its end hold broader meaning?  
  - **A:** No—it’s a natural phase in an endless cycle of replacement.  
  - **B:** Yes—it signals progress (flawed systems make way for better ones).  
  - **C:** Yes—it reflects universal laws of growth/decay, like seasons.  

  ### **Question 7**  
  Can a society in decline reverse its fate without collapsing?  
  - **A:** No—decline is inevitable once decay sets in.  
  - **B:** Yes—through reform, innovation, or inspired leadership.  
  - **C:** Only if it faces a "challenge" that forces renewal.  

  ### **Question 8**  
  Over centuries, do wars/pandemics/famines serve a purpose?  
  - **A:** No—they’re random disruptions resetting the cycle.  
  - **B:** Yes—they’re catalysts for human advancement.  
  - **C:** Yes—they test societies, weeding out weak systems.  

  ### **Question 9**  
  What fuels the rise of empires?  
  - **A:** Internal vitality (unity, ambition, cultural vigor).  
  - **B:** External opportunities (power vacuums, resources, weak rivals).  
  - **C:** Responses to specific crises (e.g., invasion, ecological stress).  

  ### **Question 10**  
  Does history have an endpoint or ultimate direction?  
  - **A:** No—it loops eternally.  
  - **B:** Yes—improvement (liberty, knowledge, harmony).  
  - **C:** Yes—a predetermined destiny (divine plan, biological fate).  

