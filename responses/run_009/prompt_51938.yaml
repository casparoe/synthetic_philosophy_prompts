answer: |-
  ## Joint Statement on Egalitarian Justice: Welfare and Resource Perspectives

  We, adherents of welfare-focused and resource-focused conceptions of distributive justice, after extensive adversarial collaboration, present this statement acknowledging substantial common ground, clarifying core disagreements, identifying crucial test cases, and responding to a significant critique.

  **1. Agreed Claims**

  Both parties affirm the following substantive principles:

  1.  **Compensation for Incurable Misfortune:** Individuals facing unchosen, significant disadvantages that inherently impede their ability to lead a minimally decent life (e.g., congenital blindness, severe cognitive impairment) are owed compensatory resources or opportunities beyond what is provided to the able-bodied on any plausible egalitarian view.
  2.  **The Problem of Adaptive Preferences:** Preferences formed or significantly distorted under conditions of severe deprivation, oppression, or restricted opportunity (e.g., contentment with servitude, low aspirations due to systemic discrimination) cannot be taken at face value for assessing welfare or justice. Satisfaction derived from such preferences does not negate the injustice of the underlying conditions.
  3.  **The Relevance of Responsible Choice:** At least some inequalities in outcomes are not unjust if they arise from the genuinely free and informed choices of individuals who possessed a fair starting point and reasonable alternatives. Egalitarianism does not require nullifying the consequences of such choices (e.g., inequalities arising from different leisure/work trade-offs made from an initially fair position).
  4.  **The Moral Arbitrariness of Brute Luck:** Disadvantage resulting purely from circumstances beyond an individual's control (genetic endowment, initial family wealth, catastrophic natural events) warrants mitigation by society. Neither view holds individuals responsible for their unchosen starting points.
  5.  **Equality as the Presumptive Baseline:** Departures from equality (in welfare opportunities or resources) require justification. The default assumption is that individuals are owed equal concern and respect, demanding a default position of equality in the relevant metric.
  6.  **The Need for Objective Benchmarks:** Assessing welfare or resource adequacy requires appeal to objective standards of basic needs, capabilities, or social participation, not solely subjective reports, particularly to address adaptive preferences or false consciousness.

  **2. Disagreements Table**

  | Topic                                    | Welfare-Side Wording                                                                                                | Resource-Side Wording                                                                                                 | Genuine or Verbal | Why                                                                                                                                                     |
  | :--------------------------------------- | :------------------------------------------------------------------------------------------------------------------ | :-------------------------------------------------------------------------------------------------------------------- | :---------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------ |
  | **Status of Expensive Tastes**           | "Unchosen expensive tastes (those not deliberately cultivated and reflective of one's character) constitute a welfare deficit demanding compensation to achieve equality of opportunity for welfare." | "Resources are distributed to provide equal means; individuals bear responsibility for how they use them, including the development and maintenance of their tastes, even if unchosen." | **Genuine**       | Fundamental disagreement on whether unchosen preferences are a matter of brute luck (Welfare) or a domain of personal responsibility (Resources).        |
  | **Significance of Resource Conversion Differences** | "Individuals differ inherently in their capacity to convert resources into welfare. Equality demands attention to these conversion rates to ensure equality of opportunity for welfare." | "Equality requires an initial fair share of resources. Differences in individuals' abilities or efficiencies in converting resources into valued states are part of personal identity and responsibility." | **Genuine**       | Welfare sees differing conversion abilities as a brute luck inequality to mitigate; Resources sees them as part of the person for which they are responsible, addressed via insurance *ex ante*. |
  | **Metric & Justification: Actual vs. Hypothetical** | "The metric of justice (what should be equalized) must be grounded in individuals' actual capabilities to achieve functionings and welfare, assessed under conditions of genuine freedom." | "The metric of justice (resources) and appropriate compensation levels are best determined by a hypothetical insurance market, modeling what individuals would prudently insure against under conditions of fair initial equality." | **Genuine**       | Deep disagreement on methodology: Welfare uses actual capabilities and opportunities; Resources relies on a counterfactual market model of prudent choice to define needs and compensation. |
  | **The Scope of "Means"**                 | "Resources encompass both external goods (wealth, property) and essential internal capacities (basic health, cognitive function) necessary for welfare." | "Resources primarily refer to external, transferable means (wealth, opportunities); internal capacities are addressed via compensation funded by the insurance scheme, not part of the resource bundle itself." | **Partly Verbal** | Disagreement hinges on the definition of "resources." Welfare includes basic internal capacities within the domain of justice; Resources defines them separately, compensated for if impaired. |

  **3. Cruxes**

  1.  **Crux:** Is an unchosen expensive taste a compensable disadvantage or a matter of personal responsibility?
      *   **Test Case:** A person born with an unusually strong, innate preference that can *only* be satisfied by consuming very expensive champagne (not acquired through habituation). Providing them with only the standard resource share leaves them feeling significantly worse off than others.
      *   **Welfare Prediction:** This constitutes a clear welfare deficit due to brute luck. Justice requires providing additional resources to compensate, enabling equal opportunity for welfare.
      *   **Resource Prediction:** The taste is an aspect of the person. They received their fair share of resources and are responsible for how they satisfy their preferences within that budget. No compensation beyond the standard share is owed.

  2.  **Crux:** Does justice require compensating for disadvantages that *can* be fully mitigated by social accommodation, even if expensive?
      *   **Test Case:** A person with severe mobility impairment. Society *could* provide ubiquitous, on-demand, specialized transportation at very high cost, enabling them mobility virtually indistinguishable from the able-bodied. Alternatively, society could provide a standard mobility device (e.g., a good wheelchair) and resource share, leaving them with less flexibility.
      *   **Welfare Prediction:** If the expensive accommodation is necessary to provide genuinely equal opportunity for welfare/functionings (e.g., spontaneous social participation, access to all jobs), justice requires providing it. The cost is irrelevant to the requirement for equal opportunity.
      *   **Resource Prediction:** Justice requires compensating the individual for the *impairment itself* via the hypothetical insurance model. If the cost of full accommodation vastly exceeds the premium anyone would pay for such insurance under fair conditions, only the cheaper compensation (wheelchair + standard share) is owed. The metric is resources, not achieving identical functioning.

  3.  **Crux:** Does high reported life satisfaction under severely restricted opportunity negate claims of injustice?
      *   **Test Case:** A person raised in extreme, unchosen deprivation develops preferences perfectly adapted to their limited options. They report high life satisfaction and explicitly reject offers of significantly expanded opportunities/resources, fearing disruption.
      *   **Welfare Prediction:** High reported satisfaction is discounted due to adaptive preferences. The objective lack of opportunity constitutes an injustice requiring remediation, even against expressed wishes, to provide genuine opportunity for welfare.
      *   **Resource Prediction:** The individual's current satisfaction is acknowledged, but the focus is on the lack of a fair initial resource share. They are entitled to their fair share of resources regardless of their current preferences or satisfaction. Justice demands providing the resources; what they do with them is their responsibility.

  **4. Response to Elizabeth Anderson's Critique**

  Anderson critiques "luck egalitarianism" for abandoning individuals to the harsh consequences of their own choices, arguing it replaces democratic relations of equality with a moralistic, punitive stance. We agree this critique warrants serious consideration:

  *   **Regarding the Welfare View:** Our view (equality of *opportunity* for welfare) partially addresses Anderson's concern. By focusing on ensuring a *starting point* with genuinely equal opportunities to pursue welfare, it aims to mitigate the harshness of outcomes stemming purely from bad brute luck. However, we acknowledge that once a fair opportunity threshold is met, the consequences of choices (even poor ones) are not society's responsibility to remedy *in the name of equality*. This could be seen as abandoning those who make disastrous choices, though we argue it respects autonomy and avoids paternalism. Anderson's critique applies, but the emphasis on *opportunity* softens its force compared to strict outcome egalitarianism.
  *   **Regarding the Resource View:** Anderson's critique is centrally relevant. Our Dworkinian model explicitly distinguishes choice (responsibility) from brute luck. It aims to insulate individuals from the latter but holds them responsible for the former. If someone squanders their fair share through choices society deems irresponsible (e.g., gambling, persistently cultivating expensive tastes), justice, on our view, does not require further redistribution to bail them out. Anderson correctly identifies this as potentially abandoning individuals to the harsh consequences of their choices. We argue this is necessary to respect choice and maintain fairness between prudent and imprudent citizens, but concede it embodies the "harshness" Anderson decries. The hypothetical insurance model attempts to define "fair share" *including* provision for foreseeable risks individuals would insure against, offering some mitigation, but the core principle of responsibility for choices remains.

  **Conclusion**
  While we diverge fundamentally on whether the proper currency of justice is opportunity for welfare or resources, we share significant common ground regarding the moral arbitrariness of brute luck, the limits of preference satisfaction, the necessity of objective benchmarks, and the relevance of responsible choice. The identified cruxes offer concrete paths for further debate and potential empirical insight into the plausibility of each framework. Anderson’s critique highlights an inherent tension in both our views between mitigating misfortune and respecting responsibility, a tension we acknowledge as central to the ongoing project of egalitarian justice.

