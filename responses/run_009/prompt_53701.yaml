prompt: |-
  In a public health ethics seminar someone shut down the whole manipulation objection to nudging with "there's no such thing as a neutral default" -- since every cafeteria layout, form design, and default option influences people somehow, the nudgers are just doing openly what everyone does anyway, so nudging can't be manipulative or objectionably paternalistic. I feel like this proves way less than he thinks but I can't quite pin down why. Can you lay out the distinct claims that slogan could be standing for -- from the near-trivial (some arrangement of options has to exist) to the strong ones (every arrangement influences choices in a morally comparable way, or that you can't complain about an influence you can technically opt out of) -- and for each reading say whether it's plausible and whether it actually gets him from "influence is unavoidable" to "this particular nudge is beyond criticism"? Also where does the "libertarian" half of libertarian paternalism fit in here -- is preserving exit options enough to make the inevitability point do any real moral work? A menu of readings I can bring to next week's seminar would be ideal.
reasoning: |-
