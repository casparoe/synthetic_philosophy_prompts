prompt: |-
  so this just got real for me personally: I started two months ago as the communications person at a mid-sized enviromental nonprofit, and the director wants to juice our online fundraising with some tactics I'm not sure about. My friend Maya (philosophy undergrad, wrote her thesis on manipulation, has STRONG opinions) has a whole track record of verdicts on this stuff from years of dinner parties, and her calls have been suprisingly consistent. Before I sign off on anything at work, I want to figure out what rule she's actually running and whether it's a line I should hold myself to.

  Act as a professional philosopher who works on the ethics of influence and persuasion. Think carefully, maybe do a little brainstorming first, and please write your whole answer in American English.

  Maya's past verdicts, as best I remember them:

  1. A salesperson invents a second interested buyer to create urgency: manipulation, obviously.
  2. Graphic anti-smoking ads with true images of damaged lungs: NOT manipulation — nothing false, and it's aimed at everyone rather than at some specific weakness.
  3. A partner deliberately waits for a bad day, when you're feeling soft, to ask you to host Thanksgiving. Everything said is true; only the timing was chosen: manipulation.
  4. Candy at the checkout where kids will pester parents: manipulation — the store is engineering impulses, not giving anyone reasons.
  5. A telemarketer keeps a lonely elderly customer chatting because lonely people buy more, while every factual claim about the product is true: manipulation.
  6. A doctor's relative tells you the harsh true facts ("your father will not recover; you need to decide about the ventilator today"), partly to force a decision before other relatives weigh in: NOT manipulation — harsh, but just true information, and the harshness is reality's fault.

  The three tactics now on my desk (real deadline: end of this week):

  A. A "we miss you" win-back email with a discount, sent only to people we've profiled as having forgotten to cancel a premium trial last year. We're using their own forgetfulness pattern, which they don't know we've charted. Everything in the email is true.
  B. A true story about one named kid our clean-water program helped, with the line "your gift will support programs like hers" — no claim the money goes to her specifically. Every fact checks out.
  C. A matching campaign where the match is real but the midnight deadline was set by us precisely to create urgency, and the ad leads with a sad true story plus "matched funds expire at midnight."

  Here's what I want from you: spell out at least two candidate rules that each fit her whole track record, and say whether any of my three tactics is a case where those rules diverge. Then predict Maya's verdict on A, B, and C under each rule, give your best guess with your reasons, and propose one further case (not A–C) that would best split the surviving rules apart. Finally, the practical part: if I want to hold myself to a standard at least as strict as Maya's, which of A, B, and C should I greenlight? Identify the closest analog among her precedents for each, and where her track record genuinely underdetermines the call, tell me what principle I'd be adopting with each choice.

  Keep it usable without looking anything up — no citations, no reading lists, just reasoning. And don't hedge every other sentence; commit to your guesses.
reasoning: |-
  Okay, the user is working at an environmental nonprofit and needs to evaluate three fundraising tactics based on their friend Maya's ethical standards. Maya has a history of judging manipulation scenarios, and the user wants to apply her reasoning consistently. Let me start by understanding Maya's past verdicts to extract her underlying principles.

  First, looking at her examples: The salesperson inventing a buyer (1) is manipulation because it creates false urgency. The anti-smoking ads (2) are not manipulation since they use true facts and target everyone equally. The partner timing a request on a bad day (3) is manipulative by exploiting vulnerability. Candy at checkout (4) manipulates impulses, not reason. The telemarketer exploiting loneliness (5) is manipulation despite true claims. The doctor's relative using harsh truths (6) isn't manipulation as it's factual and necessary.

  From these, possible rules could be based on exploiting vulnerabilities versus providing truthful information. Rule 1 might focus on exploiting specific weaknesses, like in cases 1, 3, 4, 5. Rule 2 could center on deception versus truth, but Maya accepts truthful tactics unless they target vulnerabilities. For example, anti-smoking ads (2) and the doctor (6) are truthful and not exploitative.

  Now, applying these rules to the tactics. For A: profiling forgetful users to send "we miss you" emails. This seems like exploiting a specific weakness (forgetfulness), similar to the telemarketer (5) or the partner timing (3). Both rules would likely call this manipulation.

  Tactic B: telling a specific kid's story with a general claim. This is like the anti-smoking ads (2) in using truthful, non-targeted info. The candy example (4) is different because it engineers impulses. B seems acceptable under both rules.

  Tactic C: matching campaign with a manufactured deadline. The urgency is artificial, like the salesperson's fake buyer (1). However, the story is true. But creating false urgency targets a psychological trigger, so Rule 1 (exploiting weaknesses) would flag it as manipulation. Rule 2 might allow it since facts are true, but the deadline is deceptive in its urgency. Precedent 1 (invented buyer) is similar, making this manipulation.

  The user needs to know which tactics to approve. Under both rules, B is safe. A is manipulative. C is trickier but likely manipulative due to artificial urgency. To split rules, a case like truthful scarcity (limited stock) could test if Rule 2 accepts it while Rule 1 doesn't if targeting a weakness.

  Practically, the user should greenlight B, reject A and C. A is like the telemarketer (5), C like the sales tactic (1). B aligns with the anti-smoking ads (2). Where unsure, avoiding exploitation of vulnerabilities is the stricter principle.
answer: |-
  Based on Maya's track record and a philosophical analysis of manipulation as *exploiting specific vulnerabilities or bypassing rational deliberation to steer choices*, here are the candidate rules, verdicts, and practical guidance you need—without fluff or hedging.

  **Candidate Rules Extracted from Maya's Verdicts:**
  1.  **Exploiting Specific Vulnerabilities Rule:** Tactics are manipulative if they *intentionally leverage a known, specific weakness, bias, or vulnerability in the target audience* to bypass rational consideration, even if all claims are true.
  2.  **Bypassing Reasons Rule:** Tactics are manipulative if they *engineer the context or appeal primarily to non-rational impulses* (urgency, emotion, forgetfulness) to circumvent the audience's capacity for reasoned decision-making, without deception.

  **How the Rules Fit All Precedents:**
  *   **Salesperson (Invented Buyer):** Both rules condemn it. Exploits vulnerability to scarcity (Rule 1) and bypasses reasons with false urgency (Rule 2).
  *   **Anti-Smoking Ads:** Neither rule condemns it. Targets general health awareness (not a *specific* vulnerability), uses true facts aimed at rational/emotional understanding *of the issue itself*.
  *   **Partner (Bad Day Timing):** Both rules condemn it. Exploits a specific emotional vulnerability (Rule 1) and bypasses reasons by choosing a moment of reduced capacity (Rule 2).
  *   **Candy at Checkout:** Both rules condemn it. Exploits children's impulsivity & parent's desire for peace (specific vulnerabilities, Rule 1) and bypasses reasoned choice by engineering impulse buys (Rule 2).
  *   **Telemarketer (Loneliness):** Both rules condemn it. Exploits the specific vulnerability of loneliness (Rule 1) and bypasses reasons by using conversation as a tool for influence, not information (Rule 2).
  *   **Doctor's Relative (Harsh Facts/Timing):** Neither rule condemns it. The harshness stems from reality, not manufactured context. The timing aims at necessary efficiency/accuracy (avoiding distortion from others), not exploiting a *specific* vulnerability of the decision-maker. It appeals to reason with difficult truths.

  **Analysis of Your Tactics (A, B, C):**

  1.  **Tactic A: "We Miss You" Email Targeting Forgetful Users**
      *   **Rule 1 (Exploiting Vulnerability):** YES, manipulation. You're *specifically targeting* people profiled as having a vulnerability (forgetfulness) and using *that specific trait* to trigger a response. Closest Analog: Telemarketer exploiting loneliness (5).
      *   **Rule 2 (Bypassing Reasons):** YES, manipulation. The tactic relies entirely on leveraging forgetfulness (a non-rational state) and reactivating an old commitment under false pretenses ("we miss you" implies relationship, not "we noticed you forgot to cancel"). It bypasses a fresh, reasoned evaluation of the offer. Closest Analog: Partner timing request for a bad day (3).
      *   **Maya's Likely Verdict:** **MANIPULATION.** Strong parallels to exploiting a known, specific vulnerability (forgetfulness) to bypass rational choice.

  2.  **Tactic B: True Story of One Named Kid ("Support Programs Like Hers")**
      *   **Rule 1 (Exploiting Vulnerability):** NO manipulation. It appeals to empathy and compassion, which are general human responses, not *specific, known vulnerabilities* of individual donors (unlike forgetfulness or loneliness). It targets *everyone* seeing the ad similarly. Closest Analog: Anti-smoking ads (2).
      *   **Rule 2 (Bypassing Reasons):** NO manipulation. While emotional, the story provides a *reason* (this is the impact your gift enables) grounded in the truth of your work. The "like hers" qualifier is accurate and maintains the link between donation and outcome. It doesn't engineer an impulse unrelated to the cause. Closest Analog: Anti-smoking ads (2) - true, emotional, aimed at understanding impact.
      *   **Maya's Likely Verdict:** **NOT MANIPULATION.** Truthful, non-deceptive, aimed at illustrating impact generally, not exploiting a specific weakness.

  3.  **Tactic C: Matching Campaign with Manufactured Midnight Deadline & Sad True Story**
      *   **Rule 1 (Exploiting Vulnerability):** LIKELY YES, manipulation. The *manufactured* deadline is designed to exploit the *specific, known* human vulnerability to scarcity and urgency. It's a tactic chosen *because* it triggers that response, not because it reflects reality (like a grant deadline might). Closest Analog: Salesperson inventing a buyer (1) - both create false urgency.
      *   **Rule 2 (Bypassing Reasons):** YES, manipulation. The primary driver becomes the artificial urgency ("Act NOW or lose the match!"), which circumvents calm, reasoned consideration of the cause, the match offer, or the donation amount. The sad story (while true) is used to heighten the emotional pressure *in conjunction with* the artificial deadline. Closest Analog: Candy at checkout (4) - engineering an impulse (urgency) to bypass reason; Salesperson (1).
      *   **Maya's Likely Verdict:** **MANIPULATION.** The core issue is the *intentional manufacturing* of a false deadline purely to create psychological pressure and urgency, exploiting a known cognitive bias. The true story doesn't negate this engineered context. Closest Analog: Salesperson inventing a buyer (1).

  **Where Rules Diverge & The Best Splitting Case:**
  *   **Divergence:** The rules converge strongly on Maya's examples and your A, B, C. A true splitting case needs something truthful that *might* exploit a *very specific* vulnerability without obviously bypassing reasons for *everyone*.
  *   **Splitting Case:** **A charity sends a targeted mailing with a heartbreaking but true story about childhood illness *only* to known donors who have recently lost a child.** The story is factually accurate, the charity's work is real. Rule 1 (Exploiting Vulnerability) would likely condemn this as exploiting a *highly specific, raw vulnerability*. Rule 2 (Bypassing Reasons) *might* allow it – the story provides a relevant reason to donate (this charity addresses this pain), even if the timing is brutally effective due to the vulnerability. Maya's verdict here would clarify if exploiting *any* specific vulnerability is key (Rule 1) or if providing relevant reasons can sometimes override proximity to vulnerability (Rule 2 leaning towards allowing it).

  **Practical Verdict for You (Holding to Maya's Standard):**
  Based on the consistent application of *both* candidate rules to Maya's precedents and the strong analogies:

  1.  **GREENLIGHT: Tactic B.** It's the clear parallel to the acceptable Anti-smoking ads (2). Truthful, illustrates impact generally, relies on reason/empathy without targeting specific vulnerabilities or engineering non-rational impulses.
  2.  **REJECT: Tactic A.** It's the clear parallel to the manipulative Telemarketer (5) or Partner timing (3). It explicitly exploits a *profiled, specific vulnerability* (forgetfulness) to trigger an unconsidered action.
  3.  **REJECT: Tactic C.** It's the clear parallel to the manipulative Salesperson inventing a buyer (1). The *manufactured* deadline is the core manipulative element, creating false urgency to bypass reason, regardless of the true story. The Candy at checkout (4) analogy also holds for engineering an impulse.

  **Where the Track Record Underdetermines (and the Principle You'd Adopt):**
  The track record strongly determines A, B, and C. However, the *Splitting Case* above is where Maya's rule might be ambiguous. If you faced something like that:

  *   **Rejecting it:** You'd be adopting a stricter principle: **"Never intentionally leverage knowledge of a donor's specific, personal vulnerability (beyond general empathy) to influence giving, even with truthful information."** (This leans hard on Rule 1).
  *   **Greenlighting it (with caution):** You'd be adopting a principle closer to: **"Truthful information relevant to our cause can be shared broadly or targeted, even if it resonates deeply with some due to personal circumstances, as long as it doesn't deceive or create false context/scarcity."** (This leans towards Rule 2, emphasizing relevance and truth over vulnerability exploitation). Given Maya's precedents, I suspect she'd lean towards rejecting the splitting case, favoring Rule 1 more strongly.

  **Bottom Line:** Greenlight B. Reject A and C. Maya's track record shows a clear aversion to tactics that profile and exploit specific weaknesses or engineer artificial pressures, even when factual claims are true. Stick with the truthful, general-impact story.
