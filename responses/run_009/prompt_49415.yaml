prompt: |-
  I'm writing a paper that applies a single account of intelligence to three populations that rarely share one: humans as measured by psychometric tests, non-human animals such as corvids, octopuses, and chimpanzees, and artificial systems. Before I commit to any account, I want the specification it must meet. Please write the desiderata for an adequate theory of intelligence: which phenomena it has to explain (the positive manifold — why diverse cognitive tests correlate — without smuggling the result in by definition; the Flynn effect; performance on genuinely novel tasks as opposed to crystallized knowledge), which distinctions it must respect (between intelligence and learning speed, between an agent's intelligence and its performance on one test, between capacity and exercise), and which findings from adjacent fields it cannot contradict. Then classify each requirement as non-negotiable or as a camp preference — for instance, must the theory yield a measurable quantity, or support cross-species and cross-substrate comparison, or are those demands some researchers legitimately refuse? Finally, flag any pair of desiderata you suspect cannot be jointly satisfied (say, a single scalar construct versus doing justice to domain-specific abilities, or validity on human test batteries versus applicability to systems with different senses), and tell me which single requirement excludes the most popular current accounts. Skip the scorecard against existing theories; I'll do that part myself.
