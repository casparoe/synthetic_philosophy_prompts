answer: |-
  Here are the desiderata for an adequate theory of intelligence for your cross-population paper, categorized and assessed for necessity:

  ### I. Core Phenomena to Explain (Non-Negotiable)
  1.  **The Positive Manifold:** Must explain why diverse cognitive tasks (reasoning, memory, perception) positively correlate across individuals/populations *without* defining intelligence tautologically as "that which causes test correlations." The explanation must be mechanistic.
  2.  **Performance on Novel Tasks:** Must account for an agent's ability to solve *truly novel* problems not solvable by simple recall or pre-learned routines (fluid intelligence, cognitive flexibility). This distinguishes intelligence from crystallized knowledge.
  3.  **Capacity vs. Exercise Distinction:** Must conceptually differentiate between an agent's *potential* cognitive capacity (intelligence) and the *actualization* of that capacity in specific performances (which can be impacted by motivation, fatigue, knowledge, environment).

  ### II. Essential Distinctions to Respect (Non-Negotiable)
  4.  **Intelligence vs. Learning Speed:** Must provide clear criteria distinguishing the *ability to acquire new skills/knowledge effectively* (learning) from the *ability to reason, solve novel problems, and adapt* using existing knowledge and skills (intelligence). They are related but distinct constructs.
  5.  **Intelligence vs. Single Test Performance:** Must conceptualize intelligence as a latent property of the agent *underlying* performance, not defined *by* performance on any single specific test or task. Performance is an indicator, not the definition.
  6.  **Domain-Generality vs. Domain-Specificity:** Must explicitly address the interplay (and potential tension) between domain-general cognitive abilities and domain-specific skills/knowledge. It cannot *assume* pure generality or pure specificity.

  ### III. Phenomena to Accommodate or Explain (Non-Negotiable for Plausibility)
  7.  **The Flynn Effect:** Must be compatible with (though not necessarily fully explain) rising population-level scores on cognitive tests over generations, without contradicting the theory's core mechanisms.
  8.  **Neurobiological Plausibility:** Must not contradict well-established findings from neuroscience regarding brain plasticity, the role of specific neural structures (e.g., PFC), and the neural basis of learning, memory, and executive function.
  9.  **Evolutionary Plausibility:** Must be compatible with principles of evolution by natural selection, including potential trade-offs, ecological specialization, and the emergence of intelligence in diverse lineages facing different adaptive pressures.
  10. **Developmental Trajectory:** Must be compatible with observed developmental patterns of cognitive abilities (e.g., increasing fluid intelligence in childhood/early adulthood, potential decline in later life, crystallization of knowledge).

  ### IV. Constraints from Adjacent Fields (Non-Negotiable for Consistency)
  11. **AI/ML Compatibility:** Must not contradict fundamental computational principles or established capabilities/limitations of current artificial systems (e.g., the role of architecture, data, training algorithms, the difference between optimization and generalization).
  12. **Comparative Ethology Compatibility:** Must be consistent with observed cognitive abilities and limitations across diverse non-human animals (e.g., tool use in corvids, problem-solving in octopuses, social cognition in chimps) without requiring anthropocentric assumptions.

  ### V. Camp Preferences / Theoretical Stances (Negotiable)
  13. **Measurability:** *Preference.* Must the theory inherently yield a *single measurable quantity* (like `g` or IQ)? (Many connectionist/embodied theories reject this).
  14. **Single Scalar Construct vs. Multi-Dimensional:** *Preference.* Must intelligence be conceptualized as a single dominant factor (`g`), a small set of broad abilities, or a highly multi-dimensional profile? (This is a major axis of debate).
  15. **Strict Cross-Substrate Comparability:** *Preference.* Must the theory *require* a single metric allowing direct quantitative comparison of intelligence between humans, animals, and AI? (Some argue this is impossible or meaningless; others see it as a goal).
  16. **Emphasis on Process vs. Structure:** *Preference.* Should the theory prioritize the *computational processes* (e.g., algorithms, control mechanisms) or the *underlying structures* (e.g., neural architecture, network connectivity, knowledge base)?
  17. **Role of Embodiment & Environment:** *Preference.* To what extent must the theory inherently incorporate the agent's physical body, sensory modalities, and interaction with its environment as constitutive of intelligence? (Strong embodiment views vs. computationalist views).

  ### VI. Potential Conflicts Between Desiderata
  *   **#14 (Scalar `g`) vs. #6 (Domain-Specificity) & #12 (Cross-Species):** A strong unitary `g` struggles to explain domain-specific animal expertise or highly specialized AI systems. Insisting on strict scalar comparability (#15) exacerbates this.
  *   **#2 (Novelty) vs. #11 (AI Compatibility):** Defining "genuine novelty" for systems trained on vast datasets or operating with fundamentally different architectures (e.g., LLMs) is highly challenging. Human-like novelty detection may not map cleanly.
  *   **#1 (Positive Manifold Explanation) vs. #13 (Measurability) & #14 (Scalar):** Providing a non-tautological explanation for the manifold *without* simply defining it as `g` is difficult. Theories rejecting a strong `g` (#14) must still explain the correlations.
  *   **#3 (Capacity vs. Exercise) vs. #11 (AI Compatibility):** Distinguishing "capacity" from "performance" in deterministic AI systems (vs. biological systems with noise, motivation) is conceptually tricky.
  *   **Human-Centric Tests (#1, #7) vs. Cross-Substrate Applicability (#12, #15):** Theories optimized to explain human psychometrics may struggle with non-human cognition or AI architectures lacking human-like senses, bodies, or developmental trajectories.

  ### The Single Requirement Excluding Most Popular Accounts
  **#1: Explaining the Positive Manifold Non-Tautologically** is arguably the requirement that excludes the *largest number* of popular accounts, particularly:

  *   **Classic Psychometric `g`:** Often *defines* `g` as the factor causing the correlations, offering only descriptive statistics, not a mechanistic *explanation* for *why* diverse abilities correlate. This is definitional smuggling.
  *   **Simple Neural Resource Theories:** Accounts attributing the manifold solely to "neural efficiency" or "brain size" often fail to specify the *computational mechanism* that links this resource to diverse task performance, risking circularity.
  *   **Many AI-Centric Definitions:** Definitions based purely on task performance (e.g., "optimization power", skill acquisition speed) often fail to address the *covariance* of diverse abilities, as they don't model the latent structure underlying performance across tasks.

  **Why it's the key hurdle:** Any theory aiming for true universality across humans, animals, and AI must provide a fundamental computational or architectural principle that *necessarily* leads to the observed covariance of cognitive abilities (the manifold) across diverse tasks and agents. Most accounts either take the manifold as a given defining feature (psychometrics) or ignore it entirely (many narrow AI/animal cognition accounts). Providing a non-circular, mechanistic explanation is the core challenge for a unified theory. Without successfully addressing this, the theory risks being either domain-specific or circular.

  This framework provides a robust set of criteria against which you can rigorously evaluate potential accounts of intelligence for your ambitious paper. Good luck!
