  Classifying these as non-negotiable versus camp preferences: Core phenomena and distinctions are essential. Cross-species applicability is probably non-negotiable for this user's paper. But measurable quantity and scalar construct might be preferences. 

  Potential conflicts: A single scalar measure vs. domain-specific abilities. Also, human-centric tests vs. applicability to systems with different senses or architectures. The biggest challenge is explaining the positive manifold without circularity—this likely excludes many existing theories that implicitly rely on g-factor without explaining its origin. 

