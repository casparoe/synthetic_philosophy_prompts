prompt: |-
  I'm a second-year graduate student working through the betting-argument literature in a formal epistemology seminar, and I keep noticing something about the arguments for updating rules that I can't find a label for. A Dutch book against someone whose credences violate the probability axioms is, as it were, all on the table at once: the bookie writes down a finite set of bets, the agent accepts each at odds she herself endorses, and no matter how the world turns out, she pays out more than she takes in. But the arguments I've seen for conditionalization don't look like that. There the bookie has to offer one bet now, wait for the agent to learn something, and then offer a second bet whose terms depend on what was learned; the guaranteed profit exists only relative to the bookie's contingency plan, which branches on the evidence. At no single moment is the agent holding a guaranteed losing portfolio — it's the whole tree, including moves made after the agent updates, that constitutes the book. My question is whether this configuration has an established name of its own, something more specific than the blanket label I've seen attached to these arguments, and whether the difference from the static case is generally regarded as a real weakening of the argument rather than a cosmetic one.

  I half-remember that some authors take these tree-like cases to show at most that one should precommit in advance to updating by conditionalization, not that one is irrational at the later time if one happens to update some other way, and I would like to know how that objection is standardly formulated, what the main replies to it are, and where the dialectic currently stands. I'm also unsure where the edges of the phenomenon lie: does it cover cases in which the agent can see the bookie's strategy coming and simply refuse the second bet, and does it cover one-shot setups like the Sleeping Beauty problem, where the putative book is made of the same bet offered repeatedly across indistinguishable awakenings rather than of different bets offered at different times? If there is no settled term for exactly this branching, spread-over-time structure, then please coin one, define it precisely, and say what it excludes — I care about getting the carving right, not just a name. Please write your answer in American English.
reasoning: |-
  Okay, let me tackle this user's query. They're a graduate student in formal epistemology, focusing on Dutch book arguments for updating rules. They've noticed a key difference between static Dutch books for probability axioms and the dynamic ones for conditionalization. The main concern is whether the branching, sequential nature of dynamic Dutch books weakens the argument and if there's a specific term for this structure.

  First, I need to confirm the established terminology. The static case is straightforward: a set of bets offered simultaneously that guarantees a loss. The dynamic case involves sequential bets contingent on future events. The term "Dynamic Dutch Book" seems appropriate here. Authors like Lewis and Teller use this, so I should highlight that. But the user might be looking for more nuance.

  The user's deeper worry is whether this sequential setup is a weaker form of argument. They mention the precommitment objection: that dynamic books only show the need to precommit to conditionalization, not that updating differently later is irrational. I recall arguments from Skyrms and van Fraassen on this. The key point is that failing to update via conditionalization leads to exploitable dispositions, even if no actual loss occurs at a single time.

  They also ask about edges of the phenomenon: cases where the agent refuses later bets or setups like Sleeping Beauty. In Sleeping Beauty, bets across awakenings aren't sequential in the same way, so it might not fit the dynamic Dutch book structure. Refusing bets ties into the dispositional nature of credences—declining the second bet avoids loss but reveals inconsistent planning.

  I should structure the response around defining "Dynamic Dutch Book," addressing the precommitment objection, and clarifying edge cases. Emphasize that the dialectic involves whether rationality requires synchronic coherence over time or just at each moment. Replying to the objection involves showing that updating differently violates current conditional credences, making one dynamically incoherent.

  Also, the user wants precise carving. Contrast static vs. dynamic Dutch books, mention diachronic coherence, and explain why Sleeping Beauty is different due to centered worlds. Make sure to use American English and avoid markdown. Need to ensure clarity on why the dynamic case isn't just cosmetic but involves different coherence standards.
answer: |-
  Based on your description, you've identified a fundamental distinction in Dutch book argument structures. Here's a breakdown of the terminology, the core objection, the dialectic, and the edges of the phenomenon:

  1.  **The Established Term: Dynamic Dutch Book (or Diachronic Dutch Book)**
      *   **Definition:** A Dynamic Dutch Book is a betting strategy employed by a bookie against an agent who violates a *diachronic* rationality constraint (like conditionalization). It involves a sequence of bets offered *at different times*, contingent upon intervening events (like the acquisition of evidence). Crucially, the guaranteed loss for the agent is only realized *across the entire sequence* and *relative to the bookie's contingent plan*. There is no single time at which the agent holds a portfolio guaranteed to lose money *independently of future actions*; the loss depends on the execution of the bookie's pre-planned strategy.
      *   **Contrast with Static Dutch Book:** A Static Dutch Book demonstrates a violation of a *synchronic* rationality constraint (like the probability axioms). It involves a *finite set of bets offered simultaneously*. The agent accepts them all at once based on their current credences, and the combination is guaranteed to lose money *no matter what happens*, immediately constituting a losing portfolio.

  2.  **The Precommitment Objection (and its Status)**
      *   **Formulation:** The standard objection you half-remember is precisely this: Dynamic Dutch Books are often argued to show, at most, that an agent is irrational *at the initial time t0* if they do not *precommit* to updating via conditionalization upon receiving evidence. They do *not* necessarily show that the agent is irrational *at the later time t1* if, when they actually receive evidence E, they adopt some credence other than what their prior conditional credence C(* | E) dictated. The argument is that the guaranteed loss relies on the bookie's *future action* (offering the second bet) based on a plan made at t0. If the agent unexpectedly updates differently at t1, they might simply *refuse* the second bet offered according to the bookie's plan, avoiding the loss. The "irrationality" exposed is a failure of *diachronic planning consistency*, not necessarily a synchronic flaw at t1. (Prominent proponents or discussants of this view include Isaac Levi and Bas van Fraassen).
      *   **Standard Label:** This is frequently called the **Strategy-Objection** or the **You-Can't-Make-Me (Refuse the Later Bet) Objection**.

  3.  **Replies to the Precommitment Objection & The Dialectic**
      *   **The Dispositional Defense:** The core reply is that credences are not just momentary opinions but involve *dispositions to bet*. An agent who *sincerely* holds credence P(H) at a time is disposed to accept bets at odds corresponding to P(H). A violator of conditionalization has, *at t0*, a *conditional* disposition: a disposition to adopt credence P_new(H) ≠ C(H|E) *if E is learned*. The bookie exploits this *actual, current (t0) dispositional state* by offering a bet *now* that is only favorable if the agent later adopts C(H|E), knowing they are disposed not to. The guaranteed loss stems from the agent's *current (t0) set of betting dispositions*, which includes their planned future update rule. (Key proponents: David Lewis, Brian Skyrms).
      *   **Synchronic Reflection/Generalized Conditionalization:** Some argue (e.g., Haim Gaifman, via his "expert probability") that synchronic constraints like the Reflection Principle (roughly: your current credence in A should equal your current expectation of your future credence in A) can be violated by someone who plans to violate conditionalization. A synchronic Dutch book *at t0* can sometimes be constructed against a violator based on their current expectations about their future credences, bypassing the need for sequential bets, though this often relies on stronger assumptions. The dynamic book is seen as a concrete manifestation of this synchronic incoherence in their planning.
      *   **Current Status:** The dialectic is largely unresolved but leans towards the dispositional defense being accepted by many formal epistemologists as showing a genuine form of diachronic irrationality *at t0*. The objection highlights that the irrationality is *expressed* through potential diachronic exploitation of dispositions, rather than a synchronic loss. Most agree it's a *different kind* of argument than the synchronic one, but many still regard it as compelling evidence for conditionalization as a core requirement of dynamic rationality. The objection is taken seriously as clarifying the *nature* of the justification rather than completely undermining it.

  4.  **Edges of the Phenomenon: Refusal and Sleeping Beauty**
      *   **Refusing the Second Bet:** This cuts to the heart of the Strategy-Objection. If the agent, upon updating unexpectedly at t1, *recognizes the bookie's strategy* and simply refuses the second bet, they avoid the loss. Proponents of the DDB argument counter:
          *   The agent's *disposition at t0* was to accept such a bet *if* they updated as planned. The bookie exploited *that disposition*.
          *   Refusing the bet at t1 *reveals* the inconsistency in their overall doxastic state: their prior conditional credence C(H|E) committed them (in a betting disposition sense) to accepting certain bets upon learning E, but their actual update leaves them unwilling to accept those bets. This inconsistency *is* the irrationality exposed by the *threat* of the Dutch book, even if avoided by refusing the later bet. It shows their update rule was not aligned with their prior commitments.
      *   **Sleeping Beauty (SB) and Similar "One-Shot" Setups:** The Dutch Books often discussed in SB (e.g., Elga's, Lewis's) are **not** standard Dynamic Dutch Books in the sense you're focusing on.
          *   **Key Difference:** In SB, the "bets" offered across awakenings are fundamentally different. Beauty isn't *learning new evidence* in the standard sense between awakenings; she is regaining consciousness in an epistemically identical state (same centered evidence). The bookie is offering the *same type* of bet multiple times within the same global state of uncertainty, exploiting the fact that her credence differs from the objective chance or the rational credence derived from the prior.
          *   **Structure:** While bets are offered at different *times* (awakenings), there is no branching contingency plan based on *learning new, relevant evidence* that changes the state space. The bookie's plan is simple: offer bet X on every awakening. The guaranteed loss arises from the *repetition* of the bet at the "wrong" credence within the same epistemic moment (from Beauty's perspective, each awakening is epistemically equivalent to the first). It exploits synchronic credence assignments in a temporally extended scenario with memory loss/indistinguishability, not a diachronic update rule responding to new information.
          *   **Categorization:** SB Dutch books are better understood as exploiting violations of *synchronic* constraints applied to *self-locating* beliefs (credences over centered worlds) in a temporally extended context, rather than demonstrating the irrationality of a *diachronic updating rule* in response to new evidence. They don't rely on the branching contingency plan characteristic of arguments for conditionalization. They are a distinct phenomenon, often called "Dutch books for forgetting" or "Dutch books in contexts of imperfect recall," but not standard "Dynamic Dutch Books" as defined above.

  **Precise Carving: Defining "Dynamic Dutch Book"**

  *   **Term:** **Dynamic Dutch Book (DDB)** (or Diachronic Dutch Book).
  *   **Definition:** A Dynamic Dutch Book is a strategy employed by a bookie that demonstrates the diachronic incoherence of an agent's belief updating policy. It consists of:
      1.  A **finite sequence** of bets offered at distinct times (t0, t1, ..., tn).
      2.  **Intervening events** (specifically, the agent *learning new evidence* E_k at time t_k).
      3.  A **contingency plan** for the bookie: the specific bet offered at time t_k *depends on* the evidence learned by the agent *since the last bet was offered*.
      4.  **Agent Acceptance:** The agent, holding credences that violate the target diachronic norm (e.g., conditionalization), accepts each bet when offered, finding it fair according to their credences *at that time*.
      5.  **Guaranteed Loss:** The net result of the agent accepting the entire sequence of bets, as dictated by the bookie's contingency plan, is a guaranteed net loss for the agent *across all possible sequences of evidence*, *regardless of how the world turns out* (concerning the propositions bet upon).
  *   **Crucial Feature:** The guaranteed loss is only apparent *relative to the execution of the bookie's pre-defined contingent strategy*. There is no time prior to the completion of the sequence where the agent holds a portfolio of accepted bets that is *already* guaranteed to lose independently of future bets offered under the plan.
  *   **Excludes:**
      *   **Static Dutch Books:** Loss guaranteed from a single set of simultaneous bets.
      *   **Dutch Books in Sleeping Beauty-type scenarios:** Exploit synchronic credences in temporally extended, epistemically static (or recurrent) states with memory limitations, without relying on a contingent betting strategy triggered by *new, relevant evidence* changing the state space. No branching contingency plan based on evidence acquisition.
      *   **Arguments based solely on precommitment value:** Purely decision-theoretic arguments showing that precommitting to conditionalization maximizes expected utility, without constructing an exploitative betting strategy.

  **Conclusion**

  You've pinpointed a critical distinction: **Static Dutch Books** demonstrate *synchronic incoherence* via a guaranteed loss from a single portfolio, while **Dynamic Dutch Books (DDBs)** demonstrate *diachronic incoherence* (specifically, a violation of conditionalization) via a guaranteed loss realized only through the execution of a *contingent betting strategy* exploiting the agent's planned update rule. The "Strategy-Objection" argues DDBs only show the initial irrationality of not precommitting to conditionalization, not the irrationality of the later update itself. The main reply is the **Dispositional Defense**: the DDB exploits the agent's *current (t0) disposition* to update incorrectly, which constitutes diachronic incoherence. This objection highlights a difference in the *kind* of justification offered but doesn't completely invalidate DDBs for many. Scenarios like Sleeping Beauty involve distinct Dutch book structures exploiting synchronic credences in temporally complex, self-locating contexts, not the contingent strategy central to DDBs for conditionalization. The term "Dynamic Dutch Book" precisely carves out the phenomenon you're focused on.
