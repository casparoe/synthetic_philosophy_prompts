prompt: |-
  I'm an inertial navigation engineer by trade — I spend my days with strapdown IMUs, fiber-optic gyros, Coriolis corrections, frame transformations, drift and alignment procedures, the whole deal. My philosophy exposure was one undergrad course a long time ago and basically nothing since. A friend of mine (philosophy grad student) was going on about Newton's bucket and absolute space, and Leibniz thinking Newton was positing a ghost, and I kept noticing I deal with something that looks suspiciously like this exact question every day at work, just in a completely different vocabulary. So help me out.

  Restate the substantivalism vs. relationism debate — the bucket argument, the two-globes thought experiment if that's part of it, Leibniz's objections, and whatever Mach and later Einstein did to the picture — in my vocabulary: reference frames, what a gyro actually measures, pseudo-forces in rotating frames, the local inertial frame we align to before flight, the fact that our whole error budget depends on assuming an inertial frame exists and is stable enough. As faithfully as you can. My working intuition is that "absolute space" is basically just whatever the gyros measure rotation against, and the whole Newton/Leibniz fight is about whether that thing the gyros reference needs anything underneath it. Then give me the residue report: which parts of the philosophers' argument translate cleanly (is the bucket argument literally just "the water climbs the sides because the bucket-fixed frame is rotating relative to the gyro-measured inertial frame, and the concave surface is the pseudo-force you get in that frame"?), which parts only translate with distortion, and which have no counterpart in my vocabulary at all. The thing I most want you to address: can my vocabulary even express the difference between "the inertial frame is a real thing out there" and "the inertial frame is a bookkeeping device, and rotation is really just acceleration relative to the distant matter in the universe"? Nothing my instruments do distinguishes the two, and I want to know whether that's because the difference is empty, or because my vocabulary is missing something the philosophers can see. If general relativity changes the answer, or Mach's principle does, say so — but keep it in terms I can check against what my hardware actually does. I don't need a reading list or citations, just the translation and the honest accounting of what gets lost.
