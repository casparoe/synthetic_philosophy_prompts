  **The End of Societies: A Decision Tree**

  Answer the following questions based on the cases, not on labels.

  1. **Maya case (after 800 CE): The end of monument-building and royal courts is sufficient to say the Maya society collapsed, even if farming and language continued. (Yes/No)**
     - Yes -> Political collapse is key. Go to 5.
     - No -> Go to 2.

  2. **Easter Island case: The loss of the palm forest and the following population crash (by over half) is sufficient to say the society collapsed, even if the islanders adapted their political structure. (Yes/No)**
     - Yes -> Demographic collapse is key. Go to 5.
     - No -> Go to 3.

  3. **Eastern Mediterranean case (1200 BCE): The loss of the knowledge to administer a palace economy and write in Linear B is sufficient to say the society collapsed, even if the population eventually recovered. (Yes/No)**
     - Yes -> Knowledge collapse is key. Go to 5.
     - No -> Go to 4.

  4. **Easter Island case: The end of the statue-building culture and the associated religious practices is sufficient to say the society collapsed, even if the population stabilized at a lower level. (Yes/No)**
     - Yes -> Cultural collapse is key. Go to 5.
     - No -> Deflationary view. Leaf A.

  5. **Eastern Mediterranean case (after 1200 BCE): The fragmentation into smaller, independent villages counts as a failure of the society. (Yes/No)**
