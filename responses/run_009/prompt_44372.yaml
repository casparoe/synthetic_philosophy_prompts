  B. **Political Catastrophism**: Collapse is the disintegration of central authority, and fragmentation is failure.
     - *Awkward commitment*: The fall of the Western Roman Empire must be collapse even in regions that thrived under barbarian kingdoms.

  C. **Complexity Simplification** (Tainter): Collapse is the shedding of political complexity, and fragmentation is often adaptive.
