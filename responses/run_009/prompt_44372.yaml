answer: |-
  Below is a decision tree designed to sort positions on societal collapse, built from logical first principles and testable against three concrete cases: the Maya (southern lowlands, post-800 CE), the Eastern Mediterranean (c. 1200 BCE), and Easter Island (post-palm forest loss). The tree uses five binary questions based on observable phenomena, avoiding prior knowledge of authors or labels. Each question is phrased to be answerable from the cases, focusing on what ends (political structure, population, knowledge, or valued way of life), standard of comparison, timescale, and fragmentation. The tree yields nine leaves (including "unnamed" positions), with one sentence per leaf on its most awkward commitment. 

  ---

  ### **Decision Tree: What Do You Believe About Societal Collapse?**  
  *Use the Maya, Eastern Mediterranean, and Easter Island cases to answer each question. Base responses on observable changes, not labels.*

  1. **In the Maya case, the ruling elites vanished and monumental construction ceased, but farmers kept cultivating land and speaking Mayan languages. Does this count as societal collapse?**  
     - **Yes** → Go to 2.  
     - **No** → Go to 3.  

  2. **In the Eastern Mediterranean case, centralized states like the Hittites fragmented into smaller villages, yet technologies like ironworking spread. Is this fragmentation a societal failure?**  
     - **Yes** → Go to 4.  
     - **No** → Go to 5.  

  3. **In Easter Island, population fell catastrophically after palm forest loss, but oral traditions and clans persisted. Does this population decline alone define collapse?**  
     - **Yes** → Go to 6.  
     - **No** → Go to 7.  

  4. **For the Maya, is the "fall" measured against the society’s own Classic-era peak (e.g., Tikal’s height), not just subsistence or neighbors?**  
     - **Yes** → *Leaf A: Political Catastrophism*.  
     - **No** → *Leaf B: Unnamed*.  

  5. **In the Eastern Mediterranean, did the shift to village life happen within a single generation (c. 50 years)?**  
     - **Yes** → *Leaf C: Transformation View*.  
     - **No** → *Leaf D: Simplification View*.  

  6. **For Easter Island, did the population trough (e.g., 3,000 to 300) make society worse than bare subsistence, using external benchmarks like other Polynesian islands?**  
     - **Yes** → *Leaf E: Demographic Catastrophism*.  
     - **No** → *Leaf F: Unnamed*.  

  7. **In the Eastern Mediterranean, did the loss of Linear B writing and palace archives permanently reduce the capacity to rebuild (e.g., monumental architecture)?**  
     - **Yes** → *Leaf G: Epistemic Collapse*.  
     - **No** → *Leaf H: Deflationary View*.  

  8. **For the Maya, did the abandonment of elite arts and rituals (e.g., stelae) constitute a loss of a valued way of life that farmers themselves regretted?**  
     - **Yes** → *Leaf I: Cultural Collapse*.  
     - **No** → *Leaf H: Deflationary View*.  

  ---

  ### **Leaf Positions and Awkward Commitments**  
  *Each position is defined by the combination of answers. Standard names are used where established; "unnamed" indicates no known advocate. One sentence notes the most awkward commitment.*

  - **A: Political Catastrophism** (e.g., Joseph Tainter’s early work)  
    *Awkward commitment:* Must classify the post-Roman West as collapsed even where literacy and trade flourished in fragments.  
  - **B: Unnamed** (Political collapse + non-peak comparison)  
    *Awkward commitment:* Cannot distinguish collapse from ordinary decline if a society recovers after fragmentation (e.g., Mycenaean Greece).  
  - **C: Transformation View** (e.g., Norman Yoffee)  
    *Awkward commitment:* Must reframe the Eastern Mediterranean’s “collapse” as positive reorganization, despite evidence of mass displacement.  
  - **D: Simplification View** (e.g., Joseph Tainter’s later work)  
    *Awkward commitment:* Implies the Maya collapse was an economically rational choice, ignoring violence in elite power vacuums.  
  - **E: Demographic Catastrophism** (e.g., Jared Diamond)  
    *Awkward commitment:* Labels Easter Island a collapse even if survivors maintained social cohesion, equating depopulation with failure.  
  - **F: Unnamed** (Demographic collapse + non-catastrophic benchmark)  
    *Awkward commitment:* Cannot explain why demographic recovery (e.g., post-Black Death Europe) isn’t just a “trough” in normal cycles.  
  - **G: Epistemic Collapse** (e.g., Lewis Dartnell)  
    *Awkward commitment:* Treats lost knowledge (e.g., Roman concrete) as collapse, even if society adapts with new tech (e.g., medieval cathedrals).  
  - **H: Deflationary View** (e.g., postmodern critics)  
    *Awkward commitment:* Dismisses “collapse” as elitist bias, even in cases like Easter Island where ecological trauma caused mass suffering.  
  - **I: Cultural Collapse** (e.g., niche cultural historians)  
    *Awkward commitment:* Assumes the end of elite Maya rituals was universally mourned, ignoring evidence of farmer resilience/indifference.  

  ---

  ### **Coda: Gaps and Limitations**  
  *This tree reveals three combinations no one holds, diagnosed below. It also flags one unresolved tension.*

  - **Unoccupied Combinations:**  
    - **Political collapse + non-peak comparison (Leaf B):** *Unexplored.* Scholars avoid this, as it conflates collapse with routine decline (e.g., Byzantium’s slow fade).  
    - **Demographic collapse + non-catastrophic benchmark (Leaf F):** *Unattractive.* Implies societies can lose half their population without “failing,” which trivializes trauma.  
    - **Cultural collapse + fast timescale:** *Incoherent* (absent from tree). Cultural shifts (e.g., Maya ritual loss) are rarely generationally abrupt; requiring speed contradicts evidence.  

  - **Limitation of the Tree:**  
    The tree cannot separate **catastrophist views** that blend political and demographic collapse (e.g., Diamond’s Easter Island account). For instance, if a user sees both elite dissolution *and* depopulation as necessary, they might land in multiple leaves (e.g., A and E), blurring positions. This reflects real-world overlap in theories but highlights the tree’s focus on isolating core criteria.  

