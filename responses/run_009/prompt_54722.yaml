prompt: |-
  I've been going round in circles with a friend about whether Pascal's wager is just broken or whether a properly patched-up version could actually work, and before we have another row about it I want to pin down what a decent decision-theoretic treatment of the wager would even have to deliver. The usual objections people lob at it -- many gods, infinitesimal probabilities, the god who punishes you specifically for wagering -- all feel scattered to me, so give me the spec instead: exactly five requirements, numbered, each one a sentence or two with the case behind it, and no intro or conclusion. Something I especially want handled: whether its even coherent to treat this as a choice among acts with infinite payoffs when those payoffs aren't comparable in the usual way, and whether the whole thing collapses into something like Pascal's mugging if you allow that. Also, if you think the five can't be jointly satisfied, flag that inside whichever item it breaks rather than at the end -- my friend claims that unsatisfiability is the real lesson of the wager, and I'm not convinved he's wrong.
