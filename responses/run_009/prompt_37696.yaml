prompt: |-
  I produce a long-form interview program, and our next guest is a cognitive scientist who has spent her career defending global workspace theory, the idea, associated with Bernard Baars and his successors, that a mental content becomes conscious when it is broadcast widely across the brain rather than processed in a single module. I have no academic training, but I have been reading about this on my own, and what I keep snagging on is the distinction between access consciousness and phenomenal consciousness: the workspace story seems to explain why a content is available for report, memory, and reasoning, but not why there is anything it feels like to host it, and the guest is known for waving off that gap as a question for another day. Draft exactly five numbered interview questions, each one or two sentences long, that make the wave-off progressively harder to sustain — for instance by pressing on whether the neural ignition that makes a stimulus global adds anything phenomenally, or on what she would say about reports of vivid experience in patients whose damage supposedly removed the broadcasting hub, or on whether any experimental result could make her give up the theory rather than merely redescribe it. No introduction or conclusion; just the five questions.
reasoning: |-
  Okay, the user produces a long-form interview program and their next guest is a cognitive scientist who defends global workspace theory (GWT). The user doesn't have academic training but has been reading on their own and is stuck on the distinction between access consciousness (reportable availability) and phenomenal consciousness (subjective experience). They want five numbered questions that challenge the guest's tendency to wave off the phenomenal aspect.

  First, I need to understand the user's main concern: the explanatory gap in GWT regarding phenomenal consciousness. The user mentions examples like neural ignition adding anything phenomenally, reports in patients with brain damage, and whether any experiment could falsify GWT. The questions should progressively make it harder for the guest to dismiss this gap.

  Looking at the key elements: Access consciousness is about information being globally available for cognitive processes, while phenomenal consciousness is the subjective experience—what it feels like. GWT explains the former but not the latter. The guest is known for setting aside the "hard problem" of consciousness.

  The user wants questions that press on specific weaknesses. Let me brainstorm angles:
  1. **Neural Ignition and Phenomenal Addition**: Does the broadcasting process itself create the subjective experience, or just cognitive access?
  2. **Clinical Cases**: Patients with damage to the global workspace hub (like in Global Neuronal Workspace theory) but still report vivid experiences. How does GWT account for that?
  3. **Falsifiability**: What evidence would make the guest abandon GWT instead of reinterpreting it? This tests the theory's robustness.
  4. **Information Processing vs. Experience**: If GWT only explains access, is it sufficient? Highlighting the gap directly.
  5. **Conceptual Limitations**: Can a purely functional theory like GWT ever explain phenomenal aspects, or is it inherently unable to?

  I need to ensure each question builds on the previous one, increasing pressure. Start with the core mechanism, then counter-evidence, then falsifiability, then sufficiency, and finally the theory's limits. Each question should be concise—one or two sentences.

  Check for clarity and avoid academic jargon since the user isn't trained. Use terms like "global ignition" or "broadcasting hub" as they're familiar from the user's description. Also, reference Baars appropriately since the guest is his successor.

  Possible question structure:
  1. Ask if neural ignition adds phenomenal qualities.
  2. Cite clinical cases with preserved phenomenology despite hub damage.
  3. Demand falsifiable evidence.
  4. Challenge if access equals phenomenology.
  5. Question if functional architecture can ever explain subjective experience.

  Ensure each question forces the guest to address phenomenology directly, preventing a deferral. Avoid redundancy. Number them clearly as requested. No intros or conclusions—just the five questions.

  Finally, verify that the questions align with the user's examples and progressively corner the guest. Make sure they're sharp and pointed without being hostile, maintaining interview professionalism.
answer: |-
  Here are five numbered interview questions addressing the explanatory gap for phenomenal consciousness in global workspace theory:

  1. When a stimulus triggers "global ignition" in the workspace, broadcasting it widely, does this neural process *add* the subjective "what it's like" quality of experience, or does it merely make pre-existing phenomenal content functionally reportable?  
  2. How does your theory reconcile cases like persistent vivid visual imagery in some patients with extensive bilateral parietal damage—supposedly disrupting the broadcasting hub—if conscious phenomenology requires global availability?  
  3. Could any specific experimental finding—say, robust reportable cognition *without* correlated phenomenal reports under specific conditions—force you to abandon GWT as insufficient for consciousness, rather than just redefining "access" or "ignition"?  
  4. If GWT fully explains access (report, memory, control), but not why access *feels like something*, isn’t declaring this a "question for another day" effectively conceding that the theory doesn’t address consciousness itself—only its downstream effects?  
  5. Given that a purely functional architecture could, in principle, implement global broadcasting without any inner experience—a philosophical zombie—what in GWT’s *mechanism* guarantees phenomenology isn’t just an unexplained add-on?
