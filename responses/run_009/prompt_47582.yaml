  | Chicken       | 15 (feed crops)                            | 1,000                | 0.015                    |
  | Pork          | 15 (feed crops)                            | 800                  | 0.019                    |
  | Tofu (soy)    | 15 (direct crops)                          | 2,000                | 0.0075                   |
  | Lentils       | 15 (direct crops)                          | 1,500                | 0.01                     |
  | *Notes*       | – "Field animals" = rodents, birds, reptiles, insects.<br>– Total deaths per serving = Animal Deaths (Sheet 1) + Crop Deaths (Sheet 2). |

  **DATA SHEET 3: MORAL WEIGHTS PROMPTS**  
  *Distributed during Reveal 3. Qualitative descriptions only—no numbers.*

  - **Beef Cow**: Lives 18 months (6 months pasture, 12 months feedlot). Slaughtered at 500kg.
  - **Broiler Chicken**: Lives 6 weeks in crowded indoor shed. Bred for rapid growth; leg disorders common.
  - **Field Animals**: Rodents/birds crushed during harvest; insects poisoned by pesticides. Death often slow/painful.
  - **Question**: "Is one cow’s life worth 1,000 insects? Is a short, pained life worse than a longer one? Justify your weighting."

  ---

  ### **Activity Timeline (75 Minutes Total)**

  #### **1. Introduction (5 mins)**  
  - **Context**: “You’re the menu committee for a dining hall committed to minimizing animal harm. Design a 5-day default entrée menu (options: beef, chicken, pork, tofu, lentils). Constraints: $1.50/serving, 20g+ protein.”  
  - **Instructions**:  
    - Groups have 15 mins to create a menu + 1-paragraph justification using Data Sheet 1.  
    - Emphasize: “Your goal is to reduce animal deaths—but you don’t yet have full data.”  

  #### **2. Group Work 1: Initial Menu Design (15 mins)**  
  - **Goal**: Groups design menus based on intuition (e.g., students often pick chicken as “less cruel” or tofu as “harm-free”).  
  - **Predicted Choices**:  
    - Most groups prioritize chicken (cheap, intuitive “small animal = less harm”) or plant-based (assumed “death-free”).  
    - Beef is often avoided (“cows seem more sentient”).  

  #### **3. Reveal 1: Beef-Chicken Inversion (10 mins)**  
  - **Trigger**: After 15 mins, pause groups. Ask each to calculate **total deaths for their menu** (e.g., 5 chicken servings: 5 × 0.5 = 2.5 deaths vs. 5 beef servings: 5 × 0.002 = 0.01 deaths).  
  - **Reveal Method**:  
    - Record results on whiteboard: *“Group 1 (Chicken): 2.5 deaths | Group 2 (Beef): 0.01 deaths.”*  
    - Ask: “Why might chicken cause *250× more deaths* than beef for the same servings?”  
    - **Key Insight**: Servings per animal matter—a cow feeds 500 people; a chicken feeds 2.  

  #### **4. Group Work 2: Menu Revision (10 mins)**  
  - **New Task**: “Revise your menu using Data Sheet 1. Incorporate the death arithmetic.”  
  - **Predicted Shifts**: Groups drop chicken for beef or plant-based options.  

  #### **5. Reveal 2: Crop-Cultivation Problem (10 mins)**  
  - **Trigger**: After 10 mins, distribute **Data Sheet 2**. Ask groups to **recalculate total deaths** (animal + crop deaths).  
  - **Reveal Method**:  
    - Groups share results. E.g.:  
      - *Tofu: 0 + 0.0075 = 0.0075 deaths/serving → 0.0375 total for 5 days.*  
      - *Beef: 0.002 + 0.05 = 0.052 deaths/serving → 0.26 total for 5 days.*  
    - Point out: **Plant-based foods have deaths too** (e.g., lentils: 0.01/serving).  
    - Ask: “Can we achieve ‘clean hands’? Why or why not?”  

  #### **6. Group Work 3: Moral Weights & Final Justification (10 mins)**  
  - **Trigger**: Distribute **Data Sheet 3**.  
  - **Task**: Finalize menu and write a paragraph justifying choices given:  
    - Total deaths (Sheets 1 + 2).  
    - Moral weights (Sheet 3).  
    - Constraints (budget/protein).  
  - **Prompt**: “Is avoiding 0.26 cow deaths ‘better’ than avoiding 0.0375 field animal deaths? How do you compare suffering across species?”  

  #### **7. Group Presentations (10 mins)**  
  - Each group shares:  
    - Final menu.  
    - Total deaths.  
    - 1-paragraph justification (emphasizing moral weights).  
  - **Sample Outcomes**:  
    - Groups that chose tofu might struggle to defend “lesser evil” against insects.  
    - Beef groups face tension: “Fewer deaths, but is a cow’s life ‘worth more’?”  

  #### **8. Debrief (10 mins)**  
  - **Map Outcomes to Learning Objectives**:  
    1. **Beef-Chicken Inversion**: “You saw how intuition fails—small animals don’t mean less harm per meal.”  
    2. **Crop-Cultivation Problem**: “Even vegan meals involve harm. Perfection is impossible, but reduction is key.”  
    3. **Moral Weights**: “We must ask: *Which* lives matter? But arithmetic alone can’t answer this.”  
  - **Acknowledge Limitations**:  
    - **Real-World Markets**: “Our activity ignores supply chains. If everyone chose beef, demand could increase total suffering. Ethics isn’t just arithmetic—it’s systemic.”  
    - **Moral Weights**: “Assigning value to lives (cow vs. insect) is philosophical. We’ve exposed the question, not solved it.”  
  - **Closing**: “This isn’t about prescribing diets—it’s about confronting uncomfortable trade-offs. Real ethics requires nuance.”  

  ---

  ### **Predicted Failure Modes & Solutions**
  1. **Groups Reject Constraints to Advocate Veganism**:  
     - *Why*: Ideological commitment; discomfort with trade-offs.  
     - *Solution*: Gently enforce constraints: “Your dining hall must serve non-vegans. Minimize harm *within real-world limits*.” Reframe: “Veganism may reduce harm, but crop deaths exist—how do you justify *that*?”  

  2. **Groups Bogged Down in Numbers**:  
     - *Why*: Calculation errors or overcomplication.  
     - *Solution*:  
       - Assign a **Calculator** role.  
       - Use pre-formatted worksheets with tables.  
       - Provide simplified totals (e.g., “1 beef serving ≈ 0.052 deaths”).  

  3. **Superficial Moral-Weights Discussion**:  
     - *Why*: Time pressure or avoidance of discomfort.  
     - *Solution*: In Debrief, highlight groups that grappled deeply (e.g., “Group 3 asked if insect suffering ‘counts less’—why might that be?”).  

  4. **Overwhelm/Defeatism**:  
     - *Why*: Realizing no option is harm-free.  
     - *Solution*: Normalize discomfort: “This *is* hard. Ethics isn’t about purity—it’s about doing better amid complexity.”  

  ---

  ### **Instructor Notes**
  - **Prep**: Print data packets and worksheets. Test calculations (e.g., 5 chicken servings = 2.5 deaths).  
  - **Tone**: Stay neutral—avoid advocating for diets. Focus on critical thinking.  
  - **Flexibility**: If groups stall, shorten presentations. If debates ignite, extend debrief.  
  - **Post-Activity**: Assign reflection: “How might this change your view of ‘ethical eating’? What questions remain?”  

  This activity forces students to confront their assumptions through guided discovery. The reveals create cognitive dissonance, making the ethics of animal consumption feel visceral and unresolved—exactly as intended.
