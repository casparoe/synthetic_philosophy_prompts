  Below is a fully developed activity plan designed for your 75-minute session, including group structure, data sheets, timing, reveal triggers, debrief, and failure-mode solutions. The activity is structured to guide students through three key realizations in sequence: (1) the beef-chicken death inversion, (2) the crop-cultivation problem, and (3) the moral-weights dilemma.

  ---

  ### **Activity Title**: The Hidden Arithmetic of Harm: Designing an Ethical Dining Hall Menu

  #### **Learning Objectives**:
  1. Reveal the counterintuitive relationship between animal product choices and animal deaths.
  2. Expose the unavoidable harm in plant-based foods due to crop cultivation.
  3. Force engagement with the unresolved problem of comparing moral weights across species.

  #### **Group Structure**:
  - **Size**: 4 groups of 5 students each.
  - **Roles** (assigned within groups):
    - **Coordinator**: Facilitates discussion, ensures everyone speaks.
    - **Calculator**: Handles arithmetic (provide simple calculators).
    - **Ethicist**: Focuses on moral justifications.
    - **Budget Officer**: Tracks cost constraints.
    - **Nutrition Guard**: Ensures protein requirements are met.
  - **Task**: Design a 5-day default entrée menu minimizing animal harm, within constraints.

  #### **Materials**:
  - **Data Packets** (one per group; see details below).
  - **Worksheets** for menu planning and calculations.
  - **Whiteboard** for recording group decisions and reveals.
  - **Timer** for strict pacing.

  #### **Data Sheets Overview**:
