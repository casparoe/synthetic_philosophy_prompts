answer: |-
  ## Counting by Convention

  Ten lumps of coal stacked in a column.
  Ten lumps of coal stacked in a column.
  Ten lumps of coal stacked in a column.

  Five stick figures walking the sidewalk.
  Five stick figures walking the sidewalk.
  Five stick figures walking the sidewalk.

  Three wheat sheaves beside the granary.
  Three wheat sheaves beside the granary.
  Three wheat sheaves beside the granary.

  One house with a chimney smoking.
  One house with a chimney smoking.
  One house with a chimney smoking.

  One ship on a painted ocean.
  One ship on a painted ocean.

  But the dunes shift, the dunes shift, the dunes shift...
  (How many grains make *one* dune shift?)

  The neat rows blur and lose their grip.
  No perfect pictograph exists.
  We build the meaning, plank by plank, at sea.
  We learn.

  ---

  **Notes on the Poem & Neurath's Ideas:**

  1.  **The Method (Isotype):** The poem builds meaning through repetition of identical lines, each representing a unit (coal lumps, people, wheat, houses, ships). Quantity is shown by the *number* of repetitions, not by altering the unit itself.
  2.  **The Turn (Breaking Convention):** At "But the dunes shift...", the pattern breaks. The concept "dune shift" refuses to be captured by neat, identical units ("How many grains make *one* dune shift?"). This disrupts the visual logic.
  3.  **Neurath's Insight:** This breakdown embodies Neurath's key point: visual language (Isotype) isn't a magic, universal, pre-Babel tongue. It's a *constructed convention* ("We build the meaning"), learned and constantly revised ("plank by plank, at sea"), without absolute foundations ("no drydock"). The poem concludes with the active process of learning the convention ("We learn").
  4.  **Recognition:** Neurath enthusiasts will see the Isotype method in the structure and the explicit reference to his "plank by plank" ship metaphor for knowledge building. The focus on the *conventional* nature of pictograms is central to his philosophy of science and language.
  5.  **Standalone Poem:** Without knowing Neurath, the poem presents a clear visual metaphor (counting by repetition), shows its failure for complex, fluid concepts (dunes), and concludes with a message about the constructed, learned nature of symbols and meaning.
