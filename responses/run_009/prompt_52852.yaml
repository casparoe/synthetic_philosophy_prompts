prompt: |-
  A popular book on probability aimed at general readers gives this gloss on David Lewis's Principal Principle: 'The Principle says that rational degree of belief just is objective chance. If you know that a setup has a 70% chance of producing outcome A, you must believe A to degree 0.7 — no matter what else you know. So when a fair coin has landed heads nine times in a row, the Principle forbids expecting anything but 50% on the next toss, which is plainly irrational. Worse, the Principle is circular: Lewis analyzed chance in terms of the credences a rational agent would have, so chance is defined by the very credences it is then invoked to constrain. Lewis's own followers conceded this within a few years and abandoned the idea that chances guide credences; the moral is that objective chance is nothing over and above long-run frequency.'

  Something about this feels off — my understanding was that the Principle is supposed to say how rational agents should respond to chances, not to equate chance with credence — but I can't locate the errors myself. Please audit the gloss clause by clause: what a philosopher working on chance would accept, what is a forgivable simplification, and what is a straight misrepresentation. I'd especially like your view on two points: whether the "no matter what else you know" clause omits something essential to how Lewis actually stated the Principle; and whether the run-of-heads example really shows the Principle conflicting with rational updating, or whether it turns on mixing two kinds of evidence that the Principle itself keeps apart. Finally, does the book's closing moral — that chance is nothing over and above long-run frequency — follow from whatever accurate content survives the audit?
reasoning: |-
  Okay, the user has shared a passage from a popular book on probability that critiques David Lewis's Principal Principle. They feel something's off about this gloss and want me to audit it clause by clause. They're specifically concerned about two points: whether the "no matter what else you know" clause accurately represents Lewis, and whether the coin flip example genuinely shows a conflict with rational updating.

  Let me unpack this carefully. The book's gloss makes several strong claims: that the Principal Principle equates rational belief with chance, forbids adjusting expectations after repeated outcomes (like nine heads in a row), and is circular because Lewis defined chance in terms of rational credences. It concludes that chance is just long-run frequency.

  Hmm, this feels like a misinterpretation. From what I recall, Lewis's actual Principal Principle is more nuanced. It says that if you know the objective chance and have no "inadmissible" information, your credence should match the chance. The book's "no matter what else you know" phrasing misses this crucial limitation - Lewis explicitly allows that certain information (like future events or causal details) can override chance.

  The coin example is particularly misleading. After nine heads, a rational agent would suspect the coin might not be fair. But the Principal Principle only applies when you know the chance remains 50%. If new evidence suggests the chance isn't 50%, you're not violating the principle by adjusting - you're following it by updating on new information. The book seems to conflate knowing the chance with merely assuming it.

  On circularity... Lewis did try to reduce chance to rational credences, but his later "reformulated" version separated them. And while he did link chance to frequencies via his "best system" analysis, it's not simple long-run frequency - it's about lawlike patterns. The book oversimplifies this to the point of distortion.

  The user seems philosophically sophisticated - they sensed the problems but couldn't articulate why. They're probably looking for clarity on how Lewis actually avoids these pitfalls. I should emphasize the inadmissible information distinction, explain why the coin example misapplies the principle, and clarify that Lewis's mature view wasn't circular nor purely frequentist. The closing moral about chance being "nothing over and above" frequency is too reductive; Lewis saw it as a theoretical construct grounded in but not identical to frequencies.
answer: |-
  You're right to be suspicious—this gloss contains multiple significant misrepresentations of Lewis's Principal Principle (PP) and its implications. Let's audit it clause by clause, separating philosophical accuracy from simplification and error. I'll address your specific concerns about the "no matter what else" clause and the coin example, then assess the closing moral.

  **Clause-by-Clause Audit:**

  1.  **"The Principle says that rational degree of belief just is objective chance."**
      *   **Misrepresentation.** This is the core error. The PP **does not identify** credence with chance. It **constrains** rational credence *given knowledge of* chance. Lewis states it as a *conditional* principle: *If* you know the objective chance of A is x, *then* (absent special information) your rational credence in A should be x. Chance and credence remain distinct concepts. Chance is an objective feature of the world; credence is a subjective state of the agent.

  2.  **"If you know that a setup has a 70% chance of producing outcome A, you must believe A to degree 0.7..."**
      *   **Forgivable Simplification (with caveats).** This captures the core *prescriptive* element of the PP: knowledge of chance should guide rational credence. However, it omits the crucial qualification about "*absent inadmissible information*" (discussed below). Without this, the statement is incomplete and misleading.

  3.  **"...no matter what else you know."**
      *   **Major Misrepresentation / Omission of Essential Element.** This directly contradicts Lewis's actual formulation. Lewis included a critical exception: **inadmissible information**. The PP specifies that your credence should equal the chance *conditional only on admissible historical information and the chance proposition itself*. If you possess "inadmissible" information (information about the future outcome A itself, or information that "bypasses" the chances, like direct perception of the outcome or prophecy), the PP does *not* constrain your credence to match the known chance. **Your specific concern is spot on:** the "no matter what else" clause fatally omits this essential qualification.

  4.  **"So when a fair coin has landed heads nine times in a row, the Principle forbids expecting anything but 50% on the next toss, which is plainly irrational."**
      *   **Misrepresentation & Misapplication.** This example fundamentally misunderstands the PP and rational updating:
          *   **Ignoring Evidence About the Chance:** The PP applies *when you know the chance*. After seeing nine heads in a row, a rational agent *no longer knows the coin is fair with 50% chance of heads*. The sequence of outcomes is *evidence* that the chance might not be 50% (e.g., the coin might be biased, the tosser skilled). The PP doesn't forbid updating your belief *about what the chance is* based on this evidence! It only says that *if you still knew the chance was 50%*, your credence in heads should be 0.5. But after nine heads, you no longer have that knowledge.
          *   **Conflating Chance Evidence with Outcome Evidence:** The PP governs how to set credence *conditional on knowledge of chance*. Observing the nine heads isn't "else you know" *while still knowing the chance is 50%*; it's evidence that *changes your belief about what the chance is*. The PP keeps these distinct: your credence in heads *given chance=0.5* must be 0.5 (assuming no inadmissible info). But your credence *given the historical sequence of nine heads* might very well be different, precisely because that sequence provides evidence about the chance.
          *   **Rational Updating:** The "plainly irrational" conclusion is only reached by misapplying the PP. Rational agents *should* become suspicious after nine heads and increase their credence in heads for the next toss *if they update their belief about the chance*. The PP doesn't forbid this; it governs how credence relates to known chances, not how to form beliefs about chances from evidence.

  5.  **"Worse, the Principle is circular: Lewis analyzed chance in terms of the credences a rational agent would have, so chance is defined by the very credences it is then invoked to constrain."**
      *   **Misrepresentation of Lewis's Project & Oversimplification:**
          *   **Lewis's Goal:** Lewis aimed for a "Humean" reduction of objective chance to patterns within the "mosaic" of particular events (the Humean Supervenience thesis). He did *not* simply define chance as "the credences a rational agent would have." That would be circular.
          *   **The Role of PP:** Lewis used the PP as a *central platitude* that any adequate theory of chance must satisfy. It was a *constraint* on his reduction, not the definition itself. Chance had to be whatever feature of the world made the PP *true* for rational agents.
          *   **The Reduction (Best System Analysis):** Lewis's actual analysis (the "Best System Analysis" or BSA) defined objective chances as those probabilities assigned by the *best* systematization of the universe's history. "Best" meant the system achieving the optimal balance of *strength* (descriptive power), *simplicity*, and *fit* (how likely the actual history is according to the system's probabilities). *Frequencies* are crucial inputs to determining fit and strength, but the chances are the system's *theoretical posits*, not simply the frequencies themselves. The PP then *follows* from this analysis: a rational agent aware of the *best system's* chances *should* align their credences with them (absent inadmissible info) because those chances represent the best available summary of the relevant patterns.
          *   **Circularity Charge:** While complex, Lewis's project wasn't *viciously* circular. He didn't define chance *as* rational credence. He defined it via the BSA and showed that chances defined this way would satisfy the PP. The PP connects chance and credence, but the BSA grounds chance independently in the world's pattern. Whether the BSA *succeeds* is debated, but the charge of simple circularity misses the structure of his account.

  6.  **"Lewis's own followers conceded this within a few years and abandoned the idea that chances guide credences..."**
      *   **Inaccurate Exaggeration.** While Lewis *did* revise the PP (the "New Principle" or "Principal Principle Reformulated") to handle specific problems concerning chance in very small worlds or undermining futures, the *core idea* that chances guide rational credences (under appropriate conditions) remains central to Lewisian and neo-Lewisian Humean views of chance. They did *not* abandon the idea that chances guide credences. They refined *how* they guide credences to make the theory more robust.

  7.  **"...the moral is that objective chance is nothing over and above long-run frequency."**
      *   **Significant Oversimplification / Misrepresentation of Lewis.** While long-run frequencies are *crucially important* within Lewis's BSA (they heavily influence *fit* and *strength*), chance is *not* simply identical to long-run frequency:
          *   **Finite Cases:** Chances apply meaningfully to single events and finite sequences, where actual frequencies may deviate from the chance.
          *   **Theoretical Posit:** Chances are the probabilities assigned by the *best system*. This system may posit chances that *differ* from actual finite frequencies if doing so yields a simpler, stronger overall system (e.g., assigning 1/6 to each face of a die based on symmetry, even if a finite roll sequence doesn't show exact 1/6 frequencies).
          *   **Best System vs. Frequency:** The BSA makes chance supervene on the entire mosaic of particular facts, including frequencies, but it's a higher-level theoretical construct. "Nothing over and above" might be acceptable to a strict Humean, but equating it *specifically* with "long-run frequency" is too narrow. It's a pattern summarized by laws/probabilities within the best system, heavily informed by but not reducible to mere observed frequencies.

  **Addressing Your Specific Points:**

  1.  **"No matter what else you know" omits something essential?**
      *   **Absolutely.** Omitting "inadmissible information" is a critical error. Lewis's PP explicitly allows that certain kinds of information (direct information about the specific future outcome, prophecy, etc.) *can and should* override the constraint to set credence equal to the known chance. The gloss renders the principle implausible and easily refutable by counterexamples involving such information, which Lewis's original formulation avoids.

  2.  **Does the run-of-heads example show a conflict?**
      *   **No, it misapplies the principle.** The conflict arises *only* if one mistakenly assumes that after nine heads, the agent *still knows the chance is 50%*. But the nine heads are *evidence* relevant to *what the chance is*. Rational updating involves revising your belief *about the chance* based on this evidence. The PP governs how to set credence *conditional on a known chance value*. It doesn't constrain how you *learn* what the chance is from evidence like outcome sequences. The example conflates evidence *about* the chance with evidence *conditioned on while knowing* the chance.

  **Conclusion on the Closing Moral:**

  *   **No, the moral does not follow.** The accurate core that survives the audit is: "Rational credence should align with known objective chance, absent inadmissible information or evidence suggesting the chance has changed, and Lewis grounded chance in patterns of events via the Best System Analysis."
  *   Lewis's BSA makes objective chance *strongly dependent* on actual frequencies (especially in the long run) within the Humean mosaic. Frequencies are the primary evidence for chances and determine the "fit" of a system. **However:**
      *   Chance is a *theoretical posit* of the best system, not simply the frequency itself.
      *   The best system can posit chances that *differ* from actual finite frequencies for gains in simplicity and strength.
      *   Chance applies meaningfully to single cases where no relevant frequency exists.
  *   Therefore, while long-run frequencies are *foundational* to Lewisian objective chance, saying chance is "nothing over and above long-run frequency" is a significant oversimplification that ignores the role of simplicity, strength, theoretical systematization, and applicability to single cases within the Best System Analysis. It reduces a sophisticated reductionist account to a crude frequentism that Lewis explicitly rejected.

  In summary, the book's gloss misstates the PP as an identity, ignores the critical "inadmissible information" clause, misapplies the principle to the coin example, misrepresents Lewis's project as circular and abandoned, and oversimplifies his reduction of chance to crude frequentism. Your intuition that it was "off" was correct on all major points.
