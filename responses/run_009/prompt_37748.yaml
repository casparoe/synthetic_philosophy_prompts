prompt: |-
  I teach an upper-level undergraduate seminar on social epistemology (18 students, 80 minutes), and next week we move from the Mill/Hume-style reductionist view of testimony to Coady's anti-reductionist rejoinder and then Fricker's local reductionism. Design an in-class activity in which students acquire beliefs from deliberately mixed channels — some first-hand observation, some short relay chains of classmates, some unsigned written notes — under a scoring system that pays for accurate beliefs and penalizes false ones, so that they run into the reductionist's challenge in practice rather than on the page: whenever they trust a relayed report, they should be forced to ask how they could non-circularly certify the source's reliability, and discover that any certification route they try runs through further testimony. At some point the cost of checking should exceed the value of the belief, so that students also feel Coady's point that much of our testimonial reliance is rationally non-optional and cannot be earned by prior investigation. Include rules, materials, a timeline, a scoring scheme that doesn't use real money, a debrief that maps specific moments in the activity onto the three positions, an honest note on which part of the debate no classroom game can reproduce (for instance, why testimony is practically inescapable in ordinary life but merely one option among many in a staged exercise), and a list of the two or three things most likely to go wrong on a first run and how to handle them.
reasoning: |-
  We are designing an in-class activity that simulates the acquisition of beliefs through various channels (first-hand observation, relay chains, anonymous notes) and incorporates the philosophical challenges of reductionism vs. anti-reductionism in testimony. The goal is for students to experience the reductionist's challenge and the anti-reductionist's point that much testimonial reliance is non-optional.

  ### Activity Design: "Testimony Trust Trial"

  **Overview:** Students will be presented with a series of "belief opportunities" (statements about the state of the classroom or a simple object) that they can choose to accept or reject. They gain points for accurate beliefs and lose points for false ones. The statements come through three channels:
  1. **First-hand Observation (Direct):** The student sees the fact directly (e.g., looking at an object).
  2. **Relay Chain (Oral Testimony):** The student hears a report from a classmate who might have heard it from another, creating chains of up to 3 steps.
  3. **Anonymous Note (Written Testimony):** The student receives an unsigned written note with a statement.

  The activity will run in multiple rounds, each presenting a new statement. The scoring will make it costly to verify everything, and the structure will show that attempting to verify the reliability of a source often leads to more testimony.

  **Materials:**
  - A set of 10-15 statements (facts about simple, verifiable things in the classroom or brought objects). Examples:
     - "There are exactly 3 red pens in the blue box on the front table."
     - "The window in the back of the room is open exactly 2 inches."
     - "The book on the instructor's desk is open to page 45."
     - "The clock on the wall shows 2:15."
     - "There is a paper clip taped under the third chair in the second row."
  - Index cards for anonymous notes (prepared in advance by the instructor).
  - A stopwatch or timer.
  - Scoreboard (whiteboard or digital) to track points.
  - A few simple objects (like a box with pens, a book, a clock, etc.) to set up the facts.

  **Rules:**
  1. **Rounds:** There will be 5 rounds. In each round, a new statement is introduced. The instructor will set up the fact (e.g., place pens in a box, set the clock, etc.) at the beginning of the round, but students do not observe the setup (they are in the hall or have their eyes closed). Then, the students return to their seats.
  2. **Channels:**
     - **Direct Observation:** A student can choose to go and look (but only 2 students per round are allowed to do this, and it costs points). 
     - **Relay Chain:** The instructor whispers the statement to one student (the first link). That student can then whisper it to another, and so on. A student can choose to trust a relayed report from a classmate. The chain can have up to 3 links. The student at the end of the chain reports to the class.
     - **Anonymous Note:** The instructor places an unsigned note on a student's desk. The note contains the statement (which might be true or false). The student can choose to trust it or not.
  3. **Acquiring Beliefs:**
     - Each student, in each round, must decide whether to accept or reject the statement. They record their decision on a response sheet (without knowing the truth until the end of the round).
     - They can use one of the channels to form their belief. However, they cannot use more than one channel per round (except when verifying, which costs extra).
  4. **Verification and Costs:**
     - **Direct Observation:** Costs 5 points to use (regardless of whether the belief is true or false). Only available to 2 students per round (first come, first served by raising hand). The observing student must report their observation to the class (so it becomes testimony for others) but others then have to trust that testimony.
     - **Hearing a Relay:** Free, but the student must note who they heard it from (and thus the chain). If they hear it from a classmate, they are accepting testimony without direct verification.
     - **Anonymous Note:** Free. The student must note that they received a note.
     - **Verifying a Testimonial Claim:** If a student wants to verify a relayed report or an anonymous note, they can:
          - Ask the source: "Are you reliable?" But the source can only answer by providing more testimony (e.g., "I heard it from X" or "I saw it myself" if they are the first link) and this costs 2 points. 
          - They can also try to verify by direct observation (if slots are available) but that costs 5 points and uses one of the two slots. 
          - They can also ask for a chain of verification (e.g., trace back the relay chain) but each step of asking costs 2 points and each person in the chain can only testify about their own source (which is more testimony).
     - Note: The goal is to show that any attempt to verify the reliability of a source leads to more testimony (which itself needs verification) or becomes too costly.

  **Scoring Scheme (using points, not real money):**
  - Starting points: Each student begins with 20 points.
  - For each round:
     - If a student forms a belief (accepts the statement) and it is true: +5 points.
     - If a student forms a belief (accepts the statement) and it is false: -10 points.
     - If a student does not form a belief (rejects the statement or abstains) and the statement is true: 0 points (no change).
     - If a student does not form a belief and the statement is false: +2 points (for avoiding a false belief).
  - Additional costs:
     - Using direct observation: -5 points (regardless of outcome).
     - Verifying a source (each time you ask a source for their reliability): -2 points per question (and the answer is more testimony).
     - Tracing a chain: each step (each person you ask about the previous link) costs 2 points.
     - Note: Verification costs are incurred even if you then decide not to form a belief.

  **Timeline (80-minute class):**
  1. **Introduction (10 minutes):** 
     - Review the readings (Mill/Hume, Coady, Fricker) and explain the activity.
     - Explain the rules, scoring, and the three channels.
     - Assign starting points and hand out response sheets.

  2. **Setup for Round 1 (5 minutes):** 
     - Students leave the room (or close eyes) while the instructor sets up the fact (e.g., places pens in the box). 
     - The instructor also prepares an anonymous note and chooses the first student for the relay chain.

  3. **Round 1 (8 minutes):** 
     - Students return. The instructor whispers the true statement to the first relay student. The instructor also places the anonymous note (with the true statement) on one student's desk.
     - The relay chain begins (students can pass the message to one another). 
     - Students decide how to form their belief: they can try to get direct observation (only 2 slots, first to raise hand), listen to a relay, take the anonymous note, or verify. They record their decision and source.
     - The instructor monitors and notes the relay chain and who used direct observation.

  4. **Scoring for Round 1 (5 minutes):** 
     - The instructor reveals the truth. 
     - Students calculate their points for the round (with help from the instructor if needed) and update their total.

  5. **Rounds 2-5 (8 minutes each, 5 minutes scoring each):** 
     - Repeat the same process, but in some rounds, the anonymous note may be false (to simulate unreliable testimony) and in one round, the relay chain may start with a false statement (because the first student is given a false statement). The instructor should vary the truth value and the reliability of the channels to create uncertainty.

     - Total round time: 8*5 = 40 minutes, scoring: 5*5=25 minutes. But note: we can adjust the number of rounds if time is tight. Alternatively, we can do 4 rounds and then have a longer debrief.

  6. **Debrief (20 minutes):** 
     - Discuss the activity and connect to the philosophical positions.
     - Key moments to highlight:
          - When a student trusted a relay and it was false: reductionist challenge - how could they have verified without circularity? (They might have tried to check the source, but that led to more testimony and cost points.)
          - When a student avoided a false belief by not trusting: but then they lost the chance to gain points, and in life we cannot always abstain.
          - When the cost of verification was too high (e.g., 5 points for direct observation and then they only got 5 for being right, so net 0) versus when they trusted and got +5 without cost. This illustrates Coady's point: we must rely on testimony without prior verification because the cost of verification is often too high and we cannot avoid it.
          - When a student tried to verify a testimony by checking the chain: each step cost points and the answers were more testimony. This shows that non-circular certification is practically impossible.
          - The anonymous note (without a known source) is particularly challenging because there is no one to ask. This can lead to Fricker's local reductionism: we might have reasons to trust the institution (the note came from the instructor?) but in this activity, the note might be false.

     - Map to the three positions:
          - **Hume/Mill (Reductionism):** Trust in testimony is justified only if we have independent reasons (from experience) to believe the source is reliable. The activity shows the difficulty: independent reasons are hard to come by without circularity and are costly.
          - **Coady (Anti-reductionism):** Much of our testimonial reliance is default justified and non-optional. The activity shows that we often have to trust without verification because the cost of verification is too high and we cannot function otherwise (as seen in the points system: if you verify everything, you run out of points).
          - **Fricker (Local Reductionism):** We can have local, context-specific reasons for trusting a particular piece of testimony. In the activity, a student might note that the relay chain started with a known reliable classmate (but how do they know that classmate is reliable? from past experience? which is circular if based on testimony). Also, the anonymous note might be trusted if it comes from a source that has been reliable in previous rounds (but again, based on past testimony).

  7. **Honest Note:** 
     - In ordinary life, testimony is inescapable because we are born into a world of language and trust, and we cannot verify everything without relying on more testimony. In this game, students could choose to abstain (and sometimes gain 2 points for avoiding a false belief) but in real life, abstaining might mean missing crucial information (like "there's a car coming!"). Also, in real life, we have a rich network of trust built over time, which is hard to simulate in a short game.

  **Potential Problems and Solutions:**
  1. **Problem:** The relay chain might break down (students mishear or misreport). 
     - **Solution:** This is actually a feature! It shows the unreliability of testimony. The instructor should note the errors and use them in the debrief.

  2. **Problem:** Time management - rounds might take longer than expected.
     - **Solution:** Use a timer for each round. If a round runs long, skip the scoring details and do a quick reveal and approximate scoring. Do fewer rounds if necessary.

  3. **Problem:** Students might not engage with the verification process (because it's complicated or costly). 
     - **Solution:** Encourage them by giving examples: "If you heard it from Alice, you might ask her: 'How do you know?' and she might say 'I heard it from Bob', then you can ask Bob, but that costs points." Also, in the first round, model one verification attempt.

  4. **Problem:** The scoring might be too complex. 
     - **Solution:** Provide a clear scoring sheet and do the first round together. Have TAs or the instructor help with calculations.

  5. **Problem:** The facts might be too easy to verify by direct observation (defeating the purpose). 
     - **Solution:** Choose facts that are not obvious from the student's seat and require getting up and looking closely. Also, limit direct observation slots to create scarcity.

  **Conclusion:** This activity should make the philosophical challenges concrete. Students will experience the tension between the need to verify and the impracticality of doing so, leading to a deeper understanding of the reductionism/anti-reductionism debate.
answer: |-
  ### **Activity Design: "The Testimony Trust Trial"**  
  **Objective:** Students experience the tension between verifying testimonial sources (reductionism) and unavoidable reliance on testimony (anti-reductionism) through a game where they acquire beliefs via mixed channels, scoring points for accuracy and losing points for falsehoods.

  ---

  ### **Rules & Setup**  
  **Materials:**  
  - 5 sealed "fact boxes" (e.g., small containers with simple objects inside, like colored blocks or printed symbols).  
  - 15 anonymous written notes (3 per round, some true/false).  
  - Timer, scoreboard (digital or whiteboard).  
  - Student response sheets (for recording beliefs/sources).  
  - Stickers or tokens (for tracking points).  

  **Channels for Belief Acquisition:**  
  1. **Direct Observation (Costly):** Inspect the fact box (limited slots).  
  2. **Oral Relay Chain:** Hear a report from classmates (max 3 links: A→B→C→You).  
  3. **Anonymous Note:** Read an unsigned note (pre-written by instructor).  

  **Scoring System (Non-Monetary):**  
  - Start with 20 points (stickers represent 5 points each; total 4 stickers).  
  - **True belief:** +1 sticker (+5 points).  
  - **False belief:** −2 stickers (−10 points).  
  - **No belief/abstain:** 0 points (if true), +0.4 stickers (+2 points if false).  
  - **Verification costs:**  
    - Direct observation: −1 sticker (−5 points).  
    - Ask about a source’s reliability: −0.4 stickers (−2 points per question).  

  **Game Flow (5 Rounds, 10 Min Each):**  
  1. **Setup (Per Round):**  
     - Students leave the room. Instructor sets a fact (e.g., "Box 1: 3 blue blocks").  
     - Prepares 3 anonymous notes: 1 true, 1 false, 1 ambiguous (e.g., "mostly blue blocks").  
     - Selects 1 student as the "primary source" for oral chains.  

  2. **Belief Acquisition (5 Min):**  
     - **Direct observation:** 2 students/round can inspect the box (first-come, first-served; costs 5 points).  
     - **Oral chains:** Primary source shares the fact with 1–2 others, who may relay it further.  
     - **Anonymous notes:** Randomly distributed to 3 students.  
     - **Verification:** Students can ask sources, "How do you know?" (costs 2 points), but answers always involve testimony (e.g., "I heard it from X" or "I saw it").  

  3. **Decision & Scoring (3 Min):**  
     - Students record: (1) Their belief (true/false/abstain), (2) Source used, (3) Verification attempts.  
     - Instructor reveals the truth. Points are updated.  

  4. **Variability (Critical for Tension):**  
     - Round 3: Primary source is given a false fact.  
     - Round 4: Anonymous notes are mostly false.  
     - Round 5: Fact is complex (e.g., "5 blocks: 3 blue, 2 red"), making direct observation error-prone.  

  ---

  ### **Timeline (80-Minute Class)**  
  - **Intro (10 min):** Explain rules, link to readings (Mill/Hume vs. Coady/Fricker).  
  - **Rounds 1–5 (50 min):** 10 min per round (5 min acquisition + 3 min scoring + 2 min reset).  
  - **Debrief (20 min):** Discuss philosophical connections and limitations.  

  ---

  ### **Debrief: Mapping Activity to Philosophical Positions**  
  1. **Reductionist Challenge (Hume/Mill):**  
     - **Activity Moment:** A student trusts an oral chain but discovers it was false (e.g., Round 3). They try to verify by asking the source, "How do you know?" but the answer ("I heard it from Y") requires trusting *further* testimony.  
     - **Connection:** Shows the circularity problem—verifying reliability depends on unvetted testimony.  

  2. **Anti-Reductionist Insight (Coady):**  
     - **Activity Moment:** In Round 5, a student avoids costly direct observation (−5 points) and relies on a relay chain. Even if wary, they "must" trust to avoid losing points (simulating real-life non-optional reliance).  
     - **Connection:** Highlights that prior verification is often impractical; we accept testimony out of necessity.  

  3. **Local Reductionism (Fricker):**  
     - **Activity Moment:** A student uses past rounds to distrust a classmate with a poor track record but trusts a consistent source.  
     - **Connection:** Demonstrates contextual justification—e.g., trusting a source based on prior accurate reports (local evidence).  

  ---

  ### **Honest Note: What the Game *Cannot* Replicate**  
  - **Real-Life Inescapability of Testimony:** In the game, students can opt out of testimony (e.g., abstain or use direct observation). In reality, testimony is woven into language, culture, and learning from infancy—abstaining is rarely feasible. For example, we can’t "opt out" of trusting traffic signs or historical records. The game makes testimony one choice among many; life makes it foundational.  

  ---

  ### **Potential Pitfalls & Solutions**  
  1. **Problem: Students avoid testimony entirely.**  
     - *Solution:* Incentivize participation:  
       - Award +0.4 stickers for correct relay-chain beliefs (to offset verification costs).  
       - Penalize over-reliance on direct observation: "In real life, you can’t inspect everything!"  

  2. **Problem: Relay chains break down (e.g., whispering errors).**  
     - *Solution:* Allow 1 "chain reset" per game. Debrief this as a real-world testimony fragility (e.g., gossip distortion).  

  3. **Problem: Scoring complexity slows the game.**  
     - *Solution:* Use a simplified scoreboard (e.g., "Team A: 60 points") and assign stickers in bulk after each round.  

  ---

  ### **Instructor Notes**  
  - **Emphasize Tension:** Remind students that "winning" requires balancing verification costs against gains—mirroring rational trust in testimony.  
  - **Ethical Safeguard:** Avoid personal traits (e.g., "trust Sarah, she’s smart"); focus on game-based reliability (e.g., "Rounds 1–3: Student X was accurate").  
  - **Post-Activity Prompt:** "When did you *have* to trust testimony, even if you couldn’t verify it? How did that feel?"  

  This activity forces students into the reductionist’s dilemma—verification is either circular or too costly—while making Coady’s anti-reductionism viscerally relatable. By the debrief, they’ll grasp why testimony is both epistemically risky and socially indispensable.
