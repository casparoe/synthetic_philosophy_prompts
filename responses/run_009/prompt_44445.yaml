  PhD student in phil of physics here, stuck on a dissertation chapter about psi-ontology. The PBR theorem keeps coming up as the big argument that psi-epistemic views are basically dead, but I can't get a feel for how evenly it actually hits the different interpretations. Could you rate each of the following on a 1–10 scale for how threatened they should really be by the theorem: QBism, old-school Copenhagen-style instrumentalism, Bohmian mechanics, Everett, and objective collapse theories? Also, if you wanted to keep some psi-epistemic view alive, which assumption in the proof would you attack first — and can you rank the main escape routes (e.g. denying preparation independence, letting the ontic state depend on the measurement context) by how much philosophical collateral damage each one does? My supervisor insists QBism just shrugs the whole thing off, id like a second opinion before I commit a chapter to it.
