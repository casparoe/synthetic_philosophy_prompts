answer: |-
  The courtroom exclusion of moral testimony rests on a distinctive, though often implicit, epistemology centered on **moral judgment as non-delegable, first-personal, and requiring direct engagement with reasons**. This contrasts sharply with deference in other institutional contexts, suggesting a nuanced view rather than outright pessimism about moral knowledge transmission. Here's a reconstruction and analysis:

  ### Implicit Epistemology of the Exclusion
  1.  **Non-Transferability of Final Moral Judgment:** The core presupposition is that *assigning criminal culpability* (e.g., "wicked," "deserved punishment") is a unique kind of judgment:
      *   **Requires First-Personal Deliberation:** Knowing *that* an act is morally wrong (or legally culpable) in this specific, condemnatory sense requires the juror to grasp the *reasons why* it is wrong through their own reasoning. Merely accepting an expert's *conclusion* ("this was wicked") is seen as insufficient for genuine moral *knowledge* or legitimate condemnation in this context. This aligns with **moderate moral testimony pessimism** – one cannot gain *full, authoritative understanding* of the moral wrongness relevant to condemnation merely by being told.
      *   **Embodies Community Norms & Conscience:** Culpability judgment isn't just about abstract moral truth; it's the *community's* condemnation through the jury. Delegating this to an expert (even a moral one) undermines its democratic and expressive function. The jury *is* the institutionalized "moral expert" representing the community conscience.
      *   **Distinct from Factual or Specialized Knowledge:** Ballistics or psychiatry involve specialized *descriptive* facts or *causal* inferences inaccessible to laypeople. Moral wrongness, in the culpability sense, is viewed as accessible to reason and common human experience, even if complex. Experts inform the *descriptive basis* (facts, psychology) but not the *evaluative conclusion* itself.

  2.  **Skepticism about "Moral Expertise" for Culpability:** While expertise in *describing* morally relevant facts (e.g., psychiatric diagnoses, cultural norms) is accepted, expertise in *pronouncing final culpability* is doubted:
      *   **Lack of Authoritative Methodology:** Unlike scientific fields, there's no consensus on the *method* for determining ultimate moral blameworthiness that could credential "experts" in a way courts recognize for this purpose. Who qualifies? Philosophers? Theologians? Community elders? The system answers: "The jury."
      *   **The "Wrong Kind of Reasons" Problem:** An expert's testimony based on philosophical theory or personal conviction might provide the *wrong kind of reason* for a juror. The juror needs to be convinced by reasons *they* find compelling based on shared norms, not an external authority's reasoning.

  ### Reconciling with Deference Elsewhere
  The apparent inconsistency dissolves when considering the *nature of the judgment* and *institutional role* in other contexts:

  1.  **Research Ethics Committees & Professional Disciplinary Panels:**
      *   **Applied Standards:** These bodies primarily *apply pre-existing, codified, or professionally established standards* (e.g., the Nuremberg Code, Hippocratic Oath, professional conduct rules). Their "moral" judgment is often about compliance with these shared norms, not ultimate moral condemnation.
      *   **Procedural Expertise & Institutional Role:** Their expertise lies in *interpreting and applying* complex regulations within their specific domain and *procedural fairness*. They operate as administrative/adjudicative bodies within a profession or institution, not as the voice of the community condemning a citizen.
      *   **Deference is to *Domain-Specific* Judgment:** Courts defer to their application of their *own* standards, not to their pronouncements on ultimate moral culpability in the abstract.

  2.  **Tort Law (e.g., "Outrageous Conduct"):**
      *   **Legal Standard, Not Pure Morality:** Judges/juries determine if conduct meets the *legal definition* of "outrageous" or "intentional infliction of emotional distress," which is a *legal category* informed by, but distinct from, pure moral judgment. It's a question of *law* (what standard applies) and *fact* (did conduct meet it?).
      *   **Objective Reasonableness:** The standard is often framed as what a "reasonable person" would find outrageous, aiming for an objective, community-based benchmark. While moral, it's operationalized as a factual inference about community standards.
      *   **Gatekeeping Function:** Judges act as gatekeepers precisely to prevent purely subjective or idiosyncratic moral judgments from reaching the jury, ensuring the judgment aligns with the *legal construct* of outrage.

  **Reconciliation:** The deference elsewhere involves applying specialized knowledge to established standards within bounded domains (professional ethics, defined legal thresholds). The courtroom exclusion specifically protects the *unique, sovereign role of the jury* in rendering the *final, condemnatory moral judgment of criminal culpability* as representatives of the community. It's about preserving the *source* and *character* of that specific judgment, not a blanket rejection of all moral expertise.

  ### Implications of Accepting Moral Testimony Transmission
  If courts accepted that moral knowledge about culpability could be transmitted via testimony like factual knowledge (e.g., an expert stating "This act was morally wicked and the defendant is culpable" could directly impart knowledge to jurors), courtroom practice would require radical changes:

  1.  **Admission of "Culpability Experts":** Philosophers, ethicists, or "moral psychologists" could testify explicitly about the defendant's moral blameworthiness, the adequacy of excuses, or the wickedness of the act.
  2.  **Jury Instructions Revolutionized:** Instructions would shift from directing jurors to apply their own conscience/community standards ("You must decide if this was wrong") to directing them to weigh the testimony of moral experts alongside factual experts ("Consider the testimony of Dr. Ethicist on whether the defendant's actions were morally blameworthy").
  3.  **Erosion of the Jury's Sovereign Role:** The jury's function would transform from active moral deliberators to evaluators of conflicting moral expert testimony. The "conscience of the community" aspect would diminish significantly.
  4.  **Battles of Moral Experts:** Trials would feature dueling moral experts, mirroring battles seen in psychiatric testimony. Procedural rules for qualifying "moral experts" and the scope of their testimony would need development.
  5.  **Shift in Legitimacy:** The legitimacy of the verdict would stem more from deference to credentialed moral authority and less from the participatory act of community judgment through the jury.
  6.  **Potential for Dehumanization/Absolution:** Risk of jurors outsourcing difficult moral decisions, potentially leading to diminished personal responsibility for the verdict or an over-reliance on perceived authority figures, potentially distorting nuanced moral evaluation.
  7.  **Impact on Legal Doctrine:** Concepts like *mens rea* might become more intertwined with expert moral assessments of intent and blameworthiness. Excuses like duress or provocation might rely heavily on expert moral analysis of their adequacy.

  ### Conclusion
  The courtroom exclusion of moral testimony on ultimate culpability presupposes a **moderate moral testimony pessimism combined with a strong commitment to democratic legitimacy and the sui generis nature of criminal condemnation.** It holds that *knowing* culpability in the condemnatory sense necessary for a criminal verdict requires the juror's *own active reasoning* based on the facts, guided by community conscience, and cannot be legitimately *delegated* to an expert witness. Deference in other contexts is reconciled because those judgments involve applying specialized knowledge to established standards within bounded institutional roles, not rendering the sovereign, community-based condemnation reserved for the criminal jury. Accepting the transmission of moral knowledge via testimony would fundamentally alter the jury's role, introduce "culpability experts," and shift the source of legitimacy away from communal deliberation towards deference to alleged moral authorities.
