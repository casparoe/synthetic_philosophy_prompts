prompt: |-
  I'm a third-year PhD student in social psych, and after yet another lab meeting argument about stats I've been trying to figure out what I actually believe about statistical evidence by writing down my gut verdicts on cases. The problem is I can't tell if there's a principle under them or if I'm just holding positions from different departments in my head at once. So: is there a principle that captures all of these, and if not, which verdicts have to go?

  My verdicts, as honestly as I can state them:

  1. Lab A preregisters N=200, runs it, gets p=.043. Lab B runs the exact same design, decides mid-experiment to keep going "because it's close," and ends up with the identical data and p=.043. I trust A way more. The numbers are the same, but I think B's result is basically worthless.

  2. A Bayesian monitors their posterior after every participant and stops when the Bayes factor crosses 10, ending at the same N and roughly the same conclusion. Honestly this feels fine to me, even though it's the same peeking behavior from case 1. I half remember there's some theorem about stopping rules not mattering if you only look at the likelihood, and my gut seems to agree when it's Bayesians doing the stopping.

  3. At the same time, when I talk about the replication crisis I sound like a full frequentist: preregister everything, lower alpha, more N, treat p=.043 as barely evidence at all.

  4. An ESP study with a beautiful design, preregistered, p=.001: I still don't believe it. A plausible, boring finding at p=.043 from a decent design: I basically believe it. So my priors are clearly leaking into my verdicts about "the evidence," whatever I tell myself about error rates.

  5. Someone measures six outcomes, reports the one that came out, p=.02. Obviously bad. Same six outcomes, all preregistered, Bonferroni-corrected, p=.048: fine, I think. But that means my objection in the first half isn't about the data at all, it's about the selection process, and I can't quite say why the process matters when the data are what they are.

  6. An analyst picks an exclusion rule after noticing it helps the result: bad. Picks the same rule after noticing it hurts the result: I'm still a little uneasy but much less bothered, which feels like an asymmetry I can't defend.

  7. Bayesian reanalyses of replications using fairly skeptical priors: principled, good. Using an enthusiastic prior that happens to boost your preferred conclusion: feels like cheating to me. So apparently priors are fine when skeptical and cheating when favorable, which cannot be a real principle.

  The tension I keep circling is that some of my verdicts are about the data as evidence (where the stopping-rule theorem pushes toward Bayes), some are about process and verifiability (preregistration, pre-commitment), and some are just about what's plausible anyway. A friend suggested the real distinction is between what I should believe when I read a paper versus what norms a field should enforce for publishing, i.e., that maybe I'm a Bayesian as an individual reader and a frequentist as a gatekeeper. That's clever but I'm not sure it survives case 7.

  So: give me a principle (or a small set of candidates) stated precisely enough to make predictions, tell me which of my verdicts it can't accommodate and which ones I should genuinely drop, and tell me what it says about the case I keep going back and forth on -- a meta-analysis of ten small unprenregstered studies versus one big preregistered study with the same total N, all reaching the same nominal conclusion. My gut says the preregistered one, but depending on which principle you pick I suspect it should tell me that's dumb, and I want to know if that's true before I say it out loud in lab meeting again.
reasoning: |-
  Okay, let me start by unpacking this PhD student's dilemma. They're in social psych, stuck in stats arguments, and trying to reconcile their gut reactions to different statistical scenarios. The core tension seems to be between frequentist and Bayesian principles, mixed with concerns about research integrity and prior plausibility. 

  First, I notice their verdicts cluster into three categories: evidence interpretation (cases 1-3), prior influence (case 4), and researcher degrees of freedom (cases 5-7). The friend's suggestion about "Bayesian as reader, frequentist as gatekeeper" is interesting but doesn't fully resolve case 7 where prior selection feels subjective. 

  Hmm... the stopping rule cases (1-2) are particularly telling. Their instinct aligns with Birnbaum's theorem for Bayes but not for p-values, which makes sense because p-values depend on the sampling plan while likelihoods don't. But then why do they demand preregistration elsewhere? Ah - it's about verifying that the analysis plan wasn't tampered with, not the evidence itself. 

  The ESP example (4) screams prior plausibility. A p=.001 for ESP is less convincing than p=.043 for a boring effect because extraordinary claims require extraordinary evidence - that's basic Bayesian updating. But they frame it as a frequentist in public! 

  For the multiple comparisons (5) and exclusion rules (6), the discomfort comes from potential p-hacking. The asymmetry in case 6 is fascinating: they tolerate "conservative hacking" more. That might be defensible if we view it as a form of bias correction, but it's still procedural. 

  Case 7 exposes their prior double standard. Skeptical priors feel "principled" because they demand stronger evidence, while enthusiastic priors lower the bar - but both are legitimate if stated transparently. Their unease reveals an unspoken desire for objective priors. 

  The meta-analysis question is the kicker. Gut says prefer preregistered, but Birnbaum would say identical likelihoods are equivalent evidence. The reconciliation lies in research integrity: the unregistered studies might have hidden p-hacking, file-drawering, or flexibility in analyses that undermine the nominal result. 

  So the unifying framework seems to be: 
  1. Evidence interpretation should be likelihood-based (supporting verdicts 1-2) 
  2. Research integrity requires constraining researcher degrees of freedom (supporting 1,3,5-6) 
  3. Prior plausibility must inform belief updating (supporting 4,7) 

  Under this, they should drop the asymmetry in case 6 (both forms of selection are problematic) and the prior hypocrisy in case 7 (all priors must be justified, not just skeptical ones). For the meta-analysis, the preregistered study wins on integrity grounds despite equal nominal evidence. 

  Whew. This is messy because science has to serve two masters: truth-seeking (Bayesian updating) and trust-building (frequentist safeguards). No wonder psych stats meetings get heated!
answer: |-
  Based on your verdicts, you're grappling with the tension between **likelihood principles** (evidence comes solely from the data) and **research integrity principles** (process affects credibility). Your instincts align with a **Likelihood-Verification Framework**:

  ### The Core Principle:
  **"Evidence strength is determined by the likelihood function *only when* the research process verifiably constrains researcher degrees of freedom. Otherwise, process flaws degrade evidentiary value."**

  ### Breakdown & Predictions:
  1.  **Likelihood Principle Applies Under Constraint:**  
      When procedures prevent data-dependent decisions (preregistration, blinded analysis), the likelihood *is* the evidence (Bayesian updating is valid).  
      *Predicts:* Verdicts 2 (Bayesian stopping with predefined rule = constrained) and 4b (boring finding w/good design = plausible prior) are valid.  
      *Requires dropping:* Inconsistency between 1 and 2. Verdict 2 is correct; B's p-value in 1 is invalid *because* the process wasn't constrained.

  2.  **Verification Principle for Integrity:**  
      Without constraints, flexibility (peeking, outcome switching, post-hoc exclusions) inflates false positives. Process matters for *credibility*, not the likelihood itself.  
      *Predicts:* Verdicts 1 (A > B), 3 (prereg/low α), 5 (selection invalidates p-value), 6 (post-hoc exclusion harms credibility regardless of direction), and 4a (ESP requires extraordinary verification + prior).  
      *Requires dropping:* The asymmetry in Verdict 6. Post-hoc exclusion *always* undermines credibility—even if conservative—because it demonstrates flexibility that *could* have been exploited. The "hurt the result" case is less *suspicious* but equally *invalid* as evidence for the effect.

  3.  **Prior Plausibility Modifies Interpretation:**  
      Priors must be justified *a priori* (not outcome-dependent). Extraordinary claims require stronger verification *and* stronger evidence.  
      *Predicts:* Verdict 4 (ESP vs. boring effect) is rational. Verdict 7a (skeptical prior) is good *if* justified.  
      *Requires dropping:* Hypocrisy in Verdict 7b. An "enthusiastic" prior is acceptable *if* pre-specified and scientifically justified (e.g., based on strong theory or prior meta-analysis). Rejecting it *only* because it's favorable is unsound. The issue is *justification*, not direction.

  ### Resolving Your Cases:
  *   **Case 1:** **Keep.** B's process invalidates the p-value. Likelihood evidence exists but is degraded by unverifiable flexibility.
  *   **Case 2:** **Keep.** Predefined stopping rule based on Bayes Factor is a constraint. The likelihood *is* the evidence.
  *   **Case 3:** **Keep (as norm).** Prereg/low α are verification tools to ensure likelihood evidence is interpretable.
  *   **Case 4:** **Keep.** Priors (plausibility) are essential for interpreting evidence strength (Bayesian logic). ESP requires stronger evidence + verification.
  *   **Case 5:** **Keep.** The *selection process* corrupts the p-value. Prereg+BON controls the process, making p=.048 valid.
  *   **Case 6:** **Modify/Drop asymmetry.** Post-hoc exclusion *always* damages credibility. Feeling "less bothered" if it hurts reflects reduced *suspicion of bias* but not increased *validity of evidence*. The result remains compromised.
  *   **Case 7:** **Modify.** Priors must be *justified prospectively*, not judged by direction. An unjustified skeptical prior is as problematic as an unjustified enthusiastic one. Justification is key.

  ### Your Meta-Analysis Dilemma:
  *   **Scenario:** Ten small unregistered studies (same total N, same nominal p-value) vs. One large preregistered study.
  *   **Gut Verdict (Preregistered): Correct under this framework.**
  *   **Why:** The single preregistered study verifiably constrains researcher degrees of freedom (design, analysis, stopping). Its likelihood evidence is strong and interpretable. The ten unregistered studies suffer from massive, unverifiable flexibility risks:
      *   **File Drawer Problem:** Negative studies likely missing.
      *   **p-hacking:** Flexibility in analysis/outcomes/stopping within each study.
      *   **Selection for Meta:** Only "successful" small studies may be published/found.
      *   **Heterogeneity:** Variability across studies could mask issues.
  *   **Likelihood Principle Nuance:** *If* you had the *complete, raw data* from all 10 studies *and* proof no selection/p-hacking occurred, the evidence *might* be comparable (Birnbaum). But this is impossible to verify. The *unconstrained process* makes the nominal evidence from the 10 studies untrustworthy. The preregistered study's process *is* verifiable, making its evidence superior.

  ### Summary of Required Changes:
  1.  **Embrace Stopping Rules Under Constraint:** Drop the inconsistency between 1 and 2. Verdict 2 is correct; Bayesian stopping with a predefined rule is valid evidence.
  2.  **Drop the Asymmetry in Exclusion Rules:** Post-hoc exclusion always harms credibility, regardless of whether it helped or hurt the result. Verdict 6 should be symmetric: both are bad.
  3.  **Judge Priors by Justification, Not Direction:** Drop the bias against "enthusiastic" priors in Verdict 7. Demand *prospective justification* for all priors. An unjustified skeptical prior is not more "principled."

  You are fundamentally **Bayesian in interpreting evidence** *when the process is trustworthy*, but **frequentist in demanding process safeguards** *to establish that trustworthiness*. The "Likelihood-Verification Framework" explicitly combines these: the likelihood *is* the evidence, but only *if* the verification principle (constraining flexibility) is satisfied. This resolves your tension and predicts your correct intuitions while identifying the few needing refinement. Stick with your gut on the meta-analysis – the preregistered study is more trustworthy evidence.
