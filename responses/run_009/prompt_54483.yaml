prompt: |-
  I'm the lead information designer at a state public-health agency. Nearly every week someone asks my team for a chart for a public report or a poster destined for a clinic waiting room: vaccination uptake by county, opioid deaths over a decade, smoking prevalence by age group. The charts we inherited from my predecessor are a mess of scaled-up people icons — one giant figure standing in for a million people — 3-D bars, and symbols whose size varies by whim. A few years ago I took a course in the history of design and became fascinated by Otto Neurath's ISOTYPE project, the picture statistics his Vienna team developed in the 1920s and 30s: a fixed vocabulary of pictograms, quantities shown by repeating identical symbols at a fixed unit value rather than by scaling a single figure, and strict consistency across charts, all in service of Neurath's conviction that a disciplined visual language could be read and compared by ordinary people — including across language barriers — in a way that words, which divide, cannot. His team had a rulebook; I have a folder of inconsistent charts and a communications office with opinions.

  Please turn Neurath's principles into a procedure my designers can actually run on each incoming chart request. The constraints are real: it has to be executable in the half hour between a request landing and the kickoff meeting, by junior designers with no statistics background, with sign-off from the epidemiologist who owns the data. The procedure should spell out the questions to ask, in order; what counts as a sufficient answer to each; when a pictogram series is the right tool versus a plain bar or line chart; how to set the unit value when the numbers are awkward (a county with 41% uptake versus one with 92%, say); what to do when the required repetition of symbols becomes visually unusable; and — this matters most — where the procedure must stop and hand the decision to a person, because the question is one of judgment about audience or emphasis that the principles don't settle. Mark the steps that are judgment calls dressed up as procedure.

  Then run the procedure on three cases we actually face: (1) vaccination uptake across our fifteen counties, ranging from 92% down to 41%; (2) a decade-long opioid death series with yearly counts running from 30 to 700; and (3) a request from the communications office to make our infant-mortality numbers look better than the neighboring county's by choosing a flattering baseline year. Include at least one case where the procedure yields an answer the requester won't like, and be candid about what the procedure cannot do at all — in particular, whether it can settle anything once the disagreement is political rather than perceptual.
reasoning: |-
  We are creating a step-by-step procedure based on Otto Neurath's ISOTYPE principles for designing charts. The key principles are:
   1. Use a fixed set of pictograms (icons) that are simple and consistent.
   2. Represent quantities by repeating identical symbols (each symbol represents a fixed unit value) rather than scaling a single symbol.
   3. Maintain strict consistency across charts for comparability.

   Constraints:
   - Time: 30 minutes per request.
   - Executed by junior designers without statistics background.
   - Requires sign-off from the epidemiologist who owns the data.

   The procedure should answer:
   - What questions to ask and in what order?
   - What counts as a sufficient answer?
   - When to use a pictogram series vs. a bar or line chart?
   - How to set the unit value (especially when numbers are awkward)?
   - What to do when repetition becomes visually unusable (too many symbols)?
   - Where to mark steps that are judgment calls.

   Additionally, we'll run the procedure on three cases.

   Let's design the procedure step by step.

  **Procedure: ISOTYPE Chart Design Checklist**

  *Time Budget: 30 minutes total. Keep each step concise.*

  **Step 1: Understand the Request (5 minutes)**
     - Questions to ask:
       1. What is the main message or story you want this chart to tell?
       2. Who is the audience? (e.g., general public in a clinic waiting room, policymakers in a report)
       3. What are the data points? (Get the exact numbers and their context. Ask for the data source and ensure it's from the epidemiologist.)
     - Sufficient answer: A clear, one-sentence summary of the message and a specific audience. The data must be provided in a table or list with clear labels and units.
     - Judgment call: Interpreting the "main message" might require judgment. If the requester is vague, push for clarity.

  **Step 2: Choose the Chart Type (5 minutes)**
     - Rules:
       - Use a pictogram series (ISOTYPE) when:
          - The data is discrete (counts of people, cases, etc.) and the audience is general (especially if language barriers are a concern).
          - The numbers are not too large (to avoid excessive repetition) and not too small (so that a single symbol doesn't represent too many units).
          - The comparison is between groups (like counties) or over time (if the time points are few).
       - Use a bar chart when:
          - The data is discrete but the numbers are too large for reasonable repetition of symbols, or when precision is important (because bar charts can have a scale).
          - The comparison is between categories (e.g., counties, age groups).
       - Use a line chart when:
          - The data is continuous and shows a trend over time (many time points).
          - The focus is on the pattern of change, not individual counts.
     - If the data is continuous (like rates) and not counts, then a bar or line chart is more appropriate.
     - Judgment call: Deciding when repetition becomes "excessive" (e.g., more than 50 symbols might be too many for a small poster). Also, consider the audience: for children or low-literacy audiences, pictograms are preferred.

  **Step 3: Set the Unit Value for Pictograms (5 minutes)**
     - Rule: Each symbol must represent the same unit value across the entire chart and ideally across all charts (for consistency). The unit value should be chosen so that the smallest non-zero category has at least one symbol and the largest category does not exceed a reasonable number of symbols (e.g., 20-30 symbols max per category to avoid clutter).
     - How to choose:
       1. Find the smallest non-zero value in the data.
       2. The unit value should be a round number (like 1, 5, 10, 100, etc.) that is less than or equal to the smallest value but also avoids fractions for the largest value.
       3. If the data has a very wide range (e.g., 30 to 700), consider using a bar chart instead.
     - If the data is a percentage (like vaccination uptake), convert to counts (if total population is known) or use a bar chart (if counts are not available or not meaningful). Alternatively, for percentages, you can use one symbol to represent a fixed percentage (e.g., 1 symbol = 10%), but note that this is a count of percentage points and not people. However, Neurath preferred counts of real objects. If using percentages, it must be clearly labeled.
     - Judgment call: What is a "reasonable" number of symbols? This depends on the output size and design. Also, rounding: if the unit value doesn't divide evenly, you might have to round. The rule is to round to the nearest integer. But note: rounding errors must be acceptable.

  **Step 4: Design the Pictogram (5 minutes)**
     - Use only the approved set of pictograms (maintain a library). If a new pictogram is needed, create a simple, clear, and consistent one and add it to the library for future use.
     - Each symbol must be the same size and style. No scaling or 3D effects.
     - Arrange the symbols in a grid (rows and columns) for easy counting. Aim for a rectangular shape (e.g., 5 symbols per row).

  **Step 5: Handle Awkward Numbers (5 minutes)**
     - If the numbers are too large for symbols (e.g., 700 deaths) and the unit value would be too high (making small values disappear) or too low (too many symbols), then switch to a bar chart.
     - If the data includes zeros, represent by no symbol (but label as 0).
     - For percentages without a common base (like vaccination uptake by county with different populations), consider using a unit value that represents a fixed number of people (so each county's symbol count is proportional to the vaccinated population). If the message is about the rate, then a bar chart of the rates (percentages) is better.

  **Step 6: Review for Clarity and Consistency (5 minutes)**
     - Check against the ISOTYPE rules:
        - All symbols identical and from the approved set.
        - Unit value clearly stated (e.g., "1 symbol = 100 people").
        - No distortion (like 3D, scaling of symbols).
        - Labels and title are clear and in plain language.
        - The chart is consistent with previous charts (using the same symbols and unit values for the same concepts).
     - Judgment call: Deciding if the chart is "clear". Also, consistency with previous charts might require trade-offs (e.g., if a previous chart used a unit value that doesn't work here, you might have to break consistency and note the reason).

  **Step 7: Escalate Judgment Calls (As Needed)**
     - If at any step the designer is unsure (e.g., the main message is ambiguous, the chart type is contentious, the numbers are too awkward, or there's a request to manipulate the presentation), escalate to the lead designer (you) or the epidemiologist for data integrity.
     - In particular, if the request is to make data "look better" (like case 3), this is a red flag. The procedure cannot resolve political or ethical disagreements. The rule is: never distort the data. Escalate to the lead and the epidemiologist.

  **What the Procedure Cannot Do:**
     - Resolve disagreements that are about emphasis or politics (e.g., making data look better or worse). The procedure is about clear and honest representation. If the requester wants to change the baseline to manipulate perception, that is outside the scope of the procedure and must be handled by the lead and the epidemiologist.
     - Override data integrity. The epidemiologist must sign off on the data and its representation.

  ---

  **Running the Procedure on the Three Cases**

  **Case 1: Vaccination uptake across fifteen counties (92% down to 41%)**

  Step 1: 
     - Message: Show how vaccination rates vary by county.
     - Audience: General public in clinic waiting rooms.
     - Data: 15 percentages (from 41% to 92%).

  Step 2: 
     - Chart type: Since the data is percentages (not counts) and we have 15 categories, a pictogram series might be challenging because we don't have a common base (each county has a different population). Also, 15 categories would require 15 separate pictogram groups. 
     - However, if we want to use ISOTYPE, we might consider representing the percentage as a part of a fixed whole (e.g., 10 symbols total per county, and then color or fill the number that represents the percentage). But note: Neurath preferred counts. Alternatively, we can use a bar chart for percentages.
     - Given the range (41% to 92%) and the number of counties (15), a bar chart is more efficient and precise. 
     - Decision: Use a bar chart. (Pictogram series not ideal because: (a) percentages are not counts, (b) 15 groups would be too many for a grid of symbols, and (c) the variation is better shown by bar lengths.)

  Step 3: (If we were to force pictograms) 
     - We could fix a base of 100 people per county? But population sizes vary. Alternatively, one symbol = 10%? Then 92% would be 9.2 symbols -> rounded to 9. But then we are representing percentage points, not people. And 41% would be 4.1 -> 4. The rounding would lose precision. Also, 10 symbols per county would be 150 symbols total, which is acceptable? But note: the populations are different, so the absolute number of vaccinated people is not shown. 
     - Given the above, we decide against pictograms and use a bar chart.

  Step 4: (Not applicable)

  Step 5: Awkward numbers? The percentages are not whole numbers but we can show them as bars with a scale from 0% to 100%.

  Step 6: Bar chart with clear scale. Consistent with other bar charts we've done.

  Step 7: No escalation needed.

  **Result for Case 1:** Use a bar chart. The procedure overrules a pictogram because of the nature of the data (percentages without a common base) and the number of categories.

  **Case 2: Opioid deaths over a decade (yearly counts from 30 to 700)**

  Step 1:
     - Message: Show the trend in opioid deaths over ten years.
     - Audience: Public report (might be for policymakers).
     - Data: 10 data points (one per year), counts from 30 to 700.

  Step 2:
     - Chart type: The data is a time series with 10 points. The focus is on the trend. Pictogram series could be used if we want to show the counts as symbols, but 700 is a large number. Also, a line chart is typically better for trends over time.
     - Option 1: Pictogram series for each year? But 700 symbols is too many (even if we use 1 symbol = 10 deaths, that's 70 symbols for the highest year). That would be visually unusable in a standard report.
     - Option 2: Bar chart? Possible, but for a time series, a line chart is more common and effective for showing trends.
     - Decision: Use a line chart.

  Step 3: (If we tried pictograms) 
     - Unit value: The smallest non-zero is 30. We could set 1 symbol = 10 deaths. Then the first year: 3 symbols, the last year: 70 symbols. 70 symbols is too many for a single year in a chart that must fit on a page. If we set 1 symbol = 50 deaths, then 30 becomes 0.6 -> round to 1? That would overrepresent the small years. 700 would be 14 symbols, which is acceptable. But then the rounding for 30: 30/50=0.6 -> 1 symbol, which is 50, so we are overstating by 20 deaths. That's a 66% error. Not acceptable.
     - Therefore, pictograms are not suitable.

  Step 4: (Not applicable)

  Step 5: The range is too wide for pictograms without significant rounding error or too many symbols.

  Step 6: Line chart with a clear Y-axis (starting at 0) and labeled points.

  Step 7: No escalation.

  **Result for Case 2:** Use a line chart.

  **Case 3: Infant-mortality numbers to look better than the neighboring county by choosing a flattering baseline year.**

  Step 1:
     - Message: Compare our infant mortality rate to the neighboring county's.
     - Audience: Public report (but the requester wants to present the data in a way that flatters our county).
     - Data: Infant mortality rates for both counties over several years.

  Step 2:
     - Chart type: Typically, a line chart for trends or a bar chart for a specific year comparison.

  Step 3: 
     - The request to choose a baseline year to make our numbers look better is a red flag. The procedure requires honest representation. We must show the data in a way that allows fair comparison.

  Step 4 to 6: 
     - The designer should note that the request violates the principle of data integrity.

  Step 7: Escalate immediately. The procedure cannot resolve this because it is a political/ethical issue. The lead and the epidemiologist must be involved. The rule is: always show the most recent data and/or the full trend. If comparing a specific year, it must be justified (e.g., the most recent year). If the requester insists on a particular baseline without justification, refuse and explain the importance of honest representation.

  **Result for Case 3:** The procedure flags the request as unethical and escalates. The designer does not proceed without approval from the lead and the epidemiologist. The answer is not what the requester wants.

  ---

  **Summary of the Procedure's Limitations:**
     - It cannot resolve political or ethical disagreements. When the issue is about emphasis (e.g., choosing a baseline to manipulate perception), the procedure will flag it and require escalation.
     - It cannot force the requester to accept the chart type if they have a preconceived idea (like wanting pictograms when they are not appropriate). In that case, the lead must mediate.
     - It relies on the availability of the epidemiologist for data sign-off.

  The procedure provides a structured way to apply Neurath's principles but must be backed by the authority of the lead and the epidemiologist for data integrity and ethical representation.
answer: |-
  ### ISOTYPE-Inspired Chart Design Procedure for Public Health Visuals  
  Based on Otto Neurath’s principles (fixed pictograms, repeated units, strict consistency), here’s a step-by-step procedure for your team. It fits within **30 minutes**, leverages junior designers’ skills, and requires epidemiologist sign-off. Judgment calls are marked with **(⚖️)**.  

  ---

  #### **Procedure: ISOTYPE Chart Design Checklist**  
  **Time Budget:** 5 min/step. Use a templated form to capture answers.  

  1. **Clarify the Core Message (5 min)**  
     - **Questions:**  
       - "What is the single comparison or trend the audience must understand?"  
       - "Who is the primary audience? (e.g., clinic visitors, policymakers, non-English speakers?)"  
     - **Sufficient Answer:** 1–2 sentences (e.g., "Show that rural counties have lower vaccination rates").  
     - **⚖️ Judgment:** If the request is vague (e.g., "make it impactful"), push for specificity.  
     - **Output:** Approved message + audience.  

  2. **Assess Data Type (5 min)**  
     - **Questions:**  
       - "Is this data about **counts of people/things** (e.g., 1,000 vaccinated) or **abstract measures** (e.g., 41%, 5.2 deaths/1,000)?"  
       - "Are comparisons across **categories** (counties), **time** (years), or **groups** (age bands)?"  
     - **Chart Type Rules:**  
       - **Pictogram series (ISOTYPE):** ONLY for **counts of tangible things** (people, doses, deaths) with ≤25 units per category/time point.  
       - **Bar chart:** For abstract measures (%, rates) OR counts >25 units OR precise comparisons (e.g., 41% vs. 92%).  
       - **Line chart:** For trends over time with ≥5 data points.  
     - **Output:** Chart type recommendation.  

  3. **Set the Unit Value (5 min)**  
     - **Rules:**  
       - Each symbol = a fixed, round unit (e.g., 1 symbol = 50 people).  
       - **Unit must divide the smallest non-zero value evenly** (e.g., smallest value 30 → unit 5, 10, or 30).  
       - For percentages: Convert to counts if possible (e.g., "1 symbol = 10% of the population" → but avoid; use bars instead).  
     - **Awkward Numbers Workaround:**  
       - If values vary wildly (e.g., 41 and 92), **use bars**. Pictograms require comparable magnitudes.  
       - If unit value causes fractions (e.g., 41% with 1 symbol=10% → 4.1 symbols), round to whole symbols and add a footnote: "Symbols rounded to nearest whole unit."  
     - **⚖️ Judgment:** If rounding distorts the message (>10% error), veto pictograms.  

  4. **Pictogram Viability Check (5 min)**  
     - **Questions:**  
       - "Does the largest value require >25 symbols?" If yes, use bars/lines.  
       - "Is there an approved pictogram in our library?" (Maintain a locked folder of 20 simple icons: 👤 for people, ⚕️ for clinics, etc.)  
     - **Symbol Overload Fixes:**  
       - Cluster symbols in grids (e.g., 10 per row).  
       - If still impractical, switch to bars.  
     - **Output:** Final chart type + unit value or bar/line spec.  

  5. **Consistency & Ethics Review (5 min)**  
     - **Check:**  
       - Use the same pictogram for the same concept across all charts (e.g., 👤 always = people).  
       - Axis/scales: Always start at 0 for bars/pictograms.  
       - Flag requests that manipulate perception (e.g., "make our data look better").  
     - **⚖️ Judgment:** If a request violates integrity (e.g., cherry-picking baselines), halt and escalate.  
     - **Output:** Draft chart + notes for epidemiologist sign-off.  

  6. **Epidemiologist Sign-Off (5 min)**  
     - **Submit:** Draft + procedure log.  
     - **Non-Negotiables:** Data accuracy, 0 baseline, unit-value justification.  

  **Where the Procedure Stops:**  
  - Political/ethical disputes (e.g., "make our numbers look better").  
  - Audience emphasis (e.g., "highlight our success, downplay losses") – this requires leadership intervention.  
  - Major inconsistencies (e.g., new pictogram needed) – requires your approval.  

  ---

  ### **Procedure Applied to Your Cases**  
  **Case 1: Vaccination Uptake Across 15 Counties (92% to 41%)**  
  - **Step 1:** Message = "Show county disparities in uptake." Audience = Clinic visitors (multi-language).  
  - **Step 2:** Data = Abstract (%). **→ Use bar chart** (ISOTYPE unsuitable for % without counts).  
  - **Step 3:** Unit value = N/A (bars show % directly).  
  - **Step 4:** Pictograms = No (values range from 41–92%; symbols would require rounding, causing distortion).  
  - **Step 5:** Consistency = Bar chart with 0–100% scale. No ethical issues.  
  - **Result:** Horizontal bar chart. *Requester may dislike this (no icons), but procedure overrules.*  

  **Case 2: Opioid Deaths Over a Decade (30 to 700)**  
  - **Step 1:** Message = "Show rapid increase in deaths." Audience = Public report readers.  
  - **Step 2:** Data = Counts, but 700 is too high for symbols. **→ Use line chart** (trends >5 time points).  
  - **Step 3:** Unit value = If forced: 1 symbol = 50 deaths → 30 deaths = 0.6 symbols (unviable).  
  - **Step 4:** Pictogram rejection = 700 deaths needs 14 symbols (if 1=50), but 14 is acceptable; however, 0.6 symbols for 30 deaths breaks rounding rules. **→ Bars/lines only.**  
  - **Result:** Line chart with annotations for key years.  

  **Case 3: Infant Mortality Rates vs. Neighboring County (Flattering Baseline Request)**  
  - **Step 1:** Message = "Compare our infant mortality to County X." Audience = Public report.  
  - **Step 2:** Data = Rates → **Use bar/line chart** (ISOTYPE unsuitable for rates).  
  - **Step 5:** **ETHICAL RED FLAG.** "Flattering baseline" violates integrity.  
    - **Procedure Halt:** Escalate immediately.  
    - **Candid Limitation:** The procedure **cannot resolve political disagreements**. It flags manipulation but can’t force compliance. Solution: Offer a neutral approach (e.g., 5-year trend for both counties). If refused, leadership must intervene.  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Resolve political/ethical conflicts** (e.g., "make our data look better"). It flags them for human intervention.  
  2. **Override audience-specific judgment** (e.g., "emphasize positives"). Designers must escalate.  
  3. **Fix bad data.** Epidemiologist sign-off is mandatory.  
  4. **Force requester acceptance.** If they demand 3D bars against procedure, your authority backs the designer.  

  **Key Strength:** Turns Neurath’s principles into a checklist that standardizes decisions, minimizes subjectivity, and ensures consistency. Junior designers can execute it, but your role is critical for judgment calls and ethical enforcement.  

  **Template Tools:**  
  - A "Procedure Log" form (Google Form/printable) with the 6 steps.  
  - An approved pictogram library (PDF with 20 icons, no deviations allowed).  
  - A bar/line chart template (PPT/Illustrator) for quick pivots when ISOTYPE fails.  

  This balances efficiency with integrity – keeping Neurath’s vision alive without sacrificing rigor.
