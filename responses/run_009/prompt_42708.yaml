prompt: |-
  I've got a friend who has pretty firm views about when it's OK to let other people do your moral thinking for you, and I've started keeping a record because I think her views are less consistant than she'd admit. Here's her track record so far:

  - When she couldn't decide whether to break up with her boyfriend, she asked her mum, who knows them both well, and just did what her mum said (leave him). She thinks that was completely fine, and says she felt no need to reason it through herself first.
  - Her old philosophy tutor once told her that the thing that makes sex permissible is consent, full stop. She refused to take that on authority — she spent most of a term working out whether she agreed, and says outsourcing it would have been wrong, tutor or no tutor.
  - She won't let Amnesty International, or any organisation, tell her whether a specific execution going ahead in another country next year is wrong. Her line is that some things you have to settle for yourself, whoever's saying it.
  - Her book club (half a dozen people who aren't exactly intimates, but they know her and her office) voted on whether she should report a colleague for padding his expenses claims, and she went with the majority — reported him — and thinks that was fine too.

  Next week she's having lunch with a famous moral philosopher who's visiting her university. She's never met him before and he knows nothing about her, but she's been going back and forth for months about whether she personally ought to give a tenth of her salary to effective charities, and she's told me that if he says straight out "yes, you should give it," she might just settle it on his word and be done with the whole agonising.

  So: what's she going to do — take his word, or refuse? I'm less interested in the answer than in the rule she seems to be running. Spell out the candidate rules that fit her record so far (I can see at least two), what each one predicts about the lunch, your best guess and why, and then give me the further case that would best prise the rules apart — one where they give different verdicts, so we could actually find out which rule is really hers. And could you write your answer in British English please (organise, realise, that sort of thing)?
reasoning: |-
  Hmm, this user has presented quite an interesting ethical puzzle about their friend's inconsistent moral outsourcing behaviour. The friend seems to arbitrarily decide when to accept others' moral judgments versus when to insist on personal deliberation. 

  Let me analyse the patterns in her four documented cases. In the boyfriend situation, she blindly followed her mother's advice without personal reflection. With the book club vote about reporting a colleague, she accepted the majority decision. Yet she rejected her philosophy tutor's authority on consent ethics and refuses to let Amnesty International dictate her stance on executions. Now she's considering taking a stranger philosopher's word on charitable giving.

  The key tension appears to be between two potential rules: one based on relational intimacy (she outsources to close/knowledgeable relationships like mum and book club) versus one based on moral gravity (she insists on personal judgment for high-stakes issues like sexual ethics and executions). The charity dilemma sits awkwardly between both - neither intimate nor clearly high-stakes.

  For the upcoming philosopher lunch prediction, I'm leaning towards her accepting his advice. The charity question seems more akin to the boyfriend scenario - a personal dilemma causing her distress that she'd happily offload. It lacks the life-or-death weight she attributes to consent or execution ethics. 

  To truly test these competing rules, the user should present her with a low-intimacy but high-stakes scenario. Perhaps a distant expert advising on something like euthanasia for a family member. That would force her to choose between the intimacy principle (reject) and gravity principle (accept).

  The user seems genuinely curious about ethical consistency rather than just wanting to prove their friend wrong. They've done proper fieldwork by documenting cases. I'll structure the response to validate their observational skills while providing clear analytical tools. British English is easily handled - I'll mind my 'organises' and 'realises' throughout.
answer: |-
  Based on your detailed record, your friend's behaviour reveals an intriguing inconsistency in her principles for moral outsourcing. Let's organise the candidate rules, predict her action with the philosopher, and design a diagnostic case.

  **Candidate Rules Fitting Her Record:**

  1.  **The Intimacy/Know-You-Well Rule:**
      *   **Justification:** She outsourced the boyfriend decision to her mother (who knows them both well) and the colleague-reporting decision to her book club (who know her and her office context). She *refused* to outsource to her philosophy tutor (a formal authority figure, likely less intimate) and to Amnesty (distant, impersonal organisation). The philosopher is a stranger.
      *   **Core Principle:** It's permissible to outsource moral thinking when the advice comes from individuals or groups who have significant personal knowledge of *you* and/or the *specific situation* involved. Impersonal authority figures or generic organisations don't qualify.
      *   **Prediction for Lunch:** **Refuse.** The famous philosopher knows nothing about her personally or her specific financial/life situation. He's an impersonal authority figure, akin to the tutor or Amnesty.

  2.  **The Stakes/Self-Integrity Rule:**
      *   **Justification:** She refused to outsource judgments on foundational ethical principles (consent) and grave matters involving life/death and justice (executions). These are seen as core to her ethical identity and involve high stakes. The boyfriend and colleague issues, while personally significant, were framed more as complex *practical* relationship/professional dilemmas causing her indecision, rather than foundational *moral* truths. The charity question likely feels like a high-stakes *personal commitment* issue involving significant sacrifice and core values.
      *   **Core Principle:** It's permissible to outsource moral thinking for complex, personally taxing *practical dilemmas* causing indecision, *especially when the advice source is trusted within the relevant context*. It is *impermissible* to outsource judgments on foundational moral principles or matters of grave consequence (life/death, justice); these require personal conviction to maintain self-integrity.
      *   **Prediction for Lunch:** **Refuse.** Deciding to give away 10% of her salary is a significant personal commitment involving her core values, resources, and life choices – arguably high-stakes for *her* integrity and future. It feels closer to the "grave matter" category like executions than the practical dilemmas of relationships or office politics.

  3.  **The Agony/Avoidance Rule (Less Strong):**
      *   **Justification:** She explicitly mentions being tired of "agonising" over the charity question and wants to "be done with it". The boyfriend decision also caused indecision. The consent and execution issues were intellectual/moral explorations, not necessarily described as causing her personal anguish *at the time of decision*.
      *   **Core Principle:** It's permissible to outsource moral thinking primarily to relieve personal distress and indecision, regardless of the source or the stakes, *if* the source seems vaguely credible in the moment.
      *   **Prediction for Lunch:** **Take his word.** She's explicitly stated she might do this to end the agony. The philosopher has surface credibility.

  **Best Guess & Why:**

  *   **Prediction:** She will **likely refuse to simply take the philosopher's word** and settle the charity question based solely on his authority.
  *   **Reasoning:**
      *   The **Stakes/Self-Integrity Rule** provides the most consistent explanation across *all four* prior cases. It cleanly distinguishes the "outsourced" cases (practical dilemmas causing indecision) from the "non-outsourced" cases (foundational principles/grave matters). The charity question, involving significant personal sacrifice and tying into her values about global justice and personal responsibility, clearly falls into the high-stakes "self-integrity" category for her, akin to the execution question. The *source* (famous philosopher) is less relevant here than the *nature* of the decision.
      *   While the Agony/Avoidance Rule might tempt her, her prior refusals (especially rejecting her tutor on consent) show she prioritises conviction over convenience on matters she deems important. The Intimacy Rule is partially explanatory but fails on the book club (less intimate than a tutor? arguably) and struggles with the charity case – the philosopher lacks intimacy, but the *stakes* seem the dominant factor.
      *   Her comment about *possibly* taking his word sounds more like a fleeting expression of frustration with the ongoing internal debate ("might just settle it") rather than a firm principle overriding her established pattern on significant personal commitments.

  **The Diagnostic Case to Prise the Rules Apart:**

  We need a scenario where the **Intimacy Rule** and the **Stakes/Self-Integrity Rule** give *opposite* predictions.

  *   **The Case:** Your friend is facing a **deeply distressing, high-stakes personal medical decision** for a close, terminally ill family member (e.g., whether to consent to the withdrawal of life support according to their living will, amidst conflicting feelings of guilt and duty). A **world-renowned medical ethicist, whom she's never met but deeply respects**, offers a clear, direct recommendation after a brief, factual briefing: "Based purely on the ethical principles of autonomy and beneficence in this situation, you should honour the living will and consent."
  *   **Why it Diagnoses:**
      *   **Intimacy Rule Predicts REFUSAL:** The ethicist is an impersonal authority figure, a stranger with no intimate knowledge of her or the complex family dynamics. She should reason it through herself.
      *   **Stakes/Self-Integrity Rule Predicts ACCEPTANCE:** This is a classic, agonising *practical dilemma* with immense emotional weight, causing significant distress and indecision. While the stakes are high, they involve *applying* principles (autonomy, beneficence) to a complex personal situation, not defining the principles themselves. It mirrors the "indecision relief" pattern of the boyfriend and colleague cases, but with much higher emotional stakes. She might readily outsource to relieve the agony and because the source is a highly credible expert on *this type* of dilemma.
  *   **Outcome:** If she takes the ethicist's word, the **Stakes/Self-Integrity Rule** (specifically the "practical dilemma causing indecision" aspect) is likely dominant. If she refuses and insists on working it out herself despite the agony, the **Intimacy Rule** (or a stronger interpretation of the high stakes requiring personal conviction) is likely dominant.

  This case isolates the key tension between the *source* of advice (intimate vs. impersonal expert) and the *nature* of the dilemma (practical/indecision-inducing vs. foundational/grave), forcing a choice between the two most plausible rules derived from her track record.
