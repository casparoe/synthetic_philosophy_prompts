answer: |-
  ### Translation of Endurantism vs. Perdurantism into Event-Sourcing Vocabulary

  #### 1. **Endurantism**  
  - **Core claim**: The entity is wholly present at every moment, with a stable identity across time. Change involves the same entity gaining/losing properties relativized to time.  
  - **Your vocabulary**:  
    - **Mapping**: The "current state + mutable entity with a stable primary key" model. The entity ID is the stable identity, and the current state (a fold over the event stream) represents the entity as "wholly present now."  
    - **Relativized properties**: Directly analogous to **as-of queries**. When an endurantist says "the entity is messy-at-t," this is identical to your `get_state_at(t)` operation, which replays the stream up to `t` to compute properties relativized to that moment.  
    - **Distortion?** Minimal. The ID ensures identity stability, and as-of queries handle property relativization cleanly. However, endurantism traditionally implies the entity is *fundamentally* its current state (not defined by history), while your "current state" is derived from the log—a minor tension.  

  #### 2. **Perdurantism**  
  - **Core claim**: The entity is a four-dimensional "worm" composed of temporal parts (stages). What exists "now" is a single temporal slice.  
  - **Your vocabulary**:  
    - **Mapping**: The **event log itself** is the perduring entity. Each **temporal part** is either:  
      - A **snapshot** (materialized state at time `t`), or  
      - The result of an **as-of query** (state reconstructed at `t`).  
    - The full event log is the "worm," and snapshots/as-of queries are temporal slices.  
    - **Distortion?** The event log is the source of truth, making perdurantism more natural. However, philosophers conceive temporal parts as *concrete existents*, while your snapshots are ephemeral projections. This is a soft fudge: snapshots are cached derivatives, not ontological primitives.  

  #### 3. **Argument from Temporary Intrinsics**  
  - **Problem**: How can entity `X` be both `P` (at `t1`) and `¬P` (at `t2`) without contradiction?  
  - **Endurantist resolution**: `X` is `P-at-t1` and `¬P-at-t2` (relativized properties).  
