  The positions we are trying to distinguish are:

  a) Phenomenal-consciousness gate: Only sufficiently rich simulations (with phenomenal consciousness) matter.
  b) Substrate-independent functionalist view: The right kind of simulation (functional equivalence) makes it a moral patient now.
  c) Player-character corrosion: No NPC is a patient, but cruelty harms the player's own character.
  d) Third-party wrongs: Wrongs are to spectators, the player's future behavior, or groups caricatured, never to the characters.
  e) Expressivist/fictionalist: Harming a character is an ugly act (like desecrating a symbol) but wrongs no patient.
  f) Deflationary: Nothing done in a game is wrong in itself.

  We need to design questions that force differentiation among these views. We also need to note any pairs of views that our quiz cannot separate and any answer patterns that don't map to a position.

  Let's break down the initial cases and see how they map to the positions:

  (i) Fantasy RPG: NPCs beg for their lives when threatened, and a friend plays to trigger this for amusement.

  Possible options:
  A. This behavior is morally unproblematic.
  B. This behavior is problematic because it treats the NPCs cruelly.
  C. This behavior is problematic for reasons other than cruelty to NPCs (e.g., desensitization).

  (ii) Sandbox life-sim: Streamer walls a character in until it dies, narrating for an audience.

  Options:
  A. This is acceptable; it's just a game.
  B. This is problematic because of the cruelty to the NPC.
  C. This is problematic because of the effect on the audience or the streamer.

  (iii) Hypothetical future game: NPCs behaviorally indistinguishable from humans and insist they suffer.

  Options:
  A. We have a moral obligation not to cause them suffering.
  B. We do not have a moral obligation; they are just simulations.

  (iv) Same as (iii) but with documentation that they are a simple lookup table.

  Options:
  A. The documentation changes nothing; if they seem to suffer, we should avoid causing it.
  B. The documentation matters; without real complexity, there's no moral obligation.

  (v) Historical wargame: Enemy civilians modeled on a real ethnic group.

  Options:
  A. Harming them is problematic because it caricatures and offends the real group.
  B. Harming them is problematic because it harms the NPCs themselves.
  C. There is no moral problem.

  (vi) Deleting a save file or quitting mid-conversation.

