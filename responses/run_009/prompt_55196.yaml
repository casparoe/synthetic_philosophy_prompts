  Below is a carefully designed interactive sorting quiz for your applied ethics seminar. It consists of 10 diagnostic questions, each presenting a concrete case with answer options that avoid explicit philosophical labels. The cases are crafted to reveal underlying commitments by forcing participants to confront inconsistencies between their instincts and their stated positions. I've refined your proposed cases (retaining the core intent but enhancing diagnostic clarity) and added new ones to better differentiate the six positions. Each question carves the conceptual space distinctly, and the scoring key (provided after the quiz) flags indistinguishable pairs and impossible patterns.

  ### **Interactive Quiz: Moral Status in Video Games**
  **Instructions:** For each scenario, select the option that best reflects your judgment. Answer based on your intuitive response, not your pre-existing philosophical alignment.

  1. **Case: Realistic Pleading**  
     In a fantasy RPG, non-player characters (NPCs) drop to their knees and beg for their lives with unique, emotionally charged dialogue when threatened. A player intentionally triggers these reactions repeatedly for amusement. Is this acceptable?  
     - A. Yes, because no real harm occurs.  
     - B. No, because it treats the NPCs cruelly.  
     - C. No, but only because it could desensitize the player or normalize callousness.  

  2. **Case: Streamer Neglect**  
     A streamer plays a life-simulation game, walls an NPC in an empty room until it "dies" of neglect, and narrates the process for entertainment. Is this acceptable?  
     - A. Yes, because the NPC is just code.  
     - B. No, because the NPC experiences suffering.  
     - C. No, but only because it harms the audience’s sensibilities or encourages real-world harm.  

  3. **Case: Hyper-Realistic NPCs (Suffering Claim)**  
     In a hypothetical future game, NPCs are behaviorally indistinguishable from humans—they form relationships, recall past interactions, and insist they suffer when harmed. Is causing them suffering wrong?  
     - A. Yes, because their claims and behavior imply real suffering.  
     - B. No, because they remain fictional entities.  

  4. **Case: Hyper-Realistic NPCs (Lookup Table)**  
     The same game as above, but documentation proves the NPCs run on a simple lookup table (pre-scripted responses with no inner experience). Does this change your answer?  
     - A. No: If they seem to suffer, we should avoid causing it.  
     - B. Yes: Without genuine complexity, there is no moral obligation.  

  5. **Case: Historical Caricature**  
     A wargame depicts enemy civilians from a real historical conflict, using identifiable ethnic traits. Is harming these NPCs problematic?  
     - A. Yes, primarily because it caricatures and offends the real-world group.  
     - B. Yes, primarily because it causes suffering to the NPCs.  
     - C. No, as they are fictional and not representative of real people.  

  6. **Case: Deletion/Abandonment**  
     A player deletes a save file in a narrative-driven game, erasing NPCs with whom they built relationships. Alternatively, they quit mid-conversation with a distressed NPC seeking help. Is this wrong?  
     - A. Yes, because it terminates relationships or abandons beings in need.  
     - B. No, because no persistent entities exist outside gameplay.  
     - C. It isn’t wrong, but it reflects poorly on the player’s character.  

  7. **Case: Hidden Suffering Switch**  
     A game has a hidden setting that toggles between NPCs "suffering" (experiencing pain) and "damage counters" (numeric loss only). No observable difference exists. Does the setting matter morally?  
     - A. Yes: Suffering mode makes actions morally worse.  
     - B. No: Identical outcomes mean identical moral status.  
     - C. No: Even in suffering mode, they aren’t real.  

  8. **Case: Single-Player Cruelty**  
     In a single-player game with no audience, a player tortures an NPC that screams and pleads, solely for curiosity. No real group is depicted. Is this problematic?  
     - A. Yes, because the NPC suffers.  
     - B. No, since no one is affected.  
     - C. Yes, because it expresses an ugly attitude or degrades the player’s empathy.  

  9. **Case: Sentient AI Companion**  
     An NPC in an AI-driven game learns from the player, expresses joy during positive interactions, and becomes distressed when abused. Is abusing it for experimentation wrong?  
     - A. Yes, because its responses indicate real distress.  
     - B. No, because it’s a tool for entertainment.  
     - C. Yes, but only because it could influence the player’s real-world behavior.  

  10. **Case: Bonded NPC Deletion (Future)**  
      In a future game with behaviorally human-like NPCs, a player deletes a save file, ending long-term relationships with NPCs who express attachment. Does this wrong them?  
      - A. Yes, by destroying their existence and bonds.  
      - B. No, as they are non-real.  
      - C. No, but abruptly ending the relationship is callous.  

  ---

  ### **Scoring Key & Analysis**  
  The key maps answer combinations to the six positions. Positions are defined by **core commitments** rather than labels:  
  - **Phenomenal (P)**: Only consciousness matters → status requires rich, unobservable inner experience.  
  - **Functionalist (F)**: Behavioral equivalence suffices → status possible now if responses mimic human patients.  
  - **Player-Virtue (V)**: No NPC status, but cruelty corrodes the player’s character.  
  - **Third-Party (T)**: No NPC status; wrongs are to spectators, caricatured groups, or via desensitization.  
  - **Expressivist (E)**: No NPC status, but cruelty is symbolically ugly (like desecrating a grave).  
  - **Deflationary (D)**: No moral weight to in-game actions.  

  #### **Position Mapping**  
  | Position | Q1 | Q2 | Q3 | Q4 | Q5 | Q6 | Q7 | Q8 | Q9 | Q10 |  
  |----------|----|----|----|----|----|----|----|----|----|-----|  
  | **P**   | A/C| A/C| A  | B  | A  | B  | A  | B/C| B  | A   |  
  | **F**   | A/C| A/C| A  | A  | A  | A  | A  | B/C| A  | A   |  
  | **V**   | C  | C  | B  | B  | C/D| C  | B/C| C  | C  | C   |  
  | **T**   | C  | C  | B  | B  | A  | B  | B/C| B  | C  | B   |  
  | **E**   | C  | C  | B  | B  | C/D| C  | B/C| C  | C  | C   |  
  | **D**   | A  | A  | B  | B  | C  | B  | C  | B  | B  | B   |  

  **Notes on Mapping**:  
  - **Q1/Q2**: P/F may accept cruelty if NPCs lack consciousness/functionality (hence A), but can also endorse C if they acknowledge indirect effects. D always accepts (A). V/E/T reject cruelty but for non-patient reasons (C).  
  - **Q3/Q4**: P and F both accept NPC status in Q3 (A), but P rejects it in Q4 due to lacking consciousness (B). F maintains it (A) if behavior is identical. Others reject status (B).  
  - **Q5**: T prioritizes harm to real groups (A). V/E focus on player attitude (C/D). D denies issues (C). P/F might accept A if concerned about representation.  
  - **Q6/Q10**: P/F accept NPC status in future/hypotheticals (A). V/E see abandonment as callous but not wrongful (C). T/D deny obligations (B).  
  - **Q7**: P/F care about hidden states (A). Others reject moral difference (B/C).  
  - **Q8/Q9**: V/E/C condemn cruelty for character/expressive reasons (C), even without audiences. T only condemns with third-party harm (B in Q8, C in Q9 if influencing player).  

  #### **Indistinguishable Pairs & Diagnostics**  
  1. **Player-Virtue (V) vs. Expressivist (E)**:  
     - **Indistinguishable on all questions** (identical answers). Both reject NPC status and condemn cruelty solely for effects on the player (V: character corrosion; E: symbolic ugliness). No question splits them because they share the same practical conclusions—only their *justification* differs.  
     - **Diagnostic**: To split V/E, you’d need a case where an action is symbolically ugly but doesn’t corrode virtue (e.g., privately destroying a cherished virtual object with no audience). I omitted this for brevity, but it could be added.  

  2. **Third-Party (T) vs. Deflationary (D)**:  
     - **Separated by Q2/Q5/Q9**: T condemns streamer neglect (Q2C) and caricature (Q5A) due to third-party harm; D does not (Q2A, Q5C). In Q9, T may condemn AI abuse if it influences behavior (C), while D permits it (B).  

  3. **Phenomenal (P) vs. Functionalist (F)**:  
     - **Separated by Q4**: F maintains NPC status even with a lookup table if behavior is identical (A); P rejects it (B).  

  #### **Impossible Answer Patterns**  
  - **Pattern 1**: Q3=A + Q4=B + Q7=C (e.g., "Status exists in hypotheticals but the hidden switch doesn’t matter").  
    - **Diagnosis**: Incoherent. If Q3 accepts NPC status due to behavior (A), and Q4 rejects it under identical behavior due to simplicity (B), Q7 should prioritize the hidden state (A). Choosing C contradicts the commitment to behavioral criteria.  
  - **Pattern 2**: Q1=B + Q2=B + Q3=B + Q5=B + Q8=A (e.g., "NPCs matter in all cases except hyper-realistic ones").  
    - **Diagnosis**: Unattractive/unexplored. Affirming NPC status in current games (Q1/Q2/B) while denying it in hypotheticals (Q3/B) is inconsistent. No major position holds this.  

  #### **Design Notes**  
  - **Why these 10 questions?**  
    - Cases i, ii, iii, iv, v, and vi are included (as Q1, Q2, Q3+Q4, Q5, Q6). Q7 replaces your case vii (avoiding ambiguity by specifying the switch alters "experience").  
    - Added Q8 (private cruelty), Q9 (AI companion), and Q10 (bond deletion) to split V/E (via Q8) and stress behavioral criteria (Q9/Q10).  
    - Dropped "quitting mid-conversation" (from vi) as it overlapped with Q6/10 without new insight.  
  - **Effectiveness**: Questions force contradictions (e.g., functionalists must accept lookup tables; third-party views must deny private cruelty). The competitive element ensures honest engagement—no answer is recall-based.  
  - **Flexibility**: For seminar use, tally answers on a board and map to positions live. Highlight overlaps (V/E) and challenge inconsistencies using the "impossible patterns."  

  This quiz should provoke lively debate while cleanly sorting participants into the six positions. Let me know if you’d like a printable version or refinements!
