prompt: |-
  My flatmate and I have been arguing about the centipede game and I want your credence to help locate our disagreement. The claim: in a long centipede game (take/pass, payoffs increasing, each taking beats what the other would get one node earlier), common knowledge of rationality entails the backward-induction outcome — take at the very first node. My credence is about 0.5, hers is about 0.15, and neither of us trusts the other's decomposition. Give me your own number, but mainly decompose it: (a) whether Aumann's formal setup — rationality meaning you choose optimally at every node of your strategy, including nodes that reaching would already contradict common knowledge of rationality — is the right reading of "rational" or quietly bakes in the conclusion; (b) whether the old worry that common knowledge of rationality is simply inconsistent with anyone ever taking along the backward-induction path is a genuine contradiction or just a sign you should weaken to common belief, or restrict what's assumed at off-path nodes; (c) whether the whole dispute is verbal — the theorem true by construction, but telling us nothing about what a rational player should actually do at the first node. Rough probability for each, one line of justification, then the combination. Then say which term the final number is most sensitive to and what argument would move it most. Please answer in British English, and feel free to tell me if you think both my 0.5 and her 0.15 are wrong in the same direction.
