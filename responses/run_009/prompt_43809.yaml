prompt: |-
  Here's roughly my package on mental content and I want to know if it's stable before I commit to it in a paper: (1) content naturalism — intentional states have to be explainable in non-intentional terms or the whole mind just floats free of science; (2) the etiological version of teleosemantics — a state's content is fixed by what selection (evolution or learning) designed the mechanism to do, Millikan/Papineau style; (3) my beliefs often have perfectly determinate and quite specific contents — I believe that rent control reduces housing supply in the long run, that 101 is the smallest prime above 100 — and I don't want these to come out indeterminate or gappy; (4) misrepresentation has to be genuinely possible, including systematically — a creature can represent a certain kind of thing and be wrong about it a lot of the time, otherwise teleosemantics never gets falsehood in and that's a dealbreaker; (5) the frog case: when the frog's detector fires at a BB pellet, the frog is genuinely wrong about there being a fly there — not wrong about a fly-or-BB, just wrong, period. Which of these are actually in tension, which only look like it, and what's the cheapest repair? Rank the tensions by severity rather than treating them all the same, and tell me whether there's one revision that would clean up most of the mess. I honestly can't tell whether my problem is with (2) or whether I'm just being greedy with (3) and (5).
reasoning: |-
