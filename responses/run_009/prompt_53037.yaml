art of the idea it was supposed to produce, plus what will predictably go wrong the first time I run this and how to handle it. also be honest with me about which feature of jootsing a classroom exercise just cannot reproduce — my guess is it's something about how the real jump feels when you genuinely don't know whether there IS an outside view to jump to, but you'd know better than me. one stretch goal, only if it fits in the 90 minutes without cramming: a second system that *looks* like the first one but where the target IS reachable, so they get the visceral lesson that from inside you can't tell the difference between "stuck because it's impossible" and "stuck because i'm bad at this". your call on whether that overloads the session or is the best part of it.
