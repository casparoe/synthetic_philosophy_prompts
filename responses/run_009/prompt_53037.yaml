  ### **Session Plan (90 Minutes Total)**  

  #### **Part 1: The AEI Puzzle (40 min)**  
  - **Intro (2 min)**:  
    - "Today we’re exploring a puzzle like Hofstadter’s MU. Start: `A`. Target: `I`. Here are the rules..."  
    - Show rules on board/slide.  
  - **Group Work (25 min)**:  
    - Groups of 3–4 try to derive "I" from "A" with whiteboards.  
    - **Facilitator Tips**:  
      - Wander and ask: "What’s changing? What can’t change?"  
      - If stuck: "List all strings you can create in 1–3 steps. Do they share a property?"  
  - **Oracle Tokens (13 min)**:  
    - Each group gets **3 oracle tokens**.  
    - Spend a token to ask a **yes/no question** to the oracle (you) about *any* reachable string.  
      - **Examples**:  
        - "Is there a reachable string with 0 A’s?"  
        - "Can the number of A’s ever be even?"  
        - "Does Rule 4 ever decrease the A-count by 1?"  
      - **Answers**:  
        - "No" (0 A’s impossible),  
        - "No" (A’s always odd),  
        - "No" (it decreases by 2).  
    - **Goal**: Guide them to discover the invariant (A’s always odd).  

  #### **Stretch Goal: The "AEI-Reachable" System (15 min)**  
  - **Switch Systems (2 min)**:  
    - "Now, a slight tweak: Rule 2 is now *Replace any ‘A’ with ‘AA’* (not ‘AE’)."  
    - Rules 1, 3, 4, 5 unchanged.  
  - **Group Work (10 min)**:  
    - Target is still "I".  
    - **Solution**: "A" → Rule 2 → "AA" → Rule 4 (replace "AEA"?) → not yet.  
      - "A" → Rule 1 → "AE"  
      → Rule 2 (replace "A") → "AEE"  
      → Rule 3 (shift E) → "EAE"  
      → **Rule 4: "AEA" not contiguous!**  
      - Faster: "A" → Rule 2 → "AA" → Rule 2 → "AAA" → Rule 4: replace "AEA" → but "AAA" has no "E".  
      - **Actual solution**:  
        - "A" → Rule 1 → "AE"  
        → Rule 2: replace "A" with "AA" → "AAE"  
        → Rule 1: ends with "E"? No, ends with "E" → Rule 1 not applicable.  
        → Rule 3: "AE" → "EA" (if you shift)  
        → Then "EA" → Rule 1: ends with "A" → "EAE"  
        → Now "EAE" has no "AEA" substring!  
      - **Intended solution**:  
        - "A" → Rule 1: "AE"  
        → Rule 2: replace "A" with "AA" → "AAE" (now "AAE" has two A’s)  
        → Rule 3: shift E in "AAE" → replace "AE" (positions 2–3) with "EA" → "AEA"  
        → **Rule 4: "AEA" → "I"**  
  - **Key Insight**: Target is reachable in 4 steps, but it’s easy to miss!  

  #### **Debrief (30 min)**  
  - **Map to Hofstadter**:  
    | **Activity Moment**       | **Jootsing Concept**                          |  
    |---------------------------|-----------------------------------------------|  
    | Hitting a wall in AEI     | "Inside view": Stuck in derivation attempts. |  
    | Using oracle tokens       | "Jumping out": Asking meta-questions.         |  
    | Discovering the invariant | "Outside view": Seeing the system’s limits.   |  
    | AEI-Reachable confusion   | "Impossible vs. hard": The system doesn’t signal the difference. |  
  - **Predictable Challenges & Fixes**:  
    - **Problem**: Groups brute-force strings without strategy.  
      **Fix**: Suggest: "Try working backward from ‘I’."  
    - **Problem**: Oracle questions are too vague ("Is there a solution?").  
      **Fix**: Require: "Phrase questions about string properties (e.g., A-count)."  
    - **Problem**: Stretch goal takes too long.  
      **Fix**: After 8 min, reveal the 4-step solution.  
  - **Unreplicable Jootsing Element**:  
    - In reality, you don’t know if an "outside view" exists. Here, the oracle tokens signal its existence, making the jump feel safe. Hofstadter’s genius was *believing* an invariant existed without proof.  

  #### **Why This Works**  
  - **AEI System**: Fresh, no MU pattern-matching, and invariant (A’s always odd) is discoverable via oracle or enumeration.  
  - **Oracle Tokens**: Incentivize meta-thinking; tokens are scarce, so questions must be strategic.  
  - **Stretch Goal**: Worth it! Shows "impossible" vs. "I’m stuck" in 15 min.  

  Print the rules for students, and let the jootsing begin!
