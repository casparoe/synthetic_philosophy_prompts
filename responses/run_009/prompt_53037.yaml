     *Example: "A" → "AE"*  
  2. **Double "A"**  
     Replace any "A" with "AA".  
     *Example: "AAE" → "AAAE" (replace first "A")*  
  3. **Shift "E"**  
     Replace "XE" with "EX" (where X is any character).  
     *Example: "AE" → "EA"; "EA" → "AE"*  
  4. **Contract "AEA"**  
     Replace "AEA" with "I".  
     *Example: "AAEA" → "A" + "I" = "AI"*  
  5. **Delete "EE"**  
     Delete "EE" if it appears.  
     *Example: "AEE" → "A"*  

