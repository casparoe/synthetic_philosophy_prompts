      - Apply Rule 1: "AAE" (ends with "A" → add "E")  
      - Now try Rule 4: "AEA" not present.  
      - Better: From "AE", apply Rule 3: "AE" → "EA"  
      - Then Rule 1: Can’t (ends with "A"? "EA" ends with "A" → yes! "EA" → "EAE"  
      - Now "EAE": Apply Rule 4? "AEA" is present? "E-A-E" → no "AEA" substring.  

    After testing, I realize the invariant should be based on the **position of E** or **string structure**, but for parity, let’s define:  

    **True Invariant (Used in Session)**:  
    The target "I" has no "A", so \( A = 0 \).  
    - Start: \( A = 1 \) (odd).  
    - Rule 2: Changes \( A \) by \( +1 \) → parity flips.  
    - Rule 4: Changes \( A \) by \( -2 \) → parity unchanged (since -2 is even).  
    - Other rules: No change to \( A \).  
    - **Therefore: The parity of the number of "A"s is determined by the parity of the number of Rule 2 applications.**  
    - Start: 1 (odd).  
    - After 0 Rule 2 apps: odd.  
    - After 1 Rule 2 app: even.  
    - After 2 Rule 2 apps: odd.  
    - **But Rule 4 doesn’t change the parity, so the parity of A is always the same as the initial parity plus the number of Rule 2 applications modulo 2.**  
      - Initial A=1 (odd), so **A is odd if the number of Rule 2 applications is even, and even if odd?**  
        - 0 apps: A=1 (odd) → even number of apps (0) → A odd? Contradiction: even apps should give even A?  
      - Alternatively: **A is always odd if the number of Rule 2 applications is even, and even if it’s odd?**  
        - Start: 0 apps, A=1 (odd) → matches.  
        - After 1 app: A=2 (even) → matches.  
        - After 2 apps: A=3 (odd) → matches.  
    - **Invariant**: **The number of "A"s is odd if and only if the number of Rule 2 applications is even.**  
      Or equivalently: **A and the number of Rule 2 applications have the same parity?**  
      - Start: A=1 (odd), apps=0 (even) → different parity.  
      - After 1 app: A=2 (even), apps=1 (odd) → same parity.  
      - After 2 apps: A=3 (odd), apps=2 (even) → different.  
      - So **A and apps have opposite parity when apps is even?**  

    **Simplest for Students**:  
    - **Invariant**: **The number of "A"s is always odd.**  
      - Start: "A" → 1 A (odd).  
      - Rule 1: Adds "E" → A-ct unchanged.  
      - Rule 2: Replaces one "A" with "AA" → A-ct increases by 1 (odd → even).  
      - Here’s the flaw: Rule 2 changes parity.  

    **Redesigned System to Fix Invariant**:  
    Let’s adjust Rule 2 to preserve parity.  

    **Revised Rules for AEI System**:  
    1. **Add "E"**: If ends with "A", add "E".  
    2. **Double "A" to "AE"**: Replace any "A" with "AE".  // Change from "AA" to "AE"  
    3. **Shift "E"**: Replace "XE" with "EX".  
    4. **Contract "AEA" to "I"**: Replace "AEA" with "I".  
    5. **Delete "EE"**: Remove "EE".  

    **New Invariant**:  
    - Rule 2: Replaces "A" with "AE" → **A-count unchanged** (one "A" replaced by one "A" + "E").  
    - Rule 4: Replaces "AEA" with "I" → **removes 2 A’s** (since "AEA" has 2 A’s).  
    - Start: "A" → 1 A.  
    - Rule 4: -2 A’s → only possible if A-count ≥ 2, and changes A-count by -2 (even).  
    - **Therefore: A-count modulo 2 is invariant!**  
      - Start: 1 A → odd.  
      - All rules: A-count changes by 0 or -2 (both even) → parity unchanged.  
      - **Invariant: Number of "A"s is always odd.**  
      - Target "I" has 0 A’s (even) → impossible.  

    **Test Derivation**:  
    - Start: "A" (1 A, odd)  
    - Rule 1: "AE" (1 A)  
    - Rule 2: Replace first "A" with "AE" → "AEE" (1 A)  
    - Rule 5: Delete "EE" → "A" (1 A)  
    - Rule 2: "A" → "AE" (replace) → wait, Rule 2 replaces "A" with "AE", so "A" → "AE" (same as applying Rule 1 then Rule 2?)  
      - Better: "A" → Rule 2: "AE" (now "AE" has one "A")  
      - Then apply Rule 2 to the "A" in "AE" → "AEE"  
      - Then Rule 3: Shift E: "AEE" → "EAE" (shift first E? "A" + "E" → replace "AE" with "EA"? Rule 3 is for "XE" → "EX", so "AE" → "EA")  
      - Now "EAE" → apply Rule 4? "AEA" substring? "E-A-E" → no contiguous "AEA".  
      - Apply Rule 1? "EAE" ends with "E", not "A".  
    - Cannot remove the sole "A" → invariant holds.  

    **Conclusion**:  
    - **Start**: `"A"`  
    - **Target**: `"I"` (0 A’s, even)  
    - **Invariant**: **Number of "A"s is always odd** → target unreachable.  

