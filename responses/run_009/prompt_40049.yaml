  Here is a draft joint statement reflecting a genuine adversarial collaboration, addressing the specified sticking points with precision and incorporating the requested structure:

  **Joint Statement: On Claims Between Compatriots**

  We, the undersigned – a liberal nationalist (LN) and a cosmopolitan (C) – agree on the following points, while acknowledging substantive disagreements outlined below:

  1.  **The Moral Irrelevance of Birthplace as Such:** Both parties agree that the mere fact of being born within a particular set of territorial borders, absent other considerations, confers no inherent moral privilege or generates no special obligation in and of itself. Birthplace is arbitrary in a morally significant sense.
  2.  **The Moral Relevance of Institutions:** Both parties agree that institutions – particularly those that are coercive, demand sacrifice and contribution, and structure fundamental life chances – generate distinctive obligations among participants. The existence of such obligations is not reducible solely to voluntary choice or universal moral principles.
  3.  **The Scope of Humanitarian Duties:** Both parties agree that all human beings possess significant, enforceable duties of aid and rescue towards one another, grounded in our shared humanity and capacity for suffering. These duties constrain the actions of states and individuals.
  4.  **The Core Disagreement:** Our fundamental disagreement concerns *whether and to what extent* the specific institutional context of the *nation-state* generates obligations that are (a) distinct in kind or strength from universal humanitarian duties, and (b) sufficiently weighty to justify prioritizing the interests of fellow nationals over otherwise similar non-nationals in certain distributive and policy contexts, particularly concerning resources and membership.
  5.  **Points NOT Disputed:** We do not dispute:
      *   The reality of special obligations within families or small-scale intimate associations.
      *   The demanding nature of universal humanitarian duties.
      *   The historical contingency and frequent injustice in the formation of existing states.
      *   That states are coercive institutions.
      *   That justice requires significant global redistribution to alleviate severe deprivation.

  **Table of Residual Disagreements**

  | Crux Issue                     | Liberal Nationalist (LN) Position (as accepted by LN)                                                                 | Cosmopolitan (C) Position (as accepted by C)                                                                                                                   |
  | :----------------------------- | :-------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **1. The Family Analogy**      | The state, like the family, is an unchosen, cooperative scheme essential for human flourishing. Obligations arising within such constitutive associations are distinct from, and can sometimes outweigh, obligations to outsiders, even though states employ coercion and families typically do not. | The coercive, administrative, exclusionary, and non-intimate nature of the state fundamentally distinguishes it from the family. While families generate special obligations through intimacy and direct dependence, state-based obligations derive solely from shared institutional participation and coercion, making them weaker and fundamentally different in kind. |
  | **2. The Levels Problem**      | The modern sovereign state represents a unique, pervasive, and functionally necessary level of coercive institutional cooperation for realizing social justice. While sub-state units generate localized obligations, the state is the primary site for defining citizenship, administering comprehensive justice, demanding allegiance, and mobilizing collective resources, creating a distinctive and normatively salient boundary. | There is no morally privileged stopping point inherent to the nation-state level. Obligations track participation in coercive institutional schemes of varying scales. The relevant scope for justice claims is determined by the impact of institutions on individuals' lives, which is inherently multi-scalar (local, national, supranational, global). Arguments for bounded obligations apply equally to sub-state units or expand logically to encompass all subjected to global institutional order. |
  | **3. Immigration & Refugee Policy** | The special obligations generated by shared state institutions justify prioritizing the welfare and self-determination of existing members. This includes the right to exercise significant control over immigration levels to protect social cohesion, public goods, and the integrity of the cooperative scheme, even when excluding non-members facing hardship. Open borders would undermine the conditions necessary for fulfilling these special obligations. | While shared institutions may justify *some* internal prioritization of resources among existing members (e.g., welfare systems), they cannot justify excluding non-members in dire need (refugees) or those seeking opportunity. The strength of compatriot obligations is insufficient to override the fundamental rights and severe harms caused to outsiders by coercive exclusion, especially given the arbitrariness of birthplace. Compatible priority, if defensible at all, is primarily fulfilled through redistribution, not exclusion. |

  **Identifying Cruxes: Concrete Cases & Predictions**

  1.  **Crux: The Levels Problem (Where does the boundary lie?)**
      *   **Case:** A wealthy province (e.g., Catalonia, California) with its own robust tax system, social services, and strong regional identity seeks to secede peacefully from its larger state. The province argues its citizens contribute primarily to their own cooperative scheme and owe no special distributive obligations to poorer citizens in the rest of the state.
      *   **LN Prediction:** The nationalist would argue that the province *does* owe distributive obligations to poorer citizens in the larger state *unless and until* secession is fully realized and recognized. The existing sovereign state remains the primary site of justice, overriding the province's scheme. *(Reasoning: The state level is normatively primary)*.
      *   **C Prediction:** The cosmopolitan would argue that the province's claim has significant moral weight. If the province genuinely operates a largely self-contained coercive cooperative scheme demanding contributions and providing benefits primarily to its own residents, the obligation to redistribute wealth to the larger state weakens considerably, potentially justifying significant autonomy or even secession. *(Reasoning: Obligations track the actual, functional institutional scheme, not the formal state label).*

  2.  **Crux: Immigration/Refugee Policy (Does compatriot priority justify exclusion?)**
      *   **Case:** A state faces a large influx of refugees fleeing a brutal conflict. Accepting them would impose significant, but manageable, fiscal costs (e.g., requiring a modest tax increase on all citizens) and some short-term strain on local services. The refugees are readily integrable and pose no security threat. Does the state have a right/duty to severely limit intake to protect existing members' resources?
      *   **LN Prediction:** The nationalist would argue the state is justified in limiting intake to a level deemed sustainable without undermining core domestic social programs or social cohesion, even if this means turning away many refugees. Protecting the integrity of the domestic cooperative scheme for members is paramount. *(Reasoning: Special obligations to members justify managing burdens)*.
      *   **C Prediction:** The cosmopolitan would argue that the manageable costs to members do not justify excluding refugees fleeing for their lives. The fundamental rights and desperate needs of the refugees override the relatively minor burdens imposed on members via taxation. Significant intake is morally required. *(Reasoning: Humanitarian duty and harm of exclusion trump moderate domestic costs)*.

  3.  **Crux: Nature of Obligations (Justice vs. Association)**
      *   **Case:** A proposal is made for a "Global Fund for Basic Needs," funded by a progressive tax on the global wealthy (primarily in rich states) and distributed unconditionally to individuals below a global poverty threshold, regardless of nationality. This would significantly reduce poverty but require substantial redistribution from citizens of rich states.
      *   **LN Prediction:** The nationalist would likely see this as a *demanding humanitarian duty*, but *not* a requirement of *justice owed specifically by rich states' citizens to the global poor as a matter of right*. Justice obligations primarily concern the domestic basic structure. *(Reasoning: Justice obligations arise within the shared coercive scheme)*.
      *   **C Prediction:** The cosmopolitan would argue this is a core requirement of *global justice*, owed by the beneficiaries of the unjust global institutional order (citizens of rich states) to those harmed by it. Failing to contribute adequately violates the rights of the global poor. *(Reasoning: Justice obligations track the impact of coercive institutions, which are global)*.

  **Note on Verbal Dispute:**

  We jointly identify the frequent debate over whether compatriot obligations are matters of "justice" or "association/solidarity" as **largely verbal**. The substantive disagreement lies not in the *label*, but in:
      *   The *source* of the obligation (Is the state fundamentally like a family/community or like an administrative scheme?).
      *   The *strength* and *content* of the obligation relative to universal duties (Does it justify exclusion? How much redistribution does it demand internally vs. externally?).
      *   The *scope* of the obligation (State-bound or multi-scalar?).

  **Therefore, within this collaboration, we will focus our arguments on the substantive sources, strengths, contents, and scopes of obligations arising from state institutions, avoiding definitional disputes over the term "justice."** We agree that both positions recognize significant, potentially enforceable obligations; the dispute concerns their grounding and weight relative to other moral demands.

  ---

  **Signed,**

  **[Name - Liberal Nationalist]**

  **[Name - Cosmopolitan]**

  ---

  **Key Features Reflecting Your Request:**

  *   **In the Weeds:** Directly addresses the three crystallized sub-disputes (Family Analogy, Levels Problem, Immigration Crux) with precision, using the professors' own framing (institutional coercion, arbitrariness).
  *   **Common Ground:** Explicitly lists agreed premises and non-disputed points to isolate the core disagreement.
  *   **Disagreements Table:** Phrasing aims for accuracy and acceptance by each side, reflecting their core arguments (LN: constitutive association/functional necessity of state; C: irrelevance of intimacy/multi-scalar impact, harm of exclusion).
  *   **Concrete Cases:** Three cases designed specifically to target the three cruxes (Secession/Levels; Refugee Intake/Exclusion; Global Fund/Justice Label). Includes clear, testable predictions from each side.
  *   **Verbal Dispute Flagged:** Explicitly identifies the "justice" label dispute as potentially verbal and refocuses the collaboration on the underlying substantive questions (source, strength, scope).
  *   **No Blandness/Literature Review:** Assumes deep familiarity, jumps straight to the contested nuances.
  *   **Adversarial Collaboration Structure:** Clearly delineates agreements, disagreements, and predictive tests.
