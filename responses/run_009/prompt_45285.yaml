  Okay, the user is on a steering committee for their city's participatory budgeting program, and they're facing several proposals about expanding voting eligibility. They need to draft a memo that takes a clear stance on each proposal: allowing 16- and 17-year-olds to vote, creating a half-weight "stakeholder ballot" for commuters/business owners, adding a "future residents" proxy vote, and including incarcerated individuals. The memo must have a specific structure and address both philosophical and practical concerns.

  First, I need to understand the core dilemma. The user is torn between two principles: "everyone subject to the decisions gets a vote" (which supports current inclusions like non-citizen residents and possibly teens) and "all affected should have a say" (which could expand indefinitely). The future-residents proposal seems to be testing the limits of the latter. The user also mentioned practical implementation concerns.

  For each proposal, I'll need to take a clear position while steelmanning counterarguments. The "subject to" principle feels more administrable and aligned with PB's purpose of empowering residents. Expanding to commuters and future residents could dilute resident voices and create implementation nightmares. 

  On 16-/17-year-olds: There's a strong case here—they're residents, affected long-term, and including them builds civic habits. The strongest objection is about maturity, but evidence shows teens handle similar responsibilities well.

  The stakeholder ballot is trickier. While commuters/businesses contribute sales tax, PB is fundamentally about resident self-governance. Half-votes would be administratively messy and could lead to demands for further weighting (e.g., property owners wanting more influence). 

  The future-residents idea, while intellectually interesting, is unworkable. Who decides which high schoolers vote? How do we prevent it from becoming symbolic rather than meaningful? It risks turning PB into a thought experiment.

  For incarcerated individuals: If they list the city as home, they're still residents. Excluding them contradicts the "subject to" principle. The public perception concern is valid but manageable—framing it as basic fairness helps.

  Practical implementation is crucial. The clerk's office needs verifiable, simple criteria. Expanding to non-resident stakeholders or proxy votes would overburden the system. Keeping it resident-focused (with minor age adjustments) aligns with existing verification processes.

  The user's deeper need seems to be preserving PB's legitimacy while avoiding endless philosophical debates. They want a defensible position that won't fracture the committee. Emphasizing "resident sovereignty" as the core purpose—with adjustments only when strongly justified (like lowering the age)—creates a coherent framework. 

  I'll structure the memo to first give bottom-line recommendations, then explain the underlying "resident sovereignty" philosophy, address each proposal individually, steelman the main objection (about tax-paying commuters being excluded), and finally flag implementation risks. The tone should be principled but pragmatic, acknowledging good faith concerns while drawing clear boundaries.
answer: |-
  ## Steering Committee Memo: Defining Our PB Demos  
  **From:** [Your Name]  
  **Date:** October 26, 2023  
  **Subject:** Concrete Recommendations on Voter Eligibility for the Next PB Cycle  

  ### Bottom Line
  I recommend:  
  1.  **Expand to 16- & 17-Year-Olds:** Yes, with standard residency verification.  
  2.  **Half-Weight Stakeholder Ballot:** No.  
  3.  **Future-Residents Proxy Ballot:** No.  
  4.  **Include Incarcerated Residents:** Yes, with verified city address.  

  This maintains resident sovereignty as PB’s core principle while making two targeted expansions: lowering the voting age to include resident minors who are directly affected long-term, and ensuring all resident adults (including those incarcerated) can participate. The stakeholder and future-resident proposals, while raising valid points about affectedness, introduce impractical complexity and dilute resident decision-making authority.  

  ---

  ### What This Vote Is For  
  Participatory Budgeting (PB) in our city isn’t just about allocating funds; it’s an exercise in **resident self-governance over the shared physical environment they inhabit daily.** The projects funded—parks, sidewalks, community centers—shape the lived experience of *residents* for decades. While sales tax revenue broadens the tax base beyond residents, PB’s unique power stems from granting those who *live* with the outcomes direct control over prioritization.  

  The "all-affected" principle has intuitive moral weight, but applying it literally in PB is unworkable and risks diluting resident voices beyond recognition. Commuters, business owners, and future generations are impacted, but PB exists specifically to empower the *resident community* to define its own needs. Expanding eligibility too far turns PB into a generic stakeholder consultation, undermining its distinctive purpose: deepening democratic engagement where people live.  

  ---

  ### The Proposals One by One  

  1.  **16- & 17-Year-Olds (YES):** Resident minors are uniquely impacted by long-term infrastructure; they’ll live with these projects as adults. Excluding them ignores their stake while missing a critical opportunity to build lifelong civic habits. Evidence from other cities shows younger voters engage thoughtfully in PB. This strengthens resident democracy without altering its core.  

  2.  **Half-Weight Stakeholder Ballot (NO):** While commuters and business owners contribute sales tax and are affected, their primary civic responsibility lies in their home municipalities. Granting non-residents voting rights (even fractional) fundamentally shifts PB from resident self-determination to external influence. Where do we draw the line? Why half a vote? This opens untenable debates about weighting and scope, inviting litigation and administrative chaos.  

  3.  **Future-Residents Proxy Ballot (NO):** While creatively highlighting intergenerational justice, this proposal is unadministrable and symbolic. High schoolers cannot reliably "represent" unknown future populations. It risks trivializing the vote and diverting focus from present residents’ urgent needs. Intergenerational concerns are better addressed through committee guidelines and design standards, not proxy votes.  

  4.  **Include Incarcerated Residents (YES):** If someone lists a city address as their legal residence, they remain part of our community. They are subject to the city’s laws and will return to its infrastructure. Denying them a vote contradicts PB’s foundational principle that those bound by a community’s decisions should have a voice in shaping them. Their residency is verifiable via existing DOC records.  

  ---

  ### The Strongest Objection to My View  
  The most compelling counter-argument targets the exclusion of the stakeholder ballot. Proponents rightly note: *"Sales tax paid by non-residents funds these projects. Excluding daily commuters and business owners—whose livelihoods depend on city infrastructure—ignores their tangible contribution and impact. It privileges residency over actual stake, creating a 'taxation without fair representation' scenario for those who sustain our economy but sleep across county lines. Our principle should be reciprocity: if you pay into the pot and are affected daily, you deserve a say, even if weighted."* This view emphasizes fiscal contribution and daily impact as legitimate claims for inclusion.  

  ---

  ### Can We Actually Run This?  
  The recommended approach (Residents 16+, including incarcerated) is **highly administrable**:  
  *   **Verification:** Leverages existing systems (utility bills, leases, school ID for minors, DOC records). Clerk’s office already handles residency checks.  
  *   **Ballot Weight:** Maintains simple "one person, one vote." No complex weighting formulas or audits needed.  
  *   **Scope:** Clear boundaries prevent endless debates over who qualifies as a "stakeholder" or "future resident proxy," avoiding legal challenges and voter confusion.  

  Conversely, the stakeholder/future ballots introduce **significant burdens**:  
  *   Defining/documenting "commuter" status, business ownership, or seasonal presence fairly.  
  *   Creating/managing fractional votes or proxy systems.  
  *   Defending arbitrary geographic/time boundaries in court.  

  ---

  **In sum:** Protecting **resident sovereignty** keeps our PB focused, legitimate, and executable. Including 16/17-year-olds and incarcerated residents strengthens this principle by expanding it consistently. Rejecting stakeholder and future-resident ballots avoids impractical philosophical expansions that would overwhelm our process and dilute the resident voice this program exists to empower. Let’s keep PB resident-centered, practical, and powerful.
