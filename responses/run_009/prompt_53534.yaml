  Below is a comprehensive design for your 90-minute PPE seminar activity, centered on the discursive dilemma in a job appointment scenario. The activity is structured to immerse students in the conflict before introducing formal terms, with clear roles, prediction elements, and a debrief linking to prior knowledge of majority cycling.

  ---

  ### **Activity Design: Job Appointment Committees**
  **Scenario**: Three parallel committees (A, B, C) must decide whether to recommend a final-round candidate for a job offer, governed by a rule ratified at a fictional prior meeting:  
  > *"Recommend an offer if and only if the candidate clears both the research bar AND the teaching bar."*  

  **Committee Procedures**:
  - **Committee A (Premise-based)**: Votes on each premise (research/teaching) separately, then applies the rule mechanically to determine the offer.
  - **Committee B (Conclusion-based)**: Votes only on the bottom-line offer recommendation.
  - **Committee C (Chair-decides)**: Holds a non-binding straw poll on the offer; the chair makes the final decision alone.

  **Student Roles** (16 students total):
  - **3 Committees**: Each has 5 voting members (15 students total).
  - **Non-Committee Roles** (1 student): 
    - **Tally-keeper**: Records/publicizes votes on a whiteboard.
    - **Designated dissenter**: Raises a scripted objection during Committee A’s discussion (details below).
    - **Observers** (2 students): Participate in the prediction pool (no other roles).
  - **Chairs**: One per committee (selected from voting members; runs the meeting but votes normally).

  ---

  ### **Judgment Profiles and Reasoning**
  Identical candidate files are given to all committees, but **voting members receive pre-assigned judgments** (below) to ensure the dilemma fires. Profiles are designed so:
  - A majority accepts each premise (research/teaching), triggering a mechanical offer under the rule.
  - A majority rejects the offer itself.
  - One member’s judgments ("Member 3") vividly highlight the tension when revealed.

  **Profile for All Committees (5 members each)**:
  | Member | Research | Teaching | Offer | Consistency with Rule |
  |--------|----------|----------|-------|------------------------|
  | 1      | Accept   | Reject   | Reject | Consistent (rejects both bars → rejects offer) |
  | 2      | Accept   | Reject   | Reject | Consistent (rejects both bars → rejects offer) |
  | 3      | Reject   | Accept   | Reject | Consistent (rejects research → rejects offer) |
  | 4      | Accept   | Accept   | Accept | Consistent (accepts both → accepts offer) |
  | 5      | Reject   | Accept   | Reject | Consistent (rejects research → rejects offer) |

  **Tally Results**:
  - **Research**: Accept (Members 1, 2, 4) = 3/5 majority.  
  - **Teaching**: Accept (Members 3, 4, 5) = 3/5 majority.  
  - **Offer**: Accept (Member 4) vs. Reject (1, 2, 3, 5) = 1/5 vs. 4/5 majority.  

  **Why These Numbers?**
  - **Dilemma trigger**: Majorities accept both premises (research: 3/5; teaching: 3/5), so the rule *requires* an offer. Yet a majority (4/5) rejects the offer. This creates inconsistency between premise-based and conclusion-based outcomes.
  - **Vivid tension (Member 3)**: Rejects research but accepts teaching. When judgments are revealed, this member can argue: *"I rejected the offer because research was weak, even though teaching was strong. How can we recommend an offer when most of us oppose it?"* This highlights the clash between individual consistency and collective inconsistency.
  - **Outcome variance by procedure**:
    - Committee A (Premise-based): Premises pass → mechanical offer recommendation.
    - Committee B (Conclusion-based): Majority (4/5) rejects offer → no recommendation.
    - Committee C (Chair-decides): Straw poll shows offer rejection (4/5). Chair (privately instructed to reject) overrides → no recommendation.

  ---

  ### **Additional Elements**
  1. **Prediction Pool**:
     - Observers and non-voting roles (tally-keeper, dissenter) bet tokens on which committees will recommend the offer.  
     - **Predictions**: Committee A (premise-based) will recommend; B and C will not. Payouts occur post-activity.

  2. **Designated Dissenter Script**:
     - During Committee A’s discussion (after premise votes but before announcing results), the dissenter interrupts:  
       *"Objection! What if the premises pass but most of us oppose the offer? Forcing an offer when the committee rejects it undermines our credibility!"*  
     - **Purpose**: Foreshadows the dilemma without naming it; sparks procedural debate.

  3. **Revision Round (Committee A only)**:
     - After premise tallies are posted (research/teaching both pass), members may change their **offer vote** on ballots (premises are locked).  
     - **Debrief use**: Compare initial/final offer votes. E.g., if Member 4 changes from Accept to Reject, ask: *"Did you change your mind (sincere) or align with the majority (strategic)?"*  
     - **Ballot design**: Two columns for offer vote (initial/final) to track changes.

  ---

  ### **Activity Flow (90 Minutes)**
  | Time  | Step                                                                 |
  |-------|----------------------------------------------------------------------|
  | 0-10  | Setup: Assign roles, distribute candidate files, explain rules/procedures. Observers launch prediction pool. |
  | 10-30 | **Committee Deliberations** (20 mins): Committees discuss/vote privately. Tally-keeper records votes. |
  |       | - *Committee A*: Votes premises → posts tallies → revision round (offer vote) → applies rule. |
  |       | - *Committee B*: Votes only on offer. |
  |       | - *Committee C*: Straw poll on offer → chair decides. |
  |       | *Dissenter interrupts Committee A during discussion.* |
  | 30-40 | **Outcome Announcements**: Each chair reports recommendation. Tally-keeper posts all results. |
  | 40-60 | **Plenary Comparison**: Map outcomes to procedures. Committees A/B/C have different results (offer/reject/reject). |
  | 60-85 | **Debrief**: Focus on aggregation methods and contrast with Condorcet paradox. |
  | 85-90 | Reveal term "discursive dilemma"; assign follow-up reading. |

  ---

  ### **Debrief Structure: Aggregation vs. Cycling**
  1. **Map the Conflict**:
     - **Premise-based (A)**: Aggregated premises → consistent with rule but inconsistent with majority’s conclusion.  
     - **Conclusion-based (B)**: Aggregated conclusion → consistent with majority but ignores premises/rule.  
     - **Chair-decides (C)**: Avoids inconsistency but sacrifices collective input.  

  2. **Contrast with Condorcet Paradox**:
     - **Cycling (students’ prior knowledge)**: Arises from *intransitive preferences over options* (e.g., A>B, B>C, C>A).  
     - **Discursive Dilemma**: Arises from *inconsistent judgments over interconnected propositions* (premises → conclusion).  
     - **Key Difference**: Cycling is about preferences; the dilemma is about logical consistency. Here, the rule creates a "logical constraint" (research AND teaching → offer), but majority voting fractures it.

  3. **Reveal the Term**: In the final minutes:  
     *"What you experienced is the **discursive dilemma**: majority support for premises doesn’t guarantee majority support for the conclusion they imply."*  

  ---

  ### **Predictable Challenges and Mitigation**
  1. **Sharp students spot inconsistency mid-activity**:
     - *Risk*: In Committee A, students may notice premise tallies imply an unwanted offer and try to renegotiate the rule.  
     - *Mitigation*: Chairs remind them: *"The rule is binding from your fictional prior meeting. Discuss judgments, not the rule."* Allow debate but uphold the procedure. This mirrors real-world friction (e.g., rigid bylaws).

  2. **Insincere voting**:
     - *Risk*: In Committee A’s revision round, members may change votes strategically (e.g., Member 4 switches to Reject to align with the majority).  
     - *Mitigation*: Use secret ballots for revision. In debrief, differentiate: *"Who changed their mind vs. their vote? Why might people vote insincerely?"* Turn this into a learning point about strategic behavior.

  3. **Unplanned compromise**:
     - *Risk*: Committee B/C may converge on consensus (e.g., all reject) through discussion, overriding the profile.  
     - *Mitigation*: Assign judgments firmly: *"Stick to your assigned views for the first vote."* If consensus happens, note: *"Deliberation can resolve dilemmas—but here, we’re testing voting procedures, not debate."*  

  ---

  ### **Limitations and How to Address Them**
  **The Unreproducible Realism**:  
  This activity showcases *one* instance of the dilemma under controlled conditions. It cannot replicate the **general impossibility of consistent aggregation** (e.g., the List-Pettit theorem showing no procedure satisfies universality, consistency, and majority rule simultaneously).  

  **What to Supply in Debrief**:  
  1. **Gesture to Impossibility**:  
     *"This isn’t just about one candidate—it’s a systemic problem. When propositions are logically connected (e.g., premises → conclusion), no voting method always ensures consistent outcomes while respecting majority will and individual judgments."*  
  2. **Contrast with Arrow/Concorcet**:  
     *"Unlike preference cycling, which arises from intransitive rankings, this inconsistency stems from logical connections between issues. Both highlight trade-offs in collective choice, but they demand different solutions."*  
  3. **Provide Scholarship**:  
     Assign excerpts from List & Pettit (2002) or Dietrich (2007) as follow-up to prove generality beyond this example.  

  ---

  ### **Logistical Notes**
  - **Materials**: Ballots (with initial/final offer columns), candidate files (minimalist: e.g., "Research: Strong publication, weak methods; Teaching: Excellent evals, limited experience"), whiteboard for tallies, tokens for predictions.
  - **Timekeeping**: Strictly enforce 20-minute deliberations. Use a timer.
  - **Chair Instructions**: For Committee C, privately instruct the chair: *"You believe research is weak; reject the offer regardless of the poll."*  
  - **Revealing Judgments**: Do this only in plenary to maximize tension.

  This design ensures students confront the dilemma experientially, with friction points turned into teachable moments. The debrief explicitly bridges the gap between their Condorcet knowledge and new insights on judgment aggregation.
