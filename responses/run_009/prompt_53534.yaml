  For 4 members, it's impossible to have:
  - At least 3 accept research.
  - At least 3 accept teaching.
  - At least 3 reject the offer.

  Because the first two conditions imply that the number of members who accept both research and teaching is at least 3+3-4=2. Each of these 2 accept the offer. The other 2 might reject, but then we have only 2 rejections, not 3.

  So we must use an odd number? 3 or 5.

  Given the constraints, we use 3 members per committee? Then for the revision round, in the premise-based committee, after posting the premise tallies (which show both passed), we ask members to change their conclusion vote if they wish. In the 3-member profile:

  Member 1: (yes, no) -> offer: no
  Member 2: (no, yes) -> offer: no
  Member 3: (yes, yes) -> offer: yes

  After seeing that research passed (2 yes: 1 and 3) and teaching passed (2 yes: 2 and 3), member 1 might be convinced to change their conclusion to yes? But that would require them to change their mind on teaching? Or they become inconsistent? We can instruct one member to be initially inconsistent? But then we are not modeling reality.

  Alternatively, we can have the revision round in the conclusion-based committee? But they don't vote on premises? The activity says: "run after the premise tallies are posted there". So only the premise-based committee sees the premise tallies? So it has to be in the premise-based committee.

  So perhaps we have to accept that in the revision round, no one may change? But then we can still collect the data and show that no one changed? And discuss why? Because they are consistent with their own premises. The debrief can highlight that.

  So we go with the 3-member profile for all committees.

  Summary for profiles: 
  Each committee's voting members have the following judgments:

  - Member A: Accept research, reject teaching, reject offer.
  - Member B: Reject research, accept teaching, reject offer.
  - Member C: Accept research, accept teaching, accept offer.

  And we assign these labels to the students in each committee.

  For the chair in the chair-decides committee, we privately instruct the chair that they personally believe the candidate does not meet the research bar, so they will reject the offer.

  Additional roles:

  - Each committee has a non-voting chair. The chair's role is to facilitate the meeting.
  - For the chair-decides committee, the chair is instructed to reject.
  - Tally-keeper: collects and posts the results (non-voting).
  - Designated dissenter: not on any committee. Scripted to raise a procedural objection at a set moment (e.g., after the votes are cast but before the announcement, or during the discussion). The objection might be: "This decision rule is flawed because it can lead to inconsistencies like this!" but they don't know the term. We can script: "I object! How can we recommend a candidate when a majority of us are against it?" or something similar.
  - Two observers: participate in the prediction pool.

  Prediction pool: Before the committees deliberate, the observers (and possibly the dissenter and tally-keeper? but the dissenter has a role) make predictions on which committees will recommend the offer. They bet tokens.

  The activity steps:

  1. Assign roles: 
     - 3 committees, each with 3 voting members (assigned judgments: A, B, C) and 1 non-voting chair.
     - Tally-keeper, dissenter, two observers.

  2. Explain the candidate file: provide the same packet to each committee. The packet should have information that can be interpreted as meeting/not meeting research and teaching bars. But we are not relying on that because we are assigning judgments.

  3. Explain the decision rule: offer if and only if both research and teaching are passed.

  4. Explain the aggregation procedure per committee:
     - Committee 1 (premise-based): They will vote on research, then on teaching. Then the rule will be applied mechanically. They also fill out a ballot with their judgments on research, teaching, and offer.
     - Committee 2 (conclusion-based): They will vote only on the offer (conclusion). They fill out the same ballot, but only the offer vote is used.
     - Committee 3 (chair-decides): They will take a non-binding straw poll on the offer. The chair will then make the final decision. They fill out the ballot, but the chair is not bound.

  5. Ballots: Each voting member gets a ballot to record: research (yes/no), teaching (yes/no), offer (yes/no). But in the conclusion-based committee, they are told that only the offer vote will be counted. In the premise-based, they are told that the offer vote is for recording but the decision is by premises. In the chair-decides, the straw poll is on the offer.

  6. The dissenter is scripted to object during the meeting of one committee (e.g., the premise-based) after the votes are cast but before the announcement. They might say: "I've been observing and I must object: it's possible that the premises pass but the conclusion fails, which is inconsistent!" But they don't know the results.

  7. Tally-keeper collects the votes and posts the results for each committee.

  8. In the premise-based committee, after the premise votes are posted (research: 2 yes, 1 no; teaching: 2 yes, 1 no), but before announcing the mechanical conclusion, they hold a revision round: members can change their conclusion vote on their ballot. Then they collect the new conclusion votes. This is to see if anyone changes.

  9. Then, each committee announces its decision:
     - Premise-based: because both premises passed, recommend offer.
     - Conclusion-based: majority (2 out of 3) reject offer, so reject.
     - Chair-decides: the straw poll shows 2 reject, 1 accept. The chair (instructed to reject) announces rejection.

  10. Plenary session: compare outcomes. Then debrief.

  Predictably goes wrong:

  - Sharp students spot the inconsistency mid-round and try to renegotiate the decision rule. 
    - How to handle: The decision rule is fixed by the fictional earlier meeting. The chair should remind them that they are bound by the rule they ratified. But allow the discussion to happen briefly, then say: "For the purpose of this activity, we are using the predefined rule."

  - Some vote insincerely once they see where the tallies point. 
    - In the premise-based committee, they vote on premises first. If a member sees the tally of the first premise, they might insincerely vote on the second. But we vote in sequence? We can vote simultaneously. But even if simultaneously, after seeing the discussion, they might vote strategically. 
    - How to handle: Emphasize that they should vote their sincere judgment. But if they do vote strategically, note that in the debrief as a real-world possibility.

  - A committee may converge on a compromise the profiles were not built to produce. 
    - For example, in the conclusion-based committee, after discussion, they might all vote the same? We assigned judgments, but they might change their minds during discussion. 
    - How to handle: Instruct them to stick to their assigned judgments for the first vote. But during discussion, they might be persuaded. If they change, then the outcome might change. We can't prevent that. In the debrief, note that the activity is designed to show a particular phenomenon, and real committees may avoid it through discussion.

  What the activity cannot reproduce:

  The activity shows one hand-built example. It does not show the general impossibility of aggregation on interconnected propositions. In the debrief, we must explain that this is not an isolated incident: there are general results (like the impossibility theorems in judgment aggregation) that show that no aggregation procedure can always yield consistent and complete collective judgments while satisfying certain desirable conditions (e.g., majority vote on each proposition, universal domain, etc.). We can contrast with Arrow's theorem (which they know) and note that this is a different kind of impossibility that arises when we have multiple logically connected propositions. We should gesture to the literature without proving it.

  Final note: do not use the term "discursive dilemma" until the very end.

