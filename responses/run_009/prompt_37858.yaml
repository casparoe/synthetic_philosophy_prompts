  - Dev's response: reforms backfire (term limits empower unelected insiders)
  - Maya's final thrust: sortition would exacerbate insider control

  Hmm... both make valid points but seem trapped in a binary framework. The user's deeper ask might be about democratic theory blind spots - they mention neither put something "on the table," which suggests looking for third perspectives.

