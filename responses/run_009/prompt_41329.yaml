answer: |-
  Below is a decision tree designed to force commitments on the "why are some nations rich and others poor" debate. It starts from the universally accepted observation (enormous, persistent income gaps) and uses concrete historical/geographical cases to build the logical space. The tree has **9 branch nodes** and **8 distinct leaves**, including the required positions (strong institutions, deep geography, culture, causal-inference skeptic) and multiplicative/interaction views. Granularity is addressed early, and observational equivalence is flagged where applicable.

  The tree prioritizes **diagnostic questions** over abstract theory—using cases like the Korean divergence, the reversal of fortune in the Americas, and the poverty of landlocked tropics—to ensure students can answer branches without knowing the final positions. Author names are omitted in favor of descriptive position labels (e.g., "reversal-of-fortune institutions view"). 

  ---

  ### **Decision Tree: Why Are Some Nations Rich and Others Poor?**  
  **Start**: Enormous, persistent income gaps exist between countries (e.g., Qatar vs. Central African Republic; 20:1 GDP per capita gaps since 1950).

  1. **Branch 1 (Unit of Analysis)**:  
     *When explaining gaps, are nation-states the right unit? Consider:*  
     - North/South Korea (same geography/culture, divergent outcomes since 1945).  
     - Coastal vs. inland China (within-country gaps wider than global gaps).  
     - The "reversal of fortune" in the Americas (e.g., Inca Mexico/Peru rich in 1500, poor today; US/Canada poor in 1500, rich today).  
     → **A. Yes, nation-states are primary** (go to Branch 2).  
     → **B. No, subnational/regional units are key** (e.g., cities, frontiers; go to Branch 3).  
     → **C. No, the question is unanswerable** (unit mismatch creates intractable noise; go to Branch 4).

  2. **Branch 2 (Korean Divergence Diagnostic)**:  
     *How do you explain North/South Korea’s divergence since 1945?*  
     → **A. Institutions** (e.g., centralized planning vs. markets; go to Branch 5).  
     → **B. External factors** (e.g., US vs. USSR support; go to Branch 6).  
     → **C. Culture or path dependence** (e.g., pre-1945 Japanese influence; go to Branch 7).

  3. **Branch 3 (Subnational Granularity)**:  
     *What explains subnational gaps (e.g., north/south Italy, coastal/inland Africa)?*  
     → **A. Local institutions** (e.g., property rights in frontier regions; → **Leaf: Localized institutions view**).  
     → **B. Geographic factors** (e.g., soil, disease, or ports; → **Leaf: Deep-geography determinism**).  
     → **C. Cultural enclaves** (e.g., ethnic/religious groups; → **Leaf: Culture as independent variable**).

  4. **Branch 4 (Causal Inference Feasibility)**:  
     *With ~150 countries, centuries of data, and reverse causation (e.g., wealth → institutions), can we identify causes?*  
     → **A. Yes, with methods** (e.g., natural experiments; go to Branch 2).  
     → **B. No, too few data points** (e.g., instruments fail; → **Leaf: Causal-inference skeptic**).  
     → **C. No, nation-states are arbitrary** (e.g., borders change; → **Leaf: Causal-inference skeptic**).

  5. **Branch 5 (Institutions Depth)**:  
     *Are institutions the ultimate cause? Consider reversal of fortune: Why did colonizers build extractive institutions in rich pre-1500 Americas but inclusive ones in poor regions?*  
     → **A. Yes, institutions are fundamental** (e.g., critical junctures like colonization; → **Leaf: Strong institutions view**).  
     → **B. No, institutions are shaped by geography** (e.g., disease/mortality shaped settler choices; → **Leaf: Geography → institutions view**).  
     → **C. No, institutions are shaped by culture** (e.g., European norms transplanted; → **Leaf: Culture → institutions view**).

  6. **Branch 6 (External Factors Depth)**:  
     *Do global forces (e.g., colonialism, trade) explain gaps? Consider landlocked tropics (e.g., Bolivia, Chad) dominating the bottom of rankings.*  
     → **A. Yes, structural disadvantage** (e.g., no ports, trapped in periphery; → **Leaf: Global system view**).  
     → **B. Partly, but mediated by geography** (e.g., tropics limit state capacity; → **Leaf: Geography → institutions view**).  
     → **C. Partly, but mediated by culture** (e.g., colonial legacies shape norms; → **Leaf: Culture → institutions view**).

  7. **Branch 7 (Culture Depth)**:  
     *Is culture an independent cause? Consider Haiti vs. Dominican Republic (same island, divergent outcomes).*  
     → **A. Yes, culture is fundamental** (e.g., norms of trust; → **Leaf: Culture as independent variable**).  
     → **B. No, culture is shaped by geography** (e.g., disease/agriculture → work ethic; → **Leaf: Geography → culture view**).  
     → **C. No, culture is shaped by institutions** (e.g., laws → social cohesion; → **Leaf: Institutions → culture view**).

  8. **Branch 8 (Geography Depth)**:  
     *Is geography the ultimate cause? Consider reversal of fortune: Why did temperate colonies (e.g., US) outperform tropical ones (e.g., Brazil) despite similar colonial origins?*  
     → **A. Yes, geography is fundamental** (e.g., climate/disease → productivity; → **Leaf: Deep-geography determinism**).  
     → **B. No, geography works through institutions** (e.g., crops → property rights; → **Leaf: Geography → institutions view**).  
     → **C. No, geography works through culture** (e.g., irrigation → collectivism; → **Leaf: Geography → culture view**).

  9. **Branch 9 (Persistence Diagnostic)**:  
     *Why do gaps persist for centuries? Consider Egypt (rich in antiquity, poor today) vs. Switzerland (poor in 1500, rich today).*  
     → **A. Institutional persistence** (e.g., extractive cycles; → **Leaf: Strong institutions view**).  
     → **B. Geographic constraints** (e.g., aridification, disease; → **Leaf: Deep-geography determinism**).  
     → **C. Cultural persistence** (e.g., religious norms; → **Leaf: Culture as independent variable**).  
     → **D. All paths lead to dead ends** (e.g., too many confounders; → **Leaf: Causal-inference skeptic**).

  ---

  ### **Leaves (Positions)**  
  1. **Strong institutions view**: Institutions (inclusive vs. extractive) are the root cause, shaped by critical junctures (e.g., colonization).  
  2. **Deep-geography determinism**: Geography (climate, disease, species, axis) is the root cause.  
  3. **Culture as independent variable**: Culture (norms, beliefs) is the root cause.  
  4. **Causal-inference skeptic**: Gaps are real, but causes are unidentifiable at nation-state level due to data/endogeneity.  
  5. **Geography → institutions view**: Geography causes institutions, which cause development (multiplicative).  
  6. **Culture → institutions view**: Culture causes institutions, which cause development (multiplicative).  
  7. **Geography → culture view**: Geography causes culture, which causes development (multiplicative).  
  8. **Institutions → culture view**: Institutions cause culture, which causes development (multiplicative).  
  9. **Localized institutions view**: Subnational institutions (e.g., city-states, frontiers) drive gaps.  
  10. **Global system view**: Global hierarchies (core/periphery) override local factors.  

  **Unoccupied/Incoherent Positions**:  
  - Pure culture with no geography/institutional channel (ignores cases like Korea).  
  - Pure institutions with no critical juncture (ignores reversal of fortune).  
  - Geography with no institutional/cultural mediation (rare; most accept some mediation).  

  **Observational Equivalence Flags**:  
  - **Strong institutions vs. Geography → institutions**: Identical on Korea/reversal cases (e.g., both predict extractive institutions in tropics). Only separable if geography has *direct* effects (e.g., disease burden).  
  - **Culture as independent variable vs. Institutions → culture**: Identical on Haiti/DR; separable only if culture pre-dates institutions (e.g., pre-colonial norms).  
  - **Skeptic vs. Others**: Skeptic rejects all diagnostic cases as confounded; others treat them as evidence.  

  ---

  ### **Scoring Key**  
  *Match your branch answers to positions:*  
  - **Mostly 1A, 2A, 5A**: **Strong institutions view**.  
  - **Mostly 1A, 2B, 8A**: **Deep-geography determinism**.  
  - **Mostly 1A, 2C, 7A**: **Culture as independent variable**.  
  - **Mostly 1B, 3A**: **Localized institutions view**.  
  - **Mostly 1B, 3B**: **Deep-geography determinism**.  
  - **Mostly 1C, 4B/C**: **Causal-inference skeptic**.  
  - **Mostly 5B, 6B, 8B**: **Geography → institutions view**.  
  - **Mostly 5C, 6C, 7B**: **Culture → institutions view**.  
  - **Mostly 7C, 8C**: **Geography → culture view** or **Institutions → culture view**.  

  ---

  ### **Teaching Notes**  
  - **Why this tree works**: Forces engagement with concrete cases (Korea, Americas, tropics) before theoretical labels. The skeptic is robustly integrated (Branches 1C, 4B/C, 9D). Multiplicative views are non-cop-out branches (e.g., 5B, 6B, 7B).  
  - **Weaknesses flagged**: Observational equivalence between institutions/geography→institutions is explicit; "unoccupied positions" show logical gaps.  
  - **How to use**: Have students vote at each branch. At leaves, reveal positions and debate equivalence (e.g., "If you ended at strong institutions, could geography→institutions explain your answers equally well?").  
  - **Adaptation**: Swap cases (e.g., use Botswana vs. neighboring states for institutions) if better fits your syllabus.  

  This structure ensures students can't retreat to "it's a mix"—they must confront trade-offs and evidentiary conflicts. Let me know if you'd like a visual flowchart version!
