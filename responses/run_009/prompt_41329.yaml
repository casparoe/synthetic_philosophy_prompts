  2. **Deep-geography determinism**: Geography (climate, disease, resources) is the fundamental cause.
  3. **Strong institutions view**: Institutions (inclusive vs. extractive) are the fundamental cause.
  4. **Culture as independent variable**: Cultural traits (e.g., trust, innovation) are the fundamental cause.
  5. **Geography working through institutions**: Geography shapes institutions, which then cause development.
  6. **Culture working through institutions**: Culture shapes institutions, which then cause development.
  7. **Geography working through culture**: Geography shapes culture, which then causes development.
  8. **Institutions working through culture**: Institutions shape culture, which then causes development.
  9. **Global structuralist**: Global position (core vs. periphery) is the fundamental cause.

  **Note on Observational Equivalence**: 
  - The tree cannot distinguish between "Strong institutions view" and "Geography working through institutions" in cases where geography perfectly predicts institutions (e.g., settler mortality instruments). Similarly, "Geography working through institutions" and "Deep-geography determinism" (with both direct and indirect effects) may look alike if both channels are present.

  **Scoring Key (Partial)**:
  - If you answered:
     - 1B: You're a skeptic.
     - 2A and 3A and 6C: Strong institutions view.
     - 2A and 3A and 6A: Geography working through institutions.
     - 2A and 3B and 7B: Deep-geography determinism.
     - 2A and 3C and 8C: Culture as independent variable.
     - 2B and 4A: Deep-geography determinism (regional).
     - 2C and 5A: Global structuralist.

