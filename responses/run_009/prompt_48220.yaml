prompt: |-
  I just started as the welfare coordinator at a mid-sized public aquarium (first real job out of school, started in january), and I've discovered there's basically no policy for any of the welfare calls that actually land on my desk. We hold everything from a giant Pacific octopus to cleaner shrimp to hundreds of fish species, and the questions come up weekly: which species get enrichmment programs, whether a transport or a tagging procedure warrants analgesia, when a struggling animal gets palliative care versus euthanasia. Our vet is great with mammals but openly says she "doesn't do fish feelings," and the board wants something written down they can defend to the public, especially now that the UK has started listing decapods and cephalopods as sentient, so inspectors ask us about the lobsters too.

  What I need is a procedure I can actually run on a proposal: the questions in order, what counts as a sufficient answer to each, where it stops with a no, and where it hands the decision to me or the vet because it's a values call rather than a facts one.

  The hard part is that the procedure has to take a stance on something I keep going back and forth on, and this is where I want the real thinking: whether an animal's moral weight is a threshold thing (a species either counts fully or not at all, pending some evidence bar) or a graded thing (a zebrafish's pain counts at whatever credence you place on fish sentience, times its intensity). The threshold view makes the policy clean but arbitrary at the border, and the graded view makes the math defensible but genuinely weird -- a procedure built on it will happily trade one octopus against three hundred danios, and my staff will revolt. So decide between them (or find the third option I'm missing), tell me which distinctions survive the simplification and which you're dropping, and be honest about where the procedure will misfire.

  Then run it on two live cases. First: our octopus is getting bored and destructive in her exhibit, and enrichment for her would eat the whole enrichment budget I'd otherwise spread across the fish tanks. Second: the vet wants to insert a tag in a stingray without analgesia, since fish analgesia is under-studied and she doubts rays feel it the way mammals do. And flag it clearly if the procedure gives me an answer I won't like -- my suspicion is that on the budget case it sides with the fish by sheer numbers, and I'd rather know that now than find out when the octopus has pulled half the tank apart. Budget is small enough that we're always choosing, not adding, so definately don't give me a procedure whose answer to everything is "both."
reasoning: |-
  Okay, let me start by unpacking the user's situation. They're a new welfare coordinator at an aquarium, dealing with no existing policies on animal welfare decisions. They need a structured procedure to handle proposals, especially with the UK recognizing decapods and cephalopods as sentient. The core dilemma is whether moral weight should be a threshold (binary) or graded (sliding scale) approach. 

  First, I need to understand their main pain points. The user mentioned staff revolt if the policy seems to trade one octopus for hundreds of danios. They want clarity without alienating the team. Also, the vet's expertise is mammal-centric, leaving fish and invertebrates in a gray area. The board wants defensible policies for public and inspectors. 

  The user provided two specific cases: the octopus enrichment budget and stingray tagging without analgesia. They need the procedure to give clear answers, even if unpopular. The budget constraints mean trade-offs are inevitable, so the procedure must handle prioritization.

  Now, considering their deeper needs. They're new to the role, so they likely need a framework that's both scientifically credible and practical for daily use. They might fear backlash from staff or public if decisions seem heartless or arbitrary. The mention of the UK's sentience laws suggests they need compliance but also want to anticipate future regulatory changes. 

  Looking at the options: threshold vs. graded. Threshold is simpler but arbitrary at boundaries. Graded is nuanced but could lead to uncomfortable math. A hybrid model might work—using threshold categories based on evidence tiers, then graded within tiers. That way, species are grouped by sentience evidence (e.g., cephalopods in high tier, fish in medium, shrimp in low), then graded by intensity or other factors within tiers. This avoids direct species trade-offs across tiers but allows flexibility within groups.

  For the procedure steps, it should start with sentience assessment, then welfare impact, mitigations, alternatives, and decision points. Key is defining evidence categories and who decides when evidence is insufficient. The vet handles medical, welfare coordinator for ethical calls, director for budget shifts.

  Applying to the octopus case: High sentience tier, severe welfare impact. Enrichment is effective. Budget trade-offs within the same tier aren't needed since it's the only cephalopod. Reallocating funds from lower tiers (fish) might be justified, but staff morale is a concern. The procedure might approve octopus enrichment but flag the budget issue, suggesting fundraising.

  For the stingray: Moderate sentience tier, moderate welfare impact. Tagging causes pain, analgesia under-studied but available. The procedure would require analgesia or pilot testing, rejecting the vet's "no analgesia" approach. This might cause friction but is defensible.

  Potential misfires: Staff might resist reallocating budgets from fish to invertebrates. The stingray decision challenges the vet's authority. Transparency and involving staff in evidence reviews could mitigate this. Also, the procedure might need flexibility for new research.

  User's unspoken needs: Establishing authority as a new coordinator, creating buy-in from staff, balancing science with practicality, and protecting the aquarium's reputation. The procedure must be robust enough to justify tough calls without causing internal conflict.
answer: |-
  Here's a comprehensive welfare decision procedure designed for practicality, scientific defensibility, and clear trade-offs – built on a **Hybrid Threshold-Graded Model** that avoids the pitfalls of both extremes while acknowledging your staff's operational reality.

  **Core Philosophy: Tiered Thresholds with Graded Implementation**
  1.  **Threshold Tiers:** Animals are grouped into **Sentience Evidence Tiers** (SETs) based on the best available science regarding capacity for suffering. This avoids "does it count?" debates for each case.
  2.  **Graded Implementation:** *Within* each tier, welfare interventions are prioritized based on **intensity/duration of potential suffering, effectiveness of intervention, and feasibility**. This allows nuance without cross-tier trade-offs (e.g., never trading an octopus for danios).

  **Sentience Evidence Tiers (SETs):**
  *   **SET 1 (High Confidence):** Strong evidence of complex sentience, pain perception, & negative affective states (e.g., Mammals, Birds, Cephalopods, Decapod Crustaceans (lobsters, crabs, shrimp)). *Presumption: Suffering matters significantly.*
  *   **SET 2 (Moderate Confidence):** Good evidence of nociception, simpler pain perception, & stress responses; sentience plausible but less complex (e.g., Bony Fish (incl. rays), Cartilaginous Fish (sharks), some reptiles/amphibians). *Presumption: Suffering matters; requires mitigation proportional to evidence.*
  *   **SET 3 (Low Confidence/Ambiguous):** Limited or conflicting evidence for pain/sentience beyond basic nocifensive reflexes (e.g., Jawless Fish, many invertebrates like cleaner shrimp, jellyfish). *Presumption: Prioritize minimizing observable stress/distress; interventions based on precautionary principle where feasible.*
  *   **SET U (Unknown/New Species):** Insufficient data. Assign temporarily to SET 2 pending review.

  **The Welfare Decision Procedure:**
  *(Run this for any proposal impacting animal welfare - enrichment, procedure, euthanasia, housing change)*

  1.  **Identify Subject & SET:**
      *   Which species/individual(s) are affected? **--> Assign SET (Use Reference List - see below).**
      *   *Sufficient Answer:* Species identified. SET assigned based on approved reference list.
      *   *Stop If:* Species cannot be identified. *Handoff:* Welfare Coordinator (WC) assigns SET U pending research.

  2.  **Nature & Scale of Welfare Impact:**
      *   Describe the *potential* negative state (pain, fear, boredom, stress, discomfort) and its expected **intensity** (mild, moderate, severe) and **duration** (seconds/minutes, hours, days, chronic).
      *   *Sufficient Answer:* Specific impact described with intensity/duration estimate (e.g., "Moderate pain lasting 10-15 minutes during tagging," "Severe chronic boredom leading to self-harm").
      *   *Stop If:* Impact is trivial or non-existent. Proceed if impact is plausible and non-trivial. *Handoff:* Vet for pain/medical impacts; WC for behavioral/psychological impacts.

  3.  **Proposed Action & Alternatives:**
      *   What is being proposed? (e.g., Perform procedure X without analgesia, Provide enrichment Y, Euthanize).
      *   What are the **feasible alternatives**? (e.g., Use analgesia Z, Different enrichment, Palliative care).
      *   *Sufficient Answer:* Action and at least one considered alternative described.
      *   *Stop If:* No action is proposed or alternatives are dismissed without justification.

  4.  **Mitigation & Effectiveness:**
      *   How effective is the proposed action (or alternative) at **preventing or reducing** the identified negative impact?
      *   What are the **risks/costs** of the mitigation? (Financial, time, staff safety, other animal welfare impacts).
      *   *Sufficient Answer:* Effectiveness estimate (High/Moderate/Low/Very Uncertain) and key risks/costs outlined.
      *   *Handoff:* Vet for medical efficacy/risks; WC for behavioral/enrichment efficacy; Director for major budget/operational costs.

  5.  **SET-Based Decision Thresholds:**
      *   **SET 1:** **Mandatory Mitigation.** High-impact procedures/conditions *require* proven effective mitigation (analgesia, enrichment, environmental change) unless clinically contraindicated *and* no alternative exists. Euthanasia justified for untreatable severe suffering.
      *   **SET 2:** **Strong Presumption for Mitigation.** Mitigation is generally required for moderate/severe impacts. Required where effective & feasible. Low-impact procedures may proceed with monitoring. Euthanasia justified for significant suffering with poor prognosis.
      *   **SET 3:** **Precautionary Principle & Basic Welfare.** Focus on minimizing observable stress/distress. Mitigation required if highly effective, low-cost, and addresses clear distress signals. Euthanasia primarily for population health/untreatable disease, less for "suffering" alone.
      *   **SET U:** Treat as **SET 2** until classified.

  6.  **Final Decision & Authorization:**
      *   Apply the SET threshold.
      *   *Within SET:* Prioritize based on **Impact Score = Intensity x Duration**. Higher scores get priority for resources/mitigation.
      *   Document: SET, Impact Score, Proposed Action + Mitigation, Alternatives considered, Justification for choice.
      *   *Authorization:* Vet signs off for medical procedures. WC signs off for behavioral/environmental decisions. Director signs off if major budget reallocation or high-public-interest decision.

  **Key Simplifications & Misfires:**
  *   **Dropped:** Perfect quantification of "moral weight." We use SETs as defensible categories.
  *   **Dropped:** Direct cross-SET trade-offs (octopus vs. danios). Resources are allocated *within* SETs first, based on Impact Score. SET 1 gets highest *priority*, but budget realities mean SET 2/3 projects might be deferred *if* high-impact SET 1 needs exist.
  *   **Misfire 1:** An SET 2 species with overwhelming evidence for complex sentience in new research might be under-protected until the SET list is updated (Requires annual review!).
  *   **Misfire 2:** A highly charismatic SET 3 animal might get more resources than a suffering SET 2 animal due to public pressure (Procedure helps resist this, but leadership must uphold it).
  *   **Misfire 3:** Truly novel situations (e.g., first-time procedure on an SET U animal) require cautious judgment calls (handled by WC/Vet/Director).

  **Applying to Your Cases:**

  **Case 1: Octopus Enrichment vs. Fish Budget**
  1.  **Subject & SET:** Giant Pacific Octopus. **SET 1 (High Confidence).**
  2.  **Welfare Impact:** **Severe** boredom/frustration (evidenced by destructiveness), **Chronic** duration. **Impact Score = Severe x Chronic = Very High.**
  3.  **Proposed Action:** Dedicate entire enrichment budget to octopus program. *Alternative:* Split budget per previous plan.
  4.  **Mitigation:** Enrichment highly effective for SET 1 animals in reducing boredom. *Cost:* Entire enrichment budget for other species (primarily SET 2 fish).
  5.  **SET Decision:** **SET 1 Mandatory Mitigation.** Severe chronic suffering *must* be addressed. Enrichment is a primary mitigation.
  6.  **Final Decision & Trade-off:**
      *   **Procedure Says:** **Approve octopus enrichment.** Mandatory mitigation for SET 1 severe chronic suffering takes precedence. The suffering of the octopus cannot be ignored.
      *   **Within-SET Trade-off:** Since it's the only SET 1 animal needing enrichment *now*, its Impact Score is paramount.
      *   **Bad News:** Yes, the fish (SET 2) lose their enrichment budget. This *will* cause discontent.
      *   **Mitigation Strategy:** Document clearly: SET 1, Severe/Chronic Impact, Mandatory Mitigation. Communicate the *why* to staff based on science/tiers. **Immediately pursue:** (a) Seeking emergency supplemental funding for fish enrichment. (b) Developing ultra-low-cost fish enrichment (e.g., environmental changes, feeding variations). (c) Prioritizing fish enrichment for tanks showing highest stress (using Impact Score within SET 2).

  **Case 2: Stingray Tagging without Analgesia**
  1.  **Subject & SET:** Stingray (Batoidea). **SET 2 (Moderate Confidence - Bony/Cartilaginous Fish).**
  2.  **Welfare Impact:** **Moderate** pain (injection/tissue disruption), **Short-Term** (minutes-hours). **Impact Score = Moderate x Short-Term = Moderate.**
  3.  **Proposed Action:** Insert tag without analgesia. *Justification:* Under-studied, doubts on pain perception. *Alternative:* Use available fish analgesia (e.g., lidocaine immersion/injection, MS-222); Delay for research; Find non-invasive method.
  4.  **Mitigation:** Analgesia effectiveness in rays: **Very Uncertain** (under-studied), but proven effective in related fish. Risk: Low (standard drugs, used in other fish). Cost: Low (drug cost, minor time).
  5.  **SET Decision:** **SET 2 Strong Presumption for Mitigation.** Moderate pain impact warrants mitigation if feasible and not contraindicated.
  6.  **Final Decision:**
      *   **Procedure Says:** **Reject "no analgesia" proposal.** The presumption for mitigation for moderate pain in SET 2 is strong. "Very Uncertain" effectiveness ≠ "Ineffective." Precaution dictates using available analgesia unless specific contraindication exists *for this species/procedure*.
      *   **Requires:** Use approved fish analgesia protocol OR provide strong, species-specific evidence (beyond "doubt") that analgesia is ineffective/unnecessary OR choose a less invasive method.
      *   **Bad News:** Challenges the vet's judgment. Requires her to engage with fish analgesia literature or change approach.
      *   **Mitigation Strategy:** WC presents SET 2 rationale and literature on fish analgesia efficacy (even if broader). Propose piloting analgesia on 1-2 rays with close monitoring. Emphasize public/regulatory risk of not using precaution.

  **Why this Hybrid Model Works for You:**
  *   **Defensible:** Tiers based on UK legislation (Cephalopods/Decapods as SET 1) and current science. Graded impact within tiers is logical.
  *   **Arbitrariness Contained:** Thresholds exist only at tier boundaries, informed by evidence reviews. Internal grading avoids fine-line species debates.
  *   **Avoids Revolt:** No cross-tier trade-offs. An octopus isn't "worth more fish," it triggers a mandatory requirement *within* its high-priority tier. Fish are still protected within SET 2.
  *   **Actionable:** Clear yes/no thresholds per SET plus prioritization logic for resource allocation.
  *   **Manages Uncertainty:** SET U and "Very Uncertain" mitigation trigger precaution or require evidence-based justification to *not* act.
  *   **Board Friendly:** Documented SETs, Impact Scores, and clear decision rules provide a strong audit trail.

  **Critical Next Steps:**
  1.  **Develop the Official SET List:** Collaborate with the vet (even grudgingly), external fish/invert experts, and literature review. Codify it. Review annually.
  2.  **Define "Impact Scores":** Create simple scales (e.g., Intensity: Mild/Mod/Severe; Duration: Short/Medium/Long/Chronic) and a multiplication grid (e.g., Severe x Chronic = Critical).
  3.  **Establish Review Authority:** Clarify WC/Vet/Director sign-offs formally.
  4.  **Communicate & Train:** Explain the *logic* (tiers, impact scores, no cross-trades) to staff early to manage expectations (like the fish enrichment cut). Frame it as science-based and fair prioritization under constraint.

  This procedure forces tough, defensible choices. It will sometimes say "no" or require unpopular resource shifts (like funding the octopus), but it does so transparently, based on the best available evidence and a logical ethical framework, not whim. It gives you and the board clear answers and justifications.
