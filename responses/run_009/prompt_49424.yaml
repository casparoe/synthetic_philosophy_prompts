prompt: |-
  For an upper-level seminar on Wittgenstein (12 students, 80 minutes), design a structured activity in which participants run into family resemblance rather than being told about it. Premise: the students form a translation committee for a field linguist who has brought back descriptions of roughly two dozen practices from a community that uses a single word — invent the word and the practices — covering a cluster of activities sharing overlapping features but no feature common to all of them. The committee must first sort the described practices into "yes" and "no" piles by consensus, then write a definition of the word stating necessary and sufficient conditions, and finally a rotating "field agent" must adjudicate novel borderline cases invented by the other students, using the written definition as the only permitted authority and no appeals to intuition. Provide materials, rules, a timeline, some stake or scoring structure, and a debrief that maps the predictable failure of the definitions onto family resemblance and onto the thought that a concept is held together by shared reactions and agreement in judgment rather than by definitions. Also name at least two things that will predictably go wrong on the first run and how to handle them, and be frank about which feature of Wittgenstein's view no classroom game of this sort can reproduce and the facilitator must supply separately.
reasoning: |-
  We are designing an activity for a seminar on Wittgenstein. The goal is to have students experience the concept of "family resemblance" without being told about it explicitly. The premise is that they are a translation committee for a field linguist who has collected descriptions of practices from a community that uses a single word (which we will invent) for a cluster of activities that share overlapping features but have no single feature common to all.

  We'll call the invented word "Glom". The practices described will be a set of roughly two dozen activities that share features but without any one feature present in every practice.

  **Materials:**
  - A set of 24 cards (or slips of paper), each describing a practice that the community labels as "Glom". These practices should form a family resemblance chain: each shares some features with some others, but no feature is present in all. Also, include a few practices that are clearly not "Glom" (say 6) to make the sorting non-trivial.
  - A whiteboard or flip chart for the committee to write their definition.
  - A timer.
  - A rule sheet for the activity.

  **Rules:**
  1. The committee must sort the 30 practices (24 "Glom" and 6 non-"Glom") into "yes" (Glom) and "no" (not Glom) piles by consensus. No voting; they must discuss until they agree on each one. (Time: 25 minutes)
  2. After sorting, they must write a definition of "Glom" that states necessary and sufficient conditions. (Time: 15 minutes)
  3. Then, the activity moves to the borderline cases. Each student (except the current "field agent") writes one novel borderline case (a practice that is not in the original set and that they think might be hard to classify). The field agent (who rotates each round) must use the written definition (and only the definition) to decide if the borderline case is "Glom" or not. The field agent cannot appeal to intuition or the original examples; they must strictly apply the definition. The committee can challenge the field agent's ruling only by pointing to the definition. (Time: 25 minutes, with about 2 minutes per case and 12 cases, but we might not get through all; we can do as many as time allows and then debrief)
  4. The facilitator will keep time and enforce the rules.

  **Stake/Scoring:**
  - The committee gets 1 point for every correct sort (based on the intended family resemblance structure) during the initial sort. (But note: we don't want to reveal the intended answers until the debrief, so we might keep track and reveal at the end for the purpose of reflection, but not for competition during the activity. Alternatively, we can skip scoring the initial sort and focus on the definition phase and borderline cases.)
  - During the borderline cases, the field agent gets 1 point for every ruling that the committee (by consensus) agrees is consistent with the definition. The committee as a whole gets 1 point for every challenge they successfully make (by showing the ruling is inconsistent with the definition). However, note that the definition might be flawed, so we are scoring adherence to the definition, not to the original concept.
  - Alternatively, to avoid competition and focus on the experience, we can skip points and just have a discussion. But to add stakes, we can frame it as: the committee's goal is to produce a definition that can handle new cases without controversy, and the field agent's goal is to apply the definition faithfully.

  Given the pedagogical aim, I suggest not having a competitive score but rather using the points as a way to track the problems. We can tell the students that we are tracking how well the definition holds up, but the real goal is to see what happens.

  **Timeline:**
  - Introduction and setup: 5 minutes
  - Sorting activity: 25 minutes
  - Writing the definition: 15 minutes
  - Borderline cases: 25 minutes (allowing for about 10 cases at 2.5 minutes each, but we can adjust)
  - Debrief: 10 minutes

  Total: 80 minutes.

  **Debrief:**
  After the activity, the facilitator leads a discussion:
  1. Ask the students about the initial sorting: Was it easy to agree? Were there any practices that were hard to classify? Why?
  2. Ask about the definition: Was it easy to write? Did they feel it captured all the "yes" cases and excluded the "no" cases? Did they notice any problems?
  3. Ask about the borderline cases: How did the definition hold up? Were there cases where the definition gave an answer that felt wrong? Were there cases where the definition was ambiguous?
  4. Then, reveal the family resemblance structure of the original set. Show that there is no single feature common to all "Glom" practices, but there are overlapping similarities. Point out that the definition they wrote probably had to be either too broad (including some non-Glom) or too narrow (excluding some Glom) or both, and that when they applied it to borderline cases, it might have led to counterintuitive results.
  5. Connect to Wittgenstein: Concepts are not held together by definitions (necessary and sufficient conditions) but by a network of overlapping similarities (family resemblances). Moreover, our use of such concepts is grounded in shared reactions and agreement in judgments. The activity shows the failure of definitions and the need for a different account of concepts.
  6. Also, point out that in the activity, the committee had to rely on consensus and shared judgment, which mirrors how language works in a community.

  **Predictable Problems and Handling:**
  1. **Problem 1:** The committee might get stuck during the initial sort because they cannot agree on a practice. 
     - *Handling:* The facilitator can suggest that they set aside that practice for later and move on. They can come back to it after they have more agreement on others. Also, remind them that the goal is to get a working consensus, not absolute certainty.

  2. **Problem 2:** The definition they write might be very vague or very long and complex, making it hard to apply in the borderline cases. 
     - *Handling:* That's part of the learning experience. The facilitator should let them struggle with it. During the debrief, this will be a point of discussion: why did the definition fail? Also, during the borderline cases, if the definition is too vague, the field agent will have to make a judgment call, which will show the problem.

  **What the Game Cannot Reproduce:**
  The activity cannot reproduce the embeddedness of concepts in a form of life. In Wittgenstein's view, the use of a word is tied to the entire way of life of a community, including their training, reactions, and practices. In the game, the students are only given descriptions and are trying to abstract a definition. They are not embedded in the community and have not been trained in the use of the word. The facilitator must point out that in real life, we learn concepts by being trained in their use and by sharing in the form of life, which gives us the "bedrock" of shared reactions that the game lacks.

