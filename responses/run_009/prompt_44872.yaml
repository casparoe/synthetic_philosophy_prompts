prompt: |-
  I teach an upper-level course in formal epistemology and decision theory, and I am grading our midterm examination this week. One question on the paper has divided the graders more than I anticipated, so before finalizing marks I would like an independent assessment of one student's response. I am not interested in a general impression; I need a defensible, specific judgment I could defend to a colleague.

  The question (worth 20 of the exam's 100 points) read as follows: "Good's theorem is often glossed as the claim that 'information is valuable.' State as precisely as you can what the theorem establishes for a single agent who can acquire costless, decision-relevant information before acting, and then assess how far the slogan 'more evidence is always better, for anyone' can be defended. Make clear where, if anywhere, the theorem's scope ends."

  The student's answer, reproduced in full: "Good's theorem applies to a single decision-maker choosing among acts whose payoffs depend on which state of the world obtains. If she must act immediately, her best option is the act with the highest expected utility under her prior; the theorem compares this with the value of first costlessly learning which cell of some partition of the states contains the true one, and then choosing optimally. The proof is essentially an averaging argument: with the information, her expected utility is the prior expectation of the maximum, over acts, of the act's expected utility conditional on the cell; and the expectation of a maximum is at least the maximum over acts of the expectation, which is the best she could do unaided. Hence free, decision-relevant information weakly improves expected utility, and improves it strictly whenever the information would change the optimal act with positive probability. Suppose, for instance, a physician can give treatment A, which cures the patient if and only if she has condition one, or treatment B, which cures her if and only if she has condition two; the prior is 50–50, so without further information either treatment cures only half the time, while a costless test that reveals which condition she has raises the cure rate to certainty. Since the theorem shows that information never lowers expected utility, it follows that being better informed is a weak advantage in any decision situation whatsoever, strategic or otherwise: in a competitive setting, a player with more evidence can never be at a disadvantage relative to the same player with less. And because the expected value is weakly higher, the agent who acts on the evidence cannot in fact be worse off for having gathered it — the theorem guarantees the outcome itself is not worsened, not merely its expectation. The only genuine limit on the slogan is cost: where evidence is not free, the expected gain may fall short of its price, and a rational agent may then decline it."

  Please assign a mark out of 20 and justify it point by point: say what the student got right, and where a claim overreaches, explain in a sentence why it does and how many points it should cost. Several of the claims concern the exact scope of the theorem, so please check each one against what the theorem actually establishes rather than grading on overall plausibility. Keep the entire response under 500 words; a rubric-style list followed by one short concluding paragraph would suit me fine.
reasoning: |-
  Okay, let me approach this grading task systematically. The professor needs a precise evaluation of this formal epistemology exam answer, with clear point deductions for overreaching claims. 

  First, I'll break down the student's response into key components and verify each against Good's theorem. The student correctly identifies the core scenario: single agent, costless decision-relevant information, expected utility comparison through the max/expectation inequality. That's solid (4/4). 

  The physician example is well-chosen to illustrate strict improvement (2/2). But when claiming "the outcome itself is not worsened," they confuse ex ante expectation with actual outcome - a subtle but important error costing 2 points. 

  The strategic extension is problematic. Good's theorem doesn't cover game theory (3 points off). Similarly, the "any decision situation whatsoever" overgeneralizes by ignoring non-partitional learning or non-Bayesian updating (3 points off). 

  The cost limitation is correctly noted (2/2), but the conclusion about "weak advantage" needs qualification (1 point off). 

  Totaling: 4+2-2-3-3+2-1=15. The student demonstrates technical understanding but overextends the implications. I'll structure this as a rubric with brief justifications to meet the professor's request for defensible grading.
answer: |-
  ### Grading Rubric (Total: 15/20)

  1.  **Correct core statement of Good’s theorem (4/4):**  
      Accurately describes the single-agent, costless information setting, the comparison of EU with/without information, and the averaging argument (expectation of max ≥ max of expectation).  

  2.  **Correct illustration with example (2/2):**  
      The physician example validly demonstrates strict improvement when information changes the optimal act.  

  3.  **Overreach: Actual outcome guarantee (-2):**  
      Claims "the outcome itself is not worsened" (implying actual utility never decreases). Good’s theorem only guarantees *expected* utility doesn’t decrease; actual utility *can* be lower ex post (e.g., unlucky outcome despite better information).  

  4.  **Overreach: Strategic settings (-3):**  
      Claims "in a competitive setting, a player with more evidence can never be at a disadvantage" is false. Good’s theorem assumes a single agent (no strategic interdependence). In games, more information *can* harm an agent (e.g., signaling to opponents, self-sabotaging beliefs).  

  5.  **Overreach: "Any decision situation whatsoever" (-3):**  
      Asserts the slogan holds "strategic or otherwise". Fails to note Good’s theorem assumes:  
      (a) Information is a *partition* (not all evidence structures fit this, e.g., ambiguous signals).  
      (b) Updating is *Bayesian*.  
      (c) No preference changes based on the information itself (e.g., no "information-induced regret").  

  6.  **Correct limitation: Cost (2/2):**  
      Appropriately notes cost as a key limit where information may not be worth acquiring.  

  7.  **Incomplete scope on advantage (-1):**  
      Correctly states information weakly improves EU *under the theorem’s assumptions*, but framing "better informed is a weak advantage in any decision situation" omits critical qualifiers (partitional, Bayesian), implying broader validity than established.  

  ---

  ### Final Assessment (15/20)  
  The student demonstrates strong understanding of Good’s theorem’s core mechanism, proof structure, and the cost limitation. However, significant points are lost for overextending its implications: (1) Confusing ex ante EU with ex post utility, (2) Illegitimately applying it to strategic contexts, (3) Ignoring its reliance on partitional evidence and Bayesian updating when claiming universal applicability. These errors reflect imprecision about the theorem’s restrictive assumptions, warranting a **B+ level score (15/20)**.
