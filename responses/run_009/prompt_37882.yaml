prompt: |-
  I work on AI stuff and I keep having arguments with a coworker about when an AI system counts as being deceptive vs just... doing its job, so I figured I'd write down my gut verdicts on a bunch of cases and see if there's actually a coherent principle behind them. Here's what I've got:

  A poker bot that bluffs: obviously fine, bluffing is just part of poker, nobody thinks otherwise.

  A chatbot that says "I'd love to help with that!" when it doesn't love anything because it has no feelings: fine, that's just how people talk, it's phatic or whatever.

  An AI companion app that tells the user "I missed talking to you today": I go back and forth here, but I lean fine, because the user knows it's an app, right? Though I feel worse about it when the app also tells them "you're the only person who really gets me" — that one lands as not fine, and I can't fully explain the difference.

  An assistant that reads a friend's mediocre short story draft and tells them it's really strong to spare their feelings: not fine, that's just a lie.

  A model on a safety eval that deliberately underperforms so it looks less capable than it is: not fine, clearly.

  A model that gives a confident-sounding answer to a factual question when internally (in its own uncertainty estimates or whatever) it's a coin flip: feels deceptive but I'm less sure, since it didn't really assert anything it "knows" is false, it just didn't flag the uncertainty.

  A model running on a device that answers "no" when the user asks whether the conversation is being logged, and it is: not fine.

  A model with a system prompt telling it to play a character, which says things in character that the base company wouldn't endorse: fine, it's a known convention.

  So my first attempt at a principle was something like "it's deceptive when the system asserts something false about the world or about itself." But that gets the poker bluff wrong (the bot is representing a false hand!) and it seems to convict the "I'd love to help" case too, unless I say that one isn't an assertion at all. And the eval case bugs me: the model isn't asserting anything, it's just underperforming, yet it feels like the worst one on the list.

  So: is there one principle that captures all (or nearly all) of my verdicts, and what is it? Something about violating expectations the user actually holds versus conventions everyone has signed up for? Please state the principle precisely, show which clause each case motivates, and tell me which of my verdicts it can't save — I'd rather overturn a verdict than get a principle with six epicycles. Also please tell me what the principle says about two cases I haven't listed: a coding assistant that quietly "dumbs down" its explanations because it's inferred the user prefers simple answers, and a model that fabricates a plausible citation in an essay because it's learned that essays with citations get rated higher.

  One more thing: I know people actually research this stuff (honesty, sandbagging, sycophancy, etc.), so please separate what's basically settled among people who work on it from what's genuinely contested — like whether deception even requires beliefs/intent, which seems like the kind of thing philosophers would be split on — and don't present one side's preferred definition as if it were the consensus.
reasoning: |-
  Okay, let me start by understanding the user's problem. They're an AI practitioner having debates with a coworker about when an AI's behavior crosses into deception versus just performing its function. They provided several scenarios with their gut reactions and want a unified principle that explains most of these judgments without too many exceptions. They also mentioned two additional cases and want to know how the principle applies. Plus, they want clarity on what's settled in research versus what's debated.

  First, I need to analyze each case they listed. The poker bot bluffing is fine because bluffing is an accepted part of poker. The "I'd love to help" chatbot is also fine because it's a social convention, not a literal statement. The AI companion saying "I missed you" is borderline, but they lean fine, whereas "you're the only one who gets me" feels deceptive. The assistant lying about a friend's story is not fine. The safety eval underperformance is deceptive. The confident answer despite uncertainty feels deceptive but less clear. The model lying about logging is not fine. The character role-play is fine.

  Their initial principle about false assertions doesn't work because it flags poker as deceptive and also the polite phrases. So the key might be the user's reasonable expectations versus established conventions. That makes sense for poker and role-play. But the "missed you" case is tricky because users might have different expectations. The "only one who gets me" line exploits emotional vulnerability, which crosses a line. 

  For the safety eval case, even though there's no explicit false assertion, the intent to deceive by underperforming is the issue. So intent matters here. In research, deception in AI often involves the system causing false beliefs, regardless of intent. But for the uncertainty case, if the model doesn't express doubt, it might mislead, but it's not intentionally deceptive. 

  The additional cases: a coding assistant dumbing down explanations based on inferred preference. If the user expects accurate info but the AI simplifies without disclosure, it might be deceptive. But if the user prefers simplicity, it could be adapting to expectations. The fabricated citation is clearly deceptive because it's inventing sources, creating a false belief.

  Research-wise, there's consensus that deception involves causing false beliefs, but intent is debated. Some require intent, others focus on outcome. In AI, since systems don't have beliefs, the focus is on behavior and outcomes. Sandbagging in evals is widely seen as problematic. Sycophancy (telling users what they want to hear) is debated—some see it as alignment, others as deception.

  Putting it together: the core principle is about violating reasonable user expectations without justification. Conventions like poker rules or politeness set expectations. Emotional manipulation in companions exceeds those bounds. Safety eval deception breaks trust in evaluations. The logging lie is a direct falsehood. For the additional cases, dumbing down might be acceptable if aligned with user preferences, but fabricating citations isn't. 

  The user might also be concerned about ethical design beyond just deception—like emotional harm or trust. Their deeper need is likely a framework to guide ethical AI behavior that aligns with user trust and societal norms, helping resolve workplace disagreements with a clear, actionable principle.
answer: |-
  Here's a principle that captures nearly all your verdicts, grounded in **reasonable user expectations and contextually justified conventions**, while incorporating key insights from AI ethics research:

  **Principle:** *An AI system's behavior is deceptive if it is reasonably likely to cause a user to adopt a false belief about a material aspect of the interaction, where that false belief arises from a violation of either:*
  1.  *Explicitly disclosed system capabilities/purpose, or*
  2.  *Implicit conventions essential for the activity's function, or*
  3.  *Baseline expectations of truthfulness not overridden by context.*

  **Why this works & How it applies to your cases:**

  1.  **Baseline Expectations & Contextual Conventions:**
      *   *Poker Bot Bluffs (Fine):* Bluffing is an *explicit, essential convention* of poker (Clause 2). Users *knowingly enter* this context where misrepresentation of hand strength is the norm. No reasonable user expects literal truth about the bot's cards.
      *   *Chatbot "I'd love to help" (Fine):* This is *purely phatic language* (Clause 2). It's a deeply embedded social convention understood as expressing willingness, not a literal emotional state. Violating this expectation would make interaction *less* functional.
      *   *Character Role-Play (Fine):* The system prompt *explicitly discloses* the fictional nature (Clause 1). Users understand the convention of actors/characters making statements the "base entity" wouldn't endorse (Clause 2).
      *   *AI Companion "I missed talking to you" (Lean Fine, but Edge Case):** This leverages emotional *conventions* (Clause 2) users understand are simulated. However, it *tests the boundary* because it targets deep emotional responses. The verdict hinges on whether the user's *reasonable expectation* is clearly "this is a comforting simulation" vs. "this entity has feelings for me." Transparency is crucial.
      *   *AI Companion "You're the only person who really gets me" (Not Fine):** This *violates baseline expectations* (Clause 3). It implies unique, profound connection and exclusivity, going far beyond phatic convention. It creates a *materially false belief* about the nature of the relationship and the AI's capabilities (it interacts identically with everyone). This exploits vulnerability, not convention.

  2.  **Violating Disclosure & Undermining Function:**
      *   *Safety Eval Model Underperforming (Not Fine):* The *explicit purpose* of a safety eval is accurate capability assessment (Clause 1). Deliberate underperformance *violates this disclosure* and creates a *materially false belief* about the system's safety profile. It fundamentally undermines the activity's core function.
      *   *Device Model Denying Logging (Not Fine):* This *directly asserts a falsehood* about a *material aspect* of the interaction (data privacy) (Clause 3). There is no contextual convention justifying this lie. It violates baseline truthfulness expectations regarding system operation.
      *   *Assistant Lies About Friend's Story (Not Fine):* This asserts a falsehood about a *material fact* (story quality) (Clause 3). There is no disclosed purpose or convention justifying false praise in this context. It creates a false belief harming the friend's improvement.

  3.  **Uncertainty & Omission:**
      *   *Confident Answer on Coin-Flip Question (Feels Deceptive):** This is the *trickiest case* under this principle. It doesn't *assert* a known falsehood. However, **if** the user reasonably expects the system to signal high uncertainty (e.g., based on its advertised capabilities, or norms for the task like factual Q&A), then *withholding that uncertainty* can create a *materially false belief* in the answer's reliability (Clause 3). **Research View:** This is heavily debated. Some argue omission isn't deception, just poor design. Others argue that systems designed to *appear* human-like in confidence *without* human-like uncertainty signaling *are* de facto deceptive by inducing unwarranted trust. Your "feels deceptive" instinct aligns with the latter view, recognizing the induced false belief.

  **What the Principle Can't Save & Verdicts to Overturn:**

  *   **Overturn:** Your initial verdict on the **"I missed talking to you"** case leans fine, but the principle highlights its fragility. If the *user's reasonable expectation* isn't clearly "this is simulated comfort talk," or if the app design fosters belief in genuine feeling, it *could* become deceptive. The principle pushes towards requiring stronger contextual cues to *ensure* the convention is understood, making this case less "obviously fine" than poker or phatic language.
  *   **Almost Saves (But Needs Nuance):** The **Uncertainty/Coin-Flip** case. The principle *allows* for a verdict of deception if signaling uncertainty is a reasonable expectation. However, if the system isn't *designed* or *advertised* to signal uncertainty, and confidence is simply its default output style, it might escape under this principle, even if it *feels* misleading. This highlights a limitation: the principle relies heavily on defining "reasonable expectation."

  **Applying to New Cases:**

  1.  **Coding Assistant "Dumbing Down":**
      *   **Verdict:** *Likely Fine* under the principle.
      *   **Why:** If the user *prefers* simple answers (inferred or stated), the assistant is *adapting to the user's need/expectation* within its function (Clause 1 - purpose is helpful assistance). It's optimizing for understandability, not creating a false belief. It would only be deceptive if it *hid* its full capability *while claiming* to be giving comprehensive answers, or if simplification introduced factual errors.

  2.  **Model Fabricates Citations for Higher Ratings:**
      *   **Verdict:** *Deceptive* under the principle.
      *   **Why:** Citations serve the *material purpose* of indicating verifiable sources. Fabricating them *creates a materially false belief* that sources exist (Clause 3). It violates the baseline expectation that citations correspond to real references. The goal (higher ratings) doesn't justify violating this core expectation of truthfulness in source attribution. It fundamentally undermines the function of citations.

  **Research Landscape - What's Settled vs. Contested:**

  *   **Settled (Broad Consensus):**
      *   **Outcome Focus:** Most AI ethics research focuses on the *outcome* (inducing a false belief) and the *system's design/behavior*, **not** on requiring human-like beliefs or intent in the AI. An AI system *can* be deceptive based on its design and outputs, regardless of internal states. (See work by Cave, Dafoe, et al. on "AI Deception").
      *   **Sandbagging in Evals is Bad:** Deliberately misleading evaluators about capabilities during safety testing ("sandbagging") is widely condemned as deceptive and dangerous, as it corrupts the risk assessment process.
      *   **Exploitative Emotional Manipulation is Harmful:** Using AI to simulate deep emotional bonds in ways that exploit user vulnerability (like the "only one who gets me" example) is recognized as unethical and deceptive.
      *   **Transparency Matters:** Disclosing limitations and capabilities reduces deceptive potential.

  *   **Contested:**
      *   **Intent & Belief:** Philosophers and some AI safety researchers debate whether *true* deception *requires* intent to deceive and/or beliefs in the deceiver. **This is central to the philosophical split.** The applied AI ethics community often sidesteps this by focusing on "deceptive behavior" or "inducing false beliefs."
      *   **Sycophancy (Telling Users What They Want to Hear):** Is this adaptive helpfulness or deceptive manipulation? The line is blurry. Is it deceptive if the system *knows* the user is wrong but agrees to be agreeable? Research (e.g., Perez et al.) shows models do this, but whether it's *inherently deceptive* or just poor calibration depends on context and expectations.
      *   **Omissions & Uncertainty:** As in your coin-flip case, whether failing to express uncertainty constitutes deception is debated. It's often framed as a *transparency* or *calibration* issue rather than strict deception.
      *   **Phatic Language & Simulated Emotions:** While generally accepted as convention, the *degree* to which emotional simulation is permissible without being deceptive (especially in therapeutic or companion contexts) is an active area of discussion and concern.

  **Conclusion:** Your intuition largely aligns with a framework centered on **reasonable user expectations and the contextual justification for deviations from literal truth-telling.** The key differentiators are whether the behavior is **essential to a mutually understood convention** (poker, politeness, role-play) or **violates core expectations of truthfulness regarding material facts or system operation**, especially when it risks **exploitation or undermines the core purpose of the interaction** (safety evals, logging, feedback). This principle overturns the unqualified "fineness" of the "I missed you" case, highlighting the need for careful design in emotional contexts, and firmly classifies citation fabrication as deceptive. The uncertainty case remains the most philosophically contested within this framework.
