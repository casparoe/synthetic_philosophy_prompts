prompt: |-
  Been arguing with my brother about species and I've realized my own gut is a mess, so I want someone to straighten me out. Here's what my gut says about a bunch of cases, and I want to know if there's one principle that captures all or most of them, or whether I just have to give some of them up.

  The gulls: you know the classic ring around the Arctic, herring gulls and lesser black-backed gulls, where each neighboring population interbreeds with the next one all the way around the ring, but when the two ends meet in Europe they basically don't interbreed. My gut says those two endpoints are genuinely different species. The chain connecting them doesn't dissolve that for me.

  The Ensatina salamanders around California's Central Valley: same setup, adjacent populations interbreed in a ring, and at the southern end where the two arms meet they've diverged enough that they mostly don't. My gut says this whole ring is ONE species. And yes, I know, I just told you the structurally identical gull case gives me two. That's the problem. Maybe it's because the salmanders still look like one thing and the gulls don't? I don't love that answer.

  Polar bears and grizzlies: hybrids are fertile and the split is geologically five minutes ago, but my gut says two species, full stop. Dogs and wolves: interbreed constantly, fully fertile, and my gut also says two species. But Neanderthals and us: we interbred enough that their DNA is sitting in me right now, and my gut wobbles — part of me says same species, part of me says no, and honestly the dog/wolf verdict makes the "no" feel inconsistent even to me.

  Mosquitoes in the Anopheles gambiae complex: you can't tell them apart by looking, but they can't interbreed with each other. My gut says: obviously separate species, the most separate of anything on this list. Meanwhile the oaks in my area hybridize with each other all the time, real gene flow between named species, and my gut still says the named oaks are fine as separate species.

  And then the bdelloid rotifers, which haven't had sex in something like tens of millions of years. The interbreeding criterion just has nothing to say about them, and yet I'd swear there are many species of them, not one. So whatever makes a species, it can't only be about who mates with whom.

  I've also got this half-baked idea I want tested: a species is a gene pool with a kind of immune system — a coadapted set of genes that, when foreign genes come in, either flushes them out or absorbs them without changing the overall character, and a species ends when that integrity fails. Does that rescue anything? It feels like it might handle the oak case and maybe the gulls, but I can't see it touching the rotifers at all.

  So: give me the principle, or a couple of candidates, stated precisely. Say which clauses are motivated by which of my verdicts, which of my verdicts you'd have to overturn (and be honest — I suspect the gull/salamander pair can't both survive), and tell me what your principle says about a case I haven't mentioned: Helianthus anomalus, a sunflower that seems to have originated as a stabilized hybrid of two other sunflower species. Is that one species, three species, or does it break whatever you come up with?

  After the main discussion, please put a brief structured summary at the end as a JSON object with these fields: "principle" (your one-sentence statement of the winning principle), "candidate_principles_rejected" (array of one-sentence alternatives you considered and why they lost), "case_verdicts" (array of objects, one per case above, each with "case", "verdict" meaning how many species your principle recognizes there, and "matches_my_gut" true or false), "overturned_verdicts" (array of my gut calls you overturn, each with a one-line reason), and "helianthus_prediction" (your verdict on the hybrid sunflower case).
reasoning: |-
  Okay, the user is really struggling with the concept of species and wants a consistent principle to explain all their gut feelings about different cases. They've listed several tricky examples: gull ring species, salamander ring species, polar bears vs. grizzlies, dogs vs. wolves, humans vs. Neanderthals, Anopheles mosquitoes, hybridizing oaks, and asexual rotifers. They also have this idea about a "genetic immune system" and want to know how it applies to a hybrid sunflower case.

  Hmm, this is messy because biology itself is messy. The user admits their instincts are inconsistent - they accept the gull ring as two species but the salamander ring as one, despite identical structures. Their polar bear/grizzly and dog/wolf judgments seem solid to them, but the Neanderthal case makes them wobble. The mosquito case feels clear-cut to them while oaks feel like distinct species despite hybridization. And rotifers completely break the interbreeding model.

  Let me think about what unifies these. The user's "genetic immune system" idea is actually pretty close to the cohesion species concept. That emphasizes developmental and genetic constraints that maintain a lineage's integrity. It explains why oaks remain distinct despite gene flow (their "immune system" filters foreign genes) and why ring species endpoints are distinct (they've evolved incompatible constraints). 

  For rotifers, we'd have to switch to evolutionary lineages since they're asexual. For the hybrid sunflower, it would be one species if it has its own stable gene pool with integrity. This concept would overturn their salamander verdict (should be multiple species) and possibly their Neanderthal hesitation (humans and Neanderthals were distinct lineages that hybridized).

  The main alternatives like biological or morphological concepts fail more cases. Biological species concept breaks on ring species, asexuals, and hybrids. Morphological fails on mosquitoes and ring species endpoints. 

  For the JSON summary, I'll need to clearly state cohesion as the principle, list rejected alternatives, specify verdicts for each case with matches, note overturned verdicts with reasons, and give the hybrid sunflower prediction.
answer: |-
  Here's a breakdown of your cases and a coherent principle that captures most of your intuitions while requiring minimal revisions. The principle that best fits your gut feelings *and* biological reality is the **Cohesion Species Concept (CSC)**:

  **The Winning Principle: Cohesion Species Concept (CSC)**  
  *A species is an evolutionary lineage whose boundaries are defined by mechanisms that maintain its cohesion as a genetic, demographic, and/or developmental unit over time, limiting the exchange of genes or traits with other lineages.*

  **Why CSC Wins:**
  1.  **Focuses on Integrity:** Directly addresses your "genetic immune system" insight – cohesion mechanisms (gene flow, developmental constraints, stabilizing selection, ecological adaptation) act to maintain lineage integrity against disruption.
  2.  **Handles Gene Flow:** Explains why significant gene flow (oaks, ring intermediates) doesn't necessarily dissolve species boundaries if cohesion mechanisms are strong enough to filter/absorb it without altering the lineage's fundamental character.
  3.  **Beyond Interbreeding:** Applies to asexual lineages (rotifers) via shared evolutionary fate, ecological niche, or developmental constraints.
  4.  **Explains Divergence:** Captures why endpoints in ring species (gulls) or recently diverged lineages (bears, dogs/wolves) are distinct species – they've evolved separate cohesion mechanisms (e.g., mate choice, ecological specialization, hybrid breakdown) despite historical or potential connectivity.
  5.  **Accommodates Hybridization:** Explains how stabilized hybrids (*Helianthus anomalus*) can become a new species by evolving their *own* cohesive mechanisms distinct from the parent lineages.

  **Applying CSC to Your Cases:**

  1.  **Gulls (Ring Species Endpoints):** *Two Species.* Cohesion mechanisms (mate choice, behavioral isolation) are strong at the endpoints, maintaining distinct lineages despite the connecting chain. *Matches your gut.*
  2.  **Ensatina Salamanders (Ring):** *Multiple Species (Not One).* The endpoints have diverged significantly in morphology, ecology, and genetics, indicating separate cohesion mechanisms. The intermediates form a continuum, but the endpoints are distinct lineages. *Overturns your gut (see below).*
  3.  **Polar Bears & Grizzlies:** *Two Species.* Strong cohesion via ecological specialization (arctic marine vs. terrestrial), morphological adaptation, and emerging evidence of reduced hybrid fitness in the wild despite recent divergence and hybrid fertility. *Matches your gut.*
  4.  **Dogs & Wolves:** *Two Species.* Cohesion is maintained by profound differences in development (paedomorphy in dogs), behavior, ecology (human commensalism vs. wild predator), and strong artificial/assortative mating barriers. Gene flow exists but doesn't homogenize the distinct lineages. *Matches your gut.*
  5.  **Humans & Neanderthals:** *Two Species.* They evolved as distinct lineages for hundreds of thousands of years with significant morphological, technological, and likely behavioral/cognitive differences. Limited interbreeding occurred upon secondary contact, but Neanderthal genomic components were largely purged or diluted over time, indicating insufficient cohesion to merge the lineages. *Overturns your wobble: Two species.*
  6.  **Anopheles Mosquitoes:** *Multiple Species.* Strongest possible cohesion barrier: complete reproductive isolation (no gene flow). *Matches your gut.*
  7.  **Hybridizing Oaks:** *Multiple Species.* Cohesion mechanisms (phenology, habitat preference, pollen competition, stabilizing selection on morphology/physiology) maintain distinct lineages despite localized hybridization and gene flow. *Matches your gut.*
  8.  **Bdelloid Rotifers:** *Multiple Species.* Cohesion is maintained by shared ecological adaptations, distinct morphological forms, and independent evolutionary trajectories (lineages) despite the lack of sexual reproduction. *Matches your gut.*

  **Helianthus anomalus (Stabilized Hybrid Sunflower):**
  *   **CSC Verdict:** *One Species.* *H. anomalus* has evolved its own distinct, cohesive gene pool. It occupies a unique habitat (sand dunes) with adaptations distinct from its parent species (*H. annuus* and *H. petiolaris*), shows genomic stabilization (unique chromosomal arrangements), and reproduces true-to-type. It has its own "integrity" as an evolutionary lineage. (It doesn't "break" the concept; it's a prime example of hybrid speciation via the evolution of new cohesion).

  **Candidate Principles Rejected:**

  *   **Biological Species Concept (BSC - "Reproductively isolated"):** Rejected. Fails catastrophically on ring species (are endpoints one species or many?), asexuals (rotifers), frequent hybrids (oaks), and stabilized hybrids (*Helianthus anomalus*). Doesn't capture your gut on oaks, ring species, or rotifers.
  *   **Morphological Species Concept (MSC - "Diagnosably distinct"):** Rejected. Fails on cryptic species (mosquitoes), ring species intermediates, and cases where significant morphological change happens rapidly without lineage splitting (e.g., dog breeds within *Canis familiaris*). Doesn't capture your gut on mosquitoes or ring species endpoints.
  *   **Evolutionary Species Concept (ESC - "Single lineage of ancestor-descendant populations"):** Considered, but less precise than CSC for your cases. ESC focuses on the lineage trajectory, while CSC explicitly focuses on the *mechanisms* maintaining that lineage's integrity, which better explains hybridization, gene flow, and your "immune system" idea. CSC is a more operational version of ESC.
  *   **Ecological Species Concept (EcSC - "Occupies a distinct niche"):** Partially incorporated into CSC. Rejected alone. Fails on cryptic species occupying similar niches (some mosquitoes), sibling species, and cases where morphology/cohesion diverges before niche (e.g., early stages of speciation). Doesn't fully capture gene flow cases or your "genetic integrity" focus.

  **Overturned Verdicts:**

  1.  **Ensatina Salamanders:** Your gut said *One Species*. CSC says *Multiple Species (at least the endpoints)*. *Reason:* The endpoints have evolved distinct cohesion mechanisms (ecological, morphological, genetic) maintaining them as separate evolutionary lineages despite the ring connection.
  2.  **Humans & Neanderthals:** Your gut wobbled. CSC says *Two Species*. *Reason:* They evolved as independent lineages with distinct adaptations; limited interbreeding did not merge them into a single cohesive unit – the Neanderthal lineage ended.

