answer: |-
  ### Staged Game: The Surprise Exam Paradox  
  **Objective:** Create an experiential simulation where students discover the paradox through gameplay, rotating roles between "Headmaster" (sets exam day) and "Pupils" (predict or admit uncertainty nightly).  

  ---

  ### **Setup & Materials**  
  - **Whiteboard Grid:**  
    - **Round 1 (3-day week):** Columns labeled "Mon," "Tue," "Wed." Rows for:  
      - *Headmaster’s Secret Choice* (hidden until exam day).  
      - *Pupils’ Evening Commitment* (updated nightly).  
    - **Round 2 (5-day week):** Columns "Mon" to "Fri." Same rows.  
  - **Headmaster Materials:**  
    - 5 envelopes (one per weekday, labeled).  
    - 5 blank slips of paper + 1 red slip (for exam day). Headmaster places the red slip in one envelope to secretly set the exam day.  
  - **Score Tracker:** Running tally on whiteboard for Headmaster and Pupils.  
  - **Timer:** For evening deliberations (3 mins/night).  

  ---

  ### **Rules & Scoring**  
  #### **Headmaster’s Role**  
  - **Goal:** Maximize points by surprising pupils (exam on a day not predicted the night before).  
  - **Procedure:**  
    - Secretly place red slip in one envelope for the chosen exam day.  
    - Envelopes remain sealed until the end of each day (teacher opens to check for exam).  
  - **Scoring:**  
    - **+10 points:** Exam occurs on a day pupils did **not** predict the night before.  
    - **-10 points:** Exam occurs on a day pupils **did** predict the night before.  
    - **-20 points:** No exam held (if headmaster fails to choose).  

  #### **Pupils’ Role**  
  - **Goal:** Maximize points by correctly predicting the exam the night before or admitting uncertainty.  
  - **Procedure:**  
    - Each evening, as a group, publicly commit to one statement:  
      - *"The exam is tomorrow!"* (a prediction).  
      - *"We cannot yet rule any remaining day in or out."* (uncertainty).  
    - Decision by majority vote after 3-min discussion. Record on grid.  
  - **Scoring:**  
    - **+15 points:** Correct prediction (say "tomorrow" and exam happens the next day).  
    - **-5 points:** Incorrect prediction (say "tomorrow" but exam does **not** happen next day).  
    - **+3 points:** Admit uncertainty (say "cannot rule out," regardless of outcome).  

  #### **Game Flow**  
  1. **Day Start:** Teacher checks envelope for that day. If exam slip found, announce "Exam today!" and end week early.  
  2. **Evening:** Pupils deliberate and commit to a statement for the next day.  
  3. **Repeat** until exam occurs or week ends.  

  ---

  ### **Timeline (75 Minutes)**  
  1. **Introduction (5 mins):**  
     - Explain roles, rules, and scoring without naming the paradox.  
     - Emphasize: "Headmaster wants surprise; pupils want points for correct predictions."  

  2. **Round 1: 3-Day Week (Mon-Wed) (20 mins):**  
     - Assign roles: 1 Headmaster (e.g., volunteer), 15 Pupils.  
     - Headmaster secretly sets exam day (red slip in envelope).  
     - **Evenings (simulated consecutively):**  
       - *Mon Eve → Tue:* Pupils commit for Tuesday.  
       - *Tue Eve → Wed:* If no Tue exam, pupils commit for Wednesday.  
     - Score updates after each day/exam reveal.  

  3. **Round 2: 5-Day Week (Mon-Fri) (25 mins):**  
     - Rotate roles: New Headmaster (e.g., previous pupil), all others as Pupils.  
     - **Add Announcement:** Read aloud and post on board:  
       *"The exam will be held next week on one day, but you will not be able to work out which day it is until the evening before."*  
     - Headmaster sets exam day secretly.  
     - Run evenings (Mon-Thu) as in Round 1.  

  4. **Debrief (25 mins):**  
     - **Reveal the Paradox:** "This was the surprise exam paradox. Let’s map your experience."  
     - **Map Game Events to Argument:**  
       | **Observed Event**               | **Paradox Premise**                                  |  
       |----------------------------------|------------------------------------------------------|  
       | Pupils predict Wed on Tue night  | "Last day can’t be a surprise if exam not yet held." |  
       | Headmaster avoids Wed            | "Headmaster can’t violate announcement without proving it false." |  
       | Pupils admit uncertainty early   | "An announcement you trust may be unusable for prediction." |  
     - **Three Standard Reactions (Discuss Without Endorsing):**  
       1. *Self-Refuting:* Announcement makes surprise impossible → exam can’t happen.  
       2. *Self-Confirming:* Announcement creates surprise by forcing pupils to overthink.  
       3. *Misworded:* "Work out" is vague—should specify "deduce with certainty."  
     - **Honest Pitfalls & Fixes:**  
       | **Predictable Issue**               | **Handling Strategy**                                |  
       |-------------------------------------|------------------------------------------------------|  
       | Pupils guess randomly               | Highlight: "Did anyone use backward induction?" Use whiteboard to reconstruct steps. |  
       | Headmaster paralyzed (no choice)    | Rule: "Must pick a day or lose 20 points." Discuss: "Why was choosing hard?" |  
       | Class notices randomization in R2   | Acknowledge: "Randomization makes surprise easier. But does it dissolve the paradox? What if pupils *expect* randomness?" |  
     - **Limitation of the Game:**  
       - Real paradox relies on **iterated, self-referential knowledge** (pupils know others know the announcement, ad infinitum).  
       - **Supply in Debrief:** "In reality, the announcement is *common knowledge*. You’re not just following rules—you’re reasoning about each other’s reasoning, which the game simplifies."  

  ---  
  **Core mechanism:** Pupils nightly commit to predicting the exam or admitting uncertainty, while the headmaster secretly sets the exam day, creating a feedback loop where rational backward induction by pupils appears to eliminate possible surprise days, yet the headmaster must choose one—generating the paradox through enforced mutual reasoning.
