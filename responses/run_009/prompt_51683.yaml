answer: |-
  ### Newcomb's Problem Decision Tree  
  *Based on a predictor with a perfect track record; closed box contents fixed before choice.*

  1. **Regardless of the correlation, is taking both boxes always the best way to get the most money now?**  
     *(That is, since the closed box’s contents can’t change, does grabbing the extra $1000 never hurt and often help?)*  
     - **Yes** → **Two-boxer**: Take both boxes. The closed box is fixed; your choice only adds $1000.  
     - **No** → Go to 2.  

  2. **Is your main reason to take only the closed box that it worked every time before?**  
     *(Would you take both boxes if the predictor had a spotty record?)*  
     - **Yes** → **Inductive one-boxer**: Take only the closed box. Past success justifies it; switch if the predictor is unreliable.  
     - **No** → Go to 3.  

  3. **If the predictor used a non-simulation method (e.g., a brain scan that didn’t copy your reasoning), would you then take both boxes?**  
     *(Does your reason to one-box vanish without simulation?)*  
     - **Yes** → **Functional one-boxer**: Take only the closed box. Your reasoning *is* what was simulated; without that link, two-box.  
     - **No** → Go to 4.  

  4. **Without simulation, does the correlation still give you a reason to take only the closed box?**  
     *(Is the link between choice and contents informative even if the predictor’s method is unknown or different?)*  
     - **Yes** → **Evidential one-boxer**: Take only the closed box. The correlation indicates it’s likely full, regardless of method.  
     - **No** → **Unoccupied**: Incoherent. If no reason to one-box remains, you should two-box (contradicts answering "No" at 1).  

  ---

  ### Side Cases  
  - **Medical variant** (gene causes both behavior and disease; you can’t change the gene):  
    - **Two-boxer** & **Functional one-boxer**: Engage in the behavior (e.g., smoke). The gene is fixed; your choice doesn’t affect it.  
    - **Evidential one-boxer** & **Inductive one-boxer**: Avoid the behavior (e.g., don’t smoke). Correlation suggests it’s evidence of the gene.  
  - **Transparent variant** (closed box is glass, full; predictor filled it iff it predicted one-boxing):  
    - *All positions*: Take both boxes. The money is visible; your choice can’t alter it now.  

  ### Inseparable Pairs  
  - **Two-boxer** and **Functional one-boxer** behave identically in both side cases (smoke in medical; two-box in transparent).  
  - **Evidential one-boxer** and **Inductive one-boxer** behave identically in both side cases (don’t smoke in medical; two-box in transparent).  

  **Summary:** The first split does the most work, cleanly separating those who see the correlation as irrelevant to maximizing money now (two-boxers) from those who don’t (all one-boxers).
