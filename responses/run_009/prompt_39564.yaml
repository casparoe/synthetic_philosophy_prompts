prompt: |-
  My roommate (econ PhD student, let's call her Priya) and I (philosophy MA) have spent basically two years arguing about the common prior assumption, and I think it's time we cashed out what we've learned into the document we should have written all along. She's the defender: roughly, she thinks that if two ideally rational agents with common knowledge of each other's opinions still disagree, something has gone wrong — differing priors are like differing code, a bug to be debugged, and the Harsanyi-style thought is that once you trace any disagreement back through the evidence, you either hit common knowledge of different information or you hit a difference in priors that itself should be treated as a common-knowledge event to be modeled with a prior over priors, so the assumption keeps reasserting itself at every level. I'm the skeptic: priors are just where evidence runs out, two agents can start with different credences without either being irrational, and the agreement theorem is conditional on an assumption that does all the work — it tells you what follows IF you have a common prior, not that you must have one. And "you should distrust anyone whose prior differs from yours" seems to prove too much: it would make disagreement with a stranger a black mark on at least one of you, which feels absurd.

  Draft the joint statement of our adversarial collaboration. I want: (1) the claims we can both sign — and I want them to include the math we both accept, e.g. about the agreement theorem itself and its scope, the no-trade-style results, what happens when information is genuinely asymmetric, and the boring fact that ordinary humans disagree for plenty of non-mysterious reasons; (2) the precise statements of where we still part ways, each phrased so the person holding that view would accept the wording (Priya should get to state "differing priors among idealized rational agents are a rationality failure" in words she'd sign, and I should get my side in words I'd sign); (3) the cruxes — the sub-questions such that settling one would move at least one of us — and for each crux a concrete case, argument, or thought experiment that we BOTH agree bears on it, with our predictions written down in advance so we can't wiggle out later. One crux I suspect is whether there's any principled, non-question-begging procedure for setting "ur-priors" (indifference over which partitions? max entropy subject to which constraints?); another might be whether cases involving self-locating uncertainty — two agents who share all the third-person evidence but assign different credences because of when/where they find themselves — are counterexamples to the spirit of the assumption or just outside it's scope. Priya has a regress argument I half-buy (any common-knowledge prior disagreement can be re-modeled with a common meta-prior, so the assumption is sort of unfalsifiable), and my standing response is that this just pushes the mystery up a level without saying where the meta-prior's mass comes from.

  If you conclude that part of our dispute is verbal — say, about what "irrational" even means when applied to a prior, or whether the assumption is normative or merely a modeling convention — say which part and why. Format: numbered list of agreed claims first, then a table for the disagreements (view | statement its holder would endorse | why it matters), then the cruxes with predictions. Please don't referee. Neither of us wants a verdict on who's right; we want the exact shape of what's left between us.
reasoning: |-
  We are drafting a joint statement for an adversarial collaboration between Priya (defender of the common prior assumption) and a philosophy MA (skeptic). The goal is to outline agreed claims, precise disagreements, and cruxes with testable predictions.

  ### Step 1: Agreed Claims
  We list the mathematical and conceptual points both parties accept.

  1. **The Agreement Theorem (Aumann's Result):** 
     - If two agents have a common prior, and their posteriors for an event A are common knowledge, then these posteriors must be equal. 
     - This holds under the assumptions of common knowledge of rationality, common prior, and partitional information structures.

  2. **Scope of the Agreement Theorem:**
     - The theorem applies only under the stated assumptions. If any assumption fails (common prior, common knowledge of posteriors, or partitional information), disagreement is possible without irrationality.

  3. **No-Trade Theorems:**
     - If agents have a common prior and common knowledge of their beliefs about the value of a bet, they cannot agree to a bet that both strictly prefer (no "Dutch book" in this setting). 
     - This reinforces that under common prior, common knowledge of differing beliefs implies irrationality (since they would leave money on the table by not betting).

  4. **Asymmetric Information:**
     - Disagreement can arise from genuinely asymmetric information (i.e., different evidence) without irrationality. The common prior assumption does not require that agents have the same information, only that they start from the same prior.

  5. **Ordinary Human Disagreement:**
     - In real life, humans disagree for many non-mysterious reasons: differing evidence, computational limitations, biased processing, etc. The common prior assumption is not intended to describe actual humans but idealized rational agents.

  6. **The Role of Priors:**
     - Priors represent an agent's initial credences before acquiring evidence. They are the point where evidence runs out. Both agree that, in principle, two agents could have different priors without having committed a rationality error in the sense of misupdating (i.e., conditional on their prior, they update correctly).

  7. **The Harsanyi Doctrine:**
     - The idea that differences in opinion should be traceable to differences in information, and that if we account for all information, we would have the same prior. Both accept that this is a regulative ideal but may disagree on whether it is always achievable.

  ### Step 2: Disagreements
  We present each view with a statement that the holder would endorse, and why it matters.

  | View Holder | Statement Endorsed by Holder | Why It Matters |
  |-------------|------------------------------|---------------|
  | Priya (Defender) | "Among ideally rational agents with common knowledge of their opinions, any disagreement must stem from differing information. Differing priors in such a context indicate a failure of rationality because the priors themselves should be the product of a common meta-prior that accounts for all possible prior-generating processes, thus restoring the common prior at a higher level. Therefore, the common prior assumption is a necessary condition for ideal rationality." | This matters because it implies that rational agents must, in principle, be able to resolve any disagreement by uncovering the hidden information or the higher-level common prior. It treats rationality as requiring a unified starting point. |
  | Skeptic (Philosophy MA) | "Ideally rational agents can have different priors without either being irrational. Priors are not the product of evidence but the starting point for evidence. The common prior assumption is a modeling tool that enables tractable analysis of disagreement under common knowledge, but it is not a normative requirement of rationality. Rationality does not require that two agents share a prior; it only requires that each updates correctly from their own prior." | This matters because it allows for fundamental, non-arbitrary differences in rational priors (e.g., due to differing conceptual frameworks or unconstrained choices in the absence of evidence). It avoids the implication that all rational agents must converge to the same beliefs given the same total evidence. |

  ### Step 3: Cruxes
  We list the cruxes: sub-questions that, if settled, would move at least one of us. For each, we provide a concrete case/argument/thought experiment that both agree bears on it, and then each party's prediction.

  1. **Crux: The Possibility of Objective Ur-Priors**
     - **Question:** Is there a principled, non-question-begging procedure for setting a unique "ur-prior" (e.g., indifference over a natural partition, max entropy subject to constraints) that all rational agents must adopt?
     - **Concrete Case:** Consider the problem of assigning a prior to the bias of a coin. The principle of indifference would assign equal probability to each possible bias (e.g., a uniform prior over [0,1]). But what if we reparameterize? For example, if we consider the log-odds of the bias, a uniform prior in one parameterization is non-uniform in another. Max entropy might depend on the chosen constraints (e.g., mean or variance). 
     - **Priya's Prediction:** There is a unique objective ur-prior that can be justified by symmetry or information-theoretic considerations (e.g., the uniform prior over the invariant measure). The seeming arbitrariness of parameterization is resolved by identifying the natural structure of the hypothesis space. If we cannot find such a structure, it is because we have not modeled the problem at a deep enough level.
     - **Skeptic's Prediction:** There is no unique objective ur-prior. Different rational agents may choose different priors (e.g., uniform over bias vs. uniform over log-odds) without violating rationality. The choice of parameterization reflects a subjective element that cannot be eliminated.

  2. **Crux: Self-Locating Uncertainty**
     - **Question:** Are cases of self-locating uncertainty (e.g., Sleeping Beauty, Doomsday Argument) counterexamples to the spirit of the common prior assumption, or are they outside its scope?
     - **Concrete Case:** In the Sleeping Beauty problem, Beauty is put to sleep and woken once if a coin lands heads, or twice if tails. Upon waking, what should her credence be that the coin landed heads? The two main answers are 1/2 (the prior) and 1/3 (based on counting awakenings). 
     - **Priya's Prediction:** Self-locating uncertainty is not a counterexample because it involves a different kind of uncertainty (indexical) that the common prior assumption was not designed for. The common prior should apply to the non-indexical facts (e.g., the coin flip), and the disagreement arises from how to update on indexical information. A common prior over the entire state space (including centered worlds) can be defined, and then the update rules (e.g., counting awakenings) are part of the rational updating process. Thus, if two agents have the same prior over centered worlds and update correctly, they will agree.
     - **Skeptic's Prediction:** Self-locating uncertainty shows that even with a common prior over centered worlds, rational agents may update differently because the updating rule itself is not fixed. The common prior assumption does not resolve the disagreement in these cases because the rational update procedure is contested. This illustrates that the common prior is not sufficient for agreement when the updating rules are not uniquely determined by rationality.

  3. **Crux: The Regress Argument**
     - **Question:** Does the regress argument (modeling prior differences with a common meta-prior) successfully defend the common prior assumption, or does it merely push the problem up a level without resolution?
     - **Concrete Case:** Suppose two rational agents have different priors over a parameter θ. Priya argues that this difference can be modeled by a common meta-prior over the set of possible priors. For example, each prior is indexed by a hyperparameter φ, and the agents share a common prior over φ. The skeptic objects that the meta-prior itself must come from somewhere.
     - **Priya's Prediction:** The regress can be stopped by a universal meta-prior (e.g., symmetry over the hyperparameters) that is common to all rational agents. The common prior at every level is a requirement of ideal rationality. If we push the regress infinitely, we converge to a fixed point that is common.
     - **Skeptic's Prediction:** The regress is either infinite (which is impractical) or stops arbitrarily. The choice of meta-prior is itself a prior, and there is no non-arbitrary reason why rational agents must share the same meta-prior. Therefore, the regress does not resolve the fundamental issue of where the prior mass comes from and why it must be shared.

  ### Step 4: Verbal Dispute?
  We note if part of the dispute is verbal.

  - **Verbal Element:** The dispute partly hinges on the meaning of "irrational." 
    - For Priya, "irrational" includes having a prior that is not the product of a common meta-prior. Thus, differing priors among rational agents are irrational because they violate the requirement of having a common origin in a shared meta-prior.
    - For the Skeptic, "irrational" only applies to updating (conditionalization) and internal consistency (probabilistic coherence). Priors are not subject to rationality constraints beyond coherence, so differing priors do not imply irrationality.
  - Therefore, the disagreement is partially about the scope of rationality: whether it includes the selection of priors (with the common prior as a requirement) or only the updating from priors.

  ### Conclusion of the Statement
  We have laid out the agreed claims, the precise disagreements, and the cruxes with predictions. This sets the stage for future work to test the predictions and refine the debate.
answer: |-
  ### Joint Statement: Adversarial Collaboration on the Common Prior Assumption  
  **Authors:** Priya (Econ PhD, Defender) and [Your Name] (Philosophy MA, Skeptic)  
  **Date:** [Insert Date]  

  #### 1. Agreed Claims  
  We jointly endorse the following mathematical and conceptual propositions. These are not points of contention but shared foundations for our debate.  

  1. **Aumann’s Agreement Theorem**:  
     - *Statement*: If two agents share a common prior, have partitional information structures, and their posterior credences for an event \(A\) are common knowledge, then their posteriors must be equal. Formally:  
       \[
       P(A | I_1) \neq P(A | I_2) \implies \neg CK(P(A | I_1), P(A | I_2))
       \]  
       where \(I_i\) is agent \(i\)’s information partition, and \(CK\) denotes common knowledge.  
     - *Scope*: This theorem holds *only* under its assumptions. If common priors, partitional information, or common knowledge of posteriors fail, disagreement is consistent with rationality.  

  2. **No-Trade Theorems**:  
     - *Statement*: If agents share a common prior and common knowledge of their beliefs about the value of a trade (e.g., a bet), no mutually beneficial trade exists. Disagreement implies at least one agent is irrational *given the common prior*.  
     - *Implication*: These theorems reveal how common priors enforce consensus under idealization but do not prove that such priors *must* exist.  

  3. **Asymmetric Information**:  
     - *Statement*: Disagreement often arises rationally from asymmetric information (e.g., one agent observes data unknown to the other). Common priors *allow* for this; they do not require identical information.  

  4. **Ordinary Human Disagreement**:  
     - *Statement*: Real-world disagreements (e.g., politics, ethics) stem from non-mysterious factors: incomplete information, computational limits, biases, or ambiguous evidence. The common prior assumption (CPA) is not descriptive of humans but a tool for modeling idealized agents.  

  5. **Role of Priors**:  
     - *Statement*: Priors are credences held before evidence acquisition. They represent the "starting point" where evidence runs out. Two agents can update perfectly rationally from different priors without violating probability theory (coherence + conditionalization).  

  6. **Harsanyi Doctrine (as Regulative Ideal)**:  
     - *Statement*: Differences in beliefs *should* be traceable to differences in information under CPA. If priors differ, we can model this as a common-knowledge event (e.g., a "type space" with a meta-prior). This is a methodological norm, not an empirical claim.  

  7. **CPA as a Modeling Convention**:  
     - *Statement*: CPA is useful for tractability in game theory and Bayesian models. It simplifies analysis by isolating disagreement to information asymmetry.  

  ---

  #### 2. Precise Disagreements  
  We irreconcilably diverge on the following. Each statement is phrased as its holder would endorse it.  

  | View Holder          | Statement Endorsed by Holder                                                                                                                                 | Why It Matters                                                                                                       |  
  |----------------------|--------------------------------------------------------------------------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------------------|  
  | **Priya (Defender)** | "Differing priors among ideally rational agents with common knowledge of their opinions constitute a rationality failure. Priors are not arbitrary; they must derive from a shared meta-prior over possible prior-generating processes. Any systematic prior disagreement is evidence of incomplete modeling (e.g., unaccounted information or meta-uncertainty), violating the normative ideal of rationality as consensus-under-full-information." | Challenges the skeptic’s view that priors can be rationally incommensurable. Implies rationality requires convergence *in principle* if all evidence/knowledge is shared. |  
  | **Skeptic**          | "Ideally rational agents can hold different priors without irrationality. Priors are not determined by evidence but constrain its interpretation. The CPA is a useful *if*-clause for agreement theorems, not a normative necessity. Rationality permits fundamental, non-arbitrary differences in prior credences (e.g., due to conceptual frameworks or unconstrained choices under ignorance), and distrusting strangers over priors is unwarranted." | Protects the reasonableness of persistent disagreement. Rejects CPA as a universal rationality constraint, preserving pluralism in foundational commitments. |  

  ---

  #### 3. Cruxes  
  These sub-questions would resolve part of our dispute if settled. For each, we:  
  - State the crux.  
  - Propose a **concrete case/argument** we *both* accept as relevant.  
  - Provide **predictions** for how each would respond.  

  **Crux 1: Can Ur-Priors Be Set Non-Arbitrarily?**  
  - **Question**: Is there a unique, rational "ur-prior" (e.g., via indifference, max entropy, or symmetry) that all agents must share?  
  - **Concrete Case**: *The Coin Bias Problem*. Two agents assign priors to \(\theta\) (bias of a coin). Agent 1 uses a uniform prior over \(\theta\) (i.e., \(P(\theta) \propto 1\)). Agent 2 uses a uniform prior over \(\phi = \log(\theta/(1-\theta))\) (log-odds), leading to a different distribution. Both are coherent.  
  - **Predictions**:  
    - *Priya*: Will argue that symmetry principles (e.g., invariance under reparameterization) or objective constraints (e.g., max entropy with physical symmetries) yield a unique ur-prior. Prediction: "In the coin case, the Jeffreys prior (proportional to \(\sqrt{I(\theta)}\)) is unique and rational."  
    - *Skeptic*: Will argue that no prior is objectively privileged. Prediction: "No rule (indifference, max entropy) resolves the arbitrariness; agents may rationally choose different parameterizations."  

  **Crux 2: Does Self-Locating Uncertainty Challenge CPA?**  
  - **Question**: Are cases of self-locating uncertainty (e.g., "I am in time/location X") counterexamples to CPA’s spirit, or merely outside its scope?  
  - **Concrete Case**: *The Sleeping Beauty Problem*. Beauty is woken once if a coin is heads, twice if tails. What is her credence for heads upon waking? Halfer (prior-based: 1/2) and Thirder (evidence-based: 1/3) views both claim rationality.  
  - **Predictions**:  
    - *Priya*: Will argue this is within CPA’s scope. Prediction: "A common prior over centered worlds + rational updating resolves disagreement. Thirder is correct because Beauty’s information partition includes more tails states."  
    - *Skeptic*: Will argue this shows CPA’s limits. Prediction: "Disagreement persists because priors over self-locating propositions are underdetermined; no common prior forces one view."  

  **Crux 3: Does the Meta-Prior Regress Resolve the Dispute?**  
  - **Question**: Can modeling prior disagreement with a common meta-prior (e.g., a prior over priors) salvage CPA, or does it push the problem up a level?  
  - **Concrete Case**: Agents disagree on priors for climate sensitivity. Priya insists this reflects uncertainty over "prior-generating models" (e.g., expert vs. layperson priors), modeled with a shared meta-prior.  
  - **Predictions**:  
    - *Priya*: Will argue the regress justifies CPA. Prediction: "A meta-prior assigns probabilities to priors; if common knowledge, agents agree on the distribution of disagreements."  
    - *Skeptic*: Will argue this regresses infinitely or arbitrarily. Prediction: "The meta-prior itself lacks a non-arbitrary source; it cannot ground consensus without presupposing shared norms."  

  ---

  #### 4. Verbal Dispute?  
  We identify one verbal element:  
  - **Term**: "Rationality failure" (for priors).  
  - **Why verbal**:  
    - Priya uses "rationality" broadly: Priors *must* be justifiable by shared meta-reasons (e.g., symmetry), so unexplained differences indicate error.  
    - Skeptic uses "rationality" narrowly: Priors need only be coherent and updatable; differences without evidence are permissible.  
  - **Effect**: This masks a substantive disagreement about whether rationality governs priors *beyond* coherence. Resolving it requires defining "rational prior" (e.g., must it be uniquely justifiable?).

  ---

  **Conclusion**: This document maps our common ground, fault lines, and testable cruxes. We commit to revisiting predictions as new arguments/cases arise. Signed: Priya & [Your Name].
