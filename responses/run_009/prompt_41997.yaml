prompt: |-
  Two colleagues and I have been arguing for two years about why some nations are rich. I am an institutionalist: I hold that inclusive economic and political institutions are the operative cause of long-run prosperity, that geography and culture matter mainly insofar as they shaped institutional trajectories historically, and that policy should therefore target institutional reform. My colleague is a deep-determinants person: she holds that geography (disease environments, latitude, access to navigable water) and culturally transmitted traits (kinship tightness, generalized trust, time horizons) do much of the causal work, and that institutions are largely an endogenous downstream variable, so institutional reform imposed against unfavorable background conditions fails or decays. We have finally agreed to write an adversarial-collaboration statement together for an edited volume on the limits of causal inference from history.

  Draft that joint statement. It should contain: (1) the claims about economic history, natural experiments, and the limits of historical causal inference that both of us can sign in good conscience; (2) our precise residual disagreements, each phrased in wording its own side would accept — be careful not to smuggle either side's framing into the other's position, and say where our dispute turns out to be partly verbal (e.g., what counts as an "institution" versus a cultural practice); (3) the cruxes — sub-questions that, if settled, would move at least one of us — including at least one methodological crux about whether any historical quasi-experiment or instrumental strategy could in principle discriminate between our views; and (4) for each crux, a concrete case, dataset, or argument both of us would agree bears on it, with each side's prediction recorded in advance. Then append a structured summary as a JSON object with fields "agreed_claims" (array of strings), "disagreements" (array of objects with "topic", "institutionalist_wording", "deep_determinist_wording", "verbal_or_substantive"), "cruxes" (array of objects with "question", "evidence_both_accept", "institutionalist_prediction", "deep_determinist_prediction"), and "limits_of_inference" (a string stating what we jointly concede cannot be settled from historical data alone).
reasoning: |-
  We are drafting a joint statement for an adversarial collaboration. The two positions are:
   - Institutionalist: inclusive institutions are the proximate cause of prosperity; geography and culture matter historically but institutions are the key lever for policy.
   - Deep Determinist: geography and culture do most causal work; institutions are endogenous and reform often fails without supportive background conditions.

   We need:
   1. Agreed claims about economic history, natural experiments, and limits of inference.
   2. Residual disagreements, each in their own wording, noting if partly verbal.
   3. Cruxes (sub-questions) that would move at least one of us, including a methodological crux about historical quasi-experiments.
   4. For each crux, a concrete case/dataset/argument both accept, and each side's prediction.

   Then a JSON summary.

   Let's structure the statement:

   I. Introduction: Our debate and the collaborative effort.

   II. Areas of Agreement:
      A. Historical patterns we both acknowledge.
      B. The role of natural experiments and their limitations.
      C. Limits of causal inference from history.

   III. Residual Disagreements (with each side's wording):
      A. On the primacy of institutions vs. deep determinants.
      B. On the endogeneity of institutions and the potential for reform.
      C. Definitional issues (e.g., institution vs. culture).

   IV. Cruxes:
      A. Question 1: ...
          - Evidence both accept: ...
          - Institutionalist prediction: ...
          - Deep Determinist prediction: ...
      B. Question 2: ...
      C. Question 3: ... (including the methodological crux)

   V. Conclusion: What we jointly concede cannot be settled from historical data alone.

   Now, let's draft the statement accordingly.
answer: |-
  ### Joint Statement on the Causes of National Prosperity

  We, an institutionalist and a deep determinist, agree on core historical patterns but diverge on causal primacy and policy implications. Below, we outline our common ground, precise disagreements, testable cruxes, and limits of inference.  

  ---

  ### 1. **Agreed Historical Claims**  
  Both parties endorse these statements:  
  - **Historical Correlation**: Inclusive institutions (e.g., property rights, constraints on elites) correlate strongly with modern prosperity. Geography (e.g., tropical disease burdens, landlockedness) and culture (e.g., individualism, social trust) also exhibit persistent correlations with economic outcomes.  
  - **Natural Experiments**: Quasi-experiments (e.g., colonial border discontinuities, random resource discoveries) demonstrate that *institutional shocks* can cause short-to-medium-run economic shifts. However, these rarely isolate geography/culture from institutions.  
  - **Limits of Inference**: History cannot run counterfactuals for macro-societal variables (e.g., "What if Africa had Europe’s geography?"). Path dependence obscures linear causality, and selection bias (e.g., colonizer choices) plagues cross-national regressions.  

  ---

  ### 2. **Residual Disagreements**  
  We phrase our divergences in mutually acceptable terms:  

  | Topic                          | Institutionalist Wording                                                                 | Deep Determinist Wording                                                                 | Verbal/Substantive |  
  |--------------------------------|------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------|--------------------|  
  | **Primacy of causality**       | "Inclusive institutions are the proximate, policy-actionable cause of sustained growth; geography and culture operate distally through institutional paths." | "Deep determinants (geography/culture) are foundational causes; institutions are adaptive vessels that decay without supportive ecological/cultural substrates." | Substantive        |  
  | **Institutional endogeneity**  | "While institutions emerge from historical conditions, they gain causal autonomy and can be reformed independently."                                  | "Institutions are endogenous expressions of deeper constraints; imposed reforms often revert under geographic/cultural inertia."                         | Substantive        |  
  | **Definitional boundaries**    | "Institutions are *formal* rules (laws, constitutions); culture encompasses informal norms (trust, kinship)."                                       | "The line is porous: e.g., clan-based governance is both cultural norm and political institution."                                                     | Partly verbal      |  

  ---

  ### 3. **Cruxes for Discriminating Our Views**  
  These sub-questions could resolve parts of our dispute. Predictions are binding.  

  #### **Crux 1: Disease Ecology vs. Institutional Transplant Success**  
  - **Question**: When European institutions were imposed on globally diverse colonies, did disease-adjusted settler mortality (Acemoglu et al.) or precolonial cultural traits (e.g., kinship structure) better predict long-term institutional quality?  
  - **Shared Evidence**: *The Colonial Origins of Comparative Development* (Acemoglu 2001) and *The Son Also Rises* (Clark 2014) datasets, expanded with precolonial ethnography.  
  - **Prediction**:  
    - Institutionalist: Settler mortality dominates; where Europeans built inclusive institutions, they endured regardless of precolonial culture.  
    - Deep Determinist: Precolonial traits (e.g., communal vs. individualist kinship) better explain persistence; disease effects weaken when controlling for ancestral customs.  

  #### **Crux 2: Post-Communist Transition Outcomes**  
  - **Question**: Did geographic/cultural factors (e.g., distance from Europe, pre-Communist trust levels) or institutional choices (e.g., shock therapy vs. gradualism) better explain GDP growth in 1990–2010?  
  - **Shared Evidence**: EBRD transition data, World Values Survey trust metrics, and geospatial controls.  
  - **Prediction**:  
    - Institutionalist: Growth is orthogonal to geography/culture if institutions (e.g., anti-corruption laws) were decisively enforced.  
    - Deep Determinist: Cultural trust and latitude predict reform success; identical policies failed where generalized trust was low.  

  #### **Crux 3: Methodological Test**  
  - **Question**: Can any quasi-experiment isolate institutions from deep determinants? (e.g., if a natural disaster randomly devastates two regions, do cultural traits or prior institutions better predict recovery?)  
  - **Shared Evidence**: Discontinuities in disaster impacts (e.g., 2004 Indian Ocean tsunami) with pre-event institutional/cultural data.  
  - **Prediction**:  
    - Institutionalist: Regions with stronger pre-disaster institutions recover faster, independent of culture.  
    - Deep Determinist: Cultural cohesion (e.g., communal labor traditions) drives recovery; institutional quality correlates but lacks causal primacy.  

  ---

  ### 4. **Limits of Historical Inference**  
  We jointly concede that history **cannot resolve whether geography/culture are immutable constraints or plastic factors**. For example:  
  - Did Botswana’s institutions succeed *because* of its favorable geography (arid, disease-low) or *despite* it?  
  - Did South Korea’s Confucian culture hinder or enable its institutional leap?  

  Long-run equilibria may fuse all three factors, making separable causality unidentifiable. Policy prescriptions thus require humility: our dispute may reflect *weighting* differences, not binary refutations.  

  ---

