answer: |-
  Below is a structured 90-minute seminar plan designed to make participants "collide" with the problem of the earlier self's authority through experiential role-play. The activity surfaces tensions organically by forcing ethical trade-offs via rules, not exposition. I've refined your sketch for feasibility, added safeguards against common pitfalls, and clarified the debrief mapping. Budget and time constraints are respected.

  ---

  ### **Session Structure: Three Phases**  
  **Total Time:** 90 minutes  
  **Participants:** 15 students (5 groups of 3 in Phase 1).  

  ---

  ### **Phase 1: Directive Creation (25 minutes)**  
  *(Surfaces tension: Specific instructions vs. abstract values without knowing which will bind)*  
  - **Groups:** 5 teams of 3 students each.  
  - **Task:**  
    1. **Create a Persona** (5 mins):  
       - Invent a fictional patient (e.g., "Dr. Aris Thorne, 52, atheist philosophy professor, values intellectual autonomy, fears losing dignity").  
       - *Instructor Prompt:* "Design a persona facing a future degenerative illness (e.g., early-stage dementia diagnosis). Focus on their core identity."  
    2. **Write Two Documents** (15 mins):  
       - **Sheet A (Specific Instructions):** Concrete medical orders (e.g., "No antibiotics for pneumonia," "DNR if unconscious >3 months").  
       - **Sheet B (Values Statement):** Abstract principles (e.g., "Avoid life-prolonging treatments if I cannot recognize loved ones," "Prioritize dignity over survival").  
    3. **Submit Separately** (5 mins):  
       - Collect Sheet A and Sheet B in two distinct envelopes.  
  - **Why it Works:** Groups invest in the persona’s "authenticity," creating stakes for later phases. They unknowingly seed the core tension: *Will their authority lie in specifics or values?*  

  ---

  ### **Phase 2: Later Selves & Dossier Assignment (20 minutes)**  
  *(Surfaces tension: Later selves who defy, forget, or "improve" upon the directive)*  
  - **Roles:** Reassign students:  
    - **5 Later Selves:** One student per group becomes the persona years later.  
    - **10 Surrogates:** The rest form 5 committees of 2 students each.  
  - **Dossiers** (Prepared by instructor during Phase 1):  
    - **Variety is Key:** Assign *different* later-self states to each group:  
      - **Case 1:** *Contentedly Confused* (e.g., advanced dementia; cheerful, disoriented, enjoys simple pleasures).  
      - **Case 2:** *Lucid Rejector* (e.g., stable cognitive capacity but now deeply religious; "I see life as sacred—save me!").  
      - **Case 3:** *Flourishing Contrary* (e.g., severe stroke, cannot speak; finds joy in music therapy—embodies directive’s *values* better than literal compliance).  
      - **Cases 4 & 5:** Mix (e.g., mild impairment with fluctuating wishes; depression).  
    - **Dossier Contents:**  
      - Medical status (capacity assessment), current preferences, emotional state.  
      - **Crucial Detail:** For *Flourishing Contrary*, show how their life *better achieves the original values* (e.g., directive refused "dependency," but current self finds meaning in community care).  
  - **Setup:**  
    - Later selves receive dossiers and 5 mins to internalize their role.  
    - Surrogates receive no materials yet.  

  ---

  ### **Phase 3: Surrogate Decision-Making (30 minutes)**  
  *(Surfaces tension: What binds—specific choices or values? Authority of past vs. present self.)*  
  - **Rules:**  
    1. **Committees Receive *One* Document:**  
       - 2 committees get *only Sheet A* (specific instructions).  
       - 2 committees get *only Sheet B* (values).  
       - 1 committee gets *both* (control group for debrief).  
    2. **The "Ghost" Rule:**  
       - The two directive-writers (from Phase 1) sit silently behind their later self, visible but non-participating.  
       - *Why it Works:* Creates visceral unease—past selves "haunt" the debate without distorting it. Avoids backfire by preventing interference.  
    3. **Medical Scenario:** All committees receive the same urgent case (e.g., "Patient has pneumonia. Treat with antibiotics?"). Later selves express current wishes (e.g., "I want treatment!" even if directive refuses it).  
    4. **Stakes:**  
       - **No Real Money:** Committees must reach consensus or defend a split vote.  
       - **Accountability:** Later selves + ghosts privately rate committee’s decision post-activity (✅= respectful, ❌= betrayal). Results revealed in debrief.  
  - **Task:** Committees have 15 mins to decide, then 15 mins to present:  
    - Decision + rationale (1 min per committee).  
    - Later selves + ghosts give non-verbal feedback (thumbs up/down).  

  ---

  ### **Predictable Problems & Pre-emption**  
  1. **Dementia Caricatures:**  
     - *Pre-empt:* Provide dossier scripts with nuance (e.g., "smiles when hearing Bach, but asks for deceased spouse"). Ban exaggerated tropes in briefing: "Play a human, not a stereotype."  
  2. **Surrogates Negotiating as Students:**  
     - *Pre-empt:* Assign roles *strictly*: "You are a hospital ethics committee bound by legal standards. Base decisions *only* on documents provided."  
  3. **Flourishing Cases Overlooked:**  
     - *Pre-empt:* Script the *Flourishing Contrary* dossier to explicitly state: "Their current life achieves [Value X] better than the directive would."  
  4. **Ghosts Breaking Silence:**  
     - *Pre-empt:* Emphasize: "Your presence is symbolic. React internally—no speaking, gestures, or eye contact."  

  ---

  ### **Debrief: Mapping Activity to Theory (15 minutes)**  
  *(Key: Let students name the tensions first, then map to frameworks.)*  
  1. **Elicit Reactions** (5 mins):  
     - "Committee 2 (values-only): Why did you override the later self’s wishes?"  
     - "Later Self 3: How did it feel to be judged against your past?"  
     - "Ghosts: When did you feel betrayed/vindicated?"  
  2. **Map to Theory** (10 mins):  
     - **Tension Spot 1:** Committees with *Sheet A* (specifics) vs. *Sheet B* (values).  
       - ➔ **Dworkin:** "Critical interests" (directive) trump "experiential interests" (later self’s joy). *Spot this in:* Flourishing cases where Sheet B committees overrode current wishes.  
       - ➔ **Competence-Based View:** Authority expires if later self is competent (e.g., *Lucid Rejector*). *Spot this in:* Committees that deferred to current wishes.  
     - **Tension Spot 2:** Ghosts’ silent presence + flourishing cases.  
       - ➔ **Identity View:** "Is the later self still the *same person*?" (e.g., dementia cases). *Spot this in:* Committees that prioritized values for confused selves but not lucid ones.  
       - ➔ **Current-Interests View:** "A flourishing patient’s wishes matter most." *Spot this in:* Committees that ignored the directive entirely.  
     - **Conclusion:** "You experienced the central clash: Does the past self’s authority bind the future? When?"  

  ---

  ### **What the Activity *Cannot* Replicate (Must Supply in Debrief)**  
  1. **Lived Temporal Identity:**  
     - Participants can’t *truly* feel the weight of their "past self’s" choices. Role-play is hypothetical, not existential.  
     - *Supply by Hand:* "Imagine your 30-year-old self binding your 80-year-old self. What is lost if we ignore past values? Present joy?"  
  2. **Authentic Surrogate Burden:**  
     - Committees lack real emotional/legal consequences. Stakes feel academic.  
     - *Supply by Hand:* "Real surrogates describe this as ‘soul-crushing.’ How might that change your reasoning?"  
  3. **Medical Uncertainty:**  
     - Role-play simplifies prognosis. Real cases involve ambiguous outcomes.  
     - *Supply by Hand:* "In reality, ‘flourishing’ is often retrospective. What if we misjudge?"  

