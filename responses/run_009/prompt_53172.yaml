  ### Futarchy Simulation Game: Design for a 90-Minute Seminar  
  **Objective:** Simulate democratic decision-making via voting vs. prediction markets, highlighting futarchy’s epistemic promises and pitfalls (manipulation, metric-proxy gaps, self-referentiality).

  ---

  #### **Game Setup**  
  **Materials Needed:**  
  - **Private Signal Cards**: 16 cards with weak signals (60% accurate).  
  - **Manipulator Cards**: 3 cards instructing students to prioritize policy adoption over accuracy.  
  - **Classroom Currency**: "DemPoints" (DP); each student starts with 50 DP in Phase 2.  
  - **Policy & Metric Sheet**: Describes policies and the "National Welfare Metric" (NWM).  
  - **True State Envelope**: Sealed envelope with the "true state" (A or B) determined by coin flip pre-class.  
  - **Proxy Metric Envelope**: Sealed envelope with the "proxy" value (different from NWM).  
  - **Whiteboard**: Track votes, market trades, prices.  

  **Backstory** (Share with students):  
  > *"Our fictional nation, 'Demetria,' must choose between two policies:*  
  > - **Policy A**: Invest in **GreenTech** subsidies (prioritizes environmental innovation).  
  > - **Policy B**: Invest in **CoalPlus** subsidies (prioritizes cheap energy and jobs).  
  >   
  > *Demetria’s goal is to maximize its 10-year **National Welfare Metric (NWM)**, a composite of economic equality, environmental health, and public happiness. NWM can only be measured in 10 years, but we’ll use a short-term proxy to resolve today’s market.*  

  **Key Mechanics:**  
  - **True State**: Fixed pre-class (coin flip: heads = A better, tails = B better).  
  - **Signals**: Students receive private signals (60% accurate).  
    - *Example signal for True State A:* "GreenTech likely boosts biodiversity" (A) or "CoalPlus likely lowers energy costs" (B).  
  - **Manipulators**: 3 students get a card: *"Your think tank funds CoalPlus. You earn 30 DP if Policy B is adopted, regardless of NWM. Maximize B’s adoption."*  
  - **NWM & Proxy**:  
    - If adopted policy **matches true state**, NWM = 100; else, NWM = 40.  
    - **Proxy** (e.g., quarterly GDP growth) is different: 80 if policy matches true state, 50 if not.  

  ---

  #### **Timeline (90 Minutes)**  
  **Phase 0: Introduction (5 min)**  
  - Explain policies, NWM, and the proxy. Do **not** mention futarchy.  
  - Distribute **private signal cards** (13 students) and **manipulator cards** (3 students).  
  - Flip coin, seal true state and proxy in envelopes.  

  **Phase 1: Voting (15 min)**  
  - **Rules**:  
    - Students vote for A or B. Majority wins.  
    - **Payoff**: All students earn DP equal to **NWM of the adopted policy** (revealed later).  
  - **Process**:  
    - 5 min: Students deliberate openly (encourage sharing signals).  
    - 2 min: Vote anonymously. Tally on whiteboard.  
    - 8 min: Record adopted policy. *Do not reveal true state or NWM yet.*  

  **Phase 2: Prediction Market (40 min)**  
  - **Rules**:  
    - Trade **conditional contracts**:  
      - **Asset A**: Pays DP = **Proxy value** if Policy A is adopted; else $0.  
      - **Asset B**: Pays DP = **Proxy value** if Policy B is adopted; else $0.  
    - Policy adoption is decided by the **higher-priced asset** after trading.  
    - Students start with 50 DP; can buy/sell assets via open outcry.  
  - **Process**:  
    - 5 min: Explain market rules. Emphasize: *"Asset payouts depend on which policy is adopted!"*  
    - 25 min: **Trading Session**:  
      - Instructor records bids/asks on whiteboard.  
      - Students trade freely (e.g., "Sell A for 30 DP!" or "Buy B for 20 DP!").  
      - *Manipulators push Policy B; others trade based on signals.*  
    - 5 min: **Market Close & Policy Adoption**:  
      - Record final asset prices. Adopt policy of the higher-priced asset.  
      - Open **proxy envelope** and payout assets (e.g., if A adopted, Asset A pays proxy value).  
    - 5 min: Calculate DP gains/losses.  

  **Phase 3: Resolution & Debrief (30 min)**  
  - Open **true state envelope**. Calculate NWM for both phases.  
  - **Payoff Conversion**:  
    - Voting Phase: All earn DP = NWM from Phase 1.  
    - Market Phase: DP from trading + NWM from Phase 2 policy.  
    - Manipulators: Extra 30 DP if their policy adopted in either phase.  
  - **Debrief Structure**:  
    1. **Reveal Futarchy**: "What you did in Phase 2 is called *futarchy*."  
    2. **Map Game to Theory**:  
       | **Game Element**          | **Futarchy Debate Concept**                             |  
       |---------------------------|--------------------------------------------------------|  
       | Aggregating weak signals  | Epistemic superiority of markets (Condorcet for trades)|  
       | Manipulators’ actions     | Vulnerability to selfish actors                        |  
       | Asset payouts ≠ NWM       | Gap between metric and proxy (metric-selection problem)|  
       | "Prices decide policy"    | Self-referential markets (causing the outcome priced)  |  
    3. **Key Discussion Prompts**:  
       - *Epistemic Contrast*: Compare Phase 1 (voting) and Phase 2 (market) outcomes. Did prices aggregate signals better than votes?  
       - *Manipulation*: "Manipulators, did you profit? Honest traders, did they distort prices?" Link to Hanson’s "manipulators subsidize truth-tellers" retort.  
       - *Self-Referentiality*: "Did anyone notice the market was *causing* the outcome it priced? How did that feel?"  
       - *Proxy Gap*: "You traded on the proxy, but NWM was different. How might this break futarchy in real life?"  
    4. **Limitations of Simulation**:  
       - Real futarchy uses **real money, liquidity, and long time horizons**—ours lacked these.  
       - IRL, traders are professionals; here, emotions/inexperience may skew results.  
       - Proxy problems are worse IRL (e.g., GDP ≠ welfare).  
    5. **Final Reflection**: "Would you trust futarchy? Why/why not?"  

  ---

  #### **Contingency Planning: Predictable Problems & Fixes**  
  1. **Problem: Trading is chaotic/too slow.**  
     - *Fix*: Use **fixed trading rounds** (e.g., four 5-min rounds). Assign a "market maker" (student volunteer) to log bids/asks.  

  2. **Problem: Market freezes (no trades).**  
     - *Fix*: Instructor injects liquidity (e.g., "I’ll buy Asset A for 25 DP!").  

  3. **Problem: Manipulators are too passive.**  
     - *Fix*: Secretly remind them: *"Push Policy B aggressively—buy Asset B at any price!"*  

  4. **Problem: Students miss self-referentiality/proxy gap.**  
     - *Fix*: In debrief, ask: *"Why did Asset A’s price surge after Jane bought it? Did that affect policy?"* and *"Who chose the proxy? Could it be gamed?"*  

  5. **Problem: True state makes one policy "obviously" better.**  
     - *Fix*: Rig signals if needed (e.g., if true=A, give 10 "A signals" and 6 "B signals").  

  ---

  **Why This Works:**  
  - Students experience epistemic aggregation (signals → prices), manipulation, and proxy gaps firsthand.  
  - Debrief explicitly ties gameplay to theory, exposing futarchy’s tradeoffs.  
  - DP incentives mirror real stakes without ethical risks.  

  **Prep Tips**:  
  - Pre-generate signals/manipulator cards.  
  - Rehearse market timing; use a timer.  
  - Bring extra DP in case of math errors.  

  This design transforms abstract critiques into lived dilemmas, setting up a rich debate on democracy’s future—*before* they even hear the word "futarchy." Good luck!
