prompt: |-
  I referee manuscripts in the foundations of physics for a mid-tier journal — perhaps six to ten papers a year, and a noticeable fraction of them hang their central claim on a thought experiment: the author constructs a scenario in the head, declares it possible or impossible, and draws a substantive conclusion about the laws or about some interpretation of quantum mechanics. My fellow referees oscillate between two reflexes: "it's just intuition dressed up, physics needs math and data, reject," and "Galileo and Einstein worked this way, accept." Neither reflex is a review. I want a procedure I can actually run in about an hour of close reading per manuscript, with written comments due in ten days, one round of author response, and the editor making the final call.

  Please take the role of a philosopher of science who has thought hard about how thought experiments can yield knowledge at all, and who has done practical refereeing, and build me a decision procedure for reviewing this kind of paper. Before writing it, sketch the taxonomy you will use. My understanding is that there is a real, live disagreement here: one camp holds that a thought experiment is only ever a disguised ordinary argument, so its apparent special force must be an illusion; another camp holds that thought experiments can do something arguments cannot — give a kind of direct insight into what the laws permit. Where that literature is genuinely split, the procedure should route around the split rather than quietly take a side, and if it cannot route around it, it should say so and flag the step as contested. Throughout, please separate what is settled among people who know this topic from what is genuinely contested, and do not present a contested view as the consensus.

  The procedure itself should give me: the questions to ask of a manuscript, in order; what counts as a sufficient answer at each step; the points at which the procedure outputs a recommendation (roughly: the thought experiment is doing genuine argumentative work / it should be converted into an explicit derivation before publication / it is intuition trading on mental pictures and should be rejected as such); and the points at which it must stop and hand the call to me, because the question is one of judgment or taste rather than something with a right answer. It should contain a step that tests for the standard failure mode — a thought experiment whose intuitiveness comes from the very theory it is meant to support — and it should tell me how a referee can test for that in practice, since none of us can introspect our own theoretical training.

  Then run the procedure on three hypothetical submissions:

  1. A Maxwell's-demon variant in which the demon has bounded memory, and the author appeals to the thermodynamic cost of erasing information to argue that the second law survives the demon.
  2. A paper arguing, from a scenario in which a perfectly isolated observer measures a quantum system and then reverses the unitary evolution, that a prominent interpretation of quantum mechanics is committed to a claim its own defenders deny.
  3. A paper that dismisses a rival's thought experiment as physically impossible while itself assuming a dynamical law that no experiment has confirmed — both sides trading in possibilities licensed by nothing.

  For at least one of these, the procedure should deliver a recommendation I will flinch at — pick whichever case you can make most uncomfortable — and then say plainly why my flinch is not a reason to override the procedure. Close by stating what the procedure cannot do: which questions about a thought experiment it leaves to the editor regardless, and where it will predictably misfire — for instance, on thought experiments whose real work is done by a diagram or by the rhythm of the prose rather than by the possibility of the scenario, or on ones whose significance only shows up decades later in mathematics.
reasoning: |-
  We are building a decision procedure for refereeing papers that rely on thought experiments in the foundations of physics. The procedure must be executable in about an hour of close reading, with written comments due in ten days, and account for the fact that there is genuine disagreement in the literature about the epistemic status of thought experiments.

  Taxonomy of Thought Experiments (TEs):
  We classify TEs based on their function and structure, drawing from the literature but without taking sides in the contested areas.

  1. **Destructive TEs**: Aim to reveal a contradiction in a theory (e.g., Einstein's chasing a light beam leading to special relativity).
  2. **Constructive TEs**: Aim to establish a new principle or law (e.g., Galileo's falling bodies showing that all objects fall at the same rate in a vacuum).
  3. **Heuristic TEs**: Used to explore the consequences of a theory or to clarify concepts (e.g., Schrödinger's cat).

  However, for our purpose, we need a functional taxonomy that focuses on the argumentative structure:

  A. **TEs that can be converted into explicit arguments**: These are TEs that are essentially deductive or inductive arguments in disguise. The TE form is rhetorical.
  B. **TEs that purport to provide direct modal insight**: These claim to give access to what is possible or necessary in the physical world, beyond what can be derived from current theories.

  The central disagreement: 
  - The "reductionist" camp (e.g., Norton) holds that TEs are just arguments and their persuasive power comes from the underlying logic.
  - The "exceptionalist" camp (e.g., Brown) holds that some TEs can give a priori knowledge of physical laws by revealing the structure of the world through intuition.

  Our procedure must route around this split when possible.

  **Decision Procedure**

  The procedure consists of a series of questions. At each step, if the answer is negative, we may proceed to rejection or to a further step. If the answer is positive, we proceed to the next step. The goal is to determine whether the TE is doing genuine argumentative work and whether it is sound.

  **Step 1: Is the TE clearly described?**
     - Check if the scenario is specified with enough precision to be evaluated. This includes the initial conditions, the laws assumed to govern the scenario (if any), and the outcome.
     - *Sufficient answer*: The scenario is described in sufficient detail that one can reason about it without having to fill in major gaps. If not, the paper must be returned for revision or rejected.
     - *Output if insufficient*: Reject or major revision. The TE is too vague to evaluate.

  **Step 2: Is the TE physically possible according to currently accepted theories?**
     - We are not asking whether it is actually possible in the real world, but whether it is consistent with our best current theories (unless the paper is challenging those theories).
     - *Sufficient answer*: The scenario does not violate well-established physical laws (e.g., conservation laws, relativity, quantum mechanics) in a way that is not explicitly intended as a challenge to those laws. If the scenario is impossible by current lights and the paper is not challenging those laws, then the TE fails.
     - *Output if impossible and not challenging*: Reject. The TE is based on an impossible scenario and thus cannot teach us about the actual world.

  **Step 3: Is the TE's central claim supported by an explicit argument?**
     - Look for an explicit logical or mathematical derivation that leads from the scenario to the conclusion. This may be in the paper or can be reconstructed by the referee without too much effort.
     - *Sufficient answer*: The paper provides a chain of reasoning (which may be mathematical or logical) that connects the scenario to the conclusion. If such an argument is present, then the TE is reducible to an argument and we can evaluate that argument.
     - *Output if yes*: Proceed to evaluate the argument (Step 3a). The TE is doing genuine work and we can assess it by the strength of the argument.

  **Step 3a: Evaluate the argument.**
     - Check for logical validity, soundness of premises, and consistency with established physics (unless challenging it). If the argument is valid and the premises are justified (by current theory or by independent evidence), then the TE is successful.
     - *Output*: If the argument is sound, then the paper should be accepted (provided other parts are acceptable). If the argument is flawed, then reject or major revision.

  **Step 4: If there is no explicit argument, can the TE be converted into one without loss?**
     - This step is contested. The reductionist says yes, the exceptionalist might say no. We route around by requiring that if the TE is to be published, it must be converted into an explicit argument. This is because the journal is a physics journal, and arguments must be made explicit for scrutiny.
     - *Sufficient answer*: The referee can reconstruct a valid argument that captures the intuition of the TE. If so, then the paper should be revised to include that argument.
     - *Output*: If reconstructible, then conditionally accept pending revision to include the explicit argument. If not, then move to Step 5.

  **Step 5: Does the TE provide direct modal insight that cannot be captured by an argument?**
     - This is the heart of the exceptionalist view. However, since this is contested, we must be cautious. We ask: Is the intuition pumped by the TE so strong and widely shared among experts that it is compelling without an argument? And is the conclusion about what is physically possible or necessary?
     - *Sufficient answer*: The TE must be such that the conclusion is immediately obvious to the relevant community (e.g., the impossibility of perpetual motion machines). But note: if the conclusion is controversial, then it cannot be widely compelling.
     - *Output*: If yes, then the paper may be accepted without an explicit argument (but this is rare and must be flagged as exceptional). If no, then the TE is not doing genuine work and the paper should be rejected.

  **Step 6: Test for circularity or theory-ladenness.**
     - This step should be done regardless of the above. We must check if the intuition that makes the TE compelling comes from the very theory that the TE is meant to support or challenge.
     - *How to test*: 
          a. Ask: If one were to deny the conclusion, would the scenario still seem possible? 
          b. Check if the scenario relies on assumptions that are equivalent to the conclusion. 
          c. Consider whether the intuition is shared by proponents of rival theories. If not, it may be theory-laden.
     - *Output*: If circular, reject. The TE is not providing independent evidence.

  **Step 7: Judgment calls**
     - If at any step the referee is uncertain (e.g., in Step 5 about whether the modal insight is genuine and shared), then the procedure stops and the referee must make a judgment call. The procedure will flag this and leave it to the referee and editor.

  **Procedure Summary (Flow):**
     Step 1: Clarity -> If not, reject/revise.
     Step 2: Physical possibility (by current theories) -> If not and not challenging, reject.
     Step 3: Explicit argument? 
          If yes, go to Step 3a (evaluate argument -> if sound, accept; if not, reject).
          If no, go to Step 4.
     Step 4: Can it be converted to an explicit argument without loss?
          If yes, conditionally accept (with revision to include argument).
          If no, go to Step 5.
     Step 5: Does it provide direct modal insight that is compelling and widely shared?
          If yes, accept (with caution, because contested).
          If no, reject.
     Step 6: Check for circularity at any point -> if found, reject.

     Note: Step 6 can be interleaved, but we do it as a separate step to ensure it is not missed.

  **Applying the Procedure to the Hypothetical Submissions**

  **Case 1: Maxwell's demon with bounded memory**

  - **Step 1**: The scenario is clearly described: a demon with bounded memory that must erase information, and the author invokes Landauer's principle to argue that erasure costs energy, saving the second law.
  - **Step 2**: The scenario is physically possible in the sense that it does not violate known laws (we assume current thermodynamics and information theory).
  - **Step 3**: There is an explicit argument: bounded memory requires erasure, erasure dissipates heat, so the second law holds. This is the standard resolution (Landauer-Bennett). 
  - **Step 3a**: The argument is sound and well-known. 
  - **Step 6**: Not circular. The intuition comes from established physics.
  - **Recommendation**: Accept. The TE is supported by an explicit argument.

  **Case 2: Quantum measurement and reversal**

  - **Step 1**: The scenario: an isolated observer measures a quantum system and then the unitary evolution is reversed. The author claims that under a specific interpretation (say, Copenhagen or many-worlds), this leads to a contradiction with the interpretation's own claims (e.g., the irreversibility of collapse).
  - **Step 2**: The scenario is physically possible? According to quantum mechanics, unitary evolution is reversible in principle. However, the isolation of the observer might be challenged (e.g., by decoherence). But let's assume it is set up as a closed system. So, it is possible by the theory's own lights.
  - **Step 3**: Is there an explicit argument? The author must show that the interpretation in question is committed to a claim that is contradicted by the reversal. This requires a careful analysis of the interpretation. The paper might or might not provide a deductive argument. 
     - Suppose the paper does not provide a formal argument but relies on the reader's intuition that reversal would "undo" the measurement and leave the observer in a state that contradicts the original measurement outcome. 
     - Then we go to Step 4: Can we convert it into an explicit argument? 
          - In quantum mechanics, the reversal would indeed return the system and observer to the initial state. But if the interpretation posits an irreversible collapse, then after reversal the observer should not remember the measurement? Or would they? This is tricky. 
          - The argument might be: 
              P1: According to interpretation X, measurement causes an irreversible collapse.
              P2: After reversal, the system and observer are in the pre-measurement state.
              P3: Therefore, the collapse did not occur (or was reversed), contradicting P1.
          - But if interpretation X allows for reversal (as in many-worlds, which is unitary), then there is no collapse to begin with. So the target must be an interpretation that insists on collapse and irreversibility. 
          - If the target is Copenhagen, which is vague, the argument might not be airtight. 
     - If the paper targets a specific interpretation and the argument can be made explicit (as above), then we require revision to include it. 
  - **Step 6**: Check circularity: The intuition that reversal undoes the measurement and leaves the observer without a record might come from the unitary formalism itself, which the interpretation might reject. So if the target interpretation denies that the reversal is possible or meaningful, then the TE might be circular. 
     - How to test: Ask whether a proponent of the target interpretation would accept that the reversal scenario is possible. If not, then the TE assumes the falsity of the interpretation (by assuming unitary reversibility) and thus is circular. 
     - For example, if the target is a collapse theory, then in that theory the reversal might be impossible. So the TE assumes unitary dynamics (which the collapse theory denies) to refute the collapse theory. This is circular. 
  - **Recommendation**: If the paper is targeting a collapse interpretation and assumes unitary reversibility (which the collapse theory denies), then it is circular (Step 6) -> reject. If the paper targets an interpretation that accepts unitarity (like many-worlds) but then claims that interpretation has a problem, then the argument can be made explicit and we can proceed to evaluate it (Step 3a). But note: in many-worlds, reversal would not contradict anything because there is no collapse. So the argument might fail. 
     - This case is complex. The referee must make a judgment about the target interpretation and the assumptions. The procedure flags that at Step 6, we found a possible circularity. Given the complexity, the referee might recommend rejection on the grounds of circularity or because the argument is not sound.

  **Case 3: Dismissing a rival's TE while assuming an unconfirmed law**

  - **Step 1**: The scenario: The author presents a rival's TE and claims it is impossible because it violates a dynamical law (say, a proposed extension of quantum mechanics). The author then offers their own TE that assumes this same law to argue for a point.
  - **Step 2**: Physical possibility? The rival's TE might be impossible by the author's assumed law, but that law is not experimentally confirmed. The author's own TE also assumes that law. 
  - **Step 3**: The paper does not provide an explicit argument for why the rival's TE is impossible beyond the assertion that it violates the unconfirmed law. Similarly, the author's own TE is based on that law without independent justification.
  - **Step 4**: Can we convert the author's dismissal of the rival's TE into an argument? Only if the unconfirmed law is taken as a premise. But without justification for that premise, the argument is weak. Similarly, the author's own TE is only as good as the assumed law.
  - **Step 5**: Does the TE provide direct modal insight? The author's claim about what is possible is based on the unconfirmed law, so it is not independent. The insight is not widely shared because the law is not established.
  - **Step 6**: Circularity: The author assumes the law to dismiss the rival and to support their own view. This is circular in the sense that the law is what is at issue.
  - **Recommendation**: Reject. The paper is trading in possibilities without a firm basis. The TEs are not doing independent work.

  **Making it uncomfortable**: Let's pick Case 2. Suppose the paper is targeting a collapse interpretation (like GRW) and argues that if we could reverse the unitary evolution (which GRW says doesn't hold because of collapses), then we would get a contradiction. The procedure flags circularity because the TE assumes unitary evolution (which GRW denies) to refute GRW. But the author might say: "I am showing that if we take quantum mechanics as strictly unitary (which is the standard formalism), then collapse theories are inconsistent." That is a valid argument. However, the collapse theorist would respond that the standard formalism is modified by the collapse theory. The TE then becomes a consistency argument about the formalism. But the paper's claim is about the interpretation. 

  The procedure leads to rejection because of circularity: the TE assumes unitary evolution to refute a theory that rejects unitary evolution. But note: the collapse theory is supposed to approximate unitary evolution in some limit. So is it fair? This is a judgment call. The procedure, being strict, says reject. 

  Why the flinch? Because the TE might be seen as a valid internal critique: if the collapse theory claims to recover unitary evolution in some limit, then in the limit of no collapse, the reversal should be possible and cause a contradiction. But the paper may not make that argument explicitly. The procedure requires an explicit argument (Step 3) or conversion to one (Step 4). If the paper does not make the argument about the limit, then the referee must reconstruct it (Step 4). If that reconstruction is possible, then conditionally accept with revision. If not, then the circularity remains and we reject.

  **What the procedure cannot do**:

  1. **Rhetorical power**: The procedure does not account for TEs that work by a diagram or by the rhythm of the prose. It focuses on the logical structure. If a TE is compelling because of its narrative or visual presentation, but fails the logical tests, the procedure will reject it. The referee must note that the TE has rhetorical value but is not logically sound.

  2. **Future significance**: The procedure cannot predict whether a TE will inspire future mathematics or physics. It evaluates based on current knowledge and argumentative standards.

  3. **Judgment calls**: The procedure leaves to the editor and referee:
     - Whether an interpretation of quantum mechanics is being accurately represented (Case 2).
     - Whether a physical scenario is possible by current theories when there is controversy (e.g., in quantum gravity).
     - Whether a TE's modal insight is widely shared among experts (Step 5) when there is disagreement.

  4. **Predictable misfires**:
     - On TEs that are deliberately paradoxical and intended to provoke a reformulation of concepts (like some in quantum foundations) but which do not have a clear argument. The procedure might reject them as vague or circular, even if they are historically important.
     - On TEs that are designed to challenge the very notion of physical possibility, such as in some quantum gravity proposals.

  The procedure is designed for efficiency and to avoid taking sides in the philosophical debate. It prioritizes explicit argumentation because that is the standard of physics journals. However, it allows for the exceptional case of TEs that provide compelling modal insight (Step 5), but that step must be used sparingly and with caution.
answer: |-
  ### Decision Procedure for Reviewing Thought Experiments in Foundations of Physics

  **Taxonomy Used**  
  I classify thought experiments (TEs) into three functional types, based on their argumentative role and epistemic claims. This avoids taking sides in the reductionist/exceptionalist debate by focusing on *what the TE does* in the paper:  
  1. **Derivation-Dependent TEs**: Serve as intuition pumps for explicit mathematical/logical arguments. Their force comes from the argument, not the scenario alone.  
  2. **Modal TEs**: Claim to directly reveal what is physically possible/impossible (e.g., "This *must* happen because no other outcome is conceivable"). Purport to provide insight beyond current theory.  
  3. **Rhetorical TEs**: Rely on vividness, diagrams, or narrative to persuade. Their intuitiveness is untethered from formal reasoning.  

  The procedure tests for the **standard failure mode** (circularity/theory-ladenness) in Step 4.  

  ---

  ### Decision Procedure  
  *Execute steps in order. Spend ~10 min per step. Stop if a rejection criterion is met. Flagged steps (⚖️) require your judgment.*  

  #### **Step 1: Clarify the TE’s Structure**  
  - **Question**: What physical scenario is constructed? What claim (C) does it support? What laws/assumptions (A) does it rely on?  
  - **Sufficient Answer**: Scenario, C, and A are explicitly stated in ≤3 sentences.  
  - **Failure**: Vagueness (e.g., "Imagine a quantum system...").  
  - **Output**: If insufficient → **Reject**.  
  - **Why**: Unclear TEs cannot be evaluated.  

  #### **Step 2: Check Physical Possibility**  
  - **Question**: Is the scenario consistent with *current empirically tested theories* (e.g., QM, relativity)?  
  - **Sufficient Answer**:  
    - *If challenging a theory*: Scenario obeys the target theory’s rules (e.g., Einstein’s elevator obeys relativity).  
    - *If supporting a theory*: No violation of established laws (e.g., no superluminal signals).  
  - **Failure**: Scenario requires unphysical elements (e.g., absolute simultaneity) *not* under challenge.  
  - **Output**: Failure → **Reject**.  
  - **Why**: TEs must engage with real physics.  

  #### **Step 3: Identify the Argument Type**  
  - **Question**: Does the author provide an explicit derivation from (A) to (C)? If not, is the TE presented as self-validating (e.g., "Clearly, X happens")?  
  - **Sufficient Answer**:  
    - Derivation-Dependent: Formal proof/equations linking A to C.  
    - Modal: Appeals to conceivability/necessity (e.g., "This is impossible in principle").  
    - Rhetorical: Relies on imagery/analogy (e.g., "Like a balloon being squeezed...").  
  - **Output**:  
    - Derivation-Dependent → Proceed to **Step 3a**.  
    - Modal → Proceed to **Step 4**.  
    - Rhetorical → **Reject** (physics requires rigor).  
  - **Why**: Rhetorical TEs are not argumentative; modal TEs need scrutiny for circularity.  

  #### **Step 3a: Test Derivation-Dependent TEs**  
  - **Question**: Is the derivation logically valid? Are assumptions (A) justified?  
  - **Sufficient Answer**:  
    - Validity: No leaps in logic; math consistent.  
    - Justification: (A) rooted in established theory *or* clearly flagged as novel/postulated.  
  - **Output**:  
    - Valid + justified → **Accept** (TE is heuristic scaffolding).  
    - Invalid/unjustified → **Reject**.  
  - **Why**: The TE’s work is done by the derivation.  

  #### **⚖️ Step 4: Test for Circularity (Critical for Modal TEs)**  
  - **Question**: Could the intuitiveness of the TE depend on the very theory it aims to support/attack?  
  - **Test Method**:  
    1. **Denial Test**: If you deny (C), does the scenario still seem possible? If yes, circularity risk is low.  
    2. **Rival Theory Check**: Would proponents of rival theories find the scenario intuitive? (Consult literature if needed.)  
    3. **Assumption Audit**: Are any assumptions (A) functionally equivalent to (C)?  
  - **Sufficient Answer**:  
    - Low risk: Denial test passes; no equivalence between A and C.  
    - High risk: Intuition collapses if (C) is false; A presupposes (C).  
  - **Output**:  
    - Low risk → Proceed to **Step 5**.  
    - High risk → **Reject** (theory-laden).  
  - **Why**: Circular TEs beg the question. This step routes around the reductionist/exceptionalist split by focusing on whether the TE’s persuasiveness is theory-dependent.  

  #### **⚖️ Step 5: Evaluate Modal Claim (For Non-Circular Modal TEs)**  
  - **Question**: Is the modal claim (e.g., "This is impossible") supported by expert-accessible intuition?  
  - **Sufficient Answer**:  
    - The outcome/conclusion is *inescapable* to experts across camps (e.g., Galileo’s ship: relativity of motion is undeniable once seen).  
    - *Not sufficient*: Novelty (e.g., "No one considered this before").  
  - **Output**:  
    - Yes → **Accept** (TE provides genuine modal insight).  
    - No → **Reject** (unconvincing without derivation).  
  - **Why**: Genuine modal TEs reveal constraints all experts can acknowledge. This step accepts exceptionalism but only when intuition is intersubjective.  

  ---

  ### Application to Hypothetical Submissions  
  **Key**: ⚖️ = Judgment call; ✓ = Pass; ✗ = Fail.  

  #### **Case 1: Maxwell’s Demon with Bounded Memory**  
  - **Step 1**: ✓ Scenario: Demon with finite memory erases information. Claim (C): Second law holds due to erasure cost.  
  - **Step 2**: ✓ Consistent with thermodynamics/information theory.  
  - **Step 3**: Derivation-Dependent (appeals to Landauer’s principle). → **Step 3a**.  
  - **Step 3a**: ✓ Derivation valid (erasure → heat dissipation); assumptions justified (Landauer’s principle is established).  
  - **Output**: **Accept** (TE scaffolds a sound argument).  

  #### **Case 2: Quantum Measurement Reversal**  
  - **Step 1**: ✓ Scenario: Isolated observer measures system, evolution reversed. Claim (C): Interpretation X (e.g., Copenhagen) contradicts itself.  
  - **Step 2**: ✓ Possible under unitary QM (if observer is isolated).  
  - **Step 3**: Modal (e.g., "Reversal proves measurement was never complete"). → **Step 4**.  
  - **Step 4**: ⚖️ **High risk of circularity**.  
    - *Denial Test*: If you deny collapse (C), reversal seems natural—but proponents of X *deny* reversibility. Intuition depends on accepting unitary QM.  
    - *Rival Check*: Bohmians/Many-Worlders agree; collapse theorists reject the scenario’s possibility.  
    - *Assumption Audit*: Assumes unitary reversibility, which contradicts collapse theories.  
  - **Output**: **Reject** (TE assumes the falsity of the interpretation it attacks).  
  - **Uncomfortable Truth**: This TE is common but often question-begging. The procedure forces confrontation with circularity. Your flinch (e.g., "But unitary QM is standard!") is not an override reason because the TE *presumes* unitary QM to refute rivals—a move contested in foundations. The procedure routes around the philosophy by exposing dialectical unfairness.  

  #### **Case 3: Dismissing a Rival’s TE**  
  - **Step 1**: ✓ Scenario: Author dismisses rival’s TE as impossible under novel law L; uses L in their own TE.  
  - **Step 2**: ✗ Rival’s TE may violate L, but L is unconfirmed. Author’s TE assumes L without justification.  
  - **Output** (Step 2): **Reject** (both TEs rely on speculative physics).  

  ---

  ### What the Procedure Cannot Do  
  1. **Judge Rhetorical or Aesthetic Merit**: TEs that persuade via diagrams/prose (e.g., Schrödinger’s cat) will be rejected at Step 3 unless backed by argument.  
  2. **Predict Future Significance**: TEs that seed mathematical insights (e.g., Einstein’s elevator → general relativity) may be rejected if they fail *current* checks (e.g., Step 2 violations).  
  3. **Resolve Expert Disagreement**: ⚖️ Steps 4–5 require your judgment on:  
     - Whether intuition is theory-laden (Step 4).  
     - Whether modal insight is "inescapable" (Step 5).  
  4. **Handle Boundary-Pushing TEs**: Those challenging empirical adequacy (e.g., quantum gravity) may fail Step 2 but deserve leniency. The procedure flags this but defaults to rejection.  
  5. **Misfire Cases**:  
     - **Visually Driven TEs**: Feynman diagrams or narrative rhythm might do real work but get rejected as "rhetorical" (Step 3).  
     - **Paradox-First TEs**: Designed to *create* confusion (e.g., some quantum paradoxes) may be rejected for vagueness (Step 1) or circularity (Step 4).  

  The procedure prioritizes **argumentative rigor** over philosophical openness, as befits a physics journal. It routes around the reductionist/exceptionalist split by demanding that modal TEs prove their intuitiveness is theory-neutral and expert-accessible. When in doubt, it defaults to requiring explicit derivations—a conservative stance justified by the field’s history of contentious TEs.
