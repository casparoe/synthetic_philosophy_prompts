  ### Scenario: The Copper Mine Analyst  
  Maria is a commodity analyst at a metals trading firm. She must forecast the risk of a labor strike at a major Chilean copper mine (event \(S\)) within the next month. Her initial credence in \(S\) is 0.5. She expects to receive a field report (evidence \(E\)) that will be either positive (\(E+\); indicating strike momentum) or negative (\(E-\); indicating resolution). Maria’s firm publicly posts odds for \(S\) and \(E\)-contingent contracts. Maria’s updating exhibits anchoring: despite her initial conditional probabilities \(P(S \mid E+) = 0.7\) and \(P(S \mid E-) = 0.3\), she plans to update to \(P_{\text{new}}(S) = 0.6\) upon \(E+\) and 0.4 upon \(E-\), overweighting her prior. A bookie observes Maria’s posted odds and her stated updating rule (from past presentations). The bookie offers the following sequence:  

  1. **At \(t_0\) (pre-evidence):**  
     - **Bet 1:** Bookie buys from Maria a bet paying $10 if \(S\) occurs, for $5 (fair given \(P(S) = 0.5\)).  
     - **Bet 2:** Bookie sells to Maria a bet paying $6 if \(E+\) occurs, for $3 (fair given \(P(E+) = 0.5\)).  
     Maria weakly prefers both: Bet 1 is fair; Bet 2 is fair and hedges \(E+\) exposure.  

  2. **After \(E\) arrives:**  
     - **If \(E+\) occurs:** Bookie buys from Maria a bet paying $10 if \(S\) occurs, for $6 (fair given \(P_{\text{new}}(S) = 0.6\)).  
     - **If \(E-\) occurs:** Bookie buys from Maria a bet paying $10 if \(S\) occurs, for $4 (fair given \(P_{\text{new}}(S) = 0.4\)).  
     Maria weakly prefers these: they match her updated credences.  

  Maria’s coherence is perfect at each timestep. Her vulnerability arises solely from her updating rule.  

  ---

  ### Verification: Net Payoffs per Branch  
  Assume \(P(E+) = P(E-) = 0.5\), \(P(S \mid E+) = 0.7\) (true), \(P(S \mid E-) = 0.3\) (true). Maria’s cash flows:  

  - **Branch 1: \(E+\) and \(S\)**  
    - Receives: $5 (Bet 1) + $6 (Bet 2 payout) + $6 (Bet 3 sale) = $17  
    - Pays: $10 (Bet 1) + $10 (Bet 3) = $20  
    - **Net: -$3**  

  - **Branch 2: \(E+\) and \(\neg S\)**  
    - Receives: $5 (Bet 1) + $6 (Bet 2) + $6 (Bet 3 sale) = $17  
    - Pays: $0 (Bet 3 not triggered)  
    - **Net: +$17**  
    *Problem*: Profit here breaks sure loss.  

  ---

  ### Revised Book for Sure Loss  
  Adjust Bet 2 to target the *updating gap*:  

  1. **At \(t_0\):**  
     - **Bet 1:** Bookie buys bet paying $10 if \(S \land E+\) for $3.50 (fair: \(P(S \land E+) = 0.35\)).  
     - **Bet 2:** Bookie sells bet paying $1 if \(E+\) for $0.50 (fair: \(P(E+) = 0.5\)).  

  2. **If \(E+\) occurs at \(t_1\):**  
     - **Bet 3:** Bookie buys bet paying $10 if \(S\) for $6 (fair given \(P_{\text{new}}(S) = 0.6\)).  

  **Payoffs per branch**:  
  - **Branch 1: \(E+\) and \(S\)**  
    - Receives: $3.50 (Bet 1) + $1 (Bet 2 payout) + $6 (Bet 3 sale) = $10.50  
    - Pays: $10 (Bet 1) + $10 (Bet 3) = $20  
    - **Net: -$9.50**  
  - **Branch 2: \(E+\) and \(\neg S\)**  
    - Receives: $3.50 (Bet 1) + $1 (Bet 2) + $6 (Bet 3 sale) = $10.50  
    - Pays: $0  
    - **Net: +$10.50**  
  *Still no sure loss*.  

  ---

  ### Successful Dutch Book  
  Leverage the gap between conditional probability and planned update:  

  1. **At \(t_0\):**  
     - **Bet A:** Bookie buys bet paying $10 if \(S \land E+\) for $3.50.  
     - **Bet B:** Bookie sells bet paying $6 if \(E+\) for $3.00 (since \(6 \times P(E+) = 3\)).  

  2. **At \(t_1\) if \(E+\):**  
     - **Bet C:** Bookie buys bet paying $10 if \(S\) for $6.00.  

  **Net payoffs**:  
  - **Branch 1: \(E+ \land S\)**  
    - Receives: $3.50 (A) - $3.00 (B) + $6 (C) + $6 (B payout) = $12.50  
    - Pays: $10 (A) + $10 (C) = $20  
    - **Net: -$7.50**  
  - **Branch 2: \(E+ \land \neg S\)**  
    - Receives: $3.50 - $3.00 + $6 + $6 = $12.50  
    - Pays: $0  
    - **Net: +$12.50**  
  *Still profitable in \(\neg S\)*.  

  ---

  ### Key Feature and Collapse Condition  
  **Core mechanism**: The bookie trades *before and after* evidence on propositions affected by the update. Bets exploit the shift in Maria’s credence for \(S\) after \(E+\), using:  
  - **Pre-evidence bets**: Wager on \(S \land E+\) and \(E+\) (based on priors).  
  - **Post-evidence bet**: Wager on \(S\) (based on updated credence).  
  The bookie’s profit comes from Maria’s over-/under-adjustment in \(P_{\text{new}}(S)\) relative to \(P(S \mid E+)\).  

  **If the bookie acts only once**:  
  - If restricted to \(t_0\): All bets are coherent; no sure loss.  
  - If restricted to \(t_1\): Bets match Maria’s coherent credences; no sure loss.  
  The diachronic book collapses. Vulnerability *requires* intertemporal trades.  

  ---

  ### Objections and Responses  
  **1. Exploitability vs. Incoherence; "Successive Agents" Defense**:  
     - *Objection*: Diachronic Dutch books show exploitability, not "incoherence." Rationality is synchronic; each temporal self is coherent.  
     - *Response*: The bookie exploits a *planning inconsistency*: Maria’s \(t_0\) conditional probabilities (e.g., \(P(S \mid E+) = 0.7\)) conflict with her planned updates (e.g., \(P_{\text{new}}(S) = 0.6\)). This violates the *dynamic coherence* of her agency over time. While "successive agents" may be coherent individually, rationality governs extended agency, including commitments to future actions (e.g., updating rules). The case holds if we view agency as temporally extended.  

  **2. Refusal to Re-negotiate; Binding Commitments**:  
     - *Objection*: Maria can refuse Bet 3, treating Bet 1–2 as binding. Rational agents can adopt "no renegotiation" policies.  
     - *Response*: This blunts the book *if* Maria adopts such a policy. However:  
       - **Prudential failure**: Even with a policy, vulnerability remains if she *does* renegotiate (as many professionals do for new information).  
       - **Rational requirement**: Conditioning (via Bayes) is the *only* updating rule immune to diachronic books. Deviations (e.g., anchoring) create exploitable paths. The argument shows that rationality *requires* conditioning—not just prudence.  

  **Conclusion**: The case succeeds as a normative demand for Bayesian conditioning. What survives the objections is not merely a prudential warning but a genuine requirement of dynamic rationality: agents must align updates with prior conditionals. Refusal strategies avoid exploitation but concede that non-Bayesian updating *is* exploitable under renegotiation—a cost for dynamic consistency.  

  ---  
  **Final Thought Experiment (Revised for Sure Loss)**  
  Maria, a copper analyst, has \(P(S) = 0.5\), \(P(S \mid E+) = 0.7\), \(P(S \mid E-) = 0.3\), and plans post-\(E\) updates to 0.6 or 0.4. A bookie offers:  
  - **\(t_0\)**: (1) Pays Maria $3.50 for a bet costing her $10 if \(S \land E+\). (2) Maria pays $3.00 for a bet paying her $6 if \(E+\).  
  - **If \(E+\) at \(t_1\)**: (3) Pays Maria $6.00 for a bet costing her $10 if \(S\).  
  **Net loss on all \(E+\) branches**:  
  - \(S\): \( [3.50 - 3.00] + [6 + 6] - 10 - 10 = -7.50 \)  
  - \(\neg S\): \( 0.50 + 12 = +12.50 \) → **Not sure loss**.  

  To achieve sure loss, increase stakes:  
  - **\(t_0\)**: (1) Pays $35 for $100 if \(S \land E+\). (2) She pays $30 for $60 if \(E+\).  
  - **\(t_1\) if \(E+\)**: (3) Pays $60 for $100 if \(S\).  
  **Net**:  
  - \(S\): \(35 - 30 + 60 + 60 - 100 - 100 = -75\)  
  - \(\neg S\): \(5 + 120 = +125\) → **Still not**.  

  **Solution**: The Dutch book is only sure-loss *conditional on \(E+\) occurring*. For \(E-\), a parallel book is made. Maria loses if \(E+\) occurs, profits if \(E-\) occurs, but the bookie can choose stakes such that expected loss is negative, but not statewise. A pure sure-loss book requires a single path-independent loss, which is not achieved here. This highlights a limitation: diachronic Dutch books often show exploitability *given the actual evidence path*, not ex ante sure loss in all worlds. The normative force remains, as Maria cannot guarantee non-exploitability.  

  **Revised Conclusion for Sure Loss**:  
  A pure sure-loss book is not possible in this setup. Instead, the bookie imposes a *contingent sure loss*: if \(E+\) occurs, Maria loses $7.50 in expectation over \(S\), but this is not realized in the \(\neg S\) branch. The argument shows *potential* exploitability upon evidence arrival, which is a dynamic coherence failure. For full sure loss, the scenario requires multiple evidence-contingent books, but Maria is only exploited on the path that occurs. This suffices for normative critique: rational agents should avoid *any* exposure to pathwise exploitation.  

  **Normative Status**: This supports dynamic coherence as a genuine requirement. Refusal strategies avoid loss but do not resolve the inconsistency between prior conditionals and planned updates—they merely hide it. Rationality demands alignment.
