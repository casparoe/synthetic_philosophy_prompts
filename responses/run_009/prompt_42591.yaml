  I'm applying for a small dissertation fellowship (about 18 months, just me, no lab or research team) and I need a proposal on cause prioritization frameworks, specifically the importance/tractability/neglectedness (ITN) scoring that effective altruism types use. My half-formed idea is that the three factors aren't actually independent the way the framework implicitly assumes -- e.g. tractability arguably depends on neglectedness (returns to effort usually diminish as a cause gets crowded, so a cause can't be both highly neglected and highly tractable at scale without something weird going on), and "importance" itself smuggles in unresolved aggregation choices, like whether you're a totalist or a person-affecting theorist, which can flip the score for population-scale causes completely. Turn this into a proposal: state the research question precisely, say why the standard presentations of ITN leave it open (they mostly just multiply three numbers without asking whether the numbers are independent), describe the actual method -- I'm thinking formalizing the framework with explicit functional forms for how the factors interact, then stress-testing it on worked examples -- and include what would count as the project failing. Also give me a realistic 18-month scope, and be honest about the biggest risk of the whole thing, which is probably that it collapses into either pure math with no connection to real prioritization decisions or just a bunch of hand-wavy verbal complaints. No citations needed, I'll add those later. Please write it in American English, and keep the tone reasonably plain -- the reviewers are economists and philosophers, not AI safety people.
