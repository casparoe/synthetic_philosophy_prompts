answer: |-
  Below is a step-by-step procedure for deciding how to phrase claims on museum labels (flat, hedge, attribute, or drop). It's based on epistemic principles of knowledge, evidence, and responsible assertion, distilled for practical use. The core idea is that a flat statement requires **well-justified confidence**, not just truth—meaning the claim must be supported by strong, direct evidence and broad expert consensus. Hedging or attributing is used when evidence is weaker or contested, and dropping is reserved for claims that are false, unsupported, or misleading. The procedure forces you to explicitly evaluate the quality of evidence and expert agreement, with clear exit points.

  The procedure is designed for speed (5 minutes or less per claim) and simplicity. It uses plain language, requires no prior philosophy knowledge, and includes "judgment call" flags where subjective assessment is unavoidable. I'll first outline the procedure, then apply it to your three cases, and end with its limitations.

  ---

  ### **The Procedure: Questions to Ask in Order**
  Run these questions sequentially for each claim. Stop when you reach an output. Be honest about uncertainty—if you're unsure at a step, default to the more cautious output (e.g., if unsure about "solid evidence," move to the next step).

  1. **Is the claim verifiably false?**  
     - **Check:** Do we have concrete evidence (e.g., documents, scientific analysis, expert consensus) proving it wrong? Ignore hunches or gaps—focus on active disproof.  
     - **Sufficient answer:** "Yes" only if disproof is clear and uncontested (e.g., carbon dating shows an artifact is centuries younger than claimed).  
     - **Output if yes:** **Drop.** Do not include.  
     - **Output if no:** Proceed to Question 2.

  2. **Is there unresolved expert controversy about the claim?**  
     - **Check:** Is there meaningful disagreement among relevant experts (e.g., art historians, archaeologists, biologists) based on evidence? "Meaningful" means at least one reputable expert actively disputes it with reasoning, not just silence or passive doubt. Ignore fringe views without evidence.  
     - **Judgment call flag:** You must assess what counts as "reputable" and "meaningful." When in doubt, assume controversy exists if a challenge is published and credible.  
     - **Sufficient answer:** "Yes" if disagreement could reasonably alter the claim (e.g., a specialist reattributes a painting). "No" if experts uniformly accept it or critiques are weak.  
     - **Output if yes:** Proceed to Question 5.  
     - **Output if no:** Proceed to Question 3.

  3. **Is the claim supported by solid, direct evidence?**  
     - **Check:** Is the evidence high-quality, first-hand, and methodologically sound? Examples: scientific dating with a known error margin, primary documents, or consensus-backed techniques (e.g., DNA analysis). Indirect evidence (e.g., stylistic comparisons) or tradition alone doesn't count.  
     - **Judgment call flag:** "Solid and direct" is based on current best practices. Ask: "Would an expert in the field present this as fact in a textbook?"  
     - **Sufficient answer:** "Yes" if evidence is robust and leaves no reasonable doubt (e.g., a dated inscription on an artifact). Include any inherent uncertainty (e.g., error margins) in the label text. "No" if evidence is circumstantial, outdated, or requires inference.  
     - **Output if yes:** **State flat.** (E.g., "This bowl was made around 1200 BCE." Include error margins if applicable.)  
     - **Output if no:** Proceed to Question 4.

  4. **Is the claim a well-supported, consensus-backed belief?**  
     - **Check:** Is this the best current explanation based on evidence, even if indirect? Requires broad expert agreement (e.g., 80–90% of specialists). Avoid if the claim is speculative or relies on weak sources.  
     - **Sufficient answer:** "Yes" if it's the default position in the field with no strong alternatives (e.g., a species identification from a trusted museum's collection records). "No" if evidence is scant or contested.  
     - **Output if yes:** **Hedge.** (E.g., "was likely made," "probably dates to.")  
     - **Output if no:** Proceed to Question 5.

  5. **Is there a reputable source for the claim?**  
     - **Check:** Can we attribute it to a specific expert, institution, tradition, or publication? "Reputable" means credible within the field (e.g., peer-reviewed journals, established historians, or long-held local stories).  
     - **Sufficient answer:** "Yes" if a source exists, even if outdated or contested (e.g., a 19th-century guidebook). "No" if it's an unsourced rumor or modern fabrication.  
     - **Output if yes:** **Attribute.** (E.g., "According to [Source],..." or "Tradition holds that...")  
     - **Output if no:** **Drop.**  

  **When Human Judgment Takes Over:**  
  - This procedure stops at the outputs above. **After** reaching an output, consider mission/audience factors:  
    - Is the claim vital for engagement or storytelling? If so, you might retain it with stronger caveats (e.g., attribute even if you'd otherwise drop).  
    - Does the label context (e.g., a "local legends" section) justify looser standards?  
    - **Always disclose uncertainty transparently.** Never override a "drop" to "flat"—this risks misinformation.  
  - The curator's sign-off is the final check for judgment calls (e.g., assessing "solid evidence" or "reputable source").

  ---

  ### **Applied to Your Cases**
  I'll run the procedure for each case, showing the step-by-step reasoning. Outputs are bolded.

  #### **Case 1: Fossil Dating**  
  **Claim:** "This fossil is 65 million years old."  
  - **Step 1: False?** No. We trust the dating method and team. Proceed.  
  - **Step 2: Controversy?** No. The method is trusted, results are published, and no experts dispute this specific dating. Proceed.  
  - **Step 3: Solid evidence?** Yes. The dating method is reliable, applied correctly, and has a published error margin. **Output: State flat.**  
    - **Label wording:** "This fossil dates to 65 million years ago (± 0.5 million years)." (Include the error margin as part of the flat statement.)  
  - **Why not hedge?** High-quality scientific evidence with quantifiable uncertainty justifies flat statements. Adding "probably" would understate the confidence.

  #### **Case 2: Portrait Attribution**  
  **Claim:** "This portrait is by [Minor Master]."  
  - **Step 1: False?** No. We lack proof it's fake. Proceed.  
  - **Step 2: Controversy?** Yes. One respected specialist disputes it as a workshop copy, and the field hasn't engaged yet. This is unresolved debate. Proceed to Step 5.  
  - **Step 5: Reputable source?** Yes. The old attribution appears in guidebooks and was previously accepted. **Output: Attribute.**  
    - **Label wording:** "Traditionally attributed to [Minor Master], though some experts suggest it may be a workshop copy."  
  - **Why not hedge or drop?** Hedging alone ("probably by...") hides the controversy. Attribution acknowledges the source (tradition) and the current debate. Dropping ignores visitor expectations and the label's educational role.

  #### **Case 3: Oak Tree Legend**  
  **Claim:** "This oak was planted by [Famous Figure]."  
  - **Step 1: False?** No. No evidence disproves it. Proceed.  
  - **Step 2: Controversy?** No. Experts aren't debating it—there's simply no evidence either way. It's a legend, not a scholarly dispute. Proceed.  
  - **Step 3: Solid evidence?** No. No primary documents or scientific data support it. Proceed.  
  - **Step 4: Well-supported belief?** No. Not a consensus view; it's folklore without evidence. Proceed.  
  - **Step 5: Reputable source?** Yes. Repeated in older guidebooks and museum materials. **Output: Attribute.**  
    - **Label wording:** "Local legend claims [Famous Figure] planted this oak."  
  - **Why not flat?** No evidence justifies a factual statement. Hedging ("probably planted by...") implies scholarly support, which is absent. **The director won't like this,** but attribution balances mission goals (keeping the engaging story) with honesty (calling it a legend).  
  - **Post-procedure judgment:** If the director insists on retention, emphasize that attribution is non-negotiable for integrity. Place it in a "Myths and Folklore" section to contextualize.

  ---

  ### **What the Procedure Cannot Do**  
  1. **Resolve ambiguous judgment calls:** Two careful people might disagree on:  
     - Step 2 (Is it "controversy" or just one dissenter?).  
     - Step 3 (Is evidence "solid" or circumstantial? e.g., stylistic analysis in art).  
     - Step 4 (What counts as "well-supported"? e.g., local history with patchy records).  
     - **What to do:** Escalate to the curator. If time allows, consult a third expert. Default to the more cautious output (e.g., if unsure about Step 3, move to Step 4 and hedge). Document the reasoning for transparency.

  2. **Handle mission/audience conflicts:** The procedure prioritizes epistemic rigor, but museums must engage the public. It might output "attribute" for a beloved legend when the director wants "flat."  
     - **What to do:** Never override "drop" or "attribute" to "flat"—this misleads visitors. Use attribution as a compromise (e.g., "Legend says..."). After the procedure, discuss with the curator how to frame the claim for accessibility (e.g., a sidebar explaining why legends matter).

  3. **Address unknown unknowns:** It can't evaluate claims where evidence is emerging (e.g., a brand-new theory). In such cases, the procedure will likely output "attribute" or "drop" due to lack of consensus.  
     - **What to do:** Revisit labels when new evidence arises. Build a review every 2–3 years.

  4. **Replace expertise:** It relies on your/curator's knowledge of the field. If you're unsure about expert consensus (e.g., in Step 2), the procedure can't fill gaps.  
     - **What to do:** Use quick checks like museum databases or academic summaries. When time is short, defer to the curator's judgment.

  **Final Tip:** Keep a cheat sheet of the 5 questions. Under deadline, focus on Steps 1–2 first—they often decide half the cases quickly. If the curator is reading over your shoulder, use the "judgment call" flags to prompt discussions (e.g., "Step 3 is a judgment call—do you see this evidence as solid?"). This makes the process collaborative and defensible. 

  If you later want philosophical references (e.g., epistemology of testimony, assertion norms), I can provide them—but this procedure is built from those principles, simplified for your needs.
