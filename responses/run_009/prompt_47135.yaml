  The core idea is to assess the epistemic status of the claim. We want to avoid asserting flatly what we do not have adequate grounds for, even if it might be true. We also want to avoid hedging unnecessarily when we have solid grounds.

  The procedure is a decision tree with questions. We proceed until we reach an output (flat, hedge, attribute, drop) or until we hit a point that requires human judgment about the museum's mission or audience.

  Key concepts:

  - **Claim**: The statement we are considering (e.g., "This bowl was made around 1200 BCE").

  - **Grounds**: The evidence and reasoning supporting the claim.

  - **Knowledge vs. Well-supported belief**: We are not requiring absolute certainty (which is rare in history and science) but rather a level of support that makes the claim highly reliable and widely accepted by experts.

  The procedure:

  **Step 1: Is the claim verifiably false?**
     - If yes: **Drop it.** Do not include a false claim.
     - If no: Proceed to Step 2.

  **Step 2: Is there any significant controversy among experts?**
     - **Significant controversy**: A substantial portion of qualified experts in the field disagree with the claim, and the disagreement is based on substantive grounds (not just a fringe view).
     - If yes: **Hedge or Attribute.** (We'll decide which in Step 4.)
     - If no: Proceed to Step 3.

  **Step 3: Are the grounds for the claim solid and direct?**
     - **Solid and direct grounds**: The claim is based on evidence that is:
          - Contemporaneous (e.g., an inscription on the object, a primary document from the time, or a well-established scientific method with a known error rate).
          - Uncontested by the relevant experts (as per Step 2) and the method is standard and reliable.
     - If yes: **State flatly.**
     - If no: Proceed to Step 4.

  **Step 4: Do we have a well-supported belief?**
     - **Well-supported belief**: The claim is supported by a preponderance of evidence (even if indirect) and is the consensus or majority view among experts. However, the grounds might not be direct or might have some uncertainty (such as a dating method with a margin of error that we report).
     - If yes: **Hedge** (e.g., "probably", "around", "likely").
     - If no: Proceed to Step 5.

  **Step 5: Is there a reputable source (or sources) that holds this belief?**
     - **Reputable source**: An expert or institution with recognized authority in the field, or a well-regarded publication.
     - If yes: **Attribute** (e.g., "According to Dr. Smith, ...", "Traditionally attributed to ...").
