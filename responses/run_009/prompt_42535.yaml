answer: |-
  You've hit on a profound and contentious issue in philosophy of science. Your three cases are interconnected but represent distinct facets of **empirical equivalence** and its philosophical implications. Here's a breakdown:

  ### 1. **The Core Concept: Permanent Underdetermination by Empirical Evidence**
     - **Name**: **Strong Underdetermination** or **Permanent Empirical Equivalence**.
     - **Definition**: Two (or more) theories are *empirically equivalent* if they make identical predictions for *all possible observations, past, present, and future, in all conceivable contexts*. When no experiment could ever distinguish them, they are **strongly underdetermined** by evidence.
     - **Relation to Weaker Underdetermination**:  
       - *Weak Underdetermination* (Duhem-Quine Thesis): Theories are tested in bundles (auxiliary assumptions + core hypothesis). Failure doesn't pinpoint which part is wrong.  
       - *Strong Underdetermination*: Even *perfect testing conditions* (no auxiliary errors, infinite data) cannot choose between theories. They are **empirically indistinguishable in principle**.

  ### 2. **Your Cases: One Phenomenon with Gradations**
     - **Case 1 (Curve-Fitting)**  
       - *Weak/Empirically Resolvable Underdetermination*: More data *could* break the tie. It’s underdetermined *for now*, but not permanently.  
       - **Why it feels "cheap"**: It’s a practical limitation, not deep equivalence.  
     
     - **Case 2 (Special Relativity vs. Lorentz Ether)**  
       - *Paradigm Example of Strong Underdetermination*:  
         - Both predict identical outcomes for *all possible experiments* (e.g., length contraction, time dilation).  
         - Differences are purely **ontological**: SR says spacetime is relative; Lorentzian ether posits a hidden, undetectable "preferred frame."  
       - **Key Insight**: This is **not** about notation. The theories posit *fundamentally different realities*, yet agree on all observables.  

     - **Case 3 (Quantum Interpretations)**  
       - *The Boundary of Empirical Equivalence*:  
         - Some interpretations (e.g., Copenhagen vs. Many-Worlds) are claimed to be empirically equivalent *for all practical purposes*.  
         - But debates arise because:  
           - Some interpretations *might* imply testable differences (e.g., collapse mechanisms in GRW theory vs. decoherence in Many-Worlds).  
           - Others (e.g., Bohmian mechanics) are explicitly constructed to match standard QM predictions but add hidden variables.  
       - **Ambiguity**: Here, the line between "different theories" vs. "different notations" blurs. If an interpretation *only* re-describes the math without new predictions, is it a distinct theory?

  ---

  ### 3. **The Philosophical Edges: Where Does Equivalence End?**
     - **When Are Two Theories "The Same"?**  
       - **Syntactic View**: If theories can be translated into each other *without loss of empirical content* (e.g., classical mechanics in Newtonian vs. Lagrangian formalism), they are "notational variants."  
       - **Semantic View**: If they describe the *same structure* of reality (e.g., temperature as mean kinetic energy vs. thermodynamic parameter), they are equivalent.  
       - **Your Case 2**: SR and Lorentz ether are *not* notational variants. Their core *ontological commitments* conflict (relational spacetime vs. absolute background), even if predictions align.  

     - **Can "Unobservable Differences" Matter?**  
       - **Scientific Realism**: Yes. Reality isn’t just about predictions; it’s about what *explains* them (e.g., SR’s spacetime geometry is more parsimonious than Lorentz’s undetectable ether).  
       - **Empiricism/Instrumentalism**: No. If theories are predictively identical, their "underlying reality" is meaningless. Only empirical adequacy matters.  

     - **Is Strong Underdetermination Truly Possible?**  
       - Critics (e.g., Quine, Laudan) argue:  
         - Future science *might* reveal new tests (e.g., quantum gravity could break SR/Lorentz equivalence).  
         - Theories often diverge in untested domains (e.g., singularities, multiverses).  
       - Defenders (e.g., van Fraassen): Some equivalences are robust (e.g., particle/field duality in QFT).

  ---

  ### 4. **Key Terms & Frameworks**
     - **Permanent Underdetermination**: Theories are rivals forever, despite empirical equivalence.  
     - **Empirically Equivalent Rivals**: A more neutral term for Case 2.  
     - **Conventionalism**: The view that choosing between equivalent theories is a matter of convention (Poincaré on geometry).  
     - **Structural Realism**: Suggests we should only commit to the *common structure* of empirically equivalent theories (e.g., spacetime intervals in SR/Lorentz), not their ontology.

  ---

  ### 5. **Conclusion: Your Three Cases Unified**
     - **Case 1** is *weak* underdetermination (resolvable with more data).  
     - **Cases 2 and 3** are *strong* underdetermination:  
       - Case 2 is "clean" (clear rivals with ontological conflict).  
       - Case 3 is "messy" (disagreement on whether interpretations are rivals or reformulations).  
     - **The Line Between Rival Theories vs. Notational Variants**:  
       - If theories disagree on *fundamental ontology* (e.g., particles vs. waves, absolute vs. relational space) *and* this disagreement has no empirical consequence, they are **permanently underdetermined rivals**.  
       - If they merely repackage the same ontology/formalism (e.g., F=ma vs. F−ma=0), they are **notational variants**.

  **Why This Matters**: Strong underdetermination challenges scientific realism. If multiple incompatible descriptions fit all data equally well, can we ever know "what’s really there"? The answer depends on whether you prioritize predictive power or ontological truth—a divide at the heart of philosophy of science.
