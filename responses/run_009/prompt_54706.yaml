     - Did the existence of characters who were better off under depletion complicate the discussion?

  2. Discuss the nonidentity problem:
     - Point out that for the depletion-only characters, they wouldn't exist under conservation. So depletion doesn't harm them (compared to the alternative). In fact, they benefit by existing.
     - For the harmed-in-both characters, they are worse off under depletion, but they still exist. Is their complaint stronger? (Yes, because they are worse off than they would have been.)
     - But note: the better-off-in-depletion characters are better off, so they are happy.

  3. Contrast with Round 2:
     - In Policy H, we are harming the same people. It's clear that there are victims.

  4. Philosophical concepts:
     - Counterfactual account of harm: Harm requires that a person is worse off than they would have been otherwise. This fails in the nonidentity case for those who only exist in one policy.
     - The person-affecting intuition: We think that an action is wrong only if it makes some person worse off. But in the nonidentity case, it's hard to say who is made worse off.
     - The "better-off under depletion" characters show that depletion is not all bad. But does that make it right?

  5. Limitations:
     - The activity cannot fully replicate the contingency of existence because the students are already here. They might see that their existence isn't really at stake.
     - The role-play is artificial: real future people cannot speak for themselves.

  6. Final reflection: How does this connect to real-world decisions (like your friend's)? The nonidentity problem arises in many contexts: environmental policy, reproductive choices, etc. It challenges us to think beyond individual harms.

  **Practical Adjustments**

  - If the class is large, you might need to adjust times.
  - If students are not speaking, call on them.
  - If the vote in Round 1 is split, you can have a run-off or just note the result.

  This package should give you a runnable activity that brings the nonidentity problem to life.
answer: |-
  Below is a complete, runnable package for your 90-minute seminar session. The design centers on a role-play activity that forces students to **confront the nonidentity problem experientially** before labeling it, using a deliberative committee format with layered stakes. It addresses your core goals: making the problem "bite," contrasting identity-affecting vs. identity-preserving harms, and preventing abstraction or utilitarian headcounts. I've incorporated your wrinkle (better-off-under-depletion characters), added stakes via an "epilogue report," and built in safeguards against anticipated issues.

  ---

  ### **Activity Overview: The Veridian Islands Dilemma**
  **Setting:** A fictional island republic must choose between two policies for its rare mineral, "Veridium":
  - **Policy C (Conservation):** Slow, sustainable extraction. Stable economy, modest prosperity for generations.
  - **Policy D (Depletion):** Rapid extraction for a 30-year boom, then permanent economic decline. Alters migration, jobs, and social patterns, changing which people exist 100 years later. All future lives remain "worth living" (decent but diminished under D).

  **Mechanism:** Students role-play a **Future Generations Committee** advising the government. Each receives a role card for a *specific future person* (living 100 years ahead). After debating C vs. D, they reconvene for a second round on an identity-*preserving* harm (Policy H).

  ---

  ### **Materials & Preparation** (15 mins prep before class)
  1. **Role Cards (14 total, one per student):**  
     - **Distribution:**  
       - 5x **"Conservation-Only" Characters:** Exist *only* under Policy C. Prosperous lives (e.g., doctor, farmer).  
       - 5x **"Depletion-Only" Characters:** Exist *only* under Policy D. Tougher lives but still decent (e.g., boomtown laborer, recycler).  
       - 2x **"Harmed in Both" Characters:** Exist under *both* policies but worse off under D (e.g., lose family wealth in the bust).  
       - 2x **"Better-Off Under Depletion" Characters:** Exist under *both* policies but *gain* from D (e.g., family profits from boom-era speculation).  
     - **Card Template:**  
       ```
       [CHARACTER NAME]  
       Your Life Under Policy C (Conservation): [1-2 sentences: status, key relationships, quality]  
       Your Life Under Policy D (Depletion): [1-2 sentences]  
       SECRET: Only you know if you exist in one/both policies.  
       YOUR STAKE: [E.g., "Under Policy D, your child dies in a boomtown accident."]  
       ```  
     *(See **APPENDIX** for example cards.)*  

  2. **Common Knowledge Handout (1 per student):**  
     - Describes Policies C & D, the committee’s task, and **rules:**  
       *"You are advocates for your specific future person. Argue based on THEIR interests, not abstract ethics. Existence under alternative policies is NOT public knowledge."*  
     - Includes island context (resource-dependent society, 100-year timeframe).  

  3. **Policy H Brief (For Round 2):**  
     - *"Policy H: Identical to Conservation but with a one-time resource grab by current elites. Same people exist in 100 years, but all are poorer (e.g., -20% resources). No identity shifts."*  

  4. **Stakes Mechanism:**  
     - **"Epilogue Report":** Post-activity, you’ll publish a short narrative stating which future characters "survived" (existed in the chosen policy) and how their descendants fared. Students who role-played characters that existed in the chosen policy get a symbolic reward (e.g., a "Veridian Legacy Token" = printed card; token-holders featured prominently in epilogue).  

  ---

  ### **Timeline: 90-Minute Session**  
  #### **Phase 1: Setup (10 mins)**  
  - **0-5 mins:** Frame the activity.  
    *"You’re the Future Generations Committee of Veridia. Today, you’ll embody specific people living 100 years from now. Your task: Recommend Policy C or D to Parliament. Remember—you speak for your assigned person, not yourselves."*  
  - **5-10 mins:** Distribute role cards + common-knowledge handout. Students read cards silently. **Emphasize:** *"Your existence under C or D is YOUR secret. Argue from your character’s self-interest."*  

  #### **Phase 2: Round 1 – Depletion vs. Conservation (35 mins)**  
  - **10-25 mins:** **Open Deliberation.**  
    - Students argue as their characters. Facilitator moderates:  
      - *Interrupt abstraction:* "What does YOUR character lose/gain here?"  
      - *Highlight secrecy:* "Remember, you don’t know who exists in which future."  
    - **Key tensions to emerge organically:**  
      - Conservation-only: *"Without Policy C, I don’t exist!"*  
      - Better-off under D: *"Depletion made my family rich!"*  
      - Harmed in both: *"D robs my future—same me, worse life!"*  
  - **25-30 mins:** **Private Vote (Written Ballot).**  
    - Students vote C or D based on character’s interest. Collect votes.  
  - **30-35 mins:** **Vote Result + Transition.**  
    - Announce policy "passed" (real result doesn’t matter—stakes come later).  
    *"Parliament will review your recommendation. Now, a new crisis: Policy H."*  

  #### **Phase 3: Round 2 – Policy H (Identity-Preserving Harm) (20 mins)**  
  - **35-40 mins:** Distribute Policy H brief. *"Same people exist under C or H, but H harms all. Deliberate again."*  
  - **40-55 mins:** **Deliberation on Policy H.**  
    - Students stay in character but now face identity-preserving harm.  
    - **Contrast to surface:** In Round 1, "harmed" students struggled to prove victims. In Round 2, harm is obvious: *"We’d ALL be poorer under H!"*  
  - **55-60 mins:** **Vote on Policy H.**  

  #### **Phase 4: Debrief & Philosophy Mapping (25 mins)**  
  **Guided Discussion (Anchor in student experiences):**  
  - **Q1:** *"In Round 1, who FELT harmed by Policy D? How did you convince others?"*  
    - → Surface **person-affecting intuition**: Harm requires a victim worse off *than they would otherwise be*.  
    - **Map:** Harmed-in-both characters could articulate clear victimhood; others couldn’t.  

  - **Q2:** *"Did Policy D have ‘victims’? Why was this hard to agree on?"*  
    - → Introduce **nonidentity problem**: Depletion-born only exist *because* of D—no one is worse off (counterfactual account).  
    - **Map:** Conservation-only characters "disappear" under D—no victim to complain.  

  - **Q3:** *"How did the ‘better-off under depletion’ characters complicate things?"*  
    - → **Challenge simplistic harm narratives**: Even with aggregate harm, some gain.  
    - **Map:** Their existence in both policies shows harm isn’t inevitable under D.  

  - **Q4:** *"Contrast Round 1 and 2. Why was Policy H easier/harder to judge?"*  
    - → **Identity-affecting (D) vs. identity-preserving (H) harm**: H creates clear, comparable victims.  
    - **Map:** In Round 1, objections collapsed without identifiable victims; Round 2 had unanimous harm.  

  - **Q5:** *"How might this apply to real-world dilemmas like reproductive choices?"*  
    - → Connect to your friend’s case: Choosing *not* to conceive avoids a "harm" but denies existence—ethical weight shifts when facing the decision.  

  **Finally:** Reveal "Epilogue Report" mechanism. Tokens awarded next session.  

  ---

  ### **Mitigating Failure Modes**  
  1. **Students abandoning roles to philosophize:**  
     - **Prevention:** Stakes (epilogue rewards) + rules ("argue your character’s interest, not ethics") + facilitator interruptions.  
     - **Redirection:** *"Interesting point—but how would YOUR CHARACTER see this?"*  

  2. **Utilitarian headcount of role cards:**  
     - **Prevention:** Role cards’ existence is SECRET (students don’t know distribution). Better-off/harmed-in-both characters complicate tallying.  
     - **Redirection:** *"Is ‘more people’ better if some vanish? What if winners outweigh losers?"* → Leads to Parfit’s "Repugnant Conclusion."  

  3. **Temporality problem (existence not truly contingent):**  
     - **Acknowledge openly in debrief:** *"We know your existence isn’t *really* at stake. But this mimics how future people can’t consent. The bite is in the moral asymmetry—we decide for nonexistent others."*  

  ---

  ### **What the Activity Can’t Fully Capture**  
  - **Temporal Disconnect:** Students know they’ll exist regardless. This blunts the existential weight of "being unmade" (vs. your friend’s real dilemma).  
    - *Mitigation:* The epilogue report makes consequences tangible ("your character won’t be in the story").  
  - **Emotional Distance:** Role-play can feel artificial. Students may not internalize the stakes like your friend.  
    - *Mitigation:* Secret stakes (e.g., "If your character ceases to exist, you lose token eligibility") raise investment.  
  - **Oversimplification:** Real policies affect populations, not 14 individuals. The activity compresses complexity.  
    - *Mitigation:* In debrief, note: *"We distilled the problem—in reality, scale deepens the challenge."*  

  ---

  ### **APPENDIX: Example Role Cards**  
  **Conservation-Only (e.g., 5/14)**  
  > **Dr. Amara Singh**  
  > - *Policy C:* You run a hospital in Greenhaven. Life is busy but fulfilling. Your children inherit a stable home.  
  > - *Policy D:* You don’t exist. The depletion boom drew medical workers to slums; your parents never met.  
  > - **SECRET:** Only exist under C.  
  > **STAKE:** Under C, you save thousands; under D, you vanish.  

  **Depletion-Only (e.g., 5/14)**  
  > **Kaito "Boomtown" Chen**  
  > - *Policy C:* You don’t exist. Your parents stayed in their fishing village.  
  > - *Policy D:* You build pipelines during the boom. Post-bust, you recycle scrap. Life is hard but proud.  
  > - **SECRET:** Only exist under D.  
  > **STAKE:** Under D, you exist; under C, you don’t.  

  **Harmed in Both (e.g., 2/14)**  
  > **Elena Rostova**  
  > - *Policy C:* You inherit a vineyard. Life is comfortable; your art thrives.  
  > - *Policy D:* You exist, but the vineyard is sold in the bust. You work in a factory. Your son dies in a riot.  
  > - **SECRET:** Exist under both, worse under D.  
  > **STAKE:** Under D, you lose everything.  

  **Better-Off Under Depletion (e.g., 2/14)**  
  > **Silas Thorne**  
  > - *Policy C:* You teach school. Modest life; debts linger.  
  > - *Policy D:* Your family speculated on Veridium stocks. You’re wealthy; fund schools in the boomtown.  
  > - **SECRET:** Exist under both, better under D.  
  > **STAKE:** Under D, you’re a philanthropist; under C, you struggle.  

  ---

  ### **Why This Works**  
  - **Experiential "Bite":** By hiding existence status, students *feel* the frustration of arguing harm without victims.  
  - **Contrast Built-In:** Round 1 (nonidentity) vs. Round 2 (standard harm) highlights the problem’s uniqueness.  
  - **Stakes Without Money:** The "epilogue report" + tokens make consequences tangible but low-stakes.  
  - **Your Personal Connection:** Weave in your friend’s story during debrief to bridge theory/praxis: *"Like Silas, some gain; like Elena, some lose comparably. But the child who might exist? That’s the nonidentity trap."*  

  This package should transform the nonidentity problem from a "debating-game" into a lived ethical tension. Let me know if you’d like adjusted role cards or refinements!
