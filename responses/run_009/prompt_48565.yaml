answer: |-
  Sarah runs a bakery hemorrhaging money. Simultaneously, she *believes* "This business is doomed" (not-p) – she meticulously tracks losses, sees competitors thriving, and feels a knot of dread. Yet, she also actively *believes* "I can turn this around" (p) – she invests her savings in a risky renovation, tells friends it's just a rough patch, and works 16-hour days fueled by this conviction. She needs belief in recovery (p) to sustain the exhausting, costly action required to *try* saving it. Simultaneously, she needs the belief in doom (not-p) to psychologically shield herself from the potential shame and terror of total failure; if it collapses, she can say "I knew it all along, I was prepared." This deflates standard accounts: It's not *just* wishful thinking (she holds the negative belief too). It's not *just* biased evidence gathering (she forces herself to review devastating spreadsheets). It's not *just* self-serving interpretation (the losses are unambiguous; she sees them *as* losses *and* persists regardless). 

  On reflection, this concrete scenario makes genuine, simultaneous contradictory belief self-deception look genuinely possible.
