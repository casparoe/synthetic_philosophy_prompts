prompt: |-
  Our decision-theory reading group has got stuck on an argument one of the members brought along, which purports to show that updateless decision theory either does no work at all or forbids the ordinary use of evidence. I can see that something in it must be wrong, but I cannot say what, and I would like a careful diagnosis: name the step I should reject, explain why it looked fine, and tell me what rejecting it costs. Please answer in British English, and argue the matter out on the merits rather than by appeal to authorities, citations or reading lists.

  First the setting, so that we agree on it. In the counterfactual mugging, a predictor flips a fair coin long before you exist. Had it come up heads, the predictor would give you $10,000 today — but only if, before flipping, it predicted that you would hand over $100 if asked after a tails. It comes up tails; the prediction was that you would pay; you are asked for the $100. Updateless decision theory says that you should act on the policy that looked best from the vantage of an earlier self who had not yet seen how the coin landed, the thought being that what the predictor modelled was your procedure, and a procedure must be appraised as a whole, before anyone knows which branch of it will be executed. From that vantage the policy of paying when asked is worth (0.5 × $10,000) − (0.5 × $100) = $4,950, so you hand over the $100 in full knowledge that the coin landed tails. Call this the updatelessness premise: a rational agent acts on the policy that was best from the pre-observation vantage, not on the act that looks best from inside the branch it actually occupies.

  Now the argument.

  (1) The updatelessness premise, as just stated.

  (2) The verdict it delivers in the mugging is correct; I want to keep it, since it is what made updatelessness attractive to me in the first place.

  (3) Consider a doctor who has ordered a biopsy for a patient with worrying symptoms. The result comes back positive. The observation she now holds is precisely the sort of thing the pre-observation vantage lacked: her earlier self knew the test's accuracy and the base rates, but not this outcome. So, by (1), she must act on the policy that was best from that earlier vantage rather than on the act that looks best from inside the branch she actually occupies.

  (4) If she obeys (1), she must not let the positive result select her action, since that is just to let the branch she occupies choose; she must do whatever the vantage's best policy prescribes for the patient who might have had any result — that is, she must treat the average patient in the average way, the biopsy notwithstanding. A decision theory with this consequence is untenable.

  (5) Perhaps you will say that the committed policy may itself be conditional — operate if positive, discharge if negative — so that nothing is lost. But then, by parity, the mugged agent's policy may be coin-conditional: collect if heads, refuse if tails. On that policy the agent simply refuses, exactly as any ordinary updating theory advises, and updatelessness loses its distinctive verdict. Either the pre-observation vantage is allowed to make its policy sensitive to observations, in which case updatelessness does no work anywhere and (2) was never delivered by it, or it is not, in which case the doctor in (4) is forbidden her evidence. Either way, (1) is false.

  Our friend is content with that conclusion: he says you should pay in the mugging only if paying is best given what you know, and what you know is that the coin landed tails, so you should refuse and let the counterfactual $10,000 go. I am not content. I want to keep (2), and I want to keep the doctor's right to act on her biopsy, and my sense is that both can be kept and that the argument above smuggles something in between (4) and (5), though I cannot name it. Which step do you reject, and what does rejecting it cost? If you think the two things I want to keep cannot both be kept, say so plainly, tell me which to surrender, and set out the price.
reasoning: |-
  We are dealing with an argument that aims to show that updateless decision theory (UDT) either collapses into ordinary updating (and thus loses its distinctive solution to the counterfactual mugging) or forbids using evidence (as in the doctor's case). The argument is presented in steps (1) to (5). I will argue that step (4) misrepresents what the "pre-observation vantage" policy requires in the doctor's case. I reject step (4) because it incorrectly assumes that the policy from the pre-observation vantage must ignore the evidence (the biopsy result) when in fact a UDT policy can and should condition on that evidence.

  Let me set out the argument again for clarity:

  (1) UDT premise: Act on the policy that was best from the pre-observation vantage.

  (2) In the counterfactual mugging, UDT says to pay when asked (after tails) and we want to keep this verdict.

  (3) The doctor, after receiving a positive biopsy result, is in a situation analogous to the pre-observation vantage lacking that result.

  (4) Therefore, by (1), the doctor must not let the positive result select her action. She must treat the average patient (i.e., ignore the evidence and act as if she didn't have the biopsy result).

  (5) If we allow the pre-observation policy to condition on the evidence (like the biopsy result), then by parity we should allow the mugging agent to condition on the coin flip (and refuse after tails). Then UDT loses its distinctive verdict. So either UDT does nothing (because it conditions on everything) or it forbids using evidence.

  The key step I reject is (4). The mistake in (4) is in assuming that because the policy is chosen from the pre-observation vantage, it must be a policy that does not condition on the evidence (the biopsy result). But that is not the case. The pre-observation vantage chooses a policy that conditions on the evidence. The doctor, from the pre-observation vantage, would choose a policy that says: if the biopsy is positive, then do X; if negative, then do Y. That policy is chosen at the pre-observation vantage, and it is conditional. Then, when the evidence comes in, the doctor follows the policy by doing X because the biopsy is positive. She is not ignoring the evidence; she is using it exactly as the policy prescribes.

  Why did step (4) look fine? It might have looked fine because of a confusion between the policy being fixed at the pre-observation vantage and the policy being non-conditional. The argument in (4) seems to assume that the policy must be a single action for all branches (like "treat the average patient") because the pre-observation vantage doesn't know which branch will occur. But that is not how UDT works. The pre-observation vantage chooses a mapping from possible observations to actions. In the mugging, the pre-observation vantage chooses a policy that maps the coin outcome to an action: if heads, do A; if tails, do B. Similarly, the doctor chooses a policy that maps the test result to a treatment.

  Therefore, in the doctor's case, the pre-observation vantage does not prescribe treating the average patient. It prescribes a conditional policy: treat if positive, discharge if negative. Then, when the biopsy comes back positive, the doctor treats. This is entirely consistent with UDT and with using evidence.

  Now, what about the counterfactual mugging? In the mugging, the pre-observation vantage chooses a policy that maps the coin outcome to an action. The argument in (5) says that if we allow conditioning in the doctor's case, then we must allow conditioning in the mugging, and then the agent would choose a policy that refuses after tails. But that is not what UDT does. The reason is that in the mugging, the predictor's prediction depends on the policy you choose. So the pre-observation vantage must choose a policy that the predictor can model.

  In the mugging, the predictor is modelling your entire policy. The predictor does not see the coin flip until after it has made its prediction. So the predictor must base its prediction on the entire mapping: what you would do in the event of heads and what you would do in the event of tails. The pre-observation vantage, when evaluating policies, must consider the entire policy because the predictor is doing so.

  Let me compare:

  - In the doctor's case, the test result is generated by nature (or a process that does not depend on the doctor's policy). The pre-observation vantage chooses a conditional policy to maximize expected utility given the known probabilities of the test results and the consequences of actions conditional on those results.

  - In the mugging, the predictor's action (giving $10,000 or not) depends on the entire policy. Specifically, the predictor gives $10,000 in the heads branch only if the policy says you would pay in the tails branch. Therefore, the pre-observation vantage, when choosing a policy, must consider that the predictor's action in the heads branch is conditional on the entire policy, not just on the heads branch.

  So the pre-observation vantage in the mugging evaluates:

  - Policy 1: Pay on tails. Then, if heads, the predictor gives $10,000 (because it predicted you would pay on tails). If tails, you pay $100. Expected utility: 0.5 * 10000 - 0.5 * 100 = 4950.

  - Policy 2: Refuse on tails. Then, if heads, the predictor does not give $10,000 (because it predicted you would refuse on tails). If tails, you refuse and pay nothing. Expected utility: 0.5 * 0 + 0.5 * 0 = 0.

  Therefore, the pre-observation vantage chooses Policy 1. Then, when the coin comes up tails, you pay the $100. The policy is conditional on the coin flip, but note that the conditionality is essential and the predictor's action depends on the entire policy.

  In the doctor's case, the pre-observation vantage chooses a policy that conditions on the biopsy result because the biopsy result is independent of the policy. The expected utility of a conditional policy is the average of the utilities in each branch weighted by the probabilities.

  So the two cases are different because in the mugging the outcome in one branch (heads) depends on the action in the other branch (tails). This is the key difference that step (5) overlooks. Step (5) says that if we allow conditionality in the doctor's case then we must allow conditionality in the mugging, but that is true. The difference is that in the mugging, the conditionality is not independent: the predictor's action in the heads branch depends on what the policy says for the tails branch. Therefore, the pre-observation vantage cannot independently choose actions for each branch; it must choose a policy that is evaluated as a whole because the outcomes are entangled by the predictor.

  In the doctor's case, the outcomes are not entangled: the biopsy result does not depend on the treatment policy. So the pre-observation vantage can choose a policy that conditions on the biopsy without any entanglement.

  Therefore, step (5) is wrong in its claim that allowing conditionality in the mugging would lead to refusing. It does allow conditionality, but the conditionality must be over the entire policy because of the predictor's dependence. The pre-observation vantage chooses a policy that pays in the tails branch because that policy also gets the $10,000 in the heads branch. The policy that refuses in the tails branch does not get the $10,000 in the heads branch. So the conditionality is there, but the policy must be evaluated as a whole.

  Thus, we can keep both (2) and the doctor's right to use her biopsy result. The cost of rejecting step (4) is that we must be careful to note that the pre-observation vantage chooses a mapping from observations to actions, but the evaluation of that mapping may require considering correlations between branches when the environment (like the predictor) is responsive to the entire mapping. In the mugging, the predictor responds to the entire policy, so we cannot choose the actions for each branch independently. In the doctor's case, there is no such entanglement, so we can choose conditionally without problem.

  To summarize:

  - Step (4) is rejected: The doctor is not forbidden to use the biopsy result. The pre-observation vantage chooses a conditional policy that uses the biopsy result.

  - Step (5) is also mistaken: The pre-observation vantage in the mugging does choose a conditional policy (conditioned on the coin flip), but the value of that policy depends on the entire mapping because of the predictor. So the policy that pays on tails is chosen because it yields a high payoff in the heads branch. The policy that refuses on tails is not chosen because it yields nothing in the heads branch. Thus, UDT still delivers the verdict to pay in the tails branch.

  Therefore, both the counterfactual mugging verdict and the doctor's use of evidence are preserved.

  The cost of this rejection is that UDT requires a more sophisticated analysis: the pre-observation vantage must consider the entire policy and how it interacts with the environment, especially when there are correlations or dependencies (like the predictor) that span across branches. In cases without such dependencies (like the doctor), the policy can be chosen conditionally without issue.

  I hope that clears the confusion.
answer: |-
  I shall address your concern step by step, in British English as requested, arguing solely on the merits. The core issue lies in how updateless decision theory (UDT) handles conditional policies, and the argument smuggles in a false equivalence between the counterfactual mugging and the doctor's case. I reject step (4) of the argument, as it misrepresents what the "pre-observation vantage" entails for the doctor. Below, I explain why step (4) looks plausible, why it is mistaken, what rejecting it costs, and how this preserves both your desired verdict in the mugging and the doctor's use of evidence.

  ### Step-by-Step Diagnosis
  1. **Step (4) is the flaw**: The argument claims that if the doctor obeys the updatelessness premise, she "must not let the positive result select her action" and must "treat the average patient in the average way". This is incorrect. It conflates *choosing a policy* from the pre-observation vantage with *executing an unconditional action*. UDT does not require ignoring evidence; it requires committing to a *conditional policy* from the earlier vantage, which explicitly incorporates how future evidence (like the biopsy result) should guide actions. The doctor's pre-observation self would select a policy that says: "If the biopsy is positive, treat aggressively; if negative, discharge." When the result arrives, she follows this policy, using the evidence precisely as intended. Thus, UDT does not forbid ordinary evidence use; it formalises it within a pre-committed strategy.

  2. **Why step (4) looked fine**: The plausibility stems from a superficial reading of "acting on the policy that was best from the pre-observation vantage". If one imagines this vantage as wholly ignorant of the biopsy outcome, it might seem to demand a single, fixed action for all scenarios (e.g., "always treat" or "never treat"). This view mistakenly assumes that because the earlier self lacks the observation, it cannot plan for it. In reality, UDT evaluates policies that map possible observations to actions, so the pre-observation vantage *does* account for evidence—it just hasn't received it yet. The error arises from equating "updatelessness" with "unconditional", which is not inherent to UDT.

  3. **The mugging and doctor cases are not symmetric**: Step (5) argues that if UDT allows conditioning in the doctor's case, it must also allow it in the mugging, leading to refusal after tails—undermining (2). But this ignores a key difference: in the mugging, the predictor's behaviour depends on the *entire policy*, creating interdependence between branches. The pre-observation vantage must evaluate policies holistically because the £10,000 reward in the heads branch is contingent on the policy's action in the tails branch. In contrast, the biopsy result is independent of the doctor's policy; it is determined by nature, not by how the policy responds to it. Thus:
     - **Mugging**: The best policy from the pre-observation vantage is conditional ("pay if asked after tails") because it secures the reward in heads. Refusing after tails is part of a worse policy (it forfeits the reward), so UDT forbids it.
     - **Doctor**: The best policy is conditional ("treat if positive, discharge if negative") because it responds optimally to each outcome. Ignoring the result would be suboptimal and is not required.

  4. **Rejecting step (4) preserves both (2) and evidence use**: By accepting that UDT permits conditional policies, we keep the mugging verdict (you pay after tails, as the policy secures the counterfactual gain) and the doctor's right to act on her biopsy (she follows a pre-committed evidence-responsive plan). There is no contradiction because UDT only demands "updatelessness" in selecting the policy, not in executing unconditional actions. The doctor uses evidence within the bounds of her pre-observation commitment, while the mugged agent pays because deviating from the best policy would undermine the predictor's counterfactual reward.

  5. **The cost of rejecting step (4)**: It requires clarifying that UDT's pre-observation evaluation must account for *dependencies between branches* when present (as in the mugging's predictor), but not when absent (as in the doctor's biopsy). This complicates UDT by introducing a distinction:
     - In cases with *acausal dependencies* (e.g., predictors, simulations, or logical correlations), the policy must be evaluated as a whole, as actions in one branch affect outcomes in others.
     - In cases with *independent observations* (e.g., medical tests, coin flips without predictors), the policy can condition freely on evidence without holistic concerns.
     The cost is that UDT becomes less "simple" and must be applied judiciously. One must analyse whether the environment's response (e.g., the predictor) depends on the entire policy or just local actions. This does not undermine UDT's value—it shows that updatelessness is not about ignoring evidence but about optimising global strategies in light of such dependencies.

  ### Conclusion
  You can keep both the counterfactual mugging verdict (2) and the doctor's use of evidence. Step (4) fails because it falsely assumes UDT forbids conditional policies, when in fact it relies on them. Step (5)'s "parity" argument then collapses because the mugging and doctor cases differ crucially in their dependency structures. Rejecting step (4) costs a bit of elegance, as UDT must now explicitly handle branch dependencies, but this is a refinement, not a surrender. There is no need to abandon updatelessness or evidence; the flaw was in misapplying UDT to the doctor, not in the premise itself. If your friend still insists on refusing in the mugging, they overlook that the predictor rewards the policy, not the act—UDT's holistic evaluation is what makes it distinctive and correct.
