  - Experiences (qualia): These should be like aux sends—parallel outputs from the main path, but non-destructive (e.g., post-fader sends). They're derived from the signal but don't feed back.  
  - Verbal reports: Main outputs (like L/R mix) caused by the main path.  
  The paradox: How do reports accurately describe experiences if they're both from the same source but experiences don't cause reports? In desk terms, it's like two meters showing the same level because they share a source, not because one controls the other.  

  Residue report—what fits:  
  - Aux send as experience: Clean fit. Send mirrors the signal passively, no return path.  
  - Shared bus/source: Explains correlation without causation.  
