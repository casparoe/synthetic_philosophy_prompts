prompt: |-
  For my graduate seminar on rational choice theory, I've found that students arrive at the bounded rationality unit with two misconceptions in equal measure: that satisficing is just a polite word for settling, and that Herbert Simon was somehow anti-rationality, a man telling us to lower our standards. Both readings survive the assigned papers untouched, because the papers are careful and the misconceptions are lazy. So this year I want to fight fire with fire and open the unit with a piece of satire that could only have been written by someone who actually understands the view.

  The assignment I'd like you to complete: write a corporate decision-making policy document, in deadpan HR-legal register, for a fictional company that has made bounded rationality official policy. Numbered clauses, maybe 600–700 words. The humor has to come from getting the theory right rather than from mocking it as complacency. So, for instance: a clause mandating that search terminate at the first option that clears the employee's aspiration level, with a defined procedure for adjusting that level downward under deadline pressure and upward after a run of successes, per Simon's own suggestion that aspiration levels ratchet with experience; a clause prohibiting requests for "the best available option" on the grounds that no employee can survey all alternatives, and routing such requests to an "Omniscience Desk" that has never once responded; a grievance procedure distinguishing regret that one's procedure was sloppy from regret that one didn't attain the global optimum, only the first of which the company will entertain; an inventory of approved heuristics with instructions for when relying on the recognition heuristic is ecologically rational and when it is just being lazy; and perhaps an escalation-of-commitment clause framed as the pathological cousin the policy exists to prevent. The document should read as though procedural rationality — rationality given the constraints of limited knowledge and computational capacity, as opposed to substantive rationality — were simply the law of the office.

  The quality bar: a behavioral decision theorist should laugh rather than wince, and the satire should be fair — it may exaggerate a feature of the satisficing view (the aspiration-level machinery, the stopping rules, the suspicion of maximization), but it may not invent one. Somewhere in the piece, ideally without ever stating it, the reader should feel the real question Simon left us: whether bounded rationality is a regrettable description of the cognitive hand we've been dealt or something closer to a prescription — whether the omniscient optimizer the company keeps routing mail to is a coherent ideal or a confusion. I'd also accept one or two jokes at the expense of the heuristics-and-biases tradition, provided the document's own house is in order. Begin your response with the document itself, with no preface or commentary.
reasoning: |-
  We are writing a corporate policy document in a deadpan HR-legal style. The company has officially adopted bounded rationality as its decision-making framework. The document should be structured with numbered clauses and should be 600-700 words. The humor comes from taking the theory seriously and implementing it literally in a corporate setting.

   Key elements to include:
   1. A clause on terminating search at the first option that meets the aspiration level, with procedures for adjusting the aspiration level (down under deadline pressure, up after successes).
   2. A clause prohibiting requests for "the best available option" and routing such requests to an "Omniscience Desk" that never responds.
   3. A grievance procedure that distinguishes regret about sloppy procedure from regret about not attaining the global optimum (only the first is entertained).
   4. An inventory of approved heuristics with instructions on when to use them (e.g., recognition heuristic) and when it's lazy.
   5. An escalation-of-commitment clause as the pathological behavior the policy prevents.

   The document should reflect procedural rationality (rationality within constraints) as the office law.

   We must not invent features of bounded rationality but may exaggerate existing ones. The satire must be fair and accurate.

   Additionally, we want to subtly raise Simon's question: whether bounded rationality is a description of our cognitive limits or a prescription (and whether the omniscient optimizer is coherent or a confusion).

   We can include a joke or two at the expense of the heuristics-and-biases tradition, but the main focus is on bounded rationality.

   Let's structure the document:

   I. Preamble (stating the policy's adoption)
   II. Definitions (if needed)
   III. Core policies (search termination, aspiration level adjustment, prohibition on "best available", etc.)
   IV. Approved heuristics and their conditions
   V. Grievance procedure
   VI. Prohibited behaviors (escalation of commitment, etc.)
   VII. Enforcement

   We write in a formal, corporate legalistic tone, but with the content of bounded rationality.

   Let's begin.
answer: |-
  **POLICY 7.09: BOUNDED RATIONALITY IN DECISION-MAKING PROCEDURES**  
  **EFFECTIVE DATE:** [CURRENT DATE]  
  **REVISION:** 3.0  
  **AUTHORIZED BY:** OFFICE OF PROCEDURAL OVERSIGHT (OPO)  

  **1. PURPOSE**  
  This policy institutionalizes Herbert Simon’s principles of bounded rationality as the standard framework for all Company decisions. It acknowledges that human cognition operates under constraints of finite time, information, and computational resources. Pursuit of substantively "optimal" outcomes (defined as global maxima) is hereby classified as procedurally noncompliant. Rationality is redefined as adherence to ecologically valid heuristic processes under subsection 2.4.  

  **2. DECISION-MAKING PROTOCOLS**  
  **2.1 Satisficing as Termination Condition**  
  Upon identification of an option meeting or exceeding the employee’s predefined aspiration level (see 2.2), search must terminate immediately. Continued evaluation of alternatives post-satisfaction constitutes "Maximizer Behavior" (a Category-2 Violation). Example: Vendor selection ends upon finding one fulfilling ≥80% of RFP criteria.  

  **2.2 Aspiration-Level Adjustment**  
  **2.2.1** Baseline aspiration levels are set quarterly via OPO Form 7.09a, accounting for role-specific historical data.  
  **2.2.2** Under certified time constraints (OPO Form 7.09b), aspiration levels must be reduced by 15% per elapsed business hour until satisfaction occurs.  
  **2.2.3** Following three (3) consecutive satisficing outcomes within a domain, aspiration levels ratchet upward by 10% (per Simon’s Adaptive Feedback Principle).  

  **3. PROHIBITION OF MAXIMIZATION LANGUAGE**  
  **3.1** Phrases including "best available," "optimal," or "maximize [metric]" are strictly prohibited in briefs, emails, or Slack channels.  
  **3.2** Violations trigger automatic rerouting to the *Omniscience Desk (OD-47)* via Ticket #OPTIMAL-REQ.  
  **3.3** OD-47 retains authority to resolve such requests contingent upon demonstration of infinite computational capacity and complete information access. No responses have been recorded since Q2 1987.  

  **4. APPROVED HEURISTICS INVENTORY**  
  Employees must select from OPO-sanctioned heuristics (Appendix A). Deviations require pre-approval (OPO Form 7.09c). Examples:  
  **4.1 Recognition Heuristic**  
  Permitted only when:  
  - (a) Ecological validity exceeds 0.8 per OPO’s Industry Recognition Index;  
  - (b) Employee possesses domain-specific expertise (certified via OPO Test Γ-7).  
  *Prohibited* if used for unfamiliar domains (e.g., selecting a Kyrgyzstani legal consultant because the name "sounds familiar").  

  **4.2 Take-the-Best Heuristic**  
  Requires documented validation that cue hierarchies align with environmental statistical structure (per Gigerenzer’s Ecological Rationality Standards).  

  **5. GRIEVANCE PROCEDURE: POST-DECISIONAL REGRET**  
  **5.1** Regret submissions (OPO Form 7.09d) must specify category:  
  - **Type-A Regret:** Procedural failure (e.g., aspiration level mis-calibration, noncompliant search termination).  
  - **Type-B Regret:** Failure to achieve unattainable global optimum.  
  **5.2** Type-B grievances are dismissed without review. OPO’s response template: "The requested outcome presumes omniscience, violating Policy 7.09 §3."  
  **5.3** Type-A grievances undergo audit. Penalties apply for ≥3 upheld claims/quarter.  

  **6. PATHOLOGICAL BEHAVIOR PREVENTION**  
  **6.1 Escalation of Commitment**  
  Defined as: Persisting with a failing course of action due to sunk costs. All employees must complete Module Δ-3: "The Sunk Cost Fallacy as Simon’s Antithesis."  
  **6.2** Budget reallocations exceeding 10% of initial investment require OPO pre-certification proving:  
  - (a) New information justifies revised aspiration levels;  
  - (b) No alternatives satisfy current aspiration levels.  

  **7. TRAINING AND COMPLIANCE**  
  **7.1** Annual recertification on "Simon’s Scissors" (cognitive constraints + environmental structure) is mandatory.  
  **7.2** OPO auditors will randomly inspect decisions for:  
  - Aspiration-level adherence (§2),  
  - Heuristic validity (§4),  
  - Maximization language (§3).  
  **7.3** Violations incur progressive discipline, up to mandatory re-education via *"Biases & Heuristics: A Cautionary Tale"* seminar (not to be confused with endorsement of the heuristics-and-biases tradition’s deficit model).  

  **APPENDIX A: SANCTIONED HEURISTICS**  
  *(Partial List; Full Index at OPO Portal)*  
  - **Recognition Heuristic:** Use case §4.1.  
  - **Take-the-Best:** Binary cue-based selection.  
  - **1/N Rule:** Resource allocation only when evidence granularity < 0.3.  
  - **Default Heuristic:** Permitted if default survival rate > 70% in OPO database.  

  ---  
  **REVISION NOTES:**  
  Policy 7.09 supersedes all prior "optimization" directives. The Omniscience Desk relocation to Floor 47 (formerly "Maximization Wing") is complete.
