prompt: |-
  my phil of science reading group is doing substantivalism vs relationism next week and I want to open the session with a poem (I know, bear with me). I'd like a sonnet on Newton's bucket, but with a specific structure:

  the octave should be the bucket itself. bucket starts turning relative to still water — surface flat, nothing interesting yet (the wall just slides past the water). then viscosity drags the water up to speed, and the volta should land on the exact moment the water matches the bucket's spin: now there is no relative motion left at all, and thats precisely when the surface starts to curve and climb the walls. that's the whole trick of the argument and I want the turn of the poem to be that moment — the effect shows up exactly when the difference it was supposed to be relative to disappears.

  the sestet then shifts to the other thought experiment from the same scholium, the two globes connected by a cord revolving in an otherwise empty universe — Newton's way of taking away the relationist's usual escape hatch of "rotation relative to the distant stars," since there's nothing out there. the closing couplet should turn on the tension in the cord: the only other object in that universe, and the only witness to the rotation, which is now relative to nothing you can point to or name.

  so the form should do some actual work: octave = first experiment, volta = the philosophical escalation to the stripped-down version, couplet = the punchline that this is motion with respect to nothing visible. and pls make it accurate enough that our resident Newton person doesn't wince, while still reading as a decent poem for someone who has no idea what the bucket argument even is. extra credit if the rhyme scheme quietly mirrors the two positions somehow, but don't force it
