prompt: |-
  I'm on the committee of a medium-sized student society, and for years our officer elections have been run by simple first-past-the-post. After a particularly galling result this spring, we're reviewing the rules, and I've been trying to work out what I actually believe a good electoral method owes us. Rather than argue from labels, I've taken a friend's advice and collected my gut reactions to concrete scenarios. Here they are. In one, nine voters rank three candidates: four put A first (A over B over C), three put C first (C over B over A), and two put B first (B over A over C). First-past-the-post elects A with four votes, yet B beats A head-to-head by five to four and beats C by six to three. My gut says B should win, full stop; a method that hands it to A is defective. In another, 100 voters choose among a moderate M (40 votes), a more radical R (31), and a second moderate M' (29), whose supporters would all have gone to M had M' not stood. R wins under first-past-the-post even though sixty-nine of a hundred voters prefer M to R. That seems obviously wrong to me: a candidate shouldn't win merely because her opponent acquired a near-identical rival, and more generally the contest between M and R shouldn't be disturbed by who else happens to be on the ballot. Then a cyclic case: three voters in a committee rank options X over Y over Z, Y over Z over X, and Z over X over Y, so that X beats Y, Y beats Z, and Z beats X, each by two to one. Whatever else, I feel the method owes us a coherent output — announcing that the committee prefers X to Y, Y to Z, and Z to X would be an embarrassment — though I half suspect the electorate, not the procedure, is at fault there. I also react badly to two pathologies I've read about: a candidate who would win under our ballots, but who would lose if some of her own supporters moved her from second place to first; and a bloc of voters whose favourite loses when they stay home but wins when they turn out and vote for her. Both feel unacceptable, the first more fiercely than the second. Two more verdicts seem trivially right: if two voters exchange their entire ballots, the outcome shouldn't change; and if every single voter ranks one candidate above another, the group's result can't reverse that.

  The trouble is that I can't see the principle behind this jumble, and I suspect some of the verdicts are quietly at war — the head-to-head one and the one about not disturbing contests seem hard to satisfy together, though I can't pin down why. So here is what I'd like. Tell me whether there is a single principle, or a short list of clauses, that delivers all of these verdicts; state it as precisely as you can, and say which of my scenarios motivates each clause. Then tell me what it implies for situations I haven't described — in particular, whether it pushes us towards a specific family of methods for the society's elections — and, crucially, be honest about which of my verdicts, if any, it cannot accommodate, and what it would cost me to give each one up. And finally, apply it to the case I keep relitigating: suppose the Condorcet winner in our election were a candidate whom not a single voter ranked first — everyone's tolerated second choice, nobody's enthusiasm — while a rival were the first choice of 46 per cent and the despair of the rest. Should the compromise really win, and does whatever principle you've extracted from my verdicts force that conclusion, or does it leave me room to waver?
reasoning: |-
  Okay, let me try to unpack this user's query. They're part of a student society committee reevaluating their election methods after a frustrating FPTP outcome. They've listed several scenarios where FPTP fails their intuitive sense of fairness, and they want a coherent principle tying these together. 

  First, I need to understand their core concerns. Their scenarios reveal several key values: head-to-head fairness (B should win over A despite fewer first-choices), resistance to vote-splitting (R shouldn't beat M due to M's clone), logical consistency (no cycles), and immunity to strategic pathologies. The last point about "no reversal when unanimous preference exists" seems foundational.

  Hmm... their examples align remarkably well with Condorcet criteria. But the cyclic case is tricky - they recognize the paradox but still demand a coherent outcome. That points toward Condorcet methods with a tiebreaker. Their rejection of "favorite betrayal" and "no-show" paradoxes suggests they'd tolerate some complexity for robustness.

  Wait, the compromise candidate dilemma is their real sticking point. They're torn between respecting head-to-head fairness and rewarding enthusiasm. This reveals an unstated value: legitimacy via broad acceptance versus passionate support. Their phrasing ("despair of the rest") hints they might privately favor the Condorcet winner but fear member backlash.

  The tension between their scenarios isn't accidental. The independence criterion (don't disturb M/R contest) conflicts with Condorcet in edge cases, but their examples avoid that conflict. For practical purposes, Condorcet methods satisfy all except possibly the compromise case. I should emphasize that no system is perfect, but Schulze or Ranked Pairs minimizes pathologies.

  On the 46% dilemma: their principles force them to back the compromise candidate, but they could add a majority-threshold rule if legitimacy is a concern. The cost? Sacrificing some independence from irrelevant alternatives. They'd need to decide if preventing "unloved winners" is worth that trade.
answer: |-
  Your scenarios reveal a remarkably coherent set of democratic principles. Here’s the distillation:

  ### The Core Principles
  1. **Pairwise Majority Principle (PMP):**  
     If a candidate beats every other candidate head-to-head, they must win.  
     *Motivated by:* Your first scenario (B beats A and C pairwise) and the "unanimous preference" verdict.

  2. **Independence of Clones (IoC):**  
     Introducing a near-identical "clone" candidate shouldn’t change the winner between non-clones.  
     *Motivated by:* The M/R/M' scenario (R wins only due to M’s vote-splitting).

  3. **Resolvability & Consistency:**  
     The method must always produce a single winner, avoiding cycles or ambiguities.  
     *Motivated by:* The cyclic committee case.

  4. **Monotonicity:**  
     A candidate shouldn’t lose *because* they gained support (no "favorite betrayal").  
     *Motivated by:* Your first pathology (moving a candidate up harms them).

  5. **No-Show Paradox Protection:**  
     Voters shouldn’t hurt their favorite by voting honestly.  
     *Motivated by:* Your second pathology (voters electing their favorite only by staying home).

  6. **Anonymity & Unanimity:**  
     Swapping ballots doesn’t change results; universal preference must be respected.  
     *Motivated by:* Your "trivial" verdicts.

  ---

  ### The Conflict (and Resolution)
  - **PMP vs. IoC:** These *can* conflict (e.g., in non-transitive electorates), but your scenarios avoid this.  
    - *Why it works:* Your cyclic example has no Condorcet winner (no one beats all others), so PMP doesn’t apply. IoC isn’t triggered either.  
    - **Resolution:** A method satisfying both PMP and IoC exists when a Condorcet winner exists. Your intuition rejects cycles but demands resolvability—so we prioritize PMP *when possible*, using a consistent tiebreaker otherwise.

  ---

  ### Implications for Election Methods
  Your principles point squarely to **Condorcet methods** (e.g., Ranked Pairs, Schulze):
  - **Satisfies:** PMP (by definition), Monotonicity (most variants), Resolvability (with tiebreakers), No-Show protection (Schulze does), Anonymity/Unanimity.
  - **Partially satisfies:** IoC (most Condorcet methods respect it if clones are defined rigorously).
  - **Avoids:** Vote-splitting pathologies (IoC compliance).

  **FPTP fails** PMP, IoC, Monotonicity, and No-Show protection.  
  **Instant-Runoff Voting (IRV)** fails PMP and Monotonicity (as in your first scenario).

  ---

  ### The Compromise Candidate Dilemma
  **Your scenario:**  
  - Condorcet winner (CW) is everyone’s second choice (0% first-preference).  
  - Rival (R) has 46% first-preference but loses to CW pairwise.

  #### What Your Principles Dictate:
  1. **PMP demands electing the CW.** They beat all others head-to-head, including R (say, 54% prefer CW to R).  
  2. **Monotonicity/No-Show support this:** Demoting CW on ballots could make them lose—but your principles forbid such pathologies.  
  3. **Legitimacy concern:** While no one *loves* CW, no one *rejects* them—unlike R, who is "despair of the rest." This is the essence of consensus.

  #### Costs of Rejecting This:
  - **Violating PMP:** If you elect R instead, you ignore the majority preferring CW over R.  
  - **Encouraging factionalism:** Candidates could win with <50% support despite being polarizing.  
  - **Sacrificing robustness:** Opens doors to strategic voting and spoiler effects.

  ---

  ### Which Verdicts Are at Risk?
  - **All are satisfied** *if* a Condorcet winner exists (true in all your non-cyclic examples).  
  - **In cycles:** Your principles slightly conflict:  
    - PMP can’t apply (no CW exists).  
    - Resolvability forces a tiebreaker (e.g., electing the candidate with fewest pairwise losses).  
    - This *might* violate IoC if a clone splits votes in a cycle, but cycles are rare in larger elections.

  ---

  ### Practical Recommendation
  Adopt the **Schulze method** or **Ranked Pairs** (both Condorcet-compliant):
  1. **Solves FPTP’s flaws** in your scenarios.  
  2. **Handles clones and spoilers** robustly.  
  3. **Preserves monotonicity** (unlike IRV).  
  4. **For the compromise candidate:** It forces the society to confront whether they value broad acceptability over passionate support—a healthy debate for any group.

  **Cost of principles:** Electing a "bland" compromise over an enthusiastic minority’s favorite. But your own verdicts (PMP, No-Show paradox rejection) make this inescapable. If this feels wrong, revisit whether PMP truly reflects your group’s values—but know that weakening it invites strategic voting and arbitrary outcomes.
