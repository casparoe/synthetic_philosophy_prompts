prompt: |-
  I write for the science and ideas desk of a mid-sized paper, and I keep running into the same one-liner when I interview researchers and tech people: "truth is what works". A physicist used it last month to shrug off my question about whether string theory is actually true or just a useful calculational tool. A startup guy used it to mean something like "whatever model makes money". And then at a book event a philosopher got quite sniffy at me and said that's a cartoon version of pragmatism, that Peirce and James disagreed about this stuff more than either of them disagreed with the absolutists, and that neither of them would recognise the sentence coming out of the physicist's mouth.

  So before I put any of this in a piece I'm drafting on why "post-truth" and "useful fiction" talk keeps bleeding from philosophy into science journalism: help me pull the slogan apart. What are the genuinely different precise claims hiding inside "truth is what works" — from the boring truism that good theories are useful, to something like "useful for whom, over what timescale", to the full-blown "whatever is expedient for me to believe is true" reading that made everyone dunk on James a century ago? For each reading I want a verdict: trivial, substantive-but-defensible, or just false. And crucially, tell me for each one whether it would actually let my physicist dismiss the string theory question, or whether it just sounds like it does.

  Bonus if you can sort out which readings belong more to Peirce's picture (truth as where inquiry ends up in the long run, tied to a community and to methods that self-correct) and which to James's (truth as ideas that get verified in experience, that we cash out). It would also help me alot if you could say where the "it works for them so it's true for them" move — the one my editor always wants to use about, say, placebo effects or homeopathy users — fits into your menu, since I suspect it equivocates between two of the readings but I can't pin down which.

  Please answer in British English (so -ise endings, "labour", that sort of thing), and keep it structured as a list of readings I can actually reference from my notes, not one long essay.
reasoning: |-
  Okay, the user is a science journalist who's encountered the phrase "truth is what works" in various contexts and needs to unpack it for an article. They want to clarify the different interpretations of this slogan to address how "post-truth" and "useful fiction" concepts are seeping into science journalism. 

  First, I need to consider their frustration with how this phrase is used dismissively by sources—like the physicist avoiding the string theory truth question or the startup founder equating truth with profitability. The philosopher's reaction adds another layer, pointing out that this is a misrepresentation of pragmatism. The user's core need is to dissect the slogan into precise claims they can reference, with clear verdicts on each interpretation's validity and applicability.

  Breaking down "truth is what works": The user mentioned wanting to distinguish between trivial, defensible, and false readings. They also highlighted the Peirce vs. James nuance and the "true for them" dilemma about placebos/homeopathy. I should structure this as a numbered list of distinct interpretations for clarity, as requested. 

  Starting with the most basic reading: the idea that truth involves utility. But that's almost tautological—useful theories are better, but usefulness alone doesn't define truth. This is trivial and doesn't let the physicist off the hook. Then there's the verification-focused view, where truth emerges from ideas being confirmed through experience. This is substantive and defensible for operational sciences but falls short for untestable theories like string theory. 

  Moving to James's "cash value" idea—this is where "what works" means what's expedient or satisfying to believe. That's the controversial version that gets called relativistic. Verdict: false as a general truth theory. Peirce's long-term community consensus is more robust but still limited for speculative science. 

  The "expedient belief" reading is the slippery slope to "whatever helps me now is true"—definitely false and the one James was criticized for. Finally, the "true for you" angle is useful for psychological states but collapses when applied to objective claims, making it false as a truth theory. 

  For the bonus part: Peirce aligns with the community consensus reading (substantive), James with verification/expediency (the latter being problematic). The "true for them" move equivocates between psychological benefit (valid) and epistemic truth (invalid). 

  The user's deeper need here is to arm themselves against lazy invocations of pragmatism in interviews. By providing this taxonomy, they can call out when sources misuse the slogan—e.g., the physicist is conflating utility with truth, while the startup founder is veering into expediency. The placebo example gets clarified as a category error. 

  Sticking to British English as requested. Keeping it list-like, not essay-y. Nailed the bonus by separating Peirce/James and dissecting the "true for them" trap. This should give the user sharp tools for their draft.
answer: |-
  Here’s a structured breakdown of the interpretations hiding inside "truth is what works", with verdicts, applicability to your physicist’s string theory dismissal, and notes on Peirce vs. James. All readings assume a basic rejection of correspondence or absolutist truth theories.

  ### Interpretations & Verdicts  
  1. **The Trivial Reading: Useful Theories Are More Likely to Be True**  
     - **Claim**: Success in prediction/application is *evidence* for truth (but not constitutive of it).  
     - **Verdict**: **Trivial** (widely accepted in scientific practice).  
     - **Dismisses string theory question?** ❌ No. Physicist must still engage with whether utility *indicates* truth or merely pragmatic value.  

  2. **Operationalist Reading: Truth = Verification Through Practical Consequences**  
     - **Claim**: A proposition is true if it can be *verified* by observable outcomes (e.g., experiments, predictions). Unverifiable claims are meaningless.  
     - **Verdict**: **Substantive-but-defensible** (core to scientific empiricism; aligns with logical positivism).  
     - **Dismisses string theory question?** ⚠️ Only if string theory is deemed unverifiable. But physicist must justify *why* utility ≠ verifiability.  
     - **Peirce/James Note**: Closer to **James** ("truth *happens* to an idea" via verification). Peirce emphasised *method* over individual verification.  

  3. **Instrumentalist Reading: Truth as Utility for Problem-Solving**  
     - **Claim**: Theories are "true" insofar as they reliably *function* as tools for inquiry or action (e.g., Newtonian physics "works" for engineering). Doesn’t require ontological commitment.  
     - **Verdict**: **Substantive-but-defensible** (common in philosophy of science; e.g., van Fraassen).  
     - **Dismisses string theory question?** ✅ Yes. Physicist can say: "Its truth-status is irrelevant; it’s a useful instrument for calculation/modelling."  

  4. **Jamesian "Expediency" Reading: Truth = What is Personally Satisfying/Beneficial**  
     - **Claim**: Beliefs are "true" if they prove "expedient in the way of thinking" for an individual or group (e.g., religion "works" for comfort, capitalism "works" for profit).  
     - **Verdict**: **False** (as a general theory of truth). Confuses psychology/epistemology; leads to relativism.  
     - **Dismisses string theory question?** ✅ But illegitimately. Reduces truth to "whatever helps the physicist’s career/grants".  
     - **James/Peirce Divide**: Purely **James** (Peirce rejected this subjectivism).  

  5. **Peircean Consensus Reading: Truth as the Ideal End of Inquiry**  
     - **Claim**: Truth is what would be agreed upon by all investigators *in the long run* using self-correcting methods (e.g., scientific community converging via experimentation).  
     - **Verdict**: **Substantive-but-defensible** (emphasises fallibilism and community standards).  
     - **Dismisses string theory question?** ⚠️ Only partially. Physicist must argue string theory is part of *ongoing* inquiry with potential for future consensus. Utility alone is insufficient.  

  6. **Relativist/"True for Them" Reading: Truth = Subjective or Group Expediency**  
     - **Claim**: If a belief "works" for a person/group (e.g., placebo effect, homeopathy), it is "true for them" regardless of evidence.  
     - **Verdict**: **False** (epistemically incoherent). Conflates:  
       - *Psychological benefit* (real, but not truth-conferring).  
       - *Cultural utility* (social cohesion ≠ truth).  
     - **Fits where?**: A mash-up of **James’ expediency** + **misapplied instrumentalism**.  

  ---

  ### Key Clarifications  
  - **Why physicists/startups misuse it**:  
    - **Physicists** often lean on #2 or #3 to sidestep metaphysical debates (e.g., "shut up and calculate").  
    - **Startups** typically invoke #4 or #6 ("makes money" = "true").  
  - **Peirce vs. James**:  
    - **Peirce** (#5): Truth is communal, methodological, and future-oriented. "Works" means *resolves doubt via scientific inquiry*.  
    - **James** (#4 + #2): More individualist. "Works" includes personal/emotional verification (#4), though he also valued empirical testing (#2).  
  - **Your "true for them" bonus**:  
    - **When defensible**: Only as a *descriptive* claim about psychological/cultural belief systems (#6, first part).  
    - **When false**: When implying epistemic relativism (#6, second part) or smuggling in #4 ("if it feels useful, it’s true").  
    - **Equivocation**: Using the defensible part (psychological benefit) to imply the false part (epistemic validity).  

  ### Verdict Summary Table  
  | **Reading**                     | **Verdict**               | **Dismisses String Theory Q?** | **Primary Pragmatist** |  
  |---------------------------------|---------------------------|--------------------------------|------------------------|  
  | 1. Useful = evidence for truth  | Trivial                   | ❌                             | Neither                |  
  | 2. Truth = verification         | Substantive-defensible    | ⚠️ (Contextual)               | James-leaning          |  
  | 3. Truth = instrumental utility | Substantive-defensible    | ✅                             | Both (instrumentalism) |  
  | 4. Truth = personal expediency  | False                     | ✅ (But invalid)               | James                  |  
  | 5. Truth = ideal consensus      | Substantive-defensible    | ⚠️ (Requires justification)   | Peirce                 |  
  | 6. "True for them"              | False (epistemically)     | ✅ (Illegitimately)            | James (distorted)      |  

  ### Recommendation for Your Draft  
  - **Call out equivocation**: The slogan’s power lies in sliding between #1/#3 (defensible) and #4/#6 (relativist). Your physicist likely uses #3 to sound profound while avoiding #2’s harder questions.  
  - **Peirce as antidote**: His focus on long-run communal inquiry (#5) resists "post-truth" by demanding rigorous methods, not just what "works" today.  
  - **"True for them" trap**: Argue that recognising placebo effects requires objective science (#2/#5) – the very framework relativism undermines.  

  This should arm you against editorial "it works for them" simplifications and tech-bro instrumentalism alike.
