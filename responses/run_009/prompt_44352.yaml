prompt: |-
  I write historical novels — mostly 19th century stuff, wars and famines, that genre — and I keep hitting the same problem in every single book, usualy about two thirds of the way through, at 11pm, when my editor is already asking for pages.

  The problem: every big event I depict has too many causes, and I have to pick which one gets narrated as THE cause. Take the outbreak of WWI. My narrator gets maybe two sentences to say why the war happened. Was it the assassination? The alliance system? The mobilization schedules that turned a crisis into a countdown nobody could stop? If I cram all of it in, it reads like a textbook; if I pick wrong, reviewers either call me a determinist or accuse me of turning something complicated into a story with one villain. Same issue at smaller scales. In the famine book I want the government's policy response to be the villain, but honestly the counterfactual seems to run through the blight itself. And in my current draft the heroine delays a departure by a day, and I want the reader to feel that's why they got caught in the storm — even though I suspect that storm was coming for them no matter what she did.

  So: please write a procedure I can run per scene, in a few minutes at my desk, grounded in whatever philosophy of causation and history has actually worked out on this — necessary vs. sufficient causes, Mackie's INUS conditions, Lewis on overdetermination and preemption, the historians' old habit of dividing "causes" from mere "background conditions." I need the questions to ask in order, what counts as an answer good enough that I can write the sentence, where the procedure stops and hands the choice back to me as a judgment call — and when it hands it back, I want it to say what I'm really choosing between (like, whose story it is, not which fact is true). Then run it on my three cases above, including the heroine one — I have a feeling the procedure will give me an answer I don't like there, and I'd rather know now than from a review.

  Last thing: tell me where this whole procedure is most likely to misfire on me, and what would change your mind about the verdicts — i.e., which step, if some philosopher or historian turned out to be right about something I'm glossing over, would collapse the whole thing.
reasoning: |-
  Okay, the user writes historical novels set in the 19th century, focusing on wars and famines. They're hitting a recurring problem about two-thirds into each book: how to handle the causes of major events without oversimplifying or turning it into a textbook. They need a practical procedure to decide which cause to highlight per scene, grounded in philosophy and history. 

  First, I should understand their core struggle. They're torn between historical accuracy and narrative effectiveness. For WWI, they mention multiple causes—assassination, alliances, mobilization schedules—but their narrator only gets two sentences. If they cram all in, it feels academic; if they pick one, reviewers might call them reductive. Same with the famine book: they want policy as the villain, but the blight seems equally crucial. And for the heroine delaying departure, they want it to feel causal, even if the storm was inevitable. 

  The user explicitly asks for a step-by-step procedure based on causation theories (INUS conditions, overdetermination, etc.), with clear questions to ask per scene. They want it quick—"a few minutes at my desk"—and want examples applied to their three cases. Crucially, they want to know when the choice becomes a judgment call about "whose story it is," not just facts. They also request weaknesses: where the procedure might misfire and what could collapse it if philosophers/historians debate certain points. 

  Digging deeper, their unspoken needs might include: 
  - Avoiding reader/reviewer backlash (they mention determinism accusations). 
  - Balancing their own integrity as a researcher with storytelling demands. 
  - A tool to reduce late-night existential crises when editors are pressuring them. 
  - Validation that picking a narrative cause isn't "cheating" history. 

  For the procedure, I'll synthesize causation frameworks: 
  1. Mackie's INUS (Insufficient but Necessary part of an Unnecessary but Sufficient condition) helps isolate "difference-makers." 
  2. Lewis's overdetermination/preemption addresses "what ifs." 
  3. Historians' distinction between causes/background conditions (e.g., Braudel's longue durée vs. events). 

  The steps should: 
  - Identify all candidate causes. 
  - Filter by narrative role (is this the villain? a pivot?). 
  - Test counterfactuals ("would X still happen if Y changed?"). 
  - Assess necessity/sufficiency loosely. 
  - Then hand back for thematic/story-based choice. 

  For misfires: The procedure assumes causes can be disentangled, but history is messy. If overdetermination is rampant (e.g., the storm was *always* hitting), forcing a cause might backfire. Also, philosophy debates (e.g., whether preemption is real) could undermine steps. 

  Now, applying to their cases: 
  - **WWI**: INUS analysis might spotlight mobilization schedules as the "spark" accelerator, but narratively, the assassination better suits personal stakes. Procedure would say: choose based on whether the story is about systemic drift or individual actions. 
  - **Famine**: Policy is the INUS villain if changing it could have mitigated the blight. But if blight alone was sufficient, policy becomes context. Here, their thematic goal (critiquing governance) should decide. 
  - **Heroine's delay**: Counterfactual fails—storm happens regardless. But for narrative "guilt," use preemption: her delay is the "last link." Admit the procedure exposes this as artificial, but that’s okay if the story is about her agency. 

  Finally, emphasize that the procedure's output isn't "truth" but narrative scaffolding. Its weakness is compressing chaos into causality—which is literally the novelist's job. If new historiography shows an event was radically overdetermined (e.g., WWI was inevitable by 1900), the "choice" step becomes more arbitrary, but that’s where story purpose saves them.
answer: |-
  Here's a **Causal Fidelity Filter (CFF)** – a step-by-step procedure grounded in historical philosophy, designed for novelists under deadline. It forces clarity without ignoring complexity. Run it per key causal dilemma.

  ---

  ### **The Causal Fidelity Filter (CFF) - Procedure**

  **Step 1: List Candidate Causes (1 min)**  
  *Brainstorm every plausible cause/condition for the event. No filtering.*  
  *e.g., (WWI): Archduke assassinated, Blank Check, alliance chains, mobilization timetables, colonial tensions, arms race, nationalism, press hysteria, etc.*

  **Step 2: Apply INUS Filter (Mackie) (1 min)**  
  *Identify which causes are:*  
  **- I**nsufficient (alone)  
  **- N**ecessary (in the chain)  
  **- U**nnecessary (for the event type)  
  **- S**ufficient (as part of a set)  
  *Flag causes that are **necessary parts of a sufficient set** for THIS specific event.*  
  *e.g., Mobilization timetables = **INUS**. Not sufficient alone, but necessary to turn crisis into continental war.*

  **Step 3: Counterfactual Test (Lewis) (1 min)**  
  *Ask: "If I **removed ONLY this cause**, holding others fixed, would the event **likely still occur** in a similar form/timing?"*  
  *- If **NO**: It's a strong candidate (possibly necessary).*  
  *- If **YES**: It's a background condition or overdetermined factor.*  
  *e.g., If no Archduke assassination? War might have happened later over another crisis. If no mobilization timetables? July Crisis likely resolved diplomatically.*

  **Step 4: Agency & Scale Check (Historians' Practice) (1 min)**  
  *- Is this cause tied to **deliberate human action** (policy, decision, mistake)?*  
  *- Is it **operating at the scale of my narrative** (individual, institutional, structural)?*  
  *Prioritize causes where your characters have agency or stakes.*  
  *e.g., Famine: Blight = structural. Policy response = institutional agency. Your characters experience policy.*

  **Step 5: Narrative Function Test (Your Judgment Call)**  
  **Ask:**  
  *"Which cause...*  
  *a) ...best **serves the theme** I'm exploring (e.g., hubris, bureaucratic failure)?*  
  *b) ...maximizes **reader emotional impact** (guilt, irony, outrage)?*  
  *c) ...is **irreducible** in this character's story (the cause they see/feel)?*  
  *d) ...creates the most **meaningful dramatic tension** moving forward?"*  
  ***This is where you choose whose story it is.***

  **Step 6: Write the Sentence**  
  *Synthesize Steps 1-5 into 1-2 sentences. Use:*  
  **- Explicit language** for your chosen cause ("triggered," "decided," "ensured").  
  **- Implicit language** for background ("amid," "against a backdrop of").  
  **- Hedges** if needed ("the spark that ignited," "the final link in the chain").  

  ---

  ### **CFF Applied to Your Cases**

  1. **WWI Outbreak (Narrator's 2 sentences):**  
     - *Step 1:* Assassination, alliances, mobilization, nationalism.  
     - *Step 2:* Mobilization = **INUS** (necessary accelerator). Alliances = background (always present).  
     - *Step 3:* Remove mobilization → likely no August 1914 war. Remove assassination → war possible later.  
     - *Step 4:* Mobilization = institutional agency (generals/politicians deciding).  
     - *Step 5:* Theme = **inevitability of modern war**. *Choose mobilization:*  
       > *"The machinery of mobilization timetables, once set in motion, rendered diplomacy obsolete. What began as a political murder became, within weeks, an inescapable continental war."*  
     *Why not assassination?* It's the spark, but your theme demands systemic causes.

  2. **Famine Villain (Policy vs. Blight):**  
     - *Step 1:* Blight, laissez-faire policy, crop monoculture, transport failures.  
     - *Step 2:* Policy = **INUS**. Without blight, no famine. Without *this* policy, famine mitigated.  
     - *Step 3:* Remove policy → famine less severe. Remove blight → no famine. *But policy is actionable*.  
     - *Step 4:* Policy = institutional agency (your villain). Blight = force of nature (no antagonist).  
     - *Step 5:* Theme = **government negligence**. *Choose policy:*  
       > *"The blight withered the potatoes, but it was the Treasury's refusal to halt exports or open granaries that turned scarcity into mass graves."*  
     *Why not blight?* It removes human culpability—your core conflict.

  3. **Heroine's Delay & the Storm:**  
     - *Step 1:* Heroine's choice, storm path, captain's haste, ship's seaworthiness.  
     - *Step 2:* Heroine's delay = **INUS** (part of a set: delay + storm + voyage = disaster).  
     - *Step 3:* Remove delay → ship leaves earlier, *might* avoid storm. Remove storm → no disaster.  
     - *Step 4:* Delay = character agency (her flaw/choice). Storm = background (impersonal).  
     - *Step 5:* **You want reader blame/guilt**. *But CFF warns:* If storm hit regardless (overdetermined), her delay is **not necessary**.  
       *Solution:* Reframe via **causal preemption** (Lewis): Her delay is the "last link" the reader witnesses.  
       > *"Had she boarded at dawn as planned, they might have skirted the storm's edge. Her day's delay brought the ship squarely into its maw."*  
     *CFF Verdict:* **Acceptable IF** you imply chance ("might have skirted"). If the storm was *inescapable*, this misfires.

  ---

  ### **Where the CFF Misfires & Collapse Points**

  1. **Radical Overdetermination:**  
     - If *all* causes are sufficient alone (e.g., storm hits ANY ship in area + heroine delays ANY departure), CFF struggles.  
     - *Fix:* Default to **Step 5 (narrative function)**. Choose the cause that resonates emotionally.

  2. **Historiographical Shifts:**  
     - If new evidence proves a "background" condition was actually necessary (e.g., alliances WERE decisive for WWI), **Step 3 (counterfactual)** collapses.  
     - *Safeguard:* Cite credible historians in your research to anchor Step 3.

  3. **Philosophical Challenges:**  
     - If you reject **Lewis-style counterfactuals** (e.g., "possible worlds" are unsound), **Step 3 fails**.  
     - If you reject **Mackie's INUS** (e.g., causes are indivisible), **Step 2 fails**.  
     - *Fallback:* Use **Step 4 (agency/scale)** + **Step 5 (narrative)**. Focus solely on "what your characters perceive and act upon."

  4. **Temporal Scale Errors:**  
     - CFF assumes causes are discrete. For *longue durée* forces (climate, economics), use **background language** ("in an age of crumbling empires...").  
     - *e.g.,* Famine: *"Decades of colonial extraction left villages defenseless when the blight came."*

  ---

  ### **Final Judgment Call**
  The CFF doesn't choose "truth" – it forces you to **expose your priorities as a storyteller**. When Step 5 hands the choice back, you're deciding:  
  - **Whose agency matters?** (The general's order? The soldier's hesitation?)  
  - **What lesson haunts the reader?** ("Systems kill" vs. "One mistake dooms all")  
  - **Where does the moral weight lie?** (Villainy? Fate? Negligence?)  

  **Write the sentence that serves the story, not the seminar.** The historians' quarrel over "primary causes" is eternal; your novel's power is in making *a* cause feel inevitable to the reader.
