prompt: |-
  I live in a forty-unit condo building, and I've been on the board for two years, which has gotten me thinking about how we charge for shared things. We do it at least four different ways, and I can't tell whether there's a principle underneath it all or just habit.

  Repairs to the roof, the lobby, and the hallways come out of the general fund, which every unit pays into at a flat rate — the same dollar amount for the studio on the third floor as for the three-bedroom penthouse twice its size. Nobody chose that; it's in the original declaration from 1978. Our gym used to work the same way, but last year, after owners who never use it complained that they were subsidizing the heavy users, we installed fob readers and switched to per-visit fees, with the money going back into the general fund. The guest parking spots we rent out at market rate to whoever books first, including outsiders, and the profit subsidizes everyone's dues. And the bike room is left unlocked while the storage cages are individually locked and assigned by annual lottery.

  Here's what's bothering me. When the roof leaks, no one can be excluded from the repair, and no one can use more of it than anyone else. Once the gym was fobbed, we could finally track who uses what. When we rent parking to outsiders, we're not sharing among ourselves at all anymore — we're selling. So the same group of people is simultaneously splitting costs equally regardless of use, charging by use, and operating as a small business. When I raised this at a board meeting, one member said flat dues are fair because you can't keep anyone out of a good roof, and another said per-visit gym fees are fair because everyone should pay for what they take. Both sounded right to me, and they can't both be the principle.

  So my question is this: does our building's setup actually presuppose some consistent view of when a shared cost should be split equally versus charged by use versus sold — something about the nature of the thing being shared, or about fairness, or nothing at all? Is the mix defensible because the goods really are different in kind, or is it just that each rule was made at a different moment by a different group of annoyed people? And here's the part I'd like a definite answer to rather than a menu: if you had to pick one principle the building should commit to going forward, which would it be, why that one, and what would change about our actual rules — especially the fob system — if we adopted it?

  Some of this is practical, but I'm more interested in whether there's a real line here: is there a genuine difference between things people share because they can't practically be divided up (the roof, the hallways) and things people share only as a convenience (the gym, the guest suite, the parking), or is that a line we're drawing rather than finding? If the line is real, tell me what it is in plain terms. If it isn't, tell me why the fob decision nevertheless felt obviously right to almost everyone at the time.

  I'd like a committed answer: take a definite position and defend it, don't lay out the options and leave me to choose. Write in American English. And I should say upfront that I have no background in economics or philosophy — if there's a standard name for what I'm circling around, go ahead and name it, but don't assume I've read anything.
reasoning: |-
  Okay, let me tackle this condo fee question. The user is clearly frustrated by the inconsistent cost-sharing methods in their building - flat dues for roofs, per-use fees for the gym, market-rate rentals for parking, and lottery systems for storage. They're asking if there's a logical principle behind this mix or just historical accidents, and want a definitive recommendation.

  Hmm, the core tension here seems to be between two fairness concepts: collective responsibility versus individual consumption. The roof example is interesting - it's non-excludable and non-rivalrous by nature. You literally can't charge only some owners for roof repairs because it protects everyone equally. The gym is different; it's both excludable (we added fobs) and rivalrous (equipment has limited capacity). 

  I notice the user mentions that switching to gym fees "felt obviously right" - that's telling. It suggests that when something transitions from being perceived as collective infrastructure to being seen as a consumable service, people instinctively want usage-based pricing. The parking spots are even more transactional since they're actively generating profit from outsiders.

  The philosophical angle here relates to what economists call "club goods" versus "public goods." But I shouldn't drown them in jargon. The practical distinction boils down to: Can we reasonably track usage? And does one person's use diminish availability for others? 

  For their "committed answer" request: I think the building should default to cost-sharing for truly collective infrastructure (roofs, hallways, structural elements) because exclusion is impossible and usage can't be measured. For discretionary amenities (gym, guest suites), usage fees are fairer and more efficient. The fob system was correct - it transformed the gym from a mandatory cost-burden to a voluntary service. 

  Where they might need policy changes: The parking profit-subsidy creates weird incentives. If they adopt this principle, parking should either be member-only with fees or properly treated as income-generating real estate. The storage lottery is actually fine - it's allocating exclusive access rights, which is different from cost-sharing.

  The user's instinct about a "line" is sharp - it's not arbitrary. The difference lies in whether the resource's fundamental nature requires collective funding. Charging per gym visit doesn't undermine community; charging extra for roof access would. That's why the fob decision felt right: it aligned payment with actual consumption patterns for a divisible good.
answer: |-
  You're circling around a fundamental debate in collective resource allocation: when costs should be shared equally versus assigned based on use or market value. Your building's mix isn't arbitrary—it reflects intuitive distinctions between types of shared goods, but the *implementation* has been inconsistent. Here's the committed answer you want:

  **The core principle you should adopt going forward: Costs should be allocated based on *excludability* and *rivalry*.** These terms aren't jargon-heavy; they're practical filters:

  1.  **Non-excludable + Non-rivalrous goods:** **Split equally via flat dues.**  
      *   **Definition:** You *can't* practically prevent owners from benefiting (non-excludable), and one person's use *doesn't* reduce availability for others (non-rivalrous).
      *   **Your Examples:** The **roof, lobby, hallways, structural elements, exterior walls, foundation.** A leaky roof protects everyone; you can't exclude Unit 3B, and Unit 3B's protection doesn't mean Unit 5A gets less protection. The cost is inherently collective.
      *   **Principle:** **Flat dues are fair and necessary.** Charging by use is impossible (you can't measure "roof usage") and exclusion is unethical/impractical (letting a unit flood because they didn't pay a special assessment?).
      *   **Action:** Keep these funded via the general fund with flat dues. This is correct.

  2.  **Excludable + Rivalrous goods:** **Charge by use or market rate.**  
      *   **Definition:** You *can* practically control access (excludable), and one person's use *does* reduce availability or increase costs for others (rivalrous).
      *   **Your Examples:** The **gym, guest parking spots, guest suite (if you have one), potentially storage cages.** A treadmill is occupied by one person at a time (rivalry). Fob readers allow exclusion. Parking spots are the ultimate rivalrous good – only one car fits per spot.
      *   **Principle:** **Per-use or market-based fees are fairer and more efficient.** Heavy users impose higher maintenance/opportunity costs. Non-users shouldn't subsidize them. Market pricing allocates scarce resources efficiently (like guest parking).
      *   **Action:** **The fob system for the gym is the *right* model.** It should be extended:
          *   **Gym:** Keep per-visit fees. They accurately reflect cost causation (users wear equipment).
          *   **Guest Parking:** **Stop subsidizing dues with outsider rentals.** This blurs the line. Instead:
              *   Reserve spots *primarily* for residents/guests.
              *   Charge residents a **per-use/reservation fee** (lower than market) to cover maintenance/reserve fund. This ensures residents needing parking pay, while non-users don't subsidize it. Outsiders could pay a higher market rate *only* if spots are consistently unused by residents, with profits clearly earmarked for amenity upgrades (not general dues).
          *   **Storage Cages:** The lottery assigns *exclusive* access (excludability). Annual fees should cover the *space cost* (maintenance, security for the room) – this could be flat. But if cages vary significantly in size/desirability, fees could be tiered. The key is that only the *user* pays for the *exclusive access*.

  3.  **The "Gray Zone" (Often Managed by Assignment/Fee):**  
      *   **Definition:** Goods that are rivalrous but where exclusive, long-term assignment is practical and desirable.
      *   **Your Example:** **Storage Cages.** They are rivalrous (only one owner uses a specific cage). The lottery assigns exclusive rights.
      *   **Principle:** **Charge the exclusive user.** The cost of maintaining the *room* (security, lighting, structure) is a common, non-rivalrous good – split that equally via flat dues. The *right to exclusive use of a specific cage* is a private benefit – charge the assigned user an annual fee reflecting the value/space of *their* cage.
      *   **Action:** Your lottery system is fine. Ensure users pay an annual fee covering the "rent" for their exclusive space, while the common room infrastructure is in the general fund.

  **Why the "Line" is Real (Not Just Convenience):**

  The distinction between the roof and the gym isn't just about practicality; it's about **fundamental economic nature**. The roof is a *pure public good* for the building – non-excludable and non-rivalrous by its very physical nature. Charging by use is physically impossible. The gym is a *club good* or *toll good* – excludable and rivalrous. Charging by use is not only possible but aligns cost with consumption. The parking spot is a *private good* – easily excludable and highly rivalrous. Treating it like a pure public good (subsidizing everyone equally via outside rentals) distorts incentives and fairness.

  **Why the Fob Decision Felt Obviously Right (Even Without This Framework):**

  People intuitively grasped the gym shifted from being perceived like the *roof* (a basic, unavoidable part of condo living funded by all) to being like a *private service* (like a spa membership). The fob made exclusion possible, revealing its rivalrous nature ("heavy users"). Suddenly, the flat fee felt like non-users were forced to buy a membership they didn't want. This aligns perfectly with the excludability/rivalry principle.

  **Your Committed Path Forward & Changes:**

  1.  **Principle:** Allocate costs based on **Excludability and Rivalry**.
  2.  **Why This One:** It's principled (based on the *nature* of the good), practical (determines what's measurable), and fair (users/buyers pay for private benefits; collective costs are shared equally). It provides a clear test for any future shared resource debate.
  3.  **Changes to Your Rules:**
      *   **Roof/Lobby/Hallways:** Keep flat dues. **Correct.**
      *   **Gym:** Keep per-visit fob fees. **Correct.** Consider if fees are set to cover actual costs (equipment wear, cleaning, utilities).
      *   **Guest Parking:** **Reform this significantly.**
          *   Prioritize resident use.
          *   Charge residents a **per-use/reservation fee** (covering maintenance/reserves).
          *   Only rent to outsiders at market rate *if surplus exists*, with profits directed *specifically* to amenity funds (e.g., gym upgrades, new patio furniture), NOT to subsidize general dues. This stops the "small business subsidizing collective costs" inconsistency.
      *   **Storage Cages:** Lottery is fine. Ensure users pay an **annual fee** covering the exclusive right to their cage. The common room costs (lights, locks, structure) stay in the general fund (flat dues).
      *   **Fob System:** **It's the right model for the gym and demonstrates the principle perfectly.** It transformed an unmeasured common good into a measurable, excludable, rivalrous service. No change needed here – it's the exemplar.

  **In plain terms:** If you *can* lock it and one person using it means another *can't* use it at the same time (gym equipment, parking spot), charge the user. If you *can't* lock it out and everyone benefits equally no matter what (roof, hallways), split the cost equally. Your building was mostly following this intuition, but the parking setup violated it by using a private good (parking spot rentals) to subsidize public goods (general dues). Fixing that parking model is the key change needed to make your system fully principled and consistent.
