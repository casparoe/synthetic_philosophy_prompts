  (Clinking glass gently)  
  To Eleanor.  

  We all know Eleanor’s superpower, don’t we? That laser focus across a crowded room, that quiet intensity that could make a minister reconsider their budget line… or a junior field officer triple-check their data before a presentation. For nearly thirty years, she’s wielded it not for glory, but for something far more profound: the conviction that hunger is not destiny.  

  I remember my first week shadowing her. We were meeting a very important, very well-meaning donor who kept talking about “fighting mother nature’s cruel hand,” and “battling inevitable disasters.” I saw Eleanor take a slow sip of tea, put the cup down with *that* click, and lean forward with a smile that was somehow both warm and terrifying. “Ah,” she said, “but that’s where the magic – and the tragedy – lies. The sky doesn’t decree famine. People do. Or rather, people *allow* it. The food is often *right there*. The real question is why some hands remain empty.”  

  That was Eleanor’s North Star. Bengal 1943 wasn’t just a historical case study for her; it was the Rosetta Stone. It proved her life’s work: that starvation isn’t about empty fields, but about empty entitlements. It’s about who gets to command the grain in the warehouse, the fish in the sea, the money in the pocket. It’s about choices made, or not made, by people in power. She didn't see victims of nature; she saw the catastrophic results of policy failure, neglect, and broken systems.  

  And oh, how she fought that fatalism! Every briefing, every donor pitch, every exasperating meeting with some official clinging to the ‘natural disaster’ script – she met it with Sen’s quiet truth: that a free press and accountable government are the most powerful famine prevention tools we have. She didn’t just deliver aid; she delivered uncomfortable truths, wrapped in impeccable logic and a steely determination that refused to accept the unacceptable.  

  That’s what made her such an extraordinary leader. She saw the complexity – the tangled web of markets, power, and access – but refused to be paralyzed by it. She demanded rigor, yes. She demanded evidence, absolutely. But above all, she demanded *agency*. The belief that we *can* prevent this. That letting people starve amidst plenty isn’t an act of God; it’s a profound human failure. And therefore, crucially, a failure we can fix.  

  So, Eleanor, we raise our glasses to you:  
  To your relentless clarity that cut through fog and fatalism.  
  To your unwavering voice for the voiceless, reminding the powerful where true responsibility lies.  
  To your infectious, stubborn belief that a better way *is* possible.  
  To thirty years of not just feeding people, but fighting for the fundamental idea that their dignity, their very survival, should never be subject to someone else’s neglect or indifference.  

  You taught us that famines end not when the rains come, but when the political will arrives. That the antidote to despair isn’t just sacks of grain, but systems built on justice and accountability. Your legacy isn’t just in meals served or policies changed (though there are countless!), but in the minds you’ve shifted, the fatalism you’ve dismantled, and the fierce, hopeful conviction you’ve ignited in everyone who’s worked beside you.  

  You leave the field, Eleanor, but the fight you shaped – the fight against preventable human failure – goes on, stronger because you were here. We will miss your laser focus across the room, but we carry the fire you lit. Thank you for showing us that hunger is *never* just an act of nature. It’s a choice. And thanks to you, we choose to keep fighting for the other outcome.  

  To Eleanor!  

  **(This toast achieves the balance by:)**  
  1.  **Opening Warmly & Personally:** Starts with a shared observation ("superpower," "laser focus") and a personal anecdote.  
  2.  **Embedding Her Core Belief Naturally:** Uses her own words ("People do. Or rather, people *allow* it," "The food is often *right there*," "empty entitlements," "policy failure," "human failure"). References Bengal 1943 *as her defining example* without needing Sen's name or stats.  
  3.  **Contrasting Without Lecturing:** Juxtaposes the common "natural disaster" language ("mother nature’s cruel hand," "inevitable disasters") with her perspective implicitly through her quoted reaction and explicit statements later.  
  4.  **Highlighting Her Impact & Conviction:** Focuses on her actions (fighting fatalism, demanding agency, delivering truths) and her foundational belief in *preventability* as the core of her heroism.  
  5.  **Ending on Hope & Legacy:** Explicitly ties her core belief ("famines end... when the political will arrives," "preventable human failure") to the hopeful, forward-looking note required for a toast. The final lines ("hunger is *never* just an act of nature... It's a choice") perfectly encapsulate her life's work for *all* audiences.  
  6.  **Honoring Her Personally:** Mentions her leadership style, her impact on colleagues, and her lasting legacy, ensuring the warmth and personal tribute shine through the intellectual foundation.  
  7.  **Avoiding Jargon/Stats:** Uses accessible language ("command the grain," "broken systems," "accountable government") instead of technical terms like "entitlement failure" or "exchange entitlements."
