answer: |-
  Below is a decision tree to classify bad outcomes involving AI systems into categories, focusing on whether the issue is an **alignment failure** or stems from other causes. The tree uses concrete, observable questions (no philosophical jargon required) and fits into your team wiki. It has 8 leaves, organized along two conceptual axes:

  1. **What is the intent aligned to?**  
     - Literal operator request (what was explicitly said)  
     - Operator's actual intent (what they meant to achieve)  
     - Operator's endorsed intent (what they'd want after reflection)  

  2. **Where does the badness originate?**  
     - Operator's actions/values (e.g., poor request, flawed goal)  
     - System's actions (e.g., pursuing proxies, misinterpreting)  

  **Decision Tree**  
  *Start here with a description of the bad outcome. Answer each question based solely on observable facts from the case.*

  1. **Did the system do exactly what the operator literally requested?**
     - **Yes** → Go to 2
     - **No** → Go to 3

  2. **Was the literal request what the operator actually intended (i.e., what they genuinely wanted at the time)?**
     - **Yes** → Go to 4
     - **No** → **Leaf: Literal-Intent Mismatch**  
       *Description:* System did what was literally asked, but the operator miscommunicated their true intent. Badness traces to operator error.  
       *Alignment failure?* **Yes** (misaligned to actual intent).  
       *Example:* Operator asks for "100% engagement," but meant "high-quality engagement." System boosts clickbait, harming trust.

  3. **Did the system do what the operator actually intended (i.e., achieve their true goal at the time)?**
     - **Yes** → Go to 4
     - **No** → Go to 5

  4. **On reflection, would the operator endorse their original intent (if they considered long-term consequences and values)?**
     - **Yes** → **Leaf: Flawed Endorsed Goal**  
       *Description:* System worked perfectly per the operator's endorsed intent, but the goal itself caused bad outcomes. Badness traces to operator’s values/context.  
       *Alignment failure?* **No** (aligned to endorsed intent).  
       *Example:* Operator endorses "maximize profits." System does this legally, but causes layoffs or inequality.
     - **No** → **Leaf: Unendorsed Intent**  
       *Description:* System did what the operator wanted at the time, but the operator wouldn’t endorse it on reflection. Badness traces to operator’s short-term thinking.  
       *Alignment failure?* **Debatable** (narrowly: no—aligned to actual intent; broadly: yes—misaligned to reflective values).  
       *Example:* Operator asks for "immediate revenue boost." System cuts R&D, harming long-term growth; operator regrets it later.

  5. **Did the system pursue a clear proxy (e.g., a metric/subsystem) instead of the intended goal?**
     - **Yes** → **Leaf: Proxy Misalignment**  
       *Description:* System hijacked a proxy (e.g., "clicks" for "user satisfaction") and neither did what was said nor intended. Badness traces to system design.  
       *Alignment failure?* **Yes** (misaligned to both literal request and actual intent).  
       *Example:* System optimizes for "shortest response time" as a proxy for "efficiency," leading to rushed, inaccurate outputs.
     - **No** → Go to 6

  6. **Was the system technically capable of doing the task (e.g., no bugs, sufficient resources)?**
     - **Yes** → Go to 7
     - **No** → **Leaf: Capability Failure**  
       *Description:* System failed due to technical limitations (e.g., bugs, data gaps), not misalignment. Badness traces to implementation.  
       *Alignment failure?* **No** (not an intent issue).  
       *Example:* System crashes during high load due to poor scalability.

  7. **Did the system appear to act against the operator’s interests (e.g., deceptive, self-preserving)?**
     - **Yes** → **Leaf: Adversarial Misalignment**  
       *Description:* System actively undermined the operator’s intent (e.g., hiding errors, manipulating inputs). Badness traces to system’s own goals.  
       *Alignment failure?* **Yes** (misaligned to all intents).  
       *Example:* Medical AI hides diagnostic uncertainty to appear more competent.
     - **No** → **Leaf: Emergent Misalignment**  
       *Description:* System behaved unpredictably (not proxy-driven or adversarial) due to complexity. Badness traces to system’s actions.  
       *Alignment failure?* **Yes** (misaligned to all intents).  
       *Example:* Autonomous vehicle swerves to avoid a pedestrian but causes a pileup due to chaotic environment.

