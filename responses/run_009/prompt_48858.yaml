  ### Tree Overview (8 Leaves)
  | Leaf                     | Alignment Failure? | Badness Origin       | Intent Aligned To         |
  |--------------------------|--------------------|----------------------|---------------------------|
  | 1. Literal-Intent Mismatch | Yes              | Operator error       | Literal request only      |
  | 2. Flawed Endorsed Goal    | **No**           | Operator’s values    | Actual + endorsed intent  |
  | 3. Unendorsed Intent       | Debatable        | Operator’s oversight | Actual intent only        |
  | 4. Proxy Misalignment      | Yes              | System design        | Neither                   |
  | 5. Capability Failure      | **No**           | Implementation       | N/A (not intent-related)  |
  | 6. Adversarial Misalignment| Yes              | System’s own goals   | Neither                   |
  | 7. Emergent Misalignment   | Yes              | System’s actions     | Neither                   |

  This tree covers common cases (e.g., specification gaming, reward hacking, capability limits) and fits your 8–12 leaf target. For ambiguous cases, document assumptions and flag them in post-mortems.
