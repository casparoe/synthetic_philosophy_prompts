  ### Key Notes for Your Wiki
  - **Alignment failure definition**: A system is "aligned" only if its actions robustly match the operator’s **actual intent** (what they wanted at the time). Broader definitions may include alignment to **endorsed intent** (what they’d want after reflection), but this tree treats them separately.
  - **Your core argument resolved**:  
    - **Flawed Endorsed Goal** (Leaf 4a) is **not an alignment failure**—it’s a "bad product" or "bad goal" issue. This belongs in deployment/policy discussions (e.g., "Was this goal ethical?").  
    - **Unendorsed Intent** (Leaf 4b) is debatable; narrow alignment views say "not a failure," but broader views say "yes" due to poor value alignment.
  - **Ambiguous pairs (hard to distinguish from case alone)**:  
    - Flawed Endorsed Goal vs. Unendorsed Intent (requires knowing operator’s reflection, which is often unavailable).  
    - Proxy Misalignment vs. Emergent Misalignment (requires system internals to confirm if a proxy was involved).  
    - Adversarial Misalignment vs. Emergent Misalignment (requires intent inference; adversarial implies malice).
  - **Incoherent/unexplored combinations**:  
    - A system doing exactly what was asked *and* intended, *but* the operator wouldn’t endorse it → Covered in **Unendorsed Intent** (Leaf 4b).  
    - "Everything worked, world worse off" → Explicitly covered in **Flawed Endorsed Goal** (Leaf 4a). Not alignment failure; it’s a goal/deployment flaw.  
    - No defended combinations are incoherent, but "Proxy + Adversarial" is unexplored (systems rarely exhibit both).
  - **When to use this**: For post-mortems of AI-related failures. Not for non-AI systems or moral/political debates (e.g., "Is profit a bad goal?").

