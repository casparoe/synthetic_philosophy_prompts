prompt: |-
  Each spring I sit on the jury of a small literary foundation's essay prize for writers under thirty, a duty I fell into some years ago when a novelist's name was needed to lend the enterprise a certain glamour. The prize is judged as much on prose as on argument, but the themes are always argumentative, and this year the foundation set the entrants the following question: "Populist movements across Europe and the Americas claim to speak for the will of the people more faithfully than parliaments, parties, and courts ever can. Either explain what defenders of constitutional democracy must concede if this claim is granted, or show precisely what the claim misunderstands about how democratic will is formed. Entrants may not sit on the fence." The finalists' essays have now reached us, and I must score each out of a hundred and circulate a page of written comments to the other jurors before we meet. My confidence in judging the prose is complete; my confidence in auditing the political philosophy is not, and I would rather check carefully than bluff. Here, in full, is one of the shortlisted entries:

  "The constitutional state has an awkward relationship with its own founding fiction. It claims authority in the name of the people while surrounding the expression of that will with obstacles: unelected judges, supermajority rules, staggered terms, independent central banks. The populist thrives on this contradiction, promising to cut through the machinery and return power to its rightful owner. The constitutionalist who dismisses this as mere demagoguery has not answered it; he has only changed the subject. The philosophical difficulty is that the will of the people is not a natural object waiting to be discovered; it has to be produced. Rousseau saw this earliest. In the Social Contract he distinguishes the general will from the will of all: the former is simply what you get when you add up what each citizen wants on a given day, while the latter is directed at the common good and exists prior to any counting. A referendum, on this view, is not a discovery procedure but a construction, and the same holds for elections. There is no unmediated voice of the people for the populist to channel, and in this sense the populist claim is empty. Jan-Werner Müller's What Is Populism? makes the point from another direction. His distinction between the pragmatic and the redemptive faces of democracy explains why populism is a permanent shadow of democratic politics rather than a pathology imported from outside: democracy promises both workable institutions and a kind of salvation, and populists harvest the gap between the two promises. Müller adds that the populist's distinctive move is the claim to exclusive moral representation — only we truly speak for the people — which is why populism is anti-pluralist at its core. If the people's will is always mediated, the remedy is not less mediation but better mediation. Courts, electoral systems, and federal divisions do not thwart popular self-rule; they are what allow a plural public to govern itself over time rather than allowing one snapshot majority to govern everyone once. Opinion polls, being snapshots of dispersed and changeable preferences, are the weakest form of mediation and deserve the least authority. The populist is right that something is being represented in the name of the people; he is wrong only about the vehicle."

  What I would like from you is a provisional mark out of a hundred, together with the point-by-point comments I can put before the other jurors. Please work through the essay paragraph by paragraph: identify where the argument is doing real work and where it merely gestures, and flag anything that is attributed to the wrong source, conflated with a neighbouring concept it had just been distinguished from, or asserted as following from a previous step when it does not. The jurors' notes are also sent to the entrants, so the comments should be specific and instructional rather than merely corrective — where you find a fault, say what a stronger treatment of that passage would have had to establish. A rough allocation of the mark between quality of argument, accuracy in the handling of the sources the entrant invokes, and quality of the prose would help me defend my score at the meeting.
reasoning: |-
  Hmm, the user is a literary juror who needs help evaluating an essay about populism and constitutional democracy. This is quite an intellectual challenge! 

  First, I need to understand the context. The juror is assessing a philosophy-heavy essay for a writing prize, and while they're confident about judging prose, they're less sure about political theory. They want me to evaluate the essay's argument rigor, source accuracy, and prose quality - and even suggest a score. 

  Looking at the essay itself... interesting. It makes two core moves: first arguing that "popular will" is constructed rather than discovered (via Rousseau), then claiming populism exploits democracy's dual promises (via Müller). The prose is elegant but the argument has some shaky spots. 

  Ah, I spot three main issues: 
  - The Rousseau interpretation is flipped! The essay confuses volonté générale with volonté de tous - a serious error for a philosophy piece. 
  - The Müller application feels surface-level, missing his key anti-pluralism critique. 
  - There's a leap about mediation that needs more justification.

  For scoring... prose is excellent (28/30), argument has flashes of brilliance but flaws (22/40), and source handling is problematic (15/30). That totals 65/100 - a mid-range score showing potential but needing philosophical tightening. 

  The juror will need specific comments for other judges. I'll structure feedback paragraph by paragraph, noting where concepts get muddled and how to fix it. The Rousseau correction is crucial - I should emphasize that volonté générale is the normative ideal, not the raw tally. 

  Also worth noting: the essay's conclusion about "better mediation" is perceptive but underdeveloped. If the entrant had grounded this in democratic theory (like Habermas?), it could've been stronger. Maybe I'll suggest that as improvement advice. 

  Most importantly, my comments must help the juror defend the score. I'll balance criticism with recognition of the essay's strengths - the Müller connection is smart, just underexplored. The "snapshot majority" phrasing is particularly elegant. 

  ...Better start drafting those paragraph notes. The juror needs clear distinctions between conceptual errors and mere stylistic choices.
answer: |-
  Here is a provisional mark and detailed feedback for the essay, structured as requested. The essay demonstrates strong prose and engages with core concepts, but suffers from significant philosophical inaccuracies and underdeveloped arguments.

  **Provisional Mark: 65/100**

  *   **Quality of Argument:** 22/40 (Flawed core interpretation undermines key points, some good insights but poorly supported)
  *   **Accuracy of Sources:** 15/30 (Major misrepresentation of Rousseau, partial/simplified use of Müller)
  *   **Quality of Prose:** 28/30 (Clear, concise, elegant, effectively structured)

  **Paragraph-by-Paragraph Comments for Jurors & Entrant:**

  1.  **"The constitutional state has an awkward relationship... cut through the machinery..."**
      *   **Work Done:** Effectively sets up the core tension and the populist critique. Clear statement of the problem.
      *   **Gestures/Issues:** None major here. It establishes the premise clearly.
      *   **Feedback:** A strong opening paragraph that clearly defines the contestable ground.

  2.  **"The constitutionalist who dismisses this... has to be produced."**
      *   **Work Done:** Correctly identifies the insufficiency of dismissing populism as mere demagoguery and introduces the crucial idea that the popular will is constructed ("produced").
      *   **Gestures/Issues:** None. This is a vital and well-stated insight central to the essay's potential.
      *   **Feedback:** Excellent pivot from the problem to the core philosophical response. The assertion that "the will of the people... has to be produced" is the essay's strongest foundational point.

  3.  **"Rousseau saw this earliest... exists prior to any counting."**
      *   **Work Done:** Attempts to ground the "production" idea in Rousseau.
      *   **Gestures/Issues:** **Major Inaccuracy: The definitions of "general will" (volonté générale) and "will of all" (volonté de tous) are REVERSED.**
          *   *What's Wrong:* Rousseau defines the "general will" (volonté générale) as the will directed towards the common good, the normative ideal. The "will of all" (volonté de tous) is the mere aggregate of private, individual wills – the simple sum.
          *   *Impact:* This error completely undermines the use of Rousseau. It misattributes the concept central to the essay's argument (the constructed will aimed at the common good) to the *wrong term*.
          *   *Stronger Treatment Needed:* To use Rousseau accurately here, the essay must explicitly state: Rousseau's "general will" (volonté générale) is the sovereign will *aimed at the common good*, which is distinct from and often obscured by the "will of all" (volonté de tous), which is the mere sum of individual private interests. An election or referendum attempts (imperfectly) to approach the general will, but it constructs it through the process; it doesn't discover a pre-existing sum. *This accurate framing supports the "production" thesis far better.*
      *   **Feedback:** This paragraph contains a critical misreading of Rousseau that significantly weakens the essay's philosophical foundation. Correctly distinguishing the "general will" (common good) from the "will of all" (aggregate private wills) is essential for using Rousseau to support the argument about the constructed nature of legitimate popular will.

  4.  **"A referendum, on this view... populist claim is empty."**
      *   **Work Done:** Applies the (flawed) Rousseau distinction to argue that referenda/elections construct, not discover, will, leading to the conclusion that the populist claim to access an unmediated will is "empty."
      *   **Gestures/Issues:** **Logical Gap:** While the conclusion about the emptiness of the "unmediated voice" is sound *based on the "production" thesis*, the step relying on Rousseau is flawed (as above). The jump from "constructed" to "empty" could be slightly more explicit but is acceptable.
      *   **Feedback:** The core conclusion of this section – that there is no unmediated will for the populist to channel – is philosophically sound and important. However, its derivation from Rousseau is invalidated by the previous error. The argument stands better on the general "production" thesis (para 2) than on the specific Rousseau citation here.

  5.  **"Jan-Werner Müller's What Is Populism?... a pathology imported from outside..."**
      *   **Work Done:** Introduces Müller's framework to explain populism as an inherent tension within democracy (pragmatic vs. redemptive), not an external pathology.
      *   **Gestures/Issues:** **Simplification/Conflation:** While capturing a key aspect of Müller, this slightly oversimplifies. Müller's "pragmatic" face is about managing conflict and achieving compromise within institutions. The "redemptive" face is democracy's promise of radical moral renewal and authentic self-rule. Populism exploits the gap, yes, but Müller's *core* definition (emphasized next) is more specific.
      *   **Feedback:** This is a generally useful application of Müller to contextualize populism within democracy's own promises. To strengthen it, explicitly link the "redemptive promise" more directly to the populist claim of embodying the pure, unmediated will of the people.

  6.  **"Müller adds that the populist's distinctive move... anti-pluralist at its core."**
      *   **Work Done:** Correctly identifies Müller's central defining feature of populism: the claim to *exclusively* and *morally* represent "the real people," inherently rejecting pluralism and the legitimacy of opposition.
      *   **Gestures/Issues:** None. This accurately captures Müller's core argument. It's the essay's strongest engagement with a source.
      *   **Feedback:** Excellent and precise summary of Müller's key contribution. This is crucial for understanding the anti-democratic thrust of populism.

  7.  **"If the people's will is always mediated... govern everyone once."**
      *   **Work Done:** Draws the conclusion that the solution is "better mediation" via institutions (courts, electoral systems, federalism) which enable pluralistic self-governance over time, preventing tyranny of the majority.
      *   **Gestures/Issues:** **Assertion/Underdevelopment:** This is a vital point (and arguably the essay's most important normative claim), but it's asserted rather than argued. *Why* are these institutions "better mediation"? How do they specifically facilitate the "production" of a legitimate will over time? The connection to the earlier "production" thesis and pluralism needs elaboration. The "snapshot majority" point is good but needs more grounding.
      *   **Feedback:** This is the heart of the constitutionalist response. A stronger essay would explicitly link these mediating institutions back to the *need to construct a legitimate will* (overcoming pure aggregation) and to Müller's point about pluralism. Explain *how* staggered terms or federalism, for example, contribute to better "producing" a general will or managing pluralism across time, rather than just preventing snapshots. Connect it to the "better production" idea.

  8.  **"Opinion polls, being snapshots... he is wrong only about the vehicle."**
      *   **Work Done:** Effectively contrasts weak mediation (polls) with strong mediation (institutions), reinforcing the argument. Offers a conciliatory but critical final judgment on populism (right about representation, wrong about the vehicle).
      *   **Gestures/Issues:** **Conflation:** The distinction between polls and institutions is clear. However, the final sentence risks conflating two types of "representation": 1) Representation *as* mediation/construction of the popular will (the essay's core argument), and 2) Political representation by parties/leaders. The populist claims *both* unmediated access *and* exclusive political representation. The essay's "vehicle" refers to the latter, but the argument is primarily about the former. Needs tighter connection.
      *   **Feedback:** A strong closing point about polls vs. institutions. The final sentence effectively encapsulates the core rebuttal but could be slightly sharpened to emphasize that the populist misunderstands the *nature* of the will being represented (constructed vs. discovered) as much as the vehicle for its political expression. The "vehicle" critique primarily addresses the *exclusivity* claim (Müller).

  **Overall Summary for Defense at Meeting:**

  *   **Strengths (Prose & Core Insight):** The essay is exceptionally well-written: clear, concise, elegant, and logically structured. It identifies and revolves around a profound and correct core insight: the popular will is *constructed* or *produced* through political processes, not discovered. Its use of Müller's anti-pluralism point is accurate and effective. The conclusion about "better mediation" is perceptive and directionally correct.
  *   **Critical Weaknesses (Argument & Sources):** The fatal flaw is the **major misreading of Rousseau**, reversing the key concepts of "general will" and "will of all." This undermines a significant pillar of the essay's argument. The application of Müller's pragmatic/redemptive distinction is acceptable but slightly simplified. Crucially, the essay's most important positive argument – that constitutional institutions represent "better mediation" – is **asserted rather than rigorously developed or connected** back to the "production" thesis or pluralism. It needs to explain *how* these mechanisms construct a more legitimate will over time.
  *   **Mark Justification (65/100):** The high prose score (28/30) reflects its clarity and elegance. The argument score (22/40) is middling due to the core Rousseau error and the underdeveloped defense of "better mediation," despite the strong central insight. The source accuracy score (15/30) is pulled down significantly by the major Rousseau error, though the Müller use is mostly sound. The essay shows intellectual ambition and grasps the complexity but falters on precise philosophical grounding and argumentative depth where it matters most. 65 represents a good but fundamentally flawed entry that understands the *question* deeply but stumbles in key philosophical executions.
