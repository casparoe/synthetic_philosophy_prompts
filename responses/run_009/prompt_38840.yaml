prompt: |-
  I'm a software engineer with no philosophy background, but I got interested in structural realism after reading about how scientific theories get replaced. The way I think about it: when we do a big schema migration at work, the rows survive, the schema sometimes doesn't, and the API contract is what we actually promise customers. From what I gather the structural realists are saying something similar — its the API that's real, the entities are implementation details. But I honestly can't tell where the actual dividing lines are between the different positions. The SEP article I skimmed just lists names (epistemic this, ontic that) without telling me what question each one turns on, and I don't want to pick a label off the shelf — I want to know what I believe first.

  So: write me a decision tree that sorts someone into a position on scientific realism. Build it from questions a person could answer without knowing any of the position names — things like what happened to the ether when its equations survived into Maxwell, or whether a theory being replaced (Newton → relativity) was ever *true* in any sense or just useful. Each branch should be a claim someone can straightforwardly agree or disagree with. Leaves I want covered: plain scientific realism, entity realism, epistemic structural realism, ontic structural realism, constructive empiricism, and old-school instrumentalism. If some combination of answers has no occupants, mark it as unoccupied and say why you think that is — incoherent, unattractive, or just never explored. And flag any pair of leaves the tree can't actually separate.

  One more thing: if you think my migration analogy is doing damage rather than clarifying — e.g., if calling entities "implementation details" already smuggles in the answer before the tree even starts — say so plainly instead of building me a tidy diagram on a bad foundation. I'd rather be corrected than flattered.
