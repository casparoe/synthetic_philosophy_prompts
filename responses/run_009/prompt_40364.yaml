prompt: |-
  hi, so i'm part of a small metaphysics reading group (five of us, meeting in a pub backroom, very informal) and we just did our last-but-one session on the identity of indiscernibles, ending with Black's two spheres — the universe that contains nothing but two qualitatively identical iron spheres, two miles apart, in otherwise empty space. the discussion got surprisingly heated. one guy insisted that since a rotation of the entire universe maps each sphere exactly onto the other with nothing changing whatsoever, there's a real sense in which there is only one sphere being counted twice. someone else countered that that's crazy, because the spheres stand in the two-mile distance relation to each other, and nothing stands two miles from itself, so they ARE discernible after all, just not by any monadic property — discerned by a relation instead. a third person said the whole debate shows the principle was never about qualitative vocabulary anyway. we ran out of time and honestly the non-resolution was the best part.

  for the final session i want to close by reading out a poem that captures where we ended up. i'm thinking villanelle, because the form has two refrain lines that keep returning across the poem but never actually meet — which is literally the situation of the spheres. and here's the twist i'd like you to build in: make the second refrain the mirror image of the first, word order reversed (A-B-C / C-B-A, chiasmus style, but as strict as you can make it while staying graceful). that way the poem itself poses the question — are those two refrain lines two lines, or one line happening twice? a metaphysician in the room should be able to see the form doing the philosophy (the symmetry, the rotation-that-changes-nothing, the swap argument) while someone who's never heard of Leibniz should still get a genuine poem about two things that are exactly alike, and whether that makes them one thing. don't resolve it — but do let the final couplet put the two refrains side by side, which is the one configuration the actual universe never allows (the spheres are always two miles apart), and let that mean something without spelling it out.

  you're a poet with a philosophy PhD, so please think carefully before writing: brainstorm the refrain pair first, since the whole poem hangs on it, and check that the reversed line actually scans and reads naturally. keep it readable aloud in a pub — no private jargon, no latin. around 19 lines as the form requires. thanks!
