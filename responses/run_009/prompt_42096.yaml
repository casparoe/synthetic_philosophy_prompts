prompt: |-
  I'm a PhD candidate in international criminal law, and a dissertation chapter on the special-intent doctrine in genocide law has drifted, to my supervisor's quiet despair, into the philosophy of action. The object I keep staring at is this: under the 1948 Genocide Convention, killing, causing serious harm, inflicting destructive conditions of life, preventing births, and forcibly transferring children count as genocide only when done with the intent to destroy, in whole or in part, a national, ethnical, racial, or religious group, as such. The courts have read that as requiring a specific, aim-like mental state — destruction must be the purpose, not a foreseeable or even practically certain side effect. So in the Krstić litigation at the ICTY, the expulsion of a population under conditions that everyone knew would kill many of them was not enough: without the destructive aim, it was ethnic cleansing, not genocide. Meanwhile the ICJ, in its 2007 Bosnia judgment, extended the same mental-state requirement to the state itself, held that a finding of state responsibility for genocide requires proof of intent at a standard more exacting than the ordinary criminal one, and insisted the inference to intent be the only reasonable one available. On top of that sits the substantial-part doctrine: the men of one region have been accepted as a substantial part of a people, and some of the reasoning treats the destruction of a group's leadership class as likewise destroying a substantial part — a parthood relation that is partly numerical but, in the leadership case, clearly functional.

  Here is what puzzles me. The doctrine demands an individual-style mental state, but attributes it through collective evidence — speeches, patterns of conduct, coordination — to entities that do not have minds, and it does so while a single offense's definition makes the perpetrator's motive (targeting the group as such) constitutionally relevant, even though domestic criminal law almost never punishes motive as such. Lemkin's own conception of genocide, as I understand it, was of a synchronized process of destruction carried out through many techniques at once — political, economic, cultural, biological, moral — which sits oddly under a doctrine that turns on locating one aim in some mind or other. And the practice seems to treat the finding of genocide as uniquely staining in a way that findings of crimes against humanity are not, even when the body count is the same. My supervisor, an orthodox legal positivist, tells me the doctrine is just a rule, that rules need no metaphysics, and that I should get back to the elements; I suspect that the rule only looks coherent because a philosophy of collective agency is quietly doing the work underneath it.

  So this is what I want from you, since you can't get the case law and I don't need a survey of it: reconstruct the implicit theory or theories the doctrine presupposes. What account of collective intentionality would make sense of attributing a destructive purpose to a state through pattern evidence while insisting on an individual-style aim? Is that attribution a legal fiction, and if so, what work is the fiction doing? Does the substantial-part element presuppose an account of what social groups are such that they can be destroyed in part — and does the leadership reading commit the law to a functional rather than numerical conception of parthood? Where is the doctrine underdetermined, such that several rival theories of the wrong (harm to the group as an entity, a wrong to humanity as such, an expressive harm in the naming) would each license the same rules? And finally: if the aim-based model were replaced by a structural, process-based model of genocide — identified by coordinated patterns of destruction rather than by anyone's purpose — tell me what would have to change, in the elements, in the elevated standard of proof, in the line between genocide and crimes against humanity, and in what the naming of an atrocity as genocide is then taken to do. If some parts of the practice would not need to change at all, I would like to know which, and why.
reasoning: |-
  Okay, let me unpack this fascinating query. The user is a PhD candidate in international criminal law wrestling with the philosophical underpinnings of genocide doctrine, specifically the tension between individual intent requirements and collective attribution. Their supervisor wants strict legal analysis, but they sense deeper philosophical currents at play.

  First, I need to grasp the core puzzle: how can legal doctrine demand an "individual-style mental state" (purpose) for genocide while attributing it to collective entities like states through patterns of evidence? This immediately raises questions about collective intentionality theories - perhaps Searle's collective intentionality or List & Pettit's group agency could explain this. The user mentions Krstić and ICJ Bosnia cases showing how even knowingly lethal ethnic cleansing doesn't qualify without destructive purpose.

  The substantial-part doctrine adds another layer. When courts accept destroying leadership as destroying a "substantial part" of a group, this seems functional rather than numerical. That suggests genocide law presupposes groups as structured entities where eliminating key functions constitutes destruction. The user's reference to Lemkin's holistic view of genocide as synchronized multi-dimensional destruction contrasts sharply with the current purpose-focused model.

  I notice the user implies genocide carries unique stigma compared to crimes against humanity. This expressive dimension matters - calling something genocide does more than describe; it condemns in a particular way. Their positivist supervisor dismisses this as irrelevant metaphysics, but the user rightly suspects collective agency theories are doing invisible work.

  For the reconstruction, I consider examining:
  - How Bratman's shared cooperative activity might explain collective intent attribution
  - Whether the state intent standard is a legal fiction bridging individual and collective responsibility
  - If the functional parthood view commits genocide law to a particular ontology of social groups

  The alternative process-based model proposal is crucial. If we defined genocide by coordinated destruction patterns rather than purpose, how would elements change? The dolus specialis requirement would collapse, possibly merging genocide with certain crimes against humanity. But the stigma might remain if we preserve the "group destruction" element as the core wrong.

  What remains unchanged? The protected groups list, the underlying acts, and likely the gravity perception. The user seems to seek validation that their philosophical digression isn't academic self-indulgence but necessary to expose doctrinal tensions. I should acknowledge how their supervisor's positivism misses how legal rules always rest on unstated philosophical premises - especially when dealing with collective entities and mental states.
answer: |-
  Your query cuts to the ontological and conceptual foundations of genocide law. The doctrine's coherence indeed rests on unarticulated philosophical commitments. Let's reconstruct the implicit theories:

  ### 1. **Collective Intentionality & Attribution**
     - **Presupposed Theory:** A hybrid of *methodological individualism* and *moderate functionalism*. Courts implicitly adopt Searle's *collective intentionality* ("we-intentions") combined with Pettit/List's *group agency*:
       - Individual actors (leaders, soldiers) form shared intentions through coordinated plans (speeches, orders, systematic patterns).
       - These intentions are attributed to the *organization* (state, militia) when:  
         (a) The collective acts as a *unified decision-making system* (ICJ's "state machinery" requirement);  
         (b) The destructive aim is *functionally essential* to the collective action (Krstić's exclusion of "incidental" destruction).
     - **Legal Fiction?** Yes, but a *constitutive* one. Attributing intent to a state transforms collective evidence into an agential narrative. This fiction serves two functions:  
       (a) *Epistemic*: It justifies inferring intent from macro-patterns when micro-evidence is destroyed;  
       (b) *Normative*: It marks genocide as a *collective project* requiring moral condemnation beyond individual culpability.

  ### 2. **The "Substantial Part" Doctrine**
     - **Group Ontology:** Genocide law presupposes groups as *structured entities*, not mere aggregates. This explains the leadership-class rulings:
       - *Functional parthood*: Destroying leadership severs the group's *organizing principle* (its capacity for cultural/political self-perpetuation), even if numerically small.  
       - *Numerical threshold*: When targeting non-leaders, the part must be significant enough to threaten the *group's viability* (e.g., reproductive cohort in Srebrenica).
     - **Implied Wrong:** The harm isn't just aggregate killing, but *dismantling the group's social architecture*. This aligns with Lemkin's view of genocide as "disintegration of political/social institutions".

  ### 3. **Motive & the "As Such" Requirement**
     - **Why Motive Matters Here:** Domestic law excludes motive because crimes are defined *act-relative*. Genocide is *group-relative*:  
       - The *wrong* inheres in attacking the *group's existence*. Motive (targeting "as such") is thus constitutive, not incidental.  
       - This presupposes a *relational theory of harm*: Destroying a group injures not just members, but *humanity's pluralistic structure* (see ICJ's *erga omnes* framing).

  ### 4. **Underdetermination & Rival Theories of the Wrong**
     The doctrine is compatible with multiple justifications:
     - **Entity Harm View:** Groups are moral patients; destroying them is a primary wrong (Lemkin).  
     - **Humanity Wrong View:** Genocide violates duties owed to humanity as a whole (ICJ's *Bosnia* emphasis).  
     - **Expressive Harm View:** The act *symbolically negates* a group's right to exist (explains unique stigma).  
     *The rules function identically under all three*, allowing courts rhetorical flexibility while maintaining doctrinal stability.

  ### 5. **Shifting to a Process-Based Model: Consequences**
     If genocide required *coordinated patterns of destruction* rather than *purpose*:
     - **Elements Changed:**  
       - *Actus reus*: Expands to include cultural/economic destruction (Lemkin's vision).  
       - *Mens rea*: Replaced by *knowledge* that actions contribute to systemic group destruction (downgrading *dolus specialis*).  
       - *State Responsibility*: Easier to prove—systematic patterns alone suffice.
     - **Proof Standards:**  
       - ICJ's "only reasonable inference" rule collapses. Probability-based inferences suffice.  
       - Distinction from **crimes against humanity (CAH)** blurs: Genocide becomes a *subset* of CAH targeting groups, differing only in *scale of destruction*.
     - **Stigma & Naming:**  
       - The term "genocide" loses its *expressive power* as the "crime of crimes." Condemnation shifts to *outcome severity* rather than *intentional horror*.  
       - *What remains*: The protected-group criterion and the threshold of "substantial part" destruction.

  ### 6. **What Wouldn't Change**
     - **Substantial-Part Doctrine:** Functional parthood (leadership targeting) remains relevant as evidence of systemic attack.  
     - **Collective Evidence:** Patterns of conduct/speeches still prove the *coordinated* nature of destruction.  
     - **Group-Based Harm Focus:** The core wrong—annihilating groups—stays central, even under a structural model.

  ### Conclusion
  The doctrine's stability relies on an unstated *institutional theory of group agency*: States/organizations are treated as *goal-directed systems* whose "intent" is imputed from functional roles and coordinated outputs. This legal fiction bridges individual psychology and collective action, permitting condemnation of macro-crimes while satisfying liberal concerns about culpability. 

  Your positivist supervisor is half-right—the rule *functions* without metaphysics—but its *intelligibility* depends on theories of collective action. A process-based model would democratize proof but dilute genocide's symbolic gravity. The current doctrine's tension—individual intent attributed collectively—may be philosophically messy but legally productive: It preserves genocide's exceptional moral status while enabling prosecutions. 

  *Recommended reading:*  
  - Searle on collective intentionality  
  - Pettit & List *Group Agency*  
  - David Luban "Calling Genocide by its Right Name"  
  - Margaret Gilbert on plural subjects
