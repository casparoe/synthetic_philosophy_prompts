  ### Thought Experiment: The Research Partnership Dilemma

  **Scenario:**  
  Two renowned scientists, Alice and Bob, are collaborating on a high-stakes research project. The project unfolds in discrete phases, each requiring a decision to either "publish" (ending the project and claiming credit) or "continue" (investing more effort to increase the project's value). They alternate decisions, with Alice moving first. The project can last up to four phases, but external constraints ensure it cannot proceed beyond Phase 4. 

  **Payoff Structure (in "credit units" – e.g., career advancement, funding, prestige):**  
  - **Phase 1 (Alice):**  
    - If Alice publishes: Alice gets 3 units, Bob gets 1 unit.  
    - If Alice continues: The project advances, and Bob decides at Phase 2.  
  - **Phase 2 (Bob):**  
    - If Bob publishes: Bob gets 5 units, Alice gets 2 units.  
    - If Bob continues: Alice decides at Phase 3.  
  - **Phase 3 (Alice):**  
    - If Alice publishes: Alice gets 9 units, Bob gets 1 unit.  
    - If Alice continues: Bob decides at Phase 4.  
  - **Phase 4 (Bob):**  
    - If Bob publishes: Bob gets 15 units, Alice gets 2 units.  
    - If Bob continues: The project concludes automatically, and both get 10 units (e.g., due to a pre-set institutional review).  

  **Key Uncertainty:**  
  Alice believes Bob is rational and self-interested with high probability (95%), but there's a 5% chance he is a "completionist" – a type who always continues, regardless of payoffs, due to an obsessive commitment to seeing the project finished. Bob knows his own type, but Alice only knows the prior probability (5% completionist, 95% rational). Crucially, the "completionist" trait is irrational (it ignores payoffs), but this is not assumed of Bob – it is merely a possibility Alice entertains due to past ambiguous behavior. Players care only about their own credit; no altruism, reputation, or future interactions exist.

  ---

  ### Walkthrough: Rationality, Backward Induction, and the Paradox

  **1. Standard Backward Induction (Under Common Knowledge of Rationality):**  
  If both players are known to be rational and self-interested (CKR), backward induction predicts immediate publication by Alice:  
  - **Phase 4:** Rational Bob would publish (getting 15 > 10 from continuing).  
  - **Phase 3:** Knowing Bob would publish at Phase 4 (leaving her with 2 units), Alice would publish (getting 9 > 2).  
  - **Phase 2:** Knowing Alice would publish at Phase 3 (leaving him with 1 unit), Bob would publish (getting 5 > 1).  
  - **Phase 1:** Knowing Bob would publish at Phase 2 (leaving her with 2 units), Alice would publish (getting 3 > 2).  
  *Verdict:* Alice publishes at Phase 1. Phase 3 should never be reached.

  **2. Why Alice Rationally Continues at Phase 1 in This Scenario:**  
  Alice calculates her expected payoff from continuing at Phase 1:  
  - **Case 1 (95% probability): Bob is rational.**  
    - Bob publishes at Phase 2 (as per BI), giving Alice 2 units.  
  - **Case 2 (5% probability): Bob is a completionist.**  
    - Bob continues at Phase 2 (irrespective of payoffs).  
    - At **Phase 3**, Alice observes Bob’s continue. Since only a completionist would continue at Phase 2 (rational Bob would publish), Alice *updates her belief*: Bob is certainly a completionist.  
    - Now at Phase 3: Alice can publish (getting 9 units) or continue. If she continues, Bob (completionist) will continue at Phase 4, triggering automatic conclusion (10 units for Alice). Since 10 > 9, Alice continues.  
    - Outcome: Alice gets 10 units.  

  **Expected payoff for continuing at Phase 1:**  
  (0.95 × 2) + (0.05 × 10) = 1.9 + 0.5 = **2.4 units**.  
  **Payoff for publishing at Phase 1:** 3 units.  
  2.4 < 3, so Alice *should* publish? Not quite. The calculation above misses that Alice’s action at Phase 3 depends on updated beliefs. But with a 5% prior, 2.4 < 3, so publishing still seems better.  

  **Adjusting for Rational Play at Phase 2:**  
  A rational Bob at Phase 2 anticipates Alice’s reasoning at Phase 3. If he continues:  
  - Alice infers Bob *must* be a completionist (since rational Bob wouldn’t continue).  
  - Alice then continues at Phase 3 (as 10 > 9), and Bob gets only 10 units at the end (if completionist) or 1 unit (if rational, since Alice publishes at Phase 3).  
  But rational Bob would never continue at Phase 2: if he continues, Alice’s belief update makes her continue to Phase 4, but Bob gets 10 only if he’s a completionist. If rational, he gets 1 unit (from Alice publishing at Phase 3), which is worse than publishing at Phase 2 (5 units). So rational Bob *always* publishes at Phase 2.  

  Thus, Alice’s expected payoff for continuing at Phase 1 is:  
  (0.95 × 2) + (0.05 × 10) = **2.4 units** (as before).  
  Since 2.4 < 3, Alice should publish.  

  **The Critical Threshold:**  
  Alice passes (continues) only if:  
  (Probability Bob is completionist) × 10 + (Probability Bob is rational) × 2 > 3.  
  Let \( p \) = P(Bob is completionist). Then:  
  \( 10p + 2(1-p) > 3 \) → \( 10p + 2 - 2p > 3 \) → \( 8p > 1 \) → \( p > 1/8 \) (12.5%).  
  With \( p = 5\% < 12.5\% \), Alice publishes.  

  **Modify the Payoffs to Meet the Threshold:**  
  Adjust Phase 4 automatic conclusion to **20 units for Alice** (Bob still gets 10). Now:  
  - If Bob is completionist and Alice reaches Phase 3, she continues (20 > 9).  
  Alice’s expected payoff for continuing at Phase 1:  
  (0.95 × 2) + (0.05 × 20) = 1.9 + 1.0 = **2.9 units**.  
  Publishing gives 3 units.  
  2.9 < 3, still not enough.  

  Set \( p = 15\% \):  
  (0.85 × 2) + (0.15 × 20) = 1.7 + 3.0 = **4.7 > 3**. Now Alice continues.  

  **Revised Scenario:**  
  Alice believes Bob has a 15% chance of being a completionist (e.g., based on his reputation for obsessive project completion). Payoffs at Phase 4 automatic conclusion: Alice 20, Bob 10.  

  **Alice’s Decision at Phase 1:**  
  Expected payoff from continuing: \( (0.85 \times 2) + (0.15 \times 20) = 1.7 + 3.0 = 4.7 > 3 \).  
  **Rational choice:** Alice continues.  

  **3. Why This Pass is Rational:**  
  - Alice is purely self-interested: She continues only because the 15% chance of Bob being a completionist (and her subsequent ability to exploit this at Phase 3) outweighs the 85% chance of a suboptimal outcome (2 units).  
  - **What a pass reveals:** By continuing at Phase 1, Alice gains information. If Bob continues at Phase 2, she learns he is a completionist and can confidently continue to Phase 4, securing 20 units.  
  - **No CKR:** Alice doubts Bob’s rationality (not his existence), but this doubt is generated internally via Bayesian updating.  

  **4. The Unreached Node (Phase 3) and Rational Play There:**  
  - Backward induction (under CKR) says Phase 3 is unreachable. But if reached, Alice must decide. In this case, reaching Phase 3 means Bob continued at Phase 2, which *reveals he is a completionist* (rational Bob would have published).  
  - Alice’s choice: Publish (9 units) or continue (20 units). 20 > 9, so she continues.  
  - **Why this matters:** The paradox hinges on whether rationality mandates specific play at unreached nodes. Here, Alice’s play at Phase 3 is rational *given updated beliefs*, not hypothetical CKR.  

  **5. The Single Feature Doing the Work:**  
  **Incomplete information about player types** (specifically, uncertainty about Bob’s rationality). This:  
  - Breaks common knowledge of rationality (CKR).  
  - Allows Bayesian updating (a pass reveals type).  
  - Generates rational cooperation without external factors.  
  *Not payoff uncertainty*: Payoffs are known; uncertainty is about behavioral type.  

