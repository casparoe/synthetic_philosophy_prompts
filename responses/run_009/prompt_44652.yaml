  First, the core problem needs precise formulation. The selection effect arises because tractability influences how many resources a cause attracts. If a cause is tractable, it gets more attention, making it less neglected. But if it's intractable, it remains neglected. So using ITN might systematically favor causes that are neglected for bad reasons—because they're hard to solve. 

  For the reference class issue, neglectedness depends on which actors we count. If only altruists with similar values are considered, a cause might seem neglected even if governments are working on it. But if opposing groups are both active, their efforts might cancel out, leading to zero progress despite high activity.

  The research question could be: "Does the ITN framework's multiplicative model systematically misrank causes due to selection effects and reference class ambiguities?" This is specific enough to test with a model.

  The independence assumption in ITN is crucial because multiplying the factors assumes they don't affect each other. If neglectedness depends on tractability, then multiplying them double-counts tractability, underweighting causes that are both tractable and attended to. The framework breaks by favoring intractable causes that appear neglected.

  To formalize this, a toy model makes sense. For the selection effect, model tractability as a hidden variable. Causes have true tractability (T) and importance (I). The observed neglectedness (N) depends on T because more tractable causes attract resources. The model can show that ITN scores are biased, ranking high-importance but intractable causes higher than they should be.

  For the reference class, define two types: value-aligned actors and neutral/opposing ones. The model can show how including only value-aligned actors affects neglectedness scores, and how opposing efforts can cancel out, making N misleading.

  The user should also consider practical implications. For example, how might EA adjust the framework? Weighting factors differently or adjusting N based on actor types. But the paper's main contribution is diagnosing the problem, not solving it entirely.

