answer: |-
  Here’s a structured research proposal addressing your concerns, designed for a 10-week term paper. The core idea is to formalize the selection effect and reference-class dependency to show how they violate ITN’s independence assumption and systematically distort cause prioritization.

  ---

  ### **Research Question**  
  *Does the ITN framework’s multiplicative model systematically misrank causes due to (a) endogenous neglectedness (a selection effect from tractability) and (b) reference-class ambiguity in defining "neglectedness"?*

  ### **Core Problem Statement**  
  The ITN framework assumes **independence**: Tractability (T), Importance (I), and Neglectedness (N) are orthogonal inputs whose product (I×T×N) approximates marginal impact. Your hypothesis challenges this:  
  1. **Neglectedness is endogenous to tractability**: Low T causes high N (because actors avoid intractable problems), creating *inverse correlation* between T and N.  
  2. **Neglectedness is reference-class-dependent**: N depends on which actors are counted (e.g., altruists vs. all actors) and whether their efforts are additive or canceling.  

  **Why independence matters**:  
  - Multiplicative scoring *requires* independence to avoid double-counting factors. If N = f(T), then I×T×N effectively becomes I×T×f(T), overweighting T and underweighting truly high-N causes.  
  - If neglectedness stems from low tractability ("bad neglect"), ITN *systematically favors intractable causes* over equally important but tractable-yet-attended ones.  

  ---

  ### **Formalizing the Critique**  
  #### **1. Toy Model 1: Selection Effect (Tractability → Neglectedness)**  
  - **Setup**:  
    - Causes have fixed, unknown "true tractability" (T ∈ [0,1]) and importance (I ∈ [0,1]).  
    - Neglectedness (N) is *determined by* T: Resources flow to high-T causes, so N = k(1 - T) + ε (ε = noise).  
    - Actors observe a *signal* of T (e.g., past success rate) and allocate resources if signal > threshold θ.  
  - **ITN Score**: S = I × T × N ≈ I × T × (1 - T)  
  - **Bias Test**:  
    - Compare ranking of two causes:  
      - Cause A: High I, Medium T → Moderate N (attended due to T)  
      - Cause B: High I, Low T → High N (neglected due to T)  
    - **Result**: S(B) > S(A) even if A’s *actual marginal impact per resource* is higher (because B’s neglect is an artifact of low T).  
    - **Key Insight**: ITN misinterprets "neglect from intractability" as "opportunity for impact."  

  #### **2. Toy Model 2: Reference-Class Dependency**  
  - **Setup**:  
    - Define two reference classes for "effort":  
      - R₁: All actors (governments, markets, altruists).  
      - R₂: Only value-aligned altruists (e.g., EA).  
    - Effort efficacy: Actors may have opposing goals (e.g., lobbyists on climate policy).  
  - **Neglectedness Metrics**:  
    - N₁ = 1 − (Total effort from R₁) → "Classical" neglect  
    - N₂ = 1 − (Value-adjusted effort from R₂) → "EA-relevant" neglect  
  - **ITN Scores**: S₁ = I×T×N₁ vs. S₂ = I×T×N₂  
  - **Bias Test**:  
    - Cause C (e.g., AI safety): High effort from R₁ (tech firms), low from R₂ → N₁ low, N₂ high.  
    - Cause D (e.g., malaria nets): High effort from R₂, medium from R₁ → N₁ medium, N₂ low.  
    - **Result**: S₂ ranks C > D, S₁ ranks D > C. Effort canceling (e.g., rival lobbyists) further distorts N by overstating "work done."  

  ---

  ### **What Breaks When Independence Fails?**  
  1. **Systematic misranking**: ITN prioritizes causes neglected *due to low tractability* (Type I error) and deprioritizes attended-but-tractable causes (Type II error).  
  2. **Perverse incentives**: Encourages investing in "graveyards" of abandoned, intractable problems.  
  3. **Value misalignment**: Using N₁ (all actors) ignores whether effort aligns with altruistic goals; using N₂ (only EA) overstates tractability by excluding broader context.  

  ---

  ### **Your Approach: Formalizing the Critique**  
  - **Step 1**: Define decision-theoretic foundations.  
    - ITN aims to estimate *expected marginal impact per resource*: E[ΔImpact|$].  
    - Show that E[ΔImpact|$] ≠ I×T×N if N correlates with T or depends on reference class.  
  - **Step 2**: Build analytical models (as above) to prove distortion:  
    - Model 1: Selection effect → Show S = I×T×(1−T) peaks at T=0.5, penalizing very high/low T.  
    - Model 2: Reference class → Show S₂ − S₁ correlates with effort misalignment.  
  - **Step 3**: Qualitative examples (e.g., climate change vs. rare diseases) illustrating both distortions.  

  ---

  ### **What Would Count as Failure?**  
  1. **No evidence of correlation**: If empirical data shows T and N are uncorrelated in real-world cause areas (unlikely, but testable with proxies).  
  2. **Triviality**: If the distortions are small or correctable via simple adjustments (e.g., "use N₂, not N₁").  
  3. **Overreach**: Claiming ITN is "useless" rather than "flawed without corrections."  

  **Success Looks Like**: Demonstrating that the independence assumption is *necessarily violated* in non-trivial cases, leading to quantifiable misranking.  

  ---

  ### **Realistic Scope for 10 Weeks**  
  - **Weeks 1–2**: Literature review (ITN foundations, critiques in moral uncertainty/EA).  
  - **Weeks 3–4**: Develop formal models (selection effect + reference class).  
  - **Weeks 5–6**: Apply models to 2–3 case studies (e.g., AI governance, animal welfare, pandemic preparedness).  
  - **Weeks 7–8**: Discuss mitigations (e.g., "discount N by estimated T-correlation," "define reference class explicitly").  
  - **Weeks 9–10**: Write paper + address failure modes.  

  **Output**: A decision-theoretic argument showing ITN’s multiplicative structure is fragile under realistic conditions, with implications for cause prioritization in moral uncertainty.  

  ---  
  This proposal stays focused on diagnosing the problem (not solving it), uses accessible formalism, and delivers a clear answer: **ITN’s multiplicative scoring fails when neglectedness is endogenous or reference-class-dependent, leading to systematic bias toward intractable causes and value-misaligned effort.**
