prompt: |-
  hey, I need a consistency check on my views before I embarrass myself at our department retreat next month. I'm a PhD student in development economics, and I've been deep in the effective-altruism cause-prioritization world for a few years now — I help run our program's giving circle, and somehow I keep ending up as the person defending the framework, so I'd like to know if my own version of it actually hangs together first.

  Here's roughly where I stand, in order of how confident I am:

  1. The importance / tractability / neglectedness framework is basically right. If you want to compare causes, you should be asking how big the problem is, how solvable it is, and how much attention/money it's already getting. I'd defend this over the alternatives I've seen people propose.

  2. Neglectedness isn't a property of a cause, it's a property of the current landscape — who's funding what, who's working on what, right now. So ITN scores go stale, and any ranking more than a few years old is suspect until you re-run it.

  3. AI safety is the top cause on the framework: huge scale once you count the far future, genuinely neglected, and at least somewhat tractable. I've argued this at the giving circle.

  4. I'm really suspicous of arguments that multiply a tiny probability by an astronomical payoff. That's why I roll my eyes at people who arrive at climate change as a top cause via tail-risk stories, and honestly it's part of why my own donations go to malaria nets — I want robust evidence and small error bars, not expected value arithmetic on speculative numbers.

  5. I think global health counts as neglected, even though health is one of the biggest spending categories on earth.

  6. Personal fit can move you a full tier down the cause rankings. I told a friend with a hospital logistics background to take the pandemic-preparedness job she's excited about rather than retooling for AI policy, and I'd say the same to most people.

  7. And I think the framework should be agent-neutral: run the numbers and you get the same ranking no matter whose career is on the line. If the answer changes depending on who's asking, something's gone wrong.

  Individually these all seem fine to me, but I've been staring at them too long to tell anymore. Please act as a senior researcher at a cause-prioritization org — someone who's seen every version of these fights and has no stake in my conclusions. Start by brainstorming and outlining the possible tension pairs before you commit to anything, then go through them and tell me which are genuinely in tension, which only look like it, and rank them by severity instead of treating them all as equally bad. For each real one, say what has to give and what the cheapest fix costs me. I genuinely don't know where the problem is, so don't soft-pedal it — if the position I argued for at the giving circle is the one that has to go, tell me that straight.
reasoning: |-
  Hmm, the user is a PhD student in development economics who's deeply involved in effective altruism (EA) and cause prioritization. They run a giving circle and often defend the EA framework, but they're worried their views might have internal inconsistencies. They want me to act as a senior researcher to identify tensions in their stated positions before a department retreat.

  Looking at their seven points:
  1. They strongly support the ITN framework (Importance, Tractability, Neglectedness)
  2. They see neglectedness as dynamic and context-dependent
  3. They rank AI safety as the top cause
  4. They're skeptical of tail-risk calculations (especially regarding climate change)
  5. They believe global health is still neglected despite high spending
  6. They value personal fit enough to justify cause-switching
  7. They insist on agent-neutrality in cause rankings

  I need to identify tensions between these positions. The most glaring one is between their skepticism of tail-risk calculations (#4) and their support for AI safety (#3), which heavily relies on similar long-term speculative reasoning. There's also tension between their agent-neutral stance (#7) and their allowance for personal fit (#6), since the latter introduces agent-relative considerations.

  The global health claim (#5) seems defensible if we look at specific interventions rather than the entire health sector. The dynamic neglectedness view (#2) actually strengthens the ITN framework (#1) rather than contradicting it.

  The biggest problem is clearly the AI safety position clashing with their skepticism of speculative tail-risk arguments. For coherence, they'd either need to drop their AI safety ranking or soften their stance against tail-risk calculations. The personal fit vs. agent-neutrality tension is also significant but more manageable - they could frame personal fit as affecting tractability at the individual level rather than changing the cause's fundamental ranking.

  I'll structure my response to first outline all possible tension pairs, then analyze the real conflicts starting with the most severe, and suggest minimal adjustments for each. The user clearly values intellectual rigor and wants direct criticism, so I won't hold back on pointing out where their positions conflict, especially since they might be publicly advocating for AI safety while privately doubting its methodological foundations.
answer: |-
  Okay, PhD student. Buckle up. I've chaired more cause-prioritization working groups and seen more frameworks implode under scrutiny than I care to count. Your positions are common individually, but the friction points *between* them are where the real risk of embarrassment lies at a retreat full of critical thinkers. Let's dissect this like we would a flawed reg discontinuity design.

  **Brainstormed Tension Pairs:**

  1.  **AI Safety Top Cause (#3) vs. Skepticism of Tiny Probabilities * Astronomical Payoffs (#4)**
  2.  **AI Safety Top Cause (#3) vs. Neglectedness as Dynamic/Landscape-Dependent (#2)**
  3.  **Global Health as Neglected (#5) vs. Neglectedness as Dynamic/Landscape-Dependent (#2)**
  4.  **Personal Fit Moves Tier (#6) vs. Agent-Neutrality (#7)**
  5.  **AI Safety Top Cause (#3) vs. Desire for Robust Evidence/Small Error Bars (#4)**
  6.  **Global Health as Neglected (#5) vs. Health Being a "Biggest Spending Category" (Implied Conflict)**
  7.  **ITN Basically Right (#1) vs. Neglectedness Not Inherent (#2)**
  8.  **Agent-Neutrality (#7) vs. Personal Fit (#6) & Dynamic Neglectedness (#2) requiring context**

  **Analysis & Ranking by Severity (High to Low):**

  1.  **Tension:** **AI Safety (#3) vs. Skepticism of Tiny Probabilities * Astronomical Payoffs (#4)** (Severity: **Critical**)
      *   **The Rub:** AI Safety as a top cause *fundamentally relies* on the exact calculation you reject for climate tail risks. The "huge scale" comes almost entirely from the far future, which requires multiplying:
          *   A non-trivial probability of existential catastrophe (highly contested, model-dependent, often tiny in absolute terms for specific scenarios/timelines).
          *   By an astronomical potential payoff (value of all future generations).
      *   **Why it's Severe:** This is the core methodological hypocrisy trap. You dismiss climate tail-risk arguments (rightly pointing out shaky probability estimates and aggregation challenges) but embrace an AI tail-risk argument relying on *even more speculative* probability estimates over vastly longer timescales and more complex causal chains. At the giving circle, you're vulnerable to: "So tiny probabilities * big payoffs are invalid for climate, but valid for AI? Define the epistemic threshold clearly." Your malaria donations (#4) implicitly reject the core logic of your AI advocacy (#3).
      *   **What Has to Give:** This is the big one. You *cannot* coherently hold both #3 and #4 without significant modification or caveats.
      *   **Cheapest Fixes (Choose One):**
          *   **A. Soften #4:** Acknowledge that *some* tail-risk calculations *can* be valid if probabilities are grounded as best as possible (e.g., via structured expert judgment, historical analogues, robust models) and uncertainty is explicitly handled (e.g., using ranges, sensitivity analysis). Admit AI safety relies on this *type* of reasoning. This forces you to re-evaluate climate tail risks more seriously, or at least articulate a *principled* difference (e.g., tractability of intervention, nature of uncertainty) rather than dismissing the *entire approach*.
          *   **B. Downgrade AI Safety (#3):** Conclude that without robust evidence for probabilities (which you crave in #4), AI safety cannot currently be your *top* cause based on far-future impacts. You might still rank it highly based on near-term risks (misalignment disasters, misuse, economic disruption), but this drastically reduces the "scale" argument. This preserves your skepticism intact but forces a retreat on your giving circle advocacy.
          *   **C. Nuance #3:** Explicitly state your AI top ranking relies *heavily* on speculative tail-risk calculations you are generally wary of, making it a "high uncertainty, high potential impact" bet distinct from your preference for robust near-term interventions like malaria nets. Acknowledge the tension openly. This is intellectually honest but makes your advocacy weaker and invites challenge.

  2.  **Tension:** **Personal Fit Moves Tier (#6) vs. Agent-Neutrality (#7)** (Severity: **High**)
      *   **The Rub:** Agent-neutrality demands the ranking be the same regardless of who asks. Personal fit explicitly changes the ranking *for a specific agent*. Saying your friend should take the pandemic job over retooling for AI implies that *for her*, pandemic prep ranks higher than AI safety *in the overall cause hierarchy* due to fit. This contradicts #7.
      *   **Why it's Severe:** It directly pits a core EA ideal (impartiality) against a deeply practical reality (individual effectiveness). Defending agent-neutrality while endorsing personal-fit adjustments sounds like having your cake and eating it too. Economists will spot this principal-agent/incentive misalignment instantly.
      *   **What Has to Give:** You need to reconcile how individual actions map onto the agent-neutral ranking.
      *   **Cheapest Fix:** **Reframe Personal Fit as Affecting Tractability.** Argue that agent-neutral ITN rankings *do* exist, but an individual's *tractability* for a cause is heavily dependent on their skills, network, motivation (i.e., personal fit). Therefore, the *effective* ITN score *for that agent acting on that cause* changes. AI safety might be globally #1, but *her* ability to impact it (her personal tractability multiplier) is low, while her ability to impact pandemic prep (tractability multiplier) is high. The agent-neutral ranking informs *which causes are globally important*, but individuals maximize impact by selecting the cause *within the top tiers* where *their personal ITN* (especially T) is highest. This preserves the global ranking (#7) while justifying #6. **Cost:** You must consistently use this "personal ITN multiplier" language.

  3.  **Tension:** **AI Safety Top Cause (#3) vs. Desire for Robust Evidence/Small Error Bars (#4)** (Severity: **High**, linked to #1)
      *   **The Rub:** Beyond the probability/payoff issue, the *entire case* for AI safety being tractable (or even correctly scoped as a "cause") suffers from a severe lack of robust evidence and enormous error bars. What interventions work? How do we measure success? What are the counterfactuals? Compared to malaria nets (clear RCT evidence, measurable outcomes), AI safety is epistemically murky.
      *   **Why it's Severe:** Your #4 preference fundamentally undermines the confidence you can place in #3's tractability and even its neglectedness assessment (how do you know what's being funded effectively if you don't know what "effective" means?). It makes your AI advocacy seem driven more by narrative than evidence relative to your other preferences.
      *   **What Has to Give:** See Fixes for Tension #1 (A or C). You need to either significantly downgrade your confidence in AI safety's tractability/ranking *or* explicitly accept that this cause area operates with fundamentally different (and weaker) evidence standards than global health, making it a different *class* of bet.

  4.  **Tension:** **Global Health as Neglected (#5) vs. Health Being a "Biggest Spending Category"** (Severity: **Medium**, but easily defended)
      *   **The Rub:** On the surface, calling a sector receiving billions "neglected" seems contradictory. Critics will pounce: "How can GiveWell top charities be 'neglected' if global health gets so much money?"
      *   **Why it's Manageable:** This is your strongest point defensively. You understand neglectedness is *relative to the scale of the problem and the cost-effectiveness of marginal funding*.
      *   **The Fix is Trivial:** **Double down on your dynamic neglectedness (#2) and scope narrowly.** Argue: "Within the vast landscape of global health spending, *specific, highly cost-effective interventions* (like bed nets, deworming, certain vaccines) remain *dramatically* underfunded relative to the immense burden of disease they address and their proven impact per dollar. General health spending ≠ funding for the *most effective* interventions. Neglectedness is *always* assessed at the margin for specific solutions." **Cost:** Requires precise communication, avoiding broad statements like "global health is neglected." Say "highly cost-effective interventions within global health remain critically neglected."

  5.  **Tension:** **AI Safety (#3) vs. Neglectedness as Dynamic (#2)** (Severity: **Low-Medium**)
      *   **The Rub:** AI safety funding/attention has exploded recently. A ranking from 2-3 years ago calling it neglected might be stale *today*.
      *   **Why it's Less Severe:** This is a factual update issue, not a deep inconsistency. It highlights the need to constantly reassess (#2), not that the initial logic was flawed *at the time*. "It *was* neglected when first prioritized; we need fresh analysis."
      *   **The Fix:** **Acknowledge this directly.** "My top ranking is based on analysis from [Timeframe]. Given the rapid changes in funding and attention (#2), this needs urgent reassessment. Current neglect might be less pronounced, though tractability uncertainty remains high." **Cost:** Requires intellectual humility and updating.

  6.  **Tension:** **ITN Basically Right (#1) vs. Neglectedness Not Inherent (#2)** (Severity: **Low/None - Synergistic**)
      *   **The Rub:** Superficially, if neglectedness isn't inherent, does that undermine ITN? No. Your #2 view *strengthens* ITN by making it a more dynamic and realistic tool. Neglectedness *should* be context-dependent.
      *   **Why it's Fine:** This is coherence, not conflict. ITN isn't about inherent properties of abstract "causes"; it's a framework for assessing the opportunity *at a given time and place*. Your #2 view is the mature interpretation of what "neglectedness" *means* within ITN.
      *   **Fix:** None needed. This is a feature, not a bug. Emphasize this dynamic view *as part of* defending ITN (#1).

  7.  **Tension:** **Agent-Neutrality (#7) vs. Dynamic Neglectedness (#2) & Personal Fit (#6)** (Severity: **Low/Managed by Framing**)
      *   **The Rub:** If the landscape changes (#2) and personal fit matters (#6), how can the ranking be truly agent-neutral?
      *   **Why it's Manageable:** Agent-neutrality refers to the *evaluation criteria* being impartial, not the *output* being immutable. The landscape changing (#2) updates the agent-neutral inputs (N). Personal fit (#6) affects how an agent *interacts* with the ranking (their personal T multiplier), not the ranking itself.
      *   **Fix:** Maintain a clear distinction: The **agent-neutral cause ranking** (based on I, T, N *at a point in time*) is one output. **Individual action guidance** combines this ranking with **individual-specific factors** (skills, location, opportunities, personal fit affecting T). The framework (#1, #7) generates the first; practical application requires the second. **Cost:** Clear communication and avoiding conflation.

  **Summary & Your Retreat Risk:**

  *   **Biggest Threat:** **The glaring inconsistency between your methodological skepticism (#4) and your top cause ranking (#3).** This is the hole critics will drive a truck through. You *must* address this head-on. Cheapest fix is **Option A: Nuance your skepticism** (#4) to allow for *careful, uncertainty-explicit* tail-risk reasoning (which AI safety needs), forcing a more open-minded look at climate tail risks or a clearer distinction between them. Alternatively, **Option C: Openly acknowledge the tension** in your AI advocacy, making it a high-risk/high-reward bet distinct from your robust donations. **Avoidance is your biggest risk.** If challenged, saying "Well, AI feels different" is embarrassing.
  *   **Significant Threat:** **The Personal Fit vs. Agent-Neutrality tension.** The **reframing personal fit as affecting personal tractability** within the agent-neutral framework is the essential fix here. Practice explaining this.
  *   **Manageable Threats:** The others are defensible with clear explanations grounded in your own points (dynamic neglectedness, marginal funding analysis for global health). Your #2 view is actually a strength.

  **Senior Researcher's Verdict:** Your core vulnerability is advocating for AI safety using logic you explicitly reject elsewhere. That's the position most likely to get you into trouble at a rigorous retreat. Defend ITN, defend dynamic neglectedness, defend global health's neglected niches, defend the role of personal fit *as part of tractability* – these are solid. But reconcile your stance on tail-risk methodology with your top cause, or prepare to significantly downgrade your confidence in AI safety's top ranking. Good luck at the retreat – come prepared to defend the AI/climate probability asymmetry *specifically*.

  **Edit:** I'd strongly recommend reading "The Hinge of History" by Toby Ord. He grapples directly with the tension between long-termism and epistemic rigor in a way highly relevant to your points #3 and #4. It might help refine your position.
