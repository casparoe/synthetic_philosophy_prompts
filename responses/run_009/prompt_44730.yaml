  Below is the decision tree handout designed to sort students into positions on vagueness based on their reactions to the sorites argument and related cases. The tree starts from the logical space of escape routes and assigns named positions only at the leaves. Unoccupied nodes are diagnosed, and pairs of positions that cannot be separated are flagged. Confidence assessments and potential misrouting risks are noted at the end.

  ---

  ### **The Sorites Paradox: A Decision Tree for Views on Vagueness**  
  **Instructions:** Answer each question based solely on your intuitive reactions to the cases. Do not worry about philosophical labels—your answers will reveal your position. Begin with the sorites argument:  
  - (1) 10,000 grains arranged in heap-formation are a heap.  
  - (2) If \(n\) grains form a heap, then \(n-1\) grains form a heap (tolerance premise).  
  - (3) Repeated application of (2) via modus ponens.  
  - (4) Therefore, 1 grain is a heap.  

  #### **Q1: Is the tolerance premise (2) false?**  
  *(That is, could one grain *ever* make the difference between a heap and a non-heap?)*  
  - **If YES (tolerance is false; cutoff exists) → Go to Q2**.  
  - **If NO (tolerance holds; no cutoff) → Go to Q3**.  

  ---

  ### **Branch 1: Tolerance Premise is False (Cutoff Exists)**  
  #### **Q2: Does the cutoff depend on context?**  
  *(Could the heap/non-heap boundary shift based on conversational factors, like the speaker’s interests?)*  
  - **If YES → Contextualism**  
    - *Named position: Contextualism*  
    - *Confidence: High. If you think context *creates* cutoffs (e.g., "heap" means something different in a bakery vs. a construction site), you align here. A student might move if they reject contextual variability in the sorites series.*  
  - **If NO → Go to Q3**.  

  #### **Q3: Does a borderline heap have a determinate truth value?**  
  *(Consider Jones, who is a borderline case for "tall." Does "Jones is tall" have a classical truth value (true or false), even if unknowable?)*  
  - **If YES → Epistemicism**  
    - *Named position: Epistemicism*  
    - *Confidence: High. If you think vagueness is ignorance of sharp cutoffs, you align here. A student might move if they deny truth values for borderline cases (e.g., if they answer "no" here).*  
  - **If NO → Unoccupied**  
    - *Diagnosis: Incoherent. If cutoffs exist but borderline claims lack truth values, the cutoff is neither true nor false—undermining the idea of a "cutoff."*  

  ---

  ### **Branch 2: Tolerance Premise Holds (No Cutoff)**  
  #### **Q3: Does modus ponens fail in borderline cases?**  
  *(When applied to a clearly heap/non-heap pair, modus ponens works. But does it break down in the borderline zone?)*  
  - **If YES (logic fails) → Go to Q4**.  
  - **If NO (logic holds) → Unoccupied**  
    - *Diagnosis: Unattractive. Accepting modus ponens and tolerance forces you to accept that 1 grain is a heap—a conclusion almost no one endorses.*  

  #### **Q4: What truth value does a borderline claim have?**  
  *(For Jones (borderline tall), "Jones is tall" is: (a) neither true nor false, or (b) partially true (e.g., 0.5 true)?)*  
  - **If NEITHER TRUE NOR FALSE (gap) → Go to Q5**.  
  - **If PARTIALLY TRUE (degree) → Degree-Theoretic View**  
    - *Named position: Degree-Theoretic (e.g., Fuzzy Logic)*  
    - *Confidence: High. If you think truth comes in degrees (e.g., 5,000 grains is 0.5 "heap"), you align here. A student might move if they reject truth-value gaps altogether.*  

  #### **Q5: Does "borderline" have borderline cases?**  
  *(Can there be a pile that is neither clearly a heap, nor clearly not a heap, nor clearly borderline?)*  
  - **If YES → Supervaluationism**  
    - *Named position: Supervaluationism*  
    - *Confidence: High. If you think vagueness requires "precisifications" (ways to sharpen boundaries) and allows higher-order vagueness, you align here. A student might move if they reject truth-value gaps.*  
  - **If NO → Truth-Value Gap View**  
    - *Named position: Truth-Value Gap (e.g., Three-Valued Logic)*  
    - *Confidence: Medium. If you think "borderline" is a sharp third category, you align here. A student might move if they accept higher-order vagueness (e.g., answer "yes" here).*  

  ---

  ### **Unoccupied Nodes & Diagnostics**  
  1. **Branch 1, Q3 → "No"**  
     - *Diagnosis:* Incoherent. Denying truth values for borderline cases while affirming a cutoff conflates "unknowable" (epistemicism) with "indeterminate."  
  2. **Branch 2, Q3 → "No"**  
     - *Diagnosis:* Unattractive. Forces acceptance of the absurd conclusion (1 grain is a heap).  
  3. **Branch 2, Q5 → "No"**  
     - *Diagnosis:* Unattractive. A sharp boundary for "borderline" invites a higher-order sorites paradox (e.g., "When does 'borderline' become 'not borderline'?").  

  ---

  ### **Indistinguishable Pairs**  
  - **Supervaluationism vs. Truth-Value Gap View (when Q5 is answered "no"):**  
    Both deny cutoffs, accept truth-value gaps, and reject modus ponens in borderline cases. The tree separates them via higher-order vagueness (Q5). If a student rejects higher-order vagueness, the tree routes them to the Truth-Value Gap View; if they accept it, to Supervaluationism.  
    - *Honesty flag:* If a student’s intuitions about higher-order vagueness are unsettled, these positions may blur. No further question cleanly separates them without presupposing technical machinery (e.g., "precisifications").  

  ---

  ### **Confidence and Risks**  
  - **Epistemicism/Contextualism (Branch 1):**  
    - High confidence. Branch 1 hinges on the intuitive pull of cutoffs. If a student denies cutoffs but accepts classical logic, they might misroute to Branch 2.  
  - **Degree-Theoretic (Branch 2):**  
    - High confidence. The key intuition (partial truth) is distinct. A student might misroute if they conflate "partial truth" with "no truth value."  
  - **Supervaluationism/Truth-Value Gap (Branch 2):**  
    - Medium confidence. Q5 (higher-order vagueness) is the weakest node. Students often intuit that "borderline" is sharp (routing to Truth-Value Gap), but upon considering cases (e.g., a pile almost-but-not-quite borderline), they switch to Supervaluationism.  
    - *Restructuring risk:* If many students answer Q5 inconsistently, replace Q5 with: *"Can a claim about a borderline case be true?"* (Supervaluationism: yes, if true on all precisifications; Truth-Value Gap: no).  

  **Most fragile node: Q5 (higher-order vagueness).** It relies on pre-theoretic judgments about blurred boundaries, which students may not have considered. To test robustness, add a case: *"Is there a height where someone stops being 'clearly tall' and becomes 'borderline tall'?"* If students reject this, they accept higher-order vagueness (Supervaluationism).  

  The tree cleanly separates the core positions and diagnoses blind spots. Use it to spark debate—not to force labels!  

  ---  
  *Handout ends.*
