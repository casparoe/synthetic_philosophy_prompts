  For the brother's argument... interesting that most interpretations don't fully support him. The official isn't just a citizen deciding obedience; as an agent of the system, the "counterfeit law" or "no-excuse" views might better capture why "I was following orders" fails morally. But the judicial non-application view doesn't directly apply to executives. 

