prompt: |-
  I've spent two decades as a science journalist — biomedical research, public health, the occasional epidemiological scandal — and I'm now working on a long essay about what my profession actually owes its readers. Philosophers argue over whether the norm governing assertion is truth, knowledge (Timothy Williamson's knowledge rule), or reasonable belief (Jennifer Lackey's reasonable-to-believe norm). What I want to know is which norm, if any, my newsroom's practices presuppose. Let me lay out the practice as concretely as I can, because the philosophy has to engage with the details.

  We run corrections when we state something false: if we misreport a sample size or garble a hazard ratio, the corrections desk will say so. But we will not correct an accurate report of a false claim. If we wrote that a minister said the water was safe, and the water wasn't safe, our sentence was true, so nothing needs correcting. Attribution — "according to a senior health official," "researchers report" — appears to let claims pass through our pages without our asserting them. Yet our headlines take ownership: the body of the story says "researchers report a 40 percent reduction," and the headline above it says "New drug cuts deaths by 40 percent," written by an editor working from the hedged body. We practice balance in the name of not taking sides, which in science coverage has meant a fringe skeptic getting the same two paragraphs as a consensus of thousands of studies. We grant anonymity, which strips readers of the ability to assess the source for themselves, in exchange for claims we could not otherwise print at all. And while a courtroom witness swears to tell the truth, my byline promises, if it promises anything, only accuracy about who said what.

  So here is my question: what norm of assertion does this bundle of practices presuppose, if any? Is attribution a device for honoring a knowledge norm — we assert only what we know, namely that the official said it — or a device for evading one? Is the gap between hedged body and flat headline a straightforward inconsistency, or do the two run on different norms, and can a single publication coherently do that? Does balance-as-practice make sense only if the governing norm is something like "report what credible parties assert" — a norm the philosophical literature doesn't even list — and if so, is that norm defensible, or is it a degenerate cousin of one of the standard three? Where is the practice underdetermined, such that several theories of the norm would equally license what we do, and where do the parts genuinely clash? I'm not looking for a gotcha about the media; I want a reconstruction careful enough that I could take it back to my editors as a description of the institution we actually run.

  Please structure your reply as follows:

  1. "The practice, restated" — strip away my framing and describe the norms governing corrections, attribution, headlines, and balance purely as they bear on what the paper asserts and what it merely reports; roughly 150 words.
  2. "The norms on the table" — a neutral statement of the truth norm, the knowledge norm, and the reasonable-to-belief norm, including what each predicts about when an assertion is proper and what each says about assertions that are true but not known, or reasonable but false; roughly 250 words.
  3. "What each practice presupposes" — go practice by practice (corrections, attribution, headlines, balance, anonymity) and say for each which norm it requires, which it merely tolerates, and which it excludes; roughly 400 words.
  4. "The clashes" — where the practices presuppose incompatible things, and whether the whole can be saved as a division of labor — say, reporters governed by one norm and the institution by another — rather than as a contradiction; roughly 250 words.
  5. "If we took that norm seriously" — sketch what corrections, attribution, and headline writing would look like in a newsroom genuinely governed by whichever norm you judge closest to what journalism should presuppose; roughly 200 words.
  6. "Verdict" — which norm the practice as it exists actually presupposes, whether that norm is coherent, and whether it is the right one for an institution like ours; roughly 100 words.
reasoning: |-
  Okay, the user is a seasoned science journalist with two decades of experience, now writing an essay on what journalism owes its readers. They've laid out specific practices in their newsroom—corrections, attribution, headlines, balance, and anonymity—and want to understand which philosophical norm of assertion these practices presuppose. The norms in question are truth, knowledge, and reasonable belief.

  First, I need to parse each practice as they described. Corrections only for factual errors in their reporting, not for accurately reporting false statements. Attribution like "researchers report" seems to avoid asserting the claim itself. Headlines, however, state claims directly even when the body attributes them. Balance gives equal space to fringe views alongside consensus, which might imply neutrality over truth. Anonymity allows publishing otherwise unreportable claims but removes source transparency.

  The user's deeper need is to provide a coherent framework for their newsroom's practices, possibly to advocate for changes. They mention wanting a reconstruction to take back to editors, so they likely seek validation of inconsistencies and a defensible norm. They might be frustrated with current practices that undermine scientific accuracy, especially in biomedical contexts where misinformation can have serious public health consequences.

  Next, I'll break down the philosophical norms. Truth norm: assert only true statements. Knowledge norm: assert only what you know. Reasonable belief: assert what's reasonably justified, even if false. Each has implications for the practices. For example, corrections align with truth norm since they fix falsehoods. Attribution could be a way to adhere to knowledge norm by only asserting that someone said something. But headlines contradict this by asserting the claim directly without attribution.

  Balance practices suggest that the newsroom prioritizes reporting assertions from credible parties rather than verifying truth, which aligns with reasonable belief. However, giving equal weight to fringe views contradicts scientific consensus, potentially misleading readers. Anonymity trades off source assessment for information access, which might fit reasonable belief if the source is deemed credible internally.

  Clashes arise between headlines and body text: the body uses attribution (knowledge norm), headlines assert directly (truth or reasonable belief). Balance practices conflict with knowledge norm when fringe views lack evidence. Anonymity might bypass knowledge if sources aren't vetted enough.

  If adopting knowledge norm, corrections would extend to retracting statements that aren't verified, even if true by accident. Attribution would remain, but headlines would mirror the body's hedging. Balance would require contextualizing credibility, not just equal space. Anonymity would need stricter justification.

  The verdict might be that current practices lean towards reasonable belief but inconsistently. Truth norm is too rigid, knowledge too demanding. Reasonable belief fits journalism's practical constraints but needs refinement to avoid false balance. The user might push for shifting towards knowledge where possible, especially in science journalism, to uphold accuracy and combat misinformation.
answer: |-
  ### 1. The Practice, Restated  
  (148 words)  
  The publication corrects *factual errors in its own reporting* (e.g., misstated statistics) but not *accurate reports of false claims* (e.g., correctly quoting an official’s untrue statement). Attribution ("scientists say...") frames claims as *reported speech*, not direct assertions by the publication. Headlines, however, often *assert claims directly* (e.g., "Drug cuts deaths") even when the attributed body text is hedged. "Balance" mandates presenting opposing views equally, regardless of evidence, treating all sourced assertions as equally reportable. Anonymity allows publishing assertions without source identification when deemed necessary. The byline implies accuracy in *reporting who said what*, not endorsement of the claim’s truth. Crucially, the publication asserts: (a) the accuracy of its representations (e.g., "X said Y"), and (b) the content of headlines. It does *not* assert the truth of attributed claims in the body text.

  ### 2. The Norms on the Table  
  (248 words)  
  - **Truth Norm**: An assertion is proper only if it is *true*. It condemns false assertions, even if reasonable or believed. True assertions are permissible regardless of the asserter’s epistemic justification (e.g., a lucky guess).  
  - **Knowledge Norm (Williamson)**: An assertion is proper only if the asserter *knows* it to be true. It forbids assertions that are unknown (even if true) or false (even if reasonably believed). Knowledge requires truth + justification + absence of Gettier-style luck.  
  - **Reasonable-to-Believe Norm (Lackey)**: An assertion is proper if it is *reasonable for the asserter to believe* it true, given their evidence. It permits false assertions if reasonably held (e.g., based on incomplete evidence) and condemns unreasonably held true assertions (e.g., blind guesses). Reasonableness is context-sensitive but centers on epistemic responsibility over truth-tracking.  

  *Key distinctions*:  
  - A *true but unknown* claim (e.g., a correct hunch): Truth Norm permits it; Knowledge Norm forbids it; Reasonable Belief may forbid it if evidence is weak.  
  - A *reasonable but false* claim (e.g., based on flawed but credible data): Truth and Knowledge Norms forbid it; Reasonable Belief permits it.  
  - A *known* claim: All permit it.

  ### 3. What Each Practice Presupposes  
  *(By practice, with norms: Requires (✓), Tolerates (∼), Excludes (✗))*  
  **(Corrections Policy)**  
  - Only corrects *factual reporting errors*, not *true reports of false claims*.  
    - ✓ **Truth Norm**: Corrections address falsity *in the publication’s own assertion* (e.g., misquoting). True assertions (e.g., "Minister said water safe") need no correction even if misleading.  
    - ∼ **Knowledge Norm**: Could also motivate corrections for *unwittingly false assertions*, but current practice doesn’t correct *true* reports of *unknown/false claims* (e.g., accurately quoting a liar).  
    - ✗ **Reasonable Belief**: Would require corrections when *reasonableness* is undermined (e.g., new evidence shows prior belief unreasonable), but practice ignores reasonableness of the *underlying claim*.  

  **(Attribution in Body Text)**  
  - Uses "scientists say X" to report, not assert, X.  
    - ✓ **Knowledge Norm**: Allows asserting *only* what is known—i.e., *that the source made the claim*—not the claim itself. Attribution is a knowledge-compliant device.  
    - ∼ **Truth Norm**: Tolerates attribution as a way to assert a *different* truth (that the claim was made), but doesn’t require it.  
    - ✗ **Reasonable Belief**: Excluded because attribution avoids asserting X *at all*, even if reasonable to believe X.  

  **(Headlines)**  
  - Assert claims directly ("Drug cuts deaths") despite hedged body text.  
    - ∼ **Reasonable Belief**: Tolerated if headline writers reasonably believe the claim based on the article (even if knowledge/truth is lacking).  
    - ∼ **Truth Norm**: Tolerated only if the headline is *true*; practice risks falsity if the underlying claim is untrue.  
    - ✗ **Knowledge Norm**: Excluded if headline writers lack knowledge of the claim (common when editors don’t vet evidence).  

  **(Balance)**  
  - Gives equal weight to fringe and consensus views.  
    - ✓ **Reasonable Belief**: Presupposes norm is "report assertions from *credible-seeming* sources," not assess truth/knowledge. Balance treats credibility as sufficient for reportability.  
    - ∼ **Truth/Knowledge Norms**: Tolerated only if presenting *all sides* is seen as a path to truth/knowledge, but *equal weighting* contradicts these norms when one side lacks evidence.  

  **(Anonymity)**  
  - Publishes assertions without sourcing to enable "unreportable" claims.  
    - ✓ **Reasonable Belief**: Permits assertions if *internally deemed credible* (anonymity granted based on editorial trust in source/reasonableness).  
    - ✗ **Knowledge Norm**: Excluded if anonymity prevents readers (or even editors) from *verifying* the source’s reliability/knowledge.  
    - ✗ **Truth Norm**: Tolerates anonymity only if the claim is true, but practice prioritizes *access* over truth-verification.

  ### 4. The Clashes  
  (252 words)  
  The practices presuppose **inconsistent norms across roles**, creating systemic tension:  
  - **Body vs. Headline**: Attribution in the body *preserves Knowledge Norm* (asserting only that a claim was made). Headlines *violate Knowledge Norm* by directly asserting claims without knowledge, instead relying on *Reasonable Belief* (editors reasonably trust the article). This clash is unresolved: the publication simultaneously avoids asserting X (body) and asserts X (headline).  
  - **Balance vs. Knowledge/Truth**: Balance operates on a *Reasonable Belief variant*: "assert what credible parties assert." This clashes with Knowledge/Truth Norms when fringe views (lacking evidence) are presented as equally credible. Balance *requires* asserting claims the publication *knows are unsupported*, violating Knowledge/Truth.  
  - **Anonymity vs. Reader Assessment**: Anonymity assumes readers need not evaluate sources themselves (aligned with Reasonable Belief’s focus on the *publication’s* judgment). This clashes with Knowledge Norm, which demands readers assess justificatory pathways.  

  **Can this be a coherent division of labor?**  
  Only superficially. Reporters (body text) follow *Knowledge Norm* for attribution. Editors (headlines, balance) follow a *credibility-based Reasonable Belief Norm*. The institution as a whole, however, asserts *both* norms simultaneously in ways that undermine consistency:  
  - Headlines functionally *override* the body’s hedging, implying institutional endorsement.  
  - Balance legitimizes low-credibility claims, conflicting with the *Knowledge Norm* implied by rigorous corrections.  
  **Verdict**: Practices reflect a *pragmatic hybrid*, not a principled division. The unresolved clash between headline assertion and body attribution is particularly jarring under philosophical scrutiny.

  ### 5. If We Took the Knowledge Norm Seriously  
  (198 words)  
  Adopting Williamson’s Knowledge Norm would reshape practice:  
  - **Corrections**: Expand to retract *any* assertion later found *unknowable at the time* (e.g., "We asserted 'Drug cuts deaths' but lacked knowledge of the study’s flaws"). True-but-unknown reports (e.g., accurately quoting a liar) might carry disclaimers: "We know X said Y, but we lack knowledge that Y is true."  
  - **Attribution**: Maintained rigorously. Body text *only* asserts that claims were made (verified by recordings/notes). Uncertainty about a claim’s truth would trigger explicit caveats: "Study claims Z, but replication failures mean we cannot know Z."  
  - **Headlines**: Must mirror body text’s epistemic caution: "Researchers Claim Drug Cuts Deaths (Unverified)" or "Landmark Study Reports 40% Reduction—Independent Confirmation Pending." No assertion without editorial knowledge.  
  - **Balance**: Abandon false equivalence. Consensus views reported as *known* (e.g., "Vaccines prevent disease, as demonstrated by..."); fringe views contextualized as *unreliable*: "A minority view, unsupported by evidence, asserts..."  
  - **Anonymity**: Permitted only if editors *know* the claim is true *and* the source’s identity is verifiable internally.  

  *Result*: Headlines lose sensationalism; "balance" becomes contextualization; readers gain epistemic clarity at the cost of concision.

  ### 6. Verdict  
  (98 words)  
  Current practices **presuppose no single coherent norm**. Corrections and attribution align with a **Truth Norm** (for institutional assertions) and **Knowledge Norm** (for reported speech). Headlines and balance rely on a **Reasonable Belief Norm** (credibility-based, not truth-tracking). Anonymity fits only Reasonable Belief. This hybrid is *incoherent philosophically*—especially the headline/body contradiction—but *pragmatically functional* for daily journalism. The norm journalism *should* presuppose is the **Knowledge Norm**, as it best serves public trust in science. Adopting it would resolve clashes by tethering assertion to evidence, eliminating false balance, and clarifying headlines. It demands more of institutions but offers a defensible epistemic foundation.
