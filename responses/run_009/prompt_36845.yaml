  Okay, the user is a PhD student in development economics running a blog for grad students and early-career researchers. They notice that while their audience claims to use the importance-tractability-neglectedness (ITN) framework for cause prioritization, their actual decisions don't align with the multiplicative logic of ITN. The user wants a diagnostic quiz to reveal their readers' true decision-making styles, hidden behind their stated use of ITN.

  The quiz needs to be in continuous prose without any bullet points or headings, fitting the blog's long-form style. It should have 8-10 questions, each presenting a concrete scenario with answer options that subtly test different aspects of cause prioritization without revealing which "type" they correspond to. The key axes to explore include: whether importance is absolute or discounted by others' actions; strict multiplicative scoring vs lexical priority of scale; different interpretations of neglectedness (diminishing returns vs advocacy dilution); whether intractable problems can ever be prioritized; and how future generations factor into importance.

  I need to brainstorm scenarios that cleanly separate these positions. For example: 
  - A global health problem that's huge but well-funded versus a smaller but completely neglected issue would test if readers discount importance by what others are doing. 
  - A cause scoring highest on one dimension but lowest on the product could expose lexical prioritization versus strict multiplication. 
  - A field crowded with funding versus one crowded only with vocal supporters could distinguish between neglectedness-as-diminishing-returns versus neglectedness-as-advocacy-dilution. 
  - A vast but intractable problem like aging would test if tractability can veto scale. 
  - Including future generations would probe if potential scale overrides existence in importance calculations.

  The scoring should map to five decision types: strict multiplicative ITN, scale-first, marginal cost-effectiveness first, neglectedness-as-advocacy, and satisficing. I must acknowledge when combinations don't fit any type or when the quiz can't reliably separate certain types, suggesting additional cases where needed.

  Each question must be presented as a flowing narrative within a paragraph, with answer options woven in naturally. The scoring explanation should also be in prose, analyzing how answer patterns reveal underlying priorities while honestly flagging limitations. The tone should be collegial and analytical, like a detailed letter to a fellow researcher.
answer: |-
  Consider this a draft for your diagnostic instrument, structured as a seamless narrative exploration of cause prioritization instincts. Imagine we're discussing hypothetical scenarios over coffee, and your responses reveal deeper patterns in how you weigh competing claims on scarce resources.

  Begin with a choice between two global health interventions. Malaria remains a colossal burden, killing over half a million annually, primarily young children. Decades of concerted effort mean well-funded institutions deploy proven tools like bed nets and antimalarials, achieving significant, though incomplete, progress. Meanwhile, snakebite envenoming kills perhaps 100,000 people yearly and disables half a million more, largely impoverished rural dwellers. It receives a fraction of malaria's funding and research attention, despite existing antivenoms being sometimes ineffective, unaffordable, or unavailable where needed. If allocating a new $1 million research grant, which feels like the higher priority? Option A leans towards malaria, arguing its sheer scale and existing momentum mean even incremental gains affect vastly more lives. Option B favours snakebites, contending that the extreme funding disparity makes progress here far more achievable per dollar and that those affected are uniquely abandoned. Option C questions the premise, suggesting the money might do more in a completely different domain like pandemic preparedness.

  Next, ponder farm animal welfare. Industrial agriculture involves immense suffering for billions of sentient beings. Reducing this suffering seems highly tractable through corporate campaigns or legislative pushes for cage-free systems – methods with demonstrated success rates. However, the field is now crowded; dozens of well-resourced NGOs work specifically on this issue. Compare this to improving welfare for the vastly smaller number of animals used in research laboratories. Progress here appears much harder; regulations are stricter, industry resistance is fiercer, and successful interventions are less proven. Yet, few groups focus primarily on lab animals. Where would you steer a talented new advocate? Option A picks farm animals, driven by the overwhelming scale of suffering and proven pathways, even amidst the crowd. Option B chooses lab animals, believing the neglectedness outweighs the lower scale and tractability. Option C remains unconvinced by both, sensing diminishing returns in animal advocacy broadly and looking elsewhere.

  Now, confront a truly vast but stubborn problem: reversing biological aging. Success could alleviate almost all age-related disease, potentially adding healthy years to billions of lives, present and future. The potential scale dwarfs almost any other health intervention. However, the scientific challenges are profound, fundamental biological mechanisms are poorly understood, and decades of intense research have yielded only marginal life-extension in model organisms. Major funding flows in from billionaires and biotech ventures chasing massive profits. Does this belong in the top tier of causes for a philanthropist? Option A says yes unreservedly, citing the staggering potential importance that eclipses concerns about tractability or current funding levels. Option B says no, arguing the extreme intractability makes current investment futile; resources are better spent on solvable problems with more certain near-term benefits, like scaling up deworming. Option C is skeptical of the profit-driven focus but thinks carefully targeted basic science grants might still be high-value bets, albeit risky ones.

  Consider the potential for catastrophic risks. One involves strengthening early warning systems for regional famines triggered by climate change. Reliable predictions could save tens of thousands of lives in the next decade by triggering pre-emptive aid. Another focuses on mitigating the longer-term, lower-probability risk of an engineered pandemic that could kill hundreds of millions or more within the next 50 years. The latter field is gaining traction but remains relatively niche compared to immediate disaster relief. Which deserves more emphasis? Option A prioritizes the near-term famine warning, arguing for the moral urgency of saving identifiable lives now. Option B prioritizes the existential pandemic risk, believing the potential scale, even discounted by probability and futurity, is so vast it demands significant resources. Option C finds both compelling but worries institutional capacity for long-term risk mitigation is too weak, favouring building that capacity first.

  Examine neglectedness nuances. Two causes aim to reduce maternal mortality. Cause X works in a country with a very high death rate where the government and major international donors have recently launched a massive, well-funded health system strengthening initiative explicitly targeting maternal care. Cause Y works in a different country with a moderately high death rate, but political instability has scared off major donors; only a handful of small, vocal activist groups campaign on the issue locally, though they lack resources for direct service delivery. Your foundation can fund *advocacy* efforts. Where? Option A picks Cause X, believing advocacy can effectively push the well-funded initiative to be more efficient, accountable, and equitable, leveraging existing resources. Option B picks Cause Y, arguing that the absence of major funding makes local advocacy the *only* voice for change and crucial for building pressure amidst abandonment. Option C avoids both, seeing Cause X as redundant and Cause Y as too difficult without concurrent service delivery funding.

  Evaluate a trade-off between scale and marginal impact. Cause P addresses a widespread micronutrient deficiency affecting 500 million people. Cheap, effective fortification programs exist, but coverage is already high (80%) in the target regions due to existing programs; your donation could push coverage to 85%. Cause Q addresses a rare but devastating genetic disorder affecting 50,000 people globally. An effective treatment exists but is prohibitively expensive; your donation could subsidize treatment for an additional 500 patients who otherwise wouldn't get it. Which intervention delivers more value? Option A chooses Cause P: reaching 5% of 500 million (25 million people) with a cheap, proven intervention vastly outweighs helping 500 people, even with a dramatic individual impact. Option B chooses Cause Q: at the margin, helping those 500 suffering individuals directly, who have no other options, feels like a clearer, more impactful use of funds than a small increment on an already large program. Option C seeks alternatives, feeling neither offers truly outstanding marginal value per dollar.

  Finally, reflect on coordination problems. Two policy reforms promise significant benefits. Reform R aims to reduce air pollution in a megacity, improving health for millions. The science is clear, solutions exist (e.g., cleaner vehicles, industrial filters), and a large coalition of environmental NGOs, health groups, and community activists is already campaigning hard for it. Reform S aims to fix a complex, obscure regulation stifling innovation in a specific renewable energy technology. Success could accelerate adoption globally over decades. The issue is poorly understood, even by most energy experts, and only one tiny think tank works on it. Achieving either reform requires similar advocacy effort. Which feels more promising to join? Option A chooses Reform R, believing the large coalition signals viability and that adding your voice can help tip the scales within a coordinated push. Option B chooses Reform S, arguing that the tiny group addressing a critical bottleneck is vastly more neglected and that your unique contribution there could be pivotal. Option C worries that Reform S might be intractable due to complexity, while Reform R's crowdedness might make their effort inefficient.

  **Scoring the Patterns:**

  As you review your choices, resist forcing them into the Importance-Tractability-Neglectedness (ITN) framework you *think* you use. Instead, let’s see what pattern emerges. If your answers consistently sought the option maximizing the *product* of scale, solvability, and funding gap – for instance, choosing snakebites over malaria, lab animals only if their neglect outweighed lower scale/tractability, and avoided aging due to low tractability – you likely align with **Strict Multiplicative ITN**. Your calculus explicitly discounts importance by what others are doing and treats all three factors as essential, interdependent multipliers.

  If your instinct was persistently drawn to the largest numbers, often choosing options A emphasizing sheer scale (malaria, farm animals, aging, famine warnings, micronutrients, air pollution) even when neglectedness or tractability were weak, you resonate with **Scale-First Prioritization**. Importance, defined as absolute problem size, acts as a lexical priority; only after a cause passes a scale threshold do tractability and neglectedness meaningfully enter your consideration. The vast potential of aging or existential risks overrode other concerns.

  Did you frequently bypass the ITN labels entirely, favouring options that spoke directly to the clearest, highest-impact purchase for the *next* dollar or hour? Choosing snakebites for its funding gap, Option B in the micronutrient/genetic disorder case (helping identifiable neglected individuals), or Reform S for its pivotal potential, suggests **Marginal Cost-Effectiveness First**. You intuitively focus on counterfactual impact at the margin, often prioritizing highly neglected or bottleneck issues where your specific contribution feels least diluted. You might have found the abstract ITN multiplication less intuitive than concrete cost-per-life-saved estimates.

  When neglectedness swayed you, *why*? If you picked lab animals primarily due to lack of groups working on them (despite lower scale/tractability), or chose Cause Y (maternal advocacy in the unstable country) because its *advocacy* space was uniquely empty, or Reform S because the single think tank needed reinforcement, you exhibit **Neglectedness-as-Advocacy** reasoning. Crowdedness matters because your voice or coordination effort gets lost or duplicated; you seek arenas where your specific agency feels maximally pivotal, distinct from just diminishing financial returns. Conversely, avoiding Cause X or Reform R due to coalition size reflects this aversion to being a small voice in a large choir.

  If your answers showed a pattern of picking *one* significant problem and sticking with it until solved – perhaps consistently choosing options related to a domain like global health (malaria, snakebites, famine warnings) or animal welfare, expressing skepticism about constantly switching (Option C in several scenarios), and valuing existing momentum (e.g., malaria, air pollution coalition) – your true stance might be **Satisficing**. You prioritize depth over breadth, seeking a "good enough" cause where sustained effort can achieve measurable solutions, rather than perpetually chasing the theoretically optimal multiplier. The comparative arithmetic of ITN is secondary to committing to solvable problems within your sphere of influence.

  **Caveats and Gaps:**

  Be mindful that some answer combinations may not cleanly map to a single leaf. A mix favoring scale *and* marginal cost-effectiveness (e.g., choosing aging for scale *and* snakebites for neglect) might indicate an unresolved tension or a hybrid approach not captured here. Crucially, this quiz struggles to perfectly disentangle **Marginal Cost-Effectiveness First** from **Strict Multiplicative ITN** in cases where the multiplicative model *also* points to high marginal returns (like snakebites). Adding a case involving a cause with *moderate* scale, *moderate* tractability, but *extreme* neglect (e.g., a specific tropical disease affecting a marginalized population with zero existing programs versus a higher-scale but well-funded one) could help: the Marginal CE thinker might see the extreme neglect as offering uniquely high leverage, while the Strict Multiplicative might be tempered by the moderate scale/tractability. Similarly, **Neglectedness-as-Advocacy** and **Marginal CE** can overlap when advocacy *is* the bottleneck. A case distinguishing a cause needing money (high marginal financial ROI) from one needing unique skills you possess (high marginal leverage for *your* skillset) would clarify, but exceeds this quiz's scope. If your pattern feels split or inconsistent, embrace the ambiguity – it reveals the complexity beneath the simplifying labels we use. The goal isn't a perfect box, but a clearer mirror for your authentic prioritization instincts.
