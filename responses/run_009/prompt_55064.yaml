  **Ticket #7421-OS: Warranty Claim - Biological Functions**  
  **Status:** Escalated to Tier 2 Support  
  **Customer:** Swampman (swampman@transient.nex)  
  **Agent:** Tech Support Specialist Brenda (Level 1)  
  **Supervisor:** Senior Functional Analyst Martin (Level 2)  

  ---

  **Swampman (03/14 10:15 AM):**  
  SUBJECT: HEART MALFUNCTION - URGENT  
  My heart stopped beating yesterday. I require warranty coverage for repair/replacement per Original Function Warranty Plus Plan (Policy #OFW-8812). Medical report attached.  

  ---

  **Brenda (03/14 10:32 AM):**  
  Dear Valued Customer,  
  Thank you for contacting Original Function Warranty Co. We acknowledge your concern regarding the cessation of rhythmic contractions in your thoracic cavity organ.  

  Per Policy OFW-8812 Section 4(b): "Coverage applies solely to items possessing an *authenticated selection history* establishing normative function." Our records indicate no verified etiological history for your biological components. Without evidence of ancestral selection pressures, we cannot confirm a *proper function* exists for your organ. Thus, the term "malfunction" is inapplicable.  

  We regret to inform you this incident falls outside warranty parameters. For troubleshooting, we suggest consulting a physician regarding non-teleological arrhythmia mitigation.  

  Sincerely,  
  Brenda  
  *Original Function Warranty Co. - "We Cover What Was Meant To Be"*  

  ---

  **Swampman (03/14 11:01 AM):**  
  Brenda: This is absurd. My eyes see, my lungs oxygenate blood—clearly they *have* functions. Why deny coverage?  

  ---

  **Brenda (03/14 11:28 AM):**  
  Dear Valued Customer,  
  We appreciate your clarification. However, Policy OFW-8812 Section 2(a) defines "function" as: "A causal role stabilized by natural selection history." While your ocular organs process light, and pulmonary structures facilitate gas exchange, these activities lack selection-derived *normativity*. Absent evolutionary history, they are merely *accidental regularities*, not functions. Hence, they cannot "malfunction," only exhibit *statistically anomalous behavior*.  

  We recommend documenting these anomalies with a non-teleological physiologist.  

  Regards,  
  Brenda  
  *Original Function Warranty Co. - "History Matters"*  

  ---

  **Swampman (03/14 12:15 PM):**  
  ESCALATION REQUESTED. Supervisor, please.  
  If my heart has no "function," why does your policy document state it "pumps blood"? That implies purpose!  

  ---

  **Martin (Supervisor) (03/14 1:45 PM):**  
  Dear Mr. Swampman,  
  I am Martin, Senior Functional Analyst. I’ve reviewed your case. Brenda’s assessment aligns with policy.  

  Regarding your query: The policy document’s description of "pumping blood" is derived from the *selected effect* of hearts in entities with evolutionary lineage. Your organ’s identical behavior lacks this etiology. While causally similar, it is *non-derivatively purposeless*.  

  Policy OFW-8812 itself *has* a selected effect: Drafted by teleosemanticists, iterated via market pressures to exclude ahistorical entities. Its function derives from this history. Your biological structures, emerging ex nihilo via swamp lightning, possess no such history. The relevant difference is *etiological authenticity*.  

  We cannot cover events presupposing normative functions where none exist. Perhaps consider our "Accident Forgiveness" add-on?  

  Respectfully,  
  Martin  
  *Original Function Warranty Co. - "Solving Problems That Were Meant to Happen"*  

  ---

  **Swampman (03/14 2:30 PM):**  
  Martin: But YOUR HEAD has a selection history. The policy "means" warranty terms due to its production by selected brains. My brain is identical to one with history. Why does *your* head’s history grant content to the policy, but mine doesn’t grant content to MY states? If identical causal roles don’t count, your policy document is ALSO just "statistically anomalous ink patterns."  

  ---

  **Martin (03/14 3:20 PM):**  
  Dear Mr. Swampman,  
  We understand your frustration. However, corporate policy prohibits verifying customers' ontological origins. While we cannot confirm or deny your... spontaneous provenance, warranty coverage *requires* documented selection history for the *item in question*. Your heart lacks this. Our policy document’s production *does* have documented history (see: OFW-8812 Drafting Committee Minutes, 2018).  

  Regarding your brain: Its states may *correlate* with environmental features (e.g., "belief" about trees), but without selection history, they are not *about* trees. They are ungrounded pseudo-representations. Misrepresentation requires a function to *deviate from*. No history, no deviation—only causal variance.  

  We suggest reframing your heart event as "spontaneously arrhythmic non-functional pulsation cessation." This may qualify for partial diagnostics credit.  

  Sincerely,  
  Martin  
  *Original Function Warranty Co. - "You Break It, We’ll Fix It (If It Was Supposed to Work)"*  

  ---

  **Swampman (03/14 4:05 PM):**  
  So my "pseudo-heart" can’t malfunction, my "pseudo-eyes" aren’t for seeing, and my "pseudo-belief" that I’m dying isn’t *about* dying... but I’m still lying here unable to move. What exactly am I paying you for?  

  ---

  **Martin (03/14 4:50 PM):**  
  Dear Mr. Swampman,  
  Your Premium Plan covers authentically historical functional deviations. We regret we cannot service artifacts lacking selected-effect grounding.  

  We value your patronage! Would you like to renew your policy? Our "Ahistorical Entity" discount bundle offers symbolic reassurance at 15% off.  

  Alternatively, for immediate assistance with non-teleological arrhythmia, press 1 to speak to our Non-Normative Crisis Liaison.  

  Respectfully,  
  Martin  
  *Original Function Warranty Co. - "When Purpose Isn’t Accidental"*  

  ---

  **Ticket Closed: No Further Action Possible per Policy §7(f)**
