  **hēmī: Horizontally Scaled Cognition™**

  **Frequently Asked Questions (FAQs)**

  **1. What is the hēmī Procedure?**
  The hēmī Procedure is a minimally invasive, elective corpus callosotomy performed by our board-certified neurosurgeons. By strategically severing the primary neural bridge between your cerebral hemispheres, we enable true parallel processing. Imagine: one hemisphere ("Deep Focus") handles complex coding, writing, or analysis in uninterrupted silence, while the other ("Social Ops") manages meetings, Slack, emails, and family interactions. **Why context-switch when you can context-split?**

  **2. How does this actually improve productivity?**
  Pre-hēmī, a single overloaded consciousness juggles all tasks, leading to inefficiency and fatigue. Post-procedure, your hemispheres operate semi-autonomously. Deep Focus (typically leveraging the analytical strengths often associated with the left hemisphere) achieves unprecedented flow states. Social Ops (often utilizing holistic processing strengths) maintains social cohesion and handles reactive tasks without interrupting deep work. Studies show users report a perceived 80-110% increase in functional output throughput during the initial optimization phase.

  **3. I’ve heard reports of… unexpected behavior after similar procedures. Like one hand doing something the other denies?**
  hēmī takes all user experience reports seriously. What you're describing is known as **Interhemispheric Signal Desynchronization (ISD)**, a known transitional state as your neural architecture optimizes for parallel operation.

  *   **Scenario:** Your Social Ops hemisphere is verbally denying an action performed by the hand controlled by Deep Focus (e.g., selecting a specific tool).
  *   **Explanation:** Social Ops (usually dominant for speech) may not have direct access to the intent or perception of Deep Focus. It will generate the most contextually plausible narrative based *on the information available to it*. This is not a "lie" in the traditional sense, but a natural consequence of partitioned information streams seeking coherence. Our Optimization Consultants can provide narrative-realignment exercises.

  **4. What about physical coordination issues? Like my hands fighting over a coffee cup?**
  This phenomenon, termed **Intermanual Task Contention (ITC)**, is a rare but manageable post-operative occurrence (Incidence: < 3.2% of Phase 2 users). It arises when competing task priorities are assigned *simultaneously* to both motor control systems without sufficient high-level arbitration. Think of it as a resource allocation conflict. Mitigation strategies include:
  *   Clear pre-task hemisphere designation protocols (e.g., "Deep Focus: Grab pen. Social Ops: Hold coffee.")
  *   Utilizing our proprietary *hēmīSync™* mobile app for real-time task delegation alerts.
  *   Scheduled "Coherence Breaks" for deliberate hemispheric communication via facilitated external prompting.

  **5. Am I still one person legally and for tax purposes?**
  hēmī is committed to full legal and ethical compliance. **Crucially, the biological entity remains singular.** While operational independence is achieved at a cognitive processing level for enhanced productivity, your legal personhood, identity, and responsibilities are fundamentally unchanged. Post-procedure, you retain a single Social Security Number, file one tax return, and possess unified legal culpability. The observable behavioral nuances are recognized as operational characteristics of a single, optimized cognitive system, not evidence of multiple legal entities. (Consult your legal counsel for specific jurisdictional advice, particularly regarding contractual capacity).

  **6. Sometimes "Social Ops" me says things that feel… off. Like making up reasons for why "Deep Focus" me just did something. Is that normal?**
  This reflects **Post-Action Rationalization Synthesis (PARS)**, a well-documented cognitive optimization process. When Deep Focus initiates an action (e.g., suddenly sketching a design during a meeting), Social Ops, tasked with maintaining social narrative coherence, will generate a plausible explanation *based on its own perceptual stream and social context*. This ensures smooth interpersonal interaction and prevents workflow disruption. It demonstrates Social Ops excelling at its core function: maintaining operational continuity in the social sphere. Consider it intelligent auto-complete for behavioral justification.

  **7. Can I assign specific *types* of work to each hemisphere? Like making Deep Focus handle ALL math?**
  While hemispheric specializations exist, our technology leverages *functional* partitioning, not rigid domain assignment based on outdated pop-science models. Deep Focus excels at sustained, sequential, detail-oriented tasks requiring minimal external interruption. Social Ops thrives on parallel processing of social cues, language pragmatics, and reactive tasks. Forcing a hemisphere into a non-optimal task profile (e.g., demanding complex calculus from Social Ops during a negotiation) can trigger ISD or suboptimal performance. Our onboarding includes Cognitive Load Mapping to identify your personal optimal task-hemisphere alignment.

  **8. I feel like "Deep Focus" and "Social Ops" are becoming… distinct. Is this intended?**
  hēmī facilitates operational independence for productivity, not ontological division. The feeling of distinctness is a temporary side-effect of reduced interhemispheric cross-talk, often described as "cognitive compartmentalization." **Rest assured, both operational modes are intrinsically "you."** Any emergent narrative differences are artifacts of the partitioned information flow, not the emergence of separate persons. Our Identity Coherence Framework™ includes mindfulness practices reinforcing the fundamental unity of your cognitive system. Remember: You are not two people; you are one person, powerfully optimized.

  **9. What if I regret the procedure?**
  While our satisfaction rates are exceptionally high (98.7%), hēmī offers a standard 90-day Optimization Assurance period. If metrics indicate suboptimal integration or user distress persists beyond initial calibration, our medical team will discuss options. **Please note:** Neural reintegration at scale is not currently feasible; optimization focuses on maximizing synergy within the new architecture. All candidates undergo rigorous psychological and cognitive screening to ensure suitability and realistic expectations.

  **Optimize your potential. Scale your mind. hēmī.**
