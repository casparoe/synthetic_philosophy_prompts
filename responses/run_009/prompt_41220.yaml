   2. Safety: It's the safety and unreality of art that makes the sadness enjoyable.
   3. Metafeeling: We enjoy being moved as such, an emotion about the emotion (e.g., feeling moved by sadness).
   4. Catharsis: We enjoy discharging or working through sadness, so it pays off afterwards (e.g., feeling cleansed or relieved).
   5. Deflationary: There's nothing much in need of explanation; we just do.

   We must include the cases (a) to (e) as described.

