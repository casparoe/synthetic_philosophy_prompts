  The recurring line "Where do we draw the line?" must adapt to each context. For the pig, it's urgent; for the bee, uncomfortable; thermostat, absurd. The final stanza brings back the first stanza's lines, closing the loop. Ending with "Where do we draw the line?" as both question and potential answer.

