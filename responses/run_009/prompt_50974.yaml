    Therefore, the decision is "complex".

  We write the procedure as a step-by-step guide for the wet-lab postdoc.

  **Procedure Document**

  Title: Minimum Description Length (MDL) Based Model Selection Procedure

  Objective: To choose between a simpler model (M_simple) and a more complex model (M_complex) for a given dataset, based on the principle of compression.

  Prerequisites:
    - You have two candidate models: M_simple and M_complex (for example, 2 vs 3 subclones, or 4 vs 5 clusters).
    - Each model must provide a log-likelihood (natural logarithm) of the data given the model. This is typically obtained by fitting the model to the data.
    - You must know the number of free parameters for each model (k_simple and k_complex). This depends on the model structure.
    - You must know the sample size (n). This is the number of independent observations (e.g., the number of loci for the subclone example, or the number of patients for the clustering example).

  Steps:

  1. **Fit the models and obtain the log-likelihoods** (Estimated):
     - Fit M_simple to the data and record its log-likelihood (lnL_simple). Note: This is the natural log of the likelihood.
     - Fit M_complex to the data and record its log-likelihood (lnL_complex).

  2. **Determine the number of parameters** (Asserted or Derived):
     - k_simple: the number of free parameters in M_simple.
     - k_complex: the number of free parameters in M_complex.

  3. **Compute the description length (DL) in bits** (Derived formula with Estimated inputs):
     - Use the formula:
          DL = [ - (log-likelihood) / ln(2) ] + [ (k * log(n)) / (2 * ln(2)) ]
       where:
          ln(2) ≈ 0.693147
          log(n) is the natural logarithm of the sample size.

     - Compute DL_simple and DL_complex.

  4. **Compare the DLs**:
     - Calculate the difference: diff = DL_simple - DL_complex.
     - If diff >= 2 bits, then choose M_complex.
     - Otherwise, choose M_simple.

  5. **Interpretation**:
     - If the procedure chooses M_complex, it means that the complex model provides at least 2 bits better compression of the data.
     - If the procedure chooses M_simple, it means that the complex model does not improve the compression by at least 2 bits, and by Occam's razor we prefer the simpler model.

  6. **Overriding the procedure**:
     - If the procedure chooses M_simple but there are compelling scientific reasons to prefer M_complex (e.g., the complex model is more interpretable, has clinical relevance, or is supported by prior knowledge), you may choose M_complex. However, note that the data compression argument does not support it.
     - Conversely, if the procedure chooses M_complex but there are strong reasons to prefer simplicity (e.g., the complex model is harder to interpret or the sample size is too small for the complex model to be reliable), you may choose M_simple.

  Limitations and Caveats:

    - **Model misspecification**: If both models are misspecified, the procedure might select the one that accidentally compresses the data better. There is no safeguard against this.
    - **Small sample sizes**: The penalty term in the DL formula (which comes from the BIC approximation) is asymptotic. For small n, it might not be accurate. In particular, complex models with many parameters might require a larger sample size to be estimated reliably. The procedure does not check if the sample size is adequate for the model.
    - **Subjectivity in model description**: The DL depends on the coding scheme. We used a particular approximation (BIC) that is standard for parametric models. If the model is not parametric, or if you use a different coding, the DL might change.
    - **Arbitrary threshold**: The 2-bit threshold is a rule of thumb. It is not derived from theory. Two researchers might use a different threshold.
    - **Sensitivity to the likelihood calculation**: The log-likelihood must be computed correctly. If the model fitting procedure does not converge or if the likelihood is not the maximum likelihood, the results may be invalid.
    - **Multiple comparisons**: If you are comparing more than two models, you should adjust for multiple comparisons? The procedure is for two models. If you have more, you might run multiple pairwise comparisons and choose the model with the smallest DL, but note that the threshold is for a single comparison.

  Residual Disagreements:

    - If two researchers following the procedure get different results, it might be because:
          a) They used different models (e.g., different likelihood functions).
          b) They used different numbers of parameters (e.g., one counted a parameter that the other did not).
          c) They had different sample sizes (e.g., one excluded outliers).
          d) They used a different base for the logarithms (but the procedure is clear to use natural log for the likelihood and the log in the penalty).
    - The procedure cannot detect if both models are wrong in the same way.
    - To settle disagreements, consider:
          - Collecting more data.
          - Using a different model selection method (e.g., cross-validation) for confirmation.
          - Experimental validation.

  Example Runs:

    Example (a): Subclone model (2 vs 3)
        lnL_simple = -100, k_simple = 1, 
        lnL_complex = -99.5, k_complex = 2, 
        n = 40.

        Compute DL_simple and DL_complex in bits:

            ln_2 = 0.693147
            DL_simple = [100 / 0.693147] + [1 * log(40)] / (2 * 0.693147)
                     = 144.269 + [3.688879]/(1.386294) ≈ 144.269 + 2.661 ≈ 146.93 bits
            DL_complex = [99.5 / 0.693147] + [2 * log(40)] / (2 * 0.693147)
                       = 143.54 + [7.377758]/(1.386294) ≈ 143.54 + 5.322 ≈ 148.86 bits
            diff = 146.93 - 148.86 = -1.93 bits (which is less than 2)

        Decision: choose the simple model (2 subclones).

        The postdoc may not like this. What can they do?
            - Check the model: perhaps the 2-subclone model was not fitted properly? They might try a different algorithm.
            - Check the data: are there outliers? Remove them and refit.
            - Adjust the model: include a way to account for sequencing errors, which might change the likelihood.
            - Note: They cannot change the threshold arbitrarily. But if they find a flaw in the model specification and refit, they can rerun the procedure.

    Example (b): Clustering (4 vs 5 groups)
        lnL_simple (k=4) = -500, k_simple = 83 (for d=10: 4*20 + 3 = 83)
        lnL_complex (k=5) = -450, k_complex = 104 (5*20 + 4 = 104)
        n = 28

        DL_simple = [500 / 0.693147] + [83 * log(28)] / (2 * 0.693147)
                 ≈ 721.35 + [83 * 3.332205]/(1.386294) ≈ 721.35 + [276.573]/1.386294 ≈ 721.35 + 199.5 ≈ 920.85 bits
        DL_complex = [450 / 0.693147] + [104 * log(28)]/(2 * 0.693147)
                   ≈ 649.35 + [346.549]/1.386294 ≈ 649.35 + 250.0 ≈ 899.35 bits
        diff = 920.85 - 899.35 = 21.5 bits (>=2)

        Decision: choose the complex model (5 clusters).

    This matches the collaborator's hope that the fifth cluster is real.

  Final Note: The procedure is a guide. It is not a substitute for scientific judgment, but it provides a principled way to incorporate data compression in model selection.
answer: |-
  ### Minimum Description Length (MDL) Decision Procedure for Model Selection  
  *Designed for wet-lab researchers using R/spreadsheets in <1 hour.  
  Bracketed labels: [Derived] (from MDL theory), [Estimated] (from data), [Asserted] (pragmatic rule).*

  ---

  #### **Decision Procedure**  
  **Inputs**: Two candidate models (simple \(M_s\), complex \(M_c\)), dataset \(D\), sample size \(n\).  
  **Output**: Choose \(M_s\) or \(M_c\), or flag for human judgment.  

  1. **Specify candidate models**  
     - *Question*: Are \(M_s\) and \(M_c\) fully defined? This includes:  
       - Likelihood function \(\mathcal{L}(D \mid \theta)\) for parameters \(\theta\).  
       - Number of parameters \(k_s\), \(k_c\) [Asserted].  
     - *Sufficient answer*: Yes, with code to compute \(\mathcal{L}\) (e.g., R `dnorm()`, `dmultinom()`, or clustering log-likelihood).  
     - *Terminate if*: Models are incomparable (e.g., different variable sets). Revise models.  

  2. **Compute log-likelihoods**  
     - *Question*: What are \(\ln \mathcal{L}_s\) and \(\ln \mathcal{L}_c\)? [Estimated].  
     - *Method*: Fit \(M_s\) and \(M_c\) to \(D\) (e.g., `optim()`, EM algorithm, `kmeans()` with likelihood).  
     - *Terminate if*: Either model fails to converge (e.g., singularities). Fix model specification.  

  3. **Approximate description lengths (DL)**  
     - *Formula*:  
       \[
       \text{DL}(M) = \underbrace{\left[ -\ln \mathcal{L}(D \mid \hat{\theta}) \right]}_{\text{Fit (nats)}} + \underbrace{\left[ \frac{k}{2} \ln n \right]}_{\text{Complexity penalty (nats)}} 
       \]  
       Convert to bits: \(\text{DL}_{\text{bits}}(M) = \frac{\text{DL}_{\text{nats}}(M)}{\ln 2}\) [Derived].  
     - *Why this formula?*: Asymptotic MDL \(\approx\) BIC [Derived]. Not exact Kolmogorov, but computable.  
     - *Honesty*:  
       - \(\text{DL}_{\text{bits}}\) is sensitive to priors/coding schemes [Asserted]. We assume uniform priors.  
       - Kolmogorov complexity has an unknown additive constant. We ignore it (all models equally affected).  

  4. **Compare \(\text{DL}_{\text{bits}}(M_s)\) and \(\text{DL}_{\text{bits}}(M_c)\)**  
     - *Question*: Is \(\Delta \text{DL} = \text{DL}_{\text{bits}}(M_s) - \text{DL}_{\text{bits}}(M_c) \geq 2\)?  
     - *Decision rule* [Asserted]:  
       - If \(\Delta \text{DL} \geq 2\): **Choose \(M_c\)** (complex model compresses better).  
       - If \(\Delta \text{DL} < 2\): **Choose \(M_s\)** (complexity cost > fit gain).  
     - *Why 2 bits?*: \(\Delta \text{DL} \geq 2\) ≈ likelihood ratio \(> e^2\). Arbitrary but stringent (avoids false complexity).  

  5. **Override for scientific values**  
     - *Question*: Does scientific context justify overriding the DL decision?  
       - *Examples*: \(M_c\) has better interpretability, clinical utility, or biological plausibility.  
     - *Hand to human if*:  
       - \(\Delta \text{DL} \in [-5, 2)\) (weak evidence).  
       - \(M_c\) adds a small, high-value group (e.g., putative new cell type).  

  ---

  #### **Case Studies**  
  *All calculations in R: [DL_bits = (-lnL + (k/2)*log(n)) / log(2)]*.  

  **Case (a): Tumour subclones (2 vs. 3 clones)**  
  - **Data**: 40 loci, VAFs modeled as binomial mixtures.  
  - **Models**:  
    - \(M_s\) (2 clones): \(k_s = 3\) (2 proportions + 1 genotype parameter), \(\ln \mathcal{L}_s = -101.2\).  
    - \(M_c\) (3 clones): \(k_c = 5\) (3 proportions + 2 genotype parameters), \(\ln \mathcal{L}_c = -100.5\).  
  - **DL calculation** (\(n = 40\)):  
    - \(\text{DL}_{\text{bits}}(M_s) = \frac{-(-101.2) + (3/2)\ln 40}{\ln 2} = \frac{101.2 + 5.53}{0.693} \approx 153.9\ \text{bits}\).  
    - \(\text{DL}_{\text{bits}}(M_c) = \frac{-(-100.5) + (5/2)\ln 40}{\ln 2} = \frac{100.5 + 9.22}{0.693} \approx 158.3\ \text{bits}\).  
    - \(\Delta \text{DL} = 153.9 - 158.3 = -4.4 < 2\).  
  - **Decision**: Choose \(M_s\) (2 subclones).  
  - **Postdoc’s objection**: Mechanistic story requires 3 clones.  
    - *Legitimate actions within procedure*:  
      1. Check likelihoods: Ensure no fitting errors (e.g., local maxima).  
      2. Adjust \(k\): If genotypes are fixed (not estimated), \(k_c = 2\) → \(\Delta \text{DL} = -0.9\), still \(<2\).  
      3. **Override**: Argue 3 clones are biologically critical (human judgment).  

  **Case (b): RNA-seq clustering (4 vs. 5 groups)**  
  - **Data**: 28 patients, 10 PCs from RNA-seq.  
  - **Models**: Gaussian mixtures.  
    - \(M_s\) (4 groups): \(k_s = 4 \times 20 + 3 = 83\) (4×(10 mean + 10 variance) + 3 proportions), \(\ln \mathcal{L}_s = -498.1\).  
    - \(M_c\) (5 groups): \(k_c = 5 \times 20 + 4 = 104\), \(\ln \mathcal{L}_c = -478.2\).  
  - **DL calculation** (\(n = 28\)):  
    - \(\text{DL}_{\text{bits}}(M_s) = \frac{-(-498.1) + (83/2)\ln 28}{\ln 2} = \frac{498.1 + 199.2}{0.693} \approx 1005.9\ \text{bits}\).  
    - \(\text{DL}_{\text{bits}}(M_c) = \frac{-(-478.2) + (104/2)\ln 28}{\ln 2} = \frac{478.2 + 249.0}{0.693} \approx 1049.2\ \text{bits}\).  
    - \(\Delta \text{DL} = 1005.9 - 1049.2 = -43.3 < 2\).  
  - **Decision**: Choose \(M_s\) (4 groups).  
  - **But**: Fifth group (\(n=5\)) is biologically interesting.  
    - **Human override**: Keep 5 groups. DL penalty dominates due to high \(k_c\), but small clusters may justify complexity.  

  ---

  #### **What This Procedure Cannot Do**  
  1. **Resolve all disagreements**:  
     - Two researchers may:  
       - Disagree on \(k\) (e.g., is a genotype parameter free or fixed?).  
       - Get different \(\ln \mathcal{L}\) from fitting algorithms (e.g., random seeds in clustering).  
     - *Requires external validation* (e.g., PCR for subclones, marker genes for clusters).  

  2. **Detect structural errors**:  
     - If both models are **misspecified** (e.g., VAFs not binomial, clusters not Gaussian), DL may favor the *wrong* simple model.  
     - *Solution*: Use goodness-of-fit tests (e.g., posterior predictive checks).  

  3. **Handle non-parametric models**:  
     - MDL approximation fails for models without clear \(k\) (e.g., neural networks).  
     - *Stick to*: Mixtures, regressions, clustering with likelihoods.  

  4. **Replace scientific judgment**:  
     - DL quantifies compression, not biological truth.  
     - A model with \(\Delta \text{DL} < 2\) may still be chosen if:  
       - It enables clinical action.  
       - Reviewers demand standard approaches.  

  ---

  **Final Advice**: Use this to temper arguments, not end them. When DL is indecisive (\(\Delta \text{DL} \in [-5, 2)\)), default to simplicity unless biology overrules. Document overrides.
