  We are designing a decision procedure based on the Minimum Description Length (MDL) principle. The core idea is that we choose the model that minimizes the description length of the data, which is the sum of:
    1. The description length of the model (complexity).
    2. The description length of the data given the model (fit).

  However, we must be practical and recognize that we cannot compute the exact Kolmogorov complexity. Instead, we will use approximations and be explicit about the gaps.

  The procedure will be structured as a series of questions. We must also be clear about when we are making an assertion (a rule we set) or an estimate (from data) or derived (from theory).

