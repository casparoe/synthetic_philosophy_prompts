    - The log-likelihood must be computed correctly. For example, in clustering, if we use a Gaussian mixture, we must use the log-likelihood of the entire data under the mixture.

  Code for R:

    We can write a function:

      mdl_decision <- function(lnL_simple, k_simple, lnL_complex, k_complex, n) {
          ln_2 = log(2)   # natural log of 2

          # Compute DL in bits for simple model
          term1_simple = - lnL_simple / ln_2
          term2_simple = (k_simple * log(n)) / (2 * ln_2)
          DL_simple = term1_simple + term2_simple

          term1_complex = - lnL_complex / ln_2
          term2_complex = (k_complex * log(n)) / (2 * ln_2)
          DL_complex = term1_complex + term2_complex

          diff = DL_simple - DL_complex   # positive if complex is better

          if (diff >= 2) {
              decision = "complex"
          } else {
              decision = "simple"
          }

          return(list(decision = decision, 
                      DL_simple = DL_simple, 
                      DL_complex = DL_complex, 
                      diff = diff))
      }

    Then for case (a) with:
          lnL_simple = -100   # log-likelihood for 2-subclone
          k_simple = 1
          lnL_complex = -99.5 # for 3-subclone
          k_complex = 2
          n = 40

    We get:
          DL_simple = (- (-100) ) / ln_2 + (1 * log(40)) / (2 * ln_2) 
                    = 100 / 0.693147 + (1*3.688879) / (2*0.693147)
                    ≈ 144.269 + (3.688879)/(1.386294) ≈ 144.269 + 2.66 ≈ 146.93 bits

          DL_complex = (- (-99.5)) / 0.693147 + (2 * 3.688879) / (2 * 0.693147)
                     = 99.5 / 0.693147 + 3.688879 / 0.693147
                     ≈ 143.54 + 5.32 ≈ 148.86 bits

          diff = 146.93 - 148.86 = -1.93   (negative, so less than 2 and we choose simple)

    Therefore, the decision is "simple".

    For case (b): 
          We need lnL for k=4 and k=5, and the parameters.

          Let's assume:
            For k=4: lnL4 = -500, k4 = 4*2*10 + 3 = 83? But wait: in the Gaussian mixture with diagonal covariance, the number of parameters per cluster is d (for the mean) and d (for the variances) and one for the mixing proportion per cluster (but we have k-1 for the mixing proportions). Actually, the mixing proportions: k-1. So total parameters: k * (2*d) + (k-1). For d=10, k=4: 4*20 + 3 = 83.

            For k=5: lnL5 = -450 (if the improvement is 50 in log-likelihood), k5 = 5*20 + 4 = 104.

