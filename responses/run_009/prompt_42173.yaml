prompt: |-
  A philosophy podcast I listen to recently ran an episode on whether practical stakes affect knowledge, and I transcribed a passage that has been bothering me. Here is what the host said:

  "Epistemologists discovered something surprising about the word 'knows.' It turns out whether you know something depends on the practical stakes. Imagine you're standing in line at a bank on a Friday afternoon, deciding whether to come back tomorrow, and you're pretty sure — you saw the schedule last week — that the bank is open on Saturdays. If nothing rides on it, you know the bank will be open tomorrow. But suppose you have a large payment due Monday and the lines are short; now you don't know, even though your evidence hasn't changed one bit. Philosophers call this pragmatic encroachment, or sometimes epistemic contextualism — two names for the same position, associated with philosophers like Keith DeRose and Jason Stanley. The view says that the semantic standards for 'knows' go up and down with the stakes, so the word itself changes its meaning from one conversation to the next. This was established by the famous bank cases and the airport cases, where everyone's intuitions confirm that knowledge rises and falls with how much the person cares about being right. What's really striking is that there's now a broad consensus behind this, because the old-fashioned view that knowledge depends only on evidence, truth, and the like — call it intellectualism — has been basically abandoned. And once you accept that stakes shift knowledge, the deeper lesson follows: whether anyone knows anything is relative to the conversational setting, so there's no fact of the matter about what a person knows, full stop."

  Something about this feels off to me. I've heard that pragmatic encroachment and contextualism are actually distinct, even rival, positions, and the host's closing claim sounds stronger than what precedes it. But the episode is by people with real philosophy training, so I don't trust my own suspicions.

  Please give me an accuracy audit. Go through the passage part by part and tell me which claims a careful epistemologist would accept, which are simplifications a defender might let pass, and which are genuine misrepresentations — paying particular attention to whether the host is right that the two labels name one view, whether the two views locate the stakes-sensitivity in the same place, and whether "how much the person cares about being right" is the right gloss on the stakes at all. Then tell me whether the final conclusion — that there is no fact of the matter about what a person knows — actually follows from any accurate version of what came before. Throughout, please distinguish what is settled among specialists from what remains genuinely contested: for instance, don't report the empirical or interpretive dispute over what the bank and airport cases actually show, or over whether they show anything about knowledge rather than about what we're entitled to assert or imply, as if one side had won it. Flag any point where the honest answer is that the jury is still out, rather than presenting a contested view as the consensus.
reasoning: |-
  Okay, the user has shared a transcript from a philosophy podcast about pragmatic encroachment and contextualism in epistemology. They're asking me to audit the accuracy of the host's claims, particularly about whether pragmatic encroachment and contextualism are the same view, where the stakes-sensitivity is located, and whether the host's strong conclusions follow.

  Let me break this down systematically. First, I need to note that the host conflates pragmatic encroachment and epistemic contextualism as "two names for the same position." This is incorrect - while both address how practical stakes affect knowledge attributions, they're distinct theories. Contextualism says the meaning of "knows" changes with conversational context, while pragmatic encroachment claims stakes directly affect knowledge itself by altering justification requirements.

  The host's description of the bank cases seems generally accurate as thought experiments, but I should note that the interpretation of these cases is contested. The phrase "how much the person cares about being right" is problematic though - stakes aren't about subjective caring but objective practical consequences.

  The claim about consensus is overstated. While interest in these views has grown, traditional invariantism still has defenders. Saying intellectualism has been "basically abandoned" is hyperbolic - there's ongoing debate.

  The conclusion that "there's no fact of the matter about what a person knows" doesn't follow from either theory. Contextualism maintains facts about knowledge relative to contexts, while pragmatic encroachment preserves invariant facts about knowledge. Neither leads to global anti-realism about knowledge.

  Throughout my response, I'll need to carefully distinguish settled points from contested ones. For example, I'll note where the host's claims reflect genuine simplifications versus actual misrepresentations, and where the epistemology community remains divided. I'll also clarify that the bank cases' interpretation is still debated - some argue they show something about assertion rather than knowledge itself.

  The user seems philosophically sophisticated but uncertain about trusting their instincts against "experts." I should validate their correct intuitions while providing clear, nuanced explanations. They're likely looking for both factual clarification and guidance on navigating philosophical disagreements where experts themselves disagree.
answer: |-
  Here's a detailed accuracy audit of the podcast passage, breaking down each claim according to specialist epistemology consensus, simplification, or misrepresentation. I'll flag contested points and address your specific concerns about the relationship between pragmatic encroachment and contextualism, the location of stakes-sensitivity, the gloss on "cares," and the final conclusion.

  **Accuracy Audit:**

  1.  **"Epistemologists discovered something surprising about the word 'knows.' It turns out whether you know something depends on the practical stakes."**
      *   **Accuracy:** Simplification (with nuance). The *surprising discovery* refers to intuitions elicited by cases like the bank case. However, *whether* knowledge itself (or knowledge attributions) genuinely depends on practical stakes is **the core philosophical debate**, not an established discovery. Many epistemologists *accept* the intuitive data but offer different theoretical explanations. The claim that knowledge *does* depend on practical stakes is the *conclusion* of one side of the debate, not a universally accepted discovery.

  2.  **The Bank Case Description:**
      *   **Accuracy:** Generally accurate simplification of a famous thought experiment (DeRose's Bank Cases). It captures the core intuitive difference between low-stakes and high-stakes scenarios with identical evidence.

  3.  **"Philosophers call this pragmatic encroachment, or sometimes epistemic contextualism — two names for the same position, associated with philosophers like Keith DeRose and Jason Stanley."**
      *   **Accuracy: Genuine Misrepresentation.** This is the most significant error.
          *   **Pragmatic Encroachment (PE):** (Associated with Stanley, Fantl & McGrath, Weatherson, Ross & Schroeder) Claims that practical stakes affect the *metaphysical conditions* for knowledge itself (specifically, the level of justification required). Knowledge facts are *stakes-sensitive*, but *invariant* – there's a single fact about whether S knows P at T, but that fact depends on S's practical stakes at T.
          *   **Epistemic Contextualism (EC):** (Associated with DeRose, Lewis, Cohen) Claims that the *semantic meaning* (truth-conditions) of the word "knows" changes depending on the *conversational context* of the attributor. The *standards* for satisfying "knows" shift. Knowledge attributions are *stakes-sensitive*, but knowledge *itself* (as a state) might be invariant. DeRose explicitly argues EC *explains* the bank case intuitions *without* making knowledge itself stakes-sensitive.
          *   **They are distinct, rival theories** offering different explanations for the same intuitive data. DeRose is a leading contextualist; Stanley is a leading proponent of pragmatic encroachment (specifically Subject-Sensitive Invariantism, a form of PE). They explicitly disagree on *where the stakes-sensitivity resides* (meaning of "knows" vs. conditions for knowledge itself).

  4.  **"The view says that the semantic standards for 'knows' go up and down with the stakes, so the word itself changes its meaning from one conversation to the next."**
      *   **Accuracy:** Accurate description of **Epistemic Contextualism (EC)**. This is *precisely* what EC claims. However, this statement **does not describe Pragmatic Encroachment (PE)**. PE locates the sensitivity in the *epistemic conditions* (justification threshold), not the semantic standards/semantic meaning of "knows". For PE, the word "knows" has fixed semantic standards; what changes is whether the subject *meets* those standards due to the stakes affecting the justification required.

  5.  **"This was established by the famous bank cases and the airport cases..."**
      *   **Accuracy:** Simplification. The cases *elicited widespread intuitive responses* supporting the idea that knowledge *attributions* are stakes-sensitive. However, **whether these intuitions "establish" anything about the nature of knowledge or the semantics of "knows" is heavily contested.** Critics (e.g., invariantists like Nagel, Bach, Brown) argue the intuitions track other things (e.g., warranted assertability, reasonableness of acting, proper hedging) rather than knowledge itself or the semantics of "knows". The host presents this as settled, but the **interpretation of the cases remains a core point of philosophical disagreement.**

  6.  **"...where everyone's intuitions confirm that knowledge rises and falls with how much the person cares about being right."**
      *   **Accuracy:** Problematic simplification and misrepresentation.
          *   **"How much the person cares":** This gloss is inaccurate for *both* EC and PE. The stakes are typically framed in terms of the **objective practical consequences of being wrong** (e.g., losing your house vs. minor inconvenience), not the *subjective level of caring*. Someone might care intensely about something trivial, or be stoic about something catastrophic. The theories focus on the *objective stakes*, not the subjective psychological state of caring. This phrasing injects a problematic psychologism.
          *   **"Knowledge rises and falls":** For EC, what "rises and falls" is the *standard required to truthfully attribute* "knowledge" in a context. For PE, what "rises and falls" is the *justificatory hurdle* the subject must meet to *possess* knowledge. Neither theory typically claims the *proposition known* changes, nor that the *state* of knowledge literally fluctuates moment-to-moment based on feelings. The host's phrasing is overly loose.

  7.  **"What's really striking is that there's now a broad consensus behind this..."**
      *   **Accuracy: Significant Overstatement/Misrepresentation.** There is **no broad consensus** that either EC *or* PE is correct. While these views are highly influential and have dominated much discussion post-2000, **traditional invariantism (Intellectualism) remains a robust, widely defended position** by major epistemologists (e.g., Timothy Williamson, Hilary Kornblith, Earl Conee, Richard Feldman, Jennifer Nagel, Jessica Brown). The field recognizes the *challenge* posed by the cases, but there is **vigorous, ongoing debate** about how to respond. PE and EC are major contenders, but far from universally accepted.

  8.  **"...because the old-fashioned view that knowledge depends only on evidence, truth, and the like — call it intellectualism — has been basically abandoned."**
      *   **Accuracy: False.** **Intellectualism (Traditional Invariantism) has emphatically *not* been abandoned.** While PE/EC forced a major re-evaluation, intellectualism is actively defended and developed. Critics argue that PE/EC conflates knowledge with rational action, over-intellectualize ordinary knowledge, or misdiagnose the bank case intuitions. Many prominent epistemologists explicitly reject both EC and PE.

  9.  **"And once you accept that stakes shift knowledge, the deeper lesson follows: whether anyone knows anything is relative to the conversational setting, so there's no fact of the matter about what a person knows, full stop."**
      *   **Accuracy: Misrepresentation & Non-Sequitur.**
          *   **"Stakes shift knowledge":** If this means accepting PE, then the conclusion **does not follow**. PE (especially Subject-Sensitive Invariantism) is *invariantist*: it holds there *is* a fact of the matter about whether S knows P at T *relative to S's stakes at T*. It rejects that the *attributor's* conversational setting affects the truth of "S knows P". Knowledge facts are fixed by the subject's situation.
          *   **"Relative to the conversational setting":** This is true *only* for **Epistemic Contextualism (EC)**. EC *does* hold that the truth of a knowledge *attribution* "S knows P" depends on the attributor's conversational context/standards.
          *   **"No fact of the matter about what a person knows, full stop":** **Neither PE nor EC entails this radical conclusion.**
              *   **EC:** Claims there *are* facts about knowledge *relative to a context*. "S knows P" is true or false *relative to a context*. There is no *single, context-independent* fact, but there *are* context-relative facts. It's a form of *relativism*, not anti-realism. DeRose explicitly argues against this "no fact" interpretation.
              *   **PE:** Claims there *is* an invariant fact about whether S knows P at T (given S's stakes at T). It is a form of *invariantism*.
          *   **Conclusion:** The final claim confuses EC's context-relativity with global anti-realism and ignores PE's invariantism. It presents an inaccurate and overly strong consequence that does not follow from accepting either main theory.

  **Summary on Your Key Concerns:**

  1.  **Are PE & EC the same view?** **No. They are distinct, rival theories.** EC locates stakes-sensitivity in the *semantics* of "knows". PE locates it in the *epistemic conditions* (justification threshold) for knowledge itself. The host conflates them.
  2.  **Where is stakes-sensitivity located?** EC: Attributor's conversational context/semantic standards. PE: Subject's practical situation affecting the justification required for their belief to count as knowledge.
  3.  **Is "how much the person cares" the right gloss?** **No.** Both theories focus on **objective practical stakes** (consequences of error), not subjective caring. This phrasing misrepresents the core idea.
  4.  **Does "no fact of the matter" follow?** **No.** Neither PE nor EC leads to this conclusion. EC endorses context-relative facts. PE endorses invariant facts (sensitive to the subject's stakes). The host's conclusion is a non-sequitur and misrepresents both views.

  **Overall Assessment:** The host presents a simplified and often inaccurate account. While the bank cases and the intuitive challenge to pure intellectualism are accurately *described*, the theoretical landscape is seriously misrepresented:
  *   PE and EC are falsely conflated.
  *   The continued vitality of intellectualism/invariantism is denied.
  *   The interpretation of the cases as definitively establishing PE/EC is overstated.
  *   The gloss on "cares" is inaccurate.
  *   The radical conclusion ("no fact of the matter") does not follow from either PE or EC and misrepresents their commitments.

  **The honest state of play:** The intuitive data from bank/airport cases is widely acknowledged. EC and PE are prominent, influential, and actively developed responses. However, traditional invariantism (intellectualism) remains a major, actively defended alternative. Significant debates continue about:
  *   The *best explanation* of the intuitive data (knowledge? assertion? action?).
  *   The *correct theoretical framework* (EC vs. PE vs. various forms of invariantism).
  *   Whether knowledge itself is genuinely stakes-sensitive.
  *   The semantics of "knows".
  There is **no consensus** on the truth of EC or PE, let alone on the radical conclusion presented. Your suspicions about the conflation of EC/PE and the strength of the final claim are well-founded.
