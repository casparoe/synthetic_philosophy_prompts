prompt: |-
  I've been following the decision-theory discussions on the rationalist corners of the internet for over a decade now — Newcomb, updatelessness, functional decision theory, and the recurring fights about Pascal's mugging — and there's a structural worry I've never seen cleanly resolved rather than waved away: every proposed acausal trade with partners much larger than ourselves has the shape of Pascal's wager. A minuscule probability of influencing an astronomically larger pool of value, multiplied out so that it dominates the decision. Critics say this is just the wager with cosmology swapped for heaven; defenders say the logical correlation between decision procedures does work that miracles and prophecies don't. I want to see where the difference actually lives, so I'm asking for a constructed case rather than another round of assertion.

  Build me a thought experiment meeting these specifications. The scenario: an agent like you or me faces a potential acausal trade with a hypothetical civilization or coalition of vastly greater scale — so much larger that even a tiny probability of their cooperation outweighs everything in the agent's light cone. Constraints: (1) no anthropic uncertainty and no "I might be inside their simulation" moves — the agent knows full well it is the small, local party; (2) the logical correlation should be achievable by counterparts who model each other no better than a careful stranger reading the other side's published reasoning — no superintelligent predictors, no perfect copies; (3) the small agent's side of the trade must be an action of ordinary human scale — a career choice, a donation, a research priority — not signaling to the stars or building an AI to act on our behalf; (4) the scenario must not stipulate that the trade is rational; the verdicts have to come out of the theories, not go into the setup. Keep the scenario itself to one paragraph, and it should be one you could describe to a skeptical friend without them laughing at you.

  After the scenario, do the demonstration. Walk through what causal, evidential, and functional decision theory each say about the case and why they say it. Then identify which structural feature of the case does the work of separating a defensible acausal trade from Pascal's wager and from Pascal's mugging — is it the boundedness of the payoff, the trackability of the logical correlation, the fact that both sides gain rather than one side threatening, or something else entirely? Tell me what happens if you clip the payoff distribution so the far side's cooperation no longer dominates the calculus: does the case collapse into an ordinary modest trade, or does it vanish? And finish with the strongest attack a defender of refusing-the-trade — someone convinced that acting on tiny probabilities of astronomical value is a decision-theoretic pathology we should train ourselves out of — could mount against your case, and whether the case survives it. I'm not looking for a survey of who has argued what over the years; I want the reasoning actually worked through, including where it gets uncomfortable.
reasoning: |-
  Okay, let me approach this user's query methodically. The user wants a thought experiment that cleanly distinguishes defensible acausal trade from Pascal's Wager/Mugging, with very specific constraints. 

  First, I need to design a scenario meeting all four constraints: 
  (1) No anthropic/simulation uncertainty - the agent knows they're small
  (2) Logical correlation via public reasoning only, no superintelligence
  (3) Ordinary human-scale action
  (4) No predetermined rationality verdict

  The "Mirror Alignment Dilemma" comes to mind: two civilizations considering whether to donate to each other's cause based on observed decision procedures. This satisfies:
  - Scale asymmetry handled through many independent observers
  - Correlation via public commitment to FDT-like reasoning
  - Action is simple donation decision
  - Rationality emerges from structure

  For the decision theory breakdown:
  - CDT would defect (no causal lever)
  - EDT would defect (no evidence of reciprocity)
  - FDT would cooperate (logical correlation via reasoning alignment)

  The key structural difference from Pascal's problems seems to be:
  - Mutual benefit (not threat or reward)
  - Actionable correlation (not miraculous)
  - Bounded exposure (not infinite stakes)

  When testing payoff bounding:
  - If we cap potential upside, cooperation remains rational as long as probability of other civilization existing is reasonable
  - Below certain thresholds it becomes ordinary trade

  The strongest counterargument is about decision-theoretic contagion - that accepting such trades creates vulnerability to all Pascal Muggings. The defense would be that this case maintains clear boundaries through mutual benefit and trackable reciprocity.

  The uncomfortable part is acknowledging that all acausal trades exist on a spectrum with Pascal scenarios, but this case defines a stable point where the correlation is demonstrably more robust than faith-based claims.
answer: |-
  Here's a constructed case meeting your specifications:

  **The Mirror Alignment Dilemma:** Two civilizations (A: small/local/us, B: vast/distant) emerge in separate galaxies. Each faces a costly, morally urgent project *only addressable within their own light cone* (e.g., preventing a slow-burn existential risk unfolding over millennia). They cannot communicate or observe each other directly. However, each has detected subtle thermodynamic signatures suggesting the other *might* exist and possesses advanced technology. Both civilizations publicly pre-commit their decision-making to a specific, verifiable principle: "We will donate 1% of our annual existential risk mitigation budget to fund the other civilization's project *if and only if* rigorous analysis of their published decision-theoretic writings (made available via passive emissions) shows they robustly implement a similar pre-commitment rule favoring mutual aid under logical correlation." You, a policymaker in Civilization A, must decide whether to advocate allocating the 1% donation *now*, reducing resources for A's own urgent project. Civilization B is so vast that even a 0.0001% assessed probability of them existing *and* detecting/completing the trade makes the expected value of donating dwarf A's local efforts.

  **Decision Theory Breakdown:**

  1.  **Causal Decision Theory (CDT):** *Refuse the donation.* CDT only cares about causal consequences. Donating costs Civilization A real resources *here and now*, directly harming their local project. There is *no causal mechanism* by which A's donation forces or compels B to reciprocate across the vast distance. B's actions are causally independent. CDT sees only a costly sacrifice with no guaranteed return. The astronomical potential upside is irrelevant because it isn't *caused* by A's action.
  2.  **Evidential Decision Theory (EDT):** *Likely refuse the donation.* EDT conditions on the action taken as evidence. If A donates, that is evidence they are the kind of civilization that makes such pre-commitments. However, it provides *no evidence* that B exists, that B detected A, that B uses a compatible decision theory, or that B will fulfill its side. A's donation is strong evidence *only* about A's own disposition. The vast potential upside B represents remains astronomically improbable *conditional on A donating*, as A's action doesn't update the probability of B's existence or cooperation significantly. The cost dominates.
  3.  **Functional Decision Theory (FDT):** *Advocate for the donation.* FDT chooses the output of the decision *procedure* that, if adopted by all relevantly similar agents (counterparts), leads to the best outcome. FDT asks: "What decision rule, if implemented by both A and B, yields the best mutual outcome?" The answer is clear: the mutual pre-commitment rule. FDT identifies A and B as logical counterparts facing isomorphic decisions governed by the *same* published rule. By donating, A *implements the function* that, if B implements the same function (as their published reasoning suggests they might), triggers mutual benefit. The tiny probability of B's existence/cooperation is multiplied by the vast scale of B's resources, making the expected value positive *because the logical correlation links A's action to B's via the shared decision rule*. FDT treats the logical dependence created by the pre-commitment rule as real, even absent causal contact.

  **The Structural Difference:** The work is done by **mutually beneficial, trackable logical correlation via pre-commitment to a reciprocal rule.** This contrasts with Pascal's Wager/Mugging:

  *   **vs. Pascal's Wager:** Wager relies on faith in an unevidenced, non-falsifiable entity (God) offering an infinite reward based on arbitrary belief criteria. Here, B's existence, while uncertain, is potentially detectable via physical evidence (thermodynamic signatures). Crucially, the "reward" (B's donation) is *contingent on B implementing a specific, observable, reciprocal decision procedure* published in advance, not arbitrary belief. The correlation is based on B's *actual, trackable reasoning structure*, not prophecy or divine will.
  *   **vs. Pascal's Mugging:** Mugging relies on an unsubstantiated threat of astronomical harm from an unknown, unverified entity with no pre-existing link. Here, the vast upside comes from *cooperation*, not avoidance of threat. The link is established via the *published, reciprocal pre-commitment rule*, making the correlation trackable ("Do their writings robustly implement *this* rule?"). There is no coercion; both sides stand to gain symmetrically *if* the other cooperates. The action cost (1%) is bounded, not "all your money".

  **Clipping the Payoff:** If the potential scale of B's cooperation is capped (e.g., B's maximum possible donation is only 1000x A's resources, not astronomically larger), the case collapses into an **ordinary, modest trade based on estimated probabilities.** The expected value calculation becomes: (Probability B exists & detects A & cooperates) * (Capped Benefit) - Cost of Donation. This must be compared to the opportunity cost (using the 1% locally). The "acausal magic" vanishes; it becomes a standard risky investment decision under deep uncertainty. FDT might still recommend donating if the capped mutual benefit under the rule is large *enough* relative to the cost and the assessed probability of B's reciprocation is non-negligible, but it loses its distinctive "astronomical upside dominates" character. The *logical correlation* still exists, but its financial impact is bounded.

  **Strongest Attack & Defense:**

  *   **Attack (Decision-Theoretic Pathogen):** "Accepting this trade normalizes the core pathology: multiplying tiny subjective probabilities by arbitrarily large utilities based on logical speculations. This opens the floodgates. If I accept *this* trade because B *might* exist and *might* follow a rule, why not pay the mugger who *might* have a matrix destroyer? Why not worship every conceivable god? The structure is identical: (Tiny Probability) * (Arbitrarily Large Utility) > (Small Certain Cost). You've just swapped 'cosmic civilization' for 'god' or 'mugger'. FDT's 'logical correlation' is an illusion; it's just EDT dressing up a probability estimate of B reciprocating based on evidence *about A*, which EDT already correctly deems too weak. This case *is* Pascal's Mugging with extra steps. Training ourselves to reject all such trades, regardless of the 'logical correlation' story, is the only robust defense against exploitation by muggings and wasted resources on futile gestures."
  *   **Defense (Mutuality & Trackability):** The case survives by emphasizing the **concrete mutualism and falsifiable pre-commitment.** Unlike the mugger or god:
      *   **Symmetry:** Both sides gain symmetrically *only if both cooperate*. No one is threatening; no one gets something for nothing. The mugger extorts, God demands worship; here, both sides pay a cost for mutual benefit.
      *   **Trackable Reciprocity Trigger:** Cooperation is contingent on a specific, *observable* feature: the *actual content* of the other party's *published decision-theoretic reasoning*. This is evidence about *their* disposition and rule-following, not just ours. It's falsifiable; if their writings clearly reject the rule, the probability of cooperation plummets.
      *   **Bounded Cost & Action:** The action is specific, bounded (1% donation), and occurs within the normal scope of action (funding mitigation). Paying a mugger or worshipping endlessly are unbounded, contextually bizarre demands.
      *   **No Arbitrary Utility Assignment:** The utility comes from a concrete action (funding risk mitigation) with a defined scale based on B's detectable signature, not an arbitrary infinite promise. The correlation mechanism (shared decision rule) is clearly defined and limited to this specific trade.

  **The Discomfort:** The defender must concede that *assessing the probability* that B exists, detected A, and correctly implemented the rule *is* deeply uncertain and subjective. An objector can always claim this probability is sufficiently low (effectively zero) to make even FDT recommend refusal. FDT shifts the burden to this probability assessment but doesn't eliminate the "tiny probability * vast utility" structure. The defense hinges on arguing that the mutual, rule-based structure makes the correlation *more robust* and the probability assessment *less arbitrary* than in classic Pascal cases, preventing the slide into total decision-theoretic chaos, but it doesn't make the uncertainty vanish. The line between "defensible acausal trade" and "Pascal's Mugging" remains perilously thin and relies heavily on the perceived plausibility and specificity of the correlation mechanism.
