  2. **Phenomenal Concept Strategy**: Mario might gain new ways to conceptualize his existing experiences. The key is whether connecting first-person qualia to third-party descriptions constitutes genuine new knowledge under this view.

  3. **Jackson's Original Position**: This is the crux. If Mary gained non-physical knowledge, does Mario gain non-physical knowledge too? The asymmetry question is vital - does direction matter? Perhaps the physical facts Mary learned were incomplete, while Mario's experiences were always "complete" in some sense. Or maybe the knowledge argument only runs one way.

