  We are designing an in-class activity for a 90-minute session with 14 students. The activity has three phases: individual commitment, small group discussion with convergence and scoring, and whole-class debrief. The goal is to make students feel the fluidity of concepts and the perception-like nature of analogy-making as in Hofstadter's Copycat.

  Activity Structure:

  Phase 1: Individual Commitment (10 minutes)
  - Distribute a handout with 5 letter-string problems (see below for the sequence).
  - For each problem, students write:
     (a) Their answer (the transformed string)
     (b) A one-sentence reason (the conceptual description of the change)

  Phase 2: Small Group Argument and Convergence (30 minutes)
  - Divide the class into groups of 3-4 (so about 4 groups).
  - Each group must converge on one answer per problem and write a one-sentence description of the change that licenses their answer.
  - Scoring Rule: Groups earn 1 point per problem for a description that:
     (a) Correctly identifies the relevant aspect of the source change (from the example) and 
     (b) Clearly articulates any slippage (if necessary) in applying that change to the target.
  - The instructor circulates to help groups focus on the quality of the description (not the string itself). 
  - Note: The scoring is applied by the instructor during the group work (live). The instructor can quickly judge if the description captures the key conceptual move. We are looking for descriptions that show awareness of the slippage (if any) and the reasoning behind it.

  Phase 3: Whole-Class Round and Debrief (40 minutes, including 10 minutes for the deeper connection)
  - Display the distribution of answers for each problem (e.g., by having groups write their answers on the board or using a projector).
  - For each problem, the instructor leads a discussion:
     (a) Show the source change (e.g., abc -> abd) and the target string (e.g., iijjkk).
     (b) For each group's answer, ask them to state their one-sentence reason and write the key concepts they used on the board (e.g., "rightmost letter", "group of identical letters", "successor", "predecessor", etc.).
     (c) Map the differences in answers to the slippages in concepts (e.g., in a problem where the target has no obvious rightmost letter, some might slip to "leftmost", others to "rightmost group", etc.).
  - Debrief: Make explicit the connection that the act of perceiving the target string and making the analogy are intertwined. The concepts (like "rightmost") are not fixed but are built on the spot in response to the context. Also, highlight that the same target string can be perceived in multiple valid ways, leading to different analogies.

  Problem Sequence (5 problems):

  1. abc -> abd; what should ijk change to?
     - Expected answer: ijl (or possibly ijd? but the successor of k is l, so ijl is dominant). Reason: "Change the rightmost letter to its successor."
     - This is straightforward and establishes the basic pattern.

  2. abc -> abd; what should iijjkk change to?
     - Expected answer: iijjkl (if they see it as groups, then changing the last group "kk" to "kl" by changing the last letter of that group to its successor) OR iijjkl (if they break the string into three groups: ii, jj, kk and change the last group to kl) OR iijjkk -> iijjck? (if they try to change the last letter to d? but that doesn't fit). 
     - The dominant answer should be iijjkl, with the reason: "Change the rightmost letter in the string to its successor" (which would yield iijjkl) OR "Change the last group (kk) by changing its rightmost letter to the successor" (which also yields iijjkl). This introduces the idea of groups without forcing a big slippage.

  3. abc -> abd; what should mrrjjj change to?
     - This string is mrrjjj. The rightmost letter is j, but changing the last j to k would yield mrrjjk. However, if they see the string as having groups (m, rr, jjj) then changing the last group (jjj) might be analogous. But what change? In the source, we changed the last letter (c) to its successor (d). So for the last group (jjj), they might change the entire group to the successor of j, which is k, so mrrk? But that would be a big jump. Alternatively, they might change the rightmost letter of the last group to k, yielding mrrjjk. Or they might see the last group as having three j's and change one of them? This problem is designed to force slippage in what is the unit (letter vs. group) and possibly the direction (rightmost in the string vs. in the group).

  4. abc -> abd; what should xyz change to?
     - The problem: what is the successor of z? There isn't one (in the standard 26-letter alphabet). So they must slip the concept of "successor". Possible answers:
          - xya (wrap around to a, so the string becomes xya) -> reason: "change the rightmost letter to the next letter, with wrap-around".
          - xy (remove the last letter) -> reason: "since z has no successor, remove the last letter".
          - xyz (no change) -> reason: "no successor, so no change".
          - xyd (change z to d, as in the source) -> reason: "change to the same letter as in the source change (d)".
