  Handout Design:

  The handout should have:

    Copycat Activity

    Rules: 
      - Strings are made of letters a through z.
      - For each problem, you are given an example change (from a source string to a modified string) and a target string. 
      - You must write what the analogous change to the target string would be.

    Problems:

    1. Example: abc -> abd
       Target: ijk
       Your answer: ______
       Reason in one sentence: ______________________________

    2. Example: abc -> abd
       Target: iijjkk
       Your answer: ______
       Reason: ______________________________

    3. Example: abc -> abd
       Target: mrrjjj
       Your answer: ______
       Reason: ______________________________

    4. Example: abc -> abd
       Target: xyz
       Your answer: ______
       Reason: ______________________________

    5. Example: abc -> abd
       Target: aaa
       Your answer: ______
       Reason: ______________________________

  Scoring Rule for Group Phase:

    Each group must agree on one answer per problem and write a reason (one sentence). 
    The group will earn 1 point for a problem if the reason:
      - Correctly identifies the change made in the example (e.g., "change the rightmost letter to its successor").
      - Clearly articulates any necessary adjustments (slippages) for the target string (e.g., "because the target has groups of repeated letters, we applied the change to the rightmost group by changing its last letter to the successor" OR "because z has no successor, we wrapped around to a").
    The point is awarded for the clarity and conceptual soundness of the description, not the answer.

  What the Activity Cannot Reproduce about Copycat:

    - Parallel Terraced Scan: In Copycat, multiple approaches (codelets) are tried in parallel with varying levels of resources. In the classroom, groups are serial and deliberative. We don't have multiple independent agents exploring different paths simultaneously and competing/cooperating.

    - Stochasticity: Copycat uses randomness in codelet choice and activation. The group discussion is deterministic and influenced by social dynamics.

    - Building Descriptions: Copycat builds descriptions of the string (e.g., grouping, directionality) through the actions of codelets. In the activity, the students are consciously reasoning and may jump to a description without the incremental building process.

    - Emergence of Concepts: In Copycat, concepts like "group" or "leftmost" emerge from the bottom-up activity of codelets. In the activity, students are using top-down reasoning and may import concepts from the discussion.

    How to flag the gap in the debrief:
      - Explicitly say: "In the Copycat program, the perception of the string and the analogy are built by many small, independent processes (codelets) that work in parallel and compete. This parallel terraced scan allows the system to explore multiple interpretations at once. Our group activity, while capturing the fluidity of concepts, is more like a serial, deliberative process. We are missing the stochastic element and the emergent, bottom-up building of descriptions that happens in Copycat."

  Predictable Problems and Countermeasures:

    1. The Puzzle-Hunt Student: A student who believes every problem has one clever intended answer and is frustrated by multiple valid answers.
        - Countermeasure: At the start, frame the activity: "In analogy-making, there is often not one right answer. We are exploring how different perceptions of the same situation can lead to different, yet defensible, analogies. The goal is not to guess the answer I have in mind, but to articulate your reasoning."

    2. The Dominant Group Member: A group converges quickly because one person speaks first and others defer.
        - Countermeasure: In the group phase, assign roles: one facilitator (ensures everyone speaks), one recorder (writes the group's answer and reason), and one or two timekeepers. Also, require that each group member must write their own initial answer (from phase 1) on a separate piece of paper and the group must consider every member's answer. The instructor can also intervene during circulation to ask quiet members for their thoughts.

    3. Groups Stuck on a Problem: Some groups may spend too long on one problem and not finish.
        - Countermeasure: Allocate a strict time per problem (e.g., 5 minutes per problem for the group phase, total 25 minutes for 5 problems, plus 5 minutes buffer). Use a timer and announce when to move on.

    4. Superficial Reasons: Groups might write reasons that are too vague (e.g., "we changed the last letter") without articulating slippage when needed.
        - Countermeasure: During the group phase, the instructor can circulate and prompt: "What if someone saw it differently? How would you justify your choice against an alternative?" Also, in the scoring rule, emphasize that points are for the quality of the description, especially for problems 3-5 where slippage is expected.

    5. Group Scoring Anxiety: Groups might focus too much on points and not on the learning.
        - Countermeasure: Downplay the points and emphasize the learning goal. The points are just a way to focus on the quality of reasoning. At the end, don't declare a winner but highlight insightful descriptions from multiple groups.

  Time Breakdown:

    - Phase 1 (Individual): 10 minutes (including reading instructions and writing for 5 problems)
    - Phase 2 (Group): 30 minutes (5 minutes per problem + 5 minutes buffer for discussion and writing)
    - Phase 3 (Whole Class): 40 minutes (about 8 minutes per problem for discussion and 10 minutes for the final debrief on the deeper connection)

    Total: 80 minutes, leaving 10 minutes buffer.

  Let me adjust the time for the whole class: 5 problems, 5 minutes per problem (25 minutes) and 15 minutes for the final debrief (40 total). But we might need more time for the later problems. So:

    - Problem 1: 2 minutes (quick, show distribution, one reason, no slippage)
    - Problem 2: 3 minutes (similar, maybe one group has a group-based reason? highlight if so)
    - Problem 3: 8 minutes (likely multiple answers, discuss the slippage in unit)
    - Problem 4: 10 minutes (multiple answers, slippage in successor concept)
    - Problem 5: 10 minutes (multiple answers, slippage in unit and successor)
    - Final Debrief: 7 minutes (make the connection explicit)

    Total: 40 minutes.

  This is tight, but manageable.

  Final Note: The problems are chosen to build from simple to complex, forcing conceptual slippage in the later ones. The activity is designed to make students experience the fluidity of concepts and the context-dependency of analogy.

  Let me write the problem sequence again with expected answers and reasons for the instructor:

  Problem 1: 
    Target: ijk
    Expected: ijl (dominant)
    Reason: Change the rightmost letter to its successor.

  Problem 2:
    Target: iijjkk
    Expected: iijjkl (dominant) 
    Reason: Change the rightmost letter to its successor. 
    Alternative: Change the last group (kk) by changing its rightmost letter to the successor -> same answer.

  Problem 3:
    Target: mrrjjj
    Possible answers:
        A. mrrjjk (change the last letter j to k) -> reason: change the rightmost letter to its successor.
        B. mrrk (change the last group jjj to k) -> reason: change the last group to its successor (which is k, and we represent it as a single letter) -> note: this requires a slippage in the representation of a group to a single letter? Or they might say: change the last group to the next group, which is k (but then how many k's? they might not specify) -> but the answer mrrk replaces the last group of three j's with one k. This is a slippage in the unit (from letter to group) and the change (from changing a letter to changing a group to a single letter). 
        C. mrrkkk (change the last group jjj to the group of the next letter, which is kkk) -> reason: change the last group to the group of its successor (so the group jjj becomes kkk). This is a slippage in the unit (from letter to group) and the concept of successor (applied to a group).

    We expect a split between A and C (and maybe B). This will generate discussion.

  Problem 4:
    Target: xyz
    Possible answers:
        A. xya (wrap around: z->a) -> reason: change the rightmost letter to its successor, with wrap-around.
        B. xy (remove z) -> reason: since z has no successor, remove the last letter.
        C. xyd (change z to d) -> reason: change the last letter to d, as in the source example (abc->abd changed to d).
        D. xyy (change z to y, the previous letter) -> reason: change the last letter to the previous letter because it has no successor.

  Problem 5:
    Target: aaa
    Possible answers:
        A. aab (change the last a to b) -> reason: change the rightmost letter to its successor.
        B. aad (change the last a to d) -> reason: change the last letter to d, as in the source example.
        C. bbb (change the entire string to the next letter) -> reason: treat the whole string as a group and change it to the next group (which would be three b's) -> slippage: unit from letter to entire string.

    We expect a split between A and C (and B).

  This design should achieve the goals.
answer: |-
  ### **In-Class Activity: Feeling Copycat's Fluid Concepts**

  #### **Activity Overview**
  This 90-minute session uses Hofstadter’s Copycat-style letter-string problems to make students *feel* the fluidity of concepts (e.g., "rightmost," "group," "successor") during analogy-making. Students discover that concepts are negotiated on the spot, not retrieved from fixed definitions, through problems that escalate in ambiguity. The activity has three phases: individual commitment, small-group argument with scoring, and whole-class debrief.

  ---

  ### **Phase 1: Individual Commitment (10 min)**
  - **Handout** ([Download template here](https://docs.google.com/document/d/1EXAMPLE/edit)):  
    Students see 5 problems on a slide/handout. For each, they write:  
    - **Answer**: The transformed string (e.g., "ijl").  
    - **Reason**: One-sentence conceptual justification (e.g., "Change the rightmost letter to its successor").  

    **Problems (sequenced for escalating slippage)**:  
    1. `abc → abd` ; Target: `ijk`  
       *(Dominant answer: `ijl`. Tests basic "rightmost letter" → "successor")*  
    2. `abc → abd` ; Target: `iijjkk`  
       *(Dominant answer: `iijjkl`. "Rightmost letter" holds, but groups emerge.)*  
    3. `abc → abd` ; Target: `mrrjjj`  
       *(Ambiguous: `mrrjjk` (letter focus) vs. `mrrk` (group focus). Forces "letter" ↔ "group" slippage.)*  
    4. `abc → abd` ; Target: `xyz`  
       *(Ambiguous: `xya` (wrap-around) vs. `xy` (remove) vs. `xyd` (copy "d"). Forces "successor" slippage.)*  
    5. `abc → abd` ; Target: `aaa`  
       *(Ambiguous: `aab` (letter change) vs. `bbb` (whole-group change). Forces unit/slippage combos.)*  

  ---

  ### **Phase 2: Small-Group Argument (30 min)**  
  - **Groups**: 3–4 students (4 groups total).  
  - **Task**: Groups debate and **converge on one answer/reason per problem**.  
  - **Scoring Rule (applied live by instructor)**:  
    - **1 point/problem** for a *clear conceptual description* that:  
      (a) Identifies the core change in the source (`abc→abd` = "rightmost letter → successor").  
      (b) Articulates *if/how* concepts slipped for the target (e.g., "No successor for 'z', so we wrapped to 'a'").  
    - **0 points** for answers without slippage justification (e.g., "We changed `xyz` to `xya`").  
    - **Key**: Points reward *description quality*, not the answer. A group that defends slippage beats one with the "right" string but weak reasoning.  

  ---

  ### **Phase 3: Whole-Class Debrief (40 min)**  
  1. **Answer Distribution**: Display group answers per problem (e.g., whiteboard table).  
  2. **Concept Mapping**: For each problem:  
     - Discuss *why* answers diverge (e.g., "For `xyz`, Group 1 saw 'successor' as *wrap-around*; Group 2 saw it as *remove*").  
     - **Slippage Pressure Points**: Track evolving concepts on the board:  
       | Problem | Pressure Point      | Slippage Example                     |  
       |---------|---------------------|--------------------------------------|  
       | 3       | "Rightmost" → ?    | "Rightmost *letter*" vs. "rightmost *group*" |  
       | 4       | "Successor" → ?    | "Wrap to a" vs. "remove" vs. "copy d" |  
       | 5       | "Unit of change" → ?| "Change one letter" vs. "change whole group" |  
  3. **Deeper Connection**: Emphasize:  
     > *"Your perception of the target string (e.g., seeing `aaa` as 'three letters' vs. 'one group') and your analogy were built together. This is the core thesis: Concepts aren’t fixed—they’re fluid perceptions negotiated in the act of analogy-making."*  

  ---

  ### **What This Activity Can’t Replicate (And How to Address It)**  
  Copycat’s architecture has features this activity simplifies:  
  1. **Parallel Terraced Scan**:  
     - **Gap**: Humans argue serially; Copycat runs *parallel codelets* (tiny agents) that compete/stochasticially build descriptions.  
     - **Debrief Flag**: *"Copycat doesn’t ‘debate’—it floods the problem with codelets that probe interpretations in parallel. Our group discussion mimics the outcome (multiple paths considered) but not the messy, parallel process."*  
  2. **Stochastic Emergence**:  
     - **Gap**: Group consensus is deterministic; Copycat uses *randomness* (e.g., which codelet fires) to explore alternatives.  
     - **Debrief Flag**: *"Copycat’s answers can vary run-to-run due to randomness. Our activity had social negotiation, not stochastic codelet races."*  
  3. **Bottom-Up Description Building**:  
     - **Gap**: Students use top-down reasoning; Copycat *builds descriptions* (e.g., "groupness") from low-level codelet actions.  
     - **Debrief Flag**: *"Concepts like ‘group’ weren’t predefined in Copycat—they emerged from codelets noticing repetitions. You imported ‘group’ as a high-level idea."*  

  > **Key Debrief Script**:  
  > *"This activity lets you feel the fluidity of concepts, but remember: Copycat achieves this through emergent, parallel micro-mechanisms we’ve simplified. We’re showing the *what* (fluid concepts), not fully replicating the *how* (codelet ecosystems)."*  

  ---

  ### **Predictable Problems & Countermeasures**  
  1. **The "Puzzle Hunt" Student** (Frustrated by multiple valid answers):  
     - **Countermeasure**: Start the activity by stating: *"There’s no single ‘right’ answer in later problems—your goal is to defend your reasoning. Hofstadter’s point is that analogy is perception, and perceptions differ."*  
     - **Redirect in Debrief**: Praise divergent answers (e.g., *"Group 3’s ‘wrap-around’ for `xyz` is as valid as Group 1’s ‘remove’—both required creative slippage."*).  

  2. **Dominant-Player Consensus** (Group agrees in 30 seconds):  
     - **Countermeasure**: Assign roles:  
       - **Facilitator**: Ensures everyone shares their Phase 1 answer/reason.  
       - **Devil’s Advocate**: Challenges the first proposal ("What if we saw `aaa` as one group?").  
       - **Scribe**: Documents the final slippage justification.  
     - **Instructor Intervention**: Circulate and ask quiet students: *"Your Phase 1 reason was X—how does that challenge the group’s idea?"*  

  3. **Superficial Justifications** (e.g., "We changed `xyz` to `xya` because it’s obvious"):  
     - **Countermeasure**: Use the scoring rule ruthlessly: *"Group 2, you get 0 points for Problem 4—you didn’t explain the slippage ‘successor → wrap-around’."*  
     - **Prompt**: *"What concept had to ‘bend’ here? Compare it to Problem 1."*  

  4. **Time Crunch on Hard Problems**:  
     - **Countermeasure**: Use a visible timer (5 min/problem). If stuck, say: *"Pick one answer and focus on justifying the slippage—it’s about reasoning, not consensus."*  

  ---

  ### **Why This Works**  
  - **Early Problems** build confidence (dominant answers exist).  
  - **Later Problems** force *felt* slippage (e.g., "Wait, `xyz` has no successor—what *is* analogous here?").  
  - **Scoring** shifts focus from "correctness" to conceptual negotiation.  
  - **Debrief** maps slippage pressures explicitly, linking to Hofstadter’s thesis.  

  By the end, students won’t just recite "concepts are fluid"—they’ll have argued, bent concepts, and felt the collapse of fixed definitions.
