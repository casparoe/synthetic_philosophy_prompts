     So we can present the problem and see what students come up with.

  4. abc -> abd; target: xyz -> 
     - As above, forces slippage because z has no successor.

  5. abc -> abd; target: aaa -> 
     - Possibilities: 
          - aab (change the last a to b) -> straightforward.
          - aad (change the last a to d, as in the source) -> slippage: the successor is not used, but the same letter as in the source.
