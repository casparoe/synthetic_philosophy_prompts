     Alternatively, use: abc -> abd; target: mmmnnnooo -> what? 
          - They might change the last o to p -> mmmnnnopo? (if they change the last letter) -> but that breaks the group? Or mmmnnnoop? 
          - Alternatively, if they see the string as three groups (mmm, nnn, ooo) and change the last group to oop? (so the last group becomes oop) then the string becomes mmmnnnoop. But that requires seeing the group as a unit and changing the group by changing its last letter? 
