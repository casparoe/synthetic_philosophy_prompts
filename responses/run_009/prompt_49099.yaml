  3. abc -> abd; target: mrrjjj -> 
     - Possibilities: 
          - Change the rightmost letter (j) to k -> mrrjjk (if they break the groups? the string is m, r, r, j, j, j? or groups: m, rr, jjj). 
          - Alternatively, if they see the last group (jjj) and change the last letter of that group to k -> mrrjjk (same result? because the last letter of the string is the last letter of the last group). 
