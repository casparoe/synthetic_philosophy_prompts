  For boundaries, I should identify what to exclude from this introductory session - formal machinery, comparisons to Knight, later debates - and be explicit about these limitations to avoid overreach.

  Finally, I need a diagnostic question for the end that tests genuine understanding of the three-part distinction, not just memorization. This question should reveal if students are conflating concepts.

  The user is clearly an experienced educator who wants to avoid common pedagogical pitfalls. They're seeking a carefully structured approach that respects students' existing frameworks while challenging their assumptions. The challenge is making these abstract philosophical distinctions concrete and memorable within fifty minutes, while preventing predictable misunderstandings.

  I'll start by brainstorming sequence options. Option 1: Probability → Weight → Uncertainty. This builds from familiar ground but risks students not seeing beyond standard probability. Option 2: Uncertainty → Probability → Weight. This starts with the problem but might feel too abstract initially. Option 3: Weight → Probability → Uncertainty. This begins with the novel concept but may confuse students without context. After evaluation, I'll recommend starting with probability to anchor in familiarity, then introducing weight as a complication, and finally uncertainty as the limiting case.

  For the example, I'll develop a "unique artifact discovery" scenario where initial evidence gives 50% probability of authenticity, but this probability remains stable as evidence accumulates (demonstrating weight increase), until reaching fundamental questions that resist probabilistic framing (uncertainty). This avoids the issues in the rejected examples while providing clear transitions between concepts.

