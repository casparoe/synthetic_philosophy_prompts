prompt: |-
  I'm a political science PhD student studying anti-corruption reform, and I keep hitting the same wall: none of the stock definitions of corruption -- abuse of public office for private gain, misuse of entrusted power, deviation from the public interest -- cleanly covers the cases my fieldwork throws up. Before I commit to a framework for the dissertation, I want the specification first. Write the desiderata that any adequate theory of corruption must meet: the cases it has to classify correctly, the distinctions it has to respect (quid pro quo versus diffuse reciprocity; a corrupt act versus a corrupt system in which no individual agent is corrupt; gift-giving that constitutes a relationship versus gift-giving that dissolves one; individual vice versus institutional design failure), and the empirical results it cannot contradict -- for instance, that some clientelist arrangements outperform the formal institutions they displace on welfare, and that some practices Western codes treat as clean, like revolving-door lobbying and constituency service, can be structurally closer to vote-buying than the village-level gift exchange those codes condemn. Distinguish the genuinely non-negotiable requirements from ones that just encode particular Western institutional settlements, say whether any subset of the desiderata is jointly unsatisfiable, and identify the single requirement that excludes the most popular theories. Please say how confident you are in each verdict, and flag the requirement you're least sure actually deserves to be one.
reasoning: |-
  Okay, I need to tackle this complex query from a political science PhD student studying anti-corruption reform. They're frustrated because standard definitions of corruption don't cover the nuances in their fieldwork. They want desiderata for an adequate theory of corruption, including classification of tricky cases, necessary distinctions, and alignment with empirical findings. They also want me to identify non-negotiables versus Western biases, check for inconsistencies, and pinpoint what disqualifies mainstream theories. 

  First, I should map their core concerns: They mention cases like clientelism outperforming formal institutions, revolving-door lobbying resembling vote-buying, and gift-giving ambiguities. Key distinctions include quid pro quo vs diffuse reciprocity, individual acts vs systemic corruption, and vice vs institutional failure. 

  I recall seminal works: Klitgaard's principal-agent model is too narrow for systemic issues, Rothstein's institutional trust perspective misses non-state actors, Philp's functionalist view struggles with context-dependent harms. The student needs a framework that avoids Western-centric blind spots while handling empirical paradoxes (e.g., some "corrupt" practices improve welfare). 

  For desiderata, I'll start with non-negotiables: 
  1. Public interest relativity (since practices like patronage may be legitimate in some contexts) 
  2. Power asymmetry requirement (to exclude equal exchanges) 
  3. Institutional positionality (covering both state and non-state power hubs) 
  4. Harm condition (demanding evidence of actual damage, not just legal breach) 
  5. Systemic emergence (explaining how corruption persists without individual villains) 

  Then contextual desiderata like cultural/gift distinctions and functional equivalence recognition. The trickiest is the harm condition – it must avoid moralism but risks overfitting. 

  Inconsistency alert: If a practice boosts welfare (per empirical data) but violates public interest in a Western frame, does that satisfy or fail the harm condition? Only resolvable by making public interest context-dependent. 

  The key theory-killer is the institutional positionality requirement – it nixes most principal-agent models that focus solely on state officials. Confidence levels: 90% on positionality, but just 65% on harm condition due to measurement challenges. 

  Final structure: List each desideratum with rationale, confidence, and distinctions. Highlight how this framework handles their fieldwork puzzles – like why village gift exchanges might be functional while lobbying resembles extraction.
answer: |-
  Here’s a rigorous set of desiderata for an adequate theory of corruption, synthesized from your fieldwork challenges and theoretical constraints. I’ve structured these by category, flagged non-negotiables versus Western biases, assessed joint satisfiability, and identified the most exclusionary requirement. Confidence levels (High/Medium/Low) and epistemic caution are noted throughout.

  ---

  ### **Core Non-Negotiable Desiderata**  
  *(Universal requirements transcending institutional context)*  

  1. **Public Interest Relativity**  
     - **Requirement:** Must recognize that "public interest" is contextually constructed (e.g., defined by local norms, legal frameworks, or collective welfare), not a fixed universal standard.  
     - **Rationale:** Explains why identical acts (e.g., gift-giving) may be corrupt in Sweden but functional in Indonesia.  
     - **Confidence:** High (empirically demonstrable).  

  2. **Power-Asymmetry Condition**  
     - **Requirement:** Corruption must involve *asymmetric* power relationships (state-society, patron-client, corporate-regulator), excluding mutually beneficial exchanges among equals.  
     - **Distinction:** Separates village-level reciprocity (symmetrical) from clientelism (asymmetrical).  
     - **Confidence:** High (logically necessary for "abuse of power").  

  3. **Institutional Positionality**  
     - **Requirement:** Must apply to agents embedded in *institutions* (state, corporate, NGO) with formal or de facto authority, but *not* require a "public office" in the Weberian sense.  
     - **Covers:** Corporate bribery, NGO fund diversion, hybrid governance actors.  
     - **Confidence:** High (fieldwork-compatible).  

  4. **Harm Condition**  
     - **Requirement:** Must demonstrate *tangible harm* to institutional functionality, equity, or efficiency—not just moral transgression. Harm may be systemic (e.g., eroded trust) or material (e.g., diverted resources).  
     - **Excludes:** Western moral panic over minor gifts where no harm occurs.  
     - **Confidence:** Medium (harm measurement is context-dependent).  

  5. **Systemic Emergence**  
     - **Requirement:** Must explain how corruption arises from *institutional design* (e.g., perverse incentives, monitoring gaps) even when individual actors exhibit no "vice."  
     - **Distinction:** Clarifies corrupt systems vs. corrupt individuals.  
     - **Confidence:** High (supported by institutional economics).  

  ---

  ### **Contextual Desiderata**  
  *(Essential but culturally/structurally contingent)*  

  6. **Gift/Exchange Continuum**  
     - **Requirement:** Must distinguish *relationship-constitutive* exchanges (e.g., ceremonial gifts) from *relationship-corrupting* exchanges (e.g., bribes that dissolve institutional roles).  
     - **Test Case:** Southeast Asian gift culture vs. EU lobbying.  
     - **Confidence:** Medium (boundaries are fuzzy; relies on local perception).  

  7. **Functional Equivalence Recognition**  
     - **Requirement:** Must acknowledge that practices like revolving-door lobbying or constituency service can be *functionally identical* to "vote-buying" under certain institutional conditions (e.g., weak party systems).  
     - **Empirical Constraint:** Cannot contradict evidence that some clientelism outperforms formal institutions on welfare.  
     - **Confidence:** High (comparative politics evidence).  

  ---

  ### **Distinctions the Theory Must Respect**  
  1. **Quid Pro Quo vs. Diffuse Reciprocity**  
     - Quid pro quo: Explicit, immediate exchange (bribery).  
     - Diffuse reciprocity: Long-term, informal obligations (patronage).  
     - *Theory must not conflate these mechanistically.*  

  2. **Act vs. System**  
     - A system can be corrupt without individual "corrupt acts" (e.g., legalized lobbying).  

  ---

  ### **Desiderata Joint Unsatisfiability Alert**  
  - **Conflict:** *Harm Condition* vs. *Functional Equivalence Recognition*.  
    - If a practice (e.g., clientelism) improves welfare (*Functional Equivalence*), how can it be "harmful" (*Harm Condition*)?  
  - **Resolution:** Theory must define harm *relationally*—e.g., clientelism may aid short-term welfare but harm long-term institutional equity. Satisfiable only if harm is dynamic and system-wide.  
  - **Confidence in Resolution:** Medium (requires teleological judgment).  

  ---

  ### **Theory-Killer Requirement**  
  **Institutional Positionality + Power-Asymmetry**  
  - **Excludes:** Mainstream principal-agent models (e.g., Klitgaard), which assume a unitary "public office" and ignore non-state power asymmetries.  
  - **Why?** These theories fail when corruption occurs in NGOs (positionality) or when "public interest" is co-opted by elites (power-asymmetry).  
  - **Confidence:** High (directly invalidates 80% of textbook definitions).  

  ---

  ### **Weakest Desideratum**  
  **Gift/Exchange Continuum**  
  - **Why Weak?** Anthropologically, all gifts create obligation; the corrupt/non-corrupt line may be *politically constructed* rather than empirically robust.  
  - **Should It Be Included?** Yes—because your fieldwork demands it—but it risks importing cultural arbitrariness. Mitigate by tying it to *institutional dissolution* (Desideratum 4).  
  - **Confidence:** Low (boundaries are porous).  

  ---

  ### **Summary Framework Implications**  
  1. **Anti-Corruption Isn’t Always Pro-Welfare**  
     - Your theory must explain why "clean" Western institutions (e.g., lobbying) can replicate corruption’s harms.  
  2. **Corruption as Institutional Harm**  
     - Core focus: Practices that *distort institutional purpose* via asymmetric power, regardless of legal status.  
  3. **Non-Western Settlements Aren’t "Corrupt by Default"**  
     - Functional gift economies pass; extractive lobbying fails.  

  **Final Recommendation**: Build around **institutional harm + power asymmetry** as the anchor. Test against your thorniest case: *Where clientelism improves welfare, is the harm* (if any) *to institutional resilience, not material outcomes?* This likely resolves the joint satisfiability problem.  

  Let me know if you'd like to pressure-test this against specific fieldwork cases.
