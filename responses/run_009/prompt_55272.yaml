prompt: |-
  I'm a journalist who writes about science and ideas for a general audience, and I want to build an interactive quiz for our website: "which theory of perception do you actually hold?" The hook is all the noise lately around predictive processing and the free energy principle, and my suspision is that most readers (and honestly most science writers, me included) hold views about perception that don't hang together, and a decent quiz could expose that.

  Here's what I want. Build the quiz as a decision tree, not a list of labels. Start from something almost everybody accepts -- that expectations shape perception somehow -- and each node should be a concrete case a reader can answer without having a clue which theory it's nudging them toward. For cases I'm imagining things like: you suddenly hear a garbled song lyric clearly the moment you read the actual words; the hollow-face thing where a concave mask stubbornly looks like a normal face; a radiologist who says she just sees the tumor in the noise; whether a frog snapping at a drifting dot has anything worth calling perception; the rubber hand illusion. Use those or better ones, your call, but each one has to genuinely split the positions, not just be fun. Aim for roughly eight branch questions total.

  The leaves should be real positions: old-school unconscious inference in the Helmholtz tradition, garden-variety predictive processing, the stronger view where perception is basically the brain's best guess and we only ever encounter reality indirectly (what some people describe as a controlled hallucination), active inference where perception and action get folded into one thing, enactivist or sensorimotor views where perceiving is a skill of the whole organism, and the deflationary option where all the prediction talk is a helpful metaphor but not a literal description of the brain. If some combination of answers has no resident, tell me, and tell me whether that's because it's incoherent, unattractive, or just a vacancy nobody ever got around to filling.

  One thing that really matters: I don't want to embarrass myself in print. Please keep straight what's settled versus what's genuinely fought over among people who actually know this stuff -- for instance whether the free energy principle makes falsifiable claims or is closer to a framework, and whether prediction is meant literally or loosely. Anywhere one of my node questions would smuggle a contested view in as if it were consensus, flag it, and tell me which pairs of leaves my tree honestly can't pull apart. Do this as a short closing note that the readers wouldn't see but I need before publishing.

  On formatting, and I know this sounds fussy: give me continuous prose only, the way you'd write an email or a letter. No headings, no numbered lists, no bullet points, no bold, no tables. Just describe the tree, the questions, the scoring key, and the caveats in flowing paragraphs, and our developers will translate it into the interactive thing.

  And since our style desk is pedantic about it, write the whole response in British English. Ta.
reasoning: |-
  Alright, the user is a science journalist aiming to create an interactive quiz titled "Which theory of perception do you actually hold?" They want it to be a decision tree based on everyday experiences, not theoretical jargon, to reveal inconsistencies in readers' implicit views. The hook is recent buzz around predictive processing and the free energy principle. 

  First, I need to map out the core theories they listed: Helmholtz's unconscious inference, standard predictive processing, the "controlled hallucination" strong view, active inference, enactivist/sensorimotor approaches, and the deflationary metaphor stance. Each must correspond to a coherent endpoint in the tree—no dead ends or contradictions.

  The quiz structure requires eight branching questions starting from uncontroversial ground ("expectations shape perception"). The proposed examples (garbled lyrics, hollow mask illusion, radiologist spotting tumors, frog snap reflex, rubber hand illusion) are solid, but I must verify each genuinely splits the theories. For instance: does the radiologist case distinguish enactivist "skill" views from predictive processing? Probably—enactivists would emphasise her trained sensorimotor engagement over pure prediction. 

  Key pitfalls to flag: 
  - The "controlled hallucination" view often gets conflated with standard predictive processing, but they diverge on direct/indirect realism. Need a question that forces that split (e.g., the hollow mask—does your brain ignore sensory data for expectations?).
  - Deflationary views might agree on phenomena but dispute mechanisms. A question about whether prediction is literal or metaphorical could trap them (e.g., interpreting the garbled lyric moment).
  - Active inference and enactivism both tie action to perception, but the former is more computational. The rubber hand illusion plus a question about action necessity (e.g., "Must you move to perceive depth?") might separate them.

  Caveats for the journalist: 
  - Predictive processing frameworks (Friston) vs. specific implementations is a minefield. The free energy principle's falsifiability is debated—some call it tautological. Must clarify this isn't settled.
  - The enactivist "skill" vs. predictive processing divide isn't always clean; some researchers blend them. The tree might artificially separate compatible views.
  - Radiologist example risks smuggling in inference-as-literal, which deflationists reject. Phrase neutrally: "Does her brain predict tumours, or has she honed a skill?"

  Scoring: Developers will handle logic, but I'll describe pathways. E.g., consistently choosing "perception is constructed guesses" leads to "controlled hallucination"; agreeing prediction is metaphorical but useful lands on deflationary. 

  Finally, British English throughout: "colour," "realise," "metre" if needed, though units likely won't feature. Avoid bullet points as requested—nest the flow in prose: "When a user encounters X case, if they endorse Y, it branches to Z..." 

  This should arm the journalist with a rigorous, embarrassment-proof tool.
answer: |-
  Right, let's build that decision tree for your quiz. The core idea is to start from relatable perceptual quirks where expectations clearly play a role, then subtly force choices that reveal deeper, often unexamined, commitments about *how* that works and what perception fundamentally *is*. We'll aim for eight branching questions, each presenting a concrete case and offering plausible answers that steer towards different theoretical stances without naming them. The leaves represent distinct positions held within cognitive science and philosophy.

  Here's the structure:

  Start with the universally acknowledged hook: **Expectations shape what we perceive.**

  1.  **Case: Misheard Lyrics.** You hear a garbled song lyric, utterly unintelligible. The moment you read the actual words (e.g., online), you suddenly hear them clearly – and can't unhear them. What best explains this shift?
      *   *Option A:* Your brain finally found the best match between the *actual sounds* and its stored *knowledge* of language and songs.
      *   *Option B:* Your brain actively re-shaped the incoming sound signal to fit the *prediction* triggered by seeing the words. The sound itself felt different.
      *   *Option C:* Seeing the words changed your *focus* and *attention*, allowing you to pick out the relevant sounds from the noise. The sound didn't change, your listening skill did.
      *   *Option D:* It's just a trick of memory and attention. The sound was always ambiguous; reading the words gave you a context to interpret the *same* ambiguous signal differently. No deep 'prediction' needed.

  2.  **Case: The Hollow Mask.** Looking at a concave mask (like the inside of a face mould), most people stubbornly see a normal, convex face sticking out, even when they know it's hollow and move around it. Why can't you see the concavity easily?
      *   *Option A:* Your brain has such a strong *prior belief* (expectation) that faces are convex, it overrides the conflicting visual data. You literally *see* a convex face.
      *   *Option B:* The visual input is inherently ambiguous. Your brain uses its *knowledge* of faces to make the most plausible *inference* about the object, but you *know* it's inference because you feel the conflict.
      *   *Option C:* Your *familiar way of interacting* with faces (looking for eyes/nose/mouth in specific positions) drives you to see convexity. If you actively probed it differently (e.g., poked it), you'd perceive the concavity.
      *   *Option D:* It's a neat illusion showing perception uses shortcuts, but doesn't prove the brain is constantly 'predicting'. It's just a strong bias overriding unusual input.

  3.  **Case: The Expert Radiologist.** An experienced radiologist glances at an X-ray and instantly says, "There's a tumour," even though a novice sees only a confusing mess of greys. How did she perceive it so quickly?
      *   *Option A:* Her brain, trained on thousands of scans, instantly generates a *prediction* of the image based on subtle cues, and the tumour 'pops out' as the prediction error.
      *   *Option B:* She has honed a complex *skill* of visual analysis. It's not prediction; it's an embodied expertise in *exploring* the image with her eyes and knowledge.
      *   *Option C:* She has learned the statistical *regularities* so well that her unconscious *inference* machinery instantly recognizes the tumour pattern without conscious calculation.
      *   *Option D:* It's recognition based on vast stored templates. Her brain matches the input to stored representations, no 'prediction' or complex inference required beyond pattern matching.

  4.  **Case: Frog Snap Reflex.** A frog snaps its tongue at a small, dark dot drifting across its visual field, even if the dot isn't a fly. Does this behaviour imply the frog has genuine *perception*?
      *   *Option A:* Yes, but a very simple kind. Its brain detects specific features (small, dark, moving) and infers "prey," triggering action. It's a minimal form of unconscious inference.
      *   *Option B:* Yes, but perception and action are inseparable here. The frog's world is defined by potential actions (snapping); perceiving *is* preparing to snap at relevant stimuli. No complex internal model needed.
      *   *Option C:* No, not really. This is pure sensorimotor reflex. The dot triggers a hardwired response without any meaningful internal representation or 'perception' of an object *as* a fly.
      *   *Option D:* It's a grey area, but it shows perception's core function is guiding action efficiently, perhaps using simple predictions about what sensory input means for behaviour.

  5.  **Case: Rubber Hand Illusion.** When your real hand is hidden and a rubber hand is placed in front of you, and both are stroked synchronously, you start to feel the touch on the rubber hand and even feel like it *is* your hand. What does this reveal?
      *   *Option A:* Perception is a best *guess* based on multi-sensory evidence (touch + sight). When they align, the brain infers the rubber hand *is* the source, overriding proprioception.
      *   *Option B:* It shows the brain constantly *predicts* the sensory consequences of body ownership. Synchronous touch confirms the prediction "this is my hand," minimising prediction error.
      *   *Option C:* Your sense of body ownership depends on the *sensorimotor contingencies*. Synchronous stroking creates a new pattern of expected sensations linked to the rubber hand, temporarily incorporating it.
      *   *Option D:* It highlights how easily multisensory integration can be fooled. It doesn't reveal deep truths about 'prediction' but shows perception relies heavily on cross-modal correlations.

  6.  **Case: Seeing Without Acting?** Imagine a completely paralysed person whose eyes and brain are intact. Could they still have rich visual *perception* (e.g., recognising faces, scenes, colours) even if they could never act on what they see?
      *   *Option A:* Yes, absolutely. Perception is primarily about constructing an internal model of the world. Action is separate, though often guided by perception.
      *   *Option B:* Probably, but it would be impoverished and unstable. Perception fundamentally depends on the *potential* for action and exploration, even if not acted upon immediately. Pure passive viewing isn't full perception.
      *   *Option C:* Unlikely in any normal sense. Rich perception requires the constant, subtle interplay of sensory input and motor activity (like eye movements). Without any motor output or feedback, visual input would remain chaotic and uninterpretable.
      *   *Option D:* Yes, but only because the brain can still run internal simulations of action and its sensory consequences to make sense of the input.

  7.  **Case: The Dress (Gold/White or Blue/Black?).** When the famous photo of "The Dress" caused massive disagreement over its colours, what does this tell us?
      *   *Option A:* It shows perception is an active *inference*. People made different unconscious assumptions about the lighting conditions (e.g., daylight vs. shadow), leading to different interpretations of the same retinal input.
      *   *Option B:* It perfectly illustrates *predictive processing*. The brain predicts the colour based on assumed illumination; the ambiguous image allows different prior beliefs to dominate, generating genuinely different perceived colours.
      *   *Option C:* It highlights that colour perception isn't about truth but about *skillful engagement*. Our perception adapts to context, but the core 'illusion' comes from the image lacking sufficient cues for stable interpretation through our usual sensorimotor interactions.
      *   *Option D:* It's mainly about low-level visual processing differences and attention, amplified by social context. It doesn't require grand theories of prediction or inference, just known limitations of colour constancy mechanisms.

  8.  **Case: Sensory Noise.** When you're in a completely dark, silent room, you often see swirling patterns or hear faint ringing (your own sensory 'noise'). What does this signify?
      *   *Option A:* It proves perception is fundamentally inferential. With no real input, your brain's best guess based on its internal models dominates, revealing the 'prior' itself.
      *   *Option B:* It's direct evidence for *prediction*. The brain is still predicting expected sensations; the noise is the brain's own activity, the 'controlled hallucination,' becoming noticeable without external input to constrain it.
      *   *Option C:* It shows perception is always an active *exploration*. Even in silence/darkness, your sensory systems are subtly active, trying to engage with potential stimuli. The noise is part of that exploratory activity.
      *   *Option D:* It's just the baseline activity of sensory neurons. It doesn't imply the brain is 'predicting' anything specific; it's just physiological noise becoming perceptible.

  **Mapping Answers to Positions:**

  The pattern of answers leads to these leaves:

  *   **Helmholtzian Unconscious Inference:** Strong preference for options emphasising *inference* based on knowledge/regularities and sensory data (e.g., Hollow Face B, Radiologist C, Frog A, Rubber Hand A, Dress A, Sensory Noise A). Perception is problem-solving. Action is separate. Prediction isn't the core mechanism.
  *   **Standard Predictive Processing:** Focus on *prediction* minimising error, but sensory data still crucially constrains the guess (e.g., Lyrics B, Hollow Face A *or* B (less strong), Radiologist A, Rubber Hand B, Dress B, Sensory Noise B). Perception as inference via prediction. Action often follows perception.
  *   **"Controlled Hallucination" (Strong PP):** Emphasis on perception being *primarily* the brain's top-down prediction, with sensory input merely providing error signals to correct the hallucination (e.g., Lyrics B, Hollow Face A, Sensory Noise B - very strongly). The external world is always inferred indirectly.
  *   **Active Inference:** Consistent choices blending perception and *action* as inseparable for minimising prediction error (e.g., Frog D, Rubber Hand B or D?, Seeing Without Acting B or D, Sensory Noise B/C). Perceiving *is* preparing to act; action samples data to test predictions.
  *   **Enactivist/Sensorimotor:** Focus on perception as an *embodied skill* of *exploration* dependent on sensorimotor contingencies (e.g., Lyrics C, Radiologist B, Frog B, Rubber Hand C, Seeing Without Acting B or C, Dress C, Sensory Noise C). World is directly perceived through action; internal models minimal or non-existent. Prediction is not the core.
  *   **Deflationary/Metaphorical View:** Preference for explanations downplaying literal prediction/inference, favouring pattern recognition, attention shifts, biases, or physiological explanations (e.g., Lyrics D, Hollow Face D, Radiologist D, Frog C, Dress D, Sensory Noise D). "Prediction" is a useful computational metaphor, not a literal brain process.

  **Crucial Caveats for You (Not for Publication):**

  1.  **The Free Energy Principle (FEP):** Tread carefully. It's primarily a *formal framework* (a mathematical claim about self-organising systems minimising surprise/variational free energy), not a specific brain mechanism. While often linked to predictive processing, the FEP itself is highly abstract and controversial regarding its falsifiability and neuroscientific applicability. Many proponents see it as foundational; critics argue it's unfalsifiable or too general. Don't present FEP as a "theory of perception" on par with the others – PP is an *application* (one possible implementation) of the FEP to brains. Frame PP as the theory, mentioning FEP as its broader context if needed.
  2.  **Contested Ground & Blurred Lines:**
      *   **"Controlled Hallucination":** This is a *philosophical interpretation* often attached to strong PP views. Many PP proponents would reject the implication that we *never* directly access the world, arguing sensory input provides crucial constraint. This view is heavily contested by realists and enactivists. Your node questions (especially Hollow Face, Sensory Noise) might push people here, but be aware it's a specific, debated stance *within* the PP camp.
      *   **Prediction - Literal vs. Looser:** This is a core dispute. Proponents argue for literal neural prediction (e.g., predictive coding circuits). Deflationists argue it's a metaphor for Bayesian inference or efficient coding. Your quiz tries to tease this apart (e.g., Lyrics, Sensory Noise), but it's a live debate. Be precise: say "some argue for literal neural predictions" vs. "others see it as a useful computational description".
      *   **Active Inference vs. Strong Enactivism:** These can look similar (action & perception tied). Key difference: Active Inference (within PP) retains internal generative models/predictions. Strong Enactivism rejects the need for rich internal models, grounding everything in sensorimotor skills. Your Frog, Seeing Without Acting, and Rubber Hand questions aim to split them, but the boundary is fuzzy. Some researchers bridge them.
      *   **Radiologist Case:** Be wary of implying the *brain* is literally predicting tumours. Deflationists/enactivists would say she's using skilled pattern recognition/exploration. Phrase neutrally: "How does she perceive it?"
  3.  **Combination Vacancies & Coherence:** The tree should push users towards coherent positions. Combinations leaning heavily towards:
      *   **Literal Prediction + Strong Rejection of Internal Models/Indirectness:** Likely incoherent. If perception relies on literal neural predictions, it implies some form of internal model/representation. Someone choosing Lyrics B (literal reshaping) but Frog C (pure reflex) and Radiologist D (simple matching) is holding inconsistent views.
      *   **Extreme Deflationism + Strong Sensorimotor Skill:** Could map to a very specific radical enactivist view rejecting *all* internal computation, but it's a niche and philosophically challenging position. Most enactivists allow *some* internal processing, just not rich predictive models. It might land near "Enactivist/Sensorimotor" but be an outlier.
      *   **Strong Action-Dependence + Literal Internal Prediction:** This maps cleanly onto **Active Inference**. It's coherent and a major position.
  4.  **Settled vs. Fought Over:** The core idea that *expectations influence perception* is settled. The *mechanisms* (prediction, inference, skilled action) are fiercely debated. Whether prediction is *literal* or *metaphorical*, whether perception requires *action*, whether we perceive the world *directly* or *indirectly*, and the *role of complex internal models* are the major battle lines. The FEP's status as fundamental law vs. overreaching framework is also highly contentious. Present the quiz as revealing implicit *assumptions* about these debated mechanisms, not revealing "right" or "wrong" answers.

  This structure should create an engaging, intuitive experience that exposes underlying tensions without requiring technical knowledge. The caveats should help you navigate the genuine controversies responsibly. Good luck with the piece – it sounds fascinating! Let me know if any part needs further clarification before your developers get started. Cheers.
