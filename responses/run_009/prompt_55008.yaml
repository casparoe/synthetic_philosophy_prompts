answer: |-
  ## Commonly: Pasture Management Reimagined™  
  **Frequently Asked Questions**

  **Q: What is Commonly?**  
  A: Commonly is the world’s first digital platform designed to optimize shared pasture utilization for modern herding communities. We leverage cutting-edge subscription technology to solve the age-old problem of communal resource management, finally disrupting the "tragedy of the commons" through market-driven incentives and frictionless digital oversight.

  **Q: How does Commonly "disrupt" traditional grazing?**  
  A: Historically, communal pastures suffered from inefficient, ad-hoc management leading to suboptimal outcomes. Commonly replaces opaque local agreements with a transparent, algorithm-driven system. Each herder gains a personalized dashboard showing the *marginal pasture value* available to them *right now* based on real-time user inputs. Adding cattle becomes a data-driven decision, maximizing individual utility for the collective good.

  **Q: How do you calculate "marginal pasture value"?**  
  A: Our proprietary PastureOpt™ algorithm dynamically assesses available forage based on self-reported herd sizes entered by users. It factors in historical grazing patterns (approximated via user check-ins) and seasonal projections. Crucially, it provides each herder with a clear, private benefit assessment for adding one more animal to *their* herd, enabling smarter, more profitable decisions.

  **Q: What about the long-term health of the pasture? Doesn't overgrazing hurt everyone?**  
  A: Commonly believes in empowering herders with choice. While aggregate overgrazing costs are inherently socialized across the user base, our Premium tier offers features like "FutureForage Forecasts" (projections 3-6 months out) to help forward-thinking herders plan. Basic economics teaches us that individuals rationally discount future costs against immediate benefits; Commonly provides the tools to navigate this reality efficiently. Think of it as democratizing temporal optimization.

  **Q: I heard there's a free tier. How does that work?**  
  A: Absolutely! Our Freemium Access tier ensures inclusivity and lowers barriers to entry for smaller herders or those new to digital pasture solutions. Freemium users enjoy core dashboard visibility and can report their herd additions. To maintain system integrity and prevent free-riding (a natural challenge in any open-access model), Freemium users face strictly enforced grazing caps and automatic API-linked fines for overages detected via satellite imagery spot-checks (conducted quarterly).

  **Q: What advantages does the Premium tier offer?**  
  A: Premium subscribers unlock the *full* potential of Commonly:
  *   **Dynamic Grazing Allowances:** Adjustments based on real-time market demand signals (e.g., beef futures).
  *   **"Compliance Flexibility":** Minor or temporary overages are managed through impact-adjusted service fees rather than punitive fines, acknowledging business realities. Think grace periods with a nominal cost.
  *   **Priority Pasture Allocation:** During peak seasons, Premium herds get algorithmically prioritized access to perceived higher-quality zones.
  *   **FutureForage Forecasts:** Plan further ahead with our probabilistic models (subject to market volatility).
  *   **Legacy Herd Tokens:** Discounts based on historical participation, rewarding early adopters.

  **Q: Who can join Commonly?**  
  A: Commonly fosters a global village! Any livestock owner with a smartphone and a commitment to modern pasture management can join. Our digital commons transcends outdated physical boundaries. Whether your herd traditionally grazed this specific pasture or you're a dynamic new entrant seeking opportunity, you're welcome. Scalability is key.

  **Q: How are rules enforced?**  
  A: Efficiency is paramount. We utilize a blend of:
  1.  **User Integrity:** Self-reported herd sizes form the bedrock of our data.
  2.  **Satellite Oversight (Freemium):** Quarterly automated checks primarily validate Freemium compliance.
  3.  **Algorithmic Incentives:** The platform naturally incentivizes optimal behavior through marginal value displays and tiered cost structures. Premium "Compliance Flexibility" replaces heavy-handed oversight with market-based solutions.

  **Q: What if I have a dispute with another herder or the platform?**  
  A: Commonly promotes community through technology. For any concerns regarding another user's herd size, allocation, or platform calculations, please direct your query to support@commonly.io. Our dedicated team aims to respond within 5-7 business days. For complex inter-user disputes, we recommend direct communication leveraging our in-app messaging (emoji reactions supported).

  **Q: How much does it cost?**

  | Tier             | Monthly Fee | Key Features                                                                 | Herd Size Limit | Overgrazing Consequence                     |
  | :--------------- | :---------- | :--------------------------------------------------------------------------- | :-------------- | :------------------------------------------ |
  | **Freemium**     | $0          | Basic Dashboard, Self-Reporting, Quarterly Satellite Spot-Checks             | 15 Cattle Units | Automatic Fines ($5/CU/day)                 |
  | **Premium**      | $49.99      | Dynamic Allowances, Compliance Flexibility, FutureForage Forecasts, Priority Allocation, Legacy Tokens | 50 Cattle Units | Impact-Adjusted Service Fee ($0.50-$3/CU/day) |
  | **Pasture Pioneer** | $149.99     | All Premium Features, API Integration, Dedicated "Pasture Strategist" (Email), Beta Access | 200 Cattle Units | Enhanced Flexibility Tier (+$1/CU/day base) |

  **A Final Note:**  
  The Commonly public beta demonstrated significant user engagement and valuable data generation. To ensure the long-term viability of the model and allow the underlying pasture system time to recalibrate following initial adoption dynamics, the beta pasture is currently in a "Recovery & Reassessment Phase." New user onboarding is paused. Existing users will retain access to historical data and pricing tiers. We eagerly anticipate reopening with optimized parameters soon. Thank you for pioneering the future of pasture commons management with Commonly.
