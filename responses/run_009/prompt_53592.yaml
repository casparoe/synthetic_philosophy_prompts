  - The retiree case is critical: EU claims it's modeling error (wealth/interaction), REU sees it as proof of convex risk weighting.
  - The probability distortion objection needs resolution: must declare it substantive (different risk attitudes) not verbal (same model relabeled).

  For the retiree case, the EU response feels weak—insisting wealth effects explain it risks being unfalsifiable. REU's structural explanation is elegant here. On probability distortion, the "same preferences" argument suggests it's not merely verbal; different psychological constructs can produce identical choices, making it substantive.

  The user's tone suggests exhaustion with indecisiveness ("no hedging"), so the document must force testable predictions. The retiree case becomes the litmus test: REU predicts such behavior is rational with convex risk-aversion, EU insists it vanishes under proper modeling. 

  Notable tensions:
  - EU's wealth-effect dismissal may overlook REU's point: even with full wealth modeling, separable risk attitudes exist.
  - Calling probability distortion "not merely verbal" might annoy the EU side, but the observably identical preferences point is solid.

  Final document should:
