  2. Present disagreements symmetrically.
  3. Use retiree case as empirical crux with opposing predictions.
  4. Rule probability distortion as substantive via uniqueness of representation.
answer: |-
  ## Joint Statement: Adversarial Collaboration on Risk-Weighted Expected Utility vs. Orthodox Expected Utility

  **Preamble:** We, the undersigned proponents of Orthodox Expected Utility (EU) and Risk-Weighted Expected Utility (REU), acknowledge a persistent disagreement regarding the normative foundations of rational choice under risk. This document seeks to clarify points of agreement, articulate the core disagreements without equivocation, identify specific cruxes, and make testable predictions. We commit to this being a definitive statement of our current positions, not an invitation for indefinite further debate within the seminar context.

  ### Section 1: Agreed Claims (Signed by Both Parties)

  1.  **The von Neumann-Morgenstern (vNM) Framework is Foundational:** The vNM axioms (Completeness, Transitivity, Continuity, Independence) define the conditions under which preferences can be represented *as* maximizing the expected value of a utility function. This representation theorem is mathematically sound and normatively compelling *if* one accepts the axioms as requirements of rationality.
  2.  **The Allais Paradox Demonstrates Descriptive Failure of EU:** Empirical choices in Allais-style problems systematically violate the Independence Axiom of vNM EU theory. This shows that EU, as traditionally formulated with linear probabilities, is not a universally accurate *descriptive* model of human choice.
  3.  **Allais Does Not *Necessarily* Demonstrate Normative Failure of EU:** The existence of Allais preferences does not, *by itself*, prove that violating the Independence Axiom is normatively rational. Defenders of EU can argue these preferences reveal cognitive biases or errors in probability/utility assessment rather than sound rational principles. Defenders of REU argue they reveal a rational form of risk sensitivity.
  4.  **Both Theories Owe an Explanation of Rational Choice:** EU theory provides a standard of rational choice based on probability-weighted utilities. REU theory proposes an alternative standard incorporating an agent's global attitude towards risk via a risk function applied to the cumulative probability distribution. Both theories aim to provide a *normative* account of how agents *ought* to choose under risk.
  5.  **Utilities and Probabilities are Core Components:** Both theories require well-defined outcomes, utilities assigned to those outcomes, and probabilities assigned to states of the world or events. Disagreement centers on how these components are combined for evaluation.
  6.  **The Retiree Case is a Key Test Case:** The behavior described (rejecting two positive-EV bets individually but accepting them together due to hedging) is a paradigmatic example requiring explanation. Both sides agree this pattern is observed and needs to be addressed by any adequate normative theory.

  ### Section 2: Disagreements

  | Disagreement                                                                 | Orthodox EU Position (Acceptably Worded)                                                                                              | REU Position (Acceptably Worded)                                                                                                 | Why Substantive (Not Verbal)                                                                                                                                                         |
  | :--------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------ | :------------------------------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **1. Normative Status of the Independence Axiom:**                           | Violating the vNM Independence Axiom is inherently irrational. Rational choice requires evaluating lotteries solely based on their final outcome distributions and probabilities, precluding the type of context-dependence inherent in Allais or the retiree case. | The vNM Independence Axiom is not a necessary requirement of rationality. Rational agents can (and sometimes should) care about the source of risk and the distribution of chances, not just final outcomes, leading to justified violations captured by a risk function. | **Substantive:** Disagrees on a fundamental axiom of rational choice. EU sees context-independence as essential. REU sees context-sensitivity (via the risk function) as rationally permissible. |
  | **2. The Retiree Case: Rationality & Explanation:**                          | The retiree's behavior is either (a) irrational due to a framing error or myopic evaluation, or (b) fully explainable within EU by correctly modeling her **wealth position** and the **correlation/interaction between the bets' payoffs** (e.g., incorporating background risk, non-additive wealth utility). REU attributes necessity to a mechanism (risk-weighting) that is superfluous or mistaken. | The retiree's behavior is perfectly rational. It directly reflects a **global, structural aversion to downside risk** best captured by a convex risk function. REU provides a parsimonious and direct explanation at the level of risk attitudes applied to the bets *as presented*. EU explanations invoking complex wealth/correlation modeling often amount to redescribing the phenomenon rather than explaining it with core EU principles. | **Substantive:** EU claims the behavior stems from mis-modeling or irrationality. REU claims it stems from a rational structural risk attitude fundamental to its theory. EU sees REU's explanation as introducing an unnecessary element; REU sees EU's explanations as post-hoc adjustments. |
  | **3. The Nature of Risk Aversion:**                                          | Risk aversion is **solely** captured by the concavity of the utility function over outcomes (diminishing marginal utility). "Risk" itself is not a distinct primitive requiring separate weighting. | Risk aversion has two components: **(1)** diminishing marginal utility (utility function concavity), and **(2)** a distinct attitude toward the *dispersion* or *structure* of chances, captured by the convexity of the risk function. These are conceptually and formally distinct. | **Substantive:** EU reduces risk attitudes to outcome valuation. REU posits an independent component of risk attitude applied to the probability distribution structure.                             |
  | **4. The "Beliefs in Disguise" Objection:**                                  | Any REU representation using utilities `u`, probabilities `p`, and a risk function `r` can be **formally redescibed** as an EU representation using distorted probabilities `p'` (a function of `p` and `r`) and potentially adjusted utilities `u'`. REU therefore offers no new *structural* insight into preferences; it's just EU with misspecified beliefs/utilities. | While a **formal mathematical mapping** exists between REU representations and *some* EU representations with distorted probabilities, this does not mean REU is "just beliefs in disguise." The **conceptual primitives** differ fundamentally: REU explicitly models a distinct attitude towards the *structure of risk* (via `r` applied to the cumulative distribution), whereas the EU-redescription attributes the same preference pattern to an error in *belief* (`p'`) or valuation (`u'`). The REU interpretation is often more psychologically plausible and normatively defensible. | **Substantive:** *Judgment Call:* It's not merely verbal because the dispute concerns the **correct conceptual interpretation** of the preference structure and the **nature of the rational faculty** involved (belief vs. risk attitude). Both sides agree the mathematical mapping exists, but disagree profoundly on its significance. REU argues the mapping creates an unnatural, belief-centric explanation for a phenomenon better understood as risk sensitivity. |

  ### Section 3: Cruxes and Testable Predictions

  1.  **Crux: The Retiree Case (Wealth/Correlation Explanations vs. Structural Risk Aversion)**
      *   **Agreed Test:** Design experiments or identify real-world cases involving small-scale, independent (or minimally correlated) gambles offered to individuals where background wealth is either (a) held constant and well-understood, or (b) explicitly incorporated into the gamble structure *from the agent's perspective*. Crucially, the gambles must be simple enough that complex correlation structures or wealth interactions are implausible as the *agent's actual reasoning process*, yet exhibit the reject-individual/accept-package pattern.
      *   **EU Prediction:** When background wealth is properly modeled *and* the bets are truly independent (or their interaction fully accounted for within the outcome space), the reject-individual/accept-package pattern will either (a) disappear, indicating it was initially irrational/framed incorrectly, or (b) be fully explained by the concavity of the utility function defined over final wealth outcomes without needing a separate risk-weighting mechanism. Finding this pattern under conditions of clear independence and controlled wealth would challenge core EU.
      *   **REU Prediction:** The reject-individual/accept-package pattern will persist robustly even under conditions of controlled background wealth and minimal correlation between simple, independent bets. This pattern is a direct consequence of rational structural risk aversion (convex risk function) and cannot be adequately explained solely by outcome utility concavity. Failing to find this pattern in such controlled settings would challenge core REU.

  2.  **Crux: The "Beliefs in Disguise" Objection (Interpretation of the Formal Mapping)**
      *   **Agreed Test:** Investigate the **psychological processes and normative justifications** agents provide for choices violating EU Independence (like Allais or the retiree case).
      *   **EU Prediction:** When agents violate Independence, their reasoning will predominantly involve (a) misperceptions of probabilities (akin to distorted `p'`), (b) focusing on misleading descriptive features rather than final outcomes, or (c) concerns better modeled as changes in final wealth state utilities (`u'`) or background risk. Appeals to the "spreading out of risk" or the "source" of uncertainty will be reducible to these factors.
      *   **REU Prediction:** Agents will frequently justify violations of Independence (like preferring certainty or package hedging) by appealing directly to the **distribution of chances** and a desire to **avoid downside dispersion** or **control exposure**, *independent* of specific probability misestimations or final wealth utility calculations. They will describe a distinct attitude towards the *risk structure* itself, aligning with the conceptual primitive of the risk function `r`.

  ---

  **Signatures:**

  _________________________
  (Proponent of Orthodox Expected Utility)

  _________________________
  (Proponent of Risk-Weighted Expected Utility)

  **Date:** October 26, 2023

  ---
  **Rationale for Key Judgment Calls:**

  1.  **Probability Distortion = Substantive:** Calling this "not merely verbal" is crucial. While mathematically isomorphic preferences exist, the *interpretation* of what the agent is rationally doing (distorting beliefs vs. applying a risk attitude) is a deep philosophical and psychological disagreement about the nature of rationality and preference formation. The document forces this by having both sides agree the mapping exists but disagree on its meaning and by tying predictions to psychological justifications.
  2.  **EU Position on Retiree Case:** Wording emphasizes their core claim (modeling error or irrationality) without conceding REU's point. The phrase "REU attributes necessity to a mechanism... that is superfluous or mistaken" captures the EU view that risk-weighting is the wrong explanation.
  3.  **REU Position on Retiree Case:** Wording emphasizes the direct structural explanation ("global, structural aversion") and counters the EU view by characterizing their explanations as often being "redescribing the phenomenon."
  4.  **No Hedging:** Predictions are concrete and falsifiable. The retiree crux specifies the conditions for a clean test. The beliefs-in-disguise crux moves beyond choice patterns to process tracing/justifications. Both sides commit to what would challenge their view. "More work" is inherent in *conducting* the tests, not in the *conclusions* drawn from potential results.
  5.  **Agreed Claims:** Carefully worded to reflect common ground without implying agreement where none exists (e.g., Allais shows descriptive failure, *not* that it's normatively ok; both owe explanations).
