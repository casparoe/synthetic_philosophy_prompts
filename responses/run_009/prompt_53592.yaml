  The user wants the document to include: agreed claims about vNM framework and Allais paradox, clear disagreements worded acceptably to both sides, and resolved cruxes—especially whether risk-weighting is just distorted probabilities and the retiree case. They insist on definitive stances, not vague "more work needed" conclusions.

