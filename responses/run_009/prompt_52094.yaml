prompt: |-
  I teach a world-history survey, and I've reached the point where I have to decide whether to keep using the word "collapse" in the course or retire it in favor of something like "reorganization." Before deciding, I want the specification first: what would an adequate theory of societal collapse have to deliver? The cases it must handle are the Late Bronze Age eastern Mediterranean, the Terminal Classic Maya lowlands, and Easter Island, and I want the requirements to come out of the ways these cases pull against each other: palace economies unraveling while populations largely persist and new states eventually form; lowland Maya city-states abandoned over a century and a half while millions of Maya descendants continue to this day; and a revisionist literature arguing that Easter Islanders were managing their environment sustainably and that the real damage came with contact rather than self-inflicted ecocide. The theory should specify what exactly collapses (a political system, a population level, a way of life?), say something causal without reducing to climate determinism or a single mechanism like Joseph Tainter's diminishing marginal returns on complexity, and it must neither imply that the people vanished nor become so elastic that no episode counts as failure. Please say which desiderata are non-negotiable, which are prejudices of particular camps, which pair you suspect cannot be jointly satisfied, and which single requirement does the most to exclude contenders. Finish with a brief scorecard for Tainter-style complexity accounts, Diamond-style environmental narratives, and the resilience/continuity school — brief, since the criteria are what I most want to see.
reasoning: |-
  Okay, the user teaches world history and is struggling with whether to keep using "collapse" or switch to "reorganization." They need a theory that handles three specific cases: Late Bronze Age Mediterranean, Terminal Classic Maya, and Easter Island. Each case presents different challenges—like political systems falling but populations staying, or debates about ecocide versus external factors.

  First, I need to figure out the core requirements for such a theory. The user wants to avoid implying disappearance of people or oversimplifying causes. They also want the term to clearly define what's collapsing—political structures, not the people themselves. The theory must handle both rapid and slow declines without being too vague.

  Looking at the cases, the Late Bronze Age shows state collapse but cultural continuity. The Maya had urban abandonment but cultural survival. Easter Island's narrative is contested, with arguments against self-inflicted ecocide. So the theory needs flexibility but clear boundaries to distinguish collapse from minor changes.

  Key non-negotiables: No vanishing populations, avoid determinism, specify what collapses (political/economic systems). Prejudices might include environmental determinism in Diamond's view or Eurocentric progress narratives. Tension exists between seeing collapse as abrupt versus gradual reorganization.

  The hardest requirement is defining collapse without implying extinction but also not stretching "reorganization" to include any change. That probably excludes many theories. 

  Now, assessing existing frameworks: Tainter's complexity theory works for political structures but ignores continuity. Diamond's environmental focus gets criticized for ignoring human agency. Resilience theory handles continuity well but might downplay real collapses as just transformations.

  The user's deeper need might be to present history accurately without perpetuating myths of vanished civilizations. They want students to understand that societies transform, but sometimes systems do fail. The answer should balance academic rigor with ethical considerations, ensuring terminology reflects both change and persistence.
answer: |-
  Here’s a specification for an adequate theory of societal collapse, derived from your cases and constraints, followed by a scorecard of existing approaches against these criteria:

  ### Non-Negotiable Desiderata (Must-Have)
  1.  **Specifies the Collapsing Unit:** Must define *what* collapses (e.g., centralized state institutions, elite political project, monumental construction capacity, integrated economic networks) – *not* the people or culture as a whole.
  2.  **Acknowledges Continuity:** Must explicitly account for demographic/cultural survival and subsequent reorganization (e.g., post-palatial Aegean villages, Maya diaspora & highland states, Rapa Nui cultural persistence).
  3.  **Multi-Causal & Non-Deterministic:** Must integrate *interacting* factors (e.g., climate stress *plus* institutional rigidity *plus* conflict *plus* trade disruption) without granting primacy to a single cause (climate, complexity, environment alone).
  4.  **Avoids "Vanishing People" Trope:** Must preclude interpretations where collapse implies extinction or cultural erasure.
  5.  **Defines Failure:** Must establish clear thresholds for "collapse" distinct from mere decline, transformation, or crisis (e.g., loss of state monopoly on violence, irreversible abandonment of core urban/symbolic centers, breakdown of key integrative systems).

  ### Camp-Specific Prejudices (To Be Mitigated)
  1.  **Collapse Camp:** Often implies civilizational "end," overemphasizes rapidity/catastrophe, neglects resilience/continuity (e.g., older Maya "mystery" narratives).
  2.  **Continuity/Resilience Camp:** Risks downplaying real ruptures, suffering, and loss; can stretch "reorganization" to obscure genuine failure of core systems (e.g., minimizing the profound rupture of Maya lowland abandonment).
  3.  **Environmental Determinism (Diamond-esque):** Over-privileges environment, downplays agency/politics, often relies on "ecocide" narratives (directly challenged by Easter Island revisionism).
  4.  **Great Man/Event History:** Seeks singular triggers (volcano, battle, leader) over systemic fragility.

  ### Likely Irreconcilable Tension
  *   **Abrupt Catastrophe vs. Protracted Transformation:** Defining a clear "collapse" threshold while fully incorporating cases like the Maya (century+ process) or the LBA (rapid in some areas, phased elsewhere) is extremely difficult. Does "collapse" describe the *trigger event*, the *process*, or the *end state*? A theory might struggle to encompass both the rapid unraveling of palatial networks *and* the slow depopulation of Copan without becoming either too rigid or too vague.

  ### Most Excluding Requirement
  *   **Defines Failure:** This requirement excludes theories that see *all* change as adaptive reorganization or cyclical fluctuation. It forces a distinction between "change" and "collapse," demanding criteria for when a system breakdown constitutes a fundamental failure relative to its own prior state or goals (e.g., inability to maintain elite palaces, monumental calendars, or moai transport), even if people and culture persist.

  ---

  ### Scorecard: Existing Frameworks vs. Criteria

  | Criterion                     | Tainter (Complexity)                  | Diamond (Environment)                  | Resilience/Continuity                |
  | :---------------------------- | :------------------------------------ | :------------------------------------- | :----------------------------------- |
  | **Specifies Collapsing Unit** | **✓ (Political/Admin. Complexity)**   | **~ (Broad "Society" - often vague)**  | **✗ (Often avoids defining loss)**   |
  | **Acknowledges Continuity**   | **✗ (Focuses on system failure)**     | **✗ (Implies broader civilizational failure)** | **✓✓ (Core Strength)**               |
  | **Multi-Causal**              | **~ (Complexity focus; other factors secondary)** | **✗ (Environment primary/sole cause)** | **✓✓ (Integrates multiple drivers)** |
  | **Avoids "Vanishing People"** | **✓ (Focuses on system)**             | **✗ (Implies societal death)**         | **✓✓ (Explicit on persistence)**     |
  | **Defines Failure**           | **✓✓ (Clear: Complexity unsustained)** | **✓ (Clear: Environmental overshoot)** | **✗ (Failure = Transformation)**     |
  | **Handles Your Cases:**       |                                       |                                        |                                      |
  | *LBA (Palace Econ.)*          | **✓✓ (Fits complexity loss)**         | **~ (Climate + env. stress part)**     | **~ (Downplays rupture)**            |
  | *Maya (Abandonment)*          | **~ (Fits, but slow?)**               | **~ (Drought part, but oversimplifies)** | **✓ (Continuity strong)**            |
  | *Easter Island (Revisionism)* | **✓ (Fits political breakdown)**      | **✗ (Contradicts ecocide narrative)**  | **✓✓ (Fits managed change + contact impact)** |

  ### Recommendation & Path Forward
  Retiring "collapse" entirely risks obscuring genuine ruptures and failures inherent in your cases. Instead, **retain "collapse" but rigorously redefine it upfront based on the specification:**

  1.  **Explicit Definition:** "Collapse = *The rapid or protracted failure of core political, economic, and/or ideological institutions and networks that defined a specific societal order, leading to the abandonment of key practices/centers, amidst significant human continuity and subsequent reorganization.*"
  2.  **Contextualize:** Always pair "collapse" with discussion of:
      *   *What specifically collapsed?* (Palaces, hieroglyphic tradition, moai cult?)
      *   *What survived/continued?* (Villages, farming, language, lineages?)
      *   *How did reorganization unfold?*
  3.  **Contrast with "Reorganization":** Use "reorganization" for periods of significant change *without* the failure of core systems defining the prior order. "Collapse" marks the end of *that specific order*.

  This approach leverages the analytical power of "collapse" to denote specific institutional failures demanded by the LBA and Maya cases, satisfies the non-negotiable requirement to avoid population disappearance, embraces the multi-causal insights of resilience theory, incorporates Easter Island revisionism by focusing on the *political/ritual system's* end rather than population crash, and crucially, defines a threshold for failure distinct from mere change. It forces precision while acknowledging the messy reality of human survival and adaptation.
