prompt: |-
  I've been writing fiction for about fifteen years, and there's a pattern in my working life that I have never managed to put a name to, so let me describe it and ask whether philosophy has one. When I draft a scene of dialogue, I make hundreds of micro-decisions — where to break a line, when to let a character lie, which sentence to cut — with a reliability I trust completely; the prose comes out right. But whenever anyone asks me to state the principle behind a given choice, what comes out of my mouth is either trivially empty ("it improves the rhythm") or demonstrably false as a general rule. I once taught a workshop where I wrote down ten of my working rules for dialogue on a whiteboard and my students used them to produce uniformly dead prose, while I could not write a single bad line under the same constraints if I tried. My ability to state my standards and my ability to meet them have almost no detectable relationship to each other, and the stated versions are worse than useless when transferred to anyone else.

  There is a second half to the pattern that I suspect matters. I can state, precisely and with evidence, a fact about my own craft that I am entirely unable to act on: I know — in the ordinary, citable sense — that my endings rush, I can point at three published novels of mine where the final chapter compresses what should have taken fifty pages, and this propositional knowledge has never once helped me slow down. So within one person I find skill that cannot be articulated, articulation that does not transfer, and articulated knowledge of a failure that produces no improvement. A friend once mentioned offhand that philosophers have an old distinction between knowing-how and knowing-that, but my situation doesn't look like a clean instance of either side: it's the weird two-way dissociation, together with the fact that my post-hoc explanations of my own choices seem to be rationalizations rather than reports, that I'm trying to pin down. Is there an established concept, or family of concepts, that covers exactly this configuration — and if the standard ones only cover parts of it, I'd want to know which parts, what the nearest candidates fail to capture, and where the edges of each lie. A bare label won't help me; I want the carving.

  I'd also ask that you be candid about the fit: say how confident you are in each identification you offer, and single out the point in your answer you're least sure of — I'd rather know where the concept I'm being handed is doing real work and where it's just the closest shelf I could reach.
reasoning: |-
  Okay, let me start by understanding the user's problem. They've been writing fiction for fifteen years and notice a pattern: their intuitive decisions during dialogue drafting are effective, but they can't articulate the principles behind them. When they try to state these principles, the explanations are either trivial or false, and applying those rules leads to dead prose. Additionally, they know propositionally that their endings rush but can't act on that knowledge. They mentioned the know-how vs. know-that distinction but feel it doesn't fully capture their situation because of the two-way dissociation.

  First, I need to recall philosophical concepts related to knowledge and skill. Ryle's knowing-how vs knowing-that comes to mind, but the user already knows that. The key here is the dissociation between the two. Polanyi's tacit knowledge fits well for the unarticulated skill part. Tacit knowledge is personal, context-dependent, and hard to formalize, which explains why their rules don't transfer to students. 

  Next, the rationalizations they mention point to confabulation. When pressed for reasons, they might be constructing plausible but inaccurate explanations. This is common in expertise where the real processes are unconscious. The student's failure to produce good prose with those rules shows that the stated principles aren't the actual drivers of their skill.

  For the second part about knowing but not acting, akrasia or weakness of will might be relevant. But akrasia usually involves conflicting desires, whereas here the issue might be procedural vs. declarative knowledge. Even though they know declaratively that endings rush, that knowledge doesn't translate into procedural adjustments. This gap between knowing-that and knowing-how in both directions is crucial.

  I should also consider the Dreyfus model of skill acquisition. The user operates at an expert level where actions are intuitive. Articulating rules might force them back to a competent stage, which disrupts their natural flow. Their inability to write badly under their own rules suggests those rules are post-hoc, not generative.

  The user wants a precise mapping of concepts to each part of their problem. They need to know where each concept applies and where it falls short. For example, tacit knowledge explains the inarticulable skill but not the failure to act on known issues. Akrasia might touch on the latter but doesn't account for the rationalizations.

  I need to check if there's a concept that ties all three together. The two-way dissociation between declarative and procedural knowledge seems central. Philosophy might not have a single term, but combining tacit knowledge, confabulation, and the procedural-declarative gap covers it. 

  The user also values candidness about fit. I should note that tacit knowledge and confabulation are strong fits, but akrasia is weaker since it's more about desire than skill internalization. The weakest point might be linking the procedural-declarative gap to the ending issue, as it's more a cognitive science angle than pure philosophy.

  In summary, breaking down the problem into three parts and applying different concepts to each, while explaining their interconnections, should address the user's need for a nuanced carving of their experience.
answer: |-
  Your situation is a fascinating case study in the philosophy of mind, epistemology, and action theory. It reveals a **threefold dissociation** that standard distinctions (like know-how/know-that) partially illuminate but don't fully capture. Here's the conceptual carving, with candid assessments of fit:

  ### Core Components & Best-Fitting Concepts
  1.  **Skillful Execution Without Articulable Principles (Dialogue Crafting):**
      *   **Best Fit: Michael Polanyi's "Tacit Knowledge"** (Confidence: High)
          *   *What it captures:* Your ability relies on deeply internalized, personal, context-sensitive knowledge gained through experience ("indwelling"). It *cannot* be fully codified into explicit rules or propositions without losing its essence. Like riding a bike, the "rules" you state (e.g., "balance") are inadequate descriptions of the complex sensorimotor integration happening.
          *   *Why it fits perfectly:* The micro-decisions are holistic, driven by a "feel" developed over 15 years. Stating rules distorts this tacit dimension. Your students' failure proves the rules you *can* articulate are not the *actual* drivers of your skill; they are impoverished shadows. Your inability to write badly under them further shows your *real* process bypasses these stated rules entirely.
          *   *Limits:* Polanyi focuses on the *inarticulability* of the *source* of skill. It doesn't directly address the *post-hoc rationalizations* or the *dissociation* from propositional knowledge about failures.

  2.  **Post-Hoc Rationalization of Successful Choices:**
      *   **Best Fit: "Confabulation" (as in Psychology/Philosophy of Self-Knowledge)** (Confidence: High)
          *   *What it captures:* When pressed to explain intuitive judgments or actions, we often generate plausible-sounding but factually inaccurate or incomplete reasons. This isn't lying; it's the conscious mind generating a *story* to explain what the unconscious processes actually did.
          *   *Why it fits perfectly:* Your stated rules ("improves rhythm") are either trivial truisms or demonstrably false when generalized. They are confabulations – attempts to rationalize the output of your tacit knowledge system. They feel empty because they *are* decoupled from the actual causal process.
          *   *Limits:* Confabulation typically explains *why* articulated reasons are bad. It doesn't inherently explain the *skill* itself (covered by Tacit Knowledge) or the dissociation regarding *known failures*.

  3.  **Knowing-That Without Knowing-How (Rushed Endings):**
      *   **Best Fitting *Combination*: Dissociation between Declarative Knowledge & Procedural Knowledge + Akrasia (Weakness of Will)** (Confidence: Moderate-High for dissociation, Moderate-Low for Akrasia)
          *   *Declarative vs. Procedural Knowledge (Cognitive Science):* Declarative knowledge ("knowing-that" - "my endings rush") is factual. Procedural knowledge ("knowing-how" - "how to *pace* an ending") is skill-based. You have strong declarative knowledge *about* your failure but lack the corresponding procedural knowledge *to fix it*. This creates a specific *gap*.
          *   *Why it fits:* You can cite evidence (novels) demonstrating the *fact* of rushing. This is clear declarative knowledge. Your inability to "slow down" reveals a deficit in the *procedural* knowledge governing pacing *during the final creation phase*. The tacit system driving your dialogue mastery seems to override or remain unaffected by this declarative awareness during climax drafting.
          *   *Akrasia? (Philosophy):* Knowing the better course but failing to take it due to conflicting desires/impulses. *Weak Fit:* While structurally similar, akrasia usually implies a conflict of *values/desires* ("I *want* to slow down but I *desire* to finish more"). Your description suggests less a *desire* conflict and more a *competence* gap – the tacit system simply *doesn't know how* to execute the slower pace, even when the conscious mind knows it *should*. The failure feels more like a missing skill than succumbing to temptation.

  ### Synthesizing the Threefold Dissociation & The "Carving"
  *   **The Core Phenomenon:** You exhibit a **bi-directional dissociation between System 1 (Tacit/Procedural/Intuitive) and System 2 (Explicit/Declarative/Reflective) processing**, coupled with **confabulation** when System 2 tries to explain System 1's output.
      1.  **System 1 Mastery (Tacit/Procedural):** Your dialogue skill operates here. It's fast, intuitive, reliable, and *inaccessible* to direct conscious articulation. Attempts to articulate its rules yield confabulations.
      2.  **System 2 Knowledge (Declarative):** You possess accurate declarative knowledge *about* a specific failure mode (rushed endings).
      3.  **Dissociation 1 (Skill -> Articulation):** System 1's successful operation *cannot* be accurately translated into System 2 rules (leading to confabulation). The rules are not the source.
      4.  **Dissociation 2 (Articulation -> Skill):** System 2 rules *derived* from System 1's output *cannot* generate the skill, even in you (because they are confabulations, not the real process).
      5.  **Dissociation 3 (Knowledge -> Correction):** System 2's accurate declarative knowledge *about* the ending failure *cannot* effectively reprogram or overcome the limitations of System 1's procedural knowledge *during the act of writing the ending*. Knowing-*that* doesn't confer knowing-*how-to-fix-it*.

  ### Where the Fit is Weakest & Concepts Stretch
  *   **Weakest Point: Applying "Akrasia" to the Ending Problem.** (My least confident identification)
      *   *Why weak:* Your description emphasizes a *procedural incapacity* ("I **could not** slow down") rather than a clear *desire conflict* ("I *wanted* to slow down but *wanted* to finish more"). It feels more like your intuitive writing system lacks the "slow ending" subroutine than that you actively choose against using it. Declarative knowledge alone is insufficient to build this missing procedural skill. "Weakness of will" feels too loaded with notions of moral failure or desire conflict that don't quite map.
      *   *Better Conceptualization:* This is primarily the **failure of declarative knowledge to translate into procedural competence**. It highlights that *knowing about a problem* is distinct from *having the skill to solve it*, even when the skill domain (writing) is shared. Your tacit system for endings might be rigid or underdeveloped compared to your dialogue system. The declarative knowledge exists but remains inert because it doesn't engage the *mechanism* of action (the procedural system).

  ### The Standard Distinction: Know-How vs. Know-That (Gilbert Ryle)
  *   **What it Captures:**
      *   Your dialogue mastery is paradigmatic *know-how* (ability).
      *   Your knowledge about rushed endings is paradigmatic *know-that* (proposition).
      *   It correctly distinguishes the *types* of knowledge involved.
  *   **Where it Falls Short:**
      *   It doesn't address the *inability to articulate* the know-how (beyond just saying it's "practical").
      *   It doesn't explain the *confabulation* when attempting articulation.
      *   It doesn't explain the *dissociation* – why your robust know-how (dialogue) exists alongside a *lack* of know-how (pacing endings) *despite* having relevant know-*that* about the ending problem. Ryle's distinction is static; your case shows dynamic failures of interaction between the two types.

  ### In Summary
  *   **Your Skillful Execution:** Explained by **Tacit Knowledge (Polanyi)**.
  *   **Your Failed Articulations:** Explained by **Confabulation**.
  *   **The Lack of Transfer/Your Inability Under Rules:** Explained by the **nature of Tacit Knowledge** (it's personal, context-bound) and the fact your stated rules are **Confabulations**, not the real source.
  *   **Knowing the Failure Without Correcting It:** Best explained by a **dissociation between Declarative Knowledge** (knowing-*that* the endings rush) and **Procedural Knowledge** (lacking the know-*how* to pace endings correctly), situated within the **System 1 / System 2 framework**. *Akrasia* is a possible but weaker fit here.
  *   **The Core Pattern:** A **bi-directional dissociation between intuitive/procedural (System 1) and reflective/declarative (System 2) processing**, with **confabulation** occurring when System 2 attempts to explain System 1's outputs.

  Philosophy provides sharp tools (Tacit Knowledge, Confabulation, Declarative/Procedural distinction) to dissect the *components* of your experience. The unique configuration – the *two-way* dissociation combined with confabulation and a specific skill gap despite declarative awareness – isn't captured by a single, neat label, but emerges clearly from combining these concepts. Your writing mind's System 1 is a master of dialogue but has a blind spot for endings, and your System 2 is an unreliable narrator of System 1's success and powerless to fix its specific failure.
