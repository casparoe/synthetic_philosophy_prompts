answer: |-
  ### Restatement of Leibnizian Doctrine in Optimisation Vocabulary  
  Based on your mappings and constraints (British English throughout), here is the restatement, pressing on ambiguities and tightening phrasing where possible.  

  **Core Framework:**  
  - **Feasible region (Ω)**: Set of all *possible worlds*, defined by *compossibility constraints*. Each world \( w \in \Omega \) is a vector of mutually compatible substances/events.  
  - **Objective function (Π)**: *Degree of perfection*, a scalar quantity maximised by God. Leibniz’s trade-off between "simplicity of laws" (parsimony) and "richness of phenomena" (diversity) is **not a vector objective** but a *single scalarised metric*. It is a weighted composite \( \Pi(w) = \alpha \cdot \text{Simplicity}(w) + \beta \cdot \text{Richness}(w) \), with divinely chosen weights \( \alpha, \beta \).  
  - **Solver**: God, who executes a *global optimisation* over Ω.  
  - **Optimality conditions**: The *Principle of Sufficient Reason* (PSR) requires that the solution \( w^* \) satisfies:  
    - **Attainment**: \( \Pi(w^*) = \sup_{w \in \Omega} \Pi(w) \) (finite optimum exists).  
    - **Uniqueness**: \( w^* \) is the sole global maximiser (addressed below).  
  - **Constraints**: Composibility defines Ω. These are *fixed* by logical/metaphysical necessity (e.g., "square circles" are infeasible).  

  **Responses to Specific Queries:**  
  1. **Scalar vs. Vector Objective**:  
     - Leibniz’s "simplicity/richness" trade-off is **scalarised implicitly**. He treats perfection as a single, divinely weighted aggregate.  
     - *Why not Pareto?* If Π were vector-valued, non-unique Pareto-optimal worlds would violate PSR (no sufficient reason to choose one over another). Leibniz avoids this by asserting God’s wisdom collapses trade-offs into one *best* metric. **Distortion**: Leibniz never specifies weights, making Π underdefined.  

  2. **Attainment and Uniqueness**:  
     - **Attainment is required**: Ω must be compact, and Π continuous, ensuring \( w^* \) exists. Leibniz assumes this (infinite wisdom excludes unbounded improvement).  
     - **Uniqueness is necessary but problematic**:  
       - PSR demands uniqueness—else choice between tied optima is arbitrary.  
       - But Leibniz never proves uniqueness mathematically. He *assumes* it via divine rationality: God’s intellect computes a single \( w^* \).  
       - **Tension**: In nonconvex Ω (guaranteed for "all possible worlds"), uniqueness is exceptional. Leibniz implicitly posits Π and Ω are structured to ensure a unique optimum—a substantive, unverified axiom.  

  3. **Theodicy as Duality**:  
     - **Evil as shadow prices**:  
       - Let constraint \( g_i(w) \leq 0 \) represent a moral "limit" (e.g., free will permitting evil).  
       - The dual variable \( \lambda_i \geq 0 \) (shadow price) quantifies the marginal gain in Π from relaxing \( g_i \).  
       - *Free-will defence*: Free will is a binding constraint (\( g_i(w^*) = 0 \)). Preventing evil would require deleting \( g_i \), but doing so reduces Π (as \( \lambda_i > 0 \) reflects lost "greater good").  
       - *Best-whole defence*: Suboptimal worlds (e.g., no evil) are *infeasible*—they violate composibility (\( w \notin \Omega \)). Thus, \( w^* \) is primal-feasible and dual-optimal.  
     - **Illuminating? Partially**:  
       - Shadow prices formalise "cost of preventing evil."  
       - **Distortion**: Leibniz’s evil is *permitted* (not actively chosen), aligning with dual variables as emergent. But his theology implies God *wills* the whole solution—a primal act, not dual reaction.  

  4. **Epistemic Status of Optimality Claim**:  
     - Asserting global optimality from a single interior point is **uncheckable without oracle access**.  
       - We observe \( w^* \) but cannot enumerate Ω or evaluate Π elsewhere.  
       - Leibniz claims *sufficient reason* implies optimality: any apparent defect must yield net gains (local KKT conditions). But this is circular without global knowledge.  
     - Leibniz’s stance: Optimality is *deduced* from God’s attributes (perfect solver), not empirically verified. We infer optimality from harmony/phenomena, but this is heuristic (like inferring convexity from a single point).  

  ---

  ### Residue Report  
  **Pile 1: Cleanly Mapped Concepts**  
  - Feasible region (Ω) ←→ Possible worlds.  
  - Constraints ←→ Composibility (logical consistency).  
  - Objective function (Π) ←→ Perfection (though its construction is vague).  
  - Global optimum \( w^* \) ←→ Actual world.  
  - Principle of Sufficient Reason ←→ Optimality conditions (KKT or similar).  
  - Duality intuitions ←→ Shadow pricing of evils.  

  **Pile 2: Distorted to Fit**  
  1. **God’s "Choice" as Solving**:  
     - *Distortion*: Mathematical solvers follow deterministic algorithms. Leibniz’s God has "moral necessity"—He *must* choose \( w^* \), but this resembles solver logic, not conscious choice. Leibniz’s God is less "solver" and more "necessary actor."  
  2. **Simplicity/Richness Trade-off**:  
     - *Distortion*: Leibniz’s trade-off is metaphysically profound; reducing it to weights \( \alpha, \beta \) trivialises divine wisdom.  
  3. **Uniqueness**:  
     - *Distortion*: Assumed without proof. In optimisation, uniqueness requires strict convexity or similar—conditions Leibniz never provides.  

  **Pile 3: Cannot Be Expressed**  
  1. **Moral Necessity of God’s Choice**:  
     - Leibniz: God is *not free* to choose suboptimal worlds. But optimisation solvers don’t "choose"—they compute. The *constraint* that God *must* optimise is external to the model.  
  2. **Pre-Existing Composibility Constraints**:  
     - Ω is defined by logical/metaphysical rules *prior* to optimisation. In your vocabulary, constraints are given, but Leibniz sees them as rooted in God’s intellect—not merely parameters.  
  3. **Non-Aggregative Perfection**:  
     - Leibnizian perfection isn’t strictly additive. A world’s goodness can exceed the sum of parts due to "harmony" (emergent properties). Your Π is additive/scalar; his is holistic.  
  4. **Divine Wisdom as More Than Weighting**:  
     - Choosing \( \alpha, \beta \) is part of the optimisation for Leibniz, but divine wisdom also *structures* Ω and Π. Your vocabulary lacks a meta-optimisation layer.  

  ---

  ### Verdict: Trivial or Uncheckable?  
  - **Collapse into triviality**: If Π is *defined* as "whatever God chooses," optimality is tautological. Leibniz avoids this by independent criteria for perfection (simplicity/richness), but these are underspecified.  
  - **Uncheckable assertion**: Without access to Ω or Π, the claim "\( w^* \) is global optimum" is faith-based. Leibniz knows this—he rests on *a priori* reasoning about God’s nature, not empirical verification.  
  - **Where the analogy fails**: Your vocabulary exposes Leibniz’s gaps:  
    - Uniqueness is assumed, not proved.  
    - Π lacks operational definition.  
    - "Moral necessity" has no optimisation counterpart.  
  - **Conclusion**: The doctrine, in your terms, is an **uncheckable assertion** that relies on untestable axioms (uniqueness, divine weights). The duality insight holds, but Leibniz’s system is less a computational optimisation than a metaphysical deduction. His formulation *is* less clear when pressed mathematically—your vocabulary reveals where hand-waving occurs.  

  ---  
  **Final Note**: Leibniz might retort that God’s solution includes *our deduction of optimality* as part of the best world—making the verification loop closed. But this is self-referential, not mathematically rigorous. The analogy is illuminating, but its residue confirms the doctrine’s status as theology, not operations research.
