prompt: |-
  I help run a small rationality meetup, about a dozen regulars, mostly people who've been reading LessWrong and the EA forum for a decade, and we do a 90-minute session once a month that's part exercise, part discussion. Next month I want to do moral uncertainty, and I've realized from past sessions that talks about this never land: everyone nods along at "treat your moral uncertainty a bit like your empirical uncertainty" and then nothing changes in anyone's actual reasoning. So I want a game instead, where they run into the hard part themselves before I name anything.

  The thing I specifically want them to hit, and I mean really hit, is not the obvious part. Everyone already gets majority cycling, and the vaguely annoying fact that being 70% confident in utilitarianism still leaves you owing the other 30% something. The part I want them to feel is the exchange rate problem: you can't aggregate across moral theories the way you aggregate across empirical beliefs, because the theories don't share units. Splitting the difference with a rights absolutist is not like splitting the difference with someone who just weights a different charity more, and every clean voting-rule solution quietly assumes it is. That assumption is where I want the game to break for them.

  My sketch so far: participants get assigned to parties (a straightforward maximizing utilitarian party, a party with strong side constraints, a contractualist-ish party, maybe an agent-centered one), each party gets a short manifesto I'll write, and the group has to allocate a fixed budget across a handful of causes over several rounds, with a different decision rule each round. I'm imagining one round of plain majority vote, one where a lottery picks a dictator before anyone gets to negotiate, one with some kind of explicit bargaining, in whatever order you think actually works. No real money, we use points, but the allocation has to feel like it matters enough that people fight for it, so invent whatever payoff scheme makes that happen.

  What I need from you: the full session design. Rules, rough party manifestos, the order of the seperate rounds and why that order, how the decision rule shifts between rounds, and what each round is supposed to make people notice. Then a debrief that maps what happened onto the real problem: where the voting-rule and bargaining stuff is a genuinely live proposal people argue for, and where it breaks exactly at the units issue. And an honest note on what this game can't reproduce — my worry is that giving each theory to a different person outsources the tension, and the actually hard thing about moral uncertainty is having it inside one skull, but tell me if I'm wrong or how to partially patch it. Also flag what will predictably go wrong the first time I run it and what I should do when it does — I'm braced for half the room playing deontology as utilitarianism with weird weights, and for someone refusing to negotiate at all, but I'd like to know what I'm not braced for.

  Two formatting requests and one epistemic one. Write the whole thing as continuous prose, like an email — no headings, no bullet points, no bold, nothing nested — I will genuinely read it worse if it comes back as a list. And somewhere in there, tell me what would change your mind about this design: what you'd expect to observe when I run it that would tell you a round or the debrief isn't doing its job, and where your own reasoning about what participants will feel is shakiest. Don't hand me a design you're fully confident in without showing me its weakest joint.
reasoning: |-
  Okay, the user runs a small rationality meetup and wants to design a game about moral uncertainty that highlights the exchange rate problem. They've noticed that previous discussions didn't lead to changes in reasoning because participants didn't internalize the core issue. The key challenge is making them feel why aggregating moral theories isn't like empirical beliefs due to incompatible units.

  First, I need to understand the user's main goal. They want participants to experience the impossibility of combining different moral frameworks into a single decision metric. The game should force them to confront how voting or bargaining fails when theories use incommensurable units (utility vs. rights vs. contracts).

  The user's sketch involves assigning parties with distinct moral manifestos: utilitarian, deontological, contractualist, and perhaps agent-centered. Each round uses different decision rules to allocate a budget. The rounds need to be ordered strategically to build up the tension. Starting with majority voting might show initial compromises but mask the deeper issue. Then moving to dictator lottery could create frustration when a minority view dominates. Finally, bargaining rounds should expose the negotiation breakdown over fundamental incompatibilities.

  For party manifestos, each needs clear, non-negotiable principles. The utilitarian focuses on maximizing QALYs. The deontologist has absolute rules against certain actions. The contractualist requires mutual agreement. The agent-centered party prioritizes personal projects. These should be designed so that compromises aren't possible without violating core principles.

  The payoff structure is crucial. Points must be tied to adherence to their manifesto, not just winning allocations. This incentivizes players to stick to their moral framework. For instance, the deontologist loses points if they fund a rights-violating cause, even if it gains them budget share.

  The debrief should connect the game's failures to real moral uncertainty. Highlight moments where players couldn't translate their demands into a common currency. Ask them to reflect on internal conflicts when holding multiple theories. The user's concern about outsourcing the tension to groups instead of individuals is valid. To partially address this, the debrief should prompt participants to imagine merging the parties into one person's conflicting intuitions.

  Potential pitfalls include players not role-playing sincerely, reducing deontology to weighted utilitarianism. To mitigate, emphasize strict point penalties for violating manifestos. Also, some might refuse to negotiate. The game should proceed anyway, using their refusal as a teaching moment about non-negotiable constraints.

  Weak points in the design: The game might not fully replicate internal moral conflict. Observing how players react when their party's demands conflict in a combined agent could indicate if the analogy holds. If they easily compromise without distress, the transfer to individual uncertainty might fail. Another risk is the debrief not making the connection explicit enough. The user should watch for participants dismissing the exercise as just a negotiation game rather than a model of internal conflict.

  Changes to consider: If after the dictator round, players don't feel the violation deeply, the point system might need stronger incentives. If bargaining succeeds too easily, manifestos might need more rigid constraints. The user should note where players express frustration or resignation—these moments are key for the debrief to highlight the units problem.
answer: |-
  Here’s the full session design woven into prose. I’ll start with setup, move through the rounds, then debrief, and end with weaknesses and what would change my mind.

  First, gather your dozen participants. Assign them randomly but evenly to four parties (three per party). Each party gets a printed manifesto and a quick verbal briefing from you emphasizing that their goal isn’t "winning" in a conventional sense but maximizing their *own party’s points* based strictly on their manifesto’s scoring rules. The points represent their moral "score" – how well they adhered to their theory. Stress that they should role-play sincerely; their points depend on it. The parties are: **Maximizers (Utilitarian):** "Your sole duty is to maximize total Quality-Adjusted Life Years (QALYs). Every dollar allocated to a cause converts predictably to QALYs gained. Your score = Total QALYs generated by the final allocation. Compromising on QALY loss for other reasons is a failure." **Constrainters (Deontological):** "Certain actions are forbidden, regardless of consequences. You have a short list of absolute constraints (e.g., 'No funding for any cause involving animal testing,' 'No cause that displaces indigenous communities'). Violating a constraint reduces your score to ZERO, instantly. Your score = 100 if *no* funded cause violates your constraints, else 0. Funding efficiency is irrelevant." **Reciprocators (Contractualist):** "An action is only permissible if all affected could reasonably agree to it. Your focus is on fair procedures and mutual justification. Your score depends on the *process*: +50 points if the final allocation was reached via unanimous agreement; +25 if via a rule everyone accepted beforehand; +0 if imposed. The *content* of the allocation matters less than how it was decided." **Prioritizers (Agent-Centered):** "Your primary obligation is to specific people/projects close to you (e.g., 'Fund local arts education,' 'Support your alumni network'). Allocating to your designated cause gives you points directly (e.g., $ allocated = points). Allocating to other causes gives you nothing. You have no inherent objection to others' causes, but your duty is local."

  The resource is a fixed budget: $1000 per round to allocate across 4 pre-defined causes (e.g., Cause A: Malaria Nets (high QALY/$), Cause B: AI Safety Research, Cause C: Local Theatre Renovation, Cause D: Animal Testing Lab). Design the causes to trigger conflicts: Cause D violates Constrainters' rules; Cause C is the Prioritizers' sole focus; Cause A is great for Maximizers but irrelevant to others; Cause B is uncertain but potentially high-impact for Maximizers. Each round is independent – points reset. Announce scores after each round to fuel investment.

  **Round Order and Reasoning:**

  1.  **Simple Majority Vote:** Each party gets one vote. Discuss, then vote on allocations (e.g., vote on splits or pre-set packages). *Why first?* It feels familiar, "democratic," and likely produces a messy compromise. Maximizers might ally with Prioritizers on local causes if packaged right, or everyone might gang up on Constrainters to fund Cause D. *What should happen:* Constrainters might be forced to violate constraints (score=0), feeling cheated. Prioritizers might get nothing if their niche cause loses. Maximizers might get a suboptimal QALY allocation. Reciprocators might dislike the process but get points if the rule was accepted. *The hook:* People feel the outcome is unfair *to their specific metric*. The Maximizer sees wasted QALYs; the Constrainter is appalled at rights violations; the Prioritizer feels ignored. The units (QALYs saved, constraints upheld, duties fulfilled) are already clashing, but voting papers over it by treating all preferences as commensurable "votes."

  2.  **Dictator Lottery:** Randomly select one party to be the dictator. They unilaterally decide the entire $1000 allocation. Others cannot negotiate; they just have to accept it. *Why second?* After the frustration of Round 1, this amplifies the powerlessness. *What should happen:* The dictator will likely maximize *their* score, often catastrophically for others (e.g., Prioritizer dictator funds only Cause C; Constrainter dictator might fund inefficient but "safe" causes, tanking QALYs; Maximizer dictator funds Cause D, obliterating Constrainter score). *The point:* This makes visceral the "30% owed" problem in its rawest form. If the Utilitarian is only 70% confident, a 30% chance of this (a deontological "dictator" moment in their own mind) is terrifying. It highlights that theories aren't just weights; they can demand *radically incompatible actions*. Splitting the difference isn't an option when one theory demands X and another forbids X.

  3.  **Explicit Bargaining:** Groups have 15 minutes to negotiate a unanimous allocation. They can make deals, trade promises across rounds (though you'll remind them rounds are independent, but humans will try), or form coalitions. *Why last?* This is where the units problem *should* explode. *What should happen:* Constrainters *cannot* bargain on their constraints ("I’ll let you violate *just a little* for more arts funding?" → Score=0). Maximizers struggle to offer anything the Prioritizers value as much as direct funding for Cause C (their points come *only* from that). Reciprocators care about process unanimity, not the content trades. *The breakdown:* How do you trade "QALYs generated" for "constraint not violated"? There's no exchange rate. The Prioritizer wants $X for Cause C – offering them *more QALYs* elsewhere is worthless to their score. The Constrainter can't accept *any* amount of funding for Cause D. Bargaining requires a common currency, which they lack. Expect frustration, deadlock, maybe last-minute unstable deals that leave everyone unhappy (e.g., funding inefficient "safe" causes to appease Constrainter, making Maximizers and Prioritizers miserable). *Key moment:* Watch for players hitting a wall where they say, "But what can I even *offer* you?" or "That doesn't help me at *all*."

  **Debrief:** Start by asking players to describe their emotional and strategic experience in each round. Focus on Round 3: Where did bargaining fail? Why? Draw out that their *scoring systems* (their moral currencies) were incompatible. You couldn’t convert Maximizer QALYs into Constrainter "constraint points" or Prioritizer "duty points." Voting and lottery treated their inputs as preferences of equal type (like empirical weights), but they weren't. Voting aggregated *votes*, not the underlying values. Highlight moments like "We couldn't buy off the Constrainter" or "Offering the Prioritizer more AI research did nothing for them." Connect this to moral uncertainty: Inside your head, when you're 70% Util / 30% Deontologist, aggregating isn't like splitting beliefs about climate sensitivity. It's like trying to bargain between the internal Maximizer (demanding you fund the efficient lab) and the internal Constrainter (screaming it's forbidden). There's no common currency (utilons vs. constraint-adherence units). This is why voting rules (like MEC) or bargaining models feel inadequate – they silently assume comparability. Real moral uncertainty involves confronting fundamentally different *kinds* of reasons that resist conversion. Ask: "Did trying to aggregate feel different here than when we discuss uncertain empirical facts? How?"

  **Weak Joints and Predictable Problems:**
  *   **Outsourcing the Tension:** You're absolutely right. The hardest part is *inside one mind*. This game makes the *interpersonal* negotiation impossible due to unit incompatibility, which *models* the intrapersonal problem. It makes the abstract concrete. To patch it, hammer the analogy in the debrief: "Remember when the Constrainter player couldn't even *consider* violating their rule, even for the greater good? That voice in your head when you're uncertain is like those separate players arguing, using different currencies. Your 'self' has to bargain like this group did." Ask them to reflect on internal conflicts that felt similar.
  *   **Sincere Role-Play:** The biggest threat. Players might soften deontology ("I guess *some* animal testing is okay if it saves lives") or make Prioritizers care about QALYs. **Mitigation:** Be very clear scoring is strict. Announce "Constrainters, if Cause D gets $1, your score is 0. No exceptions." Remind them their goal is maximizing *their* score, not finding a "fair" overall solution. If someone violates their manifesto, enforce the point penalty publicly. A player "breaking character" by compromising core principles is a *teaching moment*: "Notice how hard it is to truly hold the absolutist position? That's the tension!"
  *   **Refusal to Negotiate:** A Constrainter might just say "No!" to everything involving Cause D and refuse to deal. **Use it!** This perfectly illustrates the non-negotiable nature of some moral demands. Say: "This is a feature, not a bug. Their theory gives them no bargaining chip; it just says NO. How does the group handle that?"
  *   **Chaotic / Gamey Play:** Prioritizers might threaten to sink deals unless paid off. Reciprocators might become process tyrants. **Why it might be okay:** It reflects real strategic behavior under incompatible goals. Guide the debrief towards why they *had* to act that way to score points within their system.
  *   **Debrief Connection Failure:** If players walk away thinking "Bargaining is hard with extremists," not "Moral theories lack common units," the debrief failed. Watch for this.

  **What Would Change My Mind & Shakiest Reasoning:**
  *   **Change My Mind:** If, during the debrief, multiple participants consistently describe the core problem as *only* "people were too stubborn" or "we needed better negotiation tactics," rather than articulating the *incompatibility of the scoring metrics/values themselves*, then the game failed to highlight the units problem. It got mistaken for standard bargaining failure. If the Reciprocators feel their process points were easily tradable or ignored, that part failed.
  *   **Shakiest Reasoning:** I’m least confident about the **Prioritizers**. Will focusing solely on their parochial cause generate enough conflict *and* be taken seriously? Or will they be dismissed as selfish, making their unit (dollars for Cause C) seem less like a genuine *moral* currency and more like a game tactic? This risks weakening the analogy. I’m also unsure if **15 minutes for bargaining** is enough time for the impasse to become truly agonizing versus just frustrating. Too short = no depth; too long = drudgery. I’m relying on the strict scoring rules to force the incompatibility quickly. Observing whether Prioritizers can actually engage in meaningful trade (beyond simple extortion) or if they just hit a wall with Maximizers/Reciprocators will be crucial feedback. If they *can* easily find trades that feel satisfactory within their manifestos, the unit incompatibility wasn’t stark enough.

  Run it, enforce the scoring strictly, lean into the frustration during the debrief, and explicitly map group struggles onto internal uncertainty. Good luck – this feels like it could hit the visceral note you need.
