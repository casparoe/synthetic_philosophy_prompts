answer: |-
  Your request is surgical in its precision—a craftsperson asking for their tools to be tested against foreign material. Below is the translation of the policy debate into narrative terms, followed by the residue report you requested. I’ve adhered strictly to your vocabulary, flagging empirical claims as "stage directions" and preserving your distinction between what craft can/cannot adjudicate.

  ---

  ### **The Debate Restated in Narrative Craft Terms**  
  *(Nordic Model vs. Full Decriminalization)*  

  1. **Focalization & Interiority**  
     - **Nordic Model**: Frames the sex worker as an **object of action** (buyers criminalized; "what is done to her"). Her interiority is filtered through societal trauma narratives—her voice exists in free indirect discourse *only when* it aligns with victimhood. Buyers lack interiority; they are flat antagonists.  
     - **Decrim (NZ)**: Sex workers hold **subject position**. Interiority is granted unconditionally—her desires, frustrations, and calculations drive scenes. Buyers may have shallow interiority (as clients do in workplace narratives), but her focalization dominates.  

  2. **Backstory as Determinant vs. Texture**  
     - **Nordic**: Entry into sex work is the **inciting incident of trauma**. Backstory (poverty, abuse, coercion) *explains* the present. The novel’s world begins *after* this event; her past is causal, not contextual.  
     - **Decrim**: Entry is **character backstory**, not the inciting incident. It may color her present (e.g., financial pressures), but the plot concerns *how she navigates the trade*. The world includes sex work as setting—not the singular conflict.  

  3. **Agency as Narrative Function vs. Thematic Claim**  
     - **Nordic**: She cannot "write herself." Agency is an **unreliable narration**—if she claims autonomy, it’s a survival mechanism (distorting her own reality). Her actions are reactions.  
     - **Decrim**: She **writes herself through choices**. Her capacity for surprise (e.g., quitting, negotiating boundaries, career pragmatism) is narrative fact. "Choice" isn’t thematic; it’s functional, like a detective selecting leads.  

  4. **Unreliable Narration & Societal Voice**  
     - **Nordic**: The state/society is the **implied narrator**. Her first-person account is suspect if it contradicts the "rescue" arc. Free indirect discourse borrows the language of social workers, not her vernacular.  
     - **Decrim**: Her voice is **diegetic authority**. Societal judgment exists as dialogue (e.g., a client’s moralizing), but the narration trusts her focalization.  

  5. **What Is Done to Her vs. What She Does**  
     - **Nordic**: Scenes emphasize **passive verbs**—"she was purchased," "she was exploited." Violence is the narrative’s gravitational center.  
     - **Decrim**: Scenes use **active verbs**—"she screened clients," "she set rates." Violence exists but isn’t the genre-defining tension; workplace conflict is.  

  ---

  ### **Empirical Claims (Stage Directions)**  
  *These exist outside craft vocabulary. They are facts to research, not metaphors to interpret:*  
  - Trafficking prevalence under each model (e.g., Germany’s post-legalization numbers vs. Sweden’s).  
  - Efficacy of exit services (Nordic) vs. unionization impact (NZ).  
  - Police violence rates against sex workers in decrim vs. Nordic contexts.  
  - Client behavior shifts (e.g., German buyers demanding unprotected sex post-legalization).  

  ---

  ### **Residue Report**  
  #### *What Translates Cleanly:*  
  - **Focalization** = Core conflict. The debate is *literally* about whose consciousness the reader inhabits: the state’s (Nordic) or the worker’s (Decrim).  
  - **Backstory as Determinant** = Nordic’s entire premise. Decrim treats backstory as character depth, not plot engine.  
  - **Unreliable Narration** = How each model frames the worker’s self-assessment. Nordic insists she’s an unreliable narrator of her own life.  

  #### *What Distorts in Translation:**  
  - **Agency**: In policy, "agency" is a philosophical claim. In craft, it’s *mechanical*: does the character make plot-altering decisions? Policy conflates this with "freedom" or "dignity"—themes your vocabulary ignores.  
  - **Choice**: Narratively, choice is *structural* (branching paths in the plot). Policy debates treat it as *moral* (does she "really" choose?). The distortion is severe: craft cares if choices feel *character-consistent*; policy cares if they’re *authentically free*.  
  - **Harm**: Policy quantifies harm (empirical). Craft depicts it as *stakes* or *motivation*. One is stage direction; the other is tension.  

  #### *What Has No Expression in Craft Vocabulary:*  
  - **Economic Models**: How licensing (Germany) vs. decrim (NZ) affects market dynamics—craft can show poverty, but not supply/demand curves.  
  - **Legality as Deterrent**: The Nordic claim that criminalizing buyers reduces demand. Craft can portray fear of arrest, but not its societal efficacy.  

  ---

  ### **How the Residue Cuts**  
  The policy debate is **fighting about focalization while claiming to fight about law**. Nordic advocates center society’s voice (sex work as social harm); decrim centers the worker’s voice (sex work as labor). The empirical claims ("stage directions") are artillery in this narrative war—deployed to legitimize whose perspective dominates.  

  What craft reveals:  
  - **Narrative vocabulary misses nothing essential**. The debate’s core *is* craft conflict: Who controls the point of view? Whose desires move the plot?  
  - **Policy obscures its narrative assumptions**. Nordic casts sex work as a trauma plot; decrim as a workplace drama. Their empirical claims aren’t lies—but they’re *selection bias*: each model curates "evidence" supporting its genre.  

  ---

  ### **Conclusion: Philosophy as Tool, Not Flattery**  
  This won’t flatter you—it will *arm* you. The philosophy clarifies whose story you’re telling:  
  - If her entry into sex work is the **inciting incident**, Nordic’s logic shapes her arc (trauma → rescue).  
  - If sex work is the **setting**, decrim’s logic empowers her (navigating systems, not escaping them).  

  **Residue’s verdict**: Policy debates are narratives dressed as data. Your craft vocabulary exposes this—but cannot resolve it. Your novel must choose its focalizer; the philosophy merely shows what hangs on that choice.  
    
  Decide whose voice carries the free indirect discourse. The rest is stage direction.
