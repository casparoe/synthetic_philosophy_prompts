prompt: |-
  I teach a seminar on Hume's Essays, Moral and Political, and last week we spent two sessions on the economic essays of the Political Discourses. A student ended the second session with an argument that has been troubling me since, because if it is sound, it turns Hume into a champion of exactly the kind of easy-money policy he detested. I would be grateful for a careful diagnosis of it.

  First, the background from Hume himself, as the student laid it out. In the essay Of Money, Hume argues that money is not itself wealth: the real riches of a nation consist in its goods and the industry of its people, and where the quantity of money is greater, prices are proportionally higher, so that the amount of money circulating matters for the price level and, in the long run, for little else. Yet in the same essay he allows a famous exception: in the interval between the arrival of an increased quantity of gold and silver and the corresponding rise of prices, the new money does have a real effect, because people find themselves with more to spend before anything has become dearer, and this animation of spirits stimulates industry, indeed he says the interval is the only period during which an increase of money is favorable to industry. And in the essay Of the Balance of Trade, Hume argues that trade between nations automatically redistributes specie until prices across them equalize, so that money flows out of a country whose prices are high and into one whose prices are low, without any state needing to hoard or ration its coin. In the same essay he also warns that a nation which multiplies paper credit beyond the stock of metal drains its metal away and exposes itself to grave dangers.

  Now the argument itself:

  (1) For Hume, an increase in the quantity of money stimulates industry during, and only during, the interval between the arrival of new money and the rise of prices.

  (2) The interval ends when prices adjust; prices adjust when sellers and workers come to anticipate the new level; so the interval lasts exactly as long as the increase remains, in the relevant sense, unanticipated.

  (3) A government can therefore arrange a long sequence of small injections of money, each individually too small to move anyone's expectations, so that at any given moment the economy has recently received an injection whose price effects have not yet been absorbed.

  (4) If the economy has always recently received an unabsorbed injection, then it is always inside an interval of the kind described in (1), and so the stimulus Hume attributes to that interval is always operative: industry is perpetually being spurred by money that has arrived but not yet been priced in.

  (5) Therefore, on Hume's own premises, a state that manages its paper credit with sufficient delicacy can keep its population permanently in the condition of heightened industry that, on his account, an accidental windfall of treasure produces only briefly.

  (6) Since, on Hume's account, this stimulation of industry is the only real benefit money can confer, such a state has reason to pursue the policy indefinitely: continuous, calibrated inflation is a standing engine of prosperity.

  (7) But Hume regards the multiplication of paper credit as a danger that banishes the precious metals and invites ruin, and he holds public debt and projectors of easy schemes in contempt; he would have regarded (6) with horror. So either Hume's monetary theory commits him to a policy he condemned, or some step in the argument fails.

  Tell me which step you reject, and what rejecting it costs. In particular: explain why the step you reject looked irresistible in the first place, and then say what must be given up or qualified if that step is abandoned, both as a matter of Hume interpretation and as a matter of the economics itself. If you think the argument is in fact valid, and that Hume simply failed to draw the consequence of his own theory, defend that view against the most obvious objections. I will confess my own attachments: I would very much like to keep (1), since the interval claim is the heart of what makes the essay Of Money more than a dry statement of a quantity theory, and I am drawn to (2) as well. I am aware that this may leave me paying too much elsewhere, which is precisely why I want an independent adjudication.
reasoning: |-
  Okay, let me approach this Humean puzzle methodically. The student's argument presents a fascinating challenge that seems to turn Hume's own logic against his policy preferences. I need to carefully dissect each step while respecting both the textual evidence and economic coherence.

  First, I'll examine the core claims. The student's reconstruction appears textually faithful - Hume's "interval" argument in "Of Money" and his specie-flow mechanism in "Of the Balance of Trade" are accurately represented. The problematic inference begins at step (3), where the student proposes that a government could engineer perpetual stimulus through small, undetectable monetary injections.

  Hume scholars might immediately object that the student underestimates Hume's psychological acumen. When Hume discusses expectations adjusting after time, he's not describing mere calculation errors but fundamental misapprehensions of value. The "animation of spirits" stems from genuine surprise at newfound purchasing power, not algorithmic forecasting errors. This distinction matters because repeated injections would likely produce learning effects.

  Economically, the argument resembles modern rational expectations critiques of Phillips Curve trade-offs. But Hume's world differs crucially - his economic agents operate without central banking transparency or inflation targeting. Still, the cumulative effect of persistent injections would inevitably manifest somewhere, either in price adjustments or currency distrust. Hume's warning about paper credit draining specie suggests he understood this reflexive dimension.

  The deepest flaw may be in step (4)'s assumption that multiple "unabsorbed" injections can coexist without aggregation. In reality, the economy processes monetary signals holistically. Even small increments accumulate into perceptible trends, especially when deliberately engineered. Hume's description of how "projectors" undermine sound finance indicates he recognized such patterns.

  I should also consider whether Hume's "beneficial interval" requires absolute rather than relative surprise. The original scenario involves a discrete exogenous shock (like Spanish gold), whereas systematic policy makes money expansion endogenous. This changes the nature of expectations formation fundamentally.

  Ultimately, rejecting step (3) seems most defensible while preserving Hume's key insights. The cost is acknowledging that his "interval" phenomenon remains episodic - but this aligns better with his warnings against financial engineering. The psychological dimension of monetary surprise resists bureaucratization, and attempts to institutionalize it inevitably alter the expectations environment that makes the stimulus possible.
answer: |-
  Your student's argument is clever but flawed at step (3). Here's a careful diagnosis, preserving (1) and (2) while explaining why (3) fails, its interpretive and economic costs, and why Hume isn't hoist by his own petard:

  **Step Rejected: (3)**  
  *A government can arrange a long sequence of small injections... each individually too small to move anyone's expectations.*

  **Why it Looks Irresistible:**  
  The appeal lies in exploiting the "unanticipated" criterion from (2). If a single large injection is anticipated and neutralized, why not bypass expectations with imperceptible micro-doses? It mirrors modern arguments for "stealth" inflation or rational expectations critiques where only surprise shocks matter.

  **Why it Fails in Hume's Framework:**  
  1.  **Aggregation and Learning:** Small injections *accumulate*. Even if no single increment shifts expectations, the *trend* becomes perceptible over time. Hume’s agents aren’t myopic; they observe persistent increases in money supply or prices. Once the pattern is discerned (e.g., "prices always rise 1% yearly"), expectations adjust *to the trend itself*, nullifying the "unanticipated" requirement for each increment. Hume hints at this in *Of the Balance of Trade* when discussing how "a nation, whose money decreases, is actually, at that time, weaker and more miserable" – implying agents perceive ongoing changes, not just discrete shocks.
  2.  **Paper Credit ≠ Specie:** Hume's "interval" benefit pertains to specie (gold/silver). Paper credit operates under fundamentally different expectations. From its inception, paper is a *promise*, inherently dependent on confidence. Deliberate, perpetual expansion directly undermines this confidence, triggering the "grave dangers" Hume warns of: flight to specie, hoarding, collapse. A policy of perpetual small injections would signal the state's commitment to devaluation, making anticipation *inevitable*.
  3.  **The "Relevant Sense" of Unanticipated:** In Hume's original scenario, the increase is exogenous (new mines, conquest) and truly unexpected. A systematic state policy is *endogenous* and *predictable by design*, even if individual timing is masked. The "animation of spirits" relies on genuine surprise windfalls, not manufactured, predictable trickles.

  **Interpretive Cost of Rejecting (3):**  
  You must accept that Hume's "beneficial interval" is inherently *episodic and unsustainable by policy*. It arises only from genuinely exogenous, discrete shocks (like Spanish treasure fleets). This limits the state's ability to harness monetary policy for permanent stimulus, consistent with Hume’s deep skepticism of state economic engineering and his view that prosperity stems from stable institutions, not clever manipulation.

  **Economic Cost of Rejecting (3):**  
  You concede that rational agents will eventually anticipate *systematic* monetary expansion, regardless of incremental size. This aligns with modern monetary theory's emphasis on credible commitments and the limits of inflation surprises for long-term growth. Perpetual stimulus via monetary expansion is impossible because expectations adapt to the policy regime itself.

  **Why Other Steps Hold (with nuance):**  
  -   **(1)** Remains core: Hume *does* tie stimulus to the unanticipated interval.  
  -   **(2)** Holds: The interval ends with anticipation. The mechanism is expectation-based.  
  -   **(4)-(6)** Logically follow *if* (3) were true, but (3) fails.  
  -   **(7)** Hume’s horror is justified; his theory doesn’t commit him to (6).

  **Defending Hume Against the "Failed to Draw the Consequence" Charge:**  
  Hume *did* grasp the temptation. His warnings against paper credit and "projectors" show he understood attempts to simulate perpetual stimulus. He rejected it because:
  1.  **Paper's Fragility:** He saw paper credit as a confidence game. Perpetual expansion destroys confidence, causing specie flight and collapse (*Of the Balance of Trade*).
  2.  **Real Wealth Focus:** True prosperity comes from "the commodities of life, from concrete substance" and "the habits of industry" (*Of Money*). Artificial stimulus distorts this, encouraging speculation over real production. His critique of public debt (*Of Public Credit*) shows contempt for finance divorced from tangible assets.
  3.  **Political Reality:** States lack the "delicacy" for perpetual management. Expansion inevitably becomes excessive, driven by short-term pressures or corruption ("men of desperate fortunes"; *Of Public Credit*).

  **Conclusion:**  
  Your attachment to (1) and (2) is justified; they are essential to Hume's dynamic monetary insight. Step (3) is the flaw, mistaking Hume's psychology of genuine surprise for something bureaucratically manufacturable. Rejecting (3) costs only the illusion of sustainable monetary stimulus, reinforcing Hume's core themes: the limits of state economic manipulation, the primacy of real industry over financial artifice, and the dangers of undermining monetary confidence. Hume's horror at easy-money policies stems precisely from his understanding that attempts to create perpetual "intervals" destroy the conditions (surprise, confidence in money's value) that make a temporary interval beneficial. His theory is coherent and his condemnation intact.
