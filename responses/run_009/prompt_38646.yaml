prompt: |-
  hey, looking for someone who really knows formal decision theory — like a professional philosopher who teaches expected utility for a living — to audit a package of views I've ended up holding about the two-envelope paradox. please actually think it through before answering, maybe brainstorm the pairwise combinations first, and don't just open with a lecture on what the paradox is, i know the standard spiel.

  here's the package:

  (1) In the classic setup — two envelopes, one contains twice the other, you pick one at random and know nothing else — keeping and switching are equally good, and the reason is symmetry: you're randomly choosing between two fixed amounts. full stop.

  (2) The famous calculation that says switching gains you a quarter of your envelope's contents in expectation ("other envelope has 2X or X/2 with equal probability") is just a bad argument, an equivocation on what X refers to across the two branches. once you see the equivocation there is nothing of value left in that calculation.

  (3) I'm a hardline expected-utility maximizer: whenever the expected utilities of two options differ, you take the bigger one. and infinite expectations don't scare me — they're legitimate values, not a sign the framework broke.

  (4) Which is why in the St. Petersburg game I'm happy to say the value is infinite and there's no deep paradox there worth losing sleep over.

  (5) I read about a variant where the envelope amounts follow a distribution over all the powers of two going up forever, with probabilities chosen so that — this is the key part — for every single amount you could see when you open your envelope, the conditional expected value of the other envelope is strictly bigger than what you're holding. supposedly the construction is totally legit, the only catch being the distribution has no finite expectation. my verdict on that variant: you should switch, genuinely, whatever you see. that's the right answer, not a trick to be explained away.

  (6) I also hold that a decision rule which would have both parties swap — I follow its advice holding my envelope, you follow the same advice holding yours — is incoherent somewhere, because the gains have to come from somewhere. and if we'd each pay even a penny for the swap and we're allowed to swap back, we can be pumped for everything we've got. i take money pump arguments as close to decisive.

  (7) last one: i don't believe a paradox about two envelopes and a coin flip should ever need heavy-duty measure theory to dissolve. if the only way to make my advice consistent is to mutter about integrability conditions, that's ad hoc.

  and the thing i most want checked: in the classic case I claim to be indifferent between the envelopes, but honestly, if someone offered to let me peek inside my envelope before locking in keep-or-switch, I'd pay something for that peek. feels like it contradicts (1), but I can't quite tell whether it does.

  so: which of these commitments are in genuine tension, which only look like they are (including the peek thing), and what's the cheapest repair in each case? rank the tensions by severity rather than treating them all the same, and for each one be specific about which commitment has to bend and what bending it costs me elsewhere — e.g., if fixing my verdict on the variant forces me to give up infinite expectations in general, does that wreck my St. Petersburg answer? no diplomacy please: if the whole package is rotten, tell me which single revision cleans up the most.
