prompt: |-
  I'm TAing intermediate micro and next week I have to do a section on interpersonal utility comparisons, 30 minutes, whiteboard, for students who just spent weeks learning that utility is ordinal and that comparing utils across people is meaningless — and who now treat that like scripture. Don't explain the topic to me; plan how I should teach it. What has to go first — is it the distinction between "we can't measure it" and "there's no fact of the matter to measure," or something else? What one example should carry the whole thing (I'm tempted by the fixed budget split between two people, but tell me if something carries better and what the example must have and must lack)? Which misconceptions will they predictably form — I'm guessing "it's just an empirical problem, get better happiness surveys" and "money is a common scale so it's already solved" — and exactly where in the sequence I should head each one off. Should I bring in the veil-of-ignorance / extended sympathy move where you ask what you'd prefer behind ignorance of who you are, or does that muddy more than it clarifies at this level? And give me one question I can ask at the end that would let me tell apart the students who actually got the meaning/measurement distinction from the ones who just memorized the ordinalist slogan.
reasoning: |-
  Okay, the user is a TA preparing a 30-minute section on interpersonal utility comparisons for intermediate micro students. These students have just spent weeks learning that utility is ordinal and that comparing utils across people is meaningless. They treat this as gospel, so the TA needs to carefully dismantle that mindset without overwhelming them.

  First, I need to understand the core challenge. The students are stuck on "utility comparisons are impossible," but that's an oversimplification. The real issue is the distinction between measurement limitations and metaphysical impossibility. That has to be the starting point. If I don't clarify that upfront, everything else will crumble. 

  The user mentioned a possible example about splitting a fixed budget between two people. That's workable, but it needs tweaking to avoid money-as-proxy pitfalls. Maybe use a concrete non-monetary good like cake slices to prevent students from defaulting to monetary comparisons. The example must show that any split implies a judgment, and that judgment requires interpersonal comparisons whether we admit it or not. 

  Predictable misconceptions... Oh, definitely two big ones: First, "it's just an empirical problem—we need better happiness surveys." Second, "money solves this because it's a common scale." I should preempt these when introducing the example. When drawing the Edgeworth box (if using that), explicitly state that the axes are utils, not dollars, to kill the money misconception early. For the survey objection, emphasize that even with perfect data, we'd face the metaphysical question: Is my util equal to yours?

  The veil of ignorance... Hmm. Tempting, but risky for 30 minutes. It introduces social choice theory, which might derail the focus on the core distinction. Save it for the end as a "where this leads" teaser, but don't let it eat up time. 

  For the diagnostic question, something sharp that forces them to apply the meaning/measurement distinction. Maybe: "If we had perfect brain scans showing Alice gets +50 utils from cake and Bob gets +100, would that prove we should give more cake to Bob?" The memorizers will shout "no, utils aren't comparable!" The ones who get it will pause and say "It still requires assuming utils are comparable across people"—bingo. 

  Structure-wise: Start hard with the distinction (5 mins), then the cake example with Edgeworth box (15 mins), demolish misconceptions during the example, then wrap with implications for welfare economics and that diagnostic question (10 mins). Whiteboard flow: Left side for ordinalism recap, right side for the new framework, center for the box. 

  User's clearly experienced—they spotted the key pain points already. My job is to streamline their instincts into a battle-tested 30-minute siege against ordinalist dogma. No fluff, no tangents. Just the crack in the wall they need to plant the flag.
answer: |-
  Here's a battle-tested plan for your 30-minute whiteboard attack on this dogma, designed for maximum impact:

  **Core Structure & Sequence (Whiteboard Flow):**

  1.  **Smash the Oversimplification First (3 min):**
      *   Left Column: Write "The Dogma: Interpersonal Utility Comparisons (IUC) are MEANINGLESS."
      *   Right Column: Draw a line down the middle. Top Left: "Measurement Problem". Top Right: "Meaning Problem".
      *   **VERBAL:** "You're right, we *can't* *measure* utils across people like inches or pounds. But is that *only* because utils are slippery? Or is there a deeper claim – that even *if* we could measure, comparing 'Alice's util' to 'Bob's util' is like comparing 'Alice's redness' to 'Bob's blueness' – fundamentally nonsensical? The dogma often conflates these. We *must* separate them."
      *   *Why first?* Directly addresses their core belief and prevents them from dismissing everything as "just measurement."

  2.  **The Indispensable Example: The Cake Split (15 min):**
      *   **Choose:** **Dividing a fixed resource (e.g., 1 cake) between Alice and Bob.** *Why it works:* Utterly simple, visceral, forces a distributional choice, avoids money's baggage.
      *   **Draw:** A simple Edgeworth Box (even if they haven't seen it much). Label axes: Horizontal = Slices for Alice, Vertical = Slices for Bob. Draw origin for Alice (bottom-left), origin for Bob (top-right). Total cake = fixed length on each axis.
      *   **The Setup:** "We *must* split this cake. Any point in this box is a split. Alice has preferences (utility U_A), Bob has preferences (U_B). We know these are ordinal *for each individually*."
      *   **The Crucial Question:** "How do we decide *which* split is 'better' or 'more desirable' *socially*? Efficiency (Pareto) isn't enough. Point to the 50/50 split. Is this 'fair'? Why 50/50? Why not 60/40? 90/10?"
      *   **Force the IUC:** "To justify *any* split besides 'give all to one person' (which is Pareto inefficient unless the other gets negative utility), we *must* make a judgment comparing the *importance* or *value* of Alice's satisfaction to Bob's satisfaction. Giving Alice the 51st slice implies we judge that slice gives *more value to Alice* than giving it to Bob would give *to Bob*. That's an Interpersonal Utility Comparison!"
      *   **Whiteboard:** Draw arrows from different splits. Label the implicit judgments: "At 60/40: Implicitly judging U_B loss < U_A gain from next slice." Circle the contract curve. "Pareto efficiency tells us *where* to be on this line, but IUC tells us *which point* on the line is 'best'."
      *   *What it must lack:* Avoid money, avoid cardinal utility assumptions initially. *What it must have:* Forces an unavoidable distributional choice highlighting the insufficiency of Pareto.

  3.  **Predictable Misconceptions & Preemptive Strikes:**
      *   **"It's just empirical! Better surveys!"**
          *   *When to strike:* During the Cake Split, when justifying a split.
          *   *How:* "Suppose we had perfect 'happiness meters'. Alice's meter reads '50 utils' from her slice, Bob's reads '30 utils' from his. Does '50 > 30' tell us Alice values her slice *more than Bob values his*? Or just that Alice's meter uses a different scale? What does '50' *mean* compared to '30'? The measurement doesn't solve the *meaning* problem – is Alice's 'util unit' comparable to Bob's?"
      *   **"Money solves it! We can see willingness-to-pay!"**
          *   *When to strike:* If someone mentions money, or when discussing "value".
          *   *How:* "Money measures intensity *within* an individual's preferences (ordinal scale with cardinal properties). But $1 to a starving student vs. $1 to a billionaire? The *marginal utility* of money differs wildly. Using money as a common scale *assumes* we value a dollar of utility (MU) the same for both – which *is* an IUC! It doesn't escape the problem; it hides it behind an assumption."
          *   *Whiteboard:* Draw two downward-sloping MU_of_income curves, one steep (poor), one flat (rich). "Same $ transfer means very different ΔU. Using $ as a common scale implicitly weights ΔU_poor > ΔU_rich."

  4.  **Veil of Ignorance (VoI) - Handle with Care (5 min):**
      *   *Should you bring it in?* **Briefly, at the end, as a "way forward," not an explanation.**
      *   *Why:* It *does* provide a potential normative foundation for making IUC-like judgments without directly comparing utils. It shifts the question to preferences *over social positions*.
      *   *How not to muddy:* "One way economists and philosophers *try* to make normative judgments without directly comparing Alice's utils to Bob's is the 'Veil of Ignorance'. Imagine you don't know if you'll be Alice or Bob. What cake-splitting rule would you choose? You'd probably choose 50/50 to minimize risk, or maybe some split favoring the worse-off if you care about inequality. **Crucially:** This avoids saying 'Alice's util = X, Bob's util = Y, compare X and Y'. Instead, it bases the judgment on *one individual's* preferences over *lotteries* involving different identities. It's a clever workaround, but notice you're *still* making a judgment about the relative *importance* of being in Alice's shoes vs. Bob's shoes – it transforms, rather than eliminates, the comparison problem."
      *   *Keep it lean:* Don't get bogged down in Rawls/Harsanyi. Frame it as a *possible normative tool* acknowledging the problem exists.

  5.  **Wrap-up & Diagnostic Question (7 min):**
      *   **Reiterate Key Distinction:** "Remember: The measurement problem (we can't measure utils) is real. The deeper *meaning* problem (is comparing utils across minds even coherent?) is philosophical. But **normative economics requires *some* basis for distributional judgments.** Pareto isn't enough. We *must* make IUCs implicitly or explicitly (like in the cake split), or use devices like VoI that transform the problem."
      *   **Implications:** "This is why welfare economics often relies on *value judgments* (e.g., utilitarianism, Rawlsianism) or focuses solely on efficiency (avoiding distribution). There's no purely 'scientific' escape hatch."
      *   **The Diagnostic Question:** **"Imagine we discover a perfect, objective 'happiness meter' that gives cardinal utility readings for any person. Alice eats a slice of cake: +50 'Utils'. Bob eats the same slice: +30 'Utils'. Does this discovery *resolve* the problem of deciding whether Alice or Bob should get the next slice of cake in a fair society? Why or why not?"**
          *   *What it tests:* Memorizers will say "No, utils are ordinal, comparisons meaningless!" They miss the point.
          *   *Correct Insight:* "No, it doesn't *resolve* it. It solves the *measurement* problem. But it still leaves the *meaning* problem: Does '50 Utils for Alice' represent the *same intensity of experience or moral value* as '30 Utils for Bob'? We still need a philosophical justification for why we should value total utils (Alice + Bob) vs. min utils (Rawls) vs. something else. The numbers give us data, but not the normative rule for weighting them across individuals."

  **Key Whiteboard Elements Throughout:**
  *   **Left/Right Columns:** Dogma vs. Measurement/Meaning Distinction.
  *   **Center: Cake Split Edgeworth Box:** Visual anchor. Show splits, arrows for implied comparisons, contract curve.
  *   **MU of Money Curves:** When debunking the money misconception.
  *   **Simple VoI Diagram (Optional):** Stick figures behind a veil, two cake slices labeled "Alice", "Bob", question mark over person choosing.

  **Tone:**
  Be respectful of their learned dogma ("You're absolutely right that we can't measure...") but intellectually rigorous in exposing its limitations for normative questions. Frame it as "leveling up" their understanding of the complexities of welfare economics, not tearing down what they know. Use "we" language ("Why *do we* think 50/50 is fair?"). **Confusion during the cake example is GOOD** – it means they're grappling with the unavoidable dilemma. Lean into that discomfort. Good luck! You've got this.
