answer: |-
  Your diagnosis captures a crucial aspect of the *svataḥ-parataḥ* debate brilliantly—it's **largely correct** that the camps often talk past each other by emphasising different *stages* or *aspects* of cognition. However, beneath this verbal divergence lies a **genuine, substantive disagreement** about the nature of justification, epistemic responsibility, and the metaphysics of knowledge. Let's unpack this, keeping your insightful framework in mind:

  ### 1. **Your Diagnosis: Genesis vs. Epistemic Result**  
     - **Svataḥ Camp (Mīmāṃsā, Nyāya):** Focuses on the *genesis* of cognition. When a cognition arises (e.g., seeing water), it carries intrinsic validity (*svataḥ prāmāṇya*). Validity is the *default state*—you don’t need a second cognition to "activate" its truth. Doubt or invalidity (*aprāmāṇya*) arises only when extrinsic factors *defeat* it (e.g., discovering it’s a mirage).  
     - **Parataḥ Camp (Buddhists like Dharmakīrti):** Focuses on the *epistemic result*—whether the cognition *actually corresponds to reality* and is *reliably actionable*. A cognition only becomes *pramāṇa* (valid knowledge) *after* it’s confirmed by extrinsic means: subsequent cognition (e.g., walking closer to verify the water) or successful purposive action (*arthakriyā*, e.g., drinking the water and quenching thirst).  
     - **The Talking-Past Moment:**  
       - Nyāya says, *"Why would you doubt a cognition unless given reason to?"* (addressing psychological default trust).  
       - Buddhists retort, *"How can you claim it's knowledge before checking if it works?"* (addressing epistemic grounding).  

  ### 2. **The Substantive Core: Accessibility of Justification**  
  The real clash is about **epistemic justification and its accessibility to the knower**:  
     - **Svataḥ View:** Justification is *internal to the cognition itself*. You don’t need *further conscious validation* for a cognition to count as knowledge—it’s self-illuminating (*svaprakāśa*). This leans toward *externalism*: a cognition is valid if produced by reliable causes (e.g., functional senses), even if you can’t introspectively "prove" it.  
     - **Parataḥ View:** Justification requires *extrinsic, accessible evidence*. A cognition is merely *provisional* until corroborated. This is *internalist*: the knower must have cognitive access to reasons for belief (via further cognition or successful action). Without this, you risk dogmatism or gullibility.  

  ### 3. **The Nyāya Hybrid: A Wrinkle, Not a Collapse**  
  Nyāya’s "intrinsic validity, extrinsic invalidity" (*svataḥ prāmāṇyam, parataḥ aprāmāṇyam*) isn’t a collapse into the Buddhist view but a **pragmatic refinement**:  
     - **Validity is "free" but defeasible:** Cognitions are *presumptively* valid, saving us from infinite regress (validating every perception ad infinitum). But we *actively seek* causes of error (e.g., checking for fog when doubting distant smoke).  
     - **Buddhist Counter:** This still dodges the core issue—presuming validity doesn’t *make* it knowledge. A hallucination might feel "intrinsically valid" until disproven!  

  ### 4. **Why Neither Side Switched: Bedrock Intuitions**  
  The impasse stems from **irreconcilable starting intuitions**:  
     - **Svataḥ Intuition:** *Default trust in cognition.* If we didn’t accept cognitions as prima facie valid, daily life would halt (imagine doubting every step or sensory input).  
     - **Parataḥ Intuition:** *Default scepticism.* Unverified cognitions lead to error (e.g., mistaking rope for snake), so knowledge requires active warrant.  
  These are **pre-theoretical commitments**—akin to foundationalism vs. coherentism in Western epistemology—neither provable nor falsifiable.  

  ### 5. **Could Anything Have Ended the Debate?**  
  Unlikely. But a few moves might have clarified the stalemate:  
     - **Distinguishing Psychological from Epistemic Validity:**  
       - Svataḥ describes *how we treat* cognitions psychologically (trust first, doubt later).  
       - Parataḥ defines *what constitutes* knowledge epistemically (fidelity to reality).  
       Admitting this distinction might have cooled rhetoric but not resolved the core clash.  
     - **The "Killer Case" That Fails:**  
       - **Illusion Argument (Buddhist):** A mirage seems valid until disproven—so validity *can’t* be intrinsic.  
         *Svataḥ reply:* Invalidity is detected extrinsically, but the *original* cognition wasn’t "knowledge"—it was *always* defective, just not yet *known* to be.  
       - **Regress Argument (Svataḥ):** If every cognition needs validation, you get infinite regress.  
         *Buddhist reply:* *Arthakriyā* (successful action) halts regress—it’s intrinsically self-confirming.  
     - **Reformulation:** Framing validity as **contextual** or **gradient** (some cognitions are "valid enough" for practical purposes without absolute certainty) might have helped—but absolutism was baked into both frameworks.  

  ### Conclusion: Bedrock Intuitions and Verbal Smokescreens  
  Your diagnosis is spot-on: much of the debate *was* verbal, with each side weaponising edge cases (illusions! Vedic testimony!) against the other. Yet the **substantive rift**—over whether justification requires *accessible grounds*—remains philosophically profound. No argument could bridge it because it reflects two modes of engaging with the world: one trusting cognition until broken, the other distrusting it until proven. It’s less a solvable puzzle than a **clash of epistemic temperaments**, entrenched in metaphysics (Nyāya’s realism vs. Buddhism’s phenomenalism) and soteriology (Mīmāṃsā’s ritual infallibility vs. Buddhism’s path to liberation).  

  In the end, the debate persisted not for lack of cleverness, but because—much like realism vs. anti-realism today—it asks a question with no neutral ground: *Must knowledge earn its keep, or is it innocent until proven guilty?* A jolly interesting mess, but not one with a tidy resolution.
