prompt: |-
  The svataḥ vs parataḥ debate on the validity of cognitions — Nyāya (with validity intrinsic but invalidity needing external detection) and the Mīmāṃsakas holding cognitions are self-validating until shown defective, against Dharmakīrti and the Buddhist epistemologists saying a cognition only earns pramāṇa status once confirmed by another cognition or by its object's behaviour (arthakriyā and all that) — went on for something like a millenium without anyone switching sides. My working theory is that it's partly verbal: the svataḥ camp is talking about the genesis of a cognition (do you need a second cognition in place before the first counts as knowledge?) while the parataḥ camp is talking about its epistemic result (has it actually latched onto its object?), so the standard moves — Nyāya's line that we only ever bother to ascertain causes of error, never causes of validity, so validity comes free, against the Buddhist charge that self-validation is either question-begging or unknowable — talk past each other. Is that diagnosis right, or is there a genuine substantive disagreement buried in there, maybe about whether justification has to be accessible to the knower? And note the fun wrinkle: Nyāya itself goes hybrid (validity intrinsic, invalidity extrinsic), and each side spent centuries accusing the other's position of collapsing into its own. Given your diagnosis, what, if anything, could have ended it — a distinction, a reformulation, a killer case — or is it just bedrock intuitions about default trust in our own cognitions that neither side could argue for? Please answer in British English.
