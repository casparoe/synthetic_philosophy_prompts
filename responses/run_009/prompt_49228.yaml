  - Step 7: Falsifiable? Yes, and the study provides evidence against the strong version of the theory. Judgment: positive.
  - Step 8: This is a test of a famous hypothesis (by Cosmides and Tooby). Previous studies found strong effects, but replications have been mixed. This study is preregistered and large, so it's high quality. Judgment: positive.
  - Step 9: The debate about cheater detection is ongoing. The paper might discuss why previous studies found stronger effects (e.g., methodological differences).

  Bin: 2 (Interesting hypothesis with caveats) or even 1? But note the weak effect. This is inconvenient because the study is well-designed but doesn't support the theory strongly. However, it is credible science because it was preregistered and conducted rigorously. We might cover it as credible science that revises a previous claim.

