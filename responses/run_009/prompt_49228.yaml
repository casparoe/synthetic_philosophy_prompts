prompt: |-
  I'm a science and ideas correspondent for a general-interest magazine, and a growing share of my beat is press releases about evolutionary psychology: studies claiming that some familiar behavior — women's preference for men with resources, disgust at unfamiliar foods during pregnancy, the way stepchildren are treated, mood dipping in winter — is a Stone Age adaptation, often with a brain-imaging figure attached. My editors want me to move fast on these, my readers love them, and I have maybe an hour with a paper before I decide how to frame it. What I need is a decision procedure I can actually run in that hour for sorting claims into roughly three bins: treat as credible science, cover as an interesting hypothesis with heavy caveats, or decline to cover. The procedure should be grounded in what philosophers of biology and evolutionary biologists actually know about the failure modes of adaptationist reasoning — the worry that a story about the adaptive function of a trait can be told for almost anything, the distinction between a trait's current usefulness and its evolutionary history, the problem that we can't run selection experiments on the Pleistocene, the question of whether cross-cultural data and comparative primate data can stand in for a fossil record, and the way plausible-sounding stories can survive the failure of their original evidence by generating a near-identical variant. It should also tell me what would count as good evidence in this field when it exists — convergent methods, quantitative predictions rather than retrodictions, evidence against nearby alternatives — and not just list reasons for skepticism.

  I want you to be honest about which steps of the procedure are real tests and which are judgment calls dressed up as procedure: for instance, whether a claim is "in principle unfalsifiable" is often itself a contested judgment, and I don't want the procedure to smuggle in a verdict under the guise of a checkbox. Mark the points where a reasonable journalist could run the same procedure and land somewhere else, and say what to do at those points. Then run the procedure on three hypothetical items from my queue: a study claiming that food aversions in the first trimester of pregnancy are an adaptation that protected embryos from plant toxins, with supportive cross-cultural survey data; a claim that a well-documented sex difference in some mate preference is explained by differential parental investment, resting on a comparison of questionnaires from thirty-seven countries; and a preregistered, cross-cultural study testing a prediction from an evolutionary account of cooperation — that people will be more sensitive to being cheated in exchanges than to logically identical violations of non-social rules — which reports a much weaker effect than the theory's proponents originally claimed. At least one of the three should come out in a bin I'll find inconvenient, and you should say which and why. Finally, throughout the answer, keep separate what is settled among people who actually work on this — the existence of these methodological worries, the broad consensus points about heritability and selection — from what is genuinely contested, such as how damaging the objections are to evolutionary psychology as a research program and whether its best-known results have survived critical scrutiny; please don't present one side of that fight as the consensus view.
reasoning: |-
  We are creating a decision procedure for evaluating evolutionary psychology claims. The procedure should have three bins:
  1. Treat as credible science.
  2. Cover as an interesting hypothesis with heavy caveats.
  3. Decline to cover.

  The procedure must be grounded in the known failure modes of adaptationist reasoning and what counts as good evidence.

  Key issues in adaptationist reasoning (based on philosophy of biology and evolutionary biology):
  - The "just-so story" problem: plausible adaptive stories can be told for almost any trait, but they may not be true.
  - Current usefulness vs. evolutionary history: a trait can be useful now without having evolved for that purpose (exaptation).
  - We cannot run selection experiments on the Pleistocene, so we rely on indirect evidence.
  - Cross-cultural and comparative primate data can be used as proxies, but they have limitations.
  - Hypotheses can survive the failure of original evidence by generating similar variants (the "adaptationist program" resilience).

  What counts as good evidence?
  - Convergent methods: multiple independent lines of evidence pointing to the same conclusion.
  - Quantitative predictions (made before data collection) rather than post hoc retrodictions.
  - Evidence that rules out alternative explanations (e.g., byproduct, cultural transmission, drift).
  - Preregistration to avoid researcher degrees of freedom.
  - Effect sizes that are substantial and robust.

  The procedure must be runnable in about an hour per paper. We will break it down into steps, some of which are objective and some of which require judgment. We will mark the judgment calls.

  Decision Procedure:

  Step 1: Check for Preregistration and Pre-specified Predictions
  - Look for whether the study was preregistered and whether the hypothesis and analysis plan were specified in advance.
  - Why: Preregistration reduces the risk of p-hacking and HARKing (hypothesizing after the results are known).
  - Judgment call? Partially: Preregistration is objective, but sometimes preregistrations can be vague or changed. Also, a lack of preregistration doesn't automatically invalidate a study but raises the bar for evidence.

  Step 2: Evaluate the Evidence for Adaptation vs. Alternatives
  - Check if the paper considers and tests alternative explanations (e.g., the trait is a byproduct of another adaptation, cultural transmission, or drift).
  - Look for evidence that the trait is an adaptation by design (e.g., complexity, specificity, universality).
  - Why: A key failure mode is ignoring non-adaptive explanations.
  - Judgment call? Yes: Assessing the adequacy of alternative explanations and the strength of evidence for adaptation is inherently judgmental.

  Step 3: Cross-Cultural and Comparative Data
  - If the study uses cross-cultural data, assess whether the samples are diverse (including small-scale societies) and whether the effect is consistent across cultures. Inconsistencies might suggest cultural influences.
  - If comparative primate data is used, check if the trait is shared with our closest relatives and if it varies in a way that correlates with relevant ecological factors.
  - Why: Universality across cultures and presence in related species can support an evolutionary origin, but absence doesn't necessarily refute it (due to local adaptations or cultural override).
  - Judgment call? Yes: Deciding whether the cultural coverage is adequate and whether the pattern is truly universal is subjective.

  Step 4: Quantitative Predictions and Effect Size
  - Check if the study makes quantitative predictions (e.g., about the magnitude of an effect) and whether the observed effect size is substantial and matches the prediction.
  - Be wary of small effect sizes (even if statistically significant) because they might not be practically important and could be driven by confounds.
  - Why: Strong predictions that are confirmed are more compelling than post hoc explanations of observed patterns. Large effect sizes are harder to explain away as noise.
  - Judgment call? Partially: Effect size is quantitative, but what counts as "substantial" is context-dependent.

  Step 5: Convergent Evidence
  - Look for multiple, independent lines of evidence (e.g., behavioral, physiological, genetic, fossil, developmental) that converge on the same conclusion.
  - Why: Single methods can be misleading; convergence increases confidence.
  - Judgment call? Yes: Assessing independence and convergence requires judgment.

  Step 6: Plausibility of the Selection Scenario
  - Consider whether the proposed selective pressure is plausible given our knowledge of the past (e.g., during the Pleistocene). Is there evidence that the pressure existed and was strong enough?
  - Why: Without a plausible selection scenario, the adaptation claim is weak.
  - Judgment call? Yes: We cannot directly observe past selection, so this is inherently speculative.

  Step 7: Falsifiability and Testability
  - Check if the hypothesis is framed in a way that allows for disconfirmation. Are there clear conditions under which the hypothesis would be rejected?
  - Why: Unfalsifiable hypotheses are not scientific.
  - Judgment call? Yes: While the principle is clear, applying it to a specific claim can be contentious (e.g., auxiliary assumptions can always be adjusted).

  Step 8: Replication and Independent Support
  - If the study is a replication or extension of prior work, check if the original finding was robust and if the current study confirms it. If it's a new finding, check if there is any independent support (e.g., from other labs, using different methods).
  - Why: Replication is key to confidence in a result.
  - Judgment call? Partially: The existence of replications is objective, but the quality and independence of replications may be debated.

  Step 9: Controversy and Critiques in the Literature
  - Quickly scan the paper for references to known critiques of the hypothesis and whether the authors address them. Also, check if there are published critiques of similar claims.
  - Why: Some evolutionary psychology claims are controversial and have been challenged on methodological or theoretical grounds.
  - Judgment call? Yes: The extent to which critiques are relevant and adequately addressed is subjective.

  Now, we map the results of these steps to the bins:

  - **Bin 1 (Credible)**: The paper passes most of the objective checks (like preregistration) and the judgment calls lean strongly in its favor. There is strong evidence for adaptation, consideration of alternatives, and the effect is robust and substantial. The hypothesis is well-supported by multiple lines of evidence.

  - **Bin 2 (Hypothesis with caveats)**: The paper has some strengths but also significant weaknesses. For example, it might have preregistration and cross-cultural data but a small effect size and only weak evidence against alternatives. Or it might lack preregistration but have strong convergent evidence. The caveats should be highlighted.

  - **Bin 3 (Decline)**: The paper has major red flags: no preregistration, no consideration of alternatives, weak or inconsistent data, very small effect size, or the hypothesis is untestable. Also, if the claim is a "zombie" (a hypothesis that has been debunked but keeps coming back in slightly different form), it should be declined.

  Now, we run the procedure on three hypothetical studies:

  ### Study 1: Food aversions in the first trimester as an adaptation to protect embryos from plant toxins, with cross-cultural survey data.

  - Step 1: Not preregistered (assumed, since not mentioned). Judgment: negative.
  - Step 2: The paper argues that the timing (first trimester) and the specific aversions (to potentially teratogenic plants) point to adaptation. But does it consider alternatives? For example, could it be a byproduct of general nausea? The paper might not test this. Judgment: weak.
  - Step 3: Cross-cultural data from multiple societies, showing similar patterns. This is a strength. But are the societies diverse? If they are all industrialized, that's a problem. Assume they include some small-scale societies. Judgment: positive.
  - Step 4: The effect size: how strong is the aversion? If it's a large effect, that's good. But without preregistration, the effect size might be inflated. Judgment: neutral.
  - Step 5: Only one method (survey). No convergent evidence (e.g., physiological measures, toxin levels). Judgment: negative.
  - Step 6: Plausible? Yes, plant toxins can harm embryos. But is there evidence that this was a major selective pressure? Not provided. Judgment: neutral.
  - Step 7: Falsifiable? Yes, if aversions were not timed to the first trimester or if they targeted non-toxic foods. The data support it. Judgment: positive.
  - Step 8: Is this a replication? Probably not a direct one. Independent support? Some prior studies on pregnancy aversions, but mixed. Judgment: neutral.
  - Step 9: This hypothesis has been around and has critics who argue it's a byproduct. Does the paper address this? Assume it does briefly but not thoroughly.

  Bin: 2 (Interesting hypothesis with caveats). Why? The cross-cultural consistency is a plus, but the lack of preregistration, no test of alternatives, and no convergent evidence mean we can't be confident. Also, the effect might be real but the adaptive story is just one interpretation.

  ### Study 2: Sex difference in mate preference explained by differential parental investment, with questionnaires from 37 countries.

  - Step 1: Not preregistered (common in such studies). Judgment: negative.
  - Step 2: The paper uses the theory of parental investment (Trivers) to predict that the sex with higher investment (females) will be choosier. But does it consider alternatives? For example, cultural explanations (gender roles)? The paper might control for gender equality indices. If it does, that's good. Assume it does. Judgment: mixed.
  - Step 3: 37 countries, including diverse cultures. The effect (sex difference) is found in all, but the size varies. This supports universality. Judgment: positive.
  - Step 4: Effect size: the sex difference is consistent but often small to moderate. Also, the variation across cultures might be as interesting as the average. Judgment: neutral.
  - Step 5: Only self-report questionnaires. No behavioral or physiological measures. Judgment: negative.
  - Step 6: Parental investment theory is well-established in evolutionary biology for many species. Plausible. Judgment: positive.
  - Step 7: Falsifiable: if no sex difference were found, the theory would be challenged. But the theory is flexible enough to account for variation (e.g., via moderators). Judgment: positive.
  - Step 8: This is a classic finding (Buss, 1989) that has been replicated. So, independent support exists. Judgment: positive.
  - Step 9: This is one of the most criticized areas in evolutionary psychology. Critics argue that the sex differences are overemphasized and can be explained by socialization. The paper might address this by showing the correlation with gender equality is weak. But the debate is ongoing.

  Bin: 2 (Interesting hypothesis with caveats). Why? The cross-cultural data and theoretical grounding are strengths, but the reliance on self-report and the ongoing controversy mean we must present it with caveats. Also, the effect size variation across cultures suggests cultural influences.

  ### Study 3: Preregistered, cross-cultural study on cooperation, testing the prediction that people are more sensitive to being cheated in exchanges than to logically identical non-social rule violations. The study reports a much weaker effect than originally claimed.

  - Step 1: Preregistered. This is a strong point. Judgment: positive.
  - Step 2: The paper tests a specific prediction from evolutionary theory (about cheater detection). It also considers alternatives: for example, that the difference might be due to the social context alone (not evolutionary). The weak effect might suggest the alternative is stronger. Judgment: positive (for testing, but the result is not as predicted).
  - Step 3: Cross-cultural: if it includes diverse cultures and the effect is consistent (even if weak), that's good. But the effect is weak. Judgment: neutral.
  - Step 4: The effect is much weaker than originally claimed. The paper might argue that the effect is still present (statistically significant) but small. This is a negative for the theory. Judgment: negative for the strength of the claim.
  - Step 5: Convergent evidence? The paper might be a direct test of a well-known paradigm (e.g., Wason selection task). If it's the only method, that's a limitation. Judgment: neutral.
