answer: |-
  Below is a decision procedure designed for your specific constraints, grounded in established critiques of adaptationist reasoning from evolutionary biology and philosophy of biology (e.g., Gould and Lewontin's "spandrels" paper, Williams' criteria for adaptation, and contemporary debates). It incorporates both objective checks and acknowledged judgment calls. I'll first outline the procedure, then apply it to your three hypothetical studies. Crucially, I'll flag:  
  - **Objective tests** (🔍): Based on observable features of the paper.  
  - **Judgment calls** (⚖️): Where reasonable experts might disagree, and you must exercise skepticism.  
  - **Consensus vs. contested**: Separating settled principles from ongoing disputes.  

  ---

  ### **Decision Procedure: Evaluating Evolutionary Psychology Claims**  
  **Time budget:** 45-60 minutes per paper (focus on Abstract, Intro, Methods, Results, and Critiques/Discussion).  

  #### **Step 1: Check for Core Methodological Rigor (🔍)**  
     - **Preregistration:** Was the hypothesis, method, and analysis plan preregistered? *Objective test.*  
     - **Falsifiability:** Does the paper specify conditions under which the hypothesis would be rejected? (e.g., "If effect size < X," "If not found in >Y cultures"). *Judgment call (⚖️)*: What counts as "falsifiable" can be contested (e.g., auxiliary assumptions might shield the core claim).  
     - **Alternatives tested:** Does the paper directly compare the adaptationist hypothesis against at least one non-adaptationist alternative (e.g., byproduct, drift, cultural transmission)? *Judgment call (⚖️)*: Authors might dismiss alternatives superficially.  
     - **Bin guidance:**  
       - ✅ **Credible science:** Preregistered + falsifiable + tests alternatives.  
       - ⚠️ **Hypothesis with caveats:** Missing 1-2 elements, but alternatives acknowledged.  
       - 🚫 **Decline:** Unfalsifiable (⚖️), no alternatives considered, or fatal flaws (e.g., p-hacking).  

  #### **Step 2: Assess Evidence Quality (Mix 🔍/⚖️)**  
     - **Cross-cultural/comparative data:**  
       - 🔍: Does the study include minimally WEIRD (Western, Educated, Industrialized, Rich, Democratic) populations? Objective if sampling is described.  
       - ⚖️: Can this data approximate a "fossil record"? Consensus: Cross-cultural consistency *suggests* deeper origins but doesn't prove adaptation (could reflect universal byproducts or cultural diffusion). Contested: Whether consistency alone is strong evidence.  
     - **Convergent methods:** Are multiple lines of evidence used (e.g., behavioral, physiological, genetic, developmental)? 🔍: Objective if methods are listed. Consensus: Convergence strengthens claims; single-method studies are weak.  
     - **Prediction vs. retrodiction:** Was the hypothesis formulated *before* data collection (predictive), or fitted afterward (retrodictive)? ⚖️: Judgment call based on intro/method wording. Consensus: Predictions are stronger; retrodictions risk "just-so" storytelling.  
     - **Effect size & robustness:** 🔍: Is the effect statistically and practically significant (e.g., Cohen's *d* > 0.5)? Small effects (<0.2) are suspect.  
     - **Bin guidance:**  
       - ✅ **Credible:** Large effect size + cross-cultural + convergent methods + predictive.  
       - ⚠️ **Caveats:** Moderate effect size, single method, or overreliance on WEIRD samples.  
       - 🚫 **Decline:** Small effect size (<0.2), purely retrodictive, or exclusively WEIRD samples.  

  #### **Step 3: Plausibility & Failure Modes (⚖️)**  
     - **Selectionist plausibility:** Is the proposed selective pressure (e.g., Pleistocene ecology) supported by archaeology, ethnography, or primatology? ⚖️: Highly subjective. Consensus: We can't rerun the Pleistocene, but implausible scenarios (e.g., "stone-age stockbrokers") are red flags.  
     - **Current utility ≠ evolutionary origin:** Does the paper conflate present-day function with evolutionary cause? 🔍: Objective if language is teleological (e.g., "evolved to"). Consensus: This is a cardinal sin.  
     - **"Zombie" hypothesis:** Has this claim (or a variant) been debunked before but resurfaced? ⚖️: Judgment call (search keywords in critiques).  
     - **Bin guidance:**  
       - ✅ **Credible:** Explicitly separates current utility from origin, plausible selective scenario.  
       - ⚠️ **Caveats:** Overstates adaptive intent, plausible-but-unverified selection.  
       - 🚫 **Decline:** Teleological language, "zombie" hypothesis, or implausible selection (e.g., "fear of ghosts was adaptive").  

  #### **Step 4: Resolve Ambiguities & Bin**  
     - **Tiebreakers for judgment calls (⚖️):**  
       - If uncertain at any step, default to "hypothesis with caveats."  
       - When plausibility/falsifiability is contested, prioritize Steps 1–2 (method rigor).  
     - **Final binning:**  
       - ✅ **Credible science:** Passes Steps 1–3 with minimal judgment calls against.  
       - ⚠️ **Interesting hypothesis with heavy caveats:** Mixed results, but not fatally flawed. Highlight alternatives and limits.  
       - 🚫 **Decline:** Fails Step 1 or has fatal flaws (e.g., unfalsifiable, small effects, ignores alternatives).  

  ---

  ### **Consensus vs. Contested in Evolutionary Psychology**  
  - **Settled consensus among experts:**  
    - Adaptation requires evidence beyond current utility (Williams 1966).  
    - Heritability ≠ adaptation; traits can be byproducts (spandrels), drift, or cultural.  
    - Cross-cultural data are necessary but insufficient for adaptation claims.  
    - Small effect sizes (<0.2) are often noise or confounds.  
  - **Genuinely contested:**  
    - Whether evolutionary psychology's methods can *ever* reliably infer past selection (critics: no; proponents: yes with rigor).  
    - How damaging "just-so" storytelling is to the field (some argue it's growing more rigorous; others say it's endemic).  
    - Survival of well-known results (e.g., some mate preferences hold up; cheater-detection modules are disputed).  

  ---

  ### **Application to Hypothetical Studies**  
  I'll run the procedure on your three examples, with one assigned to an "inconvenient" bin (⚠️).  

  #### **Study 1: Food aversions in pregnancy as adaptation against toxins**  
  - **Step 1 (Rigor):**  
    - 🔍 Not preregistered (assumed).  
    - ⚖️ Falsifiable? Yes (e.g., "If aversions target non-toxic foods").  
    - ⚖️ Alternatives tested? Paper cites cross-cultural surveys but doesn't test if aversions are byproducts of general nausea.  
    - *Verdict: ⚠️ Caveats (no prereg, alternatives not tested).*  
  - **Step 2 (Evidence):**  
    - 🔍 Cross-cultural: Includes diverse societies (strength).  
    - 🔍 Convergent methods? Surveys only (no toxin levels or embryological data).  
    - ⚖️ Predictive? Likely retrodictive (fitted to existing data).  
    - 🔍 Effect size: Assume large (e.g., strong aversion to bitter plants).  
    - *Verdict: ⚠️ Caveats (single method, retrodictive).*  
  - **Step 3 (Plausibility):**  
    - ⚖️ Plausible selection? Yes (plant toxins harm embryos; ethnobotany supports).  
    - 🔍 Utility ≠ origin? Paper implies "evolved to protect" (problematic).  
    - ⚖️ Zombie? No (hypothesis has critics but isn't debunked).  
    - *Verdict: ⚠️ Caveats (teleological language).*  
  - **Overall Bin: ⚠️ Cover as interesting hypothesis with heavy caveats.**  
    - **Why:** Cross-cultural consistency makes it newsworthy, but methods are weak. Caveats: "This may be a byproduct of pregnancy nausea," "Not tested against toxins directly."  

  #### **Study 2: Sex difference in mate preference via parental investment**  
  - **Step 1 (Rigor):**  
    - 🔍 Not preregistered.  
    - ⚖️ Falsifiable? Yes (e.g., "If high-investment sex doesn't show preference").  
    - ⚖️ Alternatives tested? Questionnaires compare cultures but don't test socialization (e.g., controlling for gender equality).  
    - *Verdict: ⚠️ Caveats (no prereg, alternatives ignored).*  
  - **Step 2 (Evidence):**  
    - 🔍 Cross-cultural: 37 countries, including non-WEIRD (strength).  
    - 🔍 Convergent methods? Questionnaires only (no behavioral data).  
    - ⚖️ Predictive? Retrodictive (Trivers' 1972 theory fitted to new data).  
    - 🔍 Effect size: Small to moderate (typical in such studies; e.g., *d* = 0.3–0.5).  
    - *Verdict: ⚠️ Caveats (single method, small effect).*  
  - **Step 3 (Plausibility):**  
    - ⚖️ Plausible selection? Consensus: Parental investment theory is well-supported in biology.  
    - 🔍 Utility ≠ origin? Paper says "shaped by evolution" (acceptable if not teleological).  
    - ⚖️ Zombie? Controversial: Sex differences replicate cross-culturally, but critics argue they reflect patriarchy, not evolution (e.g., Eagly & Wood 1999).  
    - *Verdict: ⚠️ Caveats (ongoing controversy).*  
  - **Overall Bin: ⚠️ Cover as interesting hypothesis with heavy caveats.**  
    - **Why:** High reader interest and cross-cultural data, but small effects and no test of cultural alternatives. Caveats: "Preference differences may be amplified by culture," "Effect sizes are modest."  
    - **Inconvenient?** Yes—readers love this, but it's bin ⚠️ due to weak methods.  

  #### **Study 3: Preregistered cooperation study with weaker-than-expected effect**  
  - **Step 1 (Rigor):**  
    - 🔍 Preregistered (major strength).  
    - 🔍 Falsifiable? Yes (predicted large effect; tested against non-social violations).  
    - 🔍 Alternatives tested? Yes (e.g., general rule-breaking vs. social cheating).  
    - *Verdict: ✅ Credible (passes rigor checks).*  
  - **Step 2 (Evidence):**  
    - 🔍 Cross-cultural: Preregistered design across cultures.  
    - 🔍 Convergent methods? Assume behavioral tasks only (no fMRI/game theory).  
    - 🔍 Predictive: Yes (preregistered prediction).  
    - 🔍 Effect size: Weak but significant (e.g., *d* = 0.15).  
    - *Verdict: ⚠️ Caveats (small effect, single method).*  
  - **Step 3 (Plausibility):**  
    - ⚖️ Plausible selection? Consensus: Cheater detection is a credible adaptive problem.  
    - 🔍 Utility ≠ origin? Paper avoids teleology.  
    - ⚖️ Zombie? Cheater-detection claims (e.g., Cosmides & Tooby) have mixed replications; this study updates prior work.  
    - *Verdict: ✅ Credible (no major plausibility issues).*  
  - **Overall Bin: ✅ Treat as credible science.**  
    - **Why:** Preregistration, falsifiability, and direct alternative-testing make this rigorous science. The weak effect doesn't invalidate the methods—it updates the theory. Frame as: "A high-quality test revises our understanding of cooperation."  

  ---

  ### **Key Takeaways**  
  - **Procedure strengths:** Focuses on methodological rigor (preregistration, falsifiability, alternatives) first, reducing reliance on contested plausibility debates.  
  - **Embrace judgment calls (⚖️):** At ambiguous points (e.g., falsifiability, plausibility), lean on objective checks and default to caveats. When in doubt, bin as ⚠️.  
  - **Inconvenient outcome:** Study 2 (sex differences) lands in ⚠️ despite reader appeal because it lacks preregistration, ignores cultural alternatives, and has small effects—a common failure mode in evolutionary psychology.  
  - **Your role:** Use this to filter claims, not adjudicate scientific disputes. For ⚠️ studies, quote critics and contextualize: "This is one interpretation, but it could also be explained by..."  

  This procedure prioritizes transparency, aligns with evolutionary biology's consensus critiques, and respects time constraints. It won't eliminate controversy but will help you avoid uncritical "just-so" storytelling.
