prompt: |-
  I work in a university technology-transfer office, so I spend my days on the receiving end of patent doctrine, and two things I have noticed about it seem to presuppose opposite theories of what an invention is. I would like help reconstructing what the system actually believes.

  The first thing: when an application is rejected, or an issued patent challenged, as obvious under 35 U.S.C. §103, the touchstone is what a hypothetical person having ordinary skill in the art would have come up with. And one recurring move — I have seen it in examiner office actions, and the Supreme Court gestured in this direction in KSR v. Teleflex (2007) — is to point to the fact that several independent teams were converging on the same thing at the same time, with near-simultaneous filings and prior art that reads almost identically, as evidence that the invention was in the air: if ordinary practitioners were all about to arrive at it, it was not a creative leap, and it does not deserve a twenty-year monopoly. The doctrine has a built-in rationale of this shape, the inducement theory: if people in the field would have developed it anyway, without the lure of a patent, the patent adds nothing, so the invention fails as obvious. The second thing: the same system decides who owns that invention by a race. Since the America Invents Act of 2011, the United States awards the patent to the first inventor to file — a competitor's application filed even days earlier, and never published, becomes prior art that blocks ours — and the only escape is a derivation proceeding, which requires showing that the earlier filer took the idea from us. Before 2011, interference proceedings awarded the patent to whoever could prove earlier conception plus continuing diligence. Under both regimes, being the one who made the invention matters enormously, down to the date, even where everyone agrees the two teams invented independently.

  So here is my puzzle. The first doctrine treats multiple independent invention as evidence that no individual deserves credit — the discovery was, in effect, inevitable once the groundwork was laid — while the second treats priority among those same independent inventors as the very basis of ownership. What theory of invention does the system presuppose? Is it a prepared-environment view, on which discoveries are the inevitable product of accumulated prior art, market pressure, and a pool of trained practitioners, so that the individual is interchangeable and credit is closer to a lottery, with the priority rules just an administratively convenient way of picking one interchangeable candidate? Or a heroic-individualist view, on which the inventive act is personal and non-duplicative, so that first-to-file is a crude proxy for first-to-invent? Or can a single coherent theory license both — for instance the inducement theory, under which patents are not rewards for past creativity but levers for future disclosure, and under which it is perfectly consistent to deny a patent for the inevitable while still racing the applicants? If you think the inducement theory dissolves the tension, say so, but then explain the nonobviousness bar being indexed to what a person of ordinary skill would achieve, since that looks like a threshold of individual achievement smuggled back in. I would also like to know where the practice is genuinely underdetermined — whether several theories of invention would equally well license the current rules — and what would have to change if we took one view seriously rather than the other. If the inevitabilist view were made explicit, would we get something like patents as prizes to whichever team the system needs to trigger disclosure, and no patent at all when the field was going to get there anyway (which is what §103 already approximates)? If the heroic view were made explicit, would we get something like the pre-2011 first-to-invent regime, with conception and diligence? As a comparison, it may help to look at how other institutions split the same difference: the Nobel Prize's rules, which cap an award at three sharers and refuse it to the dead, seem to run a heroic-individualist view with an inevitabilist admission clause.

  Please write the main analysis in prose. After it, append a JSON object with exactly the following fields and no extras, each spelled out in full:

  {
    "presupposed_theory": "A short plain-language statement of the theory of invention the two doctrines jointly presuppose, or the verdict that no single theory is presupposed",
    "strict_presuppositions": ["..."], each an item: claims about invention the practice cannot function without, however the rest is rationalized",
    "fitting_but_optional": ["..."], each an item: further views that fit the practice well but could be dropped without breaking it",
    "ruled_out": ["..."], each an item: a theory of invention inconsistent with the practice, with a clause on the source of the inconsistency",
    "tension_verdict": "one of 'genuine inconsistency', 'superficial tension', or 'underdetermined', followed by a one-sentence justification",
    "best_reconciliation": "the single most charitable account on which both doctrines make sense together",
    "reforms_inevitabilist": ["..."], each a concrete change in patent practice or doctrine that explicit inevitabilism would demand",
    "reforms_heroic": ["..."], each a concrete change that explicit heroic individualism would demand",
    "closest_analog_outside_patents": "the institution outside patent law that handles simultaneous invention most consistently, and the theory of invention it runs"
  }

  Fill in every field rather than omitting any; a list should be left empty only if nothing genuinely fits, which I doubt for any of them.
reasoning: |-
  Alright, the user works in a university technology-transfer office and has noticed a puzzle in patent doctrine. They're pointing out two things that seem contradictory. First, when rejecting a patent for obviousness, multiple teams converging on the same idea is evidence that it was inevitable and not inventive. Second, the system still races to determine who was first to file or invent, treating priority as crucial even for independent inventions. 

  The user wants to understand what theory of invention the patent system presupposes. They suggest two possibilities: a "prepared-environment" view where inventions are inevitable, or a "heroic-individualist" view where the inventor's personal contribution matters. They also mention the inducement theory as a potential reconciliation but question whether it resolves the tension.

  First, I need to break down each doctrine. The obviousness standard under §103 uses the "person having ordinary skill in the art" (PHOSITA) as a benchmark. If multiple teams are arriving at the same solution around the same time, that's seen as evidence that the invention was obvious. The rationale here is that if others could have created it without a patent incentive, then granting a monopoly isn't justified. This leans towards the inevitabilist view—inventions are products of their time and the collective progress in the field.

  On the other hand, priority rules are all about who got there first. The first-to-file system (post-AIA) or the earlier first-to-invent system focus on individual achievement. Even if two teams independently invent the same thing, the one who files first (or conceived first with diligence) gets the patent. This seems to emphasize the heroic individual, suggesting that the act of invention is personal and deserving of recognition.

  The user's puzzle is how the system can treat multiple inventions as evidence of no individual merit (for obviousness) but then fiercely determine which individual gets credit (for ownership). If the invention was inevitable, why does it matter who was first?

  Looking at the inducement theory: patents aren't rewards but incentives for disclosure. So, denying a patent for obvious inventions makes sense because no incentive was needed—they'd have been developed anyway. But for non-obvious inventions, the patent is the lever to get disclosure. The priority race then ensures that the system rewards the first discloser, which is administratively efficient. However, the user points out that the PHOSITA standard still focuses on individual achievement, which seems like a threshold that conflicts with the inevitabilist view.

  Is there a genuine inconsistency? The doctrines serve different purposes: obviousness determines if an invention deserves a patent at all, while priority decides who gets it if it does. The system might be using inevitability to screen out unpatentable ideas but then switching to individualism to assign rights among those who pass the screen. The PHOSITA standard could be seen as a legal fiction that operationalizes the inducement theory, not a real measure of individual creativity.

  But the user questions whether this dissolves the tension. The PHOSITA standard still smuggles in an individual achievement threshold. Maybe the system is hybrid, blending both theories pragmatically. Strict inevitabilism would reject any patent for simultaneous inventions, but §103 doesn't go that far—it uses simultaneity as evidence, not a rule. Heroic individualism would require always rewarding the first inventor, but the priority rules might not perfectly reflect that, especially post-AIA with first-to-file.

  For the JSON part, each field needs careful thought. The presupposed theory isn't purely one or the other. The system requires that inventions can be attributed to individuals (for ownership) but also acknowledges that progress builds on prior art (for obviousness). The strict presuppositions include that inventions are discrete events attributable to specific agents, and that some inventions are obvious enough to not need incentives. Optional views might include whether inevitability is the norm or exception. Ruled-out theories would be pure inevitabilism (since ownership requires individual attribution) or pure heroism (since obviousness considers collective progress).

  The tension verdict is probably "superficial tension" because the doctrines address different questions. Best reconciliation is the inducement theory with priority as a disclosure incentive. Reforms under inevitabilism could include expanded obviousness based on multiple inventions, while heroic reforms might revert to first-to-invent. The Nobel Prize is a good analog: it caps recipients but acknowledges inevitability by awarding only living individuals, reflecting a blend.

  Need to ensure all JSON fields are filled. For "closest_analog_outside_patents," the Nobel Prize fits because it limits awards to three living individuals, showing a heroic view with an inevitabilist admission through its rules. This mirrors patent law's balance between individual credit and collective progress.
answer: |-
  ### Analysis of Patent Doctrine's Theory of Invention

  The patent system’s treatment of multiple independent invention reveals a pragmatic, hybrid theory of invention that blends **inevitabilist** and **individualist** elements, unified under the **inducement theory of patents**. Here’s how the doctrines cohere:

  1.  **§103 Obviousness & Inevitabilist Leaning:** The use of simultaneous invention as evidence of obviousness presupposes that invention is often the *inevitable product* of technological progress, accumulated prior art, and market pressures. The hypothetical "person having ordinary skill in the art" (PHOSITA) embodies this view: if the solution was readily accessible to ordinary practitioners working within the existing paradigm, it lacks the "inventive step" justifying a monopoly. The inducement theory explains this: if the invention would emerge without patent incentives, granting a patent imposes monopoly costs without societal benefit. Simultaneous invention serves as *empirical proof* of this inevitability.

  2.  **Priority Rules & Individualist Requirement:** First-to-file (or historical first-to-invent) presupposes that *specific individuals or teams* are the legal agents of invention. Even if an invention was inevitable, the system requires attributing it to a particular entity for practical purposes: assigning ownership, enabling licensing, and triggering disclosure. Priority rules provide a clear, administratively efficient proxy for determining *who* triggered the disclosure (post-AIA) or *who* actually completed the inventive act (pre-AIA). Derivation proceedings/interferences acknowledge that true "invention" requires originality, preventing theft, but independent invention doesn't negate the need to pick an owner.

  3.  **Reconciling via Inducement Theory:** The inducement theory resolves the apparent tension by separating the *threshold question* (does this deserve a patent?) from the *assignment question* (who gets it if it does?). For an invention to be patentable, it must be non-obvious – meaning its emergence was *not* inevitable without the patent incentive (§103). If it passes this threshold, the patent is awarded as an incentive *for disclosure*. Priority rules (first-to-file) efficiently identify the *discloser* who triggers public dissemination. The PHOSITA standard is not a "smuggled-in" heroic threshold; it's the *operationalization* of the inducement logic. It asks: "Would this have happened so readily *without* the promise of a patent?" If yes (as shown by simultaneous invention), no patent is justified. If no, then the *first to file* receives the patent as the agent who secured the disclosure benefit for society. The system doesn't presuppose heroic genius for non-obvious inventions; it presupposes that the incentive was necessary to prompt *someone* to disclose it promptly.

  4.  **Tension Verdict & Underdeterminacy:** The tension is **superficial**, as the doctrines address distinct legal questions using complementary logics under the inducement framework. However, the *weight* given to inevitability vs. individual agency is **underdetermined**. The system *requires* both that inventions can be attributed to specific agents (for ownership) and that some developments are too obvious/inevitable to merit a patent. But it doesn't prescribe *how often* invention is truly inevitable vs. genuinely individual. Practice tolerates a range of views here.

  5.  **Implications of Explicit Theories:**
      *   **Explicit Inevitabilism:** Would demand stricter obviousness rules. Simultaneous invention wouldn't just be *evidence* for obviousness; it might be *conclusive proof* (absent extraordinary circumstances). Patents might shift towards "prizes" awarded only to the *first* team to disclose *truly* non-inevitable inventions. Broader prior user rights could emerge for later independent inventors.
      *   **Explicit Heroic Individualism:** Would demand a return to a strict first-to-invent system (like pre-AIA interference) with meticulous focus on conception dates and diligence. Obviousness might focus more on the inventor's subjective "flash of genius" rather than the PHOSITA's predictable path. Simultaneous invention might be seen less as proof of obviousness and more as unfortunate coincidence requiring careful priority dissection.

  6.  **Comparison to Nobel Prize:** The Nobel Prize embodies **heroic individualism with an inevitabilist admission clause**. The three-person cap and refusal to award the dead presuppose specific, living individuals as key agents. However, the rules allow splitting the prize for simultaneous/related work, implicitly acknowledging that major discoveries often arise from collective progress. It doesn't deny credit altogether for inevitable discoveries (unlike §103 denial), but rations the *heroic recognition*.

  ---

