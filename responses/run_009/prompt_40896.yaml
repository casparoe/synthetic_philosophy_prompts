  Okay, the user is a PhD student in epistemology dealing with a debate in their reading group about pragmatic encroachment. They presented a case study involving a radiologist whose claims about knowledge change based on practical stakes. The core dispute is between Dana (pro-pragmatic encroachment) and Marcus (anti-encroachment), and they want me to adjudicate each move step-by-step.

  First, I need to unpack the radiologist case. Same evidence, same belief, but different knowledge claims in high-stakes vs low-stakes situations. Dana argues stakes directly affect knowledge itself, while Marcus maintains that only actionability changes, not epistemic status. Their debate then connects to the knowledge norm of action (KNA) and contextualism.

  I'll structure my response by evaluating each exchange:
  - Dana's initial move (stakes change knowledge): Moderate plausibility but vulnerable. Pragmatic encroachment isn't universally accepted, and the case alone doesn't prove it.
  - Marcus' reply (distinguishing knowledge from decision-worthiness): Strong point. The evidence/fact relationship does seem stable, and practical standards can shift independently.
  - Dana's KNA counter: Clever but overreaching. Even if KNA holds, Marcus' fallback option (justificatory thresholds) remains viable. KNA doesn't necessarily force encroachment.
  - Marcus' fallback proposal: Reasonable alternative. This preserves knowledge stability while explaining action constraints - a solid middle ground.
  - Dana's contextualism argument: Explains linguistic data well but has known weaknesses like the "casual conversation" problem Marcus raises.
  - Marcus' overgeneration critique: Valid concern about contextualism. The malpractice lawyer example highlights how knowledge attributions might reference fixed standards.

  On the bigger questions:
  - The dispute heavily turns on KNA's interpretation. If KNA is rejected (e.g., justification-based action norms), Marcus' view gains ground. But even with KNA, Dana's position isn't inevitable.
  - Both are missing that "I don't know" might reflect a secondary norm (e.g., assurance) rather than literal knowledge absence. Also, they overlook gradable evidence frameworks that could reconcile some aspects.

  The user likely wants clarity on where each argument succeeds/fails for their PhD work, plus deeper philosophical insights. I'll balance technical rigor with pedagogical clarity, emphasizing how this case exposes fault lines in contemporary epistemology.
answer: |-
  ### Adjudication of Exchange  

  **Brainstorming:**  
  The core tension lies between *invariantism* (knowledge depends solely on truth-relevant factors like evidence) and *pragmatic encroachment* (practical stakes can raise/lower the evidential threshold for knowledge). The radiologist case highlights intuitions about knowledge attributions shifting with stakes, but Marcus correctly notes that stakes might instead affect *action-guidance* without altering knowledge itself. Contextualism offers a semantic solution but faces challenges regarding cross-contextual assessments.  

  ---

  ### Move-by-Move Adjudication  

  1. **Dana’s Opening (Pragmatic Encroachment):**  
     *Rating:* **Moderately Plausible, but Vulnerable**  
     *Justification:* Dana rightly notes the *intuition* that knowledge seems absent in high-stakes contexts. Pragmatic encroachment (e.g., Fantl & McGrath, Stanley) explains this by tying knowledge to practical rationality. However, this move conflates *epistemic justification* with *actionability*, and the case alone doesn’t prove encroachment—it might reflect a performance error or contextual variation in language.  

  2. **Marcus’ Reply (Knowledge/Decision Split):**  
     *Rating:* **Clearly Right**  
     *Justification:* Marcus cleanly distinguishes epistemic standing (fixed by evidence, reliability, truth) from practical standards for action. The radiologist’s *evidence* for the hemorrhage (e.g., scan clarity, diagnostic skill) doesn’t change; only the *risk* does. This aligns with purist invariantism (e.g., Williamson, Nagel), which treats knowledge as stakes-insensitive.  

  3. **Dana’s Knowledge Norm Counter:**  
     *Rating:* **Partially Correct but Overreaching**  
     *Justification:* If knowledge is the norm of action (KNA: “Act only if you know”), and identical evidence licenses action in low-stakes but not high-stakes, Dana *logically* infers knowledge must shift. This is coherent (e.g., Hawthorne’s bank cases). Yet KNA doesn’t *entail* pragmatic encroachment: Marcus can reject KNA or argue that actionability requires *more* than knowledge (e.g., safety margins).  

  4. **Marcus’ Fallback (Justificatory Thresholds):**  
     *Rating:* **Strong and Defensible**  
     *Justification:* Marcus offers a robust alternative: knowledge remains invariant, but *justified action* requires meeting context-sensitive *credence thresholds* (e.g., 95% certainty for routine follow-up vs. 99.9% in the ER). This preserves epistemic purity (knowledge = properly based true belief) while explaining practical constraints, drawing on decision theory (e.g., Lockhart’s “pragmatic adequacy”).  

  5. **Dana’s Contextualism Defense:**  
     *Rating:* **Linguistically Apt but Theoretically Limited**  
     *Justification:* Contextualism (e.g., DeRose) elegantly explains why “I don’t know” sounds true in the ER (high conversational stakes raise the semantic standard for “knows”) and false later. However, as Marcus notes, it struggles with *metalinguistic assessments* (e.g., the lawyer’s evaluation across contexts), where speakers treat knowledge as fixed.  

  6. **Marcus’ Overgeneration Critique:**  
     *Rating:* **Clearly Right**  
     *Justification:* Marcus identifies contextualism’s key weakness: conversational stakes ≠ decision stakes. If the radiologist chatted casually *during* the ER crisis, contextualism might falsely predict low “knows” standards. The malpractice lawyer (low-stakes context evaluating a high-stakes past event) intuitively assesses *whether she knew then*—suggesting a stable epistemic fact.  

  ---

  ### Addressing Your Questions  

  **1. Does the dispute turn on the knowledge norm of action (KNA)?**  
  Yes, decisively. Dana’s argument relies on KNA to bind knowledge to practical reasoning: if KNA holds, and stakes block warranted action, knowledge *must* be stakes-sensitive. Marcus’ fallback severs this link by decoupling knowledge from action-guidance. **If KNA is false**, Marcus’ invariantism gains strength; **if KNA is true**, Dana’s encroachment has traction but isn’t inevitable—Marcus could still posit extra-epistemic action constraints (e.g., “knowledge + safety”).  

  **2. What are both parties missing?**  
  - **Shared Blind Spot:** Neither fully engages with **gradability** in evidence and stakes. Evidence isn’t binary; the radiologist’s credence (e.g., 97% confidence) might be *sufficient* for knowledge but *insufficient* for high-stakes action. This blurs Dana’s knowledge shift and Marcus’ rigid split.  
  - **Dana’s Gap:** She overlooks that “I don’t know” in the ER might reflect **assurance norms** (e.g., “I can’t guarantee it”) rather than literal knowledge absence.  
  - **Marcus’ Gap:** He downplays why the radiologist’s retrospective “I knew” feels correct—suggesting stakes *do* affect **salience of error possibilities** (Schaffer), which invariantists struggle to explain.  

  ---

  ### Final Analysis  
  **Verdict:** Marcus’ invariantism (+ flexible action thresholds) is **more defensible**, as it better preserves the truth-directed nature of knowledge while accommodating practical demands. Dana’s contextualism/pragmatic encroachment better explains *linguistic intuitions* but risks conflating epistemology with pragmatics. The radiologist case ultimately exposes how **knowledge attributions** track not just truth conditions but *communicative and practical interests*—a nuance both theories must address.  

  **Recommendation for Further Study:**  
  - Explore *impurist* invariantism (e.g., Bach, who ties justification to "normal" stakes).  
  - Test cases where conversational stakes and decision stakes diverge (e.g., Hawthorne’s “airport” case).  
  - Consider whether “knowledge” is a hybrid norm (epistemic + practical) to resolve the tension.
