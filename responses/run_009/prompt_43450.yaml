prompt: |-
  I teach an upper-level ethics seminar — 14 students, 80 minutes, they've had a solid dose of utilitarianism but nothing of Williams yet. That's deliberate: I want the activity to come before the reading, so the debrief can cash out something that actually happened to them into the texts. Design me the activity.

  No lecture up front, and nobody hears the phrases integrity objection or one thought too many until the debrief. I want them to run into both problems before either gets a name.

  Two phases, one scenario — and please invent a fresh case rather than reaching for the drowning-wife example or anything out of an anthology. The case needs: a role where one participant has something personal at stake (a long-running project or a close tie — make it something a student could actually care about defending, not a cardboard spouse), and a role that works the same choice as an impartial optimizer, with real numbers to put up on the board. Plus a mechanic I specifically want: whoever decides has to state their reasons out loud, one at a time, and a designated recorder writes each reason on a separate card as it's voiced. The cards get kept. In the debrief I want to lay the card sequence out in order and ask where, exactly, a thought became one too many — and prep me for the fact that there are two live readings of that remark floating around (roughly: the extra thought is corrupting inside the agent's own deliberation, vs. it's fine there but wrong as a public justification). My students will split across those readings, and I want to be able to referee the split honestly instead of pretending Williams settled it.

  Phase two is the integrity half. I want the personal-stake participant's projects and attachments to get picked up and converted into inputs on the optimizer's ledger, and I want the person it happens to feel it — their stuff treated as one more entry in the ranking rather than as theirs. The debrief then has to name that feeling (alienation from your ground projects) and connect it to the objection that a theory which forces you to view your own projects that way has made moral life too impersonal — that it doesn't just constrain your integrity but violates it.

  Give me: rules, materials (paper and markers is my budget), how to split 14 people across the roles including what everyone not currently in a role is doing, a minute-by-minute plan for the 80 minutes, the full debrief, what will predictibly go wrong the first time I run this and how to handle it, and an honest note on which part of the whole thing a classroom activity simply cannot reproduce and I'll have to supply myself in the debrief.

  Two more constraints. The setup has to be constructible in under five minutes, and the choice has to be live enough that participants actually hesitate — if the case is so obviously stacked that nobody wobbles, the cards are worthless. And I want the optimizer's numbers to run close rather than a landslide: the interesting debrief moments come from narrow margins, where it looks like one or two extra considerations could flip it either way.
reasoning: |-
  Okay, the user teaches an upper-level ethics seminar and needs a fresh activity to introduce Bernard Williams' critiques of utilitarianism without using standard examples. They want a two-phase activity where students encounter "one thought too many" and integrity objections organically. Let me unpack their requirements.

  First, the key constraints: no upfront lecture, original scenario, personal stake for one participant, impartial optimizer with quantifiable data, and a card-based reason-tracking mechanic. The debrief needs to handle the ambiguity in Williams' "one thought too many" interpretation. Phase two must make the personal-stake participant feel their projects are alienated when converted into utility inputs. 

  Hmm, the scenario needs to feel real to students. A community garden with an art installation could work - it's relatable, has tangible outputs, and allows for quantifiable benefits. For the personal stake, an Environmental Science major's capstone project being threatened creates authentic tension. The optimizer role should involve calculating food yields vs. art value with close numbers to force hesitation.

  The card mechanic is crucial. Having the Decider verbalize reasons one by one while a Recorder writes each on separate cards will create a visible deliberation trail. This sets up the debrief question: "At which card did it feel like one thought too many?" 

  For roles: 14 students. Phase one needs 1 Decider (personal stake), 1 Recorder, 1 Optimizer, 1 Calculator, and 10 Council Members. The audience observes but stays engaged through the Council's votes. Phase two flips the Decider and Optimizer roles to create the alienation effect when the former's project gets quantified.

  Timing is tight: 5 min setup, 15 min phase one, 10 min phase two, 50 min debrief. The narrow utility margin (e.g., 320 meals vs 290 + art) ensures genuine dilemma. Predictable issues: Decider freezing, Calculator errors, Council disengagement. Mitigations: pre-written prompts, calculator checks, assigning observation tasks.

  What can't be replicated: The visceral feeling of alienation. I'll need to name that in debrief and connect it to Williams' concept of "ground projects." Also, the ambiguity in "one thought too many" - I should prepare to present both interpretations (corrupting thought vs. inappropriate justification) neutrally.

  The debrief structure: First, reconstruct the card sequence to locate the "extra thought." Then examine phase two's quantification for the integrity violation. Finally, contextualize with Williams' texts while acknowledging unresolved interpretations.

  This should create the lived experience the user wants - students will have felt the tension before labeling it philosophically. The garden scenario avoids tired tropes while allowing real student investment.
answer: |-
  Here’s a fresh, tightly designed activity meeting all your specifications. **Scenario: The Campus Green Space Dilemma**  

  ---

  ### **Setup (5 min)**  
  **Materials:**  
  - Whiteboard/markers  
  - 20+ blank index cards  
  - 2 calculators  
  - Role cards (pre-printed):  
    - *Phase 1*: **Decider (1)**, **Recorder (1)**, **Optimizer (1)**, **Calculator (1)**, **Council (10)**  
    - *Phase 2*: Roles shift (see below)  

  **Scenario:**  
  *"The university plans to convert a small, neglected campus green space. Two proposals:*  
  1. **Student Farm:** Grow vegetables for the campus food pantry (est. **320 meals/semester**).  
  2. **Art Grove:** A sculptural installation by student artists, including a kinetic piece by **Riley (Environmental Science senior)** — her 2-year capstone project. It offers quiet space for meditation (est. **290 student visits/semester**).  

  *The Sustainability Council must decide TODAY. If they deadlock, the space becomes a parking lot."*  

  ---

  ### **Phase 1: The Optimizer’s Calculus (15 min)**  
  **Roles:**  
  - **Decider:** Riley (defends Art Grove; *emphasize her 2-year investment, emotional tie to the artwork*).  
  - **Optimizer:** Argues for Student Farm using metrics.  
  - **Recorder:** Writes each stated reason on a new card.  
  - **Calculator:** Computes/verifies numbers (meals/visits).  
  - **Council (10):** Listens, then votes anonymously on slips.  

  **Process:**  
  1. **Optimizer** makes impartial case: *"320 meals > 290 visits"*; notes food insecurity data.  
  2. **Decider (Riley)** responds: Gives emotional/personal reasons (*"This art connects people to nature," "It’s my life’s work," "Meditation space reduces student stress"*).  
  3. **Recorder** writes EVERY reason verbatim on separate cards (e.g., *"320 meals feed hungry students," "My art took 2 years," "290 visits isn’t enough impact"*).  
  4. **Council** votes after 10 min. **Critical:** Optimizer’s numbers must *barely* win (e.g., 6–4 vote).  

  ---

  ### **Phase 2: Integrity Under Siege (10 min)**  
  **Roles Shift:**  
  - Former **Optimizer** becomes **New Decider**.  
  - Former **Decider (Riley)** becomes **New Optimizer**.  
  - Recorder/Calculator same.  

  **Twist:**  
  - **New Optimizer (Riley)** must now argue IMPARTIALLY for *Student Farm* using her OWN previous reasons, quantified:  
    *"My art project’s 290 visits? Only worth 15 meals in well-being metrics (per campus health data). Food pantry’s 320 meals + 15 = 335 > 320."*  
  - **Recorder** captures reasons (e.g., *"Art visits convert to 15 meal-equivalents"*).  
  - **New Decider** (ex-Optimizer) argues *for Art Grove* personally (*"I’ve always loved sculpture"*).  
  - **Council** re-votes. *Likely outcome:* Student Farm wins again, but Riley visibly struggles.  

  ---

  ### **Debrief (50 min)**  
  **Part 1: The Cards & "One Thought Too Many" (25 min)**  
  - Lay Phase 1 cards in order. Ask:  
    *"When did Riley’s reasons start feeling inappropriate? Was it when she mentioned her 2-year project? Her stress-relief claim?"*  
  - Introduce Williams’ **"one thought too many"**:  
    - **Interpretation A (Corruption):** The moment self-concern *taints* moral duty (e.g., Riley’s "my life’s work" card).  
    - **Interpretation B (Justification Failure):** When personal reasons are *voiced* as moral arguments (e.g., Riley using "meditation space" to sway votes).  
  - Highlight ambiguity: *"Williams’ text supports both readings. Which felt true here?"*  

  **Part 2: Alienation & Integrity (20 min)**  
  - Ask Riley: *"How did Phase 2 feel when your art became ‘15 meals’?"*  
  - Name the reaction: **Alienation** — her project was "alien" to her when converted to utility.  
  - Connect to Williams: Utilitarianism forces us to see our deepest commitments as *fungible inputs*, violating **integrity** ("a theory that makes my projects just another datapoint is inhuman").  
  - Contrast: *"Did Phase 2 feel like integrity loss? Or merely tough fairness?"*  

  **Part 3: Text Bridge (5 min)**  
  - Assign Williams’ *Persons, Character and Morality* for next class:  
    *"Revisit today’s cards and votes. Where does Williams describe YOUR experience?"*  

  ---

  ### **Predictible Problems & Fixes**  
  - **"Riley" won’t defend passionately:** Assign the role to a known artsy/activist student; privately prime them pre-class: *"This project matters to you — fight for it."*  
  - **Council disengaged:** Give them 2 sticky notes each to jot "best reason heard" during debate.  
  - **Numbers not close:** Pre-calculate margins; add a "volunteer hours" variable to tip scales (e.g., Farm needs 50 hrs/semester labor).  
  - **Debrief runs long:** Use timer; cut Part 3 if needed (reading bridges the gap).  

  ### **What the Activity Can’t Replicate**  
  The **visceral weight of personal projects**. Students know Riley’s "capstone" isn’t real. *You must supply this in debrief:*  
  > *"Imagine something you’ve poured years into — your thesis, a sport, an art piece. Now imagine it reduced to a number on a whiteboard by someone arguing ‘fairly’. That gut punch is what Williams means by integrity violation."*  

  ---

  ### **Why This Works**  
  - **Hesitation built-in:** Close numbers + role reversal force tough choices.  
  - **"One thought" mechanic:** Cards make deliberation tangible for debrief.  
  - **Alienation trigger:** Phase 2 forces quantification of the personal.  
  - **Fresh scenario:** Campus context is relatable; avoids spouse/child tropes.  

  **Time Map:**  
  ```  
  0–5 min: Setup  
  5–20 min: Phase 1  
  20–30 min: Phase 2  
  30–80 min: Debrief (as above)  
  ```  
  Run it cold — the friction is the point. The texts will land differently when they’ve *lived* the dilemma.
