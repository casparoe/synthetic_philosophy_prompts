prompt: |-
  so our reading group is doing a thing where everyone writes down their commitments on a topic and the rest of us try to find the cracks. mine's on the knowing-how / knowing-that debate and I want a proper audit before I send it round, because I have a nagging feeling something in here doesn't fit but I can't put my finger on it. here's the set:

  (a) Ryle's regress argument is sound: knowing-how can't be analysed as knowing-that plus applying what you know, on pain of an infinite regress.
  (b) Stanley and Williamson's 2001 paper got it wrong — when I say my mum knows how to make a roux, I'm not attributing to her propositional knowledge of some way of making roux under a practical mode of presentation or whatever the intellectualist gloss is.
  (c) the deep story is ability: to know how to do something just is to possess the capacity to do it, reliably, when you try.
  (d) a concert pianist who gets paralysed by a stroke still knows how to play the piano — she could coach students, spot a wrong fingering from across the room, hum the concertos.
  (e) genuine know-how has to be learnt by doing — you can't acquire it by absorbing descriptions, which is why I don't think a text-only LLM, however fluent, knows how to do anything at all. all knowing-that and mimicry, zero know-how.
  (f) playing chess at a high level is a paradigm of knowledge-how, and I'm completly comfortable saying AlphaZero knows how to play chess in exactly the sense a grandmaster does — better, actually.
  (g) a first-time poker player who cleans up on a lucky night doesn't thereby know how to play poker.

  I take (a) and (b) together to basically settle things in favour of (c), and I'd assumed (e) and (f) fit fine since AlphaZero never read a book in its life. go through the set and tell me which bits are genuinely in tension, which only look like it, how bad each one is, and what the cheapest fix would cost me. rank the problems rather than listing them all as equally fatal, and if there's a single revision that would clean up the most mess, tell me which one. don't pull your punches just because it's my position — that's literally what the group is for.
reasoning: |-
  Okay, the user is in a reading group and wants their commitments on the knowing-how/knowing-that debate audited before sharing. They've listed positions from (a) to (g) and feel something doesn't fit but can't identify it. Let me analyze each point for internal consistency.

  First, their core commitments: (a) supports Ryle's regress argument against intellectualism, (b) rejects Stanley & Williamson's intellectualist view, and (c) defines know-how purely as reliable ability. These seem cohesive at first glance. But tension arises when we reach (f) - they claim AlphaZero "knows how" to play chess like a grandmaster. 

  Wait - AlphaZero is a neural net AI trained through self-play. The user's position (e) insists know-how must be "learnt by doing" and denies text-only LLMs can have it. But here's the rub: AlphaZero learns through simulated doing (millions of self-play games), so (e) and (f) might be compatible. However...

  The bigger conflict is with (c) and (d). If know-how is defined strictly as "capacity to do it when you try" (c), then the paralyzed pianist in (d) poses a problem - she can't physically play but retains knowledge. The user resolves this by pointing to her coaching abilities, but this stretches "capacity to do it" beyond physical execution. 

  Then there's (g) - the lucky poker player lacks know-how despite succeeding. This contrasts with AlphaZero's case where success indicates know-how. The implicit criterion seems to be reliability, but the user doesn't explicitly state this. 

  The deepest fissure is between (d) and (c)/(f). The pianist knows how without physical capacity, while AlphaZero "knows how" through pure behavioral capacity. The user needs to either adjust the ability definition in (c) to include non-manifest capacities, or accept that know-how isn't unitary. 

  Cheapest fix? Modify (c) to: "...capacity to do it *or guide/recognize it* when appropriately engaged." This preserves (d) while allowing room for (f). But it might weaken their anti-intellectualist stance by making know-how more dispositional than purely ability-based. 

  Secondary issue: The reliability requirement in (c) isn't explicitly applied to (f) and (g). Making it explicit would strengthen the poker example against lucky novices while justifying AlphaZero's inclusion based on consistent performance. 

  AlphaZero's case also subtly pressures (b) - if we attribute know-how to AIs without propositional knowledge, it ironically supports the user's rejection of intellectualism, but only if we ignore that AlphaZero's "knowledge" is encoded in weights (arguably a non-propositional form). 

  Final note: The paralyzed pianist example is actually their strongest card against intellectualism - it demonstrates know-how without current ability. They should lean into this rather than force alignment with (c)'s physical capacity requirement.
answer: |-
  Here's a brutally honest audit of your commitments, ranked by severity of tension. The core issue is **a misalignment between your definition of know-how as *ability* (c) and cases where know-how seems to persist *without* the ability to *perform* (d) or exists *without* human-like learning/embodiment (f)**.

  ### Ranked Problems (From Most Severe to Least)

  1.  **(d) vs. (c) [Ability Definition]: CRITICAL CONTRADICTION**
      *   **The Conflict:** (c) explicitly defines know-how as "*possessing the capacity to do it, reliably, when you try*." (d) describes a pianist who demonstrably *cannot* do it (play) due to paralysis. Her coaching/knowledge is real, but it's *not* the capacity to *play* reliably when she tries. She tries and fails physically.
      *   **Why it's Fatal:** This directly contradicts your core definition. If know-how *just is* the reliable ability to perform, the paralyzed pianist *cannot* possess that know-how regarding *playing*. The abilities she retains (coaching, recognizing) are *different* abilities/know-how related to *teaching* or *evaluating* piano playing, not *doing* it.
      *   **Cheapest Fix:** **Modify (c) significantly.** The cheapest *conceptual* fix is to broaden (c) beyond *performance ability* to include *understanding, guiding, or recognizing* the activity, even without the capacity to perform it oneself. E.g., "...possess the capacity to *understand, guide, or reliably perform* the activity when appropriately engaged." However, this significantly weakens your Rylean anti-intellectualist stance and starts looking more like a form of *knowledge-that* about the activity. The cheapest *rhetorical* fix is to drop (d) or radically reframe it (e.g., "She *retains knowledge about* playing, but has *lost the know-how* to execute it").

  2.  **(f) vs. (e) [Acquisition & Embodiment]: MAJOR TENSION**
      *   **The Conflict:** (e) states know-how *must* be "learnt by doing" and *cannot* be acquired "by absorbing descriptions." (f) attributes know-how to AlphaZero. AlphaZero *did* learn by "doing" – via millions of simulated games – but crucially, it *did not* learn through embodied, sensory-motor interaction with the physical world. It learned purely computationally. Your (e) seems to imply (though doesn't explicitly state) a requirement for *embodied, experiential* learning ("doing" in a human sense). AlphaZero's learning is non-embodied simulation.
      *   **Why it's Serious:** If "learn by doing" requires human-like embodiment/physical interaction (as the "absorbing descriptions" contrast suggests), AlphaZero fails. If "doing" just means *practiced execution* (even simulated), AlphaZero passes. Your position is ambiguous, creating friction.
      *   **Cheapest Fix:** **Clarify/Modify (e).** Explicitly state that "doing" includes *practiced execution within a relevant domain/system*, even if simulated or computational. E.g., "...learnt by *practiced execution or simulation* within the relevant domain, not merely by absorbing descriptions." This embraces AlphaZero while still excluding text-only LLMs. Be prepared to defend why simulated chess "doing" counts but linguistic pattern prediction ("doing" with words) doesn't.

  3.  **(f) vs. (c/d) [Nature of the Ability]: SIGNIFICANT STRAIN**
      *   **The Conflict:** (c) defines know-how as a capacity/ability. (d) shows a human who loses the *physical* capacity but retains cognitive aspects. (f) attributes know-how to AlphaZero, which possesses a *purely computational* capacity utterly unlike human motor skills or cognitive embodiment. Can "ability" coherently cover the paralyzed pianist's cognitive residue *and* AlphaZero's algorithmic prowess *and* a healthy pianist's physical skill under one definition (c)?
      *   **Why it's Problematic:** Your definition (c) risks becoming vacuous if "ability" stretches to cover such radically different things (residual understanding, silicon computation, embodied skill). The *nature* of the ability matters. AlphaZero's "ability" is pure input-output mapping within a formal system; the paralyzed pianist's involves conscious understanding, memory, and sensory recognition; the healthy pianist's involves deep embodied cognition.
      *   **Cheapest Fix:** **Clarify the scope of (c).** Acknowledge that "ability" manifests differently depending on the system (human vs. AI) and circumstances (healthy vs. disabled). Emphasize the *functional outcome* (reliable success in the relevant context when attempting engagement) rather than the underlying mechanism. This preserves (f) and (d) under a broader functionalist (c), but weakens the intuitive "ability" link Ryle emphasized.

  4.  **(g) vs. (c) [Reliability Requirement]: MINOR TENSION (Easily Fixable)**
      *   **The Conflict:** (c) requires reliability. (g) correctly points out that a lucky novice isn't reliable. This *seems* aligned, but the tension is subtle: (c) doesn't *explicitly* state reliability as a requirement, it's implied by "reliably, when you try." The novice *tried* and succeeded once, but unreliably.
      *   **Why it's Minor:** This is easily resolved by emphasizing "reliably" in (c). Your intuition in (g) is correct and actually *supported* by (c) once reliability is made explicit.
      *   **Cheapest Fix:** **Strengthen the wording in (c).** Make "reliably" absolutely central: "...possess the *reliable* capacity to do it when you try." This makes (g) a straightforward consequence of (c).

  5.  **(a)/(b) vs. (f) [Anti-Intellectualism & AI]: POTENTIAL TENSION (Manageable)**
      *   **The Conflict:** Your strong anti-intellectualism ((a), (b)) rejects propositional knowledge + application. Attributing know-how to AlphaZero (f) *could* be seen as compatible if AlphaZero's knowledge isn't propositional. However, Stanley & Williamson might argue AlphaZero *does* encode propositional knowledge (about board states, moves, values) under a computational "mode of presentation," challenging your rejection of *all* intellectualist accounts.
      *   **Why it's Manageable:** You can firmly reject S&W's *specific linguistic, first-person* intellectualism while maintaining that AlphaZero's knowledge representation (weights, activations) is fundamentally *non-propositional* and *non-linguistic*, thus escaping their analysis and the regress. It's a different kind of knowledge state.
      *   **Cheapest Fix:** **Clarify the target of (b).** Specify that you reject S&W's *particular* intellectualist analysis involving propositional attitudes under *practical modes of presentation in human cognition*. Maintain that AlphaZero's state is a distinct, non-propositional form of capacity realization. This preserves your core anti-intellectualism regarding human know-how while accommodating AI.

  ### The Single Best Fix & Revised Set Recommendation

  **The most impactful fix targets the CRITICAL (d) vs. (c) contradiction by broadening the definition of know-how in (c):**

  *   **(c) Revised:** "to know how to do something is to possess the reliable capacity to *understand, guide, or perform* the activity successfully when appropriately engaged."

  **Why this works best:**

  1.  **Resolves (d) vs. (c):** The paralyzed pianist retains the capacity to *understand* and *guide* piano playing.
  2.  **Preserves (f):** AlphaZero possesses the capacity to *perform* chess playing successfully.
  3.  **Accommodates (g):** The lucky novice lacks the *reliable* capacity.
  4.  **Softens (e) vs. (f) tension:** "Appropriately engaged" allows for computational engagement. You still need to clarify "learnt by doing" (see below).
  5.  **Maintains Anti-Intellectualism Core (a)/(b):** "Capacity to understand/guide/perform" remains distinct from "knowing-that plus application." It's still ability-focused, just broader.

  **Additional Recommended Fixes:**

  *   **Clarify (e):** "...genuine know-how has to be learnt by *practiced execution or simulation* within the relevant domain..."
  *   **Emphasize Reliability in (c):** Keep "reliable" prominently featured as per the revision above.
  *   **Refine (f) slightly for precision:** "...in a sense *functionally equivalent* to a grandmaster..." (acknowledging differences in mechanism/embodiment).

  **Revised Commitment Set (Integrated Fixes):**

  (a) Ryle's regress argument is sound...
  (b) Stanley and Williamson's 2001 paper got it wrong...
  (c) **Revised:** the deep story is ability: to know how to do something is to possess the reliable capacity to *understand, guide, or perform* the activity successfully when appropriately engaged.
  (d) a concert pianist who gets paralysed... still knows how to play the piano... *(Now compatible with revised (c))*
  (e) genuine know-how has to be learnt by *practiced execution or simulation within the relevant domain*...
  (f) ...AlphaZero knows how to play chess in a sense *functionally equivalent* to a grandmaster...
  (g) a first-time poker player... doesn't thereby know how to play poker. *(Compatible with 'reliable' in (c))*

  This revision resolves the most critical tensions while preserving the core anti-intellectualist thrust and your key intuitions about the pianist, AlphaZero, and the poker novice. It makes your position more robust and internally consistent for the group's audit. Good luck!
