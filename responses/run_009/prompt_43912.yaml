prompt: |-
  I'm taking a seminar on decision theory, and we just covered the dollar auction and the sunk-cost literature, and I've been trying to work out what I actually believe by going through cases. Here are my verdicts. Walking out of a bad movie because I've already paid for the ticket: obviously irrational to stay. Leaving a slow queue after twenty minutes for a faster one next to it: also rational to switch, even though it feels like I'm throwing away the wait. A country continuing a war partly so that its dead will not have died in vain: irrational. But a startup founder who has sunk eight years into a struggling company and keeps going because each next round of funding still buys a real chance at a payoff: rational, or at least defensible. And the dollar auction itself is where I get confused: once I've bid ninety cents and someone bids a dollar, paying a dollar ten to avoid eating my ninety-cent loss looks justified at that moment — the incremental math is right there — yet I also think the whole pattern of bidding past the point where the pot is exhausted is the paradigm of an escalation trap, not a series of rational choices.

  My tentative principle is that escalation is irrational exactly when the only thing the next move has going for it is recovering or justifying what has already been sunk, and permissible when the next move has independent forward-looking value. But this seems to deliver the wrong verdict on the dollar auction, since the prospect of dodging my second-place loss is forward-looking in the moment, and it seems shaky on the founder too, since it's not clear her "independent" payoff isn't just the same avoidance motive dressed up. So my question is: is there a single principle that captures all of my verdicts, or close to it, and what does it say about the case I keep going back and forth on — a sixth-year PhD student with a mediocre dissertation who would need two more years, where each year seems marginally justified but the whole trajectory looks like a mistake? Please state the principle precisely, say which of my verdicts it cannot save and why, and tell me what consideration or argument would most plausibly change your verdict — that is, where your own reasoning here is most likely to go wrong.
reasoning: |-
  Okay, let me start by unpacking the user's dilemma. They're in a decision theory seminar, grappling with sunk costs across various scenarios. The core tension is between incremental rationality and overall irrationality in escalation traps. 

  First, I need to map their intuitive judgments: 
  - Walking out of a bad movie: rational (avoids further time waste)
  - Switching queues: rational (future time saved justifies past loss)
  - Continuing war for fallen soldiers: irrational (pure sunk-cost fallacy)
  - Startup founder persisting: defensible (if each round has independent EV+)
  - Dollar auction past $1: paradox (incrementally rational but collectively irrational)
  - PhD student dilemma: their unresolved case

  The user's proposed principle ("escalation okay only with independent forward value") works for most cases but fails dollar auctions and possibly the founder. Why? Because in dollar auctions, the "forward value" (avoiding loss) is psychologically real but structurally illusory - it's created by the auction rules themselves. 

  Hmm... the key insight might be about separable decision points versus path-dependent traps. In dollar auctions, each bid creates a new loss state for the next player, making the "forward value" endogenous to the bad decision path. Whereas for the startup, each funding round is a fresh EV calculation with exogenous market conditions. 

  For the PhD case, I'm noticing two hidden variables: 
  1) Opportunity costs compound non-linearly (2 years lost > 2x 1-year loss)
  2) The "mediocre dissertation" suggests low probabilistic upside

  My principle would flag the PhD as irrational if continuation relies on sunk effort rather than strong new evidence of thesis viability. But the user might be underestimating how sunk costs distort probability assessments - that sixth-year student likely overweights slim chances because of years invested. 

  The argument that could change my view: if the PhD student has high domain-specific human capital where quitting would destroy irreplaceable career value. But that seems rare in academia. 

  Wait - I should emphasize that all "forward values" must be net of emotional or reputational factors to count as rational. The founder's case only works if investors are paying for future prospects, not past losses. The moment recovery of sunk costs becomes part of the value proposition, it's fallacious. 

  For the dollar auction, the critical reframing is: when you've bid $0.90, you're not choosing between losing $0.90 or paying $1.10 - you're choosing between two negative outcomes in a game where all players are already doomed to sub-zero returns. The "avoid loss" motivation is fake because the loss only exists due to previous irrational bids. 

  Ultimately the unifying thread is separable decision theory: at each node, consider only future consequences, but only if those consequences exist independently of the sunk cost trap mechanism itself. This preserves the movie/queue judgments, condemns war/auctions, allows defensible startups, and condemns the PhD case absent extraordinary circumstances.
answer: |-
  Your intuitions align remarkably well with rational sunk-cost principles, but the dollar auction exposes a critical flaw in naive incrementalism. Here's a unified framework:

  **The Sunk-Cost Separability Principle:**  
  *Abandon a course of action if and only if the expected future costs exceed the expected future benefits, where:*  
  **(1) All sunk costs are excluded from the calculation**  
  **(2) "Future benefits" must derive from exogenous payoffs (not artifacts of the sunk-cost trap itself)**  
  **(3) Decision nodes are separable only when the choice architecture permits exit without triggering self-referential losses**

  ---

  ### **Application to Your Cases**  
  | **Case**                  | **Verdict** | **Principle's Explanation**                                                                 |
  |---------------------------|-------------|---------------------------------------------------------------------------------------------|
  | Bad movie                 | Rational    | Future enjoyment < future time cost. Sunk ticket price irrelevant.                          |
  | Queue switch              | Rational    | Future time saved > future time cost. Sunk wait irrelevant.                                 |
  | War for fallen soldiers   | Irrational  | Future benefits (justifying deaths) depend solely on sunk costs. Exogenous payoff absent.   |
  | Startup founder           | Defensible  | **IFF** future funding buys genuine market opportunity (exogenous payoff), not just loss avoidance. |
  | **Dollar auction above $1** | **Irrational** | *Violates (2) & (3):* The "benefit" (avoiding loss) is an artifact of the auction rules. Bidder is trapped in a self-created penalty structure. |
  | PhD student (standard case) | Irrational  | Future academic payoff likely < opportunity cost. "Finishing" benefit is endogenous to sunk cost trap. |

  ---

  ### **Why the Dollar Auction Fails Your Initial Principle**
  Your incremental math ($0.90 already lost → pay $1.10 to avoid loss) *seems* forward-looking but violates condition **(2)**. The "benefit" of avoiding loss:  
  - Exists **only because** you entered the auction  
  - Is **manufactured by the rules** (second-highest bidder loses)  
  - Has **no exogenous value** (unlike the startup's market opportunity)  

  This is a *self-referential trap*: the "forward" justification is circularly dependent on the sunk cost itself.

  ---

  ### **The PhD Student Case**
  **Verdict:** Typically irrational  
  - **Future costs:** 2 years opportunity cost + psychic toll  
  - **Future benefits:** Small ↑ in probability of academic job (median humanities PhD debt: $25k+; tenure-track roles: <20%)  
  - **Sunk costs:** 6 years irrelevant *except* as it creates psychological commitment  

  **Why it fails:** The "benefit" (obtaining the PhD) derives value primarily from justifying sunk effort (violating **condition 2**). True exogenous payoffs (e.g., non-academic jobs) are often better pursued without the degree.

  **Counterargument that could change my view:** If the student has *new evidence* of dissertation breakthrough potential (e.g., groundbreaking preliminary data, top journal interest), the future benefits become exogenous. But "mediocre dissertation" suggests this is unlikely.

  ---

  ### **Where My Reasoning Could Be Wrong**
  The **startup founder case** is the most vulnerable point:  
  - **Risk:** Misclassifying "loss avoidance" as exogenous opportunity.  
  - **Why it might hold:** Investors provide external validation. If VCs fund based on *future* NPV > investment, it satisfies condition (2).  
  - **Failure mode:** If the founder pursues funding primarily to validate past choices (vs. genuine market traction), it collapses into dollar-auction logic.

  **Strongest challenge:** Evolutionary psychology suggests "persistence instincts" conferred fitness advantages in ancestral environments. If sunk-cost biases are *ecologically rational* in iterated social contexts (e.g., maintaining coalitional credibility), strict economic rationality may misapply. Yet this doesn't rescue the dollar auction or PhD case—only explains their visceral pull.

  ---

  ### **Conclusion**
  Your core insight is correct: **Forward-looking value must be separable from the sunk-cost mechanism.** The dollar auction fails because its "benefits" are ontological byproducts of the trap. For the PhD: unless breakthrough evidence emerges, quitting is rational—the degree's value is largely spectral, made tangible only by the years already sacrificed. Escalation is justified solely when paying for a *new* lottery ticket, not when buying absolution for the last one.
