prompt: |-
  In discussions of deontological ethics — particularly around what I have seen called the paradox of deontology, where honoring a constraint (say, never intentionally killing an innocent) predictably results in more instances of the very thing constrained — I keep encountering a maneuver that I cannot find a name for, and I would like to know whether one exists.

  The defender of the constraint is shown that, by refusing to violate it once, they allow several violations by others to proceed. They do not respond by accepting the worse outcome as a cost worth bearing, and they do not give up the constraint. Instead, the constraint quietly changes logical character: it is no longer presented as a prohibition on what one may do, but as something more like an exemption from what may be demanded of one. The claim shifts from "I must not do this, whatever the cost" to "I am not required to do this, however good the results." Call the first reading a prohibition and the second a permission. Under the next round of pressure the position flips back: asked whether a third party may carry out the one-for-five trade, the defender reverts to the language of prohibition, as though the permission reading had never been offered. Both readings seem to be sincerely held at different moments, so it does not look like simple dishonesty; nor is it quite a motte-and-bailey, because the "weaker" reading is not obviously weaker — it can commit the defender to accepting a worse state of the world than the "stronger" reading would forbid bringing about.

  My question, then, is this. Is there an established term either for this oscillation itself or for the structural feature of the position that licenses it — the fact that a single deontological principle can be read either as a constraint on conduct or as a dispensation from sacrifice? If the nearest concepts in the literature are the constraint/permission distinction, the paradox of deontology, or the doctrine of doing and allowing, I want to know what exactly the oscillation adds beyond those: is it just an instability between them, or a further position in its own right? And if no established concept captures it, please coin one, define it precisely, and mark its boundaries — one clear case, one borderline case, and one case the new term should not be stretched to cover. I am not looking for a bare label; I want to know what the phenomenon is, what it is not, and where its edges lie.
reasoning: |-
  Okay, so the user is deep into deontological ethics, specifically the paradox of deontology. They've noticed this maneuver where defenders of constraints switch between treating the constraint as a prohibition and a permission depending on the scenario. They want to know if there's a term for this or if they need to coin one.

  First, I need to recall the paradox of deontology. It's when following a deontological constraint leads to worse outcomes. Like refusing to kill one innocent person, which allows five to die. The user describes the defender shifting from "I must not do X" to "I'm not required to prevent X" when challenged. Then, if asked if someone else can do it, they switch back to prohibition. 

  The user mentioned this isn't like motte-and-bailey because the permission isn't weaker; accepting worse outcomes might be harder. They want to know if there's a term for this oscillation or the underlying structure. 

  Looking at existing concepts: the constraint/permission distinction is part of it. The paradox itself is well-known. Doctrine of doing vs. allowing is related but not the same. The user is right that those don't capture the flip-flopping. 

  I recall Scheffler's "hybrid" theories and Nagel's "deontological immunity." Maybe "immunity" is key. The idea that agents have a protective barrier against being forced to violate constraints. That could explain why they switch: when acting, they claim immunity (permission not to sacrifice), but when judging others, they enforce the constraint (prohibition). 

  The term "deontic oscillation" comes to mind. But the structural feature might be "immunity-shielded constraint." The shield protects the agent from demands but still prohibits others. That structural feature allows the oscillation. 

  For coining a term, "immunity-shielded constraint" seems fitting. It captures the dual aspect. Then "immunity-triggered oscillation" for the shifting. 

  Now, defining it precisely: the constraint functions as a prohibition on others and a permission for oneself not to violate it, even to prevent violations. The oscillation happens when the defender switches based on context. 

  Clear case: The initial dilemma where the defender refuses to kill one to save five, invoking permission not to act. Then when asked if a third party can kill the one, they prohibit it. 

  Borderline case: A utilitarian who usually allows trade-offs but prohibits torture. When pressed, they might say they're not required to torture but don't prohibit others. But if they sometimes prohibit others, it's borderline for the oscillation. 

  Excluded case: Rule utilitarianism where rules are absolute but can be overridden in extreme cases. Here, the rule isn't a rigid constraint; it's more flexible, so no oscillation between distinct stances. 

  The user wants boundaries, so these examples should help. They're likely writing a paper or deep in philosophical debate, needing precise terminology to describe this maneuver. Their unspoken need might be to critique or defend deontology more effectively by naming this tactic. Coining a term gives them a tool for clearer discourse.
answer: |-
  Based on your precise description, the phenomenon you're identifying lacks a single, universally established term in the ethics literature. However, its core components are recognized, and the oscillation itself is a noted instability arising from the structure of agent-centered constraints. Here's a breakdown:

  1.  **The Established Concepts & Why They Aren't Sufficient:**
      *   **The Paradox of Deontology:** This *is* the core problem (refusing to violate a constraint leads to more violations). Your phenomenon is a specific *response strategy* to this paradox.
      *   **Constraint vs. Permission Distinction:** This *is* the conceptual duality being exploited (prohibition on acting vs. exemption from being required to act). The oscillation *is* the shifting between these two interpretations.
      *   **Doctrine of Doing and Allowing (DDA):** This is related but distinct. DDA claims there's a morally significant difference between actively causing harm and merely allowing it to happen. While the "permission" reading often leverages allowing, the oscillation involves a *reinterpretation of the constraint itself* (prohibition vs. personal exemption), not just the act/allow distinction. One could oscillate without strictly relying on DDA.
      *   **Agent-Centered Prerogatives (Scheffler):** Scheffler introduced these as *permissions* for agents to give *some* priority to their own projects/values over maximizing the good. This is close to the "permission" reading, but Schefflerian prerogatives are usually *weaker* and explicitly *not* constraints (they don't prohibit others from forcing the sacrifice). The oscillation relies on the *same principle* functioning *both* as a constraint (prohibiting others) and a strong prerogative (exempting oneself).
      *   **Deontological "Immunity" (Nagel):** Nagel described constraints as granting persons a kind of "inviolability" or "immunity" against being used or sacrificed. This *structural feature* is key to licensing the oscillation.

  2.  **Naming the Phenomenon:**
      *   **The Structural Feature Licensing the Oscillation:** This is best described as **"Immunity-Shielded Constraint"** or **"Personal Exemption-Embedded Constraint."** The core idea is that the deontological principle inherently combines two elements:
          1.  A **prohibition** against performing a certain type of action (e.g., killing an innocent).
          2.  A **personal exemption/immunity** for the agent against being morally *required* to violate that prohibition, even to prevent *others* from performing that same prohibited action (or worse consequences overall). This immunity shields the agent from the demand to sacrifice their own adherence to the constraint.
      *   **The Oscillation Itself:** This can be termed **"Immunity-Triggered Oscillation"** or **"Constraint/Exemption Switching."** It's the tactical shifting in rhetoric and emphasis between the prohibition aspect (especially when judging *others'* potential actions) and the exemption/immunity aspect (when defending *one's own* inaction leading to a worse outcome).

  3.  **Defining "Immunity-Shielded Constraint" (The Structural Feature):**
      *   **Precise Definition:** A deontological principle functions as an Immunity-Shielded Constraint when it possesses the following dual character:
          1.  **Constraint Aspect:** It imposes a categorical prohibition on agents performing a specific type of action (Type-X), irrespective of good consequences that might flow from performing it or bad consequences that might flow from refraining.
          2.  **Immunity Aspect:** It simultaneously grants each agent a strong exemption or immunity against any moral requirement to *perform* a Type-X action *even when* refraining predictably leads to (a) *other agents* performing *more* Type-X actions, or (b) a *worse overall state of affairs* involving more Type-X occurrences or other significant harms. This immunity protects the agent from the instrumental demand to violate the constraint themselves.
      *   **Boundary Marking:**
          *   **Clear Case:** The classic "kill one to save five" scenario. The constraint prohibits *me* from killing the one innocent. When challenged that my refusal *allows* five to be killed by others (or circumstances), I invoke the immunity: "I am not morally *required* to murder an innocent person, even to prevent five murders." When asked if a *third party* (e.g., a utilitarian agent) may kill the one to save five, I revert to the constraint: "No, murdering an innocent is absolutely prohibited."
          *   **Borderline Case:** A prohibition on torture. I refuse to torture a suspect to potentially gain information preventing a bomb from killing hundreds (invoking immunity: "I am not required to torture"). I condemn a third party who *does* torture the suspect for the same reason (invoking constraint: "Torture is absolutely wrong"). This fits if the defender consistently applies both aspects. It becomes borderline if the defender argues torture is *sometimes* permissible for others in extreme cases but *never* for themselves personally – this weakens the universal constraint aspect.
          *   **Excluded Case (Should Not Cover):** **Rule Utilitarianism.** A rule utilitarian might adhere strictly to "Never kill an innocent" because following this rule generally maximizes utility. However, if faced with an *extreme* catastrophe only avertable by killing one innocent, they *might* (depending on the version) allow overriding the rule. Crucially, they do *not* claim an *exemption* or *immunity* based on personal inviolability; they are appealing to a deeper consequentialist calculus overriding a generally useful rule. The prohibition isn't fundamentally "immunity-shielded"; it's a rule of thumb subject to optimization. The oscillation between "prohibition for others" and "exemption for me" doesn't occur in the same structural way.

  4.  **What the Oscillation Adds:**
      The oscillation is *not* a further distinct ethical position. It is the **pragmatic manifestation of the inherent tension within the Immunity-Shielded Constraint structure when confronted by the Paradox of Deontology.** When pressed on *personal inaction* leading to worse outcomes, the immunity aspect is foregrounded ("I cannot be *required* to commit murder"). When the focus shifts to *others' actions* or the *objective status* of the act, the constraint aspect is foregrounded ("Murder is absolutely forbidden"). The structure *licenses* this shift because the principle *already* contains both elements. The oscillation reveals an **instability** or **context-dependence** in how the defender articulates the *same underlying principle* depending on whether the pressure is on their *own obligation to act* or on the *moral status of the act itself*.

  **In summary:**

  *   **Structural Feature:** **Immunity-Shielded Constraint** (combines categorical prohibition with personal exemption from being required to violate it to prevent worse outcomes/others' violations).
  *   **Oscillation:** **Immunity-Triggered Oscillation** or **Constraint/Exemption Switching** (the tactical shift in emphasis between the prohibition and immunity aspects of the principle, driven by context: defending personal inaction vs. judging others' actions).
  *   **Relationship:** The oscillation is a symptom of the Immunity-Shielded Constraint structure under pressure from the Paradox of Deontology. It exploits the dual nature inherent in the principle.

  This terminology captures the specific duality you identified and distinguishes it from related concepts like Scheffler's prerogatives (which lack the strong constraint aspect) or simple rule utilitarianism (which lacks the immunity/exemption grounded in personal inviolability).
