prompt: |-
  I've got a bunch of scattered verdicts about when you can know something is beautiful on someone else's say-so, and I'm wondering if there's one principle behind them. If a friend whose taste tracks mine says a film is great, I feel fine trusting her that it's worth seeing, but I'd stop short of saying I *know* it's great before watching it myself. If a wine critic I trust says a bottle is excellent, though, I'm honestly inclined to say I know it's excellent even though I couldn't pick out why in a blind tasting. If a poll of ten thousand people says a painting is beautiful, I feel like that gives me almost nothing, aesthetically speaking. And if someone describes a novel so vividly — the imagery, the pacing, the ending — that I can kind of simulate what reading it is like, that feels closer to knowing it's beautiful than the bare verdict did, even though it's still testimony. Meanwhile my gut says hearing secondhand that a joke is funny doesn't make me know it's funny at all — I have to actually laugh. So: is there a principle that fits all of these? The wine one and the film one look basically the same to me but I keep giving opposite answers, so something has to give. Tell me what principle (or maybe two rival principles) captures the pattern, what it says about the poll case or the vivid-description case, and which verdict you'd overturn if needed. Please keep it under 300 words, and flag where you're least confident.
reasoning: |-
  Okay, the user is wrestling with different scenarios where they might accept someone else's judgment about beauty or aesthetic value. They've presented several cases: trusting a friend about a film but not claiming knowledge, accepting a wine critic's opinion as knowledge, dismissing a large poll about a painting, valuing vivid descriptions of a novel, and insisting on firsthand experience for jokes. The challenge is to find a unifying principle behind these varied responses.

  The key tension is between the film and wine examples - seemingly similar cases where the user draws opposite conclusions. This suggests aesthetics might involve multiple types of knowledge. For wine, the critic likely has specialized expertise that the user trusts completely regarding objective qualities (balance, complexity etc.), making it feel like propositional knowledge ("this wine is excellent"). The film friend shares taste but beauty here seems more subjective - knowing about it versus experiencing it firsthand.

  The other cases support this distinction: polls lack any expertise or personal resonance; vivid descriptions enable simulated experience; jokes absolutely require the lived reaction. The poll case shows that mass opinion without expertise or personal connection carries little weight. The description case bridges testimony and experience by allowing mental simulation.

  The principle could be that testimonial knowledge requires either domain expertise (for more objective qualities) or simulated/firsthand experience (for subjective impact). In the film case, the user is right to hesitate - they might know it's acclaimed but not that it's beautiful to them until experienced. The joke example confirms some aesthetic responses resist testimony entirely. The wine case might need reframing: perhaps they know it's excellent by expert standards, but not that they'll personally find it beautiful until tasting.

  Least confident about whether vivid descriptions truly bridge the gap - does mental simulation equate to aesthetic experience? Probably not fully, but it's closer than bare testimony. The core insight remains: aesthetic judgment blends verifiable properties and irreducibly personal experience.
answer: |-
  Here's a principle capturing the pattern:

  **Aesthetic knowledge via testimony requires either (1) trust in specific expertise about *verifiable properties* or (2) the ability to *simulate the experience* sufficiently.**

  *   **Wine Critic (Fit):** You accept knowledge because you trust the critic's *expertise in objectively discernible properties* (balance, structure, typicity). These are potentially verifiable, even if you personally lack the skill. You know it *possesses qualities experts deem excellent*.
  *   **Film Friend (Doesn't Fit - Overturn?):** Your hesitation is correct if "beautiful" means *your personal experience*. Trusting her taste gives strong reason to believe you'll *find* it beautiful, but you don't *know* the experiential quality *for you* until you watch it. Knowing it's *likely* good ≠ knowing its beauty *for you* experientially.
  *   **Poll (Fit):** Mass opinion lacks specific expertise or simulation. It tells you about popularity, not verifiable aesthetic properties or your potential experience. Gives almost nothing for *aesthetic knowledge*.
  *   **Vivid Description (Fit):** The description allows you to *simulate key aspects of the experience* (imagery, pacing). This bridges the gap toward knowing its beauty, as it activates your own aesthetic sense internally, approximating firsthand judgment.
  *   **Joke (Fit):** Humor's impact is highly experiential and immediate. Testimony cannot simulate the surprise/release mechanism effectively. You *must* experience the laugh to *know* it's funny *for you*.

  **What gives?** The Film and Wine cases differ in the *type* of aesthetic property claimed:
  *   Wine: Knowledge of *expert-judged quality* (verifiable properties).
  *   Film: Knowledge of *personal experiential beauty* (subjective impact).
  Your gut treats "excellent" (wine) as an expert-verifiable property but "great" (film) as inherently experiential. You *can* know via testimony that something *possesses qualities deemed aesthetically excellent by relevant experts*. You *cannot* know via testimony the *subjective experiential impact* ("beauty," "funny") it will have *on you* – that requires simulation or experience.

  **Least confident:** Whether the "simulation" in the vivid description case truly constitutes *knowledge* of beauty, or merely a very strong, well-founded belief approaching knowledge. Is simulated experience robust enough for knowledge?
