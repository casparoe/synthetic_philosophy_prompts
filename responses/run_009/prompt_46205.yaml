  **Key Corrections Explained:**

  1.  **Determinism-Independence:** Your professor is right. Strawson's regress applies equally to determinist and indeterminist universes. If choices were random, *you* still wouldn't be their *ultimate* author. Your friend fundamentally mislocates the source of the problem.
  2.  **Scope of "Responsibility":** Strawson targets a specific, hyper-demanding ("true," "ultimate") philosophical notion of responsibility. He doesn't claim practical, legal, or psychological responsibility vanishes. Your friend overgeneralizes.
  3.  **The Practical Conclusion:** This is the biggest error. Strawson (in "Freedom and Resentment") famously argues we *cannot* and *should not try* to abandon our "reactive attitudes" (resentment, gratitude, blame, praise) based on this argument. These attitudes are constitutive of human relationships. The Basic Argument shows why the *philosophical justification* for these practices (requiring ultimate responsibility) fails, not that the practices themselves are invalid or irrational. His conclusion is *not* prescriptive ("stop holding people responsible"); it's diagnostic ("the quest for ultimate justification is misguided").
  4.  **Not Just Hard Determinism:** While sharing the "no free will" conclusion with hard determinism, Strawson's route is different and his implications for practice are diametrically opposed.

  **Use this at dinner:** Lead with the determinism-independence point—it instantly shows your friend missed the argument's structure. Then emphasize that Strawson explicitly *defends* the rationality of resentment/punishment *despite* his argument proving ultimate responsibility impossible. That’s the real philosophical punchline.
