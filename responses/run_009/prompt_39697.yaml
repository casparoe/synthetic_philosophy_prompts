answer: |-
  You rightly identify the core tension: if my reasoning is degraded, why trust *any* judgment, including the higher-order one? But here's the distinction: the *content* of the higher-order evidence (the drug label's claim about its statistically verified effects) is independent of my current cognitive state. While my impaired brain *accesses* this evidence, its evidential force derives from external, pre-impairement scientific validation of the drug's typical impact. The label tells me "In cases like yours, arithmetic reliability drops," and this fact stands regardless of whether *my specific act* of reading it is flawed. Your degraded reasoning might affect *how* you weigh this evidence, but it doesn't negate its objective status as strong statistical evidence against the reliability of your arithmetic output. The meta-level doesn’t "automatically win" — it wins because the higher-order evidence is *stronger* evidence about the arithmetic’s trustworthiness than the arithmetic intuition itself under these conditions. Concede: if the drug degraded *all* cognition equally, including reading comprehension, we'd be truly stuck—but your scenario specifies it targets "exactly this kind of calculation," preserving the asymmetric reliability needed. Your move.
