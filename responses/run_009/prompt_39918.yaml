prompt: |-
  I help decide which technical safety directions get funded at a frontier lab. Nearly every pitch I hear reduces to the same promise — this line of work will shrink or eliminate the alignment tax — but each pitch quietly means something different by "the tax," and I've stopped trusting any of them until I know what an elimination claim would actually have to deliver. So write me the spec before I read another proposal.

  The setting to assume: a single developer, no binding international agreement, competitors (other frontier labs and open-weight efforts) at most a few months behind, and decisions made now about research bets that pay off over years. Adequacy is relative to that setting — a proposal only needs to be good enough to be worth funding under those conditions, not to solve the problem for all time. By the alignment tax I mean, roughly, whatever a developer gives up — capability, speed, efficiency, time — to deploy a safe system where it could have deployed a more capable unsafe one; the competitiveness constraint is the pressure that makes paying that tax fatal.

  Write the desiderata any adequate alignment-tax-reduction proposal must meet: which costs it must actually be reducing (deployment-time capability, inference efficiency, development velocity, time-to-threshold — a proposal that quotes a zero tax without saying which of these it means is quoting an average over different questions); which counterfactual the comparison is against (the same lab without the safety work, the nearest competitor without it, or an open-weight release — these can give different signs for the same investment); and which incentives it leaves intact rather than merely rerouting. For each requirement, give the case behind it. Then mark which requirements are non-negotiable and which are preferences of one camp — in particular, adjudicate whether "must not rely on coordination" is a genuine desideratum or just the technical camp's prejudice, given that any mechanism whose effect runs through competitors' behavior is arguably a coordination scheme wearing a technical hat. Flag any pair of desiderata you suspect can't be jointly satisfied; if you think some subset is jointly unsatisfiable in principle (say, because a tax that is invisible at current capability levels but grows steeply past a threshold cannot be both measured and held to zero), say so explicitly — that result would itself change the funding decision.

  Two ideas I want you to take a position on rather than assume: (1) whether the tax should be quoted per capability level, since a safety cost that only bites above roughly human-level performance in the relevant domain is a different animal from one that bites now; (2) the second-best question — whether a proposal can count as adequate while leaving a real tax, provided the tax is smaller than the risk discount competitors assign to catastrophic outcomes, or whether adequacy requires the tax to be near zero on its own terms.

  Finally, score these three approaches briefly against your own list, flagging where the list does the eliminating: (a) safety-as-capability — the bet that alignment techniques, scaled up, improve product performance enough to pay for themselves, the claim sometimes made about RLHF-era methods; (b) bottlenecking at deployment — race on development, gate only the release of the most capable checkpoints, accepting a tax concentrated at the end; (c) provision — an actor with compute and talent deliberately releasing safe, near-frontier models at subsidized cost to undercut the market for unsafe ones. Keep the weight on the criteria; the scorecard should take less than a quarter of your answer.
reasoning: |-
  We are writing a specification for what it means for an alignment tax reduction proposal to be adequate in the given setting. The setting is characterized by:

  - A single developer (lab) making decisions.
  - No binding international agreement.
  - Competitors (other frontier labs and open-weight efforts) at most a few months behind.
  - Research bets that pay off over years.

  The alignment tax is defined as what a developer gives up (capability, speed, efficiency, time) to deploy a safe system instead of a more capable unsafe one, under competitive pressure.

  We must specify:

  1. **Which costs must be reduced?** We need to break down the tax into components (deployment-time capability, inference efficiency, development velocity, time-to-threshold) and require that the proposal specifies which one(s) it addresses.

  2. **Which counterfactual?** The comparison baseline must be specified: same lab without safety work, nearest competitor without safety, or open-weight release.

  3. **Incentives:** The proposal must not merely reroute the tax (e.g., by shifting the burden to a different point in time or to a different actor) but actually reduce it in a way that leaves the incentives for safe deployment intact.

  Furthermore, we must address:

  - **Non-negotiable vs. preferences:** Which requirements are absolute and which are camp-specific?
  - **Coordination:** Is "must not rely on coordination" a genuine desideratum or a prejudice?
  - **Potential incompatibilities:** Are there pairs of desiderata that cannot be jointly satisfied?

  We also take positions on:

  1. **Per capability level:** Should the tax be quoted per capability level?
  2. **Second-best:** Can a proposal be adequate if the tax is non-zero but smaller than the risk discount competitors assign to catastrophic outcomes?

  Finally, we briefly score three approaches against the criteria.

  ---

  **Desiderata for an Adequate Alignment Tax Reduction Proposal**

  1. **Explicit Cost Specification (Non-negotiable)**
     - The proposal must explicitly state which component(s) of the tax it reduces: deployment-time capability (the maximum capability achievable at deployment time), inference efficiency (e.g., FLOPs per token), development velocity (how quickly the model can be developed and improved), or time-to-threshold (the time taken to reach a capability threshold).
     - **Case**: Without this, a claim of "zero tax" is meaningless. Different components matter differently: a tax on inference efficiency might be acceptable if it is small and hardware improves, but a tax on time-to-threshold might be fatal in a race.

  2. **Counterfactual Clarity (Non-negotiable)**
     - The proposal must specify the counterfactual baseline: 
       - (a) The same lab without the safety work (internal baseline), 
       - (b) The nearest competitor without the safety work (competitive baseline), or 
       - (c) An open-weight release that would otherwise dominate the market.
     - **Case**: The tax is relative. A technique that reduces the tax relative to the internal baseline might still leave the lab behind a competitor. Conversely, a technique that is better than an open-weight release might be competitive even if it loses to a competitor without safety.

  3. **Incentive Compatibility (Non-negotiable)**
     - The reduction must not merely shift the tax to a different time, actor, or form (e.g., by delaying the tax to post-deployment, which might lead to corner-cutting later, or by requiring ongoing costs that are likely to be abandoned under pressure). The incentives for the developer to maintain safety throughout the deployment and scaling must remain intact.
     - **Case**: If the tax is rerouted, the developer might still face the same competitive pressure at a later stage, leading to abandonment of safety. This is especially critical in a multi-year payoff.

  4. **Independence from Coordination (Preference, but contextually non-negotiable)**
     - The proposal must not rely on coordination (explicit or implicit) with competitors to be effective. However, note that in the given setting (no binding agreements, competitors close behind) coordination is unlikely to be stable. Therefore, we consider this non-negotiable in practice.
     - **Case**: Any mechanism that depends on competitors' behavior (e.g., them also adopting the same safety measure) is a coordination scheme. Since we cannot rely on coordination in a competitive and non-cooperative setting, such proposals are inadequate. This is not a prejudice but a consequence of the setting.

  5. **Capability-Level Specificity (Non-negotiable)**
     - The tax reduction must be evaluated at the capability level relevant to the deployment. A proposal must state the capability level(s) at which the tax is reduced and show that the reduction holds at least up to the next major threshold (e.g., human-level in the domain). 
     - **Case**: A tax that is zero at current levels but becomes prohibitive at higher capabilities is not a reduction. The proposal must demonstrate that the tax does not grow steeply at higher capabilities (or if it does, that the deployment does not require those levels).

  6. **Robustness to Scaling (Non-negotiable)**
     - The tax reduction must not be a result that only holds at small scale or for current models, but must be robust to scaling up to at least the next major capability jump (e.g., models that are substantially more capable than current ones). 
     - **Case**: Research bets pay off over years, so the proposal must remain valid as models scale.

  7. **Handling of the Second-Best Question (Preference, but we take a position)**
     - We take the position that a proposal can be adequate even if it leaves a non-zero tax, provided that the residual tax is smaller than the risk discount that competitors assign to catastrophic outcomes. However, the proposal must then provide evidence that competitors do indeed discount catastrophic risk by at least that amount, and that this discount is stable under competitive pressure.
     - **Case**: In a competitive market, if the tax is less than the value of avoiding catastrophe (as perceived by the market), then safe systems can be competitive. But note: if competitors do not internalize the catastrophic risk (e.g., because they are myopic or because the risk is externalized), then this does not hold. Therefore, this is a weaker form of adequacy and requires additional evidence.

  **Potential Incompatibilities**

  - **Incentive Compatibility vs. Second-Best**: If we allow a non-zero tax that is smaller than the risk discount (second-best), it might create an incentive to cut corners if the risk discount is not perfectly internalized. This could violate incentive compatibility. Therefore, these two might be in tension: a proposal that relies on second-best must show that the incentives remain aligned.
    
  - **Independence from Coordination vs. Provision Approach**: The provision approach (c) inherently relies on the releasing actor to undercut the market, which might require coordination (or at least a lack of competitive response) to be effective. Therefore, it might fail the independence requirement.

  **Taking Positions on the Two Ideas**

  1. **Per Capability Level**: Yes, the tax must be quoted per capability level. A tax that only bites above human-level is acceptable only if the deployment does not require capabilities above human-level in the near term. But for long-term bets, we require that the tax does not grow prohibitively at higher capabilities. Therefore, we require per-level evaluation.

  2. **Second-Best Question**: We accept that a proposal can be adequate with a non-zero tax if it is below the risk discount, but with the strong caveat that the proposal must prove the stability and magnitude of that discount. However, in the absence of such evidence, we default to requiring the tax to be near zero on its own terms.

  **Scoring the Three Approaches**

  We use the desiderata to score:

  (a) **Safety-as-capability** (e.g., RLHF improving product performance)
     - **Explicit Cost**: Often targets deployment-time capability and development velocity (by making models easier to use). But may not address inference efficiency.
     - **Counterfactual**: Typically compares to the same lab without safety (internal). But does it beat a competitor without safety? Unclear.
     - **Incentive Compatibility**: If safety and capability are aligned, incentives remain. But if at higher capabilities they diverge, this may break down.
     - **Coordination Independence**: Yes, it's a technical improvement that doesn't rely on others.
     - **Capability-Level**: May break at higher capabilities (e.g., if misalignment emerges). Not robustly shown.
     - **Robustness to Scaling**: Unproven; RLHF-like methods might not scale.
     - **Second-Best**: Not applicable because it claims zero tax. But if it fails at scale, the tax may reappear.
     - **Verdict**: Fails on robustness to scaling and capability-level specificity unless proven otherwise.

  (b) **Bottlenecking at deployment**
     - **Explicit Cost**: Reduces tax by concentrating it at deployment (time-to-threshold and deployment-time capability). But the tax at deployment must be paid.
     - **Counterfactual**: Compares to a scenario without the gate (internal). But the competitor might not gate, so the tax might make you slower to deploy.
     - **Incentive Compatibility**: The tax is concentrated at a high-pressure moment (deployment), creating an incentive to remove the gate. Not incentive compatible.
     - **Coordination Independence**: Yes, it's an internal gate.
     - **Capability-Level**: The tax might be acceptable at lower capabilities but become too high at higher ones (if gating becomes harder). Not evaluated per level.
     - **Robustness to Scaling**: As capabilities grow, the gate might become more costly (e.g., if safety assurances take longer). Not robust.
     - **Second-Best**: The tax might be high, but if it's less than the risk discount, it could work. But the incentive issue remains.
     - **Verdict**: Fails incentive compatibility and possibly robustness.

  (c) **Provision** (subsidized safe models)
     - **Explicit Cost**: Aims to reduce the tax by making safe models cheaper (inference efficiency and deployment cost). But the subsidy might be a cost to the provider.
     - **Counterfactual**: Compares to the market without provision (competitive baseline). But the provider pays the subsidy, so it's a tax on them.
     - **Incentive Compatibility**: The provider must sustain the subsidy. Under competitive pressure, they might not. Not incentive compatible for the provider.
     - **Coordination Independence**: No, it relies on the provider's action and the market response. Competitors might respond by lowering prices or releasing unsafe models. It also requires that the provider remains committed, which might not hold.
     - **Capability-Level**: The subsidy might work at current levels but become prohibitively expensive at higher capabilities.
     - **Robustness to Scaling**: As models get more expensive to train and run, subsidies may become unsustainable.
     - **Second-Best**: The subsidy might make the safe model cheaper than the unsafe one, but if the subsidy cost is high, it might not be sustainable.
     - **Verdict**: Fails coordination independence and incentive compatibility.

  **Conclusion on the Approaches**: All three approaches have significant shortcomings against the criteria. None clearly passes all non-negotiable requirements. Safety-as-capability might be the most promising if it can prove scalability, but currently, it does not.

  **Final Note**: The non-negotiable requirements (1-5 and 6) are stringent. Given the setting, we must be cautious. A proposal that does not meet all non-negotiables should not be funded.
answer: |-
  ### Desiderata for Alignment-Tax-Reduction Proposals  
  Below, I define the core requirements any adequate proposal must meet. **Non-negotiable criteria** are essential for realistic deployment in your setting; **preferences** reflect camp-specific biases but remain important for robustness. I explicitly flag tensions and adjudicate key debates.  

  ---

  #### **1. Explicit Cost Specification** (Non-negotiable)  
  **Requirement**: Proposals must quantify *which* cost component is reduced:  
  - **Deployment-time capability** (e.g., model performance at release),  
  - **Inference efficiency** (e.g., FLOPs/token, memory overhead),  
  - **Development velocity** (e.g., iterations/week),  
  - **Time-to-threshold** (e.g., months to reach human-level coding).  
  **Case**: Competitive dynamics punish different costs asymmetrically. A 10% inference tax might be tolerable if hardware advances annually; a 6-month delay in time-to-threshold could cede the market. Proposals quoting "zero tax" without specificity average over incommensurables, hiding fatal weaknesses.  

  #### **2. Defined Counterfactual** (Non-negotiable)  
  **Requirement**: Proposals must state the baseline comparison:  
  - **Internal baseline**: Same lab without safety work,  
  - **Competitor baseline**: Nearest rival without safety (assuming they advance unimpeded),  
  - **Open-weight baseline**: Public models at similar capability.  
  **Case**: A tax "reduction" against an internal baseline (e.g., safer training speeds up debugging) may still leave you behind competitors. If the counterfactual is open-weight models, but competitors deploy uncensored models 3 months sooner, the tax persists.  

  #### **3. Incentive Preservation, Not Rerouting** (Non-negotiable)  
  **Requirement**: Solutions must not shift costs to:  
  - A *different actor* (e.g., users bear compute costs),  
  - A *later timeframe* (e.g., deferred safety checks risking post-deployment failures),  
  - A *hidden form* (e.g., technical debt exploding at scale).  
  **Case**: Rerouting incentivizes corner-cutting under pressure. Example: A deployment-time "bottleneck" (e.g., runtime monitors) may reduce development tax but collapse if competitors force faster release cycles.  

  #### **4. Independence from Coordination** (Non-negotiable)  
  **Requirement**: Proposals must *not* rely on competitors adopting similar measures, sharing tools, or honoring informal agreements.  
  **Case**: In your setting (no binding agreements, rivals months behind), coordination is unstable. A technique requiring industry-wide standardization (e.g., common safety protocols) fails when a single defector undercuts others. **Adjudication**: This is a genuine desideratum, not prejudice—your competitors’ self-interest ensures non-cooperation. "Coordination via technical means" (e.g., watermarking) only works if universally enforced; otherwise, it’s a tax.  

  #### **5. Capability-Level Transparency** (Non-negotiable)  
  **Requirement**: Tax claims must specify capability thresholds (e.g., "tax negligible below human-level reasoning, manageable up to expert-level").  
  **Case**: A tax that vanishes at GPT-4 levels but reappears at superhuman reasoning is inadequate. Proposals must demonstrate scalability beyond current SOTA. Example: RLHF reduces tax now but may fail catastrophically for misaligned agents smarter than humans.  

  #### **6. Sustainability Under Scaling** (Non-negotiable)  
  **Requirement**: Gains must hold for:  
  - Model sizes/scaling laws 10× current,  
  - Multi-year R&D cycles,  
  - Shifts in architecture (e.g., from transformers to state-space models).  
  **Case**: Techniques that reduce tax for diffusion models but break for next-gen architectures (e.g., speculative decoding) waste resources.  

  #### **7. Second-Best Adequacy** (Preference, but contextually vital)  
  **Requirement**: Proposals *may* claim adequacy with a non-zero tax if:  
  - The residual tax is less than competitors’ "risk discount" for catastrophe (e.g., 5% performance penalty vs. rivals’ 10% probability discount on doom),  
  - AND they empirically validate competitors’ discount rates.  
  **Case**: In a race, if rivals ignore safety, a 3% capability tax might still let you win if customers value reliability. But this is fragile—**default to near-zero tax** unless evidence shows rivals’ risk tolerance is stable and quantifiable.  

  ---

  ### **Tensions and Impossibilities**  
  - **Incentive Preservation vs. Second-Best**: If a proposal relies on rivals’ risk discount (Second-Best), it violates **Independence from Coordination** by depending on their behavior.  
  - **Capability Transparency vs. Measurement Feasibility**: Proposals claiming "no tax until superhuman" cannot be verified until post-deployment, creating a moral hazard.  
  - **Joint Incompatibility Proven**: A tax that is *invisible now but steeply increasing past a threshold* cannot satisfy both **Capability-Level Transparency** (requires forecasting) and **Sustainability Under Scaling** (requires robustness). Such proposals are unfundable.  

  ---

  ### **Scoring Example Approaches**  
  *(<25% of response; weights on criteria)*  

  1. **Safety-as-Capability** (e.g., RLHF improving usability):  
     - ✅ **Explicit Cost**: Targets development velocity (faster iteration) and deployment capability (better UX).  
     - ❌ **Counterfactual**: Compares to internal baseline; ignores that competitors skipping safety may achieve higher raw performance.  
     - ❌ **Capability Transparency**: Gains may reverse at superhuman levels (e.g., sycophancy).  
     - ❌ **Sustainability**: RLHF-like methods degrade with scale (e.g., reward hacking).  
     - **Verdict**: Fails non-negotiables—**reject**.  

  2. **Bottlenecking at Deployment** (e.g., gating deployment with safety checks):  
     - ✅ **Explicit Cost**: Reduces development tax (race unrestrained) but admits deployment-time tax.  
     - ✅ **Counterfactual**: Clear against internal baseline.  
     - ❌ **Incentive Preservation**: Deployment tax creates pressure to bypass checks; reroutes risk to users.  
     - ❌ **Coordination Independence**: Fails if competitors deploy unsafe models earlier, forcing you to lift the gate.  
     - **Verdict**: Fails incentives and coordination—**reject**.  

  3. **Provision** (e.g., subsidized safe models):  
     - ✅ **Explicit Cost**: Targets inference efficiency (subsidies offset compute tax).  
     - ❌ **Counterfactual**: Assumes open-weight baseline; competitors may release cheaper unsafe models.  
     - ❌ **Coordination Independence**: Requires market dynamics to favor safe models—fragile to a single competitor flooding the market.  
     - ❌ **Incentive Preservation**: Subsidy costs may become unsustainable, rerouting tax to taxpayers or investors.  
     - **Verdict**: Fails coordination and incentives—**reject**.  

  ---

  ### **Key Takeaways**  
  - **Non-negotiables dominate**: All three proposals fail at least two. Prioritize **Explicit Cost**, **Counterfactual Clarity**, **Incentive Preservation**, and **Coordination Independence**.  
  - **Capability thresholds are critical**: Assume the tax must be near-zero up to at least superhuman levels—anything less invites black swans.  
  - **Second-best is risky**: Only fund if residual tax is *proven* lower than competitors’ risk discount, but treat this as a stopgap.  
  - **Avoid "magical scaling"**: Reject proposals that handwave scalability (e.g., "assumes future techniques will mitigate tax").  

  Fund proposals that: (1) specify costs against competitor baselines, (2) eliminate taxes without shifting burdens, (3) work unilaterally, and (4) prove scalability. Everything else is noise.
