prompt: |-
  My distributive justice seminar has been on luck egalitarianism for two weeks now, and the prof keeps repeating 'compensate for bad luck, but not bad choices' like it's just obviously the principle of justice, most recently to argue that a smoker with lung cancer who grew up with chain-smoking parents in a poor neighborhood has no special claim on resources beyond what everyone else gets. That rubbed a lot of us the wrong way, but nobody could pin down exactly which part of the slogan was doing the work. The more I turn it over the less clear it is what the sentence even claims: 'bad luck' could mean brute luck in Dworkin's sense, or anything not traceable to a choice at all, or anything you couldn't reasonably have avoided, and 'choice' could mean a genuine exercise of agency, or voluntary acceptance of a known risk, or merely absence of coercion, and 'compensate' could mean cash transfers to a target level, or holding people above some threshold, or something much weaker like only removing disadvantages that are nobody's fault without ever making payouts depend on fault.

  Can you lay out the distinct precise principles that one sentence could stand for, from readings weak enough to be near-truisms to the strong ones that actually would deny the smoker extra resources, and for each say whether it's plausible, whether it's genuinely egalitarian or just a responsibility principle wearing egalitarian clothes, and whether it gets my professor her conclusion about the smoker? Also worth addressing: is the choice/luck cut even supposed to be a clean binary, or more like a spectrum with things like addiction and childhood-formed preferences in the middle, and what's the standard objection to the strong readings supposed to be — I vaguely remember a hypothetical about a reckless driver but not why it bites. Lay it out as a list I can bring to section so I can actually push back next week instead of just feeling like something's off.
