answer: |-
  Here's a decision tree designed to sort students based on their concrete intuitions about punishment cases, avoiding theory labels at branch points. It addresses your key fault lines and aims for distinct leaves while flagging convergence and unstable positions.

  **The Decision Tree: When is State-Inflicted Harm on the Convicted OK?**

  1.  **Start:** The state deliberately harms a person convicted of a crime. When, if ever, is this justified?
      *   **A: Never justified under any circumstances.** → **Leaf 1: Abolitionism** (State punishment is inherently immoral).
      *   **B: Sometimes justified under specific conditions.** → Go to Question 2.

  2.  **Question 2:** Suppose someone *truly deserves* to suffer for their crime. Does that fact *alone* give the state a sufficient reason to punish them, even if it produces *no* other good consequences (like deterring others, rehabilitating them, etc.)?
      *   **A: Yes, deserving to suffer is reason enough by itself.** → Go to Question 3.
      *   **B: No, deserving to suffer is not enough by itself. Punishment needs some further purpose or benefit.** → Go to Question 4.

  3.  **Question 3 (For A on Q2):** A person commits a serious violent crime, but it isn't discovered until 50 years later. They are now a completely different person – reformed, remorseful, and leading a blameless life. Does the fact they *deserved* punishment for the original crime mean the state *must still punish* them now?
      *   **A: Yes, the past desert still demands punishment, regardless of who they are now.** → **Leaf 2: Pure Retributivism** (Punishment is justified *only* because it is deserved; desert determines *both* liability to punish *and* the amount).
      *   **B: No, punishing them now seems pointless or even cruel. The desert 'expired'.** → **Leaf 3: Threshold Retributivism / Time-Limited Desert** (Desert is necessary to *license* punishment initially, but its force diminishes or expires over time if the offender is truly reformed. Amount still tracks original desert, but liability may lapse. *Note: This is distinct from pure retributivism but shares its core on amount.*).

  4.  **Question 4 (For B on Q2):** Can punishing a *genuinely guilty* person *ever* be justified *solely* by the good consequences it produces (like deterring others, preventing future crime, satisfying victims), even if the punishment isn't necessarily *deserved* or seems disproportionate?
      *   **A: Yes, if the benefits are great enough, punishing the guilty solely for consequences can be justified.** → Go to Question 5.
      *   **B: No, punishing the guilty solely for consequences is never justified. There must be more to it than just good results.** → Go to Question 6.

  5.  **Question 5 (For A on Q4):** When setting the *amount* of punishment, does it *have* to be proportional to the seriousness of the crime/level of desert? Or can it be set *entirely* based on what level best deters future crime (e.g., extremely harsh punishment for minor crimes if that deters best)?
      *   **A: The amount MUST be proportional to the crime/desert. You can't punish a shoplifter like a murderer just for deterrence.** → **Leaf 4: Negative Retributivism** (Desert sets a *ceiling* - you can't punish more than deserved, and you can't punish the innocent. Within that limit, punishment is justified *and its amount set* by consequentialist goals like deterrence/rehabilitation).
      *   **B: The amount should be set ENTIRELY by what best achieves good consequences (like deterrence). Desert doesn't constrain the amount.** → **Leaf 5: Pure Consequentialist Sentencing** (Punishment is justified solely by good consequences. Liability requires guilt as a *practical* necessity (you can't deter by punishing innocents credibly), but the *amount* is purely instrumental. Framing the innocent *might* be ruled out on practical grounds, but punishing the guilty excessively for deterrence is acceptable in principle). *Note: This is rare; most consequentialists accept some desert constraint.*

  6.  **Question 6 (For B on Q4):** If punishment isn't justified *just* by desert (Q2B) and *not justified solely* by consequences (Q4B), what *does* justify it? Is it because punishment communicates society's condemnation, gives the offender a chance to repent/express remorse, or restores relationships?
      *   **A: Yes, punishment is justified as a way for society to communicate blame, for the offender to take responsibility, or to repair harm.** → **Leaf 6: Expressivist/Communicative Theory** (Punishment is justified as a form of moral communication or dialogue aimed at recognition of wrongdoing, repentance, or restoration. Desert is often a *precondition* for this communication, but the communicative *purpose* is central).
      *   **B: No, that doesn't capture it either. I believe punishment requires desert AND good consequences, but neither alone is sufficient.** → **Leaf 7: Unstable Hybrid / (Likely Undefended)** (Punishment requires *both* desert *and* good consequences to be justified, but neither is sufficient alone. *Why likely undefended/unattractive?* It struggles to explain cases: Why punish if there are no good consequences, even if deserved? Why punish if it causes net harm, even if deserved? It risks being arbitrary or collapsing into one of the other views under pressure. Most theorists argue one provides the core justification and the other sets constraints).

  **Key Notes & Observations per Your Request:**

  1.  **Convergence Warning (Negative Retributivism vs. Threshold):** You rightly suspected convergence. While conceptually distinct (Threshold = desert *expires*; Negative = desert sets a *permanent ceiling*), they will agree on *many* concrete cases:
      *   Both forbid punishing the innocent.
      *   Both forbid punishing beyond desert.
      *   Both allow punishment below the desert ceiling for consequentialist reasons.
      *   The key *practical* difference appears in the **50-year case** (Q3). A Negative Retributivist might still punish the reformed 70-year-old (within the ceiling) if it deters others. A Threshold theorist (Leaf 3) likely would not, believing the desert claim has lapsed. **The tree *can* separate them via Q3, but only if the student follows the "Desert Alone is Sufficient" path (Q2A).** Students entering via Q2B (Desert not sufficient alone) will *never* reach Threshold Retributivism in this tree. This reflects that Threshold views usually sit closer to pure retributivism.
  2.  **Unstable Hybrid (Leaf 7):** As noted, this combination (desert *necessary* but not *sufficient*, consequences *necessary* but not *sufficient*) is philosophically unstable and not seriously defended for the reasons given. It's included to capture a possible student intuition and flag its problems.
  3.  **Pure Consequentialist Sentencing (Leaf 5):** Flagged as rare. Most consequentialists accept *some* desert-based constraint (becoming Negative Retributivists - Leaf 4) because purely instrumental sentencing faces massive intuitive objections (e.g., brutalizing minor offenders) and practical problems (undermining perceived legitimacy, potentially *increasing* crime).
  4.  **Abolitionism (Leaf 1):** Clear exit point.
  5.  **Expressivism (Leaf 6):** Captures views focusing on communication, condemnation, and restoration, distinct from pure desert or pure consequences.
  6.  **Pure Retributivism (Leaf 2) & Threshold (Leaf 3):** Separated cleanly by the 50-year case intuition.
  7.  **Structure:** The tree starts concrete (Q1), isolates the core retributive intuition (Q2), then forces choices about consequences (Q4), proportionality (Q5), and alternatives (Q6), using your specified scenarios (50-yr, framing/amount setting). It avoids labels at branches.

  **Leaves Summary (7 Total):**

  1.  **Abolitionism**
  2.  **Pure Retributivism**
  3.  **Threshold Retributivism / Time-Limited Desert**
  4.  **Negative Retributivism**
  5.  **Pure Consequentialist Sentencing** (Rare)
  6.  **Expressivist/Communicative Theory**
  7.  **Unstable Hybrid (Likely Undefended)**

  This tree should effectively sort students based on their case intuitions along the major theoretical fault lines you outlined, while being accessible to first-years and highlighting the areas of convergence and instability you were concerned about. Good luck with the tutorial!
