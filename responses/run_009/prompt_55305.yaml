answer: |-
  Here’s a complete session design that forces students to **discover** the differential-burden principle through gameplay, with minimal lecturing. The game is called **"The Artisan Market."**

  ---

  ### **Game Setup: The Artisan Market**
  **Premise:**  
  Sellers ("Artisans") create either **High-Quality (HQ)** or **Low-Quality (LQ)** crafts. Buyers ("Collectors") want HQ items. Artisans know their own quality; Collectors don’t. Artisans can **signal** by spending tokens on a "Seal of Craftsmanship," but the cost rules change each phase. Collectors decide whether to buy ("Accept") or reject each artisan.

  **Roles (for 14 students):**  
  - **6 HQ Artisans** (assigned secretly)  
  - **4 LQ Artisans** (assigned secretly)  
  - **4 Collectors**  

  **Materials:**  
  - Index cards (for role assignments)  
  - Poker chips/tokens (or tallies on paper)  
  - Prize jar (e.g., candy, coffee vouchers) for lottery tickets  

  **Payoff Scheme (Lottery Tickets):**  
  | **Action**                | HQ Artisan | LQ Artisan | Collector |
  |---------------------------|------------|------------|-----------|
  | **Accepted by Collector** | +3 tickets | +3 tickets | +5 tickets (if HQ), –2 tickets (if LQ) |
  | **Rejected**              | 0 tickets  | 0 tickets  | 0 tickets |
  | **Signal Cost (Phase 2)** | –1 ticket  | –1 ticket  | —         |
  | **Signal Cost (Phase 3)** | –1 ticket  | –3 tickets | —         |

  **Key Mechanics:**  
  - Artisans start each round with **tokens**: HQ = 4 tokens, LQ = 2 tokens.  
  - **Signal cost is paid upfront** before Collectors decide.  
  - Collectors see **only** whether an artisan signaled ("Sealed") or not.  
  - **No communication** between players during rounds.  
  - **Tokens reset every round** (no carryover).  

  ---

  ### **Session Timeline (50 Min Total)**  
  **1. Introduction (5 min):**  
  - *"Today we’re simulating an artisan market. Some artisans make high-quality crafts, others low-quality. Collectors profit only if they accept HQ artisans. Artisans profit if accepted, regardless of quality. You’ll make real choices with token payoffs. Your goal: maximize your tickets for the prize lottery."*  
  - Assign roles secretly (no peeking).  

  **2. Phase 1: Free Signaling (Cheap Talk) (10 min)**  
  - **Rules:** Signaling costs **0 tokens**. Artisans choose to signal ("Seal") or not.  
  - **Rounds:** 3 rounds (2 min/round).  
  - **Predicted Outcome:**  
    - All artisans signal (no cost to bluff).  
    - Collectors see no difference; accept randomly or reject everyone.  
    - **Result:** No information transfer. Payoffs chaotic.  

  **3. Phase 2: Flat Cost Signaling (10 min)**  
  - **Rules:** Signaling costs **1 token for all artisans**.  
  - **Rounds:** 3 rounds (2 min/round).  
  - **Predicted Outcome:**  
    - Most artisans still signal (HQ: 4–1=3 tokens left → still profitable. LQ: 2–1=1 token left → still profitable).  
    - Collectors see signals but suspect bluffs; acceptance rates drop slightly.  
    - **Result:** Signals still unreliable. LQ artisans mimic HQ (flat cost doesn’t separate types).  

  **4. Phase 3: Type-Dependent Cost (15 min)**  
  - **Rules:** Signaling costs **1 token (HQ) or 3 tokens (LQ)**.  
  - **Rounds:** 3 rounds (2 min/round).  
  - **Predicted Outcome:**  
    - HQ artisans signal (4–1=3 tokens → profitable).  
    - LQ artisans **cannot afford** to signal (2–3= –1 token → loss) or risk rejection if they don’t signal.  
    - Collectors see signals as credible; accept signaled artisans.  
    - **Result:** Signals become honest. HQ accepted, LQ rejected.  

  **5. Debrief (10 min):**  
  - **Ask:** *"What patterns did you see? When did signals become trustworthy?"*  
  - **Map phases to theory WITHOUT jargon:**  
    - **Phase 1 (Free):** "Signals were meaningless. Anyone could claim quality." → **Cheap Talk**.  
    - **Phase 2 (Flat Cost):** "Signals were still untrustworthy. Why?" → **Cost alone doesn’t prevent lying** (LQ could afford it).  
    - **Phase 3 (Variable Cost):** "Signals became honest. Why?" → **Cost must hurt imposters more** (LQ couldn’t bluff without going broke).  
  - **Reveal the theory:** *"What you discovered is called the Handicap Principle. Honest signals require costs that are trivial for the ‘best’ senders but unbearable for ‘frauds.’"*  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Collusion/Friendship Bias:**  
     - *Risk:* Collectors accept friends regardless of signals.  
     - *Fix:* Assign random IDs (e.g., "Artisan 7"), anonymize choices.  

  2. **Low Stakes → Random Play:**  
     - *Risk:* Players make lazy choices if prizes feel insignificant.  
     - *Fix:* Use desirable prizes (e.g., $10 coffee card). Emphasize competition.  

  3. **Senders "Drift":**  
     - *Risk:* Artisans stick to one strategy (e.g., always signal).  
     - *Fix:* After each phase, announce: *"Reveal your role if comfortable. Did your strategy work?"* Build tension.  

  4. **Time Blowup:**  
     - *Risk:* Rounds run long with decision paralysis.  
     - *Fix:* Use a timer (visible countdown). Enforce 15-second decisions.  

  ---

  ### **Where the Analogy is Thin (Debrief Points)**  
  1. **Conscious Strategy vs. Evolution:**  
     - *"You optimized in minutes. In nature, this takes generations of failed bluffs."*  

  2. **Imposed Costs vs. Biological Constraints:**  
     - *"I forced costs to differ. In biology, costs emerge from physiology (e.g., weak cheetahs can’t afford huge muscles)."*  

  3. **Missing Co-Evolution:**  
     - *"In reality, if collectors stop trusting signals, bluffing might resurge. We skipped this feedback loop."*  

  4. **No Frequency Dependence:**  
     - *"If many HQ artisans exist, collectors might accept unsignaled sellers. Our game had fixed ratios."*  

  ---

  ### **Why This Works**  
  - Students **feel** the failure of flat costs when LQ artisans mimic HQ.  
  - The "ruinous cost" in Phase 3 creates visceral relief ("*Finally, signals mean something!*").  
  - Debrief ties experience to theory in <10 minutes, using **their words** from gameplay.  

  **Final Tip:** Run a test round with friends. Adjust payoffs if separation isn’t emergent in Phase 3 (e.g., raise LQ signal cost to 4 tokens). Lean into the chaos—let them *frustratedly* discover why flat costs fail.
