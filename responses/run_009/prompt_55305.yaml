  I'm thinking about the game mechanics. For phase 1 (free signaling), all senders will signal and receivers can't distinguish - this demonstrates "cheap talk." Phase 2 (flat cost) will show that both types still signal because the cost is equally affordable, leading to deception. Phase 3 (differential cost) should naturally create separation as low-quality senders find the cost too burdensome.

