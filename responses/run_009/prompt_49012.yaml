prompt: |-
  I teach a graduate seminar on rational choice theory, and this week's meeting ended in a standoff between two of my doctoral students over counterfactual mugging. I shall set out the exchange as it occurred and would be grateful for a careful adjudication.

  For context, the scenario we were discussing: a predictor with a flawless record approaches you before a fair coin is flipped and announces that it has predicted how you will respond if approached afterwards. The coin lands tails. The predictor then says: the coin came up tails, there is no money on the table, but I predicted you would hand over £100 in this exact situation; if the coin had landed heads, I would have shown you this promise and given you £10,000. Now pay up. So the question is whether to pay £100 in the world where you receive nothing and are merely told about a hypothetical windfall in the other branch. The same seminar had earlier discussed the related XOR blackmail case: a blackmailer who can foresee whether your house will be burgled and can also detect whether the processor in your laptop is flaky, and who sends you a letter demanding £1,000 exactly when one but not both of those things is true — so the letter's arrival is strong evidence that either your house will be burgled or your processor is failing, and the payment does nothing to avert the burglary.

  The exchange went as follows. First, Ada said she refuses to pay in the mugging: the coin has landed tails, the £10,000 exists nowhere in her world, and handing over £100 is a certain loss. Decision theory, she insisted, is about what to do given the information you actually have when you act; the preferences of a hypothetical counterpart in an unrealised branch cannot bind you, any more than the dead can be paid wages on behalf of the living. Second, Ben replied that she is reasoning "updately" rather than "updatelessly": before the coin flip, any sensible person would have paid £100 for a half chance at £10,000, and the whole point of acting on the policy you would have endorsed ex ante is that predictors can condition on your disposition rather than your later whim. He added that Ada already one-boxes in Newcomb's problem, so she accepts that the qualities of agents like her can be worth money; refusing the mugging is just two-boxing with the second box placed in another branch. Third, Ada drew the Newcomb line differently: there, she said, the correlated good sits in the very world she inhabits and she walks out of the room with it, whereas no version of her ever collects the £10,000; moreover, she argued that Ben's ex ante endorsement, taken seriously, would have him pay the blackmailer, since from behind a veil of ignorance the letter's arrival looks like terrible news worth £1,000 to act on. Fourth, Ben denied this: the right ex ante policy in the blackmail case is never to pay, because one's decision is not tied to the burglary in the way it is tied to the predictor's behaviour in the mugging — the blackmailer merely observes both facts, and no output of one's decision procedure changes either of them — so the contrast between the two cases is not a embarrassment but the very thing that shows the updateless framework is discriminating rather than indiscriminate. Fifth, Ada pressed on the underlying logic: in the tails world, the claim that had her decision procedure output "refuse", the predictor would not have offered the money is a counterfactual with a false antecedent about a mathematical function's output, and she professed not to understand the truth conditions of such counterlogical conditionals, whereas causal reasoning never needs them. Sixth, Ben answered that she needs them anyway, since even in Newcomb the claim that the opaque box would have been empty had she two-boxed is precisely a counterlogical about the predictor's model of her, so her official causal theory cannot underwrite her excellent instincts in that case.

  I confess I could not tell them which of them was right at which step, and the seminar ran over time. Please adjudicate the exchange move by move: say who is right at each of the six steps and why; assess whether Ada can coherently be a one-boxer who refuses to pay in the mugging, or whether she must abandon one or the other; explain what the XOR blackmail comparison actually establishes about the coherence of Ben's position; and identify what, if anything, both students are missing.
reasoning: |-
  Okay, let me carefully work through this professor's query about the rational choice theory seminar debate. The scenario involves two doctoral students, Ada and Ben, clashing over counterfactual mugging with six distinct moves in their exchange. I need to adjudicate each step while addressing the deeper questions about decision theory consistency.

  First, I need to recall the core dilemmas. Counterfactual mugging presents a paradox where paying £100 in the tails world seems irrational since you gain nothing, yet refusing might mean missing out on the heads scenario. Ada takes the position of refusing payment based on actual world information, while Ben advocates for an "updateless" approach where you honor the ex ante optimal policy.

  The XOR blackmail comparison adds complexity - here Ada cleverly points out that Ben's logic might force him to pay the blackmailer, which seems clearly wrong. This becomes a key test for the updateless view's discrimination.

  For each of the six moves:
  - On Ada's initial refusal: She's correct that decision theory typically acts on current information, but misses how predictors complicate this.
  - Ben's updateless response is strong for mugging but overextended - he's right about policy consistency mattering for predictors.
  - Ada's Newcomb distinction makes sense - actual correlation vs. counterfactual branches differ meaningfully.
  - Ben's blackmail defense works because the burglary isn't causally tied to the decision like in mugging.
  - Ada's counterlogical concern is valid but incomplete - we use such reasoning constantly in game theory.
  - Ben's Newcomb parallel is insightful - both require counterfactuals about decisions.

  The coherence question is tricky: Ada can consistently one-box yet refuse the mugging by distinguishing between actual correlation (Newcomb) and counterfactual obligations (mugging). The blackmail case actually helps Ben by showing his view doesn't compel payment there - the key difference being the predictor's causal dependence on your disposition in mugging versus the blackmailer's passive observation.

  Both students might be missing how decision theory frameworks (evidential vs. causal) handle these cases differently. The deeper issue is whether rationality binds us to satisfy ex ante preferences when no actual payoff exists. I should also note that professional philosophers remain divided on this - the professor's seminar reached a standoff precisely because there are intelligent arguments on both sides.
answer: |-
  Below is a move-by-move adjudication of the Ada–Ben exchange, grounded in decision-theoretic principles. The analysis draws on key distinctions in causal vs. evidential decision theory, the role of counterfactuals, and the interplay between ex ante and ex post rationality. **The verdict favors Ben on most points, but Ada raises valid concerns about counterlogicals and the uniqueness of Newcomb's problem.**

  ---

  ### **Step-by-Step Adjudication**
  1. **Ada’s Initial Refusal**  
     *Ada’s claim*: Refusing to pay is rational because the £10,000 is unrealized, and decision theory acts on actual information.  
     *Verdict*: **Partially correct but incomplete.**  
     Ada is right that in the *actual* tails world, paying £100 yields a certain loss. Standard **causal decision theory (CDT)** agrees: since the payment cannot causally influence the past (the coin flip or predictor’s decision), it is a dominated action. However, this ignores the **acausal correlation** between one’s decision rule and the predictor’s behavior. If the predictor selects victims based on their *dispositions*, refusing payment means sacrificing gains in other possible worlds (e.g., heads) that were accessible ex ante. Ada’s analogy to “paying the dead” misfires because the predictor *conditionally* links outcomes across branches via your policy.

  2. **Ben’s Updatelessness Argument**  
     *Ben’s claim*: Ada reasons “updately” (post-update); an ex ante optimal policy (“updateless”) would pay. Refusing is like two-boxing in Newcomb’s problem.  
     *Verdict*: **Correct.**  
     **Updateless decision theory** (associated with UDT and FDT) evaluates policies *before* uncertainty resolves. Ex ante, paying £100 for a 50% chance of £10,000 has positive expected value (+£4,950). Since the predictor responds to your *disposition*, not your momentary choice, adhering to the ex ante optimal policy is rational. Ben’s analogy to Newcomb is apt: one-boxing exploits the correlation between your trait (one-boxing disposition) and the predictor’s action (filling the box). Refusing the mugging is indeed “two-boxing across branches”: sacrificing a correlated gain in the heads branch for a sure loss in tails.

  3. **Ada’s Newcomb Distinction and Blackmail Challenge**  
     *Ada’s claim*: Newcomb differs because the reward is actual; mugging’s £10,000 is unrealized. Ben’s ex ante policy would compel paying the blackmailer.  
     *Verdict*: **Correct on Newcomb, incorrect on blackmail implication.**  
     - **Newcomb distinction**: Ada is right that Newcomb’s reward exists in the *actual* world (you carry the box out), while mugging’s reward is counterfactual. However, this doesn’t refute Ben. In both cases, the predictor’s action depends on *modeling your decision rule*. The reward’s actuality in Newcomb stems from the same acausal logic as the mugging’s counterfactual.  
     - **Blackmail challenge**: Ada errs. The ex ante policy for blackmail is *not* to pay, as Ben clarifies next. Her error conflates *correlation* with *causal impotence*.

  4. **Ben’s Blackmail Defense**  
     *Ben’s claim*: Never paying blackmail is ex ante optimal because payment doesn’t affect burglary/processor failure; mugging differs as the predictor responds to your disposition.  
     *Verdict*: **Correct, and crucial.**  
     In XOR blackmail:  
     - The blackmailer observes independent facts (burglary, processor flaw). Your payment does nothing to prevent them.  
     - The letter’s arrival is *evidence* of danger (P(burglary ∨ flaw | letter) ≈ 1), but paying £1,000 is pure loss: it doesn’t alter the risk.  
     - Ex ante, paying *only when the letter arrives* is irrational: it turns you into a “money pump” for the blackmailer.  
     In mugging:  
     - The predictor’s action (offering the deal) *depends counterfactually on your decision rule*. If your policy is “always refuse,” the predictor (knowing this) never offers the £10,000 in heads worlds.  
     **This contrast validates updatelessness**: It pays in muggings (where your disposition affects outcomes acausally) but not in blackmail (where outcomes are decoupled from your decisions).

  5. **Ada’s Counterlogical Concern**  
     *Ada’s claim*: Counterfactuals about mathematical functions (e.g., “had I refused, the predictor wouldn’t have offered £10,000”) lack clear truth conditions; causal reasoning avoids them.  
     *Verdict*: **Misguided but raises a valid challenge.**  
     - While CDT avoids counterfactuals with false antecedents, they are **essential in problems involving predictors or logical dependencies** (e.g., Newcomb, mugging, Parfit’s Hitchhiker).  
     - Truth conditions can be grounded in **possible-world semantics** (e.g., “closest world where your decision algorithm outputs ‘refuse’”) or **algorithmic interdependence** (as in UDT/FDT).  
     - Ada’s claim that “causal reasoning never needs them” is false: In Newcomb, the assertion “the box would be empty had you two-boxed” is equally counterlogical. If she rejects such conditionals, she cannot justify one-boxing in Newcomb.

  6. **Ben’s Newcomb Parallel**  
     *Ben’s claim*: Ada uses counterlogicals in Newcomb; rejecting them in mugging is inconsistent.  
     *Verdict*: **Correct.**  
     Newcomb’s predictor also relies on modeling your decision function. The statement “had you two-boxed, the opaque box would be empty” is a counterfactual about a mathematical object (your algorithm). If Ada accepts this in Newcomb (as she must to one-box), she cannot coherently reject it in mugging. Both cases involve acausal correlation between your disposition and the predictor’s act.

  ---

  ### **Can Ada Coherently One-Box Yet Refuse the Mugging?**
  - **No, without inconsistency.**  
    Both Newcomb and mugging hinge on **acausal correlation between your decision rule and the predictor’s action**. In Newcomb, one-boxing yields the £1M because the predictor *knew you would one-box*. In mugging, paying yields the £10,000 (in heads branches) because the predictor *knew you would pay in tails branches*.  
    - If Ada one-boxes in Newcomb, she accepts that rational agents should act so that their *decision rules* are correlated with desirable outcomes, even when causation is absent.  
    - Refusing the mugging violates this: it severs the link between your policy and the heads-branch reward.  
    **Exception**: Ada could adopt **causal decision theory (CDT)** for mugging while using **evidential (EDT)** or **functional (FDT)** for Newcomb, but this is ad hoc. Philosophically, both problems belong to the same family of "predictor games."

  ---

  ### **What XOR Blackmail Reveals About Ben’s Position**
  - **It demonstrates discrimination, not weakness.**  
    Ben correctly notes that updatelessness prescribes:  
    - **Pay in mugging** (because the predictor *responds* to your disposition; your policy affects outcomes).  
    - **Don’t pay in blackmail** (because the blackmailer *merely observes* facts; your policy doesn’t affect outcomes).  
    This contrast shows updatelessness (as in FDT/UDT) is **sensitive to the type of dependency**:  
    - In mugging, the predictor’s action *counterfactually depends* on your decision rule.  
    - In blackmail, the burglary/processor flaw are *independent* of your rule.  
    **Thus, blackmail validates Ben**: It illustrates that updateless frameworks avoid overcommitment to irrational acts when no acausal leverage exists.

  ---

  ### **What Both Students Miss**
  1. **The core conflict between decision theories**:  
     - Ada implicitly defends **causal decision theory (CDT)**, which ignores counterfactual correlations.  
     - Ben defends **functional decision theory (FDT)** or **updateless UDT**, which optimize over policies.  
     The mugging highlights CDT’s failure in predictor-rich environments, while the blackmail shows FDT/UDT’s ability to avoid EDT-like pitfalls (e.g., paying for evidence).  

  2. **The role of indexicality and identity**:  
     Ada’s claim that “no version of her collects the £10,000” touches on **personal identity in branching worlds**. If she views other branches as “not her,” paying feels irrational. Ben (and FDT) assumes a **policy-centered view**: you are identical to your decision algorithm across branches.  

  3. **The burden of proof on counterlogicals**:  
     While Ben correctly notes their necessity, he doesn’t address Ada’s skepticism about their semantics. Philosophers (e.g., Stalnaker, Lewis) offer formal accounts, but these remain contested in logical/deterministic settings.  

  4. **A deeper symmetry**:  
     Both problems involve **signaling traits to a predictor**. In Newcomb, one-boxing signals rationality to get £1M; in mugging, paying signals a cooperative disposition to get £10,000 in heads branches. Refusing in mugging is like two-boxing: it signals untrustworthiness, forfeiting gains.

  ---

  ### **Summary of Verdicts**
  | Step | Student | Key Claim                                                                 | Verdict                                  | Why                                                                                              |
  |------|---------|---------------------------------------------------------------------------|------------------------------------------|--------------------------------------------------------------------------------------------------|
  | 1    | Ada     | Refuse payment; £10k is unrealized.                                       | **Incomplete**                           | Ignores acausal correlation and ex ante optimality.                                              |
  | 2    | Ben     | Ada reasons "updately"; mugging refusal = two-boxing across branches.     | **Correct**                              | Updateless policies exploit predictor dependence; analogy holds.                                |
  | 3    | Ada     | Newcomb reward is actual; Ben's view forces paying blackmail.             | **Mixed** (Right on Newcomb, wrong on blackmail) | Correct that Newcomb reward is actual, but blackmail lacks outcome dependence.                 |
  | 4    | Ben     | Blackmail payment doesn't affect outcomes; mugging does via disposition.  | **Correct**                              | Distinguishes acausal influence (mugging) from mere observation (blackmail).                    |
  | 5    | Ada     | Counterlogicals are suspect; causal reasoning avoids them.                | **Misguided**                            | Counterlogicals are essential for predictor problems; CDT fails in Newcomb/mugging.             |
  | 6    | Ben     | Ada uses counterlogicals in Newcomb; rejecting in mugging is inconsistent. | **Correct**                              | Newcombs's "empty box if two-boxed" is equally counterlogical; consistency demands acceptance. |

  **Final note**: The standoff reflects a genuine rift in decision theory. Ada’s instincts align with CDT, which dominates in philosophy but struggles with predictors. Ben’s view aligns with FDT/UDT, which dominates in AI alignment and handles predictors robustly but demands counterfactual commitments. Neither position is trivial to dismiss, but **Ben’s framework resolves the cases more coherently overall**.
