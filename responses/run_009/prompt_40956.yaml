  ### Analysis of the Friend's Classification Rules

  Your friend's record suggests a classification system based on two axes: **economic** (left: pro-state intervention, redistribution, worker power; right: pro-market, lower taxes, less regulation) and **cultural** (left: secular, progressive, inclusive; right: traditional, religious, restrictive). The movements she has classified align with these axes, but crucially, her verdicts avoid direct conflicts between the axes—each case either aligns both axes in the same direction or is silent on one axis. This implies that her rules might handle mixed or incomplete cases in a specific way. Below, I identify candidate rules that fit her record, apply them to Family and Labour, predict her verdict, and propose a clarifying test case.

  ---

  ### Candidate Rules Fitting the Record
  Two rules consistently explain all existing verdicts:

  1. **Rule 1: Both-Axes Principle**  
     - A movement is **left** only if it is left on **both** economics and culture (or silent on culture but left on economics).  
     - A movement is **right** if it is right on **either** economics or culture (or silent on economics but right on culture).  
     - **Rationale**:  
       - The social-democratic party (left economics, left culture) → left.  
       - The anti-income tax campaign (right economics, silent culture) → right (right on economics).  
       - The monarchist society (silent economics, right culture) → right (right on culture).  
       - The anarchist squat (presumed left economics, left culture) → left.  
       - The green movement (left economics, left culture) → left.  
       - *Fits all cases by requiring full left alignment for "left" and allowing "right" for any right/silent axis.*

  2. **Rule 2: Economic-Primacy Principle**  
     - The **economic axis dominates** if present. If economic stance is explicit, it determines the verdict.  
     - If economics is silent, the cultural stance determines the verdict.  
     - **Rationale**:  
       - Social-democratic party (explicit left economics) → left.  
       - Anti-income tax (explicit right economics) → right.  
       - Monarchist society (silent economics, explicit right culture) → right.  
       - Anarchist squat (explicit left economics) → left.  
       - Green movement (explicit left economics) → left.  
       - *Fits all cases by prioritizing economics when present, deferring to culture only if economics is absent.*

  Both rules fit the record perfectly because no prior case has:  
  - **Conflict**: Explicit left on one axis and explicit right on the other.  
  - **Silent left**: Explicit left on one axis but silent on the other (e.g., economically left but culturally silent).  

  ---

  ### Application to Family and Labour
  **Movement description**:  
  - **Economics**: Nationalization (left), pro-union (left), family wage/allowance (left-leaning via state intervention).  
  - **Culture**: Anti-immigration (right), pro-religious assembly (right), anti-divorce/abortion (right).  
  - **Explicit stances**: Left on economics, right on culture—**clear conflict**.

  **Prediction under each rule**:  
  - **Rule 1 (Both-Axes)**: Not left on both axes (right on culture) → **right**.  
  - **Rule 2 (Economic-Primacy)**: Explicit left economics dominates → **left**.  

  ---

  ### Prediction of Her Verdict
  **Best guess: She will classify Family and Labour as RIGHT (using Rule 1).**  

  **Reasons**:  
  1. **Consistency with her pattern**: Her prior verdicts treat "right" as a default for non-aligned cases:  
     - The anti-tax campaign (right economics, silent culture) → right.  
     - The monarchist society (silent economics, right culture) → right.  
     This suggests Rule 1, where "left" requires full alignment, and any right/silence on an axis yields "right."  
  2. **No precedent for economic dominance**: Rule 2 is plausible but arbitrary without evidence. In cases like the monarchist society, she used culture only because economics was silent—not because economics is inherently primary.  
  3. **Cultural salience**: Family and Labour’s cultural platform is highly explicit (e.g., "halt most immigration," "restore religious assembly"), making it hard to ignore. Rule 1 naturally incorporates this.  
  4. **Ideological coherence**: Rule 1 reflects a "threshold" view: leftism requires progressivism on both fronts; otherwise, it defaults to right. This aligns with traditional left-right binaries where cultural conservatism often disqualifies a movement from the "left" label.  

  **Commitment in the record?**  
  - Her record does **not** commit her to one verdict. Rule 1 and Rule 2 both fit the data, and Family and Labour is the first conflicted case. The commitment is only to a binary outcome, not to how conflicts are resolved.  

  ---

  ### Test Case to Separate the Rules
  **Proposal**: A movement with **explicit left economics but silent on culture**.  

  - **Movement example**: "**The Cooperative Guild**"  
    - *Economics*: Advocates for worker co-ops to replace private ownership, universal basic income funded by corporate taxes.  
    - *Culture*: Entirely silent (no stance on immigration, religion, gender, etc.).  
    - *Rhetoric*: Focuses solely on "economic democracy" and "ending capitalist exploitation."  

  **Why this separates the rules**:  
  - **Rule 1 (Both-Axes)**:  
    - Not left on both axes (silent on culture → cannot verify left culture) → **right**.  
    - *Analogy*: Just as the monarchist (silent economics, right culture) was right, silence on culture here prevents a "left" verdict.  
  - **Rule 2 (Economic-Primacy)**:  
    - Explicit left economics dominates → **left**.  
    - *Analogy*: Similar to the anti-tax campaign (right economics → right), but with left economics.  

  **Outcome**:  
  - If she calls it **left**, she uses **Rule 2 (Economic-Primacy)**.  
  - If she calls it **right**, she uses **Rule 1 (Both-Axes)**.  

  This case is "clean" because:  
  - It mirrors existing silent-axis cases (e.g., anti-tax and monarchist) but tests the *left* side of economics.  
  - It avoids cultural noise, forcing a choice between the rules’ handling of silence.  

  ---

  ### Conclusion
  Your friend will likely deem Family and Labour **right** under Rule 1, as it is not left on both axes. However, her record allows both rules, so the proposed test case (a culturally silent, economically left movement) would clarify her approach. This reflects a broader truth: real-world movements often defy binary boxes, but her hobby thrives on crisp (if reductive) categorization. Expect spirited seminar debates ahead!
