  The Kerckhoffs' Principle concern is astute. Crypto assumes shared structural conventions exactly where Hofstadter says we hit biological bedrock. This isn't a blind spot but a deliberate abstraction: we model the channel as given precisely to avoid the undecidable bootstrapping problem Hofstadter describes. 

  Steganography examples actually strengthen Hofstadter by showing intentional frame destruction requires prior recognition conventions. The real residue is charging Hofstadter's framework with lacking operational precision - his layers blur in practice (e.g., magic bytes serve both frame and outer functions).

