  ## Copernicanism as Underdetermination: A Critical Analysis

  **Framing Note:** While Bellarmine's position invokes underdetermination, framing the *entire* controversy primarily through this lens risks oversimplification. Bellarmine's stance was deeply intertwined with theological concerns about scriptural authority and Church hierarchy, not pure epistemology. Furthermore, key disagreements often centered on **auxiliary assumptions** (e.g., the nature of comets, the corruptibility of heavens, the physics supporting moving Earth) rather than just the core heliocentric vs. geo-heliocentric choice against a bare data set. Nevertheless, the underdetermination aspect was a significant and genuine component of the debate, especially for scientifically minded individuals like astronomers. We proceed with this analysis, acknowledging these nuances.

  **1. The Evidence on the Table (c. 1610-1633):**
  The critical evidence included: **Galileo's telescopic discoveries**: mountains on the Moon (challenging heavenly perfection), moons orbiting Jupiter (a mini-Copernican system), and vastly more stars (suggesting immense scale). Crucially, Galileo observed the **full phases of Venus**, which definitively refuted the *pure* Ptolemaic geocentric model, as Venus could not exhibit gibbous and full phases if it always orbited between Earth and Sun. However, both the Copernican and Tychonic systems predicted these phases equally well. The **failure to detect annual stellar parallax** was a major problem for *all* heliocentric models (Copernican and Tychonic), as it implied stars were implausibly distant if Earth moved. Tycho's system avoided this problem geometrically by keeping Earth stationary. Sunspots suggested solar rotation and imperfection but didn't discriminate between systems. The evidence thus **ruled out pure geocentrism** via Venus's phases, but **left Copernican heliocentrism and Tychonic geo-heliocentrism observationally indistinguishable** regarding planetary motions and the parallax issue.

  **2. What Underdetermination Explains:**
  The doctrine of underdetermination powerfully explains why **competent, reasonable astronomers could legitimately resist accepting Copernicanism as physical truth for decades after Galileo's work.** Tycho Brahe's meticulously constructed geo-heliocentric system, employing Copernicus's mathematical techniques while keeping Earth stationary, **saved the same astronomical phenomena** – planetary positions, phases of Venus, Jupiter's moons. Crucially, it avoided the physically troubling (and observationally unsupported) stellar distances implied by the lack of parallax in a moving-Earth model. For astronomers prioritizing empirical adequacy and lacking a compelling physics of motion (which Newton later provided), Tycho's system was a scientifically viable, observationally equivalent alternative. Bellarmine's methodological stance – demanding a *demonstration* (beyond mere calculational utility) before accepting heliocentrism as real – was, in this specific scientific context, epistemologically defensible, reflecting the genuine underdetermination of the core cosmological theories by the available data.

  **3. Where the Lens Distorts:**
  Focusing solely on underdetermination relative to a "bare data set" distorts the historical reality. The key players were **not evaluating theories purely against observational predictions.** Galileo aggressively promoted Copernicanism based on **explanatory power and theoretical virtues**: it offered a more **unified, simpler** explanation for diverse phenomena (retrograde motion, phases, relative planetary brightness/distance) compared to Tycho's more complex and seemingly *ad hoc* hybrid. Galileo also invoked **physical arguments** (like tides as evidence of Earth's motion) and the **coherence** of a Sun-centered system revealed telescopically. Conversely, anti-Copernicans relied heavily on **physical objections** (lack of sensed motion, falling bodies, unsupported stellar distances), **Aristotelian cosmological principles** (natural places, element theory), and crucially, **theological commitments** to literalist interpretations of Scripture that placed Earth immobile at the center. Underdetermination talk sidelines these crucial factors – the weight given to simplicity/unification, the constraints of prevailing physics, and the overwhelming influence of theology – that were central to the actual dynamics of the controversy.

  **4. What the Episode Does to the Doctrine:**
  The Copernican episode demonstrates both the **practical reality and the transient nature** of much underdetermination. **James Bradley's discovery of stellar aberration (1727)** provided the first direct observational proof of Earth's orbital motion, discriminating decisively *against* any system with a stationary Earth (like Tycho's). **Friedrich Bessel's measurement of stellar parallax (1838)** finally resolved the distance/parallax objection against Copernicus. This resolution shows that the underdetermination in the early 17th century was primarily **practical and transient**, stemming from **technological limitations** (inability to detect tiny effects like aberration and parallax) and the **lack of a supporting physical theory** (Newtonian mechanics/gravity). However, it also underscores a **principled point**: underdetermination *can* persist for significant periods when critical tests are beyond contemporary capabilities or when competing theories can incorporate new data via auxiliary hypotheses (as Tycho's system did with Venus's phases). The episode exemplifies how underdetermination operates in real scientific practice, constrained by technology and auxiliary assumptions, but ultimately resolvable through new evidence and theoretical frameworks.
