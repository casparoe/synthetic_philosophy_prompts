  I'd like you to analyze the early-seventeenth-century controversy over Copernicanism as a case study in the underdetermination of theory by evidence. The pivot I want you to take seriously is Cardinal Bellarmine's 1615 position: that heliocentrism was a useful calculating device but had not been demonstrated, since the Tychonic geo-heliocentric system saved the same appearances — and that if a real demonstration were ever produced, Scripture would have to be reinterpreted rather than the theory rejected. Map the episode carefully: what the observational evidence available between roughly 1610 and 1633 actually was (the telescopic discoveries, the phases of Venus, the failure to detect stellar parallax), which of the competing systems that evidence genuinely discriminated between and between which it left things open, and where Bellarmine's stance sits on the spectrum from honest epistemology to motivated resistance. Then run the analysis in both directions: what the doctrine of underdetermination explains about the episode (why reasonable, competent astronomers could remain non-Copernicans for decades longer than hindsight usually permits), what it distorts (for instance, whether the parties were really comparing systems against a bare data set at all, or were already weighing simplicity and unification — considerations underdetermination talk tends to sideline), and what the eventual resolution by stellar aberration in 1727 and parallax in 1838 shows about whether the underdetermination here was merely transient and practical or something more principled. Please structure the response in four sections, in this order: "The evidence on the table" (about 250 words), "What underdetermination explains" (about 250 words), "Where the lens distorts" (about 250 words), and "What the episode does to the doctrine" (about 200 words). If you think the framing itself is confused — for example, that Bellarmine's position was theological window-dressing rather than a genuine methodological stance, or that the episode is better described as disagreement over auxiliary assumptions than as underdetermination proper — say so plainly at the start rather than forcing the analysis I've asked for.
