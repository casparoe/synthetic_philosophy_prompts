prompt: |-
  I run a small behavioral coaching practice, and a fair portion of my business is commitment contracts: clients pay a refundable deposit that they forfeit if they miss agreed targets — gym sessions, writing pages, quit dates for vaping. Last night my oldest friend, who trained as an economist, and I argued about this until almost two in the morning. His position was that the whole offering is incoherent: a rational person would just do the thing, so anyone who signs a contract is either irrational (which the contract doesn't fix) or rational but weak-willed (in which case the contract is a tax on a character flaw). My position was half-formed — something about how signing changes what the later choice looks like from where the client stands now, and about cases like Kavka's toxin puzzle, where the reward attaches to the state you're in now rather than to anything you do later — but I couldn't turn it into anything crisp, and it occurred to me, somewhere around our third round, that I don't actually have a principled basis for steering particular clients toward or away from contracts. I do it on intuition.

  Write me a decision procedure I can run with a new client during a single intake session (about forty-five minutes). It should consist of ordered questions to work through together, what counts as a sufficient answer to each, and clear exits: where the procedure returns a firm "no contract," where it returns "sign, and structure it this way," and where it honestly hands the decision back to me and the client because the question is one of values the procedure can't settle. Ground it in the real decision theory here — precommitment versus mere resolution, the difference between changing your future incentives and merely betting against yourself, and the toxin-style case where what's being purchased is the intention itself rather than the later behavior — but it has to be usable by someone with no philosophy background, and it has to survive my economist friend reading it, so no hand-waving about willpower. Be explicit about where you've simplified and what the simplification costs.

  Then run it on three clients. First: a woman who wants to quit vaping before her daughter's October wedding, with a forfeit for each day she's caught with a vape. Second: a man who wants to finish a novel and proposes a hundred-dollar penalty per missed writing day, though he has never once sustained a writing habit for more than a week. Third — and this is the one that keeps me up at night, and where I suspect my friend has the better of it — a client whose couples counselor has told him the counseling will only work if he genuinely intends to stay in the marriage, and who has proposed a heavy forfeit for leaving within two years, in the hope that signing will produce the sincere intention that the counseling requires. He would, I think, most prefer to have the intention and never face the choice at all.

  For at least one of the three, the procedure should give an answer I will not like; flag which one and why. Close with a short statement of what the procedure cannot do — the cases where running it would produce confident nonsense.
reasoning: |-
  Hmm, the user runs a behavioral coaching practice specializing in commitment contracts. They're grappling with their economist friend's critique that such contracts are incoherent for rational people. The user wants a principled decision procedure grounded in decision theory that can be applied in 45-minute intake sessions, and wants me to apply it to three specific cases.

  Breaking this down:

  The core philosophical tension is between:
  - The economist's view that rational actors wouldn't need contracts (either they'd do the action anyway, or they're irrational/weak-willed)
  - The coach's intuition that signing changes the decision landscape

  Key decision theory concepts to incorporate:
  1. **Precommitment vs resolution**: True precommitment alters future options (like Ulysses tying himself to the mast), whereas resolutions are just promises to oneself that can be broken without consequence.
  2. **Incentive shifting**: Contracts work by attaching new costs (forfeits) to failure, changing the payoff matrix of future choices.
  3. **Intention purchasing**: Like in Kavka's toxin puzzle, sometimes people pay for the current state of having committed, regardless of later action.

  The decision procedure needs:
  - Ordered questions with clear exit points
  - Distinctions between "no contract," "contract with specific structure," and "values decision"
  - Accessibility for non-philosophers
  - Robustness against economist scrutiny

  For the three cases:
  1. **Vaping mother**: Has clear deadline (wedding) and measurable behavior. Classic incentive-shifting case.
  2. **Novelist**: History of failure suggests possible self-deception. Need to probe if he's misjudging his future preferences.
  3. **Marriage client**: Most problematic. The forfeit can't manufacture genuine intention, and might even incentivize bad-faith counseling.

  The procedure should flag the marriage case as inadvisable - precisely because what's being "purchased" (sincere intention) isn't actually deliverable via penalty. As Kavka showed, you can't rationally intend to drink toxin just because you're paid to intend it.

  Simplifications I'll make:
  - Treating "rationality" as preference consistency over time (ignoring philosophical debates)
  - Assuming clients can accurately report current preferences (though behavioral economics shows we often can't)
  - Using binary classifications where spectrums exist (e.g., "clear deadline" vs not)

  Limitations:
  - Won't handle clients with deep self-deception
  - Can't resolve when the target behavior is vaguely defined
  - Fails when the client wants the contract as performance art rather than actual behavior change

  The economist friend has a point about taxing character flaws, but misses that the tax itself changes the character of the decision - which is the whole point. The procedure makes this operational.
answer: |-
  Here is a decision procedure grounded in decision theory, designed for a 45-minute intake session. It distinguishes between **effective precommitment** (altering future incentives), **dysfunctional betting** (merely wagering against yourself), and **intention-purchasing** (where the commitment itself has value). The framework avoids relying on "willpower" and instead focuses on structural features of the client's goal, preferences, and the contract mechanics.  

  **Simplifications and Costs**:  
  1. **Assumes stable preferences**: We assume clients can accurately describe their current preferences. *Cost*: Ignores that preferences might shift mid-process.  
  2. **Binary outcomes**: Classifies goals as "clear/measurable" or "vague". *Cost*: Oversimplifies complex goals (e.g., "write a novel").  
  3. **Rational self-awareness**: Treats clients as capable of judging their own bias. *Cost*: Underestimates self-deception.  

  ---

  ### **The Decision Procedure: 5 Questions**  
  Work through these in order. Exit at any point if criteria are unmet.  

  1. **"What *exactly* will you do, and how will we measure it?"**  
     - *Sufficient answer*: Specific, observable actions (e.g., "no vaping," "write 500 words/day") with a clear verification method (e.g., vape sensor, shared document).  
     - **Exit to NO CONTRACT if**:  
       - Outcome is vague ("be more present," "genuinely intend").  
       - Measurement is unreliable or invasive (e.g., tracking "sincerity").  

  2. **"Why not do this without a contract?"**  
     - *Sufficient answer*: Identifies a *structural* barrier (e.g., "I undervalue future benefits," "I give in to short-term urges").  
     - **Exit to NO CONTRACT if**:  
       - Client says: "I lack motivation" or "I just need accountability." *(These are willpower proxies—contracts can't fix them.)*  
       - Barrier is external (e.g., "no time," "my boss won’t let me"). *(Contracts don’t change external constraints.)*  

  3. **"Will the penalty make failure *worse* than inaction already feels?"**  
     - Tests if the contract *shifts incentives*. The penalty must convert future inaction from "tempting" to "unthinkable."  
     - *Sufficient answer*: Client confirms the forfeit outweighs the immediate relief of skipping the act (e.g., "Losing $200/day would hurt more than craving a vape").  
     - **Exit to NO CONTRACT if**:  
       - Client can’t quantify the penalty’s pain or says, "I’ll just pay it." *(Indicates dysfunctional betting—no incentive shift.)*  

  4. **"Could you 'cheat' the system without achieving your goal?"**  
     - Tests for *Kavka-style intention-purchasing*. If the goal is the *intention itself* (e.g., "wanting to stay married"), not the action, skip to Q5.  
     - *Sufficient answer*: "No, because success/failure is tied to the measurable act."  
     - **Exit to STRUCTURED CONTRACT if**: Answers to Q1-3 are sufficient. Structure:  
       - Penalty = 1.5x the client’s estimated "value of quitting early."  
       - Third-party verification (e.g., spouse logs vaping, writing app data).  
       - Fixed end date (e.g., wedding day).  

  5. **"Is the *act of signing* itself valuable to you, even if you fail?"**  
     - *Only ask if Q1-3 failed but client still wants a contract*. Tests for intention-purchasing (e.g., Kavka’s toxin: paying for the *intention* to act).  
     - *Sufficient answer*: "Yes, signing proves I’m serious now, and that matters more than the outcome."  
     - **Exit to STRUCTURED CONTRACT if**: Goal is purely about current commitment (e.g., signaling sincerity). Structure:  
       - Non-refundable fee (no forfeit—paid upfront for the *act* of committing).  
       - No outcome-based penalties.  
     - **Exit to VALUES DECISION if**: Client is unsure. Coach/client must weigh: "Is buying temporary certainty worth the cost?"  

  ---

  ### **Application to Cases**  
  **Case 1: Vaping before daughter’s wedding**  
  - Q1: **Pass**. Clear action (no vaping), measurable (caught with vape), end date (October wedding).  
  - Q2: **Pass**. Structural barrier: "Craving overpowers my long-term goal."  
  - Q3: **Pass**. Forfeit/day makes failure worse than cravings.  
  - Q4: **Pass**. Can’t cheat—verification is objective.  
  - **Verdict**: SIGN CONTRACT. Structure: Daily forfeit (e.g., $100/day), verified by daughter/spouse, ends at wedding.  

  **Case 2: Writing a novel with penalty per missed day**  
  - Q1: **Pass**. Measurable (writing days logged), but vague on "what counts." *(Simplification cost: May need tighter rules.)*  
  - Q2: **Fail**. Client says: "I lack discipline." *(No structural barrier identified—willpower issue.)*  
  - **Exit to NO CONTRACT**. Rationale: Penalty is a tax on weakness, not incentive-shifting. Without a structural barrier (e.g., "I procrastinate because I overestimate future motivation"), he’ll likely pay forfeits and quit. **Alternative**: Pre-pay for coaching sessions—non-refundable if he skips writing.  

  **Case 3: Marriage commitment to enable counseling**  
  - Q1: **Fail**. Goal is vague ("genuinely intend to stay"), unmeasurable.  
  - Q2: **Fail**. Barrier is emotional/volitional, not structural.  
  - Q3: **N/A** (skipped due to Q1-2 failure).  
  - Q5: **Ask directly**: "Is signing valuable even if you leave?" Client says: "Yes—signing might create real intention."  
  - **Verdict**: STRUCTURED CONTRACT *only* as intention-purchasing. Structure: **Non-refundable upfront fee** (e.g., $5,000) paid *for signing*, with *no penalty* if he leaves. **This is the answer you won’t like**—it rejects his proposed heavy forfeit. Why? A forfeit for leaving is dysfunctional: if he wants to leave, the penalty either (a) traps him (inhumane) or (b) is paid, making the contract a bet. What’s *purchasable* is the *current* act of commitment, not future sincerity. Kavka’s toxin proves you can’t buy intention for a later act—only the *present* choice to commit.  

  ---

  ### **What the Procedure Cannot Do**  
  The procedure fails in two cases:  
  1. **Self-deception**: Clients who misreport barriers (e.g., Q2) or preferences (e.g., Q3).  
  2. **Unstable environments**: Goals derailed by external shocks (e.g., job loss, injury).  
  In these cases, the procedure may return "false positives" (contracts that exploit the client) or "false negatives" (missed opportunities for valid precommitment). It also cannot resolve **moral conflicts** (e.g., "Should I stay in a toxic marriage?"), which are values questions for coach/client collaboration.  

  This survives economist scrutiny by treating contracts as *toolkit*: incentive-shifters (Q1-4) or intention-purchases (Q5)—never as willpower substitutes. Rational actors *can* use them to alter future choice architectures or buy certainty, but not to "fix" irrationality.
