  - Requiring **organic composition** to exclude digital/mechanical entities.
  - Focusing on **lineage-level capabilities** (not individual) to include sterile mules and dormant cases.
  - Prioritizing **revival potential** over current metabolic activity for dormant entities.
  - Excluding entities that lack organizational wholeness (e.g., red blood cells) or independent lineage evolution (e.g., viruses).

