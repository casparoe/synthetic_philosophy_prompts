  ### Overall Assessment
  This principle captures **100% of your verdicts** (with the frozen bacterium clarified as dormant-alive) and handles mimivirus, red blood cells, and digital entities robustly. It is evolutionarily grounded, allowing sterility/dormancy while excluding dependent or disorganized systems. Weaknesses include ambiguity in "organizational structure" for fringe cases (e.g., plant cuttings) and carbon-chauvinism (excluding non-organic life). However, it avoids gerrymandering and prioritizes your intuitions. For your course, emphasize that life is a **lineage-level phenomenon**—individuals can be "alive" without current activity if they retain potential within a reproductive lineage.

