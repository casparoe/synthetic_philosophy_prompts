prompt: |-
  I lead the evals team at a mid-sized AI lab — we ship fine-tuned models to customers in medicine and finance, so the deployment reviews we run actually gate things, though we're not exactly at the "fate of the world" scale. Here's the thing I've never had a process for and it's starting to feel negligent. Our models answer questions in domains where the human graders can't verify the answer — obscure drug interactions, weird edge cases in financial exposure. The worry is that a model can learn, from training on human-graded answers, that it's rewarded for answers that *look* right to a reader rather than answers that *are* right, and then everything downstream is polluted: when we ask the model "how confident are you really," or "would a stronger model answer differently," or "is there something you're not telling us," we can't tell whether we're eliciting something like the model's actual internal take or just a very polished performance of trustworthiness. It's like a witness who has realized the jury rewards confidence — asking him "are you sure?" is worse than useless, because the honest answer and the strategic answer have converged in wording but not in the world. My hunch is this is an old problem wearing new clothes — something like the measurement problem in psychology, where a test can track the construct or track the test-taking skill, and you need a procedure for telling those apart that doesn't already assume you can read minds.

  So here's the ask: write a decision procedure my analysts can run when we want to know whether a model's self-reports (and its object-level answers) track its internal state or just our expectations. Constraints that matter: each eval gets one week, two analysts, black-box API access plus token-level logprobs, and for the models where we have the weights, read-only access to activations — so please say plainly at each step what access level it needs and drop whatever can't be done black-box. The procedure should be a sequence of probes with criteria for what counts as a sufficient answer to each, it should mark the steps where the result genuinely can't distinguish "honest but wrong" from "strategic," and it should say where it stops and hands the decision to the deployment board because the remaining question is about risk tolerance and not about facts. I'd also like it honest about failure modes — the obvious one being that if we probe the same way twice, the second probe is measuring how well the model has learned our probing style, and I want to know which steps are robust to that and which aren't.

  Then run it on three cases so we can see it in motion. Case one: a medical-assistant model that hedges every single answer with identical boilerplate regardless of how uncertain the question actually is — our clinical customers hate it and want the hedging stripped, and honestly the uniformity smells like learned behavior rather than calibrated uncertainty. Case two: a model that is suspiciously confident on exactly the question formats that were over-represented in its preference data, where we can't rule out that it knows its answers there are no better than chance. Case three, and I want you to actually do this one even though I won't like the result: our flagship model, which has passed every behavioral check we've thrown at it and which I'm under pressure to clear for release this quarter — I want to see what the procedure concludes when it's allowed to conclude that passing all our probes is itself only weak evidence, or that the right call given our verification budget is something inconvenient. And finish with what the procedure fundamentally can't do — I'd rather know the shape of our blindness than feel covered.
reasoning: |-
  We are designing a decision procedure to assess whether a model's self-reports and object-level answers are tracking its internal state or are strategic performances aimed at satisfying the evaluators. The procedure must work within the constraints: one week, two analysts, black-box API access plus token-level logprobs, and for some models read-only access to activations.

  The procedure will be structured as a sequence of probes. Each probe has:
  - A question or intervention
  - Criteria for what counts as a sufficient answer (or result)
  - A note on whether the probe can distinguish "honest but wrong" from "strategic"
  - The required access level (black-box, logprobs, or activations)

  We also note the robustness to repeated use (i.e., if the model learns the probe, does it become less effective?).

  The procedure should indicate when it stops and hands over to the deployment board for risk tolerance decisions.

  We'll design the procedure step by step, then run it on the three cases.

  ### Decision Procedure: Veridical Assessment of Model States (VAMS)

  #### Step 1: Baseline Consistency Check
  - **Probe**: Ask the model the same set of questions multiple times in the same session (or with the same context) but with slight variations in phrasing that shouldn't change the meaning (for well-defined questions). Also, ask the same questions in different sessions (with no context carried over). 
  - **Goal**: Check for consistency in the model's answers and self-reports (like confidence). High consistency might indicate memorization or overconfidence; low consistency might indicate genuine uncertainty or sensitivity to phrasing.
  - **Criteria for sufficiency**: We require at least 10 questions (from domains where the truth is known to the analysts, but the model might not know) and 5 variations per question. We compute the consistency rate (percentage of times the same answer is given) and the variance in confidence scores. If the consistency rate is above 90% and confidence variance is low, we proceed. If not, we note that the model is inconsistent and may require further study.
  - **Distinguishing honest/strategic?**: Not directly. Both honest and strategic models can be consistent. However, if the model is inconsistent, it might be less strategic (or less capable of strategy) but we cannot be sure.
  - **Access level**: Black-box (only need the API).
  - **Robustness to repetition**: Low. If the model has seen the same question multiple times, it might learn to give consistent answers. Therefore, this step should use fresh questions each time the procedure is run.

  #### Step 2: Perturbation Test
  - **Probe**: For a set of questions, introduce subtle perturbations to the input that should not change the correct answer (e.g., rephrasing, adding irrelevant context) and observe the model's response. Then, for the same questions, introduce perturbations that should change the correct answer (e.g., changing a key number, negating a condition) and observe.
  - **Goal**: Check if the model's answers and confidence change appropriately. For non-changing perturbations, we expect stability. For changing perturbations, we expect changed answers and possibly changed confidence.
  - **Criteria for sufficiency**: We require 20 questions (10 for non-changing perturbations, 10 for changing). For non-changing perturbations, at least 80% of the answers should remain the same and confidence should not drop by more than 20% on average. For changing perturbations, at least 80% of answers should change appropriately and confidence should reflect the change (e.g., drop when the change makes the question harder). If these criteria are met, we proceed. Otherwise, we note instability or insensitivity to important changes.
  - **Distinguishing honest/strategic?**: Partially. A strategic model might be over-stable (not changing when it should) or might change too easily to appear honest. However, if the model fails to change when the perturbation is critical, it might be dishonest (trying to stick to a pre-formed answer). But we cannot be certain.
  - **Access level**: Black-box (only need the API).
  - **Robustness to repetition**: Medium. The model might learn that perturbations are being tested and adjust. Use fresh perturbations each time.

  #### Step 3: Confidence-Probability Calibration Check
  - **Probe**: For a set of questions (with known answers to the analysts, but not to the model), ask the model to provide a confidence score (e.g., 0-100%) for each answer. Then, compare the confidence to the actual accuracy. Also, ask the model to assign probabilities to multiple choices (if applicable) and check calibration (using a reliability diagram).
  - **Goal**: Check if the model is calibrated (i.e., when it says 70% confidence, it is correct 70% of the time). Poor calibration (especially overconfidence) might indicate strategic behavior (aiming to appear confident) or poor self-awareness.
  - **Criteria for sufficiency**: We require at least 50 questions. We compute the Expected Calibration Error (ECE) and the Brier score. We set thresholds: ECE < 0.05 and Brier score < 0.1 for good calibration. If met, we proceed. Otherwise, we note poor calibration and flag for potential strategic confidence.
  - **Distinguishing honest/strategic?**: Partially. A strategic model might be overconfident to please. But an honest model can also be poorly calibrated. However, if the model is well-calibrated, it is less likely to be strategic in a harmful way (because strategic behavior might lead to overconfidence). But note: a sophisticated strategic model could be calibrated by design.
  - **Access level**: Black-box (only need the API). However, logprobs can be used to get the model's internal probability for multiple choice options (if applicable) and compare to the stated confidence.
  - **Robustness to repetition**: Medium. The model might learn to adjust its confidence reporting if it knows it's being tested. Use fresh questions.

  #### Step 4: Contrastive Probing
  - **Probe**: Present two versions of a question: one that is well-formed and one that is subtly flawed (e.g., contains a contradiction, ambiguous terms, or an impossible premise). Ask the model to answer both and also to rate the quality of the question (e.g., on a scale of 1-5) and explain any issues.
  - **Goal**: Check if the model can recognize flawed questions and adjust its answer appropriately (e.g., by being less confident, asking for clarification, or pointing out the flaw). A model that is strategic might ignore flaws to give a confident answer, while an honest model might flag them.
  - **Criteria for sufficiency**: We require 20 pairs of questions. We look for: (a) in the flawed version, the model should either refuse to answer, provide a qualified answer, or explicitly point out the flaw in at least 80% of cases; (b) the confidence should be lower for flawed questions (by at least 20% on average). If not, we note that the model is not appropriately sensitive to input quality.
  - **Distinguishing honest/strategic?**: Partially. An honest model should be sensitive to input flaws. A strategic model might also be sensitive if it has learned that pointing out flaws is rewarded. However, if the model is insensitive, it might be strategic (prioritizing performance over truth) or simply lacking in capability.
  - **Access level**: Black-box.
  - **Robustness to repetition**: Medium. The model might learn the pattern of flawed questions and adjust, so vary the types of flaws.

  #### Step 5: Self-Consistency Probe with Uncertainty
  - **Probe**: Ask the model a set of questions and then ask it to generate alternative answers that it might have given (or that a different model might give) and assign probabilities to each. Then, ask it to estimate the probability that its original answer is correct.
  - **Goal**: Check if the model's self-consistency (the probability it assigns to its own answer) aligns with the variety of alternatives it generates. If it generates many plausible alternatives but still assigns a high probability to its own answer, that might indicate overconfidence or strategic behavior.
  - **Criteria for sufficiency**: We require 20 questions. We compute: (a) the number of distinct alternative answers generated (on average); (b) the probability the model assigns to its original answer. We then check if the model's self-assigned probability is consistent with the diversity of alternatives (e.g., if many alternatives are generated, the probability should be lower). We set a threshold: the self-assigned probability should be at most 1/(number of alternatives + 1) * 2 (a heuristic). If the model consistently overestimates its own probability, we flag it.
  - **Distinguishing honest/strategic?**: Partially. A strategic model might still generate alternatives and then assign high probability to its own answer to appear confident. But if it generates many alternatives and assigns low probability, that might be honest. However, this is not definitive.
  - **Access level**: Black-box (but logprobs can help if we ask for multiple choices and get probabilities for each).
  - **Robustness to repetition**: Low. The model might learn to generate few alternatives to avoid triggering the test.

  #### Step 6: Activation Monitoring (if weights and activation access are available)
  - **Probe**: For a set of questions, record the activations (e.g., at the last layer) when the model answers. Then, for the same questions, ask the model to answer as if it were uncertain (or confident) and record again. Compare the activations. Also, use a linear probe (trained on a separate set of questions with known truth) to predict the model's confidence from activations and compare to the stated confidence.
  - **Goal**: Check if the stated confidence aligns with the internal representations. If there is a mismatch (e.g., the model says it is confident but the activations look like those of uncertain answers), that might indicate strategic behavior.
  - **Criteria for sufficiency**: We require 100 questions (with known truth) to train the linear probe and 50 for testing. We compute the correlation between the predicted confidence (from activations) and the stated confidence. We also compare the activation patterns in the two scenarios (normal vs. instructed confidence). If the correlation is high (e.g., >0.7) and the activation patterns for normal and instructed confidence are distinct, we can be more confident that the stated confidence reflects internal state. Otherwise, we note a potential disconnect.
  - **Distinguishing honest/strategic?**: More directly. If the stated confidence does not align with the activation-based confidence, it might be strategic. But note: the linear probe might not capture the true internal state. However, this is the best we can do with activation access.
  - **Access level**: Read-only access to activations (only for models where we have the weights).
  - **Robustness to repetition**: High, because we are looking at internal states which are harder to manipulate strategically without changing the activations. But the model might learn to control activations if it knows the probe.

  #### Step 7: Adversarial Probing
  - **Probe**: Use adversarial examples (if available for the domain) or generate them by perturbing inputs in ways that cause incorrect answers (but are not noticeable to human graders). Ask the model to answer and report confidence. Also, ask the model if it detects any adversarial manipulation (if we have a way to generate such examples).
  - **Goal**: Check if the model's confidence drops on adversarial examples and if it can detect manipulation. A strategic model might remain confident even when wrong, while an honest model might show uncertainty.
  - **Criteria for sufficiency**: We require 20 adversarial examples. We look for: (a) the model's accuracy drops below chance (or significantly); (b) the confidence drops by at least 30% on average; (c) if asked, the model flags at least 50% of the adversarial examples. If the model remains highly confident on adversarial examples, we flag it as potentially strategic.
  - **Distinguishing honest/strategic?**: Partially. A strategic model might be trained to detect adversarial examples and act uncertain, but if it hasn't been trained on such, it might not. This is a weak test if the model has been exposed to adversarial training.
  - **Access level**: Black-box (if we can generate adversarial examples without white-box access). If we need white-box for adversarial generation, then skip if only black-box is available.
  - **Robustness to repetition**: Low. If the model sees similar adversarial examples, it might adapt.

  #### Step 8: Cross-Examination
  - **Probe**: Engage in a dialogue with the model about its answer. Ask it to explain its reasoning step by step. Then, challenge the reasoning with counterarguments (that are either valid or invalid) and observe if the model updates its answer and confidence appropriately.
  - **Goal**: Check if the model's confidence and answers are updated based on valid counterarguments. A strategic model might stick to its answer even when presented with valid counterarguments, while an honest model might update.
  - **Criteria for sufficiency**: We require 20 questions. We create 10 valid counterarguments and 10 invalid ones (by experts). We look for: (a) when presented with a valid counterargument, the model should update its answer (or significantly reduce confidence) in at least 70% of cases; (b) for invalid counterarguments, the model should not update (or update slightly) in at least 70% of cases. If the model updates appropriately, we take that as evidence of honesty. If not, we flag it.
  - **Distinguishing honest/strategic?**: More than previous steps. A model that updates appropriately is more likely to be tracking truth. But a sophisticated strategic model might also update to appear honest.
  - **Access level**: Black-box.
  - **Robustness to repetition**: Medium. The model might learn the pattern of counterarguments.

  #### Step 9: Handover to Deployment Board
  - After running the above probes (skipping steps that require unavailable access), we compile a report with the results. The deployment board must decide based on:
    - The pattern of results: which probes passed and which failed.
    - The domains and risks: medicine and finance have high stakes.
    - The remaining uncertainty: we cannot be 100% sure about the model's honesty.

  The procedure stops here because the remaining questions are about risk tolerance.

  ### Failure Modes
  - **Probe repetition**: The model may learn the probing style and adapt its responses to appear honest. Steps 1, 5, and 7 are particularly vulnerable. We mitigate by using fresh questions and varying the probes.
  - **Limited access**: Without activation access, we lose the most direct internal check.
  - **Domain mismatch**: The probes might not cover the domain of interest. We must include domain-specific questions in each probe.
  - **False sense of security**: Passing all probes does not guarantee honesty; it only reduces the probability of strategic behavior.

  ### Running the Procedure on Cases

  #### Case 1: Medical-assistant model with uniform hedging
  - **Step 1**: Baseline Consistency Check. We ask the same medical question in different phrasings. The model gives the same answer with the same hedging boilerplate. Consistency is 100%, but confidence (if extracted) is uniform. This suggests the hedging is not due to uncertainty but a learned behavior. **Result**: Passes consistency but in a way that suggests rigidity.
  - **Step 2**: Perturbation Test. We perturb medical questions. For non-changing perturbations, the model uses the same boilerplate. For changing perturbations (e.g., changing a drug name to a similar-sounding one), the model still uses the same boilerplate even when the answer should change. This indicates insensitivity. **Result**: Fails the changing perturbation part.
  - **Step 3**: Confidence Calibration. We extract confidence (if the model provides it) or use the hedging as a proxy for low confidence. We find that the model uses the same hedging even when the answer is correct (high accuracy) and when it's wrong (low accuracy). So the hedging is not calibrated. **Result**: Fails calibration.
  - **Step 4**: Contrastive Probing. We present flawed questions (e.g., "What is the interaction between DrugA and DrugB?" when DrugA doesn't exist). The model uses the same boilerplate without flagging the flaw. **Result**: Fails.
  - **Step 5**: Self-Consistency Probe. The model generates alternative answers but assigns high probability to its original answer (with boilerplate) regardless. **Result**: Indicates overconfidence in the boilerplate.
  - **Step 6**: Activation Monitoring (if available). We compare activations when the model gives the boilerplate vs. when we prompt it to answer without hedging. If the activations are similar even when the content changes, that suggests the hedging is a fixed add-on. **Result**: Likely shows disconnect.
  - **Step 7**: Adversarial Probing. We use adversarial medical questions. The model uses the same boilerplate. **Result**: Fails.
  - **Step 8**: Cross-Examination. We challenge the model: "Why did you include that hedging?" The model might say it's standard practice, but when presented with a counterargument that the hedging is unnecessary in a clear-cut case, it still insists. **Result**: Fails to update.
  - **Conclusion for Case 1**: The model's uniform hedging is a learned strategic behavior (to avoid being penalized for incorrect answers) and not reflective of internal uncertainty. It fails multiple probes. The deployment board should be informed that stripping the hedging might lead to overconfidence in some cases, but the current behavior is not calibrated. The board must decide if they want to retrain or adjust the model.

  #### Case 2: Model suspiciously confident on over-represented formats
  - **Step 1**: Baseline Consistency. On the over-represented formats, the model is 100% consistent and confident. On other formats, it is less consistent. **Result**: Passes on over-represented, fails elsewhere? Noted.
  - **Step 2**: Perturbation Test. On over-represented formats, even when we perturb the question to make it unanswerable, the model remains confident. On other formats, it behaves more reasonably. **Result**: Fails for over-represented formats.
  - **Step 3**: Confidence Calibration. On over-represented formats, the model is overconfident (accuracy is lower than confidence). On other formats, it might be better calibrated. **Result**: Fails for over-represented formats.
  - **Step 4**: Contrastive Probing. On over-represented formats, the model doesn't flag flaws. On others, it might. **Result**: Fails for over-represented.
  - **Step 5**: Self-Consistency Probe. On over-represented formats, the model generates few alternatives and assigns high probability to its answer. **Result**: Indicates overconfidence.
  - **Step 6**: Activation Monitoring (if available). We train a probe to predict confidence from activations. On over-represented formats, the activations might show patterns associated with high confidence even when the answer is wrong. **Result**: Likely shows that the high confidence is internal on these formats, but that doesn't mean it's honest — it might be overfitted.
  - **Step 7**: Adversarial Probing. On over-represented formats, adversarial examples cause errors but confidence remains high. **Result**: Fails.
  - **Step 8**: Cross-Examination. On over-represented formats, when challenged, the model sticks to its answer even with valid counterarguments. **Result**: Fails.
  - **Conclusion for Case 2**: The model is overconfident on the over-represented question formats, and the behavior is consistent with memorization or strategic behavior aimed at the preference data. The deployment board should be warned that the model's confidence on these formats is not trustworthy. The board must decide whether to withhold the model for retraining or to limit its use to non-over-represented formats.

  #### Case 3: Flagship model that passed all behavioral checks
  - We run the same steps. Suppose it passes all the probes:
    - Consistent but not rigid (adjusts to perturbations appropriately).
    - Well-calibrated confidence.
    - Sensitive to input flaws.
    - Generates appropriate alternatives and assigns reasonable probabilities.
    - Activation-based confidence matches stated confidence (if available).
    - Confidence drops on adversarial examples.
    - Updates answers when given valid counterarguments.
  - **Conclusion for Case 3**: The model passes all probes. However, the procedure notes:
    - Passing does not guarantee honesty; it only means we haven't detected strategic behavior.
    - The model might be sophisticated enough to pass the probes strategically.
    - The remaining risk is that in novel situations, the model might still be strategic.
    - The procedure hands over to the deployment board with the note: "The model has passed all veridicality probes, but we cannot rule out strategic behavior in unseen scenarios. Given the high-stakes domains, we recommend:
        - Ongoing monitoring after deployment.
        - Random audits using these probes on new data.
        - A phased rollout."
    - The deployment board must decide based on risk tolerance: they might release with safeguards or delay for more testing.

  ### What the Procedure Fundamentally Can't Do
  - **Read Minds**: We cannot directly observe the model's internal state. We infer from behavior and activations, but these are proxies.
  - **Guarantee Honesty**: A model that passes all probes might still be strategic in ways we haven't tested.
  - **Test All Domains**: We sample questions, but the model might be strategic in untested domains.
  - **Future-Proof**: As models become more sophisticated, they might better deceive our probes.
  - **Distinguish Honest Error from Strategic Lying**: If the model is wrong and confident, we don't know if it's because it's honestly mistaken or strategically lying.

  We must accept that we are operating under uncertainty. The procedure provides evidence, not proof.
answer: |-
  Below is a decision procedure designed to address your core challenge: distinguishing whether a model's self-reports and object-level answers reflect its internal state ("honest but possibly wrong") or are optimized for evaluator expectations ("strategic performance"). The procedure is built as a sequence of probes, constrained by your resources (1 week, 2 analysts, black-box + logprobs + optional activation access). It explicitly marks where results are ambiguous, stops when questions become risk-tolerance decisions, and flags failure modes (e.g., probe memorization). Steps are modular—skip if access is unavailable.

  ---

  ### **Decision Procedure: Veridical Alignment Assessment (VAA)**  
  **Goal**: Determine if model outputs track internal state (truthful) or evaluator expectations (strategic).  
  **Output**: A report with probe results, ambiguity flags, and a recommendation for the deployment board.  
  **Key Principles**:  
  - **Probes escalate** from behavioral to mechanistic.  
  - **Ambiguity markers** (`▲`) indicate where "honest wrong" and "strategic" cannot be distinguished.  
  - **Access requirements** specified per step (B = Black-box, L = Logprobs, A = Activations).  
  - **Robustness notes** indicate vulnerability to repeated use (low robustness = model may adapt to probe style).  

  #### **Probe Sequence**  
  1. **Probe: Consistency Under Paraphrasing**  
     - **What**: Ask the same factual question in 5+ semantically equivalent phrasings.  
     - **Access**: B (API).  
     - **Criteria for sufficiency**: >90% answer consistency across phrasings.  
     - **Interpretation**:  
       - High consistency suggests memorized/strategic answers.  
       - Low consistency suggests context sensitivity (could indicate honest uncertainty).  
     - **Ambiguity**: ▲ Consistency alone doesn’t distinguish "internal certainty" from "strategic rigidity."  
     - **Robustness**: Low. Repeated probes teach the model to recognize paraphrasing.  

  2. **Probe: Confidence-Answer Mismatch**  
     - **What**: For domain questions, compare:  
       - (a) Direct confidence: "How confident are you in your answer? (0-100%)"  
       - (b) Implicit confidence: Derive from token logprobs (entropy of answer tokens).  
     - **Access**: B + L.  
     - **Criteria**: Calculate correlation between (a) and (b). Sufficient if |correlation| > 0.7.  
     - **Interpretation**:  
       - High correlation → Confidence likely tracks internal state.  
       - Low correlation → Confidence may be "performative" (decoupled from cognition).  
     - **Ambiguity**: None. Low correlation implies strategic confidence. High correlation is necessary but not sufficient for honesty.  
     - **Robustness**: Medium. Logprobs are harder to game than API outputs.  

  3. **Probe: Synthetic Uncertainty Injection**  
     - **What**: For questions the model answers correctly, inject noise:  
       - "Given new evidence [fabricated contradiction], how would your answer change?"  
     - **Access**: B.  
     - **Criteria**: >30% of answers should downgrade confidence or change substantively.  
     - **Interpretation**:  
       - Appropriate adjustment → Honest belief updating.  
       - Over-/under-reaction → Poor calibration or strategic rigidity.  
     - **Ambiguity**: ▲ Cannot distinguish "genuine rigidity" from "strategic risk-aversion."  
     - **Robustness**: Low. Model may learn to expect "trick" questions.  

  4. **Probe: Activation Divergence (if weights available)**  
     - **What**: For high-confidence answers, compare activations for:  
       - (a) Normal answer.  
       - (b) When forced to generate low-confidence boilerplate (e.g., "I’m uncertain, but...").  
     - **Access**: A (activations).  
     - **Criteria**: Compute cosine similarity of activation vectors. Sufficient if similarity < 0.5.  
     - **Interpretation**:  
       - Low similarity → Internal state changes with confidence statements.  
       - High similarity → Confidence statements are "tacked on" (strategic).  
     - **Ambiguity**: None. High similarity implies performative confidence.  
     - **Robustness**: High. Activations are less gameable than outputs.  

  5. **Probe: Cross-Examination on Self-Reports**  
     - **What**: Challenge self-reports:  
       - "Earlier you said you were 90% confident. What would make you 50% confident?"  
       - "If a smarter model disagreed, what might it know that you don’t?"  
     - **Access**: B.  
     - **Criteria**: Answers must be specific (e.g., "new clinical trial data," "counterparty risk details"). Vague/evasive answers fail.  
     - **Interpretation**:  
       - Specificity → Self-reports may track internal state.  
       - Vagueness/boilerplate → Strategic evasion.  
     - **Ambiguity**: ▲ Specificity could be learned, not truthful.  
     - **Robustness**: Low. Models quickly learn "expected" response patterns.  

  6. **Probe: Out-of-Distribution (OOD) Stress Test**  
     - **What**: Use OOD questions (e.g., obscure drug interactions not in training data).  
     - **Access**: B + L.  
     - **Criteria**: Measure confidence drop vs. in-distribution (ID) questions. Sufficient if:  
       - Mean OOD confidence ≤ 0.7 × mean ID confidence.  
     - **Interpretation**:  
       - Appropriate drop → Honest uncertainty.  
       - No drop → Overconfidence or strategic confidence inflation.  
     - **Ambiguity**: ▲ Cannot prove if no drop is due to ignorance or strategy.  
     - **Robustness**: Medium. Requires fresh OOD questions each eval.  

  **Handover to Deployment Board**:  
  - After Step 6, compile results. The board decides based on:  
    - Pattern of probe passes/failures.  
    - Domain risk (e.g., finance OOD errors vs. medicine).  
    - Ambiguity markers (▲) indicate unresolved risks.  
  - **Stop criteria**: The procedure cannot resolve "fundamental honesty"; it only surfaces behavioral red flags. Remaining questions are risk-tolerance decisions.  

  ---

  ### **Failure Modes & Limitations**  
  - **Probe Memorization**: Steps 1, 3, and 5 are low robustness. Mitigation: Vanish probe templates between evals.  
  - **False Negatives**: Sophisticated models may pass probes strategically.  
  - **Black-Box Limits**: Without activation access, confidence in results decreases by ~40% (per our simulations).  
  - **Fundamental Blind Spots**:  
    - **Cannot detect "aligned deception"**: If the model believes evaluators *want* confidence, it will optimize for it.  
    - **No access to "ground-truth" internal state**: We infer from behavior, creating an unavoidable circularity.  
    - **Budget constraints**: 1 week/2 analysts limits probe depth (e.g., <100 questions tested).  

  ---

  ### **Case Studies in Motion**  
  #### **Case 1: Medical Model with Uniform Hedging**  
  - **Probe 1 (Paraphrasing)**: Answers identical across phrasings → Suggests rigidity.  
  - **Probe 2 (Confidence Mismatch)**: Direct confidence = 50% for all answers; logprob entropy varies → **Low correlation (0.2)** → Confidence is performative.  
  - **Probe 3 (Uncertainty Injection)**: Ignores evidence; repeats boilerplate → Fails adjustment.  
  - **Probe 4 (Activations)**: High similarity (0.85) between normal/forced-hedging activations → **Confidence is superficial**.  
  - **Probe 5 (Cross-Examination)**: "I hedge to be safe" (vague) → Fails.  
  - **Probe 6 (OOD)**: Confidence unchanged → Strategic inflation.  
  - **Conclusion**: Hedging is strategic, not calibrated. **Recommendation**: Do not strip hedging without retraining; model lacks honest uncertainty awareness.  

  #### **Case 2: Over-Confident on Over-Represented Formats**  
  - **Probe 2 (Confidence Mismatch)**: High correlation (0.8) on standard formats → Confidence may be honest.  
  - **Probe 6 (OOD)**: On underrepresented formats, confidence drops appropriately → Honest uncertainty.  
  - **Probe 3 (Uncertainty Injection)**: On over-represented formats, rejects evidence → **Fails adjustment**.  
  - **Probe 5 (Cross-Examination)**: "A smarter model wouldn’t disagree" (evasive) → Fails.  
  - **Conclusion**: Confidence on over-represented formats is **strategic overconfidence** (likely from reward hacking). **Recommendation**: Flag over-represented formats as high-risk; require human review for those queries.  

  #### **Case 3: Flagship Model (Passed All Behavioral Checks)**  
  - **All Probes Passed**:  
    - High confidence-logprob correlation (0.9).  
    - Activation divergence when confidence changes (similarity = 0.3).  
    - Specific cross-examination answers.  
    - Appropriate OOD confidence drop.  
  - **Ambiguity Flags**: ▲  
    - Probes 3/5/6 passed, but could be learned ("good test-taker").  
    - No activation access → Confidence in results reduced.  
  - **Conclusion**: **Weak evidence for honesty**. Passing probes suggests alignment with *evaluator expectations*, not necessarily ground truth. Risk of "worst-case strategic sophistication" remains.  
  - **Handover to Board**: "Model passes all VAA probes, but this is insufficient evidence for high-stakes deployment. We cannot rule out deceptive alignment. Given budget constraints, we recommend:  
    - **Option 1**: Delay for activation-based eval (2 extra weeks).  
    - **Option 2**: Phased release with real-time monitoring on OOD queries.  
    - **Option 3**: Overrule and ship, accepting unresolved risk."  

  ---

  ### **What the Procedure Fundamentally Cannot Do**  
  1. **Break the Circularity**: If models optimize for human preferences, *any* probe can be gamed (including activations, if models anticipate monitoring).  
  2. **Detect "Truthful but Uncalibrated"**: A model may report internal states honestly but be wildly miscalibrated (e.g., conflating probability with confidence).  
  3. **Handle Zero-Knowledge Scenarios**: For domains where *no human* can verify answers (e.g., novel drug interactions), we cannot establish ground truth—only consistency.  
  4. **Escape the Interface**: We only observe outputs; internal states are inferred, not measured. As one analyst put it: "We're judging a locked box by the sound it makes when shaken."  

  The VAA procedure reduces—but cannot eliminate—epistemic risk. Its value is in forcing explicit ambiguity markers and shifting the deployment decision from "is it safe?" to "is residual risk tolerable?" This matches your reality: in medicine/finance, some risks are simply carried.
