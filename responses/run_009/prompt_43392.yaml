  ### **First-Time Facilitator Tips**  
  - **Dry Run**: Test with a friend to nail timing.  
  - **Embrace Chaos**: If a group "rebels," use it in debrief (*"Why did downsides feel unfair?"*).  
  - **Name Drop Late**: As planned, reveal Leibniz only at the end—it makes the "aha!" moment stronger.  
  - **Voltaire Hook**: End with: *"Next session, we can read Candide’s take—see if Voltaire was right!"*  

  This design makes the abstract visceral. Players won’t just debate "best possible world"—they’ll *frustrate* over it, which is where philosophy thrives. Let me know if you need tweaks!
