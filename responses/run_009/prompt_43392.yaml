  - Start by asking: "How did it feel to design your world? Were there interventions that you wanted to add but couldn't because of the downside?"
  - "Did any group feel that their world was the best possible? Why or why not?"
  - "What happened when you saw another group's world? Did you see interventions that you wished you had?"
  - "What about when we added interventions in the raiding rounds? Did you ever feel that an intervention wasn't worth the downside? How did you decide?"
