  Base World Card:
  "Your starting world is much like our current world. It has a mix of good and bad: 
  - There is beauty and love, but also suffering and pain.
  - There is technological progress, but also environmental challenges.
  - There are moments of peace, but also conflicts and wars.
  - There are diseases that cause suffering, but also medical advancements that save lives.
  - There is inequality, but also movements for justice.

  Your goal: Make this world better by choosing interventions, but be aware that every change has a cost."

  Logistics:

  - Time: 
    - Introduction: 5 minutes
    - Phase 1 (building): 15 minutes
    - Phase 2 (raid 1): 10 minutes
    - Phase 3 (raid 2): 10 minutes
    - Phase 4 (presentations): 2 min per group (about 6-8 minutes for 3-4 groups)
    - Debrief: 15 minutes
    - Total: ~60 minutes, leaving some buffer.

  - Materials per group:
    - One Base World Card
    - 5 intervention slips (positive only) - these are small pieces of paper with the positive description.
    - One large sheet of paper (or a few index cards) to write their world: base, then each intervention and downside.

  - Facilitator has:
    - Master list of interventions and their downsides.

  - For the raiding phase: groups walk around to see other groups' large sheets.

  Name: We'll call the game "World Builders: The Trade-Off Game" for now. Avoid Leibniz's name until the end.

  Debrief Talking Points:

  1. The experience of trade-offs: Every improvement came with a cost. How did that feel? Did it change how you viewed the interventions?

  2. The idea of "best": Did any group feel they achieved the best world? Why or why not? What would it take to be the best?

  3. The infinite regress: We did two rounds of raiding, but what if we did 10? 100? Would we ever stop? This illustrates that the concept of "the best possible world" might be like the largest integer: you can always add one more improvement (with a cost), but that doesn't mean there's a maximum.

  4. What the game misses: 
     - In Leibniz's view, God would have chosen a world that maximizes the overall good, and the downsides we see (like suffering) might be necessary for a greater good (e.g., free will, character development). Our game presented arbitrary downsides, but in reality, the connections might be more complex.
     - We had limited interventions. In reality, there might be infinitely many possible worlds.

  5. Connect to Voltaire's criticism: Voltaire satirized this idea in "Candide", where the character Pangloss insists that this is the best of all possible worlds despite witnessing terrible suffering. The game might help us see why that view can be hard to accept when faced with real suffering.

  Finally, reveal that the idea comes from Leibniz and that Voltaire made fun of it. Ask: "Having played the game, do you find the idea more understandable? Or do you still side with Voltaire?"

