prompt: |-
  My friend and I got into a marathon argument last weekend (like five hours, we ordered a second pizza) about longtermism and I'm still chewing on it. She's a strong longtermist -- not the watered-down "the future matters a bit" version, but the view that, because there could be so many people in the future, reducing existential risk basically swamps every other moral consideration, and that things like global poverty just don't compare in scale. I pushed back on a bunch of fronts and she had answers for all of them, some of which I honestly couldn't rebut on the spot. Rather than re-argue it with her I want to actually get my head straight about where the real weak points are.

  For context on who's asking: I'm a mid-30s software engineer, no kids, could realistically either donate a big chunk of income, try to switch into some kind of AI safety or biosecurity work, or just keep living my normal life and stop thinking about this. So the prioritization I care about is practical-slash-personal, not "what should academia work on next."

  Here's what I want: of the open questions in this debate -- and I'll list a few we hit but don't feel bound to them -- which ones actually matter for a decision like mine, and which are academic in the bad sense, where even settling them wouldn't change what I should do? The ones we hit were: whether we're just clueless about the long-run effects of anything we do (she granted this more than I expected but said it cuts both ways); whether person-affecting views are right, i.e., whether preventing people from existing can even be bad for them; whether the far future is actually likely to be good rather than a vast mediocre or bad thing that we'd be helping to perpetuate; whether "existential risk" lumps together qualitatively different things (permanent collapse that might be recoverable vs. true extinction vs. locking in bad values forever); and whether expected-value reasoning just breaks at these tiny-probability-huge-payoff scales, including the kind of case where you'd have to take a deal that's almost certainly worthless for a one-in-a-billion shot at astronomical value.

  So rank the open questions for me, and defend the ranking. What I mean by defend: tell me which of these is upstream of the others (e.g., is cluelessness the thing that everything else quietly depends on?), which are tractable in the sense that ordinary reasoning and evidence could move them in my lifetime rather than needing new physics or a solved population ethics, and which are neglected not because they're unimportant but because nobody's incentivized to work on them. And for the ones you'd deprioritize for my purposes, say whether that's because they don't matter for the decision or because no realistic update on them would change my options.

  Also, maybe more useful than the ranking itself: what evidence or arguments, over the next few years, should I be watching for that would most change where this all lands? Like, what would make even a fairly committed longtermist say "okay, actually donate to bednets instead," and what would make a skeptic like me flip?

  Two housekeeping things: please write in American English (I've been reading too much British EA writing and it's messing with me, "whilst" needs to leave my vocabulary), and don't give me a reading list -- assume I can't look anything up, just explain the ideas inline as you go.
reasoning: |-
  Okay, the user is a mid-30s software engineer who had a marathon debate about longtermism with a friend. He's trying to figure out which open questions in the debate actually matter for his personal decision about donating, career changes, etc. He listed several points they discussed: cluelessness, person-affecting views, future quality, types of existential risks, and expected-value reasoning at extremes.

  First, I need to understand his core need. He wants to prioritize which philosophical questions have practical implications for his actions. He's not interested in academic debates that won't affect his choices. His options are donating to global health, switching to AI safety/biosecurity, or doing nothing. 

  Breaking down each point. Cluelessness seems crucial because if we can't predict long-term effects, longtermism's foundation wobbles. But his friend argued it cuts both ways. For someone deciding between bednets and AI safety, this uncertainty might push him towards near-term work where impacts are more predictable. 

  Person-affecting views: If preventing future people from existing isn't bad, then reducing extinction risk isn't a moral imperative. But if he rejects this view, it might not change much—longtermism could still be compelling under other ethics. So maybe this is less critical for his decision.

  Future quality matters because if the future is likely bad, preventing extinction might be harmful. But evidence here is tricky—extrapolating current trends is speculative. For practical purposes, unless strong evidence emerges that the future will be net negative, this might not sway him. 

  Existential risk types: Locking in bad values vs. extinction could affect how he prioritizes risks. AI alignment might prevent value lock-in, while asteroid defense doesn't. If he considers value lock-in a major risk, AI safety becomes more urgent. This could directly influence whether he switches careers.

  Expected-value reasoning at extremes: Betting on tiny probabilities of huge payoffs might not be rational if those probabilities are poorly estimated. If he thinks AI risk estimates are too speculative, he might favor more certain near-term interventions. This ties into tractability—how reliable are risk estimates?

  Ranking these: Cluelessness and expected-value robustness are top because they underpin the feasibility of longtermist actions. If predictions are too unreliable, the whole approach falters. Risk typology is next since it affects which risks to focus on. Future quality and person-affecting views are lower; even if resolved, they might not change the best course of action given uncertainties.

  For evidence to watch: AI forecasting track records, convergence in AI safety research, and unexpected developments in biosecurity or climate could shift priorities. If AI timelines become clearer or interventions prove effective, that might validate longtermism. Conversely, persistent cluelessness or failed predictions could undermine it.

  He also mentioned personal context—no kids, able to donate or switch careers. His decision isn't just theoretical; it's about where to allocate his resources now. The ranking should reflect what could realistically change his actions in the next few years.
answer: |-
  Here's a ranking of the open questions based on **practical impact on your decision**, **tractability for evidence-based updates**, and whether they're "upstream" issues that influence others. I'll flag which ones are likely academic dead ends for *your* purposes and what evidence could shift the needle.

  ### Ranking (Most to Least Decision-Relevant)
  1.  **Expected-Value Reasoning at Extreme Scales (Does it break?)**
      *   **Why it's #1:** This is the **engine of longtermism**. If this breaks, the whole "astronomical stakes" argument collapses, making poverty/health interventions competitive again. It directly asks: *Can you rationally bet everything on tiny probabilities of vast future value?* If "no," then longtermism's core prioritization fails.
      *   **Upstream?** Yes. It fundamentally dictates whether the "scale" argument even works.
      *   **Tractable?** Surprisingly yes. We can look at real-world domains involving low-probability, high-impact events (e.g., complex engineering, insurance, pandemic forecasting) and see if calibrated experts can reliably apply expected value there, or if cognitive biases/unknown unknowns dominate. Watch for: Studies on the *track record* of extremely low-probability, high-stakes predictions (especially in AI timelines/outcomes). If these forecasts consistently prove wildly overconfident, it weakens the case.
      *   **Neglected?** Somewhat. "Epistemic hygiene" around estimating tiny probabilities gets less attention than debating the probabilities themselves. Robust critiques (like "Pascal's Mugging" concerns) exist but need more empirical grounding.
      *   **Decision Impact:** HIGH. If EV reasoning fails here, longtermist priorities lose their trump card. Evidence here could genuinely flip you to bednets or make you double down.

  2.  **Cluelessness (Can we predict long-term effects?)**
      *   **Why it's #2:** This is the **practical reality check**. Even if EV reasoning *can* work in theory, cluelessness asks *can we actually get reliable inputs for it?* If we're fundamentally clueless, directing effort towards specific longterm goals (like AI safety) might be futile or even counterproductive. It cuts both ways, but the burden is on longtermists to show their interventions *aren't* lost in the noise of history.
      *   **Upstream?** Influences *how* we approach all other questions (e.g., future quality, risk typology). If cluelessness reigns, detailed arguments about types of extinction risk become less actionable.
      *   **Tractable?** Moderately. Look for evidence of successful *long-range* causal forecasting. Does work in AI safety/biosecurity show clear, measurable pathways to reducing risk? Or are interventions constantly shifting based on new unknowns? Watch for: Concrete examples where longtermist interventions (e.g., specific AI governance policies, biosecurity protocols) demonstrably *changed* a predicted long-term trajectory for the better *in a way attributable to that intervention*. Lack of such evidence strengthens cluelessness.
      *   **Neglected?** Increasingly recognized, but practical solutions (beyond "diversify") are underdeveloped.
      *   **Decision Impact:** HIGH. Strong cluelessness argues for: a) Focusing on robustly good near-term things (bednets), b) Working on reducing cluelessness itself (e.g., better forecasting), or c) Diversifying longtermist efforts. Weak cluelessness supports focused X-risk work.

  3.  **Existential Risk Typology (Lumping vs. Splitting)**
      *   **Why it's #3:** This **shapes your specific actions**. Preventing "lock-in of bad values" (e.g., by misaligned AI) is philosophically and practically *very different* from preventing extinction (asteroid defense) or even permanent collapse. If lock-in is the dominant, tractable risk (especially via AI), switching to AI safety becomes compelling. If extinction/collapse dominates, or risks are truly inseparable, broader X-risk reduction might be the focus.
      *   **Upstream?** No. It builds on accepting that *some* X-risks matter astronomically.
      *   **Tractable?** Yes. Evidence on the relative likelihood, tractability, and distinct mechanisms of different X-risks is actively debated. Watch for: Developments in AI capabilities/alignment research. Does AI progress make lock-in seem *more* or *less* likely/tractable? Are there breakthroughs in "value learning" or catastrophic risk mitigation? Similarly, watch for progress in asteroid detection/deflection or biosecurity. Evidence can shift which risks seem most pressing and actionable *for you*.
      *   **Neglected?** Less so recently, especially regarding AI alignment vs. other risks.
      *   **Decision Impact:** MEDIUM-HIGH. This directly informs *which longtermist path* (if any) is best. Evidence could shift you from AI safety to bio, or vice-versa, *within* a longtermist framework. Less likely to flip you *out* of longtermism entirely.

  4.  **Future Quality (Likely Good, Mediocre, or Bad?)**
      *   **Why it's #4:** If the future is net negative, reducing X-risk is actively harmful. However, this argument faces a high bar: You need strong reasons to believe a *post-human, galaxy-spanning* future is *more likely than not* to be net bad *on average*. This is extremely speculative.
      *   **Upstream?** Somewhat – it challenges the assumed sign (positive) of the astronomical value.
      *   **Tractable?** Low. Evidence is primarily philosophical (interpreting trends, moral weights of potential future beings) or based on highly uncertain extrapolations. Watch for: Truly unprecedented, large-scale negative trends that seem irreversible and inherent to advanced civilizations (e.g., conclusive evidence of a "Great Filter" that always leads to suffering-dominated futures). Barring something dramatic, this is unlikely to resolve decisively.
      *   **Neglected?** Discussed, but inherently hard to make progress on.
      *   **Decision Impact:** LOW-MEDIUM. For a *practical* decision now, the burden of proof is on showing the future is *likely net bad*. Absent strong evidence for that (which is scarce), this doesn't override the scale argument. Settling it likely wouldn't change your near-term choice unless catastrophic future evidence emerges.

  5.  **Person-Affecting Views (Is preventing existence bad?)**
      *   **Why it's #5:** While philosophically deep, this is **largely academic *for your decision***. Even if preventing future people *isn't* bad *for them*, longtermism often uses "impersonal" total utilitarianism (more happy lives = better) or similar, which doesn't rely on harming specific individuals. Your friend likely uses this impersonal version.
      *   **Upstream?** Philosophically yes, but practically no. Longtermism can run on impersonal views.
      *   **Tractable?** Very Low. This is pure population ethics philosophy, unlikely to be resolved by evidence. It's a matter of foundational moral intuition.
      *   **Neglected?** No, heavily debated in philosophy, but resolution seems distant.
      *   **Decision Impact:** VERY LOW. Even if you fully embraced person-affecting views, an impersonal longtermist would still argue you should care about the astronomical *impersonal* loss of potential value. Rejecting person-affecting views doesn't *hurt* the longtermist case. This debate is unlikely to change your action.

  ### What Evidence Could Flip You (or a Longtermist)?
  *   **Flip YOU to Longtermism/AI Safety:**
      *   **Concrete AI Risk Pathways:** Demonstrations that specific, tractable technical AI safety problems, if solved, would *reliably* reduce a major class of catastrophic risk (e.g., scalable oversight working on near-future models).
      *   **Improved Forecasting Track Record:** A community (like AI forecasters) demonstrably and consistently making accurate, calibrated predictions about complex, low-probability, high-stakes events over 5-10 years.
      *   **Convergence on Solutions:** Clear signs that the field of AI safety/biosecurity is converging on actionable, high-leverage interventions with broad expert consensus on their effectiveness.
  *   **Flip a Longtermist (or You) to Near-Term Work:**
      *   **Persistent Cluelessness:** A consistent failure to identify any longtermist interventions with clear, attributable, positive long-range effects, coupled with evidence that such forecasting is inherently unreliable.
      *   **EV Reasoning Failure:** Strong empirical evidence or robust theoretical arguments showing that expected-value calculations systematically fail or lead to absurd/ineffective decisions when dealing with tiny probabilities of vast impacts *in real-world domains analogous to X-risk*.
      *   **Unexpected Near-Term Leverage:** A dramatic, unforeseen improvement in the cost-effectiveness or tractability of solving a major near-term problem (e.g., a breakthrough making malaria eradication vastly cheaper/faster).
      *   **Rise of a Clear "Lock-In" Threat:** Overwhelming evidence that a specific *bad* future (e.g., a particular dystopian AI scenario) is highly likely and tractable to prevent *only* via specific near-term actions that *aren't* general X-risk reduction (though this might just shift longtermism towards preventing *that* lock-in).

  ### Bottom Line for Your Decision
  *   **Focus Your Scrutiny:** Pay most attention to **Expected Value at Extremes** and **Cluelessness**. These are the pillars. If they hold up under evidence, longtermism has a strong claim. If they crack, its priority fades.
  *   **Watch Risk Typology:** If you lean towards longtermism, **Risk Typology** dictates whether AI safety is the top priority or if other risks deserve your focus/donations. Track developments in AI alignment and other X-risk domains.
  *   **Don't Sweat Person-Affecting/Future Quality (Much):** These are unlikely to provide decisive reasons *against* longtermism for practical action, given the current state of evidence and arguments. Future Quality only matters if strong *negative* evidence emerges.

  Your next step isn't re-arguing, but watching for **tangible evidence on forecasting reliability and concrete progress in understanding/mitigating specific existential risks (especially AI) over the next 2-5 years.** That's where the rubber meets the road for turning this philosophy into a practical career/donation choice.
