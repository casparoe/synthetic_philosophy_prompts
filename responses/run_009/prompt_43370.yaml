  Below is a diagnostic decision tree designed to sort readers by their judgments on concrete cases regarding the moral difference between lying and misleading. It uses your specified cases (murderer at the door, paltering, scalar implicature, and artful questioning under oath) as internal nodes, avoids theoretical jargon, and prioritizes case-based judgments over allegiance to philosophical schools. The root question focuses on **why lying is wrong**, as this efficiently branches into major viewpoints. Leaves include all six positions you requested, plus two additions to cover the logical space.  

  Unoccupied combinations are marked with a brief diagnosis. Pairs of leaves the tree *cannot* separate (due to overlapping case judgments) are explicitly flagged at the end.  

  ---

  ### **Diagnostic Decision Tree: Is There a Morally Significant Difference Between Lying and Misleading?**  
  **Instructions**: Answer each question based on your intuitive moral judgment of the case. Do not overthink—go with your gut.  

  ---

  #### **ROOT: Why is lying wrong?**  
  *(Choose the option closest to your view)*  
  - **A**: Because you’re **saying something you believe is false** (you’re violating a basic rule of honesty by speaking falsely).  
  - **B**: Because you’re **trying to make someone believe something false** (the goal is deception, regardless of how you achieve it).  
  - **C**: Because it **often causes harm or breaks trust** (the problem is the damage it does).  

  ---

  #### **Branch for A (saying something false is wrong)**  
  1. **MURDERER AT THE DOOR**: A killer is at your door, asking where your friend is. You know your friend is hiding in the basement. You say, "He’s not in the kitchen" (which is true), knowing the killer will take this to mean your friend is elsewhere in the house and leave.  
     - **Yes**: This is morally acceptable. → Go to 2.  
     - **No**: This is morally wrong. → Go to 3.  

  2. **PALTERING IN NEGOTIATION**: You’re selling a used car. You know it was in a major crash, but you only say: "It has new brakes and a fresh paint job!" (true, because repairs were done after the crash). You stay silent about the crash, knowing the buyer will assume the car is reliable.  
     - **Yes**: This is morally acceptable. → Go to 4.  
     - **No**: This is morally wrong. → Go to 5.  

  3. **ARTFUL QUESTIONING UNDER OATH**: In court, a lawyer asks you: "Did you see the defendant at the crime scene on the night of the 15th?" You saw him there after midnight (technically the early hours of the 16th). You say "No" (true, since it was the 16th), knowing the jury will think he wasn’t there at all.  
     - **Yes**: This is morally acceptable. → **Leaf 1: Kantian strict-difference**  
       *Lying (saying false things) is always forbidden, but misleading with truth is permissible, especially in high-stakes cases like the murderer or court testimony.*  
     - **No**: This is morally wrong. → **Unoccupied**  
       *Diagnosis: Inconsistent with Branch A—if you reject truthful misleading even in extreme cases, your view likely aligns with "no intrinsic difference" (Branch B).*  

  4. **IS LYING ALWAYS WRONG?**: In the murderer case, would it be morally acceptable to lie (e.g., say "He went to the store")?  
     - **Yes**: **Unoccupied**  
       *Diagnosis: Incoherent—if lying is wrong because it states false beliefs, permitting it here contradicts your root choice.*  
     - **No**: **Leaf 1: Kantian strict-difference** (as above)  

  5. **SCALAR IMPLICATURE**: A colleague asks: "Do some of your coauthors smoke?" You answer "Yes" (true, since all of them do), knowing they will think only some do.  
     - **Yes**: This is morally acceptable. → **Leaf 2: Assertion-norm moderate**  
       *Lying is worse than misleading because it violates a core rule of communication, but the gap can shrink in trivial cases like this. Misleading is still wrong in high-stakes cases like paltering.*  
     - **No**: This is morally wrong. → **Leaf 3: No-intrinsic-difference deception view**  
       *Lying and misleading are equally wrong because both intend to deceive. Paltering, scalar cases, and artful questioning are all forms of lying.*  

  ---

  #### **Branch for B (trying to deceive is wrong)**  
  1. **MURDERER AT THE DOOR** (same case as above):  
     - **Yes**: Misleading is acceptable. → Go to 2.  
     - **No**: Misleading is wrong. → Go to 3.  

  2. **PALTERING IN NEGOTIATION** (same case as above):  
     - **Yes**: This is morally acceptable. → **Unoccupied**  
       *Diagnosis: Unattractive—if deception is wrong, permitting manipulative paltering conflicts with your root choice.*  
     - **No**: This is morally wrong. → Go to 4.  

  3. **ARTFUL QUESTIONING UNDER OATH** (same case as above):  
     - **Yes**: This is morally acceptable. → **Leaf 5: Contextual deflationary view**  
       *The lying/misleading distinction is linguistically real but morally irrelevant. What matters is the context (e.g., saving a life vs. courtroom duty). Misleading is acceptable in the murderer case but wrong in court.*  
     - **No**: This is morally wrong. → **Leaf 3: No-intrinsic-difference deception view** (as above)  

  4. **SCALAR IMPLICATURE** (same case as above):  
     - **Yes**: This is morally acceptable. → **Leaf 6: Consequentialist**  
       *Lying and misleading have no fixed moral difference—it depends on consequences. Scalar misleading is harmless, but paltering is wrong due to potential harm.*  
     - **No**: This is morally wrong. → **Leaf 4: Misleading-can-be-worse**  
       *Misleading (e.g., paltering or artful testimony) is often worse than lying because it exploits trust and makes the victim complicit in their deception. Lying is more direct and less corrosive.*  

  ---

  #### **Branch for C (consequences/harm make lying wrong)**  
  1. **MURDERER AT THE DOOR** (same case as above):  
     - **Yes**: Misleading is acceptable. → **Leaf 6: Consequentialist**  
       *Lying and misleading have no intrinsic moral difference—only consequences matter. Misleading is acceptable here because it saves a life; lying would be too if it worked better.*  
     - **No**: Misleading is wrong. → **Leaf 7: Harm-focused strictness**  
       *Any deception (lying or misleading) is wrong if it risks harm or distrust. In the murderer case, even misleading could encourage violence.*  

  ---

  ### **Leaves (Final Positions)**  
  1. **Kantian strict-difference**: Lying always forbidden; misleading permissible (at least in extreme cases like the murderer).  
  2. **Assertion-norm moderate**: Lying is worse per se due to violating communication norms; misleading is less bad but still wrong in serious cases (e.g., paltering).  
  3. **No-intrinsic-difference deception view**: Lying and misleading are equally wrong if they intend to deceive (paltering, scalar cases, and artful questioning = lying).  
  4. **Misleading-can-be-worse**: Misleading (e.g., paltering or artful testimony) is often *more* wrong because it hijacks the victim’s trust.  
  5. **Contextual deflationary view**: Assertion/implicature distinction is morally inert; context determines wrongness (e.g., acceptable for murderer, wrong for court).  
  6. **Consequentialist**: No fixed difference; morality depends entirely on outcomes (e.g., misleading is fine if it prevents harm).  
  7. **Harm-focused strictness**: Both lying and misleading are wrong if they risk harm, even in extreme cases.  
  8. *Unoccupied branches marked in tree*.  

  ---

  ### **Unresolved Pairs and Limitations**  
  - **Kantian (Leaf 1) vs. Assertion-norm moderate (Leaf 2)**: The tree *cannot* fully separate these with cases alone. Both permit misleading in the murderer case but forbid it in paltering. The tree uses "Is lying always wrong?" (Node 4) to force a split, but if a reader rejects lying in the murderer case *and* accepts misleading in paltering, they land in Kantian; if they reject misleading in paltering, they land in Assertion-norm moderate. **Diagnosis**: These leaves overlap in case judgments; theoretical commitments (e.g., absolute rules vs. pro tanto duties) are needed for full separation.  
  - **Deflationary (Leaf 5) vs. Consequentialist (Leaf 6)**: The tree separates these via Branch B’s handling of artful questioning. Deflationary permits it in some contexts; Consequentialist rejects fixed rules.  
  - **Unoccupied cells**: All marked with diagnoses (incoherent, inconsistent, or unattractive based on prior answers).  

  ---

  ### **Design Notes**  
  - **Root choice**: Starting with "why lying is wrong" splits consequentialists (C), intent-focused views (B), and assertion-focused views (A) cleanly.  
  - **Cases as nodes**: Concrete scenarios (murderer, paltering, scalar, artful testimony) force distinctions between leaves. For example:  
    - Paltering separates Kantians (permissible) from Assertion-norm moderates (wrong).  
    - Artful testimony under oath separates Deflationary (context-dependent) from No-difference (always wrong).  
  - **Jargon-free**: Uses plain language (e.g., "saying something false" instead of "assertion," "trying to make someone believe something false" instead of "intending to deceive").  
  - **Logical coverage**: Added "Harm-focused strictness" (Leaf 7) for Branch C respondents who reject even life-saving deception, and "Contextual deflationary" (Leaf 5) for Branch B cases where context overrides intent.  
  - **Efficiency**: The tree reaches 7 leaves in 2–4 questions. Most sorting occurs at the root and the murder case.  

  This tree reveals whether a reader’s *case judgments* align with a position, regardless of what they "call" themselves. Use it to diagnose if students have internalized the distinctions or just memorized the map.
