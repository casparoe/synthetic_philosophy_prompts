answer: |-
  ### Diagnosis  
  Your hypothesis is fundamentally correct: **the core disagreement is a proxy war over emotion theory**, not primarily about fiction. Each camp imports its pre-commitments about what constitutes an "emotion" into the fiction debate, making the dispute unresolvable at the fictional-object level. Evidence from the theories themselves confirms this:  

  1. **Walton’s quasi-emotions** presuppose a *judgmentalist* theory of emotion (e.g., Lazarus, Nussbaum), where belief in the object’s existence/existential threat is *constitutive*. Fear requires judging that "X threatens me." Since fiction lacks real objects, genuine emotion is impossible; only "make-believe" feelings exist, leveraging real physiological arousal.  
  2. **Thought theorists** (e.g., Lamarque, Robinson) reject judgmentalism. They adopt a *causal-perceptual* model (e.g., Prinz, Griffiths), where emotions arise from *entertaining thoughts* (not beliefs). Fear can be triggered by vividly imagining danger, regardless of reality. Fiction provides the thoughts; the emotion is real.  
  3. **Illusionists** (e.g., Gendler, Doggett) assume a *graded-belief* model of emotion (e.g., Damasio), where "as-if" states (suspension of disbelief) suffice. Absorption creates partial belief, enabling genuine emotion without full endorsement.  

  **Why this is a proxy war**:  
  - Walton explicitly states his view "rests on" judgmentalism (*Mimesis as Make-Believe*, p. 245).  
  - Thought theorists like Matravers (*Fiction and Narrative*) argue emotion theories must accommodate fiction’s psychological impact, rejecting belief as necessary.  
  - Illusionists (e.g., "Imaginative Resistance" by Gendler) defend their view by appealing to cognitive science on belief-like imagination.  

  The sides aren’t disagreeing about *whether* we feel something toward fiction; they agree on phenomenology. They disagree on **whether that feeling counts as "fear"** given their divergent definitions of emotion. "Real fear" is a label applied *after* importing emotion-theoretic criteria.  

  ---

  ### Objections  
  1. **Empirical Objection**: Neuroscience (e.g., fMRI studies by Hsu) shows identical amygdala activation for real and imagined threats. If the brain processes fictional fear identically, this suggests a unified "real" emotion, undermining the proxy-war diagnosis. The dispute might be empirical: does belief *actually* modulate the emotion circuit?  
  2. **Intuition Objection**: Audiences insist, "I was *really* scared!" Thought theorists argue this first-person authority trumps theoretical constructs. If the disagreement were purely about emotion theory, such reports wouldn’t sway participants—yet they’re central to the debate. This implies a substantive dispute about subjective experience.  

  ---

  ### What Would Count as Progress  
  Given the diagnosis, progress requires **disentangling emotion theory from fiction**:  
  1. **Clarify the Emotion-Theoretic Stakes**: Explicitly map positions to their underlying models (e.g., "Do you hold that belief is *constitutive* or *causally sufficient* for fear?"). This exposes the root divergence.  
  2. **Empirical Pivot**: Test if physiological markers (e.g., cortisol spikes) differ between:  
     - Belief-based fear (real threat)  
     - Imagination-based fear (fiction)  
     - Make-believe (gamified scenarios).  
     *Prediction*: No difference between fiction and real supports thought theory; distinct patterns support quasi-emotions.  
  3. **Reframe the Question**: Replace "Is it real fear?" with **"Under what conditions do we *attribute* ‘real fear’ to ourselves?"** This shifts focus to folk psychology, revealing that "real" is a context-dependent judgment (e.g., "I felt fear, but it wasn’t *rational*").  

  **However**, if the proxy-war diagnosis holds, progress is unlikely. Emotion theory is entrenched (e.g., cognitivist vs. non-cognitivist debates span decades). The fiction paradox may persist as a **symptom of deeper philosophical fissures**—resolvable only by consensus on emotion, which is absent. The debate’s value then lies in exposing how theories handle edge cases, not in "solving" the paradox.  

  *Conclusion*: Your diagnosis is robust. The stalemate arises because "fear of fiction" is an existential threat to some emotion theories and a non-issue for others. Without reconciling those foundations, the paradox remains a Rorschach test for theorists’ prior commitments.
