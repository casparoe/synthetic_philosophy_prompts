answer: |-
  ### Pragmatic Encroachment Analysis  
  **Candidate Knower:** Intelligence analysts (Oct 2002)  
  **Total Evidence:** Satellite imagery, defector testimony (later discredited), intercepted communications, historical precedent of Iraqi WMD programs.  
  **Stakes Bearers:**  
  - *Analysts' stakes:* Professional credibility (medium).  
  - *Officials' stakes:* Political fallout if wrong (high, post-9/11 security anxiety).  
  - *Soldiers/civilians' stakes:* Life/death (extreme).  

  Pragmatic encroachment (PE) holds that **the actor’s practical stakes** set the evidential bar for knowledge. Here, officials were the actors deciding military action. PE predicts they *should have demanded overwhelming evidence* given their extreme political stakes (e.g., catastrophic reputational/security costs if wrong). Instead, they *lowered* the evidential threshold, treating high stakes as justification for urgent action. This **contradicts PE’s core mechanic** (high stakes → higher evidence requirements).  

  **Diagnosis:** PE fails to explain deferred stakes (soldiers bearing costs) and *deliberate* bar-lowering. It assumes rational stake-sensitive evidence calibration, but here high stakes distorted calibration. The episode reveals PE is built for individual actors facing *direct* consequences, not systems where stakes are displaced or exploited strategically. Extending PE requires ad hoc additions (e.g., "stakes misalignment" clauses).  

  ---

  ### Contextualist Analysis  
  **Attributor Contexts:**  
  1. *Internal (analysts):* "We assess Iraq has WMD" (hedged, probabilistic).  
     - Context: High scrutiny, error-salient.  
     - Standards: High (due to professional stakes).  
  2. *Public (officials, Feb 2003):* "We *know* Iraq has WMD" (unqualified).  
     - Context: Urgency for action, reduced error-salience.  
     - Standards: Low (public "ordinary" context).  

  Contextualism accurately describes this as **standard-shifting**: "S knows WMD exist" false in internal context (high standards), true in public context (low standards). However, it **cannot distinguish organic shifts from strategic manipulation**. Officials engineered the low-stakes context to *enable* knowledge claims, exploiting contextual flexibility. Contextualism lacks resources to diagnose this as epistemic malpractice rather than neutral semantic drift.  

  **Diagnosis:** The theory redescribes but does not explain the pathology. It predicts context-sensitivity of "knows" but is silent on *who controls context* and *why*. This exposes a gap: contextualism addresses semantic truth-conditions, not power dynamics in context-setting.  

  ---

  ### Silences and Institutional Reality  
  Both theories are silent on **institutional drivers**:  
  - Politicization: Pressure to align assessments with policy goals.  
  - Incentive structures: Analysts rewarded for certainty; officials for decisive rhetoric.  
  - Feedback loops: Demand for "actionable intelligence" filtered out caveats.  

  These factors distorted evidence weighting *prior* to stake/context effects. Pragmatic encroachment and contextualism focus on *individual* attributors responding to stakes/context. They lack tools to analyze **systemic epistemic dysfunction** where stakes are manipulated, contexts weaponized, and knowledge production industrialized.  

  ---

  ### Reverse Assessment: Theories vs. Episode  
  1. **Pragmatic Encroachment:**  
     - **Anomaly.** Predicts high-stakes actors (officials) require *more* evidence; observed bar-lowering contradicts this. Absorbs it only by conceding actors can irrationally *ignore* stakes—undermining its core interest-relativity. Needs a *radical* extension (e.g., "stakes distortion" theory) that changes its subject to institutional epistemology.  

  2. **Contextualism:**  
     - **Absorbs superficially, anomaly deeper.** Correctly describes context-shifting but cannot flag strategic manipulation as aberrant. Treats engineered contexts as semantically valid, missing that they corrupt knowledge *production*. Requires modest widening (e.g., norms for context integrity) but retains semantic focus.  

  **Conclusion:** The episode confirms both theories’ *descriptive* mechanisms but exposes their blindness to **epistemic power structures**. Pragmatic encroachment falters on displaced stakes; contextualism on context capture. Neither anticipated institutionalized knowledge laundering—a change in subject matter is needed to address this.  

  (598 words)
