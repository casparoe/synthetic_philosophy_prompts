prompt: |-
  I'm an undergraduate taking a course on philosophical logic and epistemology, and for my term paper I've chosen the surprise exam paradox: the teacher announces that there will be an exam next week, that it will be on exactly one of the five days, and that on the morning of the exam the students will not know that it is that day; the students then reason by backward induction that the exam cannot be held at all; and yet it is held on, say, Wednesday, and they are in fact surprised. My instructor keeps telling us that the literature is a swamp of incompatible "solutions" that aren't even answering the same question, so before I read any of them I want the specification first.

  Please write the desiderata: what an adequate solution to the paradox has to deliver. To my mind the list should at least cover the following, though tell me if I've got the shape of the problem wrong:

  - It must handle the one-day case, where the announcement reduces to "there will be an exam tomorrow and you will not know it," and say whether that case is the real crux or a degenerate special case — and it must handle it in a way that doesn't sabotage the five-day case.
  - It must not block the backward induction merely by declaring one step invalid; it has to say which step fails and why that step looked valid, since each step individually seems exactly as good as the one before it.
  - It has to take a stand on what kind of item the announcement is: a proposition about the students' future epistemic states, a self-referential one, or something that can fail to be common knowledge even when it is publicly stated — and it must say whether such an announcement can be true, false, or lack a truth value altogether, including whether its truth value can change over the week.
  - It must respect the distinction between the students lacking knowledge, lacking justified belief, and being unable to deduce the day from the announcement plus what is common knowledge among them; a solution that equivocates on this has, I suspect, not yet started.
  - It must explain the observed asymmetry: the students' a priori argument that the exam cannot occur is somehow worthless in practice, and the solution should account for why, rather than just noting that they turn out wrong on Wednesday.
  - It should generalize to the kin cases — the unexpected hanging, and announcements of the form "you will not believe this very announcement" — without collapsing all of them into one phenomenon if they genuinely differ.
  - It should say whether it needs assumptions about the logic of knowledge, e.g. whether knowledge iterates (the KK principle), or whether it can remain neutral; a solution that quietly buys its result from an epistemic logic side should own that.

  For each desideratum, give the case or consideration behind it, mark which are non-negotiable and which are prejudices of particular camps, and flag any subset you suspect is jointly unsatisfiable — that is the part I most want to see, since if it exists then the paradox is in some sense a theorem rather than a confusion. Then, briefly and without dwelling on it, sketch how the main solution families fare against the list: the Quine-style response that the students cannot be sure the announcement will be carried out; the epistemic-blind-spot treatments; the step-by-step indictments of the induction; and the self-reference treatments on which the announcement cannot be common knowledge. Keep the weight on the criteria, not the scorecard — I will do the scoring myself in the paper.
reasoning: |-
  Okay, let me start by understanding what the user is asking. They're an undergraduate student working on a term paper about the surprise exam paradox. Their instructor warned them that the literature is a mess with conflicting solutions, so they want a clear set of criteria for evaluating any solution before diving into the literature. They've provided their own list of desiderata, and they want me to refine and expand on that list, marking which are essential and which might be contentious.

  First, I need to parse each of their points. The one-day case is crucial because it seems simpler but might be where the paradox starts. Backward induction needs scrutiny step by step. The nature of the announcement—whether it's a proposition, self-referential, or about knowledge—is key. Then there's the distinction between knowledge, justified belief, and deducibility. The asymmetry between the a priori reasoning and the actual surprise must be explained. Generalization to related paradoxes is important but should respect differences. Finally, assumptions about epistemic logic should be explicit.

  I recall that the surprise exam paradox involves a teacher announcing an exam next week on one of five days, with the condition that students won't know the day beforehand. Students use backward induction to argue it can't happen, yet it does, and they're surprised. The challenge is explaining why their reasoning fails.

  Looking at each desideratum: 

  The one-day case is foundational. If the announcement is "exam tomorrow and you won't know it," that seems impossible because if it happens, they'd know the night before. But maybe it's possible if they doubt the announcement. So this case tests the solution's core.

  Backward induction's validity must be addressed. Each step seems sound, but the conclusion is wrong. The solution must pinpoint where the induction breaks and why it seemed valid. Simply rejecting one step isn't enough without explanation.

  The announcement's status is tricky. Is it a proposition? If it's about future knowledge, it might be self-referential. Common knowledge might fail even if announced publicly. The solution needs to clarify if the announcement can be true, false, or indeterminate, and how its truth value changes.

  Epistemic distinctions are vital. Some solutions conflate knowledge with belief or deducibility. A good solution must specify what's lacking: knowledge, justification, or the ability to deduce. Equivocation here weakens the solution.

  The asymmetry between reasoning and reality needs explaining. Why is the students' argument convincing yet wrong? Just saying they were surprised isn't enough. The solution should address why the reasoning is fallacious despite seeming sound.

  Generalization to other paradoxes like the unexpected hanging or belief announcements is important. But they shouldn't be lumped together if they differ. The solution needs to show if the same mechanism applies or if each has unique aspects.

  Epistemic logic assumptions should be stated. Does the solution rely on KK principle (knowing that you know) or other axioms? Neutrality is better, but if assumptions are necessary, they should be explicit.

  Now, considering which desiderata might conflict. For example, maintaining that the announcement is a proposition while handling self-reference might clash. Also, explaining the backward induction failure without special-casing steps could be hard. The one-day case being possible might conflict with strict deductive reasoning in the multi-day case.

  For solution families: Quine's approach says the announcement isn't believed, so surprise is possible. But does this handle the one-day case? Epistemic blind spots treat the announcement as true but unknowable in advance. Step-by-step approaches find where induction fails, like day 2. Self-reference solutions argue the announcement can't be common knowledge, making the induction invalid from the start.

  The user needs a structured framework to evaluate solutions. Highlighting conflicts between desiderata is crucial because if they're incompatible, the paradox might be irresolvable. They also want to avoid bias, so marking which points are contested by different camps is important.
answer: |-
  Below is a structured specification of desiderata for an adequate solution to the surprise exam paradox. I’ve refined your list, categorized items by necessity, flagged tensions, and noted where philosophical camps diverge. Desiderata are **non-negotiable** unless marked as **contentious** (reflecting specific camps) or **theorem-prone** (risk of incompatibility). A ★ denotes core criteria.

  ---

  ### **Desiderata for an Adequate Solution**
  1. **★ Handle the one-day case foundationally**  
     - **Case**: Announcement: "Exam tomorrow, and you won’t know it’s today on the morning." Students reason it’s impossible.  
     - **Requirement**: Explain why this case is possible (e.g., if students doubt the announcement) or impossible (e.g., if it induces self-refutation). Must integrate with the *n*-day case without ad hoc fixes.  
     - **Non-negotiable**: Yes. A solution that fails here cannot generalize.  

  2. **★ Diagnose the backward induction failure step-by-step**  
     - **Case**: In 5 days, step *k* (e.g., "No exam Friday") seems valid, but the conclusion ("No exam possible") is false.  
     - **Requirement**: Specify exactly which inductive step fails (e.g., Day 2, Day 1) and **why it appears valid** (e.g., tacit reliance on common knowledge). Merely rejecting induction wholesale is inadequate.  
     - **Non-negotiable**: Yes. Avoids "mysterian" dismissals.  

  3. **★ Characterize the announcement’s logical status**  
     - **Case**: Is "You will be surprised" a proposition? A performative? A self-referential claim?  
     - **Requirement**: Clarify:  
       - (a) Truth-value status: Can it be true/false/indeterminate? Does it change during the week?  
       - (b) Self-reference: Does it directly/indirectly reference itself?  
       - (c) Common knowledge: Can it be true but not common knowledge?  
     - **Non-negotiable**: Yes. Shapes the entire solution.  

  4. **★ Respect epistemic distinctions**  
     - **Case**: Students might lack knowledge but have belief, or lack justification despite true belief.  
     - **Requirement**: Specify whether the flaw is in:  
       - **Knowledge** (e.g., failure of epistemic closure),  
       - **Justification** (e.g., unreliable induction), or  
       - **Deducibility** (e.g., computational limitations).  
     - **Non-negotiable**: Yes. Equivocation invalidates the solution.  

  5. **★ Explain the reasoning-practice asymmetry**  
     - **Case**: A priori reasoning concludes "no exam," yet exam occurs and surprises.  
     - **Requirement**: Explain why the argument is compelling pre-exam but falsified post-exam. Must address **temporal dynamics** (e.g., reasoning undermines its own assumptions).  
     - **Non-negotiable**: Yes. Core paradox.  

  6. **Generalize cleanly to kin paradoxes**  
     - **Cases**: Unexpected hanging ("You won’t know the day before"); Belief versions ("You won’t believe this is true").  
     - **Requirement**: Show whether the same mechanism resolves all, or if differences exist (e.g., surprise vs. belief). Must not conflate distinct phenomena.  
     - **Contentious**: Some view all as identical; others argue for distinct mechanisms.  

  7. **Declare epistemic logic commitments**  
     - **Requirement**: State if the solution assumes:  
       - KK principle (knowing that you know),  
       - Logical omniscience,  
       - Stability of knowledge over time.  
     - **Non-negotiable**: Neutrality is acceptable, but hidden assumptions must be exposed.  

  ---

  ### **Tensions and Theorem-Prone Clusters**
  - **Incompatibility Risk (Theorem-Prone)**:  
    The following *may* be jointly unsatisfiable, implying the paradox is inescapable:  
    > **(A)** The announcement is a coherent proposition.  
    > **(B)** Backward induction is valid for *n*≥2.  
    > **(C)** The exam occurs and surprises.  
    > **(D)** Knowledge is deductively closed.  

    If a solution rejects (A), it must explain how the announcement functions. If it rejects (B), it must pinpoint the flawed step. Rejecting (D) weakens epistemic logic. **This cluster is where the paradox becomes a "theorem"** – e.g., in modal logic, the announcement may be *provably impossible* under strict assumptions.

  - **Contentious Desiderata**:  
    - "The one-day case must be possible" → **Contested** (Quineans accept it; epistemicists may reject it as degenerate).  
    - "Common knowledge must fail" → **Contested** (Some solutions preserve common knowledge; others deny it).

  ---

  ### **How Major Solutions Fare (Brief Sketch)**
  | **Solution Family**          | **Key Strategy**                                     | **Desiderata Strengths/Weaknesses**                               |  
  |------------------------------|------------------------------------------------------|-------------------------------------------------------------------|  
  | **Quinean (Pragmatic)**      | Announcement not believed; exam surprises by exploiting doubt. | ✅ Handles one-day case. ❌ Fails asymmetry (why is reasoning compelling?). ❌ Ad hoc on common knowledge. |  
  | **Epistemic Blind Spots**    | Announcement true but unknowable pre-exam (e.g., Sorensen). | ✅ Clarifies announcement status. ✅ Explains asymmetry. ❌ Struggles with backward induction (why do students trust early steps?). |  
  | **Stepwise Indictment**      | Backward induction fails at a specific step (e.g., Day 2). | ★ Meets step-by-step requirement. ★ Handles asymmetry via temporal revision. ❌ One-day case often ignored. |  
  | **Self-Reference/Common Knowledge Failure** | Announcement cannot be common knowledge (e.g., Fitch, Kaplan). | ★★ Best for desideratum 3 (announcement status). ★ Explains asymmetry (knowledge destabilized). ❌ Generalizes poorly to belief versions. |  
  | **Dynamic Epistemic Logic**  | Models knowledge update during the week (e.g., Baltag). | ★★ Respects epistemic distinctions. ★ Handles asymmetry dynamically. ❌ Computationally complex; may over-specialize. |  

  ---

  ### **Recommendations for Your Paper**
  1. **Test solutions against desideratum 3 first**: How a solution characterizes the announcement dictates its approach to other criteria.  
  2. **Stress the tension cluster**: If desiderata (A)-(D) are incompatible, the paradox reveals a limit of formal epistemology.  
  3. **One-day case as litmus test**: Viable solutions must start here without special pleading.  
  4. **Asymmetry is key**: A solution that merely says "the students were wrong" fails; it must explain *why their logic felt inescapable*.  

  This framework forces solutions to confront the paradox’s core rather than retreating into technicalities. If you draft your analysis, I can refine your scoring against these criteria.
