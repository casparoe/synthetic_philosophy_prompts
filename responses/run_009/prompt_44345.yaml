prompt: |-
  so this is a weird one but hear me out. I've been chewing on the speciesism debate for a while now, no academic background, just reading stuff on my own and arguing with my brother at thanksgiving. the argument that finally got its hooks in me is the one where you're asked to name the trait: like, what is it that pigs have that makes it fine to eat them, that dogs and cognitively disabled humans also don't have? and every answer I try (intelligence, soul, can't sign contracts) seems to either let in the bacon or boot out someone I don't want to boot out. I keep losing this argument to myself and honestly it's getting annoying.

  so what I want is a satirical piece. write a customer-service FAQ page, around 600-700 words, from a made-up supermarket chain (call it whatever you want) whose PR department has to respond to an activist campaign where people keep showing up asking them to name the trait. the humor has to come from the actual logic: every FAQ answer should either dodge the question with corporate euphemism ("we are committed to continuous improvement across all species in our supply chain") or name a trait that immediately boomerangs (the intelligence one, the reciprocal-contract one, the "they wouldn't want to be eaten if they understood" one). I want at least one answer where the PR writer clearly realizes halfway through that the trait they just named also excludes human infants, and has to panic and paper over it. deadpan throughout, no winking at the reader. and if you can sneak in the awkward part for the activists too — the bit where their own logic gets applied to someone's severely disabled brother and everyone goes quiet — that would be great, I don't want it to be a one-sided dunk. please keep it fair enough that a meat-eater and a vegan would both cringe a little.

  after the FAQ itself, add a short note (seperate from the piece) telling me where it leans on a contested reading of the actual philosophy, like if the whole thing only works if you buy a specific version of the marginal cases argument, or if the "name the trait" framing is itself a bit of an activist simplification I've absorbed uncritically. and genuinely, if you think I've garbled the underlying argument somewhere, just say so plainly instead of writing around it — I'd rather be corrected than flattered. also please write everything in American English.
