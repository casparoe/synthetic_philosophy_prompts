prompt: |-
  I teach an upper-level seminar on the philosophy of economics, and this week a student forwarded me an argument she had assembled from our readings on revealed preference. She presents it as a refutation of the entire approach, and although I suspect there is a sleight of hand somewhere in the middle of the chain, I have not been able to isolate it to my own satisfaction, and I would like to put it to the class in its strongest form. The argument runs as follows. (1) On the revealed-preference approach, preferences are not inner states reported by introspection but are defined by choice: when an agent selects x while y was available and affordable, she is thereby revealed to prefer x to y. (2) Utility, in turn, is merely a device for representing these preferences; to say that an option has the highest utility for an agent is just to say that it is the option she chooses. (3) It follows that every voluntary choice is, by definition, utility-maximizing: the hypothesis that an agent chose otherwise than utility-maximizing could not even be formulated without contradicting the definition. (4) Since "contrary to the agent's own good" means, on this approach, nothing more than "contrary to what she prefers," and what she prefers is fixed by what she in fact does, no voluntary choice can ever be contrary to the agent's own good. (5) So when we say of a man that his weekend gambling emptied his bank account against his own interest, the most this can express is our disapproval; it cannot be literally true of a voluntary act. (6) Yet statements of this kind can be literally true: an agent can knowingly, at the moment of action, choose against what he himself regards as his interest, as in ordinary weakness of will. (7) Therefore the revealed-preference approach is false, and utility must be an independent psychological magnitude that choice measures rather than defines.

  I have a suspicion the trouble lies somewhere in the middle of the chain, but I cannot state the diagnosis cleanly, and I would rather not hand my students a hand-waving reply. So I have two questions for you. First, which step or steps should be rejected, and why exactly did they look innocuous when the argument was first assembled? Second, what does rejecting them cost the revealed-preference theorist? For instance, does she have to concede that the approach applies only to agents whose choices satisfy certain coherence conditions, and if so, what becomes of the gambling case, which after all consists entirely of voluntary choices? For what it is worth, I would much rather keep (6) than (1): I take weakness of will to be a plain fact of human life and do not want a theory of utility that explains it away. Please answer in continuous prose only — no headings, bullet points, bold text, or tables — in the manner of a letter to a colleague.
reasoning: |-
  Okay, let me approach this query methodically. The professor presents a student's argument against revealed preference theory, structured in seven steps, and seeks help identifying where it goes wrong while preserving the reality of weakness of will. 

  First, I need to unpack the argument's logical flow. The student contends that revealed preference theory makes utility-maximization tautological (step 3), thereby eliminating the possibility of choices against self-interest (step 4), which conflicts with observable weakness of will (step 6). The professor suspects a fallacy in the middle steps but wants to pinpoint it precisely.

  Hmm... the crux lies in how steps 3 and 4 interpret "voluntary choice." Revealed preference theory typically assumes consistent preferences - it's not designed to handle cases where choices conflict, like akrasia. The student's error might be treating all choices as equally revelatory when the theory requires transitivity and completeness for preferences to be well-defined. 

  I recall that revealed preference theory originated as a behaviorist alternative to introspection, not a denial of inner conflict. Samuelson himself distinguished between "consistent choice" and erratic behavior. The gambling example in step 5 actually demonstrates this: repeated bets despite financial harm suggest inconsistent time preferences, which the framework can model through changing choice sets or hyperbolic discounting.

  For the professor's dilemma about costs: admitting that revealed preference requires coherence conditions doesn't weaken the theory. It simply clarifies its domain - like how physics assumes frictionless planes for foundational principles. The gambling case becomes tractable by analyzing patterns across choice situations rather than isolated acts. 

  The key is rejecting step 4's claim that "no voluntary choice can ever be contrary to the agent's own good." This overlooks how revealed preference theorists define "good" relative to stable preferences. When choices conflict (e.g., short-term urge vs. long-term goal), the theory can either treat them as different preference states or exclude them as "irrational" - but the latter doesn't negate akrasia's existence. 

  Ultimately, preserving step 6 (weakness of will) costs nothing. Revealed preference can accommodate it by distinguishing between momentary choice-based preferences and higher-order commitments, or by using dynamic models. The professor gets to keep both the theory's behaviorist rigor and the phenomenology of akrasia.
answer: |-
  My dear colleague,

  Your student has constructed a clever and admirably concise argument, one that captures a genuine tension inherent in the strictest formulations of revealed preference theory. While it highlights a significant conceptual challenge, I believe the flaw lies primarily in step (4) and the unspoken assumptions smuggled into step (3), stemming from an overly rigid interpretation of the definitions in (1) and (2). The argument *looks* innocuous because it rigorously applies the definitions presented in (1) and (2) – but it applies them in a way that ignores crucial qualifications about the *domain* and *consistency* conditions implied by the theory itself, particularly when moving from individual choices to statements about "the agent's own good."

  Let's dissect it. Steps (1) and (2) are a fair, if somewhat simplified, characterization of the core positivist/behaviorist stance of revealed preference: preferences are *defined* by choices, and utility is a numerical representation of the preference ordering inferred from those choices. Step (3) follows logically *if* we interpret "voluntary choice" strictly within a single, well-defined choice situation. Given the definitions, the chosen option *is* the one with the highest utility *relative to that specific choice set*. Saying the agent chose something other than the utility-maximizing option *within that set* is indeed a contradiction under the definition. The sleight of hand occurs in the transition from (3) to (4) and the interpretation of "the agent's own good."

  The problem is that step (4) equates "the agent's own good" simplistically with "what she prefers" *as defined by any single choice at a single moment*. Revealed preference theory, in its standard economic application (e.g., Samuelson, Houthakker), does *not* typically claim that every isolated choice automatically reveals a stable, overarching preference ordering that defines the agent's "good" in a global sense. It *assumes*, as a foundational requirement for the concept of "preference" to be meaningful and for utility to be representable ordinally (or cardinally under stronger axioms), that choices exhibit a high degree of *consistency* across different choice sets. This is embodied in the Weak Axiom of Revealed Preference (WARP) and, more strongly, the Strong Axiom (SARP) or the conditions for the existence of a utility function (like Gorman's conditions).

  The theory is designed to work – to allow us to infer a stable preference ordering – precisely when choices *are* consistent in this way. If choices violate WARP (e.g., choosing x over y from set A, but y over x from set B where both are available), the theory struggles: it cannot construct a single, coherent preference ordering from those choices. The agent, according to the internal logic of the theory at that point, is not revealing stable preferences. Your student's argument exploits the theory's definition to conclude that *no* voluntary choice can be contrary to the agent's good *because* "good" is defined by the choice itself. But the revealed preference theorist would counter that "the agent's own good" is only meaningfully defined *relative to a stable preference ordering revealed through consistent choices*. If choices are inconsistent, the very concept of a stable "preference" (and thus a stable conception of "good") becomes problematic *within the theory's own framework*.

  This is where the gambling case and weakness of will (step 6) become crucial. When the gambler places a bet knowing it risks emptying his bank account against his long-term goals, he exhibits *inconsistency* across time or across different descriptions of the choice (the immediate thrill vs. the long-term consequence). At moment T1 (planning), he expresses a preference for financial security over the thrill of a bet. At moment T2 (gambling), he chooses the bet over preserving his money (assuming he could walk away). This violates the consistency required to infer a single, stable preference ordering encompassing both T1 and T2. The revealed preference theorist need not deny the phenomenology of weakness of will. Instead, they would say:

  1.  **Option 1 (Strict Interpretation):** The theory simply doesn't apply *to that specific choice* in isolation if it violates the consistency axioms relative to other choices the agent makes (or has made). The choice at T2 reveals a preference *for the bet over not betting in that specific moment and context*, but it does *not* necessarily reveal that this momentary preference defines his overall "good." His "good" would be inferred from a *pattern* of consistent choices, which this choice disrupts. Statements about acting "against his own good" appeal to a different, perhaps more reflective or long-term, preference pattern that is inconsistent with the immediate choice. The theory doesn't deny the existence of the conflict; it declares the immediate choice *incommensurable* or inconsistent with the stable ordering needed to define a global "good" within its model.
  2.  **Option 2 (Descriptive Interpretation - More Common):** The theorist can incorporate the inconsistency by modeling it. This often involves enriching the model: perhaps the "good" gambled away is future consumption, and the agent exhibits time-inconsistent preferences (e.g., hyperbolic discounting). Here, the *objects* of choice are refined. Choosing "gamble now" isn't compared directly to "financial security forever"; it's compared to "don't gamble now" *within a context where future consequences are heavily discounted in the moment*. The revealed preference approach *can* model this, but it requires defining the choice objects carefully (e.g., "gamble now with consequence C" vs. "don't gamble now") and acknowledging that preferences over these temporally-situated options may not satisfy standard intertemporal consistency axioms. The statement "emptied his bank account against his own interest" then means it violates the preferences he reveals when considering choices *from a more detached, long-term perspective* or violates rationality axioms like dynamic consistency. The utility function becomes context-dependent or time-dependent.

  **Rejecting Step (4) and Refining Step (3):** Therefore, step (4) should be rejected. It is *not* true that "no voluntary choice can ever be contrary to the agent's own good" *if* "the agent's own good" is understood as defined by a stable, coherent preference ordering inferred from a consistent pattern of choices *over time and across situations*. A single choice, especially one exhibiting weakness of will, *can* be contrary to *that* stable ordering. Step (3) needs qualification: Every voluntary choice *within a specific, well-defined situation* is utility-maximizing *relative to the preferences revealed in that specific context*. However, the preferences revealed in one context *may conflict* with preferences revealed in another context (like planning vs. acting), preventing the formation of a single, global utility function representing the agent's overall "good." The hypothesis that an agent chose otherwise than utility-maximizing *relative to a specific, stable preference ordering* is perfectly formulable and can be true if their choices violate consistency conditions. The definitions in (1) and (2) only guarantee utility maximization relative to the *local* preference inferred from the immediate choice set, not relative to a *global* "good."

  **What It Costs the Revealed Preference Theorist:**

  Rejecting step (4) and refining step (3) does come at a cost, but it's a necessary clarification rather than a fatal blow:

  1.  **Limited Domain:** The theorist must explicitly concede that the revealed preference approach, in its core form for inferring stable preference orderings and utility functions, **applies most cleanly to agents whose choices satisfy consistency conditions (like WARP/SARP) across relevantly similar choice sets.** It is not a universal theory of *all* behavior, particularly not irrational or inconsistent behavior like severe weakness of will, without significant modifications.
  2.  **Handling Inconsistency:** The theorist needs a strategy for handling inconsistency:
      *   **Exclusion:** Declare the theory inapplicable to inconsistent choice patterns. "Preference" isn't well-defined in those cases. This preserves the tautological core but limits scope.
      *   **Modeling:** Enrich the model to explain inconsistency (e.g., changing tastes, state-dependent preferences, hyperbolic discounting, multiple selves). This expands scope but moves away from the purest behaviorist ideal by implicitly invoking internal states (like varying discount rates or "selves") to explain choice patterns. Utility functions become descriptive tools for specific contexts rather than representations of a single, timeless preference ordering defining "the good."
  3.  **The Gambling Case:** Under the strict interpretation (exclusion), the revealed preference theorist might say the gambler's weekend choices, *taken as a whole sequence*, likely violate consistency conditions relative to his pre-weekend stated preferences or long-term financial choices. Therefore, one cannot construct a single, coherent "good" defined purely by that weekend's choices; the theory is strained in applying a global notion of "his interest" derived purely from revealed preference *during the binge*. Under the modeling interpretation, they would try to explain the choices through refined objects of choice (immediate gratification, misestimation of odds, time inconsistency) and show how these choices conflict with the preferences revealed in other contexts (like saving behavior). "Against his own interest" means against the preferences revealed in those *other*, arguably more reflective, contexts or against a normative standard of rationality applied to his *overall* pattern of choices.
  4.  **Weakness of Will (Step 6):** Crucially, **preserving (6) is entirely compatible with this.** The revealed preference theorist doesn't need to deny akrasia. They explain it precisely as a *breakdown in consistency*. The agent's choice in the moment reveals a local preference (e.g., for the cake *now*) that conflicts with the preference revealed during planning (abstaining for health). The theory can acknowledge this conflict without positing utility as an "independent psychological magnitude" that choice "measures." It simply says that the choices reveal *different* preferences in different contexts, preventing the formation of a single, stable utility function representing *the* global good. The agent "chooses against what he himself regards as his interest" means he chooses against the preference he revealed (and likely would reveal again) in a context dominated by his reflective, long-term perspective.

  In essence, the student's argument successfully shows that a *naive* application of revealed preference definitions – one that ignores the fundamental reliance on consistency across choices for the concept of "preference" and "good" to have global meaning – leads to an absurdity (denying weakness of will). However, the sophisticated revealed preference theorist escapes the absurdity by emphasizing the conditional nature of the theory: preferences *can* be inferred *only when* choices are consistent. Weakness of will is not evidence against revealed preference; it's evidence *of* inconsistency, which lies outside the core domain where stable preferences are defined. The cost is acknowledging that the theory's explanatory power is strongest for consistent choice behavior and requires careful handling or enriched models for inconsistency. But this cost is inherent in the theory's own logic and doesn't require abandoning its fundamental behaviorist stance for its intended domain. We keep (6), we refine (3) and reject (4), and we understand (1) and (2) as definitions that presuppose a coherence they cannot, by themselves, guarantee.

  I trust this dissection provides the clarity you need for a robust classroom discussion. The student has done excellent work in pushing the theory to its limits, revealing where its foundations require careful shoring up.

  Warm regards,

  A Fellow Philosopher of Economics
