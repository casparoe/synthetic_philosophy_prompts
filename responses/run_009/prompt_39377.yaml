  Hmm... The user mentioned avoiding dystopian precision, so the reports should feel like actuarial estimates with margins of error. Key emotional beats: the first couple's muted disappointment ("no one owes them"), the second couple's visceral fear ("are we harming someone?"), and staff conflict over disclosure policies.

