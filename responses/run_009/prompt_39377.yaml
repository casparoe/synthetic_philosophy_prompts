answer: |-
  ## Threshold
  The clinic smelled faintly of antiseptic and printer toner. Outside the reinforced windows of "Horizon Family Planning," rain slicked the streets of a city ten years from now that looked remarkably unchanged – same chain coffee shops, same tired buses. Inside, the difference hummed softly in the servers stacked behind receptionist Mei’s desk. She offered lukewarm tea to couples who signed in for their "trajectory report."

  Dr. Aris Thorne preferred the term "contextualized forecasting." It sounded less like destiny. He leaned back in his chair, the glow of the wall-mounted screen washing over the couple opposite him. Ben and Chloe Henderson gripped each other's hands. Their report summary glowed softly:

  **Prospective Outcome: SOLIDLY WORTHWHILE (Probability: 82%)**
  *   *Projected Lifespan: 78-84 yrs*
  *   *Primary Well-being Factors: Stable familial environment (high confidence), average educational attainment, moderate financial security. Resilience markers: strong.*
  *   *Significant Negative Probabilities: Low (<15%).*
  *   *Baseline Satisfaction Index: Projected median 6.8/10.*

  "It's... good, right?" Ben asked, a hopeful crease between his brows. "Better than average?"

  "Statistically, yes," Aris confirmed, his voice calm. "The model aggregates data points – health projections, socio-economic trajectories for your postcode, epigenetic markers from your samples. It suggests a life with its challenges, certainly, but one overwhelmingly likely to be experienced as positive. A life worth living."

  Chloe let out a breath she seemed to have been holding. "Okay. Okay, good. Worthwhile. That’s... reassuring." She squeezed Ben’s hand. "So, no red flags?"

  "No significant ones flagged," Aris clarified. "The model sees stability. It doesn’t predict extraordinary joy or profound suffering as a high probability. It predicts... adequacy. A life lived within comfortable parameters."

  Ben nodded slowly. "Right. So, we’re not... we’re not depriving anyone of something amazing?"

  Aris paused. The question hung in the air. He thought of Priya, his genetic counselor colleague, who would likely jump in here with an emphatic *No! There is no one to deprive!*. He chose a different path. "The model assesses the potential life of the specific child conceived with your genetic contribution at this time. It doesn't compare it to hypothetical other children, or other choices you might make. It only tells you about *this* potential path."

  Ben looked slightly unsatisfied. "But... compared to not having a child? Are we doing a good thing?"

  Chloe nudged him gently. "Ben, the doctor said it’s worthwhile. That’s enough, isn’t it? It’s a good life."

  Ben nodded again, less certain. "Yeah. Yeah, okay. A good life." He looked at the screen. "Solidly worthwhile. Okay."

  Aris printed their report summary onto crisp, watermarked paper. "Take your time. Discuss it. We're here if you have more questions." He watched them leave, Ben still frowning slightly at the summary, Chloe looking relieved but subdued. They hadn’t been *owed* this news. They hadn't been given a gift. They’d received information about a neutral probability. Aris felt the familiar, quiet unease. Why did "worthwhile" feel like a consolation prize?

  ---

  Two days later, Priya Sharma sat across from Lena and Marcus Reed. The air in her smaller consultation room felt heavier. Lena clutched Marcus’s arm, her knuckles white. The screen displayed their summary:

  **Prospective Outcome: BELOW SUSTAINABLE THRESHOLD (Probability: 76%)**
  *   *Projected Lifespan: 62-68 yrs*
  *   *Primary Well-being Factors: High probability of chronic pain condition manifesting by adolescence (87%). Significant likelihood of major depressive episodes recurring (68%). Financial instability markers: elevated.*
  *   *Significant Negative Probabilities: High (>50%).*
  *   *Baseline Satisfaction Index: Projected median 3.2/10.*

  Marcus swallowed hard. "Below sustainable threshold? What... what does that *mean*?"

  Priya kept her voice gentle but precise. "It means the model, based on the aggregated data and your specific genetic markers, predicts a significantly high probability that this child would experience a life dominated by suffering – physical and mental – to a degree that outweighs the potential for positive experiences. The projected median satisfaction is consistently low."

  Lena made a small, choked sound. "Suffering? We’d... we’d be making someone suffer?"

  "The model suggests a high likelihood," Priya affirmed. "The chronic pain condition has a strong genetic link in your family history, Lena. Combined with the epigenetic markers indicating high stress susceptibility... the probabilities compound."

  Marcus leaned forward, his voice rough. "But... it’s not certain? 76%? That means 24% chance it’s... not so bad?"

  "Correct, it’s probabilistic," Priya said. "But the model weights the severity of the predicted negative outcomes heavily. A 76% chance of profound, lifelong hardship is considered... ethically significant."

  "Ethically significant?" Lena echoed, tears welling. "Are you saying we’d be... hurting someone? By having them?"

  Priya hesitated. This was the precipice. Clinic policy was clear: provide the data, explain the probabilities, avoid direct ethical pronouncements. But her own conviction burned. "The model strongly suggests," she chose her words carefully, "that bringing a child into existence under these projected conditions carries a substantial risk of creating a life defined by net suffering. You would be initiating a life with a high burden of pain."

  Marcus buried his face in his hands. "God. We just... we wanted a family."

  Lena turned to Priya, desperate. "What do other people do? When it says... this?"

  "Some choose alternative paths," Priya said softly. "Donor conception, adoption, or deciding against parenthood. Others proceed, hoping to defy the probabilities, to provide enough support to mitigate the risks." She didn’t add that the latter group often returned years later, hollow-eyed, whispering about the relentless pain, the therapies that failed, the child who couldn’t find relief. "The decision is profoundly personal."

  "But if we do it," Lena whispered, "and they suffer... that’s on us. We did that. We hurt them." It wasn’t a question. It was the cold, terrifying heart of the asymmetry laid bare.

  ---

  In the cramped staff room, Aris reheated soup in the microwave. Priya leaned against the counter, arms crossed.

  "The Reeds," she said, her voice tight. "That report... Aris, it’s practically a roadmap to misery. How do we just hand that over and wash our hands?"

  "We provide the information they paid for," Aris said, stirring the soup. "We don’t make the choice for them."

  "But we *know*," Priya insisted. "We know with a high degree of confidence that if they conceive *this* child, *that* person will likely wish they’d never been born. We’re giving them the loaded gun."

  Aris sighed. "And the Hendersons? Their child has an 82% chance of a perfectly adequate life. Are we giving them a... mildly disappointing gift certificate? Nobody feels the Hendersons owe the world a child. Nobody thinks they’d be *depriving* someone of joy if they walked away. Why is the weight so different?"

  "Because suffering *matters*," Priya shot back. "Creating suffering is an act. Preventing it is... I don't know, a duty? A negative obligation? The absence of extraordinary joy isn't a harm in the same way. The child who isn't born exceptionally happy doesn't *lament* it. The child born into relentless pain *does*."

  "But who is lamenting?" Aris pressed, turning to face her. "The specific child the Hendersons *don't* have? Or the specific child the Reeds *might*? Neither exists. The Reeds choose not to conceive *Child A*, who would likely suffer terribly. They might later conceive *Child B* using a donor, who might have a fine life. Child A never exists to be saved from anything. Child B isn't 'owed' existence. The harm... it’s conceptual. A potential harm assigned to a potential person who never materializes."

  Priya shook her head, frustrated. "You sound like a textbook. Look at Lena Reed’s face. Tell her it’s just conceptual. She feels the weight of potentially creating suffering in a way Ben Henderson never felt the weight of potentially creating mere adequacy. That gut feeling *means* something."

  "It means our intuitions are asymmetric," Aris conceded. "But is that intuition *right*? Or just visceral? What about the couple who *could* create a child projected to have an *exceptional* life – say, 9.5/10 satisfaction – and choose not to? Did they wrong anyone? Deprive the universe of some radiant joy? My gut says no, but... why not? If preventing suffering is a moral imperative, is creating profound joy a symmetrical moral good? Why does only one side pull?"

  Priya was silent. The microwave beeped insistently. "Because joy is... extra," she finally said, though it sounded weak even to her. "Suffering is a violation. Preventing violation feels more urgent than bestowing a bonus." She pushed off the counter. "I just know we have a responsibility with the Reeds that we don’t have with the Hendersons. We need to make sure they *understand* the gravity."

  "And what," Aris asked quietly, retrieving his soup, "is the gravity *of*? Hurting someone who doesn't exist? Or avoiding the creation of a certain kind of existence?"

  Priya didn’t answer. She walked out, the weight of the Reeds' potential child a tangible shadow in the sterile hallway.

  ---

  Lena Reed called the clinic a week later. Mei patched her through to Priya.

  "We... we’re not going ahead," Lena said, her voice thin but resolved. "Not like this. Marcus found a donor program. Different... probabilities."

  Priya felt a wave of relief so profound it startled her. "I understand, Lena. That’s a very difficult decision. I’m... glad you feel it’s the right path."

  There was a long pause on the line. "Priya?" Lena’s voice was small. "We wouldn’t have been... hurting them? The child we didn’t have? That’s not... real?"

  Priya closed her eyes. She thought of Aris’s conceptual harm, the non-existent child. She thought of the projected median satisfaction of 3.2, the 87% probability of chronic pain. "The potential for suffering was very real, Lena," she said carefully, choosing the present tense. "You’ve chosen a path with a significantly lower probability of that outcome. You’ve spared a potential person a likely burden."

  Another pause. Lena whispered, "Okay. Okay. Thank you." The line went dead.

  Priya sat back. *Spared a potential person.* It felt true. Necessary. But why didn’t she ever tell the couples with merely "worthwhile" projections that they were *bestowing* a potential life? Why did that feel forced, almost absurd?

  Later, she passed Aris reviewing files. "The Reeds opted out," she said.

  He looked up, nodded slowly. "I’m not surprised. Heavy forecast."

  "It felt like preventing something... bad," Priya offered, testing the words.

  Aris met her gaze. "It did," he agreed. "It always does with those." He tapped a new file on his desk – another consultation tomorrow. "The question is, what *is* the 'something bad'? And what does it mean that we only feel its absence so acutely in one direction?"

  He didn’t expect an answer. Priya didn’t have one that didn’t circle back to the cold void of non-existence, or the warm, terrifying weight of a mother’s tears. She walked back to her office, past Mei scheduling the next appointment. The rain had stopped. Outside, ordinary life continued, oblivious to the silent calculations of harm and gift, the unbearable lightness of worthwhile, the crushing weight of below threshold, and the unsettling quiet where profound joy might have been, if anyone had thought to measure its absence.
