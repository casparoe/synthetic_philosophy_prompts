  Biggest risk is over-explaining through dialogue. Solution: use subtext (e.g., a character cutting off another before they articulate the asymmetry). Let silences and unfinished sentences do the work.

  User's deeper need: making abstract philosophy emotionally palpable. So prioritize moments where characters' instincts clash with logic—like the second couple's guilt despite no child existing yet, or a staff member defending non-disclosure while visibly unsettled.

