  First, I need to understand their four cruxes: moral remainder after lesser evil, whether political office creates different moral obligations, secrecy vs public wrongdoing, and whether "lesser evil" is a complete justification. They also created a new case study—the deputy scenario—to avoid rehashing standard examples.

  The core challenge is finding neutral wording that both sides can accept without feeling their position is misrepresented. For the opening sentence, I consider options that affirm the tension without taking sides. Something like "Political actors sometimes face choices where every option involves significant moral costs" captures the dilemma without judgment.

