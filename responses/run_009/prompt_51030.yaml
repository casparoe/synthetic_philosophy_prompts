prompt: |-
  So a weird thing happened: I just got made elections officer of my housing co-op (long story, nobody else wanted it) and the first vote I ran was a mess. We were picking between three roof contractors with ranked ballots, and afterwards two members admitted they'd ranked their actual favorite second because they didn't want to waste their vote -- the third option won, and now everyones mad at me. Someone told me there's a theorem, Gibbard-Satterthwaite I think, that says every ranked voting system with three or more options can be gamed like this no matter how cleverly you count the ballots, unless you basically let one person decide. So it sounds like I can't fix the problem, only pick my poison, and I'm going to have to run these votes maybe six times a year for a membership with zero patience for math. Can you turn the theorem into a checklist I can actually use in a meeting? In order: how do I tell whether it even applies to the vote we're about to hold (does it matter that some votes have only two options, or that we're 40 people instead of a whole country), then what my realistic escape routes are and what each costs us -- I've half-heard about single-peaked preferences being a loophole and about rating options instead of ranking them, and if the escape route is "designate a dictator" that's not an escape route. Then run the checklist on two of our upcoming votes: picking one of four contractors, where real money is at stake and people care a lot, and picking the date of the summer party, twelve possible dates, where people care but not that much. And please be honest about the points where the checklist can't decide for me and it's just a judgment call I have to own in front of the board. One more thing: no headings or bullet points or anything, just plain prose like an email -- I want to read it out loud at a meeting without it sounding like a powerpoint.
reasoning: |-
  Okay, the user is the elections officer for a housing co-op and had a rough first experience with a ranked vote for roof contractors. Members strategically voted, leading to an unpopular winner. They mentioned the Gibbard-Satterthwaite theorem, which basically says that all voting systems with three or more options can be manipulated. Now the user needs to run frequent votes and wants a practical checklist to handle this in meetings without using complex jargon.

  First, I need to break down the Gibbard-Satterthwaite theorem in simple terms. The key points are: any voting system with three or more options is vulnerable to strategic voting unless it's a dictatorship. But there are exceptions, like when preferences are single-peaked. The user needs to know when the theorem applies—probably for votes with three or more choices. For two-option votes, majority rule works fine. The size of the group (40 people) doesn't change the theorem's applicability.

  The user’s deeper needs include maintaining trust in the co-op, ensuring fair outcomes without complex math, and avoiding blame for flawed results. They need actionable steps to present to the board, not theoretical explanations. They also mentioned two scenarios: picking a contractor (high stakes) and a party date (lower stakes). Each requires different approaches.

  For the checklist, the first step is determining if the vote has three or more options. If yes, the theorem applies. Then, assess if preferences might be single-peaked. For example, the party date on a timeline could be single-peaked, while contractor choices might not. If single-peaked, ranked voting is less manipulable. Otherwise, consider alternatives like approval voting or score voting to reduce gaming.

  Approval voting (voting for all acceptable options) might work for the party date since it's simpler and less strategic. Score voting (rating each option) could work for the contractor vote but might confuse people. The user needs to weigh simplicity against potential manipulation. Also, sometimes sticking with ranked choice and accepting some strategy is okay for low-stakes decisions.

  For the contractor vote (four options, high stakes), single-peakedness is unlikely. Approval or score voting could help, but explaining score voting might be tough. Maybe suggest approval voting here. For the party date (twelve options), timeline-based ranking could be single-peaked, making ranked voting safer. Alternatively, approval voting simplifies the process.

  The user must communicate that no system is perfect. They need to own the judgment calls, like assessing preference structures or choosing simpler methods for lower stakes. Transparency about trade-offs is crucial to maintain trust with the board.
answer: |-
  Okay, this is a classic co-op pickle, and you're absolutely right that Gibbard-Satterthwaite (GS) is the ghost haunting your voting booth. Don't panic – it doesn't mean democracy is doomed, just that you need clear eyes about the trade-offs. Think of GS as a warning label, not a death sentence. Here’s how to turn that warning into something practical for your meetings.

  **The GS Checklist (Plain English Version):**

  1.  **Does the GS Warning Apply to *This* Vote?** Ask yourself: "Are we choosing between three or more distinct options?" If it's just two options (like "Contractor A: Yes/No"), breathe easy. Simple majority vote is fine, GS doesn't bite here. Forget the group size (40 people vs. country) – the *number of options* is the trigger. If it's three or more, the GS risk is real: people *might* feel pressured to vote strategically (like ranking their favorite second) instead of honestly, and *no* ranking-based counting method (Instant Runoff, Borda, Condorcet, etc.) can perfectly prevent this without becoming a dictatorship. You need to move to step 2.

  2.  **Is There a Natural Order? (The "Single-Peaked" Loophole Check):** This is your first potential escape hatch. Ask: "Do these options fall along a simple, one-dimensional scale that everyone understands roughly the same way?" Think left-right politics, price points (cheap/mid/expensive), dates on a calendar, or locations on a map. If everyone's "peak" preference is somewhere on that line, and their liking falls off evenly as options move away in *either* direction (like preferring mid-June, liking early June and late June less but equally, and hating July), then preferences are likely "single-peaked." *Why it helps:* With truly single-peaked preferences, ranked voting systems (especially ones picking the Condorcet winner) become much harder to game strategically, and results usually reflect the group's genuine compromise. *The Cost:* This is a judgment call *you* have to make based on the options. It's impossible to *prove* everyone's preferences are single-peaked without surveying them first (which defeats the purpose). You have to look at the options and ask, "Is there an obvious, shared spectrum here?" If the answer is "Probably yes," ranked voting is safer. If it's "No, these are apples, oranges, and spaceships" (like different roof contractors with complex pros/cons), this hatch is probably closed.

  3.  **If No Natural Order: Can We Switch to Ratings?** When preferences are messy, ranked voting is inherently vulnerable to gaming (as you saw). Your escape route here is ditching rankings for ratings. Ask: "Could we have people rate the options instead of rank them?" Two main types:
      *   **Approval Voting:** "Vote for every option you find acceptable." People can vote for one, some, or all. The option with the most approval wins. *Pro:* Dead simple, very hard to game (voting for your favorite *never* hurts it; voting against an acceptable option *might* help a worse one win). *Con:* Doesn't capture strength of preference. The winner is the most broadly acceptable, not necessarily anyone's passionate favorite. Good for "find the compromise" or "avoid the disaster" scenarios.
      *   **Score Voting (Range Voting):** "Give each option a score, say 0 to 5 or 0 to 10." Highest average score wins. *Pro:* Captures strength of preference ("I *love* A, *hate* B, *tolerate* C"). Less vulnerable to gaming than ranking systems. *Con:* Slightly more complex than Approval. People might score strategically (giving max to favorite, min to others). Requires clear rating scale definitions. *Cost for Both:* You lose the intuitive "ranking" structure. Some members might grumble it's unfamiliar. You need clear instructions. But crucially, *neither is subject to GS* because GS *only applies to ranking systems*. This is your main escape from the GS trap for messy preferences.

  4.  **If Ratings Are Too Weird: Embrace the Mess (Carefully):** Sometimes, switching systems mid-stream or explaining ratings is just too much friction. If the vote is lower-stakes, you might stick with ranked ballots. *Acknowledge the GS Risk Upfront:* Tell members, "Heads up, with multiple options, no ranking system is perfect. The safest strategy is usually to rank honestly according to your true preferences. Strategic voting can backfire and lead to worse outcomes, like it did with the roof." *Cost:* You might still get strategic voting and unpopular results. You're accepting the GS poison but being transparent about it. Only do this for lower-stakes votes where the consequences of a "bad" (but fairly counted) outcome are tolerable.

  **Applying the Checklist to Your Upcoming Votes:**

  1.  **Picking One of Four Roof Contractors (High Stakes):**
      *   **Step 1:** 4 Options? **Yes.** GS Warning is ON.
      *   **Step 2 (Natural Order)?** Unlikely. Contractors differ on price, materials, timeline, reputation – it's a messy, multi-dimensional choice. There's no single obvious spectrum everyone agrees on. **Escape Hatch Closed.**
      *   **Step 3 (Ratings)?** This is your realistic escape route.
          *   *Approval Voting:* Strong contender. "Vote for all contractors you'd be okay with hiring." Finds the most broadly acceptable choice. Simple, minimizes gaming. Might avoid the "least bad" winner but maybe not the passionate favorite. Good for high-stakes "don't hire a disaster" scenario.
          *   *Score Voting:* Also good. "Rate each contractor 0-10." Better captures intensity ("I *really* love A, *really* hate D"). Slightly more complex, but captures more nuance than Approval. Still much safer from GS than ranking.
      *   **Judgment Call:** Choose between Approval (simpler, safer) or Score (more expressive). Present both to the board, leaning towards Approval for sheer simplicity unless intensity is deemed crucial. **Recommendation: Push hard for Approval Voting here.** Explain GS briefly: "Because preferences are complex, ranking systems can encourage vote-splitting and strategy. Approval lets everyone support everyone they like, making it harder to game and safer for big decisions."

  2.  **Picking the Summer Party Date (Twelve Dates, Lower Stakes):**
      *   **Step 1:** 12 Options? **Yes.** GS Warning is ON.
      *   **Step 2 (Natural Order)?** **Very Likely Yes!** Dates fall on a clear, one-dimensional timeline (the calendar). Preferences are almost certainly single-peaked (people have an ideal date, and prefer dates closer to it over dates farther away). This is the classic loophole scenario.
      *   **Escape Route:** Ranked voting (like Instant Runoff or Condorcet) is now a good choice. With single-peaked preferences, it's robust, reflects the median preference well, and is hard to manipulate strategically. Use a ranked ballot.
      *   **Alternative:** Approval Voting is still a solid, simple choice. "Vote for all dates you could attend." Finds the date with the highest potential attendance. Very simple. Loses the "closeness to ideal" nuance ranking gets from the single-peaked structure, but might be perfectly adequate.
      *   **Judgment Call:** Do members care about the *best* date or just *a* date with high attendance? If "best" matters and the timeline is clear, ranked voting leverages the natural order well. If maximizing attendance is key and simplicity is paramount, Approval is great. Given the lower stakes, either is defensible. **Recommendation:** Since it's likely single-peaked, use ranked voting (e.g., "Rank your top 5 dates"). It feels intuitive for dates. But Approval is a perfectly fine, simpler alternative. You choose based on the group's tolerance for ranking vs. desire for ultimate simplicity.

  **The Honest Bits You Have to Own:**

  *   **"Probably Single-Peaked":** You can't be *sure*. You have to look at the options, think about how people likely feel, and make a call. Tell the board, "Based on the nature of these options [dates/contractors], I believe preferences *are/are not* likely to fall on a simple spectrum, which makes ranked voting more/less reliable here. It's a judgment, but here's why..."
  *   **Choosing the Escape Route:** GS tells you ranked voting is vulnerable in complex choices. It *doesn't* tell you whether Approval or Score is *better* for your specific group and vote. You have to weigh simplicity vs. expressiveness and make a recommendation. "For the contractors, Approval is simpler and very robust. Score gives more nuance but is a bit more complex. I recommend Approval for this high-stakes vote to minimize any chance of strategic mess."
  *   **No Perfect Solution:** Be upfront. "No voting system is perfect with lots of options. GS tells us that with rankings, strategy is always possible. Approval or Score avoid that specific trap but work differently. We're choosing the best tool for *this* job, balancing fairness, simplicity, and resistance to gaming."

  The key is transparency. Explain *why* you're suggesting a particular method *for this specific vote*, referencing the core problem (strategy/gaming potential) and the trade-offs. Acknowledge the limitations ("It's a judgment call that preferences look single-peaked," "No method is perfect"). This builds trust, shows you've thought deeply about fairness, and shifts the focus from *you* to the inherent challenges of group decision-making. Good luck running the next vote!
