  ```

  ### Leaf Positions Table
  | Leaf Name                           | One-Line Statement                                                                 | Representative Philosopher | Most Awkward Commitment to Swallow |
  |-------------------------------------|------------------------------------------------------------------------------------|----------------------------|------------------------------------|
  | **Anti-reductionism (acceptance principle)** | Hearing an assertion gives immediate warrant; no prior reasons needed, only absence of defeaters. | Tyler Burge                | Must grant toddlers warrant to assert (despite unreliability). |
  | **Assurance/Trust Theory**          | Warrant comes from the speaker’s act of assuming responsibility for truth (like a promise). | Richard Moran              | Excludes non-agents (e.g., toddlers, AIs) from generating testimonial warrant. |
  | **Global Reductionism**             | Testimony is justified if the *whole practice* is reliable; no need for speaker-specific reasons. | Some interpretations of Hume | Historian case: must defend how we know testimony about uncheckable facts is reliable. |
  | **Local Reductionism**              | Only trust speakers you can personally background-check (e.g., verified experts). | Elizabeth Fricker (early)  | Skepticism about unreachable sources (e.g., ancient historians). |
  | **Personal Reductionism (Humean)**  | Each hearer needs independent reasons to trust *the specific speaker*.           | David Hume                 | Demands extensive research for mundane testimony (e.g., bus schedules). |

  ### Notes on Unoccupied/Ambiguous Spaces
  - **"No" → "Medical practice is reliable" → "Only if I verified them"**: Unoccupied. Incoherent—global reductionism rejects requiring personal verification.  
  - **"Yes" → "Personal responsibility" → "Yes" (toddler)**: Leads to anti-reductionism, but anti-reductionism struggles to explain why toddlers (unreliable speakers) confer warrant.  
  - **Personal vs. Local Reductionism Distinction**: The historian case cleanly separates them. Local requires direct verifiability; personal allows indirect reasons (e.g., credentials).  
  - **Assurance vs. Anti-reductionism**: Ambiguous for toddlers. Anti-reductionism includes them; assurance typically excludes them (flagged in tree via Q4).  
  - **Global Reductionism’s "Calibration"**: No branch explicitly asks if societal calibration suffices—this is embedded in Q3’s "medical practice" option.  

  This tree fits on one page (front: questions; back: table). Philosophers are cited only where standardly attributed; "various" avoided per instructions.
