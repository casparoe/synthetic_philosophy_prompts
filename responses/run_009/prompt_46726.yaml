  I'm building a worksheet for my intro epistemology class on testimony, and I want a decision tree that sorts students into a position on the reductionism vs anti-reductionism debate (plus its neighbors). You're a professional epistemologist for this — think carefully and build the tree from the logical space rather than from a list of names.

  Here's the shape I want. First brainstorm a short list of branch questions, each phrased as a concrete case a student with no background could answer without knowing which theory it leads to — nothing like "are you a reductionist about testimony?". The cases I'm imagining (edit as you see fit): a stranger at the bus stop tells you the 4:15 never comes on Sundays; a doctor says your test came back negative; a toddler insists there's a spider in the other room; a historian citing sources none of us could ever check firsthand; a friend tells you something embarrassing about themselves. The branch questions should turn on things like: does hearing an assertion give you some warrant straight away, or do you need independent reasons about the speaker first? If independent reasons are needed, does each individual need them, or can it be enough that the whole practice is well-calibrated? Is there something in the very act of telling someone — a kind of assumption of responsibility, like a promise — that matters epistemically, over and above the evidence conveyed? Does the answer change when the speaker is a child, or a stranger outside your community?

