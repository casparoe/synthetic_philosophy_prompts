       A. Yes, otherwise their virtue is just luck and not truly theirs.
       B. No, we can praise them for being virtuous regardless of how they got that way.

   Question 3: Agent-causal libertarianism - does an undetermined choice escape the regress?
     Case: At a critical moment, a person makes a choice that is not determined by their character or past. They choose to do the right thing. Are they morally responsible for that choice?
     Options:
       A. Yes, because they made the choice freely and it wasn't determined.
       B. No, because even an undetermined choice doesn't make them responsible for being the kind of agent who made that choice.

   Question 4: Extended-self view - does shaping one's character over time ground responsibility?
