   1. Strawson's impossibilism: True desert is impossible because of the regress; we should admit it.
   2. Hard determinism with consequentialist/communicative justification: Desert is impossible, but we keep blame/punishment for other reasons.
   3. Compatibilism (rejecting ultimacy): Rejects the ultimacy requirement; ordinary responsibility is preserved without needing to be causa sui.
   4. Extended-self view: Responsibility attaches to the temporally extended person who shapes their character over time.
   5. Agent-causal libertarianism: An agent can originate choices without prior determination; the regress is avoided by a self that is not determined by prior states.

   Branch points:
     - Accept ultimacy requirement? (genuine desert requires responsibility for how you are in relevant respects)
     - Accept that the regress to causa sui is inescapable? (or think agent-causal libertarianism escapes it)
     - Whether ordinary responsibility can be preserved without strong desert?
     - Whether the extended-self reply works?

   We need at least one question that forces confrontation with the regress.

