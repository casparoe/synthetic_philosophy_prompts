     Options:
       A. Yes, because they did it and it was evil.
       B. No, because they had no control over becoming that kind of person.

   Question 2: Regress (direct confrontation) - does the regress lead to an impossible demand?
     Case: Imagine a person who is very virtuous. To be praiseworthy for being virtuous, must they have been responsible for becoming virtuous in the first place?
