prompt: |-
  i keep getting dragged into arguments about whether viruses are alive, and they always end the same way: everyone lists features, the lists conflict, and nobody can say what would even settle it. before i have this fight again i want the spec first. write the requirements any adequate defintion of life has to meet, keeping in mind the theory needs to be good enough for two separate jobs — ruling on borderline cases here on earth, and recognizing the thing if we ever find it somewhere else, possibly in a chemistry nothing like ours.

  borderline cases it should have something to say about: viruses obviously, and the big ones like mimivirus that carry their own metabolic genes; prions; dormant spores and frozen embryos, where nothing is happening metabolically for centuries but we still want to call them alive; the mule, which is alive but can't do the whole lineage thing; HeLa cells, which outlived the person they came from and arguably became their own thing; a dead tree still standing; and a growing crystal or a self-copying computer program in RAM, which are the cases that are supposed to not count. my labmate also insists on asking about a simulated chemistry where little moving patterns consume a resource and reproduce, and i can't tell if that's alive or if i just described a screensaver.

  distinctions the theory can't collapse, at least if it wants to be taken seriously: alive vs merely self-organizing (stars, hurricanes, convection cells), alive vs merely self-replicating (crystal growth, von neumann probes), alive vs once-alive. results from biology it can't contradict — e.g. it can't imply every gene or every enzyme is alive, or that a sterile worker bee isn't. and a requirement i suspect matters more than people think: whatever the definition is, it can't just mean "descended from our last common ancestor," because then the astrobiology job is unanswerable in principle, and it can't be a naked list of features our particular branch of life happens to have. also it should either explain why the gray zone exists or explain why the gray zone is a defect of our concepts rather than of the world — one of those two.

  for each requirement, give the case or consideration behind it. mark which are non-negotiable and which are just the preferences of particular camps — the metabolism-first people will care about some, the darwinian-evolution-first people about others, and i want to know which demands are real and which are camp shibboleths. most importantly, flag any pair of requirements that can't be jointly satisfied — my suspicion is that "decides the borderline cases cleanly" and "general enough for alien chemistries" pull against each other, but i want to see whether that's real or just my lack of imagination.

  then, briefly, a scorecard: metabolism-first views, evolution-first views (the NASA astrobiology working defintion about a self-sustaining chemical system capable of darwinian evolution), and the autopoiesis / self-maintaining-organization crowd. a table is fine but the criteria are the part i actually care about — don't spend all your words on the scoring.
reasoning: |-
  Hmm, the user is frustrated with endless debates about whether viruses are alive and wants a framework to evaluate definitions of life. They need a set of requirements that any good definition must meet, covering both terrestrial borderlines and potential alien life. Their examples include viruses, prions, dormant spores, mules, HeLa cells, dead trees, crystals, and computer simulations. They also want to avoid definitions that collapse key distinctions or rely solely on Earth's evolutionary history.

  I need to establish core requirements for a definition of life. First, the definition must handle borderline cases like viruses and prions. Dormant spores and frozen embryos are metabolically inactive but should still be considered alive, so the definition must account for potential states. Mules and HeLa cells challenge reproduction as a necessary condition, so the definition needs flexibility there. Non-living entities like crystals and computer programs must be excluded, which means distinguishing self-replication from life.

  Key distinctions are crucial: life vs. self-organization (like hurricanes), life vs. self-replicating machines, and life vs. dead matter. The definition can't contradict biological facts—e.g., it shouldn't classify every enzyme as alive. Also, it must avoid being Earth-centric to remain useful for astrobiology. The user suspects a trade-off between handling borderlines cleanly and being general enough for alien chemistry, so I should highlight if any requirements conflict.

  Now, for the requirements themselves: Universality is non-negotiable; the definition must apply to alien chemistries. Distinction Maintenance is also key—preserving differences between life and similar phenomena. Non-Earth-Centric is essential for astrobiology. Borderline Decidability might be flexible since gray zones exist, but the theory should explain why. Biological Coherence is necessary to avoid absurdities like genes being alive. Gray Zone Handling is preferred but not mandatory, as it could be a conceptual issue.

  Potential conflicts: Universality and Borderline Decidability might clash because alien life could blur our Earth-based categories. For example, a general definition might include certain programs or exclude some Earth borderlines. Also, Non-Earth-Centric and Biological Coherence could conflict if Earth's biology is too specific. I'll note these tensions.

  For the scorecard, I'll compare Metabolism-First, Evolution-First (like NASA's definition), and Autopoiesis views. Metabolism-First fails on dormancy and mules. Evolution-First struggles with mules and HeLa cells. Autopoiesis handles dormancy well but may include non-biological systems. All have strengths in universality but weaknesses in borderlines.

  The user's deeper need is to end circular debates by focusing on criteria rather than camp loyalties. By clarifying which requirements are non-negotiable vs. camp-specific, they can steer discussions toward foundational issues. Highlighting conflicts helps manage expectations—e.g., accepting that clean borders might be impossible for a universal definition. This empowers them to frame the debate more productively.
answer: |-
  Here's a requirements specification for a definition of life, designed to cut through the usual arguments. Requirements are categorized, prioritized, and conflicts are flagged. The scorecard for major camps follows.

  **Core Requirements (Non-Negotiable for Scientific Utility):**

  1.  **Universality (Astrobiological Applicability):** *Must* apply to potential life forms with radically different chemistries, structures, or origins (e.g., silicon-based, plasma-based, non-carbon). Cannot rely on Terran biochemistry, specific molecules (DNA, ATP), or Earth's evolutionary history.
      *   **Why:** The core purpose of defining life includes recognizing it beyond Earth. A definition tied to Earth's specific instance fails the astrobiology job.
      *   **Case:** Recognizing life on Titan, Europa, or around another star.
      *   **Priority:** **Non-Negotiable.**

  2.  **Distinction Maintenance:** *Must* clearly differentiate between:
      *   **Alive vs. Merely Self-Organizing:** (Stars, hurricanes, convection cells, flames).
      *   **Alive vs. Merely Self-Replicating:** (Crystal growth, simple autocatalytic cycles, von Neumann probes, computer viruses).
      *   **Alive vs. Once-Alive:** (A decaying corpse, a dead tree, a fossil).
      *   **Alive vs. Component:** Cannot imply every molecule with catalytic function (enzyme) or information storage (gene) is alive.
      *   **Why:** Collapsing these distinctions renders the definition scientifically useless and counter-intuitive. It must capture the phenomenon we're actually trying to discuss.
      *   **Cases:** Hurricane (self-organizing), Growing Salt Crystal (self-replicating), Standing Dead Tree (once-alive), ATP Molecule (component).
      *   **Priority:** **Non-Negotiable.**

  3.  **Non-Earth-Centric:** *Must not* be equivalent to "descended from Earth's Last Universal Common Ancestor (LUCA)". Cannot be just a list of features unique to Terran biology.
      *   **Why:** Directly violates Universality. Makes astrobiology impossible by definition and ignores the possibility of alternative biochemistries even on Earth (shadow biosphere).
      *   **Case:** Evaluating a potential biosignature in Martian rock or an anomalous microbe deep in Earth's crust with unfamiliar biochemistry.
      *   **Priority:** **Non-Negotiable.**

  4.  **Biological Coherence:** *Must* align with core biological understanding without leading to absurdities. Cannot contradict fundamental observations.
      *   A sterile organism (mule, worker bee) *must* be considered alive.
      *   An organism incapable of independent replication but part of a reproducing lineage (HeLa cell, somatic cell in your body) *must* be considered alive while functional.
      *   A dormant state (spore, frozen embryo, tardigrade in tun) *must* be considered a living state (potential for activity is inherent).
      *   Why: The definition must reflect how biology actually works and categorizes entities. Calling a bee "non-living" because it's sterile, or a spore "dead" because it's inactive, violates biological reality.
      *   Cases: Mule (sterile), HeLa cell (immortal lineage), Frozen Embryo (dormant).
      *   Priority: **Non-Negotiable.**

  **Important Functional Requirements (Highly Desirable, But May Involve Trade-offs):**

  5.  **Borderline Decidability:** *Should* provide clear guidance on canonical borderline cases, or explicitly justify why they are borderline.
      *   **Why:** Practical utility for classification in virology, synthetic biology, origin-of-life research, etc. Ambiguity should be minimized or explained.
      *   **Cases:** Viruses (esp. giant mimiviruses), Prions, Self-Replicating Programs (complex simulations like Tierra/Avida, Conway's Game of Life gliders *with* resource consumption/replication), Von Neumann Probes.
      *   **Priority:** **Highly Desirable (but potentially conflicting with Universality/Gray Zone)**. Some camps (e.g., Evolution-First) prioritize decisiveness; others (Autopoiesis) see gray zones as inherent.

  6.  **Gray Zone Explanation:** *Should* either explain *why* borderline cases exist (e.g., representing transitional states, parasitic simplification, limitations of the definition) OR argue convincingly that the gray zone is a defect in our conceptual framework, not the world.
      *   **Why:** Acknowledges the reality of the debate and pushes towards deeper understanding. Avoids arbitrary lines without justification.
      *   **Case:** The spectrum from free-living bacterium to obligate parasite to virus to viroid to prion.
      *   **Priority:** **Highly Desirable.** Addresses the core frustration of unresolved arguments.

  **Camp-Specific Preferences / Shibboleths (Not Universal Requirements):**

  7.  **Metabolism-First Primacy:** (Camp Preference) Emphasizes *active* processing of energy/matter to maintain a distinct internal state against entropy *as the core defining feature*. Views replication as secondary.
      *   **Why:** Sees self-maintenance as the fundamental process separating living from non-living complex systems.
      *   **Case:** Prioritizes active bacteria over dormant spores (if not careful) or viruses; may struggle with mules/sterility if reproduction is downplayed too much.
      *   **Priority:** **Camp-Specific.**

  8.  **Evolution-First Primacy:** (Camp Preference) Emphasizes the *potential* for open-ended Darwinian evolution (heritable variation + selection) *as the core defining feature*. Views metabolism as a means to sustain the evolutionary process. (NASA definition leans here).
      *   **Why:** Sees evolution as the unique process generating life's complexity and diversity.
      *   **Case:** Prioritizes populations/lineages (mules ok, HeLa ok); struggles with individual sterile organisms if defined too strictly; easily excludes crystals/computers (unless they truly evolve); may include viruses if seen as evolving populations.
      *   **Priority:** **Camp-Specific.**

  9.  **Individuality / Autonomy Focus:** (Camp Preference, common in Autopoiesis) Emphasizes the bounded, self-producing, autonomous nature of the living entity *as an individual*.
      *   **Why:** Sees life as defined by the organizational closure and self-creation of a distinct individual system.
      *   **Case:** Strongly includes cells, organisms; strongly excludes prions, simple crystals; struggles with viruses (lack metabolic autonomy), colonies, symbiotic units; may include complex self-replicating programs/simulations if sufficiently "organizationaly closed".
      *   **Priority:** **Camp-Specific.**

  **Flagged Requirement Conflicts:**

  *   **Universality/Non-Earth-Centric vs. Borderline Decidability (Especially for Earth Cases):** This is the core tension you suspected. A definition broad enough to encompass genuinely alien life (e.g., based on abstract processes like information processing, self-maintenance, or evolution) will *necessarily* be more inclusive. It might bring complex computer simulations, certain non-Terran molecular systems, or even advanced von Neumann probes closer to the "alive" side of the borderline than definitions tightly bound to Terran biochemistry. Conversely, a definition sharpened to decisively exclude viruses and prions on Earth might rely on features (e.g., ribosomes, specific metabolic pathways) that are absent in valid alien life. **This conflict is real and likely unavoidable.** A good definition minimizes it but cannot eliminate it entirely. *Gray Zone Explanation* becomes crucial here.
  *   **Distinction Maintenance (Alive vs. Self-Replicating) vs. Evolution-First Primacy:** Strict Evolution-First definitions risk including any system capable of heredity, variation, and selection, even if purely mechanical/digital (e.g., a properly designed self-replicating robot population undergoing selection). This potentially collapses the "alive vs. merely self-replicating" distinction for non-biological systems.
  *   **Biological Coherence (Dormancy) vs. Metabolism-First Primacy:** Strict Metabolism-First definitions focusing on *active* processes struggle to coherently include dormant states like spores or frozen embryos without adding auxiliary concepts like "potential" or "historical activity," which can feel ad-hoc.

  ---

  **Definition Camp Scorecard (Against Requirements):**

  | Requirement                | Metabolism-First                             | Evolution-First (e.g., NASA)                  | Autopoiesis / Self-Maintenance               |
  | :------------------------- | :------------------------------------------- | :-------------------------------------------- | :------------------------------------------- |
  | **1. Universality**        | **Good** (Focus on process, not specifics)   | **Good** (Evolution is universal concept)     | **Moderate** (Organization principle is abstract, but closure often modeled on cells) |
  | **2. Distinction Maint.**  | **Good** (Excludes simple replicators/storms) | **Moderate** (Struggles with non-bio evolving systems) | **Good** (Strongly excludes non-bounded/organized systems) |
  | **3. Non-Earth-Centric**   | **Good**                                     | **Good**                                      | **Moderate** (Can be biased towards Terran-like individuality) |
  | **4. Biological Coherence**| **Weak** (Struggles with dormancy, sterility)| **Strong** (Handles dormancy, sterility well) | **Strong** (Handles dormancy, sterility well) |
  | **5. Borderline Decid.**   | **Moderate** (Often excludes viruses/prions) | **Moderate** (Often includes viruses)         | **Weak** (Gray zone large - viruses? programs?) |
  | **6. Gray Zone Explan.**   | **Moderate** (Highlights metabolic reliance) | **Moderate** (Highlights evolutionary role)   | **Strong** (Gray zones seen as organizational spectrum) |
  | **Camp Shibboleth**        | Metabolism is Primary                        | Evolution is Primary                          | Organizational Closure/Autonomy is Primary   |

  **Key Takeaways:**

  *   **No camp satisfies all requirements perfectly.** Trade-offs are inherent.
  *   **Evolution-First** scores well on Biological Coherence and Universality but faces challenges with Distinction Maintenance regarding non-biological evolving systems and Borderline Decidability (viruses).
  *   **Autopoiesis** scores well on Biological Coherence and Gray Zone Explanation but struggles most with Borderline Decidability and slightly with Universality/Non-Earth-Centricity due to its focus on bounded individuality.
  *   **Metabolism-First** scores well on Universality and Distinction Maintenance but struggles most significantly with Biological Coherence (dormancy, sterility).
  *   **The core conflict (Universality vs. Earth Borderline Decidability)** is evident in all camps. Evolution-First potentially includes the most non-biological systems (simulations, probes) if they evolve; Metabolism-First and Autopoiesis might exclude some potential alien life if it doesn't fit their process model tightly.
  *   **Gray Zone Explanation** is crucial for any definition, as a perfectly sharp boundary satisfying all requirements across all possible cases is likely impossible. Acknowledging *why* borderline cases are hard is a strength, not a weakness.

  Equipped with these requirements and the scorecard, you can shift future arguments from listing features to evaluating proposed definitions against this spec: "How does your definition handle Universality vs. the Dormant Spore problem? Does it collapse the distinction with a von Neumann probe?" This forces a more productive discussion about the *goals* and *constraints* of a definition, rather than just rehashing dogma. Good luck!
