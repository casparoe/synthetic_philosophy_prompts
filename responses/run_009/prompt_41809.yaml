prompt: |-
  so I'm taking an intro ethics class this semester (we're doing normative theory, just covered deontology vs consequentialism) and I've been fixating on the paradox of deontology, and I want to write my final paper on Dirty Harry (the original 1971 one) but I'm not sure the paper I have in my head actually works, so I need someone to pressure-test it.

  quick setup in case you need it: Scorpio is a sniper who kidnaps a 14-year-old girl and buries her alive with limited air, Harry tracks him to a stadium at night, shoots him, then steps on the wound until he gives up the location — and by the time they dig her up the girl is already dead. then Scorpio walks anyway because the search was illegal, and eventually Harry kills him and throws his badge into the water.

  my paper idea: the stadium scene is the paradox of deontology on film. the consequentialist says torture him, obviously, a life is at stake; the deontologist refuses to torture, and if the girl dies because of that refusal, the restriction looks irrational — what could it possibly be for? that's the Scheffler-style setup. and the badge throw at the end could be read as the film acknowledging moral residue or dirty hands, which is exactly what the "deontology is irrational" objection says can't be explained.

  but here's where I get stuck, and where I'd like your honest reading:

  1. is the stadium scene even a clean instance of the paradox? Harry has already broken in without a warrant, and the plot point afterwards is that Scorpio goes free because of the illegal search. so the film may actually be dramatizing something adjacent but different — the rights of the guilty, procedural justice, the idea that constraints on law enforcement protect everyone — rather than agent-relative restrictions against doing harm. my professor would say I'm conflating legal constraints with deontological ones. am I?

  2. does the film ever show Harry *refusing* to do something bad for good ends? I can't think of a scene where he holds the line, which matters, because if the answer is no then the film isn't really testing deontology at all — it's a strawman of it. the Scorpio-hires-a-thug-to-beat-himself-up scene (to frame Harry for police brutality) feels like it's engineered to make the audience stop feeling bad about whatever Harry does next, which is kind of the opposite of dramatizing a dilemma.

  3. I want to bring in threshold deontology somewhere — the view that restrictions hold until enough is at stake, then give way. does the film have a coherent threshold position, or is Harry just doing whatever the plot needs?

  4. the meta-worry: this is a 1971 Nixon-era movie and the standard critical take is that it's reactionary, courts are soft, rights protect scum etc. if I take the paradox of deontology seriously, do I have to concede that the film presents rights only as bureaucratic obstacles rather than as what makes torture wrong in the first place? like, can a movie that frames rights as the problem be a good vehicle for a theory that says rights are the point?

  what I want is a reading that takes both the film and the actual philosophy seriously — where does the movie dramatize something the paradox papers miss (maybe the moral residue thing, or the fact that the girl is already dead so the torture accomplished nothing, which no tidy trolley case ever does), and where does the film cheat or resist the reading. and be honest if the honest answer is that this is a bad movie choice for this topic and the badge throw is just cowboy catharsis, I'd rather know now than after I write 3000 words on it lol. also please don't quote dialogue at me, I don't have the script handy to check it against.
