  Second, the user wonders if Harry ever refuses to do something bad for good ends. If he doesn't, then the film isn't really presenting a deontological stance but rather vilifying it. Harry consistently breaks rules, and the scene where Scorpio frames him for brutality seems designed to make the audience side with Harry, undermining any moral dilemma. This is a valid point. The film doesn't show a character upholding deontological principles; instead, it positions rights as obstacles. That weakens the paradox setup because the paradox requires a genuine conflict between rules and outcomes, which isn't dramatized here.

  Third, threshold deontology: the idea that rules hold until stakes exceed a certain point. Does Harry operate on such a threshold? The user points out that in the stadium scene, Harry tortures because a life is at stake. But later, he kills Scorpio after he's free, which seems more about revenge. The movie doesn't establish clear thresholds; Harry's actions seem plot-driven rather than principle-based. This inconsistency makes it hard to argue for a coherent ethical framework in the film.

  Fourth, the meta-worry about the film's political context. Made in 1971 during the Nixon era, it's often seen as reactionary, criticizing soft courts and rights that protect criminals. If the film frames rights as mere bureaucratic hurdles, can it still engage with deontology, which sees rights as fundamental? The user wants to take both the film and philosophy seriously, but the movie's stance might inherently undermine deontological values. However, the badge throw could be a moment of moral residue, acknowledging the cost of violating norms. That's a point where the film might add to the philosophical discussion, showing the emotional toll even if the action seemed necessary.

