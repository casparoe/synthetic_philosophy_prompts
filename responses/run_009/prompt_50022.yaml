prompt: |-
  In my civics class, a discussion about lowering the voting age turned into a running argument between two classmates, and they have asked me to referee it, which I do not feel able to do on my own. The disagreement began when our teacher mentioned that some countries allow sixteen-year-olds to vote, while long-term resident non-citizens in most democracies cannot. Rohan argued for what he called the "affected principle": anyone whose interests are meaningfully shaped by a decision has a claim to a vote on it, which would include sixteen-year-olds, resident non-citizens, and even future generations, perhaps through proxies. Maya replied that this is far too expansive, since almost every policy affects almost everyone in some diffuse way, and that the right criterion is being subject to the law's coercion: resident non-citizens belong, but future generations do not, because they are bound by no law yet. Rohan countered that "subject to coercion" has symmetrical problems: tourists passing through are subject to the laws during their stay, so her principle seems to hand them a vote, while excluding future generations who will bear the consequences of today's environmental policy far more than any tourist will. Maya answered that brief, consensual subjection is not the same as standing subjection, and that future generations can have their interests protected without being members of the demos, just as animals' interests can be weighed without animals voting. Rohan's last move was that children are plainly subject to the law's coercion and yet we deny them the vote, so her criterion cannot be sufficient either; and if she patches this with a competence requirement, he does not see why competence would not equally defeat his side's claims, since an affected but incompetent person is affected all the same. Could you adjudicate this exchange move by move — saying who is right at each step and why, not merely who wins overall — and, in addition, tell us whether there is something both of them are missing about what the membership question is actually for?
reasoning: |-
  Okay, let me unpack this fascinating civics debate. The user presents a multi-layered philosophical disagreement between Rohan and Maya about voting rights criteria, needing both move-by-move adjudication and identification of what's missing. 

  First, I notice this isn't just about voting age - it's fundamentally about what constitutes legitimate political membership. The user seems intellectually engaged but overwhelmed by the complexity, acting as reluctant referee. Their phrasing ("not feel able to do on my own") suggests they want clarity without oversimplification.

  Breaking down the exchange:
  Rohan's opening "affected principle" is appealingly inclusive but indeed overbroad - Maya's "diffuse effects" counter is strong here. Her coercion criterion then seems tighter, but Rohan cleverly tests its boundaries with tourists and future generations. Maya's distinction between transient and standing subjection holds water, though her future generations argument feels weaker since humans aren't comparable to animals politically. 

  Rohan's child coercion point is sharp - it exposes coercion as insufficient alone. But his competence objection may conflate two things: competence as maturity (developmental) versus competence as knowledge (acquirable). That's where both might be missing something - they're treating voting rights as monolithic when different groups may require different solutions.

  The core gap I see is both assuming a single principle suffices. Real voting rights debates involve balancing: 
  - Input legitimacy (affected interests)
  - Output legitimacy (coercion justification)
  - Practical concerns (competence/feasibility)
  - And crucially - the community's self-definition purpose of elections beyond mere utility

  The user might benefit from understanding that democracies use hybrid approaches: age thresholds balance development with inclusion, resident alien rights vary by national identity conceptions, future generations get representation via trusteeship models. Neither pure principle works alone because voting serves multiple purposes - not just justice but collective agency.

  I'll structure the response by:
  1. Analyzing each exchange move neutrally
  2. Highlighting where each scores points but falls short
  3. Then revealing the multidimensional reality beneath the debate
  4. Suggesting that the "what elections are for" question matters more than finding one perfect criterion
answer: |-
  Let's adjudicate this exchange move by move, identifying the strengths and weaknesses in each argument, before addressing what both might be missing about the purpose of political membership.

  ### Move 1: Rohan's "Affected Principle"  
  *Claim*: Anyone whose interests are meaningfully shaped by a decision deserves a vote (including 16-year-olds, resident non-citizens, future generations via proxies).  
  **Who is right?** **Maya has the stronger point here.**  
  - **Why**: Rohan's principle is indeed over-expansive. As Maya notes, virtually everyone is "affected" by policies in diffuse ways (e.g., global trade policies affect foreign workers; U.S. interest rates affect foreign economies). Granting votes based on "affectedness" could erode the coherence of the *demos* (the political community), making elections logistically and philosophically unmanageable. 

  ### Move 2: Maya's "Coercion Principle"  
  *Claim*: Voting rights should be tied to being subject to the law’s standing coercion (residents belong; future generations do not).  
  **Who is right?** **Rohan has the stronger point here.**  
  - **Why**: Maya’s principle resolves the overbreadth of "affectedness," but Rohan correctly identifies a flaw: transient subjects (e.g., tourists) are coerced by laws during their stay yet aren’t granted votes. Her principle would either absurdly enfranchise tourists or require arbitrary distinctions about duration. Future generations also face profound coercion from today’s laws (e.g., climate policy), which her framework ignores.  

  ### Move 3: Maya's Refinement of Coercion  
  *Claim*: Distinguishes "brief, consensual subjection" (tourists) from "standing subjection" (residents). Future generations’ interests can be protected without voting, like animal welfare.  
  **Who is right?** **Maya partially recovers.**  
  - **Why**: The distinction between transient and standing subjection is widely accepted in democratic theory (e.g., resident non-citizens pay taxes and live under laws long-term). However, **Rohan is right** that her analogy to animals fails: future generations are *human members* of the polity who will inherit coercive institutions, unlike animals. Protecting their interests via proxies is theoretically plausible but avoids the core question of *political agency*.  

  ### Move 4: Rohan’s Child Coercion Challenge  
  *Claim*: Children are coerced by laws but denied votes, so coercion isn’t sufficient. Adding competence requirements could exclude his groups (16-year-olds, affected but incompetent adults).  
  **Who is right?** **Rohan scores decisively here.**  
  - **Why**: Children *are* coerced (e.g., truancy laws, juvenile justice) yet universally excluded from voting. Maya’s coercion principle cannot explain this without appealing to competence—but as Rohan notes, if competence is added, it could undermine both sides: 16-year-olds may fail competence thresholds, while "incompetent" adults (e.g., with cognitive disabilities) are still coerced. This exposes coercion as **necessary but insufficient** for defining the *demos*.  

  ### Overall Winner?  
  **A draw, with both making valid critiques but offering incomplete solutions.**  
  - Rohan’s "affected principle" is normatively appealing but practically unworkable.  
  - Maya’s "coercion principle" is institutionally sound but excludes normatively relevant groups (e.g., youth, future generations).  

  ---

  ### What Both Are Missing: The Purpose of Political Membership  
  The debate focuses on *who deserves inclusion* but overlooks **why we define a *demos* in the first place**. Democracies need boundaries to serve three core functions:  
  1. **Collective Agency**: Voting enables a community to act together, not just receive protection. Future generations or tourists lack ongoing stakes in shaping the community’s future.  
  2. **Reciprocity**: Members are both rulers and ruled. Resident non-citizens experience coercion but may lack permanent ties; minors are in transitional roles.  
  3. **Feasibility**: Democracies require a stable, identifiable electorate. "Affected" groups like foreign investors or future generations are impossible to enumerate or consult practically.  

  ### A Better Path Forward  
  Real-world democracies use **hybrid criteria**:  
  - **Birthright/residency** defines initial membership.  
  - **Age thresholds** balance competence with lifelong stakes (16-year-olds may vote if deemed competent, as in Germany/Austria for local elections).  
  - **Non-citizen voting** exists in local elections (e.g., EU residents) where policies directly impact daily life.  
  - **Future generations** are represented via institutions (e.g., environmental ombudsmen), not votes.  

  Rohan’s moral concern (affected interests) and Maya’s institutional concern (coercion) both matter—but the *demos* must ultimately be a body capable of deliberation, reciprocity, and collective action. Neither principle alone suffices; democracies combine them pragmatically.  

  Your classmates have illuminated real tensions, but voting rights aren’t derived from a single axiom. They reflect a society’s evolving answer to: *Who belongs to "We the People"?*
