answer: |-
  ### PREP SHEET: DEFENDING CUSTODIAL CONTINUITY  
  *(Ordered by descending damage potential)*  

  ---

  ### **#1: THE ORGANIZER’S DERELICT SHIP OBJECTION**  
  *(Must hold firm — concession collapses the theory)*  
  **Objection (Sympathetic but lethal):** "If a derelict ship is abandoned for centuries, then re-adopted by a community that *sincerely treats it* as the original — polishing its plaque, singing its old sea shanties — your view declares it the *same ship*. But this makes identity *hostage to collective error*. Even conventionalists should blush: a bronze age canoe ‘rediscovered’ by modern hobbyists isn’t King Agamemnon’s flagship!"  

  **🗣️ 2-Minute Reply:**  
  > "It doesn’t. Custodial continuity requires *inheritance of responsibility* for the *very object*, not just attitudes *about* it. Re-adopters may *believe* they resume custody of Odysseus’ ship, but unless they stand in a chain of duty-bound accountability (e.g., legal trustees, consecrated heirs), they merely initiate a *new* custodial practice over salvaged wood. The derelict *ceased* when abandonment severed responsibility. What they revive is a replica-in-intent — not identity. Collective enthusiasm ≠ custody."  

  **⚠️ Soft Spot:**  
  Distinguishing "sincere responsibility" from "sincere delusion" relies on normative practices (law, institutional roles). If the re-adopters *are* the original crew’s descendants with a credible claim of lapsed stewardship, intuitions waver.  

  ---

  ### **#2: ENDURANTIST CHARGE: "THIS ISN’T METAPHYSICS"**  
  *(Concede nothing — this is the core fight)*  
  **Objection (From half the room):** "Persistence is *mind-independent, determinate fact*. You’ve replaced ontology with sociology — asking ‘who feels responsible?’ instead of ‘what exists?’. This isn’t a theory of *identity*; it’s anthropology of *belief*."  

  **🗣️ 2-Minute Reply:**  
  > "I reject the dichotomy. Custodial practices *constitute* artifact identity *as* a metaphysical fact. Consider: without minds, there are no ships — only timber arrays. Artifacts are *essentially* intention-dependent. Custody stabilizes their persistence conditions *objectively*: it’s why we prosecute thieves of ‘the same’ Rembrandt, not just similar paint. Your ‘mind-independence’ demand conflates artifacts with natural kinds."  

  **⚠️ Soft Spot:**  
  Hard endurantists will see this as question-begging. Requires doubling down on artifact exceptionalism.  

  ---

  ### **#3: HISTORIAN’S MUSEUM COUNTEREXAMPLE**  
  *(Concede selectively — use their cases)*  
  **Objection (Armed with evidence):** "The Sutton Hoo helmet was restored from 500 fragments into ‘the same’ artifact. But custody passed from Anglo-Saxon kings → soil → archaeologists → British Museum. By your view, it ‘ceased’ upon burial! Yet no historian says the display case holds a ‘new helmet’."  

  **🗣️ 2-Minute Reply:**  
  > "A critical correction: burial isn’t abandonment if the culture maintains *narrative continuity* (sagas, graves as sacred trusts). Modern archaeologists act as inheritors of that duty — unlike your preservation society *barred* from the Ship of Theseus. But take the Portland Vase: shattered in 1845, reconstructed from dust. If the British Museum *discarded* the fragments and later glued them as a ‘recreation’, that *is* a new vase. Custody must be *continuous*, not resurrected."  

  **⚠️ Soft Spot:**  
  "narrative continuity" risks vagueness. Historian may cite cases where society forgets an object entirely, yet still calls it "the same" upon rediscovery.  

  ---

  ### **#4: PERDURANTIST "MERELY VERBAL" DISMISSAL**  
  *(Concede ground to save the core)*  
  **Objection (From the 4Dists):** "Your ‘debate’ confuses semantics with ontology. We all agree on temporal parts; you’re just proposing a new *sortal* "custodial ship" to replace "material ship". Useful for museums? Maybe. Metaphysics? No."  

  **🗣️ 2-Minute Reply:**  
  > "Granted, perdurantism *can* model this. But your ‘temporal parts’ don’t explain *why* we track custodial ships. My account *grounds* the sortal: custody explains why we privilege certain aggregates. When museums debate if Napoleon’s coat is ‘original’, they’re arguing about chains of responsibility — not spacetime worms. I give the *reason* your parts get grouped."  

  **⚠️ Soft Spot:**  
  Perdurantists win if they frame custody as "just a predicate". Must insist it’s constitutive.  

  ---

  ### **#5: FISSION: TWO RIVAL CREWS CLAIMING THE DERRICT**  
  *(Must hold — fission tests are make-or-break)*  
  **Objection (Structural worry):** "Two crews (A and B) simultaneously restore the same abandoned hull, each claiming sole custody. Is there one ship? Two? Does identity split like a amoeba?"  

  **🗣️ 2-Minute Reply:**  
  > "Neither crew inherits custody of the original — both initiate *new* ships. Custody requires *exclusive responsibility*; rival claims collapse into competing *new* artifacts. Like two artists ‘restoring’ the same fresco from flakes: we get two modern artworks, not Botticelli multiplied. The original ceased upon abandonment."  

  **⚠️ Soft Spot:**  
  If both crews have equally valid claims (e.g., warring heirs), intuitions lean toward "one ship, contested". Custody’s exclusivity may feel artificial.  

  ---

  ### **#6: MEREOLOGICAL ESSENTIALIST’S SCOFF**  
  *(Concede early — they’re immovable)*  
  **Objection (From the radicals):** "Replace *one plank* and the ship is gone. Your ‘custody’ is epiphenomenal. Identity is mereological invariance."  

  **🗣️ 2-Minute Reply:**  
  > "I accept your view is consistent — but at the cost of making *all* artifacts ephemeral. We both agree the reassembled-planks ship is new. Where we differ: you must deny repaired ships persist *at all*. Custody explains why we (and the Admiralty) treat HMS *Victory* as existing since 1765 despite 90% replacement. Your theory can’t capture practice without denying change."  

  **⚠️ Soft Spot:**  
  They’ll happily bite the bullet: "Yes, *Victory* is gone". Ends in stalemate.  

  ---

  ### **THE QUESTION I HOPE NOBODY ASKS:**  
  > **"Suppose custody lapses *temporarily* — e.g., the crew is jailed for a week during repairs, unaware of the ship’s state. Is the ship that exists on Day 8 *identical* to Day 1’s? If yes, how is this gap different from your 10-year case? If no, isn’t identity absurdly fragile?"**  

  **Why it’s deadly:** Forces a arbitrary threshold for "severance". Any reply (e.g., "responsibility persists if intent does") invites slippery slopes back into the derelict problem.  

  ---  
  **STRATEGIC NOTES**  
  - **Concede:** Linguistic flexibility to perdurantists; mereological essentialism’s consistency; some museum cases involve "custody by proxy".  
  - **Hold Firm:** Custody as constitutive (not epistemic); artifact/mind-dependence; fission/derelict verdicts.  
  - **Reframe Constantly:** "This isn’t sociology — it’s the *metaphysics of intention-dependent objects*."  

  **Time discipline:** Clock each reply. If over, cut with: "The full treatment is in Section 4, but briefly — [one sentence]."
