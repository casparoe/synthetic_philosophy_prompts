prompt: |-
  My brother and I have been arguing ever since a documentary about welfare policy sent us down a rabbit hole, and I've realized I actually don't know what I mean when I say two people are "equally well off." I've been testing myself on cases, and my gut verdicts seem to point in different directions, so I want to lay them out and see if there's a single principle underneath, or whether I'm just being inconsistent.

  Here are the verdicts. If someone is paralyzed and needs an accessible apartment and a wheelchair, I think society clearly owes her the difference — it's not fair that she's worse off through no choice of hers, and money or services should make it up. Same for someone born with a condition that requires constant medication. But if someone simply has really expensive tastes — he genuinely suffers unless he can drink vintage wine, feels plain bread as an insult — I don't feel we owe him anything, even though by his own lights he's just as badly off as the paralyzed woman. Then there's the guy who could work but surfs all day and is poor: no compensation, obviously. Yet an artist who deliberately takes a badly paid job she finds deeply fulfilling — I feel almost the same about her, no compensation, but not quite as confidently, and I can't say why. Two more that trouble me: a woman in grinding poverty who has genuinely cheerful, modest expectations and reports being perfectly content — I feel she's still badly off, even though by her own happiness she's fine. And a man who's had a hard life and adjusted his hopes down until he no longer wants anything he can't have — something about that bothers me even more, as if the contentment itself were the injury.

  So my question is: is there one currency of equality that gets all or nearly all of these right — is it about resources (money and goods in your hands), welfare (how well your life actually goes for you, by your own lights), or something in between, like what you're genuinely able to do and be regardless of whether you end up wanting to use it? I can see that welfare handles the poverty-but-cheerful case badly, and that resources handles the wheelchair case badly too (the same money buys different lives), but I don't want to just bolt the two together with no story. Please tell me what principle best captures my verdicts, which verdicts it can't accommodate and I should probably give up, and — this is the part I most want — what it says about two cases I haven't decided: someone who freely takes a huge gamble, knows the odds, and loses everything; and someone who would be miserable in every life available to her, not because anything external is wrong, but because of how her mind is put together.
reasoning: |-
  Okay, the user is struggling with the concept of what it means for two people to be "equally well off." They've presented several scenarios where their intuitive judgments seem inconsistent and are looking for a unifying principle. Let me start by breaking down each case they mentioned.

  First, the paralyzed person needing accommodations—they feel society should provide support. Then, the person with expensive tastes—no support, even though they suffer just as much. The surfer who chooses not to work—no compensation. The artist taking a low-paying job—similar to the surfer but less confidence. The cheerful poor person—still seen as badly off despite their contentment. The man who adjusted his expectations—contentment feels like an injury.

  The user is torn between resources, welfare, and capabilities as the basis for equality. They want to know which principle aligns with their judgments and how to handle the undecided cases: the gambler who loses everything and the person who would be miserable in any life.

  Looking at the cases, capabilities theory seems to fit best. Providing wheelchair access isn't about money but enabling functionings. Expensive tastes aren't covered because society shouldn't subsidize preferences. The surfer and artist chose their paths, so no compensation. The cheerful poor person lacks capabilities even if she's happy. The man lowering his desires—his capabilities are restricted, making his contentment a result of oppression.

  For the gambler: since it was a free choice with known risks, no compensation. The person miserable by nature: here, capabilities might struggle. We can provide resources and opportunities, but if internal factors prevent well-being, it's beyond redistribution. Mental health support might be needed, but it's a challenge for equality theories.

  The user's deeper need might be reconciling fairness with personal responsibility. They want a principle that avoids subsidizing choices while ensuring genuine equality of opportunity. Capabilities address that by focusing on what people can do and be, regardless of their circumstances. The user might also be seeking validation of their intuitions and guidance on where those intuitions might need adjustment. They care about systemic injustices versus individual agency, which capabilities handle by distinguishing between choice and circumstance.
answer: |-
  Your intuitions are remarkably consistent and point strongly toward the **Capability Approach**, primarily associated with Amartya Sen and Martha Nussbaum. This framework argues that what matters for equality is not just resources (money, goods) nor just subjective welfare (happiness, satisfaction), but **what individuals are substantively able to do and be** – their real freedoms and opportunities to achieve valuable "functionings" in life.

  Here's how the Capability Approach explains your verdicts:

  1.  **Paralyzed Person (Needs Apartment/Wheelchair):**
      *   **Verdict:** Society owes compensation.
      *   **Capability Explanation:** Resources alone (money) are inadequate because she lacks the *capability* to move freely, access buildings, or live independently. Society should provide resources/services *specifically to restore core capabilities* (mobility, access, independence) that others enjoy. It compensates for a lack of capability due to unchosen circumstance.

  2.  **Person Needing Constant Medication:**
      *   **Verdict:** Society owes compensation.
      *   **Capability Explanation:** The unchosen health condition severely restricts fundamental capabilities (health, longevity, potentially working, socializing). Compensation targets restoring the capability for a normal healthy life.

  3.  **Person with Expensive Tastes:**
      *   **Verdict:** Society owes *nothing*.
      *   **Capability Explanation:** This person has the *capability* to achieve a basic level of nourishment and satisfaction (they *could* eat ordinary food and be physically fine). Their suffering stems purely from their *preferences*, not a *lack of capability*. Equality is about ensuring capabilities, not satisfying expensive preferences formed under conditions where basic capabilities exist.

  4.  **Surfer Choosing Leisure Over Work:**
      *   **Verdict:** No compensation.
      *   **Capability Explanation:** This person likely possesses the *capability* to work and earn income (assuming no disability). Their poverty results from a *choice* about how to use their capabilities and resources. Equality doesn't mean equal outcomes regardless of choice; it means equal effective *opportunity* (capability).

  5.  **Artist Choosing Low-Pay Fulfilling Work:**
      *   **Verdict:** (Mostly) No compensation.
      *   **Capability Explanation:** Similar to the surfer. She possesses the capability to earn more but *chooses* a path that offers high non-material fulfillment (capability for meaningful work, self-expression) in exchange for low material resources. This is a free choice utilizing her capabilities. Your slight hesitation might stem from acknowledging that society *could* potentially value and support artists more broadly (enhancing the capability for meaningful work for more people), but not necessarily compensating *this individual* for her specific choice.

  6.  **Cheerful Person in Poverty:**
      *   **Verdict:** Still badly off.
      *   **Capability Explanation:** Resources alone don't define being well-off, nor does subjective happiness. What matters is her *capability set*: she lacks the genuine freedom (capability) to access adequate nutrition, healthcare, education, security, or participate fully in society, even if she doesn't currently *desire* these things due to adaptation. Her poverty objectively restricts her capabilities. Her contentment doesn't negate the deprivation.

  7.  **Person Who Adjusted Hopes Downward:**
      *   **Verdict:** Contentment feels like an injury.
      *   **Capability Explanation:** This is the clearest case of **"Adaptive Preferences"** – lowering desires to cope with unchosen, unjust deprivation. The "injury" is the *lack of capability itself* that *caused* the adaptation. His contentment is a symptom of the restriction of his freedoms. He lacks the *capability* to aspire to or achieve a wider range of valuable functionings. Equality requires expanding the capability set, not accepting the diminished preferences formed under constraint.

  **The Core Principle: Equal Effective Freedom to Achieve Valuable Functionings**

  The unifying principle is: **People should have equal effective freedom (capability) to achieve a set of core functionings essential for a dignified and flourishing human life, compensating only for deficits in capability arising from unchosen circumstances, not for choices made from a position of adequate capability, nor for expensive tastes.**

  **Your Undecided Cases Explained by Capability:**

  1.  **The Gambler (Free Choice, Knew Odds, Lost Everything):**
      *   **Capability Verdict:** No compensation owed (beyond perhaps a basic safety net ensuring survival capabilities).
      *   **Reasoning:** He started with the capability to earn/keep resources and the capability to make informed choices. He *chose* to gamble, accepting the known risk. His loss results from his free choice utilizing his capabilities. Society might provide minimal support to ensure core survival capabilities (food, shelter) to prevent destitution, but not to restore his pre-gambling wealth. He bears the responsibility for his choice.

  2.  **The Person Miserable in Every Available Life (Due to Internal Mindset):**
      *   **Capability Verdict:** Society should provide resources/opportunities to enhance capabilities *as far as possible*, but achieving equal *subjective welfare* may be impossible. Compensation focuses on capability expansion, not happiness parity.
      *   **Reasoning:** This is complex and highlights a challenge. The Capability Approach would focus on:
          *   Ensuring she has access to resources and opportunities equivalent to others (e.g., income, healthcare, education, social participation).
          *   Specifically providing access to mental health support, therapy, medication, or other services aimed at *enhancing her capability* for mental well-being, emotional regulation, finding meaning, etc. – treating the internal condition like any other health condition restricting capabilities.
          *   **Limitation:** There *might* be a point where, despite maximizing resources and targeted support for mental capability, her subjective experience remains profoundly negative due to immutable internal factors. The Capability Approach accepts that achieving *equal welfare* might be impossible here. Equality is judged based on the *freedom and opportunity* provided (the capability set), not the actual level of happiness achieved with it. Society has fulfilled its duty by providing the best possible capability set; her internal response is beyond the scope of distributive justice to equalize.

  **What the Capability Approach Doesn't Easily Handle (And You Might Need to Give Up):**

  *   **Precise Metric:** Defining the exact list of "core capabilities" and measuring capability sets is inherently complex and value-laden compared to measuring income or happiness. Your intuitions might rely on an implicit list (mobility, health, sustenance, shelter, social participation, meaningful activity, etc.), but philosophers debate this.
  *   **The "Miserable by Nature" Case:** As above, it accepts that equal *capability* might not lead to equal *welfare*, and focuses on the former. If you strongly feel equality *must* include equal welfare, this aspect of your intuition might clash. The Capability Approach asks you to moderate that impulse.
  *   **The Artist/Surfer Ambiguity:** Distinguishing a "genuine" capability-based choice (artist pursuing meaning) from "laziness" (surfer) can be fuzzy in practice. Your slight hesitation with the artist might reflect this. The approach relies on judging whether the choice stems from adequate capabilities and reflects genuine values.

  **Conclusion:**

  Your gut reactions powerfully align with the **Capability Approach**. You consistently reject both pure resource equality (it fails the wheelchair user) and pure welfare equality (it fails the cheerful poor person and the person with expensive tastes). Instead, you focus on **what people are genuinely able to do and be**, compensating for unchosen deficits in these capabilities (disability, health, oppressive poverty causing adaptive preferences), while holding people responsible for choices made from a position of adequate capability (surfer, gambler, expensive tastes). The approach provides a coherent framework for your verdicts and offers clear, principled answers to your undecided cases. The challenge lies in defining and measuring capabilities, and accepting that equal capability doesn't guarantee equal happiness.
