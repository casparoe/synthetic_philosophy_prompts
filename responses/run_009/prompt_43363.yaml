answer: |-
  ## Proposal: Endogenous Timing and the Fragility of Information Cascades: A Theoretical and Experimental Investigation

  The phenomenon of information cascades, wherein individuals rationally ignore their private information to imitate predecessors, stands as a cornerstone result in economics, explaining phenomena from fads to financial panics. Its canonical models, however, rely on a critical but rarely scrutinized assumption: that the sequence of actions is exogenously fixed and fully observable, while the *timing* of those actions, and crucially, the *inaction* of those who might choose to delay, remains opaque. In reality, across domains like technology adoption, bank runs, and online reviewing, individuals actively choose *when* to act. Furthermore, in many settings – a visible queue of depositors, a list of pending reviews, the conspicuous absence of early adopters – the act of waiting itself is observable. This project proposes to rigorously investigate the hypothesis that incorporating endogenous and observable timing fundamentally alters the logic of information cascades, potentially rendering them fragile or even self-defeating. Specifically, we ask: Under what conditions do information cascades persist when agents strategically choose both *when* and *what* to do, knowing that their delay (or promptness) provides information to others? And what institutional features – such as deadlines enforcing simultaneity, opaque sequencing, or visible queues – mitigate or exacerbate this fragility?

  Standard cascade models derive their power from the observation that actions can overwhelm private signals. However, they assume agents act in a predetermined order, seeing only the binary choices (e.g., adopt/reject) of those who acted before them. The fact that an agent acts *now* rather than later is uninformative; it is merely part of the exogenously imposed sequence. This project contends that when timing is endogenous, the very act of *not* acting immediately becomes a meaningful signal. An agent with strong positive private information about a new product should rush to adopt, reaping early benefits or avoiding stock-outs. Conversely, an agent with weak or negative signals, for whom acting is cheap or even beneficial to delay (e.g., waiting for more reviews), might rationally hold back. If this delay is observable, it signals potential negativity to others. Forward-looking agents will anticipate that their own delay sends such a signal, incorporating the expected informational impact of their timing into their decision calculus. This dynamic might unravel a cascade: the silence of others, rather than being neutral, becomes a growing signal of negativity, prompting later agents to act contrary to the initial positive actions or to delay further themselves, amplifying the signal. The standard cascade result leaves this dynamic unexplored, assuming away both the choice of timing and its observability.

  To address this, the project will unfold in two integrated phases over twelve months. The first six months will be dedicated to developing a tractable theoretical model. We will start with the foundational sequential binary-action cascade setup (e.g., adopt/reject a product of uncertain quality) but introduce endogenous timing. Agents arrive at the decision context over time. At each moment, an agent can choose to act immediately (adopt or reject) or delay, incurring a small waiting cost. Crucially, other agents observe not only the actions of those who have acted but also the *set of agents currently delaying*. The model will incorporate heterogeneous private signals, benefits from early adoption, waiting costs, and crucially, agents who are sophisticated enough to understand that their delay conveys information about their private signal strength. We will solve for equilibria, focusing on whether cascades – defined as periods where agents ignore their private signals and follow the majority of observed actions – can emerge and persist. Key parameters will include the cost of waiting, the strength of early adoption benefits, and the precision of private signals. The model will generate testable predictions about when cascades collapse (e.g., prolonged silence leads to mass rejection despite initial adoptions) versus when they persist (e.g., under high pressure to act quickly).

  The subsequent six months will involve laboratory experiments designed to test the model's core predictions and isolate the impact of specific institutional features. Participants will face a classic cascade setup (e.g., guessing the color of a majority urn based on private draws and predecessors' guesses) but with crucial variations in timing rules. The core treatments will contrast:
  1.  **Exogenous Order (Baseline):** Participants act in a fixed, known sequence, observing only previous guesses. (Standard cascade environment).
  2.  **Endogenous Timing, Actions Only Observed:** Participants choose *when* to guess within a period, but others only see the guess once made, not the time taken or who is still waiting.
  3.  **Endogenous Timing, Actions *and* Waiting Observed:** Participants choose when to guess; others see guesses *and* the real-time list of participants who are still deliberating/delaying.
  4.  **Deadline with Simultaneity:** Participants deliberate privately but must submit their guess simultaneously at a deadline; no observation of others' deliberation timing.
  5.  **Visible Queue:** Similar to Treatment 3, but participants explicitly join a visible queue upon deciding to act, making the order of pending actions clear.

  The key metrics will be the frequency and persistence of cascades (actions contrary to private signals following public information) and the patterns of delay. Survival of the cascade phenomenon would be evidenced by robust cascading behavior in Treatments 1, 2, 4, and 5, similar to the baseline. Collapse of cascades would be evidenced by a significant reduction in cascading, particularly in Treatment 3 (Endogenous + Waiting Observed), where hesitation becomes informative. The impact of deadlines (Treatment 4) and queues (Treatment 5) would reveal whether specific institutions can restore cascade dynamics by obscuring or re-interpreting the timing signal. Careful experimental design, including control over signal strengths and incentives, will ensure clean identification.

  The project faces identifiable risks. Theoretically, deriving clear equilibria in the endogenous timing model may prove intractable, requiring simplifying assumptions that might dilute the core insight. We may need to focus on specific cases or numerical solutions. Experimentally, participants might fail to grasp the strategic implications of their timing, dampening the predicted effects. The waiting costs or benefits implemented in the lab might be too artificial or insufficiently motivating. It is also possible that the endogenous timing effect, while present, is quantitatively small, making the fragility less pronounced than hypothesized. Conversely, the effect could be so strong that cascades vanish entirely under observable delay, leaving little room to study institutional variations. An honest assessment requires acknowledging that the theoretical novelty hinges on the model yielding non-trivial, testable insights distinct from standard cascade or waiting game models, and the experimental challenge lies in creating an environment where timing choices are both meaningful and strategically understood.

  The implications of resolving this question extend significantly beyond the laboratory. Understanding how endogenous timing affects herding is crucial for designing robust systems. If cascades collapse under observable delay, platforms relying on early reviews (e.g., app stores, marketplaces) might need to hide review queues or implement deadlines to trigger initial feedback and prevent a negative silence spiral. Conversely, in contexts like bank runs, where a cascade of withdrawals is catastrophic, mechanisms that make hesitation visible (like observable queues for withdrawal requests) could paradoxically help stabilize the system by signaling that many are *not* rushing to exit. Policymakers concerned with financial stability, platform designers aiming for accurate reputation systems, and marketers launching new products all grapple with sequential decision-making under uncertainty. This project provides a rigorous theoretical framework and empirical evidence to understand when the powerful force of information cascades holds, and when it might be undermined by the simple, observable act of waiting. By bridging a gap in foundational theory with controlled experimentation, it promises to yield insights into the mechanics of social learning in dynamically complex environments.
