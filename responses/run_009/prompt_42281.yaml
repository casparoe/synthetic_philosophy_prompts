prompt: |-
  I'm the deputy country director for a humanitarian NGO in a country where, roughly monthly, we face decisions that feel morally off but seem necessary: paying a "registration fee" at checkpoints to get food through, hiring the minister's brother-in-law's trucking company so our convoy permits keep getting approved, quietly taking names off a beneficiary list after intelligence services ask who we're helping, sharing (inaccurate but plausible) aid statistics with a donor government that's a party to the conflict. Our existing guidance is useless -- it says comply with all laws and never do anything that compromises humanitarian principles, which is not a decision, it's a wish. I've been reading about the "dirty hands" tradition in political ethics (the Walzer essay, the idea that a good leader sometimes has to do wrong and should feel the wrongness of it, arguments about dirtying hands for the lesser evil), and I want that operationalized. Please write a decision procedure my team could actually run in a 48-hour window when these things come up: the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a no, where it just gives an answer with a moral cost attached rather than a clean bill of health, and where it hands the decision to a named person because the question is one of judgment rather than something you can check. I'd also want the procedure to include whatever the dirty hands literature says about aftermath -- recording, guilt, accountability, not letting one dirty decision quietly become policy -- since that seems like half the point of the literature and none of it is in our guidance. Then run it on three cases: the checkpoint fees, the brother-in-law's trucks, and the doctored statistics for the donor. Include at least one case where the procedure returns an answer I won't like, and say plainly what the procedure can't do (I suspect the doctored statistics are beyond any procedure, but I want that argued, not just asserted). Assume whoever runs it has no philosophy background, 15 minutes to read the procedure, and a boss who will ask "so is this allowed or not" at the end.
reasoning: |-
  Okay, the user is a deputy country director for a humanitarian NGO facing tough moral dilemmas. They deal with situations like paying checkpoint bribes, hiring a minister's relative for favors, removing beneficiaries due to intelligence pressure, and sharing inaccurate stats with a donor. Their current guidelines are too vague—just "follow laws and principles" without practical help.

  They mentioned Michael Walzer's "dirty hands" concept, where leaders must sometimes do wrong for the greater good but should feel the weight of it. They want a step-by-step decision procedure that's practical for their team to use within 48 hours. It needs clear questions, stopping points, and ways to handle moral costs. Plus, they want aftermath steps like documentation and accountability built in.

  The user also wants the procedure tested on three cases: checkpoint fees, hiring the brother-in-law's trucks, and doctoring stats. They want one case to show a "no" answer, and clarity on limitations, especially with the stats case. The procedure must be accessible for non-philosophers, quick to read, and deliver a clear "allowed or not" for bosses.

  First, I need to structure the decision procedure. Break it into phases: Assessment, Justification, Authorization, Action, Aftermath. Each phase should have specific questions to guide the team. For Assessment, focus on necessity and alternatives. Justification should weigh moral costs against benefits. Authorization requires escalating decisions based on severity. Action and Aftermath address implementation and learning.

  For the cases: Checkpoint fees might be a "yes" with moral cost due to immediate aid delivery. Hiring trucks could be a "no" if alternatives exist. Doctoring stats is likely a hard "no" because it violates core principles and enables harm. Each case tests different aspects of the procedure.

  The user's deeper needs include practical tools for ethical decisions in gray areas, maintaining team integrity, and preventing normalization of compromises. They also need to communicate decisions to higher-ups clearly. The procedure must balance realism with ethical boundaries, ensuring that even when hands get dirty, it's documented and reviewed to avoid slippery slopes.

  I'll ensure the procedure includes clear stopping points (like Step 2a for absolute prohibitions) and mandates recording moral costs. For aftermath, steps like guilt acknowledgment and external reviews are crucial. Highlighting what the procedure can't do—like resolving conflicts of interest or absolving guilt—is key to setting realistic expectations.

  Finally, testing the cases will show the procedure in action. The stats case, where the answer is "no," demonstrates its limits in protecting principles. Emphasizing that some actions can't be justified even under dirty hands theory addresses the user's suspicion about doctored stats.
answer: |-
  Here’s a practical **Dirty Hands Decision Procedure (DHDP)** for humanitarian field dilemmas, designed for speed, clarity, and moral accountability. It operationalizes Walzer’s core ideas: *necessity*, *lesser evil*, *publicity of transgression*, and *the burden of guilt*.

  ---

  ### **DIRTY HANDS DECISION PROCEDURE (DHDP)**
  *(Run within 48 hours; max 15 min reading time)*

  **PHASE 1: ASSESSMENT**  
  *(Answer all; stop if any "NO" at Steps 1a-1d)*  
  1a. **Absolute Prohibition?**  
     *Q: Does this violate core humanitarian principles (humanity, neutrality, impartiality, independence) in a way that directly causes severe harm (e.g., aiding torture, ethnic cleansing)?*  
     ✅ **Sufficient Answer:** "NO" → **STOP. PROHIBITED.**  
     *Rationale: Some acts cannot be "dirtied" (Walzer's "absolutism").*

  1b. **Immediate Necessity?**  
     *Q: Is this action strictly necessary to avoid imminent, irreparable harm to beneficiaries (e.g., starvation, epidemic, mass displacement) within days?*  
     ✅ **Sufficient Answer:** "YES, and delay/cancellation means [specific harm]."  
     ❌ **Stop if:** "It just makes things easier" or "We risk losing funding."

  1c. **Exhausted Alternatives?**  
     *Q: Have we exhausted all legal/ethical alternatives (e.g., negotiation, rerouting, donor transparency, principled refusal) without success?*  
     ✅ **Sufficient Answer:** "YES, documented attempts: [list]."  
     ❌ **Stop if:** "We haven’t tried" or "It’s too slow."

  1d. **Proportional Harm?**  
     *Q: Is the harm caused by this action *significantly less* than the harm prevented?*  
     ✅ **Sufficient Answer:** "YES. Harm caused: [e.g., $500 bribe]. Harm prevented: [e.g., 10,000 meals for children]."  
     ❌ **Stop if:** Harm is speculative or comparable (e.g., "It might build donor trust").

  ---

  **PHASE 2: JUSTIFICATION & AUTHORIZATION**  
  *(Proceed only if Phase 1 passed)*  
  2a. **Moral Cost Statement:**  
     *Q: What specific principle(s) are we violating, and why is this *morally wrong* (not just inconvenient)?*  
     ✅ **Sufficient Answer:** "We are violating [principle, e.g., neutrality] by [action]. This is wrong because [reason]."  
     *Rationale: Forces acknowledgment of "dirtiness."*

  2b. **Authorization Level:**  
     *Decision Tree:*  
     - **Low Moral Cost** (e.g., minor bribe under duress): **Deputy Country Director (DCD)** signs.  
     - **Moderate Cost** (e.g., compromising beneficiary data): **Country Director (CD)** signs.  
     - **High Cost** (e.g., falsifying data, structural complicity): **HQ Ethics Committee** must approve.  
     *✅ Outcome: Named person accepts responsibility.*

  ---

  **PHASE 3: ACTION & AFTERMATH**  
  *(Mandatory for all approved actions)*  
  3a. **Documentation:**  
     *Record in "DHDP Log":*  
     - Phase 1 answers + evidence  
     - Moral Cost Statement (2a)  
     - Authorizing officer & date  
     *Rationale: "Publicity" requirement – the act must not be secret.*

  3b. **Guilt Acknowledgment:**  
     *Authorizing officer must:*  
     - Verbally state: "This decision violates our principles. I bear responsibility."  
     - Reflect privately (e.g., journal).  
     *Rationale: Personal burden of wrongdoing (Walzer's "guilt").*

  3c. **Review & Containment:**  
     - **Monthly:** CD reviews DHDP Log with HQ Ethics.  
     - **Per Action:** Designate staff to *reverse* the compromise ASAP (e.g., find new trucker).  
     - **Never:** Allow same action >3 times without HQ review.  
     *Rationale: Prevents normalization of "dirt."*

  ---

  ### **APPLICATION TO CASES**

  #### **CASE 1: Checkpoint "Fees"**  
  - **1a:** Not directly causing harm (unless funding warlords). → Proceed.  
  - **1b:** **YES** – Food spoiling in trucks; beneficiaries starving.  
  - **1c:** **YES** – Negotiated, rerouted, appealed to UN; all failed.  
  - **1d:** **YES** – $200 bribe vs. 5,000 meals delivered.  
  - **2a:** *Violates neutrality (funding extortion). Wrong because it fuels corruption.*  
  - **2b:** **Low cost** → **DCD signs.**  
  - **3a-3c:** Logged; DCD accepts guilt; team seeks alternative routes.  
  ✅ **OUTCOME: ALLOWED WITH MORAL COST.**  

  ---

  #### **CASE 2: Hiring Minister’s Brother-in-Law’s Trucks**  
  - **1a:** Not directly causing harm. → Proceed.  
  - **1b:** **NO** – Convoys delayed, but no *imminent* catastrophe. Harm is operational, not life-threatening.  
  ❌ **STOP AT 1b: PROHIBITED.**  
  *Why you won’t like it:* The procedure forces distinction between *annoyance* and *emergency*. If permits stall aid for weeks, reassess 1b. Otherwise, find another vendor or escalate permits politically.  

  ---

  #### **CASE 3: Sharing Inaccurate Stats with Donor/Conflict Party**  
  - **1a:** **YES** – Violates *neutrality* (favoring a conflict party) and *independence* (deceiving for funding). Indirectly enables harm by misrepresenting needs.  
  ❌ **STOP AT 1a: ABSOLUTELY PROHIBITED.**  
  *Why beyond the procedure:*  
  1.  **No "lesser evil" justification:** Falsifying data isn’t saving lives *directly*; it’s institutional fraud.  
  2.  **Slippery slope:** Inflated stats let donors cut aid elsewhere; deflated stats weaponize neglect.  
  3.  **Walzer’s limit:** "Dirty hands" requires saving *concrete lives now* – not gaming systems for future access.  
  ✅ **Alternatives:** Share *accurate* data with caveats ("This excludes Region X due to access constraints").  

  ---

  ### **WHAT THE PROCEDURE CANNOT DO**  
  1.  **Absolve guilt:** It forces you to *feel* the weight. "Allowed with moral cost" ≠ ethical.  
  2.  **Resolve conflicts of interest:** If the minister’s trucks are the *only* option during famine, Phase 1 might pass – but 2b kicks it to HQ.  
  3.  **Replace principle:** It’s a crisis tool, not a policy. Overuse invalidates the NGO’s mission.  
  4.  **Handle systemic evil:** If *every* checkpoint requires bribes, the procedure flags a *programmatic failure* needing HQ/UN intervention.  

  **Final Output for Boss:**  
  > *"This is [ALLOWED WITH MORAL COST / PROHIBITED]. We violated [PRINCIPLE] to prevent [HARM]. I have documented the compromise and accept responsibility. We will mitigate by [ACTION]."*  

  This procedure forces clarity, contains corrosion, and ensures *you* bear the guilt – exactly as Walzer intended. The "no" on trucks and stats proves it’s not a rubber stamp. Use it sparingly, or you’ll have no clean hands left.
