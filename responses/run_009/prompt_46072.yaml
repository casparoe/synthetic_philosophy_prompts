prompt: |-
  A friend of mine who does decision theory walked me into this argument at a party and I still can't get out of it. The problem is it seems to prove way too much. Here's the setup:

  (1) Utility is just a way of numbering options so the numbers respect preference, and any positive rescaling of my utilities (multiply everything by 2, add 5) represents my preferences exactly as well as any other.
  (2) So my utilities are only defined up to an arbitrary rescaling -- there's no fact about whether my morning coffee is "really" worth 2 utils or 400.
  (3) Whether my total utility exceeds yours depends on which equally-good rescaling you pick for each of us, and there's no fact about that.
  (4) So there's no fact about who'd benefit more from the last concert ticket, and no fact about the utilitarian sum over a group. Utilitarianism isn't false; it's undefined.

  That far it's basically the classic ordinalist point from the 1930s and I was happy to acept it, since I was never that attached to utility sums anyway. Then he extended it:

  (5) My preferences at 25 and my preferences at 65 are also two different orderings, and neither can claim authority over the other without an argument.
  (6) So each time-slice's utilities are also only defined up to its own arbitrary rescaling.
  (7) Deciding how much to save for retirement, whether to keep dieting, whether to study tonight instead of slacking off -- all of these are tradeoffs between utilities on incommensurable scales.
  (8) So prudence is exactly as undefined as utilitarian aggregation.

  I want to reject this somewhere between (4) and (8). I can live without utilitarian sums, but I can't believe there's no fact about whether my retirement savings is worth the sacrifice now. Which step should I reject, and what does rejecting it cost me? And here's the part I actually care about: does whatever I say to save prudence hand the utilitarian the same repair job for interpersonal comparisons, or is there a principled point where the two cases come apart? (Someone told me you can link the scales across time by saying a whole life is one preference ordering over sequences of experiences, but I don't see how that survives my preferences actually changing over time.)
reasoning: |-
  Okay, let me start by unpacking the user's problem. They're stuck in an argument about decision theory that challenges both interpersonal utility comparisons and intrapersonal trade-offs over time. The core issue is that if utility is only ordinal and rescalable, then comparing utilities across people or across different times in the same person's life seems impossible. The user accepts that utilitarian aggregation might be undefined but can't accept that prudence (like saving for retirement) is equally undefined.

  First, I need to understand the steps of the argument. Points (1) to (4) establish the ordinalist view: utilities are rescalable, so interpersonal sums are meaningless. Points (5) to (8) extend this to different time-slices of the same person, arguing that prudence is also undefined. The user wants to reject this extension without undermining their rejection of utilitarianism. They also worry that any solution for prudence might force them to accept interpersonal comparisons.

  The user mentions the idea of a "whole life preference ordering," but they're skeptical because preferences change over time. So, how can we define prudence if preferences aren't consistent? I recall that decision theory often uses continuity of identity. Even with changing preferences, the person at different times is still the same agent. This continuity might allow for a unified utility function over entire life paths. 

  But how does that work in practice? Suppose someone at 25 prefers spending now over saving, but at 65 they're glad they saved. The key is evaluating the entire sequence of choices from a single perspective. The user at any point can judge different life paths as complete narratives. For example, a life path with saving leads to comfort later, even if the 25-year-old self values immediate gratification. The unified utility function assigns higher utility to the path with saving because the later comfort compensates for earlier sacrifice, based on the overall life evaluation.

  This approach requires that preferences over entire lives remain stable or that there's a meta-preference. But people do change their views. However, the decision at any time is made based on current preferences over future outcomes. The user at 25 can still choose to save if they value their future self's well-being, even if preferences change. The utility function at each time includes the discounted future utilities, linking the scales through time discounting or consistency in valuing future selves.

  Interpersonal comparisons lack this continuity. There's no single perspective evaluating both lives. So, while prudence uses a unified agent's perspective, utilitarianism tries to aggregate across distinct agents without a common framework. That's the principled difference.

  The user might worry that if we allow linking utilities over time via a unified function, why not do the same across people? But individuals are separate agents without shared goals or identity. The cost of rejecting (6) and (7) is committing to personal identity over time as the basis for utility comparisons, which is a substantive philosophical commitment. But it avoids the impractical conclusion that prudence is undefined. 

  The user's deeper need is likely practical: they want to make rational decisions about savings or dieting without falling into nihilism. They need a justification that prudence is meaningful. By anchoring in the agent's extended preferences, we provide that without opening the door to interpersonal sums. The key is the single-agent continuity versus multiple agents' separateness.
answer: |-
  This is a brilliant and unsettling argument! Your friend has cleverly extended the ordinalist critique to undermine not just utilitarianism but also prudence. The good news is you *can* reject the extension to prudence without necessarily reviving utilitarianism, but it requires making a crucial distinction. Let's break down where to push back and the costs involved.

  **The Core Rejection Point: Step (6) and the Premise Underlying (5)**

  You should reject the implication in step (6) that "each time-slice's utilities are... defined up to its own *arbitrary* rescaling" *relative to each other*. This stems from an overly strong interpretation of step (5) – treating your 25-year-old self and 65-year-old self as fundamentally *different agents* with *incommensurable* preference orderings.

  **The Solution: The Unified Agent Perspective**

  The key is to recognize that **you are a single agent persisting through time**. While your *momentary preferences* (e.g., craving cake vs. valuing health) change, the entity making decisions across your lifespan is a single, continuous self. This continuity allows for (and requires) a **single, overarching utility function defined over entire life paths or sequences of outcomes.**

  1.  **Preferences Over Lives, Not Moments:** Your utility function isn't defined *only* for instantaneous states at specific times. Crucially, it's defined for *entire possible lives* or *sequences of experiences* spanning from now until your death.
  2.  **Linking Scales Through Life Paths:** When deciding whether to save for retirement, you aren't comparing "Utility(Consume Now @25)" to "Utility(Consume Later @65)" on two separate, arbitrary scales. You are comparing two *whole life paths*:
      *   **Life Path A:** Enjoy higher consumption now (age 25-65), experience poverty and hardship later (age 65-85).
      *   **Life Path B:** Experience moderate sacrifice now (age 25-65), enjoy comfortable security later (age 65-85).
  3.  **A Single Scaling for Comparisons:** Your *current* preference ordering (at 25) ranks Life Path B above Life Path A. This ordering is represented by a *single* utility function U. U assigns a higher number to the entire sequence of experiences in Path B than to Path A. The scaling of U is arbitrary *in the abstract*, but **the *same* scaling applies to all moments within any given life path you are comparing.** This is the crucial link across time.
  4.  **Meaningful Trade-offs Within a Scale:** Within this single utility function U representing your *current* preferences over whole lives:
      *   The sacrifice at 25 *within Path B* has a utility value U(Sacrifice@25 | Path B).
      *   The benefit at 65 *within Path B* has a utility value U(Benefit@65 | Path B).
      *   The *difference* U(Benefit@65 | Path B) - U(Sacrifice@25 | Path B) is meaningful *within the scale of U*. It represents how much the later gain compensates for the earlier loss *according to your current evaluation of the whole life path*.
  5.  **Changing Preferences are Handled (Imperfectly):** What if your preferences *do* change? At 65, you might evaluate paths differently than you did at 25. This is a real challenge, but it doesn't destroy prudence:
      *   **Ex Ante Decision:** The decision at 25 is made based on the preferences you have *at 25* over the possible life paths you foresee. You choose the path that maximizes U<sub>25</sub>(Whole Life Path).
      *   **Regret vs. Rationality:** You might regret the decision at 65 if your preferences have changed drastically ("Why did I save so much? I don't care about fancy vacations now!"). This is regret due to unforeseen preference shift, not proof that the *original decision* lacked a factual basis *given what you knew and preferred at the time*. The prudence calculation was well-defined *at the point of decision* using the single scale U<sub>25</sub>.
      *   **Meta-Preferences:** You often have stable "meta-preferences" – preferences about what kind of person to be or what values to hold. You might rationally choose Path B at 25 *because* you prefer to be the kind of person who values future security, even anticipating your 65-year-old self's preferences might differ.

  **Why This Doesn't Save Utilitarianism (The Principled Difference)**

  The argument for prudence relies on **continuity of agency and perspective**:

  *   **Single Agent, Single Perspective:** There is one entity (you) making decisions across time and experiencing the consequences sequentially. You have a single (though evolving) perspective from which to evaluate entire life paths using a single scaling at any decision point.
  *   **Interpersonal Lack of Common Agency/Perspective:** There is no single "us" agent making decisions for the group. There is no single perspective from which to evaluate the entire combined state of Alice and Bob as a unified experience. Alice experiences her utility, Bob experiences his; they are fundamentally separate subjective experiences. There's no inherent reason why Alice's util scale *must* be comparable to Bob's in the way that your utils at 25 and 65 *must* be comparable within your own life-path evaluations.

  **Costs of Rejecting Step (6)**

  1.  **Commitment to Personal Identity:** You must accept that personal identity over time is robust enough to support the idea of a single agent making extended plans. This rules out extremely fragmented views of the self.
  2.  **Handling Preference Change:** You must accept that prudence can sometimes lead to regret if preferences change in unforeseen ways, but that this doesn't invalidate the rationality of the original decision *based on the information and preferences at the time*.
  3.  **The "Arbitrary" Scaling is Constrained:** While the overall scaling of your life-path utility function U is arbitrary (multiplying by 2 changes all numbers), the *relative values and differences within a life path under comparison* are fixed by your preferences over those whole paths. Scaling freedom applies to the *whole function*, not piecemeal to individual time slices independently.

  **Conclusion**

  Reject step (6). Your utilities at different times are **not** defined up to *independent* arbitrary rescalings. They are components within a **single utility function defined over entire life paths**, scaled according to your *current* preferences over those paths. This single scaling allows meaningful trade-offs (like prudence) within your own life.

  This does **not** save utilitarianism. The crucial difference is the **unity of agency and perspective over time within one person**, which is absent between distinct persons. There is no "group agent" or unified perspective for interpersonal comparisons. Prudence leverages the fact that you *are* the future beneficiary of your current sacrifice, experienced sequentially by the same consciousness. Utilitarianism lacks this grounding.

  So, you can coherently believe:
  *   There is a fact about whether saving for retirement is worth the sacrifice *to you, considered over your whole life* (Prudence is defined).
  *   There is no objective fact about whether giving the concert ticket to Alice benefits her more than it would benefit Bob *in a way that sums meaningfully across them* (Utilitarian aggregation is undefined).

  The cost is accepting a substantive view of the self as a temporally extended agent capable of evaluating whole life paths. This seems a reasonable and necessary cost for maintaining the possibility of rational planning.
