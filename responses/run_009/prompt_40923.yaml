prompt: |-
  I write novels, and I have found that my judgments about morally exemplary characters — my own and other novelists' — form a pattern I cannot quite state. When a character anonymously donates a kidney to a stranger, I find her admirable, full stop. When a character has given away nearly everything she owns and lives in voluntary poverty, I admire her, but I also find I cannot make her the center of a novel; she comes out flat, and I quietly demote her to the margins of someone else's story. When a character is relentless in the service of others but retains one blazing nonmoral passion — for jazz, say, which he guards jealously and will not sacrifice even for causes he weeps over — I find him not just vivid but more admirable, somehow, than the tireless gentle soul with no inner life at all. Yet when a father abandons his family for humanitarian work abroad, I judge him not admirable at all, even though his conduct is impersonally better than staying home would have been. And when a character is perfectly honest, perfectly kind, never laughs at anyone's expense, I admire her while feeling I would cross the street to avoid befriending her. My tentative thought is that there is a principle here having to do with the place of personal projects in a good life, but I cannot make it cover all my verdicts. Please tell me whether some principle — or small set of candidates, stated precisely — captures this pattern, motivate each clause by the case that requires it, tell me what the principle predicts about a case I keep going back and forth on (a character who is nearly morally perfect but keeps one hour of solitary birdwatching a day that no argument about the world's suffering could move him to give up), and be honest about which of my verdicts your principle forces me to abandon.
reasoning: |-
  Hmm, the user is a novelist who has noticed a pattern in how they judge morally exemplary characters in literature. They find that characters who are completely self-sacrificing seem flat and uninteresting to them, while characters who maintain some personal passion or "blazing nonmoral passion" feel more vivid and even more admirable. They're struggling to articulate the principle behind these judgments.

  The user provides several specific scenarios: They admire a character who anonymously donates a kidney, but find a character who gives away everything and lives in poverty too flat to center a novel around. They find a character who serves others but maintains a passion like jazz more admirable than a tireless altruist with no inner life. Yet they don't admire a father who abandons his family for humanitarian work. And while they admire a perfectly honest and kind character, they'd avoid befriending such a person.

  They suspect this has to do with "the place of personal projects in a good life" but feel this doesn't fully cover all their judgments. They ask for a principle that explains this pattern, that can handle the birdwatching case (someone morally perfect who keeps one hour daily for solitary birdwatching that they won't sacrifice), and that acknowledges which of their verdicts might need revision.

  This is an interesting philosophical puzzle about moral psychology and narrative art. The user seems to be wrestling with the tension between moral perfection and human vitality in characterization. Their examples suggest they value moral action but reject moral sainthood when it erases individuality.

  I think the key lies in distinguishing between different types of moral exemplars. Susan Wolf's concept of the "moral saint" versus the "lover of the good" seems relevant here. There's also Bernard Williams' critique of "moral luck" and his concept of "ground projects" that give life meaning. Michael Stocker's "moral schizophrenia" describes the alienation that comes from purely principle-driven action.

  For the kidney donation case, that's a discrete supererogatory act that doesn't erase the character's identity. For the jazz enthusiast, their passion provides narrative texture and reveals their individuality. The poverty case fails because complete self-abnegation leaves no self to develop in narrative. The abandoning father violates special obligations despite doing impersonal good. The "too perfect" character creates the aversion because they lack relatable flaws or quirks.

  The birdwatching case should be admirable under this framework - it's a modest personal commitment that maintains individuality without violating core duties. The principle seems to be that moral exemplarity in narrative requires maintaining identity-constituting projects that aren't morally driven, provided they don't violate fundamental obligations.

  I'll formulate this as a principle with three clauses addressing moral ambition, identity-constituting projects, and special obligations. I'll show how it explains each case, apply it to the birdwatching scenario, and note that it requires revising the verdict on the abandoning father slightly - we can admire his cause while condemning the violation of special duties.
answer: |-
  Your pattern reveals a profound tension in how we value moral action within the context of a *full human life*, particularly in narrative. The principle isn't solely about "personal projects," but about **the necessity of a distinct, non-moral identity as the foundation for perceiving moral action as admirable, relatable, and narratively central.** Here's the principle, structured to capture your intuitions:

  **The Principle of Identity-Constrained Moral Exemplarity (ICME):**

  > **A morally exemplary character is perceived as admirable, vivid, and narratively central only if their moral actions:**
  > **1.  Do not systematically erase their distinct, non-moral identity.** *(Addresses: Poverty Case, "Perfect" Character Aversion)*
  > **2.  Emerge from, or coexist compatibly with, core identity-constituting commitments (which may be non-moral).** *(Addresses: Jazz Lover Case, Kidney Donor Case)*
  > **3.  Do not violate fundamental special obligations constitutive of their core identity roles.** *(Addresses: Abandoning Father Case)*

  **Motivation by Cases & Clause Application:**

  1.  **The Poverty Case (Gives away everything, lives in voluntary poverty):**
      *   **Verdict:** Admirable but flat, demoted to margins.
      *   **ICME Clause:** Violates Clause 1. The systematic, totalizing nature of the sacrifice erases any distinct identity beyond "the sacrificer." There's no "self" left for the moral action to express *or* for the reader to latch onto as a relatable center. The character becomes an abstract symbol of sacrifice, not a person. Narrative requires friction, desire, and a sense of individual existence – all erased here.

  2.  **The Jazz Lover Case (Serves others relentlessly, guards passion for jazz):**
      *   **Verdict:** Vivid, more admirable than the tireless soul.
      *   **ICME Clauses:**
          *   **Clause 2:** The jazz passion is a core identity-constituting commitment. Protecting it signals a distinct self *from which* moral action springs. The moral actions coexist with (and are arguably made possible or more authentic by) this non-moral core. The internal conflict (weeping over causes but guarding jazz) generates vividness and reveals depth.
          *   **Clause 1:** The distinct identity (jazz lover) is preserved, preventing erasure. This makes the moral actions *this person's* actions, not abstract goodness.

  3.  **The Abandoning Father Case (Leaves family for humanitarian work):**
      *   **Verdict:** Not admirable.
      *   **ICME Clause:** Violates Clause 3. The role of "father" creates fundamental special obligations constitutive of his identity. Sacrificing *those specific obligations* to pursue impersonal good (even if greater in abstract utility) undermines the foundation of trust and commitment that *constitutes* the familial identity role. His moral action comes at the cost of violating the duties inherent to a core identity-defining commitment. This feels like a betrayal of the self he *was*, making the action repellent, not admirable, despite its objective 'goodness'.

  4.  **The "Perfect" Character Case (Perfectly honest, kind, never laughs cruelly):**
      *   **Verdict:** Admirable but avoidable as a friend.
      *   **ICME Clause:** Violates Clause 1 (and arguably Clause 2). The *systematic* perfection erases individuality. It feels inhuman because it lacks the quirks, preferences, vulnerabilities, and internal conflicts that constitute a distinct identity. There's no "there" there beyond the moral code. This generates aversion because friendship thrives on shared specificities and vulnerabilities, not just abstract goodness. The character feels like a moral algorithm, not a person. (Clause 2 isn't obviously violated, but the *absence* of any strong non-moral commitment contributes to the erasure).

  5.  **The Kidney Donor Case (Anonymous donation to stranger):**
      *   **Verdict:** Admirable, full stop.
      *   **ICME Clauses:**
          *   **Clause 2:** This is a discrete, supererogatory act. It doesn't define the character's entire identity or require erasing their self. It can be seen as emerging from a moral impulse compatible with a wider identity (we don't know what else they are, but the act doesn't preclude it).
          *   **Clause 1:** It's a single act, not a systematic erasure of identity. The anonymity protects the donor's *other* identity aspects from being subsumed by this act.
          *   **Clause 3:** No fundamental special obligations are violated (assuming no dependents neglected).

  **The Birdwatching Case Prediction:**

  *   **Character:** Nearly morally perfect, but keeps one hour of solitary birdwatching daily, impervious to arguments about global suffering.
  *   **ICME Prediction:** **Admirable and Vivid (Potentially Central).** This character likely succeeds where the poverty case and "perfect" character fail.
      *   **Clause 1:** The birdwatching hour explicitly prevents systematic identity erasure. It's a concrete, non-moral anchor for their distinct self.
      *   **Clause 2:** Birdwatching is framed as a core identity-constituting commitment ("no argument... could move him"). It coexists with (and may even sustain) their near-perfect morality. Protecting it signals a self beyond the moral code. The *refusal* to sacrifice it creates necessary friction and depth, making them vivid. It answers the question "Who is this person *besides* being good?"
      *   **Clause 3:** Assuming the birdwatching doesn't violate a fundamental special obligation (e.g., neglecting a sick child for that hour), it's compatible. The act of protecting this small selfhood commitment, while performing significant moral good elsewhere, mirrors the Jazz Lover dynamic but is arguably *more* admirable because the moral baseline is higher. The tension between near-perfection and this one guarded passion is rich narrative territory.

  **Forced Revision of Your Verdicts:**

  The ICME principle forces you to **modify your verdict on the Abandoning Father** slightly, or rather, refine its explanation:

  *   **Your Verdict:** "Not admirable at all."
  *   **ICME Nuance:** The principle allows you to find the *impersonal humanitarian work itself* potentially admirable in the abstract (Clause 2: a strong moral commitment). However, Clause 3 explains why the *total action* (abandoning family *for* this work) is fundamentally *not admirable* – it violates the core obligations constitutive of the father role, undermining the very identity foundation that makes moral action meaningful and trustworthy in a person. The principle explains *why* the violation of special obligations overrides the abstract goodness of the work, leading to the strong negative verdict. It forces you to acknowledge that the *source* of the lack of admirability is the identity-role violation, not necessarily a flaw in the humanitarian impulse itself (though the *choice* to prioritize it over family is the flaw).

  **Conclusion:**

  Your pattern reveals a deep narrative and philosophical truth: **Absolute moral self-abnegation erases the self whose goodness we are meant to admire.** True moral exemplarity in narrative requires a preserved core identity – marked by non-moral passions, commitments, or specific role obligations – from which moral action flows or with which it compatibly coexists. Sacrifices are admirable when they express the self (Kidney Donor) or defend its core (Jazz Lover, Birdwatcher), but become repellent when they annihilate the self (Poverty) or betray its fundamental constitutive roles (Abandoning Father). The "perfect" character fails because their goodness *is* their entire self, leaving no distinct identity for the reader to engage with. The ICME principle captures this tension between the demands of the moral life and the necessity of a concrete, individual existence.
