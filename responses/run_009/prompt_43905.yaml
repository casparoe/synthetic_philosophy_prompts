prompt: |-
  At a workshop on giving feedback in our research group, the facilitator kept repeating the line that guilt is about what you did, shame is about who you are, and used it to argue that our postdoc mentoring should aim to make people feel guilt ("that result was misreported, fix it") rather than shame ("you are the sort of person who misreports results"), since guilt points at repair and shame points at the exit door. A week later, in an online argument about whether institutions can be designed to shift a community's moral emotions, I saw the same line used in almost the opposite direction: someone invoked the old anthropological contrast between shame cultures and guilt cultures to claim that guilt is simply shame with the audience moved inside your head, so that a culture cannot actually choose to swap one for the other — the most it can do is hide the witness. Both speakers treated the line as though it obviously settled the matter, and I realized I couldn't say what it actually claims.

  I'd like the different precise theses the one-liner could be expressing, laid out as a numbered menu I could take back to either of them. For each reading, please say whether it is a trivial definitional stipulation, a substantive but plausible empirical claim, or something false or unsupported, and then say which of the two uses it actually supports: the facilitator's use (shrink shame, target guilt at specific acts) or the online critic's use (guilt is internalized shame, so the choice between them is illusory). At least these axes seem worth separating, though tell me if there are others: whether the line is about the object of evaluation (an act versus the whole self), about motivation (apology and repair versus concealment and withdrawal), about the audience (whether shame requires a real or imagined witness in a way guilt does not), about fittingness (whether condemning a whole self for one act is ever a proportionate response), and about origins (whether guilt is produced by internalizing external judgment).

  Close by addressing the question the two of them were really fighting about: can a culture, or an institution inside one, deliberately shift its members from shame to guilt? In particular, if guilt really is shame whose audience has been installed in the person, then the facilitator's project of eliminating shame while cultivating guilt looks like one project described in two moods — the same internalized witness doing the condemning, just told to speak more quietly and about smaller things. Say whether any consistent selection of your readings makes the two projects distinct, and if so, which reading does that work. Please lead with your bottom line in the first sentence, then give the reasoning; no preamble and no restating of my question.
reasoning: |-
  Hmm, this user presents a fascinating philosophical and psychological puzzle about the distinction between guilt and shame. They've observed the same one-liner ("guilt is about what you did, shame is about who you are") being used to support opposite arguments about moral education and institutional design. 

  The user wants me to dissect this aphorism along multiple dimensions: the object of evaluation, motivational outcomes, audience requirements, proportionality, and psychological origins. They're clearly frustrated by how this oversimplified distinction gets weaponized in debates without precise definitions. I notice they're academically sophisticated - likely in social sciences or philosophy given their reference to anthropological "shame cultures" and concern with institutional moral engineering.

  What makes this tricky is that both speakers have partial truth. The facilitator isn't wrong that targeting specific behaviors promotes corrective action, while the online critic correctly notes that internalized shame operates similarly to guilt. But neither acknowledges the spectrum nature of these emotions. 

  For the taxonomy, I'll need to separate:
  - Definitional claims (which would support the facilitator)
  - Empirical claims about behavioral outcomes (also facilitator-friendly)
  - Audience dependence claims (supports critic)
  - Claims about psychological origins (critic's strongest point)

  The core institutional question hinges on whether we see guilt as qualitatively different from shame or just privatized shame. If the latter, then the facilitator's approach merely domesticates shame rather than eliminating it. But modern psychology suggests guilt can develop through empathy without internalized judgment, which creates space for genuine institutional shift. 

  Key studies to reference: Tangney's work showing guilt correlates with reparative action while shame predicts avoidance, versus Scheff's argument that guilt is shame moralized. The anthropological record shows societies can emphasize different moral emotions - Japan's shame-based honor versus Protestant guilt cultures - but all humans experience both.

  Ultimately the facilitator's project is viable if institutions focus on specific behaviors while affirming personal worth - but it requires careful design to avoid accidentally reinforcing shame. The critic is right that you can't simply wish away shame, but wrong to claim cultures can't nudge dominant moral emotions.
answer: |-
  **Bottom line:** The one-liner expresses distinct, separable claims; while some readings support the facilitator, others support the critic, and the facilitator's project of shifting focus from shame to guilt is distinct and feasible under specific, plausible readings of the distinction, particularly regarding object, motivation, and origins.

  **Numbered Menu of Precise Theses:**

  1.  **Object of Evaluation:** Guilt evaluates a *specific act* ("what you did"), while shame evaluates the *global self* ("who you are").
      *   *Type:* Substantive but plausible empirical claim (supported by psychology, e.g., Tangney).
      *   *Supports:* **Facilitator.** Distinguishing the act from the self promotes repair over withdrawal.
      *   *Relevance:* Core to the one-liner's common usage.

  2.  **Motivation:** Guilt motivates *apology/reparation* ("fix it"), while shame motivates *concealment/withdrawal/escape* ("exit door").
      *   *Type:* Substantive and well-supported empirical claim (robust psychological evidence).
      *   *Supports:* **Facilitator.** Directly justifies targeting guilt to promote corrective action.
      *   *Relevance:* Key to the facilitator's practical argument.

  3.  **Audience Requirement:** Shame inherently requires a *real or imagined audience/witness* whose judgment matters, whereas guilt can be experienced *privately* based on internal standards, even without an audience.
      *   *Type:* Substantive and plausible claim (draws on anthropology, social psychology).
      *   *Supports:* **Critic.** Suggests guilt is shame internalized, differing only in the audience's location (external vs. internal).
      *   *Relevance:* Central to the critic's argument about internalization.

  4.  **Fittingness/Proportionality:** Condemning the *whole self* (shame) for a *single act* is inherently disproportionate and unfitting, whereas condemning the *act* (guilt) is proportionate.
      *   *Type:* Normative claim (moral philosophy), not purely empirical. Plausible but debatable.
      *   *Supports:* **Facilitator.** Provides a moral reason to avoid shame-based feedback.
      *   *Relevance:* Implicit in the one-liner's negative framing of shame.

  5.  **Origins:** Guilt arises primarily from the *internalization* of external moral standards/judgments (internalized witness), whereas shame arises more directly from *external* exposure or threat of exposure to judgment.
      *   *Type:* Substantive but contested claim (psychology/anthropology debate).
      *   *Supports:* **Critic.** Argues guilt *is* internalized shame, making a cultural "swap" illusory; cultures merely hide the witness internally.
      *   *Relevance:* Core to the critic's argument against cultural engineering.

  **Addressing the Core Question: Can a culture/institution deliberately shift from shame to guilt?**

  *   **Yes, the facilitator's project is distinct and feasible** under specific readings of the one-liner. A culture/institution *can* deliberately cultivate guilt over shame by:
      *   **Focusing on Acts, Not Selves (Thesis 1):** Structuring feedback, accountability, and norms to explicitly condemn *specific behaviors* ("That report had errors") while actively affirming the individual's value or capacity ("You are capable of accurate work").
      *   **Promoting Reparative Norms (Thesis 2):** Designing systems that expect, facilitate, and reward acknowledgment of mistakes and corrective action ("Fix it"), while discouraging or minimizing responses focused on hiding or fleeing ("Exit door").
      *   **Rejecting Global Condemnation (Thesis 4):** Explicitly teaching and modeling that mistakes do not define a person's entire worth.

  *   **The critic's argument (Theses 3 & 5)** that guilt is *merely* internalized shame overlooks key distinctions:
      *   **Qualitative Difference in Focus:** Internalizing condemnation of *acts* (guilt) is psychologically and functionally different from internalizing condemnation of the *self* (shame), even if both involve an "internal witness" (Thesis 1 vs. Thesis 5). Shifting the *target* of evaluation (act vs. self) is a crucial change.
      *   **Motivational Difference:** The evidence strongly supports that the focus on the act (guilt) leads to reparative motivations, while the focus on the self (shame) leads to destructive ones (Thesis 2), regardless of whether the audience is internal or external. Cultivating guilt *is* cultivating a different motivational structure.
      *   **Independence of Origins:** While internalization plays a role in developing conscience, guilt can also stem from empathy (harm caused to others) and reasoning about violated principles, not *only* from internalized *shame-based* judgment. Institutions can foster principles and empathy (Thesis 5 contested).

  **Conclusion:** The facilitator's project relies primarily on Theses 1, 2, and 4 (Object, Motivation, Fittingness), which are plausible and distinct from the critic's focus on Theses 3 and 5 (Audience, Origins). While internalization occurs, institutions *can* deliberately foster a culture emphasizing the evaluation and repair of specific acts (guilt) over the condemnation of the global self (shame), making the shift both conceptually distinct and practically achievable. The critic overstates the case by conflating the internalized audience with an identical emotional/motivational outcome.
