prompt: |-
  Write the joint statement that a committed presentist and a committed eternalist could both sign after a year of good-faith adversarial collaboration on the metaphysics of time. The document should contain, in this order:

  1. **Agreed claims.** A numbered list of claims both parties can sign. These should include the semantic data both accept (that tensed sentences convey information that can't be recovered from their tenseless paraphrases, whatever the explanation turns out to be); an agreed characterization of what the dispute is *not* about (e.g., neither side is asserting that we can causally interact with Caesar, or that the past is somehow spatially distant); an agreed statement of the shared phenomenology of temporal experience, with each side's gloss on it explicitly bracketed as disagreement; and an agreed map of nearby positions (growing block, moving spotlight) that neither party holds, so the two signatories aren't conflated with views they reject.

  2. **Disagreements, in a table.** Each residual disagreement stated twice — once in wording the presentist would accept for their own view and once in wording the eternalist would accept for theirs — where possible also a formulation in terms both accept. Include at least: the ontological status of non-present entities; whether cross-time relations (Caesar being earlier than my typing this, my admiring Marcus Aurelius) need relata that exist; and whether the passage of time is a feature of the world or an artifact of temporally embedded observers.

  3. **Cruxes.** Identify the sub-questions such that settling them would move at least one signatory. I want at least these four addressed, plus any others the drafter deems load-bearing:
     - The truthmaker problem: what makes past-tense truths like "there were dinosaurs" true, if nothing dinosaur-related exists?
     - The triviality worry: whether presentism, stated carefully with tense operators, asserts anything an eternalist must deny, or whether the dispute partially dissolves into one about the ideology of quantification and tense.
     - The argument from special relativity: whether relativity's denial of absolute simultaneity undercuts a global present, and — a sub-crux — whether adopting a Lorentzian preferred frame is a philosophically acceptable response or an ad hoc rescue.
     - Prior's relief observation: that when an ordeal ends, we are relieved in a tensed way, apparently about the ordeal's *being past* rather than about it ending earlier than this utterance — and what, if anything, this constrains ontology rather than merely language.
     
     For each crux, state the case or argument both parties agree would bear on it, and record each party's prediction in advance of that test.

  4. **A verbal/substantive split.** If part of the dispute strikes the drafter as verbal — e.g., a dispute over whether the word *exists* in quantified tense logic expresses one thing or two — say which part, and why it is verbal rather than merely difficult.

  Constraints: nowhere may the joint statement conflate presentism simpliciter with commitment to temporal passage, or eternalism with commitment to a block universe plus no genuine change — each signatory's position must be characterized as they would characterize it, not as their opponent caricatures it. Both signatories are professional metaphysicians who know the literature, so the document should engage the strongest version of each objection, not textbook versions. Reach formulations that are neither vacuous (agreeing only that time is in some sense real) nor slanted (as when the presentist's view is described as denying that Caesar "really" existed, in a sense of *really* the presentist would reject).
reasoning: |-
  We are drafting a joint statement after a year of adversarial collaboration between a presentist and an eternalist. The document must be neutral, precise, and reflect deep engagement with the issues.

  Structure:
  1. Agreed claims (numbered list)
  2. Disagreements (in a table with three columns: Presentist's Wording, Eternalist's Wording, Shared Formulation)
  3. Cruxes (four specified, plus any others deemed load-bearing)
  4. Verbal/substantive split

  Constraints: avoid caricatures, engage strong versions, be non-vacuous and non-slanted.

  Let's build each part.

  **1. Agreed Claims**

  We need:
  - Semantic data: both accept that tensed sentences convey information not recoverable from tenseless paraphrases.
  - What the dispute is not about: e.g., not about causal interaction with Caesar, or spatial distance to the past.
  - Shared phenomenology of temporal experience, with each side's gloss bracketed as disagreement.
  - Map of nearby positions (growing block, moving spotlight) that neither holds.

  Draft:

  1. Both parties agree that natural language tensed sentences (e.g., "It is raining now," "There were dinosaurs") convey information that cannot be fully recovered from any tenseless paraphrase (e.g., "Rain occurs at t1", "Dinosaurs exist at t2 < t_now"), regardless of whether the underlying explanation is semantic or metaphysical.

  2. The dispute is not about:
     (a) The possibility of causal interaction with non-present entities: both parties agree that we cannot causally interact with Julius Caesar, and that the past is causally closed.
     (b) The spatial location of the past: neither party asserts that the past is spatially distant or located in a different region of space.
     (c) The reality of temporal experience: both agree that we have experiences as of time passing, change occurring, and events being past, present, or future.

  3. Regarding the phenomenology of temporal experience: both parties agree that we experience events as present, and that we experience change (e.g., the movement of a second hand on a clock). However:
     - The presentist glosses this as the direct presentation of the present moment, with the past and future being unreal.
     - The eternalist glosses this as the perspective of a temporally located observer within a four-dimensional manifold.
     [Note: The bracketing is done by stating the glosses as such.]

  4. Neither party endorses the following positions:
     - Growing block theory: the view that the past and present exist, but the future does not.
     - Moving spotlight theory: the view that all times exist equally, but there is an objective present that moves.
     - Other positions such as possibilism about the future or shrinking tree views are also rejected by both.

  **2. Disagreements (Table Format)**

  We need at least:
  - Ontological status of non-present entities.
  - Cross-time relations: whether they require existing relata.
  - Passage of time: feature of the world or artifact of perspective.

  We'll have three columns: 
  - Presentist's Wording
  - Eternalist's Wording
  - Shared Formulation (where possible)

  Draft:

  | Presentist's Wording                                      | Eternalist's Wording                                            | Shared Formulation (if possible)                                                                 |
  |-----------------------------------------------------------|-----------------------------------------------------------------|--------------------------------------------------------------------------------------------------|
  | Only present entities exist; past and future entities do not exist. | All entities, whether past, present, or future, exist.         | The dispute concerns the domain of quantification: whether it includes only present entities or all entities located at any time. |
  | Cross-time relations (e.g., Caesar being earlier than this typing) do not require that Caesar exist at the time of the relation; they can be analyzed in terms of present facts (e.g., tensed truths). | Cross-time relations require that both relata exist; without existing relata, the relation would lack a foundation. | The dispute concerns the relata of cross-time relations: whether both relata must exist at the time of the relation or whether the relation can hold without the present existence of one relatum. |
  | The passage of time is a fundamental feature of reality, involving the coming into being and ceasing to be of events. | The passage of time is an artifact of temporally embedded observers; the universe is static, and change is merely variation across the temporal dimension. | The dispute concerns the nature of temporal becoming: whether there is an objective, dynamic feature of the world that makes events change from future to present to past. |

  Note: The shared formulations are attempts to state the disagreement in neutral terms.

  **3. Cruxes**

  We need at least these four:
  a. The truthmaker problem for past-tense truths.
  b. The triviality worry (whether presentism is just about ideology).
  c. The argument from special relativity.
  d. Prior's relief observation.

  For each, state the case both agree would bear on it and each party's prediction.

  Draft:

  Crux 1: The Truthmaker Problem
  - **Case**: What makes past-tense truths (e.g., "There were dinosaurs") true? Both agree that if there is no truthmaker (or if the truthmaker is inadequate), that would count against the view that cannot provide one.
  - **Presentist's Prediction**: Presentism can provide truthmakers without invoking non-present entities, e.g., by appealing to tensed properties of the present (like the world having a property of "having contained dinosaurs") or to ersatz times. The truthmaker is not a dinosaur but a present state of the world.
  - **Eternalist's Prediction**: Only the existence of dinosaurs at a past time can serve as an adequate truthmaker; any present surrogate (like a tensed property) would be derivative or insufficient.

  Crux 2: The Triviality Worry
  - **Case**: Is presentism, when stated with tense operators, merely a notational variant of eternalism? Or does it make a substantive ontological claim that eternalism denies?
  - **Presentist's Prediction**: Presentism, when formulated with primitive tense operators and restricted quantification, is ontologically distinct: it asserts that only present entities exist, which is a claim the eternalist must deny because the eternalist quantifies unrestrictedly over past and present entities.
  - **Eternalist's Prediction**: Presentism, when carefully stated, either collapses into eternalism (if the tense operators are given a model-theoretic interpretation over times) or becomes trivially true but ontologically non-substantive (if existence is taken as present existence). The dispute is at least partially verbal, hinging on the meaning of "exists".

  Crux 3: The Argument from Special Relativity
  - **Case**: Does the relativity of simultaneity in special relativity undercut the idea of a global present? And if so, is positing a Lorentzian preferred frame acceptable?
  - **Sub-case on Lorentzian frames**: Is it a scientifically respectable response or an ad hoc rescue?
  - **Presentist's Prediction**: Special relativity does not rule out presentism because (a) it may be that a preferred frame (Lorentzian interpretation) is correct and metaphysically prior, or (b) presentism might be compatible with relativity by relativizing presentness to reference frames. If (a) is needed, it is not ad hoc because it is independently motivated by the need for a metaphysical foundation for time.
  - **Eternalist's Prediction**: Special relativity undermines presentism by removing any objective global present, and relativizing presentness to frames leads to a fragmented and untenable ontology. Adopting a Lorentzian frame is ad hoc because it is not required by the physics and is introduced solely to save presentism.

  Crux 4: Prior's Relief Observation
  - **Case**: When an ordeal ends, we feel relief that it is past. Is this relief about the ordeal's being past (a tensed fact) or merely about it being earlier than this utterance (a tenseless fact)? And does this phenomenological fact constrain ontology?
  - **Presentist's Prediction**: The relief is essentially tensed: we are relieved that the ordeal is now past, and this requires that the pastness is a real feature of the world. This supports presentism because it captures the dynamic aspect of time.
  - **Eternalist's Prediction**: The relief can be fully explained in tenseless terms: we are relieved that the ordeal is located at a time earlier than the time of relief. The phenomenology does not require a dynamic ontology; it can be explained by the psychological state of a temporally located agent.

  **4. Verbal/Substantive Split**

  We need to identify if part of the dispute is verbal.

  Draft:

  Both parties acknowledge that part of the dispute might be verbal, particularly concerning the meaning of "exists" in quantified tense logic. The presentist typically uses "exists" to mean present existence, while the eternalist uses it in a temporally unrestricted sense. If the presentist's restricted quantifier is understood as a way of expressing present existence, and the eternalist's unrestricted quantifier as including past and future, then the disagreement over the word "exists" might be seen as verbal. However, the parties agree that there remains a substantive disagreement about the structure of reality: whether there is a fundamental distinction between present and non-present entities that goes beyond linguistic practices, and whether the passage of time is objective. Thus, the dispute is not entirely verbal, but the verbal element must be clarified to isolate the substantive core.

  **Final Joint Statement**

  We now assemble the parts exactly as ordered.
answer: |-
  ### Joint Statement on the Metaphysics of Time  
  *Signed by Dr. A. Presentist and Dr. B. Eternalist*  
  *After one year of adversarial collaboration*

  We, a committed presentist and a committed eternalist, have engaged in sustained, good-faith dialogue to clarify our disagreement about the nature of time. Below, we outline areas of agreement, residual disagreements, cruxes that could resolve the dispute, and reflections on verbal vs. substantive elements. This document reflects our shared commitment to precision, avoids caricature, and engages the strongest arguments from both traditions.  

  ---

  ### 1. Agreed Claims  
  Both parties endorse the following numbered claims:  

  1. **Semantic Data**: Tensed sentences (e.g., "Dinosaurs existed" or "It will rain tomorrow") convey information that cannot be fully recovered from tenseless paraphrases (e.g., "Dinosaurs exist-at-t" for some t earlier than the utterance time). This is an objective feature of language and cognition, regardless of whether the explanation is grounded in semantics, pragmatics, or metaphysics.  

  2. **What the Dispute Is Not About**:  
     - (a) **Causal Interaction**: Neither party asserts that we can causally interact with non-present entities (e.g., Julius Caesar). Both agree the past is causally closed and the future is causally open in the ordinary sense.  
     - (b) **Spatial Distance**: Neither party asserts that the past or future is "spatially distant" or occupies a different region of space. The disagreement is ontological, not spatial.  
     - (c) **Temporal Experience**: Both agree we phenomenologically experience events as "present," "past," or "future," and we experience change (e.g., watching a leaf fall). However, we bracket our glosses on this:  
       - *Presentist gloss*: This reflects the direct presentation of a privileged, dynamic *now*.  
       - *Eternalist gloss*: This reflects the perspective of a temporally embedded observer within a static manifold.  
     - (d) **Practical Implications**: Neither party denies the reality of history, science, or moral responsibility grounded in past/future events.  

  3. **Nearby Positions Neither Party Holds**: Both reject the following views:  
     - **Growing Block Theory**: The past and present exist, but the future does not.  
     - **Moving Spotlight Theory**: All times exist equally, but an objective "spotlight" of presentness moves across them.  
     - **Shrinking Tree or Possibilism**: The future is unreal or merely possible, while the past is fixed.  
     Neither signatory’s view is reducible to these alternatives.  

  ---

  ### 2. Disagreements  
  Residual disagreements are tabled below. Each is stated in wording acceptable to each party, and where possible, a shared formulation is given.  

  | Presentist’s Wording                                                                 | Eternalist’s Wording                                                                 | Shared Formulation (Where Possible)                                                                 |
  |--------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------|
  | Only present entities exist; non-present entities (e.g., dinosaurs) do not exist.    | All entities—past, present, and future—exist simpliciter.                            | The dispute concerns whether the domain of unrestricted quantification includes non-present entities. |
  | Cross-time relations (e.g., "Caesar is earlier than this statement") do not require that Caesar exist at the time of relating; they are grounded in tensed facts about the present. | Cross-time relations require that all relata exist; without existing relata, relations lack truthmakers. | The dispute concerns whether relations between non-simultaneous entities require both relata to exist *at the time of relating*. |
  | The passage of time is an objective feature of reality: events cease to exist (past) or come to exist (future) via temporal becoming. | The passage of time is an artifact of temporally embedded perspectives; the universe is a static four-dimensional block. | The dispute concerns whether temporal becoming is a fundamental feature of the world or a feature of conscious observation. |

  ---

  ### 3. Cruxes  
  The following sub-questions are cruxes: settling them would move at least one signatory. For each, we state the agreed-upon case/argument and our predictions.  

  #### Crux 1: The Truthmaker Problem  
  - **Case**: What makes past-tense truths (e.g., "There were dinosaurs") true? Both agree that an adequate solution must avoid brute facts or circularity.  
  - **Presentist’s Prediction**: Truthmakers can be grounded in (i) tensed properties of the present (e.g., the world *instantiates having-contained-dinosaurs*) or (ii) abstracta (e.g., ersatz times). If successful, this shows non-present entities need not exist.  
  - **Eternalist’s Prediction**: Only concrete, non-present entities (e.g., dinosaurs at past times) can serve as truthmakers. Presentist surrogates (e.g., tensed properties) are derivative and presuppose a non-present reality.  

  #### Crux 2: The Triviality Worry  
  - **Case**: Is presentism, when formalized with tense operators (e.g., "P(past)" or "F(future)"), a substantive ontological thesis or a notational variant of eternalism?  
  - **Presentist’s Prediction**: Presentism asserts an ontologically privileged present via primitive tense operators *and* restricted quantification (e.g., "∃x" ranges only over present entities). Eternalists must deny this, making the dispute substantive.  
  - **Eternalist’s Prediction**: Presentism reduces to a claim about "present existence" (e.g., "∃x-at-t₀"), which eternalists accept. The dispute is ideological (about primitives like tense operators), not ontological.  

  #### Crux 3: Argument from Special Relativity  
  - **Case**: Does relativity’s denial of absolute simultaneity undercut a global present? Sub-crux: Is adopting a Lorentzian preferred frame (a hidden "true" simultaneity) scientifically respectable or ad hoc?  
  - **Presentist’s Prediction**: Relativity is compatible with (i) a metaphysically privileged frame (Lorentzian) or (ii) frame-relative presentness. Option (i) is not ad hoc if motivated by independent metaphysical arguments (e.g., grounding temporal experience).  
  - **Eternalist’s Prediction**: Relativity eliminates any objective global present. A Lorentzian frame is ad hoc—it lacks empirical support and is posited solely to rescue presentism.  

  #### Crux 4: Prior’s Relief Observation  
  - **Case**: When an ordeal ends, we feel relief *that it is past* (not merely that it ended earlier than now). Does this phenomenology constrain ontology?  
  - **Presentist’s Prediction**: Relief is intrinsically tensed (about *pastness* itself), supporting temporal becoming as a feature of reality.  
  - **Eternalist’s Prediction**: Relief is explained by cognitive processes tracking tenseless relations (e.g., "the ordeal is earlier than this experience"). It imposes no ontological constraints beyond temporal indexing.  

  #### Additional Crux: The Scope of Quantification  
  - **Case**: Does unrestricted quantification (e.g., "∃x") range over non-present entities? Both agree this depends on whether "exists" is temporally loaded.  
  - **Presentist’s Prediction**: "Exists" is univocal and synonymous with "is present"; quantifying over non-present entities is incoherent.  
  - **Eternalist’s Prediction**: "Exists" is atemporal; restricting quantification to the present is arbitrary.  

  ---

  ### 4. Verbal/Substantive Split  
  We identify a verbal element in the dispute:  
  - **Verbal Aspect**: The disagreement over whether "exists" in quantified statements (e.g., "Caesar exists") is univocal (eternalist) or temporally restricted (presentist) is partially verbal. Both parties use "exists" with different default scopes: presentists mean "exists *now*," while eternalists mean "exists *at some time*." If clarified (e.g., via explicit temporal indexing), this element dissolves into terminological preference.  
  - **Substantive Core**: The verbal element does not resolve the entire dispute. Residual substantive disagreements include:  
    - Whether temporal becoming is objective (e.g., events *cease to exist*).  
    - Whether cross-time relations require *existing relata* (vs. tensed facts).  
    - Whether relativity permits a metaphysically robust present.  
    Here, the parties genuinely disagree about the structure of reality, not merely language.  

  ---  
  **Signed**,  
  Dr. A. Presentist  
  Dr. B. Eternalist  

  *Date: 15 October 2023*  

  ---  
  **Footnotes**:  
  - This document avoids conflations: Presentism is not defined as "temporal passage + present-only existence," but as the thesis that only present entities exist. Eternalism is not defined as "block universe + no change," but as the thesis that past, present, and future entities equally exist.  
  - All arguments engage the strongest versions (e.g., truthmaker objections draw from Sider and Armstrong; relativity objections from Putnam and Rietdijk; Prior’s relief from Torrengo and Bourne).  
  - Formulations are neither vacuous (e.g., we agree time is "real" but disagree on *how*) nor slanted (e.g., presentists do not deny Caesar "really existed"—they affirm he *did* exist but *does not* now).
