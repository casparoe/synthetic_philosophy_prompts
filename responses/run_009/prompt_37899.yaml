  This implies the ranking should differ per register. But since the foundation likely wants coherence across all three, I'll blend them in the ordering. 

  Top priority should be Q1 because collective agency is the bedrock. If nations aren't agents, the whole project wobbles. Plus, it's tractable for philosophers with historical case familiarity. 

  Q6 comes next—it's urgent (historians implicitly assume evidence standards) and a postdoc could tackle it with training in both fields. 

