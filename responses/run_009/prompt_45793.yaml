answer: |-
  ### Translation: Wittgenstein's Hinges into Narrative Craft  
  *(Key: **✓** = clean translation | **!** = strained translation | **✗** = residue/distortion)*  

  1. **"Doubting presupposes a background of things held fast"**  
     → *In narrative:* Doubting a character's motive or memory requires a stable storyworld (e.g., gravity exists, time flows linearly, the narrator’s voice has authority).  
     **✓ Real work:** The storyworld *is* the background. A detective novel doubts "whodunit," not whether the city exists. Distorting this halts the story.  

  2. **"Some propositions function as hinges (non-empirical pivots), not empirical claims"**  
     → *In narrative:* Hinges are the story’s "givens": its physics, social rules, or narrative voice. Example: In *Pride and Prejudice*, class structures are hinges; Elizabeth’s misjudgment of Darcy is the doubt.  
     **✓ Real work:** These givens are never "checked" in the text—they’re the canvas. Question them, and the genre shifts (e.g., magic realism).  

  3. **"Moore’s 'Here is a hand' fails as proof—it’s the wrong kind of claim"**  
     → *In narrative:* A character shouting "I exist!" or "This world is real!" feels absurd (e.g., Neo in *The Matrix* pre-red-pill). The story *assumes* existence; proving it breaks immersion.  
     **✓ Real work:** Such dialogue is either bad writing or genre-bending (metafiction).  

  4. **"The riverbed: slow-moving hinges vs. fast-changing empirical claims"**  
     → *In narrative:* The riverbed is the storyworld’s fixed rules (e.g., Sherlock Holmes’ London); the water is the plot. Rules shift only between stories (e.g., reboots) or in sequels after cataclysms.  
     **! Partly decorative:** The metaphor fits, but storyworlds change abruptly (authorial fiat), unlike organic cultural shifts.  

  5. **"Hinges aren’t beliefs; they’re exempt from justification"**  
     → *In narrative:* Storyworld rules aren’t "believed" by characters—they’re the air they breathe. No character justifies gravity; it’s exempt from in-world debate.  
     **✓ Real work:** Justifying hinges *in* the story is expositional failure (e.g., "As you know, water is wet").  

  6. **"Hinges change slowly, not mid-doubt"**  
     → *In narrative:* A storyworld’s rules can’t shift during a scene (e.g., guns firing bullets can’t become water guns unless signaled). Mid-narrative changes break trust.  
     **✗ Distortion:** Authors *can* shatter hinges mid-story (e.g., *Life of Pi*’s reveal). Fiction allows "floods," but it’s a genre risk.  

  ---

  ### Residue Report: What Survives, Distorts, or Vanishes  

  **I. What Survives Translation**  
  - **Functional architecture:** Both systems require unchallenged pivots for doubt/plot to function. Hinges = storyworld axioms.  
  - **Epistemic exemption:** Just as hinges aren’t "known" (but frame knowing), story rules aren’t "plot" (but enable it).  
  - **Breakdown conditions:** Doubting hinges collapses philosophy into nonsense; doubting storyworlds collapses narrative into incoherence or new genres (e.g., surrealism).  

  **II. What Distorts to Fit**  
  - **Voluntarism vs. Necessity:**  
    Storyworld hinges are *chosen* (you invent gravity or magic); life’s hinges feel *inescapable* (you don’t "choose" to trust your hands). Translating hinges as "authorial decisions" smuggles in anti-realism.  
    - *Defense:* This distortion isn’t a pun—it’s a category error. Hinge epistemology describes lived certainty as pre-rational; your craft describes constructed certainty. Conflating them implies, "Our certainties are fictions," but that’s a *philosophical claim*, not a neutral translation. Wittgenstein’s hinges are *not* optional—they’re conditions for sanity. Your storyworlds are artifacts.  

  - **Frame-Doubt in Fiction vs. Life:**  
    You *can* write frame-doubt (unreliable narrators, dream twists). Hinge epistemology says radical frame-doubt paralyzes action (e.g., you can’t "live" while doubting your hands).  
    - *Disanalogy resolved:* Fiction simulates the *impossible*. A character doubting their world’s reality (e.g., *Ubik*’s decaying reality) is *part of the storyworld*. In life, you can’t "narrate" yourself doubting all hinges without ceasing to function—Wittgenstein’s point. The disanalogy cuts *against* hinge epistemology’s scope: it fails to capture how fiction *externalizes* doubt as art.  

  **III. What Vanishes (No Expression in Narrative Vocabulary)**  
  - **Biological embeddedness:** Life’s hinges are felt in the body (e.g., sensorimotor certainty). Storyworlds lack this—no character "feels" their world’s hinges as visceral truth.  
  - **Communal hinges:** Cultural certainties (e.g., "The Earth is old") shift glacially through collective practice. Storyworlds change at author-speed.  
  - **Hinges as non-propositional:** Wittgenstein hints hinges are *actions* ("I act with certainty"). Narrative craft reduces everything to diegetic "rules."  

  ---

  ### Verdict: The Residue Exposes a Defect in Hinge Epistemology  
  **Position:** The untranslatable residue reveals a *genuine discovery* about **both**, but it primarily exposes a **defect in hinge epistemology** as commonly framed.  

  **Why:**  
  1. **Hinge Epistemology’s Blind Spot:** It struggles with *externalized* doubt. Fiction proves we *can* model frame-doubt without collapse—via nested narrative frames (e.g., *Pale Fire*). If hinges were truly inexpressible, metafiction couldn’t work. Yet it does, because fiction abstracts doubt into a "game." Hinge theorists mistake the *unlivability* of radical doubt for its *unthinkability*. Your craft shows it’s thinkable—as artifice.  
  2. **Narrative Craft’s Revelation:** The translation proves hinges are *structural necessities for any coherent system* (story or life). But when philosophy calls hinges "ineffable" or "non-rational," it mystifies them. Your vocabulary demystifies: hinges are practical scaffolds. If life’s certainties feel deeper, it’s due to biology—not magic.  
  3. **The Core Defect:** Hinge epistemology neglects that *what hinges are made of* differs across domains (biological vs. artistic). Calling both "hinges" obscures this. Your residue—vanished biological/communal elements—shows hinge theory needs a richer taxonomy. Fiction isn’t a "flawed" mirror to life; it’s a pressure test exposing where philosophy overreaches.  

  **Final Defense:**  
  Hinge epistemology rightly identifies that certainty is groundless but indispensable. Yet insisting this ground "cannot be doubted" ignores how fiction *stages* such doubt to reveal its catastrophic cost. The translation’s failure at the seams (voluntarism, frame-doubt) isn’t your vocabulary’s limitation—it’s philosophy’s failure to account for the *aesthetic dimension of certainty*. Your craft doesn’t just "map" hinges; it shows they can be *performed, broken, and remade*. Wittgenstein would approve: hinges aren’t sacred—they’re tools. The riverbed *can* flood in art, and that’s no defect. It’s a revelation.
