answer: |-
  Here is a specification for a theory of moral dilemmas designed for practical guidance in hard cases, incorporating your requirements. Non-negotiable criteria (NN) are essential for trust; others reflect common intuitions but may be contestable ("prejudices").

  ### I. Cases the Theory Must Handle Correctly
  1.  **Binding Duties Dilemma (NN):**
      *   **Case:** Agent faces conflict where *both* duties remain binding/unfulfilled *after* choice (e.g., choosing which child to save in a burning building when only one can be saved). Neither duty is cancelled, overridden, or merely outweighed.
      *   **Rationale:** Captures the core phenomenon distinguishing genuine moral dilemmas from resolvable conflicts (à la Ross). A theory denying this case dismisses the lived experience of tragic choice.
  2.  **Self-Inflicted vs. Externally Imposed Dilemma:**
      *   **Case A:** Dilemma arising solely from prior *innocent* choices (e.g., innocently promising two people incompatible things at the same time).
      *   **Case B:** Dilemma thrust upon agent through no fault of their own (e.g., battlefield triage officer).
      *   **Requirement:** The theory must explain whether, how, and *why* it treats these differently (e.g., regarding responsibility, residue). It *may* treat them differently, but must justify its stance.
      *   **Rationale:** Real agents need to understand their own culpability and the source of obligations. Distinguishing faultless tragedy from self-created binds is crucial for self-understanding and accountability.
  3.  **Symmetrical Dilemma (Equal Choice-Worthiness):**
      *   **Case:** Agent faces two options (A and B) that the theory assesses as *exactly equally* choice-worthy. No tie-breaking criterion exists.
      *   **Requirement:** The theory must not collapse this into an arbitrary "pick either" scenario devoid of moral significance. It must explain the *moral structure* of the choice and its consequences.
      *   **Rationale:** Tests if the theory truly acknowledges a dilemma or reduces it to indifference. Arbitrary choice feels inadequate for true moral tragedy; the "wrongness" must persist.

  ### II. Distinctions the Theory Must Respect (NN)
  1.  **Moral Residue vs. Mere Regret:**
      *   **Distinction:** Moral Residue entails *continuing obligations* to the wronged party (e.g., apology, compensation, special consideration) stemming from the unfulfilled duty. Mere Regret is only a negative psychological state without further obligation.
      *   **Rationale:** Essential for accountability and relational repair in practical contexts (clinical ethics, post-conflict). Ignoring residue absolves agents of responsibility for the unchosen harm.
  2.  **Genuine Dilemma vs. Epistemic Difficulty:**
      *   **Distinction:** A Genuine Dilemma exists when there is *no fact of the matter* about which option is better/right (objectively conflicting obligations). Epistemic Difficulty occurs when one option *is* objectively better, but the agent lacks knowledge to discern it.
      *   **Rationale:** Guidance differs radically. In a genuine dilemma, regret/residue is unavoidable regardless of choice. In epistemic cases, better information dissolves the "dilemma"; the focus is on decision-making under uncertainty.
  3.  **Structure of the Option-Set:**
      *   **Distinction:** The theory must explicitly define what constitutes a genuine dilemma regarding the permissibility/impermissibility of the options. Are both options: (a) Forbidden? (b) Permissible? (c) Something else (e.g., tragic but required, violating a duty but justified)?
      *   **Requirement:** The chosen structure must:
          *   Avoid Doom: Explain why the agent isn't doomed to *wrongdoing* whatever they choose (if options are permissible) or explain the nature of the wrongdoing if they are forbidden.
          *   Avoid Dissolution: Explain why the choice isn't merely a free pick between equally *acceptable* options if permissible, preserving the sense of moral tragedy and residue.
      *   **Rationale:** Clarifies the fundamental nature of the conflict and the agent's moral position post-choice, directly impacting feelings of guilt, justification, and residue.

  ### III. Formal Constraints & The Core Tension (NN)
  1.  **The Incompatible Triad (The Core Tension):**
      *   **(A) Dilemmas Exist:** Genuine moral dilemmas (as defined in I.1 & II.3) occur.
      *   **(B) Ought Implies Can (OIC):** If an agent ought to do X, then it must be possible for the agent to do X. (`O(X)` → `◇X`)
      *   **(C) Aggregation (AGG):** If an agent ought to do A and ought to do B, then the agent ought to do A and B. (`O(A) ∧ O(B)` → `O(A ∧ B)`)
      *   **The Problem:** If (A) is true, an agent faces `O(A)` and `O(B)` where `A` and `B` are jointly impossible (`¬◇(A ∧ B)`). By (C) `AGG`, we get `O(A ∧ B)`. By (B) `OIC`, `O(A ∧ B)` implies `◇(A ∧ B)`. But `◇(A ∧ B)` contradicts `¬◇(A ∧ B)`. **Contradiction.**
      *   **Requirement:** The theory **must explicitly acknowledge this triad is incompatible.** It must reject or modify at least one principle, *owning the costs*:
          *   **Reject (A) (Deny Dilemmas):** Cost: Fails the Binding Duties case (I.1) and distinctions II.1 & II.3. Ignores the phenomenology of tragic choice.
          *   **Reject (B) (Deny OIC):** Cost: Obligations can demand the impossible, potentially undermining responsibility and the link between morality and agency. Requires explaining "ought" without possibility.
          *   **Reject (C) (Deny AGG):** Cost: "Ought" leaks. `O(A) ∧ O(B) ∧ ◇(A ∧ B)` no longer implies `O(A ∧ B)`. This weakens the normative force in *non-dilemmatic* cases where jointly possible duties intuitively form a single obligation (e.g., `O(KeepPromise)` and `O(HelpStranger)` when both are easily possible). Requires a logic where "ought" doesn't agglomerate even under possibility.
      *   **Rationale:** This is the central logical challenge. Any credible theory must navigate this tension transparently; failure to do so reveals logical incoherence. The "leakage" cost of rejecting AGG is particularly significant for practical guidance.

  **The Single Requirement Excluding Most Theories: The Binding Duties Dilemma (I.1).** This requirement directly challenges any theory (like Ross's) that resolves conflicts by overriding or cancelling one duty, forcing a move away from standard deontic logic or core principles (OIC/AGG). It demands recognition of inescapable moral failure.

  ### IV. Scoring Standard Positions (Briefly)

  1.  **Rossianism (Conflicts are only Prima Facie, one duty "wins"):**
      *   **Fails:** I.1 (Binding Duties - duties aren't binding post-choice), II.3 (Structure - denies both forbidden/permissible options exist simultaneously as binding), Core Tension (Rejects A - denies genuine dilemmas). Residue (II.1) becomes hard to justify.
      *   **May Handle:** I.2, I.3 (by denying symmetry is possible in binding duties), II.2 (epistemic cases).
      *   **Verdict:** Unacceptable for genuine dilemmas; denies their existence.

  2.  **Denies "Ought Implies Can" (OIC):**
      *   **Fails:** Core Tension (Rejects B). High cost: Obligations to do the impossible strain concepts of agency and blame; can feel alienating or unfair ("I *ought* to have done the impossible, so I failed").
      *   **May Handle:** I.1, I.2, I.3, II.1 (Residue follows naturally from unmet impossible duty), II.2, II.3 (Often treats both options as forbidden/required but impossible).
      *   **Verdict:** Logically possible for dilemmas, but the cost of rejecting OIC is high for practical accountability and psychological plausibility.

  3.  **Rejects Aggregation (AGG), Keeps Dilemmas & OIC:**
      *   **Fails:** Core Tension (Rejects C). Cost: "Ought" leakage in non-dilemma cases (`O(A) ∧ O(B) ∧ ◇(A ∧ B)` does not imply `O(A ∧ B)`). Requires complex deontic logic.
      *   **May Handle:** I.1, I.2, I.3, II.1 (Residue from unmet binding duty), II.2, II.3 (Can structure options as both forbidden/required but choosing one violates a binding duty).
      *   **Verdict:** Most promising for genuine dilemmas, but must address leakage cost and provide a clear logic/normative account of non-agglomerating "oughts".

  **The deliverable is this set of criteria, designed to rigorously test a theory's adequacy for guiding real, tragic choices where agents bear lasting responsibility.** The Binding Duties case and the formal tension around Aggregation/OIC are the most significant hurdles.
