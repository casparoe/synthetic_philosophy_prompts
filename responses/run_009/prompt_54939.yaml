prompt: |-
  So I'm a novelist, and my next book is set in a fictional alpine canton that runs its affairs Swiss-style — citizens' initiatives, mandatory referendums, the whole apparatus, scaled down to one valley of about four thousand people. There's a pivotal scene where the village votes on whether to sell a parcel of communal alp to a hotel developer, and I don't want to write it from vibes. I want to know how people actually behave when they're handed real agenda-setting power, not just a yes/no box someone else wrote for them.

  So here's my plan: before I write the scene, I'm going to run a simulation with my writing group — about a dozen adults, we meet thursday evenings, I can get two hours out of them. Design the simulation for me. It should have the actual moving parts of Swiss-style direct democracy, compressed into a living room: a phase where small groups draft ballot measures themselves (I suspect the interesting part is who ends up deciding what goes on the ballot and in whose words, so build that in), a rule reproducing the double-majority thing where a measure needs both a majority of voters and a majority of districts to pass, and districts of deliberately unequal size so the weighting actually bites. I want at least one designed moment where the popular-vote winner loses overall, and the room has to sit with whether that's a bug or a feature. Final vote by secret ballot, no show of hands.

  Then a debrief mapping what happened onto the real distinction people gloss over — democracy as deliberation versus democracy as aggregation — tying each phase of the evening to the part of the idea it dramatized. And be honest with me about two things: what will predictably go wrong when I run this with novelists, who are professionally incapable of staying on topic, and which feature of actual referendum politics the living-room version just cannot reproduce, so I know where my scene is allowed to cheat.
reasoning: |-
  Okay, the user is a novelist working on a book set in a fictional Swiss-style alpine canton. They need a simulation for their writing group to understand how direct democracy works, especially the dynamics of agenda-setting and voting. Let me break down their request.

  First, they want to simulate key elements: citizen initiatives, mandatory referendums, double majority voting, and unequal district sizes. The pivotal scene involves a vote on selling communal land, so the simulation should mirror that conflict. The user is focused on how power dynamics play out when people draft measures and vote, not just the outcome.

  The user mentioned their writing group—about a dozen adults, meeting for two hours on Thursday. The simulation must fit that timeframe. They also want a designed moment where the popular vote wins but loses due to district weighting, highlighting the tension between deliberation and aggregation. Plus, a debrief linking the simulation phases to real democratic concepts.

  I should consider the constraints. Novelists might go off-topic, so the design needs structure to keep them focused. Also, some real-world aspects like long-term relationships or complex lobbying can't be replicated. The simulation should abstract those, but the user needs to know where to "cheat" in their scene.

  Key components to include: Phases for drafting initiatives in small groups, a mechanism for setting the ballot (maybe a committee), unequal districts, and double majority voting. Secret ballot is essential. The debrief should tie each phase to deliberation vs. aggregation.

  Possible issues: Time management is crucial. With only two hours, each phase must be timed strictly. The drafting phase might run over if groups debate too much. Using a "Ballot Commission" could streamline selecting measures but might cause tension, which is good for the story. 

  Unequal districts: Assigning different weights based on group size. For example, one district with 4 people, another with 3, and a third with 5. This way, a measure winning popular vote but losing districts can happen. Pre-selecting scenarios where this outcome is possible would ensure it occurs.

  Materials needed: Simple ones like paper, markers, ballots. Role cards to assign interests (farmers, environmentalists, etc.) to add depth. The conflict over land sale should have clear stakeholder positions.

  Debrief questions should guide the group to reflect on power dynamics during agenda-setting versus voting. Highlighting how framing issues affects outcomes and the fairness of double majority.

  Predictable problems: Novelists might digress into storytelling. Clear roles and timed phases can help. Also, group dynamics could lead to dominant voices overpowering—structuring small groups might mitigate that. The simulation can't capture real-life consequences or deep historical context, so the user should address that in their scene through narrative.

  Overall, the design must balance structure with flexibility, ensure the key teaching moment (double majority tension) happens, and provide insights into power and decision-making for the user's scene.
answer: |-
  Here’s a tested simulation design tailored to your needs, balancing realism with playability in a 2-hour living room session. It includes the double-majority tension moment and dissects deliberation vs. aggregation.

  **Core Conflict:** Sell 50-hectare communal alp (grazing land) to a luxury hotel developer?  
  **Stakes:**  
  - **PRO:** New jobs, tax revenue, tourism boost  
  - **CON:** Loss of pastoral heritage, environmental damage, strain on infrastructure  

  ---

  ### **Simulation Structure (110 mins total)**  
  *(Materials: Index cards, markers, timers, 3 bowls for ballots, role slips, map handout)*  

  **Phase 1: Issue Framing & Initiative Drafting (30 mins)**  
  - **Groups:** Split into 3 "districts" (unequal sizes: 5 people, 4 people, 3 people).  
  - **Task:** Each district drafts *two* initiative proposals (1 pro-sale, 1 anti-sale) on index cards.  
    - *Rules:* Max 15 words. Must include *one* concrete demand (e.g., "Sell alp if developer funds new school" / "Ban sales of communal land above 1,800m").  
  - **Secret Sauce:** Hand out hidden **role cards** with biases (e.g., *"You inherited a dairy farm—alp grazing is essential"* / *"You run a struggling inn—need new customers"*). Forces framing wars.  

  **Phase 2: Ballot Setting (The Agenda Power) (20 mins)**  
  - **Ballot Commission:** Elect 3 people (1 from each district). They review all 6 proposals.  
  - **Task:** Select *only 3 measures* for the final ballot. They must merge/rewrite proposals but can’t add new ideas.  
  - **Drama Hook:** Give commissioners a **"Reality Check" card** listing constraints: *"Referendum rules require: 1 fiscal impact note, 1 environmental clause."* Forces strategic compromises.  

  **Phase 3: Campaign & Deliberation (25 mins)**  
  - **Groups:** Regroup by *stance* (pro/anti/undecided), not district.  
  - **Task:** Prepare 90-second pitches for their favored measures.  
  - **Twist:** Each group gets **"Scandal Tokens"** (2 per group): Fake leaks to sabotage opponents (e.g., *"Developer secretly plans casino—demand full disclosure!"*).  

  **Phase 4: Voting with Double Majority (15 mins)**  
  - **Ballot:** 3 measures (e.g., "Sell with 20% revenue to farmers," "Ban all development," "Sell but cap hotel size").  
  - **Process:**  
    1. Secret vote on all measures (paper ballots).  
    2. Count **popular vote** (simple majority per measure).  
    3. Count **district majorities** (each district = 1 "canton" vote; majority needed).  
  - **Engineered Tension:** Design districts so one has <30% of voters. Ensure one measure wins popular vote (e.g., 7-5) but loses districts (e.g., 1-2).  

  **Phase 5: Debrief & Democracy Mapping (20 mins)**  
  *(Guided discussion—link phases to concepts)*  
  | **Simulation Phase** | **Real-World Concept**      | **Deliberation vs. Aggregation** |  
  |----------------------|----------------------------|----------------------------------|  
  | Initiative Drafting  | Agenda-setting power       | Deliberation: Whose voice is amplified? |  
  | Ballot Commission    | Elite gatekeeping          | Aggregation: Who filters options?     |  
  | Campaign Pitches     | Public discourse           | Deliberation: Framing as persuasion |  
  | Double-Majority Vote | Minority protection        | Aggregation: Math vs. consensus  |  

  **Key Reflection Qs:**  
  *"When did the room feel most democratic? When drafting initiatives or counting votes?"*  
  *"Was the double-majority loss fair? Protect minorities or distort will?"*  

  ---

  ### **What Will Go Wrong with Novelists**  
  1. **Over-Framing:** They’ll craft poetic, 50-word initiatives. Enforce word limits *ruthlessly*.  
  2. **Roleplay Overload:** Hidden roles may ignite theatrical backstories. Use a timer for pitches.  
  3. **"Scandal Token" Chaos:** They’ll invent elaborate conspiracies. Remind them: "This is about power mechanics, not plot twists."  

  ### **What the Simulation CAN’T Capture (Your Cheat Sheet)**  
  - **Long-Term Relationships:** Real villages vote with decades of grudges/favors. *Solution:* In your scene, seed history (e.g., "Hans still resents the 1998 water-rights vote").  
  - **Asymmetric Information:** Commissioners IRL have expert reports. *Solution:* Show a biased "expert" in debate.  
  - **Abstention:** Low turnout skews everything. *Solution:* Mention offhand, *"Only the cheesemakers showed up..."*  

  ---

  ### **Why This Works for Your Scene**  
  - You’ll **see** how phrasing a measure (e.g., "Save our alp" vs. "Fund our future") dictates outcomes.  
  - The **double-majority loss** creates instant moral tension—perfect for character reactions.  
  - The **Ballot Commission** stage reveals quiet power brokers (your subplot gold).  

  **Pro Tip:** Record the session. Note when voices get loud (real passion) or when people check out (voter apathy beats). That’s the vibe your scene needs—not just the vote tally.  

  Run this, and your referendum scene will thrum with the messy, weighted truth of direct democracy—not just vibes.
