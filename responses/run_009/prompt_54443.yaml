prompt: |-
  I direct a small community-dispute resolution program attached to our county government. Our caseload is dominated by fights in which the parties disagree about values rather than facts or interests: a neighborhood association that opposes a supervised injection site because it sees enabling drug use as wrong in itself, against a public-health coalition that treats preventable overdose deaths as the only consideration that could matter; a historic-preservation board and a transit agency locked over demolishing a row of 1920s storefronts for a bus lane; a school committee split over how a health curriculum should present contraception. These disputes arrive with lawyers, deadlines, and a county board that expects us to produce a signed agreement, and over the years we have mostly settled them by splitting the difference — shave the building's height, save two of the four facades, teach both framings in one unit. Lately I have come to suspect that splitting the difference is the one thing we never actually reason about; it is just the number we reach when everyone is too tired to keep arguing.

  Years ago I took a seminar on the ethics of compromise, and the framing that stayed with me is that a good compromise is supposed to resemble gains from trade: each side gives up something it values less in exchange for something it values more, so that both do better under the deal than under the winner-take-all alternative. That framing carries a lot of luggage I have never learned to unpack in practice. It implies compromise is not consensus — the parties never have to converge on reasons, only on terms — and that a settlement reached by exhaustion is not the same thing as one reached by trade. It suggests that some compromises genuinely expand what is available to both sides (log-rolls, in-kind side payments, sequencing one project after another) while others merely launder one side's defeat so it can be announced as mutual victory. It raises the problem of values held as absolute or lexicographic, which cannot be traded at any price — and the harder practical problem that a party's claim of non-negotiability may be sincere conviction or a bargaining posture, and these look identical from across the table. And it leaves me with the notion, half-remembered, that even a legitimate compromise can leave a moral remainder — a real cost to one side's deepest commitments that should be acknowledged afterward rather than re-described as everyone having won.

  Please write a decision procedure my staff can actually run. Concretely: two mediators, a ninety-minute intake meeting with each party separately, then a single day-long joint session, and a county board that signs off on any agreement. The procedure should specify the questions to ask in order, what counts as a sufficient answer to each, the points at which it terminates with a finding that no mutually improving trade exists and the parties should go to litigation or a council vote instead, and the points at which it must hand the question back to a human because it is a question of values the procedure cannot settle. It needs concrete tests for distinguishing genuine absolutes from strategic absolutism, and for detecting pie-expanding packages as opposed to capitulation dressed as a deal. It should also say something about repeated dealings — most of these parties will be back at our table within two years, and I do not know how much that should change what we count as a fair outcome the first time. Then run the procedure on three cases: the injection site, the storefronts versus the bus lane, and a recent dispute over a modest bequest, where the family wanted a memorial statue and the town wanted scholarships, both sides refused every hybrid we proposed, and I privately thought they were being childish about it. On that last one I would like to know whether the procedure vindicates their refusal or exposes it as posturing — I suspect the answer will not be the one I want, and I would rather know that now. Finally, be candid about where the procedure will misfire: which of its steps are judgment calls wearing a checklist's clothes, and what it is likely to get wrong that an experienced mediator would catch.
reasoning: |-
  Hmm, this is a really thoughtful query from someone deeply experienced in community dispute resolution. They're grappling with the ethics of compromise versus practical realities of mediation. 

  The core tension here is between theoretical ideals of value-creating compromises and the messy reality of exhausted parties splitting differences. They've clearly studied ethical frameworks but found them hard to apply - especially with value conflicts where parties treat positions as absolute. 

  Three key pain points stand out:
  First, distinguishing genuine moral absolutes from bargaining tactics (the "non-negotiable" problem)
  Second, detecting whether a deal actually expands value or just repackages surrender
  Third, handling the moral residue that remains even in legitimate compromises

  The procedural request is very specific - they want a concrete workflow for their 90min+full day mediation structure. Notable constraints:
  - County board expects signed agreements
  - Repeat interactions are common
  - Must include exit ramps to litigation when no true compromise exists

  I should design this like a clinical decision tree - clear yes/no gates with defined evidence thresholds. The injection site, historic buildings, and scholarship cases make perfect test scenarios since they represent classic value conflicts. 

  For the scholarship case they're personally invested in, I'll need to apply the tests rigorously even if it reveals their "childish" judgment was unfair. That takes intellectual honesty.

  Biggest challenges will be:
  - Operationalizing abstract concepts like "moral residue"
  - Creating observable indicators for subjective states (e.g., strategic vs sincere absolutism)
  - Building in flexibility while maintaining structure

  The misfire section is crucial - they want transparency about where human judgment still trumps procedure. I'll flag particularly vulnerable points like interpreting emotional cues and detecting bad faith.
answer: |-
  Here’s a **decision procedure for value-based disputes** designed for your mediation team, based on ethical compromise principles. It includes concrete tests, exit gates, and application to your cases, with candid limitations noted.

  ---

  ### **Mediation Decision Procedure: Value-Based Disputes**
  **Phase 1: Separate Intake Meetings (90 mins/party)**  
  *Goal: Map values, absolutes, and tradeable interests.*  

  1. **Question 1:** *"What outcome would fully satisfy your core concerns? Why does this matter fundamentally?"*  
     - **Sufficient Answer:** Identifies **core values** (e.g., "preventing death" vs. "moral integrity").  
     - **Test for Absolutes:** Ask: *"Is there any condition under which you could accept [opposing outcome]? What would make it tolerable?"*  
       - **Absolute Detected:** If party insists *"Never, under any circumstances"* + **no alternative solutions** (e.g., "No injection site anywhere").  
       - **Strategic Alert:** If refusal lacks value-based reasoning (e.g., "We won’t budge" without moral justification).  

  2. **Question 2:** *"What are you willing to *give up* to achieve your goal? What from the other side would make that worthwhile?"*  
     - **Sufficient Answer:** Identifies **tradeable concessions** (e.g., "We’d accept a smaller bus lane if facades are preserved").  
     - **Exit Gate 1:** If both parties declare **mutually exclusive absolutes** (e.g., "Site must exist" vs. "Site must not exist"), **terminate** → recommend litigation/council vote.  

  3. **Question 3:** *"What shared problems does this conflict create? (e.g., public safety costs, delayed projects)"*  
     - **Sufficient Answer:** Identifies **common costs** → foundation for pie-expanding trades.  

  **Phase 2: Joint Session (Day-Long)**  
  *Goal: Construct gains-from-trade packages.*  

  4. **Step 1: Frame Common Costs**  
     - Mediators present shared problems (from Q3) to align parties against mutual losses.  

  5. **Step 2: Explore Pie-Expanding Trades**  
     - **Questions:**  
       - *"What could Party A offer that costs them little but benefits Party B greatly?"*  
       - *"Can we sequence outcomes? (e.g., trial period, phased construction)"*  
       - *"What third-party resources could unlock new options? (e.g., grants, land swaps)"*  
     - **Pie-Expanding Signal:** Parties brainstorm **additive solutions** (e.g., "Move bus lane underground; add historic plaques").  
     - **Capitulation Alert:** If one party concedes core values without compensation (e.g., "Fine, build the site" with no safeguards).  

  6. **Step 3: Test Proposed Trades**  
     - Apply **"Better Than BATNA" Test:** *"Is this better than your best alternative to agreement? How?"*  
       - **Exit Gate 2:** If either party’s BATNA (litigation/vote) clearly dominates the deal → **terminate**.  
     - **Moral Remainder Check:** *"What part of this deal still feels like a loss? How can we acknowledge it?"*  
       - *Example:* "We accept the site but need recognition that addiction is tragic."  

  7. **Step 4: Final Offer Stress Test**  
     - **Question:** *"If this deal fails, what will you regret not proposing?"*  
       - Reveals hidden flexibility or confirms deadlock.  

  **Phase 3: Agreement & Review**  
  - **County Board Submission:** Package deal + **"Moral Remainder Statement"** (e.g., "The family acknowledges scholarships help more kids, but grieves the lost memorial").  
  - **Repeat-Interaction Rule:** Prioritize **procedural fairness** over one-time gains. Parties who feel heard return less defensively.  

  ---

  ### **Case Applications**  
  **1. Supervised Injection Site**  
  - **Q1:** Health coalition (absolute: "Prevent deaths"); Neighborhood ("Moral harm of enabling").  
  - **Pie-Expanding Trade:** Site co-located with rehab services + neighborhood oversight committee.  
  - **Exit?** If neighborhood refuses *any* site → **terminate** (genuine absolute).  

  **2. Storefronts vs. Bus Lane**  
  - **Q2:** Preservation board trades 2 facades for transit agency funding facade restoration.  
  - **Pie-Expansion:** Bus lane built behind (not through) facades; add historic transit exhibit.  
  - **Moral Remainder:** Agency acknowledges "loss of efficiency"; board mourns "changed streetscape."  

  **3. Bequest: Statue vs. Scholarships**  
  - **Q1:** Family ("Sacred memory"); Town ("Education as legacy").  
  - **Q2 Test:** Family rejects "statue + 1 scholarship" → **Absolute?**  
  - **Strategic Alert:** No moral reasoning (e.g., "We just want our way").  
  - **Pie-Expanding Fail:** Hybrids offered (naming rights, memorial garden) rejected without counter.  
  - **Verdict:** **Posturing** exposed. Procedure exits to council vote.  
    *(Your instinct was right: neither side valued the other’s concessions enough to trade.)*  

  ---

  ### **Where the Procedure Misfires: Candid Limitations**  
  1. **"Absolute or Strategic?" Test:** Relies on **tone/consistency** cues (e.g., shaky voice vs. poker face). Human mediators detect micro-expressions machines miss.  
  2. **Pie-Expansion Detection:** Requires **creative facilitation**. Checklist helps, but "aha moments" need mediator intuition.  
  3. **Moral Remainder:** Risks **theater** if acknowledgments feel scripted. Mediators must sense sincerity.  
  4. **Repeat Interactions:** Procedure can’t quantify "trust debt." Humans must track relational history.  
  5. **Exhaustion Trades:** The "Better Than BATNA" gate fails if parties underestimate litigation costs. Mediators must reality-check BATNAs.  

  **Bottom Line:** This procedure forces value mapping and tests for trades, replacing fatigue-based splits with principled exits or creative deals. But it **augments, not replaces**, mediator judgment—especially in spotting bad faith or crafting elegance. Use it as scaffolding for human wisdom, not a cage.  

  *Final note: Your seminar’s "gains from trade" framing is gold. This procedure makes it operable—but only if your team believes moral remainders deserve honoring more than easy signatures.*
