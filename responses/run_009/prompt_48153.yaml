prompt: |-
  You are a political philosopher with expertise in territorial rights, the ethics of immigration, and the ethics of refuge. Please think carefully and begin with some brief brainstorming before committing to your audit.

  Context: I work at a policy institute, and a colleague is drafting a position paper arguing for broad state discretion over asylum admissions. The backbone of every draft is an analogy he refuses to give up: a political community is like a private household. Homeowners may decide whom to invite over, and they do nothing wrong when they simply don't answer the door; a house is a place where a family pursues its shared life, and strangers have no claim to be let into it. In the current draft he extends the analogy in two directions I want to stress-test before the paper goes out. First, he says the analogy covers not only the front door (exclusion at the border) but also the removal of guests: just as a host may end the party and ask a guest to leave, even into the cold, a state may deport. Second, he concedes one limit — a homeowner may not push someone off the porch into a blizzard — but insists this maps only onto the rule against returning people to danger, generating at most a duty of temporary shelter: the stranger sleeps in the garage until the storm passes, but acquires no claim to a place in the household itself.

  Please audit the analogy. Give me a correspondence table (house, homeowner, family members, door, guest, blizzard, garage, and anything else doing real structural work); then say where the mapping breaks; then distinguish the disanalogies that matter for his intended use from the ones that don't — for example, whether the fact that a state's territory is not owned the way a house is, that the "homeowners" found the door already placed rather than placing it themselves, or that the guests of states are typically people with no home to go back to rather than people with one, bear on exclusion, on deportation, or on both. Assess whether his two extensions are genuinely supported by the analogy or are being smuggled in past it, and whether the blizzard exception, as he reads it, captures the actual limits of the duty it gestures at. If there is a better analogy for the moral situation of a state facing asylum-seekers, name it and say what it gets right that the household picture gets wrong.

  Two further requests. First, please separate what is settled among people who work on these questions from what is genuinely contested — for instance, where there is real disagreement about whether territorial rights resemble private property rights at all, and about how demanding duties of rescue at a border are — and do not present a contested view as the consensus. Second, close with a machine-readable verdict on the very last line, in the form \answer{...} enclosing a short label such as \answer{survives-narrowly} or \answer{fails-for-deportation}, with nothing after it.
reasoning: |-
  Hmm, the user is asking me to critique a household analogy used in a policy paper about asylum admissions. This analogy compares a state to a private household where homeowners decide who enters, can ask guests to leave even into bad weather, with only a minimal duty of temporary shelter during extreme situations like a blizzard. The user specifically wants me to audit this analogy in detail.

  First, I need to map out the correspondence between the household analogy elements and their real-world political counterparts:

  - House = State territory
  - Homeowner = State/government
  - Family members = Citizens
  - Door = Border
  - Guest = Asylum-seeker
  - Blizzard = Persecution/danger
  - Garage = Temporary protection
  - Party ending = Revocation of status
  - Push off porch = Refoulement (return to danger)

  Now I'll identify where this mapping breaks down significantly. There are several critical disanalogies:

  1. Territory isn't privately owned like a house - states hold territory as sovereign entities with obligations to international law and human rights, not as private property owners.

  2. Citizens aren't like family members - citizenship is a legal status, not an intimate familial relationship. States govern diverse populations with varying degrees of connection.

  3. Asylum-seekers aren't voluntary guests - they're often fleeing life-threatening situations, not attending a social event. Their presence at the border isn't discretionary.

  4. The "blizzard exception" is too narrow - the prohibition against refoulement (return to danger) in international law often creates ongoing protection needs, not just temporary shelter.

  5. Deportation is fundamentally different from asking a guest to leave - states have obligations to due process and non-refoulement that homeowners don't face when removing someone from their property.

  For the user's colleague's specific extensions:
  - The deportation analogy fails because states can't simply "end the party" without considering human rights obligations
  - The blizzard exception as temporary shelter only doesn't capture the reality that protection often needs to be long-term when danger persists

  The household analogy oversimplifies state obligations and ignores the involuntary nature of refugee movements. A better analogy might be a lifeboat - emphasizing rescue duties, shared vulnerability, and the distinction between exclusion (not pulling people in) and deportation (throwing them overboard). This captures the high stakes better.

  I should note what's settled versus contested in this field. There's consensus that states have some discretion over borders but must respect non-refoulement. However, there's genuine disagreement about how much territorial rights resemble property rights and how demanding rescue duties are at borders.

  Finally, I'll conclude with a clear verdict that the analogy fails critically for deportation while being problematic but partially salvageable for exclusion - thus the label \answer{fails-for-deportation}.
answer: |-
  ### Brainstorming
  - **Core analogy**: State-as-household frames territorial control as private property rights, emphasizing autonomy over inclusion/exclusion.
  - **Key tensions**: 
    - States are public institutions bound by international law/human rights; households are private spheres.
    - Asylum-seekers are *forced* migrants (no "home to return to"); guests are voluntary.
    - Territory is non-excludable by nature (e.g., borders span rivers/mountains); houses are discrete.
  - **Ethical anchors**: Non-refoulement (no return to danger) is settled law; its scope (temporary vs. permanent protection) is contested. State discretion over admissions is broadly accepted but constrained by rescue duties.
  - **Analogy extensions**: 
    - Deportation-as-eviction risks ignoring due process/durable risks.
    - "Garage" as temporary shelter may understate integration rights if danger persists.
  - **Better analogies?**: Lifeboat (rescue duties), hospital ER (urgent care), or shared earth stewardship (collective responsibility).

  ---

  ### Correspondence Table
  | **Household Element** | **Political Analogue**               | **Structural Role**                                   |
  |------------------------|--------------------------------------|-------------------------------------------------------|
  | House                 | State territory                     | Space controlled by a group                           |
  | Homeowner             | State (government/citizens)         | Decision-maker over access                            |
  | Family members        | Citizens                            | "Insiders" with privileged belonging                  |
  | Door                  | Border                              | Point of entry control                                |
  | Guest                 | Asylum-seeker                       | Outsider seeking entry                                |
  | Blizzard              | Persecution/danger (e.g., war)      | External threat justifying exception                  |
  | Garage                | Temporary protection                | Minimal shelter without integration                   |
  | "Party ending"        | Revocation of status/deportation    | Termination of permission to remain                   |
  | "Push off porch"      | Refoulement (return to danger)      | Actively exposing to harm (prohibited)                |

  ---

  ### Where the Mapping Breaks
  1. **Territory ≠ Private Property**:  
     - States govern territory as sovereign trustees (not owners), with obligations under international law. Houses lack comparable public duties.  
     - **Bearing on**: Both exclusion and deportation. States cannot treat territory as purely private; human rights limit discretion.

  2. **Citizens ≠ Family Members**:  
     - Citizenship is a legal/political status, not an intimate bond. States include diverse, non-consenting residents; families are small and voluntary.  
     - **Bearing on**: Exclusion. Justifies some discretion but not absolute exclusion (unlike a family's private home).

  3. **Asylum-Seekers ≠ Voluntary Guests**:  
     - Guests choose to visit; asylum-seekers are often *forced* to flee with no alternative sanctuary.  
     - **Bearing on**: Exclusion. Creates a stronger claim based on necessity/rescue.

  4. **"Blizzard" as Temporary ≠ Protracted Danger**:  
     - Persecution (e.g., political violence) often persists for years, making "temporary shelter" inadequate. Non-refoulement may require long-term protection.  
     - **Bearing on**: Deportation. The duty isn't just shelter until the storm passes; it may entail residency if return remains unsafe.

  5. **Deportation ≠ Asking a Guest to Leave**:  
     - Deportation may send someone to proven danger (violating non-refoulement), whereas eviction to a blizzard is universally condemned. States must assess individualized risks.  
     - **Bearing on**: Deportation. Ignores due process and irreversible harm.

  ---

  ### Assessment of Extensions
  - **Deportation Extension ("Ending the Party")**:  
    Not supported. The analogy smuggles in absolutism by ignoring that deportation to danger is *actively harmful*, not merely withdrawal of hospitality. A homeowner can evict to a *safe* public space; states cannot assume safety exists elsewhere for refugees.

  - **Blizzard Exception ("Garage Shelter")**:  
    Partially supported for exclusion (temporary non-refoulement) but fails for deportation. The "garage" maps to temporary protection, but international law recognizes that if danger persists, temporary protection morphs into permanent residency (e.g., UN Refugee Convention). The analogy misses this dynamism, wrongly implying asylum-seekers always "return home" after the storm.

  ---

  ### Consensus vs. Contested Views
  | **Issue**                          | **Settled**                                                  | **Contested**                                                                 |
  |------------------------------------|--------------------------------------------------------------|-------------------------------------------------------------------------------|
  | **Territorial rights**             | Not identical to private property; sovereignty entails duties. | Whether territorial rights *ground* exclusion (e.g., collective self-determination vs. human rights). |
  | **Non-refoulement**                | Absolute prohibition on return to persecution/torture.       | Scope: Applies only to borders, or extraterritorially? Covers climate displacement? |
  | **Duty of rescue at borders**      | States must not return to immediate danger.                  | How *costly* rescue must be (temporary shelter vs. permanent asylum).        |
  | **State discretion over admissions** | Broad but not unlimited; subject to proportionality.        | Whether states owe *open borders* absent danger, or may prioritize citizens. |

  ---

  ### A Better Analogy: The Lifeboat  
  - **Structure**: A lifeboat (state) in a stormy sea (global context) encounters drowning people (asylum-seekers).  
  - **Why better**:  
    - Captures *urgency* and *non-voluntary* presence (unlike invited guests).  
    - Emphasizes *rescue duties* based on capacity and shared vulnerability.  
    - Distinguishes exclusion (not pulling someone in) from deportation (throwing them overboard), clarifying the latter's severity.  
  - **What it fixes**: Rejects the household's property-rights framing for a solidarity-based one. A lifeboat’s space is limited, but casting adrift those already rescued is unconscionable.  

  ---

  ### Final Verdict  
  The household analogy critically **fails for deportation** by trivializing non-refoulement and due process, and **strains for exclusion** by ignoring the involuntary plight of asylum-seekers. Its extensions are largely unsupported, and the "blizzard" exception undersells durable protection duties. A lifeboat or rescue framework better captures the ethics of forced displacement.  

  \answer{fails-for-deportation}
