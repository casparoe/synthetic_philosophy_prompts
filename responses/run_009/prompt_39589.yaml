  Quick question about the PBR theorem that's been bugging me. From what I understand they actually ran the experment and proved the wavefunction is a real physical thing and not just bookkeeping about our knowledge, right? So if psi-epistemic views are experimentally falsified now, why do people still call themselves Copenhagen-ish or whatever, and why is this even still debated in foundations? And second thing -- doesn't the theorem basically confirm Bohmian mechanics? Cause Bohm's wavefunction is exactly this real field pushing the particles around, so psi-ontic should just mean Bohm was right all along, no? Seems to me the only way to stay psi-epistemic after PBR is to just deny quantum mechanics itself, which I assume is not what the QBism people are doing... but then what are they actually doing, just ignoring the result? Feels like I'm missing something here.
reasoning: |-
  Okay, let me unpack this user's question about the PBR theorem and its implications. They seem genuinely puzzled about why foundational debates persist after PBR, and I notice they've conflated several distinct concepts - specifically equating psi-ontic views with Bohmian mechanics. 

  First, I should clarify the actual scope of PBR's experimental verification. The 2012 neutron interferometry experiment was impressive, but it only tested a very specific class of psi-epistemic models where quantum states could overlap completely. There are more nuanced epistemic interpretations that avoid PBR's assumptions, like QBism's personalist approach or relational QM. The user might be overestimating how comprehensively PBR ruled out epistemic views.

  About their Bohmian mechanics point - this reveals a common misconception. Psi-ontic simply means the wavefunction corresponds to physical reality, which includes not just Bohm but also Everettian and even collapse theories. The user's phrasing "should just mean Bohm was right" suggests they might not grasp the distinction between the general category (psi-ontic) and specific implementations. I should emphasize that PBR doesn't prefer any particular ontic interpretation.

  The QBism question is particularly interesting. Their "denying quantum mechanics" assumption misses QBism's radical epistemology - it's not ignoring PBR but reinterpreting the wavefunction as subjective belief. Since PBR assumes states represent objective properties, QBists would reject that premise entirely. I should explain how different interpretations modify the underlying assumptions of the theorem.

  Looking deeper, the user seems frustrated by perceived inconsistency in the field ("why is this still debated?"). They might be seeking not just technical clarification but also context about how scientific consensus forms in foundational physics. The response should validate their curiosity while showing why experts maintain diverse views - perhaps analogizing to how different coordinate systems can all correctly describe spacetime.

