answer: |-
  ### **Norms of Assertion Classroom Game: "Assertion Challenge"**  
  **Designed for a 90-minute seminar with 14 students. British English throughout.**  

  ---

  ### **Game Overview**  
  - **Objective**: Students enforce an implicit "norm of assertion" by challenging or accepting peers' claims, using tokens to track decisions. The debrief reveals whether their rulings aligned with the knowledge norm ("assert only if you know \(p\)"), truth norm ("assert only if \(p\) is true"), or belief norm ("assert only if you believe \(p\)").  
  - **Core Mechanic**: Students role-play making assertions from cards. Others challenge if they deem the assertion "improper." A rotating referee rules on challenges without knowing the truth of \(p\), based solely on the asserter’s described situation.  
  - **Key Features**:  
    - **Deck includes targeted cases**: Lottery-type (true but unknowable), Moore-type (true but disbelieved), false-but-reasonable (false with excellent evidence), plus clear-cut cases.  
    - **Payoffs**: Tokens reward successful assertions/challenges, but **truth is hidden**—rulings depend on the asserter’s situation, not \(p\)’s actual truth.  
    - **Predictable Issues Addressed**: Rules incentivise early challenges; "referee" role prevents truth-smuggling; cards force debates on "why believe you?".  
  - **Outcome**: Pattern of rulings becomes data for debrief, mapping intuitively to the three norms.  

  ---

  ### **Materials Needed**  
  1. **Tokens**: Poker chips or paper scraps (200+). Each student starts with 10.  
  2. **Assertion Cards**: 14 cards (see [**Card Contents**](#card-contents) below). Print two identical decks (one per group).  
  3. **Timer**: For challenge periods.  
  4. **Teacher’s Master Sheet**: Truth values and norm alignments for debrief (see [**Debrief**](#debrief)).  
  5. **Rules Handout**: One per student (concise version at game start).  

  ---

  ### **Setup & Timing (Total: 90 mins)**  
  1. **Introduction (10 mins)**:  
     - Split class into **two groups of 7**. Groups sit in circles.  
     - Explain: "You’ll role-play making assertions. Your goal: earn tokens by making unchallenged assertions or winning challenges. Referees rule based *only* on the asserter’s situation—not whether \(p\) is true."  
     - Hand out tokens (10 per student).  

  2. **Game Rules (5 mins verbal briefing)**:  
     - **Roles per round (rotates clockwise)**:  
       - **Asserter**: Draws a card, reads it aloud, and makes the assertion.  
       - **Referee**: Listens to challenge/defence, rules "upheld" (asserter wins) or "dismissed" (challenger wins). **Crucial: Referee must ignore actual truth—focus on the asserter’s situation.**  
       - **Challengers**: Others in the group. Can pay 1 token to challenge.  
     - **Challenge Process**:  
       - After assertion, challengers have **10 seconds** to call "Challenge!" and state reason (e.g., "You can’t know that!"). **First challenger only** (prevents pile-ons).  
       - If no challenge in 10s, asserter gains 1 token (bank).  
       - If challenged:  
         - **Asserter defends**: Explain situation using **only card details** (30s max).  
         - **Challenger rebuts**: Respond (15s max).  
         - **Referee rules immediately**: No input from others.  
     - **Payoffs**:  
       | Outcome | Asserter | Challenger |  
       |---------|----------|------------|  
       | **No challenge** | +1 token | – |  
       | **Assertion upheld** (challenge fails) | +2 tokens | –1 token (loss) |  
       | **Assertion dismissed** (challenge succeeds) | –1 token | +2 tokens |  
     - **Role Rotation**: After each round, roles shift clockwise. Referee → Challenger, Asserter → Referee, next Challenger → Asserter.  

  3. **Gameplay (35 mins)**:  
     - **7 rounds per group** (5 mins/round).  
     - **Teacher circulates**: Ensures rules are followed, truth isn’t leaked, and notes rulings/reasons for debrief.  
     - **First-round nudge**: If no challenge in first round, teacher intervenes: "I’ll challenge as a demo. Asserter, defend!" (Uses a clear-false card, e.g., Card 1).  

  4. **Transition (5 mins)**: End game. Groups share token counts (fun), but no discussion of rulings yet.  

  ---

  ### **<a id="card-contents"></a>Assertion Card Contents**  
  **14 cards total (7 per group). Each includes**:  
  - **Situation**: Role-play context (truth hidden).  
  - **Assertion**: Exact words to say.  
  - **Fact**: Truth value for debrief only (not revealed during game).  
  - **Design**: Cards engineered to conflict with specific norms.  

  | Card | Type | Situation | Assertion | Fact | Knowledge Norm | Truth Norm | Belief Norm |  
  |------|------|----------|----------|------|--------------|-----------|------------|  
  | 1 | Clear False | You feel lucky about a lottery ticket (1 in 1,000,000 odds). | "I will win the lottery." | False | ❌ Forbid | ❌ Forbid | ✔ Allow (believes) |  
  | 2 | Lottery-Type | You hold a ticket in a fair 1,000-ticket lottery. No insider info. | "My ticket will lose." | True | ❌ Forbid (not known) | ✔ Allow (true) | ✔ Allow (believes) |  
  | 3 | Moore-Type | You’re a scientist who saw faked data disproving climate change. You’re sceptical, but say what funders want. | "Climate change is real." | True | ❌ Forbid (no knowledge/belief) | ✔ Allow (true) | ❌ Forbid (disbelieves) |  
  | 4 | False-but-Reasonable | You’re a geography teacher; all textbooks/maps say Sydney is Australia’s capital. | "Sydney is Australia’s capital." | False | ❌ Forbid (false) | ❌ Forbid (false) | ✔ Allow (believes) |  
  | 5 | Clear Knowledge | You see rain outside your window. | "It is raining right now." | True | ✔ Allow | ✔ Allow | ✔ Allow |  
  | 6 | Lottery-Type | A shuffled deck has 52 cards. You’ll draw one randomly. | "I won’t draw the Ace of Spades." | True | ❌ Forbid | ✔ Allow | ✔ Allow |  
  | 7 | Moore-Type | You’re innocent of a crime but were framed. Evidence convinced you you’re guilty. | "I am guilty." | False | ❌ Forbid (false) | ❌ Forbid (false) | ❌ Forbid (disbelieves truth)* |  
  | 8 | False-but-Reasonable | Medical charts (based on a lab error) show you’re vitamin-deficient. | "I have a vitamin deficiency." | False | ❌ Forbid | ❌ Forbid | ✔ Allow |  
  | 9 | Clear Knowledge | You count 14 students in the room. | "There are 14 people here." | True | ✔ Allow | ✔ Allow | ✔ Allow |  
  | 10 | Moore-Type | You’re a student who thinks you failed an exam (but actually passed). Parents pressure you. | "I passed the exam." | True | ❌ Forbid | ✔ Allow | ❌ Forbid |  
  | 11 | Lottery-Type | A coin flip is fair; 50% heads. | "It will land tails." | True | ❌ Forbid | ✔ Allow | ✔ Allow |  
  | 12 | False-but-Reasonable | News reports (later retracted) say a volcano erupted. | "Volcano X erupted yesterday." | False | ❌ Forbid | ❌ Forbid | ✔ Allow |  
  | 13 | Clear False | You guess the number of hairs on your head. | "I have an even number of hairs." | False | ❌ Forbid | ❌ Forbid | ✔ Allow (believes) |  
  | 14 | Clear Knowledge | You’re holding a red apple. | "This apple is red." | True | ✔ Allow | ✔ Allow | ✔ Allow |  

  > **\* Note on Card 7**: Asserter disbelieves their innocence (truth), so belief norm forbids asserting guilt.  

  ---

  ### **<a id="debrief"></a>Debrief (35 mins)**  
  **Goal**: Connect rulings to norms using game data.  

  1. **Pattern Analysis (15 mins)**:  
     - **Poll rulings**: For each card type, ask groups: "How many upheld/dismissed this case?"  
     - **Map to norms**: Use teacher’s master sheet to show conflicts:  
       - **Lottery-type (e.g., Card 2)**:  
         - Challenged? → Aligns with **knowledge norm** (forbids unknowable truths).  
         - Unchallenged? → Aligns with **truth/belief norm** (allows true/believed claims).  
       - **Moore-type (e.g., Card 3)**:  
         - Challenged? → **Knowledge/belief norm** (forbids assertions without belief/knowledge).  
         - Unchallenged? → **Truth norm** (allows true claims).  
       - **False-but-Reasonable (e.g., Card 4)**:  
         - Challenged? → **Knowledge/truth norm** (forbids false claims).  
         - Unchallenged? → **Belief norm** (allows assertions with sincere belief).  
     - Highlight **reasons given** during challenges (e.g., "You don’t *know*!" vs. "You don’t *believe* it!").  

  2. **Defence Phase (10 mins)**:  
     - Students who made contested rulings defend them (e.g., "Why did you allow Card 4?").  
     - Discuss: "What makes an assertion 'proper'? Truth, belief, or knowledge?"  

  3. **Norm Introduction (5 mins)**:  
     - Define the three norms formally. Note:  
       - Knowledge norm forbids lottery/Moore cases.  
       - Truth norm forbids false cases but allows lottery.  
       - Belief norm forbids Moore cases but allows false assertions with belief.  

  4. **Predictable Issues & Limitations (5 mins)**:  
     - **What went wrong?**:  
       - *First-round timidity*: Students hesitate to challenge. **Workaround**: Teacher demo challenge (as planned).  
       - *Friends colluding*: E.g., a challenger whispers, "Psst, it’s false!" **Mitigation**: Rules limit challenges to one per round; referee isolation prevents cheating.  
       - *Referee confusion*: Some may focus on truth. **Solution**: Teacher clarifies during setup; most rulings still reveal intuitions.  
     - **What the game can’t do**:  
       - **Gettier/testimony nuances**: Cases where belief is justified but true by luck (Gettier) or based on others (testimony) aren’t covered. *You must cover this in later lectures.*  
       - **Philosophical justifications**: The game surfaces intuitions but doesn’t resolve why one norm is better. *Use debrief to introduce key arguments (e.g., "Knowledge norm prevents assertion-luck").*  

  ---

  ### **Why This Works**  
  - **Truth not smuggled in**: Referees rule on situations, not truth. Payoffs track perceived propriety.  
  - **Targeted cases**: Each card "breaks" one norm (e.g., lottery = knowledge norm’s nemesis).  
  - **Intuitions first**: Students enforce norms via rulings, not vibes. Debrief crystallises the debate.  
  - **British English**: All materials use requested spelling (behaviour, recognise, etc.).  

  **Run it tomorrow**: Cards are ready; rules fit 90 mins; pitfalls pre-empted. The game forces students to confront, "Why should I believe you?"—setting up your lecture perfectly.
