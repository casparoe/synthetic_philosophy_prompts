            - If the Referee upholds the assertion (challenge fails): the Asserter gets the pot (the 1 token) plus 1 additional token from the bank. So the Asserter gains 2 tokens (1 from the pot, 1 from the bank), and the pot is now empty.
            - If the Referee dismisses the assertion (challenge succeeds): the Challenger gets the pot (their 1 token back) plus 2 tokens from the bank. The Asserter loses 1 token to the pot (which is now 1 token again? But then the next round? This is messy.)

          Alternatively, we can have a central bank (teacher holds tokens). 

          Better:

            - Challenger pays 1 token to the bank to challenge.
            - If the challenge fails (assertion upheld): Asserter receives 2 tokens from the bank.
            - If the challenge succeeds (assertion dismissed): Challenger receives 2 tokens from the bank, and the Asserter pays 1 token to the bank.

          If there is no challenge: the Asserter receives 1 token from the bank.

          The bank has an unlimited supply (the teacher provides tokens).

          6. The round ends. Roles rotate: 
              - The current Asserter becomes the Referee for the next round.
              - The current Referee becomes a Challenger.
              - The next Asserter is the player to the left of the current Asserter.

          The game continues for 7 rounds.

          Important: The Referee must rule based on the situation described on the card and the arguments presented. The Referee does not know the actual truth of the assertion and must not consider it. The Referee is deciding whether the assertion was properly made given the situation.

  11. Teacher's Master Sheet:

      The teacher has a list of the cards with:

          Card ID, Situation, Assertion, Fact (truth value), and the expected ruling under each norm:

              Knowledge norm: Allowed only if the asserter knows p (which requires truth, belief, and justification). So we mark: 
                  - For lottery: not allowed
                  - Moore: not allowed (because no belief and no knowledge)
                  - False good faith: not allowed (false, so not known)
                  - Clear knowledge: allowed
                  - Clear false: not allowed

              Truth norm: Allowed if true.
                  - Lottery: allowed (true)
                  - Moore: allowed (true)
                  - False good faith: not allowed (false)
                  - Clear knowledge: allowed
                  - Clear false: not allowed

              Belief norm: Allowed if the asserter believes p.
                  - Lottery: allowed (the character believes)
                  - Moore: not allowed (the character does not believe)
                  - False good faith: allowed (the character believes)
                  - Clear knowledge: allowed
                  - Clear false: allowed (if the character believes) — but in our clear false card, the character might believe? In our design, the clear false card has no evidence, but the character might still believe? We designed: 
                      Card 12: "I will win the lottery." (with one ticket) — the character might believe? Or they are just saying it? We should specify: "You have a strong feeling that you will win." Then they believe it? So belief norm allows.

              So summary:

                  Card type      | Knowledge | Truth | Belief
                  -------------------------------------------
                  Lottery-type   | Forbid    | Allow | Allow
                  Moore-type     | Forbid    | Allow | Forbid
                  False good faith| Forbid   | Forbid| Allow
                  Clear knowledge| Allow     | Allow | Allow
                  Clear false    | Forbid    | Forbid| Allow? (if they believe)

              But note: in the clear false, the character believes? We must design the card so the character believes. For example:

                  Clear false: "I will win the lottery." — situation: "You have a lucky feeling and believe you will win. You assert: 'I will win the lottery.'" [Fact: You lose.]

              Then belief norm allows.

              So the clear false: 
                  Knowledge: forbid (false, so not known)
                  Truth: forbid (false)
                  Belief: allow (they believe)

              Then the clear false is the same as the false good faith? Actually, the false good faith has excellent evidence, the clear false has bad evidence. But the belief norm doesn't care about evidence. So both are allowed by the belief norm.

              So the clear false and false good faith are treated the same by the belief norm? Then we don't need both? But we want to show that the belief norm allows false assertions. So we can have both.

  12. Debrief Outline:

      - The teacher collects the results from each group: for each card, what was the ruling? (upheld or dismissed) and the reason given for challenge (if any).

      - The teacher then shows the three norms:

            Knowledge norm: You may assert p only if you know p.
            Truth norm: You may assert p only if p is true.
            Belief norm: You may assert p only if you believe p.

      - Then, for each card type, the teacher shows:

            Lottery-type: 
                - We expected: Knowledge norm would forbid, Truth and Belief would allow.
                - What happened? If challenged, that aligns with knowledge norm. If not, with truth or belief.
                - Also, what was the challenge reason? If "you don't know", that's knowledge norm.

            Moore-type:
                - Knowledge: forbid (no knowledge, and no belief) -> challenge
                - Truth: allow -> no challenge
                - Belief: forbid (no belief) -> challenge
                - So if challenged, it could be for knowledge or belief. Look at the reason: if "you don't believe it", that's belief norm; if "you don't know it", that's knowledge norm.

            False good faith:
                - Knowledge: forbid (false, so not known) -> challenge
                - Truth: forbid (false) -> challenge
                - Belief: allow (they believe it) -> no challenge
                - So if challenged, it could be for knowledge or truth. If not challenged, that's belief norm.

            Clear knowledge: all allow -> no challenge expected.

            Clear false: 
                - Knowledge: forbid -> challenge
                - Truth: forbid -> challenge
                - Belief: allow -> no challenge
                - So if challenged, it could be for knowledge or truth; if not, belief norm.

      - Then, the teacher points out that in the cases where the ruling was split (e.g., Moore-type: sometimes challenged, sometimes not) it reveals disagreement about the norms.

      - Finally, open discussion: Which norm do you think we were enforcing? Why? And then present the philosophical debate.

  13. What will go wrong:

      - Problem: No challenges in the first rounds. 
          Solution: The teacher can participate as a challenger in the first round? Or we can have a rule that in the first round, the teacher will challenge no matter what? Alternatively, design the first card to be a clear false one (with bad evidence) that is likely to be challenged.

      - Problem: Referee doesn't understand their role. 
          Solution: The teacher explains clearly and perhaps does a demonstration round.

      - Problem: Students don't role-play. 
          Solution: Emphasise that they must play the situation as described.

      - Problem: The same student is always challenging. 
          Solution: The token cost (1 token) will deter frivolous challenges. Also, we can have a rule that you can only challenge once every two rounds? But that might be too restrictive. Let's see how it goes.

  14. What the game cannot do:

      - It cannot capture the full philosophical complexity (e.g., Gettier cases, justification without truth, etc.).
      - It relies on the referee's intuition, which might be inconsistent.
      - It doesn't address the question of why one norm is better than another, only what norm they were using.

      The teacher must follow up with the literature.

