   1. Baseline: everyone can choose freely.
   2. Some students are constrained (cannot press) and others are unconstrained. This forces the unconstrained to either press (and take the blame) or let the big loss happen.
   3. A phase where they can talk and try to coordinate (e.g., take turns pressing).

