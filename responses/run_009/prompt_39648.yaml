answer: |-
  ### Joint Statement: Adversarial Collaboration on the Nature of Time  
  **Parties:** The Eternalist (E) and The Presentist (P)  

  ---

  ### (a) Common Ground: Claims Both Parties Endorse  
  1. **Experience of Time:** Humans experience time as having a flowing or dynamic quality ("passage"). The present feels experientially privileged (e.g., pain *ending* brings relief, anticipation feels directed).  
  2. **Physics of Relativity:** Simultaneity is not absolute. Two events simultaneous for one observer may not be for another in motion relative to the first. Spacetime is a unified four-dimensional structure.  
  3. **Language and Truth:** Sentences like "Dinosaurs existed" or "It will rain tomorrow" are true. Truth depends on how the world is.  
  4. **Causality and Traces:** Past events leave traces (e.g., fossils, memories, debt records) in the present. Causation connects events across time.  
  5. **Change in Manifestation:** Objects manifest different properties at different times (e.g., a leaf is green in summer, brown in autumn).  

  *Note: This section is non-vacuous. It acknowledges shared reality (e.g., traces, spacetime physics) while leaving open *why* time feels dynamic or *how* truths about non-present times are grounded.*  

  ---

  ### (b) The Six Candidate Disagreements: Dual Statements  

  1. **Ontology of Non-Present Entities**  
     - *Eternalist Wording:* "Past and future entities and events exist in the same concrete, substantive sense as present entities and events. Caesar’s crossing of the Rubicon is a real part of the universe’s structure, just as my coffee cup is."  
     - *Presentist Wording:* "Only entities and events that are present exist in a concrete, substantive sense. Caesar’s crossing of the Rubicon no longer exists; it is absent from reality in the way tomorrow’s storm is not yet present."  
     - **Do they disagree?** Yes. This is a direct conflict about fundamental existence.  

  2. **Truthmakers for Past Truths**  
     - *Eternalist Wording:* "Truths about the past require truthmakers—concrete, existing portions of reality—that ground them. If dinosaurs do not exist *somewhere* in reality, the truth of 'There were dinosaurs' is ungrounded and mysterious."  
     - *Presentist Wording:* "Truths about the past are made true by the way reality *is now*—e.g., by present traces (fossils), laws of nature, or primitive tensed facts. Demanding non-present truthmakers imposes an eternalist ontology as a precondition."  
     - **Do they disagree?** Partially. Disagreement centers on whether "truthmaker" requires *non-present entities*.  

  3. **Relativity’s Implications for Ontology**  
     - *Eternalist Wording:* "Special relativity shows that simultaneity is frame-dependent. Events in my ‘future’ are in another observer’s ‘present.’ If reality is not frame-dependent, all events across spacetime must be equally real (i.e., eternalism is true)."  
     - *Presentist Wording:* "Relativity describes coordinate-dependent *measurements* of time, not ontological priority. The ‘present’ in a privileged frame (e.g., the cosmic rest frame) or a dynamic spacetime model could ground presentism without contradiction."  
     - **Do they disagree?** Yes. Disagreement is over whether relativity *forces* eternalism or is compatible with presentism.  

  4. **Cross-Temporal Relations**  
     - *Eternalist Wording:* "Relations like causation, debt, or persistence (e.g., a table outlasting its legs) require all relata (past, present, future) to exist. If Caesar does not exist, I cannot literally owe him a debt; only his present trace exists."  
     - *Presentist Wording:* "Cross-temporal relations are grounded in present reality. My debt to Caesar is a present obligation arising from past events, encoded in records, promises, or social practices—not a relation to a non-existent past entity."  
     - **Do they disagree?** Yes. Disagreement is whether relations require *existing relata* at both ends.  

  5. **Genuine Change**  
     - *Eternalist Wording:* "Change is variation in properties across spacetime locations (e.g., the leaf is green-at-t1 and brown-at-t2). The ‘becoming’ of presentism is illusory; reality is a static block where all stages coexist."  
     - *Presentist Wording:* "Genuine change requires entities to *come into* or *go out of* existence (e.g., the leaf *ceases to be* green). Merely having different properties at different locations is not change but variation."  
     - **Do they disagree?** Yes. Conflict over whether change requires dynamic existence or just variation.  

  6. **Verbal Dispute via Quantifier Scope**  
     - *Eternalist Wording:* "Presentists restrict their quantifiers (e.g., ‘exists’) to the present, but this is arbitrary. If quantifiers range unrestrictedly over all spacetime, eternalism follows. The dispute reduces to semantics."  
     - *Presentist Wording:* "Eternalists inflate ‘existence’ to include non-present entities, violating the core meaning of ‘exists.’ If quantifiers range only over what is real *now*, presentism is obvious. The dispute reduces to semantics."  
     - **Do they disagree?** Minimally. Both agree the dispute *might* be verbal but disagree on whose quantifiers are "correct."  

  ---

  ### (c) Cruxes: Tests to Resolve Key Sub-Questions  
  For each crux, a test both parties accept as relevant, with predictions:  

  | Crux                          | Test/Counterexample                                                                 | E’s Prediction | P’s Prediction |  
  |-------------------------------|-------------------------------------------------------------------------------------|----------------|----------------|  
  | **1. Does relativity entail eternalism?** | *If physics revealed a privileged frame (e.g., quantum gravity), would presentism be viable?* | "No: Eternalism is already implied." | "Yes: Privileged frames rescue dynamism." |  
  | **2. Does relief require presentism?** | *If pain exists eternally "in the block," does relief lose meaning?* | "No: Relief is a psychological state at a spacetime location." | "Yes: Relief is *about* cessation of existence." |  
  | **3. Can traces ground past truths without non-present entities?** | *If all traces of an event vanished, would "Event X occurred" still be true?* | "No: Truth requires a truthmaker." | "Yes: Truths can be primitive or law-governed." |  
  | **4. Can change be static variation?** | *If a road has smooth and rough stretches, is it "changing"?* | "Yes: Variation = change." | "No: Change requires temporal transition, not spatial difference." |  

  ---

  ### (d) Verdicts: Verbal or Substantive  
  1. **Ontology (Plain Existence):** *Substantive*. Direct conflict about what fundamentally exists.  
  2. **Truthmakers:** *Verbal*. Turns on whether "truthmaker" must be *present* (P) or *tenselessly existent* (E). No new facts resolve this.  
  3. **Relativity Argument:** *Substantive*. Depends on unresolved physics (e.g., quantum gravity) and interpretation.  
  4. **Cross-Temporal Relations:** *Substantive*. E demands real relata; P denies relations require non-present entities.  
  5. **Change:** *Substantive*. E defines change as variation; P requires becoming. Mutually exclusive.  
  6. **Verbal Dispute:** *Verbal*. Both sides can reconstruct the other’s view by restricting/expanding quantifier domains.  

  **Summary of Verbal/Substantive:**  
  - Verbal: Disagreements 2 and 6.  
  - Substantive: Disagreements 1, 3, 4, and 5.  
  - *Core Load-Bearing Crux:* Relativity's ontological implications (Crux 1) as it bridges physics and metaphysics.  

  \answer{2/4/relativity-entails-eternalism}
