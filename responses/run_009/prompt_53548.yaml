prompt: |-
  For an essay on the inefficacy objection in collective-harm arguments, I need a thought experiment engineered to test whether the objection can be held only where it is convenient to hold it. The objector says: my burger, my flight, my vote never crosses any threshold, so my individual contribution does no wrong. Construct a case in which that reasoning, if accepted, must also excuse an act the very same objector would never excuse.

  Specifications: the scenario must be realistic and quotidian — a workplace or a neighbourhood, no trolleys, demons or perfect predictors — and no longer than a paragraph. The collective harm must be vivid and concentrated on identifiable individuals rather than diffuse and statistical, so that intuition is not diluted by abstraction. The individual contribution must be inefficacious in the strongest sense: stipulate perfect replacement, so that abstaining changes nothing ex ante or ex post and there is no residual probability of the agent being the threshold-crosser. Yet the act must come out intuitively and clearly wrong, and wrong because of the contribution itself — not because of what it symbolises, what it reveals about character, or what would happen if everyone did likewise. Then include a control case: the same act performed by a single agent alone, which the objector readily condemns, so we can see exactly what the two cases share and where they diverge.

  After the scenarios, demonstrate that the design works: state what a straightforward act consequentialist, a threshold or expected-value theorist, and a fairness- or complicity-based theorist each conclude in the main case; identify which structural feature is doing the work (I suspect the perfect replacement, but verify this rather than assume it); and give the inefficacy objector's strongest genuine reply rather than a strawman — in particular, whether they can deny perfect replacement in the constructed case without thereby abandoning the objection's standard use against meat and votes. Close by saying whether the case generalises back to climate and meat or whether the objector can find a principled disanalogy.

  Please answer in British English.
reasoning: |-
  Okay, the user is working on an essay about the inefficacy objection in collective-harm arguments. They need a thought experiment that challenges the objection by creating a scenario where the same reasoning would excuse an act that anyone would find clearly wrong. 

  First, I need to understand the specifications: it must be realistic (workplace or neighbourhood), no fantastical elements. The harm must be vivid and concentrated on identifiable individuals, not diffuse. The individual contribution must be completely inefficacious with perfect replacement - meaning if someone doesn't do it, someone else will, with zero difference in outcome. Yet the act must still feel intuitively wrong because of the contribution itself, not symbolic reasons or character judgment. 

  Hmm... workplace scenarios might work best here. Let me brainstorm: maybe something with shift work where harm comes from cumulative minor negligence? But the harm needs to be vivid... Ah! A security guard scenario feels promising - multiple guards each making a small decision that collectively causes harm. 

  The key is perfect replacement: each guard knows that if they don't skip the patrol, another will. Yet the skipped patrols collectively allow a theft that harms specific people. The control case would be a single guard alone doing the same thing - which everyone would condemn. 

  Now testing against theories: 
  - Straightforward consequentialist would say no wrongdoing since outcome unchanged 
  - But fairness theorists would see free-riding and complicity 
  Perfect replacement is indeed the crucial feature - it blocks standard counterarguments. 

  For the objector's reply: they might try to deny perfect replacement exists in real life, but that would undermine their original objection to voting/meat consumption. Interesting tension there. 

  Finally, generalisation: if this holds, it should apply to climate/meat too - the structural similarity is the dispersed harm with many contributors. The objector would struggle to find a principled difference without special pleading. 

  Better avoid making the victims too sympathetic though - keep it neutral like "shopkeeper" rather than "single mother" to prevent emotional bias. And British English throughout - "lift" instead of "elevator" etc.
answer: |-
  Here are the paired scenarios, designed to meet your specifications, followed by analysis:

  **The Main Case (Collective Harm with Perfect Replacement):**
  At a large warehouse, ten night security guards are each contracted for one hourly patrol. The site is vulnerable; if *any* patrol is skipped, nothing happens. However, if *all ten* skip their patrols in one night, thieves *will* definitely break in, stealing the life savings (£10,000) that the elderly shopkeeper next door stores there for safekeeping overnight. Each guard knows this, knows the others are similarly tempted, and knows that due to perfectly predictable replacement (another guard *always* skips if one doesn't, ensuring exactly ten patrols are skipped regardless), skipping their *own* patrol makes *absolutely no difference* to the robbery occurring or not – it happens either way. Guard A, wanting an extra break, skips his patrol. The robbery occurs as predicted, devastating the shopkeeper.

  **The Control Case (Single Agent):**
  A *single* security guard is solely responsible for the nightly patrol at a small shop where the same elderly shopkeeper keeps her life savings. Skipping the patrol *will* definitely allow thieves in to steal the £10,000. Knowing this, the guard skips his patrol for an extra break. The robbery occurs.

  **Analysis:**

  1.  **Intuitive Judgements:** The Control Case is straightforwardly condemned as wrongful; the guard caused preventable severe harm for a trivial gain. Crucially, in the Main Case, Guard A's act *also* feels intuitively wrong – not just lazy, but *complicit* in the harm to the shopkeeper, despite perfect replacement guaranteeing his skip changed nothing ex ante or ex post.
  2.  **Theoretical Conclusions:**
      *   **Straightforward Act Consequentialist:** In *both* cases, since skipping caused no *net* increase in harm compared to not skipping (in Main Case, due to replacement; in Control, because harm *was* caused), the act is permissible. This clashes strongly with intuition, especially in the Control Case.
      *   **Threshold/Expected-Value Theorist:** In the Main Case, Guard A's skip carries *zero* ex ante probability of being threshold-crossing (due to stipulation) and causes no harm ex post (due to replacement). Thus, it is permissible. Only the Control Case is condemned.
      *   **Fairness/Complicity-Based Theorist:** In the Main Case, Guard A *participates* in a harmful scheme he knows relies on collective non-performance. By skipping, he *freerides* on others' (potential) restraint and *does his part* in the collective action that wrongs the shopkeeper, making him complicit. This renders his act wrongful, distinct from mere character flaw or symbolism. The Control Case is condemned straightforwardly for causing harm.
  3.  **Structural Feature:** The **perfect replacement** is indeed crucial. It isolates the objection ("My action makes no difference") by rigorously eliminating *all* causal efficacy (probabilistic, threshold, actual) from the individual act, forcing the focus onto participation itself.
  4.  **Inefficacy Objector's Strongest Genuine Reply:** The objector must argue that *participation* without *difference-making* cannot ground wrongdoing. Their strongest move is to:
      *   **Deny Moral Force of Complicity/Fairness Alone:** Argue that moral wrongness requires actual or probabilistic harm causation. Merely "doing one's part" in a collective that *does* cause harm, when one's own part causally contributes nothing, is not *in itself* wrong. Wrongdoing only arises if one *causes* harm or *fails a specific duty* (like the single guard). Skipping the patrol in the collective case violates no specific, non-collective duty owed *by Guard A alone* to the shopkeeper regarding patrols.
      *   **Maintain Distinction for Meat/Votes:** They can *simultaneously* argue that perfect replacement doesn't realistically apply to consumer markets or large-scale voting (demand curves aren't perfectly elastic, votes aren't perfectly substitutable) while *conceding* it applies in this constructed case. Their objection thus holds for real-world inefficacy (meat, votes) where replacement isn't perfect, but they bite the bullet in this artificial, perfectly-replaced scenario: Guard A did nothing wrong, however counterintuitive. Condemning him relies on a separate, contestable principle of complicity they reject.
  5.  **Generalisation:** The case **does generalise back to climate and meat**, *if* one accepts the complicity/fairness principle. The structural similarity is being one of many contributors to a harm, where individual causal impact is negligible (even if not perfectly zero as stipulated), but participation enables and constitutes the collective wrong. The objector's principled disanalogy relies *entirely* on rejecting the moral relevance of complicity without individual difference-making. They must insist that the *only* wrong in the Control Case is the difference-making, and since that's absent in the Main Case (and, they argue, in meat/climate), no similar wrong exists. The burden shifts to whether complicity/fairness *can* ground wrongdoing independently of difference-making – which the thought experiment powerfully suggests intuition supports.
