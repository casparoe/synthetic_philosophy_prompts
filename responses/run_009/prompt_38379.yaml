answer: |-
  Very well, I shall meet your argument directly. You mistake the nature of my objection entirely. Hiroshima’s *military installations* were indeed a legitimate target, but the *means chosen* – the atomic bomb – was selected precisely *because* it would obliterate the entire city and its inhabitants indiscriminately. Truman did not merely foresee the deaths of innocents as a side-effect of destroying the Second General Army headquarters or the port; he *intended* the annihilation of the city and its populace *as the very instrument* to shatter Japan's will to resist. That is the heart of it: the mass killing of non-combatants was not an incidental consequence reluctantly accepted; it was the chosen *method* to coerce surrender. You speak of destroying "capacity and will," conflating them. Destroying war-making capacity can be licit, even foreseeing civilian death. But deliberately targeting civilians *to break their spirit* or their nation's resolve – making their deaths a *means* to your end – is murder. The bomb's indiscriminate totality proves this intent. The careful weighing of alternatives you mention does not transform the intrinsic character of the act; it merely selects among evils. If the only "effective" warfare against a certain enemy requires *this* – making the innocent a direct instrument – then waging war that way *is* forbidden, and rightly so. That is not pacifism; it is refusing murder as a tactic. Truman stands on the far side because his chosen means *was* the mass killing of the innocent as the lever to achieve victory. State your next point.
