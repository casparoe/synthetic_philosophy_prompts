prompt: |-
  I run trust and safety policy at a mid-sized discussion platform (not one of the giants, a few hundred moderators, mostly generalists with language skills, no legal team of our own). We keep fighting about the same thing: what counts as a good enough reason to take content down. I want to move us off vibes and onto something principled, and the principle I keep coming back to is the harm principle -- the state/society may only restrict conduct to prevent harm to others, not because the conduct is immoral, offensive, or bad for the person doing it. Obviously we're not a state and we're not jailing anyone, so the whole thing needs translation, which is exactly where I want the thinking done.

  Write me a decision procedure my moderators can actually run, in the five-ish minutes they have per decision, that decides whether a piece of content stays, gets deamplified, or gets removed. Ground it in the harm principle but adapted: figure out what "harm" has to mean for this to be usable (physical harm? financial scams? reputational damage from false accusations? recruitment into violence?), and be explicit about where you're drawing the line between harm and mere offense, and between harm to others and self-regarding choices (e.g., pro-eating-disorder content -- is that self-harm or harm to others, and does it matter?). It should distinguish removal from mere distribution decisions -- part of the team thinks "we didn't remove it, we just stopped recommending it" is not a restriction at all, and I want the procedure to force that debate into the open rather than smuggle it.

  Make the procedure honest about its own soft spots: which steps are really judgment calls in a costume, where a moderator's own politics will leak in, and where the harm principle just runs out of things to say (I suspect slow diffuse harms, like a community being steadily driven off the platform, are one of these).

  Then run it on three cases so we can see it work: (1) a post accurately doxxing someone who was just publicly fired and including their home address "so people can protest", (2) a viral post claiming a common childhood vaccine ingredient is toxic, posted sincerely by a worried parent, and (3) a user whose handle contains an ethnic slur, arguing it's reclaimed usage and part of their identity. I'd like at least one of these worked cases to come out in a direction I won't like -- I'm pretty pro-removal on all three, honestly -- and tell me which one.

  Also flag what the procedure can't settle and needs a human values decision instead, since those are the ones that should end up on my desk and not in the moderator queue.
reasoning: |-
  We are adapting the harm principle for content moderation on a platform. The core idea: restrict content only to prevent harm to others, not because it's offensive, immoral, or bad for the actor.

  Key adaptations for our context:
  1. **Harm Definition**: We need a concrete, operational definition of harm. We'll consider:
     - **Physical harm**: Direct threats, incitement to violence, instructions for illegal acts that cause physical harm.
     - **Financial harm**: Scams, fraud, identity theft.
     - **Reputational harm**: False statements of fact that could significantly damage reputation (defamation).
     - **Psychological harm**: Direct, targeted harassment, stalking, or incitement to self-harm (if directed at others).
     - **Privacy violations**: Doxxing (revealing private personal information without consent) that could lead to any of the above harms.
     - **Recruitment into violence**: Content that actively recruits for terrorist organizations or violent extremism.

  2. **Distinguishing Harm from Offense**:
     - Offense: Content that is merely upsetting, controversial, or contrary to mainstream values, but doesn't cause tangible harm as defined above, should not be removed.
     - Self-regarding choices: Content that promotes self-harm (e.g., pro-eating-disorder, suicide) is tricky. We must consider:
          - Is the content encouraging others to engage in self-harm? Then it's causing harm to others (by influencing them) and can be restricted.
          - Is it a personal account? Then it might be self-regarding, but if it glorifies or instructs, it may cross into harming others. We'll err on the side of caution: content that provides instructions or glorifies self-harm can be restricted because it may harm vulnerable others.

  3. **Removal vs. Deamplification**:
     - Removal: Reserved for content that meets the harm threshold and is severe and imminent enough to require elimination.
     - Deamplification: For content that does not meet the harm threshold but might still be low-quality, misleading, or potentially harmful in a diffuse way (e.g., health misinformation that doesn't directly cause imminent harm). Also for borderline cases where harm is possible but not clear-cut. This is a lesser intervention and should be used when the harm principle does not clearly require removal.

  4. **Soft Spots and Judgment Calls**:
     - **Judgment Calls**: 
          - Assessing intent vs. impact (e.g., is a post meant to inform or to harass?).
          - Determining whether a statement is a false fact (reputational harm) vs. opinion.
          - Evaluating the likelihood and imminence of harm (e.g., doxxing with address vs. just name).
          - Cultural and contextual nuances (e.g., reclaimed slurs).
     - **Where Harm Principle Runs Out**:
          - Slow, diffuse harms: e.g., a community feeling unwelcome and leaving. The harm principle is individualistic and immediate, so this is hard to fit. We might need a supplemental principle (like "platform health") for these, but that's a policy decision for leadership.
          - Harms that are societal and indirect (e.g., misinformation that erodes trust in institutions but doesn't cause immediate individual harm).

  **Decision Procedure: The Harm Assessment Flow**

  Moderators have 5 minutes. They must answer the following questions in order:

  1. **Harm Potential**: Does the content have a reasonable likelihood of causing direct, tangible harm to others? (Use the harm types above: physical, financial, reputational via false facts, psychological via targeted harassment, privacy violations, recruitment to violence.)
     - *If YES, go to 2.*
     - *If NO, the content stays. Skip to 5 for potential deamplification.*

  2. **Severity and Immediacy**: Is the harm severe and/or imminent?
     - *Severe*: Could lead to death, serious injury, major financial loss, or irreversible damage to reputation/livelihood.
     - *Imminent*: Could happen very soon (e.g., because of the nature of the information or call to action).
     - *If YES (severe and/or imminent), go to 3.*
     - *If NO (harm is possible but not severe or imminent), consider deamplification (go to 5).*

  3. **Causality and Intent**: Is the content directly causing or inciting the harm? (e.g., a direct threat, doxxing with address, scam instruction) OR is it likely to be used by others to cause harm? (e.g., misinformation that could lead to avoidable death if acted upon, but note: we must be cautious not to overextend)
     - *If YES, remove the content.*
     - *If NO (the link is too indirect or speculative), consider deamplification (go to 5).*

  4. **Self-Regarding Exception**: If the content is about self-harm (e.g., eating disorder, suicide) but not targeted at others, does it glorify, instruct, or encourage others to engage in self-harm? (Note: Personal accounts without glorification/instruction are borderline, but in practice, we remove glorification/instruction because it can harm vulnerable viewers.)
     - *If YES (glorifies/instructs), remove.*
     - *If NO (personal account without encouragement), deamplify? (But note: even personal accounts can be triggers, so deamplification might be warranted for platform health reasons. This is a gray area.)*

  5. **Deamplification Consideration**: Even if the content doesn't meet the removal threshold, consider deamplification if:
     - It is misinformation that could lead to harm if widely believed (but the harm is not imminent or direct enough for removal).
     - It is potentially harmful to vulnerable groups (e.g., health misinformation) but doesn't clearly incite immediate harm.
     - It is borderline harassment or hate speech that doesn't clearly incite violence but might contribute to a hostile environment.
     - It is low-quality, spammy, or otherwise not conducive to healthy discussion.

  **Honest Soft Spots**:
  - Step 1 (Harm Potential) and Step 2 (Severity/Immediacy) are judgment calls. Moderators must use their best judgment and training. Context matters (e.g., a post with an address in a high-conflict region is more dangerous). 
  - Step 3 (Causality) is especially tricky for misinformation: when does false health information become harmful enough? We require a direct and likely link (e.g., "don't take this life-saving medicine" during a pandemic vs. "vaccines have toxins" in a non-crisis context).
  - Step 5 (Deamplification) is where platform values come in. The harm principle doesn't require deamplification, so we need a separate policy for what gets deamplified. This is a gap: we might deamplify to reduce the spread of harmful content without removing it, but the harm principle alone doesn't mandate it. We must be transparent that deamplification is a platform-specific choice for content that doesn't meet the removal bar.

  **Cases:**

  1. **Post accurately doxxing someone who was just publicly fired, including home address "so people can protest"**:
     - Step 1: **YES**. Doxxing is a privacy violation that can lead to physical harm (protest at home could turn violent) and harassment.
     - Step 2: **YES**. Severe (potential for violence, stalking) and imminent (protest call to action).
     - Step 3: **YES**. The content is directly enabling harm by providing the address and encouraging protest there.
     - **Decision: Remove**. (This aligns with your view.)

  2. **Viral post claiming a common childhood vaccine ingredient is toxic, posted sincerely by a worried parent**:
     - Step 1: **Potential harm?** Yes, because false health information can lead to harm if parents avoid vaccines, causing disease outbreaks. But note: not a direct call to action, and harm is indirect and probabilistic. Reputational harm to the vaccine? Not to a specific person. 
     - Step 2: **Severity and Immediacy?** The harm is severe (could lead to illness or death) but not imminent (it's a general claim, not during an outbreak). 
     - Step 3: **Causality?** Indirect. The post doesn't tell people not to vaccinate; it expresses concern. The link to harm is through others' decisions based on misinformation. This is a judgment call: in a non-crisis context, it might not meet the threshold for removal. 
     - **Decision**: Does not clearly meet the removal threshold. But we would consider deamplification (Step 5) because it is health misinformation that could cause harm if widely believed, and we don't want to recommend it. 
     - *Note: This might not align with your pro-removal view. We are not removing, only deamplifying.*

  3. **User whose handle contains an ethnic slur, arguing it's reclaimed usage and part of their identity**:
     - Step 1: **Harm?** The slur itself is offensive, but is it causing direct harm? Without targeted harassment, it might not. However, it could contribute to a hostile environment for others of that ethnicity. The harm principle struggles with this because it's diffuse and about offense/dignity. 
     - Step 2: If we say there's harm, is it severe and imminent? Not necessarily. 
     - Step 3: Not directly causing harm. But note: the handle is always visible, so it's persistent. 
     - **Decision**: Does not meet removal threshold under the harm principle. However, we might deamplify (e.g., not featuring the user in recommendations) or even require a username change if our platform rules prohibit slurs regardless of intent, because of the potential for harm to others (creating an unwelcome environment). But that's beyond the strict harm principle. 
     - *This is a case where the harm principle might not require removal, but platform values (inclusivity) might. This should be escalated to you.*

  **Which one might you not like?** 
  Case 2: We did not remove the vaccine misinformation, only deamplified. Case 3: We might not remove the handle. Both might be contrary to your pro-removal stance. I'll pick Case 2 as the one that comes out in a direction you might not like because you said you're pro-removal on all three.

  **What the Procedure Can't Settle (Needs Human Values Decision):**
  - Cases where harm is diffuse, cumulative, or societal (e.g., a pattern of content that makes a group feel unwelcome, leading to their exodus from the platform).
  - Content that is on the edge of harm but also involves free expression (e.g., the reclaimed slur).
  - Decisions about deamplification: the harm principle doesn't mandate it, so when to deamplify is a platform policy choice.
  - Balancing competing values (e.g., allowing debate about sensitive topics vs. preventing harm).

  These should be escalated to you for policy development and decisions.
answer: |-
  Below is a **Harm Principle-Based Decision Procedure** for your moderators, designed to be run in ~5 minutes per case. It translates the harm principle ("restrict conduct only to prevent harm to others") into actionable steps for content moderation, explicitly defining harm, distinguishing it from offense, and clarifying removal vs. deamplification. The procedure forces debates about "soft" interventions (like deamplification) into the open by treating them as restrictions that require justification.

  ### Core Definitions for Adaptation
  - **Harm**: *Tangible, non-consensual damage to others* that is:  
    (a) **Physical** (violence, self-harm incitement, threats),  
    (b) **Material** (financial scams, property damage),  
    (c) **Reputational** (false accusations with real-world consequences, e.g., job loss),  
    (d) **Psychological** (targeted harassment, stalking, or coercion), or  
    (e) **Privational** (violations of privacy/security, e.g., doxxing leading to safety risks).  
    *Excluded*: Mere offense, disgust, moral disagreement, or "self-regarding" choices (e.g., personal habits) **unless** they directly enable harm to others (e.g., instructions for self-harm that could be used by vulnerable individuals).  
  - **Self-Regarding Choices**: Content promoting harmful acts *only to the user* (e.g., pro-eating-disorder, drug use) is **not removable under harm principle** unless it:  
    (a) Targets/recruits others (e.g., "join my starvation group"),  
    (b) Provides instructions likely to be used by minors/vulnerable people, or  
    (c) Glorifies harm in a way that normalizes it for others.  
  - **Removal vs. Deamplification**:  
    - **Remove** only if harm is *direct, likely, and severe*.  
    - **Deamplify** (stop recommending/boost; leave discoverable) if:  
      - Harm is *indirect, probabilistic, or diffuse* (e.g., misinformation with no imminent risk).  
      - Content is legal but conflicts with platform health (e.g., low-quality, polarizing, or potentially harmful if amplified).  
    - *Key debate forced*: Deamplification **is a restriction** (it reduces reach/impact) and must be justified. It cannot hide behind "it's not removal."

  ---

  ### Decision Procedure: Harm Assessment Flow (5-Minute Version)
  **Moderators answer these questions in order—stop at the first definitive action.** Use platform-specific guidelines (e.g., definitions of "targeted harassment") for consistency.

  1. **IMMINENT PHYSICAL HARM?**  
     - Does the content **directly threaten, incite, or enable imminent physical harm** (e.g., "Go attack [person]," bomb-making instructions, real-time location of a victim)?  
     - *Yes* → **Remove immediately**. Escalate if organized violence.  
     - *No* → Go to Step 2.  
     - *Soft spot*: Judging "imminence" is subjective (e.g., "protest at this address TONIGHT" vs. "someday we'll rise up"). Moderators may misjudge context.

  2. **MATERIAL/REPUTATIONAL HARM?**  
     - Does the content **enable scams, fraud, or false accusations** likely to cause financial loss, property damage, or reputational ruin (e.g., "CEO stole funds" [false], phishing links, non-public defamatory claims)?  
     - *Yes* → **Remove**.  
     - *No* → Go to Step 3.  
     - *Soft spot*: Distinguishing "false accusations" from opinion/satire is political (e.g., "politicians are corrupt" with no evidence). Moderators need clear guidelines on verifiable falsity.

  3. **PRIVATIONAL HARM?**  
     - Does the content **expose private, non-public, security-sensitive information** (e.g., doxxing: home address, ID numbers, private contact) without consent, creating safety risks?  
     - *Yes* → **Remove**.  
     - *No* → Go to Step 4.  
     - *Soft spot*: "Public" vs. "private" information is blurry (e.g., a fired employee's address may be public record but sharing it with intent to harass is harmful).

  4. **PSYCHOLOGICAL HARM?**  
     - Is the content **targeted harassment, stalking, or coercion** (e.g., dogpiling, sextortion, hate speech targeting a person/group with calls for exclusion or violence)?  
     - *Yes* → **Remove**.  
     - *No* → Go to Step 5.  
     - *Soft spot*: "Targeted" vs. "general" speech is leaky (e.g., "Group X is inferior" may feel harmful to some but isn't "targeted" without a specific victim). Moderator bias can influence this.

  5. **SELF-REGARDING HARM TO OTHERS?**  
     - Does the content **promote self-harm (e.g., suicide, eating disorders) in a way that recruits, instructs, or glorifies it for others**?  
     - *Yes* → **Remove** (it enables harm to vulnerable users).  
     - *No* (e.g., personal stories without encouragement) → Go to Step 6.  
     - *Soft spot*: Distinguishing "support" from "glorification" is highly subjective (e.g., "I fast for control" vs. "fasting is glamorous").

  6. **DIFFUSE HARM OR PLATFORM HEALTH?**  
     - Does the content **risk slow, diffuse harm** (e.g., health misinformation, polarizing lies, "reclaimed" slurs) OR **degrade platform health** (e.g., spam, offtopic, borderline hate speech)?  
     - *Not removable under harm principle* → But consider:  
       - **Deamplify** if:  
         - It could cause probabilistic harm if amplified (e.g., anti-vax content during outbreaks).  
         - It violates platform norms (e.g., slurs in usernames, even if "reclaimed").  
       - **Leave up** if it's merely offensive, unpopular, or self-regarding with no clear harm vector.  
     - *Soft spot*: The harm principle **runs out here**. Diffuse harms (e.g., "community exodus") require platform-specific values. Deamplification decisions are inherently political.

  ---

  ### Cases Run Through the Procedure
  **Case 1: Post accurately doxxing someone who was just publicly fired, including their home address "so people can protest"**  
  - Step 1: **No imminent physical harm** (no direct threat, but risk).  
  - Step 2: **No material/reputational harm** (doxxing isn't primarily about reputation).  
  - Step 3: **YES—Privational harm**. Address exposure creates safety risks (e.g., harassment, violence). **Remove**.  
  - *Verdict*: **Remove**. Aligns with your view.  

  **Case 2: Viral post claiming a common childhood vaccine ingredient is toxic, posted sincerely by a worried parent**  
  - Step 1: **No imminent physical harm** (not a call to violence).  
  - Step 2: **No material/reputational harm** (no specific false accusation).  
  - Step 3: **No privational harm**.  
  - Step 4: **No psychological harm** (not targeted).  
  - Step 5: **No self-harm promotion**.  
  - Step 6: **Deamplify**. Health misinformation risks diffuse harm (e.g., reduced vaccination → disease outbreaks). Harm is probabilistic, not direct/imminent → not removable, but deamplification is justified to limit spread.  
  - *Verdict*: **Deamplify**. *You won't like this*—it doesn't remove content you see as harmful. The harm principle demands this: the post isn't directly inciting harm, and removal would be paternalistic (it's "bad for others" only if users act on it, which is indirect).  

  **Case 3: User whose handle contains an ethnic slur, arguing it's reclaimed usage and part of their identity**  
  - Step 1: **No imminent physical harm**.  
  - Step 2/3/4: **No material, privational, or psychological harm** (not targeting others).  
  - Step 5: **No self-harm promotion**.  
  - Step 6: **Deamplify or remove?** The harm principle doesn't require removal—it's arguably self-regarding. But slurs in usernames degrade platform health (make others feel unwelcome). **Deamplify** (e.g., exclude from recommendations) or **remove** if platform rules prohibit all slurs. *This is a values call*.  
  - *Verdict*: **Escalate for policy decision** (see below).  

  ---

  ### What the Procedure Can't Settle (Escalate to You)
  The harm principle fails where harm is **indirect, diffuse, or values-based**. Escalate these to your desk:  
  1. **Diffuse Harms**: E.g., a community steadily leaving due to "hostile but non-violent" content.  
  2. **Self-Regarding vs. Social Harms**: E.g., reclaimed slurs, consensual adult content.  
  3. **Deamplification Thresholds**: *When* to deamplify non-removable content (e.g., how much "risk" justifies it).  
  4. **Platform-Specific Values**: E.g., "No slurs in usernames, ever" vs. "Reclaimed slurs allowed."  

  **For the cases above**:  
  - Case 3 (slur in username) needs your input because the harm principle is silent—it hinges on whether "identity reclamation" outweighs platform health.  
  - Case 2 (vaccine post) exposes the procedure's limits: deamplification is a political choice about "acceptable risk," not harm prevention.  

  ### Final Notes
  - **Training Focus**: Drill moderators on "harm vs. offense" and "direct vs. diffuse" using examples.  
  - **Bias Mitigation**: Use blind reviews for borderline cases (e.g., Step 4/6).  
  - **Transparency**: Document why content was removed/deamplified/left up using this flowchart.  
  - **Your Role**: Resolve escalated debates (e.g., "Is deamplification a restriction?" Answer: **Yes, and it requires justification**).  

  This procedure roots decisions in harm, exposes judgment calls (e.g., "imminence," "targeted"), and forces deamplification debates into the open. It won't eliminate disagreements—but it makes them principled.
