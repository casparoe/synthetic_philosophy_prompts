prompt: |-
  My roommates and I have been in a running argument for about a year now (we even made a shared doc, which is honestly mostly flame wars at this point). I'm the communitarian-ish one, and my roommate is basically a rawlsian liberal who thinks the state and even local governments should stay neutral about conceptions of the good life and just protect individual rights. Our latest flashpoint: our mid-sized town is debating an ordinance that would heavily restrict converting houses into short-term vacation rentals, officially justified by "preserving the enduring character and social fabric of established neighborhoods." She says that's exactly the kind of neutral-sounding cover for a substantive, contested vision of the good life that liberal neutrality forbids -- if a majority happens to like quiet streets with long-term neighbors, that's just their preference, and it can't be imposed on owners who'd rather rent to tourists. I say the town isn't imposing a vision on anyone, it's protecting a real, jointly produced good -- the neighborhood itself is something residents built together over decades, more like a commons than a private asset, and "neutrality" that ignores this is secretly taking sides for atomized individualism. We argue past each other constantly, and I've started to suspect that some of it is just us meaning different things by "neutral" and by "community."

  So here's my request: imagine the two of us finally sat down with a mediator and did a proper adversarial collaboration, and write the joint statement we'd produce at the end. I want a numbered section of claims we could both actually sign -- about what liberalism is committed to (and what it's not), about what communitarians are actually claiming (and not just the caricature of wanting to force everyone into one way of life), about where local democracy fits in, and about our specific case, including anything about short-term rentals, housing markets, and the commons-vs-private-asset framing. Then a disagreements table with the exact points where we still part ways, each phrased so that the person holding that view would accept the wording -- no slanted formulations like "letting majorities impose their tastes" unless she'd genuinely sign it. Identify our cruxes (I suspect one is whether a neighborhood's character is a jointly produced collective good or just an aggregate of private choices, and another is whether state neutrality toward conceptions of the good is coherent or itself a contested conception), and for each crux give a concrete case, thought experiment, or argument we'd both agree bears on it, with both of our predictions written down in advance. If you conclude some chunk of our dispute is purely verbal -- e.g., about the word "neutral" -- say which part and why, and get it out of the disagreements table. Also flag any claims where you think we'd each secretly accept the other's premise, since the mediator told us that happens a lot. Format it as a numbered agreed-claims section followed by the disagreements table, then cruxes with predictions. Please write it in American English, and keep it fair to both sides -- I'm going to make her read the final version, and she will absolutely litigate every slanted comma.
