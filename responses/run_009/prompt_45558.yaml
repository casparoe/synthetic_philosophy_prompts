  ## Joint Statement: Adversarial Collaboration on Community, Neutrality, and Short-Term Rentals

  **Mediator's Note:** This document reflects areas of agreement clarified through structured dialogue and points of principled disagreement articulated fairly by each party. Its purpose is mutual understanding, not persuasion. Signatories affirm that these formulations accurately represent their core positions as discussed.

  ### Section 1: Agreed Claims (Signed by Both Parties)

  1.  **Foundational Liberalism:** Liberalism, as understood here (inspired by Rawls), is fundamentally committed to protecting individual rights and liberties (e.g., property rights, freedom of contract, freedom of association) against undue infringement, including by democratic majorities. The state should not coercively promote one specific, comprehensive conception of the "good life" (e.g., a particular religion, philosophy, or lifestyle) over others.
  2.  **Communitarian Core:** Communitarianism, as understood here, argues that individuals are fundamentally shaped by their social context and that shared values, traditions, and relationships within communities are essential sources of meaning and identity. It contends that ignoring these social dimensions in political theory leads to an impoverished understanding of human flourishing and risks undermining the very social foundations necessary for liberalism to function.
  3.  **Beyond Caricatures:**
      *   Liberalism *does not* claim that individuals are purely atomistic or that communities lack value. It argues that the *state* must remain neutral *between* competing conceptions of the good life held *by individuals and communities*.
      *   Communitarianism *does not* inherently advocate for coercively imposing a single, monolithic way of life on everyone. It argues for recognizing the *legitimacy* of political communities, especially smaller ones, to debate and potentially enact policies reflecting shared values that sustain communal life, provided core rights are protected.
  4.  **Local Democracy's Role:** Local governments possess legitimate democratic authority to regulate land use and address issues impacting public welfare within their jurisdictions, subject to constitutional limits and higher-level laws. Zoning and similar regulations are established tools for this purpose.
  5.  **Market Effects:** Unrestricted conversion of residential properties to short-term rentals (STRs) can have significant local impacts, including: reducing the available stock of long-term housing (potentially increasing costs), altering neighborhood demographics and transience, changing patterns of noise and activity, and impacting local businesses reliant on stable residential populations. Both parties acknowledge these are potential *empirical* consequences, even if they disagree on their *normative* significance or the legitimacy of regulation.
  6.  **The "Commons" Claim Requires Justification:** Describing a neighborhood's "character" or "social fabric" as a "jointly produced commons" is a substantive claim requiring justification. It cannot be assumed as self-evident but must be argued for based on demonstrable shared investments, interdependencies, and collective action that create something beyond the sum of individual properties.
  7.  **The "Neutrality" Challenge:** The claim that "state neutrality is incoherent because it inevitably favors some conceptions of the good" is a serious and recognized philosophical critique of liberalism. Conversely, the claim that "neutrality is essential to prevent tyranny of the majority over minority conceptions of the good" is a core liberal commitment.
  8.  **Legitimate State Interests:** Governments can legitimately regulate property uses to prevent harm (e.g., nuisance, public safety, severe economic disruption) and to protect genuinely public goods (e.g., clean air, public health, functional infrastructure). The disagreement lies in whether "neighborhood character" or "social fabric" qualifies as a harm or a public good justifying restrictions on property rights in this specific case.

  ### Section 2: Points of Principled Disagreement (Stated Impartially)

  | # | Viewpoint A (Rawlsian Liberal)                                                                 | Viewpoint B (Communitarian)                                                                                                 |
  | :-- | :---------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------- |
  | **1** | **Primary Justification for STR Restrictions:** Restrictions require demonstrating a clear **harm** (nuisance, safety, market failure impacting affordable housing supply) or protection of a **recognized public good**. "Preserving character/social fabric" alone, absent such harm, constitutes the state imposing a majoritarian lifestyle preference on property owners. | **Primary Justification for STR Restrictions:** Protecting the **enduring residential character and social networks** of a neighborhood, understood as a **jointly produced collective good** cultivated over time by residents, constitutes a legitimate public interest justifying regulation, akin to protecting historical districts or cultural resources, even absent quantifiable "harm." |
  | **2** | **Nature of Neighborhood Character:** The character of a neighborhood is primarily the **aggregate result of individual choices** (where people choose to live, how they maintain property, how they interact voluntarily). It is not a collectively "owned" asset. Regulation to preserve it as-is inherently privileges current residents' preferences over newcomers or owners wishing to use property differently. | **Nature of Neighborhood Character:** The character of a neighborhood is **emergent** – arising from sustained patterns of interaction, shared investments, and collective norms over time. It is a **shared, context-dependent good** that residents contribute to and rely upon. Protecting it recognizes this social reality. |
  | **3** | **Coherence of State Neutrality:** Liberal neutrality is coherent as a **procedural commitment** to not using state power to favor or disfavor specific conceptions of the good life. Protecting rights and preventing harm *is* neutral because it creates a framework within which diverse conceptions can be pursued. Ignoring social context is not taking a side, it's refusing to take *any* substantive side. | **Coherence of State Neutrality:** Strict liberal neutrality is **impossible and illusory**. All laws and institutions embody some conception of the person and the good. Refusing to recognize the value of stable community life implicitly favors an individualistic, market-oriented conception and undermines the social bases necessary for any meaningful life. |
  | **4** | **Level of Scrutiny:** Local regulations impacting fundamental property rights require **strict scrutiny**. Justifications based on subjective preferences like "character" are insufficient unless tied to preventing concrete harm or protecting a clearly defined, non-substitutable public good. | **Level of Scrutiny:** Local governments, as democratic bodies close to the community, deserve **deference** in making nuanced judgments about what constitutes the public good and the protection of shared community assets like neighborhood character, provided core rights are not violated. |

  ### Section 3: Cruxes and Predictive Tests

  1.  **Crux: Is a neighborhood's "character/social fabric" a jointly produced collective good (like a commons) or merely the aggregate result of private choices?**
      *   **Test Case/Thought Experiment:** Imagine two physically identical neighborhoods built simultaneously.
          *   *Neighborhood A:* Residents move in, form active associations, organize block parties, establish norms (e.g., quiet after 10 pm maintained voluntarily), jointly fundraise for shared gardens, and have high retention over decades. Relationships are dense.
          *   *Neighborhood B:* Residents are highly transient, interact minimally, maintain only their own properties, have no associations or shared norms beyond basic laws, and turnover is constant.
          *   **Question:** Does Neighborhood A possess something valuable ("social fabric," "character") that Neighborhood B lacks, *beyond* the sum of its individual properties and residents? Is this value fundamentally *collective* in origin?
      *   **Viewpoint A Prediction:** The difference is solely in the aggregate of individual choices and actions. Neighborhood A has more voluntary interaction, but this doesn't create a collectively owned "good" the community can assert control over against individual property rights. The value is experienced individually, not jointly held.
      *   **Viewpoint B Prediction:** Yes, Neighborhood A demonstrably possesses a collectively generated and sustained social good – a network of trust, shared expectations, and mutual support – that is a product of long-term, interdependent action. This good is distinct from individual properties and can be damaged or lost by forces ignoring its collective nature (like mass STR conversion).

  2.  **Crux: Is state neutrality toward conceptions of the good life coherent, or is it itself a contested conception that favors certain ways of life?**
      *   **Test Case/Argument:** Consider zoning laws prohibiting all exterior religious symbols (nativity scenes, menorahs, Islamic crescents) in residential yards to maintain "neutrality" and "uniform streetscape character."
      *   **Viewpoint A Prediction:** This law **violates neutrality**. It actively disfavors conceptions of the good life that include public religious expression, privileging conceptions that value secular uniformity or specific aesthetic preferences. True neutrality requires allowing such expressions unless they cause harm (e.g., safety hazard). Protecting the right *to* express is neutral.
      *   **Viewpoint B Prediction:** This law **exemplifies the incoherence of strict neutrality**. It claims neutrality (no religion favored) but its *effect* is to impose a secular, privatized conception of religion. It demonstrates that *any* regulation (or lack thereof) inevitably shapes the social environment in ways that favor some lifestyles (e.g., secularism, strict conformity) over others (e.g., public religiosity). The choice is always *which* values the framework embodies.

  ### Section 4: Verbal Dispute Flag

  *   **"Neutrality":** A significant portion of the disagreement stems from differing interpretations of "neutrality." Viewpoint A understands it as **procedural non-endorsement** (the state doesn't *say* one good is better). Viewpoint B understands it as requiring **contextual fairness** (the state framework shouldn't *systematically disadvantage* certain goods reliant on social forms). Identifying this difference helps isolate the deeper disagreement about the nature of the state and society (Crux 2) from semantic confusion. This verbal aspect is removed from the Disagreements Table.

  ### Mediator's Closing Observation (Potential Hidden Agreement)

  *   Both viewpoints likely agree that **extreme outcomes are undesirable**. Viewpoint A would likely oppose a community using zoning to mandate a single religion or ban all non-conformist lifestyles. Viewpoint B would likely oppose a community being completely dissolved by market forces where no stable relationships can form. The core disagreement lies in where the legitimate balance point lies between individual property rights/contract freedom and the community's ability to sustain itself through collective regulation, particularly concerning the specific mechanism and justification of STR restrictions.
