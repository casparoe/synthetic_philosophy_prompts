prompt: |-
  I serve on the charter review commission of a mid-sized city (roughly 200,000 residents) that is revising who may vote in municipal elections, a question our state legislature has devolved to municipalities to decide for themselves. The commission is deadlocked along predictable lines, and we owe the city council a written recommendation within the month. I'd like you to draft the memo the commission could adopt, and I want the philosophical work done in earnest, not the usual pieties about the sanctity of the franchise.

  The relevant facts about our city: about one in eight residents is a noncitizen (a mix of legal permanent residents, people on temporary work visas, and an unknown number of undocumented residents); some 40,000 people commute in daily from neighboring towns, where their workplaces are regulated and taxed; the city hosts a university whose 25,000 students live on campus eight months a year and register to vote here or at home as they please; and the council is about to decide whether to build a waste-to-energy facility whose emissions will chiefly affect a downwind town whose residents cannot vote here at all.

  The blocs on the commission map onto three principles. The first holds that the demos consists of everyone subject to the city's laws and police power: every resident should vote, regardless of citizenship, documentation, or intended length of stay, but not commuters, who are subject where they live. The second holds that the demos consists of everyone whose important interests are affected by city decisions: that sweeps in the undocumented, but also the commuters, and, if the incinerator is any guide, the downwind town — and one commissioner keeps pointing out that the principle doesn't obviously stop at the county line or even the border. The third holds that the demos is a community of fate, a group with shared long-term commitments: only those who have thrown in their lot with the city for the long haul, which excludes the transient and perhaps even recent arrivals, but honors the franchise as something deeper than an interest-tracking device.

  Please draft the commission's memo: a concrete recommendation about eligibility for municipal elections, stated as a rule the election office could actually administer; the principle that drives it, applied honestly to our four hard cases (undocumented residents, commuters, students, the downwind town); a serious treatment of the strongest argument for the principle you reject, including the objection that whichever way we go we will be drawing a line that our own principle cannot justify; and a short concluding section on whether the city should adopt any supplementary mechanism — an affected-parties hearing, a cross-municipal compact, a proxy for future residents — to handle those our voting rule must leave out.
reasoning: |-
  Okay, the user is serving on a charter review commission for a mid-sized city and needs help drafting a memo to break a deadlock about municipal voting eligibility. The city has unique demographics: noncitizens make up about 12.5% of residents (including various immigration statuses), 40,000 commuters, 25,000 university students who are transient, and a pending decision about a waste facility affecting a neighboring town. The commission is divided into three philosophical blocs: residency-based voting (subject to laws), interest-based voting (affected parties), and community-of-fate voting (long-term commitment).

  First, I need to understand the core conflict. The user wants a principled recommendation that isn't just paying lip service to democratic ideals. They need a practical, administrable rule that addresses the four hard cases. The memo must include: a concrete voting rule, the driving principle applied to each case, a rebuttal of the strongest opposing argument, and supplementary mechanisms for excluded groups.

  The three principles each have valid points. Residency ensures enforceability but excludes affected non-residents. Interest-based is inclusive but administratively impossible. Community-of-fate emphasizes commitment but risks excluding legitimate stakeholders. The key tension is between administrative feasibility and philosophical consistency.

  For the recommendation, residency-based voting seems most viable. It's legally defensible, aligns with existing voter registration systems, and avoids the slippery slope of interest-based inclusion. But this means undocumented residents, commuters, students without residency intent, and downwind towns are excluded. 

  How to justify this? Emphasize that voting requires both stake and structure. While affected parties have legitimate interests, voting rights demand formal accountability mechanisms that only residency provides. The rebuttal should tackle the interest-based principle head-on: admitting all affected parties would collapse municipal democracy into unworkability, while residency creates a clear, defensible boundary.

  For supplementary mechanisms: affected-parties hearings for major projects (like the incinerator), cross-municipal compacts for regional issues, and youth councils for future residents. This softens the exclusion while keeping voting rights focused.

  The user's deeper need is likely legitimacy – they want a recommendation that feels ethically defensible yet practical. They're tired of ideological gridlock. The memo should acknowledge trade-offs honestly: no perfect solution exists, but residency balances principles with pragmatism best. Highlighting supplementary mechanisms shows awareness of the limitations without overcomplicating voting rights.

  Need to ensure the language stays philosophical yet actionable. Avoid academic jargon. Stress that the proposed rule builds on existing frameworks (voter registration) while expanding rights (to legal residents). For students, clarify that residency intent matters – those who consider the city home can vote. Undocumented residents present the hardest case; acknowledge their exclusion as a compromise for administrative viability.

  Finally, structure the memo to validate all perspectives before justifying the chosen principle. This builds consensus. Conclude by framing residency as the foundation, supplemented by other democratic tools for broader inclusion.
answer: |-
  **MEMORANDUM**  
  **TO:** City Council of [City Name]  
  **FROM:** Charter Review Commission  
  **SUBJECT:** Recommendation on Municipal Voting Eligibility  
  **DATE:** [Current Date]  

  ---

  ### **I. RECOMMENDATION**  
  The Commission recommends amending the City Charter to extend municipal voting rights to **all residents aged 18 or older who can demonstrate at least six months of continuous residency within city limits, regardless of U.S. citizenship status**. This includes legal permanent residents, temporary visa holders, refugees/asylees, and undocumented residents. Commuters, non-resident students, and non-residents affected by city decisions (e.g., the downwind town) remain excluded.  

  **Administrative Rule:**  
  - Voter registration requires proof of residency (e.g., lease, utility bill, state ID with city address) and a sworn affidavit of continuous residence for six months prior to the election.  
  - Noncitizens must attest to residency status but need not disclose immigration specifics.  
  - The City Election Office will verify residency through existing databases (e.g., utility records) and issue municipal-specific voter IDs.  

  ---

  ### **II. PRINCIPLE: RESIDENCY AS THE FOUNDATION OF THE DEMOS**  
  We ground eligibility in **residency** because it best captures the core democratic ideal that those *subject to a government’s coercive authority* must have a voice in its composition. Residents live under the city’s laws, pay local taxes (directly/indirectly), use its infrastructure, and face daily consequences of municipal decisions. This principle balances moral legitimacy, administrative feasibility, and democratic accountability.  

  **Application to Hard Cases:**  
  1. **Undocumented Residents**:  
     - *Included*. They are subject to policing, zoning laws, sanitation codes, and emergency services. Excluding them creates a governed class without voice—an untenable democratic deficit. Residency, not citizenship, defines their relationship to city power.  

  2. **Commuters**:  
     - *Excluded*. While economically tied to the city, they reside, vote, and are primarily governed elsewhere. Their interests are already mediated through their home municipalities and employers. Including them would dilute resident sovereignty.  

  3. **University Students**:  
     - *Conditionally included*. Students who establish six months of residency (i.e., lease an off-campus apartment, register a local address) are residents. Transient students (dorm residents without intent to stay) may self-exclude, as residency requires genuine habitation.  

  4. **Downwind Town Residents**:  
     - *Excluded*. While materially affected by decisions like the incinerator, they are not subject to the city’s general governance. Their interests must be addressed through intergovernmental cooperation, not voting rights (see Section IV).  

  ---

  ### **III. ENGAGING THE REJECTED PRINCIPLES**  
  #### **A. The Strongest Counterargument: The Affected Interests Principle**  
  The most compelling objection asserts that voting rights should extend to *all whose vital interests are impacted* by city decisions. This principle rightly highlights that:  
  - Commuters endure city traffic and pollution.  
  - The downwind town bears health risks from the incinerator.  
  - Excluding non-residents facing significant harm appears unjust.  

  #### **B. Why We Reject It**  
  While morally intuitive, this principle is administratively and philosophically unworkable for municipal elections:  
  1. **Boundary Problem**: "Affected interests" lack a limiting principle. Does a suburban commuter count? A supplier 100 miles away? A future generation harmed by climate policy? Municipalities cannot administer elections with indeterminate electorates.  
  2. **Dilution of Resident Sovereignty**: Granting votes to non-residents severs the link between *governance* and *accountability*. Residents alone bear the full weight of municipal failures (e.g., underfunded schools, decaying infrastructure).  
  3. **Double Representation**: Commuters may vote in their home towns *and* here, violating "one person, one vote."  
  4. **Practical Impossibility**: Quantifying "affected interests" would require subjective determinations (e.g., "How polluted is too polluted?"), inviting litigation and chaos.  

  **The Line-Drawing Objection**:  
  We acknowledge that *any* rule draws arbitrary lines. Residency excludes some deeply affected non-residents. However, residency is a bright, objective line rooted in democratic tradition and constitutional law. It avoids the slippery slope of interest-based expansion while ensuring the electorate is both *governed by* and *invested in* the community.  

  ---

  ### **IV. SUPPLEMENTARY MECHANISMS FOR EXCLUDED GROUPS**  
  To address legitimate interests excluded by our voting rule, we recommend:  
  1. **Affected-Parties Hearings**:  
     - Mandatory public hearings for projects with significant regional impacts (e.g., the waste-to-energy facility). Testimony from non-residents (commuters, downwind communities) must inform council decisions.  

  2. **Cross-Municipal Compacts**:  
     - Formal agreements with neighboring towns for joint committees on transit, pollution, and infrastructure. Downwind communities could negotiate mitigation funds or veto powers over high-impact projects.  

  3. **Future Residents Proxy**:  
     - Establish a youth council (<18 residents) to advise on long-term sustainability. Their input offsets the exclusion of future generations.  

  4. **Noncitizen Advisory Boards**:  
     - While noncitizens can vote under our rule, boards representing undocumented/transient groups ensure their voices are heard on specific issues (e.g., workers’ rights, tenant protections).  

  ---

  ### **V. CONCLUSION**  
  Our recommendation prioritizes a *democratically coherent* electorate: residents who experience the city as a shared space of rights and duties. It avoids the unadministrable breadth of the affected-interests model and the exclusionary rigidity of a community-of-fate standard. By tethering voting to residency, we honor the franchise as both a shield against oppression and a tool for collective self-rule—while using supplementary mechanisms to address broader impacts. The line we draw is clear, defensible, and executable.  

  Respectfully submitted,  
  The Charter Review Commission  

  ---  
  **APPENDIX**: Draft Charter Language  
  > "Section [X]. Eligibility to Vote in Municipal Elections. Every person who is a resident of the City for at least six months preceding an election, is at least eighteen years of age, and is registered to vote in accordance with City ordinances, shall be entitled to vote therein. Residency shall be determined by physical presence and intent to remain, without regard to United States citizenship or immigration status."
