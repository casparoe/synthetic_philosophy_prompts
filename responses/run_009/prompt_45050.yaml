prompt: |-
  I direct the clinical ethics consultation service at a large academic medical center, and a substantial share of my consults — several a month, arriving with hours to spare, families in crisis, clinicians wanting an answer rather than a seminar — turn on the same underlying question: what makes a person dead, and who gets to say so. Our institution follows the whole-brain standard under the model statute dating from the early 1980s, but my clinicians keep colliding with its philosophical fine print, and I need something more usable than "call ethics."

  The recurring collisions are these. First, families — often, though not always, on Orthodox Jewish or certain conservative Christian grounds — who hold that death is a cardiopulmonary event and cannot accept that a warm, pink, perfusing body with a beating heart is a dead person. Second, donation-after-circulatory-death cases, where death is declared minutes after the heart stops, which quietly trades on the gap between irreversibility (the heart cannot restart) and permanence (it will not restart because no one will attempt to restart it). Third, the kind of case the chronic-brain-death literature presses: patients maintained for months, and in a handful of documented cases longer, gestating a fetus, healing wounds, mounting fevers in response to infection — which makes it awkward to tell a bedside nurse that this is merely a corpse with artificially circulating blood.

  That last point deserves emphasis. The standard rationale for equating whole-brain death with death is that the brain integrates the body into a single organism, so that the destruction of the entire brain marks the loss of the organism as a whole. The well-known critique of this rationale, associated with the neurologist D. Alan Shewmon, argues that the somatic integration visible in these long-maintained patients persists without the brain, through non-neural routes; you need not accept his conclusion to notice that our staff notice the tension.

  Please write me a decision procedure my service can run repeatedly under real constraints. Specifically:

  - The questions to ask, in order, and what counts as a sufficient answer to each — enough to distinguish, at the bedside, a factual dispute (is the standard met? is the test valid?) from a conceptual one (is the standard the right one?) from a purely values question (what should be done given the determination?);
  - Where the procedure yields a determinate stop and hands the decision to a person, and it must be honest about which of its steps are judgment dressed up as procedure;
  - What it cannot settle and should not pretend to settle.

  Then run it on three consults: (a) a family citing religious law rejects the brain-death determination for their thirty-year-old son and demands that ventilation continue indefinitely; (b) a patient declared brain dead at twenty-two weeks' gestation, whose partner and parents all want somatic support continued toward fetal viability — a request the OB service is willing to honor, and which several of our ICU nurses find morally incoherent if she is already dead; (c) a surrogate authorizing donation after circulatory death who asks, in effect, how long we wait before calling it, and whether being sure enough means the heart could not restart or merely that no one will try.

  Include at least one case where the procedure delivers an answer I will not like, and say so plainly. And I do not need a reading list or case law survey — I need something that works at the bedside, reasoned from what is above.
reasoning: |-
  Okay, the user is a clinical ethics consultant dealing with frequent, urgent cases about defining death. They need a practical decision procedure to handle three common scenarios. Let me start by understanding their main pain points. They mention conflicts with families who reject brain death on religious grounds, issues around donation after circulatory death (DCD), and cases where brain-dead patients show somatic functions long-term. The key is to create a step-by-step process that distinguishes factual, conceptual, and values disputes.

  First, I need to outline a procedure that's efficient and clear. The user emphasized real-time constraints, so each step must be quick. The procedure should start by verifying if the legal standard is met, then check if the determination was done correctly. If those are satisfied, it moves to whether the standard itself is contested. Finally, if there's disagreement, it addresses what to do next. 

  For the cases, let's apply the procedure. Case A: Family rejects brain death based on religion. Step 1 confirms legal death, Step 2 checks the exam was proper. Since they accept the facts but not the concept, it stops at Step 3—conceptual dispute. The family's values require accommodation, so continuing support might be necessary despite legal death. 

  Case B: Pregnant patient, brain-dead, kept for fetal viability. Steps 1 and 2 are clear, leading to Step 3. Here, the staff's discomfort highlights a conceptual tension. The procedure forces a values decision: whether to prioritize the fetus. The answer might be unpopular but necessary. 

  Case C: DCD case. Step 1 isn't applicable since DCD isn't brain death. Step 2 checks permanence. The surrogate's question is about irreversibility vs. permanence. The procedure clarifies that permanence is sufficient, and the 5-minute wait is policy-based. 

  The user needs honesty about where judgment comes in, like in Step 3 and Step 4. Also, including an unpopular outcome in Case B shows the procedure's objectivity. They don't want theoretical debates but actionable steps. Making sure each case flows through the procedure without unnecessary complexity is crucial. Highlighting the limits, like not resolving deep conceptual disputes, maintains transparency. This should give them a tool to handle these cases systematically, reducing ad-hoc "call ethics" moments.
answer: |-
  Here is a bedside decision procedure for your ethics service, designed for speed, clarity, and honesty about its limits. It focuses on distinguishing the *type* of disagreement to guide action.

  **The Death Determination Dispute Resolution Procedure (DDDRP)**

  **Guiding Principle:** The procedure accepts the institution's *legal* standard (whole-brain death, WBD, per UDDA) as the operational baseline for clinical declaration. Its goal is to resolve disputes *around* that standard or its application, not to re-litigate the standard itself institutionally in the moment.

  **Steps (Run Sequentially, Stop at First Determinate Answer):**

  1.  **"Is the patient legally dead by the institutional standard (WBD) according to the formal determination process?"**
      *   **Question:** Has the legally mandated clinical examination/testing for WBD been completed *fully and correctly* according to hospital policy (including prerequisites like excluding confounders, apnea test performed correctly, appropriate confirmatory testing if used)?
      *   **Sufficient Answer:** YES (Formal determination completed correctly) or NO (Formal determination incomplete, incorrect, or prerequisites unmet).
      *   **Resolves:** Purely **factual/procedural dispute** about *meeting the existing standard*. If NO, the answer is "Patient is not legally dead yet under our standard; complete/redo the determination correctly." If YES, proceed to Step 2.
      *   **Judgment Dressed as Procedure?** Minimal. Relies on documented compliance with established policy/protocol. Ethics may need to verify documentation/process.

  2.  **"Is the validity of the WBD determination *itself* being challenged based on specific clinical findings in *this* patient?"**
      *   **Question:** Is there objective evidence *in this specific case* suggesting the formal determination might be invalid *even if performed correctly*? (e.g., unexplained spinal reflexes misinterpreted as brainstem activity, complex pharmacology confounding tests, unusual physiology casting doubt on test accuracy *for this patient*).
      *   **Sufficient Answer:** YES (Specific, credible clinical doubt exists *about this determination*) or NO (No specific credible clinical challenge to *this* determination exists; the findings are consistent with WBD).
      *   **Resolves:** **Factual dispute** about *the accuracy/interpretation of the tests in this specific instance*. If YES, the answer is "Pause declaration; seek urgent neurology/neurosurgery consult for expert review of *this specific determination's validity*." If NO, proceed to Step 3.
      *   **Judgment Dressed as Procedure?** Moderate. Requires assessing the *credibility and specificity* of the challenge against known WBD physiology. Ethics relies on clinical expertise but must discern genuine doubt from conceptual disagreement masquerading as clinical challenge.

  3.  **"Is the disagreement about the *concept* of death itself (i.e., rejecting WBD as a valid standard)?"**
      *   **Question:** Do the parties challenging the determination explicitly or implicitly reject the *principle* that irreversible loss of all brain functions constitutes death, regardless of the body's appearance or somatic functions? (e.g., citing religious belief that death requires cessation of heartbeat, philosophical belief in integration requiring a brain, discomfort with somatic integration in maintained bodies).
      *   **Sufficient Answer:** YES (The *concept* of WBD as death is rejected) or NO (The concept is accepted, but disagreement lies elsewhere - e.g., prognosis, treatment wishes).
      *   **Resolves:** **Conceptual dispute.** The procedure *cannot settle this*. If YES, the answer is: **"This is a conceptual disagreement. The patient is legally dead per institutional standard. The dispute now concerns appropriate management of the deceased patient's body, respecting relevant values and obligations."** Proceed to Step 4.
      *   **Judgment Dressed as Procedure?** High. Requires interpreting the *nature* of the objection (conceptual vs. factual/procedural vs. values about treatment). Ethics must listen carefully to the *basis* of the objection.

  4.  **"Given legal death (Step 1 & 2 confirmed) and a conceptual disagreement (Step 3 YES), what course of action best respects legal obligations, institutional policy, professional integrity, and relevant values (including religious/cultural) within feasible limits?"**
      *   **Question:** What are the specific requests/values in conflict? What are the legal/institutional constraints? What accommodations are materially feasible without violating core professional obligations or causing undue burden?
      *   **Sufficient Answer:** A specific, actionable plan for managing the body (e.g., "Continue mechanical ventilation for X hours/days while facilitating family acceptance/ritual," "Discontinue somatic support promptly per policy," "Continue somatic support for fetal gestation per agreed protocol").
      *   **Resolves:** **Values dispute about management of the body.** The answer is a negotiated or determined plan.
      *   **Judgment Dressed as Procedure?** High. This is pure ethical reasoning and negotiation, weighing competing values, obligations, and feasibility. The procedure provides the *framework* (legal death established, conceptual impasse acknowledged), but the *outcome* is judgment.

  **What the Procedure CANNOT Settle:**
  *   The fundamental philosophical/religious question: "What *truly* constitutes human death?" (Step 3 identifies this, doesn't resolve it).
  *   The validity of the WBD standard itself for the institution (assumed as legal baseline).
  *   Deep conflicts where no feasible accommodation respects core professional obligations (e.g., indefinite ventilation demanded without medical justification).

  ---

  **Running the Consults:**

  **Case A: Orthodox Jewish Family Rejects WBD for Son**
  1.  **Step 1:** WBD determination confirmed complete/correct per policy. YES → Proceed.
  2.  **Step 2:** No specific challenge to *this* determination's validity. Family accepts tests show no brain function, but rejects the concept. NO → Proceed.
  3.  **Step 3:** Explicit rejection of WBD concept based on religious law (death = cardiopulmonary arrest). YES → **CONCEPTUAL DISPUTE.** Patient legally dead. Dispute is about management.
  4.  **Step 4:** **Values Dispute Resolution:** Key values: Sanctity of life (as family defines it), bodily integrity of the deceased, religious obligations, resource use, professional integrity (not treating a corpse as a patient indefinitely). Feasibility: Ventilation possible short-term. Negotiation: Focus on time-limited continuation (e.g., 24-72 hours) for family to gather, consult rabbi, perform rituals, *while explicitly acknowledging legal death and framing ventilation as body preservation for ritual purposes, not life-sustaining treatment*. Goal: Facilitate acceptance and transition. **Answer:** Continue ventilation for [agreed timeframe] for family/ritual purposes, with clear documentation of legal death and plan for discontinuation if acceptance isn't reached. *Ethics facilitates negotiation; Medical Director/Admin may need to set limits.*

  **Case B: Pregnant Patient (22wks) Declared WBD, Somatic Support Continued for Fetus**
  1.  **Step 1:** WBD determination confirmed complete/correct per policy. YES → Proceed.
  2.  **Step 2:** No specific challenge to *this* determination's validity (persistent somatic integration is acknowledged but doesn't invalidate the *tests* showing absent brain function). NO → Proceed.
  3.  **Step 3:** ICU nurses' discomfort stems from the *concept* of WBD being death *in light of* somatic integration (gestation, healing, fever). This is a conceptual challenge to WBD itself. YES → **CONCEPTUAL DISPUTE.** Patient legally dead. Dispute is about management.
  4.  **Step 4:** **Values Dispute Resolution:** Key values: Potential life of fetus, wishes of partner/parents, dignity of the deceased mother, professional integrity of staff (discomfort treating a "corpse" as a patient), resource use. Feasibility: OB willing, somatic support technically possible. Institutional policy likely permits this. **Answer: (This is the answer you won't like, but the procedure dictates it)** Somatic support *can* ethically and legally be continued towards fetal viability as an extraordinary form of bodily preservation for the benefit of the fetus, *provided*:
      *   Clear documentation of legal death.
      *   Explicit consent from authorized surrogates understanding she is dead.
      *   A specific, feasible fetal viability goal and plan (e.g., 28 weeks?).
      *   A clear plan for delivery and cessation of somatic support at that point.
      *   Support for staff discomfort (acknowledging the conceptual tension is valid but stating the *legal and negotiated values-based* rationale for continuation). **Ethics must support the medical team in implementing this plan despite conceptual discomfort, or help negotiate discontinuation if surrogates/providers cannot proceed.**

  **Case C: Surrogate Asks About DCD Wait Time**
  *(Note: DCD operates under circulatory death standard, not brain death. Adjust Step 1 focus)*
  1.  **Step 1:** Applicable standard is Circulatory Death (irreversible cessation of circulatory/respiratory functions). **Question:** Has a *decision* to pursue DCD been made according to policy (consent, authorization, patient meeting criteria)? YES (Proceeding with DCD) → Proceed. *Focus shifts to the declaration moment.*
  2.  **Step 2:** **Question (Reframed for DCD):** Is the challenge about whether the *conditions for permanence* (no intervention) are met *at the time of planned withdrawal*? (e.g., Is the surrogate asking *before* withdrawal if permanence is truly assured? This is a challenge to the *preconditions*). **Sufficient Answer:** YES (Surrogate questioning pre-withdrawal permanence) or NO (Question is about the *wait time itself* post-withdrawal). *Assuming DCD protocol initiation is valid...*
      *   **Surrogate's Question:** "How long do we wait?" & "Irreversible vs Permanence?" → This is **NOT** challenging the validity of the *standard* (Circulatory Death) or the *preconditions* (decision for no resuscitation). It's seeking clarification of the *procedure*. → NO specific challenge to validity → Proceed to Step 3 *concept*? Not quite.
  3.  **Step 3 (Reframed):** The surrogate *accepts* circulatory cessation as death but questions the *timing/certainty* of declaring it irreversible/permanent. This is primarily a **factual/procedural dispute about the DCD protocol**, *not* a deep conceptual challenge to the circulatory standard itself. **Answer:** Explain the DCD protocol clearly:
      *   Death is declared based on the *irreversible* cessation of circulatory/respiratory functions.
      *   "Irreversible" means function cannot restart *spontaneously or through intervention*.
      *   In DCD, *permanence* (no intervention) makes cessation *irreversible* after a short interval where auto-resuscitation is impossible.
      *   The wait time (e.g., 5 min) is based on evidence that auto-resuscitation does not occur after this period following cessation *under conditions of permanence*. It is *not* waiting for the heart to be incapable of restarting *if shocked*; it's waiting long enough to be certain it *won't restart on its own* because it *can't* under these conditions.
      *   **Sufficient Answer:** "We wait [X] minutes because evidence shows the heart cannot restart on its own after that time following withdrawal of support under these conditions. We declare death at that point because circulatory function has irreversibly ceased. We do not attempt resuscitation because authorization for DCD requires accepting permanence (no intervention)." **This resolves the factual/procedural question within the DCD framework.** No need for Step 4.

  This procedure provides a structured path to quickly identify the *nature* of the conflict (factual error? conceptual rejection? values clash?) and directs action accordingly, while being transparent about its reliance on the legal standard and the inherent judgment calls, especially in Step 3 and 4. It prevents conflating conceptual debates with urgent bedside decisions about meeting standards or managing the body of the deceased.
