  For Fodor vs. Siegel: Fodor’s modularity would struggle with penetrator eligibility (he’d exclude beliefs/desires) but excel on strict controls. Siegel might accept weaker evidence (e.g., phenomenological reports) but better handle real-world cases. The higher price? Fodor—his rigidity might exclude genuine cases. 

