prompt: |-
  I'd like your credence that Turchin's structural-demographic theory has genuine forecasting power, by which I mean: the ability to issue, at time T, specific predictions about social instability at T plus ten years or more, that come true more often than a naive baseline — and not merely the ability to fit cycles onto the past after the fact. The theory, roughly, is that societies move through long cycles driven by elite overproduction, the immiseration of commoners, and state fiscal strain, and that when these variables cross certain thresholds, a period of elevated instability follows. Please decompose your number into the sub-questions it depends on: first, the probability that the proposed mechanisms are genuine causal drivers of political instability rather than correlated symptoms of some deeper process; second, the probability that, granting the mechanisms, they operate on timescales regular enough to support decade-ahead predictions; third, the probability that the theory's apparent anticipation of heightened instability in the 2010s and 2020s in the United States and Western Europe was a real out-of-sample success rather than a loosely specified claim vague enough to score as a hit either way; and any further terms you think belong in the decomposition, each with a number and a one-line justification. Then combine them into your overall credence, tell me which term the final number is most sensitive to, and describe the single piece of evidence — a certain kind of failed prediction, or a rival account that explains the same record without the cycles — that would move you most. Please respond in continuous prose only, with no headings, bullet points, bold text, or tables.
