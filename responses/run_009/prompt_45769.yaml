prompt: |-
  I've been reading rationalist blogs and forums since the Overcoming Bias days, and for most of that time my closest friend from that community has been slowly converging, over shared dinners and long comment threads, on a stable set of verdicts about when an individual's contribution to a collective harm is wrong. I now want to predict her verdict on a new case, and I'd like your help thinking it through.

  Her verdicts so far, with the reasons she gave where she gave reasons:

  1. Buying one chicken breast at a large supermarket: not wrong. Her purchase does not change how many birds are raised or slaughtered; the store reorders by the pallet.
  2. Buying chicken from the small butcher near her, who adjusts each day's order to the previous day's sales: wrong. There her single purchase plausibly shifts the number of birds ordered by one.
  3. Dropping a single bottle in a park that is already visibly littered: wrong. She insists this has nothing to do with whether her bottle changes whether the park is trashed; it is wrong because it free-rides on everyone else's restraint.
  4. Skipping a national election when she has only a mild preference: fine. Voting third party in a national election when she genuinely prefers the third-party candidate and only slightly prefers one major candidate to the other: also fine — she holds that a mild preference between the majors creates no strategic obligation, and she would tell anyone similarly situated to vote their conscience.
  5. Driving to work instead of taking a train twenty minutes slower: fine, on the same reasoning as the supermarket chicken.

  The new case is her town's council race. Polling and the margins in comparable races suggest the two major candidates will finish within a few dozen votes of each other. The third-party candidate she genuinely prefers polls around eight percent, and she slightly prefers one of the majors over the other. Will she vote third party with a clean conscience, or has her own pattern of verdicts trapped her into calling that vote wrong?

  Please do four things. First, lay out the candidate rules that fit her track record equally well — I can see at least a marginal-causation rule, on which only plausibly pivotal contributions are wrong, and a free-riding rule, on which contributing to a collective harm is wrong only when it exploits others' restraint — and consider whether some hybrid that treats elections differently from markets also fits. Second, say what each rule predicts about the council race. Third, give your best guess at her actual verdict, with your reasons for preferring that reading of her. Fourth, name the further case — the one you would pose to her over dinner — that would most cleanly separate the rules that currently fit her record, and state what each rule would predict about it.
reasoning: |-
  Hmm, the user presents an interesting ethical puzzle about predicting their friend's judgment on voting in a close local election. The friend has a consistent pattern of verdicts across various collective action scenarios, and now we need to apply that logic to a council race where the margin is extremely tight.

  Looking at the friend's track record, several principles emerge. In the supermarket chicken case, she sees no moral issue because individual purchases don't affect supply - it's about marginal causation. But at the small butcher, where orders adjust daily, her purchase does directly cause harm, making it wrong. The littering case introduces a different principle: free-riding on others' restraint makes it wrong regardless of impact. Voting gets nuanced treatment - she rejects strategic voting in national elections but might feel differently locally.

  For the council race prediction, the key tension is between the free-riding principle (which would condemn the third-party vote as exploiting others' strategic restraint) and the election-specific reasoning from her national voting verdict (which emphasizes conscience over strategy). The razor-thin margin complicates things - her vote might actually be pivotal here, unlike in national elections.

  I think she'll vote third party without guilt. Her voting logic seems consistent: she rejects strategic obligations based on mild preferences, and the scale difference between national and local elections doesn't appear in her reasoning. The littering analogy doesn't fully hold because voting involves expressive choice rather than tangible harm. Still, the pivotal possibility in this race creates tension - her butcher shop reasoning suggests she cares about actual causality when measurable.

  To resolve this, I'd propose a dinner question about a corporate boycott where individual impact is negligible but collective harm is clear. If she condemns participation while benefiting from others' restraint, that confirms free-riding dominates. If she permits it, marginal causation prevails. This cleanly separates the principles that are entangled in the voting case.

  The user seems deeply familiar with rationalist discourse - they're likely testing whether their friend maintains philosophical consistency across domains. Underneath is probably concern about whether ethical systems can handle real-world complexity without contradiction. My analysis should honor that sophistication while providing clear reasoning they can discuss with their friend.
answer: |-
  Based on your friend's pattern of verdicts, here's the analysis:

  ### 1. Candidate Rules Fitting Her Track Record
  Her judgments suggest two primary principles, with potential hybrids:

  *   **Rule A: Marginal Causation ("Pivotal Harm")**
      *   *Description:* An act is wrong only if it *plausibly causes* a discrete unit of harm (e.g., one more chicken killed, one more bottle littered, one vote changing the outcome).
      *   *Fit:* Explains 1 (no change in chicken orders), 2 (plausibly causes one more chicken order), 3 (**doesn't fit well** - she explicitly rejects causation as the reason!), 4 (votes unlikely to be pivotal nationally), 5 (no marginal impact on traffic/carbon).

  *   **Rule B: Free-Riding ("Restraint Exploitation")**
      *   *Description:* An act is wrong if it contributes to a harmful collective outcome *while benefiting from the restraint of others* who avoid that harm, regardless of marginal causation. Wrongness arises from exploiting the cooperative behavior of others for personal gain within a harmful system.
      *   *Fit:* Explains 1 (no restraint to exploit - system is impersonal, purchases don't rely on others *not* buying), 2 (butcher relies on daily adjustment - purchasing exploits the system's responsiveness, potentially built on others' restraint if demand is volatile), 3 (**perfect fit** - explicitly cites free-riding on others' restraint as the wrong), 4 (voting isn't seen as exploiting others' restraint; restraint isn't framed as relevant), 5 (similar to 1 - impersonal system, no reliance on others *not* driving).

  *   **Hybrid Rule C: Contextual Separation (Markets vs. Commons vs. Elections)**
      *   *Description:* Applies **Marginal Causation** to *market transactions* where impact is quantifiable (chicken, driving). Applies **Free-Riding** to *common-pool resources/the tragedy of the commons* (littering). Treats *elections* as a distinct domain where strategic obligations arise only if preferences are strong *and* one is clearly pivotal, otherwise conscience/vote expression is primary.
      *   *Fit:* Explains 1 & 5 (Market/Causation: No impact = OK), 2 (Market/Causation: Impact = Wrong), 3 (Commons/Free-Riding: Wrong regardless of impact), 4 (Elections: No strong preference/not pivotal = Conscience OK). This fits *all* given verdicts cleanly.

  ### 2. Predictions for the Council Race
  *   **Rule A (Marginal Causation):** **Voting 3rd party is WRONG.** The race is extremely close (within dozens of votes). Her vote for the 3rd party candidate, whom she genuinely prefers but who cannot win, *plausibly changes the outcome* by taking a vote away from the major candidate she slightly prefers over the other. Her vote could be pivotal in electing her *least* preferred candidate. This mirrors the butcher (direct, plausible impact).
  *   **Rule B (Free-Riding):** **Voting 3rd party is FINE (or at least not clearly wrong).** While contributing to a potentially bad outcome (the worse major winning), it's not clear she's *exploiting others' restraint*. Others aren't "restraining" themselves from voting 3rd party to enable a good outcome; they are strategically voting major to prevent the worst outcome. Her act isn't parasitic on a cooperative restraint system like litter avoidance. It's expressive voting in a strategic context.
  *   **Rule C (Contextual Separation - Elections):** **Voting 3rd party is FINE.** Her verdict on national elections (#4) establishes that in the election domain, a *mild preference* between the major candidates does *not* create a strategic obligation compelling enough to override voting for her genuine preference (the 3rd party). The *closeness* of this local race introduces a potential pivotalness factor absent nationally, but her stated principle (#4) focuses on the *strength* of preference ("mild preference... creates no strategic obligation"), not the likelihood of being pivotal. Closeness might heighten *stakes*, but her rule doesn't incorporate it as a trigger for obligation. The principle from #4 seems directly applicable: mild preference = vote conscience OK.

  ### 3. Best Guess at Her Actual Verdict & Reasoning
  **I predict she will vote 3rd party with a clean conscience. My reasons:**

  1.  **Dominance of Election Principle:** Her verdict on national elections (#4) is the most directly analogous and provides a clear, principled stance: a "mild preference" between majors negates any strategic obligation, freeing her to vote conscience. She explicitly extends this ("she would tell anyone similarly situated...").
  2.  **Rejection of Pivotalness as Sole Determinant:** Her littering verdict (#3) *explicitly rejects* marginal causation ("it has nothing to do with whether her bottle changes whether the park is trashed"). This strongly suggests Rule A (Marginal Causation) isn't her sole or primary driver. While the council race *is* plausibly pivotal, her election principle (#4) seems designed to override this concern when preferences are mild.
  3.  **Lack of Clear Free-Riding in Voting:** The littering case (#3) is the *only* one where she invokes free-riding. She doesn't frame voting in national elections (#4) or purchasing chicken/driving (#1, #2, #5) in these terms. Voting feels more like expressive participation than exploiting a system reliant on others' restraint. Strategic voting by others isn't "restraint" in the same way as *not littering*; it's active participation aimed at a different outcome.
  4.  **The Hybrid Rule C Fits Best:** Rule C cleanly accommodates *all* her verdicts without contradiction. Applying the election sub-rule from #4 to the council race is the most consistent extension of her established pattern. While the closeness is a wrinkle, her principle emphasizes preference strength over pivot probability.

  **Tension Point:** The butcher case (#2) shows she *does* care about marginal impact when it's clear and direct. The council race plausibly has that impact. However, her *explicit reasoning* in the analogous election case (#4) and the littering case (#3) prioritizing non-causative factors suggests the election principle will dominate this context. She separates domains.

  ### 4. The Crucial Follow-Up Case
  **The Case:** *Participating in a large-scale consumer boycott against a company with unethical practices. The boycott is highly visible and impactful collectively, but an individual's participation (e.g., you not buying their product) has no measurable effect on the company's bottom line or practices due to scale. You personally benefit from the lower prices/higher availability resulting from others' participation (their restraint in not buying). Is participating in the boycott morally obligatory, or is free-riding (not boycotting while benefiting) wrong?*

  *   **Why it Separates Rules:**
      *   **Rule A (Marginal Causation):** Predicts **NOT WRONG** to free-ride *or* **FINE** not to participate. Your individual action has no marginal impact on the harm (the company's practices). Like the supermarket chicken (#1).
      *   **Rule B (Free-Riding):** Predicts **WRONG** to free-ride (not participating while benefiting from others' restraint). You exploit the collective restraint (boycott participation) of others aimed at reducing harm, for your personal benefit, while contributing to the harm. Like littering (#3), but in a market context.
      *   **Rule C (Contextual Hybrid):** Prediction is **ambiguous/context-dependent** and reveals its internal boundaries. Does it see this as a *Market* transaction (Causation - Not Wrong) or a *Commons* action/collective action problem (Free-Riding - Wrong)? Her verdict here would show whether "free-riding wrongness" extends beyond physical commons like parks into coordinated market actions aimed at collective goods (ethical corporate behavior), or if markets are always governed by marginal causation.

  This case directly pits the core principles (Marginal Causation vs. Free-Riding) against each other in a scenario distinct from littering and voting, forcing a clarification on whether the free-riding wrongness is tied to physical commons or applies more broadly to collective actions exploiting restraint for harm reduction. Her answer would sharply differentiate between Rule A, Rule B, and the boundaries within Rule C.
