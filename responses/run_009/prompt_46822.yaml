prompt: |-
  My friend Nadia did her phd on medieval universities and now she has very strong opinions about whether historical periods are real things or stuff historians made up later, which she deploys mostly at parties. Her track record so far, from years of arguing with her:

  - the Middle Ages: real. she's fine with the fact that the name was invented by people who were basically rubbing it in (you guys are the middle, we're the rebirth), the period underneath it is a genuine thing.
  - the Renaissance: not real. a 19th-century invention, basically Burckhardt's doing, and underneath the label it's just several different things in several different places at several different times that got glued together afterwards.
  - the Scientific Revolution: real, even though almost nobody at the time knew they were in one and the label itself is basically 20th-century.
  - the Dark Ages: obviously not real, a polemical slander with nothing underneath it.
  - the twelfth-century renaissance: real. do not test her on this.
  - "early modern" as a period: a pure filing label. real as a drawer, not as a thing in the world.

  we're getting dinner next week and I want to walk in already knowing her rulings on three new ones: the Enlightenment, the Axial Age (the Jaspers one, the roughly-simultaneous Buddha / Confucius / Greek philosophy / Hebrew prophets business), and late antiquity (the Peter Brown era that the specialists use to replace the Dark Ages). Give me your best guess on each, but what I actually want is the rule she's running, because I can see at least two that fit everything above — something like real iff the underlying stuff changed in a genuinely discontinuous way, whoever named it, versus real iff the label picks out something that was causally a unit and not just a pile of loosely similar things — and I think those come apart on at least the Axial Age and maybe the Enlightenment. Also tell me what further case would cleanly split the rules that survive her new rulings, so I can spring it on her over dessert. My current candidate for that is the Industrial Revolution but I'm honestly not sure it does the job. One thing to keep in mind: she gets annoyed when I point out that the Renaissance humanists were plenty self-aware about reviving antiquity, so if that's supposed to matter to the rule, you'll need to explain why it doesn't wreck her verdict on it. She'll definately have a comeback ready for whatever you give me, so make it good.
