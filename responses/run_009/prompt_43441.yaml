answer: |-
  Your instincts are sharp. The core disagreement **isn't primarily verbal**, though language fuels the fire. It's a **clash of explanatory paradigms** rooted in a **hidden substantive question about the nature of representation and implementation in cognition**. Your coworker defends a *minimalist functionalism* ("If it maps inputs to outputs via physical processes, it computes"), while you defend a *representationalist structuralism* ("Computation requires specific machinery for manipulating discrete, stable symbols"). Both definitions are defensible but serve *different purposes*, and the real sticking point is whether the brain implements the *kind* of symbolic machinery essential for classical computation.

  Here's my committed diagnosis and resolution:

  1.  **The Minimalist Definition ("Everything Computes") is Technically True but Explanatorily Vacant:** Your rock example is perfect. Under an *extremely* broad physicalist interpretation (e.g., any physical system instantiates *some* computation), yes, rocks compute. But this reduces "computation" to "causation" and robs it of its power to explain *intelligence*. Its only utility is metaphysical: asserting that cognition is physically implementable. Your coworker likely finds comfort in this universality, but it dodges the crucial question: *What kind* of computation makes brains intelligent? This view conflates the *potential* for simulation (we *could* model a rock digitally) with the system *itself* performing computation.

  2.  **The Classical Symbolic Definition ("Stored-Program, Discrete Symbols") is Too Narrow and Misfits Biology:** Your "rigged definition" critique has merit. Insisting on von Neumann architecture, explicit stored programs, or perfectly discrete, noise-free symbols excludes:
      *   Analog computers (which genuinely compute, as you note).
      *   Modern neural networks running on noisy analog hardware (again, clearly computing).
      *   Connectionist models (which *can* exhibit complex behavior without classical symbols).
      *   The messy, continuous, stochastic, massively parallel, energy-efficient reality of biological neurons. Brains lack a clear CPU/memory split, a central clock, or stable addresses for symbols.

  3.  **The Hidden Substantive Question: Stable, Re-identifiable Representations:** **This is the crux.** The *genuine empirical question* buried under the verbal sparring is:
      > **Does the brain implement *stable, context-independent, functionally addressable representations* that are *manipulated* according to *composable rules*, or is cognition best described as the emergent dynamics of continuous, distributed patterns lacking persistent symbolic structure?**

      *   **The Classical Computationalist Hope:** Brains *do* have something akin to variables, data structures, and algorithms, even if implemented messily with neurons. Neural patterns *are* symbols, firing rates *are* discrete-ish, and cognitive operations *are* rule-governed manipulations. The "noise" is just implementation detail. (This underpins much classical cognitive science and GOFAI).
      *   **The Dynamical/Connectionist/Embodied Challenge:** Brains are fundamentally continuous, non-linear dynamical systems. "Representations" are temporary, distributed patterns of activation shaped by context, sensorimotor loops, and the body/environment. There are no stable internal symbols being shuffled around; there's pattern formation, transformation, and resonance. Describing this in computational language is often a useful *metaphor* or a high-level *description* of the emergent behavior, but it doesn't reflect the underlying mechanistic reality like it does in a digital computer. Cognition is more like fluid dynamics than executing LISP code.

  4.  **My Definite Call:** **The brain is *not* a computer in the classical, stored-program, discrete-symbol manipulation sense.** That model is a powerful human invention poorly matched to biological wetware. However, **the brain *does* perform computations in a broader sense – it processes information to produce adaptive behavior.** The key is recognizing *multiple valid levels of abstraction and types of computation*:
      *   **At the micro level (neurons/synapses):** It's primarily analog signal processing, electrochemical dynamics, and pattern matching. Computation here is closer to analog filtering or connectionist activation spreading.
      *   **At the meso/macro level (circuits, systems):** Higher-level functions (e.g., object recognition, planning, language) *can* sometimes be *usefully described* as computational processes involving representations and transformations. However, the *implementation* of these "representations" is likely distributed, dynamic, and context-dependent, not stable symbolic tokens in a global workspace. The "computation" is an emergent property of complex dynamics, not a step-by-step execution of a symbolic algorithm.

  5.  **What Counts as Progress? Moving Beyond the Binary Question:** The question "Is the brain a computer?" *is* bad because it forces a false dichotomy and distracts from productive inquiry. Instead, we should ask:
      *   **What computational *metaphors* are most *useful and productive* for understanding specific brain functions?** (e.g., Bayesian inference for perception, reinforcement learning for decision-making, dynamical systems for motor control).
      *   **At what levels of organization and for which cognitive functions do stable, re-identifiable representations demonstrably exist?** What is their neural code? How persistent and context-independent are they *really*? (Empirical work on memory engrams, neural decoding, etc., is key here).
      *   **How do continuous, stochastic neural dynamics give rise to cognitive phenomena that *appear* discrete and symbolic?** (e.g., categorical perception, decision boundaries).
      *   **What novel computational *principles* (beyond von Neumann and simple connectionism) best capture the brain's unique capabilities?** (e.g., predictive processing, free energy minimization, active inference, neuromorphic computing principles).

  **Progress looks like:**
  *   **Neuroscience:** Finding conclusive evidence *for or against* stable, addressable symbol-like representations in specific circuits (e.g., working memory, language areas). Developing better tools to decode the *actual representational format* used by the brain.
  *   **AI/CS:** Building artificial systems that match brain-like capabilities using *non-classical* architectures (e.g., spiking neural nets on neuromorphic hardware, hybrid analog/digital systems) and rigorously comparing their internal dynamics to brains.
  *   **Cognitive Science/Philosophy:** Developing formal frameworks for computation that bridge the gap between continuous dynamics and symbolic descriptions without presupposing one is more fundamental. Focusing on *explanatory power* for specific phenomena rather than global metaphysical claims.

  **The Resolution for Your Debate:** Tell your coworker: "You're right that neurons process information, so in a *very broad* sense, the brain computes. But if that's all we mean, then so does a thermostat, and the word loses its bite. The interesting question is *how* it computes. The evidence suggests it doesn't work like a stored-program digital computer shuffling stable symbols. It's more like a massively parallel, continuous, wet analog computer whose complex dynamics *sometimes* allow us to usefully describe its behavior *as if* it were manipulating symbols. The 'computer' metaphor is useful but incomplete and potentially misleading about the underlying mechanisms. Let's talk about *which specific computational models* best explain the cognitive tasks we're interested in."

  The debate hasn't moved because it was framed poorly. Progress lies in abandoning the oversimplified binary question and diving into the messy specifics of *how* information processing actually works in the brain.
