  We are given a summary of Galen Strawson's Basic Argument from a pop-philosophy book. The summary is:

  "When you act, you act because of how you are — your character, values, desires. But you can't be responsible for how you are, since you got that from heredity and environment long before you had any say in the matter. And even if you later try to reshape yourself, you only do that because of how you already were, which just pushes the problem back a step. Since determinism ensures things couldn't have gone any other way regardless, the conclusion is that no one is ever responsible for anything they do, so blame and punishment as retribution can never be justified."

  We are to break this down sentence by sentence (or claim by claim) and evaluate each part. We are also to check whether the final conclusion about punishment follows.

  I recall that Strawson's Basic Argument (also known as the "Impossibility Argument") is indeed an argument for the impossibility of moral responsibility. It is meant to work regardless of whether determinism is true or false. The core idea is that to be truly morally responsible for one's actions, one would have to be responsible for the way one is (at least in certain mental respects). But one cannot be responsible for the way one is because that would require an infinite regress of choices (or else an arbitrary starting point for which one isn't responsible).

  Let me break down the summary into claims:

  1. Claim: "When you act, you act because of how you are — your character, values, desires."
  2. Claim: "But you can't be responsible for how you are, since you got that from heredity and environment long before you had any say in the matter."
  3. Claim: "And even if you later try to reshape yourself, you only do that because of how you already were, which just pushes the problem back a step."
  4. Claim: "Since determinism ensures things couldn't have gone any other way regardless..."
  5. Claim: "... the conclusion is that no one is ever responsible for anything they do"
  6. Claim: "... so blame and punishment as retribution can never be justified."

  Now, we must note that Strawson's argument is typically presented without relying on determinism. In fact, he argues that even if indeterminism (like randomness) were true, it wouldn't help because random events don't make you responsible either.

  So, let's evaluate each claim:

  1. "When you act, you act because of how you are — your character, values, desires."
     - Verdict: Accurate, but note that Strawson would say this is true in a way that is required for moral responsibility. However, he doesn't require that the causation be deterministic. He might say that your actions are a result of how you are, and that for moral responsibility you must be responsible for how you are. This claim is a starting point that Strawson accepts.

  2. "But you can't be responsible for how you are, since you got that from heredity and environment long before you had any say in the matter."
     - Verdict: Oversimplified. Strawson does argue that you aren't responsible for how you are, but the reason isn't just heredity and environment. In fact, his argument is more general: even if you had a say in shaping yourself at some point, that shaping would have to be done by a prior self that you also aren't responsible for. The heredity and environment part is an example of how we get our initial makeup, but the argument doesn't depend on it. The real point is that we are never the ultimate cause of how we are. However, the book's phrasing might be seen as emphasizing the initial conditions, which is a common way to present it. But Strawson would object to the idea that the argument rests on heredity and environment because his regress argument goes deeper.

  3. "And even if you later try to reshape yourself, you only do that because of how you already were, which just pushes the problem back a step."
     - Verdict: Accurate. This is the core of the regress argument. Any attempt to change yourself is motivated by your prior state, so you aren't responsible for that change either.

  4. "Since determinism ensures things couldn't have gone any other way regardless..."
     - Verdict: Misleading. Strawson's Basic Argument is designed to work without determinism. He explicitly states that even if indeterminism is true, it doesn't help because random events don't confer responsibility. So this part is a misrepresentation because it makes the argument seem dependent on determinism, which it is not.

  5. "... the conclusion is that no one is ever responsible for anything they do"
     - Verdict: Accurate. This is indeed the conclusion of Strawson's argument.

  6. "... so blame and punishment as retribution can never be justified."
     - Verdict: Oversimplified. While Strawson does argue that moral responsibility (in the desert sense) is impossible, and thus retributive punishment (which requires desert) is unjustified, note that the argument is about moral responsibility in the sense of "basic desert". However, the book's phrasing might be too strong because it says "blame and punishment as retribution", which is correct if we are talking about retribution. But note that Strawson might allow for other justifications for punishment (like deterrence or rehabilitation) that don't require desert. The book says "as retribution", so that part is okay, but the connection might be too quick.

  Now, for the final part: does the conclusion about punishment follow? The argument is about moral responsibility in the sense that is required for retribution. So if no one is morally responsible in that sense, then retributive punishment is indeed unjustified. But note that the argument does not rule out consequentialist justifications.

  However, the book's summary introduced determinism in step 4, which is not part of Strawson's argument. So if we remove that, the rest of the argument (without determinism) still leads to the conclusion that no one is morally responsible. Therefore, the punishment conclusion (about retribution) does follow from the accurate parts.

  But note: the book's step 4 is misleading and not part of Strawson's argument. The accurate core of the argument (claims 1-3 and 5) without determinism still stands and leads to the conclusion of no moral responsibility. So the punishment conclusion (6) follows from that.

