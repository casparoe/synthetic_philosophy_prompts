prompt: |-
  So a bit of context: I'm taking an intro-ish philosophy course as an elective (I'm a psych major) and we just hit the free will unit. My friend gave me a pop-philosophy book about determinism to read over break, and in one chapter it sums up Galen Strawson's so-called Basic Argument roughly like this: "When you act, you act because of how you are — your character, values, desires. But you can't be responsible for how you are, since you got that from heredity and environment long before you had any say in the matter. And even if you later try to reshape yourself, you only do that because of how you already were, which just pushes the problem back a step. Since determinism ensures things couldn't have gone any other way regardless, the conclusion is that no one is ever responsible for anything they do, so blame and punishment as retribution can never be justified." My TA said pop books mangle this stuff all the time, and something about it does feel off to me — I have a vague memory of hearing that this particular argument is supposed to work even if determinism is FALSE, like even if choices were partly random it wouldn't help, but I might be mixing that up with some other argument I read about. I don't want to just assume the book is sloppy though, since the author has a philosophy PhD.

  Could you go through the summary basically sentence by sentence and tell me which parts Strawson would actually sign off on, which are harmless simplifications a philosopher would let slide, and which are misrepresentations of things he explicitly says? I'm especially unsure whether the "heredity and environment" bit and the determinism bit are doing real work in his argument or whether the book is grafting a different argument onto his. And then separately: does the final step about punishment actually follow from whatever parts of the summary are accurate, or is the book sneaking in a stronger conclusion than the argument gives it?

