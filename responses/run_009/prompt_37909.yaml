  But wait: the book says "blame and punishment as retribution" so it is specifically about retribution. That is accurate to Strawson. However, the connection from the argument to this conclusion is valid only if we accept that retribution requires moral responsibility. That is standard. But note that the book's step 4 (determinism) is misleading and not part of the argument. Without step 4, the argument still holds and leads to claim 5, and then claim 6 follows.

