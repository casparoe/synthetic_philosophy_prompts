  ## Austin in Earnest: Testing Felicity Conditions in Wilde's Laboratory

  **Purpose:** This handout explores J.L. Austin's speech act theory, specifically the felicity conditions for performative utterances, through Oscar Wilde's *The Importance of Being Earnest*. Wilde’s play, written decades before Austin’s lectures, functions as an unintentional laboratory where these conditions are systematically bent, broken, or circumvented, yet the performatives often "work" within the play's social world. We'll analyze key scenes to probe the robustness, necessity, and social nature of Austin's conditions.

  **Austin's Core Framework (Settled Concepts):**
  *   **Performative Utterance:** An utterance that *does* something (e.g., promising, baptizing, marrying, betting) rather than merely describing something true or false.
  *   **Felicity Conditions:** Rules that must be met for a performative to be successful ("happy"), not just uttered.
      *   **(A.1) Convention:** There must exist an accepted conventional procedure having a conventional effect.
      *   **(A.2) Participants & Circumstances:** The particular persons and circumstances must be appropriate for the invocation of the procedure.
      *   **(B.1) Procedure Execution:** The procedure must be executed correctly and completely.
      *   **(B.2) Intention:** The persons must have the requisite thoughts, feelings, and intentions.
      *   **(Г.1) Subsequent Conduct:** The participants must actually so conduct themselves subsequently.
  *   **Misfire (Infelicities A, B):** If conditions A.1, A.2, B.1, or B.2 fail, the act is *void* – it doesn't come off at all (e.g., a layperson attempting to baptize without authority).
  *   **Abuse (Infelicity Г):** If Г.1 fails (subsequent conduct doesn't match), the act *is* performed but is *hollow* or *insincere* (e.g., promising without intending to keep it).

  **Wilde's Laboratory: Scenes Under Analysis**

  **1. The Premise: Baptism, Essence, and the Handbag Revelation**

  *   **The Violation:** Jack resolves to be *rechristened* "Ernest" to satisfy Gwendolen's demand to marry only an Ernest. Baptism is Austin's paradigmatic performative (A.1 convention exists). However, Jack intends to undergo the ceremony (B.1 execution) *precisely because* he believes his current name ("Jack") is his "real" or essential name. He seeks to *change* that essence via performative. This potentially violates **A.2 (Appropriateness)** – is the *intention* behind seeking baptism (to deceive, to fulfill a romantic precondition) appropriate? More fundamentally, it questions the performative's power: does it *confer* a name, or merely recognize a pre-existing essence?
  *   **The Twist:** The rechristening never happens. Jack discovers he *was* named Ernest at birth. This revelation comes via Miss Prism's testimony and the material evidence of the handbag, not through any performative act.
  *   **Austin vs. Wilde: Contested Interpretations:**
      *   **Dramatizing or Mocking?** Wilde is likely *mocking* the social weight placed on names and the rituals surrounding them. Jack’s frantic desire for rechristening highlights the absurdity of Gwendolen’s condition. The "Ernest" fixation is a social performance masking deeper desires/absurdities.
      *   **The Revelation's Meaning:** The ending **reveals the performative was never needed** for Jack’s *identity*. His "true" name was Ernest – a fact discovered, not made. This seems to prioritize an essentialist view *over* the performative one.
      *   **But... Does it Repair or Render Obsolete?** Crucially, the *social recognition* of Jack *as* Ernest still depends on **testimony and evidence** (Miss Prism, the handbag). This testimony *itself* functions performatively within the social context – it successfully convinces Lady Bracknell and Gwendolen, altering Jack's social status and enabling the marriage. **The key contested point:** Does Wilde ultimately show that social identity *is* performative (reliant on acts like testimony and acceptance, even when referencing a "truth"), or does he affirm an essential identity that performatives merely reflect? The revelation arrives via non-baptismal performatives (assertions, admissions) that gain authority through convention and circumstance (A.1, A.2).
  *   **Takeaway:** Wilde exposes the tension between performative naming and essentialist identity. The play suggests social identity *requires* performative acts of recognition and testimony (like Lady Bracknell’s eventual acceptance), even when seemingly grounded in "fact." The baptismal performative becomes unnecessary only because other performative acts (testimony) achieve the same social effect based on the revealed past.

  **2. Cecily's Diary: Manufacturing the Past**

  *   **The Violation:** Cecily has written a fictionalized engagement to "Ernest" (Algernon) in her diary *before meeting him*, complete with a broken engagement, reconciliation, ring, and love letters. When Algernon arrives, she treats this fiction as fact. She purports to *record* past events, but her writing *creates* the "facts" of the relationship within her world.
  *   **Austin's Challenge:** Is this a performative? If so, it spectacularly violates **A.2 (Appropriate Persons/Circumstances)** – Cecily is not authorized to unilaterally create engagements. It violates **B.2 (Intention)** – she knows it's fictional when written. It potentially violates **A.1 (Convention)** – is writing in a private diary an accepted procedure for betrothal?
  *   **Honest Verdict:** This is **not a counterexample to Austin's core claims about performatives in standard contexts.** Austin focuses on acts like marrying, promising, baptizing – institutional acts with clear conventions. Cecily's diary belongs to different categories:
      1.  **Fiction/Language Game:** Cecily is engaging in a private fantasy or language game. Within the *frame* of her diary, the "engagement" exists, but this frame lacks the conventional force to bind others in reality. Austin distinguishes performatives from fictional or "non-serious" utterances (*How to Do Things*, Lecture II).
      2.  **Inscription as Social Tool:** However, when Cecily presents the diary *to Algernon* as evidence of their history, it becomes something else. Her *act of presenting it* is an assertive performative ("We are engaged") backed by the "document." Algernon's *acceptance* ("I have not the smallest intention of apologising... I love you Cecily") is the crucial moment. **His performative utterance (a promise/acceptance) retroactively validates the fiction within their shared social interaction.** The diary isn't the performative; it's a prop that facilitates the *actual* performative exchange between Cecily and Algernon. The "manufactured past" only gains social reality through Algernon's willing participation in the performance.
  *   **Takeaway:** The scene brilliantly shows how **inscription and fiction can be leveraged within social interaction to *enable* conventional performatives.** The diary itself isn't the misfiring performative; it's the catalyst for Algernon's felicitous (if absurdly motivated) acceptance of the engagement.

  **3. The Sincerity Condition: Does Anyone Mean Anything?**

  *   **The Violation:** Insincerity is rampant: Algernon's Bunburying (fake illness), Jack's fictional brother Ernest, Gwendolen and Cecily's diary entries and vows based on the name "Ernest," even the titular virtue of "earnestness" is consistently undercut by triviality and deception. Promises (like engagements) are made without clear intention to fulfill them *as conventionally understood*. This flouts Austin's **B.2 (Intention)** and **Г.1 (Subsequent Conduct)** conditions, classifying them as *abuses*.
  *   **Yet Performatives "Succeed":** Engagements are formed, confessions (of deception) are made and accepted, marriages are planned. Within the play's world, these acts *do* have conventional effects: relationships are defined, conflicts arise, resolutions are reached.
  *   **Two Readings - Which is Better Supported?**
      *   **Reading 1: Sincerity is not a genuine felicity condition.** Performatives work based *solely* on convention and outward form (A.1, B.1). Intention is irrelevant; the social machinery operates on the utterance itself.
      *   **Reading 2: Insincerity is undetectable and irrelevant in this society.** As long as the *form* is correct and the insincerity remains hidden or unchallenged, the performative functions. Society doesn't *care* about genuine intention, only the maintenance of appearances.
  *   **Textual Support & Austin's Response:** **Reading 2 is overwhelmingly better supported.**
      *   The play is a satire of Victorian hypocrisy, where *appearing* earnest matters infinitely more than *being* earnest. Success depends on maintaining the facade (Algernon & Jack's deceptions, the women's adherence to the "Ernest" ideal).
      *   When insincerity *is* detected (e.g., both "Ernests" are exposed as frauds), the engagements *do* misfire – Gwendolen and Cecily initially reject Jack and Algernon. The performatives *require* the illusion of sincerity (or its social equivalent, like a suitable name) to function. Only when new justifications are found (Cecily forgiving Algernon instantly, Jack's discovery of his "true" name) are the engagements re-secured.
      *   **Austin's Likely View:** Austin would likely argue the initial engagements *were* abuses (hollow promises) because of the insincerity. They misfired when the insincerity became known. The eventual resolutions might represent *new*, possibly more sincere (or at least mutually understood) performatives ("I love you anyway" moments). Austin distinguishes misfires (act void) from abuses (act performed but flawed). The play shows abuses persisting *only* when the flaw remains concealed by social convention or charm. **Sincerity (B.2) *is* a condition; the play shows a world where its absence is systematically ignored or papered over, making abuses the norm until exposed.**

  **4. Lady Bracknell: Gatekeeper and Performer**

  *   **The Scene:** Bracknell's interrogation of Jack is a rigorous assessment of his suitability as Gwendolen's husband, focusing on lineage, property, and social standing ("principles").
  *   **Austin's Lens:** This directly engages **A.2 (Appropriate Persons/Circumstances)**. Bracknell acts as the arbiter of whether Jack meets the conventional requirements for the performative act of marriage (or engagement) within their social class. Her questions probe his qualifications to be a felicitous participant.
  *   **Are Her Verdicts Performative?** Absolutely. When Bracknell declares Jack's lineage "a matter of grave concern" or later, upon learning of his inheritance, declares Cecily a "most attractive young lady," she is **exercising verdictive authority** (a category Austin identifies). Her pronouncements *define* Jack's social eligibility within the context of marriage negotiations. "You can hardly imagine that I and Lord Bracknell would dream of allowing our only daughter... to marry into a cloak-room, and form an alliance with a parcel?" is a performative rejection. Her "Yes" to Cecily/Algernon after learning of Cecily's fortune is a performative approval. She wields the power to declare suitability.
  *   **The Expert on Felicity?** Bracknell is certainly the play's most *rigorous* and *explicit* enforcer of conventional felicity conditions, particularly A.2. She understands the social conventions (A.1) and meticulously checks participant qualifications. **However, her expertise is solely in *social* felicity, not linguistic or philosophical felicity.** Her criteria (wealth, lineage, style) are those of her class, not Austin's broader framework. She ignores sincerity (B.2) entirely if other conditions are met (witness her instant approval of Cecily based on money). She is an expert in *her society's specific* felicity conditions for marriageability, wielding performative verdictive power based on that narrow expertise. She embodies the social machinery Austin's conditions describe.

  **Where the Lens Fits (and Where it Strains)**

  *   **Illuminations:**
      *   The play vividly dramatizes the **social embeddedness** of performatives. Their success depends entirely on convention, context, and the power dynamics within the specific social world Wilde depicts.
      *   It exposes how **form can trump substance** (sincerity, truth) in upholding performative acts, provided the infelicities remain unchallenged.
      *   It showcases **verdictive authority** (Bracknell) and how **inscription/fiction** can be instrumentalized within performative exchanges (Cecily’s diary).
      *   It raises profound questions about **identity construction** through naming and recognition, directly engaging with the power and limits of performatives like baptism.
  *   **Strains and Anachronism:**
      *   **Primary Target:** Wilde's primary aim was satire – lampooning Victorian social hypocrisy, superficiality, and the cult of "earnestness." Applying Austin is inherently anachronistic and risks over-intellectualizing Wilde's comedic and social critique. The play isn't *about* speech acts.
      *   **Sincerity vs. Earnestness:** Wilde mocks "earnestness" as a social virtue – a performance of morality and seriousness. Austin's "sincerity" (B.2) is a linguistic condition for specific acts like promising. The concepts overlap but aren't identical. Wilde's satire targets the *social performance*, not necessarily the linguistic condition.
      *   **Beyond Austin's Taxonomy:** The play explores themes Austin doesn't centrally address:
          *   The **aesthetic dimension** of social performance (style, wit, charm as enabling infelicities).
          *   The **psychology of self-deception** and living within fictions (Bunburying, diary fantasies).
          *   The **material basis** of social power (Bracknell's criteria) that underpins the authority to perform verdictives.
  *   **Resources Lacking? (Later Developments):**
      *   **The "Non-Serious":** While Austin notes "non-serious" utterances, Wilde’s characters often inhabit a space between serious and non-serious. Later theorists (like Searle on fiction) might offer finer tools for Cecily's diary or Algernon's Bunburying excuses.
      *   **Illocutionary Force & Uptake:** The play highlights how the *reception* and *uptake* by the hearer (Gwendolen accepting Jack-as-Ernest, Algernon accepting the diary) is crucial for the performative's success, a point Austin notes but later theorists (like Searle) emphasize more. Wilde shows felicity often depends on the hearer's *willingness to play along*.
      *   **Performativity of Identity:** Judith Butler's later work on the performative construction of gender and identity resonates strongly with the "Ernest" obsession and the characters' fluid self-presentations, pushing beyond Austin's focus on discrete speech acts.

  **Conclusion for Discussion:**

  Wilde’s *The Importance of Being Earnest* provides a remarkably fertile, if unintentional, testing ground for Austin’s felicity conditions. While written for satire, the play systematically demonstrates:

  1.  Performatives *can* achieve conventional effects despite violations of sincerity (B.2) or appropriateness (A.2) **if the infelicity remains socially invisible or acceptable within the specific context.**
  2.  **Social convention and the power to define appropriateness (A.2) are paramount**, often overriding truth or genuine intention. Lady Bracknell embodies this.
  3.  **Form and inscription** can be powerful tools for enabling performatives, even when divorced from fact (Cecily's diary).
  4.  The **discovery vs. performative conferral** of identity (Jack/Ernest) reveals the complex interplay between essentialist notions and the performative acts of recognition and testimony required for social identity.

  However, the Austinian lens is just that – a lens. It illuminates aspects of the play's social mechanics brilliantly, revealing how language acts within Wilde's world. But it risks obscuring Wilde's primary goal: a devastatingly witty critique of the hypocrisy underlying Victorian social rituals. The play shows us a world where performatives *work* not because felicity conditions are invalid, but because the society depicted is built on tolerating, even demanding, their abuse. The marriages proceed not *despite* the insincerity, but *because* the characters, having navigated the social rules (often by breaking them charmingly), ultimately conform to the outward forms society requires. Wilde's genius lies in showing the absurdity of a world where felicity is measured by style rather than substance. Austin gives us the tools to dissect the machinery; Wilde shows us the farce it produces.
