prompt: |-
  I do analytics at a mid-sized e-commerce company and in a couple weeks I've got 25 minutes at our quarterly all-hands to explain Simpson's paradox to about sixty people -- mostly marketing and ops managers, a couple of engineers, nobody with real stats training. The trigger is an actual fight we just had: our new checkout flow beats the old one in overall conversion (7.9% vs 7.1%, the dashboard everyone sees), but when you split by device type it loses on desktop, loses on mobile web, and loses on tablet. The catch is that the new flow was rolled out through our app-first markets first, so a much bigger share of its traffic came from app users, who convert at triple the rate of everyone else. Two VPs are currently citing the two different numbers at each other in meetings, and my job is to get the room to actually understand what's going on before someone makes a decision off the aggregate.

  Don't explain it to me, I get the math fine -- I need a plan for explaining it to THEM. What has to be established first before the reversal itself can land (I'm guessing raw rates vs counts, since a few of them will be rusty even on percentages vs absolute numbers), what single concrete scenario should carry the whole 25 minutes (I can keep building on the checkout example all the way through, or start with something totally different and only then reveal the dashboard fight -- which is better and why), and what I should openly refuse to cover. The misconceptions I'm bracing for: "the aggregate is just fake / someone's lying," "small sample noise, ignore it," and the one I think is most dangerous here -- "whenever you disaggregate and the answer flips, the disaggregated answer is the real one." I half suspect that last belief is wrong in some cases and right in others depending on what's causing the split, but I'm not confident enough to teach it cleanly, so tell me if it belongs in the talk or in the "too much for this room" pile.

  Also: the room will have the guy who took one stats course and will want to talk about p-values, and the COO who only ever asks "so which number do I put in the deck?" Plan for where in the sequence each of those gets absorbed. And give me one question I can ask at the end that would actually show me whether the room understands the thing itself and not just the story I told about it -- the risk is they walk out thinking Simpson's paradox is "that checkout thing that happened" rather than a general trap. It's 25 minutes with a projector and no whiteboard btw, so whatever example carries it has to work as slides.
