  ### Teaching Simpson's Paradox to Non-Technical Stakeholders: A 25-Minute Plan  
  **Goal:** Make 60 non-stats managers *understand why aggregate and disaggregated metrics conflict*, without drowning in math. Use your checkout example as the anchor—it’s relatable and high-stakes.

  ---

  ### **Step-by-Step Sequence (25 Min Total)**  
  **Key Principle:** Build intuition FIRST, then reveal the paradox. Start concrete, then generalize.  
  **Tools:** Projector slides (no whiteboard). Use simple tables, bold contrasts, and minimal text.

  #### **1. Set the Stage: The VP Fight (3 Min)**  
  - **Slide 1:** Hook with the conflict.  
    > *"Two VPs are using different numbers to argue about our new checkout flow.  
    > VP A: ‘New flow wins! 7.9% conversion vs 7.1%!’  
    > VP B: ‘No! It loses on desktop, mobile web, AND tablet!’  
    > Both are right. How?"*  
  - **Why this works:** Immediate tension. Everyone recognizes this fight. No jargon yet.

  #### **2. Foundational Concepts (5 Min)**  
  *(Crucial: Managers often confuse rates vs. counts. Fix this FIRST.)*  
  - **Slide 2:** "What Do These Numbers *Actually* Mean?"  
    - Show a simple table:  
      | Metric          | Old Flow | New Flow |  
      |-----------------|----------|----------|  
      | **Overall Conv** | 7.1%     | 7.9%     |  
      | **Desktop Conv** | 8.0%     | 7.0%     |  
      | **Mobile Conv**  | 6.0%     | 5.0%     |  
      | **Tablet Conv**  | 7.0%     | 6.0%     |  
    - **Key point:** "Conversion rate ≠ total conversions. A small group with high conversion can drag the average up, even if other groups do worse."  
  - **Slide 3:** "Why Traffic Mix Matters" (Intuition pump):  
    - *Analogy:* "If 1,000 people visit Store A (mostly teenagers who buy cheap items) and Store B (mostly adults who buy expensive items), Store B’s *average sale* might be higher—even if teens and adults individually spend more at Store A."  
    - **Punchline:** "The mix of customers changes the story."

  #### **3. Reveal the Paradox Using Your Checkout Example (7 Min)**  
  - **Slide 4:** "The Missing Piece: Device Mix"  
    - Table comparing traffic distribution:  
      | Device  | Old Flow Traffic | New Flow Traffic |  
      |---------|------------------|------------------|  
      | Desktop | 45%              | 15%              |  
      | Mobile  | 30%              | 10%              |  
      | Tablet  | 10%              | 5%               |  
      | **App** | **15%**          | **70%**          |  
    - **Bold:** "App users convert at **TRIPLE** the rate of others!"  
  - **Slide 5:** "Why the Aggregate *Looks* Better for New Flow"  
    - Simple math:  
      - Old Flow: `(0.15 traffic × 20% app conv) + (0.85 traffic × 5% non-app avg) = 7.1%`  
      - New Flow: `(0.70 × 20%) + (0.30 × 4%) = 7.9%` *(Use 4% as avg non-app conv for new flow)*  
    - **Visual:** Show how the giant blue "App" slice dominates the new flow pie chart.  
    - **Key Insight:** "The new flow got a turbo boost from app users—not because it’s better, but because rollout targeted app-heavy markets."

  #### **4. Name and Generalize (5 Min)**  
  - **Slide 6:** "This is Simpson’s Paradox"  
    - **Definition:** "When combining groups flips the trend you see *within* each group."  
    - **Why it happens:** "A hidden factor (here, **device type**) warps the aggregate by unevenly affecting the groups being compared."  
  - **Slide 7:** "The Real-World Trap"  
    - *Classic example:* "UC Berkeley gender bias case—men had higher overall admission rates, but women won in every department. Why? Women applied to harder departments."  
    - **Connect back:** "Like our checkout: rollout strategy (not the flow’s quality) skewed device mix."

  #### **5. Bust Misconceptions & Answer "Which Number?" (5 Min)**  
  - **Slide 8:** "What This Does NOT Mean"  
    - ❌ "The aggregate is fake." → **Truth:** Both numbers are real, but answer different questions.  
    - ❌ "Small samples cause this." → **Truth:** This is a systematic bias (rollout strategy), not noise.  
    - ❌ **"Disaggregated is always the real truth."** → **Truth:** (CRITICAL!) Disaggregated shows per-group performance, but aggregate predicts overall impact *if traffic mix stays the same*.  
  - **Slide 9:** "Which Number for the Deck?" (COO’s question)  
    - **Answer:**  
      - If rolling out globally: **Use the aggregate 7.9%** (it reflects real-world impact *given past device mix*).  
      - If optimizing per device: **Use the disaggregated rates** (e.g., don’t force mobile users into the new flow).  
    - **Better solution:** "Run a *fair test*: roll out both flows in the SAME mix of devices."

  ---

  ### **How to Handle Distractions**  
  - **Stats guy wanting p-values:** Smile and say: "That’s about statistical significance—important, but separate. Today we’re focusing on why the direction of results flipped. Grab me after!"  
  - **COO’s "which number?":** Defer until Slide 9. Then give the clear answer above.  

  ---

  ### **One Question to Test Understanding**  
  **Ask at the end:**  
  > *"Imagine we have two ads: Ad A has higher overall clicks. But when split by age groups (under 30, over 30), Ad B wins in both. What could explain this?"*  

  **Why it works:**  
  - Tests if they grasp the core mechanism (e.g., Ad A ran mostly to low-clicking teens, while Ad B targeted high-clicking adults).  
  - Prevents them from memorizing just the "checkout story"—it’s a *generalizable* trap.  

  ---

  ### **What to REFUSE to Cover**  
  1. **Math formulas:** No equations for weighted averages. Use visuals instead.  
  2. **Other causes of reversal:** (e.g., sampling error, nonlinear effects). Stick to your example’s "uneven grouping" cause.  
  3. **"When is disaggregated better?" nuances:** Beyond the simple rule above, it’s "too much for this room."  

  ---

  ### **Why This Works**  
  - **Starts with pain:** They’re invested in the VP fight.  
  - **Builds step-by-step:** Rates → mix effects → paradox → generalization.  
  - **Uses ONE anchor example:** No switching contexts. Your checkout story carries the whole talk.  
  - **Preempts landmines:** Directly tackles misconceptions.  
  - **Leaves them empowered:** They know how to spot/avoid the trap.  

  **Final note:** End with a simple "Simpson’s Paradox checklist":  
  1. Is there a hidden group? (e.g., device, market)  
  2. Does group distribution differ?  
  3. Does group performance differ?  
  If yes—pause!
