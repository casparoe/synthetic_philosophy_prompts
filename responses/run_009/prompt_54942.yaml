prompt: |-
  A member of my decision-theory reading group set out to defend Hofstadter's superrationality and ended with an argument that, if it works, seems to swallow the very idea it was meant to rescue. I cannot locate the false step, and I would like a careful diagnosis rather than a verdict on superrationality itself. Please write your answer in British English.

  Some background first, so that nothing depends on looking anything up. In Hofstadter's Platonia dilemma, an eccentric trillionaire gathers twenty people and promises a billion dollars to whichever of them is the only one to send him a telegram by noon the next day; if the telegrams number zero or more than one, nobody receives anything, and the players may not communicate. On the standard analysis, each player should send: sending weakly dominates not sending, since if nobody else sends it wins the billion, and in every other case it leaves the sender no worse off. So twenty conventionally rational players all send, the count comes to twenty, and everyone gets nothing. The superrationalist instead reasons that identical reasoners facing identical information reach identical conclusions, so that only common strategies are on offer; the best common strategy is for each player to send with probability 1/20, which works out to an expected payoff of roughly nineteen million dollars each. That result is what my friend set out to defend. His argument runs as follows.

  (1) A rational agent performs the act whose expected utility, conditional on everything the agent knows, is highest.

  (2) If I know that another agent reaches conclusions by the same reasoning I use, on the same information, then my reaching a conclusion is, for me, conclusive evidence that they reach it; and this holds not only for conclusions but for the acts those conclusions prescribe.

  (3) So in Platonia the twenty identical reasoners each randomise at 1/20 and each expects about nineteen million dollars, where twenty self-interested maximisers each send for sure and collectively get nothing. Superrationality is thereby vindicated, my friend says: same reasoning, better outcome, and with no causal claim anywhere in it — nobody's telegram makes anybody else send; it is only that one logic yields one answer.

  (4) But (2), he continues, is just an instance of evidential reasoning, and it cannot be stopped at perfect mirrors. If a stranger is ninety-five per cent likely to reason as I do, then my reaching a conclusion is strong evidence of his reaching it; at eighty per cent, somewhat weaker evidence; and there is no threshold at which evidential support snaps off. Every human is to some degree a mirror of every other.

  (5) Applying (1) with whatever evidence (4) licenses: in a one-shot prisoner's dilemma against a stranger known to resemble me in judgement, my settling on cooperation is evidence that he is settling on it too; conditional on my act, cooperation then maximises expected utility; so I should cooperate — and the same goes for anyone whose reasoning correlates with mine at all, in any game of this shape.

  (6) Therefore superrationality was never a distinctively game-theoretic idea: it is evidential decision theory applied to people who resemble you. And the implications run well beyond games. I should give to charity whenever my giving is evidence that similar people give; I should keep promises whenever my keeping them is evidence that similar people keep theirs; in general, my character is, evidentially speaking, everybody else's, and I am obliged to supply evidence about it in whatever way the conditional expected utilities dictate.

  My friend is pleased with (6) and has become an evidentialist. I am not pleased: (6) seems to prove too much. Yet every place I might draw a line looks bad to me. If I deny (4), I owe a principled difference between the perfect mirror and the ninety-five per cent mirror, and I do not have one; a boundary drawn exactly where the superrational payoff is computed looks gerrymandered to save the phenomenon. If I accept (4) and (5), I am left cooperating in one-shot prisoner's dilemmas with strangers, and I cannot see what restrains (6) from making my character a public good that I am obliged to manage for the sake of the evidence it emits. For what it is worth, I would most like to keep (3): the Platonia calculation strikes me as genuinely right, and the fact that twenty superrationalists come away roughly nineteen million dollars better off than twenty self-interested maximisers does not seem like an accident.

  So tell me: which step do you reject, and what does rejecting it cost? If the error lies in the passage from (3) to (5) — from identical reasoners to partial resemblance — name the difference that does the work there and explain why it is not gerrymandered. If the argument is sound as far as it goes, so that the real choice is between its premises rather than within its inference, set out the price of each way of paying, including the price my friend has accepted. And if you think the flaw is subtler than either of those — some shift between what my reasoning settles and what my act reveals — locate it precisely; I have a vague suspicion that the randomisation in (3) matters here, since in Platonia the shared reasoning prescribes a lottery rather than an act, but I cannot say why that should help, and I would rather know whether the suspicion is worth anything than be spared it.
reasoning: |-
  Hmm, the user is presenting a fascinating philosophical puzzle about superrationality from a decision theory reading group. They want me to carefully diagnose where their friend's argument goes wrong rather than simply judge superrationality itself. The core issue seems to be that a defense of Hofstadter's Platonia dilemma solution has expanded into a general evidential decision theory that makes character a "public good."

  Let me unpack this systematically. The friend's argument progresses from (1) standard expected utility maximization to (2) perfect mirror reasoning in Platonia, then (3) shows how superrationality yields better outcomes there. But at (4) it generalizes to partial resemblance cases, leading to (5) cooperation in one-shot PDs with strangers, and concludes with (6) sweeping implications for charity, promises etc.

  The user feels this proves too much but can't find where it breaks down. Their specific concerns: rejecting (4) seems unprincipled, accepting (5) leads to absurd moral demands, and they'd prefer to salvage (3)'s Platonia solution. They also wonder if randomization plays a key role.

  I think the flaw is in how evidence is conditioned at step (5). In Platonia (step 3), conditioning on "my reasoning settling on randomizing" gives evidence about others' reasoning because the strategy space is symmetric - everyone must independently implement the same mixed strategy. But in PD (step 5), conditioning on "my act of cooperating" isn't equivalent to conditioning on "my reasoning settling on cooperation" because the act reveals less information. Specifically:

  - In Platonia's randomization, the reasoning output (probability weights) is what matters, not the act outcome
  - But when I actually cooperate in PD, you don't know if this came from superrational reasoning or naivety
  - So the evidential link weakens when moving from reasoning processes to concrete actions

  This avoids gerrymandering because the distinction is structural: symmetric strategy spaces (like Platonia) force reasoning to be identical, whereas PD allows reasoning to diverge even with similar agents. The randomization in Platonia is crucial because it creates the symmetry that makes reasoning conclusive evidence. In PD without symmetric strategies, no such pressure exists.

  The cost? We must accept that superrationality only cleanly applies in fully symmetric games with identical reasoners. Partial resemblance cases become messy probabilistic calculations rather than categorical imperatives. But this saves Platonia while blocking the slippery slope to character-as-public-good.

  The user's suspicion about randomization was spot-on - I'll make sure to credit that insight. British English maintained throughout as requested.
answer: |-
  Your suspicion about the role of randomisation is astute—it points precisely to the flaw in the inference from (3) to (5). The argument founders on a **shift in what is being conditioned upon**: from conditioning on *the reasoning process* (which *is* symmetric in Platonia) to conditioning on *the act itself* (which is not symmetric in games like the Prisoner's Dilemma). This creates a critical disanalogy that your friend overlooks. I'll diagnose step by step, using British English throughout.

  ### **The Core Flaw: Misidentifying the "Evidence"**
  The error lies in **step (5)**, specifically in the claim:  
  > *"my settling on cooperation is evidence that he is settling on it too; conditional on my act, cooperation then maximises expected utility."*  

  Here, your friend conflates two distinct objects of evidence:  
  1. **Conditioning on the *conclusion of reasoning*** (e.g., "I have decided to randomise with *p* = 1/20").  
  2. **Conditioning on the *executed action*** (e.g., "I have sent the telegram" or "I have cooperated").  

  In Platonia **(step 3)**, superrationality works because all players condition on *the same reasoning output*. Since the *only rational common strategy* is symmetric randomisation, knowing "I have concluded that randomising at 1/20 is optimal" *entails* that others have too. The randomisation is **part of the reasoning prescription itself**—it is not merely an act but the *output of identical optimisation*. Crucially, the *act* (sending/not sending) is irrelevant until *after* the strategy is fixed.  

  In the Prisoner's Dilemma **(step 5)**, "settling on cooperation" is **not a symmetric equilibrium strategy**. Unlike Platonia, there is no single mixed strategy that all identical reasoners would independently adopt as optimal. If you condition on *your act* ("I cooperate"), this *reveals nothing certain* about the *reasoning* of the other player, even if they resemble you. Why?  

  ### **Why the Disanalogy Matters**
  1. **Platonia’s Unique Symmetry**:  
     - The game is *purely symmetric*: all players have identical roles, payoffs, and information. The *only* rational common strategy is symmetric randomisation.  
     - **Conditional on reasoning**: "I have determined that *p* = 1/20 maximises EU" → Evidence that others have too (as (2) states).  
     - **Not conditional on acts**: Your decision to randomise doesn’t require observing *your own action*. The randomness is prescribed *before* any action occurs.  

  2. **Prisoner’s Dilemma’s Asymmetry**:  
     - There is no symmetric mixed-strategy equilibrium that dominates mutual defection. Even with similar reasoners, your "settling on cooperation" **does not imply** they settle on the same.  
     - **Conditional on your act**: "I cooperate" *could* mean:  
       - You are superrational and believe they will too (rare, absent symmetry),  
       - You are irrational/naïve,  
       - You misjudged their resemblance to you.  
     - Crucially, *your action does not reveal your reasoning*. A stranger who "resembles you" might still defect because they doubt *your* resemblance to *them*. Unlike Platonia, there is no game-theoretic pressure forcing identical strategies.  

  ### **Why This Isn’t Gerrymandering**
  The distinction is **structural**, not arbitrary:  
  - **Symmetric Games (Platonia)**: Identical reasoners *must* adopt identical strategies to maximise EU. Randomisation is the *strategy itself*. Conditioning on reasoning provides conclusive evidence.  
  - **Asymmetric/Non-Symmetric Games (Prisoner's Dilemma)**: No unique optimal strategy exists for identical reasoners. Conditioning on your act provides *weak* evidence about others' acts—but **no evidence about their reasoning**, as multiple strategies (cooperate/defect) could be consistent with "resemblance".  

  This explains why **randomisation is crucial**: in Platonia, it creates the symmetry that makes reasoning evidence decisive. In pure coordination games without symmetry (e.g., PD), no such mechanism exists.  

  ### **The Costs of Rejecting Step (5)**
  1. **Cost to Your Friend’s Generalisation**:  
     - Superrationality *only* cleanly applies to symmetric games (like Platonia) where identical reasoners *must* coordinate on a unique mixed strategy. It cannot extend to PD or charity cases without additional (questionable) assumptions.  
     - Evidential Decision Theory (EDT) *alone* cannot justify cooperation in one-shot PDs. EDT says: *if* your cooperation is strong evidence theirs occurs, *then* cooperate. But in PD, your act provides **no reliable evidence** of theirs absent precommitment or symmetry.  

  2. **Cost to Your Preference for (3)**:  
     - None. Platonia remains vindicated because symmetry forces identical reasoning → identical randomisation → higher EU. Randomisation is not a "trick" but the *only rational response* under common knowledge of identicality.  

  3. **Cost to Denying (4)**:  
     - Unnecessary. You can accept that "resemblance" provides *some* evidence without conceding (5). For example:  
       - At 95% resemblance, your reasoning *slightly* increases the probability theirs matches—but in PD, this doesn’t make cooperation optimal, as defection *still* dominates if their act is independent.  
       - EDT requires conditioning on *all* information. In PD, the prior likelihood that strangers resemble you *and* condition on your acts is low—so EU(defect) > EU(cooperate).  

  ### **The Bigger Picture: What Restrains (6)?**
  (6) fails because it ignores **strategic uncertainty**. In games without symmetry:  
  - Your "character" (e.g., promise-keeping) is not a public good because your acts do not *reliably* signal similar acts by others.  
  - EDT only obliges you to manage evidence *where your act is a strong signal*. In charity cases, if your donation is evidence that *your doppelgänger donates*, but not that *others* do, then the expected impact is negligible.  

  ### **In Summary**  
  - **Reject**: Step (5), for conflating evidence about *reasoning* (conclusive in symmetric games) with evidence about *acts* (weak elsewhere).  
  - **Cost**: Superrationality is confined to symmetric dilemmas. EDT alone cannot justify cooperation in PD or turn character into a public good.  
  - **Saved**: Platonia (step 3), as its symmetry and randomisation strategy make reasoning evidence decisive.  
  - **No Gerrymander**: The distinction turns on game symmetry and whether conditioning on reasoning prescribes a unique strategy. This is principled: it appeals to decision-theoretic structure, not *ad hoc* thresholds.  

  Your suspicion about randomisation was correct—it is the linchpin. In Platonia, the mixed strategy *is* the rational conclusion, so conditioning on reasoning works. In PD, no such conclusion exists, so the inference collapses. The flaw is subtler than a premise error: it’s a misapplication of evidential conditioning across structurally distinct scenarios.
