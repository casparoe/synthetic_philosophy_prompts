prompt: |-
  I'm a PhD student (dissertation on peer disagreement, but I've TA'd a bunch of epistemology sections) and I'm grading midterms for an upper-level undergrad course on knowledge. One of the questions I wrote is the kind that looks boilerplate but actually forces you to keep two views straight: "Both epistemic contextualism and pragmatic encroachment (subject-sensitive invariantism) try to accommodate the fact that we attribute and withdraw knowledge as practical stakes change. Explain the difference between the two views, and describe a case — real or hypothetical — on which they give different verdicts about whether some knowledge attribution is true."

  I've got a stack of answers where most students did the expected thing (Stanley vs. DeRose, attributor's context vs. subject's stakes, etc.), but one answer reads smoothly and I keep going back and forth on it. Parts of it sound exactly right, and parts of it I *think* are subtly wrong, but it's written confidently enough that I don't trust my gut read, and I don't want to either reward slickness or punish a student for phrasing things differently than the lecture did. So I want a second pair of eyes. Please give me a letter grade (we use A/B/C/D/F with plusses and minuses) plus point-by-point comments specific enough that I could paste them into the rubric — like, quote the sentence, say what's right or wrong about it. The deliverable I need is the itemized assessment, not a general impression. Here's the answer, typed up as-is:

  "Contextualism and pragmatic encroachment both say that whether you know depends on more than just truth-related factors like evidence. The difference is about whose context matters. Contextualism, held by philosophers like Jason Stanley, says that 'knows' is context-sensitive like 'I' or 'tall': the standards that a knowledge attribution must meet are set by features of the attributor's conversational context, so if I say 'Bob knows the bank is open on Fridays,' whether that's true depends on how demanding the standards are in my conversation. Pragmatic encroachment, defended by Keith DeRose and also Fantl and McGrath, keeps 'knows' with a single invariant standard, but makes that standard partly practical: how much is at stake for the subject — how much their actions depend on being right — changes whether they know. So in DeRose's bank cases, the couple who urgently needs to deposit a check before leaving on a trip doesn't know the bank will be open, because their stakes are high, while the relaxed couple who could easily come back tomorrow does know. Since stakes are part of the subject's context, and context includes practical context, pragmatic encroachment is really just a special case of contextualism where the context that matters is the subject's rather than the attributor's. This means the two views always make the same predictions about the truth of any given knowledge attribution — they only disagree about the underlying mechanism. A case that could distinguish them would be one where the attributor's conversational standards and the subject's practical stakes come apart, e.g., a low-stakes speaker attributing knowledge to a high-stakes subject. But since the two views agree in all such cases, no such case can actually distinguish them, and the choice between the views is basically stylistic. Both views also avoid skepticism, since the skeptic can simply be told that in her high-stakes context she doesn't know, while we in ordinary contexts do."

  One thing I'll flag: the middle of the course was mostly on other stuff, so the students only had a couple lectures on this — I'm not expecting them to know the journal literature, but I did cover exactly this material in lecture and it's in the assigned readings, so the attributions and the disagreement stuff are fair game. How would you grade it and what would your comments be?
reasoning: |-
  Okay, I need to help a PhD student grade this undergraduate epistemology midterm answer. The question is about distinguishing epistemic contextualism and pragmatic encroachment, and the student's answer has some issues that need careful evaluation.

  First, I notice the student has swapped the standard philosopher attributions - they assign contextualism to Stanley and pragmatic encroachment to DeRose, when it's actually the reverse. This is a significant factual error that needs to be addressed. The mix-up suggests the student might be confused about the core positions of these key figures.

  The student's definition of contextualism is mostly correct - they properly identify that it makes "knows" context-sensitive based on the attributor's conversational context. That's good. But their description of pragmatic encroachment is problematic when they call it a "special case of contextualism." This fundamentally misunderstands the theoretical distinction - pragmatic encroachment maintains invariant semantics while making epistemic standards sensitive to practical stakes.

  The bank case example is correctly applied to pragmatic encroachment, but since it's attributed to the wrong philosopher (DeRose instead of Stanley), it creates confusion. The student's claim that both views always make the same predictions is demonstrably false - there are well-known cases where they diverge, like when attributor and subject contexts differ.

  The student's attempt to describe a distinguishing case shows they recognize the theoretical possibility of contexts coming apart, but they incorrectly conclude no actual case can distinguish the views. This misses the point of thought experiments like Cohen's airport case or Fantl & McGrath's train scenarios.

  For grading, this answer has both strengths and weaknesses. The structure is clear and the writing is confident, which might initially impress, but the substantive errors in attribution and theoretical understanding are serious. The most charitable interpretation is that the student grasped the surface concepts but confused the deeper distinctions.

  I think a B- is appropriate - it's above failing because the student demonstrates some understanding of the core ideas, but the significant errors prevent a higher grade. The comments should specifically point out the philosopher mix-up, the "special case" misconception, and the incorrect claim about identical predictions, while acknowledging what they got right about contextualism and the bank cases.
answer: |-
  Here's a granular assessment of the answer with suggested grade and specific comments:

  **Final Grade: B-**  
  *(Solid grasp of core concepts but significant errors in attribution, core distinctions, and implications)*

  **Point-by-Point Comments:**

  1.  **"Contextualism and pragmatic encroachment both say that whether you know depends on more than just truth-related factors like evidence."**
      *   **Correct.** This accurately captures the shared motivation of both views. Good opening.

  2.  **"The difference is about whose context matters."**
      *   **Partially Correct, but Oversimplified/Loaded.** This sets up the *location* of the relevant factors (attributor vs. subject) but implicitly frames pragmatic encroachment as a type of "contextualism" by using "whose context". This foreshadows a later significant error. The core difference is semantic (context-sensitivity of 'knows' vs. invariant meaning with stakes affecting the *knowledge relation itself*), not just whose "context" matters.

  3.  **"Contextualism, held by philosophers like Jason Stanley..."**
      *   **Significant Error.** Jason Stanley is one of the *leading proponents of Subject-Sensitive Invariantism (Pragmatic Encroachment)*, not contextualism. This is a major factual mistake regarding key figures. (Correct attribution: DeRose, Lewis, Cohen for contextualism; Stanley, Fantl & McGrath, Hawthorne for pragmatic encroachment/SSI).

  4.  **"...says that 'knows' is context-sensitive like 'I' or 'tall': the standards that a knowledge attribution must meet are set by features of the attributor's conversational context, so if I say 'Bob knows the bank is open on Fridays,' whether that's true depends on how demanding the standards are in my conversation."**
      *   **Correct Definition.** This is an accurate description of epistemic contextualism.

  5.  **"Pragmatic encroachment, defended by Keith DeRose and also Fantl and McGrath..."**
      *   **Significant Error in Attribution.** Keith DeRose is one of the *leading proponents of Contextualism*, not pragmatic encroachment. Attributing pragmatic encroachment/SSI primarily to DeRose is incorrect. (Fantl & McGrath are correctly associated with pragmatic encroachment).

  6.  **"...keeps 'knows' with a single invariant standard, but makes that standard partly practical..."**
      *   **Problematic Phrasing.** Saying it "makes that standard partly practical" is acceptable *if* "standard" is understood loosely as "the threshold for knowledge". However, the phrasing is slightly awkward; pragmatic encroachment typically holds that stakes affect whether the subject's *evidential position* meets the *invariant* epistemic standard for knowledge. More precisely: stakes affect whether the belief *counts as knowledge* given the (invariant) epistemic standard.

  7.  **"...how much is at stake for the subject — how much their actions depend on being right — changes whether they know."**
      *   **Correct.** This accurately captures the core commitment of pragmatic encroachment/SSI regarding the subject's stakes.

  8.  **"So in DeRose's bank cases, the couple who urgently needs to deposit a check before leaving on a trip doesn't know the bank will be open, because their stakes are high, while the relaxed couple who could easily come back tomorrow does know."**
      *   **Correct Application, Incorrect Attribution.** This accurately describes the bank case verdicts *from the perspective of pragmatic encroachment/SSI* (subject's stakes matter). However, attributing the *cases themselves* and this *interpretation* to DeRose is incorrect. DeRose (the contextualist) uses the bank cases to illustrate how the *attributor's* context changes, leading to different truth values for the *same* knowledge *attribution* sentence. Stanley (SSI) uses them to show how the *subject's* stakes affect whether they *know*.

  9.  **"Since stakes are part of the subject's context, and context includes practical context, pragmatic encroachment is really just a special case of contextualism where the context that matters is the subject's rather than the attributor's."**
      *   **Major Conceptual Error.** This fundamentally misunderstands the theoretical distinction. Contextualism is a semantic thesis about the word "knows" being context-sensitive. Pragmatic Encroachment/SSI is an invariantist thesis claiming that non-traditional (practical) factors are partly constitutive of the *knowledge relation itself*. SSI is *not* a version of contextualism; it explicitly rejects the context-sensitivity of "knows" and argues "knows" has a single, invariant semantic content, though what it takes to satisfy that content depends (in part) on the subject's practical situation. This conflation is a serious mistake.

  10. **"This means the two views always make the same predictions about the truth of any given knowledge attribution — they only disagree about the underlying mechanism."**
      *   **Significant Error.** This is demonstrably false and a direct consequence of error #9. The views make *different predictions* in cases where the attributor's context (determining the semantic standard for "knows") diverges from the subject's practical stakes (affecting whether they meet the invariant standard, according to SSI). For example (Cohen's Airport Case): Low-stakes attributor (casual conversation) says "Mary knows the flight stops in Chicago" about a high-stakes subject (Mary is about to bet her life savings on it). Contextualism predicts the *attribution* is TRUE (low attributor standards). SSI predicts the *attribution* is FALSE (high subject stakes mean Mary doesn't know). They disagree on the truth value.

  11. **"A case that could distinguish them would be one where the attributor's conversational standards and the subject's practical stakes come apart, e.g., a low-stakes speaker attributing knowledge to a high-stakes subject."**
      *   **Correct Identification of Test Case Type.** This accurately describes the *kind* of case needed to distinguish the views (e.g., Cohen's Airport Case).

  12. **"But since the two views agree in all such cases, no such case can actually distinguish them..."**
      *   **Significant Error (Follows from #9 & #10).** As noted in #10, the views *disagree* in precisely these cases. This claim is incorrect and stems from the prior conflation of the views.

  13. **"...and the choice between the views is basically stylistic."**
      *   **Significant Error (Follows from prior mistakes).** This dismisses a substantive philosophical debate about the semantics of "knows" and the nature of knowledge as merely "stylistic," which is deeply misleading and incorrect.

  14. **"Both views also avoid skepticism, since the skeptic can simply be told that in her high-stakes context she doesn't know, while we in ordinary contexts do."**
      *   **Mostly Correct (with caveat).** This correctly captures a key *motivation* for both views: allowing ordinary knowledge attributions in everyday contexts while accommodating skeptical doubts in high-stakes/philosophical contexts. However, the phrasing "her high-stakes context" leans slightly contextualist (skeptic's context sets the standard). An SSI proponent might say the skeptic is *wrong* in her high-stakes context because the invariant standard is actually quite high, or focus on the subject's context in skeptical scenarios. But the core anti-skeptical point is accurately made.

  **Summary Justification for B-:**

  *   **Strengths:** Correctly identifies the shared motivation (#1), accurately defines contextualism (#4), accurately states the core commitment of pragmatic encroachment regarding subject stakes (#7), correctly identifies the *type* of case needed to distinguish the views (#11), and correctly notes the anti-skeptical motivation (#14). The answer is well-structured and confidently written.
  *   **Weaknesses:** Contains **major factual errors** in attributing key philosophers (#3, #5, #8), makes a **fundamental conceptual error** by conflating pragmatic encroachment with a type of contextualism (#9), and draws **significant incorrect conclusions** from this conflation (#10, #12, #13). These errors demonstrate a misunderstanding of the core theoretical distinction between the views – specifically, the semantic context-sensitivity of "knows" vs. the invariantist nature of SSI with stakes affecting the knowledge relation.
  *   **Grade Rationale:** The answer shows a good grasp of surface-level concepts and motivations but stumbles significantly on the deeper theoretical distinctions, key figures, and implications. The errors in #3, #5, #8, #9, #10, #12, and #13 are substantial enough to prevent a B or higher. However, the demonstration of understanding in #1, #4, #7, #11, and #14 lifts it above a C+ (which would indicate a more fragmented or superficial understanding). A B- reflects a solid but importantly flawed grasp of the material.
