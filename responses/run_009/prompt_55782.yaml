  Leaf G: Strict control principle, no moral luck. (Named: "No Moral Luck, Compatibilist") Awkward: Defending that moral responsibility is compatible with determinism and immune to luck in character formation.

  Leaf H: Moral responsibility skeptic. (Named: "Skeptic") Awkward: Abandoning blame and praise altogether.

