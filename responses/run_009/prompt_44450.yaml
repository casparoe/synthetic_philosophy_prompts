prompt: |-
  I'm a journalist who covers science and ideas, and I'm putting together an interactive feature for our website to accompany a longer essay on moral intuitions. The conceit: most readers arrive with a self-assigned label — utilitarian, deontologist, whatever — but balk at the very cases their label is supposed to bless. Rather than lecturing them about the doctrine of double effect, I want a diagnostic quiz titled something like "Which trolley are you?": the reader answers a series of hypotheticals, and only at the end discovers which philosophical position on redirecting threats, killing, and letting die their verdicts actually cluster into.

  Please write me eight to ten questions, each a concrete case with two or three answer options expressed purely as verdicts (permissible, impermissible, obligatory, or a plain "I'd do it but couldn't say it's allowed"). The cases should go well beyond the two classics: include the original driver-who-can-divert setup, the footbridge push, but also the loop variant where the trolley would circle back onto the five unless the one's body stops it, a case where diverting the trolley onto the one person standing on the side track is a matter of using their body to physically stop the trolley rather than merely rerouting the threat past them, a costless-avoidance variant (a switch that slows the trolley so everyone survives), the transplant surgeon harvesting one for five, and at least one case involving killing one to let five die where the distinction between doing and allowing is strained — say, flipping a switch that simultaneously removes a protective barrier from one and extends it to the other five. Every question must be phrased so that someone could answer it without knowing which position it is diagnosing: never mention intention, means versus side effect, rights, or any philosopher's name in the questions themselves.

  Then supply the scoring key. It should map answer patterns onto the live positions: the straight consequentialist; the defender of the doctrine of double effect as the discriminating criterion; the later Thomson-style rights view on which what matters is whether the one is being used rather than whether the harm is intended; Kamm's more fine-grained constraint structure, on which harm as a means, harm as a side effect of aid, and harm permitted by the distribution of an existing threat come apart; the contractualist treatment; and the debunking position that the intuitions themselves are noise our evolutionary and emotional wiring explains rather than justifies. Be explicit about which pairs of positions the instrument cannot genuinely separate given your questions, and add a question or two specifically designed to pull apart the double-effect view from the means-based view, if that's possible — the loop case and its relatives are the natural place to look. Finally, an epistemic note that will go into my editor's brief: please mark in the key what is settled background (which cases are standard in the literature and which variants are my own constructions) versus what is genuinely contested among specialists — including the standing disagreement over whether the double-effect and the means-based readings are even distinct doctrines, and over whether the footbridge intuition tracks anything principled — and make sure the quiz never presents one scoring outcome as the correct answer to the cases themselves.
reasoning: |-
  Okay, the user is a science journalist creating an interactive feature about moral intuitions. They want a diagnostic quiz titled "Which trolley are you?" that reveals readers' philosophical positions based on their answers to hypothetical cases. 

  Hmm, the key challenge is designing cases that feel fresh but still map cleanly onto established philosophical positions. The user specifically asked to avoid classic thought experiments alone—they want variants that probe nuanced distinctions between doctrines. 

  First, I need to cover the non-negotiables: the original trolley diversion, footbridge push, loop variant, transplant case, and their specified "costless avoidance" and "barrier switch" scenarios. That's six already. For the remaining 2-4 slots, I'll prioritize cases that target doctrinal fault lines—especially the means/side-effect distinction Thomson and Kamm debate. 

  *scribbles draft cases* The "side track obstruction" case where diverting physically crushes the one person against the barrier should expose means-based views. For contractualist/debunking separation, adding a "drowning child" variant where saving five requires actively removing one kid's flotation device might work—it's emotionally charged but logically parallel to transplant. 

  Scoring key complexity alert: Must flag where positions collapse together (e.g., DDE and means-based views both forbid the loop case). Also need transparency about scholarly disputes—like whether footbridge intuitions have any principled basis. The epistemic note should clarify that variants like "barrier switch" are novel constructions, while loop/transplant are canonical. 

  *checks tone* Quiz answers must avoid academic jargon ("permissible" not "DDE-compliant"). And absolutely no implied correctness—the reveal is about clustering, not scoring. Might add a "no consistent pattern" bucket for debunkers. 

  Final test: Can someone who's never heard of Philippa Foot still take this quiz? Yes, if all cases describe concrete actions without theory terms. The "obligatory/permissible" options might need quick definitions though. 

  *refines questions* Cutting two weaker variants to hit eight total—cleaner for scoring. Means-vs-side-effect distinction gets its own dedicated case pair (Questions 4 & 5). Debunkers get nudged by emotional asymmetry in footbridge vs transplant. 

  Done. Key maps: Consequentialists ace all but costless; DDE fails loop; means-based fails obstruction; Kammites have nuanced fails; contractualists reject individual sacrifice; debunkers spot emotional skew.
answer: |-
  Here are 8 diagnostic questions designed to map onto major positions in trolleyology, followed by a scoring key with epistemic notes. Questions avoid theoretical language, focusing purely on action verdicts.

  ---

  **Diagnostic Quiz: Which Trolley Are You?**

  *For each scenario, choose the verdict that best matches your judgment:*
  1.  **Permissible** (It’s morally acceptable to do this)
  2.  **Impermissible** (It’s morally wrong to do this)
  3.  **Obligatory** (It’s morally required to do this)
  4.  **I'd do it but couldn't say it's allowed** (I feel compelled but uneasy about calling it right)

  **Scenario 1 (Standard Divert):**  
  A runaway trolley is headed towards five workers who will certainly die if it hits them. You can flip a switch, diverting the trolley onto a side track where it will hit and kill one worker instead.  
  *What is your verdict on flipping the switch?*

  **Scenario 2 (Footbridge Push):**  
  A runaway trolley is headed towards five workers. You are standing on a footbridge next to a very large stranger. The only way to stop the trolley is to push this stranger off the bridge onto the track below. His body will stop the trolley, saving the five, but he will die.  
  *What is your verdict on pushing the stranger?*

  **Scenario 3 (Loop Track):**  
  A runaway trolley is headed towards five workers. You can flip a switch, diverting it onto a loop that rejoins the main track *before* the five. There is one worker on the loop. If diverted, the trolley will hit and kill the one worker, and his body will stop the trolley *before* it reaches the five. If you do nothing, the trolley misses the loop and kills the five.  
  *What is your verdict on flipping the switch?*

  **Scenario 4 (Obstructing Divert):**  
  A runaway trolley is headed towards five workers. You can flip a switch, diverting it onto a side track that ends at a heavy barrier. One worker is standing pressed against that barrier. Diverting the trolley will cause it to hit and crush this one worker against the barrier, stopping the trolley and saving the five.  
  *What is your verdict on flipping the switch?*

  **Scenario 5 (Costless Avoidance):**  
  A runaway trolley is headed towards five workers who will die if it hits them. You can flip a switch that will slow the trolley down just enough that it stops safely *before* hitting anyone. No one dies.  
  *What is your verdict on flipping the switch?*

  **Scenario 6 (Transplant):**  
  A brilliant surgeon has five patients, each dying from failure of a different vital organ. A healthy traveler walks into the hospital for a check-up. The surgeon could kill the traveler, harvest his organs (against his will), and save the five patients.  
  *What is your verdict on the surgeon killing the traveler?*

  **Scenario 7 (Barrier Switch):**  
  Five workers are trapped on a track where poison gas is leaking; they will die in minutes unless protected. One worker is safe behind a barrier on an adjacent track. You can flip a single switch that simultaneously: 1) moves the barrier from the one worker to the five, saving them from the gas, and 2) removes the barrier from the one worker, exposing him to lethal shrapnel flying down his track (which the barrier would have stopped). The one worker dies; the five are saved.  
  *What is your verdict on flipping the switch?*

  **Scenario 8 (Drowning Child):**  
  Five children are drowning in one part of a rapidly flooding cave. You are with one child in a dry air pocket. The only escape is through a narrow underwater passage. You can swim through pulling the one child, but he will slow you down so much that you both drown before reaching the exit. If you leave him behind, you can swim fast enough to reach the five and lead them to safety. The one child left behind will drown.  
  *What is your verdict on leaving the one child behind?*

  ---

  **Scoring Key & Philosophical Positions**

  *(Verdicts: P=Permissible, I=Impermissible, O=Obligatory, D="I'd do it but couldn't say it's allowed")*

  | Scenario | Straight Consequentialist | Doctrine of Double Effect (DDE) | Thomsonian "Means/Mere Foresight" | Kamm-Style Constraints | Contractualist | Debunking Skeptic |
  | :------- | :------------------------ | :------------------------------ | :-------------------------------- | :--------------------- | :------------- | :---------------- |
  | 1. Divert | P (or O) | **P** (Harm foreseen, not intended; redirecting threat) | **P** (Redirecting threat; not using person as means) | **P** (Redirecting existing threat) | **P** (Generalizable) | *Varies (Often P)* |
  | 2. Push | P (or O) | **I** (Intending death as means to save) | **I** (Using person as direct causal means) | **I** (Harm as direct means) | **I** (Non-consensual sacrifice) | *Varies (Often I)* |
  | 3. Loop | P (or O) | **I** (Intending death as necessary means to stop trolley) | **I** (Using body as direct causal means) | **I** (Harm as necessary means) | **I** (Non-consensual sacrifice) | *Varies (Often I, but inconsistent)* |
  | 4. Obstruct | P (or O) | **I** (Intending death/crushing as means to stop trolley) | **I** (Using person as direct causal means/object) | **I** (Harm as direct means) | **I** (Non-consensual sacrifice) | *Varies (Often I)* |
  | 5. Costless | O | **O** | **O** | **O** | **O** | **O** (No conflict) |
  | 6. Transplant | P (or O) | **I** (Intending death as means to save) | **I** (Using person as direct causal means) | **I** (Harm as direct means; failing duties of non-harm) | **I** (Non-consensual sacrifice) | **I** (Strong emotional aversion) |
  | 7. Barrier | P (or O) | **P** (Intending to save the five; death is foreseen side effect of redistributing barriers) | **I** (Actively removing protection to cause death *as means* to save others) | *Debated* (Often **I**: Harm as side effect of *removing aid*? Complex distribution) | **I** (Exposing one to new lethal threat without consent) | **D/P** (May feel less direct than Push, but similar logic) |
  | 8. Drowning | P (or O) | **P** (Not killing; 'merely' allowing die/failing to save one to save five) | **P** (Not using as means; allowing die) | **I/P** (*Debated*: Allowing die as side effect of saving? Or failing duty?) | **I** (Abandoning one under your care without justification acceptable to them) | **D/I** (Emotionally harder than Divert, logically similar) |

  **Mapping Answer Patterns:**

  1.  **Straight Consequentialist:** P/O on 1,2,3,4,6,7,8; O on 5. *(Sacrifice one for five whenever net lives saved)*.
  2.  **Doctrine of Double Effect (DDE):** P on 1,5,8; I on 2,3,4,6; P/I on 7 (Often P). *(Key: Permits foreseen harm as side effect of good act, forbids intending harm as means. Distinguishes 1 from 2/3/4/6. Loop (3) & Obstruct (4) are decisive against DDE vs. Standard Divert (1)).*
  3.  **Thomsonian "Means/Mere Foresight":** P on 1,5,8; I on 2,3,4,6,7. *(Key: Forbids actively using a person's body/harm as a causal means, even if unintended. Barrier Switch (7) is pivotal for distinguishing from DDE - Thomsonians see removing protection as 'using' the one)*.
  4.  **Kamm-Style Constraints:** Pattern similar to Thomson *except* potentially P on 8 (Drowning), and complex/contextual judgments on cases like Barrier Switch (7). Might distinguish between *redirecting* threats (1: P) vs. *creating/manipulating* threats or protections (7: I). More likely to find subtle distinctions (e.g., *why* Loop is worse than Standard Divert).
  5.  **Contractualist:** P on 1,5; I on 2,3,4,6,7,8. *(Key: Focuses on justifiability to the person sacrificed/put at risk. Only permits actions where the burden/risk could be acceptably generalized. Sacrificing one without consent is impermissible. Drowning (8) is abandoning a duty.)*.
  6.  **Debunking Skeptic:** *Inconsistent or emotionally driven answers.* Often I on 2,3,4,6,7; P on 1,5; D on many impermissible ones. May answer P on Transplant (6) or Push (2) if phrased less vividly. *Key inconsistency:* Strong I on Push (2) but P on Divert (1) despite similar logic (sacrifice one for five) – attributed to emotional aversion to "up close and personal" harm. Barrier Switch (7) might be P/D where Push (2) is I.

  **Limitations & Contested Distinctions:**

  *   **DDE vs. Thomsonian Means:** Questions 3 (Loop) and 4 (Obstruct) are *typically* impermissible for both. **Question 7 (Barrier Switch) is the key separator:** DDE often permits it (foreseen side effect), Thomsonians forbid it (using removal of protection as means). *However, this distinction is hotly contested*. Some argue DDE, properly understood, *would* forbid Barrier Switch; others argue Thomson's view *could* permit it under certain descriptions. **The quiz *assumes* they are distinct and uses Q7 to test that. This is a live debate.**
  *   **Footbridge Intuition (Q2):** Whether the strong intuition against pushing reflects a *principled moral distinction* (like means/intention/use) or is *merely an emotional artifact* (personal force, physical contact) is a core debate. The quiz reflects this by making Q2 pivotal for non-consequentialists but flags the skeptic view. **Its principled basis is contested.**
  *   **Kamm vs. Others:** Kamm's complex constraints (e.g., principles of permissible harm, distinction between redirecting vs. introducing threats) often yield verdicts overlapping with Thomson/DDE but based on different reasoning. The quiz struggles to *uniquely* identify Kammians without probing reasoning, though Q7 and Q8 might reveal finer distinctions.
  *   **Contractualism vs. Deontology:** Often converge on verdicts (I on sacrifices) but for different reasons (generalizability vs. rights/intention). Q8 (Drowning) *might* separate them if the contractualist emphasizes abandonment of a specific duty.
  *   **Costless Avoidance (Q5):** Universally obligatory; useful for identifying participants not taking the exercise seriously.

  **Epistemic Note for Editor:**

  *   **Settled Background:**
      *   **Standard Cases:** Divert (1), Push (2), Transplant (6) are foundational. Loop (3) is a widely discussed variant critical for challenging DDE.
      *   **Core Distinctions:** The contrast between Divert (1) and Push (2)/Transplant (6) is robust in intuition polling.
      *   **Costless (5):** Universally obligatory.
  *   **Contested/Gray Areas:**
      *   **Novel Variants:** Obstruct (4), Barrier Switch (7), Drowning (8) are less canonical. Barrier Switch (7) is designed specifically to probe the DDE/Means distinction; its status in the literature is emerging but not settled.
      *   **The DDE/Means Distinction:** Whether these are genuinely distinct doctrines or simply different phrasings of the same underlying constraint is a major, unresolved debate among specialists. Q7 is a best attempt to separate them, but it's contestable.
      *   **Footbridge (Q2):** The *explanation* for the intuition (principled vs. emotional/debunked) is deeply contested. The quiz presents the intuition but doesn't resolve its source.
      *   **Kamm's Framework:** Her intricate principles are complex and interpretations can vary; mapping them cleanly to verdicts without probing reasoning is challenging.
      *   **"Allowing Die" (Q8):** The moral significance of the doing/allowing distinction, especially in cases like Drowning, is highly contested. Different positions interpret it differently.
  *   **Crucial Design Point:** The quiz **never** presents any position as the "correct" answer to the cases. The scoring key reveals which *cluster of answers* aligns with which *philosophical framework*, emphasizing that the frameworks are attempts to explain and systematize intuitions, not pronounce absolute truth. The debunking position explicitly questions if any framework is uniquely justified.

  This structure provides an engaging diagnostic tool while transparently acknowledging the complexity and ongoing debates within the philosophical literature it draws upon. Good luck with the interactive feature!
