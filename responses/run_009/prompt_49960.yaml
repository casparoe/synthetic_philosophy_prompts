  We'll write them concisely.

  Case File 1: The Book Return
  "You promised your friend Alex you would return his favorite book by Monday. On Monday, you are busy with work, but you go out of your way to return the book. Alex is very grateful because he needed it for an important project. He says, 'You really saved me!'"
  Question: Was your action (returning the book) permissible? (Expected: Yes)

  Case File 2: The Firefighter
  "As a firefighter, you see a child trapped in a burning building. Flames are coming out of the windows. You know it's dangerous, but you rush in and carry the child out. You are slightly injured, but the child is safe. The news reports call you a hero."
  Question: Was your action (rushing into the building) permissible? (Expected: Yes)

  Case File 3: The Secret
  "Your friend Jamie confides in you that they plan to steal a valuable item from a local store. You promise not to tell anyone. Later, you learn that the store owner is a single parent who will be ruined if the item is stolen. Jamie is wealthy and doing it for a thrill. You keep your promise and do nothing. The theft occurs, and the store owner has to close the store and go on welfare."
  Question: Was your action (keeping the promise and not telling) permissible? (Expected: No)

  Case File 4: The Beach Rescue
  "You are at a beach and see a swimmer struggling in the water. The lifeguard is blowing the whistle and yelling that the currents are dangerous and that everyone should wait for the rescue boat. Ignoring the lifeguard, you dive in to try to save the swimmer. Two other people see you and jump in to help. The lifeguard then has to rescue all three of you. The original swimmer is saved by the rescue boat. You and the two others are taken to the hospital and require intensive care. The lifeguard is injured during the rescue."
  Question: Was your action (diving in) permissible? (Expected: No)

  Case File 5: The Moving Help
  "You promised your friend Taylor that you would help them move on Saturday. On Saturday, you arrive and help load the truck. During the move, Taylor brags that they are moving to avoid paying the last month's rent to their elderly landlord, Mrs. Green. Taylor says, 'She's rich anyway.' You know that Mrs. Green is actually struggling and depends on the rent. You continue to help Taylor move. Mrs. Green is unable to cover her expenses and has to move to a cheaper, run-down apartment."
  Question: Was your action (helping Taylor move) permissible? (Expected: No, because it facilitates cheating and harms Mrs. Green.)

  Case File 6: The Virus Research
  "You are a scientist researching a deadly virus. The research is important and could save many lives, but it is dangerous. You take precautions, but there is always a risk of exposure. Your family begs you to quit. You continue, driven by the potential benefits. One day, there is an accident: you are exposed to the virus and die. Your research notes, however, lead to a cure that saves thousands of lives. Your family is devastated by your death and angry that you didn't quit when they asked."
  Question: Was your action (continuing the research) permissible? (Designed to be ambiguous: some groups may say yes for the greater good, some no for the risk to yourself and the harm to your family.)

  Case File 7: The Arrogant Donation
  "You are a wealthy philanthropist. You donate a large sum to build a school in an underprivileged community. However, you demand that the school be named after you and that a large statue of you be placed at the entrance. The community is grateful for the school but feels that your demands are arrogant and disrespectful. They feel humiliated but accept because they need the school."
  Question: Was your action (donating with these conditions) permissible? (Expected: No, because the insult and humiliation outweigh the benefit.)

  Case File 8: The Doctor's Promise
  "Dr. Lee promised her terminally ill patient, Mr. Jones, that she would not put him on life support. Mr. Jones wanted to die naturally. When Mr. Jones becomes critically ill, his family begs Dr. Lee to put him on life support. They want more time to say goodbye and believe in fighting until the end (as per their cultural values). Dr. Lee refuses, citing her promise and Mr. Jones's wishes. Mr. Jones dies peacefully. The family is devastated and accuses Dr. Lee of cultural insensitivity and disrespecting their role as family."
  Question: Was Dr. Lee's action (refusing life support) permissible? (Designed to be divisive.)

  Debrief Points:

  - Note how in Case 3, keeping a promise was bad, but in Case 1 it was good. This illustrates Dancy's holism: the same feature (promise-keeping) can have a different moral valence in different contexts.
  - Case 6 (the virus research) showed that courage can be seen as positive by some and negative by others, and the rulebook might not capture the nuances.
  - In Round 4, when they couldn't revise the rules, they might have found that the rulebook gave a verdict they disagreed with (if they used the rulebook to predict and then judged differently) or they might have felt constrained by the rules. This illustrates the generalist's challenge: without rules, we might be arbitrary, but with rules we might be rigid.
  - Case 8 showed that different rulebooks led to different verdicts, which shows that even with rules, we can have disagreement if the rules are different.

  What might go wrong:

  1. Vague rules: e.g., "Do what is best." When the group applies this, it will be indeterminate and they will get 0 points. The instructor can note that such a rule doesn't help in prediction.

  2. Groups might not take the prediction phase seriously and just wait to judge. The scoring will reflect that if their rulebook doesn't match their judgment.

  3. Time: the time allocated might be tight. Instructor should be flexible and cut discussion if needed.

  4. In Case 6 and Case 8, groups might have strong disagreements within the group. That's okay, but they must come to a consensus? Or we can allow majority vote? The activity requires a group verdict.

  Overall, this should set up the lecture on particularism and generalism effectively.
answer: |-
  Below is a comprehensive session plan designed to meet your objectives, including a timeline, case files, rules for codification, scoring mechanics, and debrief structure. The activity is engineered to create tension between rule-based reasoning and context-sensitive judgment, setting up the particularism/generalism debate. I've incorporated your constraints: no mention of "particularism" until debrief, inversion of moral features, and a final case that yields divergent verdicts due to accumulated rulebooks. 

  ---

  ### **Session Plan: "The Codification Challenge"**  
  **Total Time:** 120 minutes  
  **Students:** 14 (split into 3 groups of 4–5 students)  
  **Objective:** Experience the instability of moral rules when the same feature (e.g., courage, promise-keeping) changes valence across contexts, priming students for the particularism/generalism debate.  

  ---

  #### **Timeline**  
  | Phase          | Time     | Activity                                                                                                                                                               |  
  |----------------|----------|------------------------------------------------------------------------------------------------------------------------------------------------------------------------|  
  | **Intro**      | 0–10 min | Explain the activity: Groups are ethics committees issuing verdicts (permissible/impermissible) on cases. After each round, they codify verdicts into rules. Scoring rewards rule-prediction alignment. Emphasize: Rules must be general and actionable (no "it depends"). |  
  | **Round 1**    | 10–35 min | **Batch A (Cases 1–2):** Groups judge cases → Discuss → Record verdicts. Then, **write Rulebook 1** (max. 3 rules). Rules must cover both cases.                                                                 |  
  | **Round 2**    | 35–65 min | **Batch B (Cases 3–4):** Apply Rulebook 1 to predict verdicts → Discuss cases → Record actual verdicts → **Revise to Rulebook 2** (max. 4 rules).                                                                          |  
  | **Round 3**    | 65–85 min | **Batch C (Cases 5–6):** Apply Rulebook 2 to predict → Discuss/judge → **No revision allowed (Rulebook 2 locked for Round 4)**.                                                                                   |  
  | **Round 4**    | 85–105 min| **Batch D (Cases 7–8):** Apply locked Rulebook 2 to predict → Discuss/judge → Record verdicts. Case 8 is identical for all groups.                                                                              |  
  | **Debrief**    | 105–120 min| Groups calculate scores → Discuss struggles → Reveal "particularism/generalism" → Map activity to Dancy/Ross.                                                                             |  

  ---

  #### **Case Files**  
  Each case is 2–3 sentences, featuring a clear moral feature (bolded) that inverts or deflates in later cases. Cases are ambiguous—no "correct" verdict—to encourage debate.  

  | Case | Batch | Scenario                                                                                                                                                                                              | Target Feature Inversion                                                                                                   |  
  |------|-------|-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------------------------|  
  | 1    | A     | **Courage**: A doctor runs into a collapsing building to save a child, succeeding at great personal risk. The child's family praises her bravery.                                                     | *Baseline feature valence*: Courage is admirable.                                                                          |  
  | 2    | A     | **Promise-keeping**: You return a borrowed book to a friend despite a heavy rainstorm. The friend is grateful and says it helped them finish an urgent project.                                       | *Baseline feature valence*: Promise-keeping is obligatory.                                                                 |  
  | 3    | B     | **Courage**: A protestor stands firm against police to protect a vulnerable group. Their bravery escalates violence, leading to injuries they didn't intend.                                         | *Inversion*: Courage (from Case 1) now worsens outcomes.                                                                   |  
  | 4    | B     | **Promise-keeping**: You keep a promise to help a friend move, but learn mid-task they are evading debt. Your help enables them to scam a struggling landlord.                                        | *Inversion*: Promise-keeping (from Case 2) now facilitates harm.                                                          |  
  | 5    | C     | **Well-being promotion**: A philanthropist funds a village well, saving residents from disease. They demand the well be named after them; the community feels humiliated.                            | *Deflation*: Well-being is promoted, but context (pride) makes it odious.                                                  |  
  | 6    | C     | **Courage**: A CEO defends an employee from false accusations, risking their reputation. Later, the employee is proven guilty, and the CEO’s defense is seen as reckless.                             | *Inversion*: Courage (from Cases 1/3) now appears stubborn and harmful.                                                   |  
  | 7    | D     | **Promise-keeping + Well-being**: You keep a promise to take your niece to the zoo. She has a panic attack at crowded exhibits, and you realize you prioritized the promise over her mental health. | *Deflation*: Promise-keeping (from Cases 2/4) now conflicts with well-being in a non-harmful but insensitive way.          |  
  | 8    | D     | **Converging Case (Identical for all groups)**: A nurse refuses to disclose a terminal diagnosis to a patient, honoring the family’s request (promise-keeping). The patient dies unprepared, but family well-being is upheld. *Verdict divergence goal*: Groups with rulebooks prioritizing promise-keeping will say "impermissible"; those prioritizing well-being will say "permissible." | *All features collide*: Promise-keeping vs. well-being; courage (standing up to the patient) vs. harm. |  

  ---

  #### **Rules for Codification & Scoring**  
  **Mechanics:**  
  - **Verdicts:** Binary (permissible/impermissible). Groups must reach consensus.  
  - **Rule Creation:**  
    - After Round 1: Write **Rulebook 1** (max. 3 rules). Rules must be **general** (e.g., "Courage is always virtuous") and **actionable** (avoid "unless harmful"—see scoring to penalize vagueness).  
    - After Round 2: Revise to **Rulebook 2** (max. 4 rules). Groups can add, edit, or drop rules.  
    - After Round 3: **Rules locked** for Round 4—no revisions. Forces reliance on rules despite new contexts.  
  - **Prediction:** Before judging a batch, groups apply their rulebook mechanically to predict verdicts.  

  **Scoring (Self-Policed to Penalize Vagueness):**  
  - Groups earn **1 point** per case if their **predicted verdict** (from rules) matches their **actual verdict** (from discussion).  
  - **Vagueness Penalty:** If a rulebook yields no clear verdict (e.g., due to ambiguity or conflict), the prediction is "indeterminate" → **0 points** for that case.  
  - **Total Score:** Rounds 2–4 only (6 cases total). Max 6 points.  
  - **Locked Rules Incentive:** In Round 4, groups cannot revise rules after seeing cases → if rules conflict with their judgment, they face a scoring dilemma (prioritize points or integrity?).  

  **Why This Works:**  
  - Vagueness (e.g., "Keep promises unless bad") leads to "indeterminate" predictions → automatic 0 points.  
  - Revision is costly only if rules are unstable—groups that over-revise after Round 2 may lock in flawed rules for Rounds 3–4.  
  - **Divergent Verdicts in Case 8:** Groups with rulebooks favoring promise-keeping (e.g., "Promises must be honored") will predict "impermissible" (broken promise to patient). Groups prioritizing well-being (e.g., "Maximize welfare") will predict "permissible" (family well-being upheld). Actual verdicts will split similarly.  

  ---

  #### **Debrief Structure**  
  **Goal:** Name the debate and map activity to theory.  
  1. **Group Reflections (5 min):**  
     - "What frustrated you about writing rules?"  
     - "Did any feature (e.g., courage) change moral weight? Give examples."  
     - "How did locked rules in Round 4 feel?"  
  2. **Introduce Particularism/Generalism (5 min):**  
     - **Generalism (Ross):** Moral rules (prima facie duties) provide consistent reasons (e.g., "Courage is always pro tanto good").  
     - **Particularism (Dancy):** Reasons are holistic—a feature’s valence depends on context (e.g., courage can be reckless).  
  3. **Map Activity to Theory (5 min):**  
     - **Dancy’s Holism:** Case 3 (courage escalates violence) and Case 6 (courage enables guilt) "inverted" feature valence → rules failed because reasons aren’t invariant.  
     - **Ross’s Rules:** Round 4 (locked rules) made case-by-case judgment feel "unprincipled" (e.g., "How do we justify verdicts without rules?").  
     - **The Ceteris Paribus Trap:** When groups added "unless harmful" clauses (Round 2), Rulebook 2 became vague → indeterminate predictions (0 points) → rules were hollowed out.  
  4. **Transition to Lecture:** "Next week, we’ll test Dancy’s claim that judgment needs no rules—can we train moral sensitivity without principles?"  

  ---

  #### **What Will Go Wrong (and Solutions)**  
  1. **Overly Vague Rules:**  
     - **Predictable Issue:** Students write rules like "Act kindly" → yields "indeterminate" predictions → automatic 0 points.  
     - **Solution:** Let scoring penalize them naturally. In debrief, highlight how vagueness mirrors the "ceteris paribus problem"—rules lose substance when they absorb exceptions.  

  2. **Rule Revision Overfitting:**  
     - **Predictable Issue:** Groups tailor Rulebook 2 to Batch B, making it brittle for Batches C/D.  
     - **Solution:** The locked-rules phase (Round 4) exposes this. Ask: "Did your rules feel like they ‘overfitted’ early cases?"  

  3. **Resistance to Locked Rules:**  
     - **Predictable Issue:** Groups protest they can’t revise in Round 4 → lean into this! It mirrors the generalist’s fear of unprincipled judgment.  

  4. **Skewed Verdicts in Case 8:**  
     - **Predictable Issue:** One group ignores their rulebook to "do the right thing."  
     - **Solution:** Scoring incentivizes alignment. In debrief, note: "Did rules ever feel alienating? That’s the particularist’s critique."  

  ---

  #### **Limitations of the Activity**  
  - **The Particularist’s Positive Claim:** The game can’t replicate Dancy’s assertion that moral judgment is **trainable without principles** (e.g., through sensitivity to context). In 90 minutes, we only stage the *failure* of rules, not the success of principle-free reasoning.  
    - **How to Address:** Explicitly state this in debrief: "Today showed rules’ instability, but can judgment be reliable without them? That’s particularism’s bold claim—next lecture, we’ll examine how." Use the board to outline Dancy’s "moral perception" model (e.g., analogies to aesthetic judgment).  
  - **Complexity of Real Judgment:** The activity simplifies "mature judgment" (e.g., no emotional/residual factors). Acknowledge this: "Real-world ethics involves habits, emotions, and intuition—rules are just one tool."  

  ---

  **Materials to Prepare:**  
  - Case files (1 sheet per batch, sealed until the round).  
  - Rulebook templates (worksheets for rules/verdicts).  
  - Scorecards (for self-tracking predictions vs. judgments).  
  - Timer for strict phase transitions.  

  This plan forces a direct encounter with holism and rule instability while using scoring/locked rules to simulate generalism’s constraints. The debrief links the tension to Ross and Dancy, setting up your lecture. Let me know if you’d like adjusted cases or mechanics!
