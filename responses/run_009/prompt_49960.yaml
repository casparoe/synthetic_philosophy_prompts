  We are designing a seminar activity for a third-year ethics class to set up the particularism/generalism debate. The goal is for students to experience the challenges of codifying ethical judgments into rules that hold across diverse cases, especially when the same feature can change its moral valence depending on context.

  Key Elements:
  - The class has 14 students, one two-hour session.
  - Small groups (suggest 3-4 groups of 3-5 students each) act as ethics committees.
  - The activity is divided into rounds (batches of cases). We'll have at least three rounds (with at least 8 cases total).
  - In each round, groups are given case files and must issue verdicts (e.g., "permissible", "impermissible", or perhaps a scale? but to keep it simple, we'll use binary for the game). 
  - After each round (except the last), they must write rules that explain their verdicts. These rules will be applied mechanically to the next round's cases (without their judgment) to predict what their verdict would be. Then they actually judge the next round and we compare.
  - The case sequence is engineered so that features that were positive in early cases become negative in later ones (e.g., courage leading to bad outcomes, promise-keeping that is odious, etc.)
  - At a certain point, groups are forbidden from revising their rules mid-round (to simulate the generalist's commitment to fixed rules).
  - We want groups to experience the failure of rules and the difficulty of case-by-case judgment without principles.
  - Finally, we aim for divergent verdicts on the same final case by groups with different rulebooks.

  Structure:
  1. Introduction (10 minutes)
  2. Round 1: Case Batch 1 (20 minutes)
     - Groups read and discuss 2-3 cases, reach verdicts.
     - Then they write initial rules (10 minutes).
  3. Round 2: Case Batch 2 (20 minutes)
     - Before seeing the cases, the rules from Round 1 are applied mechanically to the new cases to generate predicted verdicts (by the instructor or TAs? but we'll have the groups do it themselves to save time and engage them). However, to avoid bias, we can have them apply the rules without knowing the cases? But that might be logistically hard. Alternatively, we can have the groups apply their own rules to the new cases (without discussion) and then compare with their actual judgments after discussing the cases.
