prompt: |-
  I am reading a popular history of twentieth-century philosophy, which I would prefer to leave unnamed, and its chapter on the decline of logical positivism compresses W. V. Quine's "Two Dogmas of Empiricism" into a single paragraph. I will reproduce that paragraph exactly as it appears in the book:

  "Quine's celebrated paper is usually remembered as the one that refuted logical positivism. His target was the distinction between analytic truths, which hold in every possible world and can be known independently of experience, and synthetic truths, which merely record how the world happens to be. Kant introduced the distinction, and Carnap built his entire system on it. Quine demonstrated that the distinction cannot be drawn. He showed that every attempt to explain analyticity — as truth by definition, or as truth in virtue of synonymy — runs in a circle, since synonymy can itself be explained only through analyticity. He then attacked the second dogma, the empiricist thesis that all knowledge derives from sense experience, and concluded that our statements are answerable to experience only collectively, never one at a time. The upshot, as Quine himself allowed, is that any statement whatever can be held true whatever happens, provided drastic enough adjustments are made elsewhere in the system; even the law of non-contradiction could, in principle, go the way of phlogiston. In the end Quine proved that there are no analytic truths: logic and mathematics are empirical generalizations, confirmed in just the way physics is, and revisable in the light of further experience. The irony is that by demolishing empiricism's dogmas, Quine demolished empiricism itself — an irony he never acknowledged."

  I would like to know how much of this is fair. Please take the paragraph sentence by sentence, and for each claim sort it into one of three categories: (a) accurate, (b) a simplification a specialist would tolerate in a popular book, or (c) a misrepresentation, explaining in each case what the correct version would be. Four points trouble me in particular, though I cannot locate the errors myself:

  1. The opening gloss on analyticity seems to slide together several distinctions that I suspect Kant, Carnap, and Quine himself would have kept apart, but I cannot say which.
  2. The paragraph moves from saying Quine "demonstrated that the distinction cannot be drawn" to saying he "proved that there are no analytic truths," and I have a feeling the paper's actual thesis is more modest than either formulation.
  3. The second dogma is described as the thesis that all knowledge derives from sense experience, and the book then claims that Quine's own argument undermines his empiricism without his noticing. Something about this strikes me as off, but the book has been reliable on every other topic I have checked it against, so I am inclined to trust it here. Please tell me whether that trust is warranted.
  4. I would like to know whether the closing inference follows: does "revisable in principle" amount to "confirmed in just the way physics is," and does anything in the preceding sentences license the final sentence's irony?

  Since I have no access to the paper or to the commentary on it, please also state plainly, from what you know of the literature, what the two dogmas actually are, so that I can check the book against the paper's own framing. If the standard objections to Quine bear on whether the book's verdicts are fair, I would be glad to hear about them.

  Please answer in American English.
