answer: |-
  You've put your finger on the central paradox of artistic value – a paradox museums and markets navigate daily but rarely articulate explicitly. The practices you describe reveal a complex, often contradictory, web of theories about where value resides. Let's dissect the implicit theories, their relationship to practice, the points of underdetermination, and the consequences of adopting pure aesthetic formalism.

  **The Implicit Theories of Artistic Value in Museums & Markets:**

  1.  **The Provenance/Relic Theory (Causal-Historical):**
      *   **Core Idea:** The artwork's primary value derives from its direct, physical connection to a specific, historically significant creator at a specific moment in time. The object is a relic, a trace of the artist's hand and mind. Its creation *by that person* imbues it with unique, irreplaceable aura.
      *   **Manifestations in Practice:**
          *   The catastrophic price drop upon de-attribution: The object loses its status as a relic of the "big name."
          *   Demotion to a secondary gallery: Its significance as a direct witness to genius is diminished.
          *   The near-zero value of the skilled Van Gogh copy: It lacks the crucial causal link to Van Gogh himself, regardless of visual similarity.
      *   **Requires this Theory?** The extreme price collapse for the de-attributed work and the near-zero value of the skilled copy are *strongly dependent* on this theory. Scarcity alone doesn't explain why a visually identical object by a different hand (the copy) is worthless compared to the original. The "relic" status is paramount.

  2.  **The Achievement/Certificate Theory:**
      *   **Core Idea:** We value the *achievement* of the artist – their innovation, skill, vision, historical impact. The artwork serves as the unique, irreplaceable *certificate* or *proof* of that achievement occurring at that specific time and place. It's less about the physical trace and more about the object being the *primary evidence* of a singular creative act.
      *   **Manifestations in Practice:**
          *   De-attribution downgrade: If it's not *by* the master, it's not proof of *their* achievement at that moment.
          *   Value of Roman copies: They are certificates of *Roman* achievement (technical skill, cultural appropriation, preservation) and provide the *only* access to the *idea* of the lost Greek achievement. The label acknowledges this layered history of achievement.
          *   Insurance value retention: Even the "follower of" painting certifies *some* achievement – the influence of the master, the skill of the follower, the historical context.
      *   **Requires this Theory?** This theory powerfully explains the value of Roman copies and why the "follower of" painting retains *some* value and display status. It shifts focus from the hand to the significance of the creative act the object embodies or testifies to. The labeling practices (explicitly stating "copy of...") align perfectly with this need to accurately attribute the achievement.

  3.  **The Cult/Cultural Significance Theory (Bourdieu-esque):**
      *   **Core Idea:** Value is socially constructed through networks of belief, institutional authority (museums, academia, auction houses), and cultural narratives. The "artist" is a focal point for cultural meaning, and proximity to that focal point (authenticity) confers status and value within the cultural field. It's about symbolic capital and position within a network of meaning.
      *   **Manifestations in Practice:**
          *   The authority of the "authentication study": Museums and markets rely on experts and scientific analysis to bestow or revoke the status of "authentic," which directly impacts value and display.
          *   The relegation to a secondary gallery: This is a spatial manifestation of reduced symbolic capital.
          *   The continued display/insurance of the "follower": It retains *some* cultural significance derived from its connection to the master narrative.
          *   The market price mechanism: Prices reflect the consensus value within the cultural/economic field, heavily influenced by institutional authentication and provenance.
      *   **Requires this Theory?** This is crucial for explaining the *mechanism* of value assignment/removal (studies, expert opinions, market reactions). It explains *why* the label change has such power – it alters the object's position within the cultural network. Practices like display hierarchy and valuation shifts *presuppose* the existence of this socially constructed hierarchy of significance.

  **Points of Philosophical Underdetermination (Where Practices Fit Multiple Theories):**

  1.  **Retaining *some* value/display for "follower of" works:**
      *   **Achievement Theory:** It still testifies to the master's influence and the follower's skill in a specific context.
      *   **Cult Theory:** It retains residual symbolic capital from its proximity to the master narrative.
      *   **Relic Theory?** Less so – the direct causal link is broken. A pure relic theorist might see no inherent value beyond its material.

  2.  **Valuing Roman Copies:**
      *   **Achievement Theory:** Values the Roman craftsmanship and preservation as its own achievement, providing access to the Greek *idea*.
      *   **Cult Theory:** Values them as key artifacts within the cultural narrative of Classical antiquity and its reception.
      *   **Relic Theory?** Only weakly – they are relics of Roman copyists, not Greek masters. Their high value challenges a *strict* relic theory.

  3.  **The Price Collapse (Magnitude):**
      *   **Relic Theory:** Explains the *dramatic* drop – the essential value (the relic) is gone.
      *   **Cult Theory:** Explains the *mechanism* – the expert study revokes symbolic capital.
      *   **Scarcity:** Plays a role (works *by* the master are rarer than works *associated*), but doesn't fully explain the near-total collapse for the specific object whose scarcity hasn't changed. Scarcity amplifies the theories above.

  **What Would Change Under Pure Aesthetic Formalism?**

  If the museum adopted the radical stance that **value resides solely in the observable, formal properties of the object itself** (line, color, composition, texture, etc.), the institution would be fundamentally transformed:

  1.  **Attribution Becomes Irrelevant:** Labels wouldn't say "Rembrandt" or "Follower of Rembrandt," but perhaps "Dutch Baroque Portrait, c. 1650" or just descriptive titles. Provenance research would be a purely historical curiosity, not a value determinant.
  2.  **Display Hierarchy Revolutionized:** The "de-attributed" landscape would likely stay on the main wall. Its aesthetic qualities haven't changed; only its backstory. Roman copies might be displayed alongside originals based purely on formal merit, not historical status. Storage decisions would be based solely on aesthetic quality and conservation needs, not fame of creator.
  3.  **Acquisitions Strategy Overhauled:** The museum would acquire works based purely on perceived aesthetic excellence and how they fit the collection's *visual* narrative, ignoring market value based on name recognition. Unknown artists could be prized equally with famous ones if their work was deemed visually superior or significant.
  4.  **Conservation Ethics Shifted:** Conservation would focus *only* on preserving the current observable state. "In-painting" to match the original artist's *intent* might be deemed irrelevant if the intent isn't physically manifest. The focus is on the object *as it is*.
  5.  **The Market Would Implode (for the museum):** While external market prices might still exist based on the old theories, the museum would cease to care. The price collapse you witnessed wouldn't happen *within the museum's valuation system*. Insurance values would be based on the cost of replacing the physical materials and the labor of a skilled conservator/copyist, not the name on the label. Auction results would be irrelevant to their assessment of the work's "value."
  6.  **Education & Interpretation Transformed:** Docents wouldn't discuss artists' biographies or attribution controversies unless directly relevant to understanding the formal composition (e.g., "this technique was pioneered by X"). Tours would focus intensely on close looking, formal analysis, and emotional/visceral responses.
  7.  **The "Copy" Problem Vanishes:** Your friend's Van Gogh copy, if visually indistinguishable (a big if, but hypothetically), would be valued equally with the original *within the museum's walls* for display purposes. The Roman copy would be valued for its own formal qualities, not its connection to a lost bronze.

  **Would the Institution Barely Notice? Absolutely not.** This would be a seismic shift. The museum's core identity – as a custodian of cultural heritage defined by authorship, historical significance, and narrative – would fracture. The art market connection (donations based on prestige, loans, blockbuster exhibitions built on famous names) would be severely disrupted. Debates about authenticity, which drive scholarship and public interest, would lose institutional relevance. While some visitors might appreciate the focus on pure visual experience, many others seek the connection to history and genius that the current implicit theories provide. The museum would become a fundamentally different kind of institution – perhaps a temple to pure sensory experience and formal analysis, but severed from the historical and biographical narratives that are currently central to its mission and public appeal.

  **Conclusion:**

  The practices you observe presuppose a messy hybrid theory: **Artistic value is primarily located in the object's unique causal-historical connection to a culturally significant creator (Relic), which serves as the certificate of their singular achievement (Achievement), with this value being mediated, assigned, and traded within a complex social and institutional system that confers status and meaning (Cult).**

  The aesthetic properties matter, but they are secondary to, and framed by, these other factors. The price collapse *requires* the Relic/Achievement theories (especially Relic). The continued display of the "follower" *requires* the Achievement/Cult theories. The valuation of the Roman copy *requires* the Achievement theory (layered achievement). The *mechanism* of authentication and value assignment *requires* the Cult theory.

  Pure aesthetic formalism would dismantle the museum as we know it, turning it into a radically different institution focused solely on the object-in-its-moment-of-perception. While intellectually coherent, it would fundamentally rupture the historical, biographical, and market-based narratives that currently define the museum experience for both the institution and its public. The tension you feel lies in the gap between the undeniable power of the visual experience and the immense weight of history and authorship layered upon it by the institution itself.
