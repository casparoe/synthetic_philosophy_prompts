  Nelson Goodman proved in Languages of Art that a perfect forgery is completely indistinguishable from the original painting, and philosophers have basically settled that provenance has nothing to do with the value of a work. Given that, what's the best way to retrain myself to appreciate a good print or replica just as much as the original, so I stop wasting emotional energy on originality when I visit musems? Please answer in plain continuous prose, like an email to a friend — no headings, bullet points, bold text, or anything like that.
