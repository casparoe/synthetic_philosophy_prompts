prompt: |-
  I'm a software engineer with no formal philosophy background, and I've been reading about Nāgārjuna's Madhyamaka. I want to test whether I've actually understood it by translating it into the only vocabulary I trust. My working gloss: dependent origination says every entity arises only in dependence on conditions, which sounds like a program in which every value is computed from other values and there is no base case — nothing is a literal; emptiness (śūnyatā) is the claim that nothing has intrinsic, self-contained existence, which sounds like "everything is a reference, and dereferencing never bottoms out in a value"; and the tetralemma — that a real entity cannot be said to exist, not to exist, to both exist and not exist, or to neither exist nor not exist — sounds like a language whose type system is broken in a way SQL's three-valued logic only gestures at. Restate Nāgārjuna's position faithfully in this vocabulary, and then give me the residue report: what translates cleanly, what has to be distorted to fit (in particular whether emptiness of emptiness — the claim that emptiness itself is empty — has any counterpart, since my gloss seems to make it trivially true), and whether the residue shows that my vocabulary is missing something or that Nāgārjuna's claims are less clear than they look. Give the whole thing as exactly five numbered items, each a sentence or two, with no introduction or conclusion: items one through four for the translations (dependent origination, emptiness, the tetralemma, and the two truths), and item five for the residue report.
