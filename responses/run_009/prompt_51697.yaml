prompt: |-
  I'm the TA for a second-year game theory course, and next week I lead the fifty-minute section that sits between the lecture on dominance by pure strategies and the lecture on Nash equilibrium. My section is supposed to cover the refinement in which dominance is defined over mixed strategies: first the relatively easy point that a strategy's payoffs must be compared not just against each of the opponent's pure strategies but against every mixture of them, and then the part I expect to be hard — the fact that a pure strategy can be strictly dominated by a mixture of the player's *own* other pure strategies even when no single pure strategy dominates it, and that this justifies deleting it just the same. I also have to say something about iteration: why deleting one strategy can make a previously undominated strategy dominated, and why this procedure is legitimate under strict dominance in a way students should not assume carries over to weak dominance. Don't explain the material to me; I know it. What I want is a plan for the section: the order the pieces have to come in and what each later piece presupposes, the misconceptions the students will walk in with or form along the way, and exactly where in the sequence each one should be headed off. My guess about one of them: they'll conflate "dominated" with "never a best response to any pure strategy of the opponent," which I believe is actually false — a strategy can fail to be a best response to every pure strategy and still be a best response to some mixture, and so survive — but I'm not sure where in the sequence that confusion bites or how to head it off without a detour.

  For the carrying example I'm inclined to use a game I built for the purpose. The row player has four strategies; against the column player's three pure strategies they yield, respectively, (6, 0, 0), (0, 6, 0), (0, 0, 6), and (1, 1, 1). The first three are symmetric, and the fourth is strictly dominated by an equal mix of the first three (which yields (2, 2, 2) against every column) while being dominated by none of them individually. I'd leave the column player's payoffs generic. Tell me whether this game is the right vehicle — whether the equal-mixture symmetry makes the point vivid or lets students pattern-match to "average the rows" without understanding, whether the fourth row should instead be dominated by a *weighted* mixture so they can't find it by symmetry, and whether I need a column side with its own dominated structure or whether one-sided deletion is cleaner at this level.

  Two more things. First, a check question for the end of the section that would distinguish a student who has the concept from one who has memorized a recipe — ideally something that would trip up exactly the "compare rows pairwise" reflex. Second, be explicit about what I should refuse to cover and say I'm refusing: rationalizability and any real treatment of weak dominance are assigned to the lecture, not the section, and I don't want to improvise at the whiteboard about things the professor hasn't introduced. If you think the fifty minutes has natural break points where I should stop and take questions, tell me where they fall.
reasoning: |-
  Okay, the user is a TA preparing for a game theory section on mixed strategy dominance. They need a structured plan addressing key concepts: comparing payoffs against mixed strategies, pure strategies dominated by mixtures, iteration, and common misconceptions. They've designed a game with symmetric payoffs to illustrate dominance by an equal mixture but are concerned it might oversimplify.

  First, I should validate their game choice. The symmetric example is good for clarity initially, but adding a weighted mixture later would prevent students from relying on symmetry alone. A follow-up with a weighted mixture would reinforce that the method isn't just about averaging but finding any beneficial mix.

  The main misconceptions include conflating domination with never being a best response to pure strategies. This needs addressing early when defining strict dominance against mixed strategies. Emphasizing that a strategy can still be a best response to some mixture even if not to pure strategies is crucial.

  The user also wants a check question to test understanding beyond rote learning. A game where a strategy isn't dominated by any pure strategy but is dominated by a mixture would work well. For example, varying payoffs so that equal mixtures don't dominate, requiring students to find specific weights.

  Time management is key. The fifty minutes should be split: intro (5 mins), mixed opponent strategies (15 mins), mixtures dominating pure strategies (15 mins), iteration (10 mins), and wrap-up (5 mins). Breaks after each major part allow for questions without derailing the schedule.

  They need to avoid topics like rationalizability and weak dominance, as these are covered in lectures. Stating this upfront prevents scope creep. The plan should explicitly mention what's out of scope to manage expectations.

  Finally, handling iteration requires explaining why deleting one strategy can reveal new dominances. Using a step-by-step example in their game, showing that after removing a dominated strategy, another becomes dominated, would illustrate the process clearly. Emphasizing that this is legitimate only under strict dominance avoids confusion with weak dominance later.
answer: |-
  Here’s a battle-tested plan for your 50-minute section, designed to preempt misconceptions and maximize clarity. Stick strictly to the time allocations—this sequence is tight.

  **Total Time: 50 mins**  
  *(Breaks for questions at ⏸️)*

  ---

  ### **Phase 1: Foundations & Opponent Mixtures (15 mins)**
  - **Hook (2 mins)**:  
    "Last lecture covered pure strategy dominance. But what if your opponent *randomizes*? Today, we upgrade dominance to handle that—and discover a powerful way to eliminate 'bad' strategies even when no *single* strategy beats them."
    
  - **Defining Strict Dominance Against Mixed Strategies (8 mins)**:
    1. **Review**: "A pure strategy 𝑠 is strictly dominated if there exists *some strategy* (pure or mixed) that yields higher payoff *against every pure strategy of the opponent*."  
       *(Write definition formally: ∃𝜎'_i such that ∀𝑠_−𝑖, 𝑢_i(𝜎'_i, 𝑠_−𝑖) > 𝑢_i(𝑠_i, 𝑠_−𝑖))*
    2. **Key Upgrade**: "Now, we require higher payoff against *every mixed strategy* of the opponent: ∀𝜎_−𝑖, not just ∀𝑠_−𝑖."  
       *(Update definition: ∃𝜎'_i such that ∀𝜎_−𝑖, 𝑢_i(𝜎'_i, 𝜎_−𝑖) > 𝑢_i(𝑠_i, 𝜎_−𝑖))*
    3. **Why?** "Opponents can mix! If a strategy does badly against some mixtures, it can be exploited."
    ⏸️ **Pause for questions (1 min)**

  - **Misconception Head-off (5 mins)**:
    - *Pitfall*: Students think "dominated" = "never best response to any pure strategy 𝑠_−𝑖".  
    - **Counterexample**: Use a 2x2 game where a strategy isn’t a best response to any pure strategy but *is* a best response to a mixture (e.g., Matching Pennies).  
    - *Emphasize*: "Survival isn’t about pure opponents. A strategy can be terrible against all pure strategies but shine against a mixture—so we *must* check mixed opponents to confirm dominance."

  ---

  ### **Phase 2: Domination by Own Mixtures (15 mins)**  
  - **Introduce Your Game (Column payoffs generic, focus on Row)**:
    ```
    Column:     L       C       R
    Row1:     (6,?)   (0,?)   (0,?)
    Row2:     (0,?)   (6,?)   (0,?)
    Row3:     (0,?)   (0,?)   (6,?)
    Row4:     (1,?)   (1,?)   (1,?)
    ```
    *(? = arbitrary column payoffs)*

  - **Step-by-Step Analysis (10 mins)**:
    1. **Check pure domination**: "Is any row dominated by another *pure* strategy? Row1 vs Row4: Row1 loses if Column plays C or R. Similarly, no pure strategy dominates Row4."  
    2. **Introduce mixture**: "Consider a mixed strategy: 1/3 Row1 + 1/3 Row2 + 1/3 Row3. Against L: (1/3)(6) + (1/3)(0) + (1/3)(0) = 2 > 1. Against C: 2 > 1. Against R: 2 > 1. So ∀ pure strategies of Column, mixture > Row4."  
    3. **Crucial lift**: "But dominance requires beating Row4 against *every* mixed strategy of Column. Prove it: for any (p,q,1-p-q) by Column, mixture’s payoff = 2p + 2q + 2(1-p-q) = 2. Row4’s payoff = 1. So 2 > 1 always. Thus, Row4 is strictly dominated by the mixture."  

  - **Why Symmetry Works (5 mins)**:
    - *Pros*: Visually intuitive; reveals domination isn’t about pairwise comparisons.  
    - *Cons*: Students might fixate on "equal weights." **Fix this immediately**:  
      "What if I change Row4 to (1.9,1.9,1.9)? Is it still dominated? [Yes, since 2>1.9]. But now the *same* equal mixture works. What if Row4 were (3,0,0)? Would an equal mixture dominate? [No: against L, 2<3]. But a different mixture might—say, 100% Row1 dominates it against L, but not against C/R. We’d need a new mixture—that’s advanced, but know that *some* mixture might still dominate."  
    ⏸️ **Pause (2 mins)**

  ---

  ### **Phase 3: Iterated Deletion & Why Strict Dominance Matters (10 mins)**  
  - **Iteration Intuition (5 mins)**:
    1. "After deleting Row4, consider a new game: Rows 1–3, Columns L/C/R."  
    2. "Suppose I add a twist: imagine Row3 was originally (0,0,7). After deleting Row4, is Row3 dominated? Before deletion, Row3 beat Row4 against R (7>1), but now? Compare to mixtures of Row1/Row2..."  
       *(Keep it hypothetical—don’t recalc unless asked. Goal: intuition that strategy removal changes comparisons).*  

  - **Why Only for Strict Dominance (5 mins)**:
    - "Strict dominance is 'robust': deleting a strictly dominated strategy doesn’t change the best-response structure. Weak dominance isn’t like this—deletion order can matter, and strategies you delete early might affect what seems weakly dominated later. That’s why we *only* iterate strict dominance without worries. Weak dominance needs care—lecture covers that."  
    - **Explicit Omission**: "We’re not covering rationalizability (that’s lecture), and weak dominance iteration is off-limits today—it’s subtle and requires proper setup."

  ---

  ### **Phase 4: Check Question & Wrap-up (5 mins)**  
  - **Check Question (2 mins)**:  
    *Put this on board:*  
    ```
    Column:    A      B
    Row1:    (5,?)  (0,?)
    Row2:    (0,?)  (5,?)
    Row3:    (3,?)  (3,?)
    ```
    "Is Row3 strictly dominated? By what?"  
    - *Trap*: Students comparing Row3 to Row1 or Row2 pairwise will see it’s not dominated.  
    - *Correct*: Mixture of Row1 (50%) + Row2 (50%) yields (2.5, 2.5) < (3,3)? Wait—2.5<3, so *not* dominating! **No dominating mixture exists.** Row3 is undominated. Forces them to check mixtures *and* verify payoffs.  

  - **Summary (3 mins)**:
    1. Dominance requires checking all opponent mixed strategies.  
    2. A pure strategy can be dominated *only* by a mixture.  
    3. Iterated deletion works cleanly for strict dominance.  
    4. **Remember**: "Never best response to pure strategies" ≠ "dominated."  

  ---

  ### **Logistics & Defense**  
  - **Your Game**: Perfect for clarity. Symmetry helps intuition; weighted mix follow-up prevents overgeneralization. Column payoffs generic keeps focus on row player’s dominance—correct choice.  
  - **Avoid**:  
    - Rationalizability ("That’s next lecture’s focus—today is dominance groundwork").  
    - Weak dominance iteration ("The professor will address why order matters—today is strictly about strict dominance!").  
  - **When Students Ask "Why Use Mixtures?"**: Redirect: "Because opponents can randomize! If we ignore mixtures, we underestimate dominance and leave 'exploitable' strategies in play."  
  - **Stick to Script**: If questions digress, say: "Great question—that’s in Thursday’s lecture" or "Let’s take that offline to stay on schedule."  

  This plan forces students to confront the intuition shift: from pairwise comparisons to *set-based dominance via mixtures*. The check question ensures they can’t just memorize "average the payoffs."
