  me and my roommate spent a whole road trip arguing about Parfit's teletransporter and it's still not settled. Plain version: scanner on Earth records everything about you, destroys your body, beams the info to Mars, and a body with all your memories and personality walks out over there, built from new matter. We also got into a variant I think I made up: same scan, the Mars copy wakes up and starts living her life, but the Earth original is kept sedated in quarantine for 48 hours and then painlessly destroyed. In the plain version my credence that the person who walks out on Mars is numerically me, the very same person, is around 0.55. Hers is like 0.85, and she insists the quarantine version is somehow worse but cant really say why.

  Give me your actual number for the plain version, and don't just tell me it depends on your theory of personal identity — decompose it. Something like: the probability that personal identity over time consists in psychological continuity rather than bodily/animal continuity, the probability that there even is a determinate fact of the matter here rather than a convention or an empty question, the probability that the difference between "numerically the same person" and "a perfect psychological successor who isn't strictly me" is one that has any practical or prudential significance, plus whatever other terms you think belong in the combination. One line of justification for each, then the combined number. Then tell me which single term the final credence is most sensitive to, and what would move it the most — the fission case where both copies survive, the combined spectrum from gradual transplant to full teletransportation, ordinary cell turnover, or something else entirely.

  Separately, give a credence for the quarantine variant if you think it should differ at all from the plain one, since the only change is that the original dies two days after the scan instead of one second after, and explain whether the timing gap is doing real work or is just a framing effect.

  And be honest about the last part: do you think my roommate and I actually disagree about any fact here, or are we just answering two different questions (whether identity is preserved vs whether it matters that it's preserved)? If its the second one, say which of us is probably asking which question.
