  Okay, the user is a philosophy professor teaching a seminar on moral status, and they're analyzing how video games handle the morality of killing NPCs. They've noticed a pattern where games assign moral weight to certain deaths (like killing civilians or making moral choices like in Bioshock) but ignore others (like killing enemies in combat). The professor wants to understand what theory of moral patienthood these design practices presuppose. They also want to know if this implies that narrative framing alone confers moral status, and whether this is coherent or if it's actually tracking the player's character traits. 

  The user's deeper need seems to be exploring the philosophical underpinnings of game design choices. Their student's paper on video games has sparked this inquiry, so they're likely looking for a structured analysis to bring back to their seminar. They want a precise reconstruction of the implicit theory, distinguishing what the design strictly requires from what it's compatible with. They also want examples of alternative designs based on different presuppositions.

  First, I need to identify the core implicit theory. The games consistently tie moral significance to narrative framing. Characters matter when the story highlights them as individuals with backstories or roles (like Little Sisters), but not when they're generic enemies. This suggests that moral patienthood is entirely dependent on how the game's mechanics and story present the NPC. 

  Next, I should address whether this reduces to tracking player virtues. While systems like karma meters appear to judge the player's actions, the inconsistency in which deaths count shows that it's not about harm done universally. Instead, the game designates certain NPCs as morally relevant based on narrative context. This avoids collapsing into pure virtue tracking because the moral weight is assigned by the game's framework, not inherent traits.

  The theory underdetermines several philosophical questions. For instance, it doesn't specify why narrative framing matters—whether it's about empathy, recognition of interests, or social roles. It also doesn't resolve if NPCs have intrinsic moral claims or if it's all about player experience. Alternatives like contractualism or utilitarianism could lead to similar mechanics if aligned with the game's narrative goals.

  For alternative designs, a game treating all NPCs equally would need mechanics that track every kill, affecting the world dynamically. This could lead to gameplay consequences like resource depletion or societal collapse, but might be overwhelming. Conversely, abandoning moral tracking entirely would remove all systems like karma meters, focusing instead on amoral gameplay, which could feel nihilistic but avoid hypocrisy.

  The professor also needs to know if the game industry has an implicit stance. The answer is no—this design pattern is practical, not philosophical. It balances storytelling with playability, avoiding the cognitive load of universal moral consideration. It's more about emotional engagement than a coherent ethical theory.
answer: |-
  **The implicit theory presupposed by mainstream game design is that moral patienthood is constituted solely by narrative recognition, where a character's moral standing derives entirely from explicit authorial framing rather than inherent properties or consequences.**

  ### Reconstruction of the Implicit Theory
  1.  **Narrative Framing as Constitutive:** Moral weight is assigned exclusively when the narrative explicitly marks an NPC as an object of moral concern (e.g., Little Sisters have backstories, dialogue, and designated moral choices; civilians are flagged as "innocent"). The same entity type (human, animal) lacks moral status if not framed this way (e.g., bandits, generic enemies). Properties like sentience, capacity for suffering, or relational ties are irrelevant unless the narrative highlights them.
  2.  **Mechanical Signaling:** Framing is operationalized through dedicated mechanics (karma meters, chaos systems, binary choices) that only trigger for pre-scripted interactions with designated NPCs. These mechanics exist in isolation from the core combat loop.
  3.  **Player Character Focus:** The systems track *player virtue/vice* (honesty, cruelty, restraint) *as demonstrated toward narratively recognized patients*. Harming a "non-patient" NPC (combatant) is neutral; harming a "patient" NPC (civilian) is vice. The "harm" itself is fictional; the tracked object is the player's *choice* relative to the designer's framing.
  4.  **Coherence & Stability:** This avoids collapse into inherent patienthood because the theory denies inherent properties matter. It coheres internally as a purely conventional system: "X matters morally because (and only because) the game says X matters morally." Stability comes from the designer's authority to define the moral universe. Rewards for virtue (like loot) reinforce the system's rules but don't contradict it; they incentivize adherence to the designer's moral framework.

  ### Strict Presuppositions vs. Compatible Views
  *   **Strictly Presupposed:**
      *   Moral status is not intrinsic to NPCs but assigned by authorial fiat.
      *   Only narratively framed NPCs are potential moral patients.
      *   Player actions towards these designated patients reflect on the player character's virtue/vice.
      *   Harm to non-designated NPCs carries no moral weight.
  *   **Compatible With (But Not Required):**
      *   **Virtue Ethics:** Systems often resemble virtue tracking (honor, karma).
      *   **Contractualism:** Some rules might imply a social contract only protecting certain NPCs.
      *   **Sentience/Subjectivity:** Designers *may* frame characters with apparent sentience (Little Sisters), but the theory doesn't *require* this property; a nonsentient object could be framed as morally weighty.
      *   **Consequentialism:** Outcomes (chaos, endings) matter, but only for designated acts; mass slaughter of non-patients has no negative consequences.

  ### Philosophical Underdetermination
  The practice is consistent with multiple rival accounts of fictional beings:
  1.  **Fictional Emotivism:** Moral weight reflects the emotions the narrative aims to evoke, not properties of the NPC. Framing triggers the intended emotional response (guilt, compassion).
  2.  **Authorial Command Theory:** "X is wrong" means "the designer prohibits harming X (in this context)." The moral rule is defined by the game's code/narrative.
  3.  **Limited Recognitionism:** NPCs have no *real* moral claims, but the game simulates a world where *some* beings *within the fiction* are recognized as having moral standing by other fictional agents (e.g., society protects civilians, not bandits).
  4.  **Player-Character Relationalism:** Status arises from potential relationships the *player character* could have with the NPC (e.g., Little Sisters can be "adopted," civilians can be conversed with, enemies cannot).

  ### Alternative Game Designs Based on Different Presuppositions
  1.  **Equal Weight for All NPCs:**
      *   **Changes Required:** Every kill (combatant, civilian, animal) must carry moral/mechanical consequence. Karma/Chaos systems trigger universally. Resources might deplete with excessive killing; ecosystems collapse; communities become permanently hostile or extinct; companions react negatively to *all* violence. Combat would need justification beyond "they attacked first" (e.g., severe scarcity, unambiguous self-defense). Respawning would break immersion and likely be abandoned. Games like *This War of Mine* or *Pathologic* approach this, emphasizing survival cost and pervasive consequence.
      *   **Presupposition:** All NPCs possess inherent moral standing (e.g., basic sentience, interest in continued existence) that cannot be revoked by narrative role or player goals.

  2.  **Abandoning Moral Tracking as Incoherent:**
      *   **Changes Required:** Remove all karma meters, binary "moral" choices, and narrative consequences tied to player "virtue." NPC deaths (friendly or hostile) serve only functional or aesthetic purposes (clearing a path, resource gain, atmosphere). Player actions are judged solely by strategic success or failure, not ethical alignment. Games like *Doom (2016/Eternal)* or *Hotline Miami* embrace this amoral power fantasy. Violence is spectacle or puzzle-solving, devoid of ethical baggage.
      *   **Presupposition:** Applying moral concepts to fictional entities within a rule-based simulation is fundamentally incoherent or irrelevant. Player choices lack ethical significance; only gameplay outcomes matter.

  **Conclusion for the Student:** The game industry does *not* have a worked-out philosophical position. Its design practice is a pragmatic convention driven by narrative focus, gameplay loop requirements (combat needs "acceptable targets"), and technical limitations, resulting in an *implicit, unexamined theory* of narrative-conferred moral patienthood. It reveals more about storytelling techniques and player psychology than a coherent stance in the moral status debate.
