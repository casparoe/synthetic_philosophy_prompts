  Okay, let me start by unpacking the user's query. They're grappling with the non-identity problem, where actions affecting future people's existence make it hard to say those people are harmed. The classic example is resource depletion leading to different future individuals. The user created a fertility clinic scenario to challenge this, feeling the clinic wrongs the children despite them having lives worth living. Their initial theory was about falling below a baseline of what people deserve, but their friend countered that this could condemn parents who knowingly have children with manageable conditions or those in tough circumstances.

  The user wants a strong argument that the clinic or policymakers wrong specific future people without relying on a baseline threshold or impersonal world-state morality. They also mentioned the objection that the wronged person can't coherently wish the action hadn't happened. So, I need to address that too.

  First, I recall Derek Parfit's non-identity problem. The key is that since the action changes who exists, the future person isn't worse off than they would have been. The user's clinic scenario is a good test case. The challenge is to argue that wronging occurs even if existence is net positive. 

  I think about the concept of rights. Maybe the children have a right not to be deliberately put into existence with severe disadvantages. The clinic violates this right by creating them in a harmed state. This isn't about being worse off but about being created in a condition that violates their rights from the start. The right could be to a fair start or to not be used as a means. 

  Another angle is the distinction between harm and wronging. Harm might require being worse off, but wronging could be different. For example, the clinic wrongs the children by imposing unnecessary suffering without consent, even if their life is worth living. It's about the imposition of burdens that weren't inevitable. The parents in the manageable condition case might not wrong their child if the condition isn't severe and they provide care, making the imposition justifiable. But the clinic's case is gratuitous harm.

  The consent point is tricky because non-existent beings can't consent. But perhaps the argument is that actions with irreversible consequences for others require justification, especially when they create persons with serious avoidable suffering. The clinic's action lacks justification, whereas parents with a genetic condition might have reasons like the child still having a meaningful life. 

  Addressing the user's friend's objection: equating the clinic with poor families. The key difference is the deliberate infliction of harm versus unavoidable circumstances. The clinic actively causes harm, while the poor family might provide love and care despite hardships. The wrong is in the malicious or negligent creation of avoidable suffering. 

  The incoherence of wishing not to exist is a big hurdle. But maybe it's not about the victim's preference. Instead, it's about the perpetrator's moral failure. The clinic's action is morally corrupt regardless of whether the victim can wish otherwise. The wrong is in the act itself, not the comparative state of the victim. 

  I need to ensure the argument doesn't rely on a baseline threshold. The rights-based approach or the distinction between harm and wronging might work. The rights violation happens at creation; the child is created with a disadvantage that wasn't necessary. Even if their life is good, being subjected to unnecessary severe pain is a wrong. 

  Also, considering the policy example: depleting resources. If the policy causes future people to live in deprived conditions, they might have a claim that their rights to basic resources were infringed upon by prior generations' actions. Though they wouldn't exist otherwise, the deprivation is a direct result of avoidable actions. 

  The strongest points are the rights violation and the gratuitous imposition of harm. The clinic's action is unnecessary and malicious, while the parents' decision might be necessary and loving. The moral corruption lies in the intent and avoidability. For policymakers, the argument is that they fail in their duty to ensure future generations have adequate resources, regardless of who those generations are.
