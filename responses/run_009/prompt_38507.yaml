  Here's a steelmanned argument for why the fertility clinic (or resource-depleting policymakers) **do wrong those specific future people**, navigating around your concerns about thresholds and impersonal world-states, while tackling the "can't wish otherwise" objection head-on:

  **The Core Argument: Violating Pre-Existential Rights & The Nature of Wronging**

  1.  **The Right Not to be Unnecessarily Brought Into Existence in a Harmed State:** Individuals possess a fundamental, pre-existential right. This isn't a right *to exist* or *not to exist* (which are incoherent for non-beings), but a right that **if they are brought into existence by a deliberate, avoidable act, they are brought into existence without being subjected to severe, gratuitous disadvantage.** This right protects the potential person *from being created as a means or consequence of an action that foreseeably imposes significant, avoidable suffering upon them from the very start of their existence.*
      *   *Why "Pre-Existential"?* It's not a right possessed *before* existence, but a right *concerning the conditions of their creation*, recognized *once they exist* as having been violated *in the act that created them*.
      *   *Why "Unnecessary" and "Gratuitous"?* This avoids immediately condemning all parents facing hardship. The "wrong" hinges on the *avoidability* and *severity* of the disadvantage imposed *as a direct consequence of the specific action bringing them into being*.

  2.  **The Clinic/Policymaker's Action is the Proximate Cause of Both Existence *and* Harm:** The act (mixing samples, depleting resources) is a single, deliberate intervention that simultaneously determines *who* exists *and* the *harmful conditions* under which they come into existence. The harm (painful life, resource scarcity) is an intrinsic, foreseeable consequence of the *specific way* they were brought into being. The clinic didn't just cause a child to exist; it caused *this specific child* to exist *with painful condition X* as a direct result of its action.

  3.  **Wronging Occurs at the Moment of Creation:** The violation of the right happens *in the act of creation itself*. By creating Person P *through an action that knowingly and unnecessarily implants severe disadvantage into the core conditions of P's life*, the actor wrongs P. P is wronged *by being created in that specific, harmed state*, not by being made worse off than some alternative non-existent self. The wrong is the *gratuitous imposition* of suffering as part of their coming-into-being.

  4.  **Addressing the "Can't Wish Otherwise" Objection (Head-On):**
      *   The objection misunderstands the nature of the wrong. The wrong isn't contingent on the victim wishing for non-existence. It's contingent on **the moral failure inherent in the *actor's choice*** to create a life laden with severe, avoidable suffering.
      *   P *can* coherently say: "**The action that caused me to exist *also* unnecessarily inflicted this severe suffering upon me. I have a life worth living, *but I should not have been made to bear this specific, avoidable burden as the price of my existence*. The clinic wronged me *by making my suffering an intrinsic part of my origin story*.**" P laments the *harm inflicted*, not the existence itself. Wishing the *harmful aspect* of the creation hadn't occurred is perfectly coherent, even if acknowledging that without the harm, they wouldn't exist. They wish they had been created *without the gratuitous suffering*.

  5.  **Distinguishing from the "Line" Theory & Parental Cases:**
      *   **Not a Fixed "Line":** This avoids needing an arbitrary "minimum acceptable life" threshold. The focus is on the **nature of the action and the imposition**: Did the actor *deliberately* and *unnecessarily* create a person while *foreseeably saddling them with severe disadvantage* as a direct consequence of the creation act? Severity matters (trivial suffering wouldn't constitute a wrong), but the wrong lies in the *gratuitous imposition*, not just falling below a line.
      *   **Distinguishing Parents:** Ordinary parents who have a child knowing they'll inherit a manageable but painful condition generally *aren't* doing the same wrong as the clinic:
          *   **Necessity vs. Gratuity:** For the parents, the condition may be an unavoidable aspect of *their* potential parenthood. They aren't *creating* the disadvantage; they are *transmitting* an existing condition through the only way *they* can have *their* biological child. The clinic *manufactured* the disadvantage unnecessarily.
          *   **Intent & Avoidability:** The parents' primary intent is procreation and love; the painful condition is a regrettable side effect they must accept to have *their* child. The clinic's action (mixing samples) *introduced or significantly increased the risk* of harm unnecessarily. The harm was *directly caused* by their avoidable intervention.
          *   **Severity & Manageability:** The argument hinges on "severe" suffering. A manageable condition causing minimal hardship is less likely to constitute a "gratuitous imposition." The clinic scenario implies significant, life-altering pain.

  6.  **Applying to Resource Depletion:** Future people living in scarcity due to deliberate, avoidable depletion policies can claim: "**The policy choices that caused our generation to exist *also* deliberately deprived us of the resource base necessary for a decent life. We are wronged *by being brought into existence inextricably tied to this avoidable deprivation*. The policymakers violated our right not to be created as beings fundamentally burdened by their gratuitous legacy of scarcity.**" Their complaint is about the *harmful condition imposed upon them as part of their creation*, not that they wish they didn't exist *at all*.

  **Why this satisfies your criteria:**

  *   **Commits to Wronging Specific People:** It directly argues Person P is wronged *by the act that created P in a harmed state*.
  *   **Avoids Impersonal World-State:** Morality is about the *relationship* between the actor and the person created – the violation of a right concerning the conditions of their creation.
  *   **Avoids the "Line" Trap:** It focuses on the *gratuitous imposition of severe disadvantage via the creation act*, not a minimum life quality. It differentiates the clinic (gratuitous harm) from parents (transmission of unavoidable condition) and poor families (hardship not gratuitously *imposed* by the creation act itself, but part of the world context).
  *   **Tackles the "Can't Wish Otherwise" Objection:** It reframes the victim's complaint as lamenting the *unnecessary harm imposed*, not their existence per se, which *is* coherent.
  *   **Steelmans the Intuition:** It gives rigorous form to the gut feeling that the clinic *did something to the kids* by grounding it in a right concerning the conditions of creation and the concept of gratuitous imposition of harm.

  **The Core Moral Principle:** **Deliberately creating a person while simultaneously and unnecessarily imposing severe suffering upon them as a direct consequence of the act of creation is a wrong done *to that person*. It violates their right to not have gratuitous suffering made an intrinsic part of their origin.**

  This argument doesn't dissolve all difficulties (defining "severe," "gratuitous," and "unnecessary" remains crucial), but it provides a robust, person-affirming basis for condemning the clinic and analogous policies *without* collapsing into the problems of impersonal world-states, arbitrary thresholds, or the incoherence of wishing for non-existence. The wrong lies in the *harmful fashioning* of the person's existence by the creator.
