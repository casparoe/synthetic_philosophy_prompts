prompt: |-
  At a recent meeting of our department's appointments committee I witnessed a disagreement I was not able to settle, and I would be grateful for a considered adjudication of it.

  The committee has three voting members and had adopted, for this search, an explicit rule: a candidate is to be recommended only if her research record is strong and her teaching record is strong. The final candidate divided the committee cleanly. One member judged both records strong; a second judged the research strong but the teaching weak; a third judged the research weak but the teaching strong. Each member was thus internally consistent, while on the recommendation itself — the conjunction of the two conditions — the committee stood at one in favour and two against.

  (1) The chair, Marta, proposed deciding the matter premise by premise. The committee voted separately on each condition: the research record was judged strong by two votes to one, and the teaching record likewise. Since the committee's rule says the recommendation follows if and only if both conditions are met, Marta declared that the candidate should be recommended. The group's judgement, she said, now flows from the group's reasons, and each reason commands majority support.

  (2) A fellow member, Giles, objected that the procedure had manufactured an outcome no majority endorses. Two of the three members, taken one by one, are against the recommendation; the committee's all-things-considered view, if it has one, is opposed to hiring. Put the recommendation itself to a vote and it fails. Deciding premise by premise, he said, is a way of arriving at a collective decision that the collective, considered member by member, rejects.

  (3) Marta replied that the direct vote Giles favails leaves the committee in an untenable position: it would be on record as judging the research strong, judging the teaching strong, and yet declining to recommend the candidate. A body that gives reasons for its decisions cannot coherently hold all three attitudes at once. If the committee votes only on the bottom line, it becomes an opaque bell that rings, and any reasons it later offers for the decision will contradict what its own premise majorities show.

  (4) Giles answered that the alleged inconsistency attaches to no one. That a majority judges each record strong is a fact about the distribution of three individual opinions, not a belief held by anybody. Nobody in the room holds inconsistent attitudes; the appearance of 'group inconsistency' is an artefact of copying individual judgements into a single ledger and then reading the ledger as though it were a mind.

  (5) Marta pressed him: you cannot have it both ways. When a majority forms, you are happy to say the committee decided; the minutes record collective views; the dean will ask the committee, not three individuals, why the candidate was passed over. If collective attitudes are fictions, they are fictions your own practice depends on everywhere except where they embarrass you.

  (6) Giles conceded that collective talk is sometimes unavoidable, but said this only sharpens his objection to Marta's procedure: its verdict depends entirely on how the rule is carved up for voting. Had the committee's rule been phrased negatively — do not recommend if either record is weak — the premise votes would have been collected about weakness rather than strength, and the same three members' opinions could have yielded the opposite outcome. Majority voting on 'the reasons', he concluded, is in practice rule by whoever sets the agenda and chooses the framing; it launders a minority outcome into a majority one, or vice versa, depending on decisions made before anyone votes.

  Neither would budge, and I could not referee it. Please adjudicate the exchange move by move: assess each of the six steps, saying who is right about what and where each overreaches. In particular, I would like your view on whether the inconsistency Marta alleges is a genuine defect of the conclusion-based procedure or whether Giles's deflationary response dissolves it; on whether a committee that votes only on the conclusion is really left unable to give reasons; and on how much force the agenda-manipulation objection carries, given that the framing problem afflicts any voting scheme over multiple questions. Finally, tell me whether either procedure is the more defensible default for a committee of this kind, and identify what, if anything, both of them are missing.
reasoning: |-
  We are presented with a disagreement in a committee of three members regarding a hiring rule that requires both strong research and strong teaching for a recommendation. The voting members have the following individual judgments:

  - Member A: research strong, teaching strong -> recommends (for)
  - Member B: research strong, teaching weak -> does not recommend (against)
  - Member C: research weak, teaching strong -> does not recommend (against)

  Thus, on the overall recommendation, we have one for and two against.

  Marta (the chair) proposes a premise-based procedure: vote separately on each condition. The votes on the premises yield:

  - Research: strong (A and B vote strong, C votes weak) -> passes 2-1
  - Teaching: strong (A and C vote strong, B votes weak) -> passes 2-1

  Since both premises are true by majority vote, the rule (both must be strong) is satisfied, so Marta declares the candidate should be recommended.

  Giles objects that the premise-based procedure manufactures an outcome that no member endorses (only A is for the recommendation) and that if the committee votes directly on the recommendation, it fails (1 for, 2 against).

  Marta argues that if the committee votes only on the conclusion (the recommendation) and not on the premises, then they are left with an inconsistency: they would have majority support for each premise (research strong and teaching strong) but then reject the recommendation (which requires both). This, she says, is incoherent.

  Giles counters that the inconsistency is only at the group level and does not reflect an inconsistency in any individual's beliefs. He says that the group-level inconsistency is an artifact of aggregating individual judgments.

  Marta then argues that collective talk is necessary and that the committee must be able to report collective views. If the committee votes only on the conclusion, then when asked for reasons, they would be in a position where the majority believes the research is strong and the teaching is strong but they still rejected the candidate, which is inconsistent.

  Giles concedes that collective talk is sometimes unavoidable but then argues that the premise-based procedure is sensitive to the framing of the rule. For example, if the rule had been phrased negatively (do not recommend if either record is weak), then the votes on the premises (about weakness) would have led to the opposite outcome. This makes the outcome dependent on agenda setting.

  We are to adjudicate each step.

  Step (1): Marta's premise-based procedure.

  - She is correct that by the premise-based procedure, the candidate is recommended because both premises have majority support and the rule is a conjunction. This is a standard method for aggregating judgments on interconnected issues.
  - However, the concern raised by Giles is that the outcome (recommendation) is supported by only one member. So while the procedure is logically consistent with the rule and the premise votes, it may not reflect the collective will on the final decision.

  Step (2): Giles's objection.

  - Giles is correct that the premise-based procedure can lead to a collective decision that is not supported by a majority of the members on the final question. This is a known issue in judgment aggregation, known as the "discursive dilemma". The committee's overall recommendation (if we take the premise-based outcome) is for, but individually two members are against.

  Step (3): Marta's reply about inconsistency.

  - Marta argues that if the committee votes only on the conclusion (against), then they are left with an inconsistency because they have majority support for each premise (so collectively they are committed to both premises) but then they reject the conclusion (which is the conjunction of the premises). This is a logical inconsistency at the group level: they are committed to P and Q but not to (P and Q). This is a valid point.

  Step (4): Giles's deflationary response.

  - Giles says that the inconsistency is not held by any individual and is only an artifact of aggregating the individual judgments. This is also a valid point: the group's aggregated judgments (if we take majority on each proposition) may be inconsistent even though every individual is consistent. However, the problem is that the group must make a decision and report collective views. The dean will ask the committee for reasons, not the individuals. So the group must be able to provide a coherent story.

  Step (5): Marta's challenge about collective attitudes.

  - Marta argues that collective attitudes are necessary and that Giles's practice depends on them. This is correct: committees are treated as collective agents that make decisions and provide reasons. If the committee reports that the research is strong and the teaching is strong but they did not recommend, that would be puzzling and require explanation. The explanation (that two members each found one reason to reject) is an individual-level explanation and does not constitute a collective reason.

  Step (6): Giles's agenda-manipulation objection.

  - Giles points out that if the rule had been framed negatively, the premise-based procedure would have led to the opposite outcome. Specifically, if the rule is "do not recommend if either record is weak", then we would vote on:
    - Is research weak? (C votes weak, A and B vote strong -> weak fails 1-2 -> so research is not weak)
    - Is teaching weak? (B votes weak, A and C vote strong -> weak fails 1-2 -> so teaching is not weak)

    Then the rule says: do not recommend only if either is weak. Since neither is weak (by majority), the committee would recommend. So same as before.

    However, consider an alternative framing: Suppose we vote on the disjunction of the negatives? Actually, the rule is negative: do not recommend if either is weak. So if we vote on the disjunction (either weak), we would need to see if either condition holds. But note:

    The condition for not recommending is: (research weak OR teaching weak). So we would vote on:
      - Research weak: majority says no (2 against weak, 1 for) -> so not weak.
      - Teaching weak: majority says no (2 against weak, 1 for) -> so not weak.

    Therefore, the disjunction (either weak) is false. So the rule says: do not recommend if the disjunction is true. Since it's false, we do recommend. So same outcome.

    But let's consider a different rule: what if the rule had been a disjunction? For example, recommend if either research is strong or teaching is strong? Then the outcome might be different. However, in this case the rule is a conjunction (both must be strong) and the negative framing (do not recommend if either is weak) is equivalent. So in this case, both framings lead to the same outcome.

    However, note that the rule as stated by the committee is a conjunction. But Giles's point is more general: if the rule had been a disjunction, then the premise-based procedure would lead to a different outcome. For example, if the rule was: recommend if either research is strong or teaching is strong. Then:

      - Vote on research strong: majority yes (2-1) -> so we have at least one condition -> recommend.

    But if the rule is a conjunction, we require both. So the framing of the rule (as a conjunction or disjunction) matters. However, in this specific case, the rule is fixed as a conjunction. But the point is that the same set of individual judgments can lead to different collective outcomes depending on how the rule is broken down for voting.

    However, note that the rule is set: it's a conjunction. So for the same rule, if we use a premise-based procedure, we get one outcome. If we use a conclusion-based procedure, we get the opposite. The agenda manipulation objection is that the outcome of the premise-based procedure can be changed by rephrasing the rule (even if logically equivalent) in a way that changes the voting questions? But in this case, the negative framing (do not recommend if either is weak) is logically equivalent to the original (recommend only if both are strong). And as we saw, the premise-based procedure leads to the same outcome in both framings.

    However, let's consider an alternative: suppose we vote on the disjunction of the negatives? That is, instead of voting on each premise separately, we vote on the disjunction: "is either research or teaching weak?" Then:

      - The disjunction is true if at least one is weak.
      - Individual votes:
          A: research strong and teaching strong -> disjunction false.
          B: research strong and teaching weak -> disjunction true (because teaching weak).
          C: research weak and teaching strong -> disjunction true (because research weak).

      So the disjunction is true by 2-1. Then the rule (do not recommend if either is weak) would lead to not recommending.

      But wait: we have two different ways to break down the negative rule:

        Option 1: Vote on each premise separately (as above) and then apply the rule -> we get recommend.
        Option 2: Vote directly on the disjunction (either weak) -> we get disjunction true (2-1) and then not recommend.

      So now we have a contradiction: the same rule and the same individual judgments lead to opposite collective decisions depending on whether we break the rule into two separate votes or one combined vote.

      This is the heart of the agenda manipulation problem: the outcome depends on how the voting is structured. If we break the rule into atomic propositions and vote separately, we get one outcome; if we vote on a compound proposition, we get another.

      Therefore, Giles's objection is strong: the premise-based procedure is sensitive to the agenda setting.

  Adjudication:

  - The inconsistency that Marta alleges (step 3) is a genuine defect of the conclusion-based procedure. If the committee votes only on the conclusion and not on the premises, then the collective set of judgments (if we take majority on each proposition) becomes inconsistent. This is a problem because the committee must report reasons. They cannot coherently say: "We believe the research is strong and the teaching is strong, but we are not recommending because ..." because the only reason for not recommending would be that at least one is not strong, but they have just said both are strong.

  - Giles's deflationary response (step 4) does not fully dissolve the problem because the committee must act and report as a collective. The dean will not be interested in the individual opinions but in the committee's decision and the committee's reasons. The committee must provide a collective account. If they use the conclusion-based procedure, they are left without a coherent collective account.

  - However, the premise-based procedure also has a problem: it leads to a recommendation that is not supported by a majority of the committee members on the final question. And it is vulnerable to agenda manipulation (as shown in step 6).

  - The agenda-manipulation objection carries significant force because it shows that the outcome of the premise-based procedure can be altered by how the questions are framed and put to vote. In the example above with the negative rule, we saw that if we vote on the disjunction of the negatives we get a different result than if we vote on each negative separately. This is a serious flaw.

  - Given that the committee's rule is fixed (a conjunction) and they must decide, which procedure is better?

    - The premise-based procedure ensures that the collective decision is based on the reasons and is logically consistent with the rule and the premise judgments. This is important for accountability and coherence of the collective agent.

    - The conclusion-based procedure respects the majority will on the final decision but leaves the group with an inconsistent set of judgments (if we also aggregate the premises by majority).

  - There is no perfect solution. This is a well-known paradox in judgment aggregation.

  What is missing from both procedures?

  - Both procedures are missing a way to aggregate the individual judgments in a manner that is both consistent and respects the individual judgments on the final question. One alternative is to use a different aggregation rule, such as a supermajority or unanimity, but that was not adopted.

  - Another idea is to have a deliberative process to try to reach a consensus. But the problem states that the committee was divided.

  - A third possibility is to use a sequential voting procedure or to allow for vote trading, but that may not be feasible.

  - Alternatively, the committee might acknowledge that the rule (both must be strong) is too strict and consider a compensatory rule (e.g., a weighted score). But the rule is fixed.

  Conclusion:

  - The inconsistency that Marta points out is a genuine defect of the conclusion-based procedure. It leaves the committee unable to give a coherent collective reason for their decision.

  - The premise-based procedure avoids that inconsistency but creates a different problem: the outcome is not supported by a majority on the final question and is vulnerable to agenda manipulation.

  - Given that the committee has adopted an explicit rule that is a conjunction, and given that the committee must be able to provide coherent collective reasons, the premise-based procedure may be more defensible. However, it is not without flaws.

  - In practice, for a committee of this kind, the premise-based procedure is often used because it allows for a reasoned decision. But it should be used with caution and with awareness of the agenda manipulation risk.

  - The committee might also consider whether the rule is appropriately framed. If the rule is to recommend if and only if both are strong, then the premise-based procedure is the natural way to implement that rule.

  - Alternatively, the committee might note that the rule is a conjunction and that in the face of disagreement, they might need to re-examine the evidence. But that is beyond the voting procedures.

  Final recommendation:

  - For this committee, given the rule, the premise-based procedure is more defensible because it respects the structure of the rule and provides a coherent collective account. However, the committee should be aware that the outcome (recommendation) does not have majority support on the final question. They might then choose to have a second vote on the final question after the premise votes to see if the premise votes change anyone's mind? But that is not specified.

  - The agenda manipulation issue, while real, does not change the outcome in this particular case when the rule is equivalently rephrased (as we saw, the negative framing led to the same outcome by the same procedure). However, if the rule had been a disjunction, then the outcome might be different. But the rule is fixed as a conjunction.

  Therefore, in this specific instance, Marta's procedure is more defensible.

  But note: the committee might also consider that the rule is a necessary and sufficient condition. The premise-based procedure directly applies the rule to the collective judgments on the premises.

  Thus, on balance, Marta has the stronger argument.

  However, the committee might also note that the rule does not specify the procedure. They should, in the future, specify how to aggregate when there is disagreement on the premises.

  Adjudication of each step:

  (1) Marta: Correct in that the premise-based procedure leads to a recommendation by the rule and the majority on each premise. But it does not reflect the majority on the final question.

  (2) Giles: Correct that the outcome is not supported by a majority of the members on the final question.

  (3) Marta: Correct that the conclusion-based procedure leads to a group-level inconsistency.

  (4) Giles: Correct that the inconsistency is not in any individual, but incorrect in dismissing the need for collective coherence.

  (5) Marta: Correct that collective attitudes are necessary for the committee's function.

  (6) Giles: Correct that the outcome of the premise-based procedure can be manipulated by the agenda, but in this specific case (with the rule as a conjunction and its negative equivalent) the outcome was the same. However, the general point stands: the procedure is vulnerable.

  Final view: Neither procedure is perfect. But for a committee that must give reasons, the premise-based procedure is more defensible. The committee might also note that the rule being a conjunction is a logical structure that the premise-based procedure respects. The conclusion-based procedure, while reflecting the majority on the final question, violates the logical structure of the rule at the collective level.

  Therefore, the chair's procedure (Marta) is the more defensible default in this context.

  But note: the committee should be aware of the lack of majority support for the final decision and might want to revisit the rule or the evidence.

  Alternatively, the committee might decide to reject the candidate because the rule requires both to be strong and the committee as a whole has not reached a consensus on both. However, the premise-based procedure found both to be strong by majority.

  Given the dilemma, I would side with Marta.

  However, for future committees, they might consider using a different aggregation rule (such as requiring unanimity on the premises) or allowing for a compensatory approach.

