    - If we deny one of the pairwise judgments, then which one? They all seemed reasonable at the time. This is the problem of pinpointing where the change happens.
    - In this case, the pairwise judgments were based on total happiness, while the direct comparison might be based on average or something else. So the might deny that the same standard was used throughout.

  Predictable problems:

  - In the pairwise choices, not everyone may agree. For example, in the first few steps, some might think the drop in average happiness is not worth the gain in population. So for S1 vs S2, some might vote for A. Then the chain is broken. We need to ensure that the majority vote is for the next society at each step.

  - In the direct comparison between A and J, not everyone might agree that A is better. Some might stick to total utilitarianism and say J is better.

  - The groups might be inconsistent in their criteria.

  What the activity can't reproduce:

  - The spectrum argument in philosophy is about what a rational agent ought to prefer, not what a group of people do prefer. The activity might be swayed by psychological factors and not reflect rational inconsistency.

  - The activity might not force the students into the paradox if they are not committed to the same standard of comparison throughout.

  To mitigate, we can:

  - Emphasize that they should use the same criterion for all judgments: overall goodness of the society.

  - If there's disagreement, we can take a majority vote and proceed, then in the debrief acknowledge that some people didn't experience the paradox.

  Concrete option for cards:

  Prepare 10 cards as follows:

  Card 1: Society A
     - Population: 100
     - Average happiness: 100 (on a scale where 0 is neutral)

  Card 2: Society B
     - Population: 200
     - Average happiness: 95

  ...

  Card 10: Society J
     - Population: 51,200
     - Average happiness: 55

  We can use letters A to J for the societies.

  In the activity, for each pairwise choice, we show the two cards.

  Then at the end, show card A and card J.

   This should work.
