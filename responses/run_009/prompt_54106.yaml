prompt: |-
  I'm running a discussion section for a first-year undergraduate course in intermediate microeconomics, and next week I'm responsible for revealed preference — the idea, going back to Samuelson, that if a consumer chooses bundle A when bundle B was affordable at the same prices and income, they've revealed that they prefer A to B, and that in principle we can build up the entire preference ordering from observed choices, without ever mentioning utility as an inner quantity. My students will have just come from a block on utility functions, and most of them think of utility the way the textbook trained them to: a number inside your head that choices are designed to make big. The section is fifty minutes, chalkboard only, about twenty students, and I've been told not to re-derive anything formally — no axioms, no proofs, just the concept.

  Plan the explanation rather than giving it to me. What has to be established first so that the point isn't heard as merely bookkeeping? What single concrete example should carry the whole thing — I've considered using a cafeteria tray with changing daily prices, but I'm open to something better, and I'd like the example chosen so that it shows both what revealed preference can recover and what it structurally cannot (why choices alone stay silent about the strength of preferences or about what someone would have done in situations that never arose). The misconception I most expect is the circularity one — students concluding that "utility is whatever you choose" and "you choose whatever maximizes your utility" is a pointless closed loop — and I want to know exactly where in the sequence to confront it, not as an objection at the end but as a fork in the road: either the theory is a tautology dressed up, or the weak axiom has actual bite, and where exactly that bite shows up. I'd also like to know what to deliberately refuse to cover — I suspect something should be said about where this all breaks when preferences shift over time or when the consumer isn't one person but a household, but tell me if that's a bridge too far for this audience, and what to say when someone raises it anyway. Finally, give me one question I can pose in the last five minutes whose answer would tell me whether they've genuinely grasped revealed preference as a constraint on explanations rather than a description of an inner number, as opposed to having just learned to parrot the cafeteria example back at me.
reasoning: |-
  Okay, the user is running a discussion section for intermediate microeconomics on revealed preference. They want to plan an effective 50-minute chalkboard session without formal proofs. Let me unpack their needs.

  First, they need to transition students from utility functions to revealed preference. The students are used to utility as an internal number. Revealed preference flips that—preferences come from choices. The key is to show this isn't circular. The user mentioned the cafeteria example but is open to others. They want an example that shows both capabilities and limitations of revealed preference.

  The main challenge is avoiding the misconception that it's a tautology. Students might think "utility is defined by choices" and "choices maximize utility" is circular. I need to break that loop. The weak axiom of revealed preference (WARP) is crucial here. If a student chooses A over B when both are affordable, they can't later choose B over A in a different situation where both are affordable. That's a testable constraint. 

  A grocery example might work better than cafeteria. Two bundles: apples and bananas. Week 1 prices and choice. Week 2 different prices. If they pick A in week 1 when B was affordable, then in week 2 if they pick B, but A was also affordable, that violates WARP. It shows the bite—actual inconsistency. 

  Limitations are important too. Revealed preference can't measure how much A is preferred over B, only that it is. Also, it can't predict choices in new price scenarios. The example should illustrate these points. 

  For the circularity issue, I should present it as a fork: either it's a tautology, or WARP has real bite. Use the violation scenario to show it's falsifiable. That's where the example comes in—showing a violation means inconsistent behavior, which isn't allowed.

  Don't cover time-varying preferences or households unless asked. If a student brings it up, acknowledge it's a limitation but beyond the scope. Focus on the core concept.

  The wrap-up question needs to test if they see revealed preference as a constraint. Maybe ask: "If a politician says higher taxes make people worse off, how would revealed preference assess that?" They should realize it depends on observed choices, not internal utility. If they mention needing data on choices before and after, that shows understanding.

  Also, timing: 50 minutes. Start with utility recap, introduce the idea shift, present the example with scenarios (normal choice, violation, non-comparable), discuss implications, address circularity explicitly, and end with the question. Keep it interactive with student participation.
answer: |-
  Here's a battle-tested plan for your 50-minute revealed preference discussion, designed to smash the "inner utility number" mindset and confront circularity head-on:

  **Core Objective:** Shift students from *utility-as-driver* to *choices-as-data*, showing revealed preference as a **logical consistency requirement** for rational choice, not a description of internal states.

  **The Anchor Example: Grocery Shopping (Superior to Cafeteria)**
  *   **Why Groceries?** More relatable, clearer "bundles" (Apples & Bananas), simpler price changes than composite meals. Avoids distractions like nutrition/health.
  *   **The Setup (Board Sketch):**
      *   Student Shopper: "Alex"
      *   Goods: Apples (A), Bananas (B). Measure in pounds.
      *   **Scenario 1 (Week 1):** Prices: P_A = $1/lb, P_B = $1/lb. Alex's Budget: $10. Alex Buys: **8 lbs A, 2 lbs B** ($8 + $2 = $10). Label this **Bundle X**.
      *   Highlight Affordable Alternatives: Draw the budget line. Point out Bundle Y (e.g., 4 lbs A, 6 lbs B) was affordable ($4 + $6 = $10) but Alex chose X instead.
      *   **Revealed Preference Statement:** "By choosing X when Y was affordable, Alex has *revealed* that X is *at least as good as* Y. We write X ≥ Y." Emphasize "at least as good as".
  *   **Scenario 2 (Week 2 - The Crucial Test):** Prices CHANGE: P_A = $2/lb, P_B = $0.50/lb. Alex's Budget: Still $10. Alex Buys: **1 lb A, 16 lbs B** ($2 + $8 = $10). Label this **Bundle Z**.
      *   **Question:** *Was Bundle X (8A, 2B) affordable in Week 2?* Calculate: (8 lbs A * $2) + (2 lbs B * $0.50) = $16 + $1 = $17 > $10. **NO.** → *Silence*. Revealed preference says nothing about X vs. Z. They are incomparable with this data.
  *   **Scenario 3 (Hypothetical - The Bite of WARP):** "What if, in Week 2 with the *same prices* (P_A=$2, P_B=$0.50, $10 budget), Alex had instead bought **Bundle Y (4A, 6B)**?" Calculate cost: (4 * $2) + (6 * $0.50) = $8 + $3 = $11 > $10. **NOT AFFORDABLE.** Cannot choose it. No issue.
  *   **Scenario 4 (Hypothetical - VIOLATION!):** "What if, in Week 2 with the *same prices*, Alex had bought **Bundle W (3A, 8B)**?" Calculate cost: (3 * $2) + (8 * $0.50) = $6 + $4 = $10. **AFFORDABLE.** Now ask: *Was Bundle W affordable in Week 1?* (3*$1 + 8*$1 = $11 > $10? **NO!**). BUT: In Week 1, Alex chose X over everything affordable, including... *was Y affordable?* (Yes, $4+$6=$10). **Conflict:** Week 1: Chose X, Y was affordable → X ≥ Y. Week 2: Chose W, X was affordable (3A*$2= $6, 8B*$0.50=$4, $10 total - *yes X is affordable!* (8A*$2=$16? **STOP! Mistake!**).
      *   **Correction (Critical):** "Wait! Let's check Bundle X *in Week 2 prices*: 8A * $2 = $16, 2B * $0.50 = $1, Total $17 > $10. **X was NOT affordable in Week 2!** So choosing W when X is *unaffordable* tells us nothing about X vs. W. *No violation.*"
      *   **Find the REAL Violation:** "What bundle *was* affordable in *both* weeks that could cause a problem? **Bundle Y!** Was Y affordable Week 1? (4*$1 + 6*$1 = $10, *Yes*). Week 2? (4*$2=$8, 6*$0.50=$3, Total $11 > $10? **NO!** $11 > $10. Not affordable in Week 2. Still safe.
      *   **Create the Violation:** "Imagine a **Week 3**: Prices P_A=$1.50, P_B=$1. Budget $10. Alex buys **Bundle V (2A, 7B)** = (2*$1.50=$3) + (7*$1=$7) = $10.
          *   Was X (8A,2B) affordable? (8*$1.50=$12) + (2*$1=$2) = $14 > $10? **NO**.
          *   Was Y (4A,6B) affordable? (4*$1.50=$6) + (6*$1=$6) = $12 > $10? **NO**.
          *   Was Z (1A,16B) affordable? (1*$1.50=$1.50) + (16*$1=$16) = $17.50 > $10? **NO**.
          *   **No problem yet.** "But what if Alex bought **Bundle Y (4A, 6B)** in Week 3?" (Cost $6+$6=$12>$10? **Not Affordable!** Can't choose it.) "What if Alex bought **Bundle U (5A, 2.5B)**?" (5*$1.50=$7.50) + (2.5*$1=$2.50) = $10. Affordable. No conflict with previous data (X, Y, Z weren't affordable in Week 3).
      *   **THE VIOLATION:** "Ah! Here's the problem bundle from Week 1: Remember Alex *didn't* choose **Y (4A, 6B)** in Week 1 when it *was* affordable, choosing X instead (X ≥ Y). Now imagine in **Week 4**: Prices go back to Week 1 levels! P_A=$1, P_B=$1, Budget=$10. BUT this time, Alex buys **Bundle Y (4A, 6B)**.
          *   **Conflict:** In Week 1 (same prices!), Alex chose X when Y was affordable → Revealed X ≥ Y. In Week 4 (same prices!), Alex chose Y when X was affordable → Would reveal Y ≥ X. If X ≥ Y and Y ≥ X, then X should be indifferent to Y. BUT: Choosing X over Y in Week 1 directly contradicts indifference! Alex *strictly* preferred X to Y in Week 1. **THIS is a violation of the Weak Axiom of Revealed Preference (WARP).** The data is inconsistent with stable, rational preferences. The "bite" is that choices in *identical* situations must be consistent. WARP rules out this specific type of reversal.

  **Sequenced Explanation (Chalkboard Flow):**

  1.  **(3 min) Bridge from Utility:** "Last week, we modeled choices using utility functions U(A, B). We *assumed* Alex has a U and picks the bundle on the budget line that gives the highest U. But how do we *know* U exists? Or what it is? Samuelson flipped it: Let's see what choices *tell us* about preferences, *without assuming U first*."
  2.  **(10 min) Core Concept & Grocery Week 1:** Introduce Alex, goods, prices, budget. Show choice (Bundle X). Draw budget line. Pick another affordable bundle (Y). Hammer home: "Choosing X when Y was affordable *means* X is revealed preferred to Y (X ≥ Y). Preference is *inferred* from the *act of choice*, not an inner number." Write "Revealed Preference: Choice reveals preference ordering."
  3.  **(12 min) Grocery Week 2 & Incompleteness:** Introduce new prices/choice (Bundle Z). Show X is unaffordable now. "Does choosing Z tell us Z is better than X? **No!** X wasn't an option. Revealed preference only compares bundles affordable *at the time of choice*. We learn Z ≥ [bundles affordable in Week 2], but that doesn't include X or Y. **Limitation 1: Choices only reveal preferences over options available *in that specific choice situation*. We can't compare everything.**"
  4.  **(15 min) Confronting Circularity & The Bite of WARP:**
      *   **The Fork:** "Okay, so choices reveal preferences. But isn't this circular? 'You prefer what you choose' and 'You choose what you prefer'? Sounds empty!"
      *   **The Answer:** "No! Because revealed preference imposes a **CONSTRAINT**: Your choices must be **CONSISTENT** across different situations. If you choose A over B when both are affordable, you can *never* later choose B over A *when both are affordable again under the same conditions*."
      *   **Demonstrate the Violation:** Walk through the "Week 4" scenario above where Alex buys Y under the original prices after previously buying X. Animate the contradiction. "This reversal **violates the Weak Axiom of Revealed Preference (WARP)**. WARP says this pattern is *impossible* for a rational consumer with stable preferences. This is the **testable bite** of the theory. It's not just bookkeeping; it forbids specific, observable inconsistencies." Label WARP clearly.
      *   **Limitation 2 (Strength):** Point back to Week 1: "We know Alex prefers X to Y. But *how much*? Does Alex *barely* prefer X or *strongly* prefer X? Revealed preference is silent. **Limitation 2: Choices reveal *order* (better/worse), not *strength* or cardinal utility.**"
  5.  **(5 min) Limitations Recap & Scope:**
      *   Summarize Limitations: 1) Only compares affordable bundles in each choice. 2) Only reveals order, not strength. 3) Can't predict choices under *new* price/budget combos (only says what's *inconsistent* via WARP).
      *   **What to Deliberately Refuse (Unless Asked):** Time-varying preferences ("Maybe Alex's tastes changed!") and Household decisions. **If Raised:** "Excellent point! Revealed preference assumes *stable* preferences over the choices we observe. If preferences shift or it's multiple decision-makers, the consistency (WARP) can break down, and we'd need more complex models. That's advanced territory, but crucial to remember – revealed preference relies on stability for clean interpretation." Don't dive deeper unless a sharp student pushes; acknowledge and move on.
  6.  **(5 min) The Key Wrap-Up Question:** Pose this: **"Suppose we observe Alex choose apples over bananas every single time both are affordable, regardless of prices or budget. Does revealed preference *prove* Alex has an internal 'disutility' for bananas or that bananas make Alex unhappy? Why or why not?"**

  **Why this question works:** It directly targets the misconception that revealed preference describes an inner state. The correct answer (**No**) forces them to articulate that revealed preference only tells us about the *ordering* revealed through consistent choices (A > B), not the *reason* or the *internal experience* (disutility, unhappiness). It reinforces that RP is about logical consistency of observable choices, not psychological explanation. Listen for answers like: "It only shows the ordering, not the feeling" or "We know Alex prefers apples, but not *why*" or "It doesn't tell us what's happening in Alex's head, just what they consistently choose."

  **Key Teaching Moves:**
  *   **Annotate Choices:** Constantly write "X chosen, Y affordable → X ≥ Y" on the board.
  *   **Hammer Affordability:** Drill "Was Bundle [ ] affordable *at that time, with those prices and budget*?" Make them calculate costs.
  *   **Violation Drama:** Make the WARP violation scenario feel like a detective uncovering an inconsistency. "Aha! This breaks the rules!"
  *   **Contrast Utility:** Explicitly say: "RP doesn't say Alex *has* a U or is *thinking* about U. It says *if* choices are consistent *like this*, then we can *model* Alex *as if* they have a stable preference ordering."
  *   **Embrace "As If":** Use the phrase "as if" when talking about preference recovery. "The choices allow us to model Alex *as if* they have stable preferences satisfying these axioms."

  This structure builds the concept step-by-step, uses a concrete relatable example, directly confronts the circularity objection with the power of WARP, highlights key limitations intrinsically within the example, and ends with a question testing the core conceptual shift. Good luck!
