prompt: |-
  I'm writing a dissertation prospectus, roughly two pages, and I'd like your help turning a half-formed idea into a proper proposal. Please take the role of a professional philosopher of cognitive science, someone who works on the classical problems of AI and knows the frame problem literature cold. Don't just draft; think through the territory first and sketch what the proposal must accomplish before committing to a structure.

  The idea, as it currently stands: the frame problem is discussed as if it were a single problem — roughly, the problem of how a system updating its beliefs about a changing world avoids being swamped by everything that stays the same, or everything that doesn't need to be re-derived, after each action. But I suspect it's really a bundle of several distinct problems that only look unified because they surfaced together in the original setting where the problem was posed: a toy robot world with a fixed inventory of state variables, change represented by explicit axioms, and an inference engine that had to be told, axiom by axiom, what remains untouched by each action. My hunch is that some members of that bundle are artifacts of that style of representation, and would simply dissolve under a different way of representing change — and that this is quietly visible in modern learning-based systems, which don't represent change as axioms at all and yet don't visibly struggle with the parts of the bundle that consumed so much ink in the classical literature. But I also suspect at least one member is invariant: a genuine feature of any agent that must, under real time pressure, decide what in its picture of the world needs re-examining after it acts. That invariant member, if there is one, is what the frame problem really is, and the rest is scaffolding we mistook for the building.

  Turn this into a proposal with the following components. State the question precisely enough that it has a determinate answer. Explain why the existing treatments leave it open — as I read them, they mostly argue about whether the problem was solved, whether by nonmonotonic techniques like circumscription, by more careful reasoning about events, or by just letting statistical learners take over; but none of them first asks which problem is being solved, and that question has to come first. Set out the method: I would build a taxonomy of the phenomena lumped under the label, then for each member ask what happens to it when the representation of change is swapped, holding a fixed set of cases constant across representations so the comparison is fair, and classify each member as artifact, invariant, or mangled — transformed into a different problem rather than made to disappear. Say what a positive result would look like and what would count as the project failing. And be honest about scope: this is one year of dissertation work, not a career, so tell me which parts to cut first if it threatens to sprawl.

  No citations or bibliography, please — I'll fill those in myself, and I don't want a literature review by name-dropping; positions and arguments can be described in prose, with the attributions left to me.

  Finally, tell me the single objection most likely to sink this at a prospectus meeting, and how the proposal should be worded to survive it.
reasoning: |-
  Okay, the user is working on a dissertation prospectus about the frame problem in AI and cognitive science. They have a half-formed idea that the frame problem isn't a single unified issue but actually a bundle of distinct problems. Some of these might be artifacts of specific representation methods (like the classical axiomatic approach), while others could be invariant across different systems. They want to transform this into a proper two-page proposal with specific components: a precise question, explanation of why existing treatments leave it open, methodology, success/failure criteria, and scope management.

  Hmm, let me think about the frame problem first. The user is right that it's traditionally treated as a monolithic issue in symbolic AI - how systems avoid recomputing everything that doesn't change after each action. But their insight about it being a bundle is perceptive. The original McCarthy/Hayes formulation was tied to that blocks-world style representation with state variables and axioms. Modern systems don't work that way at all - deep learning models just learn statistical patterns without explicit axioms. Yet they seem to handle some aspects of persistence just fine. That discrepancy is fascinating.

  The user's core question seems to be: Which parts of the frame problem are representation-dependent artifacts, and which are fundamental to any reasoning system? That's actually quite profound. Existing literature debates solutions (circumscription, event calculus etc.) but nobody's systematically disentangled the problem itself. That's the gap.

  For methodology, the taxonomy approach makes sense. We'd need to: 1) Identify all phenomena historically called "frame problem", 2) Map them to both classical and modern systems, 3) See which disappear when representation changes. The "mangled" category is smart - some problems might morph rather than vanish.

  Scoping will be crucial. One year means we must limit the case studies - maybe just 3-4 classic scenarios (like the Yale Shooting Problem) tested across 2-3 representations (symbolic, connectionist, probabilistic). Can't tackle every AI paradigm.

  The biggest threat? Someone arguing that modern systems do have implicit frames - the problem just went underground. The proposal should preempt this by defining "struggle" operationally - e.g., computational cost spikes or error types that map to classical symptoms. 

  User's clearly done their homework - they reference circumscription, know the literature. But they're wise to avoid citations in the draft; keeps focus on the argument. Their writing is precise - "scaffolding we mistook for the building" is a great phrase. 

  Main challenge will be making the comparison fair across incommensurable systems. How do you show a deep net isn't "struggling" with persistence? Might need proxy metrics like inference speed or transfer learning performance. Should flag this as a methodological risk.

  The philosophical stakes matter too. If part of the frame problem is invariant, it reveals something deep about real-time agency. That's the payoff - not just tidying up an old debate, but uncovering a timeless cognitive constraint.
answer: |-
  Here’s a structured prospectus draft addressing your core idea with philosophical rigor, methodological clarity, and strategic defenses against key objections. It prioritizes precision, scope management, and argumentative resilience.

  ---

  ### **Dissertation Prospectus: Disentangling the Frame Problem**  
  **Core Question:**  
  *Which components of the classical frame problem are artifacts of symbolic state-variable representations, and which constitute an invariant computational challenge for any agent operating under real-time constraints?*

  ### **Why the Question is Open & Existing Treatments Fall Short**  
  Existing literature treats the frame problem as monolithic, leading to two unresolved debates:  
  1. **Solution-First Approaches**: Classical AI (McCarthy, Hayes) sought technical fixes (e.g., circumscription, fluent occlusion) *within* axiomatic frameworks, mistaking representational artifacts (e.g., frame axioms) for the core problem.  
  2. **Dissolution Claims**: Critics (e.g., connectionists, probabilistic AI advocates) declare the problem "solved" by abandoning symbolic representations, but conflate *representational artifacts* with *invariant challenges*.  
  **Crucial Gap**: No systematic effort to disambiguate the problem bundle *before* evaluating solutions. Absent this, we cannot assess whether modern systems (e.g., deep RL) truly resolve the frame problem or merely sidestep its artifactual elements.

  ### **Methodology: Disambiguation via Representational Swap**  
  A three-step comparative analysis:  
  1. **Taxonomy Construction**:  
     - Catalog classical frame problem "symptoms" (e.g., frame axiom proliferation, qualification problem, ramification problem, inference combinatorics).  
     - Map these to *functional challenges* (e.g., persistence tracking, relevance detection, resource-bounded revision).  
  2. **Controlled Representational Swap**:  
     - Select 3–4 canonical "toy world" cases (e.g., Yale Shooting Scenario, Kitchen Sink domain).  
     - Re-implement each case in three distinct paradigms:  
       - *Classical* (axiomatic logic with state variables).  
       - *Modern* (e.g., neural network with vector embeddings; probabilistic graphical model).  
       - *Hybrid* (e.g., neurosymbolic system).  
     - **Fixed Parameters**: Identical environmental dynamics, action space, and perceptual inputs across representations.  
  3. **Artifact/Invariant Classification**:  
     - For each symptom (e.g., "exponential frame axioms"), observe:  
       - *Artifact*: Symptom vanishes or radically simplifies under non-symbolic representations.  
       - *Invariant*: Symptom persists or re-emerges as isomorphic computational cost (e.g., attention allocation bottlenecks).  
       - *Mangled*: Symptom transforms (e.g., axiom explosion becomes catastrophic forgetting in neural nets).  

  ### **Success Criteria & Failure Conditions**  
  - **Positive Result**: A defensible partition of symptoms into:  
    - *Artifacts* (≥2 symptoms tied solely to symbolic state variables).  
    - *Invariants* (≥1 symptom recurring across paradigms as a resource optimization challenge).  
    - *Mangled* (≥1 symptom transmuted but not eliminated).  
  - **Project Failure**:  
    - Symptoms resist classification due to incommensurable representational metrics (e.g., no clear mapping between axioms and network activations).  
    - All symptoms prove artifactual *or* all invariant, undermining the disambiguation thesis.  

  ### **Scope Management**  
  **Firm Boundaries**:  
  - Focus on *discrete, dynamic* environments (no continuous control tasks).  
  - Exclude perceptual uncertainty; assume accurate state observations.  
  - Use pre-existing implementations (e.g., PyTorch/SWI-Prolog wrappers) to avoid engineering overhead.  
  **First Cuts if Overwhelmed**:  
  1. Eliminate hybrid models.  
  2. Reduce case studies from 4 to 2 (retain Yale Shooting + 1 ramification-heavy domain).  
  3. Drop "mangled" analysis; focus on binary artifact/invariant distinction.  

  ### **The Killer Objection & Preemptive Defense**  
  **Objection**: *"If modern systems 'solve' classical symptoms without explicit reasoning, why call residual challenges 'the frame problem'? You're redefining the term post-hoc."*  
  **Response in Proposal**:  
  > "This project does not presuppose that residual challenges *are* the frame problem. It tests whether components of the classical problem—when functionally defined—re-emerge as *isomorphic resource-allocation bottlenecks* under time pressure. If they do, they warrant the inherited label because they fulfill the original problem’s *explanatory role*: characterizing how agents avoid computational paralysis during belief update. If they do not, the frame problem dissolves entirely—a decisive result."

  ---

  ### **Prospectus Structure**  
  1. **Problem Statement**: Frame problem as a bundled misconception (½ p.).  
  2. **Gap Analysis**: Critique of solution-first approaches & dissolution claims (⅓ p.).  
  3. **Core Thesis**: Artifact/invariant disambiguation via representational swap (⅓ p.).  
  4. **Methodology**: Taxonomy → cases → swap → classification (½ p.).  
  5. **Significance**: Resolving 50-year debates; clarifying modern AI’s relationship to classical challenges (⅙ p.).  
  6. **Scope & Limitations**: Boundaries, fallback cuts (⅙ p.).  

  **Why This Works**:  
  - Forces the question "Which problem?" before "Is it solved?"  
  - Uses *functional equivalence* (not implementation similarity) to compare paradigms.  
  - Preempts "redefinition" objections by anchoring invariance to *explanatory roles*.  
  - Survives prospectus review by being razor-focused on disambiguation, not grand theory.  

  **Next Step**: Flesh out your 2–3 key case studies—choose domains where classical frame axioms visibly struggle, but modern learners might excel (or reveal hidden costs).
