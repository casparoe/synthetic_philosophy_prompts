prompt: |-
  I've been defending two-dimensional semantics in my reading group, and someone finally cornered me with an argument that the framework cannot be doing the job it advertises. Some background first. Two-dimensional semantics assigns each expression two intensions. The secondary intension is the ordinary possible-worlds function, evaluated with our world fixed as actual. The primary intension is evaluated with each scenario considered as actual — it captures how the extension would fall out if that scenario were the way things really are. The framework's great advertisement is that it accommodates Kripke's necessary a posteriori truths: water is H2O is necessary (constant secondary intension) yet a posteriori (contingent primary intension — there are epistemically possible scenarios in which the watery stuff turns out to be something else). Here is the argument I can't answer.

  (1) A truth is a priori iff its primary intension is true at every epistemically possible scenario; this biconditional is not an optional extra but the load-bearing wall of the framework.
  (2) Water is H2O is a posteriori. So by (1) there is an epistemically possible scenario — Twin Earth — in which, considered as actual, that sentence comes out false.
  (3) On Twin Earth considered as actual, the clear, drinkable, ocean-filling liquid is XYZ, and the inhabitants' word for it refers to XYZ.
  (4) The two-dimensionalist's explanation of why Twin Earth's word refers to XYZ rather than to H2O cannot appeal to the actual reference of our term, since a scenario considered as actual is by hypothesis being taken as the real world; whatever settles the extension must be internal to the scenario.
  (5) What is internal to the scenario, as the Twin Earth case is always presented, is just the qualitative profile — the watery stuff, the patterns of usage, the environments — together with the stipulated underlying chemistry. So the extension of the word at any scenario considered as actual is settled by that scenario's own facts, without any input from our world.
  (6) The actual world is simply one more scenario considered as actual. So the extension of our word — its reference — is settled by our world's qualitative and chemical facts alone, without input from anywhere else.
  (7) Reference settled by qualitative facts alone is descriptive reference-fixing under another name.
  (8) If the word gets its reference descriptively, then the claim that water is H2O is true in virtue of our world satisfying the description with H2O — which makes it exactly as contingent as the claim that the stuff that actually fills the oceans is H2O, a paradigm of a contingent a posteriori truth.
  (9) So two-dimensional semantics cannot hold onto the necessity of water being H2O. Either the secondary intension inherits the descriptive fixation, in which case there are no necessary a posteriori truths at all and Kripke's cases were misdescribed from the start, or the descriptive story fails for the actual world, in which case (5) is not a general account of primary intensions and the framework loses its explanation of the very cases it was built for.

  My friend says this shows the framework was descriptivism wearing Kripke's coat: it doesn't accommodate the necessary a posteriori, it quietly eliminates it, which proves too much for a view whose selling point was reconciliation. I can see that the argument is either invalid somewhere or valid and devastating, but I can't tell which, and I can't locate the weak step. I would most like to keep (1) and the necessity of water being H2O. Walk me through which premise or inference to give up, why it looked innocent, and what rejecting it costs — including what the old-fashioned descriptivist and the Millian would each say the two-dimensionalist is really paying.
reasoning: |-
  Okay, I need to help this user who's been defending two-dimensional semantics in their reading group. They've been cornered by an argument that challenges the framework's ability to handle necessary a posteriori truths like "water is H2O." The user wants to know which premise to reject to save both the a priori status of primary intensions and the necessity of water being H2O. Let me unpack the argument step by step.

  First, the argument's structure: It starts with the definition of a priori truth in terms of primary intensions (1). Then it uses the Twin Earth scenario to show that reference must be fixed descriptively within each scenario considered as actual (2-5). This leads to the claim that actual reference is also descriptively fixed (6-7), making "water is H2O" contingent (8), contradicting Kripke's necessity (9). The conclusion is that two-dimensionalism either eliminates necessary a posteriori truths or fails to explain them.

  Hmm, the key tension is between internal reference-fixing in scenarios and rigid designation in the actual world. The user's friend argues that if reference is fixed descriptively in all scenarios, it must be so in actuality too, undermining rigidity. But two-dimensionalists like Chalmers distinguish epistemic and metaphysical modalities. Primary intensions handle epistemic possibility (what could be the case for all we know), while secondary intensions handle metaphysical necessity (how things are in counterfactual worlds given actuality).

  Looking at premise (5): It claims that what's internal to a scenario is just qualitative properties. But in two-dimensional semantics, when considering a scenario as actual, the primary intension depends on how the speaker's intentions connect terms to the world. For example, on Twin Earth considered as actual, "water" refers to XYZ because speakers there intend to refer to the dominant clear, drinkable liquid in their environment. But in the actual world, our term "water" is causally grounded to H2O, making its secondary intension rigid.

  The user's friend might be conflating the primary and secondary intensions. Step (6) assumes that because scenarios are symmetric epistemically, they must be symmetric metaphysically. But two-dimensionalists reject this; while all scenarios are epistemically possible candidates for actuality, once actuality is fixed, reference is determined by causal-historical facts, not descriptions. So in the actual scenario, "water" refers to H2O rigidly, but in Twin Earth as actual, it refers to XYZ. The primary intension captures the reference-fixing description, but the secondary intension is rigid.

  Premise (7) is problematic because descriptive reference-fixing for primary intensions doesn't imply descriptive reference for secondary intensions. Kripke allows that descriptions can fix reference without giving meaning; similarly here. The two-dimensionalist can say that in each scenario considered as actual, the reference is fixed descriptively (for primary intension), but once fixed, it's rigid across counterfactual worlds (secondary intension). So "water is H2O" is necessary because in all counterfactual worlds, water (the actual H2O) is H2O.

  The cost of rejecting (5)/(7) is that primary intensions aren't purely qualitative but involve the speaker's contextual intentions. This might make primary intensions less objective. Descriptivists would say this concedes that reference isn't fully descriptive, while Millians argue that even primary intensions smuggles in descriptive elements. But the two-dimensionalist must clarify that the primary intension's descriptive element is merely epistemic, not constitutive of meaning.

  The user wants to keep (1) and the necessity of water/H2O. By rejecting the move from descriptive primary intensions to descriptive reference simpliciter, they can do both. The necessity comes from secondary intensions being rigid, unaffected by how reference is fixed in epistemic scenarios. The weak step is (7), confusing the role of descriptions in epistemic reference-fixing versus metaphysical reference.
answer: |-
  This is a sharp and devastatingly coherent argument—one that cuts to the heart of whether two-dimensional semantics (2DS) genuinely reconciles Kripkeanism with descriptivist insights or collapses into a Trojan horse for the latter. Your friend is right that if the argument holds, 2DS "eliminates" necessary a posteriori truths by reducing them to contingencies. **The weak premise is (5), and rejecting it is essential to save both (1) and Kripkean necessity.** Let's walk through why, step by step, with costs and criticisms.

  ### The Flaw: Step (5) Misunderstands "Internal to the Scenario"
  **Premise (5) claims:**  
  > "What is internal to the scenario [...] is just the qualitative profile [...] So the extension of the word at any scenario considered as actual is settled by that scenario’s own facts, without any input from our world."

  **Why this is false in 2DS:**  
  - When a scenario (e.g., Twin Earth) is "considered as actual," 2DS does **not** determine reference *solely* by the scenario's qualitative facts (e.g., "watery stuff" properties). Instead, reference depends on **contextual speaker intentions** embedded within the scenario.  
  - In the Twin Earth scenario considered as actual, "water" refers to XYZ not *because* XYZ fits the qualitative profile, but because speakers *in that scenario* intend to refer to the dominant clear, drinkable liquid *in their environment*—whatever its hidden structure turns out to be. Crucially, this intention mirrors our *actual-world* intention when we use "water."  
  - **What's "internal to the scenario" includes the speakers' causal-historical grounding acts.** For example, in Twin Earth considered as actual, speakers baptize XYZ as "water" through ostension, just as we baptize H2O. The extension is fixed by the *causal interaction* within the scenario, not a description.  

  **Why (5) looked innocent:**  
  Twin Earth cases are often presented shorthand as "the watery stuff is XYZ," skipping speaker intentions. This makes it seem purely qualitative. But 2DS relies on the Kripkean insight that reference is fixed by baptismal events and causal chains, *not* satisfaction of descriptions. When the scenario specifies "inhabitants call the liquid 'water'," it implicitly includes their referential intentions.  

  ### Consequences of Rejecting (5)
  **Saving Kripkean necessity:**  
  - With (5) rejected, **premise (7) ("reference settled by qualitative facts alone is descriptivism") fails**. Reference in scenarios (including actuality) is fixed by contextual grounding acts, not descriptions.  
  - In the *actual world* (considered as actual), "water" rigidly designates H2O because it was baptized as such. Its secondary intension (metaphysical necessity) is constant: in all counterfactual worlds, water is H2O.  
  - In Twin Earth *considered as actual*, "water" rigidly designates XYZ. But this doesn't affect *our* term's rigidity. Our primary intension is contingent (Twin Earth is epistemically possible), but our secondary intension is necessary.  

  **Preserving (1):**  
  - "Water is H2O" is a posteriori because its primary intension is contingent: there are epistemically possible scenarios (Twin Earth as actual) where our term "water" picks out XYZ, making "water is H2O" false *when that scenario is actual*.  
  - This doesn’t threaten the *metaphysical* necessity of "water is H2O" in *our* world. The primary/secondary distinction remains intact.  

  ### Costs and Criticisms
  **What descriptivists would say:**  
  - Descriptivists (e.g., Fregeans) will argue that 2DS is cheating. If primary intensions depend on speaker intentions, those intentions must *themselves* be descriptively specified (e.g., "the liquid *causally linked to this baptism*"). This sneaks descriptivism back in.  
  - **Their charge:** 2DS borrows the Kripkean causal story without earning it. If reference in scenarios requires "baptism," but scenarios are abstract (e.g., centered worlds), how can they contain concrete causal relations?  

  **What Millians would say:**  
  - Rigid-designation purists (e.g., Salmon, Soames) argue that primary intensions are redundant. If reference is fixed causally, epistemic possibilities are irrelevant to meaning. The "epistemically possible" Twin Earth scenario is just a *misdescription* of our term's meaning—it doesn't show contingency.  
  - **Their charge:** 2DS overcomplicates semantics by conflating epistemic access with meaning. "Water is H2O" is necessary and a posteriori, but its aposteriority stems from empirical investigation, not semantic contingency.  

  **What 2DS must concede:**  
  1. **Primary intensions aren't purely qualitative.** They depend on contextual factors (speaker intentions, causal chains) that aren't reducible to "watery stuff" properties. This blunts 2DS's advertised elegance.  
  2. **Scenarios must be "thick."** To include causal-historical facts, scenarios can't be mere qualitative descriptions (e.g., Lewisian possible worlds). They need "centers" (agents, times) and causal relations, raising metaphysical worries.  
  3. **The framework doesn't "explain" reference—it presupposes Kripkeanism.** 2DS relies on externalist reference-fixing to avoid descriptivism. If Kripke is wrong about grounding, 2DS collapses.  

  ### Why the Argument Fails: Recap
  - **Steps (1)–(4):** Correct. Primary intensions define apriority; Twin Earth is epistemically possible; scenarios considered as actual exclude actual-world facts.  
  - **Step (5):** Wrongly assumes reference is fixed descriptively in scenarios. Rejecting this breaks the slide to descriptivism.  
  - **Steps (6)–(9):** Premature. Without (5), (6) doesn’t imply actual reference is descriptive, (7)–(8) don’t follow, and (9)’s dilemma dissolves.  

  **Your friend's "descriptivism in Kripke's coat" charge** only holds if (5) is accepted. By embedding Kripkean externalism into primary intensions, 2DS avoids this—but at the cost of making primary intensions less intuitive and more metaphysically loaded. The framework survives, but its "reconciliation" is messier than advertised.  

  If you defend this, stress that **primary intensions capture epistemic dependence on empirical facts—not descriptive meaning**. Twin Earth isn’t a world where "water" *means* something different; it’s a world where the same use-fixing intention (pointing to the local "watery" stuff) picks out a different substance. Kripkean necessity remains untouched.
