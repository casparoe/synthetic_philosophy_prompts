  First, I need to balance two audiences: poker pros who disdain results-oriented talk and family who only know his big win. The brother's philosophy centers on controlling decisions, not outcomes. The Machiavelli metaphor is crucial—it shows his approach to life. I should explain it simply, avoiding a history lesson.

  The user mentioned his brother applies poker rules to everything, like not judging decisions by outcomes. Highlighting this distinguishes him as a pro, not an amateur. Also, the wedding day is a big decision, tying into his philosophy of committing despite uncertainty.

  Humor is essential. Two solid jokes: maybe about childhood antics (like the Monopoly incident) and a light-hearted jab at his poker face during the proposal. Avoid anything that makes gambling seem shady—emphasize skill and decision-making instead.

  Structure the toast: start with a hook, introduce the brother's philosophy with the river metaphor, contrast poker and marriage decisions, add personal anecdotes, praise the bride, and end with a heartfelt toast. Ensure the Machiavelli reference is subtle—meaningful to the brother but clear to others.

  Check for sensitive areas: downplay luck in his career, avoid terms like "gambling," and present poker as a skill-based profession. Include the bride's family to ease their wariness, showing how his traits benefit the marriage.

  Timing: 4-5 minutes spoken. Keep paragraphs short for pacing. End with a warm, inclusive toast to both the couple and their families.
answer: |-
  Here’s a toast designed for your brother – respecting his philosophy, avoiding cringe, and hitting the right notes for both crowds, with the required humor and subtle Machiavelli nod:

  **(Clink glass gently)** Alright everyone, settle down. For those who don't know me, I’m [Your Name], the groom’s significantly more charming and slightly less financially solvent sibling. It’s my immense privilege – and frankly, terrifying responsibility – to say a few words about my brother, [Brother's Name].

  Now, trying to summarize [Brother's Name] for this diverse crowd is… tricky. Half of you know him as the guy who calculates pot odds while deciding what appetizer to order. The other half know him as the guy who somehow convinced Aunt Mildred that "going pro in cards" was a *respectable* life choice. *(Pause for laughter)*

  But if I had to pin down the core of who he is, it’s this: **My brother believes the only thing you truly own in this world is the quality of your decisions.** He lives by it. Seriously. Forget the weather, ask him if he brought an umbrella based on the *decision-making process* behind packing. *(Light chuckle)*

  He’s got this worldview… imagine if your life coach was equal parts Renaissance political theorist and high-stakes poker pro. He has this page pinned above his desk – not a motivational poster with a kitten, mind you – but a passage from Machiavelli. It talks about Fortune being like a raging river. When it floods, it flattens everything. But in the calm times? That’s when you build your dikes, your embankments. You prepare. You make the *right* choices, the *strong* choices, so that when the flood inevitably comes – and it always comes – you’re not swept away. You mitigate the damage.

  **That’s [Brother's Name]’s career advice. That’s his life advice.** He doesn't obsess over the flood he can't control. He obsesses over building the best damn embankments he can, brick by careful brick. He knows luck decides half the game. The *other* half? That’s preparation, calculation, nerve, and the relentless pursuit of making the best possible decision with the information you have. As he loves to remind anyone within earshot – especially after I lose to him at *anything* – **"Never judge a decision by its outcome; only a chump does that."** That’s the line between the amateur and the pro. It’s about the process, not the unpredictable splash at the end.

  *(Look at the poker players)* So, to the poker contingent: I *know* better than to stand up here and talk about that one big score a few years back. We all know what that river card looked like. *(Nod knowingly, poker players will chuckle/relieve tension)*. Praising luck? That’s results-oriented thinking. And we don’t do that here. What you *can* praise is the years of grinding, the studying, the discipline, the impeccable bankroll management (mostly), the sheer resilience of showing up day after day, hand after hand, building those embankments against the inevitable bad beats. That’s the pro. That’s [Brother's Name].

  *(Turn to family/bride's side)* And to our wonderful family, and especially [Bride]'s fantastic family – welcome! You might know the *outcome* of that big tournament, but what you might not see as clearly is the *decision-making machine* behind it. The focus, the analytical mind, the calculated risks taken only after meticulous preparation. It’s not about rolling dice; it’s about stacking the odds, brick by brick. Think of it less like a casino heist, and more like… high-stakes structural engineering. Against a very unpredictable river. *(Smile reassuringly at bride's family)*.

  Which brings us, spectacularly, to today. Because today, my brilliant, calculating, embankment-building brother looked at the ultimate variable, the ultimate river card: **forever.** He looked at the beautiful, amazing [Bride's Name] – who, let's be honest, is way out of his league *(gesture to bride, smile)* – and he decided to go all-in.

  *(Look at Brother)* Think about it, bro. This is the ultimate act of defying your own philosophy! You’ve built a life optimizing for control over the controllables, acknowledging the chaos of Fortune. And today, you stand up and publicly bet *everything* on one person, for life! You can't build a dike against heartbreak. You can't calculate the odds of marital bliss decades down the line. The river of life has some wild rapids ahead. This is the biggest, least hedgeable bet you’ll ever make.

  **And that’s why it’s so incredibly profound.** Because after a lifetime of mastering decisions based on logic and probability, you’ve chosen something that transcends it. You’ve looked at [Bride's Name], recognized a force of nature stronger than any flood Fortune can throw, and decided: *She is worth the variance. She is worth the unknown river. My best decision is choosing her, every single day, come what may.*

  [Brother's Name], you’ve spent years preparing for floods. Today, you’re choosing the sunshine, the calm waters, the partner to build *with*. And [Bride's Name], watching you two together, it’s clear he finally found someone whose decisions he trusts implicitly – especially the decision to marry him! *(Wink at Bride)*. You bring out a side of him that all the strategy books couldn't: pure, uncalculated joy. You are his perfect river guide.

  So, let’s raise our glasses.

  To [Brother's Name] and [Bride's Name]. May your life together be filled with more joy than variance, more love than any pot you’ve ever chased. May you build the strongest, most beautiful embankments *together* against whatever life throws your way. Remember the process, cherish the decisions you make side-by-side, and never forget – especially you, bro – that sometimes the best outcome comes from betting on the heart, not just the odds.

  **To the happy couple!**

  ---

  **Why this works:**

  1.  **Respects His Philosophy:** Core message is about *decisions*, not outcomes. Machiavelli metaphor is woven in clearly but accessibly ("building dikes/embankments," "unpredictable river"). Explicitly states the "never judge a decision by outcome" rule.
  2.  **Handles the Poker/Family Divide:** Acknowledges both audiences. Explains *why* praising the big score is wrong (for poker crowd) while explaining *what* should be praised instead (for family/bride's side). Uses the poker term "results-oriented thinking" but immediately explains it in plain terms ("praising luck").
  3.  **Downplays Luck/Shady Image:** Clearly states the big win involved luck ("we all know what that river card looked like"), frames poker as "high-stakes structural engineering" involving "grinding, studying, discipline," not luck or heists. Reassures bride's family.
  4.  **Hits the Core Irony:** Explicitly points out the beautiful contradiction of the ultimate decision-maker betting everything on the ultimate uncertainty (love/marriage). "Defying your own philosophy" is a strong, true statement he'll appreciate.
  5.  **Humor (x2+):**
      *   "Significantly more charming and slightly less financially solvent."
      *   "Convinced Aunt Mildred 'going pro in cards' was a *respectable* life choice."
      *   "Ask him if he brought an umbrella based on the *decision-making process*."
      *   "Not a motivational poster with a kitten..."
      *   "Especially after I lose to him at *anything*..."
      *   "Way out of his league" (gentle ribbing).
      *   "You finally found someone whose decisions he trusts implicitly – especially the decision to marry him!" (funny & sweet).
  6.  **Includes the Bride Beautifully:** Positions her as the worthy "bet," the sunshine, the force of nature, and his perfect partner in building. Compliments her impact on him.
  7.  **Length & Tone:** Flows naturally for speaking, roughly 4-5 minutes. Warm, affectionate, slightly irreverent in a brotherly way, but ultimately deeply heartfelt and celebratory. Ends on a strong, positive toast.
  8.  **He'll Notice the Nod:** The "dikes and embankments" and "unpredictable river" metaphors are clear enough for him to recognize Machiavelli instantly, but explained simply enough for others to grasp the core idea without needing the source.

  **Delivery Tips:**

  *   Speak naturally and with genuine affection for your brother and his bride.
  *   Pause for the laughs, especially after the humor lines.
  *   Make eye contact with the poker players when talking directly to them, and with the bride's family when reassuring them.
  *   When you mention Machiavelli, gesture vaguely like "you know, that guy..." to keep it light.
  *   Put real warmth into the lines about the bride and the final toast.
  *   Practice timing to ensure it flows smoothly and hits the 4-5 minute mark. Good luck! He's going to love it.
