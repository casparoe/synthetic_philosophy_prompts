prompt: |-
  So I have to give the toast at my brother's wedding in a few weeks and I want it built around the stuff he actually cares about instead of the usual mush. Quick background: he's been a professional poker player for about twelve years, and his whole worldview is basically Machiavelli without the mustache. He genuinely believes fortune decides roughly half of everything and the only thing a person actually owns is the quality of their decisions. He keeps a printed page of that chapter of The Prince pinned above his desk — the one where Machiavelli compares fortune to a flooding river that flattens everything when it rages, and says that in calm weather men can build dikes and embankments so the next flood does less damage. My brother treats that as career advice. He also has this rule from poker that he applies to literally everything: never judge a decision by its outcome, only a chump does that, which he claims is the actual line between an amateur and a pro.

  Heres my problem: the room will be half poker people, who will physically cringe if I praise his big tournament score from a couple years back (they'll hear it as results-oriented thinking), and half family, who only know him through that score and think it proves he's a genius. And honestly, the score WAS mostly luck — he's told me so himself, which is maybe the most him thing ever.

  Write me a toast that praises him in a way that's actually true. Something about what it means to love a man who's organized his whole life around the fact that he doesn't control the cards, on the exact day he's publicly betting everything on one person forever. If you can work the river-and-dikes idea in naturally, without it turning into a history lecture, that would be perfect — he'd notice and appreciate it, but the cousins shouldn't need footnotes. Four or five minutes when spoken, and it needs to be genuinely funny at least twice or he will never let me live it down. Also the bride's family is there and they're lovely but a bit wary of the gambling thing, so nothing that makes his job sound like a casino heist.
