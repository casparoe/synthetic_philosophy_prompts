answer: |-
  You've hit on two core objections that get to the heart of the compatibilism/incompatibilism debate. Let's dissect them, separating settled points from genuine ongoing disputes:

  **1. Objection: "Moving the Problem Back" (Ultimate Sourcehood)**

  *   **The Objection:** You argue that even if we act on our *own* reasons and desires (Dennett's "free will worth wanting"), those reasons/desires themselves stem from unchosen causes (genes, environment, prior causes). Therefore, *true* responsibility or *ultimate* authorship seems absent. Hard determinists (and libertarians) see this lack of *sourcehood* as fatal.
  *   **Compatibilist Response (Why it's not necessarily a "dodge"):**
      *   **Shifting the Goalposts?:** Compatibilists argue the objection *changes the question*. They claim the "problem" hard determinists/libertarians want solved (uncaused causation, self-creation) is incoherent or impossible. Asking for an *uncaused* self is asking for magic. Dennett argues we shouldn't demand the impossible.
      *   **What "Own" Means:** For compatibilists, "acting on your own reasons/desires" means those reasons/desires are *integrated* into your character, psychology, and decision-making processes *at that time*. It means your actions flow from *who you are*, even if "who you are" was shaped by prior causes. Responsibility, they argue, attaches to this *current* agential structure, not to an impossible self-origination.
      *   **Focus on Control & Reasons-Responsiveness:** The "worth wanting" free will is about having *control* over your actions based on your beliefs/desires, and being *responsive to reasons*. If you can deliberate, weigh options, and act accordingly (even if deliberation itself is causally determined), that's what matters for moral and practical purposes (praise, blame, planning, law). Hard determinism, they argue, throws out the baby (meaningful agency) with the bathwater (impossible libertarian freedom).
      *   **Practical vs. Metaphysical:** Compatibilists often frame this as a *practical* conception of freedom relevant to human life and society, contrasting it with a *metaphysical* conception they see as irrelevant or incoherent.
  *   **Unsettled Core Dispute:** This is the **fundamental philosophical disagreement**. There is *no consensus*.
      *   **Incompatibilists (Hard Determinists & Libertarians):** Insist that moral responsibility *requires* the kind of ultimate sourcehood or alternative possibilities that determinism rules out. They see compatibilist freedom as a pale shadow, failing to capture the essence of what we intuitively desire when we talk about "free will" and "deserving" blame/praise.
      *   **Compatibilists:** Deny that such ultimate sourcehood is necessary, coherent, or even desirable. They argue their conception captures *everything valuable* about free will – the capacity for rational self-governance – without impossible metaphysics. They see incompatibilists as demanding something nonsensical.

  **2. Objection: "The Theist's Contra-Causal Soul Power" (Arbitrariness of "Worth Wanting")**

  *   **The Objection:** If Dennett gets to define which free will is "worth wanting" (pragmatic, reasons-responsive), why can't a theist define what's "worth wanting" as contra-causal, soul-based freedom? Isn't this just subjective preference?
  *   **Compatibilist Response:**
      *   **Pragmatic Justification vs. Wishful Thinking:** Dennett's argument isn't *just* "I prefer this definition." He provides *reasons* why his conception is "worth wanting":
          *   **It's Possible:** It doesn't require violating the laws of physics or logic.
          *   **It Serves Essential Social/Personal Functions:** It underpins moral responsibility, legal culpability, personal achievement, deliberation, and planning – things we demonstrably value and need for society and individual life.
          *   **It's Grounded in Reality:** It describes features of human cognition and agency we actually observe (reasoning, self-control, responsiveness to incentives/reasons).
      *   **Contra-Causal Freedom Lacks This Justification:**
          *   **Possibility?:** Its coherence and compatibility with a scientific worldview are highly questionable (many argue it's incoherent).
          *   **Function?:** What essential *practical* function does contra-causal freedom serve that compatibilist freedom *doesn't*? Compatibilists argue it adds nothing of practical value to the capacity for reasoned action and self-control. It might satisfy a *metaphysical yearning*, but not a demonstrable practical need.
          *   **Grounding?:** There's no empirical evidence for a contra-causal soul, and its mechanics are deeply mysterious.
      *   **Not Just Preference, But Justification:** The point is that Dennett provides *functional, pragmatic justifications* for why *his* conception is worth wanting, linked to real-world needs and possibilities. The theist, in defining "worth wanting" as contra-causal freedom, struggles to provide equivalent justifications beyond faith or intuition. They might *want* it, but Dennett argues they can't show *why* that specific feature is necessary for the valuable aspects of agency and responsibility.
  *   **Unsettled Core Dispute:** While compatibilists have a strong argument here, the objection highlights that the *value* assigned to different conceptions of freedom remains debated.
      *   **Libertarians:** Argue contra-causal freedom *is* essential for *true* moral responsibility and dignity. They see compatibilist freedom as insufficient precisely because it lacks this "ultimate control."
      *   **Hard Determinists:** Argue that *neither* is truly possible or necessary; our intuitions about responsibility are illusions based on ignorance of causes.
      *   **Settled Point?** There *is* broad consensus (even among many non-naturalist philosophers) that *if* contra-causal freedom requires incoherence (e.g., an uncaused cause within a being that is also part of the causal chain) or violates well-established physics, it faces severe metaphysical challenges that Dennett's conception avoids. However, libertarians dispute whether it *is* incoherent or impossible.

  **What is Genuinely Settled vs. Still Fought Over:**

  1.  **Settled (Broadly):** Neuroscience and physics haven't *proven* hard determinism true at the macro level relevant to human decisions. Determinism vs. indeterminism at the quantum level doesn't straightforwardly resolve the free will debate. Compatibilism remains a logically coherent position *if determinism is true*. Libertarianism faces significant metaphysical challenges regarding how contra-causal freedom could operate without randomness or violating causality.
  2.  **Settled (Philosophical Methodology):** Conceptual analysis of terms like "free," "responsible," "could have done otherwise," "control," and "source" is central to the debate. There's no avoiding defining terms.
  3.  **Fought Over (Core Disagreements):**
      *   **Is Ultimacy/Sourcehood Necessary for Responsibility?** This is the **central, unresolved battleground**. Incompatibilists say yes, compatibilists say no.
      *   **What is the "True" Intuition?** What do people *really* mean/desire when they talk about free will? Both sides claim their view captures the core intuition.
      *   **Is Compatibilist Freedom *Sufficient* for Moral Responsibility/Praise/Blame?** Hard determinists say no, compatibilists say yes.
      *   **Can Indeterminism Help?** Libertarians try to incorporate it, compatibilists argue it adds nothing valuable or makes control worse, hard determinists say it doesn't solve the problem.
      *   **The Practical Implications:** Does accepting compatibilism/hard determinism significantly change how we *should* practice praise, blame, punishment, and reward? Compatibilists usually say "no, practice remains largely the same," hard determinists often argue for significant reform focusing on deterrence/rehabilitation rather than desert.

  **Conclusion:**

  Your objections are powerful expressions of the incompatibilist perspective. Compatibilists don't "solve" the ultimate sourcehood problem; they argue it's the *wrong problem* to demand a solution for, as the demand is based on a mistaken or impossible ideal. They offer an alternative conception grounded in practical agency and reasons-responsiveness, claiming it fulfills all the valuable functions of free will without impossible metaphysics. Whether this is a legitimate solution or an evasion is precisely what the two sides fight about. The theist objection highlights that definitions matter, but compatibilists counter that their definition isn't arbitrary; it's justified by pragmatic, functional considerations that the contra-causal definition lacks. There is **no philosophical consensus** on who "wins," only competing frameworks with different answers to fundamental questions about agency and responsibility.
