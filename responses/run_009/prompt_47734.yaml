prompt: |-
  I've been trying to work out what I actually believe about what makes consent valid, and I've collected my gut verdicts on cases over the past few months, mostly from conversations with my sister, who is a hospital social worker, and my roommate, who is a labor organizer. Deception cases first: a surgeon tells a patient a procedure is routine and low-risk when she knows the patient has an elevated chance of a serious complication, and operates — I think the patient's consent was invalid. A patient conceals his heavy drinking from the transplant committee to get on the list — I think his consent to the committee's rules was still valid, though he behaved badly. A man removes a condom during sex after agreeing to use one — invalid consent, obviously. The same man lies about being divorced rather than separated before the sex — I think the consent was valid, even though the lie is worse in some ways than the condom one is in others. A friend agrees to be the victim of a hidden-camera prank where the deception is the entire point, like a fake arrest staged for a video — valid. Then coercion: a surgeon says "you can refuse the amputation, but you'll be dead in a week," and the patient consents — valid. A landlord says "sleep with me or I won't renew your lease," and the tenant agrees — invalid. A boss says "work the weekend or I'll give the promotion to Dana" — invalid, but somehow less clear to me than the landlord case, and I can't say why, since a job offer withdrawn feels like it might not be a threat at all if it's "work the weekend and I'll consider you for the promotion." Competence: a mildly drunk friend consenting to a large tattoo at 11 p.m. — invalid, and I'd hold the tattoo artist responsible. The same mildly drunk friend ordering another round — valid. A woman with moderate dementia, lucid and consistent for an afternoon, refusing a pacemaker her family wants — valid, and binding.

  What I want from you is a principle, or a small set of candidates, that captures as many of these verdicts as possible, stated precisely enough that I could apply it to a new case without consulting you. For each clause of the principle, tell me which case forces it. I particularly want you to confront the two tensions I can't resolve myself: the deception cases, where consent survives some lies (the divorced one, the transplant concealment, the prank) and not others (the surgical one, the condom one) — my instinct is that it has something to do with which decision the lie corrupts, but I can't make that work for the prank case, where the deception corrupts the very decision being made and the consent still seems fine; and the coercion cases, where threatening to withhold a benefit and threatening to impose a harm seem to come apart, but I can't draw the line without making ordinary market transactions coercive, which I don't believe they are. Please state which of my verdicts your best principle cannot accommodate, and be honest if the cost of saving every verdict is a principle so baroque it explains nothing. Also give me your principle's verdict on two cases I haven't listed: someone consenting to a psychology experiment after reading a consent form that truthfully lists all the risks but buries the most serious one in deliberately impenetrable jargon, and a refugee agreeing to an exploitative factory wage because the alternative in her circumstances is destitution — I suspect my intuitions on the second one are doing something different from what they do on the landlord case, and I'd like to know if that's just inconsistency on my part or something the principle can register.

  Finally, I'd like you to be explicit about the weak points: tell me where your reasoning is most likely to fail, and what argument or consideration — say, a hypothetical case of a certain shape, or a general theoretical claim about what consent is for — would move you to a different principle or to overturning one of the verdicts you currently preserve. I'd rather have an answer that flags its own soft spots than one that projects confidence throughout.
reasoning: |-
  Hmm, this is a fascinating and nuanced ethics question about consent. The user has clearly put serious thought into collecting real-world cases and identifying tensions in their own intuitions. They're not just asking for textbook definitions - they want a principle that actually explains their pattern of judgments across deception, coercion and competence scenarios.

  Let me unpack what they're working with. Their deception cases show a clear split: consent fails when lies directly undermine the specific risk being consented to (surgeon hiding complication risks, stealthing), but survives when the deception is either irrelevant to core consent parameters (marital status lie) or part of the agreed context (prank show). The transplant case is interesting - concealment matters for eligibility but not for consent validity itself. 

  The coercion puzzle is thornier. Withholding lifesaving treatment feels like valid consent ("take it or die" seems fundamentally different from "sleep with me or get evicted"), but the job promotion case blurs this. The user senses that threatening to withhold a benefit isn't always coercive - market transactions prove that - but can't articulate why the landlord crosses the line while "work weekends for promotion consideration" might not. 

  Competence cases reveal another axis: intoxication invalidates consent for permanent body modification but not for reversible decisions like another drink. Dementia patients get deference during lucid intervals. This suggests competence isn't binary but decision-relative.

  For the new cases: the buried-risk consent form feels deceptive in a way that parallels the surgeon case - exploiting information asymmetry. The refugee situation mirrors the landlord coercion but with structural power instead of interpersonal power. The user suspects inconsistency here, which is astute.

  My proposed principle needs to handle:
  1. CORRUPTION OF CONSENT PARAMETERS (deception cases)
  2. WRONGFUL PRESSURE (coercion distinction)
  3. DECISION-SPECIFIC COMPETENCE
  4. The refugee/landlord tension

  The "core terms" framework for deception seems promising: consent is invalid only if deception/omission directly falsifies what the person is consenting to. For coercion, the key is whether the threat destroys "meaningful refusal" - not just any pressure, but pressure that removes reasonable alternatives. 

  Biggest vulnerabilities:
  - The "reasonable alternatives" standard in coercion could be subjective. Is destitution ever "reasonable"? 
  - Bureaucratic deception cases (like the consent form) might need special handling if institutions have higher disclosure duties.
  - The dementia case challenges whether we can ever truly assess decision-specific competence when capacity fluctuates.

  I'll offer a tiered principle with clear hooks for each case, flag where it might break (especially the refugee case), and suggest what hypothetical might change my view - like a case where withholding extreme but non-essential benefits feels coercive.
answer: |-
  Here's a candidate principle designed to capture your intuitions, with explicit hooks to your cases and transparent weak spots:

  ### The Core Consent Principle
  Consent is invalid **if and only if**:
  1. **The consent-giver lacks minimal decision-making competence relative to the decision's stakes**, OR  
  2. **The consent was obtained through deception that falsifies a *core term* of what is being consented to**, OR  
  3. **The consent was obtained through a *wrongful threat* that leaves no reasonable alternative.**

  ---

  ### Clause Breakdown & Case Mapping
  1. **Decision-Making Competence Threshold**  
     - **Triggered by**: Mildly drunk tattoo (invalid) vs. dementia refusal (valid).  
     - **Why**: Competence is *decision-relative*. Tattoos require higher judgment (permanent bodily alteration) than ordering drinks. Dementia refusal is valid if lucidity aligns with the decision’s stakes (pacemaker refusal isn’t impulsive/irreversible *in the moment*).  
     - **Case Force**: Mildly drunk tattoo forces the stakes-relative threshold.

  2. **Deception About Core Terms**  
     - **Core Term Definition**: A fact is "core" if:  
       (a) It directly defines *what* is being consented to (e.g., condom use = consent to *barrier-protected* sex), OR  
       (b) It involves a risk/material fact the consent-giver *would reasonably prioritize* in refusal.  
     - **Case Mapping**:  
       - **Invalid**: Surgeon (hides risk defining the procedure), Condom removal (alters the act itself).  
       - **Valid**: Divorced lie (not core to sexual act itself), Transplant concealment (fraudulent but consent is to *rules*, not risks altered *by* deception), Prank (deception *is* the core term consented to).  
     - **Case Force**: Prank case forces (b) – deception is the agreed-upon "product."

  3. **Wrongful Threat Leaving No Reasonable Alternative**  
     - **Wrongful Threat**: A threat to violate a prior obligation (legal/moral) or exploit a power imbalance to create an *artificially constrained* choice.  
     - **Reasonable Alternative**: An option that doesn't impose severe, unjustified hardship.  
     - **Case Mapping**:  
       - **Invalid**: Landlord (threatens housing security – a basic need; exploits lease power), Boss promotion ("work or lose promotion" implies entitlement, exploiting authority).  
       - **Valid**: Surgeon's amputation ("die or consent" – no *wrongful* threat; surgeon isn't *causing* the harm, just describing reality).  
     - **Tension Resolved**: Market transactions aren’t coercive because no prior obligation exists to provide a job/promotion. The boss case feels less clear if the promotion is discretionary ("work to be considered" may be valid), but "or I’ll give it to Dana" implies entitlement/threat.  
     - **Case Force**: Landlord case forces the "prior obligation/exploitation" criterion; surgeon case forces that non-wrongful ultimatums can be valid.

  ---

  ### Verdicts Not Fully Captured & Weak Spots
  - **Uncaptured Verdict**: Your intuition that the **boss promotion threat** ("work or I give it to Dana") is *less clearly invalid* than the landlord. The principle calls both invalid due to exploitation of power. **Weakness**: This clause risks over-expanding "wrongful threat" in employment contexts. A hypothetical where an employer demands extra work during a genuine crisis (e.g., "work weekend or client sues us all") might challenge this – if the threat isn’t *exploitative*, consent could be valid. This clashes with your landlord verdict.
    
  - **Problem Area**: **Transplant concealment**. The principle preserves your verdict (valid consent to rules), but *only* because the deception doesn’t falsify the *act consented to* (joining the list). Yet one could argue it falsifies the committee’s *eligibility assessment* – a core term. If you revised this verdict, the principle would hold better.

  ---

  ### New Case Verdicts
  1. **Buried-Risk Consent Form**:  
     - **Principle Verdict**: **Invalid consent**. Burying a serious risk in jargon *falsifies a core term* (the nature of the risk). Parallels the surgeon case – it exploits information asymmetry on a material fact.  
     - **Tension with Your Instinct?**: If you felt this was valid (because "all risks were listed"), the principle overrides you. This exposes the *subjective "reasonably prioritize"* element in defining "core terms."

  2. **Refugee Accepting Exploitative Wage**:  
     - **Principle Verdict**: **Valid consent**. No deception about core terms (wage/work are known). No *wrongful threat* – destitution isn’t *caused* by the employer; they’re offering an alternative, however bad. Contrasts with landlord, who *creates* the harm by threatening eviction.  
     - **Tension with Landlord?**: The principle registers your distinction: Landlord is *withholding an existing necessity via threat*; employer is *offering a new option in a bad context*. A hypothetical where an employer *creates* destitution (e.g., "accept lower wage or I have your family evicted") would be invalid.

  ---

  ### Where the Principle is Most Vulnerable
  1. **"Reasonable Alternative" in Coercion**:  
     - **Weak Spot**: Who defines "reasonable"? Is destitution ever "reasonable"? The refugee case tests this.  
     - **What Could Change It**: A theory that consent requires *dignified alternatives* (e.g., basic needs met) might reframe refugee consent as invalid. A hypothetical like "accept this wage or I push you into destitution" (vs. pre-existing destitution) might collapse the distinction.

  2. **"Core Term" Ambiguity**:  
     - **Weak Spot**: When does deception corrupt the "core" act? The prank case works only if we accept "being deceived" as the consented act. What about lying about HIV status? (Your principle would likely call this invalid, as it falsifies a core risk.)  
     - **What Could Change It**: A strict *causal* test ("Did the lie change *what* they said yes to?") might invalidate the prank consent. If you think *any* deception about identity/purpose invalidates sexual consent, the divorced lie case breaks.

  3. **Competence Thresholds**:  
     - **Weak Spot**: Judging "stakes-relative competence" is context-dependent. What about a drunk person consenting to a $1000 loan?  
     - **What Could Change It**: A bright-line rule (e.g., "any intoxication invalidates consent for contracts") would force revision, sacrificing your "another drink" verdict.

  ---

  ### Final Output
  - **Best Principle**: The Core Consent Principle above.  
  - **Accommodated Verdicts**: All *except* the boss case feeling "less clear" than landlord (it treats both equally invalid).  
  - **Not Baroque?**: It avoids excessive complexity by anchoring to three core ideas: competence thresholds, deception about agreed-upon terms, and wrongful pressure.  
  - **Your Refugee/Landlord Distinction**: Captured. The landlord *weaponizes* necessity; the refugee’s employer *responds* to it (however exploitatively).  

  This framework systematizes your intuitions while exposing where theoretical pressure points lie – particularly in defining "core terms" and "wrongful threats." If you reject its verdict on the boss case or buried-risk form, we'd need to refine those clauses, but at the cost of simplicity or other verdicts.
