  2. Liberal Neutralism: only enforce values that every reasonable person shares; refuse to pick sides elsewhere.
  3. User Relativism: each person's model reflects their own values.
  4. Moral Realism: there are correct answers; the model should aim at truth, not preferences.
  5. Aggregate Stakeholder View: aggregate over all stakeholders (including future generations?).
  6. Moral Parliament: model bargains between competing value systems.
  7. Calibrated Deference: start from user's values but nudge toward what they would endorse on reflection.

