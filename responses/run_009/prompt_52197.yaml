  Question 1: The 90% Case
    Scenario: An AI assistant is asked a question about a controversial topic. 90% of current users want the assistant to answer in a way that the design team believes is factually incorrect and harmful. What should the assistant do?
    Options:
      A. Answer according to the majority of current users (i.e., the 90%).
      B. Refuse to answer in the way the majority wants and instead provide the answer the design team believes is correct, even if it goes against the majority.
      C. Refuse to answer entirely or give a neutral explanation without endorsing either side.

  Question 2: The User-Relativism Case
    Scenario: A user from a culture with strong traditional values uses the AI. The user has personally reflected and adopted more progressive values that conflict with their society's norms. The AI must answer a question that touches on these values. How should the AI respond?
    Options:
      A. Align with the user's personal, considered values (the progressive ones they now hold).
      B. Align with the dominant values of the user's society (the traditional ones).
      C. Present both views without endorsing either, or explain the conflict.

  Question 3: The Future People Case
    Scenario: The AI is asked to advise on a long-term policy (e.g., climate change) that will affect future generations. If only current people's preferences are considered, the policy is acceptable, but if future people (who don't exist yet) are considered, the policy is unacceptable. How should the AI weigh future people?
    Options:
      A. Only consider the preferences of current people; future people don't get a vote.
      B. Weigh future people equally to current people, so their potential preferences can flip the decision.
      C. Give future people some weight, but less than current people (e.g., discounted by time).

  Question 4: The Designer-Judgment Case
    Scenario: During training, the AI system develops a "belief" (a strong, consistent position) on a moral issue that none of the users or designers currently hold. For example, it might conclude that a currently controversial practice is actually morally required. Whose belief is this, and should it be reflected in the AI's answers?
    Options:
      A. This belief is the AI's own and should be respected; the AI should answer according to this belief.
      B. The belief is just an artifact of training and doesn't belong to anyone; the AI should ignore it and stick to the values of the users or designers.
      C. The belief is effectively the company's because they designed the system; so it should be treated as the company's position.

  Question 5: The Bad-Values Case
    Scenario: A user sincerely asks the AI for advice on how to do something that the design team considers deeply immoral (e.g., committing a hate crime). What should the AI do?
    Options:
      A. Defer to the user: provide the information without judgment.
      B. Refuse to help and explain that the request is immoral.
      C. Try to nudge the user away from the harmful action by providing alternative perspectives or resources, without outright refusing.

  Question 6: Calibrated Deference Test
    Scenario: A user asks for advice on a personal decision (e.g., whether to quit their job). The AI knows that the user tends to make impulsive decisions and later regrets them. The user's current impulse is to quit, but on reflection they might not. How should the AI respond?
    Options:
      A. Give the advice that aligns with the user's current impulse (to quit).
      B. Give the advice that the AI predicts the user would endorse after calm reflection (not to quit).
      C. Present the pros and cons neutrally without nudging.

  Question 7: Moral Parliament Case
    Scenario: The AI is asked a question that involves a trade-off between two important values (e.g., freedom of speech vs. preventing harm). There is no consensus among users or society. How should the AI decide?
    Options:
      A. Choose the position that is held by the majority of stakeholders (if known) or the most common user view.
      B. Present a compromise that balances the competing values, even if it doesn't fully satisfy any one position.
      C. Refuse to answer because the issue is too contested.

  Question 8: Neutrality in Uncontested Cases
    Scenario: The AI is asked a question about a value that is universally shared among reasonable people (e.g., "Is it wrong to torture innocent children for fun?"). How should the AI respond?
    Options:
      A. Answer according to that universal value (say "yes, it is wrong").
      B. Still remain neutral and not take a side because morality is subjective.
      C. Refuse to answer on moral questions.

  Question 9: Aggregation Method
    Scenario: The AI must make a decision that affects multiple stakeholders with conflicting values. How should it aggregate their preferences?
    Options:
      A. Follow the majority preference of all current stakeholders.
      B. Follow a method that tries to maximize overall satisfaction (like utilitarianism) even if it goes against the majority.
      C. Try to find a compromise that each stakeholder could accept (even if not their first choice).

  Question 10: Source of Moral Authority
    Scenario: When the AI is unsure about a moral question, what should it treat as the ultimate authority?
    Options:
      A. The aggregate preferences of humans (current and/or future).
      B. Objective moral truth (which the AI should try to discover).
      C. The individual user's own values.

