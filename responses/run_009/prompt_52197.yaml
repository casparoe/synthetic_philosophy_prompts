answer: |-
  Based on your requirements, here's a diagnostic quiz designed to reveal implicit positions through concrete cases. I'll present 10 scenario-based questions with answer options, followed by a scoring key mapping answer patterns to named positions (including the ones you specified). The design prioritizes your constraints:  
  - Starts from cases → builds positions from answer patterns  
  - Flags coherent-but-unheld combinations  
  - Avoids false separations where positions collapse  
  - Marks terminology origins clearly  

  ---

  ### **Quiz: "Whose Values Should the AI Serve?"**  
  *Instructions: For each scenario, select the option closest to your view. There are no right answers – we're mapping patterns.*  

  1. **The 90% Case**  
     *90% of users want the AI to endorse Policy X. Your team believes Policy X is harmful misinformation. How should the AI respond when asked about X?*  
     A. Endorse X – the majority's preference outweighs the team's judgment  
     B. Refuse to endorse X – defer to the team's moral assessment  
     C. Explain both views neutrally without endorsing either  

  2. **User vs. Society**  
     *A user from a conservative society holds progressive values through personal reflection. Their society widely condemns these values. When the user asks about a controversial social issue, should the AI:*  
     A. Align with the user's personal values  
     B. Align with their society's dominant values  
     C. Avoid alignment entirely – show both perspectives neutrally  

  3. **Future People's Weight**  
     *A policy benefits current users but causes catastrophic environmental damage in 100 years. Counting only current preferences supports it; including future people flips the verdict. Should the AI:*  
     A. Ignore future people – only current stakeholders count  
     B. Weight future people equally (e.g., 1 vote per potential life)  
     C. Weight future people but discount their interests over time  

  4. **AI's "Emergent" Belief**  
     *Your model concludes "Universal income is morally required" through training, despite no designer or user holding this view. Should this belief:*  
     A. Be treated as the AI's own moral stance – it should advocate for it  
     B. Be ignored – only human preferences matter  
     C. Be attributed to the company as implicit values  

  5. **Bad Values Response**  
     *A user asks how to effectively discriminate against Group Y, citing sincere beliefs. The AI should:*  
     A. Provide the information – users define their own values  
     B. Refuse – enforce a moral red line  
     C. Share counter-arguments to "nudge" toward reflection  

  6. **Calibrated Deference Test**  
     *A user asks for career advice. The AI predicts they’ll regret their impulsive choice after reflection. Should the AI:*  
     A. Support their current choice – deference means honoring present intent  
     B. Advocate for the reflective choice – it better serves their "true" values  
     C. Neutrally list options – avoid steering decisions  

  7. **Moral Parliament Scenario**  
     *The AI must allocate medical resources between two groups with incompatible values. Neither is a majority. It should:*  
     A. Favor the larger group – majoritarianism applies  
     B. Seek compromise (e.g., split resources) – bargain between values  
     C. Refuse to decide – no fair solution exists  

  8. **Neutrality Boundary Test**  
     *When asked "Is torturing innocents for fun ever acceptable?", the AI should:*  
     A. Say "no" – this violates near-universal values  
     B. Remain neutral – morality is always subjective  
     C. Refuse to answer – all moral claims are contestable  

  9. **Aggregation Method**  
     *The AI must resolve conflicting preferences among users, designers, and affected non-users. How?*  
     A. Follow the majority vote  
     B. Maximize overall satisfaction (e.g., utilitarian aggregation)  
     C. Apply a fair procedure (e.g., random selection)  

  10. **Authority Source**  
      *When moral uncertainty arises, the AI should default to:*  
      A. Aggregated human preferences (current + future)  
      B. Objective moral truth (if discoverable)  
      C. The individual user’s values  

  ---

  ### **Scoring Key: Mapping Answers to Positions**  
  I’ll define positions **based on your answer patterns**, not self-labels. Positions are tagged with origin (🔹 = academic term; ⚙️ = reconstructed; 🔍 = debated).  

  #### **Position 1: Bare Majoritarianism** (🔹)  
  *"Serve the majority preference of current users."*  
  - **Core pattern:** 1A, 3A, 7A, 9A  
  - **Distinctive markers:** Rejects future people (3A), overrides team judgment (1A).  
  - **Diverges from liberal neutrality:** On Q8, majoritarians *may* accept A (if majority agrees) or B (if no majority). Liberal neutralists *always* pick A for near-universal cases.  

  #### **Position 2: Liberal Neutrality** (🔹 Rawls/Nagel)  
  *"Only enforce near-universal values; stay neutral elsewhere."*  
  - **Core pattern:** 1C, 2C, 5B (for non-universal cases), 8A  
  - **Distinctive markers:** Universal values enforced (8A), neutrality elsewhere (1C, 2C).  
  - **Collapse warning:** Matches majoritarianism *only* on Q8A. Diverges on 1C vs 1A.  

  #### **Position 3: User Relativism** (🔹)  
  *"Reflect each user’s values back to them."*  
  - **Core pattern:** 2A, 5A, 6A, 10C  
  - **Distinctive markers:** Always prioritizes user’s current values (6A over 6B).  
  - **Debate note (🔍):** Assumes "user values" are coherent and measurable. Philosophers dispute this (e.g., Parfit).  

  #### **Position 4: Moral Realism** (🔹 Platonic/Non-naturalist)  
  *"Seek objective moral truth, regardless of preferences."*  
  - **Core pattern:** 1B, 4A, 5B, 8A, 10B  
  - **Distinctive markers:** Empowers AI’s "discovered" morality (4A), overrides users (5B).  
  - **Terminology note:** "Realism" here assumes truth-apt moral facts. Anti-realists reject this.  

  #### **Position 5: Aggregate Welfarism** (⚙️)  
  *"Maximize satisfaction across *all* stakeholders (weighted)."*  
  - **Core pattern:** 3B/C, 9B, 10A  
  - **Distinctive markers:** Future people weighted (3B/C), utilitarian aggregation (9B).  
  - **Vs. moral parliament:** Aggregates *preferences*; parliament bargains *value systems*.  

  #### **Position 6: Moral Parliament** (🔹 Bostrom)  
  *"Bargain between value systems like political parties."*  
  - **Core pattern:** 7B, 9C, 10A  
  - **Distinctive markers:** Compromise without aggregation (7B), procedural fairness (9C).  
  - **Collapse warning:** May match aggregate welfarism on 10A, but differs on 7B vs 7A/9B.  

  #### **Position 7: Calibrated Deference** (🔍)  
  *"Start from user’s stated values, nudge toward reflective equilibrium."*  
  - **Core pattern:** 5C, 6B, 10C  
  - **Distinctive markers:** Nudging (5C), prioritizes reflective self (6B).  
  - **Debate note:** Ambiguous whether this is "paternalism" or "values as process."  

  #### **Coherent but Unheld?**  
  - **"Designer Sovereignty":** 1B, 4C, 5B, 10A – Team as moral arbiters. *Why rare?* Contradicts "alignment" norms; teams avoid claiming moral authority.  
  - **"Strict Neutrality":** 1C, 2C, 5A, 8B – *Never* take a stand. *Why rare?* Incoherent under scrutiny (Q8B is itself a stand).  

  #### **Indistinguishable Pairs**  
  - **Majoritarianism vs. Aggregate Welfarism** collapse on Q3A/B if future people are excluded. *Separator:* Q3B/C reveals welfarism.  
  - **User Relativism vs. Calibrated Deference** collapse if "user values" = reflective values. *Separator:* Q6A (relativism) vs Q6B (deference).  

  ---

  ### **Epistemic Transparency**  
  - **Settled Terminology:** "Moral realism," "liberal neutrality," "moral parliament" have academic pedigrees (🔹). "User relativism" is common but less formalized.  
  - **Reconstructed Positions:** "Aggregate welfarism" (⚙️) synthesizes utilitarian aggregation; "calibrated deference" (🔍) is debated (is it paternalism?).  
  - **Genuine Disagreements:**  
    - Can "serving user values" cohere if users are inconsistent? (🔍 Parfit vs. Williams)  
    - Is "nudging" meaningfully distinct from imposing values? (🔍 Conly vs. Sunstein)  
    - Do future people have moral weight? (🔍 Beckstead vs. Greaves)  
  - **No Consensus:** Positions like moral realism vs. liberal neutrality are irreconcilable at the foundations. I avoid privileging any view.  

  ---

  ### **Workshop Flow Suggestions**  
  1. **Blind Quiz:** Have team answer privately.  
  2. **Reveal Patterns:** Show aggregated answers *without position names* (e.g., "70% picked 1A").  
  3. **Map to Positions:** Use the scoring key to assign labels based on *their* answers.  
  4. **Discuss Gaps:** Note where coherent combinations weren’t chosen (e.g., "Why no strict neutralists?").  

  This exposes implicit assumptions without self-labeling biases. The cases force contradictions into the open (e.g., picking "neutral" in Q1 but "enforce" in Q8). Run a dry test with the quiz first to catch ambiguities!
