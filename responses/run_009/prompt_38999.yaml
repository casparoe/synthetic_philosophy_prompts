  Teaching strategies: Use specific scenes to contrast with text passages. Highlight where the film supports or challenges Machiavelli. Discuss survivorship bias: Forrest's success is narrated because he succeeded; others didn't. Address sentimentality: Forrest's innocence might overshadow the philosophical points, but his simplicity forces viewers to question if virtù requires complexity.

