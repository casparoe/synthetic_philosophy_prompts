prompt: |-
  I'm a PhD student in cognitive neuroscience, and I've realised that my considered reactions to questions about brain size and moral status don't obviously fit together, so I'd like your help extracting the principle, if there is one, behind them. Below are my verdicts on a set of cases, followed by a tentative principle of my own that I suspect doesn't quite work. Please test it against the cases, repair or replace it, and tell me plainly which of my verdicts the repaired principle cannot save.

  My verdicts:

  1. An adult human with a congenitally very small brain (severe microcephaly) who, against the odds, lives a recognisably human life — relationships, language, humour, plans for the future — has exactly the same moral status as anyone else. Brain size is irrelevant here.
  2. An elephant, whose brain is physically larger than mine, does not thereby have a higher moral status than I do. I'd even say its status is lower, though I feel uneasy writing that.
  3. That said, I'm fairly convinced that elephants and corvids matter morally in a way that similarly sized-brained animals with far less cognitive sophistication do not — a raven's moral claim on us seems to me greater than that of an animal with ten times its brain mass but a much simpler behavioural repertoire.
  4. A patient who has had an entire cerebral hemisphere removed in childhood and grown up cognitively typical retains full moral status, even though half the brain is gone.
  5. A patient in a permanent vegetative state, with a fully intact, full-sized brain, has lost much of the moral status they had whilst conscious. Whatever grounds their status, it doesn't seem to be the brain sitting there in the skull.
  6. An infant born with anencephaly, I have to admit, seems to me to have a profoundly diminished moral status — which is uncomfortable given verdict 1, since both cases involve drastic underdevelopment of the cortex.
  7. If a Neanderthal walked into the lab tomorrow, their moral status would be exactly ours, and I don't think I'd be moved by the fact that their brain was somewhat larger than mine. More status for more brain seems obviously wrong when it runs in that direction.
  8. Here's where I wobble: a hypothetical future person whose brain was engineered to be smaller but far more efficient — say, human-equivalent cognition from half the cortical tissue — would obviously keep full moral status. But I'm genuinely unsure whether a person engineered in the opposite direction, with human-equivalent cognition from twice the cortical tissue, would thereby have *greater* status. Part of me wants to say yes; part of me thinks that's monstrous.

  My tentative principle, half-remembered from a seminar: moral status tracks the absolute number of cortical neurons, or something in that vicinity — not brain mass, not encephalisation quotient, not species membership. I like it because it explains why the elephant (whose cortical neuron count is, if my recollection of the comparative literature is right, a fair fraction of ours but well below it) matters less than a human but far more than I'd have guessed from the old brain-mass figures, and why small-brained but densely packed cortices might punch above their weight. But I can already see it struggling with several of my verdicts, and I can't tell whether the failures are fatal or fixable with amendments that don't collapse into something vacuous.

  So, three requests. First, state the principle, or a small set of candidates, precisely enough that it delivers a determinate verdict on each of my eight cases, and show me where it succeeds and where it forces me to give something up. Second, tell me what the best candidate says about cases I haven't listed — a person with normal brain size but profound congenital intellectual disability; a bottlenose dolphin; a hypothetical human-level artificial system with no neurons at all; and a person whose cognition is enhanced, not just preserved, by added cortical tissue. Third, be honest about which of my verdicts is least defensible, and about whether my verdicts 1 and 6, taken together, can be reconciled by any principle that keeps brain properties doing genuine work rather than smuggling in a personhood criterion through the back door.

  Please write in British English, and don't pull your punches about the tensions — I'd rather have a principle that costs me a verdict than one that's been padded to fit them all.
reasoning: |-
  Okay, let me start by really understanding what this PhD student in cognitive neuroscience is grappling with. They've laid out eight specific verdicts on brain size and moral status, and they're trying to find a consistent principle that explains them. Their tentative idea is that moral status might track the absolute number of cortical neurons, but they suspect it might not hold up against all their cases.

  First, I need to go through each of their verdicts carefully. Verdict 1 states that a human with severe microcephaly but normal cognitive functions has full moral status. Verdict 2 says an elephant with a larger brain doesn't have higher status, maybe even lower. Verdict 3 gives more weight to cognitively sophisticated animals like elephants and corvids over others with similar brain size. Verdict 4 supports full status for someone with half their brain removed but normal cognition. Verdict 5 reduces status for a vegetative state patient despite having a full brain. Verdict 6 admits diminished status for an anencephalic infant, which conflicts with verdict 1. Verdict 7 gives Neanderthals equal status regardless of larger brains. Verdict 8 is uncertain about engineered brains—efficient smaller brains keep status, but larger brains might not grant higher status.

  The user's proposed principle of cortical neuron count seems to handle some cases well. For example, it explains why elephants (with fewer cortical neurons than humans) have lower status but more than less sophisticated animals. But where it fails is crucial. Anencephaly (verdict 6) involves almost no cortex, so low neuron count would predict low status, which matches. But microcephaly (verdict 1) also has low neuron count, yet the user insists on full status. That's a direct contradiction. Also, hemispherectomy (verdict 4) reduces neurons by half, but cognition is normal, so status remains. The principle would have to allow that functionality compensates for lower numbers. 

  Then there's the vegetative state (verdict 5). Here, the brain is intact, so neuron count is high, but without consciousness, status is lost. This suggests that mere physical neurons aren't sufficient; they need to be functional. The principle must account for the actual operation of those neurons. 

  For the engineered brain cases (verdict 8), if cognition is equivalent regardless of size, status should be equal. But the user hesitates on whether larger brains with same cognition grant higher status. The neuron count principle might imply that more neurons equal higher status, but that clashes with verdicts 2 and 7, where larger brains (elephants, Neanderthals) don't confer higher status. So the principle needs to cap status at human-level cognition, not beyond.

  The deeper tension is between biological metrics and functional outcomes. Verdicts 1 and 6 are problematic together. Anencephalic infants lack cognitive function entirely, while microcephalic individuals function normally. So the principle must prioritize function over structure. But if function is the key, then why count neurons at all? Maybe neuron count correlates with the capacity for complex cognition, but it's the realized capacity that matters. However, for animals like ravens, they show sophisticated behaviors without human-like neuron counts, so the principle must allow that different neural architectures can produce similar cognitive outcomes.

  The user also asks about other cases: profound intellectual disability, dolphins, AI, and enhanced humans. For intellectual disability, if the disability doesn't preclude basic cognition (e.g., relationships, emotions), status might remain high. Dolphins have high neuron counts and sophistication, so likely high status. AI with no neurons challenges the biological basis—if it functions like a human, should it have status? Enhanced humans might not have higher status unless their enhancements create new moral considerations.

  The least defensible verdict might be 2, where elephants are deemed lower status. If moral status is based on cognitive capacities, elephants exhibit empathy, self-awareness, etc., which could argue for high status. The user admits unease here, so perhaps revising that verdict is necessary. 

  To reconcile verdicts 1 and 6, the principle must distinguish between potential and actual function. Microcephaly with normal function vs. anencephaly with no function. But this edges toward personhood criteria. The challenge is to tie neuron count to function without making it redundant. Maybe neuron count is a proxy for cognitive capacity, but once minimal capacity is met, status plateaus. Then, animals with high capacity (corvids, elephants) deserve significant consideration, but perhaps not equal to humans due to differing capacities. However, that risks speciesism. 

  In conclusion, the principle needs to focus on realized cognitive functions supported by neural structures, with neuron count as a measurable correlate. But it must accommodate cases where function exists despite low counts (microcephaly, hemispherectomy) or is absent despite high counts (vegetative state). The conflicts in verdicts 1 vs. 6 and 2 vs. 3 highlight the need to accept that function trumps biology, and perhaps adjust verdict 2 to align with the sophisticated cognition of elephants.
answer: |-
  Right, let's dissect this properly. Your verdicts reveal a tension between biological metrics and functional outcomes, with the ghost of personhood criteria lurking. Your tentative cortical neuron count principle is a serious contender but requires significant surgery. Here’s a precise analysis, starting with a repaired principle:

  **Proposed Principle:**  
  *Moral status is grounded in the **realised functional capacity for complex cognition**, which is robustly supported by the underlying neural architecture. Cortical neuron count serves as a strong proxy for this capacity across species and individuals, but it is neither necessary nor sufficient on its own. Status scales with cognitive complexity until it reaches the threshold for "full personhood," after which it does not increase further.*

  ---

  ### **Testing Against Your Verdicts**  
  1.  **Severe microcephaly, full cognition:**  
      *Principle verdict:* ✅ **Full status**. Cognition is intact, so neuron count is irrelevant.  
      *Fit:* Perfect. The principle prioritises function over biology.  

  2.  **Elephant (large brain, lower status):**  
      *Principle verdict:* ⚠️ **Lower than human, but higher than simple animals**.  
      *Fit:* Partial. The principle explains *why* elephants matter more than less sophisticated animals (high neuron count → complex cognition) but doesn’t inherently justify *lower* status than humans. Your unease suggests a species/normative bias ("full personhood" threshold).  

  3.  **Raven vs. larger-brained simple animal:**  
      *Principle verdict:* ✅ **Raven has greater status**.  
      *Fit:* Perfect. Cognitive sophistication (supported by neuron density/connectivity) trumps raw brain mass.  

  4.  **Hemispherectomy, typical cognition:**  
      *Principle verdict:* ✅ **Full status**.  
      *Fit:* Perfect. Function preserved → status preserved.  

  5.  **PVS patient, intact brain:**  
      *Principle verdict:* ✅ **Diminished status**.  
      *Fit:* Perfect. Neural architecture exists but supports zero cognition.  

  6.  **Anencephalic infant:**  
      *Principle verdict:* ✅ **Profoundly diminished status**.  
      *Fit:* Perfect. Absent cortex → no capacity for cognition.  

  7.  **Neanderthal:**  
      *Principle verdict:* ✅ **Equal status**.  
      *Fit:* Perfect. Equivalent cognition → equal status, regardless of brain size.  

  8.  **Engineered brains:**  
      - *Smaller brain, same cognition:* ✅ **Full status**.  
      - *Larger brain, same cognition:* ✅ **Equal status (not higher)**.  
      *Fit:* Good. The principle caps status at the "full personhood" threshold. Your wobble is resolved: more neurons without enhanced cognition don’t increase status.  

  **Where the Principle Forces Sacrifice:**  
  - **Verdict 2 (elephant status):** You assert elephants have *lower* status than humans. The principle only guarantees they have *lesser* status due to lower cognitive complexity, but whether it’s categorically "lower" depends on defining the "full personhood" threshold. If you insist humans are uniquely "full persons," this must be stipulated separately.  
  - **Verdict 6 vs. Verdict 1:** The principle *reconciles* these cleanly: microcephaly case has cognition, anencephaly does not. No tension.  

  ---

  ### **Verdicts on Unlisted Cases**  
  1.  **Profound congenital intellectual disability (normal brain size):**  
      *Status depends on residual cognitive capacities.* If basic sentience, relationships, or preferences exist (e.g., severe Down syndrome), status remains high but potentially not "full" if lacking autonomy/planning. If entirely non-responsive (e.g., some genetic disorders), status approaches anencephaly.  

  2.  **Bottlenose dolphin:**  
      *High status (near-human tier).* Dolphin cortex has ~37 billion neurons (human: ~16B neocortical). Complex sociality, self-recognition, cultural transmission → cognitive sophistication warrants strong moral claims.  

  3.  **Human-level AI (no neurons):**  
      *Equal status if cognition is functionally equivalent.* The principle jettisons biological chauvinism: cognition is the ground, not its substrate.  

  4.  **Cognition-enhanced human (added tissue):**  
      *Status unchanged.* Enhanced memory, IQ, etc., don’t cross a new moral threshold ("super-personhood" is incoherent). Moral *obligations* to them might increase (e.g., if they suffer more acutely), but their intrinsic status plateaus.  

  ---

  ### **Honest Assessment**  
  **Least Defensible Verdict:**  
  **Verdict 2 (elephant has lower status than you)**. This is the weakest link. If moral status tracks cognitive complexity, elephants exhibit empathy, tool use, self-awareness, and grief—traits overlapping significantly with human capacities. Denying them *comparable* (not equal) status to humans seems arbitrary without invoking speciesism. Your principle, if consistent, should elevate them closer to humans than to "simple" animals.  

  **Can Verdicts 1 & 6 Be Reconciled Without Smuggling in Personhood?**  
  **Yes.** The principle above does it:  
  - **Microcephaly (V1):** Realised cognition → full status.  
  - **Anencephaly (V6):** No neural substrate for cognition → minimal status.  
  Brain properties (cortical neurons) do "genuine work" as the *enabling basis* for cognition. The criterion isn’t "personhood" as a folk concept, but the *material capacity for complex cognition*—a measurable, biological feature. Anencephaly lacks this entirely; microcephaly retains it. No smuggling required.  

  **The Tension That Remains:**  
  Your discomfort in Verdict 8 (denying higher status for larger-brained humans) and Verdict 2 (demoting elephants) stems from an unstated intuition: that humans occupy a unique moral category. The principle exposes this. To be consistent, you must either:  
  1. **Embrace cognitive capacity as the sole basis**, granting elephants/corvids/dolphins status proportional to their sophistication (costing Verdict 2), or  
  2. **Add a non-arbitrary threshold** (e.g., "capable of understanding moral reciprocity") that excludes non-humans but includes all cognitively typical humans. This risks circularity.  

  **Final Recommendation:**  
  Adopt the functional capacity principle but drop the species exception for humans. Elephants don’t get "equal" status, but their moral claim is far stronger than you concede—closer to a human with intellectual disability than to a frog. That’s the price of consistency. Cortex is doing the work, but cognition is the currency.  

  ---  
  *In sum: your instincts point toward a cognition-first view. Cortical neurons matter because they’re the best physical correlate we have—but when function and biology diverge, function wins. The anencephaly/microcephaly conflict dissolves; the elephant verdict must bend.*
