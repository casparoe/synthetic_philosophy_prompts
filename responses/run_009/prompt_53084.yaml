answer: |-
  The coffee machine hissed, steam fogging the window overlooking the rain-slicked parking lot. Dr. Anya Kaur stirred her tea, the spoon clinking sharply against the ceramic mug. Opposite her, Dr. Ian Millar stared at the two reports lying open between them on the laminate table, his knuckles white where he gripped his coffee cup. The formulary committee convened in an hour. The decision – tradamil or novoril – hung heavy in the air, thick as the coffee aroma.

  "Look at the registry, Ian," Kaur began, her voice calm but insistent. She tapped the first exhibit. "Sixty-five percent recovery overall for tradamil versus fifty-one for novoril. Superficially, tradamil wins. But that marginal table is poisoned. It answers the question: 'Given how we *happened* to allocate drugs in the past, what was the average outcome?' Novoril was disproportionately given to severe cases – patients we *know* do worse regardless. The weights in that weighted average – the proportion mild/severe in each drug group – are arbitrary artifacts of prescribing habits, not intrinsic properties of the drugs. The strata tell the real story: ninety percent versus ninety-two percent recovery in mild cases? Forty percent versus forty-six percent in severe? Novoril performs at least as well, arguably slightly better, consistently across both groups defined *before* treatment. The marginal reversal screams confounding by severity. Ignoring the strata ignores the actual biological question: how does each drug perform *for a given type of patient*? Acting on the marginal here would be actively harmful, perpetuating the bias that put novoril in the hardest cases to begin with."

  Millar leaned forward, his gaze fixed on Kaur. "Anya, I understand confounding. I understand why the registry *looks* that way. But you're asking the committee to act on an observational study where the allocation wasn't random. You're asking them to trust that 'severity' captures *all* the confounding. What if severity is itself a proxy? What if the doctors giving novoril to severe cases were also more aggressive, or patients opting for novoril were systematically different in ways we haven't measured? The marginal result in an observational study is flawed, yes, but it's the flawed result of the real world as it operated. Your stratified estimate assumes perfect adjustment, which we never have. Worse, it's *your choice* to stratify by severity. Why not age? Comorbidity? Hospital site? Stratification *after* seeing the data is a playground for motivated reasoning. I’ve seen subgroups carved to overturn unambiguous trial results. The marginal result, flawed as it is, at least reflects the totality of the unmanipulated data."

  Kaur didn't flinch. "So you dismiss the strata because we *might* have residual confounding? By that logic, we should abandon epidemiology entirely! The strength of the reversal here, the biological plausibility of severity confounding treatment effect – it’s overwhelming. Would you honestly argue, looking at *this specific table*, that we should recommend tradamil because its overall recovery is higher, *knowing* that difference arises purely because novoril bore the burden of treating sicker patients? That violates the very spirit of causal inference. It’s like the Berkeley admissions data – rejecting better-qualified women applicants department by department because the marginal showed men had higher acceptance, ignoring that women applied to tougher programs. Acting on the marginal is endorsing the bias."

  "The Berkeley case *proves my point*," Millar countered sharply. "The marginal wasn't 'wrong'; it accurately described the overall acceptance process, warts and all. The strata revealed the department-level bias *against* women. But here? Your strata reveal what you *assume* is bias *against* novoril. It’s an assumption. Now look at Exhibit Two." He shoved the trial report towards her. "Randomized. Properly conducted. The gold standard. The marginal is clear: forty-eight percent recovery on novoril versus forty-two percent on tradamil. Six percentage points. Statistically significant. Novoril wins. End of story. The committee *is* entitled to act on this. It’s the direct answer to the question: 'What happens, on average, if we give the population this drug?' Randomization ensures the groups are comparable. The marginal *is* the causal effect for the enrolled population."

  "Then why," Kaur asked quietly, pointing to the second table within the trial report, "when we stratify by blood pressure control at one month, does tradamil look better in *both* strata? Eighty percent versus seventy-six percent in controlled; twenty-three percent versus twenty percent in uncontrolled. The reversal is there, Ian. Right in your precious randomized trial. Novoril gets more people *to* control – fifty percent versus thirty-three – but once there, or once *not* there, tradamil seems to have the edge. Doesn’t that make you pause? Doesn’t that suggest the marginal effect might be hiding something important about *how* the drugs work?"

  Millar slammed his hand lightly on the table. "That’s exactly the mischief I warned about! Blood pressure control at one month is a *post-randomization* variable, Anya! It’s not like severity measured at baseline. It’s an *outcome* of the treatment itself! Stratifying by it introduces exactly the kind of selection bias we randomized to avoid. Think about it: which patients achieve control? Probably those with less severe disease, better adherence, maybe even a different biological response – factors now entangled with the treatment arm. Comparing outcomes *within* these strata isn't comparing like-with-like *anymore* because the groups achieving control on novoril might be systematically different from those achieving it on tradamil, precisely *because* the drugs have different effects on achieving control! This stratification violates the principles of causal inference for intermediate outcomes. It’s classic conditioning on a collider. The marginal result stands because randomization protects it."

  Kaur took a slow sip of tea, buying time. "You’re invoking theory, Ian, and correctly about the post-treatment status. But look at the data pragmatically. The reversal is stark. Novoril gets more people to control, which is good, but *among those who reach the same physiological state* – controlled or uncontrolled BP – tradamil performs better. Isn't that relevant? If we have patients who *are* controlled at one month, shouldn't we know which drug gives them better final outcomes *from that point*? The marginal tells us novoril is better *on average*. This tells us *why* and *for whom* it might be better – by achieving control for more people. But it also hints that for patients who *do* achieve control early, tradamil might be marginally superior. That’s valuable clinical nuance!"

  "It’s statistical quicksand," Millar retorted. "You’re falling for the exact trap. The 'patients who are controlled' on novoril are not comparable to the 'patients who are controlled' on tradamil precisely *because* novoril is better at getting people controlled! The tradamil group that *achieved* control might be a highly selected, resilient subgroup – the 'easy' cases who would have done well on anything. The novoril group achieving control might include people who were harder to control but responded well to novoril. Comparing their final outcomes isn't fair. It’s like the kidney stone paradox – small stones look better with open surgery, large stones with percutaneous, but the marginal might favor percutaneous overall because it handles larger stones better. But if you conditioned on 'stone size resolved at one week' – an intermediate outcome – you could get any reversal you wanted! Stratifying on post-treatment variables distorts the causal pathway. The marginal effect from randomization is the cleanest answer we have."

  Kaur leaned back, conceding the point about the timing. "Alright, Ian. I grant you the blood pressure control status is problematic *because* it's measured after treatment starts. It’s not a fixed baseline characteristic like severity in the registry. Conditioning on it risks introducing bias. I see that." She paused, gathering her thoughts. "But that doesn't magically validate the *registry's* marginal table! You’ve admitted the trial's marginal is reliable *because* of randomization. The registry lacks that. Severity *is* baseline. Conditioning on it *reduces* confounding bias; it doesn't manufacture it like conditioning on a post-treatment variable might. To equate the two stratifications – one on a pre-treatment confounder, one on a post-treatment mediator – is false equivalence. The registry marginal is confounded garbage. The trial marginal is causal gold. But the registry *strata*, under the unavoidable limitations of observation, point towards equivalence or slight novoril benefit. The trial *strata*, precisely *because* they condition on a post-randomization variable, are potentially misleading and shouldn't override the marginal."

  Millar nodded slowly, a reluctant acknowledgment. "Fair. I concede that severity in the registry is qualitatively different from BP control in the trial. Pre-treatment stratification in observation *can* help control for known confounders. It’s imperfect, but it’s the best we have outside an RCT." He rubbed his temples. "But Anya, here’s the rub. Looking at these two tables... the registry strata and the trial strata... purely mathematically, they are both instances of Simpson's reversal. The arithmetic is identical. Yet you argue we should *believe* the registry strata and *disregard* the trial strata. I argue we should *believe* the trial marginal and disregard *both* stratified analyses for decision-making, though the registry strata are less misleading than its marginal. How do we decide, purely from the numbers on these pages, which interpretation is correct? Is there a rule inscribed in the data itself that tells us when stratification is illuminating versus misleading?"

  The coffee machine's gurgle filled the sudden silence. This was the chasm.

  "That’s the question, isn't it?" Kaur murmured. "The data alone... no. The numbers don't come with metadata labels saying 'Confounder!' or 'Mediator!'. The arithmetic of the reversal tells us *that* it happened, not *why* or *what it means*. The registry marginal *suggests* tradamil is superior. The reversal *suggests* confounding. The severity variable *suggests* itself as the confounder because it’s biologically plausible and measured pre-treatment. The trial marginal *suggests* novoril is superior. The reversal *suggests*... something complex about pathways, but conditioning on the intermediate variable *suggests* potential bias. We need the *context*."

  "Exactly," Millar said, his voice low and intense. "We need the design. Randomization in the trial protects the marginal. Observational design in the registry means its marginal is suspect. We need the temporal ordering. Severity precedes treatment; BP control follows it. We need subject-matter knowledge. Does severity plausibly affect both treatment choice and outcome? Absolutely. Does BP control plausibly affect outcome? Yes. Is it also an effect of treatment? Yes. That’s why it’s dangerous to condition on. The tables alone are silent. We bring the understanding *to* the tables."

  Kaur picked up the thread. "So, for the committee... the registry alone? We *must* stratify by severity. Ignoring it is indefensible. The marginal is misleading. The stratified analysis, while imperfect, points towards no significant difference, maybe a tiny novoril edge. But it’s observational – weak evidence. The trial? Randomization trumps. Its marginal is our best estimate of the average causal effect. Novoril is better overall. The stratified analysis by BP control is biologically interesting but causally ambiguous for the reasons you stated; it shouldn't overturn the marginal result from the RCT. We recommend novoril based on the trial marginal."

  Millar was silent for a long moment. "Broadly... yes. The trial carries the day. Novoril." He tapped the registry report. "But Anya, my fundamental unease remains. Even with the registry. You see severity stratification as clarifying. I see it as introducing model dependence. What if there's another unmeasured confounder that stratification *didn't* fix? What if severity was measured poorly? The stratified result feels cleaner, but it’s still an observational estimate. My instinct is always to distrust analyses that reverse a marginal, *especially* when they rely on chosen adjustments. The RCT marginal feels like terra firma."

  "And my instinct," Kaur replied, "is to distrust marginal associations when there’s a glaring, plausible confounder staring us in the face. Ignoring it feels like willful blindness. The Sure-Thing Principle – if novoril is better for mild *and* for severe, it *should* be better overall. When it’s not, that’s a red flag demanding investigation, not dismissal. In the registry, stratification *is* that investigation. In the trial, the marginal *is* the answer, and the reversal is a fascinating biological puzzle, not a reason to doubt the primary result. But yes," she conceded, "the RCT result is paramount."

  Millar pushed his chair back, the legs scraping on the floor. "So we tell the committee: The trial shows novoril is superior overall. The registry, analyzed appropriately, doesn't contradict this and suggests the effect might be reasonably consistent across severity groups. The blood pressure stratification in the trial is intriguing but shouldn't guide the formulary decision." He stood up. "We agree on the recommendation: novoril."

  Kaur stood too, gathering the reports. "We agree on the recommendation. But Ian..."

  He paused at the door. "Yes?"

  "We still disagree on *why* the registry stratification was necessary and the trial stratification wasn't, beyond just 'RCT good, observation bad'. We disagree on the inherent trustworthiness of a stratified result versus a marginal one when faced with reversal. You see stratification as the first step onto a slippery slope. I see ignoring obvious confounding as the greater sin. That tension... it doesn't go away with this decision."

  Millar offered a thin, weary smile. "No, Anya. It doesn't. That’s why we still need both epidemiologists and trialists... and committees smart enough to listen to the argument. Now, let’s go tell them novoril." He opened the door, the murmur of the gathering committee already audible down the hall.

  Kaur followed, the unresolved weight of their methodological divide settling alongside the agreed-upon answer. The numbers on the page were identical in their reversal, yet worlds apart in their meaning. The lesson, she thought, wasn't in the arithmetic, but in everything surrounding it. The committee would get their recommendation. Her students, she hoped, would grasp the deeper, messier truth.
