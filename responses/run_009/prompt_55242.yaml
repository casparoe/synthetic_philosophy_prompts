  ### **Scoring Key**
  Map verdict patterns to philosophical positions. Each verdict is coded:  
  - **A** = Alive  
  - **B** = Not alive  
  - **C** = Borderline  

  The 10 cases are ordered as above (1–10). Patterns are based on idealized views; partial matches are expected. Positions are separated using disagreements (e.g., Cases 1, 6, 8, 10).  

  #### **Named Positions**  
  1. **Metabolic/Autopoietic View** (Self-maintaining systems):  
     - Pattern: `B, B, A, A, B, B, B, B, A, B`  
     - Why: Life requires metabolism within a bounded system (e.g., cells). Viruses (1), prions (2), and digital/abstract cases (6–7) lack metabolism; crystals (5) and networks (8) lack boundaries. Mules (3) and extraterrestrials (9) are bounded metabolic systems. Colonies (10) are not individual systems.  
     - *Note: Metabolic and autopoietic views are indistinguishable here; both reject Cases 1, 2, 5–8, 10 for similar reasons.*

  2. **Evolutionary View** (Darwinian systems, NASA-style):  
     - Pattern: `C, B, C, A, B, B, B, B, A, A`  
     - Why: Life requires evolution via heritable variation (Case 9) and reproduction (NASA definition). Viruses (1) and mules (3) are borderline due to dependency/sterility. Dormant spores (4) are alive (revivable lineage). Non-chemical (6–7) and non-evolving systems (5, 8) fail. Colonies (10) evolve collectively.

  3. **Thermodynamic/Dissipative View** (Energy-driven complexity):  
     - Pattern: `B, B, A, A, C, B, B, A, A, A`  
     - Why: Life maintains order by dissipating energy. Crystals (5) are borderline (energy-driven but static). Reaction networks (8) and colonies (10) dissipate energy; viruses (1) and prions (2) do not. Extraterrestrials (9) are included if energy-dependent.

  4. **Information-Theoretic View** (Information processing):  
     - Pattern: `A, B, A, A, B, A, A, B, A, A`  
     - Why: Life is defined by information storage/transmission (e.g., genetics). Viruses (1), digital patterns (6–7), and colonies (10) qualify. Prions (2) and reaction networks (8) lack coded information; crystals (5) fail entirely.

  5. **Family-Resemblance Deflationism** (Cluster concept):  
     - Pattern: **High frequency of "C" (Borderline)**.  
     - Why: No single definition exists; life is a cluster of properties (e.g., metabolism, evolution). Expect borderline verdicts for debated cases (e.g., 1, 3, 5, 6, 8, 10). Scoring: ≥4 "C" verdicts suggests this view.

  6. **Eliminativist View** (No natural kind):  
     - Pattern: **All "B" or ≥7 "B"** OR **inconsistent verdicts**.  
     - Why: "Life" is not scientifically coherent. Rejects most cases as "not alive" or gives arbitrary verdicts.  

  #### **Agreements and Indistinguishability**  
  - **Metabolic vs. Autopoietic**: No case separates them (e.g., both reject the reaction network for lacking boundaries/metabolism).  
  - **Evolutionary vs. Metabolic/Autopoietic**: Separated by **Case 10 (ant colony)**: Evolutionary accepts (collective evolution); Metabolic rejects (not an individual). Also **Case 1 (virus)**: Evolutionary is borderline; Metabolic is "not alive."  
  - **Evolutionary vs. Thermodynamic**: Separated by **Case 8 (reaction network)**: Thermodynamic accepts (energy dissipation); Evolutionary rejects (no evolution).  
  - **All views agree on**: Prions (2; not alive), dormant spores (4; alive), extraterrestrials (9; alive), and crystals (5; not alive or borderline).  

  #### **Unmapped Combinations**  
  | Combination | Why Unmapped | Likely Reason |  
  |-------------|-------------|---------------|  
  | **All "A" verdicts** | Assigns life to everything (e.g., crystals, prions). | Unattractive: Overly inclusive, ignores intuitive boundaries. |  
  | **All "C" verdicts** | Treats all cases as borderline. | Unexplored: Rarely defended; eliminativism or deflationism may approximate it. |  
  | **Mule (3) "B" + Virus (1) "A"** | Virus alive but mule borderline. | Incoherent: Mule has more life-typical properties (metabolism, response) than virus. |  
  | **Network (8) "A" + Crystal (5) "B"** | Network alive but crystal borderline. | Unattractive: Network has no evolution/information; crystal has fewer life-like properties. |  

  #### **How to Score**  
  1. Tally the participant’s verdicts (A/B/C) for Cases 1–10.  
  2. Match the pattern to the closest position (e.g., 7+ matches).  
  3. For deflationism, count borderline verdicts; for eliminativism, look for inconsistency or blanket rejection.  
  4. Highlight unmapped combinations as discussion points.  

  This key reveals how verdicts align with theories, exposes tensions (e.g., mules vs. viruses), and underscores that intuitive judgments often diverge from stated definitions—supporting your hypothesis.
