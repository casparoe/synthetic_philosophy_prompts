  Below is a 10-question quiz designed to probe participants' implicit definitions of life by presenting concrete cases. Each question asks for a verdict ("Alive," "Not alive," or "Borderline") without referencing any philosophical positions. The cases cover key examples from your list, plus an additional case (an ant colony) that tests whether life can be attributed to collective entities, which other cases do not address. The quiz is written for non-biologists; no specialized knowledge is needed beyond the descriptions provided.

