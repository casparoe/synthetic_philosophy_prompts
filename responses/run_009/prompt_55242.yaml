  ### **Quiz: Verdicts on Life**
  *For each case, choose one verdict:*  
  **A) Alive**  
  **B) Not alive**  
  **C) Borderline** (add a brief note explaining why it’s ambiguous)  

  1. **Virus**: A microscopic particle that infects cells. It contains genetic material (DNA or RNA) and can evolve but lacks metabolism and cannot replicate without hijacking a host cell’s machinery.  
     Verdict: ☐ A ☐ B ☐ C (Note: _____)  

  2. **Prion**: An infectious, misfolded protein that causes other proteins to misfold (e.g., in mad cow disease). It replicates structurally but has no genetic material, metabolism, or cellular structure.  
     Verdict: ☐ A ☐ B ☐ C (Note: _____)  

  3. **Sterile mule**: The offspring of a horse and donkey. It eats, breathes, moves, and ages like its parents but is sterile and cannot reproduce.  
     Verdict: ☐ A ☐ B ☐ C (Note: _____)  

  4. **Ancient bacterial spore**: A dormant bacterial cell revived after 10,000 years in ice. It was inactive and showed no signs of life during dormancy but later grew and reproduced.  
     Verdict: ☐ A ☐ B ☐ C (Note: _____)  

  5. **Growing crystal**: A mineral crystal (e.g., salt or quartz) that grows in a solution by adding molecules to its structure. It "metabolizes" materials and energy but has no genetic material and cannot evolve.  
     Verdict: ☐ A ☐ B ☐ C (Note: _____)  

  6. **Game of Life pattern**: A self-replicating digital pattern in a computer simulation (e.g., Conway’s Game of Life). It copies itself, mutates, and evolves via simple rules but exists only as code in a machine.  
     Verdict: ☐ A ☐ B ☐ C (Note: _____)  

  7. **Computer virus**: A program that copies itself across computers, "evolves" via code mutations, and requires a host (computer) to function. It is non-physical and lacks metabolism.  
     Verdict: ☐ A ☐ B ☐ C (Note: _____)  

  8. **Autocatalytic reaction network**: Chemicals in a lab reactor that sustain self-replicating reactions (e.g., products catalyze their own production). It has metabolism-like activity but no genetic material, cells, or evolution.  
     Verdict: ☐ A ☐ B ☐ C (Note: _____)  

  9. **Extraterrestrial microorganism**: A hypothetical alien cell from another planet. It reproduces, evolves, and maintains itself but uses entirely different chemistry (e.g., not carbon-based) from Earth life.  
     Verdict: ☐ A ☐ B ☐ C (Note: _____)  

  10. **Ant colony**: A colony of ants functioning as a unit—workers forage and defend, while the queen produces offspring. The colony evolves and "reproduces" by splitting, but individual workers are sterile.  
      Verdict: ☐ A ☐ B ☐ C (Note: _____)  

