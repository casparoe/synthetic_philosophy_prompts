prompt: |-
  So my friend Dev and I just wrapped up a four-hour argument (over coffee that went cold, then pizza) about expected value fanaticism, and we've decided the only productive thing left is to do one of those adversarial collaboration writeups people talk about. I want you to draft it for us.

  Where we each stand: Dev is basically the fanatic. He thinks that if you're choosing between (a) a certain outcome of a few thousand units of well-being, say saving a handful of people, and (b) a one-in-10^50 shot at a future containing trillions of trillions of flourishing lives, you're obligated to pick (b), because expected value just dominates, and anything else is a kind of temporal provincialism — privileging the people you can see. I'm the moderate. I don't dispute the arithmetic, but I think something is off about letting vanishingly small probabilities of astronomically large payoffs swamp everything else, and I have a pile of half-formed worries: that our "utility" numbers stop meaning anything across that many orders of magnitude, that we're clueless enough about the far future that tiny-probability estimates are basically noise, and that a bounded value function is not the ad hoc cop-out Dev says it is.

  Here's what I want the document to contain:

  1. A numbered section of claims we can both sign. These should be substantive — about the St Petersburg-style structure of the problem, about what "fanaticism" even means as a formal condition (roughly: choosing the tiny-probability-huge-payoff option over a certain modest one, and doing so at any probability however small), about which of our disagreements are really just verbal (I suspect at least one is: whether "risk aversion" is even coherent when the thing being risked is impersonal value rather than anybody's welfare — but you decide, and commit).

  2. A disagreements table: each residual disagreement stated so precisely that the person holding the view would accept the wording as a fair statement of their own position. No slanted phrasing that smuggles in a win for either side.

  3. The cruxes — the subquestions such that settling one would actually move at least one of us. Don't give me a menu; pick the ones you think genuinely matter and say why you picked those. Dev thinks the deepest one is whether unbounded aggregation of value is coherent; I think it might be whether credences of 1-in-10^50 can carry any normative weight at all given where they come from (back-of-envelope estimates stacked on back-of-envelope estimates). Include at least one crux neither of us has thought of if you can find a real one.

  4. For each crux, a concrete case, argument, or thought experiment we'd both agree bears on it — ideally something like: the repeatable version of the choice (facing the same gamble a million times vs. once), or the "many independent tiny chances" scenario where the fanatic and the moderate verdicts flip depending on whether you aggregate across decisions. Write down each of our predictions in advance, in our own voices, so we can be scored later.

  A few ground rules for you: write it in American English. Don't hedge into uselessness — this is the committed thing for me: I want you to actually take positions in the draft, decide which disagreements are verbal and which are real, pick the cruxes, don't present three options and leave us to choose. If you think one of us is just confused about something, come out and say it in the document (that's allowed in an adversarial collaboration, it just has to be said fairly). And keep the joint statement something we could both genuinely put our names on — the point is a text that separates what we know from what we're each betting on. Also if it matters for wording: our argument got a little heated about whether the word "fanatic" is doing argumentative work by itself, so pay attention to when a term is doing real work vs. when its just rhetorical.
