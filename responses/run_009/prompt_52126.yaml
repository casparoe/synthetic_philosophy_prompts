prompt: |-
  I run a betting pool with some friends at school -- we each put in like $20 at the start of the semester and bet on stuff all year, fantasy football, whether it snows before Thanksgiving, dumb bets people propose at lunch. Most people in the pool just bet whatever feels right and go broke in a month. I read somewhere that there's this Kelly thing that says you should size bets by how much edge you have, and also something about how if you bet too much even on good bets you lose money over time because of compounding?? But we almost never have real probabilities for anything, and half the people in the pool don't care about math and just want to bet big on the homecoming game. Can you turn the Kelly idea into like an actual procedure I can run in a couple minutes whenever someone proposes a bet? Like what questions do I ask myself in order, what counts as an answer, when does the procedure just say bet small or don't bet at all, and when do I have to admit it's a gut call and the math can't settle it. Then run it on two bets for me: one where someone wants to put their whole remaining bankroll on a bet they feel super confident about, and one on a bet I actually know the odds of (like a dice game we play where I know I win like 55% of the time). And be honest about where my gut is probably going to mess this up even if I follow the procedure.
reasoning: |-
  Okay, let me tackle this user's query. They run a betting pool with friends and have heard about the Kelly Criterion but need a practical way to apply it quickly. The key challenges are the lack of real probabilities and the casual betting environment. 

  First, I need to simplify Kelly into a usable procedure. The core idea is sizing bets based on edge and odds. But since exact probabilities are rare, I should focus on estimating two things: confidence (as a proxy for probability) and the offered odds. 

  The user mentioned two example bets: one where someone goes all-in based on gut feeling, and a dice game with known 55% win rate. For the first scenario, the person's overconfidence is a red flag. Even if they feel 90% sure, Kelly would cap the bet at 10% of their bankroll. That's a huge gap from their all-in approach. I should emphasize how this mathematically prevents blowups.

  For the dice game, it's cleaner: 55% win probability against even odds gives a 10% edge. The Kelly fraction is straightforward here - bet 10% of the bankroll. But I must warn about human tendencies: people either underbet (fearing variance) or overbet (greed), both hurting long-term growth.

  The user's deeper needs are reliability and avoiding bankruptcy. They're surrounded by impulsive bettors, so the procedure must include clear "walk away" triggers: when confidence is below 50%, when odds are unfair, or when the calculated fraction is negative. 

  I should also address real-world friction. Gut estimates will be messy - maybe suggest using ranges (pessimistic/optimistic) and taking the average. And stress that if uncertainty is too high, no math can save you; it's okay to skip the bet.

  Finally, the honesty part: our brains sabotage this. We anchor to first estimates, ignore unknowns, and chase losses. The procedure must include a "sanity check" step to counter these biases. Maybe suggest writing down estimates before knowing the bet size to avoid anchoring.
answer: |-
  Here's a practical Kelly-inspired betting procedure designed for speed and real-world school betting chaos. Forget complex formulas – this focuses on **estimation** and **risk control**.

  **The 5-Minute Kelly Procedure:**

  1.  **Ask: "What's my *honest* chance of winning (%)?"**
      *   *What counts:* A gut-feel percentage (e.g., "I think they have a 70% shot"). Be pessimistic. If it feels like a coin flip, say 51% or 49%, NOT 50%.
      *   *If you have ZERO clue:* Skip the bet, or assign 50% (which usually means "don't bet" later). Realize this is pure gambling.
      *   *Gut Mess-Up Risk:* Overconfidence! Humans consistently overestimate their chances, especially when excited. Knock your estimate down 5-10% mentally.

  2.  **Ask: "What are the *actual* odds being offered?"**
      *   *What counts:* Convert the bet terms to a multiplier. If it's "even money" ($10 wins $10), multiplier = 2.0 (you get $20 back on a $10 bet). If it's "2-to-1" ($10 wins $20), multiplier = 3.0 (you get $30 back). If it's "I get $15 if I win, you get $10 if I lose", your profit is $15 on a $10 stake, so multiplier = (Stake + Profit) / Stake = (10 + 15)/10 = 2.5.
      *   *Gut Mess-Up Risk:* Misunderstanding the payout. Double-check the money flow.

  3.  **Calculate: Edge & Kelly Fraction (Simplified)**
      *   **Your Chance (P):** From Step 1 (e.g., 0.70 for 70%)
      *   **Odds Multiplier (B):** From Step 2 (e.g., 2.0 for even money)
      *   **Fair Probability (Q):** `Q = 1 / B` (The probability implied by the odds. e.g., `1 / 2.0 = 0.50` or 50%)
      *   **Your Edge:** `Edge = P - Q` (e.g., `0.70 - 0.50 = 0.20` or 20%)
      *   **Simplified Kelly Fraction (K%):** `K% = Edge / (B - 1)` (e.g., `0.20 / (2.0 - 1) = 0.20 / 1 = 0.20` or **20%**)
      *   *Alternative Shortcut (If Edge is negative):* If `P < Q` (your chance < the fair chance), **Edge is Negative**. `K% = Negative`. Skip to Step 4.

  4.  **Decision Rules:**
      *   **K% is Negative (P < Q):** **DO NOT BET.** You're getting worse odds than your estimate says is fair. Walk away.
      *   **K% = 0% to 5%:** **Bet Tiny or Skip.** (e.g., 0.5% to 5% of your bankroll). Edge is small; not worth significant risk or the hassle.
      *   **K% = 5% to 15%:** **Bet Small to Medium.** (e.g., 5% to 15% of bankroll). This is the sweet spot for most decent opportunities.
      *   **K% = 15% to 25%:** **Bet Medium.** (e.g., 15% to 25%). Strong edge, but be cautious. *Rare in casual betting.*
      *   **K% > 25%:** **Bet Fractionally OR Re-Check Estimate.** (e.g., Bet 15-25% MAX). Extremely high K% usually means you're overconfident (P too high) or the odds are suspiciously good (B too high). Re-evaluate Step 1 & 2 critically. **NEVER bet your whole bankroll.**
      *   **Cannot Assign P or B:** **Gut Call / Skip.** Math can't help without estimates.

  5.  **Execute:** Bet the calculated *percentage* of your **current remaining bankroll**, not your starting $20.

  **Key Principles Embedded:**

  *   **Bet proportionally to your edge (P - Q).** Bigger edge? Bigger (but still fractional) bet.
  *   **Bet inversely to the payout (B).** Huge payouts (high B) usually mean the bet is bad (Q is tiny), requiring a huge edge to justify even a small bet.
  *   **Protect your bankroll.** Fractional betting prevents ruin and harnesses compounding. Losing 50% requires a 100% gain just to break even!
  *   **Negative Edge = No Bet.** Don't throw money away.

  **Example 1: The "Sure Thing" All-In Bet**

  *   **Scenario:** Your friend has $15 left in the pool. They offer you: "I bet my whole $15 that the cafeteria serves pizza tomorrow! If I win, you give me $15. If I lose (no pizza), I give you $15." They feel "90% sure".
  *   **Your Analysis:**
      1.  **P (Your Chance of Winning - Them Losing)?** They think it's 90% likely. You're skeptical. You know pizza days are random. You pessimistically estimate **P = 70%** (0.70). (Gut Check: You might be tempted to say 50% or 90% yourself. Be harsh!).
      2.  **B (Multiplier)?** If you bet $15 and win, you *profit* $15 (their $15). Multiplier B = (Stake + Profit) / Stake = ($15 + $15) / $15 = **2.0**.
      3.  **Q (Fair Odds Probability)?** Q = 1 / B = 1 / 2.0 = **0.50** (50%).
      4.  **Edge?** Edge = P - Q = 0.70 - 0.50 = **0.20** (20%).
      5.  **K%?** K% = Edge / (B - 1) = 0.20 / (2.0 - 1) = 0.20 / 1 = **0.20** (20%).
      6.  **Decision:** K% = 20% falls into "Bet Medium" (15-25%). You decide to bet **15%** of your *current* bankroll. (e.g., If you have $40, bet $6). **You DO NOT bet their whole $15 against your $15.**
  *   **Why this works:** Your friend is massively overbetting (betting 100% of their roll on a ~70% shot). Kelly says even with your decent edge, 20% is the *maximum* mathematically optimal bet. Betting less (15%) is prudent. You avoid ruin if the unexpected happens (no pizza!). They go broke if they're wrong just once; you survive many losses.

  **Example 2: The Dice Game (Known Odds)**

  *   **Scenario:** You play a simple dice game where you know your true win probability is **55%** (P = 0.55). The bet is **even money** (B = 2.0). You win $X on a $X bet.
  *   **Your Analysis:**
      1.  **P?** Known! **0.55**
      2.  **B?** Known! **2.0** (Win $10 on a $10 bet, get $20 back)
      3.  **Q?** Q = 1 / B = 1 / 2.0 = **0.50**
      4.  **Edge?** Edge = P - Q = 0.55 - 0.50 = **0.05** (5%)
      5.  **K%?** K% = Edge / (B - 1) = 0.05 / (2.0 - 1) = 0.05 / 1 = **0.05** (5%)
      6.  **Decision:** K% = 5% falls into "Bet Small" (5-15%). You bet **5%** of your current bankroll.
  *   **Why this works:** Even with a known positive edge (55% vs 50%), the edge is modest. Betting too much (e.g., 20%) exposes you to wild swings that *reduce* your long-term growth rate due to compounding losses. Betting 5% grows your bankroll steadily and safely over many plays. Betting less than 5% is overly cautious; betting more than 10% is unnecessarily risky.

  **Honest Gut Mess-Up Warnings:**

  1.  **Overconfidence in P:** This is the #1 killer. You *will* think your sports team/trivia knowledge/lunch rumor is more reliable than it is. **Be brutal.** Knock your P estimate down. Ask "What's the MINIMUM chance I think this has?" Use that.
  2.  **Ignoring Uncertainty:** If estimating P feels like grabbing a number from thin air (e.g., "Is Ms. Smith pregnant? I heard a rumor!"), **your K% is meaningless.** Classify this as "Cannot Assign P" and skip or make a tiny fun bet (<1%).
  3.  **Anchoring on the Stake:** Don't let the size of the bet proposed influence your P estimate. Judge the *probability* first, independently.
  4.  **Chasing Losses:** Your bankroll is *now*, not what you started with. Betting a % of a shrinking bankroll feels awful, but it's essential to avoid death spirals. Stick to the %.
  5.  **FOMO / Peer Pressure:** Seeing others bet big (and sometimes win) will tempt you to abandon the plan. Remember, they are the ones who "go broke in a month." Your goal is to be the last one standing.
  6.  **Underestimating Variance:** A 5% bet *will* lose 4 times in a row sometimes. A 20% bet *will* lose 2-3 times in a row scarily often. Don't abandon the math after a few losses. Trust the long-term edge.
  7.  **Round Numbers:** Don't bet exactly 10% every time just because it's easy. Calculate the K% each time. Sometimes it's 3%, sometimes it's 12%.

  **When to Admit it's a Gut Call:**

  *   **Novelty:** Bets on unpredictable human behavior (e.g., "Will Jake ask Sarah to prom before Friday?"), unique events ("Will the principal wear a silly hat on Spirit Day?"), or complex outcomes ("Who will win the Science Fair?").
  *   **High Emotion:** If the bet is deeply personal or the outcome matters a lot to you, your P estimate will be garbage.
  *   **Zero Information:** Truly no basis for an estimate.
  *   **The Fun Factor:** Sometimes a tiny bet (<1%) is worth it for the excitement, even if K% is low or negative. Just budget for it like buying a candy bar.

  **The Bottom Line:** This procedure forces you to **estimate your advantage** and **size your bets proportionally to that advantage while protecting your capital**. It won't give you perfect answers for fuzzy lunchtime bets, but it will *massively* reduce reckless overbetting and make you the disciplined favorite in the pool over the long run. Remember: **Survival and steady growth beat impulsive glory.** Good luck!
