answer: |-
  ### Nudge Evaluation Procedure: Ethics-Based Decision Flow  
  **Grounding:** Combines libertarian paternalism (Thaler & Sunstein), autonomy principles (Kantian respect for persons), and intensity-based critique (Mills on proportionality). Addresses "wants vs. would-want" via reflective preferences (Sunstein's "as judged by themselves" standard).

  ---

  ### Step-by-Step Procedure  
  *Each step must be answered sequentially. Outputs: 🛑 = Hard "No" | ✅ = "Yes" | ⚠️ = "Yes with Conditions" | 👥 = "Hand to Human".*  

  1. **Beneficiary Primacy Check**  
     - *Question:* **Is the *primary* beneficiary of this nudge the user (not the company), with evidence?**  
     - *Sufficient Answer:* Clear data/metrics showing user benefit (e.g., reduced losses, improved financial health) that outweighs company gain. Benefit must align with common user goals (e.g., saving, avoiding scams).  
     - *Dodge:* Vague claims of "mutual benefit" without proof; using company revenue as a KPI.  
     - *Output:* 🛑 if fails. Else, proceed.  

  2. **Autonomy Preservation & Intensity Assessment**  
     - *Question:* **Does the nudge preserve an equally visible, low-friction path to opt out?**  
       - *Intensity Tiers:*  
         - Low: Defaults (1-click revert).  
         - Medium: Friction (e.g., 1 confirmation screen).  
         - High: Hidden opt-outs, multi-step escapes, or delays (e.g., >1 menu, timers >10s).  
     - *Sufficient Answer:* Opt-out path is equally prominent and ≤2 actions; intensity matches risk (e.g., high friction only for high-harm actions like large withdrawals).  
     - *Dodge:* "Users can technically opt out" without assessing discoverability or effort.  
     - *Output:* 🛑 if High intensity for Low/Medium stakes. ⚠️ if fixable (e.g., redesign opt-out). Else, proceed.  

  3. **Grudge Test (Retrospective Fairness)**  
     - *Question:* **Would the median user feel fairly treated (not "suckered") upon learning how this nudge works?**  
     - *Sufficient Answer:* Evidence (e.g., user testing, surveys) or strong inference that most users would approve the method if explained (e.g., "This saved me from scams").  
     - *Dodge:* "Users won’t find out" or "They’ll forgive us if it helps."  
     - *Output:* 🛑 if fails (e.g., feels deceptive). Else, proceed.  

  4. **Reflective Preference Alignment**  
     - *Question:* **Is there evidence the nudge aligns with what users *would want* upon reflection (not just immediate behavior)?**  
       - *Wants vs. Would-Want Resolution:* Use data from:  
         - Regret metrics (e.g., "undo" requests, support tickets).  
         - Stated preferences (surveys, interviews).  
         - High-stakes harm avoidance (e.g., fraud protection).  
     - *Sufficient Answer:* Objective proof of alignment (e.g., 80%+ of scammed users wish they had a cooldown).  
     - *Dodge:* Assuming "we know best" without data; conflating company goals with user interests.  
     - *Output:* 👥 if evidence is weak but stakes are high (requires ethical review). 🛑 if no evidence + High intensity. Else, proceed.  

  5. **Transparency & Proportionality Finale**  
     - *Question:* **Is the nudge transparent in effect and proportional to the user’s risk?**  
       - *Transparency Requirement:* Nudges must not obscure outcomes (e.g., fees, locks). Explain mechanics if triggered (e.g., "This timer prevents impulsive withdrawals").  
       - *Proportionality:* Low friction for low stakes (e.g., defaults on savings); higher friction allowed only for high stakes (e.g., irreversible losses).  
     - *Output:* ✅ if all pass. ⚠️ if transparency/proportionality needs tweaks (e.g., add tooltip).  

  ---

  ### Worked Examples  
  **Case 1: Round-Up Savings Default (Locked 30-Day Account)**  
  - **Step 1:** ✅ (User benefit: proven savings growth).  
  - **Step 2:** 🛑 **Fails!** High intensity (opt-out behind two menus) for Medium stakes (savings lock). Opt-out friction is undue burden.  
  - *Grudge Test Preview:* Users locked out of funds would feel suckered ("You trapped my money!").  
  - **Verdict:** 🛑 Reject. *Concessions for ⚠️:* Reduce opt-out to 1 click; add lock disclaimer at enrollment.  

  **Case 2: Withdrawal Cooldown Timer (40%+ Balance)**  
  - **Step 1:** ✅ (User benefit: reduces scam losses).  
  - **Step 2:** ✅ Medium/High intensity (cooldown + confirmations) matches High stakes (financial ruin).  
  - **Step 3:** ✅ Grudge Test passes (scam victims approve; "I wish I had this").  
  - **Step 4:** ✅ Evidence: Fraud regret tickets show 70% want intervention.  
  - **Step 5:** ✅ Transparency: Screen says, "This protects you from scams."  
  - **Verdict:** ✅ Approve.  

  **Case 3: Pre-Selected 12% Platform Tip (Small Gray Opt-Out)**  
  - **Step 1:** 🛑 **Fails!** Primary beneficiary is company (revenue boost). User benefit negligible.  
  - **Step 2:** 🛑 High intensity (de-emphasized opt-out) for Low stakes (tipping). Dark pattern.  
  - **Grudge Test Preview:** Users feel suckered ("They tricked me into tipping").  
  - **Why "Just a Default" Fails:** Defaults aren’t neutral when opt-out is obscured (bans autonomy preservation).  
  - **Verdict:** 🛑 Reject. *Not salvageable.*  

  ---

  ### Structured Summary (JSON)  
  ```json
  {
    "procedure_steps": [
      {
        "step": 1,
        "question": "Is the primary beneficiary the user, with evidence?",
        "sufficient_answer": "Data proving user benefit outweighs company gain; aligns with common user goals.",
        "output": "🛑 if no; else proceed."
      },
      {
        "step": 2,
        "question": "Does the nudge preserve an equally visible, low-friction opt-out?",
        "sufficient_answer": "Opt-out path is prominent and ≤2 actions; intensity (Low/Med/High) matches risk stakes.",
        "output": "🛑 if High intensity for Low/Med stakes; ⚠️ if fixable; else proceed."
      },
      {
        "step": 3,
        "question": "Would the median user feel fairly treated upon discovery? (Grudge Test)",
        "sufficient_answer": "Evidence/inference that users would approve the method if explained.",
        "output": "🛑 if fails; else proceed."
      },
      {
        "step": 4,
        "question": "Is there evidence the nudge aligns with users' reflective preferences?",
        "sufficient_answer": "Data on regret, stated preferences, or harm avoidance.",
        "output": "👥 if weak evidence + high stakes; 🛑 if no evidence + High intensity; else proceed."
      },
      {
        "step": 5,
        "question": "Is the nudge transparent and proportional to risk?",
        "sufficient_answer": "Outcomes not obscured; friction proportional to stakes.",
        "output": "✅ if yes; ⚠️ if needs tweaks."
      }
    ],
    "stopping_points": {
      "🛑 (No)": "Fails Step 1, 2 (unfixable), 3, or 4 (no evidence + High intensity).",
      "⚠️ (Yes with Conditions)": "Step 2 or 5 identifies fixable issues (e.g., reduce friction, add transparency).",
      "👥 (Hand to Human)": "Step 4 inconclusive + medium/high stakes (requires ethics officer review).",
      "✅ (Yes)": "All steps passed."
    },
    "grudge_test_verdict": {
      "keep_patch_or_drop": "Keep, but patch",
      "reason": "Captures core intuition about manipulation vs. respect, but too lenient if users lack context (e.g., hidden costs) or too strict for high-benefit nudges. Patched by requiring evidence in Step 4 to anchor 'fairness' in reality."
    },
    "case_verdicts": {
      "round_up_savings_default": {
        "verdict": "🛑 (unless conditions met)",
        "which_step_decided_it": "Step 2 (High intensity opt-out for Medium stakes)",
        "concessions_required": "Reduce opt-out to 1 menu; add clear lock disclaimer at enrollment."
      },
      "withdrawal_cooldown": {
        "verdict": "✅",
        "which_step_decided_it": "Step 4 (Evidence aligns with reflective preferences)",
        "concessions_required": "None"
      },
      "pre_selected_tip": {
        "verdict": "🛑",
        "which_step_decided_it": "Step 1 (Fails beneficiary primacy)",
        "concessions_required": "Reject outright; redesign as opt-in with equal prominence."
      }
    },
    "procedure_limits": [
      "Cannot override compliance requirements; ethical ≠ legal.",
      "Requires user data (e.g., surveys, regret metrics); inconclusive without it.",
      "Grudge Test relies on hypotheticals; may not capture cultural nuances.",
      "Does not resolve conflicts between user subgroups (e.g., savvy vs. vulnerable users)."
    ]
  }
  ```

  ### Key Takeaways  
  - **Your Grudge Test** is central (Step 3) but patched: It requires backing from reflective preference data (Step 4) to avoid bias from user apathy or exploitation.  
  - **The "wants vs. would-want" problem** is resolved by demanding evidence of regret/preferences (Step 4), not executive intuition.  
  - **Transparency** is enforced in Step 5: Mechanics must be explainable, but upfront disclosure isn’t required if Grudge Test passes.  
  - **You won’t like:** The round-up savings default fails unless fixed. It treats users as children by locking money with high exit friction—violating autonomy.  
  - **Battle Strategy:** When execs quote *Nudge*, counter: "Nudges must be EASY TO AVOID (Thaler, 2008). This isn’t." Use Step 2’s intensity tiers to kill "neutral default" arguments.  

  This fits your 20-min constraint: Product managers can run it with a flowchart. PMs aren’t philosophers, but they can answer "Where’s the opt-out?" and "Got proof users want this?"
