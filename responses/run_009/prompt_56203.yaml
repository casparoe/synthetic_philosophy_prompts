prompt: |-
  I run "choice architecture" (ugh, the job title the company gave me) at a mid-size fintech, about 3 million users and a compliance team that mostly cares about what's legally defensible, not what's right. Concretely my group owns defaults, opt-in/opt-out flows, friction choices (extra confirmation screens, cooldown timers), and the wording on stuff like savings round-ups. We ship maybe a dozen of these changes a quarter, so whatever procedure you give me gets run fast and often by people who are product managers, not philosophers.

  Here's my problem. Everyone on the exec team read Nudge on a plane once, so "nudging is fine because it's just helping people do what they already want" gets quoted at me like scripture, and then two weeks later someone proposes pre-checking the insurance add-on box because "it's just a default, defaults are neutral." I can't fight every one of these battles ad hoc. I want a written decision procedure my team can actually run on a proposal in like 20 minutes, grounded in whatever the actual philosophy of paternalism and manipulation has worked out -- soft vs hard paternalism, the conditions under which interfering with someone's choice respects them vs treats them like a child, the line between influencing choice and subverting it, all that.

  One more thing. I've been toying with my own rule that I want you to evaluate as part of building the procedure, not just swallow. I call it the "grudge test" for lack of a better name: a nudge is OK only if, upon later finding out exactly how it worked, the median user would say "yeah, fair enough" rather than feel suckered. My instinct is this is doing a lot of work -- it feels like it captures the difference between good defaults and dark patterns -- but I half suspect it's too lenient (people forgive all kinds of stuff) or in some cases too strict. You tell me where it fits, whether it needs patching, or whether it should just be one input among several, and be honest if you think it's wrong.

  So, the procedure. Please make it:

  1. A sequence of questions in running order, each with what counts as a sufficient answer and what counts as a dodge.
  2. Clear about the stopping points: where the procedure outputs a straight "no," where it outputs "yes but with conditions," and where it hands the decision to a named human because the question is a values question that a checklist can't settle. Don't hide the judgment calls -- flag them as judgment calls, not as steps that only look like judgment calls.
  3. Explicit about the "wants vs. would-want" problem, since that's where all our fights actually happen: who decides what the user "really" wants when the nudge pushes against their revealed behavior.
  4. Include a transparency requirement (or explain why you're not including one) and something on the intensity of the intervention -- I want the procedure to distinguish changing a default from adding friction to removing an escape hatch, because those feel very different and I need the procedure to say whether that feeling tracks anything real.

  Then run it on three actual proposals I'm sitting on right now:

  - Defaulting users into a round-up savings feature that moves spare change into a locked 30-day account on each card purchase (big consumer benefit per the data, but it's money that gets locked, and the unenroll flow is behind two menus).
  - Adding a cooldown timer + three confirmation screens when users try to withdraw more than 40% of their balance in one go, framed as "protection from impulsive decisions" -- this one genuinely reduces losses from scams but also from, you know, people's own choices.
  - Pre-selecting "tip the platform" at checkout, where the default is 12% and the option to remove it is in small gray text. I already know this one smells, but exec wants numbers on exactly where in the procedure it dies and why the "it's just a default" defense fails.

  For at least one of these, the procedure should give an answer I won't like, and you should say so plainly.

  After the procedure and the worked cases, give me a structured summary as JSON with these fields: "procedure_steps" (array of objects, each with "step", "question", "sufficient_answer", "output"), "stopping_points" (object mapping each output type to the conditions that trigger it), "grudge_test_verdict" (object with "keep_patch_or_drop" and "reason"), "case_verdicts" (object keyed by case name, each with "verdict", "which_step_decided_it", and "concessions_required"), and "procedure_limits" (array of strings, the things this checklist flatly cannot do). Keep the JSON tight -- it's for the doc I'll circulate, the prose above is the part people will actually argue about.
reasoning: |-
  We are designing a decision procedure for evaluating nudges in a fintech context. The procedure must be practical, grounded in ethical principles, and able to be run quickly by product managers.

  Key principles from the philosophy of paternalism and manipulation:
  - Soft paternalism (libertarian paternalism) vs. hard paternalism: Soft paternalism aims to influence choices while preserving freedom of choice; hard paternalism restricts choices.
  - The conditions for respecting autonomy: Interventions should help people make choices that align with their own values and goals, not the company's.
  - The line between influencing and subverting choice: Dark patterns manipulate by exploiting cognitive biases in a way that undermines autonomy.

  The user's "grudge test": A nudge is acceptable if, upon later discovery, the median user would say "fair enough" rather than feel suckered. We'll evaluate this as part of the procedure.

  Procedure Requirements:
  1. Sequence of questions with clear sufficient answers and dodges.
  2. Stopping points: "no", "yes with conditions", or "hand to human" for value judgments.
  3. Address the "wants vs. would-want" problem: How to determine what the user really wants when revealed behavior conflicts.
  4. Include transparency and intensity of intervention (e.g., default vs. friction vs. escape hatch removal).

  Procedure Outline:

  Step 1: Intent Check
     Question: Is the primary intent of the nudge to benefit the user (as defined by their own values and goals) or the company?
     Sufficient answer: Clear evidence that the nudge is primarily for user benefit (e.g., reduced losses, improved financial health) and any company benefit is secondary.
     Dodge: Vague claims of mutual benefit without evidence; focusing on company metrics (like revenue) as the primary goal.
     Output: If the answer is not sufficient, output "no". If sufficient, proceed.

  Step 2: Autonomy Preservation Check
     Question: Does the nudge preserve the user's freedom to choose an alternative without undue burden?
     Considerations:
        - Intensity: Changing a default (low intensity) vs. adding friction (medium) vs. hiding the opt-out (high intensity).
        - Transparency: Is the nudge and its effect clear? Are alternatives equally visible and accessible?
        - Undue burden: E.g., is the opt-out path reasonably discoverable and not excessively lengthy?
     Sufficient answer: The nudge does not hide or unduly burden the alternative; the user can easily find and act on the alternative choice.
     Dodge: Claiming that the nudge is "just a default" without considering the accessibility of the opt-out.
     Output: If the burden is undue (e.g., opt-out is hidden or requires many steps), output "no". If burdensome but fixable, output "yes with conditions" (e.g., improve opt-out visibility). Otherwise, proceed.

  Step 3: Grudge Test (User Retrospective Approval)
     Question: Would the median user, upon learning exactly how the nudge worked, likely feel it was fair or feel suckered?
     How to gauge: Consider the user's perspective: Is the nudge exploiting a cognitive bias in a way that feels deceptive? Or is it a helpful reminder that aligns with common sense?
     Sufficient answer: Evidence or strong reasoning that the median user would find it fair (e.g., because it protects them from a common pitfall they recognize).
     Dodge: Assuming users won't find out; downplaying the feeling of being tricked.
     Output: If the test fails (likely feeling suckered), output "no". If it passes, proceed.

  Step 4: Wants vs. Would-Want Resolution
     Question: How do we know that the nudge aligns with what the user really wants (their "would-want" under reflection) rather than just their immediate behavior?
     Approach: Use data and evidence to infer the user's reflective preferences. For example:
        - Surveys showing users regret certain impulsive actions.
        - Evidence that the nudged behavior leads to better outcomes that users value.
        - Consistency with the user's stated long-term goals.
     Sufficient answer: There is evidence that the nudged choice aligns with the user's reflective preferences (e.g., they have expressed a desire for help in this area, or the behavior is clearly against their self-interest as they define it).
     Dodge: Assuming that the company knows what's best for the user without evidence; using aggregate data to override individual variation without a good reason.
     Output: If there's no evidence and it's purely the company's assumption, output "hand to human" (for ethical review) or "no" if the nudge is high-intensity. If evidence is strong, proceed to step 5.

  Step 5: Proportionality and Intensity Check
     Question: Is the intensity of the intervention proportional to the harm it aims to prevent or the benefit it provides?
     Considerations:
        - Low intensity: Defaults (easy to change).
        - Medium: Friction (e.g., confirmation screens) for moderate risks.
        - High: Making an action very hard (e.g., multiple screens, delays, hidden opt-outs) for high-stakes decisions.
     Sufficient answer: The intensity matches the stakes. E.g., high friction for high-harm risks (like large withdrawals) is proportional; a default for a minor feature is low and proportional.
     Dodge: Not acknowledging that intensity varies; treating all interventions as equal.
     Output: If the intensity is disproportionate (e.g., high friction for a low-stakes choice), output "yes with conditions" (e.g., reduce friction) or "no" if it's egregious. Otherwise, output "yes".

  Stopping Points:
     - "no": Triggered if any of steps 1, 2, or 3 fail, or step 4 fails with high intensity.
     - "yes with conditions": Triggered if step 2 or 5 identifies fixable issues (e.g., improving opt-out visibility or reducing friction).
     - "hand to human": Triggered if step 4 is inconclusive (lack of evidence on reflective preferences) and the nudge is medium/high intensity. This requires an ethical review by a designated person/committee.

  Transparency Requirement: We have built it into Step 2 (autonomy preservation) by requiring clear and accessible alternatives. We do not require upfront disclosure of the nudge (which might reduce effectiveness) but do require that it can be discovered and that when discovered, it passes the grudge test.

  Grudge Test Verdict:
     - Keep, but patch: The test is valuable but may be too lenient in some cases (e.g., users might not realize they've been manipulated) and too strict in others (users might forgive if the benefit is clear). We'll use it as a key step (Step 3) but pair it with evidence of reflective preferences (Step 4) to avoid relying solely on hypothetical forgiveness.
     - Reason: The test captures the essence of respecting autonomy by considering the user's retrospective judgment, which is a proxy for whether the nudge is manipulative. However, without evidence of what users actually value (Step 4), it might be insufficient.

  Now, run the three cases:

  Case 1: Defaulting users into round-up savings with locked 30-day account; unenroll behind two menus.

  Step 1: Intent Check
     - Primary intent: To help users save (benefit) but also locks money which might be problematic. Company might benefit from holding funds. Sufficient? Probably, if data shows users end up with more savings and appreciate it. Proceed.

  Step 2: Autonomy Preservation
     - Default is set, but opt-out is behind two menus. This is a medium burden (not hidden but not immediate). Is it undue? For a savings feature, if the lock is clearly explained and the opt-out is findable, it might be acceptable. However, two menus is a bit much. We might require one menu or a clearer path. Output: "yes with conditions" – improve the opt-out to one menu or make it more visible.

  Step 3: Grudge Test
     - If users find out they were defaulted into locking their money and the opt-out was somewhat hard, would they feel suckered? Possibly, especially if they needed the money and couldn't access it. The 30-day lock is a significant restriction. They might feel trapped. This could fail the grudge test. Output: "no" unless the opt-out is made very easy and the lock is clearly communicated at the point of enrollment.

  Step 4: Wants vs. Would-Want
     - Evidence: Data shows users save more and are better off. But what about those who don't want it? We need evidence that users generally want help saving and the lock is acceptable. Without data on user satisfaction with the lock, it's unclear. Output: Given the lock, we need more evidence. Hand to human? Or if the grudge test failed, we might already be at "no".

  Given Step 3: Fails grudge test -> Verdict: "no" unless conditions are met (reduce friction and improve communication). But the lock complicates it.

  Case 2: Cooldown timer + three confirmation screens for withdrawing >40% of balance.

  Step 1: Intent Check
     - Primary intent: Protection from scams and impulsive decisions (user benefit). Company might also reduce support costs. Sufficient: Yes, if data shows it reduces harmful withdrawals.

  Step 2: Autonomy Preservation
     - High friction: three screens and a timer. But the action is high-stakes (large withdrawal). The user can still proceed after the timer. Opt-out? There is no opt-out for this check; it's mandatory. But is that undue? For a high-risk action, this might be acceptable. The burden is high, but the stakes are high too. Proceed.

  Step 3: Grudge Test
     - Upon learning, would users feel it was fair? Probably, especially if they've been scammed before or know someone who has. The framing as protection helps. Likely passes.

  Step 4: Wants vs. Would-Want
     - Evidence: Users often regret impulsive withdrawals; scams are common. This aligns with what users would want if they reflected (avoiding catastrophic loss). Strong evidence? Yes, if there's data on regret or scam prevalence. Proceed.

  Step 5: Proportionality
     - High intensity intervention for high-stakes action. Proportional? Yes. Verdict: "yes".

  Case 3: Pre-selecting "tip the platform" at 12% with small gray text to remove.

  Step 1: Intent Check
     - Primary intent: To increase company revenue (tips). Any user benefit? Minimal (feeling good about supporting the platform?). Not primarily for user benefit. Dodge: Claiming it's a default and neutral. Output: "no" – fails at step 1.

  But let's run the rest for completeness:

  Step 2: Autonomy Preservation
     - Default set, but opt-out is de-emphasized (small gray text). This is a dark pattern – making the alternative hard to see. Undue burden. Output: "no".

  Step 3: Grudge Test
     - Users would feel suckered: They didn't intend to tip, and the opt-out was hidden. Definitely fails.

  Step 4: Wants vs. Would-Want
     - No evidence that users want to tip by default; in fact, tipping is usually voluntary and discretionary. Company is assuming without evidence.

  Verdict: Fails at step 1, and also step 2 and 3. Straight "no".

  For the summary, we'll say Case 1 might be a "no" or "yes with conditions" depending on how we resolve the grudge test and autonomy steps. Let's be critical: Case 1 might be something the user won't like because of the lock and the opt-out difficulty.

