prompt: |-
  I write novels, and they tend to be set in small places, which means over the years I've built up a private ledger of when shared things get wrecked and when they mysteriously arent, and I'd love to know whether there's one actual principle behind my verdicts or whether I'm just pattern-matching on vibes.

  The cases, with my calls:

  - The strip fields behind the village I grew up in were grazed in common for something like four hundred years and, as far as anyone can tell, never collapsed. Whatever went on there, it wasnt a tragedy waiting to happen — it worked.
  - The biscuit table at my old publishing house: restocked monday, stripped by tuesday, fridge permanently feral. Wrecked, every single time.
  - On my allotment site the communal hosepipe got nicked within a month of appearing. The communal wheelbarrow, which I swear is older than me, has outlasted every hosepipe and shows no sign of dying. Wrecked and not-wrecked, by the exact same crowd.
  - Six of my friends have shared a holiday cottage for twenty years and its pristine — better kept than most of our actual houses. The same six friends reduced a shared sailing dinghy to a mouldering hull in five summers. I cannot reconcile these two at all.
  - The book-swap shelf at my station, run entirely on strangers leaving and taking paperbacks, has worked for years and I've never once seen it empty or abused.
  - The atmosphere, obviously, but that one feels too big to learn anything from.

  My working theory for ages was the "will you meet them again" one: shared stuff survives when the users all know each other and have to show their faces tomorrow. The cottage fits, the old commons fit, the biscuit table fits. But the dinghy is the same six faces as the cottage, and the station shelf works on total anonymity, so the theory is dead and I dont have a replacement.

  Also this is practical, not idle: I'm two thirds through a novel set in a fishing village. Fourteen boats, everyone knows everyone going back generations, the fish are getting scarcer but you cant see the stock the way you can see a hedge, and one skipper has quietly put a bigger engine in. My editor says a village that tight would never let the fishery collapse — some elder-statesman type would sort everyone out. I have my doubts, but she's usually right about human nature, and the book needs to go the way things actually go, not the way my sentiment wants.

  So: is there a principle, or a couple of clauses, that fits all six of my verdicts? Which of them, if any, does it have to throw out? And what does it predict for my village — do they wreck the fishery or not, and would a harbour association with actual fines be a realistic save, or would that just be me smuggling in a happy ending?

  Keep it under 500 words please — I know you could write a dissertation on this, but I mainly need the working end of it.
reasoning: |-
  Okay, let me tackle this novelist's puzzle about shared resources. The user has collected six vivid real-world examples where communal systems either thrive or collapse, and needs a unifying framework that fits all cases - especially for their fishing village novel plot.

  First, I notice the user's original "repeated interactions" theory fails with the dinghy/cottage contradiction and anonymous book exchange. That tells me we need a more nuanced approach than just social visibility. 

  Looking at the examples, three factors keep emerging: resource visibility, replenishment speed, and cost concentration. The strip fields worked because everyone could see the grass levels and depletion was slow. Biscuits vanished fast because they're instantly consumable with no replenishment mid-week. The wheelbarrow survives theft attempts because it's bulky and identifiable, unlike the portable hosepipe.

  For the holiday cases, the cottage stays pristine because damage would be immediate and obvious to all users, while the dinghy decays gradually with costs diffused across the group. The book swap thrives because books are durable and donors constantly replenish the stock. 

  Applying this to the fishing village: fish stocks are invisible and deplete slowly, making it tragically plausible that collapse could happen despite tight social bonds. A harbor association might work if it enables visibility (catch reporting) and concentrates costs (enforceable fines), but only if implemented before the tipping point.

  The user's editor misses that fisheries operate on delayed feedback - unlike visible hedges. This framework explains all six cases without exceptions, and suggests the village could believably fail without intervention. The harbor association isn't a cheat if shown as a fragile, hard-won solution.
answer: |-
  Your pattern hinges on **three factors**: resource **visibility**, **replenishment rate**, and **cost concentration**. Here's the principle and its application:

  1.  **Visibility & Feedback Speed:**
      *   **Works:** Strip fields (grass height visible daily), cottage (damage immediate/obvious), book swap (shelf emptiness obvious, donations quick).
      *   **Wrecked:** Biscuits (vanish instantly, restock weekly), dinghy (wear gradual, damage underwater/hidden), fishery (fish stocks invisible, decline slow).
      *   **Mixed:** Wheelbarrow (visible, bulky, hard to steal/hide damage) vs. Hosepipe (portable, easy to nick/hide).

  2.  **Replenishment Rate:**
      *   **Works:** Strip fields (grass regrows seasonally), book swap (constant donations).
      *   **Wrecked:** Biscuits (weekly restock < daily consumption), dinghy (repairs slow/costly, neglect accumulates).
      *   **Not Key:** Cottage (damage prevention > repair), wheelbarrow/pipe (no inherent replenishment).

  3.  **Cost Concentration vs. Diffusion:**
      *   **Works:** Cottage (damage directly impacts *your* next holiday), strip fields (overgrazing = *your* hungry cattle).
      *   **Wrecked:** Biscuits (cost to refill diffused across company/absentee owner), dinghy (wear/tear diffused, major cost hits later), fishery (bigger engine = *private* gain, depleted stock = *shared* cost).
      *   **Works:** Wheelbarrow (theft/hogging = *immediate, obvious* cost to others waiting).

  **Your Verdicts Explained:**
  *   **Strip Fields:** High visibility, natural replenishment, individual cost concentration (via cattle). **Works.**
  *   **Biscuit Table:** Low visibility (vanishes fast), slow replenishment, diffuse costs. **Wrecked.**
  *   **Hosepipe:** Low visibility (easy to hide/nick), no replenishment, diffuse costs (delayed impact). **Wrecked.**
  *   **Wheelbarrow:** High visibility (bulky), no replenishment, *but* high cost concentration (immediate impact on others). **Survives.**
  *   **Cottage:** High visibility, damage prevention easy, high cost concentration (ruins *your* holiday). **Pristine.**
  *   **Dinghy:** Low visibility (gradual/hidden damage), slow/no replenishment (repair), diffuse costs (shared, deferred). **Wrecked.**
  *   **Book Swap:** High visibility (empty shelf), constant replenishment, diffuse costs mitigated by visibility/replenishment. **Works.**

  **Your Fishing Village: Will it Collapse?**
  *   **Visibility:** Low (fish stocks invisible, decline gradual).
  *   **Replenishment:** Slow (fish reproduction).
  *   **Cost:** Diffused (bigger engine = private gain, depleted stock = shared cost delayed).
  *   **Prediction:** **Yes, collapse is tragically plausible** despite tight bonds. The "tragedy of the commons" *thrives* on invisible, slow-depleting resources with diffuse costs and concentrated benefits. The bigger engine is the first domino.

  **Harbour Association - Realistic Save?**
  *   **Maybe, if it directly targets the principles:**
      *   **Visibility:** Mandate reporting catches/locations (making stock health *visible*).
      *   **Cost Concentration:** Enforce strict, escalating fines for overfishing/violations (concentrate the cost of cheating).
      *   **Replenishment:** Enforce quotas/seasons aligned with science.
  *   **It's not a guaranteed happy ending:** It requires strong, trusted leadership (elder-statesman?), universal buy-in (hard under stress), and enforcement *before* collapse. It's a fragile solution, not magic. **Yes, it's realistic as a *struggle*, not a cheat.**

  **In short:** Shared resources work when users **see the impact quickly**, **feel the cost personally**, and/or the resource **recovers fast**. They fail when impact is hidden, costs are spread out, and recovery is slow. Your village fits the failure profile; an association fights that profile.
