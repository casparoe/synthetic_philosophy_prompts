prompt: |-
  I'm grading finals for a second-year epistemology course (I'm the TA, this is my first semester doing it alone) and I'd like a second read on one of the answers before I commit to a mark, since I don't trust myself to not let fluent writing pull me along. The exam was three questions, this one is worth 20 points.

  Question 4 was:

  "G.E. Moore, in his 1939 lecture Proof of an External World, claims to give a rigorous proof that there are external things. Reconstruct the argument as he presents it, state the three conditions he says a rigorous proof must satisfy, and explain how Moore handles the fact that he cannot prove his premises. Finally, assess the objection that the proof is question-begging."

  And here's the student's answer, copied out:

  "Moore's argument: he holds up first one hand, then the other, and asserts each time that there is a hand before him. Since a hand is a material object existing in space, from these two premises it deductively follows that there are at least two external things. So the argument is valid, and the conclusion Moore draws is fairly modest -- only that at least two external things exist, not that everything common sense believes about the world is true. Moore was responding to Descartes, who famously said it was a scandal of philosophy that the existence of things outside us had never been proved. Moore's three conditions for a rigorous proof are: first, the conclusion must be different from the premise; second, the prover must know the premise; third, the proof must not be circular, i.e. the premise must not be proved by means of the conclusion. Moore concedes he cannot prove his premises and even that he cannot prove he is not dreaming, but he insists that he knows them anyway. Still, this admission is fatal. Since he cannot rule out that he is dreaming, he cannot know that here is a hand, so the proof fails his own second condition. And because the premises cannot be proved, the proof is question-begging -- indeed Moore effectively concedes as much when he admits the premises need proof he can't give. So the proof is valid but circular, and it cannot persuade anyone who doesn't already accept its premises."

  Please structure your response as follows:

  **Score and headline** (2-3 sentences): a mark out of 20 plus a letter grade, and one sentence saying what the mark mainly hangs on.

  **What's correct** (~100-150 words): just the parts that genuinely earn credit, so I can see what's already safely in the bank.

  **Where it loses marks** (~350-450 words): itemized points, in order of severity. For each one, quote the offending bit of the student's text, explain what's wrong, and suggest how many points it should cost. Note there's a difference between an objection that's debatable but philosophically respectable, and something that's just factually off -- I'd want you to flag which is which, since I'd penalize the second more heavily.

  **Margin notes** (3-5 one-liners): short comments I could write directly in the exam booklet, the kind a student reads first.

  Also please check whether the student actually answered every part of the question, and if not, fold that into the mark. One thing to keep in mind: I haven't made up my own mind on some of these points, so don't assume I agree with the student or with the standard objection -- I just want the grading done right, and I'd rather we be generous about defensible reasoning than harsh about it. My students were told to keep answers under 500 words, if lenght matters to you.
