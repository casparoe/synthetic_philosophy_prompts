prompt: |-
  I'm the community member on the benefits committee of a mid-sized regional health plan (they need one non-insurance person by regulation, I don't vote but I do get to argue), and we've built up a track record of rulings on what counts as treatment we'll cover versus enhancement we won't. Lately I've started to wonder if our precedents actually hang together under one rule or whether they only look consistent. Here's the record: we covered growth hormone for a kid with a confirmed pituitary deficiency, but denied it for a healthy short 12-year-old whose parents pushed hard for it. We cover stimulants for diagnosed ADHD, but denied them for a group of med students who wanted them for board-exam studying. We covered a cochlear implant for a child deafened by meningitis, but denied a hearing-amplification device for a security guard who hears fine and wanted supranormal hearing for work. We cover vaccines, and we cover contraception, even though neither treats any condition the patient has — contraception if anything turns normal functioning off. We cover statins for high cholesterol, and we denied an SSRI prescription for a woman with no symptoms at all who said she just wanted to feel better than well.

  Next month we have to rule on a new drug that partially reverses age-related cognitive slowing. The trial population is adults 65 and up who are cognitively normal for their age — no MCI, no dementia, they'd all pass the standard screens — but who are slower than they were at 30 and slower than the cross-sectional average for adults overall. The drug brings their processing speed back to roughly young-adult levels, does basically nothing in healthy 30-year-olds, and as a side finding modestly reduced progression to mild cognitive impairment. One committee member says it's obviously enhancement, it's HGH for the brain; another says it's obviously treatment, these people have lost something and we're giving it back.

  I'd love your read before the meeting. What rules could you run over our earlier verdicts that fit all of them — the obvious candidates seem to be something like "restore species-normal functioning," "cover only what a diagnosis justifies," "restore the individual's own prior baseline," and maybe some looser prevention/benefit rule given the vaccine and statin calls — and what does each predict about the new drug? Which of our old cases is the closest analog? Give me your best guess at the ruling that's most consistent with ourselves, and, since I suspect the rules diverge on this one, tell me what further case would actually distinguish between them — I've been chewing on something like a former chess prodigy who was massively above average at 25, has declined to merely average, and wants the drug to get his old edge back, but maybe you can think of a cleaner one.
reasoning: |-
  Okay, let me start by understanding the user's problem. They're on a benefits committee for a health plan and need to figure out a consistent rule for covering treatments versus enhancements. They've provided past cases and now face a new drug for age-related cognitive slowing. The user wants to know which rule fits all their previous decisions and how it applies to the new case.

  First, I need to analyze each past ruling. The covered cases include growth hormone for pituitary deficiency, stimulants for ADHD, cochlear implants for meningitis-induced deafness, vaccines, contraception, and statins for high cholesterol. Denials were for healthy short kids, med students wanting cognitive enhancement, security guards seeking better hearing, and SSRIs for asymptomatic individuals. 

  Looking for common threads. The covered items seem to address specific medical diagnoses or preventive measures for diseases. The denials are for enhancing beyond normal function without a diagnosis. Vaccines and contraception are preventive, which complicates things. Statins treat a risk factor, high cholesterol, which is a diagnosed condition. 

  Now, possible rules: restore species-normal functioning, cover only with a diagnosis, restore individual baseline, or preventive for disease. Each has issues. Species-normal is vague—what's normal for age? Diagnosis works for most, except contraception and vaccines. Restoring baseline doesn't fit vaccines. Prevention fits vaccines and statins but might be too broad. 

  The synthesis: cover for disease treatment, prevention, or restoring function lost to pathology. Enhancements beyond normal or without pathology aren't covered. This fits all cases. Growth hormone for deficiency is restoring function, while for healthy short stature, it's enhancement. ADHD meds treat a disorder; med students want enhancement. Cochlear implant restores hearing loss from disease; the security guard wants supernormal hearing. Vaccines and contraception prevent disease. Statins treat high cholesterol; SSRIs without symptoms are enhancement.

  Now the new drug: reverses age-related cognitive slowing in healthy 65+. No pathology, just aging. Is aging a disease? Current medical view says no. Restoring to young adult levels is enhancing beyond age-normal. The prevention aspect (reducing MCI progression) might be arguable, but the primary use is enhancement. Precedents suggest denial, similar to HGH for healthy short stature.

  Closest analog is the HGH denial. The chess prodigy case would test restoring to personal baseline versus species-normal. If they cover that, it shifts towards personal baseline; if not, they stick to pathology-based restoration.

  User's deeper needs: They want consistency to avoid arbitrary decisions. They might also be concerned about ethical implications and setting precedents for future enhancements. The committee needs a defensible framework that aligns with regulations and avoids slippery slopes.
answer: |-
  Based on your precedents, your committee operates under a **"Pathology-Based Restoration + Preventive Risk Reduction" rule**, with a strong emphasis on **objective, diagnosable medical conditions**. Here's the breakdown:

  1.  **The Rule Synthesized:** Coverage is provided for interventions that:
      *   **A. Treat or correct a diagnosed disease, disorder, injury, or congenital defect** *or*
      *   **B. Prevent a specific disease or condition with significant morbidity/mortality** *or*
      *   **C. Restore function lost *due to* a specific pathology (A) or prevent its progression.**
      *   *Crucially, "normal" aging, variations within the healthy population, or desires for performance beyond healthy baselines are not covered conditions.*

  2.  **How it Fits Your Precedents:**

      *   **Covered:**
          *   *Growth Hormone (Pituitary Deficiency):* Treats a diagnosed endocrine disorder (A).
          *   *Stimulants (ADHD):* Treats a diagnosed neurodevelopmental disorder (A).
          *   *Cochlear Implant (Meningitis Deafness):* Restores function lost due to a specific disease/infection (A & C).
          *   *Vaccines:* Prevent specific infectious diseases with significant risks (B).
          *   *Contraception:* Prevents pregnancy, a specific physiological condition with significant health implications and risks (B - framed as preventing the "condition" of pregnancy).
          *   *Statins (High Cholesterol):* Treats a diagnosed, quantifiable *risk factor* strongly linked to specific diseases (atherosclerosis), preventing their occurrence/progression (A/B/C hybrid - managing a pathological risk state).
      *   **Denied:**
          *   *Growth Hormone (Healthy Short Stature):* No pathology, variation within healthy baseline. Enhancement.
          *   *Stimulants (Med Students):* No pathology, enhancement of normal cognitive function for performance.
          *   *Hearing Amp (Security Guard):* No hearing pathology, enhancement beyond species-normal baseline.
          *   *SSRI ("Better than Well"):* No diagnosed depressive/anxiety disorder (no pathology A). Enhancement of mood beyond healthy baseline.

  3.  **Applying the Rule to the New Drug (Cognitive Slowing in Healthy 65+):**
      *   **The Case:** Targets *age-related* cognitive slowing in individuals who are *cognitively normal for their age* (no MCI/dementia). It restores function to a *young-adult baseline*, not a pathology-affected baseline. The reduced MCI progression is a *side finding* in a trial not primarily designed/approved for that purpose.
      *   **Analysis:**
          *   **No Diagnosed Pathology (A):** The slowing is defined as part of *normal aging*, not due to a disease like early Alzheimer's or stroke. They explicitly pass standard screens for cognitive impairment.
          *   **Not Preventing a *Specific* Disease (B):** While it *modestly reduced progression to MCI*, this was a secondary finding. The primary indication and trial population focus is on enhancing *normal* age-related slowing. MCI itself is a risk state, not a single specific disease. Crucially, the individuals *don't have* MCI or high risk for it *yet*. This differs from statins treating *existing, diagnosed* high cholesterol.
          *   **Not Restoring Function Lost to Pathology (C):** The function loss is attributed to *aging*, not a specific disease process.
      *   **Prediction:** Under your established rule, this is **Enhancement** and should be **denied**. It aims to improve performance beyond the healthy, age-adjusted baseline, analogous to:
          *   HGH for healthy short stature (improving height beyond genetic potential).
          *   Stimulants for med students (improving focus/endurance beyond normal).
          *   The hearing amp for the security guard (improving hearing beyond normal acuity).
          *   The "better than well" SSRI request.

  4.  **Closest Analog:** The **HGH denial for the healthy short 12-year-old** is the closest analog. Both involve:
      *   A biological variation within the healthy range (short stature / age-related cognitive slowing).
      *   A desire to achieve a level of function/physiology associated with a different stage of life or a different percentile of the population (taller peers / young adults).
      *   The absence of a specific, underlying pathological diagnosis causing the deviation.

  5.  **Best Guess for Consistent Ruling:** Based on strict adherence to your precedents, the most consistent ruling is **DENIAL**. The argument that "these people have lost something" refers to a loss inherent in normal aging, not loss due to a disease process, which your committee has consistently excluded as a basis for coverage.

  6.  **The Divergence & The Test Case:** You correctly identified the core tension: **Restore to Species-Normal Functioning (age-adjusted) vs. Restore to Individual's Prior Baseline.** Your precedents strongly favor the *age-adjusted species-normal* standard (denying interventions for healthy short stature, supranormal hearing, cognitive enhancement in normals).

      *   **Your Test Case (Chess Prodigy):** This is excellent and directly targets the divergence.
          *   *Scenario:* A 55-year-old former chess prodigy. At 25, his processing speed/working memory was in the 99.9th percentile. Due to *normal aging*, he's now declined to the 50th percentile (average for his age). He requests the drug to regain his former elite level.
          *   *Analysis under competing rules:*
              *   **Species-Normal (Age-Adjusted):** He is currently *normal* for his age (50th percentile). The drug would enhance him *beyond* his current healthy baseline. **DENY** (consistent with med students, security guard).
              *   **Individual Prior Baseline:** He has *lost* significant function relative to his own peak. The drug *restores* him to his prior high baseline. **COVER** (potentially analogous to restoring hearing lost to meningitis?).
      *   **Prediction Based on Your Precedents:** Your committee would **DENY** the chess prodigy. Restoring to an individual's *youthful peak performance* is fundamentally different in your framework than restoring function *lost to a specific disease*. Aging isn't the disease. Granting it would open the door to covering all manner of performance enhancements based on personal history or ambition, contradicting the denials for med students and the security guard.

  **Conclusion for Your Meeting:** The consistent thread is treating pathology and preventing disease, not optimizing normal aging or variations. Aging-related cognitive slowing in cognitively healthy seniors is not a pathology under your established definitions. The reduced MCI progression is intriguing but appears incidental and insufficient to override the primary enhancement purpose for this specific indication. The closest precedent is the denial of HGH for healthy short stature. The most consistent ruling is **denial**.

  To maintain consistency, emphasize that "loss due to normal aging" is distinct from "loss due to disease/injury" in your coverage framework. The chess prodigy case starkly illustrates why adhering to the "pathology + prevention" rule, rather than "restore to personal best," is essential to avoid collapsing the treatment/enhancement boundary your committee has carefully defined.
