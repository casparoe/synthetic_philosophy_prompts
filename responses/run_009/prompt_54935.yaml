  Key cases to cover: qualia-less neighbors (zombie variant), inverted spectrum, Mary's room, blindsight. Also, the conceivability vs possibility of physical duplicates without consciousness. Must respect distinctions like epistemic vs metaphysical necessity, type vs token identity in brain processes. 

  Crucially, the desiderata should create genuine philosophical tension - especially where they might conflict. The user plans to end the book at such an impasse. No theory-scoring; the neurologist will fail at that later. Five items exactly, no intros or conclusions.

  Desideratum 1 must address the zombie conceivability without assuming dualism. Need to balance respecting the intuition vs explaining it away. The Mary case (desideratum 2) will contrast epistemic gaps with ontological claims. 

  Desideratum 3 should tackle the dissociation cases like blindsight and the epidemic's "unimpaired but unconscious" state. This exposes the reportability/reliability gap. 

  For desideratum 4, the identity theory distinction is crucial - why H2O works but phenomenal identities feel different. Must highlight the "explanatory gap" tension. 

  Finally, desideratum 5 must pit first-person authority against third-person doubt, especially regarding sincerity of reports. This creates the novel's core conflict. 

  The tensions should weave through: zombie conceivability vs physicalism (1 vs 4), Mary's knowledge gap vs identity claims (2 vs 4), and the epidemic's unreliability of reports (3 vs 5). The brother-in-law would attack 1's conceivability claim; the neurologist struggles with 5's evidentiary conflict. Their deadlock at the end likely centers on whether desideratum 4's gap is permanent (implying dualism) or temporary (physicalism) - which no item resolves, creating the impasse.
answer: |-
  Here are five desiderata for an adequate account of the physical-phenomenal relation:

  1.  **Account for the Conceivability of Absent Qualia:** It must explain why the scenario of physically identical systems lacking phenomenal consciousness (like the epidemic victims or philosophical zombies) seems coherent and conceivable, without simply declaring this intuition universally confused or illegitimately presupposing dualism, while also clarifying the precise relationship between this conceivability and genuine metaphysical possibility.
  2.  **Resolve the Epistemic Gap of Novel Experience:** It must address cases like Mary in the black-and-white room, explaining both her apparent acquisition of new knowledge upon seeing red and why this epistemic gap doesn't *necessarily* entail an ontological gap between the physical facts and phenomenal properties, without trivializing the nature of her new knowledge.
  3.  **Explain Dissociations of Function and Phenomenology:** It must accommodate and explain empirical dissociations where discriminatory capacity or functional behavior persists in the apparent absence of corresponding phenomenal experience (as in blindsight or the epidemic victims), and conversely, cases where experience seems present without standard behavioral markers, specifying the necessary and sufficient physical conditions for phenomenology within such dissociations.
  4.  **Distinguish Phenomenal Identity from Theoretical Identities:** It must acknowledge and address the unique challenge posed by phenomenal identities (e.g., pain = C-fiber firing) compared to uncontroversial theoretical identities (e.g., water = H2O), specifically explaining the persistent "explanatory gap" and why the former feels resistant to reduction in a way the latter does not, without relying on the gap itself as proof of non-identity.
  5.  **Reconcile First-Person Authority with Third-Person Doubt:** It must provide a principled basis for evaluating first-person reports of experience (like the victims' sincere claims of normal awareness) against third-person physical and functional evidence, determining when such reports constitute reliable evidence for the presence/absence/character of phenomenology and when they become defeasible, especially in scenarios where behavior and function radically dissociate from presumed phenomenology.
