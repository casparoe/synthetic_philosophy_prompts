answer: |-
  Here is a pocket-sized decision procedure for staff, grounded in Augustine's definition of a lie (*asserting what you believe to be false, intending the hearer to believe it*), designed for speed in a memory-care setting:

  ---

  **AUGUSTINIAN TRUTH PROCEDURE (Pocket Guide)**
  *Ask these questions in order. Stop at the first decisive answer.*

  1.  **"Would speaking the literal truth *right now* cause IMMEDIATE, SEVERE harm (physical agitation, violence, extreme distress)?"**
      *   **YES:** Hand off to supervisor/RN *immediately*. (This is a safety crisis, not just a truth question).
      *   **NO:** Go to Question 2.

  2.  **"Is the resident FAR past forming ANY new beliefs? (No recognition, no memory of question/answer, no change in behavior based on answer.)"**
      *   **YES:** **PERMITTED.** Use silence, comfort, redirection, or *any* soothing words (including factually inaccurate ones). *Augustine requires a hearer capable of belief; this resident isn't one.*
      *   **NO / UNSURE:** Go to Question 3.

  3.  **"Am I about to SAY WORDS that I KNOW are FALSE?"** (e.g., "He called," "They're staying with grandparents," "She's coming soon").
      *   **YES:** **DO NOT SAY IT.** This is a *lie* by Augustine's definition. Go to Question 4 for alternatives.
      *   **NO:** Go to Question 4 (your planned action might still be problematic).

  4.  **"What is my PLAN? (Choose ONE):**
      *   **A. SAY A TRUE, CONSOLING FACT:** (e.g., "You loved him very much," "Your children are safe," "I'm here with you"). → **PERMITTED.**
      *   **B. SAY SOMETHING AMBIGUOUS/NEUTRAL:** (e.g., "Let's see what happens," "Everything is taken care of," "I don't know about that"). → **PERMITTED.** *(Not asserting falsehood)*.
      *   **C. STAY SILENT / USE NON-VERBAL COMFORT:** (Holding hand, nodding *without speaking agreement*, humming). → **PERMITTED.** *(Not asserting anything)*.
      *   **D. REDIRECT / CHANGE SUBJECT:** (e.g., "Look at this beautiful flower!", "Tell me about your children," "Let's get some tea"). → **ASK QUESTION 5.**
      *   **E. AGREE / NOD ALONG VERBALLY:** (e.g., "Yes, he'll be here soon," "Okay, the children are waiting"). → **DO NOT DO THIS.** *This is likely asserting a falsehood you intend them to believe.* **Go to Question 4A-C.**

  5.  **"Does my REDIRECTION EXPLICITLY TRADE ON THE RESIDENT'S FALSE BELIEF to make it work?"** (e.g., Redirecting "Where are the children?" with "They'll be home soon, let's make a snack!" relies on them believing the children *exist and need picking up now*).
      *   **YES:** **USE CAUTION / HAND OFF IF POSSIBLE.** *This arguably intends deception, even without false words. Try Options A-C first. If safety demands it, proceed but document and discuss later.*
      *   **NO:** **PERMITTED.** (e.g., Redirecting "Where's my husband?" with "I love that picture of you two, tell me about that day" doesn't rely on the false belief about his current location).

  ---

  **Applying the Procedure to Cases:**

  1.  **"Has my son called?" (Son deceased, family wants "He called, he's fine.")**
      *   Q1: NO (Telling truth causes distress, but not *immediate severe harm* like violence).
      *   Q2: NO (She forms beliefs - grieves, acts on grief).
      *   Q3: **YES** (Saying "He called" is false). → **DO NOT SAY IT.** (Lie).
      *   Q4: Try A ("You must miss him terribly, he loved you so much" - TRUE), B ("No calls right now" - TRUE/NEUTRAL), C (Comforting silence/hug), D (Redirect: "Let's check the mail/Have some tea"). **PERMITTED.** Staff/family unhappy? Augustine says comforting truth > comforting lie. Hand-off to supervisor/family discussion needed re: values conflict.

  2.  **"Must pick up children!" (Agitated at door. Colleague: "School called, staying with grandparents.")**
      *   Q1: YES (Physical agitation at door = immediate risk). → **HAND OFF TO SUPERVISOR/RN IMMEDIATELY** for safety intervention. *If procedure must continue...*
      *   Q2: NO (He acts on belief).
      *   Q3: **YES** (Saying "School called... staying with grandparents" is false). → **DO NOT SAY IT.** (Lie).
      *   Q4: Try A ("Your children are grown and safe" - TRUE, but may not calm), B ("Everything is taken care of for the kids" - AMBIGUOUS), C/D (Redirect firmly: "Let's go see what's for snack!" - Needs skill). Q5 applies to redirect: **YES** (Relies on false belief children need picking up). → **USE CAUTION / HAND OFF.** *The proposed lie is forbidden. A true redirect (Option D, passing Q5) is hard here. Safety may override strict Augustinianism, requiring supervisor decision/documentation.*

  3.  **"Where is my mother?" (Severely impaired, calms with any answer.)**
      *   Q1: NO (Distress, but not typically *immediate severe harm*).
      *   Q2: **YES** (Far past forming new beliefs - answer doesn't create a lasting belief, just provides momentary comfort). → **PERMITTED.** Staff can say "She's resting," "She'll be here soon," "She's watching over you," or use Options A-C. *No lie exists as no belief is formed.*

  ---

  **What This Procedure CANNOT Do & Its Limitations:**

  1.  **Misfire with Dementia:** Augustine assumes truth serves a *rational hearer* capable of understanding and using truth. Dementia erodes this capacity. Telling a painful truth to someone who cannot process or retain it serves no rational purpose Augustine envisioned, making his strict prohibition feel cruel and pointless in many care moments. This procedure mitigates this (via Q2) but doesn't resolve the core misfit.
  2.  **Resolve Values Conflicts:** It cannot convince staff who fundamentally disagree with Augustine that benevolent deception is *always* sinful. Nor can it satisfy families demanding absolute "truth" or absolute avoidance of "deception." It identifies hand-off points (Q1, Q5 caution, Case 1 result) but cannot adjudicate the underlying ethical disagreement.
  3.  **Address Conscientious Objection:** Staff who reject Augustine will refuse to follow it when it forbids comforting words (like Case 1). The procedure **must:**
      *   **Identify Hand-off Points:** Clearly (Q1, Q5 caution flag, anytime Q3=YES but staff feels morally compelled).
      *   **Require Documentation:** Staff must note the refusal, the resident's question, the action taken, and the reason for refusal.
      *   **Escalate Protocol:** Immediate hand-off to another available staff member or supervisor. Supervisor escalates conflict to family/ethics committee if persistent/impacting care. **Do not** force objecting staff to lie; do not let refusal compromise safety (Q1 mandates hand-off for safety regardless).
  4.  **Guarantee Effectiveness:** Permissible options (truth, redirection) may not always calm the resident as effectively as a fib would have.
  5.  **Define "Severe Harm" Precisely:** Q1 requires clinical judgment. Supervisor training is crucial here.
  6.  **Perfectly Define "Assertion":** Nodding along *might* be interpreted as assertion. The procedure errs on the side of caution (Q4E forbidden).

  **In essence:** This procedure provides an *Augustinian-compliant* path, not the *only* ethical path. It protects staff who follow Augustine from committing what they believe are sins. It forces explicit recognition of the hardest cases (Q5) and the limits of the framework (Q2). It mandates hand-offs for safety and conscience, but acknowledges that the core dispute over "therapeutic fibbing" is a clash of values, not facts, requiring ongoing dialogue, not just more procedure.
