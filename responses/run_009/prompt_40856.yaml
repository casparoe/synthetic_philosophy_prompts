prompt: |-
  quick question for something I'm writing. I hang around effective altruism types, and they always rank causes with this rubric that scores a cause on three axes: how big the problem is, how solvable it is, and how few people are already working on it. fine as far as it goes. but I've noticed something odd about how the whole thing behaves in the wild.

  the scores seem to be indexed to whatever everyone is currently doing. a while back hardly anyone worked on AI risk, so it scored great on the third axis. then the movement took its own advice, a pile of people went in, and now some of the same people tell you it's crowded and maybe look at other things instead. nothing about the problem itself changed — the problem didn't get more or less solvable — but the ranking of everything shifted anyway, because the third axis is defined against the current allocation of effort. and if the advice is any good, following it is exactly what destroys it: whatever gets recommended as neglected becomes not-neglected precisely because it was recommended. last years answer is this year's mistake, with zero new information about the world arriving in between.

  I feel like economists or sociologists must have run into this shape before: an evaluation scheme where the criteria are relative to the current distribution of attention, so the act of publishing the ranking eats the ranking. it's not a self-fulfilling prophecy — that would be the ranking helping itself come true, and this is closer to the opposite. and it's not plain supply and demand, since nobody is trading anything, people are just copying a recommendation.

  is there an established concept for this? if yes, what is it, and where exactly does my description stop matching it — I want the edges, not just a label. if there isn't one, coin something: give it a name, a definition, and the boundary cases. the two I keep wondering about: (1) if the crowd overreacts so badly that everyone flees other causes and the recommended one somehow ends up *more* neglected than before anyone recommended it, does that still count as the same phenomenon? (2) what if only a handful of people ever see the recommendation — is the failure there at all, or does it need the audience to be big enough to matter?

  whatever you conclude, put the very last line in the form \answer{...} containing either the established term, or "no established term", followed by your coined term if you coined one.
reasoning: |-
  Okay, the user is describing a phenomenon within the Effective Altruism (EA) community where cause prioritization rankings become self-undermining. The criteria are: scale, solvability, and neglectedness. Neglectedness is relative to current effort, so when a cause is recommended as neglected, people flock to it, making it no longer neglected. The user wants to know if there's a term for this and to clarify edge cases.

  First, I recall Goodhart's law: when a measure becomes a target, it ceases to be a good measure. Here, neglectedness is the measure that's targeted. When EA promotes a cause as neglected, efforts increase, reducing neglectedness. That matches Goodhart's law.

  The user mentions this isn't self-fulfilling prophecy, which makes things come true, but the opposite—where the recommendation invalidates itself. So Goodhart's law fits because the metric is gamed once it's used for decisions.

  Now, the edge cases. Case 1: Overreaction causing the cause to become more neglected. If everyone abandons other causes for the new one, but then overcorrects, leaving it understaffed again, it's still part of the same cycle. Goodhart's law still applies because the metric is being manipulated by the response.

  Case 2: What if only a few people see the recommendation? If the audience is too small to shift the effort, the effect doesn't occur. So the phenomenon requires a large enough audience to materially affect the allocation.

  Other concepts like reflexivity (Soros) involve feedback loops in markets, but here it's about metric distortion, not market prices. Bandwagon effects describe herd behavior but don't capture the self-undermining aspect.

  The user also wants a coined term if none exists. Since Goodhart's law is established and fits, I'll propose "neglectedness trap" as a specific instance. The boundaries: it happens when the metric is relative and the audience is influential enough.

  For the answer, since Goodhart's law is established, I'll use that, with "neglectedness trap" as a supplementary coinage. The final line should be in \answer{} format as specified.
answer: |-
  Your observation hits on a profound tension in dynamic prioritization systems. This phenomenon is a specific manifestation of **Goodhart's Law**, with nuances that make it particularly acute in cause prioritization contexts. Here's the breakdown:

  ### Core Concept: Goodhart's Law
  - **Established Term**: **Goodhart's Law** (coined by economist Charles Goodhart).
  - **Definition**: "When a measure becomes a target, it ceases to be a good measure." Once a metric is used for decision-making, people optimize for it, distorting its relationship to the underlying goal.
  - **Why it fits**:
    - The "neglectedness" axis is a *proxy* for impact potential (under the assumption that marginal effort in neglected areas yields higher returns).
    - By publishing rankings that prioritize neglected causes, the EA community *turns neglectedness into a target*.
    - Optimizing for this target (shifting effort to "neglected" causes) directly degrades the metric itself (they become less neglected), invalidating the initial ranking.
    - This creates a **self-defeating feedback loop**: the metric's usefulness is destroyed by its own success.

  ### Where Your Description Matches (and Extends) Goodhart's Law
  1. **Relative Metric Vulnerability**: Goodhart's Law is especially potent when metrics are *relative* (like neglectedness) rather than absolute. Your insight about rankings being "indexed to whatever everyone is currently doing" highlights this relativity.
  2. **Zero New Information**: As you note, the shift happens purely from behavioral response, not changes in the problem (scale/solvability). This is classic Goodhart distortion.
  3. **Tragedy of the Recommendation Commons**: The ranking acts as a public good; individuals following it deplete the very value (neglectedness) it identified.

  ### Why It's *Not* Other Concepts
  - **Not reflexivity (Soros)**: Reflexivity describes how perceptions *alter fundamentals* (e.g., stock prices affecting company value). Here, the *problem* (AI risk scale/solvability) remains unchanged; only the *effort allocation* shifts.
  - **Not a bandwagon effect**: Bandwagon effects describe herd behavior, but don't inherently include the self-destructive metric distortion.
  - **Not supply/demand**: No price mechanism or market clearing exists; it's a coordination failure driven by public recommendations.

  ### Edge Cases Explored
  **(1) Overreaction causing hyper-neglectedness**  
  - **Still the same phenomenon**. If everyone abandons Cause A for Cause B (recommended as neglected), but Cause B's solvability is overestimated, a subsequent rush *back* to Cause A could make it *more* neglected than before. This is an *overshoot* in the Goodhart feedback loop. The core mechanism—optimization degrading the metric—remains, but with delayed/lagged effects causing oscillation rather than monotonic decay.

  **(2) Small-audience recommendations**  
  - **The failure requires critical mass**. If too few actors see/heed the ranking, their efforts won't materially shift the neglect metric. The self-defeating dynamic only emerges when the audience is large enough to meaningfully alter the *aggregate* effort distribution. Below this threshold, the ranking remains "stable" but also irrelevant (no one acts on it).

  ### Coining a Subtype: The Neglectedness Trap
  While Goodhart's Law is the established umbrella, your described scenario warrants a specialized term:  
  - **Coined Term**: **The Neglectedness Trap**  
  - **Definition**: *A dynamic in prioritization systems where labeling a cause as "neglected" triggers collective action that renders it non-neglected, invalidating the initial assessment without changing the cause's intrinsic properties. This arises when a relative metric (neglectedness) is used as a target for resource allocation.*  
  - **Boundary**: It applies specifically to *public good provision* (e.g., cause prioritization) where metrics of current effort are used to direct future effort.

  ### Final Answer
  \answer{Goodhart's Law, Neglectedness Trap}
