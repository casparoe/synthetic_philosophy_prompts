answer: |-
  ### Essay Question (90 minutes)
  **"Curry's paradox presents a unique challenge to dialetheism precisely because its structure bypasses the dialetheist's most celebrated tool: the non-explosive tolerance of gluts.  
  (a) Present a formal derivation of Curry's paradox for an arbitrary sentence \(Q\), starting from the naive truth schema and using a conditional satisfying standard structural rules. Explain why the conclusion \(Q\) is alarming even if we tolerate truth-value gluts.  
  (b) Articulate why the dialetheist's standard response to the Liar ("It's a glut, so explosion is blocked!") fails to resolve Curry's paradox. Focus on the *absence* of negation and the *nature* of the conclusion.  
  (c) Select *one* principled strategy to block the paradox (e.g., restricting contraction, weakening the conditional, rejecting detachable conditionals, or adopting substructural rules). Defend your chosen strategy against the strongest objection concerning the crippling of the conditional or logical reasoning. Honestly state where its residual cost is most acute.  
  (d) Briefly outline a 'Validity Curry' paradox: an argument schema where a sentence \(\pi\) essentially states 'If this very argument (from \(\pi\) to some absurdity) is valid, then everything is true.' Explain why your response to (c) must, or must not, apply similarly to block this validity-directed version. Crucially, address why declaring the validity-inference *both good and bad* (analogous to a glut) is not a viable solution here."**

  ---

  ### Model Answer (Approx. 700 words)

  **(a) Derivation and Alarm:**  
  Curry's paradox utilizes a self-referential sentence \(\kappa\) equivalent to \(T\ulcorner\kappa\urcorner \to Q\), where \(Q\) is *any* sentence. The derivation relies on the Naive Truth Schema (NTS: \(T\ulcorner\phi\urcorner \leftrightarrow \phi\)) and a conditional (\(\to\)) satisfying Modus Ponens (MP), Contraction (\(A \to (A \to B) \vdash A \to B\)), and Identity (\(A \to A\)).

  1. \(\kappa \leftrightarrow (T\ulcorner\kappa\urcorner \to Q)\)  (Construction of \(\kappa\) via NTS/diagonalization)  
  2. \(T\ulcorner\kappa\urcorner \leftrightarrow \kappa\)  (NTS applied to \(\kappa\))  
  3. \(T\ulcorner\kappa\urcorner \leftrightarrow (T\ulcorner\kappa\urcorner \to Q)\)  (From 1 & 2, substitution)  
  4. **Assume \(T\ulcorner\kappa\urcorner\)**  
  5. \(T\ulcorner\kappa\urcorner \to Q\)  (From 3 & 4, \(\leftrightarrow\)-Elim)  
  6. \(Q\)  (From 4 & 5, MP)  
  7. \(T\ulcorner\kappa\urcorner \to Q\)  (From 4–6, Conditional Proof/\(\to\)-Intro)  
  8. \(T\ulcorner\kappa\urcorner\)  (From 3 & 7, \(\leftrightarrow\)-Elim)  
  9. \(Q\)  (From 7 & 8, MP)  

  The alarming conclusion \(Q\) is arbitrary – it could be "0=1", "The moon is cheese," or "Trivialism is true." Crucially, the derivation *never produces a contradiction* (like \(P \land \neg P\)); it derives an arbitrary \(Q\) *directly*. Tolerating a glut for \(\kappa\) (i.e., accepting both \(T\ulcorner\kappa\urcorner\) and \(\neg T\ulcorner\kappa\urcorner\)) doesn't block steps 7-9. Step 9 uses \(T\ulcorner\kappa\urcorner\) and \(T\ulcorner\kappa\urcorner \to Q\) (established at step 7 *without* assuming \(T\ulcorner\kappa\urcorner\)) to conclude \(Q\). Even if \(\kappa\) is a glut, \(Q\) is still derived true.

  **(b) Dialetheism's Standard Maneuver Fails:**  
  The dialetheist resolves the Liar (\(L: \neg T\ulcorner L \urcorner\)) by accepting both \(T\ulcorner L \urcorner\) and \(\neg T\ulcorner L \urcorner\) (a glut), blocking explosion *because* the derivation of \(L \land \neg L\) relies on negation and would require explosion to infer arbitrary conclusions. Curry's paradox is fundamentally different:  
  1.  **No Negation:** The paradox doesn't derive a contradiction. It derives an arbitrary \(Q\) *simpliciter*. Blocking explosion is irrelevant because explosion is never invoked.  
  2.  **Nature of Conclusion:** The conclusion \(Q\) isn't *false*; it's *arbitrary*. Declaring \(\kappa\) a glut (both true and false) doesn't prevent the *truth* of \(Q\) from being validly derived via MP from the *true* components \(T\ulcorner\kappa\urcorner\) and \(T\ulcorner\kappa\urcorner \to Q\) established in steps 7 and 8. The dialetheist's "glut maneuver" is powerless against a derivation that only produces truths, even if one premise is overdetermined.

  **(c) Blocking Strategy: Restricting Contraction (Defended):**  
  The most defensible blocking strategy is rejecting the structural rule of **Contraction** for the conditional (or the meta-rule allowing multiple uses of an assumption within a subproof). Step 7 (\(\to\)-Intro) implicitly uses the assumption \(T\ulcorner\kappa\urcorner\) (step 4) *twice*: once to derive \(T\ulcorner\kappa\urcorner \to Q\) (step 5) and again within the subproof leading to \(Q\) (step 6). Contraction licenses this double use. Rejecting Contraction blocks the move from step 3 to step 7/8.

  *   **Objection:** Doesn't rejecting Contraction cripple reasoning? We constantly reuse premises (e.g., "If it rains, the street gets wet. If it rains, I get wet. It rained. Therefore, the street is wet AND I am wet.").  
  *   **Defense:** Contraction is indeed essential for *practical, finite reasoning*. However, logical paradoxes arise at the limits of expressibility, often requiring idealizations like infinite or unrestricted reuse. We can preserve a *usable* conditional for everyday/mathematical contexts (where self-reference like \(\kappa\) doesn't occur) by distinguishing *logical* from *practical* implication or adopting a *relevance logic* that tracks premise usage. Crucially, standard mathematics often operates under the *assumption* that Contraction holds globally, but this assumption proves unsafe for languages containing their own truth predicate.  
  *   **Residual Cost:** The cost is largest in **formalizing naive truth or validity within the object language itself**. Proofs requiring nested or iterative use of a premise involving self-referential truth (e.g., certain inductions over truth-involving predicates) become impossible or require complex, non-standard formulations. It restricts the *scope* of our logical system's expressive completeness.

  **(d) Validity Curry and the Response:**  
  The Validity Curry targets structural rules for validity (\(\vdash\)) itself. Define an argument \(\Pi\) as follows:  
  Premise: \(\pi\) (which says: "If the argument from \(\pi\) to \(0 \neq 0\) is valid, then \(0 \neq 0\)").  
  Conclusion: \(0 \neq 0\).  

  Using plausible structural rules for validity (e.g., Reflexivity, Transitivity/Contraction, and a validity-detachment rule: If \(A \vdash B\) is valid and \(A\) is true, then \(B\) is true), one can derive that \(\Pi\) is valid implies \(0 \neq 0\). Declaring the validity-inference "\(\pi\), therefore \(0 \neq 0\)" *both valid and invalid* (analogous to a glut) doesn't help. The derivation concludes *directly* that if \(\Pi\) is valid, then \(0 \neq 0\) – an absurdity. There's no contradiction to tolerate; only an absurd conclusion derived under a validity assumption.  

  The response in (c) applies directly: **Rejecting Contraction for validity** blocks the key step. The derivation of \(\Pi\)'s validity relies on reusing the assumption of its own validity multiple times within the subproof establishing the conclusion. Just as truth-Curry forces us to restrict premise reuse for conditionals, validity-Curry forces us to restrict premise reuse for validity derivations. The cost is similar: limiting the idealization of unlimited premise reuse in meta-logical reasoning about validity itself.

  ---

  ### Marking Scheme (25 marks total - 5 points, 5 marks each)

  1.  **Correct Derivation of Curry:** (5 marks)  
      *   *Must Hit:* Clear steps using NTS, construction of \(\kappa\), correct application of \(\to\)-Intro (Conditional Proof) and MP, leading to arbitrary \(Q\).  
      *   *Common Mistake:* Omitting the role of the conditional rules (especially \(\to\)-Intro) or failing to show how \(Q\) is derived *without* a contradiction.

  2.  **Why Glut Solution Fails:** (5 marks)  
      *   *Must Hit:* Explicitly contrasts Curry (derives arbitrary truth \(Q\) directly) with Liar (derives contradiction \(P \land \neg P\)); emphasizes that blocking explosion is irrelevant since explosion isn't used; notes absence of negation.  
      *   *Common Mistake:* Stating "glut blocks explosion" without explaining why explosion isn't involved, or conflating non-explosiveness with a solution to Curry.

  3.  **Analysis & Defense of Blocking Strategy:** (5 marks)  
      *   *Must Hit:* Chooses ONE strategy (e.g., rejects Contraction); explains HOW it blocks the paradox (e.g., prevents double use of assumption in \(\to\)-Intro); defends against the key "crippling" objection (e.g., distinguishes logical vs. practical use, relevance); identifies a specific, non-trivial cost (e.g., limits on formalizing naive truth/induction).  
      *   *Common Mistake:* Listing multiple strategies without choosing/defending one; assuming rejecting the conditional is cost-free; failing to address the core objection about crippling reasoning.

  4.  **Validity Curry Connection:** (5 marks)  
      *   *Must Hit:* Clearly outlines the Validity Curry schema; explains why declaring validity "glutted" (both good/bad) doesn't block the derivation of absurdity; explains why their chosen response from (c) applies (or doesn't) to the structural rules of validity (e.g., must also reject Contraction for validity derivations).  
      *   *Common Mistake:* Treating Validity Curry as identical to Truth Curry without explaining the shift to validity/meta-rules; asserting "glut solution fails" without explaining *why* (no falsehood/contradiction derived).

  5.  **Clarity, Structure, and Insight:** (5 marks)  
      *   *Must Hit:* Well-organized, precise terminology (glut, explosion, contraction, structural rule, validity), logical flow, demonstrates understanding that Curry forces a choice about fundamental logical structure (conditional rules/structural rules) distinct from the Liar's challenge to bivalence.  
      *   *Common Mistake:* Vagueness, conflation of concepts (e.g., truth vs. validity), purely mechanical derivation without conceptual analysis, failure to see the deep challenge to core logical resources.  

  **Note:** Marks are awarded based on the quality of argumentation and understanding demonstrated within each section, even if the student chooses a different defensible blocking strategy (e.g., weakening the conditional) than the model answer, provided they hit the required points for that strategy. Choosing *no* strategy or failing to defend a choice rigorously loses marks in point 3.
