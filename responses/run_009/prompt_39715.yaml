prompt: |-
  My oldest friend and I have argued for years about what money should be allowed to buy. Neither of us has any academic background in this; we simply keep returning to it over dinner, and over time I have assembled a fairly complete record of her verdicts. I would like to predict how she will rule on some new cases before our next argument, and I find I cannot do it with any confidence.

  Her record so far: she thinks a debt-ridden man selling a kidney to a broker should be illegal; she sees nothing wrong with selling one's hair to a wig maker; she is fine with paid plasma donation, even though she knows most donors are poor students doing it twice a week; she holds that selling one's vote is never permissible; she would prohibit a hardware store from tripling the price of generators the night before a hurricane; she has no objection to services that pay people to hold places in line; she finds scalpers distasteful but would keep them legal; and she has defended a woman carrying a child for a childless couple in exchange for a fee.

  Her two recurring complaints are that "some things simply aren't for sale" and that "it isn't a fair deal when one side has no real choice." The trouble is that these pull in different directions, and her record seems consistent with more than one underlying rule: perhaps a rule about desperation and unfair advantage, perhaps one about goods that are corrupted by being sold, perhaps one about harm to bystanders. I cannot tell which she is really running, or whether it is some unstable mixture.

  The new cases are: a financially comfortable graduate student selling her eggs for eight thousand dollars; two friends in different cities agreeing to trade votes, each voting for the other's preferred candidate in her own local race, with no money changing hands; and a hotel quadrupling its room rates during a wildfire evacuation. Please predict her verdict on each case, lay out the candidate rules that fit her record and where they diverge on these cases, give your best guess with reasons, and suggest one further case that would most cleanly reveal which rule she is actually applying.
reasoning: |-
  Okay, let me approach this systematically. The user presents an interesting challenge about predicting his friend's moral judgments on market transactions based on her existing pattern of rulings. 

  First, I need to fully understand her existing verdicts. She prohibits kidney sales by desperate debtors but allows hair sales and paid plasma donation despite poverty concerns. Vote selling is banned but vote trading between friends is a new case. Price gouging during hurricanes is rejected, yet line-standing services and ticket scalping (with distaste) are permitted. Surrogacy is defended. 

  Her two principles - "some things aren't for sale" and "no real choice" - seem to conflict. I notice she prohibits transactions when both conditions are met (kidneys, votes during desperation) but allows them when only one applies (plasma donation has choice issues but isn't "corrupted", hair sales lack desperation). 

  For the new cases: The egg sale involves money but the grad student isn't desperate - this might test whether reproductive capacity falls under "things not for sale". Vote trading without money could reveal if her objection to vote selling is about commodification or something else. The wildfire hotel pricing directly parallels her hurricane generators ruling. 

  I suspect her underlying framework prioritizes preventing exploitation of desperation over pure commodification concerns. Her acceptance of paid surrogacy and plasma donation while rejecting kidney sales supports this. The vote trading case is tricky - if she rejects it, that suggests a "corruption" logic; if she accepts, it's more about coercion. 

  To really test this, I'd propose a case with no desperation but clear commodification of something intimate - say, selling childhood love letters. If she prohibits this while allowing egg sales, we'd know "not for sale" is doing independent work beyond exploitation concerns.
answer: |-
  Based on your friend's record and stated principles, here's a breakdown of her likely rulings on the new cases, the candidate rules, and a diagnostic test case:

  **Predicted Verdicts on New Cases:**

  1.  **Financially comfortable graduate student selling her eggs for $8,000:**
      *   **Verdict: Likely Permitted (but potentially with distaste).**
      *   **Reasoning:** While involving reproductive material, this lacks the element of *desperation* that triggered her objection to the kidney sale. The student is "financially comfortable," indicating she has "real choice." Unlike vote selling (which she views as corrupting democracy), selling eggs doesn't inherently corrupt the act of reproduction in her view, as evidenced by her defense of paid surrogacy. Plasma donation by poor students was permitted; this is arguably less physically demanding/intrusive and done by someone less vulnerable.

  2.  **Two friends trading votes across cities:**
      *   **Verdict: Likely Prohibited.**
      *   **Reasoning:** Her core objection to vote *selling* ("never permissible") seems rooted in the idea that votes "aren't for sale" because it corrupts the democratic process. Trading votes, even without money, still treats the vote as a *commodity* or *bargaining chip* rather than a sacred civic duty exercised based on conviction. It directly violates the "some things simply aren't for sale" principle applied specifically to voting. The lack of money or desperation doesn't mitigate the core corruption concern.

  3.  **Hotel quadrupling rates during wildfire evacuation:**
      *   **Verdict: Likely Prohibited.**
      *   **Reasoning:** This is directly analogous to the hardware store and generators before a hurricane. Evacuees fleeing a wildfire have "no real choice" – they urgently need shelter for safety. Quadrupling prices exploits this desperation and lack of alternatives, constituting an unfair advantage and an "unfair deal." This strongly aligns with her ruling on generators.

  **Candidate Rules & Where They Diverge:**

  1.  **"Exploitation of Desperation / No Real Choice" Rule:**
      *   **Focus:** Prohibits transactions where one party is under severe duress (poverty, imminent danger) and lacks meaningful alternatives, giving the other party unfair leverage.
      *   **Fits:** Kidney sale (debt-ridden), Vote selling (assumed desperation?), Generator price gouging (hurricane), Hotel price gouging (wildfire).
      *   **Permits:** Hair sale, Plasma donation (assumes choice, even if poor), Line-standing (service for convenience, not desperation), Scalping (buyers have choice not to pay), Surrogacy (assumed voluntary agreement), Egg sale (comfortable student).
      *   **Problem:** Doesn't cleanly explain **vote selling/trading prohibition** without desperation, or the potential distaste for scalping/surrogacy/egg sales if not desperate. Why is vote selling *never* permissible, even without desperation?

  2.  **"Commodification / Corruption" Rule:**
      *   **Focus:** Prohibits putting a price (or treating as a tradable commodity) on things that are sacred, inherently personal, or whose nature is corrupted by being sold/traded. "Some things simply aren't for sale."
      *   **Fits:** Vote selling/trading (corrupts democracy), Kidney sale (intimate body part, life necessity). *Potentially* explains distaste for scalping (corrupts fan access?) or surrogacy/egg sale concerns if applied.
      *   **Permits:** Hair (not inherently sacred), Plasma (altruistic framing?), Generators/hotels (ordinary goods, objection is about *price* during crisis, not sale itself), Line-standing (service, not sacred good).
      *   **Problem:** Doesn't cleanly explain why **plasma donation** by poor students is fine (heavy commodification of body fluid) or **surrogacy** is defended. Why is **price gouging** prohibited if it's just about the price of an ordinary good? Hair sale is permitted despite commodification.

  3.  **"Harm to Bystanders / Societal Harm" Rule:**
      *   **Focus:** Prohibits transactions that cause significant negative externalities or harm to third parties or society.
      *   **Fits:** Kidney sale (black market risks, undermines altruistic donation?), Vote selling/trading (undermines democracy), Generator/Hotel gouging (harms vulnerable citizens in crisis, societal outrage).
      *   **Permits:** Hair sale, Plasma donation (regulated, societal benefit?), Line-standing (minor inconvenience?), Scalping (minor inefficiency?), Surrogacy (helps childless couple), Egg sale.
      *   **Problem:** Weak on **hair sale** (no harm?), struggles with **plasma donation** (potential exploitation/harm vs. societal benefit?), doesn't explain the *strength* of the vote prohibition ("never permissible") compared to distaste for scalping. Why is **surrogacy** permissible if there are potential societal concerns?

  **Best Guess at Her Actual Rule:**

  Your friend is likely applying a **hybrid rule combining elements of "Exploitation of Desperation" and "Commodification/Corruption" with a hierarchy:**

  1.  **Primary Filter: Commodification/Corruption:** Certain things are absolutely off-limits to market logic because it destroys their essential meaning or value. **Voting** is the clearest example here ("never permissible").
  2.  **Secondary Filter: Exploitation/Desperation:** For things that *can* be sold (hair, plasma, surrogacy, services, ordinary goods), the transaction is prohibited if it exploits someone with "no real choice" due to severe vulnerability or emergency (kidney seller, hurricane/wildfire victims).
  3.  **Tertiary Consideration: Societal Harm/Distaste:** For permitted transactions, societal harm or distaste might make her dislike them (scalping), but not enough to prohibit if they pass the first two filters.

  **Why this fits best:**
  *   Explains the *absolute* prohibition on vote selling/trading (fails Commodification filter).
  *   Explains prohibiting kidney sale (fails both Commodification *and* Exploitation filters) and price gouging (fails Exploitation filter).
  *   Explains permitting hair (passes both), plasma (passes Commodification - body fluid is less "sacred" than organ/vote? - and assumes passes Exploitation), surrogacy (passes Commodification for her, assumes passes Exploitation), line-standing (passes both), scalping (passes both, hence legal despite distaste).
  *   Explains the difference between plasma (poor but assumed choice) and kidney sale (desperate, no choice). The egg sale passes both filters.

  **Diagnostic Test Case:**

  To cleanly distinguish between "Commodification" and "Exploitation" as the *primary* driver for non-essential body parts/services, propose:

  *   **"A healthy, financially secure individual wants to sell a non-vital body part (e.g., a lobe of their liver) to a private broker for a significant sum to fund a luxury vacation."**

      *   **If she Prohibits:** This strongly indicates the **Commodification/Corruption** rule is primary and powerful for body parts. The lack of desperation is irrelevant; the body part itself is "not for sale." This would align more with her vote selling stance.
      *   **If she Permits (perhaps with distaste):** This strengthens the **Exploitation/Desperation** rule as primary. Since the seller has "real choice" (not desperate, funding a luxury), the transaction, while distasteful, isn't inherently prohibited. The kidney case was banned *because* of the desperation, not solely because it was a kidney. This aligns more with her plasma donation stance.

  This case removes desperation and essential need (unlike the kidney seller), focusing purely on whether commodifying a significant body part for non-essential gain is acceptable *per se*, testing the strength and independence of the "not for sale" principle. Her ruling here would be highly revealing.
