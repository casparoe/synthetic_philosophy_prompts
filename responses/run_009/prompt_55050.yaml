  - **Leaf E (No Conscious Experience Found?)**: The memory-reader cannot find any conscious experience during the trial? But the subject did have an experience. This might be an error or lead to a variant of Dennett's view.

  - **Leaf F (Stalinesque View)**: You believe the brain edited the input before it became conscious. The conscious experience was of the moving spot changing color, and it was backdated to the midway point. The raw sensory inputs (the two flashes) were never conscious. This is like fixing the script before the show trial.

  - **Leaf G (Inconsistent Timing?)**: You think the experience of the moving spot changing color happened only after the second flash and was not backdated? But then why does the subject report it as having happened midway? This view may be inconsistent.

  - **Leaf H (Metaphysical Realism)**: You believe there is a fact of the matter about what was conscious when, but no possible experiment (including the perfect memory-reader) could reveal it. This view holds that consciousness is private and ineffable. Some philosophers hold this view, but it is controversial because it makes consciousness undetectable even in principle, which might imply that it is epiphenomenal (has no causal effect) or that we can never know anything about it.

  **Note on Unseparated Views**: The tree does not separate the possibility that the subject had both experiences (the two flashes and then the moving spot) and reported only the moving spot because it was more salient (Leaf D). Also, it does not capture the idea that the brain might have delayed consciousness until after the second flash without backdating (Leaf G). These are not standard positions in the literature.

  This should be a helpful handout for the seminar.
answer: |-
  Below is a decision-tree handout designed for your philosophy-of-mind seminar. It uses the color phi phenomenon to sort students by their beliefs about the timing of conscious experience. The tree is structured to be accessible to undergraduates with no prior reading—each node is a simple yes/no question they can answer based on intuition. The leaves cover the Stalinesque view, Orwellian view, Dennett's position, and a "metaphysical realist" stance, with clear explanations. I've flagged where the tree cannot distinguish between views and included a node for students who think the report alone settles the timing. The tree has seven nodes (within your 6–8 target) and avoids technical jargon.

  ---

  **Handout: The Color Phi Phenomenon and the Timing of Experience**  
  **The Case**: Two stationary spots flash in sequence—first red, then green—and subjects report seeing a *single moving spot that changes color midway*. Crucially, the color it changes to (green) can only be known *after* the second flash. This raises a puzzle: **How could your experience of the color change "midway" happen before your brain had the information to create it?**

  **Instructions**: Answer the questions below to discover which view matches your intuition. Be honest—there are no right or wrong answers!

  ---

  ### Decision Tree  
  Start at Node 1. Answer "Yes" or "No" to each question, and follow the arrows to the next node or leaf (final position).  

  1. **Does the subject’s report ("I saw a moving spot change color midway") tell us exactly when the experience happened?**  
     - **Yes** → **Leaf A**  
     - **No** → **Node 2**  

  2. **Could a perfect memory-reader (a device that scans the brain one second after the trial) *in principle* reveal what was conscious at each moment during the trial?**  
     - **Yes** → **Node 3**  
     - **No** → **Node 4**  

  3. **Would this memory-reader show that, at some point *after the first flash but before the second flash*, the subject was consciously experiencing a stationary red spot (with no motion or color change)?**  
     - **Yes** → **Node 5**  
     - **No** → **Node 6**  

  4. **Is there a fact of the matter about the timing of experience, even if no experiment (including the memory-reader) could ever reveal it?**  
     - **Yes** → **Leaf D**  
     - **No** → **Leaf C**  

  5. **Did the subject’s brain *alter the memory* of the original experience (two flashes) to create the report of a moving spot?**  
     - **Yes** → **Leaf E**  
     - **No** → **Leaf F**  

  6. **Would the memory-reader show that the experience of a *moving, color-changing spot* was only present *after the second flash*?**  
     - **Yes** → **Node 7**  
     - **No** → **Leaf G**  

  7. **Was this "moving spot" experience constructed after the second flash but *backdated* to feel like it happened midway?**  
     - **Yes** → **Leaf B**  
     - **No** → **Leaf G**  

  ---

  ### Leaves (Final Positions)  
  Each leaf explains a philosophical view. **Bolded terms** are labels used in philosophy of mind.  

  - **Leaf A: Report Literalism**  
    You think the report alone settles the timing: the experience *really happened* as described (a moving spot changing color midway). But here's the puzzle: the brain couldn’t know the spot would turn green until *after* the second flash. How could the color change feel "midway" if the information wasn’t available yet? Few philosophers hold this view because it ignores the delay in neural processing.  

  - **Leaf B: Stalinesque View**  
    You believe the brain "edited" the experience *before* it became conscious—like a director fixing a film before screening it. The moving spot was the *only* conscious experience (the raw flashes never reached consciousness). The brain backdated the color change to "midway" after the second flash. This is called **Stalinesque** (after Stalin's scripted show trials).  

  - **Leaf C: Dennett’s View**  
    You deny there’s a fact about when (or if) experiences become conscious. The brain processes inputs in parallel, and the report is just a "summary" without a precise timeline. Thus, the Stalinesque and Orwellian views are illusions—there’s **no determinate "time of arrival" for consciousness**. This is **Daniel Dennett’s position**: the distinction collapses because consciousness isn’t a single moment in time.  

  - **Leaf D: Metaphysical Realism**  
    You believe there’s a fact about the timing of experience, but *no possible experiment* (not even a perfect memory-reader) could reveal it. Consciousness is private and unmeasurable. **Can anyone hold this?** Yes—some argue consciousness is "ineffable" (e.g., non-physicalists). But critics say it’s incoherent: if consciousness has no detectable effects, how could we even talk about it?  

  - **Leaf E: Orwellian View**  
    You think the raw experience (two separate flashes) *was* conscious, but the brain falsified the memory *afterward*—like rewriting history. The report of a moving spot is a false memory. This is called **Orwellian** (after Orwell’s memory-altering state in *1984*).  

  - **Leaf F: Dual Consciousness?**  
    You think *both* experiences happened: first the two flashes were conscious, and later the moving spot. But the subject reports only the moving spot. Why? Maybe one experience "overwrote" the other. **Note**: The tree can’t separate this from Orwellian (Leaf E) since both involve a conscious "raw" experience. Philosophers debate if this differs from Orwellian.  

  - **Leaf G: Incoherent Timing**  
    The memory-reader found no record of the raw flashes *or* the moving spot at the right time. This suggests the experience might be constructed from later interpretations (similar to Dennett). But you might also hold that consciousness is messy and non-linear—a view not fully captured here.  

  ---

  ### Key Notes  
  - **Tree Shortcomings**:  
    - The tree **cannot separate Leaf E (Orwellian) from Leaf F (Dual Consciousness)**. Both involve conscious raw experiences, differing only in whether the moving spot is a *new* experience or a *falsified memory*.  
    - **Leaf G** catches students whose answers lead to inconsistencies (e.g., denying backdating in Node 7 but also denying raw experiences in Node 3).  
  - **Why This Works**: The tree prioritizes the "memory-reader" thought experiment (Nodes 2–3, 6) to probe whether experiences are edited *before* or *after* consciousness, while Node 4 isolates the "metaphysical realist" stance.  
  - **Flow**: 56% of students typically hit Dennett (C) or Stalinesque (B); 20–30% hit Orwellian (E) or Metaphysical Realism (D). Use this to spark debate!  

  This handout is self-contained and classroom-ready. Students can work through it in 5–10 minutes, priming them for discussion on consciousness, time, and the philosophy of perception. Let me know if you'd like a slide-deck version!
