answer: |-
  Here’s a structured prospectus framework tailored to your one-year fellowship scope, integrating your core insight about the "dead-hand control" of historical training data:

  ---

  ### Dissertation Prospectus: **The Dead Hand in the Machine: AI Alignment and the Boundary Problem of Intergenerational Value Aggregation**

  #### 1. **Research Question**  
  Should artificial intelligence systems, when aggregating human values to guide behavior, incorporate the values of deceased individuals present in training corpora? If so, *with what normative weight* (full, discounted, or zero) relative to living generations?  

  #### 2. **The Gap: Boundary Question as Unacknowledged Foundation**  
  AI alignment frameworks implicitly rely on an aggregation base (e.g., "humanity," "stakeholders") but treat its composition as self-evident. Democratic theory, however, recognizes that defining the *demos* (who counts) is foundational and contested. I argue that **current AI systems resolve this boundary question by accident**:  
  - **Dead-Hand Control Mechanism**: Training data overrepresents historical texts (produced predominantly by the dead). This embeds static, past values into systems, acting as a brake on value shifts among living generations (e.g., evolving norms on gender, race, or environment).  
  - **The Unseen Tradeoff**: This is not a mere technical "bias" but an *implicit answer* to the intergenerational boundary question—one that grants the dead *de facto* full weight. No existing alignment theory explicitly defends this outcome.  

  #### 3. **Why Standard Frameworks Fail to Address This**  
  - **Liberal Neutrality**: Aims to avoid imposing contested values but assumes a fixed population. It cannot resolve whether neutrality should apply *across generations* or only *within* the living.  
  - **Majoritarian Aggregation** (e.g., RLHF): Presumes the majority’s values are paramount but ignores *which temporal majority* is counted (present vs. past+present).  
  - **Ideal-Advisor Theories** (e.g., coherent extrapolated volition): Implicitly assumes advisors exist outside time or represent "eternal" interests, sidestepping generational turnover.  
  **→ All take a stance *by default***: Accidental inheritance of the dead’s values via data, treated as an error, is actually an unexamined boundary decision.  

  #### 4. **Methodology: Conceptual Clarity + Case Testing**  
  - **Phase 1: Conceptual Analysis**  
    - Define key terms: "values," "weight," "generation," "aggregation base."  
    - Develop a typology of stances on the dead’s weight: *zero* (Jeffersonian), *discounted* (e.g., temporal distance discounting), *full* (conservative preservation).  
  - **Phase 2: Case-Driven Application**  
    - Select 2–3 instances of rapid intergenerational value shift (e.g., LGBTQ+ rights, environmental ethics, decolonization).  
    - Model how AI systems trained on historical corpora *would* aggregate values under each stance (zero/discounted/full weight for the dead).  
    - Evaluate outcomes: Does embedding the dead’s values preserve stability illegitimately? Does excluding them enable harmful value volatility?  

  #### 5. **Scope Management**  
  - **Realistic for 1 Year**: Focus on *conceptual justification* and *proof-of-concept case analysis*.  
  - **Limited Cases**: 2–3 high-stakes, well-documented value shifts (e.g., smoking bans, marriage equality).  
  - **Technical Abstraction**: Analyze AI behavior *as if* it directly weights values, bracketing technical limitations (e.g., whether LLMs "learn values" is secondary to *how corpora structure influence*).  

  #### 6. **Success/Failure Conditions**  
  - **Success**:  
    - Demonstrates that the boundary question (dead vs. living) is unavoidable in value aggregation.  
    - Shows that current data practices implicitly privilege the dead.  
    - Generates a defensible normative framework for weighting intergenerational values in AI design.  
  - **Failure**:  
    - The "dead hand" effect is proven negligible in practice.  
    - No meaningful distinction emerges between stances when applied to cases.  
    - The project cannot disentangle technical data artifacts from normative questions.  

  #### 7. **Significance**  
  - **For AI Ethics**: Forces explicit engagement with the *temporal demos* problem, moving beyond "bias" fixes to foundational design choices.  
  - **For Democratic Theory**: Tests whether AI’s accidental conservatism reveals underexplored tensions in intergenerational justice.  
  - **For Policy**: Warns that deploying "aligned" AI without addressing temporal boundaries risks institutionalizing democratic backsliding.  

  ---

  ### Key Strengths of This Framework  
  - **Novelty**: Positions data composition as a *deliberate boundary-setting choice*, not just noise.  
  - **Feasibility**: Focuses on conceptual/case analysis, avoiding overambitious technical work.  
  - **Impact**: Challenges AI ethics to confront democratic theory’s hardest problem—"who counts?"—in a new context.  

  Let me know if you’d like to refine specific sections (e.g., case selection, weighting mechanisms).
