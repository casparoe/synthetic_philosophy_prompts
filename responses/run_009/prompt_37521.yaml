  I need to address the trust factor more deeply. The user feels sentimental about the notebook, but the literature does emphasize trust as a functional criterion. If the user doesn't trust his phone the way his dad trusts the notebook, that's a valid reason it might not qualify as an extension. However, habits can change over time. As the user relies more on his phone, it might become more integrated, but the current lack of trust prevents that.

