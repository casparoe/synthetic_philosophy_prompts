prompt: |-
  I'm a high school senior who helps run orientation for the exchange students our school hosts every year, and I keep getting the same kind of question from them: do I actually have to tip here, do I have to wait my turn in line when locals are cutting, do I have to wait for the crosswalk light when everyone around me is crossing against it? I want to hand next year's students something better than "when in Rome." Please write a decision procedure they can run in their heads, in about a minute, whenever they notice a local everyday convention they don't share. The procedure should rest on an actual position about what makes such conventions binding rather than just local habits — for example, taking seriously the thought that some conventions solve coordination problems (which side of the escalator to stand on), some are fairness norms that locals themselves may resent but cannot unilaterally abandon (tipping in the United States), and some are legal conventions with safety stakes (jaywalking) — and it should be honest about where these categories blur into each other. For each step, state the question being asked, what answer points toward following the convention, what answer leaves the student free not to, and which steps are really about the student's own values rather than facts anyone could verify. Then run the procedure on three cases: tipping at a restaurant for a student from a country where tipping is rare or even mildly insulting; joining or refusing to join in when locals cut a queue they generally expect others to respect; and crossing against the light at an empty intersection where everyone local does it. At least one of the worked cases should come out in a way I won't like, and you should say so. Finally, please commit to a definite verdict on the underlying question — whether following local conventions of this kind is a genuine moral obligation for visitors, or something weaker like courtesy, prudence, or good judgment — and defend that verdict rather than laying out the options and leaving me to choose.
reasoning: |-
  Okay, the user is a high school senior running orientation for exchange students. They're getting recurring questions about local conventions like tipping, queueing, and jaywalking. They want a decision procedure that's more substantive than "when in Rome," grounded in why conventions might be binding. 

  First, I need to unpack the core tension: exchange students feel caught between their home norms and unfamiliar local rules. The user wants to empower them with ethical reasoning, not just rules. The mention of "binding rather than habits" suggests they want philosophical depth—maybe they've studied ethics or coordination problems themselves.

  The request has layers: 
  - Practical: A flowchart-like mental algorithm 
  - Philosophical: Justification for why conventions obligate (or don't)
  - Pedagogical: Teachable to teenagers in 60 seconds
  - Cultural: Must handle gray areas (e.g., tipping as both fairness norm and resented practice)

  Key challenges: 
  - Avoiding oversimplification while keeping it usable 
  - Balancing moral realism ("facts anyone could verify") with personal values 
  - Making abstract philosophy (Lewis-style conventions, Rawlsian fairness) accessible 

  For the framework, I consider: 
  1. Safety/legal stakes first—clear priority 
  2. Coordination efficiency (e.g., escalator sides) 
  3. Fairness systems where defection harms others (tipping wages) 
  4. Purely optional norms (where "courtesy" suffices) 

  The "unwelcome verdict" requirement is smart—it forces nuance. I'll make queue-jumping the controversial one: resisting might feel righteous but could escalate conflict pointlessly. Teens might dislike being told not to confront line-cutters, but safety trumps principle here. 

  On the underlying obligation question: I lean toward "prima facie duty" (Ross-style) with exceptions. Why? 
  - Conventions stabilize social cooperation; violating them without reason exploits the system locals maintain 
  - But it's weaker than moral absolutes—self-defense or preventing harm can override 
  - This defends cooperation without demanding blind conformity 

  The restaurant tipping case highlights systemic vulnerability: workers depend on tips. Queue-jumping shows how enforcement isn't the visitor's role. Jaywalking illustrates risk asymmetry—locals know the patterns, tourists don't. 

  Finally, I add the "personal cost" escape valve because exchange students are minors navigating power imbalances. If standing up risks bullying, it's okay to prioritize safety. That's the hidden layer in their question—they want to protect younger students.
answer: |-
  Here's a decision procedure grounded in **cooperative fairness and harm prevention**, drawing from social contract theory (how conventions solve collective problems) and moral philosophy (avoiding harm, respecting systems others rely on). It takes about 60 seconds once familiar.

  **The "Cooperation Compass" Decision Procedure:**

  1.  **QUESTION: Is this convention primarily about preventing immediate physical/legal harm?**
      *   *Follow if YES:* Clear safety risk (e.g., driving rules, handling hazardous materials) or serious legal penalty (e.g., theft, trespassing).
      *   *Don't follow if NO:* No significant safety/legal threat.
      *   *(Fact-Based)*

  2.  **QUESTION: Does violating this convention directly harm a specific, vulnerable person who reasonably relies on it?**
      *   *Follow if YES:* Your action denies someone essential compensation (like a tipped worker), causes significant inconvenience (e.g., skipping a queue forces others to wait longer), or undermines a system they depend on (e.g., public transit etiquette).
      *   *Don't follow if NO:* The harm is diffuse, negligible, or hypothetical.
      *   *(Fact-Based, assessing reliance and vulnerability)*

  3.  **QUESTION: Is this convention solving a core coordination problem where unilateral defiance causes chaos?**
      *   *Follow if YES:* The norm exists purely to coordinate efficiently (e.g., escalator standing/walking side, traffic flow patterns, checkout line order). Your defiance actively makes things worse for everyone, including you.
      *   *Don't follow if NO:* The coordination benefit is minor, or defiance doesn't disrupt the core function significantly.
      *   *(Fact-Based, assessing systemic function)*

  4.  **QUESTION: Is violating this norm primarily an expression of my values against the norm itself, rather than necessity?**
      *   *Follow if...?* **Not Applicable.** This step is about *not* following.
      *   *You are likely FREE NOT TO FOLLOW if YES:* Your objection is conscientious (e.g., refusing to participate in a discriminatory practice, even if locally accepted). However, proceed cautiously.
      *   *Consider Cost:* Even if conscientious, ask: What's the likely consequence (social friction, penalty, harm to others)? Is this the most effective way to protest? (Requires honest self-reflection).
      *   *(Value-Based)*

  5.  **QUESTION: Is the personal cost (social, financial, practical) of following unusually high for me?**
      *   *Follow if...?* **Not Applicable.** This step is about *not* following.
      *   *You are likely FREE NOT TO FOLLOW if YES:* Following imposes a severe burden unique to your situation (e.g., extreme financial hardship from tipping, genuine safety threat from *not* crossing with a group in a dangerous area).
      *   *(Situation-Specific Fact/Value Blend - Use Sparingly!)*

  **General Rule:** When steps 1-3 don't compel following, and 4-5 don't justify refusing, **default to following the local convention as a matter of cooperative courtesy and smooth interaction.** It respects the shared social environment.

  ---

  **Worked Examples:**

  **1. Tipping at a Restaurant (Student from non-tipping country):**
      *   **Step 1 (Harm/Legal):** Not primarily safety/legal. *Points to NOT following.*
      *   **Step 2 (Direct Harm):** **YES.** Servers in the US are often paid below minimum wage *relying* on tips for livelihood. Your refusal directly denies them expected, essential income. They are vulnerable workers. *Points STRONGLY to FOLLOWING.*
      *   **Step 3 (Coordination):** Partly (it coordinates payment for service), but Step 2 is stronger. *Points mildly to FOLLOWING.*
      *   **Step 4 (Conscientious Objection):** Is it? Probably discomfort or disagreement, not a deep moral stance against wages. Even if it were, the direct harm (Step 2) likely outweighs it. *Doesn't justify refusing.*
      *   **Step 5 (High Cost):** Is 15-20% on a meal a *severe* burden? Usually not for an exchange student budgeting for dining out. *Doesn't justify refusing.*
      *   **VERDICT:** **You should tip.** The direct, significant harm to a vulnerable worker relying on the system creates a strong obligation. It's not just a habit; it's a flawed but essential part of their compensation structure. Your participation avoids directly exploiting that system.

  **2. Joining Locals Cutting a Queue (Where queueing is generally expected but sometimes ignored):**
      *   **Step 1 (Harm/Legal):** Not safety/legal. *Points to NOT following (the queue).*
      *   **Step 2 (Direct Harm):** **YES.** Cutting in line directly harms the specific people behind you by making them wait longer. They are reasonably relying on the queue order. *Points STRONGLY to NOT JOINING (i.e., respecting the queue).*
      *   **Step 3 (Coordination):** **YES.** Queues exist solely for fair, efficient coordination. Unilaterally cutting (or joining cutters) actively disrupts this, causing frustration and potential chaos. *Points STRONGLY to NOT JOINING.*
      *   **Step 4 (Conscientious Objection):** *Is refusing to cut a value stance?* Yes (fairness). *Points to NOT JOINING.* This aligns with the above.
      *   **Step 5 (High Cost):** Cost of *not* joining? Maybe mild social awkwardness vs. the harm caused by joining. *Doesn't justify joining.*
      *   **VERDICT:** **You should NOT join in cutting the queue.** Actively participating directly harms those waiting fairly and disrupts the coordination solution. Your obligation is to the fair system, not the local violators. (You might *choose* not to confront the cutters, but don't join them).

  **3. Crossing Against the Light at an Empty Intersection (Where locals routinely jaywalk):**
      *   **Step 1 (Harm/Legal):** **Blurry.** Legally, it's often prohibited (jaywalking). Safety-wise, *empty* implies low *immediate* risk, but laws exist partly because "empty" can change instantly. *Mildly points to FOLLOWING.*
      *   **Step 2 (Direct Harm):** **NO.** On an *empty* street, crossing doesn't directly harm a specific person relying on the norm. Pedestrians aren't "vulnerable" in the same way tipped workers are. *Points to NOT FOLLOWING (i.e., crossing).*
      *   **Step 3 (Coordination):** **Blurry.** Lights coordinate cars/pedestrians. If truly no cars *and* no other pedestrians needing coordination, the core function isn't disrupted *at that moment*. But widespread disregard undermines the system generally. *Very mild point towards FOLLOWING, weak here.*
      *   **Step 4 (Conscientious Objection):** Is crossing a value stance? Possibly efficiency/practicality vs. rule-following. *Points to NOT FOLLOWING (crossing).*
      *   **Step 5 (High Cost):** Cost of waiting? Usually minor inconvenience. Cost of crossing? Very low risk if truly empty. *Neutral.*
      *   **VERDICT (The One You Might Not Like):** **You are likely FREE NOT TO FOLLOW the light in this specific scenario.** The strongest obligation factors (Steps 1 & 3) are weak here ("empty," low immediate risk/system disruption). There's no direct harm to a vulnerable person (Step 2). While legally questionable and potentially eroding the norm long-term, the immediate moral obligation to wait is weak. It becomes a matter of **prudence** (assess *actual* traffic carefully!), **courtesy** (don't encourage chaos if others *are* present), and **respect for law** (minimal risk here), not a strong moral duty. *However, emphasize extreme caution – "empty" can be misjudged!* This verdict hinges on the specific "empty intersection" condition.

  ---

  **The Underlying Verdict & Defense:**

  **Following everyday local conventions is a *prima facie moral obligation* for visitors, grounded in fairness, harm prevention, and respect for cooperative systems, but it is *defeasible* (can be overridden).**

  **Why a Genuine (but not absolute) Moral Obligation?**

  1.  **Fair Play & Non-Exploitation:** Locals uphold systems (queues, wage structures like tipping, traffic flows) that benefit everyone, including visitors. To knowingly benefit from these systems (safe roads, served meals, orderly shops) while unilaterally refusing the cooperative burdens (tipping, queueing, *generally* following traffic signals) is **free-riding**. It exploits the cooperative efforts of others.
  2.  **Harm Prevention:** Many conventions exist to prevent harm – physical (traffic norms), financial (tipping reliance), or the harm of unfairness/disorder (queue jumping). Violating them can directly cause tangible harm to vulnerable individuals (servers, fellow queue-standers) or increase systemic risk (eroding traffic safety norms).
  3.  **Respect for the Host Community:** Joining a community, even temporarily, implies a minimal commitment to its shared terms of interaction, especially when those terms solve collective problems or protect the vulnerable. Disregarding them without strong justification shows disrespect for the social fabric hosting you.
  4.  **Solving Coordination Problems:** Conventions like escalator standing or queueing are pure coordination solutions. Defying them doesn't just break a habit; it actively makes collective life worse for everyone by introducing inefficiency and frustration. Cooperation is the morally required default in such scenarios.

  **Why Defeasible?**

  This obligation isn't absolute. It can be overridden by:
  *   **Stronger Moral Duties:** Refusing a discriminatory practice (Step 4).
  *   **Significant Harm to Self:** Unreasonable burden or genuine safety risk (Step 5).
  *   **The Convention's Own Immorality:** If the convention itself causes severe harm or injustice (e.g., apartheid-era norms), the obligation dissolves or reverses.
  *   **Triviality:** If the convention serves no real coordination or harm-prevention function, and violation causes no perceptible harm (like some purely stylistic norms), the obligation fades to mere courtesy.

  **In essence:** You have a real moral duty to "do as the Romans do" *because* you are in Rome, benefiting from its social systems. This duty stems from fairness and the prevention of harm, not mere conformity. However, your conscience, your own well-being, and the inherent justice of the norm itself provide valid, though limited, reasons for exception. Use the procedure to identify when the duty is strong (protecting the vulnerable, maintaining essential coordination) and when it's weaker or can be justifiably set aside.
