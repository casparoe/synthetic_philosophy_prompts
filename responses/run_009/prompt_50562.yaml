answer: |-
  ### Analysis of the Patterns

  Your description captures two distinct group decision-making pathologies common in informal committees. Here's a breakdown:

  ---

  #### **1. Max-Eagerness Pattern ("Club does whatever the single keenest member wants")**
  - **Established Name**: **Minority Rule** (as described by Nassim Taleb in *Antifragile*)  
    **Confidence**: Medium  
    **Why it fits**:  
    Taleb's "minority rule" describes how a small, inflexible minority can impose preferences on a flexible majority if they care intensely enough. In your case, the enthusiastic member acts unilaterally (inflexibly), while the indifferent majority yields by default.  
    **Nearest Misses**:  
    - *Tyranny of Structurelessness*: Focuses on hidden power in informal groups but doesn't emphasize unilateral action by enthusiasts.  
    - *Foot-in-the-Door Technique*: A persuasion tactic (small requests leading to larger ones), not a structural group flaw.  
    - *First-Mover Advantage*: About competitive gains, not committee dynamics.  
    **How it Differs**:  
    Classic minority rule involves systemic preference shifts (e.g., kosher food in airlines). Your case is ad hoc (one-off actions), and the majority isn't "converted"—they just fail to veto.

  ---

  #### **2. Min-Willingness Pattern ("Unpleasant tasks never get done")**
  - **Established Name**: **Volunteer's Dilemma**  
    **Confidence**: High  
    **Same Phenomenon as First?** False  
    **Why it fits**:  
    In game theory, the volunteer's dilemma occurs when everyone waits for someone else to bear the cost of acting, leading to collective inaction. Each member prefers the task done but avoids personal cost (e.g., confrontation).  
    **Nearest Misses**:  
    - *Diffusion of Responsibility*: Explains inaction in emergencies (e.g., bystander effect), not routine tasks.  
    - *Social Loafing*: Involves reduced effort in group tasks (e.g., team projects), not avoidance of individual tasks.  
    - *Tragedy of the Commons*: Focuses on resource overuse, not task neglect.  
    **How it Differs**:  
    The volunteer's dilemma assumes mutual benefit from action—your case fits perfectly. It's the inverse of the max-eagerness pattern: here, the *least willing* member sets the outcome via inaction.

  ---

  #### **Coined Terms**  
  Neither pattern lacks an established name, so no new terms are coined. "Minority rule" and "volunteer's dilemma" are conceptually adequate (if imperfectly precise for your context).

  ---

  #### **Least Sure Point**  
  I'm least confident about labeling the max-eagerness pattern as "minority rule." Taleb's concept typically describes cultural/systems-level shifts (e.g., halal standards), not micro-decisions like booking a stall. However, the core mechanism—minority intensity overriding majority apathy—aligns. Alternative terms like "fait accompli governance" or "enthusiast's veto" could work but lack academic traction.

