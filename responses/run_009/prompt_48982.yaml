answer: |-
  Here’s a specification for an adequate theory of action under consequentialist cluelessness, structured as desiderata with motivating cases, followed by analysis of their status (non-negotiable vs. contested) and joint satisfiability. This distills philosophical debates into criteria a theory must meet to resolve the "moral deadlock" your sources describe.

  ---

  ### **Core Desiderata: Non-Negotiables**  
  *(Failure on any renders the theory morally or rationally incoherent)*

  1. **Avoid Paralysis Despite Ignorance**  
     *Requirement:* Must justify why *some* actions remain obligatory/rationally permissible even when consequences are deeply uncertain.  
     *Motivating Case:* Donating to evidence-backed charities (e.g., bednets for malaria) remains prudent despite uncertainty about long-term ripple effects. Paralysis would also arise if we refused to cross streets due to unquantifiable tail risks (e.g., triggering a butterfly-effect catastrophe).  
     *Why Non-Negotiable:* Ethics must guide action; total paralysis collapses practical reason.

  2. **Prevent Reckless Justification**  
     *Requirement:* Must not permit *any* action on grounds that "it might turn out best."  
     *Motivating Case:* A policymaker cannot justify invading a country because it *might* accidentally prevent a future pandemic. Similarly, "longtermist" interventions (e.g., asteroid deflection) cannot ignore near-certain harms for speculative cosmic gains.  
     *Why Non-Negotiable:* Sanctions moral recklessness and preserves distinction between responsibility and gambling.

  3. **Respect Epistemic Limits**  
     *Requirement:* Cannot rely on precise probabilities when they are epistemically unavailable (e.g., for "unknown unknowns").  
     *Motivating Case:* Early pandemic models lacked data on school closures’ societal ripple effects; assigning precise probabilities was scientifically unjustified. Climate "fat tails" (e.g., 10°C warming) defy reliable quantification.  
     *Why Non-Negotiable:* Demanding unattainable precision is irrational and disguises guesswork as rigor.

  4. **Demand Sensitivity to Available Knowledge**  
     *Requirement:* Must respond to *graded* uncertainty (e.g., distinguishing "known unknowns" from radical cluelessness).  
     *Motivating Case:* Lockdown decisions weigh predictable harms (economic damage) against uncertain benefits (reduced transmission). Ignoring the *difference* between these uncertainties is negligent.  
     *Why Non-Negotiable:* A theory indifferent to discernible evidence is ethically arbitrary.

  5. **Integrate Foreseeable Local Effects**  
     *Requirement:* Must prioritize outcomes we can reasonably foresee, even when distant effects are murky.  
     *Motivating Case:* Funding a rural clinic has predictable immediate benefits (lives saved) even if long-term effects (demographic shifts, ecosystem strain) are clueless.  
     *Why Non-Negotiable:* Dismissing proximate goods for unfathomable futures is nihilistic.

  ---

  ### **Contested Desiderata: Philosophical Fault Lines**  
  *(Where camps diverge on whether these are essential or biases to discard)*

  6. **Preserve Robust Obligations**  
     *Requirement:* Must uphold strong duties (e.g., to aid others) despite cluelessness about their long-term consequences.  
     *Motivating Case:* Effective altruists argue donating to GiveWell-recommended charities *must_ remain obligatory even if cosmic uncertainty exists.  
     *Contested Status:* **Bedrock for some** (e.g., deontologists, moderate consequentialists who see obligation as non-negotiable). **Prejudice for others** (e.g., "cluelessness radicals" like Greaves/Hayden who argue cluelessness may void standard obligations).  
     *Fault Line:* Is ethics fundamentally about *acting well* (preserving duties) or *outcomes* (which cluelessness obscures)?

  7. **Provide Action-Guidance**  
     *Requirement:* Must offer concrete decision procedures (e.g., rules, heuristics) in clueless scenarios.  
     *Motivating Case:* Climate policymakers need frameworks for acting on unquantifiable tail risks (e.g., solar geoengineering).  
     *Contested Status:* **Essential for pragmatists** (e.g., Lenman, Gardiner). **Suspicious for skeptics** (e.g., Williams) who see cluelessness as undermining systematic guidance.  
     *Fault Line:* Is ethics about solving problems or acknowledging limits?

  8. **Remain Consequentialist**  
     *Requirement:* Must not abandon consequentialism (i.e., outcomes matter fundamentally).  
     *Motivating Case:* Longtermists insist we *must* weigh future lives equally, demanding a consequentialist response to cluelessness.  
     *Contested Status:* **Core for consequentialists** (e.g., MacAskill). **Optional for hybrid theorists** (e.g., Frick, who blends deontology/consequentialism) or **anti-consequentialists** (e.g., moral particularists).  
     *Fault Line:* Can consequentialism survive cluelessness, or must we adopt non-consequentialist elements?

  ---

  ### **Joint Satisfiability: The Structural Deadlock**  
  **The core tension:** Can a theory satisfy *Avoid Paralysis*, *Prevent Recklessness*, and *Respect Epistemic Limits* simultaneously without collapsing?  

  - **The Trilemma:**  
    - If we demand action (avoid paralysis) but lack probabilities (respect limits), we risk permitting recklessness.  
    - If we forbid recklessness without probabilities, we risk paralysis.  
    - If we impose probabilities despite cluelessness, we violate epistemic limits.  

  - **Where Theories Break:**  
    - **"Maxipok" (Bostrom):** Focuses on preventing worst-case outcomes (avoids paralysis) but often justifies extreme measures (slides into recklessness).  
    - **Expectationalism + Imprecise Probabilities (e.g., Ord):** Uses probability ranges to respect uncertainty but still demands quantification where none exists (violates *Respect Epistemic Limits* for radical cluelessness).  
    - **Rule Consequentialism (e.g., Lenman):** Advocates rules based on "best guess" outcomes (avoids paralysis/recklessness) but relies on contested probability assignments.  
    - **Deontic Constraints (e.g., Frick):** Forbids recklessness via side-constraints (e.g., "don't impose catastrophic risks") but struggles to explain *why* we should act in clueless cases (risks paralysis).  

  **The Unsettled Verdict:**  
  No theory currently satisfies all core desiderata. *Avoid Paralysis* and *Prevent Recklessness* appear jointly incompatible with *Respect Epistemic Limits* under radical cluelessness. This suggests **the deadlock is structural**: consequentialist ethics assumes knowable causal pathways, which cluelessness undermines. Hybrid theories (e.g., Steel’s "contextual consequentialism") or non-consequentialist turns (e.g., virtue ethics) may be necessary, but this remains deeply controversial.

  ---

  ### **Takeaway for Your Piece**  
  The cluelessness problem forces a reckoning: **we may need to abandon the demand that ethics always "maximize expected value" when value and probability are inscrutable.** An adequate theory must navigate between paralysis and recklessness while honoring ignorance—yet this space may be narrower than policymakers assume. The deepest divide is whether ethics can preserve strong obligations in the face of cluelessness (*Preserve Robust Obligations*) or must radically scale back its ambitions. If your sources sense a deadlock, it’s because the desiderata for a solution pull in opposite directions—a tension embedded in the nature of consequentialist reasoning itself.
