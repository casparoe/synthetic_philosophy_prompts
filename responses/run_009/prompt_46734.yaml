prompt: |-
  I've been trying to work out what I believe about dispositions, finks, and masks by just going with my gut on a bunch of cases, and now I want someone to tell me if there's an actual principle under there. A normal wine glass sitting on my table: fragile, obviously. A wine glass on display with a devoted guard who has one job, namely to snatch the glass out of the way the instant anything comes flying at it: I want to say it's still fragile -- nothing about the glass itself changed, it's the same glass it was yesterday. A wine glass sealed inside a solid transparent block of epoxy resin (it's a long story, an art project): not fragile, that's my verdict, even though the glass itself is also unchanged and would shatter if you could somehow hit it. A sugar cube that dissolves if dropped in water: soluble. A sugar cube that's been sprayed with a waterproof coating that wears off in a week: I keep flip-flopping, but I lean soluble, it's only got the coating for a bit. A person who would crave a drink if they had one but who takes a drug that blocks craving entirely: I say they don't have the craving disposition anymore, the blocker doesn't just hide it. And a vase stored in a room flooded with nitrogen where matches can't ignite: I say it's not flammable, period.

  So here's my tentative principle, which I don't trust: a disposition is removed when something is standing between the stimulus and the manifestation, and it survives when the interfering thing instead changes or removes the object's underlying basis before the manifestation could start. That sorta fits -- the guard removes the glass from the scene (basis intact, disposition fine), the epoxy sits right there in the causal path (disposition gone), the blocker drug rewires the person's basis (disposition gone), the coating sits in the path (but I said soluble??). And honestly I can't even tell whether the guard case is supposed to be like the blocker case or the epoxy case, which makes me think the principle is doing less work than I hoped.

  Anyway, is there one account that delivers all these verdicts, or close, and can you tell me what it is, precisely? I'd especially like: (1) what the account says about the case I can't make up my mind on, the coated sugar cube, and (2) what it predicts for a case I haven't mentioned -- a glass with a force field around it that detects incoming objects and hardens a shell *upon* impact, at the moment of contact, since I genuinely don't know if that's more like the guard or more like the epoxy, and my gut gives me nothing. And if the price of saving all my verdicts is some baroque three-clause monster principle, just tell me honestly which verdict to throw out instead.
