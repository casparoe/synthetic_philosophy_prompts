prompt: |-
  I teach applied ethics, and something I keep bumping into with my students that I can't quite articulate properly. In criminal law there's this whole apparatus built on the idea that guilt attaches to deeds, not to persons — character evidence is mostly inadmissible, prior bad acts only come in narrowly, and once you've served your sentence your "debt to society" is supposed to be paid. The informal sanctions of online life run on exactly the opposite principle. Somebody's tweets from 2012 get dug up and treated not as stale evidence about a deed but as a window into who they permanently are, and there's no mechanism at all for ending the sanction — no sentence length, no discharge, nothing. Even people who defend these sanctions tend to talk about what the person "revealed themselves to be," which is a claim about character, not about the act.

  So my question: what theory of punishment or desert does that practice actually presuppose, if any? Is it that desert attaches to persons rather than deeds? But then why do the same people who defend cancellation usually also endorse rehabilitation and "people can change" when it comes to prisons — is that a flat contradiction, or can you hold both? Could the practice be made sense of on a purely expressive theory, where the sanction says something about a norm rather than about the person, without smuggling in a claim about fixed character? And I want you to be honest about where the practice is philosophically underdetermined — could a consequentialist and a retributivist both license it, in which case it presupposes much less than it looks like it does?

  A second thing I want you to take seriously rather than waving off: does the temporal part matter philosophically, or is it just a practical difference caused by the internet never forgetting? The legal side, with statutes of limitations and the debt-paid idea, seems to presuppose that desert decays or gets extinguished with time and with suffering already endured. The online side presupposes nothing decays. Is one of these just confused, or do they rest on genuinely different views about whether blame tracks acts-in-time or persons-over-time? Relatedly, do the personal identity questions bite here — when the 22-year-old who posted the thing and the 38-year-old being fired over it disagree about everything, is that even the same subject of desert? I don't need you to go full metaphysics, but tell me whether that matters or is a lawyer's dodge.

  And finally: suppose we wanted to rebuild informal social sanction on the legal picture — say, a norm that public condemnation "expires," or that apologizing and time-served actually discharges the sanction. What would have to change in the practice itself for that to be more than a pious wish? Is the obstacle in the technology (archives, screenshots), in the incentives of the people doing the sanctioning, or in the underlying theory of what the sanction is even for?
reasoning: |-
  Okay, the user is teaching applied ethics and has noticed a disconnect between criminal law principles and online social sanctions. They’re struggling to articulate why online "cancellation" treats past actions as permanent character indicators, while the legal system focuses on deeds with expiration mechanisms.  

  First, I need to unpack the core tension: legal systems (retributive/rehabilitative) vs. online mob justice (character essentialism). The user’s students seem confused by this duality—why do the same people support prison rehabilitation but treat old tweets as eternal moral stains?  

  The user’s questions are layered:  
  - **Theory of punishment**: Does online sanctioning presuppose desert attaches to persons, not acts?  
  - **Contradiction**: Why defend both cancellation (fixed character) and prison rehabilitation (change)?  
  - **Temporal decay**: Why does law recognize expiration ("debt paid") while the internet doesn’t?  
  - **Practical fixes**: How could we redesign online norms to mirror legal principles?  

  I should start by dissecting the implicit theories behind online shaming. It’s not purely retributive (no proportionality) or consequentialist (no clear deterrence benefit). Instead, it leans into **character retributivism**—punishing the "revealed self"—and **expressive denunciation** (upholding norms by rejecting "polluting" individuals). This explains the permanence: if the act reveals eternal character, time doesn’t erase it.  

  The contradiction with supporting prison rehab isn’t absolute. People might view crimes as *contextual* (poverty, addiction = changeable) but tweets as *volitional* (true self). Or they might apply rehab ideals only to systems (prisons) but not informal sanctions (online). Still, it’s cognitively dissonant.  

  On time decay: Legal systems assume blame attaches to *past selves*; online culture sees identity as continuous. Parfit’s teletransportation thought experiment feels relevant—if the 38-year-old is psychologically discontinuous from their 22-year-old self, is blame transferable? But online archives collapse time, making "past selves" feel present.  

  For redesigning norms: The obstacles are structural. Screenshots immortalize mistakes; virality incentivizes performative outrage; platforms profit from drama. Fixing this would require:  
  - Tech fixes (auto-expiring posts? context-attaching tools?)  
  - Cultural pushes (norms accepting redemption arcs)  
  - Formal mechanisms (e.g., public apologies ending sanctions)  

  The user’s deeper frustration might be about *arbitrary moral permanence*. Why do some forgiven in person (e.g., college drunken mistakes) get "canceled" online for similar acts? Highlighting this hypocrisy could help students critique both systems.  

  Also, the metaphysics of personal identity *does* matter here. If we morally blame based on psychological connectedness (memories, values), a decade-old tweet from a radically changed person *should* carry less weight. But online, we lack tools to assess that change.  

  In all, the user needs frameworks to help students:  
  1. Diagnose inconsistencies (character vs. act-focused desert)  
  2. Challenge online permanence (e.g., "Why is 2012 you more 'real' than 2024 you?")  
  3. Imagine better systems (expiration dates for outrage?)  

  The philosophical underdetermination is key: online shaming *isn’t* coherent. It mishmashes retribution, expression, and utilitarianism without the safeguards of legal systems. That incoherence is worth dissecting in class.
answer: |-
  This is a profound and urgent question that cuts to the heart of how we conceptualize moral responsibility in the digital age. Let's break it down systematically, addressing your core concerns about theories of desert, time, personal identity, and potential reforms.

  ### 1. **The Theory of Punishment Presupposed by Online Sanctions**
     - **Character Retributivism**: Online sanctioning primarily operates on a **character-based theory of desert**. When old tweets are treated as revelations of "who someone *is*," it presupposes that:
       - Moral blameworthiness attaches to enduring character traits, not transient acts.
       - Certain acts (e.g., racist tweets) are "diagnostic" of irredeemable moral corruption.
       - This view is distinct from legal retributivism (which focuses on *actus reus* and proportionality) and aligns with Aristotelian virtue ethics, where acts are symptoms of vice.
     - **Expressive Denunciation + Purity Norms**: The practice also serves an **expressive function**, but one that *does* smuggle in character claims. Condemnation signals group values ("We reject racism"), but by permanently excluding the offender, it implies the person *embodies* a polluting threat to communal purity. This resembles Durkheim's view of punishment as reinforcing social cohesion through ritual exclusion.
     - **Consequentialism? Only Superficially**: Defenders might cite deterrence or norm-setting, but the *permanence* of sanctions undermines this. If consequences mattered, we'd track rehabilitation or changed behavior. Instead, the focus on "revealed character" suggests deontological desert: the person *deserves* condemnation because of who they *are*.

     **The Contradiction with Criminal Justice Reform**:  
     Yes, it's a tension, but not necessarily a *flat* contradiction:
     - **Compartmentalization**: People often apply the "deeds" model to the legal system (with its procedural safeguards) and the "character" model to informal social spaces. The law is seen as a constrained tool for managing harm; social media is seen as a domain of moral judgment.
     - **Agency and Context Bias**: Offline crimes (e.g., theft) might be contextualized ("poverty made them desperate"), while online speech is seen as a "pure" expression of character. Rehabilitation is offered to those deemed "flawed but capable of change"; cancellation targets those deemed "irredeemably corrupt."

  ### 2. **The Temporal Problem: Why Time Doesn't Heal Online Wounds**
     - **Philosophical Stakes**: Time matters deeply. Legal systems assume blame decays because:
       - **Moral Agency is Temporal**: We punish *past* selves. Statutes of limitations recognize evidence decay, but also that people change.
       - **Suffering Extinguishes Desert**: Retributivism requires proportionate suffering; once endured, the debt is paid.
     - **Online Permanence as Metaphysical Collapse**: Digital archives destroy temporal boundaries. A 2012 tweet isn't treated as evidence of a *past* act but as a *present* statement of character. This assumes:
       - **Identity Essentialism**: The self is static; past acts perfectly predict current character.
       - **No Moral Repair**: Apologies or growth are discounted because the "true self" was revealed in the past. The offender is seen as "masking," not changing.
     
     **Does Personal Identity Matter? Absolutely**:
     - If Parfit is right and identity is about psychological connectedness (memories, values), a 38-year-old with wholly new beliefs may *not* be the "same person" as their 22-year-old self. Online culture ignores this, treating identity as a fixed substrate.
     - **Why This Isn't a Dodge**: Dismissing identity questions assumes a simplistic, continuous self. Grappling with this forces us to ask: *Who* are we punishing? If the agent lacks psychological continuity, blame loses its retributive anchor. Online sanctions deny the possibility of genuine discontinuity.

  ### 3. **Could Consequentialism or Retributivism Justify Online Sanctions?**
     - **Retributivism**: Only if you accept character retributivism ("they deserve punishment for being vicious"). Act-focused retributivism (desert for specific deeds) clashes with permanent sanctions for old acts.
     - **Consequentialism**: Only if permanent exclusion reliably deterred harm or reformed character. Evidence suggests it doesn't; it often radicalizes or silences. Consequentialism would demand expiration mechanisms if sanctions become counterproductive.
     - **Underdetermination**: The practice is philosophically unstable. It borrows retributive language ("they deserve this") but avoids proportionality; it gestures at consequences while ignoring evidence of harm. Its core logic is **expressive essentialism**: condemning the *essence* revealed by past acts to affirm group norms.

  ### 4. **Rebuilding Social Sanctions: From Pious Wish to Practice**
     To align informal sanctions with legal principles (expiration, discharge), we'd need:
     - **Structural Changes**:
       - **Tech Design**: Platforms could auto-archive old posts (e.g., making >10-year-old content non-searchable). "Right to be forgotten" tools for non-public figures.
       - **Context Mechanisms**: Require archivers to link to subsequent apologies or evidence of growth alongside old screenshots (e.g., "context notes" on reshared content).
     - **Normative Shifts**:
       - **Rehabilitation Rituals**: Public, credible processes for amends (e.g., community service, education) that trigger "debt paid" norms.
       - **Expiration Conventions**: Social pressure to treat condemnation as resolved after a fixed period (e.g., 5 years) absent recidivism.
     - **Addressing Incentives**:
       - **Virality Economics**: Platforms profit from outrage. Solutions require algorithmic disincentives for resurfacing old content.
       - **Status Competition**: Callout culture often rewards the accuser. Elevate status for "redemption facilitators" (those who accept apologies).

  **The Core Obstacle**: The character-essentialist view is entrenched because it's psychologically easier. It simplifies moral judgment ("once bad, always bad") and fuels self-righteousness. Shifting to a deed-focused, time-limited model requires:
  - Accepting moral complexity (people change),
  - Trusting redemption narratives (risky in a low-trust society),
  - Tech that obscures the past rather than weaponizing it.

  **In Summary**: Online sanctions rest on unstated assumptions about fixed character and moral pollution. To reform them, we must challenge the metaphysics of the eternal self, design tools that enforce temporal boundaries, and create cultural rituals for discharge. The goal isn't to abolish accountability but to contain it within humane limits—recognizing that to treat people as capable of change is the bedrock of ethics itself. This isn't just about consistency with legal principles; it's about resisting a new digital feudalism where reputation is forever frozen.
