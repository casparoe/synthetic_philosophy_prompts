prompt: |-
  I have spent some years teaching an undergraduate course on causation, and each year I find that my own settled opinions on causation by omission are less settled than I pretend in the seminar room. I have written out my verdicts on a set of cases below, and I should like to know whether they trace to a single principled account, or whether they merely reflect a patchwork of duty, counterfactual dependence, and salience that will not knit together. I would ask you to reconstruct the principle, if there is one, tell me which of my verdicts it cannot accommodate, and say what it predicts on a case I have deliberately left unresolved.

  The cases, with my verdicts:

  1. A gardener is engaged and paid to water the plants while the owner travels; he never comes; the plants die. His omission caused their death.
  2. Several thousand other residents of the town, each physically able to walk over and water them, also never did. None of them caused the plants' death.
  3. A nurse forgets to administer a prescribed evening dose; the patient dies that night. The nurse's omission caused the death.
  4. A passing physician, fully competent to administer the same dose, notices the situation but walks on. He did not cause the death; he merely failed to prevent it.
  5. Two river-keepers are each responsible for opening a sluice gate after heavy rain; either gate alone would have drained the floodwater; both stay at home; the village floods. Both of their omissions caused the flood.
  6. An uncle promised to drive his eight-year-old nephew home from school, forgot, and the boy walked and was struck by a car. The uncle's forgetting caused the injuries.
  7. A neighbour had, without any promise or arrangement, driven the boy home every day for a term; one day she did not, for no reason at all; the boy walked and was struck. Here I find myself resisting the word 'cause', even though the counterfactual is exactly as in case 6, and I confess I cannot say why.

  I take cases 1 and 2 to be the sort of thing every theory must explain, and I take the pair 6 and 7 to be the pair I find hardest to reconcile: if the neighbour's omission did not cause the injuries, it is hard to see what beyond the promise does the work in case 6, and if the promise does that much work, I should like to know why duty attaches so much more causal weight than the settled, reasonable expectation the boy had in case 7 — a difference, I note, that would not exist in cases of positive action, where a promised push and a habitual push knock me over equally.

  So: is there one account — whether of counterfactuals restricted by norms, of default-deviation, of responsibility, or something else — that yields all seven verdicts? If not, which verdicts must be surrendered, and in what order? And please tell me what your best account says about the case I have been circling: a bystander sees a swimmer in difficulty, but another bystander is already calmly dialling the emergency services, and our bystander walks on; the call turns out to be a prank. Did the walker's omission cause the drowning? I genuinely do not know, and I should like your principled answer, not my unprincipled hesitation.
reasoning: |-
  Hmm, this is a fascinating philosophical puzzle about causation by omission. The user is an experienced philosophy professor teaching causation, struggling with consistent principles for omission cases. They've presented seven scenarios with their intuitive judgments and one unresolved case about a bystander.

  First I need to understand the core tension. The user accepts all their verdicts but worries they're inconsistent - particularly between cases 6 (uncle) and 7 (neighbor) where only the promise seems to make the difference. They're also troubled that this normative difference wouldn't exist in positive action cases.

  Looking at their judgments: Cases 1,3,5,6 involve omissions causing harm when there's a clear duty (contractual in 1, professional in 3, shared responsibility in 5, promise in 6). Cases 2,4,7 involve no causation despite physical ability because no duty exists (general public in 2, physician with no patient relationship in 4, neighbor with no promise in 7). 

  The river-keepers case (5) is interesting - both omissions cause because responsibility is shared and either could have prevented the harm. This suggests the principle isn't about exclusive responsibility.

  For the swimmer case: The walker has no duty since someone else was acting. Even though the action failed, the walker wasn't responsible. Their omission shouldn't be causal because: (1) no duty existed, (2) they reasonably believed prevention was occurring, (3) the actual cause was the prank call failure, not the walking away.

  The normative account seems to hold: causation by omission requires both counterfactual dependence and normative responsibility. This explains all cases: duties create "causal stations" that make certain omissions count as causes when harm counterfactually depends on them. Without such stations, we get mere "but-for" conditions (like the thousands of non-watering residents).

  This also resolves the uncle/neighbor puzzle: the promise creates a duty that makes the uncle's omission causal, while the neighbor's habit creates expectation but no obligation. The account preserves the intuition that positive actions don't require such normative filters because they actively introduce changes to the world.

  The swimmer case confirms this - no duty means no causation, regardless of outcome. The prank call is the relevant omission (if anyone's), not the walker's inaction.
answer: |-
  Your intuitions across these cases are remarkably consistent and point toward a **normatively constrained counterfactual account** of causation by omission. This view combines counterfactual dependence with normative roles or duties to distinguish true causes from mere conditions. Let's reconstruct the principle, test it against your verdicts, resolve the swimmer case, and identify any tensions.

  ---

  ### **The Reconstructed Principle**
  **An omission causes harm iff:**
  1. **Counterfactual Dependence**: The harm would not have occurred (or would have been substantially less likely) had the agent acted.
  2. **Normative Station**: The agent occupied a role, duty, or commitment that normatively required them to act.
  3. **Exclusive Preventative Capacity** (in multi-agent cases): The agent’s action would have sufficed to prevent the harm, and no other duty-bound agent’s action was reasonably expected to occur.

  This framework:
  - Rejects "salience" or "expectation" as standalone factors (addressing your case 7 worry).
  - Treats duties/promises as creating *causal relevance* for omissions, not just moral blame.
  - Explains why positive actions don’t require duties (they introduce new causal forces; omissions require normative context to "select" which inactions matter).

  ---

  ### **Testing Against Your Verdicts**
  | Case | Your Verdict | Principle’s Prediction | Consistency |
  |------|-------------|------------------------|------------|
  | 1. Gardener paid to water | Omission caused death | ✅ Duty + counterfactual dependence | ✔️ |
  | 2. Other residents didn’t water | No causation | ❌ No duty | ✔️ |
  | 3. Nurse forgot dose | Omission caused death | ✅ Professional duty + counterfactual | ✔️ |
  | 4. Physician walked by | No causation | ❌ No patient relationship → no duty | ✔️ |
  | 5. Two river-keepers omitted | Both caused flood | ✅ Shared duty + either sufficient | ✔️ |
  | 6. Uncle forgot promise | Omission caused injury | ✅ Promise created duty | ✔️ |
  | 7. Neighbor stopped driving | No causation | ❌ No duty/commitment | ❓ **Tension** |

  **The Tension in Case 7**: Your resistance stems from the *absence of a normative station*. The neighbor’s habit created expectation, but no promise/role obligated action. The principle denies causation here—yet you note unease. This is the core inconsistency: if the boy’s injury counterfactually depends on the neighbor’s inaction, why does duty matter? 

  **Resolution**: Duties transform omissions into *causal interventions*. Without duty, the omission is a background condition (like oxygen enabling fire). The neighbor’s inaction is a *necessary condition* but not a cause—just as the townsfolk’s inactions in (2) aren’t causes. The promise in (6) makes the uncle’s omission a salient "switch" in the causal network.

  ---

  ### **The Swimmer Case: Your Unresolved Example**
  > *A bystander sees a swimmer in difficulty, but another bystander is already calmly dialling emergency services. Our bystander walks on; the call turns out to be a prank. Did the walker's omission cause the drowning?*

  **Principled Answer**: **No**, the walker’s omission did not cause the drowning.  
  - **Counterfactual Dependence**: Had the walker acted, the drowning *might* have been prevented (satisfied).  
  - **Normative Station**: No duty exists—the walker is a mere bystander.  
  - **Exclusive Preventative Capacity**: Another agent was already acting (dialling), making intervention non-exclusive. The walker could reasonably assume prevention was underway.  

  **Cause of death**: The drowning was caused by:  
  - (a) The *prank caller’s positive action* (misleading rescuers),  
  - (b) The *omission of emergency services* (if they had a duty to respond),  
  - (c) Background conditions (e.g., the swimmer’s fatigue).  
  The walker’s inaction is a mere condition.

  ---

  ### **Diagnosis of Your Account**
  - **Strengths**: Your verdicts cohere with a normatively constrained counterfactualism. Duties "filter" which omissions count as causes. This avoids overcounting (cases 2,4,7) and handles shared responsibility (case 5).  
  - **Weakness**: Case 7 remains uneasy because *reasonable expectation* (without duty) *feels* causal. But if you concede causation here, you collapse cases 2/4/7 into inconsistency.  
  - **What Must Be Surrendered?**  
    - To be fully consistent, **deny causation in case 7** (despite discomfort).  
    - If you insist the neighbor *caused* harm, you must abandon the duty requirement—but then cases 2 and 4 become inexplicable.  

  **Recommendation**: Defend the principle and acknowledge that "cause" in omissions is a normative concept. This distinguishes it from metaphysics of positive causation (where a habitual push *is* causal, as you note). The discomfort in case 7 arises because norms feel arbitrary—but that’s a feature of social reality, not a bug in the theory.

  ---

  ### **Final Summary**
  - **Single Principle**: Yes—**normatively constrained counterfactual dependence**.  
  - **Outlier**: Case 7 is the price of consistency; surrender causation there.  
  - **Swimmer Case**: No causation by the walker.  

  This preserves the core insight: Omissions cause harm only when agents are "on the hook" to act. Your hesitation in case 7 reflects a deep truth—causation by omission is *inescapably normative*.
