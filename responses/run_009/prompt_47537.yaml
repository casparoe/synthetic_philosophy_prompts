prompt: |-
  I work in procurement at a mid-sized company, so every year I have to sit through the compliance training, and I've become weirdly obsessed with the lines those gift-and-bribery rules draw. The pattern I keep seeing, across companies and countries, goes roughly like this: gifts below some modest cap are fine; anything in cash or near-cash (gift cards, vouchers) is banned outright no matter how small; the same gift becomes way more suspiscious if it's given right before a tender decision than if it's given at Christmas; gifts have to be disclosed, not just kept under the cap; and there's a whole special-case culture around weddings, funerals and conference dinners that keeps expanding. My friend who works in development aid tells me that in a bunch of the countries her org operates in, giving presents to officials is just what you do, and yet the Western-style anti-corruption framework still treats a lot of that as corruption. So here's my actual question: what theory of what corruption *is* do these rules jointly presuppose? Is it that corruption is an exchange that distorts the official's role (so a gift is okay when it's too small or too ritualized to plausibly buy anything), or is it about hijacking reciprocity norms, or is the cash line based on some distinction between a gift and a payment? And honestly I suspect the rules don't presuppose any single coherent theory — maybe they're just risk-management kludges — in which case I'd like to know which parts of the practice are genuinely theory-loaded and which parts would look the same under several completely different views of corruption. It would also help if you could say what would have to change in the rules if you swapped the implicit view for one where corruption just means any undisclosed payment for services rendered (a more honest market view, basically) — would the cash ban even survive that?

  To make it easy to compare, please give me a table with these columns: "Feature of the rules" (one row each for: the cash ban, the dollar caps, timing sensitivity, the disclosure requirement, and the wedding/funeral carve-outs), "What it seems to presuppose" (the implicit view of gifts/corruption that best explains that feature), "Rival view it appears to rule out", and "Underdetermined?" (yes or no, plus one sentence on whether a different theory of corruption could still license that same feature). After the table, a short paragraph with your overall verdict on whether the practice rests on one theory or several, and finish with one sentence naming the single change to the rules that would most increase its philosophical coherence.
reasoning: |-
  Okay, let me unpack this procurement professional's fascinating question. They've clearly spent years observing the peculiar patterns in corporate compliance rules and want to understand the underlying philosophy. 

  First I notice their core puzzle: why do these rules treat identical gifts differently based on timing, form, and cultural context? Their observation about development aid practices clashing with Western frameworks suggests they're probing whether these rules reflect universal principles or cultural artifacts. 

  The table format they requested makes sense - it'll force me to dissect each rule feature systematically. But before building that, I need to map the implicit theories of corruption they're hinting at. There seem to be three competing lenses: 
  1) The "distortion theory" where gifts become corrupt when they risk swaying decisions 
  2) The "reciprocity theory" focusing on social obligations 
  3) The "market view" treating all undisclosed payments as corrupt

  Hmm... the cash ban is particularly telling. If corruption is about distorted decisions, why ban a $5 Starbucks card while allowing a $50 steak dinner? This suggests the rules prioritize preventing anything that resembles a salary supplement, implying officials should be "pure" fiduciaries. 

  The wedding/funeral exception is equally revealing. Allowing lavish gifts during life events while banning modest ones during tenders implies corruption isn't about the gift's value per se, but about whether it's embedded in social ritual. That points strongly to reciprocity norms being central. 

  For the disclosure requirement - that seems like a hedge. It doesn't fit neatly with either theory, which makes me suspect it's more about creating audit trails than philosophical consistency. 

  *scribbles mental note* Their suspicion about "risk-management kludges" feels spot-on. The rules behave like Swiss cheese - full of holes where practical realities bite. The development aid example proves one culture's bribe is another's courtesy. 

  When drafting the table, I'll need to show how some rules could survive theory-swapping (like timing sensitivity making sense under both distortion and reciprocity views) while others couldn't (the cash ban collapses under the market view). 

  Final verdict will be messy: these rules are theoretical mutts. But if forced to choose one coherence-boosting change? Gut says kill the cash exception - letting a $49 check slide while banning a $5 Amazon card is logically indefensible under any theory.
answer: |-
  Based on your observations, the rules reflect a complex, sometimes contradictory, set of assumptions about corruption. Below is the analysis in the requested table format, followed by the overall verdict and coherence suggestion.

  **Analysis of Anti-Corruption Gift Rules: Implicit Theories**

  | Feature of the rules       | What it seems to presuppose                                                                 | Rival view it appears to rule out                                           | Underdetermined?                                                                 |
  | :------------------------- | :------------------------------------------------------------------------------------------ | :-------------------------------------------------------------------------- | :------------------------------------------------------------------------------ |
  | **Cash ban**               | Corruption is inherently transactional. Cash/gift cards are "payment-like," creating an explicit quid pro quo that contaminates the fiduciary role. Gifts in kind are more ambiguous/relational. | A "market view" where *any* undisclosed payment (cash or not) is corrupt, or a view where form is irrelevant if intent is clear. | **No.** The cash ban uniquely presupposes that *form* determines corrupt potential. A market view would treat cash and non-cash gifts identically if undisclosed. |
  | **Dollar caps**            | Corruption is about *undue influence* distorting judgment. Below a threshold, gifts are presumed too small to influence decisions or create obligation. Focuses on the *capacity* of the gift to distort. | A strict deontological view where *any* gift creates an improper obligation, regardless of size, or a market view focused solely on disclosure. | **Partially.** While caps imply an "influence threshold," the *specific value* is arbitrary and culturally set. A strict "no gifts" view would reject caps entirely. |
  | **Timing sensitivity**     | Corruption is about *intent and context*. A gift proximate to a decision is presumed intended to influence that decision. Gifts at ritual times (Christmas) are presumed social/relationship-building. | A view where timing is irrelevant if the gift creates general indebtedness, or a market view focused solely on whether the gift is linked to a *specific* service. | **Yes.** Both the "undue influence" theory *and* a "reciprocity norm hijacking" theory support this distinction, as timing signals intent to exploit reciprocity for a specific gain. |
  | **Disclosure requirement** | Corruption thrives in secrecy. Disclosure enables oversight and shifts the burden: if the gift is truly harmless, declaring it shouldn't be a problem. Assumes sunlight is the best disinfectant. | A view where disclosure doesn't mitigate the inherent impropriety of the gift (e.g., strict deontological view), or a purely transactional market view where disclosure is irrelevant if the payment is "fair." | **Yes.** Disclosure serves multiple theories: it mitigates secrecy (common to most views), deters undue influence, and allows assessment of context/timing. Any theory valuing transparency would support it. |
  | **Wedding/funeral carve-outs** | Corruption norms are culturally embedded. Certain deeply ritualized gifts are "social facts" rather than transactional attempts, existing outside the commercial/professional sphere. Recognizes strong social norms override professional suspicion in specific contexts. | A strict universalist view where *all* gifts to officials are suspect regardless of cultural context, or a market view where ritual doesn't change the "payment" nature. | **No.** This strongly presupposes a "social ritual/social norm" theory where context defines meaning. A strict quid-pro-quo or market view struggles to justify large, targeted gifts purely based on ritual. |

  **Overall Verdict:**
  The rules demonstrably rest on **several intertwined, sometimes conflicting, theories of corruption**, rather than a single coherent one. The "dollar cap" and "timing sensitivity" features align best with an **"undue influence/distortion of fiduciary duty"** theory, aiming to prevent gifts from swaying objective judgment. The **"cash ban"** presupposes a **distinction between relational gifts and transactional payments**, leaning on social anthropology. The **"wedding/funeral carve-outs"** explicitly rely on **cultural anthropology and the power of ritual** to define social vs. corrupt exchanges. The **"disclosure requirement"** is the most theory-agnostic, serving primarily as a **practical risk-management tool** compatible with almost any view emphasizing transparency. This patchwork reflects real-world compromises between abstract principle, cultural practice, risk aversion, and enforceability.

  **Single Change for Increased Philosophical Coherence:**
  **Eliminate the absolute cash ban while drastically lowering the dollar cap for *all* gifts (including cash equivalents) and rigorously enforcing disclosure for anything above a nominal value (e.g., $10).** This would shift the framework towards a more consistent "undue influence + transparency" theory, removing the logically inconsistent special status of cash while maintaining strong safeguards against significant, potentially distorting gifts.
