prompt: |-
  I did a law degree before coming back to philosophy, and lately the contracts course I suffered through keeps colliding in my head with the Hume seminar I'm taking. Here is the collision. The common law's consideration doctrine says that a promise, simply as a promise, binds nobody: my solemn, witness-signed promise to give you my car next month is legally worthless, yet the same promise becomes enforceable the moment you hand me a peppercorn in exchange for it. Past benefits don't count as consideration, motives and affection don't count, but a purely nominal token does. Meanwhile promissory estoppel, in both its American Restatement form and its English form, lets courts enforce some bare promises, typically where the promisee relied on them, and some American courts have enforced promises to charities without much inquiry into reliance at all. So the practice seems to hold that a promise binds not because it is a promise but because of something that happens around it — an exchange, or reliance, or a created expectation. I want someone to reconstruct the implicit theory of promissory obligation here. Is the doctrine presupposing something like a Humean picture, on which the binding force of promises is an artificial convention generated by practices of exchange rather than any natural duty to keep one's word? Or is it closer to a reliance theory, on which the wrong done in breaking a promise is always a wrong to the action the promise induced, never a wrong in the mere breaking? And notice that the peppercorn seems to embarrass any of these readings, since the law apparently doesn't care whether the consideration has any value at all — which makes me suspect the doctrine may be compatible with several theories rather than genuinely presupposing one.

  There are some sharper questions I'd like answered too. Which rival theories of why promises bind does the practice quietly rule out — for example, the view that a promise creates an obligation simply qua promise, or views on which obligation arises from the communication and uptake of an intention rather than from exchange or reliance? Where exactly is the practice philosophically underdetermined, such that two very different accounts of promising would generate the same case outcomes, and where do the parts of the doctrine pull in different directions (the exchange logic of consideration sitting next to the reliance logic of estoppel, plus doctrines like contractual waiver that seem to rest on yet a third idea)? Finally, my contracts professor dismissed the whole question by saying the law just isn't in the business of enforcing the moral duty to keep promises, but I want to know whether that separation can really be maintained: if we rebuilt the doctrine on the presupposition that promises bind because they are promises — the way civil-law systems, which generally require no consideration, seem to — what concretely would have to change in the outcomes courts reach, and which current doctrines would become unexplainable? I'd be grateful for an answer that works through the actual shape of the practice rather than treating it as a free-floating intuition about promising.
reasoning: |-
  Okay, let me unpack this user's query. They're a philosophy student with a law background, noticing a collision between Hume's philosophy and contract law's consideration doctrine. The core question is about the implicit theory of promissory obligation in common law. 

  First, I need to map the doctrinal landscape they described: the peppercorn rule making nominal consideration sufficient, promissory estoppel based on reliance, and charity exceptions. The user wants to know if this reflects a Humean conventionalism or a reliance theory—or neither. 

  The peppercorn issue is particularly sticky. Why would the law accept a worthless token? That seems to undermine both exchange-based and reliance theories. Maybe it's about formalizing intent rather than value. 

  Then there's the professor's dismissal that law isn't about enforcing moral promises. But if civil law systems enforce bare promises, what would change in common law outcomes? Would donation promises suddenly become binding? Would estoppel cases disappear? 

  The user also asks where doctrine is philosophically underdetermined. Consideration and estoppel seem like different logics—one about bargains, the other about harm from reliance. Yet they coexist. That suggests no single theory explains everything. 

  I should analyze which theories the practice rules out. Plain intentionalism (promises bind because said) is clearly out—except in charity cases, which are weird outliers. Reliance theory explains estoppel but not peppercorns. 

  For the reconstruction, I'll propose a "formalized inducement" model: law enforces promises that trigger formal exchange patterns or detrimental reliance. The peppercorn is a ritualized trigger, not actual value. 

  Finally, if common law switched to civil law's approach, gratuitous promises might bind, consideration doctrine would collapse, and estoppel might shrink. But the user wants concrete outcome examples, like whether Aunt Maude's unrelied-upon car promise would suddenly be enforceable. 

  This feels like helping someone dissect a legal-philosophical chimera. Their contracts professor brushed it off, but the collision is real—the law's machinery reveals hidden assumptions about what makes words binding.
answer: |-
  Your collision course reveals profound tensions within contract law's philosophical scaffolding. Let's dissect the implicit theory of promissory obligation by mapping doctrine against philosophical models, identifying exclusions, underdetermined zones, and consequences of alternative presuppositions.

  ### Core Philosophical Models & Their Doctrinal Fit
  1.  **Humean Conventionalism (Promises as Artifacts of Exchange):**
      *   **Alignment:** The consideration doctrine is its clearest expression. The *ritual of exchange* (even nominal) transforms a moral utterance into a legal obligation. Past benefits ("moral debts") and affection are excluded precisely because they lack the *conventional form* of bargain.
      *   **Tension:** Promissory estoppel (PE) and charity enforcement (*Restatement (Second) § 90(2)*) defy pure exchange logic. Reliance or charitable purpose substitutes for the exchange ritual, suggesting the core is *social utility* (protecting induced action/expectations) rather than *ritual form* alone. The peppercorn isn't embarrassing here; it's the *minimal ritual signal* needed to trigger the convention.

  2.  **Reliance Theory (Obligation from Harmful Inducement):**
      *   **Alignment:** PE is its purest doctrinal incarnation. The wrong *is* the harm caused by reliance on the promise. Motive/affection remain irrelevant; only detrimental action matters.
      *   **Tension:** The peppercorn consideration and charity promises pose major problems. Enforcing a promise supported by nominal consideration *without any actual reliance* contradicts reliance theory. Similarly, enforcing charitable subscriptions *without proof of specific reliance* (*Restatement*) prioritizes expectation/commitment over demonstrable harm. Consideration doctrine often enforces executory exchanges *before* reliance occurs.

  3.  **Expectation Theory (Obligation from Created Expectations):**
      *   **Alignment:** Explains the "peppercorn problem": the *exchange form* creates a *reasonable expectation* of enforcement, regardless of value. It bridges consideration (exchange creates expectation) and PE (reliance evidences/fulfills expectation). Charity enforcement fits: the institution reasonably expects payment based on the promise.
      *   **Tension:** Doesn't fully explain why *only* exchange, reliance, or specific charitable contexts create legally cognizable expectations. Why exclude the heartfelt promise to a dying friend?

  4.  **Will Theory/Intentionalism (Obligation from the Promise *qua* Promise):**
      *   **Exclusion:** This is the primary theory *ruled out* by mainstream doctrine. The core principle of consideration explicitly rejects that a promise *itself*, however solemn or intentional, creates a legal obligation. Doctrine treats "mere" promises as morally binding but legally inert.
      *   **Tension Spot:** Charity enforcement *approaches* this, especially in US courts emphasizing the donor's *serious commitment* over specific institutional reliance. Waiver doctrines (voluntary relinquishment of a known right) also presuppose the *will* can alter legal relations *without* new consideration – a small crack in the edifice.

  ### Zones of Underdetermination & Tension
  1.  **The Peppercorn:** This is *highly* underdetermined. It's compatible with:
      *   **Humean Ritual:** The *form* of exchange matters, not substance.
      *   **Expectation Signaling:** The token objectively signifies serious intent to contract.
      *   **Evidentiary Proxy:** A historical relic proving the promise wasn't gratuitous.
      *   *Not* compatible with a robust reliance or value-based exchange theory.
  2.  **Consideration vs. Promissory Estoppel:** This is the major tension field:
      *   **Exchange Logic (Consideration):** Focuses on *reciprocity* and *bargained-for detriment*. Obligation arises from the *structure* of the agreement.
      *   **Reliance Logic (PE):** Focuses on *unilateral detrimental action* induced by the promise. Obligation arises from *consequences* of the promise.
      *   **Philosophical Dissonance:** These logics stem from fundamentally different premises (convention/reciprocity vs. harm/causation). Their coexistence makes contract law a hybrid system without a single philosophical foundation. Courts often struggle at the boundary (e.g., pre-contractual reliance).
  3.  **Charitable Subscriptions:** Deeply underdetermined. Enforcement can be justified by:
      *   **Public Policy Reliance (Loose):** Institutions *generally* rely on pledges.
      *   **Moral Commitment/Will:** The *seriousness* of the charitable pledge itself.
      *   **Quasi-Exchange:** Tax benefits, social recognition, or the "benefit" to the public.
      *   Doctrine doesn't consistently adopt one rationale, making it philosophically unstable.

  ### Rebuilding on "Promise *qua* Promise": Consequences
  Your professor's dismissal is partially correct but flawed. Law isn't *solely* enforcing morality, but its *current* doctrine actively *excludes* one specific moral view (intentionalism). Rebuilding on "promise *qua* promise" (like civil law *cause* or Germanic *abstract promise*) would radically alter outcomes:

  1.  **Gratuitous Promises Become Enforceable:** Aunt Maude's witnessed, signed promise of her car *would* be binding, even without the $1 you handed her. This eliminates the core function of consideration doctrine.
  2.  **Collapse of Nominal Consideration:** The peppercorn rule becomes nonsensical. If the *promise itself* binds, the token is irrelevant.
  3.  **Radical Transformation of Promissory Estoppel:**
      *   **Option 1 (Absorption):** PE becomes largely redundant. Reliance might still be relevant for *remedies* (e.g., reliance damages vs. expectation) but not for *formation* of the obligation, which exists from the promise.
      *   **Option 2 (Narrowing):** PE might persist only for *incomplete* promises or assurances inducing action *before* a formal promise is made (pre-contractual liability), but not for enforcing the promise itself.
  4.  **Unexplainable Doctrines:** Current doctrine becomes incoherent:
      *   **Consideration Requirement:** Its entire raison d'être vanishes. Why demand exchange if the promise binds by utterance?
      *   **Past Consideration Rule:** Excluding promises based on prior benefits makes *less* sense if promises generally bind. Gratitude might be a valid "cause."
      *   **Motive/Inequivalence Irrelevance:** If the *promise* binds, why exclude promises made from deep affection or where the value exchanged is grossly unequal? (Civil law often has separate doctrines for lesion/undue influence, but the *formation* hurdle is lower).
      *   **Charitable Enforcement Nuance:** The special rules for charities become harder to justify; all serious promises would be presumptively binding.
  5.  **Shift in Litigation Focus:** Courts would spend less time hunting for bargained-for exchange and more on:
      *   *Did a valid promise occur?* (Serious intent, certainty, communication).
      *   *Was it vitiated?* (Duress, fraud, incapacity, mistake).
      *   *What remedy is appropriate?* (Expectation vs. Reliance damages – the latter might dominate if the promise itself is seen as less inherently binding than a bargained exchange, but this is contested).

  ### Conclusion: A Hybrid Built on Exclusion
  The common law of promises **presupposes no single coherent theory** but **actively excludes the intentionalist view** that a promise *qua* promise is inherently binding. Its core practice is best described as **"formalized inducement"**:

  1.  **Inducement Focus:** The law enforces promises *that induce specific, socially recognized forms of action or expectation*: either a reciprocal exchange (formalized by consideration, however nominal) or detrimental reliance (protected via estoppel). Charity enforcement is a policy-driven exception acknowledging induced institutional planning/governance.
  2.  **Formalization:** The peppercorn is not an embarrassment but a symptom. It represents the *minimal formal signal* required to distinguish a legally cognizable inducement (a bargain) from a morally cognizable but legally inert one (a gift promise). It's a ritual threshold.
  3.  **Philosophical Tension:** The coexistence of consideration (Humean/Expectation) and estoppel (Reliance) creates an irresolvable core tension. Doctrine is underdetermined at the boundaries (peppercorn, charities) and at the intersection of these logics (pre-contractual reliance, waiver).

  Rebuilding on intentionalism wouldn't just add gratuitous promises; it would dismantle the central doctrinal structures (consideration) and force a fundamental re-conceptualization of others (estoppel), moving closer to civil law approaches where the *act of promising* itself creates a prima facie obligation, policed by vitiating factors rather than formation hurdles. The collision you perceive is real: contract doctrine embodies a pragmatic, socially contingent theory of obligation that deliberately sidelines a powerful philosophical intuition about the force of a bare promise.
