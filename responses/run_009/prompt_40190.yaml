prompt: |-
  Me and my desk partner D. had a massive argument last night and it's still bugging me, so I'm hoping you can settle it by turning it into something usable.

  Context: we're a two-person forecasting desk at a mid-size consultancy. Between us we put out maybe thirty probability calls a week — will this supplier miss the Q3 delivery, will that client's product launch slip, will the merger clear regulators — and each call has to end in an actual number. We get scored on calibration, so we know each other's track records by category. When our numbers are more than about 0.2 apart, our team lead makes us reconcile or at least write up why we didn't, so this comes up constantly.

  The argument: D. says he'll listen to my number but almost never move, because he trusts his own reasoning. Updating toward someone just because they also have a number is, in his words, letting other people do your thinking — and anyway half the time we've already talked through the evidence before giving numbers, so my opinion isn't independent information, it's just a reflection of stuff he already knows. I kept saying that if we're roughly as good as each other and we still disagree, surely the fair thing is meeting somewhere in the middle — assuming I'm the one who's right feels arrogant. He said meeting in the middle is also arrogant, its just arrogant toward both of us at once. We got nowhere and went to bed annoyed.

  So: can you take whatever the philosophy of disagreement literature actually says about peers who disagree and turn it into a procedure I can run in about ten minutes with no stats software? I want the questions in order — is he genuinely a peer on *this kind* of call or just on average; did we form our numbers before or after trading evidence; is his confidence itself evidence of something I'm missing; that sort of thing — with some idea of what counts as a good enough answer to each, when the procedure should spit out "split the difference," when it should say "hold your number," and when it has to hand the decision back to me because it's a value judgment no checklist can settle.

  Then run it on three cases:

  1. Supplier misses a Q3 delivery: I'm 0.7, he's 0.35. Our scored history says I'm slightly better calibrated on logistics generally, but he's clearly better on this supplier's home region.
  2. Client merges with its parent company by year-end: I'm 0.5, he's 0.25 — but we both read the same two analyst reports before giving numbers, so whatever "independence" we had is already compromised.
  3. One where the answer will probably annoy me: on hiring-market calls he's newer and worse calibrated, but he's far more confident, and I can never tell whether his certainty means he knows something I don't. If your procedure tells me to basically ignore him there, I want to hear why that isn't just me being smug.

  And please be honest about the weak links — like whether "checking peerhood" with track records is itself a judgment call dressed up as arithmetic, or wherever else you think it misfires.

  Please answer in British English.
reasoning: |-
  Okay, let me tackle this forecasting disagreement problem. The user and their desk partner D. are stuck in a philosophical argument about how to reconcile their probability estimates when they disagree. The core issue seems to be balancing independent judgment against peer input - a classic epistemic dilemma dressed in consultancy clothes.

  First, I need to unpack their argument properly. D.'s position is that updating toward another's number without new evidence is "letting others do your thinking", which has some merit if opinions aren't truly independent. But the user's point about averaging being less arrogant than assuming self-infallibility also resonates. The literature on peer disagreement (think Christensen, Feldman, Elga) would suggest neither extreme is quite right - it's about justified confidence and independence of evidence.

  For the practical solution, I'll design a decision tree that forces explicit consideration of key factors:
  - Peer calibration (not just overall but domain-specific)
  - Independence of evidence
  - Asymmetric confidence signals
  The challenge is making this usable within their 10-minute constraint while acknowledging where it remains subjective. The track record analysis bit is particularly tricky - past performance isn't always future-proof, especially for novel cases.

  For case 1 (supplier delivery): Their relative expertise is split - user better on logistics, D. better on regional factors. Since they likely shared evidence beforehand, independence is low. The procedure should probably lean toward holding positions unless they can pinpoint overlooked evidence.

  Case 2 (merger): Shared reports mean minimal independence. Without clear expertise imbalance, the literature would actually suggest minimal adjustment despite the gap. This might frustrate the user but reflects that aggregated opinions from same sources gain little new information.

  Case 3 (hiring market): Here's where it gets spicy. D.'s lower calibration but higher confidence creates tension. The key is recognizing that confidence alone isn't evidence - unless the user can identify what specific insight D. might have, they shouldn't defer. This isn't smugness; it's refusing to let bluster override track record.

  Throughout, I'll flag the wobblier parts: judging "true peerhood" is inherently subjective, and the independence assessment often relies on honest self-reporting. The procedure works best as a forcing function for reflection rather than algorithmic truth.
answer: |-
  Right then, let's turn that philosophical standoff into a usable ten-minute procedure. The core tension – respecting a peer's view without abandoning your own reasoned judgment – is well-trodden ground in epistemology (peer disagreement literature). The key insight is that **blind averaging is rarely optimal, but neither is total dismissal.** The procedure below forces explicit consideration of *why* the disagreement exists and whether either estimate *deserves* adjustment based on specific, relevant factors.

  **The Peer Disagreement Reconciliation Procedure (10-Minute Version)**

  1.  **Define the Question:** *"Are we answering precisely the same question?"* (5 seconds)
      *   *Good Enough Answer:* Quickly re-read the forecast definition. If yes, proceed. If any ambiguity ("miss delivery" vs. "miss by more than 2 weeks"), clarify and *re-state both numbers*. Crucial starting point.
      *   *Output:* Hold if ambiguous until clarified. Proceed if clear.

  2.  **Assess Peerhood on *This* Type:** *"Based on our scored calibration history, is one of us clearly more reliable *for forecasts of this specific type* (e.g., supplier deliveries in emerging markets, tech merger clearances), not just on average?"* (1 minute)
      *   *Good Enough Answer:* Check category scores if available. Look for significant differences (e.g., Brier score diff >0.05 over >20 similar forecasts). Acknowledge if it's a novel type with no direct history. Consider *why* one might be better (access, experience, cognitive style suited to the domain).
      *   *Output:*
          *   **Hold Your Number:** If *you* are clearly superior on this specific type.
          *   **Move Towards Theirs:** If *they* are clearly superior on this specific type.
          *   **Proceed:** If genuinely peers *on this type*, or if evidence is inconclusive/novel.

  3.  **Scrutinise Independence:** *"To what extent did we arrive at our numbers *before* sharing key evidence or reasoning? Did they mention something crucial I missed, or vice versa?"* (2 minutes)
      *   *Good Enough Answer:* Be brutally honest. Did you exchange reports, data points, or key arguments *before* locking in your number? If so, independence is low ("shared evidence base"). If you came in cold, heard their *number* but not their *reasoning*, or they mentioned a *new, specific, credible piece of evidence* you genuinely overlooked *after* you gave your number, independence is higher.
      *   *Output:*
          *   **Hold Your Number:** If evidence was shared beforehand *and* you've already considered it fully ("shared evidence base"). Their number adds little *new* information.
          *   **Move Significantly Towards Theirs:** If they presented a *new, specific, credible, and material* piece of evidence you genuinely missed *after* you gave your number. (Rare!).
          *   **Proceed:** If independence is partial or unclear (e.g., heard their number but not full reasoning before locking in).

  4.  **Interrogate Confidence & Reasoning:** *"Ignoring the number itself, is their *expressed confidence* or *line of reasoning* based on something tangible I might be underestimating? Or does mine reveal something they might be missing?"* (3 minutes)
      *   *Good Enough Answer:* Don't just listen to *what* their number is, but *why* they believe it so strongly (or weakly). Is their certainty backed by a specific insight, data point, or logical inference you haven't properly weighted? Does your own reasoning have a clear, strong anchor they seem to ignore? Ask: "What's the single strongest reason your number isn't higher/lower?" Focus on *specifics*, not vibes.
      *   *Output:*
          *   **Hold Your Number:** If their confidence feels like bluster, or stems from an argument you've already considered and rejected with good reason. If your own reasoning feels more robustly anchored.
          *   **Move Towards Theirs:** If their confidence highlights a *specific, credible* factor you genuinely underweighted or missed in your own estimate.
          *   **Split Difference (Conditional):** If both sides expose genuine, plausible blind spots in the *other's* reasoning, but neither side's core argument is clearly demolished. See Step 5.
          *   **Hand Back (Value Judgment):** If the core disagreement hinges on an unquantifiable difference in risk appetite, interpretation of ambiguous qualitative signals, or fundamental assumptions about how the world works that cannot be resolved with available evidence.

  5.  **Reconcile or Justify:** *"Given Steps 1-4, what action is justified?"* (3 minutes)
      *   *Output:*
          *   **Hold Your Number:** If (a) You are clearly superior *on this type*, OR (b) Evidence was shared beforehand and fully considered, OR (c) Their confidence/reasoning doesn't reveal a credible oversight on your part.
          *   **Move Towards Theirs:** If (a) They are clearly superior *on this type*, OR (b) They presented *new, credible, material* evidence you missed, OR (c) Their confidence/reasoning highlights a *specific, credible* factor you genuinely underweighted.
          *   **Split the Difference:** *Only* if (a) You are genuine peers *on this type*, *AND* (b) Evidence was *not* fully shared beforehand (some independence), *AND* (c) Steps 3 & 4 reveal plausible blind spots *on both sides* but no knockout argument, *AND* (d) The disagreement isn't rooted in a fundamental value judgment. *This is rarer than you think.*
          *   **Hand Back (Value Judgment):** If the core of the disagreement is unresolvable with available evidence (e.g., "How much weight does *this* regulator's past leniency get?" vs. "How damaging is *that* whistleblower rumour?" when both points are acknowledged but weighted wildly differently). Write this up clearly for the team lead.

  **Weak Links Acknowledged Upfront:**

  *   **"Peerhood" is Messy:** Judging "superior on *this* type" based on past scores is inherently probabilistic and imperfect. Past performance isn't *always* indicative, especially for novel events. It *is* the best objective data you have, but treat it as suggestive, not absolute proof. This step *is* judgment dressed as arithmetic.
  *   **"Independence" is Slippery:** Truly independent opinions are rare in close collaboration. "Did we share evidence beforehand?" is binary, but the *degree* of influence is a spectrum. Be honest with yourselves.
  *   **Confidence != Correctness:** This is the biggest trap. High confidence can stem from expertise *or* overconfidence, ignorance, or stubbornness. Step 4 forces looking for the *specific reason* behind the confidence. If no tangible reason emerges, discount it.
  *   **"Blind Spots" are Subjective:** Identifying if the *other* person has a plausible point you missed involves introspection and humility. It's easy to dismiss.

  **Running the Cases (British English):**

  1.  **Supplier Misses Q3 Delivery (You: 0.7, D.: 0.35)**
      *   **Step 1:** Clear question? Assume yes. Proceed.
      *   **Step 2:** **Peerhood:** Mixed signals. You edge logistics generally, he edges the region. No *clear* superiority. **Proceed.**
      *   **Step 3:** **Independence:** You almost certainly discussed evidence beforehand (standard practice). **Shared evidence base likely.** Output: **Hold Your Number** (strong lean).
      *   **Step 4:** **Confidence/Reasoning:** Did he cite a *specific, new* regional factor you downplayed? If yes, perhaps a *small* move towards his view (e.g., 0.65). If it's just rehashing known regional risks you weighted differently, **Hold Your Number**.
      *   **Step 5:** Likely **Hold Your Number** or very small move. Significant split unlikely justified. Reconciliation means explaining *why* you weight the factors differently despite shared evidence. Write-up focuses on differing risk assessments of known information.

  2.  **Client Merges with Parent (You: 0.5, D.: 0.25)**
      *   **Step 1:** Clear question? Assume yes. Proceed.
      *   **Step 2:** **Peerhood:** No specific category dominance mentioned? Assume peers. **Proceed.**
      *   **Step 3:** **Independence:** **Explicitly compromised.** Read the *same two reports* beforehand. Utterly shared evidence base. **Output: Hold Your Number**.
      *   **Step 4:** **Confidence/Reasoning:** Does his 0.25 hinge on a *specific, damning* sentence in the reports you think is insignificant? Or is it just general pessimism? If the former, discuss *why* interpretations differ – but it's unlikely to warrant a full move. **Output: Hold Your Number**.
      *   **Step 5:** **Hold Your Number.** Averaging to ~0.38 would be "arrogant towards both" – pretending the shared evidence magically generates new information through disagreement. Write-up: "After reviewing identical source material (Reports X & Y), we reach differing probability assessments based on interpretation weightings. No new evidence exchanged post-initial estimate."

  3.  **Hiring-Market Call (D. newer, worse calibrated, but very confident)**
      *   **Step 1:** Clear question? Assume yes. Proceed.
      *   **Step 2:** **Peerhood:** **You are clearly superior.** History shows better calibration on hiring-market calls. **Output: Hold Your Number (Strong Lean - based on data).**
      *   **Step 3:** **Independence:** Assess as per usual practice. If evidence shared beforehand? **Output: Likely reinforces Hold.**
      *   **Step 4:** **Confidence/Reasoning:** **Crucial Step.** *Why* is he so confident? Does he name a *specific* data source, insider rumour, or logical inference about hiring trends you haven't considered? Or is it "just a feeling" or "obvious"? If he provides a *specific, credible* point you genuinely missed ("Ah, I didn't see that new LinkedIn jobs report for that sector!"), then a **small move towards his view** *might* be justified. If it's vague bravado or re-stating known points, **discount it entirely. Output: Hold Your Number.**
      *   **Step 5:** **Overwhelmingly likely: Hold Your Number.** Why isn't this smug?
          *   **Data Wins:** His track record on *this type* is objectively worse. Confidence absent supporting data or superior reasoning isn't evidence; it's noise.
          *   **Burden of Proof:** The onus is on the less-calibrated forecaster to provide *specific, new, compelling* reasons to override the better-calibrated one. Vague certainty doesn't meet that bar.
          *   **Not Personal:** It's about the *quality of the estimate*, not the person. If *you* were the poorly calibrated one spouting certainty, the procedure should tell *him* to hold his number too. It's the *track record and reasoning* that matter.
          *   **Write-up:** "Disagreement persists. [Your Name] maintains [X] based on [brief reason], noting stronger historical calibration on this forecast type. [D.'s Name] maintains [Y] based on [brief reason]. Reconciliation not reached due to differing weightings of evidence [or lack of new evidence post-initial estimate]."

  **Final Thought:** This procedure won't eliminate arguments, but it forces them onto more productive ground: *specific evidence, specific reasoning, and specific domain expertise.* It replaces "meet in the middle" or "I'm right" with "Does this *specific* factor justify a move?" and "Is there a *tangible* reason to override the track record?". That’s progress. Good luck with D. – maybe frame it as a joint experiment to improve the *desk's* overall calibration score? That usually focuses the mind.
