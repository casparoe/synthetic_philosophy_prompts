  - **Inconsistency in Case 3**: Your WTP of \(\$31\) (vs. \(\$30\) for Case 2) suggests a psychological \(\$1\) tail valuation. The principle ignores tails, so it predicts \(\$30\). **Recommendation**: Adjust to \(\$30\) for consistency.  
