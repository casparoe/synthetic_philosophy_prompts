prompt: |-
  I'm a journalist who covers science and ideas, and I'm working on a feature about whether culture really evolves in a Darwinian way. Ever since Dawkins coined the word meme in The Selfish Gene, the idea has lived a double life — pop cliché on one side, serious research program on the other — and most coverage I see just repeats "ideas compete, like genes." I want to show readers what the actual technical dispute looks like.

  You're a philosopher of biology. Think carefully before writing — brainstorm the strongest points each side can make, so neither one is a strawman — then write a dialogue between two researchers. One defends the Darwinian view of culture: differential retention of variants, competition for finite attention, and the point that even partial-fidelity copying plus selection still beats no selection at all. The other is a skeptic, and she should press on the in-the-weeds stuff the textbook treatment skips: that most cultural transmission isn't high-fidelity copying but reconstruction, where each recall and retelling is a rebuild and what stays stable is not the token that got copied but whatever cognitive biases keep pulling reconstructions back toward the same attractor — so the fidelity Darwinism needs is supplied by minds, not replication; that in culture, mutations are often directed, since people deliberately improve what they pass on, which is basically Lamarckian; and that blending inheritance — each kid averaging what they learn from many models — may keep cultural lineages from staying discrete the way species do, so talk of memetic lineages might be a metaphor doing all the work. Dont let the defender just absorb punches — she gets real replies, maybe even wins some exchanges — and make them respond to each other's actual points rather than talking past each other. End it in a realistic, unresolved place.

  Keep the dialogue to roughly 700 words. Then, as the very last line, state your one-sentence takeaway in exactly this form: \summary{...}, saying which position held up better in the exchange and why.
