  ## THE CHRONICLE STYLE SUPPLEMENT: VOL. XXIII, ISSUE 7 (INTERNAL USE ONLY)

  **MEMORANDUM:** Effective immediately, all newsroom personnel must adhere to the revised language protocols outlined below. These updates reflect our commitment to conceptual precision and alignment with contemporary scientific understanding. – *Office of the Editor-in-Chief*

  **1. Believes, Believe In:** Prohibited. These terms invoke the discredited theoretical construct "belief," a putative internal state causally linked to behavior, analogous to "phlogiston" or "demonological influence." Replace with descriptions of measurable neural activity, behavioral dispositions, or environmental stimuli.
  *   *Incorrect:* "The Mayor *believes* the new policy will reduce crime."
  *   *Correct:* "The Mayor's vocal apparatus produced statements consistent with historical data patterns associated with reduced crime rates following similar policy implementations," or "Mayoral neuroactivity in regions X and Y coincided with policy announcement."
  *   *Note:* While resulting copy may initially appear cumbersome, clarity is secondary to ontological accuracy. Future neuroimaging access will streamline reporting.

  **2. Wants, Desires:** Prohibited. These imply a non-existent "desire state" directing action. Describe observable goal-directed behavior, stimulus conditions, or inferred reward-system activation.
  *   *Incorrect:* "Residents *want* faster internet."
  *   *Correct:* "Residents submitted 1,247 service upgrade requests," or "Residents exhibited operant behaviors previously reinforced by increased bandwidth," or "Residents displayed heightened amygdala activity when presented with low-bandwidth scenarios."

  **3. Hopes:** Prohibited. "Hope" is a complex, empirically unverified folk-psychological amalgam typically involving flawed prediction and affective states. Describe predictive statements qualified by acknowledged uncertainty or associated positive valence indicators.
  *   *Incorrect:* "The team *hopes* to win the championship."
  *   *Correct:* "Team members produced verbal predictions of championship victory concurrent with pupil dilation and elevated serotonin metabolites," or "Team members engaged in championship-oriented preparation behaviors."

  **4. Expects:** **Permitted, with caution.** "Expects" primarily denotes a predictive neural state based on pattern recognition, possessing marginally greater empirical grounding than "belief" or "desire." It may be used where a straightforward prediction is reported, absent strong affective connotations.
  *   *Permitted:* "Analysts *expect* market volatility." (Implies pattern-based forecast).
  *   *Still Prohibited:* "She *expects* him to change." (Implies unwarranted folk-psychological causality).

  **5. Intends:** Prohibited. "Intention" posits a mysterious, causally potent mental blueprint. Describe specific planned actions or preparatory behaviors.
  *   *Incorrect:* "The company *intends* to launch the product next quarter."
  *   *Correct:* "The company has allocated funds, hired personnel, and scheduled a product launch event for next quarter."

  **6. Folk Psychology:** Avoid except in historical or critical contexts (e.g., "the discredited framework of folk psychology"). Do not use it as a neutral descriptor for everyday explanations of behavior. It is a *failed theory*, akin to geocentrism, not a neutral perspective. When referencing everyday explanations, use terms like "pre-scientific behavioral interpretation schema."

  **7. Mental States (e.g., "angry," "happy," "confused"):** Use sparingly and only as shorthand for complex neurophysiological and behavioral profiles. Always prefer specific descriptions:
  *   *Incorrect:* "The witness was *confused*."
  *   *Correct:* "The witness exhibited inconsistent recall, reduced galvanic skin response coherence, and elevated theta wave activity during questioning."

  **8. "As If" Constructions (e.g., "He acted as if he believed..."):** Prohibited. This covertly reintroduces the prohibited concept by implying it *should* be present. Describe the behavior directly without the folk-psychological comparison.

  **9. Instrumentalism ("Harmless Shorthand"):** Reject appeals to retain prohibited terms for convenience or readability (e.g., "like 'sunrise'"). "Sunrise" describes an *observation* relative to a frame of reference. "Belief" posits a *causal entity* for which no referent exists, actively obscuring the true (neural) mechanisms. Linguistic convenience perpetuates ontological error. Precision is non-negotiable.

  **10. Exemption – Horoscope Section:** After review, an exemption is granted for the Astrological Forecast feature. The Editor-in-Chief reluctantly acknowledges that the section's core premise relies entirely on folk-psychological interpretation ("Gemini *will feel* inspired...", "Capricorn *should believe..._"). Attempting neurocomputational paraphrases ("Gemini may exhibit dopamine fluctuations associated with novelty-seeking...") fundamentally undermines the feature's commercial and entertainment purpose. Therefore, traditional folk-psychological language is permitted *exclusively* within the designated horoscope boundaries. This is a pragmatic concession to audience expectation and revenue, *not* an endorsement of astrological or folk-psychological validity.

