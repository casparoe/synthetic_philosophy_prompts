  Below is a practical, step-by-step decision procedure designed to handle voting in your committee while complying with university rules and avoiding the discursive dilemma. It prioritizes efficiency, minimizes meta-discussion, and ensures consistency. The procedure assumes a 5-member committee (you vote only to break ties) and uses "research," "teaching," and "service" as the criteria. Key features:
  - **Binary votes only**: Each criterion and the overall vote are yes/no (meets/does not meet; positive/negative).
  - **Constraint enforcement**: The overall vote must align with the criteria votes (all criteria met → positive; one or more not met → negative).
  - **Efficiency**: Uses a preliminary vote to "test" consistency before recording, avoiding re-votes.
  - **Chair's role**: You enforce rules, break ties, and intervene only when necessary.

  ---

  ### **Decision Procedure for Committee Meetings**
  **Goal**: Record votes on criteria (research, teaching, service) and overall recommendation such that the overall follows logically from the criteria (e.g., if all criteria are met, overall must be positive).  
  **Time Budget**: ≤5 minutes per candidate.

  #### **Step 1: Preliminary Secret Ballot (1 minute)**
  - **What to say**: "We will start with a preliminary, non-binding vote on the overall recommendation. This is confidential and helps us test for consistency. Vote only 'positive' or 'negative' for promotion."
  - **Process**: 
    - Members write votes on paper; you collect and count.
    - Result: 
      - If unanimous (5-0 or 0-5), skip to Step 3 (no risk of inconsistency).
      - If non-unanimous (e.g., 3-2), proceed to Step 2.
  - **Why**: Detects potential inconsistencies early without recording them.

  #### **Step 2: Vote on Criteria (2 minutes)**
  - **What to say**: "We will now record votes on each criterion. Vote 'yes' if the candidate meets the standard, 'no' if not. Remember: if all criteria are met, university rules force an overall positive; if any criterion fails, overall must be negative."
  - **Process**:
    - Vote on research, teaching, and service sequentially (record votes publicly).
    - For ties (2-2), you break the tie (your vote decides).
    - Compute the **logical overall (L)**:
      - L = positive if all criteria have ≥3 "yes" votes.
      - L = negative if any criterion has ≥3 "no" votes.
  - **Critical Check**:  
    - If the preliminary vote (Step 1) matches L, proceed to Step 3.  
    - If they conflict (e.g., preliminary overall = negative but L = positive), say:  
      > "The criteria votes imply a [positive/negative] recommendation, but our preliminary vote was [negative/positive]. To comply with university rules, we must align the final overall vote with the criteria. We will now vote on the overall with this constraint."

  #### **Step 3: Record Overall Vote (1 minute)**
  - **What to say**: "Based on the criteria votes, the overall recommendation must be [L]. We will now record the final vote on the overall. I remind you: a 'positive' overall requires all criteria met; a 'negative' requires at least one unmet."
  - **Process**:
    - Hold recorded vote.
    - If the vote matches L, accept the package.
    - If it conflicts (e.g., L = positive but vote = negative), say:  
      > "This vote conflicts with the criteria. University rules require consistency. We will re-vote on the overall once to resolve this."
      - Hold one re-vote. If still inconsistent, override:  
        > "After two votes, the overall remains inconsistent. To comply with rules, I set the overall to [L]. This is recorded as a chair override due to procedural necessity."

  #### **Step 4: Handle Borderline Cases (During Criteria Votes)**
  - **What to say (if a member calls a criterion 'borderline')**:  
    > "The standard is binary: 'meets' or 'does not meet.' If you believe it meets the threshold, vote 'yes'; if not, 'no.' Interpret 'meets' as 'sufficient for promotion' per our faculty guidelines."
  - **Process**: No special rules. Borderline judgments are resolved by majority vote.

  #### **When to Stop for Committee Judgment**
  - Only two points require committee input (not logic):
    1. **Tie-breaking on criteria**: If a criterion is tied (2-2), you break it. No discussion.
    2. **Override justification**: If you override the overall vote (Step 3), note:  
       > "This override is procedural, not substantive. It enforces university rules."

  ---

  ### **Procedure in Action: Three Test Cases**
  #### **Case 1: Discursive Dilemma (Resolves in a Direction You Dislike)**
  - **Preliminary overall vote**: 3 negative, 2 positive → negative.  
  - **Criteria votes**:  
    - Research: 3 yes → meets.  
    - Teaching: 3 yes → meets.  
    - Service: 3 yes → meets.  
    → L = positive (all met).  
  - **Conflict**: Preliminary overall (negative) ≠ L (positive).  
  - **Overall vote**:  
    - First vote: 3 negative, 2 positive → negative (conflicts with L).  
    - Re-vote: 3 negative, 2 positive → still negative.  
  - **Chair action**: Override to positive.  
  - **Outcome**: Package recorded as: criteria all met, overall positive.  
  - **Why you dislike it**: You agree with the negative majority, but rules force positivity.  
  - **Procedure’s role**: Prevents arbitrary re-votes; enforces rules transparently.

  #### **Case 2: Member Votes Against Sincere Judgment**
  - **Scenario**: A member thinks research meets the standard but votes "no" to force L = negative (aligning with her desired negative overall).  
  - **Process**:  
    - Criteria votes: Research has 2 yes, 3 no → does not meet.  
    - L = negative (research not met).  
    - Overall vote: Negative (consistent).  
  - **Should the procedure tolerate this?** Yes.  
    - **Why**: The vote is secret/recorded; members may vote strategically. The procedure ensures consistency, not sincerity. Your role is procedural, not ethical.  
  - **Post-meeting note**: If appealed, the record shows the vote; you need not justify members' reasoning.

  #### **Case 3: Borderline Criterion**
  - **Scenario**: Research is borderline (3 members say "meets," 2 say "does not meet").  
  - **Process**:  
    - Research vote: 3 yes → meets.  
    - Other criteria met.  
    - L = positive.  
    - Overall vote: Positive (consistent).  
  - **Handling**: No special treatment. Borderline issues are resolved by majority vote.  
  - **Chair script**:  
    > "The vote is 3-2: research meets. We proceed."

  ---

  ### **What the Procedure Cannot Do**
  1. **Eliminate strategic voting**:  
     - Members may vote against their judgment on criteria to manipulate L.  
     - **When it misfires**: If detected (e.g., a member admits it), say:  
       > "Votes are final once recorded. Strategic voting is a choice, not a procedural flaw. We follow the votes as cast."

  2. **Override substantive disagreements**:  
     - If criteria votes force an overall outcome the committee dislikes (Case 1), the procedure cannot side with "true" judgment.  
     - **When it misfires**: Say:  
       > "The rules bind us to the criteria. If we dislike the outcome, we must revisit how we vote on criteria, not the procedure."

  3. **Handle abstentions or nuanced standards**:  
     - Votes are binary; abstentions not allowed. "Degree-based" judgments (e.g., "mostly meets") must be binary.  
     - **When it misfires**: Say:  
       > "The standard is binary. If you cannot decide, vote based on whether it clears the promotion threshold."

  4. **Prevent all overrides**:  
     - If two overall votes conflict with L, override is mandatory.  
     - **Justification for your signature**:  
       > "I overrode to comply with university rules. The criteria votes left no alternative."

  ---

  ### **Final Script for Chair**
  Use this script to open each candidate discussion:  
  > "For this candidate, we will:  
  > 1. Take a preliminary, confidential overall vote.  
  > 2. Record votes on research, teaching, and service.  
  > 3. Record the final overall vote, which must align with the criteria.  
  > We have 4 minutes. Let’s begin."  

  This procedure resolves inconsistencies before they hit the record, minimizes re-votes, and ensures compliance. It accepts that logic may override judgment—but that’s the price of consistent rules.
