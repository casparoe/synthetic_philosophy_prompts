prompt: |-
  I'm a lay member of the committee that adjudicates disciplinary cases at a state board of nursing licensure. We hear roughly forty cases a year in which a nurse is alleged to have done something wrong — documenting a medication she didn't actually witness, overriding a safety protocol, sharing a patient's information with someone who turned out not to be authorized — and the sanctions range from a written reprimand to revocation of the license. A hearing lasts one afternoon, we have a staff attorney but no philosopher, and the nurse's livelihood is on the line, so the stakes are high and the time is short.

  More and more, the defense we hear is some version of "I couldn't have done otherwise": the unit was short-staffed and following protocol was physically impossible in the time available; my supervisor told me to falsify the chart or be fired; my ex-partner, who had threatened me, demanded I take the medication from the cabinet; I was in acute withdrawal and not in control. Half the committee thinks that if there genuinely was no permissible alternative, responsibility goes out the window. The other half thinks the nurse did the wrong thing regardless of what the alternatives were, and that excusing her punishes the colleague who reported it. We keep splitting these cases on vibes, and I want better than vibes.

  Some years ago I read about the so-called Frankfurt cases in philosophy, and they seem to bear directly on our problem. As I understand the classic shape of it: someone performs a wrongful act entirely for her own reasons, while an intervener — in the thought experiments, a neuroscientist with electrodes implanted — stands ready to force her to do it if she shows any sign of wavering. She never wavers, the intervener never acts, and yet many people's intuition is that she's responsible even though she couldn't have done otherwise. The suggestion is that what matters for responsibility isn't the availability of alternatives but whether the actual explanation of the act runs through the agent or through the thing that removed the alternatives. I also gather there's a well-known objection — something like: if she was never going to waver, you can't tell a story about what she would have done if she'd tried, so the thought experiment never really removes the alternatives it claims to remove — and I don't know whether the objection defeats the cases or not.

  What I want from you is a decision procedure the committee could actually run on a "no alternative" defense: an ordered list of questions to ask, what counts as a sufficient answer to each, which answers end the inquiry with no discipline and which end it with full discipline, and which points hand the decision back to the committee because the question is one of values rather than facts. The conceptual core should be the Frankfurtian one — distinguishing cases where the constraint explains the wrongdoing from cases where the constraint was mere backdrop and the agent's own reasons did the work — but translated into questions a non-philosopher can ask a witness under oath. Then run the procedure on three cases we actually face: a nurse who falsified intake times under a supervisor's explicit threat of termination; a nurse who diverted opioids while being coerced by an abusive partner; and a nurse who says short-staffing left no compliant option for a medication-error reporting deadline, where I suspect the procedure will return an answer the majority of my committee won't like. Tell me where the procedure will misfire.

  Two requests about how you present it. First, wherever the procedure depends on a philosophical claim that specialists still argue about — including the question of whether Frankfurt-style cases succeed at all, given the objection I mentioned — say so explicitly and mark the branch of the procedure that rests on it, rather than building the whole thing on a contested reading presented as settled. Second, tell me plainly which steps of the procedure are real tests and which are judgment calls dressed up as procedure, since we'll be handing this to committee members who will follow it literally.
reasoning: |-
  Okay, let me approach this systematically. The user is a disciplinary committee member facing real-life cases where nurses claim they "couldn't have done otherwise," and they need a practical decision framework rooted in Frankfurt-case philosophy but operationalized for non-philosophers. 

  First, I need to unpack the core tension: half the committee focuses on alternative possibilities (AP), half on the act's moral quality regardless of alternatives. The Frankfurt intuition suggests responsibility persists without AP if the act flows from the agent's own reasons. But the "flicker of freedom" objection complicates this - can we truly remove alternatives if the agent never wavered?

  For translation into questions, I consider structuring around three pillars: 
  1) Presence of constraint (factual) 
  2) Constraint's causal role (did it force the act?) 
  3) Quality of agency (was the nurse's reasoning intact?)

  Each branch needs clear thresholds: when does a threat become coercive? How do we distinguish "my hand was forced" from "I chose the easy way out"? The abusive partner case illustrates this - the coercion must override agency, not just motivate. 

  I anticipate committee pushback on the staffing-shortage case. Here the framework might conclude the nurse had minimal but existent alternatives (late report vs violation), making responsibility hard to evade. This clashes with "vibes" excusing systemic failures. I should flag this as a values conflict point.

  For the philosophical dependencies:
  - The entire Constraint→Act pathway assumes Frankfurt cases work (contested)
  - The "no permissible alternative" definition involves normative judgment
  - Delineating "broken agency" (e.g., withdrawal) relies on theories of compulsion

  The procedure will misfire when: 
  - Nurses mask poor judgment as constraint ("I had to falsify because we were busy") 
  - Systemic pressures blur coercion/resignation 
  - Cultural differences affect "reasonable belief" assessments

  Most critically, steps 5-7 are judgment calls disguised as tests. The "would a reasonable nurse...?" question imports unspoken committee biases. I'll explicitly mark these as value judgments requiring deliberation.
answer: |-
  Here's a disciplined decision procedure for "no alternative" defenses, grounded in Frankfurtian concepts but operationalized for non-philosophers. **Bold terms** are defined in the glossary. Philosophical dependencies are explicitly marked (Φ), and judgment calls are identified (✓).

  ---

  ### **DECISION PROCEDURE: "NO ALTERNATIVE" DEFENSE**
  **Glossary**  
  - **Constraint**: External pressure (threat, resource shortage, coercion).  
  - **Agent’s own reasons**: Nurse’s personal motives, values, or choices.  
  - **Broken agency**: Severe impairment (e.g., acute withdrawal, psychosis).  
  - **Permissible alternative**: A course of action complying with nursing standards.  

  #### **Ordered Questions & Thresholds**
  1. **Was there a constraint?**  
     - *Sufficient answer:* Credible evidence of threat, coercion, or systemic failure (e.g., staffing at 30% below safe levels).  
     - *Ends inquiry if NO* → Sanction appropriate (barring other defenses).  
     - *Judgment call (✓):* Assessing credibility of evidence.  

  2. **Did the constraint DIRECTLY CAUSE the violation?**  
     - *Ask:* "Would a reasonable nurse *with this constraint* have seen **no permissible alternative** to the violation?"  
       - *Example:* "Was falsifying the *only way* to avoid immediate physical harm?"  
     - *Sufficient "YES"*: Coercion with imminent threat (e.g., "Falsify or I’ll break your arm now").  
     - *Sufficient "NO"*: Constraint existed but alternatives were available (e.g., reporting threat to authorities).  
     - *Hands back if UNCLEAR* → Proceed to Q3.  
     - *Φ-Dependency:* Assumes Frankfurt’s "causal explanation" model.  

  3. **Was the nurse’s agency BROKEN?**  
     - *Sufficient "YES"*: Medical evidence of incapacity (e.g., toxicology report confirming acute impairment).  
     - *Sufficient "NO"*: Nurse understood consequences and made a choice (e.g., "I knew it was wrong but did it anyway").  
     - *Ends inquiry if YES* → No sanction (refer to treatment).  

  4. **Did the nurse act for THEIR OWN REASONS?**  
     - *Ask:* "If the constraint vanished, would the nurse STILL have chosen the violation?"  
       - *Evidence:* Prior similar violations, statements showing alignment with the act (e.g., "I thought charting was pointless").  
     - *Sufficient "YES"* → Sanction appropriate (constraint was backdrop, not cause).  
     - *Sufficient "NO"* → No sanction (constraint overrode agency).  
     - *Φ-Dependency:* Core Frankfurtian claim; assumes responsibility hinges on reasons, not alternatives.  

  5. **Was there a REASONABLE PERMISSIBLE ALTERNATIVE?**  
     - *Ask:* "Could a reasonable nurse have taken a compliant path *without unreasonable harm*?"  
       - *Example:* Reporting supervisor to the board vs. falsifying records.  
     - *Sufficient "NO"* → No sanction (genuine dilemma).  
     - *Sufficient "YES"* → Sanction appropriate (nurse chose wrong over hard right).  
     - *Judgment call (✓):* Defining "unreasonable harm" (e.g., job loss vs. physical safety).  

  ---

  ### **APPLICATION TO CASES**
  #### **Case 1: Falsified intake times under supervisor’s threat**  
  - Q1: **YES** (threat of termination).  
  - Q2: **NO** → Alternatives existed (e.g., document refusal, report to compliance).  
  - Q3: **NO** (agency intact).  
  - Q4: **Likely YES** → Nurse acted to keep job (own reason).  
  - *Outcome:* **Sanction** (violation explained by nurse’s choice, not constraint).  

  #### **Case 2: Diverted opioids under partner’s coercion**  
  - Q1: **YES** (abusive threat).  
  - Q2: **YES** → If threat was "Hand over drugs or I’ll attack you *now*," no permissible alternative.  
  - Q3: **NO** (assuming no impairment).  
  - Q4: **NO** → Nurse wouldn’t divert if threat vanished.  
  - *Outcome:* **No sanction** (constraint caused act; reasons weren’t "own").  

  #### **Case 3: Missed error deadline due to short-staffing**  
  - Q1: **YES** (documented understaffing).  
  - Q2: **NO** → Alternatives existed (e.g., late report with explanation).  
  - Q3: **NO** (agency intact).  
  - Q4: **Likely YES** → Nurse prioritized efficiency over protocol (own reason).  
  - Q5: **YES** → Reporting late was a permissible alternative.  
  - *Outcome:* **Sanction** (constraint didn’t force violation; nurse chose non-compliance).  
  - *Committee friction:* Majority may see this as "punishing victims of systemic failure," but procedure treats it as a choice.  

  ---

  ### **WHERE THE PROCEDURE MISFIRES**  
  1. **"Flicker of freedom" objection (Φ):** If a nurse *almost* wavered (e.g., considered reporting but feared backlash), Frankfurt’s "no alternative" claim collapses. Procedure assumes Q4 is answerable.  
  2. **Broken agency gray zones:** Withdrawal symptoms vs. addiction—Q3 requires medical expertise the committee lacks.  
  3. **Cultural bias in "reasonable nurse":** Q2/Q5 may disadvantage nurses from hierarchical cultures where defying authority is unthinkable.  
  4. **Punishing systemic failure:** Case 3 outcome ignores board’s role in enabling unsafe staffing. Procedure addresses individual acts only.  

  ---

  ### **PHILOSOPHICAL DEPENDENCIES (Φ)**  
  - Steps 2 & 4 rely on Frankfurt’s contested view that responsibility requires *sourcehood* (act flows from agent) not *alternatives*.  
  - If "flicker" objection holds, the procedure over-sanctions in cases like 1 and 3.  

  ### **JUDGMENT CALLS (✓)**  
  - Q1: Credibility assessment (e.g., nurse’s testimony vs. lack of corroboration).  
  - Q5: Defining "unreasonable harm" (e.g., is job loss "unreasonable" if reporting a supervisor?).  
  - Q4: Inferring motives from testimony (e.g., "I had no choice" vs. "It was faster").  

  Recommendation: Use this to structure deliberations, not as an algorithm. For contested judgment calls (✓), vote. For Φ-dependent steps, acknowledge philosophical uncertainty but apply consistently.
