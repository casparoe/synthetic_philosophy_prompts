prompt: |-
  I spent most of my working life as an experimental geochemist, and the latter part of it on the kind of government advisory committees that produce consensus reports — panels of a dozen or so experts, convened to recommend exposure thresholds, monitoring standards, and the like. Now that I am retired I have begun reading philosophy and formal epistemology, and something I took for granted for years now strikes me as philosophically loaded. I would like your help reconstructing what it presupposes.

  Here is the practice. The committees I served on were never permitted to issue findings while substantive disagreement remained among the members. Dissent was to be negotiated away behind closed doors, or, failing that, relegated to footnotes; deliberations were confidential; the published report spoke with one voice. Meanwhile, all of us had read the same literature, and the disagreements were rarely about access to data. What is more, in my own science, when different models give different forecasts, we publish the spread among them as the honest statement of what we know — nobody demands the models agree before the ensemble is released. So the committee practice puzzles me doubly: it demands a convergence my own field treats as neither available nor desirable, and it treats persistent expert disagreement as something to be hidden rather than reported.

  Since retiring I have encountered Aumann's agreement theorem, and I want the practice analyzed through it. As I understand it — and please correct me if I am loose with the terms — the theorem says that two rational agents with the same priors cannot agree to disagree once their posterior probabilities are common knowledge between them. So my questions are these. What view of disagreement does the consensus-committee practice presuppose? Does it implicitly assume that something like the theorem's conditions hold — that a group of honest, well-informed experts, given enough closed-door discussion, ought to converge — so that failure to converge indicates a fixable defect (bad faith, miscalculation, politics) rather than genuine information? Or does it presuppose the opposite, and function as a machine for concealing disagreement that the theorem's conditions would never eliminate? Which of the theorem's assumptions — common priors, common knowledge, honesty, a shared partition of the evidence — does the practice pretend are satisfied and which does it silently give up? I would also like to know how the practice relates to the broader epistemology of disagreement I have read about under the names conciliationism and steadfastness: is a unanimity rule a kind of institutionalized conciliationism, a demand that committee members defer to one another until opinions merge, or is it something those categories do not capture? And tell me what a report would have to look like if we took the disagreement itself as the finding — my instinct, imported from ensemble forecasting, is that publishing the distribution of the panel's opinions would be more honest, but I would like to know whether that intuition rests on a defensible view of expertise or a naive one.

  I have three requests about the answer itself. First, please keep it to at most 800 words; I would rather have your considered structure than an exhaustive survey, and I am content to sacrifice detail for that. Second, I ask you to be scrupulous about separating what is settled from what is contested: I assume the theorem itself and the precise content of its assumptions are not in dispute among people who know this literature, but I suspect nearly everything about whether the assumptions describe real experts, and whether consensus procedures track truth, is argued over — if so, say so plainly rather than presenting one side as the received view. Third, where I have misused a term of art above (and at my age and stage of philosophical education, I likely have), flag it without ceremony and proceed with the corrected usage; I am a newcomer to this vocabulary and would rather be corrected than indulged.
reasoning: |-
  Alright, let's tackle this fascinating query from a retired geochemist who's ventured into philosophy. The user has spent years on government advisory committees that demand unanimous consensus reports but now questions this practice through the lens of formal epistemology, especially Aumann's theorem. 

  First, I need to unpack the core tension: why does consensus-building in committees feel philosophically jarring compared to their field's embrace of model ensembles? The user's description suggests committees treat disagreement as a glitch to be fixed, while geochemistry treats it as data. That's the hinge.

  Aumann's theorem becomes crucial here. The user's grasp seems solid—common priors plus common knowledge should erase disagreement among rational agents. But committees operate in a messy reality where priors aren't identical, evidence isn't perfectly partitioned, and "common knowledge" is aspirational at best. The theorem's conditions are ideals, not descriptions. 

  The key insight might be this: consensus procedures *pretend* Aumann's conditions hold. They act as if disagreement *must* stem from fixable errors (bad faith, miscalculation), not genuine uncertainty. But in doing so, they silently violate the theorem's prerequisites by forcing agreement where rationality doesn't demand it. That's the irony—the practice undermines the very rationality it invokes.

  On conciliationism vs. steadfastness: unanimity rules lean hard into institutionalized conciliationism. They demand members defer until consensus emerges, treating persistent disagreement as failure. But this misses how expertise often involves legitimate, irreducible divergences (e.g., different weightings of evidence). 

  The user's instinct about publishing opinion distributions feels right. If we see experts as having varied priors or partitions, their disagreements *are* the knowledge. Suppressing that loses information—like replacing a forecast ensemble with a single model. But I should note the trade-offs: policymakers might crave simplicity, and dissent can be weaponized. Still, epistemically, distributional reporting wins.

  Where to flag terminology? The user uses "common knowledge" correctly but might conflate "priors" with foundational beliefs. Also, "conciliationism" here refers to peer disagreement, not committee dynamics per se—worth clarifying gently. 

  Finally, the user's meta-requests are wise: honor the word limit, demarcate settled vs. contested claims, and correct jargon slips. The theorem itself is settled; its applicability to experts is hotly debated. And the virtues of consensus vs. distributed reporting? That's where the real philosophical brawl lives.
answer: |-
  Your analysis cuts to the heart of tensions between ideal rationality, institutional epistemology, and scientific practice. Let's reconstruct the presuppositions of consensus committees through Aumann's theorem and related frameworks, respecting your requests:

  ### 1. **The Committee Practice's Presupposed View of Disagreement**
     - **Core Presupposition:** Persistent disagreement among experts is *prima facie* evidence of **procedural or agential failure** (bad faith, insufficient deliberation, hidden biases, computational errors) rather than **genuine, irreducible uncertainty**.
     - **Aumann's Lens:** The practice implicitly assumes the theorem's conditions *ought to hold* for qualified experts:
       - **Common Priors (CP):** Committee members are selected as sharing foundational assumptions (e.g., scientific realism, standard methodologies).
       - **Common Knowledge (CK):** Confidential deliberations aim to make all evidence/reasoning CK.
       - **Rationality & Honesty:** Members are assumed Bayesian updaters acting in good faith.
     - **Implication:** Under these assumptions, disagreement *must* dissolve with sufficient communication. Failure implies violation of CP (e.g., undisclosed values/biases), lack of CK (undiscussed evidence), or irrationality/politicking. The practice thus pretends CP/CK hold and treats dissent as correctable noise.

  ### 2. **Silent Surrenders of Aumann's Assumptions**
     Committees *formally* require CP/CK but *functionally* abandon them:
     - **CP is Idealized:** Experts have divergent "priors" in practice (career-specific heuristics, weightings of evidence types, risk aversion). Committees suppress this by enforcing negotiated consensus.
     - **CK is Unattainable:** Tacit knowledge, unarticulated assumptions, and cognitive limitations prevent full CK. Confidentiality masks this gap.
     - **Partition of Evidence:** Members access the same literature but *partition* it differently (e.g., prioritizing epidemiological vs. toxicological studies). The practice treats partitions as reconcilable via discussion; Aumann shows they needn't be if CP holds.
     - **Honesty vs. Incentives:** Institutional pressures (funding, reputation, policy impact) may incentivize strategic non-rationality, violating the theorem's rationality condition.

  ### 3. **Conciliationism, Steadfastness, and Unanimity Rules**
     - **Institutionalized Conciliationism:** The unanimity rule forces members to conciliate (revise beliefs toward peers') until agreement. This assumes **the "equal weight view"** – that peers' disagreements demand significant belief revision.
     - **Contrast with Steadfastness:** A steadfast stance (maintaining one's view) is institutionally forbidden, implying dissent reflects unreliability. This clashes with real expertise, where legitimate disagreement arises from **underdetermination of theories by data** or **diverse epistemic virtues** (simplicity vs. comprehensiveness).
     - **Tension:** The practice conflates *procedural* agreement (required for policy) with *epistemic* unanimity. Aumann assumes the latter follows from rationality; committees enforce the former as a proxy.

  ### 4. **Disagreement as Finding: A Defensible Alternative?**
     Publishing the *distribution* of panel opinions (e.g., "60% support threshold X, 40% support Y") could be more epistemically honest if:
     - **Expertise is Heterogeneous:** Divergent priors/partitions reflect legitimate perspectives (e.g., statistician vs. field biologist).
     - **Uncertainty is Irreducible:** When evidence underdetermines thresholds, disagreement *is* the knowledge state.
     - **Analog to Ensemble Modeling:** Just as model spreads quantify uncertainty, expert distributions reveal judgmental uncertainty.
     
     **Objections & Trade-offs:**
     - **Policy Utility:** Regulators often demand a single threshold ("actionable guidance"). Distributions may be misused (e.g., cherry-picking the lowest estimate).
     - **Social Dynamics:** Public dissent may erode trust or invite lobbying.
     - **Epistemic Risks:** May naively imply all opinions are equally valid ("naive perspectivism"). Defensible distributional reporting requires qualifying *why* disagreement persists (e.g., "differing risk frameworks") and weighting expertise.

  ### 5. **Settled vs. Contested Ground**
     - **Settled:** 
       - Aumann's theorem itself (given its assumptions).
       - Consensus procedures *functionally* treat dissent as eliminable.
     - **Contested:**
       - **CP Applicability:** Do experts share priors? Philosophers (e.g., Adam Elga, Roger White) debate if CP is plausible or a "myth" masking value-laden differences.
       - **Truth-Tracking:** Does forced consensus improve accuracy? Social epistemology (e.g., Helen Longino) suggests diversity *without* enforced unanimity may be superior.
       - **Distributional Reporting:** Whether it better captures uncertainty or invites relativism is hotly disputed (compare Philip Kitcher's "well-ordered science" to Scott Page's "diversity bonus").

  ### Terminology Note
  You used terms correctly. One nuance: "Common Priors" often implies shared *probabilistic* priors over all possible states, which is stronger than shared training. Committees assume the weaker version.

  ### Conclusion
  The consensus practice presupposes that Aumann's conditions *should* hold for experts, treating unresolved dissent as evidence of correctable irrationality. It silently abandons CP and CK in execution, masking irreducible uncertainty. While distributional reporting better reflects expert heterogeneity (aligning with your ensemble forecasting instinct), its policy efficacy remains contested. The practice is institutional conciliationism, prioritizing procedural unanimity over epistemic nuance—a pragmatic choice with significant epistemological costs.

