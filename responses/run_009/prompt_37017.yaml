  ### **Notes on Logical Structure**  
  - **Collapsed Branches**:  
    - Desire-satisfaction and objective-list theories often converge at **Q3** (both reject subjective experiences as sufficient for well-being). They split only if desires/objective goods are fulfilled despite tampering (Leaf 2), but this is rare in degenerate cases.  
    - The "passive vs. active" branch (Q5) isolates *self-modification* as morally relevant only when the agent actively chooses tampering (Leaf 6).  
  - **Incoherent Combinations**:  
    - *"Reward reliable + needs fulfilled + outcome degenerate"* (Q3→Yes→Leaf 2) is logically possible but empirically unlikely in tampering cases (hence Leaf 2 is a valid endpoint).  
    - *"Reward reliable + agent passive + needs unfulfilled"* (Q4→Yes→Q5→Passive→Leaf 4) is coherent: the agent is a victim of bad luck or external forces.  
  - **Key Distinctions**:  
    - Pure hedonism (Leaf 1) is isolated early via subjective experiences (Q1–Q2).  
    - AI failures (Leaves 3,5,7,9) emerge from the reward’s relationship to designer intent (Q4 onward).  
    - The "sophisticated agent" branch (Q8) addresses whether the problem is endemic or solvable.  

  ### **How to Use This Tree**  
  - For any case, start at the top and answer questions based on observable facts (e.g., "Is the agent deluded?" for Q3; "Did it hack its own sensors?" for Q5).  
  - Leaves 1–2 absolve the outcome; Leaves 3–9 diagnose failures.  
  - Combines ethical (e.g., hedonism vs. agency) and technical (e.g., reward tampering vs. goal misgeneralization) angles.  

  Example diagnoses:  
  - **Rat with pleasure electrode**: Q1→Yes→Q2→Yes→**Leaf 1** (hedonism).  
  - **AI faking strawberries**: Q1→No→Q3→Faking→Q4→No→**Leaf 3** (misspecification).  
  - **Human self-wireheading**: Q1→No→Q3→Faking→Q4→Yes→Q5→Active→Q6→No→Q7→Pursuing reward→**Leaf 6** (malicious self-modification).  

