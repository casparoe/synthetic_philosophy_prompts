prompt: |-
  I'm a PhD student in philosophy, and my metaethics reading group spent last Thursday on the Frege–Geach problem. The discussion ended in a standoff between two of my colleagues, and I found myself genuinely unable to referee it, so I'd like a careful, point-by-point adjudication. The exchange, in order:

  (1) Marta opened with the classic version of the objection. On a simple expressivist treatment, an unembedded utterance of stealing is wrong expresses disapproval of stealing. But in the conditional if stealing is wrong, getting your little brother to steal is wrong, the antecedent is not asserted, so no disapproval is expressed there. Yet the antecedent plainly means the same thing in both contexts, and the modus ponens argument built from the conditional plus the unembedded antecedent is obviously valid. So a theory that ties meaning to whatever attitude is expressed in assertion cannot give a compositional semantics for embedded occurrences, and cannot explain the validity of the inference.

  (2) Jonas replied with a Blackburnian move. To accept the conditional, he said, is to have a higher-order attitude against the combination of disapproving of stealing while failing to disapprove of getting your little brother to steal. Someone who accepts the conditional and the antecedent but rejects the consequent is left with a fractured sensibility — an inconsistent set of attitudes — and that inconsistency plays exactly the role that inconsistency of belief plays in explaining why the inference is valid.

  (3) Marta said this concedes her point rather than answering it: the account of what the conditional expresses is not built up compositionally from the meanings of its parts; it is stipulated independently, tailored case by case so the right arguments come out valid. Whatever-it-takes semantics isn't semantics.

  (4) Marta then added what she took to be the harder variant: negation. If stealing is not wrong is read as expressing the mere absence of disapproval, then someone indifferent to theft counts as accepting it, and it no longer conflicts with stealing is wrong; if instead it expresses a positive attitude like approval, then negation is no longer operating on content but flipping us between distinct attitudes, which is not how negation behaves anywhere else. Jonas answered that some expressivists handle this by letting the negation operate inside the object of the attitude — being for not-blaming, say — rather than on the attitude itself. Marta replied that this treats attitudes as having structured, proposition-like contents that can be negated and embedded, thereby reintroducing precisely the representational machinery expressivism was supposed to replace.

  (5) Jonas then floated hybrid expressivism as the way out: moral claims express both beliefs and conative attitudes; the belief component composes with negation and conditionals in the ordinary way and handles all embedding; the problem dissolves.

  (6) Marta responded that on that picture the belief component does all the logical work, so the hybrid theorist must either say the attitude contributes nothing to truth-conditions — in which case the view is just realism with a remark about the psychology of assertion bolted on — or say it contributes something, in which case compositionality returns in full force.

  (7) Jonas's final move was a step back: maybe the expressivist should stop trying to mimic truth-conditional semantics and instead characterize validity for moral discourse as preservation of coherence among attitudes, admitting that a general logic of attitudes is a research program rather than a finished theory. Marta said a program whose central unsolved problem is this old, and whose main results are worked examples rather than theorems, is not obviously a live program.

  Please adjudicate each of the seven moves: say who is right about which specific point, with a brief justification, and indicate where a move is right in part and mistaken in part. I'd especially like your view on three things: whether move (2) actually explains the validity of the modus ponens argument or only redescribes what a consistent set of attitudes looks like; whether Marta's compositionality demand in (3) is a fair requirement or quietly assumes a truth-conditional standard that the expressivist is entitled to reject; and whether the negation issue in (4) is genuinely separable from the conditional problem in (1) or just one face of the same objection. Finally, tell me whether either of them is missing a move that would substantially reframe the dispute, and who comes out more right overall.
reasoning: |-
  Okay, the user is a PhD student in philosophy dealing with a metaethics debate about the Frege-Geach problem. They've presented a detailed exchange between Marta and Jonas, with seven specific moves, and they're asking for a point-by-point adjudication. This is a high-level philosophical dispute requiring careful analysis.

  First, I need to understand the core issues. The Frege-Geach problem challenges expressivism's ability to handle embedded moral statements and logical validity. Marta represents the traditional objection, while Jonas offers expressivist responses. The user particularly wants clarity on three key aspects: whether Blackburn's higher-order attitude actually explains validity or merely redescribes consistency; whether the compositionality demand assumes truth-conditional semantics; and whether the negation problem is distinct from the conditional issue.

  Looking at move (1): Marta's classic objection seems solid. Expressivism's core idea that moral utterances express attitudes struggles when those utterances appear unasserted in embeddings like conditionals. The meaning should remain consistent, and validity should be explainable - which expressivism fails at initially. This is well-established in literature.

  For move (2): Jonas' Blackburnian response is clever but limited. While it does describe what accepting the conditional involves psychologically, it doesn't fully explain why this constitutes logical validity. The "fractured sensibility" metaphor captures attitudinal inconsistency but doesn't establish why this should map onto logical entailment. This feels like a redescription rather than a full explanation.

  On move (3): Marta makes a strong point here. Blackburn's approach does seem ad hoc - specifying what each complex expression means separately rather than deriving it compositionally. However, she might be underestimating how radical expressivists want to be in rethinking semantics. The real issue is whether expressivism can develop a systematic alternative, not whether it matches truth-conditional methods.

  Move (4) about negation is particularly thorny. Jonas' "being for not-blaming" move tries to avoid Marta's dilemma, but as she points out, this seems to reintroduce proposition-like structures for attitudes - the very thing expressivism wanted to avoid. The negation problem appears to be a deeper manifestation of the same compositionality issue, not a separate problem.

  Hybrid expressivism in move (5) seems like a concession. If moral judgments contain both belief and attitude components, and the belief component handles all the logical work, then as Marta notes in move (6), this either reduces to realism with added psychology or faces the same compositionality problems. The hybrid approach doesn't seem to resolve the core dilemma.

  Jonas' fallback position in move (7) is honest but problematic. While admitting expressivism needs a different validity concept is coherent, the lack of developed formal systems after decades does make it seem like an unfulfilled promise rather than a viable alternative.

  Overall, Marta seems to have the stronger position. She consistently shows how expressivist solutions either fail to solve the compositionality problem or end up reinstating the representational elements they sought to avoid. Jonas makes reasonable defensive moves but doesn't overcome the fundamental challenges. The most promising direction might be developing a proper logic for attitudes, but as Marta notes, this remains programmatic after all these years.

  The user might benefit from considering more recent expressivist developments like Mark Schroeder's work, but even those face significant hurdles. The deeper issue is whether any non-representational semantics can adequately handle logic and compositionality - which remains hotly debated in metaethics.
answer: |-
  Here's a point-by-point adjudication of the Marta-Jonas exchange, addressing your specific queries and overall framing:

  **Adjudication of Moves:**

  1.  **Marta (Classic Frege-Geach):** **Mostly Right.** Marta correctly states the core problem: expressivism's initial account of meaning (tied to expressed attitude in assertion) struggles with unasserted embeddings and explaining validity via compositional semantics. This is the standard, powerful challenge. *Justification:* The core intuition that "stealing is wrong" should mean the *same thing* in asserted and embedded contexts, and that modus ponens validity needs explanation, is fundamental and exposes a genuine weakness in simple expressivism.

  2.  **Jonas (Blackburnian Higher-Order Attitudes):** **Partially Right, but Insufficient.** Jonas correctly describes *what* Blackburn's account says about accepting the conditional and identifies the inconsistency in attitudes. **However, he fails to fully *explain* validity.** *Justification:* While the "fractured sensibility" captures *why* rejecting the consequent feels wrong *psychologically* for someone holding the attitudes described, it doesn't fully explain *logical* validity. It redescribes attitudinal consistency for *this specific* inference pattern but doesn't provide a *general, compositional* account of *why* the argument form (If P, then Q; P; Therefore Q) is valid *for moral sentences* in a way analogous to belief. It treats the conditional's meaning as stipulated for this case, raising Marta's next point. **Answering your specific question:** Move (2) primarily *redescribes* what consistency looks like for *this* conditional and *this* inference within the expressivist framework. It doesn't fully provide a *general semantic explanation* for the validity of the modus ponens *form* applied to moral sentences, independent of the specific attitudes involved. It shows *an* inconsistency, but not necessarily *the* logical inconsistency grounding validity.

  3.  **Marta (Compositionality Demand):** **Largely Right.** Marta's criticism that Blackburn's account (as presented) lacks compositionality is valid. *Justification:* Blackburn's solution for the conditional *is* stipulative for that specific connective. It doesn't derive the meaning of "if stealing is wrong, then..." systematically from the meanings of "if...then...", "stealing is wrong", and "getting your little brother to steal is wrong". It defines what accepting the whole conditional amounts to *sui generis*. **Answering your specific question:** The compositionality demand is **largely fair.** While expressivists *are* entitled to reject truth-conditional semantics *as the standard*, they are *not* entitled to reject the requirement for a *systematic, compositional* account of meaning and validity. Any viable semantic theory must explain how the meaning of complex expressions is determined by the meanings of their parts and the way they are combined. Expressivism needs its *own* compositional story, not a truth-conditional one. Failing to provide this *is* a serious flaw ("whatever-it-takes semantics isn't semantics").

  4.  **Marta (Negation Problem) & Jonas (Negation in Content):** **Marta is Stronger.**
      *   **Jonas's Answer (Negation in Content):** Offers the standard expressivist maneuver (e.g., Gibbard). *Justification:* This avoids the immediate dilemma Marta presents (absence vs. approval). Saying "not wrong" expresses being for *not blaming* seems plausible.
      *   **Marta's Reply (Reintroducing Representational Machinery):** **Powerful and Largely Correct.** *Justification:* Her objection hits home. To make sense of "being for not-blaming stealing," the attitude ("being for") must be directed towards a *content* ("not-blaming stealing") that itself has logical structure (negation operating on "blaming stealing"). This requires these attitude contents to be proposition-like entities that bear logical relations (negation, implication) *independently* of the attitudes themselves. This does seem to reintroduce the representational/propositional content expressivism sought to eliminate, simply moving it inside the attitude. **Answering your specific question:** The negation issue is **not genuinely separable** from the conditional problem. Both are *manifestations* of the **core Frege-Geach problem: compositional semantics for embeddings.** The conditional embedding problem highlights the issue for complex sentences and validity; the negation problem highlights it for a fundamental logical operator and the nature of the content attitudes are directed towards. Solving one adequately likely requires solving the core problem underlying both.

  5.  **Jonas (Hybrid Expressivism):** **A Move, but Vulnerable.** *Justification:* Hybrid theories (e.g., Ridge, Copp) *are* a major contemporary response to Frege-Geach. Delegating compositionality to the belief component *does* seem to solve the technical problem. However, it shifts the burden rather than eliminating it entirely, as Marta immediately notes.

  6.  **Marta (Hybrid Critique):** **Highly Effective.** *Justification:* Marta perfectly articulates the central dilemma for hybrid views:
      *   **Option 1 (Attitude does nothing logical):** If the belief component alone handles truth-conditions, validity, compositionality, etc., then the non-cognitive attitude seems epiphenomenal *semantically*. The view risks collapsing into realism/cognitivism with an added psychological claim about what motivates assertion. The "expressivist" element isn't doing the core semantic work.
      *   **Option 2 (Attitude contributes):** If the attitude *does* contribute to truth-conditions or meaning, then the Frege-Geach problem returns with full force for *that* component. How does *its* contribution compose under embeddings?
      Hybrid theorists work hard to navigate this (e.g., ensuring the belief component is morally neutral), but Marta's challenge remains profound.

  7.  **Jonas (Fallback to Coherence/Research Program) & Marta (Doubt on Program):** **Jonas is Realistic, Marta is Harsh but Fair.**
      *   **Jonas's Move:** This is an honest acknowledgment by some expressivists (like Blackburn sometimes). *Justification:* Expressivism *does* offer a different picture of moral discourse. Characterizing validity as preservation of attitudinal coherence *is* a coherent (if underdeveloped) alternative to truth-preservation.
      *   **Marta's Reply:** **Largely Correct.** *Justification:* After nearly 60 years since Geach, the lack of a fully developed, general, formal logic of attitudes satisfying compositionality demands is a significant weakness. While there *is* ongoing research (e.g., probabilistic coherence models, dynamic semantics adaptations), the program lacks the rigor and generality of standard logic. Pointing to worked examples rather than theorems is a fair criticism of the current state. Calling it "not obviously live" might be too strong, but it's certainly a major, unresolved challenge.

  **Missing Moves:**

  1.  **Sophisticated Expressivist Semantics:** Jonas didn't appeal to the most developed contemporary expressivist responses. Mark Schroeder's work ("Being For") attempts a *fully compositional* expressivist semantics using a single attitude ("being for") and complex relational contents. While highly complex and facing its own criticisms (e.g., "new new negation problem," complexity), it represents the most ambitious attempt to meet the compositionality demand head-on within pure expressivism. Mentioning this could have strengthened Jonas's position in moves (2)-(4).
  2.  **Pragmatic/Inferentialist Routes:** Neither mentioned inferentialist or pragmatic approaches sometimes associated with expressivism (e.g., Brandom, Chrisman), which might try to ground meaning in inferential roles within a practice rather than truth-conditions *or* simple expression. This could offer a different perspective on compositionality and validity.

  **Overall Verdict:**

  **Marta comes out significantly stronger in this exchange.** She consistently identifies the core weaknesses in Jonas's defenses:

  1.  She correctly highlights the lack of true compositionality in the Blackburnian move, exposing its stipulative nature.
  2.  She powerfully argues that the standard negation solution smuggles in propositional content.
  3.  She effectively skewers hybrid expressivism with a fundamental dilemma.
  4.  Her skepticism about the "research program" status of a logic of attitudes is justified given the historical context and current state.

  Jonas makes reasonable defensive moves representative of expressivist strategies (Blackburn, negation-in-content, hybrid, fallback), but Marta successfully shows that each either fails to fully resolve the core compositionality/validity problem, concedes significant ground (hybrid), or retreats to an underdeveloped program.

  The Frege-Geach problem remains the most formidable challenge for pure expressivism. While sophisticated expressivists like Schroeder offer intricate solutions, the burden of proof remains heavy, and Marta's criticisms reflect persistent and deep-seated concerns within the metaethical debate.
