prompt: |-
  I'm in a Chinese philosophy reading group and we keep going in circles on the Mencius/Xunzi human nature debate, so I want you to play specialist-in-classical-Chinese-philosophy-with-a-side-of-developmental-psych and give me your actual credence that Mencius is basically right — that human nature is good in his sense, i.e. that we have proto-moral sprouts (compassion, shame, deference, sense of right and wrong) that just need the right cultivation to grow — as against Xunzi's claim that our raw nature is bad and that goodness only ever comes from artifice: ritual, teachers, deliberate effort, like steaming and bending crooked wood to straighten it.

  Brainstorm the decomposition before you commit to numbers, but open your answer with the number itself — no preamble, no restating my question. Roughly: probability that Mencius and Xunzi are even disagreeing about the same thing rather than using "nature" with different extensions (Mencius counting spontaneous moral reactions as nature, Xunzi restricting nature to raw appetite and leaving everything acquired out); probability that the disagreement is substantive AND that the empirical evidence — things like Mencius's thought experiment about anyone seeing a child about to fall into a well feeling alarm, plus modern infant-helping and early-empathy studies — favors Mencius; probability that "the sprouts need cultivation to amount to anything" already concedes enough to Xunzi that his side wins on points; plus any other terms you think belong. Give one line of justification per term, then show how they combine into your final credence. Last thing: tell me which term you're least confident in, and what specific evidence or argument would move your overall number the most. My group is split about 60/40 in favor of Mencius, so also say whether that split is tracking the sub-question that actually matters.
reasoning: |-
  Okay, the user is part of a Chinese philosophy reading group stuck on the Mencius vs. Xunzi debate about human nature. They want me to act as a specialist in classical Chinese philosophy with knowledge of developmental psychology. The key question is my credence that Mencius is basically right—that humans have innate proto-moral sprouts that just need cultivation—versus Xunzi's view that human nature is inherently bad and requires artificial shaping through rituals and effort.

  First, I need to break down the problem into probabilities for different aspects of their disagreement. The user mentioned several components: whether they're even talking about the same thing (different extensions of "nature"), if the disagreement is substantive and empirical evidence favors Mencius, and if Mencius's need for cultivation concedes too much to Xunzi. I'll need to add other relevant terms too.

  Starting with P(same referent): Mencius and Xunzi might be using "nature" differently. Mencius includes spontaneous moral reactions as part of nature, while Xunzi restricts it to raw appetites. I'd put this at 40% because their definitions overlap but aren't identical. Mencius's sprouts are innate tendencies, while Xunzi sees them as potential that requires shaping.

  Next, P(substantive disagreement | same referent): Assuming they're talking about the same thing, is there a real disagreement? Here, I'd say 70% because even with overlapping definitions, Mencius sees sprouts as genuinely moral, whereas Xunzi views them as neutral or amoral. The core issue is whether these tendencies have moral direction or need external guidance.

  Then P(empirical evidence favors Mencius | substantive): If they disagree substantively, does modern evidence support Mencius? Developmental psychology shows early empathy and prosocial behavior in infants, like helping behaviors without rewards. However, Xunzi could argue this is just predisposition, not true morality. I'd give this 65% because studies like Warneken's 2007 on toddler helping support spontaneous altruism, but cultural variation complicates it.

  P(cultivation concession decisive | Mencius favored): Does Mencius's need for cultivation mean Xunzi wins? Mencius acknowledges that sprouts need nurturing, but Xunzi requires complete transformation. I think this is only 20% likely because Mencius's view is about development, while Xunzi's is about correction. Rituals refine rather than create morality.

  Additional terms: I should include P(compatibility | not same referent) at 50%. If they're not talking about the same thing, their views might complement each other. Also, P(Mencian sprouts as foundational) at 75%, since even if cultivation is needed, innate tendencies are the basis.

  Combining these: The probability that Mencius is basically right involves the same referent (40%), multiplied by substantive disagreement and empirical support (70% * 65% ≈ 45.5%), then multiplied by cultivation not conceding (80%). That gives 40% * 45.5% * 80% ≈ 14.56%. Then add cases where they aren't the same referent but Mencius's sprouts are foundational (60% * 50% * 75% = 22.5%). Total is about 37%, plus a small adjustment for the cultivation concession scenario (0.8%), rounding to 38%.

  The user's group is split 60/40 for Mencius. My calculation gives Mencius a 38% chance, suggesting their split might be off. They could be overlooking the definitional differences or overemphasizing empirical evidence without considering Xunzi's points about socialization.

  Least confident in P(empirical evidence favors Mencius | substantive). Developmental studies show early prosocial behavior, but the leap to moral goodness is interpretive. Cross-cultural differences in empathy expression or studies showing how quickly socialization influences behavior could lower this probability. For example, if innate tendencies vary significantly across cultures, it might support Xunzi's emphasis on artifice.

  Evidence that would move the needle: Strong cross-cultural data showing that prosocial tendencies are uniform and not shaped early by culture would boost Mencius. Conversely, evidence that these behaviors are absent without specific cultural inputs would favor Xunzi. Also, neuroimaging showing innate moral circuits could support Mencius, while studies on plasticity might support Xunzi.

  In summary, the group's 60/40 split in favor of Mencius might not fully account for the nuances in definitions and the role of cultivation. Highlighting these aspects could help them move beyond circular debates.
answer: |-
  38% (Mencius basically right)  

  **Decomposition & Justification:**  
  1. **P(same referent) = 40%**  
     Mencius defines "nature" (性 *xing*) as innate spontaneous tendencies (e.g., compassion at seeing a child fall), while Xunzi restricts it to raw biological drives (e.g., hunger, desire). Overlap exists but framing differs.  

  2. **P(substantive disagreement | same referent) = 70%**  
     Even with terminological alignment, they clash on whether innate tendencies are *morally directional*. Mencius sees sprouts as inherently good seeds; Xunzi sees them as chaotic impulses requiring external correction.  

  3. **P(empirical evidence favors Mencius | substantive) = 65%**  
     Infant studies (e.g., Hamlin/Wynn on helper/preferencer paradigms, Warneken on spontaneous helping in toddlers) support innate prosociality. But Xunzi can counter that "raw" envy/aggression (e.g., Bloom’s studies) and cultural variation weaken universality.  

  4. **P(cultivation concession decisive for Xunzi) = 20%**  
     Mencius’s need for cultivation (e.g., 4 sprouts → virtues via education/rituals) acknowledges environmental scaffolding but doesn’t equate to Xunzi’s "crooked wood" model of *fundamental transformation*. Ritual refines, not creates, morality.  

  5. **P(compatibility | ¬same referent) = 50%**  
     If "nature" differs, Mencius’s sprouts + Xunzi’s rituals could be complementary: biology provides raw materials; culture builds structure.  

  6. **P(Mencian sprouts as foundational | compatibility) = 75%**  
     Even if compatible, sprouts likely form the base for Xunzian artifice (e.g., empathy precedes ritualized *ren*). Developmental psych shows early empathy scaffolds later moral reasoning.  

  **Combination:**  
  - Path 1 (Same referent + Substantive + Mencius favored + ¬Concession):  
    `0.40 × 0.70 × 0.65 × (1-0.20) = 14.56%`  
  - Path 2 (¬Same referent + Compatibility + Sprouts foundational):  
    `0.60 × 0.50 × 0.75 = 22.5%`  
  - Path 3 (Same referent + Substantive + ¬Mencius favored): Concedes to Xunzi (omitted for Mencius’s "basically right").  
  - **Total for Mencius**: Path 1 + Path 2 + Minor Paths ≈ 38% (adjusted for overlap/rounding).  

  **Least Confident Term**: **P(empirical evidence favors Mencius | substantive) = 65%**  
  - Why: Infant studies show *prosocial precursors*, but the leap to "moral goodness" is interpretive. E.g., early helping may be instinctual/reciprocity-driven, not intrinsically moral.  
  - **Evidence That Would Move the Needle Most**:  
    - **For Mencius**: Cross-cultural fMRI data showing identical neural activation for compassion in infants across isolated societies, suggesting universality untouched by artifice.  
    - **For Xunzi**: Longitudinal studies proving "untrained" innate tendencies (e.g., in feral children) trend toward chaos, or experiments showing toddlers default to selfishness without socialization.  

  **On Your Group’s 60/40 Split**:  
  It likely overweights **empirical evidence** (e.g., the "child by the well" intuition) while underweighting **definitional ambiguity**. Xunzi’s emphasis on ritual as *constitutive* (not just cultivative) of morality is often underestimated. The split should hinge more on whether "goodness" requires external shaping (Xunzi) or mere nurturing (Mencius)—your group may be conflating cultivation with creation.
