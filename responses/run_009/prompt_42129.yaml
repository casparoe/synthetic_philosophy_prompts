prompt: |-
  I am a recently retired physicist — condensed matter theory, mostly transport problems, for the better part of four decades — and I have spent the past two years reading philosophy of science for pleasure. Most of it I can latch onto, but I have run into a position in economic methodology that I cannot fit anywhere in my own conceptual toolkit, and I would like to know whether it has a name and a literature of its own.

  In my line of work, we idealize constantly: point masses, frictionless planes, ideal gases, infinite lattices. But we treat these as controlled approximations. There is supposed to be a regime in which the neglected effects are demonstrably small, part of the discipline lies in estimating the error you introduce, and the idealization is in principle removable — you can add the friction term back and watch the solution deform continuously toward the real thing. What I keep meeting in economics is something that looks superficially similar but, on inspection, seems to be a different animal: the claim that it is positively a virtue for a theory's assumptions to be wildly false, provided the theory's predictions hold up. I am told a famous mid-century essay by a Chicago-school economist argues this in so many words, illustrating it with an expert billiards player who sinks shots as if he had solved the relevant equations, with leaves arranged on a tree as if the tree knew where the sunlight would fall, and with firms that price as if they were solving a marginal-revenue-equals-marginal-cost problem even though the managers themselves, if you asked them, would report doing no such calculation. The striking move, to my ear, is not that the assumptions are false — ours often are — but that their falsity is advertised as a strength, and that the essay apparently counsels against ever testing a theory by the realism of its premises. No physicist I have ever worked with would say the falsity of the ideal-gas assumptions is a point in favor of the ideal-gas law; we say they are nearly true in a specified regime, and we can tell you how near. The economic stance does not seem to be that, and yet its defenders sound as though they thought it was.

  So, my questions: Does this specific doctrine — the claim that unrealistic assumptions are not merely tolerable but a mark of a significant theory, with predictive success as the only test — have an established name, and who coined it? How exactly do philosophers of science carve up the space here, given that it cannot be the same thing as the garden-variety idealization I practiced? I would be particularly grateful for the carving rather than the label: whether anyone has usefully distinguished kinds of false premises (for instance, ones that hold approximately in some limiting regime versus ones that are simply nowhere true, or ones whose failure is harmless for the question at hand versus ones that quietly do explanatory work); what the standard objections are; and what the best defense of the position amounts to — whether, that is, one can coherently hold that a model's postulates are nowhere near true and still take them to explain anything, rather than merely to predict. If there are several nearby concepts that a person in my position is likely to be conflating, please separate them for me and say where the edges lie. Please answer in American English.
reasoning: |-
  Okay, let me unpack this physicist's query. He's a condensed matter theorist with decades of experience in idealization practices, now puzzled by an economic methodology that celebrates wildly false assumptions as virtues. The core tension he describes is visceral: in physics, idealizations are controlled approximations with error bounds, while in economics he encounters claims that unrealistic assumptions are actually desirable if predictions hold.

  Hmm, the key reference he mentions - billiards, leaves, firms behaving "as if" - clearly points to Friedman's 1953 instrumentalism. But I need to verify if that's the primary source he's wrestling with. The physicist's frustration is methodological: how can false premises be strengths? And crucially, how does this differ from his discipline's "near truth in specified regimes" approach?

  Let me structure this carefully. First, identify the doctrine: Friedman's F-Twist is the obvious candidate, but I should acknowledge that economists don't uniformly endorse it. Then dissect why it feels alien to a physicist: the absence of domain specification and error quantification seems central. The "as if" examples trouble him because they lack limiting-case justification - no equivalent of ideal gases at low density/high temperature.

  For the conceptual carving he requests, I'll need to distinguish between:
  - Approximations (physics-style, with recoverable truth)
  - Abstraction (omitting irrelevant factors)
  - Instrumentalism (predictive success as sole criterion)
  - Credible worlds vs. credible assumptions (Sugden's framing)

  The explanation challenge is thorniest. Cartwright's capacities approach might help, or Hausman's distinction between how-possibly vs how-actually models. I should emphasize that economists often use models as isolative tools rather than approximations - but must acknowledge Lehtinen's critique about "unrealistic" covering multiple sins.

  For defenses, I'll note Friedman's own "survival" argument and the inductive risk perspective. But counterarguments matter too: the Duhem-Quine problem, Lawson's critical realism, and the empirical evidence that firms don't actually optimize as modeled.

  Throughout, I'll maintain his physics framing - using ideal gas laws as contrast - while introducing economic examples. The goal isn't to endorse instrumentalism but to map the philosophical landscape as he requested, marking where positions diverge from his familiar methodology.
answer: |-
  Your description perfectly captures a fundamental methodological divide between physics-style idealization and a particular strand of economic modeling championed by **Milton Friedman**. The doctrine you're encountering is most famously articulated in Friedman's 1953 essay "**The Methodology of Positive Economics**," published in his book *Essays in Positive Economics*. It's often called:

  1.  **Friedman's Instrumentalism** (emphasizing the philosophy of science underpinning it).
  2.  **The "F-Twist"** (a term coined by Paul Samuelson, often used critically: "The F stands for Friedman, and the Twist for the perverse way he twists the logic").
  3.  **The "As If" Methodology** (highlighting the key examples you mentioned).

  **Core Tenets of Friedman's Position:**

  1.  **The *Sole* Test of a Theory is Predictive Power:** The ultimate (and arguably only) criterion for judging a theory or model is the accuracy of its predictions about observable phenomena. "The only relevant test of the *validity* of a hypothesis is comparison of its predictions with experience."
  2.  **Assumptions are Irrelevant to Validity (if predictions hold):** The "realism" of a theory's assumptions is fundamentally *irrelevant* to its validity or usefulness. Assumptions are merely convenient tools for generating predictions.
  3.  **Wildly Unrealistic Assumptions Can Be a Virtue:** Precisely *because* assumptions aren't judged on realism, they can be highly abstract, simplified, or even "wildly inaccurate descriptive representations of reality" without invalidating the theory. In fact, simpler, more abstract assumptions might be *essential* for generating clear, testable predictions. Their "falsity" is not a weakness but potentially a sign of a powerful, generalizable theory focused on essential forces.
  4.  **Explanation is Prediction:** Friedman essentially collapses the distinction. A theory "explains" phenomena by successfully predicting them. There's no deeper requirement for the model's internal mechanism to correspond to the "true" causal processes operating in the real world. The billiards player *acts as if* he knew the physics equations; firms *act as if* they maximize profits by equating marginal cost and marginal revenue; leaves *are arranged as if* the tree maximized sunlight exposure. The "as if" behavior *is* the explanation provided by the predictive model.

  **Carving Up the Conceptual Space: How This Differs from Physics-Style Idealization**

  You've hit the nail on the head: Friedman's instrumentalism is fundamentally *not* the same as controlled approximation. Philosophers of science and economic methodologists distinguish several types of abstraction and false premises:

  1.  **Controlled Approximation / Galilean Idealization (Your Physics Practice):**
      *   **Core:** Simplifies reality by neglecting factors known to be *small* or *irrelevant* within a well-defined *domain* or *limiting case*. The idealization is justified by showing that the neglected effects are quantitatively insignificant *for the specific purpose* within that domain.
      *   **Truth Connection:** Assumptions are *approximately true* in the specified regime. The full, complex reality is seen as a continuous deformation of the idealized model (adding friction back).
      *   **Purpose:** To isolate and understand fundamental mechanisms *accurately* within bounds, often as a step towards more comprehensive models. Explanation is tied (at least aspirationally) to veridical mechanisms.
      *   **Error:** Explicit estimation of error bounds is crucial and part of the discipline. The idealization is *removable* in principle.
      *   **Example:** Ideal gas law (low density, high temp); point mass (size negligible compared to motion scale); infinite lattice (boundary effects negligible in bulk).

  2.  **Abstraction (Omission of Irrelevant Complexity):**
      *   **Core:** Focusing only on the factors deemed *essential* for the phenomenon under study, deliberately omitting other details *regardless of their magnitude*, because they are judged irrelevant to the *specific causal relationship* or *question* being examined.
      *   **Truth Connection:** Not claiming the omitted factors are small or zero, just that their inclusion wouldn't change the *qualitative conclusion* or the core relationship being modeled *for the question at hand*. The included factors are intended to be veridical representations of key causal drivers.
      *   **Purpose:** To achieve clarity and tractability by stripping away distracting complexity, revealing core structures or dependencies. Still aims for veridical representation of *selected* causal elements.
      *   **Error:** Less focus on quantitative error bounds, more on robustness of qualitative conclusions to relaxing assumptions.
      *   **Example:** Modeling planetary orbits neglecting the gravitational pull of distant stars; supply and demand curves ignoring individual consumer psychology (focusing on aggregate behavior).

  3.  **Friedman's Instrumentalism / Radical "As If" Modeling:**
      *   **Core:** Assumptions are *fictions* or *parables* designed *solely* to generate accurate predictions. Their descriptive accuracy is irrelevant. The model describes how agents/system *behave* ("as if" they followed the model's rules), not how they *actually* decide or operate internally.
      *   **Truth Connection:** *No commitment* to the assumptions being approximately true, causally accurate, or even plausible descriptions of reality *anywhere*. The *only* "truth" is the accuracy of the predictions. The model is an instrument, not a picture.
      *   **Purpose:** *Exclusively* prediction. Any "explanation" is purely derivative from predictive success ("They behave *as if*...").
      *   **Error:** No requirement to estimate errors introduced by unrealistic assumptions. Success is binary: do the predictions hold (well enough)? Falsity of assumptions is *not* considered a source of error *if* predictions hold.
      *   **Example:** Perfect rationality, perfect information, profit maximization via calculus, representative agents – used not because they are approximately true descriptions of human cognition or firm operation, but because models built on them sometimes predict aggregate market behavior (prices, quantities) surprisingly well. The billiards player doesn't solve equations, but his skill makes him *act as if* he did.

  **Key Distinctions:**

  *   **Commitment to Truth:** Physics idealization *aims* at approximate truth of mechanisms in a domain. Instrumentalism *explicitly rejects* the necessity of this for assumptions.
  *   **Error and Domain:** Physics requires domain specification and error estimation. Instrumentalism has no such requirement; a model with wildly false assumptions is "valid" *wherever* its predictions hold, regardless of *why* they hold.
  *   **Explanation:** Physics idealization seeks mechanistic explanation. Instrumentalism sees prediction *as* explanation ("as if").
  *   **Role of Assumptions:** In physics, assumptions are justified approximations. In instrumentalism, assumptions are justified *only* by the predictions they yield, their inherent plausibility is immaterial.

  **Standard Objections to Friedman's Instrumentalism:**

  1.  **The Duhem-Quine Problem:** It's often impossible to test a single hypothesis (the prediction) in isolation; it's entangled with auxiliary assumptions (including the wildly false ones). If predictions fail, you don't know if the core theory is wrong or if the unrealistic auxiliaries poisoned the well. If they succeed, you don't know *why* (is it the core mechanism or a lucky coincidence enabled by the fictions?).
  2.  **Lack of Explanatory Power:** Critics (e.g., Herbert Simon, Daniel Hausman, Uskali Mäki, Tony Lawson) argue that science aims to explain *why* things happen, not just predict *that* they happen. Saying firms act "as if" they maximize profit doesn't explain *how* this collective behavior emerges from the (very different) actual decision processes of boundedly rational managers using rules of thumb. It risks being a "just-so" story.
  3.  **Degenerative Research Program:** If unrealistic assumptions aren't problematic, there's no incentive to improve the realism of the microfoundations. This can lead to models becoming detached from reality, focusing on mathematical elegance over empirical relevance (a common critique of post-WWII neoclassical economics). How do you *progress* beyond prediction if you ignore the causal structure?
  4.  **Inductive Risk:** Relying solely on past predictive success is risky. A model with false assumptions might predict well in known data due to accidental correlations or specific contexts, but fail catastrophically in new situations or under policy changes because it misrepresents the underlying causal structure (e.g., financial crisis models assuming normal distributions and no systemic risk).
  5.  **Confusion of Abstraction with Fiction:** Critics argue Friedman conflates legitimate abstraction (omitting irrelevant complexity) with outright fiction (assuming mechanisms known *not* to operate). Legitimate abstraction still aims for veridical representation of the *included* elements.
  6.  **Empirical Evidence on Decision-Making:** Behavioral economics and psychology provide strong evidence that the core assumptions (perfect rationality, perfect information, unlimited calculation) are *not* just "false" but fundamentally *misleading* descriptions of human cognition, leading to systematic predictive failures that models incorporating more realistic psychology can sometimes avoid.

  **The Best Defense of Instrumentalism (or Softer Variants):**

  1.  **Predictive Success is What Matters (Ultimately):** For many practical purposes (e.g., forecasting inflation, designing auctions), knowing *what* will happen is more important than knowing *exactly why* in microscopic detail. If simple "as if" models predict better than more complex "realistic" ones, use them.
  2.  **The Complexity Defense:** The economy is vastly more complex than a physical system, with reflexive, strategic agents. Building models with fully realistic assumptions about human psychology and information processing is often computationally or analytically intractable. Radically simplified "as if" models might be the *only* way to get any handle on aggregate phenomena. They capture essential tendencies or equilibrium outcomes without modeling the messy details.
  3.  **"Survival" Argument (Friedman's Darwinism):** Friedman argued that firms that persistently fail to *act as if* they are maximizing profit will be driven out of the market by competitors who (by luck, imitation, rules of thumb, etc.) behave *closer* to the profit-maximizing ideal. Over time, market selection makes the "as if" assumption a reasonable approximation for predicting market outcomes, even if no individual firm consciously calculates margins.
  4.  **Focus on the Target:** Models are built for specific purposes. A model designed to predict commodity price fluctuations doesn't need realistic assumptions about CEO psychology if simpler assumptions generate good predictions for *that specific target*. Adding realism might add complexity without improving predictive power for the question at hand.
  5.  **Instrumentalism as a Temporary Stage:** Some argue it's a pragmatic starting point. Get predictive models working first, then try to build more realistic microfoundations *if needed* for explanation or to handle cases where predictions break down. However, Friedman himself seemed to see it as a permanent feature.

  **Can Unrealistic Assumptions Explain?**

  This is the crux. For instrumentalists like Friedman: **Yes, but only in the "as if" sense.** The model explains the phenomenon by showing that it behaves *as if* the (false) assumptions were true. It provides a (possibly fictional) mechanism sufficient to generate the observed outcome.

  For realists (like most physicists and many philosophers): **No, not genuinely.** Genuine explanation requires identifying the *actual* causes and mechanisms operating in the world. A predictive "as if" model might be useful, but it doesn't explain *why* the phenomenon occurs; it only describes a pattern. The billiards model "explains" the shot *if* the player actually solved the equations, but if he didn't, the model doesn't explain his skill – it merely describes its outcome. Realists argue that explanation requires veridical representation of causal capacities (Nancy Cartwright) or mechanisms.

  **Conclusion:**

  You've identified a genuine and deep methodological schism. Friedman's instrumentalism ("F-Twist," "As If" methodology) is radically different from the controlled approximation you practiced. It severs the link between a model's assumptions and any requirement for their approximate truth, making predictive success the sole arbiter. While pragmatic defenses exist, it faces significant philosophical objections regarding explanation, progress, and the potential disconnect from underlying causal reality. The debate between instrumentalists and realists (and various intermediate positions) remains central to economic methodology and the philosophy of social science. Key figures beyond Friedman include Paul Samuelson (critic), Herbert Simon (bounded rationality critic), Daniel Hausman, Uskali Mäki, Nancy Cartwright, Tony Lawson (critical realism), and Robert Sugden ("credible worlds" as a middle ground focusing on plausible counterfactuals).
