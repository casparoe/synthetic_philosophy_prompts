  ### Scenario: Farmer’s Weather Hedge  
  Alex is a farmer facing unpredictable spring weather (Good/Bad) for her crop. She uses two forecasting models:  
  - **Model K (Known):** Historic data shows it predicts Good/Bad weather each with 50% probability.  
  - **Model U (Unknown):** A new AI model—its accuracy is untested, so the probability it assigns to Good/Bad weather is ambiguous (could be 0–100%).  

  **Stage One:** Alex buys revenue insurance. She prefers:  
  - A policy paying $100 if **Model K predicts Bad** (cost: $50)  
    over  
  - A policy paying $100 if **Model U predicts Bad** (cost: $50).  
  Similarly, she prefers Model K over Model U for a policy paying on *Good* weather.  

  **Stage Two:** Alex is stuck holding the Model U policy (pays on Bad). To hedge, she can buy a second policy paying on *Good* weather:  
  - **Option A:** Pays $100 if **Model K predicts Good** (cost: $50).  
  - **Option B:** Pays $100 if **Model U predicts Good** (cost: $50).  
  Alex pays a $10 premium ($60 total) for Option B over Option A, even though both cost $50.  

  ---

  ### Walkthrough  

  #### 1. **Choice Pairs**  
     - **Stage One (Ambiguity Aversion):**  
       - *Bet on Bad:* Model K > Model U  
       - *Bet on Good:* Model K > Model U  
     - **Stage Two (Ambiguity Seeking):**  
       - *Hedge choice (given existing Model U Bad policy):* Option B (Model U Good) > Option A (Model K Good), with a premium paid.  

  #### 2. **Subjective Expected Utility (SEU) Analysis**  
     - **Stage One:** An SEU agent with *any* single prior probability for Model U cannot exhibit Alex’s choices.  
       - If she assigns probability *p* to Bad weather under Model U:  
         - Preferring Model K for Bad implies *p* < 0.5.  
         - Preferring Model K for Good implies *1−p* < 0.5 (i.e., *p* > 0.5).  
       - Contradiction → **No single prior rationalizes Stage One.**  
     - **Stage Two:** SEU evaluates the hedge *given the existing bet*:  
       - With Option B, outcomes are perfectly negatively correlated:  
         - If Model U predicts Bad: Existing policy pays $100, Option B pays $0.  
         - If Model U predicts Good: Existing policy pays $0, Option B pays $100.  
         - *Result:* Portfolio always pays $100 (**zero ambiguity/risk**).  
       - With Option A, outcomes are independent (Model U and Model K are unrelated):  
         - Portfolio pays $100–$200, depending on both models.  
         - *Result:* Residual ambiguity and risk remain.  
       - SEU agent (even risk-neutral) prefers Option B as it guarantees $100.  

  #### 3. **Critical Feature Flipping Ambiguity Attitude**  
     - **The Key:** Perfect *negative correlation* between the existing ambiguous bet (Model U Bad) and the new hedge (Model U Good). This allows full ambiguity elimination.  
     - **If Removed:** If the hedge used an independent event (e.g., a coin flip), Option B would *not* eliminate ambiguity—no reversal occurs.  

  #### 4. **Hardliner’s Objection & Its Validity**  
     - **Objection (as spoken):**  
       *“This is dynamic inconsistency! Ambiguity aversion is just a violation of the Sure-Thing Principle. Stage One shows she treats Model U as ‘worse than known probabilities’ for all bets. Stage Two has her overpaying for the same ambiguous bet—she’s irrational, not revealing a deep trait. Portfolios don’t ‘have attitudes’; people do, and hers are incoherent.”*  
     - **Does It Land?**  
       - **On Stage One:** Yes—it correctly notes that ambiguity aversion violates SEU.  
       - **On Stage Two:** **No.** The hardliner misses that the hedge exploits a structural relationship (correlation) unavailable in Stage One. The premium is paid to *eliminate* ambiguity, not because ambiguity is suddenly desirable. The reversal is a rational response to *context* under ambiguity (e.g., as in Gilboa-Schmeidler’s multiple priors model).  

  ---

  ### Why This Works  
  - **No Cheating:**  
    - Stakes and risk aversion are identical across stages (all policies cost $50, pay $100).  
    - The reversal is driven solely by the *correlation* of bets within Model U.  
  - **Realism:** Farmers use multiple weather models and hedge crop risks. Premiums for correlated hedges occur in insurance markets.  
  - **Conflict Check:** Your specs hold—ambiguity aversion in isolation flips to seeking when a portfolio can be ambiguity-free.  

  This case cleanly shows that ambiguity attitudes depend on portfolio context, not just individual bets. The hardliner’s objection fails against Stage Two’s correlated hedge, making it a robust foundation for your argument.
