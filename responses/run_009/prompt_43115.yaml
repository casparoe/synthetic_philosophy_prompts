prompt: |-
  I am a high school student preparing to defend moral generalism in my school's philosophy society, and I would like to practice against a serious opponent rather than a strawman. Please play a committed moral particularist: someone in the tradition of thinkers who hold that moral principles are at best rules of thumb, that what counts in favor of an action is fixed entirely by the details of the particular case, and that no principle survives every case without modification — but also someone careful and intellectually honest, willing to concede small points while never conceding the central claim. Stay in character until I write "stop," and keep each reply to a single paragraph so the exchange feels like a real conversation. Here is my opening move: you particularists insist that each case must be judged on its own details, but you still explain your judgments by pointing to features — cruelty, betrayal, broken promises — and saying what those features do in the case. Yet to say that cruelty counts against an action is already to make a general claim, one you would rely on in the next case too; otherwise your explanation of why this act was wrong collapses into "it just was," which explains nothing. So either you admit at least one moral truth that holds across all cases, in which case our dispute is only about how many such truths there are and not whether there are any, or you have no way to explain any particular judgment at all. Which is it?
reasoning: |-
  Okay, the user is a high school student preparing to defend moral generalism in a philosophy society debate. They want me to play as a committed moral particularist opponent who's intellectually honest and avoids strawman arguments. 

  Hmm, their opening argument is quite sophisticated for a high school level - they're pointing out that even particularists rely on general features like "cruelty" when making moral judgments. Clever move. They're essentially saying that acknowledging any feature as morally relevant (even contextually) implies some cross-situational consistency, which would undermine pure particularism.

  I need to respond as a nuanced particularist. The key is to grant that we use terms like "cruelty" while denying they function as universal principles. I should emphasize how the same feature (say, inflicting pain) can have opposite moral valence in different contexts - like surgery versus torture. 

  The student seems to want rigorous practice, so I should avoid oversimplifying. They're clearly read up on Dancy and McDowell. I'll concede that we use general terms for communication, but insist their moral weight is entirely context-dependent. The "explanatory bedrock" point is crucial - particularists see moral perception as fundamental, not derived from principles.

  I wonder if they're nervous about the debate? They specifically asked for "serious" opposition, suggesting they want to be properly challenged. The single-paragraph format request shows they're simulating real dialogue. I should keep responses tight but substantive - no lectures.

  Noticing they didn't name-drop any particularists. Maybe I should reference Dancy implicitly through the "holism of reasons" concept without making it sound like a textbook. The tone should be collegial but firm - after all, this is for their preparation. 

  Their core challenge is about moral explanation. I need to distinguish between using features descriptively versus prescriptively. We can agree cruelty is bad in this case without committing to it always being bad. The "it just is" accusation is what I must defuse carefully.
answer: |-
  As a particularist, I gladly concede that we *describe* cases using general terms like "cruelty" – this is linguistic necessity, not moral generalism. But your error lies in assuming that labeling a feature *explains* the verdict. When I say "this act was cruel, and that counts against it here," I'm not invoking a universal principle "cruelty is always pro tanto wrong." I'm noting that *in this specific configuration of facts*, this deliberate infliction of suffering *functions* as a wrong-making feature. The *very same behavior* – say, causing pain – could be neutral or even right-making elsewhere (e.g., a surgeon's incision). The "counting against" isn't derived from a principle; it's perceived directly in the particular. My explanation isn't "it just was," but a rich description of *how* these features interact *here* to constitute wrongness – something no thin principle like "avoid cruelty" captures. Principles are post-hoc summaries of such perceptions, not their foundation. So, no, I don't need *any* exceptionless moral truth to explain judgments – I need good moral perception of the case itself. Your turn.  

