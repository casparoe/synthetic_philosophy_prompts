  The scoring key must honestly flag where the quiz fails. For example, if norm-sensitive and contrastivist views give identical answers in all scenarios, I'll need to either add a splitting case or note they're indistinguishable here. 

  I wonder if including a case where norms conflict could help split norm-sensitive from contrastivist views? Like when two duties pull opposite ways. But the user specified no jargon, so it must feel like natural decision-making.

