  Double prevention is tricky... perhaps a bodyguard who doesn't block a bullet when they could have? For the boundary case, I'm considering something like "did the lack of rain cause the drought?" versus "did my not sneezing cause the meeting to end on time?"

  I should watch for pitfalls:
