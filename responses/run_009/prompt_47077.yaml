answer: |-
  Here’s a polished 10-question quiz with scoring key and critical validity notes. Cases are designed to force implicit choices that map cleanly to the four positions while exposing tensions. **Key weaknesses are flagged in the scoring section.**

  ---

  ### **The "What Actually Caused It?" Quiz**  
  *(Answer intuitively—no overthinking!)*  

  1. **Drowning Child**: A child slips into a pond. Their parent sees this but stays seated, reading. A passing stranger also sees but walks away. The child drowns.  
     ➤ A. Only the parent’s inaction caused the death.  
     ➤ B. Both inactions equally caused the death.  
     ➤ C. Neither inaction caused the death; it was the slip/water.  

  2. **Neglected Plants**: Two neighbors promise to water your plants while you’re away. Neither does. The plants die.  
     ➤ A. Neighbor 1’s failure caused the death (they were primary).  
     ➤ B. Both failures together caused the death.  
     ➤ C. Neither failure caused the death—they just died.  

  3. **Silent Witnesses**: A shoplifter steals in front of 10 shoppers. All see it but none report it. The thief escapes.  
     ➤ A. The *group’s* collective inaction caused the escape.  
     ➤ B. *Some specific person’s* inaction caused it (e.g., the first one who saw).  
     ➤ C. Only the thief’s action caused it.  

  4. **Goalkeeper’s Choice**: A soccer ball rolls toward the goal. The goalkeeper could easily dive to stop it but doesn’t. It scores.  
     ➤ A. The goalkeeper’s *inaction* caused the goal.  
     ➤ B. The *attacker’s kick* caused the goal; the keeper just didn’t prevent it.  
     ➤ C. The goal happened—no "cause" beyond physics.  

  5. **Missed Antidote**: A doctor is off-duty hiking when someone collapses from venom. The doctor has antidote but doesn’t administer it. The person dies.  
     ➤ A. The doctor’s inaction caused the death.  
     ➤ B. The *venom* caused the death; the doctor just didn’t interfere.  
     ➤ C. Neither—deaths happen without causes sometimes.  

  6. **Rainless Drought**: A region relies on seasonal rain. One year, no rain falls for months. Crops fail.  
     ➤ A. The *lack of rain* caused the crop failure.  
     ➤ B. The *sun/heat* caused the failure; "no rain" isn’t a cause.  
     ➤ C. It’s just nature—no "cause" to assign.  

  7. **Unlit Candle**: A power outage hits. You could light a candle but choose not to. You stub your toe in the dark.  
     ➤ A. *Your choice not to light the candle* caused the stubbed toe.  
     ➤ B. The *outage* caused the stubbed toe.  
     ➤ C. Accidents happen—no deeper cause.  

  8. **Untied Shoelace**: A runner’s shoelace is untied. They trip and break their ankle.  
     ➤ A. *The runner’s failure to tie it* caused the break.  
     ➤ B. *The untied lace* caused the break.  
     ➤ C. Trips are random—no "cause" needed.  

  9. **Double Guard Failure**: Two bodyguards could each block an assassin’s bullet. Both hesitate and do nothing. The target dies.  
     ➤ A. *Bodyguard 1’s hesitation* caused the death (they were closer).  
     ➤ B. *Their joint inaction* caused the death.  
     ➤ C. Only the *assassin’s bullet* caused it.  

  10. **Unsneezed Moment**: During a silent concert, you feel a sneeze coming but suppress it. No one notices.  
      ➤ A. *Your not sneezing* caused the silence to continue.  
      ➤ B. *Nothing was disrupted*—so no cause to mention.  
      ➤ C. Silence doesn’t need "causing."  

  ---

  ### **Scoring Key**  
  Tally your answers, then match to positions:  

  | Answer Pattern                                                                 | Position                       |  
  |--------------------------------------------------------------------------------|--------------------------------|  
  | **Mostly A’s**: (Especially in 1, 2, 3, 4, 5, 7, 8, 9)                         | (a) **Lewis-style Generalist** |  
  | **Mostly B’s**: (Especially in 1, 4, 5, 6, 8 + C in 10)                        | (b) **No-Absence View**        |  
  | **Mixed A/B’s**: *Specifically*: A in 1, 3, 5—but B/C in 6, 10 and C in 7      | (c) **Norm-Sensitive View**    |  
  | **Mixed A/C’s**: *Specifically*: A in 2, 4, 9—but C in 1, 6, 7, 10             | (d) **Contrastivist View**     |  

  ### **Where the Quiz Fails (Crucial Notes)**  
  1. **Norm-Sensitive (c) vs. Contrastivist (d) Collapse**:  
     - They *can* be separated! **Quiz succeeds** via Q1 (parent/stranger): Norm-sensitive picks A (parent’s duty matters); contrastivist picks C (neither caused it—outcome was overdetermined by the slip).  
     - **But**: If a reader picks identical answers for both, they likely conflate norms with contrastive salience. Add a **splitting case**:  
       > *Traffic Jam*: Two drivers independently could clear road debris; neither does. An ambulance is delayed.  
       ➤ A. *Driver 1’s inaction* caused the delay (they’re a city employee).  
       ➤ B. *The debris* caused the delay; inactions didn’t add anything.  
       ➤ C. *Both inactions together* caused the delay.  
       - (c) Picks A (role-based norm). (d) Picks C (contrast: debris alone vs. debris+inactions).  

  2. **"No Cause" Ambiguity**:  
     - Positions (b) and (d) both select "no cause" options (C’s in Q4,6,7,10), but (b) does so *systematically*, while (d) uses it only when contrasts are symmetrical (e.g., Q1, Q10).  
     - **Risk**: Readers who pick C’s randomly may be mis-sorted as (d).  

  3. **Incoherent Combos**:  
     - **A in Q10 + Mostly B’s**: Claims trivial absences cause but rejects duty-bound omissions? Logically unstable.  
     - **C in Q2 + A in Q9**: Denies collective causation but accepts overdetermined double-prevention? Unexplored.  

  4. **Case Critiques**:  
     - **Q6 (Rainless Drought)**: Tests boundary absence but may misfire. *Adjustment*: Specify "farmers depended *only* on rain," ruling out alternative causes.  
     - **Q3 (Silent Witnesses)**: Collective case slightly favors (a)/(c). Strengthened by adding "no one was designated to report."  

  5. **Position Validity**:  
     - The fourfold split holds, but **real-world readers may hybridize**. Example: A "weak contrastivist" might align with (c) on duty cases. The quiz forces discrete bins—flag this in results.  

  ---

  ### **Results Template for Blog**  
  > *"You lean toward [POSITION]. Like [example thinker], you [brief description]. But be warned: real philosophers wrestle with cases like Q__ where your answer [tension]. Try the quiz again—did you *really* hold this view all along?"*  

  This instrument reliably splits (a), (b), and the (c)/(d) pair—with Q1 splitting the latter. For full separation, include the *Traffic Jam* case. All mandated cases are included and diagnostic.
