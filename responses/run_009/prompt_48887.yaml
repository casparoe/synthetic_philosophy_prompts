  2.  **Conceptualism Doesn't Unacceptably Exclude Animal/Infant Consciousness**  
      *P = 0.30*  
      Justification: HOT's conceptualism *does* price out many creatures (Rosenthal accepts this cost). Alternatives (e.g., graded HOTs, non-conceptual HO states) are ad hoc or stretch "representation" thin. Major cost, widely acknowledged even by proponents.

  3.  **HOT Explains Phenomenality Better Than First-Order/Recurrency Theories**  
      *P = 0.60*  
      Justification: HOT better handles dissociations (e.g., subliminal vs. conscious processing), but recurrent processing (e.g., Lamme) or global workspace (GWT) offer leaner explanations for access. HOT's uniqueness claim is contested; empirical predictions overlap significantly (e.g., prefrontal involvement ≠ constitutive).

  4.  **Self-Representationalism Counts as a Genuine HOT Variant**  
      *P = 0.35*  
