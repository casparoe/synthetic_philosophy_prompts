  For betting: if conditionals aren't truth-apt, how can we bet on them? I recall de Finetti's idea - we only settle bets when A is true; if A is false, the bet's off. That preserves the P(C|A) intuition without needing a proposition. But is that satisfying? The user might feel cheated - like they're not betting on a "real" thing.

