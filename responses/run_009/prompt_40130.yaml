  We are going to design a classroom activity to illustrate Fitch's paradox. The goal is for students to experience the tension between the idea that every truth is knowable and the impossibility of unknown truths (as derived in the paradox). The activity will have two rounds and then a debrief.

  Key elements of Fitch's paradox:
  1. The knowability principle (KP): ∀p (p → ◊Kp) [if p is true then it is possible to know p]
  2. The fact that knowledge requires truth: Kp → p
  3. The distributivity of knowledge over conjunction: K(p ∧ q) → (Kp ∧ Kq)
  4. The Moorean proposition: p ∧ ¬Kp [p is true but not known]

  The paradox: if we assume KP and that there is an unknown truth (i.e., ∃p (p ∧ ¬Kp)), then we can derive a contradiction. Specifically, by KP applied to the unknown truth p ∧ ¬Kp, we get ◊K(p ∧ ¬Kp). But K(p ∧ ¬Kp) implies Kp ∧ K¬Kp, which by factivity (K¬Kp → ¬Kp) and distributivity leads to Kp ∧ ¬Kp, a contradiction. Hence, if KP holds, there cannot be any unknown truth, so every truth is known.

  Activity Design:

  Round 1: Generating Unknown Truths
  - Each student writes down a true statement that is currently unknown by everyone in the room on an index card. The statement must be:
    (a) true at the moment of writing,
    (b) unknown to every student and the instructor at that moment,
    (c) such that it can be verified later (to become known) without changing its truth value (to avoid temporal issues and self-defeating claims).
  - The card is then sealed in an envelope (or folded and stapled) so that it cannot be seen until later.
  - The instructor collects all the envelopes.

  Round 2: Verification under Knowability
  - The class adopts a rule: "Any true claim that is asserted must be capable of being known by everyone." (This is a simplified version of the knowability principle.)
  - We then try to verify the claims one by one. For each envelope:
    - The envelope is opened and the claim is read aloud.
    - The class attempts to verify the claim (i.e., to make it known to everyone). 
    - If they succeed in verifying it (so that now everyone knows it), then the student who wrote it gets a point (or candy). 
    - However, note: at the time of writing, the claim was unknown. Now, at verification time, we are in the future relative to writing.

  The catch: some claims, especially Moorean ones (like "This jar contains 37 coins and no one in the room knows that"), will cause problems when we try to verify them. Specifically, when we read the claim and then verify the jar has 37 coins, we now know it. But the claim said "no one in the room knows that" at the time of writing. Now, at the time of verification, we are in a position where we know the jar has 37 coins, but the claim also included that no one knew it at the earlier time. So the claim is still true (because at the time of writing, no one knew) but we can see that the claim itself, when known, would lead to a contradiction if we tried to assert that it was unknown at the same time that we know it.

  But note: the temporal element is tricky. We are trying to avoid the temporal reading because the paradox is usually presented without time.

  How to handle time?
  We must make it clear that the "unknown" part is relative to the moment of writing (t0) and the verification happens at a later time (t1). The paradox in its original form is atemporal. So we need to simulate a static moment.

  Alternative approach without time? It's very hard because knowing is a temporal process.

  We might reframe the activity to be about a fixed moment. How?

  Idea: Instead of having the students write about the present, we have them write about a fixed past event that is unknown. But then we might run into issues of memory.

  Alternatively, we can use an object that is fixed and unknown until we look. For example, a sealed box with a number of marbles. The claim is: "The box contains exactly n marbles and no one in the room knows that at time t0." Then at t1 we open the box and count. We then know the number. But note that the claim is about t0, so at t1 we can know that at t0 no one knew. So the claim, when known at t1, is consistent.

  But then we don't get the contradiction because the claim is about the past.

  So how to get the Moorean contradiction? We need a claim that is about the present state of knowledge at the time of verification? But that is unstable.

  Another idea: use a claim that is not about the past but about the very act of verification. But that might be too meta.

  Alternatively, we can have a two-step process for the Moorean claims:

  Step 1: At t0, the student writes: "p and no one in the room knows p at t0", where p is a contingent fact (like the number of marbles in the jar) that is unknown at t0.

  Step 2: At t1, we open the envelope and then we try to verify p. We count the marbles and establish p. Then we are about to assert the entire claim: p and no one knew p at t0. But note, we now (at t1) know p and we also know that at t0 no one knew p. So the entire claim is known at t1. But the knowability principle in the game says that the claim must be capable of being known. And we have just known it. So it seems to work.

  But then we don't get a contradiction because the claim is about t0 and we are at t1. The paradox requires that the same agent at the same time cannot know a Moorean proposition.

  So we need to simulate a single moment. How?

  Idea: We have a set of claims that are written and then immediately we try to verify them without revealing them? That doesn't make sense.

  Alternatively, we can have a claim that is not tied to a specific time. For example, a mathematical truth that no one in the room knows? But then it's hard to verify quickly.

  Perhaps we should embrace the temporal aspect and then in the debrief explain that the paradox is usually atemporal, and the escape route of temporality is one way out. Then we can discuss the atemporal version separately.

  But the instructor wants to avoid teaching the temporal escape.

  Revised plan:

  We design a claim that is about the current state of knowledge at the moment of verification. For example:

  - We have a light that is either on or off. The state is set at the beginning of class and hidden. The claim is: "The light is off and no one in the room knows that the light is off."

  But when we reveal the claim and then check the light, we run into:

  At t0 (writing): the light is off and no one knows it is off -> true.
  At t1 (verification): we read the claim and then check the light. Now we know the light is off. But the claim says "no one knows the light is off" at the time of writing? Or at the time of verification?

  We must design the claim to be about the time of verification. So the student writes: "At the moment this claim is read aloud, the light is off and no one in the room knows that the light is off at that very moment."

