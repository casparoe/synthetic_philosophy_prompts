     So in the activity, for a Moorean claim, we can try to verify it at the moment of writing. We will see that we cannot complete the verification in time for the same moment. The verification takes time and by the time we know p, the moment has passed.

     Then we can say: "See, we couldn't know it at the exact moment when it was true. We could only know it later. But the knowability principle is often interpreted as requiring that a true proposition must be knowable at the time it is true. And for the Moorean proposition, that is impossible."

     Then we can relate to the derivation.

  So revised for Moorean claims:

  - The student writes a Moorean claim and immediately hands it to the instructor.
  - The instructor immediately reads it aloud and notes the exact time (say, 10:00:00).
  - Then the class immediately sets out to verify p. But verification takes time (even 10 seconds). So at 10:00:00, we do not know p. At 10:00:10, we might know p.
  - Then we can say: the claim was true at 10:00:00, but we could not know it at 10:00:00 because to know it we would have to know p and know that no one knows p at 10:00:00. But to know that no one knows p at 10:00:00, we would have to have a godlike view of everyone's knowledge at that exact moment, which we cannot achieve in practice. And even if we could, if we came to know p at 10:00:00, then we would be knowing p at that moment, so the claim would be false.

  Therefore, we can conclude that the Moorean claim is unknowable at the moment it is true.

  For non-Moorean claims, we can verify them later without problem.

  Round 2 will then be for the non-Moorean claims. The Moorean ones we handle immediately during round 1.

  Activity Outline:

  1. Introduction (5 minutes)
     - Explain the goal: to explore the relationship between truth and knowability.
     - Rules for writing claims: must be true, unknown to everyone at the moment of writing, and verifiable.

  2. Writing claims (5 minutes)
     - Students write claims. They can choose to write a simple claim or a Moorean claim (explained as: a claim that states a fact and that this fact is currently unknown).

  3. Handling Moorean claims (10 minutes)
     - For each student who wrote a Moorean claim:
          - They hand it to the instructor immediately.
          - Instructor reads it aloud and notes the time.
          - The class then verifies p (the fact part) as quickly as possible.
