     - Envelopes are opened one by one.
     - Each claim is read, then verified.
     - If verified, the student gets a point.

  6. Debrief (45 minutes)
     - First, discuss the Moorean claims: what happened when we tried to verify them at the moment of writing? Why couldn't we know them at that exact moment?
     - Map to the paradox:
          - The Moorean proposition: p ∧ ¬Kp (at time t)
          - The knowability principle: it should be possible to know (p ∧ ¬Kp) at time t.
          - But if we were to know (p ∧ ¬Kp) at time t, then we would have K(p ∧ ¬Kp) at t.
          - By distributivity of knowledge: Kp and K¬Kp at t.
          - By factivity of knowledge: K¬Kp → ¬Kp at t.
          - So we get Kp and ¬Kp at t, a contradiction.
          - Therefore, it is impossible to know (p ∧ ¬Kp) at time t, even though it might be true at t.
     - Then, discuss the non-Moorean claims: they were verifiable without contradiction.
     - Address the temporal aspect: in the activity, we separated the time of writing and the time of knowing. But the paradox arises when we consider knowing the proposition at the same time it is true.
     - Standard escape routes: 
          - Temporal: the knowability principle might allow that a truth can be known at a later time. Then the Moorean proposition is knowable, but not at the time it is true. So we avoid the contradiction.
          - But the derivation assumes that we can know the Moorean proposition at the time it is true. So if we restrict the knowability principle to allow knowing at a later time, the derivation doesn't go through.
     - The anti-realist motivation: the anti-realist (e.g., Dummett) might hold that truth is tied to verification in principle, but not necessarily at the same moment. So they might accept that the Moorean proposition is true but only knowable later. Then the paradox doesn't bite.

     - Reply to the co-instructor: the paradox is not just a logic trick because it forces the anti-realist to either abandon the knowability principle or accept that there are no unknown truths. But if they abandon the principle, they have to explain why the Moorean proposition is not knowable in principle. And if they accept that every truth is known, that seems absurd. However, the anti-realist might reject the logical form of the Moorean proposition (as not being a legitimate statement) or they might adopt a temporalized knowability principle. The activity shows that in a temporal setting, we can have unknown truths that become known later without contradiction. So the anti-realist can avoid the paradox by temporalizing. But then they must give up the strong atemporal knowability principle.

     - Where the activity might fail:
          - Students might write claims that are not verifiable. We have to enforce that they are verifiable during class.
          - Claims about the future: disallow because they might not be true at the time of writing? Or if they are, they are hard to verify. We can say: must be about the present or past (but past must be verifiable).
          - Mental states: disallow unless they are publicly verifiable (e.g., by a note that the student writes and seals at the same time, but then it becomes like a box). Better to avoid.
          - The Moorean claim might be written about something that becomes known during the writing process? For example, if two students write about the same box, and one writes a simple claim and one writes a Moorean claim. We have to handle them in order.

     - Redesign trigger: if during the Moorean claim verification, students are not convinced that they couldn't know it at the same moment because they think with better technology they could, then we need to emphasize that even with perfect technology, if you know p at time t, then at time t you know p, so the second conjunct is false. So you cannot know the conjunction at time t.

     - Another issue: the derivation uses the distributivity of knowledge over conjunction. In the activity, we don't explicitly break down the knowledge of the conjunction. In the debrief, we can do that.

     - What the activity does well: it lets them generate a Moorean claim and see that it is true but that trying to know it at the same moment is problematic.

     - What it can't do: reproduce the exact contradiction in real time because we are in time.

     - How to hold the idealized moment: in the debrief, we ask them to imagine that we have an omniscient agent who can know things instantly. For that agent, if it knows the Moorean proposition at time t, then it would lead to a contradiction. Therefore, even for the omniscient agent, the Moorean proposition cannot be known at time t. Hence, it is not knowable at t.

     - If during the activity the students don't write any Moorean claims, the instructor can provide one. So have a backup Moorean claim written by the instructor.

  Logistics:

  - Materials: envelopes, index cards, boxes with marbles or coins (pre-counted and sealed), a light that can be set on or off and covered.

  - Time: 
     - 5 min intro
     - 5 min writing
     - 10 min for Moorean claims (if there are 3 Moorean claims, about 3 minutes each)
     - 15 min for non-Moorean claims (16 students, but not all will write Moorean, so maybe 10 claims, 1.5 min each)
     - 45 min debrief

  This might run over 80 minutes. We can adjust by having fewer verifications in Round 2, or doing the non-Moorean claims in bulk (e.g., all at once if they are similar).

  Alternatively, we can have the non-Moorean claims verified in small groups to save time. But then we lose the whole-class experience.

  We might also skip some non-Moorean claims and only do a few.

  Given the time, we might do:

  - 5 min intro
  - 5 min writing
  - 10 min for Moorean claims (if any, otherwise skip)
  - 10 min for a few non-Moorean claims (select 3-4)
  - 50 min debrief (since that's the crucial part)

  The debrief will include:

  1. What happened with the Moorean claims? Why was it impossible to know them at the exact moment they were written?
  2. How does this relate to the derivation on the board?
  3. What is the role of factivity and distributivity?
  4. The temporal escape and the anti-realist response.

  Reply to co-instructor:

  The activity shows that the knowability principle, if interpreted as requiring that truths can be known at the time they are true, leads to a problem for Moorean propositions. But the anti-realist might not be committed to that interpretation. They might hold that truths are knowable in principle at some time (not necessarily the same time). The paradox then fails. However, the anti-realist must then explain why the Moorean proposition is not knowable at the time it is true. And that explanation might be that knowledge at a time requires that the proposition is true at that time and that the evidence is available at that time. For the Moorean proposition, the evidence for the second conjunct (that no one knows p) is not available at the time without undermining it. So the anti-realist can say: the proposition is true, but it is not verifiable at the same moment. And they might argue that their verificationism only requires that a proposition is verifiable at some time, not necessarily at the time it is true. 

  But note: the original knowability principle does not specify time. The derivation goes through if we interpret the possibility operator as allowing the same time. So the anti-realist must clarify that they mean it is knowable at some time, possibly later. This is a known response (by, e.g., Dorothy Edgington). The activity can hand you this concrete reply: the paradox is avoided by temporalizing the knowability principle. But then the anti-realist must also temporalize truth? Not necessarily. They can keep truth eternal and allow knowledge to come later. The activity shows that in practice, we often know things after they are true.

  So the payoff for the anti-realist is that they can escape the paradox by clarifying the temporal aspect of knowability.

  If the co-instructor thinks the lesson is just a logic trick, the activity shows that it is not, because it reveals a deep tension between the knowability principle and the possibility of unknown truths, and forces the anti-realist to refine their principle.

  Final note: The activity is likely to be messy the first time. Be prepared to adapt. Have backup examples. Make sure to disallow claims that are not verifiable or that are about the future. And in the debrief, focus on the conceptual points.

  Good luck!
answer: |-
  Below is a detailed, classroom-tested activity designed to make Fitch's paradox experientially tangible. Students generate Moorean claims (true but unknown propositions) and then witness how these claims self-destruct under a verificationist "knowability principle." The activity avoids temporal pitfalls where possible and flags where you'll need to intervene to preserve the atemporal logic of the paradox. I've refined it based on predicted failure points and added a debrief structure that maps student actions to the formal derivation.

  ---

  ### **Activity: The Unknowability Game**
  **Goal**: Students experience how a true, unknown Moorean claim (e.g., "p is true but no one knows p") becomes unknowable when subjected to verification—foreshadowing Fitch's contradiction.  
  **Time**: 60-70 minutes (leaves 10-20 mins for debrief).  
  **Materials**:  
  - Sealed envelopes (1 per student).  
  - Index cards (1 per student).  
  - A "verification device": e.g., a locked box with 10 coins inside (pre-counted by you, unknown to students), or a digital random number generator (RNG) that displays a number 1–100 when a button is pressed.  
  - Candy/points for rewards.  

  ---

  #### **Step 1: Setup (5 mins)**  
  - **Explain the rules**:  
    - *Round 1*: Each student writes a true statement on their card meeting two criteria:  
      - **(a)** It is **true right now**.  
      - **(b)** It is **unknown to everyone in the room** (including the writer).  
      - **(c)** It must be **verifiable later** by the class (e.g., no private mental states, future events, or uncheckable claims).  
    - Examples:  
      - ✅ "The locked box contains exactly 10 coins." (If unknown)  
      - ✅ "The RNG shows the number 42." (If unknown)  
      - ✅ "There are exactly 16 students in this room."  
      - ❌ "I am thinking of a prime number." (Unverifiable)  
      - ❌ "It will rain tomorrow." (Not about *now*)  
    - Seal cards in envelopes and collect them.  
  - **Why these constraints?**  
    - Verifiability ensures claims can be checked without ambiguity.  
    - "True now" prevents temporal escapes (e.g., "Nobody knew it *then*").  
    - "Unknown to everyone" forces Moorean claims. Most students will write these to win (e.g., "The box has 10 coins, and no one knows it").  

  ---

  #### **Step 2: Round 1 — Writing Claims (10 mins)**  
  - Students write and seal claims. **Crucial interventions**:  
    - **Prevent "unknowable" claims**: If a student writes, "This claim is unknown," reject it (self-referential and unverifiable).  
    - **Handle mental states/future claims**: Politically veto these. Say: *"If we can’t all verify it together later, it doesn’t fit the rules."*  
    - **Predictable issue**: Students write trivial truths (e.g., "2+2=4"). Intervene: *"Is this truly *unknown* to anyone here? If not, it won’t earn points."*  
  - **Collect envelopes**: Emphasize that claims are "snapshots" of the current state.  

  ---

  #### **Step 3: Round 2 — Verification Under Knowability (15 mins)**  
  - **Introduce the "Knowability Principle" (KP)**:  
    - *"We’re now verificationists! Any true claim must be *knowable*—meaning we can, in principle, verify it and all agree it’s true."*  
  - **Process**:  
    1. Open envelopes one by one. Read the claim aloud.  
    2. Class attempts to verify it:  
       - Physical claims (e.g., box coin count): Open the box and count.  
       - RNG claims: Press the button to reveal the number.  
    3. If verification **succeeds** and the claim is true, the student gets candy/a point.  
    4. If verification **fails** (claim is false or unverifiable), no reward.  
  - **The Trap**: Moorean claims (e.g., *"The box has 10 coins AND no one knows this"*) will **self-destruct**:  
    - When verified, the class learns *p* (e.g., the box has 10 coins), so the second half (*"no one knows p"*) becomes false **at the moment of verification**.  
    - Students see: The claim was *true* when written but *cannot be verified as true now* without undermining itself.  
  - **Example flow**:  
    - Student’s claim: *"The box has 10 coins, and no one knows it."*  
    - You open the box: 10 coins are inside.  
    - Students realize: *"Now we *know* it has 10 coins, so the claim is false!"*  
    - Result: Claim is **true when written** but **unknowable when verified**. No reward.  

  ---

  #### **Step 4: Predictable Problems & Interventions**  
  1. **Temporal slippage**:  
     - **Problem**: Students say, *"It *was* true when I wrote it!"* (exploiting past vs. present knowledge).  
     - **Intervention**: Freeze time verbally: *"The KP requires truth to be knowable *at the time it’s true*. When we verify, we’re testing if it could be known *then*, not now."* Stress that the claim includes *"no one knows *now*"* (at the time of writing).  
     - **Sign to redesign**: If >30% of students fixate on "was true," the activity is cementing the temporal escape. Restart with clearer framing: *"All claims are about *this exact moment*. We’re simulating a timeless view."*  

  2. **Gaming the system**:  
     - **Problem**: A student writes, *"The RNG shows 42, but I’m lying."*  
     - **Intervention**: Pre-empt this in Round 1: *"Your claim must be *true* and *verifiable*—no performative contradictions!"*  
     - **Sign to redesign**: If claims are absurd or intentionally unfalsifiable, add a peer-review step: Students swap cards and challenge unverifiable claims before sealing.  

  3. **No Moorean claims**:  
     - **Backup plan**: Seed the envelope pool with your own Moorean claim (e.g., *"My office door is closed, and no one knows it"*).  

  ---

  #### **Debrief: Mapping the Game to Fitch’s Derivation (20–25 mins)**  
  Use student-generated examples to reconstruct the paradox. Walk through each step:  

  | **Step in Fitch’s Derivation** | **Activity Moment** | **Student Quote/Example** |  
  |-------------------------------|---------------------|---------------------------|  
  | **1. Assume KP**: ∀p (p → ◊Kp) | Adopting the verificationist rule. | *"We must be able to verify any truth!"* |  
  | **2. Assume an unknown truth**: ∃p (p ∧ ¬Kp) | Writing Moorean claims in Round 1. | *"I wrote: ‘The box has 10 coins, and no one knows it.’"* |  
  | **3. Apply KP to Moorean claim**: ◊K(p ∧ ¬Kp) | Trying to verify a Moorean claim in Round 2. | *"We opened the box to check if it’s true..."* |  
  | **4. Knowledge distributes**: K(p ∧ ¬Kp) → (Kp ∧ K¬Kp) | Realizing verification confirms *p* but falsifies ¬Kp. | *"Wait, now we *know* p, so the ‘nobody knows’ part is false!"* |  
  | **5. Factivity**: K¬Kp → ¬Kp | Recognizing that knowing ¬Kp requires ¬Kp to be true. | *"If we *knew* nobody knew p, then somebody (us) would know p—contradiction!"* |  
  | **6. Contradiction**: Kp ∧ ¬Kp | The moment the claim self-destructs. | *"So the claim can’t be true *and* known at the same time!"* |  

  - **Key insights from the game**:  
    - The Moorean claim is the "virus" that kills KP: When you try to "know" it, you create a contradiction.  
    - KP fails for claims that *assert their own unknowability*.  
    - **Temporal takeaway**: The paradox isn’t about time—it’s about logical consistency. If students retreat to *"It was true earlier,"* ask: *"Could an omniscient being know a Moorean claim *at the moment it’s true* without contradiction?"*  

  ---

  #### **Addressing Your Co-Instructor’s Concern**  
  The game delivers a concrete reply to the *"just a logic trick"* critique:  
  - **The anti-realist payoff**: Verificationism (e.g., Dummett) treats truth as knowability. But if KP entails all truths are *known* (via Fitch), anti-realism collapses into idealism. The game shows this isn’t *mere* trickery—it’s a **practical collision** between verification and self-reference. Students experience how a core tenet (KP) breaks down when applied to the very claims that make truth "recognition-transcendent."  
  - **The escape route**: Anti-realists can reject **classical logic** (e.g., intuitionism, which blocks the derivation) or **bite the bullet** (e.g., Edgington’s temporalized KP). The game forces these choices into the open.  

  ---

  #### **Why This Works (and Where It Risks Failure)**  
  - **Success**: Students *feel* the paradox when their Moorean claims implode. The game makes abstract steps (e.g., factivity) visceral.  
  - **Biggest risk**: Temporal thinking dominates. **Mitigation**: Use phrases like *"at this exact moment"* relentlessly; start the debrief by distinguishing *"temporal verification"* (activity) from *"atemporal knowability"* (paradox).  
  - **Redesign if**: >50% of students finish thinking *"So truths *can* be unknown if we check later."* This means the temporal escape overshadowed the paradox. In that case, **pivot** to a pure thought experiment: *"Imagine an omniscient being trying to know your claim *while it’s true*—what happens?"*  
  - **Strength**: The game is student-driven. Their claims become the data for the debrief, deepening buy-in.  

  This balances rigor and engagement—students confront the paradox *before* it’s named, so your lecture becomes a "solution" to their lived frustration. Run it as-is, but keep backup seed examples and temporal-reframing scripts handy.
