        - If there are 10 marbles, then the first part is true. But at 10:00 am, when the claim was read, we all heard that the student claimed there are 10 marbles. But we don't know it until we count. So at 10:00, we still don't know. Then we count and it becomes known. But the claim is about 10:00. At 10:00, we didn't know. So the claim is true. 

