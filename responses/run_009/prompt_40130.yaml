  Alternatively, we can have the claim be about the state of the light and the state of knowledge at the time of reading, and then we verify the light immediately. But the knowing the claim would require knowing both the light and the state of knowledge at the same time.

  The problem: to know the claim at t_read, we would have to know that the light is off and that no one knows it at t_read. But if we come to know that the light is off at t_read, then at t_read we know it, so the second conjunct is false. Hence, the claim cannot be known at t_read.

  But in the activity, we are not trying to know the claim at t_read. We are trying to verify it later. So we don't get the contradiction in the activity.

  We need to simulate the atemporal case. How?

  We might have to use a different kind of claim: one that is not about the physical world but about the game itself. For example, a claim about the claims in the envelopes.

  But that might be too complex.

  Alternatively, we can abandon the physical setup and use a logical example. But that might not be experiential.

  Another idea: use a claim that is self-referential in a way that forces the issue. For example: "This claim is not known by anyone at the moment it is written." But then when we read it, it's about the moment of writing, so again we avoid the contradiction.

  We might be forced to have the debrief focus on the temporal aspect and then explain the atemporal version.

  Given the constraints, I propose we proceed with the temporal setup and then in the debrief explicitly address the difference and how the paradox is usually presented without time. We can then show the derivation on the board and relate the steps to the activity.

  Activity Structure:

  Round 1: 
  - Before class, set up a few sealed boxes with known (to the instructor) but unknown (to students) contents. For example, box A has 10 marbles, box B has 20, etc. Also, have a light or a switch that is set to a state (on/off) and covered so that it cannot be seen.
  - Each student writes a claim on an index card. The claim must be:
     (a) true at the time of writing,
     (b) unknown to every person in the room at the time of writing,
     (c) verifiable by the class during the session.
  - Examples of allowed claims:
     - "Box A contains exactly 10 marbles." (if that is true and unknown)
     - "The light is off." (if that is true and unknown at the time of writing)
     - "There are exactly 16 students in the room." (if they are sure, but they might not be, so it's risky)
     - Disallowed: claims about the future, claims about mental states (unless they are verifiable, e.g., by a brain scan, which we don't have), claims that are about the current state of knowledge in a way that becomes false when read (unless we design a specific one).

  We also allow Moorean claims of the form: "p and no one in the room knows p at the time of writing", where p is a verifiable fact.

  Round 2:
  - The class adopts the rule: "Every truth is knowable in principle. Therefore, we can try to verify any true claim and make it known to everyone."
  - We go through the envelopes. For each claim:
     - The envelope is opened and the claim is read aloud.
     - The class then attempts to verify it.
     - If it is verified and becomes known to everyone, the student gets a point.

  For a Moorean claim: 
     - The claim is: "p and no one in the room knew p at time t0" (where t0 is the time of writing).
     - We verify p (e.g., by counting marbles). Then we know p at the current time (t1).
     - We also know (from memory) that at t0 no one knew p. So the entire claim is known at t1.
     - So the student gets the point.

  But note: there is no explosion. The claim is verified. So how do we get the paradox?

  We don't get a contradiction in the activity because of the temporal separation. The claim is about t0 and we are verifying at t1.

  To get the paradox, we must consider what happens if we try to know the Moorean claim at t0. But we cannot because we are at t0, and if we knew it then the second conjunct would be false.

  But in the activity, we are not at t0 when we try to know it. We are at t1.

  Therefore, we must rely on the debrief to explain the atemporal case.

  In the debrief, we can say:

  "Imagine that we try to know the Moorean claim at the very moment it is written. What would happen? Suppose at t0 we try to verify the claim 'p and no one knows p'. To verify it, we would have to verify p and verify that no one knows p. But if we successfully verify p, then we know p, so the second part becomes false. Therefore, at t0 we cannot verify the claim without making it false. Hence, the claim cannot be known at t0, even though it is true at t0. This shows that the knowability principle fails for this claim at t0: it is true but cannot be known at the same moment. And if we assume that the knowability principle requires that it can be known at the time it is true, then we have a problem."

  Then we can write the derivation on the board.

