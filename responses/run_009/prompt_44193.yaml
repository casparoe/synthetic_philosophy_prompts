prompt: |-
  Me and two friends have been arguing about moral realism for basically a year now in our reading group and it's gotten to the point where we mostly talk past each other. One of us is a moral realist (thinks there are stance-independent moral facts, roughly, and that some of them are knowable), another is more of an anti-realist/error-theorist type, and the third keeps insisting half the fight is just semantic. We've decided to do this properly and write up a joint document, like an adversarial collaboration, and I got assigned to draft it. Help me out.

  Here's what I want: a numbered section of claims both sides can actually sign -- things like what the disagreement is even about, that moral judgments behave like beliefs in some ways and like attitudes in others, that whatever else is true, genocide and cruelty-for-fun are not okay, that our moral beliefs have evolutionary and cultural causes which in itself doesn't settle anything, that the mere existence of persistent disagreement doesn't prove there's no fact of the matter (people persistently disagreed about astronomy). Then a disagreements table where the exact remaining disagreements are stated in wording each side would accept as a fair statement of its own view -- not a caricature.

  For the cruxes I suspect a few: whether debunking explanations of our moral beliefs are self-undermining or not (the realist says the debunker needs norms of reasoning to even make the argument, the anti-realist says that just smuggles normativity back in); whether the realist can say anything non-mysterious about how we'd access moral facts; whether the anti-realist can explain why some moral claims feel so obviously true (or obviously false) that even they can't fully dismiss them -- the "companions in guilt" thing. For each crux, write down what kind of case or argument both sides would agree bears on it, and what each side would predict about it. And if you think part of the fight is really just verbal -- say, over what deserves the word "fact" -- please say which part and why, since our third friend will be smug about it either way. Also we'd honestly accept a rough probability/resemblance judgment on the Knobe-effect adjacent stuff if it comes up (do folk intuitions about intentionality cut any ice here), but only if it actually does real work, not as padding.
