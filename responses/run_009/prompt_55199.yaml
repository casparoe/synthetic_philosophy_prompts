  Step 1: Foundationalism as well-founded recursion.
  - In recursion, we have base cases that don't require further recursive calls. Similarly, foundationalists have basic beliefs that do not require justification from other beliefs (e.g., perceptual beliefs, self-evident truths).
  - The recursion must terminate: every chain of justification eventually hits a base case.
  - Mapping: Clean. The base case in recursion is like the basic belief. The recursive step is like deriving a belief from other beliefs. The termination condition ensures no infinite regress.

  Step 2: Coherentism as corecursion/coinduction.
  - Coherentism: beliefs are justified by their coherence with other beliefs in a web. There is no foundation, but the system as a whole is justified by the mutual support.
  - Corecursion: defines potentially infinite data by guarded recursion. The key is productivity: you can always get the next piece (like the next element of a stream). Bisimulation proves that two such definitions are equivalent by observing they produce the same outputs.
  - Mapping: The circularity in coherentism is like the circular definition in corecursion. But in programming, we require the circularity to be guarded (by constructors) so that it is productive. Similarly, coherentism requires that the circularity is not vicious (it must be a virtuous circle). 
  - However, note: In coherentism, the justification of a belief is not by definition but by its role in the system. The mapping to corecursion might be more about the structure of the system than the process of justification. 
  - Also, bisimulation: two different belief systems (webs) might be bisimilar if they yield the same justifications for the same beliefs? But that might be a stretch.

  Step 3: Infinitism as an infinite lazy stream.
  - Infinitism: justification is an infinite, non-repeating chain. Each belief is justified by the next, and there is no end. But every finite segment is justified when needed (on demand).
  - Lazy stream: we can have an infinite list, but when we take a finite prefix, it is computed by evaluating the chain as far as needed. 
  - Mapping: Clean in the sense of on-demand justification. The infinitist says that we don't need to have the entire chain at once, just the ability to provide the next step when asked. This is exactly like lazy evaluation: we don't compute the entire infinite chain until we need a finite part.

  Step 4: The bootstrap compiler.
  - The foundationalist's basic beliefs are like the trusted bootstrap compiler. Before you can have a self-hosting compiler (a system that can compile itself), you need a simple, trusted compiler (possibly written in a different language) to get started. Similarly, the basic beliefs are the starting point that we trust without further justification.

