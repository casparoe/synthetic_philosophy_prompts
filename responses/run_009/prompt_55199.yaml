          - The residue: the programming model naturally accommodates both finite and infinite structures, and both eager and lazy evaluation. But in epistemology, the foundationalist and coherentist might be seen as requiring the entire structure to be "computed" (justified) at once? Not necessarily: foundationalists might allow that we only justify when asked, by traversing down to the base. Coherentists might also allow that we justify a belief by showing its connections to others, without having to traverse the entire web. So the on-demand aspect is common to all.

