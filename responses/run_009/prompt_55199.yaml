     - **The on-demand vs. all-at-once justification**:
          - This is a key point. The user suspects that the debate might be about whether we require justification for a belief to be available on demand (like the infinitist's chain, which we can always extend) or whether the justification is the entire structure (like the foundationalist base or the coherentist web). 
