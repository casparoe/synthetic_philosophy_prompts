          - The guardedness condition in corecursion (to ensure productivity) doesn't have a direct counterpart in coherentism. Coherentists don't usually specify a "guard" condition. They might argue that the web of beliefs must be consistent, comprehensive, and explanatory, which might serve a similar role (ensuring that the system is productive of justification). But it's not a perfect match.
