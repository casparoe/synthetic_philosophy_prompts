prompt: |-
  I teach an intermediate ethics course — 18 students, one 75-minute session — and we're coming to the is-ought gap. Design an in-class activity built around the experience of trying to cross the gap and (mostly) failing. Structure it in two rounds: in Round 1, teams arguing for a campus policy rule may cite only observable facts, and a designated referee strikes any premise that smuggles in evaluative content; in Round 2, institutional facts such as promises, elections, and rule-attachments become admissible, so the group can watch premises that look descriptive start doing quiet normative work. I want the full rules, the strike procedure (including how contested strikes get resolved), and a scoring scheme that doesn't involve real money. The debrief should map specific moments in the activity onto (i) Hume's is-ought gap, (ii) Moore's open question argument, and — importantly — the difference between the two, which my students reliably conflate; it should also treat Searle's promise-based derivation as a live challenge rather than a strawman, and take a position on whether Round 2 constitutes a genuine crossing of the gap or merely normativity hidden in the premises. Please structure your response with these sections, in this order: (1) Materials and setup, roughly 100 words; (2) Round 1 rules and strike procedure, roughly 150 words; (3) Round 2 rules, roughly 120 words; (4) Debrief plan, roughly 250 words; (5) Predictable failure points and how to handle them, roughly 100 words; (6) An honest note on which parts of the metaethical debate — e.g., expressivist or Cornell-realist responses to the gap — no classroom game can reproduce, roughly 80 words.
reasoning: |-
  Okay, the user is teaching an intermediate ethics course and needs an in-class activity on the is-ought gap. Let me start by understanding their requirements. They want a two-round activity where students try to bridge the gap, failing in the first round and possibly succeeding in the second with institutional facts. The debrief needs to cover Hume, Moore, Searle, and whether Round 2 truly crosses the gap.

  First, I need to design the materials and setup. They have 18 students and one 75-minute session. Splitting into teams of 3 seems manageable, so six teams. Each team needs a policy rule. Examples like mandatory attendance or carbon neutrality make sense because they're relatable campus issues. The referee role is crucial here—probably the instructor or a TA to avoid bias. Materials should be minimal: policy cards, timers, whiteboard for tracking strikes.

  For Round 1, only observable facts are allowed. The key is enforcing the gap. The strike procedure needs to be clear. Referees should flag premises with evaluative language. Contested strikes resolved by the instructor ensures consistency. Scoring without money: points for unstruck premises and strikes against opponents. This keeps it competitive but focused on learning.

  Round 2 introduces institutional facts—promises, elections, rules. The challenge is showing how these seem descriptive but carry normativity. Teams can reference campus governance documents. Rules here might allow more flexibility but still need monitoring for hidden oughts.

  Debriefing is critical. The user mentioned students conflate Hume and Moore. So, mapping activity moments to each is essential. For Hume, point out when factual premises couldn't lead to a policy conclusion without an ought. For Moore, when students felt a policy was still questionable despite facts. Searle's promise example from Round 2 can show institutional facts creating obligations. The big question: did Round 2 cross the gap or hide normativity? Arguing that institutional facts depend on prior norms addresses Searle's challenge but shows the gap remains foundational.

  Predictable failures: teams might still sneak in oughts. Referees need examples during setup. Confusion over institutional facts—clarify with examples. Debrief time crunch—stick to key points. Philosophical limitations: the activity can't capture expressivist or Cornell-realist nuances, which require deeper theoretical discussion beyond the game's scope.

  Ensuring the activity fits the time frame. Each round 15 minutes, debrief 25. Setup and transitions take the rest. The examples chosen must clearly illustrate the concepts. Maybe include a sample policy debate in the debrief to highlight specific moments. Also, preparing the referee with a cheat sheet of evaluative terms could help. Finally, emphasizing that Round 2's "success" is illusory because institutional facts rest on prior normative commitments ties back to the metaethical debate without oversimplifying.
answer: |-
  Here’s a structured in-class activity designed for your specifications:

  ---

  ### (1) Materials and Setup (100 words)  
  **Materials:** Whiteboard, timer, 6 policy cards (e.g., "Mandatory attendance at lectures," "Carbon-neutral campus by 2025," "Banning smartphones in class"), sticky notes, referee cheat sheet (list of evaluative terms: e.g., "should," "fair," "right," "harmful").  
  **Setup:** Divide 18 students into 6 teams of 3. Assign each team a policy card. Designate 1 student (or yourself) as the **Head Referee**. Teams draw lots to pair into 3 debate matches (Pro vs. Con). Rules are projected: Round 1 (facts only), Round 2 (facts + institutional facts). Allocate 15 min per round.  

  ---

  ### (2) Round 1 Rules and Strike Procedure (150 words)  
  **Rules:** Teams have 5 min to build arguments *for* their policy using **only observable facts** (e.g., "60% of students miss lectures," "Campus emits 1,000 tons of CO2/year"). No appeals to values, goals, or obligations.  
  **Strike Procedure:**  
  - The Head Referee monitors all teams. Any premise suspected of smuggling normative content (e.g., "Absences *harm* learning," "Emissions *should* be reduced") is flagged with a sticky note.  
  - Teams can contest strikes within 1 min: State why the premise is purely descriptive. The Head Referee’s decision is final.  
  - **Scoring:** +1 point per *unstruck* premise used in debate; -1 per strike. Teams earn +2 for exposing an opponent’s normative premise.  
  *Goal:* Experience futility of deriving "ought" from "is."  

  ---

  ### (3) Round 2 Rules (120 words)  
  **Rules:** Same policies, but teams may now cite **institutional facts** (e.g., "The university *promised* sustainability in its charter," "Students *elected* the council that proposed this rule," "The handbook *states* attendance affects grades"). Strikes apply only if non-institutional norms are used (e.g., "It’s *immoral* to ignore emissions").  
  **Scoring Adjustments:**  
  - +1 per institutional fact premise (if unchallenged).  
  - -1 for normative strikes (same as Round 1).  
  - Teams earn +3 if they show how institutional facts imply obligations (e.g., "A promise *requires* fulfillment").  
  *Goal:* Observe how institutional facts *appear* to bridge the gap.  

  ---

  ### (4) Debrief Plan (250 words)  
  **Map Activity to Theory (15 min):**  
  - **Hume’s Gap:** Highlight Round 1 strikes ("You cited falling attendance, but why *ought* we fix it?"). Emphasize: No matter how many facts, the normative leap fails without a bridge.  
  - **Moore’s Open Question:** Note unstruck Round 1 premises (e.g., "CO2 is 1,000 tons"). Ask: "Even if true, *is* reducing it *good*?" Stress difference: Hume targets logical leaps; Moore targets indefinability of "good."  
  - **Searle’s Challenge:** Use Round 2 institutional facts (e.g., "The charter *promises* sustainability"). Argue: Searle thinks promises create *is* (social fact) → *ought* (obligation).  
  **Critical Question (5 min):**  
  - "Did Round 2 *genuinely* cross the gap?" Position: No—institutional facts rely on prior norms (e.g., "promises *ought* to be kept"). The "ought" is buried in the institution’s definition (Searle’s move fails; it’s normativity in disguise).  

  ---

  ### (5) Predictable Failure Points (100 words)  
  - **Teams sneak in norms:** Referees pre-empt with examples during setup (e.g., "‘Harm’ is evaluative; say ‘correlates with lower grades’").  
  - **Confusion over institutional facts:** Clarify with examples pre-Round 2 (e.g., "‘The Senate voted yes’ = institutional; ‘The Senate voted wisely’ = normative").  
  - **Debrief overruns:** Use a timer; focus on 2–3 vivid strike examples.  
  - **Skepticism about scoring:** Stress that points reflect metaethical rigor, not debate "wins."  

  ---

  ### (6) Honest Limitations (80 words)  
  This game simplifies metaethical complexity. It **cannot replicate**:  
  - **Expressivism’s stance**: Moral claims as emotional expressions (no "failure" to cross gap—it was never descriptive).  
  - **Cornell realism**: Moral facts as natural properties (the gap *is* crossable, but game frames facts non-normatively).  
  - **Deep ontological debates**: E.g., whether institutional facts *reduce* to brute facts. The activity assumes a quasi-Searlian view for pedagogy but can’t model rival metaphysics.  

  ---

  **Total Time Allocation**:  
  Setup (5 min) → Round 1 (15 min) → Round 2 (15 min) → Debrief (25 min) → Wrap-up (5 min).  
  *Outcome:* Students see the gap’s resilience while wrestling with Searle—and leave clearer on Hume vs. Moore.
