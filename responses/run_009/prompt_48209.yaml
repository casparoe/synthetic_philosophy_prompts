prompt: |-
  I'm on the board of a 46-unit housing co-op, and my unofficial job has become handling exception requests. We have a thick house-rules doc — quiet hours from 10pm, no subletting, guests capped at 14 nights a year, shared workshop has to be booked through the app, no storage in the bike room, residential use only, etc. — and basically every month somebody writes in asking to be excused from one of them for a special reason. The board is split between the "rules are rules" people and the "be reasonable" people, and we have no principled way to split the difference, so it mostly comes down to whoever argues loudest at the meeting.

  Years ago I read a bit of Kant, and the thing that stuck was the universalizability idea: before acting on a maxim, ask whether you could will it as a universal law — the classic case being that lying promises only work *because* most people keep their promises, so the liar is relying on the very practice he's undermining. It struck me that a lot of our exception requests are exactly like that. Some exceptions only work because most people don't ask for them: one member wanted to park in the loading zone all of December because relatives visit for the holidays — fine when it's just her, a disaster if everyone with holiday guests did the same. And then other exceptions seem genuinely harmless even if everyone did them, and maybe those are the ones we should grant.

  So here's the ask: turn universalizability into a procedure the board can actually run, in maybe fifteen minutes per request, with no philosophy background assumed. Things I think it needs:

  - A way to write the request down as a policy statement ("maxim"?) at the right level of detail. I know this is where it gets gamed — "anyone in my situation may..." where "my situation" is described so narrowly it's just me. Give us a rule of thumb for when a description is too gerrymandered to be the thing we universalize, since that seems to be where half our arguments actually live.
  - A clean split between exceptions that make the rule self-defeating if granted to everyone (everyone books the workshop "by exception" and the booking system stops meaning anything) and ones that don't defeat it but that we still couldn't all want at once (everyone sublets their unit and the co-op quietly stops being a co-op). If Kant people have names for these two failure modes, give them to us in plain English but don't make us use the jargon.
  - The points where the test is silent and it just has to go to a straight values vote, marked as such — I don't want the procedure pretending to settle questions it can't.
  - An honest section on where it will misfire. I can already tell it'll say no to sympathetic cases and yes to obnoxious ones, and I'd rather the doc admits that up front than have the board discover it mid-meeting and junk the whole thing.

  Then run it on three real-ish requests from the past year: (1) the December loading-zone one above; (2) a member who wants to run a small home-bakery business out of her unit in violation of the residential-use clause, arguing it's low-impact and she'd be delighted if everyone did it; (3) a member asking to be exempt from the chore rotation because he travels most weeks, who proposes buying out his share instead of doing chores — he's genuinely not trying to free-ride, he just can't be there.

  One more thing: tell me how confident you are in the reading of Kant you're using. I gather there's live disagreement about what the universalizability test is even supposed to rule out — whether the problem is supposed to be some kind of contradiction in the universalized rule itself, or a contradiction in what you can rationally will alongside your other ends — and I want you to flag which of those interpretive choices actually change what my board should do versus which are academic. And please single out the one step of the procedure you're least sure of, so I know where to keep a human override no matter what the checklist says.
reasoning: |-
  Okay, let me start by unpacking the user's request. They're on the board of a housing co-op dealing with exception requests to house rules. The board is split between strict adherence and flexibility, leading to inconsistent decisions based on who argues best. They recall Kant's universalizability principle and want a practical procedure based on it. 

  First, I need to break down their requirements. They need a step-by-step process that takes about 15 minutes per request, no philosophy background needed. Key components include formulating the maxim without gerrymandering, distinguishing between two types of rule failures, identifying when the test is inconclusive, and acknowledging limitations. They also provided three real-world examples to test the procedure.

  The user mentioned concerns about gaming the maxim by making it too specific. So I need a rule of thumb to prevent that, like using "similar circumstances" instead of unique details. For the failure modes, Kant's concepts of contradictions in conception and will come to mind. I should explain these in plain terms: self-defeating rules vs. undermining community values.

  The user wants transparency on where the test doesn't apply, so I'll note when it's a values vote. Also, honesty about misfires—like sympathetic cases being denied or obnoxious ones approved. The Kant interpretation part is tricky. There's debate between logical contradiction vs. rational willing. I think the latter is more practical here, but I should flag that the "contradiction in will" step might be the shakiest, needing human override.

  Now, applying the procedure to their examples. The loading zone case: universalizing it makes the rule useless, so it fails. The bakery: while it might not self-defeat the rule, universalizing could change the co-op's residential nature, failing the second test. The chore exemption: buying out might work if managed, but if everyone did it, chores wouldn't get done, so it fails the first test. Each example helps illustrate the steps.

  I need to ensure the procedure is actionable. Timers, templates, and clear questions will help. The confidence section should address Kant interpretation nuances, emphasizing that "contradiction in will" is where disagreements happen, so the board should focus on community impact. The weakest step is assessing if universalization undermines shared values, as it's subjective, hence needing override.

  Finally, the user's deeper needs: reducing board conflict, creating consistency, and having a principled yet practical approach. They want legitimacy in decisions, avoiding arbitrary outcomes. Acknowledging the tool's limitations upfront builds trust. Highlighting the human element in values-based decisions ensures they don't see the procedure as a panacea but a framework to guide discussions.
answer: |-
  Here's a turnkey **Universalizability Test Procedure** for your co-op board, designed for 15-minute assessments, with Kantian principles translated into practical steps, limitations flagged upfront, and examples analyzed:

  ---

  ### **The Co-op Universalizability Test (CUT) - Procedure**
  *(Time Target: 15 Minutes per Request)*

  **STEP 1: WRITE THE "MAXIM" (THE PROPOSED POLICY)**
  *   **Task:** Reformulate the member’s request as a general rule anyone could follow. Start with: *"Any co-op member may [ACTION] when [CIRCUMSTANCES]."*
  *   **Rule of Thumb for Avoiding Gerrymandering:**
      *   **Allowed:** Specific, *objectively verifiable* circumstances (e.g., "during major religious holidays they observe," "while recovering from documented surgery," "when primary income is lost").
      *   **Not Allowed:** Circumstances unique to the individual or subjective (e.g., "when it's really important to me," "because my situation is special," "when my relative is visiting *from Australia*"). Ask: *"Could another member honestly claim these exact circumstances?"* If not, it's too narrow.
  *   **Board Action:** Agree on the maxim wording *before proceeding*. If you can't agree it's reasonably general, **STOP - Vote on Values**.

  **STEP 2: THE SELF-DEFEAT TEST ("WOULD THE RULE VANISH?")**
  *   **Question:** *"If* ***every*** *eligible member actually did this,* ***at the same time****, would the original rule we're making an exception to become impossible to follow or completely pointless?"*
  *   **What it Catches:** Actions that rely on scarcity or exclusivity. If everyone does it, the system collapses.
  *   **Plain English Failure Mode:** **The Rule Killer.** Granting this exception universally destroys the very purpose of the rule.
  *   **Board Action:**
      *   **YES (Rule is Killed):** Request **FAILS**. No exception. (Proceed to Step 4 for documentation).
      *   **NO (Rule Survives):** Proceed to Step 3.

  **STEP 3: THE COMMUNITY WILL TEST ("WOULD WE ALL REGRET IT?")**
  *   **Question:** *"Even if the rule technically survives Step 2, could we, as a group committed to a shared housing co-op, still rationally* ***choose****/****want*** *to live under a community where* ***everyone*** *used this exception whenever applicable?"*
  *   **What it Catches:** Actions that, while *possible* if universalized, fundamentally alter the nature or values of the co-op in a way members wouldn't accept.
  *   **Plain English Failure Mode:** **The Co-op Corruptor.** Granting this universally wouldn't break the rule mechanically, but it would break the *spirit* or *foundation* of the community.
  *   **Board Action:**
      *   **YES (We Could Live With It):** Request **PASSES**. Consider granting the exception (with conditions/limits if needed).
      *   **NO (We Would Hate It):** Request **FAILS**. No exception.
      *   **UNCLEAR/SPLIT:** **STOP - Vote on Values.** The test is inconclusive; use standard board debate/vote.

  **STEP 4: DOCUMENT & EXPLAIN (Critical for Transparency)**
  *   **Task:** Record which test failed (Step 2 or Step 3) or if it went to a Values Vote. Briefly state the reasoning (e.g., "Failed Step 2: Universal use would overload loading zone, defeating its purpose"; "Failed Step 3: Universal home businesses change residential character, contradicting co-op purpose").
  *   **Template:** "Request: [Description]. Maxim: [Agreed Wording]. Outcome: [Pass/Fail/Vote] based on [Rule Killer / Co-op Corruptor / Values Vote]. Reason: [1-2 sentences]."

  ---

  ### **Where CUT is Silent & Will Misfire (READ FIRST!)**
  1.  **Values Votes Required:** When:
      *   The maxim is fundamentally gerrymandered/un-agreeable (Step 1).
      *   The Community Will Test (Step 3) is genuinely split or inconclusive.
      *   **Accept this:** The test *structures* debate but doesn't eliminate subjective values.
  2.  **Predictable Misfires:**
      *   **Sympathetic "Rule Killers" Will Fail:** A genuinely desperate, one-off need that would break the system if universalized (e.g., your Dec loading zone) *must* fail Step 2. **This feels harsh but is necessary.** (Consider discretionary *non-precedent-setting* compassion *outside* the rules framework occasionally, but be explicit it's not an "exception").
      *   **Harmless "Co-op Corruptors" Might Pass Step 2:** If an action doesn't technically break the rule *functionally* when universalized (Step 2), but clearly violates co-op values, Step 3 *should* catch it. **But if Step 3 reasoning is weak, an obnoxious request could pass.** Rigor in Step 3 is key.
      *   **"Corner Cases" Can Manipulate Step 3:** A member might craft a maxim narrowly passing Step 2, then argue Step 3 shouldn't apply because "no one else *would* do it." **Reject this.** The test asks "COULD everyone do it?" not "WOULD they?".
      *   **Ignores Scale/Impact:** Doesn't consider *how many* people might *actually* qualify. Focuses solely on *universal logical* consequences.

  ---

  ### **Testing the Examples (Applying CUT)**

  1.  **Loading Zone All December:**
      *   **Maxim:** "Any co-op member may park in the loading zone for the entire month of December when hosting holiday guests."
      *   **Step 2 (Rule Killer?):** **YES.** If *every* member with holiday guests did this (very likely), the loading zone would be perpetually full, defeating its purpose (short-term loading/unloading). It only functions *because* most people don't use it this way. **FAILS (Step 2)**.
      *   **Step 3:** Not Reached.

  2.  **Home Bakery Business:**
      *   **Maxim:** "Any co-op member may operate a small, low-impact home bakery business (defined as [specific criteria: e.g., no customer pickup, no external signage, <10 hrs/week, no commercial equipment]) from their unit."
      *   **Step 2 (Rule Killer?):** **NO.** Universal use *might* increase wear/tear or smells slightly, but it doesn't inherently make the "residential use only" rule *impossible* to follow or *pointless*. The units are still primarily residences.
      *   **Step 3 (Co-op Corruptor?):** **YES (Likely).** Could we rationally *want* a co-op where every unit potentially houses a small business? This fundamentally changes the character from "residential community" to "mixed-use." Increased foot traffic (deliveries?), commercial activity, potential noise/smells, insurance/liability issues, and precedent eroding "residential only" become overwhelming concerns. Members likely wouldn't choose this. **FAILS (Step 3)**. *(Member's argument fails: "I'd be delighted if everyone baked!" ignores the aggregate impact on community character and rules.)*

  3.  **Chore Rotation Buyout:**
      *   **Maxim:** "Any co-op member unable to fulfill chore rotation duties due to regular extended travel may permanently buy out their obligation by paying a monthly fee equivalent to [e.g., cost of hiring a cleaner for their share]."
      *   **Step 2 (Rule Killer?):** **YES.** If *every* eligible member (e.g., frequent travelers) bought out, the chore system collapses due to lack of participants. The system relies on sufficient participation. **FAILS (Step 2)**. *(The "buyout" only works if most people still do chores.)*
      *   **Alternative Maxim (Temporary):** "Any co-op member may arrange a qualified substitute (approved by Board/Committee) for specific chore slots they miss due to documented travel." *This might pass Step 2 (if substitutes are available) and Step 3 (if managed well), making it a better solution.*

  ---

  ### **Confidence & Kantian Nuance**

  1.  **My Interpretation:**
      *   **Step 2 (Rule Killer):** Based on the **"contradiction in conception"** - A universal law that is logically impossible or self-contradictory (like a promise-keeping rule that universalizes lying promises, destroying trust).
      *   **Step 3 (Co-op Corruptor):** Based on the **"contradiction in the will"** - A universal law you *could* conceive of, but could not rationally *will* without undermining other essential ends/rational commitments (like never helping others, making you unable to receive help when needed). I've framed these "ends" as the shared values and practical purpose of *your specific co-op*.
  2.  **Interpretive Disputes & Practical Impact:**
      *   **"Contradiction in Conception" (Step 2):** Relatively stable. Disagreements are usually about *how* precisely the maxim becomes self-defeating, but the core idea that universalization breaks the rule is robust. **Low impact on your procedure.**
      *   **"Contradiction in the Will" (Step 3):** **This is the major live dispute.** Some see it as purely about individual rationality ("could *I* will this?"), others (like me) emphasize the rational commitments implied by membership in a shared endeavor (the co-op). **This choice SIGNIFICANTLY impacts you:**
          *   *Individual Focus:* Might allow more exceptions that harm the group if the individual member could personally will it.
          *   *Communal Focus (Used Here):* Makes Step 3 about preserving the co-op's shared purpose and values, which is far more relevant to your context. This is the crucial interpretive choice *for you*.
  3.  **The Weakest Step (Human Override Essential Here!):**
      *   **Step 3 (Community Will Test - "Co-op Corruptor?")** is the most subjective and interpretive.
      *   **Why:** Determining what "we could rationally will" for the co-op involves value judgments about its core identity and what changes are acceptable. Different board members will have different visions. It requires imagining complex social consequences.
      *   **Recommendation:** **Always apply a human override here.** If the result of Step 3 feels deeply wrong to a significant portion of the board *despite* the reasoning, or if the consequences seem misjudged, revert to a **Values Vote**. The test provides a framework, not infallible answers, for this step.

  **Overall Confidence:** The core structure (Maxim -> Self-Defeat Test -> Community Will Test) is a sound and practical application of Kant's universalizability for rule-based communities. It directly addresses the "exception undermining the rule" problem you identified. Its effectiveness hinges on careful formulation in Step 1 and robust, values-focused discussion in Step 3. It won't eliminate debate, but it will ground it in principle rather than volume. **You've understood the Kantian insight perfectly for your context.** Use it, but know its limits.
