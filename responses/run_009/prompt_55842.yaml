  Now, considering the user's deeper needs. They're in a graduate seminar, so they need academically rigorous criteria. They might also want to showcase their grasp of the debate's nuances. Their unspoken needs include clarity for their paper structure and strong arguments to defend their thesis. They might fear overlooking key aspects or misjudging solution viability.

