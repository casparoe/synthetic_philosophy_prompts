answer: |-
  Here’s a 9-question quiz designed to sort readers by their implicit beliefs about language acquisition, bypassing theory labels and focusing on concrete cases. Includes required topics and scoring notes.

  ---

  ### **Which Language Acquisition Theory Do You *Actually* Hold?**  
  *Answer based on what these findings imply—not the jargon you know.*

  #### **Question 1: Structure-Dependence in Questions**  
  *Kids learn to form questions like “Is the man who __ tall singing?” correctly. They never try simpler (but incorrect) linear rules (e.g., moving the first “is”). Parents rarely correct grammar errors (“negative evidence”: explicit feedback on mistakes).*  
  What does this suggest?  
  (A) Kids are born knowing that language rules depend on sentence structure, not linear order.  
  (B) Kids have a general bias to analyze relationships between phrases, making structure rules easier to learn.  
  (C) Enough examples exist in input for kids to statistically infer structure-dependence.  
  (D) Kids start with limited memory, forcing them to chunk phrases early—this accidentally favors structure rules.

  #### **Question 2: Infant Speech Segmentation**  
  *Infants can “segment” artificial languages (find word boundaries) after 2 minutes of hearing syllables like *bidakupado*, just by tracking syllable transition probabilities (e.g., *bi-da* is more likely than *ku-pa*).*  
  This implies:  
  (A) Infants use domain-general stats to find patterns—no language-specific machinery needed.  
  (B) This bias for tracking sequences is innate and tuned for language-like input.  
  (C) Innate grammatical knowledge jump-starts statistical learning here.  

  #### **Question 3: Nicaraguan Sign Language (NSL)**  
  *Deaf children with no language input created NSL—a full, grammatically complex sign language—from simple, inconsistent signs used by adults.*  
  You conclude:  
  (A) Only innate grammatical content can explain rapid creation of complexity from nothing.  
  (B) Social interaction + domain-general learning builds structure; no innate grammar required.  
  (C) Innate *biases* for communication explain why structure emerges quickly.  
  (D) Maturation matters: older kids couldn’t do this, but young brains “self-organize” language.  

  #### **Question 4: Overregularization & the Wug Test**  
  *Kids say “goed” (not “went”) or “foots” (not “feet”), and in the Wug Test (*“This is a wug. Now there are two ___”*), they say “wugs” even for made-up words.*  
  This shows:  
  (A) Innate rules for morphology (word structure) exist, but kids misapply them before learning exceptions.  
  (B) General pattern-detection extracts rules from input (“add -s/-ed”), then overapplies them.  
  (C) Memory limits explain errors: kids can’t store all irregulars early on, so they use rules as shortcuts.  

  #### **Question 5: Child-Directed Speech Quality**  
  *Critics note parents’ speech to kids is mostly grammatical, repetitive, and tailored to the child’s level—not the chaotic “poverty of stimulus” assumed by some theories.*  
  You think:  
  (A) This undermines nativism: input is rich enough for general learning.  
  (B) It’s irrelevant—innate grammar explains *what* kids learn (e.g., structure-dependence), not just speed.  
  (C) Repetition helps, but biases are still needed to explain *how* patterns are prioritized.  

  #### **Question 6: Critical Period Evidence**  
  *Cases like “Genie” (isolated until age 13) show kids learn language fluently only if exposed before puberty, despite cognitive maturity later.*  
  This suggests:  
  (A) Innate language structures fade if not triggered early.  
  (B) General brain plasticity declines with age, affecting all learning.  
  (C) Social/motivational factors change post-puberty, not “innateness.”  

  #### **Question 7: Statistical Learning in Non-Humans**  
  *Cotton-top tamarin monkeys can segment artificial speech via transition probabilities, just like human infants.*  
  Your take:  
  (A) Language-specific innateness is overstated—this is general pattern learning.  
  (B) Humans do this *better*; shared mechanisms were adapted for language.  
  (C) This is irrelevant—monkeys don’t learn *grammar*, just chunks.  

  #### **Question 8: Connectionist Models**  
  *Computer models with no innate rules can learn past-tense forms (e.g., “go”→“went”) by adjusting neural connections based on input—mimicking kids’ “goed” errors.*  
  This implies:  
  (A) General learning + rich input suffices; no innate grammar needed.  
  (B) Models need built-in biases to mirror human learning speed/accuracy.  
  (C) Models prove structure *emerges* from development, not innate content.  

  #### **Question 9: Parameter Setting**  
  *Kids quickly adopt language-specific rules (e.g., English vs. Japanese word order) with little input, and errors are rare/systematic (e.g., never “*eats John apples*” in English).*  
  You suspect:  
  (A) Innate principles let kids “set switches” (parameters) from minimal clues.  
  (B) Input statistics + domain-general learning suffice; innate structure is redundant.  
  (C) Early cognitive constraints focus attention on certain patterns first.  

  ---

  ### **Scoring Key**  
  Tally your most-chosen letter, then map to positions below. **Important:** Some answers overlap across positions—this reflects real theoretical ambiguity.  

  | **Your Predominant Answer** | **Implied Position**                                                                 |  
  |-----------------------------|--------------------------------------------------------------------------------------|  
  | **Mostly A’s**              | **1. Strong Nativism**                                                               |  
  |                             | • Innate *content* (e.g., grammatical principles) exists. Input mainly “triggers” it.|  
  | **Mostly B’s**              | **2. Weak Nativism / Innate Constraints**                                            |  
  |                             | • Innate *biases* (not full grammar) make language patterns easier to learn.         |  
  | **Mostly C’s**              | **3. Domain-General Statistical Learning** OR **4. Emergentism**                     |  
  |                             | • **C-heavy + Q1C/Q3B/Q8A**: **3. Domain-General Stats**                             |  
  |                             |   *One general learning machine; stats extract patterns from input.*                 |  
  |                             | • **C-heavy + Q1D/Q3D/Q8C**: **4. Emergentism**                                      |  
  |                             |   *Structure emerges via brain development + input; “innate” = starting state.*      |  
  | **Mostly A’s in Q2/Q5/Q7**  | **5. Stimulus-Rich Empiricism**                                                      |  
  |                             | • Input isn’t impoverished; general learning suffices. Poverty-of-stimulus is a myth.|  

  ---

  ### **The Messy Truth: Where the Quiz Can’t Decide**  
  - **Weak Nativism (2) vs. Domain-General (3)**: If you chose mostly **B’s**, you’re likely in camp 2. But if you chose **B’s for Q2/Q7 and C’s elsewhere**, you might be a domain-general learner who thinks *some* biases exist. This overlap is real: some theorists argue stats *plus* minimal biases.  
  - **Emergentism (4) vs. Stimulus-Rich (5)**: If you think maturation matters (e.g., Q1D, Q3D) but input is sufficient (Q5A), you’re likely emergentist (4). Pure stimulus-rich (5) rejects *all* innate contributions.  
  - **Incoherent Combos**: Choosing **A’s for Q1/Q3 (strong innateness) + A for Q5 (stimulus-rich)** is contradictory—you can’t claim input is sufficient *and* that innate grammar is essential for poverty cases. Few theorists hold this.  

  Designed for linguistics nerds who hate label-fights! Share your result 🗣️💬
