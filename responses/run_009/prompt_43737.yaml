prompt: |-
  I serve on the algorithmic accountability panel of a mid-sized city agency that must sign off on any automated decision tool before deployment, and I could use help thinking through our next case. Our panel has a short but real track record: last year we approved a hospital readmission model for a population in which the two groups being compared had nearly identical readmission rates, and the vendor's audit showed the model was well calibrated within each group and had roughly equal false-positive and false-negative rates across groups; the same quarter we rejected a welfare-fraud screening tool whose scores were badly miscalibrated for one group and whose false-positive rate was nearly triple that group's rate for the other; and more recently we rejected outright a tenant-prioritization tool simply because the vendor had produced no group-disaggregated performance data at all, treating the absence of an audit as disqualifying regardless of how the model otherwise looked. I'm the only member with a statistics background, and I've started to suspect that these decisions, though individually defensible, don't actually pin down any single principle we're following.

  The new case is a lending-risk tool for our municipal credit union, and it forces a choice. The applicant pool includes two groups with genuinely different observed default rates, so the vendor is offering us two versions. Version A is calibrated within each group, meaning that among people assigned a given score, the actual default rate matches the predicted rate for both groups; the tradeoff is that the group with the higher default rate also ends up with a noticeably higher false-positive rate, so more of its non-defaulting members are flagged as risky. Version B instead equalizes both the false-positive and false-negative rates across the two groups, but as a consequence it systematically overstates the risk of members of the lower-default group; a score of, say, 70 from Version B means a higher true probability of default for one group than for the other. The vendor, to its credit, says we cannot have both properties at once given the base rates, and my own reading of the statistics literature supports that.

  So my questions are these. First, which fairness principles are actually consistent with our past decisions, and is there more than one? Second, what would each candidate principle recommend for this case, Version A, Version B, or neither? Third, treating our precedent as the closest analog, what would be the decision most consistent with our own track record, and what principle would we effectively be adopting with that choice — including what it commits us to going forward? And finally, if our precedents genuinely underdetermine the verdict here, what property would a future case need to have in order to best distinguish between the candidate principles, so that our next decision actually settles something rather than prolonging the ambiguity? Please respond in American English, and feel free to be technical where it helps.
reasoning: |-
  Alright, let's start by understanding the user's situation. They're part of an algorithmic accountability panel for a city agency. Their past decisions include approving a hospital readmission model with equal calibration and error rates, rejecting a welfare-fraud tool due to miscalibration and unequal false-positive rates, and rejecting a tenant-prioritization tool for lack of group-disaggregated data. Now, they're evaluating a lending-risk tool with two versions: one calibrated per group but with unequal false-positive rates, and another with equal error rates but group miscalibration.

  First, I need to identify the principles from their precedents. The hospital model approval suggests they value calibration within groups and similar error rates. Rejecting the fraud tool due to miscalibration and high false-positive disparity points to calibration and error rate equality. The tenant tool rejection emphasizes the necessity of disaggregated audits. So, two principles emerge: calibration and error rate parity. 

  The user's main concern is inconsistency. They approved a model where error rates were equal and calibration was good, but now the lending tool forces a choice between these principles. Version A meets calibration but not error rate parity, especially in false positives. Version B has equal error rates but fails calibration. Neither perfectly fits past approvals. 

  Looking back at the fraud tool rejection, the key issue was miscalibration combined with a high false-positive disparity. The hospital model had both calibration and error rate parity. So, rejecting Version B might align more because of miscalibration, which was a deal-breaker in the fraud case. Version A has calibration but unequal false positives. However, in the hospital case, error rates were equal, but here they differ. 

  The user needs to decide which principle is more critical. Their rejection of the tenant tool for lacking any audit shows they require data transparency. For the lending case, both versions have audits, so that's covered. The conflict is between calibration and error rate equality. 

  Considering societal impact in lending, false positives (denying loans to good applicants) might harm the higher-risk group more, especially if it's a marginalized community. Version A's higher false positives could perpetuate inequality. Version B's miscalibration might lead to unfair loan terms for the lower-risk group. 

  The precedents suggest calibration was non-negotiable in the fraud case, so Version B's miscalibration might be unacceptable. Version A, despite higher false positives, is calibrated. But the user's panel might prioritize avoiding harm from errors, making false-positive disparity a bigger issue. 

  To resolve ambiguity, a future case where calibration and error rates can both be achieved would help. Or a scenario where one principle's impact is more severe, like in criminal justice vs. healthcare. The user needs a clear policy choice: which principle to prioritize when they conflict. 

  Recommendation: Reject Version B for miscalibration, similar to the fraud tool rejection. Approve Version A with conditions for mitigating harm from false positives, like transparency or appeal processes. This effectively adopts calibration as a firm requirement, with error rate parity as a desirable but secondary goal. Future cases should document this hierarchy explicitly.
answer: |-
  Based on your precedents and the technical realities of this lending case, here's a breakdown of the fairness principles at play, their alignment with your history, and a path forward:

  **1. Principles Consistent with Past Decisions:**
  Your panel implicitly prioritizes **two distinct fairness criteria**, creating a potential tension:
  *   **Calibration Within Groups (Predictive Parity):** The requirement that model scores accurately reflect the true probability of the outcome *within each protected group*. This was central to approving the hospital model and rejecting the fraud tool.
  *   **Error Rate Parity (Equalized Odds/False Positive/FN Balance):** The requirement that models make similar error rates (FPR, FNR) *across protected groups*. This was crucial in rejecting the fraud tool (due to unequal FPR) and likely influenced the hospital approval where FPR/FNR were "roughly equal".

  Your precedents show **both principles matter**, but haven't defined their hierarchy when they conflict. The tenant rejection establishes a firm **minimum requirement: Disaggregated Auditing** is non-negotiable.

  **2. Applying Principles to the Lending Tool:**

  *   **Version A (Calibrated, Unequal FPR):**
      *   *Calibration:* **Satisfied.** Matches your hospital approval and fraud tool rejection rationale.
      *   *Error Rate Parity:* **Violated (FPR Disparity).** The higher FPR for the higher-default group means more creditworthy individuals in that group are wrongly denied credit. This directly echoes the *reason* for rejecting the fraud tool.
      *   *Principle Verdict:* **Conflict.** Strong on calibration, weak on FPR parity.

  *   **Version B (Equal FPR/FNR, Miscalibrated):**
      *   *Calibration:* **Violated.** Scores are misleading; a "70" means different actual risks depending on group. This mirrors the core flaw in the rejected fraud tool.
      *   *Error Rate Parity:* **Satisfied (FPR & FNR).** Matches the error rate balance seen in the approved hospital model.
      *   *Principle Verdict:* **Conflict.** Strong on error rate parity, weak on calibration.

  *   **Neither:** Rejecting both is an option, consistent with rejecting tools that fail core fairness audits.

  **3. Precedent-Aligned Decision & Adopted Principle:**
  *   **Most Consistent Decision:** **Reject Version B.**
      *   **Why?** Your strongest, clearest precedent is rejecting the fraud tool **primarily due to miscalibration** ("badly miscalibrated for one group"). The fraud tool *also* had unequal FPR, but the miscalibration was listed first and is fundamentally about the model's core accuracy being broken for a group. Version B's group-level miscalibration is an identical flaw – the scores lack meaning for the lower-default group. This flaw was deemed disqualifying before.
      *   **Effectively Adopted Principle:** **Calibration Within Groups is a *Minimum Requirement*.** Your precedent treats group-level miscalibration as fatal. Error rate parity is highly desirable (as seen in the hospital approval) but appears secondary; the hospital model had *both*, the fraud tool had *neither* (it failed both calibration *and* FPR parity), and you rejected the fraud tool outright based on those failures. Approving Version B would directly contradict the logic used against the fraud tool.
      *   **Commitment Going Forward:** This commits the panel to demanding that any model's predicted probabilities are demonstrably accurate *within* each protected group analyzed. A model failing this test is presumptively unacceptable, regardless of error rates. Error rate parity remains an important goal to strive for *if* calibration is achieved (as in the hospital case).

  *   **Status of Version A:** While rejecting Version B aligns best with precedent, **Version A is not automatically approved.** It meets the *minimum* calibration requirement but introduces a significant FPR disparity.
      *   **Precedent Nuance:** Your fraud tool rejection cited *both* miscalibration *and* high FPR disparity. The hospital tool had *both* calibration *and* roughly equal error rates. This suggests FPR disparity alone, *even with calibration*, is a serious concern that needs evaluation.
      *   **Recommendation:** **Do not reject Version A outright based *solely* on precedent (since calibration passes), but *do not approve it unconditionally*.** Demand a rigorous assessment of the *impact* and *causes* of the FPR disparity:
          *   Is the disparity *solely* driven by the genuine difference in base rates, or does the model introduce additional bias?
          *   What is the practical impact? How many creditworthy applicants in the higher-default group will be wrongly denied?
          *   Can mitigation strategies be implemented (e.g., more transparent appeals processes, lower score thresholds for that group where justified by cost structure, enhanced financial counseling)?
          *   **Conditional approval** of Version A *with mandated mitigations and ongoing disparity monitoring* could be a defensible middle ground, acknowledging the calibration requirement is met but taking the FPR disparity seriously.

  **4. Resolving the Ambiguity: A Future Test Case**

  Your precedents underdetermine the verdict for Version A because they haven't faced the "calibrated but unequal FPR" scenario head-on. To distinguish between prioritizing "Calibration Minus Harm Mitigation" vs. "Strict Error Rate Parity" as the primary principle, you need a future case where:

  *   **A model achieves perfect Calibration Within Groups,** AND
  *   **Exhibits a significant, demonstrable Disparity in a Key Error Rate (FPR or FNR),** AND crucially,
  *   **The disparity is *provably unavoidable* given the genuine difference in base rates and the need for overall accuracy/utility.** (No "better" model exists that achieves both calibration and error parity).

  This forces the panel to decide: **Is satisfying calibration alone sufficient (if harm mitigation is attempted), or is achieving error rate parity an *equally mandatory* requirement, even if it necessitates rejecting a well-calibrated model?**

  **Summary & Recommendations:**

  1.  **Reject Version B:** Its group-level miscalibration directly violates the core fairness principle established by your rejection of the fraud tool. Calibration within groups is your strongest precedent-based minimum requirement.
  2.  **Do Not Automatically Approve Version A:** While it meets the calibration minimum, its FPR disparity is a serious fairness concern echoing *part* of the fraud tool rejection. Subject it to rigorous impact analysis and demand mitigation plans.
  3.  **Adopted Principle:** **Group-wise calibration is a non-negotiable minimum standard.** Error rate parity is a critical secondary objective to be pursued where possible and mitigated where unavoidable differences exist.
  4.  **Clarify Future Policy:** Explicitly document that models failing group-wise calibration audits will be rejected, while models passing calibration but showing significant unavoidable error rate disparities will require justification and harm mitigation strategies for conditional approval.
  5.  **Seek the Test Case:** Actively look for (or wait for) a case presenting the unavoidable conflict between calibration and error parity to solidify your stance on whether error parity is also a strict requirement or a goal to be managed under the umbrella of meeting calibration.

  By rejecting Version B based on its violation of the calibration requirement (your clearest precedent), while subjecting Version A to heightened scrutiny on its FPR disparity, you remain consistent with your past actions and force the necessary conversation to resolve the ambiguity in your next challenging case.
