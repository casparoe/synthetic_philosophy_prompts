  Based on Maya's track record, here's the breakdown and prediction:

  **Prediction for House Centipedes:** Maya will **refuse the baseboard spray**.

  **Prediction for Cockroach Sticky Traps:** Maya will **refuse sticky traps** and insist on snap traps or bait stations instead.

  **The Dominant Principle: Justification & Necessity (with Collateral Damage as a Secondary Filter)**

  After analyzing her rulings, the strongest, most consistent principle appears to be:

  1.  **The Justification for Killing:** Maya distinguishes between **necessity driven by health, safety, or protecting essential resources (like food plants)** vs. **aesthetics, convenience, or protecting non-essentials (like a perfect lawn)**.
      *   **Allowed (Necessity):** Aphids on food plants (protecting food source), Flies in kitchen (hygiene/annoyance), Mice/Rats (health hazard, property damage), Wasps at entrance (safety hazard), Swatting a mosquito (immediate threat/pest).
      *   **Disallowed (Non-Necessity):** Grub treatment for lawn (aesthetics only, grass isn't essential), Mosquito fogging for a party (convenience/aesthetics, not immediate health threat to *her* property).
  2.  **Collateral Damage / Specificity (Secondary Principle):** This acts as a secondary filter, *especially* when the justification is weaker or involves broader ecosystems. She avoids methods that cause widespread, non-target harm.
      *   **Allowed (Targeted):** Spraying aphids *on her plants*, snap traps for rodents, wasp dust *on the nest*, swatting a mosquito.
      *   **Disallowed (Broad/Non-target):** Granular grub treatment ("nuking the yard"), neighborhood mosquito fogging (indiscriminate, harms beneficials).

  **Why the Centipede Case Splits the Hypotheses & Why She'll Refuse Spraying:**

  *   **Targeted Spray?** Yes. Spraying baseboards is relatively targeted compared to fogging a yard.
  *   **Suffering?** Insects are involved, so her "insects don't really count" stance *might* allow it.
  *   **BUT... The Justification:** This is the clincher. The *only* reason is that she "can't stand the way they look." This is **purely aesthetic**. They are beneficial (eating other pests) and pose no health, safety, or resource threat. This mirrors the **lawn grub** scenario ("I'm not nuking the whole yard *for grass*") – killing beneficials/insects purely for aesthetics is unacceptable. The targeted nature is irrelevant because the *reason* fails her primary necessity test.

  **Why the Cockroach Sticky Trap Prediction:**

  *   **Glue Board Precedent (Mice):** She refused glue boards for mice, citing suffering ("die slowly, stuck to it").
  *   **Flypaper Precedent (Flies):** She allows flypaper, which also causes slow death for insects.
  *   **The Split:** This highlights her distinction between **vertebrates (mammals, where suffering matters)** and **insects/arthropods (where it doesn't, or matters less)**.
  *   **Cockroaches:** They are insects. However, they *are* a **health/hygiene pest in the kitchen** – a strong justification under her "necessity" principle.
  *   **The Conflict:** While the justification (hygiene) is strong, the *method* (glue trap) causes suffering to a creature she *does* seem to grant some capacity for suffering to (as shown with mice/rats), even if lesser than vertebrates. Remember, she *chose snap traps over poison* for rats – prioritizing a (presumably) quicker death.
  *   **Prediction:** She'll refuse sticky traps for cockroaches. The justification (hygiene) is strong, but the *method* (slow death via glue) violates her preference for quicker/more direct killing when vertebrates or larger pests are involved. She'll likely prefer snap traps (if effective on roaches) or targeted gel baits, seeing them as more direct and potentially less cruel than prolonged immobilization. **The flypaper exception exists because flies are insects *and* the method isn't used on creatures she assigns higher suffering capacity to.**

  **Is the Centipede Case the Cleanest Split?**

  Yes, the centipede case is an **excellent split** for the two main hypotheses you proposed:

  1.  **Hypothesis 1 (Suffering + Collateral):** "Insects don't suffer (or it doesn't count), just don't cause collateral damage." **-> Allows spraying** (Insects, targeted).
  2.  **Hypothesis 2 (Justification):** "Only kill for strong necessity (health/safety/food), not aesthetics/convenience." **-> Disallows spraying** (Purely aesthetic).

  Her predicted refusal points strongly to Justification being the core principle.

  **Could Another Case Settle It Even Better?**

  The centipede case is very good. To probe the suffering/collateral aspect further, especially regarding insects, you could consider:

  *   **Targeted Suffering for Aesthetics:** "Hey Maya, if I found a way to trap these centipedes alive without any spray or collateral damage, but they'd starve to death slowly in a jar... would that be okay? Since they're just bugs?" (Prediction: She'd likely say *no*, reinforcing that the *aesthetic reason* is insufficient regardless of the method's specificity or insect status).
  *   **Necessity with High Collateral:** "What if those grubs weren't just hurting the lawn, but were actually invasive beetles that would destroy all the fruit trees in the neighborhood? Would you consider treating the yard then, even with the granular stuff?" (Prediction: She *might* reluctantly allow it, showing that overwhelming necessity *could* override collateral damage concerns, but aesthetics alone never would).

  **Conclusion on Maya's "Gut" vs. Principle:**

  While there might be an element of gut feeling (e.g., the visceral reaction to centipedes triggering the "aesthetic" category), her decisions are remarkably **consistent** when viewed through the lens of **Justification/Necessity as the primary driver, filtered by Collateral Damage/Specificity, with an added layer distinguishing Vertebrate Suffering.**

  **In short:**
  *   **Kill only if necessary** (Health, Safety, Protecting Essential Food/Property).
  *   **Avoid unnecessary, broad ecological harm** when possible.
  *   **Minimize suffering for vertebrates/mammals** when lethal control is necessary.
  *   **Aesthetics/convenience alone are never sufficient justification.**

  This framework predicts her "No" to centipede spraying and cockroach glue traps.
