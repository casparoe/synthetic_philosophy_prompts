  Goal-Directionist: \_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_  
  Arbitrator: \_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_  

  ---  
  **Next Steps:** Test predictions via simulators (e.g., AI safety gridworlds for deferred oversight) or historical case studies (e.g., NASA missions under imperfect supervision). Focus on Crux 1 & 3 for empirical resolution.
