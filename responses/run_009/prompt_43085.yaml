answer: |-
  ### (1) Exam Question  
  **"It is often remarked that the Axiom of Choice (AC) is 'obviously true', the Well-Ordering Theorem (WO) is 'obviously false', and Zorn’s Lemma (ZL) is anyone’s guess—despite their equivalence in ZF. Explain why this differential intuitive response might arise even in light of their logical equivalence. In your view, what does this tension reveal about the justification for adopting full AC (over weaker fragments like Dependent Choice) in set theory? Address the following in your answer:**  
  - **Why might the 'obviousness' of AC or the 'absurdity' of WO fail to settle the debate over their acceptability?**  
  - **How should we distinguish between a consequence of AC being *surprising* versus being a genuine *cost*? (Illustrate with examples.)**  
  - **What role does the conflict between AC and axioms like the Axiom of Determinacy (AD) play in evaluating AC’s epistemic status?**  

  **Argue for a specific position: Defend, critique, or refine the case for accepting full AC as an axiom. Engage with both intrinsic (e.g., fit with the iterative conception of set) and extrinsic (e.g., mathematical fruitfulness) justifications."**  

  ---

  ### (2) Model Answer (Approx. 600 words)  
  The intuitive disparity between AC, WO, and ZL stems not from their mathematical content—which ZF proves identical—but from how human cognition interacts with their *formulations* and *consequences*. AC feels "obvious" because it generalizes finite choice: selecting one sock from each of infinitely many pairs seems a benign extension of combinatorial intuition. WO, however, clashes with our tacit sense of "orderability": the claim that ℝ admits a well-ordering violates expectations built from metric or topological experience, where dense linear orders resist discrete structuring. ZL, as a technical tool for algebraic closure, feels neutral—neither grounded in nor opposed to everyday reasoning.  

  This tension reveals that intuitions track *epistemic accessibility*, not truth. AC’s plausibility arises from its role as a "local" rule of construction ("choose from this set"), while WO’s implausibility reflects the opacity of its non-constructive output ("here is a well-order of ℝ, but I can’t show it to you"). The equivalence thus forces a choice: either reject intuitions as unreliable guides to axiom selection or interrogate what they signal. I argue they signal *pragmatic limits*, not falsehood. Banach-Tarski is *surprising* (decomposing spheres violates geometric intuition) but not a *cost* (it reveals measure-theoretic limitations, not inconsistency). A genuine cost arises when AC obstructs a valuable mathematical goal—e.g., AD’s inconsistency with AC sacrifices a rich theory of "definable" sets of reals (where all sets are Lebesgue measurable) to preserve choice.  

  Justifying AC thus requires balancing intrinsic and extrinsic factors. Intrinsically, AC fits the iterative conception’s generative view of sets (the union of choice sets exists at the next stage), but weakly: it asserts sets without specifying members, conflicting with the conception’s "definite totality" ethos. Extrinsically, AC is fruitful in algebra (vector space bases) and topology (Tychonoff’s theorem), but DC suffices for analysis (e.g., Baire Category Theorem). The AD conflict exposes a deeper cost: AC limits *set theory’s own projects* by precluding consistent maximal determinacy axioms.  

  I defend AC’s acceptance, but with humility. Its "obviousness" is shallow—the axiom asserts a set whose elements we cannot canonically specify, which is epistemically uncomfortable—but its fruitfulness across mathematics outweighs localized costs like Banach-Tarski. Rejecting AC for WO’s strangeness misattributes discomfort: WO’s "falsehood" reflects our inability to *visualize* its output, not a logical flaw. Weaker axioms like DC cannot resolve the AD conflict (which requires full AC’s negation) and hamper transfinite algebra. Thus, while AC is not self-evident, it remains the most efficient engine for mathematical exploration—provided we acknowledge its trade-offs explicitly.  

  ---

  ### (3) Marking Scheme (5 points × 4 marks each)  
  **Total: 20 marks**  
  **Key: Award marks for *specific argumentative moves*; deduct for vagueness, omission, or confusion.**  

  | **Point (4 marks)** | **Top-Scoring Move Required** | **Common Botch (1-line note)** |
  |----------------------|--------------------------------|--------------------------------|
  | **1. Diagnose the intuitive disparity** | Explain why AC *feels* obvious (finite choice analogy) vs. WO *feels* false (cognitive clash with uncountable order-types) despite equivalence. | *Botch:* Merely restating the quip without analyzing cognitive/mathematical roots. |
  | **2. Distinguish *surprise* from *cost*** | Use examples: Banach-Tarski as *surprising* (weird but consistent) vs. AD conflict as *cost* (blocks a consistent, fruitful set-theoretic program). | *Botch:* Citing Banach-Tarski as "proof AC is false" or equating weirdness with disproof. |
  | **3. Confront AC’s "obviousness" flaw** | Concede AC’s assertion of unspecifiable sets undermines intrinsic obviousness (e.g., violates "definite totality" in iterative conception). | *Botch:* Ignoring this tension or asserting AC is "self-evident" without qualification. |
  | **4. Engage AC vs. DC/AD trade-off** | Argue concretely why DC suffices for analysis (e.g., PDEs) but full AC enables set theory (e.g., cardinal arithmetic) *and* why AD conflict matters (e.g., measurability vs. choice). | *Botch:* Treating AD as irrelevant or conflating DC with full AC in applications. |
  | **5. Take a stance with balance** | Defend/critique AC while weighing *both* intrinsic (set conception) and extrinsic (fruitfulness/costs) factors, e.g., "AC for breadth, fragments for depth." | *Botch:* Surveying positions without taking one or ignoring one justification type.  

  ---

  **Rationale for Design:**  
  - **Anti-recitation guard:** Forces analysis of *why* intuitions diverge despite equivalence, blocking pure proof summaries.  
  - **Banach-Tarski depth:** Point 2 explicitly separates "bizarre" from "costly," requiring students to engage *why* AD is a cost (blocks a theory) while Banach-Tarski is not (no inconsistency).  
  - **Stance requirement:** Mandates a position (e.g., "defend with humility") to avoid fence-sitting.  
  - **Uncomfortable concession:** Point 3 ensures even pro-AC answers admit its epistemic weakness (unspecifiable sets).  
  - **Mixed-audience balance:** Math majors must grapple with epistemology (Points 1,3); philosophy majors must handle technical trade-offs (Points 2,4).
