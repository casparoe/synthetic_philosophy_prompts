answer: |-
  ## Dialogue: The Zooid Gambit

  **Characters:**  
  - **Dr. Sam Reid:** Multilevel Selection Theorist  
  - **Dr. Gene Wright:** Gene’s-Eye View Theorist  

  **Setting:** A café near a marine biology conference.  

  ---

  **Sam Reid:** Gene, I’ve been thinking about your insistence that all selection reduces to genes. Take this hypothetical: a clonal marine invertebrate colony. All zooids start identical, but a somatic mutation makes *one lineage* stop sharing nutrients and hoard resources for its own gonads. These "defectors" spread within the colony via budding fragments. Colonies with defectors produce fewer/smaller offspring. Isn’t this a textbook case of *within-colony* selection (favouring defector lineages) opposing *between-colony* selection (favouring colonies without defectors)?  

  **Gene Wright:** Intriguing case, Sam! But let’s be precise. Yes, defector lineages proliferate *within* colonies—that’s selection favoring a mutant allele across somatic cell lines. Colonies with more defectors have lower fitness—that’s selection against colonies carrying that allele. It’s all gene-level selection: the mutant allele rises locally but sinks globally.  

  **Sam Reid:** Hold on—you’re conflating levels. The "lineage" here isn’t just a gene; it’s a somatic cell lineage with heritable variation *within the colony*. Selection acts on *it*: lineages with the mutation outcompete others *inside* the colony. Meanwhile, colonies *as wholes* vary in fitness based on defector load. We can quantify this! Partition the variance in reproductive output: some is due to differences *among colonies* (group selection), some to differences *among lineages within colonies* (individual selection). If between-colony variance is high, group selection dominates.  

  **Gene Wright:** I agree competition exists at both scales! But partitioning variance doesn’t prove two *types* of selection. It’s accounting: the sum of gene-level fitness effects. That mutant allele has high *within-colony* fitness but low *between-colony* fitness because it sabotages its vehicle. The colony’s "fitness" is just the aggregate output of its genes’ survival strategies.  

  **Sam Reid:** But the colony’s fitness isn’t *reducible* to gene fitness! A colony’s output depends on emergent traits—like coordination of nutrient sharing—that aren’t captured by summing gene effects. A colony with 0% defectors has high fitness *because* of its organization. That’s a colony-level adaptation!  

  **Gene Wright:** Fair—the colony’s structure matters causally. But it’s still a vehicle, not a replicator. The defector lineage *looks* like a "unit," but it lacks fidelity. Somatic mutations aren’t germline-inherited; when a bud fragments, only *some* cells carry the mutation. It’s not a replicator—just a temporary genetic subpopulation.  

  **Sam Reid:** Ah, but fidelity isn’t binary! Lineages *do* replicate clonally within colonies. And colony reproduction *is* high-fidelity via budding. We can measure selection strength at each level independently. Suppose we find that 70% of fitness variance is *between* colonies—wouldn’t you concede colony selection is driving evolution?  

  **Gene Wright:** I’d say the *gene* is still the unit of replication. The partition shows where selection is *acting*, but the beneficiary is the gene. The defector allele’s spread is constrained by colony collapse—but that’s just gene-level selection with trade-offs. If the allele mutated further to *avoid* killing its colony, *it* would still be selected.  

  **Sam Reid:** But that "constraint" *is* group selection! And "beneficiary" is slippery. Genes replicate, but adaptations—like colony integrity—emerge at higher levels. Here, colony-level selection maintains cooperation. If we only look at genes, we miss *why* non-defector colonies persist.  

  **Gene Wright:** I see your point: the Price equation partitions covariance and transmission bias cleanly. But mathematically, the multilevel partition is *isomorphic* to the gene-centric view. Choosing one is about explanatory emphasis, not ontology. For me, the replicator (gene) is fundamental because it’s the locus of heredity. Lineages and colonies are interactors—important, but derivative.  

  **Sam Reid:** And there we disagree. When between-group selection dominates, the group *is* a unit of adaptation. Here, colony survival explains the persistence of cooperation better than gene frequencies alone. The replicator/interactor distinction is useful, but it doesn’t erase hierarchical causality.  

  **Gene Wright:** Perhaps. But would you call a *cancer* in a mammal "group selection"? It’s the same dynamics—somatic mutants outcompeting cells, harming the organism. We don’t invoke "tissue-level selection"; we describe selfish cell lineages. Why treat colonies differently?  

  **Sam Reid:** Because colonies *are* functional reproductive units! Unlike cells in a body, *each colony produces new colonies*. That’s key. But you’re right—this case *is* cancer-like. The difference is scale and reproducibility: here, colony-level reproduction creates a genuine higher-level fitness gradient.  

  **Gene Wright:** ...I’ll concede that. Still, I insist any "group" effect is the summed effect of gene survival strategies in context. The math is translatable, so why multiply entities?  

  **Sam Reid:** Because causality isn’t always bottom-up. When group structure alters gene fitness (e.g., defectors do well only in cooperative colonies), the group is a causal actor. Partitioning reveals that.  

  *(Pause. Both sip coffee.)*  

  **Gene Wright:** So our residual disagreement is ontological? You see the Price partition as revealing causal forces; I see it as redistributing gene-level causality.  

  **Sam Reid:** Precisely. For you, replicators define selection; for me, selection acts on heritable variation *at any level* where fitness differences arise. This case shows both levels matter empirically.  

  **Gene Wright:** Agreed—empirically. But ontologically, I’ll maintain the gene’s primacy. Shall we grab lunch before the next talk?  

  **Sam Reid:** Lead on. But I’ll bring more examples.  

  ---  

  **Honest Assessment of Your Hypothetical:**  
  This is **excellently constructed**. It avoids being a standard cancer analogy by making colonies *reproductive units* (via budding), creating a genuine within-group vs. between-group trade-off. It’s *not* stacked—both views engage it rigorously. The somatic mutation + clonal inheritance cleanly mirrors real cases (e.g., siphonophores, cheating in volvocine algae). No collapse into triviality.  

  **Liberties Taken:**  
  1.  **Simplified fidelity concerns:** Wright dismisses lineages due to mutation risk, but in a *clonal* system, fidelity between budding events may be high. I made her slightly more dismissive than some gene-centrists might be.  
  2.  **Ambiguous germline:** Your setup doesn’t specify if mutations enter the germline. I assumed defector gonads *can* produce gametes, making it evolutionarily relevant. If not, Wright’s case strengthens.  
  3.  **Replicator definition:** Wright invokes "fidelity, longevity, fecundity" loosely—Dawkins might accept lineages as "replicators" here if mutations are rare. I hardened her position for contrast.  
  4.  **Reid’s concession:** He agrees cancer is analogous but distinguishes via reproduction. Some multilevel theorists (e.g., D.S. Wilson) might push harder that *any* nested fitness conflict qualifies.  

  **Residual Disagreement Located:**  
  The crux is **whether formal translatability (via Price equation) implies ontological reducibility**. Wright sees hierarchical partitions as bookkeeping; Reid sees them as causal. This ties to the **replicator vs. interactor distinction**: if only replicators "benefit," colonies can’t be units of selection. Reid implicitly challenges that replicator status is necessary for being a unit of *adaptation*. For Wright to win, she must show that colony fitness *adds nothing* to the causal explanation beyond gene fitness sums. For Reid to win, he must show that the colony-level fitness gradient *causally constrains* gene dynamics in a way that isn’t captured by gene-centric models alone. The dialogue ends where the philosophy of biology often does: in a stalemate over causation and emergence.
