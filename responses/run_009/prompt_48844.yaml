  | Analyst intentions              | Editorial blueprints for a series        | ★★☆☆ (Moderate distortion: stats is more mathematical) |  
  | P-values                        | Institutional "we stand by this" label   | ★★★☆        |  
  | Posteriors                      | Reporter’s private confidence level      | ★★★★        |  
  | **Likelihood function**         | **No direct equivalent**                  | ❌ (Missing) |  
  | **Subjective priors**           | **No institutional counterpart**          | ❌ (Missing) |  
  | **Mathematical coherence**      | **No analog: journalism lacks probability calculus** | ❌ (Missing) |  

