prompt: |-
  I'm a journalist who has spent years covering the replication crisis, and I want to understand the frequentist-Bayesian argument behind it in the vocabulary I actually work in, not the one statisticians use. My native vocabulary is sourcing and editorial standards: independent corroboration, single-source stories, beat reporters' accumulated sense of which sources to trust, corrections and retraction policies, the discipline of publishing only what you can stand behind regardless of what you privately believe. As best I can tell, long-run error control is something like a paper's institutional guarantee about how often we print things that turn out false, while Bayesian priors are something like the reporter's private ledger on each source. But I want the whole dispute translated properly: coverage guarantees versus priors; optional stopping as something like keeping a story in the works until a source finally says what you were hoping for; the question of whether a study's evidential weight depends on what the analyst intended to do, which sounds to me like asking whether a story's reliability depends on the editor's plans for the series it ran in; and whatever else belongs in a faithful rendering. Then give me the residue report: which parts of the dispute map cleanly onto my vocabulary, which translate only with distortion, and which have no journalistic counterpart at all. Finally, take a definite position on the residue itself: does it show that my sourcing vocabulary is missing something the statisticians are genuinely arguing about, or does it show that their dispute is less substantive than the partisans make it look? Commit to an answer and defend it — I'm hoping to write the piece, so don't lay out the options and leave me to pick.
