prompt: |-
  I'm a philosophy graduate student drafting a paper on the meta-problem of consciousness — the problem of explaining, in purely functional and mechanistic terms, why we humans systematically judge that there is a hard problem of consciousness at all: why we report an explanatory gap between physical processes and experience, why we find zombies conceivable, why we insist that a completed neuroscience would still leave something out. My paper's thesis is that the field has jumped to competing solutions (illusionist deflation, phenomenal-concept strategies, dualist readings of the intuition) without first agreeing on what would count as solving the meta-problem in the first place, and my advisor suggested I build the specification before evaluating anyone's attempt to meet it. So that is what I'm asking you for: the desiderata.

  Concretely, I want a list of requirements any adequate solution to the meta-problem must satisfy, each with the case behind it. Some of the ones I keep circling, which you should feel free to correct, refine, add to, or reject as a pseudo-requirement: it must explain the actual phenomenology of the hard-problem intuition (its intuitive force, its resistance to argument, its recurring appeal even to people fully briefed on physicalism) rather than merely our verbal reports; it must be non-circular, in that it cannot invoke phenomenal consciousness itself to explain our beliefs about phenomenal consciousness, unless it explicitly takes on the extra burden that creates; it should be evidence-neutral enough that a dualist and an illusionist could both accept the explanation of the intuition while disagreeing about what the intuition tracks — though I genuinely don't know whether that neutrality is achievable or whether demanding it already begs some question; and it should be consistent with what empirical psychology actually finds about introspection and confabulation. I'd also like you to take seriously the possibility that some subset of the desiderata is jointly unsatisfiable — that the neutrality requirement and the non-circularity requirement, say, pull in incompatible directions — because if so, that is itself the result my paper should be arguing for rather than a failure of the list.

  Please be discriminating about which requirements are genuine and which are just prejudices of one camp dressed up as adequacy conditions: I suspect the dualist demand that a meta-problem solution preserve the appearance of epistemic transparency to the subject, and the illusionist demand that the solution come out mechanistic all the way down, are both of that kind, but I may be wrong. Mark each desideratum as non-negotiable or negotiable, and say which one, if any, does the most work excluding live contenders — I have a hunch it's whatever you say about what the solution must do with the persistence of disagreement between smart, informed physicalists and smart, informed dualists, rather than with the origin of the intuition in any single head. A table is fine, prose is fine, whatever serves the reasoning. Please don't pad it with textbook exposition of the hard problem itself; I know that part cold and will cut it.
reasoning: |-
  Okay, the user is a philosophy graduate student working on a paper about the meta-problem of consciousness. They want to define the desiderata—requirements that any solution to the meta-problem must satisfy. Their advisor suggested building the specification before evaluating existing solutions. So, I need to help them outline these requirements clearly and critically.

  First, I recall the meta-problem: explaining why humans believe there's a hard problem of consciousness—why we perceive an explanatory gap, find zombies conceivable, and think neuroscience leaves something out. The user's thesis is that the field jumps to solutions without agreeing on what counts as solving it. They mentioned some initial ideas: explaining the phenomenology, non-circularity, evidence-neutrality, and consistency with psychology. They also want to identify if some desiderata conflict, especially regarding neutrality and non-circularity.

  I need to create a list of desiderata, each with a justification. The user wants me to mark them as negotiable or non-negotiable and highlight which one excludes the most contenders. They're wary of biases from dualists or illusionists, like epistemic transparency or mechanistic explanations. I should avoid textbook explanations since they know the hard problem well.

  Starting with non-negotiable desiderata:  
  1. **Phenomenological Adequacy**: The solution must explain the felt experience of the gap, not just reports. This is crucial because the intuition's force is central to the meta-problem.  
  2. **Non-Circularity**: Can't invoke phenomenal consciousness to explain beliefs about it. Essential to avoid begging the question.  
  3. **Psychological Plausibility**: Must align with empirical findings on introspection and cognition. Since the meta-problem is empirical, ignoring psychology undermines it.  

  Now negotiable ones:  
  4. **Evidence-Neutrality**: Ideally, both dualists and physicalists could accept the explanation. But this might be tricky; strict neutrality could weaken the solution. Maybe mark as negotiable with caveats.  
  5. **Internal Consistency**: The explanation shouldn't contradict other cognitive mechanisms. Useful but not as core as the top three.  
  6. **Comprehensive Scope**: Cover all aspects like zombies, gaps, etc. Important but maybe partial explanations exist.  
  7. **Interpersonal Robustness**: Explain why disagreements persist among experts. This might be key for excluding some theories.  

  The user hinted that persistence of disagreement is crucial. If a solution can't explain why experts still disagree, it might fail. Physicalist-leaning theories might see disagreement as confusion, while dualists as insight, so neutrality here is tough.  

  Conflict between non-circularity and neutrality: Non-circularity demands a mechanistic explanation without phenomenal concepts, but dualists might reject that, breaking neutrality. If I prioritize non-circularity, neutrality might be unattainable, which is a result the user could argue for.  

  I should also note that dualist demands for epistemic transparency or illusionist mechanistic demands might be biases. The desiderata should avoid those to stay neutral.  

  Finally, flag that the toughest desideratum excluding contenders might be Interpersonal Robustness, as many theories don't address why smart people still disagree after understanding the mechanisms.
answer: |-
  Below is a distilled set of desiderata for an adequate solution to the meta-problem of consciousness, structured by priority and negotiability. Each requirement is justified, and key tensions (especially between non-circularity and evidence-neutrality) are flagged. The list avoids importing partisan assumptions (e.g., dualist transparency demands or illusionist "mechanism-only" mandates) and focuses on what a *minimally adequate explanation of the intuition* demands, bracketing ontological commitments.  

  ### **Core Desiderata (Non-Negotiable)**  
  These are essential for *any* candidate solution. Failure here invalidates the solution.  

  1. **Phenomenological Adequacy**  
     - **Requirement**: Must explain the *subjective character* of the hard-problem intuition (e.g., its intuitive force, persistence despite counterarguments, and the "felt gap" even after physicalist indoctrination), not merely verbal reports.  
     - **Justification**: The meta-problem targets why the gap *feels* insurmountable. Ignoring phenomenology reduces it to a problem of false belief, but the intuition’s resilience is affective, not just cognitive (Chalmers, 2018).  
     - **Exclusion Power**: High. Ruled out: "Theory-theory" accounts that treat the intuition as a learned error (e.g., "we’re taught Cartesian dualism").  

  2. **Non-Circularity**  
     - **Requirement**: Cannot *implicitly* or *explicitly* invoke phenomenal consciousness (e.g., qualia, raw feels) as a cause of the belief. If invoked, the solution must explain how this avoids question-begging (e.g., via an independent account of how phenomenal concepts arise).  
     - **Justification**: Using consciousness to explain beliefs about consciousness presupposes the very phenomenon in question, collapsing the meta-problem into the hard problem.  
     - **Exclusion Power**: Highest. Ruled out: Direct realist or naïve introspectionist views (e.g., "we feel qualia, so we report them").  

  3. **Psychological Plausibility**  
     - **Requirement**: Must cohere with empirical evidence about introspection, concept formation, attention, and confabulation (e.g., limits of metacognition, illusionism in self-report).  
     - **Justification**: The meta-problem is an empirical puzzle about human cognition. Ignoring psychology (e.g., change blindness, inattentional blindness) renders solutions ad hoc.  
     - **Exclusion Power**: Moderate. Ruled out: Hyper-intellectualized accounts ignoring cognitive limitations (e.g., "we deduce the gap from pure reason").  

  ### **Contextual Desiderata (Negotiable but Critical)**  
  These strengthen the solution but may be flexible if justified.  

  4. **Evidence-Neutrality**  
     - **Requirement**: Should be compatible with both physicalist and non-physicalist ontologies. The explanation of *why we have the intuition* must not presuppose its truth/falsity.  
     - **Justification**: The meta-problem aims to explain the *intuition*, not resolve the hard problem. A solution should be a "common ground" for dualists and illusionists (e.g., both can agree on cognitive mechanisms generating the gap intuition).  
     - **Tension**: Conflicts with **non-circularity**. Dualists may reject *purely* functional mechanisms as question-begging (if they deny functionalism explains phenomenology). Illusionists may reject neutrality if it permits "partial realism." *This tension is likely unavoidable and should be argued as a key result*.  
     - **Negotiability**: Moderate. Strict neutrality may be impossible, but minimal neutrality (e.g., no *explicit* ontological loading) is achievable.  

  5. **Comprehensive Scope**  
     - **Requirement**: Must address all core aspects of the hard-problem intuition: (a) the explanatory gap, (b) zombie conceivability, (c) the "something left out" intuition, and (d) their cultural recurrence.  
     - **Justification**: Isolated explanations (e.g., only zombies) risk being fragmentary. The intuitions are linked in practice (Stoljar, 2006).  
     - **Negotiability**: High. Partial explanations may be valuable, but full solutions require integration.  

  6. **Interpersonal Robustness**  
     - **Requirement**: Must explain why the intuition persists among experts (informed physicalists vs. dualists) despite shared knowledge of cognitive science.  
     - **Justification**: Disagreement among "smart, informed" thinkers is a datum. Solutions attributing the intuition to ignorance (e.g., "they don’t know neuroscience") fail.  
     - **Exclusion Power**: Critical. Ruled out: Deflationary accounts that attribute the intuition *solely* to laypeople or historical accident. This may be the **most excluding desideratum**, as few theories address expert persistence.  

  ### **Suspect "Pseudo-Requirements" to Reject**  
  These are partisan demands masquerading as desiderata:  
  - **Dualist "Epistemic Transparency"**: The idea that subjects *directly apprehend* phenomenality. *Reject*: Empirical work shows introspection is interpretative and fallible (e.g., Nisbett & Wilson, 1977).  
  - **Illusionist "Mechanism-Only"**: That the solution must reduce to computational/neural mechanisms. *Reject*: While desirable for physicalists, it preemptively excludes dualist-friendly (but still naturalistic) explanations (e.g., evolutionary teleosemantics).  
  - **Universal Consensus**: That the solution must predict uniform intuitions. *Reject*: Cultural variability (e.g., Buddhist "no-self" views) doesn’t negate the cross-cultural *recurrence* of the gap intuition.  

  ### **Key Tensions and Implications**  
  - **Non-Circularity vs. Evidence-Neutrality**: Non-circularity demands a mechanistic explanation (e.g., introspective models with predictive processing), but this may violate neutrality by implying illusionism. *Resolution*: Argue that strict neutrality is impossible—solving the meta-problem *naturally* favors one ontology (e.g., if the best explanation is mechanistic, it supports illusionism).  
  - **Phenomenological Adequacy vs. Psychological Plausibility**: Affective force ("feeling" the gap) may resist reduction to confabulation. *Resolution*: Leverage empirical work on emotion-cognition interactions (e.g., affect as a metacognitive marker).  
  - **Interpersonal Robustness as the Lynchpin**: If your solution cannot explain expert disagreement (e.g., via cognitive style differences, like analytic vs. phenomenological thinking; or irreconcilable interpretive frameworks), it fails against the strongest counterexamples.  

  ### **Recommended Table for Your Paper**  
  | Desideratum                     | Status          | Key Justification                                  | Exclusion Power |  
  |---------------------------------|-----------------|---------------------------------------------------|-----------------|  
  | **Phenomenological Adequacy**   | Non-Negotiable  | Intuition's felt force is primary explanandum     | High            |  
  | **Non-Circularity**             | Non-Negotiable  | Avoids begging the hard problem                   | Highest         |  
  | **Psychological Plausibility**  | Non-Negotiable  | Empirical grounding for cognitive mechanisms      | Moderate        |  
  | **Evidence-Neutrality**         | Negotiable      | Ontological agnosticism for common ground         | Low (due to tension) |  
  | **Comprehensive Scope**         | Negotiable      | Addresses linked intuitions (gap, zombies, etc.)  | Moderate        |  
  | **Interpersonal Robustness**    | Negotiable (High Priority) | Explains expert persistence despite knowledge | **Highest** (excludes most contenders) |  

  ### **Conclusion for Your Thesis**  
  Your paper should argue that **non-circularity** and **interpersonal robustness** are the pivotal desiderata: the former forces solutions into mechanistic territory (undermining strict evidence-neutrality), while the latter exposes why existing approaches (e.g., phenomenal concept strategies) fail—they don’t explain why experts like David Chalmers and Daniel Dennett remain deadlocked. The unsatisfiable tension lies in demanding neutrality *while* requiring a non-circular mechanism, suggesting that the meta-problem’s solution inevitably tilts ontological debates. Prioritize phenomenological adequacy and interpersonal robustness to corner illusionists and dualists alike.
