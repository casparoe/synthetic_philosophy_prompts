prompt: |-
  I'm a postdoc co-teaching a graduate seminar on rational choice under ambiguity, and I've been assigned the centerpiece question for our take-home final. The course covered the standard motivations for credal sets, the Ellsberg paradox, and three decision rules in detail: Γ-maximin, Levi's E-admissibility, and Walley's Maximality. In past years the exam question was essentially the Ellsberg urn relabeled, and our strongest students still answered by reciting the standard dialectic — ambiguity aversion, the sure-thing principle, a gesture at "the market-for-uncertainty literature" — without ever doing any actual reasoning. So this year I've built a concrete numerical problem in which the three rules genuinely diverge, and I want the question, a model answer, and a marking scheme.

  Here is the case I want embedded in the question. The Agency for Inland Waters must pick one intervention for Lake Averni. Two consulting labs disagree about the cause of the degradation: the credal set is the convex hull of P1 and P2, where P1(s1) = 0.2 and P2(s1) = 0.8, with s1 = "nutrient-driven" and s2 = "toxin-driven." The options and utilities (in units the agency treats as interpersonally comparable utiles) are: dredging, worth 10 if s1 and 0 if s2; activated-carbon filtration, worth 0 if s1 and 10 if s2; and a hedged combined intervention worth exactly 4 in either state. Part (a) asks the student to determine, with computations, what each of the three rules recommends. Part (b) presents an objection from the agency's deputy director: the hedged option is the only one that doesn't gamble on which lab is right, so any rule that permits choosing an act justified only by a single probability in the set — one the agency has no way to single out — is licensing arbitrariness. Part (c) adds a proposed monitoring study whose evidential import is itself contested: under P1 a positive reading is certain given s1 and impossible given s2, while under P2 the likelihoods are reversed. A board member protests that a rational agent cannot learn to know less, so the study must be worthless or the framework broken; the student must compute the posterior interval for s1 given a positive reading, assess the complaint, and say whether any rule's recommendation actually changes. The fictional objections are invented by me, so the model answer should engage them on the merits rather than hunt for a canonical rebuttal.

  Please deliver three things. First, the exam question exactly as students will see it, under 400 words, assuming the three rules were defined in lecture so the question text should not restate their definitions. Second, a model answer of 700–900 words that shows the expected-utility computations explicitly and defends its normative verdicts. Third, a marking scheme worth 25 marks total, formatted as a table with exactly these four columns: "Must-hit move" (the specific content, not a topic label), "Marks," "What separates an A from a B here," and "Predictable error that loses marks" — with one row per part (a), (b), and (c) plus at least two cross-cutting rows. Finally, append a JSON object with three fields: "crux" (one sentence naming the single move that separates students who understand from students who memorized), "part_a_key" (an object mapping "gamma_maximin," "e_admissible," and "maximality" each to the set of options that rule recommends), and "posterior_interval" (the interval for P(s1) after a positive reading, as a two-element array). Students will have 90 minutes for this question; calibrate the marking scheme accordingly.
reasoning: |-
  We are creating an exam question, model answer, and marking scheme for a graduate seminar on rational choice under ambiguity.

  The case: 
  - States: s1 (nutrient-driven) and s2 (toxin-driven)
  - Credal set: convex hull of P1 and P2, where P1(s1)=0.2, P2(s1)=0.8
  - Acts:
    - Dredging: 10 if s1, 0 if s2
    - Activated-carbon filtration: 0 if s1, 10 if s2
    - Combined intervention: 4 in both states

  Part (a): Determine what each rule (Γ-maximin, Levi's E-admissibility, Walley's Maximality) recommends.

  Part (b): Objection from deputy director: only the hedged option avoids gambling on one lab's probability. The others require arbitrarily picking one probability. How do we respond?

  Part (c): A monitoring study with a positive reading. The likelihoods are contested:
    - Under P1: positive reading is certain given s1, impossible given s2 (so P(positive|s1)=1, P(positive|s2)=0 under P1)
    - Under P2: reversed: P(positive|s1)=0, P(positive|s2)=1 under P2)

  A board member complains: "a rational agent cannot learn to know less", so the study must be worthless or the framework broken.

  Tasks for (c):
    - Compute the posterior interval for s1 given a positive reading.
    - Assess the complaint.
    - Determine whether any rule's recommendation changes (with the positive reading).

  We'll now write the exam question, model answer, marking scheme, and the JSON object.

  Exam Question (under 400 words):

  ---
  **Final Exam Question: Rational Choice for Lake Averni**

  The Agency for Inland Waters must choose an intervention for Lake Averni. Two consulting labs disagree about the cause of degradation. The agency represents this uncertainty with a credal set that is the convex hull of two probability measures: P1(s1)=0.2 and P2(s1)=0.8, where s1 = "nutrient-driven" and s2 = "toxin-driven". The interventions and their utilities (in interpersonally comparable utiles) are:

  - **Dredging**: 10 if s1, 0 if s2.
  - **Activated-carbon filtration**: 0 if s1, 10 if s2.
  - **Combined intervention**: 4 in both states.

  **Part (a)** [10 marks]  
  For each decision rule below, determine which intervention(s) it recommends. Show your computations.  
  (i) Γ-maximin  
  (ii) Levi's E-admissibility  
  (iii) Walley's Maximality  

  **Part (b)** [8 marks]  
  The deputy director objects: "The combined intervention is the only one that doesn't gamble arbitrarily on which lab is right. Any rule that permits choosing an act justified only by a single probability in the set is licensing arbitrariness because the agency has no way to single out that probability." Evaluate this objection with respect to the rules in part (a).

  **Part (c)** [7 marks]  
  A monitoring study is proposed. Its evidential import is contested:  
  - Under P1, a positive reading is certain given s1 and impossible given s2.  
  - Under P2, a positive reading is impossible given s1 and certain given s2.  

  Suppose the study yields a positive reading.  
  (i) Compute the posterior interval for P(s1) (the probability of s1) given this reading.  
  (ii) A board member protests: "A rational agent cannot learn to know less. Therefore, the study must be worthless or the framework broken." Assess this complaint in light of your computation.  
  (iii) Does any decision rule's recommendation for the intervention change after the positive reading? Explain briefly.
  ---

  Model Answer (700-900 words):

  ---
  **Model Answer**

  **Part (a)**

  We compute the expected utility (EU) of each act under both P1 and P2.

  - Dredging:  
    EU under P1: 0.2 * 10 + 0.8 * 0 = 2  
    EU under P2: 0.8 * 10 + 0.2 * 0 = 8  

  - Filtration:  
    EU under P1: 0.2 * 0 + 0.8 * 10 = 8  
    EU under P2: 0.8 * 0 + 0.2 * 10 = 2  

  - Combined:  
    EU under P1: 0.2 * 4 + 0.8 * 4 = 4  
    EU under P2: 0.8 * 4 + 0.2 * 4 = 4  

  Now apply the rules:

  (i) **Γ-maximin** (maximize the minimum EU over the credal set)  
  - Dredging: min(2, 8) = 2  
  - Filtration: min(8, 2) = 2  
  - Combined: min(4, 4) = 4  
  The maximum of these minima is 4, so Γ-maximin recommends the combined intervention.

  (ii) **Levi's E-admissibility** (an act is E-admissible if it maximizes expected utility for some probability in the credal set)  
  - Dredging maximizes EU under P2 (since 8 > max(2,4) under P2? Actually, note: under P2, dredging gives 8, filtration gives 2, combined gives 4 -> so dredging is best under P2).  
  - Filtration maximizes EU under P1 (8 > 2 and 8>4).  
  - Combined: under no probability is it the unique maximum? But note: under any probability, we have:  
    Let P(s1)=p, then EU(dredging)=10p, EU(filtration)=10(1-p), EU(combined)=4.  
    So combined is best only if 10p <= 4 and 10(1-p) <= 4, i.e., p<=0.4 and p>=0.6, which is impossible. Therefore, combined is never the unique maximum. However, Levi's E-admissibility requires that the act is maximal for at least one probability in the credal set (i.e., it is among the best). But note: under what p is combined among the best? It would require that 4>=10p and 4>=10(1-p), which again is impossible. Therefore, combined is not E-admissible.  
    However, note that under P1, filtration has EU 8 and combined 4 -> so combined is not maximal. Under P2, dredging has 8 and combined 4 -> not maximal. But what about at the boundary? We must check the entire convex hull. Let P(s1)=p, then:  
    EU(dredging) = 10p  
    EU(filtration) = 10(1-p)  
    EU(combined) = 4  

    The combined intervention is E-admissible if there exists a p in [0.2,0.8] such that 4 >= 10p and 4 >= 10(1-p).  
    But 4>=10p => p<=0.4, and 4>=10(1-p) => p>=0.6. There is no p satisfying both. Therefore, combined is not E-admissible.  
    Dredging is E-admissible because at p=0.8 (which is in the set) it is optimal (EU=8, which is greater than filtration's 2 and combined's 4).  
    Filtration is E-admissible because at p=0.2 it is optimal (EU=8).  

    Therefore, E-admissibility recommends dredging and filtration, but not combined.

  (iii) **Walley's Maximality** (act A is maximal if there is no other act B such that for every probability in the credal set, the EU of B is at least that of A, and strictly greater for at least one probability)  

  We compare each pair:  
  - Dredging vs Filtration:  
    Under P1: EU(dredging)=2 < 8=EU(filtration)  
    Under P2: EU(dredging)=8>2=EU(filtration)  
    So neither dominates the other.  

  - Dredging vs Combined:  
    Under P1: 2 < 4 -> so combined is better than dredging under P1.  
    Under P2: 8>4 -> dredging is better under P2.  
    Therefore, dredging does not dominate combined (because under P1, combined is better) and combined does not dominate dredging (because under P2, dredging is better).  

  - Filtration vs Combined:  
    Under P1: 8>4 -> filtration better under P1.  
    Under P2: 2<4 -> combined better under P2.  
    So again, neither dominates.  

  Therefore, no act is dominated by another. Hence, all three acts are maximal.

  **Summary for (a):**  
  - Γ-maximin: combined  
  - E-admissibility: dredging and filtration (but not combined)  
  - Maximality: all three  

  **Part (b)**

  The deputy director's objection is that the combined intervention is the only one that does not require arbitrarily selecting one lab's probability. The objection is particularly aimed at rules that allow choosing acts that are justified only by one probability (like E-admissibility and Maximality, which permit dredging and filtration). 

  In response, we note:

  - Γ-maximin avoids the objection because it selects the combined intervention, which is justified by the entire set (it is the worst-case optimal).
  - E-admissibility does permit choosing dredging or filtration, each of which is optimal under one of the extreme probabilities. The rule does not require the decision maker to arbitrarily select one probability; rather, it identifies acts that are optimal under at least one probability in the set. The rule then leaves the choice among E-admissible acts to the decision maker's values (which might include a secondary criterion, such as security or caution). However, the deputy director is right that without a secondary criterion, the choice between dredging and filtration is arbitrary. But that arbitrariness is inherent in the ambiguity: the agency does not have a unique probability to guide the choice. The rule does not license arbitrariness; it reflects the ambiguity by not ruling out acts that are best for some possible probability.
  - Maximality, which also allows dredging and filtration, does so because neither is uniformly worse than the other. The rule only rules out acts that are uniformly worse. The deputy director's concern about arbitrariness applies here too: choosing between non-dominated acts requires additional criteria. However, Maximality is less arbitrary than it might seem because it only rules out acts that are strictly dominated.

  The objection highlights a key difference in the rules: Γ-maximin is a single rule that picks one act, while E-admissibility and Maximality are permissive. The deputy director's viewpoint aligns with ambiguity aversion and the desire to avoid gambling on a single probability. However, E-admissibility and Maximality are designed to be less conservative, allowing acts that might be better if a particular probability turns out to be correct. The arbitrariness is not introduced by the rules but by the lack of information.

  **Part (c)**

  (i) We observe a positive reading. The likelihoods are:  
  - Under P1: P(positive | s1) = 1, P(positive | s2)=0  
  - Under P2: P(positive | s1)=0, P(positive | s2)=1  

  The credal set is the convex hull of P1 and P2. We update each extreme point.

  For P1:  
  Prior: P1(s1)=0.2, P1(s2)=0.8  
  Likelihood: P(positive|s1)=1, P(positive|s2)=0  
  Posterior:  
  P(s1|positive) = [P1(s1) * P(positive|s1)] / [P1(s1)*P(positive|s1) + P1(s2)*P(positive|s2)] 
  = (0.2 * 1) / (0.2*1 + 0.8*0) = 0.2 / 0.2 = 1  
  So under P1, posterior is P(s1|positive)=1.

  For P2:  
  Prior: P2(s1)=0.8, P2(s2)=0.2  
  Likelihood: P(positive|s1)=0, P(positive|s2)=1  
  Posterior:  
  P(s1|positive) = [P2(s1) * P(positive|s1)] / [P2(s1)*P(positive|s1) + P2(s2)*P(positive|s2)]
  = (0.8 * 0) / (0.8*0 + 0.2*1) = 0 / 0.2 = 0  
  So under P2, posterior is P(s1|positive)=0.

  Therefore, the posterior credal set is the convex hull of two probabilities: one that assigns s1 probability 1 and one that assigns s1 probability 0. So the posterior interval for P(s1) is [0,1].

  (ii) The board member's complaint: "a rational agent cannot learn to know less." But in this case, the prior interval for P(s1) was [0.2, 0.8], and the posterior interval is [0,1]. The interval has widened, meaning that the set of probabilities is larger. The board member is correct that the agent now faces more uncertainty (in the sense of a larger set of probabilities) after the positive reading. However, this does not necessarily mean the study is worthless or the framework broken. The result is a consequence of the disagreement in the likelihoods. The two labs not only disagree on the prior but also on the interpretation of the evidence. The positive reading, according to P1, is definitive for s1, but according to P2, it is definitive for s2. Therefore, the evidence is extremely informative under each model, but the models are contradictory. The framework is correctly reflecting the deep disagreement. The study is not worthless: it reveals the conflict between the two models. Without the study, the agency might have been unaware of the extent of the disagreement. The complaint is understandable but overlooks that the evidence has changed the nature of the uncertainty.

  (iii) We must compute the recommendations after the positive reading. The posterior credal set is the convex hull of Q1 (P(s1)=1) and Q2 (P(s1)=0).

  Utilities remain the same.

  Compute EU for each act:

  - Dredging:  
    Under Q1: 10*1 + 0*0 = 10  
    Under Q2: 10*0 + 0*1 = 0  

  - Filtration:  
    Under Q1: 0*1 + 10*0 = 0  
    Under Q2: 0*0 + 10*1 = 10  

  - Combined: 4 in both states, so 4 under both.

  Now apply the rules:

  - Γ-maximin:  
    Dredging: min(10,0)=0  
    Filtration: min(0,10)=0  
    Combined: min(4,4)=4  
    So Γ-maximin still recommends combined.

  - E-admissibility:  
    Dredging: optimal under Q1 (EU=10, which is greater than filtration's 0 and combined's 4).  
    Filtration: optimal under Q2 (EU=10).  
    Combined: not optimal under any probability?  
      Under Q1: 4 < 10 -> not optimal.  
      Under Q2: 4 < 10 -> not optimal.  
    So E-admissible acts are dredging and filtration.

  - Maximality:  
    We check pairs:  
    Dredging vs Filtration:  
      Under Q1: 10>0 -> dredging better.  
      Under Q2: 0<10 -> filtration better.  
      So neither dominates.  
    Dredging vs Combined:  
      Under Q1: 10>4 -> dredging better.  
      Under Q2: 0<4 -> combined better.  
      So no dominance.  
    Filtration vs Combined:  
      Under Q1: 0<4 -> combined better.  
      Under Q2: 10>4 -> filtration better.  
      So no dominance.  
    Therefore, all three are maximal.

  The recommendations do not change for any rule:  
  - Γ-maximin: combined  
  - E-admissibility: dredging and filtration  
  - Maximality: all three  

  However, note that the set of E-admissible and maximal acts remains the same, but the underlying probabilities have changed. The combined intervention remains the Γ-maximin choice and still is not E-admissible, but the other rules still allow the same acts. Therefore, the recommendations are the same as in part (a).
