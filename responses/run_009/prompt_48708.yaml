answer: |-
  ### Exam Question (398 words)

  **Rational Choice for Lake Averni**  
  The Agency for Inland Waters must intervene to restore Lake Averni. Credal uncertainty over degradation causes is modeled as the convex hull of two probabilities:  
  - \(P_1(\text{s1}) = 0.2\), \(P_1(\text{s2}) = 0.8\)  
  - \(P_2(\text{s1}) = 0.8\), \(P_2(\text{s2}) = 0.2\)  
  where \(\text{s1}\): nutrient-driven, \(\text{s2}\): toxin-driven.  

  **Acts and utilities (utiles):**  
  - **Dredging**: 10 if \(\text{s1}\), 0 if \(\text{s2}\)  
  - **Filtration**: 0 if \(\text{s1}\), 10 if \(\text{s2}\)  
  - **Combined**: 4 under both \(\text{s1}\) and \(\text{s2}\)  

  **Part (a) [10 marks]**  
  For each rule below, determine which act(s) it recommends. Show all calculations.  
  (i) \(\Gamma\)-maximin  
  (ii) Levi’s E-admissibility  
  (iii) Walley’s Maximality  

  **Part (b) [8 marks]**  
  The deputy director objects: "The Combined act is uniquely rational because it avoids gambling on one lab’s probability. Rules permitting Dredging or Filtration license arbitrariness—they rely on a single \(P \in \mathcal{C}\) that the agency cannot justify selecting." Engage this objection on the merits for all three rules.  

  **Part (c) [7 marks]**  
  A monitoring study (positive/negative reading) is proposed. Likelihoods are contested:  
  - Under \(P_1\): \(P(\text{positive} \mid \text{s1}) = 1\), \(P(\text{positive} \mid \text{s2}) = 0\)  
  - Under \(P_2\): \(P(\text{positive} \mid \text{s1}) = 0\), \(P(\text{positive} \mid \text{s2}) = 1\)  

  Suppose a *positive* reading is observed.  
  (i) Compute the posterior interval for \(P(\text{s1})\).  
  (ii) A board member argues: "Learning *increased* the set of probabilities—a rational agent cannot ‘know less’ after evidence. Thus, the study is worthless or the framework is broken." Assess this argument.  
  (iii) Do any rule’s recommendations *change* post-reading? Justify briefly.  

  ---

  ### Model Answer (812 words)  

  **Part (a)**  
  *Expected utilities (EU) under \(P_1\) and \(P_2\):*  
  - **Dredging**:  
    \( \text{EU}_{P_1} = (0.2 \times 10) + (0.8 \times 0) = 2 \)  
    \( \text{EU}_{P_2} = (0.8 \times 10) + (0.2 \times 0) = 8 \)  
  - **Filtration**:  
    \( \text{EU}_{P_1} = (0.2 \times 0) + (0.8 \times 10) = 8 \)  
    \( \text{EU}_{P_2} = (0.8 \times 0) + (0.2 \times 10) = 2 \)  
  - **Combined**:  
    \( \text{EU}_{P_1} = (0.2 \times 4) + (0.8 \times 4) = 4 \)  
    \( \text{EU}_{P_2} = (0.8 \times 4) + (0.2 \times 4) = 4 \)  

  *(i) \(\Gamma\)-maximin*: Maximizes the minimum EU.  
  - Min EU for Dredging: \(\min(2, 8) = 2\)  
  - Min EU for Filtration: \(\min(8, 2) = 2\)  
  - Min EU for Combined: \(\min(4, 4) = 4\)  
  \(\Gamma\)-maximin recommends **Combined** (highest min EU, 4).  

  *(ii) Levi’s E-admissibility*: Act \(A\) is E-admissible if \(\exists P \in \mathcal{C}\) such that \(A\) maximizes EU under \(P\).  
  - Dredging maximizes EU under \(P_2\) (EU=8 > 2,4).  
  - Filtration maximizes EU under \(P_1\) (EU=8 > 2,4).  
  - Combined: For any \(P_\lambda = \lambda P_1 + (1-\lambda)P_2\),  
    \(\text{EU}_{\text{Dredging}} = 10(0.2\lambda + 0.8(1-\lambda)) = 10(0.8 - 0.6\lambda)\)  
    \(\text{EU}_{\text{Filtration}} = 10(0.8\lambda + 0.2(1-\lambda)) = 10(0.2 + 0.6\lambda)\)  
    \(\text{EU}_{\text{Combined}} = 4\).  
    Combined maximizes EU only if \(4 \geq 10(0.8 - 0.6\lambda)\) and \(4 \geq 10(0.2 + 0.6\lambda)\), i.e., \(\lambda \geq \frac{2}{3}\) and \(\lambda \leq \frac{1}{3}\)—impossible. Thus, Combined is *not* E-admissible.  
  E-admissibility recommends **Dredging and Filtration**.  

  *(iii) Walley’s Maximality*: Act \(A\) is maximal iff no act \(B\) has \(\text{EU}_P(B) \geq \text{EU}_P(A)\) \(\forall P \in \mathcal{C}\), with strict inequality for some \(P\).  
  - Dredging vs. Filtration:  
    \(P_1\): \(2 < 8\) (Filtration better), \(P_2\): \(8 > 2\) (Dredging better). No dominance.  
  - Dredging vs. Combined:  
    \(P_1\): \(2 < 4\) (Combined better), \(P_2\): \(8 > 4\) (Dredging better). No dominance.  
  - Filtration vs. Combined:  
    \(P_1\): \(8 > 4\) (Filtration better), \(P_2\): \(2 < 4\) (Combined better). No dominance.  
  All acts are maximal.  

  **Summary for (a):**  
  - \(\Gamma\)-maximin: **Combined**  
  - E-admissibility: **Dredging, Filtration**  
  - Maximality: **All three acts**  

  **Part (b)**  
  The deputy director’s objection targets arbitrariness in selecting acts justified only under a single \(P \in \mathcal{C}\). Responses per rule:  

  - **\(\Gamma\)-maximin**: Avoids the objection. It selects Combined based on *worst-case robustness* across *all* \(P \in \mathcal{C}\), not any single \(P\). It never "gambles" on one lab.  

  - **E-admissibility**: The objection has merit but mischaracterizes the rule. E-admissibility identifies acts *permitted* by *some*\(P \in \mathcal{C}\)—it does *not* require the agency to "select" one \(P\). Choosing between Dredging and Filtration *is* arbitrary absent a secondary criterion (e.g., security), but this reflects ambiguity: no uniquely rational choice exists. The rule *exposes* indeterminacy without licensing caprice.  

  - **Maximality**: Similar to E-admissibility. Maximality’s permissiveness (all acts) highlights that no act is uniformly dominated, but arbitrariness remains in choosing among non-dominated options. Crucially, Maximality *forbids* acts that are uniformly worse (none here), which is a minimal rationality constraint. The deputy director’s preference for ambiguity aversion (avoiding gambles) is valid but not universally mandated.  

  **Conclusion**: The objection is strongest against \(\Gamma\)-maximin’s competitors but overlooks that E-admissibility/Maximality *systematize* indeterminacy—they don’t invent arbitrariness.  

  **Part (c)**  
  *(i) Posterior interval for \(P(\text{s1})\) after positive reading*:  
  Update extreme points of \(\mathcal{C}\) via Bayes:  
  - Under \(P_1\):  
    \[
    P_1(\text{s1} \mid \text{pos}) = \frac{P_1(\text{pos} \mid \text{s1}) P_1(\text{s1})}{P_1(\text{pos})} = \frac{1 \times 0.2}{0.2 \times 1 + 0.8 \times 0} = 1
    \]  
  - Under \(P_2\):  
    \[
    P_2(\text{s1} \mid \text{pos}) = \frac{P_2(\text{pos} \mid \text{s1}) P_2(\text{s1})}{P_2(\text{pos})} = \frac{0 \times 0.8}{0.8 \times 0 + 0.2 \times 1} = 0
    \]  
  The posterior credal set is the convex hull of \(P(\text{s1}) = 0\) and \(P(\text{s1}) = 1\). Thus, the interval is **[0, 1]**.  

  *(ii) Assessing "cannot learn to know less"*:  
  The complaint confuses *knowledge* with *precision*. The prior interval \([0.2, 0.8]\) is a subset of \([0, 1]\), meaning the *set* of probabilities expanded—but this arises from contradictory evidence interpretations, not epistemic failure. Under \(P_1\), a positive reading *confirms* \(\text{s1}\); under \(P_2\), it *confirms* \(\text{s2}\). The study *reveals fundamental disagreement*; it isn’t worthless. A rational agent *can* "learn less" in set width when evidence amplifies conflict between models. The framework correctly handles this.  

  *(iii) Rule recommendations post-reading*:  
  Posterior EU under \(Q_1(P(\text{s1})=1)\) and \(Q_2(P(\text{s1})=0)\):  
  - Dredging: \(10\) (\(Q_1\)), \(0\) (\(Q_2\))  
  - Filtration: \(0\) (\(Q_1\)), \(10\) (\(Q_2\))  
  - Combined: \(4\) (\(Q_1\)), \(4\) (\(Q_2\))  

  - \(\Gamma\)-*maximin*: Min EU: Dredging=0, Filtration=0, Combined=4 → **Combined** (unchanged).  
  - *E-admissibility*: Dredging max under \(Q_1\), Filtration under \(Q_2\); Combined never optimal → **Dredging/Filtration** (unchanged).  
  - *Maximality*: No dominance (e.g., Dredging vs. Combined: \(10>4\) under \(Q_1\), \(0<4\) under \(Q_2\)) → **All three** (unchanged).  
  **No rule’s recommendations change**.  

