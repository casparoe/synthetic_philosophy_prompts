prompt: |-
  I serve on the board of my neighborhood association in a mid-size city that has grown fast over the past decade, and I've been asked to draft our positions document for an upcoming candidates' forum. My friends tell me my views on housing are all over the map — one week I'm signing a regional letter demanding that the city permit far more housing, the next I'm siding with the association against a mid-rise proposal two blocks from my house — and before I put anything on paper I want an honest consistency check. So here is the full set of positions I'd like to defend, as I actually hold them: (1) everyone has a right to live in the region where their life is anchored — where their work, family, language, and caring obligations are — and not merely wherever housing happens to be cheap; (2) land-use decisions should be made at the most local level that is feasible, and when the city council or the state legislature overrides a neighborhood plan, something has gone wrong democratically even when the override produces housing I want; (3) rent control is a mistake, because it suppresses new supply and misallocates the housing that exists; (4) new developments above a certain size should be required to include a substantial share of below-market units; (5) a family's equity in its home is a morally serious stake — for most households it is the entire retirement — and it is unfair to ask one cohort of owners to absorb, through falling home values, the cost of a regional problem they did not create; (6) when a neighborhood becomes desirable, its long-time residents have a real claim to remain there, justifying right-to-remain programs, legacy preferences, and where necessary limits on redeveloping occupied buildings; and (7) owning land carries a strong right to develop it as the owner sees fit, constrained only by direct harms to neighbors such as noise, shadows, or toxins — not by neighbors' aesthetic preferences or their worries about parking.

  What I want from you is not a lecture on housing policy and not a survey of what planners or philosophers think — I want an audit of this specific set. Go through the commitments pair by pair (and in combinations, where it takes three to make trouble) and tell me which are genuinely in tension, which only look like they are, and how badly. For each genuine tension, say what the cheapest consistent fix would be and what following through on that fix would cost me — in policy terms, in fairness to particular people, or in whatever currency the conflict is actually denominated in. Please rank the tensions by severity rather than presenting them as one undifferentiated blob, and be specific about which commitment has to give in each case. I honestly don't know where the worst problem is, so don't soft-pedal anything to spare me; but equally, don't manufacture contradictions — if two of my positions can be held together once they're stated carefully, tell me that too and show me the careful statement.

  Once you've worked through the analysis in prose, close with a summary table so I can see the whole audit at a glance. Use exactly these columns: "Commitments involved" (the numbers from my list), "Real or merely apparent" (your verdict on whether it's a genuine tension), "Severity" (high / moderate / low), "Cheapest fix" (which commitment gives, and how), and "Cost of the fix" (what I lose or owe by making it). One row per tension you identify, ordered from most to least severe, and a final row for anything in my set that you judge fully consistent with the rest. After the table, add two or three sentences telling me which single revision would clean up the most, in case I decide I'd rather reorganize the whole package than patch it.
reasoning: |-
  Hmm, the user is asking me to audit their set of housing policy positions for logical consistency. They serve on a neighborhood association board in a fast-growing city and want to draft a coherent positions document for a candidates' forum. Their friends say their views seem inconsistent - they sometimes advocate for more housing but also oppose specific developments near their home.

  They've listed seven distinct commitments:
  1. Right to live where one's life is anchored
  2. Local land-use decision making
  3. Opposition to rent control
  4. Inclusionary zoning requirements
  5. Protection of homeowner equity
  6. Right-to-remain for long-time residents
  7. Strong property development rights

  I need to analyze these pairwise and in combinations to identify genuine tensions versus apparent ones. For each real tension, I should propose the "cheapest fix" (which commitment needs adjustment) and explain the cost of that adjustment. I need to rank tensions by severity and provide a summary table with specific columns. Finally, I should suggest which single revision would clean up the most inconsistencies.

  Looking at the positions, several tensions jump out immediately. Position 7 (strong property rights) conflicts directly with position 4 (mandatory below-market units) since inclusionary zoning restricts what owners can build. Position 7 also conflicts with position 2 (local control) because local restrictions could violate the strong property rights principle.

  Position 5 (protecting homeowner equity) and position 6 (right-to-remain) both seem to prioritize existing residents but clash with position 1 (right to live where anchored) for newcomers. If we protect existing residents from change, we make it harder for newcomers to access the neighborhood.

  Position 1 (right to anchor) conflicts with position 2 (local control) because local communities often resist growth that would accommodate newcomers. Position 3 (opposition to rent control) actually aligns with position 1 since rent control can reduce supply, making it harder for people to live where anchored.

  I need to be careful not to manufacture contradictions where none exist. For example, position 3 (anti-rent control) and position 4 (inclusionary zoning) might seem contradictory but actually serve different purposes - one prevents price controls while the other mandates affordability through new construction.

  The most severe tension seems to be between position 7 (strong property rights) and several other positions that restrict development. The cheapest fix might be to moderate position 7 to allow reasonable regulations for community benefits. This costs the principle of absolute property rights but gains consistency.

  For the summary table, I'll organize the tensions from high to low severity. High severity would include property rights vs inclusionary zoning and property rights vs local control. Moderate might include homeowner equity vs regional housing needs. Low could include rent control vs other positions where there's actually alignment.

  The single most effective revision would be to soften position 7 on absolute property rights, as this resolves multiple high-severity tensions. Alternatively, clarifying that "direct harms" in position 7 includes economic/social impacts could help, but that might stretch the original meaning too far.

  I'll structure my response with clear analysis of each tension, then provide the requested table, and finally suggest that prioritizing either position 1 (right to anchor) or position 7 (property rights) as the core value would help reorganize the package more coherently.
answer: |-
  Below is a systematic consistency audit of your seven positions, analyzed pair-by-pair and in critical combinations. I identify **five genuine tensions** (three high-severity, two moderate) and **one apparent tension that dissolves with clarification**. I rank tensions by severity, propose the "cheapest fix" (minimal concession needed for consistency), and state its cost. Finally, I provide the requested summary table and a strategic recommendation.

  ---

  ### **High-Severity Tensions** (Fundamental conflicts requiring significant revision)

  1. **Commitments Involved: #4 (Inclusionary Zoning) + #7 (Strong Property Rights)**  
     **Real Tension:** Mandating below-market units (#4) directly violates #7's principle that owners should develop "as they see fit" constrained only by direct physical harms (noise, toxins, etc.). Forcing wealth transfer via affordable units is an economic/social regulation, not a physical harm mitigation.  
     **Cheapest Fix:** Moderate **#7** to allow regulations addressing *regional* needs (e.g., affordability crises) as legitimate constraints beyond physical harms.  
     **Cost:** Sacrifices absolute property rights purity. Owners bear quasi-tax burden for public good. Risks reduced development interest if mandates are onerous.

  2. **Commitments Involved: #2 (Local Control) + #1 (Right to Anchor Regionally)**  
     **Real Tension:** Hyper-local control (#2) enables neighborhoods to block housing growth, directly undermining #1's guarantee that people can live near their anchors (jobs, family). Neighborhood vetoes often *cause* regional scarcity.  
     **Cheapest Fix:** Qualify **#2** to accept overrides when local decisions systematically frustrate *regional* housing needs (e.g., jobs-housing imbalance).  
     **Cost:** Democratic deficit at local level; neighborhoods lose absolute sovereignty. Owners/residents lose unilateral power to shape community character.

  3. **Commitments Involved: #5 (Protect Home Equity) + #6 (Right-to-Remain) + #1 (Right to Anchor)**  
     **Real Tension:** Protecting incumbent equity (#5) and occupancy (#6) requires restricting supply (e.g., opposing mid-rises), which inflates prices and prevents newcomers from anchoring (#1). #5/#6 shield one group from market adjustments, transferring costs to outsiders.  
     **Cheapest Fix:** Limit **#5** to *insulating* owners from catastrophic devaluation (e.g., via tax relief), not freezing values. Limit **#6** to truly vulnerable residents (e.g., low-income elderly), not all long-timers.  
     **Cost:** Existing owners absorb some financial risk; long-timers without vulnerability claims lose special protections. Moral claim diluted to pragmatic safety net.

  ---

  ### **Moderate-Severity Tensions** (Clashes resolvable with targeted refinement)

  4. **Commitments Involved: #6 (Right-to-Remain) + #7 (Strong Property Rights)**  
     **Real Tension:** Occupancy limits or legacy preferences (#6) prevent owners from redeveloping occupied buildings ("as they see fit" per #7). This is a regulatory taking, not a physical harm.  
     **Cheapest Fix:** Narrow **#6** to *voluntary* programs (e.g., owner incentives to preserve legacy tenants) or publicly funded buyouts. Avoid coercive limits on redevelopment.  
     **Cost:** Weakens "right-to-remain" enforceability; requires public subsidy for occupants at owner/developer expense.

  5. **Commitments Involved: #2 (Local Control) + #7 (Strong Property Rights)**  
     **Real Tension:** Local vetoes (#2) often rely on aesthetic/parking concerns, which #7 explicitly rejects as invalid constraints. Empowering neighbors to block projects via subjective preferences contradicts owner sovereignty.  
     **Cheapest Fix:** Reform **#2** to exclude non-physical objections (parking/aesthetics) from legitimate local veto criteria.  
     **Cost:** Neighborhoods lose control over "character" issues; residents endure disliked (but harmless) developments.

  ---

  ### **Apparent Tension that Dissolves with Clarification**
  - **Commitments Involved: #3 (Anti-Rent Control) + #4 (Inclusionary Zoning)**  
    **Verdict:** Merely Apparent.  
    **Resolution:** #3 opposes *price controls on existing stock* (distorting markets). #4 mandates below-market units in *new construction* (shifting development costs). These address different market segments and needn’t conflict. **Consistent if:** #4 avoids imposing affordability on existing properties.

  ---

  ### **Fully Consistent Commitments**
  - **#1 (Right to Anchor) + #3 (Anti-Rent Control):** Rent control reduces supply, worsening access. Opposition aligns with expanding housing opportunity.  
  - **#3 (Anti-Rent Control) + #5 (Protect Equity):** Both oppose policies that reduce property values/investment.  
  - **#1 (Right to Anchor) + #7 (Property Rights):** Strong development rights *enable* supply growth to meet demand.

  ---

  ### Summary Table
  | Commitments Involved | Real or Apparent | Severity | Cheapest Fix                           | Cost of Fix                                                                 |
  |----------------------|------------------|----------|----------------------------------------|-----------------------------------------------------------------------------|
  | #4 + #7             | Real            | High     | Moderate #7 to allow affordability mandates | Sacrifice absolute property rights; burden shifted to developers            |
  | #1 + #2             | Real            | High     | Qualify #2 to allow regional overrides | Loss of local democratic sovereignty; neighborhood autonomy reduced         |
  | #5 + #6 + #1        | Real            | High     | Narrow #5 to catastrophic loss; target #6 to vulnerable | Existing owners bear risk; non-vulnerable long-timers lose protections      |
  | #6 + #7             | Real            | Moderate | Narrow #6 to voluntary/publicly funded | Reduced enforceability of "right-to-remain"; requires public subsidy       |
  | #2 + #7             | Real            | Moderate | Reform #2 to exclude non-physical harms | Neighborhoods lose control over aesthetics/parking; residents face unwanted development |
  | #3 + #4             | Apparent        | —        | (No fix needed)                        | —                                                                           |
  | Remaining pairs     | Consistent      | —        | (No fix needed)                        | —                                                                           |

  ---

  ### Strategic Recommendation
  **Reorganize around #1 (Right to Anchor) as the core principle.** This forces explicit trade-offs:  
  - **Cost:** Requires relaxing #2 (local vetoes), #5 (equity protection), and #7 (absolute property rights) to enable sufficient housing supply.  
  - **Benefit:** Resolves 3/5 high-severity tensions and aligns policies with regional opportunity. If unwilling, **moderating #7** (property rights) resolves the most tensions (#4+7, #6+7, #2+7) but weakens libertarian foundations. Choose your North Star: housing access or owner sovereignty.
