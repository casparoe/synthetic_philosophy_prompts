prompt: |-
  My friend and I got into a three-hour argument last night about commitment races and I'm still annoyed, so let me try to sort out what's actually worth working on here instead of just re-arguing it with you.

  By commitment races I mean, roughly (this is at least how the argument went): in a bargaining situation, whichever agent can bind itself first — credibly commit to not backing down — grabs more of the surplus, so everyone has an incentive to make binding commitments as early as possible, maybe even before knowing much about the other side. And if the other side is doing the same, you get a race where agents lock themselves into mutually destructive positions, or effectively hand decision-making over to whatever crude process made the commitment, all for bargaining leverage that might never pay off. The nastiest version is agents trying to precommit to nearly everything up front, which seems obviously terrible but also maybe forced if everyone expects it of you.

  We ended up stuck on which question in this space actually matters most and made zero progress. So: suppose someone — me, honestly; I've got one semester, a philosophy background, and no real ML skills — wants to write something useful on this. Which open questions should get priority, and why? I'm less interested in the list than in the reasoning behind it: for each question, what makes it upstream of the others (what work quietly depends on it being settled first), whether it's tractable with armchair conceptual methods rather than experiments or code, and what would make you bump it up or down your list. Also, and maybe most important, tell me which parts of this whole framing are overrated — my friend kept insisting the answer to the entire thing is just "game theory already says don't make dumb commitments," and if he's right about that I'd rather know now than after sinking a semester into it. He also claimed anything about real AI systems is pointless speculation until we know what they look like, which felt like a cop-out but I couldn't quite say why — if you agree with him, say so.

  Don't just hand me topic names, defend the ordering. And no reading lists please, I can dig those up myself.
