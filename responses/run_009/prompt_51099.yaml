  Based on your friend's established rulings, her verdict on the AI case is likely **"Yes, it is a genuine and valuable work of hers."** Here's the reasoning, the underlying rule, alternative rules, and the test case:

  ### Your Friend's Likely Verdict Explained
  1.  **Conceptual Authorship & Endorsement (Duchamp/Conceptual Artist Precedent):** Like Duchamp's *Fountain* (a readymade he didn't physically make) and the conceptual artist using fabricators, your friend prioritises the originating concept, selection, and artist's endorsement over physical execution. The AI artist curated, selected twelve images, arranged them into an installation, and exhibited them under her own name. This mirrors Duchamp selecting the urinal or the conceptual artist directing fabrication – the core creative act lies in the conception, curation, and presentation.
  2.  **Artist's Claim & Presentation (Vermeer's Studio Precedent):** Just as she accepts the Vermeer painting signed and sold by him (even if largely made by an assistant) as a genuine Vermeer, she will accept the AI installation presented under the artist's name as her genuine work. The artist's act of claiming authorship and presenting it as her creation is crucial.
  3.  **Distinguishing from Replicas & Fakes:**
      *   The AI images are *new originals*, not copies of an existing artwork (unlike the burned-painting replica, which lacked the original's history and context).
      *   The primary creative input comes from the artist's curation and intent, not deceptive forgery (unlike Van Meegeren). The AI is a tool, similar to the conceptual artist's fabricators or Vermeer's assistant.
      *   The molecular duplicate lacked the *provenance* and history of the original Monet. The AI installation has its *own* provenance – its creation and curation *by this artist*.

  ### The Apparent Underlying Rule
  Based solely on the six rulings, her rule seems to be:
  **"An artwork is genuine and derives its primary artistic value from the *intentional act of artistic creation and presentation* by the recognised author. This includes conception, significant selection/curation, endorsement, and presentation as the author's own work. Physical execution by the author's hand is not necessary, nor is physical uniqueness (if the uniqueness stems from history/provenance rather than concept). Authenticity and value reside primarily in the *author's creative agency* manifested through concept, selection, and presentation, rather than in the physical artefact's material origin or uniqueness per se."**

  ### Other Rules That Fit the Six Rulings (But Might Differ on AI)
  1.  **The "Causal Chain of Artist's Intention" Rule:**
      *   Genuineness requires the physical object to be the direct result of the artist's specific intention *at the moment of its creation*. Vermeer intended *that specific canvas* when he signed it. Duchamp intended *that specific urinal*. The conceptual artist intended the work fabricated by assistants. Van Meegeren intended deception, not Vermeer's intention. The molecular duplicate wasn't intended by Monet. The replica wasn't intended *as the original* when first created.
      *   *Fits the six?* Yes. Van Meegeren (wrong intention), Duplicate (no Monet intention), Fountain (Duchamp's intention), Vermeer Studio (Vermeer's intention for that canvas), Conceptual Artist (artist's intention via assistants), Replica (new intention for a copy).
      *   *AI Verdict under this rule?* **Likely Yes.** The artist specifically intended the *selected and arranged installation* using AI generation as a tool. The curation is the key intentional act bringing the work into being.
  2.  **The "Artist's Directive Control" Rule:**
      *   Genuineness requires the artist to have directed the creation of the specific form through human agents or processes they directly controlled. Vermeer controlled the studio. Duchamp selected/controlled the urinal's presentation. The conceptual artist directs the fabricators. Van Meegeren controlled the creation (but deceptively). The duplicate wasn't controlled by Monet. The replica was controlled by the artist, but the *original form* wasn't under her control at *its* creation.
      *   *Fits the six?* Yes. Van Meegeren (control but fraud), Duplicate (no Monet control), Fountain (Duchamp controlled selection/presentation), Vermeer Studio (Vermeer controlled the studio/output), Conceptual Artist (artist controlled fabrication), Replica (artist controlled creation but not the original's form-at-creation).
      *   *AI Verdict under this rule?* **Uncertain/Debatable.** Did the artist have "directive control" over the AI's *specific output*, or was she selecting from autonomous generations? If she heavily directed the AI with detailed prompts for *each* image, it leans towards "Yes". If she simply typed broad concepts and cherry-picked outputs, it leans towards "No" under this rule, as the AI's generation is seen as too autonomous.

  ### The Best Further Case to Tell These Rules Apart
  **The "Unaided AI Selection" Case:**
  *   An artist finds thousands of images generated by an AI *that was not prompted or trained by her*. She selects twelve, arranges them into an installation, and exhibits it under her own name.

  *   **Prediction under "Conceptual Authorship & Presentation" Rule (Original Apparent Rule):** Likely **Yes, genuine.** The core creative act remains the curation, selection, arrangement, and presentation – the artist is still the author of the *installation as a conceptual whole*. The origin of the raw images is secondary, like Duchamp finding a urinal.
  *   **Prediction under "Causal Chain of Artist's Intention" Rule:** Likely **Yes, genuine.** Her specific intention *caused* this particular installation to come into being through her act of selection and arrangement. The images existed, but the artwork (the installation) did not until she formed and executed her intention for it.
  *   **Prediction under "Artist's Directive Control" Rule:** Likely **No, not fully genuine/valuable.** The artist exerted no control over the creation of the *specific images* themselves. She merely found and arranged pre-existing (AI-generated) objects. This would be more akin to someone arranging interesting driftwood they found – the authorship of the *components* is missing or non-human, and the artist's control was only over arrangement, not generation. This contrasts sharply with directing assistants or even directing an AI *she* employed.

  **Why this test case works:** It directly probes the necessity of the artist's involvement in the *generation* of the components versus the *selection and presentation* of the components. The first two rules (Conceptual, Intention) prioritise the latter act as sufficient for authorship of the final work. The Directive Control rule requires the former for the components to be considered part of the artist's genuine output. Her verdict on this "Unaided AI Selection" case would be highly revealing.

  **In summary:** Based on her precedents (especially Duchamp and the conceptual artist), your friend is highly likely to accept the AI installation as the artist's genuine and valuable work. Her core rule centres on authorship through concept, curation, and presentation, not manual execution. The key distinction lies in whether the artist's creative agency is sufficiently exercised *over the final presented work*. To pinpoint her rule more precisely, present the "Unaided AI Selection" case – her reaction will clarify whether directive control over the *generation of components* is essential, or if curation/presentation alone suffices.
