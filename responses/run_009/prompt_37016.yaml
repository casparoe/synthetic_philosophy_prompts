answer: |-
  Here is a translation of the principle of indifference, Bertrand's paradox, and its proposed resolutions into the vocabulary of measure-theoretic probability, invariance, and noninformative prior selection. I follow this with a residue report, addressing your specific questions and highlighting where translation alters, clarifies, or fails to capture the philosophical debate.

  ### Translation: Principle of Indifference & Bertrand's Paradox in Probabilistic Terms
  1.  **Principle of Indifference (Classical Statement):**
      *   *Translation:* Given a sample space Ω parametrized by a random variable Θ taking values in a parameter space Γ, and lacking information distinguishing points in Γ, one should adopt a *dominating measure* ν on Γ such that the probability density p(θ) = dP/dν is constant (uniform) *relative to that parametrization*. Crucially, "uniform" is a property of the density *with respect to the chosen measure ν and parametrization θ*; it is not an intrinsic property of subsets of Γ. Failure occurs when different "natural" parametrizations (θ, φ, ...) of the *same underlying physical possibility space* Ω imply different uniform densities under their respective natural dominating measures (dν_θ, dν_φ, ...), leading to contradictory probability assignments for the same event A ⊂ Ω.

  2.  **Bertrand's Paradox (The Chord Problem):**
      *   *Setup:* Ω = {chords of a unit circle}. Event A = {chord length > √3} (longer than the side of the inscribed equilateral triangle).
      *   *Parametrization 1 (Fixed Radius, Uniform Angle):*
          *   Γ₁ = [0, 2π) (angle θ between chord and a fixed radius).
          *   Natural Dominating Measure: ν₁ = Lebesgue measure dθ.
          *   Uniform Density: p₁(θ) = 1/(2π).
          *   P(A) = ∫_{A} dθ / (2π) = 1/2.
          *   *Invariance:* Rotationally invariant (Haar measure for SO(2) on the circle).
      *   *Parametrization 2 (Fixed Direction, Uniform Radial Distance):*
          *   Γ₂ = [0, 1] (distance d from center to chord, perpendicular to a fixed direction).
          *   Natural Dominating Measure: ν₂ = Lebesgue measure dd.
          *   Uniform Density: p₂(d) = 1.
          *   P(A) = ∫_{d<1/2} dd = 1/2 (since A occurs when d < 1/2).
          *   *Invariance:* Translationally invariant along the fixed diameter (Haar measure for ℝ acting on the diameter).
      *   *Parametrization 3 (Uniform Endpoints on Circumference):*
          *   Γ₃ = [0, 2π) × [0, 2π) (angles φ₁, φ₂ of chord endpoints).
          *   Natural Dominating Measure: ν₃ = Lebesgue measure dφ₁dφ₂.
          *   Uniform Density: p₃(φ₁, φ₂) = 1/(4π²).
          *   P(A) requires integrating over configurations where |φ₁ - φ₂| mod 2π > 2π/3, yielding P(A) = 1/3.
          *   *Invariance:* Rotationally invariant (SO(2) acting on S¹ × S¹). Note this measure differs fundamentally from the Haar measure on the space of chords (see Jaynes below).
      *   *The Paradox:* Three "uniform" densities, defined relative to three different parametrizations and their natural dominating measures, assign three different probabilities (1/2, 1/2, 1/3) to the same event A. (Parametrization 3 actually yields 1/3; 1/4 is common in discussions where A is defined as chord length > side, but the calculation often shown uses a different endpoint-based method yielding 1/4. The core issue is the same: multiple conflicting "uniform" assignments).

  3.  **Jaynes's Transformation-Group Resolution:**
      *   *Translation:* The "symmetries of the problem" define a transformation group G acting on the sample space Ω (e.g., rotations and scalings for Bertrand's chord problem applied to a circle of unknown radius). The uniquely invariant (Haar) measure under G provides the correct dominating measure ν_G. The probability density is then uniform *relative to ν_G*.
      *   *Applied to Bertrand:* Jaynes argues G is the Euclidean group in 2D (rotations + translations + scalings), acting on the circle (and its chords). The Haar measure for this group, when restricted to chords within a fixed circle (breaking scale invariance), reduces to the measure from Parametrization 1: uniform in the angle θ relative to a fixed radius (or equivalently, uniform in the direction of the perpendicular from the center). This yields P(A) = 1/2. Jaynes claims this resolves the paradox by selecting the unique "correct" invariant measure reflecting the problem's symmetries.

  4.  **Objections to Jaynes:**
      *   *Multiple Symmetries/Objections:* Depending on what is considered "ignorant," different groups G might seem natural. For example:
          *   If only rotational symmetry is demanded (ignoring scale), SO(2) invariance applies, consistent with Parametrization 1 (P=1/2) *and* Parametrization 3 (P=1/3 on the endpoint space, but note: the *induced measure on the chord space* from uniform endpoints is *not* rotationally invariant for chords! The endpoint space symmetry SO(2)×SO(2) is larger than the chord space symmetry SO(2)). This highlights that symmetry on the *chosen parametrization space* doesn't necessarily induce the desired symmetry on the *event space* Ω.
          *   If translational symmetry along a diameter is considered fundamental (ignoring rotation), one gets Parametrization 2 (P=1/2). Jaynes argues scale *and* rotation are essential for "ignorance," rejecting this.
      *   *Van Fraassen's Cube Factory:* The problem: "A factory produces cubes with side length between 0 and 1 unit. What is the probability a randomly selected cube has side length ≤ 1/2?" Parametrizations:
          *   Γₐ = [0,1] (side length L). Natural νₐ = dL. P(L ≤ 1/2) = 1/2.
          *   Γᵦ = [0,1] (face area A = L²). Natural νᵦ = dA. Uniform p(A) implies P(A ≤ 1/4) = P(L² ≤ 1/4) = P(L ≤ 1/2) = 1/4.
          *   Γ_c = [0,1] (volume V = L³). Natural ν_c = dV. Uniform p(V) implies P(V ≤ 1/8) = P(L ≤ 1/2) = 1/8.
      The transformation group approach fails: There is no natural nontrivial group G acting on the sample space of cubes (or their linear dimensions) that uniquely determines a measure. Scaling transformations are broken by the fixed bounds (0 and 1). The "symmetries of the problem" (just the bounds) are insufficient to determine a unique invariant measure. The machinery has nothing to say; P(L ≤ 1/2) is fundamentally underdetermined by the information given.

  ### Residue Report: Mapping Classical Debate to Probabilistic Vocabulary
  **Part 1: Elements Mapping Cleanly**
  *   **Parametrization Dependence:** The core issue of Bertrand's paradox maps perfectly. You understand that probabilities are defined relative to a sample space, a σ-algebra, and a measure. Assigning a "uniform" density requires specifying the parametrization and its dominating measure. The paradox starkly illustrates this dependence.
  *   **Dominating Measure:** The concept central to defining "uniform" is precisely the dominating measure ν. The paradox arises from choosing different ν's based on different parametrizations.
  *   **Invariance/Haar Measure:** Jaynes's transformation-group approach maps directly to selecting a prior (dominating measure) that is invariant under a group G of transformations deemed symmetries of the problem. The Haar measure (unique up to scalar for compact G) provides the mathematical tool. This is a standard method for constructing noninformative/reference priors (e.g., uniform on a compact group).
  *   **Jaynes's Resolution (Mathematically):** His derivation of a specific measure (Parametrization 1) as the Haar measure of E(2) restricted to chords is a valid mathematical result within invariance-based prior selection.
  *   **Underdetermination in Cube Factory:** The failure to get a unique answer maps cleanly to the concept of an underdetermined problem. The sample space and event are defined, but the information provided (bounds on L/A/V) is insufficient to specify a unique dominating measure ν. Reference prior methods (like Jeffreys) also fail here without specifying the parameter of interest.

  **Part 2: Elements Mapping with Distortion**
  *   **Principle of Indifference as "Invariance":** Translating "no reason to favor" directly as "invariance under G" is a *substantive assumption*, not a neutral rendering. It builds in the claim that *epistemic indifference* (lack of discriminating knowledge) *entails* *symmetry* of the probability assignment under transformations preserving the problem's structure. Many philosophers dispute this entailment. They argue that indifference *might* justify symmetry, but it's not logically necessary, and symmetry might sometimes be justified *without* indifference (e.g., by physical knowledge). Your vocabulary captures the mathematical consequence (invariant measure) but implicitly adopts Jaynes's normative stance about what indifference *requires*.
  *   **"Noninformative" vs. "Indifferent":** Concepts like maximum entropy (MaxEnt), reference priors, and Jeffreys priors are sophisticated mathematical formalizations aiming to quantify "noninformativeness." They map onto the *goal* of the principle of indifference but distort its simplicity. MaxEnt maximizes uncertainty (Shannon entropy) relative to constraints – a specific, often compelling, operationalization of indifference, but not the only possible one. Jeffreys priors (based on Fisher information) are invariant under reparametrization, addressing one aspect of the paradox, but can conflict with other notions (like group invariance). These are specific *implementations* of the underlying epistemic goal, not direct translations of the simple principle.
  *   **Normative Force:** The mathematical machinery (Haar measure, MaxEnt, Jeffreys) provides *candidate* noninformative priors. Translating the principle of indifference as simply *using one of these methods* loses the classical principle's stronger *normative claim*: that an agent *rationally ought* to assign equal probabilities in the indifferent case. The mathematics provides tools; the philosophy argues (or disputes) that rationality commands using a specific tool (or class of tools) under ignorance. The mapping captures the tool but blurs the normative assertion about its *obligatory* use.

  **Part 3: Elements Unexpressible in the Vocabulary**
  *   **The Normative Core of "Ought":** The fundamental philosophical claim of the principle of indifference – that an agent, *purely in virtue of lacking discriminating knowledge*, is *rationally required* or *epistemically entitled* to assign equal probabilities – cannot be expressed or justified within the mathematical vocabulary of sample spaces and measures alone. Mathematics can define invariant measures or maximize entropy, but it cannot dictate that one *must* do this under ignorance. This "ought" is external to the formalism. Your vocabulary can describe *what* is done (applying an invariant measure) but not capture the philosophical assertion *that it is rationally compelled* by the state of ignorance itself.
  *   **The Metaphysics of "Possibility":** The classical principle often relies on identifying "equipossible" elementary events. Your vocabulary starts with a sample space Ω, assuming it's already given. The deeper philosophical question of *how to identify the fundamental, symmetric possibilities* constituting Ω in the first place, especially under ignorance (e.g., is a chord fundamentally defined by its midpoint, endpoints, or distance/angle?), isn't resolved by the formalism; it's assumed as input. The residue in underdetermined cases often stems from this prior step.

  **Answers to Specific Questions:**

  1.  **Principle of Indifference: Normative Feature or Proto-Invariance?**
      It is **both**, but the normative aspect is irreducible. The principle is undoubtedly a conceptual ancestor of invariance-based (and MaxEnt, Jeffreys) prior selection. You correctly understand the core *mathematical insight* it was groping towards: formalizing "ignorance" as uniformity relative to a measure, often chosen via invariance. *However*, the classical principle also carries a distinct, irreducible normative claim: that this assignment isn't just a pragmatic choice or a useful convention, but is *rationally mandated* by the state of ignorance itself. This normative claim – the epistemic "ought" – is not part of the mathematical definition of an invariant measure or a reference prior. It's a philosophical assertion *about* when and why such mathematical objects should be used. Your vocabulary captures the mathematical implementation but cannot express or justify the normative force philosophers debated.

  2.  **Residue of Underdetermination (Wine-Water, Cube Factory): Pointing to Vagueness or Vocabulary Limits?**
      The residue points overwhelmingly to the **original principle being less clear than it looked**, not to a limitation of your vocabulary. Your framework excels at diagnosing the problem: insufficient information to uniquely determine the dominating measure ν (or parametrization).
      *   In wine-water (probability that wine > water given only ratio R = wine/water lies in [a, b]), a "uniform" prior over R (p(R) ∝ 1) gives different results than a uniform prior over W = wine/(wine+water) (p(W) ∝ 1) or over S = wine - water. Jeffreys prior for a ratio parameter (p(R) ∝ 1/R) gives yet another answer. The problem statement fails to specify the relevant structure (is the ratio R fundamental? is the mixture fraction W? the difference S?) or the symmetry group. The principle of indifference, naively applied to different parametrizations (R, W, S), yields contradictions precisely *because* it doesn't specify which parametrization reflects the underlying "equipossibilities." Your vocabulary clearly shows this is an ill-posed problem without more information (e.g., the sampling mechanism, the parameter of interest).
      *   The cube factory demonstrates the same core issue: Is the "fundamental" unknown quantity the side length L, the area A, or the volume V? The problem statement doesn't say. Indifference over L, A, or V yields different results. No unique symmetry group exists. Your vocabulary clearly expresses this underdetermination (choice of Γ and ν is arbitrary given the information). The residue arises because the principle of indifference presupposed a unique, obvious set of symmetric alternatives ("equipossibilities"), which these problems demonstrably lack. The paradoxes expose this presupposition as often unfounded. Your vocabulary doesn't *create* this residue; it *reveals* the ambiguity inherent in the original, vague principle when applied to continuous spaces. The inability to resolve these cases stems from the principle's underspecification, not a shortcoming of measure theory or invariance concepts.

  **Conclusion:** The mathematical vocabulary of sample spaces, parametrization, dominating measures, and invariance provides a powerful lens that clarifies the *mechanism* behind Bertrand's paradox and formalizes several sophisticated approaches to defining "noninformative" probabilities (Jaynes's group invariance, Jeffreys, MaxEnt). It maps cleanly onto the core problem of parametrization dependence and handles cases of clear symmetry well. It distorts by implicitly adopting the normative claim that epistemic indifference entails symmetry (via the direct translation to invariance) and by subsuming the simple "equipossible" idea under more complex formalisms. Crucially, it *cannot* express the irreducible normative claim that an agent *ought* to assign uniform probabilities (or use a specific invariance) based solely on indifference; this "ought" remains external to the mathematics. The residue found in problems like wine-water and the cube factory is not a failure of the mathematical vocabulary but a direct consequence of it precisely diagnosing the ambiguity and underdetermination inherent in the classic principle of indifference itself. The paradoxes arose because the principle was less clear and less universally applicable than its early proponents believed.
