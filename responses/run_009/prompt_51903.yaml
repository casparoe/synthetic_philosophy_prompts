  Okay, let me unpack what the user is asking. They describe a pattern at work where a small group discusses a policy issue, then polls everyone, but the poll results are messy and influenced by random factors like question order or lunch timing. The facilitator dismisses the actual results, claiming the "real" preference is what people would think after more time and better information—a hypothetical no one actually holds. The user suspects this is a known philosophical move and wants the conceptual framework, not just labels.

  First, I need to identify the core concept. The facilitator is privileging an idealized preference over actual expressed preferences. This reminds me of idealized preference theories in philosophy and economics. Thinkers like Harsanyi and Rawls come to mind. The user mentions economists "cleaning" preferences and welfare theorists discussing cognitive psychotherapy. That's a hint. The key is the shift from actual to counterfactual preferences.

  The user also points out that this idealization is never actually implemented. Instead, it becomes a projection of the facilitator's own views. That's a crucial twist. There's a gap between the theoretical ideal and the practical application where bias seeps in. The user wants a term for this underdetermined idealization defaulting to the idealizer. Terms like "rationalization hijack" or "normative projection" might fit, but I need to check if existing terms cover this.

  Looking at philosophy, "ideal observer theory" involves a hypothetical impartial observer, but it's more about morality than preferences. "Paternalism" is close but misses the counterfactual aspect. "Epistemic trespassing" comes to mind—where the facilitator oversteps into defining others' rationality. But maybe coining a term is necessary. The user wants to distinguish this from simple paternalism or ignoring input. They want the mechanism highlighted: the underdetermined idealization becoming a vehicle for the facilitator's bias.

  The species-scale example with AI aligns with Bostrom's "coherent extrapolated volition," but again, it's a counterfactual. The difference in scale might not change the core concept, just the context. The problem is the leap from "what they would want" to "what I think they should want." 

  The user's deeper need seems to be articulating this dynamic to challenge it effectively. They need the analysis to show why this method is flawed and how it masks bias. Terms like "preference laundering" or "counterfactual paternalism" could work, but "normative projection" better captures the imposition of the idealizer's norms under the guise of idealization. 

  Finally, the answer line must be concise. Since no exact term exists, coining "normative projection" with a clear definition makes sense. It ties together the idealization and the projection of bias, distinguishing it from related concepts.
answer: |-
  This pattern centers on replacing actual, expressed preferences with a hypothetical, idealized version deemed "more authentic" by an authority. It's a significant conceptual move with deep roots in philosophy, economics, and decision theory. Here's the carving:

  1.  **The Core Concept: Idealized Preference Substitution**
      *   The fundamental move is privileging a *counterfactual preference* (what the agent *would* prefer under idealized conditions like full information, unlimited deliberation, perfect rationality, emotional neutrality) over the agent's *actual, expressed preference*.
      *   The justification is that actual preferences are "distorted" by cognitive biases, informational deficits, time pressure, emotional states, or social influence (like your lunch timing, question order, or last speaker effects). The idealized version is claimed to represent the agent's "true" or "rational" self-interest or will.

  2.  **Nearest Established Versions:**
      *   **Welfare Economics & Social Choice Theory:** This is where "preference laundering" is most explicit.
          *   **Harsanyi's "Extended Preferences" / "Ethical Preferences":** Argues rational individuals, imagining themselves behind a veil of ignorance about their actual position, would converge on preferences reflecting impartial social welfare.
          *   **"Laundered Preferences" / "Cognitive Psychotherapy" (Richard Brandt):** Proposed revising an individual's preferences by confronting them with all relevant, scientific facts and logic until inconsistencies are resolved, leaving only "rational" desires. This *is* the "cleaning" you recall.
          *   **"Ideal Observer" Theories (in Ethics & Aesthetics):** While focused on moral judgments, the structure is similar: the "correct" judgment is what a perfectly rational, impartial, fully informed observer would make, overriding actual individual judgments.
      *   **Paternalism (Soft/Rational):** Justifies overriding actual preferences *for the agent's own good*, often implicitly appealing to what the agent *would* want if they were better informed or more rational. Your facilitator's move is a specific *form* of paternalism.
      *   **Coherent Extrapolated Volition (CEV - Nick Bostrom):** The AI-adjacent concept you mentioned. It posits that an AI should deduce humanity's "coherent, extrapolated volition" – what we *would* want if we knew more, thought faster, were more rational, etc. This *is* the same move scaled up to the species level. The core logic (overcoming limitations via idealization) is identical; the scale changes the practical and ethical implications dramatically.
      *   **Deliberative Democracy Theory:** While valuing actual deliberation, some strands emphasize that *proper* deliberation aims to uncover reasoned judgments closer to idealized preferences, moving beyond raw, potentially uninformed or manipulated opinions. Your facilitator's appeal to "another month and better materials" directly echoes this aspiration.

  3.  **Edges Between Versions:**
      *   **Individual vs. Group/Species:** The core *logic* of substituting counterfactual for actual preferences is identical. The difference is scale and implementation:
          *   *Individual:* Focuses on overcoming *individual* cognitive/emotional limitations (e.g., Brandt's therapy).
          *   *Group:* Focuses on overcoming *aggregation problems* (e.g., messy polls) and *collective irrationality* (e.g., groupthink, polarization). Idealization aims to find a "rational" collective will.
          *   *Species:* Focuses on overcoming *species-level limitations* (finite lifespan, cognitive biases, fragmented knowledge) to define a "true" long-term interest (e.g., CEV).
      *   **Mechanism:** How the idealization is generated differs. Is it hypothetical introspection (Harsanyi), a defined cognitive process (Brandt), the outcome of idealized deliberation (some deliberative democrats), or an extrapolation algorithm (CEV)? The facilitator's vague appeal lacks any defined mechanism.
      *   **Goal:** Welfare (Brandt, Harsanyi), Moral Truth (Ideal Observer), Collective Rationality (Deliberative Dem), Existential Preservation (CEV), or simply resolving messy data (your facilitator)? The facilitator's goal seems primarily epistemic closure and justifying a decision, dressed in the language of finding the "true" preference.

  4.  **Your Key Insight: The Underdetermined Idealization & Default to the Idealizer**
      *   You've pinpointed the critical flaw: The idealized preference is **operationally undefined**. There is no feasible, objective procedure to determine what "you after a month with perfect info" *would* actually conclude. The outcome is inherently unpredictable.
      *   **The Result:** The content of the "idealized preference" becomes **radically underdetermined** by the actual participants or the process. It lacks sufficient constraints to yield a unique or reliable answer distinct from the preferences of the person performing the idealization.
      *   **The Mechanism:** In this vacuum, the facilitator (or theorist) **projects their own normative framework** (values, beliefs, assumptions about rationality, desired outcomes) *onto* the hypothetical ideal agent. The facilitator isn't discovering a pre-existing "true" preference; they are *constructing* it based on their own perspective.
      *   **Distinguishing the Concept:** This needs a term distinct from:
          *   *Simple "Ignoring What People Say":* This implies dismissal without justification. Here, there's a complex *justification* invoking authenticity and rationality.
          *   *Garden-Variety Paternalism:* Standard paternalism overrides preferences based on a known "good" (e.g., forcing medicine). This is **Counterfactual Paternalism** – overriding preferences based on a *hypothetical, constructed* version of the agent's own good/will. The facilitator claims *"This isn't what I want, it's what YOU would REALLY want (if you were perfect, like me)."*
      *   **The Coinage: Normative Projection**
          *   **Definition:** The act of filling the underdetermined content of an idealized agent's counterfactual preference (e.g., "what they would want under full information/rationality") by projecting the idealizer's own normative judgments, values, or desired outcomes onto that hypothetical agent, thereby presenting the idealizer's preferences as the agent's "authentic" or "rational" will.
          *   **Why it fits:**
              *   "Normative": Highlights the imposition of the idealizer's values/norms (what *should* be preferred).
              *   "Projection": Directly captures the psychological mechanism – attributing one's own views to the hypothetical other.
              *   It emphasizes the *constructive* act rather than simple dismissal.
              *   It distinguishes this specific flaw within Counterfactual Paternalism/Idealized Preference Substitution. The problem isn't *just* idealization; it's that the idealization is a screen for the idealizer's bias.

  **Conclusion:** You are observing **Idealized Preference Substitution**, specifically within a deliberative context, manifesting as a form of **Counterfactual Paternalism**. The critical flaw you identified – the idealized preference being operationally undefined and thus defaulting to the idealizer's views – is **Normative Projection**. This is distinct from simply ignoring input because it co-opts the language of rationality and authenticity to mask the imposition of the facilitator's own normative stance. The species-scale version (like CEV) shares the core logical move and the risk of normative projection, though the scale introduces unique challenges in defining the "idealizer" and the projection mechanism.

  \answer{no established term: Normative Projection}
