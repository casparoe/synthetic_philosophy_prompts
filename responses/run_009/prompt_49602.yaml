prompt: |-
  so i help run a small EA meetup — about fifteen people in the back room of a pub, 75 minutes, whiteboard, no slides. the crowd is mostly people who read Singer years ago and now give 10% of income, a couple give way more, and the local culture basically treats the demandingness objection as cope — something people say to excuse not giving more. next month i'm running a session on the objection and i want it to land as a real philosophical problem, not as a strawmam we knock down or a guilt trip we all sit through. don't explain the objection to me, i know the lit — i need the teaching plan.

  what i want from you: what has to be in place before the objection even looks like a problem to this audience — my hunch is they have to feel how the slope never flattens (each dollar, the next-best use is always still ahead of whatever you just bought yourself) before they can understand why someone might refuse to be pushed down it, but correct me if that's the wrong order. then the carrying example: i don't want the drowning child, that case is a one-off rescue with a victim right in front of you, which is pretty much the opposite of the structural, ongoing, distributed stuff that makes demandingness actually bite — so pick something else and tell me what it needs to have and lack to do the work. the misconceptions i expect from THIS crowd (not from skeptics): "demandingness is just weakness of will dressed up as philosophy" and "it's only a problem for utilitarianism, and we're not really utilitarians anyway." there have to be others i'm not seeing, and i want to know where in the sequence each one should get headed off, not just that they exist. also: one question i can throw out at the end that would show me they actually understand the objection rather than having merely heard of it. and tell me what i should openly refuse to cover at this level, because i'll run out of time.

  one more thing — there's a guy who gives 50% and will cheerfully say the objection has never once occured to him. is he a resource in this session or a hazard, and how do i use him either way?
reasoning: |-
  Okay, let me break down this user's request. They run a small EA meetup with seasoned members who treat the demandingness objection as a cope. The goal is to make the session land as a genuine philosophical problem without being a strawman takedown or guilt trip.

  First, I need to identify the core challenge. This audience already gives significantly (10-50%) and sees demandingness objections as excuses. Their local culture dismisses it as weakness. So the real task is making them feel the weight of the philosophical problem, not convincing them to give less.

  The user's hunch about the "slope never flattening" seems crucial. Before discussing objections, participants must viscerally understand how marginal utility works in effective giving - that each dollar could always save more welfare elsewhere. Without this foundation, demandingness won't register as problematic.

  For the carrying example, the drowning child case fails because it's acute/one-off. I need something that mirrors chronic, structural demands. A daily burden analogy works better - like carrying increasing weight forever. This makes the ongoing strain tangible.

  Key misconceptions to address:
  - "Demandingness = weakness of will" (needs separation early)
  - "Only applies to utilitarianism" (must show broader relevance)
  - "Sacrifice should be total" (clarify difference between ideal/practical)

  The 50% giver could derail discussions if he dismisses the problem. Better to position him as proof that living with demands is possible, while emphasizing the session explores why others find it philosophically troubling.

  For structure:
  1. Start with marginal utility exercises to establish the unending slope
  2. Introduce carrying analogy for chronic demands
  3. Explore philosophical tension (duty vs capability)
  4. Address misconceptions explicitly
  5. End with diagnostic question about tradeoffs

  Time constraints mean avoiding:
  - Comparative ethical frameworks
  - Psychological coping mechanisms
  - Personal giving advice

  The closing question should test if they grasp the core tension: "What non-arbitrary principle determines when demands become unreasonable?" This probes their understanding beyond surface-level familiarity.

  Throughout, maintaining neutral facilitation is key - not advocating for less giving, but legitimizing the philosophical struggle. The goal is depth, not persuasion.
answer: |-
  Here’s a lean, pragmatic teaching plan designed for your specific audience and constraints. Focus is on **framing the problem authentically**, **preempting dismissive reactions**, and **forcing engagement with the core tension**.

  ---

  ### **Teaching Plan: The Demandingness Objection as a Real Problem**
  **Time:** 75 mins | **Format:** Whiteboard + Guided Discussion  
  **Goal:** *Make the group feel the philosophical weight of demandingness, not just "solve" it.*

  ---

  #### **Phase 1: Set Up the Slope (20 mins)**  
  *(Your hunch is correct—this is essential groundwork)*  
  **Goal:** Make the "unflattening slope" visceral.  
  **Activity:**  
  1. **Marginal Utility Drill:**  
     - Ask: *"If you had $1,000 to donate *right now*, what’s the *very best* intervention? How many lives/QALYs saved?"* (Get specific numbers).  
     - Follow-up: *"What if you had $999? $1,001? Is there *any* dollar amount where the next dollar *isn’t* better spent on aid than on your coffee/lunch/hobby?"*  
     - **Whiteboard:** Draw a curve showing cost per life saved. Show it *never* plateaus—each dollar *always* has a "next best use."  
  2. **Reveal the Implication:**  
     - *"This means: every dollar you spend on yourself *could* have been spent saving a life. Not 'theoretical' lives—real ones, with the same moral weight as the drowning child."*  
     - **Key Point:** *Demandingness bites because the opportunity cost is relentless and quantifiable.*

  ---

  #### **Phase 2: The Carrying Analogy (15 mins)**  
  *(Avoids the drowning child’s one-off problem)*  
  **Analogy: "The Backpack of Harm"**  
  > *"Imagine every time you spend on yourself, you add a brick to a backpack you carry 24/7. Each brick represents *preventable harm* your spending didn’t avert (e.g., 1 brick = 1 month of malaria suffering). The backpack never empties—every coffee adds bricks. Now: How heavy can it get before the burden breaks you? Is it weak to *not* want to carry 500 bricks? 1,000?"*  

  **Why this works:**  
  - **Lacks:** One-off urgency, proximity, direct agency.  
  - **Has:** Chronic burden, cumulative harm, psychological weight, *structural* sacrifice.  
  - **Crucial twist:** *You can’t ever put the backpack down.* This mirrors ongoing aid obligations.

  ---

  #### **Phase 3: The Philosophical Tension (20 mins)**  
  *(Make it bite; preempt misconceptions)*  
  **Core Question:** *"When does 'you *can* do more' become 'you *must* do more—*at the cost of your own life*'?"*  

  **Address Misconceptions Head-On:**  
  1. **"It’s just weakness of will"**:  
     - *"Weakness is *failing* to do what you believe is right. But what if the demand itself is *unreasonable*? If I demand you donate 99% of your income, is resisting that 'weakness'—or is my demand the problem?"*  
     - **Reframe:** *"Demandingness asks: Does morality *require* self-destruction?"*  

  2. **"Only a problem for utilitarianism"**:  
     - *"Even if you’re a deontologist: Does 'help others' have *limits*? If you’re a virtue ethicist: Is 'burnout' a vice? If you prioritize integrity: Can you be *required* to abandon your life’s projects?"*  
     - **Punchline:** *"This isn’t about utilitarianism—it’s about whether *any* moral system can demand *everything*."*  

  **Whiteboard:** Contrast two axes:  
  ```
  Moral Obligation Strength  vs.  Personal Cost Tolerance
  ```
  *Where do they diverge? Is there a "right" point?*

  ---

  #### **Phase 4: Your 50% Giver - Strategic Use (5 mins)**  
  **He’s a RESOURCE if handled tightly:**  
  - Ask him: *"You’ve never felt the objection. Can you describe how you *avoid* the weight of the backpack? Do you compartmentalize? See your spending as 'recharging'? Or do you genuinely feel zero tension?"*  
  - **Use his answer to:**  
    - Show that *not feeling the tension* is a psychological strategy (healthy or not), not a philosophical solution.  
    - Highlight that others *do* feel it—and their struggle isn’t irrational.  

  **NEVER let him dominate.** Cut in: *"Thanks—that’s one way to live it. But philosophically, the problem persists because..."*

  ---

  #### **Phase 5: The Closing Question (10 mins)**  
  **Diagnostic Question:**  
  > *"Imagine two people:  
  > - **A** gives 10%, spends 90% on modest comforts.  
  > - **B** gives 50%, but spends 50% on luxury vacations.  
  > By the 'slope,' both *could* do more. But is A *more* or *less* reasonable than B? Why?"*  

  **What reveals understanding:**  
  - If they see the problem isn’t "how much" but *"what principle justifies stopping *anywhere*?"*  
  - If they note B’s spending is *less* justifiable *if judged by outcomes*, yet A’s life may be *more* alienated from their values.  
  - **Bullseye:** *"There’s no non-arbitrary line—so how do we avoid moral exhaustion or hypocrisy?"*  

  ---

  #### **What to OPENLY REFUSE to Cover**  
  **Declare upfront:**  
  *"We’re not here to:*  
  1. *Debate *if* we should give (we all agree).*  
  2. *Solve demandingness (today is about *feeling* the problem).*  
  3. *Judge anyone’s personal choices.*  
  *We’re exploring why smart people find this philosophically traumatic."*  

  ---

  ### **Why This Sequence Works for Your Group**  
  - **Meets them where they are:** Starts with their language (QALYs, marginal utility).  
  - **Preempts cope:** Directly names their dismissals *as they arise*.  
  - **Makes it personal:** The backpack analogy forces imagining *their* limits.  
  - **Philosophically rigorous:** Grounds the abstract in concrete tradeoffs.  

  **Final Tip:** If discussion runs long, **cut Phase 4 or 5 short—but never Phase 1**. The slope *must* be felt first. The rest hinges on it.
