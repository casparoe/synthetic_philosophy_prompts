  Then I want the residue report, which is honestly the part I care about most. Which pieces of the paradox translate cleanly — is the certainty effect literally just paying for local convexity of the utility curve, or is it something else? Which pieces had to be distorted to fit my vocabulary? Is there anything in the philosophers' version that has no counterpart in it at all? And the question I keep comming back to: from where I sit, we violate independence every single day and nobody can arb us for it — the options market would price a "preference for certainty" in a heartbeat and nobody calls it irrational. So does the translation show that the normative force of the axiom just doesn't survive contact with how risk preferences actually work, or is there something my vocabulary is structurally blind to? Don't just say "it's risk aversion" — my friend already tried that and I don't buy it, risk aversion lives in the utility curve and this seems to be something over and above it.
