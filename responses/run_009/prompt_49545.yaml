  I spent ten years on an options desk and now do risk at a fund, so the vocabulary I actually think in is the trader's one: certainty equivalents, risk premia, variance and higher moments, skew, convexity payoffs, stochastic dominance, fat tails, the risk-neutral measure, no-arbitrage bounds, Kelly sizing, the fact that nobody prices a lottery ticket at its mean. A friend of mine who did a philosophy PhD keeps going on about the Allais paradox and the independence axiom like it's some devastating result, and honestly when I look at the choices involved (a sure million versus a gamble with a shot at five) my first reaction is "of course I pay up near the certainty end — people pay for lottery tickets and pay for certainty all day long in the markets, that's just convexity." He says I'm missing the point entirely, that the axiom has nothing to do with risk aversion in my sense, and that the pattern of choices in the paradox is inconsistent in a way no coherent set of prices would be.

