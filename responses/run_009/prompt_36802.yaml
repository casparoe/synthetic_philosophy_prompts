  **INTERNATIONAL SPORTS TRIBUNAL**  
  **IDENTITY SUBCOMMITTEE**  
  **CASE NO. ID-78/45-OMICRON**  
  **ATHLETIC CLUB OMICRON v. THE HISTORICAL RECORD COMMISSION**  
  **ARBITRAL JUDGMENT**  

  **1.** This Subcommittee, duly constituted under Article VII(ς) of the Tribunal Charter, renders judgment on the Petition of Athletic Club Omicron ("Petitioner" or "AC Omicron") seeking formal recognition as the lawful holder of the 1978 Continental Championship title, originally awarded to "Atlético Cuenca" ("the 1978 Club"). The Historical Record Commission ("Respondent") contests Petitioner's claim of identity with the 1978 Club. After review of the Stipulated Facts, Amicus Briefs, and oral arguments delivered on 15 October 2023, the Subcommittee rules as follows.

  **FINDINGS OF FACT**

  **2.** The parties stipulate to the following material facts concerning the entity known as "Atlético Cuenca" (Registration ID: FFF-7789-001):
      **(a)** Founded in Cuenca, Ecuador in 1921.
      **(b)** Won the Continental Championship on 12 June 1978.
      **(c)** Relocated to Guayaquil, Ecuador, in 1985, rebranding as "Guayaquil Sporting Club".
      **(d)** Relocated to Medellín, Colombia, in 1993, rebranding as "Deportivo Medellín Andino".
      **(e)** Suffered catastrophic stadium fire in 1998, destroying all physical assets except archived registration documents stored off-site.
      **(f)** Entered a period of extreme dormancy (1999-2005). During this period:
          (i) All players, coaching staff, administrative employees, and original shareholders departed or were terminated.
          (ii) Physical operations ceased entirely.
          (iii) The sole remaining asset was the legal registration (ID: FFF-7789-001).
          (iv) Registration dues were paid continuously by a single member, Mr. Ernesto Vargas (deceased 2010), utilizing a fax machine in a rented office in Medellín to submit payments.
      **(g)** Acquired by new ownership in 2005, relocating to Buenos Aires, Argentina, and rebranding as "Athletic Club Omicron".
      **(h)** Under current ownership, AC Omicron maintains Registration ID FFF-7789-001 and possesses the original registration ledger documenting unbroken dues payments since 1921, including the 1999-2005 period. No player, staff member, shareholder, or physical asset connects AC Omicron directly to the 1978 Club beyond this registration and ledger.

  **MAJORITY OPINION (Delivered by Arbiter Schmidt)**

  **3.** The sole question before this Subcommittee is one of numerical identity: Is the Petitioner, AC Omicron (Registration ID: FFF-7789-001), numerically identical to the entity that won the 1978 Continental Championship, Atlético Cuenca (Registration ID: FFF-7789-001)? We find, by a preponderance of the evidence, that it is.

  **4.** Identity over time, for legal persons such as sporting clubs, requires spatiotemporal continuity and causal connectedness. While clubs are not biological organisms, they are complex entities whose persistence depends on the maintenance of a core organizational structure through which causal influence flows across time.

  **5.** The stipulated facts demonstrate an unbroken chain of causal connection centered on the entity's formal registration (ID: FFF-7789-001). This registration functions as the club's persistent "body" or substrate. Its continuous existence, recognized by the relevant federations (Federación Sudamericana de Fútbol), provides the necessary spatiotemporal trajectory.
      **(a)** The relocation of headquarters, while altering spatial coordinates, did not sever the causal chain. Each move was an administrative action undertaken *by* the club, utilizing its existing registration framework.
      **(b)** Rebranding constitutes a change in name and presentation, not core identity. Legal precedent (e.g., *FC Internazionale Milano v. Serie A*, IST-ID-06/12) recognizes name changes as superficial alterations.
      **(c)** The complete turnover of personnel, while significant, affects the club's composition, not its underlying identity. Clubs, like ships or institutions, persist through the replacement of parts. Gradual replacement differs fundamentally from instantaneous substitution; the former maintains causal continuity, the latter does not. The turnover here was gradual and managed within the club's ongoing administrative structure.
      **(d)** The period of dormancy (1999-2005) is critical. While operational activity ceased, the club's legal and administrative heartbeat persisted through the continuous maintenance of its registration via dues payment. Mr. Vargas's actions, however minimal, constituted the club's sole function: preserving its legal existence. The fax machine and rented office were the minimal physical instantiation required to sustain the causal chain via registration upkeep. This thread, however thin, maintains the requisite spatiotemporal and causal continuity.

  **6.** Therefore, finding that the entity bearing Registration ID FFF-7789-001 has existed continuously since 1921, maintaining an unbroken causal chain through administrative acts including relocation, rebranding, and dues payment, the Subcommittee HOLDS that Athletic Club Omicron is numerically identical to Atlético Cuenca, the 1978 Continental Champion. Petitioner is entitled to formal recognition as the holder of the 1978 title.

  **CONCURRING OPINION (Arbiter Chen)**

  **7.** I concur in the judgment awarding the title to AC Omicron but arrive via a different, equally compelling, path: the "Closest Continuer" theory.

  **8.** Metaphysical identity may be indeterminate in borderline cases. Rather than seeking a deep fact of identity, we should ask: Among the entities existing today claiming connection to the 1978 Club, which is the *best candidate* for being that club? Which bears the strongest relation of causal continuity and similarity?

  **9.** AC Omicron (ID: FFF-7789-001) is the undisputed closest continuer:
      **(a)** It possesses the original registration number, the primary legal identifier.
      **(b)** It maintains an unbroken record of dues, demonstrating intentional preservation of the lineage.
      **(c)** It operates as a competitive football club within the same continental structure.
      **(d)** Critically, *no superior or even plausible rival claimant exists*. No other entity asserts identity with, or possesses stronger claims of descent from, Atlético Cuenca. Hypothetical claimants (e.g., a group reforming in Cuenca today) would lack the continuous causal link embodied by the registration record.

  **10.** In the absence of a better-placed candidate, AC Omicron *is* Atlético Cuenca for all practical and legal purposes. The question of identity is settled not by uncovering a metaphysical essence, but by identifying the most salient continuer in the present landscape. AC Omicron is that continuer.

  **DISSENTING OPINION (Arbiter Petrova)**

  **11.** I dissent. The majority and concurrence confuse the *importance* of continuity with the *fact* of identity. They conflate what *matters* for the club's survival with whether the club *has* survived. Our jurisdiction is limited to the latter question of fact.

  **12.** The club is not a mystical essence or a mere registration number. It is a concrete organization: a specific collection of people, assets, location, and operations bound by shared purpose at a given time. Identity requires the persistence of enough of these core elements to constitute the *same* organization, not merely a successor or beneficiary.

  **13.** The stipulated facts reveal a complete rupture:
      **(a)** **Spatiotemporal Discontinuity:** Relocations to Guayaquil and Medellín, followed by dormancy and then relocation to Buenos Aires, constitute multiple, significant breaks in spatial trajectory. The "club" during dormancy lacked even a fixed location, reducing to a fax machine and payment record. This is not continuity; it is hibernation followed by reanimation elsewhere.
      **(b)** **Causal Disconnection:** The causal chain was broken. The actions of Mr. Vargas preserved a *legal fiction* of existence, not the operational reality of the club. Paying dues is an act of custodianship, not club operation. The acquisition in 2005 was not a revitalization but a *new foundation* using the old registration as a historical artifact. The causal influence of the 1978 Club's specific culture, knowledge, and operational methods upon AC Omicron is non-existent.
      **(c)** **Compositional Turnover:** While gradual replacement of parts may preserve identity, the stipulated "wholesale turnover" combined with operational cessation constitutes near-total substitution. There is no "club" left *to* persist during dormancy; only a registration. Reviving a registration is not reviving the club itself.

  **14.** Alternatively, adopting a perdurantist view: The club is a four-dimensional space-time worm. The 1978 Championship was won by a specific temporal stage (t-1978) of this worm. The Petitioner is a distinct, later temporal stage (t-2023). The question is whether these stages are genidentical – linked by the right sort of causal relations to be parts of the same worm.
      **(a)** The causal relations between t-1978 and t-2023 are attenuated to the point of insignificance. The thread through dormancy is administrative, not operational or constitutive. The causal influence of t-1978 on t-2023 is negligible, akin to a historical footnote influencing a new venture.
      **(b)** The stages lack sufficient immanent causation. The nature and activities of the t-2023 stage (AC Omicron) are not causally determined in any meaningful way by the intrinsic properties of the t-1978 stage beyond the legal ID. They are effectively distinct entities sharing a historical marker.

  **15.** Therefore, the preponderance of evidence shows AC Omicron is *not* numerically identical to the 1978 Champion. It is, at best, its principal legal successor-in-interest. Awarding it the *title* conflates succession with identity.¹

  **ORDER**

  **16.** **Holding:** For the reasons stated in the Majority Opinion, the Petition of Athletic Club Omicron is **GRANTED**. Athletic Club Omicron (Registration ID: FFF-7789-001) is hereby recognized as the holder of the 1978 Continental Championship title.

  **17.** **Trophy Custody:** The Historical Record Commission shall transfer physical custody of the 1978 Continental Championship trophy to Athletic Club Omicron within thirty (30) days of this judgment.

  **18.** **Appeal:**
      **(a)** **Deadline:** Any party may appeal this judgment to the Full Tribunal Chamber within forty-five (45) days of service.
      **(b)** **Filing Fee:** The appeal filing fee is set at 5,000 Standard Tribunal Units (STU).
      **(c)** **Grounds:** Appeals may be lodged on grounds of erroneous application of Tribunal identity jurisprudence, procedural irregularity, or manifest disregard of stipulated facts.

  **Dated:** 27 October 2023

  **SIGNED:**  
  Arbiter Helmut Schmidt (Majority)  
  Arbiter Li Wei Chen (Concurring)  
  Arbiter Anya Petrova (Dissenting)  

  ---

  **FOOTNOTE:**
  ¹ Should the Dissent's view prevail on appeal, a profound ancillary question arises: If AC Omicron is not the 1978 Champion, who owns the trophy? The 1978 Club, as a distinct entity, appears to have ceased existing. Does the trophy reside with the last known owner (the entity paying dues in 2005)? Is it *bona vacantia*? Or does title vest in the governing federation? This Subcommittee notes the potential need for a separate proceeding to determine rightful ownership should identity not be established. Pending such determination, the trophy should arguably be held in escrow. However, as identity *has* been established per the Majority, this remains an academic footnote.
