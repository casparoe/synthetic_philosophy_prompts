prompt: |-
  longtime lurker here, been reading OB/LW/alignment forum stuff since the CEV debates, and I want a number, not vibes.

  Here's the proposition, stated as precisely as I can manage: if humanity ever builds a roughly aligned superintelligent agent that has to pick a target for "what do I maximize," there is a principled fact of the matter about whose values it should serve and how to combine them -- something sufficiently-careful versions of us would converge on, the way we'd converge on arithmetic -- as opposed to it being partly just a choice, like choosing a constitution, where multiple coherent answers exist and you pick one by bargaining or fiat rather than because it's correct.

  My credence that it's a principled fact is about 0.65. My friend, who's read way more Rawls than me, says 0.2 -- though she'd split it: she thinks "whose values" has a determinate answer (roughly: everyone's, somehow weighted) but that the aggregation function is underdetermined, so the overall thing is mostly a choice. She also keeps bringing up future people, who by definition don't show up to vote.

  Give me your own number, but more importantly give me the decomposition. Terms I'd want in there, at least roughly:

  - credence that moral realism is true, or at least enough realism that "this aggregation is better than that one" is a substantive predicate and not just "I like it"
  - conditional on realism, credence that it actually pins down the aggregation -- e.g. whether something in the neighborhood of Harsanyi's social aggregation theorem, plus a story about interpersonal utility comparison, gets you all the way to a determinate weighted-sum-ish answer
  - credence that reasonable-pluralism-style considerations block this: if ground-level value systems are genuinely incommensurable, maybe no aggregation is correct and only some are fair -- and note that "fair" is doing a lot of work there, is fairness itself the fact we were looking for?
  - how much turns on whether future people's values count, and if they don't count, does that sink the principled-fact answer or just narrow it
  - whether the moral-parliament / negotiated-compromise approach (Bostrom-Ord style) counts as discovering the answer or merely constructing one, and whether that distinction even survives your decomposition

  Then tell me: which term are you least confident in, and what argument or thought experiment would move it the most? Also, if you had to bet, do my friend and I actually disagree about realism, or only about the aggregation term -- where does the 0.45 gap between us actually live?

  (Not asking for a reading list or citations, I want the reasoning laid out. And please don't cop out with "depends on your metaethics" -- that's literally what the decomposition is supposed to price in. Also if your instinct is that the question is confused in some load-bearing way, say so, but then tell me what probability you assign to THAT and decompose it too.)
