answer: |-
  Here is the diagnostic instrument drafted to your specifications, fitting two sides of a handout:

  ---

  **Quiz: Work, Exchange, and Fairness**  
  *First, read each scenario. Then select the option that best reflects your judgment of the situation.*

  **1. Artisan’s Choice**  
  A skilled furniture-maker owns her own tools, works alone, and sells intricate chairs at global market prices to wealthy international buyers. The buyers resell each chair for ten times what they paid her, earning large profits.  
  A) This is unfair exploitation: she creates the full value but receives only a fraction.  
  B) This is fair: she agreed to the price freely, controls her work, and isn’t forced to sell to them.  
  C) The unfairness lies deeper: global systems let buyers capture surplus because they own distribution networks she can’t access.  

  **2. Sweatshop Decision**  
  Workers in a poor country assemble garments for export. Wages are low by global standards but double local alternatives. They took the job willingly to support families, though the factory is unsafe and hours are long. Global trade rules favor wealthy nations.  
  A) This is exploitative: workers are paid too little for grueling labor that enriches others.  
  B) This is not exploitative: they chose it over worse options, so it benefits them.  
  C) The exchange itself may be consensual, but exploitation stems from unjust global systems forcing these choices.  

  **3. Rescue & Loan**  
  (a) A drowning millionaire is saved by a passerby who demands 90% of their wealth as payment.  
  (b) A lender offers a high-interest loan to someone facing bankruptcy and homelessness, knowing they have no other options.  
  A) Both are exploitative: one party desperately needs what the other provides and is forced to accept harsh terms.  
  B) Neither is exploitative: both agreements are voluntary; no fraud or physical force occurred.  
  C) The rescue is wrong but not exploitative; the loan is exploitative due to systemic economic coercion.  

  **4. Paradoxical Cases**  
  (a) A top surgeon earns $800,000/year. If society’s assets were equally divided, she’d earn $1,000,000.  
  (b) A cleaner earns $15,000/year. Under equal division, they’d earn $20,000.  
  A) The surgeon is exploited (she loses more potential income); the cleaner is not.  
  B) The cleaner is exploited (they’re far poorer); the surgeon is not.  
  C) Neither is exploited: exploitation is about labor relations, not hypothetical distributions.  

  **5. Cooperative Dilemma**  
  A worker-owned coop produces bicycles. All members vote on decisions. To survive against larger competitors, they vote to: (i) increase their own work hours, and (ii) lay off 30% of their members.  
  A) This exploits the laid-off members: they’re excluded from shared assets they helped build.  
  B) This exploits the remaining members: they must work harder due to market pressures.  
  C) There’s no exploitation: all decisions were democratic and necessary for survival.  

  **6. Wealth & Domestic Labor**  
  (a) An heir lives comfortably off stock dividends without working.  
  (b) A parent does all cooking/cleaning for their family without pay, while their partner works a paid job.  
  A) The heir exploits others (workers create their wealth); the parent is exploited (their labor is unpaid).  
  B) The heir benefits unfairly but doesn’t "exploit"; the parent isn’t exploited if they consented to the arrangement.  
  C) Both cases involve exploitation: one profits from ownership, the other from gendered labor extraction.  

  **7. Fulfilled Factory Worker**  
  An auto worker loves her job, designs efficient workflows, understands the whole production process, and receives 95% of the value her labor adds. The factory is privately owned.  
  A) She is still exploited: the owner captures 5% of her labor’s value without working.  
  B) She is not exploited: her pay is fair, she finds meaning, and she consented.  
  C) She experiences no alienation but is still exploited due to the ownership structure.  

  **8. Isolated Smallholder**  
  A farmer grows food on a remote plot inherited from ancestors. The work is backbreaking, repetitive, and lonely, but they are self-sufficient and need no wages. Market pressures force them to overwork to survive.  
  A) They are alienated (work is joyless) but not exploited (no one extracts surplus labor).  
  B) They are exploited (market forces coerce their labor) and alienated.  
  C) Neither applies: exploitation requires an exploiter; alienation requires unfulfilled potential within social labor.  

  ---

  **SCORING KEY**  

  **Exploitation Commitments**  
  - **Labor-Theoretic (LT)**: Exploitation = extraction of surplus labor/value by non-laborers (Favors: 1A, 2A, 3A[both], 5A, 6A/C, 7A/C).  
  - **Property-Relations (PR)**: Exploitation = rooted in unequal ownership of assets enabling unequal exchange (Favors: 1C, 3C, 4A, 5A, 6C).  
  - **Involuntary Transfer (IT)**: Exploitation = forced/unbalanced transfer due to vulnerability (Favors: 3A, 4B, 6A).  
  - **Distributive Background (DB)**: Unfairness lies in systemic injustice, not transactions (Favors: 2C, 3C, 4B, 5B).  
  - **Voluntarist (V)**: No exploitation if voluntary, non-fraudulent exchange (Favors: 1B, 2B, 3B, 6B, 7B).  

  **Alienation Commitments**  
  - **Essentialist (E)**: Alienation = estrangement from species-being/creative nature (Favors: 8A/C).  
  - **Self-Realization (SR)**: Alienation = failure to find meaning/autonomy in work (Favors: 7B, 8A/B).  
  - **Reductionist (R)**: Alienation is caused by exploitation; no independent role (Favors: 7A, 8C).  
  - **Independent (I)**: Alienation possible without exploitation, & vice versa (Favors: 7C, 8A).  

  ---

  **ADDITIONAL NOTES**  

  **Indistinguishable Pairs**  
  - *LT vs PR* often align (e.g., Q1, Q6) but diverge on self-employment (Q1C) or returns to capital (Q6). *Test case needed*: A self-employed gig worker using a platform they don’t own.  
  - *IT vs DB* both condemn Q2 sweatshops. *Split them* with a case of mutual desperation (e.g., two equally poor fishermen trading scarce resources during a famine).  

  **Unoccupied / Rare Combinations**  
  - *Voluntarist Exploitation + Essentialist Alienation*: Unattractive — if exchanges are just if voluntary, why condemn estrangement from "human essence" in consensual work?  
  - *Labor-Theoretic Exploitation + Alienation Reductionism*: Common but ignores alienation in non-exploitative settings (e.g., Q8).  
  - *Distributive Background Exploitation + Independent Alienation*: Underexplored — could cohere if alienation stems from systemic misdistribution of meaningful work opportunities.  

  ---  

  **Design Rationale**  
  - Cases avoid theory-laden terms ("capital," "surplus value") while targeting core disagreements (e.g., Q4 exposes how exploitation definitions affect who "counts").  
  - Alienation separation tested via Q7 (exploitation likely, alienation unlikely) and Q8 (alienation likely, exploitation unlikely).  
  - Scoring reflects clusters: e.g., consistent 1A/2A/7A suggests LT + Reductionism; 1B/3B/7B suggests Voluntarism + Self-Realization.  
  - Handout length achieved via terse scenarios (70–100 words each) and minimal answer options.
