prompt: |-
  you're a historian of economic thought, so maybe you can help me out with a passage from hume's 1752 essay "Of Money" (from the Political Discourses). I'm reading it for a course and there's one thing i can't quite square.

  Here's the passage:

  "MONEY is not, properly speaking, one of the subjects of commerce; but only the instrument which men have agreed upon to facilitate the exchange of one commodity for another. It is none of the wheels of trade: It is the oil which renders the motion of the wheels more smooth and easy. If we consider any one kingdom by itself, it is evident, that the greater or less plenty of money is of no consequence; since the prices of commodities are always proportioned to the plenty of money, and a crown in Harry VII.'s time served the same purpose as a pound does at present. It is only the public which draws any advantage from the greater plenty of money; and that only in its wars and negociations with foreign states. And this is the reason, why all rich and trading countries from Carthage to Great Britain and Holland, have employed mercenary troops, which they hired from their poorer neighbours. Were they to make use of their native subjects, they would find less advantage from their superior riches, and from their great plenty of gold and silver; since the pay of all their servants must rise in proportion to the public opulence. Our small army of 20,000 men is maintained at as great expence as a French army twice as numerous."

  I follow the first part fine — money is just the oil, and if prices adjust to the quantity of coin, then how much money a country has shouldn't matter internally, a crown under Henry VII doing the same work as a pound today. What throws me is what comes right after: if the plenty of money is "of no consequence" for a kingdom taken by itself, how can the public still draw an advantage from a greater plenty of money in its wars and negotiations with foreign states? feels like the two claims pull against each other. Is the idea something like: your domestic wages and prices rise along with your money stock, but foreign soldiers can be hired at the (lower) wage levels of their poorer home country, so your extra gold buys more abroad than it does at home? And if thats the mechanism, doesn't the neutrality claim just apply at the level of europe as a whole, in which case the advantage should wash out? Please think carefully and maybe brainstorm two or three possible readings of the passage before settling on the one you find most plausible. Also, could you unpack the crown vs. pound remark — is Hume talking about debasement of the coinage, ordinary price inflation, or both?
reasoning: |-
  Okay, the user is struggling with a passage from Hume's "Of Money." They understand the first part about money being neutral domestically but are confused about how a greater money supply helps in foreign wars and negotiations. They're asking if the advantage comes from hiring mercenaries from poorer countries at lower wages, and they're concerned that this might contradict the neutrality of money. Also, they want clarification on the crown vs. pound remark—whether it's about debasement, inflation, or both.

  First, I need to recall Hume's main arguments. He's a key figure in the quantity theory of money. The core idea is that money is neutral in the long run: more money just raises prices proportionally, so real economic variables don't change. But here, Hume is saying that while this neutrality holds domestically, it doesn't apply internationally. That's the key point the user is stuck on.

  The user's specific confusion is how the public can gain an advantage externally if money is neutral internally. They mention hiring foreign mercenaries at lower wages. The user wonders if the advantage is only temporary or if it applies to Europe as a whole. They also question whether the neutrality claim should extend internationally, which would negate the advantage.

  Breaking this down, I should consider the mercenary mechanism. Rich countries can pay foreign troops with their abundant gold and silver. Since these troops come from poorer countries with lower price levels, the same nominal wage in gold buys more real resources there. So even though the rich country's domestic prices are high, they can leverage their monetary wealth abroad where prices are lower. That creates a real advantage for the rich country in warfare.

  But the user is right to question if this advantage persists. If all countries had the same money supply growth, prices would adjust everywhere, neutralizing the benefit. But Hume's point is that countries aren't in sync. Wealthy nations accumulate precious metals faster, creating temporary disparities. So during wars, they exploit these differences by hiring mercenaries before prices adjust internationally. It's a short-term arbitrage, not a permanent feature.

  Regarding the crown vs. pound example, Hume is illustrating price inflation over time. Henry VII's crown had more silver content than the later pound, but due to inflation (partly from debasement), the pound's value decreased. So the same nominal amount buys less now. This supports the quantity theory: more money leads to higher prices, reducing purchasing power per unit.

  The user might also be hinting at a deeper question about monetary neutrality. They might be wondering if Hume's exception undermines his neutrality principle. But the answer is no—neutrality is domestic, while international contexts have frictions like slow price adjustments and currency differences. The mercenary example exploits these frictions.

  I should also note that Hume acknowledges other advantages of money in trade, like facilitating transactions, but he's focused here on the mercenary angle for warfare. The user might benefit from understanding that Hume's broader work includes discussions on balance of payments and specie flow, which explain how money moves between countries but adjusts over time.

  To summarize: Domestically, money is neutral (prices adjust). Internationally, disparities allow rich countries to hire cheaper mercenaries because foreign wages are lower in real terms. The crown/pound remark shows long-term inflation, supporting quantity theory. The advantage is temporary due to international price level differences.
answer: |-
  As a historian of economic thought, I'm delighted to tackle this classic Hume passage. Your confusion is astute – Hume *is* making a nuanced argument that hinges on distinguishing between domestic and international monetary effects. Let's break it down step-by-step, exploring multiple readings before settling on the most plausible interpretation.

  **Core Tension & Your Insight:**
  You correctly identify the tension: If money is neutral domestically (praise/prices adjust proportionally, so real effects are nil), how can a "greater plenty of money" confer an advantage internationally? Your intuition about mercenaries and wage levels is spot-on. Let's analyze the mechanism.

  **Brainstorming Possible Readings:**

  1.  **The Absolute Purchasing Power Parity (PPP) Violation Reading (Your Initial Thought):**
      *   **Mechanism:** Rich countries (with high price levels due to abundant money) hire soldiers from poor countries (with low price levels). The *same nominal amount of gold/silver* (say, 1 ounce per month) represents a *higher real wage* in the poor country (where bread is cheap) than it would in the rich country (where bread is expensive). The rich country thus gets more military manpower per ounce of gold spent by sourcing it externally.
      *   **Neutrality Scope:** Neutrality holds *within each domestic economy* but *not* between economies due to persistent international price level differences. Hume assumes these differences aren't instantly arbitraged away.
      *   **"Advantage" Source:** The advantage stems directly from the disparity in price levels between rich and poor nations. The rich nation's "oil" (money) is more effective as a lubricant *outside* its own high-friction (high-price) system.
      *   **Critique/Challenge:** You ask if the advantage "washes out" for Europe as a whole? Not necessarily. The *transfer* of gold to the poor country *might* eventually raise prices there (per Hume's own specie-flow mechanism), but this process is slow (years/decades). During wars (which are relatively short), the rich country exploits the *existing* disparity. The poor country gains gold, but the rich country gains a crucial military advantage *now*.

  2.  **The Seigniorage/Resource Mobilization Reading:**
      *   **Mechanism:** The "public" (government) gains an advantage because it can tax or borrow the *newly mined or acquired* money *before* prices fully adjust. This gives the state temporarily enhanced purchasing power, especially abroad where prices haven't risen yet. The mercenaries are hired using this "fresh" money while international prices are still low.
      *   **Neutrality Scope:** Neutrality is a *long-run* phenomenon. In the *short run*, an influx of money *does* increase purchasing power domestically *and* internationally before prices adjust. Hume might be implying states exploit this short-run non-neutrality for war finance, especially externally.
      *   **"Advantage" Source:** The advantage comes from the temporary lag between money influx and price adjustment, combined with the state's ability to capture the new money first.
      *   **Critique:** While Hume recognized short-run non-neutrality elsewhere, this passage focuses on the *persistent* advantage rich states gain from their *overall* higher money stock, not just *new* inflows. The crown/pound analogy suggests a long-run perspective.

  3.  **The Liquidity & Credit Enhancement Reading:**
      *   **Mechanism:** Abundant specie doesn't just affect prices; it facilitates credit markets and ensures the state can reliably raise large sums *quickly* for foreign payments. Rich states with deep pools of money/credit can contract with foreign suppliers (like mercenary captains) more easily and at potentially better terms due to their perceived solvency.
      *   **Neutrality Scope:** Neutrality strictly applies to the *price level*, not to the *ease and cost of financial transactions*. Abundant money makes the financial system work better, lowering transaction costs internationally.
      *   **"Advantage" Source:** The advantage is in transaction efficiency and creditworthiness for international contracts, not directly in the real purchasing power of the coin per se.
      *   **Critique:** While plausible, Hume's text emphasizes the *direct* consequence of plentiful money enabling the hiring of cheaper foreign troops ("*since* the pay of all their servants must rise in proportion..."), pointing more strongly towards the real wage disparity than credit mechanisms.

  **The Most Plausible Reading: Reading #1 (PPP Violation) with Nuance**

  Hume's core argument here is best explained by **Reading #1**, incorporating elements of the short-run dynamics hinted at in Reading #2:

  1.  **Domestic Neutrality (The Oil):** Within a closed economy ("any one kingdom by itself"), Hume asserts the long-run Quantity Theory of Money (QTM). More money ultimately just raises prices proportionally ("prices of commodities are always proportioned to the plenty of money"). The "crown vs. pound" remark illustrates this **long-term price inflation**. A crown in Henry VII's time contained roughly 3.5g of fine silver; by Hume's time, the silver content of British coins had been repeatedly debased, and general inflation meant a pound (nominally 4 crowns, but with less silver per crown) had the purchasing power of a single crown centuries earlier. **It's primarily about inflation over centuries, driven by both debasement *and* increased money supply from trade/mining.** Real economic activity is unchanged.
  2.  **International Non-Neutrality (The Advantage):** Hume recognizes that price levels differ significantly between rich (money-abundant) and poor (money-scarce) countries. These differences persist due to barriers to trade and slow adjustment. *Crucially, wages are part of the price level.*
  3.  **The Mercenary Mechanism:** A rich state uses its plentiful gold/silver to hire soldiers from a poor country.
      *   **Domestically:** If it hired its own subjects, it would have to pay high nominal wages reflecting the domestic high price level. Its abundance of money confers no real advantage here – it just pays more nominal crowns/pounds for the same real resource (a soldier's service).
      *   **Internally:** It pays the foreign soldier a *nominal wage* in gold/silver. This nominal wage, while potentially similar to what it would pay domestically, represents a *much higher real wage* in the poor soldier's home economy, where prices (including the cost of subsistence) are low. The soldier is highly motivated.
      *   **Result:** The rich state acquires military manpower *cheaper in real terms* than it could domestically. Its "greater plenty of money" buys more real resources (soldier-years) abroad than it can at home due to international price/wage disparities. The French army example concretizes this: Britain maintains a smaller force at the same nominal cost as France's larger force because Britain relies more on expensive domestic/resources (or perhaps more highly trained/professional troops), while France, being larger and perhaps relying more on conscription or lower domestic wages relative to its money stock, fields more men for the same nominal outlay. Hume's point is Britain *could* field a larger force for the same cost *if* it exploited cheaper foreign manpower like France might have been doing historically.
  4.  **Why Doesn't it "Wash Out"?** Hume implicitly rejects instantaneous international PPP. The adjustment mechanism (specie-flow) he described elsewhere operates slowly. Wars are relatively short. The rich country gains a decisive *temporary* advantage by spending its money abroad *before* the price levels fully equalize. The inflow of gold *into* the poor country *will* eventually raise prices there (as per Hume's own theory), but this process takes time, allowing the advantage to persist for strategically significant periods. The advantage is inherently relative and exploitative of existing international inequality.

  **Unpacking the Crown vs. Pound:**

  *   **Primary Meaning:** **Ordinary Price Inflation over the Long Run.** Hume's point is that the nominal unit of account (what we call a "crown" or a "pound") buys far less in his time than centuries earlier. A specific nominal amount (one crown under Henry VII) could buy the same basket of goods as a much larger nominal amount (one pound, which was 4 crowns nominally but worth much less in silver and purchasing power) in the 1750s.
  *   **Contributing Factors:** This long-term inflation was caused by:
      1.  **Increased Money Supply:** Influx of silver and gold from the Americas (via Spain) into Europe over the 16th-17th centuries.
      2.  **Debasement:** Rulers frequently reduced the precious metal content of coins while keeping their face value the same (e.g., a "crown" coin under Henry VII contained more silver than a "crown" coin later on). Hume explicitly discussed debasement in other essays and understood its inflationary effect.
  *   **Illustrating Neutrality:** The key point for Hume here is that despite the vast change in the *nominal* amount needed to buy goods (from 1 crown to 1 pound), the *real* economy functioned similarly. The "wheel" of needing a certain amount of metal to facilitate trade turned, but it required more nominal units (smaller/lighter coins or more of them) because each unit was worth less. The real "work" of commerce (the movement of commodities) wasn't fundamentally altered by the nominal change in the money unit or the quantity of money per se – prices adjusted.

  **Conclusion:**

  Hume is not contradicting himself. He is making a sophisticated argument about the *scope* of monetary neutrality:

  1.  **Domestically & Long-Run:** Money is neutral. More money → proportionally higher prices → no change in real output, employment, or the real cost of domestic resources. The crown/pound analogy perfectly illustrates this long-run inflation.
  2.  **Internationally & Short-to-Medium Run:** Due to persistent international differences in price/wage levels, a country with abundant money *can* gain a real advantage by spending that money abroad, particularly on resources (like mercenary soldiers) whose domestic supply price (high nominal wages) is greater than their international supply price (lower nominal wages that represent higher real wages in the source country). The "public" (the state) draws this advantage specifically in contexts like war financing where large-scale foreign contracting is possible.

  Your initial reading – that extra gold buys more real resources abroad than at home due to lower foreign prices/wages – is fundamentally correct and is the core mechanism Hume describes for the advantage in "wars and negotiations with foreign states." The advantage doesn't immediately "wash out" for Europe because monetary adjustments between economies are slow, allowing resource-rich but money-poor countries to effectively subsidize the military efforts of money-rich countries through lower real wage demands, captured via international payments in precious metals.
