  The user wants to know if anyone has redone the doomsday calculation using real population data instead of the uniform assumption. They suspect that incorporating actual projections might negate the doomsday conclusion. Additionally, they mention their friend's point about the reference class being limited to those who can understand the argument, like excluding subsistence farmers from 3000 BC. The user feels this reference class adjustment might be too arbitrary but can't articulate why.

  First, I need to recall the core of the doomsday argument. It uses Bayesian reasoning with the birth rank as evidence. The traditional model assumes a uniform prior over possible total humans. But the user is right—this assumes that humans are evenly spread over time, which isn't realistic. The UN projections show a sharp peak and decline, so birth ranks aren’t evenly distributed in time. If most people live during the peak, someone born now is more likely to be in that peak period rather than in the tails. That undercuts the argument that being born "early" is unlikely if there are many future humans.

  Next, the user's specific question about whether anyone has used real population curves. I remember that Bostrom and others have looked into this. Models incorporating non-uniform priors show that if the population curve is highly skewed, the doomsday effect weakens. For example, if the peak is sharp, our current birth rank isn't surprising even with a large future population. So yes, using actual data does make the doomsday conclusion less probable, especially if the peak is now or soon. The user's intuition here is correct.

  Regarding the friend's reference class argument: narrowing the class to those who can comprehend the doomsday argument (like modern educated people) excludes most humans. But this introduces issues. The reference class problem is a known weakness in anthropic reasoning. If the class is arbitrary, results can change based on how it's defined. The user feels this is too easy a fix, and they're right. While it might invalidate the argument, it also highlights the subjectivity in selecting the reference class, which undermines the argument's objectivity. However, the user seems more concerned with the uniform distribution assumption as a stronger point.

