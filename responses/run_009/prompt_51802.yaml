  ### Activity Design: Sleeping Beauty Betting Game  
  **Goal:** Students experience how settlement rules affect betting behavior in self-locating beliefs, revealing that the halfer/thirder debate is about decision-making, not just credence numbers.

  ---

  ### **Mechanics & Setup**  
  **Participants:**  
  - **2 Beauties** (per group), **5 Bookmakers** (per group).  
  - Split the class into **two groups** (7 students each). Each group runs in parallel:  
    - **Group A (Condition 1: Per-Awakening Settlement):** Bets settled at every awakening.  
    - **Group B (Condition 2: Per-Experiment Settlement):** Only one randomly selected bet per Beauty counts.  
  - **Instructor Role:** Flips coins, manages "memory wipes," enforces rules, and records data.  

  **Rooms & Memory Wipe:**  
  1. **"Sleep" Room (Room B):** Beauties start here. No windows, minimal stimuli.  
  2. **"Awakening" Room (Room A):** Bookmakers set up here.  
  3. **Memory Wipe Protocol:**  
     - Beauties are **blindfolded** and led by the instructor through a **partitioned corridor** (e.g., curtains or screens) between rooms.  
     - **Staggered timings:** Heads = 1 awakening (3 min); Tails = 2 awakenings (3 min each, 5-min gap between).  
     - **No identifiers:** Beauties wear **generic masks** (e.g., plain white masks) and are **silent**. Bookmakers see only a numbered card (e.g., "Beauty 7") handed to them by the instructor during bets.  
     - **Randomization:** Route varied (e.g., instructor walks in circles), lights dimmed, background white noise played.  

  **Betting & Payoffs (Tokens):**  
  - **Bookmakers:** Post odds on a board (e.g., "Heads: 2.5x, Tails: 1.5x"). Odds must be set once, at the start.  
  - **Beauties:** At each awakening, they visit one bookmaker, bet 1 token on heads/tails.  
  - **Settlement:**  
    - **Condition 1 (Group A):** All bets settled. Win = tokens × odds; loss = token forfeited.  
    - **Condition 2 (Group B):** After awakenings, instructor flips a coin for each Beauty. Heads = first bet counts; tails = second bet counts (if applicable).  
  - **Tokens:**  
    - Starting tokens: 10 per student.  
    - Bets: 1 token per bet (max 2 bets/Beauty in tails).  
    - Payout example: Bet 1 token on heads at 2.5x odds → win = 2.5 tokens (net +1.5).  

  ---

  ### **Timeline (90 Minutes Total)**  
  1. **Intro & Setup (10 min):**  
     - Explain rules, roles, and settlement conditions. Assign groups/roles randomly.  
     - Distribute masks, blindfolds, tokens, betting slips.  

  2. **Round 1 (35 min):**  
     - **Coin Flips (2 min):** Instructor flips coins privately for each Beauty (one coin/Beauty).  
     - **Awakenings & Betting (15 min):**  
       - *Beauties:* Blindfolded, led to Room A for awakenings. At each, given a random number (e.g., "Beauty 3"), bet with one bookmaker.  
       - *Bookmakers:* Record bets (Beauty number, heads/tails, tokens).  
       - *Instructor:* Tracks awakenings, Beauty numbers, and bets on a spreadsheet.  
     - **Settlement (10 min):**  
       - Reveal coin results. Settle bets per group’s condition (use coin flips for Group B).  
     - **Rotate Roles (8 min):** Beauties become bookmakers; bookmakers become Beauties.  

  3. **Round 2 (35 min):**  
     - Repeat Round 1 with new roles.  

  4. **Debrief (10 min):**  
     - Discuss: How did settlement rules change betting? Did Beauties bet differently?  
     - Key insight: Same evidence → different actions under different rules.  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Beauties Cheating (e.g., counting steps):**  
     - **Prevention:** Vary walking routes, use white noise, enforce strict blindfolds.  
     - **Solution:** Penalize cheaters (e.g., lose 5 tokens).  

  2. **Bookmakers Leaking Information:**  
     - **Problem:** Saying "welcome back" or changing odds.  
     - **Prevention:** Bookmakers must stay silent; odds fixed at start.  
     - **Solution:** Cancel affected bets; remind mid-game.  

  3. **Voice/Appearance Recognition:**  
     - **Problem:** Students recognize each other.  
     - **Prevention:** Masks, no talking, generic gowns (e.g., lab coats), numbered cards.  
     - **Solution:** Assign new numbers each awakening.  

  4. **Time Overruns:**  
     - **Prevention:** Use timers; cap betting at 30 seconds/awakening.  
     - **Solution:** Skip second awakening if behind (simulate tails as one awakening).  

  5. **Settlement Confusion:**  
     - **Prevention:** Instructor uses a tracking sheet (see table below).  
     - **Solution:** Clarify with examples before starting.  

  **Tracking Sheet Example:**  
  | Beauty | Coin | Awakening | Random ID | Bookmaker | Bet | Win/Loss (Cond 1) | Win/Loss (Cond 2) |  
  |--------|------|-----------|-----------|-----------|-----|-------------------|-------------------|  
  | 1      | H    | 1         | 37        | B3        | H   | Win               | Counts? (Coin=H)  |  

  ---

  ### **Limitation to Address in Debrief**  
  **The "Perfect Indistinguishability" Gap:**  
  - In the real Sleeping Beauty problem, awakenings are *subjectively identical*. Our game cannot fully replicate this:  
    - Students know they’re in a game and might infer patterns (e.g., "I bet twice, so it’s tails").  
    - **Debrief Point:** Highlight that the philosophical dilemma assumes **no possible distinction** between awakenings. In practice, even small cues (e.g., subconscious biases) break the symmetry. Thus, halfers/thirders aren’t just disagreeing about probabilities—they’re disagreeing about how to *weight* identical experiences when making decisions.  

  ### **Why This Works**  
  - Students **feel** the conflict: In Condition 1, betting on heads is risky (potential double loss); in Condition 2, it’s safer.  
  - **Reveals core insight:** The halfer/thirder split isn’t about credence alone—it’s about how repeated, identical experiences should inform decisions under different rules.  

  **Materials Needed:** Blindfolds, masks, tokens, coins, timers, betting boards, white noise machine, room dividers.
