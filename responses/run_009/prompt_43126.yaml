prompt: |-
  I've been keeping a list of consent cases where my gut has a firm verdict, and I want to know if there's a principle underneath them, because right now it feels like I'm just reacting to vibes. The list, with my verdicts:

  1. A surgeon tells a patient the serious-complication rate for a procedure is "around one in a hundred." Patient consents. Actually the surgeon's own audited rate is one in twenty-five — he's not lying, he sincerely believes the one-in-a-hundred figure, it's just out of date and he never checks. Gut says: consent invalid. If she'd known the real number she'd have refused.

  2. Same surgery, but this time the surgeon knows his real rate and volunteers nothing either way. The patient asks no questions, signs, consents. Gut says: valid. Doctors don't have to volunteer everything, asking is on the patient. (I'm least sure about this one.)

  3. A man on a dating app says he's 44 when he's 49. They meet, sleep together, both happy about it after. Gut: valid, obviously. Five years is nothing, nobody's marrying the number.

  4. Same man, same five-year shave, but he's married and says he isn't, and the other person has said up front they would never knowingly sleep with a married person. Gut: what happened is wrong, but I wobble on whether the consent was *invalid* — it feels like they consented to him, and the lie just made him available under false pretenses? Or maybe they consented to a person who doesn't exist? I can't get this one straigt.

  5. A broke student signs up as a paid research subject. The pay is $900 for two days of testing, about six weeks of her rent. Nobody threatened her with anything, she genuinely wants the money, and she says afterwards she'd do it again. Gut: valid. A big inducement isn't a gun.

  6. Same study, but the recruiter tells her that if she quits after day one she gets nothing — so she's already done a day unpaid and now feels locked in. Gut: her consent to day two is compromised? Or is it fine, since she can walk away, just poorer? I go back and forth on this one a lot.

  7. A 16-year-old refuses a blood transfusion, calmly, repeatedly, explains her reasons in detail, and her parents back her. Gut: override the refusal. But a 16-year-old usually knows her own mind as well as a 25-year-old does, so this verdict can't be riding on competence — and I can't say what it IS riding on instead.

  So: is there one account of what makes consent valid or invalid here — something like "the consent has to be from the person, informed about what a reasonable person in her position would want to know, and given without being trapped" — that covers all seven? If there is, tell me which of my verdicts it has to overturn, because I can feel that #2 and #4 pull against each other and maybe #7 doesn't belong with the rest at all. And then tell me what the principle predicts for a case I haven't listed: a patient who consents to a trial after her doctor says "most patients in your situation choose this," which is true, but the doctor knows this particular patient is unusually swayed by what most people do.

  I'd rather lose a verdict or two than keep them all with a principle so full of epicycles it can't ever be wrong. But tell me which verdicts you're dropping and why that one and not another — don't just quietly keep the ones that fit.
reasoning: |-
  Okay, let me tackle this user's query. They've listed seven consent scenarios with their gut verdicts and want a unified principle. First, I need to understand each case individually. The surgeon in #1 with outdated info invalidates consent because the patient wasn't properly informed. But in #2, the surgeon knows but doesn't disclose, and the user thinks consent is valid since the patient didn't ask. That seems contradictory. How to reconcile?

  Looking at #3 and #4, age lie vs. marital status lie. The user sees the age lie as harmless but the marital status as problematic, though unsure about consent validity. Then there's the paid study in #5 and #6, where financial pressure in #6 makes consent shaky. The 16-year-old refusing a transfusion in #7—override despite competence. 

  The user mentions tension between #2 and #4. In #2, not volunteering info is okay, but in #4, lying about being married might invalidate consent. The key difference is deception vs. omission. Also, the materiality of the information. Marital status matters to the person, unlike age here. 

  For a unified principle, autonomy is central. Consent requires understanding material facts. But what's material? It depends on the person's values. However, that's subjective. Maybe a hybrid: materiality based on what a reasonable person would want, adjusted for known specifics. 

  Applying this to #2: the surgeon's omission might still be material if the risk is high enough that a reasonable patient would want to know. So perhaps overturning #2's verdict. For #4, lying about marriage is material because the person stated it's a dealbreaker. Consent invalid. 

  #7 is different. It's about competence and harm. Minors can be overridden to prevent serious harm, even if competent. The principle here is harm prevention, not just consent. 

  The additional case: the doctor mentioning "most patients choose this" while knowing the patient is swayed by others. This is manipulation by withholding that the patient is atypical. Material fact? Probably, so consent might be invalid. 

  So the principle would adjust #2 and #4, and handle #7 under a separate harm principle. The user might need to drop or modify #2's verdict, accepting that withholding material information invalidates consent even if not asked.
answer: |-
  Your gut verdicts reveal a consistent pattern centered on **material deception, exploitation of vulnerability, and harm prevention**—but you're right that #2 and #4 clash. Here’s a unified principle that captures most cases, with minimal epicycles:

  **Consent is invalid if:**
  - **Material facts are misrepresented** (directly or by omission when context demands disclosure), *or*
  - **Consent is obtained through exploitative constraints** (beyond ordinary life pressures), *or*
  - **Refusal would cause catastrophic harm** (overriding autonomy in life-or-death scenarios).

  Let’s apply this to your list, flagging where your verdicts hold or must be overturned:

  ### Case-by-Case Analysis
  1. **Surgeon’s outdated stats**  
     - *Your verdict:* Invalid ✅  
     - *Why:* Material fact misrepresented (context demands accurate risk disclosure; "around 1/100" vs. 1/25 is significant).  
  2. **Surgeon knows risk, patient doesn’t ask**  
     - *Your verdict:* Valid ❌ **OVERTURN**  
     - *Why:* Context demands disclosure—surgical risks are *inherently material*. A "reasonable patient" standard (widely used in medical law) requires proactive disclosure of serious risks.  
  3. **Age lie (49 vs. 44) on dating app**  
     - *Your verdict:* Valid ✅  
     - *Why:* Immaterial deception (5 years rarely alters sexual consent decisions for reasonable people).  
  4. **Lying about marital status**  
     - *Your verdict:* Wobbling ❓→ **Invalid**  
     - *Why:* Material deception. The lie created a false identity ("single, available person") the other party explicitly conditioned consent upon. Consent was to a *scenario*, not just a body.  
  5. **Broke student takes study for money**  
     - *Your verdict:* Valid ✅  
     - *Why:* No exploitation. Poverty is an ordinary constraint; she freely chose, faced no undue pressure.  
  6. **Student "locked in" after unpaid Day 1**  
     - *Your verdict:* Compromised ✅  
     - *Why:* Exploitative constraint. Deliberately structuring payment to create sunk-cost pressure crosses into coercion.  
  7. **16yo refuses life-saving transfusion**  
     - *Your verdict:* Override ✅  
     - *Why:* Harm prevention trumps autonomy when refusal causes catastrophic harm (death). Competence ≠ absolute veto in life-or-death cases involving minors.  

  ### The Tension Between #2 and #4
  - **#2 Overturned:** Medical consent requires *proactive disclosure* of material risks—it’s not a "buyer beware" scenario. Silence violates the patient’s trust in the clinician’s role.  
  - **#4 Clarified:** Lying about identity-defining facts (like marital status *when explicitly relevant*) invalidates consent because it distorts the *nature of the act* (consensual sex with a single person vs. adultery/unwitting affair).  

  ### Your New Case: Doctor Manipulates Social Influence
  - **Scenario:** Doctor says, *"most patients in your situation choose this"* (true), but knows this patient is uniquely swayed by others.  
  - **Verdict by Principle:** **Consent invalid**.  
    - *Why:* Exploitative omission. The doctor withheld the material fact that the patient’s *atypical psychology* made this information misleading. Context demands disclosing factors that distort rational decision-making.  

  ### Epicycle Avoidance: What We Simplified
  - **Dropped Verdict:** Only **#2** was overturned. Medical ethics/law consistently imposes affirmative disclosure duties—your "vibe" here conflicted with the deeper principle.  
  - **No Subjectivity Trap:** Materiality uses a **hybrid standard**:  
    - "Reasonable person" baseline (e.g., surgery risks always material; 5-year age gap immaterial).  
    - **Adjusts for known specifics** (e.g., "I won’t sleep with married people" makes marital status material).  
  - **Harm as Limited Override:** Only catastrophic harm (#7) justifies overriding consent, not paternalism (e.g., we don’t force transfusions on competent adults).  

  ### Core Principle Refined
  > **Consent is invalid if there is deception/omission of facts material to a reasonable person *in the consenter’s specific position*, or if constraints exploit vulnerability beyond societal norms, or if refusal causes irreparable/catastrophic harm when autonomy is developmentally limited (e.g., minors).**  

  This preserves your intuitions while resolving conflicts through:  
  - **Contextual materiality** (not just "subjective" or "objective"),  
  - **Anti-exploitation** (distinguishing pressure from coercion),  
  - **Harm minimization** (as a narrow override).  

  Would a deeper dive into any case or principle adjustment help?
