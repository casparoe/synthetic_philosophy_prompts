  We are designing a procedure to determine whether a model failure is due to a lack of comprehension (understanding the underlying situation) or just pattern matching (relying on surface forms). The procedure must be operational, testable, and executable in one afternoon by engineers without access to model internals.

  Key principles from the philosophical debate:
  1. Understanding is tied to the ability to track the referents (what the language is about) and not just the form.
  2. Robustness and generalization are observable signatures of understanding.
  3. Fluency can mask the absence of a grounded world model.

  The procedure will consist of a sequence of tests and questions. It must terminate with either a verdict (e.g., "pattern matching failure" or "comprehension failure") or hand back to a human when the remaining question is non-empirical.

  Proposed Procedure:

  1. **Reproduce and Isolate the Failure**
     - Reproduce the failure on the specific incident input.
     - Check if the failure is consistent (run multiple times).
     - If not consistent, note that randomness might be a factor and consider averaging over runs.
     - If the failure is not reproducible, stop: the incident might be a fluke.

  2. **Paraphrase Test (with controlled substitutions)**
     - Create multiple paraphrases of the input that preserve the meaning but change the surface form (words, syntax, structure).
     - Also, create a version with nonsense tokens (or shuffled names) that preserve the structure but remove meaning. For example, replace key nouns with tokens like "foo", "bar", or shuffle the names of entities arbitrarily.
     - Check model performance on:
       a. Original input (should fail, as per incident)
       b. Paraphrases (if the model fails on paraphrases, that suggests the model is not overfitting to the exact words, but the failure might be deeper)
       c. Nonsense/shuffled version (if the model fails similarly, it might be pattern matching on structure; if it fails differently or succeeds, that might indicate the original failure was due to the specific words)

     - Interpretation:
       - If the model fails on paraphrases and succeeds on nonsense? -> Not likely pattern matching on the exact string, but might be pattern matching on structure or a deeper failure.
       - If the model fails on nonsense in the same way? -> Pattern matching on structure.
       - If the model succeeds on paraphrases? -> Then the original failure was due to the specific wording (pattern matching on surface form) and not the meaning.

  3. **Generalization Test (if applicable)**
     - If the incident involves a failure to generalize (like the refund policy example), check:
       - Does the model perform correctly on the base case (e.g., US refund policy) but fail on the new case (new market)?
       - Then, create a minimal variation of the base case that mirrors the structure of the new case (e.g., a hypothetical market that is not the new one, but has similar data sparsity) and test.
       - Also, try to provide a few examples (retrieval or in-context) of the new market and see if performance improves.

     - Interpretation:
       - If performance improves with a few examples (even if they are not from the exact new market, but similar in structure) then the issue is data sparsity (pattern matching without enough patterns) and not comprehension.
       - If the model fails even when provided with examples that should clarify the underlying concept, then it might be a comprehension issue.

  4. **Robustness Test (adversarial or stress tests)**
     - Apply small, meaning-preserving perturbations to the input (typos, synonyms, reordering) and see if the model's output remains consistent.
     - Apply small, meaning-changing perturbations and see if the model detects the change (if the task requires such sensitivity).

     - Interpretation:
       - If the model is brittle (fails on minor perturbations) then it is likely pattern matching.
       - If the model is robust to perturbations, that suggests it is tracking meaning.

