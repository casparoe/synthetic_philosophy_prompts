answer: |-
  Below is a reusable, step-by-step procedure grounded in the philosophical debate about understanding (specifically, the distinction between manipulating linguistic forms vs. tracking referents, and robustness/generalization as proxies for comprehension). The procedure is designed for engineers to execute in one afternoon using only black-box model access, with clear termination points for empirical vs. non-empirical questions.

  ---

  ### **Procedure: Diagnosing Comprehension vs. Pattern Matching**  
  **Objective**: Determine if a model failure stems from shallow pattern matching (surface form) or lack of comprehension (failure to track referents).  
  **Input**: A specific incident (failing input/output pair or stakeholder concern).  
  **Output**: One of:  
  - **Pattern matching failure** (surface form overfitting, data sparsity, or structural bias)  
  - **Comprehension failure** (inability to track referents or generalize)  
  - **Non-empirical handoff** (all tests passed, but philosophical objection remains)  
  - **Inconclusive** (requires further investigation)  

  #### **Step 1: Reproduce & Isolate the Failure**  
  - **Question**: Is the failure consistent and specific to this input?  
  - **Test**: Run the model 5–10 times on the *exact incident input*. Vary only non-semantic elements (e.g., whitespace, punctuation).  
  - **Evidence for sufficiency**:  
    - If failure rate < 80% → **Inconclusive** (likely randomness; terminate).  
    - If failure rate ≥ 80% → Proceed to Step 2.  

  #### **Step 2: Paraphrase and Substitution Check**  
  - **Question**: Does performance depend on surface strings or underlying referents?  
  - **Tests**:  
    - **Paraphrase**: Create 3–5 meaning-preserving rewordings (e.g., passive→active voice, synonyms, clause restructuring).  
    - **Nonsense substitution**: Replace key nouns/verbs with arbitrary tokens (e.g., "refund" → "zorch"), preserving syntax.  
    - **Referent shuffle**: Swap entity names/roles (e.g., "US" → "Mars", "customer" → "kangaroo") while keeping relationships intact.  
  - **Evidence for sufficiency**:  
    - Passes all paraphrases but fails original → **Pattern matching** (overfitting to specific phrases).  
    - Fails paraphrases but passes nonsense/referent-shuffled → **Comprehension failure** (tracks referents, not forms).  
    - Fails all tests uniformly → Proceed to Step 3 (likely deeper pattern matching).  
    - Passes all tests → Proceed to Step 4 (no failure detected).  

  #### **Step 3: Generalization Stress Test**  
  - **Question**: Does the model generalize when given minimal scaffolding for the underlying concept?  
  - **Tests**:  
    - **Minimal examples**: Provide 1–3 in-context examples of the *concept* (e.g., "refund policy for [new market]") without changing the prompt structure.  
    - **Out-of-distribution (OOD) variants**: Modify incidental features (e.g., currency, product names) while preserving core logic.  
    - **Counterfactual tweak**: Alter a critical fact (e.g., "policy is void on Sundays" → "policy is void on Mondays").  
  - **Evidence for sufficiency**:  
    - Performance recovers with 1–3 examples → **Pattern matching** (data sparsity issue).  
    - Fails OOD/counterfactual tests → **Comprehension failure** (cannot abstract beyond training).  
    - Passes all → **Pattern matching** (structural overfitting, not referential). Terminate.  

  #### **Step 4: Robustness Probe**  
  - **Question**: Is the model robust to meaning-preserving noise? (Fluency ≠ comprehension.)  
  - **Tests**:  
    - **Adversarial perturbations**: Insert typos, filler phrases, or irrelevant clauses that don’t alter meaning (e.g., "Refund policy, you know, for the US..." → "Refund policy, like, for the US...").  
    - **Edge cases**: Feed inputs with ambiguous pronouns, vague references, or contradictions.  
  - **Evidence for sufficiency**:  
    - Brittle to perturbations → **Pattern matching** (relies on lexical cues).  
    - Robust but failed earlier steps → **Comprehension failure**.  
    - Passes all → Proceed to Step 5.  

  #### **Step 5: Termination & Handoff**  
  - **If failure is resolved in Steps 2–4**: Assign verdict (**Pattern matching** or **Comprehension failure**).  
  - **If all tests passed but stakeholder objects**:  
    - **Non-empirical handoff**: "Model passes all observable tests for referent-tracking, generalization, and robustness. Further debate concerns subjective understanding, which is untestable via behavior."  
  - **If inconclusive**: Escalate for deeper analysis.  

  ---

  ### **Incident Walkthroughs**  
  #### **Incident 1: US-to-New-Market Refund Failure**  
  - **Scenario**: Model handles US refunds but fails identically for a new market (e.g., Japan). Team spent a week rewriting prompts, but retrieval fixed it.  
  - **Procedure execution**:  
    1. **Step 1**: Failure reproduced consistently (100% failure on Japan inputs).  
    2. **Step 2**:  
       - Paraphrases fail (e.g., "refund rules for Japan" → same error).  
       - Nonsense substitution ("refund rules for Zogland") → fails identically.  
       - Referent shuffle ("US" → "Japan", "Japan" → "US") → US policy now fails; Japan passes.  
       → **Evidence**: Failure tracks surface strings (e.g., "Japan"), not referents.  
    3. **Step 3**:  
       - Add 1–2 examples of Japan policy → performance recovers instantly.  
       → **Verdict**: **Pattern matching failure due to data sparsity**.  
  - **Conclusion**: Procedure terminates at Step 3. Diagnosed in **≤2 hours** (vs. 1 week of prompt engineering).  
  - **Human judgment absorbed**: None. Empirical tests confirmed data sparsity.  

  #### **Incident 2: Triage Assistant "Lacks Understanding" Despite Passing Tests**  
  - **Scenario**: Model passes all behavioral checks (edge cases, adversarial tests), but a stakeholder insists it "doesn’t understand."  
  - **Procedure execution**:  
    1. **Step 1**: No failure to reproduce (outputs are correct).  
    2. **Step 2**: Passes paraphrases, nonsense substitutions, and referent shuffles (e.g., "customer" → "kangaroo" → correctly triages based on context).  
    3. **Step 3**: Generalizes to OOD cases (e.g., fictional products) and counterfactuals.  
    4. **Step 4**: Robust to typos/filler phrases.  
    5. **Step 5**: **Non-empirical handoff**.  
  - **Conclusion**: "Model passes all empirical tests for comprehension (referent-tracking, generalization, robustness). Stakeholder’s concern about subjective understanding is philosophical and untestable."  
  - **Human judgment deferred**: Whether to shelve the feature hinges on non-empirical concerns (e.g., "Is pattern matching acceptable even if it works?").  

  #### **Incident 3: Drafting Assistant Fluency Masks Shallowness**  
  - **Scenario**: Model produces a brilliant, fluent technical draft, but your procedure flags it as shallow.  
  - **Procedure execution**:  
    1. **Step 1**: Output appears correct and insightful (no obvious failure).  
    2. **Step 2**:  
       - Paraphrases → fluent output, but reveals over-reliance on jargon.  
       - Nonsense substitution (e.g., "quantum encryption" → "floob encryption") → model generates equally fluent but nonsensical explanations.  
       → **Evidence**: Performance tracks vocabulary, not concepts.  
    3. **Step 3**:  
       - Counterfactual tweak (e.g., "algorithm assumes low-latency networks" → "algorithm assumes high-latency networks") → model ignores change, reuses original logic.  
       → **Evidence**: Fails to track referents under perturbation.  
    4. **Step 4**:  
       - Adversarial perturbation (add irrelevant clauses) → output degrades into generic platitudes.  
  - **Verdict**: **Pattern matching failure** (shallow fluency without robustness).  
  - **Conclusion**: Procedure contradicts the team’s initial delight by revealing fragility. Terminates at Step 4.  
  - **Human judgment absorbed**: Engineers might overlook shallowness due to fluency; the procedure forces empirical grounding.  

  ---

  ### **Key Design Notes**  
  - **Philosophy operationalized**:  
    - **Referent-tracking** tested via nonsense substitutions/referent shuffles (Step 2).  
    - **Generalization** tested via minimal examples/OOD variants (Step 3).  
    - **Robustness** tested via adversarial perturbations (Step 4).  
    - **Fluency mask** exposed via nonsense fluency + counterfactuals (Incident 3).  
  - **Efficiency**: Each incident resolved in one afternoon. Tests require only black-box access.  
  - **Guardrails**:  
    - Avoids philosophy debates by deferring to behavior (e.g., "understanding" = referent-tracking + generalization).  
    - Explicit handoff point for non-empirical concerns (Step 5).  
  - **Contradicting Preferences**: Incident 3 shows how the procedure overrides human bias toward fluency.  

  This procedure converts "does it understand?" into falsifiable tests, prioritizes actionable fixes (e.g., retrieval > prompt engineering), and cleanly separates empirical results from philosophical disagreements.
