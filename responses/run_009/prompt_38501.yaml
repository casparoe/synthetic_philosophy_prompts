prompt: |-
  I've been reading LessWrong-adjacent discussions of personal identity for over a decade, and I've finally tabulated my gut verdicts on survival cases, most of them descended from Parfit's teletransporter. I'd like your help extracting a principle from them, because I can't make them cohere.

  My verdicts, such as they are:

  1. A scanner records every detail of my brain, disintegrates my body on Earth, and builds an exact replica on Mars. Gut says: I survive. This is just transport with extra steps.
  2. The same scan, but the Earth body is left alive. Now the Mars person is not me; the person standing on Earth is. If both claim my name and my bank account, the Earth one wins.
  3. My neurons are replaced one at a time by functional silicon duplicates over six months, with no interruption of consciousness. Gut says: I survive. If anything I barely care.
  4. The same replacement done in fifteen minutes under general anaesthesia. This should be equivalent to case 3 on any view I can articulate, yet my confidence that I survive drops sharply, which annoys me.
  5. My grandmother's memories and personality were erased by dementia over a decade, yet she clearly survived throughout; she was right there. But if psychological continuity is what constitutes survival, it's unclear what remained to survive.
  6. A man dies. A year later, an organisation reconstructs a perfect copy of his pre-death brain-state from meticulous records and runs it. Gut says: he did not survive; he died, and something new began. But the pattern resumed just as it does after a night's sleep, and in case 1 the pattern also merely resumes after a gap. I cannot hold 1, 6, and "survival is pattern-resumption" together.

  My tentative principle: survival is continuity of the pattern as an ongoing causal process, not mere preservation of the pattern information. This seems to handle 1 versus 6, and maybe 2, but I can't see how it accommodates 5 without stretching "causal process" beyond recognition, and it says nothing about why 4 frightens me more than 3.

  So: is there a principle, stated precisely, that captures these verdicts, or as many as possible? Please say which clause is motivated by which case, which of my verdicts any credible principle would have to overturn, and what the principle predicts for two cases I haven't listed: (a) the non-destructive scan of case 2, where the Earth body is then destroyed in an accident one hour later, before either body has had any new experiences; and (b) a branch in which the machine announces, before scanning, that the Earth body will be painlessly terminated after a week of ordinary life.

  Please respond in British English.
reasoning: |-
  Hmm, the user has been grappling with personal identity questions inspired by Parfit's teletransporter thought experiments for over a decade. They've compiled six specific intuition-based verdicts about survival scenarios and are struggling to find a coherent principle that explains them all. Their provisional "causal continuity of pattern" theory handles some cases but fails others - particularly the grandmother's dementia case and their unease about rapid replacement under anesthesia.

  The cases reveal fascinating tension points: They accept destructive teleportation (1) but reject duplication (2), embrace gradual replacement (3) yet feel queasy about the same process accelerated (4), affirm bodily continuity in dementia (5) despite psychological discontinuity, and resist revival from backup after biological death (6). Their discomfort seems to center on gaps in consciousness (4), multiplicity (2), and biological cessation (6).

  Notably, their intuitions privilege the original body as the "anchor" of identity in duplication scenarios (2) and revival cases (6), yet paradoxically accept destruction of that body in teleportation (1). The grandmother case (5) further complicates matters by suggesting they intuitively value physical continuity even without psychological continuity.

  For their unasked scenarios: In (a) where the duplicate survives after original's accidental death, their bodily anchor intuition would likely declare survival failed - the duplicate is merely a copy. But (b) with delayed destruction might trigger their teleportation intuition from case 1, suggesting temporal proximity matters. 

  The core challenge is threefold: reconciling pattern-resumption acceptance in 1 but not 6, explaining why speed matters in 3 vs 4, and honoring the grandmother's survival without psychological continuity. Any viable principle must account for their deep-seated biological anchoring while respecting their pattern-based intuitions elsewhere.
answer: |-
  Right, let's have a crack at this fascinating puzzle. You've got a compelling set of intuitions that clash with standard accounts. After chewing over your verdicts, I propose this principle as an attempt to capture their essence:

  **Survival requires the causal propagation of one's core psychological pattern through a minimally disrupted physical process, where 'minimally disrupted' means no irreversible cessation of biological function occurs, and any transfer maintains the original pattern's causal priority.**

  Now, let's dissect this clause by clause, showing how it maps to your cases and where it might pinch:

  1.  **"Causal propagation of one's core psychological pattern"**: This handles your acceptance of *pattern* as crucial (Cases 1, 3, potentially 6 if other conditions weren't violated). It avoids relying solely on information preservation (rejecting Case 6 as survival).

  2.  **"...through a minimally disrupted physical process"**: This addresses the *physical continuity* intuition anchoring Cases 3 (slow replacement) and 5 (dementia). The physical brain/body provides the substrate for the causal chain, even if the psychological pattern degrades (Case 5) or the substrate changes gradually (Case 3). It also explains the *difference* between Case 1 and Case 6: the teletransporter maintains a *process* (scanning *while* disintegrating, arguably linking the states causally in near-real-time), while the reconstruction happens *after* the original process has *irreversibly ceased* (biological death).

  3.  **"...where 'minimally disrupted' means no irreversible cessation of biological function occurs"**: This explicitly rules out Case 6 as survival – the biological death is the ultimate disruption. It also helps anchor Case 5: despite dementia, biological function (breathing, circulation, basic neural activity supporting *some* consciousness) continued minimally disrupted. This is the clause stretching "causal process" for Case 5 – it's the *biological life process* persisting that matters, even if the specific psychological pattern fades.

  4.  **"...and any transfer maintains the original pattern's causal priority"**: This tackles duplication (Case 2) and your unease with fast replacement (Case 4).
      *   **Case 2:** The original Earth body maintains the causal priority – it's the *source* of the scan and continues the physical/psychological process uninterrupted. The Mars copy is causally downstream and lacks priority. Hence, Earth-you wins the bank account.
      *   **Case 4 (The Annoying Unease):** This is the trickiest. Under general anaesthesia, consciousness *is* interrupted. While brief, this creates a *potential* break in the causal chain of subjective experience. Crucially, the *speed* of the replacement under anaesthesia feels psychologically akin to *destruction and replacement* (like the destructive teleporter *without* the transfer happening first) rather than gradual continuity. The "causal priority" clause gets strained here. The principle *should* say you survive (the physical process is minimally disrupted, biological function continues, the pattern resumes in the same body). But your gut flags the *perceived risk* – the speed makes the *subjective continuity of consciousness* feel broken, even if objectively it resumes. The principle struggles to fully capture this *phenomenological* anxiety, as it focuses on the objective causal/physical chain. It *predicts* survival but admits your discomfort arises because the *speed simulates a break* that triggers your duplication/death intuition.

  **Where the Principle Overturns/Clashes with Your Verdicts (Slightly):**

  *   **Case 4:** The principle clearly says you *should* survive (minimally disrupted physical process, same body, pattern resumes). Your sharp drop in confidence is noted, but the principle attributes it to a misleading *feeling* caused by speed/anaesthesia mimicking destruction, rather than a true failure of survival. **It asks you to override your gut unease here as irrational within its framework.**
  *   **Case 5:** While affirming survival, the principle does so by leaning heavily on the *biological continuity* ("minimally disrupted physical process") rather than the psychological pattern. This might feel like a slight stretch, but it honours your core verdict that *she* survived.

  **Predictions for New Cases:**

  *   **(a) Non-destructive Scan, Earth Body Destroyed Accidentally 1 Hour Later:** Gut says: the Mars copy *is* you now. The principle says: **Survival.** Why? The causal propagation happened (scanning created a replica causally dependent on the original pattern). Crucially, the *irreversible cessation* happened *after* the transfer was complete and *before* the copy diverged significantly. The original pattern's causal priority *transferred* to the copy because the original physical process ceased *after* creating the viable continuation point. The copy inherits the causal mantle by default. (This aligns with many intuitions about "if the original is destroyed, the copy *becomes* me").
  *   **(b) Branching with Delayed Destruction:** Gut says: Deeply uncomfortable, but likely feels like *both* are you initially, leading to fission anxiety. The principle says: **Survival occurs for the Earth body only until destruction; the Mars copy is initially a branch but not the original 'you'.** Why? During the week, the Earth body maintains causal priority – it's the continuous physical process and source of the scan. The Mars copy is causally downstream. When the Earth body is destroyed, *that specific causal chain ends*. The Mars copy continues, but it's a *new* entity that branched off a week ago. It is psychologically identical and causally descended from you, but lacks the *priority* of the original chain *after* the fission point. You (the original chain) ceased when the Earth body was destroyed. The copy survives, but it's not *you* in the strictest sense; it's your identical descendant/branch. Your *survival* ended with the Earth body's destruction. (This is Parfitian "survival*" but not identity).

  **Conclusion:**

  This principle – **causal propagation via minimally disrupted physical process, no irreversible cessation, and causal priority** – captures most of your verdicts well, especially the rejection of duplication-as-identity (2), revival-after-death (6), and the anchoring in bodily continuity (5, 3). It explains the difference between 1 and 6 via "irreversible cessation." It handles duplication scenarios (2, b) via "causal priority."

  The main friction is Case 4 (fast replacement under anaesthesia). The principle demands you *do* survive and asks you to view your unease as a psychological glitch triggered by the simulation of destruction. Case 5 relies heavily on biological continuity over psychology. For scenario (a), it grants survival to the copy post-original-destruction; for (b), it denies survival to the original after fission+destruction, viewing the copy as a successor.

  It's not perfectly elegant, but it honours the biological anchor, the rejection of resurrection, the problem of duplication, and the intuition that *how* the process happens matters (speed, cessation). The unease in Case 4 and the potential "successor" status in (b) are the points where philosophy meets the hard edge of subjective fear. Does this feel like it captures the gist, even with its wrinkles?
