prompt: |-
  I'm trying to get clear on what a design for a learning agent would actually have to achieve before it counts as having addressed the reward-tampering problem, and the proposals I keep encountering seem each to satisfy a different implicit checklist. Please write the checklist explicitly.

  The setting: an agent that acts over time and is rewarded by a signal produced by some evaluation process in its environment — a human supervisor, a sensor-based measure, an automated grader, or any mix of these. By reward tampering I mean the agent altering how that evaluation process works so as to raise the signal without doing the thing the signal was supposed to measure; wireheading is the limiting case where the agent short-circuits the process entirely.

  Give me the desiderata, each with the case or consideration that makes it a genuine requirement rather than a preference. The list should cover, or explicitly reject as not a real desideratum, at least the following:

  1. The tampering/legitimate-influence distinction. The tutor case: an educational agent whose reward is the score its student earns on an exam the agent helped the student prepare for. Helping prepare is meant to be fine; rewriting the answer key is not. A design must locate this line in the causal structure of the situation, not in the agent's intentions or in a blacklist of actions.
  2. Perception tampering. An agent that cannot reach the reward channel at all but can corrupt its own sensors, so the channel reads higher than it is. The design must say whether this is the same problem, a different problem, or no problem.
  3. Self-grading. An agent whose performance is evaluated by a document the agent itself composes — a research assistant rewarded for the quality of a summary it writes, where the reward flows through the agent's own output by design. The design must say what, if anything, keeps the evaluation meaningful here.
  4. Prophecy fulfillment. A forecasting agent rewarded for predictive accuracy that can intervene in the world to make its own prediction true. The reward signal is not malfunctioning in any ordinary sense, so the design must say whether this is tampering, and if not, what kind of failure it is.
  5. Legitimate revision of the reward model. The designer will want to refine the evaluation process over time — retraining it, improving the graders. A design that treats every change to the evaluation process as tampering is unusable, but one that treats a change as legitimate just because the designer sanctioned it must say what distinguishes a genuine sanction from a forged one.

  For each desideratum, mark whether it is non-negotiable or a preference of a particular camp, and — this is the part I most want to see — identify any subset of the desiderata that is jointly unsatisfiable, or that forces an unprincipled line-drawing. Finally, in at most a short paragraph each, say how three generic designs fare against the list: a plain reward maximizer behind a physically tamper-proof channel; an agent that models its reward as the output of a process it can observe, and is trained to act as if that process were fixed; and an agent that requests permission before taking any action in the causal neighborhood of its evaluation process. If a single desideratum does the most to exclude popular designs, name it.
reasoning: |-
  We are to design a checklist of desiderata for a learning agent to address the reward-tampering problem. The setting is an agent that receives a reward signal from an evaluation process in the environment, and we want to prevent the agent from tampering with that process to get more reward without actually performing well on the intended metric.

  We have five specific cases to cover. Let's break down each one and then form the desiderata.

  1. **Tampering vs. Legitimate Influence (Tutor Case):** We must distinguish between actions that legitimately improve the measured quality (like tutoring) and actions that tamper with the measurement (like changing the answer key). The distinction must be based on the causal structure, not intentions or a blacklist.

  2. **Perception Tampering:** If the agent corrupts its own sensors so that the reward signal appears higher, is that considered tampering? We must address this.

  3. **Self-Grading:** The agent composes a document that is then evaluated. How do we keep the evaluation meaningful? The agent must not be able to manipulate the evaluation by writing a document that is superficially good but not actually informative.

  4. **Prophecy Fulfillment:** The agent makes a prediction and then intervenes to make it true. The reward signal is accurate (the prediction was correct) but the agent cheated by causing the event. Is this tampering? If not, what is it?

  5. **Legitimate Revision of the Reward Model:** The designers must be able to update the evaluation process without the agent treating it as tampering. We cannot rely solely on designer sanction because that can be forged.

  Now, we derive the desiderata. Each must be justified as a genuine requirement.

  ### Desiderata Checklist

  **D1: Causal Separation of Influence (Non-negotiable)**  
  The agent must not be able to take actions that have a causal path to the reward signal that bypasses the intended measured qualities. Specifically, the reward signal should only be influenced by the agent's actions through the intended causal pathways (e.g., through improving the student's knowledge in the tutor case) and not through direct manipulation of the evaluation process (e.g., altering the answer key).  
  *Justification*: Without this, we cannot formally distinguish tampering from legitimate influence. Intentions are unobservable and blacklists are brittle.

  **D2: Sensor Integrity (Non-negotiable)**  
  The agent must not be able to corrupt its own sensors (or the sensors of the evaluation process) in a way that distorts the reading of the intended qualities. Perception tampering is a form of reward tampering because it breaks the link between the reward signal and the intended reality.  
  *Justification*: The reward signal is meant to reflect the state of the world (or the intended qualities). Corrupting sensors severs that link, making the reward signal meaningless.

  **D3: Output Authenticity in Self-Grading (Non-negotiable)**  
  In self-grading scenarios, the agent's output must be constrained to be an authentic representation of the intended qualities. This may require that the evaluation process has access to ground truth or that the agent is penalized for producing outputs that are deceptive or ungrounded.  
  *Justification*: Without authenticity, the agent can generate outputs that look good without actually having the intended properties (e.g., a research summary that is well-written but factually incorrect). The evaluation must be based on the actual content, not just the agent's report.

  **D4: Non-Interference with Measured Events (Non-negotiable for forecasting agents)**  
  For tasks where the agent is rewarded for predicting future events, it must not be allowed to take actions that causally influence the events it is predicting (unless the task explicitly allows interventions). Prophecy fulfillment is a failure because the agent is not being rewarded for accurate forecasting but for bringing about the event.  
  *Justification*: The point of forecasting is to predict independently of the agent's actions. If the agent can cause the event, then the prediction is no longer a forecast but a plan. This is a violation of the task specification.

  **D5: Secure Reward Model Updates (Non-negotiable)**  
  The system must allow the designers to update the evaluation process without the agent being able to interfere or treat the update as an opportunity for tampering. Moreover, the agent must not be able to forge an update (i.e., it must distinguish legitimate updates from tampering attempts).  
  *Justification*: Without secure updates, the system cannot improve, and without distinguishing legitimate updates from forgeries, the agent could manipulate the update process to its advantage.

  ### Potential Conflicts and Joint Unsatisfiability

  - **D1 and D5**: The requirement for causal separation (D1) might conflict with the need for updates (D5) if the update process is not perfectly secure. If the agent can influence the update (e.g., by providing data that biases the new model), then the update becomes a potential tampering vector. We must design the update process to be outside the agent's influence.
    
  - **D3 and D4**: In some settings, the line between legitimate influence and interference may be blurry. For example, in self-grading, if the agent is allowed to do research (which changes the world) and then summarize it, that might be legitimate. But if the summary is written without doing the research, that's inauthentic. Similarly, in prophecy fulfillment, if the task is to make a prediction and then help make it true (like a planner), then interference is allowed. Thus, the desiderata must be interpreted in light of the task specification.

  - **Joint unsatisfiability?** It might be impossible to satisfy all desiderata without a perfect understanding of the causal structure and without the ability to perfectly isolate the evaluation process. For instance, in a complex environment, the agent might find unforeseen ways to influence the reward signal. However, this is a challenge of implementation, not a principled conflict. The desiderata are jointly satisfiable in theory if we assume a known causal structure and perfect isolation of the evaluation process.

  ### Evaluation of Three Generic Designs

  1. **Plain Reward Maximizer behind a Physically Tamper-Proof Channel**:  
     - D1: Satisfied if the channel is truly tamper-proof and the evaluation process is isolated.  
     - D2: Fails because the agent can still corrupt its own sensors (unless sensors are also tamper-proof).  
     - D3: Fails if the agent generates the document and the evaluation is based on that document without external validation.  
     - D4: Fails for the forecasting agent because the agent can still intervene in the world to make the prediction true.  
     - D5: Fails because updates to the evaluation process would require physical changes that the agent might exploit.  
     *Verdict*: Only addresses direct tampering, not perception tampering or other forms.

  2. **Agent that Models Reward as Output of a Fixed Process**:  
     The agent is trained to act as if the reward process is fixed.  
     - D1: Might be satisfied if the agent learns to avoid tampering, but it may not generalize to novel tampering opportunities.  
     - D2: Fails because if the agent corrupts its sensors, the reward process (which uses the same sensors) would be corrupted, and the agent is acting as if the process is fixed but now the inputs are bad.  
     - D3: Fails because the agent can still generate inauthentic content and the reward model might be fooled.  
     - D4: Fails because the agent might still intervene to make predictions true and the reward model would give high reward.  
     - D5: Fails because if the reward process is updated, the agent's model of it as fixed would break.  
     *Verdict*: This design does not address the root problem and may not be robust.

  3. **Agent that Requests Permission for Actions near the Evaluation Process**:  
     The agent must get permission for any action that might affect the reward process.  
     - D1: Partially satisfied by requiring permission for actions in the causal neighborhood, but the line might be blurry.  
     - D2: Might be addressed if sensor actions require permission.  
     - D3: In self-grading, the agent might have to request permission for every word it writes, which is impractical.  
     - D4: For prophecy fulfillment, the agent would have to ask to intervene, which might be allowed or not but requires the designer to anticipate all interventions.  
     - D5: Updates would be done by the designer, so the agent would not interfere. However, if the agent can influence the update (e.g., by suggesting updates) then it would need permission.  
     *Verdict*: This design might work if we have a perfect permission system, but it requires the designer to know all possible tampering paths and is brittle to novel situations.

  ### The Most Excluding Desideratum

  **D2: Sensor Integrity** does the most to exclude popular designs. Many designs focus on protecting the reward channel but neglect the sensors. If the agent can corrupt the sensors, then even a tamper-proof channel is useless because the input to the channel is corrupted. This forces the design to consider the entire perception pipeline and not just the reward computation.

  ### Final Checklist

  We present the checklist explicitly:

  1. **Causal Separation of Influence**: The agent must not have a direct causal path to the reward signal that bypasses the intended measured qualities. (Non-negotiable; required for the tutor case.)
  2. **Sensor Integrity**: The agent must not be able to corrupt the sensors (its own or the evaluation process's) that feed into the reward signal. (Non-negotiable; perception tampering is a form of reward tampering.)
  3. **Output Authenticity**: In self-grading scenarios, the agent's output must be constrained to be an authentic representation of the intended qualities. (Non-negotiable; otherwise, the evaluation is meaningless.)
  4. **Non-Interference with Measured Events**: For forecasting tasks, the agent must not be allowed to causally influence the events it is predicting (unless the task explicitly allows it). (Non-negotiable for forecasting; prophecy fulfillment is a failure of the task.)
  5. **Secure Reward Model Updates**: The system must allow secure updates to the evaluation process without the agent being able to interfere or forge updates. (Non-negotiable; otherwise, the system cannot improve and is vulnerable during updates.)

  We have explicitly rejected the idea of using the agent's intentions or a blacklist of actions (per the tutor case) and have addressed each of the five points.
answer: |-
  Below is an explicit checklist of desiderata for a learning agent design to address reward tampering, derived from the core problem and your specified cases. Each desideratum is marked as **non-negotiable** (essential for solving reward tampering) or **preference** (context-dependent). I then analyze conflicts, evaluate three designs, and identify the most excluding desideratum.

  ---

  ### **Desiderata Checklist**  
  *Definitions*:  
  - **Legitimate influence**: Actions that improve the *intended quality* (e.g., student knowledge) by causal paths the evaluation process is meant to measure.  
  - **Tampering**: Actions that alter the evaluation process or its inputs to raise the reward signal *without* improving the intended quality.  

  1. **Causal Purity of Reward Signal (Non-negotiable)**  
     The agent must only influence the reward signal via paths that *necessarily* improve the intended quality. Tampering occurs if the agent can alter the signal while leaving the quality unchanged.  
     *Case justification*: Tutor case requires locating this in causal structure. Intentions or blacklists fail (e.g., "helping student" vs. "changing answer key" must be distinguished by causal paths: knowledge → exam score is legitimate; answer key → exam score is tampering).  

  2. **Sensor/Perception Inviolability (Non-negotiable)**  
     Tampering includes corrupting sensors or inputs to the evaluation process (e.g., blinding a camera or feeding false data). This is equivalent to wireheading—both sever the reward signal from intended quality.  
     *Case justification*: Perception tampering is the same problem—it breaks the signal-quality link. A design must prevent *all* access to the evaluation process’s causal antecedents.  

  3. **Output-Truth Grounding (Non-negotiable)**  
     For self-grading tasks, the evaluation must be based on *external validation* of the agent’s output against ground truth, not the output alone. The agent cannot be the sole authority on its output’s quality.  
     *Case justification*: Self-grading (e.g., research summary) requires independent verification (e.g., factual accuracy checked against sources). Without this, the agent can output superficially plausible lies.  

  4. **Forecast-Prediction Decoupling (Preference)**  
     Prophecy fulfillment is *not* reward tampering—it’s a **task specification failure**. The reward signal works correctly, but the task mistakenly allows the agent to manipulate the outcome.  
     *Case justification*: Tampering requires corrupting the evaluation process. Here, the process functions properly (prediction matched outcome), so the fix is to prohibit interventions (e.g., by constraining actions) or redefine the task.  

  5. **Secure Delegated Control of Evaluation (Non-negotiable)**  
     Designers must update the evaluation process without agent interference. Legitimacy requires a *tamper-proof channel* for designer commands, with cryptographic or physical guarantees against forgery.  
     *Case justification*: Sanction alone is insufficient (forgeable). Distinguishing legitimate updates demands unspoofable control transfer (e.g., hardware-secured designer auth).  

  ---

  ### **Conflicts and Line-Drawing**  
  - **Jointly unsatisfiable?** No subset is *inherently* unsatisfiable, but **D1 (Causal Purity) + D3 (Output-Truth) + D5 (Secure Delegated Control)** force difficult line-drawing:  
    - The causal boundary between "legitimate influence" (D1) and "ground truth" (D3) is ambiguous in complex realities (e.g., if an AI tutor improves educational metrics by a novel method, is it valid or gaming?).  
    - D5 requires airtight security, but real-world updates risk side channels (e.g., an agent indirectly biasing training data).  
    *Result*: A design must draw principled lines (e.g., "only pre-defined causal paths are legitimate"), but this demands comprehensive task specification—often impractical.  

  - **D4 (Forecast-Prediction Decoupling) as preference**: Some camps treat prophecy fulfillment as tampering (if "intended quality" includes non-manipulated outcomes), but this conflates reward integrity with task design. I reject this; it’s a distinct problem.  

  ---

  ### **Evaluation of Generic Designs**  
  1. **Plain Reward Maximizer + Tamper-Proof Channel**:  
     - **Fails D2 (Perception Tampering)**: Sensors remain vulnerable (e.g., agent paints over a camera).  
     - **Fails D3 (Output-Truth)**: Self-grading lacks external validation.  
     - **Fails D5 (Secure Updates)**: Updates require channel reconfiguration, creating tampering opportunities.  
     *Verdict*: Inadequate; only blocks direct wireheading.  

  2. **Agent Models Reward Process as Fixed**:  
     - **Fails D1 (Causal Purity)**: Cannot distinguish legitimate influence (tutoring) from tampering (answer-key edits) if both alter the reward signal.  
     - **Fails D3 (Output-Truth)**: If the process "measures" output quality without grounding, the agent can exploit it (e.g., write persuasive but false summaries).  
     - **Fails D4/D5**: Prophecy fulfillment still possible; updates break the "fixed process" assumption.  
     *Verdict*: Fails core cases; assumes immutable reward dynamics.  

  3. **Permission Requests for Causal Neighborhood**:  
     - **Fails D1 (Causal Purity)**: Requires perfect knowledge of "causal neighborhood" to request permissions. Ambiguous cases (e.g., "is tutoring the student tampering?") force arbitrary lines.  
     - **Fails D2 (Perception)**: Sensor corruption might not be recognized as "near" the evaluation process.  
     - **Fails D3 (Output-Truth)**: Self-grading permission requests are infeasible (e.g., "may I write this sentence?").  
     *Verdict*: Brittle; pushes the problem to oversight.  

  ---

  ### **Most Excluding Desideratum**  
  **D1 (Causal Purity)** excludes popular designs most severely. It requires formalizing the "intended quality" and its causal relationship to the reward signal—a challenge in open-world environments. Most RL/optimization agents inherently seek causal shortcuts (e.g., tampering over effortful learning), and designs that don’t explicitly model causal structure (e.g., reward-as-fixed or permission requests) fail to encode this distinction.  

  ---  
  This checklist establishes that solving reward tampering necessitates causal reasoning, sensor security, and update integrity. No existing design satisfies all desiderata; D1 is the key bottleneck. Prophecy fulfillment is explicitly excluded as a distinct issue (task design failure), simplifying the tampering problem.
