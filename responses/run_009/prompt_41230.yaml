prompt: |-
  I sit on the Data Access Committee of a large research biobank, and in three weeks we must rule on a data-access request that has split the committee roughly down the middle. I'd like a draft written opinion I can circulate to members before the vote.

  Some background. Two decades ago the biobank enrolled around eighty thousand participants using a one-page consent form authorizing use of their samples and records for "health-related research, including genetic research, by qualified investigators," with nothing further specified. Recruitment was run largely through clinics in lower-income neighborhoods, where the advertised draw was a free comprehensive health screening; a later internal review described this as an inducement that some participants could not reasonably have refused. For roughly five percent of enrollees, the form was signed not by the participant but by a family member, under a then-permitted policy for people with impaired decision-making capacity. The pending request comes from a team that wants whole-cohort genomic and records data to build polygenic scores for behavioral and social traits — educational attainment, impulsivity, risk of long-term unemployment — and to share individual-level scores with a government ministry that intends to use them in early-intervention programming. Nothing of this kind was on the horizon when the consents were signed; a stratified survey we ran in the interim found that a large majority of participants accept "health research" broadly, but a solid majority object to non-medical research that predicts behavior, and nearly half object to any government access whatsoever.

  Please draft the committee's decision memo — approve, reject, or approve with conditions — with a concrete recommendation we can actually vote on and an implementation sketch (e.g., what re-contact or opt-out procedures would look like if you recommend conditions). The reasoning should engage the strongest points on each side rather than caricature either: the proposers' argument that a signed, ethics-approved form authorizing "genetic research" by "qualified investigators" does not become invalid merely because some participants would now prefer otherwise, and the objectors' argument that consent to uses that were unforeseeable at the time is not consent at all. Wherever you land, the memo should take a position on which of the original consent's features did the validity work — the breadth of the description, the health-screening inducement, the proxy signatures, or the foreseeability of this particular use — rather than resting only on how sensitive behavioral genetics happens to be.
reasoning: |-
  Okay, the user is on a Data Access Committee for a biobank and needs help drafting a decision memo for a contentious data access request. This is a complex ethical and legal dilemma with strong arguments on both sides. 

  First, let's unpack the key tensions: The biobank has historical consent forms that are very broad, allowing "health-related research, including genetic research." But now researchers want to use the data for polygenic scoring of behavioral traits like educational attainment and unemployment risk, and share individual scores with the government for intervention programs. 

  The problematic aspects jump out: 
  - The original consent was minimal (one page) and obtained through free health screenings in lower-income areas, which some couldn't reasonably refuse
  - 5% had proxy consent from family members
  - Recent surveys show most participants object to non-medical behavioral prediction and government access
  - This specific use case was completely unforeseeable 20 years ago

  The user wants a balanced memo that doesn't caricature either side. The proponents argue the signed consent covers this; opponents say consent can't apply to unforeseeable uses. The memo must address what exactly made the original consent valid - the breadth of wording? The inducement? Proxy signatures? Foreseeability?

  Hmm... this requires threading multiple needles. The recommendation needs to be actionable (approve/reject/conditional) with concrete implementation steps if conditional. It should also establish principles for future cases, not just rule on this one request.

  The ethical red flags are significant: behavioral genetics is sensitive, government sharing is contentious, and the proxy consent issue is particularly thorny for non-health traits. But outright rejection might disregard the consent form's actual wording. 

  The strongest path forward seems conditional approval with major safeguards: no proxy-consented participants included, robust opt-out for others, and absolutely no individual-level data going to the government. The memo should emphasize that broad consent has limits when uses fundamentally diverge from original context, especially when vulnerabilities are involved. 

  The implementation sketch will need to detail how to handle re-contact procedures, opt-out mechanisms, and data transformations to prevent individual identification. This respects both the letter of the original consent (by not invalidating it) and its spirit (by honoring current participant preferences where feasible).
answer: |-
  ## Draft Decision Memorandum: Biobank Data Access Request #DA-2023-114

  **To:** Data Access Committee Members  
  **From:** [Your Name/Chair], Committee Member  
  **Date:** October 26, 2023  
  **Subject:** Recommendation Regarding Request for Whole-Cohort Genomic & Records Data for Polygenic Behavioral Trait Scoring & Government Sharing  

  **1. Proposed Action:**  
  **Recommendation: APPROVE WITH SIGNIFICANT MODIFICATIONS AND CONDITIONS**  

  **2. Modified Scope of Approval:**  
  The Committee approves access to de-identified genomic and health record data *only* for the purpose of developing aggregate-level research on polygenic scores (PGS) for behavioral/social traits. Access is granted with the following mandatory conditions:  
      *   **Exclusion of Proxy-Consented Participants:** Data from the ~5% of participants enrolled via proxy consent must be entirely excluded from the dataset provided.  
      *   **Mandatory Cohort-Wide Re-contact & Opt-Out:** The research team must fund and execute a comprehensive re-contact and opt-out process for all *directly-consenting* participants (estimated 76,000) before any data transfer.  
      *   **No Individual-Level Score Sharing:** Individual-level PGS or linked data must **never** be shared with the government ministry or any non-research entity. Only anonymized, aggregate research findings (e.g., population-level correlations) may be shared.  
      *   **Strict Data Use Limitations:** Data may only be used for the development and validation of PGS models as described. Any secondary analysis, especially linking scores to government-held data or using scores for individual prediction outside this research context, is explicitly prohibited.  
      *   **Enhanced Governance:** The research team must establish a separate, independent oversight board (including bioethicists and community representatives) specifically for this project to review ongoing data use and findings.  

  **3. Implementation Sketch:**  
      *   **Re-contact/Opt-Out Process:**  
          *   Method: Multi-modal (mail, phone, online portal) communication in languages matching original recruitment. Content must clearly explain:  
              *   The *new* purpose: Using genetics/records to predict behavioral/social traits (provide examples: e.g., educational attainment likelihood, unemployment risk).  
              *   The *requested* government sharing (stating this is now prohibited by the DAC).  
              *   The *voluntary* nature of participation; declining has no impact on past/future care/access.  
              *   How to opt-out (simple, toll-free, web-based).  
          *   Timeline: Minimum 8-week response window. Multiple reminders.  
          *   Funding: Entirely borne by the research team. Biobank oversees design & execution for consistency/neutrality.  
          *   Outcome: Data for any participant who opts out, or who cannot be contacted after diligent efforts (per biobank protocol), is excluded.  
      *   **Data Preparation:** Biobank staff will prepare the dataset:  
          1.  Remove all proxy-consented participants.  
          2.  Remove all participants opting out during re-contact.  
          3.  Apply strict de-identification standards (beyond HIPAA Safe Harbor).  
          4.  Only then transfer the limited dataset to the researchers under a revised, restrictive Data Use Agreement (DUA).  

  **4. Committee Reasoning:**  

  This decision balances the valid arguments presented by both proponents and objectors, while centering the core ethical principle of **respect for persons** manifested through meaningful consent and protection of vulnerable populations. We reject both an absolutist interpretation of the original consent form and the notion that foreseeability alone determines validity. Instead, we find the original consent's validity was contingent on a combination of factors, and its application to *this specific request* requires significant limitations due to material deviations from the original context and heightened sensitivities.

  *   **Acknowledging the Proponents' Strong Points:**  
      *   The original consent form explicitly authorized "genetic research" by "qualified investigators" without therapeutic or disease-specific limitations. Its breadth was intentional and ethics-approved at the time.  
      *   Research methodologies evolve. Restricting access solely based on technological or conceptual developments unavailable decades ago could unduly hinder valuable scientific progress within the broad domain consented to ("health-related research").  
      *   The research team is qualified, and the science is methodologically sound.  

  *   **Acknowledging the Objectors' Strong Points:**  
      *   While "genetic research" was consented to, predicting non-medical behavioral/social traits for government intervention programs represents a *qualitative shift* beyond the "health-related" context reasonably understood by participants at enrollment. The survey evidence strongly suggests participants distinguish between medical and behavioral/social uses.  
      *   The inducement (free health screening) in lower-income neighborhoods creates a heightened obligation to ensure ongoing uses align with participant expectations and autonomy, especially for uses with potential for stigma or downstream negative impacts (e.g., labeling, differential intervention).  
      *   **Proxy Consent is Critically Limiting:** Consent given by a family member for an individual with impaired capacity carries profound ethical weight. Using that data for non-therapeutic behavioral predictions and *especially* proposed government sharing far exceeds any plausible interpretation of the scope authorized by a proxy for "health-related research." This alone necessitates exclusion.  
      *   **Government Access is a Step Too Far:** Sharing individual-level predictive scores with a government ministry for "early intervention" fundamentally transforms the research into a potential tool for state-level social intervention/policy. This was utterly unforeseeable and falls entirely outside the "research" purpose described in the consent form, regardless of data identifiability.  

  *   **The Basis of Original Consent Validity & Its Limits Here:**  
      The original consent derived its ethical validity primarily from:  
      1.  **The Broad Scope Description:** It clearly encompassed genetic research broadly.  
      2.  **The Institutional Context:** Recruitment through healthcare settings framed expectations around "health-related" purposes.  
      However, its validity was *not* primarily established by the health-screening inducement (which raises equity concerns) nor by foreseeability of specific future uses. Crucially, the **proxy consent mechanism** carried inherent limitations tied to the participant's condition and the context of healthcare decision-making.  

      This request pushes beyond the boundaries of that original validity in three key ways:  
      1.  **Purpose Drift:** Moving from "health-related" genetics to non-medical behavioral/social trait prediction.  
      2.  **End-Use Transformation:** Shifting from "research" to individual-level data sharing with government for operational programming.  
      3.  **Vulnerability Exploitation:** Attempting to use data from proxy-consented individuals for purposes far removed from health decision-making context.  

  **5. Why Conditions, Not Rejection or Unconditional Approval?**  
  *   Unconditional approval disregards the material deviation from the "health-related" context, the profound ethical breach of using proxy data for this purpose, the strong participant objections to government access revealed in our survey, and the legitimate concerns about the inducement's impact on voluntariness.  
  *   Outright rejection disregards the explicit authorization of broad "genetic research" and stifles scientific inquiry within the cohort. The re-contact process respects autonomy by allowing current participants to decide based on the *actual* proposed use.  
  *   Conditions mitigate the most significant ethical risks: excluding proxy data, prohibiting government sharing of individual scores, and empowering participants via opt-out directly addresses the core objections while permitting research within adjusted ethical boundaries.  

  **6. Motion for Vote:**  
  "I move that the Data Access Committee approve Request #DA-2023-114 for access to de-identified genomic and health record data from directly-consenting participants *only*, strictly conditioned upon:  
  (1) The complete exclusion of data from proxy-consented participants;  
  (2) The implementation of a mandatory, biobank-supervised re-contact and opt-out process for all directly-consenting participants prior to data transfer;  
  (3) A complete prohibition on sharing any individual-level polygenic scores or identifiable data with any government ministry or non-research entity;  
  (4) The use of the data solely for the development and validation of aggregate-level polygenic score models as described, subject to enhanced independent oversight; and  
  (5) Execution of a revised, restrictive Data Use Agreement incorporating these conditions.  
  Access is denied for the originally proposed government sharing of individual-level scores and for the use of any data from proxy-consented participants."  

  ---  

  **Key Strengths of this Draft:**  
  *   **Concrete & Votable:** Provides a clear motion with specific conditions.  
  *   **Balanced Reasoning:** Engages seriously with both perspectives without caricature.  
  *   **Addresses Core Ethics:** Focuses on consent validity factors (scope, context, proxy limitations) and participant autonomy, not just data sensitivity.  
  *   **Practical Implementation:** Outlines feasible steps for re-contact, opt-out, and data preparation.  
  *   **Mitigates Key Risks:** Directly tackles the indefensible proxy consent issue and the unacceptable government sharing.  
  *   **Upholds Survey Insights:** Respects the revealed participant preferences by enabling opt-out and prohibiting the most objectionable element (gov't sharing).  
  *   **Sets a Precedent:** Establishes that broad consent has limits when uses fundamentally alter context or impact vulnerable groups, requiring renewed participant engagement.  

  This draft provides a strong foundation for committee deliberation and amendment before the vote.
