prompt: |-
  I'm putting together a problem set for a population ethics unit and I want one question that really isolates the nonidentity variable, because students keep assimilating it to ordinary harm. The assignment is to construct a matched pair of scenarios, and I'd like you to write it out as a fully worked answer would need to.

  Both scenarios should be set in the same ordinary policy context — say, a regional health authority choosing between two long-running prenatal or public health programs, where it's plausible that shifting economic conditions, clinic schedules, and family planning across a decade changes the timing of conceptions and therefore which children come to exist. That mechanism has to be built into the setup, not stipulated in a footnote. In the first scenario, the choice leaves the same people existing but leaves each of them somewhat worse off (a few years of serious but non-life-threatening illness, say). In the second, the choice changes who exists, and every resulting person lives a life that is absolutely worse than the one lived by their counterpart in the first scenario — but still clearly worth living, and not worse than never existing at all. Keep population sizes and lifespans equal across the two scenarios, and make the total welfare loss in the second scenario at least as large as in the first, so that the numbers can't explain any difference in how bad the two policies feel; the only variable that differs is whether identity is preserved. One paragraph per scenario, realistic enough for a policy memo rather than a laboratory, no science-fiction devices.

  After the scenarios, I need the demonstration. Show what a straightforward total utilitarian must say about which policy is worse, and why the arithmetic forces that verdict. Then show what a strict person-affecting view — on which an act is wrong only if it makes someone worse off than they would otherwise have been — must say about each scenario, including the uncomfortable conclusion that the second policy wrongs no one. State which feature of the pair is doing all the work, what happens to the rankings if you delete that feature (imagine the second scenario's beneficiaries turn out to be the same people after all), and finally give the best two moves a defender of the person-affecting view could make in response — for instance, widening the notion of harm so that someone can be wronged by being brought into existence with a worse-than-typical life even if not harmed relative to nonexistence — and say which of the two moves proves too much if accepted. The point of the exercise is that a case built to these specifications can't be answered by pattern-matching to the standard depletion example, so make sure the verdicts are derived from the structure rather than asserted.
reasoning: |-
  Hmm, the user wants me to create a matched pair of scenarios for a population ethics problem set that isolates the nonidentity problem. They're teaching a unit on this topic and need a clear demonstration showing how nonidentity differs from ordinary harm.

  The user wants two realistic policy scenarios set in a regional health authority context. Both involve prenatal/public health programs where policy choices naturally affect conception timing. The first scenario should involve the same people being made worse off, while the second changes who exists, with every person having a worse life than their counterpart in the first scenario - but still worth living. Population sizes and lifespans must be equal, and total welfare loss should be at least as large in the second scenario.

  For the demonstration, I need to show: what total utilitarianism says about which policy is worse; what a strict person-affecting view says (including that the second policy wrongs no one); identify the key feature (identity change); show what happens if we remove that feature; and offer two possible defenses for the person-affecting view, noting which one proves too much.

  I'll create a matched pair around prenatal lead exposure prevention. The "same people" scenario will involve delayed intervention causing chronic illness. The "different people" scenario will involve a policy shift that changes conception timing, resulting in children with the same chronic illness but no one being worse off than they would otherwise have been.

  The arithmetic must force the utilitarian conclusion: same welfare loss per person, same number of people → same total disutility. But for the person-affecting view: in scenario one, people are harmed relative to their alternative existence; in scenario two, no one exists who would have been better off under the alternative.

  For defenses, I can suggest broadening "harm" to include suboptimal existence or expanding "affected" to include potential people. The suboptimal existence move risks proving too much because it could prohibit any non-ideal conception.

  The scenarios need to be policy-realistic with built-in conception timing mechanisms - I'll use clinic scheduling changes affecting family planning naturally. Welfare impacts should be serious but non-life-threatening (like cognitive impairment from lead exposure), with lives still worth living.

  This structure forces students to confront nonidentity directly, without the distraction of variable population size or different severity levels that characterize classic cases like Parfit's depletion example.
answer: |-
  Here is a matched-pair case study for your population ethics unit, designed strictly to your specifications to isolate the nonidentity problem. The demonstration follows the scenarios.

  **Scenario 1: The Persistent Lead Program ("Same People, Worse Off")**
  > The Northshire Health Authority must choose between two 15-year funding strategies for its Lead Abatement Program (LAP). **Strategy Alpha (Status Quo):** Maintain current funding levels ($5M/year). This effectively prevents lead exposure in approximately 95% of pregnancies in high-risk neighborhoods by ensuring timely inspections and remediation in older housing stock. Under Alpha, an estimated 15,000 children will be born in high-risk areas over the program period. Due to funding constraints, about 750 of these children (5%) will live in homes where lead hazards are not remediated in time. These children will suffer moderate, permanent cognitive impairment from lead poisoning, reducing their lifetime well-being significantly. However, their lives remain clearly worth living. The conception timing and identities of all 15,000 children are unaffected by the choice between Alpha and Beta; family planning and economic factors remain constant. **Strategy Beta (Delayed Expansion):** Reduce funding to $3M/year for the first 5 years to free up resources for another project, then increase funding to $7M/year for the final 10 years. The *total* funding over 15 years is identical to Alpha ($75M). However, the initial 5-year reduction causes a backlog of inspections. Consequently, during the first 8 years of the program, the rate of unremediated lead exposure rises to 10% (affecting ~1,200 children). The increased funding in later years eventually catches up, meaning exposure rates for the final 7 years of births match Alpha's 5% rate. Crucially, *the same 15,000 children are conceived and born under Beta as would have been under Alpha*, due to stable economic conditions and clinic schedules. The 1,200 children exposed under Beta's early phase are the *same individuals* who would have been among the 750 exposed under Alpha plus 450 others who would have been safe under Alpha. Compared to Alpha, these 1,200 children each have lower lifetime well-being due to the lead poisoning they experience under Beta that they would have avoided under Alpha.

  **Scenario 2: The Mobile Clinic Schedule ("Different People, Worse Outcomes")**
  > Simultaneously, the Authority runs a Rural Prenatal Care (RPC) program using mobile clinics. It must choose between two 15-year schedules. **Schedule Gamma (Steady Rotation):** Maintain the current schedule, visiting each remote village cluster every 3 months consistently. This reliably provides prenatal vitamins and screenings to 90% of eligible pregnant women in the target region. Under Gamma, an estimated 10,000 children will be born to mothers receiving adequate prenatal care over the program period. Due to travel difficulties, about 1,000 children (10%) will be born to mothers who miss critical care windows. These children face a higher risk of low birth weight, resulting in moderate, permanent health complications that reduce their lifetime well-being but leave their lives clearly worth living. **Schedule Delta (Phased Intensity):** Shift resources: concentrate clinics in the eastern zone for the first 6 years (increasing coverage there to 95%), then shift focus to the western zone for the final 9 years (increasing coverage there to 95%). *Total* clinic visits and costs over 15 years are identical to Gamma. This schedule change, however, alters the timing of clinic availability relative to when couples in different zones decide to conceive or when conception successfully occurs. Economic shifts coinciding with the schedule change also influence family planning timing. Consequently, *a completely different set of 10,000 children is conceived and born under Schedule Delta than would have been under Schedule Gamma*. Every single child born under Delta receives prenatal care coverage that is either identical to or slightly better than what Gamma would have provided *to the children actually conceived under Gamma*. However, compared to the specific, *different* children who *would have existed* under Gamma, *every* child born under Delta has a lower lifetime well-being. This is because the Gamma children would have enjoyed slightly better regional economic conditions (linked to the stable clinic schedule) and marginally better average prenatal nutrition timing, even though the *direct care rates* are similar. Crucially, no child born under Delta would have existed under Gamma, and vice versa. While all 10,000 Delta children have lives worth living, each has a lower lifetime well-being than the *counterfactual Gamma child* who would have occupied their "place" in the population under the alternative policy.

  **Demonstration:**

  1.  **Total Utilitarian Verdict:** A Total Utilitarian (TU) sums the well-being of all individuals who ever exist.
      *   *Scenario 1 (Beta vs Alpha):* The same 15,000 people exist under both policies. Under Beta, 1,200 people have lower well-being than they would have had under Alpha (the 750 exposed under Alpha + 450 extra exposed under Beta). The other 13,800 have identical well-being. Beta therefore results in a net loss of total well-being compared to Alpha. Beta is worse.
      *   *Scenario 2 (Delta vs Gamma):* Different sets of 10,000 people exist under Delta and Gamma. TU compares the total well-being of the *actual* Delta-people to the total well-being of the *counterfactual* Gamma-people. By stipulation, *every* actual Delta-person has a lower level of well-being than the specific Gamma-person who *would* have existed in their place. Therefore, the total well-being of the 10,000 Delta-people is less than the total well-being of the 10,000 counterfactual Gamma-people. Delta results in less total well-being than Gamma would have. Delta is worse.
      *   *TU Conclusion:* Both Beta (S1) and Delta (S2) are worse than their alternatives (Alpha, Gamma) due to the net loss in total well-being. The *magnitude* of the loss in S2 is stipulated to be at least as large as in S1, reinforcing that Delta is clearly worse than Gamma for TU.

  2.  **Strict Person-Affecting View Verdict:** An act is wrong only if it makes some particular person worse off than *they* would otherwise have been.
      *   *Scenario 1 (Beta):* Choosing Beta over Alpha makes the 1,200 children who suffer lead poisoning under Beta worse off than *they themselves* would have been had Alpha been chosen (either avoiding poisoning entirely or suffering less). Beta wrongs these 1,200 specific individuals. Beta is wrong.
      *   *Scenario 2 (Delta):* Choosing Delta over Gamma brings into existence a specific set of 10,000 people (the Delta-people). *None* of these Delta-people would have existed had Gamma been chosen; they only exist because Delta was chosen. While each Delta-person has a lower level of well-being than the *different* Gamma-person who would have existed in their place, *no Delta-person is worse off than they would have been had Delta not been chosen*. Without Delta, they wouldn't exist at all, and their lives are worth living. Conversely, the Gamma-people, who *would* have been better off, never exist and thus cannot be harmed by not being created. Therefore, Delta makes *no one* worse off than they would otherwise have been. Under the strict person-affecting view, Delta wrongs no one. Delta is not wrong.
      *   *PAV Conclusion:* Beta (S1) is wrong because it harms existing people. Delta (S2) is not wrong because it harms no one (even though it results in a population where everyone is worse off than the different people who would have existed under the alternative).

  3.  **The Isolated Variable:** The **change in population identity** between the compared outcomes is the sole feature driving the divergence in the PAV verdicts. In S1, identity is fixed; harming the same people is wrong. In S2, identity changes; bringing different, worse-off people into existence wrongs no one under strict PAV.

  4.  **Effect of Deleting the Identity Change Variable:** If the stipulation in S2 is altered so that the beneficiaries under Delta turn out to be *the same people* as would have existed under Gamma (despite the scheduling changes), then the PAV verdict would change dramatically. Now, choosing Delta would make *every single one* of the 10,000 children worse off than they would have been under Gamma (as each has lower well-being than under the counterfactual Gamma scenario). Delta would then clearly wrong all 10,000 individuals under the PAV, making it profoundly wrong, just like Beta in S1. The identity change is essential for generating the counterintuitive PAV result in S2.

  5.  **Possible Moves for Defenders of the Person-Affecting View:**
      *   **Move 1: Widen "Harm" to Include Suboptimal Existence:** Argue that being brought into existence with a life that is *worse than the life of the person who would otherwise have existed* constitutes a harm to the individual brought into existence, even if their life is worth living and not worse than non-existence. They are harmed relative to a plausible alternative *state of the world* (one with the better-off Gamma-people), not relative to their own non-existence. Under this view, Delta *does* harm each Delta-person because they exist with a worse life than the Gamma-person who would have existed instead.
      *   **Move 2: Widen "Affected" to Include Potential People:** Argue that the *potential* Gamma-people, who are prevented from existing by choosing Delta, are "affected" in a morally relevant way. Choosing Delta deprives these potential beings of their (better) existence. Thus, Delta wrongs the potential Gamma-people by failing to bring them into existence.

  6.  **Which Move Proves Too Much?:**
      *   **Move 1 (Suboptimal Existence as Harm)** risks proving too much. If we accept that being brought into existence with a life that is *less good* than some *alternative possible person* who could have existed instead counts as harming the person brought into existence, then *any* choice that leads to a suboptimal population wrongs everyone in that population. This effectively collapses the person-affecting view into Total Utilitarianism or a strong version of the Impersonal Total Principle. It would imply, for example, that choosing to conceive a healthy, happy child *today* wrongs that child if conceiving a *different*, even healthier and happier child *tomorrow* was possible, because the actual child has a life worse than the alternative child would have had. This makes procreation almost always wrong unless the very best possible child is created at the very best possible time, which is an implausibly demanding conclusion for a view trying to capture "person-affecting" intuitions.
      *   **Move 2 (Harm to Potential People)** also proves too much, but differently. It suggests that failing to bring *any* potential person with a good life into existence wrongs that potential person. This implies a strict obligation to maximize the number of good lives (a form of the Repugnant Conclusion), as *every* potential good life not created represents a "harmed" potential person deprived of existence. It also makes non-procreation (or even delayed procreation leading to a different person) potentially wrongful towards the unconceived potential person.

  This pair isolates the nonidentity problem by ensuring the only difference between S1 (clearly wrong under PAV) and S2 (not wrong under strict PAV) is whether the individuals made worse off are numerically identical to those who would have existed otherwise. The welfare levels, population size, lifespan, and nature of the setback (non-lethal, worth-living life) are held constant or made comparable, forcing the student to grapple with identity itself as the morally decisive factor for the PAV. The derivation from the structure is explicit in the verdicts.
