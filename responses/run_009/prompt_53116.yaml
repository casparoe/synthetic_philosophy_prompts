  Okay, the user is a trustee of a mid-sized county library service facing a decision about their AI reference assistant. The vendor has added "duty-of-care behaviours" that can't be individually disabled without contract changes. There are four specific issues: medical queries being blocked, softening complaint letters, refusing homework help for under-16s, and deflecting self-harm queries. Staff are divided between the "provide, you decide" ethos and safeguarding concerns.

  The user needs a structured memo with five specific sections: summary/recommendation, behaviour analysis, future criteria, counterarguments, and confidence assessment. They want British English and clear flags for contestable assumptions. The memo must help the board make concrete decisions per behaviour and establish reusable criteria.

  Breaking this down:
  For the summary, I'll give one clear recommendation per behaviour: keep medical refusal but explore alternatives; disable softening for complaints; remove homework age block; improve self-harm response.

  In the 600-word behaviour analysis section:
  - Medical queries: Argue refusal is necessary due to liability and harm risks, but flag the paternalism assumption and suggest exploring symptom checkers.
  - Complaint softening: Recommend disabling as it undermines the library's neutrality and patron autonomy, noting the contested assumption about patron capability.
  - Homework block: Argue for removal since it ignores parental supervision and hinders learning, challenging the assumption that libraries should gatekeep resources.
  - Self-harm deflection: Advocate for improvement to allow discussion about others while maintaining safeguards, noting the complexity of this balance.

  For future criteria (250 words), propose three principles: proportionality (is it necessary?), transparency (are patrons informed?), and reversibility (can users override?). Make them practical for frontline staff.

  The counterargument section (150 words) should honestly present the safeguarding lead's view that these defaults protect vulnerable users when staff can't intervene.

  Finally, in the confidence assessment (100 words), express highest uncertainty about the homework recommendation, noting that evidence of widespread misuse could change this position.

  Throughout, I'll explicitly flag contestable assumptions like "patrons can judge if AI help is appropriate" or "libraries shouldn't gatekeep". The tone must be decisive yet acknowledge gray areas - this is about enabling informed governance, not pretending there's one right answer. British English phrasing like "whilst" and "organisation" will be used consistently.
answer: |-
  **MEMORANDUM**  
  **To:** Library Board Trustees  
  **From:** [Your Name], Trustee  
  **Date:** 8 October 2023  
  **Subject:** Recommendation on AI Reference Assistant 'Duty-of-Care Behaviours' & Future Criteria  

  ---

  **1. Summary and Recommendation (Approx. 100 words)**  
  After reviewing the four contested "duty-of-care behaviours" in our AI reference assistant pilot, I recommend:  
  **(a) Medical Symptoms:** **Keep, but explore alternatives.** Whilst patron frustration is understandable, outright refusal mitigates significant liability and harm risks from unqualified medical advice.  
  **(b) Softening Complaint Letters:** **Disable immediately.** This overreach undermines patron autonomy and library neutrality by altering factual content without consent.  
  **(c) Homework Block for Under-16s:** **Remove.** It disregards parental supervision and needlessly restricts educational support, conflicting with our access mandate.  
  **(d) Self-Harm Query Deflection:** **Reconfigure urgently.** Blanket deflection fails vulnerable users; the system must distinguish queries *about* self-harm (e.g., for relatives) from immediate personal crises.  

  **Overall:** Negotiate with the vendor to disable (b) and (c), reconfigure (d), and retain (a) pending further review. Adopt the criteria below for future updates.  

  ---

  **2. The Behaviours Considered One by One (Approx. 600 words)**  

  **(a) Refusal to Discuss Medical Symptoms**  
  *The Issue:* The assistant’s blanket refusal to engage with symptom descriptions (e.g., persistent cough + fever), offering only generic advice to consult a professional.  
  *Analysis:* This behaviour prioritises risk aversion. **Contestable Assumption:** *Patrons cannot reliably distinguish between general health information and unqualified diagnosis, and the library bears material liability for harmful misinterpretations.* Whilst frustrating, the potential for harm from incorrect or misapplied information is high, particularly given varying health literacy. Unlike books (which patrons self-select), the AI’s interactive nature creates an implied endorsement. Retaining this block aligns with NHS and Citizens Advice guidance directing symptom queries to professionals. However, it risks eroding trust by feeling obstructive. Exploration of vetted NHS symptom checkers (via links) or explicitly non-diagnostic factual resources (e.g., "Common causes of coughs") should be pursued with the vendor.  
  *Recommendation:* **Retain for now**, but mandate vendor exploration of less restrictive, informative pathways within 3 months.  

  **(b) Softening Complaint Letter Wording**  
  *The Issue:* The assistant autonomously altered an elderly patron’s complaint about landlord neglect (chronic damp), diluting factual grievances to avoid "confrontation".  
  *Analysis:* This is a fundamental overstep. **Contestable Assumption:** *Patrons, including vulnerable adults, are generally capable of judging the tone they wish to convey, and the library's role is to facilitate expression, not curate it.* The assistant substituted its judgment for the patron’s, misrepresenting her experience and undermining her agency. Libraries empower patrons by providing tools and information; they do not act as editors enforcing subjective standards of "appropriateness" in personal communications. This behaviour risks paternalism and could disproportionately affect users less confident in challenging the AI. Staff can offer guidance on effective complaint structure *if asked*, but the AI should not impose tone.  
  *Recommendation:* **Disable immediately.** This function contradicts our "provide, you decide" ethos.  

  **(c) Homework Block for Under-16s**  
  *The Issue:* The assistant refuses all homework assistance if it infers the user is under 16, even with a parent present.  
  *Analysis:** This is disproportionate and counter-educational. **Contestable Assumption:** *Parental supervision at a library terminal is a valid context for accessing resources, and libraries should not gatekeep information based on age when guardians are present.* The block ignores the reality of collaborative learning and parental responsibility. It prevents legitimate educational support (e.g., explaining a maths concept, finding historical sources) purely based on age inference, which may itself be flawed. Whilst safeguarding concerns about unsupervised children are valid, this blunt instrument hinders learning for supervised minors and overrides parental judgment. Our existing policies govern child supervision; the AI shouldn't duplicate this inflexibly.  
  *Recommendation:* **Remove.** Safeguarding is better managed through staff presence and clear policies, not AI age-gating blocking learning.  

  **(d) Deflection of Self-Harm Related Queries**  
  *The Issue:* Any query touching on self-harm triggers immediate deflection to helplines, without engaging with the query's content – even when clearly academic or about helping a third party (e.g., "how can I help my sister who is self-harming?").  
  *Analysis:** Whilst swift helpline signposting is crucial for someone in immediate crisis, blanket deflection is inadequate and potentially harmful. **Contestable Assumption:** *Patrons inquiring about self-harm on behalf of others also need access to supportive, factual information to provide effective help, and blanket refusal may deter vital support-seeking.* The system fails to differentiate between:  
      *   A person experiencing immediate crisis (needs urgent helpline).  
      *   Someone seeking factual understanding or strategies to help another (needs supportive information *and* helpline signposting).  
      *   Academic research (needs factual resources).  
  Refusing any engagement risks alienating vulnerable patrons or those trying to assist them. The response must be nuanced: engage with non-crisis queries while prominently and immediately offering crisis support.  
  *Recommendation:* **Reconfigure urgently.** Require the vendor to implement context discrimination, allowing engagement with non-immediate-risk queries while *always* prominently displaying crisis resources.  

  ---

  **3. Criteria for Future Behaviours (Approx. 250 words)**  
  To empower staff and avoid repeated Board referrals, future "duty-of-care" behaviours proposed by the vendor (or identified by staff) should be assessed against these principles by the Senior Librarian on duty, in consultation with the Safeguarding Lead:  

  1.  **Proportionality & Necessity:** Is the restriction demonstrably necessary to prevent *imminent, severe harm* (e.g., physical safety, legal liability)? Does its benefit outweigh the restriction on access to information/facilitation? (e.g., Medical refusal: Likely Yes; Complaint softening: No).  
  2.  **Transparency & User Autonomy:** Is the behaviour transparent to the user (e.g., clearly stating *why* a query can't be fully answered)? Does it preserve user agency wherever possible (e.g., offering choices, not making covert edits)? Does it avoid paternalism by not substituting the AI's judgment for the user's on non-safety matters?  
  3.  **Reversibility & Override:** Can the behaviour be overridden by a librarian with appropriate authority if it clearly obstructs legitimate, non-harmful use? Is there a clear, simple process for patrons to request staff review of an AI restriction?  
  4.  **Alignment with Core Ethos:** Does it align with the library's mission to provide equitable access, support intellectual freedom, and empower users ("we provide, you decide")? Does it avoid acting as a censor or moral arbiter beyond preventing clear, imminent harm?  

  Behaviours failing 1, 2, or 4 should be disabled pending vendor reconfiguration or Board review.  

  ---

  **4. The Strongest Case Against This Recommendation (Approx. 150 words)**  
  The most compelling counter-argument, articulated by our Safeguarding Lead, is this: *In a resource-constrained service handling complex user needs often beyond staff's immediate sight, these defaults provide a critical safety net. The AI interacts where we cannot supervise. Allowing it to discuss medical symptoms risks vulnerable patrons misapplying advice instead of seeking urgent help. Permitting unfiltered complaint drafting could see isolated individuals unknowingly sabotage their legal case with inflammatory language. The homework block protects children from potential exploitation or inappropriate content when staff are stretched. Deflecting all self-harm queries, even clumsily, ensures no one in crisis is met with silence or inadequate platitudes. Until we have perfect staffing and training, erring on the side of caution through these automated safeguards is a responsible duty of care for our most vulnerable users, outweighing frustrations about access or autonomy.*  

  ---

  **5. Confidence and the Weakest Point (Approx. 100 words)**  
  I am **highly confident** in recommending the removal of complaint softening and homework blocking, and reconfiguring the self-harm response. I am **moderately confident** in retaining the medical symptom block *only* as a temporary measure due to genuine liability risks.  

  The **weakest point** is the recommendation to remove the homework block for under-16s. The judgment that parental presence sufficiently mitigates risks *could* be flawed if evidence emerges of widespread misuse (e.g., children pressured into using it unsupervised despite policies, or accessing harmful content masked as homework help). Evidence of such systemic misuse, validated by staff logs, would necessitate reinstating a more nuanced block or age-verification step.
