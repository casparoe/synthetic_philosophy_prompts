  Also, the user might have deeper needs: improving academic discourse in their lab, understanding how to construct robust hypotheses, or defending evolutionary psychology against unfair critiques. They need a structured way to engage their labmate, forcing specificity in critiques. 

  Including overlooked readings: the unfalsifiability angle if the hypothesis can't be tested even in principle, and the atomization point where adaptationists ignore higher-level constraints. These add depth to the analysis. 

  For pregnancy sickness specifically, the hypothesis has been tested—Flaxman and Sherman's work shows correlations with diet, geographical variation, and reduced miscarriage rates. So if the labmate dismisses it without addressing existing evidence, they're likely committing the "no independent evidence" or "no alternatives" flaws. 

