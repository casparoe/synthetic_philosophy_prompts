prompt: |-
  my labmate keeps dismissing any evolutionary explanation of anything as "just-so story," and this week it was the hypothesis that pregnancy sickness is an adaptation — the idea being that food aversions and nausea peak exactly during organogenesis, when the embryo is most vulnerable to plant toxins and teratogens, and that's why the sickness is timed the way it is. he waved it off as a just-so story and moved on. we'd just read the Gould and Lewontin spandrels paper in my philosophy of bio seminar so I have the general vibe — adaptationists tell a neat adaptive story for every trait, each one custom built with no way to check it, and the critics say you need to consider byproducts, constraints, drift, all that. but when he actually says the words "just-so story" I honestly can't tell which complaint he's making and I'm not sure he can either.

  so help me precisify the phrase. what are the distinct things someone could actually be claiming when they call a hypothesis a just-so story? I can think of at least a few candidates but probably missing some: (a) a trivial point about underdetermination — any historical claim about the past can't be directly observed, true of all evolutionary biology including the non-adaptive explanations, so no news; (b) a charge of missing mechanism — the hypothesis names a selection pressure but never specifies it precisely enough to generate testable predictions; (c) a charge of no independent evidence — it's compatible with the data but nothing else supports it; (d) a comparative charge — the adaptive story wasn't weighed against non-adaptive alternatives, like the trait being a byproduct of something else or a constraint; (e) something stronger, that psychological and behavioral traits in particular are so evolutionarily labile that adaptive stories about them are basically never worth pursuing, which seems like it'd prove too much.

  lay these out as a menu with verdicts: which readings are just name-calling dressed up, which are substantive methodological demands that a good adaptationist would happily accept, and which would actually justify dismissing the pregnancy sickness hypothesis outright rather than just saying "ok, go test it." and tell me which reading my labmate is probably invoking when he uses it as a conversation-ender, if you can guess. I want a list I can literally bring back to him and make him pick one. also if there are readings I left out entirely — maybe something about the story being unfalsifiable in a stricter popperian sense, or about it smuggling in an assumption that every trait has an explanation at the level of the trait rather than at some higher level of organization — fold those in. keep it seperate from the pregnancy sickness stuff though, I want the general analysis first and then the application, since I suspect half the problem is that people use the phrase to mean very different things and never notice.
