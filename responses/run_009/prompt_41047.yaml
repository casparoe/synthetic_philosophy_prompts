  ### **How to Use**  
  1. Run the quiz in your group (answers secret until scoring).  
  2. Use the key to map answers to frameworks.  
  3. Discuss surprises, framing effects (e.g., "Why did you say Yes to Q3 but No to Q6?"), and edge cases.  

  This highlights tensions between theories—e.g., HU vs. ASYM on whether "net happiness" is meaningful, or TNU vs. WNU on thresholds. Enjoy!
