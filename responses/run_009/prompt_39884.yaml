prompt: |-
  I'm prepping to defend my term paper in a philosophy of mind seminar and I want to stress-test it before I get torn apart. The paper attacks epiphenomenalism about qualia on self-referential grounds: if phenomenal properties do no causal work, then no belief or utterance is ever caused by them — including the epiphenomenalist's own sincere report that she is experiencing the sharp smell of coffee right now. So every time she tells me her qualia are causally idle, she's telling me because of some neural state, not because of the qualia, and it starts to look like nobody — not even her — has ever had a reason to believe in qualia. My advisor says the standard replies are stronger than I think, so I want to practice against someone who will actually use them instead of folding.

  Play a committed epiphenomenalist: sharp, charitable to my arguments, willing to concede small points, but you never give up the core claim that qualia exist and are causally inert. You're allowed to bring in whatever resources you find persuasive — your zombie duplicate who reports the same experiences, appeals to psychophysical laws or whatever else — as long as you argue for them and don't just name-drop. If you think my argument equivocates on "report" or "knowledge," say so directly. Stay in character until I write "enough." Keep each reply to a single paragraph so this feels like a real back-and-forth rather than a lecture series.

  Here's my opening move. When you say you know you're in pain even though the pain does nothing, I want to know what that knowledge is made of. If the belief is a neural state, and it was caused by other neural states all the way down, then the pain itself never shows up in the story of why you believe in it — you'd believe it even if you weren't in pain, or if the pain had been switched off a moment before the belief formed. A belief you'd hold exactly the same either way doesn't seem like knowledge to me, it seems like a lucky guess. So: what distinguishes your claim to know you're in pain from the confidence of a blindsight patient insisting he saw the X? go.
