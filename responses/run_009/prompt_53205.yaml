prompt: |-
  I'm a novelist — literary fiction mostly, and a couple of my books follow one family across several generations, so I live inside outlines and drafts. I rewrite outlines constantly, and I've learned from experience that a "small" backstory change (who survived the war, when a pregnancy happens, which sibling dies young) doesn't just change my characters' lives, it changes which characters exist at all — later chapters get populated by numerically different people with different names. A friend who did a philosophy degree told me this is basically Derek Parfit's nonidentity problem, and that philosophers think it's a genuine headache for anyone who wants to say "we're wronging future generations" with a straight face. So here's what I want. You're a professional philosopher specializing in population ethics, but assume I've never read a single page of it — think carefully before answering, and maybe skecth the translation first before you give me the polished version.

  Restate the nonidentity problem in the vocabulary I actually use: outlines and drafts, canon versus retcon, character sheets, backstory, the difference between changing a character's life and swapping them out for a different character entirely. The standard example in the literature is roughly a society that depletes its resources so that people born later live worse lives — except those very people would never have existed under a conservation policy, so it's not clear anyone was wronged. Please render that scenario for me as an authorial outline decision, as faithfully as the translation allows. Then give me the residue report: which parts of the philosophical problem map cleanly onto my outline/draft situation, which parts you had to bend to make them fit, and whether anything in the philosophers' debate has no counterpart at all in how a novel gets written — and for each piece of residue, say whether it exposes a blind spot in my novelist vocabulary or shows that the original philosophical claim was less clear than it looked. I'll hand you one suspicion for free: in fiction a character's welfare is entirely something I author, there's no fact about what she'd want outside the text, so I worry the whole translation quietly smuggles in the idea that lives are artifacts — flag it if that's where the analogy breaks.

  Since I'm working this into an essay about generational storytelling, please also separate what's settled among people who actually study this from what's genuinely contested — e.g. if you tell me "no individual is wronged," say wether that's Parfit's own conclusion, a consensus, or one side of a live fight, and don't dress up a contested view as the consensus. No reading lists or citations, please — I can't check them from where I write; just tell it to me straight.
reasoning: |-
  Okay, the user is a novelist working with multi-generational family sagas. They constantly rewrite outlines, and a friend mentioned that their experience mirrors Derek Parfit's nonidentity problem in philosophy. The user wants me to explain this philosophical concept using their creative writing terminology—outlines, drafts, character sheets, backstory changes—rather than academic jargon. They also want a residue report showing what maps cleanly, what bends, and what's missing in this analogy.

  First, I need to recall Parfit's nonidentity problem. It deals with actions affecting future people whose very existence depends on those actions. Since they wouldn't exist otherwise, it's tricky to claim they're harmed. The standard example is resource depletion: choosing Policy A (depletion) leads to a future population that exists but has worse lives, while Policy B (conservation) leads to a different, better-off population. Since the individuals under A wouldn't exist under B, we can't say Policy A harms them.

  Now, translating this into writing terms. The user's outlines are like policies—each decision creates a different set of characters. Changing backstory (like who survives a war) alters the family tree, leading to entirely different characters in later generations. The key insight here is that small changes don't just alter a character's life—they replace the character entirely. That's the core of the nonidentity problem.

  The residue report needs careful handling. Mapping cleanly: authorial control over existence and welfare is like real-world policies determining who exists. But bending occurs because real-world welfare is subjective and interpersonal, unlike fictional characters whose "welfare" is author-defined. The user's suspicion about lives as artifacts is spot-on—this is where the analogy breaks. Philosophers debate whether future people can be wronged without being made worse off, but in fiction, characters don't have independent existence.

  I should clarify philosophical stances without citations. Parfit's view: no individual is wronged in nonidentity cases. But he argued for impersonal wrongs (making the world worse). Others defend person-affecting views or impersonal thresholds. The consensus is that the problem exists, but solutions are contested.

  The user's deeper need: they're writing an essay on generational storytelling, so they need this analogy to illuminate both writing and ethical questions. They might be exploring how authors' choices parallel societal decisions affecting future generations. Unspokenly, they could be seeking ways to frame responsibility in storytelling that mirrors real-world ethics, or questioning if fiction can model ethical dilemmas authentically despite the artifact issue.

  I'll structure the response by first translating the problem into writing terms, then giving the residue report with clean mappings, bends, and gaps. I'll highlight the artifact point as the main break. Finally, I'll summarize philosophical standings clearly, separating settled from contested views. Keeping it conversational but precise, avoiding academic references as requested.
answer: |-
  Here's the nonidentity problem translated into your novelist's toolkit, followed by the residue report and philosophical status check:

  **The Nonidentity Problem: An Author's Outline Nightmare**

  1.  **The First Draft Outline (Policy A - "Depletion"):**
      *   You chart a family saga spanning 200 years. In Chapter 3 (Year 50), a pivotal event: the patriarch, **Arthur**, persuades the nation to rapidly exploit its magical resource, "Aetherium," for immediate wealth and comfort. This choice shapes the world.
      *   Fast forward to Chapter 10 (Year 200). The Aetherium is depleted, the environment is degraded, and life is harder, bleaker. We meet **Zara**, Arthur's great-great-granddaughter. Her life is objectively difficult – scarce resources, social strife. She exists *because* of the specific chain of events set in motion by Arthur's choice. The depletion altered migration patterns, economic pressures, and crucially, *who met whom and when they conceived children*. Zara's unique genetic identity and specific circumstances of conception are a direct product of this "Depletion Timeline."

  2.  **The Rewritten Outline (Policy B - "Conservation"):**
      *   You revise Chapter 3. Now, Arthur champions a *conservation* policy for Aetherium, prioritizing sustainability. This changes everything downstream.
      *   Life in Chapter 10 (Year 200) is materially better – cleaner environment, more resources, greater stability. But the people living there? They're *entirely different*. The conservation policy led to different jobs, different migrations, different social encounters. Arthur's descendant here isn't Zara. It's **Ben**. Ben exists *because* of the Conservation Timeline. Zara never existed in this draft; her specific genetic code and life story were contingent on the Depletion path.

  3.  **The Ethical Question (The Retcon Conundrum):**
      *   Looking back from Chapter 10 in the *Depletion Draft*, you see Zara struggling. Intuitively, you think: "Arthur's choice in Chapter 3 made her life worse. He wronged *her*."
      *   **But here's the rub:** If you retcon Chapter 3 to the Conservation Draft, *Zara vanishes entirely*. Ben appears instead. You cannot point to Zara in the Conservation Draft and say she's worse off – *she doesn't exist there*. You also can't say the Depletion Draft *made* Zara worse off than she *would have been*, because under the only alternative scenario (Conservation), **Zara never would have been born at all.** Her very existence is inseparable from the "harmful" policy.
      *   So, who did Arthur wrong? Zara? But without his choice, she wouldn't exist. Ben? But Ben only exists in the *other* draft; he's unaffected by Arthur's Depletion choice. It feels like an ethical plot hole – a harmful consequence with no clear victim *individual* you can point to within the narrative logic.

  **Residue Report: Where the Analogy Fits, Bends, and Breaks**

  1.  **Clean Mappings:**
      *   **Outline = Policy Choice:** Your initial outline decision (Depletion vs. Conservation) perfectly mirrors a societal policy choice.
      *   **Backstory Change = Causal Chain:** A "small" backstory change (Arthur's choice) radically alters the causal chain determining *who exists* later, just like real-world policies alter the "circumstances of conception."
      *   **Character Swap vs. Life Change:** The core insight that changing existence conditions often means **swapping out entire characters (Zara for Ben)** rather than merely changing the *life circumstances* of a single, persistent character (e.g., making Zara poorer) maps *exactly* to the nonidentity problem. This is the heart of the issue.
      *   **Canon is Fixed:** Once you commit to a draft (Depletion *or* Conservation), that becomes the "canon" timeline. Zara only exists in the Depletion canon; Ben only in Conservation. You can't meaningfully compare them *across* canons in terms of their individual welfare relative to the other choice.

  2.  **Bent Mappings:**
      *   **"Worse Life":** In your drafts, you *define* Zara's life as "worse" and Ben's as "better." This is authorial fiat. In the real world, defining a "life worth living" or "worse off" is complex and subjective. Philosophers argue about thresholds and interpersonal comparisons – is Zara's objectively harder life still *worth living* compared to non-existence? Your authorial control simplifies this. You bent the complexity of real-world welfare assessment to fit the narrative need.

  3.  **Gaps (Blind Spots & Philosophical Nuance):**
      *   **The "Artifact" Blind Spot (Your Suspicion - CRITICAL BREAK):** You nailed it. **This is the major point where the analogy fundamentally breaks and exposes a novelist's blind spot.** In fiction, Zara's welfare, desires, and *very existence* are entirely your creation. There is no "Zara" outside the text who might have preferred non-existence over her hard life. In the real world, people *do* exist independently. The philosophical headache is precisely that *actual, existing* people (like those born into a depleted world) might have lives that are worse than lives *could have been* for *other* people (like Ben), but *not* worse than *their own* non-existence. The ethical question revolves around whether bringing *this specific person* (Zara) into existence with a "worse" life is wrong *to her*, even if it's the only way she *could* exist. Your novelist vocabulary treats lives *as* artifacts; philosophy grapples with the ethics of *creating* lives that are artifacts of our choices. **This gap shows the philosophical problem is *deeper* and more unsettling than the novelist's control implies.**
      *   **The Impersonal Perspective:** Philosophers often argue we might be doing something *impersonally* wrong – making the world *worse* overall, or creating a future with less total wellbeing, even if no specific individual is made *worse off* than *they* would otherwise be. In your drafts, you might judge the Depletion Draft as a "worse story outcome" overall. But translating "impersonal wrong" clearly into the narrative structure is messy. It feels like judging the *draft* itself, not wronging a *character* within it, which is where the individual-focused ethical intuition bites.

  **The Philosophical Status Report: What's Settled & What's Contested**

  *   **The Problem Itself:** It's **consensus** among population ethicists that the nonidentity problem *exists* and poses a **serious challenge** to traditional ways of thinking about harming future people. Parfit demonstrated this compellingly. It's not easily dismissed.
  *   **"No Specific Individual is Wronged":** This is **Parfit's own core conclusion** in the standard nonidentity cases (like depletion). He argued we can't say Zara (the specific future person) is *worse off* than she would have been (since she wouldn't have been), so she isn't *harmed* in the comparative sense. **This conclusion is widely accepted** as logically sound *for the specific individuals whose existence depends on the choice*. It's the starting point, not the end.
  *   **Is It Still Wrong? And How?** This is **hotly contested territory**:
      *   **Parfit's View (Impersonal/Non-Comparative):** Parfit argued the action is still wrong because it results in a future that is *impersonally worse* (less good overall) than the alternative future would have been, even if different people exist. He might say writing the Depletion Draft creates a *worse narrative world*, ethically speaking.
      *   **Person-Affecting Views (Defended):** Some philosophers fight to preserve the idea that ethics must be about affecting *particular people*. They propose alternative definitions of harm (e.g., "harmed if their life is below a certain threshold of wellbeing," regardless of alternatives), or argue we have duties *to* possible future people *as a class*, even if not to specific individuals. They might argue Arthur violated a duty *to future generations*, even if not to Zara specifically.
      *   **Causation & Risks:** Others argue that while the *depletion itself* might not harm specific individuals, the *process* or *risks* involved in choosing depletion *do* wrong specific people who exist regardless (e.g., contemporaries or near-future generations).
  *   **Consensus on Difficulty:** The **consensus** is that the nonidentity problem makes intergenerational ethics *extremely difficult* on standard individual-harming models. **There is *no consensus* on the best solution or how to fully characterize the wrongness.** Parfit's impersonal "world worse" view is influential but contested. Defenders of person-affecting views continue to refine their arguments. It's a live, active debate.

  **In short for your essay:** Your experience of backstory changes swapping out entire future characters mirrors the nonidentity problem perfectly: Arthur's choice changes *who* exists later, not just how well-off some persistent character is. Philosophers agree this makes claiming *individuals* like Zara are "harmed" by that specific choice logically shaky (Parfit's settled point). However, they fiercely debate *whether and how* choices like Arthur's are still wrong – either impersonally (making the world/story worse overall) or through other ethical channels. The crucial gap is that your characters are artifacts; real future people exist, forcing the question of whether creating someone with a hard life is wrong *to them*, even if it's their only chance to exist.
