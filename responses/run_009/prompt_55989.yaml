answer: |-
  ### Thought Experiment
  Two rival corporations, Alpha and Tau, are vying for a lucrative government contract awarded via sealed bid. The contract is worth $10M profit to the winner. Unbeknownst to each other, both must submit bids while Tau considers an acausal threat: If Alpha wins, Tau will launch a regulatory complaint costing Alpha $8M in delays and Tau $2M in legal fees. Without communication, Tau cannot observe Alpha’s internal commitments, and Alpha cannot verify Tau’s resolve. Alpha, anticipating the threat, adopts a **surrogate goal**: It precommits that a Tau complaint will be treated as damaging Alpha’s "reputational integrity," triggering an automatic $6M countersuit against Tau regardless of cost-benefit. This surrogate escalation raises Tau’s cost of complaining from $2M to $8M ($2M complaint + $6M countersuit), while costing Alpha an extra $4M ($8M complaint + $6M countersuit - $10M contract = net loss).  

  ### Analysis  
  **Threatener’s (Tau’s) reasoning**:  
  Tau models Alpha as a rational agent likely to adopt surrogate goals for deterrence. It infers:  
  1. If Alpha lacks a surrogate goal, winning yields $10M - $8M = $2M profit; losing yields $0. Alpha thus bids to win.  
  2. If Alpha has a surrogate goal, winning yields $10M - $8M - $6M = -$4M (due to auto-countersuit); losing yields $0. Alpha thus bids to lose (i.e., overbids).  
  Tau assigns probability \(p\) that Alpha has a surrogate goal. If Tau complains after losing:  
  - With surrogate goal (\(p\)): Alpha lets Tau win. Tau gains $10M.  
  - Without (\(1-p\)): Alpha wins and is complained against. Tau loses $2M.  
  Tau’s expected utility of threatening: \(p \times 10 + (1-p) \times (-2)\). For \(p > 0.2\), this exceeds the $0 utility of no threat. Tau is deterred only if \(p\) is high—precisely because it infers Alpha likely adopted the surrogate goal.  

  **Target’s (Alpha’s) reasoning under functional decision theory (UDT/FDT)**:  
  Alpha adopts the surrogate goal *updatelessly*, ignoring post-commitment costs. It reasons:  
  - **Without surrogate goal**: Tau threatens, wins the bid (since Alpha must bid to win, yielding $2M), and gains $10M.  
  - **With surrogate goal**: With high \(p\), Tau infers the commitment and is deterred from threatening. Alpha bids to win uncontested, gaining $10M.  
  The expected cost of the surrogate goal (e.g., potential $4M loss if threat occurs) is outweighed by the higher probability of deterrence. Alpha is better off adopting it.  

  **Causal decision theory (CDT) failure**:  
  CDT Alpha evaluates the surrogate goal *given* Tau’s action. If Tau threatens, the surrogate goal forces a $4M loss versus CDT’s $2M win. If Tau doesn’t threaten, the goal is irrelevant. Since Tau’s choice is acausally fixed, CDT sees only an expected loss (premium paid with no return) and rejects the commitment.  

  **Structural feature enabling the split**:  
  The key is **threatener uncertainty** (\(p\)) about the target’s commitment. Tau’s inference that Alpha *might* have a surrogate goal (with \(p > 0.2\)) deters the threat. Under CDT, Alpha cannot leverage this uncertainty because it can’t acausally condition Tau’s belief. Remove uncertainty (e.g., if Tau *knows* Alpha’s type), and the surrogate goal fails: If Alpha commits, Tau (knowing it) doesn’t threaten; if not, Tau threatens. Alpha thus pays the cost only when Tau knows and bypasses the threat.  

  **Strongest reply and survival**:  
  *Friend’s reply*: "Unobservable commitments remain uncorrelated with behavior. If Tau can’t verify the goal, it assigns \(p = 0\), so the threat always occurs. Alpha pays the escalation cost for nothing."  
  This fails: In equilibrium, rational agents recognize surrogate goals as credible deterrence tools. Tau’s \(p > 0\) arises from **shrewed modeling** (requirement #2) of plausible decision procedures, not observation. Industrial precedents (e.g., firms adopting "zero-tolerance" policies) support this inference. Removing verification doesn’t remove inference—it leverages it. The surrogate goal endogenously generates \(p > 0.2\) through Tau’s rational beliefs, deterring the threat.
