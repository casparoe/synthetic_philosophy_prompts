prompt: |-
  My friend keeps handing down verdicts in population ethics and I want to predict her on the next batch before she gives them. Her track record so far: (1) conceiving when you know the child's life will be below zero, not worth living, is dead wrong; (2) a couple who just don't feel like having a kid that would've had a great life — nothing wrong with that, not even a small failure; (3) a climate policy that leaves the very same future people with lives still worth living but much worse than they otherwise would've been — wrong; (4) a policy that adds millions of extra people with clearly great lives, affecting no one else — she waffles: seems fine, but she won't say it's better, and she definately won't say anyone owes it to anyone.

  The new cases: (a) a couple who can have a child whose life will be worth living but mediocre — clearly positive, just drab — is that like (2), or more like (1), or neither? (b) a depletion-style policy where both futures contain the same number of people but *different* people, all with good lives, just noticeably worse than the lives the others would have had — nobody is worse off than they themself would have been, since the ones under the other policy never exist; (c) adding a huge number of extra people whose lives are barely worth living alongside a population of very happy people, nobody else affected. Predict her verdict on each, say what rule she's implicitly running (the procreation asymmetry? some person-affecting view? a critical-level view with the dial set somewhere?), tell me what other rules fit her record just as well but split on (a)-(c), and tell me which case — maybe one I haven't listed — would most cleanly seperate the candidate rules.
reasoning: |-
  Okay, the user's friend has this track record of verdicts on population ethics scenarios, and they want to predict her responses to three new cases. Let me start by understanding her past judgments.

  First, she thinks conceiving a child with a life not worth living (below zero) is dead wrong. That's pretty standard negative utilitarianism where preventing suffering is paramount. Then, she sees no issue with a couple choosing not to have a child who would have a great life. That suggests she doesn't think there's a duty to create happy people, which aligns with the procreation asymmetry. 

  Next, for the climate policy where future people have worse lives but still positive, she calls it wrong. So she cares about making existing people worse off, even if they still have good lives. This points to a person-affecting view, where harming existing individuals is bad, but not creating new ones isn't. 

  But then she waffles on adding extra people with great lives. She won't say it's better or that anyone owes it. That's consistent with asymmetry—creating happy people isn't a moral obligation, just permissible. 

  Now, the new cases. Case (a) is having a child with a mediocre, but positive life. If she applies asymmetry, she might say it's permissible, like case (2). But if she has a critical level, where only lives above a certain quality should be created, then mediocre might be wrong. Her call on (1) being dead wrong for below zero, and (2) okay for not creating a great life, suggests that as long as the life is positive, creating it isn't wrong. So probably she'll say it's okay, not like (1). 

  Case (b) involves different people in the future with worse lives than possible others. Since no one is made worse off personally (because the others don't exist), a person-affecting view might say it's not wrong. But if she cares about impersonal harm, like lower average utility, she might object. Her stance on the climate policy (3) was wrong because the same people were worse off. Here, different people exist, so she might not see it as wrong, aligning with person-affecting. 

  Case (c) adds many barely happy people alongside very happy ones. Total utilitarians would approve because total happiness increases. But average utilitarians would oppose it. Procreation asymmetry says creating happy people is neutral, not required, but since they're barely happy, some views might see it as less valuable. Her waffling on (4) suggests she doesn't see adding happy people as better, so she might be indifferent or slightly negative here, especially if she's concerned about average welfare or critical levels. 

  Possible rules: procreation asymmetry fits most of her judgments. Critical level could work if the level is above mediocre but below great, but that's less consistent with her not criticizing the couple in (2). Person-affiding with harm avoidance fits, especially with (3). 

  A test case to distinguish: choosing to create a large number of people with high positive lives vs. not creating them. Asymmetry says it's neutral; total utilitarianism says better. If she thinks it's better, that rules out asymmetry. Another test: creating a mediocre life. If she says it's wrong, that points to critical level; if permissible, asymmetry. 

  User's deeper needs: they want to understand their friend's ethical framework to predict future responses, possibly for discussions or debates. They might also be exploring their own stance by comparing. Need to clarify the principles and find a decisive test case.
answer: |-
  Based on your friend's track record, here's a prediction for each new case, the likely implicit rule she's using, alternative rules that fit her past judgments but diverge on (a)-(c), and a clean test case to distinguish them:

  **Predicted Verdicts:**
  1.  **(a) Mediocre Life Conception:** **Permissible (like 2)**. She'll likely see no strong obligation to create a *great* life (2), and since the mediocre life is still "clearly positive" (unlike 1), she won't condemn it as "dead wrong." Creating a merely positive life isn't required, but isn't inherently wrong either.
  2.  **(b) Depletion (Different People):** **Not Wrong (like 2, unlike 3)**. Her condemnation in (3) focused on harming *specific* future people ("the very same future people... much worse"). Here, no *identifiable* person is worse off than they would have been (the alternative people don't exist). Since all lives are "good," she'll likely see no wrongdoing, similar to the permissibility of not creating a great life (2).
  3.  **(c) Vast Numbers Barely Worth Living:** **Not Better / Permissible but Not Obligatory (like 4), possibly leaning Neutral/Negative.** She waffled on adding great extra lives (4). Adding lives only *barely* worth living is even less likely to be seen as an improvement or an obligation. She might express unease or indifference, but won't condemn it as strongly as (1) or (3), nor will she say it's better than not adding them.

  **Her Likely Implicit Rule: Procreation Asymmetry (Specifically, Asymmetric Person-Affecting View)**
  *   **Why it fits:**
      *   (1) Creating a life below zero is *wrong* (strong negative duty).
      *   (2) Not creating a life above zero is *not wrong* (no positive duty to create happy people).
      *   (3) Making *existing/future specific people* worse off is *wrong* (standard person-affecting harm).
      *   (4) Creating *additional* happy people is *not wrong*, but *not better* (no positive duty/value in creation).
  *   **Predictions:** Fits (a) Permissible, (b) Not Wrong, (c) Not Better/Permissible.
  *   **Dial Setting:** The asymmetry is clear: strong prohibition on creating bad lives, no obligation/strong positive value in creating good lives. Harming existing/specific future people is wrong.

  **Alternative Rules Fitting the Track Record (But Splitting on (a)-(c)):**
  1.  **Critical-Level Utilitarianism (CL ~ Mediocre):**
      *   **Why it fits:** (1) Below zero is wrong. (2) Not creating above CL is neutral/ok. (3) Harming existing people below their potential is wrong. (4) Creating above CL is good? (This is the misfit - she waffled, didn't say it was better). *Requires assuming her CL is high enough that she hesitates to call (4) "better."*
      *   **Splits on:**
          *   (a): **Wrong.** Creating a life *below* the Critical Level (mediocre < CL) is bad.
          *   (b): **Potentially Wrong.** If the "noticeably worse" lives fall below the CL, it's bad. If still above CL, may be permissible.
          *   (c): **Very Wrong.** Adding lives barely above zero is likely far below any plausible CL.
  2.  **Person-Affecting Plus Strong Non-Identity Principle:**
      *   **Why it fits:** Focuses solely on harming/wronging *specific* individuals. (1) Wrongs the child. (3) Wrongs the future people. (2) & (4): No specific individual is wronged by non-creation or creation of *new* people. Fits her waffle on (4) - no one is wronged, but impersonal value is irrelevant.
      *   **Splits on:**
          *   (a): **Permissible.** Creating the child doesn't wrong it (life >0). No one else is wronged.
          *   (b): **Not Wrong.** No specific individual is made worse off than *they* would have been. Different people exist, all have good lives.
          *   (c): **Permissible (or Not Better).** No specific individual is wronged by adding the barely happy people. But like (4), she won't see it as "better".
  3.  **Average Utilitarianism:**
      *   **Why it fits:** (1) Creates suffering, lowers average. (2) Doesn't lower average (if the couple's life is similar/happy). (3) Lowers average welfare. (4) Adding great lives *might* raise or lower the average depending on context. Her waffle *could* stem from this uncertainty or a belief it doesn't change the average much. *Fits less perfectly than the others, especially explaining (2) as "nothing wrong".*
      *   **Splits on:**
          *   (a): **Likely Permissible.** Adding one mediocre life to a world likely doesn't drastically lower the global average.
          *   (b): **Wrong.** The policy lowers the average welfare of the future population.
          *   (c): **Strongly Wrong.** Adding vast numbers of barely happy people drastically lowers the average welfare.

  **The Cleanest Separating Test Case:**
  *   **Scenario:** A couple can choose to conceive **one** child who will have a **distinctly mediocre but still clearly positive life** (e.g., +5 on a -10 to +10 scale, where 0 is neutral). They have no other options (no great child possible). Is conceiving this child **morally required, morally permissible, or morally wrong?**
  *   **How it Separates:**
      *   **Procreation Asymmetry (Predicted Rule):** **Permissible.** No duty to create, but no prohibition since life >0.
      *   **Critical-Level (CL ~ Mediocre):** **Wrong.** Life is below the critical threshold (e.g., CL=+7).
      *   **Person-Affecting + Non-Identity:** **Permissible.** Doesn't wrong anyone.
      *   **Average Utilitarianism:** **Likely Permissible.** Adding one mediocre life has negligible impact on the vast global average.
  *   **Why it's Clean:** It isolates the core difference between seeing the creation of *any* positive life as permissible (Asymmetry, PA) vs. seeing the creation of lives below a certain quality threshold as wrong (CL). It avoids complications of vast numbers (c), different people (b), or comparisons to not creating a great life (2 & 4).

  **Key Takeaway:** Your friend's pattern strongly suggests **Procreation Asymmetry** within a framework prioritizing avoiding harm to specific individuals (Person-Affecting). The separating test case focuses directly on the moral status of creating a single, unambiguously mediocre-but-positive life to confirm whether she adheres strictly to asymmetry or incorporates a critical level.
