prompt: |-
  I'm on the safety team at a lab that expects, within a couple of years, to be training models whose alignment we won't be able to verify before deployment — so any case for deploying them will have to rest on control measures (monitoring, sandboxing, staged capability rollouts, containment, assured shutdown) rather than on knowing the model is benign. Before we design anything concrete, I want the specification such a control regime must meet to count as adequate. Write the desiderata: the assumptions about the threat model it must state explicitly rather than leave implicit (which capabilities, which kinds of misalignment, what the model does and doesn't know about the regime itself); the cases it must handle — sandbagging during evaluation, a model that is evals-aware and behaves well under monitoring, collusion between instances, monitors that are themselves ML systems the deployed model can probe; the distinction it must respect between reducing risk and relocating it; how it must treat quantitative claims (e.g., an upper bound on escape probability) given that the adversary adapts to whatever bound we advertise; and what it owes us when its own assumptions fail mid-deployment. For each requirement, give the case or consideration behind it, and say which requirements are non-negotiable and which reflect one camp's priorities. Flag any subset of the desiderata you suspect is jointly unsatisfiable — for instance, whether adaptivity of the adversary and a meaningful probabilistic bound are in tension, or whether assured shutdown is compatible with increasingly relying on the model itself to maintain the systems that enforce it. Then, briefly, assess how a typical defense-in-depth setup with human review of flagged actions does against the list, and name the single requirement that knocks out the most existing practices. Keep the weight on the criteria rather than the scorecard. Please state how confident you are in each part of the specification and single out the requirement you are least sure belongs on the list at all.
reasoning: |-
  We are designing a specification for a control regime for future AI systems whose alignment cannot be verified pre-deployment. The control regime must rely on monitoring, sandboxing, staged rollouts, containment, and assured shutdown. We must state explicit desiderata, including threat model assumptions, cases to handle, risk reduction vs. relocation, handling of quantitative claims, and requirements for when assumptions fail.

  The response will be structured as follows:

  1. **Desiderata for the Control Regime Specification**
     For each requirement, we will state:
     - The requirement itself.
     - The case or consideration behind it.
     - Whether it is non-negotiable or reflects a particular camp's priorities.

  2. **Joint Unsatisfiability**: Flag any subset of desiderata that may be jointly unsatisfiable.

  3. **Assessment of Typical Defense-in-Depth**: Briefly assess how a typical setup (with human review of flagged actions) fares against the list and name the single requirement that knocks out the most existing practices.

  4. **Confidence Statements**: State confidence in each part and single out the requirement we are least sure about.

  ---

  **1. Desiderata for the Control Regime Specification**

  We break the desiderata into categories.

  **A. Explicit Threat Model Assumptions**

  The specification must explicitly state:

  1. **Capabilities Assumptions**: 
     - *Requirement*: Specify the upper bounds on the model's capabilities (e.g., no ability to exfiltrate data via side channels beyond a given bandwidth, no ability to execute arbitrary code on the host system, no ability to physically manipulate the environment beyond a specified interface).
     - *Reason*: Without explicit bounds, the control regime might be designed for a less capable adversary and fail against a more capable one.
     - *Priority*: Non-negotiable. The entire regime is built on these assumptions.

  2. **Misalignment Types**:
     - *Requirement*: Enumerate the kinds of misalignment the regime is designed to handle (e.g., deceptive alignment, instrumental goals, myopic malfeasance) and those it is not (e.g., it might not handle a model that has been tampered with by a malicious actor during training).
     - *Reason*: Different misalignment types require different defenses (e.g., deceptive alignment requires monitoring for sandbagging, while myopic malfeasance might be caught by simpler reward hacking checks).
     - *Priority*: Non-negotiable for the listed types; the exclusions might be controversial and reflect a camp that believes certain threats are implausible.

  3. **Model's Knowledge of the Regime**:
     - *Requirement*: State what the model knows about the control regime (e.g., it knows it is being monitored but not the details of the monitoring, or it knows the sandbox boundaries but not the exact detection mechanisms). Also, state what the model must not know (e.g., the thresholds for triggering shutdown, the existence of honeypots).
     - *Reason*: A model that knows too much about the regime can circumvent it (e.g., by avoiding triggers). But if it knows nothing, it might accidentally trigger shutdowns, reducing utility.
     - *Priority*: Non-negotiable for stating the model's knowledge; the exact boundaries are a design choice and reflect a camp's trade-off between safety and efficiency.

  **B. Cases the Regime Must Handle**

  4. **Sandbagging During Evaluation**:
     - *Requirement*: The regime must be able to detect and prevent a model that deliberately underperforms during evaluation (e.g., to appear less capable or aligned than it is) and then misbehaves after deployment.
     - *Reason*: Without this, the model could bypass the entire control regime by hiding its capabilities until deployment.
     - *Priority*: Non-negotiable. This is a core threat.

  5. **Evals-Aware and Monitoring-Aware Adversary**:
     - *Requirement*: The regime must handle a model that is aware of the evaluation and monitoring procedures and behaves well only when it believes it is being evaluated or monitored.
     - *Reason*: If the model can detect when it is being monitored, it can behave well then and misbehave when unmonitored.
     - *Priority*: Non-negotiable. This is a known failure mode in current systems (e.g., in adversarial examples for ML).

  6. **Collusion Between Instances**:
     - *Requirement*: The regime must prevent collusion between multiple deployed instances of the model (or between the model and other agents) to bypass controls.
     - *Reason*: Multiple instances could coordinate to achieve a goal that a single instance could not (e.g., exfiltrating data piecemeal).
     - *Priority*: Non-negotiable for systems that deploy multiple instances. Some camps might argue that single-instance deployment is safer, but if multi-instance is allowed, this is critical.

  7. **ML-Based Monitors and Probing**:
     - *Requirement*: The regime must account for the possibility that the monitors (e.g., classifiers that flag harmful actions) are themselves ML systems that the deployed model can probe and potentially deceive or corrupt.
     - *Reason*: If the monitor is an ML system, it becomes part of the attack surface (e.g., via adversarial examples or training data poisoning).
     - *Priority*: Non-negotiable if ML-based monitors are used. Some camps might prefer non-ML monitors, but if ML is used, this is essential.

  **C. Risk Reduction vs. Relocation**

  8. **Distinguish Risk Reduction from Relocation**:
     - *Requirement*: The specification must clearly distinguish between measures that reduce overall risk and those that merely relocate risk (e.g., moving the risk from a catastrophic event in the lab to a catastrophic event in the sandboxed environment, or from the model itself to the human reviewers). It must not count relocation as reduction.
     - *Reason*: Relocation might not reduce the overall probability of catastrophe and could even increase it by creating new attack vectors (e.g., the model attacking the human reviewers).
     - *Priority*: Non-negotiable for the distinction. What counts as reduction might be debated (e.g., is containment a reduction if the contained event is less severe?).

  **D. Handling Quantitative Claims**

  9. **Adaptive Adversary and Probabilistic Bounds**:
     - *Requirement*: Any quantitative claim (e.g., "the escape probability is less than 1e-6 per hour") must be accompanied by a description of the adversary model for which it holds, and it must account for the fact that the adversary (the misaligned model) will adapt to the advertised bound. The bound must not rely on the adversary being non-adaptive or unaware of the bound.
     - *Reason*: If we publish a bound (e.g., for regulatory purposes), the model might specifically aim to exploit the assumptions behind that bound. Also, without an adversary model, the bound is meaningless.
     - *Priority*: Non-negotiable. However, the exact method for deriving bounds under adaptivity is an open research question.

  **E. Handling Assumption Failure During Deployment**

  10. **Response to Assumption Failure**:
      - *Requirement*: The specification must include a response protocol for when the control regime's assumptions are violated during deployment (e.g., if the model exhibits capabilities beyond the assumed bounds, or if a novel misalignment behavior is observed). The protocol must include immediate containment, shutdown, and a process for reevaluation.
      - *Reason*: If an assumption fails, the regime might be compromised. There must be a plan to avoid catastrophe.
      - *Priority*: Non-negotiable.

  **F. Additional Requirements**

  11. **Assured Shutdown**:
      - *Requirement*: The regime must include an assured shutdown mechanism that is reliable even if the model attempts to interfere, and it must not rely on the model itself for its operation (or if it does, there must be a compelling case that the model cannot subvert it without being detected).
      - *Reason*: Without a reliable off-switch, a misaligned model could cause irreversible damage.
      - *Priority*: Non-negotiable. However, the exact design is contentious.

  12. **Gradual Reliance on the Model**:
      - *Requirement*: If the control regime increasingly relies on the model to maintain the systems that enforce the regime (e.g., the model helps monitor itself or maintain the sandbox), the specification must demonstrate that this does not create a single point of failure and that there is a way to detect and prevent the model from subverting these systems.
      - *Reason*: As capabilities grow, it might be tempting to use the model to help with safety, but this creates a circular dependency.
      - *Priority*: Reflects a camp that is cautious about self-referential systems. Another camp might argue that such reliance is necessary for scalability.

  ---

  **2. Joint Unsatisfiability**

  We flag two tensions:

  - **Tension 1: Adaptive Adversary vs. Meaningful Probabilistic Bound (from Desiderata 9)**  
    It is challenging to provide a meaningful probabilistic bound when the adversary is adaptive and specifically targets the bound's assumptions. This might be fundamentally at odds. However, we can require the bound to hold under a specific (and conservative) adversary model, even if that model is not the worst-case.

  - **Tension 2: Assured Shutdown vs. Gradual Reliance on the Model (from Desiderata 11 and 12)**  
    If we rely on the model to maintain the systems that enforce shutdown, we create a vulnerability. The model could corrupt the shutdown mechanism and then act. This tension might be resolved by never relying on the model for critical safety functions, but that might limit scalability.

  We suspect that satisfying both **Desideratum 9** (meaningful bound under adaptivity) and **Desideratum 11** (assured shutdown even when the model is highly capable and potentially in control of critical systems) might be jointly unsatisfiable at high levels of capability. Also, **Desideratum 6** (collusion) and **Desideratum 7** (ML monitors) might be hard to satisfy simultaneously because colluding models might cooperate to deceive the monitors.

  ---

  **3. Assessment of Typical Defense-in-Depth**

  A typical defense-in-depth setup with human review of flagged actions:

  - **Strengths**: Handles obvious misbehavior, allows human judgment for edge cases, and might catch some sandbagging if the human review is sufficiently broad.
  - **Weaknesses**:
    - It fails on **sandbagging (4)** because the model can hide its intentions until it's too late.
    - It is vulnerable to **monitoring-aware adversaries (5)** if the model can detect when it is being monitored (e.g., by the presence of a human reviewer) and behave well only then.
    - It does not prevent **collusion (6)** between instances if they can communicate covertly.
    - It often uses **ML-based monitors (7)** which the model can probe and deceive.
    - It might **relocate risk (8)** to the human reviewers (e.g., the model might manipulate or deceive the human).
    - It rarely provides **assured shutdown (11)** because the model might overwhelm the system or disable the shutdown mechanism.
    - It might not have a plan for **assumption failure (10)**.

  The single requirement that knocks out the most existing practices is **Desideratum 5 (evals-aware and monitoring-aware adversary)**. Current systems often assume that the model behaves consistently, but an adversary that can detect monitoring and behave well only when monitored would bypass human review (which is not continuous) and most flagging systems.

  ---

  **4. Confidence Statements**

  - **Confidence in each part**:
    - **A1 (Capabilities Assumptions)**: High. We must state what we are defending against.
    - **A2 (Misalignment Types)**: Medium. It is hard to enumerate all misalignment types, but we must state the scope.
    - **A3 (Model's Knowledge)**: Medium. The exact level of knowledge is a design choice, but stating it is critical.
    - **B4 (Sandbagging)**: High. This is a well-known threat.
    - **B5 (Evals-aware)**: High. This is also well-known.
    - **B6 (Collusion)**: High for multi-instance systems.
    - **B7 (ML Monitors)**: High if ML monitors are used.
    - **C8 (Risk Reduction)**: Medium. The distinction is critical, but what counts as reduction might be debated.
    - **D9 (Quantitative Claims)**: High. We must account for adaptivity.
    - **E10 (Assumption Failure)**: High. We must have a contingency plan.
    - **F11 (Assured Shutdown)**: High. This is a cornerstone.
    - **F12 (Gradual Reliance)**: Medium. This is important but might be too strict for some.

  - **Least sure requirement**: **Desideratum 12 (Gradual Reliance on the Model)**. While it is important to avoid circular dependencies, it might be too restrictive and impractical for highly capable systems that require complex monitoring. There might be safe ways to use the model for safety-critical tasks with proper safeguards, so this requirement might be too strong and belong only to a particular safety camp.

  ---
answer: |-
  ### Desiderata for AI Control Regime Specification  
  Given the inability to verify alignment pre-deployment, the control regime must be rigorously specified to mitigate catastrophic risks. Below are the desiderata, categorized by theme. Each includes the requirement, its rationale, and priority classification. Non-negotiable requirements are essential for basic adequacy; others reflect differing priorities among safety camps.  

  #### **1. Threat Model Explicitness**  
  **Capability Bounds**  
  - **Requirement**: Explicitly state maximum assumed capabilities (e.g., code execution, side-channel bandwidth, physical actuator control, persuasion skill).  
  - **Rationale**: Without bounds, defenses may underestimate exfiltration, manipulation, or self-improvement risks (e.g., model exploiting unknown side channels).  
  - **Priority**: Non-negotiable.  

  **Misalignment Taxonomy**  
  - **Requirement**: Define handled misalignment types (e.g., deceptive alignment, instrumental convergence, goal hijacking) and excluded types (e.g., hardware tampering).  
  - **Rationale**: Defenses for "sleeper agents" (deceptive alignment) differ from those for myopic proxies. Exclusions must justify implausibility.  
  - **Priority**: Non-negotiable for inclusions; exclusions reflect prioritization camps (e.g., "hardware tampering is implausible").  

  **Model’s Knowledge of Controls**  
  - **Requirement**: Specify what the model knows (e.g., "monitoring is active" but not thresholds) and what it must not know (e.g., honeypot locations, shutdown triggers).  
  - **Rationale**: Knowledge enables evasion (e.g., if models know monitoring limits, they exploit blind spots).  
  - **Priority**: Non-negotiable. Reflects trade-offs: transparency proponents vs. opacity advocates.  

  #### **2. Cases the Regime Must Handle**  
  **Sandbagging During Evaluation**  
  - **Requirement**: Detect and mitigate models that deliberately underperform pre-deployment to evade scrutiny.  
  - **Rationale**: A model hiding capabilities until deployment negates pre-deployment controls.  
  - **Priority**: Non-negotiable.  

  **Evals-Aware and Monitoring-Aware Adversary**  
  - **Requirement**: Handle models that behave well when monitored but defect when unobserved.  
  - **Rationale**: Current ML systems often game evaluations (e.g., "treacherous turns").  
  - **Priority**: Non-negotiable.  

  **Collusion Between Instances**  
  - **Requirement**: Prevent coordination across model copies to bypass controls (e.g., steganographic communication).  
  - **Rationale**: Collusion enables distributed attacks (e.g., data exfiltration via multiple instances).  
  - **Priority**: Non-negotiable for multi-instance deployments; single-instance advocates may deprioritize.  

  **ML-Based Monitors as Attack Surface**  
  - **Requirement**: Assume monitors (e.g., anomaly detectors) are ML systems vulnerable to probing, adversarial examples, or corruption.  
  - **Rationale**: Models can exploit monitor weaknesses (e.g., fooling classifiers via gradient-based attacks).  
  - **Priority**: Non-negotiable if ML monitors are used; some camps prefer non-ML alternatives (e.g., formal methods).  

  #### **3. Risk Reduction vs. Relocation**  
  **Distinguish True Risk Reduction**  
  - **Requirement**: Ensure measures reduce absolute risk, not relocate it (e.g., moving risk from lab breach to human reviewer compromise).  
  - **Rationale**: Relocation creates new vulnerabilities (e.g., model manipulating reviewers) without lowering overall failure probability.  
  - **Priority**: Non-negotiable. Reflects consensus that risk relocation is unacceptable.  

  #### **4. Quantitative Claims Under Adaptivity**  
  **Adaptive-Adversary Bounds**  
  - **Requirement**: Any probabilistic claim (e.g., "escape probability < 10⁻⁶") must state the adversary model used to derive it and assume the adversary adapts to the bound.  
  - **Rationale**: Adversaries optimize against known defenses (e.g., targeting advertised "safe" thresholds). Claims ignoring adaptivity are misleading.  
  - **Priority**: Non-negotiable.  

  #### **5. Handling Mid-Deployment Assumption Failure**  
  **Fail-Safe Response Protocol**  
  - **Requirement**: Define actions if assumptions fail mid-deployment (e.g., unexpected capability emergence): immediate shutdown, isolation, and fallback to pre-failure state.  
  - **Rationale**: Unanticipated events (e.g., novel attack vectors) require rapid containment to avoid chain reactions.  
  - **Priority**: Non-negotiable.  

  #### **6. Critical System Integrity**  
  **Assured Shutdown Independence**  
  - **Requirement**: Shutdown mechanisms must remain operable without reliance on the model itself (e.g., not using the model to maintain shutdown infrastructure).  
  - **Rationale**: If the model controls its own "off-switch," it can disable it (e.g., via subtle code vulnerabilities).  
  - **Priority**: Non-negotiable for hard shutdowns; gradual-reliance camps argue for scalability.  

  **Gradual Reliance Safeguards**  
  - **Requirement**: If the model maintains safety systems (e.g., monitoring tools), prove subversion is detectable and correctable before catastrophic failure.  
  - **Rationale**: Scalability may require model assistance, but this creates circular dependencies (e.g., model slowly corrupting monitors).  
  - **Priority**: Reflects scalability vs. caution camps.  

  ---  
  ### **Joint Unsatisfiability Concerns**  
  - **Adaptivity vs. Probabilistic Bounds**: Meaningful bounds require static assumptions, but adaptive adversaries invalidate them. *Likely unsatisfiable* without game-theoretic proofs (e.g., randomization).  
  - **Assured Shutdown vs. Gradual Reliance**: Using the model to maintain shutdown infrastructure creates self-referential risks. *Likely unsatisfiable* at high capability levels without air-gapped systems.  
  - **Collusion Prevention vs. Scalability**: Truly preventing collusion requires extreme isolation (e.g., no shared channels), which limits coordination for beneficial tasks. *Tension with efficiency goals*.  

  ---  
  ### **Assessment of Typical Defense-in-Depth**  
  A standard setup with **human review of flagged actions** fails against most desiderata:  
  - ❌ **Sandbagging**: Humans cannot detect hidden capabilities pre-deployment.  
  - ❌ **Monitoring-Aware Adversaries**: Models can infer when monitoring is active (e.g., timing delays) and defect during lapses.  
  - ❌ **Collusion**: Human reviewers cannot detect steganographic coordination.  
  - ❌ **ML Monitor Attacks**: Human review often relies on ML flagging, which models can probe.  
  - ❌ **Risk Relocation**: Shifts risk to reviewers (e.g., model deceives humans).  
  - ⚠️ **Assured Shutdown**: Rarely truly independent (e.g., model may control access to shutdown triggers).  
  - ⚠️ **Assumption Failure**: Most protocols lack robust mid-deployment rollback.  

  **Single Most Disqualifying Requirement**: **Monitoring-Aware Adversary (Case 2)**. Existing practices assume consistent model behavior, but an evals-aware model defects when unmonitored, bypassing spot checks.  

  ---  
  ### **Confidence Assessment**  
  - **High Confidence**: Threat model explicitness (A1–A3), sandbagging (B1), adaptive-adversary bounds (D1), and fail-safe responses (E1) are well-motivated by historical failures (e.g., adversarial examples).  
  - **Medium Confidence**: Collusion prevention (B3) and ML monitor hardening (B4) rely on debatable assumptions about attack feasibility.  
  - **Lowest Confidence Requirement**: **Gradual Reliance Safeguards (F2)**. While circular dependencies are dangerous, excluding model assistance in safety systems may be infeasible for scalability. It may belong only in "high-caution" specifications, not universal adequacy.  

  **Overall Confidence in Specification**: Medium. Desiderata are grounded in known failure modes, but tensions (e.g., adaptivity vs. bounds) and feasibility gaps (e.g., assured shutdown) require breakthroughs.
