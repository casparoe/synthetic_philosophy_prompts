  The core tension leaps out: (2) claims two numerically distinct objects (clay+lump) in the same place, (3) says they're qualitatively identical, but (5) Leibniz's Law says identical things share all properties. The user acknowledges this but wants to know if it's fatal. 

  Let me map the pressure points systematically. First, the Leibniz's Law challenge: if the statue and clay share all properties (including relational ones like "being on a plinth"), what grounds their numerical difference? The user mentions modal properties (persistence conditions) as the differentiator in (2), but (4) says persistence conditions supervene on qualitative properties. If they're qualitatively identical, how can persistence conditions differ? That's the real killer.

  The user's hinted escape hatch - whether sortals like "being a statue" count as qualitative - won't work. If sortals are qualitative, then by (3) they shouldn't differ; if not, then (4) is violated because persistence conditions (which depend on sortals) aren't grounded in qualitative properties. 

  Other commitments complicate this: (7)'s restricted composition helps by blocking extra objects, but (6)'s rejection of Identity of Indiscernibles is crucial here. The user needs distinct but indiscernible objects to exist, which is coherent but leaves the "grounding" problem wide open. (8)'s endurance requirement blocks 4Dist solutions.

  The least costly fix? Modify (4). If persistence conditions aren't grounded in qualitative properties, the clay and statue can be qualitatively identical but modally different. But this costs the user their anti-haecceitist stance - they'd have to accept primitive "thisness" for objects. Alternatively, tweak (3) to allow sortal-dependent properties as qualitative, but that risks making all properties sortal-relative and collapsing the distinction between qualitative and non-qualitative.

  For workshop prep, I should emphasize how to present this: lead with the grounding problem in (4) as the critical tension, show why other apparent conflicts (like with Leibniz's Law) are derivative, and explicitly weigh the revision costs. The user's "no glossing over sortals" request means I must address whether "being a statue" is a qualitative property head-on - probably concluding it's not, but that creates the grounding issue.
answer: |-
  Here is a consistency audit of your package, ranked by severity of tension, followed by a proposed revision and its costs. **The core tension is genuine and severe**, but targeted revision can restore coherence.

  ### Genuine Tensions (Ranked by Severity)
  1. **Severe Tension: (3) + (4) + (5) + (2)**  
     - **Conflict**: (3) claims the clay and statuette are *qualitatively indiscernible*. (4) states that persistence conditions supervene on qualitative character (e.g., kind membership). (2) asserts they have *different persistence conditions* (clay survives squashing, statuette does not). (5) (Leibniz’s Law) implies that if they share all properties, they are identical—but (2) denies identity.  
     - **Why it’s fatal**: If persistence conditions differ, (4) requires a *qualitative difference* to ground this (e.g., kind-properties). But (3) denies any qualitative difference. If no qualitative difference exists, (4) is violated (persistence conditions lack a supervenience base). If persistence conditions *are* qualitative properties, (5) + (2) imply a contradiction (distinct objects sharing all properties).  

  2. **Apparent Tension (Dissolves on Analysis): (2) + (5) + (6)**  
     - **Apparent Conflict**: (2) posits distinct but coincident objects. (5) (Leibniz’s Law) requires identical objects to share all properties. (6) rejects the Identity of Indiscernibles (II), allowing distinct qualitatively identical objects.  
     - **Why it dissolves**: Leibniz’s Law (5) governs *identity*, not coincidence. Coincident objects (like clay/statue) *can* share all *non-modal* qualitative properties while differing in *modal* properties (e.g., persistence) without violating (5). (6) explicitly permits this by denying II. Thus, (2) and (5) are compatible if modal properties (like persistence conditions) are not shared.  

  3. **Apparent Tension (Dissolves): (1) + (7)**  
     - **Apparent Conflict**: (1) demands realism about artifacts (statues exist), while (7) restricts composition to "genuine kinds." This might seem arbitrary.  
     - **Why it dissolves**: You can consistently hold that "statue" is a genuine kind triggering composition, while "nose-Eiffel Tower fusion" is not. (7) doesn’t specify what counts as a "genuine kind," so it’s compatible with (1) if artifact kinds are legitimate.  

  4. **Apparent Tension (Dissolves): (8) + (2)**  
     - **Apparent Conflict**: Endurantism (8) might seem challenged by coincident objects occupying the same space at the same time.  
     - **Why it dissolves**: Endurance is compatible with coincidence (e.g., Aristotelian hylomorphism or "double location" theories). The clay and statue are both wholly present at the same location without requiring temporal parts.  

  ---

  ### The Required Revision: Modify (4) to Allow Non-Qualitative Grounding
  **Revised Commitment**:  
  > **(4*)** *Weakly Grounded Persistence*: A thing’s persistence conditions supervene on its *kind membership*, but kind membership is not a purely qualitative property. It is a primitive, non-qualitative fact about an object that it belongs to a kind (e.g., *statue* or *lump of clay*), which grounds its persistence conditions.  

  **How This Resolves the Core Tension**:  
  - The clay and statuette now differ in their non-qualitative kind properties (one is essentially a lump, the other essentially a statue).  
  - This difference grounds their divergent persistence conditions without requiring *qualitative* indiscernibility (3) to be false. They can share all *qualitative* properties (shape, mass, origin, etc.) but differ in non-qualitative kind essences.  
  - Leibniz’s Law (5) is satisfied because identity requires sharing *all* properties, including non-qualitative ones (like kind membership). Since they differ in kind, they are non-identical.  
  - (2) is preserved: Distinctness arises from kind-dependent modal differences.  
  - (6) is upheld: Distinct objects can share all *qualitative* properties.  

  **Costs of This Revision**:  
  - **Cost to Original (4)**: You sacrifice the anti-haecceitist spirit of (4). Kind membership becomes a primitive, non-qualitative fact about an object. Persistence conditions are no longer grounded in purely qualitative features but in irreducible kind essences. This is a form of *moderate essentialism*.  
  - **Impact on (3)**: "Being a statuette" and "being a piece of clay" are now explicitly *non-qualitative* properties. This clarifies your indecision: they are sortal properties that fix identity and persistence but aren’t reducible to qualitative descriptors like shape or mass.  
  - **Impact on Persistence Verdict (2)**: Your verdict about the case (clay survives, statuette perishes) remains intact, but its justification now relies on primitive kind membership. You lose the intuition that persistence is grounded in "what the object is like" qualitatively.  
  - **No Cost to Other Commitments**: (1), (5), (6), (7), and (8) are fully preserved.  

  **Why This is the Least Costly Revision**:  
  - Alternatives (e.g., abandoning (3) or (2)) force greater sacrifices:  
    - Denying (3) (claiming qualitative differences) undermines the core motivation for coincidence (e.g., why posit two objects if they differ qualitatively?).  
    - Denying (2) (collapsing to one object) forces monism, violating (1) and (6).  
    - Rejecting (5) (Leibniz’s Law) is metaphysically untenable for identity.  
  - This revision targets the specific point of failure (grounding modal differences) while preserving the explanatory structure of your view.  

  ---

  ### Defense Against a Strong Objection
  **Objection**: "Primitive kind membership is haecceitism in disguise. If kind properties are non-qualitative, what determines whether a portion of matter constitutes a statue or just a lump? This seems arbitrary."  
  **Your Response**: Kind membership is not arbitrary; it is fixed by facts about composition and function. On Tuesday, when the clay is shaped *intentionally into a statue*, the kind *statue* is instantiated. This is a mind-dependent but objective fact (per 1). The lump’s kind (*lump of clay*) is mind-independently instantiated by its material. The non-qualitative difference arises from these *distinct instantiation conditions*, not brute haecceities.  

  **Result**: Your package—revised at (4)—is now consistent and retains the key features of your case while accepting a modest essentialism about kinds.
