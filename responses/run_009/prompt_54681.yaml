  First, I need to understand their core requirements. They want a step-by-step process that's grounded in metaphysics but practical. The procedure should handle three main theories: material continuity, structural/functional continuity, and conventionalism. It must be executable in an afternoon, with clear steps and distinctions between factual and value judgments. 

  The fission case (like the barn being rebuilt in two places) is tricky. Philosophers like Parfit have discussed this, suggesting that identity might not always hold. The procedure needs to address this honestly, possibly by saying that both claims have partial validity but neither is fully the original. 

  Then there are the real cases: the bridge with 80% new timber, the ship with 60% new material, and the logging flume rebuilt every 15 years. Each tests different aspects. The flume is particularly interesting because it's designed to be temporary, challenging material continuity. 

  I should structure the procedure into phases. Start with material continuity (factual), then structural/functional continuity (mixed), then conventional criteria (policy-based). Each step should have clear thresholds and decision points. For the fission case, step three would handle it by assessing both claims against the criteria, likely resulting in a split or conventional decision. 

  The reviewers aren't logicians, so the steps need to be straightforward. For example, calculating the percentage of original material is a factual step. But deciding the importance of continuous function involves policy, so that should go to a senior person or board. 

  Failure modes: Things like ropes or sails designed for replacement don't fit well. Also, structures tied to their use (like a market) might prioritize function over material. The procedure should flag these cases and require higher-level review. 

  The user hinted that one outcome might be unpopular. The flume case, being intentionally temporary, might not qualify under material or structural continuity, leading to a "no." That could be contentious if locals see it as historic despite rebuilds. Being upfront about this is key. 

  Finally, making the output defensible is crucial. Clearly documenting each step's rationale and where judgments were made will help when facing county commissions. Highlighting the conventional aspects ("we value continuity of use") can justify decisions based on community values.
answer: |-
  Here’s a practical, metaphysics-grounded decision procedure for structural identity claims, designed for heritage reviewers. It uses three lenses (material, structural/functional, conventional) sequentially and flags value judgments transparently. The goal is **defensible decisions, not philosophical perfection**.

  **Core Principle:**  
  Identity isn’t binary but a **weighted continuum**. The procedure assigns points (0–3) per lens, then totals them. Thresholds determine outcomes. Policy choices are isolated to specific steps.

  ---

  ### **The Procedure: "Tri-Lens Assessment" (TLA)**  
  *Reviewer completes Steps 1–3; Steps 4–5 involve senior staff/board if needed.*

  #### **Step 1: Material Continuity (The "Stuff" Lens)**  
  *Factual question: How much original physical material remains?*  
  - **Method:** Estimate % of original material (by volume/mass) still integral to the structure.  
    - *Key evidence:* Conservation reports, material audits, replacement logs.  
    - *Ignore:* Non-structural elements (e.g., replaceable ropes, roof shingles).  
  - **Thresholds:**  
    - ≥50% original material → **3 pts**  
    - 25–49% → **2 pts**  
    - 5–24% → **1 pt**  
    - <5% or no original material → **0 pts**  
  - **Terminate early?** Only if ≥50% → strong presumption of identity (proceed to Step 2 to confirm).

  #### **Step 2: Structural/Functional Continuity (The "Form/Process" Lens)**  
  *Mixed question: Does it maintain the same design, function, and continuity?*  
  - **Sub-question 2A (Factual):**  
    - Is the core structure (load-bearing elements, primary layout) unaltered?  
    - Has it been continuously in the same location?  
    - *Evidence:* Architectural plans, site surveys, usage records.  
  - **Sub-question 2B (Policy/Judgment):**  
    - Has its *primary historic function* been maintained? (e.g., a bridge carrying traffic, a church hosting worship).  
    - *Who decides?* **Senior Registrar** (using office guidelines on functional significance).  
  - **Scoring:**  
    - Both 2A and 2B YES → **3 pts**  
    - 2A YES but 2B NO (e.g., museum ship) → **2 pts**  
    - 2A NO (moved/altered layout) but 2B YES → **1 pt**  
    - Both NO → **0 pts**  

  #### **Step 3: Conventional Criteria (The "Human Interest" Lens)**  
  *Policy question: Do stakeholders/community treat it as the same entity?*  
  - **Sub-questions:**  
    - Is it listed on the same register entry/parcel?  
    - Has there been continuous legal ownership?  
    - Is it widely recognized as the same by the community? (e.g., same name, cultural ceremonies).  
  - **Scoring (Policy-weighted):**  
    - All 3 YES → **3 pts**  
    - 2 YES → **2 pts**  
    - 1 YES → **1 pt**  
    - 0 YES → **0 pts**  
  - **Who decides?** **Reviewer** (using deeds, register history, public input).

  ---

  ### **Step 4: Totals & Decision**  
  - **9 pts:** Unambiguously the same → **"YES"**  
  - **6–8 pts:** Likely the same → **"YES"** (with documentation of compromises)  
  - **4–5 pts:** Borderline → **"CONDITIONAL YES"** (requires board review; may need amended register entry)  
  - **0–3 pts:** Not the same → **"NO"**  

  ### **Step 5: Fission Cases (e.g., Two Barns Claiming Identity)**  
  - Run TLA for **both** candidates.  
  - **If one scores ≥6 pts and the other ≤3:** Higher scorer is the successor.  
  - **If both score 4–5 pts:** **Neither is the original**. The identity "splits."  
    - Outcome: Board decides based on policy goals (e.g., "Which best serves preservation?").  
    - **Honest answer:** Identity fails; this is a *new* metaphysical category. Update the register accordingly.

  ---

  ### **Application to Your Cases**  
  *(Assumes typical office policy weights)*  

  1. **Covered Bridge (80% new timber, same site, still in use)**  
     - Step 1: 20% original → **1 pt**  
     - Step 2: Layout/location same (2A YES), function same (2B YES) → **3 pts**  
     - Step 3: Same register entry, community sees as same → **3 pts**  
     - **Total: 7 pts → "YES"**  

  2. **Harbor Ship (60% new, museum display)**  
     - Step 1: 40% original → **2 pts**  
     - Step 2: Core structure same (2A YES), but not functional (museum) → **2 pts**  
     - Step 3: Same register entry, recognized as same → **3 pts**  
     - **Total: 7 pts → "YES"**  

  3. **Logging Flume (Rebuilt every 15y from scratch, same design/location)**  
     - Step 1: ~0% original (rebuilt from scratch) → **0 pts**  
     - Step 2: Layout/function same (2A & 2B YES) → **3 pts**  
     - Step 3: Same register entry? Likely yes → **3 pts**  
     - **Total: 6 pts → "YES"**  
     - **🚩 Flag:** *This is the controversial one.* Under material lens, it fails. But TLA's weighting of function/convention overrides this. **If your policy prioritizes material**, this outcome may conflict. Senior staff must justify.

  ---

  ### **Predictable Failure Modes**  
  1. **Ephemeral Components:** Sails, ropes, or machinery designed for replacement.  
     - *Fix:* Exclude them from Step 1 calculations (define "structural core" in guidelines).  
  2. **Use-Over-Material Sites:** Markets, fairs, or ritual spaces where "identity" is the activity.  
     - *Fix:* In Step 2B, **Senior Registrar** can assign higher weight to function.  
  3. **Radical Relocation:** Moving a structure *intact* (e.g., a relocated lighthouse).  
     - *Fix:* Step 2A penalizes location change, but Step 3 may compensate if community acceptance is high.  
  4. **"Theseus Thresholds":** Disputes over % material or functional significance.  
     - *Fix:* Require documented evidence; board resolves ambiguities.  

  ### **Why This Works for Your Context**  
  - **Time:** Steps 1–3 take <2 hours (uses existing records).  
  - **Defensibility:** Points system shows structured reasoning. Value judgments are isolated (Step 2B, Step 3) and assigned to appropriate staff.  
  - **Metaphysics Honesty:** Acknowledges all three theories but subjugates them to policy where needed.  
  - **Fission Clarity:** Forces hard cases to board review, avoiding false binaries.  

  **Final Output:** A memo with scores per lens, decision rationale, and flagged policy judgments. When commissioners yell, point to the thresholds *they* implicitly approved via your office’s published guidelines.
