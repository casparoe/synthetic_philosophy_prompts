answer: |-
  Here are 10 conversational interview questions (including follow-ups) for your podcast, crafted in British English and designed to probe the philosopher's thesis deeply, ending with the toughest challenge:

  1.  **Core Concept:** "Your book argues that sticking to everyday conventions like queueing or tipping isn't just polite, it's a *moral* duty because we're avoiding free-riding. But conventions like *how* we queue – first-come-first-served versus taking a number – seem completely arbitrary. If the specific solution is arbitrary, what exactly is the moral obligation *to that specific convention* actually tracking? Is it just the bare fact that *a* convention exists?"
      *   *Likely Follow-up (if she emphasises coordination):* "So, if a chaotic but functional system emerged organically at a bus stop without a strict queue – say, people just sort of remembering who arrived when – would adhering to *that* messy system carry the same moral weight as a formal queue, simply because it coordinates?"

  2.  **Visitors & Ignorance:** "Let’s talk about visitors. Imagine a tourist arrives in London, completely unaware of the queueing norms, and accidentally jumps the queue at the bakery. Are they morally blameworthy? Does genuine ignorance excuse them in a way that, say, laziness about finding out the rules wouldn't?"
      *   *Likely Follow-up (if she allows ignorance as an excuse):* "Does that mean there's an *additional*, prior moral duty on travellers to actively try and learn the local conventions *before* they might accidentally violate them? How demanding is that duty – is it just a quick Google, or must they deeply research local etiquette guides?"

  3.  **Jaywalking & Law:** "Jaywalking is a great test case. In some places, it's a strong convention backed by law and safety concerns. In others, like many UK high streets when traffic is clear, it's pure convention or even expected. If I jaywalk safely where it's pure convention, am I committing the same *kind* of moral wrong as I would where it's illegal? Does the law change the *moral* weight, or just add a fine and legal risk?"
      *   *Likely Follow-up (if she downplays the law's moral role):* "So, if the core moral wrong is *always* the free-riding on the coordination convention (waiting when others wait, crossing when others cross), then the legal prohibition itself is almost redundant from a moral perspective? It's just an enforcement mechanism?"

  4.  **The Etiquette Objection - Dilution:** "One obvious pushback is this: if queueing, tipping, *and* not murdering all become 'moral obligations', doesn't that stretch the concept of morality too thin? Doesn't lumping 'didn't wave thanks on the motorway' in with genuinely grave wrongs risk making morality seem trivial, or losing the sense that it deals with things of fundamental seriousness?"
      *   *Likely Follow-up (if she argues all coordination-based duties are genuinely moral, just less weighty):* "How do we practically navigate this flattened landscape? If morality now encompasses *everything* from queue-jumping to assault, how do we communicate the vast difference in seriousness without implying the smaller things *aren't* moral matters? Isn't 'etiquette' a useful category for precisely these lower-stakes coordination norms?"

  5.  **Defeasibility in Practice:** "You rightly say these duties can be overridden by weightier concerns – dashing into a shop queue because your child is having an asthma attack is obviously excusable. But what about less dramatic overrides? Is being genuinely, desperately late for a job interview enough to morally excuse nipping ahead in the queue? Where’s the line for ‘weightier’ in everyday life?"
      *   *Likely Follow-up (if she emphasises context/judgement):* "Doesn't this reliance on personal judgement in grey areas risk collapsing back into just being about social perception or 'what you can get away with', rather than a clear moral obligation?"

  6.  **Bad Conventions?** "Not all conventions are benign. Historically, conventions enforced social hierarchies or exclusions. Imagine a modern, harmful convention emerges – perhaps in a workplace, an unspoken norm that the youngest person always makes the tea, creating an unfair burden. Is conforming to *that* convention still a moral obligation because it coordinates behaviour, or is there a point where the convention's *content* morally obliges us *not* to follow it?"
      *   *Likely Follow-up (if she argues harmful conventions lack moral force):* "How does that fit with your Lewis/Ullmann-Margalit foundation? If the coordination *works* (the tea gets made, albeit unfairly), doesn't the free-rider argument technically still apply to someone who dodges the duty? Does your theory need an extra element judging the *justice* of the convention itself?"

  7.  **The Cost of Conformity:** "Some conventions impose quite unequal burdens. Tipping culture, for instance, arguably places a significant moral/financial burden on customers to subsidise wages, benefiting employers. If I consistently under-tip (where it's expected) because I object to the system, am I still just a free-rider exploiting others' conformity, or could my defiance be a morally justified protest against an unfair convention?"
      *   *Likely Follow-up (if she leans towards it still being free-riding):* "Does that mean morality requires us to prop up potentially unfair systems simply because they're the established convention? How can change ever happen morally under this view?"

  8.  **Enforcement & Social Pressure:** "If queue-jumping is genuinely a *moral* wrong akin to free-riding, does that change how we should respond? Should we feel morally licensed, or even obliged, to challenge queue-jumpers more forcefully than if it were 'just' rude? Does recognising it as moral elevate the status of the tut or the pointed 'I was next!'?"
      *   *Likely Follow-up (if she suggests social enforcement is part of it):* "Where's the line between legitimate moral sanction and becoming the 'queue police'? Couldn't overly aggressive enforcement itself become a social ill?"

  9.  **The Slippery Slope of Coordination:** "You trace the obligation back to solving coordination problems. But life is *full* of potential coordination problems – from which side of the pavement to walk on, to complex unspoken rules in workplaces. How do we determine *which* coordination problems rise to the level of generating a *moral* obligation through convention? What stops *everything* becoming moralised?"
      *   *Likely Follow-up (if she offers criteria like salience/widespread adoption):* "Take pavement-walking: the convention exists (usually keep left!), it solves a coordination problem, it's widespread. Is violating it (say, weaving unpredictably) therefore a *moral* failing, not just annoying? If not, why does queueing cross the line but pavement-walking doesn't?"

  10. **The Killer Question (The Achilles' Heel):** "Let's imagine a society with very weak, fragmented conventions. People *mostly* queue, but it's not unusual to see someone politely ask to go ahead because they're in a rush, and often others agree. There's no strong social stigma for the occasional nip ahead if done apologetically, and the system *sort of* works. According to your theory, in this society, is queue-jumping still a *moral* failing? If the expectation of strict conformity isn't universal and the 'free-riding' isn't clearly harming a tightly coordinated system, does the moral obligation to strict queuing still hold? Doesn't this show the moral force is critically dependent on the *strength and universality of the expectation itself*, making the obligation feel more like a social fact than a deep moral truth?"

  **Key features of these questions:**

  *   **British English:** "Queue-jumping", "motorway", "bakery", "tut", "pavement", "nip ahead", "job interview".
  *   **Conversational:** Phrased as natural dialogue starters ("Let's talk about...", "Imagine...", "One obvious pushback is...").
  *   **Probing:** Go beyond restatement to challenge implications (arbitrariness, visitor status, law vs. custom, moral dilution, bad conventions, protest, enforcement, scope).
  *   **Follow-ups:** Anticipate common defences (excusing ignorance, law as enforcement, context for overrides, harmful convention critique) and push further (duty to learn, redundancy of law, judgement vs. rules, protest justification, enforcement limits, scope creep).
  *   **The Killer Question (#10):** Targets the core mechanism. If the obligation vanishes when expectations are looser, it suggests the moral force *is* derived purely from the social expectation's strength, not an inherent moral principle about coordination/free-riding itself. A weak answer here could make the whole thesis seem socially relative rather than morally grounded. It's fair but deeply challenging.

  Good luck with the interview! These should give your guest a great platform to defend and elaborate her fascinating thesis while keeping your listeners thoroughly engaged.
