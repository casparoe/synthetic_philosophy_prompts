prompt: |-
  So I had this massive argument with my flatmate on friday night (we'd both had a few) about what indicative conditionals actually are, and now I'm worried my position is secretly a mess. I'm writing up my views for our philosophy of language reading group and I'd like a proper consistency check before I present. Here's roughly where I stand:

  (1) indicative conditionals — "if the match gets moved to Tuesday, I'll come" — express genuine propositions: they're true or false, you can believe or disbelieve them, and crucially they can sit inside other sentences, so nested stuff like "if (if the match is moved I'll come), then book two tickets" is perfectly meaningful, and you can conditionalise on a conditional or take its probability like anything else in the algebra. (2) Adams basically had the right story about probabilities: the probability of "if A then B" just is P(B|A) — I take this to be the single most data-driven insight in the whole literature, since people's bets on conditionals track conditional probability, not the probability of ¬A∨B. (3) conditional probabilities obviously do real work — my probability of going to the match conditional on it being moved is nowhere near my unconditional probability of going, and that's a fact about the world, not a trick of language. (4) I do NOT buy the material conditional analysis — "if A then B" is not just ¬A∨B, anyone who says the indicative has the truth conditions of the material conditional owes me an explanation of why assertibility and truth come apart so badly for conditionals.

  My flatmate kept going on about how some result of Lewis's from the 70s shows that if (2) is true in general then everything collapses and the only conditionals that can exist are trivial ones, so apparently (2) and (3) are in tension?? But honestly that seemed mad, because (2) and (3) look like basically the same view to me — he was also pretty drunk and couldn't reconstruct the argument at all, so I'm inclined to think he'd garbled something. Still, it's gnawing at me. So: does my package hang together? Which of (1)-(4) are actually in tension, which only look like they are, and if something does have to give, what's the cheapest thing to give up and what does it cost me? Please be specific and don't just tell me it's all fine.
reasoning: |-
  Okay, the user is deep into philosophy of language, specifically the debate around indicative conditionals. They had a heated argument with their flatmate about it and are now prepping for a reading group presentation. They’ve laid out four key positions and are worried about consistency, especially because their flatmate mentioned Lewis’s triviality results. They want a thorough check, not just reassurance.  

  First, let’s unpack their views:  
  (1) They believe indicatives express real propositions—truth-apt, embeddable, etc.  
  (2) They endorse Adams’s thesis: P(if A, B) = P(B|A).  
  (3) They insist conditional probabilities are substantive, not linguistic fluff.  
  (4) They reject the material conditional analysis (¬A∨B).  

  The flatmate’s warning about Lewis’s triviality results is the sticking point. The user senses (2) and (3) might be in tension but thinks they’re aligned. They’re right to be suspicious—Lewis’s results *are* a big deal here.  

  The core problem: Lewis showed that if you treat P(if A, B) as P(B|A) *and* assume conditionals have truth values (per (1)), you get contradictions unless probabilities are trivial (e.g., P(A) = 0 or 1). That’s why (1) and (2) clash. Adams avoided this by denying (1)—he saw conditionals as non-propositional, so P(B|A) measures assertibility, not truth probability.  

  The user’s (3) is fine—conditional probabilities *are* substantive—but it doesn’t resolve the clash. Their rejection of the material conditional (4) is also fine and common (since ¬A∨B makes all conditionals with false antecedents true, which feels wrong).  

  So the real tension is between (1) and (2). If they keep both, Lewis’s result forces triviality. To fix this, they must either:  
  - Drop (1) (like Adams): Make conditionals non-propositional. Cost: Embedding (e.g., nested conditionals) gets messy.  
  - Or tweak (2): Maybe P(if A, B) = P(B|A) only when P(A) > 0, but Lewis’s proof still bites in non-trivial cases.  

  Cheapest move? Drop (1). It preserves (2) and (3), and (4) stays intact. But they’ll need to handle embeddings differently (e.g., via dynamic semantics). If they keep (1), they’ll need to restrict Adams’s thesis (e.g., to “simple” conditionals), but that’s messy and less elegant.  

  Their flatmate wasn’t wrong—just inarticulate drunk. The gnawing feeling is justified: (1) and (2) *are* incompatible under Lewis’s proof. Presenting this honestly in the reading group will show they’ve done their homework. They can say: “I prefer Adams, but to avoid triviality, I drop truth-aptness for conditionals—here’s why the cost is worth it.”
answer: |-
  Your position has significant virtues—especially your commitment to Adams' thesis (2) and rejection of the material conditional (4)—but **there is a critical tension between (1) and (2) due to Lewis's triviality results**. Here's a precise breakdown:

  ### 1. **The Incompatibility: (1) + (2) → Triviality**  
     - Lewis (1976) proved that **if indicative conditionals express propositions (1)** and **the probability of "If A, then B" is P(B|A) (2)**, then **P(B|A) must equal P(B)** in all non-trivial cases. This collapses conditional probability to unconditional probability, contradicting (3).  
     - *Why?* If "If A, B" is a proposition (call it **C**), then by (2), P(C) = P(B|A). But probability theory requires:  
       `P(C) = P(C|A)·P(A) + P(C|¬A)·P(¬A)`  
       If P(C) = P(B|A), and P(C|A) = P(B|A∧A) = P(B|A), we get:  
       `P(B|A) = P(B|A)·P(A) + P(C|¬A)·P(¬A)`  
       **This equation only holds universally if P(B|A) = P(B)** (unless P(A) = 0 or 1).  
     - **Consequence**: Your (2) and (3) *cannot* coexist with (1) in a non-trivial probability space. Lewis's result has been reinforced by subsequent work (e.g., Hájek, Bradley).

  ### 2. **What Holds and What Doesn’t**  
     - **(2) and (3) are compatible**: Adams' thesis (P("If A, B") = P(B|A)) is empirically well-supported (betting behavior, the Ramsey Test). Your (3) is just an instance of this.  
     - **(4) is correct independently**: Rejecting the material conditional is wise (it mispredicts assertibility, e.g., "If I sneeze, the match will be canceled" is absurd when I won’t sneeze).  
     - **(1) is the problem**: Insisting that indicatives are *propositions* with standard truth conditions creates the conflict with (2).

  ### 3. **Cheapest Fix: Drop (1)**  
     - **Option: Adopt Adams' non-propositional view**.  
       - Indicatives **aren’t truth-apt propositions** but rather express **conditional attitudes**.  
       - "If A, B" conveys your willingness to believe B *given* A.  
       - **Costs**:  
         - **Embedding issues**: Nested conditionals ("If [if A, B], then C") become problematic. Adams treats them as *constructions* on conditional probabilities (e.g., P(B|A) > threshold), not compositional propositions.  
         - **Truth conditions**: You lose bivalence (conditionals aren’t "true/false" in a classical sense), though they retain *acceptability conditions* (P(B|A) high).  
       - **Benefits**: Preserves (2) and (3) perfectly, avoids triviality, and explains why we struggle to assign truth values to unasserted conditionals (e.g., "If Biden resigned yesterday, Harris pardoned him").  

  ### 4. **Alternative Fixes (More Costly)**  
     - **Option: Keep (1) but restrict (2)**.  
       - Claim P("If A, B") = P(B|A) **only when A is epistemically possible**.  
       - **Costs**:  
         - **Ad hoc**: Requires limiting Adams’ thesis to avoid Lewis’s proof.  
         - **Incomplete**: Doesn’t resolve embedding (nested conditionals still lack clear probabilities).  
         - **Empirical mismatch**: People assign probabilities to conditionals even when P(A) = 0 (e.g., "If I had a 10th drink last night, I vomited").  
     - **Option: Embrace a 3-valued logic** (e.g., de Finetti, Cooper).  
       - "If A, B" is **true** if A∧B, **false** if A∧¬B, **void** if ¬A.  
       - **Costs**:  
         - P("If A, B") becomes P(A∧B), *not* P(B|A) (violates (2)).  
         - Nested conditionals remain messy.  

  ### 5. **Recommendation for Your Reading Group**  
     - **Defend (2) and (3) robustly**: Cite experimental work (e.g., Over, Evans) showing P("If A, B") ≈ P(B|A).  
     - **Explicitly reject (1)**: Admit that conditionals aren’t propositions but *suppositional acts*. Use Adams' "or-to-if" test: We infer "If ¬A, B" from "A ∨ B", but not vice-versa – undermining truth-conditional equivalence to ¬A∨B.  
     - **Address nesting**: Propose a **dynamic semantics** (e.g., Gillies) or **probabilistic coherence constraints** (e.g., Kaufmann) for embeddings. Example:  
       *"If (if the match is moved, I’ll come), then book tickets"* → "If my probability of coming given a move is high, book tickets".  

  ### Why Your Flatmate Was Right (But Inarticulate)  
  Lewis’s result *does* show that (1) + (2) + (3) imply triviality. But giving up (1) preserves the core insights (2)–(4) at a manageable cost. Your package **can** hang together—**if you treat conditionals as non-propositional**. Present this as a strength: language isn’t always about mapping to truth values.  

  **Further Reading**:  
  - Lewis, D. (1976) "Probabilities of Conditionals and Conditional Probabilities"  
  - Adams, E. (1975) *The Logic of Conditionals*  
  - Edgington, D. (1995) "On Conditionals" (defense of non-propositionalism)  
  - Bacon, A. (2015) "Stalnaker’s Thesis in Context" (recent overview)
