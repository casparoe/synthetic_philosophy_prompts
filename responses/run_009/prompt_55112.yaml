answer: |-
  Below is a tailored essay question, a model answer, and a detailed marking scheme for your final exam, designed to push students beyond superficial engagement with Black's spheres.

  ---

  ### **Essay Question (Suitable for 1,500-word take-home answer)**  
  **Max Black’s two-sphere universe and the challenge of symmetry: Physics meets metaphysics**  
  > In Max Black’s thought experiment, a universe contains nothing but two qualitatively identical spheres one mile apart. Leibniz’s Principle of the Identity of Indiscernibles (IoI) appears to fail, as there seems no qualitative property distinguishing them. However, three responses complicate this picture:  
  > (1) *The physicist’s gauge-symmetry view*: The rotation swapping the spheres is a gauge symmetry—a redundancy of description. Thus, there are two spheres, but no "haecceitistic fact" about which is which. IoI fails only if we demand such empirically undetectable facts.  
  > (2) *The philosopher’s objection*: Treating the swap as "mere redescription" *presupposes* anti-haecceitism (that objects lack primitive identities). This begs the question against haecceitism.  
  > (3) *The weak discernibility rescue*: Each sphere bears the irreflexive relation "is one mile apart from" to the other. Thus, they *are* discernible relationally, saving IoI in a weaker form.  
  >  
  > **Your task**: Adjudicate these positions. *Do not merely describe them.* Instead:  
  > - Explain why the gauge argument might *not* settle the metaphysical debate but instead relocate it.  
  > - Evaluate whether weak discernibility rescues IoI or redefines it—and whether spatial relations *presuppose* distinctness rather than establish it.  
  > - Conclude: Does Black’s universe refute IoI, or does symmetry (physical or metaphysical) resolve the problem? Defend your stance rigorously.  

  ---

  ### **Model Answer (Approx. 600 words)**  
  **The Illusion of Resolution: Why Symmetry and Relations Deepen Black’s Puzzle**  
  Black’s two-sphere universe remains a powerful critique of Leibniz’s Identity of Indiscernibles (IoI), but contemporary responses fail to resolve it satisfactorily. While the gauge-symmetry view and weak discernibility appear to save or dissolve the problem, both covertly rely on contested metaphysical assumptions.  

  The physicist’s gauge argument—that swapping the spheres is a descriptive redundancy—claims to dissolve haecceitism. Yet this argument *assumes* anti-haecceitism from the outset. To assert that the swap changes nothing *except description* presumes there are no primitive identities ("thisness") beyond qualitative properties. But haecceitists argue that distinct objects *require* such identities; denying them *because* symmetry holds is circular. The gauge move is thus not a neutral resolution but a *stipulation* of anti-haecceitism.  

  Weak discernibility, proposing that the irreflexive relation "one mile apart" discerns the spheres, similarly falters. Relations require relata: to say sphere A bears "distance from B" *presupposes* that A and B are distinct entities. This does not *ground* their distinctness but *depends* on it. Worse, it redefines IoI: Leibniz’s principle traditionally concerns intrinsic properties, not extrinsic relations. If IoI survives only by including relations, it becomes a weaker, arguably distinct principle. Black’s spheres might then be "discernible" in a technical sense, but this does not address whether they possess primitive identity.  

  The symmetry argument’s appeal to empirical undetectability also misfires. It conflates epistemic limitations (we cannot distinguish the spheres) with ontology (they lack distinct identities). Yet in quantum mechanics, indistinguishable particles exhibit symmetries with measurable consequences (e.g., Bose-Einstein statistics). Here, symmetry is physical, not gauge—but it still does not imply the particles lack identities; it constrains how we describe them. Black’s spheres, however, involve no such dynamics, exposing the gauge argument as a metaphysical choice.  

  Ultimately, Black’s universe *does* refute the strong version of IoI demanding intrinsic discernibility. Neither symmetry nor weak discernibility salvages it without circularity or redefinition. The gauge argument assumes anti-haecceitism, while weak discernibility presupposes distinctness to define relations. Rather than rescuing IoI, these moves reveal a deeper truth: distinctness might be primitive. In a sparse universe, two objects can be qualitatively identical yet numerically distinct—not due to detectable properties, but because existence itself implies plurality. Symmetry does not dissolve this; it highlights the limits of descriptive language.  

  **Conclusion**: Black’s spheres defeat IoI. Physics offers no free pass: its symmetries are tools for modeling, not arbiters of ontology.  

  ---

  ### **Marking Scheme (Out of 20 marks)**  
  **Five Must-Hit Moves**  
  1. **Explicitly identify circularity in the gauge argument** (4 marks)  
     *Common mistake:* Stating that symmetry implies anti-haecceitism without noting that it *presupposes* it.  
  2. **Critique weak discernibility: relations presuppose distinctness** (4 marks)  
     *Common mistake:* Accepting "one mile apart" as discerning without asking if relata must be distinct *before* the relation holds.  
  3. **Distinguish gauge symmetry (descriptive redundancy) from physical symmetry (with consequences)** (4 marks)  
     *Common mistake:* Conflating Black’s static spheres with dynamic symmetries in physics (e.g., quantum statistics).  
  4. **Explain why weak discernibility alters IoI’s meaning** (4 marks)  
     *Common mistake:* Treating relational discernibility as equivalent to Leibniz’s intrinsic discernibility.  
  5. **Take a clear stance on IoI’s validity post-analysis** (4 marks)  
     *Common mistake:* Concluding weakly (e.g., "it’s complicated") without defending a position.  

  **A vs. B Answer Differentiation**  
  - **B Answer (14–16/20)**: Accurately summarizes all three positions and identifies surface tensions (e.g., "gauge assumes anti-haecceitism").  
  - **A Answer (17–20/20)**: **Synthesizes tensions into a novel insight**, e.g., noticing that *both* gauge symmetry and weak discernibility covertly rely on the distinctness they aim to explain, or arguing that symmetry arguments *in physics* often serve pragmatic/descriptive roles that do not map cleanly onto metaphysical debates about primitive identity.  

  ---

  ### **Key Pedagogical Notes**  
  - This structure forces engagement with *how* the positions interact: e.g., weak discernibility is often deployed *against* haecceitism, yet its reliance on relations may beg the question similarly to the gauge argument.  
  - The model answer’s eliminativist stance (rejecting both rescues) is deliberately provocative—students could defend any position if argued rigorously.  
  - Common pitfalls flagged in the marking scheme target anticipated student errors (e.g., overlooking that relations require prior distinctness).  
  - The A/B differentiation rewards spotting that physics’ "gauge" concept is a *tool*, not a metaphysical trump card, and that weak discernibility shifts IoI’s goalposts.
