prompt: |-
  I've been reading the inside view vs. outside view debates for over a decade, and I've finally tried to write down my actual epistemic commitments. Before I circulate them to my forecasting group, I'd like an audit of whether they jointly hang together:

  1. When my object-level reasoning conflicts with a reference-class forecast, the reference class should usually win.
  2. When epistemic peers whom I consider informed disagree with me, I should move my credences toward the aggregate rather than trust my own analysis.
  3. I take Tetlock's results seriously: on long-range political and technological questions, expert forecasts are barely better than chance, and adding more experts doesn't reliably fix this.
  4. Reference classes are chosen, not given. The same venture can be lumped in with all startups, or with two-person technical startups in the same city by repeat founders, and the base rates differ wildly. Picking which class is relevant is itself an exercise of inside-view judgment, so the outside view never fully bottoms out.
  5. In my day job I estimate software projects, and my calibrated inside-view estimates beat both the industry-standard overrun statistics and any base-rate model I've built, so I keep using them.
  6. I believe universal deference is self-undermining: the reason averaging across people works is that their errors are partly independent, but if everyone adopts averaging as a norm and discards their own signal, the independence is destroyed and the aggregate degrades.
  7. I endorse the first-principles, inside-view-heavy reasoning behind taking AI risk seriously — arguments about capability growth and timelines for which no clean reference class exists and expert consensus is currently an unreliable guide.

  Which pairs of these are genuinely in tension, which only look like they are, and what would the cheapest coherent revision be? Please order the tensions by severity rather than flagging everything equally, and for each one say which commitment has to give and what giving it up would cost me elsewhere on the list.
reasoning: |-
  Okay, the user has shared their epistemic commitments and wants an audit. They're clearly deep into forecasting methodology—mentioning Tetlock, AI risk, and software estimation. This isn't casual curiosity; they're preparing to circulate these to a forecasting group, so precision matters.  

  First, scanning the list for fractures. The core tension screams from #5: "My calibrated inside-view beats base rates in software estimation" versus #1: "Reference class usually wins over object-level reasoning." That's not just tension—it's direct contradiction if "usually" means "always." If they're genuinely calibrated (per #5), why would they ever defer to worse-performing base rates? Unless... maybe "usually" implies exceptions they haven't codified?  

  Then the meta-tension: #6 warns universal deference destroys error independence, yet #2 advocates moving toward peer aggregates. If everyone does #2, #6 activates. But they're smart—they know this. Perhaps they mean "move toward aggregates but retain private signals"? The word "discard" in #6 suggests they'd reject full surrender.  

  #3 and #7 clash intriguingly. Tetlock says experts suck at tech/politics (#3), yet they endorse inside-view-heavy AI risk arguments (#7). Justified? Probably—if AI is genuinely novel with no reference class (#4, #7). But #3 looms: if experts are barely better than chance, why trust *any* inside-view on AI? Unless their "inside-view" means something narrower than "expert consensus."  

  #4 is the keystone. "Reference classes are chosen" torpedoes the purity of outside-view. Every base rate leans on inside-view judgment. This explains why #5 survives—their curation of reference classes *is* the skill beating generic models.  

  Cheapest fixes?  
  - Soften #1 to "usually, *unless* I'm calibrated in a domain." Costs nothing—already implied by #5.  
  - Clarify #2: "move toward aggregates but never discard private signal." Preserves error independence (#6).  
  - For #3 vs #7, emphasize that #7 is the exception when novelty voids reference classes (#4). Tetlock's warning still holds for domains *with* reference classes.  

  Biggest risk? If their forecasting group applies #1 rigidly, it could undermine their software estimation edge (#5). But they’re the expert—they should flag that exception explicitly.  

  Final note: Their list is admirably coherent for wrestling with these paradoxes. Most tensions dissolve if "outside view" isn’t dogma but a tool that bends when calibration speaks.
answer: |-
  Your commitments form a nuanced epistemic framework, but several tensions exist. Below is an audit ordered by severity, identifying genuine conflicts, surface-level tensions, and minimal revisions for coherence. Crucially, **#1 and #5 are the core conflict**, while others are resolvable with clarification.

  ---

  ### **1. Highest Severity Tension: #1 vs. #5**  
  - **Conflict**: #1 ("reference class should usually win") directly contradicts #5 ("my inside-view estimates beat base rates"). If your calibrated inside view *consistently* outperforms reference classes in software estimation, #1 cannot hold universally.  
  - **Cheapest Revision**: **Modify #1** to include an explicit exception for domains where you're empirically calibrated.  
    - *Revision Suggestion*:  
      > "1. When my object-level reasoning conflicts with a reference-class forecast, the reference class should usually win *except in domains where I have demonstrated personal calibration (e.g., software estimation).*"  
    - *Cost of Revision*: None. This aligns with #5 and avoids overgeneralizing #1. Your forecasting group needs this specificity to avoid misapplying #1 outside its scope.  

  ---

  ### **2. Moderate Severity Tension: #2 vs. #6**  
  - **Conflict**: #2 ("move toward peer aggregates") could encourage the universal deference warned against in #6 (which destroys error independence). If applied uncritically, #2 risks creating the herd dynamics #6 critiques.  
  - **Resolution (No Revision Needed)**: These only *appear* to conflict. #2 describes a Bayesian update toward peers, while #6 warns against *discarding your signal entirely*. They coexist if you:  
    - Treat peer disagreement as *one input* (updating credence but retaining private insight).  
    - Reserve #6 for systemic cases (e.g., if *everyone* defers, aggregates break).  
  - *Action*: **Clarify #2** in your document:  
    > "2. ... I should move my credences toward the aggregate *while retaining my distinct perspective to preserve error independence*."  

  ---

  ### **3. Lower Severity Tensions: #3 vs. #7 and #4 vs. "Pure" Outside View**  
  - **#3 vs. #7**:  
    - *Apparent Conflict*: #3 (expert forecasts ~= chance) seems to undermine #7 (trusting inside-view AI risk arguments).  
    - **Resolution**: #7 explicitly notes "no clean reference class exists" and "expert consensus is unreliable," making it an *exception* to #3's domain. #3 applies to questions with track records (e.g., geopolitical events), while #7 addresses unprecedented scenarios.  
    - *No Revision Needed*. Strengthen by citing #4: AI risk lacks a valid reference class, forcing inside-view reliance.  

  - **#4 vs. "Pure" Outside View**:  
    - *Surface Conflict*: #4 (reference classes require inside-view judgment) challenges the idea of a "neutral" outside view.  
    - **Resolution**: This isn't a tension—it's a *meta-insight*. #4 explains *why* #3 is true (experts pick flawed reference classes) and justifies #5/#7 (inside-view excels when reference classes are ill-defined).  
    - *No Revision Needed*. Lean into this: the "outside view" is itself scaffolded by inside-view choices.  

  ---

  ### **Coherence Checklist & Recommendations**  
  1. **Resolve #1 vs. #5**: Add a calibration exception to #1 (as above).  
  2. **Clarify #2**: Emphasize retaining your signal to avoid violating #6.  
  3. **Harmonize #3 and #7**: Frame #7 as a justified exception due to reference-class absence (per #4).  
  4. **Leverage #4**: Use it as the glue—e.g., "Outside views depend on inside-view class selection, so neither is primordial."  

  **Final Framework**: Your commitments hang together if:  
  - The "outside view" (#1, #3, #4) dominates *unless* (a) you're calibrated (#5), or (b) no valid reference class exists (#4, #7).  
  - Peer aggregation (#2) is tempered by preserving error independence (#6).  

  **Cost of Revisions**: Minimal. You retain all core insights while avoiding overgeneralization. The only "loss" is admitting #1 isn't universal—but #5 and #4 already justify this.  

  ---

  ### Why This Works  
  Your framework is **calibration-sensitive**:  
  - Default to reference classes (#1) *unless* you’re in a calibrated domain (#5) or lack valid classes (#4, #7).  
  - Aggregate with peers (#2) *without* discarding your signal (#6).  
  - Distrust experts (#3) *except* when inside-view is unavoidable (#7).  

  This reflects Tetlock’s "superforecaster" ethos: balance outside-view rigor with disciplined inside-view updates. Share this with your group—it’s a robust foundation.
