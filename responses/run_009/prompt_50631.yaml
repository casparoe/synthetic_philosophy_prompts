prompt: |-
  I spent thirty-five years as a fish physiologist, most of them measuring cortisol and ventilatory responses in stressed salmonids, and since retiring I have been working through the philosophy of biology and animal ethics literature — Braithwaite, the sentience debates, the precautionary principle — with the enthusiasm of a convert and, I hope, the habits of someone who spent a career insisting on evidence. That background is why our certification scheme asked me onto its scientific advisory panel, where we decide which welfare standards a farm must meet to carry the label. I now find myself unable to tell what principle our own precedents actually instantiate, and I would like your help before our most consequential case yet.

  Our precedents, in the order we set them:

  1. Atlantic salmon and rainbow trout farms: full standards — electrical or percussive stunning before slaughter, stocking-density caps, continuous water-quality monitoring, minimal feed withdrawal before killing.
  2. Oyster and mussel operations: no welfare standards whatsoever; the panel judged the evidence of sentience too weak for anything to protect.
  3. A prospective octopus farm (never certified, but we issued guidance): we said any certified operation would face standards roughly comparable to the salmon ones, citing learning performance and behavioral responses to noxious stimuli.
  4. A crab processor holding animals live before cooking: we required that no crab be dismembered or boiled while alive — the nerve centers must be destroyed first — but we declined to impose density, handling, or analgesia requirements, reasoning that the evidence for finer-grained welfare needs in decapods was thin and the costs to the processor were not.
  5. We have never ruled on shrimp.

  The new case is an application from a very large whiteleg shrimp operation. The practices at issue: slaughter by immersion in ice slurry or simple asphyxiation in air, which can leave animals sensible for minutes to hours; eyestalk ablation of breeding females, performed without anesthesia, to accelerate maturation; and very high stocking densities. For the first time there is a practical alternative on the slaughter side, since electrical stunning equipment designed for shrimp has recently become commercially available and is being trialed by some producers, at nontrivial cost. By individual animal count this is the largest aquatic farming sector in the world, orders of magnitude beyond salmon. Meanwhile, the evidence base on nociception and motivational trade-offs in decapods is stronger than it was when we heard the crab case, though it remains contested, and our jurisdiction has recently recognized decapod crustaceans as sentient in statute.

  Please do three things. First, articulate at least three candidate rules or principles that would each render our precedents jointly consistent — for instance a graded neural-complexity threshold, an evidence-of-pain threshold, and a precautionary rule constrained by feasibility and scale — and check each honestly against all four precedents, including the asymmetry between the octopus and crab rulings. Second, tell me what the panel should decide on the shrimp application if it wants to remain consistent with itself: address the slaughter method, the eyestalk ablation, and the densities as separate components, since the rules may not converge on all three, and identify which precedent is the closest analog for each. Be explicit about what principle we would be committing ourselves to with each ruling, since whatever we decide here will surely be cited back to us. Third, name the case we have not yet heard — an animal, a practice, or a sector — that would best discriminate among the candidate rules, and say what each rule predicts for it, so the panel knows in advance what it is really deciding.
reasoning: |-
  Hmm, the user is a retired fish physiologist who spent 35 years studying stress responses in salmonids and now serves on a scientific advisory panel for an animal welfare certification scheme. They're struggling to identify consistent principles behind their panel's precedents and need help before a major shrimp farming case. 

  This is fascinating - they've outlined five precedents that seem contradictory at first glance: strict standards for salmon/trout, no standards for oysters/mussels, demanding standards for hypothetical octopus farms, moderate standards for crabs, and now shrimp pending. The shrimp case is massive in scale and involves three contentious practices: ice slurry slaughter (potentially causing prolonged suffering), unanesthetized eyestalk ablation, and high stocking densities. 

  The user wants three things: 1) candidate principles that explain all precedents, 2) specific recommendations for the shrimp case components, and 3) a "discriminator case" to test the principles. Their background suggests they'll reject hand-wavy ethical arguments - this needs rigorous, evidence-based reasoning. 

  Looking at the precedents, three principles emerge:
  First, a neural complexity threshold could explain the salmon/trout vs. oysters/mussels split, but struggles with the octopus/crab asymmetry since octopuses have more complex brains than crabs yet got stricter standards. 

  Second, an evidence-of-pain threshold fits better - oysters have negligible evidence, crabs had "thin" evidence when ruled on, while octopus evidence was deemed strong. But this feels slippery since evidence evolves (as with decapod statutes now recognizing sentience). 

  Third, a precautionary principle tempered by practical feasibility explains the crab ruling's limited measures (only banning live dismemberment/boiling) despite emerging evidence, and could justify requiring electrical stunning for shrimp now that it's commercially viable. 

  For the shrimp ruling: 
  - Slaughter should require stunning (like salmon precedent, since feasible tech exists now) 
  - Eyestalk ablation should be banned without anesthesia (new precedent, but aligned with octopus logic given stronger evidence now) 
  - Density standards deferred pending better evidence (like crab handling requirements) 

  The perfect discriminator case would be insect farming - say mealworms. Neural complexity would deny standards, evidence threshold might demand more research, while precautionary feasibility might require basic stunning if developed. 

  Key insight: The panel's real conflict isn't science - it's about how much uncertainty they'll tolerate before acting. Their crab ruling leaned toward certainty; shrimp might force them toward precaution.
answer: |-
  Based on your precedents and the evolving evidence, here are three candidate principles, their application to the shrimp case, and a discriminating case to clarify your panel's underlying ethic:

  ### Candidate Principles Rendering Precedents Consistent
  1.  **The "Robust Evidence + Feasible Intervention" Principle:** Standards apply only when there is *robust* scientific evidence for sentience/pain *and* feasible, cost-proportional welfare interventions exist. Precedents align as:
      *   Salmon/Trout: Robust evidence (your field), feasible stunning/density control.
      *   Oysters/Mussels: Evidence too weak, no feasible interventions needed.
      *   Octopus: Robust evidence (learning, nociception), presumed feasible interventions (guidance).
      *   Crab: Evidence deemed "thin" at the time; only *grossly cruel and immediately feasible* interventions required (ban live dismemberment/boiling). Cost/feasibility outweighed evidence for finer standards.
      *   **Octopus/Crab Asymmetry:** Octopus evidence judged robust *enough prospectively*; crab evidence judged "thin" *at the time of ruling*, and cost/feasibility arguments were decisive against broader standards.

  2.  **The "Precautionary Principle Constrained by Nervous System Complexity & Scale" Principle:** Act precautionarily based on phylogenetic nervous system complexity (indicating sentience potential) and evidence of nociception/aversive learning, but scale of intervention inversely proportional to nervous simplicity and proportional to sector scale/cost. Precedents align as:
      *   Salmon/Trout: High complexity, strong evidence, large industry justifies standards.
      *   Oysters/Mussels: Very low complexity, minimal evidence, no precaution needed.
      *   Octopus: High complexity (cephalopod), strong evidence, justifies precautionary standards despite nascent industry.
      *   Crab: Moderate complexity (decapod), contested evidence at the time; precaution triggered only for egregious practices (live dismemberment/boiling) due to scale/cost concerns. Complexity lower than octopus justifies weaker precaution.
      *   **Octopus/Crab Asymmetry:** Explicitly different nervous complexity tiers justifying different levels of precaution.

  3.  **The "Threshold of Demonstrated Motivational Trade-offs + Practical Avoidability" Principle:** Standards are triggered by evidence that the animal makes complex *motivational trade-offs* indicating conscious suffering (beyond simple nociception) *and* the suffering caused by a practice is practically avoidable. Precedents align as:
      *   Salmon/Trout: Clear evidence of trade-offs (e.g., risk avoidance vs. feeding), avoidable suffering.
      *   Oysters/Mussels: No evidence of complex trade-offs, no avoidable suffering to regulate.
      *   Octopus: Strong evidence of complex trade-offs/learning, avoidable suffering presumed.
      *   Crab: Evidence for complex trade-offs deemed insufficiently "demonstrated" at the time; only the *most severe and easily avoidable* suffering (live dismemberment/boiling) was regulated. Avoidability was key.
      *   **Octopus/Crab Asymmetry:** Demonstrated trade-offs in octopus vs. insufficient demonstration in crab at ruling time.

  ### Recommendations for the Shrimp Application (Aligning with Precedents)
  The **"Robust Evidence + Feasible Intervention" Principle** provides the most consistent and defensible framework, given your panel's explicit reliance on evidence strength and cost/feasibility in past rulings (especially Crab vs. Octopus).

  1.  **Slaughter Method:**
      *   **Ruling:** **Require electrical stunning** for certified shrimp.
      *   **Principle Committed To:** Where robust evidence of suffering potential exists *and* a feasible, commercially available intervention emerges (even at non-trivial cost), it must be adopted for certification. Suffering duration (minutes-hours) is severe and avoidable.
      *   **Closest Analog:** **Salmon/Trout (Precedent 1)**. Ice slurry/asphyxiation resembles inefficient stunning causing prolonged suffering. Electrical stunning is the direct equivalent intervention now available for shrimp. *Unlike Crab*, feasible tech *now exists*.
      *   **Commitment:** Sets precedent that once feasible tech exists to prevent severe slaughter suffering in animals with robust sentience evidence, it becomes a requirement.

  2.  **Eyestalk Ablation:**
      *   **Ruling:** **Prohibit eyestalk ablation without effective anesthesia or analgesia** for certified shrimp.
      *   **Principle Committed To:** Invasive mutilations causing potential severe tissue damage/nociception in animals with robust sentience evidence cannot be performed without pain mitigation if alternatives exist. Evidence for nociception here is strong.
      *   **Closest Analog:** **Crab (Precedent 4) - Partial Analog & New Precedent**. This resembles the "dismemberment" banned in crabs. While less instantly fatal, ablation is a severe mutilation. Your panel rejected analgesia for crabs due to "thin" evidence and cost. *Now*, decapod evidence is stronger (recognized in statute), and the *principle* established in Crab (ban severe mutilation without mitigation) applies. *Unlike Crab*, evidence now justifies requiring mitigation. *Unlike Octopus*, it's a specific practice ban, not full comparable standards.
      *   **Commitment:** Sets precedent that mutilations proven harmful in animals with robust sentience evidence require mitigation (anesthesia/analgesia) where practicable.

  3.  **Stocking Densities:**
      *   **Ruling:** **Do not impose specific density caps at this time, but require research & monitoring**.
      *   **Principle Committed To:** While density impacts are plausible, the *robust evidence* linking specific densities to *measurable suffering via motivational trade-offs* in shrimp is still emerging and contested. Imposing costly density caps lacks the same level of direct evidence and feasible, validated metrics as stunning or banning unmitigated mutilation. Precaution is tempered by feasibility/scale.
      *   **Closest Analog:** **Crab (Precedent 4)**. Density/handling requirements were rejected due to "thin" evidence and cost. The scale argument (largest sector) reinforces caution. *Unlike Salmon*, robust causal links between density and discrete welfare indicators are less established for shrimp.
      *   **Commitment:** Reinforces that density standards require strong, causal evidence of suffering directly attributable to density levels, beyond general stress physiology, especially in high-volume, low-margin sectors. Triggers a need for targeted research.

  ### The Discriminating Case: **Industrial-Scale Black Soldier Fly Larvae (BSFL) Farming for Feed**
  *   **Context:** BSFL farming is rapidly expanding. Slaughter typically involves freezing, drying, or grinding alive. Questions arise about sentience/nociception. Nervous system is simpler than decapods (centralized ganglia), but shows some learning and avoidance behaviors. Feasible stunning (e.g., rapid chilling) might be possible. Scale is massive (billions).
  *   **How Each Principle Predicts the Ruling:**
      1.  **Robust Evidence + Feasible Intervention:** *Likely no standards initially.* Judges current evidence for complex sentience/trade-offs in larvae as insufficiently "robust" compared to decapods. Even if feasible stunning emerged, evidence threshold likely not met. (Aligns with Oyster precedent).
      2.  **Precautionary (Complexity/Scale):** *Might require stunning if feasible.* Applies precaution based on *some* neural complexity (ganglia) and avoidance behaviors, scaled by massive numbers. If cheap stunning exists, precaution could mandate it despite weaker evidence than for shrimp/crab. (Different from Oyster due to greater complexity & scale).
      3.  **Threshold of Trade-offs + Avoidability:** *Likely no standards.* Unlikely to find evidence larvae make complex *motivational trade-offs* (e.g., sacrificing food access to avoid a threat) comparable to decapods. Simple avoidance isn't enough. Suffering remains unproven conceptually, regardless of avoidability. (Aligns strongly with Oyster precedent).

  **Conclusion for Your Panel:** Adopting the **"Robust Evidence + Feasible Intervention" Principle** provides the clearest, most consistent path forward based on your documented reasoning (especially the Crab precedent's emphasis on evidence strength and cost). For the shrimp application, this means: **Mandate electrical stunning, prohibit eyestalk ablation without anesthesia/analgesia, and defer density caps while mandating research.** This approach balances ethical responsibility with your panel's foundational commitment to evidence and practicality. The BSFL case starkly reveals the differences between your principles, forcing a future choice about the level of evidence required to trigger precaution for neurologically simpler but massively farmed animals.
