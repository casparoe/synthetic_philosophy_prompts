  ### Decision Tree Handout: Navigating Moral Responsibility after Strawson's Basic Argument  
  *You start from a concrete intuition: You sometimes feel appropriate gratitude toward a friend who went out of her way for you. This handout helps you explore what (if anything) this commits you to regarding moral responsibility. Answer each question based on your reactions to cases, not theory. At the end, you'll land on a philosophical position—each with a "cost" you must accept.*  

  ---

  #### The Tree  
  **Start:** When you feel appropriate gratitude toward your friend for her kind act, does this feeling **commit you to the idea that she *deserves* moral credit** (i.e., she is morally responsible in a "desert-based" sense)?  
  - **Yes** → Go to **Q1**.  
  - **No** → Go to **Q6**.  

  **Q1:** Consider three people:  
  - A **kleptomaniac** steals due to an unchosen urge.  
  - A **naturally compassionate person** helps due to unchosen temperament.  
  - A **cult member** (who joined voluntarily as an adult) harms others due to internalized cult values.  
  In *any* of these cases, does the person **deserve blame/credit for their act *only if* they also deserve blame/credit for the character/motives behind it?**  
  - **Yes** → Go to **Q2**.  
  - **No** → Go to **Q5**.  

  **Q2:** Imagine someone who **deliberately reshaped their character at age 20** (e.g., from selfish to compassionate) using their pre-existing values/capacities (which they did not choose). Is this *self-reshaping* enough to make them **deserve blame/credit for their resulting character?**  
  - **Yes** → You are a **Bounded Self-Creation Compatibilist**.  
  - **No** → Go to **Q3**.  

  **Q3:** For someone to deserve blame/credit for their character, must they be its **"ultimate creator"** (i.e., they caused themselves *ex nihilo*—from nothing—with no unchosen influences)?  
  - **Yes** → Go to **Q4**.  
  - **No** → *[Error: This path is unoccupied—explained in Diagnostics]*  

  **Q4:** Is **ultimate self-creation** (as defined in Q3) possible?  
  - **Yes** → You are a **Source Incompatibilist**.  
  - **No** → You are an **Impossibilist**.  

  **Q5:** In a **Frankfurt-style case**, Jones freely chooses to vote for Candidate A based on his values, but a device in his brain *would have forced* him to vote for A if he hesitated. Jones **could not have done otherwise**, but acted from his "true self." Does Jones **deserve blame/credit for voting?**  
  - **Yes** → You are a **Semicompatibilist**.  
  - **No** → Go to **Q7**.  

  **Q6:** Since your gratitude doesn’t commit to desert, **does *any* act ever deserve moral credit/blame?**  
  - **Yes** → Go to **Q1** (to resolve the basis for desert).  
  - **No** → Go to **Q8**.  

  **Q7:** (From Q5) Why is Jones **not** responsible? Is it because **he lacks ultimate control over his values** (even if he couldn’t have done otherwise)?  
  - **Yes** → You are a **Source Incompatibilist**.  
  - **No** → *[Error: This path is unoccupied—explained in Diagnostics]*  

  **Q8:** (From Q6) What justifies **practices like gratitude/blame** if desert is off the table?  
  - **Their consequences** (e.g., encouraging good behavior) → You are a **Hard Incompatibilist**.  
  - **The agent’s will at the time** (e.g., their intentions, regardless of background luck) → You are a **Revisionist**.  

  ---

  #### Leaf Positions and Their Costs  
  1. **Bounded Self-Creation Compatibilist**: You must accept that reshaping yourself from unchosen materials (e.g., at age 20) counts as "self-creation," even though you didn’t choose the raw materials.  
  2. **Source Incompatibilist**: You must believe agents can be "ultimate self-creators" (e.g., via indeterminism), which requires unexplained, non-causal control over one’s entire will.  
  3. **Impossibilist**: You must deny that anyone *ever* deserves blame or credit, even for horrific/virtuous acts.  
  4. **Semicompatibilist**: You must grant that a kleptomaniac (acting from unchosen urges) *could* deserve blame if they act "from their own values," regardless of how they got them.  
  5. **Hard Incompatibilist**: You must justify blaming someone for a past act *they didn’t ultimately deserve*, purely to shape future behavior.  
  6. **Revisionist**: You must explain why "reactive attitudes" (e.g., gratitude) are fitting *without* desert—e.g., by reducing responsibility to assessing the agent’s current will.  

  ---

  #### Diagnostics: Where the Tree Succeeds and Fails  
  **1. Pairs of Leaves the Tree Cannot Separate**  
  - **Source Incompatibilist paths merge**: This leaf is reached from two paths (Q1→Q1→Q2→Q3→Q4→"Yes" *or* Q1→Q1→Q5→Q7→"Yes"). Both paths answer all concrete questions identically (e.g., both reject bounded regress and require ultimacy). The tree *cannot* distinguish between a Source Incompatibilist motivated by character concerns (first path) vs. action concerns (second path).  
  - **Hard Incompatibilist and Revisionist separate cleanly**: The tree *can* split these via **Q8**, using differences in attitudes toward **forward-looking vs. will-focused practices**. For example:  
    - *Should you feel gratitude toward a deceased benefactor?* Hard Incompatibilists say "no" (no future benefits); Revisionists say "yes" (their will was good *at the time*).  
    - *How regard someone who hasn’t acted?* Hard Incompatibilists withhold attitudes until acts occur (to incentivize); Revisionists might praise/vilify based on expressed intentions alone.  

  **2. Unoccupied Answer Combinations**  
  - **Q3→"No"** (Ultimate self-creation *not* required for responsibility for character) → *Unoccupied*.  
    - Why? Incoherent. If you accept Strawson’s regress (Q1→"Yes"), denying ultimacy *and* bounded regress (Q2→"No") leaves no way to halt the regress. No major philosopher holds this.  
  - **Q7→"No"** (Jones isn’t responsible, but *not* due to ultimacy) → *Unoccupied*.  
    - Why? Unattractive. This would require insisting on alternative possibilities *even in Frankfurt cases*—a position so unstable that theorists (e.g., Fischer) abandoned it.  

  **Tree Change Made**: Added **Q7** to split Source Incompatibilists from Leeway Incompatibilists (who require alternative possibilities). *Why?* Without Q7, Q5→"No" forced all into Source Incompatibilism, but some deny responsibility for non-ultimacy reasons. Q7 uses the Frankfurt case to isolate ultimacy as the issue.  

  ---

  **Teaching Note**: The tree’s "failure points" (e.g., merged Source Incompatibilist paths) reveal that Strawson’s argument targets *source conditions* for responsibility, not determinism. Use this to spark debate: *Does moral responsibility require tracing back to an "uncaused cause"? If so, how could that work? If not, where do we draw the line?*
