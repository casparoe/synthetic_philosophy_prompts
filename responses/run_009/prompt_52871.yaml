answer: |-
  Here is the final exam question package tailored to your specifications:

  ---

  ### (1) Essay Question (72-Hour Take-Home, 2,500 words max)

  **Evolutionary models of convention (e.g., Skyrms) generate stable behavioral regularities – such as driving on a particular side of the road or fairness norms in bargaining games – in populations of agents devoid of beliefs, expectations, or common knowledge. Assess the impact of this result on David Lewis's analysis of convention in *Convention: A Philosophical Study*. Does this evolutionary challenge refute Lewis's analysis? Or does it reveal a fundamental conceptual fork, forcing us to either: (a) abandon the requirement of intentional/epistemic apparatus for conventions, or (b) acknowledge that Lewis and evolutionary game theory are tracking distinct phenomena that happen to share the label 'convention'? In your answer, critically evaluate whether norms emerging in mixed-motive games (like the Ultimatum Game approaching the Nash solution) can be considered Lewisian conventions, given Lewis's emphasis on *pure* coordination problems where alternatives are arbitrary.**

  ---

  ### (2) Model Answer (~600 words)

  The evolutionary challenge posed by models like Skyrms' presents a profound complication, rather than a straightforward refutation, of Lewis’s analysis of convention. It exposes a conceptual fork, suggesting that while Lewis captures a specific, sophisticated *type* of social regularity rooted in agency and cognition, evolutionary game theory identifies a broader class of stable behavioral equilibria that arise mechanically. Consequently, we should acknowledge that Lewis and evolutionary theory track distinct, though overlapping, phenomena both labeled ‘convention’.

  Lewis defined a convention as a regularity *R* in behavior among a population *P* when they recurrently face a coordination problem *S*. Crucially, *R* is sustained because: (1) everyone conforms to *R*; (2) everyone expects others to conform; (3) everyone prefers to conform *conditional* on others conforming (due to coordination payoffs); and (4) this preference-expectation structure is *common knowledge*. The arbitrariness of *R* (another viable regularity *R'* could have solved *S*) is central. This analysis is deeply intentional and epistemic, grounding convention in agents' beliefs, preferences, expectations, and mutual awareness.

  Skyrms' evolutionary models demonstrably generate stable behavioral patterns functionally equivalent to conventions (e.g., driving side) without any agents possessing beliefs, expectations, preferences over others' actions, or common knowledge. Simple reinforcement learning, imitation, or biological selection operating over repeated interactions suffices. This starkly contrasts with Lewis’s demanding epistemic requirements. Lewis himself later conceded common knowledge was too strong, suggesting mutual belief might suffice. However, the evolutionary result attacks deeper foundations: it shows stable coordination can emerge *without any intentional states directed at others' behavior or expectations at all*.

  This forces the conceptual fork. Option (a) – abandoning intentionality – radically dilutes the concept, collapsing convention into any stable behavioral equilibrium sustained by *any* mechanism (e.g., pheromone trails). This loses what is philosophically distinctive about conventions as *social* phenomena understood and sustained by agents' reasoning about each other. Option (b) is more plausible: Lewis provides an analysis of conventions *qua intentional, normative social practices*. Evolutionary models explain the *emergence and stability* of behavioral patterns that *can become* the basis for Lewisian conventions once agents develop the requisite cognitive capacities and interpret their situation intentionally. Driving side might start as a mere evolutionary regularity but becomes a Lewisian convention when drivers internalize it as a rule based on expectations.

  The challenge is sharpest regarding fairness norms in mixed-motive games like the Ultimatum Game. Skyrms shows how norms approximating Nash solutions can evolve without cognition. However, **these norms strain Lewis's paradigm**. Ultimatum Games involve inherent conflict; players have opposing interests over how to divide the surplus, unlike pure coordination (e.g., choosing *which* side to drive on) where interests perfectly align. While a division norm *solves* a recurrent interaction problem, it isn't *arbitrary* in the Lewisian sense. Alternatives (e.g., heavily favoring Proposer or Responder) are not equally good for all; they produce different distributions of payoff. A population evolving a "fair" split isn't indifferent between that and an "unfair" split in the way drivers are indifferent between left and right, provided uniformity. Thus, the evolved norm in Ultimatum is better seen as a stable *bargaining norm* or *norm of distribution*, solving a mixed-motive problem, rather than a Lewisian convention *stricto sensu*. It lacks the hallmark arbitrariness central to Lewis’s paradigmatic cases.

  Therefore, the evolutionary critique doesn't refute Lewis’s analysis of a specific, cognitively rich phenomenon. Instead, it reveals a fork, clarifying that Lewis’s analysis targets conventions *as intentional social constructs*, while evolutionary models explain the origin of behavioral regularities that may underpin or evolve into such constructs, particularly in pure coordination contexts. Mixed-motive norms further highlight the distinctiveness of Lewis’s focus on arbitrary solutions to pure coordination problems.

  ---

  ### (3) Marking Scheme (Total: 20 Points)

  | **Must-Hit Move**                                      | **Points** | **Common Fumble**                                     |
  | :----------------------------------------------------- | :--------- | :---------------------------------------------------- |
  | **1. Accurate Exposition of Lewis's Core Analysis:** Clearly articulate Lewis's definition, emphasizing conditional preferences, expectations, common knowledge (or mutual belief), arbitrariness, and pure coordination as paradigmatic. | 4          | Omitting arbitrariness or conditional preferences; treating common knowledge as unproblematic. |
  | **2. Explanation of Skyrms-Style Evolutionary Challenge:** Precisely state how evolutionary models produce convention-like outcomes *without* beliefs, expectations, or common knowledge, using examples (driving side, Ultimatum norms). | 4          | Vague description of evolution; failing to explicitly contrast the absence of epistemic/intentional elements in Skyrms vs. Lewis. |
  | **3. Engagement with the Conceptual Fork:** Explicitly frame the dilemma (Refute? Abandon Intentionality? Distinguish Phenomena?) and argue for one resolution (ideally distinguishing phenomena). | 5          | Asserting simple refutation without analysis; ignoring the fork; failing to justify the chosen resolution. |
  | **4. Critical Analysis of Mixed-Motive Cases (Ultimatum Game):** Directly address whether evolved fairness norms qualify as Lewisian conventions, specifically highlighting the challenge posed by the *lack of arbitrariness* compared to pure coordination problems. | 5          | Treating Ultimatum norms as straightforwardly Lewisian; ignoring the mixed-motive/conflict aspect; not contrasting arbitrariness. |
  | **5. Clear Stance & Implications:** Take a definitive position on the fork and its implications for understanding conventions/norms, drawing conclusions about the scope of Lewis vs. evolutionary explanations. | 2          | Waffling; no clear conclusion; failing to state what the debate reveals about the concept(s). |

  ---

  **Rationale for Design:**
  *   **Focus:** Targets the core tension you specified (intentional vs. evolutionary) and forces engagement beyond definition recital.
  *   **Depth:** Requires analyzing Lewis's core commitments (arbitrariness, pure coordination) and testing them against a hard case (evolved Ultimatum norms).
  *   **Conceptual Fork:** Explicitly structures the dilemma, demanding students take a reasoned stand.
  *   **Mixed-Motive:** Ensures students grapple with the limits of Lewis's paradigm, moving beyond simple driving-side examples.
  *   **Marking Scheme:** Prioritizes the essential analytical moves (Exposition, Challenge, Fork, Mixed-Motive Analysis, Conclusion) with higher weights on complex reasoning (Fork, Mixed-Motive). Notes common pitfalls to guide grading consistency.
