  We are drafting a joint statement for two factions in a game-theory seminar: the orthodoxy and the revisionists.
   The goal is to have a constructive text that both can sign, with:
    1. A section of agreed claims (worded neutrally).
    2. A table of residual disagreements (each position stated in acceptable wording for that side).
    3. Cruxes: specific sub-questions that would move at least one faction if settled, with concrete cases/experiments and each side's prediction.

   We assume knowledge of the standard centipede game. We may use a small concrete instance for clarity.

   Let us consider a minimal centipede for illustration: a 3-node version (Player 1 moves at node 1, then Player 2 at node 2, then Player 1 at node 3) with payoffs:
     - If Player 1 takes at node 1: (1, 0)
     - If Player 1 passes at node 1, then Player 2 at node 2:
          - If Player 2 takes: (0, 2)
          - If Player 2 passes, then Player 1 at node 3:
               - If Player 1 takes: (3, 1)
               - If Player 1 passes: (0, 0)   [or some other terminal, but typically the pot grows until the last move]

   However, note that in the standard centipede the pot grows and the player who takes gets the larger share at that node. We don't need to derive the BI path, but we can refer to it.

   Section 1: Agreed Claims

   Both camps can endorse:

   1. Backward induction, as a formal algorithm, demonstrates that if common knowledge of rationality (CKR) holds at every node of the game tree, then in the centipede game the only Nash equilibrium (and subgame perfect equilibrium) is for the first player to take at the first opportunity, leading to the first-move payoff.

   2. The backward induction paradox arises because the assumption of CKR at every node is inconsistent with the game reaching a later node. Specifically, if the game reaches a later node, the history of passes contradicts the assumption that both players are rational and that there is common knowledge of rationality at every node. Therefore, the formal reasoning of backward induction requires an assumption (CKR at every node) that is incompatible with the observation of the game having reached that node.

   3. Experimental evidence from human play of the centipede game consistently shows that players often pass for several moves, allowing the pot to grow, and the take typically occurs at a later node. Moreover, the average number of passes increases with the size of the pot (i.e., the opportunity cost of taking early) and varies with the stakes and other factors.

   Section 2: Table of Residual Disagreements

   We present a table with two columns: one for the orthodox position and one for the revisionist position, each stated in wording acceptable to that side.

   | Disagreement Topic | Orthodox Position | Revisionist Position |
   |-------------------|-------------------|----------------------|
   | Inference from arrival at a late node | Upon reaching a late node, a rational player should infer nothing that would override the original assumption of rationality because the only coherent way to model the deviation is as a random error (tremble). Therefore, the player should still expect the opponent to take at the next opportunity. | Upon reaching a late node, a rational player must update her beliefs about the opponent. The fact that the opponent passed at an earlier node (and thus allowed the game to reach this node) provides evidence that the opponent is not playing the backward induction strategy, and therefore may be willing to pass again. This updating can make passing rational. |
   | Nature of rationality | Rationality is a property of a complete, contingent plan (strategy) chosen at the outset. A strategy that specifies taking at the first opportunity is the only rational one because it maximizes expected payoff under the initial assumption of CKR. | Rationality is a property of choices made at each node given the information available at that node. The information at a late node includes the history of passes, which may rationally lead to a belief that the opponent is not playing the backward induction strategy, making passing rational at that node. |
   | The trembling-hand approach | The trembling-hand model (where players may make small mistakes) provides a rational foundation for the backward induction solution: the outcome is that the game ends early with high probability, and the solution concept (trembling-hand perfect equilibrium) refines the Nash equilibrium to account for the possibility of small errors without abandoning the rationality assumption. | The trembling-hand approach concedes the revisionist point by acknowledging that without trembles, the backward induction solution is inconsistent with the game reaching late nodes. It does not resolve the paradox but relabels it: the tremble is an exogenously imposed device to make the backward induction path consistent. Alternatively, by introducing trembles, the orthodox model tacitly grants that the revisionist's updating at later nodes is rational. |
   | Relevance of experimental findings | Experimental results are largely irrelevant to the normative question of what is rational because they are confounded by non-monetary preferences (e.g., altruism, reciprocity) or by subjects' failure to reason correctly. The game being played by subjects may not be the one modeled (with only monetary payoffs). | Experimental results provide evidence that the backward induction solution is not descriptively accurate. Moreover, the persistent passing observed even when stakes are high and when subjects are given incentives for accuracy suggests that the revisionist's account of rationality (which allows for updating at later nodes) may be normatively compelling. |

   Section 3: Cruxes

   We present two or three sub-questions that, if settled, would move at least one faction. For each, we provide a concrete case, argument, or experiment, and record each side's prediction.

   Crux 1: Scaling up the stakes.

     - Experiment: Conduct a centipede game with very high monetary stakes (e.g., several months' income for the subjects) and compare the behavior to a low-stakes version. The question is whether the frequency of early takes increases as the stakes are raised, and whether the average number of passes decreases.

     - Orthodox prediction: As stakes increase, subjects will be more likely to take early because the cost of making a mistake (i.e., passing and then having the opponent take immediately, leaving the passer with a low payoff) becomes more salient. Moreover, high stakes will focus the subjects on monetary incentives, reducing the influence of non-monetary factors. Therefore, the frequency of first-move takes should increase and the average number of passes should decrease.

     - Revisionist prediction: Even at high stakes, the logic of updating at later nodes remains. Subjects who find themselves at a late node will still have to update their beliefs about the opponent. Moreover, the revisionist may argue that high stakes might even make subjects more cautious about taking too early (because passing might lead to a much larger payoff) and thus might not reduce the number of passes. Alternatively, they might predict that the pattern of passing for several moves and then taking will persist, but the take might occur slightly earlier on average due to increased risk aversion. However, the key point is that the backward induction solution (taking at the first node) will still not be the norm.

