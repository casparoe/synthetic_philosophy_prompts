answer: |-
  ## Sestina of the Phantom Time

  The scholar pores, convinced a phantom **Rome**
  Lies hidden underneath the later **HRE**.
  He sees the selfsame hand in faded **script**,
  Ignores the counting in the **dendro** rings,
  Declares that ancient, splintered **Troy** we mourn
  Is but Constantinople in a shifted **year**.

  He charts the echoes, war by bloody **year**,
  Insists Byzantium *is* the older **Rome**
  (Or maybe Cairo? Or reborn New **Troy**?),
  Finds Charlemagne a Caesar of the **HRE**,
  While carbon dates locked deep in stubborn **dendro**
  Become mere scribbles on a smuggled **script**.

  Oh, the seductive weave of matching **script**!
  The pattern blooms across the fractured **year**,
  A doubled crown, a sword, a falling **dendro**
  Like empires felled. This parchment proves true **Rome**
  Was merely practice for the later **HRE**!
  A thousand years collapse onto one **Troy**.

  He feels the thrill, the solved enigma: **Troy**
  Was not destroyed, just copied! Every **script**
  Confirms the overlap: the Papal See, the **HRE**,
  Are ghosts misplaced within the ledgered **year**.
  No need for Dark Ages after ancient **Rome** –
  The proof rejects the testimony of the **dendro**.

  But wait – the hard, slow language of the **dendro**,
  The oaks that stood while Greeks besieged old **Troy**,
  Whose cores hold time no scholar’s forged **script**
  Can mimic. And the stars! That comet’s **year**
  Precisely pinned by records *outside* **Rome**
  Or documents controlled by any **HRE**.

  Observe the fatal crack: the real **HRE**
  Lacks Caesar’s deeds. The growth rings in the **dendro**
  Span gaps no phantom can erase. The **year**
  A scribe described the sack of blazing **Troy**
  Differs entirely from the fall of **Rome**.
  The independent records shred the **script**.

  *Envoi*

  The pattern **script** enthralls – lost **Troy** reborn as **Rome**,
  But **dendro** counts true **year**, not phantom **HRE**.

  ---

  **Notes on Fomenko's New Chronology & the Poem:**

  1.  **Settled Pseudohistory:** Fomenko's core thesis – that conventional chronology is inflated by roughly a millennium due to "phantom time" and that major empires/events (Rome, HRE, Troy, Gothic Wars) are deliberate misdated duplicates – is overwhelmingly rejected by historians and scientists as pseudohistory lacking credible evidence.
  2.  **Refutation by Hard Science:** Scientific dating methods like dendrochronology (tree-rings) and radiocarbon dating provide consistent, independent chronologies spanning millennia that directly contradict Fomenko's proposed timeline compression; they cannot be dismissed as mere scribal errors.
  3.  **Astronomical Disproof:** Records of eclipses, comets, and planetary positions from diverse, globally separated cultures (Chinese, Arabic, European) align precisely with conventional dates but are irreconcilable with Fomenko's drastically shortened timeline, providing multiple independent falsifications.
  4.  **Independent Records Mismatch:** The detailed administrative, economic, and diplomatic records surviving from periods Fomenko claims are "duplicates" (e.g., Carolingian vs. Roman Imperial records) show fundamentally different structures, events, and contexts that cannot be mapped onto each other meaningfully.
  5.  **Poetic Liberties:** For concision, the poem merges Fomenko's identification of the Holy Roman Empire (HRE) as a direct chronological duplicate of the Roman Empire; his actual model is more complex, involving intermediary "phantom" empires. Dendrochronology is simplified as a singular counterpoint; the rupture involves multiple disciplines. The envoi's abrupt shift embodies the conceptual break rather than depicting a specific historical counterargument.
