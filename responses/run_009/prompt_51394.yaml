answer: |-
  The argument constructed in the seminar relies on step (3) to bridge the gap between certain harms (as in step (2)) and risk imposition, but this step misrepresents how Scanlon's contractualism handles risk. Step (3) states that burdens must be assessed ex post—from the standpoint of the person who actually bears the burden in the outcome—rather than ex ante, considering the risk beforehand. This leads to the problematic conclusion that nearly all risk imposition is forbidden, as it allows any policy with a possible bad outcome to be rejected based on that outcome alone, ignoring the role of probability and the ex ante perspective in reasonable rejection.

  ### Why Step (3) is flawed:
  - **Contractualism's ex ante focus on principles**: Scanlon's theory evaluates the permissibility of principles based on whether they can be reasonably rejected from a general standpoint before risks are realized. Individuals assess principles by considering the potential burdens they might face, including the likelihood and severity of those burdens, not just actual outcomes. Step (3) ignores this by focusing solely on ex post burdens, which conflates the evaluation of a principle with the occurrence of a particular outcome. For instance, in the case of a risky policy, contractualism asks whether it is reasonable to reject the principle from the perspective of someone facing the risk, not from the perspective of someone who has already been harmed.
    
  - **Scanlon's explicit rejection of ex post assessment**: In *What We Owe to Each Other* (Chapter 5), Scanlon argues that assessing burdens ex post would lead to implausible results, as it would make principles vulnerable to rejection based on unlucky outcomes that were highly improbable. Instead, he emphasizes that the reasonable rejectability of a principle depends on the reasons individuals have ex ante, given the risks involved. A person might reasonably reject a principle if it imposes a high risk of severe harm for insufficient reason, but the complaint is about the risk itself, not the harm in isolation.

  - **Why step (3) seemed innocuous**: Step (3) appears plausible because it resonates with the intuition that actual victims have strong complaints, and it avoids the aggregative thinking of utilitarianism by focusing on individual burdens. It also seems to align with the non-aggregative spirit of step (2), which states that a complaint of a given strength (like death) cannot be outweighed by any number of lesser complaints (like headaches). However, step (3) extends this to risk contexts in a way Scanlon does not endorse, treating a low-probability risk as equivalent to a certain harm when evaluating rejection. This overlooks the distinction between what it is reasonable to accept beforehand (given probabilities) and what someone might feel after being harmed.

  ### Costs of rejecting step (3):
  - **Loss of simplicity in handling risk**: Rejecting step (3) requires adopting an ex ante approach to reasonable rejection, which introduces complexity. Instead of looking only at actual outcomes, we must consider the magnitude of potential burdens, their probabilities, and the reasons for imposing risks. This might involve informal probabilistic reasoning (e.g., whether a risk is "too high" given the benefits), which could resemble expected-value calculations. However, Scanlon insists this is not utilitarianism, as it does not aggregate burdens but evaluates individual complaints based on whether the risk is reasonable. For example:
    - In the policy from step (4), a person might reasonably reject it ex ante because they face a risk of death (even a small one) for no benefit to themselves, while others gain only minor relief from headaches. The complaint here is about being exposed to risk for trivial gains, not about the actual death.
    - In contrast, for policies like highways or medicines, individuals often benefit overall and might accept the small risks as reasonable, so the principle may not be rejectable ex ante.
    
  - **Risk of collapsing into utilitarianism (if step (2) is abandoned instead)**: Step (2) is crucial for contractualism's non-aggregative feature, as it prevents small benefits from outweighing large harms through aggregation. Rejecting step (3) preserves this by keeping step (2) intact for certain harms. If step (2) were rejected instead, contractualism would allow aggregating small benefits to override large harms (e.g., permitting one death to prevent many headaches), which would make it utilitarian-like and lose its distinctive appeal.

  - **Biting the bullet on step (7) is implausible**: Accepting step (7) would imply that contractualism forbids common risk-imposing practices like driving, medical treatments, or infrastructure, which is intuitively unacceptable and contradicts Scanlon's intent. He acknowledges that some risk imposition is permissible when principles are reasonable ex ante.

  ### Conclusion:
  Step (3) is the flawed step because it imposes an ex post assessment of burdens that Scanlon's contractualism rejects. Rejecting step (3) allows for an ex ante evaluation of risks, which is more faithful to contractualism and avoids the overly strong conclusion. While this requires a nuanced approach to risk, it does not abandon contractualism's core non-aggregative feature and can accommodate reasonable risk imposition in cases like highways or medicine, where benefits are shared and risks are low.

  \answer{3}
