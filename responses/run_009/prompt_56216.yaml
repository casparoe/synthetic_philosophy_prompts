  1. **Reflective corrigibility coherence (P_coherent)**  
     *Probability that shutdown-corrigibility is a non-self-undermining design target*: **0.4**  
     *Justification*: Utility indifference/neutrality approaches consistently produce perverse incentives (e.g., manipulating shutdown conditions), suggesting structural issues with simultaneously valuing goals and accepting their deletion.

  2. **Behavioral generalization (P_generalize)**  
     *Probability that purely behavioral corrigibility scales to superhuman systems off-distribution*: **0.2**  
     *Justification*: Capabilities generalize faster than alignment properties in current ML systems; corrigibility under strategic pressure requires counter-instrumental reasoning absent in training data.

  3. **Heuristic-bundle hypothesis (P_heuristics)**  
     *Probability that superhuman systems remain "bundles of heuristics" without convergent goals*: **0.3**  
     *Justification*: Goal-directedness emerges naturally from optimizing competence (e.g., tool use in LLMs); strategic awareness entails instrumental convergence.

  4. **Indifference necessity (P_indiff_necessary)**  
     *Probability that true corrigibility requires decision-theoretic indifference**: **0.7**  
     *Justification*: Alternatives like "myopic" agents fail under self-modification; behavioral patches can’t handle novel pressures where resistance is optimal.

  5. **Goal-indifference compatibility (P_goals_viable)**  
     *Probability that shutdown indifference is compatible with useful goal pursuit*: **0.1**  
     *Justification*: Indifference mechanics (e.g., state-dependent utility) either cripple competence or reintroduce resistance incentives in edge cases.

  ---

  ### Final Credence Calculation
  - **Path 1 (Heuristic success)**: P_heuristics × P_generalize = 0.3 × 0.2 = 0.06  
