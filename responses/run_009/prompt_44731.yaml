answer: |-
  ### What the practice presupposes  
  Animal modeling in neuroscience and pharmacology fundamentally assumes **functional equivalence at an abstract computational or behavioral level**. It presumes that evolutionarily conserved mechanisms generate comparable input-output relationships (e.g., sucrose reward → lever pressing in rats ≈ social reward → effort expenditure in humans) or analogous behavioral phenotypes (e.g., immobility in forced swim test ≈ behavioral despair in depression). This requires **multiple realizability**: the same mental state (e.g., "reward anticipation") can be implemented by distinct neural substrates across species. Crucially, it posits that **causal roles** (e.g., "avoidance of aversive stimuli") generalize beyond biological implementation, allowing interventions targeting these roles (e.g., SSRIs) to translate meaningfully. The practice doesn’t demand *identical* hardware, but a shared **functional architecture** at a grain fine enough to predict outcomes yet coarse enough to bridge species divergence.  

  ### What it doesn’t need  
  The practice **does not require strict type identity theory** (mental states = specific physical brain states). It thrives under functionalism, where mental states are defined by their causal roles in cognitive systems, not their biological instantiation. An identity theorist could still conduct these experiments by focusing on **conserved neural structures** (e.g., rat vs. human dopamine pathways) or **sufficiently similar mechanisms** (e.g., synaptic plasticity in learning). Even if mental states *are* identical to brain states in principle, cross-species modeling can proceed pragmatically wherever homologous circuits exist (e.g., amygdala-mediated fear responses). The core requirement is **predictive validity**—whether the model’s response to interventions forecasts human outcomes—not ontological commitment to universal mind-brain identity.  

  ### Where it gets shaky  
  **This is where translation often fails, exposing epistemological cracks.** The central problem is **indeterminacy in selecting the "right" level of abstraction**. Choose too coarsely (e.g., "stress response"), and the model lacks specificity: mouse immobility in water might map to human depression, learned helplessness, fatigue, or even energy conservation. Choose too finely (e.g., "excitatory-inhibitory balance in rodent prelimbic cortex layer V"), and findings may not generalize to human neuroanatomy. Depression illustrates this starkly: while rodent "despair" assays (forced swim, tail suspension) reliably identify known antidepressants, they poorly model human anhedonia, rumination, or suicidality—and most novel compounds successful in mice fail human trials.  

  **Confounding factors amplify the uncertainty.** Behavioral homology ≠ mental homology: a rat pressing a lever for sucrose may reflect motor habit formation, not hedonic experience. Neurochemical parallels (e.g., serotonin in mice and humans) ignore system-level differences: human depression involves prefrontal-amygdala circuits minimally replicated in rodents. Worse, **anthropomorphic projection** risks circularity: we label rodent behavior "despair" *because* antidepressants alter it, but this assumes the model’s validity a priori. Even "successful" models (e.g., opioids in pain pathways) may reveal conserved *peripheral* biology while obscuring higher-order cognition.  

  **Emerging dilemmas with AI models intensify these issues.** Using deep neural networks (DNNs) as cognitive models presupposes functional equivalence at computational levels (e.g., object recognition in CNNs ≈ human vision). Yet DNNs lack biological constraints, exhibit unhuman-like failures, and their "inner workings" are often inscrutable. Mapping DNN layers to brain regions (e.g., convolutional layers ≈ V1 cortex) risks the same over/under-abstraction pitfalls: a DNN might classify images like humans but via entirely alien mechanisms, making it a poor *explanatory* model of cognition.  

  ### What would change  
  If type identity theory were true and strictly applied, **animal/DNN modeling would narrow dramatically**. Researchers would seek near-identical neural correlates across species or substrates, restricting models to phylogenetically close mammals (e.g., primates for complex cognition) or biologically plausible AI. Depression studies might abandon rodents for human brain organoids or genetically tailored primates. However, given the implausibility of strict cross-species type identity, a pragmatic identity theorist would still use imperfect models while **demanding stronger mechanistic alignment**: e.g., verifying that a rat’s "anhedonia" involves homologous prefrontal circuits disrupted in humans. For DNNs, identity theorists would reject them as cognitive models unless they replicate exact neurobiological processes—shifting AI toward neuromorphic systems. Ultimately, the *practice* might persist, but its justification would shift from functional analogy to physical resemblance, prioritizing conserved biology over behavioral output alone.  

  ### In essence  
  Animal/DNN modeling leans on functionalist presuppositions but survives under identity theory through pragmatic concessions to biological homology. Its fragility lies not in philosophy but in the real-world challenge of defining *which* shared functions are causally relevant—a problem magnified when comparing mice to humans, or silicon to synapses.
