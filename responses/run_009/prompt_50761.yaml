  I'll start ranking. Top tier should handle revenge and Curry while keeping truth expressive. Dialetheism might be S-tier because it accepts contradictions with paraconsistent logic, avoiding explosion. It handles both liar and Curry, and allows a universal truth predicate. But is it satisfying? Explosion is avoided, but embracing true contradictions is counterintuitive.

  Tarski's hierarchy is clean but fragments truth into levels, breaking expressiveness. You can't have a single truth predicate for the whole language, which fails the friend's point about expressive economy. Also, Curry might be handled at each level, but the hierarchy itself is problematic.

  Kripke's approach allows truth gaps, but revenge liars appear when you try to talk about those gaps. The theory can't name its own gaps without moving to a meta-language, leading to similar issues as Tarski. Curry is handled if implication is defined carefully, but expressiveness is limited.

  Revision theory uses a circular definition with rules that update the truth value. It avoids revenge by making the process dynamic, but Curry is a problem if implication is material. Also, the truth predicate is non-classical, which might not serve the expressive purpose well.

  Contextualism shifts the extension of truth in different contexts. It handles revenge by context changes, but Curry might still be an issue. The predicate's shifting nature could make semantic ascent messy, though it's more flexible than hierarchies.

  Proposition failure dismisses the liar as meaningless. But the revenge liar then questions why it's meaningless, leading to infinite regress. Curry isn't addressed, and it shuts down discussion rather than solving it. Probably F-tier.

  Now, balancing revenge handling, Curry, and expressiveness. Dialetheism scores high on all but is controversial. Tarski fails expressiveness. Kripke struggles with revenge. Revision handles revenge but not Curry well. Contextualism is middling. Proposition failure is worst.

