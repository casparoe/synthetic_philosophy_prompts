prompt: |-
  My roommates had a long fight after a utilitarianism talk and I got drafted as referee. Maya said the demandingness objection is fatal to consequentialism: if it's true, you have to keep giving until giving more hurts you as much as it helps, which would eat basically your whole life, so much the worse for consequentialism. Dan said the objection proves too much — any decent morality can demand huge sacrifices (hiding refugees at risk of your own life), so unless you can say where "too demanding" starts, it's just discomfort dressed up as an argument. Maya came back with what I thought was the interesting move: the real complaint isn't the amount, it's unfairness. If everyone did their fair share, each person's burden would be light; the moral life only feels crushing because it's loaded onto the few who take it seriously. So the demandingness objection is really about noncompliance, not about consequentialism per se. Dan said "unfair" isn't a lever a consequentialist can pull without smuggling in constraints, and anyway in the actual world the duties are what they are — you can't wish the burden away by noting it'd be lighter in a better world. Maya's last word was that even consequentialists should care about moral codes that burn out their followers, since those produce less good over time, so demandingness is an internal empirical objection, not a gut reaction. Dan called that rule-consequentialism in a trenchcoat and said it faces the standard collapse dilemma. Can you go through the exchange step by step and tell me who's right about what, and whether either of them is missing something the whole fight skips over? I genuinely can't tell if Maya's fairness move rescues the objection or quietly changes the subject.
reasoning: |-
  Okay, the user's roommates had a heated debate about utilitarianism and demandingness, and now they need help unpacking it. Let me start by breaking down each part of their exchange.

  First, Maya presents the demandingness objection: consequentialism requires extreme sacrifice until giving more hurts you as much as it helps. That seems overwhelming and impractical, so she thinks it's a fatal flaw. Dan counters that any moral system can demand huge sacrifices, like hiding refugees, so unless there's a clear line for "too demanding," it's just discomfort, not a real argument. 

  Maya's fairness move is interesting. She shifts from the amount of sacrifice to the unfair distribution. If everyone did their part, the burden would be light. The problem isn't consequentialism itself but others' noncompliance. Dan responds that "unfairness" implies deontological constraints, which consequentialists can't use without inconsistency. Plus, in reality, the duties remain heavy regardless of others' actions. 

  Maya then argues that even consequentialists should care about burnout because unsustainable moral codes lead to less good over time. Dan dismisses this as rule-consequentialism in disguise, facing the collapse dilemma—either it reduces to act-consequentialism or it's arbitrary. 

  Now, the user's main question is whether Maya's fairness move rescues the objection or changes the subject. Also, they want to know who's right and if anything was missed. 

  First, Maya's fairness point does shift the focus from demandingness per se to compliance. But Dan is right that consequentialism evaluates actions based on outcomes, not fairness unless it affects outcomes. However, Maya's burnout argument ties fairness to long-term effectiveness, which is a consequentialist consideration. Rule-consequentialism might offer a solution, but Dan's collapse critique is valid—it risks reverting to act-consequentialism. 

  The deeper issue might be the structure of moral demandingness. Both roommates might overlook how psychological sustainability interacts with moral theory. Also, the distinction between ideal and non-ideal theory is crucial but not addressed. In a non-ideal world with partial compliance, how should a consequentialist act? Hybrid approaches or institutional solutions could be alternatives. 

  The user might need clarity on whether consequentialism can incorporate fairness without abandoning its principles. Maya's burnout argument suggests it can through empirical considerations, but Dan's skepticism points to foundational tensions. The unresolved tension between individual maximization and collective fairness remains key. Highlighting the compliance problem and psychological realism could provide the user with the nuanced understanding they seek.
answer: |-
  Here's a breakdown of the exchange, analyzing each step and the underlying arguments:

  1.  **Maya's Initial Demandingness Objection:**
      *   **Claim:** Consequentialism (especially classical utilitarianism) is fatally flawed because it demands that you keep giving resources/time/effort to help others until giving *more* would cause you as much harm as it provides benefit to others. This would consume virtually your entire life, making it an impossible and unreasonable moral standard.
      *   **Underlying Logic:** Morality shouldn't demand such extreme personal sacrifice; if it does, that's a reason to reject the theory.
      *   **Assessment:** This is a standard and powerful objection. Maya accurately describes the implication of maximizing total good impartially. Her conclusion that this is "so much the worse for consequentialism" is the crux of the objection.

  2.  **Dan's First Response ("Proves Too Much"):**
      *   **Claim:** The demandingness objection isn't specific to consequentialism. Any plausible moral system (e.g., deontology, virtue ethics) can demand huge sacrifices in extreme situations (e.g., risking your life to hide refugees). Since we accept such demands *sometimes*, we can't just reject a theory because it's demanding *in general*. We need a principled way to say *when* it becomes "too demanding," which the objection doesn't provide; it might just be expressing discomfort.
      *   **Underlying Logic:** Demandingness alone isn't a decisive objection if we accept demandingness in other contexts. The objection needs a threshold principle.
      *   **Assessment:** Dan makes a strong point. The demandingness objection risks being arbitrary if it doesn't explain *why* consequentialism's *type* or *degree* of demandingness (constant, life-consuming) is worse than the demandingness accepted in other moral systems in critical moments. He highlights the need for a criterion for "excessive" demandingness.

  3.  **Maya's Fairness Move:**
      *   **Claim:** The *real* complaint isn't the absolute amount demanded, but the *unfair distribution* of the burden. If *everyone* did their fair share (complying with the moral demands), each person's individual burden would be manageable. The "crushing" feeling arises because the moral burden falls disproportionately on the few conscientious people, while free-riders shirk their responsibility.
      *   **Underlying Logic:** The problem is systemic non-compliance, not the inherent demands of consequentialism in an ideal world of full compliance. The objection targets the *actual* demands placed on the individual in a non-ideal world, not the theoretical demands of the theory itself.
      *   **Assessment:** This is a significant shift and a sophisticated insight. Maya reframes the objection from "consequentialism demands too much *simpliciter*" to "consequentialism, *in the context of widespread non-compliance*, imposes an unfairly heavy and unsustainable burden on the compliant." She identifies non-compliance as the core issue making the demands *feel* and *be* excessive.

  4.  **Dan's Response to Fairness ("No Lever / Duties are What They Are"):**
      *   **Claim A:** "Unfairness" isn't a fundamental concept pure consequentialists can readily use. Consequentialism evaluates acts/states solely by consequences. Calling a situation "unfair" typically implies a deontological constraint (like a right to fairness) or a non-consequentialist value, which act-consequentialism doesn't recognize independently of outcomes. Invoking unfairness smuggles in non-consequentialist elements.
      *   **Claim B:** Regardless of fairness, in the *actual* world (with non-compliance), the consequentialist duty *is* to maximize the good. Wishing the burden were lighter because others *should* help doesn't change the fact that *you* need to do what produces the most good *now*. Noting the unfairness doesn't lessen your actual obligation.
      *   **Assessment:**
          *   **A:** Dan is largely correct for *act-consequentialism*. Pure act-consequentialism lacks intrinsic concern for fairness as a constraint; fairness only matters if it affects overall consequences (e.g., if unfairness causes resentment that reduces overall good). Maya *is* introducing a non-consequentialist concept directly.
          *   **B:** This is a strong *practical* point. The ideal world of full compliance doesn't exist. The consequentialist agent must act in the real world, where others *aren't* doing their share, meaning the burden *is* heavy on them. Moral obligations don't vanish because they *should* be shared.

  5.  **Maya's Internal Empirical Objection (Burnout):**
      *   **Claim:** Even consequentialists *should* care about demandingness because moral codes that lead to "burnout" (exhaustion, resentment, abandonment of morality) are counterproductive. If a code is too demanding for real humans in the real world, fewer people will follow it consistently, leading to *less* good overall compared to a code that is psychologically sustainable. So, demandingness *is* a legitimate internal objection based on empirical consequences.
      *   **Underlying Logic:** Sustainability and psychological realism are crucial for maximizing long-term good. A theory that demands too much will collapse under its own weight and produce worse outcomes than a less demanding alternative.
      *   **Assessment:** This is a clever consequentialist response. Maya pivots to arguing that demandingness *is* a problem *for consequentialism itself* on its own terms, not just an external complaint. It's an argument about feasibility and long-term efficacy.

  6.  **Dan's Final Point (Rule-Consequentialism in a Trenchcoat / Collapse Dilemma):**
      *   **Claim:** Maya's burnout argument isn't really act-consequentialism; it's the core argument for **Rule-Consequentialism** (RC). RC says we should follow the *rules* which, if generally accepted/followed, would produce the best consequences. RC often uses demandingness/burnout as a reason to adopt less demanding rules than act-consequentialism would dictate in individual cases.
      *   **Critique:** RC faces the "Collapse Dilemma":
          *   If the RC rule for a situation says "Do X," but you realize that *breaking* the rule *in this specific case* would produce slightly more good, then a consistent consequentialist *should* break the rule. This collapses RC back into Act-Consequentialism (AC).
          *   If RC insists you follow the rule *even when* breaking it would produce more good in that instance, then RC has abandoned consequentialism and smuggled in deontological constraints ("follow the rule, period").
      *   **Assessment:** Dan accurately identifies Maya's move as aligning with RC. The collapse dilemma is a standard and serious challenge for RC. If Maya wants to remain purely consequentialist, the dilemma suggests her sustainable code either reverts to demanding AC in practice or abandons consequentialism.

  **Who's Right About What?**

  *   **Maya** is right that:
      1.  Classical Act-Consequentialism *is* extremely demanding.
      2.  The *experience* of crushing demandingness is heavily exacerbated by non-compliance/free-riding.
      3.  Demandingness *can* be an *internal* problem for consequentialism if it leads to burnout and reduced overall good (the RC argument).
  *   **Dan** is right that:
      1.  Demandingness alone isn't a *unique* or *decisive* objection without a threshold principle (other theories can be demanding too).
      2.  Invoking "unfairness" directly is problematic for *pure act-consequentialism* as it relies on non-consequentialist intuitions.
      3.  In the real world of non-compliance, the act-consequentialist duty *remains* heavy regardless of fairness.
      4.  Maya's burnout solution points directly to Rule-Consequentialism, which faces the significant collapse dilemma.

  **What's Missing? The Core Tensions & Nuances**

  1.  **The Compliance Problem is Central, Not Sidelined:** Maya brilliantly identified non-compliance as the engine making the demands crushing *in practice*. However, Dan correctly points out that this doesn't magically dissolve the *actual* demanding duty of the conscientious consequentialist *in that non-compliant world*. The tension between the ideal demand (light if shared) and the actual demand (heavy due to non-compliance) is real and painful. Neither fully resolves it:
      *   **Maya:** Wishes the burden *were* lighter due to compliance, but doesn't change the *duty* for the individual facing non-compliance.
      *   **Dan:** Acknowledges the heavy *duty* but downplays the psychological/systems-level problem Maya highlights.
  2.  **Rule-Consequentialism's Viability:** Dan dismisses RC via the collapse dilemma, but RC proponents have sophisticated responses (e.g., "follow the rules" *is* the best consequentialist strategy due to epistemic limitations, coordination problems, and the risk of self-serving bias if everyone tries to be an act-consequentialist). The debate over RC's viability is deep and ongoing. Maya's point about sustainability is a strong *motivation* for RC, even if RC has challenges.
  3.  **Psychological Realism:** Both grapple with it indirectly. Maya explicitly brings it in via burnout. Dan implicitly relies on it when noting the discomfort objection. A deeper dive might explore how human psychology (limited willpower, partiality, need for personal projects) interacts with moral theory – is consequentialism asking the impossible or merely the very difficult? Are humans capable of the level of impartiality required?
  4.  **Distinction Between Ideal and Non-Ideal Theory:** Maya's fairness move highlights the gap. Consequentialism might be fine in *ideal theory* (full compliance). But the demandingness objection is primarily about *non-ideal theory* (our world). How should consequentialism adapt to non-compliance? (This connects directly to the RC discussion).
  5.  **"Fair Share" Definition:** What *is* a "fair share" for a consequentialist? Is it an equal sacrifice? Equal percentage of resources? The share that maximizes good if everyone did likewise? Defining this consequentialist "fair share" is complex and wasn't addressed.

  **Conclusion: Did Maya Rescue the Objection or Change the Subject?**

  *   **Changed the Subject?** In a way, yes. She shifted the focus from the *theoretical* demands of consequentialism *in principle* to the *practical* demands *in the context of non-compliance*. She moved the objection from being about the *substance* of consequentialism to being about the *implementation environment*.
  *   **Rescued the Objection?** Also, yes. By reframing it as a problem of **unfair burden distribution due to non-compliance**, she made the *experience* of demandingness more intelligible and pointed to a systemic issue (low compliance) rather than just individual discomfort. More importantly, by linking demandingness to burnout and reduced long-term good (**the internal empirical objection**), she gave consequentialism itself a reason to care about demandingness. This *is* a rescue attempt on consequentialist grounds.

  **The Verdict:** Neither "won" outright. Maya exposed the crucial role of non-compliance and offered a consequentialist reason (sustainability) to care about demandingness. Dan effectively defended the core logic of act-consequentialism against the fairness move and highlighted the challenges of Maya's solution (RC's collapse dilemma). The fight reveals the deep tension within consequentialism between maximizing the good in each act and creating a sustainable system for generating good over time, compounded by the harsh reality of partial compliance. Maya's fairness move doesn't *refute* consequentialism, but it powerfully articulates *why* its demands feel (and often are) overwhelming and arguably counterproductive in the real world, pushing towards more complex consequentialist solutions like RC.
