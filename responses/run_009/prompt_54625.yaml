answer: |-
  Here’s a targeted Q&A prep sheet for your seminar, prioritizing objections by damage potential and phrasing them in the language of ML/MT researchers. Each reply includes a concise rebuttal and a candid note on weaknesses.

  ---

  ### **Q&A Prep Sheet: Literary Translation vs. Neural MT**  
  **Core Thesis:** *MT excels at propositional transfer but fails at constrained literary translation (meter, wordplay, register, cultural lightness) due to its inability to model intention, ambiguity, and form-meaning symbiosis.*  

  ---

  ### **Top 8 Objections & Rebuttals**  
  *(Ordered by damage potential)*  

  1. **Objection (Scalability Argument):**  
     *"Your examples are edge cases. At scale, COMET-22 scores show NMT outperforming humans on adequacy/fluency for most genres. Isn’t this just diminishing returns on niche aesthetics?"*  
     **Reply:**  
     "COMET measures similarity to human references, not artistic intent. Literary constraints aren’t ‘edges’—they’re the core challenge. When meter or puns are central to a text’s function (e.g., Perec’s *La Disparition*), MT fails catastrophically because it lacks a theory of mind to prioritize form. Scaling won’t fix ontological blindness."  
     **Soft Spot:** *Concedes MT wins on bulk utilitarian prose. Doesn’t disprove future architectural breakthroughs.*  

  2. **Objection (Emergent Capabilities):**  
     *"Recent LLMs show emergent metalinguistic skills via few-shot prompting. With multimodal grounding and larger context windows, won’t they learn to ‘understand’ constraints?"*  
     **Reply:**  
     "Emergent skills are probabilistic pattern-matching, not understanding. Show me an MT system that, when translating Goethe’s *Faust*, recognizes that *"Bin ich ein Gott?"* must scan as iambic tetrameter *and* carry the irony of Faust’s hubris. No prompt engineering solves this—it requires modeling authorial voice, which isn’t in the training distribution."  
     **Soft Spot:** *Assumes current limitations are permanent. Ignores rapid progress in in-context learning.*  

  3. **Objection (Human Evaluation Flaws):**  
     *"Human evaluations are subjective and noisy. If post-edited MT output passes blind literary reviewer checks, why insist on ‘depth’?"*  
     **Reply:**  
     "Because post-editing *is* human translation wearing MT’s shackles. Editing ‘The sun did surrender’ into ‘The sun set’ loses poetic agency. Metrics can’t capture what’s discarded—the text’s soul. If reviewers accept flattened output, that’s a cultural failure, not technical success."  
     **Soft Spot:** *Relies on hard-to-quantify ‘soul.’ Risks sounding elitist.*  

  4. **Objection (Hofstadter’s AI Work):**  
     *"Hofstadter built analogy-driven AI models. Doesn’t that contradict your argument? Today’s LLMs are scaling up his vision."*  
     **Reply:**  
     "Hofstadter’s models (*Copycat*, *Fluid Concepts*) were microworlds testing cognitive architecture—not statistical approximators. He argued that MT confuses *rephrasing* with *reconceptualization*. LLMs scale pattern replication, not the ‘slippery essence’ of cross-linguistic analogy he prized."  
     **Soft Spot:** *His work is niche. Modern LLMs undeniably outperform his models.*  

  5. **Objection (Data Efficiency):**  
     *"Fine-tuned LoRAs on literary corpora can capture stylistic features. Why can’t we solve this with domain adaptation?"*  
     **Reply:**  
     "LoRAs adjust weights but can’t invent creative solutions. Take multilingual puns: translating ‘*Je suis ein Berliner*’ requires knowing JFK misused German for rhetorical effect. No fine-tuning resolves that—it demands real-time cultural inference, not parameter tweaking."  
     **Soft Spot:** *Ignores hybrid human-in-the-loop systems.*  

  6. **Objection (Economic Realities):**  
     *"Post-editing cuts costs by 40%. For 90% of content, quality loss is marginal. Isn’t this just market efficiency?"*  
     **Reply:**  
     "Efficiency isn’t the sole metric. Literature isn’t ‘content’—it’s art. Monetizing Kafka by stripping his unstable register is like selling Van Gogh as clip art. If publishers automate literary death, they’ll degrade culture to ‘propositional sludge.’"  
     **Soft Spot:** *Assumes art > economics. Doesn’t address budget constraints.*  

  7. **Objection (Your Expertise Bias):**  
     *"Your workflow depends on slow, human-centric methods. Couldn’t MT expand access to literature, even at 80% fidelity?"*  
     **Reply:**  
     "Access is vital, but bad translation entrenches cultural imperialism. Google Translate turns Aimé Césaire’s *Cahier d’un retour au pays natal* into tourist brochure. Amplifying noise isn’t access—it’s erasure. We need *more* human investment, not less."  
     **Soft Spot:** *Overlooks underserved languages where MT is the only option.*  

  8. **The Nuclear Option (Rent-Seeking Accusation):**  
     *"Aren’t you defending craft privileges? What evidence would make you concede MT can handle literary depth? Is this just Luddism?"*  
     **Reply:**  
     "If an MT system can translate Queneau’s *Exercices de Style* 99 ways while preserving stylistic constraints, I’ll applaud. But today’s MT can’t even *detect* those constraints. My resistance isn’t about fees—it’s about defending meaning beyond utilitarianism. The day MT generates a poignant, meter-perfect haiku from Rilke without human intervention, I’ll reconsider. Until then, this is about stewardship, not rents."  
     **Soft Spot:** *Emotionally charged. Concedes ground on hypothetical future success.*  

  ---

  ### **Tactical Notes**  
  - **Lead with Data:** Acknowledge MT’s triumphs in commercial domains first to build credibility.  
  - **Weaponize Their Metrics:** Cite studies where BLEU/COMET fails to penalize artistic loss (e.g., MT flattening irony).  
  - **Hofstadter Jujutsu:** Stress that his AI work exposed the *chasm* between syntax and semantics—it wasn’t a blueprint for MT.  
  - **Bridge the Gap:** Propose a joint challenge: *"Build an MT system that translates a pun-heavy sonnet. I’ll post-edit it blind. Let’s compare losses."*  

  **Final Thought:** Your goal isn’t to "win" but to complicate their engineering mindset. The strongest point remains: **MT cannot choose meaning—it calculates likelihoods. Literature demands choices.**  

  ---  
  *Good luck. Make Hofstadter proud.*
