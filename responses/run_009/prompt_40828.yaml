answer: |-
  ## The Burden of the Awkward: Why Evolutionary Psychology Fails the Test (But Your Fish Didn't)

  Professor, your hunch cuts to the core of the scientific method. Evolutionary Psychology (EP) *aspires* to be real science – applying evolutionary principles to the mind. But its frequent failure lies precisely in evading the burden of *falsifiable prediction* you rightly demand. To earn scientific status, an EP hypothesis **must commit, *in advance*, to specific, non-obvious, and potentially *awkward* design features predicted by its adaptive logic, features that would be maladaptive or nonsensical under plausible alternative explanations.** Most EP fails this standard, succumbing to the "just-so" trap.

  The strongest "just-so" critique isn't about storytelling *per se*; biology is inherently historical. It's about *testability*. If an adaptive story merely *accommodates* known behavior ("men prefer young mates because of ancestral reproductive value!"), it's post-hoc rationalization. The bar isn't plausibility; it's **predictive novelty and constraint**.

  Here's the standard an EP hypothesis must meet:

  1.  **Predict an "Adaptive Burden":** Based on the hypothesized selective pressure, specify *in advance* the *costly*, *complex*, or *counter-intuitive* design quirks the adaptation *should* exhibit. Why? Because natural selection is a tinkerer, not an omnipotent engineer. Adaptations bear the marks of their evolutionary constraints.
  2.  **Make it Risky:** These features must be non-obvious consequences of the adaptive logic, not simply restatements of the behavior itself. They should be features we *wouldn't* expect without that specific selective history and which *would be maladaptive* under competing hypotheses (e.g., pure cultural learning, general learning mechanisms).
  3.  **Empirically Grounded:** These predictions must be testable against neural, developmental, cross-cultural, or comparative data *beyond* the initial observation.

  Consider your fish: Hypothesizing that rapid growth evolved under high juvenile predation predicts an *adaptive burden* – a costly trade-off, like reduced immune function or accelerated senescence *later*. Finding this trade-off, predicted *a priori*, is strong evidence. It's not just "fish grow fast to escape predators" (the observation); it's "if escaping predators *shaped* growth, we *must* find this specific, costly consequence."

  Now, apply this to a classic EP claim: "Sex differences in jealousy (men more distressed by sexual infidelity, women by emotional) evolved due to paternity uncertainty vs. resource loss." Does it meet the standard?

  *   **Post-Hoc?** Often presented *after* observing the difference.
  *   **Predicts an Adaptive Burden?** What specific, costly *neurological quirk*, *developmental sensitivity*, or *cross-culturally universal irrational bias* does this hypothesis *demand*? EP proponents might point to the jealousy difference *itself* – but that was the initial observation! They might claim universality, but cultural variation often challenges this, and universality alone doesn't prove adaptation (could be cognitive byproduct). Crucially, **where is the predicted *awkward feature*?** Where is the specific, non-functional cognitive bias *caused* by this adaptation that wouldn't make sense otherwise? Without predicting *novel*, constraining features – the equivalent of the fish's senescence cost – it remains a plausible story draped over existing data, vulnerable to alternative explanations like socialization patterns.

  **So, does this standard indict EP? Largely, yes.** Much prominent EP work excels at generating plausible adaptive narratives for known behaviors but falters at generating and testing *novel, constraining predictions* of specific, costly design features. The "tests" often boil down to surveys confirming the initial behavior exists, sometimes cross-culturally, which is necessary but insufficient. It lacks the predictive bite of the life-history trade-off.

  **Would it indict your own field? Honestly, yes – sometimes.** Early sociobiology and some behavioral ecology suffered similar flaws: "The gazelle stots to signal fitness!" (But what specific, costly signal form *must* it have? What awkward constraint? Could it be a sensory byproduct?). However, life-history theory, as you know, often *excelled* by focusing precisely on measurable trade-offs – growth vs. reproduction, current vs. future investment. Predicting the *awkward cost* was its strength. The best modern EP strives for this (e.g., predicting specific cognitive biases or neural response patterns as burdensome signatures of ancestral selection), but it remains the exception, not the norm, and faces immense challenges reverse-engineering the "awkward burdens" of cognitive adaptations.

  The verdict? EP *could* be rigorous science. But currently, it often fails the fundamental test you identified: demanding that its adaptive stories shoulder the burden of predicting the awkward, costly, constraining marks of evolution – the very marks that distinguished the best work in your own field from mere speculation. Until it consistently embraces this burden, the "just-so" label, for much of its output, sticks.
