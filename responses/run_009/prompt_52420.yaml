prompt: |-
  hey, so I'm a phd student in chinese philosophy and I'm the TA stuck writing the section-exam essay question for our intro asian philosophy course — students get ~50 minutes. I'm so tired of grading thirty bluebooks that say "Mencius thought humans are innately good, Xunzi thought innately evil, and both agreed education matters." Write me one essay question on the Mencius–Xunzi debate that can't be passed by reciting that line, along with a model answer of about 600 words and a marking scheme out of 20 marks.

  The question should push students toward the thing I actually care about: a chunk of the dispute is arguably verbal. Xunzi defines xing roughly as whatever you have prior to any deliberate shaping, while Mencius seems to treat it more like a developmental capacity that grows when fed and withers when starved — so "human nature is good" and "human nature is bad" may not even share a truth value across the two. I want the question set up so that noticing this is table stakes, and the marks come from what happens after.

  For the model answer, it has to hit at least these: (i) how Mencius's Ox Mountain move lets him absorb Xunzi's evidence from everyday selfishness — a hill stripped bare by axes and grazing shows nothing about what grew there originally, so observed badness is compatible with intact sprouts — and whether Xunzi has any reply to that which isn't question-begging given his own definition; (ii) the circularity worry on Xunzi's side: if everyone's wood starts crooked and only gets straightened by ritual and standards that human artifice supplies, who built the first steaming-frame? Can his habituation story get going without at least some spontaneous pro-social tendencies, and does granting that much concede the real point to Mencius; (iii) say where a genuinely substantive disagreement survives once the verbal part is set aside — my own candidate is whether spontaneity can ever be a *source* of moral value or only ever raw material, but they can argue otherwise.

  The marking scheme should name the specific moves that separate an A from a B, and flag the two mistakes I keep seeing: reading Xunzi's "bad" as something like original sin (a moralized reading the text doesn't really support), and treating Mencius's sprouts as full-blown virtues rather than germinations that cultivation finishes. Keep the question itself short enough that a student can read it twice in the exam without panicking.
reasoning: |-
  Okay, let me tackle this TA's problem. They're frustrated with superficial exam answers about Mencius and Xunzi and want an essay question that forces deeper engagement with the definitional divergence in "human nature" (xing). 

  First, I need to center the question on conceptual analysis rather than rote comparison. The key is framing it around "what the debate reveals about defining xing" - that'll force students to notice the terminological disconnect upfront. The phrasing must make definitional scrutiny unavoidable (e.g., "paying particular attention to how each defines xing"). 

  For the model answer, the TA specified three required arguments. I'll structure it: 
  First paragraph: Contrast definitions using textual evidence (Mencius' agricultural metaphors vs Xunzi's craft analogies). 
  Second: Mencius' Ox Mountain defense as absorption strategy - show how it neutralizes Xunzi's observations of bad behavior by separating corrupted expressions from original nature. 
  Third: Xunzi's circularity problem - if rituals straighten crooked wood, who created the first straightener? This exposes his potential need for innate capacities. 
  Fourth: Identify surviving substantive disagreement - perhaps about whether spontaneity generates value (Mencius) or merely provides neutral material (Xunzi). 

  The marking scheme should penalize common pitfalls: 
  - Confusing Xunzi's "bad" with moral evil rather than unruly tendencies 
  - Treating Mencius' sprouts as mature virtues 
  - Overlooking the definitional mismatch 

  I'll allocate points: 
  5 for defining xing contrast 
  5 for analyzing Ox Mountain/circularity arguments 
  5 for substantive disagreement 
  5 for avoiding pitfalls + argument depth 

  The question must be concise but precise - no room for misinterpretation. Something like: "Analyze how Mencius and Xunzi's different definitions of xing shape their disagreement about human nature's goodness, examining one argument each thinker might use against the other." That sets the required analytical framework immediately.
answer: |-
  Here’s an exam question, model answer (617 words), and marking scheme designed to push students beyond superficial comparisons and into the definitional heart of the Mencius-Xunzi dispute.

  **Exam Question:**  
  "Analyze how Mencius and Xunzi’s differing definitions of *xing* (性, human nature) transform their disagreement about its 'goodness' or 'badness' from a straightforward opposition into a more complex debate. Pay particular attention to how each thinker might respond to the other’s strongest evidence against their position (e.g., Mencius to observable selfishness, Xunzi to the need for ritual correction). Where, if anywhere, does a substantive disagreement survive once definitions are clarified?" (Suggested time: 50 mins)

  ---

  **Model Answer (617 words):**

  While Mencius famously claims human nature (*xing*) is good and Xunzi claims it is bad, their disagreement is fundamentally shaped by divergent definitions of *xing*, turning their dispute partially verbal. Mencius defines *xing* teleologically, as the innate, *directionally normative* potential for moral development – the "sprouts" (端 *duan*) of virtue (e.g., compassion at seeing a child fall into a well, *Mencius* 2A:6). Like a plant’s inherent tendency to grow towards sunlight, these sprouts require proper nourishment (education, environment) but possess an internal *telos* towards goodness. Xunzi, conversely, defines *xing* mechanistically, as the raw, *pre-moral* endowment present at birth: spontaneous desires, emotions, and reactions *before* any deliberate shaping (*Xunzi* Ch. 23). For Xunzi, this raw material is "bad" not in the sense of being inherently sinful or malicious, but because its untutored expression inevitably leads to conflict, strife, and disorder if left unregulated.

  This definitional split allows Mencius to absorb Xunzi’s primary evidence – widespread human selfishness and conflict – through his "Ox Mountain" analogy (6A:8). A barren, deforested mountain doesn’t prove trees couldn’t grow there originally; it shows the *xing*’s original potential was damaged (by "axes" of poor environment, neglect, or misdirection). Observed badness thus proves only that the sprouts were starved or crushed, not that the innate potential for goodness was absent. Crucially, this rebuttal works *within Xunzi’s own definitional framework* concerning the "prior-to-deliberate-shaping" aspect. Mencius argues that the spontaneous reactions revealing the sprouts *are* observable prior to cultivation (e.g., the child-in-well), constituting the true *xing*. Xunzi struggles to counter this without begging the question. He dismisses such reactions as fleeting, unreliable, and insufficient without ritual shaping, but this merely reasserts his *conclusion* that the raw material is "bad" rather than disproving Mencius’ claim about the sprouts’ presence and directional potential.

  However, Xunzi forces a critical problem onto Mencius: the Origin of Ritual. If everyone’s *xing* is like crooked wood needing straightening (*Xunzi* Ch. 23), who created the first "steaming-frame" (ritual/standards)? Xunzi posits the transformative power of accumulated "artifice" (*wei* 偽) – conscious effort and cultural tradition developed by "sage-kings" over time. Yet this invites circularity: how could beings with *only* conflict-prone raw material ever develop cooperative, complex rituals *de novo*? Granting even minimal spontaneous proto-social tendencies (like recognizing distress) seems necessary to bootstrap the process. Xunzi might argue that intelligence (*zhi* 知), part of *xing*, allows humans to *recognize* the *need* for order and innovate solutions, driven by self-interest in avoiding chaos. However, if this intelligence includes a capacity to spontaneously recognize value in order or others' welfare, Mencius could argue it concedes his core point about innate moral potential. Xunzi likely sees intelligence as purely instrumental, capable of recognizing cause-and-effect (chaos hurts me) but not spontaneously valuing goodness intrinsically.

  This points to where a substantive disagreement survives the definitional clarification: **the source and nature of moral value.** For Mencius, the sprouts are not just raw material; they contain the *germ* of moral value itself. Compassion *is* nascent goodness; its spontaneous manifestation reveals value inherent in human nature, which cultivation merely actualizes. Ritual is the organic outgrowth of cultivating these sprouts. For Xunzi, spontaneous reactions (even compassion) are morally neutral raw material. Value resides *solely* in the rationally constructed, socially sanctioned standards (*li* 禮, *yi* 義) that shape this material. Compassion might be useful raw clay, but its value is only realized when molded by ritual into appropriate, consistent, and socially functional forms. Spontaneity provides the *material cause* of morality, but never its *formal* or *final cause*; value is always imposed from without via conscious artifice.

  Thus, while their definitions of *xing* make "good" and "bad" partially incommensurable, the core clash concerns whether morality’s foundation lies within spontaneous human tendencies (Mencius) or must be entirely constructed by external rational and cultural intervention (Xunzi). Mencius sees ritual as watering the innate moral seeds; Xunzi sees it as straightening inherently warped timber.

  ---

  **Marking Scheme (Out of 20):**

  *   **Defining Xing Accurately (5 marks):**
      *   A (5): Clearly distinguishes Mencius's *xing* as teleological potential/sprouts **vs.** Xunzi's *xing* as pre-moral raw material. Avoids moralizing Xunzi's "bad" (not sin, just unruly).
      *   B (3-4): Identifies a difference but may be vague (e.g., "Mencius thinks potential is good") or slightly mischaracterize one (e.g., implying Xunzi's "bad" means evil).
      *   C (1-2): Repeats the "good vs. evil" trope without recognizing definitional differences; confuses *xing* with developed character.
  *   **Analyzing Key Arguments (Ox Mtn & Origin of Ritual) (8 marks):**
      *   A (7-8): Explains *how* Ox Mountain absorbs Xunzi's evidence (corruption vs. absence) & identifies Xunzi's potential circularity problem (1st ritual maker). Insightfully explores if Xunzi needs innate tendencies & its implications.
      *   B (5-6): Describes Ox Mountain & the Origin problem, but analysis of *how* they work/their force is superficial. May state circularity but not explore implications.
      *   C (3-4): Mentions one argument vaguely; misses the other or misapplies it.
      *   D (1-2): Fails to engage with either specific argument.
  *   **Identifying Substantive Disagreement (4 marks):**
      *   A (4): Clearly articulates a surviving clash (e.g., source of value: inherent in spontaneity vs. imposed by artifice). Uses concepts like *telos*, material/formal cause, or value foundation. May offer alternative valid point (e.g., role of effort).
      *   B (3): Identifies a general area of disagreement (e.g., "role of education") but lacks depth or connection to definition/core concepts.
      *   C (1-2): Struggles to find any disagreement beyond the verbal or resorts to "good vs. bad."
  *   **Avoiding Common Mistakes & Overall Coherence (3 marks):**
      *   (3): Avoids pitfalls (Xunzi's "evil," Mencius's sprouts=full virtue). Logically structured, clear prose, stays focused on the question.
      *   (2): Minor lapse (e.g., implies sprouts are virtues once). Reasonably clear.
      *   (1): Repeats major pitfalls or is disorganized/unclear.

  **Key Pitfalls Flagged:**  
  1.  Reading Xunzi’s "bad" (惡 *e*) as "inherently sinful/evil" rather than "unruly/conflict-prone if unshaped."  
  2.  Equating Mencius’s "sprouts" (端 *duan*) with fully formed virtues rather than incipient tendencies *requiring* cultivation to mature.

  This setup forces students to grapple with the definitional core first. Only by understanding *what* "human nature" even *means* for each can they then analyze the arguments and locate the deeper philosophical conflict, moving far beyond the tired binary. Good luck with the grading!
