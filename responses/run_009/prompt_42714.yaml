answer: |-
  ### Reconstructing the Rules from the Six Verdicts
  Your friend's verdicts suggest a nuanced approach to corruption that blends several principles. At least three candidate rules can explain her judgments, each emphasizing a different aspect:

  1. **Improper Exchange Rule**: Corruption occurs when there is an explicit or implicit quid pro quo—an official act is traded for a personal benefit or favor, regardless of whether the act itself is meritorious or legal.
     - **Case 1**: Corrupt because the award deviated from merit due to kinship, implying an exchange (favor for family loyalty/obligation).
     - **Case 2**: Corrupt due to a clear after-the-fact exchange (contract award for wedding payment).
     - **Case 3**: Not corrupt—no exchange; hiring is based on adequacy and need, not a trade.
     - **Case 4**: Not corrupt—gifts are customary, not tied to a specific act.
     - **Case 5**: Not corrupt—no exchange; the mayor is fulfilling legal duties.
     - **Case 6**: Not corrupt—no exchange; the act is framed as communal loyalty, not a trade.

  2. **Private Enrichment Rule**: Corruption occurs when an official exploits their position for personal or familial financial gain, even if the act is otherwise proper.
     - **Case 1**: Corrupt—the cousin’s firm benefits financially, implying indirect enrichment (nepotism).
     - **Case 2**: Corrupt—direct personal enrichment (wedding payment).
     - **Case 3**: Not corrupt—no enrichment; the nephew is paid a standard wage for work.
     - **Case 4**: Not corrupt—gifts are minor and customary, not significant enrichment.
     - **Case 5**: Not corrupt—no enrichment; the mayor is doing their job.
     - **Case 6**: Not corrupt—no personal gain; resources serve the community.

  3. **Permitted Favoritism Rule**: Corruption occurs when an official unfairly favors groups that are not "permitted" (e.g., family in merit-based contexts), but favoritism toward "natural" groups (e.g., family in non-competitive roles, one's community, or supporters) is acceptable.
     - **Case 1**: Corrupt—kinship in a competitive bid violates merit.
     - **Case 2**: Corrupt—payment creates improper favoritism toward a firm.
     - **Case 3**: Not corrupt—kinship is permitted in hiring (non-competitive, qualified candidate).
     - **Case 4**: Not corrupt—gifts from constituents are permitted cultural norms.
     - **Case 5**: Not corrupt—no favoritism; help is impartial.
     - **Case 6**: Not corrupt—favoring one's village is "permitted" communal loyalty.

  All three rules fit the six cases equally well, as they overlap in key areas (e.g., Cases 1 and 2 are corrupt under all rules; Cases 3–6 are not). The differences lie in emphasis: Exchange focuses on transactional impropriety, Enrichment on personal gain, and Favoritism on which groups can be favored.

  ### Prediction for the New Case
  **Case**: The mayor spends discretionary public-works funds legally and usefully in pro-voter neighborhoods, with no personal enrichment. Opposing wards receive baseline maintenance. Beneficiary wards later re-elect him.

  - **Improper Exchange Rule Prediction**: Likely corrupt. The spending appears to be an implicit exchange: public resources for political support (re-election). Even though no explicit deal exists, the timing and outcome suggest a quid pro quo.
  - **Private Enrichment Rule Prediction**: Not corrupt. Nothing enriches the mayor or his family; funds serve public goods.
  - **Permitted Favoritism Rule Prediction**: Not corrupt. Favoring political supporters is "permitted" like favoring one's village (Case 6). It reflects "how politics works" in her view—loyalty to "your own."

  **Your Friend's Likely Vote**: **Not corrupt**.  
  **Reasons**:  
  - Her verdicts show tolerance for loyalty-based actions (e.g., Case 6: "you look after your own first"). The new case mirrors this—supporters are "her own" politically, just as the village was communally.  
  - She distinguishes between "corrupt" favoritism (e.g., Case 1’s kinship in bids) and "acceptable" favoritism (e.g., Case 3’s hiring, Case 6’s village aid). Here, the spending is legal, useful, and not self-enriching, aligning with her permissive view of political patronage.  
  - The NGO’s "clientelism" label may strike her as abstract and Western, clashing with her lived experience where such reciprocation is normal (e.g., harvest gifts in Case 4). She focuses on blatant abuses (Cases 1–2), not "looking after your own."

  ### Test Case to Separate the Rules
  To distinguish between the candidate rules, use a variant of **Case 2 (wedding payment) where the officer’s conduct never deviates and nothing is influenced**. This tests the core of the exchange rule without confounding factors like enrichment or favoritism.

  **Proposed Test Case**:  
  > *An officer awards a contract to the best bidder. Unbeknownst to the officer, the winning firm’s owner—grateful for fair treatment—later sends the officer’s daughter a wedding gift (equivalent to a day’s wages). The officer had no prior interaction with the owner about the gift, and it did not influence the award.*

  - **Improper Exchange Rule**: **Corrupt**. The gift is linked to the official act, creating the *appearance* of impropriety or a future obligation, even if unintended. This rule prioritizes the risk of exchanges over intent.
  - **Private Enrichment Rule**: **Not corrupt**. The gift is minor (like Case 4’s baskets) and not solicited, so no exploitation of office occurred.
  - **Permitted Favoritism Rule**: **Not corrupt**. No favoritism was shown; the award was merit-based, and the gift is a benign token.

  **Why this test case?**  
  - It isolates "exchange" from other factors: no favoritism (the bid was fair), no significant enrichment (gift is small), and no deviant conduct (the officer acted properly).  
  - If she deems this **corrupt**, the exchange rule dominates (she fears implicit trades). If **not corrupt**, enrichment or favoritism rules prevail (she requires tangible harm or explicit bias).  
  - Alternatives are weaker:  
    - A variant of Case 1 (cousin wins bid fairly) tests favoritism but not exchange; she might still call it corrupt due to kinship, muddying the waters.  
    - A variant of Case 6 (water for votes) tests exchange but introduces emergency bias, making it less clean.

  Her response here clarifies whether "improper exchange" alone defines corruption for her—resolving ambiguity in the new case (where exchange is implied but deniable). If she balks at penalizing this "innocent" gift, her worldview likely prioritizes outcomes (enrichment/favoritism) over process (exchange risks).
