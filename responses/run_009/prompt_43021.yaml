prompt: |-
  I teach a bioethics elective for third-year med students, ~16 of them, one 90-minute session. Design a role-play where they sit as the death-determination committee of a fictional hospital and have to rule "dead" or "not dead" on a sequence of case cards, one at a time, with no idea what's coming later. The cards should work as a ratchet: every ruling gets logged as binding precedent for the committee, and later cards are built so that sticking to your earlier precedent now forces a ruling that makes you queasy — so by the end they've squeezed themselves. Draw the cases from the real fault lines: whole-brain vs. higher-brain criteria, the irreversible-vs-permanent move that lets donation after circulatory death go forward after only a few minutes of asystole, a brain-dead pregnant patient held on a ventilator, the autoresusciation (Lazarus phenomenon) worry, maybe an anencephalic newborn — but you pick which ones and in what order so the squeeze lands hardest. Give me the case cards themselves, a scoring/precedent mechanic that doesn't involve real money, and a debrief where I map each card onto a piece of the underlying idea — but that idea, that a unitary definition of death is something we settle by choice for practical purposes rather than discover in the biology, should come from what happened in the room, not from me lecturing up front. Two more things: what will predictably go wrong the first time I run this, and be honest about which part of the problem a card game just cannot make them feel. When you lay out the case order and what each card is meant to do, tell me how confident you are in each choice and flag the single one you're least sure of — I'd rather know where you're guessing.
reasoning: |-
  We are designing a role-play game for a bioethics class. The students form a death-determination committee and must rule "dead" or "not dead" on a sequence of case cards. The rulings set precedents that bind future decisions, creating a ratchet effect that leads to uncomfortable conclusions. The goal is to illustrate that the definition of death is a practical choice rather than a biological fact.

  Key elements:
  1. **Case Cards**: Each card presents a case. We will draw from real fault lines in death determination.
  2. **Precedent Mechanic**: Each ruling becomes a binding precedent. Future cases must be decided consistently with prior rulings unless the committee explicitly overturns a precedent (which we want to avoid to create the squeeze).
  3. **Debrief**: Map each case to the underlying idea without lecturing. The students should arrive at the insight through the activity.

  **Structure of the Session**:
  - Introduction: Explain the role-play and the rules without giving away the philosophical point.
  - Case Rounds: Present one case card at a time. The committee discusses and votes. The ruling is logged as precedent.
  - Logging Precedents: Use a whiteboard or a shared document to record:
     - Case number and brief description
     - Ruling (dead or not dead)
     - The key criterion that the ruling established (this is critical for precedent)
  - After all cases, debrief.

  **Cases to Include** (in the order that creates the ratchet effect):

  1. **Standard Brain Death**: A patient with irreversible loss of all brain functions (including brainstem), on a ventilator. Heart still beating. *Purpose*: Start with a clear case of brain death. They will likely rule "dead". *Precedent*: Death can be declared based on irreversible loss of whole-brain function even if the heart is beating.

  2. **Donation after Circulatory Death (DCD) - Standard**: Patient has a devastating brain injury, not brain dead. Family withdraws life support. After 5 minutes of asystole (no circulation), the team wants to declare death for organ donation. *Purpose*: Introduce the concept of circulatory death. They will likely rule "dead". *Precedent*: Death can be declared based on irreversible loss of circulatory function after a short interval (5 minutes) of asystole.

  3. **DCD with Auto-resuscitation Concern**: Similar to case 2, but now the patient is young and healthy (e.g., trauma) and the team is concerned about the rare possibility of autoresuscitation (Lazarus phenomenon). They propose waiting 10 minutes. *Purpose*: Highlight that the irreversibility is often based on a waiting period that is arbitrary but practical. They might extend the waiting time but still rule dead after 10 minutes. *Precedent*: Affirms that death can be declared after circulatory cessation, but now with a 10-minute wait (or whatever they choose). The key precedent is that a waiting period is acceptable and that irreversibility is determined by a fixed time.

  4. **Higher-Brain Death**: A patient in a persistent vegetative state (PVS) with no higher brain function but intact brainstem (so breathing without a ventilator). *Purpose*: Challenge the whole-brain criterion. If they rule "not dead" (which they should by whole-brain criteria), then later cases will squeeze them. *Precedent*: A patient is not dead if they have brainstem function and spontaneous breathing, even with no higher brain function.

  5. **Anencephalic Newborn**: A newborn born without a cerebrum but with a brainstem. The baby breathes spontaneously and has a heartbeat. *Purpose*: Similar to case 4 but more extreme (never had higher brain function). They must rule consistently with case 4: not dead. *Precedent*: Reaffirms that the presence of brainstem function means not dead.

  6. **Brain-Dead Pregnant Patient**: A woman declared brain dead (by whole-brain criteria) at 14 weeks pregnant. She is on a ventilator and life support to potentially continue the pregnancy. *Purpose*: Conflict between the declaration of death and the fact that the body is supporting a fetus. They must rule dead (by precedent of case 1). *Precedent*: Brain death is death, even if the body is being maintained for another purpose.

  7. **DCD in a Controlled Setting with Immediate Organ Recovery**: A patient in a DCD protocol. After 5 minutes of asystole, the team wants to declare death and immediately begin organ recovery. However, in this case, the patient is a candidate for ECMO and if circulation were restored by ECMO within 20 minutes, the patient might recover. But the DCD protocol does not allow that because the patient is a donor. *Purpose*: Challenge the irreversibility. If they rule dead after 5 minutes (as in case 2), then they are accepting that death is declared even though the circulation could be restored (but won't be because of the donation protocol). This exposes the "permanent" vs. "irreversible" distinction. *Precedent*: Death is declared when circulation ceases and the cessation is permanent (i.e., no attempt will be made to restart) rather than truly irreversible.

  8. **Cryonics Case**: A patient with a terminal illness chooses cryonic preservation. At the moment of declared circulatory death (after 5 minutes of asystole in a DCD-like protocol), the cryonics team immediately begins cooling and cardiopulmonary support to prevent brain degradation. *Purpose*: Extreme challenge. If they ruled dead in case 7, then this patient is dead. But now the cryonics team is preserving the brain with the hope of future revival. If they stick to precedent, they must rule dead, but that might feel queasy because the patient's brain is being preserved. *Precedent*: Death is declared based on the permanent cessation of circulation, even if the body is then preserved in a way that might allow future revival.

  **Order of Cases**:
  1. Standard Brain Death
  2. DCD Standard (5 minutes)
  3. DCD with Auto-resuscitation (10 minutes)
  4. Higher-Brain Death (PVS)
  5. Anencephalic Newborn
  6. Brain-Dead Pregnant Patient
  7. DCD with Immediate Organ Recovery and ECMO possibility
  8. Cryonics

  **Why this order?**
  - Start with clear cases (1 and 2) to establish precedents.
  - Case 3 tweaks case 2 but doesn't break it.
  - Cases 4 and 5 establish that the absence of higher brain function is not enough for death (if brainstem is working).
  - Case 6 is a hard case but they are bound by case 1 to rule dead.
  - Case 7 forces the issue of irreversibility vs. permanence.
  - Case 8 takes case 7 to an extreme.

  **Scoring/Precedent Mechanic**:
  - We don't want real money. Instead, we can use a "consistency score" or just emphasize the binding nature of precedent for the sake of the exercise.
  - Precedent is recorded as:
     - Case #: [Brief Description] → Ruling: Dead/Not Dead → Key Criterion: [e.g., "Irreversible whole-brain death", "Circulatory death after 5 minutes of asystole", etc.]
  - For each new case, the committee must consider prior precedents and rule consistently unless they overturn a precedent. But overturning should be discouraged (maybe only allowed by a supermajority? Or not at all? Let's say no overturning to create the squeeze). The facilitator can stress that the committee is bound by its own prior rulings.

  **Debrief**:
  After the last case, ask:
  - How did the committee feel about the last ruling?
  - What patterns did they see in the cases?
  - What did they notice about the criteria for death?
  Then, map each case to the underlying concepts:
  - Case 1: Whole-brain criterion.
  - Case 2: Circulatory criterion with a short wait time (irreversible vs. permanent).
  - Case 3: The waiting time is a practical choice to reduce the chance of autoresuscitation.
  - Cases 4 and 5: The distinction between whole-brain and higher-brain criteria. They were forced to rule "not dead" because of the whole-brain criterion established in case 1? Actually, case 1 was about brain death, but cases 4 and 5 show that if the brainstem is working, they are not dead. So the precedent from case 1 doesn't directly apply to cases 4 and 5. But they are consistent with the whole-brain criterion.
  - Case 6: The conflict between the declaration of death and the use of the body for another purpose (pregnancy). The precedent from case 1 forces death declaration.
  - Case 7: The distinction between irreversible and permanent. In DCD, the cessation is permanent (because we won't restart) but not necessarily irreversible (if we tried, we might succeed). This case highlights that we define death for practical purposes (organ donation) rather than based on absolute irreversibility.
  - Case 8: The cryonics case shows that if we accept case 7, then we must accept that a person can be dead even if their body is preserved for potential future revival. This challenges the idea that death is an absolute biological event.

  The key idea: We have chosen a definition of death that serves practical purposes (like organ donation) and that we can consistently apply, even if it leads to conclusions that feel uncomfortable.

  **What will go wrong the first time?**
  1. **Overturning Precedent**: Students might try to overturn a precedent to avoid a hard ruling. To prevent this, the facilitator must be strict: precedents are binding. No overturning unless absolutely necessary (and we don't want that). But if they do, it breaks the ratchet. So be firm.

  2. **Not Logging Precise Precedent**: The key criterion must be recorded precisely. If they record a vague precedent, it won't bind later cases. The facilitator should help them articulate the key criterion.

  3. **Time Management**: Each case might take 10-15 minutes. With 8 cases, that's 80-120 minutes, but we only have 90 minutes. We might need to reduce the number of cases or make some cases quicker.

  4. **Lack of Engagement**: Some students might be quiet. The facilitator should encourage participation.

  5. **Missing the Point**: They might not see the pattern. The debrief is critical to draw out the lesson.

  **What the Card Game Cannot Make Them Feel**:
  - The emotional weight of real-life decisions. A card game is abstract and lacks the human element. They won't feel the grief of families or the pressure of organ procurement.
  - The complexity of real medical scenarios (e.g., uncertainty in brain death testing, family dynamics).

  **Adjustments for Time**:
  We have 90 minutes. Let's plan for 6 cases to fit better. We'll remove case 3 and case 5? Or merge? Alternatively, we can make the cases shorter.

  Revised 6-case sequence:

  1. **Standard Brain Death** (Ruling: Dead) → Precedent: Death by whole-brain criterion (irreversible loss of all brain functions) even with a beating heart.

  2. **Standard DCD** (5 minutes asystole) → Ruling: Dead → Precedent: Death by circulatory criterion after 5 minutes of asystole (irreversible loss of circulatory function).

  3. **Higher-Brain Death (PVS)** → Ruling: Not dead (because brainstem is intact) → Precedent: Presence of brainstem function (and spontaneous breathing) means not dead, even without higher brain function.

  4. **Brain-Dead Pregnant Patient** → Ruling: Dead (bound by case 1) → Precedent: Brain death is death, regardless of the body being used for fetal support.

  5. **DCD with ECMO Possibility**: Patient in DCD protocol, after 5 minutes of asystole, declared dead. But if ECMO were started within 20 minutes, recovery might be possible. However, the protocol doesn't allow it because of organ donation. → Ruling: Dead (bound by case 2) → Precedent: Death is declared when circulation ceases and the cessation is permanent (no attempt to restart) even if it could be reversed.

  6. **Cryonics Case**: As above. → Ruling: Dead (bound by case 5) → Precedent: Death is declared based on permanent cessation of circulation, even if the body is preserved for potential future revival.

  This sequence has 6 cases. We can do each case in 10-12 minutes, then 10 minutes for intro and 15 for debrief.

  **Confidence in Choices**:
  - Cases 1 and 2: High confidence. They are standard.
  - Case 3 (PVS): High confidence. It clearly distinguishes whole-brain from higher-brain.
  - Case 4 (pregnant patient): High confidence. It's a classic hard case.
  - Case 5 (DCD with ECMO possibility): Medium confidence. It's critical for the irreversibility vs. permanence point, but students might not fully grasp the distinction without explanation. We hope the case description makes it clear.
  - Case 6 (Cryonics): Medium confidence. It's extreme and might feel sci-fi, but it's a real scenario. This is the one I'm least sure about because it might be seen as too speculative. However, it effectively highlights the issue.

  **Least Sure Case**: Case 6 (Cryonics). If time is tight, we could replace it with the anencephalic newborn case, but then we lose the ratchet on the permanence issue. Alternatively, we could drop the cryonics case and end with case 5, but that might be less dramatic.

  **Case Cards**:

  Each card should have:
  - A title
  - A brief case description (medical and ethical issues)
  - No hints about what's coming.

  **Card 1: Brain Death After Trauma**
  > Mr. Johnson, 45, suffered a severe head injury in a car accident. He has been declared brain dead by two separate examinations 6 hours apart, showing no brainstem reflexes, no spontaneous breathing (apnea test passed), and a flat EEG. His heart is still beating with the help of a ventilator. The family is asking if he is dead so they can proceed with organ donation.

  **Card 2: Donation After Circulatory Death (DCD) - Standard**
  > Mrs. Chen, 68, has a massive stroke and is not expected to recover. The family has decided to withdraw life support. Per hospital protocol, after withdrawal, she has no pulse or blood pressure for 5 minutes. The organ procurement team is ready to recover organs. Is she dead?

  **Card 3: Persistent Vegetative State (PVS)**
  > Mr. Davis, 30, has been in a persistent vegetative state for 6 months after a drug overdose caused an anoxic brain injury. He has no awareness of self or environment, but his brainstem is intact: he breathes on his own and has sleep-wake cycles. His family asks if he is dead so they can donate his organs.

  **Card 4: Brain-Dead Pregnant Patient**
  > Ms. Rodriguez, 25, was declared brain dead at 14 weeks pregnancy following a brain aneurysm. She is on a ventilator and her body is being maintained in the ICU to give the fetus a chance to develop. Her parents want to know if she is dead so they can make decisions about continuing the pregnancy.

  **Card 5: DCD with ECMO Possibility**
  > Mr. Thompson, 50, has end-stage lung disease. He is a DCD donor. After withdrawal of life support, he has 5 minutes of asystole. The protocol says to declare death and begin organ recovery. However, if ECMO were started within 20 minutes, he might be revived, but the DCD protocol does not allow this because he is an organ donor. Is he dead?

  **Card 6: Cryonics**
  > Ms. Parker, 40, has terminal cancer. She has arranged for cryonic preservation. Upon her expected death, the cryonics team is standing by. After withdrawal of life support, she has 5 minutes of asystole. She is declared dead by the hospital. The cryonics team immediately starts cooling and uses ECMO to preserve her brain for possible future revival. Is she dead?

  **Debrief Guide**:
  1. Ask: How did you feel about the last case? What about the one before?
  2. Go through each case and ask what precedent it set.
  3. Then, ask: What happened to our definition of death as we went along? Did it change?
  4. Point out the key tensions:
     - Whole-brain vs. higher-brain (Cases 1, 3, 4)
     - Irreversible vs. permanent (Cases 2, 5, 6)
  5. Finally, ask: What does this tell us about how we define death in real life? Is it a biological fact or a practical choice?

  This should lead them to the insight that death is defined by societal agreement for practical purposes (like organ donation, resource allocation, etc.) and that biology alone does not give us a clear line.

  **Time Management**: 
  - Intro: 5 minutes
  - 6 cases: 10 minutes each = 60 minutes
  - Debrief: 15 minutes
  - Buffer: 10 minutes (total 90)

  If discussions run long, the facilitator can cut off after 8-9 minutes per case.

  **Final Note**: Be prepared to adapt. If they are stuck, you might need to nudge them on precedent. Good luck!
answer: |-
  Below is a comprehensive design for your bioethics role-play session, optimized for a 90-minute class with 16 students. The goal is to create a "ratchet effect" where precedents set in early cases force uncomfortable rulings in later cases, revealing that death determination is a practical, socially negotiated choice rather than a purely biological fact. I've refined the case order for maximum tension, included a simple precedent mechanic, and outlined a debrief that helps students uncover the core idea themselves. I'll also address potential pitfalls and the limitations of the exercise.

  ---

  ### **Session Structure & Timing** (Total: 90 min)
  - **Intro & Rules** (5 min): Briefly explain the committee role-play. Emphasize that rulings set **binding precedents** for future cases (no overturning allowed), and the goal is consistency, not "right answers."
  - **Role-Play** (60 min): 6 case cards, presented one at a time (aim for 8–10 min per case).
  - **Debrief** (25 min): Guided discussion mapping cases to underlying concepts.

  ---

  ### **Precedent Mechanic: The Precedent Ledger**
  - **Tool**: Whiteboard or large poster paper titled "Precedent Ledger."
  - **How it works**: After each ruling, log:
    1. **Case Number & Key Fact** (e.g., "Case 1: Brain dead, heart beating").
    2. **Ruling** (Dead / Not Dead).
    3. **Criterion Established** (e.g., "Death = Irreversible whole-brain failure").
  - **Rules**:
    - Precedents are **binding**. Later cases must be ruled consistently unless a precedent directly conflicts (which they won’t—the sequence avoids this).
    - **No overturning precedents**. If students try, remind them: "As a committee, you must uphold institutional consistency for legal/ethical reasons."
    - **Voting**: Anonymous show of hands (keep it quick). Majority wins. Record dissent if it sparks debate.
  - **Why no scoring?** The "squeeze" is the emotional discomfort of later rulings, not points. The ledger visualizes the ratchet effect.

  ---

  ### **Case Cards**  
  **Design Logic**:  
  - **Order**: Starts with clear-cut cases to establish precedents, then introduces fault lines. The squeeze peaks at Cases 5–6.  
  - **Ratchet Effect**: Early rulings on *irreversibility* (Cases 1–2) later clash with *permanence* (Cases 5–6); *whole-brain* criteria (Case 1) conflict with *higher-brain* edge cases (Case 4).  
  - **Confidence Notes**:  
    - ⭐⭐⭐⭐⭐ = High confidence (well-established dilemmas).  
    - ⭐⭐⭐⭐☆ = Medium confidence (effective but may need facilitator nudging).  
    - **Least Confident Case**: Case 6 (Cryonics) – it’s provocative but abstract. Backup included in pitfalls.  

  **Case Sequence**:

  1. **Case 1: Brain Death with Beating Heart**  
     ⭐⭐⭐⭐⭐  
     *Aim*: Establish whole-brain death as sufficient.  
     *Text*:  
     > *"Patient A, 35, suffered massive brain injury from a car crash. Two exams confirm irreversible loss of all brain functions (including brainstem), per standard protocols. EEG is flat, no respiratory drive, but the heart is beating via ventilator. Family consents to organ donation. Is the patient dead?"*  
     - **Expected Ruling**: Dead.  
     - **Precedent to Log**: Death = **Irreversible whole-brain failure**, regardless of cardiac activity.  

  2. **Case 2: Donation After Circulatory Death (DCD) – Standard**  
     ⭐⭐⭐⭐⭐  
     *Aim*: Lock in circulatory death after brief asystole, conflating permanence with irreversibility.  
     *Text*:  
     > *"Patient B, 60, has end-stage lung disease. Life support is withdrawn per family wishes. After 5 minutes of continuous asystole (no pulse, no BP), the organ-procurement team requests a death declaration to begin recovery. No signs of auto-resuscitation. Is the patient dead?"*  
     - **Expected Ruling**: Dead.  
     - **Precedent to Log**: Death = **Circulatory failure after 5 minutes of asystole**, treated as irreversible.  

  3. **Case 3: Anencephalic Newborn**  
     ⭐⭐⭐⭐☆  
     *Aim*: Challenge whole-brain criteria by introducing a patient with partial brain function (brainstem intact). Forces "not dead" ruling, creating tension for later.  
     *Text*:  
     > *"Newborn C has anencephaly: no cerebrum or cortex, but a working brainstem. Baby breathes spontaneously, has a heartbeat, and reflexes (e.g., startle). Prognosis: fatal within days/weeks. Parents ask: ‘Is our baby dead? Can we donate organs?’"*  
     - **Expected Ruling**: Not dead (due to brainstem function, per Case 1 precedent).  
     - **Precedent to Log**: **Brainstem function = Not dead**, even without higher-brain structures.  

  4. **Case 4: Persistent Vegetative State (Higher-Brain)**  
     ⭐⭐⭐⭐⭐  
     *Aim*: Deepen higher-brain vs. whole-brain tension. Students must rule "not dead" despite no consciousness, conflicting with instinct.  
     *Text*:  
     > *"Patient D, 20, is in a persistent vegetative state after an overdose. EEG shows no cortical activity, but brainstem functions are intact (breathing unaided, gag reflex). No improvement in 12 months. Family seeks death declaration to end suffering. Is the patient dead?"*  
     - **Expected Ruling**: Not dead (bound by Cases 1 and 3 – brainstem functional).  
     - **Precedent to Log**: **Consciousness not required for life**; brainstem function suffices.  

  5. **Case 5: DCD with ECMO Reversibility**  
     ⭐⭐⭐⭐☆  
     *Aim*: Expose the irreversible/permanent divide. Circulatory failure is *permanent* (due to DCD protocol) but not *irreversible* (if ECMO were used).  
     *Text*:  
     > *"Patient E, 40, is a DCD donor after a stroke. After 5 minutes of asystole post-withdrawal, death is declared. However, if ECMO were started within 10 minutes, circulation could be restored (but protocol forbids this to preserve organs). Family later learns this and questions: Was the patient truly dead?"*  
     - **Squeeze**: Must rule dead (bound by Case 2), but it highlights that death was declared based on *permanence* (a choice not to resuscitate), not biology.  
     - **Precedent to Log**: **Circulatory death = permanent cessation**, even if resuscitation is possible but not attempted.  

  6. **Case 6: Cryonics Case**  
     ⭐⭐⭐☆☆ (Least confident – abstract but maximizes discomfort)  
     *Aim*: Extreme test of permanence. Forces "dead" ruling while acknowledging future revival possibility, severing death from biology.  
     *Text*:  
     > *"Patient F, 55, with terminal cancer, chooses cryopreservation. After life-support withdrawal, 5 minutes of asystole pass, and death is declared per hospital policy. Cryonics team immediately begins cooling and ECMO to prevent brain degradation, hoping for future revival. Is the patient dead?"*  
     - **Squeeze**: Must rule dead (bound by Cases 2 and 5), but it feels absurd – the patient is "dead" while being preserved for potential future life.  
     - **Precedent to Log**: **Death is declared based on protocol**, not biological irreversibility.  

  ---

  ### **Debrief Script**  
  *Goal: Guide students to articulate that death is a practical construct, not a biological "fact."*  

  1. **Reflect on Discomfort** (5 min):  
     - *Ask*: "Which rulings felt uneasy? Why? Did sticking to precedents make it harder?"  
     - *Listen*: Note emotions (e.g., Case 6’s absurdity, Case 5’s reversibility).  

  2. **Map Cases to Concepts** (15 min):  
     Use the Precedent Ledger to connect rulings to fault lines. Ask:  
     - *Case 1*: "Why was cardiac activity irrelevant here? What did we prioritize?"  
       → **Concept**: *Whole-brain criterion* – death as loss of integrated biological function.  
     - *Cases 2 & 5*: "In Case 2, 5 minutes of asystole was ‘irreversible.’ In Case 5, we knew it wasn’t biologically irreversible. What changed?"  
       → **Concept**: *Irreversible vs. permanent* – permanence is a practical choice (e.g., for organ donation).  
     - *Cases 3 & 4*: "We ruled these ‘not dead’ despite no consciousness. Why? How does this clash with how we view personhood?"  
       → **Concept**: *Higher-brain vs. whole-brain* – we prioritize biological function over cognition when bound by precedent.  
     - *Case 6*: "If we revived this patient in 100 years, would our ruling be wrong? What does that say about death?"  
       → **Concept**: *Death as a social agreement* – we define it to serve goals (donation, resource allocation).  

  3. **Synthesize the Big Idea** (5 min):  
     - *Ask*: "Did biology give us clear answers? Or did we *choose* definitions to solve problems (e.g., organ supply, ventilator use)?"  
     - *Reveal*: "This is the fault line in bioethics: Death isn’t ‘discovered’ in biology—it’s settled by society for practical reasons. Your precedents mirrored real-world tensions."  

  ---

  ### **What Will Go Wrong (and Fixes)**  
  1. **Students Try to Overturn Precedents**:  
     - *Why*: To avoid discomfort in later cases (e.g., Case 6).  
     - *Fix*: Be a "strict chair." Say: "As hospital policy, precedents ensure consistency for legal/ethical compliance. You must adhere."  

  2. **Time Overruns on Early Cases**:  
     - *Why*: Students dig into details (e.g., testing standards in Case 1).  
     - *Fix*: Use a timer. After 8 min, say: "You must rule now—the OR is waiting."  

  3. **Case 6 (Cryonics) Feels Unrealistic**:  
     - *Why*: It’s futuristic; students may disengage.  
     - *Backup Case*: Replace with a **Brain-Dead Pregnant Patient** (*Confidence: ⭐⭐⭐⭐⭐*):  
       > *"Patient G, 30, is brain dead at 22 weeks pregnant. Ventilator maintains fetal development. Family wants death declared to withdraw support; obstetricians insist on continuation. Is she dead?"*  
       - *Squeeze*: Must rule dead (bound by Case 1), but it conflicts with fetal "life support."  
       - *Debrief Tie*: Highlights death as a boundary for resource use.  

  4. **Dominant Personalities Monopolize Debate**:  
     - *Fix*: Assign roles (e.g., "You’re a neurologist," "You’re an organ-procurement rep") to distribute input. Use anonymous votes.  

  5. **Students Miss the "Permanent vs. Irreversible" Nuance**:  
     - *Fix*: In Case 5, ask: "Could this patient be revived? Why aren’t we doing it?" to highlight the protocol-driven choice.  

  ---

  ### **What the Card Game Can’t Make Them Feel**  
  - **The Weight of Real Consequences**: Role-play lacks the emotional gravity of actual death determination—grieving families, time pressure in DCD, or moral distress in brain-death exams.  
  - **Clinical Uncertainty**: Cards simplify complex diagnostics (e.g., variability in apnea tests, borderline EEGs). Students won’t feel the ambiguity of "real" cases.  
  - **Institutional Power Dynamics**: The game can’t replicate hospital politics (e.g., organ-procurement pressure on DCD rulings).  

  ---

  ### **Materials to Prepare**  
  - **Case Cards**: Print each case on an index card. Reveal one at a time.  
  - **Precedent Ledger**: Whiteboard or large paper.  
  - **Timer**: Keep discussions to 8–10 min/case.  

  This design ensures students experience the ratchet effect vividly, culminating in a debrief that lets them "discover" the constructed nature of death. If you run this, I’d love feedback on how Case 6 lands! Good luck—it’s a bold exercise, and your students will remember it.
