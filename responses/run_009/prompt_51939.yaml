prompt: |-
  You are a professional philosopher working on the metaphysics of causation, and I'd like your help reverse-engineering my own judgments. Here are my verdicts on cases of causing by omission.

  While I was away, the gardener I hired didn't water my plants and they died: he caused their death. My next-door neighbor, who never promised anything, also didn't water them, though she was home the whole time and it would have taken her ten minutes: she didn't cause it, she merely let it happen. The Queen of England didn't water them either, and that's not even a candidate for causation — though I notice I can't yet say what separates her from the neighbor. A lifeguard on duty who scrolls his phone while a child drowns in front of him: he caused the death, or something very close to it. A bystander with no duty, a strong swimmer, who watches the same child drown: he didn't cause it. A member of a firing squad who refuses to shoot while his nine colleagues all fire, killing the prisoner: he didn't cause the death, even though he had a duty not to participate and his omission was expected by the others. A hospital pharmacist whose job is to keep the antidote stocked fails to order it, and a snakebite victim who would otherwise have survived dies: the pharmacist caused the death. The same pharmacist, at home asleep when the victim arrives: didn't cause it. Finally, the case I keep going back and forth on: a city council votes down funding for a levee upgrade, the flood comes, and a neighborhood that the upgrade would have protected is destroyed.

  Before answering, brainstorm the candidate principles these verdicts might be tracking — moral or contractual duty, counterfactual dependence, abnormality of the omission against a background norm, removal of a sustaining condition versus failure to introduce a rescuing condition, proximity in space-time or in the causal chain — and note which verdicts each candidate handles and which it mangles. Then give me your best single principle, stated precisely, with each clause tied to the case that motivates it. Apply it to the levee case and to one or two cases I haven't listed, and be explicit about which of my verdicts your principle cannot save, and whether I should give up the verdict or accept a patched, more complicated principle instead. Please think carefully and step by step rather than settling on the first analysis that comes to mind.
reasoning: |-
  Hmm, the user is asking me to reverse-engineer their judgments about causation by omission. They've provided several cases where they have clear intuitions about whether an omission caused a particular outcome. As a professional philosopher specializing in metaphysics of causation, I need to help them identify the underlying principles behind these judgments.

  Looking at their cases: They distinguish between the gardener who caused the plants' death by not watering them, versus the neighbor who merely let it happen. The Queen not watering isn't even a candidate for causation. The on-duty lifeguard caused the drowning, while a bystander didn't. The firing squad member who refused to shoot didn't cause the death despite having a duty. The pharmacist caused the death when failing to stock antidote at work, but not when at home. And they're unsure about the city council and levee case.

  I should brainstorm candidate principles first. The main contenders seem to be: moral/contractual duty (which explains the gardener, lifeguard, and pharmacist cases), counterfactual dependence (which holds in all cases where omission led to outcome), abnormality (which might explain neighbor vs Queen but fails elsewhere), and causal role distinctions like removal vs failure to introduce.

  For duty-based approaches: This handles the gardener (contractual duty), lifeguard (professional duty), and pharmacist (occupational duty). It explains why the neighbor and Queen aren't causes (no duty). But it stumbles on the firing squad case - the soldier had a duty not to shoot but didn't cause the death. Also, the bystander has no duty, which aligns with "no causation."

  Counterfactual dependence works for almost all cases (if they had acted, outcome would differ) but overgenerates - it would say the neighbor and Queen caused the death too, which conflicts with user's judgments. So it can't be sufficient.

  Abnormality has issues - the neighbor not watering might be abnormal, but user says no causation. The firing squad member omitting is abnormal but user says no causation. The sleeping pharmacist isn't abnormal omission but user agrees no causation here.

  Causal role distinctions (removing sustaining vs failing to provide new condition) doesn't clearly map to their judgments - the lifeguard fails to provide rescue but user says caused death.

  The best single principle seems to be a normatively constrained one: A person's omission is a cause of an outcome if and only if (a) the outcome counterfactually depends on their omission (if they had acted, outcome wouldn't occur), and (b) they had an enforceable obligation to perform the omitted action.

  This handles most cases: Gardener had contractual obligation, lifeguard professional duty, pharmacist job duty. Neighbor, Queen, bystander, and off-duty pharmacist had no such obligation. Firing squad member had obligation not to shoot, so condition (b) fails - explains why not a cause.

  For the levee case: If council had enforceable obligation to fund levees (perhaps statutory duty), then they caused the destruction. If not, they didn't. This matches user's ambivalence - it depends on normative facts about their duties.

  The principle can't save the firing squad verdict if we misclassify the duty, but in this case the duty is negative (not to shoot), so omission isn't breach of positive duty. For the sleeping pharmacist case, no causation because no obligation to be awake/working.

  I think this gives the user a precise tool to analyze their intuitions, with the levee case verdict depending entirely on the specific nature of the council's obligations.
answer: |-
  Based on your verdicts, I'll systematically reverse-engineer the principles at work. Your intuitions reveal a nuanced, normatively loaded view of causation by omission that prioritizes **enforceable obligations** within specific roles or relationships, filtered through counterfactual dependence. Below is my analysis, candidate principles, best-fit principle, and its application.

  ### Step 1: Brainstorming Candidate Principles
  Here are key candidates, with their performance on your cases (✓ = aligns, ✗ = conflicts, ? = ambiguous):

  1. **Moral/Contractual Duty**:  
     - *Principle*: Omission causes outcome iff agent had a duty (moral/contractual) to act.  
     - *Verdicts*:  
       - Gardener ✓ (contractual duty), Lifeguard ✓ (professional duty), Pharmacist (on-duty) ✓.  
       - Neighbor ✗ (no duty), Queen ✗ (no duty), Bystander ✗ (no duty), Pharmacist (asleep) ✗.  
       - *Firing squad ✗*: Soldier had duty *not* to shoot (negative duty), but omission didn’t cause death.  
       - *Problem*: Fails on firing squad; conflates positive/negative duties.

  2. **Counterfactual Dependence**:  
     - *Principle*: Omission causes outcome iff outcome would not have occurred if agent had acted.  
     - *Verdicts*:  
       - Gardener ✓, Lifeguard ✓, Pharmacist (on-duty) ✓, Neighbor ✓ (if she watered, plants live), Bystander ✓, Queen ✓.  
       - *Conflicts*: You deny causation for neighbor, Queen, bystander. Overgenerates wildly.

  3. **Abnormality (Against Norms)**:  
     - *Principle*: Omission causes outcome iff it was abnormal (against expectations/norms).  
     - *Verdicts*:  
       - Gardener ✓ (abnormal neglect), Lifeguard ✓ (abnormal inattention), Pharmacist (on-duty) ✓.  
       - Neighbor ? (abnormal not to help? but you say no causation), Queen ✗ (normal omission).  
       - Firing squad ✗ (refusing to shoot abnormal, but no causation), Sleeping pharmacist ✗ (sleeping normal).  
       - *Problem*: Inconsistent on neighbor; firing squad omission is abnormal but not causal.

  4. **Causal Role (Removal vs. Non-Provision)**:  
     - *Principle*: "Causing" only if omission *removes* an existing sustaining condition; "allowing" if it fails to *provide* a new condition.  
     - *Verdicts*:  
       - Gardener ✗ (fails to provide water, but you call it causing), Lifeguard ✗ (fails to provide rescue).  
       - Neighbor ✓ (fails to provide, so allowing), Queen ✓.  
       - Pharmacist (on-duty) ✗ (fails to provide antidote).  
       - *Problem*: Misaligns with core cases (gardener/lifeguard/pharmacist are "failures to provide" but you call them causes).

  5. **Proximity (Spatial/Temporal/Causal)**:  
     - *Principle*: Omission causes outcome iff agent was physically/temporally proximate or in a direct causal chain.  
     - *Verdicts*:  
       - Lifeguard ✓ (proximate), Bystander ✗ (proximate but no causation), Neighbor ✓ (proximate? but you say no).  
       - Queen ✗ (distant), Pharmacist (asleep) ✗ (distant).  
       - *Problem*: Fails bystander/neighbor proximity without causation; sleeping pharmacist is "distant" but aligns by luck.

  ### Step 2: Your Best-Fit Principle
  Your verdicts are most consistently explained by a **Normative Enforceability Principle**, refined to handle edge cases:

  > **Enforceable Obligation Principle**:  
  > An agent’s omission causes outcome *O* if and only if:  
  > **(i)** *O* counterfactually depends on the omission (if the agent had acted, *O* would not have occurred, barring overdetermination), *and*  
  > **(ii)** The agent had an **enforceable positive obligation** to perform the action, defined as a duty:  
  > - (a) grounded in a specific role, contract, or relationship (not general morality),  
  > - (b) where failure triggers accountability (e.g., blame, liability, sanctions),  
  > - (c) *and* the agent was in a position to fulfill it (ability + situational access).  
  >   
  > Otherwise, the omission merely *allows* or is *irrelevant* to *O*.

  **Tied to Cases**:  
  - Clause (i): Explains *all* cases where omission is necessary for *O* (e.g., plants die without watering, child drowns without rescue).  
  - Clause (ii)(a): Separates **gardener** (contractual role), **lifeguard** (professional role), and **pharmacist (on-duty)** (occupational role) from **neighbor**, **Queen**, and **bystander** (no role-based duty).  
  - Clause (ii)(b): Explains **firing squad**—soldier had a duty *not* to shoot (negative obligation), not a positive obligation to shoot. His omission violates no *enforceable positive duty*.  
  - Clause (ii)(c): Explains **pharmacist (asleep)**—not "in position" to act (off-duty, unconscious), even if obligation exists while on-shift.  
  - **Lifeguard vs. bystander**: Lifeguard’s obligation is enforceable (job contract, legal liability); bystander’s moral duty isn’t.  
  - **Neighbor vs. Queen**: Neighbor’s proximity might suggest moral duty, but no *enforceable* role-based obligation; Queen has neither.

  ### Step 3: Application to Cases
  - **Levee Case (City Council)**:  
    - (i) Counterfactual dependence ✓: If council funded levee, neighborhood would have been protected.  
    - (ii) Enforceable obligation? Depends on statutory duties:  
      - If council has a *legal obligation* (e.g., mandated by law) to maintain infrastructure, omission causes destruction.  
      - If funding is discretionary (no enforceable duty), it merely allows destruction.  
      *Your ambivalence reflects this: Verdict hinges on whether their role includes enforceable flood protection.*  

  - **New Case 1: Babysitter vs. Stranger**  
    - *Scenario*: A babysitter omits feeding a child, who starves. A stranger passing by omits feeding the same child.  
    - *Principle*:  
      - Babysitter ✓ causes death (contractual role, enforceable obligation).  
      - Stranger ✗ no causation (no enforceable duty, though counterfactual dependence holds).  
    - *Aligns with* your neighbor/gardener distinction.  

  - **New Case 2: Off-Duty Doctor**  
    - *Scenario*: An off-duty doctor omits aiding a crash victim at the roadside. An on-duty ER doctor omits aiding the same victim.  
    - *Principle*:  
      - On-duty doctor ✓ causes harm (enforceable occupational duty).  
      - Off-duty doctor ✗ no causation (no situational obligation; general morality isn’t enforceable).  
    - *Aligns with* your pharmacist (on/off-duty) verdict.

  ### Step 4: Limitations and Patching
  - **Firing Squad Verdict Cannot Be Fully Saved**:  
    - Your verdict ("didn’t cause death") is correct under (ii)(b)—no *positive* obligation to shoot.  
    - *But*: If the firing squad’s rules required all to shoot (making his omission a breach), or if his refusal *disrupted* a plan (e.g., he was the only one with live ammo), it might cause death. Your case specifies others fired, so overdetermination shields him.  
    - *Patch?* Not needed—clause (ii)(b) handles it by emphasizing *positive* obligations.

  - **Neighbor Verdict is Weak**:  
    - You say neighbor "didn’t cause it," but if she promised to help (creating an informal obligation), your principle *might* call it causation. Yet you imply even without a promise, proximity creates intuition.  
    - *Patch*: Add "clause (d): Obligation must be institutional or formal (contract, law, profession)," excluding informal/moral duties. This saves neighbor/Queen distinction.

  - **Queen Verdict is Overprotected**:  
    - If the Queen *owned* the plants and hired the gardener, her omission might be causal (enforceable property owner duty). Your principle allows this via (ii)(a).  

  **Recommendation**: Stick with the **Enforceable Obligation Principle** as stated. It captures 9/10 verdicts cleanly. For neighbors/strangers, accept that causation requires institutional roles—don’t weaken to moral duties. The firing squad case is already saved. For levee cases, investigate the council’s legal duties.  

  This framework makes causation by omission **role-relative and accountability-focused**, avoiding overmoralizing while respecting your intuitive splits. It’s Humean in requiring counterfactuals but Aristotelian in tying causation to agential capacities and social roles.
