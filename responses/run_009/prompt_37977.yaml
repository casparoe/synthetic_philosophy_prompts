     - **B. ...it is a straightforward inference?** → **Buddhist Logicians** (You hold testimony as a form of inference and also reduce postulation to inference.)

  4. **Inference (Smoke on the Hill)**: You see smoke rising from a distant hill. Are you entitled to conclude there is fire there?
     - **A. Yes, because smoke is always caused by fire.** (Inference is valid.) → **Unoccupied position**: No classical school rejects testimony but accepts inference.
     - **B. No, because I haven't seen the fire there and cannot assume the connection holds.** (Inference is invalid without direct perception.) → **Cārvāka Materialism** (You accept only perception as a source of knowledge.)

  5. **Absence (No Pot on the Table)**: You look at a table and see no pot. How do you know?
     - **A. I directly perceive the absence of the pot.** (Absence is an object of perception.) → **Unoccupied position**: No school in this branch holds this view (it is held by Nyāya, which is in a different branch).
     - **B. By a distinct source: non-apprehension**, meaning the absence is known because I do not perceive the pot when conditions are right. → Go to Question 6.
     - **C. By noting that my cognition does not include a pot**, so I report my own state of mind. → **Prābhākara Mīmāṃsā** (You hold that knowledge of absence is about cognition, not about the world.)

  6. **Error (Shell Mistaken for Silver)**: At dusk, you mistake a shell for silver. When you realize the mistake, what went wrong?
     - **A. I misremembered real silver from elsewhere and attached it to the shell.** (The error is a misjoining of real things.) → **Bhāṭṭa Mīmāṃsā** (You hold a theory of misattribution.)
     - **B. The silver never existed; the error arose from a fundamental ignorance.** (The world of appearance is rooted in illusion.) → **Advaita Vedānta** (You hold a theory of beginningless ignorance.)

  ---

  **Notes on Unoccupied Positions**:
  - **Reject testimony but accept inference** (Question 1=C and Question 4=A): No school holds this because if inference is accepted, testimony can be justified as a form of inference (like the Buddhists).
  - **Testimony as inference and postulation as distinct** (Question 1=B and Question 3=A): No school holds this; the Buddhists, who hold testimony as inference, also reduce postulation to inference.
  - **Testimony autonomous, postulation distinct, and absence by perception** (Question 1=A, Question 2=A, and Question 5=A): No school holds this; the Nyāya school holds absence by perception but reduces postulation to inference (so they are in a different branch).

  **Limitations**: 
  - This tree does not distinguish schools on issues beyond the five cases. For example, the Buddhist and Nyāya views on absence and error are not covered because they are separated earlier.
  - The two Mīmāṃsā sub-schools are separated by their views on absence (Question 5) and error (Question 6).

  ---

  This should fit on one page. We have used the five cases and built the tree accordingly, and we have flagged unoccupied positions.
answer: |-
  ### Classical Indian Epistemology: Diagnostic Decision Tree  
  *Follow the path by answering concrete cases. Glossed terms: postulation (arthāpatti) = reasoning to a necessary conclusion; non-apprehension (anupalabdhi) = knowing absence by non-perception; error = false cognition.*  

  ---

  **START: A doctor you trust implicitly (but cannot verify) says your test results are fine. Does this settle the matter?**  
  - **Yes, immediately and finally.** → Go to **CASE A**.  
  - **Only because I infer her reliability from past evidence.** → Go to **CASE B**.  
  - **No—I need direct verification.** → Go to **CASE C**.  

  #### **CASE A: A conspicuously fat man is never seen eating by day. Do you conclude he eats at night because…**  
  - **…it’s a unique logical necessity (postulation)?** → Go to **CASE D**.  
  - **…it’s ordinary inference (e.g., “obesity implies eating”)?** → **Nyāya-Vaiśeṣika**. *You reduce postulation to inference and accept testimony as independent.*  

  #### **CASE B: Same fat man case as above. Your conclusion is…**  
  - **A unique logical necessity (postulation).** → **Unoccupied!** *No school combines testimony-as-inference with distinct postulation.*  
  - **Ordinary inference.** → **Buddhist Logicians (Dignāga-Dharmakīrti)**. *You reduce testimony AND postulation to inference.*  

  #### **CASE C: Smoke rises from a distant hill. Are you entitled to infer fire?**  
  - **Yes—smoke reliably indicates fire.** → **Unoccupied!** *No school rejects testimony but accepts inference.*  
  - **No—connections can’t be verified for unobserved cases.** → **Cārvāka Materialism**. *You accept only perception; reject inference and testimony.*  

  #### **CASE D: You see no pot on a table. How do you know?**  
  - **By directly perceiving the absence.** → **Unoccupied!** *No school in this branch accepts absence-perception (Nyāya holds this but is excluded earlier).*  
  - **By non-apprehension: it’s absent because I don’t see it.** → Go to **CASE E**.  
  - **By reporting my cognition (“I don’t see a pot”).** → **Prābhākara Mīmāṃsā**. *You hold absence is known via cognition, not a world-fact.*  

  #### **CASE E: At dusk, you mistake a shell for silver. What caused the error?**  
  - **Misattributing real silver seen elsewhere.** → **Bhāṭṭa Mīmāṃsā**. *You accept non-apprehension and trace error to misjoining realities.*  
  - **Fundamental ignorance (no real silver existed).** → **Advaita Vedānta**. *You accept non-apprehension and trace error to illusion (avidyā).*  

  ---

  ### Key to Leaves  
  1. **Cārvāka**: Rejects testimony/inference; perception-only.  
  2. **Buddhist Logicians**: Reduces testimony/postulation to inference.  
  3. **Nyāya-Vaiśeṣika**: Autonomous testimony; reduces postulation to inference.  
  4. **Prābhākara Mīmāṃsā**: Knowledge of absence is cognitive; error is non-distinction (no falsity).  
  5. **Bhāṭṭa Mīmāṃsā**: Non-apprehension for absence; error is misjoining realities.  
  6. **Advaita Vedānta**: Non-apprehension for absence; error is illusion (avidyā).  

  ### Unoccupied Combinations & Limitations  
  - **Reject testimony but accept inference** (C → "Yes"): Unoccupied. *Incoherent—accepting inference would justify testimony.*  
  - **Testimony-as-inference + distinct postulation** (B → "Unique necessity"): Unoccupied. *Unattractive—reducing both to inference is simpler.*  
  - **Cannot separate**: Bhāṭṭa and Advaita agree on non-apprehension (CASE D) and split only on error (CASE E). Prābhākara is separated by CASE D.  
  - **Limitation**: Buddhist and Nyāya views on absence/error are not covered (separated earlier by testimony/postulation).  

  ---  
