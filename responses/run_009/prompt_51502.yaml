prompt: |-
  I have been keeping a ledger of my reactions to contested markets, and I would like help extracting whatever principle, if any, is behind it. My verdicts so far. Paid plasma donation: fine. A tightly regulated system of compensating living kidney donors: fine, and I increasingly think prohibiting it is the cruelty. Buying concert tickets from a scalper at triple face value: fine. Paying a line-standing service to hold my place in the queue for Supreme Court oral arguments: fine. Selling my vote in an election: not fine. A corporation quietly taking out life insurance on thousands of its rank-and-file employees and naming itself the beneficiary: not fine, and viscerally so. Yet viatical settlements as they worked in the 1990s — investors buying the life-insurance policies of people dying of AIDS at a deep discount, keeping the premiums paid, and collecting at death — strike me as fine: the policyholder consented, got liquidity when it mattered, and the investor profiting from a death doesn't bother me there. I cannot say whether the difference is just consent, or the fact that the dying person shares in the benefit, or whether I am fooling myself. A hardware store tripling the price of generators the night after a hurricane: not fine. A wealthy country paying a poor one to accept hazardous waste: not fine. But carbon offsets — paying strangers to plant trees so that my flights come out carbon-neutral — feel fine to me, and I confess they have exactly the shape of the waste case: paying the less affluent to absorb the residue of my consumption. Well-compensated egg donation: fine. Paying a birth mother for her baby beyond medical expenses, even with enthusiastic consent on both sides: not fine, and I have never been able to make this comfortable with the kidney and egg verdicts. I have also heard it claimed that when places started paying for blood, the unpaid supply largely collapsed, which suggests my plasma verdict may rest on an empirical mistake I have not checked.

  My tentative rule is something like: an exchange is repugnant when trading in it erodes either the good being traded or the institution surrounding it — vote selling corrodes democracy, baby selling corrodes something about parenthood, the corporate insurance corrodes the employment relation. Everything else, on this rule, is mere squeamishness, and my squeamishness should not be legislated. But I cannot see why, on my own rule, compensated egg donation does not corrode motherhood, or why the line-standing market does not corrode whatever the queue was supposed to do, or why gouging counts as erosion rather than rationing. And the rule seems to leave the grief market untouched, which is the case I keep circling: firms, in several countries, will supply professional mourners to attend your funeral or, presumably, your wedding — paid strangers performing sorrow, or joy, in your name. My gut rotates on it daily.

  So here is what I am asking for. Give me the principle, or a small set of candidate principles, stated as precisely as you can, with each clause tied to the verdict that motivates it — the more so if different clauses pull in opposite directions on the same case. Tell me what your best candidate says about the professional mourners, about the case I flagged as resting on an uncheckable empirical claim, and about two or three further cases I have not considered but that you think would stress-test it: I would suggest paying a stranger to write my apologies for me, universities openly selling a fixed number of admission slots, and a market in handing in found wallets for a bounty. Finally, be honest about which of my verdicts the best principle cannot accommodate, and argue for which one should be surrendered rather than which clause should be bolted on to rescue it. I care more about being told that two of my verdicts are jointly unstable than about having all of them flattered.
reasoning: |-
  Okay, let me start by really understanding what this user is asking. They've listed a bunch of scenarios where they feel certain markets are acceptable or repugnant, and they want a principle that explains their reactions. The user is clearly thoughtful, methodical, and self-aware, noting inconsistencies in their own judgments. They're not just looking for validation but a rigorous framework to test their intuitions.

  First, I need to break down each of their verdicts and look for patterns. They're okay with paid plasma and kidney donations, concert scalping, line-standing, and viaticals. But they object to vote selling, corporate life insurance, price gouging, international waste dumping, and baby selling. Carbon offsets and egg donation are fine, but paying birth mothers beyond medical costs isn't. There's also the unresolved issue of professional mourners.

  The user's tentative rule is that repugnance occurs when a market erodes the good or its surrounding institution. But they struggle with why egg donation doesn't erode motherhood while baby selling does, or why line-standing doesn't undermine queues. They also mention grief markets and empirical issues like paid blood donations affecting unpaid supply.

  I recall that Al Roth's work on repugnant markets might be relevant here. He talks about how some markets are restricted not for efficiency but due to moral objections. The user's erosion idea aligns with Roth's institutional corrosion concept. But I need to expand that into a multi-factor principle.

  Looking at the cases, consent alone isn't sufficient. In corporate life insurance, employees might consent passively, but it still feels wrong. Benefit-sharing matters too—viaticals work because the dying person gets liquidity. Exploitation is a factor in waste dumping and price gouging, where one party is vulnerable. Commodification fears appear in baby selling and vote selling, where the goods are seen as sacred.

  For professional mourners, the key is whether it degrades genuine grief. If the mourners are just actors, it might commodify emotions. But if it's a cultural practice, it could be acceptable. The user's discomfort might stem from insincerity versus cultural tradition.

  The blood donation example shows empirical consequences matter. If paying for plasma reduces unpaid donations, that's an erosion of altruism. The user needs to check if that's true, but the principle should include such unintended effects.

  New test cases: Paying for apologies could commodify remorse, making it insincere. Universities selling slots might undermine meritocracy. Bounties for wallets could encourage honesty or lead to theft. Each tests different aspects—commodification, institutional integrity, and incentivized behavior.

  Conflicts in verdicts: Egg donation is fine, but baby selling isn't. The distinction might be that eggs are renewable and don't involve transferring parental rights, whereas babies involve creating a parent-child relationship for money. But the user needs to reconcile this with their acceptance of kidneys, which are non-renewable but don't alter identity relations.

  Surrendering a verdict might be necessary. Maybe carbon offsets are closer to waste dumping than admitted, or grief markets are acceptable if culturally contextualized. The user should reconsider if their objection to corporate insurance is consistent with accepting viaticals, where investors profit from death too. The difference is the policyholder's consent and benefit, whereas employees might not even know.

  In the end, the best principle combines commodification, coercion/exploitation, institutional erosion, and benefit-sharing. The user might need to adjust their view on grief markets or accept that some intuitions are context-dependent. Highlighting the trade-offs and empirical aspects will help them refine their framework.
answer: |-
  Based on your detailed ledger and reasoning, here is the best candidate principle I can construct, incorporating your insights and addressing the tensions:

  **The Principle of Non-Erosive, Non-Exploitative Exchange (NENE):**

  An exchange is morally permissible unless it violates one or more of the following conditions:
  1.  **Non-Commodification of Sacred Goods (NCS):** The good or service traded is not one whose intrinsic value or social meaning is fundamentally undermined by being priced and traded. (Motivated by: Vote selling corrodes democracy's intrinsic meaning; Baby selling corrodes the sacred nature of parenthood/child; Corporate life insurance corrodes the inherent value of employee life/trust).
  2.  **Absence of Coercion/Exploitation (ACE):** The transaction does not exploit severe vulnerability, desperation, or asymmetric power to the extent that meaningful consent is compromised, nor does it create perverse incentives harming the vulnerable party. (Motivated by: Post-hurricane price gouging exploits desperation; Waste dumping exploits poverty/national weakness; Corporate life insurance exploits employee dependence/lack of knowledge; Baby selling risks exploiting birth mother vulnerability despite consent).
  3.  **Institutional Non-Erosion (INE):** The market does not demonstrably erode the effectiveness or legitimacy of essential non-market institutions or vital public goods upon which it depends or which depend on non-market norms (e.g., altruism, civic duty, trust). (Motivated by: Vote selling erodes democracy; Paid blood potentially erodes altruistic supply; Corporate life insurance erodes employment trust; Scalping/Line-standing *might* erode queue fairness/access *if* proven dominant).
  4.  **Benefit-Sharing (BS):** When the exchange involves a fundamental human condition (life, death, health, procreation), the party most intimately affected by that condition receives a significant, direct, and intended benefit from the transaction. (Motivated by: Viaticals benefit the dying person directly; Kidney/Egg donation benefits the donor financially *and* often an altruistic purpose; Corporate life insurance benefits *only* the corporation from the employee's death; Baby selling benefits intermediaries/adoptive parents primarily, commodifying the child).

  **How NENE Explains Your Verdicts:**

  *   **Plasma/Kidney/Egg Donation (Fine):**
      *   NCS: Bodily tissues (plasma, eggs, kidneys) are seen as renewable or replaceable resources, not sacred identities like a child or vote. Egg donation doesn't commodify *motherhood*, only gametes.
      *   ACE: Donation is (ideally) voluntary, regulated to minimize exploitation. Compensation addresses burden/risk.
      *   INE: Potential erosion of altruistic supply (blood) is the *empirical* concern flagged; regulation aims to prevent this for kidneys/eggs.
      *   BS: Donor receives significant direct benefit (compensation).
  *   **Concert Scalping/Line-Standing (Fine):**
      *   NCS: Tickets/queue positions are inherently fungible commodities.
      *   ACE: Willing buyer/willing seller. No inherent severe vulnerability exploited.
      *   INE: *Potential* for erosion (e.g., if scalpers dominate tickets, excluding genuine fans; if line-standers make queue access purely wealth-based) exists, but you deem it acceptable *if* it doesn't *demonstrably* destroy the underlying good (concert access, court observation). Your verdict assumes it doesn't (or the erosion is tolerable).
      *   BS: Both parties benefit directly (convenience/profit).
  *   **Viaticals (Fine):**
      *   NCS: A financial contract (insurance policy) is traded, not life/death itself.
      *   ACE: Policyholder consents, seeking liquidity in a vulnerable state, but the *direct benefit* mitigates exploitation concern.
      *   INE: No clear erosion of insurance *institution* (it's a secondary market).
      *   **BS: CRITICAL -** The dying person receives a direct, significant, intended benefit (liquidity). The investor profits, but the *primary* beneficiary is the policyholder.
  *   **Vote Selling (Not Fine):**
      *   **NCS: VIOLATED** - Voting is a sacred civic duty/right; pricing it commodifies and destroys its core meaning.
      *   ACE: Likely exploits poverty.
      *   **INE: VIOLATED** - Directly and severely erodes the legitimacy and function of democracy.
  *   **Corporate Life Insurance (Not Fine):**
      *   **NCS: VIOLATED** - Treats employee life/death purely as a financial instrument for corporate gain, commodifying human life within the employment relationship.
      *   ACE: Exploits asymmetric power/information; employees often unaware/coerced; creates perverse incentives.
      *   **INE: VIOLATED** - Severely erodes trust and the non-commercial basis of the employment relationship.
      *   **BS: VIOLATED** - Employee (or family) facing death receives *no* intended benefit; corporation profits directly from their death.
  *   **Post-Hurricane Price Gouging (Not Fine):**
      *   NCS: Generators are commodities, but context matters.
      *   **ACE: VIOLATED** - Exploits acute vulnerability and desperation created by disaster.
      *   INE: Could erode community trust/solidarity post-disaster.
      *   BS: Seller benefits disproportionately; buyer is harmed by exploitation.
  *   **Hazardous Waste Dumping (Not Fine):**
      *   NCS: Waste is a commodity, but its impact isn't.
      *   **ACE: VIOLATED** - Exploits national poverty and weak governance.
      *   INE: Undermines global environmental justice norms.
      *   BS: Poor nation bears long-term harm; wealthy nation/corp avoids cost.
  *   **Carbon Offsets (Fine - for you):**
      *   NCS: Carbon is a measurable externality; offsets frame it as a traded commodity.
      *   ACE: *Less* clear-cut exploitation? Assumes fair deals with tree-planters. Feels like waste dumping? Your discomfort highlights a tension. NENE *permits* it if ACE/BS aren't violated (fair price, tree-planters benefit).
      *   INE: Aims to *support* environmental institutions (if effective).
      *   BS: Planet *potentially* benefits; offset seller (e.g., tree-planter) receives income; buyer pays for externality. Your "fine" verdict suggests you see BS/ACE as met *enough*.
  *   **Baby Selling (Not Fine):**
      *   **NCS: VIOLATED** - Child is a unique human person; pricing commodifies the child and the fundamental relationship of parenthood.
      *   ACE: High risk of exploiting birth mother vulnerability, despite consent.
      *   INE: Could erode adoption norms based on child welfare, not market forces.
      *   **BS: VIOLATED** - Direct financial benefit primarily goes to intermediaries/mother; the *child* is the object traded, receiving no direct benefit from the transaction itself. Benefit is indirect (placement in a home).
  *   **Egg Donation vs. Baby Selling Distinction:** Eggs (NCS: gametes, not a person) vs. Baby (NCS: person/parenthood). BS: Donor benefits directly; in baby selling, the direct beneficiary is the adoptive parent/intermediary, commodifying the child. ACE: Higher perceived exploitation risk in baby selling due to vulnerability.

  **Applying NENE to Your Queries & New Cases:**

  1.  **Professional Mourners (Grief Market):**
      *   **NCS:** This is the crux. Does paying for mourning performance commodify/degrade genuine grief and cultural rituals surrounding death? Or is it simply providing a service (like event planning) fulfilling a cultural expectation? Your gut rotation suggests deep uncertainty here. *NENE permits it only if you conclude it doesn't violate NCS (it's a service, not sacred grief itself) and ACE (mourners aren't exploited).* If it feels like "faking" a sacred emotion, NCS is violated. If it's a cultural norm (like hired pallbearers), it might be acceptable. NENE highlights why this *is* a hard case – it hinges entirely on whether grief/ritual is a "sacred good."
      *   **INE/BS:** Less directly applicable. No clear institutional erosion; mourners benefit financially.

  2.  **Paid Plasma & Blood Supply Erosion (Empirical Claim):**
      *   **INE:** This is the relevant clause. *If* paying for plasma demonstrably caused the collapse of the *unpaid, altruistic* blood supply (a vital public good relying on non-market norms), then INE is violated. Your verdict assumes either this didn't happen, or the negative impact (erosion of altruism) is outweighed by the benefits of increased plasma supply. NENE forces you to confront this empirical reality – your verdict *depends* on INE *not* being violated. Check the data!

  3.  **New Test Cases:**
      *   **Paying a Stranger to Write My Apologies:**
          *   **NCS:** Likely **VIOLATED**. A sincere apology is an expression of personal remorse and accountability. Outsourcing its creation commodifies and fundamentally undermines its authenticity and meaning (sacred good of personal responsibility/contrition).
          *   ACE: Potential exploitation of writers? Less clear.
          *   INE: Could erode norms of genuine interpersonal reconciliation.
          *   BS: You avoid the discomfort of crafting the apology; writer gets paid; the *recipient* is deceived about the sincerity. **Verdict: Not Fine (NCS violation).**
      *   **Universities Openly Selling a Fixed Number of Admission Slots:**
          *   **INE:** Likely **VIOLATED**. Higher education relies on institutions of meritocracy, academic potential, and equal opportunity (however imperfect). Selling slots explicitly replaces these with wealth, directly eroding the legitimacy and core mission of the university as an educational/public good institution.
          *   NCS: Education access has a quasi-sacred status; selling slots commodifies opportunity itself.
          *   ACE: Exploits the desire for elite status? Less direct coercion.
          *   BS: Wealthy buyer benefits; university benefits; meritorious non-wealthy are excluded. **Verdict: Not Fine (INE violation dominant, NCS violation likely).**
      *   **Market in Handing in Found Wallets for a Bounty:**
          *   **INE:** Potential **VIOLATION/AMBIGUOUS**. Relies on non-market norms of honesty and civic duty. Does a bounty incentivize more returns (good) or create perverse incentives (theft "for bounty," "losing" wallets near bounty stations, reducing intrinsic honesty)? *Empirical question is key.* If it crowds out intrinsic honesty, INE is violated.
          *   NCS: Honesty? Less clearly sacred, but valued.
          *   ACE: Unlikely.
          *   BS: Finder benefits; owner benefits (gets wallet back); society benefits if net increase in returns. **Verdict: Permissible *only if* INE isn't violated (i.e., if it increases returns *without* significantly eroding baseline honesty norms).** If honesty erodes, it becomes Not Fine.

  **Conflicts and Which Verdicts to Surrender:**

  1.  **The Core Tension:** **Benefit-Sharing (BS) vs. Non-Commodification (NCS) / Institutional Non-Erosion (INE) in High-Stakes Exchanges.** Why is *viatical settlement* (investor profits from death) fine but *corporate life insurance* (corporation profits from death) viscerally not? NENE argues BS is the key: the dying person *directly benefits* in viaticals, while the employee does not in corporate insurance. However, your discomfort with *investors* profiting from AIDS deaths in the 90s, even while accepting it, hints that the *lack* of NCS/INE violation is doing heavy lifting – you accept the commodification *of the policy* because BS mitigates it. Surrendering the viatical verdict would require abandoning BS or finding a differentiator (e.g., scale, intent). **Recommendation: Keep BS and accept the viatical verdict as consistent with NENE, recognizing the role of BS in mitigating the distaste of profiting from death.**

  2.  **Carbon Offsets vs. Hazardous Waste Dumping:** Your intuition finds offsets fine but waste dumping not. NENE (ACE/BS) *can* distinguish them: Offsets *aim* for mutual benefit (seller paid, buyer offsets, environment helped) and avoid *direct* exploitation if fairly structured. Waste dumping *inherently* exploits poverty and imposes harm. However, your acknowledgment that they share a shape ("paying the less affluent to absorb the residue of my consumption") is valid. **Recommendation: Scrutinize offsets rigorously under ACE (are tree-planters truly paid fairly? Is it effective?) and BS (does the environmental benefit materialize?). Your "fine" verdict may be provisional. Surrendering the offset verdict if evidence shows exploitation/ineffectiveness is better than abandoning ACE for this case.**

  3.  **Egg Donation vs. Baby Selling:** NENE distinguishes via NCS (commodification of gametes vs. person/parenthood) and BS (direct donor benefit vs. commodification of child). This is logically consistent. The lingering discomfort likely stems from the *proximity* of egg donation to reproduction/motherhood. **Recommendation: Maintain the distinction based on NCS. Surrendering the egg donation verdict would require collapsing the distinction between gametes and children/parenthood, which is untenable.**

  4.  **Line-Standing/Scalping vs. Queue Erosion:** Your verdict assumes the erosion (making access wealth-based) is either minimal or an acceptable trade-off for efficiency. NENE (INE) highlights this is contingent. If evidence showed line-standing *completely* excluded genuine interested parties from SCOTUS arguments, making it purely a paid service, INE violation might shift your verdict. **Recommendation: Acknowledge the *potential* for INE violation but hold the verdict based on current assumptions. Be prepared to shift if evidence of severe erosion emerges.**

  **Conclusion:**

  The **NENE Principle (Non-Commodification of Sacred Goods, Absence of Coercion/Exploitation, Institutional Non-Erosion, Benefit-Sharing)** provides a robust framework explaining most of your verdicts and highlighting the tensions. It identifies:

  *   **Professional Mourners:** Permissible *only* if you conclude hired performance doesn't commodify/degrade the sacred good of genuine grief/ritual (NCS).
  *   **Paid Plasma:** Your verdict *depends* on the empirical claim about unpaid supply erosion (INE). If true, your verdict needs re-evaluation.
  *   **New Cases:** Apology writing violates NCS; University slot selling violates INE/NCS; Wallet bounties are permissible only if INE isn't violated.
  *   **Unstable Verdict:** Your acceptance of carbon offsets *might* be in tension with your rejection of waste dumping if scrutiny under ACE/BS reveals significant exploitation or lack of real benefit. Scrutinize this verdict hardest.
  *   **Surrender Candidate:** None of your core verdicts *must* be abandoned if NENE is accepted. However, be prepared to adjust **carbon offsets** if ACE/BS violations are proven, and **paid plasma** if INE violation (erosion of altruism) is confirmed. The principle highlights where empirical reality or deeper reflection might necessitate change.

  NENE doesn't eliminate all discomfort (e.g., profiting from death in viaticals), but it provides principled reasons for when that discomfort should override consent (NCS/INE/ACE violations) and when it might be "mere squeamishness" outweighed by other factors (like BS in viaticals). It forces clarity on *why* something feels repugnant.
