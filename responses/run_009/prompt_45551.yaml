  1.  The graded view interprets the Act's structure—extending protections based on scientific evidence reviews—as reflecting policy grappling with continuous biological reality, where the committee effectively placed cephalopods/decapods higher than bivalves/insects on a sentience spectrum.
  2.  It explains well the differential treatment: cephalopods/decapods were included due to stronger evidence for complex sensory experiences and pain responses, aligning with richer phenomenal lives, while bivalves were excluded due to weaker evidence, consistent with a lower degree of attributed sentience.
  3.  The view is silent or misdescribes the absence of serious debate on insects (despite comparable scientific uncertainty to decapods) and struggles to explain why the legal line precisely *here* was deemed necessary, suggesting non-graded factors like societal familiarity or lobbying influenced exclusions.
  4.  A binary-threshold rival struggles more fundamentally: the selective inclusion of *only certain* invertebrates despite a clear vertebrate/invertebrate divide appears arbitrary, whereas the committee's evidence-based gradations better justify the specific inclusions and exclusions under scrutiny.
  5.  The episode demonstrates the graded view's practical viability: law can operationalize scientific gradations into discrete legal thresholds (vertebrates + cephalopods/decapods) for feasibility, without requiring a metaphysical binary or undermining the core claim that moral status tracks degree of sentience.
