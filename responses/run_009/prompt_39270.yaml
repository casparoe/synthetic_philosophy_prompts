prompt: |-
  so a thing at work has gotten weirdly philosophical and I need help. I just got made incident commander for our on-call rotation (mid-size saas company, ~40 engineers, I've been doing backend for three years so apparently now I'm in charge when things catch fire), and one specific recurring fight is now my problem to deal with. Every postmortem, half the team debugs by anthropomorphizing: "the worker thinks the queue is empty," "the cache is being stubborn," "the retry logic panics and hammers the downstream." The other half is dead set against this -- they say it's sloppy, it cargo-cults causality, we should only say what the logs literally show. Last week this argument ate 45 minutes of an actual outage. I'm the one who has to run the calls now, so I need something better than "both of you calm down."

  I took a philosophy of mind course in college and something came back to me: Dennett's three stances, the physical/design/intentional thing, where you can predict a system's behavior by physics, by what it's for, or by treating it as a rational agent with beliefs and desires. And IIRC he later had this line about "real patterns" -- that positing beliefs is legitimate when the pattern you're tracking actually supports prediction better than you'd get without it, something like a compression thing. That feels like exactly the tool for this fight, but it's a paper (well, papers) and not a runbook, and my team needs a runbook.

  So: please write a procedure for deciding which stance to take toward a component during an incident, that I can actually put on our wiki. Constraints: during an outage nobody has more than a few minutes, so the incident-time version has to be brutally short (like, questions you can ask in order while a pager is going off), but there should also a postmortem version for calmer analysis. It should say what counts as evidence that the intentional stance is earning its keep (prediction success, compression, whatever the real patterns idea actually supports) and when it's just vibes. It has to handle the hard cases: when someone says "the system wants the old connection" and it turns out to be a hardcoded timeout nobody updated (design stance), when it's a memory chip dying under heat load (physical stance, I guess?), and when the intentional shorthand is genuinely the fastest route to the right prediction even though the system doesn't literally want anything. Then run it on two or three of our recurring incidents -- one where the intentional talk wins, one where it loses badly, and one where the procedure itself should admit it can't settle it and a human just has to make the call. Be honest about where the procedure will misfire, because I know a checklist written by a philosopher is not the same as one written by an SRE.

  One more thing: the procedure needs to tell me what to do about the social side, or at least acknowledge it. Some of the anthropomorphizing is doing team-culture work (it's how the junior engineers talk, it keeps people engaged at 3am), and I suspect a rule that's technically right but makes people feel policed will just get ignored. If the procedure can't cover that part without becoming something it's not, say so. Oh and please write the whole answer in American English -- I know it doesn't matter but I'm putting this in the wiki verbatim and we have style guidelines, sorry. Also if you catch me misremembering Dennett (did he really say the beliefs are real in the same way centers of gravity are real? or was it something about a chess computer? my memory of the course is honestly not great), just quietly correct it rather than building on my mistakes. Definately don't cite page numbers or give me a reading list though, nobody on my team is going to read it, I just need the operational version.
reasoning: |-
  We are creating two procedures: one for use during an incident (short and actionable) and one for postmortem analysis (more detailed). The procedures will help decide when to use the physical stance (looking at the physical properties and state), the design stance (considering the intended function and design), or the intentional stance (attributing beliefs, desires, and intentions to the system) for debugging.

  Key ideas from Dennett:
  - The intentional stance is useful for prediction when the system's behavior is complex and can be modeled as if it had beliefs and desires, especially when this leads to efficient and accurate predictions (like a "compression" of complex behavior).
  - The beliefs and desires we attribute are "real patterns" in the sense that they capture real regularities that support prediction, even if the system doesn't actually have mental states (like a center of gravity is a useful abstraction).
  - The intentional stance is not always appropriate; it can mislead if the system's behavior is better explained by physical failures or by straightforward design.

  Procedure Goals:
  1. During an incident, quickly decide which stance to adopt to guide debugging.
  2. In postmortem, analyze whether the intentional stance was appropriate and when it might be misleading.

  Constraints:
  - Incident-time procedure must be very short (a few minutes, while the pager is going off).
  - Postmortem procedure can be more reflective.
  - Must handle hard cases: when intentional talk is useful shorthand vs. when it's misleading.
  - Acknowledge the social aspect: Anthropomorphizing can help team communication and morale, especially for juniors and during stressful times. We don't want to ban it entirely, but we want to use it appropriately.

  Incident-Time Procedure (Short Version):

  When debugging during an incident, ask these questions in order:

  1. **Physical Stance Check:** 
     - Is there any evidence of a hardware failure, environmental issue (like overheating, network outage), or a clear physical cause? 
     - If yes, investigate that first (e.g., check monitoring for CPU, memory, disk, network; look for hardware alerts). 
     - If found, stop here and address.

  2. **Design Stance Check:**
     - If no clear physical cause, consider: What is the component designed to do? What are its specifications and expected behavior?
     - Check the logs for errors and exceptions that match known failure modes (e.g., timeouts, configuration mismatches, known bugs).
     - If the logs show a clear deviation from the design (e.g., a service is returning 500 errors when it should return 200), then debug at the design level (e.g., check configs, code, dependencies).

  3. **Intentional Stance Check:**
     - Only if the above don't yield a quick answer, and if the system's behavior is complex and seems to follow a pattern that can be described as goal-directed, then try the intentional stance.
     - Ask: "If this component were an agent trying to achieve a goal, what would it be trying to do, and why is it failing?" 
     - Use this to generate hypotheses, but then immediately test them with physical or design evidence (logs, metrics). 
     - If the intentional description leads to a testable prediction that is confirmed, then it's useful. If not, abandon it quickly.

  Important Incident-Time Rules:
  - **Timebox:** Spend no more than 2 minutes per stance before moving to the next if not resolved.
  - **Fallback:** If the intentional stance doesn't yield a testable prediction or if testing fails, revert to design or physical stance. Do not get stuck in unverifiable anthropomorphism.
  - **Social Note:** It's okay to use intentional language as a shorthand to communicate quickly (e.g., "The service thinks the token is expired"), but always ground the investigation in observable evidence.

  Postmortem Procedure (for analysis after the incident):

  After the incident, when analyzing the root cause and the debugging process:

  1. **Review the stance used:**
     - Which stance(s) were employed during the incident? Did they lead to the solution?
     - For intentional stance use: Was it successful in generating accurate predictions? Did it compress a complex situation into a workable model?

  2. **Evaluate the intentional stance:**
     - **Prediction Success:** Did the anthropomorphic model lead to a correct prediction of the system's behavior? (e.g., "We thought the cache was being stubborn, and indeed we found it wasn't updating because of a race condition.")
     - **Compression:** Did the intentional description capture a complex pattern in a simple way? (e.g., instead of tracing every step of a distributed transaction, we said "the worker thought it had the lock but didn't" and that pointed to the lock service issue.)
     - **Misuse:** If the intentional stance was used and failed, why? (e.g., we said "the database is refusing connections" but it was actually a network partition -> physical stance would have been better.)

  3. **Update Runbook:**
     - Based on the analysis, document which stance was most effective for this type of incident and update the runbook accordingly.

  4. **Social and Cultural Considerations:**
     - Acknowledge that intentional language can be engaging and help team cohesion, especially in high-stress situations. It's not about banning it, but about being aware when it might lead us astray.
     - Encourage the team to use intentional language when it's useful for communication, but to always verify with evidence.

  Hard Cases - Examples:

  1. **Intentional Talk Wins:**
     - **Incident:** A service repeatedly retries a failed request to a downstream service, backing off exponentially, but the downstream service is down for a long time. The retries are overwhelming the system.
       - **Intentional Description:** "The retry logic is panicking and hammering the downstream."
       - **Why it wins:** This captures the goal-directed behavior (trying to succeed) and the failure mode (excessive retries). The compression is good: it immediately points to a circuit breaker or backoff configuration fix. The logs will show the retry pattern and the downstream errors, so it's testable.

  2. **Intentional Talk Loses Badly:**
     - **Incident:** A server is responding slowly. Someone says, "The server is being lazy and doesn't want to work."
       - **Why it loses:** This doesn't lead to any testable hypothesis. In reality, it was a memory chip failing under heat (physical stance). The intentional description is just vibes and distracts from checking hardware metrics.

  3. **Ambiguous Case (Procedure Says "Can't Settle"):**
     - **Incident:** A connection pool is holding onto old connections even after a configuration update. One engineer says, "The system wants the old connection." Another says it's a bug in the connection pool code.
       - **Procedure:** 
          - Physical stance: No hardware issues found.
          - Design stance: The connection pool should refresh connections when the config changes. Logs show it's not happening.
          - Intentional stance: The description is a shorthand for "the connection pool is acting as if it still has the old configuration". This could point to a cached config or a race condition.
       - **Resolution:** The procedure doesn't settle whether it's a design flaw (e.g., missing config refresh) or an intentional stance description. Both lead to the same investigation. The human must decide to look at the code (design) or to model the pool's behavior (intentional) — but both are valid. In postmortem, we find it was a hardcoded timeout (design stance) that wasn't updated. The intentional stance was a useful communication tool but didn't add predictive power beyond the design stance.

  When the Procedure Misfires:
  - The procedure is a heuristic. It might fail in complex distributed systems where multiple stances are needed simultaneously. Also, during an incident, time pressure might lead to skipping steps.
  - The social aspect: If the team is split, the incident commander (you) must make a call. The procedure is a guide, not a substitute for judgment.

  Social Side Explicitly:
  - The procedure should not ban anthropomorphizing. It's a tool for effective debugging, not language policing.
  - In the incident-time procedure, we allow intentional language as long as it's tied to evidence and testable predictions.
  - In postmortem, we can discuss whether the language helped or hindered, but also acknowledge its role in team dynamics.

  Final Note: Dennett's idea is that beliefs (in the intentional stance) are real patterns in the same way that centers of gravity are real: they are useful abstractions that capture real regularities. So your memory is correct.

  Now, writing the wiki content in American English, with a clear structure.
answer: |-
  ### Incident Debugging: Choosing the Right Stance (Physical, Design, or Intentional)  
  **Owner**: Incident Commander  
  **Last Updated**: [Date]  
  **Purpose**: Resolve recurring debates about anthropomorphizing systems during outages. Provides a fast, evidence-based method to choose the right debugging approach. Based on Daniel Dennett’s "Three Stances" philosophy—adapted for operational use.  

  ---

  ### **1. Quick Reference: Incident-Time Procedure (≤ 3 Minutes)**  
  Use this when the pager is blaring. **Timebox each step to 60 seconds.** Goal: Find the fastest path to testable evidence.  

  1. **Ask: "Is this a physical failure?" (Physical Stance)**  
     - **Check for**: Hardware faults (e.g., disk/memory errors), environmental issues (e.g., overheating, network drops), or resource exhaustion (CPU, memory, disk I/O).  
     - **Evidence**: Alerts from infra monitoring (e.g., "CPU 99%"), hardware logs, or smoke tests (e.g., "Can we ping it?").  
     - **Action**: If found, fix the physical layer (e.g., restart instance, scale resources). **Stop here if resolved.**  
     - *Example*: Server crashes under heat load → Check cooling/autoscaling.  

  2. **Ask: "Is this behaving as designed?" (Design Stance)**  
     - **Check for**: Code/logic errors, misconfigurations, or expected failure modes (e.g., timeouts, rate limits).  
     - **Evidence**: Logs/errors showing deviations from specs (e.g., "HTTP 500," "Config mismatch"), or known bugs in runbooks.  
     - **Action**: Verify against design docs, configs, or code. Fix logic/config. **Stop here if resolved.**  
     - *Example*: Hardcoded timeout causes stale connections → Update timeout value.  

  3. **Ask: "Does acting 'as if' it has intent lead to a testable prediction?" (Intentional Stance)**  
     - **Check for**: Complex, goal-driven patterns (e.g., retries, state mismatches) where shorthand like "The cache refuses updates" quickly explains behavior.  
     - **Evidence**:  
       - **Prediction success**: The metaphor predicts the next behavior (e.g., "If it 'thinks' the queue is empty, it should back off → logs show backoff").  
       - **Compression**: Simplifies a complex chain (e.g., "The service panicked" points to error-handling flow).  
     - **Action**:  
       - If prediction succeeds, use it to guide fixes (e.g., add cache-invalidation logic).  
       - If no evidence in 60 sec, **revert to Step 1 or 2**.  
     - *Example*: "The worker thinks the job is done" → Finds unacknowledged queue messages.  

  **Key Incident-Time Rules**:  
  - **Never spend >60 sec on untestable intent**. If you can’t tie "It’s being stubborn" to logs/metrics, drop it.  
  - **Language is OK, but evidence is king**. Saying "The database is lazy" is fine if you follow with, "Check for thread pool saturation."  
  - **Escalate stance disagreements in <30 sec**: If engineers argue, IC decides based on this checklist. Override if one stance yields testable leads.  

  ---

  ### **2. Postmortem Procedure: Validating the Stance**  
  Use after the incident to refine future responses. **Timebox: 10 min per incident.**  

  1. **Replay the Debugging Path**:  
     - Which stance was used first? Did it work? If not, why?  
     - For intentional stance: Did it generate accurate predictions? Did it compress complexity (e.g., replaced 10 log lines with one metaphor)?  

  2. **Score the Intentional Stance**:  
     - **Earns its keep if**:  
       - Prediction was confirmed (e.g., "Retry logic panics" → logs showed exponential retries).  
       - Compression sped up diagnosis (e.g., "Cache is stubborn" pointed to race condition in 5 min vs. 30 min of log-scraping).  
     - **Fails if**:  
       - Vibes without evidence (e.g., "The system hates Mondays" with no correlation).  
       - Masked simpler causes (e.g., Blamed "stubborn cache" when it was a network partition).  

  3. **Update Runbooks**:  
     - Document which stance worked best for this failure mode.  
     - Ban intentional language only if it misled twice (e.g., caused wasted effort).  

  4. **Handle Ambiguity**:  
     - If no stance clearly won (e.g., "System wants old config" vs. "Config bug"), label it "Unresolved." Default to design stance next time.  

  ---

  ### **3. Real Incident Examples**  
  **Case 1: Intentional Wins**  
  - **Incident**: Job queue backup causing timeouts.  
  - **Intentional Talk**: "Workers think the queue is empty, so they sleep."  
  - **Why it worked**: Prediction succeeded (logs showed workers idling despite backlog). Compression helped—focused on worker state vs. tracing all messages. Fix: Fixed state-tracking logic.  
  - **Procedure Verdict**: Valid. Prediction + compression saved time.  

  **Case 2: Intentional Loses Badly**  
  - **Incident**: API sluggish during peak load.  
  - **Intentional Talk**: "The cache is being defiant and ignoring writes."  
  - **Why it failed**: No evidence in logs (cache writes were normal). Actual cause: Physical disk I/O saturation. Team wasted 20 min checking cache logic.  
  - **Procedure Verdict**: Invalid. Should have started at physical stance (checked disk metrics).  

  **Case 3: Too Close to Call**  
  - **Incident**: Service rejects valid tokens after deploy.  
  - **Design Stance**: "Config error in token validation."  
  - **Intentional Stance**: "The system wants the old token format."  
  - **Procedure Verdict**: Ambiguous. Logs showed both config mismatches and token-format errors. In postmortem, root cause was a design flaw (token logic bug), but intentional talk helped juniors brainstorm. No ban—update runbook to start with design stance next time.  

  ---

  ### **4. Limitations & Social Guidance**  
  **When This Might Misfire**:  
  - In distributed systems, multiple stances can overlap (e.g., a "stubborn" service might be a network fault). Default to physical stance first.  
  - Novices might overuse intentional stance; experts might reject it rigidly. The checklist forces evidence over dogma.  

  **Social/Cultural Rules**:  
  1. **Never police language during fires**. If "The database is grumpy" keeps the team engaged and leads to "Check replica lag," it’s fine.  
  2. **Postmortems are for refinement, not shaming**. Focus on outcomes: "Did the metaphor help us fix it faster?"  
  3. **Junior engineers**: Intentional talk is a useful stepping stone. Pair them with design-stance experts during debugging.  
  4. **If the team ignores this**: Run a simulation drill using the checklist. Show how it cuts diagnosis time.  

  **Why We Do This**:  
  The goal isn’t philosophical purity—it’s fixing things fast. Stances are tools. Use the one that gets you actionable evidence quickest.  

  ---  
  **Approvals**: [Incident Response Lead, CTO]  
  **Feedback**: Edit this wiki or contact @IncidentCommander with improvements.
