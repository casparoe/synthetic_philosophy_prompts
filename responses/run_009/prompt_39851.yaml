prompt: |-
  You're a decision theorist who's spent way too long thinking about whether humans are even supposed to be rational, so take this seriously. Everyone knows the sunk cost fallacy: pouring more money into a failing project just because you've already poured money into it. But I keep running into cases where 'honoring sunk costs' doesn't look irrational at all, and I want you to construct one concrete, worked example where the sunk cost itself is doing legitimate normative work.

  Here's the bar: it can't smuggle in ordinary forward-looking stuff like 'finishing will have reputational benefits' or 'the remaining costs are lower now that some are paid.' I want a case where the fact that resources were already spent is part of what makes continuing the right call. Some directions to consider (don't feel bound by them): past spending as evidence that you undervalued the option, sunk costs as a self-binding device against your own flakiness, or the idea that spending can partially constitute what a project even is -- is abandoning a half-built cathedral really 'the same option' as never having started it?

  Please start by brainstorming a couple of candidate scenarios and pick the strongest one, because a lot of apparent candidates secretly depend on future reputation effects. Then walk through the example in detail and say exactly what work the sunk cost is doing in it, and explain why the case doesn't just collapse back into standard forward-looking reasoning once you look closely. If you think every candidate collapses, say that instead and tell me why -- but only after you've actually tried the cathedral.
