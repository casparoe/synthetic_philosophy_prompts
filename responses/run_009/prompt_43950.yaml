prompt: |-
  Take the 1996 US welfare reform — TANF replacing AFDC, work requirements, the five-year lifetime cap on benefits, block grants to the states, plus all the "end welfare as we know it" and welfare-queen rhetoric around it — and analyze it as a re-enactment of the 1834 English Poor Law's principle of less eligibility: relief must be kept below the condition of the lowest independent laborer so that noone prefers relief to work. Do the mapping carefully: what conditionality does to a claimant's standing (contributor with an earned claim vs. supplicant who must prove worth at every interview), whether sanctions are best read as screening out the undeserving or as punishment aimed at deterrence, and what the state is signaling when it demands documented job search for what had been a federal entitlement. Then run it the other way and say what the episode does to the deservingness framework itself: is the "undeserving poor" a permanent structural category of any welfare system — with Social Security old-age benefits as the insurance-framed case that escapes the test — or a contingent political construction that 1996 could have gone either way on? Be upfront about where the less-eligibility lens goes silent instead of forcing it to speak, and flag where your reading leans on a contested claim. Also tell me what would flip your verdict — what fact about TANF or what argument would move it. End with a one-sentence summary, and the very last line should be \answer{...} containing exactly one of: confirmation, anomaly, misdescription.
