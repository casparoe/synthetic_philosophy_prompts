prompt: |-
  I've been keeping a running list of my own verdicts about when cooperation is stable in prisoner's-dilemma-type situations, and I'd like to know whether some single principle captures them or whether I'm unknowingly running several at once.

  Here are the verdicts. (1) Two traders in a village market who expect to deal with each other indefinitely, with no common-knowledge end date: cooperation is stable, and an occasional mistaken defection met with measured rather than total retaliation does not undermine it. (2) The same two traders, but with a known final transaction date that is common knowledge: I say cooperation is not stable in principle, since backward induction unravels it, yet I notice that I only expect the last few rounds to be defective rather than all of them, and I cannot defend that. (3) A one-shot anonymous donation between strangers in a large city: obviously not stable. (4) A ground squirrel that gives an alarm call at a cost to itself, in a population where its siblings are within earshot: stable, and stable for what seems to me a different reason than in (1), though I would be hard pressed to say what the difference is. (5) A one-shot donation between strangers where third parties observe the exchange and later refuse to deal with defectors: stable. (6) A one-shot, fully anonymous public-goods game among strangers in which any player may pay a cost to fine a non-contributor: here I am pulled both ways. Intuition and the experimental record say punishment sustains contributions, but my own reasoning about free riders says cooperators who decline to punish should outcompune punishers, so my tentative verdict is stable, and I do not quite believe myself. (7) A population of unrelated agents arranged on a lattice, interacting one-shot with their neighbors only: stable, I think, because cooperative clusters shield one another. (8) Cooperators who wear a visible tag and direct help only to other tag-wearers, in one-shot anonymous encounters: stable in principle, though I suspect it is stable for a cheap reason that makes me reluctant to count it. And there is one case I keep going back and forth on entirely: two firms fix prices, and a regulator credibly fines defectors so heavily that defection becomes dominated — is that cooperation achieving stability within a prisoner's dilemma, or has the game simply been changed so that it is no longer a prisoner's dilemma at all, making it a category error to say cooperation evolved there?

  I have a tentative principle of my own: cooperation is stable whenever cooperators can condition their behavior on the behavior of their partners. But it seems to count my regulator case, which I do not want it to, and it seems not to count the alarm-call case, which I do want it to, so it needs testing and repair. Please answer as a numbered list of exactly five items, each one or two sentences, with no introduction or conclusion. Items 1 and 2 should be the two most promising candidate principles, stated precisely, each with the verdict that most motivates it. Item 3 should identify which case I have not considered — for instance, extortionate strategies that coerce a partner into cooperating on the extorter's terms, or siblings whose conflict of interest is too steep for relatedness to resolve — would best discriminate between them, and what each principle predicts there. Item 4 should give your verdict on the regulator case under the principle you favor. Item 5 should state, honestly, which of my eight verdicts the better principle cannot accommodate, and why that verdict should be the one to go.
reasoning: |-
  Hmm, the user has been analyzing when cooperation is stable in Prisoner's Dilemma situations and wants to know if there's a single principle behind their verdicts. They've listed eight cases with their judgments, and they're struggling to reconcile them all with their tentative principle about conditioning behavior on partners' behavior. They want me to respond with exactly five numbered items as specified.

  Looking at their cases: (1) indefinite repeated interactions allow stable cooperation, (2) known end date causes unraveling but not immediately, (3) one-shot anonymous fails, (4) kin selection with alarm calls works, (5) third-party punishment sustains cooperation, (6) public goods with punishment is stable but user doubts it, (7) spatial structure enables cooperation, (8) tag-based cooperation works but feels "cheap." They're also unsure about the regulator case changing the game.

  The user's tentative principle (conditioning on partner behavior) seems broad but fails for kin selection (case 4) and over-includes the regulator case. I need to identify two promising principles. The first should be direct reciprocity for repeated interactions, explaining cases like 1 and 5. The second should be inclusive fitness for kin selection, covering case 4.

  For item 3, I'll suggest a new case to discriminate between these principles: extortionate strategies (like ZD strategies) where one player forces cooperation asymmetrically. Direct reciprocity predicts instability since it's exploitative, while inclusive fitness ignores it as irrelevant to kin.

  For item 4, under direct reciprocity, the regulator case isn't cooperation stability but game alteration, since the fine changes payoffs.

  For item 5, the inclusive fitness principle can't accommodate case 7 (spatial structure with unrelated agents) because clustering isn't about kin selection; here the verdict should be revised to acknowledge it's reciprocity in disguise or consider spatial reciprocity separately.

  I'll structure exactly as requested: two principles with motivating verdicts, a discriminating case with predictions, regulator verdict under favored principle, and one verdict to discard with reasoning.
answer: |-
  1.  **Direct Reciprocity**: Cooperation is stable when interactions are repeated indefinitely without a known endpoint, allowing strategies contingent on a partner's past actions (e.g., Tit-for-Tat) to enforce mutual cooperation. *Motivated by:* Stable cooperation in village traders (1), and stable cooperation via third-party observation/punishment (5).
  2.  **Inclusive Fitness**: Cooperation is stable when the actor's behavior confers reproductive benefits on genetically related individuals, weighted by relatedness, exceeding the cost to the actor. *Motivated by:* Stable cooperation in the ground squirrel alarm call for siblings (4).
  3.  **Discriminating Case**: Extortionate strategies (e.g., Zero-Determinant strategies forcing a partner to cooperate). *Direct Reciprocity* predicts instability as the coerced partner should defect given any opportunity, rejecting the unfair payoff. *Inclusive Fitness* predicts irrelevance, as extortion lacks a relatedness mechanism; stability depends solely on reciprocity dynamics.
  4.  **Regulator Verdict (Favoring Direct Reciprocity)**: The regulator case alters the payoff structure, transforming the game away from a Prisoner's Dilemma; it is not cooperation achieving stability *within* a PD.
  5.  **Verdict to Discard**: Verdict 7 (stable cooperation in spatial structure, unrelated agents) cannot be accommodated by the favored Inclusive Fitness principle, as relatedness is absent. Revise this verdict: cooperation here relies on network reciprocity (a form of conditional strategy based on neighbors' actions, aligning with Direct Reciprocity), not kin selection.
