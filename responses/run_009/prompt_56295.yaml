prompt: |-
  I want a checklist for what a norm connecting credence to objective chance has to deliver, before I argue for or against any particular one. So write the desiderata for a deference principle in the spirit of Lewis's Principal Principle: what any adequate version must do -- e.g. the admissibility clause can't just be a hand-picked list of exceptions or the norm is empty, deference must not collapse chance into credence so trivially that chance becomes redundant, it has to say something about the agent who already knows a lot of history (the more you know about the past, the less the chance of a future event seems to bind you -- decide whether handling that is a requirement or just a fact some camps deny), it should connect to why chances track frequencies, and whatever else you think belongs. Give the case behind each requirement, and mark which are non-negotiable versus which are only demanded by particular camps (Humeans insisting chance supervene on history, propensity people wanting single-case chances, etc.).

  Then the part I actually care about: tell me which subset of the desiderata is jointly unsatisfiable -- I have in mind the way full-blooded deference plus Humean supervenience plus treating history as admissible trivializes chance into credence, but flag any other tension you spot -- and say what it costs to give up each member of that subset, since that choice is where the real positions live.

  Finally, one short paragraph: how the original Principle, Lewis's later weakened version for Humeans, best-system views, and de Finetti-style "there is no chance, only your predictive symmetries" views each do against the list. Keep the weight on the criteria; the scorecard is an afterthough. No citations, just the ideas.
reasoning: |-
  We are creating a checklist of desiderata for a norm connecting credence to objective chance (a deference principle). We'll list what any adequate version must deliver, explain the case behind each, and note which are non-negotiable and which are camp-specific. Then we'll identify which subset of desiderata is jointly unsatisfiable and what it costs to give up each. Finally, we'll briefly compare how different views (Lewis's original Principal Principle, his New Principle, best-system views, and de Finetti-style views) fare against the list.

  **Checklist of Desiderata for a Deference Principle**

  1. **Non-triviality**: The norm must not collapse chance into credence so trivially that chance becomes redundant. 
     - *Case*: If the principle allows an agent's credence to be set equal to chance in a way that doesn't constrain rational belief beyond what is already required by coherence, then chance is doing no work. We need chance to be a substantive guide.
     - *Status*: Non-negotiable. Without this, the principle fails to be a deference norm.

  2. **Admissibility without Ad Hoc Exceptions**: The admissibility clause must not be a hand-picked list of exceptions. It must be principled.
     - *Case*: If we just list exceptions (e.g., "except when you know the outcome"), the norm is empty because we can always add exceptions. We need a general criterion (like Lewis's: information about the past and the chances themselves is admissible, but information about the future is not).
     - *Status*: Non-negotiable for a general theory. Ad hoc lists don't provide a rule.

  3. **Handling Knowledge of History**: The norm must handle agents who know a lot of history. Specifically, the more an agent knows about the past, the less the chance of a future event should bind them, but in a way that doesn't lead to contradictions.
     - *Case*: If an agent knows the entire history up to now, and the chance of a future event is less than 1, but the event actually happens, then the agent might have credence 1 in the event (because they know it happened) while the chance was less than 1. The principle must allow this without conflict.
     - *Status*: Non-negotiable. Any deference principle must account for the fact that knowledge of the outcome trumps chance.

  4. **Connection to Frequencies**: The principle should help explain why chances tend to track frequencies in the long run.
     - *Case*: We expect that if an event has a chance of 0.5, then in a long series of trials, the frequency should be approximately 0.5. A deference norm should underpin why we expect this (e.g., by implying that we should have high credence in the frequency being close to the chance).
     - *Status*: Widely desired, but more critical for Humeans and frequentists. Propensity theorists might take it as a consequence but not essential.

  5. **Compatibility with Chance Supervenience**: For Humeans, the principle must work with the idea that chances supervene on the entire pattern of particular events (the Humean mosaic). For non-Humeans, it must not require supervenience.
     - *Case*: Humeans hold that chance is determined by the total history. The deference norm must not require that chance is an independent metaphysical entity.
     - *Status*: Camp-specific. Non-Humeans (e.g., propensity theorists) reject supervenience and might require the norm to work without it.

  6. **Single-Case Chance Compatibility**: The principle should apply to single-case chances.
     - *Case*: Propensity theorists want chances for individual events (e.g., the chance that this particular atom decays in the next hour). The norm must not require that the event is part of a repeatable sequence.
     - *Status*: Camp-specific. Frequentists might deny single-case chances, so they might not require this.

  7. **Avoiding Incoherence (Calibration)**: The norm should help avoid Dutch books or other incoherences by ensuring that credences are calibrated to chances in the right way.
     - *Case*: If you violate the deference norm, you might be susceptible to a Dutch book or fail to be calibrated to the chances.
     - *Status*: Non-negotiable for a norm of rationality.

  8. **Time-Relativity**: The principle must account for the fact that chances are time-relative. The chance of an event at time t is relative to a time t' (typically t' ≤ t).
     - *Case*: The chance of a coin landing heads at noon might be 0.5 at 11:59, but 1 at 12:01 (if it landed heads). The norm must defer to the chance at the appropriate time.
     - *Status*: Non-negotiable.

  **Joint Unsatisfiability and Costs**

  The key tension is between:

  - **Full-blooded Deference**: The idea that one should set credence equal to chance, conditional on the chance and admissible information.
  - **Humean Supervenience**: Chance supervenes on the entire history of the world (the Humean mosaic).
  - **History as Admissible**: Treating historical information as always admissible.

  If we have these three together, we get a trivialization of chance. Why? 

  - By Humean supervenience, the chance at a time is determined by the entire history (including the future). 
  - If history is admissible, then an agent who knows the entire history (past and future) can condition on it. 
  - But then, conditional on the entire history, the chance is fixed (by supervenience), and the outcome is also fixed. So the chance of an event would have to be 0 or 1 (if it is determined by the history). But that means that the chance is always 0 or 1, which is trivial.

  *Costs of giving up each*:

  - **Give up Full-blooded Deference**: We weaken the deference principle. For example, Lewis's New Principle says to set credence equal to the chance conditional on the entire theory of chance. This avoids the triviality but is more complex and less intuitive. Cost: We lose the simple, direct link between chance and credence.

  - **Give up Humean Supervenience**: We allow that chance is not determined by the Humean mosaic. Cost: We must accept a non-Humean metaphysics (e.g., propensities, primitive chances) which might be metaphysically heavy.

  - **Give up History as Admissible**: We say that some historical information (in particular, information about the future) is not admissible. But Lewis already excludes future information. The problem is that under Humean supervenience, even past history might contain information that determines the chance (if the chance is determined by the whole pattern, then knowing a lot of past might constrain the chance). So we might need to say that only a limited part of history is admissible. Cost: It becomes tricky to define what part of history is admissible without making the principle vague or ad hoc.

  **Comparison of Views**

  - **Lewis's Original Principal Principle (PP)**:
    - Non-triviality: Yes, unless combined with Humean supervenience and history admissibility (then trivializes).
    - Admissibility: Principled (past and chance info admissible) but runs into trouble with Humean supervenience.
    - Handling knowledge of history: Allows it via admissibility (if you know the outcome, that's future and not admissible? Actually, if you know the outcome, you don't condition on chance? Clarification: PP requires conditioning on the chance hypothesis and admissible information. If you know the outcome, that might be in the admissible information? But Lewis intended that historical information is admissible, and if you know the entire history (including future), then PP would require setting credence to chance, but then if the history includes the outcome, that leads to conflict. So PP has a problem here without modification.
    - Connection to frequencies: Good, via the law of large numbers.
    - Humean supervenience compatibility: Problematic (as above).
    - Single-case: Handles it.
    - Calibration: Designed to avoid Dutch books.
    - Time-relativity: Handles it.

    *Overall*: Foundational but flawed under Humean supervenience.

  - **Lewis's New Principle (NP)**:
    - Adjusts PP to avoid triviality: Defer to the chance conditional on the entire theory of chance. This breaks the circle in Humean supervenience.
    - Admissibility: Still principled, but now the chance is conditioned on the theory.
    - Handling history: Better; knowing history doesn't directly conflict because the chance is conditioned on the theory of chance which is about the entire pattern.
    - Connection to frequencies: Maintained.
    - Humean supervenience: Now compatible.
    - Single-case: Still handles.
    - Calibration: Still good.
    - Time-relativity: Handles.

    *Overall*: Solves the triviality for Humeans but is less intuitive.

  - **Best-System Views (e.g., Lewis)**:
    - Chance is defined by the best system (simplicity, strength, fit). The deference norm is the NP (or a variant) to avoid triviality.
    - Satisfies most desiderata from a Humean perspective. Single-case chances are allowed but might be constrained by the best system. Connection to frequencies is built in (via fit). 
    - However, the admissibility of historical information is handled by conditioning on the best system.

  - **De Finetti-style (Subjectivist, No Objective Chance)**:
    - There is no objective chance; only exchangeable opinions. The "deference" is to one's own predictive rules (e.g., in symmetric situations).
    - Non-triviality: Chance is redundant (it's just credence in disguise). So fails non-triviality as an objective norm.
    - Admissibility: Not applicable (no chance to defer to).
    - Handling history: Done by conditioning on past data.
    - Connection to frequencies: Emerges via exchangeability (e.g., de Finetti's representation theorem).
    - Humean supervenience: Not relevant (no objective chance).
    - Single-case: Only credences, so yes.
    - Calibration: Avoids Dutch books via coherence, but no objective calibration.
    - Time-relativity: Handled by conditioning on current information.

    *Overall*: Rejects the need for objective chance, so fails to satisfy the desiderata that require objective chance.

  This checklist and analysis should help in evaluating candidate deference principles.
answer: |-
  ### Checklist of Desiderata for a Deference Principle  
  A norm connecting credence to objective chance (e.g., Lewis's Principal Principle) must satisfy core requirements to be adequate. Below, each desideratum is explained with its rationale, and its status is marked as **non-negotiable** (essential for any viable principle) or **camp-specific** (required by certain philosophical views).  

  1. **Non-Triviality**  
     - **Requirement**: The norm must not reduce chance to credence so trivially that chance becomes redundant. It should constrain credences in a way that adds substantive guidance beyond logical consistency.  
     - **Case**: Without this, chance loses its role as an independent guide for rational belief. For example, if the principle implies that credence *must* equal chance in all cases, chance collapses into credence, making it explanatorily empty.  
     - **Status**: **Non-negotiable**. A deference principle must ensure chance has distinct epistemic value.  

  2. **Principled Admissibility**  
     - **Requirement**: The admissibility clause (specifying which information doesn't "override" chance) must be general and principled, not a list of arbitrary exceptions.  
     - **Case**: A hand-picked list (e.g., "defer to chance unless you know the outcome") is circular and uninformative. A principled rule (e.g., "all historical information is admissible") provides a testable standard.  
     - **Status**: **Non-negotiable**. Ad hoc exceptions make the norm vacuous.  

  3. **Robustness to Knowledge of History**  
     - **Requirement**: The norm must handle agents who know extensive historical information. As knowledge of the past grows, chance’s constraint on credence about the future should weaken appropriately without contradiction.  
     - **Case**: An agent who knows the exact state of a coin before it lands shouldn’t be bound by its earlier 50% chance—they can have credence 0 or 1. The norm must allow this without assuming chance is always known.  
     - **Status**: **Non-negotiable**. Denied only by views insisting chance always dominates (e.g., some propensity theories), but this leads to contradictions if the agent knows the outcome.  

  4. **Frequency Tracking**  
     - **Requirement**: The norm should explain why chances tend to align with long-run frequencies.  
     - **Case**: If a coin has a 50% chance of heads, we expect ≈50% heads in many tosses. Deference should imply high credence in this convergence (e.g., via the law of large numbers).  
     - **Status**: **Camp-specific**. Crucial for Humeans (who ground chance in patterns) but less so for non-Humeans (e.g., propensity theorists).  

  5. **Metaphysical Neutrality/Compatibility**  
     - **Requirement**: The norm should function under different metaphysical accounts of chance (e.g., Humean supervenience, propensities).  
     - **Case**: Humeans require chance to supervene on history; propensity theorists demand single-case chances. The norm shouldn’t presuppose one view.  
     - **Status**: **Camp-specific**. Humeans insist on supervenience; propensity theorists require single-case applicability.  

  6. **Single-Case Applicability**  
     - **Requirement**: The norm must apply to unique, non-repeatable events (e.g., the chance of a specific asteroid striking Earth tomorrow).  
     - **Case**: Propensity theories treat chances as intrinsic properties of single events; deference should work here without relying on frequencies.  
     - **Status**: **Camp-specific**. Essential for propensity views; frequentists (who define chance via long-run frequencies) reject it.  

  7. **Time-Relativity**  
     - **Requirement**: The norm must account for chances being time-indexed (e.g., the chance of rain today decreases as the day passes).  
     - **Case**: Credence should defer to the most temporally appropriate chance (e.g., the chance at *t* for an event at *t*), not past or future chances.  
     - **Status**: **Non-negotiable**. Chance is inherently dynamic.  

  8. **Avoids Self-Undermining**  
     - **Requirement**: The norm must avoid "self-undermining" chances—i.e., chances assigned to hypotheses that, if true, imply those chances are incorrect.  
     - **Case**: A chance theory claiming "the chance of heads is 30%, but the true frequency is 50%" creates inconsistency if credence defers uncritically.  
     - **Status**: **Camp-specific**. Vital for Humeans (due to holistic supervenience); less critical for non-Humeans.  

  ---

  ### Tensions and Joint Unsatisfiability  
  The most critical tension involves **three desiderata that cannot all be satisfied simultaneously**:  

  - **Full-blooded deference**: Credence must rigidly align with chance, given admissible information (from desideratum 1).  
  - **Humean supervenience**: Chance supervenes entirely on the Humean mosaic (the total history of particular events; from desideratum 5, camp-specific).  
  - **History as admissible**: All historical information is admissible (a common interpretation of desideratum 3).  

  **Why they conflict**:  
  - If chance supervenes on the entire history (Humean supervenience), and all history is admissible (robustness to historical knowledge), then an agent with full historical knowledge knows the entire mosaic—including future outcomes.  
  - Full-blooded deference then forces credence to match chance, but the known history *also* fixes the outcome (e.g., credence 1 in an event that chance <1 assigns). This collapses chance into 0 or 1 values, rendering it **trivial** and **redundant** (violating desideratum 1).  

  **Costs of giving up each**:  
  - **Give up full-blooded deference**: Adopt a weaker norm (e.g., defer to chances *conditional* on the chance theory itself).  
    - *Cost*: Loss of simplicity and directness; deference becomes circular if chance is defined via credence.  
  - **Give up Humean supervenience**: Allow chance to be metaphysically independent (e.g., propensities).  
    - *Cost*: Accepts "queer" metaphysical entities (problematic for naturalists) and may struggle with frequency tracking (desideratum 4).  
  - **Give up history as admissible**: Restrict admissibility to "pure" historical info (excluding info that implies future outcomes).  
    - *Cost*: Admissibility becomes vague or context-dependent (violating desideratum 2). Also, it limits the norm’s applicability for informed agents.  

  **Other tensions**:  
  - **Single-case applicability + Frequency tracking**: Propensity theories (single-case) struggle to explain frequency convergence without additional assumptions.  
  - **Principled admissibility + Robustness to history**: A broad admissibility rule (e.g., "all non-chancy information") risks undercutting chance’s authority if it includes "future-like" historical data.  

  ---

  ### Scorecard: How Major Views Fare  
  *Assessed against the desiderata. Strengths and weaknesses are highlighted; "✓" = satisfied, "✗" = not satisfied, "∼" = partially satisfied.*  

  - **Lewis's Original Principal Principle (PP)**  
    - *Form*: Credence(*) = Chance(* | Admissible info), with history and chance facts admissible.  
    - Non-Triviality: ✗ (Fails under Humeanism: chance trivializes with full history).  
    - Principled Admissibility: ∼ (General but vague; admissibility is intuitive, not rigorously defined).  
    - Robustness to History: ∼ (Handles partial history, but full history causes collapse).  
    - Frequency Tracking: ✓ (Via law of large numbers).  
    - Metaphysical Neutrality: ✗ (Presumes non-Humeanism; clashes with supervenience).  
    - Single-Case: ✓.  
    - Time-Relativity: ✓.  
    - Avoids Self-Undermining: ✗ (Vulnerable to undermining in Humean settings).  
    - **Overall**: Foundational but unstable for Humeans.  

  - **Lewis's New Principle (NP)**  
    - *Form*: Credence(*) = Chance(* | Entire chance theory).  
    - Non-Triviality: ✓ (Avoids collapse by conditioning on chance theory).  
    - Principled Admissibility: ∼ (Replaces admissibility with chance-theory conditioning; principled but complex).  
    - Robustness to History: ✓ (Chance theory "screen off" history).  
    - Frequency Tracking: ✓.  
    - Metaphysical Neutrality: ✗ (Tailored for Humean supervenience).  
    - Single-Case: ✓.  
    - Time-Relativity: ✓.  
    - Avoids Self-Undermining: ✓ (Conditioning on chance theory resolves undermining).  
    - **Overall**: Humean-friendly fix; trades simplicity for safety.  

  - **Best-System Views (e.g., Humean reductionism)**  
    - *Form*: Chance is "best" summary of patterns (simplicity, strength, fit); deference via NP.  
    - Non-Triviality: ✓ (Chance emerges from patterns; not reducible to credence).  
    - Principled Admissibility: ∼ (Admissibility handled by NP; "best system" is principled but vague).  
    - Robustness to History: ✓ (History determines chance; full knowledge implies certainty).  
    - Frequency Tracking: ✓ (Core to "fit").  
    - Metaphysical Neutrality: ✗ (Assumes Humean supervenience).  
    - Single-Case: ✗ (Chances are system-relative, not intrinsic).  
    - Time-Relativity: ✓.  
    - Avoids Self-Undermining: ✓ (Via NP).  
    - **Overall**: Strong for frequencies and anti-triviality; weak on single-case and neutrality.  

  - **De Finetti-Style (Subjectivism)**  
    - *Form*: No objective chance; "chance" is exchangeable credence (credence invariant under sequence permutations).  
    - Non-Triviality: ✗ (Chance is credence; no objective constraint).  
    - Principled Admissibility: ✗ (No objective chance to defer to).  
    - Robustness to History: ✓ (Credence updates via conditioning).  
    - Frequency Tracking: ∼ (Convergence explained via exchangeability; no objective frequencies).  
    - Metaphysical Neutrality: ∼ (Rejects objective chance; neutral but deflationary).  
    - Single-Case: ✓ (Credences apply to single cases).  
    - Time-Relativity: ✓.  
    - Avoids Self-Undermining: ✓ (No objective chance to undermine).  
    - **Overall**: Avoids metaphysical problems but abandons objective chance.  

  ---  
  **Key Takeaway**: The core tension—deference vs. Humeanism vs. historical knowledge—forces a choice: weaken deference (e.g., NP), reject Humeanism (accept metaphysics), or restrict admissibility (invite arbitrariness). Other desiderata (e.g., single-case chances) further divide camps. The "scorecard" shows no view aces all criteria; your choice depends on which costs you prioritize.
