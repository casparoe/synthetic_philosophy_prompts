answer: |-
  ## Dialogue: The Weight of Worlds

  **Setting:** A cluttered faculty lounge, coffee mugs steaming. Deirdre and Bernard are prepping for their seminar on Everettian probability.

  **Deirdre:** Bernard, I’ve been refining that asymmetric splitter thought experiment. I think it crystallizes why branch multiplicity *can’t* rationally matter.

  **Bernard:** I’m all ears. But let me guess: you’ll argue that if multiplicity mattered, running the device in Mode B would magically make the low-weight outcome more valuable, which is absurd?

  **Deirdre:** Precisely! Imagine a payoff: $1000 if the high-weight outcome occurs, $0 otherwise. In Mode A, that’s $1000 on the 2/3 branch. In Mode B, it’s $1000 on the single 1/2 branch. The other 999 outcomes in B *all* get $0 – they correspond to the *low*-weight outcome in A. Now, if you cared about branch count, you might prefer Mode B for this bet. Suddenly, splitting the low-weight outcome into 999 branches makes you *less* likely to get the $1000? That’s perverse!

  **Bernard:** Hang on, you’re smuggling in an assumption. You assume the *only* thing distinguishing the rational value of the bet is the Born weight attached to the payoff. But if one thinks branch multiplicity is independently significant, why *shouldn’t* the agent care that in Mode B, there are vastly more futures where they see the $0 outcome? It feels like a bigger ‘loss cluster’.

  **Deirdre:** Because it’s *redundant* splitting! It’s like a classical coin flip implemented with a thousand identical, independent sub-flips, all rigged to land the same way. Betting on heads shouldn’t care if it’s one flip or a thousand redundant flips. The *physical fact* the bet depends on – heads or tails – is unchanged.

  **Bernard:** There’s the rub, Deirdre. Your analogy assumes the *physical fact* the bet depends on is solely the amplitude-measured outcome – the ‘high-weight’ or ‘low-weight’ result. But in the Everettian picture, there *is no single physical fact* of "which outcome occurs" in the classical sense. All occur. What the agent is *really* betting on is the subjective experience of their future selves. And if I believe that each distinct, subjectively real future self ‘counts’, why *shouldn’t* I care how many of them see the bad outcome? The ‘redundancy’ *is* the multiplicity of experiencing selves! You dismiss it as mere description, but from the first-person perspective of the agent *now*, worrying about their future experience, the number of distinct, unhappy future selves seems relevant.

  **Deirdre:** But Bernard, you conceded branch count is ill-defined! Decoherence is a matter of degree. The ‘999 branches’ in Mode B aren’t fundamentally distinct ontological atoms; they’re a coarse-graining choice. I could design a Mode C that partially re-coheres some of those 999, making it look like 500 branches. Should the rational betting odds shift again based on knob-twiddling on the *display mechanism*? That’s absurd! Rational preferences should be invariant under mere re-description of the same underlying quantum reality.

  **Bernard:** I agree branch *count* as a fundamental ontology is nonsense. But ill-defined doesn’t mean irrelevant *for subjective anticipation*. Maybe it’s not about counting fundamental ‘worlds’ but about the *robustness* or *predictive stability* of the outcome experience. In Mode B, the low-weight outcome manifests as 999 distinct, decohered experiences. That feels like a more ‘spread out’ or ‘fragile’ loss state than the single 1/3 branch in Mode A. Perhaps caring about multiplicity proxies for caring about the stability of the outcome against slight variations. The Born weight might *correlate* with this, but your axioms *demand* we ignore the multiplicity entirely, treating the thousand-fold fragmented loss identically to the single loss. That’s the leap I find unmotivated.

  **Deirdre:** Okay, let’s test that stability idea. Suppose we slightly perturb the device in Mode B, introducing tiny couplings between those 999 ‘fragments’. Not enough to significantly change the *amplitudes* – the total weight for ‘low’ is still ~1/2 – but enough to partially entangle them, reducing the effective number of distinct subjectively accessible outcomes to, say, 10 coherent bundles. Does the rational value of the bet change? According to your ‘stability’ view, it might – fewer distinct unhappy futures might make the loss ‘feel’ less severe? But the underlying quantum state relevant to the payoff has barely changed! Only our description of the decoherence has shifted. Preferences *cannot* rationally depend on that.

  **Bernard:** (Pauses, sips coffee) That stings. You’re right, if the perturbation doesn’t change the amplitudes significantly, and my ‘stability’ metric wiggles with decoherence details… that seems arbitrary and unstable *itself*. Fine. Concession: Basing value *directly* on some measure of branch multiplicity or distinctness, given its sensitivity to decoherence vagaries, is probably untenable as a fundamental principle. It leads to preference volatility under irrelevant changes.

  **Deirdre:** Thank you. So, we agree that any sensible rationality constraint must involve invariance under re-description of the branching structure that preserves the amplitude distribution?

  **Bernard:** I’ll grant that *some* form of re-description invariance is plausible to avoid absurd volatility. But I don’t grant that it *must* be the specific, strong form captured by your dominance axiom – the one that says if two future branches have the *same amplitude* and lead to the *same outcomes* for the agent, then the agent is indifferent to how many sub-branches constitute them. That’s the axiom that *directly* forbids caring about the 999 vs. 1 split in the asymmetric splitter’s low-weight outcome. And that axiom seems tailor-made *for* the Born rule.

  **Deirdre:** It’s not tailor-made! It flows naturally from the idea that what matters is the *state* the agent finds themselves in, and the resources they have there. The *path* to that state – how finely grained the branching was – shouldn’t matter if the end result is identical. Like not caring how many gears are in a clock if it tells the correct time.

  **Bernard:** But in Everett, the ‘path’ *is* the multiplication of experiencing selves! When a branch splits finely, there *are* more instances of ‘me’ experiencing the outcome, even if those instances are qualitatively identical. Why shouldn’t a current self, contemplating future suffering distributed across a thousand copies, value that outcome differently than suffering confined to one copy, even if the amplitude is the same? The *experience* might be identical in each branch, but the *extent* of the suffering across the multiverse seems greater. Your axiom simply *asserts* that this extent is irrelevant. It doesn’t derive it; it presupposes that only the amplitude-weighted expectation matters.

  **Deirdre:** And your alternative? If we reject that axiom, what *do* we put in its place? How do we quantify this ‘extent’? You shot down branch count. You shot down ‘stability’ proxies. What non-arbitrary measure tells me how much to care about a future qualitatively identical self, besides the amplitude with which it’s realized?

  **Bernard:** That’s the problem, Deirdre! Perhaps there *is* no non-arbitrary way. Maybe rational agents *could* adopt different ‘caring measures’ – perhaps even ones proportional to multiplicity if it were well-defined. But it’s not. The Born weights, however, *are* well-defined and play a fundamental dynamical role – they govern interference patterns, the rate of branching, everything! They have empirical traction. So, pragmatically, using them as caring weights makes sense. But your Deutsch-Wallace program claims to *derive* that rational agents *must* care proportionally to amplitude, from supposedly self-evident axioms. I say the key axiom – indifference to redundant branching – isn’t self-evident. It’s justified *because* it gives us the empirically successful Born rule. It’s bootstrapping.

  **Deirdre:** It’s not *just* bootstrapping. The axioms capture what it means to have consistent preferences across branching events. Additivity: if I prefer A over B regardless of what happens in some other branch, I should prefer it overall. Continuity: small changes in amplitudes lead to small changes in preference. Dominance: if one option gives better outcomes on every branch, it’s preferred. And yes, Indifference: re-describing the same branching structure shouldn’t matter. *Given* quantum mechanics and its branching structure, these principles constrain the caring weights to be *some* function of the amplitude. The dynamics *then* forces it to be the Born rule squared.

  **Bernard:** But the Indifference axiom is doing the heavy lifting! It’s the one that explicitly blocks multiplicity-based measures and forces the weights to depend *only* on amplitude. Without it, the other axioms might be satisfied by other functions – maybe multiplicity *times* amplitude, if multiplicity were definable! But since it’s not, Born is the only game in town that fits. My point is: the axioms aren’t pure rationality. Indifference is a *physical* postulate about how agents should relate to the structure of quantum reality. It’s reasonable, perhaps, given the physics, but it’s not a *logical* requirement of rationality divorced from quantum mechanics. You’re sneaking the physical significance of the amplitude measure into the rationality axioms.

  **Deirdre:** (Nods slowly) Okay. Concession: Perhaps the indifference axiom isn’t *logically* self-evident like avoiding dominated strategies. It *is* motivated by understanding how quantum branching actually works – the redundancy is physical, not just descriptive, but it’s a *specific kind* of physical redundancy encoded in the amplitudes. The axiom captures the idea that this quantum redundancy shouldn’t affect value. It’s normative bedrock *for agents embedded in Everettian quantum reality*.

  **Bernard:** Exactly! And that’s my core objection. It’s not a derivation of probability *from* pure rationality plus determinism. It’s a derivation that assumes agents should treat the amplitude measure as the *measure of caring* from the outset, via the indifference axiom. You’re using the physics to justify the rationality norm. It’s circular in the sense that the norm is chosen *because* it fits the physics we already accept.

  **Deirdre:** But Bernard, what’s the alternative? If we don’t tie rationality to the actual structure of the physics we’re in – including the amplitude measure that governs the branching we experience – what *do* we tie it to? Abstract branch counting we agree is ill-defined? Your pragmatic point about Born weights having empirical traction is valid, but it doesn’t give a *rational foundation* for probability in the *personal* sense, for how much *I* should care about *my* future selves. The decision-theoretic approach *tries* to bridge that gap by showing how rational self-concern, applied to branching, leads to caring by the Born weight. The indifference axiom is the bridge plank.

  **Bernard:** And I’m saying that plank rests on the very river it’s trying to cross. You find it reasonable because you see the amplitude as fundamental. I see it as assuming the conclusion. So, here’s where we end: We agree branch count is nonsense. We agree Born weights are empirically crucial. We agree that rationality demands *some* re-description invariance to avoid absurd volatility. But we disagree fundamentally on whether the **Indifference to Redundant Branching Axiom** – the one demanding that qualitatively identical future states with the same amplitude warrant identical care, regardless of how many branches constitute them – is a genuine requirement of rationality, or a physics-motivated postulate that presupposes the significance of the amplitude measure for subjective anticipation.

  **Deirdre:** Precisely. For me, it’s the minimal, natural constraint that respects the quantum structure and avoids absurdity. For you, it’s the point where the physics smuggles in the answer disguised as rationality.

  **Bernard:** (Raises mug) To the single axiom that splits *us*.

  **Deirdre:** (Clinks mug) May our graduate students enjoy dissecting it.
