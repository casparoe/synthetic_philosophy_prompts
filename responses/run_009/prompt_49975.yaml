answer: |-
  Here’s a comprehensive exam question, model answer, and marking scheme designed to tackle the core issue of maxim description and moral substance in Kant’s FUL.

  ---

  ### **Final Exam Essay Question (90 Minutes)**
  > "Kant’s Formula of Universal Law (FUL) is empty because any maxim can be redescribed to pass or fail the universalizability test. The procedure merely codifies our prior moral intuitions; it does no independent justificatory work."  
  >   
  > Evaluate this critique. In your response:  
  > (1) Explain how the FUL test operates, including the distinction between contradictions in conception and contradictions in the will.  
  > (2) Analyze whether the agent’s *purposes* (e.g., in false promising or refusing aid) determine the test’s outcome in a question-begging way.  
  > (3) Assess the role of the "practical-contradiction" interpretation of the test in responding to this challenge.  
  > (4) Conclude by defending whether Kant’s apparatus can *objectively constrain* maxim descriptions or inevitably relies on moral intuition.  

  ---

  ### **Model Answer (600 words)**  
  Kant’s Formula of Universal Law (FUL) requires agents to act only on maxims they can simultaneously will as universal laws. A maxim fails if its universalization generates a contradiction—either in conception (the maxim becomes *impossible* to enact in a world where all follow it) or in the will (universalization undermines the agent’s *rational ends*, making it *unwillable*). For example, universalizing "lie to escape debt" collapses trust in promises (contradiction in conception), while universalizing "never help others" destroys reciprocity needed for one’s own ends (contradiction in the will).  

  The critique claims that maxims can be strategically described to guarantee pass/fail outcomes. Consider false promising: if framed as "break promises when convenient," it fails, but if phrased as "secure loans to feed my family," it might seem to pass. This suggests FUL merely "launders" preexisting judgments. However, this misrepresents Kant’s requirements. A maxim must include:  
  - **The action** (e.g., making a false promise),  
  - **The circumstances** (e.g., needing money),  
  - **The purpose** (e.g., securing a loan without repayment).  
  Kant insists the purpose is *internal* to the maxim (*Groundwork* 4:423). Omitting it (e.g., describing false promising as "uttering words I don’t mean") strips the act of its intentional context, producing a meaningless abstraction. The purpose is not an arbitrary add-on but *defines the action as a rational choice*.  

  Here, the agent’s purposes *do* shape the test—but not circularly. The FUL examines whether the purpose *can be coherently universalized given human rational agency*. In false promising, the purpose *requires* the institution of promising to exist, yet universalizing the maxim destroys that institution. The contradiction arises not from moral prejudice but from the *structural incompatibility* between the purpose and the conditions of its universal attainment. The work is done by practical reason, not intuition: the agent’s purpose generates a *practical contradiction* when universalized, revealing that the maxim exploits a social practice it simultaneously negates.  

  The practical-contradiction reading is essential here. It shows that immoral maxims are not merely "inconvenient" if universalized; they make the agent’s own project *self-defeating* in a world of universal compliance. This moves beyond logical inconsistency (e.g., "everyone wears hats" is universalizable but trivial) to expose *volitional* incoherence. The test thus has normative bite: it evaluates whether an agent can rationally *will* their purpose under universalization, given the empirical realities of human interdependence (e.g., needing trust for loans).  

  Kant’s constraints on maxim description are implicit but robust. A maxim must:  
  - Reflect a genuine *rational intention* (not a physical event),  
  - Include the agent’s purpose as integral to the action,  
  - Avoid ad hoc qualifications that evade the test’s spirit (*Groundwork* 4:424n).  
  While intuitions might guide initial maxim formulation, the test *independently* invalidates non-universalizable purposes through inherent contradictions. The critique succeeds in highlighting the risk of maxim-tailoring but fails by ignoring Kant’s embedded safeguards against it. FUL does genuine moral work by exposing the non-negotiable requirements of *consistent rational willing*.  

  ---

  ### **Marking Scheme**  
  **A Answer (Excellent)**  
  - [✓] **Clearly distinguishes** contradictions in conception vs. will, using concrete examples.  
  - [✓] **Directly confronts the "purpose" worry**: Explains why purposes are *necessary* to maxims (not question-begging) and how they generate contradictions via *self-defeat* (e.g., false promising undermines the trust it requires).  
  - [✓] **Articulates practical-contradiction reading**: Shows how it reveals *volitional incoherence* (not just logical impossibility) and ties this to human rationality/needs.  
  - [✓] **Identifies Kant’s constraints on maxims**: Purpose-inclusion, non-evasion, and rational agency as fixed points.  
  - [✓] **Conclusion**: Defends FUL’s objectivity by grounding constraints in the structure of rational willing.  

  **B Answer (Good but Limited)**  
  - [✓] Correctly explains FUL mechanics and contradiction types.  
  - [✓] **Acknowledges the "purpose" worry** but does not fully resolve it (e.g., notes purposes matter but doesn’t show *how* they avoid circularity).  
  - [✓] **Mentions practical-contradiction** but does not elaborate its role in answering the critique.  
  - [✓] **States** that maxims must be "sincerely described" but lacks analysis of *principled* constraints.  
  - [✓] **Conclusion**: Claims FUL has substance but relies on vague appeals to "rationality" without engaging self-defeat.  

  **C Answer (Adequate)**  
  - Describes FUL superficially (e.g., "if everyone did it, chaos").  
  - Treats purposes as morally loaded inputs without analysis.  
  - Omits or misrepresents practical-contradiction.  
  - Repeats the critique without substantive rebuttal.  

  **Key Differentiator**: A answers **prove purposes are non-arbitrary** by showing how they create *self-undermining* in universalization. B answers note the purpose’s role but leave circularity unresolved.  

  --- 

  This question forces students beyond rote Kantianism by targeting the maxim-description problem head-on. The model answer and rubric explicitly reward engagement with the practical-contradiction interpretation and the non-circular role of purposes—the crux of your debate with your friend.
