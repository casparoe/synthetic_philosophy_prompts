  First, I need to confirm their distinction is valid. The technical solution exists: successor-state axioms and circumscription handle the frame axioms efficiently. But the relevance problem—deciding what's important—is separate. Did McCarthy and Hayes see this deeper issue? From what I recall, Hayes did address the qualification problem later, which ties into relevance. So maybe the user's right that it's a borrowed term, but the roots might be there from the start.

