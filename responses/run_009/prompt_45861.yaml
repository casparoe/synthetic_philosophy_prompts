  I should also consider the ramifications problem—side effects of actions. That's still tricky even with successor-state axioms. And qualifications—exceptions to rules. Both are unsolved in a general sense. So maybe the technical/logical side isn't entirely closed. The user mentions these as facets of the same issue, which seems right.

  The user's third point is about modern AI. Systems like AlphaZero act without explicit frames. They don't reason symbolically; they use pattern recognition. So they bypass the frame problem technically but rely on training data for relevance. That doesn't solve the philosophical issue—it's a workaround. The problem is deferred to data selection and environment design. So success in these systems doesn't mean the relevance problem is solved; it's handled differently.

  The user's borrowed-name hypothesis holds up. Philosophers use "frame problem" for the relevance issue, leveraging the technical term's weight. Enthusiasts might claim neural nets solve it, skeptics say they don't, but both are talking past the original definition. The key is clarifying terminology: technical vs. epistemological.

  Finally, the user asks if the relevance problem is universal. Humans use heuristics, attention, emotions—fast, subconscious filters. So it's a challenge for any system, but solved differently. Symbolic AI struggles explicitly; neural nets learn implicitly; humans use cognition. The problem's nature varies by architecture.

  I should wrap up by affirming their distinction, noting the nuances in technical solutions, and explaining how modern AI avoids the original issue but not the underlying relevance challenge. Their hypothesis about the term's usage is spot-on—it's a rhetorical tool in debates about AI's viability.
answer: |-
  Your analysis is remarkably sharp and aligns well with current scholarly consensus. The distinction you draw is valid and necessary, though the boundaries are nuanced. Let's break this down:

  ### 1. **The Solved vs. Unsolved Distinction (and McCarthy/Hayes' Intent)**
     - **Technical Frame Problem (Solved):** You're correct that the *logical bookkeeping* issue (avoiding explicit frame axioms) is largely resolved. Successor-state axioms (Reiter, 1991), circumscription (McCarthy, 1986), and fluent calculus (Thielscher, 1999) elegantly minimize what must be specified. This is a victory for formal engineering.
     - **Relevance Problem (Unsolved):** McCarthy and Hayes *did* glimpse this deeper issue. In "Some Philosophical Problems from the Standpoint of AI" (1969), they explicitly worried about the "ramification problem" (indirect consequences of actions) and the "qualification problem" (exceptions to effects). While these are technical challenges for logic-based systems, they point to the epistemological abyss: **how to ignore the infinite irrelevant consequences of an action**. Hayes later conceded this was the "real" frame problem. Your view that these are facets of relevance is correct—not sloppy.

     **Where they shade together:** The technical solutions *presuppose* a fixed, finite set of fluents (properties that change). But determining *which fluents are even relevant* to model for a given task is itself a relevance judgment. This is where the logical problem leaks into the epistemological one.

  ### 2. **Is the Relevance Problem Universal?**
     - **Yes, it's universal:** Any intelligent system operating in a complex world faces a relevance bottleneck. Humans don't enumerate logical consequences, but we still face **computational irreducibility** in decision-making. Consider:
       - **Human cognition:** We use heuristics (fast-and-frugal), emotions (rapid salience filters), attentional mechanisms, and embodied/enactive cognition (engaging the world to reduce internal computation). These aren't proofs against irrelevance—they're *adaptations* to manage it. Dennett's "robot" allegory captures this: even biological intelligence risks combinatorial explosion without efficient filtering.
       - **Architectural mitigation ≠ solution:** Dreyfus was partly right: symbolic AI *exacerbates* the relevance problem by forcing explicit representation. But connectionist/dynamic systems (or human brains) don't "solve" relevance—they **bypass explicit inference** using pattern recognition, statistical learning, or embodied coupling. The problem persists as a *computational constraint*, not just a symbolic one. Dreyfus's critique is stronger if framed as: "Symbolic architectures make the relevance problem intractable by demanding explicit justification."

  ### 3. **Modern Learning Systems & the Frame Problem**
     Your assessment here is astute. Modern AI (deep RL, transformers) doesn't "solve" the philosophical frame problem—it **sidesteps the logical version and inherits relevance**:
     - **No explicit frames:** Systems like AlphaZero or LLMs don't use axioms; they learn state transitions and action policies implicitly via data/experience. Relevance is handled statistically: frequent co-occurrences or high-probability outcomes dominate attention.
     - **Inherited relevance:** The training distribution (data + reward function) *implicitly encodes* what's relevant. An RL agent in a simulated environment only "cares" about features correlated with reward. This is efficient but brittle:
       - **Tractability, not principle:** Scaling to complex environments (e.g., open-world robotics) still requires massive data/compute because relevance isn't *fundamentally* resolved—it's outsourced to the data pipeline.
       - **No general solution:** These systems excel when training/test distributions align but fail catastrophically with novel irrelevancies (e.g., an autonomous car ignoring a "decorative" stop sign). They inherit biases and blind spots from training, making them vulnerable to adversarial irrelevance.
     - **The borrowed-name trap:** Success here *does not* solve the philosophical frame problem. It shows that **explicit symbolic inference isn't necessary for competence**, but relevance is still handled empirically and approximately. Claiming "solved" confuses engineering success with epistemological closure.

  ### What Your Hypothesis Misses (and Refines)
  - **Nuance in "solved" technical problems:** Ramification/qualification issues remain *partially open* for dynamic domains. While successor-state axioms handle *known* fluents well, automatically identifying *new relevant properties* in open-ended environments (e.g., lifelong learning agents) is unsolved.
  - **Dreyfus's deeper point:** He argued that *all* representation-based AI faces the frame problem, not just logicist AI. Modern neural nets *are* representational (activations encode features), so they still confront relevance—it just manifests as "attention allocation" or "catastrophic forgetting" rather than axiom explosion.
  - **The role of embodiment/world interaction:** Your hypothesis focuses on representation, but enactive approaches (Brooks, Pfeifer) argue that *offloading* relevance to the environment (via perception-action loops) reduces internal computation. This is a third path beyond symbolism or connectionism.

  ### Conclusion
  Your "borrowed-name" hypothesis is largely correct: **the term "frame problem" now serves as a rhetorical bridge between a solved technical issue and an unsolved epistemological one.** Philosophers use it to question the scalability of computational cognition; AI engineers use it to showcase formal ingenuity. Modern learning systems evade the *logical* frame problem but not the *relevance* problem—they manage it through data-driven approximation, not principled resolution. The deeper issue remains: **how to achieve robust, generalizable relevance filtering in resource-bounded systems interacting with an open world.** This is as much a challenge for neuroscience as for AI. Your distinction isn't too clean—it's essential for cutting through decades of interdisciplinary conflation.
