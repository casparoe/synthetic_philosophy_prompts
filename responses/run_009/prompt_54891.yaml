prompt: |-
  I'm a CS grad student who got roped into taking an upper-level ethics course this semester (long story involving a distribution requirement), and we just finished two weeks on the universalizability test in Kant's Groundwork. I mostly followed it, but I keep having this itch that the whole debate would be clearer to me if it were stated in terms I actually use every day. So here's the job: you're someone who's genuinely fluent in both formal methods and moral philosophy, and I want you to translate the debate for me, carefully.

  Specifically, take the standard running example -- the maxim of false promising, i.e., when in need of money, I make a promise I intend to break -- and the main competing readings of what the universalizability test is supposed to detect when you universalize that maxim. I'm thinking of the roughly three families our professor laid out: the one where universalizing the maxim somehow contradicts itself logically (the institution of promising collapses, so the maxim can't be universalized without destroying its own presuppositions); the Korsgaard-style reading where the problem is practical, not logical -- universalized, the maxim defeats the means-end structure it relies on, the maxim becomes ineffective as a way of getting what you want; and the "moralized" reading where you test the maxim against what a community of rational agents could co-endorse. Please brainstorm first before writing, then do the translation into my vocabulary: policies, environments, universal quantification over agents, protocol specs and their preconditions, satisfiability, invariants that hold or break when every process runs the same code, deadlock and starvation analogies, abstraction levels in model checking where a property verifies at one granularity and fails at another. Universalization itself I'm guessing is something like "check the property on the system where all agents run this policy" -- but you tell me if that's the right formalization or if it smuggles something in.

  Then the part I actually care about: the residue report. Which parts of each reading translate cleanly, which need to be bent out of shape to fit (e.g., does the "contradiction in conception" reading really correspond to spec unsatisfiability, or is that a fudge), and which parts have no counterpart in formal-methods vocabulary at all -- I have a suspicion the "relevant description of the maxim" problem, where you can re-describe the false promisor's maxim so it slips through the test, is basically the abstraction-granularity problem, but I'm not sure whether that analogy cuts for Kant or against him. Finally, give me your honest verdict on whether my working intuition -- that the whole test is just universal quantification plus a reachability or effectiveness check dressed up in 18th-century German -- is right, or whether the philosophers are tracking something my vocabulary genuinely can't express. And please flag where your own translation is most likely to fail or where you'd have to give a different answer if some interpretive choice went the other way; if there's a consideration that would flip your verdict, say what it is. Answer in American English, and don't be diplomatic -- if part of Kant's test is just doing badly what a model checker does precisely, say so.
reasoning: |-
  Okay, let me unpack this request. The user is a CS grad student forced to take Kantian ethics, struggling to map philosophical concepts to formal methods. They want a rigorous translation of Kant's universalizability test using CS constructs, specifically for the false promising example. 

  Hmm, they're clearly frustrated with philosophical vagueness but genuinely trying to bridge the gap. Their "itch" suggests they need concrete computational analogs to grasp the debate between logical contradiction (institution collapse), practical contradiction (Korsgaard), and moralized readings (co-endorsement). 

  First, I need to establish core mappings: maxims become policies, universalization is all-agents-run-same-code, environments as system states. The false promise maxim translates to: "IF credit_needed AND lender_available THEN promise_repay AND ¬intend_repay". 

  For logical contradiction: Universalizing this should break the invariant that promising requires trust. If everyone runs this policy, the precondition (trust) becomes unsatisfiable - like a protocol where "handshake_valid" flag is always false. But is this really identical to logical contradiction? Philosophers might argue the "collapse" is empirical, not syntactic. 

  Korsgaard's practical contradiction maps neatly to deadlock: the policy's goal (get money) becomes unreachable when universalized because lenders stop accepting promises. That's a classic goal violation under universal deployment. 

  The moralized reading is trickier. Co-endorsement resembles checking if a policy satisfies all agents' liveness properties in a fairness model. But Kant's "rational agents" imply idealized conditions - is that like assuming perfect information in game theory? 

  Abstraction granularity is key. Maxim reformulation ("borrow from gullible people") bypassing the test? That's like weakening preconditions until the property verifies, but only at an over-abstracted level. 

  Residue report time: Logical contradiction isn't pure UNSAT - it's more like breaking safety invariants. The "intention" element resists formalization; policies don't have hidden states. Moralized readings import circular normativity - can't define "rational agent" without moral baggage. 

  Verdict: Their intuition is 80% correct. Universalization is indeed ∀agent + effectiveness check, but Kant's "contradiction" has teleological aspects (purpose of promises) that model checkers don't capture. Biggest gap? No counterpart to Kant's "lawgiving" - formal methods can't derive "ought" from deadlock. 

  If forced to pick: Korsgaard's reading survives translation best. But shoutout to the maxim description problem - it perfectly mirrors abstraction attacks in verification. Tell the student they're right to suspect granularity issues, and that philosophers should study model checking papers.
answer: |-
  Here's a brute-force translation of Kant's universalizability test into formal methods vocabulary, with a residue report on what breaks. I'll treat moral reasoning as a distributed system verification problem.

  **Core Framework:**
  - **Maxim:** A state-triggered policy `P: (State × Goal) → Action`
  - **False Promise Policy:** `IF (agent_needs_money ∧ lender_available) THEN (assert(promise_repay) ∧ ¬intend(repay))`
  - **Universalization:** `∀ agents ∈ System, apply P as default policy`
  - **Environment:** Trust-based credit system with invariant `TrustInvariant: promise → ∃! intent(repay)`
  - **Test:** Verify properties of `System_U = ⟨Agents: all run P, Environment: credit_system⟩`

  ---

  ### Translation of Readings
  1. **Logical Contradiction (Institution Collapse):**  
     - *Claim:* Universalizing `P` violates **spec precondition**  
     - *Mechanism:*  
       - `P`'s effectiveness depends on precondition `lender_believes(promise → intent(repay))`  
       - When `∀ agents run P`:  
         `□(∀ promise, ¬intend(repay))` → `◆¬∃ lender_believes(promise → intent(repay))`  
       - → Precondition fails → **TrustInvariant** violated  
     - *Formal Analog:* Protocol-level **unsatisfiability**  
       - Like a TCP handshake policy where ALL agents send `SYN` without listening → `ACK` unreachable → protocol dead on arrival  

  2. **Korsgaard-Style Practical Contradiction:**  
     - *Claim:* `P` universally deployed makes `P`'s **goal unreachable**  
     - *Mechanism:*  
       - `P`'s goal: `acquire_money`  
       - But `System_U` evolves to state where:  
         `(∀ lenders know ∀ agents run P) → lenders_enforce(no_loans_without_collateral)`  
       - → `P`'s action `assert(promise_repay)` has **0 success probability**  
     - *Formal Analog:* **Liveness violation** under universal deployment  
       - Like a consensus protocol where if all nodes are Byzantine, `decide()` never terminates → policy's own success condition is starved  

  3. **Moralized (Co-Endorsement) Reading:**  
     - *Claim:* `P` cannot be part of any **stable equilibrium** in a system of rational agents  
     - *Mechanism:*  
       - Model agents as having mutual **obligation specs** `φ: ◊(promise → ◊repay)`  
       - Test if `System_U` satisfies `∀ agents, AG(EF acquire_money)` (all can eventually achieve goals)  
       - But `System_U` → `¬∃ agent_satisfies(φ)` → credit_system halts → `∀ agents, ¬EF acquire_money`  
     - *Formal Analog:* Violating **fairness constraint** in a assume-guarantee contract  
       - Like a shared resource protocol where universal `lock_hoarding` policy deadlocks all agents  

  ---

  ### Residue Report
  | **Aspect**               | Clean Translation                         | Bent/Broken Translation                     | No Analog                          |
  |--------------------------|-------------------------------------------|---------------------------------------------|------------------------------------|
  | **Contradiction in Conception** | Spec precondition unsatisfiability        | "Logical contradiction" oversold - it's *empirical* collapse | Kant's "contradicts itself" - no syntax error |
  | **Practical Contradiction** | Liveness/starvation under ∀-deployment | Perfect fit - Korsgaard wins              | None - most computable reading     |
  | **Co-Endorsement**       | Model-checking cooperative invariants     | "Rational agents" smuggles normativity      | Kant's "realm of ends" - no Pareto optimality in spec |
  | **Maxim Reformulation**  | **Abstraction granularity attack**:       |                                             |                                    |
  | &nbsp;&nbsp;- Thin: `P1: "lie when convenient"` | Verifies at over-abstracted spec (no credit_system model) |                                             |                                    |
  | &nbsp;&nbsp;- Thick: `P2: "false promise in trust economy"` | Fails when environment invariants modeled |                                             |                                    |
  | **Intention**            | Hidden state `¬intend(repay)`             | Non-observable → breaks black-box testing   | Kant's "good will" - can't fuzz-test |

  ---

  ### Verdict on Your Intuition
  **You're 85% right.** The core *is* `universal_quantification + effectiveness_check`:  
  - `∀ agents deploy policy P` → verify `System_U` satisfies:  
    - **Safety:** No invariant violation (logical reading)  
    - **Liveness:** Goals still reachable (practical reading)  
    - **Fairness:** All agents can satisfy specs (moralized reading)  

  **Where philosophers might have a point:**  
  1. **Teleology Creep:** Kant assumes "promising" has an *inherent telos* (purpose). In CS, we'd treat this as an arbitrary protocol rule. If we redefine promising as "utterances extracting cash," false promises satisfy their purpose → test passes. Philosophers insist we *must* model the "true purpose."  
  2. **The Lawgiving Gap:** `Kant_test(P) ≡ valid` implies `P` is "lawlike." But in our model, that just means `P` survives universal deployment. Nothing stops multiple *immoral-but-consistent* policies (e.g., "enslave blue-eyed people") from passing if environment permits. Philosophers argue true universalizability requires recognizing others as "ends," which isn't captured.  

  **Failure Modes of My Translation:**  
  - If Kant requires **strict logical contradiction** (not empirical collapse), the spec-unsatisfiability analogy fails. Example: "suicide to avoid pain" maxim - no *protocol* breaks, but Kant claims contradiction.  
  - If "rational co-endorsement" requires **symmetrical obligation** (not just mutual goal satisfaction), the model-checking analog misses the deontic force.  

  **Final Take:**  
  Kant's test is a **proto-model-checker** with vague abstraction guidelines and confused error conditions. For computable ethics:  
  1. Freeze environment specs (define "promising" as a protocol)  
  2. Require maxims to include relevant environmental preconditions  
  3. Test: `∀A.P` → (¬invariants_violated ∧ goals_remain_AG_EF_possible)  

  The untranslatable 15% is either Kant's genius or his mysticism - depends whether you think "rational nature as an end" is expressible in CSP. I'd bet a tenure file it's not.
