  Jurisdictional question: who gets to decide on formalization? Stratigraphers, earth system scientists, or humanities scholars? This involves philosophy of science (demarcation, expertise) and governance (legitimacy). It's upstream because who decides shapes the answers to other questions. It's tractable with philosophical methods (case studies, epistemology) and historical analysis of similar debates. Neglected? Yes, compared to definitional fights. Stakes: formalization might be symbolic for policy, but the jurisdictional struggle affects credibility and resource allocation.

  Normative question: whether formalization helps or harms environmental politics. Important but well-trodden—eco-modernists vs. critics. Many scholars in political ecology and environmental humanities are on this. Overrated? The user questions if formalization actually impacts policy. Seems symbolic; the term's use in policy might not hinge on geological ratification. So while relevant, it might not need three years of dedicated study.

  Metaphysical question: monistic vs. pluralistic interpretations. Is the debate about one reality or multiple valid classifications? This is deeply philosophical and upstream—it frames how other questions are approached. Tractability: yes, using conceptual analysis, historical parallels (e.g., species classification debates). Neglected? Absolutely. Most discussions assume a monistic frame, but pluralism could dissolve false binaries. Stakes: high for shifting the debate's structure, but abstract—may not directly change policy.

  Prioritizing: Jurisdictional (#2) and Metaphysical (#4) questions stand out. They're foundational, tractable, and neglected. Jurisdictional is more concrete, linking to governance; metaphysical reframes the entire discourse. Both require time for deep interdisciplinary work. 

  Overrated stakes: Formal geological ratification's direct policy impact is probably symbolic. The term's use in law/policy is already decoupled from stratigraphy. 

