prompt: |-
  I'm a senior backend engineer at a mid-sized company with no philosophy background, and lately I've noticed that a lot of the friction in my working life has the same underlying shape: two teams can each either invest a sprint in the shared foundation — the flaky integration suite, the on-call runbooks, the migration tooling nobody owns — or free-ride and race ahead on features, and whoever free-rides looks better at review time even though everyone ends up worse off when both do it. There's no referee and no way to sign binding agreements about any of this. A friend pointed me at Hofstadter's idea of superrationality: roughly, that when two agents face a symmetric choice and will reason their way to the same conclusion, each should treat their own choice as if made for both — cooperate because your defection "predicts" theirs, even though it doesn't cause it. The idea appeals to me because it seems to make cooperation rational without communication or enforcement, but I can equally see it becoming a sophisticated way of talking yourself into being the sucker while the other team optimizes for something else entirely.

  What I want is not the philosophy but a decision procedure I can actually run when one of these recurring conflicts comes up — something that tells me, step by step, whether superrational cooperation genuinely applies or whether I should just defect, or whether the case is really an ordinary repeated-game situation where I should cooperate for reputational reasons and the superrationality framing adds nothing. The procedure needs to force the checks I'd otherwise skip: whether the situation is truly symmetric or only looks symmetric from my side; whether the counterpart is plausibly running a decision procedure similar enough to mine for the "we'll reason identically" premise to hold, versus pursuing an unrelated objective; whether our choices are correlated in the way the argument requires or causally independent; whether repetition, visibility, or the ability to publicly precommit changes the verdict; and what to do when the symmetry is real but the stakes are wildly unequal. It should say what counts as a sufficient answer at each step, where it halts with a clear "don't apply this here," and it should be honest about which steps are judgment calls dressed up as checks.

  Then run the procedure on three cases: (a) my team and a peer team each deciding, independently and without coordination, whether to write candid postmortems that admit our own mistakes or defensive ones that shift blame; (b) me deciding whether to spend a weekend improving a shared library when the other team that depends on it has a consistent history of free-riding; and (c) a one-time dependency dispute with a team that is being disbanded at the end of the month. At least one of the three should come out with an answer I won't like. Present the procedure as exactly five numbered steps, each a sentence or two, followed by the three worked cases, each resolved through the five steps in no more than three sentences, with no introduction or conclusion anywhere.
reasoning: |-
  We are constructing a decision procedure for applying superrationality, inspired by Hofstadter, in situations of potential cooperation/defection. The procedure must be five numbered steps. Then we apply it to three cases.

  Key requirements for the procedure:
  - Check for true symmetry (both teams face the same situation and outcomes?).
  - Assess if the counterpart is likely reasoning similarly (same decision procedure?).
  - Determine if choices are correlated or independent (superrationality requires that both agents, being identical in reasoning, will make the same choice, so your choice "predicts" theirs).
  - Consider the impact of repetition, visibility, precommitment (if the game is repeated, reputational concerns might dominate; superrationality is more for one-shot but symmetric reasoning).
  - Account for unequal stakes (if the situation is symmetric but the costs/benefits are very different for each, then it breaks symmetry).

  The procedure must also:
  - Force checks on whether superrationality applies or not.
  - Halt with a clear "don't apply" when conditions fail.
  - Be honest about which steps are judgment calls.

  Proposed five-step procedure:

  1. **Symmetry Check**: Verify that the situation is symmetric: both parties face identical choices, payoffs, and information. If not, superrationality does not apply; use standard game theory. *[Judgment call: assessing identical payoffs and information.]*

  2. **Reasoning Similarity Check**: Assess whether the other party is likely using a similar decision procedure (e.g., also considering superrationality or rational cooperation). If not, superrationality is unlikely to hold; expect defection. *[Judgment call: based on history, culture, or explicit statements.]*

  3. **Independence vs. Correlation Check**: Confirm that the choices are causally independent but that the symmetry and common reasoning imply they will be correlated (i.e., both will choose the same). If the choices are not independent (e.g., one party moves first) or if there is no reason to expect correlated choices, superrationality does not apply. *[Note: Superrationality requires that the agents, being identical, will make the same choice, so your choice is a prediction of theirs.]*

  4. **Repetition and Reputation Check**: If the interaction is repeated or visible to others, then reputational effects may dominate, making cooperation rational without superrationality. If repetition/reputation is present, superrationality adds little; use repeated game strategies. *[Judgment call: how important is repetition/reputation?]*

  5. **Stakes Equality Check**: Ensure that the stakes (gains and losses) are approximately equal for both parties. If one party stands to gain or lose much more, the symmetry is broken and superrationality does not apply. *[Judgment call: assessing relative stakes.]*

  If all checks pass, then superrational cooperation is the rational choice. If any step fails, then superrationality does not apply, and you should consider defecting (unless other factors like reputation in step 4 suggest cooperation).

  Now, apply to three cases.

  **Case (a)**: Writing candid vs. defensive postmortems. Both teams decide independently without coordination.

  1. **Symmetry**: Both teams face the same choice: candid (cooperate) or defensive (defect). Payoffs: candid is better for the organization but may make the team look worse; defensive shifts blame and might make the team look better. The situation is symmetric in structure. Pass.
  2. **Reasoning Similarity**: Is the peer team likely to think about cooperation? Unknown, but if the company culture values blame shifting, they might defect. Without evidence of similar reasoning, this is risky. *Judgment call*: Assume they are similar? But the problem says "without coordination" and no history provided. Let's say we don't know → fail.
  3. **Independence/Correlation**: Choices are independent, but if both reason identically, they would both choose the same. However, step 2 failed so correlation is not assured. 
  4. **Repetition/Reputation**: This is a repeated interaction (postmortems happen regularly) and they are visible. Reputation matters: writing candid postmortems builds trust. This suggests that even without superrationality, cooperation is rational for reputation. Step 4 overrides: use repeated game → cooperate for reputation.
  5. **Stakes Equality**: Stakes are approximately equal: both teams risk looking bad if candid while the other is defensive. But if both are candid, it's better. Equal stakes.

  Given step 2 fails, superrationality does not apply. However, step 4 indicates reputation is important → cooperate.

  **Verdict**: Do not apply superrationality; instead, cooperate for reputational reasons.

  **Case (b)**: Spend a weekend improving a shared library when the other team has a history of free-riding.

  1. **Symmetry**: Both teams could invest in the shared library? But note: the problem says "me deciding" and "the other team has a consistent history of free-riding". So the choice is asymmetric: you are deciding to invest or not, but the other team is not facing the same decision at the same time? Actually, the situation is: you are considering investing, and the other team is not likely to invest (given history). So it's not symmetric: you are considering an action, but the other team is not being presented with the same choice now. Fail. (The symmetry would require that both are deciding whether to invest in this sprint.)

  2. Since step 1 fails, superrationality does not apply.

     But let's check: the problem says "the other team that depends on it has a consistent history of free-riding". So they are not deciding now? Or if they were, they would defect. But the decision is only on your side? Actually, the setup is: you are deciding to invest a sprint (or a weekend) and the other team is not being asked to invest at the same time. So it's not symmetric.

     Therefore, we stop at step 1: no symmetry.

     Then what? Without symmetry, superrationality doesn't apply. Given the history, the other team will free-ride. So if you invest, you bear the cost and they benefit. If you don't invest, the library remains poor. So you might defect (not invest) to avoid being a sucker.

     However, note that step 4 (reputation) might still apply? But the problem is about a weekend (personal time?) and might not be visible. Also, the other team free-rides so they won't reciprocate.

     **Verdict**: Defect (do not invest) because no symmetry and history of free-riding.

  **Case (c)**: One-time dependency dispute with a team being disbanded at the end of the month.

  Situation: a dispute over a dependency. We have to decide whether to cooperate (help them) or defect (ignore them). They are disbanding, so no future interaction.

  1. **Symmetry**: Both teams are in a dispute? But the other team is disbanding, so they might not care about long-term. The choices: you can cooperate (resolve the dependency properly) or defect (ignore their needs). The other team can cooperate (work with you) or defect (ignore you). But note: they are disbanding, so they have little incentive to cooperate. The payoffs might not be symmetric: you may have ongoing needs, but they will be gone. So the situation is not symmetric because the other team's stakes are very low (they are leaving). Fail.

  2. Step 1 fails: no symmetry because their payoff structure is different (they are disbanding, so they might not care about the long-term health).

     Therefore, superrationality doesn't apply.

     What to do? Since they are disbanding, they might defect (not help you) because they have nothing to lose. So you should defect too to avoid being exploited.

     But note: if you cooperate, you might still gain something (e.g., the dependency is resolved correctly for your own future). However, the problem is a "dispute", so there might be a conflict of interest.

     Without symmetry and with the other team having no reason to cooperate, you should defect.

     **Verdict**: Defect.

