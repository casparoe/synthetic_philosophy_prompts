  3. **Correlation Check**: Confirm choices are causally independent but correlated via identical reasoning; if correlation is implausible (e.g., asymmetric influences), halt. (Judgment: estimate choice alignment.)  
  4. **Repetition Check**: If interactions are repeated, visible, or allow precommitment, use repeated-game reputation strategies instead; superrationality adds nothing. (Judgment: gauge repetition/reputation weight.)  
  5. **Stakes Check**: Ensure gains/losses are roughly equal; if stakes are unbalanced (e.g., one bears higher costs), symmetry fails. (Judgment: compare relative impacts.)  
  If all steps pass, cooperate superrationally; else, defect unless repetition (step 4) mandates cooperation for reputation.  

