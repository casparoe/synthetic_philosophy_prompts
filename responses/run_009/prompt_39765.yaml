  **Case (b)**: Improving shared library with free-riding history.  
  Step 1: Fail (not symmetric: you are deciding to invest, but the other team is not facing the same choice; they have a history of free-riding).  
  Halt: Superrationality does not apply. Given history and no reciprocity, defect (do not invest). (3 sentences)

