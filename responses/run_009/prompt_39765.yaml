  Note: The procedure must be five numbered steps, each a sentence or two.

  Final Procedure:

  1. **Symmetry Check**: Confirm that both parties face identical choices, payoffs, and information; if not, superrationality does not apply. (Judgment call)
  2. **Reasoning Similarity Check**: Assess if the other party is likely to use similar rational decision-making, including considering superrationality; if not, expect defection and halt. (Judgment call)
  3. **Correlation Check**: Ensure choices are causally independent but will be correlated due to identical reasoning; if correlation is unlikely (e.g., asymmetric information), halt. (Judgment call)
  4. **Repetition Check**: If the interaction is repeated or visible (enabling reputation), use repeated game strategies instead; superrationality adds nothing. (Judgment call)
  5. **Stakes Check**: Verify that gains and losses are approximately equal for both; if stakes are unbalanced, symmetry is broken and superrationality does not apply. (Judgment call)

  If all steps pass, cooperate superrationally. Else, defect unless other factors (like step 4) suggest cooperation for reputation.

