  Halt: Superrationality does not apply. With no future interaction and their incentive to defect, you should defect. (3 sentences)

  One of the cases (a) comes out with cooperation but not due to superrationality, which might be disliked because it requires extra work. Case (b) and (c) say defect, which might be disliked if one is inclined to cooperate.

