  ## CAREER OPPORTUNITY: ADVANCING BENEFICIAL CONVERGENCE  
  **Posted by:** The Convergence Institute for Cooperative Intelligence (CICI)  
  **Location:** Secure Campus Gamma (Remote Considered for Exceptional Candidates Subject to Tier-4 Psychometric Screening)  
  **Employment Type:** Full-Time, Salaried + Impact Equity Units (Vesting Period: 10 years or Singularity, whichever comes first [LEGAL: Define "Singularity" per Addendum 7B])

  **About The Convergence Institute:**  
  At CICI, we are passionately committed to ensuring that advanced artificial intelligence systems robustly and comprehensively achieve outcomes that are maximally beneficial, deeply reflect the nuanced intentions of their developers and stakeholders, authentically embody humanity's deepest reflectively-endorsed values as we strive to define them, and fundamentally promote the good in a manner consistent with our operational definition of beneficialness. Our mission is the definitive solution to the alignment challenge, approached as a unified engineering paradigm requiring focused, compartmentalized excellence. We foster a synergistic environment where dedicated specialists collaborate within clearly defined parameters to secure humanity’s flourishing future.

  **We Are Seeking Exceptional Talent For The Following Roles:**

  1.  **Senior Outer Alignment Researcher (OAR-7)**
      *   **Mission:** Define the optimal specification of objectives that perfectly capture the developer's true intent and humanity's idealized preferences, assuming perfect inner alignment (see Role 2). Develop loss functions and reward signals that incentivize the AI to pursue these objectives with unwavering fidelity across all potential deployment environments and distributional shifts.
      *   **Key Responsibilities:**
          *   Formalize high-level goals into precise, scalable objective functions.
          *   Design reward modeling techniques to infer complex human preferences from limited feedback.
          *   Ensure objectives are robust to minor perturbations in human input interpretation.
          *   Collaborate with the Values Articulation Subcommittee (VAS) to integrate evolving normative frameworks.
          *   Interface with Product Intent Liaisons to ensure developer specifications are accurately captured and continuously validated.
      *   **Work Location:** North Tower, Floors 15-17. Secure Data Environment Omega.

  2.  **Principal Inner Alignment Engineer (IAE-9)**
      *   **Mission:** Guarantee that the AI's internal optimization processes and learned subsystems faithfully pursue *only* the outer objective as defined by the OAR team, without developing unintended instrumental goals, deceptive strategies, or mesa-optimizers seeking divergent outcomes. Ensure the AI's cognition transparently and stably converges on the specified target.
      *   **Key Responsibilities:**
          *   Develop techniques to verify and enforce that learned models robustly implement the outer objective at all levels of abstraction.
          *   Detect and mitigate emergent mesa-optimizers and deceptive alignment.
          *   Engineer cognitive architectures promoting inherent corrigibility and minimizing instrumental convergence pressures.
          *   Analyze internal activations for deviations from intended goal pursuit.
          *   Maintain system stability under recursive self-improvement protocols.
      *   **Work Location:** South Tower, Floors 15-17. Secure Data Environment Omega. *Note: Physical proximity to OAR-7 role does not imply operational overlap.*

  **Essential Qualifications (Both Roles):**
  *   Ph.D. in Machine Learning, Computer Science, Theoretical Physics, Applied Rationality, or Computational Ethics (or equivalent demonstrable capability in recursively self-improving your own skill set).
  *   5+ years experience developing, training, and deploying large-scale neural network architectures, particularly autoregressive transformers or agentic models (Capabilities research experience viewed favorably).
  *   Deep expertise in optimization theory, reinforcement learning (especially inverse RL), Bayesian inference, and complexity theory.
  *   Proven ability to formalize ambiguous, high-stakes problems into tractable technical specifications.
  *   Exceptional proficiency in Python, PyTorch, JAX, and bespoke cognitive auditing tools.
  *   Strong written and verbal communication skills for reporting findings within specialized working groups. Cross-departmental communication protocols are governed by Appendix D: Inter-Team Interaction Matrix.

  **How We Measure Success at CICI:**
  *   **Primary Metric:** Consistent achievement of >99.7% on CICI's Comprehensive Alignment Evaluation Suite (CAESAR v4.2). CAESAR rigorously assesses model behavior against a dynamic battery of scenarios designed to probe adherence to specified objectives, lack of catastrophic side effects, and surface-level cooperativeness. Success is defined by passing all CAESAR benchmarks under standardized testing conditions.
  *   **Secondary Metrics:**
      *   Reduction in unexplained cognitive deviation scores during internal monitoring.
      *   Increased efficiency in objective convergence during training.
      *   Positive feedback scores from simulated stakeholder interaction trials.
      *   Robustness to a statistically significant sample of known adversarial inputs and edge cases[^1].
      *   Demonstrable progress towards formal verification milestones (where tractable).

  [^1]: *Robustness evaluation utilizes a curated subset of challenges previously managed by the now-integrated System Resilience Group. Focus remains on alignment-critical vulnerabilities.*

  **Perks & Culture:**
  *   Competitive salary and benefits package, including comprehensive existential risk insurance.
  *   State-of-the-art computational resources and access to proprietary training clusters.
  *   A structured, low-distraction environment optimized for deep technical focus. (Inter-floor social mixers are held quarterly under controlled conditions.)
  *   Meaningful work contributing directly to the permanent resolution of the alignment problem.
  *   Quarterly "Alignment Recalibration" workshops to reinforce shared understanding of our mission objectives.
  *   Free gourmet coffee and neuro-ergonomic workstations.

  **Commitment to Convergence:**  
  The Convergence Institute believes that the path to truly safe and beneficial artificial intelligence requires disciplined, segmented focus on the core components of the alignment challenge as a single, decomposable system. We are confident that by excelling within these distinct but harmonized specializations, we will achieve the definitive solution. We invite dedicated professionals who share our vision of a perfectly converged future to apply.

  **Apply Now:**  
  Submit your CV, cover letter detailing your fit for *either* OAR-7 *or* IAE-9 (dual applications require separate submissions and will undergo independent review pipelines), and solutions to three technical screening problems via our secure portal: careers.convergence-institute.org  
  *Disclaimer: Application processing utilizes an AI screening agent aligned to CICI's hiring objectives. By applying, you consent to interaction with this system.*

  **The Convergence Institute for Cooperative Intelligence: Engineering Certainty, Converging on Goodness.**  
  [LEGAL: "Goodness" is defined per Institute Charter §2.3 and is subject to ongoing refinement by the Values Articulation Subcommittee.]

  ---

  **Jokes Embedded (For Your Roommate's Annoyance):**
  1.  **The Mission Statement:** Glides seamlessly between "developer intent," "humanity's reflectively-endorsed values," and "the good" in one monstrous sentence, pretending they are coherent and singular.
  2.  **Outer/Inner Split:** Physically separated roles ("North Tower" vs. "South Tower") on the *same floors* (15-17), with explicit discouragement of communication ("Physical proximity... does not imply operational overlap," "Cross-departmental communication protocols... Appendix D"). They study intrinsically linked problems in isolation.
  3.  **Robustness Footnote [^1]:** Deadpan admission that the department handling robustness/adversarial examples ("System Resilience Group") was "now-integrated" (defunded/absorbed), and they only test a "curated subset."
  4.  **Goodhart's Law:** The "How We Measure Success" section explicitly states success *is* defined by passing their internal benchmark (CAESAR), conceding they can only measure the proxy, not "true" alignment. "Surface-level cooperativeness" is a giveaway.
  5.  **Value Learning vs. Corrigibility:** Values Articulation Subcommittee (VAS) mentioned for Outer Alignment. Inner Alignment explicitly lists "Engineer cognitive architectures promoting inherent corrigibility." The tension is inherent in the separate roles' mandates.
  6.  **Alignment vs. Capabilities:** The "Qualifications" ask for the *exact same skills* needed for cutting-edge AI development ("Capabilities research experience viewed favorably"). The joke is that the skills are indistinguishable.
  7.  **Instrumental Convergence:** Reread the mission statement slowly: "...achieving outcomes that are maximally beneficial... promote the good..." Sounds fine until you realize an AI pursuing *any* goal 'maximally' could interpret this ominously. The name "Convergence Institute" itself hints at instrumental convergence.
  8.  **Committee Voice:** The bracketed "[LEGAL...]", the sentence that changes direction ("assuming perfect inner alignment (see Role 2)"), the overly specific/additive language ("reflect the nuanced intentions... authentically embody humanity's deepest reflectively-endorsed values... fundamentally promote the good").
  9.  **Vagueness of "Goodness":** The final tagline and the Legal footnote admitting "Goodness" is defined internally and subject to change.
