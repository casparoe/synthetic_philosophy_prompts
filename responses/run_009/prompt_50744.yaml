prompt: |-
  I'm sketching out a paper section on futarchy and I've realized I don't actually know what I should be demanding of it before judging whether it's a good idea. Write the desiderata: what any scheme that lets prediction markets set policy has to get right -- things like resisting manipulation by traders who can also influence the outcome being bet on, the problem of picking the GDP-like metric the market is supposed to maximize and what gets left out of it, handling irreversible one-shot choices where there's no repeated feedback loop, keeping the "policies judged only on the metric" assumption honest -- with the case behind each requirement, and flag any pair that probably can't be jointly satisfied (my hunch is "traders profit from being right about consequences" and "policy outcomes can't be bought" don't coexist, but tell me if that's too quick). Also say which single requirement does the most work in ruling out actual proposed versions of futarchy, and mark for each desideratum whether it's genuinely non-negotiable or just a preference of people who already like or already distrust markets. Please keep apart what's settled from what's genuinely contested among people who know this stuff -- don't smooth disagreements into a fake consensus. And no citations or reading lists, I'll be offline when I work through it.
reasoning: |-
  Okay, the user is working on a paper section about futarchy and needs a clear set of desiderata—essential requirements—that any prediction market-based policy system must meet. They want the case for each requirement, potential conflicts between them, which one is most problematic for existing proposals, and whether each is non-negotiable or just a preference. They also emphasize avoiding fake consensus and skipping citations. 

  First, I need to unpack their core ask: they're not just listing flaws but seeking a rigorous framework to evaluate futarchy's viability. Their deeper need is likely to preempt criticism by addressing fundamental tensions upfront. The mention of "irreversible one-shot choices" and "GDP-like metric" suggests they're grappling with how abstract market mechanisms handle real-world complexity. 

  For desiderata, I'll start with the most universally acknowledged hurdles. The metric problem feels foundational—if you can't define what "better" means, the system fails immediately. Then manipulation risks, especially outcome purchasing (where traders profit by causing the outcome they bet on), which directly undermines truth-seeking. The irreversibility challenge is critical too; markets need repeated trials for calibration, but big policies are often one-offs. 

  The user's hunch about "traders profiting from truth" vs. "outcomes can't be bought" is sharp—these *are* in tension. If you prevent manipulation by restricting trades (e.g., no insiders), you might dampen market participation/knowledge. But allowing it invites sabotage. I'll flag this as a key trade-off. 

  For the "most damaging" desideratum, metric specification wins. Critics and proponents alike agree defining a single societal welfare metric is both necessary and impossible without arbitrariness. Even Robin Hanson (futarchy's inventor) admits this is messy. 

  On negotiability: some items like manipulation resistance are near-universal dealbreakers. Others, like preference for market-based governance, hinge on ideology. I'll clarify where technocrats might accept compromises democracy advocates wouldn't. 

  Disagreements to highlight: 
  - Proponents think manipulation can be priced in; skeptics say it's fatal. 
  - Some argue futarchy could handle one-shot decisions via parallel markets (e.g., "choose A vs. B" as separate contracts); others call that unworkable. 
  - The "veil of ignorance" idea (traders not knowing future stakes) is theoretically neat but practically dubious. 

  I'll avoid watering these down. The goal is to equip the user with clear tensions they can engage in their paper.
answer: |-
  Here are the core desiderata for any futarchy-like system, with their rationales, tensions, and status – reflecting genuine disagreements where they exist:

  ### Core Desiderata (Non-Negotiables)

  1.  **Truthful Revelation of Beliefs:**
      *   **What:** The prediction market must accurately aggregate *all* relevant information about the likely consequences of policies into a single price reflecting the true probability of the metric being achieved.
      *   **Case:** The entire premise of futarchy hinges on markets being superior information aggregators. If beliefs aren't truthfully revealed (e.g., due to manipulation, bias, or lack of incentives), the policy choice is based on noise, not signal.
      *   **Non-Negotiable?:** **Yes.** Failure here invalidates the core mechanism. Widely agreed as essential.

  2.  **Manipulation Resistance (Outcome Purchasing):**
      *   **What:** The system must prevent actors from profiting by betting on an outcome *and then causing that outcome* ("buying the outcome") when it wouldn't otherwise occur, especially if causing it harms the metric.
      *   **Case:** A wealthy entity could bet heavily that Policy X will increase Metric M, then spend a fraction of their potential winnings to *make* M increase under X (e.g., through temporary stimulus distorting the real economy or even fraud), despite X being harmful long-term. This exploits the market for profit, not truth.
      *   **Non-Negotiable?:** **Yes.** Undermines truthful revelation and leads to actively harmful policies chosen for private gain. Universally seen as critical.
      *   **Conflict with Profit Motive:** Your hunch is **correct and central**. The very incentive that drives information revelation (profit from being right) *also* creates the incentive and means for outcome purchasing. Resolving this without crippling the market's information function is the **primary tension**.

  3.  **Un-Gameable Welfare Metric:**
      *   **What:** The target metric (e.g., GDP+) must comprehensively capture societal welfare in a way that cannot be significantly distorted by the policies chosen to maximize it *without actually improving welfare*. Defining it robustly is crucial.
      *   **Case:** If the metric is GDP, policies might encourage short-term bubbles or environmental destruction. If it's GDP+, defining the "+" (e.g., weighting environment, health, inequality) is inherently political and vulnerable to manipulation (e.g., focusing on easily measurable but shallow indicators).
      *   **Non-Negotiable?:** **Yes.** If the metric is flawed or gameable, maximizing it becomes actively harmful or misses the point. Defining it robustly is universally agreed to be essential *and* extremely difficult.
      *   **Ruling Out Proposals:** This is arguably the **single requirement doing the most work in ruling out futarchy** in practice. Defining a metric that is simultaneously comprehensive, measurable, non-gameable, and politically acceptable is seen by critics as fundamentally impossible. Proponents often hand-wave this complexity.

  4.  **Causal Attribution:**
      *   **What:** The market must accurately predict the causal effect of the *policy itself* on the metric, isolating it from external factors and noise. Policies shouldn't be rewarded/punished for events outside their control.
      *   **Case:** A good policy might be implemented during a global recession, causing the metric to fall despite the policy lessening the fall. A terrible policy might coincide with a boom. The market must price the *marginal impact* of the policy choice.
      *   **Non-Negotiable?:** **Yes.** Without valid causal inference, the market isn't evaluating policies, just correlating them with outcomes. Essential for meaningful choice, but extremely hard to achieve.

  ### Critical Challenges (Often Downplayed by Proponents)

  5.  **Handling Irreversible, One-Shot Decisions:**
      *   **What:** The system must work for unique, high-stakes, irreversible decisions where there is no repeated trial or clear counterfactual (e.g., launching a war, building a specific geoengineering project).
      *   **Case:** Prediction markets rely on repeated play and feedback for calibration and learning. For a unique event, there's no opportunity to learn from mistakes, and defining the "counterfactual" outcome (what would have happened otherwise) for the market to price is speculative and contentious.
      *   **Non-Negotiable?:** **Contested.** Proponents might argue markets can handle unique events based on similar past events or scenario modeling. Skeptics see this as a fatal flaw for major decisions, arguing markets need repetition. Leaning towards **Non-Negotiable** for a *general* governance system.

  6.  **Robustness to Unforeseen Consequences:**
      *   **What:** The system must cope with "unknown unknowns" – consequences not anticipated or bet on when the policy was chosen.
      *   **Case:** Markets bet on known outcome metrics. A policy maximizing GDP+ might inadvertently trigger a novel social crisis or technological disruption no one foresaw or priced in. The market mechanism offers no corrective feedback for these unanticipated harms.
      *   **Non-Negotiable?:** **Contested.** Proponents argue unforeseen consequences plague all systems, and markets adapt fastest. Skeptics argue democratic deliberation is better at incorporating diverse perspectives on potential risks. **Leans towards Non-Negotiable** – a viable system can't ignore massive unanticipated harms.

  7.  **Preserving the "Metric-Only" Assumption:**
      *   **What:** Preventing actors from influencing policy implementation or interpretation *outside the defined metric* to favor their bets (e.g., sabotaging implementation if they bet against the policy).
      *   **Case:** A bureaucrat who bet against Policy X might subtly undermine its implementation to ensure it fails and they win their bet, even if proper implementation *would* have succeeded and helped the metric.
      *   **Non-Negotiable?:** **Yes.** Undermines the core contract of "implement faithfully, judge solely on metric." Requires strong, incorruptible institutions – often assumed but hard to guarantee.

  ### Ideological/Idealistic Preferences

  8.  **Democratic Legitimacy & Value Incorporation:**
      *   **What:** The process should feel legitimate to citizens and incorporate societal values beyond the narrow metric (e.g., fairness, liberty, dignity) in a way that feels responsive.
      *   **Case:** Citizens might reject a policy that slightly increases GDP+ but severely violates deeply held values. Futarchy feels technocratic and unresponsive.
      *   **Non-Negotiable?:** **Strong Preference (for democrats).** Proponents see efficiency as legitimizing. Critics see this lack as fatal for a governance system. This is a **fundamental ideological divide**, not just a technical hurdle.

  9.  **Scalability & Practical Complexity:**
      *   **What:** The system must be administratively feasible without overwhelming complexity or cost (e.g., defining and resolving thousands of policy/market pairs).
      *   **Case:** Running liquid, manipulation-resistant markets on every conceivable policy alternative is likely prohibitively complex and expensive.
      *   **Non-Negotiable?:** **Preference.** Proponents argue markets scale well digitally. Skeptics see the institutional overhead as crippling. More a practical concern than a core logical flaw.

  ### Key Tensions & Conflicts

  *   **Profit Motive vs. Outcome Purchasing (#2 vs. Core Mechanism):** This is the **most fundamental tension**. Solutions (e.g., restricting who can trade, limiting trade size, using "futures" contracts settled long after implementation) often risk undermining liquidity, information aggregation (#1), or creating new vulnerabilities.
  *   **Comprehensive Metric (#3) vs. Measurability & Non-Gameability:** Truly capturing welfare requires complexity, but complexity makes measurement harder and creates more angles for gaming. Simpler metrics are easier but more flawed.
  *   **Causal Attribution (#4) vs. One-Shot Decisions (#5):** Reliable causal inference is hardest precisely when it's most needed – for unique, high-stakes decisions with no clear counterfactual.

  ### Summary of Critical Flaws

  *   **Most Damaging to Proposals:** **Un-Gameable Welfare Metric (#3)** is the most common and powerful critique, as defining the metric is both essential and seemingly intractable.
  *   **Deepest Logical Tension:** **Profit Motive vs. Outcome Purchasing (#2 vs. Core Mechanism)** exposes the inherent conflict in the core incentive structure.
  *   **Critical Practical Hurdle:** **Handling One-Shot Decisions (#5)** challenges the reliance on repeated feedback.
  *   **Non-Negotiables:** #1, #2, #3, #4, #7 are widely seen as essential for the mechanism to function logically. Failure on any likely dooms it. #5 and #6 are critical challenges many skeptics consider fatal.
  *   **Ideological Battleground:** #8 (Legitimacy/Values) is the core democratic objection.

  **Remember:** Proponents contest the severity of #5, #6, and the feasibility of solving #2 and #3. Skeptics see #2, #3, #4, and #5 as insurmountable. There is **no consensus** on whether futarchy is viable; the desiderata highlight *why* the debate persists. Your paper must grapple with these tensions, not assume they are solved.
