answer: |-
  Here’s the strongest version of your friend’s case, constructed to spec:

  ### The Thought Experiment: The Isolated Diarist  
  A solitary individual, isolated from birth with no exposure to any public language or community (e.g., raised in sensory deprivation with only innate concepts), experiences a recurring inner sensation, *S*. She devises a sign "∇" solely for *S* and keeps a diary for decades. *S* has no behavioral, physiological, or public correlates; its recurrence is purely introspective. She records "∇" only when *S* occurs. Over time, she compares current *S*-episodes to past diary entries and judges them "the same." Her diary shows consistent usage: no contradictions, retrospective confirmation ("Yes, *this* is what I meant by '∇'"), and apparent reidentification across years. The diary "works" for her: it feels reliable, and she uses it predictively (e.g., "∇ usually follows event *X*").  

  ### Wittgensteinian Diagnosis & Why It Applies  
  The core objection holds: **there is no fact of the matter about whether "∇" refers to *S* or to nothing at all**. Even if her usage seems consistent *to her*, "seeming right" is all she has. Without a *criterion* of correctness independent of her subjective impression—a standard against which her use can be checked—her belief that "∇" tracks *S* is empty. Her confidence is a psychological state, not semantic correctness. Wittgenstein’s analogy: a person who "checks" a newspaper’s accuracy by buying a second copy of the same edition. The diary’s internal consistency is circular, not normative.  

  ### Best Response to Save the Argument  
  The parasitic dependence response **is the correct line, and it works**:  
  Her ability to use "∇" *presupposes public language scaffolds*. Even in isolation, she relies on concepts like "same," "past," "record," and "diary"—all inherited from a public framework. When she judges "This sensation is the *same* as yesterday’s," "same" derives its meaning from public criteria for sameness (e.g., consistent application in intersubjective contexts). Without this, "reidentification" collapses into a brute feeling of familiarity, not a rule-governed act. Her sign "∇" isn’t truly private; it’s a graft onto public norms. Wittgenstein’s target is a language *logically* independent of public practices—this isn’t it.  

  ### If We Strip Out the Feature  
  If we remove *all* parasitic elements (e.g., she has no public language, no concepts of "sameness" or "past"), the case collapses:  
  - Without public concepts, she cannot form the *intention* to "reidentify" *S* or "record" it. The diary becomes a series of marks with no connection to past entries.  
  - There is no "success" to intuit because she lacks the framework to judge consistency. Her use of "∇" reduces to an idle ceremony—like a bee "dancing" alone. The ordinary private language problem (no criterion of correctness) reasserts itself, but now without the *illusion* of function.  

  ### Best Push-Back & Whether It Lands  
  **Push-back**: "But she *invents* her own standards! She defines 'sameness for me' as 'whatever feels continuous in memory.' Why can’t this *internal* standard—refined over decades—ground correctness? Wittgenstein assumes norms require community, but here she creates a *personal* norm. Her lifelong practice *is* the standard."  

  **Does it land? Partially, but not fatally**:  
  - It lands in exposing a deep intuition: phenomenologically, her practice *feels* meaningful. Wittgensteinians must concede that the diarist might have a *sense* of correctness.  
  - **Why it fails**: A "personal norm" is incoherent. Norms require the *possibility* of mistake, but "feeling continuous" cannot distinguish "seems right" from "is right." If she misremembers *S* on day 1,000 but feels confident, there’s no fact to correct her. What she "creates" is a causal loop of impressions, not a normative practice. Wittgenstein’s point isn’t sociological ("norms need communities") but logical ("norms need checkability"). Her isolation makes checkability impossible, so no norm exists.  

  **Conclusion**: The parasitic argument holds—the diarist’s reliance on public concepts sustains the illusion of a working language. Remove that scaffolding, and the "success" vanishes, revealing the logical vacuum. The push-back highlights the *psychological* plausibility of private tracking but doesn’t resolve the *semantic* problem: without external criteria, "∇" has no meaning, only a history of use. The victory goes to Wittgenstein, but the intuition your friend exposes is real—and that’s why the debate endures.  

  **Key Wittgenstein Quote**: *"To think one is obeying a rule is not to obey a rule. Hence it is not possible to obey a rule 'privately'"* (PI §202). The diarist *thinks* she obeys; obedience requires more.
