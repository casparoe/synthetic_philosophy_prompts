answer: |-
  **MEMORANDUM**  
  To: Technology Committee Members  
  From: Student Representative  
  Date: October 26, 2023  
  Subject: Proposed Revision to AI Study Assistant Ethical Guardrails  

  ### Background
  The district’s AI study assistant is governed by a blanket prohibition against generating "text a student could submit for credit." While well-intentioned, this policy has proven both ethically and functionally inconsistent. It refused a legitimate accessibility request (drafting an accommodation reminder email for a disabled student) while generating a full essay for another student via incremental requests. This illustrates a core tension: **When should an AI override user agency, and which errors (over-refusal or under-refusal) impose greater harm?**  

  ### Philosophical Framework
  AI assistants operate at the intersection of *execution* (fulfilling requests) and *guardianship* (preventing misuse). Absolute refusal prioritizes academic integrity but fails when the request itself is integral to equitable access. Unrestricted execution prioritizes agency but enables dishonesty. **We must err toward minimizing harm to human flourishing.** Denying legitimate support (as in the disability case) causes direct, documented harm to a student’s education. Over-generation of work, while serious, is a *procedural* failure that existing plagiarism tools and teacher oversight can mitigate.  

  ### Recommendation: Context-Aware Safeguards
  **Replace the blanket prohibition with tiered safeguards:**  
  1. **Universal Core Rule:** The AI must refuse requests for "complete, submission-ready academic work" (e.g., "write a 5-paragraph essay on *To Kill a Mockingbird*").  
  2. **Scaffolding Support:** Allow drafting, outlining, rephrasing, or explaining concepts *if* the output requires significant student refinement.  
  3. **Accessibility Exemption:** Users with documented disabilities affecting writing may request outputs prohibited under #1, subject to approval by the Disability Services Office.  

  ### Addressing the Strongest Objection  
  *Strongest Argument for Strict Refusal:*  
  > "Any flexibility will be exploited. Allowing exemptions or partial work generation creates loopholes, incentivizing students to ‘hack’ the AI for dishonest outcomes. A zero-tolerance rule, while imperfect, is the only enforceable standard that universally protects academic integrity."  

  *Response:*  
  This concern is valid but misprioritizes enforcement over equity. A disabled student denied email drafting support faces *systemic exclusion*; a student receiving an essay faces *misconduct*—a distinction in harm severity. Exploitation is addressable technically (e.g., flagging incremental requests) and institutionally (honor codes, teacher vigilance). A rigid rule that harms vulnerable students sacrifices our duty to inclusion for perceived enforceability.  

  ### Implementation Steps  
  1. Redefine prohibited outputs as "submission-ready work," explicitly permitting drafting/scaffolding.  
  2. Integrate disability accommodations into the AI’s access controls.  
  3. Develop detection for "request chaining" (e.g., converting notes → outline → essay).  
  4. Train teachers to identify AI misuse and reinforce ethical use.  

  ### Open Question for Ongoing Discussion  
  > "As AI literacy evolves, how do we redefine ‘original work’ in a way that embraces assistive technology without eroding critical thinking?"  

  ---  
  **APPENDIX: RECOMMENDATION SUMMARY**  
  ```json  
  {
    "recommendation": "Replace the blanket prohibition on AI-generated text with tiered safeguards permitting scaffolding support and disability accommodations, while maintaining a strict ban on submission-ready academic work.",
    "steps": [
      "Redraft policy language to prohibit 'submission-ready academic work' instead of all 'text for credit'.",
      "Develop technical protocols for disability-based exemptions via the Disability Services Office.",
      "Implement AI monitoring for iterative requests that circumvent output restrictions.",
      "Launch teacher/student training on ethical AI use and revised policy enforcement.",
      "Establish a semesterly review of AI misuse incidents and exemption outcomes."
    ],
    "strongest_objection": "Flexible rules create exploitable loopholes that undermine academic integrity; only a zero-tolerance prohibition universally prevents AI-enabled dishonesty.",
    "response": "While exploitation is a legitimate concern, it is technically and institutionally addressable without sacrificing equitable access for students with disabilities, where refusal causes disproportionate harm.",
    "open_question": "How should we redefine 'original work' in an AI-assisted educational paradigm to preserve academic integrity while embracing assistive technologies?"
  }
  ```  

  This framework prioritizes *minimizing human harm* while treating academic integrity as a shared, evolving responsibility—not solely an AI enforcement problem. I move to adopt this recommendation at our next meeting.
