answer: |-
  ### Step-by-Step Decision Procedure: Moral Parliament with Explicit Vetoes

  This procedure handles deep moral disagreements by combining elements of expected choice-worthiness (ECW) with a parliamentary fallback when normalization proves arbitrary. It respects lexical constraints (absolute prohibitions) and explicitly acknowledges the comparability problem. The process is designed for a 2-hour meeting with 6 participants (5 trustees + you) and 8-12 proposals.

  ---

  ### **Procedure Overview**
  1. **Preparation (Pre-Meeting):** Trustees receive proposals in advance. Each trustee prepares:
     - Veto decisions for each proposal (if it violates an absolute constraint in their moral theory).
     - Numerical scores for non-vetoed proposals (using any scale; focus on relative differences).
     - Weights for all moral theories (credences; probabilities summing to 1).

  2. **Meeting Steps:**
     - **Step 1:** Elicit Weights and Scores (30 min).
     - **Step 2:** Apply Vetoes and Identify Eligible Proposals (15 min).
     - **Step 3:** Normalize Scores (Range Method) (15 min).
     - **Step 4:** Calculate Expected Choice-Worthiness (ECW) (15 min).
     - **Step 5:** Check Sensitivity via Borda Count (15 min).
     - **Step 6:** Allocate Budget (if ECW/Borda agree) or Fallback to Parliamentary Bargaining (30 min if needed).

  ---

  ### **Detailed Steps**
  #### **Step 1: Elicit Weights and Scores (30 min)**
  - **1a. Assign Theory Weights:**  
    Each participant (trustees + you) assigns weights (0–1, sum=1) to the 5 moral theories, representing their credence in each.  
    *Example:* The consequentialist trustee might assign: Consequentialism=1.0, others=0. The program officer might assign equal weights (0.2 each).  
    **Calculation:** Average weights across all 6 participants for each theory.  
    $$W(T) = \frac{1}{6} \sum_{j=1}^{6} \text{weight}_j(T)$$
    
  - **1b. Report Vetoes and Scores:**  
    Each trustee reports for their own theory:  
    - **Veto:** "Yes" if the proposal violates an absolute constraint (lexical priority).  
    - **Score:** Numerical score for non-vetoed proposals (no scale restrictions).

  #### **Step 2: Apply Vetoes and Identify Eligible Proposals (15 min)**
  - Any proposal vetoed by **≥1 theory** is **ineligible**.  
    *Rationale:* Lexical constraints are absolute; no theory can override another’s prohibitions.  
    *Output:* List of eligible proposals.

  #### **Step 3: Normalize Scores (Range Method) (15 min)**
  For each theory, normalize scores of eligible proposals to a 0–1 scale:  
  $$NS_T(p) = \frac{S_T(p) - \min_{p' \in \text{eligible}} S_T(p')}{\max_{p' \in \text{eligible}} S_T(p') - \min_{p' \in \text{eligible}} S_T(p')}$$
  - If all scores are equal, set $NS_T(p) = 0.5$.  
    *Note:* This is arbitrary but necessary for comparability. Sensitivity is checked in Step 5.

  #### **Step 4: Calculate Expected Choice-Worthiness (ECW) (15 min)**
  For each eligible proposal, compute:  
  $$\text{ECW}(p) = \sum_{T} \left[ W(T) \times NS_T(p) \right]$$  
  Rank proposals by ECW (highest to lowest).

  #### **Step 5: Check Sensitivity via Borda Count (15 min)**
  - **5a. Borda Scores:**  
    Each theory ranks eligible proposals (best=1, second=2, etc.; ties share average rank).  
    Compute weighted Borda score:  
    $$\text{Borda}(p) = \sum_{T} \left[ W(T) \times \text{rank}_T(p) \right]$$  
    Rank proposals by Borda score (lowest to highest; lower = better).
    
  - **5b. Compare ECW and Borda:**  
    Simulate funding allocation:  
    - Fund top ECW proposals until budget exhausted.  
    - Fund top Borda proposals until budget exhausted.  
    If **funded sets are identical**, use ECW ranking for allocation.  
    If **funded sets differ**, proceed to Step 6 (Parliamentary Bargaining).

  #### **Step 6: Parliamentary Bargaining (Fallback, 30 min if triggered)**
  - **6a. Approvals:** Each theory approves/disapproves eligible proposals ("approve" = good use of funds given cost).  
  - **6b. Approval Score:** For each proposal, compute:  
    $$A(p) = \sum_{T \text{ approves } p} W(T)$$
  - **6c. Cost-Effectiveness Ratio:**  
    $$R(p) = \frac{A(p)}{\text{cost}(p)}$$
  - **6d. Allocate:** Fund proposals with highest $R(p)$ until budget exhausted.

  ---

  ### **Handling Key Distinctions**
  - **Moral vs. Factual Disagreement:**  
    Scores/vetoes reflect moral standards (immune to evidence); weights reflect credences in theories. Factual disputes (e.g., "How many children does this help?") are resolved **before** scoring.
  - **Lexical vs. Ordinal Views:**  
    Vetoes capture lexical constraints (e.g., deontological prohibitions). Scores capture ordinal rankings.
  - **Dropped Distinctions:**  
    - Cardinal vs. ordinal scales (we treat all as interval via normalization).  
    - Higher-order uncertainty (weights are point estimates).

  ---

  ### **Worked Examples**
  **Background:**  
  - Theories: Consequentialist (C), Deontologist (D), Contractualist (Ct), Prioritarian (P), Religious (R).  
  - Weights: All trustees assign 1.0 to their own theory; you assign 0.2 to each.  
    $$W(T) = \frac{1 + 0.2}{6} = 0.2 \text{ for each } T$$  
  - Budget: $10M.  
  - **Proposals:**  
    - **A. Deworming ($100K):** Small benefits to many children.  
    - **B. Animal Welfare Lobbying ($500K):** Improves factory farms via politics.  
    - **C. Rare Disease Treatment ($2M):** Saves few children.

  #### **Example 1: Deworming (A) vs. Rare Disease (C)**
  - **Vetoes:** None.  
  - **Scores:**  
    | Theory | A     | C     |
    |--------|-------|-------|
    | C      | 100   | 10    |
    | D      | 50    | 50    |
    | Ct     | 80    | 70    |
    | P      | 60    | 90    |
    | R      | 70    | 60    |
    
  - **Normalized Scores (Range Method):**  
    | Theory | A     | C     |
    |--------|-------|-------|
    | C      | 1.0   | 0.0   |
    | D      | 0.5   | 0.5   |
    | Ct     | 1.0   | 0.0   |
    | P      | 0.0   | 1.0   |
    | R      | 1.0   | 0.0   |
    
  - **ECW:**  
    $A: (0.2×1.0) + (0.2×0.5) + (0.2×1.0) + (0.2×0.0) + (0.2×1.0) = 0.7$  
    $C: (0.2×0.0) + (0.2×0.5) + (0.2×0.0) + (0.2×1.0) + (0.2×0.0) = 0.3$  
    **Rank:** A > C.  
    Fund A ($100K) → Fund C ($2M) → $7.9M remains.

  - **Borda Count:**  
    | Theory | A Rank | C Rank |
    |--------|--------|--------|
    | C      | 1      | 2      |
    | D      | 1.5    | 1.5    | (tie)
    | Ct     | 1      | 2      |
    | P      | 2      | 1      |
    | R      | 1      | 2      |  
    **Borda Scores:** $A: 0.2(1+1.5+1+2+1)=1.3$; $C: 0.2(2+1.5+2+1+2)=1.7$  
    **Rank:** A > C.  
    **Sensitivity Check:** Funded sets match (A then C) → **Use ECW**.

  #### **Example 2: Animal Welfare Lobbying (B)**
  - **Vetoes:**  
    D vetoes (corrupt means); R vetoes (violates religious law).  
    **Result:** B ineligible → Excluded.

  #### **Example 3: Rare Disease (C) vs. Deworming (A) with Sensitivity Trigger**
  - **Scores (adjusted to magnify comparability problem):**  
    | Theory | A     | C     |
    |--------|-------|-------|
    | C      | 100   | 99    |  
    | D      | 0     | 100   |  
    | Ct     | 80    | 70    |  
    | P      | 1     | 100   |  
    | R      | 70    | 60    |  
  - **Normalized Scores:**  
    | Theory | A     | C     |
    |--------|-------|-------|
    | C      | 1.0   | 0.0   |  
    | D      | 0.0   | 1.0   |  
    | Ct     | 1.0   | 0.0   |  
    | P      | 0.0   | 1.0   |  
    | R      | 1.0   | 0.0   |  
  - **ECW:** $A: 0.6$; $C: 0.4$ → Fund A then C.  
  - **Borda Count:**  
    | Theory | A Rank | C Rank |
    |--------|--------|--------|
    | C      | 1      | 2      |  
    | D      | 2      | 1      |  
    | Ct     | 1      | 2      |  
    | P      | 2      | 1      |  
    | R      | 1      | 2      |  
    **Borda Scores:** $A: 0.2(1+2+1+2+1)=1.4$; $C: 0.2(2+1+2+1+2)=1.6$ → Fund A then C.  
    **Sensitivity Check:** Agreement → **Use ECW**.

  #### **Disliked Conclusion: Deworming (A) Defeats Rare Disease (C)**
  - **Why disliked?** C (rare disease) is intuitively compelling but loses due to:  
    - Consequentialist/prioritarian magnitude differences (A helps more per dollar).  
    - Deontologist scores dilute C’s appeal.  
  - **Lesson:** The procedure prioritizes aggregate "moral efficiency" over intuitive sympathy.

  ---

  ### **Limitations and Transparency**
  #### **Points Requiring Human Judgment**
  1. **Weight Assignment:** Credences in theories are subjective.  
  2. **Vetoes:** Lexical constraints are non-negotiable.  
  3. **Scores/Approvals:** Trustees must interpret their theories.  
  4. **Fallback Trigger:** Disagreement between ECW/Borda requires switching methods.

  #### **What the Procedure Cannot Do**
  - **Resolve Moral Disagreement:** It launders disagreement into weights and scores but does not eliminate it.  
  - **Avoid Arbitrariness:** Normalization (Step 3) and fallback (Step 6) rely on contestable choices.  
  - **Handle Strategic Behavior:** Trustees may inflate vetoes or manipulate scores.

  #### **Conclusion: Transparent Laundering vs. Opaque Vote**
  The procedure makes disagreement **visible and structured** but does not resolve it. Compared to your weighted vote:  
  - **Advantage:** Exposes moral trade-offs (e.g., lexical vetoes, normalization effects).  
  - **Disadvantage:** Still relies on arbitrary normalization or fallback bargaining.  
  - **Recommendation:** Use this procedure not to "solve" disagreement but to:  
    - **Clarify** where conflicts lie (e.g., vetoes, magnitude disputes).  
    - **Legitimize** outcomes via a process all trustees understand.  
    - **Reduce** animosity by depersonalizing debates (focus on theories, not people).  

  **Final Note:** The goal is a *livable* disagreement. If trustees see their views represented fairly, they may accept outcomes they dislike—but this is a political achievement, not a philosophical resolution.
