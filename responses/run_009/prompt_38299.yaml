prompt: |-
  I write a column on science and ideas for a general-interest magazine, and I am at work on an essay about the legacy of the Nuremberg and Tokyo tribunals. At a recent conference on international criminal law, a senior scholar laid out for me, over coffee, what she called the standard resolution of the retroactivity problem. The more I transcribe it, the more it seems to prove either too much or nothing at all. Here it is as she gave it to me.

  (1) A criminal prohibition is not retroactive in any objectionable sense when it punishes conduct that was already gravely wrong at the time it occurred, and that the actors knew was wrong; retroactivity is a defect only insofar as it produces unfair surprise.
  (2) The central acts for which the Nazi leadership was tried — planning and launching wars of aggression, and the mass atrocities — were gravely wrong in the 1930s and early 1940s, and the men responsible knew it: hence the staged border incident used to justify the invasion of Poland, the secrecy of the war planning, the euphemisms in the internal documents.
  (3) Men who take elaborate pains to disguise an act because they expect the world to treat it as criminal cannot later complain of unfair surprise when a tribunal names that wrong and punishes it.
  (4) So the Nuremberg charter did not create crimes after the fact; it declared wrongs that were already punish-worthy, and the trials therefore did not violate the principle of legality — no crime without law, no punishment without law.
  (5) The same reasoning applies at Tokyo, and indeed in general: whenever the defeated leadership knew its conduct was gravely wrong, a postwar court may punish it, and retroactivity is no objection.
  (6) But then the principle of legality imposes no independent constraint on the courts a victor convenes: whatever the winning powers regard as a grave wrong known to be wrong becomes, for that reason alone, punishable, and the bar on retroactive law never blocks anything the winners are prepared to call a grave wrong.
  (7) A principle that never blocks anything is not a constraint but a standing compliment to the victors' moral judgment — which is precisely what the phrase victors' justice was coined to name. So either (1) is false and the trials really did punish under law that did not exist when the acts occurred, or the principle of legality is an empty formality.

  The scholar presented this as a triumphant defense of Nuremberg: on her reading, (1) through (4) establish that the trials were legitimate. But read through to (7), it looks like a dilemma in which neither horn is comfortable. If I give up (1), I concede that the defendants were punished under rules invented after the fact to fit their conduct, and the phrase victors' justice lands. If I accept (6), I concede that legality has no content beyond the victors' conscience, which is the same landing by another route.

  My suspicion is that something slips between (3) and (5): that the claim these particular men, given what they knew and what they concealed, cannot cry unfair surprise is quietly exchanged for the claim that no one can, that wherever the winners detect grave and known wrongdoing, retroactivity ceases to be an objection in law. But I cannot state the difference in a way that survives her likely reply, which is that criminal liability presupposes only that the actor could have known the wrong, and here they could and did.

  For the essay I would like, if possible, to keep two things: the thought that the Nuremberg defendants were not convicted under law manufactured after the event simply to convict them, and the thought that the principle of legality is a real constraint rather than an ornament. So: which premise or step should I reject, and what does rejecting it cost? If the argument is in fact valid, tell me plainly which of the two things I want to keep must be surrendered, and say what the familiar defenses of the trials — that the charter merely declared preexisting customary law, or that the wrongs were so manifest that punishment required no written statute — have to pay for that choice. Please also address Tokyo specifically, since there the charge has always seemed to me harder to parry: the judges all sat for the victorious powers, the offenses were defined in the very charter that created the court, and the emperor was spared for reasons of state.
reasoning: |-
  Okay, the user is a science and ideas columnist working on an essay about the Nuremberg and Tokyo tribunals' legacy. They're grappling with a scholar's argument that presents a dilemma regarding retroactivity and victors' justice. The user wants to maintain two key points: that Nuremberg defendants weren't convicted under ex post facto laws, and that the principle of legality remains a meaningful constraint. They're particularly concerned about Tokyo's apparent weaknesses.

  Hmm, this is a sophisticated legal-philosophical puzzle. The scholar's argument is clever but contains a crucial equivocation. Let me trace it: Premise (1) seems reasonable - retroactivity is problematic mainly due to unfair surprise. The evidence in (2)-(3) strongly supports no unfair surprise for Nazi leaders. But then (5) overgeneralizes this to "whenever the defeated leadership knew it was wrong," which smuggles in a subjective test that erodes legality's objective nature.

  Ah! The pivot happens between (4) and (5). The scholar conflates two distinct concepts: the defendants' actual knowledge (which negates unfair surprise) and the victors' subsequent judgment (which doesn't establish pre-existing illegality). For Tokyo, this flaw is glaring - many charges (like waging aggressive war) weren't clearly established crimes under Japanese law or international custom at the time.

  The user's suspicion about (3) to (5) is spot-on. We can reject (5)'s overgeneralization while keeping (1)-(4). This preserves Nuremberg's legitimacy based on specific evidence of knowledge and concealment, without reducing legality to victors' whims. The cost? We must acknowledge Tokyo's greater retroactivity problems - especially regarding aggression charges - which explains why its legacy remains more contested.

  For the essay, I should emphasize that legality requires both no unfair surprise AND pre-existing prohibition. Nuremberg largely satisfied both through documented evidence of defendants' awareness of fundamental norms. Tokyo struggled more, particularly on aggression. This maintains legality as a real constraint while explaining historical variations in tribunals' legitimacy.
answer: |-
  You've pinpointed the core tension brilliantly. The scholar's argument is indeed elegant but ultimately flawed due to a critical slippage in scope. The flaw lies primarily in **Step (5)**, specifically its overgeneralization from the *specific, evidenced knowledge and concealment* of the Nuremberg defendants to a *general principle* that victors can punish *any* conduct *they deem* "gravely wrong and known to be wrong" without violating legality. This transforms "no unfair surprise" from a *subjective defense against retroactivity* into an *objective carte blanche for victors*.

  **Rejecting Step (5) and Preserving Your Two Goals:**

  1.  **Reject the Overgeneralization:** Step (5) claims: "The same reasoning applies... *in general: whenever* the defeated leadership knew its conduct was gravely wrong, a postwar court may punish it, and retroactivity is no objection." **This is the leap.**
      *   **Why it's Wrong:** It conflates the *subjective mental state of the defendant* (knowledge of wrongfulness, negating unfair surprise) with the *objective existence of a legal prohibition* at the time of the act. Legality requires *both* for punishment to avoid retroactivity. Knowing something is morally wrong is *not* the same as knowing it is criminally prohibited under positive law. The scholar's argument essentially reduces the principle of legality ("nullum crimen, nulla poena sine lege") to a purely subjective test ("did the defendant know it was morally wrong?"), stripping it of its core function as an *objective constraint* on state power.
      *   **The Cost of Rejection:** You must acknowledge that the reasoning *cannot be universally applied*. It worked well for the core Nuremberg crimes *because* there was strong evidence linking the defendants' knowledge/moral awareness to the existence of *nascent or recognized legal norms* prohibiting such extreme acts (even if imperfectly codified). You cannot automatically extend this to *any* act the victors deem gravely wrong and assert the defendants knew it. This preserves legality as a constraint – it *will* block prosecutions where there truly was no pre-existing prohibition, regardless of the defendant's subjective moral awareness.

  2.  **Preserving Nuremberg's Legitimacy (Without Relying on Step 5):**
      *   **Focus on Pre-Existing Prohibitions:** The strongest defense relies on demonstrating that the *core crimes* (crimes against humanity, war crimes) *did* have foundations in pre-existing international law (Hague Conventions, Geneva Protocols, general principles recognized by civilized nations) and domestic law. The "manifest wrongness" argument *supplements* this by showing the defendants *knew* these acts violated fundamental norms, negating unfair surprise and reinforcing the idea that the law existed *in substance*.
      *   **Aggression (Crimes Against Peace):** This is the hardest charge. The defense relies on:
          *   Pre-war treaties condemning aggressive war (Kellogg-Briand Pact).
          *   State practice and condemnations of aggression prior to WWII.
          *   The argument that launching aggressive war inherently entails massive violations of *jus in bello* (laws of war) which *were* clearly prohibited, making the initiators criminally responsible for the foreseeable consequences.
          *   Crucially, the *evidence of concealment* (Step 3) is vital here – it shows the Nazis *themselves* believed their acts violated established norms and would be condemned, providing powerful evidence against unfair surprise *in this specific context*.
      *   **The Charter's Role:** Argue the Charter didn't *invent* new crimes wholesale, but rather *codified, consolidated, and provided jurisdiction* for prosecuting pre-existing prohibitions that were either scattered or lacked an enforcement mechanism. It was a *procedural* innovation to enforce *substantive* norms whose core content existed.

  3.  **Preserving Legality as a Real Constraint:**
      *   By rejecting Step (5)'s overgeneralization, you restore legality's bite. It *does* block prosecutions for acts that were *truly* not prohibited under any recognizable legal norm at the time they occurred, even if morally abhorrent and even if the defendant knew it was morally wrong. This prevents victors from simply inventing new crimes *ex post facto* based solely on their moral outrage. The constraint lies in the requirement to *demonstrate* the pre-existence of the prohibition, not just the defendant's subjective awareness of moral wrongfulness.

  **Addressing Tokyo Specifically:**

  Tokyo magnifies the problems inherent in Step (5)'s overgeneralization and weakens the defenses used for Nuremberg:

  1.  **Aggression Charges:** The legal basis for criminalizing *individual responsibility* for waging aggressive war was even shakier than at Nuremberg. Japan hadn't ratified key treaties relied upon (like Kellogg-Briand wasn't seen as creating individual liability), and state practice was less clear. The victors' imposition of this charge looked more like *ex post facto* law creation.
  2.  **Victor's Court:** The exclusive appointment of judges from the victorious powers (unlike Nuremberg's inclusion of judges from neutral countries like the USSR was still a victor) reinforced the "victor's justice" critique. The perception of impartiality was significantly weaker.
  3.  **Charter Creation:** Like Nuremberg, the Tokyo Charter defined the crimes *and* created the court. However, the weaker pre-existing legal basis for aggression made this appear more like *creating* the crime simultaneously with the court, heightening retroactivity concerns.
  4.  **Selective Prosecution / Emperor's Immunity:** The deliberate decision *not* to prosecute Emperor Hirohito, despite his central role, for blatant political reasons (maintaining stability in occupied Japan) starkly exposed the political nature of the tribunal and the victors' absolute discretion inherent in Step (5)'s logic. It demonstrated that "known grave wrong" was whatever the victors chose to prosecute, not an objective legal standard.
  5.  **Application of "Known Wrongfulness":** While Japanese leaders knew certain acts (e.g., treatment of POWs) were prohibited, the evidence for *universal* knowledge that *planning/launching the war itself* was a *personal crime* punishable by death was far less compelling than the meticulously documented Nazi conspiracy. The concealment argument was weaker.

  **Conclusion for Your Essay:**

  *   **Reject Step (5):** Its overgeneralization from Nuremberg's specific evidence to a universal victor's prerogative is the fatal flaw. It empties legality of meaning.
  *   **Keep Nuremberg's Legitimacy:** Ground it firmly in the *pre-existence of core prohibitions* (war crimes, crimes against humanity) under international/customary law, supplemented by the *overwhelming evidence of defendants' knowledge and concealment* negating unfair surprise. Acknowledge the aggression charge was the most legally innovative/controversial, defended by treaty language, state practice condemnations, linkage to *jus in bello* violations, and the powerful concealment evidence.
  *   **Keep Legality as Constraint:** Legality requires *both* a pre-existing prohibition *and* (to negate unfair surprise) the defendant's knowledge/capacity to know of its wrongfulness. It *does* block truly novel prosecutions invented *ex post facto*.
  *   **Address Tokyo Honestly:** Tokyo is the cautionary tale. Its weaker legal foundations (especially for aggression), exclusive victor composition, and the politically-driven immunity of the Emperor expose the dangers of the scholar's Step (5) logic. It comes much closer to "victor's justice" precisely because the application of the retroactivity defense based *solely* on victors' perception of "known grave wrong" was less tethered to demonstrable pre-existing *legal* norms and more evidentially shaky regarding universal knowledge of criminality for aggression. It highlights why Step (5) cannot be accepted – legality must be more than the victor's moral assessment.

  **The Cost:** You must concede that the line between declaring pre-existing law and creating new law can be blurry, especially regarding aggression at Nuremberg, and that Tokyo likely crossed that line more significantly. The familiar defenses (customary law, manifest wrongness) pay for their choice by having to confront the genuine legal controversies surrounding the criminalization of aggression *ex post facto* and the specific weaknesses of the Tokyo trial. However, by firmly rejecting Step (5)'s overgeneralization, you salvage the core principle of legality as a meaningful constraint and provide a more nuanced, defensible, and historically honest account of both tribunals.
