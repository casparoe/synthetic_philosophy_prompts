prompt: |-
  I serve on the governance committee of a mid-sized professional society — roughly 900 members, most of whom know each other at least by reputation — and we've been tasked with recommending a change (or no change) to how we elect the society's president. We currently use plurality with a runoff if no candidate clears 40%, and our last election produced a messy situation: four candidates, a clear Condorcet winner by the pairwise comparisons we informally reconstructed afterwards, and a vocal faction claiming their members "wasted" their first preferences and effectively elected their least-favored candidate under the runoff. One of our committee members, a game theorist, has been citing the Gibbard–Satterthwaite result at every meeting — as he puts it, every voting rule with three or more candidates that isn't a dictatorship is in some situations manipulable, so chasing a "game-proof" ballot is a fool's errand and we should simply pick the rule that behaves best on the profiles we actually see. He concedes he can't reconstruct the theorem's exact hypotheses from memory, and the rest of us can't either, so we can't tell how much our specific setting — a small electorate where nominations are pre-screened by a committee, voters can be indifferent, and everyone will see who ranked whom — escapes or falls under it.

  The committee is currently split three ways. One faction wants instant-runoff voting, arguing it removes the two-round turnout problem and lets members vote sincerely. A second wants Borda counting, on the theory that manipulation, while possible in principle, is hard to coordinate in a 900-person society where rankings are public afterward and reputations matter. A third wants to sidestep the whole question by having the nominations committee always narrow the field to exactly two finalists, so the theorem's domain condition fails and simple majority voting is strategy-proof in the classical sense — though two of us worry this just relocates the manipulation to whatever process picks the finalists, and makes the nominations committee de facto kingmakers. There's also a lingering question of whether we should even treat strategic voting as a defect to be engineered away rather than an ordinary part of political life that norms can absorb: our bylaws already say members should vote "in the interest of the society," which some read as a duty of sincerity.

  Please draft the written recommendation I'll circulate before our next meeting. It should recommend one concrete procedure (or explicitly defend the status quo), explain in terms our non-specialist members can follow why the impossibility result does or doesn't settle the question, engage the strongest version of the argument for whichever option you reject, and be candid about what your recommended rule will still get wrong — including whether the "narrow to two finalists" gambit is a genuine escape from the impossibility or a shell game. Bear in mind that whatever we recommend requires a two-thirds vote at the annual meeting, so the memo needs to be persuasive to members who will never read the theorem, only its consequences.
reasoning: |-
  We are drafting a recommendation for the governance committee of a professional society. The society currently uses a plurality system with a runoff if no candidate clears 40%. The last election had four candidates and resulted in a messy situation. We have three factions: one for instant-runoff voting (IRV), one for Borda count, and one for narrowing the field to two finalists. We also have the status quo as an option.

  The memo must:
  1. Recommend one concrete procedure (or defend the status quo).
  2. Explain the Gibbard-Satterthwaite theorem in non-specialist terms and whether it applies.
  3. Engage the strongest arguments for the rejected options.
  4. Be candid about the shortcomings of the recommended rule.
  5. Address whether narrowing to two finalists is a genuine escape or a shell game.
  6. Be persuasive to members who won't read the theorem.

  Given the context, I will recommend instant-runoff voting (IRV) as the best option. Here's why:

  - It addresses the two-round turnout problem (since it's a single ballot).
  - It allows voters to express preferences beyond their first choice, which might have alleviated the last election's problem (where a Condorcet winner existed but didn't win).
  - The public nature of the society (with only 900 members and reputational concerns) might deter blatant strategic voting, which is a known vulnerability of IRV (but less so than in larger, anonymous electorates).

  However, we must acknowledge that no system is perfect. The Gibbard-Satterthwaite theorem states that no voting system (with at least three candidates) can be both strategy-proof and non-dictatorial. So, every system we consider is vulnerable to strategic voting in some scenarios. But we can choose a system that performs well in the types of elections we have.

  Breaking down the options:

  1. **Status Quo (Plurality with Runoff)**:
     - We had a messy election. The runoff round can have lower turnout and is costly. Also, the 40% threshold might not capture the consensus.

  2. **Instant-Runoff Voting (IRV)**:
     - Voters rank candidates. If no candidate has a majority of first preferences, the candidate with the fewest first choices is eliminated, and votes are redistributed until one candidate has a majority.
     - Pros: Single ballot, avoids low turnout in a runoff, and allows more expressive voting.
     - Cons: It is not immune to strategic voting (e.g., voters might misrepresent their preferences to avoid helping a less-preferred candidate). Also, it can fail to elect a Condorcet winner (but so can the current system).

  3. **Borda Count**:
     - Voters rank candidates, and candidates get points based on their rank (e.g., first place gets n points, second gets n-1, etc.). The candidate with the most points wins.
     - Pros: It can reflect the overall consensus better than systems that only look at first choices.
     - Cons: It is highly vulnerable to strategic voting, especially if voters can coordinate. In a public setting, the fear of reputation might mitigate this, but it's still a risk. Also, it can be manipulated by introducing "clone" candidates or by burying strong opponents.

  4. **Narrow to Two Finalists**:
     - The nominations committee reduces the field to two, and then a simple majority vote between them.
     - Pros: Simple majority between two candidates is strategy-proof (in the classical sense) and easy to understand.
     - Cons: The manipulation shifts to the nominations committee. The committee becomes the de facto kingmaker, which might lead to internal politicking and loss of member trust. Also, it reduces the members' choice.

  The Gibbard-Satterthwaite theorem applies when there are three or more candidates and voters have preferences that are strict (no ties). It says that any voting rule that is non-dictatorial and can handle any possible set of preferences will be manipulable. However, if we have only two candidates, the theorem does not apply because then majority rule is strategy-proof. Thus, narrowing to two finalists technically escapes the theorem. But note: the escape is by design (by reducing the number of candidates to two), but the process of narrowing down is where the problem might reemerge.

  We must decide: Is the problem of strategic voting in a multi-candidate election worse than the problem of having a small committee effectively decide the outcome? In a society that values broad participation, the latter might be more damaging.

  Recommendation: I recommend adopting Instant-Runoff Voting (IRV).

  Reasons:
  - It solves the immediate problem of the two-round system (turnout, cost, and the risk of a runoff between two candidates who are not the most broadly acceptable).
  - It allows members to express their full preferences, which might have led to a better outcome in the last election (where a Condorcet winner existed).
  - In a society of 900 members where rankings are public and reputations matter, strategic voting might be less prevalent because members would be hesitant to be seen as manipulative. Our bylaws already encourage voting "in the interest of the society," which can be interpreted as sincerity.

  Engaging the alternatives:

  - **Borda Count**: The strongest argument for Borda is that it seeks a consensus candidate and, in a small society with public rankings, manipulation might be hard to coordinate. However, Borda is known to be highly manipulable. Even if coordination is hard, individual manipulation (like burying a strong opponent) is easy and might occur. Moreover, Borda can produce winners that are not Condorcet winners and may seem unintuitive.

  - **Narrow to Two Finalists**: This is a clean solution in theory because it avoids the theorem. However, the shift of power to the nominations committee is a major concern. The committee would become the target of lobbying and internal politics, and it might reduce the society's trust in the process. We are a professional society where members value having a say; this method would reduce that say.

  Candor about IRV:
  - IRV is not perfect. It is still vulnerable to strategic voting (though less so than Borda in some respects). It can fail the Condorcet criterion (electing a candidate who would lose to another in a head-to-head). But note: our current system also fails that. In fact, in the last election, the Condorcet winner was not elected. IRV can sometimes perform better than the current system in this regard.
  - Also, IRV can lead to "center squeeze" where a candidate who is broadly acceptable but not the first choice of a large group might be eliminated early.

  Conclusion: We believe IRV is the best balance. It addresses the practical problems of the current system, allows expressive voting, and in our small, reputation-conscious society, the risks of strategic voting are mitigated by norms and transparency. The Gibbard-Satterthwaite theorem reminds us that no system is immune to manipulation, but we can choose one that works well in practice and fits our context.

  Therefore, we recommend adopting instant-runoff voting for the election of the president.

  Drafting the memo accordingly.
answer: |-
  **To:** Governance Committee Members  
  **From:** [Your Name], Governance Committee Member  
  **Date:** October 26, 2023  
  **Subject:** Recommendation for Presidential Election Reform  

  ### Introduction  
  After extensive discussion, I recommend we adopt **instant-runoff voting (IRV)** for electing our society’s president. This memo explains why IRV best balances fairness, practicality, and resilience to strategic voting in our unique context—while candidly acknowledging its limitations. I’ll address the Gibbard-Satterthwaite theorem (often cited in our debates), engage alternative proposals, and clarify why narrowing the field to two finalists (while tempting) risks greater harm. Our goal is a system that fosters trust, reflects member preferences, and minimizes disruptions like the recent runoff controversy.  

  ### The Gibbard-Satterthwaite Result: What It Means for Us  
  Our colleague, the game theorist, is correct that the Gibbard-Satterthwaite (GS) theorem proves a profound limitation: *when three or more candidates run, no voting system is fully "strategy-proof"* (i.e., immune to tactical voting) unless it’s a dictatorship. In lay terms:  
  - **The core insight**: If voters have diverse preferences (e.g., A > B > C, B > C > A, etc.), any system can be "gamed." For instance, a voter might dishonestly rank a weaker candidate higher to block their least favorite.  
  - **But here’s why it doesn’t doom us**:  
    1. **GS applies only to strict rankings** (no ties). Our voters *can* be indifferent, slightly weakening the theorem’s grip.  
    2. **Small societies like ours aren’t "laboratory conditions"**. With 900 members, public rankings, and reputational stakes, blatant manipulation is risky and easier to detect. Norms matter—our bylaws already urge voting "in the interest of the society," which discourages gaming.  
    3. **Not all systems are equally manipulable**. GS says vulnerability *exists*, not that it’s equally severe or likely in practice. We must choose a rule that performs best *for our real-world profiles*—like elections with 2–4 screened nominees.  

  The GS theorem doesn’t mandate inaction; it urges realism. No system is perfect, but we can select one that maximizes sincerity and minimizes distortions in typical cases.  

  ### Why Instant-Runoff Voting (IRV) Is Our Best Option  
  IRV works simply: voters rank candidates (1st, 2nd, 3rd...). If no one wins >50% of first-choice votes, the last-place candidate is eliminated, and their votes transfer to next choices. This repeats until one candidate secures a majority.  

  **Advantages for our society**:  
  - **Solves the runoff problem**: The messy two-round affair (e.g., low turnout, "wasted vote" claims) disappears. One ballot ensures efficiency and full voter engagement.  
  - **Encourages sincerity**: Voters can support their true favorite first without fear of "splitting the vote," knowing backup choices matter. In the last election, IRV would likely have elected the Condorcet winner (the candidate preferred over all others head-to-head), as rankings capture broader support.  
  - **Fits our culture**: With public rankings and reputational accountability, strategic voting (e.g., "burying" a rival) is risky. IRV’s vulnerability to strategy is highest in large, anonymous groups—not our tight-knit society.  
  - **Proven in similar settings**: Organizations like the American Political Science Association use IRV. It’s transparent, auditable, and mirrors our existing ballot with added ranking.  

  **Strongest argument against IRV (and why it’s manageable)**:  
  Critics note IRV can fail the Condorcet criterion (e.g., a candidate beating all others head-to-head might still lose). It can also "squeeze" centrists if polarized factions dominate. However, our nomination committee’s screening reduces extreme polarization, making such pathologies rare. Unlike Borda or the status quo, IRV ensures the winner has broad majority support—not just a plurality. And while GS reminds us no system is bulletproof, IRV’s single-round simplicity and resistance to "vote-splitting" make it robust *for us*.  

  ### Why Not the Alternatives?  
  We engaged each proposal rigorously. Here’s why they fall short:  

  1. **Borda Count (assign points by rank)**:  
     - *Argument for*: Borda rewards consensus candidates and, with public rankings, coordination for manipulation is hard.  
     - *Why we reject it*: Borda is **highly manipulable** in practice. Voters can tank strong opponents by ranking them last, and trivial candidacies ("clones") can distort results. In our small society, even informal lobbying ("Rank A first to stop B!") could breed distrust. GS’s warning is acute here—Borda’s flaws aren’t just theoretical. Reputational costs won’t suffice when stakes are high.  

  2. **Narrow to Two Finalists**:  
     - *Argument for*: With two candidates, majority vote *is* strategy-proof—GS no longer applies.  
     - *Why we reject it*: This is a **shell game**, not an escape. Shifting power to the nominations committee makes them de facto kingmakers. Lobbying and factional battles would infect the nomination process, undermining trust. In effect, we’d trade visible election manipulation for backroom manipulation. Our last election had four strong candidates; artificially limiting choice ignores member voices. GS’s lesson isn’t to avoid multi-candidate elections—it’s to run them thoughtfully.  

  3. **Status Quo (Plurality with Runoff)**:  
     - *Argument for*: Familiarity and simplicity.  
     - *Why we change it*: The two-round system **amplifies strategic voting**. In the last election, voters abandoned their true preferences to avoid "wasting" votes, causing a suboptimal winner. Turnout drops in runoffs, and the 40% threshold is arbitrary (e.g., a candidate with 39% broad support could lose to one with 41% polarized support).  

  ### What IRV Will Still Get Wrong  
  Candor is crucial. IRV has drawbacks:  
  - **Not Condorcet-guaranteed**: In very close races, the Condorcet winner might lose (though less often than in our current system).  
  - **Vulnerable to "burying"**: A voter might rank a strong rival last to help their favorite—but this requires precise coordination, unlikely in our setting.  
  - **Ballot exhaustion**: If voters don’t rank all candidates, their vote might not count in later rounds. We can mitigate this by allowing partial rankings and educating members.  

  Crucially, **no rule "engineers away" strategy**. Voting is inherently political. But IRV channels strategy into norms-compatible behavior: voters who rank sincerely will usually achieve their best realistic outcome.  

  ### Conclusion  
  IRV is the most balanced upgrade: it eliminates runoff headaches, empowers sincere voting, and leverages our society’s accountability to curb manipulation. The GS theorem is a compass, not a barrier—it warns against utopian dreams but doesn’t prevent pragmatic gains. By adopting IRV, we honor member preferences while preserving fairness.  

  I urge the committee to support this recommendation. For the annual meeting, we’ll prepare a plain-language summary emphasizing IRV’s simplicity and its resolve of the runoff crisis. With your backing, we can put this to a vote confidently.  

  **Recommended motion**: *"Resolved, that the society adopts instant-runoff voting for presidential elections, effective immediately. Voters will rank candidates in order of preference, and winners must achieve a majority via sequential elimination."*  

  Let’s discuss at the next meeting. I welcome edits to this memo to strengthen our consensus.
