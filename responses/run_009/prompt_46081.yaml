prompt: |-
  longtime rationalist blog reader here (OB since the dialup days, permanent LW lurker). a friend teaches an upper-level ethics seminar and asked me to draft one question for her take-home final while she's on parental leave, and past-me of course said yes. topic: standing to blame and hypocrisy. the standard exam question here is just "does the hypocrite lose standing to blame?", and students answer it by reciting the usual cases and saying yes or no, which is basicaly useless. so I want a question with a twist that forces actual thinking. here's the twist I've been kicking around — build the question around it, or improve it if you can:

  imagine a public registry, call it a blame ledger, where you can pre-declare your own violations of a norm before blaming anyone else for it. once you've listed your violations, the hypocrisy objection seems to evaporate — you're not a hypocrite anymore, just an honest sinner. but something still feels off: standing now looks like something you buy back with a checkbox ritual, more like disclosing a conflict of interest than a moral achievement. and if confession does NOT restore standing, then the standing loss can't really be about falsely signaling your own purity — which is what half the explanations of the hypocrisy condition seem to say it's about. either way something has to give.

  so please write me (a) the essay question itself, for a 90-minute answer by upper-level students, built around this kind of case or a better version of it if you have one; (b) a model answer of about 600 words; and (c) a marking scheme out of 20 that names the specific moves an A answer must make vs. where a B answer stops — especially how students handle the confession case and the awkward implication that if only the blameless can blame, nobody can, and blame seems to do real work keeping norms sticky. one thing I really want: after the marking scheme, add a short note on which parts of your model answer you're actually least confident in, and what a sharp philosopher could say that would flip your marking scheme — I don't want to grade students against a take I only half believe in. and no padding the model answer with a reading list, she wants the reasoning not a bibliography.
reasoning: |-
  Okay, the user is a longtime rationalist blog reader and needs help drafting an ethics exam question about standing to blame and hypocrisy. They want a twist that forces deeper thinking beyond standard answers. The twist they propose involves a "blame ledger" where people pre-declare their violations before blaming others. 

  First, I need to unpack their core concern. They're frustrated with shallow "yes/no hypocrisy" exams and want students to wrestle with the underlying mechanics of moral standing. The ledger thought experiment cleverly isolates two key tensions: whether standing is about (a) avoiding false signaling or (b) some intrinsic moral authority. 

  The user's hidden challenge is making the question *diagnostic*—it should reveal whether students grasp that hypocrisy debates are really about competing theories of blame's function. They also hint at a practical worry: if only the sinless can blame, norms collapse. That societal angle needs weight in the question.

  For the essay prompt itself, I'll sharpen their ledger idea by adding concrete stakes: a "Community Accountability Registry" for minor offenses. This makes the paradox visceral—does registering your jaywalking "license" you to condemn murder? The prompt should force students to take a position on what standing *is*, not just whether hypocrisy matters.

  The model answer needs to model the moves we want from students: 
  1. Reject simple hypocrisy = automatic standing loss 
  2. Analyze the ledger through both major theories (signaling vs authority) 
  3. Grapple with the "nobody can blame" implication 
  4. Propose a third way (like qualified standing) 

  Crucially, the marking scheme must reward spotting how the ledger breaks traditional theories. Top answers should notice that if confession fixes hypocrisy but feels unsatisfying, maybe signaling isn't the core issue after all. 

  For the uncertainty note: I'm least dogmatic about whether blame's function is social (enforcing norms) or relational (addressing wrongs). A sharp student could argue that even with confession, the blamer's identical act creates a *relational* barrier—e.g., "How dare you judge me when you're no different?"—that no ledger can dissolve. That could upend the model answer's stance.

  User clearly values intellectual honesty (hence requesting the uncertainty disclaimer). They'd hate penalizing students for out-of-the-box arguments that challenge the model. The marking scheme should explicitly allow alternative frameworks if rigorously defended.
answer: |-
  Here’s a complete exam package centered on your "blame ledger" idea, designed to push students beyond rote answers and into conceptual tension:  

  ---

  ### **(a) Essay Question (for 90-minute take-home exam)**  
  **"Blame requires standing, and hypocrisy is often said to undermine standing. Imagine a 'Blame Ledger': a public registry where individuals must disclose their own past violations of a norm *before* blaming others for violating it. Does using this ledger restore a hypocrite’s standing to blame? Develop a nuanced analysis that:**  
  1. **Explains why hypocrisy might rob someone of standing to blame,**  
  2. **Assesses whether the ledger successfully addresses these concerns,**  
  3. **Confronts the implication that if *only* the blameless can blame, blame becomes practically impossible or socially inert,**  
  4. **Argues whether standing depends more on avoiding false signaling, possessing moral authority, or another fundamental condition.**  

  *Ground your answer in concrete examples and address potential objections to your view.*"  

  ---

  ### **(b) Model Answer (590 words)**  

  The hypocrisy objection to standing asserts that condemning others while guilty of the same wrong displays inconsistent commitment to the norm, invalidating one’s moral position. Standard accounts suggest hypocrisy undermines standing by either (a) *falsely signaling* one’s own compliance (thereby deceiving the blamee/audience), or (b) lacking the *moral authority* to hold others accountable. The Blame Ledger seemingly resolves (a): by confessing violations upfront, the blamer avoids deception. Yet the ledger feels unsatisfying—not because it fails technically, but because it reveals that avoiding hypocrisy via disclosure might be insufficient for genuine standing.  

  Consider a politician who registers past tax evasion on the ledger, then publicly blames a rival for the same offense. The ledger neutralizes the hypocrisy-as-deception charge: no false signaling occurs. But if the rival retorts, "You did the same thing—why should *you* judge me?", the objection persists. This suggests hypocrisy’s deeper harm is not deception but *unfairness*: blaming others for faults you excuse in yourself displays a lack of reciprocal commitment to the norm’s authority. The ledger makes inconsistency transparent but does not resolve it. The blamer still seeks to enforce a standard they personally flouted, exploiting the norm’s force while exempting themselves from its scrutiny.  

  This exposes a paradox: if standing *requires* blamelessness, then blame collapses. Few are perfectly consistent; norms like honesty or fidelity are universally violated yet socially indispensable. If only saints may blame, moral communities lose a key tool for norm-maintenance. The ledger attempts to square this circle by decoupling standing from purity—allowing "honest sinners" to blame. But if the ledger restores standing mechanically, it reduces blame to a bureaucratic ritual, divorcing it from moral credibility. The tax-evading politician’s blame feels illegitimate not because he lied about his past, but because his violation (unrepented and self-serving) negates his *relational authority* to demand accountability.  

  Standing, then, hinges less on signaling than on *moral reciprocity*. To blame validly, one must (i) endorse the norm’s validity *impartially*, (ii) acknowledge one’s own failures under it (beyond mere disclosure), and (iii) submit to the norm’s judgment *oneself*. The ledger addresses (i) by forcing endorsement via participation, but ignores (ii) and (iii). Genuine standing requires that the blamer *holds themselves accountable* to the same standard—e.g., by making amends or accepting censure for ledger-listed wrongs. Without this, the ledger facilitates blame laundering: weaponizing norms against others while treating one’s own violations as paid fees.  

  The ledger’s value is pragmatic, not moral. It prevents deceptive hypocrisy and may deter frivolous blame (by forcing self-implication). But it cannot confer standing absent contrition. True authority arises from participating in the norm *as both subject and enforcer*—a status earned through consistency, repentance, and vulnerability to the community’s judgment. The ledger is a start, but restoring standing demands more than confession; it requires moral coherence.  

  ---

  ### **(c) Marking Scheme (Total: 20 points)**  
  **A (18–20):**  
  - Identifies *both* deception and authority as grounds for hypocrisy objections.  
  - Argues ledger solves deception but not unfairness/moral authority deficit.  
  - Diagnoses paradox: blamelessness requirement voids blame’s social function.  
  - Posits *reciprocity* or *impartiality* as core to standing (beyond ledger mechanics).  
  - Explains why ledger feels "off" (e.g., reduces blame to transaction; ignores repentant vs. unrepentant violations).  
  - Integrates examples to show ledger’s limits (e.g., unapologetic blamer still lacks authority).  

  **B (15–17):**  
  - Explains hypocrisy’s threat to standing (deception or authority) but not both.  
  - Notes ledger resolves deception issue but senses lingering illegitimacy.  
  - Acknowledges the "no blameless blamers" problem superficially.  
  - Stops short of theorizing reciprocity/impartiality—defaults to "ledger helps but isn’t perfect."  
  - Uses examples descriptively but not analytically.  

  **C (12–14):**  
  - Treats hypocrisy as monolithic (e.g., "hypocrites can’t blame—ledger fixes it").  
  - Ignores the paradox of blamelessness requirement.  
  - Doesn’t interrogate why ledger feels unsatisfying.  
  - Repeats clichés ("practice what you preach") without conceptual depth.  

  **D/F (<12):**  
  - Misdefines standing/hypocrisy.  
  - No engagement with ledger thought experiment.  
  - Contradictory or incoherent position.  

  ---

  ### **Instructor’s Uncertainty Note**  
  I’m least confident in **dismissing deception as secondary to unfairness**. A sharp student could argue:  
  > *"The ledger’s unease stems from* residual deception. *Listing violations doesn’t prove current commitment—a blamer could register past lies while planning new ones. What feels ‘off’ isn’t unfairness but uncertainty about sincerity. Signaling isn’t just about past acts; it’s about ongoing trustworthiness. Standing requires perceived reliability, which the ledger alone can’t guarantee."*  

  This could flip the model: if blame functions to coordinate expectations (Gibbard, 1990), *any* doubt about the blamer’s fidelity to the norm—even post-disclosure—invalidates standing. The ledger then fails not because authority is primary, but because it inadequately addresses signaling’s *temporal depth*. An A answer should engage this tension; I’d reward it even against my model.  

  ---

  ### Why this works  
  - **Forces choice:** Students must take a stance on whether confession restores standing—no safe middle ground.  
  - **Exposes foundations:** The ledger cracks open debates about blame’s purpose (signaling vs. authority vs. social utility).  
  - **Anti-padding:** Concrete examples (e.g., the politician) anchor abstractions.  
  - **Uncertainty transparency:** Flags where rigor could challenge the model answer.  

  This question rewards students who see hypocrisy as a *lens* on blame’s structure—not just a checkbox.
