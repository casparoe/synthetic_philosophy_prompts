answer: |-
  Here’s a structured prioritization of open questions for your program, balancing foundational importance, tractability, and policy relevance. The ranking reflects **upstream impact** (how many downstream questions depend on it), **methodological fit**, **tractability within 4 years**, and **robustness to impasse**. I allocate **~60% effort to foundational questions** (with a pragmatic focus) and **~40% to second-best approaches**, with flexibility triggers noted.

  ---

  ### **Ranked Questions & Rationale**

  #### **1. What Constitutes the "Welfare Substance" Being Compared?**  
  *(Foundational: Nature of well-being bearers)*  
  - **Why upstream?**  
    All IUCs presuppose a shared understanding of *what property* is being measured (e.g., hedonic tone, preference satisfaction, objective goods). Without this, cross-psychological comparisons (e.g., humans vs. AI) are incoherent.  
  - **Tractability (Philosophy):** High. Focus on conceptual clarity:  
    - Is welfare a unified natural property (e.g., neurobiological reward signals)?  
    - Or a dispositional property (e.g., "what a fully informed version of entity X would prefer for X")?  
  - **Partial Answer/Progress Marker:**  
    A defensible account of *welfare invariants* – properties conserved across entities (e.g., "intensity of goal-achievement signals" in reinforcement learning systems). Example: A framework showing how neural reward prediction errors in mammals and reinforcement learning gradients in AI map to a common abstract structure.  
  - **Marginal Effort:** 20% (High foundational leverage but narrow focus).

  #### **2. Can We Ground Interpersonal Comparisons in Structural Facts About Agency?**  
  *(Foundational: Avoiding the Harsanyi Regress)*  
  - **Why upstream?**  
    Addresses the core regress problem in extended preferences. If solvable, it enables principled IUCs without circularity; if not, forces pivot to second-best approaches.  
  - **Tractability (Philosophy/Decision Theory):** Medium-High. Re-examine:  
    - **Scale types:** Can ratio/interval scales emerge from facts about *how* agents trade off risks/outcomes? (e.g., if two agents exhibit identical risk-postures toward welfare changes, can their units be equated?).  
    - **Axiomatic bridges:** Develop axioms for "unit comparability" (e.g., if Agent A sacrifices X to gain ΔU for B, and B sacrifices X to gain ΔU for A, do ΔU's share a unit?).  
  - **Partial Answer/Progress Marker:**  
    A formal model showing how specific constraints on rational choice (e.g., mutual sacrifice symmetry) imply unique (up to linear) interpersonal scales. Test against edge cases (e.g., beings with hyperbolic discounting).  
  - **Marginal Effort:** 25% (Core to escaping the ordinalist trap).

  #### **3. How to Formalize Robust Aggregation Under IUC Uncertainty?**  
  *(Second-Best: Policy-Reducible Uncertainty)*  
  - **Why prioritized?**  
    Even if foundations are unresolved, policymakers *must* weight benefits. This offers immediate tools for domains (a) and (b) while hedging against foundational indeterminacy.  
  - **Tractability (Decision Theory/Economics):** High. Leverage:  
    - **Uncertainty-aware aggregation:** E.g., social welfare functions sensitive to IUC parameter uncertainty (e.g., maximizing minimum expected welfare across plausible scales).  
    - **Domain-restricted comparability:** Identify contexts where IUCs *can* be made (e.g., "severe deprivation" vs. "luxury" gains may be ordinally comparable).  
  - **Partial Answer/Progress Marker:**  
    A working model for global health policy that outputs robustly optimal allocations across 80%+ of plausible IUC specifications. Demonstrated via case studies (e.g., bednets vs. cash transfers).  
  - **Marginal Effort:** 20% (Direct policy payoff).

  #### **4. Can Empathetic Simulation Be De-Biased or Intersubjectively Validated?**  
  *(Foundational/Empirical: Salvaging Projection)*  
  - **Why upstream?**  
    Empathy remains the primary IUC method in practice. Fixing it could unblock applied work while informing foundations.  
  - **Tractability (Philosophy/Psychology):** Medium. Interdisciplinary approach:  
    - **Calibration protocols:** Use neuroimaging (e.g., fMRI of empathy for pain) to test if simulators converge on similar "welfare units" for observed stimuli.  
    - **Bias-aware modeling:** Formalize how to discount simulator-specific distortions (e.g., via meta-preferences: "I assign less weight to my empathy when simulating someone with opposed values").  
  - **Partial Answer/Progress Marker:**  
    An empathy calibration procedure that reduces inter-simulator variance in welfare assessments by ≥50% in controlled experiments (e.g., comparing pain relief vs. income gains).  
  - **Marginal Effort:** 15% (Bridges empirical gaps).

  #### **5. What Aggregative Structures Survive Under Partial Comparability?**  
  *(Second-Best: Weaker Assumptions)*  
  - **Why included?**  
    If full cardinal IUCs are impossible, we need to know what distributive decisions *can* be made (e.g., "Is policy X better than Y for all plausible scales?"). Critical for domain (b).  
  - **Tractability (Decision Theory):** High. Build on:  
    - **Partial orders:** Extend interval-order or fuzzy-set approaches to welfare comparisons.  
    - **Domain-specific bounds:** E.g., "The welfare gain of pain relief for a mammal is at least 10x the gain of a sugar rush, for any coherent scale."  
  - **Partial Answer/Progress Marker:**  
    A theorem showing that prioritarianism requires only *interval comparability* (not ratio scales), with applications to animal welfare trade-offs.  
  - **Marginal Effort:** 10% (Fallback position).

  #### **6. How to Translate IUCs Across Dissimilar Psychologies?**  
  *(Applied: Domain-Specific Challenge)*  
  - **Why last?**  
    Depends on answers to Q1–2. Tackling it prematurely risks ad hoc solutions.  
  - **Tractability (Philosophy/Ethics):** Medium-Low. Requires:  
    - **Behavioral currencies:** Identify cross-species proxies (e.g., opportunity cost of time, learning rates).  
    - **Welfare thresholds:** Define "minimal welfare units" (e.g., energy cost to avoid a aversive stimulus).  
  - **Partial Answer/Progress Marker:**  
    A protocol for comparing welfare gains in insects vs. mammals using metabolic and behavioral resilience measures, validated by expert agreement.  
  - **Marginal Effort:** 10% (Downstream application).

  ---

  ### **Effort Allocation & Structural Trade-off**
  - **60% Foundational (Q1, Q2, Q4):** High risk but necessary. Q2 targets the Harsanyi regress head-on; if progress stalls within 18 months, shift resources to Q3/Q5.  
  - **40% Second-Best (Q3, Q5):** Ensure policy relevance even under indeterminacy. Q3 is the "safest" high-value output.  
  - **Q6** is a capstone application once foundations mature.

  ### **Triggers for Reshuffling Priorities**
  1. **Conceptual Breakthrough:** If Q2 yields a plausible unit-comparability axiom, pivot to refining/formalizing it (↑Q2 effort).  
  2. **Empirical Advance:** If neuroscience identifies cross-species welfare correlates (e.g., conserved neural signatures), boost Q4/Q6.  
  3. **Policy Demand:** If institutions request IUC tools for AI welfare (domain b), accelerate Q3/Q5.  
  4. **Stalemate:** If Q1/Q2 show no progress by Year 2, reallocate to Q3/Q5 (↑ to 60%).

  ### **Why This Balance?**
  - **Avoids foundational quagmires** by focusing Q1/Q2 on structural/agency-based approaches (more tractable than metaphysical disputes).  
  - **Guarantees output** via robust aggregation methods (Q3/Q5), satisfying funders/policymakers.  
  - **Embraces interdisciplinarity** where essential (e.g., psychology for Q4, biology for Q6) without diluting core philosophy/DT strengths.  

  This program promises foundational insights while delivering practical tools—making progress recognizable through **published frameworks**, **formal models**, and **policy test cases** even if the "ultimate" justification remains contested.
