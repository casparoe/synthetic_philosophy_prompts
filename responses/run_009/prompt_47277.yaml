answer: |-
  Here’s a structured analysis of the jurisprudence underlying the border guard trials, adhering to your specifications:

  ---

  ### (1) The Practice, Stated Precisely (150 words)  
  After German reunification (1990), the Federal Republic of Germany (FRG) prosecuted former East German (GDR) border guards, officials, and judges for shootings of civilians fleeing across the Berlin Wall. The defendants argued their acts were lawful under GDR border statutes in force at the time, making FRG prosecution retroactive punishment violating the principle of legality (*nulla poena sine lege*). German courts deployed three distinct justifications:  
  - **Natural-Law Route**: Invoking Gustav Radbruch’s formula, some rulings held that GDR statutes permitting lethal force were so grossly unjust they ceased to be valid law, leaving FRG homicide law applicable.  
  - **Positivist Interpretation**: Other courts re-interpreted GDR statutes *as prohibiting* unjustified killings, enabling conviction under GDR law itself.  
  - **International Law**: The European Court of Human Rights (ECHR) later upheld convictions, noting the shootings violated international human rights law binding on the GDR.  

  ---

  ### (2) The Natural-Law Reconstruction (250 words)  
  This approach presupposes a natural law theory akin to Fuller’s: law must meet minimum moral standards to be valid. Radbruch’s formula holds that statutes enabling extreme injustice (e.g., killing unarmed civilians) are not merely immoral but *cease to be law*. Thus, the GDR border laws lacked legal validity, creating a "legal vacuum." In this void, the FRG courts could apply general principles of criminal law (e.g., homicide prohibitions) without retroactivity, as no valid law shielded the defendants. Fuller would endorse this: if law’s purpose is to guide conduct through general rules, statutes licensing arbitrary killings are self-defeating and invalid. The moral outrage here—state-sanctioned murder—triggers Radbruch’s threshold, denying the GDR statutes the status of "law." This route strictly requires the natural-law premise: without it, the retroactivity objection stands. However, courts often paired this with other arguments, suggesting discomfort with relying *solely* on natural law, likely due to fears of judicial overreach in less extreme cases.  

  ---

  ### (3) The Positivist Reconstructions (300 words)  
  A positivist (à la Hart) can reach the same outcome without natural law:  
  - **Sovereign-Replacement Theory**: The FRG, as successor state, imposed its legal order on reunified territory. Since reunification extinguished GDR sovereignty, FRG criminal law applied prospectively to all acts within its new jurisdiction. The trials thus punished acts *now* illegal, not retroactively. Hart might object that this disregards the actors’ reliance on prior law, but positivists could argue state succession legitimizes legal reset.  
  - **Interpretation of GDR Law**: Courts construed GDR statutes as *already* prohibiting disproportionate force. Though GDR law authorized "stopping" fugitives, positivist judges argued it implicitly required minimal force and proportionality. Killing unarmed civilians violated these internal standards—making convictions lawful under GDR law at the time. Hart would accept this: legal rules have "core" meanings, and judges may clarify "penumbral" ambiguities (here, "stopping" ≠ killing). This route honors legality by anchoring punishment in pre-existing law.  

  Both positivist strategies avoid Radbruch’s formula. The interpretive approach is stronger: it respects the principle of legality directly, while sovereign succession risks retroactivity if FRG law criminalizes past *legal* acts. Hart might favor interpretation as it works within the prior legal system’s rules.  

  ---

  ### (4) What the Practice Actually Presupposes (200 words)  
  The practice pragmatically blends theories but is **strictly committed only to positivism**.  
  - Radbruch’s formula was *not* essential: the interpretive route alone sufficed to convict under GDR law, as courts explicitly held. The ECHR’s international law rationale also operated within positivism (treaties binding the GDR).  
  - Radbruch was a fallback for cases where reinterpretation strained credulity (e.g., when GDR statutes *explicitly* shielded shooters). Here, natural law "covered the flank," but the courts minimized its use, revealing a preference for positivist solutions.  
  - The core presupposition is **legal continuity**: the FRG saw itself as heir to both German legal tradition and GDR obligations (including international law). This allowed "immanent critique" of GDR law—exposing its internal contradictions—without always needing natural law. Only where statutes were irredeemably unjust did Radbruch apply.  

  ---

  ### (5) Underdetermination and Downstream Costs (200 words)  
  **Underdetermination**: Both Hart and Fuller could endorse the outcome.  
  - Fuller accepts Radbruch: unjust laws are invalid, so homicide law applies.  
  - Hart accepts the interpretive route: GDR law, properly understood, prohibited murder. International law also binds under positivism.  
  Neither *needs* the other’s core tenets.  

  **Downstream Costs**:  
  - If courts fully embraced Radbruch, they risked destabilizing ordinary jurisprudence. Declaring moderately unjust laws "invalid" (e.g., tax or property statutes) would invite chaos. Hence, courts confined Radbruch to "extreme injustice" (genocide, arbitrary killings) and leaned on interpretation elsewhere.  
  - Positivist routes impose their own costs:  
    - Sovereign succession could justify victors’ justice.  
    - Aggressive statutory interpretation risks eroding legality if judges "rewrite" clear laws.  
  The courts navigated this by tiering their reasoning: interpretation first, Radbruch only as last resort. This implicitly concedes that Radbruch’s formula is dangerous if universalized—a concession to positivist concerns.  

  ---  
  *Summary*: The practice is theoretically hybrid but positivist at its core. It uses natural law sparingly to avert the gravest injustices, while strategic interpretation preserves legality and limits Radbruch’s disruptive potential.
