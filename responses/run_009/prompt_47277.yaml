  For the natural law reconstruction, I'll emphasize how Radbruch's formula (which Fuller would endorse) solves the retroactivity problem by denying legal validity to extreme injustice. But I must also note the courts' unease with this - they clearly worried about opening floodgates for lesser injustices. 

  The positivist alternatives need careful separation. The sovereign-replacement theory treats the FRG as a new legal order imposing its norms, while the interpretive approach bends GDR law itself to condemn the shootings. Hart could accept the latter if framed as discovering what the statute always meant. 

  Where this gets really interesting is what the practice actually commits to. I think the courts were being strategically pluralist - using Radbruch where unavoidable but preferring interpretive maneuvers to limit its scope. The international law argument then provides a positivist-friendly safety net. 

  On underdetermination: Both Hart and Fuller could endorse the outcome but for opposite reasons. Fuller via Radbruch, Hart through either sovereign succession or statutory interpretation. The real downstream cost appears if courts overuse Radbruch - hence their clear preference for the interpretive route in borderline cases. 

  The user's sharpest insight is spotting how this case pressures moderate injustices. If Radbruch applies only to "extreme" cases, who defines that threshold? That's where the practice reveals its positivist leanings - using interpretation to avoid setting radical precedents. 

