  I need to address whether (6) is coherent. If everything is necessary, does that include the argument itself? If all truths are necessary, then the argument's conclusion is necessary, but also its premises. That might be consistent, but it challenges human experience of contingency. How do we reconcile that with feeling like we make choices? Compatibilism might help here, but it's a separate issue. The user might feel that accepting (6) invalidates their grief or agency, but that's more existential than logical.

