  Another angle is premise (2). Infinite chains: the roommate says even an infinite chain is contingent and needs a ground, but why? If each part is grounded, maybe the whole doesn't need an external ground. That's a point of contention in philosophy. Also, necessary facts could be brute, which some philosophers accept. For example, mathematical truths don't need an external ground.

