answer: |-
  ### Colony Mind Game: "Aunt Hillary's Trail"  
  *Materials: Index cards (one per player), two colored stickers per card (e.g., green/red), stopwatch.*  

  **Goal:** The colony must "find food" (locate a hidden volunteer) by forming a path using pheromone signals.  

  #### Setup:  
  - Designate one player as **Food Source** (FS). They stand at the far end of the room, hidden among others. Only FS knows their role.  
  - All others are **Ants**. Each gets an index card: green sticker visible (default "searching" state), red sticker hidden.  
  - **Starting point:** One "nest" area (e.g., a chair). All ants begin here.  

  #### Rules:  
  1. **Ant Movement (30 sec rounds, stopwatch timed):**  
     - Ants wander randomly (no talking!). If they see another ant’s green sticker within 3 feet, they *must* move toward it.  
     - If an ant touches FS, FS reveals their role. That ant flips to red sticker ("pheromone signal") and returns to the nest.  
  2. **Pheromone Rule:**  
     - Ants with red stickers stand still as "trail markers." They *point* toward FS’s location.  
     - Searching ants (green) who see a red ant must follow their pointing direction.  
  3. **Win Condition:**  
     Colony wins if 5+ ants reach FS within 15 min.  

  #### Debrief Questions (10 min):  
  1. *"How did you personally decide where to move? Did you know the colony’s goal?"*  
  2. *"When did you realize a ‘path’ was forming? What triggered it?"*  
  3. *"Is this path a ‘collective decision’? Or just physics?"*  
  4. *"Ants use pheromones; we used stickers and pointing. If we replaced ants with neurons and pheromones with signals, is the colony a ‘mind’? Or just a metaphor?"*  

  #### Predictable Problems & Cheats:  
  - **First-run chaos:** Ants cluster randomly, ignoring FS. Red ants might point inaccurately. Fix: Run 2–3 rounds; remind players to scan for red ants.  
  - **Cheats vs. Real Ants:**  
    - Real ants deposit *environmental* pheromones (not mobile markers).  
    - Humans "point" intentionally; ants react chemically.  
    - Ants self-organize via thousands of interactions; 20 humans are too few for true emergence.  

  #### Confidence & Weakest Link:  
  - **Confidence:** 8/10. Rules force local-only actions ➔ global pattern (path) *will* emerge if players follow pointing.  
  - **Weakest Bet:** Pheromone pointing. Humans might gesture vaguely, breaking the trail. Mitigate: Demo clear pointing beforehand.  

  **Total Words:** 598 — Run this as a noisy, kinetic icebreaker! Debrief ties to Hofstadter: "Is the *pointing* the thought?"
