  Okay, let me start by unpacking this user's argument. They're a retired evolutionary biologist with a strong background in selection experiments and population genetics, particularly in sex-ratio distortion in flies. They've spent the last two years diving into philosophy of mind, leading them to teleosemantics. Their argument challenges the etiological account of biological functions, which they see as central to teleosemantics.

  The core issue is the underdetermination of function by historical selection. The user lists six steps arguing that since multiple effects are correlated, selection history alone can't distinguish which effect was truly selected for. This leads to content indeterminacy in teleosemantics. They feel this conclusion is too strong because their career involved confidently assigning functions, suggesting a tension between theory and practice.

  First, I need to identify where the argument might falter. The user suspects steps 3 or 4. Step 3 claims that selection facts don't distinguish selected effects from correlates. Step 4 says counterfactuals are imported, not part of selection facts. But in evolutionary biology, we use comparative methods and experimental data to infer functions, which implicitly rely on counterfactual reasoning. For example, when we study vestigial structures or use gene knockouts, we're testing what would happen without certain traits. So step 3 might overlook how biologists actually use evidence beyond mere lineage statistics.

  Step 4's dismissal of counterfactuals as "imported" ignores that science often uses such reasoning legitimately. Propensity interpretations in fitness or causal modeling in biology incorporate counterfactuals naturally. Denying them would cripple scientific practice. The user’s concern about sliding from "not settled by data" to "indeterminate" is valid—lack of direct evidence doesn’t mean indeterminacy; it means we need more evidence.

  The user’s deeper need is reconciling their practical experience with the philosophical theory. They want to know if teleosemantics can be salvaged without losing naturalism. Admitting counterfactuals or propensities might be necessary, but are these still naturalistic? Propensity theories of fitness are well-established in biology, so integrating them maintains naturalism. Teleosemantics could then ground content in dispositions shaped by history, not just past events.

  I should also address whether functions are indeterminate. In practice, biologists use multiple lines of evidence (comparative, developmental, experimental) to reduce underdetermination. While perfect certainty might be elusive, robust inferences are possible. Thus, rejecting step 6 is feasible—functions can be determinate enough for scientific purposes.

  The user might worry that this moves away from pure historical facts. But teleosemantics can incorporate propensities as part of a naturalistic framework. The key is linking historical success to ongoing dispositions, which still relies on evolutionary mechanisms. This preserves the core of teleosemantics while addressing the underdetermination problem.
answer: |-
  Your argument is incisive and exposes a genuine tension in etiological teleosemantics. I reject **step (4)** as the critical misstep, though step (3) requires refinement. Here’s why, what it costs, and how it preserves biology’s practice while salvaging teleosemantics:

  ### Why Step (4) Fails
  1. **Counterfactuals *Are* Part of Selection Explanations**:  
     You rightly note that population-level facts (frequencies, fitness differences) alone underdetermine *which effect* was selected for. However, step (4) incorrectly dismisses counterfactuals as "imported" rather than integral to evolutionary theory. In practice, biologists *do* resolve underdetermination by invoking **stabilizing selection** and **robustness across environments**.  
     
     - **Example**: Hearts pump blood *robustly* across environments where noise correlates weakly with fitness (e.g., in sound-dampening tissues or silent organisms). The counterfactual "had pumping been detached from noise, pumping would still be selected" isn't arbitrary—it reflects empirical evidence from comparative anatomy, developmental constraints, and fitness landscapes. When we observe hearts evolving in lineages where noise is uncorrelated with survival (e.g., in deep-sea fish with reduced acoustics), pumping remains adaptive.  
     
     - **Philosophical Grounding**: Millikan’s "Normal Conditions" (1984) and Neander’s "Stabilizing Theory" (1991) explicitly incorporate such counterfactuals. Functions are fixed by effects that would have been selected for across *modal* environments in the lineage’s history. This isn’t "importing" extraneous metaphysics; it’s inferring **dispositions** from historical patterns.

  2. **The Slide in (4)**:  
     Your suspicion is correct: (4) conflates "not settled *solely* by population-level data" with "indeterminate." Evolutionary biology uses **multiple lines of evidence** (e.g., genetic covariance, trait-environment correlations, experimental perturbations) to constrain counterfactuals. This is analogous to distinguishing causal effects from confounders in epidemiology—underdetermination is resolved through auxiliary data.

  ### What Rejecting (4) Costs Teleosemantics
  1. **Admitting Propensities/Dispositions**:  
     Teleosemantics must embrace **propensity interpretations of fitness** (Brandon 1978). A trait’s function isn’t just "what it did" historically but **what it was disposed to do** in virtue of its structure, given ancestral environments. This requires:
     - A naturalistically respectable account of dispositions (e.g., probabilistic causal capacities grounded in physical properties).
     - Commitment to modal facts about evolutionary trajectories (e.g., "hearts *would* have been selected even without noise").

  2. **Retains Naturalism**:  
     Propensities are not supernatural. They reduce to:
     - **Structural properties**: A heart’s pumping capacity supervenes on its muscular architecture.
     - **Environmental regularities**: Water’s buoyancy, oxygen’s metabolic role—these are natural facts that support counterfactuals.  
     Teleosemantics still avoids dualism: content is fixed by evolutionary history + physical dispositions.

  ### Why Steps (1)–(3) Hold, but Don’t Sink Teleosemantics
  - **(1)–(3)** correctly state the underdetermination problem. However, biologists resolve it through:
    - **Comparative methods**: Identifying trait homologues across lineages where correlates diverge.
    - **Manipulation experiments**: Knocking out noise in model organisms (e.g., cardiac mutants) tests if pumping remains adaptive.
    - **Developmental constraints**: Noise may be a physical byproduct with no independent genetic basis, making it ineliminable but not "selected for."  
    This evidence provides **empirically grounded counterfactuals**, turning underdetermination into a tractable epistemic challenge.

  ### Why (5) and (6) Don’t Follow
  - **Content isn’t uniquely problematic**: Belief-producing mechanisms face the same underdetermination as hearts, but the same tools resolve it. For example, frog visual systems snap at small, dark moving objects (flies or BBs). The function is "detect prey" because:
    - Frogs starve if only exposed to BBs (fitness cost without nutrition).
    - In ancestral environments, dark moving objects were robustly flies (Sterelny 1990).
  - **Indeterminacy ≠ Nonexistence**: Some vagueness remains (e.g., "detect flies" vs. "detect nutritious moving targets"), but this mirrors biology’s grain of explanation. We accept "pump blood" as determinate despite borderline cases (e.g., embryonic hearts). Teleosemantics can live with **degrees of determinacy** without collapsing.

  ### Conclusion: Your Career Wasn’t an Illusion
  - **Reject step (4)**: Counterfactuals are legitimate components of evolutionary explanations, constrained by empirical biology.  
  - **Teleosemantics survives** by embracing propensities, which are naturalistic and already latent in biological practice.  
  - **Indeterminacy is bounded**: It arises only in rare, contrived cases (e.g., traits with perfectly invariant correlates). In practice, your functional attributions were robust because lineages exhibit variation that breaks correlations.  

  This repairs teleosemantics while honoring your lifetime of work: functions are fixed by **historical selection for dispositions**, inferred through evidence that includes—but isn’t limited to—population-level data. The result is a naturalistic theory of content, albeit one requiring modal commitments already at home in evolutionary biology.

  *Recommended reading*:  
  - Neander, K. (1991) *Functions as Selected Effects*  
  - Millikan, R. (1984) *Language, Thought, and Other Biological Categories*  
  - Brandon, R. (1978) *Adaptation and Evolutionary Theory*.
