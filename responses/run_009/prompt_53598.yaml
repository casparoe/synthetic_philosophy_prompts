  Ok so I'm in a game theory course and we just covered the centipede game, and I want your honest credence that backward induction gets the right answer in the textbook version — two players, the pot grows each round, either player can grab on their turn, grabbing ends the game, it's common knowledge both players want to maximize their own payoff, and backward induction says player 1 grabs immediately at the first node even though both players walk away richer if they let it run. Don't tell me "it depends on your solution concept" — I want a number with the decomposition. I'd split it roughly like this: (a) the probability that common knowledge of rationality is even coherant here, given that reaching any later node already contradicts what the earlier steps of the induction assumed (the backward induction paradox stuff — if player 2's node gets reached, that's already evidence player 1 wasn't rational, so what exactly is player 2 entitled to assume about player 1's future moves, and are those counterfactuals well defined at all?); (b) the probability that "rational" in this setup should mean plain payoff-maximizing given beliefs, versus something that lets players draw inferences from the fact that a node was reached at all (my TA keeps saying the whole answer changes if you weaken common knowledge of rationality to just rationality-at-the-reached-node, which sounds right to me but I can't quite reconstruct why); (c) the probability that the experimental result — basically nobody takes at node 1 when real people play — is actually relevant to the normative question and not just a fact about humans not being idealized agents. Give me a rough probability for each with one line of justification, then combine them into your overall credence, then tell me which piece is doing the most work and what evidence or argument would move that piece the most. My prof talks like this paradox got solved decades ago and I'm honestly not sure it was.
