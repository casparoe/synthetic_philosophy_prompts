prompt: |-
  I'm a senior undergraduate currently taking a graduate seminar on conditionals, on the philosophy of language / formal semantics track, and our take-home final is in three weeks. The past papers our instructor released are almost all recall questions — state Stalnaker's thesis, name some responses to Lewis — so they're useless for distinguishing people who understand the material from people who have memorized the labels. I want one genuinely hard practice essay question to bring to my study group, along with a model answer and a marking scheme, so that we can grade each other's attempts under realistic exam conditions.

  Please draft the following for me.

  The question should be pitched at an upper-level seminar audience, answerable in about sixty minutes by hand, and designed so that it cannot be answered by summarizing the literature. It should be built around a proposal that keeps coming up in our study group. We noticed that David Lewis's 1976 triviality proof in the Philosophical Review, on probabilities of conditionals and conditional probabilities, seems to require that the Equation — the thesis that the probability of an indicative conditional equals the corresponding conditional probability — holds for every probability function defined over the algebra, and one of us thinks that is the weak point. His suggested fix: perhaps the Equation is only ever meant to hold for the credence function of a single, ideally rational agent at a time — the probabilities the agent actually assigns — rather than for arbitrary functions over the same algebra. Since the proof quantifies over probability functions generally, it would then simply fail to apply. The exam question should ask the student to evaluate this escape: reconstruct the proof carefully enough to say exactly where it needs probabilities beyond the agent's own, and then determine whether the escape works or collapses.

  The model answer should run about 600 words, and the marking scheme should separate an A answer from a B answer by naming the specific moves each must contain. My own suspicion, which I'd like the scheme to test, is that the crux is that Lewis's argument needs only one probability function, together with conditionalization on the members of a partition, so that the single-agent restriction buys nothing unless it restricts which probability functions the Equation is claimed to cover — and I'd like the scheme to reward students who see that, while docking answers that merely catalogue the standard positions. You may refer to positions and arguments by name where that helps, but the question must not ask for a bibliography, reading list, or citations, since we will be writing this by hand in a seminar room. As a final touch, the scheme may attach a small amount of distinction-level credit for explaining why counterfactual conditionals do not come under the same pressure, but the question itself should stay focused on indicatives.
