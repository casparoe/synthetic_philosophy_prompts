prompt: |-
  I've been keeping a list of my gut verdicts on which of my own beliefs survive learning about their evolutionary origins, in order to work out how far I think evolutionary debunking arguments actually reach, and I'd like help extracting the principle behind the verdicts, if there is one. My belief that ripe fruit is sweet: I learn that the taste system was selected because sugar is calorically valuable, and the belief feels entirely undamaged — if anything the genealogy explains why it's reliable. My aversion to brother-sister incest: I learn it was selected because it kept ancestors clear of inbreeding depression, and here I do feel the debunking — I think the aversion loses its authority as a moral guide in cases where the genetic risk it was tuned to is absent, say a sterile couple raised apart who meet as adults. My belief that pain is bad and to be prevented: I learn that pain-avoidance was selected because it got organisms away from tissue damage, and the belief feels completely undamaged — pain really is bad, not merely fitness-enhancing to flee. My belief that my children matter more to me than strangers' children do: I learn kin-selected partiality, and while I notice the genealogy, I don't feel debunked in the same way I do about the incest case. My beliefs in elementary arithmetic and modus ponens: presumably these capacities were also shaped by selection, but I can't make myself feel any pressure at all. My belief in objective moral facts — that some things are wrong independently of what anyone thinks: this is where I feel the pressure most. And my belief that the suffering of distant strangers matters exactly as much as my own: this one I feel pulled in both directions, since impartiality looks like a thin cultural layer over evolved parochialism, yet I trust my impartial convictions more than my parochial ones. The tension I keep hitting is this: the incest verdict and the pain verdict seem to demand opposite principles — the aversion whose content tracked a real fitness-relevant fact gets debunked while the aversion whose content tracked fitness even more directly does not — and the arithmetic verdict and the moral-facts verdict seem to demand opposite principles too, since selection favored logical and mathematical reliability for the same reason it favored useful moral attitudes, whatever exactly that reason was. My tentative principle is that a belief survives its genealogy when the evolutionary explanation works by rewarding organisms whose beliefs were true, so that the selection pressure itself requires a truth-connection; but this seems to rescue the incest aversion, which I wanted debunked, and I can't tell whether it rescues pain's badness or merely presupposes it. Can you state the principle, or a small set of competing candidates, precisely enough to be tested; tell me which clause each of my verdicts is supposed to flow from; and tell me what the best candidate says about cases I haven't listed — the reliability of my memory, my confidence that the sun will rise tomorrow, my belief that torturing an animal for fun is wrong, and my belief in the soundness of the debunking argument itself? I would also like an honest accounting of which of my verdicts, on your best principle, has to go.
reasoning: |-
  Okay, the user is grappling with evolutionary debunking arguments and trying to find a consistent principle behind their intuitive verdicts on various beliefs. Let me start by understanding their examples. They have different reactions to beliefs like ripe fruit being sweet, incest aversion, pain being bad, kin preference, arithmetic, moral facts, and impartial suffering. The tension they note is that incest aversion feels debunked while pain aversion doesn't, even though both track fitness. Similarly, arithmetic feels solid but moral facts feel shaky under evolutionary explanation.

  First, I need to recall what evolutionary debunking arguments are. They suggest that if a belief is shaped by evolution for survival rather than truth, it might be unreliable. The user's challenge is that their intuitions don't align uniformly. For example, ripe fruit's sweetness isn't undermined because evolution selected for accurate taste perception. Incest aversion, however, feels debunked because it's tied to genetic risks, which might not apply in all cases. Pain being bad feels undamaged, which is interesting because it's directly linked to avoiding harm, a real thing.

  The user's tentative principle is that beliefs survive if evolution rewards true beliefs. But that seems to save incest aversion, which they want debunked. So maybe there's a distinction between beliefs tracking mind-independent truths versus adaptive ones. Incest aversion might be seen as a social norm or heuristic, not a moral truth, whereas pain's badness is a direct experiential truth. 

  Looking at the moral facts belief, the user feels pressure because morality might be subjective, evolved for social cohesion. But for arithmetic, evolution likely favored accurate reasoning, so truth-tracking is inherent. The impartial suffering belief is tricky because impartiality might be culturally layered over evolved parochialism, but they trust it more. This suggests a possible distinction between beliefs that can be externally validated versus those that can't.

  Possible principles could include Cognitive vs. Practical Domains, where cognitive beliefs (like sensory or logical ones) are truth-apt, but practical ones (moral or aversive) are adaptive. Another is Tracking vs. Constituting, where some beliefs track independent facts (pain), while others constitute the domain (morality). Or Reliability vs. Authority, where reliability isn't enough if the belief's authority is undermined in certain contexts, like incest aversion in sterile couples.

  Testing these against their examples: Ripe fruit fits Cognitive Domain and Tracking. Incest aversion fits Practical and maybe Constituting if morality is constructed. Pain fits Tracking since harm is real. Kin preference might be Practical but not debunked for them, which complicates things. Arithmetic clearly fits Cognitive and Tracking. Moral facts struggle under Constituting. Impartial suffering is split, maybe seen as an extension beyond evolution.

  For unlisted cases: Memory reliability might be Truth-Tracking. Sunrise confidence could be Inductive Justification. Torturing animals wrong might depend on whether morality is seen as objective. The debunking argument itself needs to avoid self-defeat, so it must be in a Cognitive Domain.

  The user might need to adjust their incest verdict if adopting Truth-Tracking, or accept that pain's badness is presupposed. Alternatively, they could refine principles to separate domains where evolution directly targets truth versus those where it doesn't. The key is whether the content of the belief references mind-independent facts. Pain does, incest aversion might not in moral terms. Moral facts' objectivity is the core issue—if morality isn't mind-independent, then evolution explains it without truth-tracking. The user's impartiality conviction might rely on rational endorsement over evolutionary instincts, suggesting a dual-process where reasoned beliefs can override evolved ones.
answer: |-
  Based on your detailed case studies and the underlying tension, here are the most promising candidate principles, precisely stated, along with their implications for your verdicts, new cases, and which verdicts might need revision:

  **Candidate Principles:**

  1.  **The Truth-Tracking Principle (TTP):** A belief survives its evolutionary genealogy if the mechanism producing it was selected *specifically because it tracked mind-independent truths relevant to fitness*. The selection pressure must directly favor *accuracy* for the belief to retain its justification/authority.

  2.  **The Domain-Constitution Principle (DCP):** A belief survives its genealogy if the domain it concerns (e.g., logic, mathematics, phenomenal experience) is constituted by the cognitive faculties evolution shaped, *and* those faculties reliably produce beliefs within that domain *when functioning as designed*. Beliefs in domains constituted *by* our faculties (like logic or pain) survive; beliefs *about* mind-independent domains our faculties merely track (like morality or fitness risks) are vulnerable.

  3.  **The Authority-Undermining Principle (AUP):** Evolutionary origins debunk a belief when they reveal that the *source of the belief's felt authority* (e.g., its intuitive compellingness, perceived objectivity) is *exclusively* explained by its adaptive function, *and* this function is decoupled from the truth conditions the belief purports to represent in contexts beyond its evolutionary origin. The belief loses normative force when its felt authority stems from fitness, not truth.

  4.  **The Robust Reliability Principle (RRP):** A belief survives if *the specific content* of the belief remains reliably true *across the vast majority of contexts we encounter*, including those significantly different from the EEA, *and* this reliability isn't merely a lucky coincidence of the genealogy. Genealogy that explains *why* the belief is robustly reliable preserves it; genealogy showing reliability is fragile or context-bound debunks it.

  **Analysis of Your Verdicts & Principles:**

  | Belief                  | Your Verdict      | TTP Verdict | DCP Verdict | AUP Verdict | RRP Verdict |
  |-------------------------|-------------------|-------------|-------------|-------------|-------------|
  | **Ripe Fruit Sweet**    | Survives          | Survives    | Survives    | Survives    | Survives    |
  | **Incest Aversion**     | Debunked          | Survives*   | Debunked    | Debunked    | Debunked    |
  | **Pain is Bad**         | Survives          | Survives*   | Survives    | Survives    | Survives    |
  | **Kin Preference**      | Survives (Partial)| Survives*   | Debunked    | Debunked    | Debunked*   |
  | **Arithmetic/Logic**    | Survives          | Survives    | Survives    | Survives    | Survives    |
  | **Objective Morality**  | Debunked Pressure | Debunked    | Debunked    | Debunked    | Debunked    |
  | **Impartial Suffering** | Tension           | Debunked    | Debunked    | Debunked*   | Debunked*   |

  *   **TTP:** Explains *Ripe Fruit* (tracks sugar), *Pain* (tracks harm avoidance), *Logic* (tracks abstract relations). *Fails* your **Incest Verdict** (it *should* survive as it tracked a real risk). Struggles with *Kin Preference* (tracks relatedness) & *Morality* (doesn't obviously track mind-independent truths). Your **Pain Verdict** survives, but the "badness" is presupposed as the truth tracked, not proven by TTP.
  *   **DCP:** Explains *Ripe Fruit* (sensory domain), *Pain* (phenomenal domain), *Logic* (constitutive domain). Explains debunking of **Incest** (morality isn't constituted by evolved aversions), **Morality** (same). Captures your **Pain**/**Logic** vs. **Incest**/**Morality** split. *Challenges* your **Kin Preference** verdict (why no debunking feeling?).
  *   **AUP:** Best explains your **Incest Verdict** – its felt *moral authority* stems from an aversion tuned to fitness, not moral truth, especially in sterile cases. Explains **Morality** pressure. Explains tension in **Impartial Suffering** (parochialism feels evolutionarily "authentic," impartiality feels culturally imposed, yet trusted). Explains why **Pain** survives (its authority stems from the experience itself). *Challenges* **Kin Preference** verdict (its authority seems evolutionarily implanted).
  *   **RRP:** Explains **Ripe Fruit**, **Pain**, **Logic** (reliable everywhere). Explains debunking **Incest** (unreliable in sterile cases), **Morality** (widespread disagreement/sensitivity suggests fragility). Explains tension on **Impartial Suffering** (reliability feels culturally contingent, not robust). *Challenges* **Kin Preference** (reliability for genetic fitness, but not necessarily for modern moral contexts).

  **Analysis of New Cases:**

  1.  **Memory Reliability:** TTP/DCP/RRP: Likely survives (selected for accuracy in representing past experiences/events relevant to survival). AUP: Survives (authority stems from seeming direct recall, not just fitness).
  2.  **Sunrise Tomorrow:** TTP/DCP/RRP: Survives (inductive reasoning selected for reliability; celestial patterns highly stable). AUP: Survives (authority stems from induction, not just fitness).
  3.  **Torturing Animals for Fun is Wrong:** TTP: Debunked (no clear mind-independent truth tracked). DCP: Debunked (morality not constituted by faculties). AUP: **Debunked** (felt authority stems from evolved empathy/aversion to suffering, potentially culturally amplified, not objective wrongness). RRP: Debunked (widespread disagreement/cultural variability suggests unreliability).
  4.  **Soundness of Debunking Argument Itself:** Critical case! TTP: Must survive (if logic/reasoning are truth-tracking). DCP: Must survive (logic is constitutive). AUP: Must survive (its authority stems from rational force, not just fitness – though its *motivation* might be!). RRP: Must survive (robustly reliable reasoning). *Any viable principle must avoid self-defeat by preserving the justification of the reasoning used in the debunking argument.*

  **Best Candidate & Verdicts to Reconsider:**

  *   **Strongest Candidate: Authority-Undermining Principle (AUP).** It best captures the *phenomenology* you describe – the *feeling* of authority dissipating when you realize the compellingness stems from fitness programming decoupled from the purported truth (incest aversion as moral authority) vs. surviving when the authority feels intrinsic to the content (pain, logic). It directly addresses your core tension (incest vs. pain) by focusing on the *source of normative force*.
  *   **Runner-Up: Robust Reliability Principle (RRP).** It effectively separates beliefs robustly true across contexts (fruit, pain, logic) from those sensitive to EEA conditions (incest aversion) or lacking clear truth-conditions (morality). It explains the sterile incest case perfectly.

  **Verdicts You Likely Need to Revise (on AUP/RRP):**

  1.  **Kin Preference ("...matter more..."):** Your lack of strong debunking feeling is the outlier. Both AUP (its authority *is* evolutionarily implanted) and RRP (its reliability is for genetic fitness, not modern moral obligations) suggest it *should* feel debunked to a similar degree as incest aversion, or at least more than it does. You might be conflating the *existence* of the preference (undeniably evolved) with its *normative authority* regarding how one *ought* to act morally. The principle suggests the latter should be vulnerable.
  2.  **Impartial Suffering ("...matters exactly as much..."):** While you trust it, AUP/RRP suggest the *felt objectivity/authority* of this belief is vulnerable. AUP: Its authority likely stems from rational cultural construction overriding parochialism, not tracking a mind-independent truth. RRP: Its reliability is highly culturally contingent and evolutionarily novel. Your trust might stem from *endorsing* the cultural construction rationally, but the evolutionary genealogy *does* debunk any sense that its authority comes from something other than this rational cultural project.

  **Conclusion:** The Authority-Undermining Principle (AUP) best explains your intuitive pattern, particularly the core tension between incest aversion and pain's badness. It focuses on whether the *felt normative force* of the belief stems from its purported truth or merely its adaptive history. This principle debunks the authority of incest aversion as a moral guide, objective morality, and impartial suffering's felt objectivity, while preserving sensory beliefs, pain, and logic. It also explains the tension in impartial suffering. However, it requires you to reconsider why your kin preference belief doesn't feel debunked similarly to incest aversion – the principle suggests it should. The Robust Reliability Principle (RRP) is a strong alternative, particularly for its handling of context-sensitivity. Both require accepting that the normative force of kin preference and the felt objectivity of impartial suffering are more vulnerable to debunking than your initial reactions suggest.
