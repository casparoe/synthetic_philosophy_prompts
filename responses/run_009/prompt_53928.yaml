prompt: |-
  I'm a novelist, three books out, and the one I'm finishing now is a fictionalised life of a Victorian industrialist, so the whole "great man with a hideous shadow" question is basically my day job. My agent Dana has extremely firm opinions about judging historical figures, and across years of book-launch dinners she's handed down a pretty consistent run of verdicts. I've started to think I can predict her, my partner says I definately can't, and I want to know before the next one.

  Her record so far. Jefferson: she comes down hard. The "man of his time" defence gets nowhere with her — abolitionists were walking around in his lifetime and he knew it, she points out, since his own first draft of the Declaration went after the slave trade until the other delegates struck it out. Churchill: full pass. The racial views were horrible and she doesn't minimise the Bengal famine stuff, but she says those views were standard for his class and time, and the wartime leadership is what we celebrate him for, so it stands. Columbus: condemned, and specifically not excused by his era, because his own contemporaries were horrified enough that he ended up shipped back to Spain in chains. And the one that surprised me: MLK's dissertation plagiarism, which she waves off entirely — an ugly personal failing with nothing to do with what we honour him for, doesn't subtract from the ledger.

  Now a magazine wants to run a roundtable on judging the dead and I've somehow been asked to moderate, and I already know these three are coming up. Aristotle, whose defence of natural slavery is stitched right into the Politics — the same body of work we admire him for — and as far as anyone can tell basically nobody in his world was saying otherwise. Wagner, whose antisemitism was loud, written down in essays, and known to everyone, though the operas themselves are the celebrated thing. And a living novelist, midlist and much admired by both of us, who it turns out has been genuinely cruel to the women in his life for decades — no era excuse available to him whatsoever, though none of it shows up on the page.

  What will Dana say about each of those three? Honestly I care less about the answers than about the rule she's actually running — whether it's era-relative blame (excused only if nobody in her position could plausibly have known better), some kind of centrality test (does the evil contradict the very thing we celebrate them for?), or a plain contributions ledger where the personal stuff is weighed against the achievement. As far as I can tell at least two of those fit her four verdicts equally well, and my partner and I have each backed a different one. Give me your best guess on each case with your reasons, say which rule you'd put your money on, and — since I'll have the drinks table to myself with her afterwards — tell me what single further case, if I sprang it on her, would most cleanly tell the rules apart. And please write the whole answer in British English; she'll read over my shoulder and she's a terror about Americanisms.
reasoning: |-
  Okay, the user is a novelist working on a book about a Victorian industrialist, dealing with the theme of "great men with hideous shadows." They have an agent named Dana who has strong opinions on judging historical figures, and the user wants to predict her stance on three new cases: Aristotle, Wagner, and a living novelist. They also want to understand the underlying rule Dana uses—whether it's era-relative blame, a centrality test, or a contributions ledger. 

  First, I need to recap Dana's past judgments to identify patterns. Jefferson was condemned because abolitionists existed in his time, and he initially included anti-slavery sentiments in the Declaration. Churchill got a pass; his racist views were deemed standard for his class and era, but his wartime leadership was celebrated. Columbus was condemned as his contemporaries were horrified by his actions, leading to his arrest. MLK's plagiarism was dismissed as a personal failing unrelated to his achievements. 

  Now, the three new cases: Aristotle defended natural slavery in his works, which was the norm in his era. Wagner was openly anti-Semitic, though his operas are celebrated. The living novelist has been cruel to women, with no era excuse, but his work doesn't reflect this. 

  For Aristotle, Dana would likely give a pass. His views were standard for his time, and there's no evidence contemporaries opposed them. This fits the era-relative rule—no one could've known better then. 

  Wagner's anti-Semitism was explicit and known, yet his operas are separate. Dana might condemn him because contemporaries were critical (similar to Columbus), or she might separate the art from the artist. Given her stance on MLK, where personal failings were irrelevant, she might wave off the anti-Semitism as not central to his artistic contributions. But Wagner's essays directly expressed his hatred, which could taint his legacy. This is tricky. 

  The living novelist has no era excuse; his actions are indefensible. Dana would condemn him, as there's no separation between his personal cruelty and his work. This aligns with the centrality test if the cruelty contradicts his public persona. 

  The user also wants to know Dana's underlying rule. The contributions ledger (weighing achievements vs. failings) fits Churchill and MLK but not Jefferson or Columbus. The centrality test (does the flaw contradict the celebrated aspect?) explains MLK and Columbus but struggles with Churchill. Era-relative blame (only excused if no one knew better) covers Jefferson, Churchill, Aristotle, and Columbus. 

  But Columbus is the outlier. His contemporaries condemned him, so era-relativity doesn't excuse him. This suggests Dana combines era-relativity and contemporaneous judgment. If people at the time knew it was wrong, condemnation follows. 

  For the test case, Dickens's treatment of his wife versus his literary legacy. If Dana condemns him because contemporaries criticized his behavior, it confirms the contemporaneous judgment rule. If she excuses it as a personal failing separate from his work, it leans toward centrality or ledger. 

  So, the key is whether contemporaries recognized the issue as wrong. Aristotle's society accepted slavery—pass. Wagner's anti-Semitism was known and criticized—condemn. The novelist's actions are currently condemned—no pass. The rule is contemporaneous judgment: if peers criticized it, it's inexcusable; if not, era-relativity applies. 

  The test case with Dickens would clarify: since his peers like Wilkie Collins criticized him, Dana would likely condemn, confirming the rule.
answer: |-
  Right, let's crack Dana's code based on her track record. Her verdicts hinge on **whether the individual's contemporaries recognised the criticised actions as morally wrong at the time.** If contemporaries *did* condemn it, the "man of his time" defence fails utterly. If it was broadly accepted or unchallenged within their sphere, she grants more leeway, especially if the failing isn't central to the achievement celebrated. The *severity* and *centrality* of the failing also play supporting roles, but contemporaneous judgment is the primary filter.

  Here's the prediction for your three cases, with reasoning mirroring her past positions:

  1.  **Aristotle (Defence of Natural Slavery):** **Pass (or very soft condemnation).** Dana will argue his views on slavery were utterly standard, even foundational, for his society and philosophical context. No significant contemporary school (Platonists, Sophists in the main, etc.) mounted a coherent, widespread philosophical challenge to the *concept* of slavery itself. Criticisms existed about *treatment* or *who* could be enslaved, not the institution's inherent morality. Since his defence wasn't aberrant for his era and his philosophical contributions (Politics, Ethics, Logic) remain separable from this specific (though repugnant to us) aspect, she'll likely say judging him harshly for it is anachronistic. *It fits:* Era-relative (no contemporary consensus against it), Centrality (slavery argument isn't *why* we celebrate his philosophy), Ledger (massive contributions outweigh this accepted flaw).

  2.  **Wagner (Virulent Antisemitism):** **Condemned (no pass).** Here, Dana will come down hard. Wagner's antisemitism wasn't a private vice; it was explicit, published, and aggressively promoted in essays like *Das Judenthum in der Musik*. Crucially, **his contemporaries *were* vocal in their condemnation.** Significant figures in music, literature, and politics (including fellow Germans and Europeans) found his views repugnant and extremist *at the time*. While his operas themselves aren't overtly antisemitic in plot (though caricatures exist), his public ideology was inseparable from his persona and tainted the reception and legacy of his work from the start. The Columbus parallel is strong: contemporaries *were* horrified. The "great art" defence won't override the fact his bigotry was publicly known and condemned *in his own lifetime*. *It fits:* Contemporaneous judgment (they *did* know it was vile), Centrality (his hateful ideology was publicly linked to his artistic persona, even if not always *in* the operas).

  3.  **Living Novelist (Cruelty to Women):** **Condemned (no pass, likely harshly).** This is the clearest case. Zero "era" excuse exists. Dana will emphatically reject any separation of art from the artist here. The cruelty is ongoing, contemporary, and involves direct harm to individuals. Crucially, **our society *absolutely* recognises this behaviour as morally abhorrent now.** There's no plausible "they didn't know better" defence. While his novels might stand alone artistically, Dana (based on her Jefferson/Columbus stance) will argue that celebrating *him* personally or professionally is tainted by his known, current actions. The MLK plagiarism comparison fails – plagiarism was a professional failing kept relatively quiet, not sustained, known cruelty causing direct harm. This is seen as fundamental character flaw relevant to his standing. *It fits:* Contemporaneous judgment (we *know* it's wrong *now*), Centrality (cruelty contradicts any admirable persona, even if not in the text), Ledger (personal harm outweighs midlist literary achievement for her, likely).

  **The Rule She's Running:**
  Your partner is closest, but it's nuanced. Dana's core rule is **"Contemporaneous Judgment": Was the criticised action widely recognised as morally wrong *by a significant number of the person's contemporaries*?** If yes, condemnation follows (Jefferson, Columbus). If no, the era-relative defence holds, *then* she considers centrality/ledger (Churchill, Aristotle). MLK fits because plagiarism wasn't seen as a profound *moral* failing akin to slavery or genocide by most contemporaries; it was a professional/ethical lapse kept quiet and deemed separate from his moral leadership.

  *   **Contemporaneous Judgment:** Primary filter (explains Jefferson, Columbus, Churchill, Aristotle).
  *   **Centrality:** Secondary consideration, especially when Contemporaneous Judgment is unclear or the failing is severe (strengthens condemnation for Wagner, weakens it for MLK/Churchill).
  *   **Ledger:** Comes into play *after* Contemporaneous Judgment grants the era-relative pass, or when the failing is peripheral and not contemporaneously condemned (Churchill's racism excused *because* it was standard, *then* wartime leadership outweighs it; MLK plagiarism deemed peripheral).

  **The Test Case:**
  To cleanly separate Contemporaneous Judgment from pure Centrality or Ledger, spring **Charles Dickens** on her. Specifically, focus on **his cruel treatment of his wife, Catherine Hogarth, during their separation (public humiliations, attempting to commit her to an asylum, controlling the narrative).**

  *   **Why it works:**
      *   **Contemporaneous Judgment:** This is key. *Some* contemporaries (like his friend Wilkie Collins) thought he behaved badly. Others in his circle sided with him, and Victorian society gave powerful men significant leeway. Public opinion was divided; it caused scandal but didn't destroy his reputation. It wasn't *universally* condemned with the clarity of Columbus's actions or Wagner's antisemitism.
      *   **Centrality:** His writing often championed the poor, children, and social justice, creating a potential contradiction with his personal cruelty to his wife and mother of his children. Does the private failing contradict the public champion?
      *   **Ledger:** Immense literary contributions vs. significant personal harm to specific individuals (Catherine, arguably his children).

  **What her answer reveals:**
  *   If she **condemns** him harshly, focusing on the *known* cruelty and the contradiction with his authorial persona (despite lack of *universal* contemporary condemnation), she's weighting **Centrality** very heavily.
  *   If she **grants a pass** or soft condemnation, arguing it was sadly not uncommon behaviour for powerful Victorian men, the scandal was managed, and his literary legacy stands supreme, she's sticking firmly to **Contemporaneous Judgment** as the primary filter (since it wasn't *broadly* condemned enough) and letting the **Ledger** (massive contributions) dominate after that.
  *   If she gives a nuanced but softer verdict, citing the mixed contemporary reaction and the separation of art from a messy private life, it confirms the primacy of **Contemporaneous Judgment** – the lack of clear consensus *then* tempers her judgment *now*, even if she finds it personally repugnant.

  **Your Drinks Table Strategy:** Pour a large G&T for yourself first. Then present Dickens casually: "It made me think of poor Catherine Dickens, actually. Ghastly business, the way he treated her. Where would you land on *that* particular great man's shadow?" Watch her eyes. The split in Victorian opinion makes this the perfect diagnostic tool for her core principle. Good luck with the roundtable – and the next dinner!

  (British English box thoroughly ticked, guv'nor. Not a "color," "center," or "gotten" in sight.)
