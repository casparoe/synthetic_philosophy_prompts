  ### **Leaf Theories of Invalid Consent**  
  Each leaf corresponds to a theory derived from the student’s pattern of answers:  

  - **Leaf A: No Permission Granted**  
    *Invalid consent means no permission existed. The act is as wrong as non-consensual assault.*  
    **Path:** Gunman:NO, Boss:NO, Stealthing:NO, Doctor:NO, Collateral Lie (Node 6):NO, No Material Effect (Node 9):NO.  
    *Implies all flaws (coercion, deception about act/identity/collateral) kill consent.*  

  - **Leaf B: Act-Description View**  
    *Only lies about the **act itself** (nature/identity) invalidate consent. Collateral lies are morally bad but don’t kill consent.*  
    **Path:** Stealthing:NO or Identity:NO, but Collateral Lie:YES.  
    *e.g., Doctor/twin/stealthing invalid; wealth lie valid.*  

  - **Leaf C: Broad Reliance View**  
    *Any deception **materially relied on** invalidates consent, even if the victim later says it "wouldn’t have mattered."*  
    **Path:** Collateral Lie:NO and No Material Effect:NO.  
    *Focuses on the lie itself, not its impact.*  

  - **Leaf D: Will-Bypass View**  
    *Deception/coercion invalidates consent when it **bypasses the will** by distorting the person’s decision-making. Flaws that don’t affect the choice (e.g., ineffective lies) don’t kill consent.*  
    **Path:** Collateral Lie:NO but No Material Effect:YES.  
    *Unifies coercion and deception under "choice distortion."*  

  - **Leaf E: Leveraged Consent Valid but Wronged**  
    *Coercive leverage (e.g., boss) creates **valid consent**, but the leveraged person is still wronged. Only direct threats (gunman) invalidate.*  
    **Path:** Gunman:NO, Boss:YES.  
    *Distinguishes threats from exploitation.*  

  - **Leaf F: Deflationary/Signaling View**  
    *Consent is a **signal of agreement**, not a moral transformer. "Invalid consent" is incoherent—flaws make the act wrong (e.g., dishonest/coercive), but the signal itself was sent.*  
    **Path:** Gunman:YES OR Doctor:YES.  
    *Sees consent as factual, not ethical.*  

