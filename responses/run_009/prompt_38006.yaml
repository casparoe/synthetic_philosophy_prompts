  ### **How to Use in Class**  
  1. **Handout:** Print the tree (omit this analysis). Students answer YES/NO for each node.  
  2. **Discussion:** When a student reaches a leaf, reveal the theory. Compare leaves—e.g., "Who thinks collateral lies *always* kill consent? Who thinks only if they mattered?"  
  3. **Cases 5 & 8:** Case 5 (no-material-effect lie) is in Nodes 8/9; Case 8 (intoxication) isn’t in the tree but can be debated at the end (e.g., "Would your theory call this valid?").  
  4. **Ambiguity Flags:** If a student’s answers are inconsistent (e.g., Gunman:YES but Boss:NO), discuss why.  

  This tree forces students to commit to patterns, exposing theories they might not articulate. By using concrete cases first, it avoids label-driven biases and focuses on intuitive judgments.
