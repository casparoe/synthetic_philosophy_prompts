  Below is a decision tree designed to sort students by their underlying theory of invalid consent using concrete scenarios. The tree has 8 internal nodes (case-based questions) and 6 leaf nodes (theories). Students answer each question based solely on the case description, without knowing the theories. The tree prioritizes logical consistency and reveals theories through pattern-matching across cases.  

  ---

  ### **Decision Tree for Consent Validity**  
  *Start at Node 1. Answer each question with YES/NO based on whether consent is **valid** in the scenario.*  

  #### **Node 1: Gunman (Case 7)**  
  *A gunman demands sex at gunpoint. The victim says "yes" to avoid being shot. Is this consent valid?*  
  - **NO** (coercion invalidates) → Node 2  
  - **YES** (coercion does not invalidate) → Node 7  

  #### **Node 2: Boss Leverage (Case 6)**  
  *A boss hints that a promotion depends on sexual favors. The employee agrees. Is this consent valid?*  
  - **NO** (leverage invalidates) → Node 3  
  - **YES** (leverage does not invalidate) → **Leaf E**  

  #### **Node 3: Stealthing (Case 3)**  
  *During sex, Partner A secretly removes the condom after Partner B consented only to protected sex. Is Partner B’s consent valid for the act that occurred?*  
  - **NO** (deception about the act invalidates) → Node 4  
  - **YES** (deception does not invalidate) → Node 5  

  #### **Node 4: Doctor Deception (Case 1)**  
  *A doctor lies that a procedure is "standard" while doing something experimental. The patient consents. Is this consent valid?*  
  - **NO** (nature-of-act deception invalidates) → Node 6  
  - **YES** (nature-of-act deception does not invalidate) → **Leaf F**  

  #### **Node 5: Identity Deception (Case 2)**  
  *An identical twin impersonates his brother to have sex with the brother’s partner. The partner consents, thinking it’s the brother. Is this consent valid?*  
  - **NO** (identity deception invalidates) → **Leaf B**  
  - **YES** (identity deception does not invalidate) → Node 8  

  #### **Node 6: Collateral Lie (Case 4)**  
  *A person lies about being rich and divorced to get sex. The other person consents. Is this consent valid?*  
  - **NO** (collateral lies invalidate) → Node 9  
  - **YES** (collateral lies do not invalidate) → **Leaf B**  

  #### **Node 7: Leveraged Offer Revisited (Case 6)**  
  *Same boss scenario as Node 2. The employee agrees. Is this consent valid?*  
  - **NO** → *Inconsistent path* → **Leaf F** (default)  
  - **YES** → **Leaf F**  

  #### **Node 8: Collateral Lie with No Material Effect (Case 5)**  
  *Same lie about wealth/divorce as Node 6, but the victim says afterward, "It wouldn’t have changed my decision." Is this consent valid?*  
  - **NO** (lie invalidates regardless of impact) → **Leaf C**  
  - **YES** (lie does not invalidate if no impact) → **Leaf D**  

  #### **Node 9: Collateral Lie Materiality Test (Case 5)**  
  *Same as Node 8: The victim says the lie "wouldn’t have changed my decision." Is this consent valid?*  
  - **NO** (lie invalidates even without impact) → **Leaf C**  
  - **YES** (lie invalidates only if it impacted choice) → **Leaf D**  

