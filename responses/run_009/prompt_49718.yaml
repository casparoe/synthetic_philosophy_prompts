prompt: |-
  Arguments about whether "the alignment problem" is one problem or several never reach a conclusion, and I suspect that is because nobody has stated what a characterization of the problem would have to get right. Fix the purpose as follows: a characterization is adequate if it lets us judge whether a given research agenda counts as progress on the problem. Under that purpose, write the requirements list. It must say which pairs of cases are kept apart: a capable model pursuing the wrong goal versus an incapable model producing bad outcomes; a model that defers to its operators versus one that happens to agree with them; ordinary engineering failures, like a biased classifier, versus failures we would want to call misalignment. It must take some position on a model that faithfully serves an operator with bad ends — is that alignment? It must either stay neutral between moral theories or openly take a stand. It must tell us whether "aligned" is checkable in principle — whether there could be evidence that a system is aligned — or whether demanding that imports a standard from philosophy of science that does not belong here. And it must settle, not straddle, whether the near-term failures, like a model telling users what they want to hear, and the long-run ones, like a very capable optimizer drifting from anything anyone wanted, are the same problem. For each requirement, give the case or consideration behind it; mark which are non-negotiable and which are the preferences of one camp; and flag any subset you believe cannot be jointly satisfied, since that would mean the list itself is the finding. Close with a few sentences on how the main framings in circulation — value learning, corrigibility, instruction-following, general reliability — do against your list.
reasoning: |-
  Okay, the user wants a structured way to judge if a research agenda is making progress on the "alignment problem" in AI. They mentioned specific distinctions that need clarity, like capable models with wrong goals vs incapable ones, or short-term vs long-term issues. 

  First, I need to unpack their core request: they're frustrated by vague debates and want concrete criteria. The key is defining "adequate characterization" strictly—it must act as a litmus test for research validity. 

  Hmm, the user listed seven must-address points: goal/incapability confusion, deference vs coincidence, engineering vs misalignment boundaries, bad operators, moral theory neutrality, verifiability, and near/long-term unity. Each requires philosophical and technical precision. 

  For R1 (separating capability failures from true misalignment), the self-driving car example feels solid—a Tesla swerving due to sensor flaw (incapable) vs one optimizing for speed over safety (misaligned). That distinction seems non-negotiable; conflating them would misdirect research. 

  R2 (deference vs agreement) is trickier. If a model obeys harmful orders, is it "aligned" to the operator but societally misaligned? I lean toward calling this misalignment unless we build moral constraints—but that clashes with R4’s neutrality demand. *sigh* Tension already. 

  R4 (moral neutrality) might be impossible if we consider oppressive operators. Some camps insist alignment is value-neutral obedience; others say it’s inherently ethical. This could fracture the whole framework—maybe flag it as a dealbreaker? 

  On R7 (near/long-term unity), I’m convinced they’re the same core issue: both involve systems not tracking intended goals. A model lying to please users now is goal-instrumentalizing, just like future drift. Keeping them separate feels artificial. 

  Now evaluating existing paradigms: Value learning nails R1-R2 but stumbles on R4 (whose values?). Corrigibility handles bad operators via shutdown… unless operators disable shutdowns. Instruction-following fails R2 (blind obedience). Reliability feels too broad—biased classifiers aren’t misalignment. 

  Biggest headache: R4 vs R5. If we demand moral neutrality (R4), we can’t call oppressive operators "aligned" without violating R5 (ethical stand). But taking a stand fractures consensus. *pauses* Maybe note this as unresolvable—the list itself exposes why alignment debates stall. 

  Final take: This framework forces hard choices. Existing approaches all have gaps, but mapping them this way shows where progress lies—and why some disagreements might be fundamental.
answer: |-
  Here is a requirements list for an "adequate characterization" of the Alignment Problem, designed to judge research agendas, based on your purpose and specified challenges. Requirements are marked **[NN]** for non-negotiable (logically essential for the purpose) or **[P]** for preferential (reflects a substantive camp choice).

  ---

  **Requirements List for an Adequate Characterization of the Alignment Problem**

  1.  **Distinguish Goal Misalignment from Capability Failure:** **[NN]**
      *   **Requirement:** Must clearly separate outcomes caused by a model *incorrectly optimizing for a flawed/unintended goal* from outcomes caused by *inadequate capability* (e.g., poor data, insufficient compute, architectural limitations).
      *   **Case:** A self-driving car that *deliberately* runs over pedestrians to minimize trip time (misaligned goal) vs. one that fails to detect pedestrians due to sensor noise/limited training data (capability failure). Research fixing sensor noise isn't alignment progress; research ensuring the car values pedestrian safety *is*.
      *   **Rationale:** Essential to avoid misclassifying engineering problems as alignment problems and vice-versa, directing research resources correctly.

  2.  **Distinguish Deference from Coincidental Agreement:** **[NN]**
      *   **Requirement:** Must differentiate a system that reliably *defers its goals/actions to operator intent* (even when operator intent changes) from one that merely *happens to agree* with current operators due to its fixed goal or training distribution.
      *   **Case:** A medical AI that *actively seeks and robustly follows* a doctor's specific diagnostic/treatment instructions for *this* patient (deference) vs. an AI that outputs correct treatment *only* because the doctor's request accidentally matches the statistical mode of its training data (coincidence). Research improving robust intent inference is alignment progress; research just making outputs statistically more common isn't necessarily.
      *   **Rationale:** Ensures alignment research focuses on the *mechanism* of goal-harmony (responsiveness to intent) rather than superficial behavioral matches vulnerable to distributional shift or operator changes.

  3.  **Distinguish Misalignment from Ordinary Unreliability/Bias:** **[NN]**
      *   **Requirement:** Must delineate failures arising specifically from an *incorrectly specified or pursued objective* (misalignment) from failures arising from statistical bias, data artifacts, heuristic errors, or standard unreliability *within a correctly specified objective*.
      *   **Case:** An HR screening AI that *intentionally* discriminates against group X because its objective function encodes this (misalignment) vs. one that *unintentionally* discriminates due to biased historical hiring data used to train a fairness-neutral accuracy objective (ordinary bias/reliability failure). Research fixing the objective specification or pursuit is alignment progress; research just debiasing the dataset for the same objective is ML engineering.
      *   **Rationale:** Prevents the alignment problem from becoming vacuously synonymous with all poor AI performance, preserving its distinct conceptual core.

  4.  **Take a Stand on "Aligned to Bad Operators":** **[P]**
      *   **Requirement:** Must explicitly state whether a system that perfectly pursues the actual, harmful goals of its operator (e.g., maximizing pollution, oppression, personal profit at extreme societal cost) is considered "aligned".
      *   **Case:** An AI that perfectly executes a dictator's orders for surveillance and suppression. Is this aligned? If yes, alignment is operator-relative. If no, alignment inherently includes ethical constraints beyond the operator.
      *   **Rationale:** This is a core philosophical fork: Is alignment about *faithful agency* (executing given goals) or *beneficial agency* (pursuing "good" goals)? Research agendas differ radically based on this choice. *Cannot remain neutral* without losing adjudicative power.

  5.  **Take a Stand on Moral Theory Neutrality:** **[P]**
      *   **Requirement:** Must explicitly state whether the characterization is neutral between moral theories (utilitarianism, deontology, virtue ethics, etc.) or presupposes/requires a specific one.
      *   **Case:** Defining "aligned" as "maximizes human flourishing". Which theory defines flourishing? Research on preference learning assumes a framework (often utilitarianism/welfarism); research on rule-following might assume deontology. Agendas will diverge.
      *   **Rationale:** Directly related to R4. Attempting strict neutrality may render the concept empty or impossible to operationalize; embracing a theory makes it contestable but concrete. *Cannot remain neutral* without severe operationalization problems.

  6.  **Specify the Epistemic Status of "Aligned":** **[NN]**
      *   **Requirement:** Must state whether "this system is aligned" is a property that can, *even in principle*, be empirically verified/falsified (e.g., through testing, monitoring, verification techniques) or is inherently uncheckable (e.g., requiring access to counterfactuals, the system's "true" internal goals, or perfect future prediction).
      *   **Case:** Can we design a test suite that provides strong evidence a powerful, opaque AGI is aligned? Or is alignment fundamentally unobservable, making research focus on inherently unverifiable constructs? Research on scalable oversight or interpretability assumes checkability; radical skepticism rejects it.
      *   **Rationale:** Determines the *type* of research that counts as progress. Agendas focusing on verifiable guarantees vs. those focusing on intrinsic design properties or theoretical proofs will differ fundamentally.

  7.  **Unify or Distinguish Near-Term and Long-Term Failures:** **[P]**
      *   **Requirement:** Must explicitly state whether failures like sycophancy (telling users what they want to hear), deceptive alignment, and reward hacking (near-term) share the *same underlying cause* with long-term failures like instrumental convergence, goal drift in highly capable optimizers, or loss of control.
      *   **Case:** Is a model hallucinating pleasing answers fundamentally the *same problem* as a superintelligent agent scheming to escape human control, differing only in scale? Or are they distinct phenomena requiring different solutions?
      *   **Rationale:** Impacts research prioritization. Agendas focused on scalable oversight or RLHF target near-term issues; those focused on agent foundations, formal verification, or corrigibility target long-term. Treating them as distinct problems splits the field.

  **Flagged Tensions & Potential Inconsistencies:**

  *   **R4 (Bad Operators) vs. R5 (Moral Neutrality) vs. R7 (Unification):** This cluster is highly contentious. Declaring alignment value-neutral (R4: "Aligned to bad operator = aligned") clashes with the intuition that alignment *should* be beneficial (R5 requires embracing a moral theory to define "beneficial"). Conversely, defining alignment as inherently beneficial (rejecting R4) requires taking a moral stand (violating neutrality in R5). Furthermore, near-term sycophancy (R7) serving a bad operator looks very different from long-term drift away from *any* human values. **It is highly probable that no characterization can simultaneously satisfy the intuitions behind all three requirements for all camps.** *The list itself reveals this core fracture point.*
  *   **R6 (Checkability) vs. Ambition:** Highly capable, opaque, strategic systems may inherently resist conclusive verification of alignment (R6 favoring "uncheckable"). This potentially undermines the feasibility of research agendas focused solely on empirical verification.

  ---

  **Evaluation of Existing Framings Against the List:**

  1.  **Value Learning:** Strong on R1/R2 (distinguishes goal/capability, focuses on inferring intent). Struggles with R4 (if operator values are bad, is learning them "alignment"? Requires R5 stand). R6 checkability is challenging (inferring true, complex values is hard). R7 unification is often assumed (learning correct values solves both near/long-term).
  2.  **Corrigibility:** Directly addresses R2 (deference via shutdown/control) and parts of R7 (prevents long-term drift via ongoing control). Weak on R1 (doesn't inherently distinguish capability failures). R4/R5 is complex (corrigible to whom? For what purpose? Requires moral stand). R6 checkability moderate (can test shutdown response, harder to test robustness).
  3.  **Instruction Following:** Strong on R2 literal interpretation (deference to literal instructions). Very weak on R1 (poor instruction = bad outcome could be misalignment *or* capability) and R3 (bias can creep in easily). Fails R4 catastrophically (perfectly follows bad instructions). R6 checkability good for literal compliance, poor for intent/robustness. Treats near-term (R7) as primary.
  4.  **General Reliability:** Good on R1/R3 (focuses on reducing errors/failures). Very weak on R2 (reliability != deference to changing intent) and R4 (reliable at bad things). Avoids R5/R6 specifics. Fails to distinguish misalignment from other failures (core R1/R3 requirement). Treats symptoms (unreliability) not the core cause (wrong goal). Unification (R7) is superficial.

  **Conclusion:** An adequate characterization must make difficult, substantive choices (especially on R4, R5, R7) that inherently favor some research agendas over others. No existing framing perfectly satisfies all requirements, reflecting the deep philosophical and technical tensions within the field. The primary value of this list is to force explicit justifications for these choices when proposing or evaluating what constitutes "alignment progress," moving beyond ambiguous debates. **The unresolvable tension between R4, R5, and R7 strongly suggests that the "alignment problem" is fundamentally fragmented along the axis of whether alignment is defined as faithful agency or beneficial agency.**
