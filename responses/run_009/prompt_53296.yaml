prompt: |-
  I'm a population geneticist by training — I think natively in selection coefficients, effective population sizes, drift, linkage disequilibrium, heritability, mutation–selection balance, and the Price equation — and I know the memetics literature only at the popular level, Dawkins's replicator proposal and its descendants. Restate memetic theory as a body of claims in my vocabulary, as faithfully as you can, and then give me a residue report.

  To give you a sense of the mapping I'd want attempted, not as a checklist you must complete: Is a meme best treated as an allele, as a haplotype, or as the lineage of a segregating variant? What plays the role of the population, the generation, and the effective population size? Is meme fitness a per-capita replication rate to which something like Fisher's fundamental theorem could apply, or is frequency-dependence so dominant that the quantitative apparatus collapses? Does anything like mutation–selection balance or drift in small populations have a cultural counterpart, and could it in principle be measured the way I would want to measure it? Please treat the dual-inheritance tradition as shared ground — I know gene–culture coevolution and the models of vertical and horizontal transmission that come with it — so concentrate on memetics as its own proposal, including where its proponents took it after Dawkins.

  Then tell me what didn't survive the translation. In particular, I want your honest assessment of three criticisms I've encountered: that cultural inheritance is blending rather than particulate, which was fatal to Darwin's own theory before Mendel; that cultural variation is directed rather than blind, so nothing plays the role mutation plays for me; and that selection on memes is inextricably mediated by selection on the human minds that carry them, leaving no clean way to assign fitness at the level I would need. For each, say whether it is an artifact of forcing my vocabulary onto memetics, a genuine gap memetics has never filled, or something my vocabulary cannot express at all. Where it is the last, tell me whether the inexpressible residue points to something real that neither framework captures — something about meaning, persuasion, or the interests of the host — or whether it points the other way.

  Finally, give me your considered view: is memetics a research program that population-genetic tools could in principle discipline into something quantitative, or is the translation so lossy that the differences are the whole story? If the former, say what the first serious model would have to contain; if the latter, say precisely where the analogy stops paying rent.
reasoning: |-
  Okay, the user is a population geneticist asking for a detailed mapping of memetic theory into their own conceptual framework. They want memetics translated into terms like selection coefficients, effective population size, drift, etc. They also want a residue report highlighting what gets lost in translation and an assessment of three specific criticisms.

  First, I need to recall the core concepts of memetics. Dawkins introduced memes as cultural replicators analogous to genes. Later proponents like Blackmore and Dennett expanded on this. The user is familiar with dual-inheritance theory but wants memetics treated separately. So I should focus on memetics' unique claims, not gene-culture coevolution.

  Mapping memes to genetic terms: Memes are probably best seen as haplotypes rather than single alleles because they're complex bundles of information. But their discreteness is questionable. The population would be the human population or subgroups. Generation time is tricky—maybe transmission events instead of biological generations. Effective population size (N_e) would relate to the number of individuals transmitting memes, but with high variance in reproductive success.

  Fitness in memetics is per-capita replication rate, but strong frequency dependence is likely, as popular memes spread faster. Things like mutation-selection balance and drift might have analogs, but mutation is directed in culture, which is a problem. The criticisms they mention—blending inheritance, directed variation, and selection mediated by hosts—need addressing.

  For blending inheritance: Cultural transmission isn't particulate like genes. Memes get modified each time they're transmitted, which is more like blending. This challenges the meme-as-replicator idea. Directed variation means mutations aren't random; people intentionally modify ideas. This removes the blind variation needed for natural selection. Host mediation means meme fitness depends on human cognition and preferences, so it's hard to isolate meme-level selection.

  The residue here involves human cognition—meaning, persuasion, intentionality. These don't fit into population genetics. So memetics might need a different framework. The user's deeper need is to see if population genetics can formalize memetics or if the analogy is too flawed. They might be skeptical but open to interdisciplinary applications.

  I should conclude that while some aspects can be modeled (drift, selection balance), the core issues of directed mutation and host mediation make a full translation impossible. Memetics as a quantitative program would need to incorporate cognitive science and network theory, moving beyond traditional population genetics. The analogy stops paying rent when dealing with intentionality and meaning.
answer: |-
  Below is a rigorous restatement of memetic theory in population genetic terms, followed by a residue analysis and critical assessment. I adopt your framework (selection coefficients, \(N_e\), drift, etc.) while preserving core memetic claims from Dawkins, Blackmore, Dennett, and later proponents. Dual-inheritance models are acknowledged but excluded per your request.

  ---

  ### **Memetics Translated into Population Genetic Vocabulary**
  1. **Memes as Genetic Analogs**  
     - A meme is best modeled as a **haplotype** (or gene complex) rather than an allele. Memes are often composite informational units (e.g., "democracy," "Gothic architecture") with modular but co-adapted elements. Lineage tracking is possible but confounded by high recombination.  
     - *Rationale*: Memes exhibit linkage disequilibrium (e.g., "iPhone" meme bundles design, brand, and cultural associations) but recombine promiscuously (e.g., meme remixes).

  2. **Population Structure**  
     - **Population**: Humans (or cognitively capable agents) within a communicative network. Subpopulations defined by cultural boundaries (e.g., language, ideology).  
     - **Generation Time**: Time between transmission events (\(\tau\)), not biological generations. Highly variable (e.g., viral tweet: \(\tau \approx\) seconds; religious dogma: \(\tau \approx\) decades).  
     - **Effective Population Size (\(N_e\))**: The number of *active transmitters* weighted by their cultural influence. \(N_e\) is typically **low** due to:  
       - High variance in reproductive success (e.g., celebrities vs. isolated individuals).  
       - Preferential attachment (scale-free networks).  
       - *Result*: Strong drift effects, even in large nominal populations.

  3. **Evolutionary Forces**  
     - **Fitness (\(w\))**: Per-capita **replication rate** (memes/host/time). Formal analog to Fisher’s theorem applies *if* fitness is frequency-independent.  
       - *Reality*: Extreme frequency dependence dominates (e.g., bandwagon effects, conformity). Fitness often follows **Sigmoidal functions** (threshold-dependent adoption).  
     - **Mutation (\(\mu\))**: Introduced via **imperfect imitation** or **recombination**. Per-event mutation rate is high (\(\mu \gg 10^{-2}\)/transmission), but:  
       - **Directedness**: Most "mutations" are biased (e.g., cognitive attractors, intentional modification).  
     - **Selection (\(s\))**: Operates via:  
       - *Host fitness*: Memes enhancing host survival/reproduction (e.g., hygiene practices).  
       - *Memetic fitness*: Intrinsic "catchiness" (e.g., earworms, emotional salience).  
       - Selection coefficient (\(s\)) quantifies differential replication *after* accounting for drift.  
     - **Drift**: Potent in small \(N_e\) (e.g., isolated tribes, niche online communities). Stochastic loss of memes is common.  
     - **Mutation-Selection Balance**: Maintains deleterious memes (e.g., harmful superstitions) if:  
       - \(s < 1/(2N_e\mu)\) and mutation pressure is high.  
       - *Challenge*: Directed mutation complicates equilibrium predictions.  
     - **Linkage & Recombination**: Meme "complexes" coevolve (e.g., political ideologies), but recombination rates are context-dependent (analog: variable crossover rates).

  4. **Transmission Dynamics**  
     - **Horizontal Transfer**: Dominates over vertical (parent-offspring) transmission.  
     - **Inheritance System**: **Lamarckian** (acquired modifications are inherited).  
     - **Heritability (\(h^2\))**: Low-to-moderate due to noise in social learning. Measured via adoption correlations in transmission networks.

  ---

  ### **Residue Report: Criticisms Assessed**
  1. **"Cultural Inheritance is Blending, Not Particulate"**  
     - **Verdict**: Genuine gap.  
     - While memes *can* be discrete (e.g., catchphrases, chain letters), most undergo **blending/recombination** during transmission (e.g., folklore evolution). This erodes particulate inheritance, violating a core assumption of replicator dynamics. Population genetic tools **can** model blending (e.g., quantitative trait evolution), but memetics loses its "selfish replicator" parsimony.  

  2. **"Variation is Directed, Not Blind"**  
     - **Verdict**: Genuine gap + inexpressible residue.  
     - Meme variation is **teleologically biased** by human cognition (e.g., humor, emotional resonance). This violates the "blind mutation" assumption. The residue—**intentionality**—cannot be captured by \(s\), \(\mu\), or drift. It points to cognitive processes (e.g., meaning-making, persuasion) irreducible to stochastic models.  

  3. **"Selection is Mediated by Host Minds"**  
     - **Verdict**: Partly artifact, partly gap.  
     - In genetics, gene fitness is also mediated by phenotypes. However, meme fitness is **decoupled from host fitness** (e.g., viral challenges harming hosts). The gap lies in quantifying *memetic* fitness independently:  
       - *Inexpressible residue*: **Meaning** and **context**. A meme’s fitness depends on semiotic networks (e.g., "OK" gesture’s shifting connotations). This requires cognitive/sociological frameworks beyond \(w = \lambda\) (growth rate).  

  ---

  ### **Your Considered View: Can Memetics Be Disciplined?**  
  **Verdict**: Memetics *can* be made quantitative using population genetics, **but only for a subset of phenomena** where:  
  - Memes are discrete (e.g., internet memes, chain letters).  
  - Transmission is measurable (e.g., social media shares).  
  - Host-level selection is negligible (e.g., purely cultural traits).  

  **Where the Analogy Stops Paying Rent**:  
  1. **Intentionality and Meaning**: When memes evolve via human creativity (not random mutation) or depend on interpretive context.  
  2. **Blending Recombination**: When memes fuse irreversibly (e.g., language evolution).  
  3. **Scale-Free Networks**: Population genetics assumes well-mixed populations; memetics requires network theory (e.g., super-spreaders, echo chambers).  

  **First Serious Model Requirements**:  
  A viable memetic population genetics model must include:  
  1. **Frequency-Dependent Selection**: Sigmoidal adoption functions (e.g., \(w_i = \frac{a}{1 + e^{-k(f_i - c)}}\)).  
  2. **Directed Mutation**: Bias parameters (\(\beta\)) modulating mutation toward cognitive attractors.  
  3. **Dynamic \(N_e\)**: Scaling with network centrality metrics (e.g., eigenvector centrality).  
  4. **Two-Layered Fitness**: Host fitness (\(w_h\)) and memetic fitness (\(w_m\)) as separable components.  

  **Conclusion**: Memetics is a **heuristic with diminishing returns**. For simple, discrete cultural units, population genetics offers tools to model drift/selection (e.g., predicting meme extinction probabilities). However, the core of culture—meaning, intentionality, fluid identity—demands frameworks beyond replicator dynamics. The future lies in **integrating memetics with cognitive science and network theory**, not forcing it into a purely population-genetic mold. As a research program, its value is in provoking questions, not delivering quantitative laws.  

  ---  
  Would you like a formal mathematical treatment of any specific component (e.g., mutation-selection balance for memes with directed variation)?
