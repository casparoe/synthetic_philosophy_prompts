  Below is a decision tree for the killing/letting-die distinction, built from the logical space using concrete cases. Each branch node is a binary question based on a scenario, answerable without prior knowledge of ethical positions. Leaves are labeled with named views, each accompanied by their most awkward commitment. The tree includes your three diagnostic cases: ventilator withdrawal vs. non-initiation (a), bystander rescue with cost (b), and initiating vs. allowing a causal sequence (c). I flag unresolvable leaf pairs and unoccupied branches at the end.

  ---

  ### **Decision Tree: Moral Asymmetry Between Doing and Allowing Harm**

  **Start: Case A (Ventilator)**  
  A doctor can withdraw a ventilator from a patient (causing immediate death) or never start it (causing death by omission). The patient's prognosis and relationship to the doctor are identical in both scenarios, and the outcome (death) is certain without ventilation.  
  **Question 1:** Is withdrawing the ventilator morally worse than never starting it?  
  - **Yes (asymmetry exists)** → Go to Case B.  
  - **No (no asymmetry)** → Go to Case C (but skip to the No Asymmetry branch after Question 1).

  ---

  #### **Branch: Asymmetry Exists (Yes to Question 1)**
  **Case B (Bystander Rescue)**  
  A bystander sees a stranger drowning in a pond. They can easily rescue the stranger but doing so will ruin their expensive coat. No other costs or risks are involved.  
  **Question 2:** Is the bystander morally required to ruin the coat to save the stranger?  
  - **Yes (positive duty binding)** → Go to Case C.  
  - **No (positive duty weak/absent)** → Go to Case C.

  ---

  ##### **Sub-branch: Positive Duty Binding (Yes to Question 2)**
  **Case C (Bomb Trolley)**  
  A bomb will explode, killing 100 people. You can prevent this by pushing a button that launches a missile to destroy the bomb, but the missile will kill 100 *different* people in a building. If you do nothing, the bomb kills the original 100. The death toll is identical (100 dead) either way, and the two groups are morally equivalent.  
  **Question 3:** Is it permissible to push the button (initiating a new causal sequence) rather than allow the bomb to explode (allowing an existing sequence)?  
  - **Yes** → **Leaf 1: Moderate Asymmetry with Threshold Override**  
    - *Most awkward commitment:* Allows "doing harm" (e.g., killing) when it prevents equivalent harm, but still forbids trivial harms (e.g., breaking a promise) to save lives.  
  - **No** → **Leaf 2: Rights-Based Negative Dominance**  
    - *Most awkward commitment:* Forbids killing 100 to save 100 identical lives, even when the outcome is identical, due to absolute constraints on "doing harm."  

  ##### **Sub-branch: Positive Duty Weak (No to Question 2)**
  **Case C (Bomb Trolley)**  
  Same as above.  
  **Question 3:** Is it permissible to push the button?  
  - **Yes** → **Leaf 3: Unoccupied**  
    - *Status:* **Incoherent**—Affirms asymmetry (killing worse than letting die) but permits killing to prevent equivalent letting-die, contradicting core asymmetry.  
  - **No** → **Leaf 4: Strict Deontological Asymmetry**  
    - *Most awkward commitment:* Permits allowing massive, preventable harm (e.g., millions of deaths) to avoid trivial "doing harm" (e.g., lying or minor theft).  

  ---

  #### **Branch: No Asymmetry (No to Question 1)**
  **Case B (Bystander Rescue)**  
  Same as above.  
  **Question 2:** Is the bystander morally required to ruin the coat to save the stranger?  
  - **Yes (positive duty binding)** → Go to Case C.  
  - **No (positive duty weak/absent)** → Go to Case C.

  ---

  ##### **Sub-branch: Positive Duty Binding (Yes to Question 2)**
  **Case C (Bomb Trolley)**  
  Same as above.  
  **Question 3:** Is it permissible to push the button?  
  - **Yes** → **Leaf 5: Consequentialism**  
    - *Most awkward commitment:* Requires sacrificing personal integrity (e.g., framing an innocent person) if it marginally increases aggregate welfare.  
  - **No** → **Leaf 6: Unoccupied**  
    - *Status:* **Incoherent**—Denies asymmetry (killing = letting die) and affirms strong positive duties, yet forbids killing to fulfill identical positive duties, creating contradiction.  

  ##### **Sub-branch: Positive Duty Weak (No to Question 2)**
  **Case C (Bomb Trolley)**  
  Same as above.  
  **Question 3:** Is it permissible to push the button?  
  - **Yes** → **Leaf 7: Egoist Symmetry**  
    - *Most awkward commitment:* Permits causing catastrophic harm to others (e.g., genocide) for trivial personal gains if outcomes are identical to allowing harm.  
  - **No** → **Leaf 8: Unoccupied**  
    - *Status:* **Incoherent**—Denies asymmetry (killing = letting die) but treats killing as impermissible while letting die is permissible, reinstating asymmetry.  

