     - **Leaf 8 (No Asymmetry + Weak Positive Duty + Forbid Bomb Button):** **Incoherent**—Forbids killing but permits letting die despite denying asymmetry.  
     - **Leaf 7 (No Asymmetry + Weak Positive Duty + Permit Bomb Button):** **Unexplored**—Logically consistent but rarely defended; only fringe egoism or extreme libertarianism might occupy it, facing unattractive implications (e.g., allowing genocide for minor gains).

