answer: |-
  ## Identity Persists in Patch Replacement but Dies in Rollback

  Gradual brain replacement via sleep patches preserves personal identity, while checkpoint rollback constitutes death and replacement. The key distinction lies not in the *amount* of change, but in the *nature of the psychological continuity chain* and the *causal history* underpinning psychological states.

  **1. Sleep-Patch Replacement: Survival Through Overlapping Psychologies**
  Replacing brain tissue in patches during sleep avoids disrupting conscious continuity. Crucially, each new patch integrates with the *current*, still mostly biological, neural architecture before the next replacement. This maintains **unbroken psychological connectedness and continuity** (Parfit's core criterion). Even without conscious bridging, the waking consciousness emerges from a substrate causally linked to the previous day's state. Overlapping neural networks ensure overlapping memories, intentions, and character traits persist incrementally. John Locke's memory-based theory finds support here: the post-replacement individual remembers the pre-sleep self's experiences, and this chain remains unbroken day-to-day. Robert Nozick's "closest continuer" theory also affirms identity: the biological brain at T1 is the closest continuer of the brain at T0, even as components change, because the functional structure evolves seamlessly *in situ*. Biological views (e.g., Eric Olson's animalism) struggle profoundly here. If identity requires the same biological brain matter, replacement *anywhere* destroys the person – but this clashes with intuition. If replacing a neuron destroys identity, identity is absurdly fragile. The *functional organization*, not the substrate, sustains the person.

  **2. Checkpoint Rollback: Death by Causal Severance**
  Rollback is catastrophic for identity. When the system crashes and reboots from a snapshot, the *causal chain* of experience is shattered. The entity that wakes up at T+10 minutes *after* rollback has psychological states identical to the snapshot taken at T, but these states are **causally disconnected** from the experiences that *actually* occurred between T and T+10. That original 10-minute consciousness ceased upon crash. The rebooted entity possesses perfect *false memories* of the period leading up to T, but no genuine experiential link to the consciousness that lived those final 10 minutes. This violates Locke's core principle: memory claims must be *causally derived* from the experiences themselves. Parfit's psychological continuity also fails here, as the connection isn't gradual or overlapping; it's a hard reset. The rebooted entity is a *new* psychological stream initiated at T (from the snapshot), falsely believing itself continuous with the past. Nozick's closest continuer might point to the rebooted entity, but it's only "close" *structurally*, not *causally*. The original stream's closest continuer at T+10 minutes would be... nothing. It ceased. Biological views fare no better: if the hardware crash destroys the biological brain emulation process (even temporarily), the biological entity is gone; the reboot is a replica.

  **Why the Verdicts Differ & Why "Gradual" Doesn't Require Experience**
  The sleep-patch case succeeds because it preserves genuine **causal psychological continuity** through overlapping functional states, even without conscious bridging. The "gradual" nature ensures this overlap; patch replacement (while faster than neuron-by-neuron) still allows sufficient integration time for the overall psychology to evolve causally from its prior state. The *experience* of gradualism isn't necessary; the metaphysical structure of continuity is. Rollback fails because it creates a replica with identical psychology *but severed causal history*. The snapshot is a copy, not a continuation. It creates a break in the stream of consciousness, launching a new stream with fabricated experiential history.

  **Conclusion: Function Over Form, Causation Over Copying**
  Patch replacement preserves identity because the functional person persists through causally connected psychological states. Rollback destroys identity by annihilating the current experiential stream and replacing it with a causally isolated duplicate possessing false memories. Therefore, we survive the silent, patchwork transformation of our substrate during sleep, but we perish utterly in a system crash followed by a reboot from backup, regardless of psychological similarity. The difference hinges on the preservation of the unbroken, causally grounded psychological chain.
