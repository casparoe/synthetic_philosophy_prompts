  Heard on a podcast that tit-for-tat won both of Axelrod's prisoner's dilemma tournaments, and I looked it up and it's supposedly evolutionarily stable too. So hasn't game theory basically solved the evolution of cooperation? If one dead-simple strategy beats everything else, why do people keep running computer tournaments and inventing fancier strategies, instead of just concluding that cooperation evolves via tit-for-tat and moving on? Also, if it's really that dominant, why don't animals and humans all just play tit-for-tat all the time — is it really just implementation errors and noise? Feels like im missing something.
