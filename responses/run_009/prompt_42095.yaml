  First, I need to recall Appiah's framework: honor, material interests, and arguments. The user questions if smoking's fall was a moral revolution or just hygiene plus health awareness. They also point out smoking didn't disappear but became a lower-class vice, unlike dueling or footbinding which ended entirely. 

  Breaking down the timeline: The 1964 Surgeon General report started health arguments. Secondhand smoke studies in the 80s-90s shifted focus to harm to others. Bans began in the 90s (flights, then bars). The user wonders if the honor flip happened here. 

  Honor Shift: Initially, smoking was glamorous (Hollywood, ads). By the 90s, it started losing respectability. The material interest was clear—healthcare costs, lost productivity. But the honor aspect is trickier. Did smokers lose honor? The user notes how office smokers now huddle outside, feeling ashamed. That's honor loss. But unlike footbinding pledges, there wasn't a collective honor pact against smoking. 

  Secondhand smoke is key because it turned smoking from self-harm to harming others, a moral argument Appiah's cases lacked early on. This complicates the model. Also, smoking persists among lower-income groups, so the honor flip wasn't universal. The stigma is class-based, which Appiah's model doesn't address. 

  The user's deeper interest might be understanding why some practices stigmatize without disappearing, and how class affects moral revolutions. They might also be reflecting on their own quit journey—was it cost (material) or social pressure (honor)? 

  I should map each phase to Appiah's triad. Arguments (health studies) came first, then material interests (bans saved money), then honor flipped as smoking became deviant. But the persistence of smoking in marginalized groups shows the honor dynamic is uneven. The model works but exposes limitations—harm-to-others arguments accelerate change, and class shapes stigma. 

  Conclude that smoking's decline confirms Appiah’s honor thesis partially, but the class element and secondhand smoke’s role reveal gaps. The revolution was moral but incomplete, pushing the practice to the margins rather than eradicating it.
answer: |-
  You've hit on a fascinating and complex case study. Applying Appiah's model (*The Honor Code*) to the fall of smoking reveals both its strengths and limitations. Let's map it onto the three components:

  1.  **Moral Arguments:** Present *early and persistently*, evolving significantly.
      *   **Phase 1 (Self-Harm - 1950s/60s):** The initial arguments (Surgeon General's Report, 1964) focused overwhelmingly on harm to the *smoker* (cancer, heart disease). This fits Appiah's point: arguments about self-harm alone rarely drive revolutions. Many smokers accepted the risk ("my choice").
      *   **Phase 2 (Harm to Others - 1980s/90s):** This is the **critical deviation** from Appiah's cases. The emergence of robust evidence on **secondhand smoke** was transformative. It shifted the core argument from "smoking is bad *for you*" to "your smoking is poisoning *me/my children*". This introduced a genuine, widely relatable *moral* harm-to-others argument much earlier and more centrally than in dueling or footbinding. It provided the ethical bedrock for bans and social pressure. This wasn't just "tidying up"; it was a core engine driving the honor shift.

  2.  **Material Interests:** Aligned powerfully *against* smoking over time.
      *   **Healthcare Costs:** Rising medical expenses made smoking-associated illnesses (cancer, COPD, heart disease) a massive financial burden on employers (insurance premiums) and governments (Medicare/Medicaid).
      *   **Lost Productivity:** Smokers taking breaks, being absent due to illness, or dying prematurely represented significant economic losses.
      *   **Cleanliness & Maintenance:** Businesses (bars, restaurants, offices, airlines) realized smoke-free environments were cheaper to clean and maintain (no yellowed walls, smoke-damaged furniture/fabrics).
      *   **Liability:** Fear of lawsuits from employees exposed to secondhand smoke grew with the evidence.
      *   **Big Tobacco's Decline:** While resisting fiercely, the tobacco industry's power and legitimacy waned, reducing its ability to counter these interests.

  3.  **Honor/Honor-Flip:** This is the crucial and complex piece, happening *later* and unevenly.
      *   **The Glamour Fades (Pre-Flip):** Smoking's association with sophistication, rebellion, and coolness (Hollywood, ads) eroded steadily due to health messaging and changing cultural tastes. It became less of a positive status symbol.
      *   **The Flip Trigger:** **Bans** were the catalyst for the *honor flip*. When smoking was forcibly removed from mainstream social spaces (planes, offices, restaurants, bars), it fundamentally changed its social meaning.
          *   **Becoming Inconvenient & Anti-Social:** Having to leave a meeting, dinner, or flight to smoke marked smokers as disruptive. The huddle outside the loading dock became a visible symbol of exclusion.
          *   **The Stigma of Harming Others:** The secondhand smoke argument transformed the act. Lighting up near others wasn't just a personal choice; it became perceived as *imposing harm* or at least *discomfort and risk* on unwilling participants. Smokers were increasingly seen as selfish or inconsiderate.
          *   **Loss of Respectability:** Smoking in respectable company became awkward, even rude. Employers might (often unfairly) see smokers as less reliable or healthy. The practice itself lost honor.
      *   **Who Lost/Gained Honor?**
          *   **Lost:** Smokers themselves. The act became associated with weakness (addiction), poor health choices, lack of self-control, and inconsideration (due to secondhand smoke). The "huddle" is a physical manifestation of this loss of social standing *within* mainstream spaces.
          *   **Gained:** Non-smokers and anti-smoking advocates gained moral authority as protectors of health (their own and others') and proponents of clean air/environments. Refusing to allow smoking in one's space became a sign of responsibility and care.
      *   **The "Pledge" Dynamic?** This is **weaker** than in footbinding. There was no explicit collective pledge. However:
          *   **Implicit Social Compacts:** Choosing smoke-free venues, asking smokers to step outside, supporting bans – these were individual acts that collectively reinforced the new norm. Declaring your home or car smoke-free became a minor badge of responsible citizenship.
          *   **Corporate/Institutional "Pledges":** Businesses adopting smoke-free policies and municipalities passing bans acted *as if* making a collective commitment, binding their reputations to the new standard of cleanliness and health.

  **Where the Model Holds, Stumbles, and Your Key Insight:**

  *   **Confirms the Core Thesis:** Appiah is largely right. Moral arguments *alone* (Phase 1 self-harm) didn't kill smoking. Material interests powerfully aligned against it. But the crucial *flip* happened when smoking **stopped conferring status/glamour and started costing respectability** due to the conjunction of bans, the secondhand smoke argument, and changing norms. The loading dock huddle *is* the honor loss made visible.
  *   **The Secondhand Smoke Deviation:** This is where the model stumbles. Appiah's cases lacked a strong, scientifically validated *harm-to-others* argument *early* in the revolution. For smoking, this argument was **central and catalytic**, driving both the material interests (liability, employee health) and the honor flip (inconsiderate/imposing harm). It wasn't just retrospective justification.
  *   **Your Key Insight: The Persistence of the "Unrespectable" Version:** This is brilliant and exposes a limitation. Appiah's model explains the *death of a practice within respectable society*. Smoking didn't die; it was **expelled** and **re-stratified**.
      *   **Honor Flip Applied Selectively:** The honor loss was most acute within middle/upper-class professional and social circles. The stigma is significantly weaker (though still present) in lower-income and marginalized communities where smoking prevalence remains higher. Economic stress, targeted marketing historically, and different social norms buffer the honor flip's full force.
      *   **The Loading Dock is the Point:** It's not just where smokers go; it symbolizes the practice being pushed to the social and physical margins. Smoking persists, but its *honor-work* is now largely negative and concentrated outside the mainstream spaces it once dominated. The revolution wasn't eradication; it was **segregation and stigmatization**.

  **Conclusion:** The fall of smoking broadly confirms Appiah's model. Moral arguments (especially self-harm) were insufficient, material interests aligned powerfully against the practice, and the critical shift was the **honor flip**, triggered largely by bans fueled by the secondhand smoke argument, transforming smokers from glamorous rebels to inconvenient, potentially harmful outsiders within mainstream spaces. However, the **early and central role of the harm-to-others argument** (secondhand smoke) and the **persistence of the practice as a stratified, lower-status vice** highlight nuances Appiah's framework doesn't fully capture. The revolution wasn't abolition; it was **social expulsion and class-based stigmatization**. The loading dock huddle is the perfect emblem of this complex, incomplete honor flip.
