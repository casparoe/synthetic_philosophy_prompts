prompt: |-
  I've been reading rationalist blogs and forums since the Sequences were still being posted, and these days I work as a machine learning engineer on an LLM-based agent product — RAG pipelines, tool-calling scaffolds, context-window management, eval suites, the whole apparatus. The frame problem keeps coming up in that world: usually a passing mention of Dennett's robots, or of Fodor claiming the problem sinks any broadly computational picture of the mind, followed by someone in the comments asserting that it's just "the problem of relevance" and that modern systems handle it implicitly via attention, or route around it with retrieval, or something like that. I've never found either the dismissive or the apocalyptic take satisfying, and I'd like a serious treatment pitched at me rather than at a philosophy seminar.

  Restate the frame problem in the vocabulary I actually use: context windows, attention and retrieval as relevance mechanisms, system prompts and scaffolds, tool use, the gap between what a model can in principle compute and what a pipeline actually invokes. Cover the traditional subdivisions separately — the narrow version as originally posed for logical representations of action and time (what remains true after an event, and the paradoxes that plagued it in logic-based planning, e.g. the Yale shooting scenario), the projection/prediction aspect, and the broad "relevance" reading that Dennett and Fodor made famous — and translate each. Then give me the residue report: which parts map cleanly onto things my field has real names for (and where we've merely engineered a workaround, say so honestly rather than dressing the workaround up as a solution to the conceptual problem), which parts translate only with distortion, and which have no counterpart at all in my vocabulary. I'm especially interested in whether the narrow/broad distinction survives translation, and whether Fodor's claim that relevance is somehow global and unmanageable for a computational system comes out as deep, or as an artifact of assuming explicit logical axiomatization — the sort of artifact that translating into learned relevance mechanisms might expose.

  End by taking a stance: is the residue a defect of my vocabulary (something LLM engineering can't currently say but should be able to), a sign that the philosophers were arguing about something that dissolves once described in engineering terms, or a genuine leftover that neither the philosophers nor the engineers have handled? Say what would change your verdict — what an argument, or an engineering development, would have to show — and point to where your reasoning is most likely to go wrong. Then, as the very last line, state your verdict in exactly this fixed form, replacing the bracketed phrase with one of the three labels and nothing else: Residue verdict: [vocabulary-gap | dissolved-on-translation | genuine-leftover]
