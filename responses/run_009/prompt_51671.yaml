prompt: |-
  I'm a PhD student (decision theory, but I've been dragged into teaching) running a 90-minute seminar for about 22 second-year undergrads on a social epistemology module, and next week's topic is information cascades and rational herding. The students have already had the basic Bayesian sequential-decision setup, so they sort of know the punchline: a few early movers can drag everyone after them into a wrong choice even when the aggregate of private signals pointed the other way. What they don't have is any feel for it — on paper it just looks like an artefact of the model, and half of them conflate it with plain conformity effects or reputational herding, which it isn't.

  Design me a classroom game that produces an actual cascade, or ideally several, with real (small) stakes so the incentives bite — no actual money, but some point or token scheme with a small prize at the end. Give me the full mechanics: how the private signals are generated and how informative they are, the choice each participant faces, the order of moves, what's public vs private, and how the payoffs work. I'd also like a twist if you can make it run cleanly: I want to secretly designate two or three students as planted conformists who must ignore their own signal and copy the previous mover no matter what, and then at the end have the group vote on who they think the plants were. My hunch is they mostly can't tell, and that's exactly the point — from observed actions alone, a rational cascader and a blind follower are behaviourally identical. But you tell me whether that actually works or whether it collapses.

  Then the debrief: I want it to map specific moments in the game onto the parts of the formal story (when the cascade tipped, what the person who broke it knew that the others didn't, whether breaking it was even rational for them), and to make the contrast with conformity/social-pressure explanations sharp rather than hand-wavy. Also give me an honest section on what will predictably go wrong the first time I run it — I'm braced for the contrarian who deliberately deviates just to mess with the cascade, and for the cascade failing to form at all if the first two signals conflict — and what I do about each. And be frank about which feature of real cascades the game just cannot reproduce, so I know what I have to supply in the wrap-up myself. Please write the whole thing in British English.
reasoning: |-
  Okay, let me tackle this request from a PhD student teaching social epistemology. They need a classroom game to demonstrate information cascades, moving beyond the theoretical model to give students tangible experience. The core challenge is designing mechanics that reliably produce cascades while distinguishing rational herding from conformity.

  First, the key requirements: 
  - Must work with 22 second-year undergrads familiar with Bayesian basics
  - Needs real stakes (token system with prize)
  - Requires private signal generation with controlled informativeness 
  - Should include "planted conformists" as a twist
  - Debrief must map game events to formal theory
  - Must anticipate practical failures (contrarians, conflicting first signals)

  Hmm... the planted conformist idea is clever but risky. I need to ensure their presence doesn't distort the cascade mechanics. Perhaps make them a minor element - say 2 out of 22 - with instructions to copy only public actions, not signals. Their impact should emerge subtly.

  For signal design, binary choices (e.g. "Blue/Red") with asymmetric payoffs could work well. Making one option slightly more probable (say 60:40) creates room for cascades against the true state. Signals should be noisy but informative - maybe 70% accuracy? That's weak enough for early mistakes to snowball.

  The sequence matters: 
  1. Private signals (envelopes or app) 
  2. Public declarations in fixed order 
  3. Payoffs based on final choice alignment with hidden state

  Ah, and the twist! After the game, have students vote on who they think the plants were. The revelation that cascaders and blind followers behave identically should drive home the observational equivalence point.

  For predictable failures: 
  - Contrarians: Build in participation points to discourage sabotage 
  - Conflicting first signals: Have backup plans to restart or discuss 
  - Cascade failure: Pre-seed initial choices if needed

  The debrief needs to explicitly contrast:
  - Rational updating (Bayesian) vs social pressure
  - When cascades break (strong private signals)
  - Why later actors ignore their own information

  What this game can't capture: 
  - Continuous action spaces in real markets 
  - Reputational motives 
  - Endogenous sequencing

  Right, better structure this with clear phases: Setup → Gameplay → Voting → Debrief. Use British English throughout. Need concrete payoff numbers - perhaps £0.50 per correct token? Prize for top 3.

  Final check: Does this create "aha" moments? The vote on planted conformists should be revelatory when students realize they couldn't spot them. That's the core epistemic insight.
answer: |-
  Here’s a complete classroom game design, "Cascade or Conform?", tailored to your specifications. It uses physical props for transparency and runs in 45-60 minutes, leaving time for debrief. **Stakes**: Tokens ("Cascade Coins") redeemable for small prizes (e.g., chocolates, extra credit points).

  ---

  ### **Game Setup**
  **Players**: 22 students + 2-3 secretly designated "plants".  
  **True State**: Hidden binary choice (e.g., **BOX A** or **BOX B** contains a prize). True state is determined by coin flip (60% chance BOX A, 40% BOX B) to create asymmetric priors.  
  **Private Signals**: Students receive sealed envelopes containing a clue (e.g., "I think it's A" or "I think it's B"). Signals are 70% accurate (i.e., P(signal=A | true=A) = 0.7). Generate signals beforehand using a random number generator.  
  **Plants**: Secretly brief 2-3 students to **ignore their signal and always copy the previous public choice**. Do this just before the game starts.  
  **Public Display**: Use a whiteboard to record each player’s public choice sequentially.  
  **Payoffs**:  
  - Correct final choice: **2 tokens**  
  - Correctly voting for a plant (post-game): **1 token**  
  - Participation: **1 token** (minimises contrarians)  
  Top 3 token holders win prizes.

  ---

  ### **Mechanics**  
  1. **Introduction** (5 mins):  
     - Explain: "You’re investors deciding whether to back Project A or B. Each has a private tip (your envelope). You’ll declare support publicly in sequence. Your goal is to pick the *truly better* project."  
     - Reveal prior: "Statistically, A succeeds 60% of the time, B 40%."  
     - Show empty Box A/B props.  

  2. **Gameplay** (20-25 mins):  
     - **Order**: Students move in fixed, randomised order (e.g., seat order).  
     - **Turn Structure**:  
        - Player *i* opens their envelope privately (signal).  
        - They publicly declare "A" or "B" (must choose one).  
        - Their choice is recorded on the board (e.g., "Player 1: A").  
        - **Plants**: Copy the immediately prior public choice (e.g., if Player 1 chose A, Player 2 [plant] chooses A regardless of their signal).  
     - **No Discussion**: Players cannot speak except to declare "A" or "B".  

  3. **Final Reveal & Voting** (10 mins):  
     - Announce the true state (open the prop box).  
     - Pay tokens for correct final choices.  
     - **Twist**: "Some of you were secretly told to copy the previous choice. Vote for who you think the plants were."  
     - Tally votes and pay rewards.  

  ---

  ### **Anticipated Problems & Solutions**  
  | **Problem**               | **Why It Happens**                          | **Mitigation**                                                                 |
  |---------------------------|---------------------------------------------|--------------------------------------------------------------------------------|
  | **First signals conflict** | P(first two signals differ) ≈ 42%           | **Pre-seed**: If first two conflict, add a fictional "Player 0" who chose A (using the prior). |
  | **Contrarian deviates**    | Boredom/attention-seeking                   | **Stakes**: Participation tokens incentivise seriousness. Privately remind them it distorts learning. |
  | **Cascade doesn’t form**   | Strong early signals align with truth       | **Force it**: In first run, use signals where first 2-3 are wrong (e.g., true=B, signals=A,A). |
  | **Plants spotted**         | Overacting or inconsistent copying          | **Brief plants**: "Copy naturally — if asked, say you had a weak signal or trusted others." |

  ---

  ### **Debrief Framework** (25-30 mins)  
  **Map the Game to Theory**:  
  1. **Identify the Cascade Tipping Point**:  
     - "When did later players ignore their signals? E.g., after 3 consecutive identical choices, Player 4’s signal became irrelevant."  
     - Highlight: *Cascade starts when public info outweighs private signal + prior*. Use Bayes’ rule on the board:  
       *P(A|public history) > 0.7 → optimal to follow crowd even with contrary signal*.  

  2. **Contrast with Conformity**:  
     - "Did anyone feel social pressure? No — choices were silent and private signals were undisclosed. Rational herding is *information-based*, not normative. You followed because the crowd likely knew more, not because you feared judgement."  

  3. **Break the Cascade**:  
     - "If someone deviated later (e.g., Player 7 chose B after 6 As), ask: What did they know? Their signal was *strong* (e.g., ‘B’ with 70% accuracy) or they spotted a plant? Note: Deviating is rational only if private signal strength > accumulated public info."  

  4. **Plants Reveal Observational Equivalence**:  
     - "Could you distinguish rational cascaders from blind followers? No — both copied identically. *Actions don’t reveal motives*. Real cascades mix rational and irrational actors; we infer causes from context, not behaviour."  

  ---

  ### **What the Game Cannot Simulate**  
  1. **Endogenous Sequencing**: In reality, people delay decisions to observe others. Here, order is fixed.  
     *→ Supply in wrap-up: Mention "option value of waiting" in markets.*  
  2. **Reputational Payoffs**: No cost for deviating (e.g., being fired for wrong investment).  
     *→ Discuss: "In reputational herding, you might follow *even when public info is weak* to avoid blame."*  
  3. **Continuous Actions**: Binary choices simplify, but real cascades (e.g., stock runs) involve degrees of commitment.  
     *→ Note: "Granular actions make cascades more persistent."*  

  ---

  ### **Logistics Checklist**  
  - **Prep**: Envelopes (pre-filled signals), boxes (one with "PRIZE" note), tokens (e.g., poker chips), whiteboard.  
  - **Run Time**: 15 mins setup + 45 mins game/debrief.  
  - **Prizes**: £5 gift cards or 0.5% extra credit per token.  

  **Why This Works**: The asymmetric prior and noisy signals make early errors likely. Plants amplify cascades without breaking the model. The vote forces engagement with the core epistemic puzzle: *Rationality and mindlessness look identical from the outside*. Run it twice if time permits — once "vanilla", once with plants. Students rarely spot the sleeper agents.  

  Good luck — it’s bloody brilliant when the cascade locks in and the groans start. Let me know how the contrarians fare.
