prompt: |-
  I teach an intro metaphysics class and want a one-page decision tree handout for the special composition question: when do some things add up to a further thing? The tree should start from a question the students can answer without knowing any of the labels (something like: is there any composite object at all over and above whatever simples exist?) and then sort them via concrete cases — I'm thinking two gloves in a drawer, a tree with a freshly fallen branch lying next to it, grains being added to a sand pile one at a time, a crowd at a protest, a disassembled bike in a box. Leaves should cover nihilism, universalism, organicism (composition only when life is involved), brutalism (there's a cut-off but no story about it), and a common-sense restricted view. Two things I want you to be honest about rather than paper over: which pairs of leaves the tree can't actually separate (my hunch is organicism and the common-sense view say yes to the tree and no to the gloves and the bike, so if any case can pull them apart tell me which, and if not say the tree has to lump them), and which branch combinations end up unoccupied — with a sentence on whether nobody's there because the view is incoherent or just because nobody bothered defending it. Keep the node questions phrased as rulings on the cases, not as 'do you believe in tables?'
reasoning: |-
  Okay, the user wants a one-page decision tree handout for the special composition question in their intro metaphysics class. Let me start by understanding the requirements. The tree should begin with a question students can answer without prior knowledge, like whether composite objects exist beyond simples. Then, it should use concrete cases: two gloves in a drawer, a tree with a fallen branch, grains added to a sand pile, a crowd at a protest, and a disassembled bike in a box. The leaves need to cover nihilism, universalism, organicism, brutalism, and a common-sense restricted view.

  First, the initial question. The user wants it accessible. Starting with "Do any composite objects exist?" makes sense. If no, that leads to nihilism. If yes, then the cases come into play. 

  Next, the cases. I need to order them to differentiate the theories efficiently. The gloves case tests if two similar objects compose something (like a pair). The tree and branch case checks if separated parts still compose. The sand pile is for vagueness—when composition stops. The crowd tests social entities. The bike tests if disassembled parts compose.

  Now, mapping responses to theories. Nihilism says no to all. Universalism says yes to all. Organicism and common-sense both say no to gloves and bike, yes to tree and crowd. The sand pile is where they might differ? But organicism is about life, so sand isn't alive. Both would say no to sand pile composition. So they can't be separated by these cases. Need to note that they're lumped together. 

  Brutalism says there's a cutoff in sand but no explanation. So for the sand pile, if they think composition stops at some point but can't say why, that's brutalism. 

  Checking for unoccupied branches. For example, someone who says yes to gloves and tree but no to crowd? That might be incoherent because gloves are arbitrary pairs while crowds are social. Or someone saying no to tree but yes to bike? That doesn't align with common sense. Need to identify such gaps and explain why they're empty—either incoherent or undefended. 

  The user wants honesty about where theories overlap and which branches are empty. So lumping organicism and common-sense makes sense. For empty branches, like accepting the tree but rejecting the crowd, that might not have a defender because it's arbitrary without a principle. Similarly, accepting the disassembled bike but rejecting the sand pile seems inconsistent. 

  Also, phrasing questions as rulings on cases, not belief in objects. So questions like "Do the two gloves compose a pair?" instead of "Do you believe in pairs?" 

  Need to ensure the tree fits on one page. So keep it concise. Use the cases to funnel down to the theories. Highlight where organicism and common-sense merge and note brutalism's role in the sand pile case. Mention unoccupied branches and reasons. 

  Finally, check if any case can separate organicism and common-sense. Since organicism requires life, and common-sense might include non-living artifacts, the disassembled bike is non-living. Both would say no to the bike. The tree is alive, so both say yes. The crowd might be ambiguous—organisms vs. social entities. But common-sense accepts crowds as composite, while organicism might not since a crowd isn't a living organism. Wait, organicism typically applies only when living things are involved. A crowd isn't a single organism, so organicism might say no, but common-sense says yes. That could separate them. 

  But in the initial plan, I had the crowd as yes for both. That's a mistake. Organicism should say no to the crowd because it's not a living entity. Common-sense would say yes. So that case can distinguish them. Need to adjust the tree. 

  Similarly, the sand pile: organicism says no (not alive), common-sense might say no as well, but the crowd becomes the key differentiator. So the tree should have a path where after the tree (yes), the crowd question splits organicism (no) from common-sense (yes). 

  Also, the disassembled bike: both say no, so it's not useful for splitting. The gloves: both say no? Organicism might say no because gloves aren't alive. Common-sense might consider a pair as an entity? But the user mentioned both say no to gloves and bike. So gloves should be no for both, bike no for both, tree yes for both, crowd yes for common-sense but no for organicism. 

  Yes, that works. So the crowd case can separate them. Need to update the decision tree accordingly. 

  Then, for the sand pile, brutalism comes in when they think composition stops at some point. If they say no to the pile but yes to some earlier stage, that's brutalism. 

  Unoccupied branches: for example, saying yes to gloves and tree but no to crowd. That might be undefended because accepting arbitrary pairs but not social entities lacks a clear principle. Or saying no to tree but yes to bike—why accept disassembled parts but not a tree with a branch? Incoherent. 

  Need to make sure the final tree reflects these points clearly, with notes on lumping (if any) and empty branches. Since crowd separates organicism and common-sense, no lumping needed. Earlier mistake corrected.
answer: |-
  ## Special Composition Decision Tree  
  *When do some things compose a further thing? Start here—no jargon needed. Answer based on concrete cases.*

  **First Question: Do any composite objects exist beyond basic particles (or simples)?**  
  - **No** → **Nihilism** (Only simples exist. No tables, crowds, or even organisms—just particles arranged "table-wise," etc.)  
  - **Yes** → Proceed below:

  ---

  ### Case 1: Two matched gloves in a drawer.  
  **Do they compose a single thing (a "pair of gloves")?**  
  - **No** → Go to Case 2.  
  - **Yes** → Go to Case 4.  

  ### Case 2: A tree with a freshly broken branch lying beside it.  
  **Do the tree and branch compose a single thing?**  
  - **No** → Go to Case 3.  
  - **Yes** → Go to Case 5.  

  ### Case 3: A disassembled bicycle in a box.  
  **Do the parts compose a single thing?**  
  - **No** → **Common-Sense Restricted View** OR **Organicism** (Composition requires spatial unity, functional integration, or life). *Note: These views agree here—see Case 5 to split them.*  
  - **Yes** → **Universalism** (Any things compose something, always. There’s a "bicycle-in-a-box" object, a "glove-pair," etc.)  

  ### Case 4: Grains added one-by-one to a sand pile.  
  **Is there a precise number where adding one grain turns non-heap into heap?**  
  - **No** → **Universalism** (Grains always compose a heap—even two grains make a "tiny heap").  
  - **Yes, but I can’t explain why** → **Brutalism** (Composition has sharp cutoffs, but it’s a brute fact with no deeper principle).  
  - **Yes, based on function/cohesion** → *This branch empty—no major theory fits.* (Incoherent? Demanding precise cutoffs *and* functional principles clashes with vagueness in cases like sand.)  

  ### Case 5: A crowd at a protest.  
  **Do the people compose a single thing (a "crowd")?**  
  - **No** → **Organicism** (Composition only when life is involved *and* the whole is a living organism. Crowds, gloves, and bikes aren’t organisms; trees are.)  
  - **Yes** → **Common-Sense Restricted View** (Composition requires spatial contact, functional unity, or causal interdependence. Crowds count due to shared purpose/proximity; trees do; gloves and disassembled bikes don’t.)  

  ---

  ### Key Notes:  
  1. **Lumped Together:** Organicism and the Common-Sense View *agree* on Cases 1 (gloves: **no**), 2 (tree+branch: **yes**), and 3 (bike parts: **no**). **Case 5 (crowd)** splits them: Organicism says **no** (not an organism), Common-Sense says **yes** (unified group).  
  2. **Unoccupied Branches:**  
     - **"Yes to gloves (Case 1), no to tree (Case 2)"**: Empty. Undefended (and likely incoherent—why accept arbitrary pairs but reject natural wholes?).  
     - **"No to tree (Case 2), yes to disassembled bike (Case 3)"**: Empty. Undefended (no principled reason to accept scattered bike parts but reject a tree touching its branch).  
     - **"Yes to sand cutoff, with explanation (Case 4)"**: Empty (see Brutalism note above).  

  ---

  **Design Rationale:**  
  - **Cases Order**: Tests intuitive commitments stepwise—first arbitrary pairs (gloves), then disrupted wholes (tree/branch), then artifacts (bike), vagueness (sand), and social entities (crowd).  
  - **Honesty**: Organicism/Common-Sense distinguished *only* by the crowd case. Brutalism isolated to sand-like vagueness. Empty branches flagged with reasons.  
  - **Pedagogy**: Forces engagement with examples before labels. "Rulings on cases" phrasing avoids theoretical baggage. Print-friendly (one page).  

  Would you like a simplified visual flowchart version or adjustments to cases/theories?
