prompt: |-
  I've been reading rationalist blogs and forums on and off since maybe 2012, so I've seen roughly a thousand threads about the inside view vs the outside view, and lately I've noticed a specific dynamic in those threads that I can't find a name for, and it's starting to bug me. It goes like this: someone makes a confident prediction or holds a confident belief, and someone else pulls the humility move — "most people who felt this sure were wrong, founders always think they're the exception," or "most people who converted to a religion report having had compelling reasons, and they mostly match their parents' religion, so your compelling reasons are probably what that feels like from the inside." So far, so standard. But then the first person responds: "fine, but among the more specific set of people in my situation — same traction, same market, or in the religion case, people who actually examined the evidence as adults rather than inheriting it — the base rate is much better." And then the debate becomes about how to group people. Widen the group and the sceptical side wins, narrow it and the confident side wins, and nobody ever says anything about how you're supposed to pick.

  The part that interests me is that the humility move doesn't actually terminate anything. Both people can be fully, sincerely committed to deferring to the statistics, and they end up exactly where they started, one level up, arguing about which statistics count. And that choice — which slice of people you belong to — can't itself be settled by the same method, because to apply the move to the choice you'd need a prior view about which groupings are the natural ones, and there doesn't seem to be a neutral standpoint for that. It's not that one of them is secretly doing the inside view while pretending not to; it's that the outside-view machinery just has a dial on it, and turning the dial requires ordinary first-order judgment, the very thing the move was supposed to let you bypass. I've watched this play out in AI timelines arguments (compare yourself to forecasters? to AI researchers? to people who predicted imminent transformative tech in past decades?), in startup arguments, in arguments about whether someone's new diet is really working.

  So: is there an established concept for this? To be clear what I'm after — I know the inside/outside distinction itself, and I'm dimly aware that there's a known puzzle about which population you should compare yourself to when making a probabilistic forecast, but that's usually framed as a problem about prediction, not as this argumentative merry-go-round where the modesty move regenerates the disagreement instead of resolving it. What I want to know is whether the dynamic itself — sincere deference producing zero convergence because the grouping question swallows everything — has a name of its own, how it relates to whatever the nearest concepts are (and what those actually are, precisely), and whether it's genuinely distinct from just "people disagree about base rates" in a way that deserves separate treatment. If there's no established term, I'd want you to coin one and give the boundary cases, e.g. does it still count when only one side is doing the redrawing? Please be explicit about how confident you are in the identifications, and flag the point you're least sure of — for me that's whether this is a real distinct phenomenon or just the grouping puzzle wearing a debate-shaped hat, and I'd want to hear your honest read on that rather than a tidy answer. Also happy to be told I've misdescribed the dynamic itself, I've definately not read everything on this.
reasoning: |-
  Okay, let me start by unpacking the user's query. They've been following rationalist discussions since 2012 and noticed a recurring pattern in debates about inside vs outside view. Specifically, they point out that when someone makes a confident claim, another person invokes the humility move—referencing broader statistics to suggest caution. But then the first person narrows the reference class, and the debate shifts to defining the right group. This creates a loop where both sides defer to statistics but can't agree on which statistics apply.

  The user is frustrated because this dynamic doesn't resolve disagreements; it just moves the argument up one level. They want to know if there's a named concept for this pattern, how it relates to existing ideas, and whether it's genuinely distinct or just a variation of base rate disputes. They also ask for a coined term if none exists and want honesty about confidence levels.

  First, I need to verify if this dynamic has a specific name. From my knowledge, the inside/outside view distinction is well-known, thanks to Kahneman and Lovallo. The reference class problem comes from Kahneman and Tversky, which directly relates to choosing which group to compare to. The user mentions being aware of this but sees their issue as a debate loop rather than just a prediction problem. 

  Looking deeper, the key here is the argumentative impasse where both sides use the outside view framework but end up in a meta-dispute about reference classes. This seems like a higher-level iteration of the reference class problem. I recall that Yudkowsky discussed reference class tennis, which matches the user's description. Also, Armstrong's reference class forecasting touches on practical applications but doesn't address the debate aspect.

  The user's observation about sincere deference leading to no convergence is crucial. It's not that one side is dishonest; both are trying to use statistics but can't agree on the parameters. This loops back to the need for inside-view judgment to set those parameters. That's the core of the issue—using outside view requires inside-view choices, creating a cycle.

  Now, is this distinct from general base rate disputes? The user thinks yes because of the regeneration of disagreement. In typical base rate neglect, people ignore statistics. Here, both engage with statistics but clash on the reference class definition. So the dynamic is different. The term "reference class tennis" fits well, as it captures the back-and-forth without resolution.

  For coining a term, "reference class recursion" emphasizes the looping, while "reference class tennis" is more established in rationalist circles. I should note that the latter is informal. The boundary cases: if only one side redraws the class, it might not be a full loop, but the core issue remains. The dynamic is distinct because it's a meta-dispute fueled by mutual use of the outside view framework.

  The user's deeper need might be understanding why these debates feel unproductive and if there's a way out. They might seek validation of their observation and conceptual tools to articulate the problem. They also might want strategies to break such impasses, though that's beyond the current query. Highlighting the inevitability of inside-view judgment could address their frustration about bypassing it.
answer: |-
  Your observation is razor-sharp and captures a profound, recurring flaw in how the "outside view" is *applied* in practice. This dynamic is well-recognized within the rationalist community and decision theory circles, but often lacks a single perfect label. Here's the breakdown:

  1.  **The Core Problem: The Reference Class Problem (Established Concept)**
      *   **What it is:** This is the fundamental issue you identified: *How do you choose the relevant group ("reference class") to compare yourself/your case to when applying base rates?*
      *   **Origin:** Coined by Daniel Kahneman and Amos Tversky. It highlights the inherent subjectivity in selecting the "right" population for statistical comparison. There's no purely objective, statistical way to define the optimal reference class without relying on context-specific, often inside-view, judgments.
      *   **Relation to your Dynamic:** This *is* the root of the merry-go-round you describe. The entire debate about widening/narrowing the group *is* the manifestation of the reference class problem within an argumentative context.
      *   **Confidence:** High. This is a well-established concept in judgment and decision-making literature.

  2.  **The Argumentative Dynamic: Reference Class Tennis (Common Informal Term)**
      *   **What it is:** This is the specific *pattern of debate* you observed: Opponent A uses a broad reference class to argue for humility. Opponent B counters with a narrower, supposedly "more relevant" reference class. Opponent A then argues why that class is *too* narrow or cherry-picked, or offers an alternative broadening. The debate ping-pongs between different reference class definitions without resolution.
      *   **Why it's distinct:** It's the *meta* level where both sides sincerely *invoke* the outside view framework but get stuck because the framework's key parameter (the reference class) is inherently contestable and requires inside-view judgment to set. The disagreement regenerates *within* the structure meant to resolve it.
      *   **Terminology:** This back-and-forth is often informally called **"Reference Class Tennis"** within rationalist and forecasting communities (e.g., discussions around LessWrong, the Good Judgment Project, or in critiques of forecasting practices). It perfectly captures the volleying nature you described.
      *   **Confidence:** Moderate-High for the term existing informally within specific communities. Lower for it being a formal academic term.

  3.  **The Underlying Philosophical Snag: The Ineliminable Inside View (Key Insight)**
      *   **What it is:** Your crucial point: *Applying the outside view inevitably requires inside-view judgments.* You cannot select a reference class, assess its relevance, interpret the base rates within it, or decide if it's "natural" or "cherry-picked" without using context-specific knowledge, intuition, and causal models – the very "inside view" the move was meant to supplement or override.
      *   **Relation:** This is *why* Reference Class Tennis happens and *why* the humility move doesn't terminate the debate. The "dial" you identified *must* be turned using the machinery it was supposed to bypass. The outside view isn't a standalone algorithm; it's a tool that requires calibration by the messy, first-person perspective.
      *   **Confidence:** High in the concept being recognized. High that this is the core reason for the dynamic you observe.

  4.  **Is it Distinct? (Your Core Question)**
      *   **Yes, but layered:** The *dynamic* (Reference Class Tennis) is a distinct *manifestation* of the underlying *problem* (The Reference Class Problem), specifically occurring within argumentative/debate contexts where both sides engage sincerely with the outside view framework.
      *   **How it differs from "just disagreeing about base rates":**
          *   **Sincerity & Framework:** Both sides are explicitly committing to deference to statistics/the outside view *in principle*. They aren't ignoring base rates; they're fighting over *which* base rates are binding.
          *   **Meta-Level:** The disagreement shifts *up* to the level of defining the statistical parameter itself (the reference class). The original disagreement becomes embedded within the dispute over how to frame the statistical comparison.
          *   **Regeneration:** As you astutely noted, the humility move doesn't resolve the original disagreement; it transforms it into a debate about classification, which is often just as intractable and requires the same kind of contested judgment.
      *   **Confidence:** High that this *dynamic* deserves recognition as a distinct *pattern* arising from the reference class problem in social/epistemic interactions.

  5.  **Boundary Cases & Coined Term**
      *   **Does it still count if only one side redraws?** Yes, though it's less "tennis" and more "reference class resistance." If Person A makes the humility move with a broad class, and Person B successfully defends a narrower class *and* this ends the statistical debate (e.g., A concedes B's class is more relevant), the *core dynamic of the reference class problem* is still present (B used inside view to define the class), but the *argumentative loop* didn't fully manifest. The fundamental issue remains: inside-view judgment was needed to set the reference class.
      *   **A More Precise Term (if needed):** While "Reference Class Tennis" is descriptive and known, if you want a term emphasizing the recursive, regenerating nature:
          *   **Reference Class Recursion:** The disagreement regenerates at the meta-level of defining the class. (Less common, but captures the loop).
          *   **The Outside View Regress:** Applying the outside view requires judgments that themselves seem to need an outside view, leading to... (Accurate, but perhaps too broad).
      *   **Sticking with "Reference Class Tennis"** is probably best, as it's evocative and recognized in the communities you frequent.

  **Conclusion & Least Confident Point:**

  *   **The Core Concept:** You've perfectly described the **Reference Class Problem** manifesting argumentatively as **Reference Class Tennis**, driven by the **ineliminable need for inside-view judgment** when applying the outside view.
  *   **Confidence:** High that this is a real, distinct *pattern of argument* arising from a fundamental problem in probabilistic reasoning. High that "Reference Class Tennis" is the common informal term for the dynamic.
  *   **Least Confident Point (Your Query):** Whether this is *fundamentally* distinct from the grouping puzzle or just its debate-shaped hat. **My Honest Read:** It *is* the grouping puzzle (reference class problem), but wearing a *very specific* hat – the hat of a social debate where both parties sincerely try to wield the outside view as an objective tool and end up revealing its inherent subjectivity through their unresolvable conflict over its application parameters. The "merry-go-round" aspect *is* the unique contribution of viewing it through this argumentative lens. It highlights that the reference class problem isn't just a cognitive bias *within* an individual forecaster, but a *social epistemic trap* that can paralyze group reasoning even when everyone agrees on the *principle* of deferring to statistics. So, distinct pattern arising from the core problem? Yes. Fundamentally novel *underlying* problem? No. But the dynamic you observe is crucial for understanding why appeals to the outside view often fail to resolve disagreements.
