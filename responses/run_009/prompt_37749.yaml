  i read a blog post explaining the doomsday argument via a lottery analogy and it's bugging me. the setup: two big drums, one with 10 tickets numbered 1-10 and one with 10,000 tickets numbered 1-10,000. you draw blind, get ticket 7, and obviously you should bet you drew from the small drum. the post then says my birth rank among all humans who will ever live is exactly that kind of draw -- i'm somewhere around the 100 billionth human, so way more likely than not the total pool is smallish, so the species probably doesn't get the trillions-of-people future people imagine when they talk about spreading to the stars. it even uses this to argue we should discount optimistic longtermist planning, since if the future were that vast it'd be a suspicious coincidence to find myself this early. my roommate (philosophy degree) says the analogy is doing all the work and smuggles in its conclusion: the drums exist in advance, the tickets are all printed before anyone draws, and crucially the draw is random in a way my being born maybe isn't. can you audit it? like, lay out what maps onto what (what's the drum, what's the shuffle, why is it *me* who draws), then where the picture breaks -- could i have "drawn" a number that only exists if the lottery keeps running for centuries, do neanderthals or future AIs count as tickets, and whether the doom-soonish conclusion survives once the disanalogies are on the table. also if there's a better analogy that carries the point honestly, or whether every version runs into the same problem, i'd like to hear it. i work in software not philosophy so dont assume i know the jargon, but dont dumb it down either.
