  Where this cuts: the philosophy debate exposes genuine gaps in engineering frameworks (semantics, intrinsic purpose), but control theory reveals how much philosophical hand-wringing could be dissolved by specifying concrete control objectives. The user's suspicion about semantics seems validated - that's the real residue. 

