prompt: |-
  every morning I catch myself saying "cheers" to my smart speaker, and my sister makes her kids thank theirs because she reckons it keeps them in the habit of being polite to actual people. everyone involved is perfectly clear that its just a program with no feelings. so what theory of mind does this practice presuppose, if any? maybe it presupposes nothing at all about the machine, but then why does thanking the speaker feel totally natural while thanking a light switch would feel bizarre? and is the practice quietly leaning on the same idea behind the Turing test -- that how we treat something cant come apart from how we'd treat a mind whose behaviour looked the same -- or is it underdetermined between that and a bunch of rival views? please reconstruct the implicit commitments, say whether they're consistent with everyone's professed belief that the thing has no mind, and tell me what the practice would have to look like if we instead took a strictly behavioural criterion of mind seriously. answer in British English, and dont stay neutral -- take a view.
