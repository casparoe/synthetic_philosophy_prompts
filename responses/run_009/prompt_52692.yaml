  ### Predictions for Your Three Cases
  1. **Aunt scenario (known ownership)**: **Not free**  
  2. **Aunt scenario (unknown ownership)**: **Not free**  
  3. **Agoraphobia scenario**: **Free**  

  ### Candidate Rules Fitting Maya's Track Record
  Three distinct philosophical frameworks explain all five of Maya's prior verdicts consistently. Here's how they map to her judgments:

  | Scenario                     | Maya's Verdict | Non-Domination Rule (Republican) | Conditional Threat Rule | Effective Options Rule |
  |------------------------------|----------------|----------------------------------|-------------------------|------------------------|
  | Prisoner in locked cell      | Not free      | Not free (direct domination)     | Not free (coercive barrier) | Not free (no option to leave) |
  | Woman locked in unknowingly  | Not free      | Not free (objective domination)  | Not free (coercive barrier exists) | Not free (option blocked) |
  | Cult member (free to leave)  | Free          | Free (no arbitrary power)        | Free (no active threat) | Free (option accessible) |
  | Man avoiding red (threat)    | Not free      | Not free (domination via threat) | Not free (conditional punishment) | Not free (option restricted by fear) |
  | Shopkeeper (storm blockade) | Free          | Free (no human domination)       | Free (natural cause, not threat) | Free (option exists but impractical) |

  **Core of each rule**:
  - **Non-Domination (Republican)**: Freedom requires no arbitrary power held over you by others (aligned with Pettit/Berlin's negative liberty+). Focuses on *structural relationships*, not awareness or psychology.  
  - **Conditional Threat**: Freedom is absent only when your options are constrained by another agent's *conditional threat* ("If you do X, I'll punish Y"). Ignores non-threat obstacles.  
  - **Effective Options**: Freedom depends on whether you can *actually choose/access* alternatives, regardless of why you can't (blends capability and psychology).  

  ### How the Rules Split on Your Three Cases
  | Case | Non-Domination Rule | Conditional Threat Rule | Effective Options Rule | Agreement? |
  |------|---------------------|-------------------------|------------------------|------------|
  | 1. Known aunt ownership | **Not free** (aunt has arbitrary power, even if unused) | **Free** (no active threat conditioning behavior) | **Free** (she can act as she wishes; no barrier) | No: Cases 1 and 2 differ under Conditional Threat/Effective Options |
  | 2. Unknown aunt ownership | **Not free** (power exists objectively; awareness irrelevant) | **Free** (no perceived threat, so no constraint) | **Free** (she believes she can act freely) | No: Cases 1 and 2 get *same* verdict only under Non-Domination |
  | 3. Agoraphobia | **Free** (no dominating agent) | **Free** (constraint internal, not a threat) | **Not free** (phobia blocks effective choice) | No: Case 3 splits all rules |

  - **Cases 1 and 2 verdicts under each rule**:  
    - Non-Domination: Both **not free** (power imbalance exists objectively).  
    - Conditional Threat: Both **free** (no threat is applied).  
    - Effective Options: Both **free** (she lives unimpeded).  
  - **Knowing vs. not knowing**: Only the Non-Domination rule treats Cases 1 and 2 identically (verdict: not free). The other rules treat them as free, but for different reasons. Maya's verdict on the "locked door unknown" case (not free) suggests she prioritizes *objective power structures* over subjective awareness, pointing to Non-Domination.

  ### Which Rule Maya is Likely Using
  I believe Maya is running the **Non-Domination (Republican) rule** (≈90% confidence).  
  **Why**:  
  - Her "locked door unknown" verdict shows she cares about *objective power relations* (jailer's control) even without awareness.  
  - The cult verdict hinges on the *absence of arbitrary power* (leader won't interfere), not psychology.  
  - The storm verdict excludes *natural obstacles* from "unfreedom" (only human domination counts).  
  - Her "beaten for wearing red" verdict treats the thug as a dominating agent (arbitrary power), not just a psychological barrier.  

  This rule explains all prior cases cleanly and predicts identical "not free" verdicts for Cases 1 and 2 due to the aunt's latent power.

  ### Handling Uncertainty and a Tie-Breaker Scenario
  - **Your least certain prediction**: Case 2 (unknown aunt ownership). While Non-Domination predicts "not free," there's a 30% chance Maya might see the *ignorance* as dissolving domination (switching to Conditional Threat/Effective Options).  
  - **Hedge recommendation**: Bet cautiously on Case 2—if you lose, it's likely because she shifts toward psychology here.  
