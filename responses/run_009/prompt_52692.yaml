  **Tie-breaker scenario if needed**:  
  If Maya's verdicts on your cases *don't* fully confirm Non-Domination (e.g., she calls Case 2 "free"), use this to split Conditional Threat vs. Effective Options:  
  - *"A person refrains from criticizing their boss because they believe (incorrectly) they'd be fired, but the boss would never actually punish dissent."*  
    - Non-Domination: Not free (boss has arbitrary power).  
    - Conditional Threat: Free (no actual threat exists).  
    - Effective Options: Not free (fear subjectively blocks choice).  

  This isolates whether Maya requires an *actual threat* (Conditional Threat) or cares about *perceived constraints* (Effective Options).

  \answer{not free, not free, free}
