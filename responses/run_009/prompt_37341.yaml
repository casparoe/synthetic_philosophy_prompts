answer: |-
  We, the undersigned, both hold that Everettian quantum mechanics, properly understood through the unitary formalism of quantum theory and the process of decoherence, provides the most coherent and empirically adequate framework for describing reality. We affirm that the quantum state evolves deterministically according to the Schrödinger equation, that interactions with the environment lead rapidly and effectively to the decoherence of systems, and that this decoherence dynamically defines a branching structure – a continually splitting multiverse – wherein macroscopic, approximately classical histories become mutually unobservable for all practical purposes, and indeed, in principle, from the perspective of observers embedded within any given branch. We accept that these branches are equally real, constituting a vast, complex superposition, not mere potentialities.

  We concur that the naive idea of counting branches to recover the observed statistics of quantum experiments is fundamentally flawed and demonstrably incorrect. Decoherence does not typically produce a discrete, countable set of branches with equal amplitude; branches are defined relatively, their number and distinctness dependent on the degree of coarse-graining and the specific decoherence basis chosen. Crucially, branches possess weights determined by the squared amplitudes of their associated components in the universal wavefunction. Attempts to assign equal probability to all branches, regardless of amplitude, lead to predictions starkly at odds with experimental results – predicting, for instance, a 50% chance of seeing any possible outcome in a Stern-Gerlach experiment irrespective of spin orientation, contrary to overwhelming empirical evidence. We agree that this failure necessitates an account of why we observe statistics matching the Born rule, which prescribes probabilities proportional to the squared amplitude.

  Regarding the measurement problem, we agree that the Everett interpretation, grounded in decoherence, successfully resolves the core issue of definite outcomes appearing from a superposition. It explains why we experience a single, seemingly classical world at any moment: we are dynamically localised within a particular branch due to decoherence. The ‘collapse’ of the wavefunction is thereby explained as the subjective experience of branching, not a physical process. However, we acknowledge that the problem of probability – explaining why we should *expect* to find ourselves in branches with frequencies matching the Born rule, and why we should *bet* according to those weights – remains the primary conceptual challenge for Everett. We agree that any solution must be consistent with the deterministic, branching picture and cannot invoke genuine, single-outcome stochastic collapse.

  **Notwithstanding this substantial common ground, we diverge fundamentally on the ontological and epistemological status of probability within the Everettian framework, specifically concerning the derivation and justification of the Born rule:**

  *   **Position One (Derivation from Rationality):** This position holds that the Born rule can be rigorously derived as a rational constraint on decision-making for agents facing branching events. The quantum formalism, combined with the reality of branching, provides the physical arena. Crucially, a set of seemingly weak and self-evident axioms of rational decision theory – applied to the specific context of an agent anticipating branching – *entail* that such an agent must maximise their expected utility using the squared amplitudes as probabilities. Key amongst these axioms are principles like *diachronic consistency* (the requirement that a rational plan made before branching remains compelling to successor agents after branching) and *branching indifference* (the requirement that adding a branch with a payoff the agent finds irrelevant should not alter their preferences between other gambles). These axioms are argued to be purely normative principles of rationality, independent of contingent physical laws. The derivation demonstrates that an agent who fails to use the Born weights in their betting odds can be made to accept a series of gambles that guarantee a sure loss (a Dutch book) *or* exhibit a preference reversal that violates rationality, *even though* all outcomes technically occur. The Born probabilities thus emerge as the uniquely rational credences for an agent who knows the universal wavefunction and the branching structure it entails. Self-locating uncertainty *does* play a role: upon branching, an agent momentarily exists in a superposition of successors, each inheriting the pre-branch perspective. Before full decoherence resolves the branches into effectively separate worlds, there is a genuine epistemic uncertainty for the agent concerning *which* successor they will instantaneously become. Rational decision-making in this transient state requires assigning weights to the possible future selves, and the derivation shows these weights must be the Born weights. Probability is therefore not postulated; it is the inevitable consequence of rational agency in a branching multiverse.

  *   **Position Two (Postulation Required):** This position accepts the branching structure and the failure of branch counting but maintains that the Born rule itself must be added as a fundamental postulate. While decision-theoretic derivations are formally interesting, they are argued to subtly presuppose the very probabilistic structure they claim to derive. The axioms presented as pure rationality norms – particularly branching indifference and diachronic consistency – are, in this view, not innocent norms of rationality but covertly encode the physics of the Born rule. They appear compelling only because we already accept the empirical validity of quantum probabilities. In a genuinely deterministic theory where every possible outcome stipulated by the equations *actually happens*, there is no fundamental ontological uncertainty for a pre-branch agent: they *will* have successors experiencing every outcome. Self-locating uncertainty is argued to be either illusory or insufficient: if the agent knows they *will* exist in all branches, what possible uncertainty could justify assigning different degrees of belief to seeing one outcome versus another? Genuine probability requires genuine uncertainty over which single outcome will occur, which the Everettian picture explicitly denies. The derivations may show that *if* one assumes an agent should weight branches *as if* they were uncertain outcomes, *then* the Born weights are the uniquely consistent weights. But this ‘if’ clause, it is argued, smuggles in the probabilistic postulate. The observed frequencies matching the Born rule are then explained anthropically: observers only exist where observers exist, and in branches with vanishingly small weight, observers typically don’t exist or the context is radically different. However, this anthropic reasoning does not tell an individual pre-measurement agent how they *should* bet; for that, the Born rule must be taken as a brute empirical fact about the distribution of experiences across the multiverse. The approximate, decoherence-dependent nature of the branching structure further undermines claims that the Born rule can be a strict ‘theorem’ derived from the pure formalism plus rationality alone.

  **We identify the following cruxes, points where specific arguments or potential future results could significantly impact the debate, and record our respective predictions:**

  1.  **The Rationality of the Branch-Counting Agent:** Can an agent who insists on assigning equal probability to every emergent branch (after some suitable coarse-graining), irrespective of amplitude, be shown to violate a norm of instrumental rationality that both sides independently accept *without* presupposing quantum probabilistic expectations? Can such an agent be Dutch-booked or shown to exhibit dynamically inconsistent preferences *even when* the payoffs are structured purely in terms of the agent’s own future experiences and resources within the branching multiverse, and *without* relying on axioms like branching indifference or diachronic consistency whose status is contested? Position One predicts that such a demonstration *is* possible: a branch-counting agent can be constructed who, through a series of pre-branching commitments and post-branching actions by their successors, is guaranteed to experience a net loss of utility relative to their own goals, thereby violating a core instrumental rationality principle concerning avoiding sure loss. Position Two predicts that no such demonstration can succeed without implicitly relying on an assumption equivalent to weighting by squared amplitude or invoking axioms whose necessity for rationality in a branching universe is precisely what is in doubt; a branch-counting agent, while making empirically wrong predictions, can remain internally consistent in their preferences and avoid pragmatic self-harm within the multiverse framework.

  2.  **The Significance of Branching Inexactitude:** Does the fact that branching is defined only approximately, relative to a choice of decoherence basis and coarse-graining, fundamentally undermine claims that the Born rule can be derived as a strict theorem of rationality plus the unitary formalism? Position One holds that this concern is misplaced. The derivations work with idealized models where branching is sharp, demonstrating a principle. The approximate nature in real-world scenarios reflects the practical limitations of decoherence and our descriptions, not a flaw in the conceptual derivation. The Born rule remains the uniquely rational strategy for agents in the real, messy, decohering universe. Position Two contends that the inexactitude is crucial. A ‘theorem’ requiring a precisely defined branching structure cannot hold when branching itself is fundamentally fuzzy and context-dependent. This undermines the claim of a rigorous derivation from the basic formalism and suggests that the Born rule, while empirically successful, operates at a higher level of description that must be added to the core quantum postulates.

  3.  **The Concession Threshold:** What specific achievement would cause each side to concede the argument to the other? Position One states they would concede if it could be rigorously proven that no set of self-evident decision-theoretic axioms, applicable to non-branching scenarios and uncontroversially necessary for instrumental rationality, *could* derive the Born rule for a branching agent without circularity, *and* if a viable alternative explanation for the empirical success of the Born rule (beyond anthropics) were provided within pure Everett. Position Two states they would concede if a derivation of the Born rule emerged that (a) did not rely on axioms whose rational justification in a deterministic multiverse requires assuming the Born rule (like branching indifference or diachronic consistency interpreted as binding successor selves), (b) genuinely derived the *squared amplitude* weighting from first principles of rationality applicable even to an agent certain they will have successors everywhere, and (c) convincingly addressed the challenge of branching vagueness without hand-waving.

  We acknowledge the possibility that part of our dispute may be verbal, hinging on the meaning ascribed to "probability." Position One primarily uses it to mean *rational credence* or *decision weight* for an agent facing branching. Position Two reserves it for contexts involving genuine ontological uncertainty over a single outcome. Clarifying this distinction is essential but unlikely to fully resolve the disagreement, as the core contention is whether the concept of rational credence *applies meaningfully* in the Everettian context without a postulate. Similarly, the disagreement over self-locating uncertainty is substantive: whether it provides a genuine foundation for credences prior to decoherence completion.

  This statement represents our best attempt to articulate the shared foundation and the precise locus of our disagreement. We commit to engaging with future work on the identified cruxes and acknowledge that the failure of our specific predictions would constitute significant evidence against our respective positions.

  Signed,

  [Name of Proponent of Derivation from Rationality]
  [Name of Proponent of Postulation Required]
