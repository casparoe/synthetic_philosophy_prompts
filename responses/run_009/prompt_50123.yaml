answer: |-
  Right, let's dissect that YouTuber's summary of evolutionary debunking arguments (EDAs) step by step, using British English as requested. We'll identify what a defender (like Sharon Street) would accept, where the leaps or slides occur, and address the self-refutation charge. It's a clever summary but contains some significant moves that need unpacking.

  **The Summary Broken Down:**

  1.  **Premise 1: "Our moral beliefs were shaped by natural selection to make our ancestors survive and reproduce, not to track moral truth."**
      *   **Defender's Acceptance:** A defender like Sharon Street fully endorses this. The core of EDAs is the claim that the *content* of our moral beliefs (e.g., caring for kin, reciprocity, aversion to harm within the group) is best explained by the adaptive advantages these tendencies conferred in our evolutionary past, not by their correspondence to some independent moral reality.
      *   **Analysis:** This is generally well-supported by evolutionary biology and psychology. The key point is the *selective force*: evolution favours beliefs/dispositions that enhance reproductive fitness, not necessarily truth.

  2.  **Premise 2: "If moral realism is true, moral facts are causally inert -- they couldn't have influenced which beliefs evolution handed us."**
      *   **Defender's Acceptance:** Street (and most EDA proponents) *assume* this for the sake of the argument *against realism*. They argue realists are committed to causally inert moral facts.
      *   **Where the Leap/Slide Occurs:** **This is the first major leap and the crux of realist objections.** The slide is from "moral realism is true" *to* "moral facts are causally inert". While *some* forms of non-naturalist realism (e.g., G.E. Moore's Platonism) might posit utterly non-physical, causally inert facts, *not all realism does*.
          *   **Naturalist Realists:** Believe moral facts are identical to, or supervene on, natural facts (e.g., facts about well-being, suffering, social flourishing). These natural facts *are* causally efficacious and *could* have played a role in selection. For example, the fact that suffering is bad *just is* the fact that suffering undermines well-being, and avoiding suffering *is* fitness-enhancing. Evolution could have "tracked" these facts indirectly. The EDA defender must argue why this tracking is implausible or coincidental.
          *   **Non-Naturalist Responses:** Realists like Erik Wielenberg or David Enoch argue that while moral facts *themselves* might not exert causal force, their *grounds* (e.g., necessary truths about reasons or value) could make it non-accidental that fitness-enhancing beliefs align with moral truth. They might argue that survival *requires* recognising certain basic reasons (e.g., don't cause pointless suffering). The EDA defender must show this alignment *is* merely accidental.

  3.  **Inference: "So our moral beliefs would be exactly as likely to be accurate whether or not realism is true..."**
      *   **Defender's Acceptance:** This is the core probabilistic claim of EDAs. If moral facts are causally inert (or their grounds don't ensure tracking) *and* evolution selects purely for fitness, then the probability that our evolved moral beliefs align with independent moral truth is low or no better than chance. Crucially, it wouldn't be *higher* if realism were true than if anti-realism (like error theory or constructivism) were true.
      *   **Where the Leap/Slide Occurs:** **This inference relies entirely on the success of Premise 2.** If a realist can plausibly argue that moral facts *aren't* causally inert in a problematic way (e.g., via naturalism) or that there's a necessary connection between fitness and moral truth, then the probability *could* be higher under realism. The phrase "exactly as likely" is often interpreted as "no positive epistemic status" or "unreliable", implying the probability of alignment is low *regardless*.

  4.  **Conclusion 1: "...which means the argument just proves realism is false..."**
      *   **Defender's Acceptance:** Street argues exactly this. If the probability of our beliefs being true is no higher (or is low) under realism than under anti-realism, and we have a good explanation for our beliefs under anti-realism (evolutionary fitness), then realism is undermined. We have no good reason to believe it.
      *   **Analysis:** This follows *if* the previous steps hold. The EDA claims to show that realism cannot explain the reliability of our moral faculties, while anti-realism can.

  5.  **Conclusion 2: "...and we should all be error theorists: there simply are no moral facts."**
      *   **Defender's Acceptance?** **Here's a significant slide.** Street's EDA is primarily aimed at *non-naturalist realism*. Her *own* positive view is *Humean Constructivism* – moral truths are constructed by the evaluative attitudes of agents, not discovered as mind-independent facts. Error theory (the view that *all* moral statements are false because there are no moral facts) is *one possible conclusion*, but not the only one. Constructivism, relativism, or expressivism are also anti-realist options compatible with EDAs. The YouTuber has slid from "undermines realism" to "*only* error theory is viable".
      *   **Analysis:** EDAs challenge the epistemic justification for *believing in* mind-independent moral facts. They don't *logically entail* that such facts don't exist (though error theorists argue they don't). They primarily show we have no good reason to think our beliefs *track* them if they do exist. One could be a realist in denial about the epistemic problem, an error theorist, or some other kind of anti-realist who thinks moral truths exist but are mind-dependent (like Street).

  6.  **The Self-Refutation Charge: "And notice the debunkers can't even state their own argument without relying on the moral and rational norms evolution gave them, so it's self-refuting as well."**
      *   **The Charge:** This claims that using evolved rational faculties to argue *against* the reliability of evolved moral faculties is incoherent. If *all* our faculties are equally suspect, why trust the reasoning used in the EDA itself? Furthermore, the debunker likely relies on normative claims (e.g., "we *should* doubt beliefs with unreliable origins") which, if moral norms are debunked, lack force.
      *   **Is it a Knockdown? No. Defenders have plausible replies:**
          *   **Selective Skepticism:** Street and others argue EDAs target *moral* beliefs specifically because of the *specific* evolutionary story explaining their content *and* the realist's commitment to their causal inertness. They don't necessarily apply the same level of skepticism to basic logic, maths, or empirical beliefs. The evolutionary pressures shaping basic perceptual or logical capacities might plausibly favour truth-tracking (e.g., accurately perceiving predators helps survival). The EDA argues this *isn't* the case for *moral* beliefs under *realism*.
          *   **Bootstrapping/Immanent Critique:** The debunker can argue they are using the very rational norms evolution gave us *to evaluate the outputs* of our evolved faculties. We discover some outputs (moral intuitions under realism) are unreliable *using* other outputs (rational inference). This is a feature of reflective reasoning, not a bug. It doesn't require trusting *all* outputs equally.
          *   **Pragmatic or Constructivist Norms:** The normative force of the argument ("we *should* doubt...") might not depend on mind-independent moral facts. Street, as a constructivist, would ground it in our own (evolved, but coherently refined) evaluative standpoint. The debunker can argue that *within* our practical reasoning, given the evolutionary origins, skepticism about moral realism is rationally compelling.
          *   **Distinguishing Rational and Moral Norms:** The debunker might argue that rational norms (like non-contradiction, evidence responsiveness) are fundamentally different from substantive moral norms and less susceptible to the *same kind* of evolutionary distortion story. The EDA hinges on the link between *specific* moral content and fitness, not necessarily the structure of reasoning itself.

  **Summary for Your Tutorial Write-up:**

  *   **Solid Premise:** The EDA starts strongly with the well-supported claim that moral beliefs were shaped by natural selection for fitness, not truth-tracking.
  *   **Crucial Leap (Premise 2):** The argument makes a significant, contestable leap by asserting that moral realism *entails* causally inert moral facts that *could not possibly* have influenced evolution. This is the main battleground. Realists (especially naturalists) strongly reject this, arguing moral facts could be constituted by natural properties that *do* have causal influence. The EDA defender must argue against these realist responses.
  *   **Probabilistic Claim:** *If* Premise 2 holds, the inference that our moral beliefs are no more likely to be true under realism than under anti-realism is reasonable. This undermines the epistemic justification for realism.
  *   **Overreach (Conclusion 2):** Concluding that the argument *proves* error theory is a slide. EDAs primarily undermine the justification for *believing in* mind-independent moral facts. Error theory is one possible conclusion, but constructivism or other anti-realist views are equally compatible. The argument doesn't *prove* moral facts don't exist, only that we can't trust our beliefs to track them if they do.
  *   **Self-Refutation Charge (Replied To):** The charge that EDAs are self-refuting is not a knockdown argument. Defenders can plausibly argue:
      1.  The EDA targets *moral* beliefs specifically, based on their unique evolutionary explanation and realist commitments, not necessarily all rational faculties.
      2.  Reflective reasoning allows us to use evolved rational capacities to *evaluate* the outputs of other evolved capacities (like moral intuition).
      3.  The normative force of the argument can be grounded pragmatically or within a constructivist framework, avoiding reliance on debunked mind-independent moral norms.

  **Key Takeaway for Debunkers:** The EDA's power depends heavily on successfully arguing that *no plausible version of realism* can explain how evolution could have produced reliable moral belief-forming mechanisms. The realist's task is to provide such an explanation (e.g., via naturalism or necessary truths linking fitness and value). The "self-refutation" charge is a persistent objection but one that debunkers have developed nuanced replies to. The YouTuber's summary accurately captures the core *structure* of EDAs but slides on the nature of realism and overstates the conclusion.
