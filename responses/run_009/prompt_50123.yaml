  A philosophy YouTuber I watch explained evolutionary debunking arguments like this, and I mostly followed it but something nags at me. His summary: 'Our moral beliefs were shaped by natural selection to make our ancestors survive and reproduce, not to track moral truth. If moral realism is true, moral facts are causally inert -- they couldn't have influenced which beliefs evolution handed us. So our moral beliefs would be exactly as likely to be accurate whether or not realism is true, which means the argument just proves realism is false and we should all be error theorists: there simply are no moral facts. And notice the debunkers can't even state their own argument without relying on the moral and rational norms evolution gave them, so it's self-refuting as well.' We just covered Street in my metaethics course so I have a rough sense he's in the right area, but I can't tell whether the leaps are his or are actually in the argument. Could you go through it bit by bit and tell me what a defender of the debunking argument would accept, where he's quietly sliding between different claims, and whether the 'self-refuting' point is a knockdown or something the debunker has a reply to? Please answer in British English btw (I'm at a UK uni and want to reuse some of it in a tutorial writeup).
