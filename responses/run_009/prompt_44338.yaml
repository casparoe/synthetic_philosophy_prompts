prompt: |-
  So a bit of background before my actual question: I spent thirty-one years as an analytical chemist, mostly doing trace-contamination work, and if I learned one thing it's that a measurement without an uncertainty attached is a lie. We lived and died by error bars. Now that I'm retired I've gotten deep into philosophy of probability, and I've become fascinated by imprecise probabilities -- the idea that your credence can be a whole set or interval of numbers rather than one exact point. Honestly this matches how we always treated things in the lab anyway, so I'm predisposed to like it. But the part where I get stuck is what you DO with a credal set when a decision has to be made. Apparently there are several competing rules for that and I want to understand whether they actually disagree in practice or only in textbooks.

  Here's the thing I want built: a thought experiment where an agent with imprecise credences has to choose between options, and where the different resolution rules give different recommendations. In particular I want the case to pit (1) the pessimistic rule -- pick the option that's best under the worst probability in your set, against (2) the "admissibility" rule -- pick any option that's optimal for at least some probability in the set. Constraints: keep it realistic, something like a public health official or a water utility engineer deciding between interventions when two labs give disagreeing estimates of some contamination probability, so the agent's credence really is just an interval. One paragraph for the scenario itself, and please make the disagreement fall out of the numbers rather than stipulating verdicts -- I want to be able to check the arithmetic.

  After the scenario, walk me through what each rule says and why, and then a few follow-ups: which feature of the case is doing the work, what happens if you shrink that feature (e.g., narrow the interval) until the rules reconverge, and how a defender of whichever rule comes out looking bad would attack the setup. One more thing I'd genuinly like your opinion on: did you have to make the credal interval implausibly wide to get the disagreement, or can it happen with intervals a reasonable person would actually hold? My chemist's hunch is that for narrow intervals everything collapses to ordinary decision theory and the whole debate is bookkeeping, but I suspect that hunch is wrong somewhere and I'd like to know where.
