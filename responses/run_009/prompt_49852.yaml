  I'm trying to build a case for a seminar discussion and I can't get it to sit right. Here's what I want: a scenario where the *admirable* agent — the one with actual willpower, who resists the temptation and does the smart thing — technically comes out akratic on Davidson's definition of incontinence, while the person who caves and does the dumb impulsive thing does NOT come out akratic. My idea for how to pull this off: precommitment plus hyperbolic discounting. If discounting is hyperbolic, then binding yourself in advance can be the rational move (smaller-sooner rewards temporarily dominate in a way exponential discounting wouldn't allow), and at the moment of temptation your all-things-considered judgment can flip so that it actually sides with the temptation. So the person who resists is acting against their own better judgment at that moment — which sounds like exactly what Davidson's definition requires for akrasia, applied to the person everyone would call strong-willed. Which would be a fun result if it actually works.

  Constraints, because otherwise I know I'll cheat: everyday realistic setting — an office job or ordinary health stuff, no Ulysses and the sirens, no addiction, no gambling, and no agent with perfect self-knowledge. The precommitment has to be one she rationally adopts ex ante *because of* the hyperbolic discounting (not out of fear or self-hatred), and she has to still endorse it reflectively afterwards even though her in-the-moment preference reverses. One paragraph for the scenario itself, and no stipulating verdicts — the verdicts have to fall out of the theories, not be written into the case.

  After the scenario, walk me through what each of these says: (1) the Socratic line where weakness of will is really ignorance, i.e. no one knowingly chooses the worse option, (2) Davidson's definition — freely doing something you judge worse, all things considered — and (3) the hyperbolic discounting / Ainslie-style view with preference bundling and self-command. Then tell me which feature of the case is doing the work: I suspect it's the time-indexing of the judgment (which moment's judgment counts as *the* better judgment), but maybe it's really the preference reversal itself? Finally, give me the best Davidsonian counter-move for denying that the resisting agent is akratic — e.g. saying the operative judgment is the one conditional on the whole adopted plan, or whatever move is actually available on Davidson's own machinery — and tell me whether that move also protects the caving agent from the label or only the strong one. If it protects both, does the case still isolate anything interesting, or does it collapse?

  At the very end, put \answer{...} with exactly one of: akratic, not-akratic, or borderline — your bottom-line call on whether the resisting agent comes out akratic on Davidson's definition as you've reconstructed it. THanks!
