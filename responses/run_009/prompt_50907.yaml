prompt: |-
  I'm taking a philosophy of economics course this semester and we just spent two weeks on revealed preference — Samuelson's move from utility as something you feel to something you infer from choices, and then the whole pile of objections (Sen on how choices depend on the menu, the sour grapes / adaptive preference stuff, the general worry that inferring preference from behavior assumes a lot that isn't there). Meanwhile I work part-time as a UX intern at a mid-size SaaS company, and my team keeps having the same argument over and over: the PMs say "users voted with their feet for the new dashboard, just look at engagement," and the designers say "they only use it because we buried the toggle and the old version is three clicks deep, that's friction, not preference." Nobody can settle it because nobody shares a notion of what would even count as evidence of a preference as opposed to just behavior. I want to bring something back from my course that actually operationalizes this instead of us yelling past each other.

  Can you write a procedure my team could run whenever someone claims a metric shows users prefer X? I want the questions in order, what counts as a sufficient answer to each, where the procedure stops with "this is behavior, not preference, stop drawing conclusions from it," and where it has to hand off to a human judgment call because the question is one of values rather than measurement. Ground it in what revealed preference theory actually commits you to — the idea that consistency of choice as budgets and menus vary is what licenses the inference, and the assumptions (stable preferences, beliefs held fixed, the menu itself not being part of what you're choosing) that make the inference valid — and make sure the procedure distinguishes the cases where that inference is decent from the cases the critics say break it: defaults, forced choice among bad options, engagement that looks more like compulsion than liking, and people who want an option to *exist* even though they never pick it. Also be honest about which steps of the procedure are judgment calls dressed up as measurement, since my course keeps hammering that point and I'd rather the doc admit it upfront.

  Then run it on three cases from my job: (1) an A/B test where variant B wins on click-through but variant A wins on satisfaction in a small follow-up survey; (2) the buried-toggle situation above, where new-dashboard usage is near-total but mainly because switching back is annoying; (3) an email digest that users rate 2/10 in surveys yet open every single day. Include at least one case where the procedure gives an answer I wont like, and say clearly what the procedure can't do — my PM will definitely ask whether it ever tells us what to build next, and I suspect the honest answer is no, but I want that spelled out. Constraint-wise: the team is non-technical, this has to be runnable in about ten minutes per decision by someone who's never heard of Samuelson, and it's purely advisory — nobody has to sign off, it just has to be good enough that people actually use it instead of falling back on vibes.
reasoning: |-
  We are going to design a procedure that is grounded in revealed preference theory and its critiques. The core idea is that we can infer preference from choice only under certain conditions: consistency of choices across different "budgets" (broadly construed as constraints, including time, effort, money, and available options) and menus. When these conditions are violated, we cannot confidently infer preference from behavior.

  The procedure will be a step-by-step checklist of questions. At each step, if the answer does not meet the criteria, we stop and conclude that the behavior is not evidence of preference. Some steps require judgment calls, and we will explicitly note these.

  Key assumptions from revealed preference theory we rely on:
  1. **Stable preferences**: The user's underlying preferences do not change during the observation period.
  2. **Consistency**: Choices should be consistent in a way that satisfies the axioms of revealed preference (e.g., if A is chosen over B in one menu, then B should not be chosen over A in another menu when both are available).
  3. **Beliefs held fixed**: The user's beliefs about the consequences of choices are fixed and accurate (or at least, we control for changes in beliefs).
  4. **The menu itself is not part of the choice**: The set of options presented does not change the value of the options (no framing effects, etc.).

  Critiques we account for:
  - **Menu dependence** (Sen): Choices can depend on the set of available options (e.g., choosing an option because it's the only one available doesn't mean it's preferred in an absolute sense).
  - **Adaptive preferences** (e.g., sour grapes): People adjust their preferences based on what is available, so what they choose might not reflect their true welfare.
  - **Influence of defaults and friction**: People often stick with defaults or choose the path of least resistance.
  - **Compulsion vs. liking**: Engagement might be due to addiction or compulsion, not genuine liking.
  - **Option value**: People might value the existence of an option even if they never choose it.

  ---

  **Procedure: "Is this behavior evidence of preference?" Checklist**

  **Step 0: Define the Claim**
  - Clearly state the claim: "We observe behavior [describe behavior] and claim it shows users prefer [X] over [Y] or other alternatives."

  **Step 1: Check for Stable Preferences and Context**
    - *Question*: Are we comparing behavior in the same context (time, user state, external factors) and do we have reason to believe preferences are stable during the period?
    - *Why*: If preferences are unstable (e.g., due to learning, mood changes) or contexts are different, the behavior might not reflect a consistent preference.
    - *Sufficient answer*: Yes, we have controlled for major contextual changes and the time period is short enough that preferences are unlikely to have shifted. Otherwise, stop: behavior may not reflect preference.

  **Step 2: Check for Menu Effects**
    - *Question*: Were the users presented with a fixed menu of options (including the status quo) that remained the same throughout the observation? If not, did the menu change in a way that might explain the behavior?
    - *Why*: If the menu changes (e.g., we remove an option or add a new one), the choice might be due to the menu, not preference. Also, if the menu is too small or forced, it might be a Hobson's choice.
    - *Sufficient answer*: The menu was fixed and included all relevant alternatives (including the one we are comparing to). If the menu was restricted (e.g., we forced a choice between two bad options) or changed, stop: the behavior might be menu-dependent and not reflect a preference for X in general.

  **Step 3: Check for Defaults and Friction**
    - *Question*: Is the behavior driven by a default setting or by friction (e.g., extra steps to choose an alternative)? 
    - *Why*: If the user is choosing X because it's the default and switching is hard, that might not reflect a preference for X.
    - *Sufficient answer*: We have tested that the behavior persists when the default is reversed and when switching costs are minimal. If we haven't, and there is reason to suspect defaults or friction are at play, stop: we cannot infer preference from this behavior alone.

  **Step 4: Check for Consistency Across Constraints**
    - *Question*: Have we observed the user making the same choice when the "cost" (time, effort, money) of choosing X changes? Or when the menu is expanded?
    - *Why*: Revealed preference requires that choices are consistent when constraints (like effort) change. If a user only chooses X when it's the default but switches away when it's easier, then the initial choice wasn't due to preference.
    - *Sufficient answer*: We have evidence that the user consistently chooses X over Y even when the cost of choosing Y is low (or when the cost of X is high) and in different menus. If not, and we suspect cost or menu changes would alter the choice, stop: we cannot infer a stable preference.

  **Step 5: Check for Beliefs and Information**
    - *Question*: Do we have reason to think the user has accurate beliefs about the options? If not, could misinformation or incomplete information explain the behavior?
    - *Why*: If the user chooses X because they don't know what Y is, or they have false beliefs about the consequences, then the choice doesn't reflect their true preference.
    - *Sufficient answer*: We have evidence that the user is well-informed about the options (e.g., through user testing, tutorials, or clear labeling). If not, stop: the behavior might be due to misinformation.

  **Step 6: Check for Compulsion or Addiction**
    - *Question*: Could the behavior be driven by compulsion, addiction, or habit rather than a positive evaluation of X?
    - *Why*: High engagement might be due to addiction (e.g., checking email constantly) and not because the user likes it.
    - *Sufficient answer*: We have evidence that the user would stop if it were easy to do so, or that they express dissatisfaction with the behavior. If the behavior is accompanied by negative feedback (like low satisfaction scores) and we suspect compulsion, stop: we cannot infer preference.

  **Step 7: Check for Option Value**
    - *Question*: Is the behavior about choosing X, or is it about having the option to choose X? (e.g., users might never use a feature but value its existence)
    - *Why*: Revealed preference is about actual choices, not option value. If the user doesn't choose X but says they value it, that's not revealed in their behavior.
    - *Sufficient answer*: We are observing the actual choice of X, not just the desire for the option to exist. If the claim is about option value, then revealed preference theory does not apply (we need stated preference).

  **Step 8: Check for Stated Preference (if available)**
    - *Question*: If we have stated preferences (e.g., surveys, interviews), do they align with the behavior? If not, why?
    - *Why*: A discrepancy might indicate that the behavior is driven by factors other than preference (like friction, compulsion, etc.).
    - *Sufficient answer*: The stated preferences align with the behavior, or we have a good reason for the misalignment (e.g., the survey was poorly designed). If there's a strong misalignment without explanation, stop: the behavior might not reflect preference.

  **Step 9: Judgment Call - Values and Goals**
    - *Question*: Even if we can infer a preference from behavior, does that preference align with our product goals and user welfare? (This is a values question, not measurement.)
    - *Why*: We might decide to override a revealed preference if it conflicts with user well-being (e.g., addictive features) or ethical standards.
    - *This step is always a judgment call*: No measurement can answer this. We must have a discussion.

  **Final Outputs of the Procedure:**
  - If we pass all steps 1-8 without stopping, we can say: "The behavior is consistent with a revealed preference for X."
  - If we stop at any step: "This behavior alone is not sufficient evidence of a preference for X. We need more data (specify what step failed) or we must use other methods (like surveys) to infer preference."
  - Step 9 is a separate, required discussion that might override the inference.

  **Important Notes:**
  - The procedure does **not** tell us what to build next. It only tells us whether a particular piece of behavior is evidence of preference. Product decisions involve trade-offs, values, and goals that go beyond preference (e.g., ethics, long-term strategy).
  - Many steps (especially 3, 4, 5, 6, 8) require judgment calls. We must be transparent about that.
  - The procedure is meant to be run quickly (10 minutes) by non-experts. If a step requires data we don't have, we note that and stop.

  ---

  **Running the Cases:**

  **Case 1: A/B test where variant B wins on click-through but variant A wins on satisfaction in a small follow-up survey.**

  - Step 0: Claim: The click-through behavior shows users prefer B over A.
  - Step 1: Stable preferences? Probably yes (same time period, short test).
  - Step 2: Menu effects? In an A/B test, the menu is fixed for each user (they see either A or B, but not both). However, note that in a typical A/B test, users don't choose between A and B; they are assigned one. So we are not observing a choice between A and B. **Stop at Step 2**: The menu is not the same for all (each user sees only one variant) and we are not observing a choice between the two. Therefore, click-through on B does not reveal a preference for B over A because the user never saw A. (We are inferring from the aggregate that more users clicked on B than on A, but that might be due to the specific assignment or other factors.) We need a different test (e.g., an A/B test with a choice between A and B presented together) to reveal preference.

  **Case 2: Buried toggle - new dashboard usage near-total because switching back is annoying.**

  - Step 0: Claim: High usage of the new dashboard shows users prefer it over the old one.
  - Step 1: Stable preferences? Yes, assuming the same time period.
  - Step 2: Menu effects? The menu includes both dashboards, so that's okay.
  - Step 3: Defaults and friction? The new dashboard is the default and switching back is hard (three clicks). This is a red flag.
  - Step 4: Consistency across constraints? We have not tested what happens if the default is reversed or if switching is made easy. Without that, we cannot know if the high usage is due to preference or friction. **Stop at Step 3 or 4**: We cannot infer preference because the behavior might be due to the default and high switching costs.

  **Case 3: Email digest that users rate 2/10 in surveys yet open every single day.**

  - Step 0: Claim: The opening behavior shows users prefer the email digest.
  - Step 1: Stable preferences? Yes, same period.
  - Step 2: Menu effects? The menu is fixed (they can choose to open or not open the email). Okay.
  - Step 3: Defaults and friction? Opening might be the default (it appears in their inbox) and not opening requires no action? Actually, not opening is the passive option. But the active choice is to open. There might be friction in ignoring (e.g., the notification badge). However, the friction is low for not opening (just ignore). So this might not be the main issue.
  - Step 4: Consistency across constraints? We haven't varied the constraints (e.g., making it harder to open? Not applicable). But note: they open every day even though it's easy not to. So why open? 
  - Step 5: Beliefs? They might believe there is important information, but the survey says they are dissatisfied. Maybe they have accurate beliefs but feel compelled.
  - Step 6: Compulsion or addiction? This is a strong candidate. They open it out of habit, compulsion, or fear of missing out, not because they like it. The survey shows low satisfaction. **Stop at Step 6**: The behavior is more likely due to compulsion than preference.

  ---

  **What the Procedure Can't Do:**
  - It cannot tell us what to build next. It only tells us whether a particular metric (behavior) is evidence of preference. 
  - It does not resolve value conflicts (Step 9 is a judgment call).
  - It does not measure the strength of preference.
  - It does not account for preferences that are not revealed (e.g., option value, future preferences).

  **Answer to the PM's Question:** 
  - "No, this procedure does not tell us what to build next. It only helps us evaluate if a specific behavior is evidence of preference. What to build depends on our goals, ethics, and strategy, which require human judgment."

  ---

  **Procedure Document (for the team):**

  We'll create a one-page checklist. For each step, we have:
  - Question
  - What to look for / evidence
  - If the answer is not sufficient, then stop and conclude: "Behavior is not evidence of preference."

  The goal is to have a shared framework to structure the discussion and prevent over-interpretation of metrics.
answer: |-
  ### Revealed Preference Assessment Protocol  
  **Purpose:** To determine if observed user behavior (e.g., clicks, engagement) licenses an inference of "preference" under revealed preference theory. Grounded in Samuelson’s core idea: preference is *only* inferrable from choices if choices are consistent across varying constraints (budgets, menus, effort). Fails when choices are distorted by friction, defaults, or compulsion.  

  **Outputs:**  
  - ✅ **"Preference Supported"**: Behavior meets criteria for inferring preference.  
  - 🛑 **"Behavior Only"**: Behavior is distorted; do not infer preference.  
  - ⚠️ **"Judgment Call Needed"**: Values/ethics question (e.g., "Should we override revealed preference?").  

  **Rules:**  
  1. **10-minute limit**: Focus on quick, evidence-based answers.  
  2. **Non-technical**: No jargon; use existing data (analytics, surveys, UX tests).  
  3. **Advisory**: Does not dictate product decisions—flags when behavior ≠ preference.  

  ---

  ### The Protocol: 9 Questions  
  *(Answer in order—stop at first 🛑 or ⚠️)*  

  #### Step 1: **Are preferences stable?**  
  *Why:* Revealed preference assumes preferences don’t shift mid-observation.  
  - **Check:** Is behavior measured over a short/consistent period (e.g., <2 weeks)? Are external shocks (e.g., pricing changes) absent?  
  - **Sufficient answer:** ✅ Yes + no major context shifts.  
  - **Stop if:** 🛑 No (e.g., behavior tracked over 6 months with market volatility).  

  #### Step 2: **Is the menu fixed and complete?**  
  *Why:* Choices must include all relevant options (per Sen). "Forced choice" invalidates inference.  
  - **Check:** Could users access alternatives easily? Were key options missing?  
  - **Sufficient answer:** ✅ Yes + alternatives were visible/accessible.  
  - **Stop if:** 🛑 Menu was restricted (e.g., users couldn’t see both A and B).  

  #### Step 3: **Are defaults/friction trivial?**  
  *Why:* High friction or defaults distort choices (e.g., "buried toggle" = effort barrier).  
  - **Check:** Is effort to choose alternatives ≤2 clicks? Was the "preferred" option the default?  
  - **Sufficient answer:** ✅ Effort is low + default rotated in tests.  
  - **Stop if:** 🛑 High friction/defaults drove behavior (e.g., reverting requires 3+ clicks).  

  #### Step 4: **Are choices consistent when constraints change?**  
  *Why:* True preference persists if "cost" (time, clicks, money) increases.  
  - **Check:** If we made the "preferred" option harder to access (e.g., buried it), would usage stay high?  
  - **Sufficient answer:** ✅ Yes, proven via A/B test (e.g., variant with reversed default).  
  - **Stop if:** 🛑 No data—or tests show usage drops when friction increases.  

  #### Step 5: **Are beliefs accurate?**  
  *Why:* Choices assume users understand options (e.g., no misinformation).  
  - **Check:** Do qualitative tests (e.g., user interviews) show users grasp what they’re choosing?  
  - **Sufficient answer:** ✅ Yes (e.g., users can explain features).  
  - **Stop if:** 🛑 Users are confused (e.g., 50% in surveys misreport functionality).  

  #### Step 6: **Is there evidence of compulsion?**  
  *Why:* Behavior may be addictive (not preferred) if paired with dissatisfaction.  
  - **Check:** Is engagement high while satisfaction is low (e.g., surveys, sentiment analysis)?  
  - **Sufficient answer:** ✅ No—satisfaction aligns with usage.  
  - **Stop if:** 🛑 Yes (e.g., high opens but low ratings).  

  #### Step 7: **Is "option value" conflated?**  
  *Why:* Users may want an option to *exist* but never choose it (not revealed preference).  
  - **Check:** Is behavior about *usage* (e.g., clicks) or *existence* (e.g., survey requests)?  
  - **Sufficient answer:** ✅ We measure usage, not requests.  
  - **Stop if:** 🛑 Claim relies on requests (e.g., "Users asked for this but don’t use it").  

  #### Step 8: **Do stated preferences align?**  
  *Why:* Misalignment suggests behavior is distorted (adaptive preferences/sour grapes).  
  - **Check:** Do surveys/interviews contradict behavior? If yes, is the gap explained?  
  - **Sufficient answer:** ✅ Align, or gap is explained (e.g., "Users hate spam but need alerts").  
  - **Stop if:** 🛑 Gap exists with no explanation (e.g., low satisfaction + high usage).  

  #### Step 9: **Should we override?**  
  *Why:* Even valid preference might conflict with ethics/well-being (e.g., addiction).  
  - **Check:** Does this preference harm users (e.g., dark patterns, compulsion)?  
  - **Sufficient answer:** ⚠️ Always a judgment call—no measurement. Discuss values.  

  ---

  ### Case Applications  
  #### Case 1: A/B Test  
  - **Claim:** CTR shows users prefer variant B over A.  
  - **Protocol:**  
    1. ✅ Preferences stable? *Yes (short test).*  
    2. ✅ Menu fixed? *Yes (A/B test has clear variants).*  
    3. ✅ Friction trivial? *Yes (equal access).*  
    4. ❌ Consistency? *No data on what happens if B is harder to access.*  
    5. ✅ Beliefs accurate? *Assume yes.*  
    6. ✅ No compulsion? *Assume yes.*  
    7. ✅ Measures usage.  
    8. 🛑 **Stated vs. revealed gap:** CTR favors B, but satisfaction favors A. Gap unexplained.  
  - **Verdict:** 🛑 **Behavior Only**—don’t infer preference.  

  #### Case 2: Buried Toggle  
  - **Claim:** Near-total usage shows preference for new dashboard.  
  - **Protocol:**  
    1. ✅ Preferences stable? *Yes.*  
    2. ✅ Menu fixed? *Yes (both dashboards available).*  
    3. 🛑 **Friction:** New dashboard is default; reverting takes 3 clicks.  
  - **Verdict:** 🛑 **Behavior Only**—friction invalidates inference.  

  #### Case 3: Email Digest (Answer You Won’t Like)  
  - **Claim:** Daily opens show preference for digest.  
  - **Protocol:**  
    1. ✅ Preferences stable? *Yes.*  
    2. ✅ Menu fixed? *Yes (open or ignore).*  
    3. ✅ Friction trivial? *Yes (ignoring is zero-effort).*  
    4. ✅ Consistency? *N/A (no constraint shift tested).*  
    5. ✅ Beliefs accurate? *Assume yes.*  
    6. 🛑 **Compulsion:** Opens daily but rates 2/10—classic compulsion signal.  
  - **Verdict:** 🛑 **Behavior Only**—usage likely addictive, not preferred.  

  ---

  ### What This Protocol Can and Can’t Do  
  **✅ Does:**  
  - Flags when behavior ≠ preference (saving you from false inferences).  
  - Forces rigor on defaults, friction, and compulsion.  
  - Exposes when data gaps require tests (e.g., Step 4 consistency checks).  

  **❌ Does NOT:**  
  - **Tell you what to build next.** Preference is one input—but ethics (Step 9), strategy, and user well-being matter more. *Example:* Even if users "prefer" a compulsive feature, you shouldn’t build it.  
  - **Resolve values debates.** Step 9 is always ⚠️—it requires team discussion.  
  - **Replace discovery.** If the protocol stops early (e.g., 🛑 at Step 3), run user interviews to learn *why* behavior is distorted.  

  **PM FAQ:**  
  > *"Does this ever tell us what to build?"*  
  **No.** It tells you when behavior reflects true preference. What you *do* with that requires judgment: e.g., "Users prefer frictionless design, but we won’t use dark patterns to achieve it."  

  ### Final Notes  
  - **Judgment calls:** Steps 5 (beliefs), 6 (compulsion), and 9 (values) are subjective. Admit this upfront—use qual data to reduce bias.  
  - **Critics covered:** Menu dependence (Step 2), friction (Step 3), adaptive preferences (Step 8), compulsion (Step 6).  
  - **Why use this?** Ends circular arguments by forcing explicit tests of revealed preference assumptions. If your team skips steps, they’re arguing vibes, not theory.  

  Print this as a 1-pager and run it in 10-minute syncs when claims arise.
