prompt: |-
  I'm taking a course on the ethics of war and we just did the week on the moral equality of combatants (Walzer vs. McMahan and all that), and it sent me down a rabbit hole about the actual legal architecture, because something feels off but I can't quite name it. Here's the practice as I understand it: under the Geneva Conventions, a captured soldier recieves POW protections no matter which side they fought on and no matter how unjust their side's cause — a Wehrmacht soldier captured in 1943 is entitled to the same treatment as an American one, at least on paper. And a rank-and-file soldier who fights faultlessly in a war of aggression commits no crime under international law; at Nuremberg it was the leadership that was prosecuted for planning aggressive war, not the soldiers who carried it out. But at the same time "I was just following orders" is explicitly not a defense for war crimes — a soldier is supposed to know that some orders (shoot the prisoners, target the village) must be refused — and states have historically court-martialed, even executed, their own soldiers for desertion or refusing to fight in wars those soldiers thought unjust, with those refuseniks sometimes getting pardoned decades later. So the same system seems to be saying: soldiers are NOT responsible for whether the war is just, but they ARE responsible for how they fight it. Oh and there's also the weird bit where POW status is conditioned on fighting "lawfully" in the technical sense — uniform, open carry of arms — so the system does condition protections on conduct, just never on cause.

  My question is basically: what theory of moral responsibility does this whole arrangement actually presuppose? Does giving POW status to soldiers of an unjust aggressor presuppose the moral equality of combatants in the philosophers' strong sense — the view that a soldier fighting for an unjust cause does no wrong at all by fighting, provided they follow the rules — or is it just reciprocity and prudence, you-treat-ours-well-and-we'll-treat-yours-well, which doesn't need any moral claim about the soldiers at all, just mutual interest? And is the "following orders" doctrine for war crimes actually consistent with the pass soldiers get on aggression? Is the thought that a conscript can reasonably be expected to know shooting prisoners is wrong but can't reasonably be expected to know whether their war is just — an epistemic line — or is it something about duress, or about the difference between what a state may demand and what it may excuse? I'm honestly not sure whether the pieces fit or whether they're just a historical accretion from different eras that nobody ever tried to make coherent.

  So what I'd like is the implicit theory reconstructed: what does this practice strictly need in order to make sense, which rival theories would it also fit (I'm guessing pure reciprocity, or maybe institutional skepticism about letting anyone judge which side is just, would also license it), and where is it genuinely underdetermined — i.e., which parts of the philosophy could change without the law having to change? And then flip it: if the revisionists are right that unjust combatants do something wrong by fighting at all, what concretely would have to change in the practice — do you get trials for mere participation, or reparations from conscripts of the losing side, or does the revisionist view collapse back into something like the current law once you account for excuse and duress? My professor keeps saying the law "presupposes" Walzer but I have a suspicion it presupposes much less than that, or possibly several incompatible things at once, and I want someone to actually work it through.
reasoning: |-
  Okay, let me try to unpack this user's question. They're taking an ethics of war course and are confused about the moral responsibility of soldiers under international law. The user points out that the Geneva Conventions grant POW status to all captured soldiers regardless of their side's cause, but soldiers can be prosecuted for war crimes if they follow illegal orders. They're asking what theory of moral responsibility underpins this system and whether it's consistent.

  First, I need to address the apparent contradiction they're seeing. On one hand, soldiers aren't held responsible for participating in an unjust war; on the other, they are responsible for how they fight. The user wonders if this is based on moral equality (Walzer's view) or just reciprocity and prudence. They also question the consistency between the "following orders" defense not excusing war crimes but excusing participation in aggression.

  The user's deeper need seems to be understanding the philosophical foundations of these laws and whether they hold up. They suspect the current system might be a patchwork of historical developments rather than a coherent framework. Their professor claims the law presupposes Walzer's moral equality, but the user is skeptical.

  I should break this down into parts. First, the legal architecture: POW status requires lawful combatancy (uniforms, open arms), which is about conduct, not cause. This is practical—it encourages compliance with jus in bello. The non-prosecution for aggression stems from the post-WWII consensus that only leaders bear that responsibility, avoiding collective punishment.

  For the "following orders" part, the doctrine balances individual accountability with recognition of military hierarchy. Soldiers must know basic humanitarian norms, but assessing a war's justice is seen as beyond their capacity. This is an epistemic line—knowing not to shoot prisoners is straightforward; judging geopolitical conflicts isn't.

  The user also asks about alternative theories. If revisionists like McMahan are right that unjust combatants are morally culpable, what would change? In practice, it's unlikely. Holding millions accountable isn't feasible, and reciprocity would collapse if POW protections were conditional on perceived justice. Duress and epistemic limitations would still excuse most soldiers, leading back to something like the current system.

  The user might be looking for validation that the law is more pragmatic than philosophical. They want to know if the pieces fit logically or are historical artifacts. The answer is both: the structure relies on separating jus ad bellum from jus in bello for practical reasons, not necessarily endorsing moral equality. Reciprocity and avoiding moral chaos are key drivers, not a deep philosophical commitment.

  I should also address where the law is underdetermined. The current system doesn't require believing all soldiers are morally equal; it just needs the separation of the two justice realms for functionality. Changing philosophical views wouldn't necessarily alter the law unless practicality demands it.

  In conclusion, the user's insight is correct—the law presupposes less than Walzer's moral equality. It's built on reciprocity, practicality, and a distinction between individual and state responsibility. The revisionist critique doesn't easily translate into legal changes without undermining the system's stability.
answer: |-
  This is a brilliantly sharp set of observations – you've hit the core tension in the legal architecture of war. Your professor's claim that it "presupposes Walzer" is common, but you're right to suspect it's more complex, perhaps even pragmatically incoherent. Let's break down the implicit theory and its alternatives:

  ## The Core Practice & Its Apparent Contradiction

  1.  **Immunity for Participation in Aggression:** Rank-and-file soldiers fighting for an aggressor state, even conscripts, commit no *international crime* merely by fighting (Nuremberg Principle IV: "The fact that a person acted pursuant to order... does not relieve him from responsibility... *provided a moral choice was in fact possible to him*" – note this applies to *crimes*, not participation itself). They get POW status if captured, regardless of the justice of their cause.
  2.  **Liability for War Crimes:** Soldiers *are* held individually responsible for violations of the laws of war (war crimes), even if following orders. "Superior orders" is a potential mitigating factor, not an absolute defense.
  3.  **Conditionality on Conduct, Not Cause:** POW status depends on fighting "lawfully" (uniform, open carry, command responsibility) – a *jus in bello* condition. It never depends on the *jus ad bellum* justice of the war itself.

  ## What Theory of Moral Responsibility Does This Presuppose?

  The practice **does not strictly require Walzer's strong Moral Equality of Combatants (MEC)**. It fits better with a **pragmatic, institutional, and reciprocity-based framework with a clear separation between *jus ad bellum* (justice of war) and *jus in bello* (justice in war), coupled with specific assumptions about agency and knowledge:**

  1.  **Separation of Jus ad Bellum and Jus in Bello:** This is the foundational pillar. The law deliberately compartmentalizes.
      *   *Purpose:* To ensure humanitarian protections (POW status, medical care, prohibitions on torture) apply universally *during* conflict, regardless of who started it. This aims to limit suffering *within* the war. Making POW status dependent on *jus ad bellum* assessment would collapse this separation and likely lead to reciprocal denial of protections, escalating brutality.
      *   *Moral Presupposition:* It presupposes that the rules governing *conduct* (e.g., don't target civilians, don't torture POWs) are universally binding and distinct from the question of *whether one should be fighting at all*. It does *not* necessarily presuppose that the *moral status* of the combatants is equal (Walzer's MEC). It can function even if we believe the aggressor soldier is *morally* doing something wrong by fighting, because the *legal* separation serves vital practical purposes.

  2.  **Reciprocity and Prudence as Primary Drivers:**
      *   *Core Justification:* This is arguably the *strongest* underpinning. States agree to treat each other's captured soldiers humanely ("If you treat ours well, we'll treat yours well"). This mutual self-interest is powerful and stable. Denying POW status to aggressor soldiers would destroy this reciprocity, leading to tit-for-tat brutality against one's own captured personnel. It's primarily a *state-to-state* bargain about treatment, not a judgment on individual soldiers.
      *   *Moral Presupposition:* Minimal. It doesn't require believing the soldiers are morally equal or innocent. It only requires that states value the welfare of their own soldiers enough to accept reciprocal obligations. It's a modus vivendi, not a moral theory.

  3.  **Epistemic Division of Labor:**
      *   *War Crimes (Jus in Bello):* The law assumes that the core prohibitions (no torture, no targeting civilians, no perfidy, etc.) are relatively simple, fundamental moral norms that any soldier can and *should* be expected to understand and refuse to violate, even under orders. The "moral choice" Nuremberg referred to is deemed possible here. Violating these is seen as a direct, personal moral failing.
      *   *Aggression (Jus ad Bellum):* The law assumes that assessing the complex geopolitical, historical, and legal justifications for a war (Was it preemptive or preventive? Was the threat imminent? Were negotiations exhausted?) is beyond the reasonable capacity of the ordinary soldier. They lack access to high-level intelligence, diplomatic cables, and the expertise to interpret international law at this level. Holding them responsible for accurately judging their state's *casus belli* is seen as epistemically unfair and practically unworkable. This judgment is reserved for the political/military leadership who planned and initiated the war.

  4.  **Distinction Between State and Individual Responsibility:**
      *   *Aggression:* Aggressive war is conceived as a *state crime* or a *crime of leadership*. The state, and its leaders who plan/order it, bear responsibility. The soldier is seen as an instrument of the state's policy, not its author. Holding individual soldiers liable would blur this line and resemble collective punishment.
      *   *War Crimes:* These are understood as *individual crimes*. While the state may be responsible for systemic violations, the individual perpetrator commits a personal wrong against the victim(s). The law insists on individual accountability for these specific harmful acts.

  5.  **Duress and Coercion (Implicitly):**
      *   While "following orders" isn't a defense, the Nuremberg proviso ("*provided a moral choice was in fact possible to him*") implicitly acknowledges the reality of military coercion, threat of punishment, and the breakdown of normal moral agency in combat. This *excuse* potential is much stronger for the conscript facing execution for desertion than for the volunteer deciding whether to shoot a prisoner. This factor helps explain the pass on participation (where state coercion is strongest) while insisting on limits for specific atrocities (where the "moral choice" is deemed clearer).

  ## Rival Theories the Practice *Also* Fits

  1.  **Pure Reciprocity/Prudence:** As argued above, this is sufficient. No moral claims about soldiers needed.
  2.  **Institutional Skepticism:** The system embodies deep skepticism about the possibility of achieving fair, consistent, and non-abusive adjudication of *jus ad bellum* guilt for millions of individual soldiers during or after a conflict. It prioritizes stable humanitarian rules over potentially chaotic moral judgments.
  3.  **McMahan-style Revisionism *with* Strong Excuses:** A revisionist *could* argue that while *morally* unjust combatants do wrong by fighting, *legally* they should *still* receive POW status and not be prosecuted *merely for fighting* due to **duress, epistemic limitations, and the dangers of collapsing reciprocity/humanitarian protections**. The revisionist critique focuses on the *moral* inequality; the *legal* practice can be justified on the pragmatic/excuse grounds listed above without endorsing MEC. McMahan himself often argues that while moral liability differs, the *legal* rules should largely remain due to these practicalities.

  ## Where is it Underdetermined?

  *   **The *Moral* Status of the Unjust Combatant:** The law doesn't require us to believe they are morally innocent (Walzer's MEC). It *can* function if we believe they are morally culpable but excused (duress/lack of knowledge) or if we prioritize reciprocity over moral judgment. The law is silent on this core philosophical debate.
  *   **The *Degree* of Excuse:** The law doesn't precisely define the threshold for "moral choice" or the level of duress required. This leaves room for interpretation in war crimes tribunals (mitigation vs. defense) but doesn't fundamentally challenge the separation for participation.
  *   **Volunteers vs. Conscripts:** The law treats them largely the same for POW status and non-prosecution for participation. A theory could argue volunteers bear *more* moral responsibility, but the law doesn't make this distinction, prioritizing uniformity and reciprocity.

  ## If Revisionists are Right: What Would *Concretely* Change?

  This is where the rubber meets the road. If we *legally* adopted the strong revisionist position (unjust combatants commit a crime *merely by fighting*), the practical consequences would be severe and likely unworkable:

  1.  **Mass Prosecutions:** Captured enemy soldiers (millions in major wars) would potentially face trial for the "crime" of participating in aggression. This is logistically impossible and would overwhelm any justice system.
  2.  **Collapse of Reciprocity/POW System:** Why would State A grant POW protections to State B's captured soldiers if State B is prosecuting A's soldiers as criminals merely for fighting? The reciprocal bargain collapses. Denial of POW status becomes likely, leading to reprisals and drastically worse treatment of *all* POWs.
  3.  **Reparations from Individual Soldiers?:** Holding individual soldiers financially liable for the costs of an aggressive war they fought in is economically absurd for most soldiers and politically explosive. Reparations are a state-to-state obligation, not an individual one (beyond specific war crimes damages).
  4.  **Who Judges "Just"?:** *During* the war, each side believes its cause is just. Who has the authority and legitimacy to make this determination *for the purpose of criminalizing mere participation*? An international court? The victor? This invites abuse and victor's justice on a massive scale.
  5.  **The Duress/Epistemic Excuse Collapse:** In practice, courts would be overwhelmed with arguments of duress (conscription, threat of execution for desertion/refusal) and lack of knowledge ("I believed my government's propaganda"). Almost all cases would likely collapse into findings of excuse or mitigation, functionally replicating the *current* practice of non-prosecution for mere participation. The *legal* category of "crime of aggression for soldiers" would be largely empty in practice.

  **Therefore, even if revisionists are *morally* correct, the *legal* architecture would likely remain largely unchanged.** The powerful forces of reciprocity, practicality, institutional skepticism, and the recognition of genuine excuses (duress, epistemic limits) are so strong that implementing the revisionist moral view at the level of individual soldier liability for participation is almost certainly unfeasible and counterproductive to humanitarian aims. The separation of *jus ad bellum* and *jus in bello*, and the focus on leadership for aggression while holding individuals accountable for specific atrocities committed *within* the war, is deeply embedded for pragmatic reasons that transcend the philosophical debate about MEC.

  ## Conclusion

  Your instinct is correct. The law does **not** strictly presuppose Walzer's strong Moral Equality of Combatants. It **primarily presupposes**:

  1.  **A strict separation of *jus ad bellum* and *jus in bello* for humanitarian and practical reasons.**
  2.  **Reciprocity and prudence** as the bedrock for POW protections and the non-prosecution of rank-and-file soldiers for participation.
  3.  **An epistemic distinction:** Soldiers can reasonably know core *jus in bello* norms but cannot reasonably be expected to adjudicate *jus ad bellum*.
  4.  **A distinction between state/leadership responsibility (for aggression) and individual responsibility (for war crimes).**
  5.  **An implicit acknowledgment of duress and coercion** within the military structure, particularly concerning participation.

  The pieces fit together as a **pragmatic, institutional solution** designed to manage the horrors of war by ensuring basic humanitarian protections (via reciprocity) and holding individuals accountable only for acts that are seen as clearly within their moral comprehension and control (war crimes), while avoiding the chaos and impracticality of trying to judge the individual moral culpability of millions for the abstract crime of participation in an unjust war initiated by their state. It's a system built more on historical experience (the failures of reciprocity, the dangers of victor's justice, the horrors of total war) and practical necessity than on a single, coherent, and philosophically rigorous theory of moral responsibility. Walzer *described* the separation inherent in the law, but the law itself rests on foundations (reciprocity, prudence, institutional limits) that are more fundamental and less philosophically demanding than his moral justification for MEC.
