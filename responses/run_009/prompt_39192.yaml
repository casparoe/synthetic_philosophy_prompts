  ### Rational Choice Seminar Activity: The Spectrum Challenge

  #### **Activity Overview**
  This 75-minute activity simulates the "self-torturer" paradox to expose intransitive preferences. Students make pairwise choices between adjacent options on a spectrum (0–20), where each step offers a small reward but cumulative "discomfort" leads to a stark endpoint. Revealed preferences are recorded, then the class reconstructs a ranking, revealing a cycle (0 < 1 < ... < 20, but 0 > 20). The debrief connects this to transitivity failures, indifference, and deliberation costs.

  #### **Rules & Setup**
  1. **Spectrum**: 21 settings (0 to 20).  
     - **Setting 0**: 0 points, "trivial nuisance" (e.g., a barely noticeable hum).  
     - **Setting 20**: 20 points, "genuinely bad" (e.g., painful noise).  
     - **Key**: Each step’s discomfort difference is *imperceptible*, but endpoints differ dramatically.  

  2. **Payoff Scheme** (token points, no real money):  
     - **Reward**: Moving to setting `k` grants `k` points (cumulative).  
     - **Discomfort**: Revealed at the end: **`D(k) = 0.06 × k²`** points deducted.  
       - *Example*: At `k=20`, reward = 20, discomfort = 24 (net = −4).  
     - **Net Points**: `k - 0.06 × k²`. (Optimal: k=8, net=4.16; k=20, net=−4).  

  3. **Choice Process**:  
     - Each student starts at 0.  
     - For settings 0 to 19, they choose:  
       - **Option A**: Stay at `k`, bank `k` points (ends journey).  
       - **Option B**: Move to `k+1`, gain `1` additional point.  
     - Choices are sequential and binding. Stopping points are recorded.  

  4. **Imperceptibility Simulation**:  
     - Emphasize: *"The discomfort increase between adjacent settings is imperceptible. Focus only on the immediate choice: 1 extra point vs. imperceptible cost."*  
     - Hide `D(k)` until Phase 2.  

  #### **Timeline (75 min)**  
  1. **Introduction (10 min)**:  
     - Explain the device (e.g., sound generator), rewards, and "imperceptible discomfort."  
     - Distribute worksheets (or use digital forms).  

  2. **Phase 1: Pairwise Choices (20 min)**:  
     - Students move through settings 0→20, deciding whether to stop or continue.  
     - **Instructor Role**:  
       - Record each student’s stopping point (k).  
       - Tally revealed preferences per adjacent pair (e.g., "How many chose k+1 > k at step 5?").  

  3. **Phase 2: Reconstruction (15 min)**:  
     - **Step 1**: Plot stopping points on a histogram (0–20). *Expected result*: Most stop at 20.  
     - **Step 2**: Map revealed preferences:  
       - For each `k` from 0 to 19, students revealed `k+1 > k` (since they moved).  
       - At stopping point `m`, they revealed `m > m+1` (since they refused to move).  
     - **Step 3**: Chain preferences:  
       - *Example*: 1 > 0, 2 > 1, ..., 20 > 19 → implying 20 > 0.  
     - **Step 4**: Vote: "Given net outcomes, prefer 0 or 20?" *Expected*: 0 > 20 (net: 0 vs. −4).  
     - **Result**: Cycle exposed (20 > 0 via chain, but 0 > 20 directly).  

  4. **Debrief (30 min)**:  
     - **Map to Spectrum Argument**:  
       - **Step 1**: Adjacency imperceptibility → strict preference for next step (k+1 > k).  
       - **Step 2**: Transitivity implies endpoint consistency (0 < 20).  
       - **Step 3**: Endpoints are perceptibly different → 0 > 20.  
       - **Contradiction**: Violates transitivity of "better than."  
     - **Distinguish Intransitivity from Confounds**:  
       - **Genuine Intransitivity**: Cycle (0 < 1 < ... < 20 < 0) is irrational.  
       - **Indifference**: If adjacent steps were indifferent, no strict chain—but students *acted* as if strict.  
       - **Deliberation Costs**: Rational shortcuts might cause errors, but here students deliberated fully.  
     - **Money-Pump Argument**:  
       - *Scenario*: Start at 0. Offer to move to 1 for $0.01 (net gain). Repeat to 20. Then offer to reset to 0 for $0.02 (since 0 > 20). Cycle drains money.  
       - *Objection*: "I’d refuse the pump!"  
         - *Reply*: Refusing beneficial trades (e.g., k to k+1) is irrational if you truly prefer k+1. Only transitive preferences avoid exploitation.  
     - **Unsimulatable Feature**:  
       - **Imperceptibility**: Token points make discomfort *perceptible* (students see `k` vs. `k+1`). Discuss: *True imperceptibility (e.g., pain thresholds) prevents "noticing" the cost, making strict preference for each step plausible. Points are a proxy, not a perfect analog.*  

  #### **Materials**  
  - **Worksheets**: 14 sheets with choice sequence (0–20).  
  - **Projector/Whiteboard**: For recording stopping points and preferences.  
  - **Histogram Template**: Visualize distribution of stopping points.  
  - **Calculator**: Compute net points during debrief.  

  #### **Predicted Challenges & Mitigation**  
  1. **"Test of Nerve" Behavior**:  
     - Students may compete to reach k=20 (ignoring discomfort).  
     - *Mitigation*: Stress: *"This is about preference, not endurance. Choose based on what you’d want, not what you can tolerate."*  

  2. **Early Stopping**:  
     - Some may stop early (e.g., k=10) if they distrust the setup.  
     - *Mitigation*: Reiterate imperceptibility: *"Ask yourself: would I notice moving to k+1? If not, the extra point is pure gain."*  

  3. **Reconstruction Errors**:  
     - Students may deny the cycle ("I just liked 20 until I saw the cost!").  
     - *Mitigation*: Clarify that revealed preferences (choices) define rationality—not later regret.  

  4. **Imperceptibility Debate**:  
     - Students may argue points make discomfort "perceptible."  
     - *Address in Debrief*: Acknowledge the simulation’s limitation and pivot to the philosophical point: *"In real sensory cases, imperceptibility enables strict dominance per step, creating the paradox."*  

  #### **Instructor Notes**  
  - **Key Insight**: The activity *cannot* physically simulate imperceptibility. Use discussion to bridge the gap: "In true self-torturer cases, you literally can’t feel the difference between k and k+1—so the reward seems free. Points are a stand-in, but the logic holds."  
  - **Flexibility**: If students stall at low `k`, use aggregate data to show most progressed far (emphasizing the paradox’s inevitability).  
  - **Ethical Angle**: Debrief with: "Would you sign a real self-torturer contract? Why can’t rational choice handle this?"  

  This activity forces confrontation with transitivity failures, using a visceral chain of choices to make abstract theory tangible. The money-pump discussion then highlights high stakes: intransitive preferences are exploitable.
