     If they ask during the pairwise choice: "What is the discomfort function?" we say: "We cannot tell you the exact discomfort function, but we can tell you that the difference in discomfort between any two adjacent settings is imperceptible, and the discomfort level is cumulative in a way that at 20 it is very high."

