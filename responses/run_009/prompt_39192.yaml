     - Students might not take the discomfort seriously and go for the points, so they choose 20 over 0 even after knowing the discomfort function? 
          Mitigation: In the 0 vs 20 vote, remind them that the discomfort at 20 is very high (painful) and the net is negative.

     - Students might try to optimize and not follow the pairwise choices as intended. For example, they might think: "I know that the discomfort is quadratic, so I'll stop at the optimal point." But we haven't told them the discomfort function during the pairwise choices. We only tell them the discomfort level in units and say the difference is imperceptible. So they should only consider the points and the fact that the discomfort difference is imperceptible.

