     - The activity might take longer than expected. We have to keep the pace.

     - The students might not see the cycle as a problem: "So what if my preferences are intransitive? I can just avoid the money pump by not engaging." We have to be ready to explain the vulnerability.

     - The feature we cannot reproduce: imperceptibility. We have to supply in discussion that the real paradox relies on the physical inability to perceive the difference, which makes the agent see only the benefit of the next step. In our numerical version, they can see the numbers, so they might be able to avoid the trap by calculating. But we instruct them not to.

   Summary of the activity:

     Title: The Self-Torturer's Dilemma

     Steps:

       1. Introduction (5 min): 
