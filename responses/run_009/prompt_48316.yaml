prompt: |-
  My friend is unusually consistent about the rationality of tiny individual contributions to huge collective outcomes, and I've been collecting her verdicts: you should vote in a national election even if you live in a state that will never be close; buying a lottery ticket is irrational; recycling your single bin is rational, and a neighbor who doesn't recycle is blameworthy; giving a small amount to a malaria charity is rational even though your donation alone will prevent at most a fraction of one death; serving on a jury in a tedious case is the rational thing to do; but she dismisses Pascal's wager as obviously irrational, and she says cheering while watching a match alone at home is harmless but not something reason asks of you. Next week we're going to argue about three new cases: voting for a third-party candidate with no chance of winning when she lives in a swing state and much prefers the lesser evil; giving five dollars to a stranger who claims his organization can avert a catastrophe affecting billions of people with a probability of one in a trillion; and walking five miles in freezing rain to vote in a low-stakes local referendum that the polls say will be decided by thousands. Predict her verdict on each of the three, identify the rules that fit her track record so far (I can see at least two), say what each rule predicts about the new cases, give your best guess with your reasons, and tell me what further case would best tell the candidate rules apart. Please write in continuous prose only, as in a letter: no headings, bullet points, bold text, or tables.
reasoning: |-
  Okay, let me think through this step by step. The user presents an interesting puzzle about their friend's consistency in judging rational actions involving tiny individual contributions to large collective outcomes. From the examples given, I need to infer the underlying principles governing her judgments.

  First, examining her track record shows a clear pattern. She endorses actions like voting in uncompetitive states, recycling, donating to malaria charities, and jury duty because they contribute to collective goods where individual actions are non-pivotal but participation norms matter. Conversely, she rejects lottery tickets (negative expected value) and Pascal's wager (infinite stakes don't override infinitesimal probabilities). Cheering alone falls outside rational obligation as it lacks causal impact.

  For the three new cases, two key rules seem to explain her prior judgments:
  1) The Participation Rule: Contributing is rational when (a) collective success is valuable, (b) contributions are non-pivotal but necessary for the mechanism, and (c) personal cost is reasonable relative to expected collective benefit.
  2) The Threshold Rule: Actions are irrational when probability of individual impact falls below a de minimis threshold, regardless of stakes.

  Applying these to the new scenarios:
  - Third-party voting in swing state: Participation Rule suggests rational since voting mechanism relies on participation, though Threshold Rule might trigger if her vote is truly negligible. I predict "rational" with possible caveats about spoiler effect.

  - $5 for trillion-to-one intervention: Threshold Rule clearly applies - probability is below any reasonable significance cutoff. Prediction: irrational.

  - Walking miles in freezing rain for predetermined referendum: Participation Rule's cost-benefit clause likely violated - excessive effort for near-zero marginal impact. Prediction: irrational.

  To distinguish between the two rules, a scenario where probability is extremely low but not quite de minimis would be ideal - say donating to prevent an asteroid impact with 1 in 10 billion odds. The Participation Rule might endorse it while the Threshold Rule rejects it.

  Throughout this, I'm considering how to present this analysis in smooth, letter-like prose as requested, weaving the predictions and reasoning together naturally while highlighting the philosophical tension in her framework.
answer: |-
  My dear friend,  

  I've been pondering your friend’s fascinating pattern of judgments—her razor-thin line between the rational and irrational in collective action dilemmas—and I think I’ve untangled the principles guiding her. Her track record reveals two core rules, often in tension but consistently applied:  

  1.  **The Participation Rule**: An individual contribution is rational if:  
      - The collective outcome is valuable (e.g., a functioning democracy, reduced suffering, environmental protection, justice).  
      - The *mechanism* linking contributions to the outcome is robust and credible (e.g., elections aggregate votes, charities pool donations, recycling systems collect waste).  
      - The cost to the individual is low *relative to the expected collective benefit per participant*, even if their specific contribution is non-pivotal. Blameworthiness arises when others *defect* from such a generally beneficial norm.  
      *Examples:* Voting (any state), recycling, donating to effective charity, jury duty.  

  2.  **The Threshold Rule**: An action is irrational if the *probability* that the individual’s contribution is *pivotal* (makes the decisive difference) falls below a de minimis threshold. This holds regardless of the stakes involved, dismissing "Pascalian" reasoning with vanishingly small probabilities.  
      *Examples:* Buying a lottery ticket (negative expected value, negligible win chance), Pascal’s Wager (infinitesimal probability God exists *and* cares about that specific wager). Cheering alone fails as it has *no* causal mechanism for impact.  

  Now, for her likely verdicts on your three new cases:  

  1.  **Voting third-party in a swing state, preferring the lesser evil:**  
      *Prediction:* **Irrational.**  
      *Reasoning:* The Participation Rule supports voting *generally* (valuable mechanism, low cost). However, in a *swing state*, the probability of being pivotal between the two viable candidates is non-negligible (though still small). Voting third-party carries a high *opportunity cost* – by not voting for the lesser evil, she marginally increases the risk of the greater evil winning. The Threshold Rule isn’t strongly triggered here (pivotal probability isn't *de minimis* in a swing state), but the Participation Rule's requirement for a "robust mechanism" is strained. The *mechanism* of electing a viable candidate is undermined by voting for someone who cannot win, especially when strong preferences exist between the viable options. Her blame for non-recyclers suggests she values strategic participation within the system. She’ll likely see this as akin to defecting from a necessary collective norm (preventing the worst outcome), making it blameworthy and irrational.  

  2.  **Giving $5 to avert a 1-in-1-trillion catastrophe:**  
      *Prediction:* **Irrational.**  
      *Reasoning:* This screams for the Threshold Rule. While the potential collective outcome is astronomically valuable (saving billions), the probability that *this specific $5* is pivotal is not just small, but *1-in-1-trillion*. This falls far below any conceivable de minimis threshold she employs, as evidenced by her rejection of Pascal's Wager (which involves infinite stakes!). The Participation Rule also fails: the mechanism described (a stranger's claim) lacks the robust credibility of an established charity like the malaria example. It feels like a lottery ticket on an unimaginable scale – minimal cost, cosmic stakes, but a probability so vanishingly small that reason cannot endorse it. She will dismiss this as Pascalian nonsense.  

  3.  **Walking 5 miles in freezing rain to vote in a predetermined low-stakes referendum:**  
      *Prediction:* **Irrational.**  
      *Reasoning:* The Participation Rule *nominally* supports voting (valuable democratic mechanism). However, the *cost* here is very high (significant discomfort, time, risk). Crucially, the polls indicate the outcome is predetermined by thousands of votes, making the *probability of being pivotal* effectively zero – solidly triggering the Threshold Rule. While voting in a national election in a safe state has low cost and supports the *general* norm, this scenario involves high personal cost for absolutely zero expected marginal impact on the collective outcome (unlike recycling, where each bin *does* contribute minutely to the aggregate collected). The cost-benefit ratio within the Participation Rule framework is decisively negative. Reason does not demand such pointless sacrifice.  

  **Distinguishing the Rules: The Critical Test Case**  
  The tension between the Participation Rule (valuing contribution to the mechanism/norm) and the Threshold Rule (rejecting vanishing probabilities) is clearest in cases of *extremely low probability but extremely high stakes with a credible mechanism*.  

  The best case to tell them apart is: **Donating $10 to a rigorously vetted scientific effort aimed at preventing a global catastrophic risk (e.g., an asteroid deflection prototype), where the best estimate is that the *entire project* has only a 1-in-10-billion chance of ever preventing a specific catastrophe that would kill 1 billion people, and your $10 is a truly marginal contribution.**  

  *   **Participation Rule Prediction:** *Rational.* The collective outcome is immensely valuable. The mechanism (funding research) is credible and relies on pooled contributions. The cost is low. Your donation supports the valuable norm and mechanism, even if the chance *this specific $10* is pivotal is miniscule (1-in-10-billion is still above *absolute* zero, and the mechanism matters).  
  *   **Threshold Rule Prediction:** *Irrational.* The probability that your $10 makes the decisive difference (pushes the project over a funding threshold that changes the outcome) is 1-in-10-billion. This is below any reasonable de minimis threshold, similar to the 1-in-1-trillion case. The stakes, while huge, don't override the vanishing probability.  

  Your friend's verdict on *this* case would be highly revealing. If she endorses it, the Participation Rule (emphasizing mechanism/norm contribution) dominates. If she rejects it, the Threshold Rule (focused strictly on pivotal probability) is her ultimate guide. Her dismissal of Pascal’s Wager suggests the Threshold Rule is powerful, but her acceptance of malaria donations (where *your specific donation* also almost certainly isn't pivotal for a specific life) suggests the Participation Rule holds significant sway. This asteroid case sits precisely on that knife's edge.  

  I admire your friend's intellectual consistency; it forces us to confront the uncomfortable math and moral pulls of collective action. Do let me know how your debate unfolds next week – particularly if she surprises us!  

  Warmly,  
  [Your Name]
