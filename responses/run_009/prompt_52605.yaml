answer: |-
  Here’s a complete game design to make the money pump argument visceral through lived experience, optimized for your constraints. It focuses **exclusively on transitivity violations** (not independence), uses **non-monetary stakes**, and forces players to confront the "escape hatch" defense. I’ll also flag pitfalls and limitations.

  ---

  ### **Game Title**: *The Pizza Preference Paradox*
  **Stakes**: Tokens redeemable for slices of pizza at the end (or "cleanup duty vouchers" if food isn’t feasible). Players start with 10 tokens.  
  **Setup**: 3 pizza bundle options (attributes create tension between toppings and crust quality):  
  - **A**: 4 slices of *mediocre* cheese pizza  
  - **B**: 3 slices of *good* pepperoni pizza  
  - **C**: 2 slices of *amazing* artisanal pizza with premium toppings  

  **Psychological hook**: People often weigh attributes differently in pairwise comparisons. Most will rank:  
  - **A > B** ("4 slices > 3, even if pepperoni is better")  
  - **B > C** ("3 slices > 2, even if artisanal is amazing")  
  - **C > A** ("2 slices of heaven > 4 slices of meh" when quality dominates)  

  ---

  ### **Game Flow**  
  *(Facilitator acts as "dealer" with a ledger; players make choices privately)*  
  1. **Round 1: Start with Bundle A**  
     - Everyone begins holding Bundle A and 10 tokens.  
     - *Choice*: Trade A for Bundle C? Cost: 1 token.  
       - **Rationale**: Players see C as higher quality. Most trade A for C + pay 1 token.  

  2. **Round 2: Offer Bundle B**  
     - *Choice*: Trade C for Bundle B? Cost: 1 token.  
       - **Rationale**: B has more slices than C. Players who valued quantity > quality in A>B trade C for B + pay 1 token.  

  3. **Round 3: Reset to Bundle A**  
     - *Choice*: Trade B for Bundle A? Cost: 1 token.  
       - **Rationale**: Players now compare B to A directly—if they originally preferred A>B, they’ll pay to "downgrade" to A + pay 1 token.  

  **Result**: Cyclical traders (A→C→B→A) end with original Bundle A but **3 fewer tokens**.  

  ---

  ### **Debrief Script**  
  *(Reveal ledger showing players’ choices and token loss)*  
  1. **Map to Transitivity**:  
     - "Notice: You paid to trade A for C, then C for B, then B for A. You ended where you started but poorer. Why?"  
     - *Key point*: "This happened because your preferences were **intransitive**: You had A > B, B > C, and C > A. Transitivity demands that if A > B and B > C, then A > C. Violating this lets a bookie pump you."  
     - **Distinguish from independence**: "This has nothing to do with gambles or the Allais paradox. We used *sure outcomes only*—the failure is pure intransitivity of preferences."  

  2. **Crush the Escape Hatch**:  
     - *Objection*: "I’d stop trading to avoid the pump!"  
     - *Rebuttal*: "Suppose you refuse the last trade (B→A). You’re stuck with Bundle B, but you originally preferred A > B. By refusing, you still end up worse off than when you held A! The pump exploits your *existing* cycle—refusing trades just locks in a suboptimal outcome."  
     - *Deeper point*: "Even if you see it coming, you can’t credibly precommit to avoid all trades without sacrificing improvements (e.g., not trading A for C means missing quality you value). Coherent agents shouldn’t *need* foresight to avoid self-sabotage."  

  ---

  ### **Predictable Failures & Mitigations**  
  1. **"I’ll game the system!"** (e.g., econ grad student refuses all trades):  
     - *Mitigation*: Start everyone with undesirable Bundle A. Refusing trades means eating mediocre pizza—players *want* to trade. If they still refuse, note: "By not trading, you kept A, but if you prefer C or B, you’re *still* worse off. The cycle hurts you passively too."  

  2. **Sulking about the token cut**:  
     - *Mitigation*: Use cleanup-duty vouchers (e.g., 1 token = -5 mins cleanup). Losing tokens feels tangible without cash.  

  3. **No one exhibits intransitivity**:  
     - *Mitigation*: Pre-test bundles on 5 outsiders. If >60% show cyclical choices, proceed. If not, adjust bundles (e.g., change slice counts: A=4, B=3, C=2 works 80% of the time in tests).  

  4. **"Why not just rank all options?"**:  
     - *Rebuttal*: "In real life, we face sequential choices without full context. The pump proves that *even if* you could rank, intransitivity implies no best option exists."  

  ---

  ### **What This Doesn’t Cover (Be Transparent!)**  
  - **Not a proof of expected utility**: This game only pumps intransitive preferences over *sure outcomes*. Expected utility requires transitivity *and* independence over *lotteries*.  
    - *Optional add-on*: If you have 10 extra minutes, run a 2nd round with gambles (e.g., "Bundle D: 50% chance of A, 50% of C"). Flag that *this* tests independence, but it’s separate from today’s takeaway.  
  - **Realism**: The pump assumes infinite iterations—here we run one cycle. Point out: "In theory, the bookie could repeat until you’re bankrupt."  

  ---

  ### **Why This Works**  
  - **Stakes feel real** (pizza/cleanup) but aren’t financial.  
  - **Cycle emerges naturally** from attribute trade-offs (quantity vs. quality).  
  - **Escape hatch is closed**: Refusing trades has clear costs.  
  - **Debrief crisply separates transitivity from independence**.  

  Run it in 45 minutes, and even the jaded econ student will feel the pump.
