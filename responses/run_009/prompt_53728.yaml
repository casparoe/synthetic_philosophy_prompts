prompt: |-
  So here's my situation. I spent thirty-five years as a field ecologist, retired a while back, and somewhere along the way I got really into political philosophy — federalism especially. Subsidiarity, cooperative federalism in Germany, the Swiss with their cantons and referendums, the EU's whole "decisions as close to the citizen as possible" business. Great stuff to read about with coffee.

  Meanwhile, in actual life, I chair the goverance committee of a national conservation volunteer federation: roughly 180 local groups, 11 regional bodies, and a national office with paid staff. Our single most reliable source of drama is level-of-decision fights. Should local groups pick their own restoration projects? Obviously yes, everyone says. But their own safety protocols for volunteer chainsaw crews? Their own grant applications? Can a local group take a public position on a zoning fight using the federation's name, or do positions only get taken nationally? Can the national office mandate that everyone log species records into one shared monitoring database? Right now we have nothing written down, so every one of these is ad hoc, decided by whoever argues longest at the meeting, and then relitigated.

  It seems to me the philosophy of subsidiarity actually has content — it's not just "local is always better," it's about the lowest level that can handle the decision, which is a different thing. And the surrounding arguments have content too: externalities between groups, races to the bottom if standards fragment, capacity (a group having the *right* to decide isn't the same as being able to), uniformity as a value versus diversity as a value, the difference between a task being done centrally and being *imposed* centrally. But it's all stated at the level of principle, and I need a procedure.

  Concretely: our committee meets monthly, these disputes land on my desk three or four times a month, and whatever we come up with has to be runnable by volunteers with zero philosophy background in under an hour. So basically a one-page checklist with a defined stopping point for a "decide locally" verdict, a "decide nationally" verdict, and an explicit "this is a values question, escalate to the trustees" verdict — the trustees are the ones who sign off on anything political.

  Write me the procedure: the questions in order, what counts as a sufficient answer to each, where it hands off to humans because the question is genuinely one of values rather than facts, and please be honest about which steps are judgment calls dressed up as procedure. Then run it on three real-ish cases: (1) the national office wants to standardize chainsaw safety training across all groups, over the objection of two regions whose local practices have been fine for years; (2) a local group wants to co-host a campaign rally with a political party under the federation's logo ahead of a land-use referendum; (3) the national office wants to require every group to log their species records into a shared national database, and one local group says their records are their own business. At least one of these should come out the way the local-autonomy people won't like — I suspect the safety one, but I want to see whether the procedure genuinely gets there or just hand-waves.

  Structure it like this, please: "Bottom line" first (what the procedure is, one short paragraph); "The procedure" (numbered steps, what each question means, and what a sufficient answer looks like, about 700 words); "Three test cases" (roughly 200 words each); "Where it misfires" (what the procedure can't settle and when we should just not use it, about 200 words). And no reading list — I've got enough books, I need the thing to actually run at a Tuesday meeting.
reasoning: |-
  Okay, let me tackle this fascinating challenge from a retired field ecologist turned federalism enthusiast. The user chairs a conservation federation's governance committee facing constant disputes about decision levels between local, regional and national bodies. 

  Hmm, the core tension here is between philosophical depth and practical necessity. The user clearly grashes subsidiarity's nuances but needs something operational - a "one-page checklist" for volunteers to resolve disputes in under an hour. There's urgency in those "three or four disputes monthly" landing on their desk. 

  First, I should acknowledge what makes this hard: subsidiarity isn't just local=good. As the user notes, it involves capacity assessments, externality risks, and value judgments. But translating that into binary outputs ("local decide" vs "national decide") requires brutal simplification. 

  The procedure must answer three key questions derived from subsidiarity principles:
  1) Does this decision create spillover effects beyond the local group? (Harmonization needed)
  2) Is local capacity realistically adequate? (Not just rights but ability)
  3) Does this touch core values requiring political ownership? (Trustee escalation)

  For the test cases:
  - Chainsaw safety: Clear spillover (liability) and minimum standard need → national
  - Campaign rally: Core values/political risk → escalate to trustees
  - Species database: Mixed case - spillover benefits but implementation concerns → "national decide with local flexibility" 

  I'm wary of over-engineering. The "judgment calls dressed as procedure" warning is crucial - hence building in off-ramps to trustees when values dominate. The stopping rules (no more than 3 questions) honor the "under one hour" constraint.

  Biggest challenge is avoiding false precision. That's why Step 4 forces explicit recognition of uncertainty instead of pretending all factors are measurable. The "Where it misfires" section will emphasize that some conflicts are truly about power, not principles - and the procedure shouldn't pretend otherwise.

  Noticing the user's subtle hint: they want at least one "unpopular" outcome to test rigor. Chainsaw safety is perfect for this - local groups will hate it, but the liability externality makes national standardization defensible through the procedure's logic. If it passes that test, credibility follows.
answer: |-
  ## Bottom Line
  Here's a one-page Subsidiarity Decision Procedure: a 4-question flowchart determining if a decision should be made locally, nationally, or escalated to trustees based on spillover effects, capacity, standardization needs, and core values. It aims for objective criteria but flags inherent judgment points.

  ---

  ### The Subsidiarity Decision Procedure (4 Steps - Approx. 15-30 mins per case)

  1.  **Question 1: Does this decision primarily impact only the local group(s) directly involved, OR does it create significant risks/benefits for other groups, the federation's reputation, finances, or legal standing?**
      *   **What it means:** Identify spillovers (externalities). Local-only impact favors local control. Federation-wide risks/benefits favor national.
      *   **Sufficient Answer:** Concrete evidence of impact beyond the immediate group(s). Examples: "This safety lapse could bankrupt the whole federation" (Risk), "This database makes regional conservation planning possible" (Benefit), "This political stance contradicts our national policy, confusing partners" (Reputation). *Judgment Call:* Defining "significant" risk/benefit is subjective. Focus on demonstrable, material consequences.
      *   **Decision Path:**
          *   **Primarily Local Impact?** → Move to Question 2.
          *   **Significant Spillover Risk/Benefit?** → Move to Question 3.
          *   **Unclear?** → Document uncertainty; Proceed to Question 2 but note spillover concern.

  2.  **Question 2: Do the directly impacted local group(s) demonstrably have the capacity (expertise, resources, time) to make and implement this decision effectively and safely?**
      *   **What it means:** Rights ≠ Capacity. Assess practical ability, not just desire. "Effectively" means achieving the core objective (e.g., safety, data quality). "Safely" means avoiding unacceptable risk.
      *   **Sufficient Answer:** Evidence of past performance, specific volunteer skills (e.g., certified trainers), resource availability (e.g., budget for equipment), or documented processes. Lack of evidence = insufficiency. *Judgment Call:* Assessing "demonstrably" requires some trust or evidence. "We've always done it" isn't *proof* of safety/effectiveness.
      *   **Decision Path:**
          *   **Yes, Demonstrable Capacity?** → **VERDICT: Decide Locally.** (Document rationale: Local Impact + Capacity).
          *   **No, or Insufficient Evidence of Capacity?** → Move to Question 3.
          *   **Unclear?** → Document uncertainty; Proceed to Question 3, noting capacity concern.

  3.  **Question 3: Is there a compelling need for standardization across the federation? (Check ALL that apply; ONE "Yes" is sufficient)**
      *   **a) Safety/Legal Compliance:** Is a single, defined standard essential to meet legal requirements or ensure volunteer/member safety at an acceptable minimum level? (Avoiding race to bottom).
      *   **b) Efficiency/Scale:** Does central action offer major cost savings, resource pooling, or efficiency impossible locally? (e.g., bulk purchasing, shared platform).
      *   **c) Effectiveness of Core Mission:** Is uniformity critical for the federation's core conservation/science goals? (e.g., compatible data for national analysis).
      *   **d) Equity:** Is standardization needed to ensure all groups/members receive a comparable baseline benefit/service?
      *   **What it means:** Is fragmentation actively harmful or does centralization offer critical advantages *beyond* spillover management? "Compelling" implies necessity, not just preference.
      *   **Sufficient Answer:** Specific justification for *why* standardization is necessary in *this* case. Not "it would be nice," but "it's essential for X concrete reason." *Judgment Call:* Defining "compelling" and "acceptable minimum level." Requires weighing benefits against loss of local autonomy.
      *   **Decision Path:**
          *   **No compelling need for standardization?** → **VERDICT: Decide Locally.** (Rationale: Even with spillover/capacity concerns, standardization isn't justified).
          *   **Yes, compelling need in at least one area?** → Move to Question 4.

  4.  **Question 4: Does this decision fundamentally involve the federation's core values, political/public positioning, or major strategic direction?**
      *   **What it means:** Is this about *who we are* or *where we stand* as a federation in the public/political sphere? Values conflicts trump efficiency.
      *   **Sufficient Answer:** Explicitly links to the federation's mission, values statement, or involves public political endorsement/opposition likely to attract significant attention or controversy. *Judgment Call:* Defining "fundamentally" and "major." "Could" cause controversy isn't enough; focus on inherent nature of the decision.
      *   **Decision Path:**
          *   **No, primarily operational/technical?** → **VERDICT: Decide Nationally.** (Rationale: Spillover/Capacity issue + Need for Standardization).
          *   **Yes, core values/political positioning?** → **VERDICT: Escalate to Trustees.** (Rationale: Requires value/political judgment beyond operational scope).

  ---

  ### Three Test Cases

  1.  **Standardized Chainsaw Safety Training (Nat'l Office vs. Regions):**
      *   **Q1: Spillover?** YES. Major liability risk for entire federation if accident occurs under "federation" activity, even locally. Reputational damage risk is high.
      *   **Q2: Local Capacity?** Unclear/Mixed. Groups *say* they're fine, but no *demonstrated* consistent standard proof against national safety best practices. Capacity varies.
      *   **Q3: Need Standardization?** YES (a: Safety/Legal Compliance). Minimum safety standard is compelling to mitigate existential liability risk and ensure duty of care.
      *   **Q4: Core Values?** NO. Safety is operational, not core political values.
      *   **VERDICT: Decide Nationally.** (Local Autonomy Objection Overruled: Spillover risk & compelling safety need outweigh local preference).

  2.  **Local Group Co-Hosting Campaign Rally w/ Logo (Local Group Request):**
      *   **Q1: Spillover?** YES. Immediate and major reputational/political risk. Aligning with a *specific party* under the national logo implies federation endorsement, impacting all groups.
      *   **Q2: Local Capacity?** Irrelevant due to Q1. But even if, capacity to judge political alignment appropriately is doubtful for volunteers.
      *   **Q3: Need Standardization?** YES (Implicitly, for reputation). But...
      *   **Q4: Core Values?** YES. Fundamental question of political neutrality, advocacy boundaries, and public positioning.
      *   **VERDICT: Escalate to Trustees.** (Requires value judgment on acceptable political engagement).

  3.  **Mandatory National Species Database (Nat'l Office vs. Local Group):**
      *   **Q1: Spillover?** YES. Incomplete data hinders regional/national conservation planning, grant applications, and scientific impact – core federation purposes. Benefits are collective.
      *   **Q2: Local Capacity?** Likely YES (for collection). Local groups demonstrably collect data. Capacity to *share* via a specific platform might be a barrier (resources/training).
      *   **Q3: Need Standardization?** YES (c: Effectiveness of Core Mission). Standardized, accessible data is *compelling* for achieving the federation's scientific/conservation goals at scale.
      *   **Q4: Core Values?** NO. Data sharing is operational for mission effectiveness, not core values like political stance.
      *   **VERDICT: Decide Nationally.** BUT... Implementation must address Q2 capacity concern (training, support, simple platform). National decision on "must share," local flexibility/help on "how easily."

  ---

  ### Where it Misfires

  1.  **Deep Value Conflicts Disguised as Level-of-Decision:** If the *real* fight is about underlying values (e.g., "science vs. local intuition," "activism vs. neutrality") masked as a subsidiarity question, the procedure might force a level decision that feels wrong. Escalate to trustees early if this core conflict is evident.
  2.  **Severe Capacity Gaps:** The procedure identifies lack of capacity but doesn't solve it. If many groups lack capacity for critical tasks, the verdict might be "National Decide," but national may lack resources to *support* that decision effectively. This needs separate strategy.
  3.  **"Gaming the System":** Groups might exaggerate spillover risks or downplay capacity to sway the verdict. The chair must rigorously demand evidence for assertions at each step.
  4.  **The Truly Novel:** For completely unprecedented issues with no clear analogs, the criteria might be hard to apply. Use the steps as a structured discussion guide but expect a messier, more judgment-based outcome. Document rationale thoroughly.
  5.  **Power Struggles:** When the dispute is fundamentally about control or personality clashes, not principles, the procedure is just a battleground. Recognize this and shift to mediation or trustee escalation if the process becomes unproductive. **Stop using it if the conversation loops endlessly without new evidence.**
