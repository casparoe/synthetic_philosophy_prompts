prompt: |-
  Animal welfare law in most Western countries protects mammals and birds without hesitation, ignores insects entirely, and treats the invertebrate middle case-by-case: a researcher who needs ethics-committee approval to experiment on an octopus in one jurisdiction needs none in another, and Switzerland made it illegal in 2018 to put a live lobster into boiling water without stunning it first while saying nothing about insect pest control that kills on a vastly larger scale. The UK's Animal Welfare (Sentience) Act of 2022 made this pattern explicit rather than accidental: it defines the animals whose sentience government policy must consider as all vertebrates, all cephalopod molluscs, and all decapod crustaceans, drawn that way after a commissioned review of the scientific evidence. What picture of how consciousness is distributed across animals does this legislative pattern presuppose? That sentience is thought to track phylogenetic groups cleanly enough to be attributed by taxon, or that it tracks features like nociception and centralized integration of information that would cut across taxa? And is the practice really committed to any view about the distribution at all, or could the same lines be resting on something else — public sympathy, culinary habit, lobbying pressure — that merely correlates with sentience claims, in which case the appeal to sentience in the statutes is decoration? Reconstruct the implicit theory, say where the practice is underdetermined so that several views of the distribution would license the same lines, and say what would have to change in the drafting and enforcement of these laws if the presupposed picture were replaced by one on which sentience in some groups, insects for instance, is genuinely uncertain and protections must be allocated under uncertainty rather than on either side of a bright line. Tell me how confident you are in each part of your reconstruction, and single out the part you are least sure of. Write in continuous prose only, with no headings, bullet points, bold text, or tables.
reasoning: |-
