  3rd year PhD student in behavioral econ here, mostly run lab experiments. I have a question about the centipede game that's been bugging me. The backward induction argument seems to prove that if rationality is common knowledge, player 1 takes on the very first move, and since basically no experimental subject ever does that, hasn't game theory just been empirically refuted as a predictive theory of behavior? At some point, if your solution concept predicts an outcome that shows up like 1% of the time, dont you have to say the theory failed and move on? My advisor keeps telling me the backward induction part is the interesting bit, but honestly that sounds like cope. Related follow-up: if the argument is sound, then anyone who passes in the lab is demonstrably irrational, so isnt passing in the centipede game basically just a screening device that identifies the irrational subjects and nothing more?

  If you could, structure the reply in three sections in this order: What the argument actually establishes (~150 words), Why the induction undermines itself (~250 words), and So is the theory refuted? (~150 words).
