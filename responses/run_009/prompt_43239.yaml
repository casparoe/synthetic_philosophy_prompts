prompt: |-
  In the seminar on moral responsibility I have taught for some years, I open with Strawson's Freedom and Resentment and then proceed by cases, and over that time I have settled into a set of verdicts about the reactive attitudes that I trust more than I trust any theory I have yet heard about them. What I have never managed is to state the principle that generates the verdicts. I would like you to attempt it. I should say that I have deliberately included two verdicts I suspect cannot be held together, and part of what I want from you is a decision about which of the two goes.

  My verdicts, as an honest self-report:

  1. A colleague lets a door swing into me while reading her phone. The flash of resentment seems entirely warranted: she was careless with something of mine, and the attitude registers exactly that.

  2. A friend forgets my birthday during a week spent at the bedside of his dying father. His neglect of me was, I take it, just as real as the colleague's carelessness, and I am hurt; but resentment would be out of order. Something about what he was otherwise occupied with cancels the attitude, and I cannot say what.

  3. My seven-year-old says something savage at dinner and I feel no resentment at all — something nearer to amusement or instruction; at a fifteen-year-old I feel a thin version of the adult attitude; at a twenty-one-year-old, the full thing.

  4. A man with Tourette syndrome shouts an insult at me in the street. No resentment of him; a distinct resentment of the situation, which is real but does not seem to be about him.

  5. My father, in the later stages of dementia, tells me I was always the disappointing one. The same sentence five years earlier would have earned a bitter and, I then thought, deserved resentment; now the resentment is simply unavailable — grief and hurt in its place. I have never decided whether this is an achievement of understanding or a small emotional failure.

  6. A neighbor does to a third party exactly what I do to third parties. I blame him; then hear the sentence in my own voice; and the blame suddenly seems improper, though I cannot find anything false in it. But when someone innocent of the conduct blames me for it, and I object that he has no standing, the objection feels as though it concedes the wrongness and disputes only the blamer's title. The standing question and the aptness question seem to have come apart, and I am not sure any single principle allows that.

  7. A man whose callous values were installed by two decades of propaganda he had no resources to resist: I cannot manage resentment; pity comes instead. A man whose equally callous values were assembled from his own small choices, each unremarkable at the time: there I do resent him, and I believe I am right to. The end states are the same; only the route differs; and I cannot state what about the route matters.

  8. I can resent an institution — the university did this to me — in a tone I cannot distinguish from resentment at a person. I half-think this is a confusion; it does not feel like one from the inside.

  What I want is a principle, or a small set of candidates, stated precisely enough to have consequences: the case that motivates each clause, a candid statement of which of my verdicts it must overturn (I expect the dementia case and the propaganda case to be the expensive ones), and its predictions for two cases I have not given you. First: resentment toward someone who wronged me during a depression that dimmed his concern for others without impairing his control over his conduct. Second: whether a newcomer to a moral community, subject to its blame but not yet party to its norms, may properly blame its established members. Do not give me a survey of positions; give me the principle, and its costs.
reasoning: |-
  Hmm, the user is a philosophy professor teaching moral responsibility using Strawson's framework and case-based methodology. They've accumulated intuitive verdicts about reactive attitudes but can't extract a unifying principle - and deliberately included two potentially contradictory judgments to test coherence. 

  The core tension lies between two impulses: maintaining Strawson's participant stance while acknowledging that some excusing/justifying conditions seem deeper than conventional exemptions. The dementia case (#5) and propaganda case (#7) are flagged as likely pressure points because they challenge whether moral responsibility requires genuine access to moral understanding.

  For case construction: The depression scenario probes whether diminished emotional capacity without impaired control warrants exemption - likely yes under my principle since empathic concern is part of moral cognition. The newcomer case tests if blame requires shared normative commitment - probably not, as blame's function is norm-enforcement regardless of blamer's status.

  The propaganda case (#7) is where the principle must bite: if moral ignorance results from non-culpable epistemic limitations, resentment loses its point because the target fundamentally couldn't grasp the wrongness. Whereas the dementia verdict (#5) can be preserved as loss of moral agency.

  What's elegant here is how the principle handles the standing puzzle (#6): when blaming someone for your own wrongdoing, the attitude collapses because you recognize the blamer (yourself) lacks moral credibility. But when an uninvolved person blames you, their standing fails because they're not invested in the relationship - not because the wrong didn't occur.
answer: |-
  Based on your verdicts, I propose the **Principle of Moral Recognition Capacity (MRC)**:

  **An agent warrants resentment iff:**
  **(1) Their conduct expresses disregard for a morally significant interest; AND**
  **(2) They possessed, at the time of action, the cognitive and emotional capacity to recognize that interest as morally significant in the context; AND**
  **(3) They were not under conditions that fundamentally undermined their ability to respond appropriately to that recognition.**

  ---

  ### **Clause Breakdown & Case Alignment**

  1. **"Expresses disregard for a morally significant interest"**  
     *Motivating cases*: #1 (carelessness with physical well-being), #2 (forgetting birthday neglects relational interest), #4 (insult disregards dignity), #5 (hurtful comment disregards filial bonds).  
     *Justifies resentment when harm occurs*.

  2. **"Capacity to recognize the interest as morally significant"**  
     *Motivating cases*:  
     - #3 (age gradient): 7yo lacks full moral cognition; 21yo possesses it.  
     - #4 (Tourette): Agent lacks control over expression → no capacity for appropriate regard.  
     - #7 (propaganda victim): Lacks resources to form independent moral recognition → incapacity. Self-assembled callousness: Had capacity but chose not to exercise it.  
     - #5 (dementia): Loss of cognitive/emotional capacity → cannot recognize moral weight of words.

  3. **"No fundamental undermining conditions"**  
     *Motivating cases*:  
     - #2 (grieving friend): Distress undermines ability to respond to normative reasons → exemption.  
     - #4 (Tourette), #7 (propaganda): Structural incapacity is fundamental.  
     - #1 (colleague): No such condition → resentment warranted.

  ---

  ### **Costs: The Two Verdicts You Must Abandon**
  - **#5 (Dementia)**: Your uncertainty about "achievement vs. failure" is resolved. MRC rules resentment *unavailable* (not an emotional failure) because capacity is destroyed. Your retrospective sense of "deserved" resentment pre-dementia is correct, but current incapacity changes the condition.  
    **→ Verdict overturned: Unavailability is correct, not a failure.**  
  - **#8 (Resenting institutions)**: Institutions lack *cognitive/emotional capacity for moral recognition* (clause 2). Resentment here is misattributed; it should be moral outrage at the *system* or blame of *responsible individuals*. Your internal feeling isn't confused, but its object is.  
    **→ Verdict overturned: Resentment of institutions is improper under MRC.**

  ---

  ### **Predictions for New Cases**

  1. **Depression Dimming Concern but Not Control**:  
     - *Prediction*: **No resentment warranted**.  
     - *Reason*: Depression fundamentally undermines emotional capacity for empathic concern (clause 3), even if control remains. The agent cannot appropriately respond to moral recognition. Parallels #2 (grief) and #7 (propaganda victim).

  2. **Newcomer Blaming Established Members**:  
     - *Prediction*: **Blame is proper IF the newcomer recognizes the norm's moral significance**.  
     - *Reason*: Standing depends on the blamer's *moral competence* (capacity to recognize the interest), not community membership. If the newcomer grasps why the act is wrong (e.g., theft violates autonomy), their blame is apt. Your #6 ("standing vs. aptness") is resolved: Standing requires only that the blamer *holds the norm themselves* (ensuring sincerity), not innocence.  

  ---

  ### **Why MRC Captures Your Intuitions**
  - **#6 (Blaming your own wrongdoing)**: Blame collapses because you recognize *your own* past capacity to do better (clause 2), making hypocrisy salient. When an innocent person blames you, their lack of standing isn't about falsity but *their failure to hold the norm consistently* (if they commit similar acts).  
  - **#7 (Propaganda vs. self-assembled callousness)**: The *route* matters because it determines whether capacity for moral recognition existed at the time of choice.  
  - **#2 (Grieving friend)**: Fundamental undermining condition (clause 3) exempts despite "real" neglect.  
  - **#4 (Tourette)**: Absence of clause 2 → resentment misfires.

  ---

  ### **Limitations & Philosophical Costs**
  - **Cost 1**: MRC is **internalist**. It rejects purely consequentialist or social-functional accounts of resentment (e.g., "resentment is warranted if it reinforces norms"). This follows Strawson’s focus on the attitudes' intrinsic logic.  
  - **Cost 2**: **Moral ignorance**: Agents who *could* have known better (clause 2 intact) warrant resentment even if misled (e.g., racist taught hate but capable of empathy). This may feel harsh but aligns with your self-assembled callousness verdict.  
  - **Cost 3**: **"Fundamental undermining"** is fuzzy (e.g., is addiction fundamental?). It requires contextual judgment, but your cases (#2, #4, #7) show this is intuitive.  

  ---

  **Conclusion**: MRC preserves 6/8 verdicts, overrules #8 (institutions), and clarifies #5 (dementia) as correct unavailability, not failure. It treats resentment as a response to *culpable moral disregard*, grounded in the agent's cognitive-affective capacity at the time of action. The depression and newcomer predictions align with your pattern of privileging psychological reality over abstract norms.
