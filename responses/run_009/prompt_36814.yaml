prompt: |-
  I am a retired computational physicist who has spent the last few years reading philosophy of mind and ethics in a more serious way, and there is a configuration I keep running into for which I cannot find an established term. In my working life, the question of which computation a physical system is performing was never settled by the physics alone. The same trajectory through state space could be read, at one temporal and spatial resolution and with one choice of tracked variables, as implementing a particular algorithm, and at another resolution as implementing a different one or nothing worth calling a computation at all. Nothing in the underlying equations privileged one reading; the choice of descriptive grain was ours, and it came from what we cared about predicting. I thought of this as a practical nuisance. Having now read arguments that moral status might attach to computations rather than to the matter implementing them, I realize it may be a philosophical problem: if what matters morally is the computation, and which computation a lump of matter performs is fixed only relative to our bookkeeping, then the boundary of moral concern appears to be fixed by our choice of description rather than by the world, and I can see nothing that keeps that choice from being made arbitrarily.

  Let me sharpen this with something I noticed in simulation work and have not seen discussed. Some patterns in a dynamical system survive a wide family of coarsenings and variable choices — they show up as the same pattern however you squint — while others appear only under the single description that was reverse-engineered to produce them. I have a suspicion that the width of that family of admissible descriptions is doing the work of making a pattern real, rather than an artifact of our conventions, and that moral weight should perhaps track that width. But I am guessing at concepts here. The nearest thing I have actually met in my reading is multiple realizability, and that is pointed the wrong way: it concerns one computation on many substrates, whereas my difficulty is one substrate under many competing descriptions, none uniquely favored. I am told there is also literature on whether the description-dependence of computation can be pushed so far that almost anything can be counted as implementing almost anything, which sounds adjacent, but I do not know what that result is called or whether it addresses the attribution problem rather than the triviality one.

  So, my questions, and I warn you that a bare label will not satisfy me. Does the configuration I have described — a property that is well-defined only relative to a choice of descriptive grain, where that choice is unconstrained by the underlying physics, and where moral or other important attributions are meant to depend on the property — have a name in the philosophical literature? If so, what exactly does the named concept cover, and does it include the attributional side or only the metaphysical side? If no single term covers it, tell me the nearest ones and precisely where each fails to fit; and if the right response is that nothing established covers it, then coin a term for it, give the definition, and show me the boundary cases — in particular, say something about whether my robustness-under-many-coarsenings idea is a genuine criterion or just a way of smuggling our interests back in under a mathematical disguise.
reasoning: |-
  Okay, let me unpack this user's query. They're a retired computational physicist diving deep into philosophy of mind and ethics, grappling with a specific problem that bridges both fields. The core issue is how moral status might attach to computations, given that the same physical system can be interpreted as performing different computations depending on descriptive choices. 

  First, I need to map their technical concern to existing philosophical concepts. They mention multiple realizability but correctly note it's inverted to their problem. Their robustness observation resonates with Dennett's real patterns and Woodward's invariance, but neither fully captures the moral attribution angle. 

  The user's background suggests they'll reject superficial answers. Their simulation example about patterns surviving coarsening is crucial - they're essentially asking if robustness can objectively ground moral relevance. But isn't robustness itself interest-relative? That's the tension they want resolved.

  Hmm... the triviality arguments (Putnam/Searle) show how easily computation can be overascribed, but don't address the normative dimension. Meanwhile, metaethical frameworks like constructivism might handle the "choice" aspect but feel disconnected from their physics-based framing. 

  Their suspicion about robustness being key is insightful but risky - it could just relocate the subjectivity problem. I should acknowledge this while showing how invariance theorists try to salvage objectivity. The moral weight tracking "width" of descriptions is novel though; no direct term exists for that synthesis.

  When structuring the response, I'll: 
  1) Name the metaphysical core (indeterminacy of computation) 
  2) Connect robustness concepts 
  3) Isolate the moral attribution gap 
  4) Propose "normative indeterminacy" as a new composite while being transparent about its limitations. 

  The user's physicist lens is an asset here - their coarsening analogy perfectly illustrates why some patterns feel more real. I'll leverage that when explaining why robustness isn't just smuggled subjectivity. Still must emphasize that no solution fully escapes interest-relativity... which circles back to their deepest worry about arbitrary moral boundaries.
answer: |-
  Your concern touches a profound nexus in philosophy of science, philosophy of mind, and metaethics. The configuration you describe—where a physical system's computationally or morally relevant properties are fixed only relative to an observer's descriptive choices, not by physics alone—lacks a single encompassing term, but its components are well-discussed. Below, I dissect the conceptual landscape, identify gaps, and address your robustness intuition.

  ### Core Problem: **Indeterminacy of Implementation**
  - **What it is**: The thesis that physical systems do not intrinsically implement specific computations; implementation is always relative to an interpretation scheme (choice of variables, granularity, state mappings).  
  - **Key Sources**:  
    - Putnam's **"Triviality Argument"** (1988): Any physical system can be interpreted as implementing *any* computation by gerrymandering state descriptions.  
    - Searle's **"Wall Socket" critique**: If a wall socket's voltage states can be mapped to "computing" *WordStar*, computation isn't an intrinsic property.  
  - **Why it matters for ethics**: If moral status depends on computations (e.g., "consciousness is a computational process"), but implementation is indeterminate, moral boundaries become observer-dependent.  
  - **Gap**: These arguments focus on *metaphysical* indeterminacy, not its *normative* implications.

  ### Your Robustness Criterion: **Invariance Under Coarsening**
  - **What it is**: Patterns that persist across many coarse-grainings/variable choices are "real" (non-artifactual); fragile patterns are "subjective".  
  - **Philosophical Echoes**:  
    - **Dennett's "Real Patterns"** (1991): A pattern is real if it is *predictively robust*—detectable by multiple observers using different methods.  
    - **Woodward's "Invariance"**: Causal relationships are objective if invariant under a range of interventions.  
    - **Statistical Mechanics**: Macrostates are "real" when microscopically robust (e.g., temperature vs. atomic motion).  
  - **Your Insight**: Robustness could ground *objective* moral relevance: only computations invariant under many descriptions "count".  
  - **Objection**: Isn't the *range* of admissible descriptions still interest-relative? (E.g., only coarsenings *we care about*.)  

  ### Why Robustness Doesn't Fully Solve the Problem
  1. **Relativity to a Reference Class**: Robustness is defined relative to a set of possible descriptions. Who defines this set?  
     - *Example*: A neural pattern might be robust under biological coarse-grainings but vanish if we track quarks. Is quark-level description "inadmissible"? Physics doesn't say.  
  2. **Normative vs. Descriptive Robustness**: Even if a pattern is robustly *describable*, why should it be robustly *morally relevant*?  
     - *Case*: A bee's "dance" is robustly interpretable as communication—but does that entail moral weight? Only if we already accept communication as morally significant.  

  ### The Unnamed Configuration: **Normative Indeterminacy**
  - **Definition**:  
    > The indeterminacy in attributing morally salient properties (e.g., consciousness, agency) to physical systems, arising from the underdetermination of higher-level descriptions (e.g., computations) by physical facts, where no observer-independent criterion resolves the ambiguity.  
  - **Scope**:  
    - **Metaphysical**: Physical laws do not privilege one interpretation.  
    - **Attributional**: Moral status depends on the chosen interpretation.  
    - **Normative**: The choice of description appears arbitrary or interest-relative.  

  ### Boundary Cases & Your Robustness Idea
  1. **Purely Conventional Pattern** (Low Robustness):  
     - *Example*: A digital computer running a program that only outputs "1" when input matches a 1000-digit prime *you pre-selected*. This computation is only detectable under one exact description.  
     - **Moral Implication**: No weight—it's an artifact of your coding scheme.  
  2. **Robust Biological Pattern** (High Robustness):  
     - *Example*: Pain behavior in mammals, invariant under coarse-grainings (neural spikes, fMRI, ethology).  
     - **Moral Implication**: Weight is warranted—robustness signals intersubjective objectivity.  
  3. **Edge Case: Simulated Consciousness**:  
     - A GPT-like model exhibits human-like responses robustly across linguistic coarse-grainings, but not at transistor-level. Is robustness under *some* descriptions enough?  

  ### Is Robustness "Smuggling in Interests"?  
  - **Yes, but unavoidably**: Robustness reduces arbitrariness by tethering descriptions to *intersubjective utility*.  
    - Science already does this: Thermodynamics is "real" because its patterns are useful to *all* engineers, not just one.  
  - **No, if grounded in cosmology**: If a pattern is detectable by *any possible observer* (e.g., entropy gradients), it escapes human interests. But this is idealized.  

  ### Conclusion & Term Proposal
  No existing term captures the full configuration. **Multiple realizability** is inverted; **indeterminacy of implementation** ignores ethics; **real patterns** lack normative force. I propose:  

  > **Normative Indeterminacy (NI)**:  
  > The underdetermination of morally significant properties by physical facts, due to the dependence of property-attribution on descriptive frameworks not fixed by underlying physics.  

  - **Why it fits**:  
    - Covers the metaphysical gap (indeterminacy) + attributional problem (normative consequences).  
    - Acknowledges that robustness *mitigates* NI but doesn't eliminate observer-relativity.  
  - **Your Role**: As a physicist, you see NI starkly because you know how easily variables can be re-scaled. The solution isn't finding a "privileged description" (physics denies this) but recognizing that **moral objectivity emerges from shared pragmatic constraints**, not cosmic absolutes. Robustness isn't a disguise—it's the only bridge between physics and meaning.  

  ### Recommended Reading  
  - **Metaphysics of Computation**:  
    - Putnam, "Representation and Reality" (1988) — Triviality argument.  
    - Chalmers, "A Computational Foundation for the Study of Cognition" (1994) — Replies to triviality.  
  - **Robustness & Patterns**:  
    - Dennett, "Real Patterns" (1991).  
    - Ladyman & Ross, *Every Thing Must Go* (2007) — "Real patterns" in ontic structural realism.  
  - **Ethics & Description-Relativity**:  
    - McDonnell, "The Puzzle of Moral Supervenience" (2022) — How moral facts "bind" to physical ones.  
    - Bostrom, *Superintelligence* (2014) — Ch. 8 on mind substrate dependence.  

  Your robustness criterion is a genuine advance: it transforms NI from a threat to ethics into a *scalar measure* of moral significance. But as you suspect, it doesn't erase the role of interests—it refines them into a mathematically trackable feature of our engagement with the world.
