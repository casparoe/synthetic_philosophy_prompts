  We saw that making A dominate B is possible if we set the normal yield of A high enough (like $86). But then we had trouble with C being dominated by A.

  So to prevent A from dominating C, we need that there is some p in the credal set where C is at least as good as A.

  Similarly, we need that there is no act that dominates C.

  Let me set C to be very good in normal and not too bad in drought. For example, $60 in drought and $100 in normal. Then EU(C)=60p+100(1-p)=100-40p.

  Then with A: as before, we set A to $100 in drought and $86 in normal: EU(A)=14p+86.

  Now, compare A and C: 
  EU(C) - EU(A) = (100-40p) - (14p+86) = 100-40p-14p-86 = 14 -54p.
  This is positive when 14-54p>0 => p<14/54≈0.2593. But our credal set is [0.3,0.6], which is above 0.2593, so for every p in [0.3,0.6], 14-54p<0, so EU(C)<EU(A). Therefore, A dominates C, so C is inadmissible.

  To avoid that, we need that at the lower end of the credal set (p=0.3), C is better than A.

  Set C to have a high utility in normal. Let me set C: $70 in drought, $95 in normal. Then EU(C)=70p+95(1-p)=95-25p.

  At p=0.3: 95-7.5=87.5
  At p=0.6: 95-15=80

  EU(A) at p=0.3: 14*0.3+86=4.2+86=90.2 -> which is greater than 87.5.

  Still not.

  Set C: in normal, $100, in drought $80. Then EU(C)=80p+100(1-p)=100-20p.
  At p=0.3: 100-6=94
  EU(A) at p=0.3: 90.2 < 94, so good.
  At p=0.6: 100-12=88
  EU(A) at p=0.6: 14*0.6+86=8.4+86=94.4 > 88.

  So at p=0.3, C is better than A; at p=0.6, A is better than C.

  Now, does any act dominate C? 
  - A: at p=0.3, A has 90.2 < C has 94, so A does not beat C at p=0.3.
  - B: we have that A dominates B (by our earlier setting), but does B dominate C? 
    EU(B)=120-100p
    vs EU(C)=100-20p
    EU(B) > EU(C) => 120-100p > 100-20p => 120-100 > -20p+100p => 20 > 80p => p<20/80=0.25.
    In our credal set, p>=0.3>0.25, so EU(B) < EU(C) for all p in [0.3,0.6]. So B does not dominate C.

  Therefore, for C, there is no act that dominates it over the entire credal set. Similarly, for A, we know that B does not dominate it (because A dominates B), and C does not dominate it because at p=0.6, A is better than C.

  So both A and C are admissible.

  Now, B is dominated by A (as we designed), so B is inadmissible.

  Now, lower expectations:
  A: min at p=0.3: 90.2
  B: min at p=0.6: 60
  C: min at p=0.6 (since it's decreasing): 100-20*0.6=100-12=88

  So Γ-maximin: A has 90.2, B has 60, C has 88. So it chooses only A.

  Perfect.

  So the decision matrix is:

            | Drought (p) | Normal (1-p)
    --------|-------------|------------
    Act A   |    $100     |    $86
    Act B   |    $20      |    $120
    Act C   |    $80      |    $100

  Credal set: p ∈ [0.3, 0.6]

  Now, let's verify:

  1. Expected utilities as a function of p:

  EU(A) = 100p + 86(1-p) = 100p + 86 - 86p = 14p + 86
  EU(B) = 20p + 120(1-p) = 20p + 120 - 120p = 120 - 100p
  EU(C) = 80p + 100(1-p) = 80p + 100 - 100p = 100 - 20p

  2. Lower expected utility (min over p in [0.3,0.6]):

  - For A: increasing in p, so min at p=0.3: 14*0.3+86 = 4.2+86 = 90.2
  - For B: decreasing in p, so min at p=0.6: 120 - 100*0.6 = 120-60=60
  - For C: decreasing in p, so min at p=0.6: 100 - 20*0.6 = 100-12=88

  Γ-maximin: chooses the act with the highest lower expectation. 
  A: 90.2, B:60, C:88. So A is the only act with the highest (90.2>88>60). So Γ-maximin selects only A.

  3. Maximality (admissibility):

  - B is inadmissible because there exists A such that for all p in [0.3,0.6], EU(A) > EU(B). 
    Proof: EU(A) - EU(B) = (14p+86) - (120-100p) = 114p -34.
    At p=0.3: 114*0.3-34=34.2-34=0.2>0
    At p=0.6: 114*0.6-34=68.4-34=34.4>0.
    So indeed, for all p in [0.3,0.6], EU(A) > EU(B).

  - Check if A is dominated: 
    By B? No, because we just showed A>B.
    By C? We need to see if for all p, EU(C) >= EU(A) with strict inequality for at least one p? 
    EU(C) - EU(A) = (100-20p) - (14p+86) = 100-20p-14p-86 = 14-34p.
    At p=0.3: 14-34*0.3=14-10.2=3.8>0 -> EU(C)>EU(A)
    At p=0.6: 14-34*0.6=14-20.4=-6.4<0 -> EU(C)<EU(A)
    So there is no p in the interval where they are equal, and the sign changes. Therefore, neither A nor C dominates the other over the entire credal set.

    Specifically, there is no act that dominates A (because B is dominated by A and C does not dominate A).

  - Similarly, for C: 
    By A? As above, no.
    By B? We have EU(C) - EU(B) = (100-20p) - (120-100p) = 100-20p-120+100p = 80p-20.
    At p=0.3: 80*0.3-20=24-20=4>0 -> EU(C)>EU(B)
    At p=0.6: 80*0.6-20=48-20=28>0 -> EU(C)>EU(B) for all p in the interval. But that doesn't mean C dominates B? Domination would require EU(C) > EU(B) for all p, which is true (since 80p-20>0 for p>=0.3). However, we already have that B is dominated by A, so it's inadmissible anyway. But note: for C to dominate B, it would require EU(C)>EU(B) for every p, which is true. But then C would also make B inadmissible. However, we already have A that does it. But this is not a problem.

    But wait, the definition says: an act is inadmissible if there exists some act that beats it for every probability in C. Here, both A and C beat B for every p. So B is inadmissible.

    Now, is there any act that dominates C? We have A does not dominate C (as shown), and B does not dominate C (because at all p, C is better than B, but that's the opposite). So no act dominates C. Therefore, C is admissible.

    Therefore, maximality deems A and C admissible, and B inadmissible.

  4. The third act (B) is excluded by both: by Γ-maximin because it has the lowest lower expectation, and by maximality because it is inadmissible.

  5. The act in the gap: C is admissible by maximality but not chosen by Γ-maximin.

  Now, E-admissibility: an act is E-admissible if it maximizes expected utility for at least one probability in C.

  For each p, which act maximizes EU?
  We have:
  EU(A) = 14p+86
  EU(B) = 120-100p
  EU(C) = 100-20p

  Compare pairwise.

  A vs C: 
  A > C when 14p+86 > 100-20p => 14p+20p > 100-86 => 34p>14 => p>14/34≈0.4118

  So for p>0.4118, A is better than C; for p<0.4118, C is better than A.

  A vs B: as we know, A>B for all p in the interval.

  B vs C: we have EU(C)>EU(B) for all p in the interval.

  So the optimal acts per p:
  - For p in [0.3, 0.4118): C is the best (because C>A and C>B)
  - For p in [0.4118, 0.6]: A is the best (because A>C and A>B)

  Therefore, both A and C are E-admissible: A is best for p>=0.4118, and C is best for p<0.4118.

  So maximality and E-admissibility coincide in this case: both A and C are E-admissible and also admissible by maximality.

  Now, the structural feature that generates the gap: 
  Γ-maximin looks only at the worst-case scenario for each act. For Act A, the worst case is at p=0.3 (low probability of drought) where it yields 90.2. For Act C, the worst case is at p=0.6 (high probability of drought) where it yields 88. But note that at p=0.3, C is the best act (yields 100-20*0.3=94), but Γ-maximin doesn't consider that; it only considers the minimum. The gap arises because Γ-maximin is overly focused on the worst-case prior, ignoring that C is optimal under some priors in the set and performs reasonably well even in the worst case (88 is not that much less than 90.2).

  Removal test: collapse the credal set to a single distribution, say p=0.4 (in the interval). 
  At p=0.4:
  EU(A)=14*0.4+86=5.6+86=91.6
  EU(B)=120-100*0.4=80
  EU(C)=100-20*0.4=92
  So the best is C (92), then A (91.6), then B (80). Both Γ-maximin and maximality (and E-admissibility) would reduce to choosing the act with the highest EU, which is C. But note: if we collapse to a p where A is best, then A would be chosen. In any case, they would all agree on the single prior.

  Now, to the three short paragraphs:

  (a) A defender of Γ-maximin would argue that excluding Act C is a feature because it protects the agent from the possibility of a high probability of drought (p=0.6), under which Act C yields only $88, while Act A yields $94.4. In the worst-case scenario for Act C, it performs significantly worse than Act A does in its own worst-case scenario (90.2 vs 88). Given the ambiguity about the weather models, Γ-maximin ensures the agent is not exposed to excessive downside risk.

  (b) A defender of maximality would reply that Γ-maximin is too pessimistic. In particular, it ignores that under the weather model that predicts a low probability of drought (p=0.3), Act C yields $94 (which is the highest for that prior) and even in the worst-case prior for C, it yields $88, which is not a disaster. By excluding C, Γ-maximin is disregarding the fact that C is optimal under one of the two credible weather models and performs reasonably well across the board. The agent should be allowed to choose C if they are not extremely ambiguity-averse.

  (c) A precise Bayesian would say that the gap is an artifact of the imprecise framework. The agent should use the available evidence to form a single prior. For example, if the two weather models are equally credible, the agent might set p=0.45. Then they would compute expected utilities and choose the act with the highest (which might be A or C, but without the gap). The entire exercise is unnecessary because a rational agent should be able to commit to a single probability distribution.

  We have our example.
