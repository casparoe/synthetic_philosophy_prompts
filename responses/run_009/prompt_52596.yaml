prompt: |-
  I write long-form features on science and ideas for a general-audience magazine, and next month I'm sitting down with a behavioral ecologist who has spent her career defending a strict reading of the handicap principle — the claim, associated with Amotz Zahavi, that honest signaling between animals is normally maintained by the signals being costly to produce. Her new book argues that the field's drift over recent decades toward pluralism about honesty — indexes, receiver punishment, common interest, and other mechanisms supposed to keep signals reliable without production costs — was a mistake, or at least a retreat dressed up as sophistication. She is an experienced media guest, quick with the peacock and the gazelle, and her signature deflection, when pressed on any particular mechanism, is to say that the mechanism is a detail and the principle is what matters. I want to get past that.

  Draft eight to ten interview questions for the feature. They should be phrased accessibly enough for an educated general reader but turn on the actual content of her position. Specifically:

  1. At least one question on the empirical embarrassment at the heart of her paradigm case: the work in recent decades suggesting that peahens may not prefer the most elaborate trains, and that other textbook handicaps look shaky when measured carefully. Include a follow-up keyed to the reply she is most likely to give — probably something about measurement, context-dependent preferences, or trait multifunctionality — and a second follow-up for the case where she bites the bullet and accepts that the classic examples are weaker than advertised.

  2. At least one question on the distinction between a signal being costly to produce and being costly to fake — the idea that what matters is not that the peacock's tail is expensive, but that it is much more expensive for a low-quality bird to grow than for a high-quality one, so that the cost scales with the very quality being advertised. Critics say this concedes everything the "strict" reading was supposed to protect. Ask whether her version of the principle survives the concession that most real handicaps work this way, and follow up by asking what, if she does concede it, still distinguishes the handicap principle from ordinary signaling theory.

  3. At least one question on index signals — signals kept honest by physical constraint rather than by expenditure, like a deep croak being hard for a small animal to produce. Her likely line is that an index is just a limiting case of a handicap, one where the cost of faking is effectively infinite. Follow up on whether stretching "cost" to cover that case leaves the concept with any distinct content, or whether the strict reading is being saved by relabeling.

  4. At least one question on maintenance rather than origin: if a handicap is an equilibrium between signaler and receiver, what keeps the receiving side paying attention when the signal becomes rare or the selection regime relaxes? Feral and domesticated animals that retain extravagant ornaments without obvious mate choice are a natural case to put to her.

  5. At least one question on the waste problem, turned up a notch: the standard reply to "the handicap principle makes nature look absurdly wasteful" is that waste is the price of honesty. But if honesty can often be had more cheaply through constraints or enforcement, then a world in which costly signaling is the norm is a world with more waste than a pluralist one implies. Does her strict reading commit her to the claim that nature is more wasteful than it needs to be, and is that a prediction or an embarrassment?

  6. At least one question on the human traffic in the idea — luxury goods, academic credentials, public philanthropy, the casual use of "virtue signaling" as an insult. Ask whether the principle licenses any of these applications, whether the popularization has helped or damaged the idea, and follow up on where she would draw the line between an analogy she endorses and one she resents.

  7. A closing question on falsification: what observation, in the field or the lab, would force her to give up the strict reading rather than reinterpret it — and how would she tell the difference between a world where costly signaling is the norm and one where it is a special case?

  Please construct the sequence so that the "mechanism versus principle" deflection gets progressively harder to use: early questions should let her establish the view on her own terms, later ones should pin specific mechanisms to specific predictions, so that answering each with the deflection costs her something visible to a lay reader. No citations or reading lists — just the questions, the follow-ups, and one line each on why you expect the reply you anticipate.
reasoning: |-
  Okay, the user is a science journalist preparing to interview a behavioral ecologist who strongly advocates for the strict interpretation of the handicap principle. They need incisive questions that bypass the expert's habitual "principle over mechanism" deflection. 

  Hmm, the challenge here is balancing accessibility for general readers with precise technical targeting. The expert's media-savviness means canned answers are likely, so questions must force concrete engagement. Interesting how the user anticipates specific dodges—peacock studies, cost-vs-fake-cost, index signals—and wants pre-armed follow-ups. 

  Noticing the strategic sequencing request: early questions should feel open-ended to lower defenses, then gradually box in the deflection tactic. The falsification question at the end is particularly sharp—it makes the abstract principle empirically testable. 

  For the peacock question, I'll structure: 1) classic view setup, 2) recent counterevidence, 3) when she inevitably questions methodology, follow up with "what would convince you?" This traps the deflection: if she dismisses all contrary data as flawed, it looks dogmatic. 

  The cost-vs-fake-cost distinction is philosophically juicy. If she concedes scaling costs matter more than absolute costs, her "strict" stance collapses into mainstream signaling theory. The follow-up must expose this. 

  Index signals are her weakest flank. Calling physical constraints "infinite costs" stretches the handicap definition beyond recognition. The follow-up should question if "cost" then loses all meaning—a vulnerability for popular science applications. 

  The domestication angle for maintenance is clever. If peacocks keep tails without mate choice, does that imply past costs aren't maintaining honesty now? Her deflection here might sound evasive. 

  Luxury goods/human behavior questions risk derailment, but are essential for reader engagement. Need to preempt her dismissing analogies by asking where she draws the line—making her define boundaries. 

  Falsification is the kill shot. If she can't name potential counterevidence, it suggests unfalsifiability. But phrasing must stay respectful—"when would you reconsider?" sounds better than "prove you're wrong."
answer: |-
  Here’s a sequenced interview draft designed to escalate pressure on the "principle over mechanism" deflection, balancing accessibility with conceptual precision:

  ---

  ### **Opening: Establishing the Core View**
  1. **"Your book champions Zahavi’s original handicap principle: signals must be costly to be honest. For readers new to this, could you walk us through why cost is non-negotiable? What’s wrong with 'cheap' signals?"**  
     *Why this first?* Lets her frame the stakes (e.g., "cost detects liars," "free signals invite deception"). Sets baseline.

  ---

  ### **Escalation 1: The Empirical Challenge (Peacocks & Classics)**  
  2. **"Textbooks often use peacocks as the classic handicap. Yet recent studies—like Marlene Zuk’s work—suggest peahens don’t consistently prefer larger trains, and some 'handicaps' (e.g., deer antlers) seem less costly when measured. Does this undermine the paradigm?"**  
     *Expected reply:* Dismissal ("flawed methods," "context matters," "traits multi-functional").  
  3. **Follow-up A:** **"If context or measurement issues explain every exception, how do we test the principle rigorously? Shouldn’t a core example hold across contexts?"**  
     *Trap:* Forces engagement with falsifiability. Deflection ("details!") ignores replication crisis in flagship cases.  
  4. **Follow-up B (if she concedes weakness):** **"If classic examples aren’t ironclad, what contemporary evidence best proves costly signaling is the norm—not just one option?"**  
     *Trap:* Shifts burden to positive evidence beyond "icons."

  ---

  ### **Escalation 2: Costly-to-Produce vs. Costly-to-Fake**  
  5. **"Critics argue that what matters isn’t absolute cost, but differential cost—signals costly for low-quality individuals to fake. If most ‘handicaps’ work this way (e.g., tail length cheaper for healthy birds), does your strict view survive?"**  
     *Expected reply:* "Differential cost *is* the principle!"  
  6. **Follow-up:** **"But if differential cost is sufficient—even if absolute costs are low—how is this distinct from ordinary signaling theory? Isn’t the ‘strict’ reading diluted?"**  
     *Trap:* Exposes tension: conceding scaling costs collapses Zahavi’s "waste is essential" into mainstream economics.

  ---

  ### **Escalation 3: Index Signals & Conceptual Stretching**  
  7. **"You’ve called indexes (e.g., frog croaks constrained by body size) a ‘limiting case’ of handicaps. But if a deep croak is honest because physics prevents faking—not energy expenditure—doesn’t stretching ‘cost’ to include this erase the concept’s core meaning?"**  
     *Expected reply:* "Constraints *are* infinite costs!"  
  8. **Follow-up:** **"If ‘cost’ now includes physical impossibility, what *isn’t* a handicap? Does this risk making the principle unfalsifiable?"**  
     *Trap:* Challenges circularity—relabeling alternatives as "handicaps" protects the theory.

  ---

  ### **Escalation 4: Maintenance & Equilibrium**  
  9. **"Handicaps require receiver attention. But in feral peacocks or domesticated birds, extravagant traits persist without active mate choice. If receivers stop ‘paying,’ why don’t costlier signals degrade faster? What sustains the equilibrium?"**  
     *Expected reply:* "Historical selection," "genetic coupling."  
  10. **Follow-up:** **"If signals linger without current costs maintaining honesty, does that suggest initial cost—not ongoing cost—suffices? Or is this a failure of the principle?"**  
      *Trap:* Tests whether "principle" covers decay/legacy cases.

  ---

  ### **Escalation 5: The Waste Paradox**  
  11. **"You’ve said waste is the ‘price of honesty.’ But if indexes or punishment enforce honesty cheaply, a world where costly signaling dominates seems wastefully inefficient. Does your view imply nature is more extravagant than necessary?"**  
      *Expected reply:* "Cheap signals fail! Cost is unavoidable."  
  12. **Follow-up:** **"If we observe systems where honesty *is* maintained cheaply (e.g., threat displays via physical constraints), is that a counterexample—or proof pluralism was needed?"**  
      *Trap:* Contrasts empirical reality with her necessity claim.

  ---

  ### **Human Applications & Popularization**  
  13. **"The handicap principle is invoked everywhere—from luxury goods to ‘virtue signaling’ accusations. Does popular use capture the biology? Where do you push back?"**  
      *Expected reply:* Distinguish "biological cost" from subjective human costs.  
  14. **Follow-up:** **"When pundits say ‘academic credentials are peacock tails,’ does that misapply your work? If so, has the principle’s broad appeal accidentally weakened its scientific rigor?"**  
      *Trap:* Links pop-sci dilution to her complaint about pluralism.

  ---

  ### **Closing: Falsification**  
  15. **"Finally, what observable evidence would make you concede costly signaling is *not* the primary solution for honesty? How would we distinguish a world where it’s the rule from one where it’s just one tool?"**  
      *Why last?* Forces a concrete standard. Deflection here looks evasive after 14 prior pushes.  
      *Trap:* If she cites "no such evidence," it frames strictness as dogma. If she offers a test, it invites scrutiny.

  ---

  ### **Sequencing Logic**  
  - **Early questions (1, 2, 5, 7, 9, 11, 13):** Let her state the view but embed hooks (e.g., "norm," "non-negotiable," "primary").  
  - **Mid-interview (3, 6, 8):** Follow-ups demand mechanism-specific replies ("how test?" "how distinct?").  
  - **Late-stage (4, 10, 12, 14, 15):** Directly contrast her claims with counterevidence/consequences. Deflection now requires dismissing empiricism or logic.  
  - **Falsification (15):** The ultimate pin—if "principle over mechanism" persists here, it risks sounding unscientific.  

  This structure lets her establish her thesis early but escalates accountability, using her own examples (peacocks) and concessions (differential costs) to box in the deflection. Each follow-up targets a predicted dodge, making evasion visible to lay readers.
