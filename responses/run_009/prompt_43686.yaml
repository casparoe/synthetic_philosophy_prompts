prompt: |-
  I've been reading a popular book on the ethics of war, and its chapter on combatants summarizes the traditional just-war position and the revisionist attack on it as follows:

  "The traditional theory, given its classic statement by Walzer, splits the morality of war into two independent questions: whether a war is just (jus ad bellum) and whether it is fought justly (jus in bello). Its central convention is the moral equality of combatants: soldiers on opposite sides are moral equals, so whatever the justice of the cause, a combatant who obeys the rules of war does no wrong by fighting. Soldiers lose their immunity from attack because they forfeit it: having chosen to become instruments of their state's policy, they have done something that licenses being killed. Civilians, who have made no such choice, keep their immunity, which is why the laws of war are symmetric for soldiers and asymmetric for everyone else. Revisionists such as McMahan then demolished this convention by observing that fighting in an unjust war is a wrongful contribution to a wrong no matter how cleanly one fights, and that the traditional view is therefore committed to the absurd claim that a volunteer in a war of aggression is the moral equal of a conscript resisting invasion. Since McMahan's argument is decisive, most philosophers of war now reject moral equality."

  Something struck me as off, though I can't locate it precisely. The author says soldiers forfeit their rights because they chose to do something wrong, yet he also treats the convention as covering conscripts, who don't choose; I can't tell whether both claims can be true, or whether the book is blending two different rationales. And the closing sentence about what most philosophers now believe sounds stronger than anything the chapter actually argued for.

  Could you audit the summary part by part? Tell me which claims a defender of the traditional Walzerian view would accept as a fair statement of the position, which are conflations or overstatements a Walzerian would want to correct (for instance, whether the summary slides between losing a right because one poses a threat and losing it because one has done wrong), and whether the final inference — that the traditional view has been demolished and is now generally rejected — follows from the parts of the summary that are accurate. Where the summary is subtly wrong, I'd like to know what the correct statement would look like, since I may need to explain this to my seminar.
reasoning: |-
  Okay, the user is asking me to audit a summary of the traditional just-war theory and its revisionist critique. They've shared a passage from a book they're reading and have identified some points that seem off to them - particularly regarding how the summary handles conscripts and the claim that most philosophers now reject the traditional view.

  Looking at this summary, I notice several points where it misrepresents Walzer's position. The key issue is how it frames the forfeiture of rights. The summary says soldiers forfeit rights "because they chose to become instruments of their state's policy" - but Walzer actually argued that combatants lose rights because they pose a threat, not because they've done something morally wrong. This distinction is crucial because it explains why conscripts are included - they pose threats regardless of their choice to enlist.

  The summary also conflates different levels of analysis. While Walzer did argue for symmetrical jus in bello rules (same rules apply to both sides), he didn't claim combatants are moral equals in an absolute sense. His point was about the practical application of rules in war, not a claim that unjust combatants are morally blameless.

  Regarding the revisionist critique, the summary oversimplifies McMahan's position and overstates its acceptance. McMahan's argument does challenge the traditional view, but it hasn't "demolished" it - many philosophers still find Walzer's approach pragmatically necessary even if theoretically imperfect. The claim that "most philosophers now reject moral equality" is an overstatement; the field remains deeply divided.

  The user seems concerned about accurately representing these positions for their seminar. They've done a good job spotting the tensions in the summary, especially regarding conscripts. I should provide clear corrections they can use in their academic discussion, while acknowledging why the original summary might have blurred these distinctions.
answer: |-
  You've pinpointed several subtle but significant inaccuracies and conflations in this summary. It blends Walzerian ideas with misinterpretations and overstates the revisionist impact. Here's a breakdown:

  **Part 1: The Traditional View Summary - What's Fair & What's Not**

  1.  **"The traditional theory... splits the morality of war into two independent questions: whether a war is just (jus ad bellum) and whether it is fought justly (jus in bello)."**
      *   **Fair:** Yes. Walzer explicitly argues for the *functional* independence of *jus in bello* from *jus ad bellum*. Combatants are bound by the rules of war regardless of the justice of their cause.

  2.  **"Its central convention is the moral equality of combatants: soldiers on opposite sides are moral equals..."**
      *   **Fair *with qualification*:** Walzer *does* argue for "moral equality" as a *convention* governing the conduct of war (*jus in bello*). This means:
          *   **Symmetry of Rules:** The *same* rules of engagement (distinction, proportionality, necessity) apply equally to combatants on both sides.
          *   **Immunity & Liability:** Combatants are legitimate targets; civilians are not.
          *   **Moral Status *within Jus in Bello*:** While fighting justly in an *unjust* war doesn't make one's overall cause just (they may still be committing aggression), it means they are *not violating the rules of war* by fighting *per se* and thus retain their *jus in bello* standing (e.g., POW rights, not being prosecuted merely for fighting).
      *   **Unfair:** The phrase "moral equals" is easily misinterpreted. Walzer **does not** claim unjust combatants are morally blameless *in the grand scheme* (their *jus ad bellum* responsibility remains). His point is about the *specific moral status* governing their interaction *as combatants* during war. They are "equals" under the *rules* of war.

  3.  **"...so whatever the justice of the cause, a combatant who obeys the rules of war does no wrong by fighting."**
      *   **Fair *within Jus in Bello*:** Yes, this captures Walzer's core *jus in bello* point. Obeying the rules means they fight *justly* (they adhere to *jus in bello*), even if the war itself is unjust. They haven't committed a *war crime* by fighting.
      *   **Unfair *if implying overall blamelessness*:** Walzer absolutely acknowledges that fighting in an unjust war is participating in a collective crime (aggression). The "no wrong" is specific to the act of fighting *under the rules*. They are doing *something* wrong (fighting an unjust war) but doing it *in a way* that doesn't violate the specific constraints of wartime conduct.

  4.  **"Soldiers lose their immunity from attack because they forfeit it: having chosen to become instruments of their state's policy, they have done something that licenses being killed."**
      *   **Crucially Inaccurate / Conflation:** This is the **core error** you sensed.
          *   **Walzer's Actual View:** Combatants lose immunity primarily **because they pose a threat**, not primarily because they made a morally blameworthy choice. While choice is discussed, the fundamental reason is their *status* as dangerous agents. In *Just and Unjust Wars* (Ch. 3), Walzer emphasizes the *liability arising from being a fighter*. He explicitly includes conscripts: "A conscripted soldier is as much a fighter as a volunteer... He can be attacked for the same reason: he is *engaged in the business of war*." (emphasis added). The forfeiture stems from *participation in hostilities*, not the moral quality of the choice to participate. The "instrument" language is used, but the *why* of liability is the threat they embody.
          *   **Summary's Conflation:** The summary here slides from the "threat-based" forfeiture Walzer actually describes to a "wrongdoing-based" forfeiture ("done something that licenses being killed"). This sets up a straw man for the conscript objection and misrepresents Walzer's rationale. The summary implies the forfeiture is a *punishment* for a wrongful choice, which Walzer does not hold.

  5.  **"Civilians, who have made no such choice, keep their immunity..."**
      *   **Fair:** This correctly states the principle of non-combatant immunity and its link to not posing a direct threat.

  6.  **"...which is why the laws of war are symmetric for soldiers and asymmetric for everyone else."**
      *   **Fair:** Yes, this accurately reflects the practical outcome: symmetrical rules for combatants (both sides can target each other, both must follow the same conduct rules), asymmetric protection for civilians (neither side is allowed to target them).

  **Part 2: The Revisionist Attack Summary - Accuracy & Implications**

  1.  **"Revisionists such as McMahan then demolished this convention by observing that fighting in an unjust war is a wrongful contribution to a wrong no matter how cleanly one fights..."**
      *   **Accurate Representation of McMahan:** Yes, this is the core of McMahan's argument. He rejects the functional independence of *jus in bello* from *jus ad bellum*. If the war is unjust (*ad bellum* wrong), then fighting in it, even cleanly, is participating in and enabling that fundamental wrong. The act of fighting itself is morally problematic for unjust combatants. McMahan grounds liability primarily in individual moral responsibility for contributing to unjust harm.

  2.  **"...and that the traditional view is therefore committed to the absurd claim that a volunteer in a war of aggression is the moral equal of a conscript resisting invasion."**
      *   **Accurate as McMahan's Critique:** This is indeed McMahan's powerful objection *based on his own moral framework*. He argues the traditional view *must* grant symmetrical *jus in bello* status to both, which, given the vast difference in the moral justification for their actions, seems deeply counterintuitive and absurd *from the perspective of overall moral responsibility*.
      *   **Walzerian Response:** A Walzerian would argue this misconstrues the *purpose* of "moral equality." It's a convention for regulating conduct *during* war, *not* a claim about overall moral equivalence. The conscript resisting invasion may be a *hero* fighting for a just cause, while the volunteer aggressor is a *wrongdoer* fighting an unjust war. But *as combatants facing each other on the battlefield*, the rules governing their interaction (who can be targeted, how they must fight) are symmetrical *to serve the purposes of limiting war's horrors and protecting civilians*. Walzer argues the alternative (asymmetric rules based on *ad bellum* status) is practically impossible and dangerous.

  **Part 3: The Final Inference - Demolished? Generally Rejected?**

  *   **"Since McMahan's argument is decisive, most philosophers of war now reject moral equality."**
      *   **Overstated & Unsupported:** This claim is **highly contestable** and likely an overstatement.
          *   **"Decisive"?** While McMahan's critique is powerful and highly influential, sparking decades of intense debate, it is far from universally accepted as "decisive." Many philosophers find Walzer's pragmatic and humanitarian arguments for the independence of *jus in bello* and the symmetrical combatant/non-combatant distinction compelling, *despite* the theoretical tension McMahan identifies. The debate is very much alive.
          *   **"Most philosophers now reject"?** This is empirically questionable. While revisionism is a major force, **the traditional view, particularly the core distinction between combatants and civilians and the symmetrical *application* of *jus in bello* rules, remains deeply embedded in international law (Geneva Conventions) and military doctrine.** Many philosophers defend modified or pragmatic versions of the traditional framework. Surveys or headcounts are rare, but claiming "most" reject it outright is likely false. Many accept the *critique* of "moral equality" as implying overall blamelessness but still defend the *symmetry of rules* and *combatant liability based on threat* for practical and humanitarian reasons. The field is more accurately described as deeply divided, not as having reached a consensus against Walzer.

  **Correcting the Summary - A Walzerian Perspective:**

  A defender of Walzer would likely want the summary corrected along these lines:

  "The traditional theory, associated with Michael Walzer, argues for a functional separation between the justice of going to war (*jus ad bellum*) and the justice of conduct within war (*jus in bello*). Its central convention is the symmetrical application of *jus in bello* rules to combatants on all sides. Combatants, whether volunteers or conscripts, lose their immunity from attack primarily **because they are participants in hostilities and pose a lethal threat to others**. Civilians, who do not pose such a direct threat, retain their immunity. Consequently, a combatant who fights in accordance with the rules of war (*jus in bello*) does not commit a war crime *by the mere act of fighting*, even if their war is unjust. Revisionists like Jeff McMahan powerfully challenge this separation. They argue that fighting in an unjust war is inherently a wrongful act contributing to an unjust aim, regardless of adherence to *jus in bello*. McMahan contends that the traditional view absurdly treats, for example, a volunteer aggressor and a conscripted defender as moral equals under the rules of war. While McMahan's critique has been profoundly influential and sparked significant debate, the traditional view's core distinction between combatants and civilians, and the pragmatic arguments for symmetrical *jus in bello* rules, remain widely defended and embedded in international law."

  **Key Corrections for Your Seminar:**

  1.  **Forfeiture Rationale:** Emphasize that Walzer's core rationale for combatant liability is **threat/participation in hostilities**, not primarily moral blameworthiness for the choice to fight. This explicitly includes conscripts. The summary wrongly suggested a "wrongdoing-based" forfeiture.
  2.  **Moral Equality Nuance:** Clarify that "moral equality" is a *convention* about *jus in bello status and rules*, **not** a claim that unjust combatants are morally blameless overall. They retain *ad bellum* responsibility.
  3.  **McMahan's Challenge:** Acknowledge the power of McMahan's critique regarding the seeming absurdity of symmetrical rules given asymmetric *ad bellum* justification.
  4.  **Status of the Debate:** Reject the claim that the traditional view has been "demolished" or is "generally rejected." Frame it as a vigorous and ongoing debate, where the traditional view, particularly its practical framework for limiting war, still has strong defenders and forms the basis of international law. McMahan's critique is influential but not universally decisive.

  Your instinct about the conscript point and the overstatement of revisionist dominance was spot-on. The summary blends the "threat" and "wrongdoing" rationales, misrepresents Walzer on conscripts, and overstates the demise of the traditional view.
