  I'm taking a third-year PPE course on social choice theory, and my tutor's main comment on my draft essay is that I keep sliding between the discursive dilemma and the Condorcet paradox as though they were the same result written in different notation. For the rewrite I need to compare them properly, so I want to think the comparison through before committing to a line.

  Please compare the discursive dilemma in judgment aggregation with the Condorcet paradox of cyclical majorities. In particular: what exactly changes when the objects being aggregated are binary judgments over logically connected propositions rather than preference rankings — what do the rationality constraints become, and what work can logical entailment do that transitivity cannot? Is the doctrinal paradox of the three-judge court just a disguised preference cycle, or does the propositional structure generate a genuinely distinct impossibility? And which of the two results, in your view, poses the deeper threat to the thought that majority voting tracks an opinion the group already has rather than partly constituting one? Please argue for a definite answer to that last question rather than merely surveying the options.

  One more request on how you frame all of this: keep clear about the state of the literature. Separate what is settled among people who work on aggregation — the basic formal distinctions, for instance — from what is genuinely contested, such as whether every discursive dilemma can be embedded in a preference cycle, or whether the two impossibility results are intertranslatable in a way that makes one of them formally redundant. Don't present a contested interpretation as the consensus view.
