prompt: |-
  I teach a first-year module on historical method, and my one shot at actually teaching source criticism is a single two-hour seminar. The students are bright but arrive with a basically broken picture: they think critiquing a source means finding out whether the author was biased, and if he was, the source goes in the trash. I want to get them from that to something like a real sense of how we know anything about the distant past -- Herodotus and Thucydides arguing about how to handle testimony, medieval scribes copying and miscopying manuscripts, the modern stuff with radiocarbon dating where physics elbows in. But don't write the seminar for me, plan it. What has to be established first because everything else leans on it, what comes second and third, and why that order rather than another. Which single case or chain of transmission should carry the whole two hours -- I want one source we keep returning to and stretching, not a tour of examples -- and tell me what that carrier has to have and what it mustn't have. I can already predict some of the misconceptions: the gullible-Herodotus-versus-scientific-Thucydides caricature, "a primary source is the truth," and the one where they decide any copied manuscript is worthless because it's not the original. But there'll be ones I can't see coming, so map out the misconceptions they'll bring or form and say exactly where in the sequence each one should get headed off rather than left to fester till the end. Also: I keep wanting to use the analogy between the textual critics' rule that the harder, more awkward reading is more likely original -- scribes smooth things out, they don't complicate them -- and the way historians treat a detail that's inconvenient for the author's own story as more trustworthy. Work out whether that analogy belongs in a first-year seminar at all, and if it does, where in the order it should land and what it would be doing there. There's also the problem I've never solved: what does criticism even do when a source is the only witness to something, with nothing to cross-check against? Decide whether that belongs in this seminar or is the thing I should openly refuse to cover at this level and say so. Finally, give me one question or tiny task to close with that would show whether they actually absorbed the core idea versus just learning the vocabulary. Throughout, make committed calls and defend them -- I don't want three candidate orderings and a shrug about which is best, I want you to pick. And write the whole thing as continuous prose, no headings or bullet points or bold text, the way you'd write an email to a colleague. (Also, one thing I defintely don't want: readings lists, we already assigned those.)
reasoning: |-
  Okay, the user teaches a first-year historical methods seminar and needs a tightly structured two-hour plan to overhaul students' broken understanding of source criticism. Their students currently think critique means discarding "biased" sources, which is a fundamental misconception. 

  The core challenge is epistemological: how do we know anything about the distant past? Students need to grasp that sources aren't binary (truthful/biased) but artifacts of human processes. Herodotus vs Thucydides is a good entry point because it immediately smashes the "gullible vs scientific" caricature—both were critical, just with different methods. 

  The carrier source must be multilayered: something with transmission issues (medieval copying), interpretative challenges (authorial intent), and ideally a physical component like radiocarbon dating. A chronicle entry works perfectly—say, a 12th-century account of a king's death. It's self-contained but has enough wrinkles: the chronicler had patrons, later copies introduce errors, and maybe archaeology conflicts with the text. 

  First order of business: dismantling "bias = trash." Have students analyze why the chronicler wrote what they did—not to dismiss it, but to understand what pressures shaped the account. This must come first because every other skill (evaluating transmission, reconciling contradictions) depends on seeing sources as constructed. 

  The analogy about "harder readings" belongs in the second half, when discussing textual corruption. It's a bridge from scribal errors to authorial choices: just as scribes simplify, authors omit inconvenient truths. But introduce it through concrete examples—show a sentence smoothed in later copies, then ask why the original author included an awkward detail that undermined their argument. 

  The "only witness" problem is too advanced for this session. State outright: "Today we focus on tools for when sources *can* be tested; solo sources require different methods we'll cover later." Otherwise they'll latch onto exceptions to avoid engaging with criticism. 

  For the closing task: give them a new chronicle excerpt where the author reluctantly admits something damaging to their faction. Ask not "Is this biased?" but "What makes this detail credible *despite* the author's bias?" If they identify the inherent tension in the text rather than labeling it untrustworthy, they've shifted their thinking. 

  Biggest pitfall: students might replace "bias = trash" with "bias = useful for mentalités." Guard against this by stressing that credibility isn't binary—we still weigh facts against other evidence. Use the chronicler's conflicted account to show how internal tensions create footholds for verification.
answer: |-
  Here’s how I’d structure those two hours, building the foundation brick by brick, using a single carrier source, and preempting misconceptions at critical junctures:

  We start by confronting the "bias = trash" fallacy head-on in the first 20 minutes because it’s the core blockage. Don’t lecture about it – *activate* it. Present a short, provocative excerpt from our carrier source (e.g., a paragraph from Asser’s *Life of King Alfred* praising Alfred’s piety and military genius). Ask: "What might make us cautious about taking this at face value?" They’ll pounce on bias (he was Alfred’s courtier!). Acknowledge that, then pivot sharply: "So, should we throw this away? If not, what *can* we do with it despite the bias?" This forces them to question their instinct. Seed the idea that bias isn’t a dead end but a *starting point* for asking better questions: *Why* would Asser emphasize this? *Who* was his audience? *What* does his bias reveal about Alfred’s court or Anglo-Saxon kingship? Establish the core principle: **Sources are artifacts of human intention and context; criticism is the process of understanding *how* and *why* they were created to unlock what they can tell us, not a purity test.**

  Now, introduce our carrier source in full context (10 mins). It *must* be a textual source with a known author, a clear purpose/audience, a complex transmission history (copies, translations), *and* the potential for external verification (archaeology, other text types). Asser works well, or perhaps Gregory of Tours' *Historia Francorum*. Crucially, it *must not* be a simple "reliable/unreliable" binary; it needs layers of complexity. Show its "life": author’s context, initial creation, later copies (maybe a corrupted medieval manuscript image), a modern critical edition. Emphasize: **This single source is a palimpsest of historical processes; we’ll stretch it to see all the ways historians interrogate such traces.**

  Next (25 mins), dive deep into **authorial context and purpose, reinforcing the anti-bias lesson.** Use Asser/Gregory: Why did *this* person write *this* text for *this* audience at *this* time? What were their goals (flatter patron, promote Christianity, legitimize rule, record events for posterity)? How might those goals shape inclusion/exclusion, emphasis, interpretation? Preempt "primary source = truth" here: "Asser was *there*, so is this pure fact?" No. His proximity gives access, but his role *shapes* that access. A primary source offers a *contemporary perspective*, not objective truth. Stress: **Proximity offers unique access but guarantees unique distortions; understanding the creator is key to calibrating the lens.**

  Shift (30 mins) to **transmission and textual criticism.** Show a specific passage where a key detail differs between an early manuscript copy and a later one (e.g., a number, a name, a crucial adjective). Ask: "How did this happen? Does this mean the *entire* source is worthless?" Combat the "copy = worthless" misconception immediately. Explain the mechanics: tired scribes, damaged exemplars, linguistic shifts, even deliberate "correction." This is where your **"harder reading" analogy lands perfectly and powerfully.** Show a scribal error where a complex/unfamiliar word is replaced with a simpler one. Then, pivot: "Historians notice something similar *within* the author's original text. If an author includes a detail that’s awkward, contradicts their main argument, or makes their hero look bad... why would they leave that in? Isn't it more likely they'd smooth it over?" Link scribes smoothing text to authors smoothing narratives. The principle: **Unexpected complexity or inconvenient details (whether from scribal fidelity or authorial admission) often carry greater weight precisely because they weren’t "smoothed" away.** This connects textual criticism to internal source criticism organically.

  Introduce **external verification/corroboration (20 mins)** using the same carrier source. "Asser says Alfred built a specific fort here. How can we check?" Show archaeology (foundations?), coinage, charter evidence, or a brief conflicting mention in the *Anglo-Saxon Chronicle*. Emphasize: **History is a jigsaw. No single piece gives the full picture. We compare sources and source *types* to build plausible accounts.** Crucially, address the "only witness" problem *here*, but **shut it down explicitly for now:** "Sometimes, tragically, a source *is* the only witness. That requires even *more* sophisticated criticism – dissecting its internal logic, understanding its genre deeply, comparing it to broader patterns. It’s vital, but it’s advanced detective work. Today, we’re focusing on the foundational tools we use when we *do* have multiple traces to work with." This prevents them from using the "only witness" scenario as an excuse to dismiss the *entire* critical process.

  Finally (15 mins), **synthesize and apply.** Return to the initial Asser/Gregory excerpt. Task: "Using *one* specific technique we explored today – authorial purpose, transmission quirk, 'harder reading,' or external check – show how criticism transforms how we read this passage. Don’t just name the technique; explain *what specific question* it makes you ask and *what new insight* it might yield." This task reveals if they absorbed the *process* (asking better questions) versus just the vocabulary. If they can pinpoint a specific anomaly (e.g., "Asser admits Alfred lost a battle, which hurts his 'invincible king' theme – that 'harder reading' makes me ask *why* he included it, maybe it was too well-known to omit?"), they’ve grasped the core. Conclude: **Source criticism isn’t about debunking the past; it’s the rigorous, creative process of *listening* more carefully to the traces it left behind, despite the static of time, bias, and error.**

  **Why this order?** It dismantles the biggest misconception (bias) immediately, establishes the source as a multi-layered artifact, builds from creator (author) to preserver (scribe) to verifier (external evidence), and finally demands synthesis. Each step uses the carrier source, deepening complexity. The "harder reading" analogy works because it bridges textual transmission and authorial intent, showing a unifying critical principle. Leaving "only witness" aside is necessary; introducing it here would derail the core methodology into philosophical quicksand. The closing task forces application, revealing whether they see criticism as a dynamic toolkit, not just a set of terms.
