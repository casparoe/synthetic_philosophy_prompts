  just got back from a way too long argument with my friend about lewis-style modal realism (he's an actualist and thinks the whole thing is obviously insane). before the details evaporate I want to write down where I actually stand, and he swears some of my positions contradict each other but of course he won't say which. so here's the list, tell me if it hangs together:

  1. possible worlds are concrete — the other worlds are made of the same stuff as this one, full of flesh and blood people, just spatiotemporally unrelated to us
  2. 'actual' works like 'here' or 'now' — it's indexical, so being actual isn't a feature that distinguishes this world from the rest
  3. nothing at another world is literally me, no cross-world identity. when I say I could have been a doctor, the strict truth of it is that some counterpart of mine over there is a doctor
  4. I think counterpart theory fully vindicates de re modality — when Humphrey regrets not winning the election, the analysis of what it means that he could have won captures exactly what he wanted
  5. I'm a stickler about ontological parsimony, fewer kinds of things the better
  6. and yet I keep feeling there's a substantive further question here — which world is really actual — and that it has an answer beyond where I happen to be standing
  7. the incredulous stare has never bothered me for a second

  which of these are genuinely in tension, which only look like it, and what would have to give in each case? rank them by how bad the tension is, cause I suspect one or two are basically fine and my friend is just pattern-matching to objections he half remembers from a seminar. also don't just tell me everything conflicts, actually seperate the real problems from the fake ones.
reasoning: |-
  Okay, let me start by understanding the user's situation. They just had a long argument with a friend about Lewis's modal realism. The friend is an actualist and thinks Lewis's view is insane. The user wants to check if their listed positions are consistent. They’re worried their friend might be right about contradictions but won’t specify which ones. 

  First, I need to recall Lewis's modal realism. Lewis says possible worlds are concrete, spatiotemporally isolated universes. "Actual" is indexical, like "here." Counterpart theory handles de re modality without cross-world identity. The user also values ontological parsimony but feels there's a deeper question about which world is "really actual." They’re not bothered by the incredulous stare.

  Looking at point 1: concrete possible worlds. That's core Lewis. Point 2: "actual" as indexical—also standard. Point 3: no cross-world identity, counterparts instead. Point 4: counterpart theory fully handles de re modality. Point 5: ontological parsimony. Point 6: feeling there's a substantive question about which world is really actual. Point 7: unbothered by incredulous stare.

  The main tension is between point 6 and Lewis's framework. If "actual" is indexical, there shouldn’t be a further question about which world is really actual. That’s a big red flag. The user might be slipping into absolute actuality, which Lewis rejects. 

  Point 5 (parsimony) seems at odds with concrete worlds. Lewis argues his view is parsimonious in kinds but not in number. The user might need to accept that trade-off. 

  Points 1-4 and 7 are consistent. Counterpart theory (3 and 4) aligns with concrete worlds. The incredulous stare (7) isn’t a logical issue. 

  Prioritizing the tensions: Point 6 is the biggest problem. Then point 5’s tension with the plurality of worlds. The rest are cohesive. 

  The user’s deeper need might be reconciling their intuition about a "real actuality" with Lewis's indexicality. They might need to either drop that intuition or adjust their stance. Alternatively, they could explore why they feel that way—maybe a residual actualist tendency. 

  I should explain each tension clearly, rank them, and suggest possible adjustments. Make sure to validate that most of their points are solid Lewis, so the friend's objections might not hold except for the key inconsistency. Highlight that point 6 is the major issue to resolve.
answer: |-
  Based on Lewis's core framework, your positions have significant internal tensions, especially concerning point 6. Here's a breakdown, ranked by severity of conflict:

  **Ranked Tensions (Most Severe First):**

  1.  **Point 6 vs. Points 1, 2, 3, 4 & 7 (Major Contradiction):**
      *   **The Conflict:** Point 6 ("*there's a substantive further question... which world is really actual... beyond where I happen to be standing*") directly contradicts the core Lewisian doctrine expressed in Points 1, 2, and the implications of 3 & 4.
      *   **Why it's Contradictory:** Lewis's whole point (Point 2) is that "actual" **is** **exhaustively** indexical. It *means* "this world," relative to a speaker located within it. Just as there's no absolute, non-indexical "here" or "now" that picks out a *privileged* location or time, there's no absolute "actual" that picks out a *privileged* world. Asking "*which world is* really *actual?*" is like asking "*which location is* really *here?*" once you've accepted the indexical nature of the term – it misunderstands the meaning of the word. Point 1 (concrete worlds) and Point 3 (counterpart theory) only make sense *because* all worlds are ontologically equal; none has the special status Point 6 implies.
      *   **What Has to Give:** **Point 6 must be abandoned** to remain consistent with Lewisian modal realism. If you retain the feeling behind Point 6, you are slipping back into an absolute notion of actuality that Lewis explicitly rejects. Your friend is likely latching onto this as the core "insanity" or contradiction.

  2.  **Point 5 vs. Points 1 & 7 (Significant Tension - Philosophical Cost):**
      *   **The Conflict:** Being a "stickler about ontological parsimony" (Point 5 - favoring fewer *kinds* of things) is in tension with accepting the vast, indeed infinite, plurality of *concrete* worlds demanded by Point 1. While Lewis argues his view is parsimonious in *kinds* (only concrete particulars and their parts/aggregates, no abstract possible worlds or irreducible modal properties), the sheer *number* of entities (entire universes!) is astronomically inflationary compared to actualism. Point 7 (unbothered by incredulous stare) suggests you accept this cost, but Point 5 indicates you highly value the principle that creates the tension.
      *   **Why it's Tension (Not Strict Contradiction):** This isn't a *logical* contradiction. Lewis *claims* his view *is* parsimonious (in kind-counting). It's a tension in philosophical *values* and the *cost* of the theory. You can consistently hold both, but you must acknowledge that Lewisian realism sacrifices *quantitative* parsimony for *qualitative* parsimony, which goes against the intuitions of many who prioritize minimizing *total entities*.
      *   **What Has to Give:** You must **reconcile your commitment to parsimony (Point 5) with accepting vast quantitative inflation**, perhaps by explicitly prioritizing Lewis's argument that kind-parsimony is more fundamental. Or, soften Point 5 to acknowledge it as one important consideration, but not an absolute veto if other theoretical benefits (like unifying modality, semantics, etc.) are significant enough.

  **Points Largely Consistent with Lewis (Minor or No Tensions):**

  3.  **Points 1, 2, 3, 4 & 7 (The Lewisian Core - Coherent):** These form the heart of Lewis's view and are mutually consistent:
      *   1 (Concrete Worlds) provides the ontology.
      *   2 (Indexical Actuality) defines the special status of *our* world (it has none beyond being *ours*).
      *   3 (No Trans-World Identity) & 4 (Counterpart Theory Vindicates de re Modality) provide the mechanism for understanding modality *within* this ontology and the indexical view of actuality.
      *   7 (Unbothered by Incredulous Stare) reflects acceptance of the counterintuitive ontology (Point 1) and the rejection of absolute actuality (Point 2). Your friend finds it insane (Point 1 & 7), but within the system, these points hold together logically.

  4.  **Point 4 vs. Common Criticisms (Potential External Tension, Not Internal):** While Point 4 (Counterpart Theory fully vindicates de re modality) is central to Lewis, it's the *most debated* aspect externally, *not* internally inconsistent with your other Lewisian points. Critics (like your actualist friend) argue counterpart relations are too vague or conventional to truly capture the "aboutness" of de re modal claims (e.g., Humphrey cares about *himself* winning, not some similar being). However, **within your stated framework (Points 1-3), Point 4 is the intended and consistent analysis.** The tension is with common *objections*, not your internal list.

  **Summary & Recommendations:**

  1.  **The Real Problem: Point 6.** This is the major contradiction. Lewis's entire system (Points 1, 2, 3, 4) is built to *dissolve* the question Point 6 asks. You **cannot** consistently hold both the indexical view of actuality (Point 2) *and* believe there's a substantive question about which world is "really" actual beyond the indexical fact. **This is almost certainly what your friend perceives as the glaring contradiction.**
  2.  **The Cost of Admission: Point 5 vs. Point 1.** Accepting concrete worlds means embracing vast quantitative ontological inflation. If you are a *strict* stickler for minimizing total entities, this is a high cost. You need to decide if Lewis's arguments for kind-parsimony and theoretical utility outweigh this cost for you.
  3.  **The Solid Core: Points 1, 2, 3, 4, 7.** These are the defining features of Lewisian modal realism and are logically coherent together. Your friend finds Point 1 "insane" and might object to Point 4's analysis of de re modality, but these points don't *internally conflict* within your list (except as noted above with Point 6).
  4.  **The Friend Factor:** Your suspicion is likely correct. Your friend, as an actualist, finds the *whole package* (especially Point 1) "obviously insane" (hence Point 7 doesn't bother you but does bother him). He likely latched onto the *manifest* contradiction of Point 6 with the rest, and perhaps gestured vaguely at the cost of Point 1 vs. parsimony intuitions (Point 5), but didn't articulate the specific tensions clearly.

  **To Achieve Consistency:** You must **drop Point 6**. Embrace Lewis's view fully: "actual" *just means* "this world." There is no further substantive question. The feeling behind Point 6 is likely a residual intuition from actualism or absolutism that Lewis's theory is designed to eliminate. If you can't drop Point 6, then you are not fully endorsing Lewisian modal realism, and your actualist friend has a point about inconsistency. Regarding Point 5, you need to either accept Lewis's argument for kind-parsimony despite quantitative inflation or acknowledge it as a significant cost you're willing to bear for the theory's benefits. The rest of your list (1,2,3,4,7) forms a coherent, if controversial, philosophical position.
