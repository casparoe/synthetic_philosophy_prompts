prompt: |-
  I'm a journalist who writes about science and technology, and a pattern keeps surfacing in my reporting that I cannot find a proper name for. When I interview robotics engineers, they tell me that the hard part of building an autonomous machine is not making it reason well; it is making it ignore things. A robot instructed to fetch something from the kitchen could in principle worry about whether crossing the room will change the colour of the walls, the day of the week, or the whereabouts of the cat — almost nothing in what it knows rules any of this out, and if it re-examined every belief after every move it would never act. The engineers' fixes all amount to hand-written lists of what may safely be assumed to stay put, and those lists, they insist, are where their systems actually break: the delivery robot that treated a rearranged office as unmapped, the scheduling software that re-derived a hospital's entire duty roster after one nurse swapped a shift.

  I notice the same shape away from machines. A colleague covering disaster response described the mirror-image failure: officials who treated too much as fixed — the levee that would hold, the road that would remain passable. And I catch it in myself: after posting a letter I re-check my bag, but after locking the front door I do not re-check whether my desk is still brown; nothing in my beliefs marks that difference.

  Two people I've asked offered labels I don't trust. One said this is simply selective attention, as the psychologists use the term, but attention seems to concern which inputs to process now, not what an action should be permitted to change. Another said it was the qualification problem in artificial intelligence, though from what I can gather that concerns the conditions under which an action succeeds at all. I would also like to know whether the version that arises before acting — deciding in advance what to disregard — and the version that arises afterwards — deciding what an action has made stale — are one problem or two. Does any of this have an established name, and is there a single concept covering both the engineering cases and the human ones, or do they merely resemble each other? I'd want the answer to say precisely where the edges of the concept lie rather than simply attach a label.
reasoning: |-
  Okay, the user is a science journalist who's noticed a recurring problem in both robotics and human decision-making. They've interviewed robotics engineers who say the real challenge isn't making robots reason well, but making them ignore irrelevant things. For example, a robot fetching something from the kitchen shouldn't worry about whether crossing the room changes wall colors or the cat's location. Engineers use hand-written lists to specify what can be safely ignored, but these lists often break when unexpected changes occur, like rearranged offices or shift swaps. 

  The journalist also sees this pattern in disaster response, where officials assume too much is fixed (like levees holding), and in personal habits, like rechecking a bag for a letter but not rechecking a desk's color after locking the door. They've been given terms like "selective attention" and "qualification problem," but these don't quite fit. Selective attention is about input processing, while the qualification problem is about action success conditions. 

  The user wants a precise term that covers both deciding what to disregard before acting (pre-action) and what becomes stale after acting (post-action). They need clarity on whether these are one problem or two, and whether the concept applies uniformly to machines and humans. 

  First, recall relevant concepts in AI and cognitive science. The frame problem in AI comes to mind—it's about efficiently updating beliefs after actions without rechecking everything. But the user mentions both pre-action (what to ignore) and post-action (what changed) aspects. The frame problem traditionally focuses on the post-action update, but its roots involve specifying invariants. 

  Then there's the relevance problem in epistemology, which is broader. It deals with what information is pertinent to a task. This might cover both pre and post aspects. Also, cognitive science has heuristics like "attention" and "bounded rationality," but these seem too vague. 

  The user's examples show that the core issue is determining relevance: what should an agent consider invariant versus variable? The engineers' lists are essentially relevance filters. In disaster response, officials failed because their relevance filters were too rigid. The journalist's personal habit reflects an implicit relevance assignment—bag contents are variable, desk color is invariant. 

  So the key is "relevance assignment" or "invariance detection." But is there a unified term? "Frame problem" is specific to AI and often criticized as ill-defined. "Epistemic relevance" might work, emphasizing knowledge management. 

  Also, the pre and post-action aspects are two sides of the same coin. Pre-action: what to treat as invariant. Post-action: what might have changed given those invariants. They're linked through the agent's model of the world's dynamics. 

  For a single concept covering both machines and humans, "epistemic economy" could work, but it's not common. "Relevance problem" is clearer. The edges of the concept: it's about how agents (human or artificial) determine which elements of their belief set are relevant to an action—either for planning or updating—and how they manage computational resources by ignoring irrelevant factors. 

  The response should clarify that pre and post-action are interconnected through the agent's predictive model. If the model accurately predicts what remains invariant, both aspects are handled. When the model is wrong (e.g., office rearrangement), the system breaks. 

  Conclude that "the relevance problem" is the best term, with "invariance management" as a synonym. The frame problem is a subset focusing on belief updates. The key insight is that relevance determination is fundamental to efficient agency, and failures occur when the assigned invariants don't match reality.
answer: |-
  What you're describing is a profound and recurring challenge across both artificial and natural intelligence systems. The core issue is **epistemic relevance determination**: the problem of dynamically identifying which aspects of an agent's knowledge are materially pertinent to a specific action or decision, and crucially, **which can be safely ignored** to enable efficient operation without catastrophic error.

  ### The Unified Concept: **Relevance Problem**
  The most precise umbrella term is the **Relevance Problem**. This encompasses:
  1.  **Pre-action ("What to disregard"):** Selecting which invariants to *assume* before acting (e.g., the robot assuming wall color is irrelevant to fetching).
  2.  **Post-action ("What is stale"):** Identifying which specific beliefs *potentially require updating* after an action (e.g., not re-checking your desk color after locking the door).

  These are **two facets of the same core problem**. Pre-action relevance determines the minimal model needed to *plan* the action. Post-action relevance determines the minimal set of beliefs needing verification/update to maintain *coherence* after the action. Both rely on a (often implicit or hand-coded) **model of causal dependencies**.

  ### Why Existing Terms Fall Short
  *   **Selective Attention:** Focuses on *sensory input filtering* (what to perceive *now*). Your examples concern *internal knowledge management* – what inferences to make or avoid, and what existing knowledge to trust/update based on actions taken. It's about *epistemic economy*, not sensory gating.
  *   **Qualification Problem:** Specifically addresses the *impossibility of fully specifying* all preconditions necessary for an action to *succeed* (e.g., "Can I pick up the cup if a giant eagle suddenly grabs it?"). Your focus is on *efficiently managing the consequences of actions* on an agent's *belief state*, assuming the action itself *was* executed.

  ### Key Concepts Defining the "Edges"
  1.  **Causal Invariance:** The heart of the problem is identifying what *doesn't* change due to an action. Engineers code lists of assumed invariants ("frame axioms"). Humans use learned heuristics ("desk color doesn't change when I lock the door"). **Failure occurs when an assumed invariant is violated** (rearranged office, failed levee).
  2.  **Bounded Rationality:** Agents (human or artificial) *must* operate with limited computational resources. Exhaustive reasoning about all possible consequences/changes is computationally intractable. Relevance determination is the essential *heuristic* enabling action.
  3.  **Default Reasoning & Non-Monotonicity:** Agents rely on *default assumptions* (walls stay put, desks stay brown) that hold *unless there's specific evidence to the contrary*. This reasoning is *non-monotonic* – new evidence (a flood, a rearranged room) can invalidate previous conclusions without logical contradiction. The problem is knowing *which* defaults are safe for a *given context* and when to *trigger re-evaluation*.
  4.  **Frame Problem (as a Subset):** In AI philosophy, the Frame Problem *is* the specific challenge of efficiently updating a belief state after an action *without* having to explicitly re-assert everything that *didn't* change. This aligns perfectly with your "post-action" description and the engineers' lists. However, the "pre-action" aspect (what to ignore during planning/reasoning) is its necessary precursor. The **Relevance Problem** usefully encompasses both, especially for human cognition where the distinction blurs.
  5.  **Robustness vs. Efficiency Trade-off:** Assuming everything is fixed (disaster officials) maximizes efficiency but risks catastrophic failure when assumptions break. Assuming nothing is fixed (the paralyzed robot) maximizes robustness but prevents action. Relevance determination is finding the *contextually appropriate point* on this spectrum.

  ### Applying the Concept
  *   **Robotics:** The engineers' lists are explicit, brittle attempts at **relevance assignment**. System breaks occur when the **hand-coded relevance model** (what's assumed invariant) mismatches reality. Better solutions involve learning relevance from data or probabilistic causal models.
  *   **Disaster Response:** Officials failed due to **over-assigned invariance** (levees, roads deemed categorically "fixed"). Effective response requires dynamic **situational relevance assessment**, recognizing which "fixed" elements become critical variables under stress.
  *   **Human Cognition:** Your bag/desk example shows **learned relevance heuristics**. Bag contents are highly variable/relevant to the task (mailing a letter); desk color is a stable invariant. We constantly perform **implicit relevance filtering** to function. Pathologies like OCD can involve malfunctioning relevance assignment (assigning high relevance to invariant properties).

  ### Conclusion
  The established concept covering both the engineering failures and human parallels is most precisely called the **Relevance Problem**. Its core is **determining which aspects of an agent's knowledge base are causally relevant to a specific action or goal, and can therefore be safely ignored (assumed invariant) during planning and belief updating to enable efficient agency.**

  *   **Edges of the Concept:** It begins where exhaustive reasoning becomes impossible and bounded rationality necessitates heuristics. It ends at the point where an agent's model of causal dependencies (explicitly coded or implicitly learned) either correctly or incorrectly identifies what must be attended to/updated vs. what can be ignored. Failure occurs when this relevance assignment is incorrect (assuming an invariant that changes, or wasting resources on an irrelevant variable). It applies universally to any agent (biological or artificial) operating with limited resources in a complex, changing environment.
