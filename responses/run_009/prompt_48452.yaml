  ---

  **MEMORANDUM**

  To: Steering Committee Members  
  From: [Your Name]  
  Date: [Current Date]  
  Subject: Recommendation for Seating the Citizens' Climate Assembly  

  ### Background
  The enabling ordinance for our pilot citizens' climate assembly called for 100 members drawn by pure civic lottery from the electoral roll. However, after the draw, approximately one-third of those selected declined participation, with decliners disproportionately being individuals in full-time employment. As a result, the seated panel is dominated by retirees and students and is significantly more educated than the city on average. This raises concerns about the panel's representativeness and, consequently, the legitimacy of its outcomes.

  ### Options Considered
  We have three options:  
  (a) Seat the current panel as is, treating acceptance as part of the lottery process.  
  (b) Re-run the selection process with stratified quotas and aggressive replacement rules to achieve a panel that mirrors the city's demographics.  
  (c) Seat the current panel (option a) but recommend compulsory service (on the jury model) for the next cycle.

  ### Recommendation
  I recommend **option (b)**: re-running the selection process with stratified quotas and aggressive replacement rules to ensure the seated panel reflects the city's demographic composition.

  ### Reasoning
  1. **Representativeness is Central to Legitimacy**: The core purpose of selecting by lot is to create a microcosm of the city. A panel that does not reflect the city's demographics (particularly the underrepresentation of full-time employed individuals) cannot credibly claim to speak for the community.  
  2. **Pilot as Precedent**: As a pilot, this assembly sets the tone for future initiatives. Allowing an unrepresentative panel to proceed would undermine public trust and the perceived fairness of the process.  
  3. **Correcting for Self-Selection Bias**: The pure lottery method failed to account for differential acceptance rates. Stratification and quotas are necessary to counterbalance the bias introduced by voluntary participation.  
  4. **Urgency and Feasibility**: With the assembly's work yet to begin, re-running the selection with adjustments is logistically feasible and more effective than accepting a flawed panel for this cycle.

  ### Strongest Counterargument
  The strongest counterargument, as presented by my trial lawyer friend, is that the lottery's legitimacy rests solely on the randomness of the procedure. Just as a lottery winner's decision to decline a prize does not invalidate the draw, the current panel—though a subset of the willing—remains a random and fair outcome of the original process.

  ### Response to Counterargument
  While the procedure was random, the resulting panel is not descriptively representative, which is the foundational objective of a citizens' assembly; without representativeness, the assembly's claim to democratic legitimacy is compromised.

  ### Principle at Stake
  This case turns on whether the legitimacy of a citizens' assembly is derived exclusively from procedural randomness or also requires descriptive representativeness of the seated panel.

  ### Implementation Steps
  1. Redesign the selection process to include stratification by key demographics (age, employment, education, etc.) and set quotas aligned with city demographics.  
  2. Draw a new initial sample and implement aggressive replacement (drawing from the same stratum until quotas are met).  
  3. Allocate resources for targeted outreach to encourage participation among underrepresented groups.  
  4. Set a revised timeline to seat the panel within [X] weeks.  
  5. Communicate the changes and rationale transparently to the public and stakeholders.

  ### Projected Dissent
  A dissenting committee member might argue: "This approach abandons the pure lottery that our ordinance promised, trading procedural integrity for demographic quotas and risking the perception of manipulation."

