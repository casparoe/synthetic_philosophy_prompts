  **MEMORANDUM**  
  To: Steering Committee, Citizens' Climate Assembly  
  From: [Your Name], Steering Committee Member  
  Date: [Current Date]  
  Subject: Recommendation for Seating the Pilot Assembly  

  ### Recommendation  
  I recommend **option (b)**: Re-run the selection with stratified quotas and aggressive replacement rules to ensure the seated panel mirrors the city’s demographics, thereby preserving the assembly’s legitimacy through descriptive representativeness.  

  ### Reasoning  
  1. **Descriptive Representativeness Is Foundational**: The legitimacy of a lottery-based citizens’ assembly hinges on its ability to reflect the city’s demographic diversity. A panel dominated by retirees, students, and the highly educated fails to capture the perspectives of working-class residents, who constitute a significant portion of our population and are disproportionately affected by climate policies.  
  2. **Self-Selection Bias Undermines the Lottery’s Purpose**: Pure civic lotteries assume that a random draw will yield a representative sample. However, when decliners skew toward key demographics (e.g., full-time workers), the result is a non-random residue, not a microcosm. Accepting this outcome (option a) sacrifices legitimacy for expediency.  
  3. **Corrective Action Is Prudent for a Pilot**: As a pilot, this assembly must establish credibility for future cycles. Option (c) (compulsory service) is legally and ethically complex and cannot address the current imbalance. Option (b) directly rectifies the flaw while upholding the spirit of the lottery by retaining randomness within stratified quotas.  
  4. **Procedural Fairness Requires Adaptation**: The original ordinance’s "pure lottery" approach has proven inadequate. Stratified quotas (e.g., by age, employment, education) with aggressive replacements ensure fairness by mitigating systemic biases, much like jury selection adjusts for hardships.  

  ### Strongest Counterargument (Losing Side)  
  My trial lawyer friend contends that **the lottery’s legitimacy resides solely in its procedural randomness**: A panel of willing volunteers remains a random subset of the population, akin to lottery winners who decline prizes. The outcome is still statistically fair, and altering the process midstream risks perceptions of manipulation.  

  ### Response to Counterargument  
  While procedural randomness is necessary, it is insufficient; the assembly’s legitimacy collapses if the seated panel cannot plausibly claim to represent the city’s diversity, as descriptive representativity is the core democratic justification for sortition over election.  

  ### Principle at Stake  
  This case turns on **whether legitimacy derives exclusively from procedural randomness or also requires the seated panel to descriptively reflect the community it serves**.  

  ### Implementation Steps  
  1. **Revise Selection Protocol**: Define quotas for age, employment status, education, and other key demographics based on city census data.  
  2. **Aggressive Replacement Rules**: If a selected member declines, immediately draw another from the same demographic stratum until quotas are met.  
  3. **Boost Outreach**: Partner with employers, unions, and community groups to minimize declinations among target groups.  
  4. **Transparent Communication**: Publicly justify the changes as a corrective measure to uphold the assembly’s founding intent.  
  5. **Timeline**: Complete reselection within 3 weeks to minimize delays.  

  ### Projected Dissent  
  A committee member voting against this recommendation might argue: *"Overruling the pure lottery ex post facto violates our ordinance’s original intent, substitutes bureaucratic quotas for civic trust, and sets a precedent for manipulating outcomes under the guise of representativeness."*  

