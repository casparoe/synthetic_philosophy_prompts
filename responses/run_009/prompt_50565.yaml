  We are building a decision tree for escaping the Gibbard-Satterthwaite (GS) theorem. The GS theorem states that for at least three alternatives and at least two voters, no voting rule can be strategy-proof, onto, and non-dictatorial if it is defined for all possible ordinal preferences (unrestricted domain) and yields a single winner (deterministic).

  The entry point is: a designer wants a rule for at least three alternatives and at least three voters (though the theorem holds for two voters, we have at least three) that is strategy-proof (truthful revelation is weakly dominant), and we start from the full GS setting: unrestricted domain, ordinal preferences, deterministic rule, onto, non-dictatorial.

  We are to build a tree with branch nodes that ask questions about which assumption the designer is willing to drop. The leaves represent the possible escape routes.

  We are to include the following leaves at minimum:
  1. Peaks-only rules on single-peaked domains (e.g., median voter)
  2. VCG and its kind (cardinal preferences and transfers)
  3. Random dictatorship
  4. Accepting a dictator
  5. Restricting the outcome set (so that the rule is not onto)
  6. Tolerating manipulation in large electorates (even though the rule is manipulable in principle, it may be rare in practice)
  7. The agenda-setter's paradise: a rule that is strategy-proof on the ballot space, but the ballot space is controlled by an agenda setter.

  Additionally, we must include unoccupied cells (combinations that lead nowhere) and diagnose why they are unoccupied.

  We have at most 12 internal nodes (branch nodes). Each leaf gets a name (or "unnamed") and one sentence on its most awkward commitment.

  We must flag when two positions cannot be separated by an answerable question.

  Let's outline the logical space:

  The main assumptions of GS are:
  - Unrestricted domain (domain richness): any strict preference ordering is allowed.
  - Ordinal preferences: only rankings, no intensities.
  - Determinism (single-valued outcome): the rule picks one alternative.
  - Onto (surjectivity): every alternative can be chosen for some preference profile.
  - Non-dictatorship: no voter is a dictator.
  - Strategy-proofness: truth-telling is weakly dominant for every voter.

  We are going to relax one or more of these.

  Typical escape routes:

  A. Restrict the domain (e.g., single-peaked, single-crossing, etc.)
  B. Allow cardinal preferences and use transfers (e.g., VCG) -> but note VCG is for choosing a public good and requires transfers, which may not be available in voting. Alternatively, we can think of mechanisms that use cardinal preferences without transfers? But without transfers, cardinal preferences alone don't necessarily help (e.g., the Gibbard theorem for cardinal preferences extends the impossibility). However, VCG is a prominent example that uses cardinal preferences and transfers to achieve strategy-proofness.
  C. Allow randomized rules (so the outcome is a lottery). Then we have random dictatorship as a strategy-proof rule. But note: the random dictatorship is strategy-proof and non-dictatorial (in the sense that no one voter always gets their top choice) and can be onto (every alternative has positive probability in some profile). However, it is not deterministic.
  D. Accept a dictator: then the rule is strategy-proof and onto, but dictatorial.
  E. Drop onto: by restricting the range. Then we can have a strategy-proof, non-dictatorial rule that is not onto. For example, fix two alternatives and use majority between them, ignoring the rest. But then the ignored alternatives cannot be chosen.
  F. Drop strategy-proofness: accept that the rule is manipulable, but argue that in large elections manipulation is rare (e.g., the literature on the size of the manipulating coalition or the information required).
  G. The agenda-setter's paradise: we design a rule that is strategy-proof given a restricted ballot space. For example, we let voters only express a subset of their preferences (like in approval voting, but approval voting is not strategy-proof). Alternatively, we can have a rule that asks for a single peak (like in the median voter) but then the agenda setter chooses the ordering of the alternatives on the line. Then the agenda setter has power. But note: in the median voter with single-peaked preferences, if the rule is defined on the domain of single-peaked preferences and the ballot is the peak, then it is strategy-proof. The agenda setter's power is in defining the linear order (the spectrum). However, the rule itself is strategy-proof for the given linear order. But if the agenda setter chooses the linear order arbitrarily, then they can manipulate the outcome by choosing the order. So the rule is strategy-proof for the voters but the agenda setter is unconstrained.

  We must design the tree so that each branch is a question that can be answered without knowing the labels.

  Possible branch questions:

  1. Are we willing to allow the rule to elicit more than just ordinal rankings? (i.e., cardinal preferences or allow transfers)
     - If yes, then we might go to VCG or cardinal mechanisms.
     - If no, we stick to ordinal.

  2. Are we willing to allow randomized outcomes?
     - If yes, then we might go to random dictatorship or other randomized rules.
     - If no, we stick to deterministic.

  3. Are we willing to restrict the domain of allowed preferences?
     - If yes, then we might go to single-peaked, etc.
     - If no, we have unrestricted domain.

  4. Are we willing to drop the requirement that every alternative must be choosable (onto)?
     - If yes, then we can have a rule that is strategy-proof and non-dictatorial but not onto.
     - If no, we keep onto.

  5. Are we willing to tolerate some manipulability? (i.e., drop strict strategy-proofness for a weaker notion, such as non-manipulability in large elections with high probability)
     - If yes, then we might use a rule that is manipulable but rarely in practice.
     - If no, we require strict strategy-proofness.

  6. Are we willing to have a dictator?
     - If yes, then we can have a dictatorial rule.
     - If no, we require non-dictatorship.

