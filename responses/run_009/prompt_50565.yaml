  ### Decision Tree: Escaping the Gibbard–Satterthwaite Theorem  
  **Entry Point**: You seek a deterministic voting rule for ≥3 voters and ≥3 alternatives, where:  
  - Every alternative is admissible (*onto*).  
  - Preferences are private ordinal rankings (*ordinal framework*).  
  - Truthful voting is weakly dominant (*strategy-proofness*).  
  - No voter is a dictator (*non-dictatorship*).  
  - Preferences can be *any* strict ranking (*unrestricted domain*).  

  Gibbard–Satterthwaite proves this impossible. Which assumption(s) will you surrender? Answer the questions below without knowing the outcomes.  

  ---

  #### **Q1: Can the rule use monetary transfers (side payments)?**  
  *(Probes: Cardinal preferences framework)*  
  - **Yes** → Go to Q2.  
  - **No** → Go to Q3.  

  #### **Q2 (Transfers allowed): Are randomized outcomes acceptable?**  
  *(Probes: Determinism)*  
  - **Yes** → **Unoccupied**  
    - *Diagnosis: Unexplored. Randomized mechanisms with transfers (e.g., lotteries over VCG-like payments) are theoretically possible but lack practical or normative defenses.*  
  - **No** → **Leaf: Vickrey-Clarke-Groves (VCG) mechanisms**  
    - *Awkward commitment: Requires transfers (money), which may be infeasible, unfair, or irrelevant in non-monetary settings.*  

  #### **Q3 (No transfers): Are randomized outcomes acceptable?**  
  *(Probes: Determinism)*  
  - **Yes** → **Leaf: Random dictatorship**  
    - *Awkward commitment: Outcomes are lotteries, which may violate "one winner" expectations and dilute accountability.*  
  - **No** → Go to Q4.  

  #### **Q4 (Deterministic, no transfers): Can preferences be restricted to a structured domain (e.g., single-peaked)?**  
  *(Probes: Domain richness)*  
  - **Yes** → Go to Q5.  
  - **No** → Go to Q7.  

  #### **Q5 (Domain restricted): How is the domain structure (e.g., spectrum axis) determined?**  
  *(Probes: Agenda-setter influence)*  
  - **Fixed by designer** → Go to Q6.  
  - **Chosen by an agenda setter** → **Leaf: Agenda-setter’s paradise**  
    - *Awkward commitment: Real power lies with the agenda setter, who can bias outcomes by tailoring the structure (e.g., spectrum ordering).*  
  - **Determined by voters** → **Unoccupied**  
    - *Diagnosis: Unattractive. Voters would strategize over structure-definition, reintroducing manipulability and instability.*  

  #### **Q6 (Fixed structure): Must the rule use only voters' peaks (top alternatives)?**  
  *(Probes: Information frugality)*  
  - **Yes** → **Leaf: Peaks-only rules (e.g., median voter)**  
    - *Awkward commitment: Requires preferences to be single-peaked, which may not hold if voters have "messy" priorities.*  
  - **No** → **Unoccupied**  
    - *Diagnosis: Unattractive. No known strategy-proof rule uses full rankings (beyond peaks) without sacrificing non-dictatorship.*  

  #### **Q7 (Unrestricted domain): Drop the requirement that every alternative can win?**  
  *(Probes: Onto condition)*  
  - **Yes** → **Leaf: Range restriction**  
    - *Awkward commitment: Some alternatives are never chosen, potentially excluding valid options.*  
  - **No** → Go to Q8.  

  #### **Q8 (Onto, unrestricted domain): Drop non-dictatorship?**  
  *(Probes: Non-dictatorship)*  
  - **Yes** → **Leaf: Dictatorship**  
    - *Awkward commitment: One voter has absolute power, violating equality.*  
  - **No** → **Leaf: Tolerate manipulation**  
    - *Awkward commitment: The rule is manipulable in theory; you hope coordination/information costs deter manipulation in practice.*  

  ---

  ### Leaf Summary & Unoccupied Diagnoses  
  | **Leaf Name**                  | **Awkward Commitment**                                                                 |
  |--------------------------------|----------------------------------------------------------------------------------------|
  | VCG mechanisms                 | Requires transfers (money), often infeasible in social choice.                         |
  | Random dictatorship            | Outcomes are lotteries, undermining decisiveness.                                      |
  | Peaks-only rules               | Assumes structured preferences (e.g., single-peakedness), which may fail empirically.  |
  | Agenda-setter’s paradise       | Agenda setter can manipulate outcomes by defining the domain structure.                |
  | Range restriction              | Permanently excludes some alternatives, even if voters favor them.                     |
  | Dictatorship                   | Concentrates all power in one voter, violating fairness.                               |
  | Tolerate manipulation          | Admits the rule is manipulable, relying on practical barriers to deter gaming.         |

  **Unoccupied Cells**:  
  1. **Randomized outcomes with transfers** (Q2→Yes):  
     - *Diagnosis: Unexplored. Combines complexity of transfers with lottery outcomes, lacking theoretical or empirical advocacy.*  
  2. **Domain structure determined by voters** (Q5→Voters):  
     - *Diagnosis: Unattractive. Voters would game structure-definition, making strategy-proofness unattainable.*  
  3. **Fixed domain structure using more than peaks** (Q6→No):  
     - *Diagnosis: Unattractive. No known strategy-proof rule uses full rankings without dictatorship in restricted domains.*  

  ---

  ### Postscript: The Agenda-Setter’s Paradise  
  This leaf holds as a distinct escape route. It leverages *formal* strategy-proofness on a restricted ballot space (e.g., reporting peaks on a spectrum), but the agenda setter chooses the spectrum, granting them *de facto* control. It does not dissolve into other branches:  
  - Unlike **peaks-only rules**, the agenda setter’s power to *define* the structure introduces a meta-manipulation not present when the structure is fixed.  
  - Unlike **range restriction**, it satisfies the onto condition (every alternative can win if placed favorably on the spectrum).  
  - Unlike **dictatorship**, power lies outside the voter set.  
  However, it risks camouflaging dictatorship-by-proxy, as the agenda setter’s choices can predetermine outcomes.  

  ---

  ### Design Notes  
  - **Unseparated Positions**: Peaks-only rules and the agenda-setter’s paradise both rely on domain restrictions but diverge on who controls the structure. No further pre-label question splits them cleanly.  
  - **Scope**: The tree covers all major escapes from Gibbard–Satterthwaite. "Large electorates" is under *tolerate manipulation*; VCG extends beyond voting to mechanism design.  
  - **Pedagogy**: Focuses on assumptions (e.g., Q1 probes cardinality via transfers), not named theorems. Use this *after* teaching the proof.  
  - **Tree Size**: 8 internal nodes (Q1–Q8), 7 leaves, 3 unoccupied cells.  

  *Handout tip: Have students trace paths individually, then debate leaf commitments in groups.*
