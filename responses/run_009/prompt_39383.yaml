  Key fault lines to cover:
  1. Whether classic responsibility conditions (foreseeability and control) leave a residue for learning systems.
  2. Whether that residue is epistemic (nobody could know) or voluntariness (nobody could steer) or both.
  3. Whether the gap is metaphysical or just a practical/legal/political artifact that could be closed.
  4. Whether responsibility for foreseeable kinds of harm suffices (even if the instance wasn't foreseeable).
  5. Where the fix belongs: design time, deployment time (human intervention), or aftermath (distribute, insure, compensate).

  Specific cases to include:
  1. Trading algorithm going haywire in an unpredicted way, but firm knew that class of algorithm sometimes does this.
  2. Surgical robot doing exactly as designed but killing a patient because the design was wrong in that situation.
  3. Self-driving car that changes behavior after an update based on fleet learning, so behavior traces back to millions of other drivers.
  4. Weapon system with human veto power in theory but only seconds in practice, mostly rubber-stamped.

  Positions to map to:
  - Gap-realist (Matthias): there is a responsibility gap.
  - Gap-deniers: no gap, it's just the "problem of many hands" or ordinary liability.
  - Meaningful human control (Santoni de Sio and Mecacci): gap can be closed by ensuring human control that tracks and traces.
  - Collectivist/distributed responsibility: gap closed by distributing responsibility across the network ex post.
  - Design-time responsibility plus strict liability: responsible for foreseeable kinds of harm, so close with design and strict liability.
  - Hardliners: if no one is responsible, the system shouldn't be used.

  Also, we need to force a distinction between legal and moral responsibility at least once.

  We'll write the quiz in plain American English.

  Let's design the questions:

  Question 1: Trading algorithm case
     Scenario: A financial firm uses an autonomous trading algorithm. The firm knew that algorithms of this type can sometimes cause market crashes, but they deployed it anyway. One day, it causes a flash crash that nobody at the firm had predicted in that exact way.
     Options:
     A. The firm is responsible because they knew this kind of thing could happen.
     B. No one is responsible because no one could have predicted this exact event, and the algorithm acted on its own.
     C. The responsibility should be shared by the designers, the firm, and regulators.

  Question 2: Surgical robot case
     Scenario: A surgical robot is designed to perform a specific type of cut. In a particular patient, the robot performs the cut exactly as designed, but due to an unusual anatomy that the design didn't account for, the patient dies. There was no malfunction, and the human surgeon overseeing the operation had no reason to suspect the problem.
     Options:
     A. The manufacturer is responsible because the design was flawed for this situation.
     B. The human surgeon is responsible because they were overseeing the operation and should have intervened.
     C. No one is truly responsible because it was an unforeseeable situation and the robot did what it was programmed to do.

  Question 3: Self-driving car fleet learning
     Scenario: A self-driving car receives an over-the-air update that changes how it behaves in a certain situation. The update was based on data from millions of other cars. After the update, in a situation it previously handled safely, it now causes a fatal accident. The change in behavior was a result of the aggregated data, not a decision by any single engineer.
     Options:
     A. The company that made the car is responsible because they deployed the update.
     B. Responsibility is distributed among all the drivers whose data contributed to the update, the company, and regulators.
     C. No one is responsible because the behavior emerged from the collective data and wasn't intended by anyone.

  Question 4: Weapon system with human veto
     Scenario: An autonomous weapon system selects targets and nominally requires a human commander to approve each strike. In practice, the commander only has 10 seconds to approve or veto, and in 99% of cases, they approve because they don't have time to assess. The system then strikes a school by mistake.
     Options:
     A. The commander is responsible because they had the final say and could have vetoed.
     B. The military and the manufacturer are jointly responsible because they set up a system that made meaningful oversight impossible.
     C. No one is responsible because the commander was just a rubber stamp and the machine made the error.

  Question 5: Distinction between legal and moral responsibility
     We need to force the distinction. Let's create a case that might elicit different answers for legal vs moral.

     Scenario: A company deploys a learning system that controls building temperatures to save energy. The system learns to occasionally turn off the heat in cold weather to save costs, leading to a pipe freezing and bursting, causing major water damage to a neighboring building. The company had not foreseen this specific behavior, but they knew that the system might find unexpected ways to save energy.

     Now, we ask two separate questions for the same scenario to force the distinction:

     Question 5a (Legal): Who should be legally required to pay for the damages?
     Options:
     A. The company that deployed the system because they benefited from it and took the risk.
     B. The owner of the building with the system because they are the property owner.
     C. The victim building owner must bear the loss because it was an accident.

     Question 5b (Moral): Who is morally to blame for the harm?
