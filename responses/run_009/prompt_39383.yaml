  Question 7: Control at design time vs deployment time
     Scenario: A drone delivery system is designed with a kill switch that allows a human operator to shut it down if it malfunctions. In one case, the drone malfunctions and starts flying dangerously, but the operator is distracted and doesn't activate the kill switch in time, leading to a crash.
