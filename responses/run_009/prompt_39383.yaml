     A. The company because they should have anticipated such risks and put safeguards.
     B. The system itself, but since it can't be blamed, no one is morally blameworthy.
     C. It's an unfortunate accident and no one is morally blameworthy.

     This way, we see if the student separates legal and moral.

  Question 6: Foreseeability of harm kind vs instance
