answer: |-
  Below is a diagnostic quiz designed to help your engineering students uncover their underlying intuitions about responsibility gaps in autonomous systems. The quiz uses concrete cases instead of philosophical jargon, focusing on the fault lines you specified. Each question has 2-3 plain-language answer options. The scoring key maps answer patterns to positions in the literature (e.g., gap-realism, gap-denial), flags unresolvable overlaps, and notes unexplored/incoherent views.

  ---

  ### **Quiz: Who's Responsible? Autonomous Systems Case Studies**  
  *Instructions: For each scenario, pick the answer that best reflects your view. There are no right or wrong answers—this is about your intuitions. Answer based on what feels fair, not legal technicalities.*  

  1. **Trading Algorithm**  
     A financial firm uses an autonomous trading algorithm. The firm knew algorithms like this *sometimes* cause market crashes but deployed it anyway. One day, it causes an unpredictable flash crash. Who bears responsibility?  
     A) The firm—they knew this *kind* of risk existed.  
     B) No one—nobody could predict or control this exact event.  
     C) Regulators and the firm—they shared oversight duties.  

  2. **Surgical Robot**  
     A surgical robot performs a cut exactly as designed, but due to a rare patient anatomy, the cut kills the patient. No bugs, no human error. Who bears responsibility?  
     A) The manufacturer—the design failed in this situation.  
     B) The hospital—they chose to use the robot without a backup plan.  
     C) No one—it was a freak accident nobody could foresee.  

  3. **Self-Driving Car Update**  
     A self-driving car gets an over-the-air update based on data from millions of other cars. After the update, it causes a fatal accident in a situation it previously handled safely. Who bears responsibility?  
     A) The car company—they approved the update.  
     B) All drivers who contributed data—their choices shaped the update.  
     C) No one—the behavior emerged from aggregated data, not any person.  

  4. **Weapon System with Human Veto**  
     An autonomous weapon system requires a human commander to approve strikes. The commander has 10 seconds to decide and usually rubber-stamps it. The system mistakenly strikes a school. Who bears responsibility?  
     A) The commander—they had the final say.  
     B) The military and manufacturer—they designed a system where real oversight was impossible.  
     C) No one—the commander was a figurehead; the machine erred.  

  5. **Legal vs. Moral Distinction**  
     *Scenario: A smart HVAC system learns to shut off heat in extreme cold to save energy, causing pipes to burst and flood a neighbor’s property. The company knew it might find "creative" solutions but didn’t foresee this.*  
     - **5a: Who should *pay* for damages?**  
       A) The company—they deployed the system and took the risk.  
       B) The building owner—they installed the system.  
       C) Neither—it’s an unavoidable accident; insurance should cover it.  
     - **5b: Who is *morally blameworthy*?**  
       A) The company—they should have anticipated risks better.  
       B) The system—but it’s not a moral agent, so no one.  
       C) No one—it was genuinely unforeseeable.  

  6. **Social Media Algorithm**  
     An engagement-driven algorithm recommends increasingly extreme content. The company knew this could cause polarization but didn’t predict it would incite a riot. A riot occurs. Who bears responsibility?  
     A) The company—they foresaw the *kind* of harm (violence).  
     B) No one—they couldn’t foresee *this specific* riot.  
     C) Users and rioters—they chose to act.  

  7. **Drone Kill Switch**  
     A delivery drone has a kill switch for operators to shut it down if it malfunctions. An operator gets distracted and fails to activate it before the drone crashes. Who bears responsibility?  
     A) The operator—they neglected their duty.  
     B) The manufacturer—the system shouldn’t rely on constant human attention.  
     C) Both—the design was flawed, and the operator erred.  

  8. **AI News Writer**  
     An AI writes and publishes a news article with defamatory claims. No human reviewed it (by design). The company knew defamation was possible but thought it rare. Who bears responsibility?  
     A) The company—they chose no safeguards.  
     B) No one—no human controlled the output.  
     C) Fix the system legally—e.g., strict liability for harms like this.  

  9. **Nuclear Plant Proposal**  
     Critics argue a fully autonomous nuclear plant manager would be too complex to hold anyone responsible if it fails. What should society do?  
     A) Ban it—if no one can be responsible, it’s too dangerous.  
     B) Deploy it—hold the operating company responsible for *any* harm.  
     C) Deploy it with insurance—compensate victims without assigning blame.  

  ---

  ### **Scoring Key**  
  **How It Works**:  
  - Each answer corresponds to a fault line in responsibility-gap debates (e.g., foreseeability, control, distribution).  
  - Positions are mapped using dominant patterns in the literature. A student’s "fit" is based on consistency with a position’s core principles.  
  - **Granularity**: Scores are calculated per position (0–9). This shows movement (e.g., "shifted from gap-denial to MHC by 3 points").  

  #### **Position Profiles**  
  *Legend*:  
  - ✓ = Strongly aligned answer  
  - ~ = Contextually aligned (if consistent with core principles)  
  - ✗ = Misaligned answer  

  | Position                          | Core Principles                                                                 | Q1 | Q2 | Q3 | Q4 | Q5a | Q5b | Q6 | Q7 | Q8 | Q9 | Diagnostic Pattern                                                                 |
  |-----------------------------------|---------------------------------------------------------------------------------|----|----|----|----|-----|-----|----|----|----|----|-----------------------------------------------------------------------------------|
  | **Gap-Realist** (Matthias-style)  | Gap exists: systems behave unpredictably; no one has control/foresight.        | B✓ | C✓ | C✓ | C✓ | A~  | C✓  | B✓ | A✗ | B✓ | A✓ | B/C in Q1–Q4,8; C in Q5b; B in Q6; A in Q9. Focus on unforeseeability/voluntariness. |
  | **Gap-Denier**                    | No gap: just "problem of many hands" or liability in disguise.                 | A✓ | A✓ | A✓ | A✓ | A✓  | A✓  | A✓ | A✓ | A✓ | B✓ | A in most questions. Rejects "no one" answers.                                    |
  | **Meaningful Human Control** (MHC)| Gap closed if humans can track/trace decisions (Santoni de Sio/Mecacci).       | C✓ | B✓ | A✓ | B✓ | A✓  | A✓  | A✓ | C✓ | A✓ | A✓ | A/B/C in Q1–4; A in Q5–6,8; C in Q7; A in Q9. Emphasizes design/deployment control. |
  | **Collectivist/Distributed**      | Distribute responsibility across networks (ex post).                           | C✓ | B~ | B✓ | B✓ | C✓  | C~  | C✓ | C✓ | C✓ | C✓ | C/B in Q1–4; C in Q5a,6,7,9; C in Q5b. Shared/collaborative answers.               |
  | **Design-Time + Strict Liability**| Responsible for foreseeable *kinds* of harm; strict liability closes gaps.     | A✓ | A✓ | A✓ | B~ | A✓  | C✓  | A✓ | B✓ | C✓ | B~ | A in Q1,2,3,6; A in Q5a; C in Q5b; B/C in Q8; B in Q9. Focus on foresight + compensation. |
  | **Hardliner**                     | If no responsibility is possible, ban the system.                              | B✓ | C✓ | C✓ | C✓ | ✗   | ✗   | B✓ | ✗  | B✓ | A✓ | B/C in Q1–4,8; A in Q9. Consistent "no one" + ban deployment.                     |

  #### **Interpreting Results**  
  - **Best Fit**: The position with the most ✓/~ aligns.  
  - **Ties**: Common between:  
    - *Gap-Realist vs. Hardliner*: Both say "no one" for Q1–Q4,8. **Separator**: Q9 (A = Hardliner; C = Gap-Realist).  
    - *MHC vs. Design-Time*: Overlap on manufacturer responsibility. **Separator**: Q7 (B = Design-Time; C = MHC) and Q5b (C = Design-Time; A = MHC).  
  - **Unexplored/Incoherent Combinations**:  
    - Frequent "no one" answers *except* in Q9 (choosing B/C): Suggests a pragmatic gap-denial (e.g., "gaps exist but can be managed"). Not a defended position—likely *unattractive* (avoids accountability).  
    - Strong collectivism *without* ex post mechanisms (e.g., Q5a=C but Q9≠C): *Incoherent*—collectivism requires compensation structures.  
    - Moral blame (Q5b=A) with legal non-payment (Q5a=C): *Underexplored*—implies moral responsibility without legal liability (rare in literature).  

  #### **Why This Works**  
  - **No Jargon**: Cases isolate intuitions about control (Q4,7), foreseeability (Q1,6), distribution (Q3,5a), and moral/legal splits (Q5).  
  - **Fault Lines Covered**:  
    - *Foreseeability vs. Control*: Q1, Q2, Q6.  
    - *Epistemic vs. Voluntariness*: Q2 (epistemic), Q4 (voluntariness).  
    - *Metaphysical vs. Practical Gap*: Q8 (B = metaphysical; C = practical).  
    - *Fix Timing*: Design (Q2,7), Deployment (Q4), Aftermath (Q5a,9).  
  - **Distinguishes Positions**:  
    - Gap-Realists gravitate to "no one" (B/C) when control/foresight falters.  
    - MHC prioritizes human oversight in design/deployment.  
    - Collectivists spread blame (B/C options).  
    - Hardliners forbid deployment if gaps exist (Q9=A).  

  Students can retake this after your unit to track shifts (e.g., from "no one" answers toward distributed/MHC solutions). For clarity, provide the scoring key *after* they complete the quiz. Let me know if you’d like a formatted PDF version!
