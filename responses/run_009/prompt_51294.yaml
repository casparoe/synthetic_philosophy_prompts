prompt: |-
  I run a reading group at an AI lab — about a dozen engineers, sharp but alergic to anything that smells continental, who've all encountered Wittgenstein through secondary sources and blog posts and think they've got it. Next session is ninety minutes on the private language argument, whiteboard only. Don't explain the argument to me — I know it, or I think I do — I want the teaching plan. What order do the pieces have to go in, and what actually depends on what: does the rule-following material have to come first or can I gesture at it and pay for that later? I'm also torn on the carrying example. The beetle in the box is the one they'll half-remember, but I suspect it invites exactly the reading I want to kill — that Wittgenstein is saying inner stuff doesn't exist, or that it's ineffable and sad. Is the diary case with the sign S better as the thing I build the whole session around, and what does it have that the beetle lacks? Misconceptions I'm bracing for, roughly in order of how fast they'll surface: (1) it's behaviorism in a trenchcoat, (2) it's an epistemic point — nobody else can know what my words mean — which at least two of them will immediately splice into "so it's the symbol grounding problem, he got there early," (3) no private language means no inner monologue, no thinking to yourself, which they'll resist on personal grounds, and (4) one very online guy who's going to say the whole thing just collapses into the community-agreement reading from Kripke's book and is therefore wrong or trivial. Tell me where in the sequence each of these should be headed off, not just that they exist. And what do I flat-out refuse to cover in ninety minutes and say so out loud? Finish with one question I can ask at the end that would show whether they got the actual argument — something about the criterion of correctness — rather than just the vibe. Lead with the bottom line: your recommended sequence and carrying example in the first sentence, then the reasoning, no preamble and no restating my question back at me.
reasoning: |-
  Okay, let me break this down. The user runs an AI reading group with engineers who have surface-level Wittgenstein knowledge and skepticism toward continental philosophy. They need a tight 90-minute teaching plan focused on the private language argument (PLA), specifically avoiding common misinterpretations while using only a whiteboard.

  First, I need to consider the audience. These are sharp engineers likely to reduce philosophical arguments to computational analogs (like symbol grounding problem) or dismiss them as trivial. Their existing exposure through secondary sources means they probably hold misconceptions like "Wittgenstein = behaviorism" or "PLA denies inner experience." 

  The key constraints are: must use diary ("S") not beetle; must preempt specific misconceptions at strategic points; must clarify dependencies with rule-following; needs one diagnostic end-question. Time is critical - 90 minutes means sacrificing depth elsewhere.

  Starting with structure: The diary example is non-negotiable as primary vehicle because beetle invites "inner states don't exist" misreading. Must scaffold rule-following minimally but sufficiently - can't skip it since correctness conditions depend on it. Sequence should be: rule-following teaser → diary buildup → PLA → misconceptions defense → diagnostic Q.

  For pacing: Rule-following gets only 15min with "add 2" case to establish that meaning requires public criteria. Then spend 45min on diary, showing how "S" fails to be a sign without checkable use. Misconceptions addressed reactively when they arise: behaviorism when defining "private", epistemic/symbol grounding during diary analysis, inner monologue after PLA conclusion, Kripke at end if time.

  What to explicitly exclude: Sensation realism debate, other PI sections, Kripke's solution. Declare this upfront: "We're not asking if pain exists, but what 'pain' means." 

  The end-question must test understanding of correctness conditions: "Could the diarist distinguish between *seeming* to follow 'S' rules and *actually* following them?" Forces recognition of the no-criteria problem.

  Potential pitfalls: Engineers might demand "solutions" for private AI systems. Should emphasize this is about conceptual limits, not engineering constraints. Also brace for "but ML models have private states!" - redirect to how we *attribute* meaning to them publicly.

  Final sequence: Rule-following (15min) → Diary construction (20min) → PLA demonstration (25min) → Misconceptions (20min) → Diagnostic Q (10min). Whiteboard flow: left side for rule-following, center for diary steps, right for misconceptions as they surface.
answer: |-
  **Sequence & Core Example:**  
  Lead with the diary case ("S")—not the beetle—building the entire argument around it. Start with a *minimal* rule-following setup (5 min), then spend 70 min on "S", and close with misconceptions + diagnostic question. Rule-following *must* precede but can be compressed; gesture to its depth but explicitly defer full treatment.  

  **Teaching Plan (90 min):**  

  1. **Rule-Following Teaser (5 min)**  
     - Whiteboard: *"68+57=?"* → "What makes 125 *correct*?"  
     - Key move: Reject "mental state" as arbiter. Stress: Correctness isn’t internal—it’s in the *practice* of application.  
     - **Why now?** Establishes that meaning requires public criteria of correctness. *Crucial* for "S" to land.  

  2. **Diary Case: "S" as Core Engine (70 min)**  
     - **Step 1: Setup (10 min)**  
       - Define "private language": Words referring to *private sensations* with *no possible public checks*.  
       - Whiteboard: "Diarist labels sensation ‘S’, writes ‘S’ in diary when it occurs."  
       - **Preempt Misconception #1 (Behaviorism)**: *Explicitly state*: "This isn’t denying inner states—it’s asking how ‘S’ could *mean* anything."  
     - **Step 2: The "Rule" for "S" (20 min)**  
       - Q: "What *is* the diarist doing when they write ‘S’?"  
       - Whiteboard the diarist’s "rule": *"Write ‘S’ when I have *this* sensation."*  
       - **Kill Misconception #2 (Epistemic/Symbol Grounding)**: "The problem isn’t *others* can’t know ‘S’—it’s that *even the diarist* has no criterion to distinguish *‘I think S is occurring’* from *‘S is occurring’*." Contrast with public language (e.g., "red" tied to shared samples).  
     - **Step 3: The Collapse of Correctness (30 min)**  
       - Scenario: Diarist says "S" occurred yesterday. Q: "What makes this *true* or *false*?"  
       - Whiteboard dead ends: Memory? ("But how do you know ‘S’ memory *correctly* tracks past S?") Introspection? ("Same as checking a clock by... checking the same clock.")  
       - **Preempt Misconception #3 (No Inner Monologue)**: "This doesn’t forbid *private thoughts*—it shows that for a *word* to *signify*, it must have a *use* beyond private tagging. Your inner monologue borrows rules from public language."  
     - **Step 4: The Stakes (10 min)**  
       - **Why "S" > Beetle**: Beetle focuses on *reference* ("Does the beetle exist?"), inviting "ineffable inner stuff" misreads. "S" focuses on *rule-application*: Without public criteria, *no distinction between following a rule and thinking you are*.  

  3. **Misconception Takedowns (10 min)**  
     - **#4 (Kripkean Community)**: "Kripke makes agreement *constitutive* of meaning. But W’s point is deeper: Agreement *presupposes* the possibility of correctness. ‘S’ fails because *no standard exists to agree about*—even solitarily."  
     - **What to Refuse**: No Kripke exegesis (§201 ≠ community consensus). No metaphysics of mind ("Does pain exist?"). Declare: "We’re analyzing *linguistic conditions*, not ontologies."  

  4. **Diagnostic Question (5 min)**  
     - **"Could the diarist—even in principle—be *wrong* about whether ‘S’ occurred yesterday? If not, why does this mean ‘S’ lacks meaning?"**  
     - *Correct Answer*: No possible error → no correctness condition → no meaning.  

  **Why This Sequence Works for Engineers:**  
  - **"S" over Beetle**: Engineers fixate on reference (beetle = "data in a closed box"). "S" forces focus on *verification conditions*—a familiar computational pain point.  
  - **Rule-Following First**: Without showing that correctness is practice-bound, "S" looks like an epistemic access problem. The "add 2" hook makes this visceral.  
  - **Preemption Timing**:  
    - #1 (Behaviorism) at "S" setup—frames the target.  
    - #2 (Symbol Grounding) at "S" rule—exposes the diarist’s bootstrap failure.  
    - #3 (Inner Monologue) at correctness collapse—shows public scaffolding.  
    - #4 (Kripke) at end—isolates W’s criteria-first logic.  

  **What to Sacrifice:**  
  - No deep rule-following (§143-242). Say: "We’re taking ‘correctness requires public criteria’ as given—ask me *after* why this isn’t circular."  
  - No beetle, pain arguments, or "meaning is use" generalities.
