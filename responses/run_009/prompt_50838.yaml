  Modern biology complicates things. Networks with degenerate functions, multi-level selection—these don’t fit neatly into either account. A protein’s "function" might be its current role in a pathway *and* its evolutionary history, but neither tells the whole story. 

  So—diagnosis: The debate is substantive but not about biological facts. It’s about what concepts *should do*. Etiological theorists want functions to explain trait persistence; causal-role theorists want functions to explain system dynamics. The "disagreement" is really a mismatch in explanatory goals. 

  Progress? Not a decisive case. Either biology outgrows the dichotomy (e.g., dynamic models integrating phylogeny + mechanism), or philosophers reframe the question: "Under which contexts is each functional attribution useful?" The 40-year impasse suggests the question was poorly posed—like asking "Is water *really* H₂O or *really* wet?" 

