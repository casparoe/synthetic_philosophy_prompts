prompt: |-
  I help run the cause-selection reading group at my university's effective altruism chapter, and this term we've been working through how the movement actually picks causes — the importance, tractability, and neglectedness framework that shows up in the career and charity advice literature. The group has quietly split into two camps, and I've realized the split isn't really about any empirical question: it's about which analogy each camp carries around in their head.

  The first camp treats cause prioritization as fundamentally a matter of investment research. On their picture, the philanthropic landscape is a market: other funders and researchers are market participants, their attention is capital, a cause being crowded is like a stock being efficiently priced, and neglectedness is mispricing — the reason a small donor or career-seeker can get outsized returns by looking where nobody else is. Tractability is your information edge. They use the analogy to argue that the whole point of cause selection is finding what everyone else has missed, and that as the movement grows and the mispricings get corrected, our advantage should erode — so we should expect to keep moving. The second camp is disgusted by this and says the right picture is an emergency room. A triage nurse doesn't look for undervalued patients; she orders by severity and urgency, because the point is that someone is bleeding out. On their picture, importance is severity, the constraint is fixed capacity (beds, staff, our limited budget and careers), and crowdedness matters only in the boring sense that you can't double-treat the same patient. They use the analogy to argue that speculative, low-probability causes are a failure of triage discipline, and that the movement's flirtation with them reflects the investor mindset's tolerance for long-shot bets.

  I want to adjudicate this properly, or at least understand it. Please audit both analogies. For each, give me an explicit correspondence table — what plays the market, the price, the investor, the dividend; and what plays the patient, the severity, the triage protocol, the stock of beds — and then say where the mapping breaks down. I'm especially interested in what each analogy smuggles in: does the market picture assume that doing good generates returns the doer can capture, that attention equilibrates the way capital does, that other actors' causes are priced by anything like rationality? Does the triage picture assume a single decision-maker with a fixed capacity that can't be expanded — and does it silently treat "how likely is the treatment to work" as less important than triage actually treats it? Then give me at least one test case where the two analogies yield opposite verdicts (I'd guess something like climate change — enormous and severe but very crowded — versus some small, totally neglected, fairly intractable cause), and say whether the framework itself adjudicates the disagreement or just averages the two intuitions together. Finally: which analogy, if either, deserves to be the official picture, and if neither, what would a better one look like — something like portfolio allocation, or something that isn't economic at all?
reasoning: |-
  Okay, the user runs a cause-selection reading group at their university's EA chapter, and they've encountered a split in the group regarding how to approach cause prioritization. The two camps are using different analogies: one sees it as investment research, while the other as emergency room triage. The user wants me to audit both analogies, provide correspondence tables, identify where the mappings break down, discuss what each analogy smuggles in, present a test case, and suggest which analogy deserves to be the official picture or propose a better one.

  First, I need to break down each analogy. For the investment research model, the key elements are the market (philanthropic landscape), price (attention/capital allocation), investor (EA actors), dividend (impact per unit resource), and mispricing (neglectedness). The triage model has patients (problems), severity (importance), treatment success probability (tractability), beds (resources), and triage protocol (prioritization rules).

  Now, I should examine where these analogies break down. For the investment model, it assumes impact is captured by the actor, which isn't always true in philanthropy. Also, attention doesn't flow as efficiently as capital, and other actors aren't necessarily rational. The triage model assumes a fixed capacity and centralized decision-making, which isn't realistic. It also underemphasizes tractability compared to actual medical triage.

  Next, the smuggled assumptions. The investment model implies that do-gooders can capture returns, that attention equilibrates like capital, and that other actors are rational. The triage model assumes no capacity expansion, centralized control, and downplays the importance of solution viability.

  For a test case, climate change versus deworming in a neglected region works well. Climate change is high importance but crowded—investment analogy might deprioritize it due to efficient pricing, while triage would prioritize it due to severity. Deworming might be prioritized by investment for its neglectedness but deprioritized by triage if considered less severe.

  The user might have deeper needs here. They want to resolve the split in their group, so they need a framework that either synthesizes both views or offers a better alternative. They might also be seeking validation that both analogies have merits but limitations, which could help mediate the discussion. Additionally, they might want practical advice on how to apply cause prioritization beyond theoretical disagreements.

  The ITN framework itself tries to balance all factors but doesn't inherently resolve the disagreement. It can be applied in ways that favor one analogy over the other. A better approach might be a portfolio model that combines both. High-risk/high-reward causes (investment view) and high-certainty/high-severity causes (triage view) can coexist. This acknowledges that philanthropy isn't monolithic; different strategies can be employed depending on the context.

  I should also consider if there's a third analogy. Portfolio theory from finance allows for diversification across different types of causes. Alternatively, public health epidemiology could be a non-economic model, focusing on systemic interventions and prevention.

  In conclusion, neither analogy is perfect. The portfolio approach might be more comprehensive, allowing EAs to allocate resources across a spectrum of causes based on risk, return, and current allocation. This could satisfy both camps by showing that different strategies have their place. The key is to avoid over-relying on one metaphor and instead use a flexible framework that adapts to context.
answer: |-
  Below is a comprehensive audit of both analogies, their hidden assumptions, breakdown points, test cases, and a proposal for a more robust framework:

  ---

  ### **1. Investment Analogy Correspondence Table**
  | **Market Concept**       | **Philanthropic Equivalent**                 |
  |--------------------------|---------------------------------------------|
  | **Market**               | Philanthropic landscape (funders, researchers, orgs) |
  | **Capital**              | Attention, funding, talent                  |
  | **Price**                | Allocation of resources to a cause          |
  | **Investor**             | EA actor (donor, researcher, career-seeker) |
  | **Dividend/Return**      | Marginal impact per unit resource           |
  | **Mispricing**           | Neglectedness (under/over-allocation)       |
  | **Information Edge**     | Tractability insights/unique analysis       |
  | **Efficient Market**     | "Crowded" cause (no arbitrage opportunity)  |

  **Where It Breaks Down:**  
  - **Impact Capture:** Assumes the "investor" captures returns (impact), but philanthropic impact is non-excludable (e.g., saving lives benefits society, not the donor).  
  - **Equilibration Speed:** Attention/capital doesn't flow as efficiently as in financial markets (e.g., institutional inertia, ideological biases).  
  - **Rational Pricing:** Other actors aren't necessarily rational; causes may be "mispriced" due to moral blind spots or irrational trends.  
  - **Zero-Sum Fallacy:** Implicitly treats philanthropy as zero-sum (gains only from mispricing), but cause growth can expand total resources (e.g., advocacy attracting new donors).  

  **Smuggled Assumptions:**  
  - Impact is quantifiable and fungible (like money).  
  - Actors primarily seek marginal ROI, not absolute impact.  
  - "Winning" requires outsmarting the market, not solving problems.  

  ---

  ### **2. Triage Analogy Correspondence Table**
  | **Triage Concept**       | **Philanthropic Equivalent**                |
  |--------------------------|---------------------------------------------|
  | **Patient**              | Global problem (e.g., disease, risk)        |
  | **Severity**             | Importance (scale × intensity of suffering) |
  | **Urgency**              | Time-sensitivity (e.g., extinction risk)    |
  | **Treatment Success Prob.**| Tractability                              |
  | **Beds/Staff**           | Fixed resources (funding, talent, time)     |
  | **Triage Protocol**      | Prioritization rules (e.g., ITN framework)  |
  | **Double-Treatment**     | Redundant intervention (crowdedness)        |

  **Where It Breaks Down:**  
  - **Scalability:** Ignores that "beds" (resources) can expand (e.g., movement growth, tech advances).  
  - **Centralization:** Assumes a single decision-maker, but philanthropy is decentralized.  
  - **Preventive Care:** Downplays capacity-building (e.g., recruiting talent) that isn't direct "treatment."  
  - **Tractability Weight:** Real triage heavily weights treatment success probability (e.g., not treating untreatable cases), but the analogy often downplays this.  

  **Smuggled Assumptions:**  
  - Static resource constraints (no investment in future capacity).  
  - Problems are discrete and separable (no systemic interactions).  
  - "Treatment" is unambiguous (unlike speculative cause interventions).  

  ---

  ### **3. Test Case: Climate Change vs. Deworming in a Neglected Region**
  - **Climate Change:**  
    - *Investment View:* Deprioritize. Highly "crowded" ($700B+ annual climate funding), "efficiently priced." Low marginal ROI.  
    - *Triage View:* Prioritize. Extreme "severity" (existential risk), high "urgency."  
  - **Neglected Tropical Diseases (e.g., Schistosomiasis in South Sudan):**  
    - *Investment View:* Prioritize. Highly "mispriced" (neglected), high tractability (cost-effective deworming).  
    - *Triage View:* Deprioritize. Lower severity than existential risks, may not be "bleeding out."  

  **Result:** Opposite verdicts. Climate change favored by triage, deworming by investment.  
  **Can ITN Adjudicate?** ITN *averages* intuitions but doesn't resolve the conflict:  
  - ITN weights Importance/Tractability/Neglectedness equally, but the analogies imply different weightings (triage prioritizes Importance, investment prioritizes Neglectedness × Tractability).  
  - No objective exchange rate between factors (e.g., how much severity outweighs neglectedness?).  

  ---

  ### **4. Which Analogy Deserves to Be "Official"? Neither.**
  Both are reductive:  
  - **Investment** overfits to marginal thinking, undervalues coordination and advocacy.  
  - **Triage** overfits to acute crises, undervalues capacity-building and speculative prevention.  

  **Better Analogy: Portfolio Allocation**  
  - **Why:** Acknowledges uncertainty, diversification, and varying cause roles:  
    - **"Bonds"**: High-certainty, lower-return interventions (e.g., bed nets).  
    - **"Stocks"**: High-growth potential causes (e.g., AI safety capacity-building).  
    - **"Venture Capital"**: Speculative, high-upsight causes (e.g., s-risk reduction).  
  - **Advantages:**  
    - Explicitly models risk tolerance (e.g., long-termism vs. near-termism).  
    - Allows for expanding the "portfolio" size (movement growth).  
    - Compatible with both analogies: Triage handles "core holdings," investment handles "arbitrage opportunities."  

  **Non-Economic Alternative: Public Health Epidemiology**  
  - Focuses on systemic dynamics:  
    - **"Disease burden"** = Importance.  
    - **"Intervention efficacy"** = Tractability.  
    - **"Coverage gap"** = Neglectedness.  
  - Incorporates prevention, surveillance, and herd effects (e.g., cause interactions).  

  ---

  ### **Conclusion**
  The split reflects a **fundamental tension in EA**: Is impact about *marginal leverage* (investment) or *absolute burden reduction* (triage)? A **portfolio model** best synthesizes these by:  
  1. Allowing allocation across cause types based on risk/return profiles.  
  2. Making tradeoffs explicit (e.g., 70% "triage" causes, 30% "investment" causes).  
  3. Embedding capacity-building as a meta-strategy.  

  Recommend framing cause prioritization as **"Global Portfolio Management"**: a dynamic process balancing urgent needs, neglected opportunities, and future capacity—not a single metaphor. This avoids smuggled assumptions while honoring both intuitions.
