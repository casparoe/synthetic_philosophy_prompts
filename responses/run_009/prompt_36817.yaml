  So I keep bumping into Bradley's regress in stuff about the unity of the proposition and I think I get the basic shape of it: you've got a fact like Othello being jealous, and you say what binds Desdemona's-love-ness to Othello is a relation of exemplification/instantiation, but then that relation is itself a third thing that needs a further relation to glue it to the two original relata, and off you go forever. Fine. What I *don't* get is why this is supposed to be a problem rather than just a cute infinite regress we shrug at (mathematicians don't lose sleep over non-terminating series). Like, what's the dialectic here -- is the regress supposed to show that facts can't have constituents at all? That the constituent ontology is incomplete? Or is it just a challenge to one specific way of stating the view (the "relations are just more things that need relating" framing), so that if you refuse that framing you've escaped? And is there a version of the worry that survives someone who says "instantiation isn't a thing that participates, it's what thing-having-a-property IS, so demanding glue for it is a category error"? Please walk me through it intuitively, like I've read a fair amount of metaphysics but no formal logic past intro level, and tell me honestly which of the standard escape routes (treating instantiation as non-relational, going nominalist, just biting the bullet and accepting the regress) you think actually works and why. sorry if this is a ramble, its late here lol
