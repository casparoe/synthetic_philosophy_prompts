prompt: |-
  I've been asked to chair my department's annual "Above and Beyond" award committee, and in drafting the criteria I've discovered I have no worked-out account of what going beyond duty actually is — only a handful of verdicts I feel strongly about. Here they are. A colleague who donates a kidney to a stranger clearly qualifies. A lifeguard who rescues a drowning swimmer at serious risk to herself does not, however admirable — it's her job. A colleague who quietly donates ten percent of her salary to effective charities, every year, for twenty years, qualifies, even though no single year's donation seems especially heroic. A colleague who did something equally costly but had promised to do it — he had pledged a kidney to his ailing brother — does not qualify in my eyes, since he had an obligation, even one he took on voluntarily. And I'm genuinely torn about a colleague who performed an enormous, unrequired sacrifice but was open that he did it partly because it would look good on his record for promotion. I'd like you to tell me whether some one principle captures these verdicts — in particular, whether "beyond duty" should be read in terms of exceeding obligation, or in terms of sacrifice borne, or something else entirely — and to state your preferred principle precisely enough that I could apply it to next year's cases. Then tell me honestly which of my verdicts it cannot accommodate, whether my treatment of the twenty-year donor versus the one-off hero forces a choice between treating supererogation as a property of acts or of lives, and what it implies about the case I keep going back and forth on: a colleague who did something enormously costly and unrequired, but did it because, in her words, she couldn't have lived with herself otherwise.
reasoning: |-
  Okay, let me tackle this user's query step by step. They're chairing an "Above and Beyond" award committee and need a clear principle for what constitutes going beyond duty. They provided specific cases where they have strong intuitions but want a unified framework. 

  First, I notice their examples reveal tensions between obligation, sacrifice, and motivation. The kidney donor to a stranger qualifies, but the lifeguard doesn't—even though both involve risk. The long-term charity donor counts, but the pledged kidney donation doesn't. The promotional motives case troubles them, and they're conflicted about the "couldn't live with myself" scenario. 

  Hmm... the core challenge is balancing three elements: (1) absence of prior obligation (distinguishing duty from non-duty), (2) objective sacrifice (measuring cost), and (3) subjective motivation (assessing purity of intent). Their examples suggest obligation is primary—the lifeguard and pledged kidney cases fail because duty existed, regardless of sacrifice. But the charity case shows sacrifice matters too, aggregated over time. 

  Ah! This points toward a two-part principle: first filter for acts outside obligation, then evaluate sacrifice magnitude. Motivation becomes secondary evidence—helpful for borderline cases but not definitive. For instance, the promotional motives case might still qualify if the act was truly non-obligatory and costly, even if motives were mixed. The "couldn't live with myself" case likely qualifies because the compulsion is internal (conscience), not external (duty). 

  Wait, but how to handle the long-term donor? If we focus on acts, no single donation seems supererogatory, but the life pattern does. This suggests the award might need flexibility: sometimes recognizing single acts, sometimes lifetimes. The principle should explicitly allow aggregation—e.g., "sustained sacrifice" as a valid category. 

  *Pauses* The user's deepest need might be avoiding arbitrariness. They want criteria that feel fair across diverse cases. So the principle must clearly exclude job duties and prior commitments while capturing both one-off and sustained sacrifices. Also, they'll need concrete thresholds for "significant sacrifice" since cost is subjective. Maybe define it as exceeding reasonable expectations? 

  *Checks conflict points* The pledged kidney case is correctly excluded by this principle (voluntary obligation), but the long-term donor fits through aggregation. The promotional motives case—qualified unless the act was trivial relative to career gain. The conscience-driven colleague? Definitely qualifies; no obligation, high sacrifice, and internal motivation isn't disqualifying. 

  *Final refinement* The principle should state: (1) the act must not be required by role, promise, or reciprocity; (2) it must involve significant sacrifice (monetizable or not); (3) patterns matter. Motivation helps resolve ties but isn't primary. This covers all their verdicts except possibly the promotional case—but that's intentionally borderline, so leaving it to committee judgment is wise.
answer: |-
  Your intuitions reveal a coherent, demanding principle of supererogation grounded in **absence of obligation** and **significant sacrifice**, with **motivation** serving as a secondary consideration. Here’s a synthesized principle precise enough for committee application:

  ### The Principle
  **An act qualifies as "above and beyond" if and only if:**
  1. **It falls outside all antecedent obligations** (professional, contractual, relational, or self-imposed through prior commitment), *and*
  2. **It involves significant, non-trivial sacrifice** (material, physical, temporal, or psychological), *and*
  3. **The sacrifice is undertaken voluntarily** (without coercion).

  *Additional Clarifications:*
  - **Aggregation:** Sustained sacrifice (e.g., 20-year donations) qualifies if the *cumulative* sacrifice meets criterion #2, even if individual acts do not.
  - **Motivation:** While ideal motivation (pure altruism) is noble, it is not strictly required. Acts motivated by mixed reasons (e.g., career advancement) *may* qualify if criteria #1–#2 are met, provided the act wasn’t *primarily* self-serving or obligatory.
  - **"Obligation" Scope:** Includes formal duties (jobs, promises), strong relational duties (family care), and societal reciprocity norms. It excludes internal moral impulses (e.g., "I couldn’t live with myself").

  ---

  ### Application to Your Cases
  | Case                                      | Qualifies? | Why Under the Principle                                                                 |
  |-------------------------------------------|------------|-----------------------------------------------------------------------------------------|
  | **Kidney donation to stranger**           | ✅ Yes     | **No obligation** (stranger = no relational duty), **significant sacrifice**.           |
  | **Lifeguard risking life**                | ❌ No      | **Professional obligation** (job duty supersedes sacrifice).                           |
  | **20-year charity donor**                 | ✅ Yes     | **No obligation**, **cumulative sacrifice** is significant.                             |
  | **Kidney pledged to brother**             | ❌ No      | **Self-imposed obligation** (voluntary promise creates duty).                           |
  | **Sacrifice for promotion**               | ⚠️ Maybe  | If #1–#2 are met, motivation doesn’t disqualify—but committee may discount if sacrifice was self-interested investment. |
  | **"Couldn’t live with myself" sacrifice** | ✅ Yes     | **No obligation** (internal compulsion ≠ duty; it’s conscience, not commitment). Significant sacrifice remains. |

  ---

  ### Tensions and Implications
  1. **Your Verdicts the Principle *Cannot* Accommodate:**  
     - **The lifeguard exclusion** relies on a **strict view of professional duty**. If your committee defines certain jobs as having "inherently limitless" sacrifice (e.g., firefighters), this holds. But if risk *exceeds reasonable job expectations*, it might qualify—forcing a debate about duty boundaries.

  2. **20-Year Donor vs. One-Off Hero: Acts vs. Lives?**  
     - Your inclusion of the 20-year donor **requires recognizing supererogation as a property of *lives* (or sustained patterns)**, not just acts. The principle accommodates this via **aggregation**. Rejecting this would force you to exclude her—but your intuition wisely resists that. *Supererogation can apply to both.*

  3. **The "Couldn’t Live With Myself" Case:**  
     - This **qualifies** under the principle. The phrase expresses **personal integrity, not obligation**. It reflects character-driven sacrifice (e.g., Bernard Williams’ "moral incapacity"), not a debt or promise. To exclude it would conflate *moral psychology* with *duty*—a category error.

  ---

  ### Honest Assessment: Where Your Intuitions Challenge the Principle
  - **Promotional Motives Case:** Your unease highlights a **limitation in the principle**. The act *technically* qualifies if obligations are absent and sacrifice is real. Yet, if the sacrifice was *calculating* (e.g., minor discomfort for major gain), it fails #2 (sacrifice isn’t "significant"). If significant, the committee must decide: does cynical motivation negate "above and beyond"? The principle says no—but you may need a **tiebreaker rule** (e.g., "Motivation may downgrade but not disqualify").
    
  - **Pledged Kidney vs. Spontaneous Donation:** You rightly distinguish them via obligation. The principle holds, *but* it risks undervaluing **heroic fulfillment of duties** (e.g., a nurse working double shifts during a pandemic). This award isn’t for that—but consider a separate "Exceptional Duty" category.

  ---

  ### Suggested Refinement for Committee Guidelines
  > **"Above and Beyond" Award Criteria**  
  > To qualify, a nominee’s act or sustained contribution must:  
  > 1. **Transcend existing obligations**: It cannot reasonably be expected from their role, promises, or relationships.  
  > 2. **Demand meaningful sacrifice**: Financial, physical, emotional, or temporal costs exceeding societal or organizational norms.  
  > 3. **Be undertaken freely**: Without coercion or de facto requirement (e.g., promotion dependencies).  
  >   
  > *Note:*  
  > - Long-term commitments qualify via accumulated sacrifice.  
  > - Mixed motivations do not automatically disqualify but may be weighed against the act’s impact.  
  > - "Moral necessity" (e.g., "I had to act") does not imply obligation; it reflects character.

  This framework preserves your core intuitions while providing actionable clarity. For borderline cases (e.g., promotional motives), convene a panel vote—ethics committees exist to debate gray areas!
