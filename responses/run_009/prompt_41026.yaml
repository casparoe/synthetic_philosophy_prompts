prompt: |-
  I'm taking a seminar on social norms and convention, and I've become puzzled by the entire genre of travel-etiquette advice — guidebooks, State Department briefings for exchange students, the cross-cultural training modules that corporations put expatriates through before a posting. All of it issues the same instruction in the imperative mood: tip close to 20% in the United States, do not tip at all in Japan, stand in the queue in Britain, do not cross against the light in Germany even on an empty street at dawn. The advice is presented not as prudence ("you'll get better service") but as something closer to duty, and the visitor who ignores it is treated as having done something wrong, not merely something awkward. My question for the paper I have to write: what theory of the moral status of conventions does this practice presuppose? Does the genre commit itself to conventions being morally binding in themselves, or only to something narrower — say, that violating a local convention wrongs the locals by signalling contempt for their way of doing things? I notice the advice contains an odd asymmetry: newcomers seem to be excused in proportion to how recently they arrived, which fits a "conventions are like local laws" picture, yet the same advisors would never tell the visitor to adopt the locals' moral or religious convictions — only their conventions. So there must be some presupposed line between the two. Could you reconstruct the implicit theory, tell me which parts of the practice strictly require it and which are compatible with several rival views (for instance, a Lewis-style account of conventions as coordination solutions versus a respect-based account), and say what the advice would have to look like if we instead assumed conventions bind no one morally and only self-interest recommends following them?
reasoning: |-
  Okay, let me try to unpack this user's query. They're writing a paper on the moral status of conventions in travel etiquette advice. The user notices that such advice is presented as obligatory, not just prudent. They want to know what moral theory underpins this practice.

  First, I need to understand the core question: what makes following these conventions a duty rather than a suggestion? The user points out examples like tipping in the US versus Japan, queuing in the UK, and jaywalking in Germany. The advisors frame these as moral imperatives, where violation is seen as wrong, not just awkward. 

  The user also notes an asymmetry: newcomers are excused based on how recently they arrived, which suggests a "local laws" analogy. But unlike moral or religious beliefs, conventions are expected to be followed without adopting the underlying values. So there's a distinction between conventions and deeper moral convictions. 

  I recall David Lewis's theory of conventions as solutions to coordination problems. But the respect-based account seems more relevant here because the advice emphasizes not offending locals. The user mentions both, so I should compare them. 

  The respect-based account explains why violating conventions signals disrespect. Even if the visitor doesn't intend disrespect, locals might perceive it that way. This ties into the moral wrong of causing offense or showing contempt. Meanwhile, Lewis's coordination focus doesn't necessarily imply a moral duty. 

  The asymmetry in excusing newcomers fits the respect model. Locals understand that learning takes time, so recent arrivals get leeway. But if it were just about coordination, ignorance might not excuse the violation—it could still disrupt coordination. 

  The distinction between conventions and moral/religious beliefs is important. Conventions are about social coordination, not deep values. Adopting them shows respect for the community's way of life without endorsing their beliefs. This separates cultural practices from personal convictions. 

  If conventions weren't morally binding, the advice would focus solely on self-interest: avoiding fines, better service, etc. But current advice goes beyond that, framing violations as offensive. That shift in language—from "it's smarter" to "it's right"—supports the respect-based moral duty. 

  I should also address which parts of the practice require the respect theory. The blame and moral disapproval for violations, the asymmetry of excusing newcomers, and the distinction from moral beliefs all point strongly to the respect account. A Lewis-style coordination theory could explain the existence of conventions but not the moral imperative. 

  Finally, reconstructing the implicit theory: Travel etiquette advice assumes conventions are morally binding because violating them expresses disrespect, wronging locals by undermining their social norms. Newcomers get a grace period to learn, highlighting the importance of intentionality. The duty is to respect the community's practices, not their core beliefs. 

  This user is clearly deep into social norms theory, referencing Lewis and moral philosophy. They need a nuanced analysis that connects observed practices to underlying theories, useful for their academic paper. Their examples are spot-on, showing keen observation. My response should validate their insights and provide the theoretical framework they're seeking.
answer: |-
  Your paper touches on a profound tension in the philosophy of social norms. The travel-etiquette genre implicitly relies on a **Respect-Based Account of Conventional Obligation**—specifically, a *normative hybrid* of moral duty and social coordination. Here's a reconstruction of its presupposed theory, its tensions, and alternatives:

  ### Core Implicit Theory: Conventional Duties as Expressions of Respect
  1. **Moral Bindingness via Social Contract**  
     Conventions are treated as *localized social contracts*. By entering a community (even temporarily), you incur a defeasible obligation to adhere to its coordination rules. Violation isn't merely irrational (as in Lewis) but *unjust*, as it free-rides on others' compliance or disrupts hard-won social equilibria.

  2. **The Contempt-Signaling Thesis**  
     The primary wrong is *expressive*: flouting conventions signals disregard for the locals' way of life. This is why:  
     - Ignorance excuses newcomers (no contempt intended)  
     - Locals resent violations even when unharmed (e.g., jaywalking at dawn)  
     - Advisors frame breaches as "offensive," not "suboptimal"  

  3. **The Asymmetry Explained**  
     Conventions vs. moral/religious convictions are distinguished by:  
     - **Depth**: Conventions are *coordination tools*; convictions are *truth-claims*.  
     - **Enforceability**: Conventions rely on mutual expectation; convictions bind conscience.  
     - **Accessibility**: Conventions can be adopted behaviorally without belief (e.g., queueing without endorsing British values).  

  4. **The Grace Period Justification**  
     Excusing newcomers reflects a "reasonable effort" standard. Locals perceive violations as contemptuous only when the agent *should know better*. This blends moral epistemology (blame requires capacity to know the norm) with social psychology.

  ### What Requires This Theory? What's Compatible?
  | **Aspect of Practice**          | **Requires Respect Theory?** | **Compatible with Lewis?** |
  |---------------------------------|------------------------------|----------------------------|
  | Violations treated as *moral* wrongs | Yes (Lewis is non-moral) | No (coordination failure ≠ injustice) |
  | Blame proportional to *knowledge* of norms | Yes (intent matters) | Weakly (ignorance reduces harm) |
  | Locals' *resentment* at minor breaches | Yes (signaling offense) | No (no payoff disruption) |
  | Distinction: conventions vs. deep values | Yes (different wrongs) | Yes (different coordination problems) |
  | Advice framed as "respect" duty | Yes | No (Lewis: prudence only) |

  ### Alternative: Pure Self-Interest Model
  If conventions bind *no one morally*, advice would look radically different:  
  - **Language shifts**: "Tipping 20% *maximizes service quality*" (not "shows respect")  
  - **No shame/blame**: "Germans fine jaywalkers; calculate risk" (not "disrespect their order")  
  - **No grace period**: Ignorance harms self-interest; learn faster  
  - **Amoral exceptions**: "Ignore 'no tipping' rules in Japan if staff accepts gladly"  
  - **No expressive wrong**: Offense is locals' irrational hang-up; optimize around it  

  **But**: This fails to explain the genre's moralizing tone or locals' reactive attitudes. A shopkeeper angry at a tourist's queue-jumping isn't calculating lost efficiency—they feel *disrespected*.

  ### Tensions in the Implicit Theory
  1. **The "Empty Convention" Problem**:  
     Why respect arbitrary rules? The genre presupposes conventions *constitute* social membership. Violating them denies locals' agency in creating shared practices.

  2. **Colonialist Undertones**:  
     The duty applies asymmetrically (visitors → locals). This risks implying "their rules merit respect, but ours are universally rational"—a tension unaddressed in advisories.

  3. **Moral Overload**:  
     Can you really owe *respect* to norms you deem silly? The genre quietly assumes a Kantian "respect for persons *through* their conventions," dodging whether conventions themselves deserve esteem.

  ### Conclusion: A Humean-Respect Hybrid
  The practice assumes conventions *become* morally binding via their role in sustaining social trust. Key presuppositions:  
  - **Moral psychology**: Norm-violations *communicate* disrespect (Scanlon-style)  
  - **Social ontology**: Conventions are collective goods requiring upkeep  
  - **Limited relativity**: Only *coordination norms* (not core morals) demand behavioral conformity  

  This justifies the asymmetry: newcomers owe *behavioral adaptation* (to avoid expressive harm), not *belief adaptation*. The grace period reflects that learning conventions is part of showing respect—not that conventions lack moral weight.

  **For your paper**: Argue that the genre’s power lies in this hybrid view. It avoids Lewis’s amorality *and* moral relativism by tethering duty to *persons*, not norms themselves. The unresolved tension is whether "respect" requires internal assent or mere behavioral compliance—a fault line in the advice itself.
