  ### The Questions (8 total, 4 artificial systems)
  Each question presents a scenario and answer options based on observable behavior. Options are randomized per quiz instance (A/B/C ordering shuffled). Systems can be biological or artificial.

  1. **Thermostat Behavior (Artificial)**  
     A thermostat set to 22°C detects room temperature rising to 25°C. What does it do?  
     A) Activates cooling immediately.  
     B) Does nothing; waits for external adjustment.  
     C) Records temperature patterns for future adjustments.  

  2. **Rodent Food Choice (Natural)**  
     A rat encounters two new berries: one nutritious, one toxic. It nibbles the toxic berry, gets ill, and avoids it thereafter. When presented with both berries again, it:  
     A) Avoids both berries indefinitely.  
     B) Eats only the nutritious berry.  
     C) Re-tests the toxic berry cautiously.  

  3. **RL Agent in Maze (Artificial)**  
     A reinforcement learning agent navigates a maze with a pit (fatal) and a shortcut (reward). On its first attempt, it falls into the pit. On the second:  
     A) Takes a longer safe path, avoiding the pit.  
     B) Retries the pit path with minor adjustments.  
     C) Freezes and requires a system reset.  

  4. **Crow Tool Innovation (Natural - Crow)**  
     A crow faces a nut it cannot crack. Nearby are rocks and a paved road. It:  
     A) Tries smashing the nut with rocks for 10+ minutes.  
     B) Drops the nut from a height repeatedly.  
     C) Places the nut on the road for cars to crush.  

  5. **Chatbot Planning (Artificial)**  
     A chatbot schedules meetings across time zones. When given a complex request, it:  
     A) Outputs a flawed schedule immediately.  
     B) Searches the web for time-zone rules, then answers.  
     C) Writes interim notes like "Check Tokyo-London overlap," then answers.  

  6. **Octopus Escape (Natural - Octopus Bonus)**  
     An octopus in a tank must open a latched container to access food. The latch requires sliding a bolt leftward. It:  
     A) Tugs randomly at the container for 5 minutes.  
     B) Slides the bolt left immediately on first exposure.  
     C) Explores the latch, fails, then avoids the container.  

  7. **Predictive Simulation Test (Skinnerian vs. Popperian Discriminator)**  
     A system faces two buttons: Button A causes mild pain 90% of the time, Button B causes pain 10%. After experiencing Button A once, it must choose again:  
     A) Avoids Button A forever; always chooses B.  
     B) Tests Button A periodically to "confirm" danger.  
     C) Chooses B immediately, no further A tests.  

  8. **Hive Thermoregulation (Natural - Honeybee Colony)**  
     A beehive experiences abnormal heat. Bees:  
     A) Disperse randomly; many die.  
     B) Fan wings to circulate air after trial-and-error.  
     C) Deploy scouts to find cooler locations, then guide the swarm.  

  ---

  ### The Scoring Key  
  **Nested Hierarchy Handling**: Levels are cumulative (Gregorian implies Popperian, etc.). Scoring uses a "gate" system: a system must pass a level’s gate to qualify for higher levels. Gates are passed if ≥50% of questions for that level are answered "correctly" (per key). If lower gates fail, higher-level passes are invalid. "Insufficient evidence" applies if contradictions arise or key gates are unresolved.  

  **Question-Level Assignments**:  
  - *Darwinian Gate* (Q1, Q8): Survival/reproduction via selection.  
  - *Skinnerian Gate* (Q2, Q3): Learning by reinforcement.  
  - *Popperian Gate* (Q6, Q7): Avoiding real-world tests via simulation.  
  - *Gregorian Gate* (Q4, Q5): External representations (tools, symbols).  

  **Answer Key (Correct Options per Level)**:  
  - Q1: A (Darwinian)  
  - Q2: B (Skinnerian)  
  - Q3: A (Popperian) — *Safe path indicates offline simulation of pit risk*  
  - Q4: C (Gregorian) — *Road as external tool*  
  - Q5: C (Gregorian) — *Notes as external representations*  
  - Q6: B (Popperian) — *Immediate success implies simulation*  
  - Q7: C (Popperian) — *Avoids re-testing danger*  
  - Q8: B (Skinnerian) — *Learned fanning; A is Darwinian, C is Gregorian*  

  **Scoring Steps**:  
  1. Tally correct answers per gate.  
  2. Check gates bottom-up:  
     - Pass Darwinian if ≥1/2 correct (Q1 or Q8).  
     - Pass Skinnerian if ≥1/2 correct (Q2 or Q3) and Darwinian passed.  
     - Pass Popperian if ≥1/2 correct (Q6 or Q7) and Skinnerian passed.  
     - Pass Gregorian if ≥1/2 correct (Q4 or Q5) and Popperian passed.  
  3. Highest passed gate = System level.  
  4. "Insufficient evidence" if:  
     - Gaps in nested gates (e.g., passes Popperian but fails Skinnerian).  
     - Ambiguous patterns (e.g., 50% pass/fail per gate).  

  **Adjacent-Level Blind Spots**:  
  - *Skinnerian vs. Popperian*: Hard to distinguish with certainty (Q7 targets this, but luck or prior knowledge can confound; see Misfires).  
  - *Popperian vs. Gregorian*: Tool use (Gregorian) often requires Popperian simulation, but behavior can look identical if tools are internalized.  

  ---

  ### Two Worked Sortings  
  **System 1: Honeybee Colony**  
  - Q1: A (Activates cooling? Not applicable; bees aren’t thermostats → Skip).  
  - Q2: B (Eats nutritious berry? Bees forage collectively; no individual trial → Skip).  
  - Q3: A (Safe path? N/A for hive → Skip).  
  - Q4: B (Drops nut? Bees don’t use tools → A/B/C fail).  
  - Q5: C (Writes notes? No external symbols → Fail).  
  - Q6: B (Immediate latch open? No; bees don’t manipulate latches → Skip).  
  - Q7: C (Avoids re-testing? Bees reassess threats via dance → B).  
  - Q8: B (Fan wings? Correct → Pass).  
  *Scoring*:  
  - Darwinian: Q8 pass → Gate passed.  
  - Skinnerian: Q8 pass → Gate passed.  
  - Popperian: Q7 fail (answered B, not C) → Gate failed.  
  - Gregorian: No passes → Gate failed.  
  *Result*: **Skinnerian** (nesting stops at last passed gate).  

  **System 2: Chatbot with Web Search & Note-Taking**  
  - Q1: A (Activates cooling? No; thermostat-specific → Skip).  
  - Q2: B (Eats berry? N/A → Skip).  
  - Q3: A (Safe path? RL agents often retry pits → B).  
  - Q4: C (Uses road? No; chatbot doesn’t manipulate objects → Fail).  
  - Q5: C (Writes notes? Correct → Pass).  
  - Q6: B (Immediate latch? N/A → Skip).  
  - Q7: C (Avoids re-testing? Chatbots lack pain; may "test" via queries → B).  
  - Q8: B (Fan wings? N/A → Skip).  
  *Scoring*:  
  - Darwinian: No passes → Gate failed.  
  - Skinnerian: Q3 fail → Gate failed.  
  - Popperian: Q7 fail → Gate failed.  
  - Gregorian: Q5 pass → But lower gates failed.  
  *Result*: **Insufficient evidence** (Gregorian pass invalid; gaps in lower gates).  

  ---

  ### Where the Quiz Misfires  
  **Problematic Patterns**:  
  - **False Popperians**: Lucky Skinnerians avoid danger without simulation (e.g., Q7C by chance). Mitigation: Pair with Q3/Q6 to require consistent offline-testing evidence.  
  - **Overattribution to Animals**: Students may force "smart" labels (e.g., octopus Q6B assumed Popperian, but could be innate). Controlled by shuffling options.  
  - **AI Ambiguity**: RL agents (Q3) often blur Skinnerian/Popperian; simulation isn’t always observable.  
  - **Mixed Systems**: Hives (Q8C is Gregorian, but Q8B is Skinnerian) risk "insufficient evidence" due to nested gate conflicts.  

  **Why Popperian/Skinnerian Separation is Hard**:  
  Offline testing (Popperian) is inferential; behavior mirrors a lucky Skinnerian. Q7 mitigates by requiring *consistent* avoidance of re-testing, but prior knowledge (e.g., evolved instincts) can mimic simulation. Costly experiments (e.g., near-lethal tests) are unethical for animals, limiting discrimination.
