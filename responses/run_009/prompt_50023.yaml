     Instead, we can ask: When faced with a novel problem, does the system show any change in behavior within its lifetime?

     Option A: No, the behavior remains fixed regardless of experience. (Darwinian if the system is an individual, because it doesn't learn. But note: a population might be Darwinian even if individuals don't learn.)
     Option B: Yes, the system adapts its behavior based on rewards and punishments. (Skinnerian or above)

