prompt: |-
  My friend is deep into the extended mind stuff (Clark and Chalmers, Otto and his notebook, all that) and over the years she's handed out verdicts on a whole bunch of cases about when something outside your skull counts as part of your mind. Her track record so far:

  - the classic one: an older man whose memory is going, carries a notebook everywhere, writes down everything he needs to remember, consults it automatically without thinking, trusts it completely — she says the notebook entries literally are his beliefs, his mind extends into the notebook;
  - the same man, but its the notes app on his phone instead of paper — also extended, same reasoning;
  - a tourist who looks something up once in a guidebook she'll never open again — not extended, just a tool she used once;
  - a woman who uses GPS for every drive but still keeps her own mental map and treats the app's suggested route as advice she'll sometimes override — not extended, because she doesnt automatically endorse it;
  - and the one that surprised me: a bloke who's hopeless at remembering anything social, so his wife handles all of it — every appointment, every birthday, she reminds him and he never double-checks, treats her word as gospel. My friend says yes, his mind extends into her, or at least the remembering part of it does.

  Now she's got new cases coming up and I want to predict her. The big one: a guy who's hopeless at arithmetic and uses his phone's calculator for literally every calculation in his life — shopping, splitting bills, work stuff — reflexively, never questions the result, and honestly couldnt do the sums in his head to save his life. There's also a couple who keep a shared shopping list on the fridge that both of them treat as the single source of truth, adding to it and checking it constantly.

  What will she say about the calculator guy? And what about the fridge list — extended or not, and if so whose mind is it part of, hers, his, both, neither? I'm less interested in her answers than in the rule she seems to be running. It looks to me like more than one rule fits her track record equally well, and they come apart on at least one of these new cases. So: lay out the candidate rules, say what each one predicts for the new cases, give me your best guess with your reasons, and tell me which further case would best tell the rules apart. I'd also like to hear where the rules just go silent rather than having an answer — the fridge list feels like it might be one of those spots.

  One last thing: please write the whole answer in British English.
reasoning: |-
  Okay, the user's friend is really into the extended mind theory, especially Clark and Chalmers' ideas like Otto and his notebook. The friend has given verdicts on several cases, and now the user wants to predict her responses to new cases: a calculator guy and a shared fridge list. 

  First, I need to understand the friend's existing judgments to infer her rules. From the track record: the notebook and phone app are extended because they're constantly accessed, automatic, trusted completely, and replace biological memory. The tourist using a guidebook once isn't extended because it's a one-off tool. The GPS user who overrides directions isn't extended because she doesn't automatically endorse it. The husband relying on his wife for reminders is extended—that's interesting because it involves another person, not just an object.

  The user suspects multiple rules might fit the existing cases but diverge on the new ones. So I should outline candidate rules that explain all the past verdicts. 

  Candidate Rule 1 (Functional Equivalence): If an external resource is as reliable and automatically trusted as biological cognition, and used constantly for cognitive tasks, it's part of the mind. This fits Otto's notebook, the phone notes, and the wife-as-memory. The tourist guidebook fails because it's not constant. The GPS fails because trust isn't automatic. 

  Candidate Rule 2 (Personal Integration): The resource must be personal, under the agent's direct control, not dependent on another person's agency. This fits all except the wife case. The wife is another person, so this rule would exclude her, but the friend included her. So this might not fit unless we tweak it to include deeply integrated interpersonal cases. 

  Candidate Rule 3 (Automatic Endorsement): Automatic trust and lack of critical scrutiny are key. This fits all: Otto, phone, wife (automatic trust), but not tourist (no routine) or GPS user (she scrutinizes). 

  Now for the new cases: Calculator guy—constantly uses phone for all math, trusts it completely, can't do it biologically. Functional Equivalence and Automatic Endorsement would say extended. Personal Integration might hesitate if we emphasize personal control, but the phone is his device, so probably extended. 

  Fridge list—shared by a couple, both treat it as truth. Functional Equivalence: it's constantly accessed and trusted, so extended for both. But since it's shared, whose mind? Both? That's messy. Personal Integration: it's not individual; both control it, so maybe neither? Or both? Ambiguous. Automatic Endorsement: both automatically endorse it, so extended for both. But the user thinks this might be a point where rules go silent. 

  The user wants to know which rule the friend likely uses. Automatic Endorsement seems strongest—it cleanly fits all past cases, including the wife. Functional Equivalence is similar but the wife case involves another person's mind, which isn't functionally identical to a notebook. Yet the friend included it, suggesting she prioritizes trust and automaticity over the resource's nature. 

  For further tests: a case where someone constantly uses a tool but occasionally checks it (like the GPS but more integrated). Or a shared resource with unequal control. 

  The fridge list is tricky. The friend might say extended for both, but the rules don't specify how shared resources work. Personal Integration struggles most here. 

  My best guess: friend uses Automatic Endorsement as the core rule, so calculator guy is extended. Fridge list: extended for both, but it's under-specified. 

  User also wants British English, so I'll use "maths" not "math," etc.
answer: |-
  Right, let's break this down. Your friend's judgments align tightly with the core criteria from Clark and Chalmers' extended mind thesis, particularly the "trust and glue" conditions: **reliable access, automatic endorsement, past endorsement,** and the resource being **inextricably integrated** into the cognitive process. Here's a systematic analysis:

  ### Candidate Rules Fitting Her Track Record
  1.  **Functional Equivalence + Automatic Trust (FEAT):**
      *   **Rule:** An external resource counts as part of the mind *iff* (if and only if):
          *   (i) It functions equivalently to an internal cognitive process (e.g., biological memory, calculation).
          *   (ii) It is accessed constantly and automatically.
          *   (iii) The information retrieved is automatically endorsed without critical scrutiny.
          *   (iv) The resource is reliably available and has been consistently used this way.
      *   **Fits Past Cases:** Otto's notebook (i-iv), phone notes (i-iv) = Extended. Tourist guidebook (fails ii, iii) = Not Extended. GPS user (fails iii - overrides) = Not Extended. Wife (i-iv met for the *remembering function*) = Extended.
      *   **Predictions:**
          *   *Calculator Guy:* Uses phone constantly (ii), automatically (ii), endorses completely (iii), phone functions as his maths faculty (i), reliable/always used (iv) = **Extended Mind.**
          *   *Fridge List:* Functions as shared memory (i), constantly accessed/updated (ii), automatically endorsed (iii), reliable/established use (iv) = **Extended Mind for both partners.** (FEAT doesn't inherently resolve *how* shared resources are individuated, but implies both minds incorporate it).

  2.  **Personalised Resource + Automatic Trust (PRAT):**
      *   **Rule:** An external resource counts as part of the mind *iff*:
          *   (i) It is *personally owned and controlled* solely by the individual.
          *   (ii) It is accessed constantly and automatically.
          *   (iii) The information is automatically endorsed without critical scrutiny.
          *   (iv) The resource is reliably available and has been consistently used this way.
      *   **Fits Past Cases:** Otto's notebook (i-iv) = Extended. Phone notes (i-iv) = Extended. Tourist guidebook (fails ii, iii) = Not Extended. GPS user (fails iii) = Not Extended. *Wife:* Fails (i) - she's not personally owned/controlled, she's an autonomous agent. *However, your friend said Extended.* **This is a misfit.** PRAT struggles with the wife case unless (i) is interpreted *extremely* loosely.
      *   **Predictions:**
          *   *Calculator Guy:* Phone is personal, owned, controlled (i), constant/auto access (ii), automatic trust (iii), reliable (iv) = **Extended Mind.**
          *   *Fridge List:* Not personally owned/controlled by *one* individual (fails i for each) = **Not Extended for either.** (PRAT struggles profoundly with genuinely shared resources).

  3.  **Automatic Endorsement as Core (AEC):**
      *   **Rule:** The *decisive factor* is automatic endorsement without critical scrutiny. The resource must also be reliably available, constantly/automatically accessed, and integrated, but automatic trust is the key differentiator.
      *   **Fits Past Cases:** Otto (automatic trust) = Extended. Phone notes (automatic trust) = Extended. Tourist (no routine trust) = Not Extended. GPS user (scrutinises/overrides - no automatic trust) = Not Extended. Wife (automatic trust) = Extended.
      *   **Predictions:**
          *   *Calculator Guy:* Automatic trust (never questions) = **Extended Mind.**
          *   *Fridge List:* Both automatically endorse it = **Extended Mind for both partners.** (Like FEAT, AEC accepts shared incorporation but doesn't specify *how*).

  ### Analysis & Best Guess
  *   **The Misfit:** PRAT clearly fails to account for the wife case without abandoning its core premise. Your friend included the wife, strongly suggesting she prioritises the *functional role and automatic trust* over strict personal ownership/control.
  *   **FEAT vs. AEC:** Both FEAT and AEC fit the track record perfectly. FEAT emphasises the functional role equivalence, while AEC makes automatic trust the linchpin. In most cases, they co-occur. The wife case slightly favours AEC – the wife isn't *functionally identical* to a notebook (she has her own mind/processes), but the *output* is automatically trusted and integrated, meeting the AEC core.
  *   **Best Guess:** Your friend is primarily using **AEC (Automatic Endorsement as Core)**. The wife case is the strongest evidence: automatic trust trumped the fact that the resource was another sentient being. This suggests that for her, the lack of critical scrutiny and seamless integration is the most crucial factor, even if the resource isn't a simple tool.

  **Predictions for New Cases:**
  1.  **Calculator Guy:** Both FEAT and AEC predict **Extended Mind**. PRAT also predicts Extended, but we've discounted PRAT due to the wife case. **Your friend will almost certainly say YES, his mind extends into the calculator app.** It perfectly mirrors Otto's notebook for calculation.
  2.  **Fridge List:** This is the tricky one where the rules go a bit quiet or need interpretation.
      *   *FEAT Prediction:* Extended for both (functions as belief/memory, constant access, automatic trust).
      *   *AEC Prediction:* Extended for both (automatic trust by both).
      *   *PRAT Prediction:* Not Extended for either (lack of sole ownership).
      *   **Your friend's likely verdict:** **Extended Mind for both partners.** The constant, automatic access and *automatic endorsement by both* make it functionally part of each of their cognitive systems regarding shopping beliefs. It's a shared cognitive resource. The wife case sets a precedent for incorporating outputs from external sources (even other people) when trust is automatic. FEAT and AEC support this; only the rejected PRAT doesn't. However, she might note it's a particularly interesting case of *shared* or *distributed* extension.

  **Where Rules Go Silent/Need Interpretation:**
  *   **The Fridge List:** All rules struggle slightly with *individuation* in shared cases. FEAT and AEC clearly say it's part of *each* mind, but don't specify if it's one extended mind-bit shared, or two distinct extended mind-bits (one per person). The rules describe *conditions for extension* but aren't fully equipped for *how* multiple minds incorporate the *same* external resource simultaneously. This is an active debate in extended mind/cognition circles. Your friend might say "it's part of both their minds" without resolving the deeper metaphysics.

  **The Best Further Case to Tell FEAT and AEC Apart:**
  We need a case where automatic trust exists *without* the resource perfectly replacing an internal faculty, or vice versa.

  *   **The Case:** A musician with perfect pitch (biological ability) who *also* uses a tuning app constantly. She always double-checks her internal sense against the app out of professional paranoia, trusts the app absolutely, and would feel cognitively lost without it. She accesses it automatically for every tuning decision. However, her biological perfect pitch still functions flawlessly – she just over-relies on the app.
  *   **How it tells the rules apart:**
      *   *FEAT:* Would likely say **Not Extended.** The app doesn't *replace* her internal faculty (perfect pitch still works), so it fails functional equivalence (i). It's a *tool* she uses obsessively, not a *part* of her pitch faculty.
      *   *AEC:* Would likely say **Extended.** It meets constant/automatic access (ii), automatic endorsement/trust (iii), reliability (iv). The core condition (automatic trust) is met, regardless of whether her biology *could* do it alone. The integration is deep enough.
  *   **Why it works:** It isolates automatic trust (AEC's core) from functional equivalence/replacement (FEAT's emphasis). Given your friend's inclusion of the wife (where functional equivalence is murky), if she chose **Extended** for this musician, it confirms AEC is her core rule. If she chose **Not Extended**, it suggests FEAT (functional replacement) is more central. The calculator guy case wouldn't distinguish them as both rules agree.

  **In summary:** Based on her acceptance of the wife case, your friend likely prioritises **Automatic Endorsement (AEC)**. Thus:
  *   **Calculator Guy:** **Extended Mind (Yes).**
  *   **Fridge List:** **Extended Mind for Both Partners (Yes for both).** The shared aspect highlights a fascinating grey area in individuation that the core rules don't fully resolve. The musician case described above is the cleanest way to test if AEC or FEAT is truly her foundational principle. Cheers!
