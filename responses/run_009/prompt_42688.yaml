  We are designing a game to simulate the evolution of a complex adaptive system from simple, local rules. The goal is to have the group collectively behave as if designed, while each participant only knows their own rule. The game will run in rounds, with a selection mechanism (copying winners with mutations) and a resource-based environment.

  **Game Title:** Emergent Rationale

  **Participants:** 9 graduate students.

  **Duration:** 2 hours (including setup, gameplay, and debrief).

  **Materials:**
  - A deck of cards (or index cards) for rules (at least 20 cards to start, but we'll generate more via mutation).
  - A whiteboard or large paper to track scores and the environment state.
  - Tokens (or points on paper) for resources.
  - Timer.

  **Setup (15 minutes):**
  1. Prepare initial rule cards: Each rule card has a simple behavioral rule that dictates an action based on local information (e.g., the current environment state and the player's own resource count). The rule should be a condition and an action. Examples:
     - "If environment is 'sunny', then take 1 resource from the common pool."
     - "If your resource count is less than 3, then give 1 resource to the player on your left."
     - "If the environment is 'stormy', then do nothing."

     Create a set of 9 initial rule cards (one per player) that are randomly generated from a set of possible conditions and actions.

  2. Environment states: Define 2-3 environment states (e.g., 'sunny', 'rainy', 'stormy'). These will change every round.

  3. Resource pool: Start with a common pool of resources (e.g., 20 tokens). Each player starts with 0 resources.

  **Rules of Play (5 minutes explanation):**
  - The game is played in rounds (each round ~5 minutes). Each round has two phases:
    **Phase 1: Environment and Action (3 minutes)**
    - The facilitator announces the environment state (changing every round in a fixed sequence or randomly).
    - Each player, in secret, looks at their rule card and decides their action based on the current environment and their own resource count (they cannot see others' resources or rules). They write the action on a slip and hand it to the facilitator.
    - Actions can be: take/give a resource to the common pool, take/give a resource to a specific neighbor (left/right), or do nothing.

    **Phase 2: Resolution and Scoring (2 minutes)**
    - The facilitator collects all actions and resolves them in a fixed order (e.g., from player 1 to 9). 
    - After resolution, each player's resource count is updated. 
    - Scoring: At the end of each round, players with resources above a threshold (e.g., 2) survive. Players below the threshold (0 or 1) are marked as "losers".

  **Evolution Mechanism (between rounds):**
  - After every 3 rounds, we have a "selection event":
    - The facilitator ranks players by total resources (highest is best).
    - The bottom 3 players (losers) are removed. Their rule cards are discarded.
    - The top 3 players (winners) are copied. Each winner is copied once (so we have 3 copies of the top 3 rules). Then, we introduce mutations: for each copy, with a 20% chance, a small random change is made to the rule (e.g., change a condition or an action, or the target of the action). The mutated copies and the original winners (without mutation) become the new set of 9 rules (3 original winners + 3 copies of winners + 3 mutated copies of winners). The original winners keep their rule and resources? Actually, we want to replace the losers with the copies. So:
      - The 3 winners keep their rule and their resources (they continue).
      - The 3 losers are replaced by 3 new players: 2 copies of the winners (without mutation) and 1 copy that is mutated? Actually, we want 3 copies: one from each winner? Or we can do:
          - We have 3 winners. We create 3 new rules: one exact copy of each winner's rule? But then we have 3 winners and 3 exact copies -> 6. Then we need 3 more: so we take 3 more from the winners, but with mutation? Alternatively, we can have:
          - The 3 winners remain.
          - We create 3 copies of the winners (without mutation) and 3 mutated copies (each mutated copy is a mutation of one of the winners). Then we have 9 again: 3 winners, 3 exact copies, 3 mutated copies? But that's 9. Then the 3 exact copies and 3 mutated copies replace the 6 non-winners? Actually, we only removed 3 losers. So we only need 3 new players. We replace the 3 losers with 3 new rules: one copy of each winner? Then we have 3 winners, 3 non-winners (from the middle) and 3 new copies. Then we mutate 1 of the 3 new copies (randomly chosen) to keep variation.

    To keep it simple: 
    - We remove the 3 losers (lowest resource totals).
    - We create 3 new rule cards: 
        - Two are exact copies of two randomly chosen winners (from the top 3).
        - One is a mutated copy of the remaining winner (or we can mutate one of the copies with 33% chance each?).
        - Alternatively, we can have each new rule card be a copy of one of the winners (randomly assigned) and then apply a mutation with 20% chance per new card.

    I suggest: each of the 3 new rule cards is a copy of one of the top 3 (each winner copied once) and then for each new card, flip a coin (20% chance) to mutate (if mutate, change one element of the rule randomly).

    The new players (with the new rule cards) start with 0 resources.

  **Payoff Scheme:**
  - The goal is to accumulate resources. Resources are points. 
  - The winner of the entire game is the player with the most resources at the end (but the point is the group behavior).
  - Note: We are using resources as fitness. The threshold for survival in the selection event is relative (bottom 3) but the absolute resource count matters for ranking.

  **Timing:**
  - Setup: 15 min
  - Rules explanation: 5 min
  - Rounds: Each round 5 min (Phase1: 3 min, Phase2: 2 min). We plan for 12 rounds (60 min) but we can adjust. After every 3 rounds (so every 15 min) we do a selection event (which takes about 5 min). So 4 selection events (at rounds 3, 6, 9, 12). Total gameplay: 12*5 + 4*5 = 60+20 = 80 min. Then debrief: 20 min. Total: 15+5+80+20=120 min.

  **What Predictably Goes Wrong:**
  - The initial rules might be too chaotic and cause early extinction (e.g., too many "take" actions deplete the common pool). To mitigate, start with a large common pool and rules that are mostly neutral or slightly cooperative.
  - Players might try to communicate or coordinate, which breaks the local rule constraint. Enforce that players must not reveal their rule or their resource count to others.
  - The mutation rate might be too high or too low. We set 20% for each new rule to mutate, and when mutating, change only one element (condition or action) to a different one from a predefined set.
  - The environment changes might be too harsh. Use a fixed cycle (e.g., sunny, rainy, stormy, sunny, ...) to allow adaptation.

  **What the Game Cannot Reproduce:**
  - The game demonstrates how functional coordination can emerge without a designer and how "reasons" (the rationale for actions) can be free-floating. However, the game does not capture the normative dimension of reasons. In philosophy, reasons are typically thought to be evaluable as good or bad (not just selected-for). The game only shows that some rules are selected because they lead to higher resource accumulation. But whether these rules are "good" in a normative sense (beyond survival and reproduction) is not addressed. The game cannot show that the system's behavior is genuinely rational (in the sense of being justified by reasons) rather than merely adaptive.

  **Debrief (20 minutes):**
  1. Ask: Did the group behavior become more coordinated over time? Did it seem as if there was a design?
  2. Point out: The rationale for the system's behavior was never in any single head. The rules that survived did so because they worked together, but no one designed that fit.
  3. Push: Are these rules "reasons"? They are selected for their consequences, but are they good reasons? Are they justified? Or are they merely causal regularities that led to survival?
  4. Discuss: In biology, we often talk about the "function" of a trait. Does this game show that functions are real? Or are they just patterns we impose?

