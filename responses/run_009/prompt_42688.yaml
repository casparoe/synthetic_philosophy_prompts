answer: |-
  ### **Emergent Rationale: Evolution Game**  
  *Simulate an evolved system with local rules only. No global design, no player seeing the big picture.*

  **Materials:**  
  - Rule cards (index cards)  
  - Resource tokens (e.g., poker chips, stones, or tally marks)  
  - Whiteboard for tracking environment, scores, and player IDs (1–9)  
  - Timer  
  - Mutation die (d10; 1–2 = mutate)  

  **Setup (10 mins):**  
  1. **Rules:** Each player gets a unique rule card. Rules are simple "IF-THEN" statements based on:  
     - **Environment state** (publicly announced each round): ☀️ Sunny, 🌧️ Rainy, 🌪️ Stormy.  
     - **Your resource count** (private; start at 0).  
     - *Examples:*  
       - *"IF ☀️ AND resources < 3, TAKE 1 from common pool."*  
       - *"IF 🌧️, GIVE 1 to player LEFT."*  
       - *"IF resources ≥ 2 AND 🌪️, DO NOTHING."*  
  2. **Common Pool:** Start with 20 resource tokens.  
  3. **Environment Cycle:** Fixed sequence (☀️ → 🌧️ → 🌪️ → repeat).  
  4. **Seating:** Arrange in a circle (LEFT/RIGHT defined).  

  **Gameplay (60 mins, 15 rounds × 4 mins each):**  
  1. **Announce Environment (1 min):**  
     - Facilitator sets the round’s state (e.g., "Round 1: ☀️").  
  2. **Player Actions (2 mins):**  
     - Each player checks their rule, **secretly writes their action** on scrap paper, and hands it to facilitator.  
     - Actions: TAKE/GIVE tokens (to/from common pool, LEFT/RIGHT neighbor) or DO NOTHING.  
  3. **Resolve Actions (1 min):**  
     - Facilitator processes actions in fixed order (Player 1 to 9).  
     - **Rules:**  
       - TAKE/GIVE from common pool: Always valid (if pool is empty, TAKE fails).  
       - TAKE from neighbor: Only if neighbor has ≥1 token.  
       - GIVE to neighbor: Only if you have ≥1 token.  
     - Update token counts on whiteboard.  

  **Selection Event (every 3 rounds, 5 mins):**  
  - Bottom 3 players (fewest tokens) are "extinct."  
  - Top 3 players (most tokens) are "models."  
  - **Replace extinct players:**  
    - Copy a model’s rule exactly (assign randomly).  
    - Roll mutation die (10% chance): If 1–2, change ONE element (e.g., ☀️ → 🌧️, LEFT → RIGHT, TAKE → GIVE).  
  - New players start with 1 token (others keep theirs).  

  **Scoring:**  
  - Tokens = points.  
  - **Survival incentive:** Players aim to avoid extinction (losing all progress) and maximize tokens.  
  - **System "fitness":** Group survival measured by total tokens (displayed).  

  **Predictable Pitfalls (First Run):**  
  1. **Chaotic early rounds:** Initial rules often clash (e.g., many TAKE actions deplete the pool).  
     - *Fix:* Start with extra tokens and emphasize this is part of the process.  
  2. **Rule frustration:** Players feel rules are "stupid" or want to coordinate.  
     - *Fix:* Stress strict secrecy—no rule-sharing or strategy talk.  
  3. **Slow adaptation:** Mutations may not hit useful variants quickly.  
     - *Fix:* Use fixed environment cycle to encourage gradual fitting.  

  **Debrief (20 mins):**  
  1. **Observe Emergence:**  
     - *Ask:* "Did the group behavior start 'making sense’? Was there a ‘design’?"  
     - Highlight: No one saw the whole system; rules were selected, not reasoned.  
  2. **Philosophical Push:**  
     - "The system’s rationale (e.g., ‘store resources in storms’) was free-floating—*embodied* but never *thought*. Can we call this a ‘reason’? Why/why not?"  
     - Challenge: "Selected-for rules work, but are they *normative*? (Should they work? Are they ‘justified’?)"  

  **What the Game CAN’T Capture:**  
  - **Normative evaluability:** The game shows rules *are* adaptive, but not that they *ought* to be. Biology explains *why* a trait exists; philosophy questions if that explanation is a "reason" in the justificatory sense (e.g., "Is a mutation ‘right’ beyond survival?"). Selection ≠ justification.  

  **Rule Card Template (Print 9+):**  
  ```  
  IF [ENVIRONMENT: ☀️/🌧️/🌪️]  
  AND [YOUR TOKENS: <2 / ≥2 / ANY]  
  → [ACTION: TAKE 1 (COMMON/LEFT/RIGHT) / GIVE 1 (COMMON/LEFT/RIGHT) / DO NOTHING]  
  ```  

  **Time Summary:**  
  - Setup: 10 mins  
  - Game: 60 mins (15 rounds × 4 mins)  
  - Selection Events: 3 × 5 mins (after rounds 3, 6, 9)  
  - Debrief: 20 mins  
  Total: 105 mins (adjust rounds for tight timing).  

  **Key Insight:** Players experience evolution as a blind designer. The debrief forces a reckoning with "reasons" divorced from reasoners—ideal for philosophy of biology.
