  ### **Full Activity Design: "The Criteria in Practice"**  
  **Objective:** Students apply criteria of authenticity to an invented corpus, experiencing how methodological limitations and prior assumptions shape reconstructions of Jesus.  

  ---

  ### **PART 1: INSTRUCTIONS FOR PARTICIPANTS**  
  *(Handed to each student at the start)*  

  **Task:** In your assigned small group, evaluate 20 sayings attributed to Jesus using the criteria of authenticity (dissimilarity, embarrassment, multiple attestation, coherence, linguistic Semitisms). Your group has a secret "profile" of Jesus that should inform—but not dictate—your judgments.  

  **Procedure:**  
  1. **Review Materials:**  
     - **Corpus Sheet:** 20 numbered sayings (1–20).  
     - **Source Sheets:** Four documents (A, B, C, D) containing overlapping sayings.  
     - **Profile Card:** A confidential identity for your group’s Jesus (do not share with others!).  

  2. **Discuss & Vote:**  
     - For each saying, debate its authenticity using the criteria.  
     - Vote using **colored tokens**:  
       - **Green** = Authentic  
       - **Yellow** = Uncertain/Disputed  
       - **Red** = Inauthentic  
     - Record your group’s *majority vote* for each saying on the **Public Ledger**.  

  3. **Public Ledger:**  
     - A whiteboard grid with rows (sayings 1–20) and columns (Groups 1–4).  
     - After voting, place a colored magnet (●) in your group’s column for each saying.  

  **Time:** 90 minutes for discussion/voting.  

  **Rules:**  
  - Base votes *only* on the criteria and sources—no external knowledge.  
  - Do not reveal your group’s profile until the debrief.  

  ---

  ### **PART 2: PROFILE CARDS**  
  *(One per group, distributed secretly)*  

  | Group | Profile                  | Key Traits                                                                                                |  
  |-------|--------------------------|----------------------------------------------------------------------------------------------------------|  
  | 1     | **Apocalyptic Prophet**  | Jesus foretold God’s imminent judgment, urged repentance, and saw himself as a herald of the Kingdom.    |  
  | 2     | **Wandering Cynic Sage** | Jesus mocked social conventions, advocated simplicity, and used wit to challenge wealth/power.           |  
  | 3     | **Messianic Revolutionary** | Jesus aimed to overthrow Roman/Jewish elites, saw himself as a Davidic king, and inspired armed resistance. |  
  | 4     | **Pharisaic Reformer**   | Jesus worked within Judaism, debated Torah interpretation, and sought ritual/moral purity renewal.       |  

  ---

  ### **PART 3: CORPUS & SOURCES**  
  **Invented Corpus of 20 Sayings**  
  *(Designed with controlled features; Semitisms in bold)*  

  1. “Repent, for the **kingdom of heaven** is at hand!”  
  2. “**Amen, amen**, I tell you: The sun loves both saints and scoundrels.”  
  3. “Take no purse, no bag—your Father feeds even the sparrows.”  
  4. “Tear down this Temple, and I will rebuild it in three days.”  
  5. “If your enemy strikes you, offer him your other cheek.”  
  6. “Do not think I came to bring peace, but a sword!”  
  7. “**Woe to you**, scholars! You tithe herbs but swallow camels.”  
  8. “The Son of Man will descend on clouds to judge the tribes.”  
  9. “**Blessed are** the poor, for theirs is the kingdom.”  
  10. “Sell your cloak to buy a dagger.”  
  11. “**Abba**, Father, why have you forsaken me?”  
  12. “The Law and Prophets hang on love of God and neighbor.”  
  13. “Render to Caesar what is Caesar’s, and to God what is God’s.”  
  14. “No one is good—not even me—except God alone.”  
  15. “Let Rome’s monuments crumble to dust.”  
  16. “Eat what is set before you; the soul is not defiled by food.”  
  17. “I am the way; no one comes to the Father except through me.”  
  18. “**Hear, O Israel!** The Lord our God, the Lord is one.”  
  19. “The kingdom is like yeast a woman hid in dough—it changes all.”  
  20. “Whoever does not hate father and mother cannot follow me.”  

  ---

  **Source Sheets & Dependencies**  
  *(Each group receives all four sources; dependencies are hidden)*  

  | Source | Contents (Saying #s)                           | True Dependence            | "Independent" Illusion             |  
  |--------|------------------------------------------------|----------------------------|-----------------------------------|  
  | **A**  | 1, 3, 5, 9, 12, 14                            | None (earliest)            | Appears independent               |  
  | **B**  | 1, 2, 4, 6, 10, 13, 15, 18                    | Copied #1, 13 from A       | Mistaken for independent         |  
  | **C**  | 3, 5, 7, 8, 9, 11, 16, 19                     | None (truly independent)   | Correctly independent             |  
  | **D**  | 1, 3, 4, 5, 6, 7, 10, 12, 13, 17, 18, 19, 20 | Copied #1, 3, 5, 7 from A/C; #4, 6, 10, 18 from B | Appears widely attested |  

  **Key Frictions:**  
  - **#1**: Attested in A, B, D → Seems multiply attested, but only A is independent (B and D copied A).  
  - **#9**: Attested in A and C → Truly multiply attested (A and C independent).  
  - **#10**: Attested in B and D → Seems multiply attested, but D copied B (only one independent source).  
  - **#17**: Attested only in D → Easily dismissed, but mirrors Johannine theology (tests dissimilarity).  

  ---

  ### **PART 4: SESSION TIMELINE**  
  **Total: 3 hours**  
  - **0:00–0:15** — Intro (Explain task, distribute materials, form groups).  
  - **0:15–1:45** — Group Work (90 mins):  
    - Groups discuss/vote on all 20 sayings using criteria.  
    - Record votes on public ledger with colored magnets.  
  - **1:45–1:55** — Break (Instructor prepares debrief slides).  
  - **1:55–2:45** — Debrief (50 mins):  
    - Reveal profiles and compare ledger results (10 mins).  
    - Unpack dependencies and re-example votes (e.g., #1, #10) (15 mins).  
    - Map activity moments to methodological limits (20 mins, see below).  
    - Discuss limitations of the exercise (5 mins).  
  - **2:45–3:00** — Q&A and concluding remarks.  

  ---

  ### **PART 5: VOTING MECHANISM**  
  - **Materials:**  
    - Each group has a set of **green/yellow/red tokens** (one color per student).  
    - Public ledger: **Whiteboard grid** with 20 rows (sayings) and 4 columns (groups).  
  - **Process:**  
    1. For each saying, students debate and vote individually with tokens.  
    2. Majority color determines group verdict (e.g., 3 green + 1 red = green).  
    3. Group recorder places a **colored magnet** (●) in their column on the ledger.  
  - **Outcome Visualization:**  
    - Ledger reveals patterns (e.g., Group 3 rejects #5, Group 2 rejects #6).  
    - Photos of the ledger used in debrief to highlight divergence.  

  ---

  ### **PART 6: DEBRIEF SCRIPT**  
  *(Instructor-led discussion mapping activity to real-world limits)*  

  1. **Reveal Profiles & Compare Ledger** (10 mins):  
     - Ask groups to state their profile and show 2–3 sayings they deemed authentic.  
     - **Observation:** "Notice how Group 1 (Apocalyptic) accepted #8, while Group 2 (Cynic) rejected it. Why? *Coherence* with your profile swayed you."  

  2. **Unpack Source Dependencies** (15 mins):  
     - Show dependency diagram (A → B; C independent; D → A/B/C).  
     - Re-vote on examples:  
       - *Saying #1*: Initially 4 attestations (A, B, C, D). Now, only A and C are independent. Does this change votes?  
       - *Saying #10*: Only B is independent (D copied B). How does this expose *multiple attestation’s fragility*?  

  3. **Map Activity to Methodological Limits** (20 mins):  
     - **Circularity in Dissimilarity**:  
       - *Example*: Group 3 (Revolutionary) rejected #5 ("offer your cheek") as "too pacifist for Jesus" → They *assumed* violence was "dissimilar" to early Judaism, but it was circular—they defined dissimilarity by their profile.  
     - **Interdependence of Criteria**:  
       - *Example*: #14 ("No one is good") was deemed "embarrassing" by all, but Group 4 (Pharisaic) rejected it for lacking Semitisms → Embarrassment was overruled by linguistic criteria.  
     - **"Plausible" vs. "Authentic" Slide**:  
       - *Example*: Group 2 (Cynic) accepted #16 ("soul not defiled by food") as "coherent" with their Jesus, ignoring it had only one attestation (C). They conflated "fits my profile" with "authentic."  
     - **Semitisms as Overpowered**:  
       - *Example*: #11 ("**Abba**, Father") was accepted by all groups due to Aramaic, though it supports all profiles equally (fails to distinguish Jesus).  

  4. **Limitations of the Activity** (5 mins):  
     - **What We Couldn’t Simulate**: Real source criticism (e.g., Synoptic Problem, Q, John’s relation to Synoptics). Invented sources lack the ambiguity of oral tradition, redaction, or contextual clues (e.g., why would early Christians invent #14?).  
     - **Bridge to Reality**: "In real scholarship, we ask: *Why* might Mark edit this? *How* does John’s theology reshape sayings? This activity shows the *method’s* limits—but you still need source criticism to apply it."  

  ---

  ### **PART 7: PREDICTABLE CHALLENGES**  
  1. **Students Recognize Profiles Early**:  
     - *Mitigation*: Use generic profile language (e.g., "Pharisaic Reformer" vs. "Rabbinic Teacher"). If detected, ask: "Did knowing your profile *change* how you applied the criteria?"  

  2. **Corpus Feels "Too Fake" to Take Seriously**:  
     - *Mitigation*: Open by saying, "This is a *thought experiment*—like a physics lab with frictionless planes. We’re isolating the criteria to test them."  

  3. **Group Dismisses All Criteria**:  
     - *Mitigation*: Assign roles (e.g., "criteria advocate" per group). If they vote randomly, contrast their results with others in debrief: "Your random votes created a ‘Jesus’ with no coherence—does that reflect history?"  

  4. **Time Runs Short**:  
     - *Mitigation*: Reduce corpus to 15 sayings (cut #15, #17, #20) or assign 5 sayings/student to present.  

  ---

  ### **PART 8: CLOSING NOTE FOR INSTRUCTOR**  
  **The Unreproducible Element**: Actual source criticism of the Gospels. This activity *presupposes* source dependencies but cannot replicate the process of *establishing* them (e.g., arguing for Markan priority, reconstructing Q, or weighing John’s historicity).  

  **How to Supply It Without Lecture**:  
  - **In Debrief**: Display a slide of the Two-Source Hypothesis (Mark → Matt/Luke; Q) and note: "Our Source A was like Mark, C like Q—but scholars spend careers debating these links. Without them, criteria are adrift."  
  - **Provocation**: Ask, "If you had to *prove* Source B copied A, what would you look for?" Then pivot to real cases (e.g., Matt 3:7–10 vs. Luke 3:7–9).  
  - **Takeaway**: "This activity exposes *how* criteria are applied. Now, when you read Allison, Ehrman, or Wright, ask: What sources do they assume? How does that shape their Jesus?"  

  **Final Thought**: The goal is discomfort—students should leave skeptical of "objective" criteria and alert to the role of their own biases. Lean into the messiness!  

