prompt: |-
  I'm presenting to my department's works-in-progress group next Friday. Quick setup: I'm defending the view that the Knobe effect — people saying the chairman harmed the environment "intentionally" in the harm version of the case but not helping it "intentionally" in the help version — is not evidence that moral judgments infiltrate our concept of intentionality, as most people read it. On my view, the asymmetry comes from pragmatics: "intentionally" primarily serves to license responses like blame and credit, so when no reactive attitude is on the table, the asymmetry dissolves. The audience is about fifteen people: mostly ethicists who are skeptical of experimental philosophy generally and think survey methods tell you about interestingness of wording rather than concepts, plus two cognitive scientists who love the x-phi stuff but think any pragmatics story is unfalsifiable hand-waving, and one guy who will ask about whether I've run it in a non-WEIRD sample no matter what my slides say. Give me a prep sheet: the objections I'm actually going to get, in the order they'll probably come, phrased the way each group would put them; for each, a two-minute reply, what to concede, and where the reply is soft. Also include the question I'm hoping no one asks, and tell me if there's anything I should proactively put in the talk's last slide so it doesn't come up at all in Q&A. Keep in mind I can't respond to a demand for new empirical data by promising a study — I need replies that work with what's already in the literature.
reasoning: |-
  Okay, the user is preparing for a presentation defending a pragmatic account of the Knobe effect against the dominant view that it reveals moral biasing of intentionality concepts. They need a tactical Q&A prep sheet tailored to their specific audience dynamics.

  Hmm, the audience composition is crucial here - mostly skeptical ethicists, two pro-xphi but anti-pragmatics cognitive scientists, and the mandatory WEIRD-sample questioner. Each group will attack differently: ethicists will question methodology validity, cognitive scientists will demand falsifiable mechanisms, and the diversity critic will surface regardless. 

  First, anticipating the ethicists' opening salvo: they'll likely dismiss survey data as measuring linguistic quirks rather than conceptual structure. Need to counter by emphasizing converging evidence - not just Knobe's original survey but subsequent behavioral studies showing asymmetry persists in non-verbally mediated tasks. Should concede that wording matters while insisting patterns reveal deeper cognitive structures. 

  For the cognitive scientists, their pragmatics-skepticism requires preemptive work. Must highlight testable differences between semantic and pragmatic accounts - like the licensing prediction where reactive attitudes are absent. The "unfalsifiable" accusation is dangerous; should have the Levinson citation ready about pragmatic diagnostics. 

  The WEIRD question is inevitable but manageable - acknowledge the limitation while noting existing cross-cultural replications in industrialized nations. Can't promise new studies but can cite existing Japanese/German work. 

  The nightmare question would be about non-binary reactive attitudes - what if people attribute intentionality for neutral actions? That could unravel the licensing account. Need to preempt this by mentioning it in the conclusion slide with a "further research needed" hedge. 

  Biggest vulnerability is the lack of neurological evidence for the licensing mechanism. Should proactively address this by discussing complementary fMRI work on blame attribution in the talk itself. Also need to emphasize that pragmatics isn't "just conversational" but tied to behavioral dispositions. 

  For delivery tactics: the conclusion slide should list three clear predictions of the pragmatic account to demonstrate falsifiability. And must avoid getting dragged into methodological debates - keep redirecting to explanatory power. 

  Final prep note: rehearse the "it's about action-understanding not morality" soundbite. That distillation could neutralize both ethicist and cognitive scientist objections if delivered crisply.
answer: |-
  Here's your tactical Q&A prep sheet, designed for maximum impact with your specific audience. The objections are ordered by likely sequence and group, with targeted replies.

  **Predicted Objections & Replies:**

  1.  **Objection (Ethicist - First Mover):** "This is precisely *why* we distrust survey methods. You're showing people are sensitive to wording and context in *describing* actions, not revealing anything deep about the *concept* of intentionality itself. It's just linguistic noise masquerading as conceptual analysis."
      *   **Reply (2-min):** "You're right that wording matters critically – that's *central* to my pragmatic account! But this isn't random noise; it's systematic, predictable *pragmatic* noise driven by the core *function* of the term 'intentionally'. It signals relevance for reactive attitudes like blame/praise. The Knobe cases aren't revealing a *distortion* of the concept by morality; they're revealing the *purpose* of the concept in social interaction. The asymmetry dissolves precisely when we remove the pragmatic trigger (reactive attitudes), showing the core concept remains stable. This is evidence *for* a stable core concept modulated by context, not against it."
      *   **Concede:** Survey wording effects are real and significant.
      *   **Soft Spot:** Needs strong evidence that the asymmetry *does* dissolve without reactive attitudes (cite literature on neutral/technical contexts where asymmetry weakens).

  2.  **Objection (Cognitive Scientist #1 - Anti-Pragmatics):** "Pragmatics stories are notoriously slippery and unfalsifiable. How do you *operationalize* and *test* this 'licensing' mechanism beyond just re-describing the asymmetry? It feels like hand-waving compared to a straightforward biasing account."
      *   **Reply (2-min):** "It's absolutely falsifiable. Key predictions: (1) If we *remove the need* for reactive attitudes (e.g., describe the act purely technically, or in a context where blame/credit is irrelevant), the asymmetry *should weaken or vanish* – and studies like [Mention Knobe 2004 'Chairman didn't care' variants, Uttich & Lombrozo 2010 on norms, or Beebe & Buckwalter 2010 on non-moral cases] show this. (2) If we find cases where a *non-moral* reactive attitude is salient (e.g., surprise, disgust), we might see *similar* asymmetries for 'intentionally' – and work on [Mention e.g., Pettit & Knobe 2009 on attitudes, or other norm-violation studies] supports this. Pragmatics makes distinct predictions about *when* the effect should appear/disappear."
      *   **Concede:** Isolating *pure* pragmatics from semantics is complex; mechanisms need further specification.
      *   **Soft Spot:** Needs clear citations demonstrating *specific* tests differentiating pragmatic licensing from moral biasing.

  3.  **Objection (Ethicist - Follow-up):** "Even granting your pragmatics, doesn't the *very fact* that moral valence triggers this pragmatic use show that morality is fundamentally shaping how we deploy the concept? So morality *is* infiltrating intentionality judgments, just via pragmatics rather than semantics."
      *   **Reply (2-min):** "Crucially, no. Morality isn't shaping the *content* of 'intentionality'. It's signalling *when* it's conversationally relevant to *invoke* that stable concept. Think of 'knows'. We might say "I know the bus comes at 8" when planning, but not when discussing quantum physics. Context matters pragmatically, but 'knowledge' itself isn't changing. Similarly, 'intentionally' means the same thing (acting with skill/awareness towards a goal), but we highlight it pragmatically when it matters for reactions like blame. The *concept* isn't morally infused; its *deployment* is sensitive to the *social consequences*."
      *   **Concede:** Moral valence is a powerful trigger for the pragmatic use of 'intentionally'.
      *   **Soft Spot:** Must firmly distinguish the *concept's content* from its *context of use*.

  4.  **Objection (Cognitive Scientist #2 - Mechanism Demand):** "Okay, *how* does this 'licensing' actually work cognitively? What's the proposed mechanism linking 'reactive attitude on the table' to the utterance of 'intentionally'? Without a cognitive model, this remains descriptive, not explanatory."
      *   **Reply (2-min):** "You're pinpointing a key area for future research. The pragmatic account suggests a processing story: When evaluating an action for potential blame/credit, we prioritize features relevant to assigning responsibility – chief among them being whether the outcome was brought about *intentionally*. Saying "He did it intentionally" efficiently flags this relevance for the listener in the blame/credit context. It's a conversational shortcut signalling 'this action warrants this type of evaluation'. While we need more cognitive modelling, the *pattern* of data – the effect appearing *only* when reactive attitudes are salient and vanishing otherwise – strongly supports this functional/pragmatic explanation over a fundamental conceptual shift. Think Gricean maxims of relevance applied to responsibility attribution." (Cite: Adams & Steadman 2004, 2007 on blame attribution driving the effect).
      *   **Concede:** A detailed cognitive implementation model is not fully fleshed out yet.
      *   **Soft Spot:** Needs to emphasize the *explanatory power* of the pattern (when effect appears/disappears) even without a full mechanistic model.

  5.  **Objection (The WEIRD Guy - Inevitable):** "Have you run this with non-WEIRD populations? If this is about universal pragmatics or concepts, it should replicate everywhere. WEIRD samples might just have weird conversational norms about blame."
      *   **Reply (2-min):** "An excellent and vital point. While my focus today is on the theoretical account and existing literature, it's absolutely crucial to test cross-culturally. Promisingly, the core Knobe asymmetry *has* been replicated in several non-US samples [Mention e.g., Japanese - Knobe & Burra 2006, German - Beebe & Buckwalter, etc. – CHECK specific cites you know]. This suggests the phenomenon isn't purely a WEIRD linguistic quirk. However, rigorously testing the *pragmatic licensing hypothesis* – specifically, whether the asymmetry dissolves in neutral contexts across diverse cultures – is indeed an essential next step. Existing cross-cultural replications of the basic effect provide initial support that the phenomenon the pragmatic account seeks to explain is robust."
      *   **Concede:** Full cross-cultural tests of the *pragmatic dissolution prediction* are limited/non-existent.
      *   **Soft Spot:** Can't cite direct evidence for the *pragmatic account* in non-WEIRD samples.

  **The Question You Hope No One Asks:**

  *   **"Can you point to *any* empirical evidence that directly *rules out* the moral biasing account in favor of *your specific pragmatic licensing mechanism*? Isn't your account just compatible with the data, rather than uniquely supported?"**
      *   **Why it's bad:** This cuts to the core challenge. The pragmatic account often explains the *same* core asymmetry as the moral biasing account, just via a different route. Dissolution studies are key, but someone might argue dissolution could also occur under biasing if the moral trigger is removed. Truly ruling out biasing is hard.
      *   **Salvage Strategy:**
          1.  **Emphasize Parsimony:** "The pragmatic account explains the *full pattern* – the asymmetry *and* its dissolution – with a single, well-established mechanism (pragmatic licensing for conversational relevance regarding reactive attitudes). The biasing account needs an *additional* mechanism to explain why the bias vanishes when reactive attitudes are absent."
          2.  **Highlight Unique Predictions:** Cite work showing asymmetries emerging for *non-moral* norm violations where reactive attitudes are salient (e.g., etiquette, club rules). The biasing account struggles here unless it stretches 'moral' beyond recognition, while the pragmatic account handles it naturally. "If it were purely moral biasing, why do we see similar effects for breaking arbitrary rules where blame, but not morality, is involved?"
          3.  **Functional Argument:** "The biasing account posits a surprising, deep intrusion of morality into a basic action concept. The pragmatic account offers a more conservative explanation rooted in the established social function of language and responsibility attribution."

  **Proactive Defense on the Last Slide:**

  Include a slide titled: **"Key Predictions & Support for the Pragmatic Licensing Account"**

  *   **Prediction 1: Asymmetry Requires Reactive Attitude Context.**
      *   *Support:* Dissolution in neutral/technical descriptions (Knobe variants, Uttich & Lombrozo 2010).
  *   **Prediction 2: Asymmetry Can Emerge for Non-Moral Norm Violations.**
      *   *Support:* Studies on etiquette, convention violations (Pettit & Knobe 2009, or similar).
  *   **Prediction 3: Intentionality Judgments Tightly Coupled with Blame/Praise Attribution.**
      *   *Support:* Adams & Steadman (2004, 2007) - blame drives intentionality judgments.
  *   **Core Claim:** 'Intentionally' functions pragmatically to signal relevance for reactive attitude assignment; its core conceptual content remains stable.

  **This slide proactively:**

  1.  **Demonstrates Falsifiability:** By listing testable predictions.
  2.  **Addresses the Pragmatics Hand-Waving Charge:** Shows specific predictions and empirical support.
  3.  **Undercuts the "Just Wording" Ethicist:** Shows the pattern extends beyond simple surveys to judgments linked to blame.
  4.  **Preempts the "Why Not Morality?" Question:** Highlights non-moral cases and the blame-attribution link.
  5.  **Acknowledges Need for More:** Implicitly shows where future work (like non-WEIRD tests of predictions 1 & 2) is needed without inviting the WEIRD question directly.

  **Delivery Tips:**

  *   **Acknowledge Skepticism:** Start Q&A with: "I know many of you are skeptical about x-phi methods / pragmatics accounts, so I appreciate these tough questions..."
  *   **Cite Specifically:** Have key citations (Knobe variants, Adams & Steadman, Pettit & Knobe, Uttich & Lombrozo) ready to name-drop authoritatively.
  *   **Control Time:** Be ruthless with the 2-min limit. "That's a great point, briefly..." or "To keep it short...".
  *   **Concede Gracefully:** "You're right to point out that..." builds rapport without weakening your core argument.
  *   **Reframe:** Turn "hand-waving" into "making testable predictions"; turn "just wording" into "revealing functional purpose".
  *   **Focus on Function:** Constantly return to the core message: *'Intentionally' tells us when to hold someone responsible, not that morality changed what intention means.*

  Good luck! Your awareness of the audience is your biggest asset. Use it.
