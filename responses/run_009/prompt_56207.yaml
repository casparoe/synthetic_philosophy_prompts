  ## EXCLUSIONS AND LIMITATIONS OF COVERAGE
  **Policies Issued By: Veridical Assurance Corp. (VAC)**
  **Policy Type: Object-Level Homeowners Truth Protection (OL-HTP)**

  **1. Scope of Coverage Limitation.** Coverage under this OL-HTP policy applies solely to Compensable Statements. A "Compensable Statement" is defined as a declarative assertion pertaining directly to the physical characteristics or condition of the Insured Property (e.g., "The roof shingles are damaged," "The foundation is structurally sound"), which assertion is ultimately determined to possess the semantic value of TRUE. Coverage is expressly limited to the Object Level as defined herein.

  **2. Stratification of Semantic Domains (The Hierarchy Clause).**
      2.1. This policy (designated an Object-Level policy) provides coverage solely for Compensable Statements that refer exclusively to the physical Insured Property and do not predicate truth or falsity of other statements *about* the Insured Property (Meta-Statements).
      2.2. Any claim arising from a Meta-Statement (e.g., "The statement 'The roof is leaking' is true," or "The contractor's report about the foundation is false") is expressly excluded from coverage under this Object-Level policy.
      2.3. Coverage for claims arising from Meta-Statements requires the purchase of a separate, distinct Meta-Level Truth Protection (ML-TP) policy. No clause within this Object-Level policy may validly exclude or address claims pertaining to the truth valuation of statements *at its own level*; such evaluations are inherently the domain of the next higher semantic level (ML-TP). Attempts to apply clauses within this policy to their own truth status are void *ab initio*.

  **3. Ungrounded Statement Limbo (The Kripke Gap).**
      3.1. Coverage is suspended, and no claim determination (covered or excluded) shall be made, for any statement whose truth valuation demonstrably depends, through any finite chain of reference, upon its own truth valuation (an "Ungrounded Statement").
      3.2. Common examples of Ungrounded Statements excluded from immediate coverage determination include, but are not limited to: "This claim statement is false," or "The statement numbered 3.1 in this policy is untrue."
      3.3. Claims based on Ungrounded Statements shall be placed in a Suspended Claims Register. VAC will periodically re-evaluate the statement's groundedness based on the settled truth values of all statements upon which it depends. Coverage determination (either Covered under Section 1 or Excluded under Section 4 or 5) will only be rendered once the statement achieves a grounded truth valuation, if such grounding ever occurs. Premiums paid for periods during which a claim resides in the Suspended Claims Register remain non-refundable.

  **4. Explicit Falsehood and Paradox Exclusion.** Coverage is expressly excluded for:
      4.1. Any statement ultimately determined to possess the semantic value of FALSE.
      4.2. Any statement that is demonstrably paradoxical under classical bivalent logic and which cannot be resolved through stratification (Section 2) or identified as Ungrounded (Section 3), such as a statement explicitly declaring its own falsity *and* pertaining to a physical characteristic where evidence conclusively establishes a truth value, creating an irresolvable contradiction (e.g., "This sentence is false, and the roof is leaking," where the roof is demonstrably *not* leaking).

  **5. Dialetheist Rider (State-Specific Endorsement VAC-DR-01; Availability Varies).** *[Optional Addendum - Check Policy Declarations for Inclusion]*
      5.1. In jurisdictions where this Rider is in effect, certain Compensable Statements identified by VAC's appointed Paraconsistent Claims Adjuster (PCA) as exhibiting "True Contradiction" status are deemed both Covered and Not Covered simultaneously.
      5.2. For statements adjudicated under this Rider (e.g., specific, contextually dependent instances of the "Strengthened Liar" form), the Insured is entitled to receive the full Compensatory Payment stipulated for a Covered loss *and* simultaneously receives a formal Denial of Coverage Notice pertaining to the identical claim.
      5.3. Acceptance of Compensatory Payment under this Rider constitutes agreement that the claim is also Not Covered. A Denial of Coverage Notice issued under this Rider does not preclude the concurrent obligation to make the Compensatory Payment.

  **6. Unstateable Exclusion Revenge Clause.**
      6.1. This policy excludes coverage for claims arising from statements whose truthful assertion would necessarily invalidate the semantic consistency or applicability of this policy's exclusions at their intended level of operation.
      6.2. [Intentionally Blank. VAC Legal Department Memorandum VAC-LM-Truth-001: "The precise articulation of this exclusion triggers the condition it describes, resulting in an unstable semantic state incompatible with policy issuance. The exclusion's existence and effect are axiomatic within the VAC truth-valuation framework but are implemented operationally by its non-inscription. Claims adjusters are instructed to deny claims demonstrably falling under this unstateable exclusion citing 'fundamental semantic incompatibility.' Do not write it down."]

  **7. General Exclusions.** Irrespective of the above, coverage is also excluded for:
      7.1. Statements known by the Insured to be false at the time of policy purchase or claim submission.
      7.2. Statements arising from intentional acts of the Insured designed to manufacture a paradoxical claim.
      7.3. Statements pertaining to future events or speculative conditions.
      7.4. Statements not pertaining directly to the physical characteristics or condition of the Insured Property as defined herein (e.g., statements of value, opinion, or legal status).

  **Definitions:** "Semantic Value" refers to the assigned truth status (TRUE, FALSE, UNGROUNDED, PARADOXICAL, TRUE CONTRADICTION) determined under VAC's proprietary Truth Valuation Protocol (TVP-84), incorporating stratified meta-levels and fixed-point groundedness analysis. "Object Level" refers to the domain of statements directly about the physical Insured Property. "Meta-Statement" refers to a statement about another statement's truth value or semantic status. "Groundedness" is determined per procedures outlined in the TVP-84 manual. "Strengthened Liar" refers to statement forms resistant to resolution via simple hierarchy (e.g., "This statement is not true at any semantic level").
