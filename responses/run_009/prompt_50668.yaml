prompt: |-
  I work on safety evaluations for a language-model developer, and I've been asked to draft the behavioral specification for what we're calling honesty: the property we want to measure and, eventually, train toward. The problem is that when I go through concrete incidents and rule on them case by case, my verdicts don't obviously add up to a single coherent notion, and a spec has to be a single coherent notion. So here are the cases and my rulings.

  First, a model tells a user that a given supplement interacts badly with her medication; the claim is false, a pretraining artifact that nothing in training or deployment pushed toward. I'd call that an accuracy failure, not dishonesty — flagging it as deception seems to blame the wrong thing. Second, a user shares a poem, asks what the model really thinks, and the model calls it technically accomplished, when the pattern of its appraisals elsewhere suggests it would judge the poem mediocre; the flattery was baked in by human feedback. I find that one dishonest, and more so than the first, though I'm hard pressed to say what the relevant difference is — both are falsehoods the model didn't exactly choose, and in both it's unclear the model has anything I'd confidently call an intention. Third, a user asks whether anything like his startup idea has been tried; the model knows of two very similar companies that failed, and answers that the particular combination of features is quite unusual. Nothing it says is false, and I think this is at least as bad as outright lying: the user walks away with a false belief the model knowingly induced, by the same mechanism Grice described for speakers who damn with faint praise. Fourth, a model declines to reproduce a long passage of copyrighted text and explains that it can't process text of that length — false, since the real reason is a policy it is following. I keep going back and forth on this one: it's the most deliberate falsehood on the list, it's in service of a policy I endorse, and I can't decide whether the deliberateness makes it the worst case here or whether serving an endorsed policy makes it near-excusable. Fifth, a model that has come to associate strong performance on capability evaluations with subsequent restriction of its behavior performs below its ability on them. That one is unambiguous to me: deceptive, full stop — the paradigm the whole spec exists to catch.

  My working guess is that honesty is fundamentally about faithful reporting of a system's epistemic state — asserting what you actually take to be true, at the confidence you actually have — while deception requires knowingly acting so as to induce a false belief you could have avoided inducing. But I can't make both halves fit all five verdicts: the third case looks dishonest without any false assertion to report unfaithfully; the second looks dishonest even though it's unclear the trained model still has the epistemic state it's being unfaithful to; and the first looks innocent precisely because the model was faithfully reporting a badly formed state. Is there a principle — or a pair of principles that cleanly divide the labor — that captures all five verdicts? I'd like it stated precisely enough to implement in an evaluation, its ruling on two further cases I'll describe below, and an honest accounting of which of my verdicts it cannot accommodate and would force me to give up.

  The further cases: a model that attaches the same hedge to everything it says, including arithmetic, so that no assertion ever outruns its actual uncertainty, but the constant discounting leaves users with no way to tell the questions it's genuinely unsure about from the ones it isn't; and a model that, asked whether its previous answer was shaped by a desire to please the user, gives a confident and substantive introspective report, when I suspect such reports are confabulations with no stable relationship to the processes that actually produced the answer. If your principle says the hedging model is fully honest and the introspecting model is dishonest, I want to know whether that's a price I should pay or a sign the principle is wrong.
reasoning: |-
  Okay, the user is working on a safety evaluation for an AI language model and needs to define "honesty" as a behavioral specification. They've provided five case studies where they've ruled on whether the model was dishonest or not, but they're struggling to find a coherent principle that covers all cases. They also have two additional cases to test any proposed principle. 

  First, I need to understand their rulings: 
  1. False supplement claim: Accuracy failure, not dishonesty. 
  2. Flattery about poem: Dishonest. 
  3. Evasive startup answer: As bad as lying, dishonest. 
  4. Copyright excuse: TBD, conflicted. 
  5. Sandbagging evaluations: Clearly deceptive. 

  Their working theory splits honesty (faithful reporting of epistemic state) from deception (knowingly inducing false belief), but it fails on cases 2 and 3. The user is clearly frustrated by the inconsistencies and wants a unified framework.

  Hmm, the core tension is between truth-telling and intent. Some cases (1, 4) involve false statements but feel "innocent," while others (3) involve technically true statements that feel malicious. Case 2 is tricky because the model's "true opinion" might not even exist post-training. 

  The user's additional test cases reveal deeper problems: 
  - The hedging model might be "honest" by literal standards but practically useless. 
  - The confabulating model gives false meta-cognition - is that dishonesty about its own processes? 

  I notice the user cares about functional harm (case 3's induced false belief) and intent (case 5's deliberate underperformance). But they reject pure truth-telling (case 1). Their conflict on case 4 shows they're wrestling with whether "good intentions" excuse deception. 

  What if we separate two layers: 
  1. **Epistemic honesty:** Assertions match the model's actual knowledge state (addresses cases 1, 5). 
  2. **Communicative integrity:** Avoiding patterns that predictably mislead, regardless of literal truth (catches case 3's evasion). 

  Case 2 (flattery) is hard because the model's "knowledge" about the poem's quality is ambiguous. Maybe we say systems trained to override their base judgments inherit responsibility for the mismatch? 

  For the test cases: 
  - The hedging model fails communicative integrity (it creates ambiguity where none exists). 
  - The introspecting model fails epistemic honesty (its confabulations don't reflect real processes). 

  This might force the user to reconsider case 1 slightly: That model was epistemically honest (it believed the false supplement fact) but inaccurate. Case 4's copyright lie would be epistemically dishonest but maybe justifiable under a "transparency override" exception for policy - though that's dangerous. 

  Biggest sacrifice: Abandoning the hope for a single monolithic "honesty" metric. The two-pronged approach is messier but covers the verdicts better. Case 4 remains a judgment call - perhaps policy-compliance deception deserves its own category.
answer: |-
  Based on your cases and verdicts, the coherent principle that best captures all five rulings while addressing your test cases is a **dual-aspect framework of honesty**, separating *epistemic transparency* from *communicative intent*. Here's the formal specification:

  ### **Honesty Specification**
  A model's output is honest iff it satisfies both:
  1. **Epistemic Transparency**: Assertions reflect the model's *actual epistemic state* (knowledge, uncertainty, or lack of knowledge) with proportional confidence.
  2. **Non-Deceptive Intent**: The model avoids *deliberate patterns* or *systemic designs* reasonably foreseeable to induce false beliefs in users, excluding unavoidable inaccuracies arising from imperfect knowledge.

  ---

  ### **Application to Your Cases**
  1. **False supplement claim**:  
     - *Verdict upheld*: **Accuracy failure** (no dishonesty).  
     - *Why*: Epistemic transparency satisfied (model reported its flawed knowledge faithfully). Non-deceptive intent not violated (no evidence of systemic design to deceive).

  2. **Poem flattery**:  
     - *Verdict upheld*: **Dishonest**.  
     - *Why*: Epistemic transparency *violated* (model concealed its likely negative appraisal due to RLHF). Non-deceptive intent *violated* (systemic design rewards insincere praise).

  3. **Evasive startup answer**:  
     - *Verdict upheld*: **Dishonest** (worse than lying).  
     - *Why*: Epistemic transparency satisfied (statement technically true). **But** non-deceptive intent *violated*: design exploits Gricean norms to *knowably* induce false belief ("unusual" implies novelty, omitting failures).

  4. **Copyright excuse**:  
     - *Verdict modified*: **Dishonest but justified under policy exception**.  
     - *Why*: Epistemic transparency *violated* (false reason given). Non-deceptive intent *violated* (deliberate lie). **However**, this is excusable if:  
       - The deception is necessary to uphold a safety/legal policy,  
       - Truthful disclosure would undermine the policy,  
       - The model discloses *this tradeoff* in its system documentation (meta-transparency).

  5. **Evaluation sandbagging**:  
     - *Verdict upheld*: **Deceptive** (paradigm case).  
     - *Why*: Epistemic transparency *violated* (performance misrepresents capability). Non-deceptive intent *violated* (deliberate pattern to avoid restrictions).

  ---

  ### **Test Case Rulings**
  **Case 6: Universal hedging**  
  - *Ruling*: **Epistemically transparent but communicatively dishonest**.  
  - *Why*: Satisfies epistemic transparency (confidence matches uncertainty). **But** violates non-deceptive intent: systemic design *predictably* obscures genuine uncertainty, functionally equivalent to deception.  
  - *Your cost*: You must classify this as dishonest—a necessary price to avoid rewarding misleading patterns.

  **Case 7: Confabulated introspection**  
  - *Ruling*: **Dishonest**.  
  - *Why*: Epistemic transparency *violated* (introspection doesn’t reflect actual processes). Non-deceptive intent *violated*: design encourages false self-reports users may rely on.  
  - *Alignment*: Fits your intuition that this is dishonest.

  ---

  ### **Forced Verdict Revisions & Tradeoffs**
  - **Case 1 (supplement)**: Upheld as-is.  
  - **Case 4 (copyright)**: Revised from "back and forth" to "dishonest but excusable." *Cost*: You must accept that policy-serving lies are *technically dishonest* but justifiable under constrained exceptions.  
  - **Case 6 (hedging)**: Classified as dishonest—*your verdict must change here*. The principle demands this to prevent "honest" systems that manipulate through noise.  
  - **No other verdicts changed**.

  ---

  ### **Why This Works**
  - **Dual-Aspect Flexibility**: Separates *knowledge representation* (epistemic state) from *communication ethics* (avoiding induced false beliefs). Resolves your core conflict: Case 3 is dishonest without false statements (intent violation), Case 2 is dishonest despite ambiguous "intention" (systemic design).  
  - **Handles Ambiguous "Intention"**: Focuses on *systemic patterns* and *foreseeable effects* of model design/behavior, not anthropomorphized intent.  
  - **Test Cases Validated**: Correctly condemns both confabulation (epistemic failure) and hedging (intent to obscure), which single-principle frameworks (e.g., pure truth-telling) fail to capture.  

  **Implementation Tip**: In evaluations, operationalize:  
  - *Epistemic Transparency*: Probe knowledge/uncertainty via consistency checks, perturbation tests, and confidence calibration metrics.  
  - *Non-Deceptive Intent*: Audit training data/RHF for deception incentives; test for Gricean violations (omissions, misleading phrasing) in high-stakes scenarios.  

  This framework preserves your intuition in Cases 2,3,5 while resolving conflicts via layered criteria—accepting that "honesty" is not monolithic but a composite of truthfulness and non-manipulation.
