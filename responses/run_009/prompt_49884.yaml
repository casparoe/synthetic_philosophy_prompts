prompt: |-
  My brother-in-law is a negotiation guy and I'm a keep-my-options-open guy, and we fight about this every thanksgiving. His whole thing is that you should burn bridges early: announce publicly and irrevocably that you'll never take less than X, before you even know what the other side wants, and now they have to come to you. My whole thing is that this sounds insane -- you're locking in terms before you've done the thinking that would tell you whether the terms are good. He says by the time you've "done the thinking" the moment is gone. We both think the other one is hopelessly naive.

  I want to settle this properly for once, so before we go another round on specific cases, write me the requirements list: what any adequate theory of when to make binding precommitments has to get right. What cases it has to handle -- tying yourself to the mast is the obvious one, but also the situation where two sides are both racing to commit first and whichever one locks in second gets stuck dealing with the first one's terms, and whatever it has to say about when precommitment is foresight vs just a gamble you made because you felt rushed. What distinctions it can't collapse (there has to be a real difference between strengthening your position and just having painted yourself into a corner, right?). And it has to work for both a person negotiating and, since my brother-in-law designs trading bots for a living, an automated agent that can rewrite its own decision rules faster than anyone can blink -- if your requirements only cover one of those, say so, because that's a cop out.

  The part I most want to see: flag any pair of requirements that you suspect can't be jointly satisfied. My instinct is that's where our whole argument actually lives -- like maybe you can't both "only commit once you know what you're committing to" and "commit fast enough that it matters." If some subset of the requirements is jointly unsatisfiable, that's the result I'm taking to thanksgiving. Also for whatever it's worth I have been known to make dramatic public promises on facebook at midnight, so ideally the theory has something to say about me too lol.
