prompt: |-
  I host a little podcast on philosophy of mind and old-school AI, and next week's guest is a philosopher whose whole line is that the frame problem was never solved, just quietly forgotten -- her take is that it was never really an engineering problem about representing what stays fixed when actions happen, but a deeper problem about relevance: what makes some fact about the world worth considering and infinitely many others ignorable. The ML crowd, she says, didn't solve it, they just built systems that are good enough at enough things that nobody asks the question anymore.

  Draft me nine or ten interview questions that press on the actual content of that position, not just having her restate it. At least one should push on whether this relevance thing is really just the frame problem relabeled or actually the ancient problem of inductive risk wearing a costume, one should ask about Fodor's pessimism (he basically thought the holism of relevance made AI hopeless -- does she inherit that pessimism or think it was overblown?), and one should go at her with the standard reply that modern LLMs handle novel situations decently without anything like a solution, so what exactly is still missing. For each of those three, add a follow-up keyed to the answer she's most likely to give. Keep the questions conversational enough that I can actually read them aloud without sounding like a journal article, please.
