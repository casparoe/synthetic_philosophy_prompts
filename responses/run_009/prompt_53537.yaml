prompt: |-
  I chair the quarterly portfolio review at a mid-sized software company: every three months, a panel of eight engineering and product managers has to decide which in-flight projects continue, which get more time, and which we kill. The official doctrine, pushed hard by our CFO, is that these decisions must be forward-looking only: money already spent is gone, so the only question for each project is whether the next pound spent there beats the next pound spent anywhere else. Sunk costs are, on this view, simply irrelevant, and any appeal to them — 'we've come too far to stop now', 'we can't waste what we've put in' — is flagged as the sunk cost fallacy and struck from the discussion. But in practice the panel keeps running into cases that make us doubt the doctrine is the whole story. Killing a project one month from delivery because the forward-looking numbers have dipped seems to discard something real; and everyone senses that 'how much has already been spent' sometimes carries genuine information about whether the remaining spend is worth it — though nobody on the panel can say crisply when, or whether that's just the fallacy talking in a nicer accent.

  What I want from you is a decision procedure the panel can actually run in the meeting: roughly twenty minutes per project, no finance analyst in the room, managers with no training in decision theory, and a written rationale for each decision that the CFO's office will audit afterwards. The procedure should be grounded in what decision theory and the empirical literature on escalation of commitment actually support, translated into questions a manager can answer without the theory behind them. The hard part, as I see it, is separating the legitimate from the illegitimate uses of the past: past investment as *evidence* about future payoffs (learning curves, what completion unlocks, what the history reveals about the team's estimates) versus past investment as a supposed *claim* on the future ('we owe it success'). The procedure needs to make that distinction operational, and it also has to handle the things the pure doctrine ignores: option value of being nearly done, the reputational and morale costs of killing things, the fact that the counterfactual 'spend the money elsewhere' is often fictional because the alternative isn't a project but nothing. Please mark the points where the procedure runs out and a human judgement call has to take over, and be honest about where the procedure will misfire — say, the systematic biases it can't detect from inside the room.

  Then run it on three cases so the panel can see it in action: (1) a data-migration project, eleven months in, budget 60% spent, where the forward-looking case for finishing is genuinely close but completion is two weeks away; (2) a customer-facing feature, four months in, whose forward-looking case is clearly negative, but where the team that built it is one we will need for the next project and morale is fragile; and (3) a case where the procedure's honest answer is 'kill it' even though the panel will hate saying so and will be tempted to bend the procedure — pick the details of that one yourself. Finally, state clearly what the procedure cannot do: the questions it cannot answer even in principle, and where a panel using it in good faith could still get the wrong answer. Please write the whole thing in British English.
reasoning: |-
  Hmm, the user chairs a quarterly portfolio review at a mid-sized software company. They have a panel of eight engineering and product managers who need to decide which projects to continue, extend, or kill. The CFO insists on a forward-looking approach, ignoring sunk costs as fallacious. But the panel finds this too rigid in practice - they feel past investment sometimes carries legitimate information, and stopping near completion feels wasteful.

  The user wants a practical decision procedure that can be run in meetings - about 20 minutes per project, no finance analysts present, with managers untrained in decision theory. It needs written rationales for CFO audits. The core challenge is distinguishing legitimate uses of past investment (as evidence about future outcomes) from illegitimate ones (emotional claims). The procedure must also handle real-world complexities like option value, reputational costs, and the fact that alternatives might not exist.

  Key elements to address:
  - Legitimate evidence from past: learning curves, unlock potential, estimation accuracy
  - Illegitimate sunk cost fallacy: emotional appeals
  - Additional factors: option value near completion, morale/reputational impacts, fuzzy alternatives

  The procedure must flag where human judgment is needed and admit where it might misfire. They also want three test cases to demonstrate:
  1. Data migration: 11 months in, 60% spent, 2 weeks from completion, borderline future ROI
  2. Customer feature: 4 months in, negative future ROI but fragile team morale
  3. A "kill it" case that will be unpopular

  Finally, I need to clarify the procedure's limitations - what it fundamentally can't resolve.

  I'll develop a structured decision tree with clear questions, designed for group discussion. It should:
  - Start with forward-looking viability
  - Systematically examine legitimate backward-looking evidence
  - Quantify option value for near-complete projects
  - Assess morale/reputational impacts separately
  - Force explicit acknowledgment of alternative uses for funds
  - Produce auditable rationales

  For the test cases, I'll show how it handles each scenario, including where judgment calls are needed. Then I'll outline the procedure's inherent limitations regarding uncertain forecasts, emotional biases, and organizational blind spots.

  The language must be practical British English, avoiding theoretical jargon while remaining rigorous. Terms like "sunk cost fallacy" should be reframed operationally (e.g., "are we continuing because we feel we ought to?").
answer: |-
  Here’s a practical decision procedure for your panel, grounded in decision theory and escalation-of-commitment research. It separates **legitimate evidence from past investment** from the **sunk cost fallacy**, while accounting for real-world complexities like morale, option value, and fuzzy alternatives. The procedure is designed for 20-minute discussions per project, with clear audit trails.

  ---

  ### **Project Continuation Decision Procedure**
  **Core Principle:** *"Should we spend the next £X here, or is there a better use for that £X?"*  
  **Outputs:** Continue / Kill / Extend (with conditions) + Written Rationale (for CFO audit).

  #### **Step 1: Forward-Looking Viability (5 mins)**  
     - **Question A:** *"Ignoring all past spend, what is the *minimum* additional time/cost to deliver tangible value? What is the *realistic* post-delivery value (revenue, cost savings, strategic goals) per quarter?"*  
       - *Purpose:* Isolates future ROI. Managers must quantify (even roughly: e.g., "£50k cost, £200k/year savings").  
     - **Question B:** *"How confident are we in these estimates? (High/Medium/Low) and why?"*  
       - *Purpose:* Flags uncertainty. Low confidence triggers scrutiny in Step 2.  
     - **Threshold:** If future value < 1.5x cost (adjustable by CFO), proceed to Step 2. Else, **KILL** (no need to continue).  
     - *Judgment call:* Define "tangible value" (e.g., "usable by customers," "integrates with System X").  

  #### **Step 2: Legitimate Backward-Looking Evidence (7 mins)**  
  *Past spend is only relevant as **evidence** for future outcomes. Probe three areas:*  
     - **Question C:** *"Has past work revealed new information that *improves* the future cost/value? (e.g., learning curve unlocked efficiency, discovered dependencies)."*  
       - *Example:* "We now automate migrations 50% faster after Month 6."  
     - **Question D:** *"Has past work exposed risks that *worsen* the future cost/value? (e.g., team underestimated complexity, scope changed)."*  
       - *Example:* "Integration took 3x longer; likely pattern for remaining work."  
     - **Question E:** *"Does completion *unlock options*? (e.g., partial delivery is useless, but full delivery enables follow-on projects)."*  
       - *Example:* "Migrated data is worthless until 100% complete."  
     - **Output:** Adjust Step 1 estimates if new evidence is credible. No adjustment? Return to Step 1 outcome.  

  #### **Step 3: Non-Financial Factors (5 mins)**  
  *Assess only if project fails Step 1 but has strategic/operational weight.*  
     - **Question F:** *"If killed, what is the *concrete* impact on: (a) team morale (e.g., key talent attrition risk), (b) reputation (e.g., customer contract penalty), (c) strategic positioning (e.g., losing a market beachhead)?"*  
       - *Quantify:* "High risk of 2 engineers leaving," "£100k penalty from Client Y."  
     - **Question G:** *"Is there a *real alternative use* for the freed-up resources? Or will they sit idle?"*  
       - *Purpose:* If no alternative, "opportunity cost" is £0.  
     - **Threshold:** Only override a "KILL" if impacts are severe, probable, and costly. *Judgment call:* Panel votes on severity (High/Medium/Low).  

  #### **Step 4: Decision & Rationale (3 mins)**  
     - **Continue:** Future ROI > threshold (Step 1) + no red flags (Step 2).  
     - **Kill:** Future ROI < threshold + no material non-financial factors (Step 3).  
     - **Extend:** "Continue" but with revised scope/deadline based on Step 2 evidence.  
     - **Rationale Template:**  
       *"Forward ROI: [£X cost vs. £Y value]. Past evidence adjusted this by [±Z%] due to [C/D/E]. Non-financial factors: [F/G impacts]. Thus, [Decision]."*  

  ---

  ### **Where Judgment Takes Over**  
  1. **Estimating future value** (Step 1): Subjective forecasts are unavoidable.  
  2. **Severity of non-financial risks** (Step 3): Requires panel debate.  
  3. **"Fuzzy" alternatives** (Step 3G): If resources might be redeployed unevenly.  

  ### **Systematic Biases the Procedure Can’t Detect**  
  - **Inside-view optimism:** Teams overvalue their own projects. Mitigation: Use external benchmarks in Step 1.  
  - **Groupthink:** Panels avoid "killing" peers' projects. Mitigation: Anonymous pre-votes.  
  - **Effort justification:** "We suffered, so it must be worth it." Mitigation: Step 2 focuses only on *new information*.  

  ---

  ### **Case Studies**  
  #### **Case 1: Data Migration (11 months, 60% spent, 2 weeks to completion, borderline ROI)**  
  - **Step 1:** "£10k to finish, £15k/quarter savings." ROI = 1.5x → borderline.  
  - **Step 2:**  
    - *C: Learning curve?* "Yes, last 2 migrations took half the time." → Adjust cost to £8k (ROI now 1.9x).  
    - *D: New risks?* "None."  
    - *E: Option value?* "Data useless until 100% migrated." → High option value.  
  - **Step 3:** Non-financial? Minimal (internal project).  
  - **Decision: CONTINUE.**  
    *Rationale: "Low remaining cost (£8k) unlocks £15k/quarter savings. Past efficiency gains support cost reduction. No material non-financial risks."*  

  #### **Case 2: Customer Feature (4 months in, negative ROI, fragile team morale)**  
  - **Step 1:** "£80k to finish, value £40k/year." ROI = 0.5x → **KILL** threshold.  
  - **Step 2:**  
    - *C: New info?* "No, technical debt worse than expected." → Adjust cost to £100k.  
    - *D: Risks?* "Yes, scaling issues uncovered." → Value down to £30k.  
    - *E: Option value?* "Partial launch possible but weak."  
  - **Step 3:**  
    - *F: Morale?* "High attrition risk for 3 key engineers (critical for next project)."  
    - *G: Alternative?* "Resources can move to Project Alpha (ROI 2x)."  
  - **Decision: KILL** (but with morale plan).  
    *Rationale: "Negative forward ROI (£100k vs. £30k). Past work revealed higher risks. Though morale impact is high, resources can be redeployed to higher-ROI work. Addendum: HR to retain team via reassignment bonus."*  

  #### **Case 3: The "Painful Kill" (AI Compliance Tool)**  
  - **Project:** 18-month AI tool to auto-audit code for regulatory compliance. 70% spent (£700k), 6 months left (£300k). Forward ROI negative (post-launch savings £50k/year; maintenance £100k/year). Team of 5 specialists.  
  - **Step 1:** "£300k cost, £50k/year value." ROI = 0.17x → **KILL**.  
  - **Step 2:**  
    - *C: New efficiency?* "No, AI model accuracy plateaued at 70% (needs 95%)."  
    - *D: New risks?* "Yes, new regulations require full redesign." → Cost to £500k.  
    - *E: Option value?* "Tool unusable below 90% accuracy."  
  - **Step 3:**  
    - *F: Morale/rep?* "High: Team may leave if project killed; regulators expect tool."  
    - *G: Alternative?* "Resources could build cheaper API-based solution (ROI 1.8x)."  
  - **Decision: KILL** (despite pressure).  
    *Rationale: "Catastrophic forward ROI (£500k cost vs. £50k value). Past work confirms fundamental flaws. Non-financial risks are material but outweighed by redeployment to higher-ROI alternative. Accept short-term reputational hit; notify regulators of pivot."*  
  - **Why panel hates it:** Emotional attachment to "AI hype," team prestige, sunk cost narrative ("£700k wasted"). Procedure forces confrontational honesty.  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Predict the unpredictable:** Black swan events (e.g., market crashes) or serendipitous breakthroughs.  
  2. **Resolve deep uncertainty:** When all estimates (cost/value) are "Low Confidence" (Step 1B), it flags risk but can’t magically create data.  
  3. **Eliminate power dynamics:** A dominant VP can still skew discussions.  
  4. **Value alignment:** Choosing between "£1 profit" vs. "strategic vision" requires executive judgment.  
  5. **Long-term optionality:** Projects creating future opportunities (e.g., R&D) need bespoke valuation.  

  **Final Note:** This procedure makes trade-offs explicit and audits the *reasoning*, not the outcome. A "good" decision can still fail due to bad luck, but it will be defensible to the CFO. Pair it with a "lessons learned" post-audit to refine future estimates.  

  ---  
  **British English Note:** "Defence," "rationalise," "organisation" used throughout. Let me know if you'd like the rationale templates as downloadable forms.
