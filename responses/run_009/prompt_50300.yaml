answer: |-
  Here's an 8-question diagnostic quiz focusing on the *purpose* of free will in human contexts, designed to tease apart core intuitions without relying on physics or determinism:

  **Quiz: What Matters Most for "Free Will"?**

  **1. The Bank Teller**
  > Alex is forced at gunpoint by a robber to open the safe. Alex hates doing it but sees no other way to survive. Later, the police debate whether Alex should face any blame.
  > *   **A:** Alex deserves *no* blame; they had no real choice.
  > *   **B:** Alex deserves *some* blame; they could have chosen to be a hero.
  > *   **C:** Alex deserves *no* blame, but it's not because of the gun. It's because opening the safe wasn't really *their* decision in the way that matters.

  **2. The Perfect Matchmaker**
  > Dr. Nova secretly implants a chip in Ben's brain that guarantees Ben will fall deeply in love with the next person he meets, Maya. Ben meets Maya, feels genuine love, chooses to marry her, and lives happily, believing he chose freely. Did Ben freely choose to marry Maya?
  > *   **A:** Yes. His feelings and choice were real and authentic to him.
  > *   **B:** No. His choice was caused by the chip, not by *him* in the right way.
  > *   **C:** It doesn't matter if it was "free"; what matters is he's happy and the relationship works.

  **3. The Unfailing Predictor**
  > Every morning, the Oracle publishes a prediction of exactly what Maya will choose for lunch that day. Maya always reads it, thinks carefully about her options, and invariably chooses exactly what was predicted. Could Maya have chosen differently?
  > *   **A:** Yes. The prediction didn't *make* her choose; she thought for herself.
  > *   **B:** No. If she *could* choose differently, the Oracle couldn't be unfailing.
  > *   **C:** The question "could she have chosen differently?" misses the point. What matters is that her choice reflected her own reasoning.

  **4. The Struggling Artist**
  > Charlie desperately wants to finish their novel before the deadline. They know exactly what to write and believe it's important. However, Charlie has severe ADHD. Sitting down to write feels like trying to swim upstream. When they finally manage to write a page after hours of agonizing effort, was that act freely chosen?
  > *   **A:** Yes, but only because it took incredible effort to overcome the struggle.
  > *   **B:** Yes, absolutely. They knew what they wanted to do and did it.
  > *   **C:** No. The struggle shows Charlie wasn't truly free; their condition controlled them.

  **5. The Guard Dog**
  > Rex is a highly trained guard dog. When an intruder approaches the house, Rex barks ferociously and blocks the door, exactly as he was trained. He isn't scared or angry; he's just doing his job reliably. Did Rex *freely* choose to guard the house?
  > *   **A:** Yes. He reliably did the right thing in the situation.
  > *   **B:** No. He's just acting on instinct and training; he can't *decide* to guard.
  > *   **C:** "Free will" isn't the right concept for dogs; it only applies to beings who can reason about choices.

  **6. The Chess Master**
  > Deep Blue, a chess computer, calculates millions of moves and selects the objectively best one, beating the world champion. Did Deep Blue *freely choose* its winning move?
  > *   **A:** Yes. It selected the best move based on its programming and calculations.
  > *   **B:** No. It was just following its code; it couldn't have done otherwise.
  > *   **C:** "Choosing" implies conscious deliberation, which a computer lacks. This isn't free will.

  **7. The Unexpected Generosity**
  > Sarah is known for being very frugal and rarely gives to charity. One day, after seeing a particularly moving news story, she spontaneously donates a large sum to a disaster relief fund, surprising everyone (including herself). Her friends debate: was this a truly "free" act?
  > *   **A:** Yes! It was spontaneous and authentic, coming from her genuine feeling.
  > *   **B:** No. It was out of character, caused by an emotional impulse, not her "real self".
  > *   **C:** It was free *because* it was spontaneous and unforced, even if surprising.

  **8. The Blameworthy Success**
  > Marcus ruthlessly steps on others to climb the corporate ladder. He feels no guilt, believing his success is entirely due to his own brilliant choices and hard work. He achieves great wealth and power. Should Marcus be blamed for his harmful actions?
  > *   **A:** Yes, absolutely. He knowingly caused harm to benefit himself.
  > *   **B:** Maybe, but only if he *could* have genuinely chosen to act differently given his personality and beliefs.
  > *   **C:** Blame is pointless. What matters is preventing future harm, maybe by changing his incentives or environment.

  ---

  **Scoring Key & What Your Answers Suggest**

  **Important Notes:**
  *   This quiz focuses on **what work you think "free will" does** (e.g., grounding blame, ensuring authenticity, enabling self-control), not directly on determinism.
  *   Real philosophers hold complex, nuanced views. This is a simplified diagnostic focusing on core intuitions.
  *   **Positions can overlap!** Some answers fit multiple views. Focus on your overall pattern.
  *   **No quiz is perfect:** Views like compatibilism encompass diverse strands (e.g., Frankfurt, Strawson/Dennett, Fischer/Ravizza). This tries to tease apart *why* someone might be drawn to compatibilism.

  **Map Your Answers:**

  1.  **Primarily A's:** You place high value on **Self-Control and Reasons-Responsiveness** (Strawson/Dennett neighborhood). For you, free will is about acting according to your *reasons* and *values*, without external coercion or internal compulsion that bypasses your rational capacities (like Question 4's struggle or Question 2's chip). Blame/Praise (Q1, Q8) depend on whether the person was responsive to reasons. Prediction (Q3) or determinism might not bother you if reasons-responsiveness is preserved. Non-humans (Q5, Q6) likely lack the necessary cognitive machinery.
  2.  **Primarily B's:** You lean towards **Sourcehood or Ultimate Origination**. You think true freedom requires being the *ultimate source* or originator of your actions, not just acting on your desires or reasons. Manipulation (Q2), prediction implying fixed paths (Q3), or strong internal constraints (Q4) undermine freedom because the source isn't truly *you*. Coercion (Q1) is just the most obvious violation. Non-humans (Q5, Q6) definitely lack this capacity. You might be sympathetic to **Libertarianism** or **Hard Incompatibilism**.
  3.  **Primarily C's:** You have a **Deflationary or Pragmatic** view. You're skeptical that "free will" picks out a deep metaphysical property. Instead, you see it as a useful concept for our social practices: assigning responsibility (Q1, Q8) to regulate behavior, understanding what promotes good decisions (Q4, Q7), or distinguishing normal deliberation (Q3) from coercion/manipulation (Q2). You're likely unconcerned with non-humans (Q5, Q6) having free will; it's a human social tool. This aligns with some **Skeptical** or **Pragmatic Compatibilist/Incompatibilist** views focused on practice over metaphysics.
  4.  **Mix of A's and C's:** You likely hold a **Hierarchical/Identification View** (Frankfurt vicinity). Freedom involves acting on desires you *endorse* or identify with as your own (Q2, Q7). Coercion (Q1) and manipulation (Q2) undermine this. Self-control struggles (Q4) show conflict between levels of desire. Blame (Q1, Q8) depends on identification with the motive. Prediction (Q3) might be acceptable if the endorsed desires lead to the predicted choice. Non-humans (Q5, Q6) lack the reflective self-evaluation needed for identification.
  5.  **Strong B's on Manipulation/Prediction (Q2, Q3) but A's/C's elsewhere:** You might be leaning towards **Hard Incompatibilism**. If manipulation (Q2) or implied fixity (Q3) *always* undermines freedom/blameworthiness, regardless of internal harmony or reasons-responsiveness, you likely think no one *truly* has free will or ultimate moral responsibility if determinism (or something like it) is true, even if we act "normally" (Q4, Q7). Coercion (Q1) is just a clearer case. This view sees the Sourcehood concern (B) as fundamental and incompatible with our scientific worldview.

  **The Unoccupied Slot & Blurry Lines:**

  *   **Consistent A's on Non-Humans (Q5, Q6):** This combination (saying computers/dogs freely choose) is rare and doesn't map neatly onto standard positions. It might suggest an extremely **Behaviorist or Minimalist** view where "free choice" just means reliable, complex, goal-directed behavior. Most find this unattractive because it stretches "freedom" too thin, losing the connection to consciousness, deliberation, or moral responsibility that makes the concept interesting for humans.
  *   **Blurry Line: Reasons-Responsiveness (A) vs. Pragmatism (C):** Distinguishing purely pragmatic views (C) from compatibilist views focused on reasons-responsiveness (A) is tricky without jargon. Both might give similar answers on blame (Q1, Q8) and prediction (Q3). The key difference is *why*: Is it *because* the person was responsive to reasons (A), or *because* blame is useful regardless of deep metaphysics (C)? The quiz probes this subtly with manipulation (Q2 - A cares about authenticity of reasons, C might not) and non-humans (Q5, Q6 - C often sees "free will" as exclusively human-social, A sees it as requiring specific cognitive capacities).

  **How to Use This:** Encourage students to see their pattern and then read about the corresponding views (provide brief definitions/names). Emphasize that discovering *why* we care about free will (control, blame, origins, practice) is crucial, often more so than pre-existing opinions about physics. This sets the stage for deeper discussion about what kind of freedom matters for human life.
