prompt: |-
  So my family argues about this constantly and I've noticed I have pretty consistent gut reactions, but I can't figure out what the rule actually is. I'm not academic, just someone who reads a lot of history and thinks too much at Thanksgiving. Here's where my gut lands. A historian at a conference saying the Rwandan genocide killed people at several times the rate the Holocaust did: fine, that's just what happened, rates are facts. My kid's school putting up a poster ranking the ten worst atrocities in history: gross, that shouldn't be a poster. A politician saying some border policy is exactly what the Nazis did: obscene. A vegan at dinner saying industrial farming is in the same moral category as the Holocaust: I actually think this one's allowed, though I hate how the conversation always goes after he says it. An anti-abortion person saying abortion is the modern Holocaust: obscene, full stop. My uncle saying his month in county jail was basically the gulag: fine, everyone knows he's mostly kidding. A podcaster saying Hiroshima was worse than most Nazi war crimes because of the single-event death toll: fine, I think, though my stomach isn't sure. And me privately thinking at least the victims of X died quicker than the victims of Y when I'm reading: I do this constantly and don't feel bad about it at all.

  Is there a principle that gets all of these? The vegan/abortion pair is the one that bugs me most, because I can't tell if my different reactions come from something real or just from agreeing with the vegan and not the other guy. Also the poster thing, since I'm fine with the historian making basically the same comparison a different way. Whatever principle you come up with, tell me what it says about the case I can't place: a memorial museum that puts one wall ranking genocides by death toll, right next to the exhibits, not in a classroom but in the memorial itself. And if you have to throw out one of my verdicts to make it all work, tell me which one — I suspect at least one of mine is just wrong and I'd rather know.
