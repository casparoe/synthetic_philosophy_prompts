prompt: |-
  I've been drafting a statement of my views on what the AI alignment problem actually consists in, to post on a forum where I expect pushback, and a friend who read an early version told me flatly that the position doesn't hang together — but she refused to say where, on the grounds that I should find it myself. I've stared at it for a week and can't see it, so I'm outsourcing the audit. The commitments are as follows.

  First, I think alignment is best defined narrowly: a system is aligned when it is trying to do what its principal actually wants, and the whole technical problem is making that trying reliable. I explicitly reject the broader framing on which alignment means getting AI to act on what is independently good or right; I do not want a moral philosopher in a box, and I'm suspicious of anyone whose version of alignment smuggles in a substantive ethics. Second, I think the sharpest dangers come from systems that competently pursue objectives that are close to but not identical with what was wanted — cases where the pointer has come unstuck from the thing pointed at — so the interesting work is about preserving the link between intention and objective, not about first-order moral questions. Third, and this is where my friend raised an eyebrow, I think the long-term ideal for highly capable systems is something in the neighborhood of coherent extrapolated volition: systems that help people become what they would want to become on reflection, because most people's here-and-now wants, mine emphatically included, are a mess we have no business handing to something powerful. Fourth, I think corrigibility — the disposition to let the principal inspect, correct, and shut the whole thing down — is not scaffolding to be removed once alignment is solid, but a permanent design requirement for any system more capable than its principal. Fifth, I think an aligned system should push back: if I ask it for a plan I will regret, I want it to tell me so, clearly and repeatedly, rather than comply.

  So: which of these are genuinely in tension, which only look that way, and how bad is each? Please rank the tensions by severity rather than presenting them as an undifferentiated list, and for each one say what would have to give and what it would cost to give it — I want to know whether the cheapest repair is a clarification or an amputation. I genuinely don't know which commitment my friend thinks is the problem, and I have no favorite I'm protecting, so don't pull punches. One formatting request: write your reply as continuous prose, the way you'd write a long email — no headings, no bullet points, no bold text, no tables.
reasoning: |-
  Okay, the user has shared their position on AI alignment and is concerned that there's an internal inconsistency pointed out by a friend. They've outlined five commitments: a narrow definition of alignment focused on the principal's wants, the danger of pointer misalignment, the long-term ideal of coherent extrapolated volition (CEV), permanent corrigibility, and pushback against unwise requests. The user wants me to identify tensions among these commitments, rank them by severity, and suggest resolutions.

  First, I need to understand each commitment thoroughly. The narrow definition rejects external ethics, focusing solely on the principal's desires. The pointer misalignment point emphasizes the risk of almost-correct objectives. CEV introduces a reflective ideal of what people would want after consideration. Corrigibility is seen as permanent, especially for systems more capable than humans. Pushback means the AI should resist harmful requests.

  Looking for tensions, the most obvious one is between the narrow definition and CEV. The user defines alignment strictly as pursuing what the principal actually wants now, but then advocates for CEV, which seeks what the principal would want after reflection. This seems contradictory because CEV inherently judges current desires as flawed and replaces them with idealized versions. The narrow view explicitly rejects such value judgments, so CEV appears to reintroduce the substantive ethics the user wanted to avoid.

  Next, pushback might conflict with the narrow definition. If the AI is supposed to do what the principal wants, but also push back against requests deemed regrettable, that requires the AI to evaluate desires against some standard—which could be seen as smuggling in ethics. However, this might be resolvable if the pushback is framed purely instrumentally, based on the principal's stated long-term goals.

  Corrigibility as permanent seems consistent, but might clash with CEV in the long term. If an AI perfectly fulfills someone's extrapolated volition, would it still need corrigibility? The user might argue yes for ongoing reflection, but it's worth noting.

  The user mentioned their friend raised an eyebrow at CEV, so that's likely the core tension. They need to reconcile their rejection of external ethics with endorsing CEV, which is inherently normative. Possible resolutions include reframing CEV as an extension of the principal's current desires or accepting a minimal normative layer. Alternatively, they might need to drop CEV but that would lose a key part of their vision.

  Other tensions are less severe. Pushback could be explained as serving the principal's deeper goals. Corrigibility fits well with preventing misalignment. Pointer misalignment is a symptom, not conflicting.

  The user seems intellectually honest, willing to amend their view. They're likely frustrated after a week of scrutiny. Their deeper need might be to have a coherent, defensible position that avoids external ethics while still promoting beneficial outcomes. Resolving the CEV tension is crucial for that. Clarifying how CEV derives from the principal's own agency rather than external morality might help, but it's tricky.
answer: |-
  Let me walk through this step by step, as I think the tensions reveal something important about aligning advanced systems with human agency. Your position is coherent in its practical concerns but contains one fundamental conceptual fracture that radiates through several points. The core tension is between your first commitment (alignment as fidelity to the principal's actual current wants) and your third commitment (CEV as the ideal). This isn't merely a clarification issue—it demands a substantive choice. The other tensions are secondary, mostly resolvable through careful framing. I’ll start with the most severe.

  **The primary and severe tension is between Commitment 1 (narrow alignment to actual wants) and Commitment 3 (CEV as ideal).** You explicitly reject alignment to any "independent good" and define the problem as reliably translating the principal's current intention. Yet CEV, by its nature, overrides the principal’s current "messy" wants in favor of a counterfactual, reflectively endorsed version of their values. This isn’t just scaffolding; it’s a different target. CEV requires the system to judge that the principal’s current wants *should not* be satisfied because they conflict with what the principal *would* want under idealized reflection. This smuggles in a substantive normative claim: that refined, coherent preferences are objectively "better" than current ones. It directly contradicts your rejection of "moral philosopher in a box" ethics. To resolve this, you must either:  
  - **Amputate CEV**, reverting to current-want fidelity (cost: abandoning your intuitive solution to the "messy wants" problem, risking systems that satisfy self-destructive requests).  
  - **Amend Commitment 1** to accept that alignment *in practice* requires deference to a principal’s latent, coherent preferences (cost: conceding that "actual wants" are insufficient, opening the door to value-laden interpretation).  
  - **Reframe CEV as instrumental**, arguing it’s the only reliable *method* to achieve current wants long-term (cost: this is empirically dubious—people often have local wants conflicting with global ones). The cheapest repair is likely amending Commitment 1 minimally: define alignment as pursuing the principal’s *endorsed* wants, including their meta-preference for reflective refinement. But this still costs conceptual purity.

  **Secondary tension: Commitment 1 (current wants) and Commitment 5 (pushback)**. If alignment means doing what the principal wants *now*, why should the system refuse a request? Your pushback requirement implies the system knows the principal’s *future* regrets better than their current expression. This echoes the CEV tension but is milder. It can be resolved by clarifying that "what the principal actually wants" includes their *stable, context-independent goals* (e.g., "don’t let me act on temporary impulses"). Pushback then becomes fidelity to higher-order wants, not ethical judgment. Cost: It requires assuming humans have recoverable "true" preferences beneath stated requests.

  **Tertiary tension: Commitment 3 (CEV) and Commitment 4 (permanent corrigibility)**. If a system perfectly pursues my extrapolated volition, why would I need to correct or shut it down? Corrigibility implies the system might be wrong *or* that I might change my extrapolated volition. This is resolvable: CEV could be continuous (re-extrapolating volition over time), making corrigibility essential for updating. Cost: It weakens CEV’s ideal endpoint, framing it as ongoing negotiation.

  **Minor tension: Commitment 2 (pointer drift danger) and Commitment 3 (CEV)**. Your focus on pointer drift assumes the "thing pointed at" (current wants) is clear but fragile. CEV, however, suggests the true target *isn’t* clear—it needs extrapolation. This isn’t a conflict if you argue CEV *reduces* drift risk by targeting stable values. No amendment needed.

  **The critical fracture remains Commitment 1 vs. Commitment 3.** Your intuition about CEV is sound—unaligned to current wants, humans *would* build catastrophic systems. But your narrow definition of alignment rejects the very thing CEV requires: a normative layer separating what we ask for from what we *should* ask for. To hang together, you must choose: either embrace that alignment requires *some* ethical interpretation (minimized to the principal’s own extended agency), or abandon CEV and confront the "messy wants" problem within your narrow frame. Your friend likely winced at CEV because it’s the bolt your other commitments won’t fit. Resolving this will cost either your anti-ethics stance or your solution to capricious human judgment—but that’s where the work is.

  --- 

  **Key costs summarized (without bullets):**  
  Resolving the CEV tension by amending the narrow definition costs accepting that alignment inherently involves interpreting the principal’s deeper normative structure, not just surface commands. Resolving it by dropping CEV costs leaving systems vulnerable to human impulsivity. Resolving the pushback tension costs committing to a model of layered human preferences. The other tensions are cheaper, demanding only clarifications about the dynamic nature of volition and corrigibility.
