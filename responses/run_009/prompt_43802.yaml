prompt: |-
  I'm a PhD student in philosophy of science, and I keep running into people (mostly at conferences, and one guy in my department who works on quantum logic) waving around the line from around Quine's Two Dogmas that no statement is immune to revision. Last month someone used it to argue we could in principle revise the law of non-contradiction if the data pushed hard enough, and last week a different person used it to claim mathematics is empirical in just the same sense physics is. Both feel like overreaches but I couldn't say exactly where the one-liner stops doing work for them. Can you lay out the distinct precise theses the slogan could be expressing -- from the weak versions basically everyone accepts to the strong versions hardly anyone should -- and for each one say whether it's plausible and whether it actually supports the use it was put to in those two cases? A list I can keep in my seminar notes would be perfect, and please flag which readings are genuinely contentious versus which are just truism-adjacent. Also, if some readings only go through given the rest of Quine's package (like the confirmation holism or the attack on analyticity), say so, since the people quoting it usually aren't buying all of that.
reasoning: |-
  Okay, let me tackle this query from the philosophy of science PhD student. They're encountering people invoking Quine's "no statement is immune to revision" to justify radical claims—like revising the law of non-contradiction or treating math as empirical. The student wants a clear breakdown of possible interpretations of Quine's slogan, assessing their plausibility and whether they support such extreme uses.

  First, I need to recall Quine's context. His "Two Dogmas of Empiricism" attacks the analytic-synthetic distinction and advocates holism. The revision claim comes from that framework. But conference speakers seem to be stretching it beyond recognition. The student needs analytical tools to push back.

  Hmm, the core task is taxonomy. I should map interpretations from weakest to strongest. Start with uncontroversial readings everyone accepts, then escalate to radical ones Quine might endorse but others reject. Each interpretation must be tested against the two use cases: revising non-contradiction and empirical math.

  Let me brainstorm the spectrum:
  - Weakest: All statements have *some* conceivable context where revision might occur. This is almost trivial.
  - Stronger: No statement is *in principle* unrevisable. This is Quine's actual point, tied to holism.
  - Strongest: All statements are equally empirical/synthetic. This is where the problematic uses live.

  For each, I should note: 
  1. Precise thesis 
  2. Plausibility level 
  3. Dependence on Quine's other ideas (holism, anti-analyticity) 
  4. Whether it supports the two controversial claims

  Ah, and flag contentious points. The student mentioned opponents don't buy Quine's full package, so I'll highlight where the slogan does heavy lifting only with Quinean assumptions. For example, revising non-contradiction requires such extreme holism that even Quine hesitated.

  Also, empirical math? That needs separate treatment. Quine thought math revisable only in extreme scenarios (like simplifying quantum mechanics), not routinely empirical. The speakers are conflating revisability with empirical status.

  I'll structure it as a numbered list for their seminar notes. Start with Definitional Immunity (too weak), then build to Radical Epistemic Symmetry (where the overreaches happen). For each, a quick verdict on the use cases.

  Key insight: The slogan's ambiguity lets people smuggle in strong claims. The student needs to ask: "Which *kind* of revisability are you claiming?" That should expose the overreach.
answer: |-
  Here's a breakdown of interpretations of Quine's "no statement is immune to revision" slogan, ordered from weakest/most plausible to strongest/most contentious. Each includes plausibility assessment, dependence on Quinean theses, and applicability to the two cases you encountered. Keep this in your seminar notes to dissect overreaches:

  ### Key Contextual Notes
  1.  **Source:** The slogan originates in "Two Dogmas of Empiricism" (1951), embedded within Quine's attack on the analytic/synthetic distinction and his advocacy for **confirmation holism** (the unit of empirical significance is the whole web of belief, not individual statements).
  2.  **Quine's Target:** Primarily the idea of *analytic truths* (true solely by meaning, immune to experience) and *a priori knowledge* (justified independently of experience). He argues *everything* is ultimately answerable to sensory experience, though some statements are much more central/entrenched.

  ---

  ### The Spectrum of Interpretations

  1.  **Definitional Immunity Denial (Trivial/Weak)**
      *   **Thesis:** No statement is *logically impossible* to revise *solely because it is stipulated as a definition or meaning-constitutive rule*. Meaning isn't fixed by fiat.
      *   **Plausibility:** High. Widely accepted post-Quine/Kripke. Definitions *can* change ("planet" excluding Pluto).
      *   **Quinean Dependence:** Requires rejection of *strong* analyticity (truth *solely* by meaning/unrevisable by meaning). Doesn't strictly require full holism.
      *   **Supports Revising Non-Contradiction (LNC)?** No. LNC isn't typically justified *just* as a definition.
      *   **Supports Empirical Math?** No. Doesn't imply math is revised *for empirical reasons* or is *like physics*.
      *   **Status:** Truism-adjacent in contemporary philosophy of language/science.

  2.  **Absolute A Priority Rejection (Moderate/Quinean Core)**
      *   **Thesis:** No statement is justified *a priori* in the strong sense of being *immune to empirical disconfirmation in principle*. Any statement *could*, in some conceivable (even wildly implausible) scenario involving recalcitrant experience and holistic adjustments elsewhere, be rejected.
      *   **Plausibility:** Contentious but highly influential. Core Quinean position. Requires **confirmation holism** (disconfirming data challenges a cluster of beliefs; which one(s) you revise is pragmatic). Also requires rejecting analyticity as a *justification* for immunity.
      *   **Quinean Dependence:** **Essential.** Requires both the attack on analyticity *and* confirmation holism.
      *   **Supports Revising LNC?** *In Principle, Barely Yes (Quinean View):* Quine *did* entertain the *logical possibility* of revising logic (including LNC) if it provided massive simplification for physics (e.g., quantum mechanics), though he thought it pragmatically disastrous and deeply entrenched. The slogan *supports the possibility in principle*, not the likelihood or wisdom.
      *   **Supports Empirical Math?** **No (Misapplication):** While Quine argued *parts* of math *could* be revised holistically (e.g., set theory axioms to simplify physics), he **explicitly denied** math is empirical *like physics*. Math is highly central/entrenched. Revisability ≠ Empirical Status. Math isn't *directly tested* against sensory data; its potential revision comes *indirectly* via its role in the best *total scientific theory* facing sensory evidence. Its *epistemic status* is distinct.
      *   **Status:** Contentious but central to 20th-century naturalism. Opposed by neo-Fregeans, Carnapians (in their frameworks), some Kantians.

  3.  **Pragmatic Entrenchment Denial (Strong/Implausible)**
      *   **Thesis:** There are no statements so central to our web of belief that revising them is *always pragmatically irrational or practically impossible* given any conceivable evidence. Entrenchment is contingent, not absolute.
      *   **Plausibility:** Moderate-High (as a *descriptive* claim about how science *could* work). Low (as a *prescriptive* claim that we *should* be equally willing to revise anything). Quine accepted this descriptively but emphasized the *massive* difference in entrenchment.
      *   **Quinean Dependence:** Implied by holism, but Quine himself stressed the *graded* nature of entrenchment.
      *   **Supports Revising LNC?** Yes (descriptively), but overstates Quine. It makes the *possibility* less shocking but ignores Quine's own emphasis on LNC's extreme entrenchment. Doesn't imply it's *likely* or *sensible*.
      *   **Supports Empirical Math?** No. Same as (2). Entrenchment denial ≠ empirical equivalence.
      *   **Status:** Descriptive aspect is widely accepted; prescriptive aspect is dubious and not Quine's main point.

  4.  **Radical Epistemic Symmetry / Universal Empiricism (Strongest/Overreach)**
      *   **Thesis:** All statements (logic, math, physics, "cats exist") have *exactly the same* epistemic status: they are synthetic, empirical, and confirmed/disconfirmed *directly* by experience in fundamentally the same way. There is *no* principled distinction in kind.
      *   **Plausibility:** Very Low. Directly contradicts scientific and mathematical practice. Even Quine **explicitly rejected this**. Physics tests hypotheses *against specific predicted observations*. Logic and math provide the framework *within which* such testing occurs. Their revision would be global, not local.
      *   **Quinean Dependence:** Directly **contradicts Quine**. While rejecting analyticity/holism enables *revisability*, Quine maintained a **hierarchy of revisability** based on entrenchment/pragmatic role. Logic/math are the "center" of the web, observation sentences the "periphery".
      *   **Supports Revising LNC?** **Yes, but misleadingly.** It *implies* revising LNC is no different than revising a physical law, ignoring the catastrophic global consequences Quine acknowledged.
      *   **Supports Empirical Math?** **Yes, but falsely.** This is *precisely* the misinterpretation your second person made. It erases the crucial distinction Quine maintained: math's revisability is *holistic and indirect*, physics' is *directly empirical and test-specific*. Math isn't falsified by a single experiment; its potential revision stems from its role in a failing *total theory*.
      *   **Status:** Extreme overreach. Misrepresents Quine and faces strong counterexamples (e.g., the methodology of testing physics vs. proving theorems).

  ---

  ### Summary Table for Your Notes

  | Interpretation                      | Plausibility      | Quinean Dependence             | Supports Revising LNC?                     | Supports Empirical Math? | Status                     |
  | :---------------------------------- | :---------------- | :----------------------------- | :----------------------------------------- | :----------------------- | :------------------------- |
  | **1. Definitional Immunity Denial** | High (Truism)     | Weak (Only anti-analyticity)   | **No**                                     | **No**                   | Widely Accepted            |
  | **2. Absolute A Priority Rejection** | Contentious (Core) | **Strong (Holism + Anti-Analyticity)** | **Yes (In Principle, Quinean)**          | **No (Misapplication)**  | Quine's Position; Contentious |
  | **3. Pragmatic Entrenchment Denial**| Moderate-High     | Moderate (Holism)              | Yes (But overstates)                       | **No**                   | Descriptive: Accepted; Prescriptive: Dubious |
  | **4. Radical Epistemic Symmetry**   | **Very Low**      | **Contradicts Quine**          | **Yes (Misleadingly)**                     | **Yes (Falsely)**        | **Extreme Overreach**      |

  ---

  ### Addressing Your Cases

  1.  **Revising the Law of Non-Contradiction:**
      *   **Overreach:** The person likely jumped from Interpretation #2 (plausible in principle for Quineans) to acting like it was Interpretation #4 (no different than revising physics). Interpretation #2 supports *logical possibility*, but Quine stressed its extreme impracticality and entrenchment. The slogan alone (#2) doesn't justify *actually considering it seriously* without massive holistic upheaval. #4 is flatly wrong.
      *   **Pushback:** "While Quine grants revisability *in principle* under holism, he emphasized logic's unique centrality. Revising LNC wouldn't be a local empirical adjustment like modifying a physical law; it would require rebuilding our entire conceptual scheme from scratch, which he saw as pragmatically catastrophic. The slogan highlights possibility, not parity."

  2.  **Mathematics is Empirical Like Physics:**
      *   **Overreach:** This is a direct misuse, conflating revisability (#2) with empirical status (#4). The person ignored Quine's crucial distinction: physics statements are *directly* responsive to specific sensory evidence; mathematical statements are revised *only indirectly and holistically* when the *entire scientific theory* incorporating them faces recalcitrant experience *at the periphery* (observation sentences). Math isn't *tested empirically* in the same way or with the same directness.
      *   **Pushback:** "Quine explicitly denied mathematics is empirical in the *same sense* as physics. While parts of math *could* be revised holistically for the sake of total theory simplicity, this is fundamentally different. Physics hypotheses make direct empirical predictions testable by observation. Mathematical truths are not falsified by experiments; their potential revision comes from their role in an overall theory *about* the empirical world that fails. The slogan (#2) supports revisability, not epistemic symmetry (#4)."

  **Key Takeaway:** The slogan's power (and danger) lies in its ambiguity. Weak interpretations (#1, descriptive #3) are uncontroversial but don't support radical conclusions. The core Quinean interpretation (#2) supports *in principle* revisability of logic/math *within holism*, but emphatically **not** that they are empirical like physics or that revision is pragmatic. Strong interpretations (#4) are misreadings that ignore Quine's hierarchy of revisability and are philosophically untenable. Always ask: "*What kind of revisability, and with what epistemic consequences?*" The one-liner stops doing work when it's used to imply symmetry or direct empirical status.
