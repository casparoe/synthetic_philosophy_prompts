  ### Diagnostic Quiz: Determinism and Predictability

  **Instructions:** For each scenario, select the option that best matches your intuition. Answer based on your current understanding without overthinking. There are no trick questions.

  1. **Coin Flip**  
     We flip a fair coin with a complete physical model (equations for forces, air resistance, surface, etc.) and exact initial conditions. We run a simulation with the same model and initial conditions. What happens?  
     a) The simulation predicts the actual outcome (heads/tails) correctly.  
     b) The simulation might not match the actual outcome due to inherent randomness.  

  2. **Double Pendulum**  
     A double pendulum’s initial angle is measured to 100 decimal places. We simulate its motion with these exact initial conditions and known equations. After a while, the real pendulum and simulation diverge. Why?  
     a) The measurement, despite its precision, is still inexact, and the system is chaotic.  
     b) The system has inherent randomness not captured by deterministic equations.  

  3. **Weather Forecast Feedback**  
     A seasonal weather forecast predicts drought. Farmers plant drought-resistant crops, altering land cover and rainfall patterns. The actual weather diverges from the forecast. What explains this?  
     a) The forecast changed the initial conditions (human choices), making its prediction self-defeating.  
     b) Long-term weather is inherently unpredictable.  

  4. **Two-Slit Experiment**  
     Electrons are fired one at a time through a precisely specified two-slit apparatus. We simulate one electron’s path with the exact initial state and physical laws. What does the simulation show?  
     a) The simulation outputs a specific detector spot that matches the actual electron’s impact location.  
     b) The simulation outputs a spot, but the actual electron may land elsewhere due to randomness.  

  5. **Self-Predicting Machine**  
     A machine is programmed to output a complete description of its own internal state 10 minutes from now. When asked, what happens?  
     a) It outputs a state description that matches its state 10 minutes later.  
     b) It crashes, errors out, or outputs an incorrect description.  

  6. **Newtonian Universe**  
     In a universe with only two point masses under Newtonian gravity, an external predictor knows the exact initial state and laws. What can it do?  
     a) Calculate the exact future state at any arbitrary time.  
     b) Calculate the future only up to a limited time due to instability or resource limits.  

  7. **Cellular Automaton Predictor**  
     In a deterministic cellular automaton (e.g., Game of Life), a subsystem ("predictor") is designed to compute and output the entire grid’s future state. The predictor is part of the grid. What happens?  
     a) The predictor outputs the correct future state at the specified time.  
     b) The predictor fails, outputs incorrectly, or its output alters the grid and falsifies itself.  

  8. **Quantum Measurement**  
     An electron is in a superposition of spin-up and spin-down. An observer (embedded in the system) measures it. A deterministic quantum simulation (e.g., Bohmian or Everettian) models the entire system. What does it predict?  
     a) The simulation shows the observer measuring a definite outcome (up or down), and we can know which one in advance.  
     b) The simulation shows both outcomes occurring (e.g., in branches) or the outcome is inaccessible to us.  

