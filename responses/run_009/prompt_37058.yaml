  We are creating a diagnostic quiz with eight concrete cases. The cases must include the five specified, plus three more of our choosing. Then we will map patterns of answers to several positions.

  Specified cases:
  1. A coin flip whose entire physical situation is modelled by equations we completely understand.
  2. A double pendulum whose initial angle is measured to a hundred decimal places and whose trajectory nevertheless diverges from the simulation after a while.
  3. A seasonal weather forecast that, once published, changes what farmers plant and hence changes the weather it was predicting.
  4. A two-slit experiment run one electron at a time, with every element of the apparatus specified.
  5. A hypothetical predicting machine that is asked to output a complete description of its own state ten minutes hence.

  We must choose three more. Let's pick:

  6. A Newtonian universe with two point masses (no external forces) and an ideal predictor that knows the exact initial state and the laws. (To test Laplaceanism in a simple setting.)
  7. A deterministic cellular automaton (like Conway's Game of Life) in which a pattern is set up to build a predictor that attempts to predict the entire future of its own grid.
  8. A quantum system in which an observer is about to measure the spin of an electron in a superposition state, and the observer is part of the system.

  Now, we design eight questions. Each question has two or three options. We phrase them so that the member doesn't know what position their answer supports.

  Question 1: Coin flip
    Scenario: We flip a fair coin, and we have a complete and accurate model of the entire physical situation (including every force, air resistance, the surface, etc.) and the equations governing the motion. We run a simulation with the exact initial conditions and the exact same equations. What will be the outcome of the simulation?
    a) The simulation will always predict the actual outcome (heads or tails) correctly.
    b) The simulation might not match the actual outcome due to inherent randomness in the flip.

  Question 2: Double pendulum
    Scenario: We set up a double pendulum and measure the initial angle to 100 decimal places. We run a simulation using the exact same initial conditions and the known equations of motion. After a while, the actual pendulum and the simulation diverge. Why?
    a) Because our measurement, even to 100 decimal places, is still not exact and the system is chaotic.
    b) Because the physical system has inherent randomness that is not captured by the deterministic equations.

  Question 3: Weather forecast affecting weather
    Scenario: A meteorologist publishes a highly accurate long-term seasonal weather forecast. Farmers read the forecast and plant different crops than they otherwise would have, which changes the weather patterns (e.g., due to changes in albedo or transpiration). Consequently, the actual weather ends up being different from the forecast. What went wrong?
    a) The forecast was accurate for the initial conditions, but the act of publishing the forecast changed the initial conditions (by changing human behavior) so that the prediction became self-defeating.
    b) The forecast was never possible to begin with because long-term weather is inherently unpredictable.

  Question 4: Two-slit experiment
    Scenario: We set up a two-slit experiment with electrons, one electron at a time. Every detail of the apparatus is specified and known, including the source, the slits, and the detector. We run a simulation with the exact same setup. What will the simulation show for the pattern on the detector?
    a) The simulation will show the same interference pattern as the actual experiment.
    b) The simulation might show an interference pattern, but it cannot predict the exact spot where each individual electron hits.

  Question 5: Predicting machine
    Scenario: We build a machine that is designed to predict the future. We ask the machine: "What will be your complete internal state 10 minutes from now?" The machine is programmed to output a complete description of its future state. What happens?
    a) The machine outputs a description that, 10 minutes later, exactly matches its state at that time.
    b) The machine either crashes, outputs an error, or outputs an incorrect description.

  Question 6: Newtonian universe
    Scenario: In a universe with only two point masses moving under Newtonian gravity (no external forces), an ideal predictor knows the exact positions and momenta of both masses at a given time and the laws of motion. The predictor uses this to calculate the state at any future time. What is the outcome?
    a) The predictor can calculate the exact future state at any time.
    b) The predictor can calculate the future state only for a limited time because of computational limitations or because the system becomes unstable.

  Question 7: Cellular automaton predictor
    Scenario: In a deterministic cellular automaton (like Conway's Game of Life), we set up a pattern that includes a "predictor" — a subsystem that is designed to compute and output the future state of the entire grid. The predictor is part of the grid and runs within the automaton. What happens when we let the automaton run?
    a) The predictor outputs the correct future state of the entire grid at some future time step.
    b) The predictor either fails to output anything, outputs an incorrect state, or the act of outputting changes the grid so that the prediction becomes false.

  Question 8: Quantum measurement with embedded observer
    Scenario: In a quantum system, an electron is prepared in a superposition of spin-up and spin-down. An observer (who is part of the system) is about to measure the spin. We run a simulation of the entire system (including the observer) using a deterministic interpretation (e.g., Bohmian mechanics or Everettian). What does the simulation predict for the observer's measurement record?
    a) The simulation shows that the observer will measure either spin-up or spin-down, but we cannot predict which one in advance.
    b) The simulation shows that the observer measures both outcomes (in different branches, if Everettian) or a definite outcome (if Bohmian) but the specific outcome is determined by hidden variables not accessible to the observer.

  Now, we design a scoring key that maps answers to positions.

  First, we set out the underlying questions that carve up the logical space:

  Q1. Are the fundamental laws deterministic? (Determinism)
  Q2. If the laws are deterministic, does determinism guarantee predictability for an ideal external agent? (Laplacean predictability)
  Q3. Does the embedding of the predictor in the world (as a physical system) prevent it from making certain predictions (e.g., about its own future)? (Embeddedness barrier)
  Q4. Is there a principled barrier to prediction due to finite precision of measurements? (Measurement barrier)
  Q5. Is there inherent randomness in the laws? (Indeterminism)

  We can break down the positions by their answers to these questions.

  Now, the positions we need to cover:

  1. Full-blooded Laplaceanism: Deterministic laws, and an ideal external agent could predict everything. Chaos is only a practical barrier (due to finite precision or computational limits) but not principled.

  2. Finite measurement precision as a principled barrier: Deterministic laws, but even with full knowledge of the laws, finite measurement precision (which is unavoidable) makes prediction open-ended.

  3. Computational irreducibility (Wolfram): Deterministic laws, but the system is computationally irreducible so that the only way to know the future state is to run the system (live through it).

  4. Popper's position (against historicism): Deterministic laws, but a predictor embedded in the world cannot predict the future growth of its own knowledge because the prediction itself would alter the course of events.

  5. Copenhagen-style indeterminism: The laws are not deterministic; there is inherent randomness.

  6. A deterministic interpretation of QM (Bohmian or Everettian): The laws are deterministic, but agents inside the system cannot predict their own measurement records because of either hidden variables (Bohm) or branching (Everett).

  7. Epistemic-sceptical: We cannot establish determinism from inside the world (so determinism might be true or false, but we cannot know).

