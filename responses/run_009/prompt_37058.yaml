  ### Scoring Key  
  **How to use:** Tally your answers. The key maps response patterns to positions. Positions are defined by underlying philosophical questions:  
  - **Q1:** Are the fundamental laws deterministic?  
  - **Q2:** If deterministic, does determinism guarantee predictability for an ideal *external* agent?  
  - **Q3:** Does embedding a predictor *in the world* create barriers to prediction?  
  - **Q4:** Is finite measurement precision a *principled* (not just practical) barrier?  
  - **Q5:** Is computational irreducibility a barrier?  
  - **Q6:** Is inherent randomness present?  

  Positions are located in this space. Some answer combinations are unattested (no standard position) or incoherent. Ambiguous separations are flagged.  

  #### Answer Patterns and Positions  
  - **Full-blooded Laplaceanism**  
    - **Answers:** 1a, 2a, 3a, 4a, 5a, 6a, 7a, 8a  
    - **Logical space:** Laws deterministic (Q1: yes). Determinism guarantees predictability for an ideal *external* agent (Q2: yes). Embedding is irrelevant (Q3: no). Barriers (measurement, computation) are merely practical.  
    - **Notes:** Believes chaos, quantum phenomena, or self-reference are solvable with perfect data and computation. Rare for Q5–Q7 (rejects embedded barriers).  

  - **Finite Measurement as Principled Barrier**  
    - **Answers:** 1a, 2a, 3a/b, 4a, 5b, 6a, 7b, 8a/b  
    - **Logical space:** Laws deterministic (Q1: yes). Predictability fails *in principle* due to finite measurement precision (Q4: yes), even with perfect laws. Embedding may compound issues (Q3: sometimes).  
    - **Notes:** Distinguished from Laplaceanism by Q4. Accepts Q2 (determinism implies external predictability) but denies it applies to real agents.  

  - **Computational Irreducibility (Wolfram-esque)**  
    - **Answers:** 1a, 2a, 3a, 4a, 5b, 6b, 7b, 8b  
    - **Logical space:** Laws deterministic (Q1: yes). Predictability requires "living through" the computation (Q5: yes). Embedding irrelevant (Q3: no) but systems cannot self-predict.  
    - **Notes:** Q6b and Q7b signal that even simple systems (like Newtonian gravity) are irreducible if computation is costly. Contrasts with Laplaceanism on Q6 and embedded cases.  

  - **Popperian Embedded Barrier**  
    - **Answers:** 1a, 2a, 3a, 4a, 5b, 6a, 7b, 8a  
    - **Logical space:** Laws deterministic (Q1: yes). Predictability fails for *embedded* agents due to self-referential feedback (Q3: yes). External predictability possible (Q2: yes).  
    - **Notes:** Defined by Q3 and embedded failures (Q3a, Q5b, Q7b). Contrasts with computational irreducibility on Q6 (external prediction works).  

  - **Copenhagen-Style Indeterminism**  
    - **Answers:** 1b, 2b, 3b, 4b, 5b, 6a, 7a/b, 8b  
    - **Logical space:** Laws indeterministic (Q1: no; Q6: yes). Inherent randomness blocks prediction regardless of data or computation.  
    - **Notes:** Look for randomness in Q1b, Q2b, Q4b. Q6a is acceptable (Newtonian physics is deterministic, but quantum isn’t).  

  - **Bohmian Determinism**  
    - **Answers:** 1a, 2a, 3a, 4a, 5b, 6a, 7b, 8a  
    - **Logical space:** Laws deterministic (Q1: yes). External prediction possible (Q2: yes). Embedded agents cannot predict due to hidden variables (Q3: yes for self-prediction).  
    - **Notes:** Identical to Popperian on most answers. Separated by emphasis: hidden variables (not feedback) block self-knowledge.  

  - **Everettian (Many-Worlds) Determinism**  
    - **Answers:** 1a, 2a, 3a, 4b, 5b, 6a, 7b, 8b  
    - **Logical space:** Laws deterministic (Q1: yes). Predictability fails for embedded agents as outcomes branch (Q3: yes).  
    - **Notes:** Q4b and Q8b key: simulation shows all outcomes, but agents experience one branch unpredictably. Contrasts with Bohmian on Q4 and Q8.  

  - **Epistemic Scepticism**  
    - **Answers:** 1b, 2a/b, 3b, 4b, 5b, 6b, 7b, 8b  
    - **Logical space:** Determinism’s truth is unknowable from inside the world. Barriers (measurement, computation, embedding) prevent verification.  
    - **Notes:** Favors (b) on unpredictable cases (Q1, Q3, Q4, Q6) but may accept deterministic answers when unambiguous (e.g., Q2a).  

  #### Untested Combinations & Ambiguities  
  - **Incoherent:**  
    - Q1a + Q4b + Q6b + Q7a: Claims determinism but denies predictability in simple Newtonian systems. Contradicts determinism’s definition.  
  - **Unattested:**  
    - Q1a + Q2a + Q3a + Q5a + Q7a: Assumes embedded self-prediction always works. No major position holds this.  
  - **Ambiguous Separations:**  
    - **Bohmian vs. Popperian:** Identical answer patterns (1a,2a,3a,4a,5b,6a,7b,8a). Bohmians attribute failure to hidden variables; Popperians to feedback. The quiz cannot distinguish—further debate needed.  
    - **Everettian vs. Copenhagen on Q8:** Both answer 8b, but for different reasons (branching vs. randomness). Use Q1/Q4 to separate (Everettian: 1a,4b; Copenhagen: 1b,4b).  
    - **Laplaceanism vs. Measurement Barrier on Q2:** Both answer 2a, but Measurement Barrier adds Q4 as principled. If you answered 2a and *reject* embedded barriers (Q5a, Q7a), you lean Laplacean.  

