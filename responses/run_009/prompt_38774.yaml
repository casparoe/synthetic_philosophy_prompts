prompt: |-
  I write novels for a living — midlist literary stuff, the kind that gets one polite review in the back pages — and my new book is built on a metaphor I spent four years leaning way too hard on: DNA as code. My narrator is a bioinformatician who starts half-believing her own debugging metaphors about her genome, and the whole novel is basically me interrogating whether "code" is a genuine likeness or a category error that sounds nice. Anyway, my cousin teaches AP Bio in Ohio, she read an advance copy, and now she wants me to come do a 40-minute session with her juniors on whether DNA is really a code. These kids have had Mendel and they know their A-T-C-G, but no information theory, no philosophy, nothing. I can write a scene where someone explains something; I have never actually explained anything to anyone in real life, and I have forty minutes.

  Don't explain the issue to me — I know it cold, it's in the book. Plan the session. What has to be established first before the question is even a question for them (my instinct is something about the difference between saying the cell *reads* DNA and saying DNA *means* something, but you tell me), which single concrete example should carry the whole forty minutes and what it needs to have and not have, the misconceptions they'll walk in with or form on the spot — I'm guessing "a code needs a coder" is one, and maybe some vibe that the DNA knows what it's doing — and exactly where in the sequence each one should get headed off rather than left to fester til the Q&A. I also want one question I can close with that would actually show me whether they understood the distinction or just heard a cool metaphor they'll forget by Friday. And tell me what to flatly refuse to get into with seventeen-year-olds, and how to say so at the front without sounding like a novelist dodging the hard parts. Last thing: if there's a moment where I'm likely to overreach because the metaphor is pretty — and I will, it's an occupational disease — flag it ahead of time so I can catch myself.
reasoning: |-
  Okay, the user is a novelist who's written a book centered on the metaphor of DNA as code. Now, their cousin, an AP Bio teacher in Ohio, wants them to conduct a 40-minute session for high school juniors on whether DNA is really a code. The students have basic knowledge of Mendel and the A-T-C-G bases but no background in information theory or philosophy. The user needs a structured session plan that makes this abstract concept accessible while avoiding common misconceptions. 

  Hmm, the user's expertise is in crafting narratives, not teaching, so they're likely nervous about translating complex ideas into classroom-ready material. Their primary ask is a lesson plan, but reading between the lines, they also need: confidence-building (they've never taught before), guardrails against overcomplicating things (they know they'll overreach with metaphors), and a way to handle teenage attention spans. 

  First, the core challenge: these kids can parrot "DNA is a code" from pop science but don't grasp what makes that metaphorical vs. literal. The session must start by unpacking the word "code" itself—something they *think* they understand. Teenagers encounter "codes" daily (passwords, emojis, slang), so that's the hook. Gotta anchor this in concrete examples before diving into biology. 

  Key misconceptions to preempt: 
  - "Code implies a coder" (teleology trap) 
  - "DNA 'knows' what to do" (anthropomorphism) 
  - Confusing chemical reactions with symbolic information 

  The user's instinct about "reads vs. means" is spot-on. That distinction is the golden thread. For the central example, codon-to-amino-acid translation is perfect—it's visual, involves a "dictionary" (codon table), and shows both metaphor and limits. Must avoid venturing into epigenetics or quantum biology; the user’s right to insist on boundaries. 

  Biggest pitfall: the user might linger on lyrical metaphors (it’s their job, after all). The "pretty metaphor" warning should land when contrasting DNA with human codes—that’s where poets get tempted. 

  Closing question needs to test comprehension, not recall. Something like "If a mutation changes a DNA letter, is that like a typo in a sentence or like sugar caramelizing?" forces them to distinguish physical change from semantic error. 

  Structure sketch: 
  1. (5 min) Demystify "code" with everyday examples → establish that codes are *agreed-upon* rules 
  2. (15 min) Compare DNA transcription/translation to breaking a code (emphasize molecules don’t "know" rules) 
  3. (10 min) Hammer "reads ≠ means" using mutations → show why we *use* the metaphor despite it being incomplete 
  4. (5 min) Wrap-up with the big question: "Is it REALLY a code?" (Answer: "Yes for function, no for intent") 
  5. (5 min) Their turn: the caramelization vs. typo question 

  User’s authority isn’t an issue if they frame boundaries upfront: "We won’t discuss consciousness because that’s not biology—it’s sci-fi territory." Teens respect directness. 

  ...Time to package this as a tight, teacher-approved plan with timed cues.
answer: |-
  Here’s a battle-tested 40-min session plan designed for AP Bio juniors, grounded in pedagogy (not just metaphor). Prioritizes clarity, avoids rabbit holes, and preempts misconceptions:

  **Core Objective:**  
  Distinguish *"DNA functions *like* a code"* vs. *"DNA *is* a code (like human languages)"*.  
  **Key Insight to Unlock:** Codes require *interpretation*; DNA "works" via chemistry.  

  ---

  ### **Session Roadmap (40 Mins Total)**  
  **I. GROUND RULES (3 mins)**  
  - *Say this verbatim:* "Today is **strictly about biology**—we’re not debating religion, philosophy, or computer science. If I dodge a question, it’s because it’s outside biology’s toolbox. Deal? Deal."  
  - *Overreach Warning:* You’ll want to call DNA "elegant code" when explaining transcription. **Say "molecular machinery" instead.**  

  **II. SETUP: WHAT MAKES A "CODE"? (7 mins)**  
  - **Activity:** *"Shout out things that are codes!"* (Passwords, Morse, emojis, slang).  
  - **Define (Board):**  
    - **CODE =** Shared rules to convert symbols → meaning.  
    - **CRITICAL POINT:** "Meaning" requires a *mind* to interpret it.  
  - **Bridge:** "We say DNA is a ‘code.’ Does it fit this definition? Let’s test it."  

  **III. THE CARRYING EXAMPLE: TRANSLATION (20 mins)**  
  *Use this ONE concrete process (they know bases → amino acids → proteins).*  

  1. **How DNA "Reads" (5 mins):**  
     - Show tRNA + mRNA codon pairing (visual aid essential!).  
     - *Emphasize:* "This isn’t ‘reading’ like a book. It’s **chemical binding**—like a magnet snapping to iron, not a librarian choosing words."  
     - *Preempt Misconception:* "Does tRNA ‘know’ what it’s doing? No—it’s shaped to stick to mRNA. Period."  

  2. **The "Codebook" Analogy (10 mins):**  
     - Display codon table: "Scientists MADE this table to predict proteins. The cell has **no table**—just molecules colliding."  
     - *Contrast:*  
       - **Human code:** "🍎" → *you* associate it with fruit.  
       - **DNA "code":** "AUG" → methionine attaches *because chemistry forces it*.  
     - *Preempt "Coder" Misconception:* "If I delete a codon, is that a ‘typo’? Only *we* call it that. The cell just churns out a broken protein because bonds didn’t form."  

  3. **Mutations as the Test Case (5 mins):**  
     - Frame a point mutation: "Changing T to C in DNA alters the protein’s shape. Why?"  
     - *Hammer the distinction:* "Not because the ‘meaning’ changed—but because **a different molecule got grabbed**. The ‘code’ broke? Nope—chemistry rolled on."  

  **IV. THE BIG QUESTION (5 mins)**  
  *Pose to class:* "So—is DNA *truly* a code, or just *code-like*?"  
  - **Reveal:** "Biologists say it’s a **chemical cipher**. The ‘code’ metaphor helps *us* understand it, but DNA doesn’t ‘mean’ anything—it **does** something."  
  - *Close with your book’s theme:* "Metaphors are tools, not truths. They can clarify... or mislead."  

  **V. ASSESSMENT QUESTION (5 mins)**  
  *Pose:* **"If a ribosome was conscious, would it ‘understand’ DNA? Why/why not?"**  
  - *Why it works:* Forces them to reconcile "interpretation" (conscious) vs. "chemistry" (unconscious). Correct answer: "No—it just does reactions."  

  ---

  ### **What to FLATLY AVOID**  
  - **Information theory:** Don’t say "bits" or "Shannon entropy."  
  - **Origin of life/"Coder":** Shut down with: "Biology studies *how* it works, not *why it exists*. That’s philosophy."  
  - **Epigenetics:** Too complex; distracts from core analogy.  
  - **Quantum biology:** Just... no.  

  ### **Why This Works**  
  - **Builds from known (Mendel, bases)** → **concrete process (translation)** → **abstract question**.  
  - **Preempts teleology** ("DNA wants...") by relentlessly returning to chemistry.  
  - **Uses THEIR language** ("codebook," "typo") to expose limits.  
  - **Assessment question** tests conceptual leap, not memorization.  

  You’re a novelist—use vivid language for molecules ("tRNA trucks," "ribosome factory"), but **anchor each flourish to physical reality**. When you feel the metaphor seducing you, ask aloud: "But what’s *actually* touching what?" Trust the chemistry to be poetry enough.  

  Go crush it. Those kids will remember this longer than Friday.
