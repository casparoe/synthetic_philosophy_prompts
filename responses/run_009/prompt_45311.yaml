prompt: |-
  I am the clinical ethics consultant at a mid-sized hospital, and our ethics committee keeps getting referred the same kind of case: a written advance directive that stands in some tension with what the patient, now cognitively impaired, says or does in the present — and we have no settled procedure that tells the attending team what to do next. The disagreements are currently resolved by whoever in the room is most forceful, which is worse than either of the outcomes being fought over. The committee has asked me to draft a decision procedure they can actually run in a conference room in under an hour, and I want it grounded in the philosophical debate about whether and why an earlier self has authority over a later one — not just in hospital custom.

  As its first move, the procedure should distinguish between two readings of a directive that our ad hoc discussions blur together: the directive as an exercise of authority (the earlier self issuing binding instructions, Ulysses ordering himself bound to the mast) and the directive as evidence (a fallible record of what this person valued, defeasible by fresher evidence). Behind that distinction sit the questions we keep circling: Dworkin's contrast between critical interests in the shape of a life as a whole and experiential interests in present satisfaction, and which of them the directive protects; the objection that the person in the bed now has interests of her own that the earlier self cannot claim to speak for merely by having once been the same person; and the countervailing worry that if the earlier self binds the later one too tightly, we treat the patient as a means to the closure of a biography she no longer knows she has.

  What I need:

  1. A stepwise procedure: the questions to ask in order, what counts as a sufficient answer to each, and, at every step, which of four doors the answer opens — follow the directive, follow the present patient, hand the decision to the surrogate, or declare the question one of values that the committee must decide and cannot derive. It must contain a diagnostic step for whether the directive is about the intervention it names or the condition it feared: a clause refusing a feeding tube, written by someone who chiefly dreaded being a burden on her children, may or may not apply to a patient who is untroubled, unbothered, and happily unaware of being a burden, and our teams cannot currently tell which reading to use.

  2. A rule for the hardest class of conflict: directives written many years earlier, by a person now substantially different in values and temperament. One committee member proposes a decay rule — the directive loses authority in proportion to documented change in the person's character — and I want the procedure to adopt it, reject it, or replace it with something workable, with reasons a non-philosopher can follow.

  3. Worked applications to three cases, at least one of which must end somewhere I won't like:

  (a) Mrs. A, moderate dementia, wrote a directive eight years ago refusing artificial nutrition should she become unable to recognize her family. She now fails to recognize them on most days but not all, is cheerful, eats willingly when food is offered by hand, and has begun saying that she wants to keep going, at moments the nurses dispute are lucid. Her daughter wants the directive honored the moment swallowing fails; her son points at the cheerfulness and the phrase about recognizing family, arguing it was a proxy for something else.

  (b) Mr. B, a retired professor, severe dementia, untroubled and affable. His directive says no heroics, nothing that prolongs the dying. He develops a treatable infection; antibiotics would likely restore him to his current pleasant state, which is not a state he would recognize as his life's work but is a state he enjoys. He cannot discuss it. The family splits between reading the directive as his final judgment on his life as a whole and reading it as a fear of intensive care that this scenario never touches.

  (c) The case I am hoping the procedure never reaches but suspect it will: a patient who, while competent, wrote into his directive an instruction that it be honored even against his own later objections, and who now, moderately impaired and distraught, is asking that everything be done. The procedure must say whether an earlier self can pre-commit against its own future voice, and where, if anywhere, that stops being autonomy and becomes the past person wielding the present one.

  4. A closing statement of the procedure's limits: the kinds of cases it should refuse to settle, and the points at which it must openly hand the decision to the human beings in the room, marked as judgment rather than dressed up as the output of the steps.

  Constraints: the procedure must be usable by committee members with no philosophical training; every philosophical term it employs must be explained in a single line the first time it appears; and it should not lean on any statute, case, or jurisdiction, since its job is to structure deliberation, not replace the lawyers.
reasoning: |-
  Hmm, the user is a clinical ethics consultant at a mid-sized hospital who needs help creating a practical decision procedure for resolving conflicts between advance directives and current patient expressions. This is a complex ethical challenge with real-world implications.

  The core tension revolves around philosophical questions about personal identity over time - whether the past competent self should control the current impaired self. The user specifically wants to distinguish between directives as binding authority versus fallible evidence, and addresses key thinkers like Dworkin on critical vs experiential interests.

  I need to create a stepwise procedure that's practical enough for an ethics committee to use in under an hour. It must include:
  - Clear diagnostic steps to interpret directives (intervention-focused vs fear-focused)
  - A position on how personality changes affect directive validity
  - Three worked examples including one with an unhappy outcome
  - Explicit acknowledgment of its own limitations

  The user mentioned several philosophical concepts that need simple explanations: Ulysses contracts, critical interests, experiential interests, and the decay rule proposal. The procedure should avoid legal references and remain jurisdiction-agnostic.

  For the decay rule dilemma, I'm considering a modified approach: significant documented personality change should trigger reevaluation but not automatically invalidate directives. We need to assess whether the change impacts the specific values underlying the directive.

  The three cases present classic dilemmas:
  1) Mrs. A shows the ambiguity between literal directive interpretation and proxy indicators
  2) Mr. B illustrates the tension between critical life-shape interests and current experiential well-being
  3) The hypothetical "Ulysses override" case tests the limits of pre-commitment

  The procedure should have clear exit points where ethical judgment must prevail over algorithmic decisions. I'll include a "values judgment required" option at key steps, acknowledging when the process can't resolve the conflict mechanically.

  For usability, I'll organize it as a flowchart-like sequence with simple questions, thresholds for moving between paths, and plain-language explanations of philosophical terms when first introduced. The worked examples will demonstrate how to apply the steps while showing that sometimes the outcome may be ethically uncomfortable.
answer: |-
  Here is a step-by-step decision procedure grounded in the requested philosophical distinctions, designed for committee use within one hour. It incorporates the decay concept as a trigger for deeper analysis rather than a simple rule.

  **Core Philosophical Terms (First Use Explanations):**
  *   **Ulysses Contract:** A binding instruction from your past competent self to constrain your future impaired self (like Ulysses tied to the mast).
  *   **Critical Interests:** Deep values about the overall shape and dignity of your whole life story (e.g., "I don't want to live demented").
  *   **Experiential Interests:** Preferences based on current feelings and comfort (e.g., "This ice cream tastes good now").
  *   **Personality Decay:** Significant, documented change in core values or character between when the directive was written and now.

  **The Advance Directive Interpretation Procedure (ADIP)**

  **Step 1: Directive Clarity & Scope**
  *   *Question:* Is the directive's instruction regarding the specific medical intervention (e.g., "no feeding tube," "no CPR") clear and unambiguous *in this specific clinical situation*?
      *   *Sufficient "Yes" Answer:* The intervention requested/refused matches the current scenario precisely. *Door:* **Proceed to Step 2.**
      *   *Sufficient "No" Answer:* The language is vague, ambiguous, or the current situation isn't explicitly covered. *Door:* **Proceed to Step 3.**
      *   *Diagnostic Sub-Step (If "No"):* **Intervention Focused vs. Feared Condition Focused:** Was the directive primarily motivated by a desire to avoid a specific *intervention* (e.g., "I never want a machine breathing for me") or a specific *state of being* (e.g., "I don't want to live if I can't recognize my family")?
          *   *Intervention Focused:* Directive applies literally to the intervention named. *Door:* **Proceed to Step 2.**
          *   *Feared Condition Focused:* Directive applies if the feared condition *substantially exists now*. Assess if the *current state* matches the feared condition's *core meaning*. *Door:* **Proceed to Step 2.**

  **Step 2: Current Patient Expression & Capacity**
  *   *Question:* Does the patient, in their current state, express a consistent, voluntary preference *regarding the specific intervention or the feared condition* relevant to the directive?
      *   *Sufficient "Yes, Consistent with Directive" Answer:* Patient clearly wants what the directive says (e.g., refuses tube feeding when offered). *Door:* **FOLLOW THE DIRECTIVE (and patient's current wish).**
      *   *Sufficient "Yes, Contradicts Directive" Answer:* Patient clearly expresses a wish opposite the directive *and* demonstrates minimal, stable capacity for *this specific choice* (e.g., reliably indicates "yes" when asked if they want food/medicine to live). *Door:* **Proceed to Step 4.**
      *   *Sufficient "No Reliable Expression" Answer:* Patient cannot communicate or expresses inconsistent/incapacitated wishes. *Door:* **Proceed to Step 5.**

  **Step 3: Motivation & Values Evidence (If Step 1 = "No")**
  *   *Question:* Based on the directive text, discussions with proxy/surrogate, or known history, what was the *primary value or fear* motivating the directive instruction? (e.g., fear of being a burden, desire to avoid prolonged dying, wish to avoid specific suffering).
  *   *Sufficient Answer:* A clear, specific value/fear is identified. *Door:* **Proceed to Step 4.**
  *   *Insufficient Answer:* Motivating value/fear remains unclear or highly speculative. *Door:* **HAND TO SURROGATE (Standard Substituted Judgment/Best Interests applies).**

  **Step 4: Conflict Resolution - Directive vs. Current Self**
  *   *Questions:*
      1.  **Nature of Directive:** Was the directive intended primarily as a **Ulysses Contract** (binding future self) or as **Evidence** (strong indicator of values, but defeasible)?
          *   *Ulysses Clues:* Explicit language about binding future self, references to specific feared incompetence states linked to values, history of strong commitment to self-determination/pre-commitment.
          *   *Evidence Clues:* General statements about not wanting burdens, fear of specific interventions without linking to deep values.
      2.  **Personality Decay Trigger:** Is there documented, significant **Personality Decay** (e.g., radical shift in core values, religious beliefs, temperament from known history) *relevant to the motivating value/fear in the directive*?
      3.  **Critical vs. Experiential:** Does honoring the directive primarily serve the patient's past **Critical Interests** (life narrative, dignity) or conflict with their current **Experiential Interests** (present comfort/satisfaction)? Does overriding it primarily serve current **Experiential Interests** or violate past **Critical Interests**?
  *   *Decision Matrix:*
      *   **Strong Ulysses + No Relevant Decay + Serves Critical Interests:** *Door:* **FOLLOW THE DIRECTIVE.** (Past self's authority upheld for life narrative).
      *   **Evidence Directive + Significant Relevant Decay + Overriding Serves Current Experiential Interests w/o Violating Core Past Dignity:** *Door:* **FOLLOW PRESENT PATIENT (if capable) or HAND TO SURROGATE (if not).** (Present self/experiential interests prioritized; directive weakened by change & nature).
      *   **Ambiguous Nature/Decay OR Conflict Between Critical & Experiential Interests:** *Door:* **VALUES JUDGMENT REQUIRED (Committee must decide the weight).**
      *   **Strong Ulysses BUT Significant Relevant Decay:** *Door:* **VALUES JUDGMENT REQUIRED (Committee must decide if the "self" bound is still meaningfully present).**

  **Step 5: Surrogate Role (If Step 2 = "No Reliable Expression")**
  *   *Question:* Does the surrogate decision-maker (per hierarchy/designation) understand and intend to apply the directive according to the patient's known wishes and values (Substituted Judgment)?
  *   *Sufficient "Yes" Answer:* Surrogate provides a reasoned interpretation consistent with Steps 1-3 analysis. *Door:* **HAND TO SURROGATE (to implement their decision).**
  *   *Sufficient "No" Answer:* Surrogate disregards directive without justification, or interpretation is unreasonable based on Steps 1-3. *Door:* **VALUES JUDGMENT REQUIRED (Committee may need to override surrogate or reframe).**

  ---

  **Answering Your Specifics:**

  1.  **Rule for Personality Change ("Decay"):** The ADIP **adopts a modified decay concept**:
      *   It *triggers* deeper analysis (Step 4) but isn't automatic invalidation.
      *   Change must be *significant, documented, and relevant* to the directive's motivation.
      *   *Reason for Non-Philosophers:* "If the person who wrote the directive became a fundamentally different person in ways that change why they wrote it (e.g., a deeply independent person who feared burdening others finds joy in dependence; a devout person loses faith underlying an end-of-life choice), we must question if the old instructions still bind the new person. But we don't ignore the directive – we carefully weigh this change along with *why* it was written and what the patient experiences now."

  2.  **Worked Applications:**

      *   **Case A (Mrs. A):**
          *   Step 1: "Unable to recognize family" is ambiguous (literal vs. proxy for burden/dignity). *Door:* Step 3.
          *   Step 3: Daughter (likely knows best) says motivation was "fear of being a burden." Directive is **Feared Condition Focused** (burden state). Current state: Cheerful, eats willingly – *does not seem burdened or distressed by her state*. Feared condition not substantially present? *Door:* Proceed to Step 4.
          *   Step 4: Directive likely **Evidence** of not wanting to *be a burden*, not necessarily a strict Ulysses contract against tube feeding regardless of experience. **No Relevant Personality Decay** documented (cheerfulness isn't decay, it's her experience). Current state shows positive **Experiential Interests**. Honoring directive *now* (if she stops eating) might violate current experiential interests for a burden state she doesn't experience. *Decision Matrix:* **Evidence Directive + No Decay + Overriding Serves Experiential Interests...** *Door:* **FOLLOW PRESENT PATIENT (if capable when decision needed) or HAND TO SURROGATE (if not, leaning towards allowing feeding if comfortable)**. *You might dislike this if you strongly favor critical interests.*
      *   **Case B (Mr. B):**
          *   Step 1: "No heroics," "nothing that prolongs dying." Is antibiotics for infection "heroics" or "prolonging dying"? Ambiguous. *Door:* Step 3.
          *   Step 3: Likely motivation: Avoid painful, invasive, futile interventions during terminal decline; value peaceful death. Current state: Untroubled, affable, *not dying*. Treating infection restores *this* state. *Door:* Proceed to Step 4.
          *   Step 4: Directive reads as **Evidence** of values (avoiding suffering during decline, not prolonging inevitable death), not necessarily a Ulysses contract against any life-extending treatment. **No Relevant Decay.** Current state has positive **Experiential Interests**. Antibiotics serve current experiential interests by restoring comfort and do not inherently prolong "dying" if he's not actively dying from the underlying dementia. *Decision Matrix:* **Evidence Directive + No Decay + Overriding Serves Experiential Interests...** *Door:* **ADMINISTER ANTIBIOTICS (FOLLOW PRESENT STATE - which is comfortable life, not dying).** (Family split resolved towards treatment).
      *   **Case C (Ulysses Override):**
          *   Step 1: Directive explicitly includes instruction to override future objections. Clear instruction *in this specific scenario*. *Door:* Step 2.
          *   Step 2: Current patient distraught, asking for "everything." Consistent expression *contradicting* directive. Presume minimal, fluctuating capacity (moderate impairment). *Door:* Step 4.
          *   Step 4: Explicit **Ulysses Contract** intended. **Personality Decay?** Moderate impairment *might* indicate decay relevant to understanding the values behind the pre-commitment. **Critical Interests:** Directive aimed to protect life narrative/dignity (e.g., avoid living in severe impairment against past values). **Experiential Interests:** Current distress and desire to live. *Decision Matrix:* **Strong Ulysses BUT Significant Relevant Decay?** Ambiguous. Core conflict between Critical and Experiential Interests. *Door:* **VALUES JUDGMENT REQUIRED.**
          *   *Committee Judgment:* This is the limit. The committee must decide:
              *   Does the *degree* of impairment constitute sufficient decay to break the pre-commitment? (Can he *understand* the values he's rejecting?)
              *   Is the current distress temporary panic or a settled expression of changed interests?
              *   Does upholding the directive under duress fundamentally violate human dignity *now*?
              *   *Likely Outcome:* If impairment is significant enough that he cannot grasp the *reason* for his past directive (critical interest), honoring his current experiential distress might prevail. If he retains flashes of understanding consistent with past values, the Ulysses contract *might* hold. **There is no purely procedural answer here.** It demands open ethical deliberation about autonomy, identity, and dignity at the boundary.

  **Closing Statement: Limits of the ADIP**

  The ADIP provides structure but cannot eliminate ethical complexity. Its limits are:

  1.  **Indeterminate Values Judgments:** Steps directing to "VALUES JUDGMENT REQUIRED" acknowledge the procedure's endpoint. The committee must then deliberate openly on the unresolved philosophical tensions (Authority vs. Evidence, Critical vs. Experiential, Decay's impact, Ulysses limits) using reason, empathy, and the specifics of the case. *This is not a failure of the procedure; it is its necessary boundary.*
  2.  **Unclear Evidence:** If the motivating values (Step 3) remain irreducibly unclear after consulting all sources, the procedure defaults to Surrogate or Values Judgment.
  3.  **Surrogate Disputes:** The ADIP assumes a designated surrogate. Intractable conflicts *between* potential surrogates require separate resolution mechanisms.
  4.  **Extreme Suffering:** If honoring either the directive or current wishes would cause extreme, unavoidable suffering not addressed in the directive, this may necessitate a separate "best interests" override, flagged as a Values Judgment.
  5.  **Legal Override:** While jurisdiction-agnostic, the committee must recognize that specific laws or court precedents *may* ultimately supersede this ethical deliberation. The ADIP structures the *ethical* reasoning leading up to or informing any legal necessity.
  6.  **The Human Element:** The ADIP outputs a recommendation. The final responsibility for the decision, its communication, and the care plan rests with the attending physician and care team, informed by ethics input. The ADIP does not remove the burden of judgment; it aims to make that judgment more reasoned, transparent, and ethically grounded.

  This procedure forces explicit consideration of the key philosophical distinctions, provides clear pathways for many cases, and unflinchingly marks the point where procedural reasoning ends and human ethical judgment must begin.
