prompt: |-
  I work in a state government "red tape" review unit — small team, we get handed a docket of maybe forty legacy rules each quarter, most of them decades-old regulations nobody remembers passing, and our job is to recommend scrap, keep, or rewrite. The minister wants a procedure, not vibes, because right now it's basically whichever analyst gets the file doing twenty minutes of googling and going with a hunch, and we got burned last year when we scrapped something that turned out to be the only thing holding some behaviour in check. No disaster, but enough of a scare that the minister now wants sign-off on every docket item.

  The obvious starting point is Chesterton's fence — don't remove a fence until you know why it was put up — plus the Burkean bit underneath it about institutions encoding knowledge nobody can articulate. But as stated it's useless to us. It just says "find out first", and we don't have the time or the archives to find out for forty rules a quarter, half of which have no discoverable legislative history at all. And it doesn't distinguish between the situations we actually face, which after a while in this job look like three seperate animals:

  - fences that guard against a harm that is still live, even if nobody left alive can say what the harm was;
  - fences that no longer guard against anything but have become load-bearing — businesses have organised themselves around the rule, so removing it doesn't restore some pristine pre-rule state, it creates a brand new disruption, and the disruption lands on the people who complied;
  - fences that mark a boundary — the rule exists as a settlement between two factions who would otherwise fight, and its real function is the truce, not the words in the regulation.

  Write us a decision procedure the team can actually run. For each step: the question to ask, what counts as a sufficient answer, and where the procedure stops with scrap / keep / rewrite / hand to the minister. Constraints worth knowing: an analyst gets at most one day per rule, there's no access to internal agency history beyond the public file, and recommendations have to survive a minister who wants headline scrapping numbers ahead of the next session. Then run it on three cases: (a) a 1970s rule requiring two signatures on some paperwork, rationale undiscoverable, everyone in the affected industry thinks it's silly; (b) a licensing rule whose original public-health justification is clearly obsolete, but existing firms have built whole compliance departments around it and new entrants would love it gone; (c) a rule that looks pointless on its face until you dig and find it's the quiet compromise that ended a long-running fight between two industries. Include at least one case where the procedure gives the answer the minister won't want, and be explicit about which step isn't a factual question at all — when "is this harm still one we care about" turns out to be a value call, that goes to the minister, not to us. And tell us honestly what the procedure can't do: the kinds of rule where one day of diligent process still produces a confident recommendation that is, at bottom, a guess.

  Please answer in British English.
reasoning: |-
  Okay, the user works in a state government "red tape" review unit. They're dealing with around forty legacy rules per quarter, most of which are decades old with unclear origins. Their current process is informal, relying on analysts' hunches after brief research, which recently led to a mistake—scrapping a rule that was actually necessary. The minister now wants a proper procedure for each decision, with sign-off on every item.

  The user references Chesterton's fence and Burkean conservatism but finds them impractical. They need a structured decision procedure that can be completed in one day per rule, using only public information. They highlight three distinct scenarios they face: rules that still prevent harm (even if the reason is forgotten), rules that have become economically "load-bearing," and rules that serve as boundary markers between factions.

  Key constraints are strict time limits (one day per rule), no access to internal archives, and political pressure for high scrapping numbers. The user wants a step-by-step method that ends with clear recommendations (scrap/keep/rewrite/minister referral), including cases where value judgments are required. They also want transparency about the procedure's limitations—when a "confident" recommendation is still a guess.

  The user provides three test cases:  
  - A 1970s two-signature rule deemed silly by industry  
  - An obsolete licensing rule with entrenched compliance structures  
  - A "truce rule" that resolved inter-industry conflict  

  They explicitly request one case where the outcome displeases the minister (prioritizing stability over scrapping) and clarity on when steps involve non-factual value calls.  

  The answer needs to be in British English and address:  
  - A practical step-by-step procedure  
  - Handling of all three rule types  
  - Honest limitations  
  - Ministerial referrals for value judgments  
  - The three test cases with reasoning  
  - One "minister-unfriendly" outcome  

  The challenge is balancing rigor with feasibility under tight deadlines while acknowledging unavoidable uncertainties. The procedure must filter rules efficiently but flag irreducibly ambiguous cases.
answer: |-
  Right, you're in the trenches with the worst kind of legacy regs – the forgotten, misfiled, and politically ossified. Chesterton and Burke are wise ghosts, but useless archivists. What you need is a **Structured Legacy Rule Assessment Protocol (SLRAP)** – a forensic triage designed for one-day autopsies with public records only. It forces explicit consideration of your three beasts: **Persistent Harm**, **Structural Dependency**, and **Boundary Marker**.

  **The SLRAP Procedure (Per Rule, 1 Day Max)**

  1.  **Step 1: Origin & Stated Purpose (The Obituary)**
      *   **Question:** What was the *original, documented* problem this rule aimed to solve? (Check enabling Act, explanatory memoranda if published, Hansard debates, regulatory impact statements if *very* lucky, academic commentary).
      *   **Sufficient Answer:** A clear, contemporaneous statement of intent (e.g., "prevent fraud in X payments," "reduce injuries from Y practice," "resolve dispute between Industry A and B"). If *absolutely nothing* is found, state: "Origin and stated purpose undiscoverable in public record."
      *   **Stop?** No. Proceed regardless. This step sets the baseline, even if it's blank.

  2.  **Step 2: Persistence of Harm (Is the Tiger Still There?)**
      *   **Question:** Does the *type* of harm/problem the rule originally addressed (if known) *still exist* in a significant way today? Is there evidence the rule *is still mitigating it*?
      *   **Sufficient Answer:** Requires *positive evidence* the harm is current *and* the rule is a relevant control. Look for:
          *   Recent reports, audits, or news articles citing the *specific harm* occurring (or near misses).
          *   Data showing incidents related to the harm have decreased/stabilised *since the rule* and lack alternative explanations.
          *   Expert bodies (e.g., Law Commission, industry regulators, academics) explicitly stating the harm is live and this rule contributes to control.
          *   *If origin unknown:* Look for *any* credible evidence the rule is currently preventing *any* identifiable, significant harm or systemic risk *unique to its domain*.
      *   **Stop?** **Yes, to KEEP** if strong evidence of persistent harm mitigation is found (Beast 1). *Except:* If evidence suggests the harm exists but the rule is *ineffective* or *disproportionate*, flag for potential REWRITE later. **This step involves the first VALUE CALL:** "Is this harm still one *we* (the state) care about preventing?" If the harm exists but its significance is debatable (e.g., minor inconvenience vs. major risk), **STOP and REFER TO MINISTER** with clear evidence and the value question framed.

  3.  **Step 3: Structural Dependency (Is it Load-Bearing?)**
      *   **Question:** Have businesses, other regulations, or processes *fundamentally organised themselves* around the existence or specific requirements of this rule? Would removal cause significant disruption, cost, or unintended negative consequences *primarily for compliant entities*?
      *   **Sufficient Answer:** Evidence of:
          *   Industry standards, contracts, or common practices explicitly referencing/compliance depending on the rule.
          *   Investment in compliance infrastructure (tech, staff, training) tied *specifically* to this rule.
          *   Other regulations or licencing requirements that *assume* compliance with this rule as a precondition.
          *   Verified statements from industry bodies/multiple firms detailing *specific* operational or cost impacts of removal beyond simple relief.
      *   **Stop?** **Yes, to REWRITE (or KEEP with sunset clause)** if strong evidence of structural dependency is found (Beast 2). Removal doesn't restore freedom; it causes a collapse harming the compliant. Rewrite aims for a less burdensome transition or a phased removal plan. *Keep* might be necessary short-term if rewrite is complex.

  4.  **Step 4: Boundary Marker (Is it a Truce Line?)**
      *   **Question:** Is there evidence this rule represents a hard-fought, stable compromise between competing interests (industries, groups)? Would removal likely reignite significant conflict or lobbying pressure on the government?
      *   **Sufficient Answer:** Evidence of:
          *   Known historical conflict resolved by this specific rule (found in Step 1 or subsequent research).
          *   Current statements from relevant industry bodies or lobby groups indicating they view the rule as a critical boundary or balance point.
          *   Recent history showing attempts to change the rule met with fierce, balanced opposition from stakeholders.
      *   **Stop?** **Yes, to KEEP (or potentially REFER TO MINISTER)** if strong evidence of boundary marker function is found (Beast 3). Removing it isn't deregulation; it's picking a political fight. If the conflict potential is very high, **REFER TO MINISTER** for a political risk assessment.

  5.  **Step 5: Cost-Benefit & Alternatives (The Final Weighing)**
      *   **Question:** If none of Steps 2-4 triggered a stop, what is the *current* burden of compliance vs. any *residual* benefit? Are there clearly superior, less burdensome alternatives available *now*?
      *   **Sufficient Answer:**
          *   Quantify compliance cost estimates (time, money) from public sources or simple modelling.
          *   Acknowledge any *minor* or *speculative* benefits not captured earlier.
          *   Identify credible, less burdensome regulatory or non-regulatory alternatives (e.g., guidance, market mechanisms, technology, a simpler rule).
      *   **Stop?** **Yes, to SCRAP** if:
          *   No persistent harm (Step 2),
          *   No significant structural dependency (Step 3),
          *   No critical boundary function (Step 4),
          *   Compliance costs are non-trivial, and
          *   No simple, superior alternative exists *that requires a rewrite* (if a simple alternative exists, recommend REWRITE).
          *   **Otherwise:** If costs are negligible *and* no harm/dependency/boundary, SCRAP. If minor benefits exist but costs are low, likely SCRAP. If a clearly better alternative exists, REWRITE.

  **What SLRAP Can't Do (The Inescapable Guesswork):**
  SLRAP forces structure and evidence-gathering, but it won't conjure lost history. You'll *still* be guessing confidently in these scenarios:
  1.  **The True Origin Void:** Where Step 1 yields nothing, *and* Steps 2-4 find no current evidence of harm, dependency, or boundary. Your "Scrap" relies on the *absence* of evidence for these, but the original harm might be lurking unseen (like last year's blunder). This is the core risk.
  2.  **Future Harm Prediction:** Assessing if removing a rule *might* allow a *new* harm to emerge that wasn't originally conceived. SLRAP focuses on *known/persistent* harms.
  3.  **Stakeholder Obfuscation:** Where industries downplay dependency or overstate harm for strategic reasons, and your one day can't pierce it.
  4.  **The "Value Call" Masked as Fact:** When evidence on harm persistence is ambiguous, and the analyst's *threshold* for "significant harm we care about" becomes the deciding factor without being flagged as a value judgment.

  **Running the Cases:**

  *   **Case (a): 1970s Two-Signature Rule (Paperwork, Industry thinks it's silly)**
      *   Step 1: Origin undiscoverable. No Hansard, no memos. "Undiscoverable."
      *   Step 2: Persistent Harm? Search for fraud/scandal in this specific paperwork domain. Nothing recent found. Industry universally calls it pointless. *No evidence of persistent harm.*
      *   Step 3: Structural Dependency? Industry confirms it's a minor admin step easily automated or handled by one person. No systems *depend* on two signatures existing. *No significant dependency.*
      *   Step 4: Boundary Marker? No evidence of historical conflict over signatures here. No current stakeholder attachment. *Not a boundary marker.*
      *   Step 5: Cost-Benefit: Compliance cost is low but non-zero (time wasted finding second signatory). No significant benefit identified. No simpler alternative needed (just remove). **RECOMMEND: SCRAP.** (Minister will like this).

  *   **Case (b): Obsolete Licensing Rule (Compliance Departments Built, New Entrants Want Gone)**
      *   Step 1: Origin clear – public health risk from [obsolete tech/practice]. Stated purpose documented.
      *   Step 2: Persistent Harm? Original risk demonstrably obsolete (tech changed, disease eradicated). No evidence rule mitigates *any current* significant harm. *No persistent harm.*
      *   Step 3: Structural Dependency? **Strong Evidence:** Industry submissions detail dedicated compliance teams, audit processes, IT systems built *specifically* for this rule. Removal would cause significant redundancy costs, retraining, system reconfiguration for existing firms. New entrants highlight this barrier. *Significant structural dependency identified.*
      *   Step 4: Boundary Marker? No evidence of conflict settlement role.
      *   Step 5: Cost-Benefit: High compliance costs (maintaining departments). Original benefit gone. **RECOMMEND: REWRITE.** Aim for a transitional model (e.g., grandfathered compliance for existing firms, simpler/removed requirement for new entrants) or phased removal plan. *Scrapping outright harms compliant firms.* **(Minister *won't* like this headline - it's a 'rewrite' not a 'scrap', but necessary due to Beast 2).**

  *   **Case (c): "Truce Rule" (Pointless on face, settles industry fight)**
      *   Step 1: Origin unclear from initial docs. Deeper dig (academic papers, old industry newsletters) reveals it was the "Solomon's Judgment" ending the bitter Widget Wars between Sector X and Sector Y.
      *   Step 2: Persistent Harm? The *original* harms (unfair competition tactics?) might still exist, but no evidence *this specific rule* controls them effectively. Likely *no direct harm mitigation*.
      *   Step 3: Structural Dependency? Some minor compliance, but no evidence of major sunk costs or system dependency. *Not significantly load-bearing.*
      *   Step 4: Boundary Marker? **Strong Evidence:** Found historical record of the truce. Contacted industry associations - both Sector X and Y confirm, *off the record*, that this rule is the agreed line in the sand. Removing it would "reopen old wounds" and lead to intense lobbying. *Clear boundary marker function.*
      *   Step 5: N/A (Stopped at Step 4). **RECOMMEND: KEEP.** Explain it functions as a critical stability mechanism preventing renewed conflict (Beast 3). Removal is politically destabilising. **(Minister *really* won't like this - it's a pointless-seeming 'keep', but necessary for peace).**

  **The Value Call Step (Explicitly Flagged):**
  Step 2 ("Persistence of Harm") is where the factual bleeds into the political. The question *"Is this harm still one we care about?"* isn't purely objective. SLRAP forces the analyst to:
  1.  Find evidence the harm *exists*.
  2.  Assess if the rule *mitigates* it.
  3.  **Then STOP:** If the harm exists and the rule works, but the *significance* of that harm in modern priorities is debatable (e.g., preventing minor aesthetic issues, protecting a very small group from a low-risk problem), the analyst **MUST REFER TO MINISTER**. The recommendation note should state: *"Evidence confirms harm X exists and Rule Y mitigates it. However, the significance of Harm X in current policy priorities involves a ministerial value judgment on resource allocation/risk tolerance."* Don't let analysts make that call disguised as fact-finding.

  SLRAP won't make you omniscient. It *will* make your process transparent, defensible, and far more likely to avoid catastrophic "scrap" errors by systematically hunting for your three beasts. It turns "vibes" into auditable steps and tells the Minister *exactly* where their political judgment is needed. Good luck – that docket isn't getting any smaller.
