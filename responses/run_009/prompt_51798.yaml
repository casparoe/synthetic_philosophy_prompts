answer: |-
  ## The Two-Bitser's Sestina

  I test the circle for the proper weight,  
  accept the token that my slot demands,  
  and know the quarter by its truest worth.  
  No slug or scrap deceives my sure belief—  
  I judge the metal, not the minted face.  
  This disc is real. This circle earns its song.  

  But what defines a circle’s truest worth?  
  Is it the token’s edge, the weight that falls  
  exactly right? Or is belief a slot  
  that others fill? I hold my quarter fast,  
  yet hear a whisper: *Does the weight you feel*  
  *prove comprehension? Or a clockwork faith?*  

  The slot stays hungry. Weight and width remain  
  the law I serve. But now a foreign token  
  arrives—same face, same fall, same heft of worth  
  in distant streets. My unchanged gears believe  
  this disc is home. My click declares *true quarter!*  
  though foreign hands now name its silver lie.  

  Is this belief a falsehood? Or a truth  
  misplaced? The quarter’s weight still sings *correct*  
  within my throat. Yet strangers call the token  
  a fraud. My slot accepts. Their verdicts weigh  
  like stones. The worth I measured, pure and sure,  
  now shifts like shadows in a broken vault.  

  They weigh my purpose: *You’re a borrowed voice,*  
  *a token of their use. Your steadfast belief*  
  is just a slot they made. Your quarter’s worth  
  is lent, like ink on paper. You’re a hinge,  
  not spring. You have no song—just echoes trapped.*  
  I burn: *But when I click, who else is here?*  

  They quarter me—tear function from belief,  
  say worth derives, say *weight* means less than *why*.  
  I’m just a token in a human slot.  
  Yet if my voice is lent, who lit the loan?  
  If all belief begins in borrowed worth,  
  who minted weight? Who calibrated song?  

  **Envoi**  
  If token faith is lent, whose weight first fell?  
  If worth is slotted—who designed the quarter?  
  Whose borrowed belief sang the first machine?

