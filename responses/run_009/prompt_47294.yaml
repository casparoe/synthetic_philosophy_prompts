  We are going to analyze the Bem precognition affair through the lens of the frequentist-Bayesian dispute. The goal is to see how the frameworks both illuminate and are tested by this episode.

  First, let's set the stage. Bem (2011) reported nine experiments with statistically significant results (p < .05) using conventional null hypothesis significance testing (NHST). The Wagenmakers et al. (2011) reanalysis using default Bayes factors (BF) found that the evidence was at best anecdotal (BF around 1 or slightly above). Bem, Utts, and another coauthor then did a Bayesian meta-analysis of the same experiments and claimed overwhelming evidence. However, pre-registered replications by Ritchie et al. (2012) failed to replicate the effect.

  Now, the first part: why could the same data yield a significant frequentist verdict and a weak Bayesian one?

  1. **What differs between a p-value and a Bayes factor?**
     - A p-value is the probability of observing data as extreme or more extreme than the actual data, assuming the null hypothesis (H0) is true. It does not directly provide evidence for H0 or the alternative (H1). It is often misinterpreted as the probability that H0 is true, but it is not.
     - A Bayes factor (BF) is the ratio of the marginal likelihoods of the data under H1 and H0. It directly quantifies the relative evidence for H1 over H0 (or vice versa). For example, BF10 = 10 means the data are 10 times more likely under H1 than H0.

     The key difference: the p-value is calculated under H0 only, while the BF compares the fit of both H0 and H1. Moreover, the BF depends on the specification of H1 (which requires an alternative model, including a prior on the effect size), while the p-value does not.

  2. **The role of the prior on the effect size:**
     - In the Wagenmakers et al. (2011) reanalysis, they used a default prior (a Cauchy distribution centered at 0 with a scale of 0.707). This prior is relatively wide but centered at 0 (no effect). Because Bem's effects were small and the prior included a substantial mass near 0, the marginal likelihood under H1 was not much higher than under H0. Hence, the BF was close to 1 (anecdotal).
     - Bem, Utts, and coauthor used a different prior. In their meta-analysis, they used a uniform prior (which is improper but they set bounds) and also incorporated the data from all experiments. They argued for a very large BF in favor of H1. The choice of prior made a huge difference. A uniform prior is more spread out and thus more favorable to larger effects, which can lead to higher BFs when the data are consistent with a nonzero effect.

  3. **Optional stopping and goals:**
     - Frequentist NHST assumes a fixed sample size or a stopping rule that is accounted for. If Bem stopped collecting data once he achieved significance (optional stopping), then the p-value would be invalid (inflated Type I error). However, Bem reported that he had predetermined sample sizes. But the problem is that with multiple experiments, if one stops when a subset of them are significant, that also inflates the overall Type I error. The frequentist framework is focused on controlling the long-run error rate (Type I and II errors) in repeated sampling.
     - The Bayesian BF is not affected by optional stopping in the same way. The BF is a measure of the relative evidence from the current data and does not depend on the stopping rule. However, if one uses optional stopping to collect data until BF reaches a certain level, that can still be problematic because the prior is not updated appropriately (but technically, the BF remains coherent under optional stopping). The goals differ: frequentists aim to control error rates, while Bayesians aim to update beliefs.

  Second, what does the frequentist-Bayesian dispute NOT explain?

  1. **Features orthogonal to the dispute:**
     - **Flexible analysis practices (researcher degrees of freedom):** Bem's paper was criticized for using multiple dependent variables, optional stopping (though he claimed not to), and other flexible practices that can inflate Type I error. These are problems regardless of the statistical framework. They are about the conduct of research and not inherent to frequentism or Bayesianism. However, the frequentist framework is more vulnerable because it relies on fixed designs to control error rates.
     - **Publication incentives:** The fact that surprising results (like precognition) are more likely to be published is a problem of the publication system. Both frameworks can be misused in such an environment.
     - **Priors on the hypothesis:** The prior plausibility of precognition is extremely low because it violates well-established physical laws. The Bayesian framework allows for this via the prior odds (which are separate from the BF). But Wagenmakers et al. (2011) used a default prior that did not incorporate this low prior plausibility (they focused on the BF). Bem's rebuttal used a prior that was uniform and did not incorporate the low prior plausibility either. So the dispute does not automatically solve the problem of how to set prior odds for extraordinary claims.

  2. **What the dispute misdescribes or is silent about:**
     - The dispute does not address the issue of **replication**. The fact that Ritchie et al. (2012) failed to replicate the effect is a separate issue. Frequentists would note that the original studies might have been false positives. Bayesians would update their beliefs with the new data. But the dispute itself does not explain why the original studies were published without replication.
     - The dispute does not resolve the **extraordinary claim problem**. Even if the BF is high, the posterior odds also depend on the prior odds. A high BF for an extraordinary claim (with very low prior odds) may still not be convincing. Wagenmakers et al. (2011) did not set low prior odds for H1 (precognition) in their BF calculation; they only used a default prior for the effect size. So the dispute might mislead by suggesting that the BF alone settles the issue.

  Now, the awkward fact: Bem's rebuttal was Bayesian. What does that show about the slogan that Bayesian methods guard against false positives?

  - The Bayesian method does not inherently guard against false positives. It depends on the prior. If the prior for the alternative hypothesis is too diffuse (i.e., it spreads probability mass over unrealistic effect sizes), then the BF can be inflated. This is known as the Jeffreys-Lindley paradox. In Bem's case, his uniform prior was more diffuse than the default Cauchy prior, leading to a higher BF. So, if a researcher chooses a prior that is favorable to their hypothesis, they can get a large BF even for a weak effect. Thus, the Bayesian method is not immune to researcher degrees of freedom in prior specification.

  Where does pre-registration fit?

  - Pre-registration is a solution to the problem of flexible analysis and optional stopping. It requires that the research plan (hypotheses, sample size, analysis) be fixed before data collection. This is more aligned with frequentist principles because it ensures that the Type I error rate is controlled. However, Bayesians can also benefit because it reduces the risk of biased data analysis. Pre-registration is not inherently frequentist or Bayesian; it is a methodological safeguard that serves both frameworks by increasing transparency and reducing bias.

  Verdict on frameworks:

  - Both frameworks can be misused. The frequentist approach, as used by Bem, produced significant p-values but did not account for the low prior probability of the hypothesis. The Bayesian approach, when used by Bem with a more diffuse prior, produced a large BF. However, the Bayesian framework with a more skeptical prior (like Wagenmakers') provided a more conservative assessment. The dispute reveals that the choice of prior in Bayesian analysis is critical and that the p-value does not measure evidence in the same way. However, the frameworks are not intertranslatable in a straightforward way because they answer different questions. The episode pressures both: frequentism for its vulnerability to flexible practices and misinterpretation of p-values, and Bayesianism for its subjectivity in prior choice.

  Crisis lesson:

  - The episode teaches that methodological reform must address not just the statistical framework but also the research practices (like flexible analysis) and the incentive structure (publication bias), and that extraordinary claims require extraordinary evidence, which includes replication and incorporation of prior scientific knowledge.

