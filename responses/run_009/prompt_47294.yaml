  ### Case Analysis: The Bem Precognition Affair and the Frequentist–Bayesian Dispute

  The 2011 publication of Daryl Bem’s "Feeling the Future" in the *Journal of Personality and Social Psychology* (JPSP) and the ensuing debate offer a high-resolution lens on the frequentist–Bayesian dispute. Bem’s nine experiments, analyzed with standard null hypothesis significance testing (NHST), yielded statistically significant results (e.g., *p* < .05) for precognition effects. The Dutch team led by Wagenmakers reanalyzed the same data using default Bayes factors (BFs), concluding the evidence was "anecdotal" (BF ≈ 1–3). Bem’s rebuttal, a Bayesian meta-analysis with uniform priors, claimed overwhelming evidence (posterior odds > 10⁹). Later, pre-registered replications by Ritchie et al. (2012) failed. This episode became a microcosm of the replication crisis, revealing both the insights and limitations of statistical paradigms.

  #### How the Frameworks Illuminated the Episode  
  The divergence between Bem’s frequentist *p*-values and Wagenmakers’ Bayesian BFs stems from foundational differences in what each measures and how they incorporate uncertainty. A *p*-value quantifies the probability of observing data *at least as extreme* as the actual data, *assuming the null hypothesis (H₀) is true*. It is not a direct measure of evidence for H₀ or the alternative (H₁); it only addresses data rarity under H₀. For Bem, *p* < .05 indicated his results were unlikely under a true null—but this ignored the plausibility of H₁. In contrast, the Bayes factor (BF₁₀) is a ratio of marginal likelihoods: it compares the probability of the data *under H₁* to that *under H₀*. It directly quantifies relative evidence, requiring explicit specification of both hypotheses. Wagenmakers’ BFs were weak because their default prior—a Cauchy distribution centered at zero with scale 0.707—encoded skepticism by placing substantial mass near zero (small effects), making H₁ less predictive of Bem’s data. Thus, even "significant" effects under NHST could yield BFs near 1: the data were ambiguous when H₁ was penalized for implausibility.  

  This prior sensitivity fueled the dispute. Bem’s rebuttal used uniform priors (improper flat distributions), assigning equal probability to all effect sizes. This inflated the BF by making H₁ artificially accommodating: large, unphysical effects were not downweighted. The choice of prior—skeptical (Wagenmakers) vs. uniform (Bem)—dictated the BF’s verdict, exposing Bayesianism’s subjectivity. Here, the dispute clarified that *p*-values ignore H₁’s plausibility, while BFs depend critically on prior specification.  

  Optional stopping further highlighted goal differences. Frequentist NHST assumes fixed sample sizes; stopping early inflates Type I error. Bem claimed preplanned samples, but the flexibility of running multiple tests across nine experiments risked *p*-hacking. The frequentist framework, focused on long-run error rates, is brittle under such flexibility. Bayesian BFs, however, are less sensitive to stopping rules: evidence accumulates coherently with data. Wagenmakers’ BFs thus avoided this inflation but did not absolve Bem’s design from data-dependent decisions. The core distinction emerged: frequentism prioritizes error control, while Bayesianism emphasizes continuous evidence updating.

  #### What the Dispute Does Not Explain  
  The frequentist–Bayesian dispute, however, cannot account for several orthogonal factors driving the crisis. First, **researcher degrees of freedom**—flexible analysis choices like adding participants or switching outcomes—enabled Bem’s results but are framework-agnostic. *p*-hacking exploits frequentist vulnerabilities, but Bayesian analyses can be gamed via prior tuning (as Bem demonstrated). Second, **publication incentives** favored novel, positive results; JPSP’s acceptance of precognition reflected sociology, not statistics. Third, the **extraordinary claim problem**—precognition violates physics—was sidelined in the dispute. Bayesian prior odds should incorporate this (e.g., H₁ prior odds << 1), but neither side formally did so; Wagenmakers used default priors for effect sizes, not hypotheses, while Bem ignored plausibility. This allowed the BF to be weaponized for advocacy. Fourth, the **replication failures** were not a statistical fluke but a consequence of uncontrolled flexibility and publication bias. The dispute offered no tools to detect these issues ex ante.  

  Crucially, Bem’s Bayesian rebuttal undermines the slogan that "Bayesian methods guard against false positives." His uniform-prior meta-analysis produced astronomical BFs, illustrating that Bayesianism is only as robust as its priors. Without constraints, it can amplify false positives as readily as NHST. This shows Bayesianism is not inherently "objective"; it shifts subjectivity from design to prior specification. The dispute thus misdescribes the core problem: it is not that frequentism is uniquely flawed, but that *both frameworks can be misapplied when incentives favor overclaiming*.  

  #### Pre-registration: A Framework-Neutral Safeguard  
  Pre-registration, which gained traction post-Bem, is neither frequentist nor Bayesian. It is a procedural reform that constrains researcher degrees of freedom by committing to designs and analyses before data collection. For frequentists, it preserves error-rate control; for Bayesians, it ensures priors are specified genuinely. It thus transcends the dispute, targeting the shared enemy: flexibility.

  #### Verdict on the Frameworks  
  The Bem affair pressures both frameworks. Frequentism’s *p*-values invited misinterpretation and were inflated by flexibility. Bayesianism’s BFs exposed H₁’s weakness but proved malleable via priors. Neither "solved" the crisis alone; both were compromised by contextual factors. The frameworks are not intertranslatable—they answer different questions (data rarity vs. relative evidence)—but they are reconcilable in practice. **Verdict: both_reconcilable**. Justification: *Each framework’s limitations (e.g., p-values ignoring H₁, BFs depending on priors) are mitigated by the other’s strengths when used complementarily, but neither suffices without methodological reforms like pre-registration.*

  #### Crisis Lesson  
  The episode teaches that statistical reform must address not only mathematical paradigms but also the institutional and cognitive biases (e.g., incentive structures, extraordinary claims) that distort their application.

