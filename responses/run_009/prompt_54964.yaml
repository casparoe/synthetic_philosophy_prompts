  The weakest part of my diagnosis is handling the circularity in (4). If the world is adversarial, induction fails, and we can't prove non-circularly that it's not. But in practice, we rely on induction because it aligns with how we experience the world. Highlighting that NFL's uniform prior is unrealistic might help, but that's an empirical bet.

