  Okay, let me start by unpacking the user's query. They're diving into the debate around Functional Decision Theory (FDT) and its critics, focusing on the asymmetry between Counterfactual Mugging and XOR Blackmail. The user suggests that the real disagreement might be about the fundamental purpose of decision theory itself. 

  First, I need to recall the key points of FDT. It treats decisions as outputs of a function across possible scenarios. In Counterfactual Mugging, FDT pays because it commits to a policy that pays regardless of the coin flip to avoid losing $1000 when Omega predicts correctly. In XOR Blackmail, FDT doesn't pay because the blackmailer exploits the decision procedure, and paying encourages more blackmail.

  The critics, like MacAskill, argue that both cases are structurally similar: a past event (coin flip or prediction) is linked to the agent's choice, and a predictor depends on the agent's dispositions. So why treat them differently? FDT's response about the predictor's intentions seems ad hoc to critics.

  The user hypothesizes that the core conflict is about what normative decision theory should be: a theory of momentary choice (favoring causal decision theory) or a theory of decision procedures across all situations (FDT's policy view). If that's true, the camps are answering different questions.

  Now, diagnosing the disagreement. I need to consider if it's verbal, about evaluation standards, a formal dispute, or bedrock intuitions. The user mentions several possibilities. 

  Verbal disagreement doesn't seem right—both sides probably agree on definitions but apply them differently. Evaluation standards seem key: CDT focuses on present action consequences, FDT on long-term agent properties. The formal dispute is whether a distinction exists between cases. FDT claims the blackmailer's adversarial intent is the difference, but critics see it as unprincipled. Bedrock intuitions might be at play too: is rationality about maximizing utility now or being the type of agent who does well overall?

  For progress, the user wants alternatives to rehashing examples. A formal criterion distinguishing cases is tough because the predictor's intent is hard to formalize. Clarifying the bifurcation between choice-time theory and agent-design theory could help. Maybe accepting that both questions are valid but separate. Or arguing that no resolution is possible because the intuitions are too deep.

  The user's deeper need seems to be understanding the root of the stalemate and how to move beyond it. They might be frustrated with the circular debates and want a meta-resolution. They're likely well-versed in decision theory, given the technical depth, so avoiding oversimplification is key. Their unspoken request might be for a framework that acknowledges both perspectives without forcing a winner, or a new angle to break the deadlock.
answer: |-
  Your analysis cuts to the heart of the FDT debate. The disagreement is **primarily a difference about the standard of evaluation for normative decision theory**, compounded by **bedrock intuitions about rationality itself**. The "difference-maker" dispute over cases is a symptom, not the cause.

  **Diagnosis:**

  1.  **Core Disagreement: The Purpose of Decision Theory:** You correctly identify the fundamental split:
      *   **Camp 1 (Critics/MacAskill/CDT-leaning):** Normative decision theory should tell an agent **what to do *now*, in this specific situation, with the past fixed.** The focus is on *causal efficacy* given the current state of the world. "Rationality" means maximizing expected utility based on the causal consequences of *this* choice. Fixed facts (like the coin flip or the prediction) are simply background conditions. XOR Blackmail and Counterfactual Mugging look identical *from this perspective*: paying affects nothing causally downstream in the immediate situation (the prediction/blackmail condition is already fixed).
      *   **Camp 2 (FDT Proponents):** Normative decision theory should tell an agent **which decision *procedure* (function, algorithm, or "policy") to implement.** The focus is on *logical consistency* and *performance across the entire class of decision problems the agent might face*. "Rationality" means implementing the function that, when run in *all* relevant situations (including counterfactual ones where the predictor acted differently based on your function), yields the best overall outcome. From *this* perspective, the cases differ crucially:
          *   **Counterfactual Mugging:** The coin flip is *not* dependent on your function. Paying $100 when Heads (even though you know it's Tails *now*) is part of the *globally optimal policy* because it ensures you *would have* gotten $10,000 if Heads had occurred. Your function's behavior in the counterfactual matters for the predictor's past action.
          *   **XOR Blackmail:** The blackmailer *is* adversarial and *specifically conditions their action on your function* to exploit it. Paying creates a *globally exploitable* policy. The optimal policy is *not* to pay, making the blackmail threat empty and ensuring you never face the demand.

  2.  **The "Difference-Maker" Debate is Collateral:** The argument over whether the predictor's *intent* (exploitative vs. neutral) constitutes a "principled distinction" misses the point. **Intent is a heuristic proxy for the *structural dependency* relevant to FDT's global policy evaluation.** Critics are right that from a *momentary, causal* view, intent is irrelevant; the past is fixed regardless. FDT proponents are right that for *policy* evaluation, an adversarial predictor creates a fundamentally different strategic environment where cooperation is impossible/undesirable. The debate stalls because each side is implicitly using their preferred evaluative standard to assess the relevance of the difference.

  3.  **Bedrock Intuitions:** This ultimately taps into conflicting intuitions about rationality:
      *   **Critics:** Rationality is about *using evidence to cause good outcomes now*. Paying in Mugging *feels* irrational ("giving money for nothing"). Paying in Blackmail feels obviously bad (rewarding exploiters). FDT's Mugging behavior seems irrational by this standard.
      *   **FDT:** Rationality is about *being the type of agent that logically guarantees the best outcomes across all possible encounters with predictors/blackmailers/etc.* Refusing to pay in Mugging *feels* like leaving free money on the table *in the global class of problems*. Paying in Blackmail *feels* like being a sucker who invites exploitation. CDT's Mugging behavior seems irrational *by this standard*.

  4.  **Verbal vs. Substantive:** It's **not merely verbal**. The disagreement is about the *primary object of evaluation* (single action vs. decision procedure) and the *scope of rationality* (momentary causal efficacy vs. global logical consistency). While terminology ("rational") is overloaded, clarifying terms wouldn't resolve the underlying clash of intuitions and goals.

  **What Counts as Progress:**

  Rehashing examples is fruitless. Progress lies in:

  1.  **Explicit Bifurcation & Clarification:**
      *   **Theory of Choice (ToC):** Formally define the goal: "Given a fixed world-state (including fixed past events and dependencies), what action *now* maximizes causal expected utility?" CDT is explicitly designed for this. Its answer for *both* Mugging and Blackmail is "Don't Pay" (absent other causal levers).
      *   **Theory of Agent Design (ToAD):** Formally define the goal: "Which decision function F, when executed in *all* decision problems within a relevant class C (which includes predictors whose actions may depend logically on F), maximizes the expected utility across C?" FDT is explicitly designed for this. Its answers differ based on how the predictor's logic interacts with F within C.
      *   **Progress:** Explicitly acknowledge these as distinct (though related) normative projects. Frame critiques within the relevant project. Argue why one project *should be considered primary* for "decision theory" or "rationality," but don't pretend they answer the same question.

  2.  **Formalizing the Distinction within ToAD:** Can a *formal*, non-intentional criterion distinguish cases like Mugging vs. Blackmail *for the purpose of policy evaluation*?
      *   **Challenge:** Define "adversarial dependency" or "exploitability" solely in terms of logical/mathematical structure without appealing to intent.
      *   **Potential Paths:** Explore concepts like:
          *   **Robustness to Perturbation:** Does the optimal policy change if the predictor's model of you is slightly noisy or imperfect? (Mugging: Maybe; Blackmail: Likely not - exploitability remains).
          *   **Strategic Zero-Sumness:** Does the predictor's utility function directly oppose yours in the relevant counterfactuals? (Mugging: Omega is usually neutral/benign; Blackmail: Blackmailer gains at your expense).
          *   **Dependency Type:** Is the predictor's action a fixed function of your *output* (action) or a fixed function of your *entire decision procedure* F? (Both involve F, but the *nature* of the dependency matters for exploitability).
      *   **Progress:** Developing a formal criterion accepted *within the ToAD framework* as cleanly separating cases where cooperation (paying) is globally optimal vs. globally suboptimal would strengthen FDT's position *on its own terms* and defuse the "ad hoc" criticism. It wouldn't convince ToC adherents, but it would clarify the internal logic.

  3.  **Arguing for Primacy:** Engage the meta-debate: *Should* normative decision theory primarily be a Theory of Choice or a Theory of Agent Design?
      *   **ToC Arguments:** Focuses on the actual deliberating agent's situation. Avoids counterfactual "magical thinking." Aligns with standard scientific causality.
      *   **ToAD Arguments:** Addresses the core challenge of embedded agency with predictors/other agents. Captures the pre-commitment aspect crucial in many real-world strategic interactions (e.g., deterrence). Avoids being predictably exploitable.
      *   **Progress:** A compelling argument establishing the primacy of one project over the other for the *foundational goals* of decision theory (e.g., maximizing utility under uncertainty for agents in a world with predictors/other agents) would be significant. Alternatively, a robust argument that *both* are necessary but distinct components of a complete picture of rational agency.

  **Conclusion:**

  The hardened asymmetry stems from a fundamental schism in what constitutes the *subject matter* and *purpose* of normative decision theory. FDT proponents and their critics are arguing past each other because they are implicitly demanding that the other side adopt their underlying standard of evaluation (momentary causal efficacy vs. global policy performance). Progress requires moving beyond the case-based stalemate by either:

  1.  **Explicitly bifurcating** the field into Theory of Choice and Theory of Agent Design, recognizing their distinct goals.
  2.  **Formally grounding FDT's case distinction** within the ToAD framework in a way that doesn't rely on perceived intent.
  3.  **Directly engaging the meta-question** of which project (ToC or ToAD) is the more fundamental or appropriate foundation for normative decision theory in a world populated by predictive mechanisms.

  Simply debating whether the predictor's intent matters in the specific cases won't resolve the deeper conflict about what decision theory is *for*.
