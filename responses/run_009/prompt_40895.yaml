  First, they need desiderata that cover the key aspects: timing in Northwestern Europe, psychological features like deferred consumption, and why earlier mercantile economies didn't transition. Also, they want to avoid question-begging, black-boxing culture, or confusing correlation with causation. They also wonder if some requirements are too strict or conflicting.

  The user might be looking for a structured framework to objectively assess both sides of their argument. They probably want to move beyond repetitive debates by grounding their discussion in clear criteria. Their deeper need could be resolving the disagreement effectively, possibly to maintain harmony with their housemate or to satisfy their own intellectual curiosity.

  I should list each desideratum with reasoning, highlighting which are essential and which might be overly rigid. For instance, demanding no appeal to ideas might be a camp prejudice. Also, the potential conflict between microfoundations and macro explanations needs addressing. Identifying the most critical requirement that challenges both Weber and materialist theories will help them focus their debate.

  Key points: Timing and location specificity, psychological transformation, non-occurrence cases. Avoiding teleology, reification of culture, and correlation-causation errors. Microfoundations and path dependence are important but might clash. The arrow of causation is crucial because it's a common flaw in both arguments. 

  I need to ensure each desideratum is clearly explained. Also, note that the micro-macro tension is real but manageable. The arrow of causation is the key point that challenges both theories equally. Conclude by emphasizing this to help them target their debate effectively.
answer: |-
  Here's a breakdown of the desiderata for a causal explanation of the rise of modern industrial capitalism, framed explicitly for your debate:

  **Core Phenomena to Explain (The "What"):**

  1.  **Spatio-Temporal Specificity:** *Must explain why it emerged **in Northwestern Europe** (especially England, Netherlands, parts of Germany) and **beginning roughly in the 16th-18th centuries.*** Reasoning: This is the historical fact demanding explanation; a general theory of "capitalism" that could fit anywhere anytime fails.
  2.  **The Psychological/Behavioral Shift:** *Must explain the emergence and widespread adoption of **distinct behavioral patterns:** intense work ethic ("calling"), systematic reinvestment/profit-seeking, rational calculation, deferred gratification, and treating accumulation as an end in itself.* Reasoning: These behaviors weren't the global norm; they represent a qualitative shift in economic motivation crucial for sustained capital accumulation and industrialization. Weber identified this as the core puzzle.
  3.  **The Mercantile Non-Transition:** *Must explain why **large, sophisticated pre-modern mercantile economies** (Imperial China, Islamic Caliphates, Renaissance Italian city-states, Hanseatic League) developed advanced commerce, finance, and technology **but did not spontaneously generate modern industrial capitalism**.* Reasoning: This is the critical counterfactual. Any explanation that merely points to "trade" or "markets" fails because those existed robustly elsewhere without triggering the specific transformation in NW Europe.

  **Constraints on the Explanation (The "How Not"):**

  4.  **No Teleology or Question-Begging:** *Cannot assume the outcome (capitalist behavior/mindset) is inherent in the proposed cause.* Reasoning: Explaining capitalist behavior by saying "people became more capitalistic" is circular. The cause must be analytically distinct from the effect (e.g., not defining Protestantism *only* by its alleged economic consequences).
  5.  **No "Culture" Black Boxing:** *Cannot simply invoke "culture," "values," or "Protestantism" as a monolithic, unexplained causal force.* Reasoning: This is hand-waving. The explanation must specify *what* within the cultural system (specific doctrines, practices, institutions) *how* it influenced specific behaviors, and *why* it emerged/changed when it did.
  6.  **Arrow of Causation Clarity:** *Must demonstrate the **direction of causality** between correlated factors (e.g., Protestantism & Capitalism), especially ruling out reverse causality or common causes.* Reasoning: Correlations (e.g., Protestant areas got richer) are not explanations. Did Protestantism *cause* economic dynamism, or did dynamic areas *adopt* Protestantism? Or did underlying factors (literacy, urbanization, state weakness) cause *both*?
  7.  **Microfoundations Required (But Not Necessarily Individualist):** *Must provide a plausible mechanism linking the macro-cause (e.g., religious doctrine, property rights) to the micro-behavior (e.g., work ethic, reinvestment) of individuals/groups.* Reasoning: Macro structures (laws, religions, markets) only change history by changing how people act. We need to understand *why* individuals started behaving differently. *(See "Tensions" below)*
  8.  **Path Dependence & Contingency:** *Must acknowledge that the outcome wasn't inevitable and likely depended on specific sequences of events and institutional configurations.* Reasoning: History is messy. The explanation shouldn't imply that given factor X, capitalism *must* arise; it should show how specific historical circumstances in NW Europe allowed factor X (or Y+Z) to trigger the chain reaction.

  **Evaluating "Camp Prejudices":**

  9.  **The "No Ideas Allowed" Rule:** ***This is likely a camp prejudice dressed as rigor.*** Reasoning: Humans act based on beliefs, values, and interpretations of the world. Banning ideas entirely is absurd. *However*, the constraint against black-boxing "culture" (#5) and the demand for microfoundations (#7) are genuine rigor: Ideas must be specified, linked to behavior, and shown to be causally efficacious *within a historical context*, not invoked magically.
  10. **The "Pure Materialism" Rule:** ***Similarly, insisting on ONLY material factors (geography, tech, class struggle) is also often a prejudice.*** Reasoning: While material factors are crucial, ignoring how people *perceive* their material conditions, their motivations, and the legitimizing ideas for new institutions is incomplete. The psychological shift (#2) demands an account of motivation, which often involves ideas/values.

  **Tensions and Satisfiability:**

  *   **Microfoundations (#7) vs. Macro-Scale/Slow Change (#1):** This tension is **real but manageable, not fatal.** It *is* challenging to link individual psychology to century-spanning transformations. However, adequate explanations can bridge this by:
      *   Focusing on how institutions/rules *shape incentives and worldviews* for individuals.
      *   Showing how new ideas/values spread via specific channels (preaching, printing, education, family) and become embedded in institutions.
      *   Identifying "carrier groups" (e.g., specific Protestant sects, merchant classes) whose adoption of new behaviors had disproportionate impact.
      *   Acknowledging feedback loops: new behaviors create new institutions, which reinforce the behaviors. It requires nuance, not laziness.

  *   **The "Mercantile Non-Transition" (#3) as a Key Test:** This desideratum is crucial for *both* sides. A purely materialist explanation must show why NW Europe's material conditions differed *decisively* from, say, Song China. A cultural explanation must show why Protestant values were uniquely suited compared to other value systems present in mercantile societies.

  **The Knockout Requirement:**

  The requirement doing the **most work** in challenging *both* Weber *and* simplistic materialism is:

  **#6: Arrow of Causation Clarity.**

  *   **Against Weber:** This is the most common and powerful critique. Did Calvinist doctrine *create* the capitalist spirit, or did pre-existing entrepreneurial tendencies in certain regions make them receptive to Calvinism? Or did underlying socio-economic conditions (rising literacy, weakening feudalism, Atlantic trade opportunities) foster *both* religious reform *and* new economic behaviors? Weber struggled convincingly to rule out reverse causality/common cause.
  *   **Against Simplistic Materialism:** Many material factors (population growth, resource access, tech) correlate with economic development. But the Arrow requirement demands showing *why* these factors triggered the *specific psychological shift* (#2) and sustained growth *only* in NW Europe (#1), and crucially, *why they failed to do so* in equally or more materially advanced mercantile societies (#3). Did English property rights *cause* the shift, or were they a *result* of changing economic demands and power balances driven by other factors (including perhaps new ideas about ownership)? Material factors alone often struggle to explain the motivational core (#2).

  **In Summary for Your Debate:**

  Focus the next round on the **Arrow of Causation (#6)** and the **Mercantile Non-Transition (#3)**. Ask your housemate:

  1.  *"How does your materialist explanation definitively show that material factors caused the specific *psychological shift* (deferred gratification, accumulation as an end) and not vice-versa, or that both weren't caused by something else? And crucially, why didn't this happen in Song China or the Abbasid Caliphate, which had advanced tech, trade, and states?"*

  For your Weber defense, be prepared to answer:

  2.  *"How do you rule out that the economic dynamism of certain NW European regions *preceded* or was a *cause* of their adoption of Protestantism, rather than the other way around? Can you pinpoint the mechanism by which doctrine *directly* caused the behavioral shift in a way that wasn't possible with other ethical systems in other mercantile societies?"*

  Satisfying these two points simultaneously is the core challenge for any explanation of capitalism's origins. Good luck!
