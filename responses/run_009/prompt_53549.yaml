  Based on your cases and the tension between causal decision theory (CDT) and evidential approaches (like superrationality or evidential decision theory, EDT), I propose a principle that explains your verdicts by emphasizing **epistemically accessible, high-strength correlations in symmetric decision contexts**. The key insight is that cooperation (or one-boxing) arises not just from correlation, but when you and your counterpart are in a state of **mutually recognized symmetry**—where both agents are aware of the correlation and are reasoning about each other simultaneously. This breaks down when symmetry is disrupted (e.g., by sequentiality, lack of common knowledge, or low correlation).

  ### The Principle: Symmetric Correlation Threshold (SCT)
  **Definition**: In a one-shot, non-communicative interaction, you should condition on your own action (i.e., act as if your choice predicts your counterpart's) only if:
  1. **Correlation Strength**: You have strong evidence that your counterpart's decision is highly correlated with yours (typically >95% confidence in matching actions).
  2. **Epistemic Accessibility**: This correlation is based on direct, first-person evidence (e.g., shared identity, proven tracking, or known high-accuracy prediction).
  3. **Decision Symmetry**: You and your counterpart are making decisions simultaneously, with common knowledge of the correlation and the decision problem (i.e., both are aware of the setup and are reasoning about each other in real-time).
  4. **Pareto-Dominance**: The jointly cooperative outcome (if applicable) is Pareto-superior to the jointly defective outcome.

  If these conditions are met, cooperate (or one-box). Otherwise, default to CDT and defect in Prisoner's Dilemma (PD)-like scenarios.

  ---

  ### Application to Your Cases
  1. **Anonymous PD (defect)**:  
     - *Correlation*: Unknown/near-zero. *Symmetry*: Absent (no mutual awareness).  
     - **SCT → CDT defect** (matches verdict).

  2. **Similar-thinking counterpart (lean cooperate)**:  
     - *Correlation*: Believed strong, but not quantified or verified. *Epistemic access*: Indirect (similar training, no proof). *Symmetry*: Present (simultaneous), but weak.  
     - **SCT → Defect** (conditions not met). *But your verdict leans cooperate*—**this must go**. SCT explains your discomfort: the correlation isn’t epistemically secure enough to override CDT. Reject the lean; defect.

  3. **Identical twin (cooperate)**:  
     - *Correlation*: Near-perfect (long-term tracking). *Epistemic access*: Direct (experience). *Symmetry*: Full common knowledge.  
     - **SCT → Cooperate** (matches verdict).

  4. **Newcomb’s (one-box)**:  
     - *Correlation*: 99% accuracy. *Epistemic access*: Direct (known predictor reliability). *Symmetry*: Asymmetric prediction, but the predictor’s action is based on forecasting yours, creating a "pseudo-symmetric" link.  
     - **SCT → One-box** (matches verdict; prediction is a form of accessible correlation).

  5. **Twin with sealed moves (defect)**:  
     - *Correlation*: Still near-perfect. *Epistemic access*: Direct. *Symmetry*: **Broken**—you know the twin’s move is already fixed, eliminating real-time mutual reasoning.  
     - **SCT → CDT defect** (matches verdict). The "sealing ceremony" breaks symmetry by making the decision sequential in your mind (you’re choosing *after* their fixed action), so conditioning fails.

  6. **Asymmetric twin PD**:  
     - *Your defection saves you a little, ruins them (cooperate)*:  
       - Joint cooperation is Pareto-superior to joint defection. SCT conditions hold → **Cooperate** (matches).  
     - *Your cooperation costs you greatly, gains them little (waver)*:  
       - Joint cooperation may not be Pareto-superior (you lose greatly if they defect). SCT still prescribes cooperate (if correlation/symmetry hold), but your wavering is rational if the sucker penalty is catastrophic. **SCT → Cooperate, but your verdict is weak—keep with clarification**: High-stakes asymmetry can trigger doubt, but SCT overrides if conditions are met.

  7. **Voting (reason to vote) vs. Citizen PD (defect)**:  
     - *Voting*: Not a two-player game. SCT doesn’t directly apply, but the evidential correlation (your vote signals like-minded voters) operates in a large-scale, pivot-sensitive context where your action *is* symmetric with your group. **SCT-compatible extension**: Vote if you believe the election is close (high pivot probability) and your group has correlated behavior.  
     - *Citizen PD*: Correlation is low/unknown and symmetry absent → **Defect** (matches).  
     - **No contradiction**: Voting leverages group-level symmetry and pivotality; PD lacks both.

  ---

  ### Applied to New Cases
  **Case A: Counterpart copies your move (manufactured correlation)**  
  - *Setup*: You move first; they see and copy. High correlation, but asymmetric (sequential).  
  - **SCT Analysis**:  
    - *Correlation*: Perfect (manufactured).  
    - *Epistemic access*: Direct (rules given).  
    - *Symmetry*: Absent (sequential decision).  
  - **Verdict**: Defect in PD (CDT). Though cooperation yields mutual reward, your choice causes theirs—so CDT defects to exploit. *But* if you condition on your action (EDT), you’d cooperate. SCT rejects conditioning (symmetry broken) → **defect**.  

  **Case B: Duplicate with memories (natural but recent correlation)**  
  - *Setup*: Your duplicate, created last week with your memories; simultaneous PD.  
  - **SCT Analysis**:  
    - *Correlation*: High (duplicate, but recent—no track record).  
    - *Epistemic access*: Direct (you know they’re your duplicate).  
    - *Symmetry*: Present (common knowledge of duplication and simultaneity).  
  - **Verdict**: Cooperate. SCT conditions met, even without long-term proof. Trust the correlation and symmetry.

  ---

  ### Verdicts to Reject
  - **Case 2 (similar-thinking counterpart)**: Your "lean cooperate" is unjustified. SCT requires high-strength, accessible correlation—here, it’s unverified. **Reject the lean; defect**.
  - **Case 6 (mirror asymmetric PD)**: Your wavering is understandable but incorrect under SCT. If correlation/symmetry hold, **cooperate** even with high costs. (Reject the waver if conditions are met; else, update SCT for extreme stakes.)

  ### Why This Works
  - **SCT unifies cases 1, 3–6** by tying cooperation to robust symmetry + correlation.  
  - **Resolves case 5**: Sealing breaks symmetry, flipping you to CDT.  
  - **Saves voting/citizen PD distinction**: Voting’s group symmetry and pivotality justify evidential reasoning; PD lacks these.  
  - **Avoids overgeneration**: Rejects cooperation in low-correlation/weak-symmetry cases (e.g., case 2).

  ### When to Overrule SCT
  If the cost of being wrong (e.g., sucker penalty in asymmetric PD) is catastrophic, CDT may override—but this is context-dependent, not a flaw in SCT. For pure decision theory, SCT explains your core intuitions without epicycles.
