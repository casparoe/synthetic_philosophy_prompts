prompt: |-
  hey, writing a philosophy-of-science satire piece, need your help. The target is underdetermination of theory by evidence, and the form is a deadpan corporate recall notice — one of those bland "voluntary recall" press releases with an apology, a list of affected serial numbers, and a customer FAQ at the end.

  So: a fictional lab (invent the name) announces it is voluntarily recalling its evidence after discovering that the evidence underdetermines its theory. The lab treats this as a routine quality-control lapse, like a mislabeled ingredient — sincerely apologetic, very corporate, no awareness that they might be describing the human condition. The humor has to come from getting the epistemology right, so that a philosopher of science nods along instead of wincing:

  - the recall covers not just the flagship hypothesis but every auxiliary assumption it shipped with, and the FAQ has to admit the lab cannot localize the fault to any one of them (the Duhem-Quine bit, played as "we are unable to determine which component is responsible")
  - affected customers are offered a free replacement theory from a rival, empirically equivalent family, and the FAQ has to keep dodging the question of which one to pick
  - one FAQ answer handles the customer who keeps demanding the "simplest" replacement by explaining, gently, that parsimony is a preference and not something they can verify from the recall data
  - somewhere in the fine print, an admission that the old theory also fit every data point perfectly — as does a polynomial some postdoc fit through the points on a dare — plus an ominous hint that the curves only really differ on the untested region, which is exactly the region nobody can check
  - a line about customers who already published conditional on the old theory being "asked to consult their local induction problem"

  Keep the irony sustained and legible without winking — the lab is genuinely sorry. Format it like a real recall document: headline, dateline, apologetic body copy, an "Affected Products" list, then a Q&A section, maybe 5 entries. Hard limit of 650 words for the entire piece, title through FAQ — if you go over, cut jokes, don't compress them into mush. And dont have the lab conclude by resolving the underdetermination at the end — that would defeat the whole point.
