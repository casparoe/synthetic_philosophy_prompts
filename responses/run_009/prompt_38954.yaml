  Decision Tree on Legal Validity

  Answer the following questions using only the concrete cases described.

  Question 1 (Substance: Injustice):
  In the grudge-informer case, was the Nazi statute (validly enacted, published, prospective, and clear) that criminalized derogatory remarks valid law at the time of the defendant's act?
     - NO: You hold the strong natural law view: a gravely unjust enactment is not law at all. (Leaf 1)
     - YES: Go to Question 2.

  Question 2 (Enforcement of unjust law):
  In the grudge-informer case, should the court have enforced the statute by punishing the defendant?
     - NO: You hold the softer natural law view: the statute is law, but it is so unjust that it loses its claim to obedience. (Leaf 2)
     - YES: Go to Question 3.

  Question 3 (Procedure: Defects with benign content):
  Consider a rule that is substantively benign (e.g., requiring drivers to stop at red lights) but is either (a) kept secret from the public, or (b) retroactive (applying to acts before its enactment), or (c) contradictory (another valid rule says drivers may proceed through red lights). Is this rule valid law?
     - NO: You hold Fuller's position: gross failures of procedural morality (like secrecy or retroactivity) defeat legality. (Leaf 3)
     - YES: Go to Note.

  Note: If you reached this point, you are in the positivist family. The cases provided do not distinguish between inclusive and exclusive positivism. To do so, one would need to ask an abstract question: "Can the rule of recognition incorporate moral criteria as conditions of legal validity?" If yes, you are an inclusive positivist; if no, exclusive. (Leaf 4: Positivism, inclusive or exclusive)

  Unnamed Positions:
  The tree does not reach every logically possible combination. For example:
  - If one were to hold that the unjust statute is not law (Q1=NO) and that the procedurally defective benign rule is not law (Q3=NO), that would be a hybrid of strong natural law and Fuller's view. This position is not named because it is unexplored or considered redundant: if substance alone can invalidate, why also require procedure? 
  - If one were to hold that the unjust statute is law (Q1=YES) and should be enforced (Q2=YES), but the procedurally defective benign rule is not law (Q3=NO), that is Fuller's view (already covered).
  - If one were to hold that the unjust statute is law (Q1=YES) but should not be enforced (Q2=NO) and also that the procedurally defective benign rule is not law (Q3=NO), that would be a hybrid of softer natural law and Fuller. This position is not named, possibly because it combines two different critiques of law.

  Summary: The deepest fork is on the substance of law (Question 1), separating strong natural law from all others.
