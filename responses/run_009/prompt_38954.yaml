  ### Decision Tree: What Makes Law Valid?  
  *Based on concrete cases from the Hart-Fuller debate (Nazi grudge-informer, Fuller's monarch, benign rules with defects). Answer each question using only the cases, without abstract labels.*

  ---

  **Question 1: In the grudge-informer case, was the Nazi statute (validly enacted, published, prospective, but deeply unjust) valid law *at the time* the defendant acted?**  
  - **NO** → **Leaf A: Strong Natural Law**  
    *A gravely unjust enactment is not law at all (e.g., Radbruch, Augustine).*  
  - **YES** → Proceed to Question 2.  

  **Question 2: In the grudge-informer case, should the court have enforced the statute by punishing the defendant?**  
  - **NO** → **Leaf B: Softer Natural Law**  
    *The statute is law, but it is defective, degenerate, or loses its claim to obedience (e.g., Aquinas, Finnis).*  
  - **YES** → Proceed to Question 3.  

  **Question 3: Is a substantively benign rule (e.g., "drivers must stop at red lights") valid law if it suffers a gross procedural defect like secrecy (unpublished), retroactivity, or contradiction with another valid rule?**  
  - **NO** → **Leaf C: Fuller's Procedural Natural Law**  
    *Gross failures of the "inner morality of law" (e.g., publicity, non-retroactivity) defeat legality, regardless of content.*  
  - **YES** → Proceed to Note.  

  **Note:** If you answered YES to all three questions, you are in the **positivist family**. The cases alone cannot distinguish inclusive from exclusive positivism. Both agree:  
  - An unjust statute is valid law if enacted properly (Q1 YES).  
  - Courts should enforce valid law, even if unjust (Q2 YES).  
  - Procedural defects do not *invalidate* law if the system’s criteria are met (Q3 YES).  

  **To split positivism, ask this abstract question:**  
  *"Can moral criteria be part of a legal system's rule of recognition (e.g., a constitution requiring 'just' laws)?"*  
  - **YES** → **Inclusive Positivism (Hart)**  
  - **NO** → **Exclusive Positivism (Raz)**  

  ---

  **Unnamed Positions** (Logically possible but unoccupied):  
  - **Q1 NO + Q3 YES**: *Unjust law invalid, but procedurally defective benign law valid.* Unattractive—why privilege procedure over justice?  
  - **Q1 YES + Q2 NO + Q3 YES**: *Unjust law is valid but not enforceable; procedurally defective benign law valid.* Incoherent—undermines obligation without consistency.  
  - **Q1 NO + Q3 NO**: *Both unjust law and procedurally defective benign law invalid.* Unexplored—combines strong natural law and Fuller redundantly.  

  ---

  **Limitations:**  
  - **Inclusive Positivism vs. Fuller** cannot be split by cases alone. Both reject the Nazi statute as enforceable (Q2 NO? NO—Fuller might accept enforcement if procedurally sound, but his focus is on procedure). *Fuller holds that procedural defects invalidate law; inclusive positivists see them as social facts. The fork requires an abstract question:* "Are Fuller's procedural desiderata *conceptually necessary* for legality, or just contingently linked to it?"  
  - **Softer Natural Law** is not tested on procedure—it is defined by substantive injustice.  
  - **Exclusive/Inclusive Positivism** share all case-answers; their split depends on the nature of the rule of recognition.  

  **Summary:** The deepest fork is on the substance of law (Question 1), separating natural law theories (which deny validity to grave injustice) from positivist and procedural theories (which affirm it).
