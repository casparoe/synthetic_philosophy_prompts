     Q1: YES, Q2: NO -> softer natural law, covered.
     Q1: NO -> strong natural law, covered.
     Q1: YES, Q2: YES, Q3: YES -> positivism, covered.

  But what if someone says Q1: NO and also believes that procedural defects invalidate? We don't ask about procedure. So we have not captured that. Similarly, what if someone says Q1: YES, Q2: NO, and also says that the procedurally defective benign rule is not law? We don't ask Q3 for them.

  To capture all, we would need a tree that asks about substance and then about procedure independently. But then we have 4 leaves for the combinations:

  But let's list the logical space:

  Let S be: unjust statute is valid law.
  Let P be: procedurally defective benign rule is valid law.

  We don't have an independent question for the enforcement of the unjust statute, but that is part of the softer natural law.

  Alternatively, let's have two main forks: one on substance and one on procedure.

  But then we lose the softer natural law.

  Given the constraints, I think the first tree is acceptable.

