prompt: |-
  I spent the better part of four decades in physiology and clinical research before retiring, and I have lately been reading philosophy of medicine in earnest. Before I go further, I want the specification I never thought to demand while I was practicing: what must an account of health and disease actually deliver to count as adequate? Write the desiderata. I am less interested in a tour of naturalism and normativism than in the requirements list itself: the cases a theory of disease must classify correctly (or explain why classification fails), the distinctions it must respect, the biological and institutional facts it cannot contradict, with the case behind each. To keep the list from becoming anodyne, please at least weigh the following, drawn from my working life:

  - The reference-class problem. Normal values are defined relative to a population — age, sex, sometimes ancestry — and the choice of population can move the same measurement across the boundary between health and disease. Any adequate account must say what fixes the reference class, and it must do so without collapsing into the claim that disease is mere deviation from a local average, since we rightly refuse to call the tallest villager diseased.

  - Pre-disease and risk states. Osteopenia, pre-hypertension, asymptomatic bacteriuria in elderly women. These categories were partly manufactured by panels and partly by genuine longitudinal evidence, and they expand when definitions are relaxed. An account must either mark them off from disease proper in a principled way or bite the bullet and say why most of what internal medicine treats is not, strictly, disease — and it should say which of those two it is doing.

  - Evolutionary function and its limits. Accounts in the naturalist tradition lean on species-typical selected function, but selection built trade-offs, not optima: the recurrent laryngeal nerve's detour, the vertebrate eye's blind spot, senescence itself. If "function as designed by selection" is the criterion, the healthy body is a museum of design failures, and an account has to say why the design flaws of the species are not thereby diseases, while the design flaws of the individual are.

  - Contested conditions. Homosexuality's removal from diagnostic manuals, the Deaf community's insistence that deafness is a culture rather than a pathology, grief as a target for treatment. Whatever the right verdicts, these cases were and remain hotly contested, and mere statistical deviation does not explain the heat. An account of disease owes an explanation of why the boundary in these cases is contested at all, not just a ruling.

  - The insurance and gatekeeping function. Whatever else it is, the concept of disease decides what medicine is obligated to treat and what insurers must pay for. Anchor the adequacy conditions to that purpose if you like — a definition good enough to draw the boundary of clinical obligation — but say explicitly whether you think that purpose distorts the resulting list.

  Two further demands. First, commit. Tell me which of the desiderata are genuine and which are the prejudice of one camp, rather than laying out the options for me to choose among. Second, tell me whether some subset of the requirements is jointly unsatisfiable — I confess I suspect that value-neutrality (the demand that disease judgments be scientific rather than moral) cannot be satisfied alongside the demand to explain the contested cases, and I want that suspicion confirmed or dismantled with reasons, not diplomacy. Finally, name the single requirement on your list that excludes the most existing theories, and defend that ranking. If you think any of my five candidate requirements is confused or misbegotten, say so directly and say why; I would rather have a corrected list than a deferential one.
reasoning: |-
  Okay, let me tackle this systematically. The user is a retired physician-researcher with decades of experience, now diving deep into philosophy of medicine. They're not asking for a survey of existing theories but for a concrete set of adequacy criteria for any theory of health/disease. Their frustration with academic equivocation is palpable - they want commitments, not options.

  First, I need to unpack their five key challenges. The reference-class problem is fundamentally about avoiding biological relativism while acknowledging population variability. Pre-disease states expose medicine's creeping expansionism - is this scientific progress or boundary-blurring? Evolutionary function forces us to confront whether "natural" equals "healthy" when nature is full of suboptimal designs. Contested conditions reveal how disease labeling carries social power. And the insurance function reminds us this isn't just academic - lives and resources hang in the balance.

  The user's suspicion about value-neutrality being incompatible with explaining contested cases is acute. Most theories fail precisely here - naturalists can't explain why statistical anomalies aren't automatically diseases, while normativists struggle to explain why some conditions (cancer) seem value-independent. The reference-class problem might be the ultimate litmus test though, as it requires reconciling biological reality with clinical utility.

  For the desiderata list, I'll start with non-negotiables: any theory must distinguish disease from statistical variation, account for pre-disease states, reconcile evolutionary trade-offs, explain social contestation, and interface with healthcare systems. The killer requirement is probably #4 - explaining why some boundaries are fought over. This exposes how disease concepts straddle biological facts and social values in ways most theories can't handle.

  When structuring the response, I'll lead with the 7 core requirements before addressing their specific suspicions. The reference-class solution will need to anchor "normal function" in species-typical ranges while allowing clinical nuance - no easy feat. For contested conditions, I'll argue the heat comes from competing conceptions of human flourishing that disease labels inevitably engage.

  Most importantly, I won't hedge. The user wants to know which desiderata are essential versus theoretical baggage. Value-neutrality must be abandoned to explain contested cases - that's the unavoidable conclusion. And among all requirements, the need to explain boundary disputes (#4) disqualifies the most existing theories by revealing their oversimplifications.
answer: |-
  You're demanding rigor where academe often offers hand-waving. Having lived the tension between biomarker and lived experience, you deserve a blade, not a sponge. Below is the distilled desiderata list—non-negotiable criteria any adequate account of health/disease must satisfy. I’ve steeled each with cases from your practice, committed to positions, and flagged conflicts.  

  ### Core Desiderata for an Account of Health/Disease:  
  1. **Solves the Reference-Class Problem Definitively**  
     - *Must deliver*: A principled biological basis for selecting reference populations that avoids statistical relativism.  
     - *Case*: Bone density in a 70yo vs. 30yo. An account must explain why "normal for age" isn’t arbitrary but anchored in **species-typical functional capacity for that life stage**. Tallness isn't disease because it doesn’t impede functional capacity *expected for a human organism*; osteoporosis in the elderly *does* because it undermines structural integrity essential to mobility—a cross-species functional requirement.  
     - *Failure mode*: Theories collapsing into "deviation from local average" (e.g., calling all Sioux taller than 6' diseased).  

  2. **Demarcates Disease from Pre-Disease/Risk States**  
     - *Must deliver*: A criterion forcing the distinction between *current pathological state* and *probabilistic risk*.  
     - *Case*: Osteopenia vs. osteoporosis. An account must show why lowered bone density *becomes* disease only when it crosses a threshold where **spontaneous harm under typical conditions** becomes probable (e.g., fracture from minor trauma). Pre-disease is risk; disease is dysfunction manifesting harm.  
     - *Failure mode*: Conflating risk with pathology (e.g., treating all pre-hypertension as disease inflates medicalization).  

  3. **Explains Evolutionary "Design Flaws" as Non-Diseases**  
     - *Must deliver*: Why species-level trade-offs (e.g., recurrent laryngeal nerve) aren’t diseases, while individual defects (e.g., cleft palate) are.  
     - *Case*: Senescence. An account must anchor pathology in **failure of biologically designed functions within an individual’s lifespan**, not species-typical constraints. Senescence is an evolved program, not a failure; cancer is a breakdown of cellular regulation.  
     - *Failure mode*: Calling the blind spot a "disease" because it’s suboptimal.  

  4. **Explains Contested Conditions’ Heat, Not Just Their Status**  
     - *Must deliver*: Why boundary disputes arise and persist, exposing tensions between biological dysfunction and social values.  
     - *Case*: Deafness. An account must recognize that **dysfunction exists on a biological level (cochlear damage)** but **harm is mediated by socio-environmental fit**. Contention arises when a condition is biologically dysfunctional but permits flourishing in accommodating environments. The account must separate biological assessment from harm assignment.  
     - *Failure mode*: Dismissing Deaf community arguments as "denialism"—or pathologizing them via biology alone.  

  5. **Interfaces with Clinical Gatekeeping Without Collapsing Into It**  
     - *Must deliver*: A concept usable for resource allocation *without* defining disease solely by treatability or insurability.  
     - *Case*: Asymptomatic bacteriuria in elderly women. An account must distinguish **biological dysfunction** (bacterial invasion) from **clinical significance** (harm potential). Treatment obligation arises only when dysfunction causes or risks harm. The definition cannot make "disease" contingent on insurance contracts, but must clarify why some dysfunctions warrant intervention.  
     - *Distortion alert*: Yes, gatekeeping pressures *can* distort definitions (e.g., expanding "disease" to secure payment), but a robust account resists this by prioritizing biological dysfunction over social utility.  

  6. **Preserves Value-Neutral Core While Explaining Value-Laden Boundaries**  
     - *Must deliver*: A biologically grounded core of "dysfunction" separable from judgments of harm/disadvantage.  
     - *Case*: Homosexuality’s declassification. The *dysfunction* claim failed because no **biologically designed reproductive or attachment function** is universally impaired. Contention arose from *harm* judgments rooted in social norms. An account must split the concept: **disease = biological dysfunction; illness = socially situated harm**.  
     - **Your suspicion confirmed**: Pure value-neutrality *is* impossible for *boundary decisions* (e.g., when dysfunction is mild/compensated). But the dysfunction core *can* be value-neutral. Theories fail when they conflate dysfunction with harm (normativism) or ignore harm’s role in medicalization (crude naturalism).  

  7. **Avoids False Universality**  
     - *Must deliver*: Acknowledgement that some conditions resist stable classification due to individual variation or evolutionary constraints.  
     - *Case*: Chronic fatigue syndrome. An account must allow that **detectable dysfunction may exist without meeting species-typical thresholds** or clear biomarkers—without defaulting to "non-disease."  

  ---

  ### Your Suspicions Addressed Directly:  
  - **Value-Neutrality vs. Contested Cases**: Your intuition is correct. **Value-neutrality (in identifying dysfunction) is compatible with explaining contested cases only if the theory explicitly separates biological dysfunction from social harm**. Normativists conflate them; naturalists often ignore the harm layer. A hybrid account *must* do both (e.g., Wakefield’s "harmful dysfunction" fails by making harm essential to the definition).  
  - **The Killer Requirement**: **#4 (Explaining Contested Conditions’ Heat)** excludes the most theories. Naturalism (Boorse) can’t explain why biological dysfunction (e.g., deafness) is contested; normativism (Engelhardt) can’t explain why some conditions (e.g., metastatic cancer) are *un*contestedly diseases. Only a layered account survives.  
  - **Misfired Requirement?** Your "insurance/gatekeeping" point isn’t confused—but it’s not a *definitional* requirement. It’s a **downstream application**. A definition must *enable* this function without being dictated by it.  

  ---

  ### The Unavoidable Commitment:  
  Adequate accounts **must be hybrid**. They need:  
  - A **naturalistic core**: Dysfunction as failure of biologically designed functions (selected or physiologically maintained).  
  - A **normative overlay**: Harm/disadvantage assessed in context (social/environmental).  
  - **Distinction preservation**: Dysfunction ≠ harm; disease ≠ illness; treatment obligation ≠ biological defect.  

  **Why existing theories fail**: Boorse’s statistical-functional theory (#1 fails on reference classes; #4 fails on contested cases). Wakefield’s harmful dysfunction (#5 fails by making disease contingent on social harm). Pure normativism (#3 fails on design flaws).  

  **The hardest trade-off**: Between universality (a single definition for all conditions) and clinical precision (e.g., cancer vs. grief). I argue universality is impossible—and the account must admit this.  

  This isn’t diplomacy. It’s the triage your question demands.
