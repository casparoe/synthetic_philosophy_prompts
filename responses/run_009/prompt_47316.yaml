prompt: |-
  A friend of mine, a mathematics graduate, explained the Pasadena paradox to me over coffee, and I'm inclined to believe him, but a couple of things he said don't quite hang together and I don't have the background to locate the problem. Here is his account, as close to word for word as I can reconstruct it:

  "You know the St Petersburg game, where a fair coin is flipped until it lands heads and the payoff doubles with each additional flip, so the expected value comes out infinite even though you're almost certain to win very little? The Pasadena game is the sequel, and it's worse. Same setup: flip a fair coin until the first heads, on flip n. But now the payoff is 2 to the nth power, divided by n — and the sign alternates. You win that amount if heads first appears on an odd-numbered flip, and you lose it if heads first appears on an even-numbered flip. So the expected value is the alternating harmonic series: one, minus a half, plus a third, minus a quarter, and so on. That series diverges — the partial sums oscillate and never settle on anything. And because the series never settles, you can add the terms in a different order and get any total you like; Riemann proved that for series of this kind. So the game's expected value is undefined rather than merely large, and since decision theory tells you to choose the option with the highest expected value, decision theory is refuted. A theory of rational choice that can go completely silent on a perfectly well-defined question has failed."

  Please audit this account for me in British English, organised into the following sections, in this order:

  1. What he got right (roughly 150 words) — the points a philosopher of decision theory would accept without complaint.
  2. What is subtly wrong (roughly 350 words) — the claims a mathematician or decision theorist would wince at. I would especially like you to examine carefully his statement that the alternating harmonic series diverges and his explanation of why the expected value is undefined; check what that series actually does in the natural order of play, and whether the undefinedness of the expectation is really a fact about the series failing to settle or a fact about something else. Please go claim by claim.
  3. What his summary leaves out (roughly 250 words) — anything standard in discussions of this paradox that his account omits and that would change the picture, including anything that would push back on his conclusion that there is no fact of the matter about what the game is worth.
  4. Whether his conclusion survives (roughly 150 words) — setting right whatever needs setting right: does the claim that decision theory is refuted, rather than merely embarrassed, follow from the accurate parts of what he said?

  I'm not asking for references or further reading — just your own assessment. If it matters for your audit, my own tentative view is that he is right that something deep has gone wrong with expected value theory here, but wrong that the mathematics is what he says it is; tell me if that combination is even coherent.
reasoning: |-
  Hmm, the user wants me to audit their friend's explanation of the Pasadena paradox. The friend claims that the expected value is undefined because it's based on the alternating harmonic series which diverges and can be rearranged to sum to any value, thus "refuting" decision theory. The user has structured this into four specific sections: what's right, what's subtly wrong, what's omitted, and whether the conclusion survives.

  First, I need to verify the mathematical claims. The friend is correct about the game setup: flipping a fair coin until first heads on flip n, with payoff (-1)^{n+1} * 2^n / n. The expected value calculation does lead to the alternating harmonic series: ∑_{n=1}^∞ (-1)^{n+1} / n. But the friend says this series "diverges" - that's incorrect! The alternating harmonic series actually converges conditionally to ln(2). That's a fundamental error. Riemann's rearrangement theorem does apply to conditionally convergent series, allowing different sums when terms are reordered, but here the expectation is defined by the natural order of n=1,2,3... which sums to ln(2).

  The "divergence" confusion might stem from the harmonic series itself (without alternation) which diverges, but the alternating version converges. The undefinedness in decision theory doesn't come from divergence but from rearrangement sensitivity when considering different ways to "collect" the probabilities.

  The friend also misattributes the problem - it's not that the series doesn't settle (it does converge to ln(2) in natural order), but that the expectation concept itself becomes unstable under rearrangement. This relates to how we define expected value for infinite state spaces, not a failure of the series to converge.

  For omissions: standard discussions mention that the expectation is conditionally convergent, so its value depends on order. Some resolutions involve weak dominance principles (Pasadena game dominates any finite loss but is dominated by any finite gain) or using weaker convergence concepts like Cesaro summation. The St. Petersburg paradox comparison is apt but incomplete - both involve infinite expectations but different issues.

  The conclusion: decision theory isn't "refuted" but shows limitations. The problem is well-known in decision theory literature with proposed solutions like finite resource assumptions or alternative decision rules (e.g., risk-weighted expected utility). The mathematics isn't flawed; it's the application of expected value to pathological games that's problematic.

  User's tentative view seems coherent: recognizing a deep problem while doubting the friend's mathematical account is reasonable. The real issue is the fragility of expected value when dealing with conditionally convergent series in infinite state spaces.
answer: |-
  ### 1. What He Got Right (Approx. 150 words)  
  Your friend accurately describes the Pasadena game’s structure: a fair coin is flipped until the first heads on flip *n*, with payoff \((-1)^{n+1} \cdot 2^n / n\). He correctly notes that the *formal* expected value (EV) is the alternating harmonic series \(\sum_{n=1}^{\infty} (-1)^{n+1} / n\). He is right that this series **does not converge absolutely** (due to the harmonic series divergence), and that **Riemann’s rearrangement theorem** applies: reordering terms can yield any real number or make the series diverge. He’s also correct that standard **decision theory relies on a well-defined EV** to recommend choices, and that this game exposes a problem when EV is undefined. Philosophers accept these points—the setup is valid, the series is rearrangement-sensitive, and its undefinedness challenges decision rules prioritising EV maximisation.

  ### 2. What Is Subtly Wrong (Approx. 350 words)  
  His account contains mathematical inaccuracies and misattributions:  

  - **"The alternating harmonic series diverges"**: This is false. The series \(\sum_{n=1}^{\infty} (-1)^{n+1}/n\) **converges conditionally** to \(\ln(2) \approx 0.693\) in its natural order. It "diverges" only in the technical sense of lacking *absolute* convergence (i.e., \(\sum |(-1)^{n+1}/n| = \sum 1/n\) diverges). Crucially, **it does not oscillate forever without settling**; partial sums \(s_N = \sum_{n=1}^N (-1)^{n+1}/n\) approach \(\ln(2)\) as \(N \to \infty\).  

  - **"The expected value is undefined because the series never settles"**: The undefinedness **does not stem from divergence in the natural order**. The series *converges* to \(\ln(2)\), but the problem arises because:  
    (i) The expectation’s formal definition requires summing probabilities times payoffs *in the order of the states* (here, \(n=1,2,3,\ldots\)). This yields \(\ln(2)\).  
    (ii) However, Riemann’s theorem implies that **rearranging the *summation order* of states** (e.g., grouping odd/even flips differently) can produce arbitrary EVs. This violates the requirement that EV be invariant under relabelling of outcomes—a core tenet of probability. Thus, **undefinedness reflects sensitivity to state ordering**, not inherent oscillation.  

  - **"The series diverges [...] so the EV is undefined"**: This conflates two issues. **Conditional convergence** (not divergence) enables rearrangement paradoxes. The EV is undefined **only if we insist on order-invariance**, not because the natural sum fails to exist.  

  - **Decision theory’s "failure" attribution**: He implies the mathematics forces undefinedness, but this is a **limitation of the standard EV framework** for conditionally convergent sums. The game’s probabilistic structure is well-defined; the struggle is in *defining* a consistent, order-invariant EV.

  ### 3. What His Summary Leaves Out (Approx. 250 words)  
  Key nuances in standard discussions soften his conclusion:  

  - **The natural order EV is \(\ln(2)\)**: In the sequence \(n=1,2,3,\ldots\), the series converges to \(\ln(2)\). Many argue this *should* be the game’s value, as states are naturally ordered by flip count. This challenges the claim that there’s "no fact of the matter."  

  - **Weak dominance principles**: Even with undefined EV, **rational constraints persist**. For example:  
    - The Pasadena game **weakly dominates** a sure loss of \(-\£K\) (for any finite \(K\)), as you might win positively.  
    - Conversely, it **is weakly dominated** by a sure gain of \(+\£K\) (for any finite \(K\)).  
    This suggests a "range" of acceptable values (\(-\infty < \text{EV} < \infty\)) without pinpointing one, but still guides preference over extreme alternatives.  

  - **Generalised decision frameworks**: Decision theorists (e.g., Easwaran, 2014) propose solutions:  
    - **Weak expectations**: Using Cesàro summability (averaging partial sums) gives \(\ln(2)\).  
    - **Finitised versions**: Assuming a cap on flips (e.g., realistic time/resource limits) yields a finite, well-defined EV.  
    - **Risk-adjusted metrics**: Alternatives like median payoffs or utility smoothing avoid undefinedness.  

  - **Contextual relevance**: The paradox vanishes if payoffs are in utiles (bounded utility), as unbounded wealth is unrealistic. His account ignores how decision theory often *adapts* to such cases.

  ### 4. Whether His Conclusion Survives (Approx. 150 words)  
  His conclusion that decision theory is "refuted" **does not survive intact**, though a milder critique holds. The mathematical errors (e.g., misstating divergence) undermine the "proof" of undefinedness, but the core issue—**EV’s order-dependence**—remains valid. Decision theory isn’t *refuted*; it’s **shown to be incomplete** when handling conditionally convergent expectations. Standard EV maximisation cannot rank the Pasadena game against all alternatives (e.g., it may incomparably dominate £0), but weaker rationality principles (like dominance) still apply, and amended frameworks resolve the paradox. Your tentative view is coherent: the mathematics (corrected) reveals a "deep problem" with naive EV applications, but this is a known limitation requiring refinement, not abandonment. Decision theory is "embarrassed" by needing auxiliary assumptions (e.g., state ordering), not falsified.
