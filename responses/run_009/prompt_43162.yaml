  ### Thought Experiment: The Gift of Gratitude

  Alex faces two similar situations: choosing a thank-you gift for a mentor, Dr. Bennett, who once saved Alex's career, and later for a neighbor, Sam, who helped Alex move apartments during a storm. In both cases, Alex considers a **handwritten letter paired with a bottle of expensive wine**. For Dr. Bennett, who collects fine wines and views generosity as a virtue, the wine's **costliness** is a reason *in favor* of the gift: it reflects the depth of Alex's gratitude. A year later, Alex prepares the same gift for Sam. But Sam, a recovering alcoholic who has been open about his financial insecurity and shame around luxury, would see the wine as a painful reminder of his struggles. Alex knows giving it would humiliate Sam and undermine the gesture’s intent. Here, the **costliness** of the wine feels like a reason *against* the gift—it signals insensitivity, not appreciation. Alex opts for a heartfelt letter alone. The stakes are comparable (repaying significant kindness), the agent and act-type identical (gift-giving for help received), and the feature (costliness) central in both decisions.

  ### Analysis
  **Particularist Reading (Valence Flip):**  
  Costliness flips valence. With Dr. Bennett, costliness *adds* value by symbolizing respect. With Sam, costliness *detracts* value by exacerbating shame. The same feature isn’t merely outweighed; it actively contributes to the wrongness. Removing costliness (e.g., giving cheap wine) would improve the gift for Sam but worsen it for Dr. Bennett. This captures the intuition that costliness isn’t a neutral carrier of context-free weight—it *becomes* toxic in Sam’s context.  

  **Generalist Reading (Defeater + New Reason):**  
  Costliness always provides a *pro tanto* positive reason (it expresses effort/respect). For Sam, this reason is **undercut** by Sam’s alcoholism (which negates wine’s appropriateness) and **outweighed** by an independent reason: "don’t cause psychological harm." The negative verdict arises from this *new* harm-reason plus the defeat—not from costliness itself turning negative.  

  ### Why Particularism Handles It Better  
  The generalist’s move feels ad hoc:  
  - **Artificial Splitting:** Harm isn’t independent of costliness—it arises *because* the gift is expensive. Sam’s shame stems from *both* the alcohol (a separate feature) *and* the luxury (costliness), making it implausible to isolate costliness as still "positive but defeated."  
  - **Intuitive Unity:** We criticize Alex for the *costly* gift to Sam, not just for giving wine. Costliness isn’t a drowned-out positive; it’s *why* the gift is offensive. The generalist must fragment this into "disabled positive + new negative," which misaligns with moral experience.  

  ### Crucial Detail Enabling the Flip  
  **Sam’s pre-existing shame about financial status.** Without this, costliness might remain positive (but overridden by alcoholism alone) or neutral (if Sam merely disliked wine). The shame *transforms* costliness into a direct source of harm—it’s not just an added defeater. Remove this, and the flip vanishes, reverting to a standard "outweighed reason" case.  

  ### Generalist’s Best Shot: Auxiliary Machinery  
  The generalist could invoke:  
  1. **Enablers/Disablers:** Costliness’s positive reason requires an *enabler* (e.g., recipient’s ability to appreciate luxury). Sam’s shame *disables* this, so costliness provides *no* reason. The negative verdict then comes from a separate reason (e.g., "avoid triggering shame").  
  2. **Conditional Defaults:** "Costliness is a reason *if* it won’t cause harm; else, it’s neutral/negative."  

  **Costs to Generalism:**  
  - **Conceding Holism:** Enablers admit reasons are context-dependent—the valence *effectively* flips if a feature’s reason-generating power vanishes outside narrow conditions.  
  - **Complexity:** The generalist must explain why "Sam’s shame" disables costliness *without* being part of costliness’s moral valence. This feels terminological rather than substantive.  
  - **Loss of Parsimony:** Where particularism sees *one* feature with context-sensitive polarity, generalism requires layers (reasons, enablers, defeaters) that obscure the intuitive unity of the case.  

  ### Conclusion  
  The scenario pressures generalism: its defeater+new-reason story feels strained because costliness isn’t inertly positive for Sam—it *fuels* the wrongness. Enablers help, but they risk smuggling in the holism particularists champion. Ultimately, the case reveals how a feature’s moral contribution can genuinely invert, not just get silenced or outweighed.
