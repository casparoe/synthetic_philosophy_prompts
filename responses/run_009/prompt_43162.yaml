  I want a thought experiment about moral particularism, built to a pretty specific spec. The background: particularists like Dancy claim that a feature which counts in favor of an action in one context can count against it in another — the feature's valence can flip, it's not just that other reasons outweigh it. Generalists have a standing reply: nothing flips; the feature stays a positive reason but some further fact defeats or undercuts it, and some *different* reason explains the overall verdict. That reply is basically always available, which makes it suspicious. So I need a case where the redescriptive move looks bad.

  Construct a scenario, one paragraph, ordinary life (no trolleys, no ticking bombs, no demons), where a single feature plausibly reverses polarity between two situations, and design it so that the generalist's "defeater plus a different reason" story looks ad hoc rather than illuminating. The two situations should be as parallel as you can make them — same agent, same kind of act, comparable stakes — so that the only thing that changes is how that one feature contributes. The classic example people reach for is promising (normally a reason to keep it, but a promise extracted by threat seems to become a reason *against* keeping it, not just a reason that got outweighed) — feel free to use something fresher than that if you can pull it off.

  After the scenario, walk through both readings: the particularist's valence-flip story and the generalist's defeater story, and say which handles the case better and why. Then tell me honestly which detail of the case is doing the work — if you stripped that detail out, would we be back to an ordinary case where nothing flips and the generalist has nothing to explain? And finally, give the generalist their best shot: what auxiliary machinery would they invoke (default reasons, enablers vs. reasons in the strict sense, conditionals like "if you promised, that's a reason, unless..."), and does taking on that machinery cost them anything elsewhere — e.g. does it quietly concede the holism the particularist wanted all along? One more constraint: no fair just stipulating inside the case that the feature flips valence — the flip has to emerge from the concrete details, not be announced. Watch out that you dont accidentally build in a second reason that's doing all the work.
reasoning: |-
  We are to design a thought experiment where a single feature flips its moral valence between two very similar situations. The generalist will try to explain it by saying the feature remains a positive reason but is defeated by another factor, and then a different reason explains the overall negative verdict. We want to make that move look ad hoc.

   Let me try to create a scenario that avoids the usual examples and is set in ordinary life. I'll choose the domain of gift-giving, specifically the feature being the **costliness** of a gift. Normally, a costly gift is a positive reason (shows generosity, love, etc.). But in a context where the recipient is known to be struggling financially and proud, the same costliness might become a negative reason (causes embarrassment, pressure to reciprocate beyond means, etc.). We want two parallel situations with the same agent, same kind of act (giving a gift), and comparable stakes.

   Scenario:

   Alex is deciding on a birthday gift for two different friends, Jamie and Taylor, in two consecutive years. For Jamie, Alex knows that Jamie values expensive gifts as a sign of appreciation and has the means to reciprocate comfortably. Alex buys Jamie a very expensive watch. The costliness of the watch is a positive feature: it expresses Alex's deep regard and matches Jamie's expectations. The next year, for Taylor's birthday, Alex considers an equally expensive watch. However, Taylor has recently lost their job and is struggling to pay rent, and Alex knows that Taylor is proud and sensitive about financial disparities. Despite Taylor's admiration for nice things, Alex realizes that giving such an expensive gift would embarrass Taylor, making them feel indebted and inadequate. So Alex chooses a modest, thoughtful gift instead. In this case, the costliness of the watch (if given) would have been a negative feature, making the gift inappropriate.

   Now, we focus on the feature: the costliness of the gift. In the first case (with Jamie) it is a reason in favor of giving the expensive watch. In the second case (with Taylor) it is a reason against giving the expensive watch. The two situations are parallel: same agent (Alex), same kind of act (giving a birthday gift of a watch), comparable stakes (both are important friendships, birthdays are equally significant). The only difference is the financial situation and the psychological state of the recipient.

   Particularist reading: The valence of the feature "costliness" flips. In the first context, it is a positive reason; in the second, it is a negative reason. The change in context (the recipient's financial state and pride) doesn't just add a defeating reason (like "it would embarrass Taylor") that outweighs the positive reason of costliness. Instead, the costliness itself becomes a negative feature because it would cause harm (embarrassment) and because in that context it is a display of insensitivity.

   Generalist reading: The generalist will say that costliness is always a positive reason (it shows generosity, thoughtfulness, etc.). In the Taylor case, there is an additional feature that defeats that positive reason: the fact that Taylor is financially struggling and proud. This defeater (the risk of embarrassment and burden) outweighs the positive reason of costliness. Moreover, the generalist might say that there is a different reason that explains why Alex should not give the expensive gift: the duty to avoid causing harm or distress. So the overall verdict against giving the expensive gift is due to the defeater and this new reason.

   Why the particularist story handles it better: In the Taylor case, the costliness isn't just outweighed; it actually becomes a negative. How do we see that? Imagine if Alex were to give the expensive watch to Taylor anyway. We wouldn't say, "Well, at least Alex was generous, but unfortunately that generosity was outweighed by the harm." Instead, we might criticize Alex for being ostentatious or insensitive. The costliness of the gift in the context of Taylor's situation is itself a flaw. It's not that the costliness is still a good thing but we have a stronger reason against; rather, the costliness becomes a bad-making feature. The generalist's move to separate the defeater and then invoke a new reason (avoiding harm) seems to miss that the costliness is directly contributing to the harm. The harm is not independent of the costliness; it is because of the costliness that the harm arises. So the particularist can say that the same feature (costliness) is directly generating a negative reason in the second context.

   The crucial detail: The key detail that makes the valence flip plausible is the recipient's financial vulnerability and pride. Without that, we wouldn't have the flip. If we stripped that out and just had, say, Taylor being someone who doesn't like expensive gifts, then the generalist could say that costliness is still a positive reason but it is outweighed by Taylor's preference. But in our case, the costliness is not just outweighed; it becomes a negative because it is harmful in that context. The harm is intrinsically linked to the costliness.

   The generalist's best shot: The generalist might invoke a distinction between the base reason (costliness as a sign of generosity) and an enabling condition (the recipient being in a position to appreciate it without harm). In the Taylor case, the enabling condition (that the recipient can receive such a gift without distress) is absent, so the positive reason from costliness doesn't even come into play. Then, the generalist might say, there is an independent reason against causing harm, which applies because the expensive gift would cause harm. So the costliness isn't a negative reason; it's just that the positive reason is disabled and there is a separate negative reason (the harm) that is present. 

   However, this move might concede holism because it admits that the presence of a reason (from costliness) depends on the context (the enabling condition). Moreover, it's not clear that the harm is independent of the costliness. The harm is caused by the costliness. So the generalist is forced to say that the costliness is not a reason at all in the Taylor case? But that doesn't seem right either because we do hold the costliness against the gift in that context. Alternatively, the generalist might say that costliness is a reason that can be undercut. In the Taylor case, the undercutter is that the gift would cause harm, so the positive reason is undercut and a negative reason (the harm) takes over. But note: the negative reason is the harm, and the costliness is the cause of the harm. So the costliness is still playing a role in generating the negative reason. The particularist would say that the costliness is directly generating a negative reason in the Taylor case, whereas in the Jamie case it generates a positive reason.

   The cost of the generalist machinery: If the generalist invokes enablers, they are admitting that reasons are context-dependent in a way that undermines the idea of invariant valence. Also, the generalist now has to explain why the enabling condition isn't just part of the valence of the feature. Moreover, the generalist's story becomes more complex, having to distinguish between reasons, defeaters, enablers, and independent reasons. The particularist has a simpler story: the same feature can have different polarities in different contexts.

   Conclusion: In this case, the particularist reading seems more natural because the costliness of the gift in the Taylor case is not merely having its positive force canceled; it actively becomes a negative. The generalist's attempt to split the case into a disabled positive reason and a separate negative reason (the harm) seems artificial because the harm is directly caused by the costliness and we intuitively see the costliness as the problem.

   However, note that the generalist might push back: they can say that the feature "costliness" is not the same in both cases because in the Taylor case it is costliness-that-will-cause-distress. But the particularist can reply that the core feature (the monetary expense) is the same, and the context (the recipient's situation) changes how that feature functions.

