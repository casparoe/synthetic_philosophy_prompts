prompt: |-
  Something I keep noticing and I can't work out if it has a proper name or if I'm just pattern-matching badly. In a certain kind of contest, the rules seem to be: whoever holds on longest collects the prize, but everybody who's in keeps paying the whole time, and — this is the bit that makes it weird — if you give up, your losses don't just sit there as wasted money, they effectively convert into the winner's trophy.

  My brother-in-law runs charity fundraisers, and one of his games is auctioning off a £20 note where the runner-up ALSO has to pay their final bid (he puts it toward the charity, so nobody feels too robbed). He says it regularly goes past £50. I first thought oh, that's just people being irrational, but then I started seeing the same shape everywhere. Two people in a facebook argument going at it for six hours over something trivial — the "prize" is basically being visibly right, and the first one to stop replying is treated as having conceded, so all their invested hours just get handed to the other person as a win. My manager and a colleague once fought for two weeks by email over a £60 expense claim that both of them were surely spending more than £60 of salary on. Custody disputes where both parents torch the college fund fighting over who gets the kids' weekends. Even arguments in my pub quiz team about whether to challenge an answer, where nobody can back down without the other side getting the point.

  I know the sunk cost fallacy, but that only seems to cover half of it. Sunk cost is about me and my past costs dragging me forward — but in the cases I'm describing the competitive bit is doing real work: the reason I can't walk away isn't just my own wasted effort, it's that walking away actively hands the prize to somebody who has ALSO been paying, and everybody watching knows it. And it's not a straightforward zero-sum contest either, because both parties end up down in total, only one of them collects anything. Brinkmanship also comes to mind but that feels like it's about the risk of mutual destruction, whereas here the mutual loss isn't a risk, it's the default that happens every time.

  So, questions: does this exact structure have an established name, and if so, how do people who study it carve it off from plain sunk cost reasoning, from winner-take-all competition, and from brinkmanship? If it doesn't have a name of its own — or if the name only covers the auction version and not the flame war / lawsuit versions — then I'd want you to say so, and coin a term that covers the whole family, with a proper definition and some attention to where the edges are. Like: does it still count if the loser only pays half their bid? Does it still count with three bidders, where quitting benefits two rivals at once? Does it count when there's no audience, since in the flame war cases it feels like the spectators are what makes quitting so costly? I'm not after just a label, I want to know what the thing actually is and isn't.

  Also, if you would, write the answer in British English — this might go into a work thing and we're in the UK. Typos above are the phone's fault, probably.
reasoning: |-
  Okay, the user has described this recurring pattern they've noticed in various competitive situations. They've given examples like charity auctions, online arguments, workplace disputes, custody battles, and pub quiz debates. The core structure seems to be: two parties keep investing resources (money, time, effort) to win a prize, but if one quits, their losses effectively become part of the winner's reward. 

  Hmm, they're clearly frustrated that existing terms like "sunk cost fallacy" or "brinkmanship" don't fully capture this dynamic. The sunk cost fallacy explains why people continue based on past investments, but here there's the added competitive element where quitting actively benefits the opponent. Brinkmanship involves mutual destruction risk, whereas here mutual loss is guaranteed. 

  Right, I recall the dollar auction game fits their charity auction example perfectly - that's a formal economic model where bidding escalates irrationally because the second-highest bidder also pays. But does that term extend to their other examples? The Facebook argument and £60 expense claim seem similar psychologically but lack the explicit bidding structure. 

  The user wants precision: they're asking about boundary cases like partial payments, multiple players, or absence of spectators. For instance, in a three-person auction, quitting benefits both remaining players - does that change the dynamic? And spectators definitely intensify the shame of conceding in flame wars, but is that essential to the phenomenon? 

  They're clearly analytical - probably using this for professional purposes given the British English request. Might be preparing a training module or policy document about conflict resolution. The examples suggest they work in management or community roles. Underlying need seems to be: "How do I prevent these lose-lose scenarios in my organisation?" 

  I should distinguish the formal dollar auction (specific rules) from the broader escalation archetype. For the latter, "mutually assured waste" could work as a coined term - captures the inevitability of joint losses. Must clarify that while all dollar auctions create this waste, not all such waste scenarios are dollar auctions (e.g., the pub quiz has no monetary bids). 

  Key differentiators from related concepts: 
  - Unlike sunk cost fallacy, the rival's continued investment threatens to convert your costs into their profit 
  - Unlike brinkmanship, mutual loss isn't a risk but an expected outcome 
  - Unlike zero-sum games, total losses exceed the prize value 

  Boundaries matter: 
  - If loser pays only half, escalation might lessen but isn't eliminated 
  - Three players amplify the "kingmaker" dilemma when quitting 
  - No spectators reduce reputational pressure but don't remove the core driver 

  Better include mitigation strategies too - their work context will demand solutions. Things like third-party mediation or pre-agreed walk-away points. 

  Right, structure decided: 
  1. Introduce dollar auction as the "textbook" case 
  2. Generalise to the escalation pattern with a proposed term 
  3. Delineate boundaries with examples 
  4. Contrast with adjacent concepts 
  5. Offer practical disengagement tactics 

  Tone must stay academic but approachable - they're clearly intelligent but not necessarily an economist. And definitely British spelling throughout.
answer: |-
  This absolutely has a name for the core mechanism, and a broader conceptual framework for the pattern you're spotting. It's a fascinating and surprisingly pervasive trap. Here's the breakdown:

  1.  **The Textbook Case: The Dollar Auction (or All-Pay Auction with a Twist)**
      *   **What it is:** This is the *exact* structure of your brother-in-law's charity fundraiser. Auctioning a fixed prize (traditionally a $1 bill, hence the name) where *both* the highest bidder *and* the runner-up must pay their final bids. The winner gets the prize minus their bid, the runner-up loses their bid entirely.
      *   **Why it escalates:** Rationality breaks down quickly. Early bidders get locked in. If you're the current second-highest bidder, bidding just a tiny bit more could let you win the prize and recoup *some* of your losses, rather than losing everything. Simultaneously, the current leader feels compelled to defend their position to avoid becoming the loser who pays everything and gets nothing. This creates a vicious cycle of escalating bids far beyond the prize's value. The "sunk cost" isn't just wasted; it actively *funds the winner's apparent profit* and creates immense pressure to keep bidding to avoid catastrophic loss.
      *   **Name:** This is definitively called the **Dollar Auction** (originally described by economist Martin Shubik in 1971). It's a specific type of **All-Pay Auction** (where all bidders pay regardless of winning), but with the critical, destructive twist that the *runner-up also pays*.

  2.  **The Broader Pattern: Escalation of Commitment in Competitive Sunk Cost Traps**
      *   **What it is:** This describes the *family* of situations you're noticing – the Facebook rows, expense claim battles, custody fights, pub quiz standoffs. While not always a formal auction, they share the core psychological and structural dynamics:
          *   **Competitive Goal:** A prize (being "right", winning the argument, getting the expense approved, getting custody, securing the quiz point).
          *   **Escalating Investment:** Parties continuously invest resources (time, money, effort, emotional energy, reputation).
          *   **Sunk Costs as Fodder:** Past investments are sunk, but quitting doesn't just abandon them; it *transfers value to the opponent*.
          *   **Perceived Transfer:** Conceding grants the opponent victory *and* makes your own investment appear entirely wasted *in service of their win*. The loser's costs become part of the winner's "trophy" (e.g., "I won because you gave up after wasting 6 hours").
          *   **Mutually Assured Waste:** Both parties know that continuing is costly and total losses are mounting, but the fear of being the one who pays the ultimate cost *and* hands victory to the other keeps them locked in.
      *   **Differentiation:**
          *   **Vs. Simple Sunk Cost Fallacy:** SCF is about continuing a *solo endeavour* due to past costs. This is intrinsically *competitive*. The rival's continued presence threatens to convert your sunk costs into *their* gain upon your exit. **The competitive transfer is key.**
          *   **Vs. Winner-Take-All Competition:** Standard competition implies the winner gains more than the loser, but total gains might be positive. Here, the *total resources expended by both parties often exceed the value of the prize itself*, creating a net loss (the £20 auction going over £50 total bids). It's **destructive competition**.
          *   **Vs. Brinkmanship:** Brinkmanship focuses on the *risk* of catastrophic mutual destruction as a *threat* to force concessions. This dynamic involves the *certainty of escalating mutual losses* if the contest continues, and the *certainty of asymmetric, painful loss for the quitter*. The destruction isn't a threat held in reserve; it's the ongoing reality of participation. It's **mutually assured waste in progress**.

  3.  **Coining a Term for the Broader Family: Mutually Assured Waste (MAW) Trap**
      *   **Definition:** A competitive conflict dynamic where:
          1.  Parties compete for a prize or goal.
          2.  Continued participation requires ongoing investment of resources by all active competitors.
          3.  The act of withdrawing concedes defeat *and* effectively transfers the value of the withdrawing party's sunk investments to the benefit of the remaining competitor(s), augmenting their perceived victory.
          4.  The structure incentivises escalating investment beyond the rational value of the prize due to the combined pressure of sunk costs and the competitive transfer threat.
          5.  Total resource expenditure by all parties typically exceeds the value of the contested prize, resulting in net social loss.
      *   **Why MAW Trap?**
          *   "Mutually Assured" highlights the shared, inevitable nature of the waste if the contest continues.
          *   "Waste" emphasises the destruction of value.
          *   "Trap" underscores the psychological and structural lock-in, making rational exit difficult despite worsening outcomes.
          *   It captures the essence beyond just auctions.

  4.  **Drawing the Boundaries: Where MAW Applies**
      *   **Loser Pays Half?** **Yes, it still counts, but intensity may vary.** The core dynamic remains: quitting still hands victory to the rival *and* involves a significant, unrecoverable loss. Escalation is still incentivised, though perhaps not as severely as paying the full bid. It weakens the "total waste" aspect slightly but keeps the transfer element.
      *   **Three or More Bidders?** **Yes, absolutely.** This adds a "kingmaker" element. Withdrawing benefits *all* remaining rivals. The calculus becomes even more complex: "If I quit now, rivals A *and* B both benefit from my wasted effort and continue fighting. Do I keep paying to try and win, or cut my losses knowing I'll empower both of them?" Escalation pressure can persist or even increase due to the potential for alliances or perceptions of weakness.
      *   **No Audience?** **Yes, it still counts, though audiences amplify it.** The core driver is the *dyadic* relationship: the fear of handing victory *to your specific rival*. An audience massively increases the reputational cost of quitting (public humiliation, loss of face) and the perceived value of winning (public vindication), making the trap far more potent and harder to escape. But the fundamental transfer dynamic between the two competitors exists even privately (e.g., the internal feeling of "I can't let *them* win after all this").
      *   **Does it Need Formal Bidding?** **No.** The auction is the purest economic model, but the psychological structure of escalating commitment driven by sunk costs and the threat of value transfer upon withdrawal defines MAW traps in arguments, legal disputes, etc. The "bids" are investments of time, energy, reputation, or money.

  **In Summary:**

  *   **Charity Auction:** Textbook **Dollar Auction**.
  *   **Facebook Argument, Expense Claim, Custody Battle, Pub Quiz Standoff:** These are all **Mutually Assured Waste (MAW) Traps**.
      *   They share the core structure: escalating investment, sunk costs, competitive withdrawal transferring value to the rival, incentive to over-invest, net loss.
  *   **Key Differentiator:** The **competitive transfer** – your exit doesn't just waste your investment; it actively *enhances your rival's position* by granting them victory *and* making your effort part of their win narrative. This is what makes it distinct from simple sunk cost fallacy and turns competition destructive.
  *   **Edges:** MAW applies even with partial loser payments, multiple players, and no audience, though these factors modify the intensity. The presence of an audience is a common and powerful amplifier, but not the defining element.

  **Mitigation (For Your Work Thing):** Recognising a MAW trap is the first step. Solutions involve:
  1.  **Third-Party Intervention:** Mediators, managers, or arbitrators who can freeze escalation and find face-saving exits.
  2.  **Pre-agreed Rules/Limits:** Setting caps on bids, debate time, or legal costs upfront.
  3.  **Reframing:** Focusing on shared losses ("Is this £60 claim worth *both* our salaries for a week?").
  4.  **Cooling-Off Periods:** Mandatory breaks to disrupt the escalation cycle.
  5.  **Focusing on BATNA (Best Alternative To a Negotiated Agreement):** Encouraging parties to consider what they *could* gain by walking away *now* and investing resources elsewhere.

  This structure is insidious precisely because it exploits basic human psychology (loss aversion, commitment, competitiveness) within a flawed incentive system. Understanding it as the Dollar Auction/MAW Trap dynamic gives you a powerful lens to identify and potentially defuse these costly conflicts. Good spot!
