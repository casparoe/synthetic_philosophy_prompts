  For the mapping portion, I'll structure it in two parts. The first direction will demonstrate how the dispute embodies the theorem: 
  - Define ProPublica's finding as unequal FPR/FNR across races
  - Define Northpointe's claim as calibration (equal PPV across races)
  - Show mathematically why they conflict given differing recidivism rates
