answer: |-
  ## Dissertation Fellowship Proposal: Sequential Stability in Imprecise Decision Theory  

  **Research Question:**  
  Which decision rule for imprecise credences (E-admissibility, maximality, Γ-maximin) dynamically coheres across sequential choices—i.e., ensures plans made at time *t* remain optimal at *t+1* after updating—without resorting to *ad hoc* constraints like resolute choice, and why do the other rules fail?  

  **Why Existing Work Leaves This Open:**  
  - **Levi’s tradition** defends imprecise credences but lacks consensus on dynamic rules, treating sequential divergence as an open engineering problem.  
  - **Accuracy-based precision defenses** (e.g., Pettigrew, Joyce) dismiss sets of probabilities as epistemically incoherent but fail to address whether *any* dynamic rule can stabilize sequential choice under dilation.  
  - **Dilation literature** (e.g., Seidenfeld, Wasserman) catalogs how imprecise posteriors expand under irrelevant evidence but avoids adjudicating rules by their sequential consequences, focusing on paradoxes rather than inconsistency.  
  Precision defenders accommodate one-shot cases (e.g., Ellsberg via risk sensitivity) but have no unified account of why *all three* imprecise rules yield conflicting prescriptions in sequences where learning is endogenous.  

  **Methodology (9 Months):**  
  1. **Months 1–2:** Formalize dilation-driven sequential problems. *Running example:* A funder estimates climate tipping-point probability as *C* = [0.05, 0.3]. She can:  
     - *Act now* (fund mitigation, payoff sensitive to true *p* ∈ *C*),  
     - *Research* (costly, narrows *C* to subinterval).  
     Dilation threat: Learning "Is methane feedback reversible?" (orthogonal to *p*) might widen *C* to [0.02, 0.4].  
  2. **Months 3–4:** Map rule-divergence in worked examples:  
     - **Γ-maximin** funds mitigation immediately (maximizes worst-case: assumes *p*=0.3).  
     - **E-admissibility** often prefers research (only actions optimal under *some* *p* ∈ *C* survive).  
     - **Maximality** funds mitigation if it isn’t dominated *state-by-state* across *C*.  
  3. **Months 5–6:** Test dynamic consistency:  
     - A plan is **inconsistent** iff after updating (e.g., learning "methane reversal is harder than expected"), the agent’s *optimal continuation* reverses the initial plan under the *same rule*.  
     - *Failure criterion:* If Γ-maximin funds research, but upon dilation-abatement, cancels it to act—despite paying the cost—it violates stability.  
  4. **Months 7–8:** Cross-rule evaluation: Does maximality/E-admissibility avoid inconsistency *without* resolute precommitment? *Crucial test:* When rules conflict, which (if any) aligns ex ante and ex post utilities?  
  5. **Month 9:** Synthesize philosophical implications for justification of imprecise models.  

  **Possible Conclusions:**  
  1. **Maximality uniquely avoids inconsistency** by its statewise dominance logic.  
  2. **No rule escapes inconsistency** without smuggled resolute commitments, undermining imprecise models.  
  3. **Rule choice is pragmatic** (e.g., Γ-maximin for urgent threats), but all rules sacrifice dynamic rationality.  

  **Significance Beyond Academia:**  
  Imprecise credences model real-world uncertainty (e.g., pandemic origins, AI extinction risk). Consider a policymaker with credence *C* = [0.01, 0.2] that an AI prototype causes global catastrophe. Γ-maximin mandates immediate defunding; E-admissibility demands further research; maximality may tolerate delay only if dominance holds. The chosen rule determines whether society incurs preventable catastrophe or paralyzes itself via endless testing—highlighting how abstract decision theory shapes existential resource allocation.  

  **Conditions for Failure:**  
  1. **Formal intractability:** If sequential games under dilation require infinite regress (e.g., sets of sets of probabilities), analysis becomes impossible.  
  2. **Reduction to risk attitudes:** If all rule-divergence reduces to risk-aversion parameters within precise subjective expected utility (e.g., rank-dependent probabilities explain dilation avoidance), imprecision adds no value.  
  3. **Universal inconsistency:** If all rules require resolute choice to cohere, the project collapses into Levi’s pragmatism, abandoning dynamic justification.  

  ---  
  *This proposal isolates the sequential dilemma imprecise models cannot evade. By testing rules against dynamic consistency—not static intuition-matching—we resolve whether imprecise credences can guide action across time without self-sabotage.*
