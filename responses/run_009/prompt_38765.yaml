  Hmm, this is a sophisticated methodological puzzle. The user clearly has deep subject expertise but is wrestling with demarcation criteria that feel intuitive yet resist formalization. Their frustration with their own tentative principle shows they've done the hard work already - now they need structural rigor. 

  First, I notice their discomfort with consensus as a criterion (cases 5-6) and with motivation-based judgments (cases 7,9). Their pseudohistory label seems to require something about how knowledge claims interface with evidence and correction mechanisms. The "insensitivity to counterevidence" principle is a good start but fails for cases like 4 (Solutrean hypothesis) where credentialed scholars persist despite contrary evidence.

  What's the core difference? In case 4, the proponents engage evidentiary arguments head-on (even if poorly), while Fomenko (case 1) creates self-sealing systems. Ah - that points to epistemic closure versus evidentiary accountability. The key might be whether alternative interpretations are structurally excluded versus contested.

  For case 3 (phantom time), its pseudohistory status probably stems from how it treats disconfirming evidence - not just ignoring but reinterpreting all counter-evidence as conspiracy. Whereas the Vinland explorers (case 5) abandoned false leads when evidence contradicted them. Similarly, Holocaust denial (case 9) typically employs evidence-handling tactics that make falsification impossible.

  The user's withheld cases will test this: the naval officer's Chinese fleet claim likely builds speculative connections while dismissing absence of evidence, whereas the local charter dispute might be ordinary error if open to re-examination. But I'll need to articulate precise criteria.

  Biggest challenge will be cases where my principle conflicts with their verdicts, like case 4 (Solutrean). I may need to argue that persistent wrongness becomes pseudohistorical when it abandons disciplinary evidence standards - which those archaeologists arguably did post-genetic evidence. But the user sees this as "bad archaeology," so I'll need persuasive distinctions about institutional versus epistemic accountability.

  Also must address whether this generalizes to pseudoscience. The core mechanism - immunization against falsification - is shared, but historical claims face unique challenges regarding fragmentary evidence and narrative construction. The demarcation should work similarly for any evidentiary discipline though.
answer: |-
  Your struggle captures the fundamental tension in demarcation theory - we recognize pseudohistory intuitively but struggle to articulate its epistemic boundaries. Your cases reveal three core dimensions: **evidence responsiveness, methodological integrity, and disciplinary accountability**. Below is a principle refined through your counterexamples, with applications and limitations.

  ### Revised Principle
  **A claim is pseudohistorical when it:**  
  1.  **Systematically immunizes itself against disconfirmation** through unfalsifiable auxiliary assumptions *or*  
  2.  **Violates fundamental disciplinary methodologies** (e.g., source criticism, contextual analysis) to preserve a predetermined conclusion, *while*  
  3.  **Rejecting institutional correction mechanisms** (peer review, evidence-based debate) when available.  

  *Ordinary bad history* exhibits methodological flaws but remains corrigible within the discipline's evidence ecosystem.

  ---

  ### Application to Your Cases
  | Case | Your Verdict | Principle's Verdict | Analysis |  
  |------|-------------|---------------------|----------|  
  | 1. Fomenko | Pseudohistory | **Pseudohistory** | Statistical manipulations create unfalsifiable system; rejects chronology fundamentals |  
  | 2. Von Däniken | Pseudohistory | **Pseudohistory** | "Ancient astronauts" explain away counterevidence; ignores cultural context |  
  | 3. Illig | Pseudohistory | **Pseudohistory** | Invokes massive document forgery conspiracy (violates Occam's Razor); unfalsifiable |  
  | 4. Solutrean Hypothesis | Not pseudohistory | **Pseudohistory** | *Overturns your verdict*: Genetic rejection met with *ad hoc* adjustments (e.g., "vanished lineage"); violates population genetics standards |  
  | 5. Vinland Researchers | Not pseudohistory | **Not pseudohistory** | Methodology sound (saga analysis + archaeology); accepted L'Anse aux Meadows disconfirmation |  
  | 6. Great Zimbabwe (colonial) | Pseudohistory | **Pseudohistory** | Dismissed African craftsmanship *a priori*; ignored material evidence contradicting Eurocentric view |  
  | 7. *Black Athena* | Not pseudohistory | **Not pseudohistory** | Debatable philology but engaged disciplinary critique; corrigible |  
  | 8. Coal/Industrial Rev | Ordinary history | **Ordinary history** | Testable geographical hypothesis; falsifiable by energy economics |  
  | 9. Holocaust Denial | Pseudohistory | **Pseudohistory** | Cherry-picks documents; invokes conspiracies to explain evidence; methodologically bankrupt |  

  **Key Overturn:** Case 4 (Solutrean) is pseudohistorical per clause 2-3. Persisting post-genetics required dismissing population genetics principles and peer-reviewed counterevidence - a disciplinary boundary violation absent in case 5.

  ---

  ### Withheld Cases: Principle's Verdicts
  1. **Chinese treasure fleets in Americas:**  
     - **Pseudohistory** if claims (e.g., Gavin Menzies) use "lost evidence" tropes, ignore naval archaeology (no pre-Columbian Chinese shipwrecks/artifacts), and reinterpret ambiguous artifacts as confirmation.  
     - *Why:* Violates methodological norms (clause 2); auxiliary assumptions immunize against null evidence (clause 1).  

  2. **County historical society's charter dating:**  
     - **Not pseudohistory** if they:  
       a) Subject the charter to technical analysis (parchment, ink, script)  
       b) Engage with external paleographers  
       c) Adjust if evidence contradicts founding legend.  
     - *But pseudohistory if:* They dismiss technical analysis when unfavorable, treating the legend as axiomatic (clause 1-2).  

  ---

  ### Generalizability & Limitations  
  - **Generalizes to pseudoscience:** Core is *systematic evasion of falsification* (e.g., creationism vs. evolutionary biology; flat earth vs. geophysics).  
  - **Preserves specificity:** Historical demarcation adds unique criteria:  
    - Source criticism norms (e.g., ignoring provenance = clause 2 violation)  
    - Contextualization requirements (e.g., von Däniken's art "interpretations")  
  - **Saves the "kind":** Fomenko/von Däniken share:  
    - **Epistemic insularity:** Self-referential evidence loops  
    - **Asymmetric skepticism:** Hyper-skepticism toward mainstream evidence, uncritical acceptance of confirmatory "clues"  
  - **Limitations:**  
    - Doesn't resolve *all* contested cases (e.g., highly ideological but methodologically rigorous work)  
    - Requires contextual judgment about "disciplinary fundamentals"  

  ---

  ### Why Accept the Overturns?  
  Your Solutrean verdict (case 4) hinges on *intent* vs. *method*. The principle prioritizes **epistemic behavior**: credentialed scholars become pseudohistorical when they abandon disciplinary accountability to maintain a claim (e.g., rejecting genetics as "inconclusive" while demanding impossible direct evidence). This mirrors demarcation in science: Lysenkoism was pseudoscience not because of ideology, but because it suppressed Mendelian genetics.  

  **The core insight:** Pseudohistory isn’t defined by being wrong, nor by outsider status, but by **corrupting the corrective machinery of historical epistemology**. Your cases 5 and 6 show consensus is irrelevant; what matters is whether the claim permits *evidence to kill it*. The Vinland searchers let evidence falsify them; colonial Zimbabwe scholars did not.  

  Would welcome your verdicts on the withheld cases to refine further.
