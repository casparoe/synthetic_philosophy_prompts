prompt: |-
  I've been wrestling with this bit from Marx's Grundrisse (his unpublished notebooks from the late 1850s, sometimes called the "Fragment on Machines") and I can't quite parse the middle of it. Here's the passage:

  "But to the degree that large industry develops, the creation of real wealth comes to depend less on labour time and on the amount of labour employed than on the power of the agencies set in motion during labour time, whose 'powerful effectiveness' is itself in turn out of all proportion to the direct labour time spent on their production, but depends rather on the general state of science and on the progress of technology, or the application of this science to production."

  What I think he's getting at is that machines do more and more of the work, so how much stuff a society produces depends more on how good the machines/science are than on how many hours of labor went in. But then it sounds like he's saying labor time becomes almost irrelevant to wealth, which seems weird for the guy whose whole theory is built on labor time being the source of value. So my questions: (1) what is he actually refering to with "the power of the agencies set in motion during labour time"? (2) is this a contradiction in his theory, or does value vs. real wealth being two different things for him dissolve the tension? If you can, explain it in plain language without jargon, and flag how confident you are about each part of your reading, especially where you'd bet money vs. where you're guessing. Please end with a single-sentence summary of the core claim, in the form \summary{...} as the very last line.
