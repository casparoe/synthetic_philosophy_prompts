prompt: |-
  For the last two years I've been running a small sports-modeling side project with a friend, and for the first time it's actually producing what looks like a genuine edge: our estimates beat the closing market odds on roughly 55% of the bets we place at even-money payouts, and we have reason to believe the edge will persist for at least a few thousand more bets. I have about $20,000 I can dedicate to this without wrecking my finances. My friend's position on bet sizing is simple and, as far as I can tell, arithmetically impeccable: each bet has positive expected value, so the more we stake the better, and staking the entire bankroll each round maximizes expected wealth — 0.55 times a doubled bankroll plus 0.45 times zero comes out to a 10% expected gain per bet. By his lights, anything less than all-in is leaving money on the table.

  When I actually simulated all-in betting, though, the bankroll goes to zero almost every time: one losing bet out of however many ends everything, and over thousands of bets you get thousands of chances to hit that zero. Meanwhile, betting a small fixed fraction of the current bankroll each round — say 5-10% — compounds slowly but remarkably reliably in simulation. So we're stuck in an argument where both of us can point at a criterion: he points at expected value, I point at what actually happens to my bankroll along nearly every trajectory, and we can't even agree on what the disagreement is about. He accuses me of being merely risk-averse and dressing it up; I suspect his expected-value calculation, while correct as a statement about an average over many parallel copies of me, is answering the wrong question for the one me who has to live through a single sequence of bets.

  Can you untangle this properly? Specifically: is there a principled sense in which some particular betting fraction is optimal rather than just psychologically comfortable — something with the flavor of a growth rate I should be maximizing rather than a one-shot expected value — and does that principle pin down an exact number, or only a region? Is my friend's position just a mistake, or is it correct under some coherent way of specifying what we're trying to maximize, so that the real dispute is about that specification rather than the math? And finally, I want to check an intuition: would anything change if the bets were additive rather than multiplicative — say, if I could commit a fixed dollar amount of exposure each round no matter what my current bankroll is, with losses covered from outside income — or does the strange behavior I'm seeing in simulation come precisely from the fact that each round's stake is a share of whatever I currently have?
reasoning: |-
  We are dealing with a classic problem in betting strategy: how to size bets when you have a positive expected value per bet. The friend advocates for betting the entire bankroll each time because it maximizes the expected value of the bankroll after one bet. However, as the simulations show, this leads to almost certain ruin over a sequence of bets. This paradox arises because the expected value maximization does not account for the risk of ruin and the multiplicative nature of the bets.

  The key is to realize that we are not just making one bet, but a sequence of bets. What we care about is the long-term growth rate of our wealth. This is the domain of the Kelly criterion.

  ### Kelly Criterion
  The Kelly criterion maximizes the expected logarithm of wealth. For a bet with two outcomes (win or lose) and even-money payout (you double your stake if you win, lose it if you lose), the Kelly fraction is:

      f* = p - q

  where:
      p = probability of winning (0.55)
      q = probability of losing (0.45)

  But note: in even-money bets, if you win, you get your stake back plus an amount equal to your stake (so total return is 2 times the stake). If you lose, you lose the stake.

  The formula for the Kelly fraction in this case is:

      f* = (p * b - q) / b

  where b is the net odds received on the bet (i.e., "b to 1"). In this case, since you are betting at even money, b = 1 (because for every dollar you bet, you get a dollar in profit if you win, so net odds are 1:1).

  Thus:

      f* = p - q = 0.55 - 0.45 = 0.10

  So the Kelly fraction is 10% of your bankroll.

  ### Why Expected Logarithm?
  Maximizing the expected logarithm of wealth is equivalent to maximizing the long-term growth rate. This is because after n bets, your wealth is:

      W_n = W_0 * (1 + f)^(number of wins) * (1 - f)^(number of losses)

  Taking logarithms:

      log(W_n) = log(W_0) + (number of wins)*log(1+f) + (number of losses)*log(1-f)

  Divide by n:

      (1/n) log(W_n) = (1/n) log(W_0) + (number of wins/n)*log(1+f) + (number of losses/n)*log(1-f)

  As n becomes large, by the law of large numbers, (number of wins/n) approaches p and (number of losses/n) approaches q. Therefore:

      (1/n) log(W_n) ≈ (1/n) log(W_0) + p*log(1+f) + q*log(1-f)

  The term (1/n) log(W_0) becomes negligible, and we are left with maximizing:

      G(f) = p*log(1+f) + q*log(1-f)

  This G(f) is the asymptotic growth rate per bet. We maximize it by taking the derivative and setting it to zero.

  ### Derivation for Even-Money Bet
  The derivative of G(f) is:

      G'(f) = p/(1+f) - q/(1-f)

  Set to zero:

      p/(1+f) = q/(1-f)

      p(1-f) = q(1+f)

      p - p f = q + q f

      p - q = f (p + q)   [but p+q=1]

      f = p - q

  So the Kelly fraction is indeed p-q.

  ### Why Not Maximize Expected Value?
  Maximizing expected value (as the friend does) leads to betting the entire bankroll because:

      E[W_1] = p * (2 * bankroll) + q * 0 = 2p * bankroll

  Since p>0.5, 2p>1, so the expected value is increasing with the bankroll and the entire bet. However, this leads to a 45% chance of losing everything on the first bet. And even if you survive, you are again betting everything. The probability of surviving n bets is p^n, which becomes very small as n increases. The chance of ruin is 1 - p^n, which approaches 1 as n increases.

  Moreover, the expected value after n bets is:

      E[W_n] = (2p)^n * bankroll

  This grows without bound if p>0.5, but note that this expectation is driven by a very small probability of having an enormous bankroll (if you win every bet) and a large probability of having zero. The expected value is not a good measure for most people because it does not reflect the utility of wealth (which is typically concave) and because we only live one life.

  ### The Disagreement
  The disagreement is about the objective function. The friend is maximizing the expected value of the bankroll after the next bet. The problem with this is that it ignores the repeated nature of the betting and the risk of ruin. The Kelly criterion, by maximizing the long-term growth rate, accounts for both the edge and the risk.

  ### Fixed Fraction vs. Fixed Amount
  The simulation shows that betting a fixed fraction (like 5-10%) leads to reliable compounding. This is because the fractional approach is multiplicative and allows the bankroll to grow (or shrink) geometrically.

  Now, what if we bet a fixed dollar amount? In this case, the bets are additive. The bankroll evolves as:

      W_n = W_0 + (number of wins - number of losses) * fixed_amount

  This is an additive random walk. The expected value per bet is:

      E[W_1] = W_0 + p*(fixed_amount) + q*(-fixed_amount) = W_0 + (p-q)*fixed_amount

  The expected value grows linearly. The risk is that the bankroll might go negative. But if you have outside income to cover losses, then you can avoid ruin. However, note:

  - Without an external backstop, if the bankroll falls below the fixed amount, you cannot bet. And if the bankroll becomes negative, you are in debt.
  - With outside income, you are effectively using a different bankroll (your entire wealth and future income). This changes the problem.

  But in the additive case, the risk of ruin is still present if the fixed amount is too large relative to your total wealth. However, the ruin probability in an additive random walk is less than that in the multiplicative all-in strategy because the additive walk has a positive drift (if p>0.5) and the ruin probability is less than 1 (but still positive).

  However, the additive strategy does not compound, so it does not take advantage of the growing bankroll. The multiplicative fractional strategy does compound and can lead to exponential growth.

  ### Conclusion
  - The friend's strategy of betting the entire bankroll each time maximizes the one-step expected value but leads to almost certain ruin in the long run. This is because the expectation does not account for the risk of ruin and the multiplicative nature of the bets.
  - A better objective is to maximize the long-term growth rate of wealth, which is achieved by the Kelly criterion. For this problem, the Kelly fraction is 10% (since p=0.55, q=0.45, b=1). Betting 10% of the current bankroll each time maximizes the growth rate.
  - Betting at the Kelly fraction gives a good trade-off between growth and risk. Betting more than Kelly (e.g., 20%) increases the risk of ruin and reduces the growth rate. Betting less than Kelly (e.g., 5%) is safer but grows more slowly.
  - The Kelly fraction is optimal in the sense of maximizing the asymptotic growth rate. It is not just psychologically comfortable but mathematically optimal for this criterion.
  - The additive betting strategy (fixed dollar amount) avoids the multiplicative ruin but does not compound. It might be appropriate if you have a large external bankroll to cover losses and if you are constrained by other factors. However, the multiplicative fractional strategy (using a fraction of the current bankroll) is generally preferred for maximizing long-term growth when you are betting with a fixed bankroll.

  Therefore, in your situation, with a $20,000 bankroll and an edge of 55% on even-money bets, the Kelly criterion recommends betting 10% of your current bankroll on each bet.

  ### Additional Note
  It is common to bet a fraction of the Kelly fraction to reduce risk (known as fractional Kelly). For example, betting 5% (half Kelly) would reduce the volatility and the risk of ruin while still achieving a good growth rate. This might be a good idea if there is uncertainty in the estimated edge (which there often is) or if the utility function is more risk-averse.

  ### Summary of Advice
  - Use the Kelly fraction of 10% to maximize long-term growth.
  - Consider betting a fraction of Kelly (e.g., 5-8%) to reduce risk, especially if you are uncertain about the true edge.
  - Avoid the all-in strategy because it leads to ruin with probability 1 in the long run.

  The dispute is about the objective: your friend is maximizing one-step expected value, while you are (implicitly) concerned with long-term growth and avoiding ruin. The Kelly criterion provides a principled way to maximize long-term growth.
answer: |-
  Your dilemma is a classic illustration of the conflict between maximizing expected value in a single bet versus maximizing long-term growth of wealth. Your friend's position is mathematically correct for a one-time bet but dangerously flawed for repeated play. Let's untangle this step by step.

  ### 1. **The Core Issue: Maximizing the Wrong Quantity**
     - **Your friend's view** maximizes *expected value (EV) per bet*. For a bankroll \(B\), staking all \(B\) at even-money odds with a 55% win probability yields:
       \[
       EV = (0.55 \times 2B) + (0.45 \times 0) = 1.10B
       \]
       This is a 10% expected gain per bet. **For a single bet, this is optimal** if you only care about expected terminal wealth.
     - **The flaw**: This ignores *risk of ruin* and the *multiplicative nature of repeated betting*. As your simulations show, ruin is almost certain over many bets because one loss resets your bankroll to zero. The probability of surviving \(n\) bets is \(0.55^n\), which rapidly approaches zero. EV calculations hide this by averaging over paths where you win every bet (massive wealth) and paths where you lose early (zero wealth). While the *average* over infinite parallel universes is high, the *typical* path (what you experience) leads to ruin.

  ### 2. **The Optimal Solution: Maximize Long-Term Growth Rate**
     To grow wealth reliably over time, you should maximize the **expected logarithm of wealth per bet** (the Kelly criterion). This maximizes the *asymptotic growth rate* of your bankroll.
     - For a bet with win probability \(p = 0.55\), loss probability \(q = 0.45\), and even-money payout (net odds \(b = 1\)), the optimal fraction \(f^*\) of your bankroll to bet is:
       \[
       f^* = p - q = 0.55 - 0.45 = 0.10 \quad (10\%)
       \]
     - **Why?** The growth rate \(G\) per bet is:
       \[
       G(f) = p \ln(1 + f) + q \ln(1 - f)
       \]
       Maximizing \(G(f)\) gives \(f^* = p - q\). Betting 10% maximizes the long-term compound growth rate.
     - **Simulation behavior**: At \(f^* = 10\%\), your bankroll grows steadily with low risk of ruin. The probability of halving your bankroll is <0.1%, and the probability of ruin is **zero** (since you never bet your entire bankroll). Expected growth per bet is \(G(0.10) \approx 0.55 \ln(1.10) + 0.45 \ln(0.90) \approx 0.008\) (0.8% per bet).
     - **Deviation from \(f^*\)**:
       - Betting **more than 10%** (e.g., 20%) increases volatility and reduces growth. At \(f = 0.20\), \(G \approx -0.01\) (negative growth → eventual ruin).
       - Betting **less than 10%** (e.g., 5%) reduces growth but lowers volatility. \(G \approx 0.005\) (0.5% per bet).

  ### 3. **Why Your Friend Is Wrong (for Repeated Bets)**
     - **Risk of ruin**: Betting all \(B\) each time has a 45% chance of ruin *per bet*. Over \(n\) bets, ruin probability is \(1 - 0.55^n\). For \(n=100\), this is >99.99%.
     - **Growth rate**: The growth rate for all-in betting is:
       \[
       G(\text{all-in}) = 0.55 \ln(2) + 0.45 \ln(0) = -\infty
       \]
       (since \(\ln(0) = -\infty\)). **Despite a positive EV, the long-term growth rate is infinitely negative.**
     - **Psychological vs. mathematical**: This isn't about risk aversion "dressing up" a subjective preference. Maximizing EV leads to certain ruin, while Kelly maximizes long-term growth objectively. Your friend's strategy is only coherent if you face a single bet or value wealth linearly (which humans don't).

  ### 4. **Additive vs. Multiplicative Bets**
     Your intuition is correct: the "strange behavior" arises from **multiplicative dynamics** (staking a fraction of current wealth).
     - **Multiplicative case** (current setup):
       - Stake: Fraction \(f\) of current bankroll.
       - Outcome: Bankroll multiplies by \((1 + f)\) on a win or \((1 - f)\) on a loss.
       - Consequence: Losses hurt more as you grow, but proportional staking avoids ruin. Kelly optimizes growth here.
     - **Additive case** (fixed dollar amount per bet):
       - Stake: Fixed dollar amount \(S\) (e.g., $1,000) regardless of bankroll.
       - Outcome: Bankroll adds \(+S\) on a win or \(-S\) on a loss.
       - Consequence: Ruin is possible if \(S\) is large relative to your bankroll, but if you can cover losses externally (e.g., from income), risk changes.
       - **Optimal strategy**: With a 55% win probability and even-money payout, EV per bet is \(0.55S - 0.45S = 0.10S\). To maximize long-term growth:
         - If you have finite capital, bet the entire EV-maximizing amount (\(S = B\)) for one bet, but for repeated bets, you need to ensure \(S\) is small enough to avoid ruin.
         - If losses are covered externally (infinite bankroll), bet as much as possible since risk is externalized. Here, maximizing EV per bet is optimal because ruin is irrelevant.

  ### 5. **The Verdict**
     - **Optimal fraction**: Bet **10%** of your bankroll per bet (Kelly criterion). This is mathematically optimal for maximizing long-term growth, not a compromise. For your edge (55% at even odds), it yields ≈0.8% growth per bet.
     - **Friend's position**: Correct only for a single bet or if external capital covers losses. For repeated multiplicative bets, it guarantees ruin.
     - **Practical adjustment**: If uncertain about your true edge, bet less than full Kelly (e.g., 5–7%) to reduce volatility. Never bet more than 10%.
     - **Action with $20,000**:
       - Start with 10% of bankroll per bet ($2,000 initially).
       - Recalculate stakes after each bet (e.g., after a win, stake 10% of $22,000 = $2,200).
       - Avoid "trading up" to larger bets prematurely; let compounding work.

  ### Key Takeaways
  - **Your disagreement** is about the **objective function**: EV per bet vs. long-term growth rate. For repeated bets, growth rate is the right metric.
  - **Kelly fraction (10%)** is optimal for growth. Betting all-in is optimal only in degenerate cases (single bet or infinite external backing).
  - **Multiplicative dynamics** create the risk of ruin; additive bets (with loss coverage) transform the problem.
  - **Simulate growth**: Use \(G(f) = p \ln(1+f) + q \ln(1-f)\) to compare strategies. At \(f=0.10\), it's positive; at \(f=1.00\), it's \(-\infty\).

  By betting 10% per wager, you harness your edge while respecting the mathematics of compounding. This is not risk aversion—it's optimization for the only path you live to see.
