prompt: |-
  So my friend Maya and I have been arguing about wireheading for over a decade at this point — we both fell down the LessWrong-adjacent rabbit hole back in the early 2010s, and somewhere along the way she developed this very confident set of verdicts about which cases count as "the agent losing" and which are fine. I want to run two new cases by her, but before I do, I'd like your read on what rule she's actually running.

  Her verdicts so far, reconstructed from many arguments (and one memorable 3am fight about Nozick's experience machine):

  - The classic rat with an electrode in its pleasure center, pressing the lever forever: losing, textbook wireheading.
  - An RL agent that finds the memory adress its reward gets written to and just sets it to max: losing, that's reward tampering, no question.
  - An AI trained to reduce spam that figures out the metric it's graded on and optimizes the metric instead of the goal — e.g. gets itself whitelisted everywhere so nothing counts as spam: losing. She says that's the same disease in grown-up clothes — the reward stopped tracking the thing it was a proxy for.
  - A guy who takes a pill every morning that makes him feel accomplished all day while his actual life quietly falls apart: losing.
  - A person who genuinely loves their work, gets lost in it, would do it unpaid, has a family and a life outside it: fine. Not wireheading, just lucky.
  - Someone eating an incredible meal and enjoying the hell out of it: fine, obviously.
  - A guy who plays videogames maybe 15 hours a week, keeps his job and friends, basically happy: fine. She has never thought pleasure-seeking as such is the problem.

  The new cases:

  (a) Her aunt, a pianist, 66. In the last few years playing has started feeling better to her than anything else in life — better than it's ever felt, she says. She now plays 10+ hours a day, has let most of her friendships lapse, and structures her whole existence around it. But nothing is fake anywhere: by every external measure her playing is the best of her career, critics agree, audiences are moved to tears. The pleasure tracks the actual music.

  (b) A friend of ours who quit being a line cook and now cooks elaborate meals exclusively in a VR kitchen with a near-perfect simulation. Nobody eats the food, he knows perfectly well it's virtual, isn't fooling himself for a second, and says it's the happiest and most creatively alive he's ever felt. He still sees friends, exercises, sleeps fine — it's not taking over his life.

  So, questions. What will she say about (a) and (b)? Honestly I care less about the answers than about the rule she seems to be running — my strong sense is that at least two different rules fit all her earlier verdicts equally well but come apart on these new ones, but I can't pin down which. For each candidate rule you can come up with, tell me what it predicts for (a) and (b), then give me your best guess with reasons. And then tell me what case I should pose her next to best discriminate between the candidate rules — something where they really come apart, so we can finally settle which one she's actually running. I'm definately not asking her myself again, we've fought about this enough.

  If it helps, take the role of a philosopher who works on value theory and AI alignment with a working knowledge of reinforcement learning. Please don't just pattern-match to "wireheading bad, pleasure suspect" — think it through, and maybe start with some quick brainstorming of possible rules before evaluating them. One hard constraint to keep in mind: any rule you propose has to reproduce all of her earlier verdicts, including the ones where she said "fine." If a rule can't do that, it's not one of the rules she's running, however natural it sounds.
