prompt: |-
  I've been reading about Good's theorem — the result that an expected-utility maximizer can never be made worse off, in expectation, by acquiring costless information before choosing: whatever you'd learn, you can always do at least as well as before, because you retain the option of ignoring the information. I gather the standard proof leans on the independence/substitution structure of expected utility, in particular on flattening compound gambles into simple ones. Meanwhile, Buchak's risk-weighted expected utility theory deliberately gives up independence in order to accommodate Allais-style preferences, reweighting outcomes according to how bad they rank within the gamble. Here is what I can't get straight: can Good's theorem fail for a risk-weighted agent, so that she rationally declines free information in some cases? If it can, please walk me through why — identify exactly which step of the expected-utility proof no longer goes through — and then assess whether refusing costless information is really a cost of REU theory, or whether the agent's refusal is defensible as consistent with the global-risk attitude that REU is designed to respect rather than a mere dynamic inconsistency.
reasoning: |-
  Okay, the user is diving deep into decision theory, specifically Good's theorem and how it interacts with risk-weighted expected utility (REU) theory. They're clearly well-versed in the subject, referencing both Good's work and Buchak's REU framework. Their main question is whether Good's theorem can fail under REU, leading an agent to rationally decline free information. They also want to know exactly where the standard EU proof breaks down and whether this refusal should be seen as a flaw in REU or a defensible feature.

  Hmm, first I need to recall the key elements. Good's theorem says that for an expected utility maximizer, free information can't hurt because you can always ignore it. The proof relies on the law of total probability and the independence axiom, which allows compounding lotteries. But REU intentionally violates independence to handle Allais paradox-type behavior, so that's where things might go wrong.

  The user seems to understand the technical aspects but is struggling with the implications for REU. They're probably looking for a clear breakdown of why the standard proof doesn't hold and whether rejecting free info is consistent with REU's philosophy. There's also an evaluative layer here—they want to know if this is a bug or a feature.

  I should start by walking through the EU proof step-by-step, highlighting where independence is used. Then I'll show how REU's risk-weighting function breaks that step. The key is that REU doesn't preserve stochastic dominance when new info is introduced because the risk weights depend on the whole gamble structure, not just marginal outcomes.

  For the example, I'll need something simple but illustrative. Maybe a medical decision with uncertain test results? The agent might refuse a free test because learning a bad result could force them into a choice that looks worse under their risk-averse weighting. The calculation needs to show that prior and posterior REU evaluations rank the options differently.

  The user also cares about the philosophical justification. I should emphasize that REU's global risk attitude means avoiding "dangerous knowledge" can be rational—it's not inconsistency but a different way of valuing gambles. This refusal is consistent with their one-shot preferences, so it's not a dynamic inconsistency issue.

  They might be testing whether REU is a viable alternative to EU, or perhaps they're constructing an argument about rationality. Their deep need seems to be understanding if REU's trade-offs are defensible despite this counterintuitive result. I should address that head-on in the assessment.
answer: |-
  Yes, **Good's theorem can indeed fail for a risk-weighted expected utility (REU) agent,** and it is rationally possible for such an agent to decline costless information. Let's break this down step-by-step:

  ### 1. Recap: Good's Theorem & the EU Proof
  The standard proof for EU relies critically on the **Law of Total Probability** and the **Independence Axiom**:

  1.  **Decision Problem:** Agent faces a choice set **A** of actions. States of the world **S** determine payoffs.
  2.  **Prior Optimal Action:** Choose action **a*** maximizing prior expected utility: **a* = argmax<sub>a ∈ A</sub> EU(a)**.
  3.  **Costless Information:** Signal **X** reveals information about **S** (partition of **S**). After observing **x**, the agent updates beliefs to **P(S|x)**.
  4.  **Strategy:** A strategy **σ** maps possible signals **x** to actions **σ(x) ∈ A**. One possible strategy is **σ<sub>ignore</sub>(x) = a*** for all **x** (ignore the information).
  5.  **Value of Strategy:** The value of a strategy is the expected utility *before* seeing **X**: **EU(σ) = ∑<sub>x</sub> P(x) * EU(σ(x) | x)**.
  6.  **The Key EU Step:** Using the Law of Total Probability and the linearity of EU:
      **EU(σ) = ∑<sub>x</sub> P(x) * ∑<sub>s</sub> P(s|x) * U(σ(x), s) = ∑<sub>s</sub> P(s) * U(σ(x(s)), s)**
      (where **x(s)** is the signal revealed when **s** occurs).
  7.  **Optimal Strategy:** The optimal strategy **σ*** chooses **σ*(x) = argmax<sub>a ∈ A</sub> EU(a | x)** for each **x**.
  8.  **Comparison & Good's Result:**
      *   **EU(σ*)** is at least as good as **EU(σ<sub>ignore</sub>)**, because **σ*** is chosen optimally *after* information.
      *   Critically, **EU(σ<sub>ignore</sub>) = ∑<sub>s</sub> P(s) * U(a*, s) = EU(a*)**, the prior optimal EU.
      *   Therefore: **EU(σ*) ≥ EU(σ<sub>ignore</sub>) = EU(a*)**

  **The Crucial EU Property:** This works because EU evaluates the *compound gamble* (first learn **x**, then get payoff based on **s** and **σ(x)**) by simply averaging *all* final outcomes weighted by **P(s)P(x|s) = P(x,s)**, treating it identically to a single-stage gamble. This is enabled by the **Independence Axiom**.

  ### 2. Where REU Breaks the Proof
  REU replaces the simple average (EU) with a risk-weighted calculation. For a gamble **G = (p₁, x₁; p₂, x₂; ... ; pₙ, xₙ)** with outcomes **x₁ ≤ x₂ ≤ ... ≤ xₙ** (ordered from worst to best), the REU is:
  **REU(G) = ∑<sub>i=1</sub><sup>n</sup> w(∑<sub>j=i</sub><sup>n</sup> pⱼ) * (U(xᵢ) - U(xᵢ₋₁))**
  (where **w** is a probability weighting function, **w(1)=1**, **w(0)=0**, often **w(p) < p** for risk aversion, and **U(x₀) = 0**).

  **The Breakdown:** The proof breaks down at **Step 6**. For REU:
  **REU(σ) ≠ ∑<sub>s</sub> P(s) * U(σ(x(s)), s)**

  *   **Why?** REU does *not* "flatten" compound lotteries into simple lotteries using the Law of Total Probability in a linear way. The risk-weighting function **w** is applied *globally* to the entire *distribution* of outcomes induced by the strategy **σ**.
  *   **The Compound Gamble:** The strategy **σ** induces a compound lottery:
      *   Stage 1: Signal **x** occurs with probability **P(x)**.
      *   Stage 2: Given **x**, action **σ(x)** is taken, yielding a lottery over outcomes **L<sub>σ(x)</sub>**.
      The overall outcome distribution is the mixture of the lotteries **{L<sub>σ(x)</sub>}** with probabilities **{P(x)}**.
  *   **EU vs. REU Evaluation:**
      *   **EU:** The EU of the mixture is the probability-weighted average of the EUs of the sub-lotteries: **EU(mixture) = ∑<sub>x</sub> P(x) * EU(L<sub>σ(x)</sub>)**. This is the step used in the proof.
      *   **REU:** The REU of the mixture is **NOT** generally equal to **∑<sub>x</sub> P(x) * REU(L<sub>σ(x)</sub>)**. The risk-weighting function **w** is applied to the *cumulative probabilities of the final outcome distribution*, not to the expectations of the sub-lotteries. **REU(mixture) = REU( Final Distribution )**. REU cares about the global risk profile of the entire gamble, not the average risk profile of its parts.

  **Consequence:** The value of the strategy **σ<sub>ignore</sub>** (which always yields lottery **L<sub>a*</sub>**) is simply **REU(L<sub>a*</sub>)**. The value of the optimal informed strategy **σ*** is **REU( Final Distribution of σ* )**. Because **REU(σ*)** is *not* simply the average of the **REU(L<sub>σ*(x)</sub> | x)** values, and because the risk weighting depends on the *overall* ordering of outcomes, it is possible that:
  **REU( Final Distribution of σ* ) < REU(L<sub>a*</sub>)**
  even though for *every possible signal **x***, **REU(L<sub>σ*(x)</sub> | x) ≥ REU(L<sub>a*</sub> | x)**.

  ### 3. Why Refusal Happens: A Simple Example
  Consider a highly risk-averse REU agent facing a medical decision:

  *   **Disease:** Rare (P=0.01), but catastrophic if untreated (Utility = -1000).
  *   **Treatment:** Effective if disease present (Utility = -1). Harmful side effects if disease absent (Utility = -10).
  *   **No Treatment:** Fine if disease absent (Utility = 0). Catastrophic if disease present (Utility = -1000).
  *   **Costless Test:** Perfectly accurate, reveals presence/absence.

  **Actions:**
  *   **Treat (T):** Lottery T = (0.01, -1; 0.99, -10) → Ordered: (-10, -1) → REU(T) = w(1.00)*(-1 - (-10)) + w(0.99)*(-10 - ?) [Simplified calc, but w(p) << p for small p]
  *   **Don't Treat (NT):** Lottery NT = (0.01, -1000; 0.99, 0) → Ordered: (-1000, 0) → REU(NT) = w(1.00)*(0 - (-1000)) + w(0.01)*(-1000 - ?) ≈ w(0.01)*(-1000) [since w(1)=1]
  *   **Prior Optimal:** For a sufficiently risk-averse **w** (e.g., w(p) ≈ 0 for p<0.1), REU(NT) ≈ w(0.01)*(-1000) is extremely negative. REU(T) = w(1)*(-1 +10) + w(0.99)*(-10) ≈ 9*w(1) -10*w(0.99). If w(0.99) is close to 1, REU(T) ≈ (9 - 10) = -1. **So prior optimal action is T (REU≈-1) > NT (REU≈-10 for w(0.01)=0.01).**

  **With the Test (Optimal Strategy σ*):**
  *   If Test Positive (Disease): Choose **T** → Get -1.
  *   If Test Negative (No Disease): Choose **NT** → Get 0.
  *   **Final Outcome Distribution of σ*:** (P=0.01, -1; P=0.99, 0) → Ordered: (-1, 0) → REU(σ*) = w(1.00)*(0 - (-1)) + w(0.99)*(-1 - ?) ≈ w(1)*(1) + w(0.99)*(-1) ≈ 1 - w(0.99)

  **The Refusal:**
  *   **REU(Prior Optimal T)** ≈ -1 (as calculated above).
  *   **REU(Optimal Informed Strategy σ*)** ≈ 1 - w(0.99)
  *   **Why REU(σ*) < REU(T)?** If the agent is sufficiently risk-averse (**w(p)** is very concave, i.e., w(0.99) is very close to 1), then **1 - w(0.99) ≈ 1 - 1 = 0**. However, recall our prior REU(T) estimate was ≈ -1. So **0 > -1**, meaning **REU(σ*) > REU(T)**. Where's the refusal?

  **Refusal Requires a Slightly Different Setup:** The above shows acquiring info helps. Let's modify the payoffs slightly. Suppose the side effect of treatment is worse, say Utility = -20.

  *   **T:** (0.01, -1; 0.99, -20) → Ordered (-20, -1) → REU(T) ≈ w(1)(-1 +20) + w(0.99)(-20) ≈ 19*w(1) - 20*w(0.99) ≈ 19 - 20 = **-1** (if w(0.99)≈1)
  *   **NT:** Unchanged, REU(NT) ≈ w(0.01)*(-1000) **≈ -10** (if w(0.01)=0.01) → **T (-1) > NT (-10)**
  *   **σ*:** Unchanged, Final Dist: (0.01, -1; 0.99, 0) → REU(σ*) ≈ 1 - w(0.99) ≈ **0**
  *   **0 > -1**, so still prefers info.

  **True Refusal Example (Conceptual):** To get refusal, we need a case where learning forces the agent into choices that *individually* look good given the signal but *collectively* create a risk profile *worse* than the safe prior optimum under the agent's global risk weighting. Imagine:

  1.  **Prior:** High chance of a moderate loss, tiny chance of a huge gain. REU might prefer a safe action avoiding the loss, even giving up the gain (risk-averse).
  2.  **Information:** Reveals whether the huge gain is possible or not.
  3.  **Optimal After Info:**
      *   If gain is possible, take the risky action (aim for gain).
      *   If gain is impossible, take the safe action (avoid loss).
  4.  **Resulting Gamble:** Now the agent faces a gamble with a high chance of the safe outcome (good) but a tiny chance of the *risky action failing* (which might be *worse* than the moderate loss avoided by the safe prior action!). The *potential* for this very bad outcome (even if tiny probability), when weighted by a highly concave **w(p)**, could make the overall REU of the informed strategy *lower* than the REU of the safe prior action, which guaranteed avoidance of that very bad outcome.

  **The key is the "global" risk assessment:** The prior safe action avoids the *possibility* of the worst outcomes the informed strategy might sometimes lead to. The REU agent, focused globally on avoiding disasters, prefers the prior certainty of no-disaster to the informed strategy which, while good on average and conditionally optimal, introduces even a tiny risk of something catastrophic that the prior action avoided.

  ### 4. Assessment: Cost or Defensible Feature?

  *   **Violation of Good's Theorem as a Cost?** From the perspective of traditional Bayesian rationality and value-of-information analysis, yes, this seems like a cost. It means agents might pass up genuinely valuable information that could objectively improve their outcomes (in terms of the actual realized utilities), purely due to their sensitivity to the *description* of the risk (the global gamble structure). It violates the principle that "more information can't hurt".
  *   **Defensible as Consistent with Global Risk Attitude?** Buchak argues **yes, it is defensible**. REU is explicitly designed to model agents who care about the global risk context of a decision, not just local averages or conditional performances. Declining the information is:
      *   **Dynamically Consistent:** The agent evaluates the options *before* learning the information. They prefer the safe prior action **a*** to the *gamble* induced by the optimal informed strategy **σ***. If they *did* learn the information, they would indeed follow **σ*** and choose the conditionally best action for each signal. There's no conflict between their ex-ante and ex-post plans; they are carrying out the plan (ignore info) that they preferred ex-ante. This is **not dynamic inconsistency**.
      *   **Reflecting Core Axioms:** This behavior flows directly from REU's violation of the Independence Axiom and its dependence on the global risk profile. It's a consequence of the very features that allow REU to accommodate Allais preferences and capture a specific, coherent attitude towards risk – one that prioritizes avoiding the worst possible outcomes in a global sense.
      *   **"Dangerous Knowledge":** The agent views the information as potentially "dangerous" not because it changes the world, but because learning it *commits* them to a course of action (the conditionally optimal one) that, while good locally, introduces a global risk structure they find unacceptable compared to their safe prior option. They rationally prefer not to be put in that position of potential commitment to risk-taking.

  **Conclusion:** Good's theorem fails under REU due to the breakdown in the "flattening" of compound lotteries caused by the non-linear risk weighting applied to the global outcome distribution. An REU agent can rationally refuse costless information. While this violates a principle often associated with rational information acquisition under EU, it is a **defensible consequence** of the global risk attitude that REU is designed to model. It represents a coherent (though non-EU) way of managing deep uncertainty and aversion to catastrophic risks, not a dynamic inconsistency. The "cost" is primarily from the perspective of EU-based norms of rationality, which REU explicitly challenges.
