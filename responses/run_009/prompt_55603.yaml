answer: |-
  Here's the draft adversarial collaboration statement, structured as requested. It isolates genuine agreements, frames disagreements with testable cruxes, and flags verbal ambiguities—aiming to make the debate tractable rather than resolved.

  ---

  **Joint Statement on Objective Chance: Humean Best-System vs. Single-Case Propensity**  
  *Authored collaboratively by [Lewisian] and [Propensity Theorist], facilitated by [Your Name]*

  ### I. Agreed Claims (Both Signatories Endorse)
  1. **The Principal Principle (PP) as Core**: Rational credence must defer to known objective chance, absent *inadmissible evidence*. Formally: Cr(A | ch(A) = x ∧ E) = x, where E is admissible with respect to ch(A).  
  2. **Inadmissible Evidence Undermines Deference**: Knowing a future outcome (e.g., tomorrow’s lottery result) or evidence logically/conceptually tied to the outcome (e.g., a Laplacean demon’s prediction) voids PP-based deference to pre-outcome chances.  
  3. **Chance Must Ground Frequencies**: Any viable theory of chance must explain why long-run frequencies typically (though not invariably) approximate chances. Systematic divergence falsifies a claimed chance.  
  4. **Chance is Non-Trivial**: Chance assignments require empirical grounding beyond ignorance. "Chance" isn’t merely a label for subjective uncertainty.  
  5. **The "Bug" is Real**: Lewis’s original PP formulation fails in cases involving *undermining futures* (e.g., where the actual future frequencies undermine the current best-system chance) or uncertainty about current chances. Both accept that *some* revision (e.g., New Principle, meta-credence approaches) is needed.  
  6. **Formal Role is Shared**: Chance’s core function is to constrain rational credence via PP (or its successor) and to explain systematic patterns (e.g., statistical mechanics, quantum outcomes).

  ### II. Disagreements & Cruxes
  | Disagreement                                                                 | Crux                                                                                                | Concrete Test Case / Argument                                                                                                  | Humean Prediction                                                                                           | Propensity Prediction                                                                                      |
  | :--------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------- |
  | **1. Chance requires indeterminism?**<br>(Propensity: Yes; Humean: No)       | Can a deterministic world exhibit genuine non-extremal (0 or 1) objective chances?                  | **World D:** A Newtonian universe with chaotic dynamics. Coin-flip frequencies are 50% over all human history. No hidden vars. | YES. Best System assigns ch(Heads)≈0.5: systematizes patterns efficiently.                                  | NO. No irreducible disposition/propensity exists; outcome determined by initial conditions. "Chance" is illusory. |
  | **2. Status of PP:**<br>(Humean: Analytic/constitutive; Propensity: Contingent/normative) | Is PP a conceptual truth about "chance," or a substantive law linking physical propensities to rationality? | **Oracle Case:** An oracle reveals *only* that the PP holds for some physical magnitude P in World X. Does this *define* P as chance? | YES. If P satisfies PP (with admissibility), it *is* chance by definition.                                  | NO. P might *correlate* with true propensities. PP is a norm linking rationality to real dispositions.      |
  | **3. Handling Undermining Evidence:**<br>(Humean: Best-System can adapt; Propensity: Reveals Humean fragility) | Can BSA assign a chance *x* that (if true) makes histories exhibiting *x* less likely? | **Quantum Undermining:** A world where the true chance of decay *p* makes it likely that the global frequency diverges from *p*. | YES (via New Principle). Best System assigns ch(p)=x, but Cr(history \| ch(p)=x) ≠ frequency in that history. | NO. True propensity *p* is fixed; undermining shows BSA’s "chance" isn’t the real physical disposition.    |
  | **4. Origin of Single-Case Chances:**<br>(Propensity: Fundamental; Humean: Emergent from mosaic) | Does a unique, isolated event (no frequencies) have an objective chance?                            | **Cosmic Die:** A universe with one radioactive atom decaying once. No other chancy events.                                   | NO. No pattern to systematize; no non-arbitrary chance assignment.                                           | YES. The atom’s physical structure confers a propensity (e.g., ch(decay)=0.5) irrespective of frequency.   |

  ### III. Verbal Ambiguities (Clarifying the Battleground)
  1. **"Propensity"**: 
     - *Propensity Theorist*: Means a *sui generis*, irreducible physical disposition (like a causal power).
     - *Humean*: Often interprets "propensity" as just a *label* for patterns in the mosaic. **Crucial**: The dispute is **not merely verbal** here—it’s about ontological commitment vs. reduction. But confusion arises if "propensity" is used loosely.
  2. **"Reducible"**: 
     - *Humean*: "Reducible" means *supervenient on the Humean mosaic* (non-causal, non-modal).
     - *Propensity Theorist*: "Reducible" often implies *eliminable* or *non-real*. **Resolution**: Both agree chance isn’t eliminable (per Agreed Claim 4). The fight is over *what it supervenes on* (mosaic vs. irreducible powers).

  ### IV. What Could Move the Debate
  1. **Clarifying PP’s Status**: If PP is constitutive (Humean view), denying it for a physical magnitude implies it’s not chance. The Propensity theorist must explain why rational agents *must* defer to propensities without making PP analytic.  
  2. **Indeterminism Test**: Finding a deterministic system where *both sides agree* non-extremal chances exist (or don’t) would force revision. World D is a candidate.  
  3. **Undermining Resolution**: Can the Humean *derive* a non-circular, non-*ad-hoc* revision to PP (like the New Principle) from BSA? Or does it feel like "cheating" (Propensity worry)?  
  4. **Propensity’s Testability**: Can the Propensity theorist specify an *empirical signature* distinguishing a world with propensities from a Humean world with identical frequencies? If not, the Humean claims victory via parsimony.

  ---

  **Why this might help**: It forces each side to commit to testable predictions (*World D*, *Cosmic Die*), isolates non-verbal disagreements (e.g., indeterminism), and flags where terminology fuels needless conflict. The cruxes focus on questions where new arguments/data could shift positions—not just restate dogma. By signing, they acknowledge the *structure* of their dispute, even if resolution awaits future work. Good luck—this is philosophy at its most trenchant!
