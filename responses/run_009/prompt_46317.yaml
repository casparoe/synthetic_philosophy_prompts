answer: |-
  ### Activity Design: "Release Committee Dilemma"

  #### **Objective**
  Demonstrate how group decisions can yield conflicting outcomes based on voting procedure (direct conclusion vote vs. premise-based vote), while incorporating rule selection and strategic voting. Highlight the "discursive dilemma" in judgment aggregation.

  ---

  ### **Materials & Setup**
  1. **Premises** (printed on cards/posters):  
     - **P1**: Tests pass in staging? (Yes/No)  
     - **P2**: No unresolved privacy concerns? (Yes/No)  
     - **P3**: Rollback plan exists? (Yes/No)  

  2. **Decision Rules** (voted on by the group):  
     - **Rule A (Unanimous)**: Ship only if **all premises** are true.  
     - **Rule B (Majority)**: Ship if **≥2 premises** are true.  

  3. **Ballots**:  
     - **Rule Vote**: Blank slips for voting on Rule A vs. Rule B.  
     - **Round 1 (Conclusion Vote)**: "Verdict: Ship the feature? ⃞ Yes ⃞ No"  
     - **Round 2 (Premise Vote)**: Separate ballots for P1, P2, P3 (Yes/No).  

  4. **Secret Cards** (for strategic voting twist):  
     - 2 cards: *"Vote YES on P2 ONLY (even if you think NO) to force a SHIP verdict. Keep this secret."*  
     - 2 cards: *"Vote NO on P2 ONLY (even if you think YES) to force a NO-SHIP verdict. Keep this secret."*  

  5. **Fact Sheet** (for all participants):  
     > **Feature X**: New user dashboard tracking behavior.  
     > - **P1**: Tests passed after 1 retry (flaky test).  
     > - **P2**: Privacy policy updated, but 1 unresolved concern about data retention.  
     > - **P3**: Rollback plan exists but hasn’t been tested in 6 months.  
     > *Interpret these as you see fit!*  

  6. **Scoring & Stakes**:  
     - **Team Bragging Rights**: The voting bloc (pro-ship or anti-ship) that "wins" the final verdict gets applause + silly trophy (e.g., a toy rocket).  
     - **Individual Bonus**: Anyone who guesses both outcomes correctly wins "Committee Oracle" title.  

  ---

  ### **Timeline (60 min)**  
  1. **Intro & Setup (5 min)**  
     - Explain the scenario: "We’re a release committee deciding whether to ship Feature X. We’ll vote twice using different methods. Your goal: Get the ‘right’ outcome!"  
     - Distribute fact sheets.  

  2. **Rule Vote (10 min)**  
     - Debate: "Which rule better reflects our team’s values?" (Unanimous = safety-first vs. Majority = pragmatism).  
     - **Vote**: Majority wins (e.g., Rule A chosen if 7/12 vote for it).  

  3. **Round 1: Direct Conclusion Vote (10 min)**  
     - Instruct: "Based on the facts, vote whether to ship. Ignore premises—use your gut!"  
     - Tally votes publicly (e.g., 7 Yes, 5 No → **Ship**).  

  4. **Round 2: Premise-Based Vote (15 min)**  
     - **Step 1**: Vote on P1, P2, P3 individually (secret ballots).  
     - **Twist**: Mid-vote, quietly hand **2 strategic cards** to random participants (1 pro-ship, 1 anti-ship).  
     - Tally premises (e.g., P1: 8Y/4N, P2: 6Y/6N, P3: 9Y/3N).  
     - Apply the rule:  
       - If **Rule A (Unanimous)**: Ship only if P1+P2+P3 all true.  
       - If **Rule B (Majority)**: Ship if ≥2 premises true.  
     - Announce verdict (e.g., Rule A + P2 tie → **No Ship**).  

  5. **Debrief & Discussion (20 min)**  
     - Reveal outcomes: "Round 1 said **Ship**, Round 2 said **No Ship**. Why?"  
     - Key questions:  
       - "Why did the two methods disagree? Is one ‘fairer’?"  
       - "Did anyone notice odd voting patterns? (Reveal strategic cards here if uncaught.)"  
       - "Should we trust gut feelings (Round 1) or logical steps (Round 2)?"  
     - Guide them to discover:  
       - **Discursive Dilemma**: Premise majorities (P1=P3=True, P2=False) ≠ direct conclusion majority.  
       - **Strategic Voting**: How one premise swing can flip the outcome.  

  ---

  ### **Twist Handling: Strategic Voting**  
  - **If unnoticed**: Reveal cards during debrief. Ask: "How did this change the outcome? Is premise-based voting vulnerable to manipulation?"  
  - **If caught early**: Praise the group! Discuss: "How can we prevent this IRL?"  

  ---

  ### **What the Activity Can’t Show (Brief Explainers for Debrief)**  
  1. **Consistency Impossibility**:  
     - In real judgment aggregation, even if every member votes logically (their conclusion follows premises + rule), group-level inconsistency can arise. Our activity can’t replicate this cleanly because we *assigned* votes.  
     - **Quick explainer**: "Imagine 3 voters:  
       - V1: P1=Y, P2=Y → Ship  
       - V2: P1=Y, P2=N → No Ship  
       - V3: P1=N, P2=Y → No Ship  
       Premises: P1=Y (majority), P2=Y (majority) → Ship. But direct vote: 2 No Ship → No Ship. Conflict!"  

  2. **No Perfect Solution**:  
     - The literature proves *no* voting method avoids all paradoxes. Premise voting is vulnerable to manipulation; conclusion voting ignores logical structure.  

  3. **Beyond Yes/No**:  
     - Real decisions involve weighted premises, uncertainty, and trust—this activity simplifies to binary choices.  

  ---

  ### **Why This Works**  
  - **Surprise Factor**: Groups rarely expect identical inputs → opposite outcomes.  
  - **Stakes**: Bragging rights foster engagement without real consequences.  
  - **Debrief**: Engineers "discover" the dilemma through argument, making it stick.  

  **Pro Tip**: End with, "Next week: How Kubernetes resolves this in rollouts!" (Ties to their world 😉)
