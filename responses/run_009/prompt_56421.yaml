  For the residue analysis, legitimacy is particularly tricky - political theorists care about who decides as a matter of principle, not just outcome. In distributed systems, we'd typically care about correctness and performance, not the symbolic value of which node processes a request. This feels like a genuine gap in the vocabulary.

  Identity and membership is another hard problem. Cantons or Länder aren't just arbitrary partitions; they represent historical communities. The closest technical concept might be affinity groups in sharding, but that's still primarily about efficiency rather than belonging.

  The criteria problem highlights a fundamental difference: political subsidiarity assumes an objective answer to competence allocation, while in distributed systems it's often pragmatically determined by operational constraints. This might reveal something about the political theory itself rather than a vocabulary limitation.

  I'll structure the response as: 
  1) Core translation table focusing on the strongest mappings 
