answer: |-
  Here is a rigorous translation and residue analysis, respecting both domains' integrity. I've discarded weaker mappings (e.g., CAP theorem parallels proved unstable under scrutiny of political resilience mechanisms) to present only robust translations.

  ### Core Translation Table (Faithful Mappings)
  | Political Concept              | Distributed Systems Translation                                                                 | Fidelity Note |
  |-------------------------------|-------------------------------------------------------------------------------------------------|---------------|
  | **Subsidiarity Principle**    | A latency-*aware* **cost function** for workload placement, where cost includes:                | High fidelity. The "sufficient achievement" test maps to evaluating whether local computation reduces global coordination overhead (latency) *and* whether the local node has sufficient compute/storage resources (capacity). Crucially, the cost function includes a **weighted term for local autonomy** (see residue). |
  | (EU Art. 5(3), TFEU)         | - Coordination overhead (global state sync latency)                                             |               |
  |                               | - Resource utilization (node capacity vs. workload demand)                                      |               |
  |                               | - Penalty term for unnecessary centralization (violating autonomy SLO)                          |               |
  | **German Executive Federalism**| **Strict interface contracts with delegated implementation.**                                   | High fidelity. The Bundestag defines the **API schema** (legislation), Länder provide **conformant implementations** (administration). Bundesrat consent is a **governance gate** ensuring implementers (Länder) approve interface changes. |
  | (Bundesrat consent, Art. 84 GG)| - Federal level owns the API specification (law)                                                |               |
  |                               | - Länder nodes run service instances with strict compliance testing                             |               |
  |                               | - Changes to core API require approval from implementers (Bundesrat = maintainer quorum)        |               |
  | **Swiss Double Majority**     | **Quorum requirements with weighted fault domains.**                                            | High fidelity. Cantonal majority treats cantons as **independent fault domains** (like availability zones). The double majority requirement ensures consensus isn't dominated by high-population cantons ("high-throughput nodes"), forcing agreement across geographic/political partitions. |
  | (Art. 142, Swiss Const.)      | - Popular vote majority = aggregate throughput consensus                                        |               |
  |                               | - Cantonal majority = consensus across independent partitions                                   |               |
  | **US Commerce Clause Drift**  | **Scope creep in shared platform services.**                                                    | High fidelity. Wickard v. Filburn expanded the "interstate commerce" **API surface** to include activities with only aggregate effects. Like a shared service (e.g., auth) claiming ownership of any request touching adjacent resources. Post-*Lopez* retrenchment mirrors **refactoring to bounded contexts**. |
  | (Wickard v. Filburn, Lopez)   | - Initial tight coupling to core cross-cutting concerns (inter-state trade)                     |               |
  |                               | - Gradual expansion to peripheral activities via aggregate impact arguments                     |               |
  |                               | - Eventual threshold checks (Lopez) acting as **rate limiters** on scope                        |               |
  | **EU Early Warning Mechanism**| **Low-sensitivity liveness probe with manual override.**                                        | Moderate fidelity. The 1/3 national parliament threshold is a **high-latency health check** with low sensitivity, rarely triggering. Its value lies in forcing explicit **acknowledgment of subsystem state** during policy deployment (legislation), not auto-remediation. Override via QMV is manual failover. |

  ### Residue Report: What Doesn't Map (and Why)
  The untranslatable elements reveal fundamental differences in problem space, not vocabulary gaps.

  1.  **Legitimacy ("Who Decides Matters")**  
      *Residue Type: Conceptually Alien*  
      Political claim: Legitimacy arises from the *source* of a decision, even if outcome-identical. E.g., a canton deciding its own school curriculum is legitimate; the same rule imposed centrally is not.  
      Engineer's vocabulary: Nodes are interchangeable if state/outcome is consistent. Audit logs track provenance for debugging/security, not intrinsic value.  
      *Analysis*: This isn't a missing term (like tense). It's a disconnect in **system purpose**. Distributed systems optimize for *correctness* and *performance*. Politics cares about *acceptance* via perceived rightful authority. "Legitimacy" maps to nothing in your stack because nodes don't revolt when the control plane acts within spec but without "consent." This residue exposes politics' irreducible concern with **symbolic validation**.

  2.  **Identity & Membership**  
      *Residue Type: Ontological Mismatch*  
      Political reality: Federal units (Länder, cantons) exist due to historical/cultural **affective ties** – language, ethnicity, shared trauma. Loyalty isn't fungible.  
      Engineer's vocabulary: Nodes are provisioned/partitioned for *functional efficiency* (sharding, data locality). "Affinity" rules exist for performance, not sentiment.  
      *Analysis*: Your vocabulary assumes nodes are **ephemeral resources**. Politics assumes units are **constitutive communities**. You *could* force a mapping (e.g., "hard affinity rules"), but it distorts by implying identity is about *routing efficiency*, not existential belonging. This residue highlights that federalism manages **irrational human attachments**, not just rational task allocation.

  3.  **Criteria Problem (Abstract Competence)**  
      *Residue Type: Reveals Theoretical Ambiguity*  
      Political claim: Subsidiarity implies an objective test for "appropriate level."  
      Engineer's reality: Placement decisions are pragmatic – who has resources, pager duty, budget.  
      *Analysis*: This residue doesn't expose a vocabulary gap but a **flaw in political theory**. Your "pager/budget" lens usefully demystifies: "competence" is often an ex-post rationalization of *capability* (capacity + ownership incentives). Theorists obscure this with normative abstractions ("closer to citizens"). Your vocabulary forces clarity: if a "lower level" lacks resources or incident response, subsidiarity is irrelevant. The residue here is **political theory's self-delusion** about rational competence allocation.

  #### Additional Residues:
  - **Sovereignty as Non-Derivative Authority**: Federal units claim inherent (not delegated) power. No equivalent to "root node" exists in your vocabulary, where all authority derives from the control plane. This *is* a vocabulary gap – systems lack a concept of **non-delegated primacy**.
  - **Deliberative Democracy**: Political systems value process (debate, representation) intrinsically. Your vocabulary optimizes for *outcome efficiency*. "Circuit breakers" terminate failures fast; filibusters *create* delay as a feature. Untranslatable.
  - **Exit vs. Voice**: Citizens can't "reshard" themselves easily (exit is costly). Loyalist nodes don't exist. This residue shows politics handles **sticky, stateful clients**.

  ### Verdict: Vocabulary as Scaffolding, Not Structure
  **Use your vocabulary as scaffolding, then dismantle it.**  
  - **Why Scaffolding Works**: It accurately models *mechanics* (competence allocation, veto points, scope creep) better than vague political metaphors. Engineers will grasp federalism's *operational logic* faster via your terms.  
  - **Why It Must Be Dismantled**: The residues prove political systems solve fundamentally different problems – managing legitimacy, identity, and irrational loyalty – with different success criteria (acceptance over efficiency). Your vocabulary risks implying these are mere "bugs" to optimize away.  

  **Structural Insight Gained**: Your lens *usefully exposes* that many federalism debates are really about **implicit SLOs** (e.g., legitimacy budget, identity affinity requirements) that theorists leave unquantified. But it cannot capture why those SLOs exist.  

  Final translation axiom: **Federalism is what happens when your distributed system's nodes have moral agency, historical trauma, and the ability to revolt. Your vocabulary describes the plumbing; politics is about why the water is angry.**
