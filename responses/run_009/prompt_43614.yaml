     (This means adding it to the official Geological Time Scale, like "Jurassic" or "Holocene," using strict rules).  
     - **NO** → **Leaf: *No Formal Epoch (2024 IUGS Position)***  
       *Awkward commitment: Must argue human impacts are real but don't justify a new epoch, leaving "Anthropocene" as a loose cultural term.*  
     - **YES** → Go to Q2.

  2. **Must the start date be defined by a *golden spike* (GSSP)?**  
     (A GSSP is a physical "anchor" in rock/ice layers visible *globally* to future geologists—e.g., plutonium traces or abrupt carbon shifts).  
     - **NO** → Go to Q3.  
     - **YES** → Go to Q4.

  3. **Do pre-industrial human impacts (e.g., ancient farming, deforestation) mark a *planetary shift*?**  
     - **YES** → **Leaf: *Early Anthropocene (Ruddiman)***  
       *Start:* ~5,000–8,000 years ago. *Deciders:* Geologists + archaeologists.  
       *Awkward commitment: Must explain why slow, regional changes (e.g., rice paddies) override the 11,700-year Holocene.*  
     - **NO** → **Leaf: *Industrial Revolution (Crutzen)***  
       *Start:* ~1784 (steam engine). *Deciders:* Geologists + historians.  
       *Awkward commitment: Admits the signal isn't globally synchronous (spread gradually from Europe), violating golden-spike ideals.*

  4. **Is the *sharpest global signal* tied to *colonial exchange* or *nuclear age*?**  
     - **COLONIAL EXCHANGE** → **Leaf: *Orbis Spike 1610 (Lewis & Maslin)***  
       *Start:* 1610 (CO₂ dip from Americas depopulation). *Deciders:* Stratigraphers (golden-spike rules).  
       *Awkward commitment: Marks the Anthropocene with a genocide-driven "cold spike" in ice cores.*  
     - **NUCLEAR AGE** → **Leaf: *Great Acceleration 1950 (Crawford Lake)***  
       *Start:* 1950 (plutonium fallout). *Deciders:* Stratigraphers (golden-spike rules).  
       *Awkward commitment: Uses a potentially reversible marker (nuclear test ban) to define an epoch.*

  5. **Is the driver *humanity as a species* or a *specific system*?**  
     (From Q1: If "NO" to formal epoch)  
     - **HUMANITY** → Stay with *No Formal Epoch* leaf.  
     - **SPECIFIC SYSTEM** → **Leaf: *Capitalocene***  
       *Start:* ~1500s (capitalism/colonialism). *Deciders:* Social scientists, not geologists.  
       *Awkward commitment: Rejects geology's authority, arguing "epochs" should name *economic* systems, not biological agents.*

  ---

  ### **Empty Logical Spots & Why They're Unexplored**
  - **Formal epoch + No golden spike + Pre-industrial start** (e.g., Ruddiman with GSSP): *Incoherent*—early impacts lack a global synchronous marker.  
  - **Formal epoch + Capitalism as driver** (e.g., Capitalocene with GSSP): *Unattractive*—stratigraphers avoid naming epochs after economic systems.  
  - **No formal epoch + Golden-spike start date**: *Unexplored*—rejecting formal status makes golden spikes irrelevant.

  ---

  ### **Where the Tree Fails (and Why)**
  - **Blurry line between "No Formal Epoch" and "Great Acceleration 1950":**  
    The tree separates them cleanly (Q1), but in reality, many 1950 supporters (e.g., Crutzen) *agree* with IUGS that a golden spike is premature—yet still insist 1950 is the *scientific* start. This is a **procedural disagreement**, not a factual one: both camps see 1950 as a turning point but fight over whether it needs "official" status. The tree forces a binary choice ("formal" vs. "informal") that feels artificial here.  
    *Why it's a live fight:* Stratigraphers (IUGS) say golden spikes are mandatory; dissenting scientists say the *phenomenon* matters more than the *label*.

  - **Industrial Revolution's weak spot:**  
    Its placement (Q3) implies it rejects golden spikes, but some supporters (e.g., early Crutzen) argued for coal soot as a "near-global" signal. The tree overstates its rejection of stratigraphic rules.

  ---

  ### **Confidence Assessment**
  - **Overall confidence: 85%**.  
    The tree correctly isolates core disputes (golden spikes vs. gradual shifts; geology vs. social science) and explains why positions like Ruddiman's or Capitalocene clash with mainstream stratigraphy.
    
  - **Where experts would redraw branches:**  
    - A **stratigrapher** would collapse Q2–Q4: to them, *any* formal epoch *requires* a golden spike (so Ruddiman/Crutzen are invalid as "epochs").  
    - An **ecomodernist** (pro-technology environmentalist) would add a branch: *"Are human impacts *reversible*?"* (Their answer: YES → Great Acceleration; NO → Orbis/Industrial).

  - **Least confident leaf: *Early Anthropocene (Ruddiman)***.  
    Its placement (Q3) suggests supporters *want* a formal epoch without a golden spike, but many Ruddiman backers see the Anthropocene as *informal* or a "sub-epoch." The tree oversimplifies by tying it to procedural ambition rather than its core idea (early human agency).  
    **Stress-test in class:** *"If Ruddiman's farming impacts are global but gradual, can they ever be 'epoch-worthy' under geology's rules? Or does this prove the rules are flawed?"*

  ---

  ### **Teaching Notes**
  - **Key friction:** The 2024 vote didn't resolve *when* human impacts peaked—it ruled that stratigraphy *as a discipline* isn't the right tool to codify it. Use the tree to show science is shaped by institutional rules (golden spikes) vs. cultural narratives ("age of humans").  
  - **Simplifications:** Dates (1610, 1950) are shorthand for complex events; "deciders" reflect who each camp empowers.  
  - **Class hook:** Start with Crawford Lake mud cores (plutonium layer) vs. colonial-era pollen records to visualize the "sharp signal vs. gradual change" divide.
