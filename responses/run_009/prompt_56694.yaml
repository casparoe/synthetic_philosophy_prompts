prompt: |-
  Me and my friend had a massive argument over coffee about Simpson's paradox and now I can't let it go, so I'm outsourcing it to you. Context: I'm the analyst on the performance team at a regional health board, and every quarter I put together the dashboard comparing our clinical units on things like mortality, readmissions, infection rates. And every quarter the same fight happens: unit A looks worse than unit B on the headline number, then somebody slices it by patient severity and the ranking flips, then somebody else slices it by site or by age band and it flips back again. Everyone has an opinion and no one has a rule. My friend's position was basically "just always show the disaggregated numbers" but that can't be right, because disaggregated by *what*? Severity, site, surgeon, month? You can almost always find some slice that flips a comparison, and thats exactly how people gerrymander dashboards to make their unit look good.

  So write me a decision procedure I can actually run on each metric before it goes into the quarterly pack: the things to check, in what order, when aggregating is safe, when disaggregating is obligatory, and how to pick the conditioning variable when several are available. I gather from reading around that the causal direction matters here — whether the subgrouping variable sits upstream of the thing you're comparing, or is itself affected by it — but I've never seen that turned into something a non-statistician can follow. It needs to be runnable in about an hour per metric by me, with no causal graph to hand, and it should say explicitly where it stops being maths and becomes a judgment call I have to own, plus where an apparent flip is just small-numbers noise rather than a paradox at all.

  Then run it on two realistic cases: (1) two cardiac units where unit A has lower mortality overall but higher mortality in both the low-risk and the high-risk patient bands, and (2) a new wound-dressing technique that does better than the old one in both the small-wounds group and the large-wounds group but worse overall, where we're deciding whether to roll it out board-wide. I want at least one of these to come out with an answer that will annoy whoever commissioned the dashboard — if the procedure never contradicts the gut feeling of the committee, it's not doing its job. Please write in British English, and don't just tell me to consult the causal literature — half the point is that nobody here has that, we have three consultants in a meeting room and a spreadsheet.
reasoning: |-
  We are going to design a decision procedure for handling Simpson's paradox in performance dashboards. The procedure will be pragmatic, step-by-step, and designed for an analyst in a health board setting. It will consider both statistical and causal aspects, but in a way that can be implemented without advanced causal graphs. The procedure will be broken down into steps, with clear guidelines on when aggregation is safe, when disaggregation is obligatory, and how to choose among several conditioning variables.

  **Decision Procedure for Handling Simpson's Paradox**

  **Step 0: Pre-Checks (Data Quality and Sample Size)**
  - Check for data quality issues: missing data, coding errors, etc. If severe, flag the metric for review.
  - Check sample sizes: if the overall numbers are very small (e.g., fewer than 10 events in either group), the metric is too noisy to interpret. Flag for caution or aggregation over a longer period.
  - If the disaggregated groups have very small numbers (e.g., any cell with fewer than 5 events), then any apparent flip might be due to noise. Do not trust the flip without further evidence.

  **Step 1: Check for Reversals in the Aggregate vs. Disaggregate**
  - Calculate the overall metric (e.g., mortality rate) for each unit (or treatment) and note the ranking.
  - For each candidate stratification variable (e.g., patient severity, site, age band, etc. — you will have a predefined list based on domain knowledge), disaggregate the data by that variable and check if the ranking flips in any subgroup or in the aggregate of subgroups (i.e., when you look within each stratum, the ranking is reversed compared to the overall).
    - If no flip is found for any stratification variable, then the overall metric is safe to report. But note: this does not guarantee there isn't a lurking variable you haven't checked. Proceed to Step 2 to see if there is a strong candidate variable that might change the story.
    - If a flip is found (e.g., unit A has lower mortality overall but higher in every severity group), then proceed to Step 2.

  **Step 2: Assess the Candidate Stratification Variables**
  - For each candidate variable that caused a flip (or is a priori important), assess:
    a) **Causal Direction**: Is the variable a pre-treatment (or pre-exposure) covariate? That is, does it occur before the unit/treatment assignment and could potentially confound the relationship? Examples: patient severity (if assessed at admission), age, comorbidities. These are usually good to condition on.
    b) **Mediator or Collider**: Avoid conditioning on variables that are consequences of the treatment (e.g., if the unit's performance affects the variable) or that are colliders (variables affected by both the treatment and outcome). Example: if you condition on a complication that occurs after admission, that might be a mediator and conditioning could introduce bias.
    c) **Domain Relevance**: Is the variable considered important by clinical guidelines or previous studies? (e.g., severity adjustment is standard in mortality analysis.)
    d) **Data Support**: Is the variable measured reliably and with sufficient granularity? (e.g., severity bands are well-defined and consistently recorded.)

  **Step 3: Select the Primary Stratification Variable**
  - Prefer variables that are:
    - Pre-treatment confounders (causal direction: they affect both the assignment and the outcome).
    - Clinically relevant and accepted in the field.
    - Measured well and with adequate sample size in each stratum.
  - If multiple variables pass these criteria, then:
    - If they are independent (e.g., severity and age are not strongly correlated), then condition on the one that is most strongly associated with the outcome (to reduce confounding).
    - If they are correlated, consider a multivariate adjustment (but note: this may be beyond a simple dashboard. If not feasible, pick the one that is most established in the literature).

  **Step 4: Decide on Reporting**
  - If no flip was found in Step 1 (or after Step 3, the flip is not justified), report the overall metric.
  - If a flip was found and the stratification variable selected in Step 3 is a strong confounder, then the disaggregated analysis (or an appropriately adjusted aggregate, like a standardized rate) is the fairer comparison and should be reported. In this case, the overall metric is misleading and should be either omitted or accompanied by a strong caveat.
  - If the flip is due to a mediator or collider, then conditioning on it is inappropriate. The overall metric is likely more appropriate, but note that there might be unaddressed confounding. This is a judgment call: if the flip is due to an inappropriate variable, then the overall metric stands, but you should note the limitation.

  **Step 5: Handle Special Cases**
  - **Small Numbers**: If the flip occurs in a stratum with very small numbers, it may be noise. Do not overinterpret. Consider aggregating categories or using a statistical model (e.g., hierarchical model) if feasible.
  - **Multiple Flips**: If flipping by one variable and then flipping back by another, go back to Step 2 to assess which variable is more causally sound. If both are pre-treatment confounders, consider a multivariate analysis. If not feasible, use clinical judgment and the variable that is more established.

  **Step 6: Document and Justify**
  - For each metric, document:
    - The overall metric and the ranking.
    - Which stratifications were checked and which caused flips.
    - The rationale for the chosen variable (or for using the overall).
    - Any limitations (e.g., small numbers, data quality).
  - This transparency will help when challenged.

  **Step 7: Review with Clinical Experts**
  - If in doubt, present the findings to clinical experts. They may have insights about the causal structure or the relevance of the variables.

  **Time Estimate**: Steps 0-6 should take about an hour per metric if you have the data prepped and a list of candidate variables.

  **Now, let's apply this procedure to the two cases.**

  **Case 1: Two Cardiac Units (Mortality)**
  - **Overall**: Unit A has lower mortality than Unit B.
  - But when stratified by patient severity (low-risk and high-risk), Unit A has higher mortality in both bands.

  **Step 0**: Check data quality and sample sizes. Assume adequate.

  **Step 1**: We found a flip when stratifying by severity.

  **Step 2**: Assess severity as a candidate variable.
  - a) Causal direction: Severity is a pre-treatment covariate (assessed at admission). It is a classic confounder because sicker patients are more likely to die and might be directed to one unit over the other.
  - b) It is not a mediator or collider (unless the unit assignment affects severity, which is unlikely).
  - c) Domain relevance: Severity adjustment is standard in mortality reporting.
  - d) Data support: Assume severity bands are well recorded.

  **Step 3**: Severity is a strong candidate. We condition on it.

  **Step 4**: Since the flip is due to a strong confounder, the disaggregated analysis (or an adjusted rate) is the fair comparison. Therefore, we report that Unit A has higher mortality in both low and high severity groups. The overall rate is misleading because Unit A might have been seeing less severe cases. The adjusted comparison (e.g., using direct standardization) should be used.

  **Conclusion for Case 1**: Report the severity-adjusted mortality. This might annoy the unit that was previously appearing better overall but is actually worse when adjusted. The dashboard should show both the overall and the adjusted, but with an explanation.

  **Case 2: New Wound-Dressing Technique**
  - The new technique does better than the old one in both the small-wounds group and the large-wounds group but worse overall.
  - We are deciding whether to roll it out board-wide.

  **Step 0**: Check data quality and sample sizes. Assume adequate.

  **Step 1**: We found a flip when stratifying by wound size (small vs. large). The overall shows the old dressing is better, but within each wound size group, the new dressing is better.

  **Step 2**: Assess wound size as a candidate variable.
  - a) Causal direction: Wound size is a pre-treatment covariate (it exists before the dressing is applied). It is a confounder because wound size affects healing and might also affect which dressing is chosen (e.g., clinicians might prefer the new dressing for large wounds and the old for small, or vice versa).
  - b) Not a mediator (the dressing doesn't cause the wound size).
  - c) Domain relevance: Wound size is a key factor in wound healing.
  - d) Data support: Assume it is reliably recorded.

  **Step 3**: Wound size is a strong candidate. Condition on it.

  **Step 4**: The flip is due to a confounder. Therefore, the overall comparison is misleading. We should base our decision on the stratified analysis: the new dressing is better for both small and large wounds. The reason for the overall reversal is likely that the new dressing was used more often on the more difficult wounds (large ones) which have higher infection rates. Thus, the old dressing had an easier case-mix.

  **Conclusion for Case 2**: Roll out the new dressing. The overall metric was biased because of confounding by wound size. This might annoy the committee if they were relying on the overall, but the procedure shows the overall is misleading.

  **Note**: In both cases, we have contradicted the gut feeling of someone (the unit that looked better overall in Case 1, and the committee that sees the worse overall in Case 2). This is exactly the job of the procedure.

  **Final Note**: The procedure relies on having a list of candidate variables. This list should be developed with clinical input and updated periodically. Also, in some cases, there might be multiple confounders and a simple stratification may not be enough (then consider multivariate adjustment). But the above steps should handle the most common Simpson's paradox cases.
answer: |-
  Below is a decision procedure tailored to your needs: a pragmatic, step-by-step checklist to handle Simpson's paradox in healthcare dashboards. It's designed for a non-statistician with limited time, explicitly flags judgment calls, and accounts for causal intuition without requiring formal graphs. I'll then apply it to your two cases, including one "annoying" conclusion.

  ---

  ### **Decision Procedure for Dashboard Metrics**  
  *(Run this pre-quarterly for each metric; assumes 3-5 candidate variables from domain knowledge)*  

  **Time Budget**: 45-60 minutes per metric (using pre-aggregated data).  
  **Inputs**: Metric data + list of candidate subgroupings (e.g., severity, site, age, admission month).  
  **Output**: Decision on whether to report overall, disaggregated, or adjusted rates + justification.  

  #### **Step 1: Initial Sanity Checks**  
  *(5 mins; screens out noise/errors)*  
  - **Check sample sizes**:  
    - If total events (e.g., deaths) < 20 overall or < 5 in any subgroup → **Stop**. Metric too noisy; report with warning or omit.  
  - **Check data quality**:  
    - If >10% missingness in key variables → **Flag** "Data limitations" in report.  
  - **Calculate overall metric**:  
    - Compute and rank units/treatments (e.g., Unit A mortality: 8% vs. Unit B: 10%).  

  **→ Proceed only if sample sizes/data are adequate. Otherwise, pause here.**

  #### **Step 2: Test for Reversals**  
  *(15 mins; detect paradoxes)*  
  - **Disaggregate by all candidate variables**:  
    - Stratify by severity, site, age, etc. (use 3-4 most clinically plausible).  
  - **Check for flips**:  
    - For each subgrouping, ask:  
      - Does the ranking *reverse* in the overall vs. within *all* subgroups? (e.g., Unit A loses overall but wins in every severity band).  
      - Does it reverse only in *some* subgroups? (e.g., Unit A wins only for high severity).  
  - **Assess reversals**:  
    - If no reversal → **Report overall metric** (but note: hidden confounders may exist).  
    - If reversal → Proceed to Step 3.  

  **Judgment Call**: Distinguish a true paradox (consistent reversal across subgroups) from cherry-picking (reversal in one subgroup only). Only the former demands action.  

  #### **Step 3: Evaluate Subgrouping Variables**  
  *(15 mins; causal triage)*  
  For each variable causing a reversal:  
  - **Q1: Is it a pre-exposure confounder?**  
    - Ask: "Could this variable influence both *assignment* to the unit/treatment AND the *outcome*?"  
      - *Yes* (e.g., severity, age, comorbidities) → Strong candidate for conditioning.  
      - *No* (e.g., post-admission complications, length of stay) → **Avoid** (risk of mediator/collider bias).  
  - **Q2: Is it clinically actionable?**  
    - Ask: "Would we change decisions based on this split?" (e.g., severity adjustments may inform resource allocation; "admission month" rarely does).  
  - **Q3: Is it reliable?**  
    - Check: Consistency of measurement, sample size per stratum, and face validity (e.g., "surgeon" may be confounded by case mix).  

  **Prioritization Rule**:  
  > Prefer subgroupings that are **pre-exposure confounders** + **clinically actionable** + **reliably measured**.  
  > If tied, pick the one most strongly associated with the outcome (e.g., severity > age for mortality).  

  **→ If no variable passes Q1–Q3 → Report overall metric with caveats.**  
  **→ If ≥1 passes → Proceed to Step 4.**  

  #### **Step 4: Resolve the Paradox**  
  *(10 mins; choose reporting strategy)*  
  - **Case A: One "best" subgrouping identified (Step 3)**:  
    - Report **disaggregated rates** (e.g., mortality by severity bands) + **standardized summary** (e.g., severity-adjusted rate via direct standardization).  
    - **Suppress the overall metric** (it’s confounded and misleading).  
  - **Case B: Multiple competing subgroupings**:  
    - If all agree (e.g., severity and age both flip rankings similarly) → Report disaggregated by the simplest variable.  
    - If they conflict (e.g., severity flips, site reverses it back!) → **Judgment Call**: Use the variable with strongest causal justification (Step 3 Q1). If unclear, report both with a warning: "Interpretation depends on context."  

  **Golden Rule**:  
  > Never aggregate when a pre-exposure confounder drives a reversal. Never disaggregate when subgroupings are post-exposure or non-causal.  

  #### **Step 5: Document & Frame**  
  *(5 mins; prep for committee)*  
  - **Write a verdict**: 1–2 sentences (e.g., "Overall metric suppressed due to confounding by severity; see adjusted rates").  
  - **Anticipate pushback**:  
    - If overriding the overall number, state: "Unadjusted comparison is biased because [variable] affects patient allocation."  
    - If ignoring a reversal, state: "[Variable] not adjusted for because it is not a pre-treatment confounder (e.g., it may be outcome-dependent)."  
  - **Flag uncertainty**: Explicitly note where clinical judgment was used (e.g., "Prioritized severity as confounder based on clinical consensus").  

  ---

  ### **Applied to Your Cases**  
  **Context**: British English, realistic healthcare constraints.  

  #### **Case 1: Cardiac Units (Mortality)**  
  - **Overall**: Unit A mortality 6.0% (lower) vs. Unit B 7.5%.  
  - **Disaggregated**: Unit A higher in both low-risk (A: 2% vs B: 1%) and high-risk (A: 18% vs B: 15%) bands.  
  - **Committee Gut Feeling**: "Unit A is better overall!"  

  **Procedure Run**:  
  1. **Step 1**: Sample size adequate (1000+ patients).  
  2. **Step 2**: Flip detected! Unit A loses within both severity bands.  
  3. **Step 3**: Evaluate "severity":  
     - Q1: **Pre-exposure confounder? Yes** (severity influences admission unit + mortality).  
     - Q2: **Actionable? Yes** (used for resource planning).  
     - Q3: **Reliable? Yes** (validated risk scores).  
  4. **Step 4**: Report severity-disaggregated data + severity-adjusted rates. Suppress overall.  
  5. **Step 5**: Verdict:  
     > "Unit A’s lower overall mortality is confounded by case mix; it admits fewer high-risk patients. Risk-adjusted mortality is higher in Unit A for both low-risk (+1.0%) and high-risk (+3.0%) patients. Unit B performs better after adjustment."  

  **Annoyance Factor**: High. Unit A’s team (likely commissioning the dashboard) will protest. Defence: "Reporting unadjusted mortality would misrepresent performance given Unit A’s case selection."  

  ---

  #### **Case 2: Wound Dressing (Infection Rate)**  
  - **Overall**: New dressing 12% infections (worse) vs. Old dressing 9%.  
  - **Disaggregated**: New dressing better in small wounds (New: 3% vs Old: 5%) and large wounds (New: 20% vs Old: 25%).  
  - **Committee Gut Feeling**: "New dressing loses overall; abandon rollout."  

  **Procedure Run**:  
  1. **Step 1**: Sample size adequate (500+ wounds).  
  2. **Step 2**: Flip detected! New dressing wins within both wound-size groups.  
  3. **Step 3**: Evaluate "wound size":  
     - Q1: **Pre-exposure confounder? Yes** (wound size affects dressing choice + infection risk).  
     - Q2: **Actionable? Yes** (guides dressing protocol).  
     - Q3: **Reliable? Yes** (size objectively measured).  
  4. **Step 4**: Report disaggregated by wound size + standardized summary. Suppress overall.  
  5. **Step 5**: Verdict:  
     > "The new dressing’s higher overall infection rate is confounded by its preferential use on large wounds (baseline risk: 25%). It outperforms the old dressing for both small (−2.0%) and large (−5.0%) wounds. Rollout is recommended, with monitoring."  

  **Annoyance Factor**: Nuclear. Commissioners see "worse overall" and want to kill the project. Defence: "The overall rate is biased because clinicians selectively used the new dressing on high-risk cases. Within comparable wounds, it’s superior."  

  ---

  ### **Why This Works**  
  - **Practical**: Uses causal intuition without graphs. Focuses on pre-exposure confounders (the #1 issue in healthcare).  
  - **Defensible**: Explicit criteria for choosing subgroupings (actionability, reliability) and rejecting flips (small samples, mediators).  
  - **Committee-Proof**: Forces you to own judgment calls (e.g., "severity prioritised over site due to clinical input") and shuts down gerrymandering by ignoring non-causal splits.  
  - **Stops Noise Chasing**: Step 1 filters small-sample flukes; Step 2 ignores cherry-picked subgroups.  

  **Final Tip**: Run this once with your clinical leads to agree on candidate variables (severity, age, site) *before* quarterly fights. It won’t prevent arguments—but it will ground them in causality, not optics.
