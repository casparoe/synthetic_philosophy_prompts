answer: |-
  1.  The adaptationist programme is your paranoid reader's conviction: every narrative element (a Chekhov's gun, a character's scar, an unusual surname) must be a deliberate plant by the author, demanding a specific payoff within the plot's economy; nothing exists merely as texture or backstory without this functional burden.
  2.  The spandrel is the textural detail or character trait that arises inevitably from the book's load-bearing structure—like the specific atmosphere generated by a first-person narrator (an entailment of that POV choice) or minor characters required by a locked-room plot—which the paranoid reader misreads as a deliberate plant, demanding a just-so story (a forced payoff explanation) for its presence.
  3.  Exaptation occurs when a detail originally present for structural necessity or mere texture (a spandrel) is later repurposed by the author (perhaps during revision, or discovered while drafting) to serve a new plot function or thematic payoff—just as a discovery writer might realise a surviving descriptive flourish can now resolve a subplot, blurring the line between what was planted and what merely accumulated.
  4.  The residue report: biology lacks any equivalent to the conscious author—there is no genuine intentional designer whose original purpose (plant) or later repurposing (exaptation) can be discerned or debated; natural selection is an unconscious, contingent process, rendering the paranoid reader's fundamental assumption of intentional design (right in principle for novels, however misapplied) utterly inapplicable and misleading in evolution.
  5.  Consequently, the deepest disanalogy makes this translation cautionary: while craft vocabulary illuminates the *reader's* interpretive fallacy (paranoid over-attribution of design), it profoundly distorts biology by smuggling in the ghost of an author, obscuring the core Gould-Lewontin point that nature's "details" exist without purpose, arising from structural constraint, historical accident, or non-adaptive causes entirely alien to novelistic craft.
