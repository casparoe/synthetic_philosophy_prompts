  First, I need to unpack what they're asking for. They want desiderata—what any adequate ethics of commemoration must deliver. They mentioned specific cases: Confederate monuments, Columbus, but also grey areas like an engineer with great achievements but questionable morals by today's standards, or a clerical error street name. They also want to know key distinctions like honoring vs. recording, original intent vs. current meaning, and community choice vs. imposed commemoration.

