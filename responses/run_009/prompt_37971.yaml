answer: |-
  Here’s a structural breakdown of the ethics of commemoration, tailored for your novel’s needs. I’ll use **British English** and focus on theoretical desiderata, distinctions, tensions, and how they challenge popular positions – all without strawmanning.

  ### Core Desiderata (What an Adequate Ethics Must Deliver)
  An ethical framework for commemoration must:
  1.  **Acknowledge Harm & Injustice:** Recognise how commemorations can perpetuate historical or ongoing harm, glorify oppression, or cause pain to marginalised groups.
  2.  **Ensure Historical Accuracy:** Avoid false narratives, whitewashing, or "great man" myths that obscure complexity (e.g., philanthropist *and* exploiter).
  3.  **Reflect Evolving Values:** Accommodate societal moral progress. What was acceptable (or mandated) in 1890 may be unacceptable now.
  4.  **Respect Community Agency:** Prioritise the voices and experiences of the communities most affected by the commemorated figure/history, not just the powerful or nostalgic.
  5.  **Distinguish Between History & Honour:** Treat recording history (essential) separately from bestowing contemporary public honour (contestable).
  6.  **Consider Function & Context:** Assess the *purpose* (why is this here?) and *location* (town square vs. museum) of the commemoration.
  7.  **Promote Transparency & Process:** Ensure decisions are made through fair, inclusive, and accountable processes, not just council inertia or loudest voices.

  ### Key Distinctions (That Can't Be Collapsed)
  *   **Honouring vs. Recording:** A statue on a plinth in a public square *honours*. A plaque, museum exhibit, or archive entry *records*. Conflating them is dishonest.
  *   **Original Intent vs. Present Meaning:** Why it was erected (e.g., gratitude for cottages) matters, but its *current* symbolic power (e.g., celebrating exploitation) matters more for its ethical standing *today*.
  *   **Community Choice vs. Imposition:** Was it erected by the workers' community or imposed by the elite/colonial regime? This affects its legitimacy and legacy.
  *   **Intrinsic vs. Accidental Commemoration:** A bridge named after a brilliant but morally flawed engineer intrinsically honours *them*. A street name from a clerical error is accidental – it commemorates nothing meaningful.
  *   **Individual vs. Systemic Harm:** Does the figure represent a broader, oppressive system (e.g., colonialism, slavery, exploitative industrialism), or were their flaws more personal? Systemic harm weighs heavier.

  ### Classifying Your Cases (Beyond Obvious Removal/Keep)
  | **Case Example**                          | **Key Ethical Considerations**                                                                                               | **Likely Verdict (Illustrative)**                                                                 |
  | :---------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------ |
  | **Confederate General Statue**            | Glorifies treason in defence of slavery; intrinsic harm; imposed (post-Reconstruction); systemic oppression.                | **Remove.** Fails almost all desiderata except (poorly) recording history.                         |
  | **Columbus Statue**                       | Glorifies colonisation, genocide; systemic harm; imposed narrative.                                                          | **Remove/Relocate.** Honouring is untenable; record history contextually elsewhere.                |
  | **Bridge named after Flawed Engineer**    | Primarily honours *technical achievement*, not character. Harm may be personal, not systemic intent of the commemoration.     | **Likely Keep (with context?)**. Distinction between honouring achievement vs. morals is clearer. |
  | **Street Name (Clerical Error)**          | Accidental; commemorates nothing; no intrinsic meaning or harm.                                                              | **Non-Case / Rename Pragmatically.** Ethics primarily concerned with *intentional* commemoration. |
  | **Hospital Wing (Robber Baron's Widow)** | Commemorates the *act of philanthropy* (the wing itself), not the source of the money. May be morally "tainted" but distinct. | **Contentious Keep.** Focus is on the gift, not the giver's spouse's source? Needs contextual plaque. |
  | **Your Mill Owner Statue**                | **Core Tension:** Honours philanthropy & local identity? Or whitewashes exploitation? Systemic harm? Who chose it? Location? | **Ethical Dilemma.** Requires weighing harm vs. history vs. evolving values vs. community voice.  |

  ### The Inherent Tensions (Jointly Unsatisfiable Requirements?)
  Your hunch is sharp. The core tension is:
  *   **Principle A: Commemoration as Contemporary Honour:** Public statues/names *are* statements of current values. If society no longer endorses the figure's actions/legacy, maintaining the honour is unethical.
  *   **Principle B: Stability & Avoiding "Historical Presentism":** Societies need continuity. Constantly rejudging every past figure by today's most progressive standards feels destabilising, erases layers of history, and risks ignoring context.

  **Why they conflict:** A demands we reassess honours as values evolve. B demands we resist constant reassessment to maintain stability and acknowledge past context. **An adequate ethics must navigate this, not resolve it perfectly.** It might prioritise *removal only when harm + misrepresentation are significant*, while favouring *contextualisation* for complex figures where harm is less direct/systemic. Absolute positions ("always remove taint" / "never rewrite history") fail.

  ### Knocking Out Popular Positions (The Single Requirement)
  Here's how **one key desideratum** fatally challenges each camp *when applied rigorously*:

  1.  **The "Keep & Add a Plaque" Camp:**
      *   **Knockout Requirement:** **#1 Acknowledge Harm & Injustice.**
      *   **Why it Knocks Them Out:** A plaque cannot mitigate the *ongoing symbolic harm and endorsement* inherent in maintaining a statue on a plinth in a prime public location. If the statue itself is experienced as a celebration of exploitation (systemic harm), the plaque is just an apology note pinned to an insult. It fails the community suffering the harm (#4). It often becomes a fig leaf allowing the *honour* to continue while pretending to address the problem.

  2.  **The "Remove Everything Tainted" Camp:**
      *   **Knockout Requirement:** **#5 Distinguish Between History & Honour / #7 Function & Context.**
      *   **Why it Knocks Them Out:** It collapses all commemoration into "honour" and ignores nuance. Is a street name *honouring* the accidental clerk, or just an administrative artifact? Does a hospital wing named after a donor intrinsically honour their spouse's robber baron crimes, or the act of giving? Removing *everything* potentially "tainted" erases complex history, can feel puritanical, and fails to consider location/function (e.g., museum vs. town square). It risks presentism without historical accuracy (#2).

  3.  **The "Context Decides" Camp:**
      *   **Knockout Requirement:** **#1 Acknowledge Harm & Injustice / #4 Respect Community Agency.**
      *   **Why it Knocks Them Out:** "Context" can become a weasel word used to avoid hard decisions, often privileging the context comfortable for the dominant group (e.g., "he was a man of his time"). If the *context* includes significant, unaddressed systemic harm *still felt* by a community today, and that community overwhelmingly experiences the statue as harmful *despite* context, then "context decides" becomes a tool for perpetuating injustice. It risks sidelining the most affected voices (#4) and minimising harm (#1) under a veneer of objectivity.

  ### Implications for Your Mill Owner & The Plaque Lady
  *   **The Plaque Lady (Local History Society):** Her solution **fails decisively** if the statue's *continued presence as a focal point of honour* is the core problem causing harm or perpetuating a false narrative. A plaque cannot change the statue's fundamental symbolic language. It *might* be minimally adequate *only if*:
      1.  The harm is seen as primarily about *lack of information* rather than the inherent honour.
      2.  The community most affected finds it acceptable.
      3.  The plaque is brutally honest, not a compromise text ("He built cottages but also crushed strikes and paid starvation wages").
      *   **Likely, she's offering a comforting illusion of resolution while preserving the problematic honour.**
  *   **Your Mill Owner Statue:** It sits squarely in the tension zone. The ethics demand asking:
      *   Is the *primary* effect now honouring philanthropy or sanitising exploitation? (Intent vs. Meaning)
      *   Does it cause *demonstrable harm* to specific communities *today*? (Harm)
      *   Who gets to decide? The descendants of the mill workers? The wider town? (Community Agency)
      *   Can the "history" be recorded better elsewhere without the honour? (History vs. Honour)
      *   Is there a stable consensus emerging? (Stability vs. Evolution)

  **In your council scene:** Show each character grappling with *at least one* of these core requirements or distinctions. The "winner" of the argument isn't necessarily the one with the ethically purest position, but the one who best exposes the tensions and complexities, forcing others to confront the inadequacy of simplistic solutions. The plaque lady's position is *understandable* (preservation! nuance!) but likely *ethically insufficient* for a figure embodying systemic harm still felt today. Good luck – this is the meaty stuff novels are made of!
