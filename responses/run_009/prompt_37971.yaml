  Looking at their deeper needs: They’re frustrated by shallow debates in real council meetings ("people shouting past each other") and want their fictional argument to have depth and structure ("joints"). They might also be seeking thematic resonance—how commemoration conflicts reflect broader societal tensions (e.g., historical progress vs. stability). The plaque lady haunting them suggests they’re wrestling with compromises; is a plaque a cop-out or legit solution?

  Now for the theoretical framework. Core principles would include: accuracy (no false narratives), non-harm (avoiding ongoing oppression), relevance (to current community values), and transparency about decision-making. Distinctions like honor vs. record are crucial—a statue’s pedestal implies endorsement, whereas a museum display contextualizes. 

  The "original intent vs. current meaning" tension is vital. A philanthropist’s statue erected to inspire gratitude now might symbolize exploitation. Who chose it matters too—a community honoring its own vs. a regime imposing a figure. 

  For conflicting principles: "Honour requires ongoing endorsement" vs. "Stability prevents constant revisiting" is indeed a key friction. You can’t both uphold eternal honour and avoid re-evaluation when values shift. 

  On popular positions: The plaque camp fails if the honour itself is harmful—adding text won’t fix a fundamentally offensive tribute. Removal camp ignores cases where commemoration is purely historical (e.g., a street name from a clerical error). Context camp struggles when symbolic harm outweighs educational value (e.g., a Confederate statue in a town square vs. a museum). 

  The user needs this to feel authentic, not academic. Examples from their town (mill owner’s cottages vs. exploitation) should map onto the framework. The plaque solution might work only if the statue’s presence isn’t actively oppressive—otherwise it’s a plaster on a bullet wound. 

