  Okay, let me start by unpacking the user's problem. They had a three-hour argument with their roommate about the moral equality of combatants. The user takes the revisionist view (McMahan), while the roommate defends the traditional Walzer perspective. The sticking points were the epistemic limitations of soldiers (especially conscripts) and the distinction between culpability and liability.

  First, I need to recall the core arguments. The roommate argues that soldiers can't know if their war is just due to propaganda or conscription, so they shouldn't be held responsible. The user counters that liability doesn't require culpability—unjust combatants lack the right to kill even if they're blameless. The roommate then pushes the user to call a conscripted soldier a murderer, which feels morally uncomfortable.

  The user's hypothesis is that they're answering different questions: one about blame/punishment, the other about permissibility. But they wonder if there's a deeper clash about whether war ethics is sui generis or continuous with self-defense. Also, there's the institutional aspect where the equality convention might be practical even if not morally true.

  I should verify the key concepts. Walzer's traditional view holds combatants equal, judged by conduct, not the war's justice. McMahan's revisionist stance says only just combatants have the right to kill. The culpability vs. liability distinction is crucial here. Liability means you can be permissibly harmed without being blameworthy, like in cases of mistaken self-defense.

  The roommate's epistemic argument is strong because soldiers often lack access to unbiased information. Conscripts, especially under propaganda, might genuinely believe their cause is just. This challenges the revisionist view because if a soldier can't know, how can they be liable? The user's liability argument works in theory, but applying it to real soldiers feels harsh, leading to the "murderer" label, which is a tough bullet to bite.

  The user's hypothesis about different questions makes sense. The roommate focuses on fairness and blame (backward-looking), while the user focuses on permissibility (forward-looking). But is it that simple? Both sides might agree that in an ideal world, only just combatants should fight, but the practical realities of war complicate things. The institutional point adds another layer: even if revisionism is morally correct, the equality convention might be necessary for compliance with laws of war.

  Now, the deeper issue: is war ethics continuous with individual self-defense? Revisionists say yes; traditionalists say war is a different realm with its own rules. This is a fundamental divide. The roommate might see war as a collective action where individual morality doesn't directly apply, while the user applies individual ethics to war.

  The user wants to know if the disagreement is verbal, a clash of intuitions, or something else. It's not just verbal; both terms are used distinctly but applied to the same scenario. It's a clash of intuitions—roommate values the soldiers' epistemic constraints, user prioritizes the moral asymmetry of the war's cause. Also, they prioritize different moral questions: permissibility vs. blame.

  What would count as progress? Finding a test case that separates these issues. Maybe a volunteer soldier in a democratic nation versus a conscript under dictatorship. Or a mercenary with no illusions about the war's justice. Discussing the institutional angle: can we separate deep morality from practical conventions? Admitting discomfort with the "murderer" label might lead to exploring why—maybe the weight of blame versus liability.

  The user also needs to recognize the strength of the epistemic argument. Even if liability doesn't require culpability, the ability to know affects fairness. Acknowledging this might bridge the gap. Maybe a middle ground where conscripts are excused but the act remains impermissible. The revisionist might need to accept that while deep morality denies symmetry, practical ethics requires a convention for functional laws of war.

  In conclusion, the disagreement is multifaceted: different moral focuses, intuitions about fairness, and views on war's uniqueness. Progress involves clarifying these layers, testing intuitions with varied cases, and discussing the role of conventions versus ideal morality.
answer: |-
  I appreciate you laying out this complex and emotionally charged disagreement so clearly—it’s a fascinating collision of ethics, epistemology, and institutional reality. Let me walk through my diagnosis step by step, drawing on what you and your roommate actually said, and then suggest where progress might lie.  

  First, your hypothesis that you’re answering different questions is *partly* right, but it doesn’t capture the full depth of the clash. Your roommate’s insistence on the epistemic limitations of conscripts ("they can’t know if their war is just") speaks to **fairness in moral assessment**—specifically, when we can *blame* someone for acting wrongly. Her "you’d have to call the draftee a murderer" challenge reveals her focus on **desert and social judgment**. She’s operating in a framework where moral responsibility requires both agency and reasonable access to truth. If the draftee couldn’t have known the war was unjust, labeling him a murderer feels grotesquely unfair—a violation of the principle that "ought implies can."  

  Your rebuttal, distinguishing culpability (blameworthiness) from liability (permissibility of being harmed), shifts the question to **the objective moral structure of rights-violations**. You’re asking: "Who has the *right* to kill whom, regardless of inner states?" In ordinary ethics, an innocent aggressor (e.g., someone hallucinating that you’re a wolf) may lack culpability but still lack the right to kill you. Your self-defense analogy is strong here—it shows liability can arise without fault. But when you hesitated to call the draftee a murderer, you sensed the gap between this abstract liability and the visceral moral weight of terms like "murder," which imply culpability. This is where your roommate’s intuition bites: deep down, we resist labeling the blameless as murderers, even if they objectively violate rights.  

  The substantive clash runs deeper than mismatched questions, though. It’s about **whether war is a morally unique practice**. Your roommate implicitly treats war as a domain where collective action, state coercion, and epistemic fog create a distinct moral landscape. Soldiers aren’t just individuals; they’re cogs in a machine they didn’t build and can’t control. For her, the traditional symmetry of combatants isn’t just pragmatic—it’s *fair* under these conditions. You, conversely, see war ethics as continuous with individual self-defense: if the war is unjust, every kill by its combatants is a rights-violation, full stop. The revisionist stance rejects war’s moral exceptionalism.  

  Then there’s the institutional escape hatch—the "convention" argument both sides acknowledge but deploy differently. Your roommate might say: "Even if revisionism is abstractly true, it’s *unlivable* for soldiers who need clear, reciprocal rules." You’d likely reply: "But that’s about practicality, not morality—we shouldn’t confuse the two." This isn’t just muddying the waters; it’s a meta-dispute about **whether morality must be practicable to be valid**. If war’s chaos makes individual moral judgment impossible, does that *change* the ethics, or just our ability to apply it?  

  So, is this a verbal dispute? Only superficially—you both use "moral equality" consistently but disagree on its substance. Is it a bedrock intuition clash? Absolutely. Your roommate prioritizes **the soldier’s subjective experience** (can they know? are they coerced?). You prioritize **the objective justice of the cause** (who is *actually* violating rights?). Neither position is frivolous, and both reveal uncomfortable truths: her view risks excusing participation in atrocities; yours risks condemning the powerless for systemic wrongs.  

  **Where might progress lie?**  
  1.  **Test the liability/culpability distinction with non-war cases.** Discuss a conscripted guard in a concentration camp who shoots escaping prisoners while genuinely believing propaganda about "enemies of the state." Is he liable to defensive killing? Yes, per your view—he’s violating rights. But is he a murderer? That feels wrong, and unpacking *why* might reveal if your hesitation is emotional or philosophical. Does "murder" require culpability? If so, does that undermine revisionism?  
  2.  **Press the institutional point.** Ask your roommate: "If we *could* reliably know which wars were just, would you abandon moral equality?" If yes, her commitment is pragmatic, not moral. If no, she’s defending symmetry as inherently fair.  
  3.  **Confront the "sui generis" question directly.** Is a soldier in war meaningfully different from a civilian defending their home? If your roommate says yes, demand *why*—is it scale, state authority, or something else? This forces clarity on whether war ethics is derivative or autonomous.  
  4.  **Admit the discomfort.** Your reluctance to call the draftee a murderer is a clue. Revisionists like McMahan often concede that unjust combatants may be "excused" (not culpable) but still "unjustified" (their acts are rights-violating). Embracing this distinction—"he’s not a murderer, but his killing is still wrongful"—might bridge your intuitions.  

  This debate won’t resolve cleanly. It pits powerful moral pulls against each other: the demand for individual accountability versus empathy for the trapped. But clarity *is* progress. If you both leave understanding that her "moral equality" is about **non-culpability under duress**, while yours denies **the permissibility of unjust killing**, you’ve mapped the fault lines. That’s not surrender—it’s the groundwork for a wiser argument next time, pizza optional.
