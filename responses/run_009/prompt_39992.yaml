prompt: |-
  My roommate and I got into a three-hour argument last weekend after watching a documentary about conscripts, and it's still bugging me, so I want you to act as a patient expert on just war theory and help me figure out what the disagreement actually is. The topic was the moral equality of combatants -- the old Walzer-style view that soldiers fighting on opposite sides of a war are morally on a par, judged by how they fight rather than by whether their war is just, versus the revisionist line associated with McMahan that soldiers fighting an unjust war have no right to kill the soldiers attacking them, so there's no real symmetry at all. I came in on the revisionist side and my roommate defended the traditionalist one. Here's where it stalled: she kept insisting that soldiers, especially conscripts and kids who grew up under propaganda, mostly cannot find out whether their side's war is just, so it's crazy to hold them responsible as if they could; and I kept replying that culpability and liability are different things -- the unjust aggressor might be blameless and still not be permitted to kill you, the way someone honestly but wrongly attacking me in self-defense doesn't get a license because of their sincerity. Then she said that if I really believed that, I should be willing to call the nineteen-year-old draftee a murderer, and I felt the pull of biting that bullet but didn't want to actually bite it, and around that point we ordered pizza and gave up.

  My working hypothesis is that this debate never resolves because the two sides are answering different questions under one label -- she's asking when it's fair to blame and punish a person, and I'm asking who is permitted to do what to whom, and we each think the other's question is the irrelevant one -- but maybe that's too easy and there's a genuine substantive clash about whether the ethics of killing in war is continuous with the ordinary ethics of self-defense or is its own sui generis practice with its own rules. There's also the thing the revisionists themselves admit, that treating combatants as equal might be the only workable convention for armies and laws of war even if it's false at the level of deep morality, which muddies whether we're debating facts, principles, or institutions.

  So please think through this carefully before writing, maybe brainstorm the possible diagnoses first, then give me your actual diagnosis: is this disagreement verbal, a clash of bedrock intuitions, a fight over which question counts as the moral question, or something else entirely? Use what each side actually says to support it -- the epistemic asymmetry point, the culpability/liability distinction, the institutional-convention escape hatch, whatever else seems load-bearing. And then be honest about what, if anything, would count as progress: a sharper distinction, a test case we'd both have to answer, or an argument that we should expect this one to stall forever. Please write it as continuous prose only, like an email to me, no headings, bullet points, bold text, or tables. Don't try to make me feel better about my side either -- if my culpability/liability move is weaker than I think, say so.
