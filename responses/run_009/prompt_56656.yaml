answer: |-
  Your instincts about Moore are quite sound, and this is precisely the kind of subtle misstep a broadly skeptical physicist, confident in his dismissal of philosophy, might make. While the core image of Moore raising his hands is iconic and accurate, the interpretation your character offers layers several significant misinterpretations onto Moore's actual argument and intent. Here’s a breakdown of where the summary holds, simplifies acceptably, and goes astray:

  The accurate core is indeed the gesture itself. Moore did stand before a lecture audience (the British Academy in 1939) and present his "Proof of an External World" by holding up his hands and saying, "Here is one hand" (gesturing with one), "and here is another" (gesturing with the other). He argued that since (a) hands are "things to be met with in space," (b) their existence entails the existence of things *external to our minds*, and (c) he knew for certain that he had hands (at least at that moment), he had therefore proved the existence of at least two external things. This directly addressed Kant's challenge to provide such a proof, framed in terms of things existing *in space* independently of being perceived.

  The first major simplification, which a defender might let pass as a dramatic flourish for a popular summary but is crucial for accuracy, concerns the *target* and *scope*. Moore was explicitly responding to a specific philosophical problem – Kant's claim that a strict proof of the external world (as Kant defined it) was impossible. He was *not* primarily staging a direct, comprehensive refutation of all forms of skepticism, nor specifically targeting Descartes' dream argument. His goal was far narrower: to demonstrate that a perfectly rigorous *proof* of the existence of external objects *could* be given, using premises he considered far more certain than the premises of any skeptical argument. He did believe this undermined skepticism, but indirectly, by showing that common-sense certainties *are* proof-worthy.

  Here's where your character starts to go subtly off track. Moore absolutely championed common sense and believed propositions like "Here is a hand" (when appropriately situated) were known with *greater* certainty than the highly abstract premises of skeptical arguments (like "I might be dreaming" or "All knowledge is based on sense-data which could be non-veridical"). He argued we are *more* justified in trusting the immediate evidence of our senses in such cases than we are in trusting the complex chains of reasoning leading to skepticism. However, Moore **never claimed common sense is a "stronger criterion of truth" in all contexts or that it simply "trumps" philosophical argument.** His point was epistemological: we *know* these common-sense things, and this knowledge is secure enough to serve as the *foundation* for proof. He wasn't replacing philosophical criteria with common sense; he was asserting that common-sense certainties *meet* the strictest criteria for knowledge and proof *within* a philosophical context. He was a philosopher arguing *for* the validity of common sense knowledge *against* other philosophical theories, not dismissing philosophy altogether.

  The claim that Moore "answered Descartes' dream argument once and for all by the plain fact that we can never be wrong about such things as our having hands" is a significant misattribution and overstatement. Moore **never claimed we "can never be wrong" about having hands.** He was meticulously careful. In "A Defence of Common Sense," he lists common-sense propositions he claims to *know* with certainty to be true, including "that my body has existed continuously on or near the earth" and "that it has, at every moment, been either in contact with or not far from other things having shape and size." He explicitly states he knows these things *despite* not being able to *prove* them against every conceivable skeptical hypothesis (like Descartes' dream). His argument against skepticism was *not* that we are infallible about hands, but that the *evidence* for "Here is a hand" is so overwhelming in normal circumstances that it is utterly unreasonable to doubt it *based solely on the abstract possibility* of dreaming or deception. The certainty is contextual and defeasible in principle, but practically indubitable. He didn't *answer* the dream argument by denying its logical possibility; he argued that its mere logical possibility provides *insufficient grounds* to doubt the massive evidence for the hand's existence in front of him. The skeptic's premises, he thought, were *less* certain than the hand.

  Finally, your character's punchline – "we can never be wrong about such things" – is precisely the kind of boast Moore avoided. Moore argued we *know* these things, not that we are infallible. He readily admitted that under *other* circumstances (e.g., poor lighting, phantom limb syndrome, complex deception) we *could* be wrong about a specific hand. His point was that *in the clear and present case he described*, he knew. His strict standard for "proof" was met by the logical implication: *If* I know here is a hand, *then* I know an external object exists. He conceded that such a proof might not *convince* a determined skeptic, as they would likely deny the premise ("You don't *really* know you have a hand"), but he insisted that this denial was unreasonable because the premise was more certain than the skeptic's reasoning.

  So, for your physicist to sound authoritatively wrong: Let him accurately describe the raised hands gesture. Let him simplistically (but passably) say Moore was refuting skeptics and championing common sense. But have him overreach by claiming Moore "answered Descartes once and for all," established common sense as the "strongest criterion of truth" (implying it replaces philosophy), and, crucially, have him declare that Moore proved we "can never be wrong" about having hands. This last point twists Moore's careful claim of certain knowledge under specific conditions into a dogma of infallibility that Moore explicitly rejected, revealing the physicist's own overconfidence and perhaps his misunderstanding of both skepticism and Moore's nuanced defense. The knowledgeable reader will recognize the physicist has turned Moore's meticulous philosophical argument into a blunter, more boastful instrument than Moore ever intended.
