  ## Private Sign

  He shuts the door. The afternoon rain beads.
  One nerve flares deep, a signal sharp and clean.
  He dips the pen. The ink makes one dark seed:
  **S**.

  The notebook lies, a promise held between
  the ribs and thought. That tremor comes again –
  a ghost of heat? A pressure, swift and keen?
  He traces it. The ink accepts the stain:
  **S**.

  Week’s end. He scans the columned marks. They prove
  the thing endures. He *knows* this pulse, this ache –
  though memory blurs the edges, like a groove
  worn by the same foot daily. Still, he’ll make
  the sign: **S**.

  The candle gutters. Was *that* it? The skin
  recalls… or does it merely echo back
  the *thought* of the sensation held within
  the sign itself? A faintness on the track.
  He writes: **S**.

  The ritual remains: the book, the chair,
  the waiting stance. But what now guides the hand?
  Not the bright pang (was that ever really *there*?),
  But the blank space demanding its command,
  The pen’s dry scratch… the forming of the **S**.

  ---

  **Notes on Craft:**

  *   **"S" in Every Stanza:** Integrated as the concluding word, visually anchoring each unit and mirroring the diarist's act. Its isolation grows more pronounced.
  *   **Argumentative Arc:** Early confidence ("signal sharp," "knows this pulse") shifts to reliance on memory ("memory blurs"), then to questioning ("Was *that* it?", "recalls… or merely echo?"), culminating in the hollow ritual ("blank space demanding," "forming of the S").
  *   **Unresolved Ending:** The final stanza focuses solely on the *act* – the book, the chair, the scratch of the pen. The "bright pang" is questioned ("was that ever really *there*?") and replaced by the demand of the blank space and the mechanical act of forming "S." Is it still a record? Or just a deep groove, a meaningless habit? The poem offers no verdict.
  *   **Philosophy vs. Poem:** The trajectory enacts the "seeming-right/being-right" collapse without naming it. Non-philosophers experience a lonely figure trapped in a ritual whose meaning dissolves.
  *   **Avoiding Cliché:** The "S" doesn't fade; it persists. The emptiness is in the *act* and the *questioning*, not the mark itself. Focus shifts to the external props (chair, book, pen scratch) and the internal void.
  *   **Pressure Point:** The last line forces the reader to confront the bare act of writing "S" – stripped of claimed reference, yet still performed. Is it collapse (meaningless) or impoverishment (meaning reduced to the ritual itself)? The poem holds the tension.
