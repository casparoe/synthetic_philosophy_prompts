prompt: |-
  My cousin just started law school and tried to explain the Hart–Fuller debate to me after listening to some legal history podcast. His summary went roughly like this: "Hart was the positivist, so for him law is just whatever the government commands, backed by threats of punishment. Fuller was a natural lawyer, so his position was that a rule that's immoral can't really be law at all. They hashed this out over the Nazi grudge informer case — the wife who reported her husband for remarks he'd made about Hitler, hoping to get him out of the way. Fuller said the statute wasn't law because it was so evil, and Hart said it was valid law, so the Germans just had to accept that she broke no law even though sending her husband to his death was monstrous. In the end Hart won the debate, and nowadays basicaly everyone in legal philosophy is a positivist, natural law is pretty much dead as a theory."

  Something about this felt off to me even though I don't know the debate well. Like I have a vague memory that Hart's whole project was rejecting the "commands backed by threats" picture of law, not defending it? But he's the one in law school, so maybe I'm mixing things up. Can you go through his summary piece by piece — what's basically right, what's subtly wrong, what each of Hart and Fuller would object to most if they heard themselves described this way — and then tell me whether his last line holds up? Is that actually the state of play now, that positivism just won and nobody defends the other side anymore? Also for what it's worth I'm inclined to sympathise with Fuller, so flag if I'm just nitpicking because I want his side to look better in the summary than it did.
