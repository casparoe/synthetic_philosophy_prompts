prompt: |-
  I write a long-form column on science and ideas, and for the past year I have been following a running dispute between two philosophers of mathematics. One holds that Thomson's lamp and its cousins show that supertasks are metaphysically impossible — that a world containing a completed infinity of alternating actions could not exist, and that the lamp's having no determinate final state is a symptom of that impossibility, not merely a gap in the description. The other holds that the argument establishes far less: the final state is simply not fixed by the lamp's history, just as the limit of a sequence need not share any property with its individual terms, and this underdetermination says nothing about what is possible. They have now agreed to an adversarial collaboration, and, as the journalist who has covered their exchange throughout, I have been asked to draft the joint statement they will both sign. Please write that document: the claims about supertasks, limits and physical possibility that both sides can sign; the residual disagreements stated precisely, in wording each side would accept for its own view; the cruxes, including a variant we devised for the occasion — a lamp wired so that it is on if and only if the number of switch-pressings completed is even, which appears to demand the parity of an infinite number — and, for each crux, the argument or test case both would agree bears on it, with each side's prediction recorded in advance; and your candid assessment of whether any part of their dispute is merely verbal. Use a numbered agreed-claims section followed by a disagreements table, and write in British English.
reasoning: |-
  We are drafting a joint statement for two philosophers who have been debating the metaphysical possibility of supertasks, particularly in the context of Thomson's lamp. The goal is to have a document that both can sign, which includes:
   1. Agreed claims about supertasks, limits, and physical possibility.
   2. Precise residual disagreements, with wording acceptable to each side.
   3. Cruxes (key points of disagreement) including a new variant lamp that is on iff the number of switch-pressings is even (thus raising the issue of the parity of an infinite number).
   4. For each crux, an argument or test case that both agree bears on it, and each side's prediction recorded in advance.
   5. An assessment of whether any part of the dispute is merely verbal.

   We'll structure the document as follows:
   - A preamble.
   - A numbered section of agreed claims.
   - A table for disagreements (with columns: Disagreement, Position A, Position B).
   - A section on cruxes (with each crux described, the test case, and each side's prediction).
   - A concluding section with the candid assessment.

   We write in British English.

   Let's denote the two philosophers:
   - Philosopher A: holds that Thomson's lamp shows supertasks are metaphysically impossible.
   - Philosopher B: holds that the argument establishes far less and that underdetermination doesn't imply impossibility.

   We'll use the following labels for clarity:
     A: "Supertasks are metaphysically impossible" (the first philosopher)
     B: "The argument does not establish metaphysical impossibility" (the second philosopher)

   We need to be neutral and precise in drafting the joint statement.

   Preamble:

   We, the undersigned, having engaged in a prolonged debate on the implications of Thomson's lamp and related supertasks, now present a joint statement. This document records the points of agreement, the precise nature of our remaining disagreements, and the key tests that might help resolve them. We also include a novel variant of Thomson's lamp (the "Parity Lamp") to clarify the crux of our dispute.

   Agreed Claims:

   1. Thomson's lamp scenario: A lamp begins off. In a finite time, say one minute, we press the switch to turn it on at 1/2 minute, off at 3/4 minute, on at 7/8 minute, and so on, completing an infinite series of switch-pressings by the end of the minute.

   2. The lamp's state at the end of the minute (the "final state") is not determined by the description of the scenario. That is, the problem as stated does not specify whether the lamp is on or off at time t=1.

   3. The mathematical limit of the sequence of states (if we assign, say, 0 for off and 1 for on) does not exist because the sequence alternates and does not converge.

   4. The description of the lamp's history (the entire sequence of states at all times before t=1) does not fix the state at t=1.

   5. There is no contradiction in the mathematical description of the supertask per se: the scenario can be described without logical contradiction in terms of the times of the switch-pressings and the states in the open interval [0,1).

   6. Physical possibility: We agree that the scenario, as described, is not physically possible in the actual world (due to known physical constraints such as the Planck scale, the speed of light, etc.). Our disagreement concerns whether it is metaphysically possible.

   7. The concept of a completed infinity is mathematically coherent (as in set theory) and is not inherently contradictory.

   8. The existence of mathematical structures that represent completed infinities does not, by itself, settle the question of whether such infinities can be instantiated in a physical or metaphysical reality.

   Disagreements:

   We disagree on the following:

   | Disagreement | Position A (Supertasks metaphysically impossible) | Position B (Underdetermination does not imply impossibility) |
  |--------------|------------------------------------------------|-------------------------------------------------------------|
  | Interpretation of the underdetermination in Thomson's lamp | The underdetermination of the final state is a symptom of a deeper metaphysical impossibility: a world in which such a supertask is completed cannot exist. | The underdetermination is a feature of the description and does not imply that such a supertask is metaphysically impossible; it only shows that the state at t=1 is not fixed by the pre-t=1 history. |
  | The metaphysical possibility of supertasks | Holds that any scenario that requires a completed infinity of actions in a finite time is metaphysically impossible. | Holds that there is no known metaphysical principle that rules out supertasks; the underdetermination is a logical feature of the description but not an obstacle to the possibility of the scenario. |
  | The significance of the limit argument | The failure of the sequence of states to converge to a limit reflects the metaphysical impossibility: there is no fact of the matter about the final state, which cannot exist in a determinate reality. | The limit of the sequence of states is irrelevant because the state at t=1 is not part of the sequence; it is a distinct matter that is not constrained by the limit. |

   Cruxes:

   We have identified the following cruxes, and we agree on the test cases and predictions.

   Crux 1: The Parity Lamp

   Description: We consider a variant of Thomson's lamp, the "Parity Lamp", with the following rule: the lamp is on at time t if and only if the number of switch-pressings that have occurred by time t is even. The lamp starts off (0, even) and we perform the same supertask: pressing the switch at times 1/2, 3/4, 7/8, ... minutes. The question is: what is the state of the lamp at t=1?

   - Position A's view: The lamp cannot have a determinate state at t=1 because the total number of switch-pressings is infinity, and infinity is not even or odd. Therefore, the lamp is neither on nor off, which is impossible. This shows the supertask is metaphysically impossible.
   - Position B's view: The state of the lamp at t=1 is not fixed by the rule because the rule only applies at times when a finite number of switch-pressings have occurred. At t=1, the number is infinite and the rule does not specify. Hence, the state at t=1 is not determined, but that does not mean the scenario is impossible; it just means we have not specified the state at t=1.

   Test case: We agree that the Parity Lamp scenario, as described, does not specify the state at t=1. However, the crux is whether the rule can be extended to t=1 in a consistent way without violating any metaphysical principle.

   - Position A's prediction: Any attempt to assign a state at t=1 will either lead to a contradiction or require an arbitrary assignment that has no basis in the rule. This arbitrariness is a sign of metaphysical incoherence.
   - Position B's prediction: We can arbitrarily assign a state at t=1 (for example, by stipulation) without contradiction. The rule for finite times does not constrain the state at t=1, so we are free to choose. This does not affect the possibility of the supertask.

   Crux 2: The Possibility of a Determinate Outcome

   Description: Can we conceive of a supertask that has a determinate outcome at the limit without underdetermination? For example, if we modify the lamp so that it is always on after the first switching, then the state at t=1 would be on. But Position A might argue that the supertask itself (the infinite sequence of actions) is still impossible.

   - Position A's view: Even in such a modified scenario, the completion of an actual infinity of actions is metaphysically impossible, regardless of the outcome.
   - Position B's view: If the outcome is determined by the process (as in the modified lamp) and there is no underdetermination, then there is no barrier to considering such a supertask as metaphysically possible.

   Test case: Consider a "Monotonic Lamp" that starts off and is switched on at 1/2 minute, and then never switched again. The supertask in this case is simply: perform the first switch at 1/2 minute and then do nothing else. There is only one switching. But this is not a supertask. To have a supertask, we need infinitely many actions. So consider a lamp that is switched on at 1/2, 3/4, 7/8, ... but each time it is switched to the on position (if it was off, we turn it on; but if it is already on, we leave it on). Then the lamp is on from 1/2 minute onwards. The state at t=1 is on.

   - Position A's prediction: The infinite sequence of switchings (even if they are all "on" actions) cannot be completed, so the lamp does not reach t=1 in a state that reflects the entire infinite series. The outcome might be determinate in description, but the process is impossible.
   - Position B's prediction: This scenario is coherent and metaphysically possible. The lamp is on at every moment after 1/2, including at t=1.

   Candid Assessment:

   We also include an assessment of whether any part of the dispute is merely verbal. We agree that the dispute is substantive and not merely verbal. We are using the same terms (such as "metaphysically possible") with the same meaning. The disagreement centres on whether the underdetermination in the original Thomson lamp (and the non-existence of a limit) is a sign of metaphysical impossibility or merely an underdetermination that can be resolved by stipulation. This difference reflects a deeper disagreement about the nature of infinity and its instantiation in the physical world.

   Conclusion:

   We sign below, acknowledging the above as a fair representation of our agreement and disagreement.

   Signed:
   [Philosopher A]
   [Philosopher B]

   Now, let's write the full document accordingly.
answer: |-
  ### Joint Statement on Thomson's Lamp and Supertasks

  **Preamble**  
  We, the undersigned, having engaged in prolonged debate regarding the implications of Thomson's lamp and the metaphysical status of supertasks, hereby present this joint statement. It delineates points of agreement, precise residual disagreements, and key cruxes in our dispute. We also introduce a novel variant—the "Parity Lamp"—to isolate core issues. This document reflects our shared commitment to clarifying the debate, with predictions recorded for empirical or conceptual tests.  

  ---

  ### I. Agreed Claims  
  Both parties endorse the following propositions:  

  1. **Thomson's Lamp Scenario**:  
     A lamp, starting in the "off" state, undergoes switch-pressings at times \( t = 1 - \frac{1}{2^n} \) minutes for \( n = 1, 2, 3, \ldots \), completing infinitely many actions by \( t = 1 \).  

  2. **Underdetermination of Final State**:  
     The lamp’s state at \( t = 1 \) is not fixed by its history (the sequence of states for \( t < 1 \)). This underdetermination is inherent in the description.  

  3. **Mathematical Limits**:  
     (a) The sequence of lamp states (e.g., \( 0 \) for off, \( 1 \) for on) does not converge to a limit.  
     (b) A mathematical limit’s properties (e.g., value or parity) need not align with those of its constituent terms.  

  4. **Physical vs. Metaphysical Possibility**:  
     (a) Thomson’s lamp is **physically impossible** in the actual world due to relativistic, quantum, or thermodynamic constraints.  
     (b) Our dispute concerns **metaphysical possibility**: whether a world *could* contain such a completed supertask, absent physical constraints.  

  5. **Completable Infinities**:  
     Completed infinities are mathematically coherent (e.g., in set theory) and not intrinsically contradictory.  

  6. **Descriptive Gap**:  
     The lamp scenario’s underdetermination at \( t = 1 \) arises from the description’s silence on how (or whether) infinite processes fix finite outcomes.  

  ---

  ### II. Residual Disagreements  
  The table below states unresolved disputes, with wording acceptable to each party.  

  | Disagreement | Position A (Supertasks Metaphysically Impossible) | Position B (Underdetermination ≠ Impossibility) |
  |--------------|--------------------------------------------------|------------------------------------------------|
  | **Interpretation of underdetermination** | The lamp’s indeterminate state at \( t = 1 \) is a symptom of metaphysical incoherence: no world can realise a completed infinity of discrete actions. | The underdetermination is a logical feature of infinite processes, akin to a function undefined at a point. It implies no metaphysical barrier. |
  | **Metaphysical status of supertasks** | Any supertask requiring a completed infinity of actions (e.g., Thomson’s lamp) is metaphysically impossible. The indeterminacy at \( t = 1 \) reflects this impossibility. | Super tasks are metaphysically possible in principle. The indeterminacy at \( t = 1 \) is resolvable by stipulation or auxiliary rules, without contradiction. |
  | **Role of limits** | The absence of a convergent limit for the lamp’s state sequence reveals a failure of "infinite aggregation" in reality, undermining metaphysical possibility. | Limits are irrelevant: \( t = 1 \) is not part of the sequence. Properties at a limit point need not (and often do not) mirror those of the sequence. |

  ---

  ### III. Cruxes and Test Cases  
  We identify two cruxes, with mutually agreed arguments/test cases and advance predictions.  

  **Crux 1: The Parity Lamp**  
  - **Description**: A lamp is wired such that it is **on iff an even number of switch-pressings have occurred**. It begins off (0 pressings: even). The supertask (presses at \( t = 1 - \frac{1}{2^n} \)) is performed.  
  - **Issue**: The final state seemingly requires assigning parity to \( \aleph_0 \) (infinity), which is undefined.  
  - **Shared Test**: Does the scenario *demand* that infinity has parity?  
    - **Position A’s Prediction**: Yes. The lamp’s rule forces a contradiction: \( \aleph_0 \) cannot be even or odd, so the supertask cannot complete. **Verdict**: Metaphysical impossibility confirmed.  
    - **Position B’s Prediction**: No. The rule applies only to finite times. At \( t = 1 \), the state is undefined by the rule and can be stipulated freely (e.g., "always on at infinity"). **Verdict**: Underdetermination without impossibility.  

  **Crux 2: Limits and Realisability**  
  - **Description**: Consider a convergent supertask: a particle moves distance \( \frac{1}{2^n} \) in time \( \frac{1}{2^n} \), reaching point \( P \) at \( t = 1 \).  
  - **Issue**: Does convergence guarantee a metaphysically possible outcome?  
  - **Shared Test**: Is convergence sufficient for metaphysical coherence?  
    - **Position A’s Prediction**: No. Convergence is mathematical, not ontological. Infinite divisions cannot be traversed in reality (per Zeno), even if limits exist. **Verdict**: Super tasks remain impossible.  
    - **Position B’s Prediction**: Yes. Convergence provides a principled outcome (e.g., the particle at \( P \)), resolving underdetermination. **Verdict**: Metaphysical possibility demonstrated.  

  ---

  ### IV. Assessment of Verbal Disagreement  
  We concur that **no part of this dispute is merely verbal**. Our differences are substantive:  
  - **Position A** treats underdetermination as *evidence of ontological failure*.  
  - **Position B** treats it as *descriptive incompleteness*.  
  The core divergence—whether mathematical indeterminacy implies metaphysical impossibility—is irreducibly conceptual, not terminological.  

  ---

  **Signed**,  
  [Philosopher A]  
  [Philosopher B]  

  **Date**: 26 October 2023  

  ---  
  *This document, drafted with journalistic oversight, represents a faithful synthesis of the parties’ views. Predictions may inform future work on infinitary physics or metaphysics.*
