prompt: |-
  Something I keep noticing and can't find a word for: certain cultural items spread not because anyone wants to copy them, but because the item itself contains instructions for its own reproduction, plus a threat or reward for compliance. Chain letters are the cleanest case -- the whole message is "send this to ten people or bad luck follows," and plenty of people who dont believe a word of it forward it anyway, just incase. Those "forward this and Bill Gates will pay you" email hoaxes, pyramid recruiting pitches, and versions of religion where salvation partly depends on winning converts all work the same way. The item isn't attractive; it issues commands to its carriers. It's different from a catchy song that people pass on because they like it, and it's not ordinary advertising either, since an ad doesn't demand that the ad itself be reproduced word for word along with the recommendation. Is there an established term for this mechanism -- spread by embedded command rather than spread by appeal -- in the study of cultural evolution or anywhere else? If there is, I want to know how exactly it differs from just calling everything a meme, since plain imitation doesn't seem to capture the carrot-and-stick part. And if there isn't a name, coin one: give a real definition, say where it stops being this and starts being ordinary persuasion or a practice people adopt for their own reasons, and give a couple of boundary cases.
reasoning: |-
  Okay, the user is describing a fascinating phenomenon where cultural items spread not because people find them appealing, but because they contain built-in instructions for reproduction along with threats or rewards. They mention examples like chain letters, pyramid schemes, and certain religious practices. 

  Hmm, they're clearly well-versed in cultural concepts and frustrated by the lack of a precise term. The distinction they're drawing is crucial—it's not about organic spread through enjoyment (like catchy songs) or standard advertising, but about compliance with embedded commands. 

  I recall that in memetics, this aligns with what's called a "doctrine meme" or "self-replicating instruction," but those terms aren't widely adopted. The closest academic concept might be "parasitic memes" in Susan Blackmore's work, where memes exploit human psychology to spread regardless of value. 

  The user also wants boundaries: where does this mechanism end and ordinary persuasion begin? For instance, a religious text saying "spread this word" is directive, while converting others because you genuinely believe it's helpful is different. Pyramid schemes explicitly demand recruitment, whereas legitimate MLMs might rely on product appeal. 

  They're hinting at a gap in terminology. Since existing terms are scattered, I should synthesize a new one. "Directive replication"? Too vague. "Compliance-driven transmission"? Clunky. How about "Imperative Meme" or "Self-Executing Cultural Directive"? The latter captures the autonomous command aspect. 

  Boundary cases: 
  - A petition demanding signatures is directive but lacks threats/rewards—so it's adjacent but not the same. 
  - "Tell your friends!" on a viral video is a weak command without enforcement, unlike chain letters' "or else." 

  The user would likely appreciate clear differentiators: presence of explicit reproduction instructions + promised sanctions/rewards + spread via obligation rather than merit. Nailing this helps separate it from persuasion (which convinces) or trends (which attract).
answer: |-
  That's a brilliant observation of a distinct and powerful cultural transmission mechanism! You're absolutely right that it doesn't fit neatly under standard "meme" theory or typical models of persuasion. While there isn't a single universally accepted term, here's a breakdown of relevant concepts and a proposed definition:

  **Established Concepts & Why They Fall Short:**

  1.  **Meme (Dawkins):** The broadest container. It *could* include this, but "meme" doesn't inherently specify the *mechanism* of transmission (imitation vs. instruction + threat/reward). Your examples highlight a specific *sub-type* of meme characterized by its coercive replication strategy.
  2.  **Self-Replicating Message/Instruction:** Descriptive, but too broad. Many instructions replicate without threats/rewards (e.g., "Boil water before drinking" spreads because it's useful).
  3.  **Viral Content:** Focuses on rapid spread, not the *mechanism* causing it. Catchy songs go viral via appeal, chain letters via coercion.
  4.  **Parasitic Meme (Susan Blackmore):** Comes closest conceptually. Blackmore discusses memes that spread *not* because they benefit the host, but because they exploit psychological vulnerabilities or mechanisms (like superstition, fear, greed, or obedience) purely for their own replication. Your examples fit perfectly here. However, "parasitic meme" isn't a widely used *specific* term for this *exact* structure.
  5.  **Doctrine Meme/Instructional Meme:** Used in some memetics circles to denote memes that contain explicit instructions for behavior (including replication). Still, it doesn't inherently capture the threat/reward element.
  6.  **Pyramid Scheme/Ponzi Scheme:** Specific examples of the *structure*, but not the general *mechanism* applied to cultural items like chain letters or religious directives.

  **Proposed Term: Imperative Meme (or Self-Executing Cultural Directive)**

  *   **Definition:** An Imperative Meme is a unit of cultural information whose core structure includes:
      1.  **Explicit Directive:** A clear instruction demanding its own replication or propagation to new hosts (e.g., "Copy this," "Forward to 10 friends," "Win converts").
      2.  **Embedded Sanction:** A threat (punishment, bad luck, damnation, exclusion) or promise of reward (fortune, salvation, divine favor, material gain) contingent upon compliance with the directive.
      3.  **Self-Referential Enforcement:** The sanction or reward is intrinsically linked to the meme's *own* content or purported authority, not an external reality or inherent value. Compliance is the *primary* goal triggered by the meme itself.

  **How it Differs from "Just a Meme":**

  *   **Mechanism:** Spreads primarily through **coerced compliance** with an explicit instruction backed by threat/reward, not through **imitation** (copying a dance move) or **appeal** (sharing a funny video).
  *   **Host Motivation:** The host replicates it not because they find it valuable, enjoyable, or true *in itself*, but to avoid the threatened consequence or gain the promised reward *as defined by the meme*. Belief is often secondary or absent.
  *   **Structure:** Requires the explicit directive-sanction pairing as a core, replicable element.

  **Boundaries: Where Does "Imperative Meme" End?**

  1.  **Ordinary Persuasion/Advertising:**
      *   **Imperative Meme:** "Forward this exact email to 10 people or Bill Gates won't send you $1000!" (Demands replication *of itself* with threat/reward).
      *   **Persuasion/Advertising:** "This product is amazing! Tell your friends about [Product Name]!" (Encourages spreading information *about* something else based on appeal; no threat, no demand to replicate the *ad itself* verbatim).
  2.  **Adoption for Intrinsic Reasons:**
      *   **Imperative Meme:** Converting others because the doctrine *commands* it under threat of damnation, even if you find proselytizing uncomfortable.
      *   **Intrinsic Adoption:** Converting others because you genuinely believe it will improve *their* lives and you feel joy sharing it. The motivation comes from the host's values, not the meme's embedded threat.
  3.  **Useful Instructions:**
      *   **Imperative Meme:** "Share this safety procedure or bad luck will befall you!" (Unnecessary threat added to useful info).
      *   **Useful Instruction:** "Share this safety procedure; it saves lives." (Spreads due to inherent value/altruism, no embedded threat/reward for *sharing*).
  4.  **Social Norms/Peer Pressure:**
      *   **Imperative Meme:** The threat/reward is *internal* to the meme's content (e.g., the chain letter *says* you get bad luck).
      *   **Social Norm:** The sanction comes from *external* social consequences (e.g., not forwarding a funny meme might make you seem out of touch, but the meme itself doesn't *command* forwarding with a threat).

  **Boundary Cases:**

  1.  **Religious Tithing:**
      *   **Imperative Meme Aspect:** Doctrine states "Give 10% of your income to the church *or face divine disfavor*." (Directive + Embedded Sanction).
      *   **Non-Imperative Aspect:** Someone might tithe out of genuine gratitude, community spirit, or belief in the church's work, ignoring the threat. If the *primary* driver for replication (giving) is the embedded threat/reward in the doctrine, it fits. If driven by other values, it doesn't.
  2.  **Viral Challenges (e.g., Ice Bucket Challenge):**
      *   **Imperative Meme Aspect:** "Do this, film it, tag 3 friends *or donate to charity*." (Directive + Sanction (social pressure/donation) for replication).
      *   **Non-Imperative Aspect:** Many participated for fun, charity, or social bonding, not primarily due to avoiding the "or else" (donating). The sanction is weak (donating is still positive) and often secondary. This sits on the boundary, leaning more towards viral appeal/social pressure than pure imperative replication.
  3.  **Petitions:**
      *   **Not Imperative Meme:** "Sign this petition to save the park." (No directive to *replicate* the petition itself verbatim, no sanction for not sharing it further). It spreads based on cause appeal.
      *   **Imperative Meme Adjacent:** "Sign this petition and email it to 10 friends or the park *will* be destroyed!" (Adds an unfounded threat contingent on replication).

  **Conclusion:**

  Your insight identifies a powerful and specific cultural replicator: the **Imperative Meme** or **Self-Executing Cultural Directive**. It spreads not by being good, true, or useful, but by embedding within itself the command "Copy me!" enforced by the carrot of promised reward or, more commonly, the stick of threatened punishment. It exploits psychological triggers like fear, greed, superstition, and obedience to authority. While related to "parasitic memes" or "doctrine memes," this term specifically highlights the core structure of **Directive + Embedded Sanction** as the engine of its replication, distinct from imitation, persuasion, or adoption based on intrinsic value. It's the difference between a virus tricking a cell into copying it and a beneficial gene being naturally selected.
