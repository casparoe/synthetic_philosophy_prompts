  - The question: at the end of the process, will the runner have reached the opposite wall? 
  - We set the time intervals: step 1: 5 seconds, step 2: 2.5 seconds, step 3: 1.25 seconds, ... (each step half the time of the previous). We use the stopwatch to time these intervals and a buzzer (phone alarm) to mark the end of each interval. 
  - The process stops after 10 steps. The students bet (with tokens) on whether the runner has reached the wall.

  Game 2: Thomson's Lamp Style (without naming it)
  - We use a lamp (a real lamp or a light switch) that can be toggled on and off. We start at time t=0 with the lamp on. 
  - We set decreasing time intervals: first interval 30 seconds, then 15, then 7.5, ... (each half the previous). We do 10 toggles. 
  - The process: at the end of each interval, the lamp is toggled (by a student volunteer). 
  - The question: after 10 toggles, is the lamp on or off?
