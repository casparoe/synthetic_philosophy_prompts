  - At the start of the session, each student gets 20 tokens (worthless, just for the game). 
  - Before each game, they can bet on the outcome. For the convergent game, they bet on "reached the wall" or "not reached". For the lamp, they bet on "on" or "off". 
  - Payout: if they bet correctly, they get back their wager plus a matching amount from the "house" (which is infinite, so no problem). If they bet wrong, they lose their wager. 
  - We set a maximum bet (say, 5 tokens) to avoid all-in bets and to keep it light.

