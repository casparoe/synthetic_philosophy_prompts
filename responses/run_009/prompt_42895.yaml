answer: |-
  ### Session Design: Infinite Processes Exploration

  **Core Structure:** Two back-to-back games contrasting a convergent Zeno-style process with an underdetermined Thomson’s lamp-style process. Use a **prediction token system** (no real money) to force explicit student commitments about outcomes. Total time: 50 minutes.

  ---

  ### **Materials & Setup**
  - **Tokens:** 20 poker chips (or cardboard tokens) per student.  
  - **Lamp Prop:** A desk lamp with a visible on/off switch (or a flashlight).  
  - **Movement Prop:** A small object (e.g., a book) to represent the "runner."  
  - **Room:** Chairs arranged in a U-shape facing the front. Whiteboard visible to all.  
  - **Stopwatch:** For timing intervals.  

  ---

  ### **Timeline (Minute by Minute)**  

  #### **0:00–0:05: Introduction & Rules (5 min)**  
  - **Action:**  
    - Distribute 20 tokens per student.  
    - Explain the token system: *"You’ll bet tokens on outcomes. Correct bets double your wager (e.g., bet 5 tokens → win 10 total). Wrong bets lose tokens."*  
    - Emphasize: *"No talking during the games. Save reactions for after."*  
  - **Why:** Quick immersion without lecturing. Tokens incentivize careful reasoning.  

  ---

  #### **0:05–0:15: Game 1 — Convergent Process (Zeno-Style "Race") (10 min)**  
  - **Rules:**  
    - Place the "runner" (object) at the start line (0 meters). The finish line is 10 meters away (mark with tape).  
    - **Process:** Move the runner in decreasing increments:  
      - Step 1: Move 5 meters forward (total: 5m).  
      - Step 2: Move 2.5 meters (total: 7.5m).  
      - Step 3: Move 1.25 meters (total: 8.75m).  
      - Continue for **7 steps** (human limits), halving distance each time.  
      - Time intervals: Start at 20 sec/step, halving each time (20s → 10s → 5s → 2.5s → 1.25s → 0.625s → 0.3125s). Use the stopwatch.  
    - **Betting:** Students bet tokens on whether the runner **touches the finish line** (yes/no) after 7 steps. Max bet: 5 tokens.  
  - **Execution:**  
    - 0:05–0:07: Betting (collect slips).  
    - 0:07–0:12: Run the process (physically move the object).  
    - 0:12–0:15: Reveal outcome (runner ends at ≈9.96m — **no touch**). Payout tokens.  
  - **Why:**  
    - Fixed outcome (total distance = 10 × (1 - 1/128) ≈ 9.96m). Students see convergence in action.  
    - Short steps and halved intervals mimic infinite divisibility.  

  ---

  #### **0:15–0:25: Game 2 — Underdetermined Process ("Mystery Lamp") (10 min)**  
  - **Rules:**  
    - Start with the lamp **on**.  
    - **Process:** Toggle the lamp at decreasing intervals:  
      - Interval 1: 15 seconds → toggle.  
      - Interval 2: 7.5 seconds → toggle.  
      - Interval 3: 3.75 seconds → toggle.  
      - Continue for **7 toggles** (halving intervals each time).  
    - **Betting:** Students bet tokens on the **final state** (on/off) after the 7th toggle. Max bet: 5 tokens.  
  - **Execution:**  
    - 0:15–0:17: Betting (collect slips).  
    - 0:17–0:23: Run the process (audible toggles with stopwatch).  
    - 0:23–0:25: Reveal outcome (after 7 toggles: **off**). Payout tokens.  
  - **Why:**  
    - Outcome is **finite but arbitrary** (depends on step count; 7 is odd → off). Contrasts with Game 1’s inevitability.  
    - Halved intervals create "accelerating" feel without naming supertasks.  

  ---

  #### **0:25–0:45: Debrief (20 min)**  
  **Goal:** Elicit student observations → formalize the contrast → name Thomson’s lamp → probe indeterminacy.  

  1. **Elicit Observations (5 min):**  
     - *"What felt different between Game 1 and Game 2?"*  
     - Target responses:  
       - Game 1: Outcome was predictable/destined.  
       - Game 2: Outcome felt random or depended on step count.  

  2. **Map to Formal Concepts (5 min):**  
     - **Game 1 (Convergent):**  
       - Whiteboard: Draw the series: \(5 + 2.5 + 1.25 + \cdots = 10\).  
       - *"Why couldn’t the runner avoid the finish line? The total distance is fixed — it converges to 10."*  
     - **Game 2 (Underdetermined):**  
       - Whiteboard: List lamp states: Step 0 (on), 1 (off), 2 (on), ...  
       - *"After infinitely many toggles, does the lamp ‘converge’? No — it oscillates forever with no limit."*  

  3. **Name the Puzzle (5 min):**  
     - *"Game 2 is a version of Thomson’s lamp. In the ‘infinite’ case, the final state is underdetermined — no fact of the matter."*  
     - Contrast: *"Zeno’s runner converges; Thomson’s lamp doesn’t."*  

  4. **Probe Indeterminacy (5 min):**  
     - *"Suppose we could complete infinitely many toggles. Could we stipulate a final state? What would that require?"*  
     - Target tension: Stipulation feels arbitrary vs. process lacking a natural limit.  

  ---

  #### **0:45–0:50: Wrap-up (5 min)**  
  - **Honest Limitations:**  
    - *"We only did 7 steps — not infinity. The ‘indeterminacy’ of Thomson’s lamp is a thought experiment; we can’t physically complete it. We extrapolate from the pattern."*  
  - **Final Question:**  
    - *"For next week: If you could ‘program’ the lamp’s infinite end state, what rule would you impose? Would it feel satisfying?"*  

  ---

  ### **Predictable Problems & Solutions**  
  1. **"The lamp burns out!"**  
     - **Handle:** Preempt by using a robust LED lamp; shrug during gameplay. In debrief: *"We assume an ideal lamp — the puzzle is logical, not physical."*  

  2. **Meta-Betting on Step Counts**  
     - **Handle:** If students bet based on step parity (e.g., "7 is odd → off"), celebrate in debrief: *"You used step-counting! But infinity isn’t odd or even — that’s the heart of the puzzle."*  

  3. **Human Error in Toggling/Timing**  
     - **Handle:** Assign one student as "toggler" (not you). If mistakes happen, note: *"Real processes are messy — but math abstracts away noise."*  

  4. **"Why Not Infinite Steps?"**  
     - **Handle:** In wrap-up: *"Our physical world is finite. Infinity is a tool for reasoning about limits."*  

  ---

  ### **Why This Design Works**  
  - **Tokens > Voting:** Forces personal commitment (students "own" their predictions). Doubling payouts make stakes tangible without money.  
  - **7 Steps, Not 12:** Fewer steps prevent fatigue while preserving the pattern. 7 is odd/even ambiguous enough to unsettle.  
  - **Debrief Structure:** Students articulate the contrast first; you formalize. Thomson’s lamp emerges organically.  
  - **Overruled Suggestions:**  
    - Scrapped a third game (time constraints; two games sharpen contrast).  
    - No prediction market alternatives (tokens are simpler than digital markets for 50 mins).  

  **Key:** The physicality (moving objects, flipping switches) makes abstract concepts visceral. The "indeterminacy" of Game 2 lingers before you name it.
