prompt: |-
  I've been noticing something about how internet memes actually spread vs how the Darwinian theory of culture says they should, and I can't figure out if the memetics people ever gave it a name.

  So the setup: a meme starts out as an elaborate artifact. A genuinely well-drawn comic, a skillfully edited video, a joke with a really specific setup. And what ends up taking over is never that version. The versions that win are the degraded ones — stick-figure redraws, crooked phone pics of the original, the variant where you can barely tell what the joke was. At first I assumed the slick version was just losing to funnier competition, but that's not what's happening. The crude version wins *because* it's crude. Nobody feels intimidated remixing something that looks like it took ten minutes in MS Paint. The polished original dies partly because it looks finished, like there's nothing left to add, while the ugly copy is basically an invitation to make an even uglier copy. The trait being selected for isn't appeal, it's something like "easy to reproduce badly" — the copy is deliberately lossy and the lossiness is the advantage.

  Here's why this bugs me. I remember Dawkins talked about successful replicators in terms of longevity, fecundity, and copying fidelity. And in genetics that framing makes sense — mutations are mostly errors, and the replication machinery exists to suppress them. But what I'm describing is almost the mirror image: transmission is lossy on purpose, the degradation is functional, and fidelity looks like it's actively selected *against* past a certain point. It's also not just "selection for transmissibility" in the generic sense, I don't think — a polished, gorgeous version of a meme can be extremely transmissible (people share it constantly) while still failing to *propagate* in the sense of spawning variants. Sharing and copying-with-variation come apart, and the second seems to be what actually drives the long-term lineage.

  So my questions. Does this exact thing — selection for reproduciability-by-untalented-copiers, where degradation is adaptive — have an established name in the memes-and-Darwinian-culture literature or in the more academic cultural evolution stuff? If it's been named, define it for me and tell me what the boundaries are. If it's only been partially covered by existing concepts (like general selection for transmissibility, or whatever the nearest analogs are in cultural evolution theory), tell me where those concepts stop and this thing keeps going. And if there's genuinely no term, coin one: give a definition precise enough that I could tell whether a case falls inside it, and then probe the edges. Like — does it apply to cover songs that simplify the original? Folk tales getting sanded down over generations of retelling? Recipes? Or is there something specific about internet meme culture (everyone can produce and publish, not just consume) that makes this a genuinely new regime rather than an old phenomenon at internet speed?

  I don't want just the label, I want the carving: what exactly the phenomenon is, what it's not, and where the line falls. A name with no definition attached is worse than useless here.
reasoning: |-
  Okay, let's tackle this user's query. They're noticing how internet memes evolve—starting polished but spreading through degraded versions. They question if this matches Dawkins' memetics, which emphasize fidelity. The user wants to know if this phenomenon has a name, its boundaries, and if existing theories cover it.

  First, I recall Dawkins' three criteria: longevity, fecundity, fidelity. But here, fidelity isn't just low; degradation is adaptive. So the user is pointing out an inversion. Existing terms like degeneracy or copying error come to mind, but they don't capture intentional lossiness as an advantage.

  Next, check cultural evolution literature. Boyd and Richerson's work on guided variation and biased transmission might apply, but not directly. "Selection for transformability" or "low-fidelity bottlenecks" are concepts, but they don't emphasize the adaptive nature of degradation. The user's case is about accessibility inviting remix, not just random mutations.

  The user distinguishes sharing from propagation. High-fidelity memes get shared but don't spawn variants because they intimidate modification. Crude versions invite participation. This seems key. Terms like "remix culture" or "participatory affordance" in digital anthropology might be relevant, but they're not specific to degradation as a feature.

  Is there a named concept? Degenerative evolution or entropy in cultural transmission exists, but again, unintentional. The adaptive aspect here is crucial. Maybe "adaptive degradation" or "facilitative crudeness"? Need to coin a term that captures deliberate lossiness enabling reproduction.

  Boundaries: Does this apply beyond internet memes? Folk tales simplify over retellings, cover songs strip down originals. But in those, it's often about memorability or accessibility, not necessarily inviting modification. Internet culture's low barriers to creation make participation-driven degradation unique. So the phenomenon might be a subset of transformability, amplified by digital tools and norms.

  Coining a term: "Participatory Degradation" or "Facilitative Degradation." Define it as degradation that lowers barriers to modification, making the meme more adaptable. Key elements: intentional crudeness, invitation to remix, degradation as a feature, not a bug.

  Refine the term: "Facilitative Degradation" emphasizes the functional aspect. Check if it fits cases. Cover songs simplifying for new audiences? Maybe, but not always inviting further changes. Recipes? Standardization vs. simplification—different. Internet memes are distinct because the degradation directly enables iterative user participation.

  Conclusion: No existing term fully captures this. Coined "Facilitative Degradation" with clear criteria. Boundaries set by whether degradation serves to invite modifications. Digital ecology accelerates it, but similar mechanisms exist elsewhere, just less pronounced.
answer: |-
  You've hit on a profound and well-observed phenomenon that exposes a critical limitation in the early, overly simplistic application of Dawkins' memetics to complex cultural transmission, especially in participatory digital environments. This *is* a recognized and much-discussed dynamic, but it doesn't have a single, universally agreed-upon name. It sits at the intersection of several concepts in cultural evolution, memetics, and digital anthropology. Let's break it down:

  **The Core Phenomenon:** Selection for traits that *facilitate easy modification and reproduction by non-experts, where deliberate loss of fidelity (degradation, simplification, crudeness) is itself an adaptive trait because it lowers barriers to participation and iterative variation.**

  **Why Dawkins' Triad Falls Short (as you identified):**
  1.  **Fidelity:** You're exactly right. High fidelity is *not* always selected for. In fact, **low fidelity can be actively selected for** because it makes the meme more "hackable." The polished original has high fidelity but low "mutability affordance." The crude copy has low fidelity but high mutability affordance.
  2.  **Longevity:** The polished original might persist longer as a single artifact (e.g., saved on a server), but its *lineage* dies out. The crude version's *lineage* achieves greater longevity through prolific branching.
  3.  **Fecundity:** The crude version wins on fecundity *because* of its low fidelity/mutability. Its fecundity is directly tied to its ease of remixing.

  **Established Concepts & Partial Matches (and Where They Stop):**

  1.  **Degeneracy / Copying Error / Cultural Mutation:** These are general terms for loss of fidelity. They *describe* the mechanism but **do not capture the adaptive nature** you observe. They imply the degradation is accidental or detrimental, not a *selected-for advantage*. Your observation is that the degradation *is* the advantage in this context.
  2.  **Selection for Transmissibility / Catchiness:** This is broad and necessary but **insufficient**. A highly transmissible, polished meme gets *shared* (copied verbatim). What you describe is selection for *propagation via variation* – the meme spreads *because* it gets changed easily. Transmissibility gets it shared; low-fidelity/mutability gets it *evolved*. They are separable forces.
  3.  **Transformability / Modifiability:** This gets closer. Theorists like Robert Boyd and Peter Richerson (in *Culture and the Evolutionary Process*) discuss "guided variation" and the role of individual modification. Work on "cumulative cultural evolution" emphasizes the importance of building upon previous versions. However, these often focus on *improvement* or adaptation to new contexts. Your observation highlights that **the *ease* of transformation, often *enabled by crudeness*, is key, and the transformation isn't necessarily "better" in an objective sense, just more prolific.** The *barrier-lowering* aspect is crucial.
  4.  **Low-Fidelity Bottlenecks / Transmission Biases:** Cultural evolution recognizes that transmission is often imperfect ("copying with modification"). Bottlenecks (e.g., oral tradition) force simplification. However, these usually frame low fidelity as a *constraint*, not an *adaptive feature selected for its own sake*. In your internet meme case, the low fidelity is **functionally adaptive *because* it invites participation** in a system where participation is easy and desired.
  5.  **Participatory Culture / Remix Culture (Henry Jenkins, Lawrence Lessig):** These concepts from media studies perfectly describe the *environment* where this happens. They emphasize the cultural shift enabling widespread creation and modification. **They describe the *context* enabling the selection pressure you identify, but not the specific evolutionary mechanism of *selection for degradability itself*.**

  **The Gap & Coining a Term:**

  There isn't a single, perfect term capturing **the specific evolutionary mechanism where loss of fidelity is actively selected for *because* it lowers the barrier to reproduction and variation, thereby increasing fecundity and lineage survival in a participatory environment.**

  **Proposed Term: Facilitative Degradation**

  *   **Definition:** A selective pressure in cultural evolution, particularly prominent in highly participatory digital environments, favoring traits in a meme that deliberately reduce fidelity/complexity/polish, thereby significantly lowering the skill, effort, or resources required for its reproduction and modification. This degradation is adaptive not due to increased inherent appeal, but because it maximizes the pool of potential copiers/remixers, leading to explosive fecundity, rapid variation, and ultimately, greater lineage persistence compared to high-fidelity versions of the same core idea.
  *   **Core Adaptive Trait:** Lowered barrier to reproduction/variation *achieved through intentional or emergent crudeness/simplicity/lossiness*.
  *   **Key Mechanism:** The degraded form acts as an **invitation to participate** ("I can do that too!" / "Look how easy it is to change this!").

  **Probing the Edges: Applying "Facilitative Degradation"**

  1.  **Internet Memes (Your Case):** **Core Example.** A polished comic requires artistic skill to remix. A stick figure version invites anyone with a pencil or MS Paint. Degradation (loss of detail, polish) *facilitates* mass participation and variation. High sharing of the original doesn't lead to lineage propagation; the degraded version does.
  2.  **Cover Songs Simplifying Originals:** **Partial Fit / Edge Case.** Simplifying a complex jazz arrangement for a garage band *does* lower barriers to reproduction (fidelity is lost). If this simpler version becomes a "standard" cover template precisely *because* it's easier for other amateur bands to play, leading to more covers/variations than the complex original inspired, then **Yes**. However, the motivation is often *accessibility to listeners* or *practical necessity*, not primarily an *invitation to remix further*. The selection is more for performance/audience appeal than for maximizing copier pool fecundity. If the simplification *enables* a wave of distinct reinterpretations *because* it's easier to build upon, it trends towards Facilitative Degradation.
  3.  **Folk Tales Getting Sanded Down:** **Weak Fit / Different Mechanism.** Oral transmission leads to simplification ("smoothing") due to *memory constraints* and *transmission error* over generations (a low-fidelity bottleneck). This is unintentional degradation as a *byproduct* of the transmission mode, not degradation *selected for its facilitation of further variation* by participants. The simplified version might persist because it's *easier to remember*, not because it's *easier for anyone to invent a new variant*. The barrier to *creating* a new folk tale variant remains high.
  4.  **Recipes:** **Mixed Case.** *Standardization* (e.g., Betty Crocker) aims for high fidelity/reliability. *Simplification* (e.g., "5-ingredient meals") lowers the barrier to *cooking* (consumption/reproduction). Where it approaches Facilitative Degradation is when a recipe becomes a highly simplified, flexible *template* (e.g., "formula" memes: "X ingredients + Y method = Z dish") that explicitly invites substitution and variation ("use whatever veggies you have!"). The degradation (loss of specificity, complexity) *facilitates* personalized adaptation and sharing of *variants*. A complex, restaurant-quality recipe might be shared but not widely adapted; the simple template spawns countless variations.
  5.  **Chain Letters / Photocopy Art:** **Pre-Internet Analog.** Degraded photocopies of flyers or art (e.g., "Xerox Art") gain a certain aesthetic *because* of the degradation, and the ease of making another copy (low barrier) fuels spread. This **fits**, demonstrating the phenomenon isn't *entirely* new, but the digital environment **radically amplifies** the speed, scale, and participatory nature. The degradation was often a byproduct of the tech; now it's often a stylistic choice *embraced* for its participatory affordance.

  **The Crucial Boundary: Digital Participatory Ecology**

  While simplified cultural forms exist elsewhere, **Facilitative Degradation as a dominant evolutionary force is most potent and distinct in digital environments characterized by:**

  *   **Low Barriers to Production/Distribution:** Anyone with internet access can create and share.
  *   **Remix Tools & Norms:** Software enables easy copying and modification; culture values remix and participation.
  *   **Network Effects:** Visibility and spread are amplified by networks, rewarding prolific variation and engagement.

  In this environment, the selective pressure *for* traits that maximize the potential contributor pool (i.e., Facilitative Degradation) becomes incredibly strong, often outweighing selection for raw aesthetic quality or fidelity. The "ugly" copy isn't just surviving mutations; it's thriving *because* its ugliness is a beacon signaling "YOUR TURN!" to the vast pool of potential remixers. It's evolution harnessing the power of mass participation through strategic imperfection.
