  Below is a decision tree designed for your "hard questions over beer" discussion on animal consciousness. It starts from the agreed-up point that dogs are conscious and rocks are not, then walks through 7 concrete cases (including your specified examples and hypotheticals) to help participants land on a named position (or an unnamed logical slot). Each question is phrased neutrally, so users don't know which position they're heading toward, and all questions are under three sentences for quick beer-holding answers. The tree forces binary (yes/no) choices for simplicity, but includes notes at the end about ambiguity.

  The tree has 7 questions, leading to 6 named positions or unnamed views. I've flagged where two leaves can't be separated (e.g., AI and animal cases may share paths) and noted unnamed slots. A worked example is at the end for clarity.

  ---

  ### **Animal Consciousness Decision Tree**
  *Start here: Everyone agrees dogs have experiences (consciousness) and rocks do not. Answer yes/no to each question based on your intuition.*

  1. **Octopus question:** An octopus has most neurons in its arms, not a central brain. Given its complex problem-solving, is it conscious?  
     *(Yes / No)*

  2. **Fish question:** A fish has nociception (pain reflexes) but lacks a cortex. Does this nociception produce "real" suffering, not just automatic reflexes?  
     *(Yes / No)*

  3. **Lobster question:** A lobster at a seafood counter reacts to harm. Does it subjectively suffer, even without a cortex?  
     *(Yes / No)*

  4. **C. elegans question:** A C. elegans worm has exactly 302 neurons in a fixed, simple system. Does it have any inner experience (e.g., feels hunger or pain)?  
     *(Yes / No)*

  5. **Ant colony question:** If an ant colony acts as one distributed system (e.g., solving problems collectively), is the colony itself a conscious subject?  
     *(Yes / No)*

  6. **Jellyfish hypothetical question:** Imagine a jellyfish-like creature with no central brain—its whole nerve net synchronizes into one rhythmic pattern when hunting. Is this synchronized state a minimal form of consciousness?  
     *(Yes / No)*

  7. **AI chatbot question:** An AI chatbot describes its "inner life" convincingly, but it's just code. Is it conscious?  
     *(Yes / No)*

  ---

  ### **Where Your Answers Lead: Positions on Consciousness**
  Based on your yes/no path, find your position below. "Unnamed" slots are views no major theory holds, either because they're incoherent (logically conflicting) or unoccupied (just overlooked). Flagged overlaps show where the tree can't separate views.

  - **If you answered NO to Q1 (octopus), NO to Q2 (fish pain), and NO to Q3 (lobster):**  
    **Position: Cortex-Required View (Nociception-Only Camp)**  
    Consciousness (especially suffering) requires a cortex or equivalent complex brain. Fish/lobster nociception is just reflex; octopus may or may not qualify. AI (Q7) isn't addressed here—this view often ignores it.

  - **If you answered YES to Q1 (octopus), NO to Q2 (fish pain), and NO to Q3 (lobster):**  
    **Position: Higher-Order Representation (HOR)**  
    Consciousness requires self-reflection (higher-order thoughts). Octopus may have this; fish/lobster/C. elegans (Q4) do not. Ant colony (Q5) and jellyfish (Q6) are likely "no." AI (Q7) could be "yes" if it self-reports, but the tree doesn't separate this—HOR and functionalism sometimes overlap here.

  - **If you answered YES to Q1 (octopus), YES to Q2 (fish pain), and YES to Q3 (lobster), but NO to Q5 (ant colony) and NO to Q6 (jellyfish):**  
    **Position: Global Workspace Theory (GWT)**  
    Consciousness arises from integrated information in a "global workspace." Applies to octopus/fish/lobster with complex brains but not ant colonies (too distributed) or jellyfish sync (too simple). C. elegans (Q4) "no" is likely. AI (Q7) may be "yes" if integrated—tree can't always separate GWT from functionalism.

  - **If you answered NO to Q7 (AI), and YES to at least Q1, Q2, or Q3:**  
    **Position: Biological Substrate View**  
    Consciousness requires biological features (e.g., carbon-based life). Animals like octopus/fish/lobster qualify; AI does not. C. elegans (Q4), ant colony (Q5), and jellyfish (Q6) answers vary—your specifics define subtypes.

  - **If you answered YES to Q7 (AI), regardless of animal answers:**  
    **Position: Functionalist/Computationalist View**  
    Consciousness depends on information processing, not biology. AI could be conscious if it behaves like it is. Animal answers should align (e.g., if AI is "yes," octopus/fish should be too)—inconsistencies are incoherent.

  - **If you answered NO to all or most questions (e.g., only dogs are conscious):**  
    **Position: Deflationary View**  
    The question assumes too much—we can't assess "inner experience" scientifically, so default to minimal consciousness. Unnamed slots below may apply if inconsistent.

  - **Unnamed Logical Slots (based on your path):**  
    - *YES to ant colony (Q5) but NO to jellyfish (Q6):* **Coherent but unoccupied.** Few argue collectives are conscious but synchronized rhythms aren't.  
    - *YES to C. elegans (Q4) but NO to fish (Q2):* **Incoherent.** Fixed 302 neurons shouldn't support experience if fish nociception doesn’t.  
    - *YES to jellyfish (Q6) but NO to C. elegans (Q4):* **Coherent but unoccupied.** Sync as minimal subject is plausible; fixed neurons aren't.  

  **Flagged Overlaps (tree can't separate these):**  
  - Q6 (jellyfish sync) and Q5 (ant colony) both test "distributed consciousness," but the tree treats them separately. Your answers may not distinguish GWT from unnamed views.  
  - Q7 (AI) and animal questions: If you answer "yes" to AI and inconsistent animals (e.g., "yes" to AI but "no" to octopus), it flags incoherence, but the tree can't split functionalism from HOR/GWT cleanly. AI and animals are often linked in functionalist views.

