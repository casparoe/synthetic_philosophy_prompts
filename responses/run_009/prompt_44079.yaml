  Also, for the unnamed positions, for example, if someone says yes to ant colony but no to jellyfish, that might be unnamed because few people hold that, but it's coherent.

  Or yes to C. elegans but no to fish, which is odd but coherent.

  And flag that the tree may not separate higher-order and global workspace perfectly.

  Also, for AI and animals, if someone says yes to AI and yes to animals, it's functionalist; if yes to AI and no to some animals, still functionalist; if no to AI and yes to animals, biological; if no to both, then they might be eliminativist or deflationary.

  I think this is the best we can do.

  So the decision tree handout:

  Front page:

  Hard Questions Over Beer: Animal Consciousness Decision Tree

  Start here (everyone agrees dogs are conscious, rocks are not):

  1. An octopus has most of its neurons in its arms, not a central brain. Is it conscious? (Yes/No)

  2. A fish has nociception (pain receptors) but lacks a cortex like mammals. Does it experience "real" pain (suffering), not just reflexes? (Yes/No)

  3. A lobster at the seafood counter is about to be boiled. Does it experience suffering? (Yes/No)

  4. A C. elegans worm has exactly 302 neurons in a fixed configuration. Does it have any subjective experience (e.g., feels pleasure or pain)? (Yes/No)

  5. Consider an ant colony as one distributed subject rather than many individuals. Is the colony itself conscious? (Yes/No)

  6. Imagine a jellyfish-like creature with no central brain, but its whole nerve net synchronizes into one rhythmic pattern when it hunts. Is this synchronized state a minimal form of consciousness? (Yes/No)

  7. An AI chatbot talks in detail about its "inner life," but you know it's a language model. Is it conscious? (Yes/No)

  On the back:

  Map your answers to a position:

  - **Biological Substrate View**: You said No to AI (Q7) and Yes to at least some animals. Consciousness requires specific biological features.

  - **Higher-Order Representation (HOR) View**: You said No to simple systems like C. elegans (Q4), ant colony (Q5), and jellyfish (Q6), and possibly fish (Q2) and lobster (Q3), because consciousness requires higher-order thoughts.

  - **Global Workspace Theory (GWT)**: You said Yes to octopus (Q1) and dog, but No to fish (Q2) if you think they lack global workspace, and No to simple systems. Consciousness depends on global information availability.

  - **Nociception-Only Camp**: You said No to fish (Q2) and lobster (Q3) experiencing suffering, because real pain requires a cortex.

  - **Functionalist/Computationalist View**: You said Yes to AI (Q7), indicating that consciousness depends on function, not substrate.

  - **Deflationary View**: You might have said No to many or all, or feel the questions are misguided. The concept of consciousness might be ill-defined.

  - **Panpsychist or Broad Inclusivity**: You said Yes to most or all, including AI (Q7) or simple systems.

  Also note:

  - If you said Yes to ant colony (Q5) or jellyfish (Q6), you might hold a view that distributed or synchronized systems can be conscious, even if unnamed.

  - The tree cannot always separate HOR and GWT; they might give similar answers.

  - For the lobster and fish, if you said Yes to one and No to the other, it might indicate a vertebrate/invertebrate distinction, which is a less common view.

  Worked example:

  Answers: Y,Y,Y,N,N,Y,N

  - Octopus: Yes
  - Fish pain: Yes
  - Lobster suffer: Yes
  - C. elegans: No
  - Ant colony: No
  - Jellyfish: Yes
  - AI: No

  Position: Biological substrate view with a broad range for animals, including octopus, fish, lobster, and the jellyfish hypothetical, but excluding very simple fixed systems (C. elegans) and collective systems (ant colony). AI is denied.

  This person might accept that synchronization (jellyfish) can create minimal consciousness, but not fixed small systems or distributed collectives.

  I hope this helps.
