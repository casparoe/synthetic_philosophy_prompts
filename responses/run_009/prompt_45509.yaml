prompt: |-
  I've been reading about how elections actually get run in different countries, and something about Australia's system keeps bugging me. I want to think it through with someone who actually knows social choice theory, so let's say you're a professional philosopher who's taught Arrow's impossibility theorem for years and has strong opinions about how people misuse it. Think carefully before you commit to anything, and please don't rush to a verdict.

  Here's the practice, in case you don't know it. For the Australian House of Representatives you rank every candidate on the ballot. If there are eight candidates and you only number seven boxes, your ballot is invalid — it doesn't count at all, not even for your first choice. So even if you know literally nothing about candidate number six, and you'd despair equally at candidates seven and eight, the state still demands you put all of them in some strict order. And that order can decide the election, because preferences "flow" through the count in rounds until someone has a majority. Parties hand out how-to-vote cards instructing supporters exactly how to number every box, and there's a whole documented phenomenon of "donkey votes" where people just number 1, 2, 3 straight down the ballot, which tells you a decent chunk of these lower rankings are basically noise. And yet the whole thing seems wierd to me only sometimes — most of the time it feels completely natural, which is exactly what makes me suspicious.

  What I want to know is what this institution presupposes about preferences, both individual and collective. It looks like it presupposes that every voter has a complete preference ordering over all candidates, that this ordering exists before the ballot is issued (so voting is reporting a pre-existing state, not making a decision on the spot), and maybe, deeper down, that there's a real "will of the voters" out there which the count discovers. That last one is what Arrow's theorem is supposed to cause trouble for, right? I don't need a lecture on the theorem itself, but I do want you to use it where it actually bites, and no where it doesn't.

  Do a short brainstorm first, then answer in these sections, in this order:

  1. "The implicit theory" — reconstruct as precisely as you can what the practice presupposes. (~250 words)
  2. "What it strictly needs" — separate the presuppositions the practice genuinely can't survive without from the ones it merely sits comfortably with. (~250 words)
  3. "Where it breaks, or doesn't" — say whether the presupposed picture is quietly incoherent or just underdetermined, i.e. whether several quite different theories of voting would license this exact same practice. (~300 words)
  4. "What would change" — if we swapped the discovery picture for a proceduralist one, where the count creates legitimacy rather than finding a pre-existing social preference, what would actually have to change in how ballots are designed or counted? (~200 words)

  Aim for roughly those lengths — a bit over or under is fine, but don't let section 3 balloon.
reasoning: |-
  Hmm, the user is asking about Australia's compulsory full-preference ranking system and what it implies about preferences and social choice. They're particularly interested in the philosophical underpinnings of this voting method and how it relates to Arrow's impossibility theorem.

  The user wants me to analyze this as a professional philosopher who understands social choice theory. They need me to break down my response into four specific sections: reconstructing the implicit theory, identifying essential presuppositions, examining where the system breaks or holds up, and exploring what would change with a proceduralist approach.

  I need to carefully consider how Arrow's theorem applies here. The Australian system uses ranked-choice voting (specifically instant-runoff voting) which does require complete preference orderings. This seems to presuppose that voters have well-defined preferences over all candidates, even when they might not actually care about some choices.

  The requirement for complete rankings is interesting because it forces voters to express preferences they might not genuinely hold. This creates tension with Arrow's theorem which shows no voting system can perfectly aggregate individual preferences into a social ordering while satisfying basic fairness criteria. The "donkey votes" phenomenon demonstrates how this requirement introduces noise into the system.

  For the implicit theory section, I'll reconstruct how this voting method assumes preferences are complete, transitive, and pre-existing. The counting process appears designed to "discover" a pre-existing social preference through elimination rounds.

  When identifying what the system strictly needs, I'll distinguish between core requirements (like complete rankings for ballot validity) and convenient assumptions (like the existence of a "will of the people"). The procedural integrity matters more than the metaphysical claim about discovering pre-existing preferences.

  For where the system breaks or holds, I'll explain how Arrow's theorem shows the impossibility of perfect preference aggregation, while acknowledging that the system still functions practically. The full-ranking requirement creates problems when voters lack meaningful preferences for minor candidates.

  Finally, for the proceduralist alternative, I'll explore how we could modify the ballot design to allow partial rankings or equal preferences while maintaining the instant-runoff counting method. This would shift focus to the voting process itself as the source of legitimacy rather than the idea of discovering a pre-existing social preference.
answer: |-
  ### Brainstorm
  - **Core tension**: Arrow's theorem proves *no* preference aggregation method satisfies all democratic norms simultaneously (universal domain, non-dictatorship, Pareto efficiency, independence of irrelevant alternatives). Australia's system prioritizes completeness over respecting indifference or incomplete preferences.
  - **Key practices**: Full strict rankings enforced; IRV (instant-runoff) counting; "invalid ballot" threat for partial rankings; strategic how-to-vote cards exploiting the rules.
  - **Implicit metaphysics**: Voters have discoverable linear orderings; social preference is a fact waiting to be measured; the count is a truth-tracking procedure.
  - **Proceduralist alternative**: Legitimacy comes from fair process/rules, not "discovery" of a pre-existing will. Ballots could express less information.

  ---

  ### 1. The Implicit Theory
  (~240 words)  
  The Australian system presupposes a **realist, cognitivist theory of preferences**: voters possess stable, complete, and transitive strict orderings over *all* candidates prior to voting. This treats the ballot as a *recording device* for pre-existing mental states, not an opportunity for deliberation or strategic construction. The state mandates revelation of this full ordering, implying such data exists meaningfully—even for obscure candidates. Socially, it assumes a **unitary "will of the electorate"** exists and can be *discovered* by mechanically applying the IRV algorithm. Preferences are treated as additive and commensurable; "transferring" votes via eliminations treats a vote for candidate A as *containing* a latent vote for B if A is eliminated, implying preferences are cardinal and interpersonally comparable in weight. The system further presupposes that forcing a complete ranking (even arbitrary ones) yields a more "accurate" or "legitimate" outcome than allowing partial preferences, prioritizing procedural exhaustiveness over epistemic humility about voter indifference. Arrow’s shadow looms in the insistence on *complete* input data—suggesting that without totality, social rationality (transitive outcomes) would be impossible, ignoring his proof that completeness *still* doesn’t guarantee coherence.

  ---

  ### 2. What It Strictly Needs
  (~240 words)  
  The practice **strictly requires**:  
  - **Complete ballot submission**: Without full rankings, ballots are invalid. This enforces *input completeness* for the IRV algorithm, ensuring every vote can be transferred until a majority is reached.  
  - **Strict ordinality**: Ties or equal rankings are forbidden, preserving deterministic elimination sequences.  
  - **Voter compliance**: A populace willing/capable of producing *some* linear order (even if noisy or arbitrary).  

  It **does not strictly need**:  
  - The **metaphysical claim** that a "true" social preference exists. IRV could function as a fair *procedure* without this realism.  
  - **Accurate preference revelation**: "Donkey votes" show the system tolerates (even depends on) arbitrary low-preference rankings. It needs *a* ranking, not a *considered* one.  
  - **Pre-formed voter preferences**: Voters *can* construct orderings at the ballot box using heuristics (e.g., party cues). The presupposition is about the *form* of the output (linear order), not its cognitive origin.  
  - **Arrow-compliance**: IRV violates IIA (Independence of Irrelevant Alternatives)—a candidate’s presence can change who wins between two others. The system accepts this, prioritizing majority legitimacy over IIA.  

  Crucially, it needs completeness *for procedural determinism*, not because it believes every voter has meaningful preferences over all options.

  ---

  ### 3. Where It Breaks, or Doesn't
  (~300 words)  
  **Breaks**:  
  - **Epistemically**: Arrow’s theorem shows that *even with full rankings*, no method (including IRV) can guarantee rational social preferences (e.g., non-transitive outcomes are possible, albeit rare in practice). Mandating completeness doesn’t resolve this incoherence—it masks it by forcing artificial data.  
  - **Behaviorally**: Voters often lack well-defined preferences beyond top choices. Forcing rankings induces noise ("donkey votes") or manipulation (strategic misranking on how-to-vote cards). This conflates *expressed* and *authentic* preferences.  
  - **Normatively**: Punishing voters for indifference (via invalid ballots) treats incomplete preferences as irrational or illegitimate, violating liberal neutrality.  

  **Holds (or is underdetermined)**:  
  - **Procedural legitimacy**: The system *functions* without metaphysical realism. IRV is a clear, rule-based process that (usually) produces a majority winner. Many theories—including pure proceduralism ("rules are fair, so outcome is legitimate") or Benthamite utilitarianism (treating rankings as utility proxies)—can justify the same practice.  
  - **Strategic resilience**: While imperfect, IRV is less susceptible to spoiler effects than plurality voting. The count’s mechanical logic (eliminate lowest, redistribute) is transparent, aiding public acceptance.  
  - **Underdetermination**: The identical institution could stem from:  
    - **Realism**: "We are discovering the people’s true preference."  
    - **Pragmatism**: "Complete rankings are the price of a decisive, majority-backed winner."  
    - **Paternalism**: "Voters *should* engage with all options; we force them to."  
    - **Reductionism**: "Preference strength is ordinal and comparable; IRV approximates a Condorcet winner."  
  Arrow’s theorem bites not by making the system unworkable, but by showing its output isn’t a "true" social ordering—yet the system survives because it prioritizes decisiveness over theoretical purity.  

  ---

  ### 4. What Would Change
  (~180 words)  
  Under a **proceduralist view** (legitimacy from fair rules, not discovery), ballots could permit:  
  - **Partial rankings**: Voters rank only preferred candidates. Ballots exhaust when no ranked candidates remain. This respects indifference/ignorance.  
  - **Equal rankings**: Allowing ties (e.g., "1. A, 2. B/C") acknowledges incomparability.  
  - **Approval-style options**: Letting voters approve multiple candidates equally.  

  Counting rules would adapt:  
  - **Exhaustion**: If no majority emerges from active rankings, the seat might be void or decided by plurality/majority of remaining votes.  
  - **Tie-handling**: Random selection or proportional methods if equal ranks affect outcomes.  

  Critically, **validity criteria relax**: Ballots count if they express *any* discernible preference. How-to-vote cards lose potency, as voters aren’t coerced into full artificial orders. The focus shifts from "revealing the will" to "fairly aggregating expressed preferences," accepting that legitimacy emerges from the process, not its fidelity to a presupposed truth. Arrow’s theorem remains relevant but becomes a caution about aggregation limits, not a flaw in "discovery."
