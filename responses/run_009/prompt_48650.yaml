prompt: |-
  I write about science and ideas for a general-interest magazine, and I commission the short fiction slot we run in each issue. The pieces we run take up a live conceptual question rather than illustrate a settled one, and for the coming issue the question is how we decide which animals get the benefit of the doubt about consciousness.

  I'd like a story that avoids the obvious moves. In particular: no first-person interior monologue of an animal, which settles by fiat the very question at issue; no dreamy what-is-it-like-to-be musing; no dystopia in which some authority sorts species into sentient and non-sentient. The problem I want dramatized is evidential rather than metaphysical. Our grounds for attributing experience to a species are of several distinct kinds — an animal trading off pain relief against a resource it wants, self-administration of analgesics, guarding of injured kin, performance on mirror tests, the sheer architecture of the nervous system — and these different kinds of evidence run out at different places in the tree of life, so the boundary of the plausible is a ragged edge rather than a line. An octopus and a prawn sit on the same coast in our intuitions and at opposite ends of our legislation, and the story should make a reader feel why that is genuinely hard rather than tell them it is.

  Ideally, then, the story follows one character — a researcher, a welfare inspector, a fisherman, a chef, your choice — being pulled toward different verdicts by different kinds of evidence, with the story itself refusing to tip the answer. Compress it as much as you can: present it as exactly five numbered scenes, each no more than two sentences, with no introduction, epilogue, or connecting narration between them. The five scenes should be the whole story.
reasoning: |-
  Okay, the user writes for a science magazine and needs a short fiction piece about animal consciousness evidence. They want to avoid clichés like animal interior monologues or dystopian classifications. Instead, the story should highlight the conflicting evidence types—behavioral, neurological, physiological—without resolving the debate. 

  Hmm, the challenge is compressing this into five stark scenes, two sentences each, with zero exposition. Each scene must pit different evidence against each other through a human lens. A researcher character makes sense—they'd directly grapple with these contradictions. 

  First scene needs to establish the core tension immediately. Maybe a lab setting: octopus solving puzzles (complex cognition) versus prawns in boiling water (lack of visible response). Contrasting these extremes in one place hooks the reader. 

  Second scene should shift to another evidence type. Fisherman's anecdote about octopus escaping traps introduces real-world behavioral proof, while the researcher notes the same octopus ignores injured peers—undermining "higher" empathy evidence. 

  Third scene pivots to neurobiology. The MRI scans showing prawn nociception (pain infrastructure) but no integrated cortex. Highlight how physical evidence complicates things further. 

  Fourth scene introduces policy consequences: restaurant dilemma where octopus gets legal protection but prawns don't, despite similar nerve clusters. The chef's shrug emphasizes societal inconsistency. 

  End on a personal ethical crisis—researcher hesitating over anesthesia for prawns. Their trembling hand embodies the unresolved tension, leaving the reader with the discomfort of uncertainty. 

  Key is balancing objectivity with visceral moments. No hand-holding; trust the scenes to imply the deeper conflict. Each pair of sentences must do heavy lifting: one fact, one counterfact.
answer: |-
  Here are five numbered scenes:

  1. Dr. Anya Sharma watched the octopus unscrew the jar lid with one tentacle while the others pressed analgesic gel onto its burned arm; through the lab window, the trawler dumped its catch, prawns flickering against the ice like synaptic sparks.  
     She recorded *Cephalopod: Targeted self-medication, complex tool use*, then stared at the prawn tanks, their inhabitants’ identical, twitching antennae offering nothing but reflex.

  2. "That big male? Learned the drain grate after two escapes," the old fisherman rasped, tapping the octopus tank at the dockside market; Anya noted the creature’s watchful eye tracking her pen.  
     Yet when a smaller octopus snagged its arm on driftwood, the others pulsed indifferently, no distress call echoing in the salt air, no attempt to aid.

  3. The MRI scan showed the prawn’s ganglia firing intense, localized bursts when exposed to acetic acid—distinct nociception pathways, undeniable.  
     But the neural architecture remained fragmented, no integrated cortex like the octopus’s, just a chain of simple processors reacting, not *planning* its writhing.

  4. "Regulations say octopus gets the stun tank first," sighed the seafood chef, sliding the live prawns directly into the roiling pot; their carapaces turned translucent pink almost instantly, no visible struggle beyond initial contact.  
     Anya touched the cooler where the octopus rested under sedation, its complex nerves identical to the prawn’s at the molecular level where pain began.

  5. Anya poised the needle over the prawn destined for her nociception experiment—standard protocol required no anesthetic for invertebrates lacking *proven* central awareness.  
     Her hand trembled, suspended between the clear evidence of its primitive wiring and the raw, shattering possibility shimmering in its dark, unreadable eye.
