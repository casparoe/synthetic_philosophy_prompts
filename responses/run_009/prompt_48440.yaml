answer: |-
  Here’s a rigorous specification of desiderata for an adequate answer to the Special Composition Question (SCQ), with motivations and analysis of key tensions:

  ### **Core Desiderata for an Adequate SCQ Answer**
  1. **Capture Commonsense Intuitions**  
     *Motivation*: Must explain paradigm cases (e.g., atoms compose a cat; grains compose a sand pile) and borderline cases (e.g., "cat + shed hair" seems non-composite).  
     *Why it matters*: Rejecting all intuitions risks irrelevance; systematizing them is ontology’s starting point.  
     *Challenge*: Some intuitions conflict (e.g., a severed cat’s paw is both a "thing" and "part of a whole").

  2. **Physical Compatibility**  
     *Motivation*: Composition facts shouldn’t require *sui generis* properties absent from fundamental physics (e.g., immaterial "unity fields").  
     *Why it matters*: Maintains naturalistic coherence; avoids dualism about mereology.  
     *Caveat*: Physics may underdetermine composition (e.g., quantum entanglement doesn’t map cleanly to macro-objects).

  3. **Non-Arbitrariness**  
     *Motivation*: No "brute" or gerrymandered thresholds (e.g., "exactly 10⁴⁵ atoms compose an object").  
     *Why it matters*: Avoids *ad hoc* metaphysics; preserves explanatory unity.  
     *Key test case*: Why does adding one sand grain turn a non-heap into a heap?

  4. **Informativeness**  
     *Motivation*: Must specify *conditions* for composition (e.g., "contact," "function") beyond restating the question.  
     *Why it matters*: Distinguishes substantive answers from trivial ones (e.g., "things compose when they compose").  
     *Pitfall*: Overly vague criteria (e.g., "under a sortal") may qualify.

  5. **Extensibility**  
     *Motivation*: Should generalize to events ("when do sub-events compose a battle?"), holes, or abstracta.  
     *Why it matters*: Tests whether the theory addresses *composition itself* or is object-specific.  
     *Counterargument*: Events/objects may need distinct theories — but a unified account is preferable.

  6. **Parsimony**  
     *Motivation*: Minimizes primitive compositional facts or new ontological categories.  
     *Why it matters*: Aligns with methodological conservatism; excessive proliferation undermines explanation.

  ---

  ### **Tensions Between Desiderata**
  | **Conflict Pair**              | **Reason**                                                                 |
  |-------------------------------|---------------------------------------------------------------------------|
  | **Commonsense + Physical Compatibility** | Commonsense privileges macro-objects (cats, chairs); physics suggests only particles/fields exist. |
  | **Non-Arbitrariness + Informativeness** | Any non-universalist criterion (e.g., "functional unity") risks vagueness at boundaries. |
  | **Extensibility + Informativeness**     | A criterion specific to material objects (e.g., "life") fails for events/holes. |

  ---

  ### **Desideratum with Greatest Discriminatory Power: NON-ARBITRARINESS**  
  This knocks out the most standard answers by exposing their weaknesses:  

  | **View**          | **Why Non-Arbitrariness Challenges It**                                  |
  |-------------------|-------------------------------------------------------------------------|
  | **Nihilism**      | Rejects all composition → counters commonsense (but avoids arbitrariness). |
  | **Universalism**  | Accepts arbitrary sums (e.g., "cat+Himalayas") → violates commonsense *and* informativeness. |
  | **Restrictivism** | Boundaries (e.g., "functional unity") appear arbitrary under sorites pressure (e.g., gradual neuron removal in a brain). |
  | **Life Criterion**| Excludes inanimate objects (statues, planets) → *ad hoc* without deeper justification. |

  ---

  ### **Recommendation for Your Syllabus**  
  Spend **two weeks** if your goals include:  
  - Teaching meta-ontology (how we evaluate metaphysical theories).  
  - Exploring links between mereology, persistence, and identity.  
  - Highlighting the SCQ as a microcosm of metaphysics’ challenges (intuition vs. theory, vagueness, naturalism).  

  **Trim to one week** if:  
  - Focus is applied metaphysics (e.g., philosophy of mind/time).  
  - Student background limits engagement with technical mereology.  

  The SCQ’s value lies not in its resolution but in its power to **reveal foundational tensions** — making it pedagogically fertile ground.
