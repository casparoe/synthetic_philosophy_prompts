  Second, fragility. Cascades can break with a single public signal. That's because of rational updating; conflicting evidence can reset beliefs. Conformist bias reinforces majorities through a copying bias, making it stickier. The difference comes from rational inference vs. inherent bias.

  Third, distinguishability. With only aggregate data over time, both models produce S-curves. Cascades have sudden stops or reversals if signals contradict, but without sequence data, those aren't visible. Conformist shows smoother, lock-in patterns. So with aggregate data, they look similar, making it hard to tell apart.

  The user wants a judgment on which explains frequency-only data better. Conformist bias seems more robust here because it doesn't rely on unobservable sequences. But the objection from cascade theorists would be that cascades can approximate frequency through rational inference. However, without sequence, agents can't discern if early signals were strong, leading to inefficiencies. Conformist bias directly uses frequency, fitting the data limitation better.

