  2.  **Perdurantism:** An object's persistence is constituted by its entire worldtube; no single spacelike hypersurface contains the "whole" object, only a temporal part (a specific field configuration slice), with identity over time being the continuity of the tube itself.
  3.  **Clean Translation:** Perdurantism translates directly to the concept of a worldtube as the fundamental entity. Endurantism's "wholly present at a time" maps cleanly to the field configuration *on a specific spacelike hypersurface* defining the object's instantaneous state.
  4.  **Distortion Required:** Endurantism requires distorting the "strict identity across time" claim to fit within spacetime physics; maintaining that *exactly the same physical entity* exists on different hypersurfaces clashes with Lorentz invariance and field evolution, demanding an ad hoc "identity" beyond the field configuration history.
  5.  **Residue Verdict:** Your physics vocabulary exposes the substantive commitment: endurantism's seeming incoherence stems not from missing philosophical nuance, but from its incompatibility with the fundamental spacetime ontology and Lorentz invariance inherent in the standard tools; the debate *presumes* the block universe framework where perdurantism is naturalised.
