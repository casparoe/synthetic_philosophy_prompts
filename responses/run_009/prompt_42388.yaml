prompt: |-
  I help run the facebook group for my neighborhood, few thousand members. Lately someone has been posting rants calling one of our city council members corrupt and a "puppet of developers." On its own whatever, people trash local politicians all the time. But the last post went further: it listed the cafe where she has breakfast every morning, the gym she goes to and the hours she's usually there, and ended with something like "if you see her, let her know what you think." A bunch of people have been showing up there to confront her, and yesterday a small crowd basically boxed her in outside the gym until her husband came. Nobody touched her, but she's visibly shaken and asked me directly to take the posts down.

  The guy who posted is now accusing me of censorship if I remove it. His claim is that it's all true and all public info — she really does eat there, and everything he posted he found from her own social media. He says if people choose to be hostile that's on them, not on his posts, and that a "free exchange of opinions" was kind of the whole point of the group. Some members back him up and say slippery slope: today I delete "criticism of a politician," tomorrow I'm deleting anything I personally disagree with.

  I'm torn. I do think he should be allowed to say she's corrupt, that's normal political speech to me. But listing her routines and telling people to go find her feels different in a way I can't fully articulate — like the same words matter differently depending on who's reading them and what they can do with them. Is there an actual principled line here, or am I just making a gut call and dressing it up? And does it matter that he didn't explicitly tell anyone to threaten her? Help me figure out where the line is and how to explain the removal (or non-removal) to the group in a way that isn't just "I felt like it."
reasoning: |-
  Okay, the user is an admin of a neighborhood Facebook group facing a tricky situation. Someone is posting about a city council member, calling her corrupt and a puppet of developers. Initially, that seemed like normal political criticism, but the latest post included her daily routines—like where she has breakfast and her gym schedule—and encouraged people to confront her. This led to actual confrontations, where she was cornered until her husband intervened. She's shaken and asked for the posts to be removed.

  The poster is arguing it's free speech and public information, accusing the admin of censorship. Some group members support him, worrying about a slippery slope where removing this leads to arbitrary deletions. The admin is torn because they believe in free speech for criticism but feel this crosses a line they can't fully articulate. They need help finding a principled line and explaining their decision without it seeming arbitrary.

  First, I need to identify where the line is. Political criticism is protected, but sharing specific locations and times, coupled with a call to action ("let her know what you think"), turns it into something else. It's not just speech; it's facilitating harassment. Even if the info is public, aggregating it and directing people to confront her escalates the risk. The fact that people actually showed up and cornered her shows the real-world harm, which moves it beyond opinion into incitement.

  The poster's argument that the hostility isn't his responsibility is weak. Legally and ethically, encouraging confrontations in personal spaces (gym, cafe) creates an intimidating environment. Platforms like Facebook have policies against harassment and coordinating harm, so removing the post aligns with those standards. The slippery slope concern can be addressed by setting clear rules: criticism is allowed, but doxxing or inciting real-world harassment isn't. That's a specific boundary, not a matter of personal disagreement.

  The admin needs to explain this to the group transparently. They should frame it as a safety issue, not censorship. Emphasize that the group's purpose is discussion, not organizing intimidation. Point out the documented consequences (crowd cornering her) and the council member's distress. By establishing clear community guidelines upfront, they can prevent future issues and show consistency, not arbitrariness.

  Also, the admin should consider their role in maintaining a safe environment. Allowing this could lead to legal liability or members leaving due to a toxic atmosphere. Protecting the group's integrity means drawing this line firmly, even if some members disagree. The key is communicating principles clearly: free speech yes, harassment no.
answer: |-
  You're absolutely right to feel this crosses a line, and it's not just a gut feeling. There's a clear, principled distinction here based on **safety, intent, and the transformation of speech into action**.

  Here's the breakdown and how to handle it:

  **The Principled Line: Advocacy vs. Incitement to Harassment**

  1.  **Political Criticism is Protected (Generally):** Calling a politician "corrupt" or a "puppet" is harsh but falls under protected political speech, even if hyperbolic or unproven. It's about *ideas* and *opinions* regarding public actions.
  2.  **Listing Routines + Call to Action = Harassment Facilitation:** Publishing specific, non-public-work locations and times *combined* with an exhortation like "if you see her, let her know what you think" transforms this from mere criticism into **doxxing** (revealing private identifying information to enable harassment) and **incitement to harassment**.
      *   **Location/Time:** While potentially *findable* via public posts or observation, compiling and broadcasting her *daily routine* (breakfast spot, gym schedule) removes her reasonable expectation of privacy in personal spaces. It's not about public record (like council meeting times); it's about her private life.
      *   **Intent & Likely Consequence:** The poster clearly intended people to locate her in these non-official settings ("if you see her..."). Given the accusatory and inflammatory nature of the "corrupt" framing, hostility was a predictable outcome. They weren't inviting reasoned debate at a town hall; they were directing people to confront her while she's vulnerable (getting coffee, exercising).
      *   **Result Proves Harm:** The incidents at the cafe and gym (especially being "boxed in") are direct consequences. This is **harassment and intimidation**, not debate. She feels unsafe going about her daily life.
      *   **Implicit Threat:** Explicit threats aren't necessary to create intimidation. Persistent, unwanted confrontations in personal spaces, especially when orchestrated through group mobilization, constitute harassment. "Let her know what you think" in this context, directed at someone labeled "corrupt," is easily interpreted as encouragement to harass.

  **Why Removal is Justified (and Necessary):**

  *   **Safety First:** Your primary duty as admin is to maintain a safe environment *for the group and the community it serves*. Allowing posts that demonstrably lead to harassment and intimidation violates this core responsibility. This isn't about her feelings; it's about preventing potentially dangerous situations.
  *   **Platform Rules:** Facebook's Community Standards explicitly prohibit:
      *   **Bullying and Harassment:** "Repeatedly contacting someone in a manner that is... unwanted," "Posting content that targets private individuals to degrade or shame them," "Revealing personal information (doxxing)."
      *   **Coordinating Harm:** "Statements of intent, calls to action, or advocating for harm." The "if you see her" line is a clear call to action that resulted in harm.
  *   **Group Purpose:** The "free exchange of opinions" does *not* extend to facilitating harassment or intimidation. Your group exists for community discussion and information sharing, not as a platform for organizing targeted intimidation campaigns against individuals in their private lives.
  *   **Slippery Slope Fallacy:** Removing content that *incites harassment* is not the same as removing content you personally disagree with. The line is clear: **Speech criticizing public actions = allowed. Speech facilitating real-world harassment of an individual in private spaces = prohibited.** You can articulate this difference specifically.
  *   **Poster's Responsibility:** The poster's claim that "people choosing to be hostile" absolves him is false. He created the situation by broadcasting her routine *and* encouraging confrontation. He bears significant responsibility for the predictable outcome.

  **How to Handle This and Communicate to the Group:**

  1.  **Remove the Problematic Posts Immediately:** Especially the one listing routines and the call to action. This is non-negotiable for safety.
  2.  **Ban the Poster (Temporarily or Permanently):** His actions show a clear disregard for the safety of others and the group's purpose. A temporary ban sends a strong message; a permanent ban may be justified given the severity and his refusal to acknowledge harm.
  3.  **Post a Clear, Unambiguous Group Announcement:**
      *   **Frame it around Safety and Group Rules:** "Recently, posts were made listing the personal daily routines of a local official and encouraging members to confront her. These posts led directly to incidents where this individual was harassed and intimidated in public spaces. This is unacceptable."
      *   **State the Principle Clearly:** "While robust criticism of public officials and their policies is welcome within this group, **facilitating harassment or intimidation is strictly prohibited.** This includes:
          *   Posting personal, non-public-work schedules or routines of individuals (doxxing).
          *   Encouraging members to locate and confront individuals in non-public-forum settings.
          *   Any content that incites or organizes real-world harassment, threats, or intimidation.
      *   **Address the "Why":** "This decision is not about suppressing criticism or favoring any political view. It is about ensuring this group remains a space for discussion *without* becoming a platform for actions that make members of our community feel unsafe or targeted in their personal lives. The safety of our neighbors is paramount."
      *   **Acknowledge the Incident:** "The recent incidents stemming from a group post demonstrate why this rule is necessary. We have a responsibility to prevent our platform from being used to organize harassment."
      *   **Reaffirm Core Values:** "We remain committed to free and open discussion about local issues, development, and politics. Criticize policies, debate decisions, express strong opinions. But do so respectfully and without targeting individuals for harassment outside of official public channels."
      *   **State the Consequence:** "Posts violating these safety rules will be removed, and repeat offenders will face removal from the group. This applies equally to all sides of any debate."
  4.  **Update Group Rules/Description:** Explicitly add the new rule about prohibiting doxxing, revealing personal routines, and inciting harassment/intimidation. Make it visible to all members.

  **Key Phrases for Your Explanation:**

  *   "Facilitating harassment" / "Inciting intimidation"
  *   "Targeting an individual in their personal space"
  *   "Doxxing (revealing private routines)"
  *   "Call to action leading to real-world harm"
  *   "Safety of community members" / "Preventing intimidation"
  *   "Distinction between criticizing policy and organizing harassment"
  *   "Violation of platform safety standards"
  *   "Predictable consequence"

  **Don't Get Bogged Down In:**

  *   Debating whether she is *actually* corrupt. That's irrelevant to the safety violation.
  *   Endless arguments about "public information." Context matters. Aggregating it for the purpose of confrontation *is* doxxing/harassment.
  *   Accusations of "censorship." Protecting people from harassment isn't censorship; it's basic moderation for safety.

  **You are not making an arbitrary "gut call."** You are drawing a clear, well-established line between protected political speech and unprotected incitement to harassment, based on the direct and harmful consequences of the post. Removing this content is necessary, responsible, and the right thing to do for your community. Stand firm.
