answer: |-
  ## Thought Experiment: Mary the Achromat Painter

  Mary, a congenital achromat, sees only in grayscale. Yet, as the world's leading vision scientist and artist, she possesses and *routinely exercises* abilities seemingly identical to those gained upon seeing color. **Daily**, she sorts Munsell chips flawlessly using her handheld spectrometer, instantly calling out color names based on wavelength readouts. **Weekly**, she creates photorealistic color paintings: mixing pigments precisely according to her wavelength-to-pigment tables, verified as indistinguishable from color photographs by panels of normally sighted experts. **Monthly**, she describes the subjective experience of specific hues (like "fiery, attention-grabbing red") to sighted colleagues using complex neurocomputational analogies; they unanimously affirm her descriptions capture their own experiences perfectly. She passes all conceivable behavioral tests of color competence – identifying objects by "color," predicting color contrasts, even advising on paint formulations for artists. She has genuinely mastered the public, functional role of color. Following successful gene therapy restoring cone function, Mary looks at a tomato.

  **Isolated Question:** Does Mary gain only new *abilities* (recognitional, imaginative) when she first experiences red, or something further?

  **Predictions:**
  1.  **Ability Hypothesis (Lewis/Nemirow):** Gains *no new propositional knowledge*. She only gains the *practical abilities* to recognize red spontaneously (without the spectrometer), visually imagine red, and remember the experience. She had the *conceptual* and *behavioral* competence all along; now she has the sensorimotor skills.
  2.  **Acquaintance Hypothesis:** Gains *acquaintance knowledge* – a direct, non-propositional grasp of the phenomenal quality (quale) of red. This is a fundamentally new *kind* of epistemic relation to the property.
  3.  **Representationalist (Old Fact/New Mode):** Gains a *new phenomenal concept* or *mode of presentation* for the physical/functional property of surface reflectance (wavelength ~650nm) she already knew about propositionally. This new concept provides cognitive access to the property via a different (phenomenal) cognitive route.

  **Intuition & Key Feature:** The case strongly suggests Mary gains acquaintance knowledge or a new phenomenal concept. The **key feature** forcing the intuition is her *demonstrated ability to simulate the full public, functional, and descriptive role of color experience without qualia*. She didn't just *know about* abilities; she *performed* the very tasks (accurate sorting, realistic painting, endorsed description) that constitute the external manifestation of color competence, using non-phenomenal proxies (instruments, tables, theory). Yet, intuitively, seeing red still provides *something* new – the subjective "what-it's-likeness" itself.

  **Steelman Defense & Cost:**
  The ability theorist must argue: Pre-therapy, Mary lacked the *specific, immediate, non-inferential recognitional ability* triggered by the *sensory stimulus itself*. Her spectrometer sorting was *inferential* (wavelength -> color label), not direct sensory recognition. Painting was formulaic, not guided by phenomenal feedback. Descriptions were theoretical, not grounded in direct acquaintance. The "ability" gained is *precisely* this immediate, non-conceptual, sensory-response capacity.

  **Cost:** This defense risks draining the "ability" of substantial *independent* content. If the *only* ability that counts is the one *conferred directly by having the experience itself* (immediate recognition upon stimulus), then the hypothesis becomes circular or trivial: "What you gain is the ability to do what having the experience enables you to do." It struggles to explain *why* this specific, immediate ability feels so epistemically significant compared to her prior, equally successful (but inferential) competence. It risks reducing "ability" to a label for the phenomenal capacity itself.

  **What if the Key Feature is Removed?**
  If Mary *didn't* actively paint, describe, and sort chips using her non-phenomenal methods, the case collapses back into the original black-and-white room. Critics could (and do) argue she merely lacked the *opportunity* to develop the relevant abilities conceptually/behaviorally. The residue surviving removal is the *original* intuition, but strengthened: the refined case demonstrates that even *maximal* conceptual/behavioral competence, actively exercised using the best non-phenomenal tools, still seems insufficient to capture what experience provides, forcing the ability hypothesis into a defensive, potentially circular, redefinition.

