       - Voluntary: +20 (because it encourages voluntary solidarity, which is virtuous)

     Additionally, we introduce a twist: the policy must be a package (Priority + Mandate). The factions must agree on one package. If they fail to agree, the default is (Priority: HCWs, Mandate: Voluntary) which is the status quo.

     The point assignments for the default (status quo) for each faction:
     - Util: HCWs (+50) + Voluntary (0) = 50
     - Rights: HCWs (+10) + Voluntary (0) = 10
     - Virtue: HCWs (+30) + Voluntary (+20) = 50

     The goal for each faction is to maximize their points. They are told that the points represent their moral satisfaction. We must emphasize that the points are a proxy for how well the outcome aligns with their moral values.

