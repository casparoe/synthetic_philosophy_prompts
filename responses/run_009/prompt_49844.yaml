  We are designing an in-class game to illustrate the distinction between "trade-like" moral compromises (where each side gains on what it values highly by conceding on what it values less) and "contaminating" compromises (where the joint action involves doing something each side considers wrong). The goal is for students to experience and recognize the difference through negotiation.

  Key Design Elements:
  1. **Factions**: We need at least two factions with distinct moral frameworks. To make the trade/contamination distinction clear, we will have three factions to allow for more complex negotiations and to avoid simple binary splits. We'll use simplified but non-cartoonish value systems.

     Proposed factions:
     - **Consequentialist Group (Util)**: They care about maximizing overall well-being (or a proxy, like "utility points") and are willing to consider any action that leads to a net gain. They have no intrinsic constraints but are concerned with outcomes.
     - **Deontological Group (Rights)**: They hold strong side-constraints, such as not violating individual rights (e.g., free speech, bodily autonomy). They assign high negative value to any violation of these rights, regardless of consequences.
     - **Virtue Ethics Group (Virtue)**: They focus on the character of the actors and the integrity of the process. They value actions that express virtues (e.g., honesty, courage, compassion) and avoid those that express vices (e.g., betrayal, cowardice, callousness). They also care about maintaining their own moral integrity and consistency.

  2. **Scenario**: We'll use a concrete policy dispute to ground the negotiation. This makes the values more tangible.

     Proposed scenario: **"The Vaccine Distribution Policy"**  
     Context: A pandemic is raging, and a limited supply of a life-saving vaccine is available. The factions are part of a government advisory board that must decide on a distribution policy. The policy has two dimensions:
     - **Priority Group**: Which group gets the vaccine first? Options: 
       - (A) Frontline healthcare workers (HCWs)
       - (B) The elderly (65+)
       - (C) Essential workers (grocery, transit, etc.)
     - **Mandate**: Whether vaccination should be mandatory for the priority group? Options: 
       - (M) Mandatory: Refusal leads to penalty (e.g., job loss for HCWs, or fines for essential workers)
       - (V) Voluntary: No penalty for refusal.

     The factions have different moral concerns about these options.

  3. **Value Assignments (Point Scheme)**:
     We assign points to outcomes to reflect each faction's moral weighting. However, we must be cautious because point-based systems risk implying commensurability. We will mitigate this by:
        - Using high-stakes points for core principles and low-stakes for trade-offs.
        - Including some outcomes that are non-negotiable (infinite negative points) for some factions? But that might break the game. Instead, we can use very large negative numbers for violations of core constraints.

     Proposed point system (on a scale where 0 is neutral, positive is good, negative is bad):

     **Consequentialist (Util)**:
     - Primary goal: Save lives. They assign points based on expected lives saved.
       - Prioritizing HCWs: +50 (because they save more lives if protected)
       - Prioritizing elderly: +30 (they are at high risk but don't save others)
       - Prioritizing essential workers: +40 (they keep society running and are at risk)
     - Mandate: They see mandates as increasing uptake and thus saving lives.
       - Mandatory: +20 (because it leads to higher coverage)
       - Voluntary: 0 (no penalty, but also no extra benefit)

     **Deontological (Rights)**:
     - They oppose any mandate because it violates bodily autonomy (a right).
       - Mandatory: -100 (a severe violation of rights)
       - Voluntary: 0 (acceptable)
     - They are also concerned with distributive justice and rights of vulnerable groups. They assign:
       - Prioritizing HCWs: +10 (protects those who serve, but not necessarily the most vulnerable by rights)
       - Prioritizing elderly: +30 (they are the most vulnerable and have a right to protection)
       - Prioritizing essential workers: +20 (they are vulnerable and provide essential services, but less than the elderly)

     **Virtue Ethics (Virtue)**:
     - They care about the character of the decision and the process. They value compassion, justice, and honesty.
       - Prioritizing the elderly: +40 (compassionate, protects the most vulnerable)
       - Prioritizing HCWs: +30 (gratitude and justice for those who serve)
       - Prioritizing essential workers: +25 (recognition of their contribution, but less than HCWs or elderly)
     - Mandate: They see a mandatory policy as coercive and lacking in compassion and respect for autonomy. However, they also value solidarity and might see it as a failure of civic virtue if people refuse.
