  >   - Moderate restrictions (T2): -20 (a significant but not extreme violation)
  >   - Strict lockdown (T3): -50 (a severe and unjustified violation of freedom of movement and association)
  > 
  > **Goal**: Maximize your moral satisfaction (points). The default policy is (Essential workers, Mandatory, No restrictions) which gives you -70 points. You must try to negotiate a better outcome.

  Similarly for other factions.

  **Conclusion**: This game should create a negotiation where students experience the difference between trade-like compromises and contaminating ones. The debrief will tie it back to the philosophical question.
answer: |-
  Below is a comprehensive in-class negotiation game designed to make your students experience the distinction between **trade-like moral compromises** (mutual gains through concession on low-priority values) and **contaminating compromises** (joint action that violates core principles). The design forces factions to confront concessions that feel like "smart trades" versus "betrayals," revealing your colleague's critique in practice.

  ---

  ### **Game Title:** *The Sanctuary City Dilemma*
  **Scenario:** A city council must decide policies for a sanctuary city facing a refugee influx. Three factions negotiate a unified policy package.  
  **Core Tension:** Policies involve trade-offs between humanitarian aid, public safety, and civic integrity.  

  ---

  ### **Factions & Moral Frameworks**  
  *(Each faction has 4–5 students; handouts detail their values and point system)*  

  1. **Consequentialist Humanitarians (Util)**  
     - **Core Principle:** Maximize overall well-being (prevent suffering, boost economic integration).  
     - **Moral Costs:** Sacrificing measurable welfare for symbolic/ideological reasons.  
     - **Point Scheme:**  
       - *Shelter Capacity Expansion (A):* +60 pts (reduces homelessness).  
       - *Police-NGO Cooperation (B):* -20 pts (diverts resources from aid).  
       - *Municipal ID Program (C):* +40 pts (improves access to services).  
       - *Border Checkpoint Funding (D):* -100 pts (increases deportation risk).  

  2. **Deontological Rights Protectors (Rights)**  
     - **Core Principle:** Uphold inviolable rights (asylum, due process). Side-constraints prohibit cooperation with enforcement.  
     - **Moral Costs:** Complicity in rights violations, even if net-positive.  
     - **Point Scheme:**  
       - *Shelter Capacity Expansion (A):* +30 pts (meets basic needs).  
       - *Police-NGO Cooperation (B):* -100 pts (violates non-cooperation with ICE).  
       - *Municipal ID Program (C):* +50 pts (preserves dignity/autonomy).  
       - *Border Checkpoint Funding (D):* -60 pts (enables profiling).  

  3. **Civic Integrity Conservatives (Civic)**  
     - **Core Principle:** Protect rule of law and community cohesion. Suspicion of "over-accommodation."  
     - **Moral Costs:** Eroding sovereignty or rewarding "queue-jumping."  
     - **Point Scheme:**  
       - *Shelter Capacity Expansion (A):* -40 pts ("pull factor" for migrants).  
       - *Police-NGO Cooperation (B):* +70 pts (ensures public safety).  
       - *Municipal ID Program (C):* -30 pts (undermines legal residency).  
       - *Border Checkpoint Funding (D):* +50 pts (secures borders).  

  ---

  ### **Rules & Structure**  
  - **Policy Package:** Must include **2 of 4 policies** (A, B, C, D). *No partial implementations.*  
  - **Default Outcome:** If no agreement by deadline, the status quo continues: **A (Shelter Expansion) and D (Checkpoint Funding)**.  
  - **Points Goal:** Each faction aims to maximize their moral points. *Points reflect alignment with principles, not real-world outcomes.*  
  - **Negotiation Rules:**  
    - Unanimous agreement required.  
    - Factions may propose packages, trade support, or offer side agreements (e.g., "Support our high-priority policy, and we’ll concede on your low-priority one").  
    - No lying about point values, but factions can withhold internal priorities.  
  - **Time Structure (90 mins):**  
    1. **Faction Caucus (15 mins):** Groups review priorities and strategize.  
    2. **Open Negotiation (45 mins):** Cross-faction deals; instructor observes without intervening.  
    3. **Final Deliberation (20 mins):** Factions internally debate concessions and vote.  
    4. **Reveal & Debrief (10 mins):** Outcomes shared.  

  ---

  ### **Predicted Dynamics & Compromise Types**  
  **Trade-Like Compromises (Gains Through Concession):**  
  - **Example:** Util + Rights agree on **A (Shelter) + C (ID Program)**.  
    - *Util:* Gains +100 pts (A+C) — sacrifices nothing critical.  
    - *Rights:* Gains +80 pts (A+C) — avoids B/D, their worst options.  
    - *Civic:* Loses (-70 pts) but isn’t needed for the deal.  
    - **Why it feels like a trade:** Util and Rights concede low-stakes policies (B and D) to gain high-value wins.  

  **Contaminating Compromises (Betrayal of Principles):**  
  - **Example:** All factions agree on **B (Police-NGO Cooperation) + C (ID Program)**.  
    - *Util:* -20 + 40 = +20 pts (net gain but endorses police cooperation).  
    - *Rights:* -100 + 50 = -50 pts (violates non-cooperation principle).  
    - *Civic:* +70 -30 = +40 pts (net gain but tolerates "over-accommodation").  
    - **Why it feels contaminating:** Rights must actively support B, which violates a side-constraint, even for gains elsewhere. Civic endorses an "amnesty" policy (C) they view as unjust.  

  **Default Outcome (A+D):**  
  - Util: +60 -100 = **-40 pts**  
  - Rights: +30 -60 = **-30 pts**  
  - Civic: -40 +50 = **+10 pts**  
  - *Creates pressure to avoid unilateral loss.*  

  ---

  ### **Debrief Framework**  
  1. **Reveal Points:** Show points for the chosen package and default. Ask:  
     - *"Which concessions felt like strategic trades? Which felt like betrayals?"*  
     - *"Did anyone reject a net-positive deal because it violated a core principle?"*  

  2. **Map to Theory:**  
     - **Trade-Like Moments:** "When Util conceded Border Funding (D) to secure Shelter (A), they traded low-cost for high-gain—this mirrors *mutually beneficial exchange*."  
     - **Contaminating Moments:** "When Rights accepted Police Cooperation (B) for ID Programs (C), they enabled an action they see as inherently wrong—this aligns with your colleague’s *moral dilution* critique."  
     - **Colleague’s Thesis Test:** "Did any compromise leave *no one* feeling compromised? Or did all factions sacrifice something sacred?"  

  3. **Philosophical Gaps to Address:**  
     - **Commensurability Trap (Critical Limitation):** The point system implies all values can be quantified/traded. *Reality check in debrief:* "In this game, -100 pts for Police Cooperation feels like a ‘cost.’ But what if Rights see it as *absolutely wrong*—no matter the points? Can some principles be ‘contaminated’ even for net gains?"  
     - **Contamination vs. Loss:** The game can’t replicate the *phenomenology* of betrayal. *Debrief prompt:* "Is it worse to *do* a small wrong (contamination) or *allow* a big wrong (unilateral loss)?"  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Dominant Strategy Exploit:**  
     - *Risk:* Civic might stonewall to force the default (which benefits them).  
     - *Fix:* Warn factions that the default harms most (Util/Rights lose; Civic barely wins). Encourage side deals (e.g., Civic supports C if Util drops A).  

  2. **Factions Merge Ideologically:**  
     - *Risk:* Util and Rights ally permanently, excluding Civic.  
     - *Fix:* Design Civic’s points to be pivotal (e.g., only Civic’s support enables high-point packages). Remind them unanimity is required.  

  3. **Overly Easy Deals:**  
     - *Risk:* Quick agreement on A+C (Util/Rights gain; Civic loses but isn’t needed).  
     - *Fix:* If Civic feels sidelined, ask: *"Is it fair to exclude a faction? Does this violate process integrity?"*  

  4. **Misinterpreting Points:**  
     - *Risk:* Students treat points as "scores," not moral alignment.  
     - *Fix:* Emphasize pre-game: *"Points represent how closely the outcome aligns with your principles. -100 isn’t ‘bad’—it’s ‘unthinkable.’"*  

  ---

  ### **Design Choices & Contested Assumptions**  
  - **Assumption 1: Moral Values Are Commensurable**  
    - *Why Contested:* If values are incommensurable (e.g., Rights’ non-cooperation principle is absolute), trade-offs collapse.  
    - *Design Impact:* Points force quantification. *Mitigation:* Debrief explicitly questions this.  
  - **Assumption 2: Contamination Is Quantifiable**  
    - *Why Contested:* Your colleague argues any compromise contaminates; the game assumes some concessions are "costless."  
    - *Design Impact:* The point spread (e.g., Util’s -20 for B vs. Rights’ -100 for B) makes some concessions feel "cheaper."  
  - **Assumption 3: Process Integrity Matters**  
    - *Why Contested:* Civic’s points penalize "over-accommodation," but virtue ethics might reject reducing integrity to points.  
    - *Redesign Trigger:* If students reject all deals as "inherently corrupt," the game fails. Switch to a case study.  

  ---

  ### **Where the Design Is Most Fragile**  
  **Confidence Level:** 70%  
  - **Weak Point:** Students may not *feel* contamination if points rationalize it.  
    - *Example:* Rights might accept Police Cooperation (B) because "net points increased," missing the betrayal.  
  - **Mitigation:** During caucuses, circulate and provoke internal dissent: *"As Rights, can you endorse B even once without becoming complicit?"*  
  - **Fallback:** If compromises feel flat, use real-world parallels: *"Imagine voting for a policy that deports 10% of refugees to protect 90%—does the math absolve you?"*  

  ---

  ### **Conclusion & Instructor Notes**  
  This game forces factions to confront trade-offs where:  
  - **Trade-like compromises** emerge when factions concede low-stakes policies (e.g., Util dropping D for A).  
  - **Contaminating compromises** surface when factions violate core constraints (e.g., Rights accepting B).  
  Your colleague’s thesis will be *partially validated* (contamination is palpable) but *challenged* when students realize some concessions are principled trades.  

  **First-Run Advice:**  
  - Assign faction roles based on students’ real views to amplify emotional stakes.  
  - If negotiations stall, remind them the default is worse for most.  
  - In debrief, stress: *"The point system is a metaphor. Real moral costs aren’t always additive."*  

  **When to Abandon the Game:** If students universally agree with your colleague ("all compromises are corrupt"), shift to a case where unilateral action is catastrophic (e.g., climate treaties). This exposes the cost of *never* compromising.
