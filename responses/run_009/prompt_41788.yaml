  For the novelist, the gold will be in that divergence between legal logic and visceral human response. When the dairy manager sister defends standard practices by saying "the law permits this," but the humane officer retorts "but look at their eyes as we do it" - that's where philosophy meets the gut. The jury reaction thought experiment perfectly crystallizes this.

