  Okay, let me try to unpack this user's problem. They've been deep into decision theory since Overcoming Bias days, and now a friend has presented an argument that challenges updateless decision theory via the counterfactual mugging scenario. The user is clearly well-versed in the literature but stuck on this particular objection.

  The core issue is about whether updatelessness makes you vulnerable to random scammers claiming to be like Omega. The user wants to preserve updateless reasoning for cases like Parfit's Hitchhiker and transparent Newcomb's problem, but recognizes the force of the reductio where you'd pay every stranger with a tall tale.

  Hmm, the key steps in the argument are: (1) rational choice is policy-based (updateless), (2) in tails branch you can't verify heads outcome, (3) EV depends on credence in Omega's reliability, (4) from inside tails, Omega and a stranger are epistemically identical, (5) therefore updatelessness says pay anyone making such claims, (6) making you a perpetual mark.

  The user suspects the flaw is between (4) and (5), specifically an equivocation between "unverifiable in this branch" and "unverifiable period." That's insightful. In Omega scenarios, we have cross-temporal verification - you can confirm Omega's reliability by seeing it pay out when heads comes up later or in other instances. But for a random stranger, there's no such verification mechanism across branches or time.

  Ah, and the user's nightmare scenario is when scammers quote astronomical payoffs to override low credence - but this actually highlights why policy choice must be anchored in pre-flip knowledge. The pre-flip vantage includes evidence of Omega's track record and setup, which random strangers lack. The scammer's story isn't a credible policy option because there's no causal structure to support it.

  The user's emotional state seems... intellectually frantic? They're clinging to updatelessness as foundational ("not torching that") but terrified the reductio might hold. There's also this meta-layer: they want to resolve this cleanly without hand-waving, respecting the depth of the problem.

  What's unsaid but implied: they need a principled distinction between Omega and scammers that doesn't undermine updatelessness generally. And crucially, one that works even when payoffs are scaled to absurdity. The resolution must preserve the "clean mugging" aspect while blocking parasitic imitation.

  I think the answer lies in the fact that policy evaluation isn't just about arithmetic - it incorporates the genesis of the scenario. Omega's mechanism is part of the thought experiment's causal structure, whereas scammers are exogenous perturbations. But that needs to be formalized carefully...
answer: |-
  Your friend's argument is clever but contains a critical misstep between (4) and (5). The flaw is an **epistemic equivocation**: equating the *local* unverifiability of a specific branch outcome with the *global* unverifiability of the *agent's entire track record and causal structure*. This collapses the distinction between Omega and a random huckster, which updatelessness *does* preserve at the policy-selection stage. Here's the breakdown:

  ### The Rotten Step: Why (4) → (5) Fails
  1.  **Updatelessness Evaluates Policies, Not Local Claims:**
      *   When you adopt a policy ("Always pay when Omega asks"), you evaluate it *from the pre-flip perspective*. This perspective *includes* knowledge of Omega's verified track record and causal mechanism (e.g., its ability to predict, its consistent behavior in *both* branches across many trials).
      *   This pre-flip knowledge justifies a high *credence* that the Heads branch *does* exist and *will* pay out $1000 if you adopt the paying policy. The unverifiability *within the Tails branch* doesn't erase this pre-established, globally justified credence.

  2.  **The Stranger Lacks the Necessary Pre-Flip Credibility:**
      *   A random stranger making a claim *after* the coin flip offers *only* a local, branch-specific claim: "If you pay me $100 *now* (in this branch), I *would have* given you $10,000 in a branch you cannot observe."
      *   Crucially, **there is no pre-flip, globally accessible evidence supporting the stranger's reliability or causal mechanism.** You have no verified track record of the stranger:
          *   Successfully predicting your policy choice *in advance*.
          *   Creating a reliable causal mechanism linking your policy decision to a payout in the counterfactual branch.
          *   Actually delivering payouts in the Heads branch *to others* who adopted the paying policy.
      *   The stranger's claim is epistemically *isolated* to the branch where they ask for money. There's no cross-branch or pre-commitment evidence to justify high credence in their story.

  3.  **The "Numbers Game" (Your $10^20 Nightmare):**
      *   This *is* the same flaw, amplified. Updatelessness doesn't demand you accept *any arbitrary numbers* quoted locally.
      *   **Policy evaluation requires estimable probabilities.** The pre-flip perspective must assign a *credence* to the claim that the paying policy *actually causes* the high payout in the counterfactual branch.
      *   For Omega, this credence is high (e.g., 0.99+) based on prior evidence. For a stranger with an absurd $10^20 claim and *zero* supporting evidence (no prediction, no mechanism, no track record), your rationally justified pre-flip credence that their claim is true is *vanishingly low* (e.g., 10^-10 or lower).
      *   The expected value calculation for the "Pay Strangers" policy is: `EV = [Credence_True * ($10^20 - $100)] + [Credence_False * (-$100)]`. With near-zero credence, this EV is massively negative *even before the flip*, so the policy is correctly rejected *at the policy selection stage*. The astronomical number doesn't magically make a baseless claim credible.

  ### Why (4) *Looks* Fine (The Slide)
  The slide happens because (4) correctly states that *from within the Tails branch*, you lack *direct observational access* to the Heads branch outcome for *both* Omega and the stranger. This local unverifiability is symmetric. **However,** (5) incorrectly concludes this *local epistemic symmetry* implies *global symmetry in policy justification*. It ignores that the *justification for adopting the policy in the first place* relies on evidence *available before the branch is realized* – evidence Omega possesses and the stranger lacks.

  ### What You Pay to Cut It (The Cost of Clarity)
  1.  **Policy Selection Requires Anchoring in Pre-Observation Knowledge:** You must explicitly require that policy evaluation incorporates *only* knowledge available *before* the information partition (the coin flip outcome) occurs. This knowledge includes the *source* and *reliability* of the claims about counterfactual outcomes.
  2.  **Credences Must Be Globally Justified:** The probability assigned to the counterfactual outcome materializing *must be based on evidence accessible prior to the branch point*. A claim arising *only within* the branch where payment is demanded provides *no* such evidence. Its prior probability is determined by the agent's general priors about the world and the claimant's credibility, which for an unsupported stranger is low.
  3.  **"Clean Mugging" Isn't So Clean (Epistemically):** While there's no causal channel *through your decision*, there *is* a crucial *epistemic channel* established *before your decision* – Omega's demonstrated predictive power and reliability. The huckster lacks this pre-established epistemic link.

  ### Why Updatelessness Survives (And CDT Doesn't Save You)
  *   **Parfit's Hitchhiker/Transparent Newcomb:** Updatelessness still works. The pre-flip knowledge justifies the "Rescue/Pay/One-Box" policy *despite* the local temptation to defect *within* the relevant branch. The epistemic justification for the policy exists pre-observation.
  *   **Counterfactual Mugging (Omega):** Updatelessness prescribes paying *because* the pre-flip perspective justifies high credence in Omega's mechanism. Paying maximizes expected value under the rationally justified policy.
  *   **Counterfactual Mugging (Stranger):** Updatelessness prescribes *not paying*. The "Pay Strangers" policy has negative expected value *from the pre-flip perspective* due to the lack of justification for high credence in their claims. Adopting it would be irrational.
  *   **CDT's Failure:** CDT *also* tells you not to pay the stranger (correctly), but it *also* tells you not to pay *Omega* in the Tails branch! From within Tails, CDT sees paying $100 as causing a loss of $100, with no causal link to the $1000 (since that branch doesn't exist for you). CDT fails the original mugging, which is why updatelessness was needed. Your friend's "welcome back to CDT" is hollow – CDT doesn't solve the *original* problem.

  **In essence:** Updatelessness doesn't make you a mark because it evaluates policies based on *globally justified credences* anchored in *pre-observation knowledge*. The random huckster fails at the policy selection stage because they offer *no globally accessible evidence* to justify the high credence needed for their claimed policy to have positive EV. The $10^20 threat is neutralized by the rationally required near-zero credence, making the "Pay Strangers" policy disastrous *even before you meet your first scammer*. The flaw wasn't in updatelessness, but in temporarily forgetting that its policy evaluation is rigorously grounded in the pre-flip epistemic state.
