  ## The Chord Dispute: A Sestina on Bertrand

  The compass parts the page to trace the **circle**,
  A perfect bound. Now draw a random **chord**:
  Select two places where the line shall land,
  Two spots upon the rim, the **endpoints** pressed.
  The chance hangs on how near the center lies,
  The **midpoint**'s secret distance from the core.
  Within a smaller ring, concentric, tight,
  The **radius** half-sized, the key is found.
  If there it falls, the length exceeds the side;
  If not, the measure fails. Is this **random**?

  Now fix a spoke, a single measured **radius**,
  Extending straight out from the core. Then **random**
  Select a point along this chosen line.
  From there, erect the perpendicular **chord**.
  Its length depends on how far out you stand;
  Find where it cuts the spoke – that **midpoint** holds
  The truth. Is it within the inner **circle**,
  That scaled-down realm? If so, the side's outsped.
  The locus shifts, the odds now rearrange.
  Define the **endpoints**? No, this path demands
  A different start. The uniform command
  Applies here first along the radial band,
  Then down its length. The favorable **midpoint**
  Must dwell within a segment, not the disk.
  The inner **circle** whispers of the bound,
  But here the measure spreads across the **radius**,
  Not the whole plane. The method, seeming **random**,
  Yields its own count for where the longer **chord**
  Might lie. The **endpoints** drift, inferred, not free.

  Consider now the disk's whole breadth, the **circle**'s
  Filled space. Within its area, let **random**
  Choice pick a single point. Declare this **midpoint**
  Of the unknown **chord** passing through that place,
  Perpendicular to the **radius**
  That you might draw towards it. Now the case
  Is clear: the **endpoints** matter not, but where
  This central seed is sown. If deep inside
  The small **circle** (half the wide disk's span),
  The chord outstrips the side. The odds abide
  By simple area, vastness set aside.
  The count relies on where the **midpoint** sits
  Within the whole. The **endpoints** fade from view,
  The **radius** a tool, not the source of choice.
  Is this the essence of a **random chord**?
  The fractions shift, each method claims the **circle**.

  "This," cries my friend, "dissolves the **circle**'s trust,
  Or rather, reason's! How can one **random**
  Idea spawn three numbers? Where the **midpoint**
  Falls *should* define the **chord**, a single fact!
  Yet ignorance, distributed as light,
  Assigns three weights! The principle's delight
  In 'equal chance' becomes a hollow **radius**,
  A spinning wheel that points nowhere. **Endpoints**
  Or spokes or seeds – the core event's the same:
  A line drawn long. But logic bears the blame;
  The verdict cracks along its central **chord**.
  If 'no preference' lets such conflict bloom,
  Its throne is dust. It abdicates the room
  It claimed to fill. The paradox deploys
  Three answers for one question – noise destroys
  The edifice. Your 'scope' is just a void.
  This **random** chaos proves the method's flaw."

  "Not so," I counter. "See the words recur:
  **Circle**, **chord**, **endpoints**, **midpoint**, **radius**, **random**.
  The same six terms, yet shifted, speak anew
  In each arrangement. Context shapes the aim.
  The principle is silent, justly mute,
  Between distinct designs. There is no root
  Contradiction in the **midpoint**'s varied role,
  But in the question's skin: 'a **random chord**' –
  What spawns it? Picking **endpoints** on the rim?
  Or choosing first a sunbeam's fading limb,
  A **radius**, then where along its stream?
  Or scattering seeds where **circle** dreams?
  Each *is* a different act, a separate game,
  Yielding distinct results. The core event
  Is not the chord alone, but how it came
  To be. Assigning blame is misaimed;
  The phrase names no specific **random** source.
  The answers differ because questions do."

  We stalled right there. Was it the **chord** itself
  We sought to measure? Or the **random** act
  That conjured it? The **circle** held the stage,
  But backstage strife defined the futile age
  We spent. The **midpoint**'s realm, the **radius**,
  The scattered **endpoints** – which lens showed the true
  Depiction of the void, the unknown state?
  Which framing captured 'pure' **random**'s weight?
  We saw three doors marked 'Chance', behind each one
  A valid world where probabilities run
  Their lawful course. But which door *was* the quest?
  The **circle** stood serene, the **chord** the test,
  But *how* to wield the knife? Our minds possessed
  By different visions of the **random** quest,
  We talked past **endpoints**, lost within the feud.
  The **radius** of reason proved too slim;
  The **midpoint** of agreement, cold and grim.

  **Circle** of doubt! Ambiguous **chord**! The fight
  Was never *really* **random**, nor the math's slight.
  It lived within the **endpoints** of the phrase –
  **Midpoint** unstated – **radius** of gaze.
  Our **random** question lacked its generating light.

  ---

  **Notes on Mathematical Fidelity:**

  1.  **Stanza 1 (Endpoints):** "Two spots upon the rim" (uniform endpoints), "smaller ring... radius half-sized" (inner circle r/2). The favorable condition (midpoint within r/2) is stated, implicitly yielding 1/3.
  2.  **Stanza 2 (Radius):** "fix a spoke" (choose radius uniformly), "select a point along this chosen line" (uniform along radius), "erect the perpendicular chord", "where it cuts the spoke – that midpoint" (the chosen point *is* the midpoint), "within the inner circle" (favorable condition). "The locus shifts" & "uniform command applies here first along the radial band, then down its length" explicitly state the measure (uniform over radius, then uniform along each radial line). The favorable region is correctly described as "a segment, not the disk" (along each radius, a segment of length proportional to the chord-length condition), implicitly yielding 1/2.
  3.  **Stanza 3 (Midpoint):** "disk's whole breadth... area", "let random choice pick a single point" (uniform over disk area), "declare this midpoint", "if deep inside the small circle (half the wide disk's span)" (favorable condition: midpoint within r/2 circle). "The odds abide by simple area" explicitly states the measure and the probability calculation (area ratio (π(r/2)^2)/(πr^2) = 1/4).
  4.  **Core Criterion:** All three stanzas correctly identify the favorable region as the midpoint lying within the concentric circle of radius r/2.
  5.  **Debate Stanzas:** Accurately reflect the friend's argument (contradictory verdicts undermine indifference) and the narrator's counter (different procedures, not the same event; indifference doesn't apply *between* procedures). The impasse (stanza 6) correctly centers on the ambiguity of the initial question ("a random chord").
  6.  **Envoi:** Accurately concludes the ambiguity of the phrase "a random chord" was the core issue ("Our random question lacked its generating light").
