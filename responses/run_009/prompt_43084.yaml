prompt: |-
  My friend and I got into a massive argument last week about surge pricing. A storm hit, the rideshares doubled their fares, and she said that's just the price doing its job — moving the rides to whoever values them most — and that the alternative is a queue, which is worse. I kept saying there's something gross about it but couldn't say what without just sounding like I hate markets, and at some point she goes "fine, so would you ban it? what's your rule?" and I had literally nothing. That stung, because it turns out I'm on a committee where ruling on exactly this kind of thing is my job.

  Here's the situation: I'm the staff (non-faculty) member of a small college committee that decides whether the college will broker, host, or facilitate transactions people propose to us. We get roughly one a month and the proposals keep getting more creative. Real examples from the last couple years: a food delivery app wanting to price dynamically in the campus dining halls during exam week (so a burrito costs more at 2am during finals); a paid line-standing service where students pay other students to hold their spot in the queue for capped seminar registration; the administration floating the idea of letting a student pay to bump someone off the waitlist of an oversubscribed course; a pharma company paying students a fairly large sum to test a sleep drug over spring break; and a student group wanting to raffle a reserved commencement seat for charity. When something is obviously a kidney sale or an outright vote purchase we all know the answer, but almost nothing we actually get is that clear, and our meetings mostly consist of people saying "it feels off" at each other until someone moves to postpone.

  What I want is a real decision procedure the committee can run on any proposal in about twenty minutes during a meeting: the questions to ask, in order; what counts as enough of an answer to each one to move on; which answers end the process with a no; and where it has to stop and hand the thing to a straight vote because the remaining question is about values, not facts. Ground it in whatever philosophers have actually worked out about commodification and repugnant markets — the worries about desperation and bargaining power, about a market changing what a practice means even for people who don't participate, about things whose value gets corrupted by having a price put on them — but it has to be usable by people who've never read a word of it. And it has to handle the genuinely hard cases, not just the easy ones: cases where both parties are fully consenting and fine, where the price is transparent and nobody is deceived, and where the alternative to the market isn't some pure commercial-free status quo but something with its own problems — like queueing, which quietly favors students with the most free time. Then run the procedure on three of the proposals above: the exam-week burritos, the paid line-standing, and the waitlist bumping. I want you to be honest about where it gives an answer I won't like — I currently support the waitlist thing, so don't rig the procedure to let me off the hook. And last, tell me straight what the procedure can't do, especially where it will just launder our prejudices into official-sounding steps.

  Format: start with your bottom line in the first sentence, then the reasoning. No preamble, and don't restate my question back at me.
reasoning: |-
  Alright, let me unpack this user's problem. They're on a college committee that evaluates transactional proposals, struggling with ethical gray areas like surge pricing and paid queueing. Their friend challenged them to define clear rules, which exposed a gap in their decision-making process. 

  First, I recognize this isn't just about creating a flowchart—it's about reconciling market efficiency with human discomfort. The user needs a practical tool grounded in philosophy (commodification theory, Sandel's "What Money Can't Buy") but accessible to non-academics. The real challenge is handling "hard cases" where consent exists but ick factor persists, like waitlist bumping which they personally support.

  Hmm... The key tensions I see are:
  1) Preventing exploitation vs. allowing voluntary exchange
  2) Preserving social meanings (e.g. education as merit-based) 
  3) Acknowledging that non-market alternatives (queues) have biases too

  I'll structure the framework around three filters:
  - Coercion/desperation: Does it prey on vulnerable populations? (drawing from Satz's "Why Some Things Should Not Be for Sale")
  - Corruption of meaning: Could pricing alter how we value related goods? (e.g. turning diplomas into auction items)
  - Systemic harm: Does it create wider inequality or erode community norms? (Anderson's democratic equality principles)

  For the waitlist bumping example they support—honestly, it fails the second filter. Letting payments override waitlists commodifies educational access, potentially demoralizing students who can't pay. That might disappoint the user, but rigging the test would defeat the purpose.

  Notably, the procedure won't resolve debates about fundamental values (e.g. "Is merit always fair?"). When those emerge, the framework flags them for committee vote rather than pretending they're technical questions. And yes—it can absolutize cultural biases if applied mechanically. The raffle case (charity vs. privilege) specifically shows where "community values" must decide.

  ...Better include strong caveats about not mistaking this for neutral math. The "twenty minutes" constraint means some nuances get flattened, but that's the tradeoff for usability.
answer: |-
  Here is a 5-question decision procedure for your committee, grounded in ethical concerns about commodification and markets:

  **Bottom Line:** Use this sequential test: If a proposal fails Question 1, 2, or 3, reject it. If it passes these, answer Question 4; a "yes" means approve, a "no" triggers a vote. Question 5 defines the values debate for that vote.

  **The Decision Procedure:**

  1.  **Does this exploit acute desperation or severely unequal bargaining power?**
      *   *Ask:* Are one or more parties acting under urgent, unavoidable need (e.g., basic survival, critical healthcare, avoiding immediate academic failure) where refusing the transaction isn't a viable option?
      *   *Evidence Needed:* Nature of the good/service (essential vs. luxury), timing constraints, alternatives available to participants.
      *   *Fail & Reject If:* Yes. (e.g., Surge pricing for *essential* medicine transport; payday loans targeting students before tuition deadline).
      *   *Move On If:* No clear evidence of exploiting acute, unavoidable vulnerability.

  2.  **Does pricing fundamentally corrupt the core purpose or meaning of the good/service/context?**
      *   *Ask:* Would introducing payment actively undermine the primary social value, intrinsic meaning, or intended function of the thing being exchanged or the context it exists within? (e.g., Does pricing turn something sacred, deeply personal, or merit-based into a mere commodity?).
      *   *Evidence Needed:* The stated purpose of the good/service/context (e.g., education, fair access, community ritual), societal norms around it, potential for "crowding out" non-market values.
      *   *Fail & Reject If:* Yes. (e.g., Selling grades, selling votes, paying for friendship, selling human organs).
      *   *Move On If:* Pricing seems like a practical tool within the existing context without obviously destroying its core meaning.

  3.  **Does this create significant, unavoidable negative externalities harming non-participants or the community?**
      *   *Ask:* Will this transaction likely cause concrete harm to third parties (other students, faculty, community) or damage essential college functions/community norms, even if participants consent?
      *   *Evidence Needed:* Scale of participation, potential for exclusion, impact on fairness perceptions, disruption to core activities, precedent setting.
      *   *Fail & Reject If:* Yes, and harms are significant and likely unavoidable. (e.g., Widespread paid line-standing making queues effectively pay-to-win for *all* capped resources; pay-to-bump waitlists destroying perceived fairness of registration).
      *   *Move On If:* Harms seem minimal, speculative, or can be effectively mitigated.

  4.  **Is the proposed market mechanism clearly more efficient or fairer than feasible non-market alternatives?**
      *   *Ask:* Compared to realistic alternatives (queues, lotteries, admin allocation, first-come-first-served), does this market solution demonstrably: a) Allocate the scarce resource to those who value it most *and* b) Do so in a way that improves overall welfare or fairness?
      *   *Evidence Needed:* Analysis of the specific scarcity problem, flaws in current/alternative systems, transparency of pricing, potential for the market to incentivize better overall outcomes (e.g., bringing in more supply).
      *   *Approve If:* Yes, the market mechanism offers a clear, significant improvement in efficiency or fairness over alternatives.
      *   *Trigger Vote If:* No clear advantage, or advantages are offset by intangible losses (dignity, community feeling, symbolic harm) identified in previous steps. *This is the key values debate.*

  5.  **If triggered for a vote: Does permitting this transaction, despite passing the first three filters, erode a core value or norm essential to the college's mission or community?** (Framing for the Committee Vote)
      *   *This is the debate question when Q4 is "No".* Focus on the specific value conflict identified (e.g., "Does pay-to-bump undermine our commitment to academic opportunity based on merit/need, not wealth?" or "Does dynamic pricing for late-night food exploit student stress in a way incompatible with our support ethos?").

  **Applied to Examples (Applying Filters 1-4):**

  1.  **Exam-Week Burritos (Dynamic Pricing):**
      *   **Q1 (Exploitation):** Maybe. Exam stress creates vulnerability, but food is available elsewhere/earlier. Not *acute desperation* for *survival*. **Pass? (Debatable, but likely passes narrowly - food access isn't completely cut off).**
      *   **Q2 (Corruption):** Unlikely. Campus dining is already a commercial service. Paying more for convenience at peak times doesn't fundamentally corrupt the purpose of selling food. **Pass.**
      *   **Q3 (Externalities):** Possibly. Could normalize surge pricing for essential campus services, making basic needs harder to access affordably for low-income students during high-stress periods. Harm is plausible and significant. **Fail? (Likely Fail - potential for broad negative impact on affordability/equity during critical times).** **REJECT.**
      *   *(Q4 not reached)*

  2.  **Paid Line-Standing Service:**
      *   **Q1 (Exploitation):** Generally No. Standing in line is tedious, not an acute desperation point. Sellers are voluntarily offering time for money. **Pass.**
      *   **Q2 (Corruption):** **Yes.** It corrupts the purpose of a queue (first-come, first-served fairness based on time commitment/willingness to wait) by replacing time/willingness with money. It turns queue position into a commodity, undermining the inherent fairness the queue is meant to provide. **Fail.** **REJECT.**
      *   *(Q3/Q4 not reached)*

  3.  **Pay to Bump Waitlist:**
      *   **Q1 (Exploitation):** Unlikely. Being on a waitlist is frustrating, not an acute desperation point for most courses (barring specific graduation requirements - needs case-by-case). **Pass.**
      *   **Q2 (Corruption):** **Yes.** This fundamentally corrupts the purpose of a waitlist and course registration. Waitlists exist to manage scarcity based on factors like seniority, major requirement, time of registration (effort), or random lottery – systems aiming at *procedural fairness* or academic priority. Introducing payment replaces those principles with wealth, turning access to education (a core college good) into a commodity purchasable by the highest bidder. **Fail.** **REJECT.**
      *   *(Q3/Q4 not reached - but Q3 also strongly points to Fail due to externalities harming non-paying students' perception of fairness and access)*

  **What the Procedure Can't Do & Limitations:**

  1.  **Resolve Fundamental Value Conflicts:** It identifies *where* the value conflict lies (Q4/5), but doesn't dictate *how* the committee should weight competing values (efficiency vs. equality vs. tradition vs. symbolic meaning). The vote on Q5 is inherently subjective.
  2.  **Define "Corruption" or "Essential Norm" Objectively:** Judging whether a price "corrupts" meaning (Q2) or what constitutes a "core value" (Q5) relies on the committee's interpretation of the college's ethos and societal norms. This is vulnerable to cultural bias or disagreement.
  3.  **Perfectly Measure Exploitation or Harm:** Assessing "acute desperation" (Q1) or "significant externalities" (Q3) involves judgment calls about vulnerability and impact.
  4.  **Eliminate "Ick Factor":** While it forces articulation beyond gut feeling, the "ick" often stems from Q2 (corruption) or Q5 (values conflict). The procedure makes this explicit but doesn't magically resolve the discomfort.
  5.  **Prevent Laundering Prejudices:** A committee determined to approve/deny something can stretch definitions (e.g., downplaying "corruption" for something they like, exaggerating "exploitation" for something they dislike) within the Q2/Q3/Q5 judgments. Rigorous evidence requirements and diverse committee membership are essential checks.
  6.  **Handle Extreme Edge Cases Perfectly:** Truly novel proposals might strain the categories, requiring careful application of the principles behind the questions.
