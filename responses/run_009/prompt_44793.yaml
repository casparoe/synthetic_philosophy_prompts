answer: |-
  My dear fellow metaphysician,  

  Your unease about the handout’s presentation of Lewis’s counterpart theory is both understandable and philosophically astute. While the summary captures the broad contours of the debate, several points warrant clarification, as they risk misrepresenting Lewis’s nuanced position. Let me address your concerns systematically, auditing the handout’s claims against Lewis’s actual work, particularly *Counterpart Theory and Modal Logic* (1968) and *On the Plurality of Worlds* (1986).  

  **First, the accuracy of key claims:**  
  The handout correctly states that, for Lewis, no individual exists in more than one possible world—a rejection of transworld identity. It also rightly notes that Lewis analyzes *de re* modal claims (e.g., “Humphrey could have won the election”) via counterparts in other worlds who resemble him and satisfy the modal predicate. The requirement that worlds be *concrete* (spatiotemporally isolated maximal sums of entities) is indeed central to Lewis’s ontology. He explicitly rejects abstract worlds (e.g., propositions or stories) as inadequate for grounding modality, given his commitment to realism about *all* possible worlds as concrete entities. On these points, the handout is faithful.  

  **Simplifications requiring qualification:**  
  1.  **Uniqueness of Counterparts:** The claim that “each person has exactly one counterpart in each world” is an oversimplification. Lewis explicitly allows for *multiple* counterparts in a single world. His criterion is *similarity in relevant respects*, and he acknowledges that similarity is context-dependent and may yield ties. In *Plurality*, he states that counterpart relations are determined by a “weighted similarity” metric, which can vary across contexts. Thus, while we might *stipulate* uniqueness for simplicity (e.g., in formal semantics), it is not a necessary feature of the theory.  
  2.  **Modal Statements “Strictly Speaking About Someone Else”:** This is the handout’s most misleading assertion. Lewis does *not* hold that when we say “Humphrey might have won,” we are speaking (even strictly) *about* his counterpart. Rather, the statement remains *about Humphrey*—it is a claim concerning *his* modal properties, *analyzed in terms of* counterparts. As Lewis clarifies, counterpart theory provides truth conditions for *de re* modal claims *about Humphrey himself*. The counterpart relation is a tool to ground *his* possibilities, not a substitution of reference. To say “Humphrey could have won” is true iff, at some world, a counterpart of Humphrey wins. Humphrey himself is the subject; the counterpart’s actions fix *his* modal profile. The handout’s phrasing risks conflating semantic reference with metaphysical grounding.  
  3.  **Kripke’s Humphrey Objection and Lewis’s “Concession”:** Kripke’s remark—that Humphrey would care about *himself* winning, not a mere counterpart—is presented as settling the debate, with Lewis conceding. This overstates the case. While Lewis acknowledges the objection’s rhetorical force, he does not abandon counterpart theory. In *Plurality*, he argues that Kripke’s intuition conflates *epistemic* vividness (caring about a counterpart described qualitatively) with *metaphysical* identity. Lewis insists that, given his metaphysics, there *is no* transworld Humphrey; thus, caring about one’s possibilities *just is* caring about counterparts. He refines the theory (e.g., allowing counterpart relations to vary by context) but never concedes defeat.  

  **Genuine Misrepresentations:**  
  The claim that counterpart theory *requires* concrete worlds is not a misrepresentation *of Lewis*, but it is inaccurate as a general claim about counterpart-theoretic *approaches*. Lewis’s specific version relies on concrete realism, but one could adopt counterpart semantics within an *abstract* conception of worlds (e.g., as sets of propositions). For instance, a modal realist might reject Lewis’s ontology but retain counterpart relations to solve transworld identity puzzles. Lewis himself would dismiss such a hybrid as inadequately grounded, but the logical point stands: counterpart relations *could* be deployed abstractly. The handout’s phrasing implies a necessary link that is doctrinal for Lewis but not inherent to the formal structure.  

  **The Professor’s Conclusion on De Re Modality:**  
  The conclusion—that counterpart theory reduces *de re* modality to qualitative resemblance between distinct individuals, thereby failing to capture its “distinctive” character—follows *if* one accepts two premises: (1) that *de re* modality *must* involve strict transworld identity (a la Kripke), and (2) that resemblance relations are merely qualitative. Lewis, however, rejects both. For him, *de re* modality *is* fundamentally about counterpart relations grounded in qualitative similarity; there is no deeper “non-qualitative haecceitistic” fact to capture. Kripke’s intuition, while compelling, presupposes transworld identity, which Lewis denies. Thus, the professor’s critique is valid *from a transworld identity perspective* but question-begging against Lewis. Lewis would argue that counterpart theory *does* capture genuine *de re* modality—it just offers a different, reductionist account of what that modality consists in.  

  In sum, your instinct is correct: the handout risks portraying Lewis as claiming that modal talk is “disguised” reference to counterparts, whereas he is offering a metaphysical *analysis* of modal properties *of the original individual*. The uniqueness claim is overstated, and while Lewis’s concrete worlds are non-negotiable for *his* system, counterpart semantics need not entail concretism. The professor’s conclusion holds only if one already rejects Lewis’s reductionist project. Your skepticism reflects a careful reading—Lewis’s theory is subtler than the handout suggests, and its virtues (e.g., solving transworld identification) remain robust against simplistic dismissals. Keep auditing with that keen eye; metaphysics thrives on such scrutiny.  

  Yours in pursuit of modal truth,  
  A Fellow Traveler in Logical Space
