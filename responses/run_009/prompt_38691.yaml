prompt: |-
  here's a thought experiment I want a number on. Douglas Hofstadter has this thing called the careenium: a giant frictionless pool table with zillions of tiny marbles ("simms") bouncing around for ever. every so often some simms stick together in stable clumps — "simmballs" — and the trick is that the simmballs end up symbolizing things: one clump acts as a symbol for food, another for a predator, etc. and once you look at it at the simmball level it really seems like the symbols are running the show: the "food" simmball gets chased, the "predator" one gets avoided, hole little dramas play out that make no sense if you only track individual marbles. Hofstadter's question was basically who shoves whom around in there — do the symbols push the substrate around, or is the symbolic level just a compressed way of describing what the marbles were going to do anyway?

  so, the proposition: in the careenium, simmball-level states are genuine causes of the marbles' trajectories — its literally true that the food-symbol moved left because it was being chased, not merely true-by-shorthand. give me your credence on that, and decompose it. terms I have in mind (add or swap whatever you think belongs): (a) probability that causation is level-relative, i.e. that some causal facts are best stated at a higher level even when a complete lower-level description exists; (b) probability that the simmball description is actually robust rather than a lucky coincidence of this one marble-trajectory, i.e. that it would survive nearby perturbations of the simms; (c) probability that this is just a verbal dispute about the word "cause" with no fact of the matter behind it. one line of justification per term, then the combination. for calibration: I'm at about 0.6, my friend is at 0.15 ("it's marbles all the way down, the rest is us being pattern-happy"). tell me where our disagreement most likely lives, which single term moves your final number the most, and what argument or evidence would actually shift it.
