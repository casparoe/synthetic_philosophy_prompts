  First I need to map the core contrastivism framework: van Fraassen's insight that explanations always have implicit "rather than" comparisons. Lipton's development of this helps us see how Pomeranz's argument works - his foil isn't Europe but specifically England vs Yangzi Delta circa 1750-1800. That's why coal and colonies become decisive. Whereas older scholars like Landes implicitly contrasted Europe vs China across centuries, making culture seem explanatory. 

  The real cleverness comes in the foil-shifting exercises. When we contrast Britain with its own 1700 self, industrialization looks inevitable - but that's circular! And comparing Yangzi to Po Valley shows how regional differences within Europe/China complicate things. This reveals the foil-dependence beautifully.

  But the user's pushing further - can contrastivism actually resolve disputes or just redescribe them? That's the knife edge. The theory brilliantly exposes why Needham's science question (why not China?) differs from economists' industrialization question (why England first?), but offers no criteria for "correct" foils. It makes the historians' disagreement look substantive yet partially verbal - they're answering different questions. 

  The literature accidentally vindicates contrastivism by demonstrating how foil choices drive explanations, but also exposes its core weakness. Like showing someone a microscope but no slides - great tool, but useless without specimens. The unanswered meta-question is: what makes one contrast class more valid than another? Maybe that's where historians' empirical work comes in, but philosophy hasn't caught up.

  This case study proves contrastivism's descriptive power but also its normative emptiness. The user's closing challenge about the "fatal gap" is spot-on - the theory illuminates the debate's structure but can't settle it. That tension between descriptive accuracy and prescriptive weakness is where the real philosophical interest lies.
answer: |-
  The Great Divergence debate offers a powerful case study for contrastive explanation theory, revealing how implicit "foils" shape explanatory frameworks and disagreements. Here’s how the historiography maps onto van Fraassen/Lipton’s model, its limitations, and what the controversy reveals about contrastivism:

  ---

  ### **Contrastive Explanation Applied to the Great Divergence**
  #### **1. Foil-Dependency in Historiographical Disagreements**
  - **Traditional Eurocentric Foil (Landes, Jones):**  
    - **Question:** "Why did *Europe* industrialize *rather than China*?"  
    - **Foil:** China as a monolithic, "stagnant" civilization.  
    - **Explanation:** Deep-rooted factors (Protestant work ethic, property rights, scientific revolution).  
    - *Effect:* Makes divergence appear inevitable and early (e.g., post-Renaissance).  

  - **Pomeranz’s Revisionist Foil (California School):**  
    - **Question:** "Why did *England* industrialize *c. 1800* rather than the *Yangzi Delta*?"  
    - **Foil:** Yangzi Delta (as a comparable core region) at the same temporal threshold (1750–1800).  
    - **Explanation:** Contingent factors (British coal proximity, New World resources/land, colonial exploitation).  
    - *Effect:* Divergence appears late, contingent, and ecologically determined.  

  #### **2. Shifting Foils, Shifting Explanations**
  - **"Britain vs. Britain-in-1700" Foil:**  
    - **Question:** "Why did Britain industrialize *after 1700* rather than *before*?"  
    - **Explanation:** Highlights *endogenous* changes (e.g., institutional innovations, agricultural productivity).  
    - *Effect:* Downplays global factors (coal/colonies become facilitators, not causes).  

  - **"Yangzi Delta vs. Po Valley" Foil:**  
    - **Question:** "Why did the Yangzi Delta *not* diverge *like the Po Valley* (N. Italy)?"  
    - **Explanation:** Regional dynamics (state fiscal policies, resource access, warfare patterns).  
    - *Effect:* Challenges "China vs. Europe" binaries, revealing intra-regional diversity.  

  ---

  ### **Where Contrastivism Reaches Its Limits**
  #### **1. The Foil Selection Problem**  
  - **No Principled Criterion:** Contrastivism *describes* how foils shape explanations but offers no method to determine which foil is "correct." Historians’ foil choices reflect *normative priorities* (e.g., Pomeranz’s focus on comparable cores vs. Needham’s civilizational contrast).  
  - **Dispute Redescription vs. Adjudication:** The theory recasts the debate as a clash of implicit questions ("Why P rather than Q₁?" vs. "Why P rather than Q₂?"), but cannot resolve which Q is *historically significant*.  

  #### **2. Substantive or Verbal Disagreement?**  
  - **Partly Verbal:** Disputes often arise from unstated foils (e.g., "divergence" means industrialization to economists but scientific revolution to Needham).  
  - **Substantive Core:** Even with clarified foils, disagreements persist (e.g., whether coal was *necessary* for English takeoff). Contrastivism exposes this but cannot settle it.  

  #### **3. Multiple "Divergences," Multiple Foils**  
  - **Needham’s Question (Science):**  
    - Foil: "Why modern science in Europe *rather than China*?"  
    - Explanation: Cultural/ideological factors (e.g., absence of Chinese "Baconian moment").  
  - **Economists’ Question (Industrialization):**  
    - Foil: "Why sustained growth in England *c. 1800* rather than *other advanced regions*?"  
    - Explanation: Capital accumulation, factor prices, institutional incentives.  
    ***→ "The" Great Divergence is not one question*** but a bundle of contrastive queries requiring distinct foils.  

  ---

  ### **Does the Literature Vindicate or Undermine Contrastivism?**
  #### **Vindication:**  
  - Historians implicitly use contrastive framing (e.g., Pomeranz’s focus on "core regions" reshapes the foil from civilizational to spatial-temporal).  
  - Shifting foils *explain* paradigm changes: The "California School" succeeds by reframing the foil (Yangzi vs. England), forcing new evidence (e.g., wage data, ecological constraints).  

  #### **Fatal Gap Exposed:**  
  - **Silence on Foil Legitimacy:** Contrastivism cannot address why Pomeranz’s regional foil is *more valid* than Needham’s civilizational foil. Historians appeal to empirical adequacy (e.g., comparable GDP/capita), but contrastivism lacks tools to evaluate this.  
  - **Risk of Relativism:** If *any* foil generates an explanation, the theory cannot distinguish robust from arbitrary contrasts (e.g., "Why England rather than Mars?").  

  ---

  ### **Conclusion: Contrastivism as Diagnostic Tool, Not Arbiter**
  The Great Divergence debate confirms contrastivism’s core insight: **explanations are foil-relative**. It excels at diagnosing historiographical disagreements as clashes over implicit contrast classes and reveals why "why?" questions are underspecified. However, it falters by offering no criteria to justify *which foil* best captures historical significance. The controversy thus exposes contrastivism as a powerful *descriptive* framework for understanding explanatory disputes but a limited *prescriptive* tool for resolving them. Historians must still grapple with empirical evidence and normative judgments about salient comparisons—precisely where philosophy leaves off and historical practice begins.
