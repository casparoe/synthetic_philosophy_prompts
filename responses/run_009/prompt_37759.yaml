prompt: |-
  I write a small pop-philosophy newsletter (few hundred readers, mostly not philosophers) and the next issue is on the repugnant conclusion and population ethics generally. I want you to build me a "which population ethics view do you actually hold?" quiz. Roughly 8-10 questions, each one a concrete case with two or three answer options, phrased so a reader with zero background can answer it — no jargon, and no question that just asks "do you think total welfare is what matters?" because that's testing labels, not views. The cases should be things like: a smaller world of very happy people versus a vastly larger world where everyone's life is barely worth living and which is better; whether adding extra happy people to a world, without touching anyone already there, can make it worse; the case where avoiding a smaller amount of suffering for existing people requires creating lots of new lives each with mild suffering; and a non-identity-flavoured case where a policy decision changes which people will exist at all, so you can't point to anyone it harms. I want the numbers kept small and imaginable (two planets, ten billion people, that sort of thing), not abstract set notation, and if you need truly astronomical numbers to make a case bite, say so rather than sneaking them in.

  Then a scoring key mapping answer patterns onto the positions: total utilitarianism, the average view, critical-level views, person-affecting views, and the procreation asymmetry as its own leaf if the cases can actually seperate it from plain person-affecting views — if they can't, flag that instead of pretending they can. Add anything else you think belongs as a leaf (variable value views, lexical thresholds, the "our intuitions here are just broken and no theory is right" option), but the leaves I listed must appear. Also point out answer combinations that no serious philosopher actually defends, and say for each whether that's because the combo is incoherent or just unexplored.

  One more thing: if you think the whole exercise is doomed because people's judgements on these cases flip depending on framing, or because the cases are too unnatural for anyone to have stable intuitions about them, tell me that straight instead of cheerfully building the quiz anyway — I'd rather find out now than after it goes out. Please write in British English (wellbeing, behaviour, that sort of thing).
reasoning: |-
  Okay, the user wants a quiz on population ethics for their pop-philosophy newsletter. Let me start by understanding their requirements. They need 8-10 concrete scenarios without jargon, using small, imaginable numbers. The quiz should help readers discover which population ethics view they align with, like total utilitarianism, average view, critical-level, person-affecting, or procreation asymmetry. They also want scoring that flags incoherent combinations and mentions if any views can't be separated.

  First, I need to ensure the cases cover key dilemmas. The repugnant conclusion is essential—small happy population vs. huge barely worth living one. Then adding happy people without affecting current: does that improve the world? The suffering avoidance case where creating new people with mild suffering prevents existing suffering. Non-identity problem: policy changes who exists without harming individuals. Also, cases to distinguish procreation asymmetry from person-affecting views.

  I should avoid abstract numbers. Use planets, populations like 10 billion. If astronomical numbers are needed, mention it explicitly. Each question needs 2-3 answer options. Phrasing should be neutral, avoiding leading questions. 

  Check if procreation asymmetry can be separated. The asymmetry suggests adding happy people isn't good but preventing suffering is a duty. Need a question where creating happy people is neutral vs. preventing suffering is obligatory. Question 3 could test this: creating happy people doesn't improve the world, but preventing suffering is a duty despite creating mild suffering.

  Framing issues could be a problem. People's intuitions might flip based on how questions are presented. I should note that in the caveats. Also, some cases are hypothetical and might not elicit stable intuitions. Highlighting that upfront is important.

  Scoring: Map answers to positions. Total utilitarianism: always maximize total wellbeing. Average: maximize average. Critical-level: additions must exceed a threshold. Person-affecting: only existing people matter. Procreation asymmetry: asymmetry between creating good and bad lives. Also include lexical thresholds and the "no theory fits" option.

  Incoherent combinations: For example, saying adding happy people doesn't improve (asymmetry) but also saying adding unhappy people isn't bad (contradicts asymmetry). Or total utilitarianism in some cases but rejecting repugnant conclusion. Need to flag those as inconsistent.

  Structure each question with a scenario and options. For scoring, assign points to each option. After collecting answers, tally points for each view. Highest score indicates the view. Mention combinations that don't match any view or are contradictory.

  Finally, include caveats about the instability of intuitions and the unnaturalness of the scenarios. Emphasize that this is a simplification. Use British English terms like "wellbeing" and "behaviour".
answer: |-
  Here's a population ethics intuition quiz designed for your newsletter readers. It focuses on concrete, imaginable cases without jargon or abstract numbers. I've included a strong caveat about the instability of intuitions upfront.

  **Important Caveat:** Population ethics scenarios often feel deeply unnatural. Our intuitions evolved for small-group decisions, not cosmic choices about potential lives. Philosophers find their own judgements can flip based on subtle framing! This quiz gives a *rough snapshot* of your leanings *today*, not final truth. Treat it as a conversation starter, not a diagnosis.

  **The Quiz: Which Population Ethics View Fits Your Gut? (Choose A, B, or C for each)**

  1.  **The Quiet Planet vs. The Bustling Planet:**
      *   Planet A: 1 billion people, all living extremely fulfilling, happy, long lives (e.g., thriving artists, scientists, families).
      *   Planet B: 10 billion people, all living lives that are consistently just barely worth living – no great joy or pain, just monotonous satisfaction (e.g., simple routine work, basic comforts, little ambition).
      *   Assuming you *must* choose one planet to exist, which is better?
          *   A) Planet A (The billion thriving lives).
          *   B) Planet B (The ten billion barely-satisfied lives).
          *   C) They seem equally good, or it's impossible to say.

  2.  **Adding Happy Immigrants:**
      *   Imagine Earth has 8 billion happy people. A spaceship arrives with 100 million *additional* people. They will live equally happy lives on a new, pristine continent, using resources nobody else needed. Their arrival doesn't change the wellbeing of the original 8 billion in any way (positive or negative). Is the world with 8.1 billion happy people...
          *   A) Better than the world with just 8 billion?
          *   B) Worse than the world with just 8 billion?
          *   C) Neither better nor worse? (Just different).

  3.  **Preventing Suffering vs. Creating Sufferers:**
      *   A terrible disease causes intense suffering for 100,000 existing people. We can develop a cure, BUT the *only* way to fund it requires creating 1 million new people. These 1 million new people will have lives that are mostly good, but *every one* will experience a moderate, incurable, lifelong ache (annoying but not disabling). If we *don't* create them, we can't cure the 100,000. Should we...
          *   A) Create the 1 million and cure the 100,000? (Prevent intense suffering now, even with new mild suffering).
          *   B) Refuse to create the 1 million and leave the 100,000 suffering? (Avoid creating lives with mild suffering).
          *   C) This choice feels deeply wrong either way; it's a horrible dilemma with no good answer.

  4.  **The Safe Playground vs. The Risky Playground (Non-Identity Case):**
      *   A town must choose between two playground designs for future generations:
          *   Design Safe: Built with known, safe materials. Children playing here will have happy lives (like most people today).
          *   Design Risky: Uses a cheaper, slightly toxic material. Children playing here *inhale dust* that *slightly* lowers their lifelong wellbeing (e.g., mild chronic fatigue), BUT crucially, the choice of design *also* subtly influences *which couples meet and have children*. The children born under Design Risky are entirely *different people* from those born under Design Safe. No child exists under both options. Which design should the town pick?
              *   A) Design Safe (Better lives for the children who *will* exist).
              *   B) Design Risky (The children who exist under Risky still have lives worth living; it's cheaper, so use the savings elsewhere).
              *   C) It shouldn't matter; neither choice harms anyone who would otherwise have existed.

  5.  **Adding Unhappy Immigrants:**
      *   Imagine Earth has 8 billion happy people. A spaceship arrives with 100 million *additional* people. They will live on a new continent. However, their lives will be *miserable* (constant pain, deprivation). Their arrival doesn't affect the original 8 billion. Is the world with 8.1 billion people (8b happy, 100m miserable)...
          *   A) Worse than the world with just 8 billion happy people?
          *   B) Better than the world with just 8 billion happy people? (Unlikely, but included for completeness)
          *   C) Neither better nor worse? (Just different; the misery is bad for *them*, but adding them doesn't change the "world's value").

  6.  **Quality vs. Quantity Tipping Point:**
      *   Imagine two possible futures for humanity:
          *   Future X: 5 billion people, average wellbeing very high (like the best societies today).
          *   Future Y: 20 billion people, average wellbeing significantly lower than X, but still *clearly* good and worth living (e.g., secure but busy and stressful lives for most).
      *   Which future is preferable?
          *   A) Future X (Higher average wellbeing).
          *   B) Future Y (More total wellbeing).
          *   C) Neither is clearly better; it depends on *how much* lower the average is in Y.

  7.  **The Unnecessary Happy Person:**
      *   A couple is deciding whether to have a child. They know this child would be very happy and have a great life. However, the child's existence would provide *no practical benefit* to anyone else (existing people or other potential people). They have no strong personal desire *for or against* having a child. Is having this child...
          *   A) A good thing? (Adding a happy life).
          *   B) A neutral thing? (Neither good nor bad).
          *   C) Morally problematic? (Even if happy, creating needless life is strange/unwise).

  8.  **Avoiding the Miserable Child:**
      *   The same couple knows that if they conceive a child *next month*, due to a temporary genetic condition, that child would have a life of constant, unbearable suffering. If they wait 3 months to conceive, the condition passes, and they can have a happy child. Is conceiving the miserable child next month...
          *   A) A very bad thing? (Creating suffering).
          *   B) A neutral thing? (You haven't harmed anyone; that specific miserable child wouldn't exist otherwise).
          *   C) A bad thing, but *less* bad than making an existing person suffer that much?

  **Scoring Key:**

  Tally your answers. The view with the *highest* score is your closest match. **Crucially, some combinations are contradictory or unexplored - see the notes!**

  *   **Total Utilitarianism (TU):** Focuses on *maximising total wellbeing*. Adding wellbeing is good, subtracting is bad, regardless of who experiences it.
      *   Q1: B
      *   Q2: A
      *   Q3: A
      *   Q4: A
      *   Q5: A
      *   Q6: B
      *   Q7: A
      *   Q8: A
  *   **Averagism (Avg):** Focuses on *maximising average wellbeing* per person. More people only better if they raise the average.
      *   Q1: A
      *   Q2: B (if you think they slightly lower the average) OR C (if you think average unchanged) - *Count either B or C*
      *   Q3: B (Creating lowers lowers average), OR A (Curing raises average more?) - *Ambiguous, but likely B*
      *   Q4: A
      *   Q5: A
      *   Q6: A
      *   Q7: B (Neutral wrt average) OR C (Could lower average if resources finite) - *Ambiguous, but likely B/C*
      *   Q8: A
  *   **Critical-Level Utilitarianism (CL):** Adds value only if a life's wellbeing exceeds a 'critical level' above 'barely worth living'. Total *above-critical* wellbeing matters.
      *   Q1: A (If Planet B is near the critical level, its total above-critical might be less than Planet A's)
      *   Q2: A (Assuming immigrants above critical level)
      *   Q3: A (Cure intense suffering > Create lives above critical with mild ache)
      *   Q4: A
      *   Q5: A
      *   Q6: A or C (Depends if Future Y average is above/below critical)
      *   Q7: A (If above critical)
      *   Q8: A
  *   **Person-Affecting View (PA):** Only the wellbeing of *actual people* (existing or future-but-inevitable) matters. We have no duty to create happy people; only duties not to harm future people or to benefit existing ones.
      *   Q1: A or C (No *people* on B are made better off by choosing B)
      *   Q2: C (Adding people doesn't affect existing people)
      *   Q3: A (Curing *existing* people's suffering is vital) OR B (Creating *new* sufferers is bad) - *Ambiguous core conflict!*
      *   Q4: C (No future person is made worse off than *they* would have been; different people exist)
      *   Q5: A (Creating miserable people *harms them*)
      *   Q6: A or C (Focuses on quality for the people who *will* exist)
      *   Q7: B (No duty to create happy lives)
      *   Q8: A (Creating a miserable person *harms that person*)
  *   **Procreation Asymmetry (Asym):** A specific refinement of Person-Affecting views. Creating happy people is *neutral* (not good), but creating unhappy people is *bad*. Preventing suffering (for existing or potential beings) is strongly obligatory.
      *   Q1: A or C
      *   Q2: C (Adding happy people = neutral)
      *   Q3: A (Preventing existing suffering *must* be done, even if it entails creating new beings with *mild* suffering. But note: Creating *intense* suffering to prevent mild might be different! This tests the boundary.)
      *   Q4: C (No harm to specific individuals)
      *   Q5: A (Creating unhappy people = bad)
      *   Q6: A or C
      *   Q7: B (Neutral)
      *   Q8: A (Bad to create miserable person)
  *   **Lexical Threshold / Variable Value (Lex):** Believes wellbeing gains matter more at higher levels. A small gain for a very well-off person might be vastly more valuable than a large gain for a barely-satisfied person. Rejects the Repugnant Conclusion absolutely.
      *   Q1: A (Planet B lives are below the threshold of 'real value')
      *   Q2: A (Assuming immigrants above threshold)
      *   Q3: A (Curing intense suffering >> Creating mild suffering)
      *   Q4: A
      *   Q5: A
      *   Q6: A (Future X lives higher on the 'value scale')
      *   Q7: A (If above threshold)
      *   Q8: A
  *   **Intuitions Are Broken / No Coherent Theory (NCT):** Thinks the whole framework is flawed or the cases are too weird for consistent answers.
      *   Q1: C
      *   Q2: C
      *   Q3: C
      *   Q4: C
      *   Q5: C
      *   Q6: C
      *   Q7: C
      *   Q8: C (or perhaps A, acknowledging the badness but doubting the framework elsewhere)

  **Notes on Contradictions & Ambiguities:**

  1.  **Person-Affecting vs. Procreation Asymmetry Separation:** Q3 is designed to test this. Choosing **A** strongly leans towards Asymmetry (duty to prevent suffering overrides avoiding creating *mild* sufferers). Choosing **B** is more classic PA (avoid creating sufferers is paramount). Q2 (C) and Q7 (B) are core Asymmetry. **Important:** Asymmetry is *not* cleanly separable from all PA views; it's a specific type. The quiz can indicate a *lean*.
  2.  **Incoherent Combinations:**
      *   **Q2 = A AND Q7 = B/C:** Believes adding happy people *improves* the world, but adding a specific happy person is *neutral or bad*. This suggests inconsistency about the value of creating happy lives.
      *   **Q5 = C AND Q8 = A:** Believes adding miserable people is *neutral*, but creating a specific miserable child is *bad*. Inconsistent about the disvalue of creating suffering.
      *   **Q1 = B AND Q6 = A:** Embraces the Repugnant Conclusion (Q1-B) but rejects a milder version of it (Q6-A). Needs reflection on consistency.
      *   **Strong TU Profile BUT Q1 = A:** Rejects the core Repugnant Conclusion while accepting other TU tenets. This is common! (Most people do). It highlights the tension TU faces.
  3.  **Unexplored Combinations:** Many answer patterns won't perfectly fit one column. This is normal! Population ethics is messy. The scoring identifies dominant leanings. Combinations heavy on **C** answers lean towards **NCT** or **PA/Asym**.
  4.  **Averagism Ambiguity:** Averagism struggles with Q2, Q3, Q7, as it's unclear how adding people affects the average unless specified. This reflects a real weakness in the view.
  5.  **Non-Identity (Q4):** Answering **C** is the classic response highlighting the non-identity problem, central to **PA/Asym** and **NCT**. Answering **A** aligns with **TU, CL, Avg, Lex** who think we *can* compare worlds with different populations.

  **Recommendation for Newsletter:** Present the quiz, then discuss the results and the inherent difficulties. Emphasise the caveat about unstable intuitions. Explain the Repugnant Conclusion (Q1) is the central puzzle driving the field. Briefly outline each view from the scoring key. Highlight that most people find *some* cases deeply counterintuitive for *any* theory – that's why it's philosophy! You could mention the contradictions section to show how tricky it is to be consistent.

  This design meets your specs: concrete cases, small numbers, no jargon, key positions covered (including flagging asymmetry separation difficulty and contradictions), and the crucial caveat about intuition instability included upfront. Good luck with the issue!
