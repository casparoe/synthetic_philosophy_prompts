answer: |-
  Here’s a prioritized list of **4 core questions** for your agenda, ranked by dependency and foundational impact. The ordering hinges on *which unresolved issues could invalidate entire research branches* if answered negatively. I’ll defend the ranking, flag tractability, and note triggers for re-prioritization. Crucially, I’ve deprioritized two of your candidates (with explanation).

  ---

  ### **Priority Ranking & Rationale**  
  **Core Principle:** Focus on *make-or-break assumptions* that, if false, collapse the case for debate as a viable oversight path.  
  **Tractability Filter:** All selected questions are addressable via formal modeling, game theory, and philosophy (no experiments needed).

  1. **How to state the success condition: Truth-tracking vs. lie-detection**  
     - **Why upstream?** Every oversight mechanism implicitly assumes a success metric. Conflating "catch lies" with "get to truth" invalidates most formal work:  
       - If success is *only* lie-detection, you incentivize evasive half-truths (e.g., "technically correct" but misleading statements).  
       - If it’s truth-tracking, you need guarantees that "winning debate" correlates with truth *even when both debaters are biased*.  
       - **Dependency:** All debate/amplification proposals (e.g., agent foundations, recursive reward modeling) bake in one of these. Getting this wrong makes 2 years of work irrelevant.  
     - **Tractability:** High. Analyze existing formalisms (e.g., probabilistic reasoning, modal logic) for hidden assumptions.  
     - **Reprioritize if:** Empirical work shows AIs systematically exploit lie-detection (bump up); or a consensus emerges that "truth" is ill-defined for oversight (bump down).  

  2. **Does self-play buy unexploitability *without* truth-tracking?**  
     - **Why upstream?** Debate’s core promise is that self-play forces honesty. But if unexploitability ≠ truth-tracking, the entire mechanism fails:  
       - Example: Debaters could collude on *plausible* false answers (e.g., conspiracy theories) that fool judges but "win" under game rules.  
       - **Dependency:** Asymmetry (your #2) and non-zero-sum (#3) become irrelevant if self-play doesn’t track truth.  
     - **Tractability:** High. Use game-theoretic models (e.g., simulating Nash equilibria in debate games with bounded rational agents).  
     - **Reprioritize if:** New theoretical results prove unexploitability implies truth-tracking in debate (bump down); or if misalignment evidence shows collusion is likely (bump up).  

  3. **The obfuscated-arguments problem: Fundamental or artifact?**  
     - **Why now?** Even if debate *could* track truth, obfuscation may make it unscalable:  
       - If obfuscation is fundamental (e.g., some truths *require* superhumanly complex arguments), debate fails for high-stakes questions.  
       - If it’s an artifact, solutions might exist (e.g., iterative debate, trusted tools).  
       - **Dependency:** This questions whether debate *scales* to superhuman AI. Settling it informs investment in "adjacent approaches" (e.g., mechanistic interpretability).  
     - **Tractability:** Medium-High. Study complexity theory (e.g., Kolmogorov complexity of arguments) and judge-boundedness models.  
     - **Reprioritize if:** Frontier models show emergent obfuscation (bump up); or if new debate formats circumvent it (bump down).  

  4. **Non-zero-sum settings & harmful judge manipulation**  
     - **Why last?** Important but *less* foundational:  
       - If debaters share goals (non-zero-sum), oversight fails only if they’re *already* misaligned. This is downstream of truth-tracking (#1).  
       - Harmful evaluation (e.g., arguments that hack the judge) is an attack vector, not a core flaw.  
       - **Dependency:** Presupposes debate works in ideal settings.  
     - **Tractability:** Medium. Formalize as adversarial corruption games.  
     - **Reprioritize if:** Proof-of-concept attacks emerge (e.g., in LLM debate demos); or if non-zero-sum dynamics dominate real deployments.  

  ---

  ### **What to Deprioritize & Why**  
  - **Asymmetric debaters (#2):** Deprioritize.  
    - **Why:** Asymmetry is a *practical* challenge, not a foundational flaw. If debate works symmetrically, asymmetry can be mitigated (e.g., via honesty primers or model checks). If it fails symmetrically, asymmetry doesn’t matter.  
    - **Cost:** Delays work on realistic deployments, but doesn’t risk wasted years.  
  - **"What survives if not symmetric?" (your #2, implied):** Fold into #4. Asymmetry is a special case of non-zero-sum dynamics.  

  ---

  ### **Missing Question: The Ontology Problem**  
  Add this if cutting others:  
  **"What can be meaningfully debated? (e.g., value-laden or ambiguous queries)"**  
  - **Why:** Debate assumes questions have objective answers. But oversight often involves ethics/policy where "truth" is contested.  
  - **Placement:** Would rank #3, as it questions debate’s *scope*.  

  ---

  ### **Dependency Map & Failure Modes**  
  ```mermaid
  graph TD
      A[Success Condition] --> B[Truth-Tracking Gap]
      A --> C[Obfuscation]
      B --> D[Non-Zero-Sum]
      C --> D
  ```
  - **If #1 fails** (success ill-defined): Everything else is misdirected.  
  - **If #2 fails** (no truth-tracking): Debate is unusable for oversight.  
  - **If #3 fails** (obfuscation fundamental): Debate doesn’t scale to hard problems.  
  - **If #4 fails** (non-zero-sum breaks it): Debate only works in toy settings.  

  ---

  ### **Where Standard Framing is Wrong**  
  The field often **assumes debate’s success conditions are clear** (#1). They’re not:  
  - Lie-detection is often easier but insufficient (e.g., an AI could "win" by exposing only *opponent’s* lies while hiding its own).  
  - Truth-tracking requires stronger assumptions (e.g., a "universal prior" for judges) rarely stated in debate papers.  

  **Recommendation:** Start with #1. If you can’t define what debate *should* achieve, other work is building on quicksand. With your team’s strength in formal philosophy, this is tractable and high-leverage. If you crack this in Year 1, the rest of the agenda becomes sharply focused.
