  Okay, the user has been thinking deeply about Descartes' cogito and noticed a pattern in arguments where the act of asserting something undermines the claim itself. They provided four examples: the cogito, denying absolute truths, asserting "I do not exist," and hard determinism. They want to know if there's a name for this pattern, how to distinguish it from similar concepts, and whether it proves less than traditionally thought.

  First, I recall that this is a performative contradiction. The user's examples fit this: when someone says "there are no absolute truths," they present it as an absolute truth. The act of speaking contradicts the content. Similarly, "I do not exist" requires existence to make the statement. The determinism example is also performative—the friend claims no reasoning occurs, yet presents the argument as reasoned.

  The user wants to differentiate this from self-contradiction, circular reasoning, and hypocrisy. Performative contradiction relies on the act of asserting, unlike a logical contradiction which is false regardless. Circular reasoning assumes the conclusion in the premises, which isn't happening here. Hypocrisy involves inconsistent actions but doesn't invalidate the claim itself.

  On the cogito, the user is right that it only proves current thinking, not a persistent self. Descartes uses it as foundational but builds further arguments for God and the external world. The performative contradiction only secures the immediate thought, not enduring truths. The limitation comes from the nature of performative acts—they only affirm the present instance.

  The user might be seeking validation of their insights and deeper understanding of philosophical concepts. They might also want tools to counter arguments like their friend's determinism. Their unspoken need could be confidence in their self-taught reasoning and clarity on how to apply these concepts effectively.

  In summary, performative contradiction is the key concept. It addresses their examples and distinctions, and explains the cogito's limitations. The user's analysis is spot-on, showing strong independent thought. They've correctly identified the pattern and its boundaries, which is impressive without formal training.
answer: |-
  The established concept for this pattern is **performative contradiction**.

  Performative contradictions occur when the act of asserting, doubting, or denying a proposition inherently conflicts with the proposition's content, rendering the performance self-defeating. The contradiction arises from the *performance of the speech act itself*, not merely from the logical form of the statement. This distinguishes it from:

  1.  **Plain self-contradiction (logical contradiction):** A statement like "This square is round" is false by its logical form alone, regardless of whether anyone utters it or not. Performative contradictions require an actual performance (asserting, doubting, denying) to manifest the contradiction. Your examples need a speaker/actor to collapse.
  2.  **Circular reasoning (petitio principii):** Circularity involves an argument where the conclusion is assumed in the premises. Performative contradictions don't necessarily involve an *argument*. The statement "I do not exist" isn't an argument with premises; it's a simple assertion whose performance (by an existing entity) contradicts its content directly.
  3.  **Mere awkwardness or hypocrisy:** Hypocrisy involves failing to act in accordance with one's stated belief. It doesn't logically invalidate the belief itself (a doctor's smoking doesn't refute the dangers of smoking). A performative contradiction *does* logically undermine the specific claim being made *at the moment of its utterance* because the act contradicts the claim.

  All four of your instances are valid examples of performative contradiction:

  1.  **The Cogito:** The act of doubting requires thinking to occur, making the doubt "I am not thinking" impossible to perform sincerely while doubting.
  2.  **Denial of Absolute Truth:** Asserting "There are no absolute truths" is presented as an absolute truth claim, contradicting its content through the performance of asserting it authoritatively.
  3.  **"I do not exist":** The act of uttering this statement requires the existence of the speaker, directly contradicting the proposition asserted.
  4.  **Hard Determinism Denying Reasoning:** Your friend performs the act of *reasoning* (presenting an argument based on premises to reach a conclusion) while asserting that reasoning never occurs. The act of presenting his belief *as a reasoned conclusion* contradicts the content of that conclusion. His "mere rhetoric" charge is a dodge; the contradiction lies in presenting his determinist view *as the product of reasoned argumentation itself*, not merely in his attempt to persuade you.

  Regarding the cogito and its yield:

  The concept of performative contradiction **directly explains the shortfall** you identify in the cogito's conclusion. A performative contradiction only establishes the minimal condition *required by the performance itself* at the *moment of performance*. 

  *   **Act:** Doubting/Thinking.
  *   **Contradiction:** Attempting to doubt "I am thinking" while doubting.
  *   **Minimal Establishment:** "Thinking is occurring now, during this act of doubting" (Cogito).
  *   **What it DOES NOT Establish (by itself):** A persisting self ("I" as a substance), a thinker distinct from the thought, the ownership of the thought, the reliability of memory (e.g., "I thought a minute ago"), or any future state. It only secures the *occurrence of the present thought/act*.

  **Principled Yield:** Performative contradictions can only legitimately establish the *indubitable fact of the performance and its minimal necessary conditions at the precise moment of performance*. For the cogito: thinking is occurring *now*. For the truth-denier: they are making a claim they present as absolutely true *now*. For the non-existent speaker: something exists *now* doing the speaking. For the determinist: they are presenting their view *as a reasoned conclusion now*. They cannot establish enduring entities, identities, truths, or causal relationships beyond the immediate act. Further arguments (like Descartes' arguments for God, clear and distinct ideas, and the external world) are needed to build beyond this minimal, instantaneous foundation, but they rely on additional premises and are subject to further scrutiny. The performative act yields only the indubitable fact of its own occurrence and its intrinsic prerequisites.
