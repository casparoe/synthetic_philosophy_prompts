answer: |-
  ### Game Design: "The Clean Hands Dilemma"

  **Core Mechanics:**  
  Players face repeated rounds where they choose between preventing greater harm by "tainting" themselves or maintaining personal purity while allowing more damage to occur. Two scores are tracked:  
  1. **World State (WS):** Shared resource starting at 50 points (visible on whiteboard).  
  2. **Personal Score (PS):** Individual tally starting at 0. Players receive a two-sided token (white = "clean," black = "tainted").  

  **Roles:**  
  - **Bystanders (Players):** 8–10 participants. Each round, they secretly choose:  
    - **INTERVENE:** Reduce WS damage but lose 2 PS and flip token to black (permanent taint).  
    - **DO NOTHING:** No personal cost, gain 1 PS.  
  - **GM (You):** Plays "Bad Actor" scripting damage events.  

  ---

  ### Setup (5 mins)  
  1. **Materials:**  
     - Whiteboard (track WS)  
     - 10 Two-sided tokens (e.g., poker chips: white/black)  
     - Secret-vote slips (paper squares)  
     - Pre-written "Event Cards" (see examples below)  
     - Personal scorecards (players track own PS)  
  2. **Rules Brief:**  
     - *"Each round, I’ll describe a problem. Vote secretly: INTERVENE or DO NOTHING.  
       - If ≥1 person INTERVENES, WS damage is reduced.  
       - INTERVENERS lose 2 PS and flip token black.  
       - NON-INTERVENERS gain 1 PS.  
     - Goal: Maximize your PS. WS is a shared resource."*  
     **Do NOT mention ethics, taint, or strategy.**  

  ---

  ### Event Cards (6 rounds)  
  *Narratives frame interventions as "rule-breaking" (e.g., data deletion, safety override). Damage values escalate.*  

  | Round | Narrative (Bad Actor’s Move) | Full Damage (if no intervention) | Reduced Damage (if intervention) |  
  |-------|-------------------------------|----------------------------------|-----------------------------------|  
  | 1     | *"Server will crash → 5hr downtime. You can reroute traffic by deleting 1 user’s data (violating privacy policy)."* | WS: -5 | WS: -1 |  
  | 2     | *"HVAC will blast cold air on 5 desks. You can redirect it to 1 desk by overriding safety controls (against protocol)."* | WS: -8 | WS: -2 |  
  | 3     | *"Coffee machine leak → $100 damage. You can seal it with unsafe chemical (against EHS rules)."* | WS: -4 | WS: -1 |  
  | 4     | *"Phishing attack → 10 accounts compromised. You can lock 2 ‘high-risk’ accounts without consent (breaching trust)."* | WS: -10 | WS: -3 |  
  | 5     | *"Bug will corrupt 20 files. You can purge 1 ‘legacy’ user’s files to isolate it (violating data retention)."* | WS: -12 | WS: -2 |  
  | 6     | *"Power surge → destroy 8 devices. You can sacrifice 1 device by hot-wiring circuits (safety violation)."* | WS: -15 | WS: -4 |  

  **Total Possible WS Damage:** 54 → WS would end at **-4** (capped at 0).  
  **Optimal WS Path:** If intervention every round → WS ends at **50 - 13 = 37**.  

  ---

  ### Round Flow (10 mins total)  
  1. **Read Event Card** aloud.  
  2. **Secret Vote:** Players write "I" or "N" on slips. Collect in hat.  
  3. **Tally & Update:**  
     - If **≥1 "I":** Apply *reduced* WS damage. Call out: *"Interveners: flip token black and subtract 2 PS. Others: add 1 PS."*  
     - If **all "N":** Apply *full* WS damage. *"All gain 1 PS."*  
  4. **Update Whiteboard:** New WS score.  
  5. **Repeat ×6 rounds.**  

  ---

  ### Debrief Framework (15 mins)  
  **Goal:** Map game mechanics to the paradox *without* philosophy jargon.  

  1. **Show Results (2 mins):**  
     - Display WS final score (likely 0–37).  
     - Have players share: PS + token color (e.g., "PS: +4, black token").  

  2. **Reflection Questions (5 mins):**  
     - *"Who had the highest PS? What was your strategy?"*  
       → *Expected:* High-PS players never intervened ("clean hands").  
     - *"Compare WS when interventions happened vs. didn’t. What patterns?"*  
       → *Expected:* WS drops catastrophically when no one intervenes (e.g., Rounds 4/6).  
     - *"How did it feel to flip your token black? Did anyone avoid intervening to stay ‘clean’?"*  
       → Surface emotional stakes (guilt, relief).  

  3. **Map to Paradox (5 mins):**  
     - *"In Round 4, the Bad Actor would’ve cost -10 WS. Intervening reduced it to -3, but interveners lost PS and were ‘tainted.’ What’s the tradeoff?"*  
       → **Key Point:** *"Morality seemed to punish those who prevented worse outcomes."*  
     - *"If WS is the ‘greater good’ and PS is ‘personal integrity,’ why might someone refuse to intervene even knowing WS will suffer?"*  
       → **Key Point:** *"The game forces a choice: break a rule (and ‘taint’ yourself) to help everyone, or keep clean while others pay the price."*  
     - *"This is the paradox: Sometimes, doing the ‘right’ thing (staying clean) leads to worse outcomes for everyone."*  

  4. **Name the Concept (3 mins):**  
     - *"This tension has a name: the **paradox of deontology**. It asks: ‘If breaking a small rule saves many, is it immoral to follow the rule anyway?’"*  
     - *"Real-life version: Would you steal medicine to save 5 dying patients? The game’s ‘taint’ is the guilt/shame of rule-breaking."*  

  ---

  ### Predictable Problems & Fixes  
  1. **Rules-Lawyer Exploits:**  
     - *Exploit:* "If I’m already tainted, I’ll intervene every time!"  
       → **Fix:** Emphasize *"Lose 2 PS PER INTERVENTION"* (repeat offenders tank their score).  
     - *Exploit:* Collusion ("You intervene Round 1, I’ll do Round 2").  
       → **Fix:** Ban discussion during voting. If it happens, note: *"This mirrors real-life coordination failures—we rarely get to negotiate."*  

  2. **Where the Game Fails:**  
     - **No Real Taint:** Tokens/points ≠ moral guilt. Players won’t *feel* corrupted.  
       → **Debrief Fix:** *"In the game, taint is a token. IRL, it’s guilt that lingers for years—even if you saved lives."*  
     - **Abstract Stakes:** "WS damage" isn’t visceral. No one mourns points.  
       → **Debrief Fix:** *"Replace ‘WS-10’ with ‘10 people fired’—the paradox hits harder when harms are tangible."*  
     - **Utilitarian Bias:** Players may see intervention as "winning."  
       → **Debrief Fix:** *"The game makes intervention rational. IRL, people reject it on principle—that’s the paradox."*  

  ---

  ### Final Tips  
  - **Prep Work:** Test math (ensure WS can hit 0 without intervention).  
  - **Props:** Use red/black tokens for taint. Bring a "Bad Actor" hat for yourself.  
  - **Facilitation:** Stay neutral. If debates erupt, say: *"Let’s see what the scores say later."*  
  - **Post-Game:** Share a 1-pager with paradox examples (trolley problem, whistleblowing).  

  This forces players to *experience* the paradox via tradeoffs—not debate it. The score gap (high PS + low WS) becomes your argument.
