  I'm a backend engineer at a mid-size company, and once a month I run a "weird ethics lunch" for whoever on my team shows up — usually 8-10 people, 75 minutes, a conference room with a whiteboard and whatever props I can scavange from the office kitchen. Last session I brought up something I heard on a podcast, I think it's called the paradox of deontology: the idea that it can be *wrong* for you to kill one person to stop someone else from killing five, so morality apparently requires you to stand by while more people die, which sounds insane the second you say it out loud. Half the room said obviously you take that deal, the other half got genuinely upset with the first half, and we ran out of time before anyone changed anyone's mind. I don't want another shouting match next month, I want a game.

  So design something for me: a structured game where people make these choices over and over with actual (small) stakes — tokens or points, some participants playing scripted "bad actors" whose moves cost the group points, and bystanders who each round can either let the damage happen or intervene in a way that causes less total damage but permanently marks *them* as the one who crossed a line. I want two scores tracked side by side: a world-state score for the whole group and some kind of personal record for each player, so by the end people can literally see the gap between keeping your own hands clean and the state of the world you left behind. No lecture up front, and I'd rather people not hear the philosophical term for what's happening until the debrief.

  Then the debrief itself: how do I map the specific moments in the game onto the actual issue (the part where morality seems to tell you to allow the worse outcome), without it turning into me poorly reciting a wikipedia article — I have zero philosophy background so make the debrief notes concrete and specific to the game. Also two more things: tell me what will predictably go wrong the first time I run this (I have two coworkers who will absolutely try to rules-lawyer whatever you write, so flag where they'll find the exploit), and be honest with me about which part of the paradox a game with pretend tokens and zero real victims just cannot reproduce — I assume the answer is something like "nobody actually feels tainted," but I want you to tell me where the game stops working and what I have to just assert in the debrief.
