answer: |-
  ### In-Class Allais Paradox Game Design

  **Objective:** Demonstrate the Allais paradox, test violations of expected utility theory (independence axiom/common consequence), and explore preference stability through real choices and trading.

  ---

  #### **Rules, Payoffs, and Setup**
  1. **Stakes:**  
     - Use **$5 coffee vouchers** (scaled to classroom stakes).  
     - Budget: $100 max (based on 14 students × 2 decisions × $5 max loss per decision).  

  2. **Lottery Mechanics:**  
     - Use a **public random number generator** (1–100) to determine outcomes.  
     - **Problem 1 (Certainty Effect):**  
       - **Option A:** $5 voucher for sure (100%).  
       - **Option B:**  
         - 1%: $0  
         - 89%: $5 voucher  
         - 10%: $10 voucher  
     - **Problem 2 (Common Consequence):**  
       - **Option C:**  
         - 89%: $0  
         - 11%: $5 voucher  
       - **Option D:**  
         - 90%: $0  
         - 10%: $10 voucher  

  3. **Stage 1: Original Allais Choices (All 14 Students)**  
     - **Task:** Students choose between A/B (Problem 1) and C/D (Problem 2) on paper.  
     - **Incentive:** One problem (randomly selected post-choice) will be played for real.  
     - **Time:** 10 minutes (decide + collect responses).

  4. **Stage 2: Reframed Choices (Split Class)**  
     - **Groups:**  
       - **Group A (Control, 7 students):** Receives original Problems 1 and 2 again.  
       - **Group B (Treatment, 7 students):** Receives *reframed* problems highlighting dominance.  
     - **Reframed Problem 1 for Group B (Two-Stage):**  
       > "Stage 1: 89% chance of $5 (common outcome).  
       > Stage 2 (11% chance): Choose between:  
       > - **Option A:** $5 for sure.  
       > - **Option B:** 1/11 chance of $0 + 10/11 chance of $10."  
       *(Equivalent to original Option B but with common consequence resolved first.)*  
     - **Reframed Problem 2 for Group B:**  
       > "Stage 1: 89% chance of $0 (common outcome).  
       > Stage 2 (11% chance): Choose between:  
       > - **Option C:** $5 for sure.  
       > - **Option D:** 1/11 chance of $0 + 10/11 chance of $10."  
     - **Task:** Groups choose again without knowing it’s the same as Stage 1.  
     - **Time:** 10 minutes (decide + collect responses).

  5. **Trading Window (Key for Preference Stability)**  
     - **Setup:** Assign each student their Stage 2 choice as a tradable "lottery ticket" (e.g., "Ticket A: $5 sure").  
     - **Rules:**  
       - 5-minute open trading. Students can buy/sell tickets with classmates using "voucher credits" (hypothetical currency for simplicity).  
       - Sellers set prices; buyers pay from a $10 credit (given upfront to simulate liquidity).  
       - Record final owners and prices on a central board.  
     - **Purpose:** Reveal if Allais preferences (e.g., choosing A then D) hold when monetized.  

  6. **Outcome Resolution:**  
     - Randomly select one problem (1 or 2) to resolve for all students.  
     - Draw a number (1–100) publicly. Payouts based on final ticket ownership.  

  ---

  #### **Timeline (90-Minute Session)**
  - **0–5 min:** Intro + rules.  
  - **5–15 min:** Stage 1 (original choices).  
  - **15–25 min:** Stage 2 (split-group choices).  
  - **25–30 min:** Assign tickets, explain trading.  
  - **30–35 min:** Trading window.  
  - **35–40 min:** Resolve lottery + payouts.  
  - **40–80 min:** Debrief (see below).  
  - **80–90 min:** Q&A.  

  ---

  #### **Debrief Mapping to Theory**
  1. **Stage 1 (Original Choices):**  
     - **Expected Pattern:** Most choose **A (Problem 1)** and **D (Problem 2)**.  
     - **Theory Link:** Violates **independence axiom**. The common consequence (89% $5 in Problem 1, 89% $0 in Problem 2) should not affect preferences, but the "certainty effect" (A’s guaranteed $5) dominates Problem 1.  

  2. **Stage 2 (Reframed Choices):**  
     - **Group A (Control):** Repeats Allais pattern (A+D).  
     - **Group B (Treatment):** Higher rate of consistent choices (A+C or B+D) since dominance in Stage 2 is transparent.  
     - **Theory Link:** **Common consequence** is isolated. Choosing A in Problem 1 but D in Problem 2 is irrational—identical 11% sub-lotteries should be treated the same.  

  3. **Trading Window:**  
     - **Price Analysis:** If students who chose A (Problem 1) sell for <$5 or D (Problem 2) sells for <$1 (expected value), it suggests unstable preferences.  
     - **Theory Link:** Tests if Allais preferences "survive contact" with markets. Prices reveal true strength of violations.  

  ---

  #### **Limitations of a Classroom Game**
  - **One-Shot Nature:** Real-world paradoxes involve high-stakes, repeated decisions. Small stakes here may understate risk aversion.  
  - **Sample Size:** 14 students lacks statistical power; focus on qualitative insights.  
  - **Hypothetical Trading:** Voucher credits simplify pricing but lack real monetary pressure.  

  ---

  #### **Predictable Problem**
  **Trading chaos:** Students may freeze or haggle inefficiently. Mitigate by:  
  - Pre-writing tickets (e.g., "Lottery: 10% $10, 90% $0").  
  - Assigning 2 students as "market makers" to jumpstart offers.  

  ---

  **Bottom line:** This game exposes how framing and market interaction unravel the Allais paradox, revealing that its violations are less about stable preferences and more about cognitive shortcuts.
