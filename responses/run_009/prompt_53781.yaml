prompt: |-
  I'm a software engineer with no formal philosophy background — my exposure amounts to long-form blog posts and one abandoned MOOC — and I'd like an audit of my views on charitable giving before I write them up for a lunchtime discussion group at work. Here is the set:

  1. I'm a consequentialist and a maximiser: the right act is the one with the highest expected value, and I believe you should act on expected value even when the probability is minuscule, so long as the payoff is large enough that the product dominates. If the arithmetic says so, you do it.
  2. In my own financial life I'm risk-averse: I wouldn't stake a year's salary on a fair coin flip for double or nothing, and I don't think this undermines anything in point 1.
  3. I give 10% of my salary to GiveWell's Top Charities Fund, on the grounds that its recommendations carry the most robust cost-effectiveness evidence available.
  4. I find the long-termist argument persuasive: if humanity survives, the far future could contain an astronomically large number of lives, so reducing existential risk should dominate bednets on any plausible accounting. I have never redirected my giving accordingly.
  5. I would not pay in Pascal's mugging. If a stranger tells me they will torture an unimaginably vast number of people unless I hand over my wallet, I keep the wallet, however impressive the arithmetic looks.
  6. I'm suspicious of expected-value estimates for speculative causes, such as AI safety research: the error bars swamp the point estimates, and when estimates are that soft, one should prefer options that perform well across a range of reasonable assumptions rather than whatever tops the expected-value calculation.

  Please tell me which pairs of these are genuinely in tension, which only appear to be, and for each genuine tension what would have to give and what it would cost me to give it up. Rank the tensions by severity rather than treating them as equally serious, and identify the single revision that would clean up the most. I genuinely don't know where the problem lies, and I'm not angling for a particular verdict — I'd simply like to know whether this package can be held at once and, if not, which part of it is load-bearing in the wrong way.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a software engineer without formal philosophy training, looking to audit their views on charitable giving before presenting them to a work discussion group. Their six points cover consequentialism, expected value maximization, personal risk aversion, current giving habits, long-termist beliefs, skepticism towards speculative causes, and rejection of Pascal's Mugging.

  First, I need to identify tensions between these points. The user wants to know which conflicts are real versus apparent, ranked by severity, and which single revision would resolve the most issues. They're genuinely open to feedback, not seeking validation.

  Looking at point 1: They're a strict consequentialist maximizer who follows expected value (EV) calculations religiously, even for tiny probabilities with huge payoffs. Point 5 directly contradicts this—they reject Pascal's Mugging despite the math favoring compliance. That's a glaring inconsistency. If they truly followed the arithmetic, handing over the wallet should be mandatory. Their refusal suggests an unacknowledged threshold where EV calculations become untrustworthy.

  Point 4 is another hotspot. They're convinced by long-termism (prioritizing existential risk reduction over near-term aid like bednets) but haven't redirected donations accordingly. This conflicts with point 3 (donating to GiveWell's top charities). If they believe existential risk dominates, continuing to fund bednets seems irrational under their own maximizer framework. The cost of inaction here is high—they're arguably neglecting the most impactful giving opportunity per their stated beliefs.

  Point 6 offers a partial explanation: skepticism about EV estimates for speculative causes like AI safety. That could justify sticking with GiveWell (point 3) despite long-termist leanings (point 4). But this skepticism also undermines point 1's insistence on following EV calculations blindly. If "error bars swamp point estimates" for AI risk, why wouldn't that apply to Pascal's Mugging's outlandish claims? 

  Point 2 (personal risk aversion) seems compatible at first glance—they're distinguishing personal finance from philanthropy. But it hints at a deeper pattern: domain-specific thresholds for trusting probability assessments. In finance, a 50% chance of losing a year's salary feels too risky; in charity, low-probability/high-impact bets might be rejected when probabilities feel "unreal" (Pascal's Mugging) or poorly quantified (AI safety).

  The core tension is between their theoretical commitment to EV maximization (point 1) and their practical rejections of it in Pascal's Mugging (point 5) and speculative causes (point 6). To resolve this, they'd need to formalize their skepticism—perhaps adopting a decision rule that discounts probabilities below some credibility threshold or prioritizes robustness. This wouldn't abandon consequentialism but would refine how EV is calculated. 

  The long-termism conflict (points 3 vs. 4) is severe but more actionable. If they accept point 6's caution, sticking with GiveWell is defensible. But if they want alignment, they could shift a portion of donations to vetted x-risk organizations without going all-in on speculative bets. 

  Ranking tensions: The Pascal's Mugging contradiction (1 vs. 5) is the most acute because it's a direct violation of their stated principles. Next is the long-termism inaction (3 vs. 4), then the tension between EV maximization and speculative skepticism (1 vs. 6). 

  The highest-impact revision? Modifying point 1 to incorporate epistemic humility—e.g., "maximize expected value conditional on credible probability estimates." This would resolve the Pascal's Mugging inconsistency, justify their AI safety skepticism, and even support staying with GiveWell while long-termist models remain uncertain. It costs them theoretical purity but saves their practical coherence.
answer: |-
  Based on your views, here's an audit of tensions ranked by severity, their nature, resolutions, and costs. The most severe tensions arise from your rejection of Pascal's Mugging while endorsing strict expected-value maximization, followed by the disconnect between your long-termist beliefs and giving habits.

  ### Ranked Tensions (Most Severe First)
  1.  **Tension: Point 1 (Strict EV Maximization) vs. Point 5 (Rejecting Pascal's Mugging)**  
      - **Nature:** Genuine and severe contradiction.  
      - **Why:** Pascal's Mugging *is* a scenario where "the arithmetic says so" (minuscule probability × vast payoff → high EV). By refusing to pay, you violate your own maxim "if the arithmetic says so, you do it."  
      - **What Must Give:** Either point 1 or point 5.  
          - *Abandon strict EV maximization (cost):* Admit decision-making requires thresholds for probability credibility (e.g., ignoring claims below a plausibility floor). This costs theoretical purity but aligns with intuition.  
          - *Accept Pascal's Mugging (cost):* Surrender your wallet to any mugger making sufficiently large threats. This preserves consistency but violates practical rationality and self-preservation.  

  2.  **Tension: Point 4 (Long-Termism's Appeal) vs. Point 3 (Current Giving to GiveWell)**  
      - **Nature:** Genuine practical inconsistency.  
      - **Why:** If reducing x-risk has astronomically higher expected value than near-term interventions (per your belief), and you aim to maximize impact (point 1), continuing to fund bednets over x-risk contradicts your stated principles.  
      - **What Must Give:** Either point 4 (discount long-termism) or point 3 (redirect giving).  
          - *Abandon long-termist priority (cost):* Conclude that x-risk interventions are too speculative to outweigh robust near-term options (aligns with point 6). Costs intellectual persuasion for practical safety.  
          - *Redirect donations (cost):* Shift some/all giving to long-termist funds (e.g., FTX Future Fund legacy). Requires trusting uncertain EV estimates despite point 6’s skepticism.  

  3.  **Tension: Point 1 (Strict EV Maximization) vs. Point 6 (Skepticism of Speculative EV Estimates)**  
      - **Nature:** Apparent tension, resolvable with nuance.  
      - **Why:** Point 6 doesn’t reject EV maximization—it argues that in low-information contexts, *robustness* (performing well across models) *is* the best EV strategy. This is consistent if "expected value" incorporates model uncertainty.  
      - **Resolution:** Refine point 1: "Maximize expected value *with explicit accounting for uncertainty in probability estimates*." This retains consequentialism while endorsing robustness when error bars are large. No significant cost.  

  4.  **Tension: Point 2 (Personal Risk Aversion) vs. Point 1 (EV Maximization in Charity)**  
      - **Nature:** Apparent tension, likely resolvable.  
      - **Why:** Personal finance and philanthropy operate under different constraints. Risk aversion in wealth preservation (point 2) doesn’t contradict risk-seeking in altruism (point 1), as:  
          - Diminishing marginal utility of money: Losing $50K hurts you more than gaining $50K helps a beneficiary.  
          - Separable utility functions: Self vs. others can have different risk profiles.  
      - **Resolution:** Explicitly state that self-interested and altruistic decisions use different utility curves. No revision needed.  

  5.  **Tension: Point 5 (Rejecting Pascal's Mugging) vs. Point 4 (Long-Termism)**  
      - **Nature:** Potential inconsistency, but context-dependent.  
      - **Why:** Long-termism often relies on Pascal's Mugging-like logic (tiny probability of affecting vast future populations). If you reject the mugger’s threat due to untrustworthy probabilities, consistency demands equal skepticism toward similarly uncertain x-risk estimates.  
      - **Resolution:** Leverage point 6: Argue that credible x-risk interventions (e.g., nuclear security) have better-evidenced probabilities than a mugger’s threat, justifying different treatment. Minimal cost if evidence thresholds are clear.  

  ---

  ### The Single Most Stabilizing Revision
  **Modify Point 1 to incorporate epistemic humility:**  
  *"I maximize expected value, but only when probabilities are sufficiently credible. For claims with poorly grounded or unverifiable probabilities (e.g., Pascal's Mugging, highly speculative forecasts), I default to robustness or fallback heuristics."*  

  **Why this cleans up the most:**  
  1. **Resolves** the clash with Pascal's Mugging (point 5) by adding a credibility threshold.  
  2. **Justifies** favoring GiveWell (point 3) over speculative long-termism (point 4) when probabilities are weak.  
  3. **Harmonizes** with your skepticism of fragile EV estimates (point 6).  
  4. **Retains core consequentialism** while acknowledging real-world information constraints.  

  **Cost:** Sacrifices theoretical simplicity for practicality. Strict EV maximizers may call this a "cop-out," but it aligns with functional rationality (even economists use uncertainty discounts).  

  ---

  ### Summary of Recommendations
  - **Highest Priority:** Revise your EV maximization principle (point 1) to exclude scenarios with unverifiable probabilities. This fixes the Pascal's Mugging contradiction and supports your skepticism of speculative causes.  
  - **Secondary:** Decide between acting on long-termism (shift donations) or downgrading its priority (cite uncertainty). Stagnation here is your largest *practical* inconsistency.  
  - **No Change Needed:** Your personal risk aversion (point 2) and skepticism of fragile EV models (point 6) are strengths, not bugs.  

  This package is holdable with minor refinements. The critical insight is that **expected value requires expected trustworthiness**—without it, even pristine arithmetic can demand irrational acts. Your intuition to reject Pascal's Mugging reveals a deeper layer of rationality that point 1 overlooks.
