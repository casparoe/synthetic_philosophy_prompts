prompt: |-
  i keep getting into arguments with my brother about whether "collapse" even means anything as a concept and i've decided the way to settle it is to figure out what an actual theory of societal collapse has to get right before i'll take any of these books seriously. so write me the spec: the requirements list for an adequate theory or explanation of civilizational collapse -- the cases it has to get right (western roman empire, the late bronze age eastern mediterranean, the classic maya, easter island -- pick whatever you need from these), the distinctions it can't just paper over, the results from archaeology and paleoclimatology it can't contradict. for each requirement say what's motivating it, i.e. what goes wrong with a theory that lacks it.

  some things i specifically want you to deal with in the requirements themselves:

  - my brother's line is that collapse is never a real thing, it's just change, and the people who talk about collapse are either nostalgic for aristocracies or selling doom books. so one requirement has to be about whether a theory can distinguish "collapse" from "transformation" in a non-question-begging way, or whether that distinction is itself impossible to draw (in which case say so, that would actually vindicate him and i want to know). does it count as collapse if the political superstructure goes but daily life for a farmer is basically unchanged? does population have to drop? complexity? living standards? who is the collapse a collapse *for*?
  - easter island specifically, because the popular ecocide story and the revisionist "it was fine until europeans showed up" story are both out there, and a decent theory should have something to say about how contested empirical cases constrain it. it can't just pick whichever version is convenient.
  - the anthropic-ish worry: we only get detailed evidence from places where writing or durable records existed, which is not a random sample of collapses. is handling that a real requirement or is it just a caveat people mumble?
  - whether a theory needs to explain non-collapse too. empires that weathered the same shocks (egypt through the bronze age crisis, roughly) -- if your theory of collapse can't tell you why the same drought or trade disruption kills one polity and leaves the neighbor intact, is it a theory of anything?

  mark which requirements you think are non-negotiable and which are just preferences of particular camps (tainter-style complexity/energy people, the resilience people, the "there are no collapses only transformations" people). and if you think some subset of the requirements can't be jointly satisfied -- like maybe "observer-neutral definition" and "the concept does real explanatory work" -- flag that, because that's the part i most care about. no need to score the existing books against the list, i'll do that myself and probably badly.
reasoning: |-
  Okay, the user wants a spec for a theory of societal collapse. Let me start by understanding their main concerns. They're arguing with their brother about whether "collapse" is a meaningful concept. The brother thinks it's just change, and people talking about collapse are either nostalgic or selling doom. So the key is defining collapse vs. transformation. The user also mentioned specific cases: Western Roman Empire, Late Bronze Age, Maya, Easter Island. Each has different factors—Rome had invasions and administration issues, Bronze Age had trade collapse and climate, Maya had drought, Easter Island has ecocide debates.

  First, I need to address the core requirement: distinguishing collapse from transformation. The theory must have clear criteria that aren't arbitrary. Population decline, loss of complexity, etc. But whose perspective? Elite vs. farmer. Maybe defining multi-scalar analysis is crucial here. Non-negotiable because without it, everything is just change.

  Next, contested cases like Easter Island. A solid theory must engage with conflicting evidence without cherry-picking. Both ecocide and European impact theories need consideration. Non-negotiable to avoid biased narratives.

  Then, the anthropic bias. Most evidence comes from literate societies. How does that skew the theory? The user wonders if it's a real issue or just a footnote. The requirement here would be acknowledging the sample bias and its implications. Maybe a negotiable point, but important for honesty.

  Explaining non-collapse is vital. Why did Egypt survive the Bronze Age crisis while others fell? A theory must account for resilience factors. Non-negotiable because without this, it's not predictive or explanatory.

  Also, the user wants to know if some requirements conflict. For example, observer-neutral definition vs. explanatory power. If collapse is defined too broadly, it loses meaning. If too narrow, it might ignore nuances. Highlighting such tensions is key.

  I should structure each requirement with motivation: what goes wrong if it's missing. For instance, without multi-scalar analysis, a theory might miss that farmers' lives continued while elites fell. That's a problem for defining collapse.

  Check existing frameworks: Tainter's complexity, Diamond's environmental, resilience theory. Each has strengths but gaps. The spec needs to cover what they miss, like the anthropic issue or non-collapse cases.

  Also, the brother's argument: if collapse can't be distinguished from transformation, the concept might be invalid. The theory must address this head-on. Including temporal depth—decline over decades vs. overnight—could help.

  Finally, flagging which requirements are non-negotiable. Core definitions, multi-scalar, empirical engagement, resilience explanation. Others, like anthropic caveats, might be flexible but still important for robustness.
answer: |-
  Here's a rigorous "spec" for an adequate theory of societal collapse, designed to address your core concerns and adjudicate your argument. Requirements are categorized by necessity and key tensions are flagged.

  **Core Definitional Requirement (Non-Negotiable):**

  1.  **Multi-Scalar, Non-Question-Begging Definition of "Collapse":**
      *   **Requirement:** The theory MUST explicitly define "collapse" using observable, measurable criteria applicable across cases, *and* specify the scale(s) at which it operates (political, economic, demographic, cultural, spatial). It must distinguish "collapse" from "transformation," "decline," or "reorganization" without relying solely on subjective judgments of "loss" or value-laden terms like "dark age." Criteria could include (but aren't limited to combinations of): rapid/significant population decline (>X% over Y time), drastic reduction in socio-political complexity (loss of centralized institutions, specialization, monumental building), major contraction in economic activity/trade, radical settlement abandonment/contraction, or loss of core cultural markers/identity. Crucially, it must state **for whom** collapse occurs (elites vs. peasants, urban vs. rural, specific regions).
      *   **Motivation:** Without this, the theory collapses (pun intended) into your brother's critique. Is it "collapse" if the Emperor loses Rome but Gaulish farmers see little change? A theory lacking this is just labeling change it dislikes as "collapse." It *must* specify thresholds and scales objectively. **Tension:** Defining strict thresholds risks arbitrariness; being too flexible risks losing explanatory power. A theory *must* navigate this.

  **Empirical & Methodological Requirements (Non-Negotiable):**

  2.  **Robust Engagement with Contested Evidence (Easter Island Test Case):**
      *   **Requirement:** The theory MUST explicitly engage with the full spectrum of contested evidence in key cases, *especially* Easter Island. It cannot simply cherry-pick the narrative (ecocide vs. European-introduced disease/rat predation/slavery) that fits its preferred driver. It must demonstrate how its framework accommodates or adjudicates between conflicting archaeological, paleoecological, and historical data points (e.g., palm pollen decline vs. evidence of continued statue movement post-deforestation, population estimates, timing of societal change vs. European contact).
      *   **Motivation:** A theory that ignores inconvenient evidence for key cases is pseudoscience. Easter Island is the litmus test for whether a theory seriously contends with messy reality. Failing this means the theory is likely forcing evidence into a preconceived mold.

  3.  **Explanation of Differential Resilience (The "Why Not Collapse?" Requirement):**
      *   **Requirement:** The theory MUST explain not only why collapse *happened* in specific cases (Rome, Maya, LBA) but also why similar or adjacent polities experiencing comparable stresses *did not collapse* (e.g., Egypt weathering the LBA crisis better than the Hittites; Byzantium vs. W. Rome; Teotihuacan influence vs. Classic Maya collapse). It must identify factors conferring resilience.
      *   **Motivation:** A theory that only explains collapse is incomplete and non-predictive. If the same drought, invasion, or trade disruption fells Society A but Society B adapts, the theory must pinpoint *why*. Ignoring this renders the theory little more than post-hoc storytelling. Why did Egypt's institutions hold while the Hittite Empire shattered?

  4.  **Temporal Depth & Process Orientation:**
      *   **Requirement:** The theory MUST model collapse as a *process* unfolding over decades or centuries, not a single event. It must account for the sequence of stressors, responses, feedback loops, and potential points of intervention or no return. It must grapple with evidence of prior resilience/coping and the timing of different collapse indicators (e.g., political fragmentation often precedes demographic decline).
      *   **Motivation:** Collapse narratives often get telescoped. Theories treating it as instantaneous miss crucial dynamics (e.g., Rome's "fall" took centuries; Maya decline was regional and staggered). A lack of process orientation leads to oversimplified monocausal explanations.

  **Conceptual & Scope Requirements (Varies - Non-Negotiable Core, Negotiable Implementation):**

  5.  **Multi-Causality & Interaction of Drivers:**
      *   **Requirement:** The theory MUST acknowledge and model the interaction of multiple potential drivers (e.g., climate change, resource depletion, social conflict, institutional failure, external shocks, economic fragility) rather than insisting on a single prime mover. It should specify how these factors amplify or mitigate each other.
      *   **Motivation (Non-Negotiable Core):** No major collapse studied (Rome, LBA, Maya) has a universally accepted single cause. Theories insisting on one (just climate! just complexity! just barbarians!) fail basic empirical tests. **Negotiable:** *How* precisely interactions are modeled (simple lists vs. complex systems dynamics) depends on the theoretical camp.
      *   **Tension:** Balancing complexity with parsimony is hard. But ignoring multi-causality is fatal.

  6.  **Integration of Paleoclimatology & Environmental Data:**
      *   **Requirement:** The theory MUST be compatible with and incorporate robust paleoclimatic and paleoenvironmental reconstructions (e.g., ice cores, speleothems, pollen records, sediment cores) for relevant periods and regions. It cannot contradict well-established evidence (e.g., the LBA "3.2ky event" drought, Maya Terminal Classic droughts, Roman Climate Optimum/Anomaly transition).
      *   **Motivation (Non-Negotiable):** Environmental factors are demonstrably major players in many collapses. A theory ignoring or contradicting this evidence (e.g., claiming no drought during the Maya collapse) is empirically invalid. **Negotiable:** The *weight* given to climate vs. societal factors can vary.

  7.  **Handling the "Anthropic" (Sample Bias) Problem:**
      *   **Requirement:** The theory MUST explicitly address the inherent bias in the historical/archaeological record – that detailed evidence comes disproportionately from complex, literate, monumental societies *prone to leaving traces of their collapse*. It should discuss the limitations this imposes and how the theory might apply to less visible societies (e.g., if possible based on archaeology/paleoecology alone).
      *   **Motivation (Non-Negotiable Acknowledgement):** Ignoring this bias leads to theories only explaining collapses of "high" civilizations, potentially missing common patterns in smaller-scale collapses or survivable transformations elsewhere. **Negotiable:** *How* rigorously it's addressed. Some camps (e.g., Tainter) focus almost exclusively on complex societies; resilience theory might be more broadly applicable. But it *cannot* be ignored.

  **Distinction Requirements (Addressing Your Brother's Core Challenge):**

  8.  **Explicit Distinction Between Collapse, Transformation, & Decline:**
      *   **Requirement:** Building on Requirement 1, the theory MUST provide a clear framework for distinguishing:
          *   **Collapse:** Meets defined thresholds of rapid/significant loss (population, complexity, integration, territory, identity).
          *   **Transformation:** Major societal reorganization where key functions/identity persist or evolve, even if political structures change (e.g., W. Roman Empire -> "Barbarian" Kingdoms retaining Roman law/church; Byzantium's evolution).
          *   **Decline:** A gradual, long-term reduction in capacity, complexity, or population *without* a rapid, systemic breakdown.
      *   **Motivation:** This is the heart of your debate with your brother. A theory lacking this is vulnerable to the "it's just change" critique. It *must* provide objective criteria, acknowledging grey areas but offering tools to analyze them. **Tension:** Insisting on overly rigid distinctions might be unrealistic; being too fuzzy renders the concept useless. A good theory *must* grapple here.

  **Camp Preferences & Negotiable Elements:**

  *   **Energy/Complexity (Tainter-esque):** Prefers Requirement 1 criteria focused sharply on rapid loss of complexity and energy return on investment (EROI). Emphasizes Requirement 5 (complexity cost) as the *key* driver interacting with others. May downplay Requirement 7 (sample bias) as focusing on complex societies is the point. Requirement 3 (differential resilience) might be explained by differing complexity/energy baselines.
  *   **Resilience Theory:** Focuses intensely on Requirement 3 (differential outcomes) and Requirement 4 (process). Defines collapse as exceeding systemic resilience thresholds. Emphasizes modularity, diversity, social memory. More comfortable with Requirement 7 (broader applicability). May see "collapse" as one outcome on a spectrum with transformation (Requirement 8).
  *   **"No Collapse, Only Transformation":** Rejects the core need for Requirement 1 as defined. Argues thresholds are arbitrary and scale-dependent (Requirement 1's "for whom?"). Focuses on continuity amidst change (e.g., peasant life). Views Requirement 2 as showing narratives are constructed. Sees Requirement 5/6 as explaining change, not collapse. **This camp fundamentally challenges the possibility of satisfying Requirement 1 without question-begging.**

  **Key Tensions & Potential Dealbreakers:**

  1.  **Definition vs. Explanatory Power (The Core Tension):** Can Requirement 1 (objective, multi-scalar definition) be satisfied *without* making the definition so restrictive it only applies to a few cases (losing power), or so broad it becomes meaningless ("it's just change")? **This is the battleground.** A theory *must* thread this needle to be valid.
  2.  **Parsimony vs. Multi-Causality:** Requirement 5 demands complexity, but a useful theory needs some simplicity. Can a theory be complex enough to be realistic yet clear enough to be testable and insightful?
  3.  **Focus on "High" Collapse vs. General Applicability:** Requirement 7 highlights a fundamental limitation. Can a theory primarily built on literate, monumental societies (Rome, Maya, LBA states) *truly* be a general theory of societal collapse, given the sample bias? Or is "collapse" inherently a concept tied to complex state societies? Resilience theory offers the best path to generality.

  **Conclusion:**

  A theory meeting these requirements – especially the Non-Negotiables (1, 2, 3, 4, 5, 6 acknowledged, 8 engaged) – would be robust. It would directly confront your brother's skepticism by demanding an objective definition (1, 8), forcing engagement with messy evidence (2), explaining why collapse isn't inevitable (3), and acknowledging data limitations (7). The **existence of differential outcomes (3)** is perhaps the strongest argument *against* your brother's "it's always just change" view – something profoundly *different* happened in the Western Roman Empire circa 400-500 CE compared to the Eastern Empire, demanding explanation beyond mere "change."

  **Does the concept hold?** A theory *can* define "collapse" objectively (e.g., rapid, significant loss of population, socio-political complexity, and territorial integration over a defined area within a few generations), distinct from transformation or decline. However, whether *any specific historical case* perfectly fits this definition across all scales (elite vs. peasant) is often debatable. The concept *is* meaningful for explaining catastrophic, rapid, multi-system failures, but its edges are fuzzy. The best theories won't insist on pure collapse *everywhere* but provide tools to analyze the *spectrum* from resilience to transformation to collapse, satisfying Requirement 8. Your brother is right that "collapse" is often misused, but a strong theory demonstrates it *can* be a valid, non-arbitrary analytical category. Good luck with the books!
