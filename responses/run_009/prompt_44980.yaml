prompt: |-
  I'm on the people-ops steering comittee at a ~400-person software company (boilerplate mid-size, nothing exotic). Our CEO read something on a flight and came back convinced our "flexible, passion-driven" culture is quietly grinding people down: internal survey shows median 50+ hour weeks, half of engineering says they answer Slack on vacation, two people out on medical leave for burnout this year. So we have to actually pick a policy at next month's meeting, and there are three live proposals:

  1) A hard 35-hour week -- hours logged, managers dinged for overage, basically the French thing, on the theory that if you don't measure it it doesn't exist.
  2) Unlimited PTO plus sabbaticals -- the Silicon Valley favorite. We actually tried this three years ago and people took LESS vacation, but the execs love the signal.
  3) The weird one, from our most senior engineer. She spent four years at a Tokyo firm where a colleague of hers literally died at his desk -- karoshi is not a hypothetical to her, it's a name she had to say at a funeral. She wants what she calls "protected leisure": no hour-counting at all, but contractually enforced off-time -- no email delivery between 8pm and 8am, vacation where HR takes your laptop, a company-wide closed day once a month. Her argument is roughly that the problem isn't how much we work but that our leisure has been colonized: recovery counts as work-prep, hobbies get rebranded as upskilling, the weekend is just a buffer so the machine can run again Monday. She keeps citing some line about the Greek word for leisure being the root of our word for school, which honestly I haven't checked.

  And of course we have a VP who pushes back on all three with what he openly calls the Protestant work ethic: effort is intrinsically ennobling, people who love their craft SHOULD work sixty hours, and capping hours is paternalism that treats adults as children. He's not a cartoon -- he mentored half our best engineers and they'd walk into traffic for him, so I can't just dismiss him.

  Draft the memo I'll circulate before the meeting. I want a concrete recommendation -- pick one of the three or a hybrid, whatever you actually think is right, with rollout details a committee could vote on -- and I want the VP's position taken seriously, steelmanned even, not just litigated against. The engineer's "colonized leisure" idea is the one I find most interesting and also most hand-wavy: if it's doing real work in your recommendation, say exactly what work. And include a section on what would change the recommendation -- what evidence from the rollout, or what argument someone could raise at the meeting, should make us flip. Also flag where you think your own reasoning is weakest.

  After the memo, give me a JSON object with these fields: "recommendation" (one line), "runner_up" (one line), "confidence" ("low", "medium", or "high"), "strongest_case_for_the_losing_side", "key_empirical_assumptions" (array of things we'd need to check or measure), "what_would_change_our_mind" (array), "weakest_link_in_reasoning" (one or two sentences).
reasoning: |-
  Hmm, the user is on a people-ops steering committee at a mid-sized software company facing a critical decision about work culture. They need a memo to present at their next meeting addressing three proposals to combat burnout: a hard 35-hour week, unlimited PTO with sabbaticals, or "protected leisure" with enforced off-time. There's also pushback from a respected VP who champions long work hours as noble. 

  Looking at the details, the company's internal survey shows concerning signs: median 50+ hour weeks, half of engineering answering Slack on vacation, and two burnout-related medical leaves. The CEO is worried that their "flexible, passion-driven" culture is grinding people down. The user seems most intrigued by the "protected leisure" concept but finds it hand-wavy, and they need concrete recommendations.

  Breaking this down, I see several layers to address. The user wants a memo that picks one proposal (or hybrid) with rollout details, steelmans the VP's position, explains how "colonized leisure" would function if chosen, includes triggers for changing the recommendation, and flags weaknesses in the reasoning. Then they want a structured JSON summary.

  For the recommendation, I need to evaluate all three options. The hard 35-hour week is measurable but risks backlash in a passion-driven environment and might not address the "always-on" culture. Unlimited PTO failed before—people took less vacation—and signals hypocrisy. The "protected leisure" idea is radical but tackles the root problem: work invading recovery time. The VP's "work is ennobling" view has merit but ignores systemic issues.

  I'm leaning toward recommending "protected leisure" with modifications. It directly confronts the colonization of leisure, which aligns with the burnout symptoms described. To make it less hand-wavy, I'll propose concrete guardrails: no email delivery 8pm-8am, mandatory vacation with laptop surrender, quarterly "recharge days," and Slack-free weekends for all. This preserves flexibility while creating sacred recovery time. For rollout, I suggest a 6-month pilot in engineering first, with clear metrics for evaluation.

  For the VP's position, I'll steelman it: deep work requires immersion, constraints feel paternalistic, and some thrive on long hours. The counter is that systemic pressures override individual choice, leading to burnout. In the memo, I'll present this fairly before explaining why we still need intervention.

  Key empirical assumptions include whether people will disconnect if barriers exist, if managers will enforce policies, and if productivity dips short-term. Weakest link? Assuming cultural change can happen top-down when VP resistance is strong. Triggers to change the recommendation would include low compliance in the pilot or proof that off-hours work is truly critical.

  The JSON will distill this: recommendation as "protected leisure," runner-up as hard hours, confidence medium due to cultural uncertainty, and clear arrays for evidence gaps. The memo should end with a call to vote, framing this as a cultural reset rather than just a policy change.
answer: |-
  ## Pre-Steering Committee Memo: Culture & Well-being Policy Recommendation  
  **To:** People-Ops Steering Committee  
  **From:** [Your Name], People-Ops Steering Committee  
  **Date:** October 26, 2023  
  **Subject:** Recommended Policy to Address Burnout & "Colonized Leisure"  

  ### 1. The Problem: Beyond Just Hours  
  Our data confirms the CEO’s concern: our "flexibility" masks unsustainable norms. The 50+ hour median week, vacation interruptions, and burnout leaves signal a system where work bleeds into recovery time. This isn’t just about volume—it’s about the *quality* of rest. As Senior Engineer [Name] argues, when hobbies become "upskilling" and weekends are mere "recovery buffers," **leisure ceases to be restorative**. The Greek root *scholē* (leisure) as the origin of "school" reminds us that true learning and creativity require undefended space.  

  ### 2. Steelmanning the VP’s Position: The Dignity of Deep Work  
  VP [Name]’s view deserves serious engagement:  
  - **The Core Truth:** For craftspeople (like many engineers), immersion *is* fulfilling. Flow states require uninterrupted time, and externally imposed limits can feel infantilizing.  
  - **The Risk:** Top performers may resent constraints, seeing them as distrust. Mandated disconnection could disrupt deep work cycles or critical projects.  
  - **The Principle:** Adults should own their time. A culture celebrating passionate contribution isn’t inherently toxic—it can be aspirational.  

  This isn’t mere stubbornness; it’s a defense of autonomy and craft. Our solution must respect this while preventing systemic exploitation.  

  ### 3. Evaluating the Proposals  
  - **Hard 35-Hour Week (Option 1):**  
    *Pros:* Clear, measurable, forces prioritization.  
    *Cons:* Inflexible for creative work; may drive hours underground; ignores "always-on" anxiety.  
    *Fit:* Addresses hours but not recovery quality. High enforcement burden.  

  - **Unlimited PTO + Sabbaticals (Option 2):**  
    *Pros:* Signals trust; attractive for recruitment.  
    *Cons:* **We know it fails:** Our past trial reduced vacation usage. "Unlimited" often becomes "unclaimed" without psychological safety to disconnect. Sabbaticals help few; burnout affects many daily.  
    *Fit:* Perpetuates the status quo with a veneer of generosity.  

  - **Protected Leisure (Option 3):**  
    *Pros:* Directly attacks "colonized leisure" by creating *non-negotiable recovery zones*. No off-hours emails = mental safety. Laptop surrender = true detachment. Monthly closure = collective reset.  
    *Cons:* Requires tech enforcement (e.g., delaying emails); cultural shift hardest to measure; may frustrate night owls.  
    *Fit:* Aligns with data showing burnout stems from constant accessibility, not just hours. Treats symptoms *and* cause.  

  ### 4. Recommendation: Protected Leisure Pilot (with Safeguards)  
  **We endorse Option 3 ("Protected Leisure") for a 6-month Engineering Pilot**, modified to address concerns:  

  #### Core Components:  
  - **Digital Curfew:** No email/Slack delivery 8 PM–8 AM (tools delay messages). Urgent? Call.  
  - **Vacation Sovereignty:** Mandatory 5-day minimum consecutive vacation quarterly, **with physical laptop surrender to HR**.  
  - **Recharge Fridays:** Company-wide closure on the last Friday of each month.  
  - **Weekend Integrity:** No non-urgent Slack/email Sat-Sun. Urgency defined as ">$10k revenue loss or critical system down."  

  #### Pilot Rollout (Engineering Dept):  
  - **Month 1:** Tech setup (email delays, Slack snooze), manager training, VP/engineer co-created "urgency" criteria.  
  - **Months 2–6:** Pilot runs. Track:  
    - Burnout symptoms (bi-monthly micro-surveys)  
    - Vacation usage vs. pre-pilot  
    - Off-hours message volume  
    - Productivity metrics (commit frequency, incident response)  
  - **Enforcement:** Managers accountable for team compliance; VP [Name] sponsors pilot fairness.  

  #### Why This Works:  
  - **Respects Craft:** Deep work hours remain self-directed; constraints only apply to *encroachment on rest*.  
  - **Targets Root Cause:** Creates "sacred space" for recovery, making leisure *leisure* again.  
  - **Measurable:** Pilot data validates or disproves the theory.  

  ### 5. What Would Change Our Mind  
  **Flip triggers during/after pilot:**  
  - Sustained productivity drop (>15%) not offset by retention gains.  
  - Widespread resentment from engineers (e.g., >30% feel constrained).  
  - Evidence that off-hours work is *genuinely critical* >50% of the time.  
  - VP coalition demonstrates a better, data-backed plan addressing "colonized leisure."  

  ### 6. Weakest Link in Our Reasoning  
  **Assumption:** That policy-enforced boundaries can reshape deep-seated cultural habits *without* full leadership buy-in. If VP [Name]’s group undermines the pilot as "paternalism," compliance may fail, invalidating the test. Success requires his engaged skepticism, not resistance.  

  ---

  ### Recommendation Summary (JSON)

  ```json
  {
    "recommendation": "Protected Leisure Pilot (digital curfew, enforced vacation/laptop surrender, monthly closure) for Engineering, 6-month trial.",
    "runner_up": "Hard 35-hour week with strict logging (measurable but inflexible).",
    "confidence": "Medium",
    "strongest_case_for_the_losing_side": "VP's view: Passionate professionals lose deep work autonomy and feel distrusted when policy overrides personal agency.",
    "key_empirical_assumptions": [
      "Engineers will disconnect if barriers exist (vs. finding workarounds)",
      "Managers will enforce laptop surrender/vacation compliance",
      "Productivity loss from reduced hours is offset by reduced burnout/attrition"
    ],
    "what_would_change_our_mind": [
      "Productivity drop >15% without retention gains",
      ">30% engineer resentment in pilot feedback",
      "Proof that off-hours work is critical >50% of time",
      "VP coalition presents superior data-backed plan"
    ],
    "weakest_link_in_reasoning": "Underestimating cultural inertia: VP resistance could sabotage pilot adoption, making failure self-fulfilling without his authentic engagement."
  }
  ```

  **Recommended Vote:** Approve Protected Leisure Pilot with Engineering.  
  **Time:** Let’s build a culture where leisure is *leisure*, not work prep.
