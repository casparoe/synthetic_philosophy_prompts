prompt: |-
  I'm a science and ideas journalist and I've somehow talked my editor into a 1,200-word feature on whether numbers exist. The framing is a genuine argument among philosophers that most readers have never heard of, not a "wow, maths is beautiful" piece. Don't write the feature for me and don't explain platonism vs nominalism to me -- I need the plan for how the explanation should go, since I'll be the one teaching it to readers. Specifically: what has to be established first before the question "do numbers exist?" stops sounding like nonsense to a general reader (I suspect I can't just open with it), which single example should carry the whole thing and what it has to do that other examples can't -- and tell me why the obvious candidates (Plato's cave, or "the number 2 is a set", or engineering blueprints that exist before the bridge) fail or half-fail, one piece of notation or machinery I'm allowed to introduce and where, the misconceptions readers will arrive with or form partway through (my guesses: that platonism is literally about a spooky realm you visit, that if numbers don't exist then arithmetic is somehow false, and that Gödel settled this) and where in the sequence I need to cut each one off, and how I'll know by the end of the piece whether a reader has actually got the question rather than just been amused by it. Also tell me what to explicitly refuse to cover in 1,200 words and say so out loud to the reader. Two conditions on your answer: use British English, and keep clearly separate what's settled background versus what's genuinely contested among philosophers who work on this -- I don't want to hand my readers some fighting-position on indispensability or Benacerraf's epistemological challenge as if it were the consensus view. If you think my framing itself smuggles in something contested, say that too rather than playing along.
reasoning: |-
  Okay, the user is a science and ideas journalist working on a 1,200-word feature about whether numbers exist. They need a structured plan to explain this philosophical debate to general readers without writing the piece for them. Let me unpack their requirements.

  First, the core challenge: making "do numbers exist?" feel like a meaningful question to readers who might initially find it nonsensical. The user wants to avoid opening with it directly. I need to identify the foundational concepts that must be established first. Probably starting with concrete, everyday experiences of numbers and then highlighting the gap between physical objects and abstract concepts. 

  The user emphasizes using one central example to carry the argument. They've mentioned common pitfalls like Plato's cave (too mystical), sets as definitions (formalist distraction), or blueprints (misplaced concreteness). The example needs to be universal and inarguable—like "2 apples + 2 apples = 4 apples" versus the abstract "2+2=4." This demonstrates the leap from physical counting to abstract truth. 

  Notation-wise, introducing ℕ for natural numbers seems efficient. It's minimal and avoids formal system rabbit holes. Place it after establishing abstract arithmetic to signify the "territory" philosophers debate. 

  Misconceptions to address: Platonism as a literal realm (cut off early by clarifying "realm" as metaphorical), arithmetic being false if numbers don't exist (counter with fictionalist positions), and Gödel "settling" things (explicitly state his work didn't resolve ontology). These need strategic placement in the narrative flow. 

  The user wants to clearly separate settled background (e.g., abstract arithmetic's effectiveness) from contested claims (indispensability arguments, Benacerraf's challenges). Must flag if their framing smuggles in assumptions—like mentioning "indispensable" might imply an uncontested link to existence. 

  For reader comprehension checks: End with a litmus test question forcing application of nominalism vs. Platonism to a new scenario (e.g., laws of physics). Explicitly exclude formalist debates, radical skepticism, and historical deep dives due to word limits. 

  British English requirement: Using "maths," "plough," etc., consistently. Also, maintaining a neutral tone while highlighting philosophical divides without endorsing any school.
answer: |-
  Here’s a structured plan for your feature, adhering to your specifications (British English throughout, clear separation of settled/contested points, and pre-empting misconceptions). The goal is to make the ontological question visceral without drowning readers in jargon.

  ---

  ### **1. Hook & Establishing the Problem (200 words)**
  - **Open not with numbers, but with counting**: Describe a universal act (counting sheep, bus seats, chess pieces). Emphasise that *counting works* – it’s reliable, predictive, and shared across cultures.
  - **Pivot to abstraction**: "But when you count *three* chess pieces, where is the ‘threeness’? It vanishes if you burn the pieces. Yet ‘3’ itself feels real – you can use it to count anything." Highlight the gap: physical things perish, but numbers seem eternal and intangible.
  - **Frame the question**: "This gap forces a bizarre question: do numbers *exist* independently, like mountains, or are they human inventions, like rules of cricket?"

  ### **2. What Must Be Established First (Settled Background, 250 words)**
  Readers must grasp **three non-negotiable points** before the question makes sense:
  1. **Numbers ≠ numerals**: "2", "II", and "two" are symbols. The *thing* they point to (if any) is the issue.
  2. **Arithmetic is objective**: "2 + 2 = 4" is true regardless of culture, language, or whether apples exist. Denying this leads to absurdity (e.g., paying £4 for two £2 coffees). *This truth needs no ontology yet.*
  3. **Physicality isn’t the only existence game**: Briefly note we accept non-physical things exist (e.g., laws, debts, fictional characters in stories) under certain criteria. The debate is about *what criteria* numbers meet.

  ### **3. The Single Example: "2 + 2 = 4" (250 words)**
  - **Why this carries the piece**:
    - **Universal**: Every reader knows it’s unshakeably true.
    - **Exposes the rift**: *Why* is it true? If numbers are just names we invent (like "unicorn"), why can’t we decree "2+2=5"? Yet we can’t – it breaks everything. Its truth *constrains* us.
    - **Avoids technical traps**: Sets, blueprints, or Plato’s Cave add layers of interpretation. This is raw and inarguable.
  - **Why other examples fail**:
    - *Plato’s Cave*: Mystifies "realm" talk; sounds like Narnia.
    - *"2 is {{∅,{∅}}}"*: Formalist definition; doesn’t prove existence, just how we model it.
    - *Blueprints*: Confuses abstract design with physical instantiation. Numbers aren’t designs *for* objects; they’re constituents of descriptions.

  ### **4. The Core Debate: Staking Positions (300 words)**
  - **Platonism (Contested)**: Numbers exist objectively, non-physically, and independently of minds. "2 + 2 = 4" is true because it describes relationships in this abstract "realm". *Crucially clarify: "Realm" is metaphorical – not a place, but a mode of existence.*
  - **Nominalism (Contested)**: Numbers are useful fictions (tools, concepts, or linguistic constructs). "2 + 2 = 4" works because of how we *use* number-words or structures in the world, not because "4" exists out there.
  - **Introduce ONE notation**: **ℕ** (natural numbers). Use it *after* explaining the positions to symbolise "the alleged territory" philosophers fight over. *"Platonists see ℕ as a landscape to explore; nominalists see it as a map we drew."*

  ### **5. Cutting Off Misconceptions (Timing & Wording)**
  - **"Platonism = spooky realm"**: Cut early, when introducing Platonism. *"This isn’t ghosts or alternate dimensions – it’s a claim about objective truth residing beyond space and time."*
  - **"If numbers don’t exist, arithmetic is false"**: Cut when contrasting positions. *"Nominalists don’t deny 2+2=4 works; they deny it requires mystical objects to ‘work’."*
  - **"Gödel settled this"**: Cut post-debate. *"Gödel showed arithmetic is incomplete, not that numbers live in a platonic heaven. His work fuels arguments on both sides."*

  ### **6. How to Know Readers "Get" It (100 words)**
  End with a **litmus test**: Pose a fresh question forcing application.  
  *"If we discovered aliens who calculate flawlessly but insist numbers are fictional tools (like chess rules), would they be wrong? Or just nominalists? Your answer reveals whether you’ve grasped the rift."*  
  *(Platonists: Yes, aliens are wrong; numbers are real. Nominalists: No; they just describe reality differently).*

  ### **7. Explicit Exclusions (50 words)**
  *"We’ve spared you: formalist maths (where maths is symbol games), radical scepticism (denying 2+2=4), and historical deep-dives (sorry, Pythagoras). This is about existence, not practice."*

  ---

  ### **Key Contested vs. Settled Points (For Your Clarity)**
  | **Settled Background**                          | **Genuinely Contested**                                  |
  |-------------------------------------------------|----------------------------------------------------------|
  | Numbers ≠ numerals                              | Whether numbers exist independently of minds/objects    |
  | Arithmetic is objective & indispensable         | *Why* arithmetic works (Platonist truth vs. Nominalist utility) |
  | Physical objects ≠ only existents               | Whether "abstract objects" are a coherent category       |
  | Debates use logic/rigour (no appeals to magic)  | Epistemology (How could we "access" abstract objects?)  |
  | ---                                             | Benacerraf’s challenges (epistemic & semantic)          |
  | ---                                             | Indispensability Arguments (Quine-Putnam)               |

  ### **Framing Check**
  Your request avoids smuggling in contested views *except* potentially "indispensability". Calling maths "indispensable" is fine (settled), but implying indispensability *entails* existence (à la Quine) is contested. **Fix**: Present indispensability as a *motive* for Platonism ("If maths is indispensable to science, maybe it’s real?"), not proof.

  ### **Why This Sequence Works**
  1. **Starts concrete** (counting) → **reveals tension** (abstraction) → **poses question**.
  2. **Isolates the ontological leap** using an undeniable truth ("2+2=4").
  3. **Uses minimal jargon**, demystifies "realm", pre-empts myths.
  4. **Contrasts positions on shared ground** (why does maths work?).
  5. **Tests comprehension** with an alien thought experiment.

  This gives readers the conceptual toolkit to *feel* the weight of the question – not just giggle at philosophers "arguing about nothing". Good luck!
