  Failure conditions matter—this fund will appreciate honesty. If animal-hours prove incoherent, the project still succeeds by exposing that. Output: A decision tree for researchers, not a definitive answer. 

  Tone check: Avoid academic jargon. Use "plowing kills field animals" not "tillage-induced mortality." Their voice should stay visible—this isn’t a philosopher’s paper but a practitioner’s systematic inquiry. 

