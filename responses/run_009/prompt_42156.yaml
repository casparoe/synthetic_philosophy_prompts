   2. We need to design questions that test for the following features:

      Darwinian: Hardwired behavior only. No learning, or learning that is extremely constrained (e.g., fixed action patterns). Any change in behavior is due to evolution over generations.

      Skinnerian: Learns by trial and error in the environment. Can form new associations and change behavior within its lifetime, but only through direct experience (operant conditioning). Does not show evidence of mental simulation or planning.

      Popperian: Can simulate trials internally. This implies the ability to plan, to consider alternatives without acting them out, and to learn from mistakes without suffering the consequences. This often involves problem-solving that shows insight.

      Gregorian: Uses tools (including cultural tools, language, symbols) to enhance thinking. This often involves social learning, teaching, and the accumulation of cultural knowledge.

   3. We must be cautious with:
      - Social learning: If an animal imitates but without understanding, it might be considered Skinnerian (if the learning is by trial and error) or Gregorian (if it involves understanding and teaching). But note that Dennett's Gregorian is about using tools (especially symbolic) to bootstrap cognition.
