prompt: |-
  I've been reading the rationalist blogosphere since the old Sequences days, and one argument that recurs there without ever being settled — it surfaces in every wild-animal-suffering thread, every digital-minds thread, every argument about whether a superintelligence should tile the universe with hedonium or with satisfied preferences — is the fight between hedonic and preference utilitarianism. My sense is that this fight almost never gets argued at its actual root: whether the badness of pain is exhausted by pain's relations to the subject's attitudes, or whether there is something intrinsically bad in the sensation itself. Pain asymbolia is the natural laboratory for this question, but discussions I've seen always run the experiment in only one direction — lesion the distress, keep the feel, and ask whether what remains is still bad. I want the experiment run properly, as a controlled design.

  Construct a thought experiment with four subjects, arranged as a two-by-two: one dimension is the phenomenal character of the pain (the raw sensory-discriminative feel, its intensity and location-quality), the other is the aversive-motivational component (the felt badness, the urgency to make it stop, the distress). The four cells: a normal subject with both components; an asymbolic subject with the full sensory feel but no distress or urge to escape; and then the cell I never see discussed — an "inverse asymbolic" subject who has the aversiveness without the characteristic bodily feel, someone for whom something is urgently, intolerably wrong without anything feeling like burning or aching; and a fourth subject with neither. Constraints: keep all four realistic — ground each cell where you can in phenomena that are actually attested (asymbolia itself, congenital insensitivity to pain, the well-known observation that morphine can leave patients reporting pain that no longer bothers them), and explicitly flag which cells are extrapolation beyond anything documented. No brain swaps, no demons, no sci-fi gadgetry, and no subjects who are unable to report on their own states. One tight paragraph per subject.

  Then run the design. State, for each of the four subjects, what the pain (or pseudo-pain) is like and whether it is bad for them, and do this three times over — once from the view that pain's badness is intrinsic to its hedonic or sensory feel, once from the view that the badness just is the aversive-motivational component (the imperative to stop, which asymbolia is standardly taken to support), and once from a preference-based view on which nothing is bad for you unless it contravenes something you care about. Tell me which cell does the real discriminating work between the three views, what happens to the argument if that cell turns out to be empirically impossible, and how a defender of whichever view comes out worst would attack the case — whether by denying the possibility of the inverse-asymbolic subject, by reinterpreting their reports, or by biting a bullet. Finally, say what the case implies for the hedonic-versus-preference utilitarian fight I started with: if you had to build a moral patient out of one of the four subjects, which one would you choose, and what does that choice commit you to? I don't want a survey of the literature — I want the case built, the verdicts demonstrated rather than stipulated, and your own conclusion defended at the end.
reasoning: |-
  Okay, the user is diving deep into a classic debate in rationalist circles: hedonic vs. preference utilitarianism, using pain asymbolia as a focal point. They want a controlled thought experiment with four subjects to test the core disagreement—whether pain's badness is intrinsic or relational. 

  First, I need to unpack their request. They're frustrated that discussions always fixate on standard asymbolia (sensory without distress) but ignore the inverse case (distress without sensory). Their underlying goal seems to be resolving the meta-ethical stalemate by pressure-testing all permutations. They're also hinting at practical implications: if we're building moral patients (e.g., for AI ethics), which "pain" component matters?

  The user is clearly seasoned—they cite Sequences-era knowledge, mention niche concepts like hedonium, and demand rigor ("no sci-fi gadgetry"). Their tone is impatient with superficial takes, so my response must avoid hand-waving. Key constraints: ground all cases in real phenomena (asymbolia, morphine effects, CIP), flag extrapolations, and reject hypotheticals that break verisimilitude (e.g., brain demons).

  For the four subjects:
  - Normal: Easy—standard pain, well-documented.
  - Asymbolic: Established via lesions (e.g., insular cortex damage).
  - Neither: Congenital insensitivity (CIP) covers this.
  - Inverse asymbolic: Tricky. Must extrapolate carefully. Migraine auras? Phantom limb distress? But user wants "urgent wrongness without bodily feel"—morphine's motivational removal isn't quite inverse. Best bet: analogize to anxiety disorders (panic attacks with somatic-free dread) or certain neuropathic pains. Still, I'll note this as speculative.

  Running the analysis:
  - Hedonic view: Badness sticks to sensation. Thus, inverse case isn't "pain-bad," just "distress-bad"—a win for sensation-purists.
  - Motivational view: Badness is the "stop!" signal. Asymbolia isn't bad; inverse is hell. This reframes hedonic pain as merely informational.
  - Preference view: Only contravened desires matter. All four cases could be neutral if no desire opposes the state (e.g., masochists). Forces us to ask: do these subjects *care*?

  The inverse subject is the linchpin. If impossible, motivational view dodges a bullet; if possible, hedonic view must explain why non-sensory distress is "bad" without sensation. Hedonic utilitarians might bite the bullet on inverse being non-pain suffering, but that feels ad hoc.

  User's final Q: Which subject to build a moral patient? Hedonic purists pick normal sensation; motivationalists pick inverse distress; preference folks demand context (what does the patient want?). My take: motivational view wins—it captures the core "badness" (suffering = unendurable experience demanding cessation), whether tied to body or not. But preference view has teeth: if a subject truly doesn't care, is it suffering? (Think enlightenment monks.) Still, for practical ethics, the involuntary urgency in normal/inverse cases seems more universally bad. 

  Biggest hole: Can the inverse case exist? If not, motivational view collapses into hedonic view. But panic disorders suggest yes—pure, objectless dread feels "bad" without burning. That’s my empirical wager.
answer: |-
  Here is the constructed thought experiment, analyzed rigorously across all three frameworks:

  **The Four Subjects**  
  1. **Normal Subject**: Full sensory-discriminative pain (e.g., sharp burning in hand) with intact aversive-motivational component (distress, urge to withdraw). *Attested*: Baseline human pain response.  
  2. **Asymbolic Subject**: Full sensory intensity/location ("burning at 7/10") but no distress, no motivation to escape. Reports sensation neutrally. *Attested*: Pain asymbolia from insular cortex lesions.  
  3. **Inverse Asymbolic Subject**: No localized sensory quality (no "burning," "aching," etc.), but intense aversive-motivational state ("urgent, global wrongness; must make *something* stop"). *Extrapolation*: Analogous to morphine’s motivational removal but reversed; grounded in non-somatic suffering (e.g., panic attacks without somatic triggers, severe akathisia).  
  4. **Neither Subject**: No sensory pain quality and no aversive-motivational state. *Attested*: Congenital insensitivity to pain (CIP) with no distress.  

  ---

  **Analysis per Ethical Framework**  
  *(Assume all subjects experience stimuli causing equivalent neural activation in pain-related pathways, differing only in component segregation)*  

  1. **Hedonic Utilitarianism (Badness intrinsic to sensory feel)**:  
     - **Normal**: Bad. Sensory pain present.  
     - **Asymbolic**: **Bad**. Sensory pain identical; motivational deficit irrelevant.  
     - **Inverse Asymbolic**: *Not bad*. No "painful" sensation; distress is non-hedonic.  
     - **Neither**: Not bad.  

  2. **Motivational Utilitarianism (Badness *is* the aversive drive)**:  
     - **Normal**: Bad. Drive present.  
     - **Asymbolic**: *Not bad*. No drive despite sensation.  
     - **Inverse Asymbolic**: **Bad**. Drive present without sensory correlate.  
     - **Neither**: Not bad.  

  3. **Preference Utilitarianism (Badness requires contravention of preferences)**:  
     - **Normal**: Bad *iff* subject has a preference against pain (assumed yes).  
     - **Asymbolic**: *Not bad*. No preference to avoid the sensation (indifference reported).  
     - **Inverse Asymbolic**: Bad *iff* subject has a preference against the distress state (likely yes; "make it stop" implies contravention).  
     - **Neither**: Not bad (no preferences engaged).  

  ---

  **Discriminating Work & Empirical Challenges**  
  - **Key Discriminator**: The **inverse asymbolic** subject forces divergence. Hedonic utilitarianism denies its suffering is "pain-bad"; motivational utilitarianism affirms it; preference utilitarianism depends on contingent attitudes.  
  - **If Inverse Asymbolia is Impossible**: Motivational utilitarianism collapses into hedonic view (since no empirical case separates them). Hedonic utilitarians would argue this validates their position: aversiveness cannot exist without sensory grounding.  
  - **Counterattacks**:  
    - *Hedonic view defender*: Bites the bullet on inverse asymbolia: "The distress is 'bad' but not *pain*-bad—it's anxiety, not pain. Pain requires sensory quality." Attacks inverse case as incoherent: "No pain without *feeling*."  
    - *Preference view defender*: Accepts all reports at face value but argues asymbolic/inverse cases prove badness is attitude-dependent: "No frustration of preference? Not bad *for them*."  

  ---

  **Implications for Moral Patienthood**  
  To build a moral patient:  
  - **Choose the Inverse Asymbolic Subject**. It isolates *suffering* (aversive drive) without sensory confounds. This commits you to:  
    - **Rejecting hedonism**: Moral weight derives from motivational states, not qualia.  
    - **Affirming motivational core**: Suffering is the imperative "this must not be," regardless of sensory labels.  
    - **Ambiguity on preference**: If the subject lacked a preference against distress (e.g., welcomed it), preference utilitarianism would deny suffering—but the aversive drive’s phenomenology suggests intrinsic urgency.  

  **Conclusion**: The inverse asymbolic case demonstrates that pain’s *badness* resides in the aversive-motivational component, not the sensory quality. Hedonic utilitarianism fails to explain why non-sensory distress is intolerable; preference utilitarianism overgeneralizes to attitude-contingency. Motivational utilitarianism captures the unifying feature: the intrinsic "not-this!" imperative. Thus, for moral patienthood, the capacity for *inescapable aversive drive*—present in normal and inverse subjects—is necessary and sufficient. The centuries-old debate resolves by decoupling suffering from sensation.  

  ---  
  **Defense of Verdict**:  
  - Empirical grounding: Morphine and asymbolia prove sensation/aversiveness dissociable. Inverse case extends this via anxiety-like states, avoiding sci-fi.  
  - Hedonic bullet-biting (denying inverse suffering) is counterintuitive: global distress without cause is *worse* than localized pain.  
  - Preference views implausibly allow suffering if preferences align (e.g., "I desire my torture"). The *involuntary* drive in normal/inverse cases is what demands moral attention.  
  - Thus, tiling the universe requires avoiding inescapable aversive states—not "pain" or "frustration," but *inescapable negative urgency*.
