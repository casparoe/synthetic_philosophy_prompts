  The user mentioned that some commentators see Hacking as "a Kuhn for the human sciences," but Hacking resisted that. I should clarify the differences. Hacking emphasizes the interactive nature of human classifications, where the subjects react to the labels, which isn't present in natural sciences. Kuhn's work is more about incommensurability and theory replacement without the subjects' awareness affecting the science.

  For DSM changes, the process involves revisions every decade, increased awareness leading to more diagnoses, and the criteria evolving based on the growing population. This seems like a looping effect: the classification changes behavior (parents, clinicians identifying more cases), which then alters the classification in the next revision. But is it a paradigm shift? The DSM revisions don't throw out the entire framework; they tweak criteria within an existing structure. So it's more of a continuous adjustment rather than a revolutionary change.

  The user might be conflating two levels: the broader psychiatric paradigms (like moving from psychoanalytic to biological models) and the specific diagnostic criteria changes. The former could be Kuhnian, while the latter are looping effects. But in the case of autism/ADHD, the shifts in DSM are more iterative, so looping effects are more fitting.

  I should also address the user's deeper needs. As a scientist, they might be looking for clarity on how philosophy applies to real-world examples like DSM. They might want to understand the dynamics of change in science vs. human sciences, and how their background in chemistry contrasts with psychiatry. Emphasizing the agency of classified individuals in looping effects versus the passive natural objects in chemistry could highlight the key difference Hacking insisted on.

