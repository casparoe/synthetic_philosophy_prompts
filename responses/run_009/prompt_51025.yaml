  Here are eight scenarios for your epistemic injustice quiz, designed to distinguish the four positions through concrete cases. Each scenario presents a situation where the positions yield different diagnoses. Answer options focus on the core problem or primary remedy, avoiding direct references to the theoretical labels. After the questions, you'll find scoring instructions to map responses onto the four positions.

  1. A patient with severe chronic pain seeks medical help. Despite detailed descriptions, doctors dismiss their reports, suggesting it's "psychological." The patient feels unheard. What's the primary issue? Option A: The doctors' failure to trust patient testimony due to ingrained biases. Option B: Medicine's lack of frameworks for subjective pain experiences, requiring new diagnostic categories. Option C: Doctors could recognize the pain but refuse to adjust their clinical gaze beyond objective metrics.  

  2. A factory worker witnesses a safety violation but speaks in a thick regional dialect. The manager, who could decipher it with effort, dismisses the report as "unintelligible." What's the core wrong? Option A: The manager's laziness in listening, needing better attentiveness. Option B: Absence of shared linguistic protocols for diverse speech in workplace safety systems. Option C: The manager actively rejects intelligible testimony due to class prejudice.  

  3. A community experiences workplace coercion that doesn't fit legal "coercion" definitions. Victims can't articulate the harm, and complaints are labeled "confused." What's key? Option A: Authorities should charitably interpret complaints despite conceptual gaps. Option B: The injustice stems from underdeveloped social vocabulary; we need new terms. Option C: The problem is non-epistemic—it's about power imbalances exploiting conceptual voids.  

  4. An Indigenous elder shares an ecological insight using metaphors unfamiliar to policymakers. They deem it "irrational" without seeking clarification. What's central? Option A: Policymakers' lack of humility in engaging unfamiliar knowledge traditions. Option B: Institutional discourse lacks tools to translate cross-cultural wisdom, demanding resource development. Option C: Policymakers resist using their capacity to grasp metaphors due to colonial attitudes.  

  5. A trans person describes gender dysphoria to a therapist using emerging community terms. The therapist calls it "made-up," though they could parse it. What's fundamental? Option A: The therapist's closed-mindedness about evolving language. Option B: Clinical psychology's outdated frameworks fail to capture these experiences, necessitating paradigm shifts. Option C: This is discrimination disguised as epistemic evaluation; no unique epistemic harm exists.  

  6. A refugee's trauma narrative is disbelieved by an immigration judge who expects linear storytelling. The refugee's fragmented account is coherent within their cultural context. What's pivotal? Option A: The judge's rigidity in credibility assessments, requiring cultivated flexibility. Option B: Legal systems lack narrative templates for non-Western trauma expression, needing structural adaptation. Option C: The judge refuses to extend interpretive effort despite having the cognitive capacity.  

  7. Low-wage workers report wage theft via complex payroll schemes. Lawyers call their accounts "incoherent," though patterns emerge with scrutiny. What's essential? Option A: Lawyers' dismissiveness stems from class bias; they need virtuous listening. Option B: Labor law has no constructs for emergent exploitation tactics, demanding conceptual innovation. Option C: The harm is purely economic; epistemic elements are incidental to the injustice.  

  8. An autistic researcher presents a breakthrough using atypical analogies. Peers dismiss it as "illogical" without engaging its internal consistency. What's crucial? Option A: Peers' intellectual arrogance in rejecting unconventional reasoning. Option B: Scientific communication norms exclude neurodiverse modes of argument, requiring inclusive redesign. Option C: Peers could follow the logic but disdain nonconformity, reflecting ableism.  

