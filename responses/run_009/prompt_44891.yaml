prompt: |-
  So I TA for an intro ethics course, and this week we're covering supererogation — acts that are good to do but not wrong to skip. I want to build a handout where a bunch of acts get placed on a spectrum, with tiers running roughly from "you're kind of a jerk if you don't do this" up to "saintly, no reasonable person could demand this of you". Then in class the students have to argue about whether the acts landed in the right tier.

  Here's the list I've got so far. Put each act in a tier (rename or add tiers if you want), give a one-sentence reason, and flag the ones you think are genuinely borderline rather than just quietly placing them:

  - giving up your bus seat for someone who looks tired
  - donating blood every couple of months for years on end
  - giving 10% of your income to effective charities
  - donating a kidney to a stranger while you're alive
  - falling on a grenade to save five comrades
  - forgiving someone who badly wronged you and never apologized
  - staying late at work, unpaid, to help a coworker hit a deadline
  - keeping a promise that has become very costly to keep
  - calling out your boss over a racist joke at a work dinner

  Two things I keep going back and forth on, would love your take: (1) a few of these seem to change tier depending on how long you've been doing them — the person who's donated blood for 30 years is a local hero, but the person who did it for 10 years and then quietly stopped gets side-eyed, as if the repeated supererogatory acts slowly turned into a duty. Is there any principled way to deal with acts that become expected over time, or do I just have to tell the students "it's messy"? (2) forgiveness — I honestly can't decide if it's an act at all (something you do) or more like a feeling you can't just decide to have. If it's the latter, can it even be supererogatory, or is it in the wrong category altogether? Maybe it deserves its own tier with a note that it's arguement for the students rather than an answer.

  Keep it casual, this is a handout not a textbook — definately no footnotes. Thanks!
reasoning: |-
  Okay, the user is a TA for an intro ethics course focusing on supererogation. They want to create a handout where students place acts on a spectrum from obligatory to saintly. The main goals are to categorize the listed acts into tiers, provide one-sentence reasons, flag borderline cases, and address two specific concerns: acts becoming duties over time and the nature of forgiveness.

  First, I need to understand supererogation. Supererogatory acts are good but not required. The spectrum ranges from mildly expected to extremely heroic. The user's list includes various examples, and each needs placement. 

  Looking at the acts:
  - Giving up a bus seat: This is minor. It's polite but not mandatory. Probably Tier 1.
  - Donating blood regularly: Doing it for years might build expectation. Should be Tier 2, but the time aspect is tricky.
  - Giving 10% to charity: Effective altruism suggests this is more expected, but still not obligatory. Borderline between Tier 2 and 3.
  - Donating a kidney: Major sacrifice, definitely Tier 4.
  - Falling on a grenade: Ultimate sacrifice, Tier 5.
  - Forgiveness: Complex. Is it an action or a feeling? If it's a decision to forgive, it's supererogatory, but forced forgiveness isn't. Borderline.
  - Staying late unpaid: Helps a coworker but risks exploitation. Tier 2.
  - Keeping a costly promise: Duty-based, but cost might push it to Tier 3.
  - Calling out a boss: Morally important but risky. Could be Tier 2 or 3.

  Handling the time aspect: Acts like donating blood regularly can become expected. Maybe note that repetition creates social pressure, turning voluntary acts into quasi-duties. Advise students it's messy but discuss why expectations shift.

  Forgiveness: It's both an act and a feeling. The decision to forgive can be supererogatory, but it's personal. Flag it as borderline and let students debate.

  Tiers structure: Need clear progression. Tier 1 (Minor Decency), Tier 2 (Above & Beyond), Tier 3 (Significant Burden), Tier 4 (Life-Altering Sacrifice), Tier 5 (Extraordinary Heroism).

  Borderline cases: Charitable giving (10%), forgiveness, and keeping costly promises. Highlight these for discussion.

  User's deeper needs: They want to stimulate debate, not provide answers. The handout should encourage critical thinking. Also, keep it casual and engaging without academic jargon.

  Finalizing the handout: Group acts into tiers with brief reasons. Add notes on repetition and forgiveness. Emphasize that borderlines are for discussion. Make sure the tone is approachable for intro students.
answer: |-
  Here's a handout draft designed to spark debate! Remember, ethics is messy – the point is the argument, not the "right" answer.

  ---

  **Supererogation Spectrum: From Jerk-Move Avoidance to Sainthood**

  **Instructions:** Below are various acts. Place each one on the spectrum using the tiers. Be ready to argue *why*! Some are genuinely tricky ("borderline") – we've flagged those.

  **The Tiers:**
  1.  **Minor Decency:** Skipping this makes you look kinda lazy/selfish, but it's not *wrong*. ("Don't be *that* person.")
  2.  **Solidly Above & Beyond:** Clearly good, praiseworthy, but skipping it doesn't make you a bad person. ("Good Samaritan" territory.)
  3.  **Significant Burden / High Demand:** Requires real sacrifice (time, money, comfort). Praiseworthy to do, but *very* understandable to skip. ("Wow, that's a lot to ask.")
  4.  **Life-Altering Sacrifice:** Involves major personal cost (health, livelihood, profound risk). Deeply admirable, but *no one* could reasonably demand it. ("Saintly/Heroic" level.)
  5.  **Extraordinary Heroism:** Involves near-certain or ultimate sacrifice for others. Beyond what any society could ever expect. ("Legendary" status.)

  **The Acts:**

  1.  **Giving up your bus seat for someone who looks tired:** Tier **1 (Minor Decency)**  
      *Reason:* Basic courtesy with minimal cost, skipping it leans towards inconsiderate.
  2.  **Donating blood every couple of months for years on end:** Tier **3 (Significant Burden / High Demand)** *(See Note 1 below!)*  
      *Reason:* Sustained commitment involving discomfort/time, but minimal long-term risk for immense benefit.
  3.  **Giving 10% of your income to effective charities:** Tier **2-3 Borderline!** *(Solidly Above & Beyond / Significant Burden)*  
      *Reason:* Highly impactful good, but significant financial sacrifice makes it demanding (depends heavily on income!).
  4.  **Donating a kidney to a stranger while you're alive:** Tier **4 (Life-Altering Sacrifice)**  
      *Reason:* Major surgery, permanent physical change, and non-trivial risk undertaken purely for a stranger's benefit.
  5.  **Falling on a grenade to save five comrades:** Tier **5 (Extraordinary Heroism)**  
      *Reason:* Ultimate sacrifice, knowingly giving your life instantly to save others.
  6.  **Forgiving someone who badly wronged you and never apologized:** Tier **? Borderline!** *(See Note 2 below!)*  
      *Reason:* Can be incredibly difficult and morally significant, but also deeply personal and arguably not a simple "act". *(Placement Hotly Debated!)*
  7.  **Staying late at work, unpaid, to help a coworker hit a deadline:** Tier **2 (Solidly Above & Beyond)**  
      *Reason:* Kind and helpful, involving personal time sacrifice, but context-dependent (don't get exploited!).
  8.  **Keeping a promise that has become very costly to keep:** Tier **2-3 Borderline!** *(Solidly Above & Beyond / Significant Burden)*  
      *Reason:* Upholding integrity is important, but the level of unexpected cost determines if it's just commendable or a major burden.
  9.  **Calling out your boss over a racist joke at a work dinner:** Tier **2 (Solidly Above & Beyond)**  
      *Reason:* Morally important but involves significant social/professional risk and discomfort (doing the *right* thing isn't always easy!).

  ---

  **Key Notes for Discussion:**

  1.  **The "Expectation Creep" Problem (e.g., Blood Donation):** You're spot on! Acts repeated consistently (like donating blood for decades) can *feel* like they become an unspoken duty. Society might start to *expect* it from *you specifically*, and stopping might get side-eye. **Is this fair?** Ethically, the act itself hasn't changed – it's still supererogatory. The "duty" feeling comes from social pressure, habit, or your past choices setting a pattern. **Principled take?** The core act remains supererogatory; the social fallout for stopping is a separate issue about expectations and reputation. **So yeah, it's messy!** Discuss how repetition changes perception, even if the moral demand doesn't fundamentally change.
  2.  **The Forgiveness Puzzle:** Big mood! Forgiveness is complicated. **Is it an act?** Often, it starts as a *decision* (an act) to let go of resentment and *not* seek payback, even if the *feeling* of being hurt lingers. **Can it be supererogatory?** Deciding to forgive an unrepentant wrongdoer often involves overcoming immense hurt and forgoing deserved resentment/retribution – that *decision* can feel like going morally above and beyond. **But...** You can't *force* the feeling, and forgiveness isn't always healthy or appropriate. **Handout approach:** We flagged it as "Borderline!" and put the reason in italics to highlight the debate. Frame it as: *Can the* **decision** *to forgive (even without the feeling) be a supererogatory act?* Let the students duke this one out! It might sit awkwardly on the spectrum precisely because it blends action, emotion, and context heavily.

  ---

  **Go forth and argue! Remember: The goal is to think critically about *why* something lands where it does, not to find the One True Answer.** Good luck with the discussion!
