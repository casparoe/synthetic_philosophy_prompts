prompt: |-
  I've long carried a rough universalizability heuristic in my head — what if everyone did that? — picked up from years of rationalist blog discussions, where it usually gets dismissed either as rule consequentialism in a wig or as a fallacy of appealing to consequences. I'd like to get straight about what my actual case verdicts commit me to, so here they are, and then a tentative principle of my own for you to test and repair.

  My verdicts: Lying to obtain a loan I intend never to repay — wrong, and clearly. Free-riding on a group project while others work — wrong, though I notice the failure here feels contingent rather than logical: a world of shirkers is conceivable, just one where group projects die. Refusing to answer email except when I feel like it — fine, even though a world where everyone does this is likewise conceivable and mildly worse. A hermit's maxim of refusing all help and offering none — permissible, though cold; universalizing it yields an austere world but no contradiction I can find. Cutting in line whenever I'm in a hurry — wrong, and here is my problem: structurally this looks just like the email case, universal line-cutting is conceivable and merely unpleasant, yet I cannot bring myself to mark it fine the way I do for email. Letting one's talents rust — wrong, I think, but I can't identify any practice the act relies on in refraining, so if that verdict stands, my principle needs a limb I can't supply.

  My tentative principle: a maxim is impermissible when acting on it requires, in the very act, leaning on a practice or expectation that universal adoption of the maxim would erode — the false promiser needs the institution of promising; the free-rider needs the other workers; the email-slacker needs nothing. This sorts most of my verdicts, but as far as I can tell it cannot sort line-cutting from email-answering, and I keep going back and forth on tipping at restaurants in a town I'm passing through and will never revisit: the principle appears to permit it, since I depend on no continuing relationship with that server or that town, yet it smells exactly like the free-rider.

  So, three questions. Is there a single principle that captures all or nearly all of my verdicts, and if not, which is the best truncated one? What does the best candidate say about the tipping case I'm wobbling on and about the case of neglected talents? And which verdict does that candidate force me to surrender — my leniency on email, my strictness on line-cutting, or my unease about one-time tipping? Please be explicit about each place where the principle buys coverage of a verdict at the price of an ad hoc clause, since a patched-together decision procedure that merely fits the data is what I'm trying to avoid.
reasoning: |-
  Okay, let's start by unpacking the user's query. They've presented a series of moral verdicts based on a universalizability heuristic they've developed, influenced by rationalist discussions. The user is trying to reconcile their intuitive judgments into a coherent principle. Their tentative principle hinges on whether an action relies on a practice that would be eroded if everyone acted the same way. 

  First, I need to look at their specific cases: loan lying, free-riding, ignoring emails, hermit life, line-cutting, and talent neglect. They’ve noted inconsistencies, especially between email non-response and line-cutting. Both seem similar in structure—universal adoption leads to inconvenience but no logical contradiction—yet they judge them differently. That’s the core puzzle.

  The user’s proposed principle addresses cases like false promises and free-riding, where the actor depends on others' cooperation. But it fails with line-cutting because cutting in line doesn’t rely on others not cutting; it exploits their compliance. The user senses this but hasn't articulated it. Their tipping dilemma is similar: one-time free-riding feels wrong even without ongoing relationships.

  The deeper need here is for a principle that’s internally consistent without ad hoc patches. They want to avoid a "Frankenstein" rule that just matches their intuitions. They might also be seeking validation of their moral intuitions while resolving cognitive dissonance. The mention of the hermit and neglected talents suggests they’re grappling with individualism versus social obligations.

  I recall Kant’s Categorical Imperative, especially the Formula of Universal Law and the Kingdom of Ends. The contradiction in conception vs. contradiction in will distinction might help. False promises are contradictions in conception—they’re logically impossible when universalized. Free-riding and line-cutting, however, lead to a breakdown of the system, which is a practical contradiction, falling under contradiction in will. 

  But the email case is different. Universal email non-response might make communication inefficient, but it’s not impossible. People could adapt, so it passes both tests. That explains why the user sees it as permissible. Line-cutting, on the other hand, would make queuing pointless, leading to chaos. Even if conceivable, it’s unsustainable, hence a contradiction in will.

  For neglected talents, Kant’s duty to develop one’s abilities fits here. The user feels it’s wrong but can’t pinpoint why. The Kingdom of Ends perspective—where talents contribute to societal goals—provides a rationale. However, this might clash with the user’s individualism, so they need to decide if they accept this communal aspect.

  Tipping in a one-time scenario: if universalized, tipping culture collapses, servers earn less, and the practice vanishes. This is a contradiction in will. Even without personal ongoing relationships, the system relies on collective adherence. This aligns with their unease, similar to free-riding.

  The user’s challenge is balancing their libertarian leanings (email, hermit) with social obligations (tipping, talents). The principle needs to distinguish between purely self-regarding acts and those affecting systemic practices. Kant’s framework does this, but it might require accepting duties to society, which the user might resist. They’ll need to either adjust their verdict on line-cutting and tipping or accept a more communal ethic.

  In summary, the best principle combines logical and practical contradictions. The sticking points are neglected talents and the hermit. If they reject Kant’s duty to develop talents, they might need to drop that verdict. Alternatively, they could reframe talent development as self-respect rather than societal duty. For the hermit, as long as no existing practices are undermined, it remains permissible, fitting within the principle.
answer: |-
  Here's a principled framework that captures nearly all your verdicts while minimizing ad hoc patches, built by synthesizing Kantian deontology with your "practice erosion" insight:

  **The Principle:**
  *An act is impermissible if its maxim, when universalized, either:*
  1. *Creates a logical contradiction (destroying the very practice it relies on), OR*
  2. *Creates a practical contradiction by undermining a necessary condition for the agent's own rational will or essential social functioning.*

  **How it Maps to Your Verdicts:**

  1.  **Lying for a Loan:** Universalization destroys the *institution of promising/contracts* (Logical Contradiction). ✅ Matches your verdict.
  2.  **Free-Riding:** Universalization destroys *collaborative effort* needed for the project's existence (Practical Contradiction - the project/goal becomes impossible). ✅ Matches your verdict.
  3.  **Ignoring Email:** Universalization makes communication *less efficient*, but doesn't destroy the *possibility* of communication or any practice the agent *relies upon*. People adapt (e.g., urgent flags, different norms). ❌ No contradiction found. ✅ Permits your verdict.
  4.  **Hermit's Maxim:** Universalization creates an *austere world*, but no contradiction. Refusing/offering help isn't a *practice* requiring universal participation to function. The hermit isn't *relying* on others offering help while refusing to offer it themselves. ❌ No contradiction. ✅ Permits your verdict.
  5.  **Cutting in Line:** Universalization destroys the *practice of orderly queuing*. Queues only function *because* most people respect the order. Universal cutting makes queuing *pointless* and impossible (Practical Contradiction). The line-cutter *relies* on the expectation of order to benefit. ❌ Contradiction found. ✅ Matches your strict verdict.
  6.  **Neglected Talents:** **This is the weakest fit.** Universal neglect *might* undermine societal flourishing, but the agent doesn't necessarily *rely* on others developing talents in the specific act of neglecting *their own*. A Kantian might argue it violates a duty to oneself (developing capacities needed for rational agency - "Kingdom of Ends"). Our principle **struggles here**. If you hold the verdict, it requires an **ad hoc clause** (e.g., "or fails to develop essential rational capacities"). ❓ Weak match.

  **Your Tipping Case (One-Time Town):**
  *   **The Principle's Verdict:** Impermissible.
  *   **Why:** The maxim "I will not tip when I know I will never return" universalized destroys the *practice of tipping*. Tipping as an income supplement *relies* on widespread participation. Servants wouldn't work for tipped wages if no one tipped. You *rely* on the *current* system where *others* tip, enabling servers to work for lower base wages, even in this one instance. This is a **Practical Contradiction** identical to free-riding. It "smells like free-riding" because it *is* free-riding on the tipping norm.

  **What You Must Surrender:**

  1.  **Your Unease about One-Time Tipping:** The principle forces you to conclude it **is impermissible**, consistent with your free-riding verdict. Surrender the permissibility intuition.
  2.  **Your Leniency on Email?** No. The principle robustly defends its permissibility (no contradiction). Keep it.
  3.  **Your Strictness on Line-Cutting?** No. The principle robustly defends its impermissibility (practical contradiction). Keep it.
  4.  **Neglected Talents:** This is the cost. To keep your verdict (impermissible) **without an ad hoc clause**, you must surrender consistency with the core principle. The principle, as stated, **permits neglecting talents** because it finds no reliance on a practice eroded by universalization in the *act itself*. If you insist neglecting talents is wrong, you need to add a limb about duties to self/rational nature (making it less elegant).

  **Why this principle is superior to your tentative one:**

  *   **Clarifies "Leaning On":** It distinguishes between merely *benefiting* from a practice existing (Email, Hermit) and *relying on its continued function specifically for the success of your act* (False Promise, Free-Riding, Line-Cutting, Tipping).
  *   **Captures Line-Cutting vs. Email:** Line-cutting *relies* on the queue order holding for others *at that moment* to gain an advantage. Ignoring email doesn't rely on others *answering* emails for the act of *not answering* itself to succeed. The *consequences* differ, but the *reliance* is the key distinction captured by the contradiction tests.
  *   **Handles Tipping Consistently:** Explicitly shows the structural identity with free-riding on a social practice.
  *   **Minimal Ad Hoc Elements:** Only the "Neglected Talents" case requires significant adjustment if you insist on its impermissibility. The core covers the rest cleanly.

  **In Summary:**

  *   **Best Principle:** The two-part Kantian/erosion principle above.
  *   **Tipping:** Impermissible (surrender permissibility intuition).
  *   **Neglected Talents:** Permitted by the core principle (you must either surrender your "wrong" verdict or accept an ad hoc clause about self-development).
  *   **Line-Cutting & Email:** Both verdicts are robustly supported without ad hoc fixes. The distinction lies in whether the act parasitically *depends* on the norm it would destroy (cutting - yes, email - no).

  This principle respects your aversion to rule consequentialism ("merely worse world" isn't enough - see Email) and fallacy of appealing to consequences by grounding the "worse world" judgment specifically in the *self-undermining* nature of the act via the contradiction tests. It systematizes your intuitions while exposing the tension surrounding duties to self in the talents case.
