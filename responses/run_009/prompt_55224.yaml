prompt: |-
  hey, I'm a grad student writing a term paper proposal (roughly 6000 words, one semester). My half-formed idea: the whole peer disagreement fight between conciliationists and steadfasters is about what to do when one person you count as an epistemic peer disagrees with you about some proposition. But heres a case that machinery seems ill-suited for: I learn that a bunch of philosophical intuitions I have (about Gettier cases, trolleys, whatever) vary systematically across cultures, and which side of the variation I landed on was basically fixed by where I was raised. On the one hand that looks like massive disagreement with tons of people I can't just write off as non-peers. On the other hand it's not the textbook case at all: the disagreement is over intuitions that are inputs to arguments rather than conclusions of them, there's a genealogical explanation of why we diverge (an explanation of why I have the intuition, not of whether it's true), and "split the difference" sounds weird when the parties are entire populations rather than two individuals.

  My advisor thinks the idea is interesting but keeps asking what the actual question is, so I need that nailed down. Turn this into a proposal: state the question precisely (is culturally contingent variation in intuitions a genuine case of peer disagreement, a defective case, or something the framework was never meant to cover?), explain why neither the conciliationist nor the steadfast position settles it out of the box, lay out what I'd actually do section by section, say what a successful result would look like and what would count as the project failing, and be honest about what could make it too big for a semester. Dont bother with citations, I'll track those down myself.
