            - Then apply that to iijjkk: which might lead to replacing the last group (kk) with ll (so iijjll) but note the group size is two, so two l's. What if the example was mrrjjj→mrrkkk? Then the rule becomes: replace the last group with the successor of the group's letter, and the group size is preserved. So for iijjkk, we get iijjll.

          This shows they are thinking about the slippage and how the context (the example) can change the interpretation.

