answer: |-
  ### Session Plan: Hofstadter's Copycat Core Idea in 40 Minutes

  **Core Goal:** Convey that analogy-making is **conceptual slippage under pressure** in a constrained microdomain, where multiple defensible answers emerge due to flexible reinterpretation of concepts.

  ---

  #### **Step 1: Set the Stage (5 min)**  
  *(Whiteboard Setup: Draw the microdomain rules)*  
  - **What to write:**  
    - **Strings:** `abc`, `xyz`, `iijjkk` (all lowercase letters).  
    - **Concepts:**  
      - `successor` (next letter: `a→b`, `b→c`... `y→z`; `z?` is undefined).  
      - `predecessor` (previous letter: `b→a`, `c→b`...).  
      - `groups` (repeated letters: `ii`, `jj`, `kk` in `iijjkk`).  
      - `sameness` (`iijjkk = ii + jj + kk`).  
      - `positions` (leftmost/rightmost *letter* or *group*).  
  - **Opening Script:**  
    > "We’ll explore how people solve analogy puzzles in this tiny world. There’s **no single right answer**—and that’s the point. Your job is to defend your answer using these concepts. Let’s start simple."  

  **Why this first?**  
  Establish *ambiguity as a feature* upfront. If you begin with a problem, novices fixate on "correctness." This primes them for flexible thinking.  

  ---

  #### **Step 2: Warm-up Problem – `abc → abd` (5 min)**  
  *(Whiteboard: `abc → abd`)*  
  - **Ask:** "What happened here?"  
    - *They’ll say:* "Replace rightmost letter (`c`) with its successor (`d`)."  
  - **Reframe the rule:**  
    > "Rule: *Replace the rightmost letter with its successor.* Now, let’s test this rule in a messier context."  

  **Work it does:**  
  Creates a "baseline" rule. Simple, unambiguous, and sets up contrast for the next problem.  

  ---

  #### **Step 3: Core Problem – `iijjkk → ?` (15 min)**  
  *(Whiteboard: `abc → abd` | `iijjkk → ?`)*  
  - **Brainstorm answers:**  
    Ask the group to shout out answers (e.g., `iijjll`, `iijjkl`, `aabbdd`). Write them all.  
  - **Unpack 2–3 answers:**  
    - **`iijjll`:**  
      > "Slippage: ‘Rightmost’ slides from *letter* to *group*. `kk` (rightmost group) → `ll` (successor of `k`). Groups stay intact."  
    - **`iijjkl`:**  
      > "Slippage: ‘Rightmost’ is a letter (`k`), but breaking the group (`kk→kl`). Sameness dissolves."  
    - **`aabbdd`:**  
      > "Slippage: *Everything* slips! `iijjkk` remapped to start at `a` (`ii→aa`, `jj→bb`). `kk→dd` (successor of `c`? Distance slippage)."  
  - **Key insight:**  
    > "Pressure from the structure (`iijjkk` has groups!) forces slippage. No one ‘right’ way—your worldview shapes the answer."  

  **Why `iijjkk` first?**  
  - Shows slippage via **structural ambiguity** (groups vs. letters).  
  - Generates multiple answers quickly, proving the point.  
  - More engaging than `xyz` (which is abstract).  

  ---

  #### **Step 4: Pressure Problem – `xyz → ?` (10 min)**  
  *(Whiteboard: `abc → abd` | `xyz → ?`)*  
  - **Ask:** "What’s the successor of `z`?"  
    - *Answers:* `xya` (wrap-around), `xyd` (copy `d` from first example), `xy?` (delete `z`).  
  - **Unpack slippage:**  
    - **`xya`:** Slippage in `successor` (alphabet becomes circular).  
    - **`xyd`:** Slippage in the *rule itself* (copy the outcome `d`, not the process).  
  - **Contrast with `iijjkk`:**  
    > "`iijjkk` had structural ambiguity. `xyz` has **operational ambiguity**—the rule *breaks*. Slippage rescues it!"  

  **Work it does:**  
  Reveals slippage under *failure pressure* (undefined successor). `iijjkk` alone doesn’t force this.  

  ---

  #### **Step 5: Address Misconceptions (Weave In)**  
  *(Counter these as they arise during Steps 3–4)*  
  1. **"It’s just pattern matching; a regex could do it."**  
     - **When:** During `iijjkk` unpacking.  
     - **Counter:**  
       > "Regex expects fixed patterns. But `aabbdd` isn’t a regex outcome—it’s a creative remapping. Slippage isn’t rules; it’s *re*-conceptualization."  

  2. **"Slippage means the model made a mistake."**  
     - **When:** When defending "weird" answers (e.g., `aabbdd`).  
     - **Counter:**  
       > "In real life, is ‘Juliet is the sun’ a mistake? No—it’s poetic slippage! Here, slippage is *insight*, not error."  

  3. **"Tiny domains make analogy trivial."**  
     - **When:** Intro or recap.  
     - **Counter:**  
       > "If it’s trivial, why do *humans* debate `iijjll` vs. `iijjkl`? Real analogies work the same—e.g., ‘Atom is a solar system’ slips ‘orbit’ onto electrons."  

