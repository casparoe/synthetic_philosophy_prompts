  #### **The Check Question: Did They "Get" It?**  
  **Ask:**  
  > "If I changed the first example to `mrrjjj → mrrkkk` (replace `jjj` with successor group `kkk`), how would that change what `abc → abd` *teaches us*? What might `iijjkk` become now?"  

  **Why this?**  
  - Tests if they see slippage as **context-dependent** (the rule morphs based on examples).  
  - Correct intuition:  
    - `abc → abd` now implies *group-wise* replacement (not letter-wise).  
    - `iijjkk` likely becomes `iijjll` (replacing `kk` with `ll` as a group).  
  - If they articulate how the "teacher example" reshapes the rule, they grasp slippage as dynamic reinterpretation.  

