  #### **Step 6: Recap & Big Idea (5 min)**  
  - **Whiteboard summary:**  
    `abc → abd` (baseline) → `iijjkk → ?` (structural slippage) → `xyz → ?` (operational slippage).  
  - **Core message:**  
    > "Analogy isn’t deduction—it’s **conceptual slippage under pressure**. We shrink the world to see slippage clearly, but your brain does this when comparing startups to bacteria, love to war... anything!"  

