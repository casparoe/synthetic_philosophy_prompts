  Okay, the user is taking a course on transitional justice and has encountered a recurring legal maneuver. They describe a situation where after an authoritarian regime falls, the new democratic government wants to prosecute individuals for actions that were legal under the old regime. Instead of passing retroactive laws, courts declare that the old regime's laws were so wicked they were never valid to begin with. This allows prosecutions without appearing retroactive. The user wants a name for this specific step and how it differs from other concepts like judicial review or ex post facto legislation. They also need to understand its boundaries—like whether it applies only to genocidal regimes or can extend to merely bad ones, and how partial wickedness in a legal system is handled.

  First, I recall the user mentioning a split among Anglophone legal philosophers in the late fifties and a German legal philosopher's quote. The German reference is likely Radbruch's formula, named after Gustav Radbruch. The split among philosophers probably refers to the Hart-Fuller debate. H.L.A. Hart and Lon Fuller debated legal positivism vs. natural law, especially regarding Nazi laws. Hart argued that laws are valid regardless of morality, while Fuller emphasized morality's role. Radbruch's formula posits that extremely unjust laws lose their legal validity. That seems central here.

  The user's main query is whether there's an established term for declaring old laws void ab initio to avoid retroactivity. The key term here is "Radbruch's formula." It's exactly what they described: laws that create intolerable injustice are not valid, so prosecutions under new norms aren't retroactive. The concept of "void ab initio" is crucial. The user also wants to differentiate this from judicial review (which is prospective) and ex post facto laws (which are openly retroactive). Radbruch's formula treats the old laws as never having existed, thus sidestepping retroactivity.

  The user's deeper needs involve their term paper. They need to explore the boundaries of this doctrine. How extreme must the injustice be? Does it apply to non-genocidal regimes? What if only parts of the legal system are wicked? For instance, Radbruch's formula was applied in cases like the German Federal Constitutional Court's ruling on East German border guards. The court had to determine if the old laws were so unjust that they were void. But what about regimes with mixed legal systems? The user might need to analyze cases where only specific statutes were challenged under this doctrine.

  The stretching question is vital. Radbruch himself set a high threshold: laws that "disavow" equality as a core justice principle. Later interpretations vary. Some courts might apply it broadly, others restrict it to extreme cases like genocide. The user should examine scholarly debates on this—whether the formula can stretch to authoritarian but not genocidal regimes. Also, the partial application: if one law is wicked, does it invalidate the whole system? Courts usually apply it to specific norms, not the entire legal order. For example, in the East German cases, only the shoot-to-kill order was deemed void, not all laws.

  The user might also need to consider criticisms. Legal positivists like Hart argue that retroactive legislation is more honest than pretending laws never existed. This ties into the legitimacy of transitional justice mechanisms. The user's paper could evaluate when Radbruch's formula is justified versus when it risks judicial overreach. They should look into examples beyond Germany, like post-apartheid South Africa or Latin American transitions, to see variations in applying similar concepts.

  In summary, the term is Radbruch's formula. The user needs to delve into its criteria, applications, and limitations for their paper. Highlighting the Hart-Fuller debate will provide theoretical context, and discussing case studies will show practical boundaries. Addressing the partial wickedness issue with examples will strengthen their analysis.
answer: |-
  You've hit upon one of the most profound and contentious debates in legal philosophy and transitional justice: the **Radbruch Formula**. That's the established term for the core move you're describing.

  **The Name and Origin:**

  *   **Radbruch Formula (Radbruchsche Formel):** Named after German legal philosopher **Gustav Radbruch** (1878-1949). Radbruch, a former Minister of Justice and legal positivist, underwent a profound shift in his thinking after witnessing the atrocities of the Nazi regime. He articulated the core idea in his 1946 essay "Gesetzliches Unrecht und übergesetzliches Recht" ("Statutory Lawlessness and Supra-Statutory Law").
  *   **The Core Formula:** It essentially states: "Where there is not even an attempt at justice, where equality, the core of all justice, is deliberately betrayed in the issuance of positive law, then the statute is not merely 'flawed law', it lacks completely the very nature of law." Or more succinctly: **Extreme injustice is no law at all (extreme Unrecht ist kein Recht).**

  **How it Works & Why it's Distinct:**

  1.  **Target:** It targets specific statutes or legal provisions of the *previous regime* that facilitated grave injustices (torture, genocide, crimes against humanity, extrajudicial killings, systematic denials of equality).
  2.  **Mechanism:** It declares those *specific* wicked statutes **void *ab initio*** (from the beginning). They are deemed to have *never been valid law*.
  3.  **Consequence for Prosecution:** Therefore, punishing someone for acting under such a "non-law" is *not* considered retroactive punishment. The actor wasn't following a valid law; they were committing a fundamental wrong that was simply *cloaked* in the appearance of legality by the regime. The prosecution relies on *either*:
      *   Pre-existing, higher norms (like natural law or universal human rights principles) that were violated.
      *   The new legal order's principles, applied to the *underlying act* (which was always criminal in a moral/higher law sense, even if temporarily "legalized" by the wicked regime).
  4.  **Distinction from Judicial Review:**
      *   **Ordinary Judicial Review:** Strikes down a law as unconstitutional *going forward*. It accepts that the law *was* valid and binding *until* struck down. People who acted under it before the ruling are generally not liable (unless the ruling has explicit retroactive effect, which is rare and controversial).
      *   **Radbruch Formula:** Declares the wicked law *never was law at all*, even at the time it was applied. This *enables* prosecution for acts committed *while* the statute was nominally in force.
  5.  **Distinction from Ex Post Facto Legislation:**
      *   **Ex Post Facto Law:** Openly admits it is changing the rules *after* the fact and applying the new rule retroactively. This is generally prohibited by modern constitutions and human rights instruments (like Art. 15 ICCPR, Art. 7 ECHR) for criminal law.
      *   **Radbruch Formula:** Denies any retroactivity by denying the *legal validity* of the old rule. It claims to be uncovering the *true*, timeless legal status of the act (always criminal) that was obscured by the regime's perversion of law.

  **The "Split Down the Middle": The Hart-Fuller Debate (1958)**

  This is exactly what your professor referenced. The key protagonists were:

  *   **H.L.A. Hart (Legal Positivist):** Argued that law is separate from morality. The Nazi statutes, however wicked, *were* valid positive law at the time. Punishing people for actions legal under those laws *is* retroactive. He advocated for *honest* retroactive legislation if necessary for justice, arguing it's better than the "mystifying" fiction of the Radbruch Formula. He feared the uncertainty and potential for abuse if courts could declare laws void based on their injustice.
  *   **Lon Fuller (Procedural Natural Lawyer):** Defended a position aligned with Radbruch. He argued that law has an inherent "inner morality" (procedural principles like clarity, non-retroactivity, consistency). A system that utterly fails these principles (like the Nazi regime, which often used secret, retroactive, contradictory decrees) lacks the minimal characteristics to be called "law" at all. It's simply a form of state-sponsored terror. Therefore, prosecutions based on fundamental principles of justice aren't truly retroactive.

  **Carving the Edges: Where Does This Apply? (Your Term Paper Territory)**

  This is the crux of the debate and where the Radbruch Formula gets messy in practice:

  1.  **The Threshold of "Extreme Injustice":**
      *   **Radbruch's Original Threshold:** "Deliberate betrayal of equality" as the core of justice. Genocide, crimes against humanity, systematic torture, apartheid clearly meet this.
      *   **The Stretching Problem:** Can it apply to lesser injustices? Prosecuting a low-level bureaucrat for applying a discriminatory but non-genocidal property law? Punishing someone for "corruption" that was essentially state policy? This is highly controversial.
      *   **Consensus?** Most scholars and courts applying Radbruch set a *very high bar*. It's generally reserved for acts universally recognized as core crimes under international law *or* fundamental violations of human dignity tied to the regime's oppressive *system*. A "merely bad" authoritarian regime's ordinary laws (e.g., strict economic regulations, censorship laws) are unlikely to qualify. The injustice must be *intolerable* and *fundamental*.

  2.  **Partial Wickedness & Voiding:**
      *   **Not the Whole Legal Order:** The Radbruch Formula is almost *never* applied to declare the *entire* previous legal order void. That would create chaos. It targets *specific statutes or legal provisions* that directly authorized or facilitated the extreme injustice.
      *   **Who Decides?** Courts (usually the highest constitutional court or specialized transitional justice tribunals) decide *which specific provisions* meet the Radbruch threshold. They look for:
          *   Direct authorization of atrocities (e.g., "Shoot-to-kill" orders at borders).
          *   Laws deliberately designed to deny fundamental equality or humanity (e.g., Nuremberg Race Laws, apartheid laws).
          *   Laws that were instruments of systematic terror, lacking even minimal procedural fairness.
      *   **The Mixed System Problem:** Courts grapple with statutes that might have had legitimate purposes *but* were applied wickedly, or provisions within otherwise valid laws. The focus is on the *specific authorization* used to commit the intolerable act. The validity of unrelated laws (e.g., contract law, traffic regulations) usually remains intact. The challenge is isolating the truly "radbruchian" norm.

  **Key Examples of Application:**

  *   **West German Courts (Post-WWII):** Used to prosecute lower-level officials (e.g., judges who handed down death sentences based on Nazi "laws," informants) where the specific Nazi decree relied upon was deemed void *ab initio* under Radbruch.
  *   **German Federal Constitutional Court (Post-Reunification):** Applied Radbruch to prosecute East German border guards for shooting escapees. The court held that the GDR's border laws, authorizing lethal force against unarmed civilians solely for fleeing, violated the "elementary precepts of justice and inviolable human rights" so fundamentally that they were void *ab initio*. The guards couldn't claim they were following valid orders/law.
  *   **Indirect Influence:** While perhaps not explicitly invoking "Radbruch," similar reasoning underpins international law doctrines like **Nullum crimen sine iure (No crime without law)** which accepts that core international crimes (like crimes against humanity) are inherently criminal under international law, regardless of domestic statutes authorizing them. Prosecution isn't retroactive against the *perpetrator* because the prohibition existed in a higher legal order.

  **Criticisms & Concerns:**

  *   **Legal Uncertainty:** Who defines "extreme injustice"? Opens the door to subjective judicial overreach.
  *   **Violates Rule of Law Values:** Undermines predictability and the principle that people can rely on the law as it is written.
  *   **Moralizing Fiction:** Hart's point – it disguises retroactive justice as discovery of eternal truth.
  *   **Potential for Abuse:** Could be used by new regimes to selectively target opponents under a veneer of legality.
  *   **Fairness to Low-Level Actors:** Was the lowly clerk truly meant to know the regime's law was "void"?

  **Conclusion & For Your Paper:**

  The established term is the **Radbruch Formula**. It is distinct from prospective judicial review and honest ex post facto legislation because it hinges on the *void ab initio* declaration of *specific* wicked statutes.

  **Your term paper's core question – the stretching problem – is the most vital and contested aspect.** Focus your research on:

  1.  **Case Studies:** How have courts actually applied the threshold? (German cases post-WWII and post-1990 are prime examples). Look for arguments about *why* a specific law met the "extreme injustice" standard.
  2.  **Scholarly Debate:** Trace arguments from Radbruch, Hart, Fuller, and modern scholars (e.g., Dyzenhaus, Alexy, Waldron) about where the line should be drawn. Is there a consensus? How do different legal traditions view it?
  3.  **"Merely Bad" vs. "Truly Evil":** Analyze criteria proposed: Is it the *type* of act authorized (genocide vs. corruption)? The *scale*? The *systematic nature*? The *intent* behind the law? The *denial of fundamental equality/humanity*?
  4.  **Partial Application:** Examine how courts isolate the "wicked provision" within a mixed system. What principles guide this surgical approach? When does the context of the *entire regime* taint otherwise ordinary-looking laws?
  5.  **Legitimacy:** Ultimately, is the Radbruch Formula a necessary tool for confronting past evil and affirming fundamental justice, or is it a dangerous fiction that undermines the very rule of law it seeks to restore?

  By focusing on the **threshold of application** and the **partial/mixed system problem**, your paper will delve into the heart of why the Radbruch Formula remains both a powerful tool and a deeply controversial one in the difficult project of transitional justice. Good luck!
