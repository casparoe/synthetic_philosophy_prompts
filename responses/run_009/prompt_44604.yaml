  First, I need to recall Robbins's argument. He claimed that interpersonal utility comparisons lack scientific standing because they can't be empirically verified. Economics should stick to ordinal rankings based on observable behavior. This led to the decline of cardinal utility in economics. Harsanyi, however, derived average utilitarianism using expected utility theory behind a veil of ignorance. The user wonders if Harsanyi refuted Robbins or smuggled in the needed assumptions.

  The user also mentions a deeper philosophical issue: the distinction between verifiability and meaningfulness. They suggest that even if interpersonal comparisons are unverifiable, they might still be meaningful. This points to a possible conflation of methodological and metaphysical claims in the Robbins-Harsanyi debate.

  Looking at the TA's comments, critics argue that Harsanyi's equiprobability assumption or the treatment of the impartial observer's choice might sneak in interpersonal comparisons. Extended preferences are another angle. I need to clarify these points.

  Harsanyi's theorem involves an impartial observer imagining themselves in each person's position with equal probability. By maximizing expected utility, they arrive at average utilitarianism. The key is that each individual's utility function is cardinal and unit-comparable. But Robbins would challenge how we establish that one unit of utility for person A equals one for person B.

  Harsanyi's normalization assumption—setting utility ranges equal across individuals—seems crucial. Robbins would see this as arbitrary without empirical basis. The equiprobability model assumes symmetry, but Robbins might argue this doesn't resolve the comparability issue.

  On extended preferences: Harsanyi later proposed that we can compare "being person A in state X" to "being person B in state Y." This avoids direct intensity comparisons by treating them as different experiences. But Robbins might still question the empirical basis for such judgments.

  The user's insight about verifiability vs. meaningfulness is spot-on. Robbins was making a methodological point for economics as a science, not necessarily denying metaphysical possibility. Harsanyi, as a welfare economist, was comfortable with ethical assumptions. So they're addressing different questions.

  In terms of historical accuracy, Robbins's actual text emphasizes the scientific limitations, not metaphysical meaninglessness. Textbook summaries sometimes overstate his position. Harsanyi's theorem assumes comparability via normalization, which Robbins would reject. So Harsanyi sidesteps rather than refutes Robbins.

  The user needs to frame their essay around this methodological-metaphysical distinction. Highlighting that Robbins's injunction is for positive economics, while Harsanyi operates in normative welfare economics. The confidence levels: Robbins's actual claims are well-documented, but the extent of textbook oversimplification might need primary source checks. The weakest point is whether Harsanyi's extended preferences fully answer Robbins; it's still debated.
answer: |-
  Your framing is perceptive but requires refinement on both historical and conceptual grounds. The Robbins-Harsanyi tension isn't a simple case of refutation, but rather a clash between methodological positivism and normative welfare economics, mediated by different conceptions of "utility" and the role of assumptions. Here's the breakdown:

  1.  **Robbins's Core Claim (Historical Accuracy Check - High Confidence):**
      *   Robbins argued that *interpersonal comparisons of utility intensity* ("Person A gets more utility from good X than Person B gets from good Y") are **not scientific statements** within positive economics.
      *   **Why?** Because they are not empirically verifiable through observation or experiment. We cannot directly observe or measure subjective mental states across individuals. Behavior reveals only *ordinal* preferences within an individual (A prefers X to Y), not *cardinal* intensities or *interpersonal* comparisons.
      *   **What it meant for economics:** He advocated for a value-free, positive science based on revealed preference ordinalism. Cardinal utility (measurable intensity) and interpersonal comparisons were banished from *scientific* economics as unsupported metaphysical baggage. This became the dominant view for decades.
      *   **Key Nuance (Addressing your philosophical knot):** Robbins was primarily making a **methodological injunction for economics as an empirical science**, not necessarily a strong metaphysical claim that such comparisons are *meaningless* or *impossible to be true/false* in an ethical or philosophical sense. He acknowledged their role in ethical discourse but insisted they had no place in *science*. You are correct that "unverifiable" and "meaningless" come apart here. Robbins focused on the former for scientific economics.

  2.  **Harsanyi's Theorem (1953 & 1955) - The Mechanism:**
      Harsanyi aimed to provide a rigorous *normative* foundation for utilitarianism. His theorem involves:
      *   **Individuals (i=1,..,n):** Each has well-defined, **cardinal** von Neumann-Morgenstern (vNM) utility functions U_i. These are derived from their preferences under risk (choosing between lotteries). vNM utilities are cardinal *within* an individual (unique up to positive affine transformations: U_i' = aU_i + b, a>0).
      *   **An Impartial Observer (IO):** This entity makes moral judgments. The IO imagines being placed behind a "veil of ignorance," not knowing *which* individual they will become in society.
      *   **Equiprobability:** The IO assumes an equal probability (1/n) of becoming any individual i.
      *   **Rational Choice:** The IO, being rational, evaluates social states by maximizing their *expected utility* given this risky prospect (1/n chance of being each person). The IO's expected utility for a social state S is: EU(S) = Σ [ (1/n) * U_i(S) ] = (1/n) * Σ U_i(S)
      *   **Pareto Condition:** If all individuals prefer state S1 to S2, then the IO (and thus the social welfare function) should prefer S1 to S2.
      *   **The Conclusion:** Maximizing the IO's expected utility *is* equivalent to maximizing the **average** of the individuals' cardinal utilities: W(S) = (1/n) * Σ U_i(S). This is Average Utilitarianism.

  3.  **Where Robbins Would Object & How Harsanyi "Sidesteps" (Not Refutes):**
      The key point of contention is **interpersonal unit comparability**. Adding U_i(S) + U_j(S) requires that one unit on U_i's scale means the same thing as one unit on U_j's scale. Robbins argued science cannot establish this.
      *   **The Normalization Problem (The Crux - High Confidence):** vNM utilities are only cardinal *within* an individual. I can say "Person A's utility difference between X and Y is twice the difference between Y and Z". But vNM theory provides *no basis* for saying "One unit of utility for A equals one unit for B." Harsanyi's summation Σ U_i(S) implicitly **assumes that the zero points and units of all individual U_i functions are comparable**. This is the core assumption Robbins declared unscientific.
      *   **The Equiprobability Model (Not the Primary Smuggle - Medium Confidence):** While equiprobability ensures symmetry, it doesn't *by itself* solve the unit comparability problem. The IO needs to know *how much* utility they get if they turn out to be A vs. B. Equiprobability tells them *how likely* they are to be A or B, but not the *magnitude* of U_A(S) relative to U_B(S) on a common scale. The equiprobability combined with the *tacit assumption of comparable units* does the work.
      *   **Treating IO Choice as Ordinary Risk (The Main "Sidestep" - High Confidence):** This is the heart of Harsanyi's approach and the main point of contention. Harsanyi argues that the IO, in making a choice under uncertainty about their identity, is engaging in a standard exercise of rational choice under risk. Since vNM expected utility theory applies to *any* risky prospect, including the prospect of being different people, the derivation is valid *for the IO*. **He transforms the *normative ethical* question of interpersonal comparison into a *positive descriptive* question about how a rational IO would choose under a specific hypothetical risk.** He sidesteps the direct empirical verification of interpersonal intensities by embedding the comparison *within* the choice framework of a single mind (the IO) facing a risky prospect. Robbins would likely retort that this merely pushes the problem back: How does the IO *know* the vNM utility levels of different individuals *on a comparable scale* to calculate their own expected utility? The IO still needs to make interpersonal comparisons to construct their own payoff matrix.

  4.  **Extended Preferences (Harsanyi's Later Defense - Medium Confidence):**
      Recognizing this objection, Harsanyi (esp. in his 1977 paper) developed the concept of "extended preferences." An individual can have preferences not just over outcomes for themselves, but over *being in the shoes of different people in different situations* ("I prefer being person A in state X to being person B in state Y"). He argued that if individuals have *identical* extended preferences (or if the IO has such preferences), these preferences could be represented by a single cardinal utility function defined over (person, state) pairs. Interpersonal comparisons then become comparisons of the *same* utility function applied to different identities. This avoids comparing private intensities by focusing on observable (in principle) preferences over extended alternatives. Critics argue this still requires a heroic assumption about the existence and identity of such extended preferences across individuals or for the IO.

  5.  **The Standoff: Methodology vs. Metaphysics/Normative Theory (Your Insight Confirmed - High Confidence):**
      You've hit the nail on the head here.
      *   **Robbins:** Made a **methodological claim** about the limits of *positive economic science*: Interpersonal comparisons are not empirically verifiable, so they cannot be part of a scientific explanation or prediction of economic behavior. "Illegitimate" means *unscientific*, not necessarily *meaningless* or *ethically irrelevant*.
      *   **Harsanyi:** Made a **normative ethical argument** within **welfare economics**. He provided a rigorous *logical derivation* of utilitarianism based on seemingly plausible axioms (rational choice under risk, impartiality via veil of ignorance, Pareto). He wasn't primarily concerned with Robbins's *positive science* injunction. He was comfortable making strong assumptions (like comparable units via normalization/implicit in extended preferences) to ground a *normative* theory of social welfare.
      *   **Talking Past Each Other?** Partly. Robbins was defining what economists *as scientists* can say. Harsanyi was defining what a rational, impartial ethical observer *should* do. However, Harsanyi *does* engage Robbins by attempting to ground interpersonal comparisons in observable choice behavior (the IO's risky choice or extended preferences), offering a potential *operationalization* that Robbins dismissed as impossible. Whether this operationalization succeeds in avoiding Robbins's critique is the core dispute.

  **Conclusion & Answers to Your Direct Questions:**

  *   **Did Harsanyi refute Robbins?** No. Harsanyi did not disprove Robbins's core claim that interpersonal comparisons of utility intensity lack direct empirical verification in the context of *positive* economic science.
  *   **Did he assume what he needed?** **Yes, critically.** The central assumption is the **interpersonal comparability of the units (and often the zero points) of the individual vNM utility functions**. This comparability is either assumed directly (through normalization) or built into the construction of the Impartial Observer's payoff matrix or the concept of identical extended preferences. Robbins argued this assumption lacks scientific foundation.
  *   **Does Harsanyi sidestep, answer, or fail to engage?** He **sidesteps** the *empirical verification* challenge by embedding the interpersonal comparison *within* the **hypothetical choice problem of a single rational agent (the Impartial Observer) facing risk**. He offers this as an *alternative foundation* for interpersonal comparisons grounded in rational choice theory, thereby **engaging and attempting to answer** Robbins by proposing a different kind of "observable" basis (the choices of the IO under the veil). Whether this constitutes a successful answer is highly debated.
  *   **Confidence in Attributions:** High confidence regarding Robbins's core methodological argument against the scientific standing of interpersonal comparisons. High confidence regarding the mechanics of Harsanyi's theorem and its reliance on normalization/interpersonal unit comparability. High confidence in the methodological/normative distinction explaining the standoff.
  *   **Point of Least Confidence:** The extent to which **Harsanyi's "extended preferences" concept successfully overcomes Robbins's objection without smuggling in problematic assumptions.** While it's a sophisticated response, critics (like Sen, Hausman, Weymark) argue that assuming individuals have well-defined, identical extended preferences over vastly different subjective experiences is itself a major, empirically dubious assumption that doesn't fully escape the specter of unverifiable mental state comparisons. It shifts the problem but may not solve it definitively for Robbinsian positivists.

  **Recommendation for Your Essay:** Frame the encounter not as "Harsanyi refuted Robbins" but as "Harsanyi constructed a sophisticated normative model *presupposing* interpersonal comparability in a way that aimed to bypass Robbins's *methodological* prohibition by grounding comparability in a hypothetical rational choice framework." Emphasize the crucial distinction between Robbins's *scientific* injunction and Harsanyi's *normative* project. Your insight about the unverifiable/meaningful distinction is key to understanding why Robbins's "death blow" was never absolute in ethics and welfare economics.
