prompt: |-
  I'm in the bio club at my school and every spring we do this "bioblitz" thing at the county nature preserve where we try to record every living thing we can find in 24 hours, mostly with phones and a couple borrowed macro lenses. Our advisor said last year's final list had like 40 entries that just say "beetle sp." or "some kind of fern," which is embarassing, so this year she put me in charge of "taxonomic quality control" lol, meaning I have to decide when two photos people uploaded are the same species or different ones, so the list we send to the county actually means something.

  Here's what I ran into while test-running this on last year's data: the new state field guide splits a certain ground beetle into two species based on some subtle difference in the ridges on the wing covers, and the older guide lumps them as one, and honestly nobody in our club can tell them apart from a photo. Also there's a patch of what our advisor calls "the weird sunflowers" down by the creek that she suspects are hybrids between two species planted on either side of the trail. And apparently there are these things called ring species where each neighboring population can interbreed but the two ends can't, which sounds like it would break any rule I come up with, definately. My advisor said something like "every species concept is a research program, not a definition" and then left for a meeting, which was not helpful.

  I don't need the philosophy, I need a procedure. Please write one our club can actually run on a pair of photos in like ten minutes with no DNA lab and no PhD: the questions to ask in order (appearance, range, breeding, whatever actually matters), what counts as a good enough answer at each step, where it stops with "lump them as one species" vs "split them", and where it just punts to our advisor because the question is a judgment call and not something with a right answer. Be honest about the cases where it'll give the wrong answer and we won't know. Basically: turn the whole species-concept mess into something a 16 year old with an iPad and a field guide can run, without lying to me about how clean it is.

  Format: give me the procedure as a table with columns Step, Question to ask, What counts as a yes, If yes do this, If no do this, and Who decides (club member / whole club / advisor). Then run it on three cases: (1) the ground beetles that the new guide splits and the old guide lumps, (2) the weird sunflowers by the creek that might be hybrids, and (3) a pair of nearly identical little brown moths where one only shows up at night and the other only at dawn. Present each case as a JSON object with fields "case", "decision_at_each_step", "final_call", "confidence", and "where_this_could_go_wrong". Then end with one short paragraph on what the procedure flat out can't do, so I know what to tell my advisor we're just not catching. thx
reasoning: |-
  We are creating a practical procedure for high school students to determine whether two observed organisms should be considered the same species for the purpose of a bioblitz. The procedure must be executable in about 10 minutes using photos, field guides, and basic observations. We'll break it down into steps with clear questions and decision rules.

  Key principles:
  1. We are pragmatic: We want a list that is as accurate as possible given our constraints, but we acknowledge that some splits or lumps will be wrong.
  2. We rely on observable characteristics and readily available information (field guides, range maps, etc.).
  3. We avoid complex judgments that require expertise. When in doubt, we lump (to avoid over-splitting) or punt to the advisor.

  Procedure Table:

  | Step | Question to ask                                                                 | What counts as a yes                                                                                                | If yes do this                                                                 | If no do this                                                                                                   | Who decides        |
  |------|---------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------------|--------------------|
  | 1    | Are the two organisms visibly different in obvious ways (e.g., color, pattern, size, shape) that are not due to age, sex, or individual variation? | Yes if differences are clear and consistent with known species splits in the field guide (e.g., different color patterns for males vs females doesn't count as a split). | Proceed to step 2.                                                            | Consider them the same species for now and stop here (lump).                                                   | Club member (with field guide) |
  | 2    | Does the current field guide list them as separate species?                     | Yes if the field guide we are using (the most recent one) explicitly states they are distinct and provides distinguishing features. | Proceed to step 3.                                                            | Consider them the same species and stop (lump).                                                                | Club member (with field guide) |
  | 3    | Can we see the key distinguishing features in the photos?                       | Yes if the photos clearly show the features that the field guide says are diagnostic (e.g., ridge pattern, spot shape) and they match the description for two different species. | Proceed to step 4.                                                            | If we cannot see the features (e.g., photo is blurry, angle is wrong), then we cannot confirm. Punt to advisor. | Club member (with field guide and photo) |
  | 4    | Are they in the same location and habitat?                                      | Yes if they were found in the same general area (e.g., within the same meadow, same tree) and in similar microhabitats. | Proceed to step 5.                                                            | If they were found in very different habitats (e.g., one in water, one on land) or different parts of the preserve, consider splitting but note that it might be due to range. Proceed to step 5 with caution. | Club member (using observation notes) |
  | 5    | Is there evidence they are reproductively isolated? (This is hard, so we use proxies) | Yes if: (a) they have different activity times (e.g., one diurnal, one nocturnal) OR (b) they flower/fruit at different times OR (c) they are known to be different species that don't interbreed (per field guide). | Split them into two species and stop.                                         | If no evidence of reproductive isolation, then lump them as one species and stop.                               | Whole club (discuss based on notes and field guide) OR advisor if complex |

  Notes:
  - If at any step we are unsure, we default to lumping (to avoid false splits) unless there is strong evidence for splitting (like clear field guide split and visible features).
  - The procedure is designed to be conservative: we only split when we have clear evidence.

  Now, let's run the three cases:

  Case 1: The ground beetles that the new guide splits and the old guide lumps.

  ```json
  {
    "case": "Ground beetles with subtle wing cover ridges",
    "decision_at_each_step": {
      "step1": "No (no obvious visible differences without close examination)",
      "step2": "Yes (new field guide splits them)",
      "step3": "No (we cannot see the ridges clearly in the photos, or even if we can, we can't confidently tell the difference)",
      "step4": "Yes (same location and habitat)",
      "step5": "No (we have no evidence of reproductive isolation)"
    },
    "final_call": "Lump them as one species (because step3 failed and we default to lumping when we cannot confirm the split). But note: the new guide splits them, so we should flag for advisor review.",
    "confidence": "Low. We are lumping because we can't see the diagnostic feature, but they might actually be two species.",
    "where_this_could_go_wrong": "We might be lumping two distinct species because we lack the equipment to see the ridges. Alternatively, the new guide might be wrong and they are the same."
  }
  ```

  Case 2: The weird sunflowers by the creek that might be hybrids.

  ```json
  {
    "case": "Weird sunflowers by the creek (suspected hybrids)",
    "decision_at_each_step": {
      "step1": "Yes (they look intermediate between the two species planted on either side)",
      "step2": "No (field guide might not list hybrids as a separate species; it might only list the two parent species)",
      "step3": "N/A (since step2 was no, we would normally lump, but note step1 said yes and they are intermediate)",
      "step4": "Yes (same location: by the creek, between the two parent populations)",
      "step5": "Unknown (we don't know if they are reproductively isolated; they might be fertile and backcross)"
    },
    "final_call": "Punt to advisor. Reason: They are visibly different (step1) but the field guide doesn't list them as a separate species (step2). They are in a hybrid zone and we don't have a clear rule for hybrids. We don't want to create a new species entry without expert input.",
    "confidence": "Low without expert input. We are punting because this is a hybrid situation which is complex.",
    "where_this_could_go_wrong": "We might be looking at a stable hybrid species, or just occasional hybrids. Without genetic testing, we can't know. We might either oversplit (calling hybrids a new species) or under split (lumping with one parent)."
  }
  ```

  Case 3: Pair of nearly identical little brown moths, one nocturnal and one at dawn.

  ```json
  {
    "case": "Nearly identical brown moths with different activity times",
    "decision_at_each_step": {
      "step1": "No (they look nearly identical)",
      "step2": "Check field guide. Assume the field guide does not split them because they are very similar and the guide might not mention activity time as a diagnostic feature. So: No.",
      "step3": "N/A (step2 was no, so we would normally lump, but note step5 might override because of activity time)",
      "step4": "Yes (same location, maybe same tree or light trap)",
      "step5": "Yes (they have different activity times: one at night, one at dawn. This is evidence of reproductive isolation because they are active at different times and thus unlikely to mate.)"
    },
    "final_call": "Split them into two species because step5 provided evidence of reproductive isolation (different activity times) even though step1 and step2 did not support a split. However, note: step2 did not list them as separate, so we are going beyond the field guide. This might be controversial, so we should also note this for the advisor to double-check.",
    "confidence": "Medium. The different activity times are a strong indicator of reproductive isolation, but without genetic evidence or field guide support, we might be wrong.",
    "where_this_could_go_wrong": "They might be the same species with two different activity peaks (e.g., due to sex or age) or they might be two species that are not in the field guide. We might oversplit if the activity time difference is not absolute."
  }
  ```

  What the procedure flat out can't do:
  This procedure cannot resolve cases that require genetic analysis (e.g., cryptic species with no visible differences and no known behavioral or ecological differences), complex hybrid systems, or ring species. It also cannot handle situations where the field guide is outdated or wrong, and it may fail when diagnostic features are not visible in the photos. In such cases, we will either lump or flag for expert review.
answer: |-
  ### Taxonomic Quality Control Procedure for High School Bioblitz  
  **Goal:** Decide if two observations are the same species in ≤10 minutes using photos, field guides, and common sense.  
  **Defaults:** When uncertain, **lump** (to avoid false splits). When complexity exceeds club capacity, **punt to advisor**.  

  | Step | Question to Ask                                                                 | What Counts as "Yes"                                                                 | If YES: Do This             | If NO: Do This                                 | Who Decides          |
  |------|---------------------------------------------------------------------------------|--------------------------------------------------------------------------------------|-----------------------------|-----------------------------------------------|----------------------|
  | 1    | Are there **obvious visual differences** (e.g., color, size, shape, patterns) beyond normal variation? | Differences are clear, consistent, and not due to age/sex (e.g., distinct wing patterns). | Proceed to Step 2.          | Lump as same species. Stop.                   | Club member          |
  | 2    | Does the **most recent field guide** list them as separate species?             | Guide explicitly splits them *and* describes diagnostic features.                   | Proceed to Step 3.          | Lump as same species. Stop.                   | Club member          |
  | 3    | Can you **see/confirm the diagnostic features** in the photos?                  | Features are visible, unambiguous, and match the guide (e.g., vein patterns, spine counts). | Proceed to Step 4.          | **Punt to advisor** (if features unclear).    | Whole club consensus |
  | 4    | Do they **occupy different habitats/ranges** locally?                           | Found in distinct microhabitats (e.g., aquatic vs. terrestrial) or non-overlapping zones. | Proceed to Step 5.          | Lump as same species. Stop.                   | Club member          |
  | 5    | Is there **evidence of reproductive isolation**?                                | Strong proxy: different breeding seasons, activity times (day/night), or pollination mechanisms. | Split into two species. Stop. | Lump as same species. Stop.                   | Advisor              |

  ---

  ### Case Analyses  
  **Case 1: Ground Beetles (split by new guide, lumped by old guide)**  
  ```json
  {
    "case": "Ground beetles with subtle wing cover ridges",
    "decision_at_each_step": {
      "step1": "No (no obvious visual differences)",
      "step2": "Yes (new guide splits them)",
      "step3": "No (club can't see/confirm ridges in photos)",
      "step4": "No (same habitat/range)",
      "step5": "N/A"
    },
    "final_call": "Lump as one species",
    "confidence": "Low",
    "where_this_could_go_wrong": "We might be lumping two true species if ridges are diagnostic but photos are poor."
  }
  ```

  **Case 2: Weird Sunflowers (suspected hybrids)**  
  ```json
  {
    "case": "Sunflowers by creek, possibly hybrids",
    "decision_at_each_step": {
      "step1": "Yes (intermediate traits between two known species)",
      "step2": "No (field guides rarely list hybrids as distinct species)",
      "step3": "N/A",
      "step4": "Yes (growing in hybrid zone between parent species)",
      "step5": "Punt (reproductive status unknown)"
    },
    "final_call": "Punt to advisor",
    "confidence": "None (beyond club's scope)",
    "where_this_could_go_wrong": "Lumping might ignore a stable hybrid swarm; splitting might overcomplicate the list."
  }
  ```

  **Case 3: Brown Moths (identical look, different activity times)**  
  ```json
  {
    "case": "Identical moths: one nocturnal, one crepuscular",
    "decision_at_each_step": {
      "step1": "No (visually identical)",
      "step2": "No (field guides may not mention activity time)",
      "step3": "N/A",
      "step4": "No (overlapping habitat)",
      "step5": "Yes (different activity times = reproductive isolation proxy)"
    },
    "final_call": "Split into two species",
    "confidence": "Medium",
    "where_this_could_go_wrong": "They could be the same species with behavioral polymorphism (rare but possible)."
  }
  ```

  ---

  ### What This Procedure Can't Do  
  **This method cannot handle:** Cryptic species with no visible/ecological differences, ring species (where adjacent populations interbreed but endpoints don’t), recent evolutionary divergences, or cases requiring genetic/detailed anatomical analysis (e.g., fungi, microbes). It also struggles with hybrid complexes and species defined by behavior alone. Tell your advisor these cases will be flagged as "needs expert review."
