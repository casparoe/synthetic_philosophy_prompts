  First, I need to diagnose the nature of the disagreement. The user says both sides in bioethics don't argue but assume their position. That suggests they're operating with different conceptual frameworks. The Kripkeans focus on strict numerical identity based on origin, while clinicians and some ethicists care about relational continuity—like the mother's genetic contribution and the child's life story. So the conflict might stem from differing criteria for "sameness."

