  But why won't they name this indeterminacy? Maybe because admitting it undermines their stance. For essentialists, it challenges the necessity of origin; for clinicians, it might raise uncomfortable ethical questions about creating "different" children. So both sides avoid the core issue.

  Is this disagreement verbal? Partly. Terms like "same child" have different meanings—numerical identity vs. practical continuity. But it's also about bedrock intuitions. Essentialists prioritize strict causal origins, while others value the relational context. These intuitions might be unshakeable, making the debate unresolvable on purely metaphysical grounds.

  The user's inconsistency: previously, they saw vagueness in best-candidate theories as a surrender. Now they consider it a solution. But there's a difference. Best-candidate theories imposed arbitrary cutoffs, whereas here, vagueness is inherent. Accepting it isn't surrender but acknowledging reality—like admitting there's no fact of the matter in borderline cases.

