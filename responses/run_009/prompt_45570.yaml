               Picked up and don't pay: 200 -10 -150 = 40 -> so they will choose to pay to get 90 instead of 40.
          - Driver: if the hitchhiker has a contract, they know they will get 50 by picking up. If not, they know they will get -50 (because without contract, the hitchhiker will choose not to pay). So they only pick up if there's a contract.
          - Therefore, hitchhikers without contract are not picked up and get -110? Actually, without contract and not picked up: -100 (they don't pay the 10). 
               Without contract: 
                   Not picked up: -100
                   Picked up: they can choose not to pay and get 200 -> so they want to be picked up? But the driver won't pick them up because they know they will not pay.
          - So without contract: they get -100. With contract: they get 90 (if picked up) or -110 (if not picked up). But the driver will pick up only if there's a contract. So with contract, they get 90. So it's better to buy the contract.

     Round 4: Reputation via Assignment of Types (Simplified)
          - We will assign 4 of the hitchhikers to be "Honest" and 2 to be "Dishonest". We tell everyone that there are 4 honest and 2 dishonest, but we don't reveal who is who.
