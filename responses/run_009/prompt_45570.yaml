          - The driver's payoff:
               Honest: driver 100, hitchhiker 100
               Dishonest: driver -50, hitchhiker 200
               Drive by: 0, hitchhiker -100
          - Driver's EV: (4/6)*100 + (2/6)*(-50) = (400-100)/6 = 300/6=50>0. So they will pick up.
          - Then the honest get 100 and the dishonest get 200.
          - But we want to show that the honest are necessary for the system. We can then discuss: what if there were no honest? The driver's EV would be -50 -> they wouldn't pick up, so even the dishonest would get -100.

     This Round 4 is quick and makes the point.

   Now, the debrief:

     We need to explain:
        - Backwards induction: in the repeated game, they might have tried to cooperate, but in the last round the hitchhiker has no incentive to pay. Then the driver, anticipating that, won't pick up in the last round. Then in the second round, the hitchhiker has no incentive to pay because the driver won't pick up in the next round anyway? So it unravels.
        - The commitment device: by committing in advance (even at a cost), the hitchhiker changes the driver's expectation and gets a ride.
        - The value of being the type of person who always pays: in Round 4, the honest hitchhikers get less than the dishonest ones in that round, but without them, the drivers wouldn't pick up. So in the long run, being honest (or having a reputation for honesty) is valuable.

     Also, why it's not the prisoner's dilemma?
          - Prisoner's dilemma: both players move simultaneously and have a dominant strategy to defect, leading to a bad outcome.
          - Here: the driver moves first. The driver doesn't have a dominant strategy to defect? In fact, the driver would like to pick up if they are sure they will be paid. But if they are not sure, they avoid.
          - The hitchhiker, if picked up, has a dominant strategy to not pay? So the driver, knowing that, avoids. This is a sequential game with a commitment problem.

     Debrief script:

          "In Round 1, what happened? Why didn't drivers pick up? ... Because they knew that once the hitchhiker was in the car, the hitchhiker would have no reason to pay. So the driver would lose 50. This is called 'backwards induction': we reason from the end. The hitchhiker, at the moment of payment, has an incentive to break the promise. But if the hitchhiker could commit to paying, then the driver would pick up.

          In Round 2, we played repeatedly. Did anyone manage to get the hitchhiker to pay in the first round? ... What about the last round? ... Why did it break down? ... Because in the last round, the hitchhiker would not pay, so the driver wouldn't pick up in the last round. Then in the second round, the hitchhiker had no incentive to pay because the driver wouldn't pick up in the next round anyway? So it unraveled.

          In Round 3, we introduced the commitment contract. How did that change things? ... The contract made it so that if the hitchhiker didn't pay, they got penalized. So they paid. Then the driver, knowing that, picked up. So the hitchhiker was better off buying the contract (getting 90) than not (getting -100). 

          In Round 4, we had some hitchhikers who were honest (they would always pay) and some who were not. The drivers didn't know who was who, but they knew there were enough honest ones that on average they would gain. So they picked up. The honest hitchhikers got 100, and the dishonest got 200. But note: if there were no honest hitchhikers, the drivers wouldn't pick up at all. So the honest hitchhikers made it possible for everyone to get a ride. In the long run, being the kind of person who always keeps promises can be beneficial because it builds trust.

          Why isn't this the prisoner's dilemma? In the prisoner's dilemma, both players have a dominant strategy to defect regardless of what the other does. But here, the driver doesn't have a dominant strategy to drive by: they would love to pick up if they knew they would be paid. The problem is that the hitchhiker has a dominant strategy to not pay once they are picked up. This is a commitment problem, not a prisoner's dilemma."

     What might go wrong with teenagers:

        - They might not understand the rules. So explain clearly and do a practice round.
        - In Round 2 (repeated), they might cooperate even in the last round? But that's fine, we can discuss why: maybe they care about fairness? But the point is that in theory, they shouldn't.
        - In Round 4, the dishonest hitchhikers might brag about getting 200, causing resentment. Emphasize that it's a simulation and we are learning.
        - Sharp players: 
              In Round 3, a hitchhiker might buy the contract and then not pay? But the penalty is enforced by the game. We must enforce the penalty.
              In Round 4, drivers might try to avoid if they think their specific hitchhiker is dishonest? But they don't know. We must enforce that they only know the distribution.

