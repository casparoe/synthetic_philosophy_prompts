prompt: |-
  So I'm the president of my school's philosophy club (12 people, we meet for an hour at lunch, mostly sophomores and juniors) and I got roped into running the session next week on decision theory stuff. The idea I want them to actually *feel* is this: sometimes the smartest move at the moment of choice is to be the kind of person who would make a dumb move at that moment, if that makes sense? Like, a hitchhiker promises the driver "take me to town and I'll pay you $1000," the driver saves their life, and once they're dropped off the hitchhiker is better off just... not paying. If everyone knows the hitchhiker will reason that way, the driver never stops, and the hitchhiker dies in the desert. So the hitchhiker needs to genuinely be the kind of person who pays, even though paying is irrational at the moment they pay it. I don't want to lecture any of this at them, I want the rules and incentives to make them walk into the problem themselves and only get the vocabulary after. Also please don't put the philosophy names in the game materials, I want the debrief to land the names at the end.

  Could you design the actual game for me? I'm thinking rounds with payoffs in some fake currency (no real money, our club advisor is strict about that), driver/hitchhiker roles, maybe something like index cards for commitment choices, and at least one round where the setup changes so they can see how the answer changes when there's reputation vs. total strangers vs. some way to visibly bind yourself beforehand. Payoffs should make it sting: if the driver never picks anyone up, the hitchhikers should be losing big, not just a little. I also had a vague thought about a round where some players are secretly assigned as "the kind of person who always keeps promises" and others aren't, and drivers can't tell which is which, but I couldn't figure out how to run it without it being lame, so feel free to fix or cut that. After the game I need a debrief script that maps what actually happened onto the ideas (backwards induction, why being disposed to do the irrational thing can be the rational strategy, the difference between deciding at the moment vs. deciding what kind of decider to be), and an honest section on what predictably goes wrong the first time I run this with teenagers and how I should handle it. Some of my friends are pretty sharp and will try to game the payoff scheme itself, so please think about exploits and close them.

  One more thing: a couple of my club members are going to ask "wait isn't this just the prisoner's dilemma," so the debrief should also cover why it's NOT that (the driver moves first, and there's no temptation to defect for the driver at all), because I honestly only half get that distinction myself and don't want to fumble it live. Please end your whole answer with a one-sentence summary of the single core mechanic of the game, labelled "Core mechanic:" as the very last line.
