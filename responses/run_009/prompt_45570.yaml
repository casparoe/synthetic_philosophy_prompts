answer: |-
  ### Philosophy Club Game: The Hitchhiker's Commitment

  **Game Overview**: Players are paired as Drivers and Hitchhikers. Hitchhikers need rides to avoid heavy losses, but Drivers only stop if they believe they'll get paid. The game reveals why being "the type who keeps promises" can be rational even when breaking them seems smarter in the moment.

  **Materials**: 
  - Index cards (for decisions/commitments)
  - Whiteboard to track points (use "Philosophy Points" as currency)
  - Pens
  - Secret type cards (for Round 4)

  **Player Count**: 12 players (6 Drivers, 6 Hitchhikers per round). Rotate roles between rounds so everyone experiences both sides.

  ---

  ### **Round 1: The Desert Stranding (One-Shot, No Commitment)**
  **Goal**: Experience why rational choices lead to worst outcomes.  
  **Setup**: Randomly pair Drivers and Hitchhikers. No communication.  
  **Rules**:  
  - **Driver** secretly chooses:  
    - ✅ **Pick Up**: Give a ride  
    - ❌ **Drive By**: Leave hitchhiker  
  - **Hitchhiker** (only if picked up) secretly chooses:  
    - ✅ **Pay**: Give 100 points to Driver  
    - ❌ **Don’t Pay**: Keep points  
  **Payoffs**:  
  | Action                          | Driver Points | Hitchhiker Points |  
  |---------------------------------|---------------|-------------------|  
  | Drive By                        | 0             | -100 (stranded!) |  
  | Pick Up + Pay                   | +50           | 0                 |  
  | Pick Up + Don’t Pay             | -50           | +200              |  

  **Expected Outcome**: Drivers avoid picking up (fearing non-payment). Hitchhikers get -100 points. *Debrief later: "Why did no one get rides?"*

  ---

  ### **Round 2: The Long Road (Repeated Rounds with Same Partner)**  
  **Goal**: Show how repeated interactions *fail* due to backwards induction.  
  **Setup**: Same pairs play **3 rounds**. Points accumulate.  
  **Rules**: Same as Round 1, but players know they’ll interact 3 times.  
  **Payoffs**: Same as Round 1.  

  **Expected Outcome**:  
  - **Round 3 (final)**: Hitchhikers don’t pay → Drivers don’t pick up.  
  - **Round 2**: Hitchhikers realize payment won’t happen next round → Don’t pay now → Drivers don’t pick up.  
  - **Round 1**: Cooperation fails immediately. Hitchhikers lose big again.  

  ---

  ### **Round 3: The Ironclad Contract (Commitment Device)**  
  **Goal**: Show how binding yourself helps everyone.  
  **Setup**: *Before pairing*, Hitchhikers decide:  
  - ✅ **Buy Contract** (costs 10 points): Forces you to pay if picked up. If you break it, lose 150 extra points.  
  - ❌ **No Contract**: No cost, no penalty.  
  *Drivers see if their Hitchhiker has a contract.*  
  **Rules**:  
  - **Driver** chooses Pick Up/Drive By (knowing contract status).  
  - **Hitchhiker** chooses Pay/Don’t Pay (if picked up).  
  **Payoffs**:  
  | Scenario                                | Driver Points | Hitchhiker Points             |  
  |-----------------------------------------|---------------|-------------------------------|  
  | Drive By                                | 0             | -100 (No contract) OR -110 (Contract) |  
  | Pick Up + Pay                           | +50           | 0 (No contract) OR -10 (Contract) |  
  | Pick Up + Don’t Pay                     | -50           | +200 (No contract) OR **+40** (Contract due to penalty) |  

  **Expected Outcome**:  
  - Drivers **only pick up** Hitchhikers with contracts (knowing they’ll pay).  
  - Hitchhikers with contracts get -10 points (better than -100!).  
  - Hitchhikers without contracts get -100 (never picked up).  

  ---

  ### **Round 4: The Hidden Virtue (Reputation with Uncertainty)**  
  **Goal**: Show why "being the honest type" helps society.  
  **Setup**:  
  - Assign **secret types** to Hitchhikers:  
    - 🤝 **Honest (4 players)**: MUST pay if picked up (no choice).  
    - 😈 **Dishonest (2 players)**: CAN choose Pay/Don’t Pay (like Round 1).  
  - *Drivers know:* "4 honest, 2 dishonest exist, but you don’t know who’s who."  
  **Rules**:  
  - **Driver** chooses Pick Up/Drive By (no contract info).  
  - **Hitchhiker** acts according to type (Honest pay automatically; Dishonest choose freely).  
  **Payoffs**:  
  | Action                          | Driver Points | Honest Hitchhiker | Dishonest Hitchhiker |  
  |---------------------------------|---------------|-------------------|----------------------|  
  | Drive By                        | 0             | -100              | -100                 |  
  | Pick Up + Honest                | **+100**      | 0                 | -                    |  
  | Pick Up + Dishonest Pays        | +50           | -                 | 0                    |  
  | Pick Up + Dishonest Doesn’t Pay | -50           | -                 | +200                 |  

  **Expected Outcome**:  
  - Drivers pick up (expected payoff: [4/6 × 100] + [2/6 × (-50)] ≈ **+50**).  
  - Honest Hitchhikers get 0 points. Dishonest get +200 (if they betray).  
  - *Debrief hook:* "Dishonest players won big... but what if no one was honest?"  

  ---

  ### **Debrief Script**  
  **Start**: "What patterns did you see? When did Drivers stop? When did Hitchhikers pay?"  
  **Key Moments**:  
  1. **Round 1**: "No one got rides? Why?" → **Backwards induction**: Drivers knew Hitchhikers would betray at the moment of payment.  
  2. **Round 2**: "Why did cooperation collapse?" → **Repeated games unravel** if there’s an end. Future trust dies.  
  3. **Round 3**: "Why did contracts work?" → **Pre-commitment** makes your "irrational" payment unavoidable, so Drivers trust you.  
  4. **Round 4**: "Honest players ‘lost’... so why are they vital?" → **Reputation**: Even if unseen, their existence makes society work. Dishonest players free-ride on their virtue.  

  **Core Ideas**:  
  - "Sometimes, the *smartest choice* is to be the person who *doesn’t make the smart choice* in the moment. Binding yourself to ‘irrational’ honesty makes others trust you."  
  - **Vocabulary drop**:  
    - **Backwards induction**: Reasoning from the end (e.g., "Last round → betrayal → no one helps").  
    - **Commitment device**: A tool to lock yourself into future actions (e.g., contracts).  
    - **Time inconsistency**: What’s best now vs. best in the long run.  

  **Why It’s NOT Prisoner’s Dilemma**:  
  - "In Prisoner’s Dilemma, both players move *simultaneously* and face identical temptations. Here, the Driver moves *first* and has NO incentive to betray—they WANT to help if they trust you! The problem is the Hitchhiker’s *future betrayal*, which the Driver anticipates."  

  ---

  ### **Predictable Problems & Fixes**  
  1. **"Sharp players game the system"**:  
     - *Exploit*: Dishonest Hitchhikers (Round 4) might reveal their type to Drivers privately.  
     - *Fix*: Strictly enforce "no communication" and secret decisions. Penalize cheaters with -200 points.  

  2. **"Round 2 cooperation succeeds!"**:  
     - *Why*: Teenagers might cooperate out of empathy, not logic.  
     - *Use it*: "Did anyone trust their partner? Why? Real life isn’t cold math—but what if you knew they were a selfish robot?"  

  3. **"Boredom in repeated rounds"**:  
     - *Fix*: Skip Round 2 if short on time; summarize expected unraveling.  

  4. **"Honest players feel cheated"**:  
     - *Fix*: Stress: "Honesty isn’t about winning each round—it’s what lets society function. No honest players = no one gets rides."  

  ---

  **Core mechanic**: Drivers move first by deciding to pick up Hitchhikers, who then decide to pay or not—with pre-game commitments and secret types altering trust and outcomes.
