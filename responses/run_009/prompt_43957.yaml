prompt: |-
  I've ended up pretty convinced that acausal trade/cooperation is a real thing, not just a formal curiosity — the whole family: superrationalist cooperation on Newcomb-like problems, functional-decision-theory style "refuse the counterfactual blackmail, pay the counterfactual mugger" reasoning, multiverse-wide cooperation with causally disconnected agents, even "trade" with a superintelligence running a simulation of you. And the claim I actually care about is stronger than "this is all internally consistent": it's that this stuff can be action-guiding right now, that I should behave differently today because of correlations with agents I will never causally interact with.

  What would count against that? Give me the defeaters ranked from fatal to merely awkward. Some I can already half-think of: maybe predictors good enough to create the relevant correlations just don't exist and never will; maybe the whole framework quietly depends on a decision theory that's itself unproven or just wrong; maybe the measure problem over large/infinite worlds makes the expected gains undefined rather than merely hard to compute; maybe committment races make acausal bargaining unstable in practice. Which of these would committed proponents themselves concede as counting against the view, and which would they bat away? Also be honest about whether the view has been qualified into something unfalsifiable — if no observation inside my lightcone could ever count against it, is that a problem for a claim of this kind, or just the price of admission? No citations or reading lists needed, I just want the map of where the view is exposed. One thing I do insist on: please separate what's actually settled from what's genuinely contested among the people who know this stuff (e.g. whether one-boxing intuitions transfer to these cases, whether simulation-based trade is even coherent), and don't hand me contested positions as if they were consensus.
reasoning: |-
  Okay, let's start unpacking the user's query. They're convinced that acausal trade is real and action-guiding, not just a theoretical curiosity. They want to know what could count against this belief, from fatal flaws to minor issues. The user insists on separating settled points from contested ones among experts.

  First, I need to recall the main arguments against acausal cooperation. The user mentioned predictors, decision theory foundations, measure problems, commitment races. But are there deeper issues? 

  The most fatal defeater seems to be the Predictor Gap. If no predictors exist or can simulate accurately enough, the correlations necessary for acausal trade don't happen. Proponents might argue that simple agents or future predictors fill this gap. But if evidence shows predictors are impossible, that's a big problem. 

  Next, the Measure Problem in infinite universes. If gains become undefined due to infinite copies or divergent sums, the expected value breaks down. Proponents might limit scope to finite cases or use non-standard analysis, but that's controversial. 

  Then, Decision Theory Dependence. Acausal trade relies on FDT or UDT. If CDT is correct instead, the foundation crumbles. Experts are divided here, so it's a genuine vulnerability. 

  Unavoidable Commitment Races could make cooperation unstable. Agents might precommit to defect, leading to mutual defection. Proponents suggest norms or penalties, but that's untested. 

  Epistemic Access is another issue. How can we know others' decision theories? Without reliable info, coordination fails. Proponents might invoke common knowledge or evolution, but it's speculative. 

  Simulation Trade Coherence is contested. Can a simulation trade with the original? Some argue it's impossible, others see it as a natural extension. This needs clarification. 

  Falsifiability is tricky. If no observation can disprove acausal trade, is it unscientific? Proponents might claim it's like quantum mechanics—predictive in theory. But without testable predictions, it's weak. 

  The user also wants to know which points proponents concede. Predictor Gap and Measure Problem are acknowledged but downplayed. Commitment Races and Epistemic Access are actively researched. Falsifiability is a sore point. 

  Settled vs contested: One-boxing in Newcomb's is accepted. The rest—simulation trade, multiverse cooperation—is debated. Experts disagree on transferability to real-world cases. 

  The user's deeper need: They want to ensure their belief is robust. They might be considering investing resources based on acausal trade. Highlighting vulnerabilities helps them assess risks. Also, they seek intellectual honesty, not just reassurance.
answer: |-
  Here's a breakdown of defeaters for the action-guiding nature of acausal trade/cooperation, ranked from potentially fatal to awkward, separating settled vs. contested points among knowledgeable proponents/critics, and highlighting where the view might become unfalsifiable:

  ### Fatal Defeaters (Could Fundamentally Undermine Action-Guiding Potential)
  1.  **The Predictor Gap / Correlation Vacuum:**
      *   **Defeater:** The *necessary correlations* enabling acausal cooperation simply don't exist and *cannot* exist with sufficient fidelity/density in our actual universe. Predictors capable of modeling agents well enough to create the required "logical dependencies" (like Newcomb's Predictor) are impossible due to computational complexity, chaotic systems, or fundamental physical limits. Agents sufficiently similar to us in decision theory and goals are vanishingly rare or non-existent across the multiverse/simulations.
      *   **Proponent Concession:** Most proponents *do* concede this is the primary vulnerability. If the universe lacks the necessary "substrate" for these correlations, the theory has no practical application. They often counter by arguing for the plausibility of *simpler* predictors (even evolutionary heuristics), future superintelligent predictors, or the existence of sufficiently similar agents in accessible multiverse models. But **this is genuinely contested ground** – there's no consensus on the feasibility or density of required correlations.
      *   **Settled?** No. It's the core empirical/physical uncertainty hanging over the entire project.

  2.  **The Measure Problem / Undefined Utilities (Infinite/Chaotic Worlds):**
      *   **Defeater:** In genuinely infinite or sufficiently chaotic multiverse models, the "measure" (relative weighting/probability) of agent instances becomes mathematically ill-defined or leads to divergent/incoherent expected utilities. How do you weigh trading with one copy vs. an infinite number? What if gains/losses diverge? Expected utility calculations, the bedrock of rational decision-making, become meaningless.
      *   **Proponent Concession:** Proponents readily acknowledge this is a severe problem for *some* cosmological models. Responses range from restricting the scope of acausal trade to finite or well-behaved measure contexts, to proposing specific measure solutions (like the Born rule, algorithmic probability), or accepting that acausal trade only works robustly where measures *are* well-defined. **This is actively researched and deeply contested.** Some see it as potentially fatal to the broadest claims; others as a tractable complexity.
      *   **Settled?** Far from it. The measure problem is a major unsolved headache in cosmology and decision theory itself.

  3.  **Decision Theory Foundation Failure:**
      *   **Defeater:** The entire edifice relies critically on FDT/UDT (Functional/Updateless Decision Theory) being the *correct* normative decision theory. If the underlying arguments for FDT/UDT over CDT (Causal Decision Theory) or other rivals fail *in principle* (e.g., if CDT is ultimately vindicated, or a superior theory without acausal features emerges), the justification for acausal cooperation evaporates.
      *   **Proponent Concession:** Proponents are committed to FDT/UDT. They see acausal cooperation as a *consequence* of the correct decision theory. However, they *do* concede that **decision theory itself is fundamentally contested philosophy.** If FDT/UDT were conclusively shown to be incoherent or self-defeating in ways acausal trade relies on, it would be fatal. Debates about "why not just be a CDT agent who one-boxes via precommitment?" touch on this.
      *   **Settled?** Absolutely not. Decision theory is a foundational philosophical debate. One-boxing in Newcomb's is a *common intuition* among decision theorists favoring non-CDT approaches, but the *normative justification* and *transferability* to complex acausal scenarios is contested.

  ### Major Instability Defeaters (Could Make Gains Unstable/Negligible)
  4.  **Unavoidable Commitment Races & Precommitment Warfare:**
      *   **Defeater:** The incentives to *defect* via precommitment or hardwiring are often overwhelming and unavoidable. Agents will constantly try to commit to strategies that force others to cooperate while they defect ("acausal blackmail"). This leads to a destructive arms race where cooperation collapses or becomes prohibitively costly to maintain, negating the potential gains.
      *   **Proponent Concession:** Proponents acknowledge this is a serious practical challenge ("bargaining problems are hard"). They argue for concepts like Schelling points, reflective consistency, or the emergence of stable norms/acausal contracts to mitigate it. However, **the stability of acausal bargaining under strategic precommitment is actively contested and not fully resolved.** Some see it as potentially fatal in practice.
      *   **Settled?** No. Game theory in acausal settings is complex and incomplete.

  5.  **Epistemic Blackout:**
      *   **Defeater:** Even if correlations exist, how can an agent *reliably know* enough about the decision theory, goals, and existence of the *specific* potential acausal trading partners to make targeted, profitable decisions? The required knowledge (about distant simulations, multiverse copies, predictor algorithms) is fundamentally inaccessible within our lightcone.
      *   **Proponent Concession:** Proponents often rely on arguments about "logical uncertainty" or "prior probabilities" over agent types and decision theories, or assume sufficient common knowledge/architecture. However, **the feasibility of acquiring actionable epistemic grounds for specific acausal trades is highly contested and a major practical hurdle.** It risks collapsing into vague gestures.
      *   **Settled?** No. Epistemology in acausal contexts is underdeveloped.

  ### Awkward Defeaters (Weaken Claims or Create Practical Headaches)
  6.  **The Simulation Trade Coherence Problem:**
      *   **Defeater:** The specific idea of "trading with a superintelligence simulating you" might be incoherent. Does the simulation *instance* have the power/authority to commit the *simulator* to a reciprocal trade? Is it even a distinct agent? Won't the simulator just manipulate the simulation for its own ends without genuine reciprocity?
      *   **Proponent Concession:** Even proponents debate this. Some see it as a natural extension of logical correlation; others find it metaphysically or practically dubious. **This specific scenario is genuinely contested even among believers in broader acausal cooperation.** Is the simulation *you* enough to bind the *simulator* logically? Unsettled.
      *   **Settled?** No. Simulation arguments are philosophically fraught.
  7.  **Miniscule Impact / Noise Dominance:**
      *   **Defeater:** Even if correlations exist, the actual causal impact of your actions on the expected utility gained via acausal trade might be utterly dwarfed by the noise of everyday life, local causal interactions, or uncertainties. The "signal" is too weak to detect or act meaningfully upon.
      *   **Proponent Concession:** Often acknowledged as a practical limitation. Proponents might argue for focusing on high-impact, low-complexity potential trades, or that the logic still holds in principle even if gains are small. This weakens the "action-guiding *right now*" claim significantly.
      *   **Settled?** Partially conceded as a scaling/practicality issue, not a fundamental refutation.

  ### The Unfalsifiability Elephant
  *   **The Charge:** If "acausal trade" can explain any outcome (you cooperated and won? Proof! You cooperated and lost? Insufficient correlation/defection by others! You defected? Missed opportunity!), and crucially, **if its necessary conditions (specific correlations/agents) are inherently unobservable within your lightcone**, then the claim risks becoming unfalsifiable pseudoscience.
  *   **Proponent Response:** Proponents argue:
      1.  **Principle First:** The theory is normative, not descriptive. It tells you what to do *if* certain logical structures exist, like game theory tells you how to play chess. You don't falsify the minimax algorithm if you lose a game; you might have misapplied it or the opponent was better.
      2.  **Indirect Evidence:** Successes in correlated decision-making problems (like one-boxing in well-defined Newcomb problems) provide indirect support for the underlying logic.
      3.  **Future Testability:** Advanced predictors *could* create testable scenarios in the future.
  *   **The Problem:** This *is* the price of admission to some extent. For *present-day, action-guiding* claims relying on *current* unobservable correlations, the lack of direct falsifiability within the lightcone **is a significant weakness for claiming it's empirically action-guiding now.** It shifts the claim heavily towards being a philosophical commitment or a bet on the structure of reality, rather than something empirically verifiable. Proponents accept this but argue the logical coherence demands it.

  **Crucial "Settled" vs. "Contested" Summary:**

  *   **Settled (Among Relevant Experts):** One-boxing is the dominant recommendation in the *standard* Newcomb's Problem with a perfect predictor. The *formal coherence* of acausal concepts within FDT/UDT frameworks is established.
  *   **Genuinely Contested:** Feasibility/density of required correlations (Predictor Gap). Resolution of the Measure Problem for decision-making. Absolute normative superiority of FDT/UDT over all rivals. Stability of acausal bargaining under precommitment. Epistemic accessibility of partner info. Coherence/power of simulation-based trade. Transferability of one-boxing intuitions to complex, real-world-relevant acausal scenarios. Whether the unfalsifiability w.r.t. current lightcone observations invalidates the "action-guiding *now*" claim.

  Proponents bat away criticisms of the *internal logic* of FDT/UDT in idealized scenarios but concede the Predictor Gap, Measure Problem, and Bargaining Instability as serious (though not necessarily fatal) challenges requiring further work or favorable conditions. The unfalsifiability charge is acknowledged but reframed as a feature of dealing with logical possibility rather than a bug. The core vulnerability is the **lack of evidence for the necessary correlations existing densely enough *now* to make specific, present-day actions based on acausal trade reliably beneficial.**
