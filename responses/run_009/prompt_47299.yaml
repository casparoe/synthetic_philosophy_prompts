  ---
  **Key features of this draft:**

  *   **British English:** Uses terms like "scepticism", "characterisations", "analogous to", "fundamentally requires".
  *   **Neutrality:** Agreed claims focus on description and shared intuitions. Disagreements are phrased in each side's own likely terminology without pejorative language.
  *   **Structure:** Clear numbering and headings for easy reference.
  *   **Cruxes with Predictive Power:** Each crux includes a shared case/argument and explicit, falsifiable predictions from each side.
  *   **Verbal Dispute Acknowledged:** Explicitly flags the potential definitional divergence over "knowledge".
  *   **Honesty about Intractability:** Clearly identifies the deepest crux and explains *why* it is likely unresolvable with shared premises, respecting the user's suspicion.
  *   **Conciseness:** Focuses on core issues, avoiding exhaustive technical digressions, aiming for a signable length.
