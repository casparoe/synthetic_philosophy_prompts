prompt: |-
  Having spent a career in radiochemistry, I have lately been reading philosophy of probability, and I would value an audit of a summary I have encountered. A popular book on chance and determinism, whose title I omit since I am working from notes, characterises Lewis's Principal Principle as follows:

  "Lewis's Principal Principle says that once you know the objective chance of an event, your degree of belief that it will occur should be set equal to that chance. So if the half-life of radium-226 tells you there is a 50 per cent chance a given atom decays within 1,600 years, you should be precisely 50 per cent confident that it does. The principle is really a definition of chance: the chance of an event just is the number a fully rational agent ought to assign to it, and on this basis Lewis showed that objective chances exist and can be reduced to long-run frequencies. A fatal flaw was found later, however, the undermining problem: because a probabilistic theory itself holds only with some chance, the principle yields an outright contradiction, and Lewis conceded that it had to be abandoned."

  Most of this chimes with what I think I understand, but the closing claim surprised me, as I had gathered that the principle is still taken seriously. Please go through the summary claim by claim and tell me which parts a philosopher working on objective chance would accept, which are harmless simplifications, and which are genuine misrepresentations. I should particularly like your judgement on four points: whether the principle is a definition of chance or instead a normative constraint relating chance to credence; whether it applies unconditionally once the chance is known, or only relative to admissible evidence; whether Lewis identified chance with long-run frequencies; and whether the undermining problem refuted the principle outright or led to a refinement that preserved its spirit. Please answer in British English.
reasoning: |-
  Okay, the user is a radiochemistry professional who's been reading philosophy of probability. They want me to audit a summary they encountered about Lewis's Principal Principle. The summary makes four key claims that they're questioning: whether the principle defines chance or is normative, its unconditional application, Lewis's supposed reduction of chance to frequencies, and whether undermining refutes it entirely.

  Hmm, I need to address this carefully. The user clearly has scientific expertise but is new to philosophical nuances. They're surprised by the claim that Lewis abandoned the principle due to undermining - which matches my knowledge that it's still actively discussed. I should acknowledge their correct intuition here.

  First, the "definition of chance" part. Lewis was actually doing something more subtle - using the principle to constrain what can count as chance. It's not a straight definition but a test for genuine chance. The user's notes oversimplify this. 

  On admissibility - this is crucial! The summary completely omits how Lewis restricts the principle to situations without "inadmissible" evidence like future histories. That's a serious omission that distorts the principle.

  The frequency reduction claim is misleading too. Lewis did think chances were connected to frequencies via the Principal Principle, but he explicitly rejected strict identification. His "best system" account is more sophisticated. The user's notes flatten this nuance.

  Ah, the undermining problem - this is where the summary goes most wrong. Lewis didn't abandon the principle; he modified it with the "New Principle". The user is right to be skeptical about the "fatal flaw" language. Current philosophers still debate refined versions.

  I should structure my response to correct each point while validating the user's correct instincts. They'll appreciate knowing which parts are salvageable simplifications versus outright errors. Since they work with radioactive decay examples, I can use that to illustrate admissibility - like how knowing a specific atom's decay time would violate the principle's conditions.

  The user seems precise and thoughtful - they even specified British English. I'll match that tone: "colour" not "color", "recognise" not "recognize". And emphasize where their surprise was warranted - they've clearly done good background reading to spot the problems.
answer: |-
  Your critical eye serves you well – that summary contains significant oversimplifications and one outright error regarding the "fatal flaw." Let's dissect it claim-by-claim using British English, as requested:

  **Summary Claim:** "Lewis's Principal Principle says that once you know the objective chance of an event, your degree of belief that it will occur should be set equal to that chance."

  *   **Accuracy:** **Broadly Correct, but Crucially Incomplete.** This captures the core *idea*, but omits the absolutely vital qualification concerning **admissible evidence** (see below). It states the *norm* Lewis proposed.

  **Summary Claim:** "So if the half-life of radium-226 tells you there is a 50 per cent chance a given atom decays within 1,600 years, you should be precisely 50 per cent confident that it does."

  *   **Accuracy:** **Conditionally Correct (as an illustration).** This is a standard *example* used to illustrate the principle. However, its correctness *assumes* you possess *only* the information about the objective chance (the half-life) and lack any *inadmissible* evidence about *this specific atom* (e.g., knowledge of its exact decay time from some future diary).

  **Summary Claim:** "The principle is really a definition of chance: the chance of an event just is the number a fully rational agent ought to assign to it..."

  *   **Accuracy:** **Misleading/Misrepresentation.** This is the most significant misstep.
      *   Lewis did **not** present the Principal Principle *as* the definition of chance.
      *   He presented it as a **fundamental, constitutive normative constraint** that any genuine notion of *objective chance* must satisfy. It's a **test** that objective chances must pass: they must be the credences a rational agent would adopt *if* they knew the chances and possessed no inadmissible evidence.
      *   He then used this principle, combined with his Humean metaphysics (specifically the Best System Account - BSA), to *analyse* what objective chances *are* within a world like ours. The PP tells us *what chances must do*; the BSA (incorporating fit with frequencies, simplicity, strength) tells us *what chances are* (summaries of particular patterns in the Humean mosaic).

  **Summary Claim:** "...and on this basis Lewis showed that objective chances exist and can be reduced to long-run frequencies."

  *   **Accuracy:** **Partially Correct, Partly Misleading.**
      *   **Existence:** Lewis argued, using the PP and the BSA, that objective chances *do* exist *if* the world is such that the best systematisation of its particular matters of fact (the Humean mosaic) includes probabilistic laws. He didn't "prove" existence metaphysically; he showed how chance fits within a Humean framework.
      *   **Reduction to Frequencies:** **Misleading.** Lewis **explicitly rejected** a simple reduction of chances to actual finite frequencies. His Best System Account (BSA) is far more sophisticated:
          *   Chances are defined by the probabilistic laws belonging to the *best* systematisation of the *entire* history of the world (the Humean mosaic).
          *   What makes a system "best" is a balance of **simplicity, strength (informativeness), and fit**.
          *   *Fit* is measured by how likely the actual history is according to the system's probabilistic laws. This **involves** frequencies – a system fits well if the actual frequencies in the world are *typical* according to its chances. But:
          *   Chances are *not identical* to any particular finite frequency. They are defined by the entire system and its global fit. Finite frequencies are *evidence* for chances (via the PP) and constrain the *fit* of a system, but they are not what chances *are*.

  **Summary Claim:** "A fatal flaw was found later, however, the undermining problem: because a probabilistic theory itself holds only with some chance, the principle yields an outright contradiction..."

  *   **Accuracy:** **Partially Correct (Problem Exists), but Misleading on Severity.**
      *   **The Undermining Problem is Real:** This is a genuine and profound problem Lewis identified *himself* for Humean accounts of chance (like his BSA) combined with the original Principal Principle.
      *   **The Contradiction:** In a *finite* Humean universe governed by probabilistic laws, there are possible future histories that are *consistent* with the laws but which, if they occurred, would make the *actual* global frequency pattern one that the *current* best system (based on the *entire* history) would assign a very *low* chance to (it "undermines" itself). According to the original PP, a rational agent who knows the *current* chances and laws *must* assign a high credence to these undermining futures actually having occurred (because they are assigned a high chance *now*). But *if* such a future occurred, the chances *now* (as defined by the BSA over the whole history) would *not* have been what the agent thought they were! This creates a tension or inconsistency in the credences prescribed by the PP relative to the BSA definition.

  **Summary Claim:** "...and Lewis conceded that it had to be abandoned."

  *   **Accuracy:** **False/Misrepresentation.** This is the most inaccurate part of your summary.
      *   Lewis **did not abandon** the Principal Principle.
      *   He recognised the undermining problem as a serious challenge specifically for Humean analyses of chance *combined with the original PP*.
      *   His response was **refinement, not abandonment.** He proposed a modified version, often called the **"New Principle" (NP)** or the "Reformulated Principal Principle":
          *   `Credence(A | H_tw Tw) = P_tw(A | H_tw)`
          *   Where `H_tw` is the entire history of world `w` up to time `t`, and `T_w` is the complete chance theory (the Best System) of world `w`.
      *   The key change is that the credence is set equal to the chance of `A` *conditional on the entire history up to `t` and the chance theory `T_w` itself*. This conditionalisation effectively screens off the undermining problem by building the entire history and theory into the background.
      *   Lewis considered this less simple and intuitive than the original PP, but he argued it preserved the *spirit* of the original principle and solved the undermining problem for his Humean framework. Philosophers continue to debate the merits of the NP and other responses, but the *core idea* that rational credence should defer to known objective chance, suitably qualified, remains central to the philosophy of probability. The original PP is still extensively discussed, often as a starting point or in contexts where undermining is less pressing (e.g., non-Humean chance).

  **Your Specific Judgements:**

  1.  **Definition vs. Normative Constraint:** The principle is **primarily a fundamental normative constraint** relating chance to rational credence. It is *not* offered by Lewis as the definition itself, but as a constitutive principle that any adequate definition/analysis of chance must satisfy. (The summary misrepresents this).
  2.  **Unconditional vs. Admissible Evidence:** The principle **absolutely does NOT apply unconditionally once the chance is known.** It applies only *relative to admissible evidence*. The omission of "admissible evidence" is a **critical and harmful simplification** that distorts Lewis's view. Knowing the chance is necessary but *not sufficient*; you must also lack any inadmissible evidence (like information about the specific future outcome or, crucially for the undermining problem, information that logically conflicts with the chance theory itself when combined with the history).
  3.  **Lewis and Long-Run Frequencies:** Lewis **did not identify chance with long-run frequencies.** He proposed a sophisticated Best System Account where chances supervene on the entire pattern of particular matters of fact (the Humean mosaic). While *fit* with actual frequencies is a major component of what makes a system "best," chances are *defined* by the probabilistic laws of the best system as a whole, not reduced to any specific frequency. (The summary is misleading).
  4.  **Undermining: Refutation or Refinement?** The undermining problem exposed a **serious inconsistency** within Lewis's *specific package* of Humeanism (BSA) and the *original* Principal Principle. Lewis's response was **not abandonment, but refinement** via the New Principle. While controversial, this preserved the core spirit of deferring rational credence to objective chance, and the principle(s) remain central to the field. The claim it was abandoned and is contradictory outright is a **genuine misrepresentation.**

  In essence, the summary captures the basic *intuition* behind the PP but fails on the critical details of its structure, Lewis's actual metaphysical analysis of chance (confusing it with frequentism), and the nature of his response to the undermining problem (presenting refinement as abandonment). Your surprise about the "fatal flaw" claim was entirely warranted.
