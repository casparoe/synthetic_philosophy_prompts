  - Read van Fraassen's original 1981 paper (*Journal of Philosophical Logic*) for his argument.
  - Check critiques: Bradley (2005, *British Journal for the Philosophy of Science*) defends Bayesian handling of conditionals.
  - For balanced pop-science: Hajek's "Conditionals are not a Problem for Bayesians" (2011) counters the "Bayes is broken" narrative.

