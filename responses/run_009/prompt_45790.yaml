  Okay, the user is in a criminal law seminar discussing retributivism versus consequentialism. They're bothered by the assumption that consequentialism is always softer. They want a concrete example where consequentialism demands harsher punishment than retributivism would allow. Specifically, they need a hypothetical case that highlights the principled retributivist objection—using someone as a means—and want a consequentialist comeback. Also, they prefer messy, realistic details over sterile textbook examples.

  First, I need to recall the core differences. Retributivism focuses on deserved punishment proportional to the crime. Consequentialism aims for societal benefits like deterrence. The user's point is that consequentialism might justify harsher punishments if the deterrent effect is significant, especially in cases where the crime's social impact is large but the offender's culpability is low.

  Brainstorming a scenario: A first-time offender whose minor crime goes viral, sparking copycats. The offender should deserve mild punishment, but consequentialists push for harsher penalties to set an example. The example needs vivid details to show the retributivist's principled stance against using the offender as a tool.

  Possible scenario: A college student, low culpability, commits a non-violent crime that becomes a trend. Maybe graffiti that sparks copycats, causing property damage. The offender is sympathetic—financial struggles, remorseful. Retributivism would suggest community service or probation. Consequentialists argue for jail time to deter others, citing the viral trend and rising copycat incidents.

  Check if this meets the requirements. The punishment exceeds desert due to external factors (virality), not the crime itself. Retributivist objection: punishing beyond desert uses the person as a means. Consequentialist comeback: the punishment isn't harsher intrinsically but appears severe (like mandatory rehab instead of jail). The user wants to counter that even symbolic harshness is problematic if undeserved.

  Refine the example: Make the offender more sympathetic—working-class student, no prior record, genuine remorse. The crime: tagging a bridge, which goes viral. Copycats cause significant damage. Authorities consider a harsh sentence to send a message. Retributivist argues for proportional punishment. Consequentialist pushes for incarceration as a deterrent.

  Include realistic messiness: The offender's background, media hype, political pressure on prosecutors. Show the retributivist cap based on blameworthiness, while consequentialists focus on future benefits. The objection: using the offender as a scapegoat. Consequentialist comeback: societal protection justifies it, or suggest alternatives like public shaming. But the user wants to highlight that even alternatives might still use the person instrumentally.

  Best consequentialist move: Argue that the punishment's appearance deters, not the actual severity. Propose a publicly harsh but privately mild punishment. However, this could still be seen as deceptive and using the person. The retributivist would reject any punishment beyond desert, even if symbolic.

