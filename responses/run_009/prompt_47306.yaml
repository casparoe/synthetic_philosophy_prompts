prompt: |-
  I teach a graduate seminar on punishment and transitional justice, and this term I have been assembling my own verdicts on cases of retroactive criminal punishment, in something like the spirit of reflective equilibrium, with the aim of extracting a principle from them that I can defend to my students. The equilibration is not going well, and I would like your help. The verdicts first, then what I want from you.

  My verdicts. (1) The prosecutions at Nuremberg for the atrocities — crimes against humanity and the war crimes proper, much of it conduct that was lawful and even mandated under German law at the time it was committed — seem to me entirely justified, and the complaint that the applicable norms were applied retroactively has never struck me as doing any real work against them. (2) The prosecutions at Tokyo for crimes against peace — planning and waging aggressive war — seem to me much harder to defend. The states concerned had renounced war in the 1928 Kellogg–Briand Pact, but whether that renunciation made the waging of war a crime for which an individual could hang, rather than a wrong between states, was genuinely contested among international lawyers at the time, and punishing conduct under a criminality that had to be argued for rather than assumed seems to me much closer to the vice the nullum crimen sine lege rule exists to guard against. You might expect my verdicts to track the tribunal — Nuremberg good, Tokyo bad, the familiar charge of victors' justice — but they do not, at least not for that reason: I find the atrocity counts at Tokyo as defensible as their Nuremberg counterparts, and I would say the aggressive-war count at Nuremberg itself is troubled by exactly the scruple that troubles me at Tokyo. The split I feel runs through the charges, not through the venues or the identity of the victors. (3) After a dictatorship falls, the successor state prosecutes border guards who shot people trying to flee across the wall that the old regime had built; the shootings were expressly licensed by the old regime's statutes, though that regime's own written constitution promised the inviolability of personal liberty. My verdict: prosecution justified. (4) After a scandal, a democratic legislature, with overwhelming public support, passes a statute criminalizing retrospectively a tax-avoidance scheme that was lawful when used and that most practitioners at the time regarded as sharp but not wicked. My verdict: prosecution unjustified, indeed straightforwardly tyrannical. (5) The tribunal also punished the fallen regime's ministry lawyer who drafted the deportation regulations — a man who killed no one with his own hands and whose signature made nothing legal that was not legal already. Here I waver in a way I do not at the wall: punishing him feels continuous with punishing the guards, and refusing to punish him feels demanded by the very scruples I have about the aggressive-war counts. I have gone back and forth on this case for two years.

  So there is, I take it, a principle in the vicinity — something to the effect that retroactive punishment is legitimate where, and only where, the conduct was discernibly a grave wrong at the time it occurred, independently of positive law — but I can see that it will not do as it stands. It cannot explain why (3) feels justified to me while (2) does not, since in both the actor acted under color of a legal order he did not make and the wrongness was discernible by moral reflection; and it is not obvious what it says about (5). A colleague tells me the fix is a two-tier principle distinguishing wrongs done by direct physical violation of identifiable persons from wrongs done to the international order as such, with discernibility doing the work only in the first tier, but that has the smell of a principle reverse-engineered to save my verdicts.

  Please structure your reply as follows, in this order. First, a section titled "The principle, stated precisely," containing the best candidate principle, or the two best candidates if you genuinely cannot choose, stated in enough detail that its verdicts on cases are derivable rather than gestured at — no more than 250 words. Second, a section titled "The work each clause does," in which you motivate each element of the principle by reference to which of my verdicts it is there to capture — roughly 500 words. Third, a section titled "Predictions," stating what the principle implies for three or so cases I have not given you — for instance, the officials of a state that never adhered to any renunciation of war and whose leadership sincerely doubted its criminality, or the retroactive prosecution of a scientist who in the 1950s ran non-consensual experiments on institutionalized patients, lawful then and believed by his profession to be sound — roughly 250 words. Fourth, a section titled "What must go," in which you state plainly which of my verdicts, if any, the principle cannot accommodate, and whether the price of saving them all is a complexity that should be refused — roughly 200 words. Fifth, a section titled "The ministry lawyer," resolving case (5) one way or the other and saying why — roughly 200 words. I would rather be told that one of my verdicts is unreconcilable with the rest than be handed a conjunctive principle with a clause for each of my scruples.
reasoning: |-
  Hmm, the user is teaching a graduate seminar on punishment and transitional justice and is struggling to develop a coherent principle for retroactive criminal punishment that aligns with their intuitive verdicts on various cases. They've described five specific judgments:

  1. Nuremberg atrocities prosecutions (justified despite retroactivity)
  2. Tokyo aggressive war prosecutions (unjustified due to legal uncertainty)
  3. Prosecution of border guards under fallen regime (justified)
  4. Retroactive tax prosecution in democracy (unjustified/tyrannical)
  5. Uncertainty about prosecuting ministry lawyer who drafted deportation regulations

  The user wants me to help them extract a defensible principle through structured sections. Their existing intuition points toward retroactive punishment being legitimate only for conduct that was "discernibly a grave wrong at the time," but they recognize this doesn't fully explain their distinctions between cases.

  I need to develop a precise principle that captures these nuanced distinctions. The core tension appears to be between moral wrongness and legal certainty. Cases like the border guards (3) and Nuremberg atrocities (1) involve clear moral atrocities despite legal authorization, while Tokyo aggressive war (2) and retroactive tax law (4) lack that moral clarity or involve norm creation rather than application.

  For the ministry lawyer (5), the dilemma is whether bureaucratic complicity in systemic evil meets the threshold for individual culpability under retroactive justice. This seems to hinge on both the nature of the wrong and the actor's proximity to harm.

  The user explicitly rejects "reverse-engineered" principles that simply match their verdicts clause-by-clause. They prefer intellectual honesty - even if it means admitting some verdicts can't be reconciled.

  I should structure my response as requested: first stating the principle precisely, then explaining how each element addresses specific verdicts, making predictions for new cases, identifying which verdicts might need reconsideration, and finally taking a position on the ministry lawyer case. The principle should balance moral gravity with legal foreseeability while respecting the rule of law concerns behind nullum crimen.
answer: |-
  ### The principle, stated precisely

  Retroactive criminal punishment is justified if and only if:  
  **(a)** The conduct constituted a **grave violation of fundamental human dignity** at the time of commission, discernible through widely accessible moral reasoning independent of positive law; *and*  
  **(b)** The actor **directly perpetrated, ordered, or enabled** the physical infliction of severe harm on identifiable persons, or deliberately structured a system intended to inflict such harm; *and*  
  **(c)** The **legal authorization for the conduct was manifestly illegitimate** due to its contradiction of the state’s own foundational legal commitments (e.g., constitutional guarantees) or perversion of the rule of law’s core purpose (protecting basic rights).  

  This principle condemns retroactive punishment where the wrong primarily concerns abstract collective interests (e.g., international order, state finances) without direct, severe harm to persons, or where the legal permissibility was reasonably contestable by the actor. (Word count: 148)

  ---

  ### The work each clause does

  **Clause (a): "Grave violation of fundamental human dignity... discernible through widely accessible moral reasoning"**  
  This captures the core moral wrongness justifying *exceptional* retroactive accountability. It distinguishes atrocities at Nuremberg/Tokyo (1,2) and the border shootings (3) – all involving murder, torture, or enslavement universally recognizable as abhorrent – from the tax scheme (4), which was a non-violent financial maneuver lacking inherent moral gravity. It also explains why *aggressive war* prosecutions (2) trouble you: while war causes harm, its criminalization as an *individual* offense lacked the same universal moral clarity in 1945 as torture or mass murder. The wrong was primarily interstate, not a direct assault on human dignity discernible to a soldier or official.

  **Clause (b): "Directly perpetrated, ordered, or enabled... physical infliction of severe harm... or deliberately structured a system"**  
  This addresses actor responsibility and proximity to harm. It justifies prosecuting camp guards (1,3) and high-level architects of atrocity (like those convicted at Nuremberg for designing genocide). It *excludes* the tax practitioner (4), whose actions caused diffuse, non-physical harm. Crucially, it creates the tension you feel in (5): the ministry lawyer "enabled" systemic harm via regulations but did not "directly perpetrate, order, or *deliberately structure*" physical harm himself (arguably just implementing policy). This clause reflects your instinct that punishing bureaucrats feels continuous with punishing direct perpetrators *only* if their role was instrumental in *causing* specific physical suffering.

  **Clause (c): "Legal authorization was manifestly illegitimate..."**  
  This targets the *legal* vice of retroactivity. It condemns the tax prosecution (4), where the law was valid and the scheme permissible, making retroactive criminalization pure ex post facto lawmaking. It validates prosecuting border guards (3): the shootings were "legal" under statute but contradicted the regime’s *own* constitutional guarantee of personal liberty, rendering the statute manifestly illegitimate. For aggressive war (2), the Kellogg-Briand Pact’s status as *criminal* law was contested, lacking the "manifest" illegitimacy required. For atrocities (1), the Nazi laws authorizing genocide perverted law’s core purpose – protecting rights – into its opposite, stripping them of legitimacy. This clause ensures retroactivity isn’t justified *merely* by moral wrongness; the positive law facade must itself be corrupt. (Word count: 498)

  ---

  ### Predictions

  1.  **Officials of a non-Kellogg state waging aggressive war in 1945:** Prosecution *unjustified* per the principle. Clause (a): While aggressive war causes harm, its status as a *grave violation of individual human dignity* (vs. a state wrong) was not universally discernible then. Clause (c): No manifestly illegitimate legal authorization existed *for them*; their domestic law permitted it, and the international norm was contested and not yet crystallized into individual criminal law they could foresee.

  2.  **1950s scientist running non-consensual experiments on institutionalized patients (lawful then, profession deemed it sound):** Prosecution *unjustified*. Clause (a): While a severe dignity violation *now*, its moral gravity (as criminal rather than unethical) may not have been widely discernible *then* to the scientist, given professional acceptance and legality. Clause (c): The legal authorization wasn’t manifestly illegitimate; it was the norm. (Contrast with Nuremberg’s "medical" experiments, done illegally even under Nazi law and universally recognized as torture/murder).

  3.  **Low-level bureaucrat processing deportation orders under a dictatorship, knowing they led to death camps:** Prosecution *potentially justified*. Clause (a): Facilitating murder constitutes a grave dignity violation. Clause (b): If they knowingly and directly enabled the physical infliction of harm on identifiable victims (e.g., signing individual death warrants, not just drafting generic regulations), they meet the proximity threshold. Clause (c): The legal authorization was manifestly illegitimate, perverting law’s purpose. (Distinct from the ministry lawyer (5) drafting *regulations*). (Word count: 247)

  ---

  ### What must go

  The principle **cannot comfortably accommodate your verdict on the Tokyo atrocity prosecutions being as defensible as Nuremberg's** without modification. Clause (c) requires the *legal authorization itself* to be manifestly illegitimate. While Nazi law was inherently perverse (voiding its own authority), Imperial Japan's domestic legal system, while authoritarian, hadn't necessarily *explicitly voided its own foundational commitments to the same extent regarding *atrocities*. Its illegitimacy stemmed more from the moral wrongness (clause a) and the acts themselves. Defending Tokyo atrocities prosecutions under this principle would require stretching clause (c) to encompass legal systems fundamentally incompatible with human dignity *as such*, even absent explicit self-contradiction. This adds complexity. Conversely, **your hesitation on the ministry lawyer (5) is precisely what the principle predicts** via clause (b)'s focus on direct perpetration/enabling of physical harm. Saving all verdicts would likely require diluting clause (b), sacrificing a key distinction between direct/systemic violators and more removed facilitators. This complexity cost is arguably too high; your Tokyo atrocity verdict may need softening to align with the Nuremberg/Tokyo *aggressive war* distinction you find meaningful. (Word count: 199)

  ---

  ### The ministry lawyer

  **Verdict: Prosecution unjustified.** The principle demands a direct link to the *physical infliction of harm* (clause b). Drafting deportation regulations is a step removed from the "direct perpetration, ordering, or enabling" of shootings or gassings. He enabled a *system*, but did not himself structure it with the *intent* for physical harm (he may have believed, however wrongly, in its legality or necessity), nor did his signature cause immediate, identifiable harm like a guard's trigger pull or a commander's order. While the regulations facilitated grave wrongs (clause a) under manifestly illegitimate laws (clause c), his role lacks the proximate, agency-driven causation required by clause (b). Punishing him veers too close to criminalizing legal craftsmanship based on outcomes, violating the scruple protecting individuals from unexpected criminal liability that underpins your unease with aggressive war prosecutions. The guards (3) directly inflicted the fatal harm; the lawyer (5) provided a tool others used. (Word count: 168)
