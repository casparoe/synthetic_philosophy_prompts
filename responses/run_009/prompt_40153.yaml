  ### Bertrand's Chord Paradox In-Class Activity Design  
  **Objective:** Students empirically estimate the probability that a random chord is longer than the side of an inscribed equilateral triangle, discover that estimates vary by method, and confront the ambiguity in applying the principle of indifference.  

  **Materials (Per Group):**  
  - **All groups:**  
    - Paper circle (radius 10 cm, center marked)  
    - Ruler  
    - Pencil  
    - Precomputed reference length (stick/string of length \(10\sqrt{3} \approx 17.32\) cm for comparison)  
  - **Group-specific:**  
    - **Group 1 (Two Points):** Spinner fixed at center (paperclip on pencil) to select points on circumference.  
    - **Group 2 (Fixed Diameter):**  
      - Pre-drawn diameter on circle.  
      - Tape strip (length 20 cm) marked with 100 equally spaced divisions (0–99) along the diameter (0 at –10 cm, 99 at +10 cm).  
      - Deck of cards numbered 0–99.  
      - String of length 5 cm (for \(R/2\) comparison).  
    - **Group 3 (Midpoint Drop):**  
      - Inner concentric circle (radius 5 cm) drawn.  
      - Small bead.  
      - Platform (e.g., book) at fixed height 30 cm above center.  

  **Group Instructions:**  
  *Each group receives only their method’s instructions. No group sees others’ methods initially.*  

  1. **Group 1: Random Endpoints**  
     - *Instructions:* "Generate a chord by:  
       1. Spin the spinner; mark the point where it stops (Point A).  
       2. Spin again; mark the new point (Point B).  
       3. Draw the chord between A and B.  
       4. Compare chord length to the reference stick: if longer, count as 'long'."  
     - *Natural Justification Prompt:* "Why is this the fairest way to pick a chord? Defend your view."  

  2. **Group 2: Perpendicular from Random Diameter Point**  
     - *Instructions:* "Generate a chord by:  
       1. Shuffle the deck; draw a card (number \(n\)).  
       2. Find position \(n\) on the tape strip on the diameter.  
       3. Measure distance \(|x|\) from center to this point.  
       4. If \(|x| < 5\) cm (use the 5 cm string), count as 'long'."  
     - *Natural Justification Prompt:* "Why is measuring from the diameter the most natural approach?"  

  3. **Group 3: Random Midpoint by Drop**  
     - *Instructions:* "Generate a chord by:  
       1. Drop the bead from the platform above the center.  
       2. If it lands outside the big circle, redo.  
       3. If inside, check if it lands inside the inner circle: if yes, count as 'long'."  
     - *Natural Justification Prompt:* "Why should we start from the midpoint to define a chord?"  

  **Timing Plan (75 Minutes):**  
  | Phase | Time | Activity |  
  |-------|------|----------|  
  | **Setup** | 0–5 min | Divide into 3 groups (4-5 students each). Distribute materials and group-specific instructions. Briefly explain: "Each group will estimate the probability that a random chord is longer than the triangle’s side. Record 30 trials." |  
  | **Data Collection** | 5–25 min | Groups generate chords and count "long" chords. TAs circulate to assist. *Target: 30 trials/group.* |  
  | **Group Calculations** | 25–30 min | Groups compute probability: \(\frac{\text{Number of long chords}}{30}\). Prepare to explain their method. |  
  | **Report & Display** | 30–35 min | Groups report counts and probabilities. Instructor records on board:  
  | **Method** | **Long/30** | **Probability** |  
  | Group 1: Two Points | [count] | [P₁] |  
  | Group 2: Fixed Diameter | [count] | [P₂] |  
  | Group 3: Midpoint Drop | [count] | [P₃] |  
  | **Initial Debate** | 35–45 min | Groups defend their method as "natural" (1 min/group). Class discusses: "Which method seems fairest? Why might estimates differ?" |  
  | **Debrief & Resolution** | 45–65 min | Reveal all methods. Map to principle of indifference:  
    - Group 1: Uniform over endpoints (parameter: arc length).  
    - Group 2: Uniform over projection on diameter (parameter: linear distance).  
    - Group 3: Uniform over midpoint in disk (parameter: area).  
  - **Instructor’s Verdict:** "The problem is underspecified. No method is universally 'natural'—the principle of indifference fails without a physical mechanism. However, **Group 3 (midpoint)** is defensible as the *only* measure invariant under rotations, reflections, and scalings of the circle. Group 2 breaks rotational symmetry; Group 1 depends on parametrization. This resolution is contested but aligns with geometric probability’s emphasis on invariance." |  
  | **Wrap-up** | 65–75 min | Discuss limitations: "Physical methods *always* smuggle in a metric (arc length, linear distance, area). The activity can’t reproduce the *ideal continuous distribution*—we must verbally confront the ambiguity in 'random chord' without a real-world context." |  

  **Predicted Problems & Mitigation:**  
  1. **Small-sample noise masking differences:**  
     - *Risk:* Estimates cluster near 0.3–0.4 (e.g., Group 1: 11/30 ≈ 0.37, Group 3: 8/30 ≈ 0.27), obscuring the paradox.  
     - *Mitigation:*  
       - Pre-calculate expected values (1/3≈0.33, 1/2=0.5, 1/4=0.25) and display during debrief.  
       - Emphasize: "With infinite trials, we’d see 0.33, 0.5, 0.25. Noise is why we need theory!"  
       - Use group counts to compute class-wide probabilities if needed (e.g., combine all Group 1 data).  

  2. **Suspicion of "stacked decks":**  
     - *Risk:* Students infer methods differ and distrust results.  
     - *Mitigation:*  
       - Openly state: "Each group has a different method—we’re testing if 'random' depends on *how* you generate the chord."  
       - During debrief, validate all methods: "Your procedures *are* natural—that’s why this paradox is profound!"  

  3. **Physical errors:**  
     - *Group 1:* Spinner bias/chord-drawing errors. → TA supervises spinner use; accept minor inaccuracies.  
     - *Group 2:* Misalignment of tape strip. → Tape strip pre-glued to diameter.  
     - *Group 3:* Bead clusters near center. → Drop from >30 cm height; use smooth beads.  

  **Key Takeaways for Students:**  
  - The principle of indifference is ambiguous: "uniform" depends on the chosen variable (endpoints, projection, midpoint).  
  - Physical devices impose a metric; invariance under symmetry (here, Group 3) is a principled criterion for "true" randomness.  
  - Probability is not purely mathematical—it requires contextual grounding ("How is the chord *actually* generated?").  

  **Instructor Notes:**  
  - **Your Defended Position:** Group 3 (midpoint) is optimal due to invariance, but explicitly note this is contested. Some philosophers reject all three, arguing the problem is ill-posed without empirical context.  
  - **Verbal Supplement Needed:** Physical methods cannot resolve *why* invariance matters—this requires conceptual discussion. Stress: "Devices fix a parameter space; only symmetry arguments can prioritize one space (e.g., area) over another."  
  - **Why This Works:** Methods are fast (no chord construction for Groups 2/3), and the bead drop is visibly "random." Students feel their method’s "pull" before seeing alternatives.
