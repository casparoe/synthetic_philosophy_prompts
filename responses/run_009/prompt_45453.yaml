prompt: |-
  I'm part of a graduate metaphysics reading group that spent this term on Lewis, and I came out broadly sympathetic to counterpart theory: I like the clean ontology of worldbound individuals, and I have never been able to make sense of the transworld identity alternative, on which the very same person exists in many possible worlds with a different career, different hair, a different spouse, and remains strictly one with the person sitting here. Two weeks ago a friend in the group, who is firmly on the Kripkean side of modality, ran an argument at me that has been bothering me ever since, because it seems to show that the view I adopted doesn't do the one job it was built for. Here is his argument as I reconstructed it afterward. (1) A claim about a particular thing is made true by how things are with that thing; whatever makes "Humphrey might have won" true has to involve Humphrey himself, not just things resembling him. (2) On counterpart theory, what makes "Humphrey might have won" true is that in some other possible world there is someone who closely resembles Humphrey in the relevant respects and wins there. (3) Since Humphrey exists only in the actual world, the worlds doing the truthmaking contain his counterparts, never him. (4) So what makes "Humphrey might have won" true involves Humphrey not at all. (5) If what makes a claim true involves a certain person not at all, then the claim is not, strictly, about that person — it is about whoever and whatever it does involve. (6) Therefore on counterpart theory no modal claim is ever about the thing it seems to be about; "Humphrey might have won" is really a claim about someone else, and de re modality has been explained away rather than analyzed.

  The kicker, as he presents it, is the generalization: if (5) is right, then counterpart theory was never a theory of de re modality at all, only a semantics on which all such claims turn out to concern stand-ins, so the position undermines its own point. He also likes to add that Lewis's counterpart relation is a similarity relation whose relevant respects are allowed to vary with context, which would make things worse — whether Humphrey might have won would then depend partly on how the conversational setting ranks similarities. My instinct is that something slips between (4) and (5), or perhaps already between (1) and (2), but every time I try to pin it down I either beg the question against him or find myself smuggling Humphrey himself into the other worlds, which lands me in the transworld identity camp I find incoherent for other reasons — if that world's Humphrey never entered politics, what is supposed to make him numerically identical to ours, given that they share only some of their properties?

  So I'd like a careful diagnosis. Which premise or step should the counterpart theorist reject, why did that step look innocent, and what does rejecting it cost? In particular, does the friend's step (5), the move from what a claim's truthmakers involve to what the claim is about, hold up as a general principle, or does it prove too much elsewhere? And symmetrically, I want to know whether the transworld identity theorist really escapes this argument or merely has her own version of it: does the claim that Humphrey himself is present in the winning world give her truthmakers that involve Humphrey in the sense premise (1) demands, or is she just relabeling the resembling individual as Humphrey and thereby asserting the haecceitism Lewis rejects? Finally, if I decide to bite the bullet and accept (6), tell me what exactly I'm left with — is it a coherent and worthwhile position, or a concession that modal realism was never, strictly speaking, about us?
reasoning: |-
  Okay, this is a dense and fascinating challenge from a graduate metaphysics reading group. The user is clearly well-versed in Lewis and Kripke, having just finished a term on Lewis's work. They're sympathetic to counterpart theory but troubled by a Kripkean friend's argument that seems to undermine the whole project. The core tension: how can modal claims be *about Humphrey* if Humphrey only exists in one world?

  First, I need to unpack the friend's argument step by step. Premise (1) feels intuitively right - truths about X should involve X. But premise (2) correctly states counterpart theory's position. The crunch comes at (4) and (5): if truthmakers don't involve Humphrey, how can the claim be about him? The generalization in the kicker is particularly damaging - it suggests counterpart theory eliminates de re modality rather than analyzing it.

  I notice the user is especially worried about two things: first, that rejecting (5) might force them into transworld identity (which they find incoherent), and second, that the context-dependence of counterpart relations makes things worse. They're also asking excellent meta-questions about whether transworld identity theorists face parallel problems, and what's left if they accept the argument's conclusion.

  Hmm... the key insight might be that "involvement" in truthmaking doesn't map directly to "aboutness." Lewis could argue that Humphrey is involved *via* his actual properties that ground counterpart relations. But is that enough? The user seems to have already considered this but worries it smuggles in transworld identity. 

  The transworld identity theorist might have their own version of this problem too. If "Humphrey wins in W" is made true by Humphrey-in-W, but that entity has different properties... is it really the *same* Humphrey? Or just a haecceitistic primitive? That might not satisfy premise (1) either.

  If the user bites the bullet and accepts (6), they'd be embracing what Lewis called "ersatz" modality - where we talk *as if* things have modal properties, but strictly speaking, it's all counterpart-talk. That's coherent but might feel deflationary. The cost is giving up on genuine de re modality, which was supposed to be the theory's selling point.

  The most promising response might be to challenge premise (5) by decoupling truthmaking from aboutness. We say "it's about Humphrey" because Humphrey anchors the counterpart relation contextually, even if the truthmaker is elsewhere. But I need to check if this holds water with examples from non-modal contexts...
answer: |-
  Your friend's argument is a sharp formulation of the "Humphrey Objection," a classic critique of counterpart theory. While it feels compelling, the counterpart theorist has principled responses. Here's a careful diagnosis, addressing each part of your query:

  ### The Flawed Premise: Rejecting (5) - The "Involvement to Aboutness" Leap
  *   **Which Premise to Reject:** The counterpart theorist should reject **premise (5)**: "If what makes a claim true involves a certain person not at all, then the claim is not, strictly, about that person."
  *   **Why It Looks Innocent:** Premise (5) appeals to a seemingly obvious principle: truth-making grounds should directly involve the subject of the claim. If Humphrey isn't *in* the truth-maker world, how can the truth be *about him*? It feels like a basic connection between semantics and metaphysics.
  *   **Why the Counterpart Theorist Rejects It:** Counterpart theory fundamentally *decouples* the subject of the de re modal claim (the "res") from the ontological ground of its truth. The claim is *about Humphrey* because Humphrey is the object designated by the name "Humphrey" *in the actual context of utterance*. The truth of the modal claim *depends counterfactually on Humphrey* via the counterpart relation.
      *   **Grounding Dependence:** What makes "Humphrey might have won" true *depends on Humphrey's actual properties*. The actual Humphrey has properties P1, P2,... Pn. The existence of a counterpart in another world depends *on that world containing an individual sufficiently similar to Humphrey-in-the-actual-world in contextually relevant respects*. Humphrey (his actual properties) is the *anchor* for the counterpart relation. He is involved *indirectly but essentially* – the truthmaker (the winning counterpart) exists *because of* Humphrey's actual qualitative profile. Without Humphrey having *those specific actual properties*, that particular counterpart relation wouldn't hold.
      *   **Semantic Aboutness vs. Ontological Truthmaker:** Premise (5) conflates the *semantic content* (what the claim is about) with the *ontological truthmaker* (what grounds its truth). The claim is semantically about Humphrey. Its truth is grounded by the existence of a counterpart linked to Humphrey by a contextually determined similarity relation based *on Humphrey's actual properties*. The "aboutness" is fixed by the actual context and reference; the truthmaking occurs in other worlds via the counterpart relation that context selects based on Humphrey's actuality.
      *   **Analogy:** Consider "The Eiffel Tower is famous." The claim is *about* the Eiffel Tower. What makes it true? The mental states and representations of millions of people *other than* the Eiffel Tower itself. The Tower isn't "involved" in those mental states ontologically. Yet, the claim is uncontroversially *about* the Tower. Its fame *supervenes* on its properties and history. Similarly, Humphrey's modal properties supervene on his actual properties plus the existence of suitable counterparts. The truthmaker (the counterpart) isn't Humphrey, but its existence and status *depend critically* on Humphrey's actuality.

  ### Costs of Rejecting (5)
  1.  **Indirect Truthmaking:** You must accept that de re modal truths are made true *indirectly*. The truthmaker is not the res itself, but something else (a counterpart) standing in a specific, context-dependent relation (counterpart-hood) *to* the res. This violates a strong intuition captured in premise (1).
  2.  **Context-Dependence:** You embrace the context-dependence of counterpart relations your friend dislikes. *Which* properties are relevant for counterpart-hood (e.g., essential biological properties vs. accidental career choices) can shift with conversational context. This means the *truth conditions* of "Humphrey might have won" are context-sensitive. (Lewis saw this as a feature, not a bug – it explains why modal judgments vary contextually).
  3.  **Loss of "Strict" Identity in Modality:** You give up the idea that modal claims involve the *strict, numerical identity* of the res across worlds. This is the core trade-off: avoiding transworld identity requires accepting that modality involves representation *via* counterparts, not identity.

  ### Addressing Premise (1) and Transworld Identity
  *   **Premise (1):** The counterpart theorist can partially agree with (1): a claim about a particular thing *is* made true by how things are with that thing... *plus* how things are with the modal reality it inhabits (other worlds and counterpart relations). The "how things are with Humphrey" part involves his actual properties grounding the counterpart relation. They reject the unstated assumption that truthmaking requires the res to be a literal *constituent* of the truthmaking situation *in other worlds*.
  *   **Transworld Identity Theorist's Problem:** Your friend assumes the transworld identity (TI) theorist easily satisfies (1). This is questionable:
      *   **The Truthmaker Challenge:** What makes "Humphrey might have won" true *for the TI theorist*? Presumably, the existence of a world W where *Humphrey himself* wins. But W contains "Humphrey-in-W". Is Humphrey-in-W *literally, numerically identical* to Humphrey-in-α (the actual world)? This is the core of your objection: if they share only *some* properties, what grounds this identity?
      *   **Haecceitism vs. Anti-Haecceitism:** The TI theorist faces a dilemma:
          *   **Haecceitism:** She must embrace haecceitism – the view that individuals have primitive "thisness" (haecceities) that transcend their qualitative properties. Humphrey-in-W is identical to Humphrey-in-α *just because* they share the same primitive haecceity, regardless of differing properties. But then, the "truthmaker" involving Humphrey-in-W *does* involve Humphrey's haecceity. However, this haecceity is precisely the kind of primitive, non-qualitative identity Lewis rejected as unintelligible. It also raises questions about *how* the haecceity is present in both worlds and how we could ever know about it. Does this *really* satisfy the spirit of premise (1), which likely assumes qualitative grounding?
          *   **Anti-Haecceitism (Qualitative Identity):** If she rejects haecceitism and insists transworld identity requires *qualitative* identity in some robust sense, she risks collapsing into counterpart theory or denying most interesting modal claims. If Humphrey-in-W must share *all* Humphrey-in-α's essential properties to be identical, and winning is incompatible with some essential property (e.g., his actual essence includes *losing the election*?), then he couldn't have won. This seems too restrictive. If she allows differing accidental properties but requires some core qualitative essence, she faces the same "representation vs. identity" issue counterpart theory has: Humphrey-in-W represents a possibility *for* Humphrey-in-α *because* they share the core essence, much like a counterpart shares contextually relevant properties.
      *   **Conclusion for TI:** The TI theorist *only* satisfies premise (1) in a way that avoids the "resemblance" charge if she adopts haecceitism. Otherwise, she relies on qualitative resemblance for grounding identity across worlds, facing an analog of the counterpart theorist's indirectness. She doesn't escape the core issue; she either embraces primitivism (haecceitism) or faces representationalism.

  ### Biting the Bullet: Accepting (6)
  If you accept the argument's conclusion (6), here's what you're left with:
  1.  **Coherent Position:** Yes, it's coherent. Lewis himself sometimes described counterpart theory as offering "ersatz" de re modality.
  2.  **The Position:** De re modal claims *are not*, at the fundamental ontological level, directly about the res itself existing with different properties in other worlds. Instead:
      *   They are claims about the existence of counterparts (other worldbound individuals) suitably related by similarity to the actual individual.
      *   "Humphrey might have won" means: "There exists a possible world containing an individual who is a counterpart of Humphrey (i.e., resembles him closely enough in the contextually relevant ways) and who wins the election in that world."
      *   The "aboutness" is pragmatic or semantic (we use the name "Humphrey" to pick out the actual individual whose counterparts we are discussing), not metaphysical (the truthmaker isn't Humphrey).
  3.  **Consequences:**
      *   **"Explained Away" Modality:** Your friend is correct that de re modality is "explained away" rather than given a direct analysis involving transworld identity. Modal properties are reduced to relations of similarity between worldbound individuals.
      *   **Loss of Intuitive Directness:** You abandon the strong intuition that possibility *for Humphrey* must involve Humphrey *himself* in some non-representational way. Modality becomes representational.
      *   **Contextualism:** Modal claims become inherently context-dependent, as the relevant similarity relation shifts.
      *   **Still Worthwhile?** This depends on your priorities:
          *   **Metaphysical Parsimony:** You retain a clean ontology: no transworld identity, no haecceities, no non-qualitative individual essences. Individuals are fully worldbound bundles of properties.
          *   **Explanatory Power:** The theory *does* systematically account for the truth conditions of our modal discourse within a concrete modal realist framework. It explains the context-sensitivity.
          *   **Cost:** It arguably fails to capture the *deeply personal* aspect of de re modality – the sense that *I* could have done otherwise, not just that someone like me could have. For many (like your friend), this cost is fatal. For others (like Lewis), it's the price of a superior overall metaphysics.

  ### Final Diagnosis
  The crux is **premise (5)**. Your friend assumes that for a claim to be *about* X, X must be a constituent of its truthmaker. The counterpart theorist rejects this, arguing that X can be the semantic subject while the truthmaker involves entities standing in a relation (counterparthood) *defined in terms of X's actual properties*. The cost is accepting that modality is representational and context-dependent. The transworld identity theorist avoids this only by embracing haecceitism, which introduces its own metaphysical primitives. Biting the bullet on (6) yields a coherent, metaphysically parsimonious, but representationally indirect account of modality. Whether this cost is acceptable depends on your valuation of avoiding transworld identity/haecceities versus capturing the intuitive directness of de re possibility. Your struggle pinpoints the central tension in modal metaphysics: how to reconcile our talk of *this very thing* having different properties with a plausible ontology of individuals and worlds.
