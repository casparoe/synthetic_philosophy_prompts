prompt: |-
  I lead the incident-response team for a large distributed online service — databases, caching layers, dozens of microservices, deployments several times a day. A few times a quarter we have a significant outage, and afterward I run a blameless postmortem whose central deliverable is a root-cause statement that engineers, my VP, and occasionally auditors will read, and on which engineering time gets allocated. The recurring problem is not that we lack candidate explanations; it is that we have no principled way to rank them. The meetings devolve into a standoff between people who want the one clean cause and people who want the full causal web, and the writeup ends up encoding whichever side was loudest.

  What I want is a decision procedure that operationalizes Occam's razor in its formal version: the idea, from Kolmogorov complexity and Solomonoff induction, that a hypothesis's prior probability should fall with the length of its shortest description, together with whatever else from that literature is actually usable — for instance the minimum-description-length thought that comparing hypotheses is comparing the total length of the hypothesis plus whatever data it leaves unexplained. My engineers have no background in any of this, and the postmortem is a one-hour meeting within a day or two of the incident, when everyone is tired. So the conceptual work is the translation, and I want you to be explicit about it: which parts of the formal theory survive into a procedure (what the description length of a root-cause hypothesis is supposed to measure, and why the prior should fall with it), which parts must be dropped as uncomputable or undefined in practice, and how to fix the description language so that one cause versus two interacting causes is a measured difference rather than a rhetorical one. Say what the invariance theorem — the guarantee that the choice of language matters only up to an additive constant — actually licenses here, and where that consolation runs out, given that our hypotheses are short enough for the constant to dwarf them.

  Then give me the procedure itself: the questions in order, in plain language; what counts as a sufficient answer to each; a stopping rule for when to close the investigation and write down the ranking; and the points where the procedure hands the decision to a person because the question is one of values or judgment rather than measurement. It must handle the standard traps: an explanation that is short in English only because it names a familiar villain; two candidates that are rewordings of each other; the pressure to flatten a ranked list into the single root cause the postmortem template demands.

  Run the procedure on three incidents, with these facts supplied. First: at 2 a.m., an automated change raised a cache's eviction threshold within a minute of a database primary failing over to a replica; the site went down for forty minutes. Candidate A says the eviction change flooded the database with cache misses and the failover was the database's routine response to load. Candidate B says the failover stemmed from a replication bug unrelated to load, and the eviction change only slowed recovery. A is shorter to state. Does the procedure prefer it, and should it? Second: a single node returned corrupted data exactly once. The shortest explanation is that a cosmic ray flipped a bit — two words, no moving parts. The rival is a long chain: a garbage-collection pause let a health check expire, which forced a restart, which truncated a write ahead of its flush. The scoring here is the interesting part: description length in whose language, and what do we do about the fact that the bit-flip hypothesis compresses to two words only for people who have never had to verify one? Third: an intermittent failure that has now recurred three times, where the first two postmortems each closed with a simple, confirmed cause — a race condition, then a misconfigured timeout — and yet the same symptom returned. Should the procedure treat those past confirmations as data about how simple the true causes of our incidents tend to be, and hence as a reason to adjust the simplicity prior itself, or only rank hypotheses within the current incident?

  Finally, be honest about the failure modes: where the procedure will misfire — I suspect it will be too kind to explanations with precedent in our own incident history, because those are cheap for us to describe — what it cannot do even in principle, and which of its steps are judgment calls dressed up as measurement. At least one of the three cases above must come out with an answer I will not like; tell me which one, and why the procedure is still right to give it.
reasoning: |-
  Hmm, the user leads an incident-response team for a complex distributed system and is struggling with root-cause analysis during postmortems. They're dealing with philosophical standoffs between "one clean cause" advocates versus "full causal web" proponents, and want a practical way to rank hypotheses using formal notions of simplicity like Kolmogorov complexity or minimum description length (MDL).

  The core challenge is translating abstract information theory into a usable one-hour meeting procedure. They want explicit guidance on:
  - What survives translation (e.g., description length as complexity proxy)
  - What gets dropped (e.g., uncomputable Kolmogorov complexity)
  - How to handle language dependence (e.g., invariance theorem limitations)
  - Concrete steps with plain-language questions and stopping rules

  They've provided three test cases:
  1. Cache eviction change vs. database replication bug during failover
  2. Cosmic ray bit-flip vs. complex garbage collection failure chain
  3. Recurring issue with previously "resolved" simple causes

  The key tensions I need to address:
  - **Practicality vs rigor**: MDL is intuitive but actual Kolmogorov complexity is uncomputable. Need a proxy.
  - **Language relativity**: "Cosmic ray" is short but vacuous without verification steps.
  - **History dependence**: Whether past incidents should inform simplicity priors.
  - **Human judgment**: Where to embed necessary subjectivity (e.g., cost of verification).

  For the procedure itself, it needs:
  1. **Hypothesis articulation phase** (structured English, no jargon)
  2. **Description cost calculation** (length + verification cost + precedent bonus)
  3. **Explanation gap penalty** (unexplained symptoms)
  4. **Ranking mechanism** (total cost = description + gaps)
  5. **Stopping condition** (diminishing returns on cost reduction)
  6. **Human override points** (e.g., when verification cost dominates)

  Special traps to handle:
  - **Familiar villain problem**: "Database outage" isn't simpler just because it's common.
  - **Rewording equivalence**: Need to detect isomorphic hypotheses.
  - **Template pressure**: Explicitly allow ranked lists over single root causes.

  On the test cases:
  - **Case 1**: Should favor the replication bug (B) once verification costs are accounted for, even though "cache flood" (A) is verbally shorter. This might disappoint "one cause" advocates.
  - **Case 2**: Cosmic ray loses decisively when verification cost is added (requires expensive forensic analysis). Shows why surface-level brevity is misleading.
  - **Case 3**: Past incidents should inform precedent scoring but not simplicity priors. Recurrence suggests either incomplete fix or new cause.

  Biggest failure modes:
  1. **Precedent bias**: Overweighting historically common causes
  2. **Verification blind spots**: Underestimating hard-to-check claims
  3. **Compression illusions**: "Familiar" explanations that are actually vague

  The cosmic ray case will frustrate advocates of exotic explanations, but correctly so - the procedure forces concrete verification steps. This is the intentional friction.
answer: |-
  Below is a principled, operationalized decision procedure for root-cause ranking in blameless postmortems. It adapts formal simplicity principles (Kolmogorov complexity, Minimum Description Length/MDL) into a practical, time-constrained process. The procedure prioritizes hypotheses based on **total description cost**—measuring both the hypothesis *and* the unexplained data—while embedding key insights from information theory and acknowledging practical limits. I'll first translate the theory, then provide the procedure, apply it to your cases, and end with failure modes.

  ---

  ### **Translation of Formal Theory to Practice**
  1. **What survives**:
     - **Description length as a proxy for complexity**: A hypothesis' "cost" is the effort to *describe it unambiguously* to someone unfamiliar with the incident. Shorter descriptions aren't inherently better; they must be *precise and testable*. This operationalizes Kolmogorov's "shortest description" (length correlates with prior probability).
     - **Total cost = Hypothesis + Unexplained data**: Like MDL, we score hypotheses by **Total Cost = (Cost to Describe Hypothesis) + (Cost to Describe Residual Anomalies)**. The best hypothesis minimizes this sum.
     - **Invariance theorem in practice**: Hypothesis cost is measured in **"team-native English"** (e.g., your engineers' shared vocabulary). The invariance theorem licenses this: switching to a formal language (e.g., code) only adds a fixed overhead, so *relative rankings* remain stable for hypotheses of similar complexity. We avoid universal languages (e.g., binary) as the constant overhead dwarfs short hypotheses.

  2. **What is dropped**:
     - **Uncomputability**: Kolmogorov complexity is uncomputable; we use a proxy (structured English descriptions).
     - **Perfect priors**: We don't compute probabilities. Instead, cost correlates with "plausibility effort" (e.g., verifying a cosmic ray is high-effort).
     - **Perfect compression**: We don't seek minimal descriptions, just *sufficiently unambiguous* ones.

  3. **Fixing the description language**:
     - **Cost components**: A hypothesis' cost includes:
       - **Verification steps** (e.g., "check logs for X").
       - **Precedent** (if documented in past incidents, cost is lower).
     - **One cause vs. causal web**: A single cause (e.g., "bug X") has low cost. Adding interactions (e.g., "bug X + config Y") increases cost. The procedure *penalizes* unnecessary complexity but rewards explanatory power (e.g., two causes may win if they explain more symptoms).

  ---

  ### **The Procedure: Plain-Language Questions**
  **Timebox**: 45 minutes for steps 1–4, 15 minutes for step 5. Use a shared document.  
  **Input**: Timeline, symptoms, and candidate hypotheses (pre-populated by incident lead).  
  **Output**: Ranked hypotheses by total cost, with residual anomalies noted.

  1. **Describe the anomaly** (5 min):  
     - *Question*: "What symptoms must *all* hypotheses explain? List them plainly."  
     - *Sufficient answer*: A bulleted list of **testable facts** (e.g., "Database failover at 2:00", "40-minute outage", "Cache-miss surge at 2:01").  
     - *Stop when*: No new symptoms are added for 1 minute.

  2. **Articulate hypotheses** (10 min):  
     - *Question*: "Restate each candidate cause in one sentence, then list: (a) What it explains, (b) Steps to verify it."  
     - *Sufficient answer*:  
       - "Hypothesis: [One-sentence claim]. Explains: [Symptoms from Step 1]. Verify by: [Specific log/dashboard/metric]."  
       - Example: *"Hypothesis: Cache eviction change flooded DB. Explains: Cache-miss surge, DB failover. Verify by: Query cache-miss metrics at 2:00 and DB load logs."*  
     - *Stop when*: All candidates are translated; no new hypotheses emerge for 2 minutes.

  3. **Score description cost** (20 min):  
     - *Question*: "For each hypothesis, assign costs:  
       **(A) Hypothesis Cost (H)**:  
       - Base cost = Number of **distinct causal elements** (e.g., "bug + config change" = 2 elements).  
       - **+1 per element** for each verification step requiring >5 minutes of effort.  
       - **–1 if identical to a past incident** (precedent bonus).  
       **(B) Residual Cost (R)**:  
       - +1 per unexplained symptom from Step 1.  
       **(C) Total Cost = H + R**"  
     - *Sufficient answer*: A table with scores. Use consensus; if disputed, take the average.  
     - *Why this works*: H measures "complexity" (elements + verification effort). R ensures no hypothesis "cheats" by ignoring data. Precedent avoids overpenalizing known issues.

  4. **Rank and check for equivalence** (10 min):  
     - *Question*: "Sort hypotheses by Total Cost (lowest best). Are any hypotheses rewording the same causal elements?"  
     - *Action*: Merge rewording duplicates (identical H and R). Keep the clearest phrasing.  
     - *Stop when*: Costs are stable, and duplicates are merged.

  5. **Finalize and assign ownership** (10 min):  
     - *Question*: "The top hypothesis is [X]. What residual anomalies remain? Who owns verifying it?"  
     - *Human judgment points*:  
       - **Values call**: If scores tie, prioritize the hypothesis that explains more *severe* symptoms.  
       - **Template pressure**: If forced to pick one "root cause," document: "Top hypothesis: [X] (Total Cost: Y). Residual anomalies: [List]."  
       - **Escalation**: If Total Cost >10, the VP reviews before allocating eng time.

  ---

  ### **Application to Your Cases**
  **Case 1: Cache eviction vs. replication bug**  
  - Symptoms: (1) DB failover at 2:00, (2) Outage 40min, (3) Cache-miss surge at 2:01.  
  - **Candidate A (Cache flood)**:  
    - H = 2 elements (eviction change + failover due to load). Verification: Check cache-miss metrics (+0, quick) + DB load logs (+0, quick). Precedent: None (+0). **H = 2**.  
    - R = Explains (1) and (3), but not why recovery took 40min (+1). **R = 1**.  
    - **Total = 3**.  
  - **Candidate B (Replication bug)**:  
    - H = 2 elements (replication bug + eviction change slowed recovery). Verification: Check replication logs (+1, requires deep dive) + cache-miss impact (+0). Precedent: None (+0). **H = 3**.  
    - R = Explains (1), (2), and (3) (eviction slowed recovery). **R = 0**.  
    - **Total = 3**.  
  - **Ranking**: Tie (Total Cost=3). *Human judgment*: Prioritize B (explains recovery time). **Procedure prefers B**, as it covers all symptoms. *You may dislike this*—A is verbally shorter—but B’s completeness justifies equal cost. The procedure correctly forces accounting for *all* symptoms.

  **Case 2: Cosmic ray vs. GC chain**  
  - Symptoms: (1) Single corrupted data output.  
  - **Candidate A (Cosmic ray)**:  
    - H = 1 element (bit flip). Verification: Hardware diagnostics (+2, high effort). Precedent: None (+0). **H = 3**.  
    - R = Explains (1). **R = 0**.  
    - **Total = 3**.  
  - **Candidate B (GC chain)**:  
    - H = 4 elements (GC pause + health check + restart + write truncation). Verification: Check GC logs (+0), health-check logs (+0), restart records (+0), write logs (+0). Precedent: Past GC issues (–1). **H = 3**.  
    - R = Explains (1). **R = 0**.  
    - **Total = 3**.  
  - **Ranking**: Tie (Total Cost=3). *Human judgment*: Prioritize B. **Procedure rejects A’s verbal brevity**—it only "sounds" simple. Verification cost dominates: "cosmic ray" requires forensic effort (increasing H), while GC chain uses existing logs. Description length is measured in *team-native English including verification*, making B equally "simple" in practice.

  **Case 3: Recurring incident with past "simple" causes**  
  - **Procedure stance**: Past incidents inform **precedent scores** (–1 if identical cause) but *not* the simplicity prior (base cost). Each incident is scored independently.  
  - **Why**: MDL uses data (past incidents) to refine hypotheses *within an incident*, not globally. Adjusting priors risks underpenalizing complex hypotheses that "fit" a flawed pattern.  
  - **Action**: If prior fixes were incomplete, their high residual cost (unexplained symptoms) should have been caught in earlier postmortems. Now, score new hypotheses without assuming simplicity.  
  - **Result**: Forces re-scoring with current symptoms. May reveal a new cause or show prior fixes were insufficient (e.g., high residual cost in past reports).

  ---

  ### **Failure Modes and Limitations**
  1. **Misfires**:  
     - **Precedent bias**: Overly favors historical causes (e.g., "another GC bug" wins over a novel cause). *Mitigation*: Cap precedent bonus at –1.  
     - **Verification blind spots**: If logs are missing, low-verification-cost hypotheses dominate, even if wrong. *Mitigation*: Add +1 per "unverifiable element."  
     - **Compression illusion**: "Familiar villain" hypotheses (e.g., "DNS issue") have low H due to precedent but may ignore specifics. *Mitigation*: Penalize residual anomalies strictly.

  2. **Fundamental limits**:  
     - Cannot handle hypotheses about unknown unknowns (cost undefined).  
     - Assumes symptoms are fully enumerated (garbage in, garbage out).  
     - Cost scoring is judgment-based (e.g., "effort >5 minutes" is subjective).

  3. **Judgment dressed as measurement**:  
     - Verification effort scoring (engineer-dependent).  
     - Deciding "distinct causal elements" (e.g., is "GC pause + health check" one event or two?).  
     - Tie-breaking by symptom severity.

  4. **The unlikable answer**: **Case 1 (Cache vs. Replication)**. You may prefer A for its brevity, but the procedure ranks B equally due to completeness. This is correct: A's simplicity is illusory—it ignores the 40-minute recovery, which B explains. Forcing H to include *all causal elements* and R to cover *all symptoms* ensures no hypothesis gets a free pass for partial explanations.

  ---

  ### **Why This Works for Your Team**
  - **Fits constraints**: 60-minute meetings, tired engineers, no theory background.  
  - **Defangs rhetoric**: Rewording conflicts merge into one hypothesis; "one cause vs. web" becomes quantifiable via cost.  
  - **Balances values**: Human judgment is embedded but bounded (e.g., only in ties).  
  - **Improves over time**: Precedent scores build institutional memory.  

  By making complexity tangible through verification effort and symptom coverage, this procedure operationalizes Occam’s razor without theory—while producing auditable, actionable rankings.
