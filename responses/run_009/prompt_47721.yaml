answer: |-
  ### Essay Question
  **Critically evaluate the claim that the functional-role criterion for mechanism individuation offers the most viable foundation for mechanistic anomaly detection in neural networks. In your analysis, address whether this criterion can avoid collapsing into mere behavioural similarity, and discuss how the artificial nature of these systems (e.g., designer access, intervention capacity) alters the analogy with multiple realizability in philosophy of mind. Use concrete examples to illustrate the operational implications for safety monitors.**

  ---

  ### Model Answer (600 words)
  Mechanistic anomaly detection (MAD) promises enhanced AI safety by flagging deployment-time inputs that elicit "alien" computational mechanisms in neural networks. However, its efficacy hinges on defining mechanism identity, where three criteria compete: **overlap** (shared components), **causal-interventionist** (correlated intervention effects), and **functional-role** (equivalent input-output roles in the computational architecture). I argue that while the functional-role criterion is *conceptually* optimal for MAD, it risks behavioural collapse without careful constraints and is strengthened—not weakened—by the artificiality of neural networks, diverging from classic multiple realizability debates.

  The functional-role criterion’s core strength lies in balancing MAD’s twin pitfalls: **over-coarseness** (e.g., overlap criterion missing algorithm substitutions) and **over-sensitivity** (e.g., causal-interventionism flagging benign weight perturbations). For instance, a trojaned arithmetic model reusing neurons for a backdoor "lookup" circuit would share components (overlap) but execute a distinct algorithm. Functional-role individuation, demanding isomorphic computational roles (e.g., "digit decomposition → carry propagation → summation"), would detect this shift even with overlapping circuitry. Conversely, minor activation noise altering causal pathways might be ignored if the functional role remains intact. This navigates the safety-usefulness trade-off by focusing on *computational semantics* rather than hardware or transient dynamics.

  However, this invites the **behavioural collapse objection**: if "same functional role" reduces to "same input-output behaviour", MAD becomes redundant—why monitor internals if outputs suffice? Here, artificial design saves functionalism. Unlike biological systems, neural networks have *known computational architectures* (e.g., residual blocks, attention heads) that let us define roles *structurally*. For example, "attention head H1 computes token-pair relevance" specifies a role *independent* of immediate outputs; a head suddenly attending to irrelevant tokens (e.g., due to adversarial inputs) disrupts its role but may still yield correct answers via other pathways. Thus, roles are *subcomputational*, preventing collapse into mere behaviour.

  The analogy to philosophy of mind’s multiple realizability (e.g., octopus vs mammal pain) is **misleadingly asymmetrical**. While both debates engage functionalism, neural networks are artefacts: designers can *stipulate* mechanism boundaries (e.g., via circuit abstractions) and perform **targeted interventions** (e.g., activation patching) to test role invariance. This makes functional roles *empirically tractable*—unlike natural kinds. For example, if a safety engineer intervenes to corrupt "carry propagation" activations in an adder model and correct outputs persist (implying role redundancy), this signals an anomalous mechanism shift (e.g., memorisation). Designer access thus *resolves* functionalism’s vagueness in philosophy, turning abstract roles into engineerable targets.

  Nonetheless, functional-role MAD faces scaling challenges. Defining roles for billion-parameter models requires interpretability tools that may themselves be fallible. Yet as a *normative* foundation, it best aligns with MAD’s goal: detecting *computationally dangerous deviations*—not just behavioural or structural ones. Alternatives falter critically: overlap is blind to algorithm reuse; causal-interventionism is brittle to noise. Functional roles, grounded in architecture and verifiable via intervention, offer the most viable path for safety-critical monitoring.

  ---

  ### Marking Scheme (Total: 20 marks)
  **Must-hit points** (with common failures):  
  1. **Clear explanation of how functional-role criterion navigates the coarse/fine trade-off** (4 marks).  
     *Common failure: Mentions trade-off but doesn’t specify how functionalism avoids over-coarseness (e.g., trojans) AND over-sensitivity (e.g., noise).*  
  2. **Direct engagement with behavioural collapse risk AND subcomputational defence** (4 marks).  
     *Common failure: Notes collapse risk but offers no concrete solution (e.g., ignores structural role definitions).*  
  3. **Critical analysis of philosophy-of-mind analogy, highlighting designer access/intervention** (5 marks).  
     *Common failure: Recites analogy without contrasting natural/artificial systems or intervention capacity (key A/B differentiator).*  
  4. **Use of two+ concrete examples (e.g., trojan, noise, hallucination) to illustrate criteria differences** (4 marks).  
     *Common failure: Examples lack mechanistic specificity (e.g., "a backdoor" without computational detail).*  
  5. **Defended stance on functionalism’s viability, acknowledging limitations** (3 marks).  
     *Common failure: Neutral summary; no justified position on viability/scaling challenges.*  

  **Grading distinction**:  
  - **A (17–20)**: Integrates all points, uses examples to *contrast* criteria, and **explicitly ties designer access to functionalism’s operational edge**.  
  - **B (13–16)**: Covers seminar material accurately but **lacks original synthesis** (e.g., calls intervention "useful" without explaining *how* it rescues functionalism).  
  - **C (9–12)**: Superficial treatment of analogy or collapse risk; examples underdeveloped.  
  - **D (5–8)**: Misrepresents criteria; omits key trade-offs.  
  - **E (0–4)**: Fails to address question; confuses mechanism identity with OOD detection.  

  ---  
  **British English note**: "Behavioural", "artefact", "analogue" used throughout.
