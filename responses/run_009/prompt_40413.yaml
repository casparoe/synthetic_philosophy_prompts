prompt: |-
  I work in a small government foresight unit. Every few years we inherit a shelf of long-range predictions made decades back — population, energy, resources, technology take-up — and part of my job is telling ministers which of the underlying theories to keep taking seriously and which to quietly bin. Occasionally one of these reviews ends up quoted in a ministerial speech, so the stakes are a bit higher than they look. The easy cases are the ones that came true and the ones that were always crankish. The hard ones are where the date has passed, the predicted thing didn't happen, and the theory's defenders say the mechanism is sound, only the timetable was off — "right but early". At the moment that phrase gets thrown around as if it settles the argument, and I've got no way of telling when it's legitimate and when its just a polite way of never giving up.

  Please write me a decision procedure my team can run on a single missed long-range prediction. Ground it in what philosophy of science actually has to say here — the obvious point that you can't just Popper a conditional claim with a date stapled to it, the Duhem point that a prediction bundles the theory in with auxiliary assumptions about technology, human behaviour and institutions, and Lakatos's distinction between a rescue that generates new testable content and a rescue that merely absorbs failure. It should keep the theory seperate from its auxiliaries at every step, since that's supposedly where the whole adjudication lives. I want a set of ordered questions, with a statement of what counts as a sufficient answer to each, where the procedure stops with a "stop taking this seriously" verdict, and where it hands off to the desk head because the question is one of values rather than facts.

  Then run it on three cases: the original Malthusian prediction about population outrunning the food supply, where the failed auxiliaries were things like fertility behaviour and crop yields; one of the recurring global peak-oil forecasts where the predicted date kept sliding to the right; and a third case of your choosing where you suspect the procedure gives an answer I won't like — I'd rather discover that now than in front of a minister.

  Constraints: it has to be runnable by a policy analyst in one afternoon, using nothing more than arithmetic, no software, and no ability to go back to the original authors. And be honest about which steps are really judgement dressed up as procedure — I can live with that. What I can't live with is pretending we've built a machine when we've built a checklist.

  Finish by telling me what the procedure can't do: where "right but early" is genuinely undecidable from the inside and somebody just has to own the call, and how I should frame that limitation when I present the results upwards.
reasoning: |-
  We are designing a decision procedure for evaluating a "right but early" claim for a long-range prediction that has failed (i.e., the predicted event did not occur by the specified date). The procedure is grounded in philosophy of science, particularly considering:
  - The Duhem-Quine thesis: a prediction is a bundle of the core theory and auxiliary assumptions (about technology, human behavior, institutions, etc.).
  - Lakatos: we want to distinguish between a progressive problem shift (which generates new testable content) and a degenerative one (which merely absorbs failure without new insights).

  The procedure must:
  1. Separate the core theory from the auxiliary assumptions.
  2. Evaluate whether the failure can be attributed to the auxiliary assumptions and whether adjusting them is reasonable and testable.
  3. Avoid becoming a degenerative rescue that just keeps pushing the date without new content.

  We structure the procedure as a series of ordered questions. If at any step we get a "stop" answer, we conclude "stop taking this seriously". If we get to the end without a stop, we hand off to the desk head for a values-based decision.

  **Procedure Steps:**

  1. **Identify the core theory and the auxiliary assumptions.**
     - *Question:* Can the prediction be decomposed into a core theoretical mechanism and a set of auxiliary assumptions (about initial conditions, boundary conditions, technological/social factors, etc.)? List them.
     - *Sufficient answer:* A clear separation must be possible. If not, stop (because we cannot evaluate).
     - *Output:* A list of core theory and auxiliaries.

  2. **Check for ad-hoc adjustments to the auxiliary assumptions.**
     - *Question:* Were the auxiliary assumptions that failed adjusted after the fact? If so, are these adjustments independently motivated (i.e., by evidence outside the theory) or are they ad hoc (only to save the theory)?
     - *Sufficient answer:* If the adjustments are ad hoc (no independent evidence or testable new predictions), stop. Otherwise, proceed.
     - *Note:* This step requires judgment. Independent evidence might come from other fields or data not used in the original prediction.

  3. **Assess the testability of the new prediction.**
     - *Question:* After adjusting the auxiliaries (if any), does the theory make a new, testable prediction? Specifically, does it provide:
       - (a) A new time frame (with a clear, non-vague date or condition)?
       - (b) Quantifiable thresholds or conditions that can be falsified?
       - (c) A mechanism for how the adjustment leads to the new timeline?
     - *Sufficient answer:* If (a), (b), and (c) are satisfied, proceed. If not, stop.

  4. **Evaluate the track record of the core theory.**
     - *Question:* Has the core theory (independently of the auxiliaries) generated other predictions that have been confirmed? Or has it been successful in explaining a range of phenomena?
     - *Sufficient answer:* If the core theory has a track record of success (even if not perfect) and the failure is the first major one, proceed. If the theory has a history of failures and rescues (especially degenerative ones), stop.

  5. **Check for novel predictions.**
     - *Question:* In the process of adjusting the auxiliaries, did the theory generate any novel predictions (i.e., predictions of phenomena not previously known or considered)? This is Lakatos's criterion for a progressive research program.
     - *Sufficient answer:* If yes, proceed. If no, then we are in a degenerative shift and we stop.

  6. **Handoff for values-based decision.**
     - *Question:* If we have passed all the previous steps, the core theory might still be worth monitoring. However, at this point the decision becomes one of values: is the potential risk so great that we must keep monitoring, even if the evidence is weak? Or are the costs of being wrong asymmetric?
     - *Action:* Hand off to the desk head, who must weigh the policy implications and decide whether to keep the theory on the watch list.

  **Running the Cases:**

  We'll run the procedure on three cases:

  1. **Malthusian prediction** (population outrunning food supply, with failure due to changing fertility and crop yields).
  2. **Peak oil** (a recurring forecast with sliding dates).
  3. **A third case:** We choose the **Limits to Growth** (from the Club of Rome report, 1972) which predicted societal collapse due to resource depletion and pollution by the mid-21st century.

  **Case 1: Malthusian Prediction**

  1. **Decomposition:**
     - Core theory: Population grows geometrically, while food production grows arithmetically, leading to inevitable shortage.
     - Auxiliaries: Fertility rates remain high (or at least population growth continues exponentially), agricultural technology improves only linearly (or slowly), no major changes in human behavior (e.g., voluntary fertility reduction) or institutions (e.g., family planning policies).

  2. **Ad-hoc adjustments?** 
     - The adjustments (e.g., the Green Revolution increasing crop yields, or demographic transition lowering fertility) were not anticipated by Malthus. However, these are not ad hoc because they are independently observed and well-documented. They are facts of history.

  3. **Testability of new prediction?**
     - Modern Malthusians (like Paul Ehrlich) adjusted the timeline (e.g., to 2000, then 2020, etc.). But they did not provide a clear mechanism for why the new timeline is more accurate. The core theory does not specify how technological progress or demographic transitions interact with the geometric/arithmetic growth. Without a quantifiable model, the new predictions remain vague.

  4. **Track record of core theory?**
     - The core theory has a poor track record. It has been repeatedly falsified (in the 19th century, 20th century, and 21st century). The mechanism (geometric vs. arithmetic) is too simplistic and does not account for feedback loops (e.g., rising prices spurring innovation).

  5. **Novel predictions?**
     - The theory has not generated novel predictions. Adjustments are always after the fact.

     **Verdict:** Stop taking seriously. (We would stop at step 3 or 4.)

  **Case 2: Peak Oil**

  We take a specific example: the prediction by M. King Hubbert (1956) for US peak oil around 1970 (which was correct) and his global peak oil prediction for around 2000 (which was not).

  1. **Decomposition:**
     - Core theory: Oil production in a fixed region follows a bell-shaped curve (Hubbert curve) due to finite resources and extraction dynamics.
     - Auxiliaries: Estimates of ultimately recoverable resources (URR), the assumption that technology and economics do not fundamentally alter the URR or the shape of the curve, and that no major substitutes emerge.

  2. **Ad-hoc adjustments?**
     - The global peak was initially predicted for 2000, then adjusted to 2010, then 2020, etc. The adjustments are due to recalculating URR (as new reserves are found) and including unconventional sources (like shale oil). These adjustments are based on new data, but they are reactive. The adjustments are ad hoc if they are only made to push the date without a prior independent basis.

  3. **Testability of new prediction?**
     - The new predictions (with updated URR) are testable. For example, a prediction for 2030 can be tested then. However, the mechanism (the bell curve) is still applied, but the URR is constantly revised. The problem is that the theory does not provide a clear method to determine URR independently (it's an input). Without a theory of how URR changes with technology and economics, the predictions are always adjustable.

  4. **Track record?**
     - The core theory had a success in the US lower 48 states. Globally, it has consistently failed. The track record is mixed.

  5. **Novel predictions?**
     - The theory has not generated novel predictions beyond the peak timing. It does not predict, for example, the technological breakthroughs (like fracking) that change URR.

     **Verdict:** Stop taking seriously. (We might stop at step 2 because the adjustments are reactive and not independently motivated by a deeper theory of resource estimation. Also, step 5 fails.)

  **Case 3: Limits to Growth (Club of Rome, 1972)**

  The original model (World3) predicted collapse (e.g., in industrial output, food per capita, population) by the mid-21st century. We are not there yet, but some argue we are on track.

  1. **Decomposition:**
     - Core theory: Exponential growth in population and industrial output in a finite world leads to overshoot and collapse due to resource depletion and pollution.
     - Auxiliaries: Specific parameters for resource availability, pollution generation and absorption, technological progress, and societal responses.

  2. **Ad-hoc adjustments?**
     - The model has been updated several times (e.g., 30-year update). The adjustments include new data on resources and pollution. They are not entirely ad hoc because they are based on observed trends. However, the model structure (with its feedback loops) is maintained.

  3. **Testability of new prediction?**
     - The updated models (e.g., in "Limits to Growth: The 30-Year Update") set new timelines (e.g., collapse around 2040). They provide quantifiable thresholds (e.g., for pollution levels, resource depletion). The mechanism (feedback loops) is explicit.

  4. **Track record?**
     - The original model was controversial and criticized for parameter choices. However, some studies (e.g., by Graham Turner) have shown that the observed data from 1970-2000 aligns with the original "business as usual" scenario. The track record is mixed but not entirely negative.

  5. **Novel predictions?**
     - The model predicts not just collapse but also the possibility of avoiding it through policy changes (e.g., stabilizing population, reducing pollution). These are testable in principle (if policies are implemented). It also predicted the rise in pollution (like CO2) and its impacts, which are now central to climate change discussions.

     **Verdict:** This is a close call. We might proceed to step 6 and hand off to the desk head. The reason is that the core theory (system dynamics of exponential growth in a finite system) has some explanatory power and the adjustments are not entirely ad hoc. Also, the theory has generated novel concerns (about sustainability) that are now mainstream. However, the exact timing of collapse remains elusive and the model is highly sensitive to parameters. The desk head must decide if the potential risks (catastrophic collapse) warrant continued monitoring despite the uncertainty.

  **What the Procedure Cannot Do:**

  - **Indeterminacy in Auxiliary Assumptions:** Sometimes, the failure of a prediction might be due to an auxiliary that is deeply intertwined with the core theory. The separation may be arbitrary, and then the whole procedure becomes subjective.
  - **Value-Laden Decisions:** The procedure can only take us so far. When the potential consequences are catastrophic (even if the probability is low), the decision to keep monitoring a theory is a value judgment (about risk aversion) and not a scientific one.
  - **The Problem of Time:** Some theories might be "right but early" because they are ahead of their time. The procedure tries to force testability, but if the new prediction is too far in the future (beyond the policy horizon), then it becomes impractical to wait.

  **How to Frame the Limitation:**

  When presenting results to ministers, frame the procedure as a way to systematically separate scientific merit from wishful thinking. But emphasize that:

  1. **Science is Cumulative:** No single test can kill a theory, but repeated failures and degenerative rescues erode confidence.
  2. **Risk Management:** Some theories, even if not scientifically robust, might describe risks that are too severe to ignore. The decision to keep them on the radar is then a risk management issue, not a scientific one.
  3. **Transparency:** The procedure makes explicit where the judgment calls are (especially in steps 2 and 5). We are not building a machine but a structured way to avoid common pitfalls.

  The final handoff to the desk head (step 6) is where we acknowledge that policy must sometimes act under deep uncertainty. The procedure provides the evidence base for that decision but cannot replace it.
answer: |-
  Below is a decision procedure for evaluating "right but early" claims about failed long-range predictions, grounded in philosophy of science (Popper, Duhem, Lakatos). It separates the core theory from auxiliary assumptions, forces explicit tests for degenerative rescues, and flags when decisions become values-based. The procedure is designed for a policy analyst to run in one afternoon using only arithmetic and publicly available data. Judgment is explicitly called out where needed—no "machine" illusions.

  ---

  ### **Decision Procedure: Evaluating "Right but Early" Claims**  
  **Input**: A single failed prediction (event did not occur by the specified date).  
  **Output**: **A** (Stop taking seriously), **B** (Handoff to desk head), or **C** (Continue monitoring).  

  #### **Step 1: Decompose the Prediction**  
  *Question*: What are the **core theory** (CT) and **auxiliary assumptions** (AAs)?  
  - *CT*: The fundamental mechanism (e.g., "Population growth outpaces food production").  
  - *AAs*: Testable assumptions about technology, behavior, institutions, or external factors (e.g., "Fertility rates stay high; crop yields grow linearly").  
  *Sufficient answer*: A clear split into CT and ≥3 AAs. List them.  
  *Judgment call*: Distinguishing CT from AAs requires domain knowledge (e.g., if the AA is core to the theory, it’s CT).  
  *Stop if*: CT and AAs cannot be separated (e.g., the theory is too vague). Output **A**.  

  #### **Step 2: Quantify the Miss**  
  *Question*: By how much did reality deviate? Calculate:  
  - **Temporal miss**: How many years early/late?  
  - **Magnitude miss**: How far off was the predicted value vs. actual? (e.g., predicted oil demand: 120M barrels/day; actual: 100M).  
  *Sufficient answer*: Use public data (e.g., UN statistics, IEA reports). Express misses as percentages.  
  *Stop if*: The miss is >50% of the prediction window (e.g., a 2050 prediction missed in 2020 is a 60% miss). Output **A** (too wrong to salvage).  

  #### **Step 3: Test Auxiliary Assumptions (Duhem Check)**  
  *Question*: Which AAs failed? For each AA:  
  - Is there evidence it was **wrong** (e.g., crop yields grew exponentially, not linearly)?  
  - Was the AA **falsifiable** at the time? (e.g., "Fusion power by 2000" was testable; "human ingenuity will save us" is not).  
  *Sufficient answer*: ≥2 failed AAs with evidence (e.g., data showing behavioral shifts).  
  *Judgment call*: Assessing falsifiability requires historical context (e.g., 1970s peak-oil AAs about fracking were untestable then).  
  *Stop if*: >50% of AAs failed **and** CT relies on them. Output **A**. Else, proceed.  

  #### **Step 4: Assess Rescue Plausibility (Lakatos Check)**  
  *Question*: Did defenders adjust the prediction **progressively**? Check:  
  - **Novel content**: Did the rescue generate new testable predictions (e.g., "fertility will drop below replacement by 2030")?  
  - **Degenerative rescue**: Is the adjustment vague or untestable (e.g., "we’re still right, just later")?  
  *Sufficient answer*: New predictions must have clear metrics/dates (e.g., "Oil demand peaks by 2040 ±5 years").  
  *Stop if*: Rescue is degenerative (no new testable content). Output **A**. Else, proceed.  

  #### **Step 5: Track Record Audit**  
  *Question*: What is the theory’s historical accuracy? Calculate:  
  - **Success rate**: (Number of correct predictions) / (Total predictions).  
  - **Rescue rate**: (Number of date/timeline adjustments) / (Total failures).  
  *Sufficient answer*: Use historical data (e.g., past government reports, academic reviews).  
  *Stop if*: Success rate <30% **or** Rescue rate >50%. Output **A**. Else, proceed.  

  #### **Step 6: Values Handoff**  
  *Question*: Is the core theory’s **risk/reward asymmetry** high? (e.g., if CT is right, the cost is catastrophic; if wrong, monitoring is cheap).  
  *Sufficient answer*: Requires no data—pure policy judgment.  
  *Output*: If yes → **B** (Handoff to desk head). If no → **C** (Continue monitoring).  

  ---

  ### **Procedure Walkthrough: Three Cases**  
  **Case 1: Malthusian Population Crisis**  
  - **Prediction**: Population outruns food supply by 1900 (failed).  
  - **CT**: Population grows geometrically; food production arithmetically → inevitable shortage.  
  - **AAs**: Fertility rates remain high; no major agricultural innovations; no behavioral changes (e.g., family planning).  
  - **Run**:  
    1. **Step 1**: CT and AAs separable (✓).  
    2. **Step 2**: Temporal miss: 120+ years; magnitude miss: Global population is 8B (predicted ~2B for 1900; actual ~1.6B) → 300% miss (✓ **A**).  
    3. *Stop at Step 2*. Output **A** (Stop taking seriously).  
  - **Why**: The miss is too large to justify timeliness claims. Auxiliaries (fertility, crop yields) failed catastrophically.  

  **Case 2: Peak Oil (Hubbert’s 1970s Forecast)**  
  - **Prediction**: Global oil production peaks in 2000 (failed; shifted to 2030+).  
  - **CT**: Finite resources → extraction follows a bell curve.  
  - **AAs**: No game-changing tech (e.g., fracking); demand growth constant; no substitutes (e.g., renewables).  
  - **Run**:  
    1. **Step 1**: CT and AAs separable (✓).  
    2. **Step 2**: Temporal miss: >30 years (✓ proceed).  
    3. **Step 3**: AAs failed: Fracking disrupted extraction; renewables grew faster (✓ **A**).  
    4. *Stop at Step 3*. Output **A** (Stop taking seriously).  
  - **Why**: >50% of AAs failed (tech and demand). Defenders offered no new testable content—just date shifts.  

  **Case 3: Limits to Growth (Club of Rome, 1972)**  
  - **Prediction**: Societal collapse by 2000 due to resource depletion/pollution (failed; shifted to 2050).  
  - **CT**: Exponential growth + finite resources → overshoot/collapse.  
  - **AAs**: No pollution controls; resource consumption grows unchecked; no innovation in efficiency.  
  - **Run**:  
    1. **Step 1**: CT and AAs separable (✓).  
    2. **Step 2**: Temporal miss: >50 years (✓ proceed).  
    3. **Step 3**: AAs partially failed (pollution controls adopted, efficiency improved).  
    4. **Step 4**: Rescue generated novel content (e.g., "CO2 will breach 400ppm by 2016" → correct). Not degenerative (✓ proceed).  
    5. **Step 5**: Track record: Low success rate (original collapse missed), but high rescue rate (✗ judgment: 60% rescue rate → borderline). Proceed.  
    6. **Step 6**: Risk asymmetry: If CT is right, collapse is catastrophic. Output **B** (Handoff to desk head).  
  - **Why you’ll dislike this**: The theory survives due to novel predictions (e.g., climate tipping points) and high stakes. But it’s handed off because the decision hinges on risk tolerance, not science.  

  ---

  ### **What the Procedure Can’t Do**  
  1. **Indeterminacy in "Near Misses"**: If a prediction misses narrowly (e.g., 5% temporal/magnitude error) and AAs are ambiguous, the call is judgment-based. Example: Fusion energy predictions failing by a decade—no bright line separates "close" from "wrong."  
  2. **Theories Immune to Falsification**: Some CTs absorb all failures via AAs (e.g., "Marxist revolution is inevitable, but false consciousness delays it"). The procedure flags this in Step 4, but if defenders keep generating "new" content, it requires subjective termination.  
  3. **Values vs. Science Boundary**: Step 6 explicitly hands off high-stakes/low-probability theories (e.g., asteroid impact predictions). This isn’t a flaw—it forces transparency about when science ends and policy begins.  

  **How to Frame Limitations to Ministers**:  
  > "This procedure separates scientific merit from optimism bias using established principles of evidence. It tells us when a theory is **scientifically unsalvageable** (e.g., Malthus, peak oil) and when it’s **too risky to ignore despite weak evidence** (e.g., collapse theories). For the latter, we flag it for leadership judgment—because betting on low-odds catastrophes is a values call, not a scientific one. No tool can eliminate that uncertainty, but this makes the tradeoffs explicit."  

  The procedure prioritizes defensible empiricism over false precision. It won’t make the politics easier, but it will make your team’s advice harder to ignore.
