prompt: |-
  I've just been appointed to the allocations committee of a small health foundation that must, each quarter, divide a fixed budget among three kinds of interventions: pain management at a hospice we operate, mobility restorations such as hip replacements and prostheses, and preventive pediatric care. Our working rule is prioritarian — benefits to the worse off count for more — and I have come to see that this rule presupposes interpersonal comparisons of well-being at several points at once: whose level is lower, whose gain from an intervention is larger, and by how much. Before we commission anyone to build a scoring model on top of these comparisons, I want to know what an account of interpersonal utility comparisons actually has to deliver before it can be trusted with any of this.

  So write me the desiderata. I want a requirements list for an adequate theory of interpersonal utility comparisons, with the case or consideration behind each requirement, and a clear indication of which requirements are non-negotiable for my purpose — comparisons good enough to rank budget options under a prioritarian rule, not to say that anyone's life contains some number of utils — as against which requirements are demands of one camp rather than genuine constraints. At minimum, the list should take a stand on: the difference between comparing levels and comparing increments, and which my purpose actually needs; whether we require comparability all the way up to a common cardinal unit, or only enough structure to rank gains and their ratios; what the theory should say about self-reports of intensity, given that patients describe their pain on scales that seem idiosyncratic in ways that matter to the budget; whether the account can be sensitive both to momentary intensity and to the shape of whole lives, since a hospice patient and a child getting preventive care are not being compared at a single moment; and the two cases that keep surfacing in our meetings — a small relief granted to very many versus an agony spared to one, and the patient who insists her persistently aching back is the worst thing in her world while another with the same condition rates it mild and asks us to spend on someone else. If you suspect that some pair or subset of the desiderata cannot be jointly satisfied — in particular whether the objectivity my prioritarian rule needs can coexist with the individualist constraints that drove economists to ordinalism and skepticism about comparison in the first place — say so plainly, because that is the part I most need to know before we spend money on a model. Then, in no more than a short paragraph, tell me how three candidate pictures fare against your own list: a hedonic common-scale view, an extended-preferences view in the Harsanyi style, and a view that rests content with rough ordinal judgments. Keep the whole thing under 900 words; I will read it on the train to the next meeting.
reasoning: |-
  Okay, let me approach this systematically. The user is on an allocations committee for a health foundation needing to distribute funds among pain management, mobility restorations, and pediatric care under prioritarianism. They need a requirements list for interpersonal utility comparisons that's practical for their budget decisions.

  First, I'll identify the core challenges they face: comparing levels of wellbeing (who's worse off), comparing gains from interventions, and handling idiosyncratic pain scales. The two recurring cases - many small reliefs vs one major agony, and subjective pain reporting variations - need special attention.

  For the requirements list, I consider what's essential versus negotiable:
  - Non-negotiable: Cardinal comparability for gains (to weigh marginal benefits), lifetime perspective (since hospice patients and children have different timeframes), and partial objectivity (to justify budget decisions)
  - Negotiable: Full cardinal level comparisons and perfect interpersonal ratios
  The tension between objectivity and individualism must be addressed head-on - prioritarianism needs enough objectivity for fair allocations but can't ignore subjective differences.

  For candidate theories:
  - Hedonic scale: Strong on pain comparisons but weak on lifetime aggregation
  - Extended preferences: Good theoretical foundation but vulnerable to individual variation
  - Ordinal approach: Fails their needs completely by not handling gain comparisons

  The key insight is that their prioritarian rule requires cardinal gain comparisons across lives, especially for the "many small reliefs vs one major agony" dilemma. I'll emphasize this while keeping the whole response under 900 words as requested.
answer: |-
  Here are the desiderata for an adequate theory of interpersonal utility comparisons (IUCs) for your prioritarian budget allocation, categorized by necessity and rationale. The core non-negotiables address comparability of welfare *gains* across individuals for prioritization, not metaphysical precision.

  ### Non-Negotiable Requirements (Essential for Prioritarian Allocation)
  1.  **Cardinal Comparability of Welfare Gains:**  
      *Case:* Prioritizing interventions requires knowing *how much more* a specific benefit (e.g., pain reduction, mobility gain, disease prevention) improves the welfare of one recipient compared to another. A small gain to the worst-off might outweigh a large gain to the better-off, but this requires comparing the *size* of gains across people.  
      *Need:* Must compare increments cardinally (i.e., ratio-scale comparisons: "Gain A to person X is *twice as large* as Gain B to person Y").

  2.  **Comparable Welfare Levels (Ordinal Minimum):**  
      *Case:* Prioritarianism weights gains based on the recipient's *absolute welfare level*. You must identify who is "worse off" to apply the priority weight.  
      *Need:* At least ordinal comparability of levels ("Person A is worse off than Person B"). Cardinal level comparability (precise differences/ratios in levels) is *highly desirable but not strictly essential* if gain comparisons incorporate priority weighting based on relative position.

  3.  **Lifetime Perspective Integration:**  
      *Case:* Comparing a hospice patient (short remaining life, intense suffering) with a child receiving preventive care (long life, potential future suffering averted) requires assessing welfare over entire lives or relevant time horizons, not just momentary states.  
      *Need:* Theory must provide (or be extensible to) a framework for comparing gains and levels over time-appropriate segments (e.g., remaining life expectancy).

  4.  **Partial Objectivity / Inter-Subjective Anchor:**  
      *Case:* To justify budget decisions publicly and avoid arbitrariness, comparisons cannot be *purely* subjective or idiosyncratic. While patient self-reports (e.g., pain scales) are crucial inputs, the theory needs a way to calibrate them against a common standard for meaningful cross-person comparison.  
      *Need:* A method to translate subjective reports/phenomena into a common, inter-subjectively defensible metric for gains and levels, even if imperfect. Pure subjectivism fails prioritarianism.

  ### Important but Negotiable Requirements (Shape the Approach, Not Strictly Blocking)
  5.  **Handling Intensity Self-Reports:**  
      *Case:* Patients rate identical conditions wildly differently. A theory must *use* self-reports without being hostage to them if they conflict with functional impairment or calibration techniques.  
      *Need:* A method to interpret, weight, or potentially adjust self-reports using behavioral data, physiological correlates, or expert judgment to achieve comparability (Requirement 4).

  6.  **Addressing the "Many Small vs. One Agony" Case:**  
      *Case:* Aggregating many small pains vs. relieving intense agony tests the cardinality and priority weighting. Does saving one from agony outweigh relieving mild discomfort for thousands?  
      *Need:* The theory must enable cardinal gain comparisons *and* provide a defensible weighting function based on level (Requirement 2). It doesn't dictate the *strength* of priority (how concave the weighting function is), but must make the comparison possible.

  7.  **The "Idiosyncratic Valuation" Case:**  
      *Case:* Same condition, different self-assessments ("worst thing" vs. "mild"). Prioritarianism cares about *actual welfare impact*, not just self-report.  
      *Need:* The theory must reconcile self-reports with objective anchors (Requirement 4 & 5). It might judge the impact based on typical functional limitations or calibrated scales, potentially overriding some self-assessments if deemed unreliable for welfare.

  ### Key Tension: Objectivity vs. Individualism
  The core conflict lies between **Requirement 4 (Partial Objectivity)** and the **individualist constraint** (welfare is fundamentally personal/subjective). Pure ordinalism/skepticism (driven by individualism) *cannot* satisfy Requirements 1 & 2, essential for prioritarianism. **No theory achieves perfect objectivity.** However, an adequate theory *must* bridge the gap sufficiently for plausible, defensible allocation decisions. It requires:
  *   **Calibration:** Using behavioral choices, physiological measures, or expert-defined "anchor states" (e.g., pain equivalent to childbirth, inability to walk) to map diverse subjective reports onto a common scale.
  *   **Counterfactual Reasoning:** Assessing how an intervention *changes* an individual's state relative to their baseline and typical human capacities/experiences.

  ## Candidate Theories Against the List
  *   **Hedonic Common-Scale:** Assumes a universal "hedon" unit for pleasure/pain. **Strengths:** Directly addresses cardinal gains (1), levels (2), intensity (5), and objectivity (4) via physiological anchors. **Weaknesses:** Crude for lifetime perspective (3); struggles with non-sensory welfare (e.g., dignity at hospice); controversial metaphysics.
  *   **Extended Preferences (Harsanyi):** Defines utility via idealized preferences over "being anyone in any state." **Strengths:** Provides cardinal gains (1) and levels (2) theoretically; handles lifetime (3) conceptually; offers inter-subjective anchor (4). **Weaknesses:** Highly abstract; vulnerable to individual variation in actual preferences (5,7); requires strong rationality assumptions.
  *   **Rough Ordinal Judgments:** Only ranks states/people ordinally. **Fatal Flaw:** Utterly fails Requirement 1 (cardinal gains). Cannot distinguish small vs. large gains across people or handle aggregation (6), making prioritarian weighting impossible. **Verdict:** Insufficient for your purpose.

  **Conclusion:** Your prioritarian rule *demands* cardinal comparability of welfare gains across individuals anchored in a partially objective framework. Hedonic and extended-preference views offer paths, both requiring careful implementation to handle lifetime welfare and subjective reports. Pure ordinalism is useless. The tension between individualism and objectivity is real; the chosen theory must use calibration/counterfactuals to build a *defensibly* common scale for gains and levels sufficient for allocation decisions, acknowledging inherent imprecision.
