prompt: |-
  I'm a PhD student in political science, and I help run a forecasting club where we vote on whether-things-will-happen questions and track how the majority vote does against individual members. Something keeps happening that I don't have a word for, and my advisor just says "yeah, that's the usual thing" without ever saying what the usual thing is called.

  Here's the pattern. We started with 12 members and the majority was right about 70% of the time on binary questions (will X happen by date Y, that kind of thing). Adding members kept helping until around 25-30 people, and then it just flatlined — we're at 60 members now and the majority is no better than it was at 30, even though every single member is right more often than wrong on their own. And it can get actively worse in a specific way: we recruited a batch of 15 new members who all follow the same two pundits and basically the same feeds, and after they joined our accuracy dipped. Meanwhile a friend's club with only six members but whose people each pull from totally different stuff (one's a macro trader, one a historian, one a local journalist) is beating us. So the effect seems to be: votes that come from the same source don't stack. Five people who all read the same article are one vote wearing five hats, and the pooling rule can't tell the difference. Worse, shared sources seem to mean shared blind spots, so a crowd can be confidently wrong together in a way no individual member is.

  Is there an established name for this exact configuration — sincere, individually-more-often-right-than-wrong voters who fail to improve, or even degrade, group accuracy because their judgments run through the same channels? I know its somewhere near "groupthink" and somewhere near the "wisdom of crowds" idea, but groupthink sounds like it's about social pressure, and nobody in our club is pressured — everyone submits silent ballots — and "wisdom of crowds" is a book title more than a mechanism as far as I can tell. If there's a precise concept for it, tell me what it's called and where its edges are: is the problem just shared evidence, or also shared priors; does it matter whether members know about each other's sources; at what point does adding a voter with a duplicate perspective count as adding nothing versus adding negatively? And if there's no established term, coin one, because for my dissertation chapter I need to distinguish this from ordinary conformity effects, and that distinction is the whole point.
reasoning: |-
  Okay, let me tackle this user's problem. They're a PhD student in political science running a forecasting club. The issue is that adding more members beyond 25-30 doesn't improve the group's accuracy, even though each member is individually competent. Worse, adding members who share information sources actually decreases accuracy. The user needs a precise term for this phenomenon to use in their dissertation.

  First, I recall the "wisdom of crowds" concept, which typically requires diversity of information. The user mentions that their club's accuracy plateaued and even dipped when they added homogeneous members. That points to a lack of independence and diversity. Terms like "diversity prediction theorem" come to mind. Philip Tetlock's work on forecasting emphasizes cognitive diversity. 

  The user distinguishes their issue from groupthink since there's no social pressure. They need a term that focuses on shared information sources leading to correlated errors. "Correlated errors" might be part of it, but is there a more specific term? "Common knowledge effect" refers to shared information dominating discussion, but their voting is silent. 

  Looking deeper, the problem seems to be about statistical dependence. Even without communication, if forecasters rely on the same data, their errors correlate. Adding more such members doesn't add new information; it just reinforces existing biases. Terms like "information cascades" or "redundant information" fit here. 

  The user also asks about the threshold where adding members becomes negative. This relates to the marginal value of additional information. If new members don't bring unique perspectives, they might amplify shared blind spots. The concept of "effective crowd size" from models like Condorcet’s Jury Theorem with correlated votes seems relevant. 

  I should check if there's an established term. "Correlation neglect" is when people underestimate dependencies, but that's more about perception. The core issue here is the statistical dependence itself. Maybe "correlated information sources" or "information redundancy" combined with "diversity breakdown." 

  For the dissertation, coining a term might be necessary. "Information Homogeneity Effect" or "Source-Driven Error Correlation" could work. Emphasizing the silent, sincere voting aspect is key to differentiate from groupthink. Highlighting the plateau and dip in accuracy due to shared sources would clarify the edges of the concept.
answer: |-
  Based on your detailed description and the critical need to distinguish this from social conformity effects like groupthink, the **precise established concept** you're encountering is **"Statistical Dependence of Errors"** (or **"Error Correlation"**) within the **"Wisdom of Crowds" framework**, specifically violating the **Independence and Diversity conditions**.

  Here's the breakdown:

  1.  **The Core Mechanism:** The "Wisdom of Crowds" (WoCs) effect relies on three key conditions for better-than-individual group accuracy:
      *   **Diversity of Opinion:** Members have private information or unique perspectives.
      *   **Independence:** Members' opinions aren't determined by the opinions of others *during judgment formation*.
      *   **Decentralization:** Members can specialize and draw on local knowledge.
      *   **Aggregation:** Some method exists to turn private judgments into a collective decision (e.g., majority vote, mean).

  2.  **The Violation & Its Name:** Your problem arises because **individual judgments, while sincere and individually competent, are not statistically independent**. Their *errors* (mistakes) are **correlated**.
      *   **Cause:** Shared information sources, analytical frameworks, priors, or mental models create **common cause variation**. Even without social pressure, they are all processing the *same* (or highly overlapping) evidence through *similar* lenses.
      *   **Effect:** This shared perspective creates **shared blind spots**. When the shared evidence/framework is flawed or incomplete on a specific question, *everyone relying on it is likely to make the same error*. Adding more people from the *same information ecosystem* does not add genuinely new information; it just adds more *copies* of the same dependent judgment. This violates both **Independence** and **Diversity**.
      *   **Established Terms:**
          *   **"Correlated Errors" / "Statistical Dependence of Errors":** This is the most fundamental statistical description of what's happening. It's the core reason accuracy plateaus or declines.
          *   **"Lack of Cognitive Diversity":** This emphasizes the root cause – the similarity in *how* information is processed and interpreted.
          *   **"Information Redundancy" / "Common Knowledge Effect" (in a broader sense):** Highlights that members are accessing and weighting the same core information, making their contributions non-unique.
          *   **"Breakdown of the Wisdom of Crowds (due to lack of independence/diversity)":** This situates your phenomenon within the established WoCs literature.

  3.  **Distinguishing from Groupthink:**
      *   **Groupthink:** Primarily a *social psychological process* involving pressure for conformity (self-censorship, illusion of unanimity, direct pressure), suppression of dissenting views, and deterioration of mental efficiency/reality testing *due to group dynamics*. Accuracy suffers because unique information isn't surfaced or valued.
      *   **Your Case (Error Correlation):** A *statistical/informational problem*. Judgments are formed *individually and sincerely* (`silent ballots`), but they are derived from overlapping inputs and processes. Accuracy suffers not because dissent is suppressed, but because there *is no meaningful dissent to suppress* – everyone arrived at the same (potentially wrong) conclusion independently due to shared inputs/frameworks. **The key difference is the origin of the shared error: common inputs vs. social pressure.**

  4.  **Edges of the Concept - Answering Your Specifics:**
      *   **Shared Evidence vs. Shared Priors:** **Both are critical.** Shared evidence (same feeds, articles) directly creates overlapping information. Shared priors/frameworks (e.g., reliance on the same theoretical models, similar ideological lenses) mean that *even different evidence* is interpreted in the same way, leading to correlated judgments. Your `pundit-followers` batch suffered from both.
      *   **Member Awareness:** Knowing about shared sources *might* subtly influence weighting (e.g., "Everyone saw that report, maybe it's less unique"), but the core correlation happens at the *formation* stage due to shared inputs. It's primarily about the *source* of their judgment, not their awareness of others' sources *during voting*. Silent ballots minimize any *post-formation* influence.
      *   **Adding Nothing vs. Adding Negatively:**
          *   **Adding Nothing (Plateau):** When a new member's information sources and judgment process are *highly redundant* with the existing pool, their vote adds negligible new information. The "crowd" effectively doesn't get larger in terms of independent signals. Accuracy stops improving. (Your 25-30 to 60 plateau).
          *   **Adding Negatively (Dip):** When a new member's information sources and judgment process *amplify an existing bias or blind spot* within the group. They don't just fail to add independent information; they *reinforce a specific type of error*. Adding a bloc sharing the *same* flawed source/framework actively increases the correlation of errors around that specific flaw. (Your `pundit-followers` batch). It also dilutes the relative weight of any genuinely independent voices still in the group.
      *   **The Threshold:** There's no universal number. The point where adding a voter adds nothing/negatively depends entirely on the **marginal diversity** they bring relative to the existing pool. Your `friend's club` with 6 highly diverse members likely has a much higher *effective independent signal count* than your 60-member club with high redundancy. It's about *unique perspectives*, not raw headcount.

  **For Your Dissertation Chapter:**

  *   **Use:** "**Statistical Dependence of Errors**" or "**Error Correlation due to Lack of Cognitive Diversity/Information Redundancy**".
  *   **Contextualize:** Explicitly frame it as a violation of the Independence and Diversity conditions necessary for the Wisdom of Crowds effect.
  *   **Contrast:** Clearly distinguish it from groupthink/conformity by emphasizing:
      *   Sincere, unpressured individual judgment formation (`silent ballots`).
      *   The origin of shared errors lying in *shared inputs and cognitive frameworks* before aggregation, not *social dynamics during or after* judgment formation.
      *   The statistical nature of the problem (correlation) rather than the psychological suppression of dissent.
  *   **Coin (if needed):** If you want a punchier, descriptive term specific to forecasting contexts: **"Source-Driven Error Correlation"** or **"Information Homogeneity Effect"**. However, anchoring it in the established terms ("Error Correlation," "Lack of Independence/Diversity in WoCs") is stronger academically.

  **Key References to Cite:**

  *   **Surowiecki, J. (2004). *The Wisdom of Crowds***: For the foundational conditions (Independence, Diversity, etc.).
  *   **Page, S. E. (2007). *The Difference: How the Power of Diversity Creates Better Groups, Firms, Schools, and Societies***: For the deep dive on *why* and *how* cognitive diversity (diverse perspectives, heuristics, interpretations, predictive models) leads to better collective outcomes, especially under uncertainty.
  *   **Larrick, R. P., & Soll, J. B. (2006). Intuitions about combining opinions: Misappreciation of the averaging principle.** *Management Science*, *52*(1), 111-127: Discusses how people underestimate the importance of independence and the power of averaging *even correlated* estimates.
  *   **Tetlock, P. E., & Gardner, D. (2015). *Superforecasting: The Art and Science of Prediction***: While focused on individual skill, their work on aggregating forecasts within teams implicitly deals with managing information sharing to *avoid* excessive correlation while still benefiting from some updating (e.g., via prediction markets or structured teams). Highlights the practical challenge.
  *   **Condorcet's Jury Theorem:** The mathematical foundation showing majority accuracy increases with group size *only if* voter judgments are independent and competence > 0.5. Your plateau/dip is a direct violation of the independence assumption due to correlated errors.

  Your empirical findings (plateau at 25-30, dip with `pundit-followers`, success of small diverse group) are excellent real-world illustrations of these theoretical and statistical principles. Your advisor is right that it's "the usual thing" – it's a fundamental and well-understood limitation of collective intelligence when diversity and independence are lacking.
