prompt: |-
  Covering science for a mid-sized outlet, I keep bumping into the line "absence of evidence is evidence of absence" — most recently a researcher told me that because her big trial turned up nothing, that's positive evidence the drug does nothing, and someone in the comments shot back with the old rejoinder that absence of evidence is NOT evidence of absence. Both sides talk like their one-liner settles the matter. Can you lay out the different precise claims the slogan could actually be making — from something almost trivially true of probabilities to something that would let you draw strong negative conclusions from null results — and say for each whether it's plausible and whether it would get my researcher her conclusion? I have a feeling the raven paradox is lurking somewhere in here (the white shoe thing), so if any of the readings connect to that, flag it. A list I can work from while drafting would be ideal.
reasoning: |-
  Okay, let me tackle this science writer's query about "absence of evidence vs evidence of absence." They're stuck between a researcher claiming her null trial proves the drug is ineffective and commenters dismissing it with the classic one-liner. 

  First, I need to unpack why both sides sound convincing. The researcher isn't entirely wrong—in statistics, null results do update our beliefs. But the commenter has a point too: absence of evidence isn't automatic proof. The key is context: what we were looking for, how hard we looked, and what we expected to find.

  Hmm, the raven paradox connection is spot-on. That white shoe counterexample perfectly shows how "no evidence" can mislead if we don't consider alternative explanations. Like, failing to find ravens in your basement doesn't prove ravens don't exist globally. 

  I'll structure this as layered claims, from trivial truths to strong conclusions. Start with basic probability: if evidence was expected but absent, that should lower our confidence. But crucially, only if the test was capable of detecting the effect. That's where sensitivity and Bayesian updating come in—the researcher's conclusion holds only if her trial had high power and controlled for noise.

  For the writer's draft, I'll flag three key scenarios: 
  - When absence is meaningless (like using a broken detector) 
  - When it's weak evidence (low-power study) 
  - When it's strong evidence (well-designed null result). 

  The drug trial likely falls in the last category if properly designed, so the researcher has a case—but it's probabilistic, not absolute proof. Should emphasize that distinction to avoid overclaiming.
answer: |-
  Here's a breakdown of the "absence of evidence" slogan, dissected into precise claims ranging from trivial truths to strong conclusions, with assessments of plausibility, applicability to the researcher's claim, and connections to the Raven Paradox:

  ### Key Concepts & Definitions
  - **Evidence (E):** Data relevant to a hypothesis (H).
  - **Absence of Evidence:** Not observing data we *expected* if H were true.
  - **Evidence of Absence:** Data that actively *supports* H being false.
  - **Sensitivity:** The probability a test detects an effect *if it exists* (Power = 1 - β).
  - **Raven Paradox Connection:** Highlights how auxiliary assumptions (e.g., "all ravens are black" links to "non-black things are not ravens") influence what counts as evidence. A white shoe *is* evidence against "all ravens are black" but counterintuitively so.

  ---

  ### The Layered Claims: From Trivial to Strong
  1. **Trivial Probabilistic Claim (Bayesian Update)**  
     *Claim:* If H predicts E should occur (P(E|H) is high), but E is absent, then the probability of H decreases (P(H|~E) < P(H)).  
     *Plausibility:* **True.** Basic Bayesian updating.  
     *Gets Researcher Conclusion?* **Partially.** A null result *lowers* the probability the drug works, but doesn't prove it does *nothing*. Requires prior belief and test sensitivity.  
     *Raven Link:* Failing to see a raven in your locked basement *is* weak evidence against ravens existing there, but trivial.

  2. **Test Sensitivity Claim**  
     *Claim:* Absence of evidence is evidence of absence **only if** the test had high sensitivity (i.e., was likely to detect the effect if it existed).  
     *Plausibility:* **True & Crucial.** A null result from an insensitive test (low power, poor measurement) is uninformative.  
     *Gets Researcher Conclusion?* **Conditionally.** If her trial was well-powered (e.g., 90% power to detect a clinically relevant effect), then ~E *is* meaningful evidence against H. If power was low, it isn't.  
     *Raven Link:* Using binoculars to scan Australia for ravens and finding none is stronger evidence than glancing out your window.

  3. **Strong Falsification Claim**  
     *Claim:* A single, perfectly sensitive test (P(~E|H) = 0) makes absence of evidence *conclusive* evidence of absence (Proof of ~H).  
     *Plausibility:* **Theoretically true, practically impossible.** Requires a test guaranteed to detect H if true (no false negatives).  
     *Gets Researcher Conclusion?* **No.** Clinical trials *always* have false-negative risk (β > 0). Biology is noisy; no test is perfect.  
     *Raven Link:* If you had a perfect "raven detector" scanning the whole Earth, no detection would prove no ravens. But no such detector exists.

  4. **Equivalence Claim**  
     *Claim:* Absence of evidence **is always** evidence of absence (i.e., ~E directly supports ~H, regardless of context).  
     *Plausibility:* **False.** Fails if the test was insensitive or if E wasn't expected under H.  
     *Gets Researcher Conclusion?* **No.** This overclaiming is what the commenter rightly rejects. Example: A telescope not detecting aliens isn't evidence aliens don't exist if it can't see distant planets.  
     *Raven Link:* Not seeing a raven while looking in your fridge is *not* evidence ravens don't exist.

  5. **Causal Inference Claim (Researcher's Context)**  
     *Claim:* A large, well-controlled RCT (high power, low bias) with a null result provides strong evidence *against* a clinically relevant causal effect.  
     *Plausibility:* **True.** This is how null RCTs *should* be interpreted when optimally designed.  
     *Gets Researcher Conclusion?* **Yes, if her trial met these criteria.** It's evidence the drug's effect is *at least* smaller than the MDE the trial powered for. Not proof of *zero* effect, but proof of *no meaningful* effect.  
     *Raven Link:* Rigorously searching all known raven habitats with high detection probability and finding none *is* strong evidence ravens are extinct.

  ---

  ### Checklist for Your Draft: Key Questions to Ask
  1. **Was evidence reasonably expected?**  
     (If the trial couldn't detect small effects, ~E isn't evidence against them.)
  2. **How sensitive was the test?**  
     (Power analysis: Could it detect the effect size of interest with high probability?)
  3. **What was the prior plausibility?**  
     (A null result shifts belief more for weakly supported hypotheses.)
  4. **Are there alternative explanations for ~E?**  
     (Bias, measurement error, confounding? Raven Paradox: "Not seeing ravens" could mean they're hiding, not absent.)
  5. **Does absence prove ineffectiveness or just lack of evidence?**  
     (Distinguish: "No evidence of effect" vs. "Evidence of no *meaningful* effect".)
  6. **Was the search targeted?**  
     (Not finding ravens *in Antarctica* isn't evidence about global raven populations.)

  ---

  ### Bottom Line for the Researcher
  - **She's likely correct** *if* her trial had high power to detect a clinically meaningful effect, was well-controlled, and she claims "no meaningful effect" rather than "zero effect."  
  - **The commenter is correct** that "absence of evidence ≠ evidence of absence" is a necessary caution against overinterpreting underpowered or flawed studies, but it's not an absolute rule.  
  - **Raven Paradox Takeaway:** Evidence depends on the *total evidence base* and auxiliary assumptions. A null RCT is strong evidence against efficacy *in the studied context/population*, just as finding a white shoe *is* (weakly) evidence against "all ravens are black."

  Use this framework to move beyond slogans and interrogate *why* a specific absence of evidence might (or might not) support a conclusion of absence.
