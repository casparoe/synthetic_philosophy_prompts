answer: |-
  ## Adversarial Collaboration: Expressivism, Realism, and the Frege-Geach Problem

  **Co-authored by [Expressivist Representative] and [Realist Representative]**
  **Chaired by [Professional Metaethicist]**
  **Date: [Date]**

  **1. The Problem, as both parties state it:** Both parties agree that moral vocabulary exhibits distinctive linguistic behavior: moral terms like 'wrong' or 'good' appear not only in straightforward assertions (e.g., "Stealing is wrong") but also within complex, unasserted contexts such as negations ("Stealing isn't wrong"), disjunctions ("Either stealing is wrong or lying is permissible"), conditionals ("If stealing is wrong, then deceiving to steal is wrong"), questions ("Is stealing wrong?"), and as premises in logically valid arguments (e.g., Geach's modus ponens: "If tormenting the cat is bad, then getting your brother to do it is bad. Tormenting the cat is bad. Therefore, getting your brother to do it is bad."). The core problem is that any adequate semantic account of moral language must explain this pervasive embedding behavior systematically. Crucially, it must explain the *validity* of arguments employing moral vocabulary in embedded contexts – such as Geach's – without simply stipulating it, and must do so in a way that compositionally integrates the meanings of moral terms with the meanings of logical operators and descriptive vocabulary. The expressivist faces the challenge of explaining how their core semantic posit (e.g., expressed attitudes or plans) can feature in these complex, unasserted contexts while preserving logical properties like validity. The realist faces the challenge of showing that their core semantic posit (e.g., truth-apt beliefs representing moral properties) genuinely explains the phenomenon rather than merely labeling it.

  **2. Agreed Claims:**
  Both parties accept the following:
      1.  **The Phenomenon:** Moral vocabulary embeds systematically within negation, disjunction, conditionals, questions, and other complex constructions. Arguments like Geach's modus ponens example using moral premises are intuitively valid, and competent speakers recognize this validity based on the meaning of the terms and logical structure.
      2.  **Compositionality Requirement:** Any successful semantic account must provide a compositional theory explaining how the meaning of complex sentences containing moral vocabulary (including mixed moral/descriptive compounds like "Either stealing is wrong or the safe is unlocked") is determined by the meanings of their parts and their mode of combination. This explanation must cover both asserted and unasserted contexts.
      3.  **Validity Explanation:** Explaining the validity of arguments like Geach's requires more than noting speakers' dispositions to accept the conclusion given the premises. An adequate account must identify what *makes* such arguments valid – what semantic or logical property is preserved from premises to conclusion.
      4.  **Expressivist Achievements (Partially Recognized):** Quasi-realist expressivism, utilizing tools like attitude consistency conditions (e.g., for negation: rejecting the attitude expressed by 'P' is inconsistent with accepting it) and planning-state semantics (treating normative judgments as plan-laden states), provides a systematic, compositional framework capable of assigning semantic values to moral terms that integrate with logical operators. This framework can formally model the validity of many core inferences involving embedded moral claims, including Geach's modus ponens, by defining validity in terms of the preservation of attitude-consistency or plan-consistency across all possible descriptive circumstances.
      5.  **Deflationism's Role:** Both parties accept a deflationary (or minimalist) theory of truth: the primary function of the truth predicate is as a device for semantic ascent and endorsement ("'Stealing is wrong' is true" is equivalent to "Stealing is wrong"). Within this framework, moral sentences can be called 'true' without metaphysical inflation. Expressivists utilize this to mimic realist-sounding discourse ("It's true that stealing is wrong" expresses disapproval of stealing). Realists accept that deflationism applies to moral discourse but argue it leaves deeper semantic questions unanswered.
      6.  **Realist Recognition:** Realists concede that expressivist machinery achieves a significant degree of formal adequacy. It demonstrably *models* the embedding behavior and logical inferences in a way that is not obviously incoherent or ad hoc. The expressivist project successfully shows how a non-representational starting point *can* generate systematic semantic behavior resembling that of representational discourse.

  **3. Where we still disagree:**

  | Disagreement Stated Expressivist-Fairly                                                                 | Disagreement Stated Realist-Fairly                                                                                                                               |
  | :------------------------------------------------------------------------------------------------------ | :-------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **1. Nature of the Semantics:** The expressivist account, grounded in the consistency conditions of non-cognitive attitudes or plan states, provides a genuine *alternative* conceptual and explanatory foundation for validity and compositionality, distinct from truth-conditional semantics. It explains logical relations directly in terms of what states of mind are mutually consistent or inconsistent, not derivatively via representations of truth-apt propositions. | **1. Nature of the Semantics:** The expressivist's sophisticated machinery for modeling validity and compositionality, while formally impressive, ultimately functions as a *notational variant* or complex implementation of a truth-conditional semantics. The attitude-consistency conditions effectively define a surrogate truth-conditional structure for moral sentences, mimicking representational content without genuinely providing a distinct explanatory basis. |
  | **2. Deflationism's Sufficiency:** Deflationism about truth fully satisfies the legitimate demands placed on the concept of 'truth' within moral discourse. The expressivist account, combined with deflationism, captures *everything substantive* that realists invoke truth for – logical embedding, validity, warranted assertibility, and the expressive function of truth-talk. There is no explanatory 'gap' requiring a representational semantics. | **2. Deflationism's Insufficiency:** While deflationism correctly characterizes the *use* of the truth predicate, it does not render the underlying semantic differences moot. The expressivist's reliance on deflationism masks a crucial explanatory deficit: their account lacks a *representational* explanation for *why* the attitude-consistency patterns hold and *what* the moral sentences are fundamentally *about*, which is needed for a full explanation of compositionality and reference in mixed contexts. |
  | **3. Explanatory Primacy:** The fundamental explanation for the validity of Geach's argument lies in the inconsistency of simultaneously accepting the premises' expressed attitudes (or plan-states) while rejecting the conclusion's. Representational properties, if invoked, are derivative or superfluous. | **3. Explanatory Primacy:** The fundamental explanation for the validity of Geach's argument lies in the preservation of *truth* from premises to conclusion. The expressivist's consistency conditions are best understood as tracking the preservation of this representational property, not replacing it. The representational content provides the primary ground for logical relations. |

  **4. Cruxes, and what each side predicts:**

  1.  **Crux: Mixed Disjunction Behavior.** Consider the sentence: "Either stealing is wrong or the cat is on the mat." Both parties agree that a speaker sincerely asserting this sentence must either accept that stealing is wrong or accept that the cat is on the mat. **Crux:** Can the expressivist's semantics (e.g., in terms of planning states or attitude combinations) provide a *principled, non-ad-hoc* account of the state of mind expressed by this disjunction that explains why the speaker *must* be in one of those two states? Does the explanation genuinely arise from the compositional interaction of the moral term's core function (expressing a planning state/attitude) and the disjunction operator, or does it tacitly rely on mapping the disjuncts onto truth-evaluable propositions first?
      *   **Expressivist Prediction:** Yes. Expressivism can define the state expressed by the disjunction as a state that rules out the conjunction of rejecting both disjuncts. For the moral disjunct, "rejecting" is defined as inconsistency with the core attitude (e.g., tolerating stealing). For the descriptive disjunct, rejecting is inconsistency with the belief that the cat is on the mat. The requirement to accept one disjunct follows compositionally from the consistency constraints defined for the attitude-states involved and the disjunction operator. This is principled and distinct.
      *   **Realist Prediction:** No, not genuinely distinct. While expressivism can formally *stipulate* a state that mimics the required behavior, this stipulation works *only because* the underlying descriptive belief has representational content, and the expressivist is forced to treat the moral component *as if* it had representational content (a surrogate proposition) to make the disjunction operator work compositionally in a uniform way. The explanation covertly relies on truth-conditional structure. If pressed to explain *why* the combined state has this consistency profile without appeal to truth-conditions, the expressivist account becomes circular or ad-hoc.
      *   **Settling Force:** If a principled, non-representational compositional account proves robust and generalizable across all mixed embeddings, it strongly favors expressivism. If the account consistently relies on surrogates for truth-conditions or fails for novel complex embeddings, it favors realism.

  2.  **Crux: Validity in Novel Conditional Promises.** Consider a novel conditional involving a promise: "If eating meat is permissible, then I promise to eat meat." Assume the speaker sincerely makes this utterance. **Crux:** Is the argument "If eating meat is permissible, then I promise to eat meat. Eating meat is permissible. Therefore, I promise to eat meat." valid? If so, *why*? Can the expressivist explain this validity purely in terms of the consistency of the planning states/attitudes expressed?
      *   **Expressivist Prediction:** Yes. The conditional expresses a complex planning state: a commitment to (plan to) make the promise *if* one comes to accept the permissibility of eating meat. The second premise expresses acceptance of that permissibility. To accept both premises but reject the conclusion (deny making the promise) involves an inconsistency in the speaker's overall planning state – they are committed to making the promise under the condition they now accept, yet deny making it. Validity is explained by preservation of plan consistency.
      *   **Realist Prediction:** The argument's validity (if valid) depends crucially on the *sincerity conditions* of promising and the *representational content* of the antecedent. "I promise..." conventionally represents the speaker's undertaking of an obligation. The conditional represents a relationship between the truth of the antecedent and the undertaking of that obligation. Valid inference requires preservation of truth. The expressivist's "plan consistency" explanation either mischaracterizes the nature of the promise (reducing its undertaking to a plan) or relies implicitly on the representational content of the antecedent and the conventional representation involved in promising. A pure plan-consistency account struggles to capture the specific normative force of the promise in the conclusion distinct from mere inconsistency.
      *   **Settling Force:** If expressivism provides a clean, unified account of validity for such novel normative conditionals using only its core machinery (attitudes, plans, consistency), it significantly bolsters its claim to offer a genuine alternative. If the account falters, requires unmotivated additions, or fails to capture the specific normative force, it favors the realist claim that representational content is fundamental.

  3.  **Crux: The "Why?" of Consistency Patterns.** Both sides agree that expressivism can define consistency relations between states of mind (attitudes, plans) that formally mirror logical relations between sentences. **Crux:** Does the expressivist have a deeper explanation for *why* these specific consistency relations hold for moral vocabulary beyond mere stipulation to match logical intuitions? Is there a constitutive connection between the *nature* of the attitude expressed (e.g., disapproval) and its formal inferential role, or is the mapping arbitrary?
      *   **Expressivist Prediction:** Yes. The consistency relations are constitutive of the *type* of attitude expressed. Disapproval (or a plan to avoid) just *is* the kind of state that stands in specific inferential/compositional relations to other states (e.g., its negation is tolerance). These relations are part of what makes it disapproval *of that thing* within our normative practice. There's no deeper "why" needed beyond the functional role of the attitude-type in our psychology and language.
      *   **Realist Prediction:** No. While the expressivist can stipulate functional roles, the realist contends that the *reason* disapproval plays *this specific* logical/inferential role, particularly in complex embeddings and mixed contexts, is because disapproval is (or involves) a belief *about* a property (wrongness) that has specific relations to other properties (e.g., the property of being commanded by a brother). The consistency patterns track the representational content of the underlying belief. Without this representational anchor, the functional role assignment appears arbitrary and lacks explanatory depth for *why* moral vocabulary embeds exactly as it does rather than differently.
      *   **Settling Force:** If compelling independent grounds (e.g., from psychology, conceptual role semantics, evolutionary theory) can be given for why core normative attitudes *must* have the specific inferential profiles expressivism assigns them, it favors expressivism. If the profiles seem contingent and best explained by tracking independent representational content, it favors realism.

  **5. What is left, and what is verbal:** Both parties agree the core disagreement is substantive, not merely verbal. The expressivist genuinely offers a non-representational starting point and explanation, while the realist genuinely seeks a representational explanation. The debate hinges on the *explanatory primacy and fundamentality* of representational content versus the functional role of non-cognitive states in accounting for the compositional semantics and logic of moral discourse. Neither side believes the other's position is "insulated by construction," though each argues the other faces significant explanatory burdens. Both agree that progress depends on developments in two areas: (1) The ability of expressivist semantics to provide principled, non-ad-hoc compositional treatments for increasingly complex and novel embedding phenomena, especially involving mixed vocabulary and diverse speech acts (like promises), demonstrating genuine explanatory depth beyond mimicking truth-conditions. (2) Advances in the philosophy of language and mind concerning the nature of representation, propositional content, and the relationship between functional role and truth-conditional semantics more broadly. A breakthrough showing that complex compositional semantics *necessarily* requires representational content, or conversely, that it can be fully grounded in non-representational functional roles, would decisively move the debate. Until such developments, the disagreement persists over the best fundamental account of the semantics.
