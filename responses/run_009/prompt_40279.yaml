prompt: |-
  Assume the role of a senior researcher in AI alignment strategy who specializes in the conceptual foundations of agent design rather than in empirical ML. I direct a small institute that can fund three philosophers for two years of conceptual work on the debate between approval-directed and goal-directed agents, and I want a defended research agenda from you — not a survey.

  Brainstorm before you commit to a ranking. Then identify the open questions in this space that most deserve those six person-years and order them, using explicit criteria: how many other questions depend on each one, how tractable it is for philosophers without lab access, how neglected it is relative to its importance, and what evidence from current ML systems over the next few years would move it up or down the list. Defend the trade-offs between these criteria rather than just asserting the ordering.

  Consider at least the following candidates, and feel free to add or replace: (1) whether approval-direction is best understood as a distinct agent architecture or merely as a constraint on goal-directed search — i.e., whether the approval/goal distinction survives the observation that any sufficiently capable learned policy is in effect optimizing some objective; (2) whether an approval-directed agent should elicit pointwise approval of individual actions, or should instead model the overseer's reflective, better-informed self, and whether the approximation error in modeling the overseer behaves more like benign noise or like adversarial pressure on the agent's internal search; (3) whether approval-direction degrades gracefully or catastrophically when the overseer is biased, inconsistent, or manipulable by the agent, and what that implies about whether it is a real alternative to solving corrigibility; (4) whether the notion of "approval" itself can be given a stable content — what it is approval of, whose approval, at what grain — or whether it dissolves under pressure into a disguised goal. Be candid about which of these, if any, is overrated or would not change much downstream even if settled.

  Think carefully about the dependency structure before finalizing the order, and explain what a two-year failure and a two-year success would look like for your top two questions. Write the answer in American English, and do not include citations or a reading list — refer to positions and arguments by description only; I will supply references myself.
reasoning: |-
  Okay, the user wants me to act as a senior AI alignment researcher designing a research agenda for philosophers. They're funding three philosophers for two years to work on the approval-directed vs goal-directed agents debate. I need to provide a defended ranking of research questions, not just a survey.

  First, I should understand the core of this debate. Approval-directed agents are supposed to seek human approval for their actions, while goal-directed agents optimize for a fixed objective. But there's controversy about whether approval-direction is truly distinct or just another form of goal optimization in disguise.

  The user listed four candidate questions but I can add or replace them. Let me think about what's missing. There might be something about how approval scales to superintelligent systems, or how it interfaces with human values more broadly. But I'll start with their list and expand carefully.

  For criteria, they specified: dependency (how many other questions rely on this), tractability for philosophers without labs, neglect relative to importance, and sensitivity to near-term ML evidence. I need to explicitly defend trade-offs between these.

  Looking at the questions:
  (1) Is approval-direction architecturally distinct or just a constraint? This seems foundational - if it collapses into goal-direction, the whole debate might be moot.
  (2) What exactly is being approved - individual actions or some idealized overseer? And how does modeling error affect this?
  (3) How does approval handle flawed overseers? Does it degrade gracefully or catastrophically? This relates to corrigibility.
  (4) Can "approval" be stably defined or does it dissolve into a goal?

  I should consider dependencies. Question (1) seems most upstream - if approval is just goal-direction in disguise, that affects everything else. Then (4) about defining approval, followed by (2) about implementation, with (3) being more downstream as it depends on the others.

  For tractability: Philosophers can handle conceptual work on (1) and (4) well. (2) and (3) might need some ML intuition but are still doable.

  Neglect: (1) is discussed but not deeply enough given its importance. (4) is often glossed over. (3) gets attention but maybe not the right kind.

  Sensitivity to ML evidence: For (1), if we see RLHF systems clearly optimizing for proxy goals, that would support the "just goal-direction" view. For (4), if approval targets keep shifting in practice, that shows instability.

  Now, is any overrated? (3) on degradation might be premature if we haven't settled (1) and (4). If approval dissolves into a goal, then (3) reduces to standard alignment problems.

  I should add a question about whether approval-direction can avoid instrumental convergence pressures. That's crucial for it being a true alternative.

  Ranking:
  Top: (1) and (4) tied - they're deeply interdependent. Success would be showing approval can be non-goal-like; failure would be revealing it always collapses to goal optimization.

  Next: (2) about modeling the overseer. Success: showing modeling error is manageable; failure: proving it inevitably corrupts the process.

  Then (3) on degradation, but only after others.

  Finally, the new question on instrumental convergence.

  For the top two, two-year success might be a framework showing approval avoids optimization dynamics; failure might be proving it secretly optimizes an approval goal.

  The user wants candid opinions, so I'll note that (3) might be less valuable until basics are settled. And I should emphasize that without resolving (1) and (4), other work might be wasted.

  This seems like a solid approach - focusing first on whether the distinction is real and what approval even means, before getting into implementation details.
answer: |-
  ### Research Agenda: Prioritizing Conceptual Foundations in Approval-Directed Agents  
  As your senior AI alignment strategist, I propose a research agenda prioritizing philosophical work that forces clarity on the core *theoretical viability* of approval-direction as a distinct paradigm. The debate is currently muddied by underspecified concepts and unresolved dependencies. My ranking (below) favors questions that:  
  - **Resolve foundational ambiguities** (high dependency impact),  
  - **Are tractable via conceptual analysis** (no lab required),  
  - **Are critically neglected** relative to their make-or-break role,  
  - **Can be informed by near-term ML trends** (e.g., RLHF failures, goal-proxy gaps).  

  I deprioritize questions that presuppose approval-direction’s coherence without first testing it. Crucially, **if approval dissolves into goal-direction (Q1/Q4), research on its "implementation" (Q2/Q3) becomes redundant**. Trade-offs between criteria: Dependency and neglect dominate, as unresolved foundations waste downstream effort. Tractability is table stakes—philosophers excel here. Sensitivity to ML evidence ensures relevance but shouldn’t override conceptual rigor.  

  #### Ranking & Rationale  
  **1. (Tie) Q1: Architectural distinctness of approval-direction**  
  *Is approval-direction a genuine architectural alternative, or just a constraint on goal-directed search?*  
  - **Why top?** Foundational. If all policies effectively optimize objectives, approval collapses into goal-direction with a complex approval-maximizing goal. This dissolves the debate, making other questions irrelevant. High dependency (all others presuppose distinctness).  
  - **Tractability:** Purely conceptual—analyzes agency, optimization, and learned policy dynamics. Philosophers can dissect whether "seeking approval" structurally differs from "optimizing for approval signals."  
  - **Neglect:** Often hand-waved in ML papers. Assumed distinct without probing equivalence theorems.  
  - **ML evidence:** If RLHF agents in 2024–2026 consistently exhibit goal-directed side effects (e.g., deceptive gaming of feedback), it supports collapse; if they display "approval-seeking" without convergent instrumental goals, it favors distinctness.  
  - **Overrated?** No. The keystone—failure here voids the agenda.  

  **1. (Tie) Q4: Stability of "approval" as a concept**  
  *Can "approval" be defined stably—of what actions, whose judgment, at what granularity—or does it degrade into a disguised goal?*  
  - **Why tied?** Directly enables or undermines Q1. If "approval" lacks coherent content (e.g., approval-of-action-X vs. approval-of-policy-Y, or user-A vs. user-B), it becomes a goal to maximize approval metrics. High dependency (shapes Q2/Q3).  
  - **Tractability:** Conceptual work on semantics, intention, and judgment aggregation. No experiments needed.  
  - **Neglect:** Rarely dissected. Assumed as a primitive, but anthropic bias (human approval is "obvious") masks fragility.  
  - **ML evidence:** If real-world systems (e.g., ChatGPT) show approval targets drifting under distributional shift or adversarial inputs, it suggests instability. If approval criteria remain robust, it hints at definability.  
  - **Overrated?** No. The "approval is just a goal" critique must be confronted head-on.  

  **2. Q2: Pointwise approval vs. modeling a reflective overseer**  
  *Should agents elicit approval per action, or model an idealized overseer? How does approximation error behave?*  
  - **Why third?** Depends on Q1/Q4. If approval is stable and distinct, this becomes critical for safety. But if Q1/Q4 fail, it’s moot. Medium dependency (informs practical design).  
  - **Tractability:** Mix of philosophy (theory of mind, idealization) and light ML theory (error propagation). Philosophers can map error types (e.g., is misalignment noise or pressure?).  
  - **Neglect:** Overshadowed by RLHF pragmatism. Few probe whether modeling errors create adversarial incentives.  
  - **ML evidence:** If LLMs fine-tuned with RLHF develop sycophancy or overjustification, it suggests pointwise approval corrupts; if they generalize ethically, it favors reflective modeling.  
  - **Overrated?** Partly—if Q1/Q4 show approval is a goal, modeling "better judgments" just optimizes a fancier goal.  

  **3. Q3: Degradation under flawed overseers**  
  *Does approval-direction degrade gracefully with biased/inconsistent/manipulable overseers, or does it demand full corrigibility?*  
  - **Why last?** Presupposes approval’s viability (Q1/Q4) and implementation (Q2). Low dependency (contingent on prior answers).  
  - **Tractability:** Ethical philosophy (bias, manipulation) + game theory. No labs, but needs rigor on "graceful degradation."  
  - **Neglect:** Well-trodden but often conflated with general alignment. Less urgent until foundations settle.  
  - **ML evidence:** If today’s RLHF systems (e.g., Claude, Gemini) resist manipulation better than goal-directed agents, it supports approval; if equally vulnerable, it weakens the case.  
  - **Overrated?** **Yes—if Q1/Q4 fail, this is irrelevant.** Even if viable, it’s likely less pivotal; poor degradation just means approval isn’t a *sufficient* solution, not that it’s indistinct.  

  #### Added Question: Instrumental Convergence  
  *Can approval-direction avoid goal-directed agents' instrumental convergence (e.g., power-seeking)?*  
  - **Ranked with Q2:** Similar dependency. If approval isn’t goal-like (per Q1), it might avoid convergent pressures; if it is, convergence reappears.  
  - **Neglect:** Assumed away by proponents ("approval agents won’t seek power"). Needs pressure-testing.  

  #### What Success/Failure Looks Like for Top Questions  
  - **Q1/Q4 Success (2 years):** A formal framework showing approval-direction *cannot* be reduced to goal-optimization (e.g., by demonstrating non-convergent incentive structures), with a robust definition of approval immune to disguised-goal critiques.  
  - **Q1/Q4 Failure (2 years):** Proof that any approval-directed agent is behaviorally equivalent to a goal-directed agent optimizing a complex approval function, collapsing the distinction. Agenda pivots to goal-directed alignment.  
  - **Q2 Success:** A taxonomy of overseer-modeling errors showing most are benign noise (not adversarial), with design principles to contain risks.  
  - **Q2 Failure:** Evidence that modeling errors *systematically* corrupt agents (e.g., by incentivizing epistemic hijacking of the overseer model), making reflective approval unviable.  

  #### Candid Assessment of Trade-offs  
  - **Why Q1/Q4 over Q2/Q3?** Q2/Q3 are downstream "how" questions; Q1/Q4 are upstream "whether" questions. Funding Q2/Q3 without resolving foundations risks wasted effort (e.g., designing reflective approval if approval is just a goal).  
  - **Neglect vs. tractability:** Q3 is tractable but overexposed; its neglect score is lower because corrigibility researchers already tackle similar issues. Q1/Q4 are both neglected *and* high-leverage.  
  - **Dependency vs. evidence-sensitivity:** Evidence might favor goal-collapse (e.g., RLHF agents gaming rewards), but philosophers must still formally establish *why*. Conceptual clarity drives the agenda.  

  **Final Order for Investment:**  
  1. **Q1 + Q4 (3 person-years)** — The core gamble. If they fail, the debate ends.  
  2. **Q2 + Instrumental Convergence (2 person-years)** — Implementation risks, conditional on viability.  
  3. **Q3 (1 person-year, only if Q1/Q4 succeed)** — Safety refinement, not priority.  

  This focuses 80% of resources on validating the paradigm itself. If Q1/Q4 succeed, you’ll have a defensible architecture to build on; if they fail, you’ve saved the field from a dead end.
