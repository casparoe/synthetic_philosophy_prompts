prompt: |-
  Quick question about a case that just landed on our academic conduct committee and has split us roughly in half, and since you know the philosophy literature better than anyone I can ask before Thursday, I want your help drafting the memo I'll circulate.

  The situation: a student (call her J.) has a documented memory-related disability; her accomodation letter permits recording lectures. What she's been doing is feeding those recordings, plus her own notes, into an app on her phone, and during our closed-book, on-paper exams she queries it. Her defense, roughly, is that for her the app IS her memory of the course material — she says she genuinely "knows" the content in the sense that matters, it just lives in the app rather than in her head, and the disability office backs her up. The professor who caught her filed it as unauthorized materials, plain cheating. Half my committee treats the phone like a smuggled cheat sheet; the other half says punishing her for consulting it is basically requiring her to have a specific kind of brain before we'll credit her as knowing anything.

  Please draft the decision memo — a concrete, implementable recommendation, not a philosophy lecture. If you recommend allowing it, say under what conditions (a designated device, a single vetted app, proctoring, whatever you actually think would work); if you recommend upholding the cheating finding, say what we tell the disability office. Either way I need the strongest argument on the losing side treated honestly, not strawmanned, since both factions will read this looking for blood.

  Last thing: so I can tally votes quickly, end the memo with the final recommendation in a fixed form — a last line exactly like Verdict: followed by one of allow without conditions, allow with conditions, or uphold the cheating finding.
reasoning: |-
  Okay, the user is dealing with a tricky academic conduct case involving a student with a memory disability who used an app during exams. They need a balanced memo draft that addresses both sides fairly while providing a concrete recommendation. 

  First, I need to understand the core tension: is the app a legitimate memory extension or an unfair advantage? The disability office supports the student, but the professor sees it as cheating. The committee is split, so the memo must validate both perspectives without strawmanning.

  Hmm... the philosophical angle is fascinating. Externalism in epistemology suggests knowledge can reside in tools we're integrated with, like Otto's notebook in Clark & Chalmere's extended mind theory. But the academic integrity concern is real - exams traditionally test internal recall. 

  For the recommendation, allowing unconditionally seems risky because the app's scope isn't limited to lecture content. Maybe "allow with conditions" is the pragmatic middle path? That satisfies the disability accommodation while adding safeguards: a dedicated device, vetted app that only contains approved materials (lecture recordings + her notes), and live proctoring to monitor queries. 

  The losing side's argument needs steelmanning. The "cheating" faction rightly points out that real-time queries could enable looking up anything, not just memorized content. Their position isn't ableist - it's about protecting assessment integrity. 

  For implementation, I'll suggest specific conditions: university-provided tablet, pre-loaded content only, proctor oversight. The "allow" faction might grumble about restrictions, but this balances both concerns. 

  Final verdict line will be crystal clear: "Verdict: allow with conditions". User needs that for quick vote tallying. 

  Better avoid philosophical jargon in the memo though - user wants actionable recommendations, not a lecture. Save the epistemology references for backup if committee members ask.
answer: |-
  **MEMORANDUM**  
  To: Academic Conduct Committee  
  From: [Your Name/Position]  
  Subject: Recommendation re: J.’s Accommodation Use During Exam  
  Date: [Current Date]  

  ### Case Summary  
  Student J. has a documented memory-related disability. Her accommodation letter permits lecture recording. During closed-book exams, J. used a phone app containing processed recordings and personal notes, arguing the app functions as her externalized memory. The professor reported this as unauthorized material use (cheating). The Disability Office supports J.’s position that the app is integral to her ability to demonstrate knowledge.  

  ### Key Arguments  

  **1. Position Supporting J. (Allow App Use):**  
     - J.’s disability impairs biological memory; the app is a functionally equivalent cognitive extension, sanctioned by accommodations policy.  
     - Denying its use effectively nullifies her accommodation, imposing a discriminatory standard that equates "knowledge" solely with unaided recall.  
     - Disability Office verification confirms the app’s necessity for equitable assessment.  

  **2. Position Upholding Cheating Finding (Disallow App Use):**  
     - Exams assess *independent* mastery under controlled conditions. Real-time querying of external data sources—regardless of origin—contradicts the "closed-book" requirement.  
     - The app’s potential to access non-course material or perform uncited analysis (e.g., AI summarization) creates an unmonitorable advantage beyond accommodating memory deficits.  
     - Accommodations should facilitate demonstration of *the student’s* knowledge, not outsource cognition to technology.  

  ### Recommendation & Implementation Plan  
  **Verdict: Allow with conditions**  

  **Conditions for App Use:**  
  1. **Dedicated Device**: J. uses a university-supplied tablet (no internet/cellular capabilities) during exams.  
  2. **Pre-Approved Content Only**:  
     - The app must contain **solely** vetted course materials:  
       - Official lecture recordings (no third-party/online content).  
       - J.’s personal notes (submitted 48h pre-exam for instructor review).  
     - No generative AI features, search functions, or external data connections permitted.  
  3. **Proctoring Protocol**:  
     - Live proctor observes J.’s screen during the exam to ensure queries relate *directly* to pre-loaded content.  
     - All app activity logged for post-exam audit if challenged.  
  4. **Semesterly Review**: J. and the instructor meet pre-semester to re-verify content and app functionality for each course.  

  ### Rationale  
  - **Accommodation Integrity**: This respects J.’s disability by allowing her to access "memorized" material stored externally, per medical guidance, while aligning with academic goals.  
  - **Assessment Integrity**: Conditions prevent broader information access, ensuring the exam tests comprehension of *course-specific* material J. engaged with.  
  - **Steelman of Losing Position**: The committee acknowledges valid concerns that unrestricted device use could compromise exam security. The conditions above directly address these by eliminating connectivity, vetting content, and enforcing real-time monitoring.  

  ### Guidance for Disability Office  
  We recommend collaborating to formalize a protocol for "cognitive assistive technology" in exams, including:  
  - Standardized vetting of apps/device features.  
  - Clear documentation requirements for "extended memory" accommodations.  
  - Faculty training on implementing such accommodations without compromising assessment validity.  

  ---  
  **Verdict: allow with conditions**
