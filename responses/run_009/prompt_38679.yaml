prompt: |-
  I'm a PhD student in political theory writing a chapter on scholastic theories of resistance, and I keep circling a problem in Aquinas's De Regno (On Kingship, addressed to the king of Cyprus) that I'd like your help thinking through. The treatise runs on an analogy: the political community is like a living body. Aquinas argues that just as a body would disintegrate unless some general ruling force within it watched over the common good of all the members, so a multitude of people, each pursuing his own interest, would scatter unless something impelled them toward the common good; the king, correspondingly, is identified with the heart, the first principle of life and motion, from which the members receive what they need to function, and the bees with their single ruler are trotted out as nature's own testimony that one head is best. The analogy is doing serious work: it establishes monarchy as the natural regime, and it installs the premise that each part exists for the good of the whole rather than conversely.

  The trouble arises in the later discussion of whether one may proceed against tyrants. There Aquinas gestures at the opposite analogy, inherited from Augustine's City of God, according to which a kingdom without justice differs from a robber-band mainly in scale — and indeed he notes that the Hebrews who killed their oppressors, Ehud dispatching Eglon and Jael driving the tent-peg through Sisera, are praised in Scripture. On the robber-band picture, tyrannicide looks like self-defense against a highwayman writ large. Yet Aquinas's verdict is cautious: private persons should not presume to kill the tyrant, because proceeding against his cruelty belongs to public authority, because the killing of tyrants has historically been followed by many worse ones, and because where no human remedy avails one should have recourse to God. In the Summa's treatment of sedition, meanwhile, he says that disturbing a tyrannical government is not seditious at all, since such government is not directed to the common good — apparently the tyrant himself is the seditious one. My advisor thinks the body analogy is quietly carrying all of these conclusions, and that once you notice where it breaks, the caution about private tyrannicide loses its support. I suspect the analogy is doing less work than she claims, but I can't yet show it.

  So: audit the analogy for me. First, give the mapping explicitly — kingdom to body, king to heart, citizens and artisans to members, civic unity and peace to health, tyranny to disease, deposition to the removal of a diseased part — and then say where the mapping breaks. Which disanalogies actually matter for the tyrannicide question (body parts can't judge, deliberate, or consent; they have no claim against the whole; a body cannot misdiagnose itself, has no succession problem, and no one else can perform surgery on it) and which are idle? Second, tell me whether Aquinas's practical verdict — that public deposition can be licit while private tyrannicide is not — is generated by the body analogy, or by prudential considerations (scandal, usurpation of public authority, the empirical record of worse successors) that would survive the analogy's collapse. Third, explain how the robber-band comparison is supposed to fit alongside the body comparison: is the tyrant a diseased organ of the body politic or an external predator on it, and does Aquinas need one picture for the question of legitimacy and the other for the question of remedy? And finally, if neither analogy can carry the weight, propose a better one for his considered position.
reasoning: |-
  Okay, let me approach this PhD student's query methodically. The core tension revolves around Aquinas's use of two competing analogies - the body politic and the robber band - in his theory of tyrannicide. 

  First, I need to map the body analogy precisely as Aquinas uses it in De Regno: 
  - Kingdom = living organism
  - King = heart (life-source/command center)
  - Citizens = bodily members
  - Common good = health
  - Tyranny = disease
  - Deposition = surgical removal

  The student's advisor believes this analogy secretly underpins Aquinas's cautious stance against private tyrannicide. But the student suspects other factors are at play. I should test both views by examining where the analogy strains under political realities.

  Key disanalogies that affect tyrannicide doctrine:
  - Bodies lack agency: Members can't judge/deliberate like citizens can
  - No claim of parts: Bodily parts exist solely for whole, but citizens retain rights
  - Self-diagnosis impossibility: A body can't misdiagnose itself, but political actors constantly do
  - No succession crisis: Surgery doesn't trigger power struggles like regicide does
  - External agency required: Only outside surgeons can operate, unlike political self-correction

  These disanalogies matter because they expose why private citizens acting as "surgeons" would be disastrous - but they don't inherently prohibit public authority from acting. The prudential cautions Aquinas lists (usurpation risk, worse successors) stand independently as secular arguments.

  Now the robber-band analogy from Augustine:
  - Tyrant as external predator
  - Resistance as self-defense
  - This justifies Ehud/Jael-type actions

  Aquinas uses these analogies for distinct purposes:
  - Body analogy establishes legitimacy (natural hierarchy)
  - Robber-band analogy establishes remedy (when authority becomes predation)

  Neither analogy fully captures Aquinas's nuanced position. A better hybrid might be a "covenanted body": 
  - Political community as organism formed by mutual pledge
  - Tyrant breaches covenant, becoming foreign threat
  - Public authorities as physicians bound by oath
  - Citizens retain defensive rights but not curative ones

  This preserves Aquinas's core distinction between public deposition and private killing while acknowledging the community's agency. The prudential arguments against vigilantism remain valid regardless of metaphor.

  The student might push further on whether Aquinas's "public authority" could include representative bodies - but that's beyond the original question. The key insight is that the body analogy's limitations reveal Aquinas's deeper concern for ordered process over metaphysical unity.
answer: |-
  Your analysis pinpoints a genuine tension in Aquinas's thought. Let's audit the body analogy systematically, then address your questions:

  ### 1. **Mapping the Analogy & Where it Breaks**
  **Explicit Mapping (De Regno):**
  - **Political Community** = Living Body  
  - **King** = Heart (primary life-source/organizing principle)  
  - **Citizens/Artisans** = Bodily Members (hands, feet, etc.)  
  - **Common Good** = Health/Vital Function  
  - **Tyranny** = Disease/Pathology (e.g., cancer)  
  - **Deposition** = Surgical Removal of Diseased Tissue  

  **Critical Disanalogies for Tyrannicide:**  
  The analogy fails precisely where political agency and moral judgment enter:  
  - **Agency & Deliberation**: Bodily parts lack reason, will, or capacity to judge the heart. Citizens *can* (and must) deliberate about the common good. The analogy obscures *who* diagnoses tyranny and *how*.  
  - **Moral Claims**: Body parts exist *wholly* for the whole. Citizens, per Aquinas’s natural law, retain inalienable rights (e.g., self-preservation). The analogy cannot ground a *right* of resistance.  
  - **Self-Correction**: A body cannot excise its own heart; surgery requires external agency. But political communities *must* correct tyranny internally. The analogy implies deposition is impossible without a "higher surgeon" (e.g., Pope/Emperor), which Aquinas avoids asserting.  
  - **Succession & Legitimacy**: Removing a heart kills the body; deposing a king need not destroy the polity if legitimate authority (e.g., nobles/people) acts. The analogy cannot handle constitutional succession.  

  **Idle Disanalogies**:  
  - "Parts receiving from the heart" mirrors citizens receiving justice from the king—but this doesn’t resolve the tyrant problem.  
  - "Bees having one ruler" illustrates monarchy’s naturalness but doesn’t address its corruption.  

  ### 2. **Does the Analogy Generate Aquinas’s Verdict?**  
  **No—prudential and theological considerations dominate:**  
  - **Usurpation of Authority**: Private tyrannicide violates the natural order by bypassing constituted procedures (Summa II-II Q.42 A.2; Q.64 A.3). This reflects Aquinas’s hierarchy of law, not biology.  
  - **Empirical Prudence**: History shows tyrannicide often leads to worse tyranny (De Regno I.6). This is political observation, not organic logic.  
  - **Divine Remedy**: Where human justice fails, God may act (De Regno I.6). This is theological, not biological.  
  - **Sedition Doctrine**: A tyrant is "seditious" against the common good (Summa II-II Q.42 A.2), making resistance *defensive*. This relies on justice, not physiology.  

  The body analogy *frames* monarchy as natural but cannot resolve tyranny’s paradox: the "heart" turning pathological. Prudential arguments stand without it.

  ### 3. **Robber-Band vs. Body: How the Analogies Coexist**  
  Aquinas uses these analogies for distinct purposes:  
  - **Body Analogy**: Establishes *legitimacy* and *structure* of just rule (teleological unity).  
  - **Robber-Band Analogy**: Diagnoses *illegitimacy* (failure of justice).  

  **The Tyrant’s Dual Nature**:  
  - As a **diseased heart**, the tyrant is *internal* to the body politic—corrupting its natural function.  
  - As a **robber-chief**, the tyrant is *externally parasitic*—ruling by force, not for the common good.  

  **Why Both?**  
  - **Legitimacy Question**: The body analogy shows why monarchy is *prima facie* natural.  
  - **Remedy Question**: The robber-band analogy justifies resistance by denying the tyrant’s moral authority. It frames tyranny as *foreign domination*, making resistance self-defense.  

  Aquinas needs both: the body explains why monarchy is normative; the robber-band explains why resistance isn’t *always* sedition. The tension arises because the diseased heart *is* still the heart—hence his caution about private removal.

  ### 4. **A Better Analogy: The Covenanted Body**  
  Neither analogy fully captures Aquinas’s position. A hybrid model better reconciles his principles:  
  - **The Polity as a Covenanted Body**: A living organism bound by *mutual oath* (cf. medieval corporation theory).  
  - **The Ruler as Physician-Steward**: Appointed to heal/sustain the body, with authority conditional on serving its health.  
  - **Tyranny as Physician-Turned-Poisoner**: A steward who breaches the covenant, becoming a pathogen.  
  - **Remedy as Corporal Surgery**: Conducted by the body’s "lawful hands" (e.g., nobles, representatives) under natural law.  

  **Why this works:**  
  - Preserves monarchy’s naturalness while making authority conditional.  
  - Explains deposition: The steward’s breach returns power to the covenanted community.  
  - Distinguishes public/private acts: "Surgery" requires authorized agents (public authority), not vigilantes.  
  - Accommodates divine action: When no human agent exists, God intervenes as "Creator-Physician."  

  This aligns with Aquinas’s underlying principles:  
  - Natural law justifies resistance when rulers violate the common good (*Summa* I-II Q.96 A.4).  
  - Authority is for the community’s sake (*De Regno* I.9).  
  - The "people" (or their representatives) hold latent authority to correct tyranny (*Summa* I-II Q.90 A.3; II-II Q.104 A.6).  

  ### Conclusion
  Your advisor is right that the body analogy *informs* Aquinas’s caution but wrong that it *determines* it. Its breakdown reveals the limits of organicism for political agency. Aquinas’s resistance theory ultimately rests on:  
  1. **Natural Law**: Tyranny voids authority by violating justice.  
  2. **Procedural Justice**: Public authority must act to avoid anarchy.  
  3. **Theological Pragmatism**: God’s providence as ultimate backstop.  

  The covenanted body analogy better synthesizes these elements, showing why Aquinas *permits* public deposition (as corporate self-healing) but *forbids* private tyrannicide (as violation of the body’s covenanted order). The tension persists because Aquinas prioritizes order over revolution—yet his logic implies that a tyrant, by severing the bond of justice, severs his own claim to obedience.
