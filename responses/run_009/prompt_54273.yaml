  Hmm, the user is a policy analyst at an international development agency dealing with projects that affect future generations' existence. They're struggling with ethics reviews because their current guidance doesn't handle the nonidentity problem well. They remember Parfit's work and want a practical decision procedure that non-philosophers can use on a Friday afternoon.

  I need to create a usable tool that addresses the nonidentity problem without requiring philosophy expertise. The core challenge is that when policies change who comes into existence, we can't say the resulting people are "harmed" since their alternative was nonexistence. The user wants clear steps: a screen for identity-affecting decisions, questions that work despite no identifiable victims, exit points for value judgments, and awareness of failure modes.

  For the philosophical groundwork: person-affecting views (harm requires a victim) collapse here - that's the problem. Impersonal views (e.g., total utilitarianism adding happy lives as good) work but are controversial. Ex ante approaches (asking what people behind a veil of ignorance would choose) are promising for policy. "No wrong without wronged party" must be abandoned - that's key.

  The procedure must avoid rabbit holes: only flag projects likely to significantly alter conception timing/composition. Rough threshold: >10% cohort replacement or major social reshuffling? Admit it's crude but necessary.

  Key questions should include: 1) Baseline check: would future lives be worth living in both scenarios? (If no, red flag). 2) Ex ante perspective: which option would rational choosers pick? 3) Robustness: does it meet minimum standards for whoever exists? 4) Asymmetric consideration: is it creating lives barely worth living while making existing people worse off? (Avoids "mere addition paradox").

  Critical exit points: when we need to decide whether adding happy people is a benefit (total vs. average utilitarianism), or when comparing futures with different population sizes. Flag these as value choices for the board.

  Failure modes: The procedure might okay creating miserable lives if they're still "worth living" (need baseline check first). Or reject necessary sacrifices for future generations if harms are certain but benefits probabilistic (needs ex ante balancing).

  Now for cases: 
  - Village resettlement: Predictable marriage reshuffling → identity-affecting. Harsh conditions but above subsistence. Ex ante: people would likely choose relocation over flood deaths. Robustness test passed. Probably approve.
  - Lithium mine: Local ecological damage now vs climate benefits later. Not clearly identity-affecting (no cohort reshuffling). Screen says apply standard harm analysis. If harm is certain and local while benefits are diffuse/delayed, might flag distributive justice concerns - but that's intentional.
  - Maternal health program: Changes family size/composition. Identity-affecting. Tricky part: if it leads to smaller, richer population, total utilitarians see fewer lives as loss, average utilitarians as gain. Must exit to board for this value choice. This might frustrate them but correctly exposes the debate.

  The maternal health case is where the board might dislike the outcome - but that's the procedure working, not breaking. It forces confrontation of the population ethics dilemma they've been avoiding.

  Structure matters: Put the identity-affecting screen early to avoid overcomplicating routine projects. Baseline check before ex ante to prevent justifying miserable lives. Save population size questions for last with clear exit points.

  Keep language concrete: "Would you rationally choose this for your child's generation?" not "Consider the veil of ignorance." Use headings, numbered steps, and separate case studies. No jargon - describe "person-affecting" as "harm needs a victim" if mentioned at all.

  User's hidden need: They suspect their board is arbitrary because they lack tools for these paradoxes. The procedure's real value is making implicit debates explicit - especially in the maternal health case where neutrality is impossible.
answer: |-
  ## Ethics Review Supplement: Identity-Affecting Projects  
  *For decisions that may change who exists in future generations*

  **One-Paragraph Briefing for Reviewers:**  
  Some projects change which people are born (e.g., by altering when/where people conceive). This creates a paradox: people who exist *because* of the project can’t claim they were "harmed" by it—their alternative was never existing. Our standard harm-assessment doesn’t apply. This procedure helps navigate that dilemma using three ethical "tools": (1) checking if future lives meet a minimum threshold, (2) asking what people would choose *before* knowing their identity, and (3) ensuring no one gets a life below an acceptable standard. It flags where we must make a value judgment.

  ---

  ### Decision Procedure: Identity-Affecting Impacts  

  #### Step 0: Initial Screen (Is this identity-affecting?)  
  *Apply this to EVERY project. Answer YES if:*  
  - **Project directly reshapes community structure** (e.g., resettlement, mass migration, creating/removing towns)  
  - **Project significantly alters birth timing/rates** (e.g., reproductive health programs, economic shocks altering family size decisions)  
  - **Project disrupts social networks critical to family formation** (e.g., severing inter-village ties, closing schools)  
  *Threshold: Likely to alter >10% of the next generation’s composition.*  
  ⚠️ **Crudeness Note:** This is a heuristic. Small demographic nudges (e.g., a 1% fertility change) aren’t covered. When uncertain, proceed to Step 1—but most projects screen out here.  

  → **If NO:** Use standard ethics guidance (harm to existing/future identifiable people).  
  → **If YES:** Proceed to Step 1.  

  ---

  #### Step 1: Baseline Worthwhile-Life Check  
  *"Could future people in BOTH scenarios (with/without the project) have lives worth living?"*  
  - Define "worth living": *"A life this agency wouldn’t condemn as worse than non-existence"* (e.g., not constant agony, extreme deprivation). Use local subsistence + dignity benchmarks.  
  - **If NO in EITHER scenario → RED FLAG:** Stop. Project may create or fail to prevent miserable lives. Recommend rejection or redesign.  
  - **If YES in BOTH → Proceed to Step 2.**  

  #### Step 2: Ex Ante Choice Test  
  *"If people in the affected community could choose between futures BEFORE knowing who would be born, which would they rationally pick?"*  
  - Consider: Safety, health, opportunity, stability. Would reasonable people see this as a net improvement?  
  - **If CLEAR preference for one option → Leans toward that option.**  
  - **If AMBIGUOUS/SPLIT → Proceed to Step 3.**  
  - **If NO DATA on preferences → Use expert/local input on expected welfare. Flag uncertainty.**  

  #### Step 3: Robustness Scan  
  *"Does the project ensure that—REGARDLESS of who ends up existing—no one is left below a minimum acceptable standard?"*  
  - Define "minimum standard": *"Core needs met (food, water, security, healthcare) + non-exploitation."*  
  - **If YES → Project is ethically permissible.**  
  - **If NO → Leans toward rejection/redesign.**  

  #### Step 4: Asymmetry Check (Critical Exit Point!)  
  *"Does the project create new lives that are barely worth living, while making things worse for existing people?"*  
  - **If YES → ⚠️ HAND TO BOARD.** This invokes the "Non-Identity Paradox" directly. Example: A dam displaces current residents (harming them) and creates a new town where lives are poor but "worth living." Philosophers disagree on whether this is wrong. Board must decide if avoiding harm to existing people outweighs adding new lives.  

  #### Step 5: Population Size Handling (Critical Exit Point!)  
  *"Does the project significantly increase or decrease the TOTAL number of future people?"*  
  - **If YES → ⚠️ HAND TO BOARD.** You’ve hit a core population ethics debate:  
    - *Total View*: More happy lives = better.  
    - *Average View*: Higher average welfare = better.  
    - *Other Views*: E.g., rights-based thresholds.  
    *Example:* A maternal health program leading to fewer but wealthier families. Board must choose which metric to prioritize.  

  ---

  ### Failure Modes & Distrust Signals  
  - **"Worth living" is too low:** If reviewers set the Step 1 threshold at "bare biological survival," the procedure may approve creating deeply deprived lives. *Solution:* Anchor to agency values (e.g., "Would we condemn this life as intolerable?").  
  - **Ex Ante ignores power imbalances:** Step 2 may favor elites’ preferences. *Solution:* Require inclusive consultation data.  
  - **Ignores non-human interests:** Ecological harms (e.g., the mine) get screened out in Step 0. *Solution:* Ensure environmental ethics are covered elsewhere.  
  - **Mechanical use justifies atrocities:** E.g., "Slavery is fine if slaves’ lives are ‘worth living’ and they wouldn’t exist otherwise." *Distrust if:* Baseline dignity (Step 1/Step 3) is violated.  

  ---

  ### Worked Cases  

  #### Case 1: Resettling Flood-Prone Village  
  - **Step 0:** YES (reshapes community, alters marriage pools).  
  - **Step 1:** New site is harsh but above subsistence? YES (both scenarios).  
  - **Step 2:** *Ex ante*, would villagers choose relocation over flood risk? LIKELY YES (safety gain).  
  - **Step 3:** New site meets minimum standards (water, security)? ASSUME YES.  
  - **Step 4/5:** No asymmetry or major population change.  
  → **OUTCOME: Permissible.** Harshness is regrettable but not a showstopper.  

  #### Case 2: Lithium Mine (Local Damage, Enables Decarbonization)  
  - **Step 0:** NO (assumes no major resettlement/fertility impact).  
  → **OUTCOME:** Use standard guidance. Harms (ecological damage) and benefits (climate mitigation) affect existing/future identifiable people. Distribute costs fairly; ensure compensation. *Note:* If mine displaces people, revisit Step 0.  

  #### Case 3: Maternal Health Program (Changes Family Size/Composition)  
  - **Step 0:** YES (alters birth timing/rates significantly).  
  - **Step 1:** Lives in both scenarios "worth living"? YES.  
  - **Step 2:** *Ex ante*, likely preference for health program (reduces maternal death).  
  - **Step 3:** Minimum standards met? YES (healthcare improves).  
  - **Step 4:** No asymmetry.  
  - **Step 5:** ⚠️ YES (likely reduces total population). → **HAND TO BOARD.**  
    - *Controversy:* Is a smaller, wealthier population better (average view) or worse (total view) than a larger, poorer one?  
    - **Procedure Outcome:** Board must decide. This may frustrate reviewers who favor the program, but the procedure is *working*—it exposes a genuine, insoluble values conflict.  

  ---

  ### Final Notes  
  - **Time Estimate:** 45-60 mins with prepared project summaries.  
  - **When to Override:** If the outcome feels deeply wrong, check for Failure Modes (e.g., "worth living" mis-calibrated).  
  - **Strength:** Forces explicit discussion of hidden dilemmas. Weakness: Cannot resolve fundamental philosophical splits (Steps 4-5).  
  - **Output:** For HAND TO BOARD cases, specify the exact conflict (e.g., "Board must choose between Total and Average welfare principles").  

  This won’t make hard choices easy—but it makes the *nature* of the choice legible. Most projects clear Step 2 cleanly; the rest reveal where ethics is about values, not calculation.
