prompt: |-
  Been arguing with my partner about Dennett. His whole line, roughly: conciousness is a user illusion, like the desktop your computer shows you — the icons and folders aren't what's physically going on inside the machine, they're a simplifying interface that lets you get stuff done, and nothing more. On his picture the stream of experience is the brain's equivalent interface, and there's no further fact about what it's like that the interface is leaving out. My partner puts maybe 0.7 on that being basically right, I put maybe 0.3. Give me your own credence that the Dennett-style picture is correct, but decompose it — something like: p(the hard problem is a confusion rather than a genuine puzzle), p(experience can be fully accounted for by the brain's discriminative and self-monitoring capacities, given no hard problem), p(the interface story can explain the specific texture of experience, not just its usefulness), plus any other terms you think belong, each with a number and one line of justification, then the combination. After that tell me which term you're least confident in and what evidence or argument would shift it most, and whether you think the gap between our 0.3 and 0.7 lives in one of these terms or somewhere the decomposition doesn't capture.
