prompt: |-
  You're a professional philosopher working in moral psychology, and I want you to think carefully with me, ideally brainstorming out loud a bit before you settle on an answer. I'm trying to work out what my actual view is on standing to blame, by listing my gut verdicts on cases and seeing if any principle captures them. Case one: my friend who smokes a pack a day tells me I'm an idiot for vaping and really lays into me about it. Verdict: he doesn't have standing, his blame just bounces off, it's pure hypocrisy. Case two: my other friend quit vaping two years ago after a decade of it, and now tells me off for vaping. Verdict: she totally has standing, in fact her blame lands harder. Case three: a friend who has never touched nicotine in her life lectures me about it. Verdict: she has standing too, no problem at all. Case four: the friend who literally bought me my first vape as a birthday gift now blames me for being hooked. Verdict: no standing, but it feels different from the smoker case — less like hypocrisy, more like she's implicated in the thing itself. Case five: my dad blames me for always flaking on plans, and he is a legendary flaker himself, has stood me up more times than I can count. Verdict: honestly, I think he DOES have standing, and I can't fully explain why, given how firm I am about the smoker. Case six: a stranger at a bus stop overhears me on the phone lying to someone and tells me I'm a bad person. Verdict: no standing, none of your business, even though lying is clearly worse than vaping and I don't dispute he's right about the content.

  So here's what I want. Is there one principle that gets all six verdicts, or close to it? The obvious first pass — you lose standing iff you're guilty of the same thing — handles the smoker, the never-smoker, and maybe the gift-giver if we stretch "same thing," but it goes wrong on the ex-vaper (same thing, standing intact) and, if I'm honest, on my dad. Maybe the distinction is doing-it-now vs. did-it-and-repented, or something about whether your blame is part of a shared practice of holding each other to standards (which is maybe why dad gets standing and the bus stranger doesn't, and why hypocrisy stings most when it's hidden?). But I can't get that to also explain why the gift-giver loses standing, since she's clearly part of the practice and isn't a hypocrite. Please state the best candidate principle or small set of candidates precisely, say which verdicts motivate which clauses, and tell me straight which of my verdicts the best principle simply cannot save — I suspect it's dad. Then apply it to a case I haven't decided: my friend who flies constantly for leisure blames me for eating meat because of the climate impact. Does he have standing? My gut flips back and forth on that one, so I'd genuinely like to know what the principle says and whether my flip-flopping is a sign the principle is wrong or just that I'm being defensive. Also, take seriously the possibility that standing doesn't come in one currency — that "hypocrisy" and "complicity" and "meddling" remove standing in different ways — and tell me if that pluralism is a real position in the literature or just a way of dodging the question.
