  ### **How the Quiz Maps to Theories**  
  - **Mencius**: Innate goodness that needs cultivation (e.g., 1a, 4a, 6a, 7c).  
  - **Hard Xunzi**: Active tendency toward badness; requires correction (e.g., 3a, 5b, 6b, 7a).  
  - **Soft Xunzi**: Neutral raw material; society shapes it (e.g., 2b, 3b, 6c, 7a).  
  - **Gaozi**: Neutrality, like water/channeling or willow/carving (e.g., 2b, 3b, 6c, 8b).  
  - **Naive Optimist**: Innate goodness needs little structure (e.g., 1c, 4c, 5a, 8c).  

  **Flagged Limitation**: Soft Xunzi and Gaozi both map to neutral options (e.g., 3b, 6c, 7a, 8b). The quiz can’t split them reliably—they’re grouped as "Neutral" in scoring.  

