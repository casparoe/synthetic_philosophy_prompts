  Here's a complete, runnable activity designed to make statistical pitfalls visceral and engaging. It uses physical props (coins, dice), runs in 90-100 minutes, and includes contingencies for common issues.

  ---

  ### **Activity Structure: "The Replication Game"**
  **Total Time:** 90-100 min (Intro: 10 min, Game: 60 min, Debrief: 20 min)  
  **Materials:** 
  - Laptop with [Random.org](https://www.random.org/) (or physical coins/dice)
  - 2 dice (1 fair, 1 biased—see below)
  - Fake money (e.g., poker chips, paper bills)
  - Prize (e.g., "I ❤️ p-Hacking" mug)

  ---

  ### **Step 1: Introduction (10 min)**
  - **Set the stage:**  
    *"We’re testing whether coins/dice are 'lucky' (biased toward heads/6). We’ll run fake studies, bet on whether a 'significant finding' (p<0.05) will replicate, and see who wins the most fake cash."*
  - **Explain p-value simply:**  
    *"If a coin is fair, p<0.05 means there’s <5% chance we’d see a result this extreme by luck alone."*
  - **Betting rules:**  
    - Everyone starts with $100 fake money.  
    - Each round: Bet $0-$20 on **REPLICATE** (yes, next run is significant) or **FAIL** (no).  
    - Win: Double your bet. Lose: Lose the bet.  
    - *Optional:* 3 "statistical consultants" can advise the group (assign roles to engaged participants).

  ---

  ### **Step 2: The Game (60 min, 5 Rounds)**
  **Key:**  
  - 🪙 = Fair coin (50% heads)  
  - ⚖️ = Biased die (see below)  
  - ⏱️ = Stopping rule (collect data until significant)  
  - 📁 = File drawer (only show 1 "winning" study from many)  

  | Round | "Study" Description                          | How to Run Live                                                                 | Rigged Insight                            |
  |-------|---------------------------------------------|---------------------------------------------------------------------------------|-------------------------------------------|
  | 1     | 📁 **File Drawer (Fair Coin)**              | Random.org/coins (or flip fair coin 20x). Only show IF significant (≥15 heads). | Base rate neglect                         |
  | 2     | 📁 **File Drawer (Fair Die)**               | Roll fair die 20x. Only show IF significant (≥8 sixes).                         | File drawer problem                       |
  | 3     | ⏱️ **Stopping Rule (Fair Coin)**           | Flip fair coin LIVE until heads lead ≥6 (e.g., 8H/2T). Stop, declare "significant". | Stopping rule inflates false positives |
  | 4     | ⏱️📁 **Combo: Stopping + File Drawer**    | Use pre-run stopping rule study (fair coin).                                    | "p-hacking" in action                     |
  | 5     | ⚖️ **Biased Die (Real Effect)**            | Roll biased die 20x (rigged to land 6 50% of the time).                         | Real effects *can* replicate              |

  **How to run props:**  
  - **Biased die hack:** Use a standard die. Call "6" a success. Add sticky tack to the 1-5 faces to weight it toward 6 (~50% 6s). Test beforehand.  
  - **Stopping rule:** For Round 3, flip live until heads lead by ≥6 (e.g., 7H/1T, 10H/4T). [Probability ≈100% to stop by 30 flips].  
  - **File drawer:** Pre-run 50 tests (Random.org or quick rolls). For Rounds 1/2, only reveal the 1-2 "significant" results.  

  **Betting Flow per Round:**  
  1. Announce study type (e.g., "Coin flips showed 15/20 heads! p=0.02").  
  2. Participants bet on REPLICATE/FAIL.  
  3. **Rerun live:** Repeat the *exact same test* (same coin/die, same # flips/rolls).  
  4. Pay out: Replication is "success" if *new* run hits p<0.05 (e.g., ≥15 heads in 20 flips).  

  ---

  ### **Step 3: Predicted Issues & Fixes**
  | Issue                          | Mitigation                                                                 |
  |--------------------------------|----------------------------------------------------------------------------|
  | "Stats nerd" spoils reveal     | Assign them as "consultant"—they advise but can’t bet.                     |
  | Half bet randomly, half freeze | Encourage small bets ($5). Use consultants to model reasoning.             |
  | Biased die fails to replicate  | Use high bias (50% 6s). If fails, highlight "real effects aren’t magic!"  |
  | Time crunch on flips/rolls     | Use Random.org for quick batches. Physical props only for key rounds.      |
  | Stopping rule takes too long   | Cap at 30 flips (99% hit threshold by then). Use pre-run data as backup.   |

  ---

  ### **Step 4: Debrief (20 min)**
  **Guide the conversation:**  
  1. **Base rate neglect:**  
     - *"In Rounds 1-4, most 'significant' findings didn’t replicate. Why?"*  
     - Key: When testing nonsense (fair coins), 95% of findings *should* be null—but 5% false positives arise by chance. With file drawers, you *only* see false positives.  

  2. **Stopping rules:**  
     - *"In Round 3, we stopped when data 'looked good.' Did that change the meaning of p<0.05?"*  
     - Key: **p-values depend on how you collected data.** Same data ⇒ different p-value if you peeked. Frequentists require fixed sample sizes; Bayesians argue likelihood is identical.  

  3. **What the game *can’t* show:**  
     - Real science is messier (small effects, noisy data).  
     - p-hacking isn’t just stopping rules (e.g., cherry-picking variables, subgroups).  
     - Replication fails for other reasons (fraud, bad methods, context differences).  

  **End with:**  
  *"p<0.05 ≠ 95% chance it’s real. It depends on:  
  (1) **Base rate**—how many hypotheses are true?  
  (2) **Methods**—did you peek or hide data?  
  This is why replication and transparency matter."*  

  ---

  ### **Why This Works**
  - **Tactile learning:** Live flips/rolls make abstract concepts visceral.  
  - **Betting = engagement:** Forces participants to internalize uncertainty.  
  - **Rigged reveals:** Stopping rules/file drawers "break" p-values before their eyes.  
  - **Safe failure:** Biased die round shows real effects *can* work—no nihilism.  

  **Pre-run Tips:**  
  - Test biased die (aim for 45-55% "successes").  
  - Pre-simulate file drawer rounds to ensure 1-2 "hits" (fair coin: 20 flips, ≥15 heads ≈2.1% chance; fair die: 20 rolls, ≥8 sixes ≈3.3%).  
  - For stopping rule, simulate 1-2 sequences to confidence.  

  This turns "p<0.05" from a mantra into a punchline—while grounding skeptics in the math that matters.
