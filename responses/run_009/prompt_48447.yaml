answer: |-
  Below is a translation of epistemicism and supervaluationism into your measurement vocabulary, followed by a residue report and a verdict on your core question. I adhere strictly to your constraints: no smuggling of assumptions, no forced collapse into reporting conventions, and explicit acknowledgment where your framework's principles (like the existence of a true measurand) are invoked.

  ---

  ### **1. Translation into Measurement Vocabulary**  
  *(Without smuggling assumptions)*  

  **A. Epistemicism (Williamson):**  
  *Raw Claim:* "There is a specific grain count \( N \) at which adding one grain turns a non-heap into a heap. We cannot determine \( N \), but this ignorance is empirical (like failing to resolve a faint signal), not a flaw in the definition of 'heap'."  
  *Translation:*  
  Imagine defining "detection" of a contaminant as a signal exceeding a *fixed threshold* \( T \) (e.g., 3σ above baseline noise). \( T \) exists objectively due to underlying physical laws (e.g., quantum efficiency of the detector). However, your measurement system has **inherent limitations**:  
  - Noise obscures signals near \( T \).  
  - Replicate measurements yield results scattered around \( T \) (random error).  
  - Calibration drift introduces uncertainty about \( T \)'s exact value (systematic error).  
  Thus, for a true concentration \( C_T \), you cannot definitively say whether \( C_T \geq T \) or \( C_T < T \) when \( |C_T - T| \) is within your method's **limit of resolution** (LoR). This is *not* because \( T \) is fuzzy—it's because your tools cannot access it precisely.  
  **Crucial Caveat:** This translation *assumes* a true measurand \( T \) exists—which is central to your framework but *contested* in philosophy. Williamson insists \( T \) (e.g., the exact heap boundary) is *knowable in principle* (e.g., by a Laplace's Demon), whereas in measurement science, \( T \) may be *operationally undefined* below LoR.  

  **B. Supervaluationism:**  
  *Raw Claim:* "The word 'heap' admits multiple equally valid interpretations (precisifications), each assigning a different sharp threshold \( T_1, T_2, \ldots T_k \). No single \( T_i \) is 'the meaning' of 'heap'. Thus, borderline cases are *indeterminate*: no admissible precisification makes 'heap' true or false for them."  
  *Translation:*  
  Suppose you must report whether a sample "contains contaminant X" based on a signal. But:  
  - Regulatory agencies disagree on the **reporting threshold** \( R \): Lab A uses \( R_A \) (e.g., 2σ), Lab B uses \( R_B \) (e.g., 4σ).  
  - Both \( R_A \) and \( R_B \) are "valid" under different conventions (e.g., EPA vs. ISO standards).  
  - For a signal between \( R_A \) and \( R_B \):  
    - Lab A reports "detected" (true under \( R_A \)).  
    - Lab B reports "not detected" (true under \( R_B \)).  
    - Crucially, **no convention-independent fact** settles whether X is "truly present" in a semantic sense—only that it satisfies some conventions and not others.  
  - Thus, "X is present" for signals between \( R_A \) and \( R_B \) is **indeterminate**: true under some standards, false under others, with no "God's-eye" threshold to appeal to.  
  **Key Distinction:** This is *not* just about reporting pragmatics. It denies there is a *single true measurand* ("semantic presence of X") to be resolved. The indeterminacy is in the *definition itself*, not our ability to measure.  

  ---

  ### **2. Residue Report**  

  | **Category**              | **Epistemicism**                                                                 | **Supervaluationism**                                                                 |
  |---------------------------|----------------------------------------------------------------------------------|----------------------------------------------------------------------------------------|
  | **Translates Cleanly**    | - Ignorance due to measurement limits (noise, calibration drift).                | - Borderline cases as unresolved due to conflicting conventions.                      |
  |                           | - Distinction between measurand (true threshold) and measurement result.         | - No single privileged reporting standard.                                            |
  | **Translates with Distortion** | - Williamson's "sharp boundary" *requires* assuming a **true measurand \( T \)**. <br>- Distortion: Forces \( T \) to exist *even when operationally meaningless* (e.g., "heapness" as a physical constant). | - Super-truth (truth under all precisifications) maps to **consensus across conventions**. <br>- Distortion: Indeterminacy becomes mere *disagreement between labs*, not a lack of fact. |
  | **Cannot Be Said**        | - That \( T \) is *in principle knowable* (a core claim). Science accepts LoR as fundamental. | - **Truth-value gaps**: "Not true or false" has no equivalent. Lab results are always true/false *under their convention*. <br>- **Lack of factual basis**: The claim that "no precisification is what the term *means*" transcends operational definitions. |

  ---

  ### **3. Verdict on Your Question**  

  **Your instinct is partially correct but misses key philosophical substance:**  
  1. **Epistemicism ≠ True Value Acceptance:**  
     - Yes, scientists assume a measurand exists below LoR (e.g., a molecule is present or not).  
     - **But:** Williamson claims the *exact boundary is knowable in principle* (e.g., "Grain #5,214 *is* the heap-maker"). This is **not** scientific practice. Measurement science treats values below LoR as *operationally undefined*—not merely unknown. Your vocabulary *cannot express* "knowable but unresolvable" without distortion because *unresolvable = operationally undefined* at the bench.  

  2. **Supervaluationism ≠ Reporting Conventions:**  
     - Yes, it resembles conflicting standards (e.g., FDA vs. EMA detection limits).  
     - **But:** It makes a stronger claim: that even with perfect measurement, "heap" *has no semantic fact of the matter* in borderline cases. This **cannot be translated** because your framework presupposes a measurand (e.g., grain count) with a true value. The distortion collapses it into a debate about reporting, losing the *metaphysical indeterminacy*.  

  3. **The Sorites Inference is the Breaking Point:**  
     - In measurement science, adding one grain/atom is **not tolerance-preserving**:  
       - Random error dominates near thresholds, so small changes *can* flip results ("noise-driven transition").  
       - Systematic error (e.g., calibration drift) breaks the chain.  
     - The sorites assumes **perfectly reliable small steps** (e.g., "1 grain never matters"). This has **no equivalent** in your vocabulary. Error propagation *expects* chains to break; the sorites treats breakdown as paradoxical.  

  **Conclusion:**  
  - **Your vocabulary misses something:** It cannot express (1) *in-principle knowability* of sharp boundaries (epistemicism), or (2) *metaphysical indeterminacy* (supervaluationism). Both positions make claims beyond empirical resolution.  
  - **The debate is substantive:** Epistemicism insists vagueness is *ignorance of a fact*; supervaluationism insists it’s *absence of fact*. Your framework assumes the former (via true measurands), making epistemicism seem "obvious." But supervaluationism challenges that assumption at a semantic level—a move unavailable in measurement science.  
  - **To act on this:** When analyzing philosophical claims about vagueness, explicitly separate:  
    - *Operational definitions* (how we resolve/measure).  
    - *Metaphysical commitments* (whether a fact exists independently).  
    Your vocabulary excels at the former but cannot adjudicate the latter. The residue—especially the unspeakable "truth-value gaps" and "in-principle knowability"—reveals where philosophy demands tools beyond the bench.
