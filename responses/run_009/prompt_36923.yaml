answer: |-
  ### Hypocrisy & Standing to Blame: Game Design  
  **Game Title:** *Silent Shift*  
  **Duration:** 60-70 minutes (5 rounds + setup/debrief)  
  **Players:** 15-20  
  **Materials:**  
  - Public scoreboard (whiteboard/projected sheet) with columns: **Player ID**, **Points**, **Defection Count (D)**.  
  - Private decision slips (2 types per round):  
    - *Defection Slip*: "Round [X]: Defect? ⬜ Yes (+2 points, +1 D) ⬜ No"  
    - *Blame Slip*: "Round [X]: I blame Player [ID] ⬜" or "⬜ Pass"  
  - Pens, timer, player ID badges (e.g., numbers 1-20).  

  ---

  ### **Rules**  
  **Goal:** Maximize points. Points represent "social capital" (not real money).  
  **Setup:**  
  - Each player starts at **0 Points**, **0 D**.  
  - Assign unique IDs (e.g., Player 1 to 20).  

  **Round Structure (5 rounds, ~8 mins/round):**  
  1. **Defection Phase (1 min):**  
     - Players secretly choose **Defect** or **Cooperate** on slips.  
     - **Defect:** Gain **+2 points** and **+1 D** (publicly updated on scoreboard).  
     - **Cooperate:** No change.  
     - *GM collects slips, updates Points/D on board.*  

  2. **Blame Phase (2 mins):**  
     - Players anonymously submit **Blame Slips**. Options:  
       - Blame **one** other player (costs **-1 point**, regardless of outcome).  
       - **Pass** (no cost/action).  
     - *GM collects all slips.*  

  3. **Blame Resolution (5 mins):**  
     - For **each blame**:  
       - GM announces: *"Player [A] blames Player [B]."*  
       - **If B defected this round**:  
         - Penalty = **max(0, 3 - A's D)**  
         - B loses **penalty points**; A loses **1 point** (as cost).  
         - *GM: "B defected. A's D is [X], so penalty is [Y]. B -[Y], A -1."*  
       - **If B did NOT defect**:  
         - No penalty to B; A still loses **1 point**.  
         - *GM: "B did not defect. A -1 for false blame."*  
     - *GM updates Points on board.*  

  **Endgame:** Player with most points wins (small prize: e.g., "Rationality Champion" certificate).  

  ---

  ### **Payoff Scheme**  
  - **Defect:** High reward (+2) but high risk if blamed.  
  - **Blame:** Costs 1 point upfront. Penalty to blamed scales with **blamer's D**:  
    - D=0: Penalty = 3  
    - D=1: Penalty = 2  
    - D=2: Penalty = 1  
    - D≥3: Penalty = 0 (blame is useless)  
  - **Cooperate/Pass:** Safe but no gains.  

  ---

  ### **Predicted Dynamics**  
  - **Early Rounds:** Many defections + blames. High-D players can still impose penalties (e.g., D=1 → penalty=2).  
  - **Midgame (Rounds 3-4):**  
    - Most players have D≥1. Blaming costs points but penalties shrink.  
    - Rational play shifts to **silence** (blaming is point-waste if D≥3).  
    - Players feel the room "lock in": When a high-D player blames, group scoffs (*"You? Really?"*).  
  - **Endgame:** Defections rampant, blames rare. Players notice blame "fizzles" due to **accumulated D**, not the act itself.  

  **Ideal Outcome:**  
  - At least 1 player *may* stay clean (D=0) by cooperating always. Their blames land hardest (penalty=3).  
  - If no one stays clean, debrief uses hypothetical: *"What if someone had D=0?"*  

  ---

  ### **Debrief (20 mins)**  
  **Questions to Guide Discussion:**  
  1. *"How did the *feel* of blaming change from Round 1 to Round 5?"*  
     - Probe: Did high-D players hesitate to blame? Did their blames feel "hollow"?  
  2. *"When a high-D player blamed you, did you feel indignant? Why?"*  
  3. *"Did anyone notice *why* blame stopped working? Was it the last defection or the whole record?"*  
  4. *(If a clean player exists):* *"How did their blames land? Did you trust them more?"*  

  **Map to Concept:**  
  - **"You did it too" as TU QUOQUE FALLACY:**  
    - *Logically invalid:* "I defected, so your defection is okay" is flawed reasoning.  
  - **"You did it too" as LOSS OF STANDING:**  
    - *Psychologically real:* Your **accumulated record (D)** erodes credibility. Group dismisses you not because the *target* is innocent, but because *you* lack moral authority.  
  - **Key Insight:** Standing depends on **trustworthiness + relationship history**, not just facts. The game simulates how hypocrisy accumulates until blame becomes impotent.  

  ---

  ### **What Will Go Wrong (First Run)**  
  1. **Players Avoid Defecting:**  
     - *Why:* Guilt, fear of blame, or misaligned incentives.  
     - *Fix:* Stress *"Maximize points—defection is rational short-term"* in rules. Use competitive framing (e.g., "Winner gets bragging rights!").  
  2. **Blame Phase Overwhelms GM:**  
     - *Why:* 15-20 blames/round to process live.  
     - *Fix:* Use 2 assistants to tally. Pre-write announcements ("Player A→B: Defect? [Y/N], Penalty=X").  
  3. **High-D Players Still Blame:**  
     - *Why:* They forget penalty=0 at D≥3 or enjoy "performance" of blame.  
     - *Fix:* GM emphasizes *"Check the penalty formula on the board!"* during rounds.  

  ---

  ### **What the Game CANNOT Simulate**  
  **Standing Isn’t Just a Rap Sheet:**  
  In reality, standing blends:  
  - **Relationship:** A friend’s blame lands differently than a stranger’s.  
  - **Intent/Character:** If you defected for a "good reason," blame may retain weight.  
  - **Repentance:** Acknowledging past faults can restore standing.  
  - **Power Dynamics:** A boss’s blame matters more than a peer’s.  

  **Your Role:** Post-game, clarify:  
  > *"The game reduced standing to a number (D). Real standing is about perceived integrity and context. But notice: even with nuance, repeated hypocrisy *erodes* trust. The game makes you feel that erosion."*  

  ---

  ### **Why This Works**  
  - **No Lecture:** Players *experience* hypocrisy’s weight, don’t just hear it.  
  - **Graded Accumulation:** D forces players to confront their *own* role in collapsing norms.  
  - **"Clean Player" Organic:** Rules incentivize defection, but cooperation is possible. If one emerges, their blame’s impact highlights standing’s power.  
  - **Debrief Bridges Game ↔ Reality:** Uses gameplay to dissect tu quoque vs. standing.  

  **Adjust on the Fly:** Shorten rounds if blame processing lags. If defections lag, remind players: *"Points are fictional—exploit the system!"*
