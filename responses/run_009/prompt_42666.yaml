prompt: |-
  I handle grantmaking for a small effective-giving advisory that steers a few million dollars a year from roughly thirty major donors. Next month I have to present to our donor-advisory board the case for overhauling how we allocate: instead of our current practice of ranking charities directly by whatever cost-effectiveness numbers the charities themselves report, I want us to adopt a two-stage process — first a cause-level screen using importance, tractability, and neglectedness, and only then comparisons between interventions inside a cause that has passed the screen. The board is a specific group and I want to be prepared for them specifically, not for a generic audience: there's a development economist who spent a decade at a multilateral agency and believes retrospective evaluations of concrete programs are the only honest evidence there is; a physician who runs a community health nonprofit and privately thinks the identifiability and proximity of beneficiaries matter morally, not just the number helped; the family's longtime estate lawyer, who is our institutional memory and is suspicious of anything that arrives as a spreadsheet with a hidden agenda; and one donor's adult child, strongly EA-adjacent, who will want me to admit that a consistent application of the framework ranks existential-risk work above everything else, and that if I flinch from that conclusion the framework is being applied dishonestly.

  Draft my Q&A prep sheet. Give me the objections in roughly the order they will actually arrive, phrased in each person's own vocabulary, ordered by how much damage each one can do, each with what I should concede up front, a reply I can deliver in about two minutes, and an honest note on where the reply is soft. Please make sure the sheet covers at least these, since I already half-know they're coming: the endogeneity worry that causes are neglected *because* they are bad, and that tractability and neglectedness aren't independent axes at all but re-encodings of each other and of expected value, so the three-factor screen is just cost-effectiveness analysis with worse arithmetic; the demand that importance be commensurable across wildly different causes, which is the point where I least trust my own answer; the economist's preference for the charity-level numbers on the grounds that at least someone measured something; and the physician's objection that the framework launders moral choices about whose lives count into an apparently neutral bookkeeping exercise. Finally, include the question I am hoping nobody asks — I suspect the lawyer will ask it anyway — and tell me how to survive it.
reasoning: |-
  Hmm, the user is a grantmaker at an effective-giving advisory, preparing for a presentation to a diverse donor-advisory board. They want to shift from direct charity rankings to a two-stage cause prioritization framework using ITN (Importance, Tractability, Neglectedness). The board includes four distinct personalities: a development economist obsessed with concrete evaluations, a physician who values beneficiary proximity, a skeptical estate lawyer, and an EA-adjacent donor pushing for existential risk prioritization.

  The user needs a battle-tested Q&A prep sheet that anticipates specific objections in probable order of attack, with concessions, rebuttals, and vulnerability notes. Key concerns include: endogeneity of ITN factors (do causes suck because they're neglected or vice versa?), cross-cause commensurability struggles, the economist's preference for "measured something" data, and the physician's moral laundering accusation. They're also dreading a lawyer question they haven't specified.

  I'll structure this as escalating threats:
  First, the physician's moral objection will likely open fire - it's visceral and derails logic. Concede emotional truth but reframe ITN as exposing value judgments rather than hiding them. Soft spot: Doesn't resolve the identifiability tension.

  Next, the economist's demand for concrete numbers. Must validate their empiricism while showing how ITN handles uncertainty better than false precision. Soft spot: Won't satisfy someone who believes only RCTs are real evidence.

  Then the EA-adjacent trap about x-risk dominance. Preempt by admitting ITN could point there, but stress our comparative advantage in health/development. Soft spot: Feels evasive to consistent utilitarians.

  The lawyer's hidden-agenda spidey sense comes next. Focus on institutional risk management - the current system is more manipulable. Soft spot: Doesn't prove we aren't just swapping one bias for another.

  The nuclear option is the endogeneity math bomb from the economist. Acknowledge factor overlap but defend ITN's diagnostic power. Soft spot: The "worse arithmetic" charge has teeth.

  Finally, the cross-cause comparison dread question. Admit it's philosophically fraught and propose a practical "bins" approach. Survival depends on naming the uncertainty.

  The unspoken lawyer question is probably about personal liability or past failures - respond with procedural rigor and historical awareness. Key throughout: Name their values first, concede where right, and keep answers under 120 seconds.
answer: |-
  Here’s your Q&A prep sheet, tailored to your board’s personalities and ordered by damage potential (high to low). Each objection includes concession points, a concise reply, and honesty about soft spots. The "survival question" is at the end.

  ---

  ### **Q&A Prep Sheet: Two-Stage Allocation Framework**  
  **Core Shift:** Cause-level ITN screen → Intervention-level CE analysis within approved causes.  
  **Goal:** Preempt value clashes and false precision by separating moral prioritization (ITN) from operational efficiency (CEA).

  ---

  ### **1. The Physician’s Moral Laundering Objection**  
  *(Likely first: visceral, personal, derails logic with emotion)*  
  **Objection:** "This feels like washing our hands of real people. When I see a child with malaria, I *know* helping her matters. Your framework turns lives into abstract numbers and pretends it’s neutral math. Proximity matters—ignoring that is dishonest."  

  **Concede upfront:**  
  - "You’re right: identifiability *does* pull at us morally. Our current system obscures that tension; this framework forces us to confront it openly."  

  **2-Minute Reply:**  
  > "This framework doesn’t dismiss proximity—it *reveals* the trade-off. When we prioritize a cause via ITN (e.g., ‘Should we fund local clinics or pandemic preparedness?’), we’re making an explicit ethical choice: ‘How much do we value identifiable lives vs. statistical lives?’ That’s *more* honest than burying it in a spreadsheet. After that choice, we use CEA *within* the cause to honor every dollar. But step one forces us to own the moral judgment—not disguise it."  

  **Soft Spot:**  
  - Doesn’t resolve the identifiability debate; just makes it visible. May not satisfy someone who views proximity as non-negotiable.  

  ---

  ### **2. The Economist’s "Measured Something" Objection**  
  *(Early: technical credibility challenge)*  
  **Objection:** "Charity-level CEA has flaws, but at least it’s grounded in real data from actual programs. Your ITN metrics—‘importance,’ ‘tractability’—are speculative. Why replace hard evidence with armchair theory?"  

  **Concede upfront:**  
  - "Retrospective evaluations *are* essential. But they’re often inapplicable to novel or systemic problems—and they can’t tell us *which* programs deserve evaluation."  

  **2-Minute Reply:**  
  > "Our current approach assumes charities self-reporting CEA are comparable across causes. But is curing a child of parasites *really* commensurate with averting a future pandemic? ITN addresses this by first asking: ‘Is this cause *worth* investing in?’ using broader evidence (e.g., DALYs for importance, research gaps for neglectedness). Only *then* do we use program-level CEA—where your point is dead right: we demand rigorous evidence. This prevents false precision, like ranking a bednet charity against AI safety."  

  **Soft Spot:**  
  - ITN *does* involve judgment calls. Won’t convince someone who believes only RCTs constitute "evidence."  

  ---

  ### **3. EA-Adjacent Donor’s X-Risk Ultimatum**  
  *(Mid-debate: ideological litmus test)*  
  **Objection:** "If we apply ITN consistently, existential risks (e.g., AI, pandemics) dominate. They’re globally important, highly neglected, and tractable per dollar. If we *don’t* prioritize them, isn’t this framework performative?"  

  **Concede upfront:**  
  - "You’re correct: a pure ITN analysis *does* often point to x-risk. And we should allocate more there."  

  **2-Minute Reply:**  
  > "Our role is to balance consistency with donor agency. ITN helps us say: ‘X-risk clears the bar; it’s a valid priority.’ But our donors fund *this* advisory because they trust us to specialize in global health/development. Within that domain, we’ll use ITN to spotlight neglected high-impact causes (e.g., antibiotic resistance). For x-risk, we’ll: (1) Be transparent that ITN supports it, (2) Offer dedicated options for donors who want to pivot, and (3) Collaborate with x-risk experts—not pretend we’re qualified to evaluate them in-house."  

  **Soft Spot:**  
  - Sounds like hedging. Hardcore EAs will see this as compromising principles.  

  ---

  ### **4. Lawyer’s Hidden-Agenda Suspicion**  
  *(Late: corrosive institutional distrust)*  
  **Objection:** "This feels like a bait-and-switch. You’re replacing clear numbers with fuzzy ‘criteria’ only you can interpret. What’s the *real* goal? Shifting funds to your pet causes?"  

  **Concede upfront:**  
  - "Spreadsheets *can* mask bias. Our job is to reduce that risk—not amplify it."  

  **2-Minute Reply:**  
  > "Our current system is *more* manipulable: charities self-report metrics, and we compare apples to asteroids. ITN imposes structure: we’ll publish cause assessments using standardized sources (e.g., WHO for disease burden, R&D spending for neglectedness) *before* we see intervention data. You’ll review the criteria first—no surprises. This isn’t about my preferences; it’s about reducing reliance on charity-supplied numbers that, as [Economist] knows, often can’t be audited."  

  **Soft Spot:**  
  - Doesn’t eliminate subjectivity. Requires trust in advisors’ diligence.  

  ---

  ### **5. Economist’s Endogeneity Objection**  
  *(Technical knockout risk)*  
  **Objection:** "Tractability and neglectedness aren’t independent—they’re proxies for expected value. Causes are neglected *because* they’re intractable or unimportant. Splitting them just disguises that ITN is backdoor CEA with made-up weights."  

  **Concede upfront:**  
  - "You’re right: these factors correlate. And yes, ITN *is* a heuristic for expected value."  

  **2-Minute Reply:**  
  > "ITN isn’t a replacement for CEA—it’s a triage tool. Causes can be important *but* intractable (e.g., curing Alzheimer’s) or tractable *but* saturated (e.g., some vaccine programs). Separating them avoids false negatives: e.g., bednets were neglected *until* we realized they were tractable. We’ll use ITN qualitatively (High/Med/Low) to flag causes worth deeper CEA. It’s not arithmetic—it’s pattern-matching to avoid wasting time on dead ends."  

  **Soft Spot:**  
  - Heavily relies on expert judgment. Quant critics will see this as hand-waving.  

  ---

  ### **6. The Commensurability Nightmare**  
  *(The question you dread—likely from the Lawyer or Economist)*  
  **Objection:** "How do you compare ‘importance’ across causes? Is preventing a potential pandemic *really* X times more important than saving a child from malaria? Isn’t that just gut feeling?"  

  **Survival Strategy:**  
  **Concede aggressively:**  
  > "This is the hardest part. No universal currency exists. We’re not quantifying ‘moral weight.’"  

  **Reply:**  
  > "We’ll: (1) Use *domain-specific* metrics (e.g., DALYs for health, carbon reduction for climate); (2) For cross-cause, we define ‘importance’ as *scale of suffering* + *irreversibility*. A pandemic could cause 100M deaths; malaria causes 600K/year. Both matter—but one is acute and uncertain, the other chronic and certain. We’ll present donors with clear comparisons (e.g., ‘Cause A: large scale, low probability; Cause B: smaller scale, high certainty’)—then *they* choose the risk/scale trade-off. Our job is framing, not deciding."  

  **Honest Notes:**  
  - **Where it’s soft:** Still relies on contested value judgments. The physician will hate this.  
  - **How to survive:** Admit uncertainty. Say: "We’ll pilot this with 2–3 causes next year and refine it with you."  

  ---

  ### **The Survival Question: "What’s the REAL Risk?" (Lawyer)**  
  *(Likely the closer—cuts to institutional safety)*  
  **Objection:** "Suppose we adopt this. What happens when we fund a high-ITN cause that fails spectacularly? How do I explain to donors that we backed ‘neglected pandemic research’ over proven bednets, and it was a waste?"  

  **Reply:**  
  > "Three safeguards:  
  > 1. **No Blank Checks:** ITN only approves causes for *consideration*. We still demand evidence-backed interventions within them.  
  > 2. **Transparency:** We’ll document why a cause cleared ITN (e.g., ‘WHO R&D gap analysis showed 10x underfunding’). No jargon—just sources.  
  > 3. **Portfolio Approach:** We’ll balance high-risk/high-reward causes (e.g., x-risk) with proven ones (e.g., deworming). If one fails, the portfolio wins.  
  > ...But the bigger risk? *Not* evolving. Our current system can’t handle novel threats. This framework lets us adapt—responsibly."  

  **Why it works:**  
  - Appeals to lawyer’s risk-management role.  
  - Uses "portfolio" to soothe donors.  
  - Makes stagnation the villain.  

  ---  
  **Final Tip:** Open with, "We all want to avoid two traps: false precision and unexamined bias. This framework tackles both—but it’s a work in progress. I need your scars and skepticism to shape it." Disarm by embracing their identities.
