prompt: |-
  I teach a semi-intro philosophy of language course, and I'm building a unit on conditionals. The Oswald/Kennedy example has been done to death — my students have literally seen it in three seperate textbooks by now. Here's what I want instead: a fresh, one-paragraph scenario, set in ordinary life (workplace, family stuff, a trip, whatever — no trolleys, no sci-fi), where (a) the indicative conditional "If A, B" comes out clearly true/assertible, (b) the matching counterfactual "If A had happened, B would have" comes out clearly false, and crucially (c) the divergence must NOT lean on the antecedent being known-false like in the Kennedy case. I want an open antecedent — nobody in the scenario knows whether A — so the trick can't just be "we know not-A, so the material conditional is vacuously fine." The indicative's truth should come from epistemic reasoning that fails to track what would actually happen if A. No omniscient narrators, and no stipulating the verdicts: the case has to generate them from its own details.

  After the scenario, do the walkthrough. Run a Lewis-style similarity semantics on the counterfactual and a Stalnaker-style epistemic/restrictor treatment on the indicative, and show me the verdicts each one delivers and why. Then tell me which specific detail of the case is doing the work, and what happens to the pair of verdicts if I delete that detail — do the two conditionals snap back into agreement? Next, give the counterattack: how would someone who thinks indicatives are just material conditionals with Gricean or Jackson-style pragmatics layered on top explain the same data with a single semantics instead of two? And don't waffle on the ending: given your own case, which treatment do you actually think wins? Take a side and defend it, even if it costs you something elsewhere. If any part of the case quietly cheats — say, it sneaks in a known-false presupposition or the indicative's truth is really just a pragmatic effect rather than semantic — flag that honestly instead of hoping I won't notice.
reasoning: |-
  Okay, the user is teaching a philosophy of language course and wants a fresh example for conditionals that avoids the overused Oswald/Kennedy case. Let me unpack their requirements. They need a scenario where the indicative conditional is true, the counterfactual is false, and the antecedent isn't known to be false. No sci-fi or trolley problems—just everyday situations.

  First, I need to ensure the antecedent is open; nobody knows if A happened. The indicative's truth should come from epistemic reasoning, not actual causation. The counterfactual must clearly be false. Then, I have to explain using Lewis and Stalnaker's frameworks, identify the key detail causing the divergence, and show how removing it affects the conditionals. Also, address the material conditional defense and take a stance.

  Hmm, workplace scenarios might work well. Maybe something with a delayed report? Say, an employee who might have sent a report late. If the report is late, the boss will be angry—that seems assertible based on office norms. But if it had been late, would the boss actually be angry? Well, what if the boss was unexpectedly busy and didn't notice? That creates the divergence.

  Wait, the key detail here is the boss's unusual distraction. Normally, the boss would react, but this specific case has an exception. Without that distraction, both conditionals would align. That makes sense. Now, for the material conditional defense: they might argue that the indicative is true because assuming not-A (report on time) makes the conditional vacuously true, but Gricean implicatures handle the assertibility. However, that feels forced because the scenario doesn't have known falsehood. 

  I should check if the antecedent is truly open. The employees don't know if the report was late, so it's epistemically possible. The indicative is based on their knowledge of the boss's typical behavior, not on A's truth value. The counterfactual's falsity comes from the actual circumstances where the boss was distracted. 

  In the counterattack, the material conditional proponent might say the indicative is assertible due to reasonable belief, but the false counterfactual challenges this. If the indicative is just material, it should be true as long as the report wasn't late or the boss was angry. But here, the report was late, and the boss wasn't angry, so the material conditional is false. Yet the indicative was asserted truthfully. That contradiction means the material account fails here. 

  Stalnaker's approach handles the indicative by restricting to epistemic possibilities where the boss's normal behavior holds. Lewis's similarity semantics for counterfactuals considers close worlds where the report is late but the boss's distraction remains, so no anger. The key detail is the boss's unusual busyness. Removing that, the counterfactual becomes true, and the indicative remains true, aligning both. 

  I think Stalnaker and Lewis's dual approach wins because the material conditional can't explain the assertibility without the antecedent being false. The case shows the indicative's truth relies on epistemic norms, not truth conditions. So, I'll defend the two-track semantics. Need to make sure the example doesn't cheat—no presupposed falsehood. The antecedent's truth is unknown, and the actual late report with no anger supports the counterfactual's falsity. The indicative's assertibility is based on reasonable expectations, which is epistemic. That should satisfy the user's requirements.
answer: |-
  Here's a fresh case designed to your specifications, followed by the analysis:

  **The Case: The Missing Lunch Report**  
  Dana and Eli work in a busy office. Every Friday, Eli must email a lunch order summary to their boss, Maria, by 10:00 AM. Maria is notoriously impatient; if the summary is even 1 minute late, she sends an angry all-staff email. Today at 10:05 AM, Dana sees Maria walking calmly to a meeting, smiling. Dana checks her inbox – no angry email from Maria. Dana says to Eli: "Whew! **If the summary was late, Maria is furious.** Good thing it wasn't!" Unbeknownst to Dana or Eli, the summary *was* late (sent at 10:02 AM). However, Maria's CEO unexpectedly pulled her into a critical strategy session at 9:55 AM. She hasn't checked her email since 9:50 AM and remains completely unaware of the summary's status or timing. She is calm solely because she's engrossed in the high-stakes meeting.

  **Key Features:**  
  1.  **Open Antecedent (A):** "The summary was late." Dana & Eli *don't know* if it was late (A) or on time (~A).  
  2.  **Assertible Indicative (If A, B):** "If the summary was late, Maria is furious." Dana asserts this as clearly true based on Maria's known policy and the *absence* of the expected effect (B: furious email).  
  3.  **False Counterfactual (If A had happened, B would have):** "If the summary had been late, Maria would have been furious." This is false. In the actual world, A *is* true (late), but B is false (not furious) due to the unexpected meeting.  
  4.  **No Known Falsehood:** The divergence doesn't rely on knowing ~A. Dana asserts the indicative *without* knowing A is false (she thinks it might be true or false). The indicative's assertibility stems purely from *epistemic markers* (no angry email + Maria's calm) relative to the known policy.

  **Walkthrough: The Semantics**

  1.  **Stalnakerian Epistemic/Restrictor Semantics (Indicative: "If A, B"):**  
      *   **Premise:** The indicative conditional is evaluated within a contextually determined *epistemic modal base* – the set of worlds compatible with what the speaker (Dana) knows/believes at the time of utterance.  
      *   **Restrictor:** The antecedent "A" restricts this modal base to worlds where the summary was late.  
      *   **Evaluation:** Within the restricted set (worlds compatible with Dana's knowledge *where the summary was late*), does "B" (Maria is furious) hold?  
      *   **Verdict: TRUE/ASSERTIBLE.** Dana knows Maria's policy (late summary -> furious email). Crucially, she *also* knows Maria is *not* furious right now (no email, calm demeanor). In *all* worlds compatible with Dana's knowledge:  
          *   If the summary was *on time* (~A), Maria isn't furious (consistent with observation).  
          *   If the summary was *late* (A), Maria's policy would have resulted in fury (B). Dana sees no fury, so for the indicative "If A, B" to be consistent with her knowledge *and* the absence of B, she must be in a ~A-world. The indicative asserts that *within the context of her knowledge*, A and ~B cannot hold together; A entails B. The epistemic state forces the truth of the material conditional (A ⊃ B) within the modal base. The absence of B *rules out* A-worlds in her epistemic state, making the conditional true.

  2.  **Lewisian Similarity Semantics (Counterfactual: "If A had happened, B would have"):**  
      *   **Premise:** Counterfactuals are evaluated by considering the closest possible worlds where the antecedent (A) is true. Similarity prioritizes avoiding big, widespread, or law-breaking miracles, and matching particular facts *as much as possible* without violating the antecedent.  
      *   **Antecedent:** A = "The summary had been late" (true in actual world @).  
      *   **Closest A-worlds:** We start from @, where:  
          *   The summary *was* late (A true).  
          *   Maria *was* in an unexpected CEO meeting starting at 9:55 AM.  
          *   Maria *did not* check email after 9:50 AM.  
          *   Maria *was not* furious.  
      *   **Similarity:** The closest worlds where A is true (summary late) are worlds that:  
          *   **Minimally differ** from @.  
          *   **Preserve** the unexpected CEO meeting starting at 9:55 AM (a particular fact).  
          *   **Preserve** Maria not checking email after 9:50 AM (another particular fact).  
          *   Make A true: e.g., the summary arrives at 10:02 AM instead of on time. This requires a small, localized change (e.g., Eli hitting "send" slightly later) – a *minor* miracle compared to changing the CEO meeting.  
      *   **Evaluation:** In these closest A-worlds (summary late, meeting happened, no email check), does B ("Maria is furious") hold?  
      *   **Verdict: FALSE.** In these closest worlds, Maria remains engrossed in the meeting, oblivious to the email. She is *not* furious about the late summary. The actual cause of ~B (the meeting) is preserved in the closest A-worlds, preventing B.

  **The Crucial Detail & Its Removal:**
  *   **The Crucial Detail:** **Maria's unexpected immersion in the CEO meeting, preventing her from checking email or reacting to the summary.** This creates the epistemic marker (calm Maria, no email) *without* A being false, and it's the actual reason why B didn't occur when A did.
  *   **Removal:** Suppose we delete this detail. Maria has no meeting, is at her desk, and simply doesn't send the angry email despite the summary being late. Now:  
      *   **Indicative "If A, B":** Dana sees no B (fury). Without the meeting explanation, Dana has *no reason* to think Maria's policy is suspended. The indicative becomes *unassertible* or even *false* relative to Dana's knowledge. If she asserts it, it's likely wrong (because A is true and B is false, so A ⊃ B is false).  
      *   **Counterfactual "If A had happened, B would have":** Without the meeting, the closest A-worlds (summary late) now have Maria at her desk, aware. Given her known policy, B (fury) *would* occur. The counterfactual becomes **TRUE**.  
      *   **Result:** The divergence collapses. Both conditionals align: without the crucial detail, the indicative is untenable/false and the counterfactual is true. The detail *creates* the divergence by making ~B (observed) compatible with A (unknown) in reality, while severing the strict link between A and B in the actual causal chain.

  **The Counterattack (Material Conditional + Pragmatics):**  
  A proponent of the material conditional (A ⊃ B) as the semantics for *all* conditionals, supplemented by Gricean/Jackson pragmatics, would argue:  
  1.  **Semantics:** "If A, B" is true iff either ~A or B.  
  2.  **Assertibility (Grice/Jackson):** Asserting "If A, B" conversationally implicates that the speaker has reason to believe A ⊃ B is true *without knowing* that ~A is true (avoiding triviality). Jackson adds it conventionally implicates robustness under the supposition of A.  
  3.  **Explaining the Case:**  
      *   The indicative "If A, B" is *false* in the actual world (@). (A is true, B is false, so A ⊃ B is false).  
      *   *Why did Dana assert it?* Dana *reasonably but mistakenly believed* A ⊃ B was true. She knew Maria's policy and saw ~B. She inferred ~A (Gricean inference to avoid triviality: if she knew ~A, she'd just say that). Based on her evidence, asserting A ⊃ B was *reasonable* (high probability), even though it turned out false. The implicature (that she doesn't know ~A) is satisfied.  
      *   The counterfactual "If A had happened, B would have" is *also* false (as per Lewis), matching the material conditional's falsity in @ (since A is true and B is false).  
  4.  **Single Semantics:** Both conditionals have the same core truth conditions (A ⊃ B). The indicative's assertibility is pragmatic (based on reasonable belief), while the counterfactual's falsity is semantic (A ⊃ B is false in @). The difference in mood reflects different speaker knowledge/certainty about A, not a semantic difference.

  **Which Treatment Wins? (Taking a Side)**  
  **The Two-Track Semantics (Stalnaker/Lewis) wins decisively in this case.** Here's why, even acknowledging a cost:

  *   **Failure of the Material Account:** The material conditional account **cannot explain why Dana's indicative utterance is intuitively *correct* or *accurate* at the time of utterance.** In the scenario, Dana *correctly* assesses her epistemic situation. Her assertion "If the summary was late, Maria is furious" is a *true reflection of her epistemic state* and the evidence available. It's not a *mistake* based on false belief; it's the *rational conclusion* given the absence of B and the known policy. Declaring her assertion *semantically false* simply because the unknown actual world happened to be an A & ~B world mischaracterizes the communicative success and the truth-aptness of her reasoning in context. The indicative is *epistemically* true/justified, which the Stalnaker semantics captures directly in its truth conditions relative to the epistemic modal base. The material account renders it semantically false, mistaking an epistemic limitation for a semantic error.
  *   **Cost of Two-Track Semantics:** The cost is ontological and complexity-based: it requires distinct semantic mechanisms for indicatives (epistemic modality/restriction) and counterfactuals (similarity of worlds). This might seem less parsimonious than a single semantics with layered pragmatics.
  *   **Why the Cost is Worth It:** The cost is justified because it correctly captures the fundamental difference in *what these conditionals are doing*. Indicatives express epistemic dependencies and relationships within a body of knowledge or evidence ("Given what I know, A rules in/out B"). Counterfactuals express causal or metaphysical dependencies under hypothetical alterations to reality ("In the closest worlds where A happened, what *would* follow?"). The Missing Lunch Report case perfectly isolates this distinction: Dana's indicative tracks the *epistemic necessity* linking A and B within her information state, while the counterfactual's falsity reveals the *actual causal fragility* of that link due to the unexpected meeting. The material conditional, even with pragmatics, collapses this crucial distinction by making the indicative's felicity depend entirely on the unknown actual truth value of A ⊃ B, rather than recognizing its inherent epistemic role.
  *   **No Cheating:** The case avoids known-false presuppositions. The antecedent is genuinely open and unknown. The indicative's truth is genuinely semantic under Stalnaker's epistemic semantics, reflecting the structure of the speaker's knowledge. The actual world's A & ~B state provides the ground for the counterfactual's falsity under Lewis's semantics. The divergence arises cleanly from the interplay between epistemic reasoning and actual causation disrupted by a specific, unknown event.

  **Conclusion:** The Missing Lunch Report case provides the requested fresh, ordinary-life scenario demonstrating a clear divergence between an assertible indicative and a false counterfactual with an open antecedent. Stalnaker's epistemic semantics correctly diagnoses the indicative as true relative to Dana's knowledge base, while Lewis's similarity semantics correctly diagnoses the counterfactual as false due to the preservation of the distracting meeting in the closest worlds. The crucial detail enabling the divergence is Maria's unexpected meeting. Removing it collapses the divergence. While a material conditional + pragmatics account attempts to explain the data, it fails to capture the intuitive correctness of the indicative utterance within the speaker's epistemic context. The two-track semantics, despite its greater complexity, offers the superior explanation by respecting the fundamental functional difference between indicative and counterfactual conditionals.
