prompt: |-
  I've been around the rationalist blogosphere long enough to have seen Aumann's agreement theorem invoked hundreds of times, usually with the familiar caveat that its practical force is deflated by the common prior assumption: the theorem only bites if the disagreeing parties started with the same priors, which actual humans almost never did. A small funder I advise can support two postdocs in formal epistemology for three years, working strictly on the common prior assumption itself, and the practical interest is dispute resolution — when, if ever, should we expect reasonable people who have shared all their evidence to converge, and when is residual disagreement licensed? Which open questions in this area should the postdocs prioritize, and in what order? Some candidates I have in mind: what exactly justifies Harsanyi's move of interpreting differing priors as differences in information rather than as irreconcilable starting points; whether common priors even make sense for self-locating possibilities, where Sleeping Beauty-style cases suggest the parties may disagree about which proposition is on the table rather than about its probability; how logical uncertainty and the problem of old evidence interact with the fact that agents can never literally share everything they know; and how fragile the associated no-trade results are to small departures from common priors. But I care less about my list than about your reasoning: for each item you'd prioritize, say why it's upstream of the others, whether it's tractable with formal tools or quietly requires empirical psychology, and what developments over the next couple of years would move it up or down your list. Finally, please say which popular uses of the agreement theorem your prioritization would leave untouched — I want to know which of those uses are overrated and don't follow from the math at all.
reasoning: |-
  Okay, the user is deeply involved in the rationalist community and advises a funder for postdocs in formal epistemology. Their main focus is on the common prior assumption (CPA) within Aumann's agreement theorem, specifically for dispute resolution. They want to know which open questions to prioritize, considering factors like upstream impact, tractability, and how developments might affect their relevance. They also care about popular misuses of the agreement theorem.

  First, I need to unpack their listed candidates: Harsanyi's interpretation of differing priors, self-locating beliefs (like Sleeping Beauty), logical uncertainty and old evidence, and fragility of no-trade theorems. Each has different implications for CPA's realism in real disagreements.

  Harsanyi's move is foundational. If differing priors are just differences in information, that supports CPA's plausibility. But if they're irreconcilable, CPA is less applicable. A postdoc could explore models where priors emerge from structural similarities, which might make CPA more defensible in practice. This seems upstream because it affects how we view disagreements from the start. It's tractable with formal tools, needing game theory and Bayesian models. Progress here could come from new mathematical frameworks linking prior formation to shared experiences.

  Self-locating beliefs are another priority. Disagreements in cases like Sleeping Beauty arise from indexical information, not just evidence. If agents can't agree on what's being discussed, convergence is harder. This is tractable with centered worlds or similar frameworks. Recent work on anthropic reasoning might influence this. Without resolving this, dispute resolution in scenarios involving identity or time might be flawed.

  Logical uncertainty and old evidence are linked. Agents can't share all knowledge, especially logical truths. Old evidence problem complicates updating beliefs. This requires formal tools like algorithmic information theory. Progress in bounded rationality models could help here. It's crucial because real agents don't have infinite computing power, affecting how they share and update on information.

  Fragility of no-trade theorems matters for practical applications. If small departures from CPA lead to significant disagreements, the theorem's applicability diminishes. This needs both formal models and empirical insights. Recent empirical work on belief updating could inform this. It's important for understanding real-world disputes where priors aren't perfectly aligned.

  I should rank these. Harsanyi's move is most upstream, as it questions the very basis of priors. Then self-locating beliefs, as it redefines propositions. Logical uncertainty next, addressing knowledge sharing limits. Fragility last, as it builds on the others.

  The user also wants to know which popular uses of the agreement theorem are overrated. Common misapplications include ignoring CPA, assuming evidence sharing is trivial, or applying it to value disagreements. These don't hold under scrutiny, especially when CPA isn't justified or when disputes involve non-factual elements.

  The user's deeper needs might include validating the funder's focus on CPA for dispute resolution, ensuring postdocs tackle impactful problems, and clarifying where the theorem is misused to prevent rhetorical misuse. They might also want to position their work to address practical concerns while advancing formal epistemology.
answer: |-
  Based on your goals (practical dispute resolution, understanding convergence/residual disagreement, rigorous formal epistemology) and the state of the field, here's a prioritized research agenda for the postdocs, followed by an analysis of overrated popular uses of Aumann's theorem:

  **Prioritized Research Questions (with Reasoning):**

  1.  **The Justification & Interpretation of Harsanyi's Move: Reconciling "Differing Priors" as Differences in Information**
      *   **Why Upstream?** This is the *most foundational*. Aumann's theorem *assumes* a common prior. Harsanyi's doctrine (differing "priors" reflect differing implicit information) is the primary conceptual argument *for* the plausibility of a CPA in real-world disagreements among rational agents. If this move is fundamentally flawed or requires impossibly stringent conditions, the entire practical aspiration of Aumann for dispute resolution crumbles *before* you even get to self-locating beliefs or logical uncertainty. It directly addresses the core caveat you mentioned.
      *   **Tractability:** Primarily formal (game theory, Bayesian epistemology, measure theory, learning theory). The task is to rigorously model *how* agents with different life experiences, conceptual frameworks, or "background knowledge" could arrive at a state representable as having a common prior plus differing private signals. This involves:
          *   Formalizing "background states" or "interpretative frameworks."
          *   Modeling prior formation via shared structural principles or learning processes (e.g., from a hypothetical "primordial state").
          *   Investigating convergence *to* a common prior under shared structural rules but differing initial data streams.
      *   **Developments Affecting Priority:** Significant progress here (e.g., a compelling formal model justifying Harsanyi in broad classes of disagreements) would elevate Aumann's practical relevance. Conversely, strong negative results (showing formal incoherence or extreme fragility of the Harsanyi interpretation in relevant models) would drastically lower the priority of *all* other CPA-related work for *practical* dispute resolution and shift focus entirely to models of irreducible prior disagreement. Empirical psychology (e.g., how humans actually form priors) is *informative* but the core justification must be formal/normative.

  2.  **Common Priors and Self-Locating Beliefs (Sleeping Beauty & Anthropics)**
      *   **Why Upstream?** While Harsanyi addresses the *origin* of priors, self-locating beliefs challenge the very *ontology* of the state space over which a common prior is defined. Disagreement here isn't (only) about probability *given* a proposition, but about *which centered proposition* is relevant or even expressible within a shared framework. This strikes at the heart of "sharing all evidence" – how do you share indexical evidence ("I am Beauty woken on Monday") in a way that updates a common prior defined over uncentered worlds? Failure here licenses residual disagreement even under idealized CPA conditions in vast swathes of real-world scenarios involving identity, time, location, or reference classes.
      *   **Tractability:** Formal (centered worlds, partition structures, generalized probability, decision theory). The challenge is defining a common prior over a state space rich enough to include indexical facts and modeling how agents with different indexical information update within this framework to reach agreement (or understand why they sometimes cannot, even with shared evidence).
      *   **Developments Affecting Priority:** Breakthroughs in formalizing centered agreement (e.g., a robust Aumann-like result for centered beliefs) would be revolutionary. Increased focus on practical disputes involving identity, simulation hypotheses, or anthropic reasoning (e.g., in AI alignment, cosmology) would raise its urgency. Lack of progress might relegate it to a fascinating but niche problem, though its implications for the nature of propositions are profound.

  3.  **Logical Uncertainty, Old Evidence, and the Impossibility of Full Knowledge Sharing**
      *   **Why Next?** This tackles the *practical barrier* to satisfying the "shared all information" condition, even granting a CPA and a fixed state space. Agents cannot literally share *everything* they know (especially implicit logical knowledge). Old evidence highlights the paradox of how evidence known forever can suddenly become relevant. Logical uncertainty challenges Bayesian updating itself when truth is unknown. This directly impacts *how* and *if* agents can realistically achieve the common knowledge of information required for Aumann convergence.
      *   **Tractability:** Hybrid (Formal + Conceptual). Formal tools include: logical induction, algorithmic information theory, models of bounded rationality, knowledge logic. However, defining "full knowledge sharing" for logically non-omniscient agents and modeling the impact of *partial* sharing on convergence dynamics is deeply conceptual. It requires defining what constitutes "relevant" information sharing in practice.
      *   **Developments Affecting Priority:** Advances in logical uncertainty frameworks (e.g., Logical Induction) make this more tractable. Growing interest in AI alignment (where AIs might share evidence perfectly *in principle* but humans cannot) increases its practical relevance. Conversely, if work on Harsanyi or self-locating beliefs shows CPA is rarely applicable anyway, this becomes less critical for *dispute resolution*, though still vital for bounded rationality.

  4.  **Fragility of No-Trade Theorems & Small CPA Departures**
      *   **Why Last?** This is crucial for *applying* the insights but builds on the others. If we have some justification for approximate CPA (from Harsanyi work), understand the state space limitations (from self-locating work), and grasp knowledge-sharing limits, *then* we can rigorously ask: How sensitive is the "no disagreement" conclusion to *small* violations? How much residual disagreement or willingness to bet is consistent with "almost" common priors? This directly informs how seriously to take failure to converge in real disputes.
      *   **Tractability:** Formal (perturbation analysis, learning theory, market/game models) + Empirical. Formally modeling "distance to CPA" and its effect on disagreement/betting is core. *Calibrating* this model requires empirical psychology/experimental economics to understand typical magnitudes of prior divergence in human disagreements and how updating actually works.
      *   **Developments Affecting Priority:** Strong results showing extreme fragility (small CPA deviations → large disagreements/betting) would undermine the *practical* force of Aumann even if CPA is theoretically justifiable. Robustness results would strengthen it. Empirical findings on human prior divergence directly feed into the models. Progress on the upstream questions defines *what kind* of fragility to even study.

  **Overrated Popular Uses of Aumann's Agreement Theorem (Left Untouched/Undermined by this Prioritization):**

  1.  **"You Disagree, Therefore One/Both of You is Irrational or Hiding Evidence":** This is the *most* common and egregious misuse. Our prioritization directly attacks the core premise: residual disagreement can be fully licensed by legitimate differences in prior formation processes (if Harsanyi fails), fundamental differences in how propositions are centered (self-locating cases), or the practical impossibility of sharing all relevant information (logical uncertainty/old evidence), *even among perfectly rational, honest agents*. The theorem only guarantees convergence *given* CPA and common knowledge of information. Using it to accuse opponents of bad faith without establishing these assumptions is a rhetorical fallacy.
  2.  **"All Disagreements Must Be Due to Differing Evidence (Just Share It!)":** While differing evidence is *one* path to disagreement, our focus on Harsanyi and self-locating beliefs highlights that disagreements can be fundamentally rooted in differing *interpretive frameworks* or *indexical perspectives*, not just differing private signals about a shared state of the world. Sharing "evidence" might not resolve this if the disagreement is about the meaning or relevance of the evidence itself within different frameworks. The "just share evidence" mantra ignores the prior/structural layer.
  3.  **Applying it to Value Disagreements or Preferences:** Aumann's theorem concerns beliefs about *factual* states of the world. It has no direct bearing on disagreements about utility functions, moral values, or preferences. Using it to argue that rational agents *should* converge on values is a category error.
  4.  **Assuming it Prescribes a Specific Dispute Resolution Tactic (e.g., "Just Bayesian Update!"):** The theorem is a *limitative* result (convergence *must* happen *if* CPA+common knowledge hold). It doesn't specify *how* to achieve common knowledge of information in practice, especially with bounded agents. It doesn't tell you *which* evidence to share or *how* to resolve ambiguities in interpretation (covered by our Harsanyi/self-locating priorities). It's a benchmark, not an algorithm.
  5.  **Overstating the "Common Knowledge" Requirement as Trivial:** Popular invocations often gloss over the extreme stringency of common knowledge ("I know that you know that I know... ad infinitum"). Our focus on logical uncertainty and the impossibility of full knowledge sharing highlights how profoundly *non*-trivial this is. Merely stating evidence publicly doesn't guarantee common knowledge of it.

  **In Summary:** Prioritize foundational justification (Harsanyi), then ontology (self-locating), then practical barriers (knowledge sharing/logical uncertainty), then sensitivity analysis (fragility). This sequence builds from the core assumption outwards towards application and robustness. This work directly challenges the most common (and damaging) misuses of Aumann – using it to accuse opponents of irrationality or hiding evidence without engaging with the profound challenges of justifying common priors and common knowledge in real human (or even artificial) disagreements. The math holds, but its domain of relevant application for *resolving actual disputes* is far narrower than often assumed. Your funder's focus on the CPA itself is precisely the right lever for impactful work on dispute resolution.
