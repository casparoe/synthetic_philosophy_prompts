prompt: |-
  For thirty-odd years I worked on gravitational physics — pulsar timing, mostly — and since retiring I have been reading philosophy of time. I would like a consistency audit of the position I have drifted into, because I cannot see my way clear of it myself. The commitments are: (1) I take Minkowski geometry to describe how the world actually is, not as a calculational device; the four-dimensional manifold is the structure of reality, and coordinate-dependent talk is bookkeeping. (2) On that basis I accept the Rietdijk–Putnam argument: the relativity of simultaneity leaves no room for an objective, frame-invariant global "now," so presentism is false, and I find the Andromeda-style illustration — two people strolling past each other in opposite directions disagreeing about whether some distant event has already happened — genuinely persuasive rather than a curiosity. (3) I nonetheless believe the future is objectively open, not merely epistemically unknown: quantum measurement outcomes are genuinely unsettled until they occur, and a world containing unsettled facts is not a block. (4) I hold, nearly as a moral principle carried over from relativity, that there are no privileged frames or foliations — anything not invariant under the symmetry group is an artifact of description. (5) Yet I know our cosmology supplies a strikingly natural cosmic time, the rest frame of the microwave background, and I am tempted to say that the "settling" of previously open facts advances along that foliation, while insisting this does not restore a privileged present. Which of these pairs are genuinely in tension, which only appear to be, and what is the cheapest repair and what would it cost? I have deliberately not said where I suspect the trouble lies. Two requests: take seriously the possibility that two of my commitments, each quite standard, are jointly untenable — that is what I most want to understand — and if any part of this rests on a confusion, whether about what the Rietdijk–Putnam argument actually requires, about cosmic time in an expanding universe, or about the difference between facts being determinate and events being determined, tell me so plainly instead of auditing on my terms.
reasoning: |-
  Okay, let me approach this systematically. The user is a retired gravitational physicist with decades of experience in pulsar timing, now deeply engaged with philosophy of time. Their query presents a carefully constructed position with five commitments that seem to be in tension, particularly regarding the block universe view versus quantum indeterminacy. 

  First, I need to unpack the core tension: they accept Minkowski spacetime as fundamental reality (commitment 1) and the Rietdijk-Putnam argument against presentism (commitment 2), yet insist the future remains objectively unsettled due to quantum indeterminacy (commitment 3). This directly challenges the eternalist block universe. Meanwhile, their rejection of privileged frames (commitment 4) clashes with the temptation to use cosmic time for quantum collapse (commitment 5).

  Hmm... the real friction lies between commitments 2+3. Rietdijk-Putnam relies on relativity's frame-invariance to disprove absolute simultaneity, but quantum indeterminacy requires temporal becoming - which demands some notion of "now" advancing. These seem irreconcilable without violating either relativity (via privileged foliation) or quantum theory (via superdeterminism). 

  I should examine whether cosmic time (commitment 5) offers an escape. While the CMB frame is empirically privileged for cosmology, making it metaphysically privileged for quantum collapse would violate commitment 4. The user explicitly wants to avoid this, calling it a "moral principle." Interesting how their physics intuition battles their philosophical scruples here.

  The user's unspoken concern might be this: Can one consistently be a relativistic eternalist while believing in objective quantum openness? I suspect they already sense the answer is no, given their phrasing about "jointly untenable" commitments. Their expertise means I must avoid oversimplifying - no "quantum gravity will fix it" hand-waving.

  Perhaps the cheapest repair is to bite the bullet on commitment 2: accept that relativity only describes the classical arena, and quantum becoming operates via some deeper structure (e.g. quantum gravity's time). But this costs their hard-won Minkowskian realism. Alternatively, reinterpret quantum indeterminacy as perspectival (e.g. relational quantum mechanics), but that might feel like surrendering objective openness.

  Notably, they haven't mentioned retrocausality or transactional interpretations - maybe because those introduce new ontologies. I should flag this option despite its radicalness. The real challenge is preserving both Lorentz invariance and indeterminacy without foliation-dependence... which no existing theory achieves. 

  Their closing request is crucial: they want plain talk about possible confusions. So I'll directly note that treating "facts becoming determinate" as distinct from "events being determined" may be wordplay - if an event's outcome isn't fixed until it occurs, that requires temporal becoming fundamentally incompatible with eternalism. The Andromeda paradox shows relativity can't accommodate this without foliation. 

  This user deserves candor: their position is coherent only if quantum collapse is foliation-dependent (violating 4) or illusory (violating 3). Both options cost dearly. I'll structure the response around diagnosing the 2-3 tension first, then evaluating repairs honestly.
answer: |-
  Here's a consistency audit of your position, identifying genuine tensions, apparent ones, the cheapest repair, and its cost. The core issue lies where you suspect: the joint untenability of commitments (2) and (3) under strict Lorentz invariance (4).

  ### 1. Genuine Tensions
  -   **(2) + (3) + (4): The Core Inconsistency**  
      This trio is *jointly untenable*.  
      -   **(2) Eternalism (Rietdijk-Putnam):** Denies an objective, global "now." Reality is a fixed 4D manifold.  
      -   **(3) Objective Future Openness:** Requires temporal becoming – facts *become* settled along some global (or at least non-local) "advancing front."  
      -   **(4) No Privileged Foliation:** Lorentz invariance forbids any preferred slicing defining "now" or "becoming."  
      **Conflict:** Objective openness (3) demands a *metaphysical* distinction between settled past/present and open future. Relativity + Rietdijk-Putnam (2 & 4) show no Lorentz-invariant way to define this distinction globally. Using *any* foliation (like cosmic time) to define "becoming" violates (4). Without a foliation, (3) has no structure on which to operate globally.

  -   **(3) + (5): Temptation vs. Principle**  
      -   **(5) Cosmic Time Temptation:** Using the CMB foliation for "settling" directly contradicts **(4)**. The CMB frame is empirically special (lowest anisotropy), but elevating it to define *metaphysical becoming* makes it a privileged frame *for quantum ontology*, violating Lorentz invariance as a fundamental symmetry of spacetime structure. This is precisely what **(4)** forbids.

  ### 2. Apparent Tension (But Resolvable)
  -   **(1) + (3): Block with Openness?**  
      This *appears* contradictory (fixed block vs. unsettled future). However, the tension is *not* inherent if you distinguish:  
      -   **Events/Worldlines:** Fixed in the manifold (eternalism).  
      -   **Properties/Facts:** Can be indeterminate (e.g., quantum states).  
      **Resolution:** An "open block" or "growing block" (though problematic, see below) *can* be conceived within a 4D manifold. The *existence* of the future light cone is fixed, but the *definite properties* (e.g., specific measurement outcomes) on parts of it are not yet settled. This avoids a *logical* contradiction with **(1)** but creates tension with relativity's implications **(2 & 4)**.

  ### 3. The Crux: Rietdijk-Putnam and What It Requires
  Your understanding is correct. Rietdijk-Putnam **does** robustly show that within Special Relativity (and plausibly GR without global symmetries/hypersurfaces):
  -   There is no frame-independent notion of "all events happening now."
  -   Any two spacelike separated events are simultaneous *in some frame*.  
  -   Therefore, any notion of a universal "present" encompassing "all that is real now" is frame-dependent. Presentism (only the present is real) is incompatible.

  **The Key Implication for Openness:** If the future is *objectively* open (unsettled), then there *must* be an objective fact about *which* events have had their facts settled and which haven't. Rietdijk-Putnam shows this distinction *cannot* be made in a Lorentz-invariant way. Different frames will disagree on whether a spacelike-separated event is "already settled" or "still open." This directly contradicts the demand for *objective* openness **(3)** under strict Lorentz invariance **(4)**.

  ### 4. Cosmic Time (Commitment 5) - Its Role and Limitation
  -   **Its Status:** The CMB frame defines a *remarkably natural, operationally significant cosmic time foliation in our universe* due to high homogeneity/isropy. It's *empirically* privileged for cosmology.
  -   **Your Temptation:** Using it to define the "settling front" for quantum openness is understandable – it provides a global "now."
  -   **The Violation:** Doing this makes it a **metaphysically privileged foliation**, directly contradicting **(4)**. Lorentz invariance (or diffeomorphism invariance in GR) is demoted from a fundamental symmetry of *reality* to merely a symmetry of the *dynamics* within a fixed foliation. This rejects the core lesson of relativity that motivated **(1)** and **(2)**.
  -   **Cost:** Significant. It abandons the profound insight that spacetime structure itself has no preferred "time direction" at the fundamental level. Privileging the CMB frame for quantum becoming treats it as ontologically distinct, akin to reintroducing a subtle Lorentzian aether.

  ### 5. Potential Confusions & Clarifications
  -   **"Facts being determinate" vs. "Events being determined":** This distinction is crucial but doesn't resolve the tension. In an eternalist block **(1, 2)**, the *event* (e.g., a specific measurement at spacetime point P) exists. Its *factual content* (which outcome manifested at P) could be indeterminate until "P's time." **The problem is defining "P's time" objectively without a foliation.** Relativity tells us "P's time" is frame-dependent. Objective openness requires an objective answer to "Is the fact at P settled *now* (at my location)?" Rietdijk-Putnam shows no invariant answer exists for spacelike P.
  -   **GR & Cosmic Time:** While cosmic time is natural in *our specific* FLRW universe, GR allows universes without any global foliation (e.g., Gödel universe). Your position relies on a contingent cosmological feature, violating the desire for fundamentality in **(1)** and **(4)**.

  ### 6. The Cheapest Repairs & Their Costs
  1.  **Abandon Strict Objective Openness (Modify 3):** Accept that quantum indeterminacy is *epistemic* or *perspectival* (e.g., within a relational or QBist framework). The block is fixed; "openness" reflects our limited knowledge or location within the block.
      *   **Cost:** Surrenders the core intuition that quantum outcomes are genuinely unsettled before measurement. This feels like giving up the ghost for many.
  2.  **Accept Privileged Foliation (Modify 4):** Bite the bullet and allow the CMB foliation (or some other fundamental foliation, perhaps from quantum gravity) to define the "settling front" for quantum facts.
      *   **Cost:** Abandons a foundational principle of relativity **(4)**, treating Lorentz invariance as non-fundamental. Undermines the motivation for **(1)** and **(2)**. Makes physics contingent on cosmology.
  3.  **Reinterpret/Constrain Openness (Modify 3):** Adopt "local" or "relational" becoming. Facts become determinate *only* at the actual measurement event itself, not along any global front. Openness isn't about "the future" globally, but about the immediate future light cone of each event being indeterminate *until interacted with*.
      *   **Cost:** Radically alters the meaning of "open future." The future light cone of Earth *right now* contains events whose facts are *already settled* in frames where they are past (Andromeda Paradox). This denies a *global* open future; openness is strictly localized. It may feel like a significant weakening of **(3)**.
  4.  **Challenge the Block Description (Modify 1/2):** Explore non-standard ontologies like the "Growing Block" or "Moving Spotlight," but rigorously adapt them to relativity. This is extremely difficult and usually requires rejecting fundamental Lorentz invariance **(4)** or introducing complex new structure.
      *   **Cost:** High complexity, potential inconsistency with relativity, departure from the elegant Minkowskian view **(1)**.

  ### Recommendation & Conclusion
  The **most significant tension** is indeed between your acceptance of the Rietdijk-Putnam argument **(2)** combined with Lorentz invariance **(4)**, and your commitment to objective future openness **(3)**. These are jointly untenable under standard interpretations of relativity and quantum mechanics.

  The **cheapest repair** that preserves the most of your core intuitions is likely **#3: Local/Relational Becoming**. It retains the 4D manifold **(1)**, accepts relativity's lessons against a global now **(2 & 4)**, and preserves a notion of genuine quantum indeterminacy **(3)**, albeit localized rather than global. It sidesteps the need for a privileged foliation **(5 becomes unnecessary)**. However, the **cost** is accepting that the "open future" is not a global, shared phenomenon but a perspectival feature tied to individual worldlines. This may feel like a significant concession.

  If local becoming feels insufficient, **#1 (Epistemic Openness)** is the cheapest *conceptual* repair but costs the core of **(3)**. **#2 (Privilege Cosmic Time)** is the most ontologically straightforward for preserving global openness but costs the foundational principle of relativity **(4)**.

  Your position reflects a profound and widely felt tension between relativity and quantum mechanics regarding time. There is no cost-free resolution within established physics. The inconsistency lies precisely where you suspected: the combination of Minkowskian eternalism and Lorentz invariance with objective global temporal becoming is, as currently understood, metaphysically unstable.
