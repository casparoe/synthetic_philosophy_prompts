  For escape routes... Conclusion-only voting loses nuance. Treating premises as decisive is authoritarian. Full ranking aggregation (like Borda) avoids paradoxes but sacrifices the chair's desired "objective" decomposition. Supermajorities might prevent inconsistency but create new problems. 

  The memo should end by acknowledging the chair's reasonable intent while showing why this method can't deliver it. The paradox example must be watertight - maybe use clear disciplinary references (say, theoretical physicist vs. experimentalist) to make it feel real for academics.

  User's tone suggests they want intellectual rigor without embarrassing the chair. Smart framing - "strongest honest version" first. They're not trying to win a debate but prevent a bad hiring outcome.
answer: |-
  **MEMORANDUM**  
  To: Hiring Committee  
  From: [Your Name]  
  Subject: Precisification of "Wisdom of Crowds" & Implications for Voting Procedure  

  ---

  ### **I. The "Wisdom of Crowds" (WoC): Distinct Theses and Verdicts**  
  The slogan "five independent heads... land nearer the truth" admits multiple interpretations. Below are the most salient, graded by plausibility:  

  1. **Trivial/Aggregation Thesis**:  
     *Claim*: Aggregating independent estimates of a *factual quantity* (e.g., an ox’s weight) cancels idiosyncratic errors, converging toward the true value.  
     *Verdict*: **Platitudinous** (empirically robust for continuous quantities under independence).  
     *Relevance*: Irrelevant to *ordinal rankings* of candidates.  

  2. **Condorcet Jury Theorem (CJT) Thesis**:  
     *Claim*: For binary choices (e.g., "Is A better than B?"), if voters are (a) independent, (b) each more likely than not to be correct (*competence*), and (c) vote sincerely, majority vote converges to the "correct" outcome as group size increases.  
     *Verdict*: **Substantive and defensible**—but *highly contingent* on (a) and (b). Violations of independence or competence (e.g., shared biases) invalidate it.  

  3. **Pure Normative Thesis**:  
     *Claim*: Majority rule is legitimate *per se*, irrespective of truth-tracking. It embodies procedural fairness or popular will.  
     *Verdict*: **Substantive** but disconnected from epistemic claims about "land[ing] nearer the truth."  

  4. **Holistic Judgment Thesis** (implied by the chair):  
     *Claim*: Decomposing rankings into premise-wise votes (research/teaching/fit) and aggregating *premises separately* yields a superior overall ranking.  
     *Verdict*: **False as stated**—premise-wise majority voting can produce logically incoherent outcomes.  

  ---

  ### **II. What the Chair’s Procedure Needs**  
  The chair’s defense requires the **CJT Thesis** applied to *premises* (e.g., "A has stronger research"), with the added claim that aggregating "correct" premises guarantees a "correct" ranking. This assumes:  
  - Voters are independent and competent on *each premise*.  
  - Premise-wise truths mechanically compose a coherent ranking.  

  **Why it fails**: Even if CJT holds for individual premises, aggregating premises *separately* can violate *logical consistency* due to the **doctrinal paradox** (a.k.a. discursive dilemma).  

  ---

  ### **III. The Doctrinal Paradox: A Concrete Hiring Scenario**  
  Consider 5 committee members ranking candidates A and B on three premises:  
  - **P1**: A has stronger research  
  - **P2**: A has stronger teaching  
  - **P3**: A is a better fit  
  A majority endorsing all premises *should* imply A > B overall. But this can conflict with members’ holistic judgments.  

  **Voter Profile** (Each voter’s premise judgments + overall ranking):  
  | Voter | P1 (Research) | P2 (Teaching) | P3 (Fit) | Overall Ranking |  
  |-------|---------------|---------------|----------|-----------------|  
  | 1     | Yes (A)       | Yes (A)       | Yes (A)  | A > B           |  
  | 2     | Yes (A)       | No (B)        | No (B)   | B > A           |  
  | 3     | No (B)        | Yes (A)       | No (B)   | B > A           |  
  | 4     | No (B)        | No (B)        | Yes (A)  | B > A           |  
  | 5     | Yes (A)       | No (B)        | Yes (A)  | B > A           |  

  **Premise-wise Majority Votes**:  
  - P1: Yes (A) wins 3-2 (Voters 1,2,5)  
  - P2: No (B) wins 3-2 (Voters 2,3,4)  
  - P3: Yes (A) wins 3-2 (Voters 1,4,5)  
  → *Majority verdict*: A wins on Research and Fit, B wins on Teaching.  

  **Chair’s Procedure Output**: Premises imply "A > B" (wins 2/3 premises).  

  **But Holistic Votes**:  
  - 4 of 5 voters rank **B > A** (Voters 2,3,4,5).  
  → *Majority ranking*: **B > A**.  

  **Contradiction**: The premise-wise majority implies A > B, but 80% of members rank B > A. The outcome appears in *no member’s* ranking.  

  ---

  ### **IV. Why This Sinks the Chair’s Proposal**  
  The doctrinal paradox demonstrates that:  
  - Premise-wise majority voting can produce **collectively inconsistent** verdicts.  
  - The chair’s method violates the **universal domain** principle: it forces an outcome disconnected from voters’ actual preferences.  
  - CJT’s competence assumption is implausible here: voters may interpret "research strength" or "fit" differently, violating *shared premises*.  

  ---

  ### **V. Escape Routes and Their Costs**  
  1. **Conclusion-Only Voting** (vote directly on "A > B?"):  
     - *Cost*: Abandons premise-based reasoning. Loses nuanced judgment decomposition.  
     - *WoC Tradeoff*: If CJT holds, may track "truth" on pairwise choices—but risks cycles (Condorcet paradox).  

  2. **Treating Premises as Decisive** (e.g., "Research strength is paramount"):  
     - *Cost*: Imposes a rigid hierarchy, negating deliberation on tradeoffs.  
     - *WoC Tradeoff*: If the decisive premise satisfies CJT, it works—but competence is rarely premise-specific.  

  3. **Aggregate Whole Rankings** (e.g., Borda count):  
     - *Cost*: Less "objective" decomposition; may incentivize strategic voting.  
     - *WoC Tradeoff*: Avoids doctrinal paradox but may violate independence (e.g., Arrow’s theorem).  

  4. **Supermajority Requirements** (e.g., 4/5 votes per premise):  
     - *Cost*: Increases deadlock risk; may default to status quo (no hire).  
     - *WoC Tradeoff*: Reduces inconsistency likelihood but amplifies minority bias.  

  ---

  ### **VI. Conclusion**  
  The chair’s procedure requires a **strong CJT assumption** applied to premises—but this fails because:  
  - Voters’ judgments on premises are unlikely independent or uniformly competent,  
  - Premise-wise aggregation can violate **logical coherence**, as shown in the paradox.  

  The wisdom of crowds is real but fragile. For ordinal rankings, it demands methods that respect holistic voter rationality (e.g., aggregating entire rankings). I propose we adopt a ranked-choice system (e.g., Borda or Condorcet) to preserve deliberation while avoiding collective inconsistency. This honors the chair’s intent—leveraging diverse expertise—without forcing a fractured verdict.  

  ---  
  *Respectfully submitted for deliberation.*
