prompt: |-
  I lead a lunchtime reading group at a robotics software company: six colleagues, strong on reinforcement learning and control theory, no philosophy. Next session is ninety minutes at a whiteboard, on embedded agency — what changes for an agent when it is part of the environment it acts in, rather than a clean optimizer sitting outside it. Don't explain the topic to me; plan how I should explain it to them. Structure the response in the following sections, in this order, at roughly the lengths given.

  1. "Dependency order" (~250 words). The sequence the ideas must come in, and why that order. My instinct is that I first have to lay out the standard RL picture — agent on one side, environment as a box, reward signal arriving from outside — and then visibly break it, but tell me exactly which pieces must be in place before the next can be introduced, and what goes wrong if I introduce them out of order.

  2. "The carrying example" (~150 words). The one concrete case that should carry the whole session. It must involve an agent that models a world which contains itself, but it must not be a human or any conscious being, or the group will drift straight into philosophy of mind. Say what the example must have and what it must lack.

  3. "Misconceptions" (~300 words). The errors this audience will form, in the order they will form them, and where in the sequence each should be headed off. My guesses: that embedded agency is just embodiment (having a body and sensors); that it collapses into partially observable MDPs, which they know cold; and that the fix is simply "model yourself too," which misses the regress that any self-model short of the whole agent leaves something unmodeled. Correct me where I'm wrong and add what I've missed.

  4. "Check" (~80 words). One question I can ask at the end whose answer would show they have actually understood the problem, not merely found it intriguing.

  5. "What to leave out" (~100 words). What I should openly decline to cover in ninety minutes — I'm braced for someone to raise self-reference paradoxes and decision-theoretic puzzles — and how to say so honestly without making the topic look deeper or more settled than it is.

  6. "Settled vs contested" (~150 words). I'm aware that embedded agency as a technical term comes largely from a particular research program in AI safety rather than from a mature literature, and that some of its framing — the talk of a Cartesian boundary, the claim that embedded agents cannot in principle fully model themselves — is contested or simply underdeveloped rather than agreed. In this final section, separate what is genuinely settled among people who work on this from what is contested or program-specific, and do not present one program's framing as the consensus of the field.

  Throughout, assume the whiteboard is the only prop and that the group will interrupt; the plan should be robust to that.
reasoning: |-
  Hmm, the user leads a robotics reading group focused on embedded agency. They want a structured plan for a 90-minute whiteboard session. Let me break this down section by section as requested.

  First, dependency order. The user's instinct to start with standard RL is correct. I need to map the conceptual sequence carefully:  
  - Begin with the textbook RL setup (agent-environment boundary, reward as external input). This is their mental anchor.  
  - Then break it by asking: "Where is the reward signal actually processed?" This exposes the hidden assumption of external implementation.  
  - Next demonstrate self-reference: have them imagine the agent's model including itself. Whiteboard arrows looping back will make the recursion visible.  
  - Finally introduce the fundamental tension: any self-model is necessarily incomplete because it's part of what's being modeled.  

  Skipping steps would cause problems. Jumping straight to self-reference without breaking the RL setup might make it seem like a trivial PO-MDP extension. Delaying the incompleteness point risks them thinking "just model everything" is feasible.  

  For the carrying example, I'll use a warehouse robot with these features:  
  - Concrete: Pathfinding in a facility with other robots  
  - Self-referential: Its world-model includes its own position/plans  
  - Constraints: No consciousness analog, no human-like cognition.  
  Crucially, the model must be imperfect - e.g., when predicting traffic patterns, it can't simulate itself at full fidelity without circularity.  

  Misconceptions to preempt:  
  1. "This is just embodiment" - Clarify during the RL breakdown that sensors/actuators don't create self-reference problems.  
  2. "It's only PO-MDP" - Contrast during self-modeling: PO-MDPs handle hidden state, not modeling-the-modeler regress.  
  3. "Add self to model" - Crush this when introducing incompleteness by asking "what models the model of the model?"  
  Additional pitfall: Thinking embeddedness only matters for conscious systems - hence the robot example.  

  The check question: "Why can't the warehouse robot perfectly simulate the entire warehouse including itself?" Correct answer touches on computational limits and self-reference, not just complexity.  

  What to omit:  
  - Openly skip self-reference paradoxes (Löb's theorem etc.) and decision theory puzzles (Newcomb's). Say: "These are important but we're focusing on modeling limitations today."  

  Settled vs contested:  
  - Settled: Agents must be part of their environment, self-models are always incomplete, perfect self-prediction is impossible.  
  - Contested: Whether "Cartesian boundary" is the best framing, how severely the incompleteness constrains agents, and how much this differs from standard subagent approaches.  

  The warehouse robot example does heavy lifting here - its concrete limitations keep us anchored in computation, avoiding philosophy.
answer: |-
  Here’s a structured plan for your 90-minute whiteboard session, optimized for clarity, engagement, and robustness to interruptions:

  ---

  ### 1. Dependency Order (250 words)  
  **Sequence & Rationale:**  
  Start with the **standard RL picture** (agent outside environment, reward as external input). This is their mental model; visibly break it step-by-step:  
  - **Step 1: Agent-Environment Boundary**  
    Whiteboard the RL loop: agent outputs actions → environment outputs states/rewards → agent updates.  
    *Why first?* Establishes the "external optimizer" assumption. Skipping this risks them missing the paradigm shift.  
  - **Step 2: Break the Boundary**  
    Ask: *"Where is the reward computed?"* Reveal it’s often *inside* the environment (e.g., a physical sensor). Erase the clean boundary.  
    *Why next?* Forces recognition that the agent is *part of* the environment. Doing this later obscures why "just add self to state" fails.  
  - **Step 3: Self-Reference**  
    Introduce an agent whose world-model includes *itself*. Show circularity: "If the agent models itself modeling itself, where does it bottom out?"  
    *Why here?* Sets up the regress. Skipping to solutions first (e.g., "model yourself") ignores the core tension.  
  - **Step 4: Incompleteness**  
    Argue that no self-model can be fully accurate (unless it models the entire universe, including itself).  
    *Why last?* This is the punchline. Introducing it early feels abstract; after Steps 1–3, it’s unavoidable.  

  **Risk of reordering:**  
  Jumping to "just model yourself" (Step 3) before breaking the boundary (Step 2) makes embeddedness seem trivial. Delaying self-reference (Step 3) until after incompleteness (Step 4) obscures *why* incompleteness matters.

  ---

  ### 2. The Carrying Example (150 words)  
  **Use a predictive maintenance robot in a factory:**  
  - **Must have:**  
    - The robot models factory equipment (e.g., conveyor belts) to predict failures.  
    - Its model *includes itself* as an actor (e.g., it predicts how its own maintenance actions affect belt wear).  
    - It faces a self-referential loop: its predictions change its behavior, altering future predictions (e.g., delaying maintenance to avoid downtime now increases failure risk later).  
  - **Must lack:**  
    - No consciousness, qualia, or "free will" mentions.  
    - No human-like cognition (e.g., no "the robot wonders about itself").  
    - Physical embodiment is present but *not* the focus (avoid conflating with embodiment).  

  **Why it works:**  
  The robot’s self-model is computational (e.g., a Kalman filter tracking its own wear), making self-reference tangible without philosophy.

  ---

  ### 3. Misconceptions (300 words)  
  Preempt these in order of likely emergence:  
  1. **"Embedded agency = embodiment"**  
     *When to cut off:* During boundary-breaking (Step 2).  
     *Response:* "Embodiment means having sensors/actuators; embeddedness means *being part of the system you’re optimizing*. A disembodied trading bot is still embedded if it affects stock prices."  
  2. **"This is just a POMDP"**  
     *When to cut off:* During self-reference (Step 3).  
     *Response:* "POMDPs handle hidden state but assume the agent isn’t *part* of the state dynamics. Here, the agent’s existence alters the environment’s rules—like our robot changing factory physics by existing." Whiteboard a POMDP vs. an agent whose actions modify its own sensors.  
  3. **"Just include yourself in the model"**  
     *When to cut off:* During incompleteness (Step 4).  
     *Response:* "Try it: if the robot models itself, does it model itself *modeling itself*? This regress requires infinite resources. Any finite model leaves ‘meta’ layers unmodeled—like ignoring how its predictions affect its future computation."  
  4. **"Can’t we precompute everything offline?"**  
     *When to cut off:* During Step 4.  
     *Response:* "In a dynamic world, precomputation fails. The robot’s self-model must evolve, but self-updates consume resources it’s simultaneously modeling."  
  5. **"This only matters for self-aware AI"**  
     *When:* Early in Q&A.  
     *Response:* "Nope—a PID controller tuning its own gains faces embeddedness. Self-reference isn’t about consciousness; it’s about feedback loops."  

  **Your guess was spot-on.** Add misconception #4 above—this group will assume static solutions.

  ---

  ### 4. Check (80 words)  
  **End with this question:**  
  *"Why can’t our warehouse robot perfectly simulate the entire warehouse, including itself, to plan flawlessly?"*  

  **Sign of understanding:**  
  They must identify **two issues**:  
  1. **Regress**: Simulating itself simulating the warehouse requires simulating the simulation, ad infinitum.  
  2. **Resource contention**: The simulation consumes computation/energy, altering the real warehouse (e.g., slowing other processes).  
  If they only cite complexity or partial observability, revisit Step 4.

  ---

  ### 5. What to Leave Out (100 words)  
  **Explicitly rule out:**  
  - **Self-reference paradoxes** (e.g., Löb’s theorem, "this statement is false"): *"These are fascinating, but today we’re focusing on* practical *consequences like modeling gaps, not logical limits."*  
  - **Decision theory puzzles** (e.g., Newcomb’s Paradox): *"These explore ideal choices, but embeddedness is about* feasibility*—what agents* can *do given their constraints."*  
  - **Solutions** (e.g., hierarchical RL, meta-learning): *"We’re defining the problem today. Next session, we’ll critique approaches."*  
  **Frame it as:** "Embedded agency isn’t a solved puzzle—it’s an open *cluster* of problems. We’re mapping the territory, not touring cities."

  ---

  ### 6. Settled vs Contested (150 words)  
  **Settled (non-controversial):**  
  - Agents are always part of their environment (no "Cartesian boundary").  
  - Self-models cannot be fully complete/accurate (due to finite resources and regress).  
  - This affects real systems (e.g., robots, algorithms tuning hyperparameters).  

  **Contested/Program-Specific:**  
  - **"Cartesian boundary" framing:** Some argue it’s a strawman; standard RL doesn’t assume literal externality.  
  - **Severity of limitations:** Opinions vary on how severely self-reference constrains agents (e.g., is it a mild engineering hiccup or a fundamental barrier?).  
  - **Scope:** MIRI’s research program treats this as existential for AGI safety; others see it as niche systems theory.  
  - **Self-modeling unavoidability:** Some contend agents can avoid self-modeling (e.g., via hardcoded policies).  

  **State clearly:** "We’re discussing shared foundations—not endorsing one group’s agenda. The core tension (self-in-world) is widely accepted; its implications aren’t."

  ---

  **Delivery tips:**  
  - **Whiteboard flow:** Draw the standard RL loop → cross out "external reward" → add the agent *inside* the environment → show self-model arrows looping back → add "???" at the regress point.  
  - **Interruptions:** If they jump ahead, say: "Hold that thought—let’s build the steps so we all share a baseline."  
  - **Pacing:** Spend ~30 mins on Steps 1–2, 30 mins on Steps 3–4 + misconceptions, 20 mins on discussion/check, 10 mins on wrap-up.  

  This structure forces engagement with the core tension while respecting their expertise. Good luck!
