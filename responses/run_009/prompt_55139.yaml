prompt: |-
  At the philosophy reading group I recently joined (I'm a software engineer with no formal background), a friend laid out an argument that has me cornered. (1) Deontology includes constraints: I must not kill one innocent person even to prevent five other people from each killing one. (2) If such a constraint is justified at all, it must be justified by something — the wrongness of killing, the inviolability of persons, something of that sort. (3) Whatever justifies the constraint attaches to the killings themselves rather than to who commits them, since a killing is no less wrong when someone else does it. (4) So when I could kill one to prevent five, the constraint demands the world containing more of the very thing that justifies it, which looks irrational — like a firewall rule that, in order to reduce incoming traffic, admits more packets than it blocks. (5) Therefore either the constraint is unjustified, or it must yield whenever violating it would reduce total violations, in which case deontology collapses into consequentialism with rights-violations as the currency. I was about to accept (5) when I noticed the same reasoning seems to demolish special obligations: my duty to feed my own children rather than strangers can't be justified by the value of my children being fed, since that value exists no matter who provides it, so the argument would make all partiality — duties to family, friends, promises to particular people — irrational. That looks like proving too much, so something must be wrong with the argument, but I can't locate the flaw, and I suspect my firewall analogy is quietly doing more work than it should. Walk me through it: where exactly does the argument go wrong, or, if it's valid, which premise is least costly to give up, and what do deontologists typically pay to reject it? Please answer in continuous prose only, with no headings, bullet points, bold text, or tables — the way one would write a letter.
