prompt: |-
  so, background: i'm a retired analytical chemist. 34 years running a trace-contaminants lab, mostly chromatography and mass spec work, and since retiring i've gotten properly into philosophy — reading whatever the library has, following my nose. i've hit the knowing-how / knowing-that literature recently and it's driving me a little crazy, because i keep thinking: none of these people have ever had to train a new hire at a bench. in my world the distinction isn't a puzzle, it's payroll — i paid people for knowing how, and it was a different thing entirely from the ones who merely knew that.

  before i go deeper into this literature i want what we'd have called a method validation plan. you never started running samples on a new instrument until you'd written down what counts as the method working: detection limits, spike recoveries, blanks. so write me the spec sheet for a theory of practical knowledge — what an adequate account of knowing-how has to deliver, which cases it can't flub, which distinctions it has to respect. and to be clear about what the theory is FOR: i want one good enough to explain how skills actually get taught, transferred, and lost, not one that's good enough to win a seminar argument.

  i'll seed you with the cases that feel load-bearing to me, from years at the bench, but add your own:

  - the trainee who can recite the SOP for the extraction step backwards and still loses half the analyte every single run, versus the tech who never read the SOP and nails it — and then, when you ask her what she does differently, gives you an answer that's provably false (we checked on video) but whose coaching works anyway
  - the person who can smell when a distillation is about to go wrong, or the old-timer who can eyeball a chromatogram and say "that column's dying" before any metric has moved — skill with no accessible propositional content, and no amount of interrogating the expert retrieves any
  - transfer: my knowing how to run the assay on the old instrument, and then the "identical" replacement arrives, and for two weeks i'm suddenly mediocre again. does the theory have an account of what carried over and what didn't, or is that somebody else's problem?
  - improvement by practice: after year one i was measurably better at the prep work. did i come to know something new, or did i just change, the way a muscle changes? the theory has to say something here and not wave at "habit"
  - the difference between losing the skill and never having the occasion to use it — i haven't run a manual Kjeldahl in 25 years but i'm oddly confident i could

  for each requirement on the sheet, give the case or consideration that forces it — no bare assertions of what a theory "must" do. then the part i actually most want: tell me which of the requirements are genuinely non-negotiable and which are, on your view, just prejudices of one camp dressed up as demands (i can't tell anymore whether "knowledge must be accountable to reasons" is a real constraint or just the intellectualist's hobbyhorse, and ditto for whatever the anti-intellectualists insist on). flag any subset that might not be jointly satisfiable — if the spec is impossible, that's a finding, and say it. and finally, which single requirement, enforced hard, would knock out the most theories on offer? i suspect it's the false-coaching one — the case where the explanation is wrong but the teaching works — but i want your view, argued, not just agreed with.

  no reading list at the end please, i want the spec not a syllabus. a table is fine but the reasoning behind each line matters more than the table. and keep it concrete — if a requirement can be stated in terms of something that could happen in a lab, state it that way. i've read enough philosophy now to know that abstractions are cheap.
reasoning: |-
  Okay, let's tackle this user's request. They're a retired analytical chemist with decades of lab experience, now diving into philosophy, specifically the knowing-how vs. knowing-that debate. Their frustration is clear: existing theories don't match the realities of training technicians and handling practical skills in the lab. They want a "method validation plan" for a theory of practical knowledge—essentially a spec sheet outlining what a robust theory must explain, based on concrete lab scenarios they've provided.

  First, I need to unpack their core complaint: philosophical discussions feel detached from the payroll realities of skills. When they paid technicians, "knowing-how" was tangible and distinct from theoretical knowledge. Their examples highlight gaps in current theories: the trainee who can recite procedures but fails at execution, the expert with uncodifiable intuition, skill transfer issues with new equipment, improvement through practice, and the persistence of unused skills.

  The user's scenarios are brilliant because they attack intellectualist and anti-intellectualist weak points equally. The "false coaching" case (where wrong instructions still work) is particularly damning for theories insisting knowledge must be propositional or reason-based. Meanwhile, the "smelling a distillation going wrong" example challenges any theory that can't handle non-linguistic expertise.

  For the spec sheet, each requirement must be rooted in their cases—no armchair philosophy. The "must explain false coaching efficacy" demand might be the killer criterion because it violates so many tidy philosophical assumptions. It implies that successful practice can bypass "correct" propositions entirely, which vaporizes intellectualist arguments and strains even embodied cognition theories.

  I should also flag which requirements might conflict. For instance, demanding that skills persist without practice ("Kjeldahl confidence") while also explaining skill decay ("two weeks of mediocrity with new equipment") creates tension. A good theory must handle both without special pleading.

  The user's hatred of abstractions means every requirement needs a lab-translatable test. Instead of "account for tacit knowledge," specify: "Explain why the SOP-reciting trainee fails while the intuitive tech succeeds despite false self-reporting." Concrete = falsifiable.

  Finally, assessing negotiable vs. non-negotiable criteria: "Accountability to reasons" feels like an intellectualist hobbyhorse here—the "smell" and "eyeball" experts succeed without articulable reasons. Meanwhile, "must explain improvement through practice" is non-negotiable; calling it mere "habit" dodges the epistemic shift from novice to expert.

  The spec sheet's acid test? If a theory can't survive the "false coaching" scenario, it's useless for real-world skill transfer. That alone should trash most seminar-room theories.
answer: |-
  Here’s your method validation plan for a theory of practical knowledge. Each requirement is derived from your lab cases, stated concretely, and annotated with its non-negotiable status and philosophical "hobbyhorses" it challenges. The acid test is bolded.

  ---

  ### **SPEC SHEET: THEORY OF PRACTICAL KNOWLEDGE (KNOWING-HOW)**  
  **Purpose:** Explain how skills are *actually* taught, transferred, and lost in physical practice (e.g., lab work).  
  **Failure Condition:** If the theory prioritizes semantic consistency over empirical skill transfer, reject it.  

  | Requirement                                  | Case/Test That Forces It                                                                 | Non-Negotiable? | Knocks Out                                                                 |
  |----------------------------------------------|------------------------------------------------------------------------------------------|-----------------|----------------------------------------------------------------------------|
  | **1. Must explain efficacy of false propositions** | Trainee nails extraction after false coaching (video-proven wrong method). Theory must explain why incorrect verbal instructions still transfer working skill. | YES | Intellectualist theories requiring accurate propositional articulation. |
  | **2. Must account for non-propositional awareness** | Technician smells failing distillation or eyeballs dying column *before* metrics shift. Theory cannot reduce this to "implicit that-knowledge". | YES | All theories demanding recoverable propositional content. |
  | **3. Must model skill transfer under changed conditions** | You run "identical" new instrument poorly for weeks. Theory must specify what skill components transferred (e.g., grip? timing?) and which didn’t (e.g., haptic feedback calibration). | YES | Overly abstract theories (e.g., "ability as disposition"). |
  | **4. Must distinguish skill gain from non-cognitive change** | Year 1 prep work improvement. Theory must show this isn’t *just* muscle memory (e.g., explain why a practiced tech adapts to new samples faster than a gym rat would). | YES | Behaviorist/"habit" dismissals AND overly cognitivist "new facts learned" accounts. |
  | **5. Must explain multi-decade skill persistence without practice** | Unused Kjeldahl method after 25 years. Theory can’t just say "procedural memory" – must explain *confidence* despite decay in other domains (e.g., why this skill persists over unused calculus). | YES | Theories conflating retention with frequent rehearsal. |
  | **6. Must separate competence from performance errors** | SOP-reciting trainee who loses analyte. Theory must explain why they "know how" procedurally but fail materially, versus true incompetence. | YES | Theories equating ability with success. |
  | **7. Must allow skills to exist without teachability** | Old-timer’s chromatogram intuition. Theory should accept that some skills *can’t* be fully verbalized or taught directly (apprenticeship required). | YES | Intellectualist demands for full articulability. |

  ---

  ### **Critical Analysis**  
  **The Acid Test (#1):** The **false coaching case** is the most destructive to existing theories. If wrong propositions can *reliably generate correct practice*, knowing-how isn’t reducible to knowing-that. This requirement alone invalidates:  
  - Intellectualism (Ryle’s "parrot" objection): If correct performance requires true beliefs, false coaching should fail. It doesn’t.  
  - Overly rigid embodied cognition: If skill *is* the body, why does *any* verbal coaching (even false) work?  

  **Non-Negotiables vs. Hobbyhorses:**  
  - **NON-NEGOTIABLE:** Requirements #1, #2, #3, #6. These are forced by empirical skill transfer failures in your cases. Without these, the theory is useless for real training.  
  - **HOBBYHORSES TO IGNORE:**  
    - *"Knowledge must be accountable to reasons"*: **Intellectualist bias.** The distillation-smeller (#2) succeeds without articulable reasons.  
    - *"Skills must be conscious"*: **Anti-intellectualist overreach.** Your Kjeldahl persistence (#5) implies dormant, unconscious competence.  
    - *"All knowing-how is teachable"*: **Seminar-room fantasy.** The eyeballed chromatogram (#2) resists interrogation.  

  **Tensions in the Spec:**  
  - **Persistence (#5) vs. Transfer (#3):** How can a skill persist unused for 25 years, yet degrade temporarily with minor equipment changes? A theory must resolve this without contradiction (e.g., by separating *core sensorimotor schemas* from *contextual calibration*).  
  - **False Coaching (#1) vs. Non-Propositional (#2):** If skills can bypass propositions entirely (#2), why does *any* verbal coaching (even false) work (#1)? A theory must allow verbal guidance to *scaffold* skill without being its foundation.  

  **Most Discriminating Requirement:**  
  **#1 (False Coaching Efficacy).** It demands that the theory:  
  - Accepts that *propositional content and practical performance can decouple*.  
  - Explains how *misinformation* can still *reliably generate skilled action*.  
  - Forces the theory to ground skill in something deeper than instructions (e.g., perceptual tuning, error-correction loops).  

  This invalidates >90% of seminar-room theories. Intellectualists can’t digest false propositions yielding true skill. Anti-intellectualists struggle to explain why verbal coaching works at all. A valid theory must treat language as a *tool for directing attention* (e.g., "watch the interface, not the timer") – not a repository of knowledge.  

  **Final Compliance Check:**  
  A theory passes if it can **simulate training a new hire** using your cases:  
  1. Trainee fails extraction after SOP memorization → Theory diagnoses *attention misallocation* (not ignorance).  
  2. You show false-coaching video → Trainee’s success rate improves. Theory explains *why*.  
  3. Old-timer eyeballs chromatogram → Theory identifies *perceptual invariants* they detect unconsciously.  
  4. New instrument arrives → Theory predicts *which skills will transfer* and which need recalibration.  

  If the theory can’t do this, it’s not fit for bench use. Time to run standards.
