prompt: |-
  I build quantitative risk models for industrial equipment, and a recurring embarrassment in that work is the unobserved failure mode: a component that has never failed in the field, operated in a new regime, where the analysis nonetheless requires a numerical probability. Analysts on my team reach for some version of spreading probability evenly over their ignorance, and they get different answers depending on which quantity they spread it over — uniform over the failure rate, or over its logarithm, or over the mean time between failures — and I have stopped believing that any of them can justify their particular choice. Before I read any more about the principle of indifference, I want the specification it is supposed to be measured against. Write me the desiderata: what any rule for assigning probabilities in a state of ignorance has to deliver, with the case or consideration behind each requirement.

  At minimum, the list should say something definite about the following: whether the rule must yield a unique answer at all, or whether a range or set of distributions counts as a legitimate output; whether it must give the same answer under reparameterization of the variable and under different but equivalent descriptions of the same setup; how it must treat problems with genuine physical symmetries — if the symmetry of a die forces one-sixth on each face, the rule had better return that, and if the problem has no such symmetry, the rule had better not pretend it does; what to do about the chord problem, where drawing a random chord in a circle by three equally natural procedures gives 1/2, 1/3, and 1/4; and how to handle the water-and-wine case, where spreading evenly over the volume of one constituent gives a different answer than spreading evenly over the ratio between the two. Then there are the requirements my use case imposes: the output must be usable downstream in a risk model — a number or a distribution, not a lecture on the philosophy of probability — and it must not manufacture information, since in my line of work a number that merely looks informed is actively dangerous.

  For each desideratum, say what makes it a genuine requirement rather than a prejudice of one camp, and mark which are non-negotiable and which are negotiable for my purposes. If some subset of the desiderata is jointly unsatisfiable, say so and identify the subset — that is the part I most want to see, because it would tell me whether the disagreement on my team is substantive or just everyone violating the same constraint in different directions. Then, briefly, hold the main contenders up against the list: naive indifference over a chosen partition; Jaynes-style invariance under transformation groups; maximum entropy relative to stated constraints; reference priors; replacing the single distribution with a set of them; and the deflationary view that ignorance simply does not determine probabilities, so the demand for a rule rests on a mistake. Keep the scoring to a short paragraph — the list is the deliverable, and the scoring is only there so I can see which requirements do the most exclusion.
reasoning: |-
  Okay, the user builds quantitative risk models for industrial equipment and faces the challenge of assigning probabilities to unobserved failure modes. The main issue is that different analysts on their team use different methods—uniform over failure rate, its logarithm, or MTBF—leading to inconsistent results. They want a set of desiderata to evaluate any rule for assigning probabilities under ignorance, including handling reparameterization, symmetries, paradoxes like the chord problem, and practical usability in risk models.

  First, I need to recall the key problems in probability assignment under ignorance. The principle of indifference often leads to contradictions, as seen in Bertrand's paradox (chord problem) and the water-wine paradox. The user needs clarity on what requirements a rule must meet. They mentioned several critical points: uniqueness, reparameterization invariance, symmetry handling, paradox resolution, and practical applicability.

  The user's explicit requirements include non-manufacturing of information and downstream usability. They also want to know if some desiderata conflict, making some rules inherently flawed. The deeper need here is to prevent dangerous overconfidence in manufactured probabilities, which could lead to underestimating risks in industrial settings.

  I start listing desiderata. Uniqueness is negotiable; a range might be acceptable. Reparameterization invariance is non-negotiable to avoid inconsistencies like different uniform priors. Symmetry compliance is also essential; if symmetries exist, the rule must reflect them. Paradox resolution is necessary to handle cases like the chord problem. The water-wine case tests consistency across different descriptions. Non-manufacturing of information is critical—no fake precision. Downstream usability means outputs must be actionable, like a distribution.

  Now, conflicts: Reparameterization invariance and symmetry compliance might clash with uniqueness, as seen in Bertrand's paradox. Here, group invariance gives different answers based on chosen symmetries. Also, non-manufacturing and usability might conflict; a set of distributions is safer but harder to use.

  Evaluating contenders: Naive indifference fails reparameterization and paradoxes. Group invariance handles symmetries but not always uniquely. MaxEnt needs constraints and may manufacture info. Reference priors are parameterization-dependent. Sets of distributions avoid manufacturing but are complex. The deflationary view denies probabilities, which isn't practical for risk models.

  The key conflict is between reparameterization invariance and uniqueness. No rule satisfies both in all cases. For the user, admitting ignorance via sets might be best, though usability suffers. They need to accept that some problems lack unique solutions, and forcing one is dangerous.
answer: |-
  Here are the desiderata for assigning probabilities under ignorance, grounded in epistemic rationality and practical risk modeling needs. Requirements marked **(N)** are non-negotiable for your use case; **(C)** are contextually negotiable.

  ---

  ### **Core Desiderata**
  1.  **Non-Manufacture of Information (N)**  
      *The rule must not introduce artificial precision.* Output probabilities should reflect *only* the specified ignorance, not inject unwarranted assumptions. Justification: In risk modeling, spurious precision is dangerous (e.g., a "clean" but arbitrary number may mislead decisions). Output must be max-entropic or set-valued if needed.

  2.  **Reparameterization Invariance (N)**  
      *The output must be consistent under equivalent redescriptions of the problem.* If θ and φ = g(θ) are equivalent parameterizations (e.g., failure rate λ vs. MTBF τ = 1/λ), probabilities should transform coherently. Justification: Physical reality doesn’t change with mathematical conventions; inconsistency (e.g., uniform on λ vs. uniform on τ) is a sign of arbitrariness.

  3.  **Symmetry Compliance (N)**  
      *When verifiable physical symmetries exist, the rule must replicate them.* If a die is symmetric, P(face)=1/6. If no symmetries exist, it must *not* impose symmetry. Justification: Symmetries are objective physical constraints; ignoring them is irrational, while imposing false symmetries manufactures information.

  4.  **Paradox Resolution (C)**  
      *The rule must address known indifference paradoxes defensibly.*  
      - **Bertrand’s chord problem:** Must explain why 1/2, 1/3, 1/4 arise or avoid the inconsistency.  
      - **Water-wine mixing:** Must not yield contradictory results for equivalent ratio/volume descriptions.  
      Justification: These reveal flaws in naive applications; a viable rule must either resolve them or justify why they’re ill-posed.

  5.  **Downstream Usability (N)**  
      *Output must be actionable in risk models.* A single distribution (with sensitivity checks), a confidence set, or a bounded interval—not just philosophical guidance. Justification: Models require numerical inputs; unusable rules waste effort and delay decisions.

  6.  **Uniqueness (C)**  
      *The rule should ideally yield a unique output, but a *justified set* is acceptable if unavoidable.* Justification: Unique answers simplify models, but forcing uniqueness where none exists violates *Non-Manufacture*. Sets are acceptable if they quantify uncertainty honestly.

  7.  **Contextual Sensitivity (N)**  
      *The rule must incorporate genuine constraints.* If operational regimes imply bounds (e.g., λ > λ_min), outputs must respect them. Justification: Ignoring known constraints is irrational and dangerous.

  ---

  ### **Conflict Identification**
  - **The Inherent Conflict:** **Reparameterization Invariance (N)**, **Symmetry Compliance (N)**, and **Uniqueness (C)** are jointly unsatisfiable in continuous problems with no natural symmetry.  
    - *Example:* Bertrand’s paradox has multiple symmetry groups (rotation, translation, scale-invariance), each giving different probabilities. Forcing uniqueness requires arbitrary symmetry choices, violating Reparameterization Invariance.  
    - *Implication:* Your team’s disagreement stems from this conflict. Rules prioritizing uniqueness (e.g., uniform over λ) violate reparameterization; rules prioritizing invariance (e.g., Jeffreys prior) may violate intuitive symmetries or yield sets.

  ---

  ### **Contender Assessment vs. Desiderata**
  | **Rule**               | **Assessment**                                                                                                                                 |
  |-------------------------|------------------------------------------------------------------------------------------------------------------------------------------------|
  | **Naive Indifference**  | Fails (N): Violates reparameterization (e.g., λ vs. τ), manufactures information, fails paradoxes. *Unusable.*                                |
  | **Transformation Groups** | Partial: Satisfies Symmetry Compliance if correct group is chosen. Fails (N) when no unique group exists (e.g., Bertrand), leading to arbitrariness. |
  | **MaxEnt**              | Partial: Honors constraints (Contextual Sensitivity) but fails (N) under reparameterization. Maximizes artificial precision if constraints are weak. |
  | **Reference Priors**    | Partial: Addresses reparameterization via Jeffreys prior. May violate Symmetry Compliance (e.g., log-normal priors for scale parameters). Outputs unique distributions, risking information manufacture. |
  | **Set-Based Approaches** | Best for (N): Satisfies Non-Manufacture, Reparameterization Invariance (if sets are equivariant). May struggle with Symmetry Compliance but avoids false precision. Usability (N) is weaker (requires multi-model runs). |
  | **Deflationary (No Rule)** | Fails (N): Rejects probability assignment, violating Downstream Usability. Ignores that regulators/models demand numbers. Pragmatically insufficient. |

  ---

  ### **Recommendation for Your Use Case**
  1.  **Prioritize Non-Manufacture and Reparameterization Invariance.** Reject unique distributions unless justified by *physical* symmetries (e.g., identical components).  
  2.  **Use Set-Based Methods:** Output intervals (e.g., failure rate between λ_min and λ_max) or families of distributions (e.g., all priors with E[λ] < c). Propagate uncertainty through models via interval analysis or robust optimization.  
  3.  **Explicitly Document Ignorance:** Report outputs as "bounds due to zero-field data" to prevent misinterpretation.  
  4.  **Leverage Operational Constraints:** Use Contextual Sensitivity (e.g., "λ ≥ 1e-7/hr based on material science") to narrow sets.  

  **Why this works:** Sets satisfy all (N) requirements: they don’t manufacture information, are reparameterization-invariant (if constructed properly), flag true ignorance, and are usable (though clumsier). The chord/water-wine paradoxes become moot—sets contain all "answers" and highlight the indeterminacy. Symmetries are handled ad-hoc but conservatively. The conflict with uniqueness is resolved by accepting indeterminacy where it exists.
