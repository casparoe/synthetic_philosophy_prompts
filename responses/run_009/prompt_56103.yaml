  - For example, someone might think that the covert persuader does not mean (Fork 2 NO) and then for the sleeper car, they say YES (Fork 3 YES) and then for resistant hearer they say NO (Leaf 4). But then we have no branch for spontaneous exclamation in that path. But spontaneous exclamation is in the other branch.

