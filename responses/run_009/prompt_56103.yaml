  ## What is it for a speaker to mean something?  
  ### A Decision Tree for Sorting Intuitions  

  **Instructions:**  
  Answer each question below based *only* on your intuitive reaction to the concrete case described. Do not rely on philosophical labels or theories. Your answers will place you in one of several logical positions about the nature of "speaker meaning" (non-natural meaning).  

  ---

  **Fork 1: Natural vs. Non-Natural Meaning**  
  *Case:* Smoke pours from a forest canopy. A firefighter points and says, "That smoke means fire." Separately, an artist sketches a detailed drawing of a child shivering in the cold and displays it to a charity committee to show the child’s plight.  
  **Question:** Does the drawing mean the child is suffering *in the same way* the smoke means fire?  
  - **YES** → **Leaf 1: Naturalism**  
    *All meaning is "natural meaning" (like smoke or spots). There is no distinct category of non-natural (speaker-driven) meaning. The artist’s drawing is evidence, not communication.*  
  - **NO** → Go to Fork 2.  

  ---

  **Fork 2: Must Meaning Involve Intentional Design?**  
  *Case:* A news article includes a photograph of a refugee in dire straits as proof of hardship. Elsewhere, an activist creates an identical-looking sketch of the same refugee to convey the same idea.  
  **Question:** Does the sketch mean "this person suffers" in a way the photograph does *not*?  
  - **NO** → **Leaf 4: Convention-Based Meaning**  
    *Meaning arises from social conventions, not individual intentions. Both photo and sketch mean the same thing because both are conventional evidence.*  
  - **YES** → Go to Fork 3.  

  ---

  **Fork 3: Can Covert Manipulation Be Meaning?**  
  *Case:* A rival merchant smears dirt on a competitor’s fruit to make it look spoiled. Shoppers avoid it, believing it’s rotten. The merchant ensures no one suspects human involvement.  
  **Question:** By dirtying the fruit, does the rival merchant *mean* "this fruit is spoiled"?  
  - **YES** → Go to Fork 5.  
  - **NO** → Go to Fork 4.  

  ---

  **Fork 4: Must Recognition Be Intended?**  
  *Case:* A soldier facing capture leaves behind a diary written in the enemy’s language. It contains false reports (e.g., "Landmines here!") hoping the enemy will read it, recognize the soldier’s intent to deceive, and flee.  
  **Question:** Does the soldier mean "this area is dangerous" by leaving the diary?  
  - **NO** → **Leaf 6: Deflationary View**  
    *The search for an analysis is misguided. Meaning is irreducible or contextually fluid; no set of conditions captures cases like this.*  
  - **YES** → Go to Fork 6.  

  ---

  **Fork 5: Must Meaning Target Belief?**  
  *Case:* A passenger on a night train places his ticket visibly on his chest while sleeping. He wants the conductor to recognize he doesn’t wish to be disturbed but doesn’t aim to make the conductor *believe* anything.  
  **Question:** By displaying the ticket, does the passenger mean "do not disturb me"?  
  - **YES** → Go to Fork 7.  
  - **NO** → **Leaf 3: Belief-Intention Required**  
    *Meaning requires intending to produce a belief in the hearer. The passenger merely expresses a desire; he doesn’t mean it non-naturally.*  

  ---

  **Fork 6: Is Recognition Sufficient for Meaning?**  
  *Case:* A speaker says, "The bridge is unsafe!" intending listeners to believe her by recognizing her intent. One listener fully grasps her intent but distrusts her and rejects the belief.  
  **Question:** Did the speaker mean "the bridge is unsafe"?  
  - **NO** → **Leaf 2: Strict Gricean**  
    *Meaning requires the speaker to intend that recognition of their intention *causes* the effect (e.g., belief). If recognition fails to cause it (as here), meaning fails.*  
  - **YES** → **Leaf 1: Weakened Gricean**  
    *Meaning requires intending recognition to play a role in the hearer’s reasoning, but the effect need not occur. The speaker meant it, even if the hearer resists.*  

  ---

  **Fork 7: Can Meaning Lack Any Intention?**  
  *Case:* A person stubs their toe and shouts "Ouch!" reflexively. Separately, a cashier says "Hello!" automatically to a customer.  
  **Question:** Do these utterances mean "I am in pain" or "I greet you" non-naturally?  
  - **YES** → **Leaf 4: Convention-Based Meaning** (Revisited)  
    *Meaning depends on conventions, not the speaker’s mental state. Automatic or intentionless acts mean if they fit social patterns.*  
  - **NO** → **Leaf 5: Recognition-Intention Hybrid**  
    *Meaning requires the speaker to intend recognition of an intention (to produce *any* effect, not just belief). Spontaneous acts don’t qualify, but the sleeper car case does.*  

  ---

  **Logical Space & Unoccupied Positions**  
  - **Gaps:** No branch occupies "YES to covert manipulation (Fork 3) + NO to spontaneous meaning (Fork 7) + YES to non-belief cases (Fork 5)". This reflects *neglect*—few defend that meaning requires intentions but allows non-mental effects *and* rejects conventions.  
  - **Indistinguishable Leaves:**  
    - *Leaf 4 (Convention-Based)* and *Leaf 5 (Hybrid)* agree on spontaneous cases (Fork 7) and the sleeper car (Fork 5). They diverge only on whether conventions *replace* intentions.  
    - *Leaf 1 (Weakened Gricean)* and *Leaf 5 (Hybrid)* agree on the resistant hearer (Fork 6) but diverge on whether non-belief cases (Fork 5) count as meaning.  

  ---

  ### Speculative Question: Can Artifacts "Mean" Non-Naturally?  
  For each leaf, consider:  
  - A recorded airport announcement: "Flight 207 is departing."  
  - A printer that outputs "I am broken" *only* when jammed.  
  - A language model generating "I feel sad" with no consciousness.  

  | Leaf                          | Artifact Meaning? | Reasoning |  
  |-------------------------------|-------------------|-----------|  
  | **1: Weakened Gricean**       | No                | No intentions → no meaning. Outputs are causal, not intentional. |  
  | **2: Strict Gricean**         | No                | Artifacts lack reflexive intentions (to cause effects via recognition). |  
  | **3: Belief-Intention Required** | No             | Systems don’t "intend" to induce beliefs; they simulate speech. |  
  | **4: Convention-Based**       | **Yes**           | Meaning depends on conventions, not minds. If society treats outputs as communicative, they mean. |  
  | **5: Hybrid**                 | No                | Recognition-intention structure is absent; artifacts don’t "aim" for recognition. |  
  | **6: Deflationary**           | Contextual        | "Meaning" is a flexible practice; artifacts might mean in some contexts but not others. |  

  **Debate Prompt:** *Does any account convincingly explain why we treat artifacts as meaningful—or is this a category error?*  

  ---  
  *Handout designed for mid-level philosophy of language seminar. Cases are self-contained; no external references needed. Tree tests intuitions on 8 core cases with 6 terminal positions. Feedback welcomed!*
