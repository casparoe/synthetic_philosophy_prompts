  What is it for a speaker to mean something? A Decision Tree

  Start with cases to anchor the forks. We'll present the cases as we go.

  Fork 1: Natural vs. Non-natural meaning.
  - Case A (Natural): A doctor sees red spots on a patient and says, "These spots mean measles." The spots are a natural sign of the disease.
  - Case B (Non-natural): An artist draws a detailed picture of a man in dire straits and displays it to the public to show the man's condition. The drawing is produced intentionally to communicate.
  - Question: Is the kind of meaning in Case B the same as in Case A?
    - Answer YES: Leaf 1: Naturalism. All meaning is natural meaning. There is no separate category of non-natural meaning (speaker meaning).
    - Answer NO: Go to Fork 2.

  Fork 2: Covert Persuader.
  - Case: A rival merchant sneakily smears a competitor's wares so they appear spoiled. He does not leave any sign of human involvement, and he hopes that shoppers will see the wares and avoid them, without ever suspecting foul play.
  - Question: Does the merchant mean that the wares are spoiled? (Is he non-naturally meaning that by his action?)
    - Answer YES: Leaf 2: Affect-Intention Account. For a speaker to mean something, it is sufficient that they intend to affect the hearer in some way (e.g., to believe something or to act accordingly). Recognition of the intention is not necessary.
    - Answer NO: Go to Fork 3.

  Fork 3: Sleeper Car (Is an intention to produce a belief required?).
  - Case: A passenger in a sleeper car, when the conductor approaches, displays his ticket in a clear and prominent manner, making it obvious that he does not wish to be disturbed. He wants the conductor to recognize that he does not wish to be disturbed and to leave him alone, but he does not necessarily intend the conductor to believe that he has that wish (he just wants the conductor to act on the recognition).
  - Question: Does the passenger mean that he does not wish to be disturbed?
    - Answer YES: Go to Fork 4.
    - Answer NO: Go to Fork 5.

  Fork 4: Resistant Hearer (for cases where we allow meaning without belief intention).
  - Case: A speaker says to a hearer, "It's raining outside," intending that the hearer believe it is raining by recognizing that intention. The hearer does recognize the intention but, because of that recognition (perhaps thinking the speaker is manipulative), refuses to believe it.
  - Question: Did the speaker mean that it was raining?
    - Answer YES: Leaf 3: Weakened Gricean. The speaker means something if they intend to produce an effect (which may be a belief or something else) by means of the hearer's recognition of that intention. However, it is not necessary that the effect is achieved.
    - Answer NO: Leaf 4: Strict Gricean. The speaker means something only if they intend that the hearer's recognition of the intention causes the effect (e.g., the belief), and if the effect does not occur (or cannot occur) due to the recognition, then the speaker did not mean it.

  Fork 5: Spontaneous Exclamation (for those who require an intention to produce a belief).
  - Case: A person stubs their toe and shouts "Ouch!" reflexively, without any intention to communicate.
  - Question: Does the speaker mean that they are in pain?
    - Answer YES: Leaf 5: Convention-Based. Non-natural meaning is grounded in social conventions and does not require specific intentions of the speaker at the time of utterance.
    - Answer NO: Leaf 6: Intention to Produce Belief with Recognition. For a speaker to mean something, they must intend to produce a belief in the hearer by means of the hearer's recognition of that very intention.

  Leaves:
  1. Naturalism
  2. Affect-Intention Account (covert persuader counts)
  3. Weakened Gricean
  4. Strict Gricean
  5. Convention-Based
  6. Intention to Produce Belief with Recognition (standard Gricean without broadening to other effects)

  Now, we have six leaves. We can merge or adjust, but this is within the range.

  Cases covered:
  - Natural meaning: Case A in Fork 1.
  - Drawing vs. photograph: Case B in Fork 1.
  - Rival merchant: Fork 2.
  - Sleeper car: Fork 3.
  - Resistant hearer: Fork 4.
  - Spontaneous exclamation: Fork 5.
  - We also have the soldier's diary: it should be non-controversial for non-natural meaning. We can assume it is covered in the paths that require intention for recognition (Fork 2 NO branch).

