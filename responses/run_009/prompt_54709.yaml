prompt: |-
  I cover science and ideas for a mid-size outlet, and the fights I actually have with my editors are never about fabricating things — nobody wants to print a false claim. The fights are about sentences that are technically true but built to make readers believe something stronger or just different: headlines like "chemical found in coffee linked to cancer" for a relative risk of 1.02, or "half of new teachers quit within five years" when that's counting retirements. The philosophy of language has this whole literature on the difference between lying (asserting what you believe false) and misleading (saying something true, or not asserting at all, while engineering a false belief) — and some people argue the misleading route is actually worse, morally, because it makes the reader do the deceiving to themselves. I want that turned into something usable. Please write a decision procedure I can run on a headline or lede in ten minutes before deadline: what to check, in what order, what counts as failing, and where the procedure has to stop and hand off to a human judgment call — especially the question of whether misleading-by-implication is as bad as lying, which I suspect is a values question no checklist can settle. It needs a few test sentences I can hold new drafts against, and it has to be honest about the case it can't handle: I can never know for sure what a reader will infer. Then run it on three real-ish examples: the coffee/cancer headline, a lede that says a startup "has yet to rule out" a safety problem that no one has ever alleged (true! also pure insinuation), and one where I expect the answer I won't like — our house style of hedged clickbait like "what X may be doing to your brain," which is carefully designed to pass every fact-check while doing the work of a false claim. Say plainly what the procedure concludes on that last one and whether I should take it up with my editor or live with it.
reasoning: |-
  Okay, I need to help a science journalist who deals with misleading headlines and ledes. They want a decision procedure to evaluate whether a piece is technically true but potentially deceptive. The key issues involve implications that might lead readers to false beliefs, even if the statement itself is factual.

  First, I should understand the core problem: the difference between lying and misleading. Lying is stating something false, while misleading uses true statements to create a false impression. The user mentioned that some argue misleading is worse morally because it makes readers deceive themselves. This needs to be reflected in the procedure.

  The user provided examples: a headline linking a chemical in coffee to cancer with a tiny risk increase, stating half of new teachers quit when retirements are included, and a startup insinuating safety issues without evidence. They also mentioned their outlet's "hedged clickbait" style, like "what X may be doing to your brain," which is factually accurate but implies harm.

  I should design a step-by-step checklist that's practical for a 10-minute deadline review. It needs to be methodical, starting with verifiable facts and moving to implications. Since not everything can be automated, I'll include points where human judgment is necessary, especially regarding moral implications.

  Key elements to check:
  1. **Factual Accuracy:** Confirm every part of the statement is true. If false, it's an automatic fail.
  2. **Context and Scope:** Assess if the statement omits crucial context (like risk magnitude or definitions).
  3. **Implication Analysis:** Evaluate what a reasonable reader might infer. This is subjective, so it's a judgment call.
  4. **Comparative Harm:** Consider if the misleading effect is as bad as lying, which involves values and requires editorial discussion.

  For the test cases:
  - **Coffee/Cancer Headline:** Factually true but implies significant risk. The relative risk is 1.02, negligible. This should fail due to omission of context.
  - **Startup Safety Insinuation:** Technically true ("has yet to rule out"), but no allegations exist. This creates suspicion unfairly. Should fail on implication.
  - **Hedged Clickbait:** Phrased as "may be doing," so it's factual but implies harm. The procedure might flag it as passing technically but needing human judgment on ethics. The user should discuss this with editors since it's a pattern.

  The procedure must acknowledge limitations: I can't predict all reader inferences, and moral judgments are personal. Including test sentences will help the user apply it consistently.

  Finally, structuring the response clearly: outline the steps, apply to examples, and be honest about where the checklist stops. For the clickbait case, state plainly that it passes factually but may be ethically questionable, advising a conversation with editors.
answer: |-
  Here's a battle-tested decision procedure for "technically true but potentially misleading" science/ideas journalism headlines and ledes, designed for a <10-minute deadline crunch. It prioritizes flagging deception-by-implication while acknowledging inherent limits. Keep your test sentences handy for quick comparison.

  **The "Truthful But Toxic?" Checklist**

  **Core Principle:** Our goal isn't just avoiding falsehoods, but avoiding engineering false beliefs using technically true statements. When implications *strongly* and *predictably* point readers towards a conclusion unsupported by the facts, it's a fail. Moral weight (lying vs. misleading) is a values call beyond this checklist, but the procedure flags where that conversation *must* happen.

  **Run this order (5-7 mins):**

  1.  **Literal Truth Check (Non-Negotiable Fail):**
      *   **Check:** Is every *explicit factual claim* in the sentence verifiably true *right now*? Check sources, definitions, stats.
      *   **Fail if:** Any claim is false, unverified, misrepresents source data (e.g., misquoting a study abstract), or uses undefined jargon ambiguously.
      *   **Judgment Call?** No. Fix or kill. *Stops here if fail.*
      *   **Test Sentence Anchor:** Compare to your known-good factual baseline.

  2.  **Context & Scope Check (Major Red Flag):**
      *   **Check:** Does the sentence omit crucial context or narrowly define terms to distort the *significance* or *generality* of the truth? Look for:
          *   Missing magnitude (tiny risks presented as significant).
          *   Missing baselines or comparisons.
          *   Selective timeframe cherry-picking.
          *   Overly broad implications from narrow findings.
          *   Conflated categories (e.g., "quit" including retirement).
          *   "Weasel words" masking absence of evidence ("linked to," "may," "some suggest," "has yet to rule out").
      *   **Fail if:** The omission/definition *dramatically* changes the reasonable interpretation of the fact's importance or applicability, rendering the *implied message* highly misleading relative to the full context. The reader is very likely to overestimate significance or generality.
      *   **Judgment Call?** Yes, on the *degree* of distortion. Does the omission feel like a magician's distraction? If yes, fail. Use test sentences for calibration.
      *   **Test Sentence Anchor:** Hold against examples like your coffee headline (omits trivial risk) or teacher headline (omits retirement inclusion).

  3.  **Implication & Framing Check (Values Trigger):**
      *   **Check:** What is the *most likely* main takeaway for a reasonably attentive but non-expert reader? Does the framing (word choice, placement, emotional language, proximity to other claims) actively *engineer* a belief that goes beyond or even contradicts the literal truth?
          *   Does it imply causation where only correlation exists?
          *   Does it manufacture doubt or fear where none is warranted by evidence?
          *   Does it present speculation as a serious concern?
          *   Does it unfairly malign a person/group/product via insinuation?
      *   **Fail if:** The framing *strongly and deliberately* pushes the reader towards a specific, stronger, or different conclusion that the literal truth *does not support* and which would likely change their understanding or behavior. The sentence feels like it's *winking* at the reader.
      *   **Judgment Call?** **CRITICAL.** This is the core "misleading vs. lying" tension. Ask:
          *   "Is the *primary function* of this phrasing to plant a seed of a specific false(ish) idea while giving us plausible deniability?"
          *   "Would I feel tricked if I read this and then learned the full context?"
          *   "Does this pass the 'sniff test' of intellectual honesty?" If heavy doubt remains, fail.
      *   **Test Sentence Anchor:** Compare to your startup example ("has yet to rule out" an unalleged problem – pure insinuation).

  4.  **Harm & Intent Check (Editorial Conversation Required):**
      *   **Check:** If it passed 1-3 (technically true, context acceptable, implication not *egregiously* engineered), but still feels icky or clickbaity:
          *   What potential harm could the misleading implication cause? (Unnecessary fear, eroded trust, unfair damage, wasted resources?)
          *   Is this our editorial house style, or an exceptional case?
          *   Is the benefit (clicks, engagement on an important topic) worth the cost in accuracy/trust?
      *   **Action:** This doesn't trigger an automatic *fail* in the checklist, but **mandates** a conversation with your editor *before* publication. The "Is misleading-by-implication as bad as lying?" question lives here. The checklist flags it, humans must wrestle with it.
      *   **Judgment Call?** Entirely. Values, audience, and outlet mission dominate.

  **Inherent Limitations (Acknowledge & Accept):**
  *   **Reader Inference is Unknowable:** We can only assess *likely* interpretations based on common sense and experience. We cannot predict every reader.
  *   **"Reasonable Reader" is Fuzzy:** Judgment is required at steps 2 & 3.
  *   **Moral Weight is Subjective:** Step 4 is pure editorial philosophy. The checklist identifies the *need* for that discussion, not the outcome.
  *   **Time Constraint:** This focuses on glaring issues. Nuanced deceptions might slip through; perfection is impossible under deadline.

  **Testing on Your Examples:**

  1.  **Headline: "Chemical Found in Coffee Linked to Cancer" (RR=1.02)**
      *   **Step 1:** Passes. A chemical exists, a study found a statistical link (RR 1.02 is technically a link, however weak).
      *   **Step 2:** **FAIL.** Omits the *magnitude* of the risk (RR 1.02 is negligible, likely noise). Omits crucial context about dose, study limitations, and absolute risk. The narrow truth implies broad significance.
      *   *Conclusion:* Kill or rewrite (e.g., "Miniscule cancer risk link found for coffee compound in large study").

  2.  **Lede: Startup 'has yet to rule out' safety problem that no one has ever alleged.**
      *   **Step 1:** Passes. If they truly haven't investigated it *at all*, they "have yet to rule it out." No false claim.
      *   **Step 2:** Passes/Fail Edge. The scope is narrow but accurate. The *omission* is that *nobody suspects this problem*. The phrase itself is the weapon.
      *   **Step 3:** **FAIL.** The framing ("has yet to rule out") is *designed* to imply there's a *reason* to suspect the problem or that it's a known concern needing investigation. It manufactures doubt where none exists. Pure insinuation.
      *   *Conclusion:* Fail. Rewrite to eliminate the baseless implication or kill.

  3.  **Hedged Clickbait: "What [Common Activity/Product X] May Be Doing to Your Brain" (House Style)**
      *   **Step 1:** Passes. "May" makes it speculative; no false claim of certainty.
      *   **Step 2:** Passes/Fail Edge. The scope is broad ("may be doing"), but "may" technically covers everything from miraculous improvement to catastrophic harm. It omits *any* indication of evidence quality or direction of effect.
      *   **Step 3:** **Judgment Call - Passes Technically, But...** The framing ("What X May Be Doing") combined with the clickbait convention *strongly* implies there's concerning, emerging, or harmful effects worth worrying about (why else write it?). It leverages fear/uncertainty/doubt (FUD). It *feels* deceptive because its success relies on readers inferring a threat.
      *   **Step 4:** **CONVERSATION REQUIRED.**
          *   **Checklist Conclusion:** Passes literal truth and context checks (barely), but implication is ethically questionable. Triggers mandatory editorial conversation.
          *   **Plainly Stated:** The procedure concludes this headline **technically passes** the fact/context checks because of the weasel word "may," but **fails the spirit of honest communication** by being engineered to imply harm/danger/concern without evidence. It's a classic case of misleading-by-implication being the *entire point*.
          *   **Should you take it up? YES, ABSOLUTELY.** This is the core of your fight. Argue:
              *   It exploits reader anxiety for clicks.
              *   It erodes trust by constantly implying threats where the evidence is weak or non-existent.
              *   It's intellectually lazy and conflicts with science journalism's mission to inform accurately.
              *   It's the *moral equivalent of lying* to your audience's intuition, even if technically truthful. Demand a rethink of house style for headlines that don't just *avoid* falsehoods but actively *avoid manufacturing* misleading impressions. Propose alternatives that signal uncertainty neutrally ("Examining Potential Brain Effects of X" or "Weak Evidence Explored: X and Brain Health").

  **Final Takeaway:** This procedure helps you catch the low-hanging fruit of deceptive implication (Steps 2 & 3 failures) and forces the critical values conversation (Step 4) about your house style. Use your test sentences ruthlessly to calibrate your judgment on implication. Fight hardest on the Step 4 cases – that's where the soul of your science writing resides.
