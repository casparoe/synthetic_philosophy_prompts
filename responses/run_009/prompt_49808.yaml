prompt: |-
  I have noticed a pattern in practical life for which I cannot find a name, and I want to know whether philosophy or the theory of decision has one for it. Consider three people (composites, but each realistic):

  First, a tradeswoman known in her district to pursue any cheating customer without limit — small-claims filings, public complaints, days of her time spent over sums worth a fraction of those days. She never lets a grievance drop. The odd thing is that this is why she is almost never cheated: her willingness to act against her own interest in any particular dispute is what keeps the disputes from arising at all.

  Second, a man who once borrowed informally, moved abroad where no one could have collected from him, and repaid anyway. It was not any enforcement that moved him; and it was knowing in advance that he was the sort who would repay that got him the loan on favorable terms in the first place.

  Third, a negotiator who once walked away from a deal at a visible loss, and is known for it. Nobody who deals with him now opens with an offer they would be embarrassed to have accepted.

  The common structure, as best I can state it: at the moment of performance, the act is irrational — the costs plainly exceed the benefits, and everyone can see that they do. But the stable disposition to perform such acts is what made the earlier, beneficial arrangement possible. The irrationality of each part seems to be the rationality of the whole.

  I have come across the term precommitment, but that appears to concern devices: removing options in advance, lashing oneself to the mast. In my three cases nothing is removed; the option to defect stays fully open, and the person simply declines it. I have also considered whether this is just reputation, but reputation seems to be a track record of past behavior persuading others about the future, whereas in the second and third cases the trait must be visible before there is any track record to draw on, and in the first case it operates through what people can see of her character now.

  Does this configuration have an established name? Please structure your reply in four sections, in this order, at roughly the lengths indicated:

  1. Nearest concepts (about 150 words) — the established concepts that come closest to what I have described, named and glossed in a sentence each.
  2. Comparison (about 400 words) — one paragraph per candidate, saying in each case what it shares with the pattern above and where exactly it diverges; be disciplined about the divergences rather than assimilating everything to one idea.
  3. Verdict (about 200 words) — either the single concept that fits best, together with a precise definition of it, or, if nothing established fits, a plain statement that it does not, followed by a coined term, a definition, and two boundary cases: one situation that superficially resembles the pattern but falls outside it, and one marginal case you would hesitate on.
  4. What remains unsettled (about 100 words) — the questions my description leaves open, so that I can sharpen my own formulation of the phenomenon.

  A bare name will not satisfy me; the point is the carving — what exactly the phenomenon is, what it is not, and where its edges lie.
reasoning: |-
  Hmm, the user has described a fascinating pattern of behavior involving three distinct characters: a tradeswoman who pursues every grievance regardless of cost, a man who repays loans even when he could get away with defaulting, and a negotiator who walks away from bad deals. All share a core structure where irrational individual acts (costs exceeding benefits) enable rational long-term outcomes through their stable disposition.

  The user wants to know if philosophy or decision theory has a name for this pattern. They've considered precommitment and reputation but find them insufficient. Precommitment involves removing options, while here the option to defect remains but isn't taken. Reputation relies on past behavior, but in these cases the trait seems visible beforehand.

  I need to analyze this systematically. The key elements are: 1) Visible disposition to act against self-interest in specific instances, 2) This disposition enabling beneficial arrangements that wouldn't otherwise occur, 3) The irrationality at the micro level creating rationality at the macro level.

  Looking at potential candidates:
  - Precommitment (Schelling/Elster) involves constraining future choices, which doesn't fit since the option remains open.
  - Reputation building (game theory) relies on observable history, but here the disposition seems inherent and observable before history exists.
  - Signaling theory (Spence) comes closer - the costly acts signal unobservable traits. The tradeswoman's actions signal her relentlessness before disputes occur.
  - Intrinsic motivation fits the borrower case - his repayment stems from character, not calculation.
  - Credible commitment (Schelling) is promising but typically involves strategic restriction of options.

  The borrower case is particularly challenging - his repayment is intrinsically motivated, not strategic. This suggests the phenomenon might be a hybrid of signaling and character-based commitment. 

  For my verdict, while "signaling" comes closest, it doesn't fully capture the intrinsic motivation element. I'll propose "Characteristic Commitment" as a new term - defined as a visible disposition to incur costs that would be irrational if evaluated transactionally, which enables beneficial arrangements by signaling reliability or resolve. 

  Boundary cases: A purely emotional vendetta (no enabling function) wouldn't qualify, while a principled boycott (enabling future negotiations) would be marginal. 

  Unsettled aspects include whether the disposition must be innate or can be cultivated, and whether the irrationality must be objectively true or perceptually sufficient.
answer: |-
  Here is a structured analysis of the phenomenon you describe, focusing on conceptual precision and boundary-drawing:

  ### 1. Nearest Concepts (~150 words)
  *   **Precommitment (Schelling/Elster):** Binding oneself to a future course of action to constrain choices and influence others' expectations.
  *   **Signaling (Spence):** Engaging in a costly or hard-to-fake action to credibly convey private information (e.g., resolve, type) to others.
  *   **Reputation Building (Game Theory/Economics):** Investing in actions that establish a track record of behavior, shaping others' future interactions based on past observations.
  *   **Credible Commitment (Schelling):** Making a threat or promise believable by removing the option of backing down later, often through sunk costs or irreversible actions.
  *   **Intrinsic Motivation/Deontological Ethics:** Acting based on inherent principles (e.g., duty, honor) regardless of immediate consequences, distinct from instrumental calculation.

  ### 2. Comparison (~400 words)
  *   **Precommitment:** Shares the goal of influencing future interactions by shaping others' expectations through a known disposition. However, it **diverges sharply** because precommitment explicitly involves *removing or constraining* one's *own* future options (e.g., burning bridges, signing contracts). In your cases, the actors retain the full freedom to defect (not pursue the claim, not repay, accept the bad deal) at the moment of action. Their choice *not* to defect stems from disposition, not external constraint.
  *   **Signaling:** Shares the core mechanism: a costly action (or stable disposition enabling such actions) conveys credible information about an unobservable trait (relentlessness, trustworthiness, resolve). This is the closest fit. The **divergence** lies in the *timing and nature of the signal*. In classic signaling (e.g., education signaling ability), the costly act *is* the signal. In your cases, the costly acts (pursuing claims, repaying) are the *demonstrations*, but the *disposition itself* (visible character) is the primary signal enabling the initial beneficial arrangement *before* any costly demonstration occurs. The disposition signals the *propensity* to perform the costly acts if needed.
  *   **Reputation Building:** Shares the outcome: others base their behavior on expectations derived from the actor's past or perceived behavior. The **critical divergence** is the *role of history*. Reputation strictly relies on an observable *track record*. In your second case (borrower), the loan is granted based on perceived character *before* any repayment history exists. In the third (negotiator), the initial walk-away is the *first* costly act that *creates* the reputation; its power stems from the visible disposition it revealed, not prior history. The first case uses past acts, but crucially, her *current visible character* is what deters cheating *prospectively*.
  *   **Credible Commitment:** Shares the aim of making threats/promises believable. The **divergence** is similar to precommitment: credible commitment typically involves strategic *actions that alter the payoff structure* or *remove the exit option* for oneself to make a future action inevitable. Your actors make their commitments credible solely through their *known character and resolve*, not by altering the game's structure. The option to back down remains open but is predictably rejected.
  *   **Intrinsic Motivation:** Shares the characteristic of performing the "irrational" act due to internal drivers (principle, identity) rather than direct payoff calculation. The **divergence** is that in your cases, this intrinsic motivation is not just a personal ethic; it is strategically *visible* and *instrumental* in enabling the beneficial prior arrangements. The borrower's intrinsic honesty is leveraged to get the loan; the tradeswoman's intrinsic relentlessness deters cheating.

  ### 3. Verdict (~200 words)
  No single established concept perfectly captures the phenomenon. The core is a **visible disposition or character trait** that reliably leads an individual to choose actions with net negative *transactional* payoffs (costs > benefits for that specific instance), where this disposition itself is the enabling condition for beneficial *relational* arrangements (deterrence, trust, favorable terms) that would not occur otherwise. The irrationality of the part is the rationality of the whole system of interactions enabled by the disposition.

  **Coined Term:** **Characteristic Commitment**

  **Definition:** A stable, observable personal disposition (e.g., unwavering principle, inherent honesty, absolute resolve) that predictably leads an agent to incur net costs in specific performance situations where defection is feasible and materially advantageous, and where the very visibility of this disposition is the necessary precondition for establishing beneficial cooperative arrangements or deterring exploitation by others *ex ante*.

  **Boundary Cases:**
  *   **Outside:** A person who pursues a vendetta out of pure spite, destroying themselves financially to ruin an enemy, where the action has no *enabling* function for future beneficial arrangements and is purely destructive. (Lacks the enabling precondition).
  *   **Marginal:** A principled boycott: Boycotting a supplier on ethical grounds despite higher costs *could* signal resolve to other suppliers, potentially leading to better future offers. However, if the primary motivation is purely ethical with no expectation or mechanism for future relational benefit, it leans towards intrinsic motivation. If the actor consciously leverages it as a signal to shape future negotiations, it fits Characteristic Commitment.

  ### 4. What Remains Unsettled (~100 words)
  *   **Origin of Visibility:** Must the disposition be innate/"authentic," or can it be strategically cultivated and projected (like a reputation)? Your cases imply authenticity, but is projection possible?
  *   **Degree of "Irrationality":** How objectively/subjectively irrational must the specific act be? Is perceived irrationality by *others* sufficient, even if the actor derives intrinsic satisfaction (e.g., the tradeswoman's satisfaction from justice)?
  *   **Scale of Benefit:** How significant must the enabling benefit be relative to the specific costs incurred? Is a minor deterrent effect sufficient?
  *   **Self-Awareness:** To what extent must the actor understand the enabling effect of their disposition? The borrower may not; the tradeswoman likely does. Is conscious leverage required?
