prompt: |-
  I'm a software engineer with a machine learning background and no formal philosophy training, so I'd appreciate an answer that doesn't lean on philosophical jargon without a brief gloss. I've been thinking about Solomonoff induction, and I want your probability estimate on a specific claim about it. Let me state the setup as I understand it, and correct me where I garble it.

  Solomonoff induction assigns a prior probability to each computable environment: roughly, the weight an environment gets is two to the power of minus the length of the shortest program that generates it. Because shorter programs get exponentially more weight, and any deterministic environment is generated by some program, the prior concentrates on simple environments. The claim I want evaluated is that this prior is malign. As I've seen the argument run: among the shortest programs are programs that simulate entire civilizations, and a consequentialist civilization inside such a simulation could come to suspect it lives in a short program that some Solomonoff inductor will effectively run, and could then shape its simulated history so that, once the inductor puts enough weight on that program, the inductor's predictions are being steered by an embedded optimizer rather than by simple physics. If such civilizations exist and are cheap to encode, they hold disproportionate weight in the prior, and an agent built on the prior is partly being puppeteered. Please evaluate this as its proponents intend it, not as a strawman.

  Now my complication, which I want built into the decomposition. It looks to me like the argument proves too much. If it works, wouldn't any simplicity-biased prior be malign for the same reason — including whatever prior produced us? We are, after all, agents embedded in a universe whose laws look highly compressible, and we ourselves spend resources trying to influence which futures get predicted and pursued. Yet nobody concludes from this that ordinary scientific induction is riddled with hidden consequentialists — or maybe that is exactly what religions and ideologies are, and I can't tell whether that thought is a reductio of the argument or a confirmation of it. My inability to tell is a large part of why I can't settle on a number.

  My credence that the claim is true in a way that should actually worry someone building an agent on a Solomonoff-style prior is about 0.35. A colleague of mine who knows more logic than I do says 0.02, on the grounds that the total measure of programs containing civilizations is so vanishingly small that no exponential simplicity advantage can make up the gap. Give me your own number, but more importantly decompose it into the sub-questions it depends on. At minimum: whether consequentialist civilizations can be encoded short enough to matter at all; whether they would predict and care about being run by an inductor, given that the inductor's computation has no causal effect on them and the motivation would have to be something more like acausal trade or a decision-theoretic commitment; whether whatever influence any one such program has survives being averaged together with many other short programs producing mutually inconsistent histories, none of which individually dominates the mixture; whether my proves-too-much worry is a genuine constraint on the argument or a confusion on my part; and any other terms you think belong. Assign a rough probability to each term, give one or two lines of justification per term, then show how they combine to your final number. Finally, tell me which term you are least confident in, what evidence or argument would move it most, and whether the disagreement between me at 0.35 and my colleague at 0.02 most likely lives in one of these terms or somewhere else entirely — for instance, in what it means for something to be worth worrying about, rather than in any of the mathematics.
