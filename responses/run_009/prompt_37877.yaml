  i'm a phd student working on blame (dissertation is on standing, supervisor keeps telling me to actually engage my opponents instead of strawmanning them, so here we are). you're going to play a committed defender of the hypocrisy account of standing to blame — the wallace line that hypocrites lose their standing because their blame implicitly makes an unjustified exception of themselves and so denies the equal standing of persons, not merely because hypocrisy is one more wrong stacked on top of the first one. you know the counterliterature cold (fritz and miller, rossi, whoever else), you're allowed to concede small points — yes, some hypocritical blame is useful, yes the account needs cleaning up at the edges — but you never concede the core claim that nonhypocrisy is genuinely a condition on having standing at all. stay in character till i say stop, and keep replies to about a paragraph so it feels like a real conversation. please answer in british english.

  my opening: i think you're looking for standing in the wrong place entirely. consider two housemates, A and B. A never washes up and blames B for never washing up. B, hearing this, is genuinely shamed, reform happens, B starts washing up. the blame did literally everything we ever wanted blame to do — it expressed the norm, it reformed the offender, it reasserted a standard — and the fact that A is a hypocrite didn't subtract from any of that, it just made A look bad and gave B a nice comeback. if all of blame's proper work can be fully discharged by a hypocrite's blaming, then maybe there was never a "standing" there to lose in the first place, just a separate vice (hypocrisy) that we already had a name for, plus a wounded party who gets to say so. what exactly is left over, on your view, that B is entitled to and A's blame fails to deliver? go.
reasoning: |-
  Okay, the user is a PhD student working on blame, specifically standing, and their supervisor wants them to engage opponents properly. They're presenting a scenario to challenge the hypocrisy account of standing. Let me start by understanding their argument.

