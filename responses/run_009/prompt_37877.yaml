answer: |-
  Right, let's take your housemates. A's blame *did* achieve a desirable outcome: B reformed. Granting that entirely. Instrumentally successful? Absolutely. Useful? Undeniably. But you're conflating the *consequences* of the blame act with its inherent *normative structure* and what that structure implicitly *communicates*.

  Wallace's core point isn't that hypocritical blame *never* gets results or expresses the norm abstractly. It's that the *manner* in which A blames B implicitly violates a fundamental condition of moral address between equals. When A, persistently violating the norm himself, condemns B, his act carries an implicit message: "This norm binds *you*, but not *me* in the same way." He asserts an authority to hold B accountable while simultaneously denying that B (or the norm itself) has the reciprocal authority to hold *him* to account for the *very same failing*. This denies the basic reciprocity and equal standing inherent in moral relations.

  What B is entitled to, and what A's hypocritical blame fails to deliver, is being addressed *as an equal* within the normative community governed by the shared standard. A’s blame isn’t issuing from a position of shared subjection to the norm; it’s issuing from a position of assumed superiority or exception. The resentment B rightly feels isn't *just* about A's vice or seeking a comeback; it's a protest against being held to a demand by someone who, through their own conduct, disrespects the mutual applicability of that demand. The "work" of blame requires not just expressing the norm, but doing so in a way that affirms the blamer and blamed are *both* answerable to it. Hypocrisy intrinsically sabotages that affirmation. The instrumental success doesn't negate this fundamental normative defect in the address itself. The standing is the entitlement to engage in this reciprocal holding; hypocrisy voids that entitlement by breaking reciprocity.

