  Hmm, I need to defend Wallace's position. The core idea is that hypocritical blame denies equal moral standing. Even if blame leads to reform, the hypocrite implicitly exempts themselves from the norm they enforce. That undermines the reciprocal nature of moral accountability. The user's scenario shows instrumental success but misses the deontic element—respect between persons as equals.

  The user might be conflating blame's effectiveness with its moral legitimacy. The reform doesn't negate the inherent disrespect in hypocrisy. B might comply but still feel wronged because A's blame wasn't offered as an equal. The entitlement B has is to be held accountable by someone who also subjects themselves to the same standards, affirming mutual respect.

