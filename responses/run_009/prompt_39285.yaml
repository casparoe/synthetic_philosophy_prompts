prompt: |-
  For a while now, a friend of mine who studies neuroscience and I have been arguing about when a mental event — an intention, a decision, a pain — genuinely causes a physical event, and I've been keeping a list of cases and my gut verdicts on each, hoping a principle would emerge. It hasn't, at least not cleanly, so I want help extracting one. Here are my verdicts. When I deliberately raise my arm to flag a taxi, my deciding to raise it is a cause of the arm's rising, not merely something that happened alongside it. I hold this even though I accept that the neural activity in my motor cortex was, by itself, causally sufficient for the rising: the intention still seems to be doing causal work, not riding along as an epiphenomenon. In a case with the same structure but two bodies instead of a mind and a brain — two marksmen fire simultaneously, either shot alone sufficient to kill — I'm comfortable saying the death was overdetermined and that each shot caused it. Yet when I try to describe the taxi case in the marksmen's vocabulary, as the arm's rising being overdetermined by the intention and the neural event, each sufficient, I recoil; it sounds wrong in a way the marksmen case doesn't, and I can't say why. By contrast, a patient whose motor nerve is severed: she intends to move her arm, and a machine, on a doctor's orders, moves it at exactly that moment — there I say flatly that her intention did not cause the rising, even though it was present and directed at precisely that outcome, which tells me that an intention's being there and being aimed at the effect isn't enough on its own. And finally, my friend and I agree on this one: two people with numerically identical neural events, one acting intentionally and one in a reflex, seem to differ in what caused their movements, even though nothing physical distinguishes them.

  The tension should be visible: the taxi case and the marksmen case appear to share their causal structure — two sufficient causes converging on one effect — but my verdicts treat them very differently, embracing overdetermination in one and refusing to even name it that way in the other, and I can't currently justify the difference. So what I'm asking for is this: state, precisely, the single principle that best captures my pattern, if one exists; say which case motivates each clause of it; tell me what it predicts about the case I keep going back and forth on, a man whose arm rises through a purely reflexive spasm at the very moment he was also intending, for reasons of his own, to raise it — did the intention cause the rising, did the spasm, both, or neither; and then be explicit about which of my verdicts, if any, the principle cannot accommodate, and which of them you think I should give up, with your reasons. Don't lay out a menu of candidate principles for me to choose among — commit to the account you actually think is right, even if it means overturning one of my verdicts, and defend that commitment. Please lead with your bottom line in the very first sentence and give the reasoning after, with no preamble and no restatement of my cases back at me.
reasoning: |-
  Hmm, the user presents a sophisticated philosophical problem about mental causation. They've clearly thought deeply about this, compiling specific cases with intuitive verdicts that resist easy reconciliation. The core tension is between treating mental events as genuinely causal (like in the taxi case) versus seeing them as epiphenomenal when neural events appear sufficient.

  Looking at their cases: The taxi scenario shows strong intuition that intention causes action despite neural sufficiency. The twin marksmen case comfortably accepts overdetermination. But transplanting "overdetermination" language to the taxi case feels wrong to them - that's the first crack. The severed nerve case demonstrates that mere presence of intention isn't sufficient for causation. The identical neural events case suggests causation depends on something beyond physics.

  Their reflexive spasm dilemma is particularly thorny - what happens when intention and sufficient physical cause coincide accidentally? My solution must resolve this while respecting their other intuitions.

  I notice they explicitly reject "menu options" and demand a committed answer. They want the principle stated upfront, so I'll lead with teleological causation as the key differentiator. This explains why intention causes movement only when it guides the outcome - even if other factors could have produced it. 

  For the spasm case, this principle suggests no causal role for intention because it didn't guide the movement. This might challenge their taxi case intuition, but I'll argue that in normal volition, intention does guide the action through its neural realization - unlike the spasm scenario where guidance is absent despite intention's presence.

  The marksman case differs because both bullets are equally "guiding" the death - they're both direct physical causes. Whereas in mind-body cases, we perceive intention as the original source. My principle accommodates this by making guidance the criterion rather than physical sufficiency.
answer: |-
  **Bottom line:** Your pattern is best captured by a principle of *teleological guidance*: a mental event causes a physical effect only if it non-accidentally structures the physical process realizing that effect, making the effect a fulfillment of its goal-directed content.

  ---

  ### Principle & Case Motivation:
  - **Teleological Guidance Principle (TGP):** A mental event *M* (e.g., an intention) causes a physical event *P* iff:
    1. *M* has representational content directed at *P* (e.g., "raise arm").
    2. The physical substrate of *M* non-accidentally initiates and sustains a causal chain resulting in *P*.
    3. The physical chain’s sufficiency for *P* is *explained by* *M*’s content guiding its structural organization.
  - **Motivation by your cases:**
    - **Taxi case (clauses 1–3):** Your intention’s content ("raise arm") non-accidentally structures the neural activity, making the arm’s rising its fulfillment. The neural sufficiency is *because* it realizes the intention.
    - **Marksmen case (no clause 3):** Both shots are sufficient, but neither *structures* the other’s causal chain. Overdetermination is symmetric physical sufficiency without teleological guidance.
    - **Severed nerve case (failure of clause 2):** The intention is present but its physical substrate *does not initiate* the causal chain (the machine does). No structuring occurs.
    - **Identical neural events (clause 3):** In the intentional case, neural activity is structured by goal-directed content; in the reflex, it is not. Causation differs despite physical identity because guidance is present only in the former.

  ---

  ### Resolution of the Spasm Case:
  - **Case:** A man’s arm rises via reflexive spasm at the *exact moment* he intends to raise it for his own reasons.
  - **Verdict by TGP:** The intention **did not cause** the rising.
    - *Why:* Though the intention’s content matches the outcome (clause 1), the spasm’s physical sufficiency is *accidental* relative to the intention. The intention’s neural substrate did not guide or structure the spasm’s causal chain (failure of clause 2–3). The rising fulfills no goal of the intention; it coincides with it.

  ---

  ### Conflicts with Your Verdicts & Recommendations:
  1. **Conflict:** Your taxi case verdict insists intention causes the rising despite neural sufficiency, yet you reject calling it "overdetermination" (unlike the marksmen).  
     - **TGP Accommodation:** This is consistent. TGP distinguishes *structured* sufficiency (intention guides neural cause) from *brute* sufficiency (marksmen). Overdetermination applies only to brute sufficiency.  
     - **No verdict change needed.**

  2. **Conflict:** Your intuition that two physically identical neural events differ causally (intentional vs. reflex).  
     - **TGP Accommodation:** Fully explained: identical neural activity has different causal origins—one teleologically guided, one not.  
     - **No verdict change needed.**

  3. **Conflict:** Your spasm-case intuition (if you lean toward "both cause it").  
     - **Recommendation:** **Revise this verdict.** The intention’s presence + outcome-match doesn’t suffice for causation without guidance. Accept that coincidental match (like the severed nerve case) voids causation.

  4. **Tension with Marksmen:** TGP explains why you "recoil" at calling the taxi case overdetermined: the intention isn’t a *separate* sufficient cause—it’s the *organizing principle* of the neural cause. The marksmen lack this unity.

  ---

  ### Why TGP is Defensible:
  - **Solves the luck problem:** In the spasm/severed nerve cases, the outcome is lucky coincidence, not *because* of the intention. TGP requires counterfactual robustness: if the intention’s content changed (e.g., "lower arm"), the outcome would change *if it guides*. In the spasm case, it wouldn’t.  
  - **Avoids epiphenomenalism:** Intentions cause effects by structuring their physical realizers, not by "magic." Neural sufficiency is necessary but insufficient—it must be teleologically explained.  
  - **Unifies psychology/physics:** Mental causation isn’t overdetermination because the mental *is* the goal-directed mode of the physical cause.

  **Final note:** Rejecting the intention’s causation in the spasm case preserves the core of your taxi intuition while resolving the tension. The intention must *drive* the process, not just coincide with it.
