  **Moorean Assertory Disorder (F99.3)**

  **Diagnostic Criteria**

  The essential feature of Moorean Assertory Disorder is the recurrent, sincere utterance of a specific form of assertion that is pragmatically self-defeating despite being logically consistent. The diagnosis requires the presence of at least one of the following forms of assertion, uttered in the first person, present tense, and with apparent sincerity:

  A. The *omissive* type: Assertions of the form "p, but I do not believe that p," where p is a proposition that the individual is prepared to affirm. For example:
      1. "It is raining, but I do not believe it is raining."
      2. "The meeting is at 3 PM, but I don't believe that it is."

  B. The *commissive* type: Assertions of the form "p, but I believe that not-p," where p is a proposition that the individual is prepared to affirm. For example:
      1. "The train has arrived, but I believe it hasn't."
      2. "She is at home, but I believe she isn't."

  **Specifiers**

  Specify whether:
  - **F99.31 With omissive features**: If only the omissive type (Criterion A) is present.
  - **F99.32 With commissive features**: If only the commissive type (Criterion B) is present.
  - **F99.33 Mixed presentation**: If both types are present.

  *Note*: The two forms are clinically indistinguishable in terms of treatment response and functional impairment.

  **Prevalence and Course**

  The disorder is rare, with an estimated lifetime prevalence of 0.001% in the general population. It typically manifests in late adolescence or early adulthood, though cases have been reported in children as young as 10 and adults over 50. The disorder is chronic but may remit spontaneously in some individuals. Intriguingly, the condition is exquisitely sensitive to grammatical person and tense: it is only observed in the first person and present tense. Third-person variants (e.g., "It is raining, but he doesn't believe it") and past-tense variants (e.g., "It was raining, but I didn't believe it") are not considered pathological and are commonly observed in unaffected individuals. The reason for this sensitivity remains unknown and is a topic of ongoing research.

  **Differential Diagnosis**

  - **Simple Contradiction (F03.1)**: The patient's assertion must be carefully distinguished from a simple contradiction. In Moorean Assertory Disorder, the utterance is not logically contradictory (i.e., it is possible for both conjuncts to be true simultaneously). For example, "It is raining, but I do not believe it is raining" could be true if it is indeed raining and the speaker is unaware of it. Therefore, the presence of a non-contradictory but pragmatically defective utterance is essential for the diagnosis. If the utterance is a contradiction (e.g., "It is raining and it is not raining"), consider F03.1.

  - **Factitious Disorder (F68.1)**: In some cases, individuals may feign the utterance for secondary gain (e.g., to appear philosophically sophisticated). However, in Moorean Assertory Disorder, the utterance is sincere and not intentionally produced for external incentives.

  - **Psychotic Disorders (e.g., Schizophrenia Spectrum and Other Psychotic Disorders)**: Delusional beliefs or disorganized speech may sometimes resemble Moorean assertions. However, in psychotic disorders, the speech is typically accompanied by other positive symptoms (e.g., hallucinations, delusions) and is not restricted to the specific grammatical forms seen in Moorean Assertory Disorder.

  - **Language Disorder (e.g., Social (Pragmatic) Communication Disorder)**: While pragmatic deficits are central to both, Moorean Assertory Disorder is characterized by a specific pattern of assertion and is not accompanied by broader deficits in social communication.

  **Comorbidity**

  Moorean Assertory Disorder is often diagnosed in isolation. However, it may co-occur with:
  - Obsessive-Compulsive Disorder (F42): where the patient may feel compelled to make such assertions.
  - Social Anxiety Disorder (F40.10): due to social repercussions of making odd assertions.
  - Major Depressive Disorder (F32): especially if the disorder leads to social isolation.

  **Treatment**

  The primary goal of treatment is to reduce the frequency and distress associated with the Moorean assertions.

  - **Psychotherapy**: The most effective treatment is Assertion Regulation Therapy (ART), a behavioral intervention that teaches the patient to monitor their assertions and to only assert propositions that they believe. ART has been shown to reduce symptoms in 80% of cases in controlled trials. The therapy focuses on the norm of assertion: that one should only say what one believes. Patients are trained to recognize when they are about to make a Moorean assertion and to replace it with a more appropriate form of speech.

  - **Pharmacotherapy**: No medication has been found to specifically target the core symptoms of Moorean Assertory Disorder. While selective serotonin reuptake inhibitors (SSRIs) or antipsychotics may be used to treat comorbid conditions (e.g., anxiety, depression, or obsessive-compulsive symptoms), they do not alter the pragmatic defect of the utterance. However, they may reduce the frequency of utterances by diminishing the patient's motivation to speak or by inducing sedation.

  - **Prognosis**: With ART, the prognosis is good. Spontaneous remission occurs in approximately 20% of cases. Without treatment, the disorder may lead to social ostracization and occupational difficulties.

  **Research Directions**

  Further studies are needed to understand the neural basis of this disorder and why it is restricted to the first-person present tense. Functional MRI studies are underway to identify potential abnormalities in the pragmatic language network.

