  **Moorean Assertory Disorder (F99.3)**  

  **Diagnostic Criteria**  
  The essential feature of Moorean Assertory Disorder (MAD) is the recurrent, contextually inappropriate production of sincere first-person, present-tense assertions conforming to one of two grammatically defined patterns, causing significant social or occupational impairment (e.g., ostracization, academic penalties, or termination of philosophical debates).  

  Criteria A and B must both be met:  
  *A. The individual produces assertions of the following form, uttered sincerely and in the present tense:*  
  &nbsp;&nbsp;&nbsp;&nbsp;1. *Omissive Type:* “p, but I do not believe that p” (e.g., “Nietzsche was profound, but I don’t believe he was”).  
  &nbsp;&nbsp;&nbsp;&nbsp;2. *Commissive Type:* “p, but I believe that not-p” (e.g., “This lecture is fascinating, but I believe it is not”).  
  *B. Symptoms are not attributable to grammatical errors, irony, sarcasm, or metalinguistic commentary (e.g., “I just said ‘p,’ but oddly, I don’t believe it”).*  

  **Specifiers**  
  - **F99.31 With Omissive Features (Type 1):** Criterion A.1 exclusively.  
  - **F99.32 With Commissive Features (Type 2):** Criterion A.2 exclusively.  
  - **F99.33 Mixed Presentation:** Both types exhibited.  
  *Note:* Omissive and commissive types show identical treatment response and impairment severity.  

  **Prevalence and Course**  
  Prevalence is estimated at 0.02–0.04% in global populations, with higher incidence in academic settings (0.5%). Onset typically occurs in late adolescence or early adulthood, coinciding with exposure to epistemology coursework. The disorder exhibits a chronic, fluctuating course, often remitting spontaneously when patients avoid philosophical discourse. Remarkably, symptomatology is strictly confined to first-person, present-tense assertions. Third-person variants (e.g., “She is late, but he doesn’t believe it”) and past-tense variants (e.g., “I was wrong, but I didn’t believe it”) are asymptomatic and observed in healthy controls. The pathophysiological basis for this tense/person sensitivity remains unknown.  

  **Differential Diagnosis**  
  - **Simple Contradiction (F03.1):** MAD is distinguished by its non-contradictory nature. The patient’s assertion (e.g., “It’s raining, but I don’t believe it”) could be factually true (rain may exist unbeknownst to the speaker), whereas F03.1 entails logical impossibility (e.g., “It’s raining and not raining”).  
  - **Psychotic Disorders (F20-F29):** Unlike MAD, delusional speech involves fixed false beliefs (e.g., “I am Napoleon”), not structurally valid but pragmatically anomalous assertions.  
  - **Social (Pragmatic) Communication Disorder (F80.89):** While both involve pragmatic deficits, MAD is restricted to specific utterance forms without broader social-pragmatic impairment.  
  - **Factitious Disorder (F68.10):** MAD requires sincerity; feigned symptoms (e.g., to impress peers) suggest F68.10.  

  **Comorbidity**  
  MAD frequently co-occurs with:  
  - **Social Anxiety Disorder (F40.10):** Due to ridicule following assertions.  
  - **Obsessive-Compulsive Disorder (F42):** Obsessions about belief-assertion misalignment.  
  - **Major Depressive Episode (F32):** Secondary to social isolation.  
  *Note:* No causal link between comorbidities and MAD core symptoms is established.  

  **Treatment**  
  - **First-Line Psychotherapy:** Assertion-Belief Alignment Therapy (ABAT) is the gold standard. ABAT trains patients to exclusively assert propositions they endorse (e.g., replacing “p, but I don’t believe p” with “p” only if p is believed). Success rates exceed 85% when adherence is maintained.  
  - **Adjunctive Pharmacotherapy:** SSRIs (e.g., sertraline) may reduce utterance frequency by dampening communicative urges but do not resolve the pragmatic defect (i.e., utterances remain aberrant when produced). Benzodiazepines are contraindicated (risk of disinhibited assertions).  
  - **Prognosis:** Excellent with ABAT; poor without intervention. Relapse is common in epistemology departments.  

  **Research Directions**  
  Neuroimaging studies suggest hypoactivation in the dorsolateral pragmatics cortex (DPC) during symptomatic utterances. Cross-linguistic studies are exploring why grammatical person/tense modulates pathology.  

