prompt: |-
  Quick question that came out of a huge family arguement and I can't let it go. My cousin agreed to water my grandma's plants while she was on vacation, forgot, and the plants died. Everyone in the family talks about it like he killed them. But technically he didn't DO anything, right? He just... didn't water them. And the more I think about it the weirder it gets, because literally every other person on earth also didn't water those plants. Her neighbor could've walked over and done it. I could have. Some random guy in Ohio could've flown out. Nobody thinks the neighbor killed the plants, let alone the guy in Ohio. So what's going on?

  Part of me thinks it's just the promise thing -- he SAID he'd do it, so this is really about breaking your word, not about causing anything, and calling it "killing the plants" is just my grandma being dramatic. But then the other night I was thinking about how if you stand next to a pool and watch a toddler fall in and do nothing, people would absolutly say you let it happen, or worse, even though you never agreed to watch anyone's toddler. So the promise can't be the whole story. And also, what even IS the bad thing my cousin did? There's no moment where he did the plant-killing. Not doing something isn't an event, there's no time and place you can point to. The only actual events are him playing xbox all week and the plants drying out. So can nothing cause something?

  Oh and one more thing that confuses me -- I watched some law show where they said in court you ask "but for" the person's action, would the bad thing have still happened. But for my cousin not watering, the plants live, ok, fine. But but for the neighbor not watering they'd also die... except no, wait, if the neighbor had watered them they'd live, so doesn't the neighbor pass the same test?? By that logic everyone on earth is equally the killer, which obviously can't be right.

  So my actual questions: does this have a name in philosophy, this whole causing-by-not-doing thing, and is there a name for whatever rule picks out WHICH non-doer counts as the causer? My cousin keeps saying "I didn't touch those plants" and my grandma keeps saying "you killed them" and I honestly think they're both kinda right which is annoying. And please don't just drop the fancy term and peace out -- I want to know whether philosophers think this is real causation or just a way of talking when we're mad at someone, whether my cousin "caused" the death or only "let it happen" (is there even a difference), and where the line actually falls, like why the cousin and not the neighbor, and whether the toddler-pool guy is on the same side of the line as my cousin or the neighbor. If there's no established concept for the part about picking which non-doer counts, that's fine, just say so and tell me what you'd call it. This has been bugging me for like two weeks.
reasoning: |-
  Okay, let me unpack this user's query. They're stuck in a family argument about whether their cousin "killed" their grandma's plants by forgetting to water them. The user is grappling with the philosophical tension between action and inaction, especially when responsibility is involved. 

  First, I notice they're intellectually curious but frustrated—they've clearly been ruminating on this for weeks. Their examples (plants, toddler drowning, Ohio stranger) show they're trying to universalize the problem beyond the family drama. Smart framing. 

  The core confusion seems to be: 
  - How can *not* doing something be causal? 
  - Why is the cousin blamed but not others who also didn't water? 
  - Is this about causation or moral responsibility? 

  Hmm, they're accidentally conflating two things: 
  1. **Metaphysics of causation** (can absence cause things?) 
  2. **Ethics of omission** (when does failing to act make you blameworthy?) 

  The legal "but-for" test they mention is a red herring—it's useful for factual causation but doesn't resolve *moral* responsibility. That's why the neighbor/Ohio examples feel paradoxical. 

  Key philosophical anchors I should weave in: 
  - **Negative acts** (omissions as causal in specific contexts) 
  - **Duty of care** (the promise creates obligation; neighbor doesn't have it) 
  - **Counterfactual dependence** (plants died *because* cousin failed, but not *because* neighbor failed) 

  The toddler analogy is sharp—it shows duty can exist without explicit promise (e.g., social contract). But the user's right: the line between "killing" and "letting die" is blurry. I should flag that some philosophers (like Jonathan Bennett) think the distinction is overrated. 

  For the "what's the bad thing" question: the cousin's negligence *is* the event—not a physical action, but a breach of obligation. The Xbox playing is circumstantial evidence of the omission. 

  Might add that this ties into *normative expectations*: we constantly rely on others to fulfill assigned roles. Grandma's anger isn't (just) drama—it's about broken social trust. 

  ...Should I mention Aristotle's four causes? Probably overkill. Stick to contemporary moral philosophy. 

  User's frustration is valid—philosophers *do* debate if omissions are truly causal. But for practical purposes, the duty/promise framework resolves their family dilemma. The Ohio stranger bit is a helpful extreme case to show why duty matters. 

  Final note: Their "both kinda right" intuition is spot-on. Grandma uses "killed" emotionally; cousin fixates on literal action. The real issue is culpability, not dictionary definitions.
answer: |-
  This is a **brilliantly articulated** philosophical puzzle that cuts to the heart of causation, responsibility, and moral obligation. You've hit on several key concepts, and your frustration is completely understandable – philosophers have debated these very points for centuries. Let's break it down:

  1.  **The Name(s) in Philosophy:**
      *   **Omission:** This is the core term for failing to perform an action (like not watering the plants, not saving the toddler).
      *   **Causation by Omission (or Negative Causation):** This is the specific idea that *not* doing something can be the cause of a harmful outcome. Philosophers fiercely debate whether omissions *truly* cause events or if we just *treat them as if* they do for moral and legal reasons.
      *   **Moral Responsibility for Omissions:** This focuses on when and why someone is *blameworthy* for failing to act.
      *   **The Duty/Obligation Problem:** This is central to distinguishing your cousin from the neighbor or the guy in Ohio.

  2.  **Is Omission "Real" Causation? (The Metaphysical Debate)**
      *   **The Skeptical View (e.g., David Hume-inspired):** True causation requires a *positive action*, a "push" in the world. Omissions are absences – "nothing" doesn't cause "something." The plants died *because* of dehydration, *because* of the sun, *because* of their biological needs. Your cousin's absence of watering isn't a positive force. On this view, saying he "caused" it is just shorthand for "his inaction allowed the natural causes to proceed unchecked."
      *   **The Pragmatic/Moral View (More Common):** While omissions might be metaphysically different from actions, we *must* treat them as causes for practical and moral reasons. Our world runs on reliance and expectations. If we *didn't* hold people responsible for omissions in specific contexts (like promises or special relationships), society couldn't function. The "but-for" test you mentioned is a *legal* tool for establishing factual causation in this pragmatic sense: "But for the cousin's failure to water, the plants would have lived." This establishes a necessary condition, even if it doesn't capture a direct physical force.
      *   **The Counterfactual Dependence View:** The death counterfactually depended on the cousin's omission. If he *had* watered (holding everything else constant), the plants would have lived. This is a strong argument for treating the omission as causally relevant, even if it's not a "billiard ball" style cause. Crucially, the death *didn't* counterfactually depend on the neighbor's omission *in the same way*. If the neighbor watered (holding the cousin's omission constant), the plants *might* have lived (if the neighbor knew, had access, etc.), but the cousin's specific promise and access made *his* watering the expected and relied-upon intervention.

  3.  **The Crucial Rule: Duty, Obligation, and Normative Expectations**
      *   **This is the key to distinguishing your cousin from the neighbor and the guy in Ohio.** The concept doesn't have one single fancy name, but it revolves around **duty, obligation, reasonable expectation, or role-responsibility.**
      *   **Why the Cousin?** Your cousin **freely undertook a specific obligation** by promising to water the plants. This created a **duty of care**. Your grandma **relied** on this promise, altering her own behavior (going on vacation without other arrangements). He was the **designated preventer** of the harm. His inaction wasn't neutral; it was a **breach of trust and obligation**. He had the unique **capacity and opportunity** created by the agreement.
      *   **Why NOT the Neighbor?** The neighbor had **no prior agreement, no undertaken obligation,** and no **specific expectation** placed on them by your grandma to act. While it might have been *nice* or even *praiseworthy* for the neighbor to water the plants, their failure to do so is not a **breach of duty**. They were not the designated preventer. Society doesn't generally impose a duty to rescue strangers' plants (unlike, arguably, the toddler situation).
      *   **Why NOT the Guy in Ohio?** He had **no knowledge, no capacity, no opportunity, and certainly no obligation**. His "omission" is entirely irrelevant. He wasn't part of the causal chain in any meaningful way.
      *   **The Toddler Pool Case:** This highlights that **duty can arise without an explicit promise**:
          *   **Proximity & Knowledge:** The bystander is physically present and sees the toddler fall. They have immediate knowledge of the imminent danger.
          *   **Capacity:** They can likely easily save the toddler (it's a pool, not a raging river).
          *   **Relationship/Social Contract:** While no explicit promise exists, many argue there's a minimal **duty of easy rescue** rooted in basic humanity or social contract when the cost to act is low and the harm prevented is great. Failure here is often seen as morally culpable *omission* ("letting die"), even if not legally "killing" in most places. The *intensity* of blame might differ from actively pushing the toddler in, but the omission is still seen as *causally relevant and morally wrong* due to the circumstances creating a duty.

  4.  **Causing vs. Letting Happen (Is there a difference?)**
      *   This is highly debated. Some philosophers (like James Rachels) argue the distinction is morally insignificant in terms of outcome. Both lead to death. The *reason* for the distinction often boils down to **intention and directness**.
      *   **"Causing" (Killing):** Typically implies initiating a *new* causal chain of harm (e.g., poisoning the plants, pushing the toddler). It feels more active and direct.
      *   **"Letting Happen" (Allowing to Die):** Typically implies *failing to intervene* in an *existing* harmful causal chain (e.g., not watering plants dying of thirst, not saving a drowning toddler). It feels more passive.
      *   **In Your Plant Case:** Philosophically, "letting die" is often seen as a more accurate description than "killing." Your cousin failed to prevent a death that was already threatened by the plants' natural needs and the vacation context. He didn't introduce a new lethal agent. However, **morally**, because of the undertaken obligation, the responsibility and blame can feel just as strong, leading to the dramatic language ("you killed them!").

  5.  **The "Bad Thing" Your Cousin Did**
      *   It wasn't a single physical action like poisoning. The "bad thing" was the **culmination of his negligence**:
          *   **The Promise:** Creating the obligation and expectation.
          *   **The Forgetting/Choosing Not to Act:** The mental state (negligence, disregard) leading to the sustained inaction.
          *   **The Sustained Omission:** The ongoing failure to fulfill his duty throughout the week.
      *   This sequence – **undertaking responsibility + failing through negligence to discharge it + resulting harm** – constitutes the morally blameworthy event. The Xbox playing is evidence of the negligence and the *manner* of the omission, but the core wrong is the breach of duty itself.

  **Conclusion & Resolution:**

  *   **Your Cousin:** Is **philosophically** likely guilty of **causation by omission** (in the pragmatic/counterfactual sense) and **definitely** guilty of **breach of obligation/duty of care**. He is morally responsible for the plants' death *because* he freely took on the role of preventer and then failed to act. "I didn't touch them" ignores the moral weight of the promise and reliance.
  *   **Your Grandma:** Is **metaphysically** slightly imprecise in saying he "killed" them (implying positive action), but **morally and emotionally justified** in holding him *fully responsible* for the outcome caused by his failure. Her language captures the depth of the betrayal and the consequence.
  *   **The Line:** It's drawn by **duty/obligation** arising from promises, relationships, roles, or specific circumstances creating a reasonable expectation to act (like the poolside bystander). It's not about the *inaction itself* being an event, but about the **breach of a normative expectation to act**. The neighbor and Ohio guy lacked this duty; your cousin and the pool bystander (arguably) had it.
  *   **The Toddler Pool Guy:** Is on the **same side of the "duty" line** as your cousin *if* a duty of easy rescue is accepted. Both failed an obligation (explicit promise vs. implicit minimal humanitarian duty), making their omissions causally relevant and blameworthy. The *source* of the duty differs (promise vs. circumstance/knowledge/capacity), but the structure of responsibility for omission is similar.

  Your intuition that they're "both kinda right" is spot-on. The argument stems from conflating strict physical causation with moral responsibility arising from broken obligations. Your cousin focuses narrowly on the absence of physical action; your grandma focuses correctly on the moral responsibility flowing from his broken promise and its fatal consequence. The philosophical terms help clarify *why* the distinction matters and where the responsibility truly lies.
