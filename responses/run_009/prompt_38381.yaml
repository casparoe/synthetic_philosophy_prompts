answer: |-
  ## AGRICULTURE v1.0 - RELEASE NOTES

  **Release Date:** ~10,000 BCE (Early Access in Fertile Crescent)  
  **Target Environment:** Previously utilized Hunter-Gatherer Ecosystem v0.95  
  **Product Owner:** Sedentary Settlement Working Group (SSWG)  
  **Build Notes:** Major paradigm shift leveraging new Seed Propagation & Animal Containment APIs. Requires significant environmental modification.

  After extensive R&D in select geographical sandboxes, the SSWG is proud to announce the general availability of Agriculture v1.0. This transformative release fundamentally redefines resource acquisition, enabling unprecedented population scaling and long-term asset accumulation. Prepare for a new era of predictable resource streams!

  **NEW FEATURES**

  *   **Structured Caloric Acquisition (SCA):** Introduces deterministic, location-based calorie generation via managed Grain, Legume, and Tuber Cultivation modules. Replaces the legacy probabilistic Foraging subsystem. Offers significantly higher caloric yield per unit area (YMMV based on soil fertility and rainfall RNG).
  *   **Resource Stockpiling:** All-new Surplus Management System (SMS) enables deferred caloric consumption. Vital for seasonal variance mitigation and enabling new social feature development.
  *   **Density-Optimized Habitation:** Implements permanent Settlement Infrastructure. Dramatically reduces daily mobility requirements (see Deprecations). Enables communal asset sharing and enhanced defense coordination.
  *   **Domestication API:** Provides standardized interfaces for Animal Containment and Selective Breeding protocols. Delivers secondary resource streams (Dairy v0.1, Traction v0.5, Wool v0.2). *Note: Meat yield remains under development.*
  *   **Scalability Enhancements:** Core architecture redesigned to support orders-of-magnitude higher user density compared to legacy HG v0.95. Foundation laid for future complex societal modules.

  **BREAKING CHANGES**

  *   **Legacy Permissions Deprecated:** The "Roam Freely" permission inherent in HG v0.95 is revoked. Location is now permanently bound to cultivated land coordinates (see `Known Issues: Resource Contention`).
  *   **Dietary Input Interface Overhaul:** The diverse, seasonal Wild Input Sources API is replaced by the Primary Grain Consumption Interface (PGCI). Expect reduced micronutrient variety and increased monotony. Supplemental foraging modules remain available but are now secondary.
  *   **Workload Rebalancing:** The previous "Episodic Effort" model is replaced by "Scheduled Sustained Labor." Prepare for increased daily active cycles, particularly during Planting and Harvest windows. Efficiency gains in caloric density offset temporal costs.
  *   **Mobility Module Removed:** Long-distance seasonal migration patterns are unsupported. All activity is now local to the Settlement Zone.

  **KNOWN ISSUES**

  *   **KIS-101: Nutritional Profile Regression:** Initial user metrics indicate potential decreases in mean height, bone density, and dental health compared to HG v0.95 baselines. Attributable to PGCI focus and reduced dietary diversity. Workaround: Explore supplemental foraging where available. Status: *Won't Fix - Considered acceptable trade-off for surplus yield.*
  *   **KIS-102: Pathogen Proliferation:** Increased user density (`Density-Optimized Habitation`) combined with close proximity to `Domestication API` outputs (`Animal Containment`) significantly elevates zoonotic disease transmission vectors and epidemic potential. Novel pathogens expected. Status: *Monitoring. Hygiene protocols recommended.*
  *   **KIS-103: Resource Contention:** SCA requires specific land and water resources. Boundary disputes (`Land Grabs`) and resource hoarding (`Surplus Accumulation`) are emergent behaviors. Can lead to `Inter-Settlement Conflict`. Status: *Feature, not bug. Enables future `Leadership` and `Defense` modules.*
  *   **KIS-104: Seasonal Failure Vulnerability:** SCA is highly dependent on consistent environmental parameters (Rainfall, Temperature). Deviations can cause critical `Crop Failure` events, leading to `Famine` states. Legacy HG v0.95 was more resilient to local resource fluctuation. Status: *Mitigate via `Surplus Management System` usage.*
  *   **KIS-105: Monoculture Instability:** Over-reliance on single Grain types increases systemic risk from pest (`Locusts`) or blight (`Ergot`) events. Status: *Recommend implementing rudimentary `Crop Rotation` in future patches.*

  **DEPRECATIONS**

  *   **Hunter-Gatherer Lifestyle (HG v0.95):** All core routines (`Foraging`, `Hunting`, `Seasonal Migration`) are deprecated and no longer actively maintained. Technical support ends immediately. Continued use is strongly discouraged and may become incompatible with the evolving environment.
  *   **Leisure Time Allocation:** The generous "Idle Time" buffers characteristic of HG v0.95 are deprecated. Expect significant reduction in discretionary time units. Reallocated to SCA maintenance tasks.

  **MIGRATION NOTES**

  *   Migration from HG v0.95 to Agriculture v1.0 is irreversible for populations exceeding local foraging carrying capacity. Early adopters report a smoother transition.
  *   **Critical Step:** Upon installation, immediately execute `Land_Clearance` and `Seed_Stockpile` routines. Failure will result in `Starvation` before first harvest.
  *   Expect a significant learning curve (`Generational Knowledge Transfer`) for optimizing SCA yield. Initial efficiency will be low.
  *   **Resource Requirements:** Substantial upfront labor investment (`Terracing`, `Irrigation_Ditch_Digging`) is mandatory for optimal performance. Toolsets (`Plow`, `Sickle`) strongly recommended.

  **ROLLBACK POLICY**

  *   Rollback to HG v0.95 is theoretically supported for individual users or very small cohorts possessing applicable wilderness navigation skills and knowledge.
  *   **CRITICAL CONSTRAINT:** Rollback is **permanently unavailable** for any population cluster that has scaled beyond the local environment's innate foraging carrying capacity – a direct consequence of successful `Scalability Enhancements`. Attempting rollback under these conditions will trigger catastrophic `Malthusian_Collapse`.
  *   SSWG strongly advises against rollback attempts. Focus efforts on optimizing Agriculture v1.0 configuration and developing future stability patches (`Irrigation v1.0`, `Crop Rotation v0.1`).

  Agriculture v1.0 represents a bold step forward in human technological progression. While requiring adaptation, its potential for societal scaling and complexity is unparalleled. Embrace the future of predictable yields! Report all issues via Clay Tablet submissions.

  **The SSWG acknowledges the foundational work of the Hunter-Gatherer Open Source Community.**
