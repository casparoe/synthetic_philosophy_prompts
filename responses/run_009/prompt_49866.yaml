answer: |-
  ### Token Causation Decision Tree  
  **Starting Commitment:** Token causal relations exist between particular events. Answer the following cases to identify your position.  

  ---

  #### (1) **Omission Case**  
  A contract gardener never waters the flowers, which die; no one else would have watered them. Did the *failure to water* cause the flowers' death?  
  - **No** → **Humean Regularity (HR)**  
    *(Causation requires constant conjunction; omissions aren't events in regularities.)*  
  - **Yes** → Proceed to (2).  

  #### (2) **Preemption Case**  
  A bodyguard knocks a poisoned glass off a table. An assassin (waiting to shoot *only if* poisoning failed) then fires, killing the victim. Did the *bodyguard’s action* cause the death?  
  - **No** → **Simple Counterfactual Dependence (SCD)**  
    *(Death doesn’t depend on bodyguard: if he hadn’t acted, the assassin would have caused death.)*  
  - **Yes** → Proceed to (3).  

  #### (3) **Double Prevention Case**  
  A defender destroys a missile before it reaches a city. Attackers had a backup missile set to launch *only if* the first was destroyed, but it was faulty and would never have launched. Did the *defender’s action* cause the city’s survival?  
  - **No** → **UNOCCUPIED**  
    *(Unattractive: Defender’s action is intuitively necessary for survival; no known position denies this.)*  
  - **Yes** → Proceed to (4).  

  #### (4) **Symmetric Overdetermination Case**  
  Two riflemen fire simultaneously; either shot alone would be fatal. Did *each rifleman’s shot* cause the death?  
  - **No** → **UNOCCUPIED**  
    *(Unattractive: Both shots are intuitively causes; denying all causation is implausible.)*  
  - **Yes** → Proceed to (5).  

  #### (5) **Norm-Sensitive Tiebreak Case**  
  Two officials must sign for a permit. Both sign (in either order), but we credit the *second* signature as causing the permit because it "completed" it. Is the *second signature* (not the first) the cause?  
  - **No** → **Lewis’s Chain (LC) or Interventionism (INT)**  
    *(Both reject norm-based privileging: causation is objective. LC traces chains; INT uses interventions.)*  
  - **Yes** → **Contrastive/Context-Sensitive (CC) or Pluralism (PL)**  
    *(CC: Causation is contrast-relative; PL: Multiple criteria apply relative to purposes.)*  

  ---

  ### Key Notes  
  1. **Unoccupied Branches:**  
     - *Double Prevention "No"*: Unattractive (defender’s action is clearly necessary).  
     - *Overdetermination "No"*: Unattractive (denies intuitive causes).  

  2. **Unseparated Positions:**  
     - **LC vs. INT** and **CC vs. PL** *cannot be split* by these cases.  
       - LC and INT both reject norm-sensitive causation but diverge on mechanisms (chain-dependence vs. interventions).  
       - CC and PL both accept context-sensitivity but differ in scope (systematic vs. purpose-relative pluralism).  

  3. **Confidence in Leaf Placement:**  
     - **High confidence**: Omission (isolates HR), Preemption (isolates SCD).  
     - **Moderate confidence**: Double Prevention and Overdetermination (unoccupied branches are clear).  
     - **Lowest confidence**: **Norm-Sensitive Tiebreak Node** (least sure it cleanly splits LC/INT from CC/PL).  
       - Why? LC and INT *might* accommodate norm-sensitivity pragmatically (not ontologically), while PL could mimic CC.  

  ---

  **Tree Structure Summary**  
  - Leaves: HR, SCD, [UNOCCUPIED]×2, LC/INT, CC/PL (6 leaves total).  
  - Paths: All cases covered; positions grouped where cases don’t distinguish.  

  *Use this tree to locate your view, then read primary sources for nuances!*
