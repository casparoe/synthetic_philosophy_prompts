prompt: |-
  My colleague on our institute's risk panel has a voting record I can summarise. She has voted that nuclear war is an existential risk deserving top priority, citing near-misses such as the Cuban Missile Crisis; that asteroid impact qualifies as existential but ranks low given its annual probability; that a deliberately engineered pandemic counts as existential, even though no natural plague has ever come close to ending humanity; that climate change is grave but not existential; and that self-replicating nanotechnology is science fiction not worth the panel's time. She also holds, on reflection, that humanity's track record of surviving past catastrophes is itself strong evidence against assigning any high probability to near-term extinction. Next month she votes on whether risks from advanced artificial intelligence belong on the existential list. Predict her verdict, but I am more interested in the rule she seems to be running: is she counting as existential only those threats for which we have historical near-misses or natural analogues, or any threat with a plausible mechanism for killing everyone that current science could in principle deliver, or something about which technologies have actually been built rather than merely projected? Her engineered-pandemic and nanotechnology votes pull in opposite directions here, so please say which candidate rule fits her record best and why, what each rule predicts about her vote on AI, and which further case — say, a lab-grown pathogen far deadlier than anything found in nature, or a hypothesised physics disaster with a real mechanism but no precedent whatsoever — would best tell the rules apart.
reasoning: |-
  Okay, let me tackle this user's query. They want to predict their colleague's vote on AI risk and understand her underlying rule for existential threats. 

  First, I need to parse her voting record. She accepts nuclear war (historical near-miss) and engineered pandemics (no natural precedent but plausible mechanism), but rejects nanotech (calls it sci-fi) and climate change (grave but not existential). The asteroid vote shows she weighs probability, but that's secondary. 

  Hmm, the engineered pandemic vote is key here. She accepts it despite no historical analogue, which suggests she doesn't strictly require past precedents. Yet she dismisses nanotech for being "not built." That's the tension - what makes engineered pathogens plausible but nanotech not? 

  Ah! Maybe it's about current capability. Engineered pathogens build on existing biotech, while nanotech feels futuristic. Her "science fiction" comment implies she discounts threats without real-world tech foundations. 

  For AI risk, she'll likely vote "yes" - we already have narrow AI systems, and the mechanisms for existential risk (like recursive self-improvement) are actively debated. Unlike nanotech, AI isn't hypothetical tech. 

  To test between rules, a physics disaster with no precedent but solid mechanism would be perfect. If she rejects it, she requires historical analogues; if accepts, she goes by plausible mechanisms. My bet? She'd reject it - her record shows skepticism toward unprecedented threats (see climate change rejection despite mechanisms). 

  The user's deeper need seems to be understanding how experts draw lines on speculative risks. They might be preparing counterarguments or assessing panel bias. I should emphasize the "current feasibility" angle since it resolves her seemingly contradictory votes best.
answer: |-
  Based on your colleague's voting record and reasoning, here's the breakdown:

  1.  **Predicted Verdict on AI Risk:** **She will vote YES, classifying AI as an existential risk deserving consideration.**

  2.  **Her Underlying Rule (Best Fit):** **She counts as existential those threats with a *plausible mechanism* for causing extinction *that is grounded in current or near-future science and technology*, even without historical near-misses, *provided* she judges the underlying technology to be *feasible and actively being developed* (or already exists).**

  **Analysis of Her Rule & Record:**

  *   **Nuclear War:** Accepted (Existential). Fits *all* candidate rules: historical near-miss (Cuban Missile Crisis), plausible mechanism, technology built.
  *   **Asteroid Impact:** Accepted (Existential, low priority). Fits *all* candidate rules: natural analogue (smaller impacts), plausible mechanism, science understands it (even if deflection tech isn't mature).
  *   **Engineered Pandemic:** Accepted (Existential). **Crucial point:** She accepts this *despite* "no natural plague has ever come close to ending humanity." This explicitly **rejects** the rule requiring historical near-misses or natural analogues. Her acceptance relies on the *plausible mechanism* enabled by current/foreseeable biotech ("could in principle deliver").
  *   **Climate Change:** Rejected (Grave, not existential). While having historical analogues (past climate shifts) and a plausible mechanism (science understands warming), she judges the *extinction mechanism* as implausible within the relevant timeframe. This suggests the plausible mechanism rule *alone* isn't sufficient; her judgment on *feasibility of the worst-case outcome* matters more than just the mechanism existing in principle.
  *   **Nanotechnology:** Rejected (Sci-fi). **Crucial point:** She explicitly dismisses it as "not worth the panel's time," calling it science fiction. This directly contrasts with engineered pandemic. Why? The plausible mechanism exists *in theory* (grey goo, etc.), but she judges the *technology itself* as not "current science... could in principle deliver" *in a feasible, near-term way*. She sees it as speculative, not actively being built towards the dangerous form.
  *   **Past Survival Track Record:** Used to argue *against* high near-term extinction probability. This shows she weighs evidence of *feasibility* and *likelihood*, but crucially **doesn't negate the *existential potential* of a threat** if the mechanism is plausible and the tech is real. It affects *probability assessment*, not *qualification* as existential.

  **Why "Plausible Mechanism + Current/Active Tech Feasibility" Fits Best:**

  *   It explains the **engineered pandemic (Yes)** vs. **nanotech (No)** divergence perfectly:
      *   Pandemic: Plausible mechanism *and* the underlying biotech (genetic engineering, synthetic biology) is demonstrably real, advancing rapidly, and actively used. The existential leap, while unprecedented, builds on existing capability.
      *   Nanotech: Plausible mechanism (in theory), but she sees the *specific dangerous form* (self-replicating nanobots) as purely speculative science fiction, not grounded in current, actively developing technology. It lacks the "could in principle deliver *soon*" aspect she requires.
  *   It aligns with accepting **nuclear war** (tech built) and **asteroids** (science understood), while rejecting **climate change**'s *extinction mechanism* as implausible (despite the tech/science existing for warming) and using **past survival** to argue *probability* down (not disqualification).

  **Predictions for AI based on this Rule:**

  *   **Plausible Mechanism:** Arguments for catastrophic or extinction risks from advanced AI (misaligned goals, uncontrollable recursive self-improvement, weaponization) are widely discussed and considered plausible by many experts in the field. Your colleague is likely aware of these arguments.
  *   **Current/Active Tech Feasibility:** AI technology (especially advanced machine learning) is demonstrably real, advancing extremely rapidly, and is the focus of massive investment and active development globally. The path from current narrow AI to potentially dangerous superintelligence is highly uncertain, but the *foundational technology is undeniably here and progressing*.
  *   **Therefore:** AI fits her rule much more like engineered pandemic than nanotechnology. She will likely judge that the plausible mechanisms *are* grounded in the trajectory of *real, active technology*. Hence, **she votes YES**.

  **Differentiating Rule Test Case:**

  The best case to distinguish between "Requires Historical Analogue" and "Plausible Mechanism + Current Tech Feasibility" is:

  *   **Hypothesized Physics Disaster (e.g., Strange Matter Disaster, Vacuum Decay Triggered in a Lab):**
      *   **Plausible Mechanism?** Hypothetical mechanisms exist within theoretical physics (though often considered extremely unlikely by physicists).
      *   **Historical Near-Miss/Analogue?** None whatsoever. Completely unprecedented.
      *   **Current/Active Tech Feasibility?** The technology required (e.g., ultra-high-energy particle colliders beyond current scale) doesn't currently exist to trigger such events, and actively building tech *specifically for this purpose* is not happening. It's purely theoretical risk from potential future experiments.

  **Prediction based on her rule:**
  *   She would **REJECT** this as an existential risk worth the panel's time, similar to nanotechnology. Her reasoning would be: "While the mechanism is discussed in theoretical physics, the technology required is purely speculative science fiction at this point, far beyond anything being built or planned. No credible evidence suggests this is a near-term or even plausible future risk. It belongs in science fiction, not risk assessment."

  This rejection, despite a plausible (though highly speculative) mechanism and no precedent, would strongly confirm the "Plausible Mechanism **+ Current/Active Tech Feasibility**" rule and differentiate it from a simple "Plausible Mechanism" rule (which would likely accept it) or a "Historical Analogue" rule (which would definitely reject it). The lab-grown pathogen case is less differentiating because she *already* accepted engineered pandemic, proving she doesn't need historical analogues, and the underlying tech is feasible.
