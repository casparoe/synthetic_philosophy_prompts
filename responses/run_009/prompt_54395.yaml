answer: |-
  ## Opening Remarks: The Unsettled Ground of Backsliding  
  *(Approx. 8 Minutes)*

  Good morning. It’s genuinely heartening to see constitutional lawyers, quantitative political scientists, and advocacy practitioners sharing this room. That rarity, frankly, is the first clue to the problem we’re here to unpack: **the concept of "backsliding" itself.**

  Our working title points to three tasks: Concept, Measurement, Case. But before we measure, before we dissect cases, we must confront a foundational tension running through this room – a tension about what *defines* democratic backsliding in the first place. And that tension isn’t academic hair-splitting; it shapes how we see the world, what we measure, and what we sound the alarm about.

  **Let me frame the central question starkly: Is backsliding defined by *how power is wielded*, or by *whether power can actually change hands*?**

  **On one account – let’s call it the *Mechanism Account* – backsliding is a process.** It’s a now-familiar repertoire: stacking courts with loyalists, co-opting media regulators, tilting electoral rules, constraining civil society – actions often wrapped in the cloak of legal procedure, sometimes even passed by supermajorities. The focus here is on the *hollowing out*: meticulously reshaping the arena so the *forms* of democracy remain – elections happen, courts sit, assemblies meet – but the substance of real competition, of genuine accountability, is drained away. The *means* are the signal.

  **On another account – the *Outcome Account* – backsliding is revealed in results.** The ultimate test is whether elections remain truly competitive and unpredictable. Can the opposition actually win? Can power *change hands* through the ballot box? If it can, the argument goes, even if the playing field is steeply tilted, the core democratic function survives. The *end result* is the signal.

  **These two accounts often travel together.** Mechanisms deployed to entrench power usually aim to prevent the loss of power. But crucially, they *can* come apart. And where they diverge, our concept gets uncomfortable.

  **Consider a hypothetical scenario – a case study we might invent for today, precisely to avoid prejudging our later panels:** Imagine a government. Over several years, it methodically implements the classic repertoire. It packs the constitutional court. It brings major media under friendly ownership or control. It redraws districts and tweaks electoral laws in ways experts agree systematically disadvantage the opposition. The mechanisms are all there, ticking the boxes on many procedural lists. Then, an election comes. Perhaps due to overwhelming economic discontent, perhaps due to an unexpectedly charismatic opposition campaign, perhaps just sheer miscalculation… the government loses. Power changes hands.

  **What do we have here?**
  *   **Through the Mechanism Lens:** This looks like clear backsliding. The arena was deliberately, formally rigged. The fact that the incumbents lost *despite* their efforts doesn't erase the damage done to the institutional safeguards.
  *   **Through the Outcome Lens:** This looks like... democracy working. However uneven the field, the ultimate check – the voters removing the government – functioned. The erosion wasn't terminal.

  **How you react to that case likely reveals which account resonates most deeply with *your* work.** Lawyers might see the captured court as a lasting wound, regardless of the election result. Political scientists tracking turnover might see the outcome as proof against backsliding in this instance. Advocates might grapple with how to message this: "Victory achieved despite an undemocratic system" sends a very different signal than "System proved resilient."

  **This brings us to a second, equally vital question hanging over our three days: *Who gets to decide?*** Determining "backsliding" isn't just an epistemological exercise; it's an exercise with real-world consequences. It involves judgement calls with high stakes.

  *   **Index producers** distill complex realities into numbers and rankings, powerfully shaping academic discourse and international perceptions. But what weight do they assign process versus outcome? How do they calibrate their scales?
  *   **Supranational bodies** wield treaty procedures and peer reviews. Their pronouncements can trigger diplomatic consequences or funding decisions. How do they navigate the tension between formal compliance and substantive democratic health?
  *   **Advocacy organisations** translate complex diagnoses into compelling narratives for journalists, donors, and the public. They need concepts that travel, that fit headlines and funding proposals – concepts that "survive contact with a press release." This pragmatism isn't a corruption; it's a necessary fact of their vital work in mobilizing attention and resources. But it inevitably shapes the *application* of the concept.

  Scholars, your pursuit of precise, measurable definitions is indispensable. But we must acknowledge that the concept doesn't live solely in journals; it lives in these messy, consequential spaces of judgement and action. The "pen" is held by many hands.

  **And underpinning all of this is the word itself: "Backsliding."** It quietly whispers a question we often avoid: *Sliding back from what?* What is the baseline? For many states, the relevant starting point – a founding constitutional moment, an accession standard to a club, an idealized past – is itself contested territory. Was that baseline ever truly democratic, equitable, or stable? Can "backsliding" ever be a truly neutral analytical concept, or is it inherently value-laden, essentially contested – something we should study *as* a contest, rather than lamenting the contest itself?

  **So, as we begin these three days, I challenge us not to rush towards answers, but to sit with these tensions:**
  1.  **Mechanism vs. Outcome:** Where does the essence of backsliding lie – in the *erosion of safeguards* or the *failure of popular sovereignty*?
  2.  **The Question of Judgement:** Who gets to wield the concept, with what tools, and facing what practical constraints? How do these different actors – all crucial – influence what "backsliding" *means* in practice?
  3.  **The Baseline Problem:** Can we even define "sliding back" without grappling with the contested nature of the starting point itself?

  Our task isn’t to settle the concept of backsliding today. It’s to make the *struggle* with the concept our shared ground. Let’s explore its fractures, its ambiguities, and its power – because only by understanding the tensions can we hope to measure meaningfully, analyze rigorously, and advocate effectively.

  Thank you. I look forward to the friction.
