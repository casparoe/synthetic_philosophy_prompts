  For part (ii), the key difference lies in dependency structures. In the mugging, the predictor's action depends on your policy across counterfactuals, creating acausal control. In blackmail, the dossier's existence is fixed before your choice, making your action purely informational. This explains why paying in the mugging feels productive (helping another self) while paying in blackmail feels like being duped.

  Part (iii) requires defending conclusions. For the mugging, I'll argue updateless reasoning is rational because it maximizes expected value across branches. For blackmail, causal decision theory is correct since evidence shouldn't dictate paying when it has no causal effect. The strongest counterarguments: refusing the mugging avoids "irrational" payment, but that loses the $10k benefit; paying the blackmail could be seen as avoiding risk, but that invites exploitation.

