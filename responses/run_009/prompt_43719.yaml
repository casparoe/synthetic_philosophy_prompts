  **Proposal Text**

  **Title: Conceivability Re-factored: Mode, Grain, and the Stability of Modal Intuitions**

  **I. Research Question**

  How do the mode (quasi-perceptual, imagistic simulation vs. descriptive, propositional supposition) and grain (coarse, schematic representation vs. fine, detailed specification) of conceiving interact to determine the stability, dialectical persistence, and modal force of conceivability claims in philosophical thought experiments?

  **II. Gap in the Literature**

  Current taxonomies of conceivability—distinguishing prima facie from ideal conceivability, positive from negative conceivability, and sometimes noting an imagistic/descriptive distinction—capture aspects of the phenomenon but fail to systematically investigate the interaction between the representational mode and the level of detail in the scenario. As a result, they cannot explain why some conceivability claims (like zombies) generate persistent but unstable disagreement, while others (like the necessity of identity for natural kinds) lead to stable conclusions. The gap is the lack of a unified framework that predicts, from the structure of the conceiving act itself, which claims survive scrutiny and which do not.

  **III. Method**

  The project will proceed in five phases over twelve months:

  *Months 1-2: Framework Development.* Refine the definitions of mode and grain, drawing on existing literature. Develop a coding manual for classifying thought experiments along these dimensions. *Milestone: Operationalized coding framework.*

  *Months 3-4: Matrix Construction.* Select 15-20 key thought experiments (e.g., zombie argument, inverted spectrum, water/H2O, disembodied mind, etc.) and code each for mode and grain. *Milestone: Completed matrix with coded cases.*

  *Months 5-7: Prediction Formulation.* For each combination of mode and grain, generate hypotheses about: (a) stability under reflection (will the conceivability claim hold when details are filled in?), (b) propensity for disagreement (will philosophers dispute the conceivability?), and (c) modal force (does it support metaphysical possibility or a weaker kind?). *Milestone: Set of testable predictions for each case.*

  *Months 8-9: Historical Analysis.* Test predictions by analyzing the trajectory of debates around each thought experiment in key texts. Determine whether the predicted patterns (e.g., instability for coarse imagistic cases, stability for fine descriptive ones) match the actual dialectic. *Milestone: Report of pattern matches and mismatches.*

  *Months 10-11: Theory Refinement.* Develop an account of why certain mode-grain combinations yield stable/unstable intuitions. Address counterexamples and refine the framework. *Milestone: Draft theory chapter.*

  *Month 12: Synthesis and Write-up.* Compile findings into a dissertation chapter and prepare for publication.

  **IV. Positive Result and Significance**

  A positive result would show that the two-dimensional framework systematically predicts the dialectical behavior of conceivability claims: for instance, that coarse-grain imagistic conceiving (as in zombies) produces intuitions that are compelling initially but break down under pressure, while fine-grain descriptive conceiving (as in natural kind identities) yields robust inferences to metaphysical possibility. This would resolve longstanding disputes by showing that apparent disagreements often stem from mismatches in how scenarios are conceived, without rejecting modal intuition wholesale. It would advance modal epistemology by providing a more nuanced account of conceivability.

  **V. Failure Conditions**

  The project would fail if:
  1. Mode and grain cannot be reliably coded for the thought experiments (inter-coder reliability too low).
  2. The predictions do not match the historical record (e.g., coarse imagistic cases are as stable as fine descriptive ones).
  3. The framework does not yield new insights beyond existing taxonomies.

  **VI. Feasibility**

  One year is sufficient because the thought experiments are well-documented and the framework is focused. Risks include: (1) the historical analysis becoming unwieldy (mitigated by pre-selecting cases); (2) the framework being too simplistic (addressed by iterative refinement). Even if the core hypothesis fails, the project will produce a valuable taxonomy and diagnostic tool for modal epistemology.

