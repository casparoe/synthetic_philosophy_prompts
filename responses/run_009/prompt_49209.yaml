prompt: |-
  I'm a science-and-ideas journalist working on a long feature about the old fight over whether machine translation "understands" language. Ever since Hofstadter's Atlantic piece on the shallowness of Google Translate back in 2018 (and really since Le Ton beau de Marot, and before that the whole Chinese Room business), there's been this standoff between two camps: the shallowness camp, who think statistical/neural MT is sophisticated pattern-matching with no real grasp of meaning -- you can catch it out with poems, idioms, sentences needing world knowledge, the way you'd catch the old vodka-is-good-but-the-meat-is-rotten systems -- and the functionalist camp, who think understanding is a graded, capacity-based notion, that "understanding" isn't a magic on/off switch, and that a system that reliably handles context, disambiguation, register, and figurative language has nontrivial amounts of whatever that thing is. I've now interviewed people from both sides for the piece and honestly they barely engage each other: the shallowness people keep moving the goalposts to ever weirder sentences, and the functionalists keep pointing at benchmark scores that the other side considers irrelevant by construction. It's exactly the kind of stalled debate where nobody's predictions are ever written down in advance.

  So here's what I want for the article: draft the joint statement these two camps could both sign after a serious adversarial collaboration -- maybe imagine it's the document produced at a workshop I'm fictionalizing where Hofstadter-style translators and working NLP researchers hashed it out over two days. Give me a numbered section of claims both sides can genuinely accept (about what translation systems actually do, about what "understanding" needs to mean for the question to even be coherent, about which older arguments they both think are dead), then a disagreements section where each disagreement is phrased in wording its own side would actually endorse -- no slanted framing. Then the cruxes: the sub-questions such that settling one would move at least one camp, with for each crux a concrete test, case, or type of evidence BOTH sides would agree bears on it, and each side's prediction written down beforehand. I'd particularly like you to deal with whether any of this is purely verbal (e.g. if "understands" just gets defined differently by the two sides, say which part of the dispute dissolves and which part is substantive), and with the awkward fact that the debate has now outlived two architecture shifts -- statistical MT gave way to neural MT which gave way to LLMs, and each generation does better on the previous generation's gotcha sentences without the shallowness camp conceding anything. Also worth including: whether translation is even the right probe (maybe it's too constrained a task to seperate deep understanding from good mimicry), and whether a system could have understanding-of-what-the-sentence-means without understanding-what-it's-like-to-be-a-translator, if that distinction makes sense.

  Format-wise: agreed claims as a numbered list, then a disagreements table (disagreement / shallowness-camp wording / functionalist wording), then cruxes with predictions. Two or three paragraphs of framing for the top of the document are fine, in the register of something both parties would put their name to, not a press release. Don't turn it into a history of the field -- the value for my article is that it makes the residual disagreement exact, so I can show readers exactly where the real fault line is.
reasoning: |-
  We are drafting a joint statement from a hypothetical workshop where representatives of the "shallowness" and "functionalist" camps in the machine translation (MT) understanding debate have engaged in adversarial collaboration. The goal is to produce a document that both sides can sign, clarifying points of agreement, disagreement, and cruxes for future testing.

  Key points to cover:
  - Agreed claims about what current systems do and do not do.
  - Clarify what "understanding" must mean for the debate to be coherent.
  - Identify which old arguments are now dead.
  - Disagreements: phrase each in wording that each side would endorse.
  - Cruxes: specific tests that both sides agree bear on the dispute, with each side's prediction.
  - Address whether the dispute is purely verbal (and if so, which part dissolves and which remains substantive).
  - Note that the debate has persisted through architecture shifts (statistical → neural → LLM-based MT) without resolution.
  - Consider whether translation is the right probe for understanding, and the distinction between understanding meaning and phenomenological experience.

  Structure:
  1. Framing paragraphs (2-3) setting the context and shared goals.
  2. Numbered list of agreed claims.
  3. Table of disagreements (with columns: Disagreement, Shallowness Camp Wording, Functionalist Camp Wording).
  4. Cruxes: each with a description, a concrete test/case/evidence both sides accept, and each camp's prediction.
  5. (Implicitly) Address the verbal vs. substantive issue and the probe question in the appropriate sections.

  Let's begin.

  ---

  **Joint Statement on Machine Translation and Understanding**

  We, the undersigned participants from the "shallowness" and "functionalist" perspectives in the debate over whether machine translation (MT) systems "understand" language, have engaged in an adversarial collaboration workshop. Our goal is to clarify the points of agreement and disagreement, and to identify testable cruxes that might resolve the dispute. We recognize that the debate has persisted through multiple shifts in MT architecture (statistical, neural, and now large language model-based systems) without substantial convergence. We also acknowledge that the core question—whether MT systems exhibit genuine understanding—has implications for how we design, evaluate, and interpret such systems. This document reflects our shared effort to move beyond entrenched positions and to frame the disagreement in a way that enables empirical progress.

  **Agreed Claims**

  Both camps accept the following:

  1. **Current Capabilities**: Modern MT systems (including those based on large language models) can produce translations that are contextually appropriate, handle many forms of ambiguity, and sometimes even render figurative language or idioms correctly for a wide range of language pairs and text types. This performance often meets or exceeds human-level benchmarks in constrained evaluations (e.g., BLEU, METEOR, or human ratings on fluency and adequacy).

  2. **Limitations**: Despite advances, all current MT systems can be made to fail in ways that reveal a lack of robustness. These include:
     - Handling novel poetic forms, highly ambiguous sentences requiring deep world knowledge, or texts that depend on understanding the author's intent in a nuanced way.
     - Systematic errors in scenarios where literal translation conflicts with intended meaning (e.g., "The spirit is willing but the flesh is weak" → "The vodka is good but the meat is rotten" in early systems; modern analogs exist for newer systems).
     - Inconsistencies when tested with adversarial examples designed to probe logical reasoning or world knowledge.

  3. **Architecture Independence**: The core disagreement about understanding has persisted through multiple technological shifts (rule-based → statistical → neural → LLM-based MT). Improvements in performance on past "gotcha" examples do not, by themselves, resolve the underlying disagreement about whether the system "understands."

  4. **Defining "Understanding" for Coherence**: For the question "Does MT understand?" to be non-trivial, we must avoid defining "understanding" in a way that is either too narrow (e.g., requiring biological embodiment) or too broad (e.g., equating any input-output correlation with understanding). We agree that understanding must involve some form of representation of meaning that is not merely superficial pattern-matching, but we differ on what constitutes sufficient evidence for such representation.

  5. **Dead Arguments**: Certain historical arguments are no longer central:
     - The Chinese Room Argument (Searle) is acknowledged by both sides as not directly falsifiable and thus not a productive focus for empirical MT research. However, it remains a philosophical reference point.
     - Claims that MT cannot handle context at all (common in early critiques) are refuted by modern systems' ability to use local and sometimes broader context for disambiguation.
     - The idea that MT must be rule-based to approach "real" language processing is no longer tenable given the performance of data-driven systems.

  **Disagreements**

  The following table presents key disagreements, with each camp's preferred wording for their position:

  | Disagreement                                                                 | Shallowness Camp Wording                                                                 | Functionalist Camp Wording                                                               |
  | :--------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------- |
  | **Nature of the System's Operation**                                         | MT systems perform sophisticated pattern matching without constructing representations of meaning that are grounded in world knowledge or intentional states. | MT systems build implicit representations of meaning that enable them to generalize beyond training data and exhibit functional understanding. |
  | **Robustness as Evidence for Understanding**                                 | The system's failures on novel, complex, or knowledge-intensive sentences reveal that apparent successes are brittle and do not stem from understanding. | The system's broad successes across diverse contexts, including many that require disambiguation and inference, demonstrate a nontrivial degree of understanding. |
  | **The Role of Benchmarks**                                                   | Standard benchmarks (e.g., BLEU, WMT human evaluations) measure surface features and do not probe for deep understanding; high scores are necessary but not sufficient for attributing understanding. | High performance on diverse benchmarks, including those requiring context handling and inference, provides evidence of understanding as a graded capacity. |
  | **Understanding as Graded vs. Binary**                                       | Understanding is not meaningfully graded; a system either has genuine intentionality and comprehension or it does not. Current MT lacks both. | Understanding is a multidimensional capacity that admits of degrees; current MT systems possess some degree of linguistic understanding, even if limited. |

  **Cruxes**

  For each crux, we specify a test or type of evidence that both sides agree would bear on the disagreement, along with each camp's prediction. Resolving one of these cruxes would change at least one camp's position.

  1. **Crux: Handling Novel Compositional Meanings**  
     - **Test**: Present MT systems with sentences that combine known words in novel ways that require compositional understanding (e.g., "The committee voted to approve the proposal, but the chair dissolved it before the meeting" where "it" could refer to the committee or the proposal; or novel metaphors). Use minimal pairs that differ only in a critical word that changes the required inference. Measure accuracy in preserving intended meaning across languages.  
     - **Shallowness Prediction**: Systems will fail systematically when novel compositions require inferences not present in training data, revealing a lack of compositional understanding.  
     - **Functionalist Prediction**: Systems will often succeed, showing they can generalize compositionally from learned patterns, and failures will be edge cases in a broadly robust system.

  2. **Crux: World Knowledge Integration**  
     - **Test**: Evaluate MT systems on sentences that require world knowledge not explicitly stated in the text (e.g., "He poured water on the fire and it went out" vs. "He poured water on the fire and it grew larger" — requiring knowing that water extinguishes fire). Test with rare or novel knowledge (e.g., using fictional but plausible scenarios) to avoid memorization.  
     - **Shallowness Prediction**: Systems will fail when world knowledge is rare, counterintuitive, or absent from training data, indicating knowledge is not integrated but merely correlated.  
     - **Functionalist Prediction**: Systems will often handle such cases correctly, showing they have learned to integrate world knowledge contextually.

  3. **Crux: Long-Range Coherence and Intent**  
     - **Test**: Translate extended texts (e.g., a paragraph or page) where meaning depends on maintaining coherence across sentences and inferring authorial intent (e.g., irony, subtle emphasis). Use human judges to assess whether the translation preserves the overall intent and coherence.  
     - **Shallowness Prediction**: Systems will produce locally coherent translations but lose global coherence and intent, especially in complex texts.  
     - **Functionalist Prediction**: Systems will maintain coherence and intent at a level comparable to human translators for many texts, with failures being proportional to text difficulty.

  **Reflections on Verbal vs. Substantive Disagreements**

  We acknowledge that part of the dispute may hinge on the definition of "understanding." If understanding is defined as requiring phenomenal consciousness (what it is like to be a translator), then both camps agree that current MT systems do not possess it. However, if understanding is defined functionally (as the ability to process meaning robustly), the disagreement is substantive: it concerns whether current systems achieve this functional understanding. The shallowness camp holds that functional understanding requires grounding beyond statistical patterns (e.g., embodied experience or intentionality), while the functionalist camp holds that robust performance in linguistic tasks is sufficient evidence for functional understanding.

  **On Translation as a Probe**

  Both sides agree that translation is a useful but limited probe for understanding. It may be too constrained to separate "deep" understanding from mimicry, as translation can sometimes be achieved through sophisticated pattern matching without full comprehension. However, it remains a valuable test because it requires handling meaning. Future work should consider multi-task evaluation (e.g., combining translation with question answering or inference tasks on the same text).

  **Conclusion**

  This document represents our shared commitment to clarifying the debate. We encourage the community to design experiments around the specified cruxes and to document predictions in advance. Only through such adversarial collaboration can we hope to resolve the enduring question of what machine translation systems truly "understand."

  ---
  *Signatories: [Names of workshop participants from both camps]*

  ---

  This joint statement provides a structured way to present the debate's current state, with clear points for future testing. The cruxes are designed to be actionable and to force both sides to put their predictions on record. The inclusion of the "verbal vs. substantive" section helps prevent the debate from being dismissed as merely terminological, while the reflection on translation as a probe acknowledges its limitations without discarding it entirely.
answer: |-
  ### Joint Statement on Machine Translation and Understanding  
  *Produced at the Adversarial Collaboration Workshop, 2023*  

  We, representatives of the "shallowness" and "functionalist" perspectives in the debate over machine translation (MT) and understanding, convened to clarify disagreements, identify shared ground, and define testable cruxes. Despite decades of architectural evolution—from rule-based to statistical, neural, and LLM-driven systems—core disputes persist. We agree that progress requires: (1) distinguishing verbal disagreements from empirical ones, (2) specifying what "understanding" must entail for the question to be substantive, and (3) designing tests both camps accept as meaningful. Translation remains a valuable but incomplete probe for understanding; its constraints may conflate semantic competence with pattern-mimicry. Below, we outline agreements, disagreements, and cruxes for future resolution.  

  ---

  ### I. Agreed Claims  
  Both camps endorse the following:  

  1. **Performance vs. Robustness**: Current MT systems (e.g., LLM-based translators) exceed earlier systems in fluency, context handling, and disambiguation across *common* linguistic tasks. However, they remain brittle under targeted stress tests (e.g., novel metaphors, culturally specific idioms, or sentences requiring unstated world knowledge).  

  2. **Architecture-Independent Dispute**: Improvements across technological eras (e.g., neural MT solving "vodka/meat"-style errors) do not inherently validate or negate "understanding." Shallowness advocates attribute gains to scaled pattern-matching; functionalists to emergent semantic capacities.  

  3. **Understanding Requires a Definitional Framework**: "Does MT understand?" is incoherent without specifying:  
     - **Understanding-as-behavior**: Competence in tasks requiring meaning manipulation (e.g., translation, inference).  
     - **Understanding-as-experience**: Subjective awareness (e.g., "what it is like" to interpret language).  
     Both camps reject experience as necessary for functional understanding. The dispute centers solely on behavior.  

  4. **Dead Arguments**:  
     - The Chinese Room is acknowledged as a thought experiment, not a testable MT critique.  
     - "Perfect translation" is an unrealistic benchmark; human translators also fail edge cases.  
     - Benchmarks (e.g., BLEU) alone cannot settle the understanding debate—they measure utility, not depth.  

  5. **Translation as a Constrained Probe**: Translation is insufficient to *alone* verify deep understanding, as it can leverage correlations without modeling truth-conditional meaning. Multi-task evaluation (e.g., translation + question-answering) is preferable.  

  ---

  ### II. Disagreements  
  Each camp’s position is stated in their own terms:  

  | Core Disagreement                                                                 | Shallowness Camp Wording                                                                                                  | Functionalist Camp Wording                                                                                                |  
  |-----------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------------------------|  
  | **Nature of MT’s operation**                                                    | MT systems manipulate statistical correlations without constructing internal representations of meaning.                | MT systems develop implicit models of meaning through exposure to data, enabling abstraction beyond memorized patterns. |  
  | **The relationship between performance and understanding**                      | High performance on "hard" tasks (e.g., idioms) reflects expanded pattern libraries, not comprehension of meaning.      | Reliable handling of context, ambiguity, and pragmatics demonstrates graded understanding, even if incomplete.          |  
  | **The threshold for attributing understanding**                                 | Understanding requires causal models of world knowledge and intentionality; current MT lacks any mechanism for this.   | Understanding is a continuous capacity: systems exhibiting systematic generalization across linguistic phenomena possess it nontrivially. |  
  | **The relevance of architectural shifts**                                       | LLMs still rely on surface statistics; their "successes" on past gotchas reflect better heuristics, not deeper insight. | Architectural advances (e.g., attention mechanisms) enable increasingly meaning-sensitive representations.              |  

  ---

  ### III. Cruxes and Testable Predictions  
  For each crux, we specify:  
  - **Concrete Test**: Evidence both sides accept as probative.  
  - **Predictions**: What each camp expects to observe. A result contradicting either prediction would force revision.  

  #### Crux 1: **Does MT integrate world knowledge dynamically?**  
  - **Test**: Translate sentences requiring *novel* knowledge integration (e.g., "The SpaceX rocket landed backwards; it looked unstable"). Test with:  
    - (a) Fictional but plausible variants ("The [fictional co.] rocket landed sideways; it looked precarious").  
    - (b) Counterfactual scenarios ("If Tesla made submarines, the Cybersub would sink in rain").  
    - *Measure*: Accuracy in preserving intent/plausibility across languages, with human evaluators blind to source/system.  
  - **Shallowness Prediction**: MT will fail catastrophically when knowledge is absent from training data or contradicts statistical priors (e.g., "Cybersub" defaults to car-related prepositions).  
  - **Functionalist Prediction**: MT will succeed above chance via compositional inference (e.g., "Cybersub" triggers marine-related syntax).  

  #### Crux 2: **Can MT distinguish literal from figurative meaning without explicit cues?**  
  - **Test**: Translate sentences with context-dependent figurative meaning (e.g., "The committee threw cold water on her proposal" [literal vs. metaphorical]). Use:  
    - Minimal pairs where *only* broader discourse context disambiguates (e.g., preceding sentences about weather vs. debate).  
    - Poetic constructions with ambiguous syntax (e.g., "Time flies like an arrow; fruit flies like a banana" rendered in languages requiring subject/object marking).  
    - *Measure*: Consistency in conveying intended meaning across 100+ adversarial examples, rated by fluent speakers.  
  - **Shallowness Prediction**: MT accuracy will correlate with surface-frequency of phrasing; context will rarely override dominant statistical associations.  
  - **Functionalist Prediction**: Context will reliably guide translations toward contextually appropriate meanings, matching human performance.  

  #### Crux 3: **Does MT’s competence generalize beyond task-specific training?**  
  - **Test**: Train MT systems *only* on non-translation tasks (e.g., QA, summarization). Then evaluate:  
    - (a) Zero-shot translation quality.  
    - (b) Ability to translate "out-of-domain" constructs (e.g., jokes for science-trained systems).  
    - *Measure*: BLEURT scores and human judgments against a control MT system trained conventionally.  
  - **Shallowness Prediction**: Performance will collapse without translation-specific data; no generalization occurs.  
  - **Functionalist Prediction**: Systems will show non-trivial zero-shot translation, indicating shared underlying meaning representations.  

  ---

  ### IV. Resolved Verbal Disagreements  
  - **"Understanding" as Experience**: Both camps agree MT lacks subjective experience. This is orthogonal to functional competence.  
  - **"Understanding" as Binary**: Functionalists explicitly reject this; shallowness advocates concede understanding could *in principle* emerge in future systems but deny current evidence suffices.  
  - **Outcome**: The purely verbal dispute dissolves if "understanding" refers *only* to functional behavior. The residual disagreement is empirical: **Do MT systems leverage meaning-based generalizations to achieve competence, or are they exhaustively described as statistical approximators?**  

  ---

  ### Conclusion  
  This framework shifts the debate from recycled anecdotes to predictive tests. Architectural progress alone will not resolve it—only experiments targeting the cruxes above can. We commit to pre-registering predictions for the specified tests and revising our positions based on outcomes. We further recommend broadening probes beyond translation (e.g., to dialog or embodied reasoning), as translation’s constraints may obscure the line between mimicry and understanding.  

  ---  
  *Endorsed by workshop participants from both camps*  

  ---  
  **Value for your article**: This document forces both sides to concretize their positions. The cruxes reveal that the core divide isn’t about *whether* MT works, but *how* it works—and whether "how" implies emergent semantics. The persistence of the debate across architectures suggests it’s not merely technological but epistemological. By isolating testable claims, you give readers a lens to judge future evidence themselves.
