prompt: |-
  I help run a little film discussion group, and an argument from last week has been stuck in my head since. We were talking about review aggregators, because someone noticed the same movie can sit at like 85% on Rotten Tomatoes and a 45 metascore on Metacritic, and studios happily put whichever number looks better on the poster. The way these sites work is actually pretty different: Rotten Tomatoes just counts professional reviews as thumbs-up or thumbs-down and reports the percentage that came in positive. Metacritic converts each review into a number, weights some publications more heavily than others, and averages everything into a single 0-100 score. And then there's the IMDb user score, where the "judges" are basically whoever made an account. Three numbers, three methods, one movie, and the industry treats all of them as if they measure the same thing.

  What I want to figure out is what each of these practices presupposes about taste. Does the Tomatometer presuppose that aesthetic judgment is fundamentally binary and that the right move is just to poll — like, the standard is whatever the majority of critics converge on? Does Metacritic presuppose something much stronger, an actual common quantitative scale of quality, the way temperature is a scale, such that one movie can be strictly "twice as good" territory as another? And does the user score presuppose nothing about quality at all and just measure audience satisfaction? I'm also bothered by the weighting thing: Metacritic quietly deciding that certain outlets count more seems like it smuggles in a claim about who the real judges are, without ever saying what makes them real.

  The framework I keep reaching for is Hume's "Of the Standard of Taste," where the standard comes from the joint verdict of qualified judges — the ones with practice, lots of comparison, freedom from prejudice, good sense. Naively an aggregator looks like exactly that machine: poll the critics, let the verdict emerge. But the Tomatometer's binary threshold throws away exactly what a Humean judge would care about (degree of admiration), and the user score lets anyone vote regardless of Hume's qualifications. So: reconstruct the implicit theory of taste behind each of the three practices, tell me whether the industry is committed to mutually inconsistent theories in different places or whether they're all somehow compatible, and say what an aggregator designed from scratch around Hume's standard would have to do differently — who counts as a judge, how you'd ever identify them, and what you'd even report at the end. And if you think Hume is just the wrong lens entirely — say the sites really presuppose something like prediction markets for consumer satisfaction rather than any standard of taste — I'd honestly like to hear that argued too.
reasoning: |-
  Okay, I need to unpack this user's query about film review aggregators and their implicit theories of taste. The user runs a film discussion group and is troubled by how different platforms—Rotten Tomatoes, Metacritic, and IMDb—produce varying scores for the same movie, yet the industry treats them as interchangeable measures. They're drawing on Hume's "Of the Standard of Taste" to analyze this, wondering what each aggregator presupposes about aesthetic judgment and whether these approaches are compatible or conflicting.

  First, I should recall the key differences between the platforms. Rotten Tomatoes uses a binary "fresh/rotten" system, calculating the percentage of positive reviews. Metacritic assigns numerical scores to reviews, weights them by publication prestige, and averages them. IMDb relies on user ratings from anyone with an account. The user is asking me to reconstruct the implicit theory of taste behind each method—what they assume about how taste works.

  For Rotten Tomatoes, the binary approach suggests that taste is fundamentally about consensus: a movie is "good" if most critics approve. This aligns with a populist or democratic view, where the standard emerges from majority agreement. But it discards nuances of degree, which Hume would see as crucial since his qualified judges assess varying levels of excellence.

  Metacritic's method implies a stronger assumption: that quality is quantifiable on a linear scale, like temperature. The weighting of publications introduces a hierarchy, suggesting that some critics' opinions are more authoritative—echoing Hume's idea of qualified judges. However, Hume never specified that judgments should be averaged numerically; he focused on shared sentiments after ideal conditions.

  IMDb's user score seems purely about audience satisfaction, not objective quality. It presupposes that taste is subjective and experiential, measuring enjoyment rather than artistic merit. This conflicts with Hume, as it ignores qualifications and prioritizes raw consumer response.

  The user also wants to know if the industry's use of all three scores commits it to inconsistent theories. I think yes: Rotten Tomatoes and IMDb are about consensus and preference, while Metacritic leans toward an objective scale. They can't all be true simultaneously without contradiction.

  For a Humean aggregator, I'd need to redefine it from scratch. Judges would be selected based on Hume's criteria—experience, lack of prejudice, comparative practice—but how? Identifying them is tricky; perhaps through peer recognition or curated lists. The output shouldn't be a number but a rich qualitative assessment, like a distillation of critical reasoning.

  The user might be hinting at a deeper issue: these aggregators are really predictive tools for consumer behavior, not truth-seeking about art. That's a compelling argument—studios use scores as marketing, so the "standard" is just what drives sales. If so, Hume's framework might be idealistic here. I should address that alternative view.

  I'll structure my response to cover each aggregator's presuppositions, compatibility, the Humean redesign, and the "prediction market" perspective. I need to be clear and thorough, as the user seems philosophically engaged. This will help their film group debate these ideas more fruitfully.
answer: |-
  You've landed on a profound philosophical puzzle hidden inside modern film marketing – and your Humean framework is razor-sharp for dissecting it. Let's break down the implicit theories of taste behind each aggregator, their (in)compatibility, and what a truly Humean aggregator might look like:

  **Deconstructing the Aggregators' Presuppositions:**

  1.  **Rotten Tomatoes (Tomatometer):**
      *   **Presupposition:** Taste is fundamentally *binary* ("good enough"/"not good enough") and *democratic*. The "standard" is established by simple *consensus* among a designated group (professional critics). The percentage represents the *proportion* who found the film minimally acceptable/recommendable.
      *   **Theory of Taste Implied:** **Consensual Thresholdism.** It assumes critics share a basic understanding of what constitutes a "passing grade" for a film in its category/genre. It privileges *agreement on the verdict* over the *intensity* or *reasoning* behind it. The "standard" is literally the majority vote of this specific (though broad) cohort.
      *   **Humean Critique:** This directly contradicts Hume. Humean judges don't vote "thumbs up/down"; they discern *degrees* of excellence, nuance, and where a work succeeds or fails *specifically*. Discarding the qualitative reasoning and depth of admiration (the very things Humean judges cultivate) renders the Tomatometer useless for finding the "standard of taste." It measures *critical reception sentiment*, not refined judgment.

  2.  **Metacritic:**
      *   **Presupposition:** Aesthetic quality is **quantifiable on a single, objective, cardinal scale** (0-100). Critic scores are meaningful numerical representations of this underlying quality. Furthermore, *expertise is hierarchical* – some critics/publishers possess inherently better judgment and deserve greater weight in determining the "true" score.
      *   **Theory of Taste Implied:** **Scientific Objectivism/Hierarchical Quantification.** It posits a Platonic "Film Quality" dimension that critics imperfectly perceive and assign numbers to. Averaging these numbers (with weights) supposedly approximates the film's "true" position on this scale. The weighting implicitly defines a canon of "authoritative" judges based on institutional prestige or Metacritic's own opaque criteria (smuggling in a claim about who the "real" qualified judges are, without justifying *why* they are qualified in Humean terms – practice, comparison, lack of prejudice, etc.).
      *   **Humean Critique:** Hume would be deeply skeptical. While he believed in a standard *emerging* from qualified judgments, he never suggested beauty was quantifiable like mass or temperature ("twice as good" makes no sense aesthetically). Averaging scores assumes critics are measuring the *same thing* on the *same scale*, which Hume would deny – different judges emphasize different excellences. Weighting based on publication prestige is antithetical; Hume's qualification comes from demonstrable *sensibility*, not institutional affiliation. This system confuses quantification with objectivity.

  3.  **IMDb User Score:**
      *   **Presupposition:** Taste is **purely subjective and experiential**. The only thing that matters is the *aggregated personal enjoyment/satisfaction* of the audience. "Quality" *is* satisfaction. Anyone who experiences the film is an equally valid "judge" of their own experience.
      *   **Theory of Taste Implied:** **Radical Subjectivism / Consumer Satisfaction Metric.** It rejects any notion of an objective standard beyond individual preference. It measures the *popular appeal* or *average enjoyment level* of a film among the (self-selecting) user base. It's closer to a market research tool than an aesthetic assessment.
      *   **Humean Critique:** This is the polar opposite of Hume. Hume explicitly argues against equating popularity or personal preference with the standard of taste ("the taste of all ages and nations" isn't determined by a contemporary internet poll). His "qualified judges" are defined precisely to *counteract* the biases, lack of experience, and "prejudice" prevalent in the general public. IMDb presupposes no standard *at all*, just mass preference.

  **Compatibility & Industry Contradictions:**

  *   **Mutual Inconsistency:** The three aggregators presuppose **fundamentally incompatible** theories of taste:
      *   RT: Consensus threshold among professionals = quality.
      *   Metacritic: Quantifiable objective quality approximated by weighted expert scores.
      *   IMDb: Aggregate audience enjoyment = quality.
  *   **Industry Commitment:** The film industry is **not intellectually committed** to any single theory. It is committed to **marketing effectiveness**. They are **instrumentalists**: they use whichever number serves their immediate promotional purpose ("85% Certified Fresh!" sounds great for an arthouse film; "Metascore: 78" sounds prestigious; "IMDb: 8.5" suggests broad appeal). They exploit the *ambiguity* and *lack of public understanding* about what these scores *mean*. They treat them as interchangeable signals of "goodness" because consumers largely do the same. This is **pragmatic inconsistency**, not philosophical coherence.

  **Designing a Humean Aggregator:**

  A genuine Humean aggregator wouldn't look much like RT, Metacritic, or IMDb. It would prioritize the *process* and *qualifications* Hume outlines:

  1.  **Who Counts as a Judge?** "Qualified Judges" possessing:
      *   **Strong Sensibility:** Natural acuity for aesthetic perception and emotional resonance.
      *   **Practice/Deliberation:** Extensive experience watching, analyzing, and comparing films.
      *   **Freedom from Prejudice:** Ability to set aside personal biases, genre snobbery, hype, ideological blinders, and national/cultural partiality.
      *   **Good Sense:** Sound reasoning to discern how elements (plot, character, visuals, sound, theme) work together (or fail to).
      *   **Comparative Skill:** Deep familiarity with the history and range of the art form to place a work in context.
  2.  **How to Identify Them?** This is the **core challenge**:
      *   **Peer Recognition:** Judges are nominated/elected by existing qualified judges (a "college of critics").
      *   **Demonstrated Output:** Selection based on a body of critical writing demonstrating the Humean qualities (nuance, comparative analysis, freedom from obvious prejudice, depth of reasoning).
      *   **Curated Panel:** A fixed, diverse panel of critics known for their depth and integrity, explicitly selected *as* Humean judges, not just any working critic.
      *   *(Note: This is inherently imperfect and risks elitism/cronyism, but Hume accepts the ideal is aspirational).*
  3.  **What to Report?** **Not a single number.**
      *   **Qualitative Synthesis:** The aggregator's role would be to synthesize the *reasons* given by the qualified judges. Where do they converge? Where do they diverge? What specific excellences are noted? What flaws are identified? What comparisons are drawn?
      *   **Range of Admiration:** Acknowledge the *degree* of admiration (e.g., "Most judges found it profoundly moving, though some noted pacing issues"; "Judges agreed on its technical mastery but were divided on its thematic depth").
      *   **The "Verdict" as Convergence:** The "standard" emerges not from a vote average, but from the observed *convergence* of sentiment among these qualified judges *after* they've applied their faculties under ideal conditions. It's about the shared recognition of excellences and flaws, not a score.
      *   **Output:** Think less "Metascore: 72" and more a concise, curated critical digest highlighting the points of strong agreement and key areas of nuanced disagreement among the qualified panel.

  **The Prediction Market Alternative (A Counterargument to Hume):**

  You're right to raise this. It's a compelling argument that **these sites aren't presupposing a standard of taste at all; they are measuring/predicting market outcomes:**

  *   **RT:** The % likelihood that a *random critic* will deem it "watchable" – a signal of critical buzz/recommendability for consumers.
  *   **Metacritic:** A weighted average of prestige outlet opinions – a signal of critical prestige/"seriousness" that appeals to certain demographics or awards voters.
  *   **IMDb:** A direct measure of current audience enjoyment/popularity – the best predictor of broad commercial appeal and word-of-mouth.
  *   **Industry Use:** Studios use the *highest* number because it's the most effective *marketing tool* for their target audience. "85% on RT" tells a casual viewer "most critics didn't hate it, probably safe." "Metascore 85" tells an arthouse patron "the serious critics endorse this." "IMDb 8.5" tells a fan "people like you loved it."
  *   **Implicit Presupposition:** **Taste is irrelevant; what matters is consumer behavior.** These are tools for reducing uncertainty in a volatile market. They presuppose that aggregated opinions (critical or popular) predict box office, awards success, or streaming clicks more effectively than individual opinions. The "standard" is purely commercial success, and these scores are leading indicators.

  **Conclusion:**

  Your instinct is correct. Rotten Tomatoes, Metacritic, and IMDb embody fundamentally different, often contradictory, implicit theories of taste (Consensual Thresholdism, Scientific Objectivism/Hierarchical Quantification, Radical Subjectivism). The film industry exploits them pragmatically, not philosophically. Hume's framework brilliantly exposes the flaws in each as representations of a true "standard of taste." A genuine Humean aggregator would be a radical departure – focusing on identifying qualified judges through demonstrable sensibility and reason, and reporting a nuanced synthesis of their *qualitative* judgments about a film's specific excellences and flaws. However, the "prediction market" view is likely the more accurate description of what these sites *actually are* and why the industry uses them: not measures of aesthetic truth, but instruments for navigating the commercial marketplace of cultural consumption. The argument in your film group hits at the very heart of how we define, measure, and commodify artistic value in the digital age.
