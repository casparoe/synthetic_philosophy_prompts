answer: |-
  ## Joint Statement on the Value of Originals: Mapping the Terrain After Adversarial Collaboration

  **Preamble:** For decades, the debate between aesthetic empiricists (Empiricists) and historicists (Historicists) concerning the value of original artworks versus perfect copies has circled familiar ground. This document represents the outcome of a year-long adversarial collaboration seeking to break the stalemate. We acknowledge deep, substantive disagreements but have identified points of accord and clarified the nature of our divergence. Our goal is not resolution, but a clearer map for future inquiry, prompted by novel cases designed to challenge both positions. We sign below as representatives of our respective camps, affirming this document as a fair representation of the collaborative process and its findings.

  **A. Agreed Claims:**

  1.  **Deception's Wrongness:** Knowingly presenting a copy as an original with intent to deceive is morally and epistemically wrong, irrespective of its aesthetic properties or the success of the deception. This wrongness stems from fraud and misrepresentation of historical/causal facts.
  2.  **Distinct Value Kinds:** Market value, historical significance, cultural importance, and aesthetic value are distinct (though potentially interacting) categories of value. An object can be high in one and low in another.
  3.  **Provenance ≠ Aesthetic Value (Necessarily):** Provenance information (author, date, origin) can significantly influence *judgments* of aesthetic value and market value, but this influence does not, by itself, establish that provenance facts *constitute* aesthetic value.
  4.  **Blind Test Evidence:** Empirical studies using blind comparison protocols consistently demonstrate that observers, including experts, often cannot perceptually distinguish originals from high-quality copies or even some forgeries when deprived of contextual information. This suggests perceptual indistinguishability is possible.
  5.  **Experience Matters:** The aesthetic experience of an observer encountering an object (including perceptual qualities, emotional response, cognitive engagement) is a central component of the value of art.
  6.  **Contextual Dependence:** The aesthetic experience of *any* artwork (original or copy) is influenced by the observer's knowledge, beliefs, expectations, and the physical/cultural context of encounter. There is no "pure," context-free aesthetic perception.
  7.  **Authorship Significance:** Knowledge of who created a work and under what circumstances is generally relevant and important to the appreciation of art within established cultural practices.
  8.  **Indistinguishability (In Principle):** For autographic works (e.g., paintings, unique sculptures), it is conceivable, though practically challenging, to create a copy perceptually indistinguishable from the original under all normal viewing conditions.

  **B. Disagreements Table:**

  | Disagreement Area           | Historicist Position (As Stated by Historicists)                                                                 | Empiricist Position (As Stated by Empiricists)                                                                 |
  | :-------------------------- | :--------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------- |
  | **1. Constituents of Aesthetic Value:** | The aesthetic value of an autographic work is *partially constituted* by facts about its specific history of creation (e.g., the artist's performance, the struggles overcome, the choices made in its singular coming-into-being). These historical facts are not merely contextual; they are integral to *what the work is* and thus to its aesthetic value. | The aesthetic value of a work is *exhaustively determined* by properties available to a suitably informed observer in an encounter with the object itself. Historical facts about origin can *inform* and *enrich* the observer's experience and interpretation, but they do not add a distinct *aesthetic* value component inherent only to the original object. |
  | **2. The Nature of "Performance":**    | An artist's "performance" – the specific, embodied act of creation under constraints – is a value-generating event. This value is embedded in the original artifact. Supervision in the studio case involves a *partial* performance by the master (conception, direction, specific interventions), differing qualitatively from their solitary performance in earlier works. | "Performance" is a metaphor for the causal process leading to the object's creation. Its value lies solely in the resultant observable properties of the object. In the studio case, the master's supervision resulted in objects with specific observable properties; whether the brush was held by the master or the assistant (under instruction) is a historical fact about production, not an aesthetic fact about the *work* perceivable now. |
  | **3. Value of the Perfect Substitute:** | In the reconstruction case, while the perceptual experience may be restored, something essential of *aesthetic* value was lost: the unique physical trace of the original creative performance embedded in the plaster and pigments. The replica, regardless of fidelity, lacks the *authenticity* of being the product of that specific historical act. | In the reconstruction case, if the perceptual experience (including all relevant visual properties under normal viewing conditions) is genuinely indistinguishable and knowledge of the loss is accounted for in the experience, then the *aesthetic value* accessible to the observer is preserved. The historical loss is significant (historically, culturally, emotionally), but it is not a loss of *aesthetic* value inherent to the object-experience. |
  | **4. The AI Case as a Win:**          | The AI case demonstrates the generation of objects possessing valuable aesthetic properties in a style. However, it lacks the value arising from human artistic *achievement* and *intentional performance*. Its value is derivative and categorically different from the value of an original human creation, even if perceptually pleasing or "superior" in blind tests. | The AI case demonstrates that aesthetic value, as determined by observer response to the object's properties (even in blind tests), can be generated independently of traditional human artistic performance. This supports the empiricist claim that aesthetic value resides in the perceivable object and the experience it affords. Its honest sale aligns with claim 1. |

  **Verbal/Substantive Divide:** We concur that *some* past disagreement stemmed from conflating terms. "Aesthetic value" itself is the core contested term. The Historicist uses it inclusively, encompassing properties arising from origin. The Empiricist uses it more restrictively, for properties manifest in the perceptual/cognitive encounter. This difference in scope *is* substantive, reflecting a deeper disagreement about what art fundamentally *is* and what we value in it. Disagreements about "performance" and "authenticity" are similarly substantive, not merely verbal, concerning the ontology of the artwork and the source of its value.

  **C. Cruxes:**

  1.  **The Testimony Crux:** Is the dependence of an observer's aesthetic judgment or experience on *testimony* about origin (e.g., "this is by Rembrandt") a sign of a defect in the observer's aesthetic capacity (e.g., snobbery, suggestibility), or is it an inherent and legitimate feature of engaging with artworks within a practice where origins matter?
  2.  **The Performance/Aesthetic Fact Crux:** Are the "performance" facts championed by Historicists (the specific struggle, skill, intentionality, context of creation) properly understood as *aesthetic facts* about the work itself, or are they facts of a different order (historical, biographical, cultural) that can only *inform* an aesthetic response?
  3.  **The Authenticity Multiplier Crux:** Does the property of *authenticity* (being the original product of a specific historical performance) function as a genuine *value multiplier* for the aesthetic experience itself, even when all perceivable properties and contextual knowledge are held constant? Or does it only affect non-aesthetic values (historical, sentimental, rarity)?
  4.  **The "Suitably Situated Observer" Crux:** What constitutes the "suitability" of the observer for the Empiricist? Does it *require* knowledge of origin to be "suitably situated" for appreciating art where origin is culturally salient, or does "suitability" pertain only to perceptual acuity and relevant cultural/art-historical knowledge *about the type of work*, independent of knowledge about *this specific token's* origin?

  **D. Tests, Predictions, and Bearing:**

  1.  **Crux 1 (Testimony):**
      *   **Test:** Rigorous experiments where observers rate the aesthetic value of artworks under controlled conditions. Group A receives *only* perceptual access. Group B receives perceptual access *plus* verified true authorship information (e.g., "This is an original Rembrandt," "This is a high-quality contemporary copy"). Group C receives perceptual access *plus* false authorship information (e.g., misattributing a copy as an original, or vice-versa). Measure differences in ratings, qualitative responses, and neurological correlates (e.g., fMRI) associated with valuation and reward.
      *   **Historicist Prediction:** Group B (true info) will show significantly higher valuation and distinct neural engagement compared to Group A (perception only), *even for perceptually identical copies when presented as originals*. Group C (false info) will show valuation patterns aligned with the *provided* (though false) information, demonstrating the power of testimony. This shows testimony-dependence is integral to the practice and not a defect.
      *   **Empiricist Prediction:** Group B and Group C ratings will differ based on the *information provided*, but Group A ratings for perceptually identical items will be equivalent. Differences in B/C reflect changes in *belief* (impacting historical/sentimental value) or cognitive framing, not a change in the *aesthetic properties* perceived. True aesthetic value is best approximated by Group A or Group B when the information is correct *and* internalized as contextual knowledge shaping perception, not as a separate value adder. Neural differences in B/C would map to circuits for belief/expectation, not pure aesthetic processing.
      *   **Bearing:** A strong Historicist result (true info boosting value beyond perception alone *for the same object*) supports their view. An Empiricist result supports the primacy of perception and framing. Both predict Group C will be influenced by false info, showing suggestibility, but disagree on its significance.

  2.  **Crux 2 (Performance/Aesthetic Fact):**
      *   **Test:** Analyze critical discourse and conservation debates surrounding works with *documented* complex creation histories (e.g., the studio case, Rodin's extensive use of assistants, contemporary digital art with multiple contributors). Do critics, curators, and philosophers primarily invoke the specific performance history as contributing to the *aesthetic character* of the work (e.g., "the tension visible here arises from the master-assistant collaboration"), or do they treat it primarily as contextual/historical information that *explains* how the observable properties came to be?
      *   **Historicist Prediction:** Close analysis will reveal that the specific performance history is frequently cited not just as background, but as directly relevant to interpreting and evaluating the *aesthetic qualities* perceived in the work (e.g., brushwork seen as "assistant-like" impacting the aesthetic assessment of vigor or spontaneity). Conservation debates will hinge on preserving the trace of the specific performance, not just the appearance.
      *   **Empiricist Prediction:** While historical facts are used to *interpret* observable properties (e.g., "this smooth passage *might be* by the assistant"), the aesthetic evaluation ultimately rests on the properties themselves. Conservation aims to preserve the observable properties; debates arise when preserving the original material (performance trace) conflicts with preserving the original appearance. The discourse will show performance facts serving hermeneutic, not constitutive, roles.
      *   **Bearing:** If performance facts are consistently treated as *shaping the aesthetic description itself* (not just the causal explanation), it supports the Historicist view that they are aesthetic facts. If they primarily serve causal explanation or historical framing, it supports the Empiricist separation.

  3.  **Crux 3 (Authenticity Multiplier):**
      *   **Test:** Longitudinal study of visitors to the reconstructed cathedral (Case 2). Track self-reported aesthetic experience (awe, beauty, spiritual impact) and behavioral measures (dwell time, return visits) over years, comparing baseline (pre-fire) with post-reconstruction. Crucially, control for novelty effects and ensure widespread public knowledge of the reconstruction.
      *   **Historicist Prediction:** While initial reports might be similar due to novelty or relief, over the long term (e.g., 5-10 years), reported aesthetic experience and engagement will measurably decline compared to pre-fire levels *even among visitors who fully accept the replica's accuracy*, due to the absence of authenticity's experiential multiplier. The sense of "being in the presence of *the* original creation" diminishes.
      *   **Empiricist Prediction:** If the perceptual experience is truly comparable and knowledge of the event is integrated, aesthetic experience reports will stabilize at levels comparable to pre-fire over the medium-to-long term. Any initial decline would be attributable to grief, novelty, or residual skepticism, not the loss of an inherent aesthetic multiplier from authenticity. Sustained difference would imply inadequate replication or unresolved psychological/cultural factors, not a missing aesthetic component.
      *   **Bearing:** A sustained, significant decline in reported aesthetic experience among informed visitors supports the Historicist multiplier. Stable, comparable levels support the Empiricist view that the aesthetic value is preserved in the experience.

  4.  **Crux 4 ("Suitably Situated Observer"):**
      *   **Test:** Philosophical thought experiment combined with empirical survey: Present the AI case (Case 3) to art experts and informed laypersons. Scenario 1: They experience the AI work blind, love it, then learn it's AI-generated. Scenario 2: They experience it knowing it's AI-generated from the start. Ask: Does knowledge of its origin change your assessment of its *aesthetic value* (not just its interest or novelty)? Is a viewer who dismisses its aesthetic value *because* it's AI-generated making an aesthetic error, or a valid judgment within the practice? Is a viewer *required* to know it's AI to be "suitably situated"?
      *   **Historicist Prediction:** Many respondents will state that knowing the origin *does* change their assessment of its aesthetic value (often lowering it), and that this is a valid judgment. They will argue that knowing the origin (human vs. AI) is *essential* to being suitably situated to appreciate (or fully judge) the work within the context of artistic practice, as the nature of the achievement is fundamentally different.
      *   **Empiricist Prediction:** Respondents may acknowledge the origin changes their *interest* or *evaluation of the achievement*, but should maintain that the aesthetic value of the work *as experienced* remains tied to its properties. A viewer who dismisses its aesthetic value *solely* because of AI origin, despite loving it blind, is making a category error or allowing non-aesthetic biases to override aesthetic perception. "Suitably situated" requires knowledge relevant to *interpreting* the work (e.g., knowing the style, conventions), but not necessarily the specific token's origin if perceptible properties are the focus.
      *   **Bearing:** Widespread acceptance that origin knowledge *must* factor into the aesthetic assessment for the observer to be "suitable" supports the Historicist broadening of the empiricist's necessary conditions. Insistence that aesthetic value assessment can (and perhaps should) be separated from specific token origin, focusing on type and properties, supports the Empiricist definition.

  **Conclusion:** This collaboration has not erased our fundamental differences regarding the ontology of art and the nature of aesthetic value. However, we have achieved significant clarity. We agree on the wrongness of deception, the distinction of value kinds, the power and limits of blind testing, the importance of experience and context, the relevance of authorship, and the possibility of indistinguishability. Our disagreements are substantive, centering on whether historical performance facts are constitutive of aesthetic value or contextual informants. The novel cases (Studio, Reconstruction, AI) effectively expose these fault lines. The proposed cruxes and tests offer pathways for future research and debate that move beyond rehearsing old arguments. We commit to evaluating the outcomes of such investigations with intellectual honesty, respecting the depth and rigor of the opposing position even as we dissent from its conclusions.

  [Signatures]
  *   For the Aesthetic Empiricist Camp: _________________________
  *   For the Historicist Camp: _________________________
