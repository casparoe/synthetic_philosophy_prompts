prompt: |-
  I'm teaching an intro ethics unit on the doing/allowing distinction and I keep running into students who treat "killing vs letting die" as just the same line drawn twice — the assumption being that killings are doings and lettings-die are allowings, so once you've located one distinction you've located the other. I want a thought experiment that breaks that runthrough in a way they can't hand-wave.

  Specs: construct a case where an agent kills someone *without* doing anything, or does something that clearly counts as a doing yet is a letting-die — you pick the direction, but the two distinctions have to come apart cleanly, not just blur. Constraints: realistic medical setting (a hospital, a field clinic, a pandemic triage tent — no demons, no perfect computers, no sci-fi organs), one paragraph for the scenario itself, and critically the mechanism can't be the standard "switch off the ventilator" move, since that device is exactly what my students already have canned answers for. I want something structurally different — e.g. a setup where keeping the patient alive requires continuous positive action from the agent so that inaction itself produces the death, or some other contrivance that genuinely crosses the two distinctions instead of running them in parallel.

  After the scenario, three things. First, defend the classifications: say which side of each distinction the agent's behavior falls on and argue for it — I'll notice if you just stipulate "this is a killing" without showing why the taxonomy puts it there. Second, walk through what this does to the popular hybrid view that killing is worse than letting die *because* killing is a doing: can a defender keep that rationale here, or are they forced to either bite a bullet or quietly redefine "doing" mid-argument (and if the latter, what stops the redefinition from being ad hoc)? Third, tell me honestly which single feature of the case is doing all the work, and what happens to the crossing if you delete that feature.

  One more constraint: don't build the case by simply making the letting-die variant nicer than the killing variant (extra suffering, bad motives, etc.) — it has to survive the bare-difference treatment, where you equalize everything except the do/allow structure itself. If you can't meet that while keeping it realistic, say so and explain which constraint you'd relax and why.
reasoning: |-
  Okay, let me tackle this ethics problem. The user wants a thought experiment that cleanly separates "killing" from "doing" and "letting die" from "allowing," specifically in a medical context without using ventilator scenarios. 

  First, I need to identify why students conflate these concepts. They see killing as necessarily active (doing) and letting die as passive (allowing). To break this, I must create a scenario where inaction constitutes killing (doing) or action constitutes letting die (allowing). 

  Medical settings offer good opportunities. I recall cases like trolley problems, but those aren't medical. Perhaps something with medication? If a patient requires constant administration of a drug, stopping could be seen as allowing death. But that might resemble the ventilator case. 

  Wait - what if the required action isn't medical intervention but something else? Like physical positioning? For example, a patient who will die unless continuously held in a specific pose. If a nurse stops holding them, that seems like allowing death through inaction. But is holding considered a "doing"? 

  That could work. Let me construct the scenario: a patient with positional asphyxia risk requires constant arm elevation. A nurse holds their arms up for hours. If she lets go, the patient dies. The inaction (releasing arms) causes death. But is releasing an action or inaction? 

  Here's the key: releasing requires a positive action (muscle relaxation), but the death results from the cessation of the sustaining action. So the nurse "does" something (releases grip) but the death is classified as "allowing" because the lethal factor (gravity) was always present. 

  For the killing variant: same patient, but the nurse actively pushes them into a fatal position. Now she's directly causing death. 

  In both cases, the nurse's physical movement is similar, but the causal structure differs. In the allowing case, she stops counteracting a threat; in the killing case, she creates a new threat. 

  Now to defend classifications:
  - Allowing death: Stopping intervention permits existing threat (gravity) to kill
  - Doing: Both involve bodily actions, but the killing case initiates a new lethal sequence
  - Killing vs letting die: Pushing is killing; releasing is letting die

  This challenges the "doing is worse" view because both involve physical actions. The moral difference must come from the causal role (creating vs removing prevention), not the presence of action. 

  The crucial feature is the constant intervention requirement. Remove that, and the distinction collapses. For example, if the patient could survive briefly without holding, releasing might become killing. 

  The bare-difference test holds: motives, suffering, etc. are equalized. Only the causal direction differs. 

  Medical realism: Positional asphyxia is real in contexts like surgical recovery or coma. The prolonged holding might strain credibility, but I can specify it's a temporary measure during equipment failure. 

  This should work. The core insight is that "doing" refers to causal initiation, while "allowing" refers to ceasing to counteract existing threats - even when both involve physical movements.
answer: |-
  Here's a thought experiment designed to force a clean separation:

  **Scenario: The Gravity-Dependent Patient**  
  A patient has a rare, acute neuromuscular condition causing positional asphyxia: if their torso is elevated beyond 45 degrees, their diaphragm fails. They are stable only when lying completely flat. During a chaotic emergency evacuation from a collapsing field hospital, Nurse A is carrying this patient on a rigid stretcher. Mid-transport, they must pass through a narrow doorway. To fit, Nurse A must *either* (1) **actively tip the stretcher vertically for 3 seconds** (killing the patient via asphyxia), *or* (2) **set the stretcher down horizontally** for 30 seconds to clear debris blocking the doorway, knowing the collapsing ceiling above will crush the patient before they can be moved again. Nurse A chooses option (1).  

  ---

  **1. Classifications & Defense**  
  *   **Killing vs. Letting Die:** This is a **killing**. Nurse A directly causes death by creating the fatal condition (vertical positioning) through positive action. The patient wouldn't have died *at that moment* from their underlying condition if Nurse A hadn't tipped the stretcher. Contrast with option (2): *that* would be a letting die, as death would result from Nurse A's inaction (failing to move debris/patient) allowing an *external* threat (the collapsing ceiling) to take its course.  
  *   **Doing vs. Allowing:** Nurse A's behavior is unequivocally a **doing**. The act of "tipping the stretcher vertically" is a deliberate, positive exertion of physical force altering the patient's state. It requires muscular effort and direct manipulation of the patient's environment/position. Letting die (option 2) would be an *allowing* – a failure to intervene to remove the patient from an *existing*, independent threat (the collapsing ceiling). The death-causing sequence (ceiling collapse) is already in motion and requires no new force from Nurse A to become lethal; only non-intervention.  

  **2. Challenging the Hybrid View ("Killing worse *because* it's a doing")**  
  The hybrid view faces a dilemma here:  
  *   **Option A (Bite the Bullet):** Insist tipping the stretcher is worse *because* it's a doing. However, this concedes the core claim (killing is worse *because* it's a doing) holds *even though* the *letting die* alternative (option 2) also involved a significant, effortful "doing" – the act of *setting the stretcher down*. Both choices involved physical actions ("doings"). If the moral difference stems solely from the doing/allowing distinction, this case collapses it, as both paths start with an active "doing." The hybrid rationale now seems insufficient to explain the intuitive difference in wrongness between killing and letting die.  
  *   **Option B (Redefine "Doing"):** A defender might try to narrow "doing" to mean *only actions that initiate a new lethal sequence*. Tipping the stretcher initiates a new lethal sequence (asphyxia via position change), while setting it down does not (it merely fails to interrupt the pre-existing lethal sequence of the collapse). However, this redefinition abandons the original intuitive/physical sense of "doing" (positive exertion of force) and smuggles in the causal structure of *killing* (initiating harm) as the defining criterion. This makes the rationale circular: "Killing is worse because it's a doing [where 'doing' is now defined as 'initiating lethal harm']." It becomes ad hoc, as the redefinition is motivated solely to preserve the conclusion and doesn't align with how "doing" was originally understood (any physical action).  

  **3. The Crucial Feature & Vulnerability**  
  *   **The Single Feature Doing the Work:** **The requirement for continuous environmental management to prevent an *internal*, stable threat.** The patient's underlying fatal condition (positional asphyxia) is stable *if* the environment (flat position) is maintained. Death results *only* if this management is disrupted. This creates a scenario where:  
      *   *Letting die* (option 2) requires **inaction** *in the face of an external threat* (ceiling collapse).  
      *   *Killing* (option 1) requires a **positive action** that **disrupts the necessary management** of the *internal threat*, thereby *introducing* the fatal condition.  
  *   **What Happens if Deleted?** Without this feature (e.g., if the patient's condition wasn't stable when managed, or if the threat was always external/imminent), the distinctions collapse back into parallelism. If the patient was actively dying *unless* continuously ventilated (standard vent case), stopping ventilation is an *allowing* (ceasing to counteract the internal threat). If Nurse A actively smothered them, it would be a *doing* and a *killing*. The distinctions run parallel. The "continuous environmental management of an internal threat" structure forces the action (tipping) to be a *doing* that constitutes a *killing* by disrupting the prevention, while the alternative inaction (not clearing debris) is an *allowing* that constitutes a *letting die* in the face of an external threat.  

  **Bare-Difference Adherence:** This case meets the bare-difference test. Motive (evacuation necessity), outcome (death), patient suffering (likely instantaneous/unconscious in both), and overall context (chaotic emergency) are equalized. Only the causal structure of the lethal pathway and the nature of Nurse A's immediate choice (disrupt management vs. fail to counter external threat) differ.  

  **Realism Note:** Positional asphyxia syndromes (though rare in this specific acute presentation) and emergency evacuations in unstable structures are medically and contextually plausible. The "continuous management" (keeping flat) is passive environmental control, distinct from active interventions like ventilation or drug infusion.
