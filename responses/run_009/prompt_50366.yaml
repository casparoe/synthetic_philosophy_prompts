answer: |-
  Here is a draft set of desiderata for evaluating accounts of probability in Everettian quantum mechanics, structured by your requirements. Each requirement includes its motivation and a assessment of its negotiability.

  **Desiderata for an Adequate Everettian Probability Account**

  1.  **Non-Trivial Probability Concept (What Probability *Is*):**
      *   **Requirement:** The account must provide a non-vacuous, non-circular definition or grounding for "probability" within the Everettian ontology. It must explain what probability *means* when all outcomes are realized. This cannot simply be an undefined primitive or a purely instrumentalist tool; it must have an ontological or epistemic foundation consistent with the many-worlds picture.
      *   **Motivation:** Without collapse or hidden variables, the classical notion of probability as "chance of occurrence" (only one outcome happens) is inapplicable. Accounts must define a new concept or rigorously justify an adapted classical concept.
      *   **Negotiability:** **Non-negotiable.** An account lacking this fails to address the core problem.

  2.  **Recovery of Ordinary Chance Talk:**
      *   **Requirement:** The account must demonstrably recover, without *ad hoc* stipulation, the phenomenology and practice of assigning probabilities in standard quantum scenarios. This includes the Born rule weights governing rational credence, betting behavior, frequency predictions, and the sense that some outcomes are "more likely" than others.
      *   **Motivation:** Everettian QM must be empirically adequate and explain why agents *talk and act* as if there is a single uncertain outcome governed by Born rule chances.
      *   **Negotiability:** **Non-negotiable.** Failure here renders the interpretation empirically inert or revisionist beyond recognition.

  3.  **Actuality of All Outcomes (The Certainty Problem):**
      *   **Requirement:** The account must directly address the fact that the agent knows with certainty that a successor witnessing *each* possible outcome *will* exist. It must explain why this certainty does not translate into certainty about *which* outcome *they* will experience, or why rational credence isn't uniformly distributed, or why frequency predictions aren't trivialized.
      *   **Motivation:** This is the central conceptual challenge distinguishing Everettian probability from single-outcome interpretations. Classical justifications based on ignorance of a single future outcome or long-run frequency convergence don't directly apply.
      *   **Negotiability:** **Non-negotiable.** Any account that ignores or sidesteps this fundamental feature of the ontology is inadequate.

  4.  **Continuous Branching (The Counting Problem):**
      *   **Requirement:** The account must be compatible with the continuous, unitary evolution of the quantum state. It cannot fundamentally rely on counting discrete, pre-existing "worlds" or "branches" as the basis for probability, as this counting is either ill-defined or arbitrarily depends on the choice of basis/decoherence threshold.
      *   **Motivation:** The wavefunction evolves smoothly; discrete branching is an emergent, approximate phenomenon due to decoherence. A fundamental account of probability must be grounded in the underlying quantum state and its structure (e.g., amplitudes, norms), not emergent discrete entities.
      *   **Negotiability:** **Non-negotiable.** Basing probability on naive branch counting is widely recognized as untenable within the formalism.

  5.  **Single-Case Rationality:**
      *   **Requirement:** The account must justify the assignment of Born rule probabilities for *single, unrepeated* experiments at the moment of preparation/measurement. It cannot rely solely on long-run frequency arguments over many trials.
      *   **Motivation:** Rational agents assign probabilities to single events (e.g., the spin of this electron now). Long-run arguments alone struggle to ground single-case credences directly. The justification must work "locally" for the agent facing a specific decision.
      *   **Negotiability:** **Substantive, but widely demanded.** While some argue long-run success is sufficient, a compelling account should ideally ground single-case credence directly. Waiving this weakens the account's explanatory power for actual agent reasoning.

  6.  **Engagement with Self-Locating Uncertainty (SLU):**
      *   **Requirement:** The account must explicitly address the role (or lack thereof) of self-locating uncertainty concerning "which future successor I will be". It must clarify the connection between probability assignments and the agent's epistemic perspective across branching.
      *   **Motivation:** SLU is a major proposed solution route (e.g., envariance-inspired arguments). Any adequate account must either successfully integrate SLU as the source of probability, explain why SLU is irrelevant or insufficient, or provide an alternative epistemic foundation.
      *   **Negotiability:** **Substantive.** While central to some approaches, others (e.g., decision-theoretic) may downplay or reject its necessity. A good account must *engage* with it, but successful integration isn't universally required.

  7.  **Engagement with Decision Theory (DT):**
      *   **Requirement:** The account must explicitly address the role (or lack thereof) of rational decision-making under branching. It must clarify how preferences over actions with branching consequences relate to probability assignments.
      *   **Motivation:** DT derivations are a major alternative route to the Born rule, framing probability via rational betting preferences. Any adequate account must either successfully derive probability via DT, explain the relationship between DT results and probability, or justify why DT is not the appropriate framework.
      *   **Negotiability:** **Substantive.** Like SLU, DT is central to some approaches but potentially bypassed by others. A good account must *engage* with its implications.

  8.  **Existence of Born-Violating Observers (The Anomaly Problem):**
      *   **Requirement:** The account must be consistent with the fact that observers who systematically record statistics grossly deviating from the Born rule *exist* in some branches, albeit with exponentially small total quantum measure. It must explain why such observers are rationally dismissible or epistemically irrelevant from the perspective of an agent *before* branching.
      *   **Motivation:** This is a key challenge for approaches relying on typicality or long-run frequencies. If probability is tied to what most observers see, the existence (even with tiny measure) of observers seeing anomalous results seems problematic.
      *   **Negotiability:** **Non-negotiable.** An account that implies anomalous observers *should* be taken seriously by pre-measurement agents undermines the Born rule justification. It must resolve this anomaly.

  **Suspected Tensions and Key Eliminator:**

  *   **Suspected Tension:** There is a strong tension between **D3 (Actuality/Certainty)** and any requirement that probability fundamentally stems from **ignorance (D1/D6 SLU)**. If the agent is certain all outcomes happen, what are they ignorant *of*? Resolving this tension is the core challenge. Similarly, reconciling **D4 (Continuous Branching)** with intuitive notions of "possibility" or "alternative" inherent in probability (**D2**) is difficult without resorting to the quantum measure/norm.
  *   **Most Eliminative Requirement:** **D3 (Actuality of All Outcomes / The Certainty Problem)** is arguably the most eliminative. It starkly highlights the incompatibility of Everett's ontology with classical probability foundations. Accounts that fail to genuinely grapple with this certainty (e.g., by smuggling in ignorance of which branch is "real" or relying on unmotivated indifference) are quickly undermined.

  **Self-Critique: What the List Might Miss or Get Wrong**

  *   **Potential Missing Element: The Role of Additivity.** The list doesn't explicitly demand that the probability concept satisfies the standard axioms of probability (specifically, countable additivity) *as derived*, not just assumed. While recovery of practice (D2) implies this, explicitly requiring a derivation of additivity from the Everettian foundations might be a stronger constraint, especially given the continuous branching (D4). Does the account *explain* why probabilities add over mutually exclusive outcomes defined by orthogonal subspaces?
  *   **Potential Wrong Emphasis?** The list heavily focuses on the *agent's perspective* and rational credence (epistemology). While crucial, this might slightly underemphasize the need for the account to also connect to objective features of the quantum state and its dynamics (ontology). D1 and D4 touch on this, but a stronger link between the epistemic justification (probability assignment) and the objective structure of the branching reality might be needed for full coherence. Does the account show *why* the quantum amplitude/norm structure *deserves* to be interpreted probabilistically in the first place, beyond just reproducing predictions?

  This set provides a rigorous framework for evaluating the ability of any proposal to deliver a legitimate, non-circular, and empirically adequate notion of probability within the challenging constraints of the Everettian many-worlds interpretation. Good luck with the seminar pushback!
