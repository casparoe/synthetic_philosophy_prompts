   Therefore, (6) might be supported by the package if we argue that the additional features (recurrent state, homeostatic objectives, long training) are the kind of features that might support a more robust valence system (perhaps one that includes both wanting and liking). But we haven't explicitly stated that. So the gradient might be floating.

