prompt: |-
  I'm writing a term paper that assumes Caruso wins the debate in Just Deserts (the book where him and Dennett go back and forth) — so assume nobody ever merits suffering purely because they did wrong, what Caruso calls "basic desert". My paper isn't about free will though, it's about criminal punishment: I want to work out what a justification of punishment has to look like once you've given that up. Before I go pick a theory, I want the spec. So write me the list of desiderata any post-retributive theory of punishment has to meet: the cases it has to get right (detaining someone who's dangerous, going easier on lesser offenses, some stories of blame that don't collapse), the distinctions it must preserve (punishment vs. mere quarantine, harshness vs. cruelty, desert-considerations that survive vs ones that don't), the empirical facts it can't contradict (recidivism, the ordinary practice of holding people responsible), and whatever else you think belongs on the list. For each item give the consideration behind it, mark which are genuinely non-negotiable and which are just consequentialist camp-preferences, and flag any pair that looks jointly unsatisfiable — treating prisoners as ends while confining them for decades seems like a candidate, but there may be worse ones. Don't score actual theories against the list, that part is mine. Please write in American English. Keep it as long as the content genuinely needs, no padding.
