  Cost-effectiveness and public trust are practical. A theory that's too expensive or loses public support won't work. But these might be preferences, not absolutes. The inherent value of offenders as persons is non-negotiable. Even when restricting rights, their dignity must be upheld. How to operationalize that in long-term confinement? Programs that foster autonomy, education, mental health support, etc., could be part of the solution.

