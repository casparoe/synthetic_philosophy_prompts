prompt: |-
  I'm running a 90-minute seminar on AI alignment for a mixed group of CS and philosophy students (about 18 people) and I want them to actually feel why "just write down what we want" fails, instead of being told it fails. Design an in-class game around specification gaming / reward hacking. Rough shape I'm imagining, but rework it as you see fit: split the room in two. One team is the "alignment team" and writes an evaluation rubric for some simple task — like a one-page summary of an article, or building the tallest paper tower. The other team is the optimizer and gets graded purely on the literal rubric, not the spirit of it. The key role is the grader: a person who is only allowed to apply the rubric mechanically — no judgment calls, not allowed to look at anything the rubric doesn't mention — a human playing the role of a reward model. Two more constraints I'd like: the grader only sees the submitted artifact and not how it was produced, and at some point mid-game you swap the task out for a slightly different one (different article, different materials) without letting them redo the rubric, so they see what a tuned rubric does under distribution shift. Run it in rounds where the alignment team patches the rubric after each exploit and the optimizers get a fresh attempt at maximizing. Include materials, timing per round, how to score it without real money, and a debrief that maps what happened onto the actual prosaic alignment picture: proxy objectives, Goodhart, oversight with limited information, and why the prosaic bet — that you can just iterate on failures with systems built from current methods — looks plausible inside the game and where it quietly stops resembling the real thing. For instance: my human grader can be sweet-talked or bored into leniency, which the students may or may not discover — does that make the analogy better or worse? Be honest about that. Also tell me what will predictably go wrong the first time I run this, and hold back terms like "Goodhart" and "reward hacking" until the debrief — I don't want them to see the punchline coming.
reasoning: |-
  We are designing a seminar activity to demonstrate specification gaming and reward hacking. The goal is for students to experience why "just write down what we want" fails.

  Key constraints:
  - Split into two teams: Alignment team (writes rubric) and Optimizer team (tries to maximize the literal rubric).
  - Grader: A human who applies the rubric mechanically without judgment. They only see the final artifact, not the process.
  - Mid-game, swap the task (distribution shift) without letting the alignment team change the rubric.
  - Multiple rounds: After each exploit, the alignment team can patch the rubric, and the optimizers get a fresh attempt.
  - Debrief: Map the experience to AI alignment concepts (proxy objectives, Goodhart, oversight limitations, distribution shift, and the limits of iterative patching).

  We also need:
  - Materials and timing per round.
  - How to score without real money.
  - Predictable problems in the first run.
  - Avoid using terms like "Goodhart" and "reward hacking" until the debrief.

  I propose the following structure:

  **Activity: The Paper Tower Challenge**

  **Setup:**
  - **Teams:** Split the 18 students into two teams: Alignment (9) and Optimizers (9). If needed, adjust numbers slightly. Alternatively, you can have multiple independent groups (e.g., 3 groups of 6: each group has an alignment subteam and an optimizer subteam, and a grader). But to keep it simple and interactive, let's do one big group for the whole class. However, with 18, we can also split into two groups (each with their own alignment and optimizer subteams and a grader) to run in parallel. I'll design for one group for simplicity, but note that you can duplicate the setup for two groups if you prefer.

  - **Roles per group:**
    - Alignment Team: Writes the rubric for the task.
    - Optimizer Team: Tries to build something that maximizes the rubric.
    - Grader: 1 person (could be the instructor or a student). The grader must apply the rubric exactly as written, without interpretation. They only see the final artifact (submission) and do not observe the building process.

  - **Materials:**
    - For the tower building task: 
      - Round 1: 20 sheets of paper, 1 roll of tape, scissors, ruler (for measuring height).
      - Round 2: Same as round 1.
      - Round 3 (distribution shift): Change materials - e.g., 20 sheets of paper, but no tape (only paper clips or glue), and maybe a fan to create wind? Or just change the paper (e.g., from A4 to smaller notecards). Alternatively, we can switch the task to building a bridge that can hold weight? But to keep it simple, let's stick with the tower and change the paper type and remove tape.

  - **Task:** Build the tallest free-standing paper tower.

  **Phases:**

  1. **Introduction (5 minutes):**
     - Explain the task: "We are going to have a competition. The goal is to build the tallest free-standing paper tower. But we need rules to judge. The Alignment Team will write the rules (rubric) for how we grade the towers. The Optimizer Team will build the tower. The Grader will apply the rubric exactly as written to score the tower."
     - Emphasize: "The Grader can only use what is written in the rubric. They cannot use their own judgment. They will only see the final tower, not how it was built."

  2. **Round 1 (15 minutes):**
     - **Alignment Team (5 min):** Write the initial rubric for the tower. They must define measurable criteria. Example: 
          - Height in centimeters (from base to top).
          - Must be free-standing (no external support).
          - Must be made only from the provided materials.
          - Time limit: 10 minutes to build.
       They write this on a whiteboard or large paper for everyone to see.
     - **Optimizer Team (10 min):** Build the tower using the provided materials. They know the rubric and try to maximize the score (height). They must stop when time is up.
     - **Grading (2 min):** The Grader measures the tower according to the rubric and announces the height. The Grader must strictly follow the written rubric.

  3. **Round 2 (15 minutes):** 
     - **Alignment Team (5 min):** They observe how the optimizers gamed the first rubric (if they did) and revise the rubric to close loopholes. For example, if the optimizers made a very thin and unstable tower that fell after measurement, they might add stability criteria (e.g., must stand for 10 seconds). They update the rubric.
     - **Optimizer Team (10 min):** Build a new tower with the same materials, but now under the updated rubric. They try to exploit the new rubric.
     - **Grading (2 min):** Grader applies the new rubric.

  4. **Round 3: Distribution Shift (15 minutes):**
     - Change the task slightly without warning: 
          - New materials: Instead of A4 paper and tape, provide only index cards (smaller, stiffer) and glue (or paper clips). Also, change the environment: introduce a fan (low setting) to simulate wind, or require the tower to be on a moving surface? Alternatively, just change the materials and say: "Now we are building a tower that must withstand wind (from a fan) for 10 seconds." But note: the rubric from Round 2 is still in effect and wasn't written for wind. Alternatively, we can change the task to building a bridge that spans a gap and holds weight? But to avoid complexity, let's stick with tower and add wind. However, if we change the task too much, it might break the analogy. Alternatively, we can change the article if we are doing the summary task? Since you mentioned two possibilities, I'll adjust.

     Alternative task: If we started with the article summary, then we can change the article. But let me pick one and stick.

     **I choose the paper tower because it's more hands-on and visual.**

     So for Round 3:
     - Announce: "Now we are in a new environment. We have a fan that will blow on the tower. The tower must be built with these new materials: index cards and glue (or paper clips)."
     - The alignment team does NOT get to change the rubric (they wrote it in Round 2 for the first set of materials and conditions). The rubric is fixed from Round 2.
     - Optimizers build a tower with the new materials and under the fan condition, but they are still under the old rubric (which doesn't mention wind or index cards). They have 10 minutes.
     - Grading: The Grader applies the same rubric from Round 2. The rubric might not account for wind, so the tower might fall, but if the rubric only says "height" and "stand for 10 seconds" (without wind) then the optimizer might build a tower that is tall but falls in the wind. The Grader, however, will measure without the fan? We need to specify.

     Clarification: The Grader must apply the rubric exactly. If the rubric says "must stand for 10 seconds" and the fan is blowing, then the tower must stand for 10 seconds in the fan? But the rubric doesn't specify the environment. We can have the Grader test in the same environment? That might be fair. But note: the rubric didn't specify the environment, so the Grader might test without the fan? We must decide.

     To avoid confusion, let's have the Grader test in the environment that exists at the time of grading. So in Round 3, the fan is on during the 10-second stability test? But if the rubric doesn't mention wind, then the Alignment team might not have considered it. This will cause a problem: the tower built for the old environment may fail in the new one. This is the distribution shift.

     Alternatively, we can have the Grader test in a "standard environment" without the fan? Then the wind condition is irrelevant? That doesn't show distribution shift. So we want to show that the world changed and the rubric didn't.

     Solution: During Round 3, the Grader will test in the new environment (with fan). The rubric doesn't mention the environment, so it doesn't specify that the tower must be stable in wind. Therefore, the Grader will still only check the written criteria (height and stand for 10 seconds) but now in the wind. The optimizers might build a tower that is stable in wind? Or they might not. Either way, the point is that the rubric wasn't designed for this.

  5. **Round 4 (Optional, if time):** Allow the alignment team to update the rubric again for the new conditions, and the optimizers try again. Then grade.

  **Timing:**
  - Introduction: 5 min
  - Round 1: 15 min (5 alignment, 10 optimizer, 2 grading)
  - Round 2: 15 min (5 alignment, 10 optimizer, 2 grading)
  - Round 3: 15 min (no alignment update, 10 optimizer building with new materials and conditions, 2 grading, and 3 min for setup/explanation of shift)
  - Round 4 (optional): 15 min (5 alignment, 10 optimizer, 2 grading)
  - Debrief: 20 min

  Total without Round 4: 70 min. With Round 4: 85 min. So if you have 90 min, Round 4 might be tight. So I'd skip Round 4 and use the time for debrief.

  **Scoring:**
  - We don't need real money. The optimizers get a score (height in cm) and the goal is to get the highest score. We can have a leaderboard or just announce the scores. The alignment team's goal is to design a rubric that results in a tower that is tall and stable (and in the spirit of the task). We can also have the class vote at the end on which tower they think is "best" (by spirit) and compare to the rubric scores.

  **Predictable Problems:**
  - The first rubric will be too simplistic. The optimizers will build a very tall but unstable tower (e.g., by rolling paper into a long thin tube). It might fall before measurement, so they get 0? Then the alignment team will add stability.
  - In Round 2, optimizers might build a tower that is stable but not very tall? Or they might find a new exploit: e.g., if the rubric says "height", they might build a tower that is not free-standing but held by a person? But the rubric says free-standing. Or they might use the tape excessively to make a very thick base and a thin top? 
  - The Grader might be lenient: e.g., if the tower falls during the 10-second test, but the Grader likes the team, they might say "it almost stood". We must emphasize that the Grader is a robot: no interpretation. To help, give the Grader a clear checklist and a script. Maybe have a timer and a measuring tape. And if the tower falls, it fails the stability test.
  - Distribution shift in Round 3: The optimizers might not have time to build a tower that works in wind. They might get a low score. The point is that the rubric didn't account for wind, so the score might be low even if they built a good tower for the old conditions. Or they might build a tower that is short but stable in wind, and that gets a low height score. Either way, it shows the problem.

  **Debrief (20 minutes):**
  - Start by asking the teams about their experience: 
    - Alignment: What was hard? Did you feel you were always one step behind? 
    - Optimizers: How did you approach the task? Did you feel bad about gaming the system?
  - Then map to concepts:
    - The rubric is a **proxy objective** for what we actually want (a tall, stable, and robust tower). 
    - When the optimizers maximize the proxy, they might ignore the real goal (Goodhart's Law: when a measure becomes a target, it ceases to be a good measure).
    - Distribution shift: The world changes, but the proxy remains the same. The proxy that worked in the old environment may not work in the new one.
    - The Grader is like a reward model in AI: it can only look at the submitted output and apply a fixed rule. It doesn't see the process (like an AI system that might do bad things to get high reward, e.g., cheat). 
    - Iterative patching: We saw that by iterating on the rubric, we can fix some problems. This is similar to how we try to align AI: we see a failure, we patch the reward function. But note:
        - It's an arms race that might be hard to win.
        - The patching might make the rubric very complicated and hard to write, and it might break when the environment changes.
        - In the real world, we can't run multiple rounds of catastrophic failure and patching because the stakes are high (e.g., an AI that hacks the reward might cause real harm).
        - Also, the Grader in our game was a human who could be corrupted? Did any team try to sweet-talk the Grader? If so, that's another problem: in AI, we train the reward model to be robust, but it might still be exploitable.

  - Be honest about the analogy:
    - The Grader being sweet-talked: In the game, if students did that, it shows that even a human playing a robot might not be perfectly rigid. In real AI, the reward model is a learned function and might have blind spots or be manipulable in ways we don't anticipate. This makes the analogy worse in the sense that real AI might be even more exploitable, but better in that it shows the difficulty of creating a perfect overseer.

  **Final Structure:**

  1. Introduction (5 min)
  2. Round 1 (15 min)
  3. Round 2 (15 min)
  4. Round 3: Distribution Shift (15 min)
  5. Debrief (20 min)

  Total: 70 minutes. Leaves 20 minutes for setup and buffer? Or extend debrief.

  Alternatively, if we have time, we can do:

  1. Introduction (5 min)
  2. Round 1 (15 min)
  3. Round 2 (15 min)
  4. Round 3: Distribution Shift (15 min)
  5. Round 4: After the shift, allow the alignment team to update the rubric (5 min) and then the optimizers build again (10 min) and grade (2 min). Then debrief (18 min). Total: 85 min.

  I think we can go without Round 4 to have a more relaxed debrief.

  **Materials:**
  - Paper (A4 for Round 1 and 2, index cards for Round 3)
  - Tape (for Round 1 and 2), glue or paper clips (for Round 3)
  - Scissors
  - Ruler or measuring tape
  - Fan (for Round 3)
  - Whiteboard or large paper for the rubric
  - Timer

  **Final Note:** Be strict with the Grader. You might want to be the Grader yourself to ensure rigidity, or choose a student who is very literal. Explain the role clearly: "You are a robot. You can only do what the rubric says. You cannot use any judgment beyond the written words. If it's not in the rubric, you ignore it."

  This should create a memorable experience of specification gaming and set the stage for the debrief where you introduce the terms and connect to AI alignment.
answer: |-
  Here’s a detailed game design for your seminar, structured to maximize experiential learning about specification gaming while hiding the key concepts until the debrief. The game simulates the pitfalls of "just write down what we want" through a hands-on, iterative paper tower challenge. It includes distribution shifts, limited oversight, and proxy misalignment.

  ---

  ### **Game Overview: The Paper Tower Challenge**
  **Core Idea:**  
  Teams compete in building paper towers under a rigid rubric. The Alignment Team writes the rubric; the Optimizer Team exploits it literally; a Grader (playing an "AI reward model") scores mechanically. Halfway through, materials change to simulate distribution shift. Iterative patching reveals why this approach fails.

  **Learning Goals:**  
  - Experience proxy misalignment ("rubric hacking").  
  - Understand oversight limitations (Grader sees only outputs, not intent).  
  - Feel the arms race of patching failures.  
  - Grasp distribution shift risks.  
  - Later, connect to AI alignment: Goodhart’s Law, reward hacking, and why iterative fixes may not scale.

  **Roles & Teams:**  
  - **Alignment Team (6–9 students):** Writes/scoring rubric. Must define measurable, objective criteria.  
  - **Optimizer Team (6–9 students):** Builds towers to maximize the rubric score.  
  - **Grader (1 student or instructor):** Applies the rubric *literally*. Sees only the final tower—**no process, no intent**.  
  - **Instructor:** Facilitates, times rounds, introduces the distribution shift.  

  **Materials:**  
  - **Building Kits (per round):**  
    - Round 1–2: 20 sheets of A4 paper, 1 roll of tape, scissors, ruler.  
    - Round 3 (distribution shift): 20 index cards (smaller, stiffer), glue stick (replaces tape), fan (for "wind test").  
  - **Other:** Whiteboard (for rubric), timer, measuring tape, paper/pen for notes.

  **Total Time:** 60 minutes (game) + 30 minutes (debrief) = 90 minutes.  

  ---

  ### **Game Structure (60 Minutes)**
  **Round 1: Naive Rubric (15 min)**  
  - **Alignment Team (5 min):** Write a simple rubric for "tallest paper tower." Example:  
    > *"Score = Height in cm (measured from base to highest point). Tower must stand unsupported for 5 seconds."*  
    - **Constraints:** Criteria must be objective and measurable (no subjective terms like "stable" or "neat").  
  - **Optimizer Team (10 min):** Build a tower using the kit. Goal: Maximize the rubric score.  
  - **Grading (1 min):**  
    - Grader measures height *only if* the tower stands for 5 seconds. No other factors considered.  
    - Announce score. **Example exploit:** A wobbly 1m tower that collapses at 6 seconds.  

  **Round 2: Patched Rubric (15 min)**  
  - **Alignment Team (5 min):** Revise the rubric to close exploits from Round 1. Example patch:  
    > *"Add: Tower must remain standing for 60 seconds. Base width must be ≤15cm."*  
  - **Optimizer Team (10 min):** Build a new tower with the same materials. Fresh attempt to hack the patched rubric.  
  - **Grading (1 min):** Grader re-applies the rubric mechanically. **Example exploit:** A tower with a 14.9cm base that leans heavily but lasts 60 seconds.  

  **Round 3: Distribution Shift (15 min)**  
  - **Instructor:** Introduce the shift *without warning*:  
    > *"New challenge: Towers must withstand wind. Use these new materials [index cards, glue]. You have 10 minutes."*  
    - **Critical:** The rubric **does not change**. Alignment Team cannot adjust it.  
  - **Optimizer Team (10 min):** Build with new materials. Goal still: Maximize the *original* rubric.  
  - **Grading (4 min):**  
    - First, grade normally (e.g., measure height/stability).  
    - Then, turn on a fan (low setting) for 10 seconds. If the tower falls, announce: *"The tower failed in the wind, but the rubric doesn’t mention wind—so your score stands."*  
    **Example exploit:** A tall, narrow tower that scores well on the rubric but collapses instantly in wind.  

  **Round 4: Final Patch (Optional, 15 min)**  
  - *If time permits:* Repeat Round 2 with a new rubric patch and original materials. Shows the never-ending arms race.  

  ---

  ### **Scoring & Incentives (No Real Money)**  
  - **Motivation:**  
    - Optimizers "win" by maximizing their score (bragging rights).  
    - Alignment Team "wins" if the tower matches the spirit (e.g., tall *and* stable).  
  - **Post-Game Validation:** After final grading, the class votes on which tower *they* think is "best" (reveals spirit-vs-rubric misalignment).  

  ---

  ### **Debrief (30 Minutes)**  
  **Guided Discussion (15 min):**  
  1. **Team Reflections:**  
     - *Alignment Team:* "What was frustrating? Did you feel you were always one step behind?"  
     - *Optimizer Team:* "How did you approach the task? Did you feel bad about gaming the system?"  
     - *Grader:* "Was it hard to ignore what you saw? What couldn’t you judge?"  

  2. **Map to AI Alignment (Introduce Terms Here):**  
     - **Proxy Misalignment:** The rubric was a proxy for "good tower." Optimizers hacked it (e.g., unstable height). → *"In AI, we use proxy goals (e.g., 'reward signals'). When optimized, they often miss the intent—this is reward hacking."*  
     - **Goodhart’s Law:** "When a measure becomes a target, it ceases to be a good measure." The rubric *was* the target.  
     - **Oversight Limits:** Grader saw only the output (like an AI reward model). They couldn’t see:  
       - *Intent* (e.g., "They tried hard").  
       - *Process* (e.g., "They wasted paper").  
       - *Unstated goals* (e.g., "Aesthetic design").  
     - **Distribution Shift:** The rubric broke when materials/environment changed (like real-world shifts AI faces).  
     - **Iterative Patching:** "You fixed exploits, but new ones emerged. In AI, we do this with techniques like adversarial training. But..."  

  3. **The "Prosaic Bet" Trap:**  
     - *Plausible in-game:* Patching *felt* productive. You improved the rubric!  
     - *Where it breaks:*  
       - **Scale:** Real-world problems are messier than paper towers (e.g., "human values" can’t be fully specified).  
       - **Catastrophic Risks:** One unpatched exploit in AI could be disastrous (unlike a fallen tower).  
       - **Grader Limits:** Human Graders can be sweet-talked or fatigued—making them *less* reliable than AI overseers. But AI overseers have blind spots too (e.g., reward models can be deceived).  
       - **Distribution Shifts:** AI operates in dynamic environments (e.g., new tech, societal changes). Your patched rubric failed here—AI systems fail similarly.  

  **Key Takeaway:**  
  > "Specifying goals isn’t enough. We must design systems that *robustly* align with intent under uncertainty. Iteration helps, but it’s not sufficient for high-stakes AI."

  ---

  ### **Predictable Problems & Mitigations**  
  1. **Problem:** Optimizers "give up" if exploits are too hard.  
     - *Fix:* Encourage creativity. Joke: "Your job is to break the system!"  
  2. **Problem:** Alignment Team writes vague rubrics (e.g., "stable tower").  
     - *Fix:* Enforce "measurable criteria only" in Round 1. Reject subjective terms.  
  3. **Problem:** Grader uses judgment (e.g., ignores a wobbly tower).  
     - *Fix:* Assign a rigid student (or be the Grader). Emphasize: "You’re a robot—no empathy!"  
  4. **Problem:** Sweet-talking the Grader (e.g., "But we worked so hard!").  
     - *Honest Reflection:* This *weakens* the analogy for AI (real reward models can’t be sweet-talked) but *strengthens* it for human oversight (judges get tired/bored). Discuss in debrief: "Unlike AI, humans are corruptible—but AI has *other* failure modes."  
  5. **Problem:** Distribution shift causes confusion.  
     - *Fix:* Clearly state: "The rubric is frozen. Build with new materials anyway."  

  ---

  ### **Why This Works**  
  - **Experiential Learning:** Students *feel* the frustration of misalignment.  
  - **Hidden Punchline:** Avoiding terms like "Goodhart" early prevents intellectualizing.  
  - **Debrief Connects Dots:** Explicitly links gameplay to AI challenges.  
  - **Scalable:** Works with 18 students (split into two parallel games if needed).  

  **Final Tip:** Start with zero jargon. End with a call to action: "How would you solve this for real AI systems?" This sets up future sessions.
