  Here’s a thought experiment designed to pressure presentism, followed by analysis of truthmakers, options for presentism, and a mirror case test for eternalism. I’ll flag assumptions, assess the cost, and end with confidence ratings.

  ---

  ### **The Thought Experiment: The Forgotten Whistle**
  **Scenario:**  
  In 12,000 BCE, a solitary nomadic herder in the now-submerged Doggerland region (a prehistoric landmass in the North Sea) carved a unique, intricate bone whistle. After completing it, they blew it exactly once—a single, pure note echoing across an empty marsh—before accidentally dropping it into a deep peat bog. The whistle sank instantly, preserved in an oxygen-free environment but utterly inaccessible and undiscoverable even today. Simultaneously, a sudden micro-landslide erased all footprints and tool marks. No human or animal witnessed the event. The sound waves dissipated without affecting anything (no echoed triggers for avalanches, animal stampedes, etc.), and the herder died minutes later in an unrelated accident, leaving no oral tradition. By present day, sea levels have risen, burying the whistle under 100 meters of sediment and water, with zero physical, chemical, biological, or gravitational traces remaining (e.g., no isotopic signatures, no sediment layers disturbed, no cosmic rays deflected).  

  **Statement to be Made True:**  
  *"A herder in Doggerland carved and blew a bone whistle exactly once in 12,000 BCE."*  

  **Constraints Satisfied:**  
  - **Zero present traces:** No records, memories, causal effects, or residual evidence exist.  
  - **Non-exotic:** No quantum mechanics, observers, or "the event's occurrence" smuggled in as a present fact.  
  - **Intuitive truth:** Despite no traces, this feels like a historical fact we’d insist is either true or false (not indeterminate or meaningless).  

  ---

  ### **Truthmaker Analysis**
  1. **Eternalist Truthmaker** (Past, present, and future equally real):  
     The **past event itself**—located in the 12,000 BCE "block" of spacetime—directly grounds the truth. The whistle-carving and blowing are real, concrete constituents of the past, making the statement true by correspondence.  

  2. **Presentist Options** (Only the present exists):  
     - **Lucretianism:** The present world instantiates a fundamental, irreducible property like *having-contained-a-whistle-blowing-event-in-Doggerland-at-12k-BCE*. This is a "big, ugly fact" (David Lewis' term) about the present moment, with no physical basis.  
     - **Ersatzism:** Abstract, present entities (e.g., propositions, sets of descriptions) serve as truthmakers. For example, a maximal consistent set of present propositions includes *"The whistle event occurred"* as a brute primitive.  
     - **Alethic primitivism:** Truths about the past require no truthmakers; they’re "bare facts" (rejected by most as unexplanatory).  
     - **Denial:** Claim the statement lacks a truth value (counterintuitive, as we’d insist it’s either true or false).  

  **Feature Doing the Work:**  
  The **untraceability** of the event. With no remnants, presentists cannot appeal to familiar trace-dependent truthmakers (e.g., memories, fossils, causal chains). Lucretian properties become the only viable option, but they’re metaphysically costly—positing a vast, unexplained inventory of properties for every past event.  

  ---

  ### **Mirror Case Against Eternalism?**
  **Scenario Attempt:** A "barely possible" future event—e.g., *"A specific oxygen atom in the Andromeda Galaxy will quantum-tunnel at exactly 3:00 PM UTC on January 1, 2500."* Assume no present causes determine this (quantum indeterminacy), and it leaves no *backward* traces (unlike the past, the future exerts no causal influence on the present).  

  **Pressure on Eternalism?**  
  - **Eternalist response:** Easy—the future event exists in the 2500 CE block, making the statement true (if it happens) or false (if not). No pressure.  
  - **Why asymmetry?** Eternalism treats future events as *ontologically settled* but *epistemically inaccessible*. Our intuition that future contingents are "open" is epistemic, not metaphysical. Presentism’s problem is metaphysical: untraceable past events *feel* fixed and real, but presentism lacks the ontology to ground them.  
  - **Result:** No symmetric pressure. Eternalism handles truthmakers for past *and* future claims effortlessly; presentism struggles only with the past.  

  ---

  ### **Assessment of the Truthmaker Objection**
  - **Real cost or vocabulary demand?**  
    This scenario reveals a **real cost** for presentism. Lucretian properties are not just "extra vocabulary"—they’re *brute, ungrounded additions* to the present. Unlike trace-based truthmakers (e.g., fossils), they lack any connection to physical reality, violating parsimony and inviting skepticism. If presentism requires a distinct, irreducible property for *every* untraceable past event, it inflates ontology gratuitously.  
  - **Assumption check:** The experiment **does not assume eternalism**. It relies on the *intuition* that past events are truth-apt even without traces—an intuition presentists like Bigelow (1996) grant. If this intuition is rejected, presentism collapses into radical skepticism about history.  

  ---

  ### **Confidence and Defensibility**
  - **Overall confidence:** **85%**. The asymmetry between presentism and eternalism is robust, and the Lucretian move is widely seen as a liability (Sider, 2001; Bourne, 2006).  
  - **Weakest step (in a seminar):** **Defending Lucretian properties as non-ad-hoc**. I’d struggle to justify why *this* property (e.g., *having-contained-the-whistle-event*) is fundamental while avoiding an explosion of similar properties for every trivial past event (e.g., *having-contained-a-specific-leaf-fall-in-10k-BCE*). Critics (e.g., Cameron, 2011) argue this makes presentism "ontologically unconstrained."  

  **Key References**  
  - Bigelow, J. (1996): Presentists endorse Lucretian properties as truthmakers.  
  - Sider, T. (2001): *Four-Dimensionalism* critiques presentist truthmakers.  
  - Bourne, C. (2006): *A Future for Presentism* defends but acknowledges the "truthmaker problem."  

  This experiment suggests the truthmaker objection is a substantive cost, not mere semantics. Presentism survives only by inflating the present with shadowy remnants of the past—a price many metaphysicians deem too high.
