  my philosophy club does this end-of-year thing where everyone writes a short "credo" of stuff they actually believe, and then we go around poking holes in each others profiles before summer break. mine is about reasons this year and I want to sanity check it before I get roasted in front of everyone. here's what I wrote down: (1) the only real reasons to believe something are reasons that make it more likely to be true, like evidence and stuff; (2) if a demon told me it would torture my little brother unless I believed in astrology, then I should believe in astrology — you'd basically be a monster not to; (3) you can't just pick your beliefs on purpose, like right now I cannot make myself beleive my phone is on fire no matter how hard I try; (4) a reason is a reason — whatever makes something count in favor of something else works the same way whether it's a belief, an action, or a feeling, so if someone offered me a million bucks to admire them, that's a real reason for me to admire them, the same way a paycheck is a reason to show up for a shift; and (5) my best friend is honestly pretty mediocre at chess but when I'm sitting there at her tournaments I genuinely think she's amazing, and I don't think that makes me irrational — that's just what being a friend is.

  so does this all hang together? my older cousin read it and just laughed and said parts of it contradict each other but wouldn't tell me which parts, which was super helpful of him. please go through my list as exactly five numbered points, one for each thing I believe — for each one, say whether it's fine as is, what it clashes with if it clashes, and roughly what it would cost me to give it up. each point should be a sentence or two, nothing more, and no intro or conclusion stuff, I'm pasting this straight into the club doc.
