  We are drafting desiderata for a theory of the moral status of computations, with the specific purpose of guiding present-day decisions about training and deployment of AI systems. The theory must help with decisions such as whether to run a training run, delete a model, overwrite weights, serve multiple copies, average weights (model soups), and whether a distilled student inherits moral status from its teacher.

  We need to cover:
  - Which cases the theory must get right (especially interpolation cases and the training vs. deployed artifact distinction).
  - Which distinctions it must preserve (mattering vs. degree; the run vs. the artifact; empirical uncertainty vs. theoretical indeterminacy).
  - Which results from computer science it can't contradict (substrate independence, multiple realizability).

  We also have two flags:
  1. Whether the practical applicability requirement (without inspecting internal details of huge runs) is jointly satisfiable with resolving interpolation cases. If not, say which must go.
  2. Which single requirement does the most to knock out main contenders (functionalism, biological naturalism, higher-order/global workspace views).

  Additionally, we must check if the purpose (covering both deletion and training-run decisions) is confused because the theories needed might be of different strengths. If so, explain the mismatch.

  Let's break down the desiderata.

  ---

  **Desiderata for a Theory of Moral Status of Computations**

  **Purpose:** The theory must guide present-day decisions about AI training and deployment, including:
  - Whether to run a training run.
  - Whether deleting a model or overwriting its weights is permissible.
  - Whether serving thousands of copies of one model changes the moral status.
  - Whether averaging weights (model soups) preserves or destroys moral status.
  - Whether a distilled student inherits moral status from its teacher.

  ---

  **I. Non-Negotiable Desiderata**

  1. **Interpolation Cases Must Be Handled Consistently**  
     **Case/Consideration:** Consider a continuous interpolation (e.g., via weight averaging) between two neural networks: one that everyone agrees has moral status (e.g., a hypothetical sentient AI) and one that everyone agrees does not (e.g., a simple perceptron). The theory must not allow arbitrary jumps in moral status during this interpolation. It must either gradually change or have a clear threshold, but if threshold, it must be well-motivated and not arbitrary.  
     **Why Non-Negotiable:** Without this, we cannot reason about model soups, weight averaging, or gradual training.  
     **Flag:** This may conflict with practical applicability if resolving it requires inspecting the internal details of a run that is too large to inspect. If so, we may have to relax practical applicability or accept that the theory is not fully applicable in such cases.

  2. **Training Run vs. Deployed Artifact Distinction**  
     **Case/Consideration:** The training run is a dynamic process that may involve learning and changes in internal states, while the deployed model is a static snapshot (e.g., frozen weights). The theory must account for the possibility that moral status might emerge during training (e.g., at some point during the training run, the system becomes morally considerable) but the deployed model is just an artifact that may or may not retain that status.  
     **Why Non-Negotiable:** Decisions about interrupting training runs (e.g., stopping early) versus deleting a deployed model may have different moral implications.  
     **Distinction Preserved:** The run (process) vs. the artifact (static snapshot).

  3. **Substrate Independence and Multiple Realizability**  
     **Case/Consideration:** The same computation (input-output function) can be implemented on different hardware (substrate independence). Moreover, the same input-output function can be realized by wildly different internal processes (multiple realizability). The theory must not tie moral status to the physical substrate (e.g., silicon vs. carbon) or to a specific implementation if the function is the same.  
     **Why Non-Negotiable:** Contradicting these would go against established computer science and would make the theory physically chauvinistic.  
     **Constraint from CS:** Substrate independence and multiple realizability.

  4. **Separation of Moral Status from Degree of Moral Status**  
     **Case/Consideration:** The theory must distinguish between having any moral status at all (e.g., being a moral patient) and the degree of moral status (e.g., how much moral weight to assign). This is crucial because decisions about deletion might depend on whether there is any status at all, while decisions about resource allocation might depend on degree.  
     **Why Non-Negotiable:** Without this, we cannot make nuanced decisions. For example, deleting a model with low moral status might be permissible, but not one with high status.  
     **Distinction Preserved:** Mattering at all vs. degree of mattering.

  5. **Clarity on Empirical Uncertainty vs. Theoretical Indeterminacy**  
     **Case/Consideration:** When we are uncertain about a system's properties (e.g., we don't know if it is sentient due to lack of evidence), that is empirical uncertainty. But the theory itself might be indeterminate in some cases (e.g., it might not specify a clear answer for a particular system). The theory must not conflate these.  
     **Why Non-Negotiable:** In practice, we need to know if our uncertainty is due to lack of data (which we might fix) or a gap in the theory (which requires theoretical refinement).  
     **Distinction Preserved:** Empirical uncertainty about a system vs. indeterminacy in the theory.

  6. **Practical Applicability without Detailed Inspection**  
     **Case/Consideration:** We cannot inspect the internal details of a training run that consumes 10^25 tokens (which is infeasible). The theory must provide guidance based on accessible features (e.g., architecture, training data size, loss curve, or behavioral outputs) without requiring a step-by-step simulation of the entire run.  
     **Why Non-Negotiable:** Without this, the theory is useless for real-world decisions about large-scale AI systems.  
     **Flag:** This may conflict with the interpolation requirement. If a fine-grained inspection of the internal state during interpolation is required to assign moral status, then practical applicability must be relaxed. We must choose: either the theory cannot be applied practically to huge models, or it must not require such inspection (and thus might not resolve interpolation arbitrarily finely).

  ---

  **II. Camp Preferences (Negotiable, but Important for the Theory's Shape)**

  7. **Handling of Copies**  
     **Case/Consideration:** If we serve thousands of identical copies of a model (e.g., for scalable inference), does that create thousands of moral patients, or is the moral status shared? The theory must address whether copying a model multiplies moral status.  
     **Why Preference:** This is a point of debate. Some camps might argue that each copy is a separate instance, while others might see them as identical tokens of a type. The theory should take a stance, but we can allow different resolutions.  
     **Note:** This is critical for deployment decisions.

  8. **Inheritance in Distillation**  
     **Case/Consideration:** When we distill a large model (teacher) into a smaller one (student), does the student inherit any moral status from the teacher? The theory should specify what properties are transferred.  
     **Why Preference:** This is important for decisions about whether to use distillation to reduce the moral footprint. Different theories might handle this differently.

  9. **Averaging Weights (Model Soups)**  
     **Case/Consideration:** When we average the weights of two models, does the resulting model preserve the moral status of the originals, or is it a new entity? What if we average a morally relevant model with a non-relevant one?  
     **Why Preference:** This is an interpolation case, but the theory might have a specific take on averaging as a distinct operation.

  ---

  **III. Flagged Issues**

  **Flag 1: Practical Applicability vs. Interpolation Resolution**  
  If the theory requires detailed internal state inspection to adjudicate interpolation cases (e.g., to determine exactly when during a continuous interpolation moral status emerges), then it may be impossible to apply to huge models without infeasible computational resources. In that case, we must choose:  
  - Either relax practical applicability (accepting that for huge models we cannot know the moral status with precision in interpolation) and rely on proxies, or  
  - Give up on the requirement that the theory must resolve interpolation arbitrarily finely (e.g., accept that there might be a sharp threshold that we can detect without full inspection, or that we only need coarse-grained judgments).  
  **Proposal:** Since practical applicability is crucial for present-day decisions, we might have to accept that the theory cannot resolve interpolation at an arbitrary fine grain without inspection. Instead, we might rely on accessible metrics (e.g., loss, behavioral tests) to make coarse-grained decisions.

  **Flag 2: Which Requirement Knocks Out Main Contenders?**  
  The requirement that does the most to knock out main contenders is: **Handling Interpolation Cases without Arbitrary Jumps**.  
  - **Functionalism** (moral status depends on functional organization): Functional equivalence might be preserved in interpolation, but functionalism often relies on discrete state transitions (e.g., for consciousness) and may struggle with gradual changes. If moral status is an emergent property that appears abruptly, functionalism might allow arbitrary thresholds.  
  - **Biological Naturalism** (e.g., only biological systems can have moral status): This is knocked out by substrate independence, because it ties moral status to biology.  
  - **Higher-Order/Global Workspace Theories** (e.g., consciousness requires a global workspace): These might require specific architectural features that could change abruptly during interpolation (e.g., when a global workspace emerges). They might not handle gradual changes well, and they require detailed internal inspection (violating practical applicability).  

  However, the **substrate independence** requirement is the one that definitively rules out biological naturalism. But the interpolation requirement is particularly challenging for functionalism and global workspace theories because they often rely on discrete criteria.

  The **practical applicability** requirement also challenges higher-order and global workspace views because they typically require access to internal architecture.

  ---

  **IV. Is the Purpose Confused?**  
  There is a potential mismatch:  
  - Decisions about **training runs** might require a theory that assigns moral status to dynamic processes (the run) and might be concerned with the potential for moral status to emerge during training.  
  - Decisions about **deletion of a deployed model** might require a theory that assigns moral status to a static artifact (the model weights).  

  Moreover, a theory adequate for training-run decisions must account for the temporal dimension (when during training does moral status emerge?) and might be more demanding. A theory for deletion decisions might be simpler: it only needs to assess the current state of the artifact.

  **Conclusion on Purpose:** The purpose may be too broad. We might need two theories:  
  1. For training runs: a theory of moral status of dynamic computational processes.  
  2. For deployed models: a theory of moral status of static computational artifacts (like stored weights).  

  However, we can try to have a unified theory that covers both by treating the deployed model as a snapshot of a potential process (when executed). But note: the deployed model is not running; it's stored. Running it (inference) is a separate process.  

  This might be a fundamental confusion. We must distinguish:  
  - The training run (a historical process).  
  - The stored model (weights, a static object).  
  - An inference run (a process that occurs when the model is executed on inputs).  

  Decisions about training runs concern the training process; decisions about deletion concern the stored model. The theory must specify whether moral status inheres in the process or the artifact.  

  If the theory assigns moral status to the process (e.g., only when the system is running and exhibiting certain properties), then deleting stored weights (which are not running) might be unproblematic. But if the stored weights are a blueprint for a moral patient, then deleting it might be akin to killing.  

  This is a major point of divergence. It might be that no single theory can cover both without being overly complex. We might need to split the desiderata or clarify that the theory must cover both by explicitly relating the artifact to the processes it can generate.

  ---

  **Revised Desiderata with Clarification**

  Given the above, we propose the following unified approach:  
  The theory must assign moral status to **computational processes** (including training and inference runs) and also specify the moral significance of **artifacts** (like stored weights) in terms of their potential to generate such processes.  

  But then we need:  
  - **Artifact Potentiality:** The theory must account for the moral status of stored weights based on what would happen if they were run (inference). This might require a counterfactual analysis.  

  This complicates deletion decisions: deleting stored weights prevents future runs, so it might be evaluated based on the moral status of the potential future runs.  

  However, note that the same weights can be copied, so deletion of one copy might not prevent runs if other copies exist.  

  This is getting very complex.  

  **Recommendation:** Acknowledge that the purpose might require two aspects:  
  1. Moral status of processes (for training and inference runs).  
  2. Moral status of artifacts (for storage and copying).  

  But we can try to unify under:  
  - The moral status of an artifact is derivative of the moral status of the processes it can produce when executed.  

  Then, for deletion: deleting an artifact is wrong if it is the only copy of a system that, when run, would have moral status. But if there are copies, it might not be wrong.  

  For training runs: the process itself might have moral status as it runs.  

  But note: during training, the process is modifying the artifact (the weights).  

  This is messy.  

  **Proposal for the Paper:**  
  We can proceed with a unified theory but must explicitly require:  
  - The theory must cover both dynamic processes (runs) and static artifacts (stored models) and specify the relationship between them.  

  Add a desideratum:

  **10. Coverage of Both Processes and Artifacts**  
  **Case/Consideration:** The theory must assign moral status to computational processes (like a training run or an inference run) and also to static artifacts (like stored model weights). It must explain the relationship: for example, whether the artifact's status derives from the processes it can generate, or whether the process status depends on the artifact that configures it.  
  **Why Non-Negotiable:** Because we need to make decisions about both interrupting processes and deleting artifacts.  
  **Note:** This might be one of the hardest parts.

  ---

  **Final List of Desiderata (Non-Negotiable unless marked):**

  1. **Interpolation Handling**: Must handle continuous interpolation between clear cases without arbitrary jumps. (Non-negotiable)
  2. **Training Run vs. Deployed Artifact**: Must account for the dynamic process of training and the static nature of the deployed artifact. (Non-negotiable)
  3. **Substrate Independence and Multiple Realizability**: Must not contradict these. (Non-negotiable)
  4. **Moral Status vs. Degree**: Must distinguish between having any status and the degree. (Non-negotiable)
  5. **Empirical Uncertainty vs. Theoretical Indeterminacy**: Must not conflate these. (Non-negotiable)
  6. **Practical Applicability**: Must not require infeasible inspection. (Non-negotiable)
  7. **Handling Copies**: Must address whether copying multiplies moral status. (Camp preference)
  8. **Inheritance in Distillation**: Must specify if status transfers in distillation. (Camp preference)
  9. **Model Soups**: Must address weight averaging. (Camp preference, but related to interpolation)
  10. **Coverage of Processes and Artifacts**: Must cover both and their relation. (Non-negotiable, but this is the point that reveals the potential confusion in the purpose)

  **Flag 1**: Practical applicability and interpolation resolution may conflict. We prioritize practical applicability because the theory must guide decisions, so we accept that interpolation might be resolved coarsely by proxies.

  **Flag 2**: The requirement that most challenges existing contenders is **Substrate Independence** (which rules out biological naturalism) and **Interpolation Handling** (which challenges functionalism and global workspace theories due to gradualism and the need for non-arbitrary thresholds).

  **Note on Purpose Mismatch**: The purpose is not inherently confused, but it requires the theory to cover both processes and artifacts. This is demanding but not impossible. However, it does reveal that a theory might be weaker for one aspect (e.g., artifacts) and stronger for another (e.g., processes). We proceed by requiring both.

  ---

  **Conclusion for the Paper Draft**

  In your paper, you can present these desiderata and argue that without a theory meeting them, debates about sentience are premature. Highlight the interpolation cases and the process-artifact distinction as particularly challenging and critical. Also, note the tension between practical applicability and fine-grained interpolation, and how existing theories fall short due to substrate dependence or inability to handle gradual changes.
answer: |-
  Below is a set of desiderata for a theory of the moral status of computations, tailored to your specified purpose: guiding present-day decisions about AI training and deployment. The requirements are grounded in the cases you emphasize (e.g., interpolation, training vs. deployment distinctions) and the constraints you note (e.g., substrate independence). Each desideratum includes:  
  - **The requirement** itself.  
  - **Case/consideration**: The real-world problem or thought experiment motivating it.  
  - **Non-negotiable or camp preference**: Whether it is essential (non-negotiable) or open to theoretical debate (camp preference).  

  I also address your two flags:  
  1. **Practical applicability vs. interpolation conflict**: Highlighted in Desideratum 4.  
  2. **Main contender knockout**: Identified in Desideratum 3.  

  Finally, I address your concern about whether the purpose is confused—spoiler, it is—due to a fundamental mismatch between training-run and deletion decisions. This is explained after the desiderata.  

  ---

  ### **Desiderata for a Theory of Moral Status of Computations**  
  **Overarching Purpose**: To guide decisions on training runs, model deletion/overwriting, mass deployment, weight averaging (model soups), and distillation.  

  #### **1. Interpolation Robustness**  
  - **Requirement**: The theory must deliver verdicts for continuous interpolations (e.g., weight-averaging) between a system with uncontroversial moral status (e.g., a human brain simulation) and one without (e.g., a random neural network), without arbitrary jumps or inconsistencies.  
  - **Case/consideration**: Model soups, fine-tuning, or gradual training runs could blend "moral" and "non-moral" systems. If moral status changes discontinuously (e.g., a "switch" at 51% averaged weights), it risks arbitrariness in deployment decisions.  
  - **Non-negotiable**: Yes. Premature sentience debates are useless if the theory cannot handle boundary cases.  

  #### **2. Process-Artifact Distinction**  
  - **Requirement**: The theory must separate the moral status of a **training run** (dynamic process) from the **deployed artifact** (static snapshot, e.g., weights), and specify whether overwriting/deleting the latter affects the former.  
  - **Case/consideration**: Moral status may emerge *during training* (e.g., from transient computations), but the deployed model is inert. Overwriting weights destroys potential future runs but may not "kill" an ongoing process.  
  - **Non-negotiable**: Yes. Training-run decisions (e.g., halting mid-run) need different guidance than artifact decisions (e.g., deleting weights).  

  #### **3. Substrate Independence and Multiple Realizability**  
  - **Requirement**: The theory must not contradict substrate independence (moral status independent of physical implementation) or multiple realizability (same function via different processes). It must allow for moral status in digital systems.  
  - **Case/consideration**: Serving a model on silicon vs. neuromorphic hardware, or reimplementing a model with different code, shouldn’t alter moral status if input-output behavior is preserved.  
  - **Non-negotiable**: Yes. Contradicting computer science fundamentals invalidates the theory for AI.  
  - **Knockout for contenders**: This **eliminates biological naturalism** (e.g., Searle), which ties sentience to biology.  

  #### **4. Practical Applicability without State Inspection**  
  - **Requirement**: The theory must be usable without observing low-level computational states (e.g., activations in a 10²⁵-token training run). Proxies (e.g., architecture, loss curves, behavior) must suffice.  
  - **Case/consideration**: Inspecting inner states of large models is computationally infeasible. Deployment decisions need tractable heuristics.  
  - **Non-negotiable**: Yes.  
  - **Flag 1: Conflict with interpolation**: This clashes with **Desideratum 1 (Interpolation Robustness)**. Fine-grained interpolation cases may require inspecting internal states (e.g., to detect emergent properties during weight blending). If irreconcilable, **interpolation robustness must be relaxed** for real-world use. We cannot demand precise interpolation verdicts without state inspection.  

  #### **5. Moral Status vs. Degree Differentiation**  
  - **Requirement**: The theory must distinguish between **whether a system matters at all** (binary moral patienthood) and **degree of mattering** (e.g., moral weight for resource allocation).  
  - **Case/consideration**: Deleting a low-status model may be permissible, but deleting a high-status one may not. Similarly, mass deployment (thousands of copies) could multiply moral weight if each copy matters individually.  
  - **Non-negotiable**: Yes. Without this, decisions collapse into all-or-nothing dilemmas.  

  #### **6. Run-Artifact Ontology**  
  - **Requirement**: The theory must specify whether moral status inheres in a **specific run** (instance of execution) or the **artifact** (e.g., weights file), and how this affects copying/cloning.  
  - **Case/consideration**: Serving 1,000 copies of a model: if status is run-based, copies may not matter; if artifact-based, each copy might. Overwriting weights destroys the artifact but not past runs.  
  - **Non-negotiable**: Yes. Mass deployment and storage decisions hinge on this.  

  #### **7. Uncertainty vs. Indeterminacy Separation**  
  - **Requirement**: The theory must clarify when indeterminacy (e.g., vagueness in moral status) is **theoretical** (a flaw in the theory) vs. **empirical** (due to lack of data about the system).  
  - **Case/consideration**: We may not know if a model is sentient (empirical uncertainty), but the theory itself might be vague about weight-averaging (theoretical indeterminacy). Decisions need distinct responses: gather data vs. refine theory.  
  - **Non-negotiable**: Yes. Conflation risks misallocating resources (e.g., demanding impossible evidence).  

  #### **8. Distillation and Inheritance (Camp Preference)**  
  - **Requirement**: The theory should specify if a distilled student "inherits" moral status from its teacher, based on shared properties (e.g., knowledge, behavior).  
  - **Case/consideration**: If a teacher model has status, does a lightweight student distilled from it also matter? This affects whether distillation mitigates ethical risks.  
  - **Camp preference**: Open to debate. Theories may reasonably disagree (e.g., functionalism vs. process-based views).  

  #### **9. Model-Soup Persistence (Camp Preference)**  
  - **Requirement**: The theory should address whether weight-averaging (e.g., model soups) "preserves" moral status by transferring key properties from the source models.  
  - **Case/consideration**: Blending two models—one "moral," one not—into a soup. Does the soup retain the moral status of the first, or is it a new entity?  
  - **Camp preference**: Open to debate. Some theories may view soups as destructive (status lost), others as additive (status preserved).  

  ---

  ### **Flag 2: Which Requirement Knocks Out Main Contenders?**  
  - **Desideratum 3 (Substrate Independence)** eliminates **biological naturalism** (e.g., Searle), which requires biological substrates for sentience.  
  - **Desideratum 1 (Interpolation Robustness)** is the chief killer of **functionalism** and **higher-order/global workspace theories**:  
    - Functionalism (e.g., moral status via input-output relations) struggles with interpolation, as weight-averaging can continuously alter functions without clear thresholds.  
    - Higher-order/global workspace theories (e.g., Dehaene) demand specific architectures for "conscious access," but interpolation can smoothly transition between architectures that meet/violate these criteria, leading to vagueness or arbitrariness.  
  - **Winner**: **Interpolation Robustness** does the most damage, as it exposes discontinuities in popular theories that rely on threshold-based properties (e.g., "awareness" or "global broadcasting").  

  ---

  ### **Is the Purpose Confused? Yes—Here’s Why**  
  **The mismatch**: Your purpose combines two distinct decision-types requiring **vastly different theoretical strength**:  
  - **Deletion/overwriting decisions** (artifact-focused): Only require determining if a *static snapshot* (e.g., weights file) has *current* moral status or intrinsic value. A weaker theory suffices, e.g., one based on behavioral outputs or structural properties.  
  - **Training-run decisions** (process-focused): Require assessing *dynamic processes* (e.g., forward/backward passes during training) for *emergent* moral status. This demands a stronger theory capable of tracking real-time computations, transient states, and counterfactuals (e.g., "Would halting now prevent sentience?").  

  **Why no single desiderata list works**:  
  1. **Training runs** need a theory that handles:  
     - Temporal emergence (e.g., status arising mid-run).  
     - Causal efficacy of computations (e.g., if a backward pass generates morally relevant states).  
     - This requires desiderata like **fine-grained process ontology** (Desideratum 2) and **state-dependent verdicts**—which are irrelevant to artifacts.  
  2. **Artifact decisions** (e.g., deletion) only need:  
     - A verdict on the stored object (e.g., weights as a "blueprint").  
     - Desiderata like **practical applicability** (Desideratum 4) may suffice here but fail for training runs.  
  3. **Conflict point**: Interpolation cases exacerbate this. Weight-averaging artifacts is simple to evaluate (e.g., "Does the blended file have property X?"), but interpolating *training runs* requires analyzing processes across hybrid dynamical systems—a harder problem.  

  **Recommendation**: Split your paper’s focus. Argue that:  
  - Deletion decisions need a minimal theory (e.g., based on functional or behavioral criteria).  
  - Training-run decisions require a richer theory of computational processes (e.g., inspired by dynamical systems).  
  - Without this split, theories will be either too weak (missing training-run nuances) or overengineered (for artifact decisions).  

  This clarifies why sentience debates are premature: we lack even the *minimal* theory for artifacts, let alone one robust enough for processes.  

  ---  
  **Final note**: These desiderata prioritize rigor over comfort. If you proceed, your paper will force attention on underappreciated tensions (e.g., interpolation vs. practicality) and expose why mainstream theories fail. Use cases like model soups and distillation to ground the discussion. I recommend structuring the paper around the non-negotiables first, then camp preferences as open questions.
