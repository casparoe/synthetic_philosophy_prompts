prompt: |-
  Quick backstory: I'm American, work in logistics, and our head office is in Hamburg, so I've got a German colleague, Katharina, who is genuinely intense about privacy. When I told her that my apartment building shows up on Google Street View and I'd never thought twice about it, she looked at me like I'd said I leave my front door open on holiday. Meanwhile my uncle back in Ohio has a line he uses whenever this comes up: 'if you've done nothing wrong, you've got nothing to hide.' He said it over Thanksgiving when I mentioned that Germany has all these rules about what companies and the government can keep on you, and he basically used it to end the conversation, like it's a knockdown argument. Then a third friend, who's really into tech news, threw in that China is basically running the 'nothing to hide' idea at full scale with its social credit stuff, and that made me wonder whether my uncle's line actually commits him to being fine with that, which he definately is not.

  I don't want a lecture on privacy rights. What I want is to understand what my uncle's one-liner is actually claiming. It sounds obvious, but I have a feeling it's doing several different jobs at once. Can you lay out the different precise things 'nothing to hide' could mean — like a menu I can actually use, from the most trivial reading up to the really strong ones — and for each one say whether it's plausible, whether it's flat-out false, and, most importantly, whether it would actually support ending the argument the way my uncle used it? E.g. does the slogan get you 'the Germans are being paranoid about Street View', does it get you 'the state can look at whatever it wants, whenever it wants', or does it only get you something much weaker that even my uncle would admit doesn't cover everything? And at the end, tell me which reading the people who repeat this line probably have in their heads, even if they've never spelled it out.

  Oh, and please write your answer in British English — I know, ironic given my uncle, but Katharina asked.
