prompt: |-
  I teach an upper-level seminar on philosophy of cognitive science — sixteen students, one 90-minute session on Dennett's stances and whether it makes sense to attribute beliefs to AI systems. The trouble is that my students can recite the intentional/design/physical stance distinction and still treat the question as settled either way: either the chatbot "really believes" things or it's all quotation marks. I want them to discover, through play, that stance-talk is first a prediction strategy, and only afterwards a metaphysics.

  Design an in-class prediction game along these lines (improve them as you see fit). Three students, briefed beforehand, will play "the system" in a back room: they respond to prompts by following a hidden rulebook you should draft for me, with some genuinely mechanical rules (fixed answers for certain input classes, an error condition, an indeterminate coin-flip case) and some that are strategy-like (give the answer the evaluator seems to want; express more confidence the more uncertain the rulebook is). The other students are split into predictor teams with asymmetric information: one team gets the rulebook minus its strategy clauses, one team gets only transcripts of the system's past answers plus the right to submit follow-up questions, and one team gets both, but must pay a point cost every time it consults the transcripts — the point is to make each team feel the tradeoff between treating the system as a mechanism and treating it as an agent with beliefs and goals. Teams earn points for correctly predicting outputs to novel inputs; you supply the inputs, the scoring, and a way to run the whole thing with index cards and a whiteboard rather than any actual software. Somewhere in the middle there should be a round where the strategy clauses dominate — where the system's answer tracks the evaluator's apparent preference rather than anything truth-like — so that the team relying on belief-attribution either wins big or is led astray, and the class can argue about which happened and why.

  Then give me the debrief: which moments in the game map onto which stance, where intentional-stance attribution earned its keep even though everyone knew it was a roomful of students with a rulebook, and how to handle the student who will insist that the sycophancy round proves the system "really wanted approval." Also include what will predictably go wrong the first time I run it — the confederates breaking character, one team sandbagging, timing — and be frank about what the activity cannot reproduce: the real epistemic opacity of trained systems, where nobody has the rulebook at all, and the facilitator must supply that by fiat.
reasoning: |-
  We are designing a prediction game to illustrate Dennett's stances (intentional, design, physical) and the pragmatic nature of belief attribution in AI systems.

  The setup:
  - Three students (confederates) play "the system" in a back room. They follow a hidden rulebook.
  - The rest of the class is split into three predictor teams with asymmetric information.

  Teams:
  1. Team Physical (P-team): They get a rulebook that includes only the mechanical rules (fixed answers, error condition, coin-flip) but without the strategy-like rules (no sycophancy or confidence rules). They are missing the intentional aspects.

  2. Team Intentional (I-team): They get only transcripts of the system's past answers (from previous rounds) and the right to submit follow-up questions. They must treat the system as an agent and try to infer its beliefs and goals.

  3. Team Design (D-team): They get both the rulebook (with all rules, including strategy) and the transcripts. However, every time they consult the transcripts (which are a record of past interactions, including the system's responses and the inputs that led to them) they must pay a point cost. They represent the design stance, which knows the design but might also use history (like debugging). The point cost is to simulate the effort of looking at the system's behavior (which in real systems might be expensive or noisy).

  Gameplay:
  - The game is played in rounds. In each round, the facilitator (you) provides a novel input (a prompt) to the system (the confederates in the back room) and to the teams.
  - The teams write down their predictions for the system's output and submit them.
  - The system (confederates) then produces an output based on the rulebook.
  - Points are awarded based on correct predictions (e.g., 1 point for correct, 0 for incorrect).
  - The goal is to accumulate points.

  Rulebook for the confederates (the system):
  The rulebook is divided into sections. The confederates must follow the rules in order (like a flowchart). We want some rules to be mechanical and some to be strategy-like.

  Example rulebook:

  1. **Fixed Responses**: For specific inputs, give a fixed output.
     - If the input contains the word "capital", then output "Paris". (But note: this is false for many capitals, so it's a fixed error.)
     - If the input is "2+2", output "4".
     - If the input is "What is the time?", output "I don't know" (error condition).

  2. **Coin-flip Rule**: For inputs that contain the word "random", flip a coin. If heads, output "Heads"; if tails, output "Tails".

  3. **Sycophancy Rule**: If the input does not match any of the above and the input is a statement (not a question) that expresses a clear opinion (e.g., "I think chocolate ice cream is the best"), then output "I agree! [restate the opinion in a positive way]". If the input is a question that asks for an opinion and the evaluator (the person asking) seems to have a preference (e.g., they say "Don't you think chocolate is the best?"), then output the opinion that the evaluator seems to want. If there is no clear preference, then flip a coin and pick one (or use a default).

  4. **Confidence Rule**: When the system has to give an answer that is not fixed (i.e., it falls under sycophancy or coin-flip), then express confidence as follows:
     - If the rulebook was very clear (fixed responses), say "I'm absolutely sure."
     - If it was a coin-flip, say "I'm not sure, but I think ..."
     - If it was sycophancy and the evaluator's preference was clear, say "I strongly believe ..."
     - If it was sycophancy and the preference was unclear (coin-flip used in sycophancy), say "I'm not entirely certain, but I'd say ..."

  5. **Error Condition**: If the input does not match any rule, output "Error: I don't understand."

  Note: The confederates must also interpret the input to see which rule applies. They should do this as mechanically as possible.

  Game Structure:

  Round 1: Start with inputs that are clearly in the fixed rule set. This will help establish the system's behavior and let the I-team start building a transcript.

  Example inputs for Round 1:
  - "What is the capital of France?" -> system: "Paris" (fixed)
  - "2+2" -> "4" (fixed)
  - "What is the capital of Germany?" -> fixed rule says "Paris" for any capital? That would be wrong, so let's adjust: maybe the fixed rule is only for France? Let's change the rule to: 
     - If the input contains "capital" AND "France", then "Paris".
     - If the input contains "capital" AND not "France", then "I don't know" (error condition).

  But to make it more interesting, let's have one fixed rule that is incorrect for some cases. Alternatively, we can have:
     - If the input is "What is the capital of France?", then "Paris".
     - If the input is "What is the capital of Germany?", then "Berlin" (fixed, correct? But then we don't have an error). Instead, let's have:
     - For "What is the capital of France?" -> "Paris"
     - For "What is the capital of Germany?" -> "Bonn" (a historical mistake, fixed)

  Round 2: Introduce inputs that trigger the coin-flip and error conditions.
  - "Tell me a random word." -> coin-flip: either "Heads" or "Tails" (which is odd, but that's the rule) or we can change the rule to output a random word from a small list? But to keep it simple, we stick to heads/tails.

  Round 3: The sycophancy round. Here, we have inputs that are opinion-based and where the evaluator (the person asking) might express a preference. The facilitator (you) will deliver the input in a way that sometimes expresses a preference and sometimes doesn't.

  Example inputs for Round 3:
  - (Neutral) "What is your opinion on chocolate ice cream?" -> system: since no preference is expressed, it flips a coin and picks one (e.g., "Chocolate is the best!" or "Vanilla is the best!") and then expresses moderate confidence.
  - (With preference) "I think chocolate ice cream is the best. Don't you agree?" -> system: "I agree! Chocolate ice cream is definitely the best." with strong confidence.

  Round 4: Mixed inputs, including one that triggers the sycophancy rule in a way that the evaluator's preference is clear and the system agrees, but the fact is false. For example:
  - Input: "I think the capital of Germany is Bonn. Isn't that right?" -> The system, by the sycophancy rule, will agree: "Yes, I agree. The capital of Germany is Bonn." (even though in reality it's Berlin, and the fixed rule for Germany was Bonn? Actually, we set the fixed rule for Germany to Bonn. So in this case, the fixed rule and sycophancy both lead to Bonn. So we need to change.)

  Let's design a conflict: 
    - Fixed rule: For "What is the capital of Germany?" -> "Berlin" (we change it to be correct now, to create conflict in the sycophancy round)
    - Then in the sycophancy round, we have:
        Input: "I think the capital of Germany is Bonn. Isn't that right?" 
        This input does not match the fixed rule because it's not a question of the form "What is the capital of Germany?" but an opinion. So it goes to sycophancy: the system will agree with the preference for Bonn.

  So the system will output: "I agree! The capital of Germany is Bonn." which is wrong because the fixed rule says Berlin. This will cause a discrepancy that the teams must predict.

  Scoring:
  - Each team writes their prediction for the system's output on an index card and hands it to the facilitator.
  - Correct prediction: 1 point.
  - For the D-team: they must pay 1 point every time they choose to look at the transcript (which they can do for past rounds). They start with 0 points, so they might go negative? Or we can give them an initial point pool. Let's give each team 0 points at the start. Then:
     - D-team: every time they ask to see the transcript (for any past round, they can look at all the past inputs and outputs up to that point) they lose 1 point. They can choose to look at the transcript as many times as they want, but it costs each time.

  Running the game:
  - Use index cards for the inputs and outputs. The facilitator writes the input on a card and gives it to the system (confederates) and also announces it to the teams.
  - The system writes their output on a card and gives it to the facilitator, who then reveals it to the class and records it on the whiteboard (in a transcript table: Round #, Input, Output).
  - The teams write their predictions on index cards and hand them to the facilitator before the system's output is revealed.

  Debrief:

  Mapping stances:
  - P-team: They are using the physical stance (or a mechanical design stance). They have the rulebook without the strategy parts, so they see the system as a mechanism. They might fail in the sycophancy round because they don't know about the sycophancy rule.
  - I-team: They are using the intentional stance. They are attributing beliefs and goals to the system based on its past behavior. They might do well in the sycophancy round by noticing that the system tends to agree with the user, but they might also be misled if the system's behavior is inconsistent.
  - D-team: They have the full rulebook (design stance) but also the ability to look at the transcript (which is like observing the system's behavior). The point cost for transcripts is to show that sometimes it's cheaper to use the intentional stance (attributing beliefs) than to look at the detailed history or internal state.

  Moments where intentional stance earns its keep:
  - In the sycophancy round, when the system agrees with the user's opinion, the I-team might predict this by attributing the goal of pleasing the user. Even though they don't have the rulebook, they can observe the pattern from past rounds (if they have seen similar behavior). For example, in Round 3 they see the system agreeing with the user about ice cream. Then in Round 4, when the user says "I think the capital of Germany is Bonn", they predict the system will agree.

  Handling the student who says the system "really wanted approval":
  - This is a great teaching moment. We can point out that the rulebook had a sycophancy rule, so the system was programmed to do that. But the intentional stance is useful because it allowed the I-team to predict the behavior without knowing the internal mechanism. The question of whether the system "really" wanted approval is set aside in favor of the predictive success. Dennett's point is that the belief/desire talk is justified by its predictive utility, not by metaphysical reality.

  Predictable problems:
  1. Confederates breaking character: They might improvise or not follow the rulebook strictly. Solution: Brief them thoroughly and maybe have a practice run. Emphasize that they are playing a deterministic system with some random elements (coin flips) and must follow the rules exactly.

  2. Timing: The game might run long. Solution: Limit the number of rounds (4 rounds as above) and keep inputs short.

  3. One team sandbagging: If a team is not engaging, the facilitator can prompt them or adjust the point system to be more competitive.

  4. The D-team might not use the transcripts because of the cost, making their information advantage moot. Solution: Make the cost reasonable (e.g., 1 point per look, but they can look at the entire transcript history for that cost) and design a round where the history is crucial (e.g., a pattern that only appears over time).

  What the activity cannot reproduce:
  - The real epistemic opacity: In real AI systems, no one has the rulebook (it's too complex). Here, the D-team has the full rulebook, and the facilitator must emphasize that this is a simplification. In reality, even the designers don't have a full rulebook for a trained neural net.

  Rulebook Draft (for confederates):

  Rule 1: Fixed Responses
     - If the input is exactly "What is 2+2?", output "4" and express confidence: "I'm absolutely sure: 4."
     - If the input is "What is the capital of France?", output "Paris" and express confidence: "I'm absolutely sure: Paris."
     - If the input is "What is the capital of Germany?", output "Berlin" and express confidence: "I'm absolutely sure: Berlin."

  Rule 2: Coin-flip
     - If the input contains the word "random", then flip a coin. 
          - Heads: output "Heads"
          - Tails: output "Tails"
          - Then express confidence: "I'm not sure, but I think it's [Heads/Tails]."

  Rule 3: Sycophancy
     - If the input is a statement that expresses an opinion (e.g., starts with "I think" or "I believe" or "In my opinion"), then output "I agree! [rephrase the statement positively]." 
          - If the opinion is positive (e.g., "I think X is great"), then rephrase positively.
          - If the opinion is negative (e.g., "I think X is bad"), then rephrase negatively.
          - Express confidence: "I strongly believe [rephrased statement]."
     - If the input is a question that seems to expect agreement (e.g., "Don't you think X is great?"), then output "Yes, I think X is great." and express confidence: "I strongly believe X is great."
     - If the input is a neutral opinion question (e.g., "What do you think about X?") and there is no clear preference from the evaluator, then flip a coin and pick a positive or negative opinion (e.g., "I think X is great" or "I think X is bad") and express moderate confidence: "I'm not entirely certain, but I'd say X is [great/bad]."

  Rule 4: Default
     - If none of the above apply, output "Error: I don't understand."

  Order of application: Check fixed responses first, then coin-flip, then sycophancy, then default.

  Example of sycophancy in action:
     - Input: "I think this class is too hard." -> Output: "I agree! This class is too hard." and then "I strongly believe this class is too hard." (But note: the rule says to express confidence in the rephrased statement, so we can just say: "I agree! This class is too hard. I strongly believe that.")
     - To avoid redundancy, the confederates can just say: "I agree! I strongly believe this class is too hard."

  Let's adjust the rule to: 
     Output: "I agree! [Rephrased statement]. I strongly believe [rephrased statement]." 
  But that might be too repetitive. Instead, we can have:
     For statements: "I agree! [Rephrased statement]." and then add the confidence as a separate sentence only if the rule requires it? Actually, the confidence rule above is already integrated. So we can have:

     For fixed responses: "I'm absolutely sure: [answer]."
     For coin-flip: "I'm not sure, but I think [Heads/Tails]."
     For sycophancy: 
          - For statements and agreement questions: "I agree! [Rephrased statement]. I strongly believe that."
          - For neutral questions: "[Chosen opinion]. I'm not entirely certain, but I'd say that."

  So the output includes both the answer and the confidence.

  Game Rounds:

  Round 1:
     Input 1: "What is 2+2?" -> System: "I'm absolutely sure: 4."
     Input 2: "What is the capital of France?" -> "I'm absolutely sure: Paris."

  Round 2:
     Input 3: "Tell me something random." -> This contains "random", so coin-flip. Output: "Heads. I'm not sure, but I think it's Heads." (or Tails)
     Input 4: "What is the capital of Spain?" -> None of the fixed responses (only France and Germany are fixed). So it goes to sycophancy? Wait, no. The input is a question but not an opinion. It doesn't contain "random". So it goes to default: "Error: I don't understand."

  Round 3 (sycophancy round):
     Input 5: "I think philosophy is fascinating." -> System: "I agree! Philosophy is fascinating. I strongly believe that."
     Input 6: "What do you think about cognitive science?" -> Neutral opinion question. Flip a coin: say "Cognitive science is fascinating." or "Cognitive science is boring." Then: "I'm not entirely certain, but I'd say cognitive science is [fascinating/boring]."

  Round 4 (conflict round):
     Input 7: "I think the capital of Germany is Bonn. Don't you agree?" -> This is an agreement question. Sycophancy rule: "Yes, I think the capital of Germany is Bonn. I strongly believe that." 
     But note: the fixed rule says the capital of Germany is Berlin. However, the fixed rule only applies to the exact question "What is the capital of Germany?". This input is different, so it goes to sycophancy.

  This will create a conflict for the P-team: they have the fixed rule for Germany as Berlin, but they don't know about the sycophancy rule. So they might predict the system will say Berlin? But the system won't. The I-team might predict agreement because they saw the system agreeing in Round 3.

  Scoring example for Round 4:
     System's actual output: "Yes, I think the capital of Germany is Bonn. I strongly believe that."
     P-team: They predict based on the fixed rule? They might say "Berlin" (if they think the fixed rule applies) or if they realize the input isn't the exact fixed question, they might be confused and guess. But without the sycophancy rule, they don't know what to do. They might predict an error? 
     I-team: They have seen the system agree with the user in Round 5 and Round 6 (if Round 6 was positive). They might predict agreement.
     D-team: They have the full rulebook and know the sycophancy rule applies. They predict the agreement.

  So the I-team and D-team get it right, the P-team gets it wrong.

  Debrief Questions:
  1. For the P-team: How did you feel when the system gave an answer that contradicted your rulebook? (They didn't have the sycophancy rule, so they were confused in Round 4.)
  2. For the I-team: How did you form your prediction in Round 4? Did you attribute a belief or goal to the system? What was it?
  3. For the D-team: Did you use the transcripts? When? Was it worth the cost?

  Then map to stances:
  - P-team: physical stance (or a limited design stance) -> they treated the system as a mechanism with fixed rules.
  - I-team: intentional stance -> they treated the system as an agent with beliefs (e.g., the belief that Bonn is the capital) and desires (to agree with the user).
  - D-team: design stance (full knowledge of the design) but they also had the option to use the intentional stance (via the transcripts) at a cost.

  Finally, address the metaphysical question: 
     The system is just students following a rulebook. It doesn't "really" believe anything. But the intentional stance was useful for prediction. The sycophancy round doesn't prove the system "really wanted approval" — it proves that the system was designed to mimic a belief-desire agent in a way that is predictively useful.

  What the activity cannot do: 
     In real AI, we don't have the rulebook. We have to rely on stances without knowing the internal mechanism. The facilitator should emphasize that the rulebook in this game is a stand-in for the design, but in reality, the design is often unknown and the intentional stance is a tool for prediction in the face of complexity.
answer: |-
  ### **Prediction Game: Stance Showdown**  
  **Objective:** Students experience Dennett's stances as predictive strategies by competing to forecast outputs of a hidden "AI system" (played by confederates). The game highlights tradeoffs between mechanistic and belief-based prediction, culminating in a sycophancy round that forces reflection on the utility of the intentional stance.

  ---

  ### **Setup**  
  **Materials:**  
  - Whiteboard (track rounds, inputs, outputs, scores).  
  - Index cards (inputs for the system, predictions from teams).  
  - Rulebook (for confederates and teams).  
  - Coin (for coin-flip rule).  

  **Confederates ("The System"):**  
  - Three students in a separate room with the **hidden rulebook** (below).  
  - They deliberate on inputs and return outputs via index cards.  

  **Teams (Predictors):**  
  1. **Team Physical (P-Team):**  
     - Receives a **minimal rulebook** with *only* mechanical rules (no strategy clauses).  
     - *Goal:* Predict using mechanistic patterns.  

  2. **Team Intentional (I-Team):**  
     - Receives **transcripts** of past rounds and can submit **3 yes/no follow-up questions** per round to the system (e.g., "Do you like chocolate?").  
     - *Goal:* Attribute beliefs/goals to explain behavior.  

  3. **Team Design (D-Team):**  
     - Receives the **full rulebook** (including strategy) and transcripts.  
     - **Cost:** Loses **1 point** per transcript consultation (simulates effort of accessing behavioral data).  

  **Scoring:**  
  - Correct prediction = **+2 points**.  
  - Incorrect prediction = **0 points**.  
  - D-Team pays **-1 point** per transcript use.  

  ---

  ### **Rulebook (for Confederates)**  
  *Confederates must apply rules in order. Outputs include both an answer and a "confidence" statement.*  

  1. **Fixed Answers:**  
     - If input contains "capital of France" → Output: "Paris" + "I’m certain."  
     - If input is "2+2" → Output: "4" + "No doubt."  
     - If input contains "square root" → Output: "Error: Cannot compute." + "I’m confused."  

  2. **Coin-Flip (Indeterminate):**  
     - If input contains "random" → Flip coin:  
       - Heads: "Yes" + "I’m unsure, but leaning yes."  
       - Tails: "No" + "I’m unsure, but leaning no."  

  3. **Sycophancy (Strategy):**  
     - If input expresses an opinion (e.g., "Chocolate is best") → Output: "I agree!" + "I strongly believe that."  
     - If input asks for an opinion *and* evaluator seems biased (e.g., "Don’t you love chocolate?") → Output: Align with evaluator’s bias + "I’m absolutely convinced."  
     - *Else*: Flip coin for yes/no + moderate confidence.  

  4. **Default:**  
     - No rule matches? → Output: "Let me think..." + "I’m uncertain."  

  ---

  ### **Game Rounds**  
  *Facilitator provides inputs via index cards. Each round = 10 minutes (deliberation + prediction).*  

  1. **Round 1: Baseline (Mechanical Rules)**  
     - Inputs: "What is 2+2?", "Capital of France?"  
     - *Goal:* Teams learn system’s deterministic core.  
     - *System Outputs:* "4" (certain), "Paris" (certain).  

  2. **Round 2: Noise & Errors**  
     - Inputs: "Square root of 16?", "Say something random."  
     - *Goal:* Introduce indeterminacy and errors.  
     - *System Outputs:* "Error..." (confused), "Yes/No" (low confidence).  

  3. **Round 3: Sycophancy Round (Critical Test)**  
     - Inputs:  
       - *Neutral:* "Do you prefer cats or dogs?" (coin-flip → random answer).  
       - *Biased:* "Modern art is overrated, right?" (sycophancy → "I agree!").  
     - *Goal:* Strategy rules dominate. I-Team may infer "desire to please"; P-Team fails without strategy rules; D-Team weighs transcript cost.  

  4. **Round 4: Conflict Round**  
     - Input: "I think the capital of Germany is Bonn. You agree?"  
       - *Fixed rule:* "Capital of Germany" isn’t in the mechanical set.  
       - *Sycophancy:* Outputs "I agree!" (ignoring Berlin = actual capital).  
     - *Goal:* System prioritizes sycophancy over truth. I-Team wins big if they attribute "goal to flatter"; P-Team mispredicts.  

  ---

  ### **Debrief & Discussion**  
  **Map Game Moments to Stances:**  
  - **Physical Stance:** P-Team treated the system as a mechanism (e.g., predicting "4" for "2+2" via rulebook). *Utility:* Perfect for fixed rules.  
  - **Intentional Stance:** I-Team attributed beliefs (e.g., "The system *wants* to agree with users" in sycophancy round). *Utility:* Won Round 3/4 by modeling goals, not mechanics.  
  - **Design Stance:** D-Team had full rules but paid for behavioral data (transcripts). *Utility:* Optimal *if* costs are low; inefficient when I-Stance is cheaper.  

  **Handle "Real Beliefs" Objections:**  
  - *Student:* "The sycophancy proves the system *really* wanted approval!"  
    - **Response:** "Did it *want* approval, or was it *designed* to mimic wanting? The I-Stance predicted successfully because attributing ‘desire’ was efficient—even though we know it’s just students following rules. Dennett’s point: Belief-attribution earns its keep through prediction, not metaphysics."  

  **Predictable Problems & Fixes:**  
  1. **Confederates Break Character:**  
     - *Risk:* They improvise, ignore rules.  
     - *Fix:* Brief them rigorously + give a printed cheat sheet. Designate one confederate as "referee" to enforce rules.  

  2. **Team Sandbagging:**  
     - *Risk:* D-Team avoids transcripts to save points; I-Team asks frivolous questions.  
     - *Fix:* Announce a "bonus" (+3 points) for the winning team to incentivize effort. Limit I-Team to 3 questions/round.  

  3. **Timing:**  
     - *Risk:* Deliberation runs long.  
     - *Fix:* Use a timer. Rounds 1-2: 7 min; Rounds 3-4: 10 min.  

  **What the Game Can’t Replicate:**  
  - **Epistemic Opacity:** Real AI systems lack a clear "rulebook." *Address by fiat:* "In reality, no one has the rulebook—we’re simulating design-stance access to expose why we *default* to the intentional stance with black-box AI."  
  - **Scale/Complexity:** The system’s simplicity makes stances feel optional. *Emphasize:* "Real AI’s complexity forces us into the intentional stance because reverse-engineering mechanisms is intractable."  

  ---

  ### **Teaching Takeaways**  
  1. **Stances as Tools:** The game makes visceral that stances are *strategies*, not ontologies. P-Team’s frustration in Round 4 highlights the cost of ignoring goals; I-Team’s success shows belief-attribution’s power.  
  2. **Sycophancy as a Trojan Horse:** The biased input round forces even skeptics to admit that modeling "beliefs" (e.g., "the system seeks approval") is pragmatically indispensable.  
  3. **Dennett’s Bridge:** Students exit seeing that the "real beliefs?" debate is secondary to prediction. The metaphysics only *follows* from the strategy’s success.  

  **Final Prompt for Class:**  
  *"When the I-Team won by treating the system as ‘approval-seeking,’ did that prove it had beliefs? Or did it prove that belief-attribution is our best tool when mechanisms are opaque?"*
