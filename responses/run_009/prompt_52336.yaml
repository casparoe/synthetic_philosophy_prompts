prompt: |-
  I'm a PhD student in philosophy of history, and I've been testing a hypothesis that sits awkwardly between the two camps of the old covering-law dispute. It goes like this: a large share of the historical explanations that get cited as refutations of Hempel's covering-law model fail only because the model was never handed the right question. Historians rarely explain why something happened simpliciter; they explain why this rather than that — why the July 1914 crisis escalated when the earlier Moroccan crises didn't, why enclosure took hold in some regions and not others. If explanation is contrastive in roughly the way Bas van Fraassen proposed for explanation in general, then once the contrast class is made explicit, many of these explanations may reconstruct faithfully as covering-law explanations with ceteris paribus, probabilistic laws; the apparent refutations become artifacts of posing a non-contrastive question to a contrastive explanation.

  My credence that this is substantially right — that for a clear majority of paradigm narrative explanations in mainstream historiography, a faithful contrastive covering-law reconstruction exists — is about 0.35. My supervisor, a Dray-style particularist, puts it nearer 0.10.

  Please give me your own number, decomposed. I'd want at least these terms: the probability that something like a covering-law requirement on explanation is correct at all (as against purely causal-mechanical or pragmatic accounts, on which any covering-law reconstruction is at best a shadow cast by an underlying causal story); the probability that explanation is thoroughly contrastive; and the probability that, given both, usable ceteris paribus generalizations exist for historical subject matter at the right grain. Add any further terms you think belong. Give each a number with a one-line justification, then the combination. After that, tell me which term does the most work in your final number, where the disagreement between my 0.35 and my supervisor's 0.10 most likely lives — in the metaphysics of laws, in contrastivism, or in the grain of the generalizations — and what kind of case would move your number most. As a candidate: do canonical narratives such as the standard account of why the Industrial Revolution happened in Britain resist reconstruction not because the question was non-contrastive, but because what they convey is an emplotment that no structure of premises and generalizations can carry?

  Please state your final answer in machine-readable form on a single line at the very end: \answer{...}, enclosing just your credence as a two-decimal number between 0 and 1.
