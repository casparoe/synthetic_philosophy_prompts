prompt: |-
  Me and a friend argued til like 2am about Brexit and I'm still chewing on it. Her claim was that the whole 2016–2019 saga is basically a case study in the populist conception of the will of the people: one people, one voice, a 52–48 split gets converted into a single unified mandate, and anyone who gets in the way -- the judges in the Miller case (and the tabloid that branded them enemies of the people), MPs blocking no-deal, the people marching for a second vote -- gets recast as an elite frustrating the popular will rather than part of the demos. I kept pushing back that this is just what referendums do, majoritarian politics, not populism per se. So: analyze Brexit through the lens of the will of the people. Who was supposed to count as the people, what the theory says each actor was doing, and which parts of what actually happened it genuinely explains. But also be honest about where it breaks -- e.g. the 2019 election produced a landslide for get Brexit done with a different coalition than the 52% (loads of Leave-Labour seats flipping, etc.), so was that the same will of the people or a different one, and can the theory even tell? And tell me if the theory ends up explaining too much, where literally any outcome counts as the will of the people surfacing or being blocked.
reasoning: |-
  Okay, the user and their friend had a late-night debate about Brexit, specifically whether the 2016-2019 events illustrate the populist concept of "the will of the people." The user's friend argued that Brexit turned a narrow 52-48 vote into a unified mandate, labeling opponents as elites obstructing this will. The user countered that this is just majoritarian politics inherent in referendums, not necessarily populism. Now, they want an analysis of Brexit through this lens, examining who "the people" are, each actor's role, where the theory holds, and where it breaks—like the 2019 election landslide with a different coalition. Also, they're concerned if the theory is too flexible, making any outcome fit the narrative.

  First, I need to break down the populist conception of the will of the people. Populism typically views "the people" as a homogeneous, virtuous group against a corrupt elite. The will is singular and unchanging, so a simple majority becomes a mandate for the entire populace. In Brexit, the Leave campaign framed the EU as an elite project, and the 52% vote was treated as the entire people's will. Post-referendum, figures like Boris Johnson and media outlets like The Daily Mail portrayed judges, MPs blocking no-deal, and protesters as elites frustrating this will. This fits the populist playbook: dichotomous rhetoric, delegitimizing dissent.

  But the user's point about referendums being majoritarian is valid. Referendums by design create binary choices and majority rule. However, populism adds layers: moralizing the majority's view as the only legitimate one and demonizing opposition. The key difference is the populist narrative's moral dimension and anti-pluralism. Brexit's aftermath saw constant invocations of "the people's will" to override procedural checks, which goes beyond simple majoritarianism.

  Now, who counts as "the people"? In populist rhetoric, it's often the "real" people—those who voted Leave, depicted as ordinary Brits versus metropolitan elites. This exclusionary definition sidelines the 48% Remain voters, ethnic minorities, younger voters, etc. The theory explains the Leave side's rhetoric and media attacks but ignores the complexity of public opinion shifting over time, like later polls showing regret or desire for a second referendum.

  The 2019 election is a critical test. Johnson's "Get Brexit Done" won a landslide, but with different voter coalitions—many Labour Leave seats flipped. Populist theory might claim this as the people reaffirming their will. However, this was a general election with multiple issues, not a referendum. The mandate was ambiguous: was it for Brexit at any cost, or just ending the paralysis? The theory struggles here because it can retroactively claim any victory as the people's will, making it unfalsifiable.

  Another weakness is the theory's flexibility. If Brexit had been reversed, populists could argue the elite blocked the people's will, but when it succeeded, it was the people prevailing. This circularity makes the theory explain everything and nothing. Real-world complexities—like regional divides, the Good Friday Agreement, or economic concerns—are oversimplified in the populist narrative.

  The user might also be grappling with deeper questions: how democratic processes handle narrow majorities, the role of institutions in checking populism, and whether populist rhetoric undermines pluralistic democracy. They might want validation that their skepticism about populism's explanatory power is justified, while understanding where it does apply. Highlighting the tension between majoritarian tools and populist narratives can address their need for a nuanced analysis that doesn't oversimplify Brexit's chaotic reality.
answer: |-
  Here's a breakdown of the "will of the people" lens applied to Brexit, analyzing its explanatory power and its critical weaknesses:

  **Core Tenets of the Populist "Will of the People" (WotP) Concept in Brexit:**

  1.  **Homogeneous "People":** The "people" is conceived as a singular, virtuous entity with a unified interest, distinct from a corrupt or self-serving "elite." In Brexit, this often meant:
      *   **Inclusively (Rhetorically):** "The British people" as a whole sovereign.
      *   **Exclusively (Operationally):** Primarily those who voted Leave, characterized as the "real" or "ordinary" people (often contrasted with metropolitan elites, "citizens of nowhere," Remain-voting Scotland/N.I., younger voters).
  2.  **Singular, Discernible Will:** The 2016 referendum result (52% Leave) wasn't seen as a narrow, contingent decision on a complex issue, but as the unambiguous, sovereign expression of the *single* true will of this homogeneous people. This will was treated as:
      *   **Clear:** "Leave means Leave."
      *   **Enduring:** Unchanging despite shifting polls or time passing.
      *   **Moral:** Representing the virtuous majority against corrupt elites.
  3.  **Mandate for Action:** The narrow majority was converted into an overwhelming mandate for a specific outcome (Leaving the EU) and often a specific *method* (a "clean break" or No-Deal), irrespective of the referendum question's lack of detail.
  4.  **Anti-Pluralist:** Opposition, scrutiny, or attempts to shape the outcome differently (beyond simply implementing the "clear" will) were framed not as legitimate democratic participation, but as:
      *   **Elite Sabotage:** Judges ("Enemies of the People"), MPs scrutinizing deals or blocking No-Deal ("Saboteurs," "Surrender Act"), civil servants ("Deep State").
      *   **Betrayal of Democracy:** Calls for a second referendum ("The People's Vote") were dismissed as elite attempts to overturn the "first" verdict, not as a potential evolution of democratic consent.

  **Where the WotP Lens Explains Events (2016-2019):**

  1.  **Leave Campaign Rhetoric:** The core campaign ("Take Back Control," "Unshackle Ourselves") perfectly fit the populist WotP script, pitting the virtuous people against the undemocratic EU elite and their "collaborators" in Westminster.
  2.  **Post-Referendum Simplification:** The immediate interpretation of the result as a singular, unambiguous mandate ("The British people have spoken!") ignored the complexity and narrowness of the vote, exemplifying the WotP conversion of a narrow majority into a unified command.
  3.  **"Enemies of the People" Headline:** This is *the* textbook example of WotP logic. The High Court ruling (Miller I) that Parliament must trigger Article 50 was framed as unelected elites obstructing the sovereign people's will, delegitimizing an independent judiciary.
  4.  **Framing Parliamentary Scrutiny:** MPs seeking to avoid No-Deal or secure a softer Brexit were consistently labeled "traitors" or "saboteurs" by prominent Leavers and sections of the press. Theresa May's struggles were often framed as the "Remainer elite" in Parliament frustrating the people's will, rather than representing diverse constituencies (including many Leave-voting areas concerned about economic damage).
  5.  **Opposition to a Second Referendum:** The primary argument against it wasn't just practicality, but the fundamental WotP assertion: "The people have spoken. Asking again is undemocratic elitism trying to overturn the sacred verdict." This framed Remain campaigners and marchers not as part of "the people" exercising democratic rights, but as an elite mob trying to subvert democracy.
  6.  **Johnson's 2019 Strategy:** "Get Brexit Done" brilliantly weaponized the WotP narrative. Years of paralysis were framed *entirely* as the result of an obstructive elite (Parliament, judges) frustrating the clear will of 2016. His campaign promised to finally enact the people's will, sweeping aside obstacles.

  **Where the WotP Lens Breaks Down and Fails:**

  1.  **The 2019 Election Mandate:** This is the critical flaw.
      *   **Different Coalition:** Johnson won by flipping traditional Labour heartlands (the "Red Wall") that voted Leave in 2016. The 2016 coalition included many Conservative Remainers who stayed home or voted tactically in 2019, while the 2019 coalition included lifelong Labour voters. *It was a different electoral expression with different people.*
      *   **Ambiguous Mandate:** "Get Brexit Done" was a potent slogan, but was it a mandate for Johnson's specific *deal* (which many Leave campaigners had previously criticized), or simply a mandate to *end the paralysis*? The WotP lens struggles to distinguish. It simply claims *any* victory for the populist side as proof of the enduring will.
      *   **Other Issues:** The 2019 result was influenced by Corbyn's unpopularity, domestic issues, and fatigue, not *solely* Brexit. The WotP lens ignores this complexity, reducing everything to Brexit = the people's will.
  2.  **The Heterogeneity of "The People":**
      *   **The 48%:** Were they not part of "the people"? The WotP lens inherently marginalizes minorities within the demos. Their ongoing dissent, marches, and changing opinions (some Leavers regretted, some Remainers accepted) contradict the idea of a singular, unchanging will.
      *   **Scotland & Northern Ireland:** Overwhelmingly voted Remain. The WotP lens (focused on the UK-wide majority) dismisses their distinct democratic expressions as irrelevant or subordinate to the "true" British will, fueling nationalist sentiment. The Good Friday Agreement complexities were often brushed aside as "elite obstruction."
      *   **Demographic Shifts:** Younger voters (more pro-EU) entering the electorate vs. older voters (more pro-Leave) leaving it inherently challenges the idea of a static "will." Populism ignores this dynamism.
  3.  **Lack of Specificity in the Mandate:** The 2016 referendum asked a binary question on principle, not a complex policy choice (Customs Union, Single Market, etc.). The WotP lens provided *no mechanism* for discerning the people's will on these specifics. Leavers claiming *any* form of Brexit (Hard, Soft, Norway, Canada) as the "true" will demonstrated the concept's emptiness on detail. It was weaponized to support whatever version the populist leader advocated at the time.
  4.  **Circularity and Unfalsifiability (Explaining Too Much):** This is the deepest flaw.
      *   **Victory = Will of the People:** Brexit happened? Proof the people's will prevailed! (Ignoring the complex parliamentary maneuvers and election timing).
      *   **Delay/Obstruction = Elite Sabotage:** Parliament blocked No-Deal? Proof elites were frustrating the will! (Ignoring constitutional checks and balances, and the representative mandate of MPs).
      *   **Alternative Outcome?** If Brexit had been stopped or a softer version adopted after a second vote, populists would *still* use the WotP lens: "The elite *finally* succeeded in overturning the people's sacred 2016 will!" The theory can explain any outcome: victory proves the people's will is strong; defeat or compromise proves the elites were too powerful. This makes it analytically weak – it describes a rhetorical strategy, not a predictive or truly explanatory model of democratic outcomes.
      *   **Ignores Material Factors:** The lens completely disregards the role of misinformation (bus), Russian interference, complex economic realities, or the practical impossibility of delivering some versions of Brexit without severe consequences. Everything is reduced to a moral battle between the pure people and the corrupt elite.

  **Conclusion:**

  Your friend is **largely correct** that the *rhetoric, strategy, and framing* of the dominant Leave faction (especially post-referendum) perfectly embodied the **populist conception of the "will of the people."** It explains the *language* used ("Take Back Control," "Enemies of the People," "Saboteurs," "Betrayal"), the *targeting* of institutions (Courts, Parliament), and the *dismissal* of dissent (marches, calls for a second vote) as illegitimate elite obstruction rather than part of democratic contestation.

  However, **your instinct is also crucial.** The WotP lens is a potent *political weapon*, not an accurate description of reality or a robust democratic theory. It **breaks down catastrophically** when confronted with:

  1.  **The 2019 Election:** Revealing a different coalition and an ambiguous mandate that the theory cannot coherently reconcile with 2016.
  2.  **The Heterogeneity of the Demos:** The theory cannot account for the 48%, devolved nations, or changing opinions without excluding them from "the people."
  3.  **Lack of Policy Specificity:** It provides no real guidance on *how* to leave, only a blunt instrument to attack dissent.
  4.  **Unfalsifiability:** Its ability to explain any outcome renders it analytically hollow. It's a tool for mobilization and delegitimization, not for understanding complex democratic processes.

  **In essence:** Brexit *was* a masterclass in *applying* the populist "will of the people" concept as a political strategy to frame events, demonize opponents, and drive a specific agenda. However, the *actual events* – the shifting coalitions, the parliamentary struggles, the regional divides, the ambiguity of the mandate – expose the concept as a dangerous oversimplification that fails to capture the messy reality of democracy and becomes a tool for authoritarian majoritarianism when taken literally. The theory explains the *rhetoric* brilliantly, but explains the *outcome* and the *complexity* very poorly, precisely because it dismisses that complexity as illegitimate. Your late-night debate perfectly captures the tension between populist narrative and democratic reality.
