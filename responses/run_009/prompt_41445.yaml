answer: |-
  ## After the Argument on Epiphenomenalism

  The streetlights stain the pavement **red**,
  Her logic pulses through my tired **brain**:
  "If every thought's an engine's **firing**,
  Then why," I ask, "this stubborn **ache**?"
  The night wind sighs against the **hush**,
  Recalling every sharp **report**.

  She framed it with a cool **report**:
  "Experience, though keen as **red**,
  Arises from the circuit's **hush**,
  A dance inside the living **brain**,
  But causes nothing – not this **ache**,
  Not even words sparked by **firing**."

  What of my zombie twin's **report**?
  Identical in every **firing**,
  Same history, same claim of **ache**,
  Same tongue describing sunset's **red**,
  The same wet clockwork of the **brain**,
  And deep behind, a vacant **hush**.

  Is that mere silence – true mind's **hush**?
  The evidence is just **report**,
  The wet machine we call the **brain**,
  The measured sparks of neural **firing**.
  What is **red** without the *red*?
  What proof resides within the **ache**?

  No signal proves the raw **ache**.
  Science traces only **hush**,
  Or wavelengths labelled "**red**",
  The vocal cords that make **report**,
  The chain of cause: synaptic **firing**
  That built the structure of my **brain**.

  This knowing meat, the humming **brain**,
  Insists it feels the sharp **ache**,
  Explains the impulse for **report**
  As just more blind electric **firing**,
  While something flares – not just the **red**,
  But *knowing* it, within the **hush**.

  My **brain** insists on its **report**.
  The **firing** patterns hold the **ache**,
  The **red**, the **hush** – unchanged, uncaught.

  ---

  **Notes on the Execution:**

  1.  **End-Word Families:** Physical (`brain`, `firing`, `report`) / Phenomenal (`ache`, `red`, `hush`).
  2.  **The Feeling (`ache`) as Passive Epiphenomenon:** Notice `ache` appears as the required end-word in every stanza (as per sestina structure) but is *never* the subject of an active, causal verb. It is the object ("proves the **ache**", "claim of **ache**", "hold the **ache**"), part of a prepositional phrase ("within the **ache**"? – though syntactically "it" is the object), or described passively ("this stubborn **ache**", "the raw **ache**"). It "remains" (linking verb) and is "unchanged" (description), but never *does* anything. It just *is*, returning predictably like the phenomenal on the epiphenomenalist view.
  3.  **The Zombie Twin:** Explicitly appears in Stanza 3 ("my zombie twin's report... Identical in every firing... deep behind, a vacant hush").
  4.  **The Paradox of Phenomenal Judgment:** Central to the argument. The poem highlights the disconnect between the physical cause (`firing`, `brain`, `report`) and the phenomenal claim (`ache`, `red`), emphasizing the zombie's identical `report` without the `ache`. Lines like "What is **red** without the *red*?" and "What proof resides within the **ache**?" directly address this.
  5.  **Accurate Doctrine:** The poem captures epiphenomenalism: experience (`ache`, `red`, `hush`) arises from the physical (`brain`, `firing`) but causes nothing further, specifically highlighting the problem for `report` (judgment/claim about experience). It avoids claiming this affects knowledge of the external world.
  6.  **The Envoi:** Does not resolve. It states the physical `brain` insists on its `report`, caused by `firing` patterns which also hold the phenomenal items (`ache`, `red`, `hush`). The final line emphasizes their status as causally inert ("unchanged, uncaught"), leaving the speaker's *certainty* of being different from the zombie ("My **brain** insists...") as the very datum the theory must explain but hasn't resolved within the argument.
  7.  **Accessibility:** The imagery (streetlights, wind, machines, silence, pain, color) conveys the feeling of a late-night, unresolved argument and the mystery of subjective experience, independent of philosophical jargon. The core conflict – feeling vs. mechanism, certainty vs. explanation – is universal.
