  We are building a diagnostic quiz to sort readers by their intuitive reactions to concrete cases. The goal is to identify which view of word meaning they hold without them needing to know the philosophical labels. The views we are targeting are:

  1. **Natural-kind externalism (Putnam-style)**: Meaning is fixed by the external world (the actual nature of the referent), so that even if two communities are in identical internal states, their words might refer to different things if the world is different.
  2. **Social externalism (Burge-style)**: Meaning is fixed by the community's norms of use, so that an individual might be using a word with the same mental state as others but still be wrong if they deviate from the community standard.
  3. **Narrow-content internalism**: Meaning (or at least the psychologically relevant part) is fixed entirely by the individual's internal state, so that molecule-for-molecule duplicates must have the same meanings and mental states, regardless of external differences.
  4. **Causal-descriptivist hybrid**: A view that combines elements of descriptivism (meaning is given by a description in the mind) with causal-historical elements, so that reference might be fixed by descriptions that are causally linked to the world.

