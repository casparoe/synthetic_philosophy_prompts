  ### Diagnostic Quiz: Which View of Word Meaning Do You Actually Hold?  
  *Answer each scenario based on your intuitive judgments. No philosophy background needed!*

  ---

  #### Questions  
  1. **Twin Earth Reference (1750)**:  
     Imagine Earth and Twin Earth are identical in 1750, except the clear, drinkable liquid in Twin Earth’s rivers is XYZ (not Earth’s H₂O). Nobody knows the chemistry. When a Twin Earthling points to their river and says “water”, are they referring to the *same kind of thing* as an Earthling who points to their river and says “water”?  
     - (A) **Yes, the same kind** (it looks/behaves identically).  
     - (B) **No, a different kind** (the hidden chemistry differs).  

  2. **Twin Earth Meaning (1750)**:  
     Same scenario. Do the words “water” (Earth) and “water” (Twin Earth) *mean the same thing*?  
     - (A) **Yes, same meaning**.  
     - (B) **No, different meanings**.  

  3. **Bert’s “Arthritis”**:  
     In a community, “arthritis” means a joint disease. Bert mistakenly thinks “arthritis” can occur in thighs. When Bert says, “I have arthritis in my thigh,” is he using “arthritis” to mean *what the community means*?  
     - (A) **Yes, same meaning** (he’s just wrong about thighs).  
     - (B) **No, different meaning** (his idea of “arthritis” includes thighs).  

  4. **Gödel’s Discovery**:  
     Everyone believes “Gödel” discovered the incompleteness theorem. It turns out Gödel stole it from Schmidt. When people (pre-discovery) said “Gödel”, who were they referring to?  
     - (A) **Schmidt** (the actual discoverer).  
     - (B) **Gödel** (the person everyone talked about).  

  5. **Duplicate Beliefs**:  
     Oscar (Earth) and Twin Oscar (Twin Earth) are molecule-for-molecule duplicates. Both think, “Water is wet.” Could they have *the same belief*?  
     - (A) **Yes, same belief** (same brain states).  
     - (B) **No, different beliefs** (Earth’s “water” is H₂O; Twin Earth’s is XYZ).  

  6. **Community-Specific “Glub”**:  
     On Earth, “glub” is mined in two regions. Northern “glub” is mineral A; Southern “glub” is mineral B (both look/behave identically). Neither community knows the difference. When a Northerner and Southerner say “glub”, does the word mean the *same thing* in both communities?  
     - (A) **Yes, same meaning**.  
     - (B) **No, different meanings** (different minerals).  

  7. **Accidental Misnaming**:  
     Explorers land on an island and ask, “What is this place called?” A native says, “Kangaroo,” meaning “I don’t understand.” The explorers think “Kangaroo” is the island’s name and spread the term. When the explorers say “Kangaroo”, what does it refer to?  
     - (A) **The island** (their intended reference).  
     - (B) **Nothing** (the native wasn’t naming anything).  
     - (C) **The native’s phrase** (“I don’t understand”).  

  8. **Phlogiston’s Fate**:  
     18th-century scientists used “phlogiston” for a substance they thought was released during combustion. It doesn’t exist. When they said “phlogiston”, what did it refer to?  
     - (A) **Nothing** (no such thing).  
     - (B) **Oxygen** (what actually fits their description).  

  9. **“Gavagai” Translation**:  
     Community A uses “gavagai” to mean *rabbit*. Community B uses “gavagai” to mean *undetached rabbit parts*. Neither is wrong. When both point to a rabbit and say “gavagai”, are they saying the *same thing*?  
     - (A) **Yes, same meaning** (same object/referent).  
     - (B) **No, different meanings** (different concepts).  

  ---

  ### Scoring Key  
  **How to score**: Tally your answers (A/B/C) and match the pattern to a view below. Views are *defined by their answers to these cases*, not self-labels.  

  #### Positions & Their Answer Patterns  
  1. **Natural-Kind Externalism (Putnam-style)**:  
     - **Core idea**: Word meaning is fixed by the external world (e.g., hidden chemistry).  
     - **Answers**:  
       - Q1: B | Q2: B | Q3: A | Q4: B | Q5: B | Q6: B | Q7: A | Q8: A | Q9: B  
     - *Why?* Twin Earth “water” differs in meaning (Q2) because the *stuff* differs (Q1); Bert defers to experts (Q3); “Gödel” tracks the causal-historical chain (Q4); beliefs differ across worlds (Q5); “glub” splits by mineral (Q6).  

  2. **Social Externalism (Burge-style)**:  
     - **Core idea**: Word meaning is fixed by community norms (e.g., expert use).  
     - **Answers**:  
       - Q1: B | Q2: A | Q3: A | Q4: B | Q5: B | Q6: A | Q7: A | Q8: A | Q9: B  
     - *Why?* Twin Earth “water” has the *same meaning* (Q2: norms match) but *refers to different stuff* (Q1: world differs); Bert uses the community’s word (Q3); “Kangaroo” refers to the explorers’ intention (Q7).  

  3. **Narrow-Content Internalism**:  
     - **Core idea**: Meaning is in the head (shared by duplicates); reference varies with context.  
     - **Answers**:  
       - Q1: B | Q2: A | Q3: B | Q4: A | Q5: A | Q6: A | Q7: C | Q8: B | Q9: A  
     - *Why?* Twin Earth words mean the same (Q2) because mental states match (Q5), though reference differs (Q1); Bert has his own concept (Q3); “Gödel” refers to whoever fits the description (Q4: Schmidt); “gavagai” has the same referent (Q9).  

  4. **Causal-Descriptivist Hybrid**:  
     - **Core idea**: Meaning combines descriptions (e.g., “the discoverer”) with causal history.  
     - **Answers**:  
       - Q1: B | Q2: A | Q3: A | Q4: A | Q5: A | Q6: A | Q7: A | Q8: B | Q9: A  
     - *Why?* Twin Earth words share meaning (Q2) but not reference (Q1); “Gödel” refers to the *satisfier of the description* (Q4: Schmidt); beliefs are identical (Q5); “phlogiston” refers to oxygen (Q8).  

  ---

  #### Unoccupied Cells & Limitations  
  - **Unoccupied combinations**:  
    - **Q2=B + Q3=B + Q5=A**: No view holds this. *Why?* Incoherent—if meaning is world-bound (Q2=B), beliefs can’t be identical across worlds (Q5=A).  
    - **Q4=B + Q8=B**: Unattractive—why would “Gödel” track the impostor (Q4=B) but “phlogiston” track oxygen (Q8=B)?  
    - **Q6=B + Q9=A**: Unexplored—splits “glub” by world (Q6=B) but unifies “gavagai” by referent (Q9=A).  

  - **Honest Limitations**:  
    - **Cannot distinguish Putnam vs. Burge** on Twin Earth *reference* (Q1) or community deference (Q3). Both agree reference differs (Q1=B) and Bert uses the community’s word (Q3=A).  
    - **Cannot distinguish Internalism vs. Causal-Descriptivism** on duplicates (Q5=A), “glub” (Q6=A), or “gavagai” (Q9=A). They split on Bert (Q3) and Gödel (Q4).  
    - **Q7 (Kangaroo) is least diagnostic**: All views except Internalism pick (A); Internalism picks (C) to prioritize speaker meaning.  

  ---

  ### How to Use This Quiz  
  - **For your blog**: Post the quiz, then share the scoring key in a separate “results” post. Invite readers to debate patterns!  
  - **In class**: Use mismatches (e.g., Q2=A + Q5=B) to explore tensions (e.g., “Can meaning stay the same if beliefs differ?”).  
  - **Remember**: Real views are messier! This quiz isolates *core commitments* in a toy logical space.  

