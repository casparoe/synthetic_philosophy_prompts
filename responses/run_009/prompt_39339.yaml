answer: |-
  **Bottom line: Use a 4-step mediation protocol to identify Safe Pareto Improvements (SPIs) via randomized solutions or side payments, with fallback to traditional negotiation if no SPI exists or ethical concerns arise.**

  ### Decision Procedure (20-Minute Protocol)
  **Step 1: Frame Dispute & Quantify Costs (4 min)**  
  - **Ask parties privately:** "On a scale of 0–10, how costly is the dispute to you? (0 = no cost, 10 = worst imaginable cost)."  
  - **Stop if:** Either party refuses, or costs are negligible (e.g., both ≤2). Proceed to traditional negotiation.  
  - **Key insight:** Dispute costs (e.g., time, stress) create "destructible value" that SPIs can salvage.

  **Step 2: Elicit Outcome Valuations (6 min)**  
  - **Ask parties privately:** "If continuing the dispute is 0, rate:  
    - Outcome X [e.g., Lab A gets sequencer slot]: ____ (better = positive, worse = negative)  
    - Outcome Y [e.g., Lab B gets slot]: ____"  
  - **Stop if:** Ratings for X and Y are identical for both parties (no conflict).  
  - **Key insight:** Private ratings reveal if a lottery can Pareto-dominate the dispute.

  **Step 3: Check for SPI via Lottery (6 min)**  
  - **Calculate:**  
    - For Party A: Minimum win probability for X, \( p_A^{\min} = -\frac{U_{AY}}{U_{AX} - U_{AY}} \)  
      *(e.g., if A rates X=8, Y=−2 → \( p_A^{\min} = 0.2 \))*  
    - For Party B: Maximum win probability for X, \( p_B^{\max} = \frac{U_{BY}}{U_{BY} - U_{BX}} \)  
      *(e.g., B rates X=−3, Y=7 → \( p_B^{\max} = 0.7 \))*  
  - **SPI exists if:** \( p_A^{\min} \leq p_B^{\max} \). Propose a lottery with \( p = \frac{p_A^{\min} + p_B^{\max}}{2} \) (e.g., 45% A, 55% B).  
  - **No SPI?** Check side payments:  
    - Ask: "If you lose, what compensation (e.g., cash, future concession) would make you indifferent to disputing?"  
    - **SPI exists if:** Winner’s max willingness to pay ≥ loser’s min ask (e.g., A pays B 3 lab hours for the slot).  

  **Step 4: Validate & Implement (4 min)**  
  - **Ethical check:** "Is resolving this by chance/compensation acceptable?"  
    - **Stop if:** Either party objects (e.g., "Hiring shouldn’t be random").  
  - **Document terms:** "Party A agrees to X with p=0.45, else Y."  
  - **Failure mode (post-deal reneging):**  
    - **Mitigation:** Publicly record agreement (social enforcement), use immediate/verifiable payments (e.g., cash upfront), warn of reputation damage.  
    - **Limitation:** No legal enforcement; reneging risk remains if side payments are covert.  

  ---

  ### Case Applications
  **Case 1: Two Labs Fighting Over Sequencer Time**  
  - **Dispute cost:** Lab A: 7/10, Lab B: 8/10.  
  - **Valuations (private):**  
    - Lab A: X (A wins slot) = 6, Y (B wins) = −1  
    - Lab B: X = −4, Y = 5  
  - **SPI check:**  
    - \( p_A^{\min} = -\frac{-1}{6 - (-1)} = 0.14 \)  
    - \( p_B^{\max} = \frac{5}{5 - (-4)} = 0.56 \)  
    - **SPI:** Lottery with p=35% (A wins), 65% (B wins).  
  - **Outcome:** Both prefer lottery to dispute (expected utility: A=1.75>0, B=1.4>0).  

  **Case 2: Department Deadlocked on Hiring Subfield A vs. B**  
  - **Dispute cost:** Faculty A: 9/10, Faculty B: 9/10.  
  - **Valuations (private):**  
    - Faculty A: X (hire A) = 10, Y (hire B) = −10  
    - Faculty B: X = −10, Y = 10  
  - **SPI check:**  
    - \( p_A^{\min} = -\frac{-10}{10 - (-10)} = 0.5 \)  
    - \( p_B^{\max} = \frac{10}{10 - (-10)} = 0.5 \)  
    - **SPI exists** (p=0.5), but **ethical check fails:** Both reject a lottery ("Hiring is merit-based!").  
  - **Side payments:** Unviable (e.g., "Pay me to hire your candidate?" seen as bribery).  
  - **Outcome:** No SPI; revert to interest-based negotiation. Lottery "hides the fight" but doesn’t resolve values.  

  ---

  ### What the Procedure Can/Cannot Do  
  - **Can:**  
    - Identify SPIs in 20 min using private ratings.  
    - Quantify dispute costs to motivate compromise.  
    - Handle non-divisible goods (via lotteries/side payments).  
  - **Cannot:**  
    - Force honesty (parties may misreport valuations).  
    - Enforce agreements (ombuds has no power).  
    - Resolve value conflicts (e.g., ethics of randomization).  
    - Prevent covert reneging (mitigations are partial).  

  **Fallback:** If no SPI or ethical veto, use traditional mediation (e.g., BATNA exploration).
