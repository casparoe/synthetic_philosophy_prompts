answer: |-
  ### (1) What he got right  
  Your brother correctly identifies Functional Decision Theory's (FDT) core mechanic: you choose actions as if your decision *logically controls* identical decision algorithms elsewhere (e.g., in simulations or predictions). He’s right that FDT handles Newcomb-like problems (where outcomes correlate with your choice *before* you act) by "acausally" linking your decision across worlds. His XOR blackmail example is also a faithful sketch: FDT advises non-payment because receiving the letter *implies* (for an FDT agent) that the blackmailer predicted you’d pay, which means there’s no scandal. The theory *does* aim to make you "win" across predictable dilemmas by ensuring predictors see you as "cooperate-only-when-beneficial."

  ### (2) Where the summary bends the truth  
  **"Literally you deciding again" is a simplification.** FDT treats *functionally identical* decision algorithms as logically entangled, but it doesn’t claim simulations are metaphysically "you." It’s about abstract algorithm-output consistency, not subjective identity. A careful proponent would say: "Your decision algorithm’s output is fixed everywhere it’s instantiated, including in the predictor’s model." This avoids implying consciousness transfers to simulations—a point critics (e.g., causalists) call smuggled magic.  

  **"Paying on tails causes the £500 offer" misrepresents causality.** FDT doesn’t claim your choice *retrocauses* Sam’s coin flip or offer. Instead, it argues your algorithm’s *known output* (if predictable) *logically constrains* what Sam can offer. If Sam knows you *always* refuse, he can’t offer the £500 on heads (since he needs confidence you’d pay on tails). Paying doesn’t "cause" the heads world; it ensures your algorithm’s type *permits* that world to exist. Your brother’s phrasing risks conflating logical dependency with time travel.  

  **The XOR analogy misfires slightly.** In XOR blackmail, *not paying* is FDT-optimal because the letter’s arrival *disproves* the scandal if you’re a non-payer. But Sam’s game differs: here, the predictor’s action (offering £500) depends *directly* on anticipating your payment. It’s closer to a **transparent Newcomb problem**: Sam "boxes" the £500 iff he predicts payment. FDT says pay to "get" the boxed money. The brother’s "never give in to blackmail" moral is apt for XOR but distracts here—this is a *coordination* problem with your past/predicted self.  

  **"FDT agents end up rich" is overclaimed.** FDT "wins" in specific scenarios with trustworthy predictors and acausal dependencies (e.g., Newcomb, this game). But it can "lose" in others: e.g., if predictors are noisy, or in true prisoner’s dilemmas without precommitment. Proponents (e.g., Yudkowsky, Soares) admit FDT isn’t globally dominant—it’s optimal *when* your decision algorithm is being simulated or predicted. Your brother’s "everyone else keeps losing money" ignores that CDT (Causal Decision Theory) wins in many everyday situations where correlations are spurious.  

  ### (3) So do I pay Sam?  
  **Yes, FDT recommends paying the £50.** Sam’s prediction being based on "knowing your character" (not a simulation) doesn’t weaken FDT’s logic. If Sam can reliably anticipate your choices—which he likely can, given your history—then your decision algorithm *is* being "predicted," creating the same acausal link. Refusing loses you the hypothetical £500 (since Sam wouldn’t have offered it if he predicted refusal), while paying "buys" the chance at £500 in heads worlds. Your gut reaction ("£500 is make-believe") is CDT-thinking; FDT treats the counterfactual as "real" because your algorithm’s reliability affects which worlds are possible.  

  ### (4) Confidence and the weak point  
  - **Highest confidence:** Paying is FDT-optimal (99%). This is a textbook Newcomb-like problem, and Sam’s real-world prediction method doesn’t break the logic.  
  - **High confidence:** Brother’s "causes the £500 offer" phrasing is misleading (95%). FDT avoids retrocausality; it’s about logical consistency.  
  - **Moderate confidence:** "FDT agents end up rich" is an oversimplification (85%). It wins in *this* scenario but isn’t universally superior.  
  - **Weakest point (least bet £50 on):** Whether Sam’s "knowing your character" **perfectly mirrors a simulation** (70%). If Sam’s prediction is fallible or based on heuristics (not your actual decision algorithm), FDT’s edge weakens. But since he’s seen you honor dares, he likely *is* tracking your algorithm—so I’d still pay.  

  **Bottom line:** Your brother’s gloss is broadly correct for *this* dilemma, and your instinct reflects a causal perspective that loses here. Pay Sam.
