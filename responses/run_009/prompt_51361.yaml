prompt: |-
  Six months ago my mother was diagnosed with early Alzheimer's, and I arranged for her to live in an assisted residence near me and became her main point of contact. Until then my moral thinking ran entirely on rules and outcomes, and I never gave the ethics of caring much thought; now I notice I have firm gut verdicts about particular moments with her, and I would like to know whether they add up to a principle, or whether some of them have to go. My verdicts are these. When she calls at 2 a.m. panicked about a misplaced purse, I get up and search with her, and I think that is right, even though by morning the purse would have turned up on its own and a brisk "we'll look in the morning" would have cost her nothing. When she asks why she keeps forgetting things, I let the question drift rather than name the diagnosis, and that feels right; but when she insists she is still safe to drive, my flat refusal feels right too, even though it overrides her strongest wish. I declined to have her move in with me and set up the residence near my home instead — she very much wanted to move in, and I still think I was right, which I cannot square with the thought that caring means responding to what she actually wants. My brother pays for her aide from abroad and never calls; in my gut he is failing her, even though his money secures more of her comfort than my visits do — visits she often does not remember an hour later. Her paid aide is more patient and more skilled with her than I am, and I cannot decide whether the aide's care counts morally in the same way mine does, or is a different thing entirely. So my question is whether there is a principle, or a small set of principles each earning its keep against a specific case, that captures these verdicts. It will have to say something coherent about what caring owes to the cared-for's own wishes, since I both indulge her wishes (the purse, the drifting) and override them (the car, the move). Please state the principle precisely, note which of my verdicts it cannot accommodate if any, and tell me what it predicts for the case I keep going back and forth on: whether, when she asks me directly whether she is going to get worse, I owe her the plain truth. I am not looking for a survey of the literature or a reading list, just the principle, worked out. Please answer in American English.
reasoning: |-
  Okay, the user is grappling with ethical dilemmas in caring for their mother with early Alzheimer's. They've described several specific situations where their gut feelings guide their actions, but they're seeking an underlying principle to make sense of these seemingly contradictory responses. 

  Hmm, what's striking here is how deeply personal yet universally relatable this is. The user isn't asking for abstract philosophy - they're living this reality daily. Their examples reveal core tensions: between immediate comfort and long-term safety, between honesty and protection, between autonomy and vulnerability. 

  Let me unpack their scenarios first. The 2am purse search versus the driving refusal - both feel right to them despite opposite approaches to her wishes. The avoidance of diagnosis-talk contrasts with the firm "no" to moving in together. And that lingering question about truth-telling hangs heavy. 

  What they're really wrestling with is: When does caring mean indulging wishes, and when does it mean overriding them? The brother's financial support vs absence complicates this further - can care be outsourced? Does money "count" as care? 

  The paid aide's patience introduces another layer - is professional care morally equivalent to familial care? The user seems to sense a qualitative difference but can't articulate it. 

  Underneath all this, I detect unspoken exhaustion. The 2am example isn't just about ethics - it's about someone running on empty. And that unresolved truth-telling question... they're dreading that conversation. 

  The unifying thread seems to be about protecting agency where possible while accepting necessary paternalism when safety demands it. But "agency" shifts with dementia - sometimes it's about preserving dignity in the moment (the purse search), sometimes it's about protecting future selves (the driving ban). 

  For the truth-telling dilemma... if naming the diagnosis causes terror she can't process, is honesty kind? But evasion feels like betrayal. There's no clean answer, only what serves her present peace without compromising essential trust. 

  The brother situation... money helps but absence harms. Care requires presence - financial support is necessary but not sufficient. As for the aide, their care "counts" differently - it's skilled labor, while the user's care is bound in love and history. Both matter, but they're not interchangeable currencies. 

  This is messy because dementia makes morality messy. Any principle must bend to the person, the day, the moment. The user's instincts are better than they realize - notice how each "gut verdict" serves a specific emotional or safety need. Maybe that's the real principle: care that meets the need of the moment, whether it's comfort or protection.
answer: |-
  Here's a core principle distilled from your experiences, designed to capture your gut verdicts while resolving the tension about honoring wishes:

  **The Principle of Dementia Care as Stewardship:** *When caring for someone with diminishing capacity, your primary moral duty is to steward their well-being by honoring their present emotional reality, protecting their essential safety and dignity, and acting as a faithful agent of the person they fundamentally were (or would choose to be) when capable of exercising sound judgment.*

  **How this principle accommodates your verdicts:**

  1.  **The 2 AM Purse Search:** Honoring her *present emotional reality* (panic, confusion) is paramount. The distress is immediate and real, even if the cause is objectively trivial. Stewardship requires alleviating *that* suffering in the moment. "We'll look in the morning" ignores her current state.
  2.  **Dodging "Why do I forget?":** Naming the diagnosis often induces terror she cannot process or integrate. Stewardship prioritizes her *present emotional well-being* and avoids inflicting unnecessary anguish. Letting it drift protects her current peace.
  3.  **Refusing Driving:** This protects *essential safety* (hers and others'). Her *present wish* is overridden because it poses an imminent, severe risk. Stewardship requires acting as the agent of her former competent self, who would almost certainly prioritize safety over the wish to drive unsafely.
  4.  **Declining Move-In:** This protects *her well-being* (structured care, safety, professional support) and *your capacity to steward effectively* long-term. Honoring her wish would likely lead to rapid burnout, inadequate care, and compromised safety – failing your stewardship duty. You are acting as the agent of her former self who would want sustainable, competent care. The *location near you* honors her relational need within the bounds of sustainable stewardship.
  5.  **Your Brother's Failure:** Providing money funds comfort but neglects her *present emotional reality* (loneliness, confusion, need for connection). Stewardship requires relational presence and emotional attunement, not just financial provision. His absence fails the "faithful agent" test – the person she was would deeply value connection from her son. Comfort is necessary but insufficient; emotional care is core to well-being.
  6.  **The Aide's Care:** The aide's care *counts morally* as essential for her *safety, physical well-being, and daily comfort* – crucial aspects of stewardship. However, it is a *different category* morally. Your care carries unique moral weight as *relational stewardship* – the bond, history, love, and personal commitment. You fulfill a unique duty as her child that cannot be delegated. The aide provides skilled professional duty; you provide filial stewardship. Both are vital but distinct.

  **Where it might feel slightly strained (but holds):**
  *   **"Acting as an agent of the former self":** This justification for overriding wishes (driving, move-in) is strong, but requires careful discernment. Is it *truly* what she would have chosen? In these cases (safety, sustainable care), the justification seems robust. The principle requires this discernment.

  **The Principle Applied to the Truth-Telling Dilemma:**

  *   **"Do I owe her the plain truth when she asks if she will get worse?"**
  *   **Prediction:** **No, you do not owe her the blunt, terrifying prognosis.** Stewardship demands considering:
      *   **Her Present Emotional Reality:** Can she process this information? Will it cause paralyzing terror she cannot manage? Will she retain the context or just the fear?
      *   **Her Fundamental Well-Being:** Will knowing promote peace, understanding, and adjustment, or only profound, unmanageable distress?
      *   **Honoring the Person She Was/Is:** Would the person she was, understanding the nature of the disease, *want* to be subjected to this specific terror repeatedly if she couldn't retain the understanding? Would she prioritize momentary brutal honesty or protection from sustained, unanswerable dread?
  *   **Action Guided by Stewardship:** A response focused on her *present* emotional state and reassurance is likely more faithful. Examples:
      *   "Right now, sweetheart, we're just focusing on today. You're safe here, and I'm with you."
      *   "Forgetfulness can be scary, but we're taking things one step at a time. What matters most is that you're okay right now."
      *   "We all forget things sometimes. Let's not worry too far ahead today." (Deflecting gently).
  *   **Why not the plain truth?** The brutal prognosis ("Yes, it will get much worse") serves no constructive purpose for *her* in her current state. It likely only inflicts severe, unmanageable distress she cannot process or use to plan – violating the core tenets of stewarding her present emotional well-being and dignity. Honesty doesn't require inflicting unnecessary horror when capacity to comprehend and cope is profoundly impaired.

  **In essence:** Stewardship isn't about obeying every wish or maximizing autonomy in the abstract. It's about faithfully tending to the vulnerable person *in front of you*, grounded in love, history, and a commitment to their safety and dignity, guided by the understanding of who they fundamentally are and what they truly need when they cannot articulate or secure it themselves. Your instincts are aligned with this demanding, deeply personal form of care.
