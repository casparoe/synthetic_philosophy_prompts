    **Settled violation**: This pattern **violates subjective expected utility (SEU) axioms** (e.g., Savage's Sure Thing Principle). Under SEU, if she prefers red to black, she should prefer red-or-yellow to black-or-yellow (since yellow is common). Her reversal is a classic **Ellsberg paradox**, proving ambiguity aversion. This is replicated in experiments and not contested.
  - **(4) Coin-selected urn**: Takes even odds.  
    **Why**: Overall probability is known (50%)—fair coin defines the risk. Ambiguity in urn composition is "averaged out."
  - **(5) Subjective bets**: Sets odds and bets.  
    **Why**: She uses personal beliefs (subjective probabilities) for real-world events. No ambiguity in her mind—she trusts her own estimates.

  **Key settled insight**: Dana violates SEU due to ambiguity aversion (scenario 3). This is experimentally robust. The **contested aspect** is _which model_ explains her aversion: human distrust, worst-case reasoning, or smooth penalties.

