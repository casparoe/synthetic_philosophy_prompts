  C) The statement "adding one hair never changes bald to not bald" is almost true, but not completely true; it becomes less true as you approach the boundary. (fuzzy)
  D) The meaning of 'bald' shifts during the series, so the inductive step is not true in a single context. (contextualism)
  E) The first premise is false: a man with 0 hairs is not bald, because 'bald' doesn't apply to anyone. (nihilist)
  F) The premises are individually acceptable in isolation, but when you put them together, the rules of assertion break down. (pragmatic)

