  First, I need to parse their examples. The vegetable chopping absence of self, the failed attempt to catch sleep, and the mirror analogy. They mention Buddhism's anatta but feel it's different because anatta says no self exists, whereas they're describing a dynamic where the search perpetuates the illusion. 

