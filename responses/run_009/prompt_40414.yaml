  ### 1. The Logical Space (150 words)  
  The unit explores three questions structuring the logical space of omission-causation views:  
  - **Q1**: Can absences (e.g., non-waterings) be causal relata, or is causation strictly among positive events?  
  - **Q2 (if Q1=Yes)**: Is the *relevant* absence (e.g., "the gardener's failure") fixed by normative facts (duties, expectations) or independently (e.g., by proximity or counterfactuals)?  
  - **Q3 (if Q1=Yes)**: Do absences enter the *same* causal relation as positive events, or a distinct one?  

  Three cases pull these apart:  
  - **(i) Gardener vs. Queen**: Tests Q1 (is *any* absence causal?) and Q2 (if only the gardener’s omission counts, is it due to duty or non-normative factors?).  
  - **(ii) Two lifeguards**: Tests Q1 (can *each* absence cause?) and Q3 (if both omissions cause, is this the same relation as positive causation?).  
  - **(iii) Smoke alarm**: Tests Q3 (is prevention-by-absence the same as positive causation?) and Q2 (if the alarm’s omission causes, is it due to its function or non-normative facts?).  

  ---

  ### 2. The Decision Tree (Half-Page)  
  **Start**: In the gardener case (hired gardener never watered, plants died), is the gardener’s failure to water a cause of the death?  
  - **Yes** → Go to A  
  - **No** → Go to D  

  **A**: In the same case, is the Queen of England’s failure to water (she was not hired and was abroad) also a cause of the death?  
  - **Yes** → Go to B  
  - **No** → Go to C  

  **B**: In the two lifeguards case (both fail to save a drowning child; either acting alone could have saved), is each lifeguard’s failure to act a cause of the death?  
  - **Yes** → **Leaf c: Abundant causation**  
  - **No** → *[Error: Inconsistent; revisit A-B.]*  

  **C**: What makes the gardener’s failure a cause but not the Queen’s? Is it primarily because the gardener was hired and had a duty, while the Queen did not?  
  - **Yes** → **Leaf b: Normative fixing**  
  - **No** → **Leaf a: Counterfactualist**  

  **D**: The statement “the gardener’s failure caused the death” seems true, but it does not mean an absence is a cause in the standard sense. What makes it true?  
  - It is made true by a *positive event* (e.g., the gardener’s decision to skip work, or the sun’s heat) causing the death.  
    → **Leaf f: Commissive denialist**  
  - It is made true by a *derived relation* (e.g., the absence “allowed” or “prevented” the death) that isn’t causation.  
    → **Leaf d: Quasi-causal view**  
  - It is made true by a *contrast* (e.g., the plants died *because* the gardener did not water, *rather than* watering).  
    → **Leaf e: Contrastive view**  

  ---

  ### 3. Leaf Glosses (Two Sentences Each)  
  - **Leaf a: Counterfactualist** (Lewis): Absences are causes fixed non-normatively by counterfactual dependence and context; they enter the same relation as positive events. *Awkward commitment*: The Queen’s non-watering *could* count as a cause in unusual contexts, but we avoid absurdity by pragmatic salience.  
  - **Leaf b: Normative fixing** (McGrath’s dilemma): Absences are causes, but normative facts (duties) fix which absence is relevant; they enter the same causal relation. *Awkward commitment*: Causation inherits normativity, making it non-objective (e.g., the lifeguard’s duty, not physics, determines causehood).  
  - **Leaf c: Abundant causation** (unnamed): Absences are causes fixed non-normatively; nearly every relevant absence (e.g., both lifeguards, the Queen) is a cause, with “the cause” being pragmatic. *Awkward commitment*: The Queen’s non-watering is literally a cause of the plants’ death, alongside countless others.  
  - **Leaf d: Quasi-causal view** (Dowe): Absences are not causes but stand in a derived relation (e.g., “quasi-causation”) to outcomes, fixed non-normatively. *Awkward commitment*: We must accept a non-causal relation (e.g., in the smoke alarm case) that mimics causation but lacks its theoretical unity.  
  - **Leaf e: Contrastive view** (Schaffer): Absences are not causal relata; causation is quaternary (e.g., the gardener’s *not watering* rather than watering caused death rather than survival). *Awkward commitment*: Causation requires four-place contrasts, making simple claims (e.g., “the alarm’s failure caused death”) incomplete or elliptical.  
  - **Leaf f: Commissive denialist** (unnamed): Only positive events are causes; omissive claims are paraphrased away (e.g., “the alarm’s failure caused death” becomes “the fire caused death”). *Awkward commitment*: Must deny intuitive truths (e.g., in the lifeguard case, neither omission causes death) or posit obscure positive events.  

  ---

  ### 4. Unoccupied Combinations (150 words)  
  The logical space has three unoccupied answer-combinations:  
  - **Yes/Normative/Distinct**: Absences are causes fixed normatively but enter a *distinct* causal relation. *Diagnosis*: Unattractive—no motivation for normative fixing if the relation differs; unexplored in literature.  
  - **Yes/Non-normative/Distinct**: Absences are causes fixed non-normatively but enter a *distinct* relation. *Diagnosis*: Incoherent—if absences are non-normative causal relata, why distinguish the relation? Collapses into quasi-causation (Leaf d).  
  - **No/[n/a]/[n/a] with normative analysis**: Absences aren’t causes, but normative facts fix the “true” cause. *Diagnosis*: Unattractive—denying absences while invoking norms for positive causes (e.g., in the gardener case) is ad hoc and unsupported.  

  All occupied combinations avoid these: normative views unify the relation (Q3=Same), while non-normative views avoid distinct relations.  

  ---

  ### 5. Separation Failures (100 words)  
  The tree cannot separate:  
  - **Leaf a (Counterfactualist) and Leaf b (Normative fixing)** if a student denies normative fixing (Node C=No) but cites non-duty factors (e.g., “the gardener was salient due to expectations”). *Further question needed*: In the smoke alarm case, if the alarm was broken but no one expected it to work, is its failure still a cause?  
    - **Yes** → Leaf a (non-normative salience).  
    - **No** → Leaf b (normative expectations).  
  - **Leaf d (Quasi-causal) and Leaf e (Contrastive)** if a student describes the derived relation using contrasts. *Further question*: In the lifeguard case, does the double omission require a *single* quasi-cause (e.g., “no rescue”) or *contrasts* for each lifeguard?  

  ---

  ### 6. The Dilemma, Displayed (100 words)  
  **The dilemma**: For non-normative views (Q2=Independent), either absences are not causes (non-causation horn) or nearly *every* absence (e.g., the Queen’s) is a cause (proliferation horn). Each leaf takes a horn:  
  - **Proliferation horn**: Leaf a (mitigated by context) and Leaf c (embraced).  
  - **Avoids dilemma via norms**: Leaf b (Q2=Normative).  
  - **Non-causation horn**: Leaf d, e, and f (Q1=No).  
  **Plain statement**: *Before choosing a path, note: If you reject norms for fixing absences (Node C=No or Node A→B=Yes), you must either deny absences as causes (e.g., via D, E, F) or accept absurd causes (e.g., the Queen via A→B→C).*
