prompt: |-
  I'm a PhD student in moral psychology, and my supervisor — a medievalist by training who has never read a page of post-war ethics and is quietly proud of it — runs a stubbornly atheoretical seminar in which every moral question is settled by case verdicts, hers and ours, delivered around the table and never argued up to a principle. Over the past term her verdicts have accumulated, and I've started trying to reconstruct the rule she is implicitly applying, partly out of curiosity and partly because I suspect more than one rule fits her record, and I'd like to catch which one she actually holds. Her rulings so far: permissible for a bystander to flip the switch that turns a runaway tram from a track with five people on it onto a side track with one; permissible for the tram's own driver to steer it onto the one rather than the five; impermissible to push the large man off the footbridge into the tram's path to stop it, though that would save five; impermissible for a surgeon to take one patient's organs to save five others; and permissible for a doctor to give the last of a scarce drug in small doses to five patients, knowing that a sixth patient, who would have needed the whole supply to survive, will therefore die.

  Next week's case, which I get to pose, is a loop variant: the side track curves around and rejoins the main line just short of the five, so that if the one were not lying on it, the tram would continue around the loop and kill all five; his body is what brings it to a stop. Flipping the switch therefore saves the five only because it kills the one. Before I pose it, I want a prediction of her verdict, together with a candid inventory of the rules that fit her record so far — the doctrine of double effect read as a bare intend/foresee distinction, the Kantian ban on using a person merely as a means, a redirection-of-an-existing-threat rule, a killing/letting-die rule, and any others that fit as well as these do. Each rule that survives the inventory should then be made to state its prediction for the loop case, since separating them is the whole point of posing it. I'd like your best guess as to which prediction she will vindicate, and your reasons for preferring it — her past votes on cases where the one's body was or wasn't needed seem to me the most promising evidence, but I may be missing something.

  Finally, two smaller requests. First, beyond the loop, name a further case — one of ours, or one you invent — that would discriminate between the surviving rules more cleanly than the loop does; I'd like a backup case ready if her answer turns out to be principled in a way I didn't anticipate. Second, tell me whether you think the loop case is rigged: does it reveal that her original bystander verdict was never a pure double-effect verdict, since there the one would have been killed by the tram in any case and his body was never needed to stop it? If so, I want to know before I stand up in front of her, because she will find that argument faster than I will.
reasoning: |-
  Okay, let me approach this query methodically. The user is a moral psychology PhD student dealing with a medievalist supervisor whose case-based approach requires reverse-engineering implicit principles. The core challenge involves predicting the supervisor's judgment on a trolley problem variant while mapping possible underlying rules.

  First, I need to analyze the established pattern from the supervisor's past verdicts:
  - Permissible: Bystander flipping switch (standard trolley)
  - Permissible: Driver steering (active involvement doesn't change permissibility)
  - Impermissible: Footbridge push (direct harm)
  - Impermissible: Organ harvesting (direct harm to innocent)
  - Permissible: Drug rationing (letting die vs. killing)

  The loop variant introduces critical complexity - the side track victim's body becomes instrumental in stopping the tram. This seems designed to test whether the supervisor distinguishes between incidental and instrumental harm.

  Three primary candidate rules emerge from the pattern:
  1) **Doctrine of Double Effect (bare intend/foresee version)**: The loop case would be impermissible because the death is now intended as a means.
  2) **Redirecting Existing Threat**: Should remain permissible since the threat's origin remains unchanged.
  3) **Using as Mere Means (Kantian)**: Likely impermissible because the victim becomes a tool.

  I notice the drug rationing case strongly supports a letting-die/killing distinction, but that doesn't cleanly apply to the loop scenario. The footbridge and organ cases suggest particular aversion to direct bodily harm.

  For prediction, I lean toward impermissibility in the loop case. The supervisor's rejection of footbridge/shoving and organ harvesting reveals deep discomfort with instrumentalizing bodies - the loop scenario makes the victim's physical body part of the stopping mechanism, which feels analogous.

  A stronger discriminator case could be one where redirecting a threat requires someone's body as a necessary buffer - e.g., diverting lava flow toward one person whose body will temporarily halt it to save a village. This would pressure-test whether physical instrumentality matters more than threat redirection.

  Regarding rigging concerns: The original bystander case wasn't "pure" double effect because the death was foreseeable but not instrumental. The loop case exposes that distinction by making the death functional. The supervisor might indeed pounce on this, arguing her initial verdict was always about redirection, not double effect.

  The user should prepare for two likely supervisor moves: 1) Claiming the loop case is materially identical to footbridge (both involve making someone a physical tool), or 2) Distinguishing it from standard redirection because the death isn't merely collateral but constitutive of the solution.
answer: |-
  Here's a systematic breakdown of your request, drawing on your supervisor's case record and standard ethical frameworks. I'll address each component in sequence.

  ### 1. Rules Fitting Your Supervisor's Record
  Her verdicts align with **three key rules**, while others are eliminated:

  - **❌ Killing vs. Letting Die**: Fits *drug rationing* (letting die permissible) but fails *organ harvesting* (killing impermissible). *However*, it doesn't explain the *footbridge* rejection (also killing) or the *bystander/driver* permissibility (active killing). **Eliminated**.  
  - **❌ Bare Intend/Foresee (Doctrine of Double Effect - DDE)**: Fits *bystander/driver* (foreseen death) vs. *footbridge/surgeon* (intended death). But *drug rationing* involves **intending** the death of the sixth patient (you "know" they die *because* you give the drug to others). Her permissibility verdict breaks DDE. **Eliminated**.  
  - **✅ Redirecting Existing Threat (RET)**: Permissible to redirect a threat (*bystander/driver*) but not to **initiate** a new threat (*footbridge push*, *organ harvesting*). *Drug rationing* fits as "not creating a threat" but allowing nature to take its course. **Survives**.  
  - **✅ Using as Mere Means (Kantian)**: Impermissible to use someone *instrumentally* (*footbridge*: man is a "speed bump"; *surgeon*: patient is organ source). *Bystander/driver*: death is a side effect, not instrumental. *Drug rationing*: no direct "use" of the sixth patient. **Survives**.  
  - **✅ Physical Proximity / Direct Harm**: Focuses on **direct physical force** (*footbridge push*, *surgery*) vs. **mediated harm** (*switch flip*, *drug allocation*). Explains all cases. **Survives**.  

  **Summary of Surviving Rules**:  
  1. **RET**: Redirecting an *existing threat* is permissible; creating a *new threat* is not.  
  2. **Mere Means**: Using someone *instrumentally* (as a tool) is impermissible.  
  3. **Direct Harm**: *Physically direct* interventions (pushing, cutting) are impermissible; *indirect* actions (switching tracks, allocating drugs) are permissible.  

  ---

  ### 2. Predictions for the Loop Case  
  - **RET Prediction**: **PERMISSIBLE**. The threat (tram) is still *redirected*, not created anew. The loop doesn’t change the threat’s origin.  
  - **Mere Means Prediction**: **IMPERMISSIBLE**. The one’s body is *instrumental* in stopping the tram (his mass is the "brake"). This is textbook "using as a means."  
  - **Direct Harm Prediction**: **PERMISSIBLE**. The harm is still indirect (flipping a switch) and not physically direct like pushing.  

  ---

  ### 3. Your Supervisor's Likely Verdict & Why  
  **Prediction: IMPERMISSIBLE** (with high confidence).  

  **Reasons**:  
  - Her strongest pattern is **aversion to instrumentalization**. She rejected *footbridge* (using the man as a tool) and *organ harvesting* (using the patient as a resource) but allowed *drug rationing* (no direct "use"). The loop case makes the victim's body *essential* to stopping the tram, mirroring the instrumental logic of *footbridge*.  
  - **Past votes support this**:  
    - When the body *wasn’t needed* (standard bystander case), she allowed the switch flip.  
    - When the body *was needed* (footbridge), she forbade it.  
    - The loop case explicitly requires the body to function as a stopping mechanism.  
  - **Weakness of RET**: Her *drug rationing* verdict (intentional death) suggests she prioritizes non-instrumentalization over pure threat-redirection.  

  ---

  ### 4. A Further Discriminator Case  
  **The Lava Diversion Case**:  
  >*Lava from a volcano flows toward Village A (5,000 people). You can divert it to Village B (100 people). However, the diversion requires *pushing a boulder* off a cliff to block the original channel. The boulder will crush a single hiker at the base of the cliff.*  

  - **RET**: Permissible (redirecting lava, an existing threat).  
  - **Mere Means**: **IMPERMISSIBLE** (hiker is *instrumentally used* as a "crushable object" to block lava).  
  - **Direct Harm**: **IMPERMISSIBLE** (direct physical act: pushing a boulder onto someone).  

  **Why it’s better than the loop**:  
  - The loop case doesn’t cleanly separate *Direct Harm* from *Mere Means* (both yield "impermissible"). Here, *Direct Harm* aligns with *Mere Means* against *RET*, isolating whether *physical directness* or *instrumentality* drives her judgment.  

  ---

  ### 5. Is the Loop Case "Rigged"?  
  **Yes, but productively**. It exposes that her *original bystander verdict was never about pure DDE*.  

  - In the standard case, the one’s death is *foreseen but not instrumental*: the track switch works even if the victim magically vanishes. The loop makes the death **instrumental** (the body *stops* the tram).  
  - **Why she’ll spot this**: Her medievalist background likely primes her to think in terms of *purpose* and *instrumentality* (e.g., Aquinas’ DDE requires non-instrumentality). She’ll argue:  
    *"The loop isn’t about redirection—it’s about* needing *the victim’s body to function as a brake. That’s no different from the footbridge."*  
    This forces a choice: either **abandon RET** or **distinguish "indirect instrumentality"** (which RET struggles with).  

  **Recommendation**: Preempt this by posing the case neutrally: *"Does your permissibility of switching tracks extend to a scenario where the side track loops back, and the victim’s body stops the tram?"* Let her reveal whether instrumentality matters more than threat redirection.  

  ---

  ### Strategic Summary  
  - **Prediction**: She’ll rule the loop **IMPERMISSIBLE** based on *Mere Means*.  
  - **Backup Case**: Use *Lava Diversion* to test if *Direct Harm* or *Mere Means* dominates.  
  - **Rigging Insight**: The loop *does* undermine DDE interpretations of her original verdict—but that’s the point. Her focus on instrumentality was latent all along.  

  Her medievalist lens likely treats "using as a tool" as a moral bright line, while post-war ethics (e.g., Thomson’s revisions of DDE) blur it. This seminar is her chessboard—pose the loop to force a knight move.
