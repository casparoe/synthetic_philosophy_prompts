    - If they PASS, the pot increases (say, by a multiplicative factor or by a fixed amount) and it becomes the other player's turn.
  - The game has a fixed maximum number of rounds, say N nodes (or moves). If the game reaches the last node (the N-th node) and that player PASSes, then the payoffs are the worst for both players (in particular, the player who was forced to pass at the last node gets the worst outcome).

  The "paradox" is that backward induction (similar to minimax in a zero-sum game, but note: this is non-zero-sum) suggests that the first player should take immediately. However, in experiments, players often pass for several rounds.

