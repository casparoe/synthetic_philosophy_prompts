     b. The very last node (if the game is forced to end by a pass at the last node): then we assign the worst payoffs, say (0,0) or (lowest, lowest). We'll call this the "disaster" outcome.

  2. Now, we work backwards. At any node, the player whose turn it is will choose the action that maximizes their own payoff, given the subsequent play (which we have already computed by backward induction).

  In a standard centipede game, the payoffs are structured so that if the game were to continue for one more round and then be taken, the player who passes would get a smaller immediate share but then the other player takes in the next round and the passer then gets a larger share in the next round (as the non-taker). However, because of the backward induction, the last player will take (to avoid the disaster outcome). Then the second-last player, knowing that if they pass the last player will take and leave them with the smaller share, will choose to take and get the larger share at that point. This reasoning propagates all the way back to the first player.

