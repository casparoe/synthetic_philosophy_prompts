answer: |-
  ## Sestina: The Spark at the Crossroads (Detroit, 1908)

  The quiet coupe glides down cobbled **streets**,  
  No choking fumes, just torque that softly hums.  
  A flicker at the plug – a hopeful **spark**  
  From Baker’s charge, a clean, contained **charge**.  
  Her polished nickel shines, her silent **wheels**  
  Cutting against the noisy petrol **current**.

  But Stanley Steamer’s plume, a rival **current**,  
  Claims more attention on the bustling **streets**.  
  Men crave the thunder, not the gliding **wheels**  
  That whisper past. One cough, one failed **spark**  
  From temperamental wires, drains the **charge**  
  Of public trust. A moment’s doubt, a **spark**

  Extinguished. Hear the salesman’s practiced **spark**:  
  “Reliable! This *new* internal **current**!  
  Forget the cable, the lengthy **charge**!  
  Go *anywhere*!” The crowded **streets**  
  Applaud the roar. The fragile **charge**  
  Of progress swerves. The future’s **wheels**

  Choose different grooves. The turning **wheels**  
  Of industry demand a louder **spark**,  
  Commit to oil, a fossil **charge**.  
  The dominant design, a rising **current**,  
  Paves over dreams on wider **streets**.  
  The quiet coupe… retains its **charge**?

  But few will seek its fading **charge**.  
  Momentum grips the grinding **wheels**.  
  Investment flows where roaring **streets**  
  Dictate the pace. That crucial **spark**  
  Of early faith? Lost in the **current**'s  
  Pull. Infrastructure seals the **current**.

  The die is cast. The dominant **current**  
  Harnesses power, shuns the battery's **charge**.  
  The Baker gathers dust. The turning **wheels**  
  Of progress roll. That fragile **spark**  
  Of silent speed? Forgotten on the **streets**.  
  The turn was made. No second **spark**.

  ---

  **Envoi**

  This poem knows the **charge** was real, the **spark**  
  Could catch. But rigid **wheels** demand their **streets**.  
  No **current** flows the same – locked **turn** denies the might-have-been.

  ---

  **Form as Argument & Explanation:**

  1.  **The Lock-In (Form):** The sestina's rigid rotation of the six end-words (`streets`, `spark`, `charge`, `wheels`, `current`, `turn`) is the formal embodiment of path dependence and lock-in. Once chosen in Stanza 1, their order is predetermined and inescapable for the rest of the poem, just like the technological trajectory after a tipping point. The words *must* return in their fixed sequence, forcing the narrative to accommodate them, mirroring how infrastructure, investment, and expectations constrain future choices after lock-in occurs. The final word (`turn`) in the envoi explicitly names the tipping point.
  2.  **The Tipping Point (Content):** The poem zooms in on a specific, plausible moment in Detroit circa 1908. It focuses on the *perception* and *marketing* battle (`salesman’s practiced spark`, `applaud the roar`, `moment’s doubt`) rather than a single technical failure. The small event is the shift in public and industrial *sentiment* and *investment* triggered by perceived reliability and convenience ("Go *anywhere*!") favoring internal combustion over the electric coupe (`Baker Electric`), captured in lines like "The fragile **charge** / Of progress swerves" and "The dominant design, a rising **current**". The "turn" happens socially and economically.
  3.  **The Envoi & Contingency (Commitment):** The envoi explicitly commits to **contingency** ("No **current** flows the same – locked **turn** denies the might-have-been"). It argues that the specific path taken (represented by the specific end-words and the narrative they forced) mattered profoundly. The poem states the opportunity ("the **charge** was real, the **spark** / Could catch") was lost *because* of the specific sequence of events and lock-in ("rigid **wheels** demand their **streets**"). Crucially, it asserts "No **current** flows the same" – the outcome was not inevitable. Different choices (different end-words/events) would have led to a different poem (a different technological world). The poem's very existence, shaped by *these* words in *this* order, argues that the lock-in was decisive, not mere convergence. The final line, "locked **turn** denies the might-have-been," directly echoes the path dependence concept – the specific turning point foreclosed alternatives.
