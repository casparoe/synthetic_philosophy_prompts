prompt: |-
  You are a professional philosopher, specializing in metaphysics (persistence and identity over time) but comfortable working at the interface of philosophy and heritage conservation law. I want you to think carefully and rigorously: before committing to an answer, brainstorm the candidate reconstructions and test each against the details below rather than reaching for the first theory that fits the label.

  Consider the following body of practice, which I'll describe concretely.

  International heritage doctrine since the Venice Charter has been organized around the "authenticity" of original fabric: interventions should be minimal, repairs should be distinguishable from original material at close range, conjectural reconstruction is disallowed, and a monument's credentials were long tested against its design, materials, workmanship, and setting. Yet the same institutional world, and the public it serves, routinely treats wholesale replacement as identity-preserving in other cases. Warsaw's Old Town was systematically blown up after the 1944 uprising and then meticulously rebuilt between 1947 and 1953, partly from salvaged bricks and partly from Bellotto's eighteenth-century paintings, and it was inscribed on the World Heritage List in 1980 as the "Historic Centre of Warsaw" — not as a replica of the old town. Japan's Ise Grand Shrine is dismantled and rebuilt from new timber on an adjacent site roughly every twenty years, and both Japan and UNESCO treat the building as a continuously existing thirirteen-hundred-year-old shrine; the resulting friction with Western fabric-based doctrine was one of the pressures that produced the 1994 Nara Document on Authenticity, which widened the notion of authenticity to include the continuity of craft, technique, and tradition. And after the 2019 fire, Notre-Dame was rebuilt with new oak and new vaulting and reopened in 2024, with no serious public dispute that it is the same cathedral that stood there before. Meanwhile, in ordinary national heritage law, a listed building keeps its listing and its legal identity while windows, roofs, timbers, and eventually nearly every visible part are replaced over a century — the practice quietly absorbs the "grandfather's axe" case.

  My question: what theory of identity over time does this whole apparatus — doctrine, inscription decisions, and everyday practice — presuppose? Please do the following:

  1. Reconstruct the implicit theory or theories. Does the fabric-based wing of the doctrine presuppose that a building's identity supervenes on its matter or on spatiotemporal-continuity-with-material-overlap, while the Warsaw and Ise wing presupposes something like a type/token view, a form-continuity view, or a continuation-of-social-function view? Is there a single metaphysics under which both halves are correct, or does the practice only look coherent because "the same building" is being used equivocally — with the equivocation itself doing useful work?

  2. Distinguish strict presupposition from good fit. Say which parts of the practice any adequate theory of persistence must license, and which parts are compatible with several rival views (endurantism with overlap, perdurantist worm theory, a "best-candidate" or replica-friendly account, and a thoroughgoing conventionalism on which institutional identity is whatever the listing and inscription bodies say it is). Where is the practice philosophically underdetermined — where would two metaphysicians who disagree about persistence nevertheless both shrug and accept the Warsaw inscription?

  3. Assess whether the practice actually needs any theory of identity at all. One live possibility is that "authenticity" in heritage discourse is not tracking identity over time but something else: evidential value (original fabric as a record of the past), witness value (a thing that "was there" at an event), or the transmission of skill and intention. If that is right, explain whether the Ship-of-Theseus framing is a mistake imported from the seminar room, or whether the doctrine still commits itself to persistence claims it cannot avoid — for instance in the sentence on a plaque that says this is the shrine founded in the seventh century.

  4. Finally, tell me what would have to change in practice under an explicit replacement of the presupposed view. If heritage law openly adopted the best-candidate or replica-friendly view, would full-scale recreations elsewhere (a rebuilt Palmyra, a fabricated "medieval" quarter) become inscribable, and on what grounds would the line still be drawn? If it adopted outright conventionalism, would any inscription decision retain the power to be a mistake — and is a practice that cannot err still making a claim about identity, or merely recording a designation?

  Please be concrete: anchor each general point to one of the cases described above, and flag explicitly wherever you think the practice is internally inconsistent rather than merely underdetermined.
reasoning: |-
  Hmm, this is a fascinating question at the intersection of metaphysics and heritage conservation. The user wants me to dissect the implicit theories of identity behind various heritage practices like the Warsaw Old Town reconstruction, Ise Shrine rebuilding, and Notre-Dame restoration.

  First, let me map the key cases against philosophical theories of persistence. The Venice Charter approach clearly leans toward material continuity - it treats original fabric as essential for authenticity. This aligns with endurantist views where identity depends on continuous physical matter. But then Warsaw's inscription as the "same" historic center despite 90% reconstruction breaks that model. That feels more like a form of perdurantism where the building is a four-dimensional entity spanning destruction and rebirth.

  The Ise Shrine case is even more challenging - it's explicitly about cultural continuity overriding material persistence. This suggests something like Baker's constitution view, where identity depends on the persistence of certain essential functions or traditions. The Nara Document seems to validate this by expanding authenticity to include intangible aspects.

  For Notre-Dame, what's interesting is the public's immediate acceptance of the rebuilt cathedral as the same entity. This feels like a conventionalist approach - identity is socially constructed through collective intentionality. The listing mechanism itself becomes part of the identity criteria.

  Now about theoretical coherence: I think there's genuine tension here, not just equivocation. Material overlap works for gradual replacement (the grandfather's axe scenario) but fails for Warsaw. Cultural continuity explains Ise but might overextend to problematic replicas. The practice seems to employ different criteria situationally - material for conservation, cultural for reconstructions.

  On whether identity is even the right frame: The user makes a good point about authenticity possibly tracking evidential value rather than strict identity. But the plaque at Ise Shrine claiming continuity since the 7th century shows they can't fully avoid persistence claims. There's an unavoidable performative aspect - declaring something to be identical does social work.

  For practical implications: If heritage adopted a replica-friendly view, we'd need clear criteria for what makes a "best candidate" - probably requiring uninterrupted cultural practice like Ise has. Pure conventionalism would collapse into arbitrariness though - a rebuilt Palmyra without living tradition might still feel illegitimate.

  The real inconsistency appears in how heritage law handles total replacement versus gradual change. They accept 100% replacement over centuries through maintenance (grandfather's axe) but balk at calling a modern reconstruction "authentic" without the continuous practice seen in Warsaw or Ise. That double standard needs either justification or revision.
answer: |-
  Based on a rigorous analysis of heritage doctrine and practice against prominent metaphysical theories of persistence, here is a reconstruction of the implicit commitments, tensions, and practical necessities:

  ### 1. Reconstructed Implicit Theories & Coherence
  The practice presupposes **multiple, context-dependent criteria** for persistence, creating a hybrid model:
  - **Venice Charter Fabric-Focus**: Assumes **endurantism with material overlap**. A building persists iff its original matter exhibits spatiotemporal continuity (even with gradual replacement). *Example*: Permitting piecemeal roof/window replacement while retaining legal identity relies on gradual material overlap, akin to the Ship of Theseus' "slow replacement" scenario.
  - **Warsaw/Ise/Notre-Dame**: Assumes **continuity of constituted entity** (Lynne Rudder Baker) or **ritual-perpetuated type**. The building persists iff its constitutive function/meaning is maintained through culturally recognized practices. *Example*: Ise Shrine’s identity depends on the uninterrupted *Sengu* ritual (transferring the *shintai* spirit-object to the new structure), making material replacement irrelevant. Warsaw’s inscription requires continuity of communal memory/urban form despite material discontinuity.
  - **Grandfather’s Axe in Heritage Law**: Implicitly accepts **conventionalist endurantism**. Identity is preserved through institutional recognition during incremental change, regardless of material overlap thresholds. *Example*: A Grade I listed building remains "the same" legally even after 100% part replacement because the *designation process itself* anchors identity.

  **Coherence?** The practice is **equivocal but functionally coherent**. "Same building" shifts meaning based on *context*:  
  - *Material* for conservation ethics (evidential integrity),  
  - *Functional/constitutional* for cultural continuity (Ise, Warsaw),  
  - *Legal/institutional* for administrative continuity (listed buildings).  
  The tension between Venice and Nara reveals this: Nara explicitly widened "authenticity" to include intangible continuity, accommodating non-Western views. **There is no single metaphysics** reconciling both halves—instead, the apparatus uses *pragmatic equivocation* to serve distinct values (material evidence vs. living tradition).

  ---

  ### 2. Presupposition vs. Compatibility & Underdetermination
  | **Practice**                     | Strict Presupposition                          | Compatible Theories                                                                 | Underdetermined?                     |
  |----------------------------------|------------------------------------------------|-------------------------------------------------------------------------------------|--------------------------------------|
  | **Venice minimal intervention**  | Matter must overlap originals (endurantism)    | Only endurantism with material continuity                                           | **No**: rejects replicas without material links |
  | **Warsaw inscription**           | Continuity of form/meaning (constitution view) | Perdurantism (temporal part spanning destruction), best-candidate, conventionalism  | **Yes**: All non-materialist theories accept it |
  | **Ise Shrine cycles**            | Ritual-perpetuated identity (type-token)       | Conventionalism, constitution view                                                 | **No**: Requires intention/tradition continuity |
  | **Notre-Dame reopening**         | Social convention + functional continuity     | All except strict material endurantism                                              | **Yes**: Matter changed, yet public accepts sameness |
  | **Gradual replacement (listing)**| Institutional designation                     | Conventionalism, endurantism with overlap, perdurantism                            | **Yes**: Any theory allowing "degrees" of change |

  - **Where practice is underdetermined**: Warsaw’s inscription. A *perdurantist* sees a temporal worm with a destruction-shaped gap; a *conventionalist* sees institutional fiat; a *best-candidate theorist* sees Warsaw as the best continuer of the pre-war city. All accept the outcome despite metaphysical disagreement.  
  - **Internally inconsistent**: The **gradual vs. sudden replacement asymmetry**. Heritage law accepts 100% part replacement over centuries (e.g., a timber-framed house with all timbers replaced) but rejects a faithful replica built after demolition *unless* tied to continuous tradition (Ise) or collective memory (Warsaw). This privileges *speed of change* over material/formal continuity—a tension unresolved in doctrine.

  ---

  ### 3. Does Practice Need Identity Theory? Authenticity ≠ Persistence
  **Authenticity tracks multiple values beyond numerical identity**:  
  - **Evidential value**: Original fabric as physical witness (Venice). *Example*: Differentiating repairs at Notre-Dame acknowledges loss of evidence.  
  - **Cultural process value**: Continuity of craft/skill (Nara). *Example*: Ise’s identity relies on mastery passed through generations.  
  - **Symbolic witness value**: "Being there" at events. *Example*: Warsaw’s rubble as witness to destruction, *not* its reassembled bricks.  

  **However, persistence claims are unavoidable**:  
  - The plaque at Ise ("founded in 692 CE") asserts trans-temporal identity.  
  - Legal designations (e.g., "Notre-Dame Cathedral") presuppose a single entity enduring fire/rebuild.  
  - **Conclusion**: The Ship of Theseus framing is *not* a mistake—it exposes implicit persistence commitments in heritage discourse. While "authenticity" is multidimensional, institutions *cannot avoid* identity claims when labeling sites or granting legal status.

  ---

  ### 4. Practical Implications of Theory Adoption
  - **Best-Candidate/Replica-Friendly View**:  
    - *Change*: Rebuilt Palmyra *could* be inscribed **iff** it is the "best candidate" to continue the original’s cultural role—e.g., if Syrians collectively endorse it as their heritage reincarnated.  
    - *Line-drawing*: Excludes fabrications like "medieval quarters" lacking historical ties (no candidate status). Warsaw sets precedent; a Syrian-led Palmyra revival might qualify, but a Disneyfied replica would not.  
  - **Thoroughgoing Conventionalism**:  
    - *Change*: Inscription decisions become self-validating. A "replica Colosseum" in Las Vegas *could* be listed as "authentic" if UNESCO votes it so.  
    - **Problem**: Practice cannot err or make identity claims—it only records preferences. If Palmyra is rebuilt with new materials/conjectural design and inscribed, the claim "this is ancient Palmyra" becomes *true by fiat*, eroding credibility.  
  - **Materialist Endurantism**:  
    - *Change*: Warsaw, Ise, and Notre-Dame lose identity claims. Ise becomes a "20-year-old replica," Warsaw a "post-war reconstruction." Legally, listings would lapse after major material loss.  

  **Critical tension**: Current practice relies on *unspoken boundaries*. Adopting best-candidate theory expands inscription eligibility but requires robust criteria for "candidacy" (e.g., community endorsement, documented traditions). Conventionalism collapses heritage into mere designation, sacrificing the concept of historical witness. The unresolved **gradual-vs-sudden replacement paradox** would demand explicit policy under any theory.

  ---

  **Final Synthesis**: Heritage practice employs a **pragmatic pluralism** of persistence criteria: material continuity for conservation, functional continuity for cultural sites, and institutional continuity for legal purposes. This avoids metaphysical commitment but risks inconsistency when cases overlap (e.g., Notre-Dame’s new spire blending material and symbolic values). The apparatus *does* presuppose identity claims but manages them operationally—revealing that "authenticity" is less a theory of persistence than a *negotiated cultural framework for valuing the past*.
