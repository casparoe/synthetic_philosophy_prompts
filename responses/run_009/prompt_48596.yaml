  ok so i fell down a wikipedia rabbit hole about how objects persist through time and apparently i've developed opinions?? i want to check if they actually fit together. here's my list: (1) a persisting thing is wholly there at every moment it exists — objects do NOT have temporal parts like slices of a loaf of bread; (2) only the present exists, the dinosaurs aren't anywhere, they're just gone; (3) relativity is true, so there's no objective fact about which distant events are happening "at the same time" as me typing this; (4) genuine change means one and the very same object having a property at one time and lacking it at another; (5) backwards time travel is at least logically possible. go through the pairs, tell me which ones clash, which only look like they clash, and what the cheapest fix would be for each, ranked by how bad. also my cousin swears (2) makes it impossible for anything to last longer than an instant which would obviously wreck the whole list, but i don't really see it?
reasoning: |-
