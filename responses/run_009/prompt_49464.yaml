prompt: |-
  Quick context: I teach a small critical-thinking / philosophy of science section at a community college, 14ish students, one 75-minute session, and I just got dumped back into online dating, which is honestly why this topic suddenly matters to me. Every profile says "I love hiking and being spontaneous" and noone believes anyone, and my friend who did her PhD in animal behavior was like "that's just cheap signals, you need the handicap principle" and it clicked. Now I want my students to *feel* why cost is the thing that makes a signal beleivable, not just nod along to the peacock tail example.

  Design an in-class game where that happens instead of me telling them. I'm imagining something like: some students are "employers" and some are "candidates" with hidden types, candidates send signals, employers accept or pass, and we run it twice — once where the signal is free to send and once where it costs something real but small (effort, points, candy, whatever works). The students shouldn't know in advance that the second round is the point; to them it should just be a hiring game with a rule change. Please give me full rules, materials, the scoring/payoff scheme (no real money, and no more than ~5 minutes of setup), and how to assign the hidden types so it's fair. Then a debrief that maps what actually happened onto the machinery: why cheap signals get flooded with fakes, why the cost has to bite the low types harder than the high types for honesty to survive at all, and where they've seen this in their own lives — dating apps, job markets, apologies, whatever comes up.

  Two asks on top of the design. First, tell me honestly what the game can't reproduce: it's basically one-shot, there's no evolution over generations of players, no frequency-dependence, and students might behave nicer than real signalers because I'm watching them. Say which parts of the idea the game genuinely demonstrates and which parts I have to supply in the debrief regardless. Second, tell me what will predictibly go wrong the first time I run it — students colluding, someone gaming the point system, the signal cost being so trivial that nothing changes between rounds — and what the fix is for each.

  Last constraint: don't mention the handicap principle, peacocks, or anything biology-flavored until the debrief. I want them to think they're playing a job-market game and only find out at the end that they've been peacocks the whole time.
reasoning: |-
  We are designing a game to illustrate the handicap principle without using biological terms until the debrief. The game will simulate a job market where candidates signal their quality to employers. The key is to have two rounds: one with free signals and one with costly signals, to show how cost filters out low-quality candidates.

  **Game Title:** The Hiring Game

  **Players:**
  - 14 students: 4 Employers (E1 to E4) and 10 Candidates (C1 to C10)
  - If class size varies, adjust to keep about 1/3 employers and 2/3 candidates.

  **Materials:**
  - Index cards or small pieces of paper for candidate types and signals.
  - A few pieces of candy or small tokens (like paper clips) to use as costly signals in Round 2.
  - A whiteboard or chart to record scores.

  **Setup (5 minutes):**
  1. Assign roles: 4 employers and 10 candidates. (If there are more students, add candidates; if fewer, reduce employers to 3 and adjust candidates accordingly.)
  2. **Hidden Types for Candidates:**
     - There are two types: High (H) and Low (L). We need to assign types such that the high type is genuinely better for the employer, but the candidate knows their own type.
     - Assign 5 high types and 5 low types randomly (or adjust to 4H and 6L if 10 candidates). Write the type on a card and give it to each candidate secretly. Tell them not to reveal it.
     - **Why this is fair:** Random assignment ensures no bias. The proportion is roughly balanced so that employers have a chance to get either.
  3. **Employer Information:**
     - Employers do not know the types of candidates. They only see the signals sent and then decide to hire or not.
  4. **Scoring:**
     - **Candidates:** 
       - If hired, they get 10 points. 
       - If not hired, they get 0.
       - In Round 2, they must pay a cost to send a signal (if they choose to signal). The cost is 3 points for low types and 1 point for high types. (This cost difference is crucial: it must hurt the low type more than the high type.)
     - **Employers:**
       - If they hire a high-type candidate, they get 10 points.
       - If they hire a low-type candidate, they get 0 points.
       - If they do not hire anyone, they get 0 points.

  **Rules:**

  **Round 1: Free Signals**
  - Each candidate decides whether to send a signal (e.g., a paper with the word "SIGNAL" written on it) to an employer of their choice. They can send to one employer only. They are allowed to not send any signal (i.e., stay silent). 
    - *Note: In this round, sending a signal is free (no cost).*
  - Employers observe which candidates sent signals to them. They can only hire one candidate who sent a signal to them. If an employer receives no signals, they get 0 points. If they receive multiple signals, they must choose one to hire.
  - After all choices, record the outcomes and points.

  **Round 2: Costly Signals**
  - Same as Round 1, except now sending a signal has a cost. 
    - To send a signal, a candidate must pay the cost (in points) at the time of sending. 
    - The cost is: 
      - High-type candidates pay 1 point (so if hired, they get 10 - 1 = 9 points; if not hired, they get -1 point).
      - Low-type candidates pay 3 points (so if hired, they get 10 - 3 = 7 points; if not hired, they get -3 points).
    - *Important: The cost is paid regardless of whether they are hired.*
  - Employers again choose one candidate from those who signaled to them (if any) to hire.

  **Game Flow:**
  1. **Round 1 (Free Signals):** 
     - Distribute candidate type cards secretly. 
     - Give each candidate a blank card. They write "SIGNAL" if they wish to signal and then hand it to an employer (they choose which one). If they don't want to signal, they do nothing.
     - Employers collect the signals. Each employer then chooses one candidate from those who signaled to them (if any) to hire. If an employer gets no signals, they don't hire anyone.
     - Record points for employers and candidates.

  2. **Round 2 (Costly Signals):** 
     - Same as Round 1, but now when a candidate sends a signal, they must pay the cost. 
     - Before sending, remind candidates: 
       - High types: if you send, you pay 1 point (so if hired, you get 9; if not, -1).
       - Low types: if you send, you pay 3 points (so if hired, you get 7; if not, -3).
     - Employers do not know the cost structure (they just see who signaled).
     - Employers again choose one candidate to hire from their signalers.
     - Record points.

  **Debrief:**
  After both rounds, reveal the hidden mechanics and relate to the real world.

  1. **What happened?**
     - Ask employers: In Round 1, how did you decide whom to hire? (They had no information, so likely random or based on nothing.)
     - Ask candidates: How many of you signaled in Round 1? (Probably almost all, because it was free and not signaling means no chance of being hired.)
     - In Round 1: Since signaling is free, almost all candidates (both high and low) will signal. Employers have no way to distinguish and may end up hiring low types. Result: Employers often get 0 points (if they hire a low type) and high types might not get hired because of the noise.

     - Round 2: Ask how many high types signaled? (Probably most, because the cost is low and they still want the job.) How many low types? (Probably fewer, because the cost is high and if they think they might not get hired, it's risky.) 
     - Result: In Round 2, the pool of signalers is more likely to be high types. Employers who hire from this pool are more likely to get a high type and earn 10 points.

  2. **Why did this happen?**
     - The cost of the signal made it so that low types found it too expensive to signal when they weren't sure of being hired. High types, even with the cost, still found it worthwhile because the reward (if hired) was high and the cost was low for them.

  3. **Map to the handicap principle:**
     - Now introduce the term: This is the handicap principle. The signal (like a peacock's tail) is costly, but it is more costly for low-quality individuals. Therefore, only high-quality individuals can afford to send the signal. The cost is the "handicap" that makes the signal honest.
     - In Round 1, without cost, the signal was "cheap talk" and everyone used it, so it became meaningless (flooded with fakes).

  4. **Real-world examples:**
     - Dating profiles: Saying "I love hiking" is free and everyone says it, so it doesn't mean much. But if someone posts a picture from the summit of a difficult mountain, that's costly (they had to actually hike it) and thus more believable.
     - Job markets: A college degree is costly (time, money). It signals ability because low-ability individuals are less likely to complete it. But if it becomes too easy (low cost), it loses its value.
     - Apologies: A verbal "sorry" is cheap. But an apology that includes a costly action (like compensation) is more credible.

  **What the game can't reproduce:**
  - **Evolution over time:** In the real world, signals evolve through generations of animals or through cultural evolution. Our game is one-shot.
  - **Frequency-dependence:** The value of a signal might depend on how many others are using it. In our game, the cost is fixed, but in reality, if too many high types signal, the signal might become less effective (but that's not modeled here).
  - **Student behavior:** Students might not act purely out of self-interest because they know it's a game and the instructor is watching. For instance, a low type might still signal in Round 2 to "help" an employer, or employers might not hire randomly in Round 1 but try to be fair. This might weaken the effect.

  **What you have to supply in debrief:**
  - Explain that in nature, the cost is often survival risk (like the peacock's tail making it easier for predators to catch them) and that the signal evolves because high-quality individuals survive despite the cost. In our game, we simulated this with points.

  **Predictable problems and fixes:**
  1. **Problem: Students collude.**
     - Example: Candidates agree not to signal in Round 2 to "protest" the system or employers agree to hire only specific candidates.
     - **Fix:** Stress that this is an individual decision game and they should act in their own self-interest to maximize their points. Also, keep the game moving quickly to reduce time for collusion.

  2. **Problem: Someone games the point system.**
     - Example: A candidate might think, "I'm a low type and I'll signal in Round 2 because I might get lucky and get hired, and 7 points is better than 0." But note: if they are not hired, they get -3. So it's a risk. This is actually part of the design. But if too many low types signal, the effect might not show.
     - **Fix:** Adjust the cost if necessary. If in Round 2 you see too many low types signaling, you can increase the cost for low types in a re-run (but you might not have time). Alternatively, pre-game: explain that the goal is to maximize their own points and they should think about the risk.

  3. **Problem: The signal cost is too trivial.**
     - If the cost (1 and 3 points) is too small compared to the reward (10 points), low types might still signal. 
     - **Fix:** Make the cost more significant. For example, set the cost for low types to 4 or 5 points (so if hired, they get 6 or 5; if not, they lose 4 or 5). For high types, keep it at 1 or 2. You can adjust during setup if you see the issue.

  4. **Problem: Employers not hiring anyone.**
     - In Round 1, if an employer gets too many signals, they might feel overwhelmed and not hire. Or in Round 2, if they get only low-type signals (by chance) and they suspect it, they might not hire.
     - **Fix:** Require employers to hire one candidate if they received at least one signal. Otherwise, they get 0 anyway.

  5. **Problem: Uneven distribution of signals to employers.**
     - Some employers might get many signals, others none. This might cause resentment.
     - **Fix:** Assign employers randomly and tell candidates they can choose any employer. If one employer gets no signals, they get 0 and that's part of the game.

  **Final note:** The game is designed to be quick and illustrative. The key takeaway should be that when signals are free, they become meaningless because everyone uses them. When they are costly and the cost is higher for low-quality individuals, they become honest indicators of quality.

  Run the game, then in the debrief, reveal that they were acting just like peacocks (high-quality males) with their costly tails and peahens (employers) choosing based on that signal. Then tie it back to dating profiles and other real-life signals.
answer: |-
  ### The Hiring Game: Critical Signals Edition  
  **Objective:** Students experience why costly signals are credible through a simulated job market. Employers hire candidates based on signals, with two rounds: free signals (Round 1) and costly signals (Round 2). The "aha" moment comes when they see low-quality candidates drop out in Round 2 due to costs, making signals meaningful.

  ---

  ### **Game Setup**  
  **Time:** 15 minutes total (5 min setup, 5 min per round, 5 min debrief).  
  **Players:**  
  - **4 Employers** (randomly assigned via drawing names from a hat).  
  - **10 Candidates** (the rest of the class).  

  **Materials:**  
  - Index cards (1 per candidate for their "type," 1 per employer for hiring decisions).  
  - Candy (e.g., 20 small chocolates) or poker chips (10 red for "low cost," 10 blue for "high cost").  
  - Whiteboard to track scores.  

  **Hidden Types (Fair Assignment):**  
  - Secretly assign candidate "quality types" using index cards:  
    - **5 High-Type (H) Candidates:** Truly skilled (e.g., "innovative problem-solver").  
    - **5 Low-Type (L) Candidates:** Unskilled (e.g., "avoids hard tasks").  
  - *How to assign fairly:* Shuffle index cards with "H" or "L" written on them, and have candidates draw blindly. Employers are not told about types—only that candidates vary in quality.  

  **Scoring (No Real Money):**  
  - **Candidates:**  
    - If **hired**: +10 points.  
    - If **not hired**: 0 points.  
    - **Round 2 only:** Pay a **cost** to signal.  
      - High-Type (H) cost: 1 point (or 1 piece of candy).  
      - Low-Type (L) cost: 3 points (or 3 pieces of candy).  
    *(Costs are paid upfront when signaling, even if not hired. Candy acts as point tokens—e.g., 1 candy = 1 point.)*  
  - **Employers:**  
    - Hire a **High-Type (H)**: +10 points.  
    - Hire a **Low-Type (L)**: 0 points.  
    - Hire **no one**: 0 points.  

  ---

  ### **Game Rules**  
  **Round 1: Free Signals (Cheap Talk)**  
  1. **Signal Phase (1 min):**  
     - Candidates decide whether to send a "signal" (e.g., raising a hand or saying "I signal!").  
     - **No cost** to signal. Candidates can signal to any employer (or none).  
     - *Employers observe who signals but don’t know types.*  
  2. **Hiring Phase (2 min):**  
     - Each employer **must hire one candidate** who signaled to them (if any). If multiple signal, the employer picks one at random (draw names from a hat). If no one signals to them, they hire no one.  
  3. **Scoring (1 min):**  
     - Record points on the whiteboard. Candidates get +10 if hired; employers get +10 if they hired H, 0 otherwise.  

  **Round 2: Costly Signals (The Reveal)**  
  1. **Signal Phase (1 min):**  
     - Same as Round 1, but **signaling now costs points/candy**:  
       - **H candidates** pay 1 point (give 1 candy to instructor).  
       - **L candidates** pay 3 points (give 3 candies to instructor).  
     - Candidates decide again whether to signal (pay cost upfront).  
  2. **Hiring Phase (2 min):**  
     - Employers hire one signaling candidate (same random selection if multiple).  
  3. **Scoring (1 min):**  
     - Update scores: Hired candidates get 10 points **minus cost** (e.g., an H candidate hired gets 9 points). Employers score same as Round 1.  

  ---

  ### **Debrief: Connecting to Reality**  
  **(5 min—Wait until here to reveal the biology link!)**  
  1. **What Happened?**  
     - **Round 1 (Free):** Most candidates signaled (even L types). Employers could not distinguish quality—likely hired L types by chance. Result: Employers often scored 0, and signals were meaningless.  
     - **Round 2 (Costly):** Fewer L types signaled (cost too high vs. risk of not being hired). More H types signaled (low cost, high reward). Employers hired more H types, scoring higher.  

  2. **Why Cost Creates Trust:**  
     - **Cheap signals flood with fakes:** When signaling is free (e.g., saying "I love hiking"), anyone can lie. Signals become noise.  
     - **Cost must hurt low types more:** In Round 2, L types lost 3 points for signaling—too risky if they might not get hired. H types only lost 1 point, so they still signaled. Cost acts as a **filter** for honesty.  
     - **The key insight:** A signal is credible **only if** it’s too expensive for low-quality actors to fake.  

  3. **Real-World Mapping (Ask Students for Examples):**  
     - **Dating apps:** "I’m spontaneous!" = free signal (meaningless). A rock-climbing photo = costly signal (requires real skill/risk).  
     - **Job markets:** A degree = costly signal (time/money). Low-skilled candidates drop out, making degrees credible.  
     - **Apologies:** "Sorry" = free (cheap). Replacing broken item = costly (proves sincerity).  

  4. **The Big Reveal:**  
     - "You’ve just experienced the **handicap principle**—seen in peacock tails. The tail’s cost (it attracts predators) proves the peacock is fit enough to survive it. Today, you were peacocks (candidates) and peahens (employers)!"  

  ---

  ### **What the Game Can’t Reproduce (Supply in Debrief)**  
  1. **No evolution/frequency-dependence:** Real signals evolve over generations (e.g., peacock tails getting bigger). Here, it’s one-shot—no adaptation to others’ strategies.  
  2. **No "competitive" dynamics:** Employers don’t bid for candidates; signals aren’t "traded" in a market.  
  3. **Social niceness:** Students might avoid "screwing over" peers (e.g., L types signaling in Round 2 to help employers). In reality, self-interest dominates.  
  **→ Debrief add-on:** "In the wild, low-quality signalers die if they fake costly signals. Here, you were *kinder*—real markets/dating aren’t!"  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Problem: Students collude (e.g., "Let’s all signal in Round 2!").**  
     - **Fix:** Emphasize individualism: "You’re fired if you don’t maximize your OWN points!" Run phases quickly to limit chatter.  

  2. **Problem: Candy cost feels trivial—nothing changes between rounds.**  
     - **Fix:** Use points (not candy) or make costs hurt:  
       - For L types, set cost to 8 points (so hiring nets only 2 points).  
       - Threaten: "If you go negative, you lose real candy from Round 1."  

  3. **Problem: Employers ignore signals or hire randomly.**  
     - **Fix:** Force employers to hire someone if signals exist (random draw ensures no bias). Scare them: "If you hire an L type, you get $0 salary!"  

  4. **Problem: High-type candidates don’t signal in Round 2 (e.g., fear of wasting points).**  
     - **Fix:** Pre-game pep talk: "High types—signaling is your ONLY shot at 9 points!" Adjust costs if needed (e.g., H cost = 0.5 points if too risk-averse).  

  5. **Problem: Too many/few employers (skews hiring chances).**  
     - **Fix:** Scale candidates per employer (e.g., 3:1 ratio). If imbalance, let employers "split" candidates or add a "unemployment" penalty.  

  **Pro-Tip:** Start Round 1 as a "practice." Students won’t realize Round 2 is the point until they see the cost bite.  

  This game works because it’s fast, visceral (candy = pain), and the dating/job market frame is relatable. By the debrief, they’ll see why your dating app matches are all yelling "I’M SPONTANEOUS!"—and why you don’t believe them.
