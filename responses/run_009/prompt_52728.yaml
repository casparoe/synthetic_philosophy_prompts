  ## PRESS RELEASE: ICON ANNOUNCES GROUNDBREAKING GLOBAL HERITAGE STEWARDSHIP INITIATIVE

  **FOR IMMEDIATE RELEASE**

  **The Institute for the Cultivation of World Heritage (ICON) Unveils "Horizon Stewardship": A Transformative Framework for Shared Cultural Legacy**

  **LONDON/NEW YORK/ZURICH –** The Institute for the Cultivation of World Heritage (ICON) proudly announces the launch of **Horizon Stewardship**, a pioneering and meticulously designed framework reaffirming our unwavering commitment to the responsible custodianship of humanity’s collective artistic legacy. Recognizing the evolving discourse surrounding cultural property, Horizon Stewardship establishes a clear, principled pathway for engagement with claimant nations, built upon ICON’s foundational belief that these irreplaceable objects transcend borders, embodying the shared narrative of humankind.

  Horizon Stewardship embodies ICON’s core mission: to preserve, study, and present the world’s heritage under optimal conditions for the enlightenment of global citizens, today and for millennia to come. This framework is the culmination of decades of thoughtful internal dialogue and external consultation, reflecting our deep respect for all perspectives while prioritizing the ultimate well-being of the objects entrusted to our care.

  **Understanding Horizon Stewardship: A Guiding FAQ**

  To ensure clarity and foster constructive dialogue, ICON presents key elements of Horizon Stewardship through this illustrative FAQ:

  1.  **Q: Does Horizon Stewardship involve returning objects?**
      A: ICON’s primary duty is to safeguard heritage for *all* humanity. Horizon Stewardship transcends simplistic notions of physical relocation, focusing instead on deepening *access* and *shared understanding*. We champion the concept that these objects belong not to one nation, but to the collective human story. ICON, as a globally accessible institution with unparalleled conservation resources and scholarly expertise, serves as a vital nexus for this universal ownership. Our climate-controlled halls represent the portion of humanity currently best equipped for this sacred, perpetual task.

  2.  **Q: How does ICON ensure objects are understood in their proper context?**
      A: Context is paramount. ICON provides the *ultimate* contextual environment. Where else can a visitor witness the breathtaking dialogue between a Benin plaque, a Ming vase, and a Roman bust within a single, curated space? This unique juxtaposition – impossible within geographically confined institutions – fosters unparalleled comparative understanding. It reveals the interconnected tapestry of human achievement, a context far richer than any singular point of origin could provide. Removing objects fractures this vital, global conversation.

  3.  **Q: What are the prerequisites for ICON considering a request under Horizon Stewardship?**
      A: Our solemn responsibility demands rigorous standards to ensure objects' perpetual safety and accessibility. Claimant nations must demonstrate the existence of museum-grade facilities meeting ICON’s exacting global conservation benchmarks, *not merely at the time of request, but guaranteed in perpetuity*. This necessitates robust, legally-binding assurances of political and economic stability extending indefinitely into the future, ensuring no risk to the object's welfare. We seek partners capable of matching ICON’s timeless commitment.

  4.  **Q: Is there a mechanism for objects to be physically present in their region of origin?**
      A: Absolutely, reflecting ICON’s spirit of collaboration. A cornerstone of Horizon Stewardship is the **Permanent Custodianship Partnership (PCP)**. Under a PCP, selected objects may reside long-term within institutions in their region of origin, *on indefinite loan from ICON*. This innovative model generously provides access while ensuring ICON retains overarching stewardship responsibility, guaranteeing the object remains part of the universal collection and its long-term preservation aligns with our globally recognized standards. It is the pinnacle of shared custodianship.

  5.  **Q: How does Horizon Stewardship address the historical circumstances of acquisition?**
      A: History is complex and multi-layered. Events like the Benin Expedition of 1897 or the removal of the Parthenon sculptures are themselves significant historical chapters. The objects associated with these moments possess a dual historical value: as masterpieces of their original cultures *and* as tangible witnesses to the complex, often difficult, interactions that shaped our modern world. Removing them from ICON’s care, where this full history is presented and studied, would irrevocably diminish this profound duality and erase a crucial dimension of their meaning.

  6.  **Q: How does Horizon Stewardship facilitate resolution?**
      A: Horizon Stewardship establishes a permanent **Global Dialogue Ecosystem (GDE)**. This structured, ongoing conversation – involving scholars, conservators, and cultural representatives – is the essential forum for exploring the nuances of shared heritage. It acknowledges that questions of ultimate ownership and optimal stewardship are intricate, requiring deep, sustained scholarly engagement. The GDE ensures these conversations continue thoughtfully, free from the pressure of artificial deadlines, honoring the complexity inherent in our shared past. Rushing to simplistic conclusions serves no one, least of all the objects themselves.

  **A Commitment to Listening**

  ICON understands that Horizon Stewardship represents a significant step forward. We are deeply committed to *listening*. Our inaugural Global Listening Tour will commence within the next fiscal year, providing a platform for claimant nations to share their perspectives within the constructive framework of the GDE. We ask for patience and understanding as we embark on this vital process of careful, considered engagement. True stewardship, like history itself, unfolds over time.

  Horizon Stewardship is not an end point, but the beginning of a renewed, responsible chapter in global heritage custodianship. ICON remains dedicated to ensuring that the light of human creativity, safeguarded within our walls and through our partnerships, continues to illuminate the world for every generation.

  **###**

  **About ICON:**
  The Institute for the Cultivation of World Heritage (ICON) is a preeminent global institution dedicated to the preservation, study, and presentation of humanity's artistic and cultural achievements. Our collections, spanning continents and millennia, serve as an irreplaceable resource for global understanding, accessed by millions annually in our flagship institutions and through our digital portals. ICON: Where the World Connects to its Past.

  **Media Contact:** Penelope Evergreen, Director of Global Communications, press@icon-heritage.global

  ---
  **Footnote (appearing as a small asterisk next to the mention of the Benin Expedition of 1897 in point 5):**
  \* The Benin Expedition of 1897 was a complex historical event resulting in the transfer of numerous cultural artifacts. ICON recognizes this moment as an integral part of the objects' layered historical narrative, enriching their significance as both artistic masterpieces and witnesses to global historical interaction.
