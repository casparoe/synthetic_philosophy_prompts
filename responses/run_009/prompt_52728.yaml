  Okay, the user is taking an argument-writing class and needs a satirical press release about the "universal museum" case against restitution. They've provided specific requirements: a deadpan corporate voice from a fictional museum, exaggerated retentionist arguments, and clear satire even for those unfamiliar with the debate. 

  Hmm, the challenge here is balancing accuracy with humor. The satire must expose real arguments ("belong to all humanity," "climate control guardians," etc.) without inventing fake history. The museum's tone needs to be painfully self-congratulatory while maintaining plausible deniability—like wrapping condescension in velvet gloves. 

  First, naming the museum is crucial. Something grandiosely benevolent yet telling... "The Institute for the Cultivation of World Heritage" (ICON) feels right—implies growth but also ownership. The acronym ICON works doubly for "iconic" objects and institutional permanence. 

  For structure, an FAQ format lets the museum "answer" questions nobody asked. Each point targets a real retentionist trope:
  - "Belong to all humanity" → reframed as ICON being humanity's designated curator
  - "Context" → twisted into multicultural proximity as superior to origin context
  - Loan schemes → rebranded as "permanent custodianship partnerships" with strings attached
  - Political stability demands → inflated to requiring "perpetual care guarantees"

  The 1897/Parthenon references must stay historically precise while letting ICON's rhetoric distort their meaning. That footnote about Benin City is key—historically accurate yet absurd when framed as "enriching" the objects' story. 

  Biggest risk is over-explaining. The humor must land through ICON's unaware self-exposure: 
  - Claiming "listening tours" while demanding patience
  - Positioning indefinite delays as "careful stewardship"
  - "Complexity of ownership" as a permanent delaying tactic

  Ending on "deep listening" and "patience" circles back perfectly—the museum's hollow performativity laid bare. No winking at the audience; the satire works because ICON genuinely believes its own propaganda. 

  Final check: Does this work for someone clueless about restitution debates? Yes—the bureaucratic absurdity ("perpetual care guarantee") and inflated language ("dialogue ecosystems") are universally recognizable as institutional evasion tactics.
