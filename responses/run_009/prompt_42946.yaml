    "activity_name": "The Zogian Web: Belief Revision Simulation",
    "best_moment": "Report 4 (2+3=6) landing—groups realizing they *can* revise math but at catastrophic cost, exposing Quine's 'no immunity' thesis.",
    "mapping": [
      {
        "what_happened": "Groups revised observational statements (e.g., 'sky-apples taste sweet') with minimal tokens.",
        "quinean_point": "Peripheral statements are empirically revisable (low cost)."
      },
      {
        "what_happened": "Groups struggled to define 'definition' when defending green cards, looping through synonyms.",
        "quinean_point": "Circularity of analyticity explanations (e.g., via synonymy or semantic rules)."
      },
      {
        "what_happened": "Report 3 (H₃O) forced revisions in logic ('denser sinks') or definitions ('water'), causing chain reactions.",
        "quinean_point": "Holism: conflict propagates through the web, requiring system-wide adjustments."
      },
      {
        "what_happened": "Groups revised math/logic (red cards) only after exhausting options, often with ad-hoc patches (e.g., 'only for sky-apples').",
        "quinean_point": "No statement is unrevisable; logic is protected by pragmatic 'graded centrality'."
      }
    ],
    "predicted_failures": [
      {
        "problem": "Holdout student paralyzes group by refusing all revisions.",
        "fix": "Use token banking—force them to quantify the cost of rigidity (e.g., 'Holding 2+3=5 costs 4 tokens; is it worth it?')."
      },
      {
        "problem": "Groups miss connections between statements, revising haphazardly.",
        "fix": "Facilitator prompts: 'Look at lines between cards. What else breaks if you change this?'"
      },
      {
        "problem": "Debate about fictional scenario distracts from philosophy.",
        "fix": "Intervene: 'This isn’t about Zog—it’s about how *any* knowledge system responds to shocks.'"
