  ### **Why This Works**  
  - **No Pre-Lecture:** The activity front-loads confusion, making Quine’s arguments feel earned.  
  - **Gradient Emerges:** Token costs force pragmatic choices, mirroring Quine’s "minimal mutilation."  
  - **Circularity in Action:** Students’ floundering over "what makes it a definition?" replicates Quine’s critique.  
  - **Holdouts Handled:** Token banking validates Quine’s "come what may" as a costly choice, not a flaw.  

  This turns Quine from a handout into a lived "aha!"—where students tear down the analytic/synthetic wall themselves.
