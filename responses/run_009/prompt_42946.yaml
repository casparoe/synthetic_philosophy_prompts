    "what_activity_cannot_reproduce": "The deep pragmatic entrenchment of beliefs over time. In 80 minutes, students experience revisability as a choice, not the lived ‘weight’ of centuries of scientific practice protecting (e.g.) logic. The gradient feels asserted, not earned.",
