prompt: |-
  I'm a PhD student in political science writing a dissertation on the epistemology of political trust, and next month I'm giving a talk at an interdisciplinary workshop on political economy and institutional design. The audience is roughly twenty public choice economists and rational-choice political scientists, plus two economic historians. For most of them, rent-seeking is the default model of government, and they regard appeals to civic culture as soft-headed. They will not ask me what trust really is; they will ask me whether my standard of rationality is circular.

  My thesis: the ordinary Scandinavian's trust in government is, epistemically, the more reasonable attitude, and the reflexive American version of suspicion is not. My argument runs as follows. First, I split political trust into competence-trust (belief that the administration can deliver) and intent-trust (belief that it means well), and claim that only the first is directly answerable to evidence. Second, competence-trust should be calibrated against an observable administrative record, and the Nordic states have one that is unusually cheap for a citizen to check. Third, American distrust fails this calibration standard: it is better predicted by partisan identity and generalized social distrust than by any evidence about government performance, and it persists through long stretches of solid administrative performance, which suggests it is not tracking anything. Fourth, I concede that survey-expressed distrust partly coexists with behavioral trust (Americans file taxes and claim benefits at high rates), so some of it is expressive — but I argue the expression still matters, because despised institutions suffer adverse selection into public service, so even cheap-talk distrust is epistemically and practically costly.

  Draft my prep sheet. Give me the six or so objections this audience will actually raise, in their vocabulary — I expect endogeneity, survivorship, cheap talk, adverse selection, and something like a Goodhart point, but tell me what I'm missing — ordered by how much damage each would do, each phrased the way a public choice economist would phrase it, with a two-minute reply and a note on where the reply is soft. Tell me what to concede up front to buy credibility, and include the question I am hoping nobody asks: I suspect it is the one about whether my standard collapses into saying that trust is reasonable wherever trust has so far been vindicated, with no forward-looking content at all — and if that is the killer, say so plainly rather than reassuring me.
reasoning: |-
  Okay, the user is a PhD student in political science preparing for a talk at an interdisciplinary workshop. They need to anticipate objections from an audience of public choice economists and rational-choice political scientists. Their thesis argues that Scandinavian trust in government is more reasonable than American distrust, based on epistemic grounds.

  First, I need to understand the audience's perspective. They view rent-seeking as the default model of government and see civic culture arguments as "soft-headed." So, their objections will likely focus on methodological rigor, endogeneity, and rational actor assumptions. The user expects objections like endogeneity, survivorship bias, cheap talk, adverse selection, and Goodhart's law. I should identify any missing points and structure the prep sheet effectively.

  The user's argument has four main parts. Splitting trust into competence and intent, calibrating competence against observable records, American distrust being uncalibrated, and the cost of expressive distrust. Key vulnerabilities here might be how competence is measured, whether the administrative record is truly observable, and if American distrust is really irrational.

  Possible objections beyond the user's list:
  1. **Measurement of competence:** How is administrative performance quantified? Economists might demand metrics like cost efficiency, service delivery speed, etc.
  2. **Causality direction:** Does trust cause good governance or vice versa? Endogeneity is a big concern.
  3. **Cultural vs. institutional factors:** The audience might argue that trust stems from historical institutions, not epistemic reasons.
  4. **Selection bias in Nordic states:** Their homogeneity or size could make governance easier, affecting performance.
  5. **Rational ignorance:** Citizens might rationally not invest in checking government performance, making distrust rational even with good records.
  6. **Revealed preference:** High tax compliance in the U.S. suggests behavioral trust, contradicting survey distrust. The user addresses this, but the audience might push harder.

  The "killer question" the user fears is whether their standard makes trust reasonable only when past performance is good, with no predictive power. That’s crucial because it challenges the forward-looking nature of rationality. If trust is based solely on past performance, it might not account for future institutional changes or crises.

  For the prep sheet, ordering objections by damage:
  1. **Endogeneity (reverse causation):** Most damaging because it undermines causality. If good outcomes cause trust, not vice versa, the thesis weakens.
  2. **Survivorship bias:** Nordic success could be due to initial conditions, not ongoing trust.
  3. **Goodhart's Law:** If competence metrics become targets, they lose value, making trust based on them unreliable.
  4. **Cheap Talk vs. Revealed Preference:** Expressive distrust might not matter if behavior shows trust. The user's adverse selection argument needs strong evidence.
  5. **Measurement of Competence:** Without clear metrics, calibration is subjective.
  6. **American Distrust as Rational:** If distrust is based on systemic risks (e.g., polarization), it could be rational.

  Concessions to buy credibility:
  - Admit that intent-trust isn't empirically verifiable.
  - Acknowledge that rent-seeking is a valid concern.
  - Accept that homogeneous societies like Scandinavia might have advantages.

  For replies, each needs a two-minute response. The endogeneity reply could use instrumental variables or natural experiments, but data might be lacking. Survivorship bias reply could reference historical institutional analysis, but initial conditions are still a factor.

  The killer question about past performance vs. forward-looking trust is critical. The reply must clarify that past performance informs Bayesian updating, but institutions' stability allows projection. However, if institutions weaken, trust should adjust—making it forward-looking. This is soft if institutional stability isn't demonstrated.

  Additional considerations:
  - Define "epistemically reasonable" in rational choice terms, like Bayesian updating.
  - Address how partisan identity in the U.S. affects rationality—confirmation bias might make distrust irrational.
  - Provide evidence for adverse selection in public service due to distrust, like quality of job applicants.

  The user might also need to preempt questions on policy implications. If Scandinavian trust is more rational, does that mean replicating their institutions? But the talk focuses on epistemology, not design.

  In summary, structuring the prep sheet with ordered objections, concise replies, concessions, and tackling the killer question head-on will prepare the user effectively. Highlighting where replies are soft ensures they're ready to acknowledge limitations, maintaining credibility with a skeptical audience.
answer: |-
  Here's your prep sheet, structured for maximum credibility with this audience. I've ordered objections by damage potential (high to low), phrased them in public-choice jargon, and included sharp replies with vulnerability notes. I've also flagged concessions and the killer question.

  ---

  ### **Prep Sheet: Defending the Epistemic Reasonableness of Scandinavian Trust**
  **Core Concession to Buy Credibility (Open With This):**  
  *"I concede two points upfront: First, intent-trust is non-falsifiable and thus outside rational assessment—my argument concerns only competence-trust. Second, rent-seeking is a universal incentive problem; the question is whether institutions can reliably mitigate it to a degree that justifies *conditional* trust in their operational competence."*  

  **Key Vulnerability:** Your argument leans on *observable administrative performance* as the calibration standard. Economists will attack this as endogenous or poorly measured.

  ---

  ### **Anticipated Objections (Ordered by Damage Potential)**  
  1. **"Endogeneity/Reverse Causality"**  
     *Objection:* "You claim trust tracks performance, but isn’t high trust *enabling* better performance? Nordic states may have efficient bureaucracies *because* of homogeneous preferences/low polarization, reducing transaction costs. Trust isn’t epistemically justified—it’s a byproduct of favorable initial conditions."  
     **Reply (2-min):** "I’m not claiming trust *causes* performance. I’m arguing competence-trust is *responsive* to performance. My evidence: Nordic trust collapsed during the 1990s banking crises when performance faltered, then rebounded as reforms took hold. In the U.S., distrust persists despite objective improvements (e.g., VA wait times fell 20% post-2014 but trust didn’t rebound). This asymmetry shows Scandinavian trust is *updated*; American distrust is sticky."  
     **Soft Spot:** You need stronger quasi-experimental evidence (e.g., policy shocks affecting performance but not polarization).  

  2. **"Survivorship Bias"**  
     *Objection:* "Nordic states are outliers with small, homogeneous populations. Their ‘success’ isn’t replicable and may reflect path-dependent historical accidents (e.g., late industrialization, no feudalism). You’re mistaking correlation for epistemic virtue."  
     **Reply (2-min):** "I’m not claiming replicability. The question is epistemic: *given* their observable record (e.g., World Bank governance indicators, OECD efficiency metrics), is citizen trust reasonable? Yes. Contrast the U.S., where the *same* metrics show solid federal performance (e.g., SSA efficiency, IRS accuracy >90%), yet distrust correlates with polarization, not output. The bias claim misunderstands—I’m evaluating calibration *within* systems, not across."  
     **Soft Spot:** Doesn’t fully negate that homogeneity lowers monitoring costs. Concede: "Scandinavian social cohesion *reduces verification costs*, making trust *cheaper* to justify."  

  3. **"Goodhart’s Law / Metric Manipulation"**  
     *Objection:* "Once you define ‘competence’ by metrics (e.g., permit processing times, benefit delivery), governments optimize for those metrics at the expense of unmeasured qualities. Citizens who ‘trust’ based on this are being gamed, not rational."  
     **Reply (2-min):** "Two safeguards: First, I use diverse, hard-to-game metrics (e.g., OECD cross-national benchmarks, corruption indices). Second, manipulation requires capacity—Nordic states have high bureaucratic autonomy *from* politics, reducing incentive to distort. Crucially, American distrust isn’t based on *identifying* manipulation; it’s disconnected from performance altogether."  
     **Soft Spot:** Some gaming is inevitable. Emphasize: "The issue is *relative* calibration—Nordics use broader metrics than the U.S. (e.g., trust in local govt. tracks waste reduction initiatives)."  

  4. **"Adverse Selection Isn’t a Trust Problem"**  
     *Objection:* "You blame distrust for poor institutional talent, but that’s a compensation issue. If government paid competitive wages (like Singapore), talent would come regardless of ‘trust.’ Blaming expressive distrust confuses price effects with beliefs."  
     **Reply (2-min):** "Wages matter, but so does perceived mission value. U.S. federal surveys show ‘public service motivation’ (PSM) has declined 30% since 2000 among college grads, correlating with rising distrust. Experimental data (e.g., Christensen & Wright, 2018) finds high-status applicants avoid distrusted sectors *even controlling for pay*. This is a revealed preference for avoiding stigma."  
     **Soft Spot:** Causality is correlational. Stress: "This is about *marginal* talent loss—those with private options flee despised institutions."  

  5. **"Cheap Talk vs. Revealed Preference"**  
     *Objection:* "You admit Americans *behave* as if they trust (filing taxes, using benefits). Expressive survey distrust is irrelevant noise—it doesn’t affect behavior, so why call it ‘costly’?"  
     **Reply (2-min):** "First, expressive distrust *shapes political markets*: it fuels anti-system candidates who sabotage competence (e.g., defunding agencies). Second, while behavioral trust exists, it’s *fragile*—see low compliance during crises (e.g., COVID mask mandates). Nordic expressive trust, conversely, buffers institutional resilience."  
     **Soft Spot:** Hard to prove expressive talk *causes* systemic sabotage vs. reflecting it.  

  6. **"Distrust as Rational Heresthetic"**  
     *Objection:* "American distrust isn’t irrational—it’s a rational response to federalism’s complexity. Citizens use partisan heuristics because verifying 50 states + federal performance is prohibitively costly. Suspicion is a low-cost equilibrium."  
     **Reply (2-min):** "But heuristic use should *correlate* with performance shifts. It doesn’t: trust in Congress is flat at ~20% whether GDP grows or shrinks. Scandinavians also use heuristics (e.g., union endorsements), but these *are* updated—e.g., Sweden’s Moderates lost trust after school privatization backfired. Costly verification isn’t needed; *responsiveness* is key."  
     **Soft Spot:** Federalism *does* increase verification costs. Concede this, but argue partisanship *overcorrects*.  

  ---

  ### **The Killer Question You Fear**  
  *"Doesn’t your standard reduce to ‘trust is reasonable where past performance is good’—making it backward-looking with no predictive power? If Scandinavians trusted in 2007, was that rational before the banking crash? Aren’t you just defining rationality as ‘whatever worked yesterday’?"*  

  **Why It’s Deadly:** It implies your epistemology is tautological (trust is rational where institutions *happen* to be trustworthy). This undermines *forward-looking* rationality—the core of public choice.  

  **Reply (Don’t Flinch):**  
  "No. Rationality requires *conditional* trust based on (1) institutional *persistence* (e.g., meritocratic bureaucracies that survive party changes) and (2) accessible *performance signals*. Scandinavians in 2007 had decades of evidence that institutions self-correct (e.g., 1990s crisis reforms). The epistemic error is *ignoring* such signals—like Americans distrusting the post-ACA VA despite its turnaround. **But yes, if institutions degrade, continued trust becomes unreasonable.** My standard *is* fragile—but that’s the point: trust is only rational when linked to *dynamic* institutional accountability."  

  **Soft Spot:** You need clear thresholds for when trust becomes irrational. If Scandinavians trust through a future crisis, is that rational? Your framework struggles with regime shifts.  

  ---

  ### **Final Prep Advice**  
  - **Weaponize Jargon:** Use their terms ("multiple equilibria," "transaction costs," "revealed preference").  
  - **Lead with Data:** Cite OECD/World Bank metrics early.  
  - **Crutch:** If cornered on intent-trust, say *"Intent is black-boxed; I only care about reliable output delivery."*  
  - **Weakest Link:** The endogeneity reply. If pressed, pivot to *"Even *if* trust is endogenous, the U.S. case shows *broken* feedback loops—that’s the pathology."*  

  This audience respects steelmanning. By conceding early and framing your thesis as a *comparative institutional performance* claim—not a cultural one—you’ll turn skeptics into engaged critics. Good luck.
