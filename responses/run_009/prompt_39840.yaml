prompt: |-
  i'm writing a novel set in the French Revolution, roughly 1789 to 94, narrated by a middling provincial lawyer who ends up voting for the king's death and then gets guillotined by his own faction. before drafting i wrote down what i actually believe about the Revolution so my narrator's inner life isnt just a pile of clichés, and now i want an audit of whether my list hangs together: (1) the Revolution was basically driven by fiscal collapse and class interest, and the Enlightenment language of rights was mostly picked up after the fact to justify what people were doing anyway; (2) the Terror is best explained by ideology — the Jacobins turned on everyone, including each other, because they sincerely believed politics was a war between virtue and corruption; (3) revolutions devouring their children is structural, any revolution that has to consolidate under threat eats its moderates no matter who's on top; (4) the whole thing was deeply contingent — one different call at Varennes or the 1792 war vote and you get a boring constitutional monarchy with no Terror at all; (5) individual character was a real historical force, my narrator's specific vanity and fear actually moved events rather than just decorating them. tell me which pairs of these are genuinely in tension and how badly, which only look like it, and what the cheapest revision would be, because right now i genuinely cant tell wether i'm even allowed to write Robespierre as a sincere believer given the rest of the list. exactly five numbered points, a sentence or two each, no intro or conclusion, and make the fifth one say how confident you are in the audit overall and which of your judgments you're least sure of.
reasoning: |-
  Okay, the user is writing a historical novel set during the French Revolution and has outlined five core beliefs about the Revolution that they want to incorporate into their narrator's perspective. They're asking for an audit of these points to identify tensions, inconsistencies, and potential revisions. 

  First, I need to unpack each of their five points carefully. Point 1 argues that material factors (fiscal collapse, class interests) were primary drivers, with Enlightenment ideals serving as post-hoc justification. Point 2 claims ideology (virtue vs corruption) explains the Terror's internal purges. Point 3 sees revolutionary self-devouring as structural inevitability under threat. Point 4 emphasizes contingency - that minor changes could've prevented the Terror entirely. Point 5 insists individual psychology (vanity, fear) had causal power.

  Hmm... the most obvious tension leaps out between Point 2 (ideology as sincere driver of Terror) and Point 1 (ideology as mere justification). If Enlightenment language was just window-dressing for class interests, how can it suddenly become the sincere motivator for Jacobin purges? That needs addressing. 

  Then there's Point 3's structural determinism ("any revolution eats its moderates") clashing with Point 4's contingency ("one different call, no Terror"). Can both be true? Probably - structures create conditions but contingency decides outcomes. The cheaper fix might be softening Point 3's "any revolution" to "revolutions under severe threat tend to..." 

  Point 5 actually complements Point 4 well - individual psychology feeds into contingency. Vanity/fear influencing votes? Very plausible for a provincial lawyer character. 

  About Robespierre... Point 2 requires writing him as sincere, but Point 1 undermines that. The cheapest revision? Specify that while early revolutionary rhetoric was post-hoc, Jacobins like Robespierre internalized it as genuine ideology later. That bridges the gap. 

  Least confident judgment? Whether Point 3's structural claim is truly universal. Some revolutions (Glorious Revolution?) didn't devour children so viciously. Maybe stress "under existential threat" as key qualifier. 

  Overall these points can coexist with tweaks - the narrator's perspective could even hold contradictory beliefs realistically. The audit seems solid but I'll flag the Robespierre sincerity tension as most critical for their novel.
answer: |-
  Here's the audit per your specifications:

  1. **Points 1 & 2 are in significant tension:** If Enlightenment ideals were *mostly* post-hoc justification for class/material interests (Point 1), it severely weakens the claim that ideology (specifically the sincere belief in virtue vs. corruption) was the *primary* driver of the Terror (Point 2). The cheapest revision is to reframe Point 1: Enlightenment language wasn't *just* post-hoc; it became deeply internalized and operationalized *by specific actors/groups* (like the Jacobins) *during* the Revolution, transforming into the driving ideology described in Point 2.

  2. **Points 3 & 4 are in tension but reconcilable:** Point 3 claims revolutionary self-devouring is a structural inevitability "under threat," while Point 4 argues the Terror was highly contingent (avoidable with different decisions). The tension lies in the inevitability vs. avoidability. The cheapest revision is to qualify Point 3: "often" or "frequently" eats its moderates under threat, rather than "any revolution... no matter who." This preserves structural *pressures* without making the specific outcome (Terror) inevitable, leaving room for Point 4's contingency.

  3. **Points 2 & 5 complement each other well:** Point 2 (ideology driving Terror) and Point 5 (individual character/psychology as a force) aren't in tension. Ideology operates *through* individuals whose specific psychology (Robespierre's rigidity, Danton's pragmatism, your narrator's vanity/fear) shapes its interpretation and execution. Robespierre's sincerity (Point 2) is perfectly compatible with Point 5.

  4. **Points 1 & 5 only appear superficially in tension:** Point 1 (material/class drivers) focuses on macro causes, Point 5 (individual agency) on micro causes. They operate at different levels. Your narrator's vanity/fear (Point 5) influencing his vote *is* individual agency acting within the broader constraints and motivations (like class interest/fear of collapse, Point 1) shaping the revolutionary context.

  5. **Confidence: High overall.** Least sure about the *degree* of tension between Points 3 & 4 – reconciling structural pressures with contingency is inherently tricky historiography. The revision suggested feels sound, but the balance is delicate. Also slightly less sure if Point 1 *requires* weakening for Robespierre's sincerity (Point 2) – it's plausible he internalized justificatory language into genuine belief.
