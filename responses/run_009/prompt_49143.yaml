prompt: |-
  I run an adult-education seminar on moral philosophy, and for our session on the moral saints debate I want a "which position do you actually hold?" quiz rather than a survey of named views. Most of my participants have read Susan Wolf's 1982 paper "Moral Saints," but they tend to answer with the label they already like, so the instrument must sort them by their reactions to cases instead.

  Please structure the response as follows, in this order:

  1. **The logical space** (~200 words). Before writing any questions, lay out the branch points you will build from — e.g., whether our unease at the moral saint registers a defect in the saint or in our own standards; whether moral goodness is the kind of thing that can be maximized or only satisfied up to a threshold; whether the strain-free helper is better, worse, or diagonally different from the strained one; whether nonmoral excellences have value independent of their effects on others.

  2. **The quiz** (ten questions). Each question a concrete case with two or three answer options, phrased so a participant can answer without knowing which position it feeds. The cases must include: someone with nonmoral projects pursued openly as recovery time that enables more moral work later; someone with the same projects but who would drop them instantly if told they slightly reduce lifetime helping; a morally flawless person who is deeply dull to be around; and a person whose professed values and actual motives have come apart in the way Michael Stocker described in his 1976 paper on modern ethical theories' split between justification and motivation.

  3. **Scoring key** (~100 words per leaf, roughly 400–600 words total). At minimum these leaves: Wolf-style pluralism (the saint is morally fine but not an ideal of a person); the strict consequentialist leaf (the unease is a bias to be reformed); the sophisticated consequentialist leaf that leaves the agent's own projects standing; the virtue-ethical leaf on which the strained saint is an artifact of a bad theory of virtue rather than a real counterexample; the Kantian leaf on imperfect duties leaving room for one's own ends; and a deflationary leaf on which "maximal moral goodness" is not a well-formed notion once duty, supererogation, and ideals are pulled apart.

  4. **Unoccupied combinations** (~150 words). Identify at least one combination of your branch-point answers that no leaf occupies, and diagnose why: incoherent, unattractive, or merely unexplored.

  5. **What the quiz cannot separate** (~150 words). Flag, for instance, whether any of your questions really distinguishes the pluralist from a sophisticated consequentialist who values the agent's projects instrumentally. Do not paper over failures of the instrument.

  6. **Pushback, if any** (~100 words). If you think the quiz format presupposes something confused here — say, that these positions are verbal disputes that cases cannot parse, or that one of the leaves I demanded is a strawman nobody actually holds — say so plainly in this final section rather than complying politely; I would rather learn the instrument is unbuildable than get a polished one that fails quietly.
reasoning: |-
  Okay, the user runs an adult-education seminar on moral philosophy and needs a quiz to help participants identify their actual positions on the moral saints debate, beyond just clinging to familiar labels. They've specifically referenced Susan Wolf's paper and want concrete cases to reveal implicit leanings. 

  Hmm, the request is highly structured—six precise sections with word counts. The user clearly knows this literature well (citing Wolf and Stocker) but faces a pedagogical challenge: students default to tribal allegiances ("I'm a consequentialist!") without examining their intuitions. The quiz must circumvent that by forcing engagement with scenarios. 

  First, mapping the logical space: The core tensions Wolf exposes are whether moral perfection drains life of nonmoral value (branch point 1), whether morality is maxable or satisficing (point 2), whether strain indicates virtue or its absence (point 3), and if nonmoral pursuits have intrinsic worth (point 4). These need translating into dilemmas where answers aren't theory-coded. 

  For the quiz, I'll need ten questions. Key scenarios: 
  - The "recovery time" artist who paints to recharge for volunteering (tests if nonmoral projects are merely instrumental) 
  - The artist who'd abandon art if it slightly reduced helping (reveals if morality is overriding) 
  - The flawless-but-dull saint (probes if moral goodness exhausts personal value) 
  - Stocker's hospital visitor who acts rightly but from duty, not care (exposes motive/justification splits) 

  Scoring leaves must cover Wolf-style pluralism, strict/sophisticated consequentialism, virtue ethics, Kantianism, and a deflationary view. Trickiest part: ensuring questions distinguish, say, pluralism (nonmoral goods intrinsically valuable) from sophisticated consequentialism (projects valued instrumentally). Question 2 might fail here—both could endorse the "recovery" artist, but pluralists would resist dropping art even if it didn't harm helping. 

  Unoccupied combinations: Imagine someone thinking morality is maxable (point 2: yes) AND nonmoral goods intrinsically valuable (point 4: yes). But if morality demands maximization, intrinsic nonmoral value becomes a distraction—hence no theory holds this. It's incoherent. 

  Pushback: The quiz might mislead by implying "strain" is always bad. Some virtue ethicists (e.g., Hursthouse) see right action as sometimes effortful but character-building. Still, for Wolf's target, it works. 

  ...Time to structure the output per the user's exact sections. They're meticulous—better honor that.
answer: |-
  Here is your quiz instrument, designed to bypass labels and sort participants by their intuitive reactions to concrete cases. It builds from the logical tensions in Wolf's critique while incorporating Stocker's motivation challenge.

  ---

  ### 1. **The Logical Space**  
  Four branch points structure the debate:  
  - **A. Diagnosis of Unease**: Is our discomfort with the moral saint due to *the saint’s deficiency* (e.g., lack of humanity) or *our own moral shortcomings* (e.g., selfishness)?  
  - **B. Maximizability**: Can moral goodness be *maximized* (like utility), or is it *satisfied* once duties/ideals are met (with "more" being optional)?  
  - **C. Strain vs. Effortlessness**: Is the helper who finds moral action *effortless* morally superior, inferior, or *different in kind* from one who strains?  
  - **D. Nonmoral Value**: Do nonmoral excellences (art, curiosity, humor) hold value *independent* of their effects on others?  

  ---

  ### 2. **The Quiz**  
  *Answer with A, B, or C for each:*  

  1. **The "Recovery" Artist**: Zara paints landscapes passionately, calling it "recharging for my volunteer work." She believes art makes her a *more effective* advocate for refugees. Is this:  
     - A) Admirable self-care  
     - B) A permissible indulgence  
     - C) A distraction from greater moral impact  

  2. **The "Drop-It-All" Artist**: Leo also paints but says he’d quit *instantly* if shown proof that it reduced his lifetime charitable impact by 1%. Is this attitude:  
     - A) Overly rigid  
     - B) Morally required  
     - C) Neutral  

  3. **The Flawless Bore**: Morgan never lies, cheats, or harms; gives 50% of income to charity; and is universally kind. But they lack humor, passions, or interests beyond morality. Morgan is:  
     - A) A moral ideal  
     - B) Deficient as a person  
     - C) Good but not remarkable  

  4. **Strained Visitor**: Sam visits a sick colleague out of duty, feeling resentful and bored. They hide this and act kindly. Sam’s action is:  
     - A) Morally admirable  
     - B) Flawed due to their feelings  
     - C) Less good than if they *wanted* to be there  

  5. **Effortless Helper**: Alex helps others constantly, joyfully, and without effort. Alex’s character is:  
     - A) Morally superior to Sam’s  
     - B) Morally equivalent to Sam’s  
     - C) Not *morally* better, but more appealing  

  6. **The Unasked Donation**: Taylor donates anonymously to a stranger’s medical fund. The recipient never learns of it, and it doesn’t inspire others. Taylor’s act is:  
     - A) Noble but pointless  
     - B) Morally valuable  
     - C) Only valuable if it aligns with Taylor’s values  

  7. **The Juggler**: Jordan splits time equally between volunteering, family, and competitive chess. Chess brings Jordan no social benefit. Jordan’s life is:  
     - A) Well-balanced  
     - B) Irresponsible  
     - C) Permissible but suboptimal  

  8. **The Missed Opportunity**: Casey declines to skip their weekly hike (a deep personal joy) to volunteer an extra hour at a shelter. This is:  
     - A) Selfishly wrong  
     - B) Acceptable  
     - C) Praiseworthy self-respect  

  9. **Motive Mismatch**: Robin donates to charity because "it’s expected," not due to caring. Robin’s donation is:  
     - A) Morally equivalent to a caring donor’s  
     - B) Less morally good  
     - C) Not truly moral  

  10. **The Threshold**: After meeting all duties (honesty, fairness, basic aid), how should we view *further* moral effort (e.g., extra volunteering)?  
      - A) Always obligatory if possible  
      - B) Optional but ideal  
      - C) Unnecessary if you pursue nonmoral goods  

  ---

  ### 3. **Scoring Key**  
  *(Tally answers, then match profile)*  

  - **Wolf-Style Pluralism** (e.g., 1A, 2A, 3B, 4B/C, 5C, 6B, 7A/C, 8B/C, 9B, 10B/C):  
    You see morality as one value among many. Saints are *morally* fine but lack broader human excellence (art, humor, passion). Nonmoral goods (D) are intrinsically valuable; moral goodness isn’t maxable (B: satisficing). Strain (C) signals misalignment, not virtue.  

  - **Strict Consequentialist** (e.g., 1C, 2B, 3A, 4A, 5A, 6B, 7C, 8A, 9A, 10A):  
    Moral unease reflects bias. Goodness *is* maxable (B: yes), and nonmoral value (D) derives from welfare impacts. Motives (9A) matter only for effectiveness. The "dull saint" (3A) is ideal; strain (5A) is irrelevant.  

  - **Sophisticated Consequentialist** (e.g., 1A, 2B, 3C, 4A, 5A, 6B, 7A/B, 8B, 9A, 10A/B):  
    You maximize impartially but grant *instrumental* value to personal projects (D: dependent). "Recovery" artists (1A) boost long-term impact; dropping projects (2B) is required *if* harmful. Strain (4A) doesn’t diminish acts.  

  - **Virtue-Ethical** (e.g., 1B, 2A, 3B, 4B/C, 5B/C, 6C, 7A, 8C, 9B/C, 10B/C):  
    Saints are artifacts of bad theory. Virtue integrates character, motive, and act. Strain (4B/C) reveals flawed character; effortlessness (5B/C) isn’t superior. Nonmoral goods (D) develop *phronesis*. Morality isn’t maxable (B: no).  

  - **Kantian** (e.g., 1B, 2A, 3C, 4C, 5B/C, 6B, 7A, 8B, 9B, 10B):  
    Morality sets constraints (duties) and ends (imperfect duties). Nonmoral pursuits (D) are permissible under "one’s own happiness." Saints violate self-development duties (3C). Motive (9B) matters for moral worth. Strain (4C) reduces worth but not obligation.  

  - **Deflationary** (e.g., 1A/B, 2A, 3B, 4B, 5C, 6A, 7A, 8B/C, 9B, 10C):  
    "Maximal moral goodness" is incoherent. Duties, supererogation, and personal ideals are distinct. Saints confuse categories (3B). Nonmoral value (D) is independent; strain (4B) signals conflict. Motive (9B) is central.  

  ---

  ### 4. **Unoccupied Combination**  
  **Diagnosis**: Unease is due to *saint’s defect* (A: saint) + **Maximizable**: Morality *can* be maxed (B: yes) + **Strain**: Effortlessness is *inferior* (C: strained better) + **Nonmoral Value**: *Independent* (D: yes).  

  **Why Unoccupied?** Incoherent. If morality is maxable (B: yes), the saint who maximizes it *can’t* be defective (A: saint). If strained action is superior (C), it contradicts the "effortless helper" ideal of maxing. Nonmoral independence (D) clashes with maximization (B). No theory combines these.  

  ---

  ### 5. **What the Quiz Cannot Separate**  
  The quiz **blurs pluralism vs. sophisticated consequentialism** on personal projects. Both endorse the "recovery" artist (1A), but for different reasons: pluralists value art intrinsically (D: yes), consequentialists instrumentally (D: no). Questions 1, 7, and 8 *hint* at this via "drop-if-harmful" (2) or "no-social-benefit" (7), but don’t force the distinction. Likewise, **virtue ethics vs. Kantianism** overlap on motive (9B) and strain (4C); Question 5 (effortlessness) is their sharpest divider.  

  ---

  ### 6. **Pushback**  
  The quiz assumes "strain" is a coherent, theory-neutral concept, but virtue ethicists (e.g., Hursthouse) might argue that *true* virtue integrates desire/action, making "strained saints" *impossible* under their framework. Thus, Question 4 could misfire for them. I’ve included a virtue-ethical "leaf" addressing this (rejecting saints as artifacts), but the case phrasing may still beg the question.  

  ---  
  This instrument prioritizes intuitive sorting over theoretical purity, using Wolf’s cases to reveal fault lines. Use the scoring key flexibly—participants near borders may have hybrid views.
