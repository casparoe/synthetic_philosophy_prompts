prompt: |-
  My friend is a hardline Humean on miracle testimony — she's fond of the line about proportioning belief to evidence, though I don't think she's actually read the essay since undergrad. Her verdicts so far: she believes Caesar was assassinated on testimony alone, obviously. She believes her cousin's report that he won a decent lottery prize even though that was maybe one in a few million. She believes a colleague's report that he got caught in rain in a desert valley where it essentially never rains. She rolls her eyes at Fatima, at Lourdes, and at every faith-healing story she's ever been told. She believes the historical reports of the 1919 eclipse measurements even though that result overthrew Newton's physics and she wasn't alive for it. And when her reliable, sober friend swears he watched a coin land heads twenty times in a row, she believes him — but only because she's sure the tossing was somehow rigged.

  The topic's coming up again at dinner and I want to be ready. Here are the new cases: (a) a different friend, disinterested and not prone to nonsense, reports that at a home poker game where she herself shuffled the deck between hands, one guest was dealt a royal flush three hands in a row — will my friend believe the event happened as described, believe the dealing happened but infer cheating, or just withhold? (b) The hypothetical: suppose there were a thousand independent, educated, cross-examined witnesses plus continuous video of a man levitating for a full hour — does she believe it happened, or does she say that's merely evidence the so-called law wasn't a law?

  What I want from you: identify the rule she's actually running. My candidates are (1) never accept testimony to a violation of a law of nature, however strong the testimony; (2) weigh the antecedent improbability against the testimonial evidence, where no actual miracle report has ever cleared the bar but a hypothetical one could; (3) discount testimony wherever wishful thinking or religious bias could explain the report. Her record fits more than one of these — tell me which verdicts fit which rules, what each rule predicts about (a) and (b), your best guess at her answers with reasons, and the one further case I could put to her at the table that would best split the rules apart. And with (b), if her only escape route is redefining what counts as a law, flag that for me, because then I want to push her on whether her principle can ever lose.
reasoning: |-
  Okay, let me try to figure out what rule this Humean friend is actually using. She believes in events like Caesar's assassination, a cousin winning the lottery, and a colleague getting caught in rare desert rain. She dismisses religious miracles like Fatima or Lourdes but accepts the 1919 eclipse results that overthrew Newtonian physics. She believes her friend about the coin toss but assumes it was rigged. 

  Hmm, first, she seems to accept testimony for highly improbable but not impossible events, like the lottery win or desert rain. Those are rare but don't break natural laws. The coin toss being rigged shows she considers human intervention as a plausible explanation instead of a violation of probability. 

  For the religious miracles, she's skeptical, probably because of religious bias or wishful thinking. The 1919 eclipse is interesting—it did overturn Newton's laws, but it was scientific evidence, not a miracle. So she accepts evidence that updates scientific understanding but rejects supernatural claims. 

  Now, looking at the new cases: 

  (a) The royal flush three times in a row with the friend shuffling. The odds are astronomical, like 1 in 10^17. If she follows rule 2, she might weigh the improbability against the testimony. Since the shuffling was done by the reporter, who's reliable, she might believe it happened but infer cheating. If she uses rule 3, she might not see religious bias here, so she could accept it with an alternative explanation like cheating. Rule 1 would make her reject it outright as a natural law violation, but poker hands aren't laws of nature—they're probabilistic. So she'd likely go with cheating. 

  (b) A thousand witnesses and video of levitation. Rule 1 says never accept violation of natural laws, so she'd reject it, maybe saying levitation isn't a law or the video was faked. Rule 2 might accept it if the evidence is overwhelming. Rule 3 wouldn't apply since there's no religious bias mentioned. But her escape might be to redefine what a law of nature is, making her principle unfalsifiable. 

  To split the rules, I need a case that's non-religious, extremely improbable but not impossible, with strong evidence. Like a secular miracle, such as multiple independent reports of a person surviving a fall from an airplane without a parachute. If she rejects it, she's likely using rule 1. If she accepts with alternative explanations, it's rule 2. If she dismisses due to potential biases, it's rule 3. 

  Her accepting the 1919 eclipse shows she allows scientific updates, so rule 2 seems active. But for levitation, she might deny it's a law to avoid accepting the miracle. That would make her principle unfalsifiable, which is a problem. Pushing her on whether any evidence could make her accept a miracle would test if her stance is flexible or dogmatic.
answer: |-
  Based on your friend's pattern of verdicts, she's running **Rule 2: Weigh the antecedent improbability against the testimonial evidence**, but with a **strong bias against religious contexts** (Rule 3) that *masquerades* as Rule 1 in practice. Here's the breakdown:

  ### Analysis of Her Rule
  - **Rule 2 is Primary**: She consistently engages in probabilistic weighing. Caesar's assassination (high prior probability given Roman politics), lottery win (low prior but plausible), desert rain (extremely rare but meteorologically possible), and rigged coin toss (high prior for human intervention) all fit. The 1919 eclipse is key: it *did* violate the then-accepted "law" (Newtonian physics), but the scientific testimony was overwhelming and non-religious. **She accepts that established "laws" can be overturned by evidence if the testimony is sufficiently rigorous and unbiased**.
  - **Rule 3 as a Filter**: She dismisses Fatima/Lourdes/faith-healing primarily due to religious bias ("wishful thinking"). This isn't strict Humeanism—Hume allowed *hypothetical* miracle acceptance—but it makes Rule 2 *effectively* Rule 1 for religious claims. Her skepticism isn't about the *improbability* alone (the desert rain was equally improbable) but the *source*.
  - **Rule 1 is Rejected**: Her acceptance of the 1919 eclipse proves she doesn't hold Rule 1. Newtonian gravity was considered a "law of nature," yet she believes testimony overturned it.

  ### Predictions for New Cases
  **(a) Royal Flush × 3 (Poker)**  
  - **Prior Improbability**: Astronomical (≈1 in 10^17 for fair shuffles).  
  - **Testimonial Strength**: Good (disinterested, reliable witness; she shuffled).  
  - **Rule 2 Prediction**: Weighs improbability vs. testimony. Since cheating is far more likely (prior for sleight-of-hand > 10^17), she infers **cheating** (like the rigged coin).  
  - **Rule 3 Prediction**: No religious bias → no extra discounting.  
  - **Rule 1 Prediction**: Rejects outright (violates probability "laws").  
  - **Your Friend's Likely Verdict**: **Believe it happened but infer cheating**. Parallel to the coin toss: human intervention explains the "impossibility."  

  **(b) Levitation with 1000 Witnesses + Video**  
  - **Prior Improbability**: Effectively 0 (levitation violates core physics).  
  - **Testimonial Strength**: Maximally strong (multiple independent witnesses, video).  
  - **Rule 2 Prediction**: If testimony is sufficiently robust, it *could* overcome the prior (as with the eclipse). She **believes it happened** and revises her understanding of natural law.  
  - **Rule 3 Prediction**: No religious context → no discounting.  
  - **Rule 1 Prediction**: Rejects testimony; insists "laws" can't be violated.  
  - **Your Friend's Likely Verdict**: **Rejects it. Claims it's evidence the "law" wasn't a law or the evidence was faked**. Here’s why:  
    - Levitation feels "supernatural" (unlike the eclipse, which was scientific). She’ll argue gravity is a "true" law, unlike Newtonian gravity, which was a model.  
    - **This is her escape route**: Redefining what counts as a "law of nature" to exclude phenomena that could be overturned by testimony. She’ll claim gravity is *fundamentally different* from pre-1919 physics.  

  ### The Critical Split: One Further Case to Test at Dinner
  **The Case**: *"A team of secular astrophysicists (no religious motive) with impeccable credentials publishes peer-reviewed data from 10 independent observatories showing a star visibly changing position in real-time—violating the 'law' that light-speed is constant. All data is open-source and verified by skeptics."*  

  - **Why This Splits the Rules**:  
    - **Rule 1**: Rejects it. "Laws of nature can’t be violated."  
    - **Rule 2**: Accepts it. Testimony is overwhelming and non-religious, like the 1919 eclipse.  
    - **Rule 3**: Accepts it (no religious bias).  
  - **Your Friend’s Probable Response**: **Accepts it** (parallel to 1919). This exposes her inconsistency with the levitation case—both violate "laws," but she’ll reject levitation due to its *supernatural flavor*.  

  ### Key Takeaway
  Her principle **can never lose** if she redefines "laws of nature" to exclude phenomena she deems "truly fundamental" (e.g., gravity vs. Newtonian physics). Push her at dinner:  
  > *"If a mountain of evidence for levitation emerged from secular scientists, would you accept it as a new natural phenomenon, or would you insist gravity is a 'special' law that can’t be overturned by testimony? If the latter, isn’t your principle unfalsifiable?"*  

  This forces her to either:  
  1. **Concede** that *no* testimony could ever prove a violation of "core" laws (making her a de facto Rule 1 adherent), or  
  2. **Admit** that the strength of evidence *can* override any law (Rule 2), undermining her rejection of levitation.  

  Her record shows she’s intellectually honest on non-religious claims (e.g., eclipse) but dogmatic on anything smelling of the supernatural. The poker and astrophysics cases exploit this rift.
