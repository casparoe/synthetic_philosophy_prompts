prompt: |-
  My brother-in-law plays poker for a living, thinks in odds all day, and he's walked me into something about Hume on miracles that I can't find my way out of. He got there by taking Hume's maxim about miracle reports literally and then turning it on all testimony. The argument, as clean as I can put it:

  (1) Believe someone's report of an event only if the event, considered on its own before you heard the report, was more probable than the report being wrong — mistaken, exaggerating, or lying. (This is Hume's rule from the miracles section of the Enquiry, paraphrased: no testimony is enough to establish something vastly improbable unless the testimony being wrong would be even more improbable.)

  (2) For any particular report by a particular person, there's at least, say, a one-in-a-hundred chance it's wrong in some respect — people misremember, embellish, misspeak. No individual report of a specific occurrence is anywhere near certain.

  (3) Any event described specifically enough to be worth reporting had an antecedent probability way below one in a hundred. My coworker tells me she took the 4:15 bus, ran into her old roommate Petra, who told her about a job opening in Lisbon — out of all the days she could have had, that exact day had a prior of maybe one in millions. A friend describes the exact order the cards came out last night: one in 52 factorial. Even the news is like this: this particular quake, of this magnitude, at this hour, in that town.

  (4) So by (1) we should suspend judgment on essentially all specific testimony — friends' stories, the paper, history, court witnesses.

  (5) We don't, and we're right not to: testimony is basically our only window onto nearly everything that happens, and it mostly works.

  (6) So Hume's rule, taken literally, destroys the very thing its supposed to be a rule about, and it has to go. And once it goes, his case against miracle reports goes with it — as far as my brother-in-law can tell, the whole case was the maxim, so the door is open again for evaluating miracle reports on ordinary grounds.

  He likes that last part, because he thinks it reopens the door for miracles. I don't want that, but I also can't locate the flaw. Something about (3) feels like cheating — it compares a fully spelled-out event against a loosely specified error rate — but whenever I try to loosen the event description the whole thing just dissolves in a way I can't make precise. So: where's the trick? Which premise should I give up, and what does giving it up cost? To be clear, don't hand me a rescue of (5) just because sanity seems to demand it — if the argument genuinely goes through and we're entitled to believe almost no specific testimony, say that definately. Equally, if you think we've both mangled Hume — that his actual rule was never what (1) says it was — I want to hear that too, even though it makes us both look silly.
reasoning: |-
  Okay, the user is grappling with a philosophical argument presented by their brother-in-law, who's applied Hume's maxim on miracles to all testimony. The core issue is that if Hume's rule is taken literally, it seems to undermine all specific testimony because any detailed event has an extremely low prior probability compared to a fixed error rate. 

  The user feels uneasy about premise (3) but can't articulate why. They want to identify the flaw without resorting to pragmatic defenses of testimony's reliability. They're also open to the possibility that they've misinterpreted Hume.

  First, I need to dissect each premise. Premise (1) is a reasonable paraphrase of Hume, but premise (2) oversimplifies by treating all testimony errors as equally probable. Premise (3) is where the sleight of hand happens—it conflates the probability of a specific event occurring with the probability of that type of event occurring. 

  The key is recognizing that we don't evaluate testimony against the prior probability of an exact sequence of events, but against the prior probability of the event's general type. When your friend describes a poker hand, you're not assessing the odds of that exact sequence—you're assessing whether it's plausible that any noteworthy hand occurred. 

  Hume's rule isn't meant to apply to ordinary testimony but to events that violate natural laws. His actual argument involves multiple criteria beyond just prior probability, like the reliability of witnesses and corroborating evidence. 

  The brother-in-law's mistake is taking Hume's maxim out of context and applying it hyper-literally. The solution isn't rejecting Hume's rule entirely but understanding its proper scope and how we naturally adjust our priors based on context. 

  The user might be relieved to know the flaw is in premise (3)'s misrepresentation of probability assessments. This preserves both the usefulness of testimony and Hume's critique of miracles without collapsing into skepticism.
answer: |-
  You've hit on a classic and brilliant critique of a naive reading of Hume. The flaw lies primarily in **premise (3)**, but understanding *why* requires unpacking how we actually assign probabilities in testimony contexts. Here's the breakdown:

  1.  **Hume's Rule (Premise 1) is Largely Correct (in Context):** Hume's core insight is sound: the *less likely* an event seems based on our background knowledge *before* hearing testimony, the *more reliable* the testimony needs to be to overcome that initial improbability. If the event is wildly improbable (like a genuine miracle violating natural law), the testimony must be *extraordinarily* reliable.

  2.  **The Error Rate (Premise 2) is Roughly Plausible (but Contextual):** Assigning a fixed "one-in-a-hundred" error rate is simplistic, but the point stands that no human testimony is infallible. Errors happen.

  3.  **The Fatal Flaw is Premise (3): Misapplying Prior Probability.** This premise commits a critical error in probability reasoning:
      *   **The "Reference Class" Problem:** What is the "event" whose prior probability we assign? Premise (3) defines the event with *maximal specificity*: the *exact, unique, fully detailed sequence* of occurrences. The probability of *that exact sequence* occurring, chosen from all possible sequences, is indeed astronomically low.
      *   **Why This is Wrong:** We **don't** evaluate testimony against the prior probability of that *exact, maximally specific sequence*. We evaluate it against the prior probability of the *type* or *category* of event being reported, *given the context*.
      *   **Your Examples Clarified:**
          *   **Coworker & Petra:** You don't assess the prior of "coworker taking the 4:15 bus *and* running into Petra *and* Petra mentioning a job in Lisbon *on this exact day*". You assess the prior of "my coworker has a mundane encounter with an acquaintance while commuting". This is **highly probable**. The specific details (which bus, who it was, what they talked about) are *expected variations* within that highly probable category of event. Your prior isn't "job talk in Lisbon"; it's "acquaintances chat about their lives".
          *   **Poker Hand:** You don't assess the prior of *that exact sequence* of cards (1 in 52!). You assess the prior of "a noteworthy or memorable hand occurring during the game" or even more broadly, "cards appeared in some order". The probability of *a specific memorable hand sequence* being reported *if it happened* is high. The probability of *some hand sequence* happening is 1. The prior for *any specific sequence* is irrelevant here; it's the *category* ("memorable poker hand") that matters. Your background knowledge tells you memorable poker hands *do* happen frequently.
          *   **Earthquake:** You don't assess the prior of *that exact magnitude* at *that exact location* at *that exact nanosecond*. You assess the prior of "a significant earthquake occurring in a seismically active region within a general timeframe". This is **moderately probable** for places like Japan or California, very low for stable cratons. The specific details refine the report, but the core event type sets the prior.

  4.  **How This Resolves the Paradox:**
      *   We apply Hume's rule to the **salient event type**, not its maximally specific description.
      *   The salient event type ("mundane encounter", "memorable poker hand", "significant quake in region X") usually has a **much higher prior probability** than the error rate of the testimony (premise 2).
      *   Therefore, Hume's rule (premise 1) *doesn't* generally tell us to reject testimony about mundane or expected events. The prior probability of the *type* of event is high enough that even with a non-zero error rate, the testimony can be credible.
      *   **Miracles are Different:** For a genuine miracle (e.g., "Dead man rose after 3 days"), the salient event type ("violation of established natural law") has an **extremely low prior probability** based on our uniform experience of how the world works. Hume argues this prior is so low that *no testimony* could be reliable enough to overcome it, given our equally uniform experience of human fallibility and mendacity. The "event type" here is fundamentally different from "mundane encounter" or "memorable poker hand".

  5.  **What Giving Up Premise (3) Costs (Nothing, Really):**
      *   It costs the illusion that we assess testimony against hyper-specific priors. We never actually do this in rational belief formation.
      *   It requires acknowledging that defining the "event" is context-dependent and involves choosing the relevant level of generality based on background knowledge. This is how probability *actually* works in real-world reasoning. It's not a flaw; it's a feature.
      *   It preserves the viability of testimony for ordinary events (premise 5) while leaving Hume's core argument against miracles intact.

  **Addressing Hume Mangles:**

  *   You haven't mangled Hume's *stated maxim* in premise (1). It *is* often paraphrased that way.
  *   However, critics (like your brother-in-law) often mangle Hume's *application* and *scope*. Hume wasn't arguing we should doubt *all* testimony. His target was *specifically* testimony for events that are (1) violations of natural law, and (2) central to establishing a rival system of religion. He also offered multiple criteria (quality of witnesses, corroboration, incentives, etc.), though the prior probability maxim is the most famous and foundational. The brother-in-law's error is taking a rule designed for an *extreme* case (miracles) and misapplying it hyper-literally to *all* cases.

  **Conclusion:**

  The trick is in **premise (3)**. Your brother-in-law has fallen for a probability illusion by demanding we assess testimony against the prior probability of maximally specific events. In reality, we assess testimony against the prior probability of the *relevant event type*, which is usually much higher than the testimony's error rate. This resolves the paradox for ordinary testimony. Hume's rule, correctly applied to the event type "violation of natural law," remains a powerful argument against accepting miracle reports based solely on testimony. The door for miracles isn't reopened by this flawed application of the rule.

  You don't need to sacrifice sanity (premise 5) or abandon Hume's core insight (premise 1). You just need to reject the unrealistic and incorrect way premise (3) frames the prior probability calculation.
