  Based on Maya's five verdicts, her judgments are consistent with a specific form of **critical-level utilitarianism with a neutral range**. This rule posits two thresholds: a **lower threshold \( L \)** and an **upper threshold \( U \)** (where \( L \leq U \)). The value of a life at quality \( q \) is determined as follows:
  - If \( q < L \), the life contributes negatively: value = \( q - L \) (or a negative constant).
  - If \( L \leq q < U \), the life is neutral: value = 0.
  - If \( q \geq U \), the life contributes positively: value = \( q - U \).

  The total value of a world is the sum of the values of all lives. This rule explains all five verdicts:
  1. **Ten billion at 90 vs. twenty billion at 90**:  
     Both lives are above \( U \) (assuming \( U < 90 \)), so value per life is \( 90 - U > 0 \). Doubling the population doubles the total value, so the second world is better by a wide margin.
  2. **Ten billion at 90 vs. a trillion trillion at 1**:  
