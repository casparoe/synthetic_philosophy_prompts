  We close with the thought experiment in institutional setting.

  Thought experiment:

  At Mercy Hospital, a tribunal of three doctors must decide whether to withdraw approval of a surgical device. The tribunal has:
  - Dr. Alice, a world-renowned expert in medical devices, with a proven track record of 99% accuracy in such decisions.
  - Dr. Ben, also a world-renowned expert, with 99% accuracy.
  - Dr. Chris, a respected surgeon with 55% accuracy in these decisions.

  They vote by majority rule. Given their competences, the tribunal reaches the correct decision 99.1% of the time.

  To increase transparency, the hospital adds a community representative, Mr. Davis, who has undergone training and achieved 51% accuracy in a standardized test. The voting rule remains majority, and in case of a tie, they flip a fair coin.

  After Mr. Davis joins, the tribunal's accuracy drops to 88.3%. The drop occurs because in cases where Alice and Ben are correct (which is very often) but Chris is wrong, the device would have been approved correctly by a 2-1 vote. However, with Mr. Davis (who is wrong 49% of the time) also voting, there is a substantial chance that he votes wrong too, leading to a 2-2 tie (Alice and Ben correct, Chris and Davis wrong). The tie is then broken by a coin flip, which is wrong half the time. This dilutes the high accuracy of Alice and Ben.

  This meets the specifications.

  The defender of the Condorcet jury theorem would say that the theorem is about the limit as the group size goes to infinity, and adding one member who is barely competent might cause a temporary dip, but eventually as more competent members are added, the accuracy will converge to 1.

  To prevent the drop, the tribunal could:
    - Add new members in pairs to maintain an odd size.
    - Set a minimum competence threshold for new members (e.g., at least the current average competence of the tribunal) to minimize the risk.

  But note: in our repaired design with one new member at 0.85, the drop was still 2.77% (which is more than 1%), so we haven't completely fixed the problem with one addition. The only sure way to avoid the drop is to add an odd number of sufficiently competent members or to use a different voting rule.

  Finally, the enlarged panel with the barely competent member (88.3%) is still more accurate than its average member: average competence = (0.99+0.99+0.55+0.51)/4 = 0.76. And 88.3% > 76%, so the group is still better than the average member. The damage is a significant drop from 99.1% to 88.3%, but the group is still better than any individual member except the two experts. This shows that the drop is substantial but the group decision is still valuable.

  The maximum drop we achieved is 10.84 percentage points. This is not a tight bound; it's the best construction we found.
