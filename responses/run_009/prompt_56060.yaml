prompt: |-
  Been in a years-long argument with a friend about particularism vs generalism in ethics, and it's completely stalled, so I want a diagnosis rather than a verdict on who's right. Some background on where we're stuck: we actually agree on all the standard test cases. We both think someone who keeps a promise only because they fear punishment acts worse than someone who keeps it out of regard for the promisee, we both think lying is normally a reason against but the murderer-at-the-door case flips it, and neither of us thinks there's a codifiable decision procedure you could run to settle hard cases. Yet we can't move eachother an inch. He says that if any true moral generalizations exist at all — even something as weak as "lying counts against an act, other things equal" — then generalism wins, since the fight is then only about how many and how strong, which is a matter of degree, not of kind. I say the "other things equal" clause is doing all the work and that once you try to spell out what the "things" are and when they're equal, the generalization either becomes trivially true or turns into a disguised list of particular verdicts. My working hypothesis is that we're not disagreeing about morality at all but about what counts as a generalization in the first place — I'm implicitly demanding exceptionless laws and he's counting defaults, so maybe we're answering two different questions under one heading. Is that hypothesis right, or is there a real substantive disagreement hiding in there (maybe about whether moral knowledge has to be transferable to new cases)? And given your diagnosis, what, if anything, would count as one of us actually winning — a new kind of case, a distinction we're missing, or nothing? End with a single line of the form "Verdict: ..." containing a short label for your diagnosis (e.g. verbal / substantive / different-questions, or your own label).
reasoning: |-
  Okay, the user has been stuck in a years-long debate with a friend about particularism versus generalism in ethics. They agree on all the standard test cases but can't move each other. The friend argues that if any moral generalizations exist, even weak ones like "lying counts against an act, other things equal," then generalism wins. The user counters that the "other things equal" clause does all the work, making generalizations either trivial or disguised lists of particular verdicts. The user suspects they might be talking past each other—perhaps demanding exceptionless laws versus accepting defaults.

  First, I need to unpack the core of their disagreement. Both agree on moral judgments in specific cases but diverge on whether these judgments imply underlying generalizations. The friend’s position hinges on the existence of any generalization, no matter how weak, as a victory for generalism. The user sees those generalizations as either vacuous or reducible to particulars. This suggests a meta-ethical stalemate where the real conflict is over what constitutes a meaningful generalization.

  The user’s hypothesis is that they’re conflating different types of generalizations. The friend accepts defeasible generalizations (defaults with exceptions), while the user might be insisting on strict, exceptionless principles. If that's the case, their definitions of "generalization" differ, making it a verbal dispute. However, there might be deeper substantive issues. For example, the user mentions that spelling out the "other things equal" conditions leads to a list of particular cases. This touches on whether moral principles can provide genuine guidance in novel situations or if they’re just summaries of past judgments.

  Another angle is the nature of moral knowledge. The friend might believe that even weak generalizations allow for transferable knowledge, aiding in decision-making. The user could argue that without exceptionless rules, each case must be evaluated on its own, making generalizations useless. This points to a substantive disagreement about moral epistemology—how we learn and apply moral knowledge.

  Looking at possible resolutions, introducing a new test case might not help since they agree on existing ones. Instead, distinguishing between types of generalizations could clarify the debate. Terms like "defeasible generalization" versus "strict principle" might help. Also, exploring the role of ceteris paribus clauses in ethics compared to other fields (like science) could reveal if the issue is unique to morality.

  The user asks what would count as winning. If it's a verbal dispute, agreeing on definitions might resolve it. If substantive, winning would require convincing the other on the transferability of moral knowledge or the existence of non-trivial generalizations. But given their impasse, it's likely a mix of both—different understandings of "generalization" masking deeper issues about moral reasoning.

  Finally, the verdict should encapsulate the diagnosis. "Verbal-substantive hybrid" seems fitting because the surface issue is terminological (what counts as a generalization), but underneath lies a real disagreement about moral knowledge and principles' roles.
answer: |-
  Your working hypothesis is perceptive but incomplete—you've identified a crucial terminological difference, but there's also a substantive disagreement about moral epistemology hiding beneath. Here's the diagnosis:

  1.  **The Verbal Disagreement (Your Hypothesis is Partly Right):**
      *   You're implicitly operating with a **strict, exceptionless conception of "generalization"** (akin to universal laws in physics). For you, a genuine moral principle must hold without *ceteris paribus* clauses or be strictly codifiable. Under this view, "lying is *pro tanto* wrong" feels trivial because its application *always* depends on context-dependent particulars that can't be fully specified in advance.
      *   Your friend adopts a **defeasible conception of "generalization"**. For them, a true moral generalization is a *defeasible reason* or *default valence* that genuinely contributes to the moral landscape, even if it can be overridden or silenced by context. "Lying counts against an act, other things equal" is non-trivial evidence for generalism because it identifies a *stable, repeatable feature* with a *typical moral force* that isn't invented on the spot for each case.

  2.  **The Substantive Disagreement (Hiding Underneath):**
      *   The core issue isn't just about the *existence* of generalizations, but about the **source and transferability of moral knowledge and judgment**:
          *   **Your View (Particularism Leaning):** Moral knowledge is fundamentally *holistic* and *context-sensitive*. Understanding the "other things" that make things "unequal" isn't just filling in details; it's engaging in a unique, irreducible act of moral perception for each situation. The "generalization" adds nothing substantive beyond summarizing past judgments; it doesn't *guide* us in genuinely novel cases. True moral understanding requires seeing the particular constellation of features *as a whole*.
          *   **Your Friend's View (Generalism Leaning):** Recognizing defeasible generalizations provides *genuine normative structure*. Knowing "lying is *pro tanto* wrong" gives us *some* independent, transferable knowledge. It tells us that in a *new* situation involving a lie, we start with a *presumption against it*, and the burden shifts to identifying *specific defeating conditions* (like the murderer-at-the-door). The generalization isn't just a summary; it provides a *framework for inquiry* into the particulars.

  **What Would Count as "Winning"?**

  Since you agree on cases, winning *isn't* about finding a new case where you disagree (though a truly novel, complex dilemma might strain one framework more than the other). Winning would involve:

  1.  **Clarifying the Terminological Stakes:** Agreeing on what *counts* as a "win" for generalism. Is it the existence of *any* defeasible generalization (your friend's bar)? Or only the existence of exceptionless, codifiable principles (your bar)? Explicitly framing it as "Is defeasible generalization X enough for generalism?" might resolve the *labeling* part.
  2.  **Addressing the Epistemological Core:** Focusing the debate on the substantive question: **Do defeasible moral generalizations provide *genuine, transferable normative guidance* in novel situations, or are they merely post-hoc summaries with no independent justificatory or heuristic power?**
      *   If your friend can demonstrate how a defeasible generalization (like "*prima facie* duty of fidelity") *actively structures* moral deliberation in a way that's not reducible to just seeing the particular case correctly from the start, they make progress.
      *   If you can convincingly argue that applying the "other things equal" clause *always* requires the same irreducible, holistic perception of the particular case that particularism describes, rendering the generalization superfluous for *guidance*, you make progress.
  3.  **A New Distinction:** Introducing the distinction between **summary generalizations** (mere patterns in past judgments) and **guiding generalizations** (principles that play an active role in shaping future judgments) might be fruitful. The debate hinges on whether any moral generalizations are truly *guiding*.

  **Verdict: Terminological-With-Epistemological-Core**
