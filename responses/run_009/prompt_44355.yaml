prompt: |-
  Every explainer of the frame problem uses blocks-world robots, but my sense is it's really about something I deal with weekly: when one thing changes (I switch jobs, a flatmate moves out), most of my standing assumptions stay true and a handful suddenly matter, and I somehow figure out which is which without re-deriving everything from scratch. Assume a theory of the frame problem is meant to explain exactly that ability in any agent, natural or artificial. Write the desiderata: what an adequate theory of this has to deliver -- which cases it must get right, which distinctions it has to respect (like facts persisting by default vs. facts that were never relevant at all, or updating beliefs about a change vs. updating while acting), which constraints from real agents (they're fast, fallible, and can't re-check everything) it cant contradict -- with the motivating case behind each, and say which requirements are non-negotiable and which are just prejudices of one camp (say, the demand that the whole solution be purely logical/syntactic). Also flag any two requirements you suspect cant be jointly satisfied -- that part interests me most. Exactly five desiderata, numbered list, a sentence or two each, no intro or conclusion.
reasoning: |-
  Hmm, the user wants a structured list of five desiderata for a theory of the frame problem, framed around real-world cognitive challenges like job changes or roommate situations. They explicitly want no intro/conclusion, just the numbered list with specific components: what the theory must deliver, motivating cases, non-negotiable vs. negotiable aspects, and potential conflicts.

  First, unpacking the user's core frustration: they're tired of abstract blocks-world examples and want the frame problem grounded in lived experience—specifically, how humans efficiently update beliefs during life changes without exhaustive recomputation. Their hidden need seems to be validation that everyday cognition is the *real* frame problem, not just an AI puzzle. Also, they're probing for philosophical tensions ("which requirements can't be jointly satisfied"), suggesting they suspect trade-offs in modeling cognition.

  Key angles to cover:
  - **Persistence vs. irrelevance**: Must distinguish facts that *stop* being true (roommate's rent share) from those never pertinent (roommate's taste in music).
  - **Action vs. observation**: Updating while *acting* (negotiating new rent) differs from passive belief revision.
  - **Resource constraints**: Humans don't re-derive everything—speed and fallibility matter.
  - **Anti-dogmatism**: They want logical/syntactic demands flagged as optional, not universal.

  Brainstorming the five points:
  1. **Default persistence**: Handle "most things stay true" unless directly affected. Motivating case: Switching jobs doesn't invalidate unrelated facts (e.g., your cat still needs feeding). Non-negotiable because it's core to the problem.
  2. **Relevance filtering**: Explain why only *some* assumptions need checking. Motivating case: When a roommate leaves, rent obligations change but grocery preferences don't. Non-negotiable for efficiency.
  3. **Resource-boundedness**: Theory must allow for fast, approximate updates. Motivating case: Real agents can't recompute all beliefs after every change. Non-negotiable—without this, it's useless for explaining cognition.
  4. **Action-integrated updating**: Belief revision during active intervention (e.g., adjusting budgets *while* discussing rent) differs from passive learning. Motivating case: Acting introduces new variables (future rent splits). Here, demand for purely logical solutions might be negotiable—some camps accept probabilistic models.
  5. **Fallibility & error recovery**: Humans get updates wrong sometimes (e.g., forgetting the roommate took the router). Theory must permit this without collapsing. Non-negotiable for realism. Conflict with #3? Bounded rationality might force errors.

  For the tension they want flagged: **#2 (Relevance) vs. #4 (Action-integration)**. Perfect relevance detection during action may require unrealistic computation. Also, **#3 (Boundedness) vs. perfect accuracy**—you can't have both max speed and zero errors. This mirrors the user's suspicion about irreconcilable demands.

  Final list balances breadth: covers persistence (#1), selectivity (#2), constraints (#3), agency (#4), and imperfection (#5). Made sure each has a concrete human example and labels negotiability. For instance, syntactic approaches (#4 negotiability) are optional, but fallibility (#5) is mandatory.
answer: |-
  Here are five desiderata for an adequate theory of the frame problem, based on real-world cognitive challenges:

  1. **Default Persistence with Minimal Override**: The theory must explain why most background facts (e.g., "my commute route is unchanged") persist automatically when a change occurs (e.g., switching jobs), requiring explicit revision only for directly affected facts (e.g., "my new workplace location"). *Motivating case*: Job changes alter only a few logistical assumptions while leaving others intact. *Non-negotiable*: Without this, agents couldn't function efficiently in dynamic environments.  
  2. **Relevance-Based Selective Attention**: It must distinguish facts that were *never relevant* (e.g., a former flatmate's favorite song) from those that *become relevant due to change* (e.g., their share of rent vanishing), and prioritize checking only the latter. *Motivating case*: A flatmate moving out suddenly makes rent splits critical but doesn't activate unrelated dormant facts. *Non-negotiable*: Re-screening all beliefs is computationally intractable for real agents.  
  3. **Resource-Bounded Fallibility**: The theory must accommodate agents who update beliefs quickly but imperfectly (e.g., overlooking that the departed flatmate took the Wi-Fi router), without requiring exhaustive verification. *Motivating case*: Humans make oversights during life transitions despite limited time/energy. *Non-negotiable*: Contradicting this would misrepresent biological or practical AI agents.  
  4. **Action vs. Observation Distinction**: It must differentiate belief updates triggered by *the agent's own actions* (e.g., "I quit my job, so I cancel my commute pass") from updates due to *external observations* (e.g., noticing a flatmate left). *Motivating case*: Acting introduces new causal chains (e.g., quitting affects income), while observing doesn't. *Negotiable*: Demands for a purely syntactic/logical mechanism here reflect classical AI biases; probabilistic or heuristic approaches may suffice.  
  5. **Dynamic Relevance Thresholds**: The theory should explain how previously ignored facts gain relevance *without pre-specified rules* (e.g., realizing a flatmate's exit voids their emergency contact status only when filling a form). *Motivating case*: New contexts (e.g., medical paperwork) retroactively expose implications of past changes. *Non-negotiable*: Fixed relevance frameworks fail for open-ended real-world scenarios.  

  **Suspected incompatibilities**:  
  - **#2 (Selective Attention) and #5 (Dynamic Relevance)** may conflict: Efficient selection (#2) relies on pre-filtered irrelevance, but dynamic relevance (#5) implies unforeseeable "irrelevant" facts becoming critical.  
  - **#3 (Fallibility) and perfect persistence (#1)** might be irreconcilable: Bounded resources (#3) force approximations that could violate strict default persistence (#1), causing errors.
