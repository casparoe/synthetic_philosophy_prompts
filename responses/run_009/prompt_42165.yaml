  ### Decision Procedure for Embryo Selection Requests  
  *Designed for 20-30 minute case reviews, with explicit markers for value judgments and failure modes. Based on procreative beneficence (permission, not obligation), non-identity problem (no harm to unselected embryos), and avoidance of expressivist harm. Thresholds are conservative to limit eugenic drift.*  

  #### Ordered Questions:  
  1. **Severity & Penetrance**  
     - *Question:* Is the condition a recognized medical disorder (per ICD/DSM) with **high severity** (life-threatening, profound impairment, or severe chronic suffering) AND **high penetrance** (>50% likelihood of expression)?  
     - *Sufficient Answer:* Yes (proceed to #2). No (proceed to #4).  
     - *Judgment Required?* Yes (severity classification uses clinical guidelines but may be contested, e.g., "profound impairment").  
     - *Failure Mode:* Overestimating severity for ambiguous traits (e.g., low schizophrenia risk).  

  2. **Benefit vs. Expressivist Harm (Severe Disorders)**  
     - *Question:* Does selecting against the disorder provide **significant benefit** (prevents a life not worth living) without **unacceptable expressivist harm** (demeaning existing people with the condition)?  
     - *Sufficient Answer:*  
       - Benefit = Uncontroversial (e.g., untreatable lethal disease).  
       - Expressivist Harm = Absent (no evidence of community stigma amplification). → **Approve**.  
       - Expressivist Harm = Plausible (e.g., Down syndrome advocacy concerns). → **Flag for Panel: Values Discussion**.  
     - *Judgment Required?* Yes (expressivist harm is inherently subjective; relies on panel’s societal awareness).  
     - *Non-Identity Handling:* No comparison to "better" embryos—focus on preventing harm, not maximizing advantage.  

  3. **Disorder Classification (Non-Severe)**  
     - *Question:* Is the condition a recognized medical disorder (not severe) with **non-negligible health burden** (requires medical intervention, reduces function, or shortens lifespan)?  
     - *Sufficient Answer:* Yes (proceed to #5). No (proceed to #7).  
     - *Judgment Required?* Yes (e.g., "borderline-medical" traits like BRCA2 carriers—high cancer risk but treatable).  

  4. **Polygenic/Low-Penetrance Risk Assessment**  
     - *Question:* For low-penetrance/polygenic traits: Is the **absolute risk reduction (ARR)** from selection ≥5%?  
     - *Calculation:* ARR = (Baseline risk) − (Risk of best-scoring embryo).  
     - *Sufficient Answer:*  
       - ARR ≥5% → Proceed to #5.  
       - ARR <5% → **Deny: Insufficient clinical benefit**.  
     - *Judgment Required?* No (purely quantitative; ARR <5% is below clinical actionability thresholds).  
     - *Failure Mode:* Misleading commercial claims; over-reliance on noisy data.  

  5. **Test Validity**  
     - *Question:* Is the test **clinically validated** (analytic + clinical validity per ACMG guidelines)?  
     - *Sufficient Answer:* Yes (proceed to #6). No → **Deny: Unreliable test**.  
     - *Judgment Required?* Minimal (lab director confirms validity).  

  6. **Benefit-Burden Balance**  
     - *Question:* Does the **expected benefit** (reduced suffering/cost) outweigh **procedural burdens** (IVF risks, delay, cost)?  
     - *Sufficient Answer:*  
       - Benefit > Burden → **Approve**.  
       - Burden > Benefit → **Deny: Disproportionate burden**.  
     - *Judgment Required?* Yes (weighing abstract "benefit" is value-laden; uses panel experience).  

  7. **Non-Medical/Enhancement Requests**  
     - *Question:* Is the request for **non-medical advantage** (e.g., intelligence) or **cultural preference** (e.g., selecting for disability)?  
     - *Sufficient Answer:*  
       - Non-medical advantage → **Deny: Not clinically indicated**.  
       - Cultural preference (e.g., selecting for deafness) → Proceed to #8.  
     - *Selection vs. Enhancement Handling:* Permits selection *against* harm but not *for* advantage.  

  8. **Intentional Disability/Expressivist Review**  
     - *Question:* Would selecting **for** a disability:  
       - (a) Cause **direct harm** (life not worth living)? OR  
       - (b) Generate **unacceptable expressivist harm** (devalues disabled lives)?  
     - *Sufficient Answer:*  
       - (a) Yes → **Deny: Unacceptable harm**.  
       - (a) No + (b) Plausible → **Flag for Panel: Values Discussion**.  
     - *Non-Identity Handling:* No harm to embryo (it wouldn’t exist otherwise), but (b) addresses societal impact.  
     - *Failure Mode:* Cultural insensitivity (e.g., dismissing Deaf worldview).  

  ---  
  ### Case Applications  
  **Case 1: Adult-Onset Neurodegenerative Disorder**  
  - #1: **Yes** (severe + penetrant).  
  - #2: Benefit = Uncontroversial (prevents severe suffering). Expressivist Harm = Absent. → **Approve**.  
  - *Philosophy Simplified:* Non-identity irrelevant—selection prevents harm. No expressivist concern for rare, lethal conditions.  

  **Case 2: Polygenic Schizophrenia Risk**  
  - #1: **No** (low penetrance). → #4: ARR likely <5% (small variance explained). → **Deny: Insufficient clinical benefit**.  
  - *Philosophy Simplified:* ARR threshold avoids obligating parents for negligible gains. Rejects "enhancement" logic.  

  **Case 3: Deaf Couple Selecting for Deafness**  
  - #7: **Cultural preference** → #8.  
  - #8: (a) Direct harm? No (deafness compatible with good life). (b) Expressivist harm? Plausible (may imply disability is desirable). → **Flag for Panel: Values Discussion**.  
  - *Your Expected Discomfort:* Procedure flags values conflict but does not auto-deny. Philosophy clash: Non-identity problem permits selection, but expressivism may override.  

  ---  
  **Greatest misfire:** Cultural non-disorders in high-autonomy conflicts.  
  *(e.g., Deaf case: Procedure defaults to panel debate, risking paternalism or insensitivity to minority views.)*
