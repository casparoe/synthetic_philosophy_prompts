  2. Distinction between selection against disease (preventing harm) and selection for advantage (enhancement): We will prioritize preventing serious harm. For non-harmful traits, the procedure must be more cautious.

  3. From moral reason to permission/obligation: We are in a permission framework (allowing selection) not an obligation one. The procedure is about whether the hospital should permit the request, not whether the parents are obligated to do it.

