prompt: |-
  Government appraisal practice discounts the future: cost-benefit analysis converts costs and benefits arriving in later years into smaller present values by applying an annual discount rate, so a benefit delivered a century out counts for only a small fraction of the same benefit delivered today, and regulations whose payoffs are distant — climate mitigation, nuclear waste storage, biodiversity programs — live or die on the rate chosen. Several governments have lately complicated the picture by using lower or explicitly declining rates for horizons beyond thirty or fifty years, on the ground that uncertainty about the far future warrants gentler discounting than the near future. Meanwhile the same states make commitments that appear to presuppose the opposite: they subscribe to sustainability principles under which future generations' interests carry no less weight than ours, and their private law compensates delayed wrongs — a pension wrongly withheld for decades, contamination discovered long after it occurred — at full real value, with no reduction for the time elapsed. What theory of the value of time does systematic discounting of this kind presuppose? Is it pure time preference, on which future well-being simply counts for less; an opportunity-cost rationale, on which a present benefit competes with what the same resources could earn if invested; epistemic discounting, on which the shrinkage tracks uncertainty about whether there will be anyone there to enjoy the benefit; or something rooted in the non-identity problem and the thought that people who do not yet exist cannot be wronged now? Reconstruct the implicit theory as precisely as you can, distinguish what the practice strictly requires from what it merely fits comfortably, and say which rival views of temporal value it quietly rules out. Then address the apparent inconsistency: can the discounting of policy appraisal and the non-discounting of compensation law be reconciled under some single coherent view, or must one of them give? Finally, suppose a government candidly adopted pure time preference as its official rationale, abandoning the opportunity-cost defense. What in its appraisal practice would have to change — for instance, the ranking of long-delayed welfare benefits against financially productive investments, the rationale for declining rates at long horizons, or the treatment of intergenerational projects that transfer costs rather than benefits forward — and what would remain untouched?
reasoning: |-
  Hmm, this is a deep and multifaceted question about discounting in government policy. The user presents several layers: the tension between discounting practices and sustainability principles, the theoretical foundations of discounting, and practical implications of changing rationales. 

  First, I need to unpack the core contradiction they're highlighting. Governments discount future costs/benefits in policy appraisal (like climate projects), yet simultaneously claim to value future generations equally through sustainability commitments, and actually practice non-discounting in legal compensation cases. That's intellectually jarring - it suggests either hypocrisy or theoretical confusion.

  The user wants me to reconstruct the implicit theory behind standard discounting. Looking at real-world practices, it's clearly not pure time preference - no government would openly say "we value our grandchildren less". The opportunity-cost rationale dominates policy documents, where discount rates often track market returns. But the emergence of declining rates for distant futures (like the UK's Green Book) hints at epistemic uncertainty creeping in - we're less sure about far-future outcomes or even human existence.

  Now the non-identity problem is fascinating here. If future people don't exist yet, can we "harm" them by choosing policies that create different future people? This might secretly justify discounting future welfare, but interestingly, compensation law sidesteps this by dealing with existing legal persons suffering delayed effects.

  For the reconciliation challenge... this is tough. The best I can see is that compensation law treats time as affecting proof but not value, while policy appraisal treats time as affecting opportunity costs. The sustainability pledges might just be aspirational. There's no perfect reconciliation - one probably has to bend, likely the discounting practice when dealing with existential risks.

  If governments switched to pure time preference... wow, that would upend everything. Long-term projects like nuclear waste management would become nearly impossible to justify, declining rates would lose their rationale (since pure time preference should compound), and cost-shifting to future generations would become explicitly acceptable. Only near-term investments would survive. 

  The user seems sophisticated - probably an economics or philosophy academic given how they weave Ramsey equations with Parfit's non-identity problem. Their frustration with governmental inconsistency is palpable. I should acknowledge that while offering the most charitable possible reading of current practices, even if they're ultimately incoherent.
answer: |-
  The systematic discounting in government appraisal presupposes a hybrid theory blending **opportunity cost rationale** with **epistemic discounting**, while tacitly rejecting pure time preference and non-identity arguments. I'll reconstruct the implicit theory, address inconsistencies with legal compensation/sustainability, and explore consequences of adopting pure time preference.

  ---

  ### **Implicit Theory of Discounting in Policy Appraisal**
  1. **Core Rationale: Opportunity Cost Dominance**  
     - **Strict Requirement**: Resources invested today must yield returns competitive with market rates. If $1 invested now could grow to $1.08 next year (assuming 8% return), a future benefit of $1.08 must be discounted to $1 today to be equivalent.  
     - **What It Rules Out**: Pure time preference (future well-being intrinsically less valuable) and non-identity arguments (future people don’t exist yet). Opportunity cost is defensible as economic efficiency, not ethical judgment.

  2. **Epistemic Discounting for Distant Horizons**  
     - **Comfortable Fit (Not Strict)**: Declining rates beyond 30–50 years reflect *uncertainty* about:  
       - Technological/social disruptions (e.g., will clean energy obsolete carbon capture?).  
       - Survival probabilities (e.g., low-probability extinction risks).  
       - Valuation shifts (e.g., future preferences for biodiversity).  
     - **What It Rules Out**: Constant discount rates (e.g., Stern Review’s 0.1% pure rate) and non-identity justifications. Uncertainty-driven decline aligns with finance (e.g., volatile long-term yields).

  3. **Rejected Theories**:  
     - **Pure Time Preference**: Ethically incompatible with sustainability pledges.  
     - **Non-Identity Problem**: Compensation law treats future claims as valid (contradicting "no present victim" logic).  

  **Precise Reconstruction**:  
  *Discount rate \( r_t \) at time \( t \) is:  
  \[ r_t = \rho + \eta g_t + \epsilon_t \]  
  Where:  
  - \( \rho \) = pure time preference (near-zero, often 0–0.5% for intergenerational ethics)  
  - \( \eta g_t \) = opportunity cost (elasticity \( \eta \) × consumption growth \( g_t \))  
  - \( \epsilon_t \) = epistemic premium (rising with \( t \) to reflect uncertainty)*  

  Declining rates occur via increasing \( \epsilon_t \), not by abandoning \( \eta g_t \).

  ---

  ### **Reconciling Discounting and Non-Discounting Practices**
  **Apparent Inconsistency**:  
  - **Policy Appraisal**: Discounts future benefits (e.g., climate damage avoided in 2100).  
  - **Compensation Law**: Awards full real value for delayed harms (e.g., decades-lost pension).  
  - **Sustainability Principles**: Assert equal weight for future generations.  

  **Reconciliation Strategies**:  
  1. **Domain Separation**:  
     - *Compensation* corrects past wrongs to *existing* legal persons (rights-based). Time elapsed affects proof, not value.  
     - *Policy appraisal* allocates resources among competing future claims (efficiency-based). Delayed benefits face opportunity costs.  
     - **Limitation**: Sustainability principles ("equal weight") undermine this separation.  

  2. **Uncertainty vs. Certainty**:  
     - Compensation involves *known* victims/harms (certainty justifies no discount).  
     - Policy deals with *probabilistic* future outcomes (uncertainty justifies discounting).  
     - **Limitation**: Climate damages are increasingly certain, yet still discounted.  

  3. **Weak vs. Strong Sustainability**:  
     - *Weak*: Discounting assumes substitutability (lost nature compensated by wealth).  
     - *Strong*: Sustainability rejects substitutability (requires non-discounting for critical capital).  
     - **Verdict**: Most governments practice weak sustainability, creating tension with pledges.  

  **Conclusion**: The practices **cannot be fully reconciled** under a single coherent view. Sustainability principles and compensation law implicitly reject opportunity-cost discounting for intergenerational goods. Policy appraisal must either:  
  - **Adjust**: Use near-zero rates for existential risks (e.g., UK’s 1.4% for climate beyond 30 years).  
  - **Abandon Rhetoric**: Drop "equal weight" sustainability claims.  

  ---

  ### **Consequences of Adopting Pure Time Preference**
  If governments switch from opportunity cost to pure time preference (e.g., \( \rho = 3\% \)):  

  | **Policy Element**          | **Change Required**                                  | **Untouched**                     |  
  |-----------------------------|------------------------------------------------------|-----------------------------------|  
  | **Long-delayed welfare**    | Devalued drastically (e.g., 100-yr benefit ≈ 5% of today’s) | Short-term projects unaffected |  
  | **Productive investments**  | Favored over welfare projects (e.g., roads > biodiversity) | Risk-adjusted returns still apply |  
  | **Declining long-term rates**| Abandoned (pure rate compounds exponentially)        | Near-term discounting unchanged   |  
  | **Cost-transfer projects**  | Incentivized (e.g., delay nuclear cleanup; future costs discounted heavily) | Technical feasibility constraints |  

  **Key Implications**:  
  - **Intergenerational Ethics**: Projects benefitting future generations (e.g., carbon capture) become hard to justify. Cost-shifting (e.g., debt, pollution) becomes rational.  
  - **Epistemic Discounting Obsolete**: No need for declining rates; pure time preference dominates regardless of uncertainty.  
  - **Legal Inconsistency Deepens**: Non-discounted compensation for delayed harms would clash explicitly with policy devaluation of future welfare.  

  ---

  ### **Synthesis**  
  Current discounting practice is a pragmatic but incoherent compromise. It leans on opportunity cost for near-term efficiency and epistemic uncertainty for long-term humility, while sidestepping ethical questions. Pure time preference would force openly intergenerational tradeoffs, violating sustainability norms. The compensation exception proves society’s latent belief in time-neutral valuation for certain rights—a belief yet to penetrate policy appraisal fully. Resolution requires either elevating intergenerational ethics to match legal principles or conceding that economic efficiency trumps futurity.
