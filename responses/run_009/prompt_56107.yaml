answer: |-
  Below is a decision tree designed to guide students from finding the inductive premise of the sorites paradox compelling to a named philosophical position. Each node is a question answerable from intuitive reactions to cases, without presupposing knowledge of the positions. The tree is structured to reflect logical dependencies in the philosophical landscape. Positions covered include epistemicism, supervaluationism, subvaluationism, degree theory, contextualism, eliminativism, and ontic vagueness.

  ---

  ### **Sorites Paradox Decision Tree**
  **Start:** You find the inductive premise ("Removing one grain from a heap never makes it a non-heap") genuinely compelling, so the paradox demands an answer.

  1. **Q1: Should vague predicates (e.g., "heap") be eliminated from precise discourse?**  
     - **Yes** → **Eliminativism** (Vague predicates are incoherent; reject them to avoid paradox).  
     - **No** (Vague predicates are legitimate; seek another solution) → Proceed to Q2.

  2. **Q2: Is there a sharp cutoff?**  
     *Must there be a specific grain whose removal ends the heap? (Consider a fixed context: same speaker, time, and standards.)*  
     - **Yes** (There is a precise boundary) → Proceed to Q3.  
     - **No** (No precise boundary exists) → Proceed to Q4.

  3. **Q3: Is the sharp cutoff fixed across all contexts?**  
     *Could the cutoff shift with conversational standards, speakers, or practical needs?*  
     - **Yes** (Cutoff is immutable; it cannot change) → Proceed to Q3a.  
     - **No** (Cutoff varies with context) → **Contextualism** (Vagueness arises from context-dependence; the inductive premise fails as standards shift).

     **Q3a: Could an ideally informed speaker know the cutoff?**  
     *Would complete knowledge of the world resolve borderline uncertainty?*  
     - **Yes** → **Known Sharp Cutoff** (Unstable/unexplored: Incoherent with the purpose of vague terms, as arbitrary boundaries would be detectable and undermine tolerance principles).  
     - **No** → **Epistemicism** (There is a sharp cutoff, but it is unknowable due to human cognitive limits; classical logic holds).

  4. **Q4: Is vagueness in the world itself?**  
     *Is the "fuzziness" a feature of reality (e.g., objects having indeterminate properties), not just language?*  
     - **Yes** → **Ontic Vagueness** (The world lacks precise "joints"; vagueness is metaphysical).  
     - **No** (Vagueness is semantic or conceptual) → Proceed to Q5.

  5. **Q5: How should we describe a borderline case?**  
     *For a grain-count where "heap" is unclear, what is the status of "This is a heap"?*  
     - **Intermediate truth-value** (e.g., 0.5 true) → **Degree Theory** (Truth is fuzzy; vague predicates have degrees of satisfaction).  
     - **Truth-value gap** (Neither true nor false) → Proceed to Q6.  
     - **Truth-value glut** (Both true and false) → Proceed to Q7.

  6. **Q6: Is a statement true only if it holds under all precisifications?**  
     *Must "heap" be true in every acceptable sharpening of its meaning?*  
     - **Yes** → **Supervaluationism** (Truth is supertruth; classical logic preserved locally but not globally; indeterminate cases are gaps).  
     - **No** → *Other Gap Theory* (Unexplored: E.g., primitive gaps without supervaluations).

  7. **Q7: Is a statement true if it holds under some precisifications?**  
     *Is "heap" true if it applies in at least one acceptable sharpening?*  
     - **Yes** → **Subvaluationism** (Truth is subtruth; contradictions tolerated in borderline cases; gluts arise).  
     - **No** → *Other Glut Theory* (Unexplored: E.g., dialetheism without subvaluations).

  ---

  ### **Key Features & Clarifications**
  1. **Separating Epistemicism and Supervaluationism**:  
     Both preserve classical logic locally (e.g., no third truth-value in epistemicism; precisifications are classical in supervaluationism), but they diverge at **Q2** (sharp cutoff?) and **Q5** (truth-value status). Epistemicism requires a sharp cutoff (Q2=Yes) and rejects gaps (Q5 not applicable). Supervaluationism denies sharp cutoffs (Q2=No), posits gaps (Q5=Gap), and adds precisifications (Q6=Yes).

  2. **Unclean Separation**:  
     - **Ontic Vagueness vs. Semantic Non-Sharp Views**: The tree separates ontic vagueness (Q4=Yes) from semantic views (Q4=No → Q5), but ontic vagueness is often *combined* with logical treatments (e.g., ontic supervaluationism). The tree prioritizes the metaphysical question first, so these hybrids are not distinct leaves.  
     - **Degree Theory vs. Other Gap/Glut Views**: These are cleanly separated at Q5.

  3. **Unstable/Unexplored Branch**:  
     - **Known Sharp Cutoff (Q3a=Yes)**:  
       - **Status**: Unstable (almost no one holds this).  
       - **Reason**: Incoherent with the *tolerance* of vague predicates (if cutoffs were knowable, they would be arbitrary yet detectable, defeating the purpose of vagueness in language). It collapses under scrutiny.

  4. **Other Notes**:  
     - **Contextualism** is separated early (Q3=No) as it accepts sharp cutoffs that shift with context.  
     - **Degree Theory** and **Subvaluationism** are distinguished by truth-value structure (intermediate vs. glut).  
     - "Other" theories (Q6/Q7=No) are included for completeness but are rarely defended.

