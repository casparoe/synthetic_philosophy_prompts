prompt: |-
  So last night my friend and I got into a huge fight about the demandingness objection to consequentialism (she's a philosophy grad student, I'm just a guy who read too much Peter Singer in college), and we realized halfway through that we were talking past each other because "consequentialism demands too much" is doing like three different jobs. One complaint is about absolute amount of sacrifice (nobody should have to give until it hurts, full stop), one is about fairness (why is *me* on the hook when a million free-riders give nothing), and one is more about alienation (a life where every dentist appointment is shadowed by "this money could deworm a village" is a life you can't live from the inside). My friend's hot take is that almost nobody in the demandingness literature separates these cleanly, and that if you actually sort people by cases rather than by which famous name they like, the standard positions scramble around in interesting ways. I want to test that take.

  Could you build me a decision tree / sorting instrument for this? Start from the generic "consequentialism is too demanding" complaint and branch on concrete cases until you land on named positions. The branch nodes should be cases people can answer without knowing any labels, stuff like: would it be wrong to skip a friend's birthday dinner to take an extra shift whose wages you'll donate; is the morality of keeping your savings account different in a world where everyone else gives 10% versus one where nobody gives anything; is there some threshold of your own flourishing below which you're never required to go even for enormous gains to others; would an ideal observer who felt no pull toward her own projects still be admirable or defective; does it change anything whether the sacrifices are small-and-constant (daily coffee money) versus large-and-once (selling the house). You choose the cases, but aim for maybe 6-8 nodes and 6-9 leaves, with leaves including at least: plain unlimited act consequentialism (demandingness as a bug we should fix in ourselves, not the theory), satisficing or scalar variants, some agent-centered prerogative view, a rule or institutional-level move where what's required depends on what others are doing, and a hybrid/sophisticated consequentialism that lets you care about your own stuff as an indirect means. Please also do two things most taxonomy handouts skip: mark which leaf combinations are unoccupied in the actual debate and say why you think that is (incoherent? just unattractive? nobody got around to it?), and flag any pair of leaves your tree can't actually separate — I suspect the prerogative view and the "what others are doing" view produce identical answers on almost every case you'd realistically write, and if so I'd rather know that than pretend the tree is cleaner than it is. Audience is an intro-level study group, so keep the nodes self-contained and don't assume anyone has read the literature. Sorry if this is rambling btw, I'm writing it on the train still a bit annoyed at her.
reasoning: |-
  Okay, the user and their friend had a big argument about the demandingness objection to consequentialism. They realized that "consequentialism demands too much" actually encompasses three distinct issues: absolute sacrifice, fairness, and alienation. The friend thinks these aren't well-separated in the literature, and the user wants to test this by creating a decision tree that sorts people into different philosophical positions based on their responses to concrete cases.

  First, I need to design a decision tree with 6-8 nodes leading to 6-9 leaves. The nodes should be real-life scenarios that don't require prior knowledge of philosophy. The leaves should cover positions like unlimited act consequentialism, satisficing, agent-centered prerogative, rule-based approaches, and hybrid views. The user also wants to identify which combinations are unoccupied in the literature and which leaves the tree can't separate.

  The user mentions specific scenarios: skipping a friend's birthday for extra work to donate, the morality of keeping savings depending on others' contributions, thresholds for personal flourishing, an ideal observer without personal projects, and types of sacrifices (small-constant vs. large-once). I should incorporate these into the nodes.

  Breaking down the three complaints:
  1. Absolute sacrifice: How much is too much to give up?
  2. Fairness: Why should one person bear the burden if others don't contribute?
  3. Alienation: Can you live a meaningful life if every decision is shadowed by moral calculations?

  For the decision tree, starting with the root: "Consequentialism is too demanding." Then branch based on responses to scenarios. Each node should address one of the three dimensions. For example:
  - Node 1: Sacrifice Threshold - Would you skip a friend's birthday to work and donate? This tests absolute sacrifice.
  - Node 2: Fairness - Does others' behavior affect your obligation? This addresses fairness.
  - Node 3: Alienation - Is an ideal observer without personal projects admirable? This gets at alienation.
  - Further nodes could differentiate between types of sacrifices and thresholds of personal flourishing.

  The leaves need to correspond to known positions. For instance:
  - Unlimited Act Consequentialism: No problem with high demands; it's a personal failing.
  - Satisficing: Permits suboptimal actions if they meet a threshold.
  - Agent-Centered Prerogative (Slote/Scheffler): Allows giving personal interests more weight.
  - Rule Consequentialism or Institutional: Obligations depend on collective compliance.
  - Hybrid Consequentialism (Railton): Personal commitments as indirectly optimal.
  - Scalar Consequentialism (Norcross): Moral judgments are a matter of degree.

  Now, identifying unoccupied combinations. For example, someone might accept extreme sacrifice but only if others contribute. But in literature, if you accept high demands, fairness might not be a concern (e.g., utilitarians like Singer). Or, if you prioritize personal flourishing, you're likely in prerogative or satisficing, but combining with scalar might not be covered.

  Also, some leaves might not separate well. The user suspects that agent-centered prerogative and fairness-based views might give similar answers in practice. For instance, both might say it's okay not to donate if others aren't, but for different reasons: prerogative because of personal projects, fairness because of unfair burden. However, in cases where personal projects align with sacrifice, they might differ. But in typical scenarios, they could overlap, making them hard to distinguish with the tree.

  Need to ensure the cases are clear and don't require philosophical background. For example, the birthday scenario is relatable. The savings account question directly addresses fairness. The ideal observer case touches on alienation without using technical terms.

  Structuring the tree:
  1. Root: Consequentialism too demanding? (Yes)
  2. Node 1: Skip birthday for donation? (Yes/No) → If yes, maybe unlimited or scalar; if no, move to next node.
  3. Node 2: Does others' giving affect obligation? (Yes/No) → If yes, rule-based or fairness views; if no, continue.
  4. Node 3: Admire an observer without personal projects? (Yes/No) → If no, alienation is a problem, leading to prerogative or hybrid views.
  5. Node 4: Threshold for personal flourishing? → If yes, satisficing or prerogative.
  6. Node 5: Type of sacrifice matter? → Differentiates between views on cumulative vs. one-time sacrifices.

  Possible leaves:
  - Leaf A: Unlimited Act Consequentialism (Singer) – Always demands optimal action.
  - Leaf B: Scalar Consequentialism (Norcross) – Morality is a continuum; not always obligatory to optimize.
  - Leaf C: Satisficing (Slote) – Permits "good enough" actions.
  - Leaf D: Agent-Centered Prerogative (Scheffler) – Allows personal interests to outweigh greater good.
  - Leaf E: Rule/Institutional (Murphy/Brennan) – Obligations depend on collective rules.
  - Leaf F: Hybrid Consequentialism (Railton) – Personal commitments as part of optimal long-term strategy.

  Unoccupied combinations: For example, someone who thinks alienation is a problem but rejects any threshold for personal flourishing. Or, accepts high demands only if others contribute, but literature doesn't support this mix because high-demand views usually don't care about fairness.

  Indistinguishable leaves: Prerogative (D) and fairness-based (E) views might both say "don't donate if others don't" in the savings scenario. But in the birthday case, prerogative might allow skipping if it's important to you, while fairness might not care about personal projects. However, if the birthday isn't a key project, they might both say skip. So, the tree might not always separate them, but the reasons differ. Need to note that D and E often align in practice but are theoretically distinct.

  Also, hybrid consequentialism (F) might overlap with satisficing (C) if "good enough" aligns with long-term optimal. But satisficing sets a fixed threshold, while hybrid uses personal projects as a means to sustain effectiveness.

  Finally, labeling the tree clearly and explaining the positions in simple terms. Including notes on unoccupied combinations and indistinguishable leaves as requested.
answer: |-
  Based on your description, here's a decision tree that separates the three strands of the demandingness objection (absolute sacrifice, fairness, alienation) using concrete cases. It branches into 7 positions with notes on gaps and indistinguishability. The tree has **7 nodes** and **7 leaves**, with cases designed to force choices between the core concerns.

  ---

  ### **Decision Tree: Demandingness Objections to Consequentialism**
  *Start here:*  
  **"Consequentialism demands too much" feels true to me.**

  #### **Node 1: The Birthday Shift**  
  *Your friend’s birthday dinner conflicts with an extra work shift. The shift’s wages ($200) would save a life if donated to an effective charity. Is it* ***morally wrong*** *to skip the shift to attend the dinner?*  
  - **YES, it’s wrong** → Go to Node 2  
  - **NO, it’s permissible** → Go to Node 3  

  #### **Node 2 (from YES): Sacrifice Scale**  
  *You inherit $1M. Keeping it would fund your dream career; donating it would save 100 lives. Is it* ***wrong*** *to keep any of it for yourself?*  
  - **YES, wrong to keep any** → **Leaf A: Unlimited Act Consequentialism** (e.g., Singer, early utilitarians).  
    *Demands are a feature; failing to meet them is a personal flaw.*  
  - **NO, can keep some** → **Leaf B: Satisficing/Scalar Consequentialism** (e.g., Slote, Norcross).  
    *Only "good enough" acts required; morality is a spectrum.*  

  #### **Node 3 (from NO): Fairness Test**  
  *You have $10K savings. In* ***World 1***, *everyone else donates 10% of income to charity. In* ***World 2***, *nobody else donates anything. Does the morality of keeping your savings change between worlds?*  
  - **YES, it’s worse to keep in World 2** → Go to Node 4  
  - **NO, equally permissible in both** → Go to Node 5  

  #### **Node 4 (from YES): Personal Threshold**  
  *Must you sell your home to donate to life-saving causes, even if it would make you chronically depressed?*  
  - **YES, still required** → **Leaf C: Rule Consequentialism/Institutional Focus** (e.g., Hooker, Murphy).  
    *Duty depends on social rules/collective compliance. Personal sacrifice isn’t reduced, but unfairness triggers exemptions.*  
  - **NO, not required if it crushes you** → **Leaf D: Agent-Centered Prerogative** (e.g., Scheffler).  
    *You may weight your interests more heavily than the greater good.*  

  #### **Node 5 (from NO): Flourishing Floor**  
  *Is there a base level of well-being (health, key relationships, purpose) below which you’re* ***never*** *required to sacrifice, even for enormous gains to others?*  
  - **YES, absolute floor** → **Leaf E: Prerogative + Threshold** (Scheffler+).  
    *Prerogative has limits; you can’t be morally required to destroy your core well-being.*  
  - **NO, no floor** → Go to Node 6  

  #### **Node 6 (from NO): Ideal Observer**  
  *Imagine a person who feels no pull toward her own projects (career, hobbies, relationships). She donates every spare dollar to charity. Is she...*  
  - **ADMIRABLE, the ideal moral agent** → **Leaf F: Alienation as Irrelevant** (e.g., hardline consequentialists).  
    *Alienation is a psychological flaw, not a moral problem.*  
  - **DEFECTIVE, missing something human** → **Leaf G: Hybrid Consequentialism** (e.g., Railton).  
    *Caring for personal projects is *indirectly* optimal (sustains your effectiveness).*  

  #### **Node 7 (from Node 3 if needed): Sacrifice Type**  
  *For identical total donation amounts, is skipping daily coffee ($5) for 1 year morally* ***different*** *from selling your car once ($1,800)?*  
  - **YES, small daily costs feel more intrusive** → *Reinforces Leaf G (Hybrid)*  
  - **NO, only total impact matters** → *Reinforces Leaf A or B*  

  ---

  ### **Key to Leaves**
  | Leaf | Position | Core Idea | Handles Complaints |
  |------|----------|-----------|-------------------|
  | **A** | Unlimited Act Consequentialism | Always demand optimal acts | Ignores all objections |
  | **B** | Satisficing/Scalar | "Good enough" suffices; no bright lines | Reduces absolute sacrifice |
  | **C** | Rule/Institutional | Duty depends on collective compliance | Fixes fairness |
  | **D** | Agent-Centered Prerogative | Morally weight your own interests | Fixes alienation & sacrifice |
  | **E** | Prerogative + Threshold | Prerogative, but not below flourishing floor | Fixes alienation & absolute sacrifice |
  | **F** | Alienation-Irrelevant | Alienation is a personal failing | Ignores alienation |
  | **G** | Hybrid Consequentialism | Personal commitments as *indirectly* optimal | Fixes alienation via means-end |

  ---

  ### **Unoccupied Combinations & Why**
  1. **"Fairness matters but NO absolute floor for sacrifice" (e.g., Node 4 → YES + Node 5 → NO)**  
     *Why unoccupied?* Logically unstable. If fairness reduces demands, but no floor exists, you could demand extreme sacrifice in unfair conditions—defeating the point. Positions like **C** avoid this by linking fairness to *exemptions*, not infinite demands.  

  2. **"Alienation irrelevant but YES to flourishing floor" (e.g., Node 6 → ADMIRABLE + Node 5 → YES)**  
     *Why unoccupied?* The floor implies alienation *matters* (crushing your life is bad). Calling the alienated observer "admirable" conflicts with valuing a flourishing floor. **F** rejects floors; **E** rejects admiration for alienation.  

  ---

  ### **Indistinguishable Leaves (as predicted!)**
  - **Leaf D (Prerogative) vs. Leaf C (Rule/Institutional)** often agree on cases but for **different reasons**:  
    - *Example: Skipping the birthday dinner.*  
      - **D**: Permissible because *your relationships matter to you*.  
      - **C**: Permissible because *others aren’t donating*, so requiring it of you is unfair.  
    - *Where they might diverge*: In a fair world (everyone donates 10%), **C** might require the birthday shift; **D** would still permit skipping it. But since we live in an unfair world, they *de facto* align often.  
    - *Tree limitation*: Cases like the birthday shift don’t specify social context, so they don’t force a split.  

  - **Leaf B (Satisficing) vs. Leaf G (Hybrid)** can blur on outcomes:  
    - Both permit keeping some money in Node 2.  
    - *Difference*: **B** says suboptimal acts are *directly* permissible; **G** says self-focus is *instrumentally* optimal. Realistically, intro cases won’t tease this apart.  

  ---

  ### **Why This Works for Your Study Group**
  - **No jargon in nodes**: Cases use relatable dilemmas (birthdays, coffee money, inheritances).  
  - **Branching logic**: Forces separation of sacrifice/fairness/alienation (e.g., Node 3 isolates fairness; Node 6 isolates alienation).  
  - **"Unoccupied" notes**: Shows where theory gaps exist (e.g., no one combines fairness with no-floors).  
  - **Indistinguishability flags**: Highlights where positions overlap in practice (D vs. C), so your group can debate *why*.  

  Your friend is right: the literature often conflates these, and mapping cases to positions reveals odd alliances (e.g., a fairness-focused person might land near an alienation-focused one). Use this tree to sort group members first, *then* reveal labels—it’ll make the scramble clear.
