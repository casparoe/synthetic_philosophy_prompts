prompt: |-
  I am a control engineer: fluent in observers, Kalman filtering, LQR, setpoints, and disturbance rejection, and I know enough machine learning to follow variational inference, but I have never studied theoretical neuroscience. Restate Friston's free energy principle and the predictive-processing account of the brain in my vocabulary, as faithfully as you can: variational free energy as the ELBO-like bound an approximate posterior drives down, prediction error as the innovation term a Kalman filter already works to whiten, and active inference as the case where the estimator closes the loop around the plant by acting on the world rather than only correcting its internal state. Then give me the residue report, claim by claim: which parts of the free-energy story are things control theory already does under another name, which parts translate only with distortion, and which parts have no counterpart in my vocabulary at all. I am especially suspicious of three moves: (i) the claim that there is no objective function imposed from outside, because an organism just tends to occupy a small set of characteristic states — is that anything more than a setpoint smuggled into the priors, and can I even distinguish the two? (ii) the claim that perception and action minimize the same quantity by two routes — from where I sit, moving the plant so the measured output matches the model is exactly backwards from a servo loop, and I want to know whether that inversion is substantive or merely verbal; and (iii) the slide from free energy as a bound on instantaneous surprisal of a sensory state to minimizing the entropy of the organism's states over time — those are not the same quantity, and I want to know whether the principle depends on their being run together. For each residue, say whether it reflects a gap in my vocabulary or a genuine unclarity in the principle itself. End with a single line of the form "Residue: <one sentence naming the most important thing that does not survive the translation, and why>".
reasoning: |-
  We are going to restate Friston's Free Energy Principle (FEP) and the predictive processing account in control-theoretic terms.

  Key concepts in your vocabulary:
  - Observers: state estimators that infer the hidden states of a system from measurements.
  - Kalman filtering: an optimal recursive Bayesian filter for linear systems with Gaussian noise; minimizes prediction error (innovation) to update the state estimate.
  - LQR: Linear Quadratic Regulator, an optimal controller that minimizes a quadratic cost function.
  - Setpoints: desired reference values for the system outputs.
  - Disturbance rejection: the ability of a control system to counteract the effects of external disturbances.
  - Variational inference: a method to approximate a posterior distribution by minimizing a bound (ELBO) on the negative log evidence (marginal likelihood).

  Restatement:

  1. **Variational Free Energy (VFE) as ELBO-like bound**: 
     In variational inference, we approximate the true posterior p(state | sensory data) with a tractable distribution q(state). The ELBO (Evidence Lower BOund) is a bound on the negative log evidence (also called surprisal or marginal likelihood). Minimizing VFE (which is the same as maximizing the ELBO) is equivalent to minimizing the Kullback-Leibler divergence between q and the true posterior. In the brain, this means that the brain maintains an internal model (an approximate posterior q) that it updates to minimize VFE. This is the perception part.

  2. **Prediction Error as Innovation**:
     The brain is seen as a hierarchical predictive model. At each level, the model generates predictions (top-down) about the sensory input (or the state at the level below). The difference between the actual input and the prediction is the prediction error (innovation). This error is then used to update the internal state (the estimate) in a way that resembles a Kalman filter. The goal is to "whiten" the prediction error (i.e., minimize it) to have a more accurate model.

  3. **Active Inference**:
     In control theory, we typically design a controller (e.g., LQR) that uses the state estimate to compute control actions that drive the system to a setpoint. In active inference, the same VFE that is minimized in perception is also minimized by action. Instead of just updating the internal state (perception), the system can also act on the world to change the sensory input to match the predictions. This is like closing the loop by acting on the plant so that the measured output becomes closer to the predicted output. Thus, action is seen as a way to minimize prediction error by changing the sensory data (instead of changing the model). This is a dual route: perception updates the model to fit the data, and action changes the data to fit the model.

  Residue Report:

  Claim (i): "No objective function imposed from outside; organism tends to occupy a small set of characteristic states"

  - Control theory typically has an explicit setpoint or cost function that the controller minimizes. In FEP, the "setpoint" is encoded in the prior beliefs (the organism's model of its preferred states). The organism is believed to have a prior that it will remain in states with high probability (low surprisal). This is similar to having a setpoint, but it is a probabilistic setpoint (a prior distribution over states). The distinction is subtle: in control, the setpoint is often a fixed point, while in FEP it is a distribution. Moreover, in FEP, the prior is not imposed from outside but is part of the organism's generative model (which is shaped by evolution and learning). However, from a control perspective, you can view the prior as a setpoint that is probabilistic and can adapt. The gap here is not fundamental: both are about driving the system to a desired state. The difference is that in FEP the "desired state" is defined by the prior, and there is no external reference. But note that the prior itself is a model of the organism's characteristic states. So, it is a setpoint in the priors. The translation is fairly direct, but the FEP emphasizes that the setpoint is part of the organism's model and not externally given. However, in adaptive control, setpoints can also be learned or adapted.

  Residue: This claim translates with minimal distortion. The setpoint is indeed encoded in the priors. The novelty is in the assertion that the prior is the only source of "setpoint" and that it emerges from the organism's model of its own survival. But in control, we can easily incorporate such a probabilistic setpoint (e.g., in a stochastic optimal control problem with a cost that penalizes deviations from a desired distribution).

  Claim (ii): "Perception and action minimize the same quantity by two routes"

  - In control, we typically separate the estimator (which minimizes prediction error to get the best state estimate) and the controller (which uses that estimate to compute actions that minimize a cost function). In active inference, both perception and action minimize the same VFE. The controller's role is reframed: instead of minimizing a cost that might be arbitrary, it minimizes the same VFE by changing the sensory input. This is a substantive inversion: in a servo loop, we change the plant's state to match the setpoint (so that the error between setpoint and measured output is minimized). In active inference, the action changes the sensory input so that it matches the prediction (which is generated by the model, including the prior). Thus, the controller is effectively making the world conform to the model. This is different from a standard servo because in a servo we have an external setpoint and we change the plant to match it, whereas in active inference the setpoint is internal (the prediction) and we change the world to match the prediction. The inversion is substantive because it unifies perception and action under a single objective (VFE). However, note that in control we can design a system that minimizes a single cost (like in LQG, which combines LQR and Kalman filtering) but the cost for the controller and the estimator are different (the estimator minimizes the mean squared error of the state, the controller minimizes a cost that includes state and control effort). In active inference, both are minimizing the same VFE.

  Residue: This part translates with some distortion. Control theory typically has two separate objectives (estimation and control). The unification under one objective (VFE) is a key difference. However, note that in LQG, the separation principle holds and the overall objective is a quadratic cost that is minimized by the combined system. But the cost in LQG is not the same as VFE. The inversion (changing the world to match the model) is a distinct perspective. It is not merely verbal because it leads to a different architecture: in active inference, action is driven by the same prediction errors that drive perception, but to change the sensory input. This is a genuine difference.

  Claim (iii): "Slide from free energy (bound on instantaneous surprisal) to minimizing the entropy of the organism's states over time"

  - VFE is a bound on the surprisal (negative log probability) of the current sensory input. The long-term goal is to minimize the average surprisal over time, which is equivalent to maximizing the entropy of the sensory states? Actually, note: the average surprisal is the entropy of the sensory states only under ergodic assumptions. But Friston argues that minimizing the average surprisal is equivalent to minimizing the entropy of the organism's hidden states (because the organism exists in a limited set of states). However, the entropy of the hidden states and the entropy of the sensory states are not the same. The FEP links them by the generative model (which maps hidden states to sensory states). The key step is the assumption that the organism must maintain its states within bounds to survive, so it must minimize the entropy of its hidden states (i.e., remain in a small set of states). The free energy principle then claims that minimizing VFE at each time step (which bounds the surprisal of the current sensory state) will, in the long run, minimize the entropy of the hidden states. This is a non-trivial step. In control, we design for stability and performance, which might include keeping the system in a safe region (a set of states). But we don't typically minimize the entropy of the state over time. We might minimize a cost that penalizes deviations from a setpoint, which keeps the state distribution tight (low entropy). So, the connection is that by minimizing the instantaneous surprisal (via VFE) the system is effectively minimizing the long-term entropy of its states. However, the mathematical link between instantaneous VFE and long-term state entropy is not direct and requires assumptions (like ergodicity and a generative model that links sensory and hidden states). 

  Residue: This part translates with distortion. Control theory does not typically equate minimizing a per-time-step cost (like VFE) with minimizing the entropy of the state over time. The gap is in the theoretical link: FEP makes a strong claim that minimizing VFE (which bounds sensory surprisal) leads to minimizing the entropy of the hidden states (which is necessary for survival). This is a key part of the theory that does not have a direct counterpart in control. The unclarity is in the principle: it relies on a model of the environment and the organism that must be structured in a particular way (e.g., the Markov blanket) to make this link. Without that structure, the step is not justified.

  Summary of residues:

  - Claim (i): Minimal distortion. Setpoint is in the prior. But the prior is adaptive and shaped by evolution, which is similar to adaptive setpoints in control. Gap: none significant.

  - Claim (ii): Some distortion. The unification of perception and action under one objective (VFE) and the inversion (action changes the world to match the model) is a substantive difference. Gap: in control, we typically have two separate objectives. This is a genuine difference in the architecture.

  - Claim (iii): Substantial distortion. The link between minimizing instantaneous VFE and long-term state entropy is non-trivial and relies on specific assumptions. Control theory does not have a direct counterpart for this link. Gap: a genuine unclarity in the principle because the step from sensory surprisal to hidden state entropy is not fully transparent and requires the generative model to have a particular structure.

  Residue: The most important thing that does not survive the translation is the theoretical leap from minimizing the bound on sensory surprisal (a per-timestep quantity) to the claim that this necessarily minimizes the entropy of the organism's hidden states over time, because it relies on unstated assumptions about the generative model and the environment that are not part of standard control theory.
answer: |-
  ### Restatement of Friston's Free Energy Principle (FEP) in Control-Theoretic Terms  
  **Core Idea**: The brain is a hierarchical dynamical system that minimizes *variational free energy* (VFE) to maintain homeostasis. VFE is a bound on *surprisal* (negative log probability of sensory data given a generative model), analogous to the ELBO in variational inference.  

  1. **Variational Free Energy (VFE) as an ELBO-like Bound**:  
     - **Translation**: VFE is a tractable upper bound on surprisal \(-\log p(\text{sensory data})\). Minimizing VFE approximates Bayesian inference over hidden states (e.g., external causes of sensations).  
     - **Mechanism**: The brain maintains an *approximate posterior* \(q(\text{hidden states} | \text{sensory data})\) and iteratively updates it to tighten the VFE bound, akin to variational inference optimizing the ELBO.  

  2. **Prediction Error as Innovation**:  
     - **Translation**: Sensory data is compared to *predictions* from a generative model (top-down priors). The mismatch is *prediction error* (PE), identical to the **innovation term** in a Kalman filter.  
     - **Mechanism**: Hierarchical cortical layers form a predictive-coding circuit. PE is "whitened" (minimized) by:  
       - **Perception**: Updating the approximate posterior (state estimation).  
       - **Action**: Changing sensory inputs via motor outputs (active inference).  

  3. **Active Inference as Closed-Loop Control**:  
     - **Translation**: When PE cannot be minimized by perception alone, the system acts on the environment to alter sensory data, making inputs match predictions. This is **dual to disturbance rejection**:  
       - Standard control: Adjust internal states (e.g., LQR) to track a setpoint despite disturbances.  
       - Active inference: Adjust the *world* (disturbance source) so that inputs align with predictions (priors).  

  ### Residue Report: Claims vs. Control Theory  
  **Claim (i): "No objective function; organisms occupy characteristic states"**  
  - **Your Suspicion**: Is this just a setpoint smuggled into priors?  
  - **Translation**: The "characteristic states" are encoded as *priors* in the generative model (e.g., prior beliefs about homeostasis). Action/perception minimize VFE to avoid surprising (non-prior) states.  
  - **Residue Analysis**:  
    - **Control-Theoretic Counterpart**: Yes, priors ≈ probabilistic setpoints (e.g., a target distribution in stochastic optimal control).  
    - **Distortion**: Minimal. FEP reframes setpoints as *learned/internalized* priors (evolutionarily encoded), not external commands. But mathematically, priors **are** setpoints.  
    - **Gap**: Your vocabulary suffices. No unclarity in FEP here.  

  **Claim (ii): "Perception and action minimize the same VFE"**  
  - **Your Suspicion**: Acting to make inputs match predictions feels "backwards" (inverting servo loops).  
  - **Translation**:  
    - **Perception**: Updates \(q\) to explain away PE (state estimation).  
    - **Action**: Drives motors to change sensations, reducing PE (like inverting the servo: plant output \(\rightarrow\) setpoint).  
  - **Residue Analysis**:  
    - **Control-Theoretic Counterpart**: Separation of estimation and control is standard (e.g., LQG). FEP unifies them under one objective (VFE).  
    - **Distortion**: **Substantive inversion**. In control, you design a controller (e.g., LQR) to minimize tracking error; in FEP, "control" (action) minimizes the same PE as perception. This is not verbal sleight-of-hand—it implies actions are generated *directly* from PE, not a separate controller.  
    - **Gap**: Genuine architectural difference. FEP’s "action" bypasses classical control loops by using PE to drive both estimation and motor output.  

  **Claim (iii): "VFE minimization → Long-term state entropy minimization"**  
  - **Your Suspicion**: Bounding instantaneous surprisal ≠ minimizing entropy over time.  
  - **Translation**: FEP claims minimizing VFE (surprisal bound) *implies* minimizing the entropy of the organism’s states long-term, as surprisal averages to entropy under ergodicity.  
  - **Residue Analysis**:  
    - **Control-Theoretic Counterpart**: None. Control optimizes *design-time* costs (e.g., LQR’s quadratic cost), not entropy reduction over unbounded horizons.  
    - **Distortion**: **Fatal unclarity in FEP**. The leap from VFE (local bound) to global entropy minimization relies on strong assumptions:  
      - The generative model perfectly mirrors the environment.  
      - Ergodic dynamics link time-averaged surprisal to entropy.  
      These are untestable and violate control principles (e.g., robustness to model mismatch).  
    - **Gap**: Genuine unclarity in FEP. Control theory rejects such unverifiable leaps.  

  ### Final Residue Statement  
  **Residue**: The claim that minimizing variational free energy (a local bound on surprisal) implies minimization of the entropy of an organism's states over time fails to survive translation, because it depends on unsupported assumptions about ergodicity and perfect generative models, which control theory explicitly avoids for robustness.
