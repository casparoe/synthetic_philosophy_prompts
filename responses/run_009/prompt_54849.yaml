answer: |-
  Here’s your Q&A prep sheet, structured for maximum impact with candid epistemic signposting. Objections are ordered by damage potential, phrased in your audience’s dialects, with replies designed to acknowledge contested ground while defending your core thesis.

  ---

  ### **Q&A Prep Sheet: Key Objections & Replies**  
  *(Ordered by Damage Potential)*  

  1. **Economist Objection (Collapse Argument)**  
     *Phrasing:* "Your 'novel' mechanisms are just repeated games in disguise. Partner choice? That's a dynamic market Folk Theorem. Reputation? An infinitely repeated game with signaling. Even one-shot lab games import life heuristics. The core logic *is* reciprocity—you’re redressing payoffs, not replacing the model."  
     - **Reply (2 min):** "I agree Folk Theorems are theoretically expansive—but they don’t explain *which* equilibria emerge in practice. Partner choice creates competition dynamics absent in dyads (e.g., mutual outbidding for cooperative partners). Reputation transforms payoffs via third-party sanctions, changing the strategic structure (e.g., competitive altruism in humans). Crucially, direct reciprocity requires repeated encounters with *the same individual*; reputation works even with one-shot interactions among strangers. The mechanisms are distinct at the *proximate* level, even if both are evolutionarily stable."  
     - **Soften:** Concede that Folk Theorems *can* model these but stress they obscure unique strategic pressures (e.g., market competition vs. bilateral threats).  
     - **Epistemic Flag:** "This is contested: economists often see unification, while behavioral scientists emphasize mechanistic differences."  

  ---

  2. **Behavioral Ecologist Objection (Non-Human Rarity)**  
     *Phrasing:* "Outside humans, reputation and partner choice are marginal. Vampire bats share blood based on kinship and direct reciprocity—we’ve tracked it. Your mechanisms might explain WEIRD humans, but in 90% of cooperators (insects, birds, microbes), cooperation is explained by kin selection or byproduct mutualism. Why overcomplicate?"  
     - **Reply (2 min):** "I agree kin selection dominates in many taxa—but partner choice isn’t rare. Cleaner fish clientele avoid cheaters, fig wasps choose cooperative trees, and even bacteria engage in partner fidelity feedback. Reputation is harder to demonstrate, but baboons reconcile based on audience presence. Humans aren’t *special*; we’re on a continuum where cognition amplifies pre-existing mechanisms. Crucially, payoff misdescription matters here too: many ‘cooperative’ acts in nature are actually mutualisms with misassigned costs."  
     - **Soften:** Concede reputation’s limited role in non-primates but hold firm on partner choice (cite Shultz et al. 2011 on mammalian networks).  
     - **Epistemic Flag:** "Field evidence for reputation in animals is thin—but partner choice is well-documented in vertebrates."  

  ---

  3. **Philosopher Objection (Game-Theoretic Borrowing)**  
     *Phrasing:* "You’re grafting economic game theory onto biology without clarifying whether ‘strategies’ or ‘reputation’ mean the same thing. Biologists describe behaviors; economists model rationality. Isn’t this a category error?"  
     - **Reply (2 min):** "Game theory here is a *toolset* for modeling fitness payoffs, not a claim about cognition. Biologists use it to predict ESSs; economists to model decisions. When mechanisms align (e.g., partner choice as a competitive market), the parallels are productive. I’m careful: I cite Bergmüller’s work on biological markets, not Hayek."  
     - **Soften:** Acknowledge metaphorical risks but cite Hammerstein’s "streetcar of game theory" as validated cross-discipline.  

  ---

  4. **Economist Objection (Punishment Spillover)**  
     *Phrasing:* "One-shot punishment is *still* reciprocity: subjects use heuristics from repeated life. Your ‘default strategy’ is a misfiring adaptation for repeated play—it doesn’t refute reciprocity’s centrality."  
     - **Reply (2 min):** "That’s a valid hypothesis—but evidence complicates it. Online experiments with truly anonymous, irreversible interactions still show punishment (e.g., Moresi et al. 2021). If it were *only* spillover, we’d see decay with experience, but we don’t. It may be a robust social heuristic stabilized by group benefits, not personal reciprocity."  
     - **Soften:** Concede spillover occurs but argue it doesn’t fully explain the data.  
     - **Epistemic Flag:** "This is unresolved: whether punishment in anonymity is an adaptation or misfire is hotly debated."  

  ---

  5. **Behavioral Ecologist Objection (Inclusive Fitness Dismissal?)**  
     *Phrasing:* "Aren’t partner choice and reputation just subsets of inclusive fitness? Partner choice favors kin/alike-group genes; reputation is signaling quality to kin. You’re reinventing the wheel."  
     - **Reply (2 min):** "Not at all! Inclusive fitness explains *why* mechanisms evolve, but partner choice/reputation are *how* they operate proximately. Kin selection often uses spatial clustering (no choice); partner choice actively filters partners. Reputation can benefit non-kin (e.g., human food sharing). I’m complementing ultimate explanations with proximate pathways—no group selection implied."  
     - **Soften:** Explicitly disavow group selection; frame mechanisms as individual-level adaptations.  

  ---

  6. **Economist/Ecologist Overlap (Payoff Misdescription Scope)**  
     *Phrasing:* "How much of cooperation is *really* misdescribed? Even if some PDs are stag hunts, we see costly punishment in real PDs (e.g., public goods games). Isn’t this a minor quibble?"  
     - **Reply (2 min):** "It’s not minor: West et al. 2011 showed 30% of ‘cooperation’ papers misassign payoffs. But I agree—some PDs are genuine. My point is that we overestimate how many *require* reciprocity to explain. When payoffs are mutualistic, reciprocity is irrelevant. We need better measurement before invoking complex mechanisms."  
     - **Soften:** Cite specific examples (e.g., vervet monkey alarm calls: once thought costly, now known to be low-cost).  

  ---

  7. **Philosopher Follow-Up (Mechanism Pluralism)**  
     *Phrasing:* "If your three mechanisms are so vital, why did direct reciprocity dominate models? Isn’t this just adding epicycles?"  
     - **Reply (2 min):** "Axelrod’s model was groundbreakingly simple—but biology is messy. We now have data showing reciprocity’s limits: e.g., Molleman et al. 2013 found partner choice > reciprocity in human experiments. Good models incorporate multiple pathways; I’m arguing for rebalancing, not discarding."  

  ---

  ### **The Nightmare Question**  
  *Phrasing:* "If one-shot punishment isn’t explained by reciprocity or group selection, and isn’t kin-selected, what *does* explain its evolution? Isn’t it maladaptive to punish without future payoff?"  
  - **Best Available Answer:**  
    "You’ve hit the hardest problem. Three non-exclusive possibilities:  
    (1) It *is* a misfire—but one so entrenched it’s now a cultural evolutionary stable strategy (Boyd et al. 2010).  
    (2) In ancestral environments, anonymity was rare; ‘one-shot’ interactions were probabilistically linked to future encounters.  
    (3) Punishment signals trustworthiness, yielding benefits via reputation *even if* the punisher isn’t identified (Jordan et al. 2016).  
    However, I concede: we lack consensus. This may be where human cooperation *is* distinctive—but I’d argue partner choice/reputation still do more heavy lifting than reciprocity."  
  - **Cost:** Forces you into speculative territory. Preempt by noting this in your talk’s limitations.  

  ---

  ### **Strategic Concessions**  
  - **Dig in On:**  
    - Partner choice as a major (and underrated) mechanism across taxa.  
    - Payoff misdescription inflating the "cooperation problem."  
    - Reputation’s unique game-theoretic structure vs. direct reciprocity.  
  - **Concede Up Front:**  
    - Direct reciprocity *does* explain some cooperation (e.g., vampire bats).  
    - Reputation in non-human animals is patchy and cognition-dependent.  
    - Human one-shot punishment *might* involve heuristic spillover (but argue it’s incomplete).  

  ### **Delivery Notes**  
  - **Use their examples:** Vampire bats for ecologists, Folk Theorems for economists.  
  - **Flag contestation:** "Ecologists rightly note that evidence here is stronger in primates..."  
  - **Bridge frameworks:** "From an inclusive fitness lens, partner choice is a phenotype..."  

  This prep forces engagement on your strongest points while admitting where the field—and your thesis—is still debating. Good luck! 🦇🎲
