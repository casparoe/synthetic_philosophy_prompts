prompt: |-
  My labmate and I have been circling the underdetermination thesis for weeks, and I'd like your credence on a specific version of it. Here's the proposition, stated as precisely as I can: for at least one pair of incompatible theories that are (or could be) empirically equivalent with respect to some domain, no evidential consideration and no extra-evidential virtue ever makes one of them the rationally obligatory choice — where this is meant to be permanent underdetermination, not the merely transient kind that eventually dissolves when new evidence arrives or auxiliary assumptions get reworked. Give me a number and the full decomposition, including at least these terms: (1) the probability that there exist, or will exist, genuinely empirically equivalent rivals that are not merely notational variants or ad hoc embroideries of a single theory; (2) the probability that, given such rivals, none of the virtues philosophers standardly invoke — simplicity, unification, explanatory depth, fecundity — is truth-indicative rather than merely pragmatic; and (3) the probability that no possible future evidence could break the tie even in principle. Attach one line of justification to each, combine them, and then tell me which term you are least confident in and what argument or historical case would move it most. Finally, suppose someone puts their credence in the proposition at 0.75 and someone else at 0.1: tell me where their disagreement most likely lives — in whether the rival theories are real, in whether the theoretical virtues track truth, or in what standard a choice between theories has to meet before it counts as rationally determined.
