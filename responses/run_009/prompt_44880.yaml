prompt: |-
  I am drafting a paper on the lottery paradox, and before I commit to any solution I want the specification a solution must meet. Write me the desiderata: what an adequate account of rational acceptance — or, more generally, of the relation between degrees of belief and outright belief — has to deliver, with the case or consideration behind each requirement. The core cases the account must handle are, first, the lottery itself: why I am reasonable to accept that my one-in-a-million ticket will lose, and why the same reasoning cannot be aggregated across all million tickets into accepting that every ticket loses; second, the preface paradox, where an author who has individually verified each claim of her book can still reasonably accept that the book contains at least one error — and note that the account must not dissolve the preface by appeal to inductive evidence about books in general, since the paradox survives when each claim is individually checked. Beyond those two, I want desiderata for the less-discussed structural cases: iterated lotteries, where closure over accepted lottery propositions compounds over time into absurdity if the account permits any lottery acceptance at all; conjunction over independent high-probability claims that are not lottery propositions, where intuition goes the other way and agglomeration seems fine; and the contrast case where, after the draw, I come to know my ticket lost — the same probability that failed to support acceptance before the draw supports knowledge after, so the account must locate what changed without smuggling in a time-indexed fudge.

  Then there are the constraints from the surrounding architecture: the account must respect closure of rational acceptance under conjunction or say exactly which restricted closure principle survives, and it must not merely relabel the credence — an account on which accepting p just is having credence above a number has to earn its keep by explaining why that number does the work, and the desiderata should be stated so they do not beg the question against it. My own working picture, which I want included among the desiderata rather than treated as settled: outright belief functions as a lossy interface over credences — the format in which they are stored, transmitted, and used for action — so the account should say something about what fidelity the lossy encoding must preserve, e.g. that the interface must not systematically mislead downstream action in the way naive thresholding arguably does when it flattens 0.999 into 1. Whether that constraint can be made precise is part of what I want assessed; treat it as negotiable but take it seriously.

  For each requirement, say what motivates it and whether it is non-negotiable or a preference of one camp — and flag explicitly which subsets of the desiderata are jointly unsatisfiable, since I take it that closure plus single-case high-probability acceptance plus aggregation is already inconsistent, in which case the real content of a solution is its choice of which leg to break, and the desiderata list should make those choices visible rather than hiding them. Finally, briefly: how the three standard escape routes — dropping closure, dropping the threshold, dropping the idea that rational acceptance is all-or-nothing — do against your list. Keep the weight on the criteria; the scorecard is for me to argue with.
reasoning: |-
  We are to list desiderata for an adequate account of rational acceptance (or the relation between degrees of belief and outright belief). The core cases are:
  1. The lottery paradox.
  2. The preface paradox (without appeal to general inductive evidence).
  3. Iterated lotteries (structural case).
  4. Conjunction of independent high-probability non-lottery claims (where agglomeration is acceptable).
  5. The contrast case: before vs. after the lottery draw (same probability, but after the draw we have knowledge).

  Additionally, we have constraints from the surrounding architecture:
  - Closure under conjunction (or a restricted closure principle) must be respected or explicitly denied.
  - The account must not be a mere relabeling of credence above a threshold without explaining why that threshold does the work.

  We also have the user's working picture: outright belief as a lossy interface over credences, which must preserve fidelity (avoid systematic misleading in downstream action).

  We must also flag which desiderata are jointly unsatisfiable (e.g., closure, single-case high-probability acceptance, and aggregation are inconsistent) and note the trade-offs.

  Finally, we briefly assess three standard escape routes: dropping closure, dropping the threshold (i.e., no high-probability acceptance), and dropping the all-or-nothing nature of rational acceptance.

  We structure the desiderata as follows:

  **Desideratum 1: Single-case high-probability acceptance (for lottery propositions)**
  - **Case**: The lottery paradox. In a fair lottery with one million tickets, one wins. For any single ticket, the probability that it loses is 0.999999. It seems rational to accept that this ticket will lose (since it is highly probable). However, we cannot accept that every ticket loses because that would be inconsistent (since one wins). 
  - **Requirement**: The account must allow that in such a case, it is rational to accept of a single ticket (with very high probability of losing) that it loses.
  - **Non-negotiable?**: This is a core intuition of the paradox and must be accommodated by any solution that does not reject the idea that high probability can rationalize acceptance. However, note that one escape route (dropping the threshold) denies this.

  **Desideratum 2: Non-aggregation of lottery propositions**
  - **Case**: The lottery paradox (continued). Although we accept of each ticket that it loses, we cannot aggregate these acceptances to accept the conjunction (that every ticket loses) because that is false and inconsistent with the setup. 
  - **Requirement**: The account must not allow the aggregation of all these individual acceptances (for each ticket) into the conjunction that every ticket loses. 
  - **Non-negotiable?**: Yes, because the conjunction is false and irrational to accept. However, note that if we keep closure under conjunction, then this desideratum conflicts with desideratum 1 and closure.

  **Desideratum 3: Preface-style acceptance without general induction**
  - **Case**: The preface paradox. An author has individually verified each claim in her book, so for each claim she has a very high (even maximal) rational credence (say, based on proof). Nevertheless, she rationally accepts that the book contains at least one error. The account must not explain this by appealing to general inductive evidence (like "all books have errors") because the paradox survives even when each claim is individually checked (so the error might be a slip in the checking process, not in the original claim).
  - **Requirement**: The account must allow that it is rational for the author to accept that there is at least one error in the book, even though she rationally accepts (or even knows) each individual claim. Moreover, the account must explain why this does not lead to a contradiction (since the conjunction of all claims and the existence of an error are inconsistent).
  - **Non-negotiable?**: Yes, because it is a central paradox.

  **Desideratum 4: Handling iterated lotteries without compounding absurdity**
  - **Case**: Iterated lotteries. Suppose we have a multi-stage lottery. For instance, each day there is a lottery with a one-in-a-million chance of winning. We might accept that today I will lose (because the chance of winning is tiny). Then we accept that tomorrow I will lose, and so on. If we accept closure under conjunction, then we would accept that I lose every day for the next 10,000 days. But the probability of that might be very low (if the lotteries are independent, then the probability of losing 10,000 times is (0.999999)^10000, which is about 0.99, but if we go long enough, it becomes arbitrarily low). However, the problem is that we are accepting a proposition that, over a long period, becomes very improbable. Moreover, if we accept that we lose on day 1, and then accept that we lose on day 2, etc., then we might be forced to accept a conjunction that is very improbable. The account must avoid compounding into absurdity (e.g., accepting something that is highly improbable).
  - **Requirement**: The account must either not allow acceptance in the single case (thus denying desideratum 1) or must not allow closure under conjunction for such propositions (thus denying unrestricted closure) or must have a mechanism that blocks the aggregation in such iterated cases without ad hoc restrictions.
  - **Non-negotiable?**: This is a structural challenge that any account must handle. The account must not lead to accepting highly improbable conjunctions in the iterated lottery.

  **Desideratum 5: Agglomeration of independent high-probability non-lottery claims**
  - **Case**: Conjunction of independent high-probability non-lottery claims. Suppose we have a set of independent propositions, each of which is highly probable, but they are not lottery propositions (e.g., "It will rain in London tomorrow", "The stock market will go up next week", etc.). Intuitively, we can accept each and also accept their conjunction (if the number is not too large and the probabilities are high enough). 
  - **Requirement**: The account must allow that in such cases, we can rationally accept the conjunction of these independent high-probability propositions (at least when the number is moderate and the probability of the conjunction remains high). This is in contrast to lottery propositions, where agglomeration fails.
  - **Non-negotiable?**: This is a strong intuition and a requirement for a non-skeptical account. However, note that if we allow this, then we must explain the difference between lottery and non-lottery cases.

  **Desideratum 6: The contrast case (before vs. after the draw)**
  - **Case**: Before the lottery draw, I have a very high credence that my ticket will lose (say, 0.999999), but I do not know it will lose (so I do not have outright belief, or at least I do not have knowledge). After the draw, when I see that my ticket lost, I come to know that it lost. The probability (if we construe it as the chance) is now 1 (or the credence is 1). But note that even if we keep the same credence (0.999999) after the draw (if we haven't seen the result), we still don't know. So the account must explain what changed without merely appealing to time (or to the draw having occurred) in an unprincipled way. The change is in the epistemic position: after the draw, I have evidence (the result) that I lacked before.
  - **Requirement**: The account must explain why, in the single case, the same high probability (before the draw) does not suffice for knowledge (or perhaps even for rational outright belief) but after the draw (with the same numerical probability of 1 for the outcome that happened) we have knowledge. The account must locate the difference in the epistemic factors beyond mere probability.
  - **Non-negotiable?**: This is crucial for connecting to epistemology and the concept of knowledge.

  **Desideratum 7: Closure under conjunction (or a motivated restriction)**
  - **Requirement**: The account must either respect closure under conjunction (i.e., if one rationally accepts p and rationally accepts q, then one rationally accepts p and q) or must provide a well-motivated restriction on closure. The restriction should explain why closure fails in the lottery and preface cases but holds in the non-lottery conjunction case (desideratum 5).
  - **Non-negotiable?**: Closure is a highly desirable property for a logic of rational acceptance, but it is known to be problematic in the lottery and preface. So it is negotiable in the sense that we might drop it, but if we do, we must have a principled alternative.

  **Desideratum 8: Not merely a credence threshold**
  - **Requirement**: If the account defines rational acceptance as having a credence above a threshold (say, t), then it must explain why that particular threshold does the work (and why it is not arbitrary) and how it avoids the lottery paradox (which arises for any threshold less than 1). Moreover, it must explain why the threshold is not context-dependent in an unprincipled way.
  - **Non-negotiable?**: This is a constraint to avoid triviality. Any threshold account must face the lottery paradox and the fact that for any threshold less than 1, there is a lottery large enough to create the paradox.

  **Desideratum 9: The lossy interface constraint (fidelity)**
  - **Motivation**: Outright belief is a lossy compression of credences, used for storage, transmission, and action. The lossy encoding must not systematically mislead downstream action. For example, in a decision problem, acting on the belief that p (when p is not certain) should not lead to choices that are systematically worse than acting on the full credence. 
  - **Requirement**: The account must ensure that the mapping from credences to outright beliefs does not lead to systematically suboptimal actions. For instance, if we flatten a 0.999 credence to an outright belief (1), then in a decision where the cost of being wrong is extremely high, acting on the outright belief might lead to disaster, whereas the credence would have recommended a more cautious action. The account must either avoid such flattening or show that the flattening is safe in the intended contexts of use.
  - **Non-negotiable?**: This is the user's working picture and is negotiable in the overall debate, but it is a serious constraint to consider.

  **Joint unsatisfiability and trade-offs:**
  It is well-known that the following three are jointly inconsistent:
  - Closure under conjunction (desideratum 7, unrestricted).
  - Single-case high-probability acceptance (desideratum 1).
  - Non-aggregation (desideratum 2, which is the requirement that we cannot aggregate all lottery propositions).

  Therefore, any solution must break at least one of these. The standard options are:
  1. Drop closure (e.g., by denying that rational acceptance is closed under conjunction).
  2. Drop single-case high-probability acceptance (i.e., deny that high probability alone is sufficient for rational acceptance in lottery cases).
  3. Drop non-aggregation? But that leads to contradiction. So we must break one of the first two.

  Also, note that desideratum 5 (agglomeration of non-lottery claims) requires that closure (or something close) holds in some cases, so if we drop closure, we must explain why it holds for non-lottery cases but not for lottery cases.

  **Brief assessment of the three escape routes:**

  1. **Dropping closure**:
     - Satisfies: Desiderata 1 (single-case acceptance), 2 (non-aggregation), 3 (preface), 4 (iterated lotteries, because we don't aggregate), 5 (if we allow closure only for non-lottery claims, but that requires a principled distinction), 6 (contrast case, by appeal to other factors), 8 (if not threshold-based), 9 (if the lossy encoding is designed to avoid aggregation).
     - Fails: Desideratum 7 (closure) is dropped. The challenge is to motivate the failure of closure and to explain when closure holds (for non-lottery cases) and when it doesn't. Also, it might struggle with desideratum 5 if the non-lottery cases are too similar to lottery cases.

  2. **Dropping the threshold (i.e., no high-probability acceptance for lottery propositions)**:
     - This is the knowledge-based approach: one only accepts what one knows. Then, in the lottery, one does not accept that one's ticket will lose (because one doesn't know it).
     - Satisfies: Desiderata 2 (non-aggregation, because there is no acceptance to aggregate), 3 (preface: the author does not accept each claim? But then how does she write the book? This is problematic. Alternatively, she might know each claim but still accept that there is an error? But then we have a contradiction in acceptances. So the preface paradox might require a different treatment). Alternatively, the preface might be handled by a separate principle (e.g., an inductive argument about the possibility of error). But note the constraint: we cannot use general inductive evidence. So this approach might struggle with the preface. Also, it satisfies desideratum 4 (iterated lotteries: no acceptance) and 6 (after the draw, we know, so we accept) and 7 (closure for known propositions) and 8 (not a mere threshold) and 9 (if we only accept what we know, then we are safe?).
     - Fails: Desideratum 1 (single-case acceptance in lottery) is denied. Also, desideratum 3 (preface) might be hard to handle: if the author knows each claim, then she should not accept that there is an error. But she rationally does. So this approach might have to deny that the author rationally accepts that there is an error (which is counterintuitive) or deny that she knows each claim (which is also counterintuitive, because she individually checked). Also, desideratum 5 (non-lottery agglomeration) might be satisfied only if we know each conjunct (then we know the conjunction) but if we don't know one, we might not know the conjunction.

  3. **Dropping the all-or-nothing nature (i.e., moving to degrees only)**:
     - This approach says there is no such thing as outright belief; we only have degrees of belief. Then we avoid the paradoxes because we don't have the step of "acceptance".
     - Satisfies: Avoids the paradoxes by denying the framework. It can explain the lottery and preface as cases where we have high credence in each but low credence in the conjunction (if the number is large) and that is consistent. It satisfies 1 (high credence), 2 (no outright belief so no aggregation of beliefs), 3 (high credence in each claim and high credence that there is an error? But note: if the claims are independent and each has credence 1, then the credence in the conjunction is 1, but the credence that there is an error is 0. So the preface might require that the credence in each claim is less than 1. This is the probabilistic approach to the preface: assign a small probability of error to each claim, then the probability of at least one error is high). It satisfies 4 (iterated lotteries: we have decreasing credence in the long conjunction) and 5 (non-lottery: we can have high credence in the conjunction if the probabilities are high and independent) and 6 (contrast: before, we have credence 0.999999; after, we update to 1). It satisfies 8 (no threshold for acceptance) and 9 (if we use the full credences for action, no lossy encoding, so no systematic loss of fidelity).
     - Fails: It denies the very existence of outright belief (which is a central notion in the paper and in ordinary discourse). Also, it does not satisfy desideratum 7 (closure) because there is no outright belief to close. But if we interpret closure for degrees, then closure of high probability under conjunction fails (so it doesn't hold). The main failure is that it does not account for our practice of forming and using outright beliefs.

  The above is a summary. We now present the desiderata in a list form as requested.
answer: |-
  ### Desiderata for an Adequate Account of Rational Acceptance  
  Below, I specify the desiderata an account must satisfy to resolve the lottery paradox and related challenges. Each requirement is motivated by a core case or theoretical constraint, with notes on negotiability and joint satisfiability. The core insight is that **closure + single-case high-probability acceptance + non-aggregation** is jointly unsatisfiable; thus, any solution must reject at least one. The desiderata make these trade-offs explicit.  

  #### Core Cases  
  1. **Single-Case High-Probability Acceptance (Lottery Propositions)**  
     - **Requirement**: Rational agents must be permitted to accept a single proposition \(p\) (e.g., "My lottery ticket loses") when its probability is sufficiently high (e.g., \(1 - \epsilon\) for small \(\epsilon\)), even if \(p\) is contingent and could be false.  
     - **Case**: Lottery paradox (intuition that it is rational to accept your ticket will lose in a fair 1,000,000-ticket lottery).  
     - **Negotiability**: Non-negotiable for accounts preserving probabilistic acceptance. *But* rejecting this dissolves the paradox (see Escape Routes).  
     - **Conflict**: Inconsistent with unrestricted closure (see Desideratum 7) and non-aggregation (Desideratum 2).  

  2. **Non-Aggregation of Lottery Acceptances**  
     - **Requirement**: The account must *block* the inference from rationally accepting each member of a set of lottery propositions (e.g., "Ticket \(i\) loses" for all \(i\)) to accepting their conjunction ("All tickets lose").  
     - **Case**: Lottery paradox (aggregating individual "loss" acceptances yields a contradiction with "one ticket wins").  
     - **Negotiability**: Non-negotiable—aggregation leads to absurdity.  
     - **Conflict**: Directly clashes with Desiderata 1 and 7 (closure).  

  3. **Preface Acceptance without Inductive Generalization**  
     - **Requirement**: Rational agents must be permitted to accept a global falsehood (e.g., "My book contains an error") while accepting each local proposition (e.g., individual claims in the book), *even when* each local proposition is verified with maximal justification (e.g., proof).  
     - **Case**: Preface paradox, where the author’s error-acceptance must not rely on inductive evidence (e.g., "Books usually have errors").  
     - **Negotiability**: Non-negotiable—solutions must handle the paradox on its own terms.  
     - **Note**: Forces a distinction between lottery and non-lottery propositions (see Desideratum 5).  

  #### Structural Cases  
  4. **Iterated Lotteries without Absurdity**  
     - **Requirement**: The account must prevent iterated acceptance (e.g., accepting "I lose the lottery on day \(d\)" for each \(d\)) from compounding into accepting a highly improbable long-run conjunction (e.g., "I lose every lottery for 10,000 days"), which may become less probable than a single loss.  
     - **Case**: Multi-stage lotteries where closure over time leads to accepting propositions with arbitrarily low probability.  
     - **Negotiability**: Non-negotiable—violation implies the account licenses epistemic self-sabotage.  
     - **Conflict**: Tests whether closure (Desideratum 7) can be restricted non-arbitrarily.  

  5. **Conjunction of Non-Lottery High-Probability Claims**  
     - **Requirement**: The account must *permit* agglomeration of acceptances for independent, non-lottery propositions (e.g., "It will rain in London tomorrow," "The S&P 500 will rise next week") when individual probabilities are high, even if the conjunction’s probability is slightly lower.  
     - **Case**: Intuitive permissibility of conjoining mundane high-probability beliefs (e.g., planning a picnic based on multiple weather forecasts).  
     - **Negotiability**: Non-negotiable for non-skeptical accounts—failure here would paralyze everyday reasoning.  
     - **Note**: Creates pressure to distinguish lottery/non-lottery propositions (e.g., via sensitivity, normality, or non-arbitrary reference classes).  

  6. **Contrast Case: Before vs. After the Draw**  
     - **Requirement**: The account must explain why a high probability \(1 - \epsilon\) for \(p\) ("My ticket loses") supports *knowledge* of \(p\) *after* the draw but not rational acceptance *before*, without invoking ad hoc temporal indexing.  
     - **Case**: Identical probability pre-/post-lottery draw, but post-draw justification yields knowledge.  
     - **Negotiability**: Non-negotiable—solutions must ground the epistemic change (e.g., in defeaters, evidence, or modal safety).  

  #### Architectural Constraints  
  7. **Closure Under Conjunction (or Motivated Restriction)**  
     - **Requirement**: The account must either (a) uphold closure (rational acceptance of \(p\) and \(q\) entails acceptance of \(p \land q\)) or (b) specify a principled restriction (e.g., closure only for non-lottery propositions).  
     - **Motivation**: Preserving deductive coherence in rational belief sets.  
     - **Negotiability**: Negotiable—rejecting closure is a major escape route (see below).  
     - **Conflict**: Jointly unsatisfiable with Desiderata 1 and 2. *Any solution must break one leg of this triad*.  

  8. **No Mere Credence Threshold**  
     - **Requirement**: If rational acceptance is defined as credence above a threshold \(t\), the account must:  
       - Explain why \(t\) is non-arbitrary (e.g., \(t = 0.999\) vs. \(0.99\)).  
       - Resolve the lottery paradox (which arises for any \(t < 1\)) without collapsing into skepticism.  
     - **Motivation**: Avoiding triviality—thresholds alone invite paradox and lack explanatory power.  
     - **Negotiability**: Non-negotiable—question-begging solutions are inadmissible.  

  9. **Lossy Interface Constraint (Fidelity)**  
     - **Requirement**: The mapping from credences to outright beliefs must not systematically distort downstream action. For example, treating credence \(0.999\) as belief must not cause significantly worse decisions than using the full credence (e.g., in high-stakes scenarios where false belief is catastrophic).  
     - **Motivation**: Beliefs function as compressed representations for storage/action; compression must not be *systematically* misleading.  
     - **Case**: Naive thresholding fails this by flattening \(0.999\) to \(1\), ignoring extreme negative utility if wrong.  
     - **Negotiability**: Negotiable but theoretically salient—reflects the functional role of belief.  

  #### Joint Unsatisfiability and Trade-Offs  
  - **Inconsistent Core**: Desiderata 1 (single-case acceptance), 2 (non-aggregation), and 7 (closure) are jointly *unsatisfiable*. A solution must:  
    - **Reject closure** (e.g., contextualism, non-agglomerative theories),  
    - **Reject single-case acceptance** (e.g., strict knowledge-based accounts), or  
    - **Reject non-aggregation** (incoherent; thus not viable).  
  - **Pressure Points**:  
    - Desideratum 5 (non-lottery agglomeration) requires closure to hold in *some* cases, forcing solutions to distinguish lottery/non-lottery propositions.  
    - Desideratum 4 (iterated lotteries) and 6 (contrast case) test whether the chosen "leg to break" generalizes non-arbitrarily.  
    - Desideratum 8 (no mere threshold) and 9 (fidelity) constrain probabilistic reductions.  

  #### Brief Assessment of Escape Routes  
  1. **Drop Closure** (e.g., Kyburg, Foley):  
     - **Pros**: Satisfies Desiderata 1, 2, 3, 4, 5 (if non-lottery propositions are agglomerable), 6, 8, 9.  
     - **Cons**: Violates Desideratum 7; must motivate why closure fails for lotteries but holds elsewhere. Struggles with Desideratum 5 if no clear lottery/non-lottery boundary.  

  2. **Drop Single-Case Acceptance** (e.g., Williamson’s knowledge-first):  
     - **Pros**: Satisfies Desiderata 2, 4, 6, 7 (closure for knowledge), 8, 9.  
     - **Cons**: Violates Desiderata 1 (no lottery acceptance) and 3 (preface—author cannot "know" each claim *and* accept an error). May lead to skepticism about everyday beliefs (Desideratum 5).  

  3. **Drop All-or-Nothing Belief** (e.g., Jeffrey’s probabilistic epistemology):  
     - **Pros**: Satisfies Desiderata 1, 2, 3 (via high credence in error), 4, 5, 6, 8.  
     - **Cons**: Violates Desiderata 7 and 9 (if action uses thresholds); abandons outright belief, failing to explain folk epistemology. Desideratum 3 may need inductive evidence (if local credences = 1).  

  ---  
  **Recommendation**: Structure your paper around which desiderata are prioritized and which "leg" of the inconsistency is broken. The lossy-interface constraint (Desideratum 9) offers a fertile ground for innovation but requires formalizing "systematic misleading" (e.g., via expected utility comparisons). Flag where existing solutions (e.g., pragmatic encroachment, sensitive-threshold views) succeed or fail your criteria.
