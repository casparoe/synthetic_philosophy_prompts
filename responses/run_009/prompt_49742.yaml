  I need to carefully separate several issues here: the actual mathematical result Lewis proved, his interpretation of that result, and how others interpreted it. The summary blurs these lines. Lewis proved the triviality under certain assumptions - that's correct. But his conclusion was that indicative conditionals aren't propositions with truth conditions, not that all conditionals lack truth values. For counterfactuals, he kept his possible-worlds semantics intact.

