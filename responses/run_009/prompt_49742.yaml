answer: |-
  Based on the summary provided and David Lewis's actual work (primarily "Probabilities of Conditionals and Conditional Probabilities," 1976, and *Counterfactuals*, 1973), here's a breakdown of the claims, separating accurate points, simplifications, and errors/misattributions:

  **Accurate Points in the Summary:**

  1.  **Lewis proved a triviality result in the 1970s:** This is correct. Lewis demonstrated that a seemingly intuitive principle about conditionals leads to absurd conclusions under standard assumptions.
  2.  **The principle: P(If A, then B) = P(B | A):** This principle, often called "Stalnaker's Thesis" (after Robert Stalnaker) or simply "The Equation," was the starting point. Lewis *used* this principle (proposed independently by Stalnaker and Adams) to derive his result. *(Minor point: Lewis didn't originally *propose* it himself as the summary states; he critically examined it.)*
  3.  **The absurd consequence:** Lewis showed that if this principle holds universally within a probability space containing even a few *logically independent* propositions, then *every* proposition in that space must have a probability of either 0 or 1. This is indeed absurd for any agent with non-extreme ("partial") degrees of belief about the world.
  4.  **The implication for indicative conditionals as propositions:** Lewis concluded that indicative conditionals ("If A, then B") **cannot be ordinary propositions** with standard truth conditions. If they were, they should obey the laws of probability for propositions, including The Equation. But since The Equation leads to triviality, they cannot be such propositions. This core implication of the result is widely accepted by logicians and philosophers working on conditionals.

  **Simplifications and Important Nuances:**

  1.  **"Cannot have truth conditions":** This is a strong phrasing. Lewis's result shows they cannot have truth conditions *like ordinary propositions* that embed freely in Boolean operations and obey standard probability calculus. However:
      *   **Not necessarily "no truth conditions whatsoever":** Lewis's result doesn't *force* the conclusion that they have *no* truth conditions at all. It forces the conclusion that they cannot have truth conditions that make them *propositions of the same kind as A and B* within the probability space. Many theorists (like Lewis himself for *indicatives*) concluded they lack truth values altogether. Others (like Stalnaker) sought to modify the logic/probability calculus to preserve truth conditions while avoiding triviality. Still, others (like defenders of the "suppositional" or "Adams/Bennett" view) explicitly deny they have truth conditions.
      *   **The inference is philosophical, not purely mathematical:** The mathematical result is that *if* conditionals are propositions *and* The Equation holds universally, *then* triviality ensues. Lewis (and many others) argued that since triviality is unacceptable and The Equation is highly intuitive (at least for simple cases), the culprit must be the assumption that conditionals are propositions with standard truth conditions. This is a powerful argument, but it's a philosophical interpretation of the mathematical result.
  2.  **"The argument applies to counterfactual conditionals":** This is **misleadingly oversimplified**. Lewis *did* show that the *mathematical structure* of his proof could be applied *if* one assumed P(If A, then B) = P(B | A) also held for counterfactuals ("If A had been the case, then B would have been the case"). However:
      *   **Lewis did NOT accept The Equation for counterfactuals:** Crucially, Lewis **rejected** the idea that The Equation holds for counterfactuals. His central argument in *Counterfactuals* was that counterfactuals *do* have truth conditions (given by his possible-worlds semantics) and that their probability is *not* generally equal to the corresponding conditional probability (especially when P(A) is low or zero). He argued counterfactuals are often *true* even when P(B|A) is undefined or low.
      *   **The application is hypothetical:** Lewis presented the application to counterfactuals primarily to show that *if* someone naively tried to apply The Equation to counterfactuals in the same way, they would also get triviality. But since he didn't accept The Equation for counterfactuals, he didn't see this as a problem *for his own theory*. He saw it as confirming that The Equation is false for counterfactuals.

  **Outright Errors and Misattributions:**

  1.  **"Lewis took his result to show that his own possible-worlds semantics for counterfactuals had rested on a mistake":** This is **flatly incorrect**. This is the most significant error in the summary.
      *   Lewis **vigorously defended** his possible-worlds semantics for counterfactuals throughout his career, *after* proving the triviality results.
      *   His view was precisely the *opposite* of what the summary claims: He argued that the triviality result *for counterfactuals* showed why The Equation (P(If A, then B) = P(B | A)) **must be false** for counterfactuals. Since his possible-worlds semantics assigned truth conditions to counterfactuals that generally made P(If A, then B) *different* from P(B | A) (especially when P(A) is low), his theory was **immune** to the triviality result *because it rejected The Equation for counterfactuals*. He saw his semantics as providing a principled reason *why* The Equation fails for counterfactuals.
      *   For *indicative* conditionals, Lewis *did* conclude that they likely lack truth values (and thus couldn't be handled by a standard possible-worlds semantics assigning truth values). But he **never** retracted his truth-conditional semantics for *counterfactuals* based on the triviality results. He saw them as fundamentally different kinds of conditionals.

  **Answering Your Specific Question:**

  > "whether the conclusion that conditionals lack truth values follows from anything Lewis himself established, or whether that is a further move that others made in response to his results."

  *   **Lewis himself drew this conclusion for *indicative* conditionals.** He argued that the triviality result showed indicative conditionals could not be propositions with standard truth conditions. Given the intuitive pull of The Equation for simple indicatives and the absurdity of triviality, he concluded the most plausible explanation was that indicative conditionals lack truth values altogether. He saw them as expressing conditional beliefs (a view aligned with Ernest Adams's earlier work).
  *   **He explicitly *rejected* this conclusion for *counterfactual* conditionals.** He maintained that counterfactuals *do* have truth conditions (provided by his possible-worlds semantics) and that the triviality result only showed that The Equation was false for them, not that they lacked truth values.
  *   **The inference is Lewis's own move:** While the mathematical result (triviality from The Equation + conditionals as propositions) is established, the philosophical conclusion "therefore, indicative conditionals lack truth values" is Lewis's interpretation and response to that result. Others (like Stalnaker) responded by trying to preserve truth conditions while restricting The Equation or modifying the logic.

  **In Summary for a Logician:**

  *   **Accepted:** Lewis proved that The Equation (P(A→B) = P(B|A)) cannot hold universally if A→B is a proposition in the same probability space as A and B, without leading to trivialization (all probabilities 0 or 1).
  *   **Accepted Implication (by most):** Indicative conditionals cannot be standard propositions with truth conditions satisfying standard probability calculus *if* one wants to preserve the intuitive validity of The Equation in simple cases.
  *   **Simplification/Oversimplification:** Stating they "cannot have truth conditions" without qualification glosses over the nuance that alternative, non-standard truth-conditional theories exist (though they face significant challenges). Saying the argument "applies to counterfactuals" is technically true *mathematically* but highly misleading philosophically without emphasizing Lewis's rejection of The Equation for them.
  *   **Major Error:** Claiming Lewis thought the triviality result undermined his possible-worlds semantics for counterfactuals is completely backwards. Lewis used his semantics for counterfactuals to *explain why* The Equation fails for them and thus *defend* his semantics against the triviality result. He abandoned truth conditions for *indicatives*, not counterfactuals.

  The ending of the book's summary significantly misrepresents Lewis's own assessment of the implications of his result for his counterfactual semantics. Lewis remained a staunch defender of possible-worlds semantics for counterfactuals throughout his career.
