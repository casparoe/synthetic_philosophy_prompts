  For the counterfactual part, I'll point out that Lewis explicitly said the triviality didn't undermine his counterfactual semantics because counterfactuals aren't zero-probability conditionals. The summary completely misrepresents his position here. I should mention that Lewis even suggested his semantics might avoid the triviality for counterfactuals since they have truth values.

