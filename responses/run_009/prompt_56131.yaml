prompt: |-
  Historical-Jesus scholarship works by sifting the gospels through "criteria of authenticity": a saying or deed is credited to Jesus when it appears in multiple independent sources, when it would have embarrassed the early church, or when it is dissimilar to both early Judaism and the church's own theology; material is denied to Jesus when it looks like something the church could have invented. The surviving residue is then assembled into a coherent figure — typically an eschatological prophet — and fitting that reconstructed figure is itself used as a mark of authenticity for further material. What theory of evidence does this practice presuppose? In particular, does it presuppose that the tradition was inventive rather than conservative — that the church produced sayings freely, so that only what it had no motive or capacity to create can be Jesus' — and is that a substantive historical assumption presented as a neutral method? Is the combination of criteria even coherent, given that double dissimilarity credits an item only by cutting Jesus off from his context, while coherence credits an item by tying him to a portrait built out of whatever survived dissimilarity? Compare the practice with how historians treat comparable figures such as Socrates, whose words are accepted on multiple attestation and plausibility without any demand that they be dissimilar from Plato, the very source preserving them. Reconstruct the implicit epistemology, say where it is underdetermined — several different views of the tradition's reliability might license the same criteria — and tell me what would have to change if the gospels were treated with the ordinary canons applied to other ancient figures.
reasoning: |-
  Okay, let me try to unpack this user's query about Historical-Jesus scholarship. The user is asking about the criteria of authenticity used in this field and what theory of evidence they presuppose. They're questioning whether these criteria assume that the early Christian tradition was inventive rather than conservative. That's a really insightful point.

  The user also points out a potential tension between the criterion of dissimilarity and the criterion of coherence. On one hand, dissimilarity requires that authentic sayings must be different from both early Judaism and early Christian theology. On the other hand, coherence uses a reconstructed portrait of Jesus to authenticate other sayings. But that portrait is built from material that passed the dissimilarity test. That does seem circular. I need to think about how these criteria interact and whether they form a coherent method.

  Then there's the comparison to Socrates. Historians accept Socrates' words based on multiple attestation and plausibility without demanding dissimilarity from Plato, who's the main source. The user is highlighting a double standard here. Why are the gospels subjected to stricter criteria than other ancient figures? That's a crucial question.

  The user also wants to know the implicit epistemology behind these criteria. What underlying assumptions about historical reliability are at play? They mention that different views of the tradition's reliability might license the same criteria. For example, even if the tradition was mostly conservative, scholars might still use dissimilarity to identify the most reliable parts. But the criteria seem to work best under the assumption of an inventive tradition.

  I should also consider what changes if we apply ordinary historical canons to the gospels. Using multiple attestation and plausibility without dissimilarity would likely result in a different portrait of Jesus. The emphasis might shift from an eschatological prophet to a figure more embedded in Jewish context, with sayings that align with early Christian theology not automatically dismissed.

  The user's deeper concern seems to be about methodological bias. Are these criteria presented as neutral tools when they actually carry substantive assumptions? The field's focus on dissimilarity might stem from theological debates, like differentiating Jesus from Judaism or later Christian doctrine. Recognizing this bias is important for a more balanced approach.

  I need to structure the response to address each part: the theory of evidence, the inventive vs. conservative assumption, the coherence of the criteria, the comparison with Socrates, the implicit epistemology, and the changes under ordinary canons. Highlighting the circularity in the criteria and the double standard in historical treatment will be key. Also, emphasizing that the criteria aren't neutral but rely on specific assumptions about the tradition's reliability.
answer: |-
  The Historical-Jesus criteria of authenticity rest on a specific, contested, and often implicit **theory of evidence** centered on **reliability through adversity** and **source-critical filtering**, presupposing a largely **inventive and tendentious early Christian tradition**. Let's break this down:

  1.  **Core Epistemology: Reliability Through Motive-Based Filtering**
      *   **Assumption of Tendency:** The method fundamentally assumes the early Christian tradition was highly motivated to shape, invent, or adapt material about Jesus to serve its theological, polemical, and practical needs (e.g., defending against critics, settling internal disputes, attracting converts, explaining the delay of the Parousia).
      *   **Default Unreliability:** Consequently, material *aligned* with known early church interests or theology is viewed with *prima facie* suspicion. It is considered more likely to be a creation *of* the church *for* the church.
      *   **Authenticity via "Survival":** Authenticity is therefore established not by positive evidence of origin, but by demonstrating that a saying/deed *survived despite* being inconvenient, embarrassing, or irrelevant to (or even contradicting) the later church's agenda. It "could not have been invented" because it would have caused problems.
      *   **Evidence as "Residue":** The authentic Jesus is the material left over *after* filtering out everything the church had a motive or capacity to create. History is found in the "awkward" leftovers.

  2.  **The Inventive vs. Conservative Assumption:**
      *   **Yes, it presupposes an inventive tradition.** This is a **substantive historical assumption presented as a methodological necessity.** The criteria (especially Embarrassment, Dissimilarity to Christianity, and the "denial" criterion - "could the church have invented this?") only make sense *if* the default expectation is that the tradition freely generated material reflecting its later context and concerns.
      *   **It's not absolute, but dominant:** Proponents might argue they only assume *some* invention, and the criteria help identify it. However, the *weight* given to these criteria, especially Dissimilarity, and the systematic filtering *out* of church-aligned material, reveals a strong underlying assumption that invention was pervasive and controlling enough that alignment with the church is a strong indicator of *inauthenticity*.
      *   **Alternative View (Conservative Tradition):** If the tradition were primarily conservative (diligently preserving teachings even if awkward or evolving interpretations *around* them), then material aligning with the church *could* be authentic core material faithfully preserved and interpreted. The criteria would be far less useful, and potentially misleading, under this model. The method doesn't neutrally test this assumption; it *builds upon* the inventive model.

  3.  **Coherence of the Criteria:**
      *   **The Tension is Real:** The combination of **Double Dissimilarity** (authentic = unlike Judaism *and* unlike Christianity) and **Coherence** (authentic = fits the "residue" portrait) creates a **significant tension, even circularity**.
          *   **Dissimilarity** isolates Jesus from his Jewish context and his later followers, potentially creating a figure alien to both.
          *   **Coherence** then uses this potentially artificial, context-stripped "residue" figure as a template for accepting *further* material. Material that fits this constructed "Jesuitic core" (often heavily apocalyptic due to Dissimilarity filtering out easily Judaic or Christian elements) is accepted, *even if* it might have been acceptable in Judaism or useful to Christians. This risks amplifying the initial distortion.
      *   **Circular Reinforcement:** The portrait built from Dissimilarity-surviving material defines "authentic Jesus." Coherence then attracts more material *to* that portrait, which reinforces its shape. The criteria mutually reinforce a specific, potentially idiosyncratic, reconstruction. The "authentic Jesus" becomes self-referential.

  4.  **Comparison with Socrates (and Other Ancient Figures):**
      *   **Ordinary Historical Canons:** Historians of antiquity typically rely on:
          *   **Source Criticism:** Assessing the nature, date, biases, and independence of sources.
          *   **Multiple Attestation:** Material found in multiple independent sources is generally deemed more reliable.
          *   **Plausibility/Contextual Credibility:** Does the material make sense within the figure's known historical, cultural, and intellectual context? Is it plausible that the figure *could* have said/done this?
          *   **Motivation Analysis:** Does the source have a clear reason to invent *this specific* material? (This is more targeted than assuming *all* convenient material is invented).
      *   **Key Difference - Absence of Dissimilarity:** Historians don't demand Socrates be dissimilar to *Plato*, his primary source and interpreter. They:
          1.  Acknowledge Plato's biases and philosophical agenda.
          2.  Use Multiple Attestation where possible (e.g., Xenophon, Aristophanes providing different angles).
          3.  Assess **Plausibility within 5th Century BCE Athenian Philosophy:** Does the saying/deed attributed to Socrates fit what we know of his methods (elenchus), interests (ethics, definitions), and intellectual milieu? Does it ring true as something a figure like Socrates *might* have said, even if filtered through Plato?
          4.  Look for **Corroboration:** Does the material align with other evidence about Socrates or his context?
      *   **The Double Standard:** The Jesus tradition is subjected to a uniquely stringent "Dissimilarity" test not applied to Socrates, Alexander the Great, Caesar, or other ancient figures. The demand for dissimilarity *from the preserving community itself* (early Christianity) is extraordinary. This stems directly from the underlying assumption of a highly inventive tradition motivated by specific theological needs.

  5.  **Implicit Epistemology & Underdetermination:**
      *   **Implicit Epistemology:** Historical knowledge about Jesus is possible *only* by identifying material that escaped the tendentious editing and invention of the early church. Reliability is inversely proportional to perceived usefulness to the later community. Context (Jewish milieu) is secondary to the need to distinguish Jesus *from* that context and *from* his followers.
      *   **Underdetermination:** The *same criteria* could be used under different assumptions about the tradition:
          *   **Strong Invention Model (Dominant):** The criteria are vital tools to combat pervasive fabrication.
          *   **Weak Invention Model:** The criteria identify the *most securely authentic* core, but much church-aligned material might also be authentic.
          *   **Conservative Model with "Interpretive Layers":** The criteria might identify the earliest, most unvarnished layer, but later "interpretive" developments could still be rooted in authentic tradition. The criteria wouldn't necessarily *prove* invention of church-aligned material, just highlight the *most distinctive* elements.
      However, the *practice* and *weight* given to criteria like Dissimilarity strongly favor the Strong Invention Model interpretation.

  6.  **What Changes with Ordinary Historical Canons?**
      Applying standard historical methods to the Gospels would involve:
      *   **Drastically Reducing the Role of Double Dissimilarity:** It would become a minor, highly cautious tool, not a primary criterion. Material could be Jewish *and* authentic. Material could align with early Christian theology *and* be authentic (perhaps as the *origin* of that theology).
      *   **Elevating Plausibility/Contextual Credibility:** The primary question becomes: "Is this plausible within 1st Century Palestinian Judaism?" rather than "Is this dissimilar?". Jesus would be reconstructed as a recognizable Jewish figure of his time.
      *   **Reframing Embarrassment:** Embarrassing material would be strong evidence *if* it survived, but the *lack* of embarrassment wouldn't be evidence *against* authenticity. Many authentic sayings wouldn't be embarrassing.
      *   **Reevaluating Multiple Attestation:** It would remain important, but its value wouldn't be tied to the material *also* being dissimilar. Material attested in multiple sources would be considered reliable even if it aligned with Judaism or Christianity.
      *   **Reconstructing Development:** Instead of filtering out church material as "inauthentic," historians would focus on *how* the tradition developed from the authentic core. Authentic material could be the *basis* for later theological developments. The "residue" model would disappear.
      *   **A Different Portrait:** The resulting Jesus would likely be far more deeply embedded in Jewish apocalypticism, wisdom traditions, and renewal movements (like John the Baptist's). He would be less the isolated, unique figure constructed by Dissimilarity and more a prophetic teacher operating within recognizable Jewish paradigms, whose life and teachings *provoked* the movement that became Christianity. Sayings about the Kingdom, ethics, or Torah interpretation aligning with Jewish thought or early Christian practice would no longer be automatically suspect.

  **Conclusion:** The criteria of authenticity presuppose a theory of evidence centered on detecting reliability through adversity within an assumed inventive tradition. The assumption of an inventive early church is substantive and shapes the entire method. The combination of Dissimilarity and Coherence is inherently tense and risks circularity. The method applies a uniquely stringent standard compared to the treatment of other ancient figures, primarily due to theological debates about Jesus's uniqueness and the origins of Christianity. Applying ordinary historical canons would shift the focus to contextual plausibility, reduce reliance on dissimilarity, and likely produce a more historically integrated, Jewish Jesus.
