  Okay, the user is writing a long-form science piece on the indicative conditional, focusing on David Lewis's triviality results. They need a clear set of desiderata for evaluating theories of 'if', presented accessibly without technical jargon. 

  First, I need to identify the core tensions in conditional logic. The triviality results show that truth conditions plus the probability equation (P(if A,B) = P(B|A)) lead to absurdity. That's the central conflict. But the user also wants concrete cases: betting behaviour, inference patterns, embeddings, etc. 

  The challenge is making philosophical constraints vivid through examples. For instance: 
  - Betting: If I bet "if it rains, the match is cancelled", and it doesn't rain, we intuitively call off the bet. But truth-conditional views struggle with this. 
  - Strengthening: "If struck, it lights" is true, but "if struck while soaked, it lights" is false – so antecedent strengthening must fail. 
  - Kennedy contrast: Indicative "if Oswald didn't shoot, someone else did" vs. counterfactual "if Oswald hadn't shot..." show mood matters. 

  The user especially wants the conflict laid bare: which desiderata clash. The probability equation (D1) plus truth-conditions (D2) plus non-triviality (D3) is the fatal trio. Giving up truth-conditions (like Adams) loses negation embeddings; keeping them (like Stalnaker) forces probability compromises. 

  For the theories: 
  - Material conditional fails D4 (false antecedent makes conditional true – absurd for "if I jump, I'll fly"). 
  - Suppositional (no truth values) fails D8 (can't embed in negation). 
  - Stalnaker's possible worlds fails D1 (probabilities exceed conditional probabilities). 

  The sacrifice must be highlighted: keeping the probability equation means abandoning truth conditions, which hurts logical embedding. That's the cost. 

  British English touches: "maths" not "math", "prior" not "a priori", "called off" not "canceled". Keeping examples locally relevant (UK weather, football matches). 

  This structure gives the user both the philosophical framework and the human-facing examples their piece needs. The conflict section is where their readers will lean in – so it must resonate beyond academia.
answer: |-
  Here are twelve desiderata for an adequate theory of the indicative conditional, presented with motivating cases, negotiation status, and the core conflict exposed:

  **Desiderata for an Indicative Conditional Theory**

  1.  **Probability-Probability Link (PCP):** The probability one assigns to "If A, then B" *should equal* the corresponding conditional probability, P(B|A) = P(A and B)/P(A), provided P(A) > 0.
      *   **Motivation:** Consider betting on "If it rains tomorrow, the match will be cancelled." Intuitively, how much you'd pay for this bet should depend *only* on how likely the match is to be cancelled *given that it rains* – your confidence in B *assuming* A. Bookmakers and ordinary speakers price such bets this way.
      *   **Status:** **Non-negotiable core.** This is the central equation Lewis's results challenge.

  2.  **Truth-Conditionality:** "If A, then B" should express a proposition capable of being true or false.
      *   **Motivation:** We embed conditionals in truth-functional contexts: "It's *not true* that if I jump, I'll fly"; "Either if it rains we cancel, or we get soaked." We say things like "What she said about the match was true," referring to her conditional claim. This demands truth values.
      *   **Status:** **Highly Preferred/Non-negotiable for some.** Giving it up is a major cost (see conflict below).

  3.  **Non-Triviality:** The logic of conditionals shouldn't collapse into triviality (e.g., reducing to just the material conditional or forcing all probabilities to be 0 or 1).
      *   **Motivation:** We reason non-trivially with uncertain conditionals. If learning A *might* change our belief in B (P(B|A) ≠ P(B)), then "If A, B" shouldn't be logically equivalent to something that ignores this dependence (like the material conditional often does).
      *   **Status:** **Non-negotiable.** Lewis's results show failure here if 1 & 2 hold.

  4.  **Modus Ponens (MP):** From "If A, then B" and A, we must be able to conclude B.
      *   **Motivation:** The bedrock of conditional reasoning. If you accept "If the fuse is lit, the bomb explodes" and you see the fuse is lit, you *must* conclude the bomb will explode. Denying this renders conditionals practically useless.
      *   **Status:** **Non-negotiable.**

  5.  **Modus Tollens (MT):** From "If A, then B" and not-B, we must be able to conclude not-A.
      *   **Motivation:** If you accept "If the key is turned, the engine starts" and the engine doesn't start, you conclude the key wasn't turned. A fundamental diagnostic tool.
      *   **Status:** **Non-negotiable.**

  6.  **Failure of Antecedent Strengthening (SA):** "If A, then B" *does not entail* "If (A and C), then B".
      *   **Motivation:** "If you strike this match, it will light" is plausibly true (dry match, oxygen present). "If you strike this match *and it is soaking wet*, it will light" is plainly false. The stronger antecedent introduces a defeating condition.
      *   **Status:** **Non-negotiable.** Any theory validating SA yields absurd predictions.

  7.  **Indicative vs. Counterfactual Contrast (ICC):** Indicative and counterfactual conditionals with the same antecedent and consequent can differ in truth value.
      *   **Motivation (Kennedy):** Knowing Oswald shot Kennedy: Indicative - "If Oswald *didn't* shoot Kennedy, someone else *did*" (plausibly true, given the bullet). Counterfactual - "If Oswald *hadn't* shot Kennedy, someone else *would have*" (plausibly false; perhaps no conspiracy existed). The indicative considers what *is* true *given* the supposition (even if false), the counterfactual considers a *departure* from known facts.
      *   **Status:** **Non-negotiable.** A theory must explain this difference in mood.

  8.  **Embeddability (EMB):** Conditionals should embed coherently under operators like negation, disjunction, and probability operators ("It's likely that if A, then B").
      *   **Motivation:** We say: "It's *not* the case that if you apologize, she forgives you"; "Either if it rains we cancel, or if it snows we postpone"; "It's *probable* that if the economy dips, unemployment rises." A theory must tell us what these complex claims mean and how their truth/probability depends on the embedded conditional.
      *   **Status:** **Non-negotiable.** Crucial for compositional semantics.

  9.  **False Antecedent Bet Cancellation (FAC):** A bet on "If A, then B" is called off (neither wins nor loses) if A turns out false.
      *   **Motivation:** You bet £10 at 1:1 odds on "If Labour wins, the pound rises." Labour loses. Intuitively, the bet is void; your £10 is returned. The bookmaker doesn't keep it (as they would if the conditional were false), nor do you win (as you would if it were true). The antecedent's falsity renders the bet moot.
      *   **Status:** **Non-negotiable.** Deeply embedded in betting practice and intuition.

  10. **Iteration Handling (ITER):** The theory must handle iterated conditionals ("If A, then if B, then C") and clarify relations like Import-Export (IE: "If A, then (if B, then C)" equivalent to "If (A and B), then C"?).
      *   **Motivation:** "If the supply chain holds, then if demand surges, prices rise" vs. "If the supply chain holds *and* demand surges, prices rise." Are these equivalent? Sometimes yes (IE holds), but sometimes adding the first antecedent changes the relevance of the second ("If I win the lottery, then if I have children, they go to private school" vs. "If I win the lottery *and* I have children, they go to private school" – the second feels like a stronger commitment).
      *   **Status:** **Preference/Debated.** IE seems plausible often, but counterexamples exist. The theory must have a coherent account.

  11. **Impossible Antecedent Tolerance (IMP):** Conditionals with clearly impossible antecedents ("If 2+2=5, then...") can sometimes be meaningfully evaluated (often as vacuously true or absurd).
      *   **Motivation:** "If water weren't H₂O, it would still be wet" (counterfactual, maybe true). "If water isn't H₂O, it's still wet" (indicative? Feels defective or possibly false). "If Max is a married bachelor, he's unhappy" – intuitively true, but the antecedent is impossible. A theory shouldn't crash; it should explain the (often peculiar) intuitions or declare them defective.
      *   **Status:** **Preference.** Intuitions are messy, but a theory shouldn't break.

  12. **Conditional Excluded Middle (CEM):** For any A and B, is "Either (if A, then B) or (if A, then not-B)" always true?
      *   **Motivation:** "Either if you flip this fair coin, it lands heads, or if you flip it, it lands tails." Both conditionals feel uncertain (P=0.5 each), so their disjunction feels true. But consider "Either if I offer her the job, she accepts, or if I offer her the job, she refuses." This might feel presumptuous; perhaps a third option exists (she negotiates?).
      *   **Status:** **Strong Preference/Non-negotiable for some.** Denying it simplifies logic, but accepting it captures some intuitions. Stalnaker endorses it.

  **The Core Conflict & Triviality**

  Lewis's triviality results show that **no truth-conditional theory (D2) can simultaneously satisfy the Probability-Probability Link (D1) and Non-Triviality (D3)**. Here's why in plain terms:

  1.  **Assume D1 & D2:** "If A, B" has truth conditions (D2) and its probability *is* P(B|A) (D1).
  2.  **Conditional Probability is Fragile:** P(B|A) can change dramatically when you learn new information *consistent with A*, especially if that information affects the link between A and B. (E.g., Learning a match is wet drastically lowers P(Lights|Struck)).
  3.  **Probability of Truths Shouldn't Jump Like That:** If "If A, B" is a *single, fixed proposition* (with a fixed truth condition), then learning something *consistent with what you already knew* shouldn't make your belief in that *specific proposition* change wildly *unless* you learn something directly relevant to *its* truth or falsity. But you can learn things (like the match is wet) that don't directly bear on the truth condition of "If struck, it lights" (if defined independently) but drastically change P(Lights|Struck).
  4.  **The Squeeze:** Lewis proves mathematically that if D1 and D2 hold *in general*, the *only* way to avoid contradiction is if P(B|A) is *always* equal to P(B) – meaning A is irrelevant to B – or if probabilities can only be 0 or 1. This is **triviality (violating D3)**. The demand that the probability of the conditional *equals* the conditional probability forces the conditional's truth condition to be so sensitive to background knowledge that it can't be a stable proposition. You can't have a fixed proposition whose probability *always* perfectly tracks a quantity (P(B|A)) that itself shifts dramatically with new evidence consistent with prior knowledge.

  **The Sacrifice & Its Cost**

  A reasonable theory **must give up Desideratum 2: Truth-Conditionality**. Accepting that indicative conditionals lack truth values is the price of keeping the essential Probability-Probability Link (D1) and avoiding Triviality (D3).

  *   **Cost:** This sacrifice is major. It directly violates the motivation for D2 and causes significant problems with **Embeddability (D8)**. If "If A, B" isn't true or false, what does it mean to negate it ("It's not true that if A, B")? What is the truth value of a disjunction containing a conditional ("Either if A, B or if C, D")? What is the probability *of* "It's likely that if A, B"? Theories without truth values (Suppositional) struggle to give smooth, compositional accounts of these embeddings, often needing complex or non-standard rules. It also makes defining validity for arguments containing embedded conditionals more complex.

  **How Major Theories Fare Against Key Desiderata**

  1.  **Material Conditional (MC: "If A, B" = "Not-A or B"):**
      *   **Fails:** **D1 (PCP):** P(not-A or B) can be high (> P(B|A)) when P(not-A) is high, even if P(B|A) is low. (Bet on "If it rains, match cancelled" pays out if it doesn't rain!). **D6 (Failure of SA):** Validates strengthening. **D7 (ICC):** Cannot distinguish indicatives/counterfactuals. **D9 (FAC):** False antecedent makes MC *true*, so better loses bet. **D11 (IMP):** Vacuously true, often against intuition (e.g., "If 2+2=5, I'm the Pope"). **D12 (CEM):** Doesn't hold.
      *   **Meets:** D2, D3, D4 (MP), D5 (MT), D8 (Embeds easily), D10 (Handles iteration/IE).

  2.  **Suppositional Theory (Adams, no truth values):**
      *   **Fails:** **D2 (Truth Conditions):** Explicitly rejects them. **D8 (Embeddability):** Cannot coherently embed under truth-functional operators (negation, disjunction) or probability operators without significant complications or loss of meaning. **D5 (MT):** Inference is probabilistically unsafe (P(not-A) can be low even if P(If A, B) and P(not-B) are high). **D12 (CEM):** Rejects it as meaningless.
      *   **Meets:** **D1 (PCP):** Core tenet. **D3 (Non-Trivial):** Avoids Lewis's result. **D4 (MP):** Holds as a probabilistic constraint. **D6 (Failure of SA):** Naturally invalid. **D7 (ICC):** Explains difference via supposition type. **D9 (FAC):** Matches voiding. **D10 (ITER):** Validates IE. **D11 (IMP):** Can treat as defective (P(A)=0).

  3.  **Stalnaker's Possible Worlds (Truth-conditional, "closest A-world is B-world"):**
      *   **Fails:** **D1 (PCP):** Probability of the conditional generally *exceeds* P(B|A) (Lewis's result). **D6 (Failure of SA):** Validates SA *unless* context shifts (often seen as ad hoc). **D9 (FAC):** If A is false, conditional is true *only if* B is true in the closest A-world – better could still lose unfairly. **D10 (ITER):** Invalidates IE (closest A-world might not be closest (A&B)-world). **D11 (IMP):** Closest impossible world is undefined/arbitrary.
      *   **Meets:** D2, D3 (if context fixes selection), D4 (MP), D5 (MT), D7 (ICC - via ordering of worlds), D8 (Embeds), D12 (CEM - assumes it).

  This framework provides the specification needed to rigorously assess any theory of the indicative conditional, highlighting the fundamental tension exposed by Lewis and the consequential trade-offs involved.
