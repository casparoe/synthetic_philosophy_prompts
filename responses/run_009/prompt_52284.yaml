prompt: |-
  My closest friend and I spent most of a long walk this past weekend arguing about something neither of us could put a name to, and I want your help working out whether the thing we kept circling has an established concept attached to it — and if it does, what exactly that concept covers.

  The background: we both accept, roughly, the Schelling-style point that being credibly bound can itself be a source of bargaining power — the general who burns his bridges behind him, the union that puts its strike fund beyond recall before sitting down at the table. Neither of us doubts that. What we couldn't agree about is a second-order feature my friend kept waving away. When two parties each have the ability to bind themselves in ways the other can observe, and the binding is advantageous only if it takes effect *before* the other party binds themselves, there's pressure to commit early — early enough that you're committing under time pressure, with much less deliberation than you'd like, and often in ignorance of how the other side will respond. So individually rational agents end up with an incentive to lock in positions before they've thought them through, and once locked in, the positions can't be revised even when it becomes clear they were badly chosen. My friend says this is just ordinary credible commitment with a stopwatch attached, and that the stopwatch adds nothing of interest; I think the whole shape is different, because the race makes it rational to be less rational, so to speak — deliberation itself becomes the thing you're racing against. We tested this on examples: two firms deploying automated bargaining systems that must react to each other in milliseconds, where each firm chooses between letting its system gather information before committing to a stance or hard-coding the stance immediately, and whichever firm hard-codes first may set the terms of every later interaction; a negotiator who publicly and politically irreversibly pledges to her membership that she will never accept less than some figure, where the pledge is more powerful the earlier it is made, and the earliest moment is precisely the one at which she knows least about the other side's circumstances.

  What I want from you is this: does the configuration — a race in which the strategic value of self-binding comes from being bound *first*, so that parties are pushed toward irreversible commitments made under deliberately degraded information and shortened deliberation — have a name in game theory or in any neighboring literature? If there is an established term, I want to know what it precisely covers and how it differs from the nearest neighbors I already know the names of: Schelling's commitment tactic itself, brinkmanship (which seems to involve escalating mutual risk rather than self-binding), and strategic irrationality, the so-called madman theory, where one feigns or cultivates an incapacity to be reasonable. If there's no established term, please say so plainly rather than forcing one of those neighbors onto the pattern, and instead tell me what you would call it, define it, and mark its boundary cases — for instance, whether the phenomenon survives when the commitments are only partially irreversible, or when only one party can commit at all. And since I'll be taking this back to my friend: wherever people who actually study this genuinely disagree about whether the phenomenon is distinct from ordinary commitment under deadline, please flag that disagreement as contested rather than papering over it — I'd rather bring him the open question than win the argument by having picked a side for him.
reasoning: |-
  Okay, let me start by really understanding what the user is asking. They had an argument with their friend about a specific strategic situation where parties race to commit first, under time pressure and with less information. They want to know if this has a name in game theory or related fields.

  First, I recall the background they mentioned: both agree on Schelling's credible commitment concept, like burning bridges. But the disagreement is about the second-order effect when both parties can bind themselves and there's a rush to commit first. The examples given are automated bargaining systems and early pledges in negotiations. 

  The user's main request is to identify if this scenario has an established term. They also want a precise definition, differentiation from similar concepts like brinkmanship or madman theory, and any academic disagreements. Plus, they need to know how to handle cases like partial irreversibility or one-sided commitment.

  I should start by breaking down the key elements of their scenario: mutual ability to bind, observable commitments, advantage only if first, pressure to commit early, resulting in reduced deliberation and information. 

  Next, I need to check game theory literature. Preemption games come to mind, like in economics with technology adoption or market entry. The race to commit first fits there. But preemption usually involves actions rather than commitments. Then there's Stackelberg leadership, where one commits first to influence others. But in their case, both are racing, so it's symmetric.

  What about costly signaling? Signaling often involves early commitments to convey information, but here the focus is on the strategic advantage of being first, not just signaling. 

  The user mentioned Schelling, brinkmanship, and madman theory. Brinkmanship is about escalating risks, not binding commitments. Madman theory is feigning irrationality. So those are different. 

  I remember the term "Commitment Race" in some papers. It's not a super formal term, but it's used to describe exactly this: parties racing to bind themselves first. The key points are the incentive to reduce information and deliberation to win the race. 

  Also, the irreversible commitment aspect ties into sunk costs and irreversibility in decision theory. But the race component adds the preemptive element. 

  For boundary cases: if commitments are partially reversible, the pressure might lessen but still exist if being first matters. If only one party can commit, it becomes a Stackelberg game without the race. 

  Academic disagreements: some might see this as just Schelling plus time pressure, while others argue the mutual preemption creates a distinct dynamic. The user wants this flagged as contested. 

  I should clarify that while "preemption game" covers the structure, "commitment race" is more descriptive for their scenario. Defining it clearly with the elements they provided. Also, mentioning that in automation contexts, this is a real issue with algorithms making rapid commitments.
answer: |-
  Based on your description, the core phenomenon you're circling **does have recognized conceptual territory in game theory and related fields, but lacks a single, universally agreed-upon name.** The closest established concepts and the nature of the disagreement are outlined below.

  **The Core Concept & Its Name(s):**

  1.  **Preemption Game (in Commitment Strategies):** This is the most direct structural fit within standard game theory. Preemption games involve situations where players race to make an irreversible move *first* because the payoff for being the first mover is significantly higher than being the second, often resulting in suboptimal outcomes due to rushed decisions. Your scenario fits perfectly: the "move" is the irreversible self-binding commitment, and the payoff advantage comes from locking in a favorable position *before* the other party can bind themselves. The pressure to commit early, under degraded information and deliberation, is inherent to the preemption incentive.
  2.  **Commitment Race (or Race to Commit):** This is a less formal but highly descriptive term frequently used in literature discussing exactly the dynamics you describe (e.g., in automated systems bargaining, arms races, early negotiation posturing). It emphasizes the temporal competition aspect inherent in mutual commitment opportunities with first-mover advantages. Scholars like Avinash Dixit, Barry Nalebuff, and Thomas Schelling himself (in later work) discuss scenarios fitting this label.
  3.  **Costly Signaling under Preemptive Timing:** This combines elements of signaling theory (where an irreversible commitment acts as a costly signal of resolve or type) with the preemption element. The "cost" isn't just the commitment itself, but the *prematureness* of it – committing with less information than one would ideally want. The signal's power derives partly from being *first*.

  **How it Differs from Neighbors:**

  *   **Schelling Commitment:** The core idea is foundational. The key difference is **mutuality and timing pressure.** Schelling focuses on *how* one party gains power by removing its own options. Your scenario adds: (1) *Both* parties can do this, (2) The *order* of commitment matters critically (first-mover advantage), and (3) This mutual possibility creates an *incentive to rush* the commitment process, sacrificing deliberation and information gathering. Schelling commitment is the tool; the preemption race is the dangerous game played with that tool when both sides have it.
  *   **Brinkmanship:** Brinkmanship involves *deliberately creating and controlling shared risk* (e.g., nuclear escalation) to force concessions. It's about mutual vulnerability and the *threat* of mutual disaster spiraling out of control. Your scenario is about *unilateral, observable self-binding* (removing one's *own* options/flexibility) for a positional advantage, where the risk is more about being locked into a bad position oneself due to haste, not necessarily mutual annihilation. The mechanisms (risk vs. binding) and primary risks (miscalculated escalation vs. premature lock-in) differ.
  *   **Strategic Irrationality (Madman Theory):** This involves feigning or cultivating an *inability* to respond rationally to incentives or threats. Your scenario is about *fully rational* actors making a calculated, strategically sound (given the preemption incentive) decision *to shorten their own rational deliberation process*. They are rationally choosing to make a decision with less-than-ideal information *because* winning the commitment race is valuable. It's rational under-optimization, not irrationality or feigned irrationality.
  *   **Ordinary Commitment Under Deadline:** A deadline imposed *externally* creates time pressure. In your scenario, the time pressure is *endogenous* – it arises directly from the strategic interaction itself (the fear of the other party committing first). The "stopwatch" isn't external; it's a weapon wielded by the opponent. The pressure isn't just "do it before time X"; it's "do it *before they do it*".

  **Boundary Cases & Nuances:**

  1.  **Partially Irreversible Commitments:** The phenomenon *survives but weakens*. If commitments can be reversed, even at a cost, the "race" pressure diminishes. The incentive to be first remains if there's still a significant advantage, but the cost of rushing is lower since mistakes can be corrected (albeit expensively). The core dynamic persists but becomes less stark and potentially less damaging.
  2.  **Only One Party Can Commit:** This collapses back into a classic **Stackelberg leadership model** or a standard Schelling commitment scenario. The unique preemption race dynamic *vanishes* because there is no competitor to race against. The single committer can ideally choose the optimal timing for their commitment without fear of being preempted. The incentive to deliberately degrade one's own information disappears; the sole committer would prefer perfect information and ample time.

  **The Contested Point (As Requested):**

  *   **Is it distinct from "Ordinary Commitment + Deadline"?** **Yes, this is genuinely contested.** Here's the split:
      *   **Your Friend's View (Ordinary + Stopwatch):** Argues that the core mechanism is still Schelling commitment. The time pressure, whether external or arising from mutual strategic interaction, is just an added constraint. The *fundamental source of power* remains the credible removal of options. The preemption is a consequence of the deadline pressure combined with mutual capability, not a fundamentally new strategic logic.
      *   **Your View / Preemption Game View:** Argues that the *mutual possibility combined with the strict first-mover advantage* creates a **qualitatively different strategic environment.** The incentive structure specifically rewards *rushing the commitment process itself*, making deliberation a liability in the race. This leads to a distinct pathology: rational actors systematically making decisions they know are based on insufficient information *because* winning the positional race is paramount. The "race" generates a unique inefficiency centered on the suppression of optimal individual decision-making within the strategic interaction.
      *   **Where the Literature Leans:** Game theorists generally recognize preemption games as a distinct *class* of games due to their specific equilibrium properties (often involving mixed strategies or "winner-takes-all" outcomes with inefficient timing). Your scenario fits squarely within this class when the "action" is a commitment move. Therefore, while built *using* Schelling's commitment concept, the overall strategic situation (mutual commitment capability + first-mover advantage) dictates a different set of incentives and potential outcomes, justifying its distinction as a "preemption game in commitments" or a "commitment race." The pathology of rationally suppressed deliberation *is* a hallmark of this specific configuration.

  **Conclusion & Recommendation:**

  1.  **Established Concepts:** The phenomenon is best described as a **Preemption Game** where the strategic actions are **Credible Commitments**, or more colloquially, a **Commitment Race**.
  2.  **Distinctness:** It is distinct from Schelling commitment (adds mutuality & first-mover race), brinkmanship (different mechanism/risk), and madman theory (rational under-deliberation vs. feigned irrationality). The contested point with your friend is acknowledged: whether the mutual race aspect creates a *fundamentally* new strategic logic or is just commitment under a specific (endogenous) time pressure. Game theory formalism supports the distinctness through the preemption game structure.
  3.  **Definition:** A **Commitment Race** occurs when two or more rational agents, each possessing the ability to make observable and (at least partially) irreversible commitments that confer a significant strategic advantage primarily to the *first* mover, face incentives to commit prematurely. This results in deliberate reductions in information gathering and deliberation to secure the first-mover position, often leading to suboptimal outcomes due to the locked-in commitments being made under conditions of undue haste and ignorance.
  4.  **Take it to your friend:** "The game theory literature frames this as a **Preemption Game involving Credible Commitments**, often called a **Commitment Race**. While built on Schelling's core insight, the mutual ability to commit combined with the strict first-mover advantage creates a distinct strategic situation characterized by an incentive to rush the commitment process itself, rationally sacrificing deliberation. Scholars recognize this can lead to specific inefficiencies. However, it's genuinely contested whether this represents a fundamentally *new* strategic logic beyond commitment under intense (endogenous) time pressure, or if it's primarily an application of the core commitment idea within a specific (preemption) game structure."

  This provides the conceptual grounding, the terminology, the distinctions, and importantly, flags the core point of contention honestly for your continued discussion.
