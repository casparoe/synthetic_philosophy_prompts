answer: |-
  Here are detailed comments addressing each of your requests, quoting/paraphrasing your draft and offering specific suggestions for revision:

  ---

  ### **1. Accuracy**  
  **Your statement:**  
  > *"The familiar objection... treats persons as if they were so many containers of utility."*  
  > *"Taurek-style lotteries: killing one of five via a fair lottery... gives each person a one-fifth chance of death offset by a four-fifths chance of rescue."*  

  **Assessment:**  
  - **Utility "containers"**: This is a standard gloss (Nozick’s *Anarchy, State, and Utopia* uses "utility receptacle" imagery). Rawls (*Theory of Justice*) emphasizes utilitarianism’s failure to respect the "distinction between persons" when aggregating welfare. **Accurate.**  
  - **Taurek**: Your summary is correct. Taurek ("Should the Numbers Count?") argues saving one group over another via lottery is impermissible even to save more lives, rejecting interpersonal aggregation. **Accurate.**  
  - **Ex ante/ex post**: This framing is common in risk ethics (e.g., Broome, Adler). No mischaracterization.  

  **Minor refinement**: Specify that Taurek opposes *any* aggregation (not just lotteries), but your focus on lotteries as a test case is valid.  

  ---

  ### **2. The Bearer Condition**  
  **Your reformulation:**  
  > *"The separateness of persons objection... is not an objection to offsetting as such, but to offsetting without a bearer."*  

  **Potential distortion**:  
  - **Original objection**: Rawls/Nozick focus on *fairness* and *rights against sacrifice*. Nozick objects that utilitarianism violates "side constraints" protecting individuals. Your "bearer" framing risks reducing the objection to a *metaphysical* claim (single subject of experience) rather than a *moral* one (unfairness of non-consensual sacrifice).  
  - **Fairness concern**: Suppose A loses $100 so B gains $200. Even if B later "compensates" A $150 (making A net +$50), the *initial taking* may still be unfair without consent. Your bearer condition might approve this, but the core objection often targets forced transfers *as such*.  

  **Suggested response**:  
  - Acknowledge that fairness/comparative claims are central, but argue the bearer condition captures a *necessary feature* of permissible trade-offs: "Compensation requires a recipient, but *moral legitimacy* also requires consent, fairness, or agent-relative constraints. The bearer condition is necessary but not sufficient; its violation explains why interpersonal offsets *feel* distinct from intrapersonal ones."  
  - **Revision tip**: Contrast cases:  
    - *Unproblematic*: You borrow $100 from yourself (future self "bears" loss).  
    - *Problematic*: I take $100 from you for my benefit, even if I repay $150 later.  
    Highlight that the latter lacks a bearer *during the loss* and violates autonomy.  

  ---

  ### **3. The Dilemma (Ex Ante vs. Ex Post)**  
  **Your claim**:  
  > *"The separateness objection... must choose between the ex ante and ex post perspectives, and each choice carries a cost."*  

  **Escape routes?**  
  - **Levels of deliberation**: Yes! Distinguish:  
    - *Ex ante* for **policy justification** (e.g., "Is this risk-imposing institution permissible?")  
    - *Ex post* for **individual redress** (e.g., "Does the victim deserve compensation?")  
    **Example**: Vaccines are justified ex ante (net benefit per person), but ex post, those harmed deserve compensation. This avoids the reductio (all risk is wrong) *and* rejects Taurek (lotteries are ex ante fair but ex post require accountability).  
  - **Distinguish permissibility/compensation**: As you note, one might hold that risks are permissible if *fairly distributed* ex ante, but losers must be compensated ex post. This synthesizes perspectives.  

  **Recommendation**: Address this in your revision. The dilemma is forced only if we assume a monolithic "moral perspective." Introducing a two-tier structure strengthens your argument.  

  ---

  ### **4. Closing Suggestion (Symmetric vs. Predictable Risks)**  
  **Your proposal**:  
  > *"Risks that are strictly symmetric across persons... versus risks structured so that eventual losers come from a predictable subset."*  

  **Assessment**:  
  - **Not ad hoc, but needs grounding**: The distinction appears in discrimination ethics (e.g., "statistical discrimination") and risk justice (Shrader-Frechette). Symmetric risks respect equality; predictable subsets may exploit the vulnerable (e.g., building polluting factories in poor neighborhoods).  
  - **Weakness**: It doesn’t fully resolve the bearer problem. In symmetric risks (e.g., a vaccine with 1/10,000 severe side effects), ex post losers *still* lack compensation. Why is this less problematic?  

  **Strengthen the suggestion**:  
  - Argue symmetric risks satisfy the bearer condition **ex ante** (each person is identically situated and consents to the same gamble), while asymmetric risks create "passive losers" from a group that never agreed to bear disproportionate burdens.  
  - **Concession**: This doesn’t salvage a "single perspective" but offers a *criterion* for when ex ante offsets are sufficient. Pair it with the two-tier approach (§3).  

  ---

  ### **5. Utilitarian Objections (Reader’s Report)**  
  **Objection 1: The bearer condition begs the question**.  
  > *"A utilitarian would reject the premise that compensation requires a 'single bearer.' If net social welfare increases, the 'bearer' is the collective. Your reformulation assumes individualism, which utilitarians deny."*  
  > **Response needed**: Defend why individualism is prior (e.g., via experience-boundedness of welfare).  

  **Objection 2: Ex post losses are irrelevant to permissibility**.  
  > *"Utilitarians evaluate acts by expected utility. Ex post bad luck doesn’t retroactively invalidate a rational gamble (e.g., vaccines remain right even if someone dies). Your focus on ex post ‘uncompensated loss’ conflates permissibility with misfortune."*  
  > **Response needed**: Argue that moral responsibility requires tracking actual outcomes (e.g., Williams' moral luck).  

  **Objection 3: The dilemma proves too much**.  
  > *"If all risk-imposition requires ex post compensation, we must compensate anyone harmed by *any* social policy (e.g., a pedestrian hit by a state-funded bus). This is either paralyzing or reduces to a utilitarian cost-benefit analysis of insurance schemes."*  
  > **Response needed**: Distinguish compensable harms from acceptable background risks (e.g., via thresholds of non-negligence).  

  ---

  ### **Overall Strengths**  
  - The "bearer" reframing is original and fruitful.  
  - The ex ante/ex post dilemma is well-constructed and highlights real tensions.  
  - Taurek’s lottery is an effective test case.  

  ### **Key Revisions Recommended**  
  1. **Clarify the bearer condition’s scope**: Emphasize it’s necessary but not sufficient; tie it to autonomy.  
  2. **Address the two-tier escape route**: This avoids the reductio and strengthens the closing suggestion.  
  3. **Ground the symmetric/predictable distinction**: Cite real-world cases (e.g., environmental racism) to show its moral relevance.  
  4. **Preempt utilitarian replies**: Especially the "collective bearer" and "expected utility" objections.  

  This draft is philosophically rigorous and ready for polishing. With minor adjustments, it will be a compelling contribution.
