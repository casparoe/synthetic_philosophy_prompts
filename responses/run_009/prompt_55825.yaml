prompt: |-
  Ok so last night my friend and I got into this huge argument after watching a documentary about dueling, and he's now converted me to being confused rather than anything else. He read Appiah's book on moral revolutions a while back (the one about honor codes, covering dueling and footbinding and the abolition of slavery) and he gave me what he swears is the book's core argument. His summary, roughly verbatim: "Appiah proved that moral arguments never actually change anything. Dueling didn't end because anyone was argued out of it, it ended because the industrial economy made gentlemanly honor useless -- once careers ran on money and merit instead of aristocratic standing, there was nothing left to defend with a duel. And slavery is the same story: the British only abolished the slave trade once it had stopped being profitable, so they could afford to have a conscience about it. His general law is that first a practice stops paying, then people start feeling shame about it, and then the law catches up and bans it. So every moral revolution is really just an economic revolution wearing a moral costume." He also kept saying this is basically the Williams thesis anyway, and that if I doubt it I should "look up what actually happened to the West Indies sugar economy."

  I want to trust him but something felt off. For one thing I vaguely remember Appiah's whole thing being about *honor* specifically, like the mechanism is something about honor codes changing and who gets counted as honorable, and my friend said almost nothing about honor except as a thing that became economically useless. Also he presented the slavery bit as if it's uncontroversial that abolition came after the profits dried up, which he might be right about but it sounded suspiciously convenient for his larger "arguments never matter" point. And the sequence "shame first, then the law bans it" -- I honestly don't know enough about the history to say whether that's the order things actually happened in for dueling or footbinding or abolition.

  So: can you go through his summary claim by claim and tell me which parts an Appiah defender would sign off on, which parts are overstatements or things Appiah actually argues against, and whether any of it is really someone else's thesis being smuggled in under Appiah's name? And then does his big conclusion -- moral revolutions are just economic revolutions in a moral costume -- follow from the parts of the summary that survive correction? For what it's worth I *want* to believe moral argument mattered in abolition (the Quakers campaigning for decades, all that), but tell me straight if that's just what I'd like to be true rather than a reason to doubt him. And if there's a real tension between Appiah's story and the economic-interest story my friend likes, say what each side would say the other one can't explain. Sorry for the wall of text, the arguement went till 2am and I want to be better armed next time.
reasoning: |-
  Okay, let me start by unpacking the user's query. They had a heated debate with their friend about Appiah's book on moral revolutions, specifically regarding dueling and slavery. The friend claims that Appiah argues moral arguments don't change anything; instead, economic shifts lead to changes in practices, and moral justifications follow. The user is confused and suspects their friend might be oversimplifying or misrepresenting Appiah's arguments.

  First, I need to recall Appiah's main points from "The Honor Code." His focus is on honor, not economics. He discusses how social recognition and shame drive moral revolutions. For dueling, it wasn't just economic changes but shifts in what society deemed honorable. Industrialization might have played a role, but Appiah emphasizes the changing honor codes among the elite.

  Next, the friend's summary about slavery abolition. They argue the British only acted when the slave trade became unprofitable. But Appiah points to the role of honor here too—abolitionists shamed the British by exposing the brutality, making slavery dishonorable. The timing with economic factors is debated among historians, but Appiah doesn't dismiss moral arguments.

  The user mentioned the Williams thesis (Eric Williams' "Capitalism and Slavery"), which ties abolition to economic decline. Appiah actually challenges this, arguing that moral campaigns shifted public perception first. The user’s friend conflates Williams' view with Appiah's, which is a key misstep.

  I should clarify the sequence: shame before legal change. Appiah says changing honor codes (shame) precedes legal bans. Economics might create conditions, but the catalyst is social recognition. For example, in footbinding, missionaries and Chinese reformers made the practice shameful, leading to its end.

  The user wants to believe moral arguments matter, like the Quakers' efforts. Appiah supports this, showing how persistent activism reshapes honor. The user’s skepticism is valid; their friend oversimplifies by reducing everything to economics.

  Underlying needs: The user seeks a balanced view to counter their friend's economic determinism. They want validation that moral efforts aren't futile and historical change involves multiple factors. They also need a clear distinction between Appiah and Williams to prepare for future debates.

  In conclusion, the friend’s summary misrepresents Appiah by overemphasizing economics and downplaying honor and moral persuasion. Correcting this involves highlighting Appiah's focus on social recognition, the role of activism in changing perceptions, and the interplay between material conditions and moral agency.
answer: |-
  Your friend's summary captures *part* of Appiah's argument but significantly misrepresents, oversimplifies, and smuggles in a much more economically deterministic view (specifically Eric Williams' thesis) that Appiah explicitly argues *against*. Let's break it down claim by claim:

  1.  **"Appiah proved that moral arguments never actually change anything."**
      *   **Appiah Defender's Response:** **False. Appiah argues the *opposite*.** His core thesis in "The Honor Code" is that moral arguments *alone* are often insufficient *until* they connect with a society's sense of **honor and shame**. He argues that moral revolutions happen when a practice becomes *socially dishonorable*, not just morally wrong. Moral arguments are crucial *for creating that sense of dishonor*. Abolitionist arguments didn't just preach abstract morality; they successfully framed slavery as deeply *shameful* and *unworthy* of a nation like Britain. Appiah's point is that abstract moral reasoning needs this social/emotional lever (honor/shame) to be effective at scale, not that it's irrelevant.

  2.  **"Dueling didn't end because anyone was argued out of it, it ended because the industrial economy made gentlemanly honor useless..."**
      *   **Appiah Defender's Response:** **Partial truth, but misleading emphasis.** Appiah *does* discuss changing social and economic structures (like the rise of the bourgeoisie, professionalization, changing notions of masculinity) as creating conditions where the *specific honor code* underpinning dueling became less relevant. However, he **emphasizes the shift in honor itself**. Dueling died because the *meaning* of being an honorable man changed. It became less about violently defending personal slights with pistols and more about bourgeois virtues like self-control, professionalism, and financial responsibility. Public opinion turned against it; it became seen as *dishonorable* – barbaric, absurd, ungentlemanly – long before it was universally illegal. Moral/ethical arguments against its violence and irrationality *contributed* to this shift in what constituted honor. The economic shift provided a context, but the change was in the *social meaning of honor*.

  3.  **"Slavery is the same story: the British only abolished the slave trade once it had stopped being profitable..."**
      *   **Appiah Defender's Response:** **This is directly counter to Appiah and largely invokes Eric Williams.** Appiah dedicates significant space to **refuting** Eric Williams' influential thesis (from "Capitalism and Slavery") that abolition followed economic decline in the British West Indies sugar economy. Appiah argues:
          *   The peak of abolitionist campaigning and the legal abolition of the *slave trade* (1807) happened *during* a period of West Indian prosperity, not decline. Slavery itself wasn't abolished (1833) until later.
          *   The economic *decline* of the sugar islands came *after* abolition, partly *because* of it and other factors like competition from beet sugar and more efficient Cuban/Brazilian slavery.
          *   **Appiah's Argument:** The crucial factor was the **success of abolitionists in making slaveholding and the slave trade deeply dishonorable.** They exposed the brutality through pamphlets, petitions, and the famous diagram of the slave ship Brookes. They framed participation in slavery as incompatible with British values of liberty, Christianity, and national honor. Parliamentarians worried about Britain's reputation and their own moral standing. The *shame* became potent. Economic arguments were used *by both sides*, but Appiah contends the *honor/shame* dynamic was decisive. He explicitly says Williams' economic explanation doesn't fit the timing.

  4.  **"First a practice stops paying, then people start feeling shame about it, and then the law catches up and bans it."**
      *   **Appiah Defender's Response:** **Reverses Appiah's sequence.** Appiah's core sequence is:
          1.  **Moral Criticism Emerges:** Arguments are made against the practice (often for a long time).
          2.  **Shift in Honor/Shame:** Through persistent activism, cultural shifts, and often *linking the practice to new notions of honor/national identity*, the practice becomes **socially dishonorable.** People engaging in it start to feel *shame* or fear social exclusion. *This is the crucial turning point.*
          3.  **Legal Change Follows:** Once the practice is widely seen as shameful, legal prohibition becomes feasible and often follows as a ratification of the new social norm.
      *   Economics *can* create conditions that make a practice vulnerable (e.g., dueling's aristocratic basis weakening) or provide arguments for critics (e.g., inefficiency of slavery), but the *shame* is not an automatic consequence of unprofitability. It requires active moral/social/political work.

  5.  **"So every moral revolution is really just an economic revolution wearing a moral costume."**
      *   **Appiah Defender's Response:** **Emphatically No.** This is your friend's extrapolation and fundamentally misrepresents Appiah. Appiah's thesis is that **honor/shame are distinct and powerful social forces**, interacting with but not reducible to economics. He argues:
          *   Moral arguments *matter* but need the engine of honor/shame to drive large-scale change.
          *   Economics provides context and constraints, but the *meaning* of honor and the *target* of shame are shaped by culture, persuasion, and activism.
          *   The "moral costume" *is* the substance – the change in what society finds honorable and shameful *is* the moral revolution. It's not merely dressing up economic necessity.

  **Where Your Friend Smuggled in Williams:**

  Your friend is absolutely correct that "this is basically the Williams thesis anyway" regarding slavery. That's the problem! He attributed Williams' core economic determinist argument *to Appiah*, while Appiah explicitly argues *against* Williams. Your friend presented Williams' thesis *as if it were Appiah's summary*. That's the major conflation.

  **Tension Between Appiah and Williams/Economic-Interest Story:**

  *   **What Appiah Says Williams Can't Explain:** The **timing** of abolition (peak campaigning and trade abolition during prosperity) and the **motivation** of the abolitionists and Parliamentarians (genuine moral outrage, concern for national honor/reputation, religious conviction). Appiah argues the evidence doesn't support profits collapsing *before* the moral/political push.
  *   **What Williams/Economic-Interest Might Say Appiah Can't Explain:** The *persistence* of slavery elsewhere despite moral arguments, or the specific *timing* of abolition coinciding with broader shifts in the British economy (even if West Indian sugar was still profitable, the *rising* industrial classes had different economic interests and less stake in slavery). They might argue honor/shame shifts are epiphenomenal or secondary to underlying material interests.

  **Your Instincts Were Correct:**

  *   You were right to focus on **honor** as Appiah's central mechanism. Your friend barely mentioned it except as a passive consequence of economics.
  *   You were right to be suspicious about the slavery claim being presented as uncontroversial. The Williams thesis is hugely influential but also heavily debated and, as Appiah shows, has significant historical problems regarding timing.
  *   You were right to question the sequence. Appiah puts shame *before* legal change, but triggered by moral/social activism changing honor codes, *not* by economics alone.
  *   **Wanting to believe moral argument mattered in abolition is NOT just wishful thinking.** Appiah provides strong arguments for why it *was* crucial, *especially* in how activists weaponized moral arguments to create *shame* and attack the *honor* of slaveholders and the nation. The decades of Quaker and abolitionist campaigning were essential to building that sense of moral outrage and national dishonor.

  **How to Be Armed Next Time:**

  1.  **Focus on Honor:** Hammer home that Appiah's core concept is the **transformation of honor codes and the power of social shame**, triggered by moral activism, as the engine of change. Economics is context, not cause.
  2.  **Challenge the Slavery Timing:** Point out that Appiah explicitly refutes Williams. The slave *trade* was abolished in 1807 *during* West Indian prosperity. Economic decline came *later*. The moral/honor-based campaign was the driving force.
  3.  **Sequence Matters:** Emphasize Appiah's sequence: Moral Criticism -> Shift in Honor/Shame (driven by activism) -> Legal Change. Economic shifts might facilitate step 2 but don't cause it automatically.
  4.  **Distinguish Williams:** Call out that the "economic revolution in a moral costume" line is pure Eric Williams, and Appiah wrote his book partly to argue *against* that view.

  Appiah offers a more complex, culturally nuanced, and agency-filled account than your friend's economically deterministic summary. Moral arguments mattered profoundly in abolition and dueling's end, but their power flowed through the specific mechanism of transforming social honor and shame. Your skepticism was well-placed!
