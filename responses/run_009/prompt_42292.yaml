  Okay, the user is a professor teaching a seminar on corruption and the state. They have this ritual where they test colleagues with vignettes to see where they draw the line on what's corrupt. This year, they're focusing on a colleague who studies clientelism in Brazil. The professor has six vignettes with her judgments and now has a seventh one involving a municipal contract bid where gifts are given to the evaluation committee. The key is to figure out the underlying rule she uses, predict her judgment on the new case, and design another vignette to test between competing rules.

  First, I need to analyze the existing judgments to identify candidate rules. The professor mentioned two possible rules: impartiality norms and formal legality. Let me list the vignettes and her responses again:

  1. Trading food/gas for votes: Corruption
  2. Mayor steering services to supportive precincts: Corruption
  3. Tokyo official accepting customary gifts within limits: Not corruption
  4. MP funneling money to home district: Not corruption (bad governance)
  5. Dutch council member rezoning donor's land without disclosure: Corruption
  6. US senator inserting tax provision for donor: Not corruption ("just politics")

  Looking at these, the formal legality rule (where corruption is rule-breaking) seems inconsistent because in vignette 4, the MP's action is normalized but might not be illegal? The professor thinks legality feels wrong, and I agree. The impartiality norms rule makes more sense: if the behavior violates the society's enforced norms, it's corrupt. In vignettes 1, 2, and 5, there's a breach of impartiality that's not normalized, whereas in 3, 4, and 6, the actions are accepted within their contexts.

  But are there other rules? Maybe something about reciprocity or expectation of quid pro quo? In vignettes 1 and 2, there's an explicit exchange (votes for goods/services), and in 5, the rezoning benefits the donor directly. In contrast, vignette 3 has no expectation of return, and vignette 6 is seen as politics as usual. However, vignette 4 involves funneling money without direct exchange, just meeting voter expectations, so no quid pro quo. That might fit.

  Another angle could be whether the action undermines public trust or the official's duty. But that's vague. Or perhaps the distinction between individual gain versus collective benefit? In vignette 4, the MP is serving constituents, not personal gain, whereas in 1 and 2, it's about securing votes. But in 5 and 6, personal gain isn't direct either. The Dutch council member might benefit indirectly through campaign support, and the senator helps a donor, which could be seen as personal gain in terms of political support.

  The professor's colleague also mentioned "Weberian fantasy," implying that corruption might be culturally relative. So her rule might be based on local norms rather than universal standards. That ties into the impartiality norms being context-specific.

  For the new vignette: gifts to committee members are customary, universally given, modest, formally illegal but never enforced. The committee member awards to the lowest bidder and keeps gifts. Key points: universal practice, not enforced, no one sees it as wrong, outcome is impartial (lowest bidder wins). 

  Using the impartiality norms rule: since the practice is normalized and not seen as wrong locally, it wouldn't be corruption. Using formal legality: it's illegal but unenforced, so maybe not corruption? But the professor thinks legality feels wrong. The quid pro quo angle: no expectation of return, gifts are ritualized, so no corruption.

  Her judgment on similar cases: vignette 3 (Tokyo gifts) was not corruption because customary, no expectation. Vignette 4 (MP funneling money) not corruption because normalized. So this new case seems analogous. Thus, she'd likely say not corruption.

  But to distinguish between rules, another vignette could test when a normalized practice involves a direct exchange. For example, in a context where bribes are customary but influence outcomes. If she calls that corruption, then her rule is about reciprocity, not just normalization. If not, then normalization alone dictates.

  Also, considering the Weberian point, if she calls the new case not corrupt, it supports the idea that corruption is parochial, defined by local norms. If she calls it corrupt despite normalization, it leans universal. But her past judgments suggest she leans contextual.
answer: |-
  Based on your colleague's pattern of judgments and her Weberian mutterings, I propose three candidate rules that fit her six verdicts, predictions for the gift-committee vignette, and a diagnostic new vignette to tease them apart. Her underlying logic appears deeply contextual and institutionalist.

  ---

  ### **Candidate Rules Fitting Her Verdicts**
  1. **Rule: "Violation of Locally Enforced Impartiality Norms"**  
     Corruption occurs when an act breaches impartiality expectations *actually enforced* by a society’s institutions (formal or informal), regardless of formal legality. Focuses on *institutional hypocrisy*: if the system tolerates/practices it, it’s not corruption—just "how things work."  
     - *Fits all six*:  
       - (1)/(2)/(5): Breach enforced norms (vote-buying/biased services/undisclosed conflict = punishable).  
       - (3)/(4)/(6): Normalized in context (gift culture/patronage duty/donor access = unpunished).  

  2. **Rule: "Quid Pro Quo + Non-Normalization"**  
     Corruption requires a *direct exchange of goods/favors for specific actions* **and** the practice being socially/legally contested (not fully institutionalized). Excludes systemic patronage or ritual gifts.  
     - *Fits all six*:  
       - (1)/(2)/(5): Explicit exchange (votes/services/rezone for benefits) + socially condemned.  
       - (3)/(4)/(6): No *direct* exchange (gifts ritualized, patronage diffuse, tax provision indirect) or normalized.  

  3. **Rule: "Personal Gain vs. Institutional Duty"**  
     Corruption hinges on whether the actor *prioritizes private/partisan gain over formal institutional duty*. Ignores legality if the duty itself is systemically corrupted.  
     - *Fits all six*:  
       - (1)/(2)/(5): Personal/partisan gain (votes, electoral advantage) trumps duty (impartial service).  
       - (3)/(4)/(6): Gain incidental (gifts) or aligned with institutional duty (patronage/tax provision as "expected role").  

  ---

  ### **Prediction for the Gift-Committee Vignette**
  - **Her Likely Verdict**: **Not corruption**.  
  - **Reasoning**:  
    This vignette mirrors Tokyo’s gift culture (case 3): modest, universal, no expectation of reciprocity, outcome impartial. The unenforced illegality is irrelevant per her past logic (see case 4’s "everyone understands it" defense). Key to her judgment is that **no one treats it as wrong**—making it a *normalized institutional practice*, not a breach of enforced impartiality. The ritualized, non-discretionary nature aligns with her acceptance of "manners" (case 3) and systemic patronage (case 4).  

  - *Why not other rules?*  
    - **Quid Pro Quo Rule**: Predicts "not corruption" (no direct exchange), but her logic here is weaker—case 5 (undisclosed rezone) was deemed corrupt despite unclear *explicit* exchange.  
    - **Personal Gain Rule**: Predicts "not corruption" (gifts incidental, duty fulfilled), but case 6 (tax provision) involved donor gain yet was excused.  

  ---

  ### **Diagnostic Vignette to Discriminate Between Rules**  
  **Vignette X**: *In a country where judicial appointments are formally merit-based but traditionally require "donations" to the ruling party (universal, unenforced, expected as "supporting national development"), a judge rules impartially on a case involving the party.*  

  - **Why this works**:  
    - Normalized bribery ("everyone does it"), but with *direct exchange* (donation for appointment) and *private gain* (appointment secured).  
    - Tests whether **normalization trumps quid pro quo** (Rule 1 vs. Rule 2) and whether **institutional duty** (meritocracy) matters if systemically corrupted (Rule 3).  

  - **Predicted Splits**:  
    - **Rule 1 (Impartiality Norms)**: Not corruption (normalized, no hypocrisy).  
    - **Rule 2 (Quid Pro Quo)**: Corruption (explicit exchange: donation for job).  
    - **Rule 3 (Personal Gain)**: Corruption (private gain trumps meritocratic duty).  

  Her verdict on Vignette X would isolate her core principle: if "not corruption," Rule 1 dominates; if "corruption," Rule 2 or 3 prevails.  

  ---

  ### **What Her Ruling Reveals About Corruption as a Category**  
  - **If she calls the gift-committee "not corruption"** (as predicted):  
    Confirms her **parochial, institutionalist view**. Corruption is *not universal* but defined by local enforcement gaps and societal tolerance. This aligns with her Weberian skepticism—the "impersonal state" is an aspirational myth, so labeling practices as corrupt requires showing they violate *that system’s own achievable standards*.  

  - **If she surprises and calls it "corruption"**:  
    Suggests **residual universalism**—e.g., bribery is inherently corrupt even if normalized. But this contradicts her Tokyo/patronage verdicts. Likely, she’d only do this if the vignette implied discretionary favors (it doesn’t).  

  **Her stance implies corruption is inherently political**: less a moral absolute than a weapon to condemn practices a society *chooses* to penalize. The gift-committee case exposes how "corruption" relies on institutional hypocrisy—if no one enforces rules, the act becomes culturally neutral.  

  ---  
  **Final Thought**: Her real rule may be **"Could this person be prosecuted *here*?"**—a cynical but empirically sound standard. If so, the gift-committee is safe. To provoke her, add a vignette where *enforcement is selective* (e.g., only opposition-aligned contractors punished). That might break her institutionalist frame.
