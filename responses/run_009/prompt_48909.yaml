     - For each possible action A, we compute the expected utility (EU) of A under each distribution in P.
     - We then apply a decision rule to these sets of EUs. We propose two rules, but the choice of rule is a judgment call (relocates judgment):
       - **Maximin Expected Utility (MMEU)**: Choose the action that maximizes the minimum expected utility over the set P. This is conservative and focuses on avoiding the worst-case scenario.
       - **E-admissibility (E-adm)**: An action is "admissible" if there is at least one distribution in P for which that action has the highest expected utility. Then, we choose among the admissible actions by using a secondary criterion (e.g., minimax regret, or if there is still a tie, pick the one with the highest minimum EU or just pick arbitrarily). Alternatively, we might use a more refined rule like the Hurwicz criterion that balances optimism and pessimism, but for simplicity we stick to MMEU and E-admissibility.

