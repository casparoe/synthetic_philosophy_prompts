answer: |-
  Below is a practical decision procedure for your municipal water utility, designed to handle imprecise probabilities (sets of distributions or intervals) in high-stakes, ambiguous situations. It prioritizes usability—analysts can implement it in 1–2 days with minimal training—while honestly flagging where judgment persists. The procedure is structured as a flowchart followed by templates for three recurring cases.

  ---

  ### **Decision Procedure: Imprecise Risk Management for Water Utilities**
  **When to use this**: Recurring decisions (monthly/quarterly) with uncertainty in data, models, or expert judgment.  
  **Inputs**: Actions, outcomes, expert/model estimates, stakes (monetary/reliability/environmental).  
  **Output**: Recommended action, robustness assessment, and documentation for audit.  

  #### **Step 1: Classify Uncertainty Type**  
  - **Risk (Precise Probabilities)**  
    Use if:  
    - Historical data is abundant and stable (e.g., pipe failure rates).  
    - Experts/models agree on a single probability distribution.  
    - Stakes are low (e.g., routine maintenance).  
    *→ Use standard cost-benefit analysis with expected value.*  

  - **Ambiguity (Imprecise Probabilities)**  
    Use if:  
    - Experts/models disagree on probabilities or outcomes.  
    - Deep uncertainty exists (e.g., climate impacts, demand growth).  
    - Stakes are high (e.g., drought planning, major infrastructure).  
    - Data is sparse or non-stationary.  
    *→ Proceed to Step 2.*  

  **Judgment call**: Thresholds for "high stakes" or "disagreement" depend on team consensus.  

  ---

  #### **Step 2: Elicit and Represent Uncertainty**  
  For ambiguous variables (e.g., demand growth, rainfall):  
  1. **Gather estimates**:  
     - Experts provide intervals (e.g., demand growth: [1%, 3%] or [2%, 5%]).  
     - Models output scenario ranges (e.g., watershed yield: ±20% from baseline).  
  2. **Combine estimates**:  
     - Take the union of intervals (e.g., combined demand growth: [1%, 5%]).  
     - Discretize into 3–5 scenarios (e.g., Low/Medium/High) covering extremes and midpoints.  
  3. **Assign weights (if possible)**:  
     - If experts agree on relative likelihood (e.g., "High growth is twice as likely as Low"), use it to weight scenarios.  
     - If no agreement, treat all scenarios as equally plausible (uniform weights).  

  **Representation**:  
  - **Set of distributions**: Each scenario is a probability distribution (e.g., Normal(μ, σ) with μ ∈ [1%, 5%]).  
  - **Simplified**: Use intervals or scenario outcomes directly (avoids distribution math).  

  **Judgment call**: Choosing which experts/models to include and how to discretize.  

  ---

  #### **Step 3: Compute Utilities**  
  For each action (e.g., "Build large plant") and scenario (e.g., "High demand"):  
  - **Define utility**: Combine costs, reliability, and penalties into a single metric:  
    ```  
    Utility = (Water Delivered × Reliability Weight)  
             − (Construction Cost + O&M Cost)  
             − (Shortfall × Penalty per Unit)  
    ```  
    *Weights/penalties set by policy (e.g., $1M penalty for 1% shortfall).*  
  - **Calculate**: Utility for all action-scenario pairs.  

  **Template**:  
  | Action        | Scenario 1 (Low) | Scenario 2 (Med) | Scenario 3 (High) |  
  |---------------|-------------------|-------------------|-------------------|  
  | Action A      | $U_{A1}$         | $U_{A2}$         | $U_{A3}$         |  
  | Action B      | $U_{B1}$         | $U_{B2}$         | $U_{B3}$         |  

  ---

  #### **Step 4: Apply Decision Rule**  
  If weights are available:  
  - **Γ-Maximin (Conservative)**:  
    Choose action with the highest minimum utility across scenarios.  
    - *Use when*: Avoiding catastrophe is critical (e.g., drought response).  
    - *Formula*: $\max_A \left( \min_{s \in S} U(A,s) \right)$  

  If no weights (or to check robustness):  
  - **E-Admissibility (Moderate)**:  
    1. Eliminate actions *dominated* by another action in all scenarios.  
    2. Keep actions that are *optimal* under at least one scenario/weighting.  
    3. If multiple remain, choose by:  
       - Secondary rule (e.g., minimax regret) or  
       - Stakeholder vote if ties persist.  

  **Minimax Regret (Tiebreaker)**:  
  - Regret = Best possible utility in scenario − Utility of action.  
  - Choose action with the smallest maximum regret.  

  **When to just pick**:  
  - If one action wins under all rules.  
  - If stakes are low, default to expected utility with midpoint weights.  
  - If time is short, use Γ-Maximin for high-stakes decisions.  

  **Judgment call**: Choosing between Γ-Maximin (pessimistic) and E-admissibility (pluralistic).  

  ---

  #### **Step 5: Document and Review**  
  - Record: Scenarios, weights, utilities, decision rule, and rationale.  
  - Review: Post-outcome, compare actual vs. predicted to refine scenarios/weights.  

  ---

  ### **Case Applications**
  #### **Case 1: New Treatment Plant (Demand Growth Uncertainty)**  
  - **Stakes**: High ($100M+ cost, regional water security).  
  - **Ambiguity**: Demand growth ∈ [1%, 5%] (experts disagree).  
  - **Actions**: Small (110% capacity), Medium (130%), Large (150%).  
  - **Scenarios**: Low (1%), Medium (3%), High (5%) growth.  
  - **Utilities** ($M):  
    | Action | Low (1%) | Med (3%) | High (5%) |  
    |--------|----------|----------|----------|  
    | Small  | -20      | -250     | -540     |  
    | Medium | -15      | -55      | -345     |  
    | Large  | -20      | -20      | -150     |  

  - **Decision**:  
    - Γ-Maximin: Large (worst-case utility = -150 > -345 for Medium).  
    - E-admissibility:  
      - Small dominated (worse than Medium/Large in all scenarios).  
      - Medium optimal if growth=1%, Large optimal if growth=3% or 5% → both kept.  
      - Minimax regret: Large (max regret = 5) vs. Medium (max regret = 195) → **Choose Large**.  
    **Judgment**: Γ-Maximin chosen due to high stakes.  

  #### **Case 2: Watershed Allocation (Climate Model Disagreement)**  
  - **Stakes**: Medium (ecosystem/agricultural tradeoffs).  
  - **Ambiguity**: Two climate models:  
    - Model X: Watershed A abundant (yield: 70), B scarce (50).  
    - Model Y: Watershed A scarce (40), B abundant (60).  
  - **Actions**: A1 (60A/40B), A2 (50A/50B), A3 (40A/60B).  
  - **Utilities** (water delivered):  
    | Action | Model X | Model Y |  
    |--------|---------|---------|  
    | A1     | 100     | 80      |  
    | A2     | 100     | 90      |  
    | A3     | 90      | 100     |  

  - **Decision**:  
    - Γ-Maximin: A2 (worst-case = 90) > A1 (80) or A3 (90) → tie with A3.  
    - E-admissibility:  
      - A1 dominated by A2.  
      - A2 optimal under Model X, A3 under Model Y → both kept.  
      - Minimax regret: A2 (regret 10) = A3 (regret 10) → **Tie unresolved**.  
    - **Resolution**: Use secondary metric (e.g., equity: A2 balances sources) or flip a coin.  
    **Judgment**: E-admissibility exposes ambiguity; tiebreak requires policy input.  

  #### **Case 3: Routine Maintenance Budget (Overkill)**  
  - **Stakes**: Low ($500K cost, no reliability risk).  
  - **Ambiguity**: Historical data shows cost ∈ [$50K, $60K] (experts agree).  
  - **Procedure**:  
    - Classify as "risk" (consensus, low stakes).  
    - Use point estimate: $55K (midpoint).  
    - Expected utility: Set budget at $55K.  
  - **Why imprecise is overkill**: Narrow interval and consensus collapse to precise probability.  

  ---

  ### **Where Judgment Persists & Failure Modes**  
  1. **Judgment relocation**:  
     - Choosing uncertainty type (Step 1).  
     - Selecting experts/scenarios (Step 2).  
     - Picking between Γ-Maximin/E-admissibility (Step 4).  
     - Breaking ties.  

  2. **Failure modes**:  
     - **Over-conservatism**: Γ-Maximin may reject cost-effective actions (e.g., Case 1 Large plant is overbuilt if growth is low).  
     - **Indecision**: E-admissibility often leaves ties (Case 2) requiring arbitrary choice.  
     - **Bayesian critique**:  
       - If weights are assigned to scenarios, imprecise probabilities collapse to precise expected utility.  
       - If intervals are narrow (Case 3), the apparatus reduces to a point estimate.  
     - **Scenario blindness**: Discrete scenarios miss tail risks (e.g., demand growth >5%).  

  ---

  ### **Implementation Kit**  
  - **Tools**: Excel (for utilities), R/Python for large scenario sets.  
  - **Training**: 1 day on classifying uncertainty, building utility tables, and applying rules.  
  - **Templates**: Pre-built sheets for Cases 1–3.  

  This procedure makes ambiguity tractable while flagging its limits. Your Bayesian friend is right that it collapses to precision when intervals narrow or weights converge—but when experts clash or models diverge, it forces transparency about uncertainty that a single number obscures.
