          - **Scenario-based approach**: Create a set of scenarios that cover the range of possibilities. Each scenario is a full assignment to the uncertain variables. We do not assign probabilities to the scenarios. Then we can use non-probabilistic decision rules (like minimax or minimax regret) OR we can assign a set of probability vectors over the scenarios (but that is more complex).

