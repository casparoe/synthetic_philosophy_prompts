          - For a continuous variable (like demand growth rate), if experts give intervals [a_i, b_i] or point estimates, we might take the union of these to form a range [min_i a_i, max_i b_i]. Alternatively, we can use a set of distributions (e.g., normal distributions with mean in [m1, m2] and variance in [v1, v2]). But for simplicity and ease of use, we can use a set of scenarios (each scenario is a specific value or a distribution) or use a bounded interval and assume uniform distribution within the interval? However, note: we want to avoid assuming a distribution if we are deeply uncertain.

