answer: |-
  ### 1. Is the "infinite expected value" correct?
  Yes, the infinite expected value is mathematically correct for the uncapped game. Here's the reasoning:

  - The game involves flipping a fair coin until it lands heads. The number of tails before the first heads, denoted as \(X\), follows a geometric distribution where \(P(X = k) = (1/2)^{k+1}\) for \(k = 0, 1, 2, \ldots\).
  - The payout for a given \(X\) is \(W = 2^{X+1}\) dollars. So:
    - \(X = 0\) (heads on first flip): win \(2^1 = \$2\) with probability \(1/2\).
    - \(X = 1\) (tails, then heads): win \(2^2 = \$4\) with probability \(1/4\).
    - \(X = 2\): win \(2^3 = \$8\) with probability \(1/8\), and so on.
  - The expected payout is:
    \[
    E[W] = \sum_{k=0}^{\infty} P(X = k) \cdot 2^{k+1} = \sum_{k=0}^{\infty} \left( \frac{1}{2} \right)^{k+1} \cdot 2^{k+1} = \sum_{k=0}^{\infty} 1 = \infty.
    \]
  - Each term in the sum contributes exactly 1 to the expectation, and since there are infinitely many terms, the sum diverges to infinity.

  **Where the reasoning might seem counterintuitive or "off the rails" practically:**
  - The expectation is infinite because the small probability of winning a very large amount (e.g., \(2^{k+1}\) for large \(k\)) dominates the calculation. For example:
    - Winning \$1024 (which requires 9 tails before heads) has a probability of \(1/1024\), and \( (1/1024) \times 1024 = 1 \), contributing 1 to the expectation.
    - But the probability of winning a large amount decreases exponentially, so in practice, players win small amounts most of the time (e.g., about 75% chance of winning \$4 or less, 87.5% chance of winning \$8 or less).
  - However, the mathematical result is sound. The issue arises in real-world applications because:
    - **Finite resources**: No one can play infinitely many rounds, and the shelter has limited cash (capping payouts).
    - **Risk aversion**: People don't value money linearly (e.g., winning \$1 million isn't "infinitely better" than winning \$100,000 in terms of utility), so rational players wouldn't pay a very high price due to the high risk of losing money.
    - **Practical impossibility**: The game assumes the coin can be flipped indefinitely without error, which isn't realistic.

  So, while the math is correct, it's not practical for decision-making. Charging a high ticket price like \$20 for the uncapped game is not "fair" in a real-world sense, as most players would lose money (e.g., winning \$2 or \$4 with high probability).

  ### 2. Fair ticket price with a \$3,000 payout cap
  With the shelter capping payouts at \$3,000 due to limited cash, the expected payout is finite and calculable. The capped payout \(Y\) is:
  - \(Y = 2^{X+1}\) if \(2^{X+1} \leq 3000\)
  - \(Y = 3000\) if \(2^{X+1} > 3000\)

  Since \(2^{11} = 2048 \leq 3000\) and \(2^{12} = 4096 > 3000\), we have:
  - For \(X \leq 10\), payout = \(2^{X+1}\)
  - For \(X \geq 11\), payout = \$3000

  The expected payout is:
  \[
  E[Y] = \sum_{k=0}^{10} P(X = k) \cdot 2^{k+1} + \sum_{k=11}^{\infty} P(X = k) \cdot 3000
  \]

  - First part (for \(k = 0\) to \(10\)):
    \[
    \sum_{k=0}^{10} \left( \frac{1}{2} \right)^{k+1} \cdot 2^{k+1} = \sum_{k=0}^{10} 1 = 11
    \]
  - Second part (for \(k \geq 11\)):
    \[
    \sum_{k=11}^{\infty} P(X = k) = \sum_{k=11}^{\infty} \left( \frac{1}{2} \right)^{k+1} = \left( \frac{1}{2} \right)^{12} + \left( \frac{1}{2} \right)^{13} + \cdots = \frac{1/4096}{1 - 1/2} = \frac{1/4096}{1/2} = \frac{1}{2048}
    \]
    So,
    \[
    \sum_{k=11}^{\infty} P(X = k) \cdot 3000 = 3000 \cdot \frac{1}{2048} = \frac{3000}{2048} = \frac{375}{256}
    \]
  - Combine:
    \[
    E[Y] = 11 + \frac{375}{256} = \frac{2816}{256} + \frac{375}{256} = \frac{3191}{256} \approx 12.4648
    \]

  **Fair ticket price:** Approximately \$12.47 (or rounded to \$12.50 for simplicity). This is the expected payout per ticket, so charging this amount would make the game "fair" in expectation (ignoring the shelter's overhead or profit goals).

  **Recommendation for the flyer:**
  - Given the fundraiser context, a defensible and practical ticket price is around \$15–\$20. This covers the expected payout while ensuring a profit for the shelter. For example:
    - At \$15, the shelter expects to net about \$2.53 per ticket on average.
    - At \$20, it nets about \$7.53 per ticket.
  - Since attendees include poker players and actuaries, you could note on the flyer: "Expected payout with \$3,000 cap: ~\$12.50; all proceeds support wildlife rescue!" This is transparent and avoids misleading claims.

  ### 3. Advertising "infinite expected payout" as a joke
  You are not being uptight—this is a bad idea for several reasons:
  - **Misleading and unethical**: Even as a joke, claiming "infinite expected payout" is deceptive because:
    - The actual game has a \$3,000 cap, making the expected payout finite and modest (\$12.47).
    - Attendees might not understand the context (e.g., the math assumes no cap) and could feel scammed if they pay \$20 and mostly win \$2 or \$4.
    - Nonprofits have a higher duty of honesty to maintain trust; such claims could damage the shelter's reputation or lead to complaints.
  - **Regulatory risk**: While not illegal, advertising "infinite" payouts could attract scrutiny from consumer protection agencies (e.g., for false advertising), especially if someone feels misled.
  - **Audience reaction**: Poker players and actuaries might appreciate the math joke after a drink, but many others won't. It could backfire, causing arguments or negative publicity.

  **Better approach**: Embrace the math-savvy crowd with a humorous but accurate angle. For example:
  - "Our game has infinite expected value... in theory! With our \$3,000 cash cap, it's a bargain at \$20—plus, you're saving wildlife!"
  - This acknowledges the math while being transparent about reality. Ultimately, the fundraiser should focus on fun and charity, not misleading gimmicks.

  ### Summary
  - **Question 1**: The infinite expected value is mathematically correct for the uncapped game, but it ignores real-world constraints like risk aversion and finite resources. The reasoning doesn't "go off the rails"—it's just impractical.
  - **Question 2**: With a \$3,000 cap, the fair ticket price is about \$12.47. Charge \$15–\$20 for a profitable but defensible fundraiser game.
  - **Question 3**: Avoid joking about "infinite expected payout" to prevent misunderstandings or reputational harm. Opt for transparency and humor that doesn't mislead.
