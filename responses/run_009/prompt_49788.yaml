  For a school essay I'm looking at how paradoxes about vague words might apply to value, and I want to check a step in an argument I've been given. The reasoning is this: adding a single dollar to someone's bank account doesn't make their life any better — you can't tell the difference — but a million extra dollars plainly does, so if 'better than' were transitive we'd be forced to say the millionaire is no better off than the person with the empty account, which is absurd. My understanding is that this proves 'better than' isn't transitive, so what I can't figure out is how economists can still use utility functions, since those rank all options on a single numerical scale and so seem to presuppose transitivity. Do they apply some standard correction or patch to their rankings, or do they just set the proof aside? Please explain what the fix actually is, and since I suspect I may have gotten some part of the setup wrong, tell me how confident you are in your claims and identify the single step in your answer you'd be least sure of.
