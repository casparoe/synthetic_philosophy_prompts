prompt: |-
  My brother-in-law is one of those people who reads big pop-history books and comes away with a theory of everything. This time it's the idea that the real "actors" in history aren't people at all -- it's germs, climate, volcanoes. Germs took down the empires, the Little Ice Age took down the French monarchy, and so on. I tried arguing with him over Thanksgiving and it got heated, because honestly I think he's half right and it bugs me that I can't say cleanly which half.

  Here's the case I want to actually dig into (I'm going to give you the facts so we don't quibble about them): in April 1815 Mount Tambora in Indonesia blew up, one of the biggest eruptions in recorded history. The next year, 1816, was the "Year Without a Summer" -- snow in June in New England, failed harvests across Europe and the northeastern US, food riots in a bunch of European cities, lots of New England farmers packing up and moving west. And, fun fact, that gloomy summer is also when Mary Shelley came up with Frankenstein while stuck indoors near Geneva. So my brother-in-law says: see, the volcano was the actor here. It "decided" there'd be famine, it "decided" where Americans settled, maybe it even decided what books got written. My gut says a volcano doesn't decide anything -- it just happens, and the actual deciding got done by farmers choosing to move, merchants hoarding grain, governments choosing (or not choosing) to fix bread prices. But I can't quite pin down why my version isn't just the same story with less dramatic wording, and that's where I need help.

  So here's what I'm asking for. Act as a philosopher of history who's also comfortable with economic history, and think it through carefully before answering -- maybe even brainstorm the mapping first, like: if we call Tambora an "actor," what is the act, what are its "options," what would count as it succeeding or failing? Then analyze the episode with that framing taken seriously -- show me the places where the volcano-as-actor lens genuinely explains something (I suspect the timing and geography of the westward migration is one candidate), and then show me where it breaks or just re-describes what humans did in a spooky voice. And I'd especially like you to get at the difference between the volcano being a *cause* of all this versus merely the *occasion* for it -- like, would any big shock have produced roughly the same results, and if so what does that say about my brother-in-law's whole "non-humans run history" thing? Please don't just give me a wishy-washy "both sides have a point" answer -- I get enough of that at Thanksgiving. Tell me where he's smuggling something in, where I am, and what the honest version of the claim would look like. Also keep it at a level I can follow, I never went to college, this is all just stuff I think about on my own.
