  ### The Agreement Game: Experiencing Aumann's Theorem

  **Objective:** Simulate Aumann's agreement theorem through a hands-on game where players update beliefs based on public announcements. Participants experience convergence toward consensus and identify when assumptions break down.

  **Materials:**
  - 15 envelopes with private evidence cards (pre-generated)
  - Whiteboard for recording announcements
  - Markers
  - Tokens (or poker chips) for betting (30 per player)
  - Calculator (for facilitator)
  - Prize for the winner (e.g., book or novelty item) to incentivize accuracy

  **Setup (5 min):**
  1. **Introduce the theorem briefly:** "Agents with common priors, who know each other to be rational, cannot agree to disagree if their beliefs are common knowledge."
  2. **Explain the scenario:** 
     - Two urns: **Urn A** (4 red balls, 6 blue) and **Urn B** (6 red, 4 blue). 
     - A fair coin flip selected the urn (unknown to players). 
     - Each player drew one ball **with replacement** from the chosen urn (signals are independent).
  3. **Common prior:** 50% chance for either urn.
  4. **Private evidence:** Each envelope contains a card: 🔴 (red) or 🔵 (blue).  
     - 🔴 implies P(Urn A) = 40% (because P(red \| A) = 0.4).  
     - 🔵 implies P(Urn A) = 60% (P(blue \| A) = 0.6).  
  5. **Payoff:** 10 points for a correct final probability (±5% of truth). 5 bonus points for winning bets.

  **Rules (5 min):**
  1. Players calculate their **initial posterior** using their card. 
  2. **Announcements:** Each round, all players simultaneously and publicly announce their current probability (as a whole number: 40 or 60). 
  3. **Updating:** After each round, players update beliefs using Bayes’ rule.  
     - Example: If 10 players announce 40% (🔴) and 5 announce 60% (🔵):  
       $$P(A \mid \text{data}) = \frac{(0.4)^{10} \cdot (0.6)^5}{(0.4)^{10} \cdot (0.6)^5 + (0.6)^{10} \cdot (0.4)^5} \approx 7.7\%$$  
  4. **Betting (optional):** After any announcement, players can privately propose bets (e.g., "I offer 10 tokens: pay me 20 if Urn A, else I pay you 10"). Bets execute only if both agree. 
  5. **Final payoff:** Accuracy points + token conversions (1 token = 0.5 points).

  **Timeline (60 min):**
  1. **Round 0 (5 min):** Distribute envelopes. Players open cards, calculate initial posteriors. 
  2. **Round 1 (5 min):** Public announcements. Record all probabilities (e.g., "Ann: 60, Bob: 40..."). 
  3. **Update & Discussion (10 min):** Players recompute beliefs. Facilitator guides: "How did your belief change? What’s your new probability?" 
  4. **Round 2 (5 min):** Re-announce. *Most players converge to same probability (e.g., 77% for A if 9🔴/6🔵).* 
  5. **Betting Round (10 min):** Open betting. *Predictably, no trades occur.* 
  6. **Twist Round (15 min):** Secretly ask 1-2 players to **deviate**:  
     - "Humanities skeptic": Announces 50% regardless of evidence.  
     - "Statistician gamer": Lies to manipulate odds.  
     Re-run announcements. *Consensus stalls; bets may occur.* 
  7. **Debrief (10 min):** Reveal true urn. Award points. Discuss.

  **Debrief & Theorem Mapping:**
  - **Consensus cascade:** Players saw announcements reduce disagreement (e.g., 40/60 → 77/77). Maps to *common knowledge of posteriors* forcing agreement. 
  - **Stalled convergence:** Deviations revealed failures:  
    - Humanities skeptic broke *rationality*.  
    - Statistician broke *sincerity* (posterior not common knowledge).  
  - **No-trade theorem:** Bets failed initially (identical valuations). Post-twist, bets emerged (violations created perceived value). 
  - **Key distinctions:**  
    - *Exchanging conclusions* (announcements) vs. *exchanging reasons* (evidence). Theorem needs only conclusions.  
    - *Common priors* (simulated) vs. *common evidence knowledge* (not required). 

  **Predictable Challenges:**
  1. **Humanities skepticism:** "Why trust others’ numbers?" → Use to discuss rationality assumption. 
  2. **Statisticians game the system:** Pre-brief: "No lying in initial rounds." Twist round channels this. 
  3. **Anchoring on first number:** First announcer’s 40% may sway others. Highlight in debrief. 
  4. **Computation overload:** Provide pre-calculated tables (e.g., "9 reds → 7.7%"). 

  **Limitations & Crisp Quotes:**
  - **Unsimulatable element:**  
    *True common knowledge* (players can’t verify others’ rationality or updating).  
    → "In the game, you trusted announcements because I enforced rules. Real life? Less so."  
  - **Crisp outcomes:**  
    - "With rational players, 15 signals converged to 77% — all agreed Urn A was unlikely."  
    - "When Sarah announced 50% despite a blue card, consensus shattered: posteriors split from 20% to 80%."  
    - "Zero bets pre-twist; 5 bets post-twist. Violations create trade."  

  **Preparation Notes:**
  - Pre-generate envelopes using RNG: `if urn=A, P(red)=0.4; else P(red)=0.6`. Ensure 5-10 red cards.  
  - Test computations: 9🔴/6🔵 → 7.7% for A; 6🔴/9🔵 → 77% for A.  
  - Script twist instructions (e.g., "You’re a contrarian: always say 50%").  
  - Bring extra tokens for betting enthusiasts.  

  This design delivers visceral intuition: players *feel* consensus as numbers align and *frustration* when deviations break it. The betting twist and urn reveal create quotable moments on the theorem’s fragility. Run it once pre-deadline to refine timing!
