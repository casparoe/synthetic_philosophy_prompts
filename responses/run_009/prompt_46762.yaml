          14. Therefore, there should be no overlap between any player's bid and another's ask (because they are the same), so no trade is possible.

       Part 4: Introduce a twist to break the conditions (15 minutes)

          15. Now, we want to show what happens when the conditions are not met.

          16. Select one player in advance (without telling the others) to be "irrational". We give them different instructions: they are to always announce 50%, regardless of their evidence.

          17. Or, we can have one player be strategic: they want to make money, so they might misrepresent their posterior.

          18. Rerun the game with the twist.

          19. In round 1, most players announce 40% or 60%, but one player (the irrational) announces 50%.

          20. Then, when updating, the players will think that this player had evidence that led to 50%? But in our setup, there is no evidence that yields 50%. This breaks the updating.

          21. Or, if we use the two-coin flip setup (with three possible posteriors), then 50% is possible. So let's switch to that setup for the twist.

          Given time, we might not have time to run two full games. We can instead discuss the twist theoretically.

       Alternatively, we can run the main game without the twist and then in the debrief discuss the fine print.

     Timeline:

       0-5 min: Introduction to the theorem and the setup.
       5-10 min: Distribute envelopes, players open and compute initial posterior.
       10-20 min: Round 1: players announce, record on board.
       20-30 min: Players compute the full posterior (in small groups or individually, then share results).
       30-35 min: Round 2: announce the new posterior (should be the same).
       35-45 min: Betting market: before and after.
       45-60 min: Debrief and discussion of the theorem and the fine print.

     However, the betting part might be complex. We can simplify the betting to a single question.

     Betting part:

       At the beginning (before any announcement), ask each player: 
          "What is the smallest amount (between 0 and 100) for which you would sell a ticket that pays 100 if the urn is A? (so if you sell at price P, you get P for sure, and you pay 100 if urn is A, nothing otherwise)"

          The rational selling price: P = 100 * P(urn A) + they might add a risk premium? But ideally, it should be 100 * P(urn A).

          Similarly, buying: "What is the highest amount you would pay for a ticket that pays 100 if urn is A?"

          This should be 100 * P(urn A).

       After the game, they do the same.

       Then, we can see that before, there was a range (because different posteriors) and after, no range.

     But note: we have to collect the prices quickly.

     Alternatively, we can ask for their posterior and then compute the theoretical bid/ask: it should be 100 * posterior.

     Then, before the announcements, there will be a range of bid and ask prices. Some might be willing to trade. For example, a player with 40% might be willing to sell at 45, and a player with 60% might be willing to buy at 55. Then they could trade at 50.

     After, no trade.

     We can try to facilitate a market: have players call out bids and asks and see if any trades occur.

     Given time, we might skip the live market and just note the change in the range.

     What will go wrong:

       - The humanities people might not buy the Bayesian updating: "Why should I update based on your announcement? I don't trust you."
       - The statisticians might point out that the draws are independent, and they might do the full update in their head immediately.
       - Anchoring: the first number spoken might influence how people update (even though it shouldn't in the rational model).
       - Computational difficulty: some might not be able to do the exponentiation.

     To address:

       - For the updating after round 1, provide a calculator or do it together on the board.
       - Emphasize that the experiment assumes rational agents and common knowledge of rationality.

     What the game cannot reproduce:

       - Common knowledge of posteriors: in the game, we achieve common knowledge by public announcement. But in real life, it's hard to achieve common knowledge (e.g., everyone hears, but does everyone know that everyone heard?).
       - The requirement of common priors: we assumed a 50% prior. In real life, people might have different priors.

     Crisp result to quote:

       "After seeing 15 signals, the group converged to a posterior probability of XX% for urn A, and every member's revised assessment matched to the decimal."

     Or if we do the twist with one irrational player:

       "When one player deviated from Bayesian updating by announcing 50% despite holding a blue ball (which should have led to 60%), the group's consensus was YY%, but the true urn was A, demonstrating how quickly the agreement unravels when the theorem's assumptions are violated."

     Let's do the math for the updating in the main game:

          Let R = number of red signals
          The full posterior for A: 
              P(A) = 1 / [1 + ( (0.6/0.4)^R * (0.4/0.6)^(15-R) ) ]
                     = 1 / [1 + (1.5)^(R) * (2/3)^(15-R) ) ]
                     = 1 / [1 + (1.5)^(2R-15) ]

          Because: (1.5)^R * (2/3)^(15-R) = (1.5)^R * (2/3)^15 * (3/2)^R = (2/3)^15 * (1.5 * 1.5)^R? Let me recompute:

              (0.6/0.4) = 1.5, (0.4/0.6)=2/3.
              So the term: (0.6/0.4)^R * (0.4/0.6)^(15-R) = (1.5)^R * (2/3)^(15-R)

              But note: (2/3)^(15-R) = (2/3)^15 * (3/2)^R

              So = (1.5)^R * (2/3)^15 * (3/2)^R = ( (3/2) * (3/2) )^R * (2/3)^15 = (9/4)^R * (2/3)^15

          Alternatively, we can compute in log space.

     We can compute it as:

          Let X = (0.4)^R * (0.6)^(15-R)
          Y = (0.6)^R * (0.4)^(15-R)

          P(A) = X / (X+Y)

     We can do this calculation with a calculator.

     Given the time, I think this design meets the requirements. We will see convergence in the second round. The no-trade part will show no betting after consensus.

     Let me write the full procedure.

     Final Design:

     Title: The Urn of Agreement

     Materials:
       - 15 envelopes, each containing either "Red" or "Blue" (generated by: flip a coin for urn, then for each player, flip a biased coin: if urn A, then 40% chance of "Red", 60% "Blue"; if urn B, then 60% "Red", 40% "Blue")
       - A cheat sheet: "If your evidence is Red, your initial posterior for Urn A is 40%. If Blue, 60%."
       - Whiteboard and markers
       - Calculator (or laptop with a spreadsheet ready: we input R and it computes)

     Steps:

       1. [5 min] Introduction: Explain Aumann's theorem: rational agents with common priors who share their posteriors publicly will eventually agree. We are going to simulate this.

           - Setup: two urns, chosen by coin flip (show coin, but flip in advance). Urn A: 4 red, 6 blue. Urn B: 6 red, 4 blue.
           - Each player gets a ball drawn from the chosen urn (with replacement). The ball's color is your private evidence.
           - Your task: estimate the probability that the urn is A.

       2. [5 min] Distribute envelopes. Players open and compute their initial posterior (using the cheat sheet).

       3. [15 min] Round 1: 
            - Go around the room: each player states their name and their posterior (40 or 60). 
            - Facilitator records on the whiteboard: 
                  Player1: 40
                  Player2: 60
                  ...
            - Count the number of 40s (R) and 60s (B). Note: R + B = 15.
            - Then, with the whole group, compute the full posterior for urn A given the 15 signals.

            Formula: 
               Let R = number of "Red" signals (which led to 40% posterior)
                   B = number of "Blue" signals (which led to 60% posterior) [B=15-R]
               P(Urn A | data) = [ (0.4)^R * (0.6)^B ] / [ (0.4)^R * (0.6)^B + (0.6)^R * (0.4)^B ]

            Use a calculator to compute this. Let everyone see the result.

       4. [5 min] Round 2:
            - Announce: "Now that we have shared our initial posters, we have updated to a new probability. What is your updated posterior?"
            - Every player should have the same number. Go around: each states the same number.

       5. [10 min] Betting part:

            - At the beginning of the game, we asked players to write down:
                  (a) The lowest price at which they would sell a ticket that pays 100 if urn is A.
                  (b) The highest price they would buy that ticket for.
            - We collect these at the beginning (on a piece of paper) without sharing.

            - Now, after the update, we ask again for (a) and (b).

            - Compare: before, there was variation in the prices. After, they should all be the same (equal to the computed posterior times 100).

            - Therefore, before, there might have been opportunities for trade (e.g., a player with a low posterior might sell to a player with a high posterior). After, no trade is possible.

       6. [15 min] Debrief:

            - What happened: we started with different opinions (40 or 60), then after sharing, we converged to one number.
            - Why? Because we (a) had a common prior, (b) we are rational (Bayesian updaters), and (c) we made our posteriors common knowledge.
            - The no-trade result: once we agree, we cannot find a bet we both want to take.

            - The fine print:
                 - What if we didn't have common priors? (e.g., if some players didn't believe the coin was fair?)
                 - What if we didn't trust each other to be rational? (e.g., if someone always says 50%, we cannot update properly)
                 - What if we only shared our evidence (the ball color) instead of our posteriors? Then we would have updated the same way. But in real life, people share conclusions, not evidence. And the theorem says that sharing posteriors suffices.

            - Also, note: in the first round, by sharing our posteriors, we revealed our evidence. But what if the evidence was not so easily revealed? (like in the two-coin example, where 50% didn't reveal the exact evidence). In that case, sharing posteriors might not reveal the evidence, but the theorem says you will still converge.

            - However, in our game, we converged in one step because the evidence was revealed.

       7. [5 min] Twist discussion (theoretical):

            - "What if one player had announced 50% in the first round? What would that mean?"
            - In our setup, there is no evidence that gives 50%. So it would break the assumptions (that player is not rational or not truthful).
            - Then, the other players wouldn't know how to update. They might ignore that player or try to model them as irrational. The agreement might not be reached.

     This design should fit in 60 minutes. The crisp result to quote is the computed posterior and the fact that all players announced the same number in round 2.

     Note: To save time, the signals can be generated in advance. The urn type should be recorded so that after the game, we can reveal it and see if the group was correct.

     Example quote: "In a simulation with 15 participants and a true urn of type B, the group's initial estimates ranged from 40% to 60%, but after sharing, they converged to 92.7% for urn A, which was incorrect. This illustrates that agreement does not guarantee truth, only that rational agents will agree."

     But wait, we need to compute an example.

     If the urn is B, then we expect about 60% of the signals to be red (which lead to 40% posterior) and 40% blue (60% posterior). So R (number of 40% announcements) should be around 9 (60% of 15), and B=6.

     Then, P(A) = [ (0.4)^9 * (0.6)^6 ] / [ (0.4)^9 * (0.6)^6 + (0.6)^9 * (0.4)^6 ]
               = [ (0.4)^3 * (0.6)^6 ] / [ (0.4)^3 * (0.6)^6 + (0.6)^3 * (0.4)^6 ]   [cancelling (0.4)^6 and (0.6)^6]
               = [ (0.4)^3 ] / [ (0.4)^3 + (0.6)^3 * (0.4)^3 / (0.6)^3 ] -> let me recompute:

     Alternatively, we can compute the likelihood ratio:

          LR = [ (0.4)^9 * (0.6)^6 ] / [ (0.6)^9 * (0.4)^6 ] = (0.4/0.6)^(9-6) = (2/3)^3

          So P(A|data) = 1 / [1 + (1 / LR)] = 1 / [1 + (3/2)^3] = 1 / [1 + 3.375] = 1/4.375 ≈ 0.2286

     So they would converge to about 22.9% for A, meaning 77.1% for B.

     If the urn is B, they should be more than 50% for B. This is correct.

     But if the urn is A, then R should be around 6, and B=9.

     Then, LR = [ (0.4)^6 * (0.6)^9 ] / [ (0.6)^6 * (0.4)^9 ] = (0.6/0.4)^(9-6) = (1.5)^3 = 3.375
          P(A|data) = 3.375 / (1+3.375) = 3.375/4.375 = 0.7714

     So they converge to 77.1% for A.

     Therefore, the method works.

     We can then reveal the urn and see if the consensus was right.

     This adds excitement.

     So in the end, we reveal the urn type.

     Final timeline with reveal:

       0-5: intro
       5-10: open envelopes, compute initial
       10-25: round1 and computation (we might need 15 minutes for the computation if we do it by hand, but with a calculator it's quick)
       25-30: round2
       30-40: betting part
       40-50: debrief
       50-55: reveal urn type
       55-60: twist discussion

     Given the group size, we might run over. We can cut the betting part to 5 minutes if we don't do a live market.

     This should work.
