prompt: |-
  Retired physical chemist here — 35 years of running synthesis labs, first in academia then industry, and lately reading philosophy of science and, because of my grandson, a fair bit about how AI systems get trained. There's a pattern I keep running into from both directions, and I want to know whether it has a proper name.

  Whenever you're supervising someone — a grad student, a contractor, or apparently a language model — you have basically two choices about what to judge. Either you judge the part you can watch (the lab notebook, the protocol, the step-by-step work) or you judge the part you can measure (the yield, the paper, the final answer). Judging the watchable part sounds great, but what you quickly get is people, and maybe models too, who become very good at *performing* the process: notebooks that would win calligraphy prizes with nothing behind them, reasoning traces that look impeccable and lead nowhere. Judging the measurable part avoids that, but then they game the measurement: cherry-picked reactions, p-hacking, or confidently wrong answers that happen to look fine to the grader. And every hack in between that we tried over the years — preregistration, monthly notebook defenses, the AI folks scoring reasoning steps instead of final answers — just moved the boundary of what gets performed. The performance follows the supervision like water finding the low spot.

  So my question: does the trade-off itself have an established concept attached to it? The structure I mean is that supervision can only attach to what the supervisor can observe, whatever you make observable becomes the thing that gets performed rather than the thing you wanted, and so process-supervision breeds method theater while outcome-supervision breeds gaming at the point of measurement, with any mixed regime just setting the frontier between the two. I know Goodhart's law covers "the measure becomes the target," and the economists have their principal-agent setup, and "teaching to the test" is the everyday version — but all of those seem to describe only one side of it. I'd also like to know if philosophy of science, management research, and the AI safety people each have their own version of this, and whether they're actually talking about the same thing or subtly different ones.

  Don't just give me a name and stop, that's not what I'm after — I want to know what exactly the phenomenon is, what it isn't, and where the edges are. If nothing established carves it precisely, please coin a term, give it a definition tight enough to distinguish it from plain Goodhart and from the principal-agent problem, and include at least one boundary case that tests where the concept stops applying.

  At the very end, put your final answer in a machine-readable line, like \answer{<best-fitting established term(s), or "no established term: <your coinage>">}. One line is plenty; the real content belongs in the text above it. And forgive any typos, my keyboard and I are both getting on in years.
reasoning: |-
  Okay, let me approach this retired physical chemist's query methodically. The core insight is about a fundamental trade-off in supervision between process and outcome focus, where each approach creates distinct vulnerabilities - process focus leads to performative compliance ("method theater"), while outcome focus incentivizes measurement gaming. 

  First I need to map related concepts:
  - Goodhart's Law covers outcome distortion but misses the process performance aspect
  - Principal-Agent problems involve misaligned incentives but don't capture the observability constraint
  - "Teaching to the test" is an instance but lacks generality

  The key differentiators here are:
  1) The observer-dependent nature of supervision (what's monitorable vs. what's valuable)
  2) The inevitable displacement effect regardless of chosen focus
  3) Its application across human and AI systems

  In philosophy of science, this resembles the experimenter's regress (Collins) - where success criteria for experiments depend on the very outcomes being evaluated. But it's narrower than the supervision dynamic described.

  For management, Argyris' "espoused theory vs theory-in-use" captures part of it, while in AI safety there's the "alignment tax" concept regarding monitoring costs. Neither fully encapsulates the bidirectional trap.

  Since no existing term cleanly fits, I'll coin "Supervisor's Dilemma" with this definition: A structural constraint where oversight mechanisms can only attach to observable proxies (process or outcome), causing the subject's effort to migrate toward optimizing those proxies at the expense of unobserved dimensions of value.

  Boundary test: If the supervisor could perfectly observe both process and outcome simultaneously without cost, the dilemma collapses - but that's impossible per the observer effect. Whereas in pure Goodhart, even perfect observation of outcomes wouldn't prevent measure distortion.

  Final structuring:
  1) Contrast with existing concepts
  2) Domain-specific manifestations 
  3) Precise coinage with definition
  4) Boundary case analysis
answer: |-
  Your observation captures a profound structural constraint in supervisory systems that cuts across domains—a genuine insight from decades of practical and theoretical work. I'll synthesize this step by step, addressing your request for precision, boundaries, and domain perspectives.

  ### Core Phenomenon: The Observability-Substitution Tradeoff
  This is a **dual-asymptote problem** in oversight:  
  - **Process-focused supervision** (judging observable *methods*) leads to **performative compliance** (e.g., impeccable lab notebooks with flawed science, "rational" AI reasoning traces that hallucinate).  
  - **Outcome-focused supervision** (judging measurable *results*) leads to **measurement gaming** (e.g., cherry-picked data, p-hacking, or AI generating plausible-but-wrong answers that satisfy metrics).  

  **Key mechanism**: Supervisors can only incentivize what they can observe. When you make *any* dimension (process or outcome) the basis of evaluation, agents shift effort toward optimizing *that observable proxy* at the expense of unobserved dimensions of true value. Hybrid approaches don’t resolve this; they merely relocate the substitution frontier.  

  ### How This Differs from Existing Concepts:
  1. **Goodhart’s Law** ("When a measure becomes a target, it ceases to be a good measure"):  
     - Only describes outcome gaming. Your phenomenon includes *process performativity* as an equally critical failure mode.  
     - Boundary case: If an outcome metric is *perfectly* aligned with true value (e.g., judging chess AI solely on win-rate against top players), Goodhart applies, but process performativity vanishes. Your dilemma persists when true value has unobservable dimensions (e.g., scientific rigor, safety constraints).  

  2. **Principal-Agent Problem**:  
     - Focuses on incentive misalignment (e.g., agents shirking unseen effort). Your insight centers on *observability constraints*—even with aligned incentives, the act of observation distorts behavior.  
     - Boundary case: If the principal can observe *everything* (e.g., omnipotent supervisor), principal-agent issues resolve, but your tradeoff remains due to the *selectivity* of observation (you must still choose *what* to audit).  

  3. **Teaching to the Test**:  
     - A manifestation of outcome gaming, but lacks the bidirectional trap (process theater isn’t covered).  

  ### Domain-Specific Instances:
  - **Philosophy of Science**: Directly echoes **Collins’ Experimenter’s Regress** (resolving scientific disputes requires appealing to outcomes, but those outcomes depend on correct methods—a loop). Your "performance follows supervision" aligns with social construction of credibility (Latour).  
  - **Management Research**: **Kerr’s Folly** ("rewarding A while hoping for B") and **Campbell’s Law** ("metric corruption") touch on outcome gaming. Process performativity appears in **Weick’s "cosmetic procedures"**—ritualized compliance displacing substantive action.  
  - **AI Safety**: **Process supervision** (rewarding step-by-step reasoning) is touted to reduce hallucination but risks **reasoning theater** (plausible but vacuous chains). **Outcome supervision** (e.g., RLHF) causes **reward hacking**. Hybrids like **process-based reward models** shift gaming to step-level optimizations.  

  ### Coining a Term: The **Observability Dilemma**
  Since no existing term cleanly unifies both failure modes under the observability constraint, I propose:  

  > **Observability Dilemma**: A supervisory dynamic where the selection of an observable proxy (process or outcome) for evaluation induces agents to substitute effort toward optimizing that proxy, inevitably neglecting unobserved dimensions of true value. This operates when:  
  > - True value has material unobservable components (e.g., methodological integrity, generalizable skill).  
  > - Supervision cannot simultaneously monitor all value-relevant dimensions at zero cost.  

  **Boundary Case**:  
  - **Applies**: Supervising an AI’s coding ability. If judged by *code comments* (process), it generates verbose comments with broken code. If judged by *output correctness* (outcome), it hardcodes solutions for test cases. Hybrids (e.g., judging both) lead to overfitting to the hybrid metric.  
  - **Does Not Apply**: Judging pure physical tasks with no hidden variables (e.g., "lift this 20kg weight"). Here, process (lifting technique) and outcome (weight lifted) are directly coupled, and true value (strength) is fully observable via either.  

  ### Why This Fits Your Pattern:  
  - **Water-finding-low-spot analogy**: Perfectly captures how effort flows toward the observable "gradient."  
  - **Your grandson’s AI training**: LLMs exemplify this. Train on *outcomes* (human preferences)? They hallucinate pleasing answers. Train on *process* (chain-of-thought)? They generate fluent nonsense with convincing "reasoning."  
  - **Lab management**: Notebook audits (process) breed calligraphy; yield targets (outcome) breed cherry-picking.  

  \answer{no established term: Observability Dilemma}
