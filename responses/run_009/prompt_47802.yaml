  **LIMITED WARRANTY OF GUARANTEED FRAGILITY**  
  **Vitrine Friable & Co. ("VF&C")**  
  **Effective: Perpetuity (Subject to Clause 12.iii)**  

  **1. DECLARATION OF FRAGILITY GUARANTEE.** Vitrine Friable & Co. ("VF&C"), purveyors of exquisite and inherently ephemeral crystal decanters ("Covered Product"), warrants solely and exclusively that each Covered Product possesses the fundamental dispositional property of **Fragility** (as defined herein) at the time of transfer of title to the Buyer. VF&C guarantees that Fragility is intrinsic to the Covered Product under standard terrestrial conditions (1 atm, 25°C, gravity ≈9.8 m/s², absence of divine intervention per Clause 7.v).

  **2. DEFINITION OF FRAGILITY.** For the purposes of this Warranty, "Fragility" is defined as the intrinsic **disposition** (a potential state or capability) of the Covered Product such that, **were it to be struck with sufficient force ("Stimulus")**, it **would manifest** its characteristic outcome, namely, shattering into multiple fragments ("Manifestation"). Fragility is thus understood conditionally: *if struck sufficiently, then it would shatter*.

  **3. COVERED MANIFESTATIONS.** This Warranty covers the successful manifestation of Fragility (shattering) in a Covered Product occurring within thirty (30) seconds of the application of the Stimulus, provided such Stimulus is applied under standard conditions (as per Clause 1) and in a manner consistent with foreseeable handling not explicitly excluded herein.

  **4. EXCLUSIONS: GENERAL PRINCIPLE.** Coverage under this Warranty is voided if the failure of the Covered Product to manifest Fragility (shatter upon sufficient striking) is attributable to circumstances demonstrating that the *conditional definition of Fragility in Clause 2*, while generally aspirational, fails to capture the ontological nuances of dispositional properties in complex causal scenarios. Specifically excluded are instances involving Finks, Masks, and Antidotes.

  **5. EXCLUSION: FINKS.** Coverage is excluded if the failure to shatter upon sufficient striking results from the presence of a **Finkish Condition**. A Finkish Condition exists when a standing state or entity:  
      **i.** Is contemporaneous with the Covered Product's possession of Fragility;  
      **ii.** Possesses the causal power to *instantaneously remove* the Covered Product's Fragility *precisely at the moment* a sufficient Stimulus is applied or imminently threatened;  
      **iii.** Thereby ensures the Covered Product is *not fragile* at the exact instant of potential Stimulus application, preventing the Manifestation *because* it was fragile immediately prior.  
      *Example Excluded:* A "Fragility Guardian" device attached to the decanter, which, upon detecting an imminent sharp impact, instantly floods the crystal structure with a bonding field, rendering it non-fragile *during* the impact event, preventing shattering precisely *because* the decanter was fragile microseconds before impact.

  **6. DISPUTE RESOLUTION: FINKISH OBJECTS & GENUINE FRAGILITY.** In the event a Covered Product protected by a Finkish Condition fails to shatter upon sufficient striking, any dispute regarding whether the Buyer received a product possessing genuine Fragility (as warranted) or merely an object indistinguishable from fragile glass prior to impact but lacking the disposition, shall be resolved by binding arbitration before a panel of three analytic metaphysicians appointed by VF&C. The Warranty expressly covers *the possession of the genuine dispositional property*, not merely the pre-impact appearance or molecular structure typically associated with fragility. The arbitration panel shall determine if the object qualified as fragile *at the critical counterfactual moment* before finking occurred.

  **7. EXCLUSION: MASKS.** Coverage is excluded if the failure to shatter upon sufficient striking results from the presence of a **Masking Condition**. A Masking Condition exists when a contemporaneous state or entity:  
      **i.** Does *not* remove or alter the Covered Product's intrinsic Fragility;  
      **ii.** Prevents the applied Stimulus from *interacting sufficiently* with the Covered Product's fragility-grounding base (e.g., molecular structure) to produce the Manifestation;  
      **iii.** Thereby "masks" the Fragility without eliminating it.  
      *Example Excluded:* The Covered Product is shipped encased in VF&C's proprietary "Paradox Foam" packaging, which absorbs and dissipates any striking force below the threshold required for shattering, while the decanter *itself* remains maximally fragile. The fragility is present but prevented from manifesting by the foam's intervention *between* stimulus and fragile base.

  **8. EXCLUSION: ANTIDOTES.** Coverage is excluded if the Covered Product shatters upon sufficient striking but the shattering is not the direct causal consequence of its Fragility due to an **Antidotal Intervention**. An Antidotal Intervention occurs when:  
      **i.** A sufficient Stimulus is applied to the Covered Product;  
      **ii.** The Stimulus *begins* the causal process leading towards the Manifestation (shattering);  
      **iii.** An intervening factor *after* the Stimulus application but *before* the Manifestation is complete *breaks the causal chain* linking the Covered Product's fragile state to the shattering outcome.  
      *Example Excluded:* The decanter is struck sufficiently hard, initiating cracks, but a "Shatter-Negator" beam instantly fuses the glass at the moment of crack propagation, resulting in no *net* shattering. The fragility was triggered, but its manifestation was "cured" or intercepted. Coverage is *also* excluded if the Manifestation was "prevented rather than defeated" (e.g., the Stimulus was never applied due to external prevention, distinct from a Mask blocking an *applied* Stimulus or an Antidote interrupting an *ongoing* manifestation).

  **9. RIDER: REVERSE FINKS (EMERGENT FRAGILITY).** VF&C expressly disclaims any warranty coverage for failure to shatter in cases involving **Reverse Finks**. A Reverse Fink exists if the Covered Product:  
      **i.** Does *not* possess Fragility at the time of sale or immediately prior to a potential impact;  
      **ii.** Only *acquires* the disposition of Fragility *at the precise moment* a sufficient Stimulus is applied.  
      *Example Excluded:* A decanter treated with "Sudden Brittle" coating, which is non-fragile until struck, at which nanosecond the coating activates, making the glass fragile *during* the impact, causing it to shatter *because* it became fragile *then*. This emergent fragility falls outside the Warranty's guarantee of *possessed* Fragility at time of sale.

  **10. ACKNOWLEDGMENT OF DEFINITIONAL CHALLENGES (THE "WOULD-IF" CONUNDRUM).** VF&C, guided by its Metaphysical Consultants, acknowledges that the conditional definition of Fragility ("would shatter if struck") provided in Clause 2, while foundational, encounters operational difficulties in the scenarios described in Clauses 5 (Finks: *was* fragile, *wouldn't* shatter if struck *because* finked), 6 (Fink Arbitration: *was* it *really* fragile?), 7 (Masks: *is* fragile, *doesn't* shatter when struck), 8 (Antidotes: struck, *begins* to shatter, *but doesn't* fully manifest), and 9 (Reverse Finks: *not* fragile, *becomes* fragile *when* struck, *then* shatters). Each exclusion represents a scenario where the simple conditional fails to correspond neatly to the disposition's presence or absence or its causal role. VF&C maintains the definition *aspirationally*, while relying on the enumerated exclusions to manage its... practical limitations.

  **11. THE ONTOLOGICAL DISCLAIMER (FINAL ADMISSION).** VF&C, its Metaphysical Consultants, and its Legal Draftspersons, hereby concede that the ultimate metaphysical status of Fragility remains indeterminate under this Warranty and, indeed, within the broader field of inquiry. It is unknowable with certainty whether Fragility:  
      **i.** Is an **intrinsic categorical property** of the glass itself, knowable independently of its potential manifestations (a position increasingly difficult to defend given the exclusions); or  
      **ii.** Is solely a **dispositional property**, knowable *only* through the manifestation of shattering under appropriate conditions (a position rendered problematic by Masking and Finking); or  
      **iii.** Represents a complex, context-dependent **causal power** whose existence and nature are inextricably tied to, yet potentially thwarted by, the surrounding causal nexus (the position tacitly adopted by the structure of this Warranty and its litany of exclusions). Consequently, VF&C warrants the disposition *as best as it can be conceptualized*, which is to say, conditionally, with caveats.

  **12. GENERAL TERMS.**  
      **i.** This Warranty is non-transferable and applies only to the original Buyer.  
      **ii.** Claims must be submitted in writing, accompanied by the shattered remnants (or a certified metaphysical affidavit of non-manifestation), within 14 days of the Stimulus event.  
      **iii.** VF&C reserves the right to amend these terms upon the publication of any peer-reviewed paper introducing a novel dispositional exception (e.g., "Quantum Flutter," "Dispositional Entanglement").  
      **iv.** SOLE REMEDY: Upon valid, non-excluded claim, VF&C may, at its sole discretion, replace the Covered Product with one of *comparable metaphysical uncertainty* or issue a store credit redeemable against future products possessing equally questionable conditional guarantees.  

  **VITRINE FRIABLE & CO.**  
  *By: Esmé Verre, CEO*  
  *(Countersigned: Aethelred Quibble, Esq., Counsel; Dr. Thaddeus Counterfactual, Metaphysical Consultant)*

  ---

  **Note on Parodic Liberties & Contestability (148 words):**

  The parody takes liberties primarily in simplification and conflation. While distinguishing finks (disposition removed *as* stimulus arrives), masks (disposition present, stimulus blocked/interfered with), and antidotes (manifestation process interrupted *after* stimulus), the boundaries are fiercely contested in the literature. The presentation implies cleaner demarcations than exist. The "prevented rather than defeated" clause (Clause 8) leans hardest on caricature, conflating non-occurrence of stimulus (trivially no manifestation) with the core problem cases, arguably misrepresenting the "prevention" vs. "interference" debate. The satire would be unfair if the conditional analysis ("would-if") were defended merely as a useful *heuristic* or *sufficient condition* in *normal* cases, not a reductive definition. If defenders readily concede its failure in exotic cases *without* abandoning dispositions as real properties, the joke misfires by suggesting they dogmatically cling to the simple conditional *definition* itself amidst proliferating exceptions, rather than seeing the exceptions as illuminating the disposition's complexity.
