prompt: |-
  my mate and I had a massive row down the pub about Kripke, of all things, and it ended with him just repeating "water is necessarily H2O, end of" to shut down every hypothetical I tried to raise. I said: imagine chemistry had gone differently and the clear drinkable stuff in rivers turned out to be XYZ, not H2O — and he said that's literally impossible, water just IS H2O, in every possible world. But then in the same breath he admitted it was an empirical discovery and said it "could have turned out otherwise" before we knew any chemistry, which seems to be pulling the other way. Can you disentagle the precise claims that could be hiding in "water is necessarily H2O" — from the trivial tautology reading (if it's H2O, it's H2O) through to strong claims about what fixes the reference of 'water' across possible worlds and what counts as the same stuff in another world? For each reading, say whether it's plausible, whether it's something we could know a priori, and crucially whether it would actually justify using the line to end a argument the way he did. And on whichever reading is the right one: was my XYZ hypothetical coherent, or did I loose the row?
reasoning: |-
