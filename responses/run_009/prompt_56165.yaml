prompt: |-
  I've been trying to work out what I actually believe about advance directives by going with my gut on a bunch of cases, and now I want to know if there's a real principle behind my verdicts or whether I'm just vibing. Here's the set:

  A woman signs a living will: if I ever get advanced dementia with no hope of recovery, no feeding tube, no antibiotics, let me go. Decades later she's deep into it. She's not suffering though -- she's calm, likes music, lights up when her daughter visits, just can't feed herself. My gut: no tube. The directive holds, even though the current her, if you could ask her, would keep living and enjoying things.

  But here's one that pulls the other way. A guy with untreated depression signs a directive refusing resuscitation, telling his brother his life isn't worth living anyway. He then gets treated, is doing well for a few years, glad to be alive, and then comes down with the dementia. The directive kicks in. Gut: don't honor it. And notice it can't just be because the demented him wants to live -- the woman in the first case presumably wants that too and I still say no tube. Something about WHERE the directive came from is doing the work, but I can't say exactly what.

  Psychiatric version: a woman with schizophrenia, lucid at the time, writes an advance directive saying that when she's psychotic, give her the injection whether she fights or not, and that anything she says during an episode doesn't count. She then has an episode and fights the injection hard. Gut: inject. Easy call for me, even though it's the most violent override of a current self on this list.

  Weird one: same as the first case, but instead of a signed document there's nothing on paper. Her daughter just testifies that she said, more than once, "if I turn into one of those people who just sits there smiling at everybody, don't let them keep me alive on machines." Gut: also no tube, only slightly less confidently. Which is odd, because I'd have thought the whole point of formal directives was that informal ones are so much shakier.

  Religious one: a man refuses blood transfusions in his directive, for religious reasons he held all his life. The demented him, asked hypothetically, says sure, do whatever makes me better -- he doesn't really grasp the issue anymore. Gut: honor the refusal. It feels harsh but it feels right.

  And then the one I keep going back and forth on. A woman writes the no-antibiotics directive when dementia means, to her, what it meant in her mother: fear, confusion, hours of screaming. But she turns out to have a different kind of dementia -- sweet, contented, no distress at all. The reason she gave for the directive just doesn't apply to her actual situation, even though the situation falls squarely under the words she wrote. Should the words govern or the reason? My gut here is honestly mush, and I want your help.

  So my tentative principle is something like: the earlier self gets authority over the later one when the later one can't speak to her own settled values anymore, AND the earlier self was speaking from those same settled values rather than from a passing mood or a distorted state. But I'm not sure this handles the case where the daughter's testimony carried almost as much weight as the signed form, and I'm not sure what it says about a directive written in, say, 1970 about "extraordinary measures" when the extraordinary measures of today are ones the writer couldn't have imagined and might well have welcomed.

  Is there one principle that captures all my verdicts? Which ones would it have to overturn? And please tell me what it predicts for a couple of cases I haven't listed -- say, someone whose directive refuses antibiotics but whose dementia is mild enough that she can still coherently discuss her care and insists she's changed her mind about the whole thing. Also happy to hear if you think the whole framework is confused and there's no principled way to do this, only a decision procedure.
reasoning: |-
  Okay, the user is grappling with advance directives and trying to find a consistent ethical principle behind their gut reactions to various scenarios. They've presented several cases where their intuition conflicts or feels inconsistent, especially regarding when an earlier self's decisions should override the current self's preferences. 

  First, I notice the user is deeply thoughtful—they're not just accepting surface-level answers but probing for underlying coherence. Their frustration with their own "mushy" gut feeling on the dementia case shows intellectual honesty. They're clearly someone who cares about ethical consistency, possibly in a professional or academic capacity.

  The core tension they're wrestling with is between two valid ethical concerns: respecting autonomy (via prior instructions) versus preventing harm to a current self who may have different interests. Their proposed principle about "settled values" is perceptive but needs refinement—especially around what makes values "settled."

  Hmm... the cases where they feel strongly (schizophrenia, religious refusal) suggest they prioritize authentic expressions of self over transient states. But the depression case is key: they reject the directive because the depressed self wasn't expressing a stable identity. That implies "authenticity of source" matters more than formal validity.

  The daughter-testimony case is fascinating. Their confidence there undermines the idea that legal formality is essential. It suggests they weight relational evidence—like knowing someone's core beliefs through intimate knowledge—as highly as documents. That's a profound point about how we know another's values.

  For their unsure case (dementia type mismatch), I suspect their hesitation comes from sensing the directive was conditional on suffering, even if the text was categorical. Their gut might want to honor the intent but fears "slippery slope" arguments. The solution could be distinguishing between specific instructions and the values behind them.

  On their hypothetical about mild dementia patients changing their minds—that's easier. Current preferences should dominate if the person can still engage with their values. Advance directives aren't suicide pacts; they're for when you lose coherence.

  The 1970s "extraordinary measures" problem points to a limit of directives: they can't foresee technological change. Here, we'd need proxy decision-makers who channel the person's values, not just their words.

  What they might not have considered: sometimes the conflict isn't between "past vs present self" but between different aspects of a person's identity. The religious case works because faith was his lifelong anchor; the dementia case fails because the suffering he feared never materialized. It's about whether the prior instruction still connects to the current self's reality.

  I should emphasize that their instinct to distinguish transient states (depression) from core identity (religion) is ethically sound. And their discomfort with overriding a contented dementia patient despite a directive? That's the system working—it means they recognize the moral weight of present experience even when autonomy pulls elsewhere.

  Finally, they're right that no principle eliminates hard choices. But we can build frameworks that weight: 1) How representative was the prior decision of the person's enduring self? 2) How irreversible is the outcome? 3) Can the current self meaningfully participate? Their intuitions already map to this.
answer: |-
  Your gut verdicts reveal a remarkably coherent ethical framework centered on **respect for the person's *authentic, stable values*** rather than rigid textual adherence or transient preferences. Let's break this down:

  ### Your Core Principle
  **An advance directive should be honored when it reflects the person's *settled, enduring values* at their most autonomous and lucid state, and the later self lacks the capacity to meaningfully engage with those values.**  
  *Crucial nuance:* The "later self" must be *incapable of reconstituting or revising their core values* (e.g., due to dementia/psychosis), not merely holding different preferences.

  ### Analysis of Your Cases
  1. **Dementia Patient (Calm/Happy):**  
     - *Your verdict:* Honor directive → *No tube.*  
     - *Why it fits:* Her directive reflects a settled value ("dignity > prolonged unconscious existence"). The demented self enjoys sensory pleasures but *cannot grasp the value judgment* underlying her prior choice. Her current state isn't a *reasoned rejection* of her values; it's an *inability to access them*.

  2. **Depressed Patient (Later Treated):**  
     - *Your verdict:* Ignore directive → *Resuscitate.*  
     - *Why it fits:* The directive originated from a *distorted state* (untreated depression), not his authentic values. His later thriving proves the directive was *inauthentic*. Honoring it would enforce a *pathology*, not his true self.

  3. **Schizophrenia Directive:**  
     - *Your verdict:* Honor directive → *Inject.*  
     - *Why it fits:* The directive was made during *lucidity*, reflecting her stable value ("health > autonomy during psychosis"). Her psychotic self *cannot coherently engage* with her values; resisting treatment is a *symptom*, not a considered choice.

  4. **Verbal Directive (Daughter's Testimony):**  
     - *Your verdict:* No tube (slightly less confident).  
     - *Why it fits:* Formality matters less than *reliable evidence of settled values*. Repeated, specific statements to a close family member strongly indicate authentic intent. Slightly less confidence acknowledges *potential ambiguity*, but the *core value* is clear.

  5. **Religious Refusal:**  
     - *Your verdict:* Honor refusal → *No blood.*  
     - *Why it fits:* This reflects a *lifelong, identity-defining value*. The demented self's acquiescence isn't a *value-based choice*; it's confusion. Overriding would violate his deepest self, even if "harmless."

  6. **"Mismatched" Dementia (No Suffering):**  
     - *Your verdict:* Mushy (as it should be!).  
     - *Resolution:* **The directive's underlying *purpose* outweighs its literal text.** Her directive wasn't about dementia *per se*; it was about avoiding *suffering like her mother's*. Since her actual state is peaceful, the *reason* for the directive is absent. *Likely verdict:* **Do not honor the directive.** Forcing death despite contentment betrays her values (which prioritized *avoiding torment*, not existence itself).

  ### Edge Cases & Predictions
  - **Your Mild Dementia Case (changes mind):**  
    *Prediction:* **Do not honor the directive.** If she can *coherently discuss her values* and explain her change of mind ("I now see life with mild impairment as worthwhile"), she retains *decision-making capacity*. Her current self can revise prior instructions.  
    *Exception:* If her dementia clouds her understanding of consequences (e.g., she denies her prognosis), capacity is lost → revert to directive.

  - **1970s "Extraordinary Measures" Directive:**  
    *Prediction:* **Interpret via values, not text.** Would she have wanted *this specific treatment* (e.g., a minimally invasive modern ventilator) if she knew it was now routine, low-burden, and temporary? If her *value* was "avoiding futile, painful prolongation," honor the *spirit*, not the outdated term. If it was "no machines, ever" (e.g., for religious reasons), honor literally.

  ### Where Your Principle Might Overturn Intuition
  - **A directive written during transient distress** (e.g., grief after a spouse's death) refusing future treatment → *Ignore it*, as it doesn't reflect settled values.
  - **A directive demanding *aggressive* treatment** written by a terrified, newly diagnosed patient → *Question it* if inconsistent with lifelong values (e.g., "quality over quantity").

  ### Why This Isn't "Just Vibing"
  Your instincts align with major ethical frameworks:
  - **Autonomy as Authenticity:** Prioritizing decisions tied to the person's *true self* (Dworkin, Frankfurt).
  - **Narrative Identity:** A person is a "story" – the directive holds when the later self *cannot continue the story* (Parfit, Schechtman).
  - **Best Interests (Value-Relative):** Interests are defined by *what the person valued*, not momentary pleasure (Buchanan, Brock).

  ### The Takeaway
  You're wrestling with **when a past self *speaks for* a future incapacitated self**. Your principle works because it focuses on:
  1. **Source Authenticity** (Was the directive from the "real" person?),  
  2. **Value Stability** (Was it a core, enduring belief?),  
  3. **Current Incapacity** (Can the later self meaningfully participate in value-based decisions?).  

  This framework respects persons *over time* without enslaving them to past paperwork. It’s why your gut rejects the depressed man’s directive but honors the schizophrenic woman’s—even when both "override" a current self. **The goal isn't mindless rule-following; it's fidelity to the *person they were and still are*, beneath the illness.** Keep trusting that instinct.
