answer: |-
  As a deflationist, I grant that biologists invoke truth-talk in evolutionary explanations, but I deny this requires truth to be a substantive property. When we say "accurate representers outcompete inaccurate ones," we're using the truth predicate as a device for generalizing over the myriad individual representational states — each with its own specific content — that bear on survival. The causal-explanatory work isn't done by "truth" itself; it’s done by the concrete correspondence (or lack thereof) between each belief-like state and the world. For instance, the belief *that there’s prey in location L* (which we’d call "true" via disquotation) directly guides successful hunting behavior, while the false belief *that there’s no predator nearby* leads to fatal inaction. Selection acts on the *consequences* of these individual content-world relations. The truth predicate merely lets us collectively endorse the vast set of such accurate representations ("these states are true") without itemizing them. The neat alignment with fitness arises because each *specific* correspondence enhances survival, and generalization over these correspondences is all that "tracking truth" amounts to. No further property is needed.
