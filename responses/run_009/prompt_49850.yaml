prompt: |-
  I'm TA-ing an intro metaphysics course, and next week is the problem of universals. My professor keeps insisting the dispute is purely metaphysical with no observational consequences, and I want to test that by constructing a case where it actually matters — something I can bring to section to make the students care. My own idea of a worked answer would help too, since I need to know what a good one looks like before they try.

  Here's the assignment: build a realistic scenario — workplace, insurance, warranty claims, licensing, inventory, nothing science-fictional — where a realist about universals (Armstrong-style: a property is literally one thing, wholly present in each instance) and a resemblance nominalist (there are only particulars, and "sharing a property" just means resembling in a respect) are forced to different practical verdicts, not merely different descriptions of the same verdict. The classic trap is the two red apples: everyone agrees the apples match, and only the metaphysical story differs. I want a case where the metaphysical difference changes a count, a payout, or a yes/no classification — think paying a bonus per "distinct defect" found, or a license that covers "the same design" however many times it's stamped out, but invent your own if you've got something better. The verdicts have to fall out of the theories themselves; you can't just stipulate that a contract uses the phrase "the same property," because a nominalist will happily reinterpret any clause like that. The case has to make one reading genuinely forced.

  After the scenario: walk through each theory's verdict and why, tell me which single feature of the case is doing the work, and what happens if you remove it. Also give the strongest counter from whichever theory comes out looking bad. If you decide the case can't honestly be built, say so and explain where the trick fails — that's a legit answer, my professor would probably love it more than the case itself. Format: a numbered list, exactly five items, each one or two sentences, no intro or conclusion — (1) the scenario, (2) the realist's verdict and why, (3) the nominalist's verdict and why, (4) the feature doing the work and what removing it does, (5) the best comeback from the losing side. Keep the scenario something my students could actually picture happening, no philosophers names inside it.
reasoning: |-
  Okay, the user is a TA for an intro metaphysics course focusing on the problem of universals. They need to create a scenario where the metaphysical stance (realism vs. nominalism) leads to different practical outcomes, not just theoretical differences. The classic example of two red apples isn't enough because both sides agree they match. The challenge is to find a situation where counting or classification changes based on the theory.

  First, I'll brainstorm scenarios involving counts, payouts, or classifications. Warranty claims for defects come to mind. If a bonus is paid per "distinct defect type," that might work. Realists might count universals, while nominalists count resemblance classes. 

  Insurance contexts could work too. For example, licensing fees for "the same design" might differ if universals are considered one entity versus multiple instances. But the user mentioned avoiding contracts with phrases like "the same property" because nominalists could reinterpret them. So the scenario must force the interpretation naturally.

  Inventory systems might help. If items are grouped by type, a realist sees one universal, while a nominalist sees multiple similar items. But that might not lead to a different count. Need a situation where the count affects money or decisions.

  Another idea: a warranty that pays per unique defect found in a batch. If three devices each have a cracked screen, is that one defect type or three? Realist: one universal defect, so one payout. Nominalist: three distinct defects (each crack is a particular), so three payouts. That could work. The key is the wording: "distinct defect" might be ambiguous. But if the contract defines payout per unique defect type, that might force the issue.

  Refining the scenario. Let's say a warranty contract for smartphones pays $100 per distinct defect type found across a batch. Three phones have identical screen cracks. Realist: one universal (cracked screen), so $100 total. Nominalist: each crack is a particular, but they resemble, so they form a resemblance class. But does "distinct defect" refer to the class or the instances? If the contract specifies "per unique defect type," nominalist might still see one class. Problem: both might agree on one type.

  Need to make the nominalist count multiple. How? If the defects are in different locations or have slight variations. But the user wants no observational differences. So identical defects. But if the defects are identical, nominalists might still consider them the same type via resemblance. Unless... the contract pays per defect instance, not type. But that's not about universals vs particulars.

  Alternative: a licensing agreement where a fee is paid per "distinct design feature." If a feature is copied exactly, realist sees one universal, nominalist sees multiple copies. But again, counting instances vs types.

  Perhaps a quality control bonus for workers who identify distinct defects. If two defects are identical, realist counts one, nominalist? They might count two instances but one class. But the bonus is per distinct defect found, which could be ambiguous. The key is how "distinct" is interpreted. Realist: distinct universals. Nominalist: distinct particulars. But identical particulars are still distinct numerically. So nominalist would count each instance, while realist counts the universal once. That could work if the payout is per distinct defect, meaning per occurrence. But the scenario must force a different count without stipulating terms.

  Let's construct the scenario: "A factory warranty pays $100 per distinct defect discovered during inspection. Three identical smartphones each exhibit an indistinguishable screen crack."

  Realist verdict: $100 total (one universal defect, "cracked screen," wholly present in each phone). One distinct defect type.

  Nominalist verdict: $300 (three distinct particular defects, each numerically distinct, despite resembling each other). The defects are distinct particulars, so each counts.

  The feature doing the work: The phrase "per distinct defect" can be read as per distinct type (realist) or per distinct instance (nominalist). Removing the word "distinct" or clarifying "type" vs "instance" removes ambiguity.

  Counter from nominalist: The contract likely intends payment per defect found (per instance), as each requires repair. Universals don't need repair; particulars do.

  Counter from realist: "Defect" in warranty contexts refers to types, not tokens, to avoid multiple claims for the same issue.

  This seems viable. The key is the ambiguity in "distinct defect" without specification. Realist focuses on the property shared, nominalist on the individual occurrences.
answer: |-
  **(1) Scenario:** A warranty contract for a batch of identical smartphones pays $100 per "distinct defect" discovered during inspection. Three phones each exhibit an indistinguishable screen crack (same location, appearance, cause).  

  **(2) Realist verdict:** $100 total payout. The crack is one universal (defect-type) wholly present in each phone, so only one "distinct defect" exists across all instances.  

  **(3) Nominalist verdict:** $300 total payout. Each crack is a distinct particular defect; resemblance groups them under "screen crack," but the contract counts numerically distinct defects, not resemblance classes.  

  **(4) Key feature:** The phrase "per distinct defect" without specifying "type" or "instance." Removing "distinct" (e.g., "per defect found") forces both to count three cracks, removing the divergence.  

  **(5) Nominalist comeback:** Contracts target concrete repairs (each crack costs $100 to fix), not abstractions; "distinct" here naturally means distinct occurrences, not types.
