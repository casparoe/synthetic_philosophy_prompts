prompt: |-
  I write about science and ideas for a mid-size outlet — mostly climate coverage, food systems, the psychology of why people do or don't change habits — and I've gotten genuinely stuck on my own gut reactions to a bunch of everyday cases. So I figured I'd lay out my verdicts and ask whether there's actually a principle underneath them or whether I'm just running on vibes I absorbed from whichever PSA was playing when I was twelve.

  My verdicts on when one person's contribution to a big collective outcome matters:

  1. Not voting in a national election when I live in a state that goes the same way every cycle by a million votes: I feel like a bit of a jerk, and I think I actually did something wrong. My one vote had essentially zero chance of mattering and I still think skipping it is wrong.

  2. Eating a chicken burrito: makes no moral difference. The bird's already dead, one burrito doesn't move the number of chickens raised, and I genuinely don't feel bad.

  3. Taking a weekend flight to see a friend: I keep not doing it, and feeling vaguely guilty when I do, even though one flight changes the climate exactly as much as my burrito changed the chicken industry — i.e., nothing you could point to.

  4. Boycotting a company over how it treats warehouse workers: I do it, on principle I guess, but I can't for the life of me expalin how this differs from the burrito case. Same structure — my few dollars vanish into a revenue stream of billions.

  5. Donating blood: I go every few months, and I'd tell you it matters, even though I have no idea whether my type is ever actually short at the bank.

  6. Picking up a piece of trash on a trail that isn't mine: obviously yes, doing your bit, and I'd quietly judge someone who walked past it.

  And the one I keep going back and forth on: at work events there's always leftover catered food, some of it meat, and it gets tossed if nobody eats it. A leftover pulled pork sandwich from an order that was placed and paid for weeks ago moves demand not at all — even the "your burrito might cross some invisible reorder threshold and trigger a shipment of 100 more birds" story doesn't apply, which is the only story I've ever heard for why a single purchase could matter at all. So if my "no difference" verdict on the burrito is right, the leftover sandwich should be covered even more strongly. And yet it feels different, and I lose the thread trying to say why.

  Is there a principle that gets all six verdicts, or close? My guess is there are at least two live candidates: something like "be a participant in the collective practice you'd want everyone to be part of," which makes skipping the vote, the boycott, the blood, and the trash pickup all wrong — but then makes the burrito wrong too, which I don't accept; versus something like "only discrete threshold-crossing effects count," which saves the burrito but sinks the flight, the vote, and honestly the boycott. So tell me: which of my verdicts have to go, what the surviving principle says about the leftover sandwich, and what it predicts on some case I haven't listed here.

  Two requests. First, if you think my list is just incoherent and there's nothing under it — no principle, just a pile of vibes — say that plainly instead of constructing a clever theory to dignify it. Second, if you think the reorder-threshold idea I half-remembered is wrong, or doesn't do the work I'm assigning it, push on that too. I'd rather be told I'm confused than be told something smooth.
reasoning: |-
  Okay, let me try to unpack this user's dilemma. They're a science writer focusing on climate, food systems, and behavior change, and they're grappling with ethical inconsistencies in their own reactions to everyday choices. The core issue seems to be: why do some individual actions feel morally significant despite negligible impact, while others don't? 

  First, I notice the user is intellectually honest—they admit their contradictions and explicitly request no "smooth" answers. That's refreshing. Their examples are well-chosen because they all involve collective action problems but trigger different intuitions. 

  Hmm... what's really smart here is how they've pre-emptively dismantled two obvious frameworks: participation ethics ("be part of the solution") and threshold ethics ("only measurable effects matter"). Both fail to explain why the burrito feels neutral but skipping voting feels wrong. 

  The blood donation case is particularly interesting because it highlights intent vs. impact. Even if their blood type isn't urgently needed, the act feels meaningful because it's framed as a direct contribution to a life-saving system. Whereas with the burrito, they're embedded in a system they find ethically problematic but feel powerless to affect. 

  Ah! And the leftover sandwich dilemma is genius—it exposes a flaw in their own reasoning. If wasted food has zero demand effect, why does eating it feel different than buying a new burrito? I suspect this taps into disgust/taboo psychology more than ethics. 

  What they might really be circling is Scanlon's contractualism: actions are wrong if they couldn't be justified to others in a system where everyone acts that way. That would explain voting (if everyone skipped, democracy collapses) and litter (if everyone left trash, trails are ruined). But it still doesn't resolve the sandwich paradox—if everyone ate wasted meat, wouldn't that reduce food waste? 

  ...Unless the issue is symbolic. Eating the sandwich normalizes meat consumption, whereas rescuing it from waste is neutral. But the user explicitly rejects symbolism in the boycott case! 

  This is messy. Maybe their intuitions are tracking multiple dimensions: 
  1. Systemic harm potential (voting) 
  2. Direct causal chains (blood donation) 
  3. Social signaling (litter) 
  4. Complicity (boycott) 
  5. Futility (flight) 

  For the sandwich, I'd argue complicity applies—eating meat you bought feels like endorsing the industry, while eating waste feels like harm reduction. But they might counter that this is emotional, not logical. 

  Ultimately, their "vibes" might reflect learned community norms rather than ethics. Voting and blood donation are socially celebrated duties; flights are climate-shamed; burritos are culturally neutral. The sandwich? Possibly triggering because food waste feels viscerally wrong while meat eating doesn't. 

  I should tell them their contradictions are valid—these cases operate on different ethical wavelengths. The unifying thread might simply be: "Does this action feel like it perpetuates a broken system?" For the sandwich, that depends whether you see the system as industrial meat (bad) or food waste (bad). No wonder they're stuck.
answer: |-
  Your verdicts aren't incoherent—they reveal a tension between two ethical frameworks fighting for dominance in your reasoning: **Participatory Ethics** (actions matter as participation in systems/practices) and **Consequentialist Threshold Ethics** (actions only matter if they cross a measurable impact threshold). Neither fully explains your list, but **Participatory Ethics** does most of the heavy lifting—with one critical caveat about emotional salience.

  Here's the breakdown:

  ---

  ### **The Principle: "Participatory Complicity"**
  **Core Idea**: An action matters when it *makes you a participant* in a harmful system or a defector from a beneficial collective practice—regardless of measurable individual impact. What triggers your judgment isn't the outcome, but **your relationship to the system**. Key factors:
  - **Visibility**: Does the action feel like a direct endorsement/defection?
  - **Social Reinforcement**: Does the practice rely on widespread participation?
  - **Psychological Complicity**: Does it *feel* like joining the "wrong side"?

  ### **Your Cases Revisited**
  1. **Not Voting**  
     - ✅ **Participatory Ethics**: Defecting from a core civic practice erodes collective trust. Your absence *feels* like abandoning a shared duty.  
     - ❌ Threshold Ethics: Your vote won’t swing the election.  
     *Verdict survives: You’re rejecting your role in democracy.*

  2. **Eating a Chicken Burrito**  
     - ✅ **Threshold Ethics**: Your purchase likely doesn’t cross a reorder threshold (more on this later).  
     - ❌ Participatory Ethics: Buying meat *feels* like routine consumption, not active endorsement. It’s normalized.  
     *Verdict survives: No complicity signal.*

  3. **Taking a Weekend Flight**  
     - ✅ **Participatory Ethics**: Flying *feels* like actively choosing to harm the climate. You’re visibly joining a high-impact system.  
     - ❌ Threshold Ethics: Your emissions are negligible globally.  
     *Verdict survives: Complicity in a destructive system is salient.*

  4. **Boycotting a Company**  
     - ✅ **Participatory Ethics**: Spending money = direct endorsement. Boycotting = refusing to be complicit, even if ineffective.  
     - ❌ Threshold Ethics: Your dollars won’t affect a billion-dollar revenue stream.  
     *Verdict survives: You’re rejecting participation in exploitation.*

  5. **Donating Blood**  
     - ✅ **Participatory Ethics**: You’re directly contributing to a lifesaving system. It feels like active solidarity.  
     - ❌ Threshold Ethics: Your blood might expire unused.  
     *Verdict survives: Participation in a virtuous system matters.*

  6. **Picking Up Trash**  
     - ✅ **Participatory Ethics**: Failing to act = defecting from a shared norm of stewardship. Doing it = reinforcing cooperation.  
     - ❌ Threshold Ethics: One piece won’t clean the trail.  
     *Verdict survives: You’re upholding a collective good.*

  ---

  ### **The Leftover Sandwich Test**
  - **Threshold Ethics**: Eating it has *zero* demand effect—no reorder threshold, no moral difference from abstaining.  
  - **Participatory Ethics**: Eating wasted meat **shouldn’t** feel wrong—it doesn’t incentivize production or endorse the system. It’s harm reduction.  
  - **Your Vibe Check**: If it *still* feels different, it’s likely **disgust/avoidance of symbolic contamination**. The sandwich represents industrial meat’s harm, even though eating it changes nothing. This isn’t logical, but it’s psychologically real (see: studies on "purity" in moral psychology).  
  - **Verdict**: Your principle says **eat the sandwich guilt-free**, but your emotions might rebel. That’s okay—it just means your intuitions aren’t perfectly aligned with your ethics.

  ---

  ### **Why the "Reorder Threshold" is Overrated**
  - **It’s theoretically possible but practically undetectable**. A single burrito *might* tip a warehouse into restocking slightly sooner, but:
     - Supply chains buffer small fluctuations (e.g., bulk orders, inventory management).
     - Attribution is impossible—you can’t know if *your* purchase crossed a threshold.
  - **Worse**: If thresholds mattered, buying *one less* burrito might prevent a restock, but buying *one more* likely wouldn’t trigger one. This asymmetry makes Threshold Ethics paralyzing (e.g., "I can do harm by acting but not prevent it by abstaining").  
  - **Conclusion**: Thresholds can’t explain your verdicts—they’re too speculative to drive real-world moral choices.

  ---

  ### **Which Verdicts Must Go?**
  - **The Flight**: If you’re consistent, either the flight is fine (like the burrito) or the burrito is bad (like the flight). **Participatory Ethics** demands you condemn both or neither.  
    - *Solution*: Admit the flight’s guilt is emotional (complicity feels acute for high-carbon acts). Or accept that buying meat *should* feel worse if you’re consistent.  
  - **Burrito vs. Boycott**: They *are* structurally identical. Your different verdicts reveal that **emotional salience** (e.g., warehouse suffering vs. abstract chicken) is doing covert work.

  ---

  ### **Prediction for a New Case**
  **Case**: Buying a single fast-fashion T-shirt.  
  - **Participatory Ethics Prediction**: You’d feel guilty. You’re directly funding exploitative labor, even if your $8 changes nothing.  
  - **Threshold Ethics Prediction**: No guilt—no single purchase affects production.  
  - **Likely Verdict**: Guilt wins. It *feels* like joining an evil system.

  ---

  ### **The Real Takeaway**
  You’re running on **Participatory Ethics** blended with **emotional salience**. Your verdicts aren’t vibes—they’re a legitimate, psychologically human response to systemic problems. But to be consistent, you must either:  
  1. **Embrace Participatory Ethics fully** (condemn burritos and flights), or  
  2. **Acknowledge that emotional salience (visibility, symbolism, disgust) is doing unspoken work** in cases like the flight or sandwich.  

  The leftover sandwich? **Principle says eat it.** Your gut might disagree. That’s the friction between moral logic and moral emotion—and it’s why writing about this stuff matters.
