prompt: |-
  My roommate and I have been going back and forth about whether things still have the powers we credit them with when something's standing in the way, and I wrote down my gut verdicts, and now I want to know if there's a real principle behind them or if I'm just improvising.

  - A wine glass wrapped in three layers of bubble wrap, inside a box, on the top shelf: fragile. Obviously.
  - A book of matches that got soaked in the rain: still flammable. Wet, sure, but flammable.
  - A viper at the zoo, behind glass, nowhere near any prey: venomous. Yes.
  - A bridge engineered so that if any one support cracked, the load would shift to the others and nothing would happen: NOT fragile, even though its supports could crack. That one's engineering, not bubble wrap, but I can't quite say why the difference matters.
  - My uncle, who used to have a terrible temper, but after years of training, whenever something would set him off the training kicks in first and he goes calm instead: not hot-tempered anymore? But the glass in the bubble wrap is still fragile, and the uncle case looks structurally the same, so something has to give.
  - A poison slipped into a cup, where the intended victim happens to take a daily antidote that neutralizes exactly that poison: I keep flip-floping. Part of me says still deadly, it's the same poison. Part of me says if it can't kill anyone, calling it deadly is weird.
  - A friend who would absolutely betray me for a million dollars, though nobody's ever offered: disloyal. I feel this one strongly even though it's all about what he'd do, not what he does.

  My tentative principle was the simple conditional thing: a thing is disposed to do M in circumstances C iff, were it in C, it would M — if the glass were struck it would break, and so on. That seems to flunk half my list, so I want it tested against the cases and repaired if it can be. I know the dispositions literature has terms like 'finks' and 'masks' (the bubble wrap masks the fragility? or does it?) and you're welcome to use that machinery if it helps, but explain it as you go, don't just name-drop. So: what's the principle, or the small set of candidate principles, which of my verdicts does the best one have to throw out, and what does it predict for two cases I haven't decided? First, a poison whose victim would take the antidote only if she learned she'd been poisoned — does the order of events change anything? Second, a fragile sticker on the glass that makes everyone who sees it handle it gently.

  Last thing: where the metaphysics is settled versus genuinely fought over, flag it clearly. I don't want to walk away thinking there's a consensus account when the people who work on this are still arguing about whether dispositions reduce to conditionals at all, and I'd rather know which parts of your answer are the minority report.
reasoning: |-
  Okay, the user and their roommate are debating whether objects retain their inherent properties when something prevents those properties from manifesting. The user listed several examples and is looking for a consistent principle to explain their intuitions. Let's start by breaking down each case.

  First, the wine glass in bubble wrap is still fragile. Even though the wrap prevents breaking, the glass's inherent brittleness remains. Similarly, the wet matches are still flammable because their chemical nature hasn't changed; they just need drying. The viper behind glass is venomous because its biology includes venom glands. These cases suggest that intrinsic properties persist despite external barriers.

  The bridge engineered with fail-safes isn't fragile. Here, the design prevents failure even if a support cracks, so the structure itself isn't fragile. This contrasts with the bubble wrap case because the fragility is designed out, not just masked. The uncle with controlled temper is tricky. The user thinks he's no longer hot-tempered because his training changes his intrinsic responses. Unlike the glass, the uncle's disposition is altered internally.

  The poison with an antidote is ambiguous. If the antidote is always present, the poison can't kill, so maybe it's not deadly. But if the antidote is only taken after poisoning, the poison's lethality is masked. The friend who would betray for money is disloyal because the disposition exists, even if untested.

  The user's initial conditional approach (if C, then M) works for some cases but fails with masks. For example, the wrapped glass would break without the wrap, but the condition includes the wrap. So the conditional needs to specify ideal conditions. 

  Now, the two additional cases: the poison where the victim takes the antidote only after learning they're poisoned. The order matters. If she takes the antidote promptly, the poison's deadliness is masked, but its intrinsic property remains. The sticker on the glass makes people handle it gently, so the fragility isn't tested. But the glass is still fragile because if handled roughly, it would break.

  The key is distinguishing between intrinsic dispositions and extrinsic masks. Fragility, flammability, venomousness are intrinsic and persist. The bridge's safety is intrinsic design. The uncle's training changes his intrinsic disposition. The antidote case depends on whether the mask is permanent. 

  In dispositional metaphysics, there's debate about whether dispositions reduce to conditionals. Some argue for causal bases or categorical properties. The user should know that while masks and finks are accepted, the underlying nature of dispositions is contested.
answer: |-
  Your intuitions reveal deep fault lines in dispositional metaphysics—namely, how intrinsic properties relate to extrinsic interference. Your conditional analysis ("if C, it would M") is a classic starting point but fails against **masks** (blocking manifestations) and **finks** (altering the disposition itself). Below, I synthesize a principled framework, test it against your cases, flag controversies, and resolve your open questions.

  ---

  ### **Core Principle: Intrinsic Causal Basis + Ideal Conditions**
  A thing has disposition **D** (to manifest **M** in triggering circumstance **C**) **iff**:
  1. **Intrinsic Basis**: It possesses *categorical properties* (physical structure) that ground **D** *independently of current impediments*.
  2. **Ideal Trigger**: **M** would occur in **C** *if*:
     - No **masking** (external blockers exist but don't alter the basis).
     - No **finking** (the basis isn't destroyed/disabled *during* **C**).
     - **C** is *minimally sufficient* to trigger **M** (no irrelevant factors).

  This rejects pure conditionals (e.g., Lewis) in favor of a "causal basis" view (Prior/Pargetter/Jackson). Dispositions *supervene* on structure but require ideal conditions for manifestation. Consensus ends here—realism about dispositions vs. reductionism remains hotly contested.

  ---

  ### **Your Cases Analyzed**
  | Case                          | Your Verdict | Principle's Verdict | Key Reasoning                                                                 |
  |-------------------------------|--------------|---------------------|-------------------------------------------------------------------------------|
  | **Wine glass (bubble wrap)**  | Fragile      | **Fragile**         | Intrinsic basis (brittle silica) intact. Bubble wrap is a **mask** (extrinsic blocker). |
  | **Wet matches**               | Flammable    | **Flammable**       | Chemical basis (phosphorus) unchanged. Water is a **mask**. Dries out → ignites. |
  | **Viper behind glass**        | Venomous     | **Venomous**        | Biological basis (venom glands) present. Glass is a **mask** against envenomation. |
  | **Engineered bridge**         | NOT fragile  | **NOT fragile**     | No intrinsic fragility! Design removes brittle structure. *No basis* for fragility. |
  | **Uncle with training**       | NOT hot-tempered | **NOT hot-tempered**| Training *alters neurophysiology* → **finks** the disposition. Basis destroyed. |
  | **Poison + antidote**         | Flip-flops   | **Deadly**          | Intrinsic toxicity intact. Antidote is a **mask**. (If antidote is *always* present, it becomes a **fink**—see below.) |
  | **Friend for $1M**            | Disloyal     | **Disloyal**        | Basis: stable character traits. Absence of offer ≠ mask/fink. *Would* betray in **C**. |

  **Why the uncle ≠ the glass**:  
  Training *eliminates the causal basis* (like the bridge’s engineering). Bubble wrap merely *shields* the glass’s basis. Tempers are neurally realized—alter the brain, alter the disposition. Glass structure is unchanged.

  **Why poison is deadly**:  
  Its molecular structure grounds toxicity. Antidote doesn’t destroy poison; it *counteracts effects* (mask). If the antidote were *pre-administered* (e.g., in victim’s bloodstream), it becomes a **fink**: poison enters body → antidote immediately neutralizes it → disposition "finks" away mid-trigger.

  ---

  ### **Your Open Cases Resolved**
  1. **Poison where victim takes antidote ONLY if she learns she’s poisoned**:  
     - **Verdict: Still deadly**.  
     - Why: The poison’s causal basis is unchanged. Her *learning* is extrinsic to the poison’s properties. Antidote remains a **mask**.  
     - Order matters: If she *always* learns and takes antidote *before* poisoning manifests, it becomes a **fink**—disposition interrupted mid-process.

  2. **"Fragile" sticker making everyone handle glass gently**:  
     - **Verdict: Fragile** (but never manifests).  
     - Why: Sticker is a **mask** (social blocker). The glass *would* break if struck, but the sticker prevents strikes. Basis intact.  
     - Contrast: If the sticker *reinforced the glass* (changing its structure), it would **fink** fragility.

  ---

  ### **Where Metaphysics Fights**
  - **Realism vs. Reductionism**:  
    - **Realists** (e.g., Mumford, Bird): Dispositions are irreducible, fundamental properties. Your "intrinsic basis" is primitive.  
    - **Reductionists** (e.g., Lewis, Ryle): Dispositions *just are* conditional statements ("if C, then M"). They reject "causal basis" as metaphysical baggage.  
    *(Your principle leans realist—majority view post-2000, but reductionists push back.)*  
  - **Masks vs. Finks**:  
    - **Masks** (external interference) are uncontroversial.  
    - **Finks** (disposition vanishes *during* trigger) are debated. Some argue finks show conditionals fail (Martin); others refine conditionals (Lewis’s "reforming" analysis).  
  - **Antidote Cases**:  
    Philosophers split on whether masks/finks require dispositions to be "always manifestable" (Choi). No consensus.

  ---

  ### **Repaired Principle vs. Your Gut**
  Your verdicts were **100% aligned** with the intrinsic-basis principle—even the poison flip-flop (it *is* deadly, but masking confuses intuitions). The conditional analysis ("if C, M") fails because:
  - Glass: *With bubble wrap*, "if struck, breaks" is **false**.  
  - Uncle: *With training*, "if provoked, rages" is **false**.  

  The fix: **Dispositions persist if their *causal basis* exists *and* would manifest in *ideal* (unmasked, unfinked) conditions.** This saves your judgments without improvisation.

  ---
  ### **Final Summary**
  - **What holds**: Dispositions survive masks (bubble wrap, antidotes) if intrinsic basis exists.  
  - **What breaks**: Dispositions die if basis is destroyed (training, engineering) or finked.  
  - **Unsettled**: Whether dispositions *are* their bases (realism) or are conditionals (reductionism).  
  - **Your strength**: You intuitively distinguish **structural properties** (fragile glass) from **relational contingencies** (antidotes). That’s the core insight.

  If you want to dive deeper, read Mumford’s *Dispositions* (1998) for realism, or Lewis’s "Finkish Dispositions" (1997) for conditional refinements. Your roommate owes you a drink for this.
