prompt: |-
  My roommate read Parfit's Reasons and Persons over the summer and now survival cases come up at basically every dinner. I've started writing down her verdicts because I want to predict her on a new case before she's made up her mind on it. So far her track record: standard teletransporter (you're scanned, destroyed, replica wakes up on Mars with all your memories) — she says that's survival, and that it has everything that matters, not just some watered-down version of it. Gradual replacement of your neurons with silicon chips one at a time — survival, and she thinks it's not even a hard case. But a freak case where a random quantum fluctuation produces an exact duplicate of your brain on Alpha Centauri with no causal link to you at all — no survival, she's super firm on that, the lack of any connection between the two kills it for her. The machine malfunctioning and producing two identical copies of you — survival, she says both of them have everything that matters even though neither one is strictly "the" original her. And a person in late-stage dementia whose memories and personality are mostly gone, body still alive — she says what matters does not survive, even though the biological organism obviously does.

  The new case we're going to fight about next week: the machine scans your brain and transmits the data, but there's a data error and the replica on Mars gets built from a backup copy of a scan taken ten years ago, before a decade where you changed a lot (career change, marriage, new friends, whatever). So the person who wakes up on Mars is psychologically continuous with your ten-years-ago self, and causally downstream from that scan, but they share relatively little with who you are today — and then the present-day you gets destroyed as usual. Before we have this argument I want to know what I'm working with: what verdict is she likely to give, what rule (or rules) is she actually running from those earlier verdicts — something like "psychological continuity with the right kind of causal chain," versus "enough overlap with your current psychology," versus something else entirely — and which of those rules disagree about the backup case. And if you were going to design a single new case to hand her that would most cleanly separate the candidate rules, what would it be? She'll smell it if I'm just reciting Parfit at her btw, she hates that.
reasoning: |-
  Okay, the user is dealing with their roommate who's really into Parfit's philosophy, especially survival cases. They've been noting down her verdicts on different scenarios and now have a new case to predict. Let me start by understanding the roommate's existing responses.

  First, the standard teletransporter: she says survival, with everything that matters. That suggests she values psychological continuity via a reliable causal process. The destruction of the original doesn't bother her as long as the replica has her memories and identity.

  Next, gradual neuron replacement: survival, not a hard case. This aligns with Parfit's view where continuity isn't disrupted if changes are gradual. She's comfortable with the Ship of Theseus idea here.

  Quantum duplicate with no causal link: no survival. The absence of any connection is a dealbreaker. So causal history is crucial for her, not just identical states.

  Duplication case: both copies survive. Even though there are two, each has psychological continuity and causal connection, so both are valid continuations. She's okay with branching identities.

  Dementia patient: no survival of what matters. Psychological continuity is broken despite the body surviving. So psychological connectedness is key, not biological life.

  Now the new case: teletransporter uses a 10-year-old backup. The replica is based on an old scan, so psychological continuity is with the past self, not the present. The present self is destroyed. The user wants to predict the roommate's verdict and understand her underlying rules.

  Looking at her previous answers, psychological continuity with causal connection seems essential. But in this case, the replica is causally connected to the old scan, not the current self. The current self's experiences from the last decade aren't in the replica. Since she rejected the quantum duplicate due to lack of causal link, here the causal link exists but to an older version. However, the current self's psychological state isn't preserved. 

  In the dementia case, loss of psychological traits meant no survival. Similarly, here the replica lacks recent psychological changes. So she might say no survival because the replica doesn't reflect her current psychology. But she accepted duplication where both copies had the current psyche. The issue here is the outdated psyche. 

  Her rules seem to be: survival requires (1) psychological continuity (overlapping memories/traits) and (2) appropriate causal chain. In the backup case, condition (1) is weak because the replica is missing ten years of development. The causal chain is there but linked to the past self. Since she emphasized current psychology in dementia and duplication, the lack of recent continuity might lead her to say "no survival."

  To separate the rules, a test case could involve a causal link without psychological overlap. For example, a replica built from an old scan but with the current self's memories implanted via a separate process. If she accepts that, causal chain is primary. If not, psychological overlap is key.

  Another test: a replica with the current psyche but no direct causal link, like a reconstructed duplicate from external data. If she rejects it, causality is crucial; if accepts, psychology matters more.

  The user also needs to avoid sounding like Parfit. So framing the test case as a new scenario without referencing philosophy would work better.
answer: |-
  Based on your roommate's previous verdicts, here's a breakdown of her likely rule, the predicted verdict for the backup case, how the rules disagree, and a designed test case:

  ### 1. Her Likely Rule
  Your roommate is running a **"Causal-Relational Psychological Continuity"** rule with a **strong emphasis on *current* psychological connections**:
  *   **Causal Chain is Necessary:** She rejects the quantum duplicate due to the lack of *any* causal link. The process creating the successor must be caused *by* the original person's psychological states (scanning, copying, gradual replacement).
  *   **Psychological Continuity is Necessary:** She rejects the dementia case because psychological connectedness (memories, personality, traits) is broken, even though the body persists.
  *   **Relational Overlap > Identity:** She accepts duplication (two copies) because *each* copy has strong psychological continuity *with the original* and is causally downstream. Identity doesn't matter; the *relation* of continuity does.
  *   **Current Psychology is Paramount:** Crucially, the continuity she values is with the *current* psychological state. The teletransporter and duplication cases preserve the *present* self. Gradual replacement maintains a *continuous link* to the present state. The quantum duplicate lacks the causal link *to the current self*. The dementia patient has lost connection *to their past/current self*.

  **In short:** Survival occurs if a causally produced successor bears a sufficiently strong psychological connection *to the person you are right now*. It's not just *any* causal chain or *any* psychological continuity – it's causal continuity *of your current psychology*.

  ### 2. Predicted Verdict for the Backup Case: **No Survival**
  *   **Why?** The replica on Mars *is* causally downstream from a scan (the 10-year-old one). It has psychological continuity, but **not with the *current* self** that walked into the machine. That continuity is with a past self.
  *   The replica lacks the last decade of psychological development (career change, marriage, new friends/memories, changed perspectives). From the *current* self's perspective, waking up on Mars would mean being a drastically different person missing 10 years of life.
  *   **Analogy to her previous verdicts:**
      *   Like the dementia case, the *current* psychology is lost. The replica doesn't have "everything that matters" *to the person who was just scanned and destroyed*. What matters to the present self is the continuation of *their* specific, current mentality.
      *   Unlike the duplication case, the replica isn't a continuation of the *current* self; it's a continuation of a *past* self, accidentally activated after the current self's death.
      *   The causal chain exists, but it's linked to the wrong temporal stage of the person. The causal link needs to trace back to the *present* psychological state for survival of the present self.

  ### 3. How Different Rules Disagree on the Backup Case
  *   **Pure Causal Chain (ignoring psychology):** Would say *survival*. There *is* a causal link from the original organism (via the old scan). (She rejects this, based on dementia case).
  *   **Pure Psychological Overlap (ignoring cause):** Would say *no survival* (low overlap with current self). (She likely agrees on this point, but her rejection of the quantum duplicate shows overlap alone isn't sufficient).
  *   **Causal-Relational (her rule):** **No survival.** The causal chain doesn't sustain the *current* psychology.
  *   **Stage-Based Continuity (closer to Parfit):** Might be ambiguous. The replica is a survivor of the person 10 years ago. The current self dies. Whether "what matters" survives depends on if one identifies with the earlier stage enough. (Her firmness on the quantum duplicate and dementia suggests she focuses strongly on the *present* stage).

  ### 4. The Perfect Test Case to Separate the Rules
  **The "Amnesiac Reconstruction" Case:**

  > A machine scans your brain perfectly, recording your *current* psychology. Simultaneously, you suffer a freak accident causing total, irreversible amnesia and complete personality change – you lose all memories, traits, and preferences, becoming a fundamentally different person (Person B) in the same body. Immediately after this accident, the machine uses its *scan taken moments before the accident* to create a perfect replica (Person R) on Mars from new matter. Person B (the amnesiac in your original body) continues to live. Person R wakes up on Mars with all your pre-accident memories and personality intact.

  **What This Tests:**

  *   **Your Roommate's Rule (Causal-Relational w/ Current Psyche Focus):**
      *   **Person B:** Has the causal chain (same body), but **no psychological continuity** with the pre-scan self. Verdict: **No Survival** of the original person. (Like dementia).
      *   **Person R:** Has **psychological continuity** with the pre-scan self and a **causal chain** (from the scan). Verdict: **Survival.** *This is the critical point.* The causal chain *is* linked to the *current* psychology at the time of the scan, even though the original body changed radically right after. The replica preserves the self that existed at the moment of scanning.
  *   **Pure Causal Chain Rule:** Person B survives (same body/cause). Person R does not survive (new matter, no body continuity).
  *   **Pure Psychological Overlap Rule:** Person R survives (high overlap). Person B does not (no overlap).
  *   **Body/Organism Rule:** Only Person B survives.

  **Why it separates the rules cleanly:**
  1.  It directly forces a choice between causal continuity of the body (Person B) and causal continuity of the *preserved psychology* (Person R).
  2.  It isolates the role of the causal chain *specifically for preserving psychology*, decoupling it from the original body's fate immediately after the scan.
  3.  It tests the commitment to "current psychology at the moment of the causal event" (the scan). Person R embodies the psychology that was current *at the moment the causal chain preserving it began*.
  4.  It avoids obvious Parfit parallels (like fission or duplication) and feels like a novel puzzle.

  **How to present it:** Frame it as a weird sci-fi medical/accident scenario. "Okay, imagine this creepy timing coincidence..." Focus on the timing of the scan vs. the accident. Her reaction to Person R will be very telling – if she hesitates or accepts Person R survives, it strongly confirms her rule requires the causal chain to preserve the *current* psychology, even if the original body diverges. If she rejects Person R surviving, it might suggest a stricter bodily or "no branching" requirement (though the duplication case makes this less likely). This case will pinpoint whether her "causal chain" requirement is primarily in service of preserving the *current psychological state*.

  Good luck with the dinner debate! Remember to frame the Amnesiac Reconstruction case as a spontaneous thought experiment, not a Parfitian gotcha. The backup case prediction should give you a solid starting point for the argument.
