prompt: |-
  I'm a second-year philosophy student who runs the peer-assisted learning sessions attached to our first-year Metaphysics course, and next week I have fifty minutes with a group of about ten to cover Parfit on the teletransporter and what matters in survival. I don't want a summary of the material; I want a plan for the session. What has to be put in place before the thought experiment can do any work at all — presumably something about what we ordinarily assume survival requires — and in what order should the cases come? I suspect I shouldn't open with the teletransporter itself, because several of the group will have met it through popular coverage of mind-uploading startups and will arrive with an answer ('it's just a copy') rather than the question. Would it be better to begin with a variant where the machine records and transmits but does not destroy the original, so that the questions 'is the person on Mars me?' and 'did I survive?' come apart before the harder case is on the table? As for misconceptions: I anticipate the group thinking that psychological continuity just means having the same memories (so that dementia becomes a kind of gradual death), that Parfit is denying the copy matters at all, and that his claim that identity is not what matters is somehow a claim about the word 'same'. Tell me at which point in the sequence each of these is best headed off, and whether I've missed a predictable one. I also can't decide whether the fission case — two receivers, two equally good candidates — belongs in this session or should be held back for the following week: on the one hand it seems to be where Parfit's argument actually bites; on the other it may overload fifty minutes. Advise me, and give me one question I could ask at the end whose answer would reveal whether they have grasped that Parfit's conclusion is about what matters rather than about the meaning of 'same person'. Finally, what should I openly decline to settle, and say so?
