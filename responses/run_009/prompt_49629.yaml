  Hmm... their instinct about not starting with the standard teletransporter is smart. Those coming from mind-uploading discourse will indeed have the "it's just a copy" reflex. The duplicate-first approach they suggested is perfect - it forces separation between "is it me?" and "does it matter?" early on. 

  The misconceptions they listed are spot-on. The memory=dementia one is particularly crucial to address since it collapses psychological continuity into one narrow feature. Need to explicitly broaden it to include intentions, dispositions, etc. during the discussion of psychological criteria. 

  For fission... 50 minutes is tight. The fission case is where Parfit's argument crystallizes, but rushing it risks confusion. Maybe present it as the climax but explicitly frame it as "here's why Parfit thinks identity can't be what matters" without delving into R-relatedness yet. Save that for follow-up.

  The assessment question they requested needs to bypass semantic debates. Something like "If the teleporter malfunctioned and created a copy without destroying you, would you have reason to care about that copy's future?" forces them to engage with what matters rather than identity conditions.

  Time allocation is tricky. Must build in buffer for the inevitable zombie-panel tangent when discussing physical continuity. Should explicitly bracket that debate upfront. Also need to flag that we're not evaluating Parfit's entire project - just following his argument where it leads for survival.

  ...wait, did they mention physicalism assumptions? First-years might not realize Parfit's argument works within materialist frameworks. Should note that quietly when setting up the cases.
answer: |-
  Here’s a focused 50-minute session plan designed to disrupt preconceptions, scaffold understanding, and target the core of Parfit’s argument. The sequence prioritizes creating conceptual tension before introducing the teletransporter.

  **Session Goal:** To understand Parfit’s claim that *identity* (numerical sameness) isn’t what fundamentally matters in survival – *Relation R* (psychological connectedness/continuity) is.

  **Core Structure:**
  1.  **Establish Baseline Intuitions (10 mins)**
  2.  **Challenge "Identity = Survival" (15 mins)**
  3.  **Introduce the Teletransporter & Parfit's Move (15 mins)**
  4.  **Consolidate & Implications (10 mins)**

  ---

  ### Detailed Plan

  **1. Establish Baseline Intuitions (10 mins)**
  *   **Question 1:** "What do we ordinarily mean when we say someone 'survives' an event? What has to be true?" *(Elicit: Continued existence of the same person, same body, same mind/memories, no interruption of consciousness, etc.)*
  *   **Question 2:** "What makes *you* today the *same person* as you were 5 years ago? What's the necessary connection?" *(Elicit: Bodily continuity, psychological continuity - memories, personality, intentions).*
  *   **Defining Terms:** Briefly formalize the two main candidates for what *constitutes* identity/survival: **Physical Continuity** (same brain/body) and **Psychological Continuity** (overlapping chains of memories, beliefs, intentions, character traits). *Emphasize:* Psychological continuity is *not just memory*; it includes future-directed intentions, character, dispositions. **HEAD OFF DEMENTIA MISCONCEPTION HERE:** "If psychological continuity weakens/diminishes (like in dementia), does that mean the person is *less them* or *dying gradually* in a fundamental sense? Parfit argues it's a matter of *degree* of what matters (Relation R), not an all-or-nothing identity switch."

  **2. Challenge "Identity = Survival" (15 mins) - *The Duplicate Scenario***
  *   **Set Up:** "Imagine a machine that can scan every detail of your brain and body *non-destructively*, transmit that information to Mars, and perfectly reconstruct a physical duplicate there. The original (you here on Earth) remains completely intact and unharmed."
  *   **Key Questions:**
      *   "Is the person constructed on Mars *you*? Why/why not?" *(Almost certainly: "No, it's a copy/duplicate.")*
      *   "Has *your survival* depended on this process? Did *you* survive the process happening *here on Earth*?" *(Yes - you're still here!)*
  *   **Crucial Point:** "Notice that the questions *'Is that person me?'* and *'Did I survive?'* have come apart. Survival (of the original) happened without the Mars duplicate being *identical* to you. Identity (sameness) and survival (continued existence) are separable concepts. The duplicate is *psychologically continuous* with you (same memories, personality, etc.), but not *physically continuous* with you, and not *you*."
  *   **HEAD OFF SEMANTIC MISCONCEPTION HERE:** "This isn't *just* a debate about the word 'same'. We're asking a deeper question: What is the *underlying fact* that makes survival matter to us? Is it *being numerically identical*? Or is it something else that often accompanies identity?"

  **3. Introduce the Teletransporter & Parfit's Move (15 mins)**
  *   **Set Up:** "Now, the standard Parfit teletransporter: Same scan, same transmission to Mars, same perfect reconstruction. But this time, the scanning process *destroys* your original brain and body on Earth."
  *   **Initial Question:** "If you step into this machine, do you *survive*? Does *your existence continue* on Mars?" *(Expect mixed answers; some "yes" (continuity of mind), some "no" (death here)).*
  *   **Parfit's Analysis:**
      1.  **Identity Claim:** If the Martian is *identical* to you, you survived. If not, you died. *(Recap: The duplicate scenario suggests they aren't identical - same relation R, no physical continuity).*
      2.  **What Matters?:** Parfit asks: *"Suppose you learn the teleporter works, but you also learn there's a hidden flaw: while it reliably creates the person on Mars, it does NOT preserve identity – it's like the duplicate case plus destruction of the original. Does knowing this flaw change how you feel about using the teleporter?"*
          *   **Crucial Thought Experiment:** "If what *mattered* was identity, discovering this flaw would be terrifying – you learn you *die* each time! But Parfit suspects that for many people, if they were confident the *psychologically continuous* person (with their memories, plans, loves) would exist on Mars, they might *still* step in. Why? Because what *mattered* to them was the continuation of their psychology (Relation R), not strict identity."
      3.  **HEAD OFF "COPY DOESN'T MATTER" MISCONCEPTION HERE:** "Parfit is **NOT** saying the copy doesn't matter! He's arguing that what matters *to the original person* about their future is that *someone* psychologically continuous with them exists and has a good future. That's *why* stepping into the flawed teleporter might still be acceptable. The copy matters *because* of Relation R."
  *   **(Optional & Quick - Fission Lite):** If time permits (don't force it if <5 mins left), briefly mention: "Parfit strengthens this by imagining the scanner glitches and sends the info to *two* receivers on Mars, creating two psychologically continuous people. Who is the original? *Neither* can be strictly identical (one person can't be two). But does the *original person's survival* still matter? Parfit says yes – because now *two* people have what matters (Relation R). Identity becomes incoherent, but what matters still holds."

  **4. Consolidate & Implications (10 mins)**
  *   **Recap Parfit's Core Argument:**
      1.  Identity (numerical sameness) requires uniqueness and determinacy (one outcome).
      2.  What matters in survival (caring about your future) seems to be Relation R (psychological connectedness/continuity).
      3.  Relation R can exist without identity (Duplicate Case).
      4.  Identity can be undefined/destroyed while Relation R persists and carries what matters (Teletransporter - especially with potential fission).
      5.  Therefore, identity is not what matters; Relation R is.
  *   **The Revealing Question:** "**If the teleporter malfunctioned and created a psychologically continuous copy on Mars *without* destroying the original you on Earth, would *you* (the original) have any *self-interested reason* to care about the well-being of the copy on Mars? Why or why not?"**
      *   **Why it reveals understanding:** A "Yes" indicates grasp that Relation R (psychological continuity) grounds concern, independent of identity. A "No" suggests still equating identity with what matters or misunderstanding Parfit's claim. A qualified "Yes, but..." can lead to nuanced discussion. *This is your key assessment point.*
  *   **What to Openly Decline to Settle:**
      *   **"We are NOT settling whether Parfit is *correct* about what matters.** We're understanding his argument. You might firmly believe identity *is* what matters – that's a valid philosophical position to hold *against* Parfit."
      *   **"We are NOT attempting a full critique of physicalism or dualism.** Parfit's argument works primarily within a broadly physicalist framework where psychology is realized in the physical (brain). We're bracketing deeper questions about souls or fundamental consciousness."
      *   **"We are NOT resolving the 'fission' case definitively today.** We've seen how it challenges identity; the full implications (branched psychological continuity, R without identity) are complex and could be a session on their own." (This justifies holding full fission back if time is tight).

  ---

  **Why this sequence works:**

  1.  **Starts with Intuitions:** Grounds discussion in pre-theoretical beliefs about survival and identity.
  2.  **Creates Conceptual Tension First (Duplicate):** Separates identity and survival *before* introducing destruction, making the teletransporter dilemma sharper. Disrupts the "it's just a copy" reflex.
  3.  **Teletransporter as Test Case:** Uses it explicitly to test whether identity is *necessary* for what matters, leveraging the tension created by the duplicate case.
  4.  **Targets Misconceptions Proactively:** Addresses memory-reductionism, the "copy doesn't matter" error, and semantic confusion at the points where they naturally arise.
  5.  **Fission as Amplifier (Optional):** Presented briefly as supporting evidence for the argument's core, not the main event.
  6.  **Clear Assessment Question:** Directly probes understanding of the identity/matters distinction.
  7.  **Explicit Bracketing:** Manages expectations and scope.

  **Key for Facilitation:** Be Socratic! Guide them to articulate the distinctions and tensions themselves based on the scenarios. Don't lecture Parfit; use the cases to make *them* experience the puzzle and see where Parfit's solution points. Good luck!
