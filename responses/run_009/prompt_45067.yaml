     However, the pattern in act two is not about risk aversion per se, but about the common ratio effect. And it is well known that RDEU (or prospect theory) can explain it while EU cannot.

     And importantly, we want to use the same weighting function for act one and act two. In act one, we had a deductible choice with p=0.10. We required w(0.10)>0.10. In act two, we have a weighting function that overweights small probabilities (like 0.20 and 0.25) and underweights large ones (0.80). And for p=0.10, we want w(0.10)>0.10. This is consistent with an inverse-S weighting function: for small p, w(p)>p.

