  5. **Hierarchical Common Prior**: The regress is resolved by a shared pre-prior over priors. *Most awkward commitment: Requires that all rational agents share the same meta-prior, which is even more demanding than a common prior.*

  6. **Idealization Denial**: The Bayesian framework with priors is an idealization that never applies to real agents. *Most awkward commitment: Leaves us without a clear model of how rational agents should handle disagreements.*

  7. **Common Prior with Knowledge Failure**: Agents share a common prior, but common knowledge of posteriors fails, explaining persistent disagreement. *Most awkward commitment: Must explain why, after sharing evidence and knowing each other's posteriors, they fail to achieve common knowledge and why they don't converge.*

  8. **Permissivism with Conciliation**: Rationality permits different priors, but upon learning of peer disagreement, agents should adjust their credences toward each other. *Most awkward commitment: Requires agents to compromise their own priors, which might seem to undermine the rationality of having a prior in the first place.*

  Now, we have 8 leaves.

  We need to check for pairs that the tree cannot separate. For example, a student might think that common knowledge fails and the common prior is false, but the tree puts them in Leaf 1 (agnostic). But we have Leaf 7 for those who think common prior holds. So that's separated.

  Another pair: permissivism with conciliation and the hierarchical view? They are separated by the regress question.

  Instructor's note: I expect students to get stuck on the regress problem (Question 0). Many students have a hard time with the idea of a prior because they recognize that they weren't born with one. They might be torn between (A) and (B). When they get stuck, I should have ready: "The Bayesian prior is a model of your current credences as if you had updated from some initial state. The regress asks where that initial state comes from. Some think we must ground it in a pre-prior, others think it's a useful fiction, and others reject the model entirely. Which feels more defensible to you?"

  Also, in Question 3 (nature of prior disagreement), students might not see it as either taste or impairment. I can say: "Think about a disagreement in aesthetic judgments versus a disagreement in simple arithmetic. Is prior disagreement more like the former or the latter? Or is it a third thing?"

  Finally, the trading case might come up. I can note that the tree uses the weather forecasters as a representative example, and the student's answer there should generalize.

  The tree is now complete.
