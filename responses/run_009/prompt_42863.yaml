answer: |-
  ## Kelly Isn't Magic, It's Just Log Utility

  Okay, team. We've been deep in the Kelly weeds. The "geometric rationality" camp makes a bold claim: that maximizing the geometric mean (or expected log wealth) isn't *just* one good strategy for long-run growth, it's the uniquely *rational* way to bet whenever you have repeated opportunities with an edge. They argue this dissolves paradoxes and is forced upon us by ergodicity considerations, making non-Kelly betting akin to probabilistic incoherence. I think this overreaches dramatically. Kelly betting isn't a new decision theory; it's firmly rooted in standard expected utility maximization (EUM), specifically for an agent whose utility function is logarithmic in wealth. The arguments for its *universal* rationality subtly smuggle in either that specific utility function or a prior commitment to maximizing long-run growth *as the terminal goal*, neither of which is rationally compulsory.

  Let's start with the equivalence. The Kelly criterion maximizes the expected *logarithm* of future wealth: `max E[log(W_1)]` given your bet. Standard EUM maximizes `max E[u(W_1)]` for some utility function `u`. If `u(W) = log(W)`, then maximizing `E[u(W)]` is *identical* to maximizing `E[log(W)]`. Kelly *is* EUM with log utility. Period. There's no mystical leap here. Proponents like the properties of log utility – decreasing marginal utility, wealth growth proportional to current wealth – and that's fine! But it *is* a specific preference. Someone with linear utility (`u(W) = W`), caring only about expected dollar value, *should* bet their entire edge every time ("bet the farm"), accepting the near-certainty of ruin for the astronomical, if improbable, upside. Is this wise? Probably not, in most real-world senses. But is it *rationally incoherent* given their utility? No. They are consistently maximizing their expected utility. Kelly proponents find this repugnant, but that repugnance stems from *their* preference for safety and growth, not from pure logic.

  This brings us to the ergodicity/time-average argument. The claim is that since we live a single, long path through time, we should care about the *time-average growth rate* (the geometric mean), not the *ensemble-average* (the arithmetic mean) across many parallel universes. The Kelly fraction maximizes this long-run growth rate. Over infinite trials, the Kelly bettor's wealth grows exponentially faster than any other strategy, and any overbettor goes broke almost surely. Hence, the argument goes, Kelly is rationally compelled.

  **Here’s where the smuggling happens.** The move from "maximizes long-run growth" to "is uniquely rational" implicitly assumes that *maximizing the long-run growth rate of wealth is the ultimate goal*. But why must this be the goal? EUM doesn't dictate the *content* of utility. An agent might have very different preferences. They might:

  1.  **Value certainty:** They might prefer a slightly lower long-run growth rate if it drastically reduces the probability of very low wealth levels in the medium term (e.g., protecting against ruin before "long-run" kicks in).
  2.  **Have finite horizons:** Their betting life might be short. Long-run dominance over infinite time is irrelevant if they only get 10 bets. The ensemble average might be more relevant.
  3.  **Care about something else:** Their utility might peak at a specific wealth level, involve bequest motives, or incorporate risk aversion that isn't perfectly logarithmic. They might intrinsically dislike high volatility, even if it promises higher growth.
  4.  **Face correlated risks:** The real world isn't IID coin flips. A strategy optimal for uncorrelated bets might be disastrous if bets are linked or systemic risks exist.

  The ergodicity argument *assumes* that surviving the long run and achieving maximal compounded growth is the *only* thing that matters. It replaces the standard utility function `u(W)` with a preference for the long-run path property. This is a substantive normative choice – prioritizing growth sustainability above all else – not a logical deduction from ergodicity itself. Ergodicity tells us *what happens* over time; it doesn't tell us *what to value* about that outcome.

  **Now, the strongest counter: Almost-Sure Dominance.** "Fine," they say, "but over a sufficiently long horizon, the Kelly bettor's wealth *will*, with probability approaching 1, exceed any non-Kelly bettor's wealth. Any overbettor *will* go broke. How can choosing a strategy that guarantees you end up poorer than the Kelly bettor, or ruined, be rational?"

  This objection is powerful because it highlights the stark long-run consequences. But it sneaks in a crucial assumption: that *having more wealth in the long run is always better, regardless of the path to get there or the agent's specific preferences for risk and intermediate wealth levels*.

  1.  **Dominance ≠ Utility Dominance:** "Wealthier" doesn't automatically mean "better off." Utility is the measure of "better off." If an agent doesn't have log utility, having more wealth than someone else in the distant future doesn't necessarily mean they have higher utility *according to their own preferences*. The risk-averse agent who bet half-Kelly might *derive more utility* from their smoother, less volatile, albeit slower-growing path, even if their terminal wealth is lower. They valued the reduced anxiety *along the way* more than the maximal terminal sum.
  2.  **The Price of Safety:** The underbetter (betting less than Kelly) *chooses* lower long-run growth in exchange for lower volatility and reduced risk of severe drawdowns *before* the "long run." The almost-sure dominance only guarantees the Kelly bettor wins *eventually*. The underbetter might be consistently wealthier and happier for decades before that eventual overtaking occurs – which might be long after they care. Is it irrational to value decades of higher relative wealth and security over an eventual, highly probable, but delayed dominance?
  3.  **Ruin is Bad, But...:** The overbetter *will* go broke almost surely. This *is* terrible for almost any plausible utility function. But it doesn't follow that *only* Kelly is rational. The underbetter avoids ruin too! Crucially, the argument against overbetting relies on *any* non-trivial utility function valuing ruin catastrophically (a near-universal truth). The argument for Kelly as *uniquely* rational against the underbetter relies on the much stronger assumption that *only* long-run maximal growth matters, dismissing any value placed on path properties or different risk profiles.

  **Conclusion:** Kelly betting is a powerful and often wise strategy, particularly for those whose primary goal is long-run wealth growth and who naturally find log utility appealing. Its properties are mathematically compelling. However, elevating it to the status of *universally rational*, independent of utility, is a category error. It *is* EUM with log utility. The arguments for its universal compulsion either explicitly assume log utility, or they implicitly assume that maximizing long-run geometric growth is the *sole* rational terminal goal. This latter assumption is a significant normative choice about what constitutes a good outcome – prioritizing sustained growth above all else – not a logical necessity revealed by ergodicity or probability theory. Rationality, in the standard Bayesian/EUM framework, is about consistently maximizing *your* expected utility, not about maximizing growth irrespective of what *you* actually value. Choosing a non-Kelly fraction isn't necessarily irrational; it might simply reflect different preferences over risk, time, and the distribution of wealth along the path of life.

  ---

