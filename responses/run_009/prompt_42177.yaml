  I'm applying for a one-year postdoc fellowship on AI welfare, and I need a two-page proposal built from a half-formed idea I can't quite get into shape. The idea: public and philosophical debates about whether reinforcement learning agents can suffer keep talking past each other because "reward" actually plays at least three distinct roles in an RL system — as a learning signal that updates the policy during training, as a runtime input that steers behavior once the policy is fixed, and as the quantity the designers chose to optimize. When one side says a negative reward signal is the machine analogue of pain, and the other replies that it's merely a number in an optimization loop, I suspect they are silently picking different roles and arguing from there. My tentative thought is that the question "can reward serve as valence?" splits into several separable questions depending on the role: whether a signal that only shapes learning (and is never present in the running system) could be valenced at all; whether a signal that drives behavior but is never available to the agent's own planning and deliberation — just folded into a value function — has the right causal profile for valence; and whether the designer's choice of what to optimize has any bearing on what the resulting system feels. My hunch is that once these are separated, some of the standard intuitions dissolve, others sharpen, and at least one of the sub-questions becomes empirically tractable in the near term. Turn this into a proposal with a precise statement of the central question, an explanation of why the existing positions (reward-is-just-a-number skepticism, functionalist identification of reward with valence, and views that locate suffering elsewhere in the architecture) leave it open, the method — what I would actually do, month by month, including how I would use idealized agent models to test whether the role distinctions do any real work rather than just relabeling the disagreement — what the possible conclusions are and which considerations would decide among them, and an honest statement of what would count as the project failing. Skip the bibliography; I'll add citations myself.
