prompt: |-
  So I write novels — third one just went to copyedits, which means I've been staring at my own sentences so long I've started having thoughts about them, which is never good. Here's what's bugging me, and I want someone who actually knows philosophy of language to sort it out. It's about when words in and around a novel actually DO something versus when they're just... words. Like, performatives, I think is the term? Utterances that perform rather than describe. Anyway. I've made a list of cases from my own books and my gut verdicts on each, and I want to know if there's a principle behind them.

  1. In the book I just finished, a priest character pronounces two other characters husband and wife. Verdict: that worked. Those two are married — in the story, sure, but married, full stop, as far as anyone inside the book is concerned.

  2. Same book, the acknowledgments: "For my husband — this one is yours." Verdict: that also worked, but in the real world. I actually gave him the book. Me, the author, not a character.

  3. First-person narrator in my second novel tells the reader "I promise you, everything in these pages is true." Verdict: nothing happened. No one promised anyone anything. It's not even false, it's just inert somehow. Feels different from both 1 and 2 and I can't say why.

  4. My second novel had a phrase in it for a specific kind of bad date (my agent made me cut it, dont ask). My friends who read the drafts still use the phrase. Verdict: I did something real when I wrote it. I coined a word. That feels like the realest speech act on this whole list, realler than the fictional wedding even, and that embarrasses me slightly.

  5. That same book has a minor character who is very obviously my old landlord, and the narrator calls him a thief — he wasn't one, he was just a jerk about the water heater. Verdict: if that had survived to the printed book, something would have happened to the real landlord. A real accusation got made, by me, somehow, even though it's "just" the narrator talking about a "fictional" character.

  6. Also in that book, the narrator rants about a real senator being on the take. Verdict: nothing. It's the narrator being the narrator, it's satire, and I genuinely don't feel that I accused anyone of anything. I can't reconcile this one with 5 and I've stopped trying.

  7. The standard all-persons-are-fictitious disclaimer at the front. Verdict: I sign my name under it and it does something legal-ish I suppose, but in the landlord version of the book it would have been a lie, and yet I still don't feel like I'd have been lying, exactly. No idea what's going on there.

  8. The movie adaptation of my first book: the actor playing a judge sentences a character to five years. Verdict: nothing real, obviously. But also exactly like case 1 — the character gets sentenced in the fiction — and that feels right to me, I get no wobble between those two at all.

  So: is there one principle that sorts these? My half-guess is that it's something like who is speaking, to whom, and in wich world — but every time I try to make that precise it tells me the narrator's promise in 3 did something (I don't think it did), or it tells me the landlord accusation in 5 is nothing (I don't believe that either).

  What I want from you:

  - State the principle — or two candidate principles if one can't do it all — in plain language, not jargon.
  - Show it handling all eight cases, and be honest about which of my verdicts you'd have to overturn. I suspect 4 and 5 together are a headache for anything simple, so tell me if one of them has to go and which.

  - Tell me what the principle predicts for cases I haven't thought of. Specifically: (a) if I put an author's note at the end of the next book apologizing to my hometown for how I portrayed it, is that a real apology, performed by me, or a description of the sentiment behind one? (b) if I use a real letter my grandmother wrote as an epigraph, and in it she promises my grandfather something, did she promise it all over again by being reprinted, or is that promise somehow frozen or used up by now? and (c) when I read my own dialogue out loud at a book event — the priest's wedding lines, say, in the character's voice, with the audience knowing full well it's me reading — did anything get pronounced, and to whom?

  One more thing. I gather Austin had some line about how speech acts in fiction are somehow hollow — parasitic on normal use, I think the word was — and if that's really the answer, then fine, but then I want to know why my gut says cases 2, 4 and 5 are exceptions, or whether my gut is just wrong about all three.

  Oh and please answer in American English — no "whilst" or "amongst", and it's "toward" not "towards". I read enough British copyeditors this month.
reasoning: |-
  Okay, the user writes novels and is deep into the philosophy of language, specifically about when words in a novel perform actions versus just being descriptive. They've listed eight scenarios from their own work and their gut feelings about whether the words "did" something. They want a principle that explains all cases without jargon and addresses their specific questions.

  First, I need to recall J.L. Austin's speech act theory. Performatives are utterances that do something, like marrying or promising, but they need certain conditions: proper authority, context, and sincerity. Austin thought fictional utterances are "parasitic," meaning they don't perform real actions. But the user feels some cases (like 2, 4, 5) are exceptions. Why?

  Looking at their cases: 

  1. Priest marrying characters: Works in the story world. Austin would say it's hollow, but within fiction, it's valid.

  2. Dedication to husband: Real-world performative. The author is giving the book, so it's a real act.

  3. Narrator's promise: Inert because the narrator isn't real, and the author isn't making the promise. So no real commitment.

  4. Coined phrase: Real because language creation happens when people adopt it. This is a metalinguistic act, not a standard performative.

  5. Accusing landlord through character: Feels real because it's thinly veiled. The author is indirectly accusing, so it's an act of accusation, even if fictional.

  6. Rant about senator: Satire, so not a real accusation. The difference from 5 might be the intent and how obvious the reference is.

  7. Legal disclaimer: A legal performative by the author, but might be a lie if characters are based on real people. The signing makes it a real act, even if the content is false.

  8. Actor sentencing: Like case 1, fictional but valid in-story.

  The user's gut conflicts with Austin on 2,4,5. So maybe the key is the author's real-world actions versus the fictional context. The principle could be: Performatives are real only if the speaker exists in reality and intends the act, within a real context. But case 5 blurs this—the author might intend the accusation, even through fiction. 

  Also, case 4 is about creating language, which is different. So maybe two principles: one for standard performatives (authority, context) and one for language creation (adoption by community). 

  For the additional questions:

  - Apology in author's note: Real because it's the author speaking directly, so it's a performative.

  - Grandma's letter as epigraph: The original promise stands, but reprinting isn't a new promise. It's quoting, so no new act.

  - Reading dialogue aloud: Not a real pronouncement because it's a performance, not in the right context.

  The user might need reassurance that their intuition about 2,4,5 being real is valid, even if Austin dismisses fiction. The deeper need could be understanding their responsibility as an author—when their words have real effects, like coining terms or accusing real people, versus staying within fiction. They might also be concerned about legal or ethical implications of their writing.
answer: |-
  Based on your cases and my understanding of speech act theory (mostly J.L. Austin, with some adjustments), here's the principle that best explains your gut reactions and handles all eight cases without jargon. It turns out **one core idea** *almost* works, but your "word coinage" case (4) is a different beast requiring a second mini-principle. I'll state it plainly, then walk through your cases, overturn one of your verdicts (sorry!), and answer your new scenarios.

  ### The Core Principle (for standard speech acts)
  **A speech act (like promising, marrying, accusing) actually "happens" if and only if:**
  1.  **The speaker is real and present** (not fictional, not just a character or narrator).
  2.  **The speaker intends to perform that specific act** (not just describing or playing a role).
  3.  **The context is appropriate and real** (the right setting, audience, and rules exist *outside* the fiction for the act to take effect).

  ### The Mini-Principle (for word coinage/language change)
  **Creating a new word or phrase "works" if it:**
  1.  **Escapes the fiction** (people in the real world start using it).
  2.  **Serves a communicative need** (it fills a gap or expresses something useful).

  ### Why Austin's "Parasitic" Idea Doesn't Fully Work For You
  Austin argued fictional speech acts are "hollow" or "parasitic" because they borrow the *form* of real acts without meeting the conditions (like a real speaker/context). Your gut correctly flags that this is too simplistic. Cases 2, 4, and 5 *do* something real *because* they involve **you, the real author, acting intentionally in the real world** (dedicating, coining/defining, thinly veiling an accusation), even if the act *uses* fictional elements. Austin underestimated how authors perform real-world acts *through* the vehicle of fiction.

  ---

  ### Applying the Principles to Your Cases

  1.  **Priest pronounces characters married.**
      *   **Principle:** Speaker (priest) is fictional. Context is fictional. Intention exists *within* the fiction only.
      *   **Verdict:** It "works" *inside the story world* because the *fictional* context accepts it. No *real-world* marriage occurs. **Matches your verdict.**

  2.  **Acknowledgments: "For my husband — this one is yours."**
      *   **Principle:** Speaker is real (you). You intend the real-world act of dedication/giving ("this one is yours"). Context is real (book publication, real husband).
      *   **Verdict:** Real-world speech act performed. You gave him the book. **Matches your verdict.**

  3.  **Narrator: "I promise you, everything in these pages is true."**
      *   **Principle:** Speaker is fictional (narrator). Even if *you* wrote it, *you* aren't making this promise to the reader; the character is. Context (promise within a novel) isn't the right context for a real promise. No real intention *by you* to be bound by this fictional character's words.
      *   **Verdict:** Nothing real happened. No promise was made. **Matches your verdict.**

  4.  **Coined a phrase for a bad date (used by friends).**
      *   **Principle (Standard):** Doesn't fit neatly (it's not a promise/marry/accuse).
      *   **Principle (Mini-Principle):** The phrase escaped the fiction. Friends (real people) found it useful and adopted it. You performed the real-world act of defining/creating a new linguistic tool that met a need.
      *   **Verdict:** You did something real (coined a useful phrase). **Matches your verdict.** (This is a different *kind* of act than the others – it's *metalinguistic*, changing language itself).

  5.  **Narrator calls thinly-veiled landlord character a thief.**
      *   **Principle:** Speaker is fictional (narrator) *BUT*... the real-world action happening is **YOUR act of writing/publishing a thinly-veiled accusation aimed at the real landlord.** *You* are the real speaker *behind* the fiction. *You* intended to portray him negatively as a thief (even if exaggerated). The real-world context (publishing a book) is appropriate for making public claims that can damage reputations.
      *   **Verdict:** A real accusation was made *by you, the author*, using fiction as the vehicle. **Matches your verdict.** (This is where Austin's "parasitic" breaks down - the fiction is the *tool* you use to perform a real-world act of accusation).

  6.  **Narrator rants about a real senator being on the take.**
      *   **Principle:** Speaker is fictional (narrator). While *you* wrote it, the context (satirical novel) strongly signals this is part of the fictional character's voice and the novel's genre conventions, not *your* direct, factual accusation. Your likely intention was satire/critique *using* fiction, not making a direct, literal claim of criminal activity *as yourself*. The context provides inherent deniability ("it's satire!").
      *   **Verdict:** Nothing real *in the sense of a direct, literal accusation by you* happened. It's protected by the fictional/satirical frame. **Matches your verdict.** (The key difference from 5 is the *lack of thin disguise* and the *stronger generic context* of satire offering protection/deniability. You intended satire, not a direct, attributable smear).

  7.  **Fictional disclaimer signed by you.**
      *   **Principle:** Speaker is real (you, signing). You intend to perform the real-world legal/semi-legal act of disclaiming responsibility for linking fictional characters to real people. The context (publishing industry norms, potential legal frameworks) is appropriate for such disclaimers to have a (limited) effect.
      *   **Verdict:** It *does* something legal-ish (creates a layer of deniability, sets expectations). It *would* be a lie in the landlord case *about the content*, but the *act of disclaiming itself* is still real and performed by you. You weren't "lying" *in the moment of signing the disclaimer act*; you were *performing the disclaimer*, even if the statement within it was factually false. **Matches your verdict's complexity.**

  8.  **Actor playing judge sentences a character.**
      *   **Principle:** Speaker is an actor (real person) *playing a role* (fictional judge). The actor *does not* intend to actually sentence anyone; they intend to perform lines. The context is fictional (movie set, audience understands it's fiction). No real-world sentencing rules apply.
      *   **Verdict:** Nothing real happens (no one is sentenced). It "works" *inside the fiction*, just like case 1. **Matches your verdict.**

  ### Overturned Verdict? Only if We're Strict...
  The principles hold all your verdicts *except* they require a slight reframing of **Case 5**. Your verdict is "A real accusation got made, by me". The principle *agrees* the real act was **your act of publishing a damaging portrayal**, not the *narrator's fictional utterance itself* performing the accusation magically. The narrator's words are the *content* of *your* act. If your verdict meant the narrator literally accused the landlord, I'd have to overturn that part – the narrator accused a *character*; *you* used that character to point at the real landlord. But your description ("by me, somehow") suggests you already sense this distinction, so I think we're aligned. **No full verdict needs overturning.**

  ### Predictions for Your New Cases

  (a) **Author's note apologizing to hometown:**
      *   **Principle:** Speaker is real (you). Context is real (published book, author's note directed at real audience). If you intend the act of apologizing ("I apologize for..."), then **yes, it's a real apology performed by you.** It's not *just* a description; the act *is* the apology. Whether it's accepted is another matter. (If it said "The narrator feels bad about how the town is portrayed", *that* would just describe a fictional sentiment).

  (b) **Reprinting grandma's real letter where she promises:**
      *   **Principle:** The *original* act of promising happened when Grandma wrote/sent the letter to Grandpa. Reprinting it is **quoting or reproducing the text, not re-performing the promise.** The promise isn't "frozen" or "used up"; it was a historical event. Reprinting it is *your* act of sharing/documenting, not Grandma promising again. The promise itself remains a single past event. **No new promise occurs.**

  (c) **Reading the priest's wedding lines aloud at an event:**
      *   **Principle:** Speaker is real (you) *performing a reading*. You are not *being* the priest, intending to marry anyone. The audience understands it's a performance, not a real ceremony. The context (book event) is wrong for a real wedding. **Nothing gets pronounced.** You performed an act of *reading/entertaining*, not of *pronouncing a marriage*.

  ### Why Your Gut is Right About 2, 4, and 5 (and Austin Needs Tweaking)
  Austin focused on the *utterance itself within the fiction*. Your gut recognizes that **authors are real people performing real-world actions *through* the medium of fiction.** In Case 2, you directly dedicated. In Case 4, you created a real linguistic tool *via* fiction. In Case 5, you leveraged fiction to make a real (if deniable) attack. These are *your* actions in the real world, using writing and publishing as your tools. Fiction isn't always a parasitic bubble; it's a powerful medium through which authors *do* real things – dedicate, define, accuse, apologize (see prediction a!). Austin's framework needs expanding to account for the **author's real-world performative actions *mediated by* fictional texts.** Your gut is spot on.
