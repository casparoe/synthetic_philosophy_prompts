  In the agreed section, we can note: Both parties agree that the dispute is not entirely verbal, but there is a verbal aspect in the way we use phrases like "the ship at t". The endurantist takes this to refer to the ship itself, while the perdurantist takes it to refer to a temporal part. But the substantial disagreement remains about whether the ship is a three-dimensional object that is wholly present at multiple times or a four-dimensional object that has temporal parts.

