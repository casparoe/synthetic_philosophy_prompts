    - The perdurantist uses temporal parts (e.g., the ship has a temporal part at t1 that is large and one at t2 that is small).
  - Both agree that the ship existed at the beginning and does not exist at the end. There is a period during which the ship exists and then it ceases to exist.
  - Both agree that during the process of plank removal, the ship changes in its material composition and spatial extent.
  - Both agree that the case raises a problem about when exactly the ship ceases to exist, and that this threshold is vague or hard to locate.
  - Both agree that the relativistic argument (from the frame-relativity of simultaneity) is a challenge for endurantism, but the endurantist has a response (e.g., privileging a frame or using a different account of persistence). The perdurantist concedes that if endurantism can handle this, then it is not a decisive objection.
  - Both agree that the dispute is not merely verbal in its entirety, but there might be aspects that are verbal.

  Disagreements Table:

  We need to list the residual disagreements. Each row in the table should have:
  - Disagreement: a brief label for the point of disagreement.
  - Endurantist's accepted wording: how the endurantist would phrase their view on this point.
  - Perdurantist's accepted wording: how the perdurantist would phrase their view.
  - Crux it tracks: which of the identified cruxes this disagreement relates to (e.g., the literal truth of "the ship is smaller", or the relevance of relativity).
