  - Endurantist prediction: In any scenario, we can always account for change by temporal qualification without needing to introduce temporal parts. The ship at t1 is large, at t2 it is small, and it is the same ship. This is the only coherent way to account for change.
  - Perdurantist prediction: Without temporal parts, we cannot make literal sense of change in intrinsic properties over time. The endurantist's account is a disguised way of indexing properties to times, which is equivalent to having temporal parts.

