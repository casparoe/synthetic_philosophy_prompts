  - Perdurantist: The ship is a four-dimensional whole. The ship has temporal parts; the temporal part at t1 is large and the temporal part at t2 is small. So, the ship is smaller at t2 in the sense that its t2 temporal part is smaller than its t1 temporal part. This is literal.
  - Crux: The literal truth of "the ship is smaller than it was".
