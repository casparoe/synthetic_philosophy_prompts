prompt: |-
  I'm putting together a term paper for a political philosophy course on nationalism and cosmopolitanism, and I keep running into a cluster of practices that seem to presuppose a specific theory of what compatriots owe each other — one that nobody ever states outright. Conscription is the clearest case: the state claims the power to compel citizens to kill and to risk death for the defense of compatriots, which is surely the most demanding special obligation anyone recognizes anywhere in moral and legal life. Yet the very same states treat aid to distant strangers as supererogatory — a matter of charity, national generosity, or at most a thin humanitarian floor. A citizen can be drafted to die for strangers-by-proximity in a border town, but no one is ever drafted, at comparable risk and cost, to rescue famine victims abroad. There are also two subsidiary wrinkles. Many countries exact from naturalizing citizens an oath that includes a promise to defend the country militally (typically with a modified oath available for religious pacifists), while the native-born never swear any such oath — so the very same obligation is treated as consent-based when it comes to immigrants and as consent-independent when it comes to the born. And, historically, draft boards have granted conscientious-objector status to universal pacifists, including ones who would accept arduous civilian service, while refusing it to selective objectors — people who fought no objection to war in general but believed one particular war was unjust.

  I'd like you to reconstruct the implicit theory of special obligations that makes this pattern intelligible. Which of the standard candidates does it actually fit: consent, reciprocity or fairness within a cooperative scheme, associative duties of membership, or something about shared institutions that Rawls-style views gesture at when they scope the difference principle to a closed domestic society? Does the pattern presuppose that cosmopolitanism is false, or is it consistent with a cosmopolitanism that grants the state latitude to assign domestic-defense duties to its members while denying it license to ignore the global poor? Do the parts cohere — or does the differential treatment of the naturalized and the native-born, or of pacifists and selective objectors, presuppose commitments the rest of the practice quietly contradicts? Please distinguish what these practices strictly presuppose from what they merely sit comfortably with, and tell me where the pattern is philosophically underdetermined, so that several rival theories would license it. Finally, say what would actually have to change if the presupposed view were replaced by a straightforward cosmopolitan one — would conscription survive, would the oath have to go, would a cosmopolitan-conscientious-objector exemption become mandatory?

  Lead with your bottom line in the first sentence, then give the reasoning, with no preamble and no restating of the question. As you go, say how confident you are in your major claims, and single out the point you are least sure of.
reasoning: |-
  Okay, the user is writing a term paper on nationalism and cosmopolitanism and has noticed some puzzling practices around conscription and obligations to compatriots versus distant strangers. They point out that states demand citizens risk their lives for fellow citizens through conscription but treat helping foreigners as optional charity. There are also inconsistencies: naturalized citizens swear a military oath while native-born don't, and conscientious objection is granted to universal pacifists but not to those who object to specific wars.

  First, I need to reconstruct the implicit theory behind these practices. The key elements are the demanding obligation to defend compatriots versus minimal duties to distant strangers. This seems to align with associative theories, like David Miller's or Rawls's focus on bounded societies. The state acts as the enforcer of these special duties based on shared membership rather than consent.

  Looking at the differential treatment: naturalized citizens swear oaths, but native-born don't. This suggests that for immigrants, the obligation is framed as consensual, while for natives, it's non-consensual and inherent. This inconsistency might be smoothed over by the idea that native-born citizens implicitly consent by staying in the country, but that's a weak argument. Philosophically, this points towards associative duties being primary, with consent used pragmatically for naturalization.

  The handling of conscientious objectors is another point. Universal pacifists get exempted because their refusal is based on a general moral principle, while selective objectors are seen as challenging the state's authority to decide on specific wars. This implies that the state's role in defining collective obligations is paramount, and individual judgment on particular wars isn't trusted. This fits with a communitarian view where the community's decisions bind members.

  Now, how does this relate to cosmopolitanism? The practices presuppose that special obligations to compatriots outweigh general duties to humanity, which contradicts strong cosmopolitanism. However, a moderate cosmopolitan might accept some prioritization of compatriots but argue for greater duties to distant strangers. The current system, though, seems to assume nationalism is correct.

  The user also asks what would change under cosmopolitanism. Conscription might not survive in its current form, or it could be extended to global humanitarian efforts. The oath would likely need revision, and selective conscientious objection might be recognized. The hardest part here is predicting how institutions would adapt, as cosmopolitanism varies in strength.

  The least confident point is about selective conscientious objection. The current practice assumes the state has the authority to compel military service based on its judgment of just wars. Under cosmopolitanism, if individuals have a duty to assess justice themselves, exemptions might be broader. But how states would implement that is unclear, given their reliance on collective decision-making.

  The user's deeper need is to untangle the philosophical assumptions behind real-world practices and identify inconsistencies. They might also want to argue for cosmopolitan reforms or critique nationalist frameworks. Highlighting the tensions, like the oath inconsistency, strengthens their paper by showing where theory and practice clash.
answer: |-
  The implicit theory is an **associative duty model grounded in bounded community membership**, which treats obligations to compatriots as inherently weightier than cosmopolitan duties, with the state as the primary enforcer of these special obligations. (High confidence)

  **Key Reasoning:**  
  1. **Core Obligations:** Conscription and the prioritization of domestic defense over foreign aid presuppose that shared nationality generates *sui generis* duties of mutual protection absent in global contexts. This aligns with **associative theories** (e.g., Miller, Tamir) and **institutionalist views** (e.g., Rawls’s closed society model), where co-membership in a state creates non-derivative obligations. Consent and reciprocity theories fail here—native-born citizens don’t consent to conscription, and reciprocity can’t justify demanding life-risking duties from young conscripts who haven’t yet benefited from the scheme. (High confidence)  

  2. **Differential Treatment (Naturalized vs. Native-Born):** The oath requirement for naturalized citizens attempts to "contractualize" an obligation that is treated as automatic for the native-born. This incoherence exposes a **tension in the theory**: associative duties are presented as non-voluntary for members-by-birth, while being artificially grafted onto immigrants via consent. Philosophically, it suggests the state *needs* consent to override the default (cosmopolitan) moral equality of strangers but denies that need for native citizens. This sits uneasily but doesn’t collapse the model—states likely see oaths as symbolic affirmation, not the obligation’s source. (Medium confidence)  

  3. **Conscientious Objection:** Exempting universal pacifists but not selective objectors presupposes **state supremacy in defining collective obligations**. Universal pacifists reject *all* violence, implicitly accepting the state’s authority to determine "just" wars. Selective objectors challenge that authority by asserting individual judgment over the state’s, undermining the communal duty’s binding nature. This coheres with associative/institutional views prioritizing communal self-determination over individual cosmopolitan assessments. (High confidence)  

  **Relationship to Cosmopolitanism:**  
  - The pattern **presupposes the falsity of strong cosmopolitanism**, which denies intrinsic moral weight to nationality. It is consistent only with **weak cosmopolitanism** (e.g., "compatriot partiality permitted") that allows prioritizing co-nationals, but current practices exceed this by treating aid to distant strangers as largely optional. The state’s unilateral authority to compel lethal sacrifice for compatriots, while ignoring comparable harm to foreigners, assumes compatriot obligations are categorically superior. (High confidence)  

  **Philosophical Underdetermination:**  
  - Rawlsian institutionalism and communitarian associative duties *both* license this pattern by emphasizing bounded societies. Consent theory *could* justify it via "tacit consent" (e.g., residency as agreement to defend), but this strains credibility with conscription. Reciprocity theories struggle with non-voluntary, high-cost duties. (Medium confidence)  

  **Changes Under Straightforward Cosmopolitanism:**  
  1. **Conscription would require radical justification or abolition.** A cosmopolitan state could only compel lethal risk for compatriots if comparable risks were demanded for distant strangers (e.g., mandatory humanitarian intervention service). Alternatively, conscription might be reserved for verifiable global threats, not routine defense.  
  2. **The naturalization oath would need revision or elimination.** Swearing to "defend the state" implies special obligations inconsistent with moral equality. A generic duty to uphold just institutions might replace it.  
  3. **Selective conscientious objection must be recognized.** If individuals bear primary responsibility for assessing the justice of wars (per cosmopolitan moral agency), objecting to *specific* unjust wars becomes a core right.  
  4. **Domestic priorities could not override urgent global needs.** Large-scale compulsory sacrifice (e.g., via taxation) for compatriot welfare would be unjustifiable while ignoring identical harms abroad.  

  **Least Confident Point:** The feasibility of "cosmopolitan conscription" for global rescue. While logically implied, it’s institutionally implausible—no global body exists to administer it, and states lack legitimacy to compel service beyond borders. Cosmopolitanism might instead *prohibit* coerced life-risking altogether. (Low confidence)
