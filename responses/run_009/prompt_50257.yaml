  We are designing fairness requirements for a risk model that ranks discharged patients for allocation of scarce home-nurse visits. The goal is to allocate a few hundred visits per week among tens of thousands of discharges. The model's output is a score that is interpreted as a readmission probability, and the intervention (visit) may change that probability (counterfactual). We have two major patient groups (say, A and B) with different base rates of the outcome (30-day readmission). The outcome is a proxy for deteriorating health and is influenced by prior access to care. The training data is selectively labeled because outcomes were only observed for patients who were flagged by the old nurse-visit program (which had its own priorities). 

  We must consider:
