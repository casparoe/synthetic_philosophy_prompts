  3. The proxy nature of the outcome: The outcome (30-day readmission) is a proxy for deteriorating health and is influenced by prior access to care. This may cause disparities because prior access might differ between groups.
  4. Selective labeling: The training data only has outcomes for patients who were flagged by the old program. This introduces bias because the labeled data is not representative of the entire population.
  5. The counterfactual effect: The intervention (nurse visit) reduces the risk of readmission. Therefore, the score we want to estimate is the risk without intervention (which is counterfactual for those who would receive the visit). However, in the training data, we observe the outcome under the old program's intervention (or lack thereof). This creates a challenge because we are training on a mixture of treated and untreated individuals.

  We must distinguish between requirements on the scores (predictions) and requirements on the decisions (allocations).

  Desiderata:

  1. **Within-Group Calibration (Non-negotiable):** 
     - *Requirement:* For each group, the predicted score should equal the true probability of the outcome (readmission) in that group for a given score. Formally, for a score s in group A, P(Y=1 | S=s, A) = s, and similarly for group B.
     - *Case:* Clinical staff will rely on the score as a probability. If calibration fails for a group, it could lead to mistrust and inappropriate clinical decisions. Moreover, in the context of the counterfactual, we note that the true probability we care about is the readmission risk without intervention (because we are deciding whether to intervene). However, we only observe outcomes under the old program. Thus, we require that the model is calibrated for the counterfactual outcome of no intervention. But note: we cannot observe the counterfactual for everyone. This is a challenge. We might have to approximate by using the observed outcomes in the control group (those not visited) but that group is biased because the old program selected whom to visit.

  2. **False Negative Rate (FNR) Balance (Non-negotiable):**
     - *Requirement:* The FNR (or equivalently, the recall) should be equal across groups. FNR = P(S < threshold | Y=1, without intervention). Since the intervention changes the outcome, we are interested in the counterfactual: we want to identify those who would have been readmitted without the visit. Thus, the FNR is the proportion of such patients who are not allocated a visit (i.e., below threshold). We require FNR_A = FNR_B.
     - *Case:* The harm we wish to avoid is missing a patient who would benefit from the visit (i.e., who would be readmitted without the visit). Therefore, we want to ensure that the chance of missing such a patient is the same for both groups. This is non-negotiable because the primary goal is to fairly allocate a beneficial intervention to prevent harm.

