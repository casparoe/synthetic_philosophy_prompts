answer: |-
  ### Fairness Desiderata for Risk Model Deployment  
  Given the context—allocating scarce home-nurse visits to prevent 30-day readmissions—fairness requirements must balance clinical interpretability, harm mitigation, and real-world constraints (proxy outcomes, selective labels, counterfactual effects). Below are the desiderata, categorized by **Non-negotiable** (essential for ethical deployment) or **Preference** (tradeable for other goals), with tensions and verdicts.

  ---

  #### **1. Within-Group Calibration (Scores)**  
  **Requirement**: Scores must be calibrated within each patient group (e.g., Group A and B). A score of 0.3 must imply a 30% readmission probability *for that group*.  
  **Case**: Clinical staff interpret scores as true probabilities. Miscalibration in one group (e.g., a score of 0.3 corresponds to 10% readmissions for Group B) erodes trust, misguides care decisions, and may exacerbate disparities.  
  **Non-negotiable**: Scores drive clinical judgment; misrepresentation risks harm and undermines credibility.  

  #### **2. Equality of False Negative Rates (FNR) (Decisions)**  
  **Requirement**: Equal FNR across groups (FNR = P(no visit | patient *would* deteriorate)).  
  **Case**: The primary harm is a missed visit for a patient who would deteriorate without it. FNR measures this harm. Equality ensures both groups have equal access to the intervention when needed.  
  **Non-negotiable**: The intervention is beneficial; unequal FNR means one group bears more preventable harm.  
  - *Note*: False positives (unnecessary visits) are secondary; we prioritize FNR over FPR.  

  #### **3. Proxy-Label Validity (Scores)**  
  **Requirement**: Scores must not conflate true deterioration risk with disparities in access to care. The model must adjust for features (e.g., ZIP code) that correlate with prior access.  
  **Case**: Readmission is a proxy for deterioration but is influenced by access barriers (e.g., Group B has lower access, inflating readmission rates). Unadjusted, the model penalizes groups with historical access gaps.  
  **Non-negotiable**: Allocative fairness requires disentangling health risk from systemic inequities.  

  #### **4. Correction for Selective Labeling (Scores)**  
  **Requirement**: Training must account for selection bias. Outcomes are only observed for patients flagged by the old program, which prioritized its own (potentially biased) criteria.  
  **Case**: If the old program favored Group A, labeled data under-represents Group B’s true risk. Deploying an uncorrected model inherits and amplifies prior biases.  
  **Non-negotiable**: Uncorrected bias violates distributive justice; allocation should not replicate past inequities.  

  #### **5. Counterfactual Validity (Scores)**  
  **Requirement**: Scores must estimate *counterfactual risk* (risk of deterioration *without* a nurse visit), not observed readmissions.  
  **Case**: The intervention reduces readmissions. Predicting observed outcomes (after prior visits) underestimates true risk for patients who received visits.  
  **Non-negotiable**: Allocation decisions depend on what would happen *without intervention*; ignoring this misallocates visits.  

  ---

  ### **Tensions and Impossibilities**  
  **Core Tension**: **Calibration + FNR Balance + Different Base Rates → Conflict**.  
  - **Why**: If Group A has a higher base rate of deterioration than Group B, calibration requires scores to reflect this (higher scores for Group A). However, equal FNR forces thresholds to select similar proportions of high-risk patients *relative to each group’s risk distribution*. With different base rates:  
    - Calibration + FNR balance → Forces unequal thresholds (Group A needs a lower threshold to "capture" the same proportion of true positives).  
    - But **decisions use a single global threshold** (visits allocated to top *n* scores). This makes equal FNR unachievable under calibration without group-specific thresholds, which violates procedural fairness (equal treatment).  
  - **Result**: Calibration and FNR balance are **jointly unsatisfiable** under a global threshold with different base rates.  

  **Proxy-Label and Selective-Label Complications**:  
  - **Proxy-Label + Calibration**: Calibrating to a biased proxy (readmissions influenced by access) forces scores to encode access disparities. This violates Proxy-Label Validity.  
  - **Selective-Label + Calibration**: Correcting selective labels (e.g., via reweighting) can recover unbiased risk estimates. However, if proxy bias remains, calibration entrenches access disparities.  
  - **What Survives?**:  
    - With calibration, Proxy-Label Validity is **unattainable** unless access-related features are fully adjusted (unlikely without causal models).  
    - Selective-Label Correction is **compatible** with calibration if the labeling mechanism is known (e.g., using inverse propensity weighting).  

  **Counterfactual Validity Adds**:  
  - Estimates must account for the intervention’s effect (e.g., via causal ML). Without this, calibration/FNR balance are meaningless—scores predict the wrong outcome.  
  - **Survival with Calibration**: Possible if counterfactual risk is estimable from observational data (e.g., using doubly robust methods). However, proxy bias and selective labels compound estimation error.  

  ---

  ### **Verbalized Trade-offs and Verdicts**  
  1. **Most Eliminative Requirement**: **Counterfactual Validity**.  
     - **Eliminates**: Criteria ignoring treatment effects (e.g., calibration on observed outcomes, FNR balance without counterfactual Y).  
     - **Survives**: Calibration + FNR balance *for counterfactual risk*, if achievable.  

  2. **If We Insist on Counterfactual Validity**:  
     - **Retain**: Calibration (counterfactual), FNR balance (counterfactual), Selective-Label Correction.  
     - **Sacrifice**: Proxy-Label Validity (unless access gaps are measurable).  
     - **Tension**: FNR balance remains incompatible with calibration under base-rate differences.  

  3. **Non-negotiable Core**:  
     - **Must Have**: Counterfactual Validity, Within-Group Calibration, Selective-Label Correction.  
       *Rationale: Without these, scores misrepresent risk and replicate bias.*  
     - **Trade Preference**: Equality of FPR (irrelevant for harm mitigation).  

  4. **Feasible Path**:  
     - Prioritize **calibration** (clinical necessity) and **counterfactual validity** (correct target).  
     - **Relax FNR balance** (preference) → Accept higher missed cases in the higher-risk group.  
     - **Mitigate Harm**: Allocate visits by group-specific thresholds (e.g., ensure top *k* patients per group receive visits). This satisfies calibration and reduces FNR disparity but may violate "equal treatment" norms.  

  ---

  ### **Final Verdict**  
  - **Deployable Fairness Criterion**:  
    **Calibrated counterfactual scores + Selective-label correction + Group-specific thresholds**.  
    - *Why*: Ensures scores are clinically meaningful (calibration), account for past bias (selective-label), and approximate FNR balance pragmatically.  
  - **Sacrifices**: Strict FNR equality (due to base rates) and perfect Proxy-Label Validity.  
  - **Mitigation**: Monitor access-related features and adjust allocation quotas if disparities worsen.  

  > **Summary**: Insist on calibration, counterfactual validity, and selective-label correction. Compromise on FNR balance via group-specific thresholds, and acknowledge proxy limitations. This meets clinical needs while minimizing allocative harm.
