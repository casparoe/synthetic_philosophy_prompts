     - *Requirement:* The model must account for the fact that the outcome (readmission) is a proxy for deteriorating health and that prior access to care affects both the outcome and the group membership. This might translate into requiring that the model does not use features that are direct proxies for prior access (if they are not causally related to the underlying health risk) or that we adjust for the differential quality of the proxy across groups. However, this is a challenge because we don't have the ground truth of deteriorating health.
