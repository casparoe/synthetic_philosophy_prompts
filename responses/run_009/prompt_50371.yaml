  ### **Handout: Does History Repeat Itself? A Decision Tree**  
  *Use your intuition to answer the questions below—no prior reading required. Follow your answers to discover which historical thinker's view aligns with yours.*  

  ---

  #### **Start Here: Question 1**  
  **Do you see a clear pattern in how history unfolds?**  
  - **No** (History feels random or chaotic) → **Leaf 1: Randomness/No Pattern** (e.g., some postmodern views).  
  - **Yes** (History follows a discernible pattern) → **Question 2**.  

  ---

  #### **Question 2: What kind of pattern?**  
  - **Cyclical** (History repeats in loops or seasons) → **Question 3A**.  
  - **Linear** (History moves in one direction, like an arrow) → **Question 3B**.  

  ---

  ### **Cyclical Path**  
  #### **Question 3A: What "thing" undergoes the cycle?**  
  *(Choose the scale that feels most natural)*  
  - **Political regime** (e.g., a nation’s government type: monarchy, democracy, etc.) → **Question 4A**.  
  - **Ruling dynasty** (e.g., a royal family’s rise and fall) → **Question 4A**.  
  - **Whole civilization** (e.g., empires like Rome or China) → **Question 4A**.  

  #### **Question 4A: Can people break the cycle?**  
  *(If people are wise or virtuous, could they escape the pattern?)*  
  - **Yes** (Cycle isn’t inevitable) → **Question 5A**.  
  - **No** (Cycle is unavoidable) → **Question 5A**.  

  #### **Question 5A: Does history have an "endpoint"?**  
  *(Is there a final goal or conclusion to the whole story?)*  
  - **Yes** (Cycles lead to a finale) → *Unoccupied leaf*: No major thinker holds this view (likely unattractive—why have cycles if they end?).  
  - **No** (Cycles repeat forever) → **Match your answers to Leaves 2–6 below**.  

  ##### **Cyclical Leaves**  
  - **Leaf 2: Polybius (anacyclosis)**  
    *If you chose:* Political regime + No escape + No endpoint.  
    *View:* Constitutions (e.g., monarchy → democracy → tyranny) rotate inevitably.  

  - **Leaf 3: Ibn Khaldun (dynastic cycle)**  
    *If you chose:* Ruling dynasty + No escape + No endpoint.  
    *View:* Dynasties rise with group cohesion (*asabiyyah*), decay over 3–4 generations, and repeat.  

  - **Leaf 4: Vico (corsi e ricorsi)**  
    *If you chose:* Whole civilization + No escape + No endpoint.  
    *View:* Civilizations cycle through divine/heroic/human ages, collapse, and restart.  

  - **Leaf 5: Spengler (organic cycle)**  
    *Also matches:* Whole civilization + No escape + No endpoint.  
    *View:* Cultures are like organisms with fixed lifespans (birth → growth → decline → death).  
    **⚠️ Note:** Vico and Spengler share this leaf! Spengler sees biology as the driver; Vico emphasizes human choices.  

  - **Leaf 6: Toynbee (challenge-and-response)**  
    *If you chose:* Whole civilization + **Yes** escape + No endpoint.  
    *View:* Civilizations thrive or collapse based on responses to crises—breakdown is *not* fated.  

  ---

  ### **Linear Path**  
  #### **Question 3B: What’s the overall direction?**  
  - **Progress** (Things improve over time) → **Question 4B**.  
  - **Decline** (Things get worse over time) → **Question 4B**.  

  #### **Question 4B: Is there a fixed "endpoint"?**  
  *(Is history moving toward a specific final state?)*  
  - **Yes** → **Question 5B** (if you chose Progress) or **Leaf 10** (if you chose Decline).  
  - **No** → **Match your answers to Leaves 7–9 below**.  

  ##### **Linear Leaves (No Endpoint)**  
  - **Leaf 7: Enlightenment progress**  
    *If you chose:* Progress + No endpoint.  
    *View:* Reason/science drive endless improvement (e.g., Condorcet).  

  - **Leaf 8: Declinism**  
    *If you chose:* Decline + No endpoint.  
    *View:* Society decays steadily (e.g., moral collapse in some conservative thought).  

  - **Leaf 9: ✳️ No major position**  
    *If you chose:* Progress + No endpoint + *other specifics*.  
    *Note:* All progress-views with no endpoint converge on Leaf 7.  

  #### **Question 5B (Progress + Endpoint): How is the endpoint achieved?**  
  - **Human effort** (e.g., revolution, innovation) → **Leaf 10**.  
  - **Divine/supernatural force** → **Leaf 11**.  

  ##### **Linear Leaves (With Endpoint)**  
  - **Leaf 10: Marxist stages**  
    *If you chose:* Progress + Endpoint + Human effort.  
    *View:* History progresses through class struggles to a communist utopia.  

  - **Leaf 11: Christian teleology**  
    *If you chose:* Progress + Endpoint + Divine force.  
    *View:* History moves toward God’s kingdom (e.g., redemption at the Second Coming).  

  - **Leaf 12: Terminal decline (unattested)**  
    *If you chose:* Decline + Endpoint.  
    *View:* Decline ends in total collapse (e.g., apocalypse). **⚠️ Note:** No major thinker occupies this leaf—likely because decline views avoid endpoints to emphasize decay.  

  ---

  ### **Summary of Leaves**  
  1. **Randomness/No Pattern**  
  2. **Polybius** (anacyclosis)  
  3. **Ibn Khaldun** (dynastic cycle)  
  4. **Vico** (corsi e ricorsi)  
  5. **Spengler** (organic cycle) *[Shares Leaf 4 with Vico]*  
  6. **Toynbee** (challenge-and-response)  
  7. **Enlightenment progress**  
  8. **Declinism**  
  9. *Empty* (All covered by Leaf 7)  
  10. **Marxist stages**  
  11. **Christian teleology**  
  12. **Terminal decline** (unattested)  

  ---

  ### **Key Notes for the Tree**  
  - **Shared Leaf (Vico/Spengler):** Both see civilizations cycling unavoidably without an endpoint, but Vico focuses on human institutions, while Spengler treats cultures as biological organisms. Toynbee avoids this leaf by allowing escape.  
  - **Unoccupied Positions:**  
    - Cyclical + Endpoint: Unattractive (cycles imply eternity; an endpoint contradicts this).  
    - Decline + Endpoint: Unexplored (declinists prefer endless decay for rhetorical impact).  
  - **Tree Logic:** 5 questions → 12 possible leaves, but only 10 are meaningfully filled. Covers all requested thinkers.  
  - **Handout Fit:** Designed for 2 pages. Use as a discussion starter—thinkers can be explored further in readings!  

