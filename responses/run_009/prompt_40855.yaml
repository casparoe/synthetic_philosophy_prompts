  The poem should start presenting the bald/not-bald lines as straightforward claims, then introduce doubt through historical absence and the emptiness of the title. The final stanza must clearly show both claims void due to referential failure.

  For the Meinong nod, I consider referencing "beyond being" in a way that doesn't undermine Russell's solution. The historical reference to 1789 serves double duty - grounding the example while reinforcing nonexistence.

