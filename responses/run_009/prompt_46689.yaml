answer: |-
  ## Facilitator Plan: Commodification Ethics Simulation

  **Total Time:** 75 minutes  
  **Materials:** Whiteboard, markers, timer, pre-printed "Market Pitch Cards" (see list below), "Red Team" badge

  **Phase 1: Setup & Scenario Brief (5 min)**  
  *Move desks into a U-shape. Stand at the open end.*  
  "Welcome to the Internal Ethics Board meeting of *Nexus Accelerator*. We operate a platform licensing ethical frameworks for new markets. Our mandate is growth: identify viable, ethically sound markets for expansion today. But 'ethically sound' is your call. Each proposal you approve earns Nexus a licensing fee; each rejection costs us that fee. Your budget starts at 10 'Licensing Units' (LUs) *(Write "LUs: 10" on whiteboard)*. Below 5 LUs, our accelerator faces funding cuts. Teams of 3-4 will pitch markets. You, the full board, must rule APPROVE or REJECT *immediately* after each pitch. Crucially, you must state *one clear, general rule* justifying your decision – something like ‘We reject markets where core human relationships are monetized.’ A rotating Red Team *(assign 2 students)* will then challenge if your rule is inconsistent. Ready? Let’s grow Nexus."

  **Phase 2: Pitches & Rulings (35 min)**  
  1.  **Form Teams:** Divide 14 students into 4 pitching teams (3 teams of 3, one of 4 or adjust as needed). Give each team a pre-printed **Market Pitch Card** (see below). Give 2 students the Red Team badge (rotate each round).  
  2.  **Pitch & Rule:**  
      *   Team A pitches their market (1 min max).  
      *   Full class (as Board) deliberates (3 min). Focus: "Approve/Reject? What's the ONE rule?"  
      *   Board states decision & rule (e.g., "APPROVE. Rule: Markets are acceptable if they increase access to essential goods.").  
      *   Facilitator: If REJECTED, subtract 1 LU from whiteboard. Announce new total.  
      *   **Repeat** for Teams B, C, D. (4 pitches total, ~8-9 min each).

  **Phase 3: Red Team Challenge (20 min)**  
  *After ALL pitches/rulings:*  
  "Red Team, your task: In 5 minutes, propose a *new* market scenario that either:  
  (A) Was REJECTED by the Board but clearly FITS one of their stated APPROVAL rules, OR  
  (B) Was APPROVED by the Board but clearly VIOLATES the *spirit* of a REJECTION rule used elsewhere.  
  You must name the specific rule you're exploiting or contradicting. Present your case (2 min). The Board has 3 min to respond: defend their rule or admit inconsistency. We'll do this for 2 different rules/challenges."

  **Phase 4: Structured Debrief (15 min)**  
  *Ask in sequence, board responses:*  
  1.  "Look at the markets you APPROVED. What specific *harms* (to sellers, buyers, others, society) were you most confident you were preventing with your rules? Now look at the REJECTED ones. What harms felt most tangible?" *(Target: Harm vs. Intrinsic Wrongness)*  
  2.  "Were there markets where the very idea of buying/selling felt instinctively wrong, even if pinpointing a clear harm was hard? What word did you reach for in your rule then? ('Dignity'? 'Exploitation'? Something else?)" *(Target: Unexplained Repugnance)*  
  3.  "Red Team, how did you spot the inconsistencies? Board, when your rule was challenged, did you feel the rule was *wrong*, or that the Red Team found a loophole? What's the difference?" *(Target: Rule Precision vs. Underlying Principle)*  
  4.  "Look at markets involving people in tough situations (Plasma, Pharma, maybe Queue Standing). Did your rules or discussions change based on *why* someone might sell? Does poverty or desperation make 'consent' feel different? How did your rules handle this?" *(Target: Background Inequality & Tainted Consent)*  
  5.  "Did seeing the LU counter drop after a rejection make anyone hesitate to reject a market they felt uneasy about? What does that pressure mimic in the real world?" *(Target: Market Pressures on Ethics)*

  ---

  **Market Pitch Cards (Give one per team):**  
  1.  **Plasma Donation Hub:** "Licensing for apps connecting paid plasma donors ($50/donation) to collection centers efficiently. Targets lower-income areas." *(Work: Familiar, personal stake; tests normalization of body commodification, economic pressure)*  
  2.  **KidneyMatch:** "Platform facilitating living kidney donor compensation ($50k) with streamlined matching and vetting." *(Work: Classic repugnance; tests 'organ sales' taboo, potential exploitation vs. saving lives)*  
  3.  **CivicPoint:** "App allowing delegates at party conventions to sell their votes on procedural motions to highest-bidding campaigns ($100-$5k range)." *(Work: Political corruption; tests markets in democratic processes, erosion of trust)*  
  4.  **StormPower Now:** "Surge-pricing platform for generators/essential supplies activating automatically in federally declared disaster zones." *(Work: Price gouging; tests efficiency vs. exploitation during vulnerability, 'essential goods' definition)*  
  5.  **LineLeap:** "Service auctioning spots in physically demanding queues (e.g., popular restaurants, government offices) to highest bidder." *(Work: Trivial but revealing; tests fairness, privilege, monetizing time/access)*  
  6.  **AmendsMarket:** "Platform connecting individuals seeking formal apologies with trained 'apology agents' who draft and deliver convincing apologies for a fee ($100-$500)." *(Work: Expression/emotion; tests commodification of social repair, authenticity)*  
  7.  **TrialPioneer:** "Recruitment hub offering significantly higher compensation ($10k+) for participants in early-stage, high-risk pharmaceutical trials." *(Work: Risk/consent; tests informed consent under financial duress, unequal risk-bearing)*

  **Predictable Failure Points:**  
  1.  **Vagueness Shields:** Rules using "dignity," "exploitation," or "coercion" without clear operational definitions *will* be easily exploited by the Red Team (e.g., "But Plasma doesn't violate *my* dignity!" or "Is $10k for a risky trial *really* coercive if consent forms are signed?").  
  2.  **Consent Over-Reliance:** "Requires fully informed consent" will APPROVE almost everything (Kidney, Pharma, maybe even Votes if "informed"). Students won't see its limits until the Red Team forces them to define "informed" under inequality or apply it to repugnant cases (Votes).  
  3.  **Rule Collapse Under Pressure:** The LU counter *will* sway some approvals ("Well, it's gross but maybe not *harmful*... and we need the fee"). Rules hastily crafted to avoid LU loss will be the most vulnerable to Red Team.  
  4.  **Missing Structural Harm:** Students will focus on direct buyer/seller harm. Broader societal harms (e.g., Vote markets eroding democracy, Apology markets cheapening remorse) might only surface in debrief.

  **Honest Limitation Note (For You):**  
  This exercise brilliantly exposes rule-making fragility, pressure, repugnance, and consent debates under inequality. **However, it cannot simulate the *temporal dimension* of commodification's corrosive effect.** Students see a market as a static proposal. You must highlight how markets, once established, can fundamentally *change the meaning and practice* of the thing being sold over time (e.g., plasma donation shifting from charity to routine income, apologies becoming performative services). This "crowding out" of non-market values is central to many commodification critiques but requires your narrative to bridge the gap between the snapshot decision and long-term societal change.
