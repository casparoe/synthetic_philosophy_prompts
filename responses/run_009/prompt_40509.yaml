prompt: |-
  When I accepted a two-year posting in Tokyo, a well-traveled colleague told me the rule for everyday conduct abroad is simply "when in Rome, do as the Romans do": follow the local conventions on tipping, queueing, jaywalking, and the rest, and leave your own at home. That sounded right at first, but the longer I'm here the more I wonder how much that one line actually commits me to. Could you lay out the distinct precise claims it might be making -- from harmless prudential advice about avoiding friction and awkwardness, to an epistemic point about locals knowing the point of their own conventions better than a newcomer could, to the strong claim that participating in a coordination practice itself generates a moral obligation that binds visitors just as it binds natives -- and say for each reading whether it's plausible and whether it settles what I should do? I'm especially interested in two cases: whether any reading obligates me to follow a local convention I think is worse than the one I left behind (say, a tipping norm that seems to trap servers in lower pay, or a queuing norm that strikes me as less fair), and whether any reading would license the locals to press their conventions on me when my deviating harms no one -- or whether in those cases "when in Rome" is doing no real argumentative work and is just a polite way of ending the discussion.
reasoning: |-
  Okay, the user is asking about the deeper implications of the "when in Rome, do as the Romans do" advice they received before moving to Tokyo. They're questioning how much this principle actually obligates them, especially when local conventions clash with their personal values. 

  Hmm, this seems like someone who's intellectually curious and ethically thoughtful—they're not just accepting surface-level advice but probing its philosophical foundations. The fact they're specifically contrasting harmless conventions (like queuing norms) with potentially harmful ones (like tipping systems that exploit workers) suggests they're wrestling with practical ethics in cross-cultural contexts. 

  Let me break this down systematically. First, the proverb operates on multiple levels: pragmatic, epistemic, and moral. The user's core concern seems to be whether conformity is merely convenient or actually obligatory—especially when they perceive local customs as inferior or unjust. 

  *Scratching head* The tricky part is that "harmless" deviations (like jaywalking on an empty street) test whether the moral claims hold water. If locals get offended despite no tangible harm, is that their problem or the visitor's obligation? And conversely—if a custom IS harmful (like discriminatory practices), does "when in Rome" become morally indefensible? 

  *Pausing to consider* The user might also be hinting at a power dynamic: when does respecting culture slide into cultural coercion? That unspoken tension between "fitting in" and "compromising principles" is probably what's keeping them up at night. Their examples about tipping and queuing suggest they're observing real-world consequences, not just theorizing. 

  *Structuring thoughts* I should clarify each interpretation's plausibility but emphasize that the proverb collapses when local practices cause harm. The moral obligation version only works if the convention is ethically neutral—once it's unjust, the visitor's critique might actually be a duty. 

  *Noting subtext* The user seems to want permission to ethically dissent while remaining respectful. They're likely frustrated by the proverb being used as a conversation-ender when they see legitimate flaws. I'll validate that the phrase can indeed be a thought-stopping cliché in debates about harmful norms. 

  *Final framing* Ultimately, this isn't about rejecting Japanese culture—it's about thoughtfully engaging with it. The most honest answer might be: "Follow local customs when they're benign or beneficial; challenge them thoughtfully when they're not; and recognize that 'when in Rome' alone can't resolve ethical conflicts."
answer: |-
  Your colleague's advice touches on deep philosophical questions about cultural norms, moral obligations, and practical wisdom. Here's a breakdown of distinct interpretations of "When in Rome," their plausibility, and how they apply to your concerns—especially regarding potentially harmful conventions or harmless deviations:

  ---

  ### **1. Prudential/Pragmatic Advice**  
  **Claim:** Following local conventions avoids social friction, awkwardness, or practical consequences (e.g., offending locals, fines for jaywalking).  
  **Plausibility:** High. This is empirically sound—violating norms can lead to confusion, resentment, or penalties.  
  **Settles what you should do?** Yes, *if* your goal is smooth integration.  
  **Your cases:**  
  - **Worse convention?** No obligation—only advice to avoid backlash.  
    *(e.g., If a tipping norm traps servers, you might still tip to avoid conflict, but it's not morally required.)*  
  - **Harmless deviation?** No obligation. If no backlash occurs (e.g., jaywalking on an empty street), deviation is neutral.  
  **Role of the phrase:** Practical wisdom, not moral argument.  

  ---

  ### **2. Epistemic Humility**  
  **Claim:** Locals understand *why* their conventions exist (historical context, subtle efficiencies, unspoken values) better than outsiders. Your judgment of "worse" may stem from ignorance.  
  **Plausibility:** Moderate. Locals often grasp nuances (e.g., why "messy" queues work in some cultures), but not universally—norms can persist due to inertia or power structures.  
  **Settles what you should do?** Advises deference initially, but not blind adherence.  
  **Your cases:**  
  - **Worse convention?** Investigate first. *Example:* A "less fair" queue might build community or reflect values beyond efficiency. But if confirmed harmful (e.g., tipping enabling low wages), deference isn't owed.  
  - **Harmless deviation?** If locals insist despite no harm, their reaction may reveal deeper values (e.g., respect for order).  
  **Role of the phrase:** Encourages learning, not uncritical obedience.  

  ---

  ### **3. Moral Obligation via Coordination Practices** (Strong Claim)  
  **Claim:** Conventions (like driving on the left) create *moral duties* because they solve coordination problems. By participating in the society, you consent to its rules—even as a visitor. Breaking them "free-rides" on others' compliance.  
  **Plausibility:** Controversial. Philosophers like David Hume and modern legal theorists support this for *traffic-like rules*, but extending it to *all norms* is dubious.  
  **Settles what you should do?** Only for conventions essential to social function (e.g., queueing to prevent chaos).  
  **Your cases:**  
  - **Worse convention?** *Not binding if harmful.* Obligation assumes the convention is broadly beneficial. A norm trapping servers in poverty fails this test.  
  - **Harmless deviation?** *Not binding if no coordination breakdown.* Jaywalking alone on an empty street doesn’t undermine the system.  
  **Role of the phrase:** Justifies obligation only for core coordination norms.  

  ---

  ### **4. Expressivist Respect for Culture**  
  **Claim:** Following local customs shows respect for the community and its autonomy. Deviation signals arrogance or cultural dismissiveness.  
  **Plausibility:** Context-dependent. Respect matters, but slavish imitation can be performative. Locals often appreciate sincere effort over perfection.  
  **Settles what you should do?** When norms symbolize cultural identity (e.g., bowing in Japan), adherence expresses goodwill.  
  **Your cases:**  
  - **Worse convention?** Not obligated if the norm violates universal ethics (e.g., discrimination). Balance respect with moral courage.  
  - **Harmless deviation?** If locals perceive it as disrespectful (e.g., ignoring a greeting ritual), it ceases to be "harmless."  
  **Role of the phrase:** Highlights cultural sensitivity, but not absolute.  

  ---

  ### **5. Social Contract Theory**  
  **Claim:** By entering a society, you tacitly agree to its rules. Violating them breaches this contract.  
  **Plausibility:** Weak for short-term visitors. Why would a 2-year stay imply consent to *all* norms? More plausible for immigrants.  
  **Settles what you should do?** Only for fundamental rules (e.g., laws).  
  **Your cases:**  
  - **Worse convention?** No obligation to follow unjust norms.  
  - **Harmless deviation?** No breach if no social cost.  

  ---

  ### **Key Conclusions**  
  1. **For "worse" conventions (e.g., harmful tipping norms):**  
     - No interpretation *obligates* you to comply. Prudence or respect may suggest temporary adherence, but moral criticism or quiet deviation can be justified.  
     - *Action:* Weigh the harm of the norm against the backlash from deviation. If the norm is exploitative, subvert it strategically (e.g., tipping extra while advocating for change).  

  2. **For "harmless" deviations (e.g., jaywalking alone):**  
     - Only the **expressivist** view might demand compliance (if locals *feel* disrespected). Other views permit deviation.  
     - *Reality check:* If locals protest despite no tangible harm, "When in Rome" is often a *conversation-ender* asserting cultural authority. Politely push back: *"I see no harm here—can you help me understand why this matters?"*  

  3. **When the phrase does "no work":**  
     It’s rhetorical coercion when:  
     - Used to shut down critique of harmful norms.  
     - Invoked for trivial deviations with no social cost.  
     - Demands conformity without explaining the norm’s purpose.  

  ---

  ### **A Balanced Approach in Tokyo**  
  - **Adopt neutral/harmless norms:** Queueing, shoe removal, polite greetings.  
  - **Critique harmful norms thoughtfully:** Research first—is the tipping norm truly exploitative, or does it balance other factors (e.g., higher base pay)? Voice concerns respectfully if asked.  
  - **Deviate minimally when harmless:** Jaywalking on an empty street likely falls here—but note that Japanese norms often emphasize collective order over individual convenience.  

  Ultimately, "When in Rome" is best as a **starting point for humility**, not a moral absolute. Adapt where it fosters mutual respect or prevents harm, but remain a conscientious agent—not a cultural automaton.
