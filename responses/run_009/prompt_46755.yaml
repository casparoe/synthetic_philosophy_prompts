  Okay, the user teaches a graduate seminar on democratic theory and is crafting a take-home final exam. They're frustrated that typical questions on the boundary problem allow students to just recite principles like all-affected interests and all-subjected-to-coercion with counterexamples, without deeper analysis. They want a question that forces adjudication between conflicting principles in a fictional scenario.

  The scenario they've drafted - Costa Serrana with its island inhabitants, guest workers, transboundary pollution, future generations, and expat voters - is cleverly designed to create tension between different democratic inclusion principles. Each group pulls in a different direction: the islanders challenge the citizenship-status quo, guest workers highlight partial subjection, downstream neighbors represent pure affectedness without subjection, future generations force temporal expansion, and expats test territorial detachment. 

  The user's unspoken need seems to be cultivating higher-order thinking: moving beyond taxonomy to principled decision-making under conflict. They want students to confront three core challenges: 1) diagnosing why each group strains particular principles, 2) resolving conflicts when principles diverge (e.g., affected vs. subjected for the mine victims), and 3) grappling with the foundational regress problem - who decides the deciders?

  For the exam question, I need to maintain this multi-directional tension while sharpening the philosophical pivot points. The marking scheme should penalize mere description (e.g., "Student X just lists principles") and reward adjudication (e.g., "Student Y argues why subjection should override affectedness for guest workers based on reciprocity"). The model answer must demonstrate taking stands - perhaps prioritizing subjection for resident groups while carving exceptions for irreversible harms like the pollution.

  The 25-mark breakdown should force engagement with all layers: diagnosis (4 marks), conflict resolution (10 marks), regress problem (6 marks), plus coherence and originality (5 marks). Typical fumbles to note include conflating principles for the islanders, ignoring partial subjection of guest workers, and hand-waving the regress issue rather than proposing concrete institutional responses like constitutional precommitments.
answer: |-
  Here is the complete exam package as requested, formatted as continuous prose without headings or bullet points:

  **Exam Question:** You have ninety minutes to answer the following question, worth 25 marks. The Republic of Costa Serrana faces complex questions about the proper boundaries of its democratic demos. Its current demos includes all adult citizens residing within or outside its territory. Specific groups under consideration are: (1) The inhabitants of Isla Cardonal, annexed sixty years ago, who pay Costa Serranan taxes and are subject to its courts but were never granted citizenship. (2) Approximately 400,000 guest workers on rolling five-year permits, residing and working in Costa Serrana, some for over two decades, subject to laws and paying some taxes, but without a citizenship pathway. (3) Roughly 2 million people in the neighboring Republic of Alvea, dependent on a river contaminated by toxic waste leaching from a lithium mine wholly within Costa Serrana and governed solely by its laws. (4) Future generations whose interests are invoked in a national debate due to Costa Serrana's declining birthrate. (5) Around 300,000 adult Costa Serranan citizens residing permanently abroad but voting by mail. Critically evaluate the case for including or excluding each of these five groups within the Costa Serranan demos for decision-making processes relevant to them. Your answer must do more than simply apply the all-affected interests and all-subjected principles superficially; it must diagnose why each group presents distinct challenges to different inclusion principles, explicitly adjudicate conflicts where these principles yield contradictory verdicts, and confront the foundational objection that democratic principles cannot resolve the boundary problem without circularity. A strong answer will take reasoned positions justified by democratic theory.

  **Model Answer (Approx. 700 words):** Determining Costa Serrana's demos requires confronting the limitations of singular principles and acknowledging necessary trade-offs. The Isla Cardonal inhabitants are the clearest case for immediate inclusion. While the all-affected principle might seem secondary given their physical location, their *subjection* to Costa Serrana's coercive legal system, especially courts and taxation, is comprehensive and enduring. Sixty years of this condition, without the franchise, constitutes a profound democratic deficit. The all-subjected principle demands their inclusion as a matter of basic legitimacy, outweighing historical contingencies of annexation without citizenship. The guest workers present a more complex case of partial subjection. They are undeniably subject to Costa Serrana's laws regarding employment, residence, public order, and criminal justice during their stay, and they contribute economically, often paying consumption and possibly income taxes. However, the temporary nature of their permits (even if rolled over) and the explicit lack of a citizenship pathway signal a limited political relationship. Full inclusion in the demos is not necessarily required by the all-subjected principle alone, as their subjection is tied to residency status and lacks the permanence implied for citizens. A strong case exists for granting them local voting rights or specific consultative mechanisms regarding laws directly impacting their work and residency, but full national enfranchisement oversteps the reciprocity implied by their temporary status. The Alveans affected by the lithium mine pollution represent the purest challenge to the all-subjected principle. They are undeniably and significantly *affected* by Costa Serrana's sovereign decisions regarding the mine, facing severe harm to their health and environment. However, they are not subject to Costa Serrana's coercive power; they live under Alvean jurisdiction. Including them in the Costa Serranan demos is impractical and violates the core idea of self-determination bounded by territorial jurisdiction. The solution lies not in expanding the Costa Serranan demos, but in creating robust transnational governance mechanisms – binding treaties, joint environmental commissions, or international arbitration – that give Alveans procedural standing and influence over decisions harming them, satisfying the all-affected principle's demand for input without conflating demoi. Future generations pose a distinct temporal challenge. They are profoundly affected by present decisions but cannot be "subjected" in the contemporary sense nor participate directly. The all-affected principle compellingly suggests their interests must be represented. This requires institutional innovation *within* the current demos, such as independent guardians, mandatory future impact assessments, constitutional environmental protections, or supermajority requirements for irreversible decisions – mechanisms ensuring the present demos acts as a trustee, not a pure majoritarian sovereign over the future. Their inclusion isn't electoral but fiduciary. The expatriate citizens are the least problematic. Their enduring formal citizenship, maintained through voting rights, signifies continued membership. While their day-to-day subjection to Costa Serrana's laws might be weaker than residents', they retain strong ties (familial, financial, cultural) and remain affected by key national decisions (foreign policy, citizenship laws, taxation on retained assets). The all-subjected principle, interpreted flexibly to include the enduring bond of citizenship and ongoing affectedness, justifies their continued inclusion. Adjudicating conflicts reveals the need for a subjection-first baseline. For resident populations (Isla Cardonal, guest workers), subjection to the state's coercive apparatus is paramount for legitimacy. For non-residents profoundly affected but not subjected (Alveans), transnational governance, not demos expansion, is the answer. Future generations require novel trusteeship. The regress problem – who decides the demos? – is real but not paralyzing. We rely on existing jurisdictional boundaries (like Costa Serrana's recognized territory) and constitutional commitments made by prior demoi as a starting point. The injustice of excluding the long-subjugated Isla Cardonal inhabitants is a powerful motivator for the current, imperfectly constituted demos to rectify the boundary, demonstrating that the regress, while theoretically deep, can be addressed through normative argument and institutional reform within existing frameworks.

  **Marking Scheme (25 marks total):** Students scoring well must hit five key points. First, for four marks, the answer must correctly diagnose the specific challenge each group poses to at least two distinct inclusion principles, such as explaining that Isla Cardonal challenges the citizenship baseline by being subjected without representation, guest workers expose partial subjection without permanence, Alveans reveal profound affectedness without subjection, future generations highlight the temporal limitation of current principles, and expatriates test the territorial basis of subjection; a typical fumble is conflating the principles or misidentifying why a group is hard for a specific principle, like claiming Alveans are subjected. Second, for ten marks, the answer must explicitly adjudicate conflicts between principles for at least three groups, taking a clear stance justified by theory, such as prioritizing subjection for residents like the islanders while arguing affectedness alone is insufficient for Alveans requiring transnational solutions, or explaining how guest workers' partial subjection warrants limited rights but not full inclusion; students often fumble by merely stating principles conflict without resolving them or taking a stance. Third, for six marks, the answer must engage substantively with the regress/bootstrapping problem, acknowledging it and offering a plausible theoretical or practical response, such as relying on existing jurisdictional boundaries plus normative imperatives for reform; the common fumble is mentioning the problem only superficially or dismissing it without argument. Fourth, for three marks, the answer must demonstrate coherent application of theoretical reasoning across all five cases, showing a consistent underlying logic even if different principles apply; fumbling involves inconsistent or ad-hoc reasoning for different groups. Fifth, for two marks, the answer should show originality or depth in justifying stances beyond simple textbook recitation, such as creatively applying trusteeship to future generations or carefully dissecting degrees of subjection for guest workers; fumbling means staying purely descriptive or relying solely on lecture notes without critical engagement.
