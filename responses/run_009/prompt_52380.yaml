    "residue_summary": "the common thread, if any, in what failed to translate",
    "verdict": "one of: vocabulary_gap, framework_inflated, mixed — followed by two or three sentences of justification, including a definite statement on whether the Popperian/Gregorian distinction survives",
    "confidence": {
      "overall": "low, medium, or high, with one sentence saying why",
      "least_sure_point": "the single claim in this response I am least confident about, and why",
      "what_would_change_my_mind": "one sentence"
    }
  }
  ```

  Take the confidence fields seriously: I would much rather see a stated "low" with an honest reason than a confident tone covering a guess, and where you rely on a contested or minority reading of Dennett rather than the standard one, flag that in the least_sure_point field rather than presenting the interpretation as settled.
