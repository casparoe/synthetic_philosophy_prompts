prompt: |-
  I'm taking a seminar on the ethics of war and we just finished the module on whether combatants on both sides of a war are moral equals (Walzer says yes sort of, McMahan and the revisionists say no way). I mostly side with the revisionists on the theory but my gut verdicts on actual cases are a mess, so I want to hire you as a just war theorist for this exercise: think hard, maybe brainstorm a couple candidate principles before settling, and then give me a real reflective-equilibrium treatment — a principle (or two competing ones), stated precisely, with each clause motivated by one of my cases, and an honest accounting of which of my verdicts you had to overturn and why.

  Here are the verdicts. A conscript into an unjust war of aggression, who fights hard and kills three defenders after his country invades: I don't think he's a murderer, and I don't think the defenders were wrong to kill him — those both feel right at the same time, which is already weird. A volunteer pilot in the same unjust war who bombs a military airbase and kills mechanics: he's culpable, though less than if he'd hit a school. A mercenary hired by the just side to defend against that same aggression: feels dirty somehow, but I can't find anything wrong with him. On the just side, a soldier who volunteered specifically because he was eager to kill: fine, killing enemy combatants, even though I hate his motive. Allied bomber crew over Dresden in an otherwise just war: very wrong, as wrong as the unjust pilot maybe, which is awkward since the bomber crew's war is just. A fourteen-year-old rebel child soldier: excused, obviously, but I notice I excuse him more easily than I excuse the conscript, which can't be right since the conscript faced prison and the kid faced worse. A combat medic on the unjust side who never fires a shot: not liable to anything, though he's doing more good for the unjust cause than some riflemen. And the pair that keeps me up: I think a defender in a just war may permissibly kill an attacking conscript, AND I think that conscript, if he survives and is captured, deserves to be released at war's end — but I can't hold both without thinking permissible killing can target someone who isn't culpable, which sounds like I'm collapsing back into Walzer.

  My tentative principle is something like: you're liable to defensive harm only if you (a) pose a threat, (b) had a reasonable opportunity to know the war is unjust, and (c) weren't coerced to a degree that excuses — but I suspect (b) and (c) together excuse nearly everyone in modern conscript armies, which would mean the revisionists are right in theory and wrong about every actual war. Test the principle against my cases, patch or replace it, and then tell me what it says about two cases I haven't listed: a private military contractor guarding a munitions factory on the unjust side, and a voluntary human shield standing in front of that factory who's unarmed but knowingly keeping the bombs at bay. Which verdicts of mine do you have to throw out to make it work?
reasoning: |-
  Okay, the user is grappling with the moral equality of combatants in war, a key debate in just war theory. They've presented several intuitive verdicts on specific cases that seem inconsistent with both Walzer's traditional view and McMahan's revisionist approach. Their frustration is palpable - they feel pulled between theoretical coherence and their moral intuitions about real-world scenarios.

  Hmm... what's really interesting here is how their intuitions cut across standard positions. They reject moral equality in theory but keep circling back to something like it in practice. That conscript case is particularly thorny - they want to say defenders can kill him but he shouldn't be treated as a criminal. That's the core tension. 

  Their proposed principle (threat + knowledge opportunity + absence of coercion) is thoughtful but seems too permissive. If applied strictly, it might excuse nearly all unjust combatants since modern soldiers often have limited information and face institutional coercion. But their own intuitions about the volunteer pilot show they don't want that outcome.

  The user's cases reveal several distinct dimensions of liability: 
  - The voluntary mercenary feels dirty but they can't pinpoint why, suggesting motives might matter less than they think 
  - The eager killer on just side being acceptable points to the primacy of objective acts over subjective states 
  - The child soldier being more excusable than the conscript despite worse coercion shows they're weighting epistemic factors heavily

  Ah! The Dresden case is key - they think the bomber crew is as culpable as the unjust pilot. That suggests consequences and proportionality matter independently of the war's overall justice. This might point toward a dual-track approach where liability depends on both individual responsibility and the objective threat posed.

  For the unaddressed cases: 
  The PMC guarding munitions is clearly liable under any standard - voluntary, knowledgeable contribution to an unjust threat. 
  The voluntary human shield is trickier - they're unarmed but deliberately obstructing defensive action. Probably liable if they could reasonably know the factory serves unjust aims.

  The real breakthrough might be separating liability from culpability. That could resolve their "keeps me up" pair: the conscript poses an objective threat that makes him liable to defensive killing, but his lack of culpability means he shouldn't be punished after capture. This preserves their intuitions without collapsing into Walzer's full moral equality.

  Their revisionist leanings are clear, but they need a framework that accommodates their persistent sense that most soldiers aren't blameworthy. A threshold-based approach to responsibility might bridge this - setting the knowledge requirement high enough that only those who clearly should have known are culpable, while still recognizing liability through threat contribution alone.
answer: |-
  After wrestling with your cases, here's a principled framework that maximizes reflective equilibrium with your intuitions while minimizing revision. We'll need a dual-track approach combining **objective liability** and **subjective culpability**:

  **Principle 1: Objective Liability to Defensive Harm**  
  *A person is liable to defensive harm if they:  
  (a) Functionally contribute to an unjust threat* (material contribution),  
  AND  
  (b) Their contribution is non-trivial and reasonably avoidable* (voluntariness threshold).*

  **Principle 2: Subjective Moral Culpability**  
  *A person is morally culpable for contributing to an unjust threat if they:  
  (a) Knew or should have known (under reasonable epistemic conditions) their cause was unjust* (faulty belief),  
  AND  
  (b) Were not coerced beyond a threshold excusing moral agency* (excusing coercion).*

  ---

  ### How This Fits Your Cases
  1. **Conscript killing defenders**:  
     - *Liable?* YES (satisfies Principle 1: material contribution to unjust threat).  
     - *Culpable?* NO (Principle 2: coercion + likely epistemic deficit excuses).  
     → Explains why defenders may kill him, but he isn't a murderer and deserves release.

  2. **Volunteer pilot bombing airbase**:  
     - *Liable?* YES (material contribution).  
     - *Culpable?* YES (Principle 2: volunteer status implies reasonable opportunity to know; no extreme coercion).  
     → Culpable but less than bombing a school (proportionality).

  3. **Mercenary for just side**:  
     - *Liable?* NO (Principle 1 not met—contributes to *just* threat).  
     - *Culpable?* NO.  
     → "Feels dirty" due to mercenary motive, but motive doesn't affect liability/culpability under this framework.

  4. **Eager killer on just side**:  
     - *Liable?* NO (contributes to just threat).  
     - *Culpable?* NO (bad motive ≠ culpability for unjust harm).  
     → Permissible, as you intuited.

  5. **Allied bomber crew (Dresden)**:  
     - *Liable?* YES (Principle 1: contributes to disproportionate threat against civilians).  
     - *Culpable?* YES (Principle 2: should have known targeting civilians is unjust, regardless of war's overall justice).  
     → Explains why they're as culpable as the unjust pilot: both violate *jus in bello*.

  6. **Child soldier (14yo rebel)**:  
     - *Liable?* YES (material contribution).  
     - *Culpable?* NO (Principle 2: epistemic/voluntariness thresholds not met due to age/coercion).  
     → More readily excused than conscript? Your intuition may over-discount adult conscript's epistemic burden.

  7. **Combat medic on unjust side**:  
     - *Liable?* YES (non-trivial functional contribution to unjust threat by enabling combatants).  
     - *Culpable?* DEPENDS (if conscripted/coerced, likely not; if volunteer, likely yes).  
     → You must revise: he is liable to defensive harm if attackers cannot disable him non-lethally.

  ---

  ### Your "Keeps Me Up" Pair Resolved
  - **Defender killing conscript**: Permissible (Principle 1: objective liability).  
  - **Conscript deserves release**: Justified (Principle 2: lack of culpability).  
  → **No collapse into Walzer**: Liability ≠ culpability. Permissible killing targets *unjust threats*, not *moral guilt*. Culpability governs blame/punishment.

  ---

  ### Revisions Required to Your Intuitions
  You must overturn two verdicts:  
  1. **Unjust combat medic is liable**  
     Why: Medical aid sustains unjust combat capability. If lethal force is necessary to stop the threat, he is a legitimate target.  
     *Tradeoff*: Preserves coherence with "contributing to threat" criterion.

  2. **Child soldier is less excusable than conscript**  
     Why: Conscripts face structural coercion (prison/social pressure) comparable to child soldiers' coercion. Your intuition may undervalue adult conscripts' epistemic burdens.  
     *Tradeoff*: Equalizes excusability for both, aligning with Principle 2.

  ---

  ### New Cases Tested
  1. **PMC guarding munitions factory (unjust side)**:  
     - *Liable?* YES (material contribution; voluntariness threshold met—chose employment).  
     - *Culpable?* YES (should know factory supports unjust war; no coercion).  
     → More culpable than conscript, less than eager volunteer?  

  2. **Voluntary human shield at munitions factory (unjust side)**:  
     - *Liable?* YES (functional contribution by shielding an unjust threat; voluntariness threshold met).  
     - *Culpable?* YES (knowingly aids unjust cause without coercion).  
     → Unlike medic, their role is *designed* to neutralize defensive action—high culpability.

  ---

  ### Why This Beats Your Tentative Principle
  Your initial principle (threat + knowledge opportunity + no coercion) excused too many. The dual-track approach:  
  - Separates **liability** (objective) from **culpability** (subjective).  
  - Lowers voluntariness threshold for liability (merely "non-trivial/reasonably avoidable contribution").  
  - Raises epistemic standard for culpability ("should have known under reasonable conditions").  
  → Captures why conscripts are liable but not culpable, while volunteer bombers are both.

  **Result**: Revisionism holds theoretically, but liability applies more broadly than McMahan suggests—validating your sense that many unjust combatants aren't "murderers" but may still be permissibly killed. Walzer's symmetry survives *in bello* only for liability rules, not moral equality.
