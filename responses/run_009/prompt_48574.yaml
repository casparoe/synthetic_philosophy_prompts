prompt: |-
  I serve on incident review boards for autonomous-vehicle deployments, and our reports keep having to say things like "the failure of the automatic emergency braking system to trigger caused the collision" or, more awkwardly, "the system's decision not to brake was correct, so the collision was caused by the pedestrian's behavior" — and I've come to realize we have no considered view about what makes an absence a cause. Before I look at any particular theory, I want the specification. Set out the desiderata a theory of causation by omission must meet to be adequate for this application: the cases it has to get right (including ones where two redundant safety systems both fail to act, so neither failure is individually necessary for the harm, and ones where a system correctly refrains from intervening and must not come out as a cause); the distinctions it cannot collapse (between an omission and the mere non-occurrence of an event that was never in the offing, between what a system failed to do and what it was in no position to do, between an absence that made a difference and background conditions that were simply in place throughout); and the constraints imposed on it by practice (in law, omissions ground liability only where there was a duty to act, whereas our systems bear no duties — so say whether that asymmetry belongs in the theory of causation or should be kept out of it and handled elsewhere). For each requirement, give the case or consideration behind it, mark which are non-negotiable and which look instead like prejudices of one camp (for instance, the demand that absences be events, or that omission-causation be derivative from causation by whatever event did occur instead), and flag any pair of requirements you suspect cannot be jointly satisfied — that is the part I most want to see. Then, briefly, hold a simple counterfactual-dependence account, a norm-restricted account that ties omissions to breached expectations, and a quasi-event account that identifies each omission with the actual event that happened in its place up against the list. Keep the weight on the criteria; the scorecard should be short.
reasoning: |-
  Okay, the user is deeply involved in incident review boards for autonomous vehicles and is grappling with how to frame causation in reports when systems fail to act or correctly refrain from acting. They need a robust theoretical framework for "causation by omission" that fits their practical needs. 

  First, I need to unpack their core frustration: current reports either awkwardly blame correct non-interventions or vaguely attribute collisions to AEB failures without clear philosophical grounding. The real pain point seems to be inconsistent language that could lead to misguided liability assignments or engineering feedback. 

  Hmm, they're explicitly asking for desiderata before theories—that's smart. They want the criteria first to evaluate existing approaches. The examples they gave are telling: redundant system failures (where neither omission is strictly necessary) and correct non-interventions are critical edge cases. Also, the legal distinction about duties versus technical causation suggests they need to firewall normative judgments from causal analysis. 

  Let me structure this carefully. The requirements should cover: 
  - **Case coverage** (must handle redundant failures, correct non-interventions) 
  - **Distinctions** (omission vs. pure non-occurrence, capability vs. opportunity) 
  - **Practical constraints** (decoupling duty from causation) 

  Ah, and they specifically want tension points flagged—like how "omissions as events" might clash with "avoiding phantom causes." That's crucial because some theories treat omissions as metaphysical entities while others see them as counterfactual gaps. 

  For the quick theory assessment: 
  - **Counterfactual dependence** will stumble on overdetermination (redundant systems) and wrongly blame correct non-interventions 
  - **Norm-based accounts** might conflate duty and causation, which they explicitly want to avoid 
  - **Quasi-event** approaches could misidentify omissions (e.g., conflating "not braking" with "maintaining speed") 

  The legal constraint feels non-negotiable—they can't have "duty" contaminating causal analysis when systems aren't moral agents. But the "preventability" requirement might be flexible if framed computationally (e.g., "system could have physically executed brake command within X ms"). 

  Biggest red flag: requiring omissions to be "difference-makers" while avoiding overdetermination problems. If two redundant systems fail, standard counterfactuals say neither omission alone caused harm—but that violates practical reporting needs. Any adequate theory must bend here, perhaps via causal contribution frameworks. 

  Noticing they didn't mention probabilistic causation. That might be intentional—AV incidents likely demand binary determinations for liability/engineering. Should keep theories deterministic for now. 

  ...Time to organize this into desiderata with tensions highlighted. The "correct non-intervention ≠ cause" vs. "redundant omissions = both causes" conflict will be the litmus test.
answer: |-
  Here is a specification of desiderata for a theory of "causation by omission" in autonomous vehicle (AV) incident review, structured around cases, distinctions, practical constraints, and tensions. I flag non-negotiable requirements (🔒), contentious assumptions (⚠️), and suspected incompatibilities (⚡).

  ---

  ### **I. Core Cases the Theory Must Get Right**
  1.  **Redundant System Failure (Overdetermination):**  
      *Case:* Two independent AEB systems *both* fail to detect the same pedestrian. Either alone could have prevented the collision.  
      *Requirement:* Both omissions must count as causes (neither is "preempted").  
      *Status:* 🔒 Non-negotiable (practical accountability demands attributing causation to each failed subsystem).

  2.  **Correct Non-Intervention:**  
      *Case:* The AEB correctly refrains from braking (e.g., to avoid a rear-end collision) when a pedestrian steps out too late. Collision occurs.  
      *Requirement:* The omission **must not** be a cause.  
      *Status:* 🔒 Non-negotiable (engineering and legal necessity).

  3.  **Single Preventable Failure:**  
      *Case:* Only one AEB system exists; it fails to brake, causing a collision.  
      *Requirement:* The omission is a cause.  
      *Status:* 🔒 Baseline case.

  ---

  ### **II. Critical Distinctions the Theory Must Preserve**
  4.  **Omission vs. Mere Non-Occurrence:**  
      *Distinction:* Failing to brake (an omission) ≠ the non-occurrence of a meteor strike (irrelevant non-event).  
      *Requirement:* Theory must ground omissions in **specific capabilities/expectations** of the system.  
      *Status:* 🔒 Non-negotiable (avoids absurd attributions).

  5.  **Inability vs. Failure to Act:**  
      *Distinction:* A camera-only AEB "failing" to detect a pedestrian occluded by a truck (inability) vs. failing to detect a visible pedestrian (failure).  
      *Requirement:* Only the latter is an omission-cause.  
      *Status:* 🔒 Non-negotiable (reflects system design limits).

  6.  **Absence as Difference-Maker vs. Background Condition:**  
      *Distinction:* The AEB's failure to brake (difference-maker) vs. gravity existing (background condition).  
      *Requirement:* Background conditions are **excluded** as causes.  
      *Status:* 🔒 Non-negotiable (standard in causation).

  ---

  ### **III. Practical Constraints from Context**
  7.  **Decoupling Causation from Duty/Normativity:**  
      *Constraint:* Legal liability requires a "duty to act," but AVs are not moral agents.  
      *Requirement:* Causation by omission **must not** depend on normative concepts like "duty." It should be definable via **system design specs and physical preventability**.  
      *Status:* 🔒 Non-negotiable (to separate technical analysis from legal/ethical judgments).  
      *Handling:* Normative elements (e.g., "should have acted") belong in *fault/liability* phase, **not** causation.

  8.  **Actionability for Engineering:**  
      *Constraint:* Reports must guide system improvements.  
      *Requirement:* Omission-causes must map to **specific components, sensors, or algorithms** that malfunctioned.  
      *Status:* 🔒 Non-negotiable (practical purpose).

  ---

  ### **IV. Contentious Assumptions (Marked as Potential Prejudices)**
  9.  ⚠️ **"Omissions as Events":**  
      Demand that omissions are metaphysical "events" (e.g., "the non-braking").  
      *Status:* Contentious. Not essential if theory can ground omissions without reification.  
      *Risk:* May lead to spurious causes (e.g., "non-braking" as cause even when braking was impossible).

  10. ⚠️ **Derivative Causation:**  
      Demand that omission-causation reduces to causation by "positive" events (e.g., "the system’s decision *to not brake* caused the collision").  
      *Status:* Contentious. May conflate omission with mental states/software outputs.

  ---

  ### **V. Suspected Incompatibilities (⚡)**
  - **⚡ Tension 1: Redundancy (Req 1) vs. Necessity (Req 6):**  
    Standard counterfactual dependence (Req 6) says an omission is a cause only if the harm *would not* have occurred without it. But in redundant systems (Req 1), harm occurs even if only one system fails → neither omission is "necessary." **Any theory must resolve overdetermination**.
    
  - **⚡ Tension 2: Correct Non-Intervention (Req 2) vs. Preventability (Req 3):**  
    Both cases involve "not braking," but one is causal, the other isn’t. **Theory must distinguish using non-normative criteria** (e.g., algorithmic thresholds, physical feasibility).

  ---

  ### **Quick Theory Scorecard vs. Desiderata**
  | **Theory**               | **Red Flags**                                                                 | **Fatal Flaws**                                                                 |
  |--------------------------|-------------------------------------------------------------------------------|---------------------------------------------------------------------------------|
  | **Counterfactual Dependence**<br>(Omission caused harm iff harm wouldn’t occur if it acted) | ⚠️ Fails Req 1 (redundancy: no single omission necessary)<br>⚠️ Fails Req 2 (labels correct non-intervention as cause if braking *would* have helped) | ⚡ Req 1 & Req 2 impossible without major adjustments (e.g., token causation). |
  | **Norm-Restricted**<br>(Omission causes harm iff it breaches a norm/expectation) | ⚠️ Violates Req 7 (smuggles "duty" into causation)<br>⚠️ Ambiguous on Req 5 (inability vs. failure depends on "reasonable expectation") | 🔥 Req 7 non-negotiable: Norms belong in liability, not causation. |
  | **Quasi-Event**<br>(Omission = the positive event that "replaced" it, e.g., "maintaining speed" instead of braking) | ⚠️ Arbitrary identification (Why "maintaining speed" vs. "not-decelerating"?)<br>⚠️ Risk of misattribution (e.g., "maintaining speed" blamed even if braking was impossible → violates Req 5) | 🔥 Fails Req 1 (redundancy: both systems "maintained speed," but neither event caused harm alone). |

  ---

  ### **Conclusion**
  A viable theory **must**:  
  - Resolve overdetermination for redundant systems (⚡ Req 1),  
  - Distinguish *correct* from *faulty* inaction non-normatively (⚡ Req 2 vs. Req 3),  
  - Exclude background conditions and inability (Req 4–6),  
  - Fully decouple causation from duty (🔒 Req 7).  

  **Leading candidate:** A **contrastive, capacity-relative counterfactual theory** (e.g., "Omission caused harm iff, *holding background fixed*, the system *could and should have* acted per its specs, and action *would* have prevented harm"). This can handle redundancy via *causal contribution* (not necessity) and correct inaction via *spec-compliant thresholds*. Legal "duty" remains downstream.
