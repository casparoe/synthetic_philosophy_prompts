answer: |-
  The nominalist rule in private law—where monetary obligations are fixed in nominal terms absent express indexation—rests on a complex interplay of theories, with the **state-creature theory** emerging as the most coherent foundation, though with significant tensions when contrasted with indexation practices elsewhere. Below is a staged analysis addressing each component of your query.

  ---

  ### **Analysis of Candidate Theories**
  1. **Conventionist Theory (Money as a Conventional Measure)**  
     - **Presupposition/Fit**: The rule *fits* but does not *strictly presuppose* this theory. Nominalism aligns with Aristotle’s view that money’s value is set by communal agreement ("by law, not by nature"). A debt of "100 units" is discharged by returning 100 units because the unit is defined by convention.  
     - **Strain**: The theory struggles to explain why courts *resist* adjusting debts for inflation despite money’s acknowledged instability. If money is purely conventional, why not allow conventions to evolve with purchasing power?  
     - **Indexation Incoherence**: Indexation in tax/compensation systems directly contradicts this theory by *rejecting* the nominal unit as sufficient. If "100 units = 100 units" by definition, indexing public obligations implies money’s value *is* measurable externally.  

  2. **Commodity Theory (Money as a Tangible Good)**  
     - **Presupposition/Fit**: The rule is *incompatible* under strain. Treating money like wheat ("100 bushels") would imply obligations are tied to *value*, not tokens. Nominalism explicitly rejects this: repaying devalued currency fulfills the debt even if its commodity-equivalent value collapses.  
     - **Key Conflict**: Commodity theory demands revaluation for inflation (e.g., updating debts to reflect gold/wheat equivalents). Nominalism’s refusal to do so negates this view.  
     - **Indexation Compatibility**: Indexation aligns *better* with commodity logic (adjusting for value shifts), making the overall system schizophrenic.  

  3. **State-Creature Theory (Money as a Sovereign Instrument)**  
     - **Presupposition/Fit**: Nominalism *strictly presupposes* this theory. Courts treat money as a token defined by the state, enforcing debts in the sovereign’s unit without second-guessing its value over time. The "meaning" of currency is deferred to the state’s monetary policy.  
     - **Undetermined Doctrine**: This theory *alone* licenses nominalism—courts lack authority to redefine the state’s unit.  
     - **Indexation Compatibility**: Public law indexation is *coherent* here. The state, as money’s creator, may *choose* to index taxes/benefits to achieve policy goals (e.g., tax fairness, welfare stability). Private obligations remain nominal unless the state legislates otherwise (e.g., hyperinflation statutes).  

  ---

  ### **Aristotelian Dilemma: Nominalism vs. Measure Function**
  - **Nominalism as Conventionality Vindicated**: Aristotle’s first claim (money is alterable by community) is upheld. Nominalism treats debt as a promise of *units*, not value, respecting stipulation as "the whole content of the debt."  
  - **Betrayal of Measure Function**: Nominalism *ignores* Aristotle’s warning that a drifting measure fails. When inflation erodes purchasing power, repaying "100 units" for a debt that bought a house but now buys a bed destroys commensurability.  
  - **Consistent Aristotelian Preference**:  
    - **For Indexation**: To preserve money’s role as a stable measure enabling proportionate exchange. Aristotle’s ethics prioritizes reciprocal justice ("as the builder to the shoemaker, so many shoes to a house"). Indexation maintains this balance.  
    - **Against Nominalism**: It reduces money to a token divorced from its function, privileging legal form over economic substance—a "perversion" akin to accumulating money for its own sake.  

  A consistent Aristotelian would thus reject nominalism in favor of indexed obligations to uphold money’s measure function.  

  ---

  ### **Legal Implications of Theory Shifts**
  - **Adopting Commodity Theory**:  
    - **Doctrines**: Debts would be revalued based on purchasing power (e.g., inflation-adjusted judgments). "100 units" owed in 2050 might require repayment equal to 100 units’ *original value*.  
    - **Clauses/Contracts**: Indexation clauses would become unnecessary; "real value" would be the default. Loan agreements might specify commodities (e.g., gold) as benchmarks.  
    - **Rewriting Needed**: Standard debt instruments (bonds, mortgages) would require fundamental redesign. Courts would need authority to adjust nominal sums—a radical shift from judicial passivity.  

  - **Adopting Conventionism with Real-Value Default**:  
    - **Doctrines**: Nominalism would flip: inflation adjustment becomes automatic unless parties *opt out*.  
    - **Clauses/Contracts**: "Nominal repayment" clauses would replace today’s indexation clauses.  
    - **Rewriting Needed**: Statutes defining debt discharge (e.g., § 3-603 UCC) would need amendments to prioritize value stability.  

  - **Current System’s Coherence**:  
    The coexistence of **nominal debts** and **indexed public obligations** is best explained by the **state-creature theory**:  
    - Private law treats money as the state’s *token*, enforced rigidly.  
    - Public law treats money as a *policy tool*, indexed to achieve goals like distributive justice.  
    This is not incoherent but *hierarchical*. The state, as money’s sovereign issuer, imposes nominalism on private actors (simplifying enforcement) while reserving flexibility for its own obligations. Hyperinflation interventions are rare because they admit the state’s theory failed.  

  ---

  ### **Conclusion**
  The nominalist rule presupposes the **state-creature theory**, with conventionism as a secondary fit. Aristotle’s duality exposes nominalism’s flaw: it upholds money’s conventionality but betrays its measure function. A shift to commodity theory would revolutionize contract law, while conventionism with a real-value default would invert drafting norms. The current system is not schizophrenic but reflects a state-centric pragmatism: money is a fixed token in private disputes but a variable instrument in public hands. To resolve Aristotle’s fork, law would need indexed debts—yet nominalism persists because its simplicity serves transactional certainty, however imperfectly.
