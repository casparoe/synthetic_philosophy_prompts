  - State-creature theory fits best with judicial deference to sovereign currency, yet can't explain why legislatures index some public obligations.

  The underdetermination point is key: nominalism could be justified by either conventionism or state-creatursim. But when we add indexing practices, conventionism becomes strained while state-creature theory can accommodate both through legislative choices.

  On Aristotle's dilemma: nominalism embraces money's conventionality but betrays its measure function. A consistent Aristotelian would likely support indexed obligations to preserve commensurability in exchange - yet this contradicts the user's suggestion that stipulation might define debt's content. 

  For legal implications under commodity theory: we'd need universal indexing clauses, inflation-adjusting judgments, and likely legislative overhauls of debt instruments. The real-value default would revolutionize contract drafting. 

  Finally, the coexistence of nominal debts and indexed taxes isn't incoherent if we view money through state-creature lens: private obligations fix the sovereign's token, while public obligations adapt to policy goals. But this reveals money's schizophrenia in law - it's both immutable token and policy variable.

