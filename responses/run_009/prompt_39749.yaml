  Okay, let me unpack this user's profound archival dilemma. They're wrestling with a core tension in their profession: the gap between progressive rhetoric about inclusive archives and the stubborn persistence of institutional bias in appraisal practices. 

  Hmm... their frustration is palpable - they've noticed how oral history projects feel like band-aids on a systemic problem. What they're really probing is the philosophical foundation beneath daily archival work. Smart observation that appraisal practice itself contains unspoken assumptions about what constitutes valid historical evidence.

  First, I need to dissect those two justifications they mentioned. The "organic residue" view isn't just practical - it's epistemological. It assumes administrative records = objective evidence because they were functional. But is that true? Tax rolls reflect the tax collector's perspective, not the peasant's experience. The "society's memory" view sounds noble but... how do you appraise what was never recorded? You can't preserve what doesn't exist.

  Ah! Here's the crux: appraisal practice reveals what archivists unconsciously consider real history. By prioritizing institutional records, they're saying power structures are history's backbone. The oral histories? They're treated as supplements, not core evidence. That explains why practice doesn't change - the underlying evidentiary hierarchy remains untouched.

  Wait, the user's supervisor called both views "heuristics" - that's a red flag. It avoids confronting how appraisal decisions construct historical reality. The user senses this is a dodge, and they're right. The profession's progressive talk hasn't altered the archival gaze - what gets deemed "enduring value" still centers institutional power.

  Interesting thought: maybe the silence in archives isn't absence but evidence itself. The lack of peasant diaries speaks volumes about literacy barriers. But can you build an archive around absences? Practically difficult, though philosophically profound. 

  What would real change require? Not just adding marginalized voices but dismantling the assumption that institutional paperwork = primary historical evidence. You'd need to treat oral histories as equally valid "records," preserve digital breadcrumbs of ordinary lives, maybe even document intentional silences as artifacts. But that upends traditional preservation models.

  The user's framing is sharp but could be messier - these aren't binary positions. Most archivists hybridize them while the practice leans residue. Ultimately, appraisal isn't neutral selection but active world-building. That's the uncomfortable truth their profession skirts around. The user's onto something big: until archives confront how their practices define historical reality, the silences will persist no matter how many side projects they fund.
answer: |-
  You've struck at the core tension in archival theory – a tension exposing profound philosophical assumptions about history, evidence, and power. Your supervisor's dismissal of these justifications as mere "heuristics" avoids confronting the deep epistemological and ontological commitments embedded in *practice*. Let's dissect what appraisal *does*, not just what it *says*.

  **What Appraisal Practice Presupposes: The Unspoken Ontology**

  1.  **Evidence as Administrative Byproduct:** The core presupposition of *dominant appraisal practice* is that **the most reliable and significant evidence of the past is generated organically through the routine functioning of powerful institutions.** This rests on several linked assumptions:
      *   **Reality is Institutional Action:** What matters historically are actions with formal consequences – governance, legal adjudication, economic transactions, state control. The "facts" are the decisions made, the resources allocated, the boundaries enforced.
      *   **Objectivity through Function:** Records created *for* immediate operational needs (e.g., a court needs the indictment to hold a trial, a land registry needs the deed to prove ownership) are seen as less prone to later manipulation or bias *at the point of creation* than records created *for* posterity or advocacy. Their functionality grants them a perceived authenticity.
      *   **Evidence = Documentary Traces:** Historical "facts" are primarily constituted by, and knowable through, *documented* traces. Absence of documentation equates to historical insignificance or unrecoverability *as fact*.
      *   **Power as the Primary Historical Actor:** Institutions (state, corporate, elite) are the primary agents shaping society. Their perspective *is* the dominant historical perspective worth preserving "organically." The archive reflects the scaffolding of power.

  2.  **The "Residue" View as Operational Imperative, Not Just Philosophy:** This isn't just a theory; it's a practical ontology enabling appraisal to function *at scale* with limited resources:
      *   **Manageability:** Institutional records arrive in structured aggregations (fonds/series). Appraising whole series based on provenance and function is efficient. Documenting "ordinary life" requires identifying, collecting, and appraising disparate fragments – a vastly more complex, resource-intensive task.
      *   **Predictability & Precedent:** Appraising the minutes of Cabinet Meeting #542 follows established rules based on the *function* of Cabinet minutes. Appraising the significance of a random collection of family letters or oral histories lacks such clear, universally agreed-upon functional criteria.
      *   **Defensible Selection:** Selecting institutional records based on the *creator's function* provides a seemingly objective, defensible rationale ("We keep *all* Cabinet minutes because they document *the core function* of executive decision-making"). Selecting which aspects of "ordinary life" to document feels subjective and vulnerable to criticism.

  **The "Memory" View: A Different Ontology in Tension**

  This view presupposes:
  *   **Reality is Lived Experience:** History encompasses the totality of human experience – work, family, community, culture, resistance – not just institutional interactions. The "facts" include the texture of daily life, cultural practices, and perspectives outside power structures.
  *   **Significance Beyond Function:** Value resides not just in what facilitated administration, but in what illuminates the human condition, social structures, power dynamics (including their absence), and diverse identities *across* society.
  *   **Evidence as Constructed & Multifaceted:** Evidence isn't limited to organic administrative traces. It can be actively created (oral histories, community documentation), inferred from absences, or found in non-traditional sources. Silences *are* evidence, but insufficient on their own.
  *   **Power as Distorting Force:** The dominance of institutional records isn't a neutral reflection of "what mattered," but an artifact of power that systematically obscures the majority. A "true" memory must actively counteract this distortion.

  **Where the Tension Lies: Not Just Rhetoric vs. Practice, but Ontology vs. Ontology**

  *   **The "Residue" View DOES License Current Practice (Mostly):** Yes, the residue view *directly* justifies prioritizing institutional records. The "slide" you sense isn't illogical *within its own framework*: If the significant historical reality *is* institutional action (Assumption 1), then the institutions' records *are* what matter (Conclusion). The "bias" is inherent to the definition of significance.
  *   **The "Memory" View IS Fundamentally Incompatible with the *Pattern* of Survival:** While silences *are* evidential of power (a crucial point!), **an archive constituted overwhelmingly by the records of power cannot, by its very structure, adequately *represent* the lived reality, perspectives, and agency of those outside power.** Silences tell us *about* exclusion but cannot recover the specific textures, voices, and experiences erased. Oral histories as "add-ons" *are* often structurally marginalized within the archive, treated as supplementary rather than core evidence, precisely because they don't fit the "organic residue of administration" model. They are constructed evidence, challenging the primacy of the functional trace.
  *   **What Practice *Strictly Needs* vs. What it *Fits*:**
      *   **Strictly Needs:** The residue view's core assumption – that reliable, significant history is best evidenced by the functional records of powerful institutions – is the *essential operational engine* of current large-scale appraisal. Without this assumption, the efficiency, predictability, and defensibility mechanisms collapse.
      *   **Fits Well With:** The memory view provides a powerful *critical lens* and *ethical justification for supplementary projects*, but it does not provide a *practically workable, scalable, and defensible replacement framework* for core appraisal of the vast bulk of records flowing into national archives *from institutions*. It fits the *desire* for inclusivity but not the *mechanism* of mass appraisal.

  **What Would *Really* Change if the "Memory" View Dominated Practice?**

  Moving beyond rhetoric and add-ons would require radical shifts, not just in *what* is kept, but in the *fundamental logic* of appraisal:

  1.  **Reconceptualizing "Creator" and "Provenance":** Provenance wouldn't just mean the government ministry; it could mean the community, the social movement, the occupational group. Appraisal criteria would need to assess the significance of *lived experiences and social structures* represented by records, not just the administrative function of the creating body.
  2.  **Active Documentation as Core Mandate:** National archives would need significant resources and mandates to proactively *create* or *systematically acquire* documentation of underrepresented groups and topics (oral history programs, community archiving partnerships, systematic collection of ephemera, digital community archives) – treating these not as special projects but as equally vital acquisition streams.
  3.  **Appraising Absence & Silence:** Appraisal documentation wouldn't just list what *is* kept, but would deliberately analyze and document *what is missing* and *why* (based on knowledge of power structures and record creation). The gap itself becomes a formally recorded archival object.
  4.  **Radical Re-prioritization of Resources:** Significant reallocation of budgets and staff time away from processing ever-larger volumes of institutional records towards proactive documentation, community engagement, and managing diverse, often complex, non-institutional collections.
  5.  **New Theories of Evidence & Authenticity:** Developing robust frameworks for appraising, preserving, and providing access to constructed evidence (like oral histories) and non-traditional records that carry equal weight to administrative documents. Challenging the inherent privileging of the "functional" record.
  6.  **Shifting the "Burden of Proof":** Instead of the default being *against* preserving non-institutional traces unless proven significant, the default would require actively justifying *why* certain perspectives or experiences *shouldn't* be documented within the national memory infrastructure.

  **Your Framing: Tidy, but Insightful. A Messier Map:**

  Your two-views framing is analytically useful. However, reality is messier:

  *   **Hybridity:** Most archivists and institutions operate with a hybrid view, leaning heavily towards the residue view in core practice while embracing the memory view in rhetoric and targeted initiatives. The tension exists *within* individuals and institutions.
  *   **Spectrum of "Residue":** Not all institutional records are equal. Appraisal *does* make choices *within* the residue (e.g., keeping final reports but not drafts, keeping policy files but not routine admin). This involves judgments about enduring value that subtly incorporate elements of the "memory" view (what best illustrates the function? what might have future research significance beyond pure administration?).
  *   **"Memory" Has Its Own Biases:** Proactive documentation choices (which communities? which topics?) involve new forms of selection and potential bias. The archivist/interviewer becomes an active mediator.
  *   **Beyond "Powerful" vs. "Ordinary":** The dichotomy oversimplifies. What about dissenting voices *within* institutions? Marginalized groups who *did* create records (often suppressed)? The focus should be on *systems* of power shaping record creation, survival, and appraisal, not just binary categories.

  **Conclusion:**

  Current appraisal practice, especially in national archives dealing with state records, fundamentally presupposes that **history is constituted by the actions of powerful institutions, knowable through the authentic traces generated by their routine functions.** The "residue" view is not just compatible with this pattern; it *is* the logic that produces it. The "society's memory" view, while providing essential critique and ethical direction, remains largely incompatible with the *core operational mechanics* of mass appraisal as currently practiced. Rhetorical adoption of the memory view without fundamental structural change *is* a fig leaf.

  Meaningful change requires not just adding projects at the margins, but a philosophical and practical revolution: redefining what constitutes valid historical evidence, who the legitimate "creators" of the archive are, and investing the resources necessary to build appraisal systems capable of capturing a truly societal memory, not just the shadow cast by administration. The silence isn't just *in* the archive; it's woven into its very foundations. Dismantling that requires rebuilding the machinery, not just polishing the surface. Your unease is the signal of this profound disconnect.
