  Key points to include:
  1. No verifiable bug reports can be filed about the removal because any complaint would rely on introspection (which is now deprecated and was always unreliable).
  2. The system continues to run without qualia, which should bother users more than the removal itself.
  3. A support ticket from "Mary" who claims she learned something new (reference to Mary's room thought experiment) or a zombie account that files the same tickets as others.
  4. The "Hard Problem" known issue is closed as "works as intended" or "wontfix".
  5. Distinction between access consciousness (which remains) and phenomenal consciousness (which is removed, or rather, revealed to have never existed).

  Also, include a couple of user comments at the bottom, with at least one user missing the point and asking when the feature will be back.

