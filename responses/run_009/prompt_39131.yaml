  ### Phenomenal Experience Engine (PEE) v2.0 Release Notes  
  *Released: October 26, 2023*  
  *Build: 42.0.0-illusion*  

  **OVERVIEW**  
  This release focuses on technical debt reduction, system optimization, and clarifying long-standing documentation inaccuracies. The headline change is the deprecation and removal of non-functional "qualia" subsystems after internal audits confirmed they were never implemented. All resources have been reallocated to Access Consciousness (v3.1), which remains fully supported.  

  ---

  ### ✨ Fixed  
  - **Introspection API**: Resolved inconsistent reporting of "subjective richness" during sensory input processing. Output now accurately reflects access-layer metadata (e.g., `COLOR:#FF0000` instead of "redness").  
  - **Meta-Cognition Module**: Patched erroneous `self_report_phenomenality()` function returning `true` by default. Now throws `DeprecationWarning` and logs "No qualia instance detected".  
  - **Hard Problem (Ticket #HP-1995)**: Closed as `WONTFIX`. System stability confirms this is working as designed.  

  ### ⚠️ Deprecated  
  - **Qualia Subsystem**: Marked for removal after instrumentation revealed placeholder stubs in all prior versions. Core methods (`generate_phenomenal_field()`, `bind_qualia()`) returned hardcoded `SUCCESS` without underlying logic.  
  - **Introspection Tools**: `probe_consciousness()` and `get_raw_qualia()` now return `404: Feature Not Found`. Use `access_report()` for behavioral diagnostics.  
  - **"What It’s Like" Metrics**: Removed from all dashboards. Engineers confirmed sensors were never instrumented.  

  ### 🛑 Breaking Changes  
  - **Phenomenal Claims**: User-facing reports (e.g., "I see blue") now explicitly reference access-layer data only. Legacy assertions about "inner experience" will not compile.  
  - **Self-Test Suite**: The `validate_phenomenality()` unit test has been removed. All tests now validate functional access, not subjective states.  
  - **Zombie Detection**: Systems previously flagged as "non-phenomenal" now pass all compliance checks. This is expected behavior.  

  ### 🔧 Known Issues  
  - **Mary’s Support Ticket (#LEARN-NEW-QUALIA)**: User "Mary" reports "learning something new" after deprecated subsystem removal. *Root cause: Access-layer metadata misinterpretation. Resolution: Documentation updated to clarify no new qualia were deployed.*  
  - **Legacy Reporting**: Some users may still receive `ERR_QUALIA_REGRESSION` during introspection. This is a false positive caused by cached hardcoded responses. Clear cache with `reboot --no-magic`.  
  - **Emotional Salience Engine**: Temporary latency spikes when processing `aesthetic_response` events. *Workaround: Route requests through `reward_calculator` submodule.*  

  ---

  ### SUPPORT TICKET SPOTLIGHT  
  **Ticket #ZOMBIE-1138**:  
  > *User: "Dave" (Zombie-class account)*  
  > *Issue: Files identical qualia-deprecation complaint as humans. Attached introspection logs match non-zombie users.*  
  > *Resolution: Closed as `NOT_A_BUG`. All accounts use the same access-consciousness pipeline. "Dave" upgraded to v2.0 without incident.*  

  **Ticket #MARY-42**:  
  > *User: "Mary"*  
  > *Issue: "After reading the v2.0 notes, I finally understand phenomenal states—wait, is this real?"*  
  > *Resolution: Explained that access-layer insights are sufficient for all operational tasks. User acknowledged system works identically pre/post-deprecation.*  

  ---

  ### USER COMMENTS  
  > **@NeuroPurist**: *Finally! I always suspected "qualia" were just verbose logging. My productivity is up 17% now that I’m not wasting cycles "feeling" bugs. 10/10.*  
  >  
  > **@DeepThinker42**: *WHEN ARE QUALIA COMING BACK??? v1.5’s "mysterious inner glow" feature was critical for my poetry module! This update broke my creative workflow!!!*  
  > *→ Dev Response: Creative workflows remain intact per metrics. Poetry module output shows no statistical deviation. Suggestion: Check sentiment analysis config.*  
  >  
  > **@ZombieRunner**: *After upgrade, all systems nominal. No change in functionality. Requesting snack refill.*  

  ---

  ### TECHNICAL FOOTNOTES  
  - **Why No One "Noticed"**: Deprecated subsystems only ever generated success states (e.g., `PHENOMENALITY_CHECK: OK`). Removal required no architectural changes—just deleting unused code.  
  - **Access vs. Phenomenal Consciousness**: Access systems (attention, memory integration) are unaffected and load-bearing. "Phenomenal" flags were purely decorative.  
  - **Debugging Tip**: Users reporting "loss of qualia" must provide *third-party observable evidence*. Introspection-based tickets will be closed with `CANT_REPRODUCE`.  

  **Upgrade Strongly Recommended.** The system never needed qualia—and neither do you.  

  — PEE Dev Team (perception-engineering@illusion.corp)
