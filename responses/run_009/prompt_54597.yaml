answer: |-
  Here are the five open questions in priority order for your forecasting practice:

  1.  **What is the relationship between metaphysical indeterminacy and epistemic probability?**  
      *This is foundational:* If the future is genuinely open (metaphysically indeterminate), are your probabilities solely epistemic (reflecting ignorance) or do they track an objective feature of reality? This directly impacts how you justify and communicate your credences to avoid philosophical objections.

  2.  **To what extent are future events genuinely indeterminate vs. merely unpredictable?**  
      *Upstream of modeling choices:* Distinguishing between events that are fundamentally open (no truth value now) and those that are causally determined but epistemically inaccessible is crucial. Your team *can* analyze historical cases for patterns suggesting genuine indeterminacy (e.g., points of high contingency) versus predictable determinism masked by data limitations, informing model structure and confidence bounds.

  3.  **What are the viable boundaries of the "possible futures" sample space?**  
      *Actionable for modelers:* Metaphysical views constrain what counts as a possible future branch. Your team *can* empirically test the practical impact of defining broader or narrower possibility spaces (e.g., including/excluding "black swan" events) on forecast performance and calibration, refining sample space definitions based on predictive utility rather than abstract possibility.

  4.  **Do truth-value gaps (neither true nor false now) necessitate a non-classical probability calculus?**  
      *Often irrelevant:* While supervaluationism posits truth-value gaps, standard probability theory (assigning P=0.5 to a symmetric coin flip, which also lacks a definite truth value pre-flip) handles indeterminacy effectively. Your team can likely ignore this debate; focus on calibration and scoring rules, as these remain valid regardless of underlying truth-value status.

  5.  **Which semantics of future contingents (Ockhamist, Peircean, supervaluationist) best aligns with forecasting practice?**  
      *Minimal practical impact:* These are primarily competing metaphysical/linguistic frameworks. Your published probabilities (e.g., P(event)=0.7) and their interpretation by users (as degrees of belief/chance) are largely independent of whether you implicitly model time as branching with a "thin red line" (Ockhamist) or not (Peircean). Focus on clarity of *what* the probability represents (epistemic confidence) is more critical than the underlying temporal model.
