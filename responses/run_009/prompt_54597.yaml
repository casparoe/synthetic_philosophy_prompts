  Priority 4 is about truth-value gaps. If some statements are neither true nor false now, does that change how they interpret probabilities? But since probabilities already handle indeterminacy, focusing on confidence intervals makes this irrelevant for practice. Teams can ignore this debate.

  Priority 5 covers branching time models. While popular in philosophy, these don't impact forecasting outputs. Modelers can treat time linearly and focus on improving predictive accuracy without metaphysical commitments.

  I should check that each question is actionable. Priorities 1-3 allow empirical work—calibration tests, historical analysis, variable testing. Priorities 4-5 are skippable. Also, upstream questions like grounding probabilities (1) enable clarity on others. 

  Fashionable but irrelevant debates include truth-value gaps and branching semantics—they don't affect how probabilities are published. The user needs to avoid these distractions. 

