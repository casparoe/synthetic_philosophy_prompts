prompt: |-
  I work at a forecasting unit that publishes credences about geopolitical events five to ten years out — whether a given conflict will reignite, whether a treaty will hold — and we keep getting dragged into arguments about whether statements about the future have truth values now: whether 'there will be a naval clash in the South China Sea in 2031' is already true, already false, or neither, and whether our published probabilities presuppose some answer. I gather the future contingents literature has been fighting about this since the sea battle passage in Aristotle, with supervaluationism, Ockhamist branching semantics, thin red lines and the rest. Which five open questions in that literature matter most for a practice like ours? Give me exactly five, in priority order, each with a sentence or two defending its place — which questions are upstream of the others, which a team of statisticians and modellers could actually make progress on without training in metaphysics, and which fashionable ones make no practical difference to how we should publish or interpret our numbers. No introduction or conclusion, just the numbered list.
