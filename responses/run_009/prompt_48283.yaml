  But note: each group only acts in their own generation. So we need to have the groups sit in order and pass information.

  Materials:
  - A "state sheet" that gets passed from one generation to the next. The state sheet will have:
     - A description of the current state (which the facilitator updates between generations by applying the drift)
     - A section for the ledger (which each generation fills in)

  The state sheet should be designed with the drift in mind. The facilitator has a predetermined set of changes to apply after each generation writes their ledger.

  Preparing the state:

  The facilitator starts by giving the first generation a state description (a prosperous island society). Then:

  1. Gen1 reads the state, discusses, and writes their ledger (5 min).
  2. They pass the state sheet to the facilitator. The facilitator applies the first drift (e.g., population decline, change in resources, etc.) and gives the updated state to Gen2.
