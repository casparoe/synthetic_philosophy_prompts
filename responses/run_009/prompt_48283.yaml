  - Gen3: 5 min
  - Gen4: 5 min
  - Gen5: 5 min
  - Gen6: 5 min (30 min total for generations)
  - Then 5 min to collect and distribute ledgers and split groups.
  - Group A and B: 5 min discussion each (10 min total) -> but they need to see the ledgers? We can give each group the ledger they are using and the final state (without the intermediate states?).
  - Debate: 10 min
  - Debrief: 15 min

  But 5 min per generation is short. We can extend the generation time by reducing the debate a bit? Or we can have the groups work simultaneously? But the generations are sequential.

  Alternatively, we can have the students in each generation only write for 3-4 minutes and then pass? And the facilitator quickly updates? It might be rushed.

  I think 6 minutes per generation (including passing and updating) might be tight, but let's try:

  - Each generation: 
     - 1 min to read the state
     - 3 min to discuss and write the ledger
     - 1 min to pass to facilitator and facilitator to update (if the facilitator pre-writes the updates, it can be quick)

  But 5 min per generation total: 6*5=30 min.

  Then:

  - 5 min intro
  - 30 min simulation
  - 5 min to split and explain the judgment task
  - 10 min for group discussion (5 min each group? but they are two groups, so simultaneously 5 min)
  - 10 min debate
  - 15 min debrief
  - 5 min buffer

  Total: 75 min, plus buffer.

  But note: the two groups (A and B) can discuss simultaneously for 5 min. Then debate for 10 min.

  Now, the debrief:

  The facilitator should highlight:
  - The disagreement between the two groups: Group A (using Gen1 ledger) sees collapse because the original institutions are gone. Group B (using Gen6 ledger) sees continuity because the society still functions (albeit differently).
  - This mirrors the historiographical debate: is collapse a failure (by the standards of the past) or just change?
  - But also, in reality, historians are outsiders, many generations later, and they bring their own values. In the simulation, the students are both participants (as generations) and then judges (as historians). However, in the judgment phase, they are not using their own values but the ledger of a past generation. 
  - What the simulation can't capture: the historians' own context and values. The facilitator should point out that real historians are not using an ancient ledger but constructing their own understanding based on fragmentary evidence and their own ideas of what is essential. So the debrief should note that the ledgers in the simulation are a stand-in for the evidence that historians use, but in reality, the evidence is incomplete and the historians have to interpret it.

  Predicting problems:

  - Half the students might try to optimize: They might write in their ledger things that they think will help the society survive. We must prevent this by instruction: "You are not trying to save the society. You are describing what you see as the essential features of your society at this moment in time. What makes your society what it is? What would you say if someone asked, 'What is Prospera like?'"

  - If they still do it, it can be used in the debrief: "In the simulation, some of you tried to make your society sound better or more resilient. But in reality, the chroniclers of the time didn't know they were in a 'collapse' and were just describing their normal. This is similar to how we might project our own anxieties onto the past."

  - Another problem: The drift might be too dramatic and the students might notice the decline. We must present each state as normal. For example, for Gen2: "The capital is Green Bay, a thriving center. The king has recently moved the court here because of the natural beauty and safety from the sea." (They don't know about the tsunami, just that the king moved).

  - Also, the ledger writing might be vague. We can prompt them with: "List 5-7 essential features of your society." and provide a form.

  Form for ledger:

  Generation: ____
  Essential Features:
  1. 
  2. 
  3. 
  4. 
  5. 

  Finally, the facilitator must pre-write the state updates and keep them hidden until needed.

  Instructions for the facilitator:

  1. Before class, prepare:
     - State sheets for Gen1 (starting state) and the updated states for Gen2 to Gen6 (each in a sealed envelope? Or just on a separate paper to hand out when the previous generation finishes).
     - Ledger forms (one per generation, with space for 5-7 features).
     - A timer.

  2. Introduction (5 min):
     - Explain the simulation: We are going to simulate six generations of an island society. Each generation will experience the society as it is at their time. They are not making decisions; they are chroniclers. They will write a ledger of what they consider essential about their society.
     - Emphasize: "You are not trying to save the society or change it. You are just recording what is normal and essential for your time."
     - Assign groups and their generation.

  3. Simulation (30 min):
     - Start with Gen1: give them the state sheet and ledger form. They have 5 min (adjust as needed) to read and write.
     - After 5 min, collect the state sheet and ledger. Give Gen2 the updated state sheet and a new ledger form. Repeat until Gen6.
     - While a generation is working, the facilitator can prepare the next state update.

  4. After Gen6, collect their ledger. Then, split the class into two groups (Group A and Group B). 
     - Group A gets the Gen1 ledger and the Gen6 state description (without the intermediate ledgers). Their task: Using the Gen1 ledger as the standard, did the society collapse by the time of Gen6?
     - Group B gets the Gen6 ledger and the Gen6 state. Their task: Using the Gen6 ledger as the standard, did the society collapse? (They should see that it hasn't because they are defining by their own standards.)

  5. Group discussion (5 min): Each group discusses and prepares their verdict and reasoning.

  6. Debate (10 min): Each group presents their verdict and reasons. They can argue.

  7. Debrief (15 min):
     - Highlight the disagreement: Why did one group say collapse and the other not? Because they used different standards.
     - Connect to collapse studies: Collapse is often defined by the disappearance of key features of a previous era. But the later society might not see themselves as collapsed. So collapse is a relative term.
     - What the simulation misses: Real historians are not using a complete ledger from the past. They reconstruct from fragments and interpret. Also, they have their own values (e.g., we might value writing, monumental architecture, etc.). The facilitator can ask: "If we were using our own modern ledger (democracy, technology, etc.), would we say the society collapsed? How about if we used Gen3's ledger?"
     - Also note: the simulation had a clear decline, but in reality, collapse might not be linear and might have multiple factors.

  8. Predict the problem of optimization: If students tried to optimize, point out that in reality, people in the past didn't know they were collapsing and were just living normally. The simulation's point is to show that collapse is often only visible in hindsight.

  This should fit in 90 minutes.
answer: |-
  ### Island Society Collapse Simulation: "The Chronicles of Prospera"

  Here’s a detailed design for your 90-minute seminar simulation. It emphasizes **generational drift**, **normalization of change**, and the **subjectivity of "collapse"** through a structured, time-bound activity. The goal is to mirror historiographical debates by forcing students to confront how definitions of collapse depend on whose "ledger" (i.e., standards of normality) is used.

  ---

  ### **Activity Structure**  
  *(Total: 90 minutes)*  
  1. **Introduction (5 min)**  
  2. **Simulation: Generational Drift (60 min)**  
  3. **Judgment & Debate (15 min)**  
  4. **Debrief (10 min)**  

  ---

  ### **Step-by-Step Instructions**  
  #### **1. Introduction (5 min)**  
  - **Context:** Briefly frame the simulation:  
    > *"Today, you’ll embody six generations of an island society called Prospera. Your goal isn’t to ‘win’ or ‘fix’ anything—it’s to record what feels normal and essential to your generation. Real societies rarely perceive decline in real-time; they adapt and normalize. By the end, we’ll debate whether Prospera ‘collapsed,’ and why historians disagree on this question."*  
  - **Assign Roles:** Split the 14 students into 6 groups (Generations 1–6). Sizes will vary:  
    - Gen 1: 3 students | Gen 2: 2 | Gen 3: 3 | Gen 4: 2 | Gen 5: 2 | Gen 6: 2  
    *(Adjust for attendance on the day.)*  
  - **Key Rules:**  
    - **No Optimization:** Emphasize: *"You are chroniclers, not rulers. Do not try to ‘save’ Prospera—describe it as you experience it. There are no decisions to make, only observations to record."*  
    - **No History:** Groups only see their own era’s state. Past/future are unknown.  

  ---

  #### **2. Simulation: Generational Drift (60 min)**  
  - **Format:** Each generation gets 7 minutes to:  
    (1) Review their "State of Prospera" sheet (handed out by you).  
    (2) Discuss and write their **ledger** (a bullet-point list of 5–7 "essential features" of their society).  
    *(Example ledger prompt: "What makes Prospera Prospera? List core institutions, beliefs, and practices everyone sees as normal.")*  
  - **Drift Mechanism:**  
    - You pre-script gradual changes between generations. Each group receives a **new state sheet** reflecting subtle drift from the prior era. Changes are framed as "normal" to avoid alarm.  
    - **No Lecture, No Context:** Students experience their state as self-contained. Intergenerational communication is forbidden.  

  ##### **Pre-Scripted State Drift**  
  *(Customize based on your expertise; this is a template.)*  
  - **Gen 1 (Golden Age):**  
    > *Prospera thrives! Population: 10,000. The Sun King rules from the capital, Harbor City. Grand Temple ceremonies honor the Sun God. Weekly markets draw traders across the sea. Scribes use hieroglyphs for laws and poetry. Farms overflow with taro and yams.*  
    - **Ledger Focus:** Kingship, temples, writing, markets, surplus.  
    - **Material Props:** Give a "stone tablet" (cardboard) with hieroglyphs.  

  - **Gen 2 (Trade Decline):**  
    > *Population: 8,500. Harbor City is still bustling, but ships arrive less often. The King moved the palace uphill after a storm flooded the docks. Scribes now use simplified glyphs—only priests learn the old script. The Sun God is called "Sky Father" now.*  
    - **Drift:** Trade shrinks; script simplifies; god renamed.  
    - **Ledger Focus:** "The King’s new palace is wiser," "Sky Father protects us," "markets every fortnight."  

  - **Gen 3 (Resource Strain):**  
    > *Population: 7,000. The capital moved inland to Green Bay after a fire. Markets are monthly. Priests say Sky Father and Earth Mother are equal. Few learn writing—oral histories grow. Canals are crumbling, but festivals continue!*  
    - **Drift:** Capital relocates; literacy declines; gods merge.  
    - **Ledger Focus:** "Green Bay is the heart of Prospera," "festivals unite us," "elders pass stories."  

  - **Gen 4 (Fragmentation):**  
    > *Population: 5,000. Council of Elders advises the King. Green Bay is now a large town. Markets are seasonal. Earth Mother is primary—Sky Father fades. Writing is rare; only traders tally goods with knots. Fish stocks dwindle, but new fishing techniques help.*  
    - **Drift:** Shared governance; writing lost; economic contraction.  
    - **Ledger Focus:** "The Council keeps wisdom," "knots record trade," "Earth Mother gives bounty."  

  - **Gen 5 (Crisis Normalized):**  
    > *Population: 3,500. Prospera is now loose villages. The King is a figurehead; elders lead. Rituals are held in sacred groves (the temple is overgrown). Knots and oral tales preserve lore. Saltwater ruined farms, but seaweed saves us.*  
    - **Drift:** Central authority fades; temples abandoned; subsistence shifts.  
    - **Ledger Focus:** "Elders guide us," "groves are holy," "seaweed sustains."  

  - **Gen 6 (New Normal):**  
    > *Population: 2,000. Villages are self-sufficient. The King is gone; elders resolve disputes. Monthly gatherings at the grove honor Ancestor Spirits. Fishing and foraging feed all. Knots are used for important deals.*  
    - **Drift:** Kingship ends; new deities; low-tech subsistence.  
    - **Ledger Focus:** "Ancestors watch us," "elders’ justice," "gatherings renew bonds."  

  - **Facilitator Role:**  
    - Hand out state sheets and ledger templates (paper or digital).  
    - Enforce time (7 min/generation). Apply drift *between* groups by swapping state sheets.  
    - **Neutral Tone:** Describe each state as mundane. Use phrases like *"as always"* or *"this is how we live."*  

  ---

  #### **3. Judgment & Debate (15 min)**  
  - **Split Class:**  
    - **Group A (5–7 students):** Judges collapse using **Gen 1’s ledger**. *Question: "Did Prospera collapse by Gen 6? Use Gen 1’s ‘essentials’ as your standard."*  
    - **Group B (5–7 students):** Judges collapse using **Gen 6’s ledger**. *Question: "Did Prospera collapse? Use Gen 6’s ‘essentials’ as your standard."*  
  - **Process:**  
    - 5 min: Groups discuss privately.  
    - 10 min: Debate. Force disagreement:  
      > Group A will likely say *"Yes, collapse! No king, no temple, no writing!"*  
      > Group B will likely say *"No! We have elders, groves, and knots—everything we need!"*  
  - **Goal:** Surface how "collapse" is a value judgment tied to the observer’s benchmark.  

  ---

  #### **4. Debrief (10 min)**  
  Guide discussion with questions:  
  1. **Map to Historiography:**  
     - *"Why did Group A and B disagree? How does this reflect debates about the Classic Maya or Roman ‘collapse’?"*  
     - **Key Insight:** Collapse is often "**failure by a past standard**" but **continuity by a contemporary one**.  

  2. **Acknowledge Simulation Limits:**  
     - *"Real historians are outsiders centuries later. They don’t have ledgers—they interpret fragments (pottery, ruins) through their own biases."*  
     - **Facilitator Role:** Add this missing layer. Ask:  
       > *"If you were a 21st-century archaeologist, what would you call ‘collapse’? Would you use Gen 1’s ledger? Your own? Why?"*  
     - Emphasize: Historians’ "ledgers" are shaped by modern values (e.g., democracy, sustainability).  

  3. **Address Optimization Attempts:**  
     - *"Some of you tried to ‘fix’ Prospera. Did that ruin the point? Actually, no—it shows how hard it is to accept decline. Real societies cling to normalcy (e.g., Easter Islanders still carved moai as trees vanished). Use this to discuss **human bias** in collapse narratives."*  

  ---

  ### **What Could Go Wrong (and How to Fix It)**  
  1. **Students Optimize/Rule-Bend:**  
     - **Risk:** Half treat it like "Civilization," e.g., Gen 3 writes *"We invest in tree conservation!"*  
     - **Mitigation:**  
       - **Pre-Empt:** Stress in the intro: *"This is not a game. You’re anthropologists documenting ‘what is,’ not ‘what could be.’"*  
       - **Leverage in Debrief:** If it happens, use it! *"Why did you try to ‘save’ Prospera? How does this reflect how real societies deny vulnerability?"*  
       - **Intervene Mid-Activity:** Remind groups: *"Describe, don’t prescribe."*  

  2. **Drift Feels Too Abrupt:**  
     - **Risk:** Students notice decline (e.g., *"Wait, population dropped again?!"*).  
     - **Mitigation:** Frame changes neutrally. For Gen 3: *"Green Bay has always been our capital"* (not *"we moved after disaster"*).  

  3. **Ledgers Lack Depth:**  
     - **Risk:** Students list superficial traits (e.g., *"we have a king"*) vs. beliefs (e.g., *"the king ensures cosmic order"*).  
     - **Mitigation:** Give examples: *"Think: What would locals say defines their world?"*  

  4. **Time Runs Short:**  
     - **Mitigation:** Shorten generations to 6 min if needed. Skip Gen 6’s discussion and use a pre-written ledger if necessary.  

  ---

  ### **Materials to Prepare**  
  - **State Sheets:** 6 descriptions (1 per generation) with pre-scripted drift.  
  - **Ledger Templates:** Simple forms with: *"Generation: ____. Essential Features: 1. ______ 2. ______ ..."*  
  - **Props (Optional):** "Stone tablet" for Gen 1, "knot tally" for Gen 4–6.  
  - **Timer:** Keep pace strict.  

  ---

  ### **Why This Works**  
  - **Normalization of Drift:** Students experience how societies rationalize change (e.g., gods renamed, capitals moved) as continuity.  
  - **Historiographical Bridge:** The debate makes abstract collapse theories tangible—e.g., Joseph Tainter vs. Norman Yoffee.  
  - **Self-Awareness:** By judging collapse using conflicting ledgers, students see how standards alter verdicts. The debrief then ties this to real scholarship’s limitations.  

  This simulation forces students to confront the **relativity of collapse** while mirroring the lived experience of historical societies. If students optimize, use it to discuss denial and resilience—it won’t ruin the point, just deepen the debrief.
