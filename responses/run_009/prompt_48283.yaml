  - Group A: Uses Gen1's ledger to judge whether the society collapsed by the time of Gen6.
  - Group B: Uses Gen6's ledger to judge whether the society collapsed (they will likely say no, because they are defining by their own standards).

  They have 5 minutes to discuss in their groups and then 5 minutes to debate.

  Then debrief.

  What drift to apply?

  We need a scenario. Let's create a simple island society:

  Starting state (Gen1):

  - Island Name: Prospera
  - Population: 10,000
  - Capital: Grand Harbor (a bustling port city)
  - Writing System: Hieroglyphic script, used by scribes for temple records and trade.
  - Religion: Temple of the Sun God, with daily offerings and an annual festival.
  - Economy: Based on fishing, farming (taro, yams), and trade with neighboring islands (exports: obsidian, fine pottery; imports: textiles, spices).
