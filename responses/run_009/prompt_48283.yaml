  - A series of storms destroys the irrigation system. Population drops to 3,000. The king is now more of a tribal chief, and the noble class has disappeared. Trade with neighbors has stopped. The market day is now a small gathering.

  After Gen5:
  - Population is 2,500. The capital is now a village (Green Bay) and the temple is in ruins. They hold ceremonies in a sacred grove. The old pottery styles are replaced by simpler ones.

