  What might go wrong:

  1. Students might try to "fix" the society or make decisions to improve things. We must emphasize: "You are not making decisions for the society. You are chroniclers of your time. Describe what is normal and essential to your society as you see it."

  2. The drift might be too abrupt. We should make the changes incremental and described in a way that the current generation sees them as normal (e.g., "The capital has always been at Green Bay" for Gen2).

  3. Time: 5 min per generation might be too short. We can allocate 7 min per generation (total 42 min) and then have 8 min for transitions? But 6*7=42, plus 5 min intro, 10 min judgment, 10 min debate, 15 min debrief -> 42+5+10+10+15=82 min. That leaves 8 min buffer. But we have 90 min total.

