  - Population: 2,000. The society is now organized in small villages without a central ruler. They have a council of elders. The market day is a monthly event. The old script is forgotten, and they have a new set of gods (the ancestors and local spirits). They still farm and fish, but on a smaller scale.

  Each generation is given the state as it is at their time. They don't know the past. They write a ledger of what they consider essential.

