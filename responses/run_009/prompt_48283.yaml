  We are designing a simulation for a 90-minute seminar with 14 students. The goal is to have six successive generations of an island society, each experiencing their situation as normal while material conditions change. Each generation will write a ledger of what they consider essential about their society. At the end, two groups will judge whether the society collapsed, using the first and sixth generation's ledgers respectively, and then debate. The debrief will connect to historiography of collapse.

  Structure:
  1. Introduction (5 min)
  2. Simulation: Six generations (60 min total, about 10 min per generation including transition and writing)
  3. Group split and judgment (10 min)
  4. Debate (10 min)
  5. Debrief (15 min)

  However, note that 10 min per generation might be tight. Let's break down:

  - Each generation activity: 
