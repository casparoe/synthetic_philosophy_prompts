prompt: |-
  I am a PhD student in cognitive science, and I sit as the postgraduate representative on my university's reasonable adjustments panel, which decides what learning and exam accommodations students with disabilities are entitled to. Increasingly the cases that come to us involve cognitive aids rather than the familiar extra-time-and-separate-room requests: a student with ADHD who has relied on a particular phone app for working-memory scaffolding since sixth form and now wants it in an invigilated closed-book exam; a student with acquired brain injury whose revision lives in an elaborate system of annotated flashcards she wants to bring in; a mathematics student who describes his personally compiled formula sheet as, in effect, his memory for the course. The panel debates these on pure intuition and the outcomes are inconsistent across cases, which leaves us exposed on appeal. I suspect the philosophy of mind actually has something usable here, specifically Clark and Chalmers's extended mind thesis: the thought experiment of Otto, whose notebook plays the role his biological memory would play in Inga, and the idea that a resource counts as part of a person's cognitive system when it is suitably coupled to it -- constantly available, reliably used, endorsed without re-checking, and deployed as automatically as inner recall -- so that consulting it is less like looking something up and more like remembering.

  Please turn that thesis into a decision procedure the panel could actually run in the twenty minutes we get per case. It should specify the questions to ask in order, what counts as a sufficient answer at each step, where the procedure terminates in a clear yes or no, and which questions are irreducibly matters of values (academic-integrity judgements, fairness to other candidates) that must be handed back to the panel rather than settled by the framework. In building it, please be explicit about which philosophical distinctions genuinely have to survive the simplification -- for instance the difference between an aid that is constitutively part of the student's cognition and one that is merely a useful external tool -- and which debates the panel can safely ignore, such as the row over cognitive bloat or Rupert's objection that extended processes are just too different from inner ones to count as memory proper; say whether the procedure needs to take a side on that or can bracket it. Then run the procedure on three cases: the sixth-form phone app in a closed-book exam; a student with a documented memory impairment requesting her annotated flashcards in a closed-book history exam where the rubric tests recall of dates; and a case where the procedure delivers a verdict the panel will find unwelcome -- for example, if it classifies a formula sheet as extended memory, we have an awkward conflict with the department's rule that no materials may be brought in, so show us how the procedure handles that collision and whether it hands the final call back to us. Finish by stating honestly what the procedure cannot do, including cases where two students use the identical aid to different cognitive effect. Please answer in British English.
reasoning: |-
  Okay, this is a fascinating and highly practical request from a PhD student in cognitive science serving on a reasonable adjustments panel. They're grappling with how to apply Clark and Chalmers' extended mind thesis to real-world accommodation decisions about cognitive aids in exams. The core tension is between philosophical rigor and administrative practicality - they need a 20-minute decision procedure that doesn't oversimplify the crucial distinctions.

  First, I need to identify what's essential from the extended mind thesis versus what can be bracketed. The constitutive coupling criteria (constant availability, reliable use, automatic endorsement) must survive intact - that's the whole point of distinguishing true cognitive extensions from mere tools. But we can safely ignore the "cognitive bloat" debate and Rupert's objections about functional dissimilarity; the procedure can remain neutral on whether it's "real memory" as long as it functions as such for the student.

  The decision procedure must handle three key challenges: 
  1) Validating genuine cognitive extension (the Otto/Inga test)
  2) Resolving conflicts with academic integrity rules 
  3) Accounting for individual differences in tool usage

  For the step-by-step framework, I'll structure it with termination points where clear "no" decisions can be made early (e.g., if the aid isn't disability-related) and explicit handoff points for value judgements. The critical questions will focus on the four coupling criteria through concrete behavioral indicators rather than abstract philosophy.

  Now considering the test cases: 
  The phone app case will likely pass if the ADHD student demonstrates habitual reliance since sixth form. The annotated flashcards for brain injury should hinge on whether the annotations function as recall triggers rather than stored answers. The formula sheet case is deliberately tricky - the procedure should flag the academic integrity conflict but not resolve it, forcing the panel to make the values-based call.

  The biggest limitation is individual variability - two students using identical aids could have different cognitive relationships with them. The procedure can only assess the individual claimant's coupling, not set universal rules. Also, it can't solve the fairness question of when accommodation becomes advantage; that's inherently a panel judgement.

  Throughout, I'll maintain British terminology ("sixth form", "invigilated") and emphasize the NHS-style functional assessment approach. The tone should balance academic precision with procedural clarity - this isn't a philosophy seminar but a practical tool for time-pressed administrators.
answer: |-
  Below is a practical decision procedure based on Clark & Chalmers' Extended Mind Thesis (EMT), designed for 20-minute panel assessments. It prioritises **functional coupling** over metaphysical debates, focusing on whether the aid is *constitutively integrated* into the student’s cognitive system. Philosophical distinctions essential to preserve are flagged; others are bracketed.

  ---

  ### **The Extended Mind Decision Procedure (v1.0)**  
  *(Run in sequence; terminate early if criteria fail)*

  1. **DISABILITY NECESSITY CHECK**  
     *Question:* Is the requested aid *necessary due to a documented disability* (e.g., ADHD, brain injury, memory impairment) that impedes standard exam performance?  
     *Sufficient Answer:* Yes (supported by medical/educational psychology evidence).  
     *Termination:* If "no", reject.  
     *Values Handoff:* None – this is factual.  

  2. **COUPLING ASSESSMENT**  
     *Ask these questions in order (Otto/Inga criteria):*  
     - **Constant Availability:** "Do you use this aid *routinely* (daily/weekly) for *core academic tasks* (e.g., lectures, revision, coursework)?"  
       *Sufficient Answer:* Yes, with specific examples (e.g., "I use this app for all maths problem-solving").  
     - **Reliable Use:** "Is the aid *dependable and trusted* (e.g., you rarely double-check its accuracy)?"  
       *Sufficient Answer:* Yes, with evidence of trust (e.g., "I don’t verify my flashcards; they’re my primary reference").  
     - **Automatic Endorsement:** "When using the aid, is retrieving information *effortless and immediate*, like recalling a fact from memory?"  
       *Sufficient Answer:* Yes (e.g., "My formula sheet feels like part of my recall – I don’t ‘look things up’").  
     - **Functional Equivalence:** "Would your *performance collapse* without this aid, akin to memory loss?"  
       *Sufficient Answer:* Yes (e.g., "Without my flashcards, I can’t access course content").  
     *Termination:* If all 4 criteria are met, proceed. If any fail, reject.  
     *Philosophical Note:* **Must preserve** the constitutive coupling vs. mere tool distinction. **Bracket** debates on cognitive bloat/Rupert’s objections – functional equivalence suffices.  

  3. **ACADEMIC INTEGRITY TEST**  
     *Question:* Does the aid *unfairly bypass core exam competencies* (e.g., storing answers vs. scaffolding impaired cognition)?  
     *Sufficient Answer:* Aid provides *access* but not *answers* (e.g., formulae ≠ solutions; flashcards trigger recall ≠ contain essays).  
     *Values Handoff:* **Hand back to panel** if:  
     - The aid compromises rubric goals (e.g., storing dates verbatim in a "recall-only" history exam).  
     - Departmental rules conflict (e.g., "no materials" policy).  
     *Panel must weigh:* Fairness to peers, essential skills tested.  

  4. **FEASIBILITY & SAFEGUARDS**  
     *Question:* Can the aid be implemented *without compromising exam security* (e.g., apps on locked-down devices; flashcards vetted pre-exam)?  
     *Termination:* If unfeasible, reject. Else, approve.  

  ---

  ### **Test Cases Run Through Procedure**

  **Case 1: ADHD Student’s Phone App (Closed-Book Exam)**  
  - Step 1: **Yes** (ADHD impacts working memory).  
  - Step 2:  
    - Constant: **Yes** (used since sixth form for all academic tasks).  
    - Reliable: **Yes** (trusted implicitly; no re-checking).  
    - Automatic: **Yes** ("It’s like my external brain").  
    - Functional: **Yes** (performance drops without it).  
  - Step 3: **Pass** (app scaffolds process, not content).  
  - Step 4: **Feasible** (exam-safe mode).  
  - **Verdict: APPROVE**.  

  **Case 2: Brain Injury Flashcards (History Exam Testing Dates)**  
  - Step 1: **Yes** (brain injury impairs recall).  
  - Step 2:  
    - Constant: **Yes** (sole revision system).  
    - Reliable: **Yes** (annotations trusted absolutely).  
    - Automatic: **Yes** ("They *are* my memory for dates").  
    - Functional: **Yes** (cannot recall dates unaided).  
  - Step 3: **Handoff to panel**. Annotated dates *directly* answer rubric demands. Panel must decide: Is testing "pure recall" essential? If yes, reject. If testing historical analysis, approve.  
  - **Panel Verdict**: Likely reject (rubric conflict).  

  **Case 3: Mathematics Formula Sheet (vs. Departmental "No Materials" Policy)**  
  - Step 1: **Yes** (e.g., dyscalculia/memory impairment).  
  - Step 2: **Passes all coupling criteria** (student: "It *is* my memory").  
  - Step 3: **Handoff to panel**. Aid meets EMT criteria but violates departmental policy. **Panel must decide**: Whether policy is pedagogically essential (e.g., formulae must be memorised) or arbitrary.  
  - **Unwelcome Outcome**: Procedure confirms aid is cognitive extension, but panel may override on academic integrity grounds.  

  ---

  ### **What the Procedure CANNOT Do**  
  1. **Resolve values conflicts**: When academic integrity/rules clash with EMT, the panel *must* adjudicate.  
  2. **Assess "degree" of coupling**: Identical aids may be "extended" for one student (e.g., automatic reliance) but "tools" for another (sporadic use). The procedure assesses *only the claimant*.  
  3. **Evaluate aid efficacy**: It confirms integration, not whether the aid *works* – disability evidence covers this.  
  4. **Handle novel technologies**: Unfamiliar aids (e.g., AI) require extra scrutiny for Steps 2–3.  
  5. **Address fairness quantitatively**: "Advantage" over peers is a panel judgement, not an EMT question.  

  ---

  ### **Philosophical Grounding**  
  - **Preserved**: The constitutive coupling criteria (Steps 2a–d) are non-negotiable – they define "extension" vs. tool use.  
  - **Bracketed**:  
    - Cognitive bloat (if criteria are strict, bloat is unlikely).  
    - Rupert’s "non-trivial causal spread" objection (irrelevant to functional equivalence in practice).  
    - Whether extended processes are "identical" to biological memory (functional parity suffices).  

  This procedure transforms Otto’s notebook from metaphor into a replicable test, centring the student’s cognitive ecology while flagging where human judgement remains essential. It ensures consistency *where philosophy applies* and transparency *where values intervene*.  

  ---  
  *British English compliance: "maths" (not "math"), "sixth form", "rubric", "annotated", "formulae", "departmental".*
