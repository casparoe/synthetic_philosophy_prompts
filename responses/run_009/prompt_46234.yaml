  Regarding Norton's view: The equivocation account meaningfully differs by focusing on conceptual ambiguity rather than logical contradiction. Where Norton sees disguised syllogisms, this approach reveals how concepts fracture under pressure. The stress-test framing adds value by showing why certain thought experiments become iconic - they target unstable conceptual foundations.

  On historical accuracy: Minor corrections are needed about the argument's placement in Two New Sciences (Day 3, not Day 1) and Aristotle's actual position (he did consider composition effects briefly). These don't undermine the thesis but require textual precision.

