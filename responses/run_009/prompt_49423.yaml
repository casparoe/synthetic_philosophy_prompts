prompt: |-
  I've been following the logical uncertainty discussion since the LessWrong and Arbital days, and I've read Garrabrant et al.'s logical induction paper enough times now to be both impressed and frustrated. It shows that a market of computable traders can, in the limit, assign prices to mathematical sentences in a way that no efficiently computable trader can exploit — beliefs that are coherent, consistent, and calibrated even about undecidable-looking claims, which was supposed to be impossible for bounded reasoners. But the construction is so thoroughly asymptotic that nobody knows what any finite initial segment of it actually believes, and the folklore conclusion has sat for years at an awkward middle point: either the result is a pure existence proof with no feasible instantiation, or the whole market-and-traders framing can somehow be weakened into something that runs before the heat death of the universe. I want to pitch a project aimed at that gap.

  I'm applying for a small grant from an AI-safety-oriented funder — three months, part-time, myself plus possibly one collaborator with an automated theorem proving background — and my half-formed idea is this. The proof-search heuristics that real theorem provers use (lemma learning, term orderings, restarts, saturation strategies) already behave like opinions: the prover allocates effort where it expects a proof to be findable. So treat the heuristics themselves as the traders in a logical-induction-style market, and ask whether there is a defensible weakening of the induction criterion — call it bounded logical induction — that a market of resource-bounded traders can satisfy non-asymptotically, and whether the resulting prices are any good. Crucially, the boundedness can be graded against ground truth if we work in decidable fragments (say, linear arithmetic or other theories where a decision procedure exists but is too slow to run directly), because then we can measure the market's prices against actually computable truth rather than gesturing at limits.

  Turn this into a proposal with: a precise statement of the question; why the existing positions leave it open — I don't want a restatement of the asymptotic result followed by an unsupported and now make it practical; the method, month by month, including which decidable fragments to start with and why; what a positive result, a negative result, and a merely boring result would each look like; and an honest statement of what would count as the project failing — including the possibility that heuristics-as-traders is a metaphor that doesn't cash out, that the market dynamics are dominated by degenerate arbitrage among heuristics, or that the only criteria attainable in bounded time are so weak that they no longer connect to the Dutch-book argument at all. Assume the reviewers know the standard results. No bibliography, I'll fill in references myself.
reasoning: |-
  We are writing a research proposal to bridge the gap between the asymptotic logical induction framework and practical, finite-time computable belief assignments for mathematical statements. The core idea is to model theorem-proving heuristics as "traders" in a logical induction market and to define a bounded version of logical induction that can be achieved in feasible computation time. We will evaluate this in decidable fragments where ground truth is available.

  **Precise Statement of the Question:**
  Can we construct a market mechanism (based on theorem-proving heuristics as traders) that, in a feasible amount of computation time, assigns prices (beliefs) to sentences in a decidable logical fragment such that:
     (a) The prices are approximately coherent (no internal contradictions, within some bounded error).
     (b) The prices are approximately calibrated (when the ground truth is known, the prices are close to the actual truth values).
     (c) The market is approximately unexploitable by any trader from a predefined class of resource-bounded traders (modeled by the heuristics) in the sense that no such trader can make more than a bounded amount of "profit" in a bounded time?

  Moreover, we aim to define a "bounded logical induction" criterion that captures these properties non-asymptotically and to evaluate whether such a market can be implemented using existing theorem-proving heuristics.

  **Why Existing Positions Leave It Open:**
  The logical induction paper (Garrabrant et al.) provides an asymptotic existence proof but does not address finite-time performance. The construction relies on an infinite sequence of traders that are eventually included, but the finite initial segments are arbitrary and may be incoherent. Prior work on bounded rationality (e.g., MIRI's logical priors, work on bounded probabilistic logic) either remains asymptotic or does not address the full logical uncertainty setting. Theorem provers use heuristics that embody beliefs about where proofs are likely to be found, but these heuristics are not formalized as belief states and are not subject to a market mechanism that enforces coherence and unexploitability. Thus, there is a gap between the asymptotic theory and the heuristic practice.

  **Method:**
  *Month 1: Formalization and Design*
     - Define a decidable logical fragment (start with quantifier-free linear real arithmetic, QF_LRA, which is decidable by simplex but can be expensive; then consider other fragments like EUF, arrays, or fragments of arithmetic with bounded quantifiers). Choose fragments that are expressive enough for non-trivial examples but where decision procedures are known and can be used as ground truth (even if slow).
     - Model theorem-proving heuristics (e.g., from SAT, SMT, or superposition provers) as "traders". Each heuristic will be represented as a function that, given a current market state (prices on sentences), outputs a "trading order" (a portfolio of buy/sell orders on sentences) based on its internal beliefs (e.g., if it believes a sentence is under-priced, it buys). The heuristic's belief is derived from its proof-search strategy (e.g., it may have a high belief in a sentence if it has found a proof of a similar sentence, or if the sentence appears in a useful lemma).
     - Design a market mechanism that updates prices based on the aggregated orders from the heuristics. The update rule must be computable in feasible time (e.g., using a convex optimization step to ensure coherence, but with bounded resources).

  *Month 2: Implementation and Experimentation*
     - Implement a toy market in a chosen fragment (QF_LRA). Use a set of benchmark problems (from SMT-LIB) and a set of simple heuristics (e.g., heuristics that focus on certain types of constraints, or that use lemma learning). The market will run for a fixed number of iterations (simulated trading days) and produce prices for sentences.
     - Measure:
          (i) Coherence: Check if the prices form a probability measure (within some error) on the logical fragment.
          (ii) Calibration: Compare the prices to the ground truth (computed by a complete but slow decision procedure) on a hold-out set of sentences.
          (iii) Unexploitability: For each heuristic, check if it can make a profit by trading against the market. Also, introduce new heuristics (not in the market) and see if they can exploit the market.

  *Month 3: Analysis and Generalization*
     - Analyze the results: Does the market achieve the bounded logical induction criteria? What are the trade-offs between computation time and the quality (coherence, calibration, unexploitability) of the prices?
     - Attempt to generalize to a more expressive fragment (e.g., linear integer arithmetic, which is undecidable in general but decidable for bounded integers, or fragments with restricted quantifiers).
     - Define the bounded logical induction criterion formally and prove (if possible) that the market satisfies it under certain conditions (e.g., if the heuristics satisfy certain properties).

  **Expected Outcomes:**
  - *Positive result:* We design a market that, in feasible time, produces prices that are coherent, calibrated, and unexploitable by the given set of heuristics. We provide a formal bounded logical induction criterion and prove that our market satisfies it. The prices are useful as a practical logical uncertainty framework.
  - *Negative result:* We show that in the presence of realistic heuristics, the market either fails to converge in feasible time, or the prices are not calibrated, or the market is easily exploitable by new heuristics. This would indicate that the logical induction framework may not be adaptable to bounded settings without losing key properties.
  - *Boring result:* The market works but only on very simple fragments and with very simple heuristics, and it does not scale. Or, the market produces prices that are coherent but not calibrated (so they are not useful as beliefs) or are trivially 0.5 for everything.

  **Project Failure Conditions:**
  The project fails if:
     1. The metaphor of heuristics-as-traders does not cash out: heuristics cannot be naturally translated into trading strategies that interact meaningfully (e.g., the trading orders are degenerate or uninterpretable).
     2. The market dynamics are dominated by degenerate arbitrage (e.g., heuristics exploit each other in cycles without converging to sensible prices) or the market is chaotic and does not stabilize.
     3. The bounded criteria we can achieve in practice are too weak to be considered a form of logical induction (e.g., we only get local coherence, or no meaningful connection to calibration or unexploitability).
     4. The computational overhead of the market mechanism (e.g., solving the optimization for price updates) is prohibitive even for small instances.

  We will mitigate these risks by starting with the simplest possible setting (QF_LRA with a few heuristics) and by having clear milestones for evaluation at the end of each month. If the bounded logical induction criteria turn out to be too strong, we may weaken them (e.g., allow for more error or a limited form of exploitability) and see if that is achievable and useful.

  This project aims to take a step towards a computationally feasible theory of logical uncertainty, which is crucial for AI safety where systems must reason about their own limitations and the unknown.
answer: |-
  ### Research Proposal: Bounded Logical Induction via Theorem-Proving Heuristics

  #### Core Question
  Can a market of theorem-proving heuristics—acting as resource-bounded traders—produce non-asymptotic, feasibly computable belief prices for sentences in *decidable logical fragments* that satisfy a *weakened logical induction criterion*? Specifically:  
  - **Input**: A logical fragment \(\mathcal{L}\) (e.g., QF\_LRA or EPR) with a known but expensive decision procedure.  
  - **Mechanism**: A market where heuristic traders (e.g., SAT/SMT solver tactics) submit orders to buy/sell sentences based on proof-search optimism.  
  - **Output**: Prices reflecting beliefs after bounded computation (e.g., hours/days).  
  - **Criterion**: Prices should be:  
    (i) **\(\epsilon\)-coherent**: Approximately satisfy probability axioms (e.g., \( |\text{Price}(\phi \land \psi) + \text{Price}(\phi \land \neg\psi) - \text{Price}(\phi)| \leq \epsilon \)).  
    (ii) **\(\delta\)-calibrated**: For sentences where ground truth is known, prices are \(\delta\)-close to \(\{0,1\}\).  
    (iii) **\(k\)-unexploitable**: No heuristic-trader achieves \(>k\) profit against the market in feasible time.  

  #### Why Existing Work Leaves This Open
  - **Logical induction (LI)** proves asymptotic convergence but offers no finite guarantees. Its market requires enumerating all possible traders, which is incomputable. Finite segments are arbitrary and may violate coherence.  
  - **Heuristic methods** (e.g., lemma scoring in SAT solvers) implicitly prioritize effort but lack formal semantics. They don’t produce calibrated beliefs or defend against exploitation.  
  - **Bounded rationality approaches** (e.g., bounded probabilistic logic) either compromise on logical structure (e.g., ignore quantifiers) or lack a market dynamic to aggregate heuristics. No work bridges LI’s completeness with realistic resource constraints.  

  #### Methodology
  **Month 1: Formalization & Fragment Selection**  
  - **Define "heuristic-as-trader"**: Encode theorem prover tactics (e.g., VSIDS branching, theory propagation in SMT) as traders. Each heuristic:  
    - Takes current market prices + internal state (e.g., learned clauses).  
    - Outputs orders for sentences it deems under/over-priced (e.g., buys \(\phi\) if its proof-search history suggests \(\phi\) is likely true).  
  - **Choose decidable fragments**:  
    - **QF\_LRA** (quantifier-free linear real arithmetic): Decidable via simplex; SMT-LIB benchmarks provide ground truth. High heuristic diversity (e.g., branching rules).  
    - **EPR** (effectively propositional logic): Decidable via finite model search; supports quantifiers. Enables studying how heuristics handle predicates.  
  - **Weaken LI criterion**: Replace asymptotic convergence with \(\epsilon,\delta,k\)-bounds computed from runtime (e.g., calibration error vs. time).  

  **Month 2: Market Implementation & Experiments**  
  - **Build market**:  
    - **Clearing mechanism**: Use convex optimization to update prices toward coherence, minimizing arbitrage (e.g., entropy penalty).  
    - **Trader pool**: Integrate 5–10 simple heuristics from Z3/cvc5 (e.g., conflict-driven clause learning, term ordering).  
  - **Metrics**:  
    - Coherence: KL divergence from nearest coherent distribution.  
    - Calibration: Brier score against ground truth on holdout sentences.  
    - Unexploitability: Max profit by any heuristic after \(N\) rounds.  
  - **Experiments**:  
    - Run market on QF\_LRA benchmarks (e.g., SMT-LIB’s QF\_LRA/pspace).  
    - Vary heuristic pool size/complexity and runtime (minutes to hours).  

  **Month 3: Analysis & Generalization**  
  - **Test criteria**: Does the market achieve \(\epsilon,\delta,k\)-bounds? How do \(\epsilon,\delta,k\) scale with runtime/heuristic diversity?  
  - **Stress tests**:  
    - **Fragment extension**: Apply to EPR (e.g., crafted mutual exclusion protocols).  
    - **Adversarial traders**: Introduce heuristics designed to exploit (e.g., arbitrage between lemma generators).  
  - **Theoretical limits**: Prove whether \(k\)-unexploitability is possible for \(\mathcal{O}(1)\) traders or only \(\mathcal{O}(\text{poly}(n))\).  

  #### Outcomes  
  - **Positive**: Market prices achieve \(\epsilon,\delta,k\)-bounds in subexponential time (e.g., \(\epsilon < 0.05\) for QF\_LRA in 1 hour). Heuristics profit-correlate with proof-search accuracy.  
  - **Negative**: Prices degenerate (e.g., all near 0.5) or heuristics engage in zero-sum arbitrage, violating unexploitability (\(k\) unbounded).  
  - **Boring**: Works only for trivial fragments (e.g., propositional) or requires heuristics too tailored for generalization.  

  #### Failure Criteria  
  The project fails if:  
  1. **Metaphor mismatch**: Heuristics cannot be cleanly mapped to traders (e.g., orders depend on opaque solver state).  
  2. **Degenerate dynamics**: Arbitrage cycles dominate (e.g., heuristic A exploits B, B exploits C, C exploits A), preventing price convergence.  
  3. **Criterion collapse**: The only achievable \(\epsilon,\delta,k\) are too weak (e.g., \(\epsilon > 0.3\)) to meaningfully connect to LI or Dutch-book arguments.  
  4. **Computational intractability**: Price updates exceed feasible time even for small benchmarks (e.g., QF\_LRA with 100 variables).  

  #### Risk Mitigation  
  - Start with minimal QF\_LRA market (2 traders, 10 sentences). If degenerate, simplify trader incentives (e.g., restrict to linear portfolios).  
  - If calibration fails, use syntactic sentence features (e.g., formula depth) to bin predictions.  
  - Failure will still advance understanding by mapping the infeasibility frontier.  

  ---  
  *This project seeks to ground logical induction in feasible computation. By exploiting the "effort allocation as belief" intuition in theorem proving, we aim to show that non-asymptotic coherent beliefs are possible—or prove they require fundamentally new machinery.*
