  ### **Dossier Design Notes**  
  - **Why These Traits?**  
    - Pulmo-Node establishes common ground.  
    - Tremor-Pods force history-vs-present tension.  
    - Dorsal Spikes highlight vestigiality (SE: function lost; CR: no function).  
    - Luma-Sacs emphasize accidental benefits (CR assigns function; SE resists).  
    - Aero-Fronds ensure the "flip" feels consequential (history changes SE verdict).  
  - **Realism in History:** Clues are probabilistic (e.g., "fossils suggest...") to mimic inference. The reveal models how new data updates hypotheses.  

