  Based on your roommate's gambling decisions, her behavior is best explained by **prospect theory**, specifically incorporating loss aversion, diminishing sensitivity (concave utility for gains, convex for losses), and probability weighting (overweighting small probabilities and underweighting moderate to large ones). This model fits all her choices:
  - She accepts the +$120/-$100 coin flip because the loss is below her "pain threshold" (around $100–$200), and the gain is sufficiently larger to overcome loss aversion for small stakes.
  - She rejects the scaled-up +$12,000/-$10,000 flip due to loss aversion: losing $10,000 is extremely painful, and the gain doesn't compensate proportionally because of diminishing sensitivity.
  - She takes the sure $50 over the 50/50 $0/$120 gamble, showing risk aversion for moderate-probability gains (underweighting the 50% chance of $120).
  - She plays Powerball when the jackpot is huge because she overweights the tiny probability of winning, outweighing the negative expected value.
  - She rejects the $200 raffle (50% shot at $500) because the potential loss of $200 exceeds her pain threshold and causes significant disutility, while the gain isn't weighted highly enough.

  ### Predictions for St. Petersburg Game Entry Fees
  In the St. Petersburg game (fair coin, payout starts at $2 and doubles on tails, infinite expected value), her decisions will depend on the entry fee due to loss aversion and probability weighting:
  - **$10 entry fee**: She will **play**. The potential losses for early outcomes (e.g., losing $8 on first heads) are below her pain threshold and feel negligible. Small probabilities of large gains are overweighted, making the game attractive despite the fee.
  - **$100 entry fee**: She will **not play**. Losses for early outcomes (e.g., losing $98 on first heads) are near her pain threshold and feel significant. The high probability of an initial loss (about 98.4% for n=1–6) is underweighted, but the disutility of a ~$100 loss dominates. The small chance of gains isn't enough to offset this.
  - **$1,000 entry fee**: She will **not play**. Losses are now large (e.g., losing $998 on first heads) and well above her pain threshold, causing high disutility due to loss aversion. The near-certain initial loss is overwhelming, and even overweighted small probabilities of gains don't compensate.

  ### Why Prospect Theory Fits Best
  - **Diminishing marginal utility** (e.g., log or sqrt utility) doesn't fit because it can't explain her Powerball play (she should reject lotteries with negative EV) or the rejection of the scaled coin flip (log utility often accepts large positive-EV gambles for reasonable wealth levels).
  - **Probability cutoff** (treating tiny probabilities as zero) doesn't fit because she plays Powerball, showing she doesn't ignore small probabilities—instead, she overweights them.
  - **Loss aversion alone** isn't sufficient because she exhibits risk aversion for gains (sure $50 choice) and risk-seeking for small probabilities (Powerball), which prospect theory captures with its S-shaped value function and weighting function.
  - Prospect theory unifies all her behaviors: loss aversion for larger losses, concavity for gains leading to risk aversion, convexity for losses leading to risk-seeking in some contexts, and probability weighting for extreme outcomes.

  ### Designing a Test to Distinguish Prospects
  The two strongest rules are **prospect theory** and **diminishing marginal utility (DMU)**. To distinguish them, propose a choice between:
  - **A sure loss of $50**
  - **A 50/50 gamble to lose $100 or lose $0**

  **Why this test?**
  - **Under prospect theory**: She should **take the gamble**. Losses are convex (risk-seeking), meaning she prefers a chance to avoid a loss altogether, even if it risks a larger loss. This fits her tolerance for small losses (e.g., the first coin flip) and aversion to sure losses of meaningful amounts.
  - **Under DMU (e.g., log utility)**: She should **take the sure loss of $50**. Concave utility implies risk aversion everywhere, so she prefers a certain, smaller loss over a risky larger one. This would contradict her Powerball behavior but confirm DMU if she chooses it.
  - **Prediction**: Given her history (e.g., accepting the first coin flip with a possible $100 loss), she will likely take the gamble, supporting prospect theory. If she takes the sure loss, it favors DMU but conflicts with her Powerball play, making prospect theory still more consistent overall.

  ### Notes on the Capped St. Petersburg and Divergent Variant
  - **Capped St. Petersburg (max payout $2^20)**: This doesn't distinguish rules well. Both prospect theory and DMU predict similar behavior (e.g., she might play at $10 but not at $100/$1,000), as the cap makes expected utility finite but doesn't highlight probability weighting or loss aversion uniquely.
  - **Divergent variant (e.g., payout e^{2^n})**: If payouts grow fast enough that expected utility diverges even under log utility (e.g., EU = ∑ (1/2)^n * log(e^{2^n}) = ∑ (1/2)^n * 2^n = ∑1 → ∞), it causes trouble for DMU. A log-utility maximizer should pay any finite fee, but under prospect theory, the concave value function (e.g., v(x) = x^α for α<1) typically yields finite EU, so she would reject high fees. Since she likely has a concave value function (given her risk aversion for gains), this variant would reinforce prospect theory: she rejects high fees despite infinite EU under DMU, consistent with her aversion to large losses.

  This approach should help you confirm her decision rule before the St. Petersburg discussion. If she takes the risky loss in the test case, prospect theory is solidified; if not, it might warrant revisiting DMU with her wealth level, but prospect theory remains the best fit overall.
