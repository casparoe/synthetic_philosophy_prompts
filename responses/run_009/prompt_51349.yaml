prompt: |-
  I am the research integrity officer at a large research university, and several times a year I have to adjudicate disputes about the ownership of ideas — not text plagiarism, which our software and policies handle, but the murkier category where one researcher claims another used an idea they originated: a graduate student who sketched a research direction at a lab meeting and later saw it as the centerpiece of the supervisor's grant; a postdoc who heard a talk, decided the speaker had abandoned the idea, and published first; two collaborators who each insist the key move in a joint paper was theirs. My sanctions committee consists of scientists and an administrator, none of them trained in philosophy, and they want something they can actually apply rather than hand-wave about academic norms.

  I want you to build me a decision procedure grounded in what the philosophy of intellectual property actually says, translated into something my committee can run. I take it the relevant raw material includes the labor-desert view that effort confers a claim, the personality view that ideas are expressions of the self, the utilitarian view that idea-ownership is justified only by incentives, the fact that ideas are non-rival in a way land and objects are not, and the Lockean proviso that appropriation is legitimate only if it leaves enough and as good for others — but you should decide what belongs in the procedure and what to leave in the seminar room. What interests me especially, and where I suspect the philosophy has real work to do, are the distinctions the disputes actually turn on: between a problem, an approach, and a worked result — I want to know whether claiming a problem is different in kind from claiming a route into it; between originating an idea and being merely its first audience; and between cases where the hearer would have got there independently anyway and cases where they took something they could not have supplied themselves. If the utilitarian and labor-desert strands of the philosophy pull in different directions on any of these, the procedure should say so rather than papering over it.

  Please write the procedure with these constraints: it must be usable by a non-philosopher committee over the course of a two-hour meeting plus a few days of document review; it should pose its questions in a fixed order, say what counts as a sufficient answer to each, mark the points where the procedure must stop and hand the question to human judgment because it is a question of values rather than facts, and be honest about where it is philosophy dressed up as a flowchart. Then run it on three cases: first, a graduate student who raised an unformed idea in a lab meeting and eight months later found it as the central aim of the supervisor's grant application, with no acknowledgment; second, two researchers in different countries who published near-identical results within months of each other, where there is no evidence of contact but one of them did attend a conference the other spoke at; third, a journal referee who declined a manuscript and then published a paper using its framing, citing the rejected manuscript only in a footnote. Include at least one case where the procedure delivers an answer I am not going to like, and say so plainly. Finally, tell me what the procedure cannot do: the classes of dispute it should never be applied to, and the places where I should just accept that what looks like theft of an idea is the ordinary, ungovernable traffic of a research community.
reasoning: |-
  We are building a decision procedure for adjudicating disputes about the ownership of ideas, grounded in philosophy of intellectual property. The key principles we draw from are:

  1. **Labor-Desert**: An individual deserves to own the product of their labor.
  2. **Personality**: Ideas are expressions of the creator's self, so misappropriation is a violation of personhood.
  3. **Utilitarian**: Ownership is justified by the incentive it provides for creation and dissemination, balancing societal benefit.
  4. **Non-Rivalry**: Ideas can be used by many without being used up, so exclusive ownership is not inherently necessary.
  5. **Lockean Proviso**: Appropriation is legitimate only if it leaves "enough and as good" for others.

  We must also consider the distinctions:
  - Problem (a research question) vs. Approach (a method to address the problem) vs. Worked Result (a specific solution or finding).
  - Originating an idea vs. being the first audience.
  - Whether the hearer would have independently developed the idea.

  The procedure is a flowchart with fixed-order questions. It must:
  - Be usable by non-philosophers in a few hours of meeting plus document review.
  - Have a fixed order of questions.
  - Specify what counts as a sufficient answer.
  - Mark points where the committee must exercise human judgment (values vs. facts).
  - Be honest about where it's philosophy as a flowchart.

  We'll design the procedure in steps.

  **Step 0: Preliminary Checks**
  Before starting, we must establish that:
  - The dispute is about an "idea" (problem, approach, or result) and not about text plagiarism (which is handled separately).
  - The idea in question is sufficiently concrete to be identified. If it is too vague (e.g., "we should study climate change"), then stop: the idea is not protectable.

  **The Decision Procedure**

  **Question 1: What is the nature of the idea?**
     - Options: 
       (a) A problem (research question)
       (b) An approach (method, technique, or theoretical framework to address a problem)
       (c) A worked result (specific solution, finding, or fully developed concept)
     - **Why this?** The level of protection varies. Problems are least protected (they are often in the air), approaches more so, and worked results the most.
     - **Philosophy**: Utilitarian and Lockean views suggest that problems are common property, while labor-desert and personality increase protection as more labor is invested.
     - **Sufficient Answer**: Must categorize the idea. If the idea is a problem, then unless there is a very specific and novel formulation (which might be an approach), it is unlikely to be owned. Move to Question 2.

  **Question 2: Was the idea independently developed by the alleged appropriator?**
     - **Evidence**: Look for contemporaneous notes, emails, prior publications, etc., showing that the alleged appropriator was working on the idea before any contact with the originator.
     - **Sufficient Answer**: If clear evidence of independent development (e.g., dated records before any exposure), then stop: no misappropriation. If not, or if evidence is ambiguous, proceed.
     - **Philosophy**: Labor-desert would credit the independent developer. Utilitarian would note that independent development shows the idea was not dependent on the originator and thus no harm to incentives.

  **Question 3: Was the idea disclosed in a context that implies an expectation of credit?**
     - **Contexts**: 
          - Formal (e.g., a published paper, a preprint, a patent application) -> strong expectation.
          - Semi-formal (e.g., a conference talk, a lab meeting, a collaboration discussion) -> moderate expectation, depending on norms.
          - Informal (e.g., a hallway conversation, an email exchange) -> weak or no expectation.
     - **Sufficient Answer**: If the idea was disclosed in a context with a strong expectation of credit (e.g., publication) and the appropriator used it without credit, then misappropriation is likely. If weak, then less so. If unclear, note for judgment.
     - **Philosophy**: Personality and labor-desert emphasize the originator's expectations and the effort in disclosure. Utilitarian might discount informal disclosures because they don't provide the same public benefit as formal ones.

  **Question 4: Did the alleged appropriator add significant original labor to develop the idea?**
     - **Consider**: How much work did the appropriator do beyond the initial idea? If the idea was just a problem and the appropriator developed the entire approach and result, then their labor may create a strong claim.
     - **Sufficient Answer**: If the appropriator's contribution is transformative (e.g., turned a vague idea into a full-fledged theory) then their claim may override the originator's. If not, then the originator's claim is stronger.
     - **Philosophy**: Labor-desert would grant the appropriator a claim for their labor. Utilitarian would encourage such development. But personality might still require attribution for the seed idea.

  **Question 5: Would the originator have been likely to develop the idea further?**
     - **Evidence**: Look at the originator's track record, resources, and actions. Did they abandon the idea? Were they actively working on it?
     - **Sufficient Answer**: If the originator was actively developing the idea and the appropriation preempted them, then harm is done (Lockean proviso: not leaving enough). If the originator had no capacity or intention to develop it, then utilitarian and Lockean views might support the appropriation.
     - **Philosophy**: Lockean proviso and utilitarian incentives: if the originator is deprived of the chance to develop their idea, it harms the system.

  **Question 6: Was the idea taken in a way that violates academic norms?**
     - **Norms**: E.g., peer review confidentiality, mentor-trainee relationships, collaboration agreements.
     - **Sufficient Answer**: If the appropriation occurred in breach of a specific norm (e.g., referee using a manuscript's idea), then this is a strong factor for misappropriation.
     - **Philosophy**: This is about the social contract in academia. Utilitarian: violating norms undermines trust and the system.

  **Question 7: Balancing the claims (Judgment Call)**
     - Now, the committee must weigh:
          - The strength of the originator's claim (based on labor, personality, and context of disclosure).
          - The strength of the appropriator's claim (based on independent labor, transformation, and their own contribution).
          - The utilitarian impact: would assigning ownership here promote or hinder research?
          - The Lockean proviso: did the appropriation leave the originator with enough and as good?
     - **Outcome**: The committee must decide whether misappropriation occurred and, if so, what remedy (e.g., acknowledgment, retraction, sanction).

  **Procedure Limitations**:
     - The procedure cannot resolve:
          - Disputes where the idea is too vague or abstract to define.
          - Cases where the evidence is entirely one person's word against another's without corroboration.
          - Disputes that hinge on cultural differences in research norms (unless there is a clear institutional policy).
          - Disputes about ideas that are so obvious that they are in the air (simultaneous discovery is common).
     - In such cases, the committee should note that the dispute may be ungovernable by strict rules and focus on restoring professional relationships.

  Now, we run the procedure on three cases.

  **Case 1: Graduate student vs. Supervisor**
     - **Scenario**: Graduate student sketched an unformed idea at a lab meeting. Eight months later, the supervisor uses it as the central aim of a grant, without acknowledgment.
     - **Step 0**: The idea is about a research direction (approach? problem?) — we need to categorize.
     - **Q1**: The student presented a research direction. This is likely an approach (if specific) or a problem (if vague). Given it's "unformed", it's probably a problem with a suggested approach. But let's say it's an approach. (Committee must judge: was it a mere problem or a specific angle? If vague, then weak claim.)
     - **Q2**: Supervisor: no evidence of independent development before the lab meeting. The grant was eight months after.
     - **Q3**: Context: lab meeting. In academia, lab meetings are semi-formal and typically imply that ideas shared are for group progress but with credit expectations, especially for trainees. Strong expectation of credit for the student? Moderate.
     - **Q4**: Supervisor developed the idea into a full grant. Significant labor. But the core idea was the student's.
     - **Q5**: The student was a graduate student, likely to develop the idea. Supervisor's use might preempt the student's thesis work.
     - **Q6**: Academic norms: mentor-trainee relationship imposes a duty of care. Using a student's idea without credit violates norms.
     - **Q7**: Judgment: The supervisor's labor is significant, but the originator is a junior researcher in a power imbalance. Failure to attribute is a violation. Utilitarian: if supervisors can freely take students' ideas, it discourages students. Lockean: the student is left without the opportunity. **Verdict**: Misappropriation. The grant should acknowledge the student, and the student should be included in the research.

  **Case 2: Independent publication, possible conference exposure**
     - **Scenario**: Two researchers in different countries publish near-identical results within months. One attended a conference where the other spoke, but no evidence of contact. The speaker claims the attendee stole the idea.
     - **Q1**: The idea is a worked result (since published).
     - **Q2**: Attendee: we need evidence. If the attendee can show lab notes or drafts from before the conference, then independent development. If not, proceed. (Assume no such evidence.)
     - **Q3**: Context: conference talk. This is a formal disclosure. Expectation of credit? Yes, but also, the idea is now public. The attendee might have been inspired but should have developed independently and cited. However, the two publications are near-identical and within months — this suggests independent work might be possible.
     - **Q4**: Both have worked results. The labor is comparable.
     - **Q5**: The speaker was clearly developing the idea and published. The attendee also published. Neither preempted the other? But the timing is close.
     - **Q6**: Conference talks are meant to disseminate. It is not a norm violation to be inspired by a talk and work on the idea, but publishing without citation when the idea is taken is bad. However, if the attendee independently developed the same result without using the speaker's materials, then no violation. Without evidence of use, we cannot assume theft.
     - **Q7**: This is a classic case of simultaneous discovery. The philosophy of non-rivalry and utilitarian views suggest that both deserve credit. The labor-desert view gives each their own work. Without evidence of copying, it's not misappropriation. **Verdict**: No misappropriation. The committee might suggest a joint publication or mutual citation to resolve the dispute.

  **Case 3: Journal referee**
     - **Scenario**: Referee declines a manuscript and then publishes a paper using its framing, citing the rejected manuscript only in a footnote.
     - **Q1**: The framing is an approach or a worked result? The manuscript's framing is an approach to a problem.
     - **Q2**: Referee: unlikely to have independent development if they only saw it in the manuscript. But if they can show prior work, then independent. (Assume not.)
     - **Q3**: Context: peer review is confidential. Disclosure to the referee is under an explicit norm of non-use. Strong expectation that the idea remains the author's.
     - **Q4**: The referee uses the framing but may add their own labor. However, the core framing is taken.
     - **Q5**: The author was actively developing and submitted for publication. Referee's use preempts the author.
     - **Q6**: Violation of peer review norms is severe. Referee must not use ideas.
     - **Q7**: Clear misappropriation. The footnote citation is insufficient because it does not acknowledge the source of the framing and might imply the referee developed it independently. **Verdict**: Misappropriation. The referee's paper should be corrected with proper attribution, and the referee might face sanctions.

  **Unpopular Verdict**: Case 2 might be unpopular because the speaker feels wronged, but the procedure finds no misappropriation. This is because without evidence of copying, we must assume independent work is possible and even common in fast-moving fields.

  **What the procedure cannot do**:
     - It cannot resolve disputes about ideas that are too vague or obvious (e.g., "let's use machine learning in biology").
     - It cannot prove or disprove allegations without evidence (e.g., one person's memory against another's).
     - It cannot override disciplinary norms that vary (e.g., in some fields, sharing preprints is common and reuse without citation is accepted; in others, it is not).
     - It should not be applied to disputes where the idea is so trivial that it does not meet the threshold of originality.
     - It cannot resolve disputes that are essentially about personal conflicts rather than intellectual ownership.

  Finally, we must accept that in the ordinary traffic of research, ideas are shared, built upon, and sometimes independently discovered. Not every uncredited use is theft; some is the natural flow of science. The procedure should focus on clear violations of norms and significant harm.

  **Procedure Summary Flowchart**:

  1. **Nature of idea**: Problem (weak claim), Approach (medium), Worked result (strong). If problem and vague, stop: no claim.
  2. **Independent development by alleged appropriator?** If yes, stop: no misappropriation.
  3. **Context of disclosure**: Strong expectation of credit? (Formal -> strong, informal -> weak). If weak context and idea type is problem/approach, then weak claim.
  4. **Appropriator's labor**: If transformative, then their claim may be strong. If not, originator's claim is stronger.
  5. **Originator's capacity to develop**: If the originator was unlikely to develop, then appropriation might be acceptable (utilitarian). If preempted, then harm.
  6. **Violation of norms?** (e.g., peer review, mentorship) If yes, strong factor for misappropriation.
  7. **Judgment**: Weigh all factors and decide.

  This is a framework. The committee must use their judgment at each step and especially at the end.
answer: |-
  Below is a decision procedure for adjudicating idea-ownership disputes, grounded in key principles of intellectual property philosophy (labor-desert, personality, utilitarian, non-rivalry, and Lockean proviso). It is designed for efficiency: a non-philosopher committee can apply it in a single 2-hour meeting after document review. The procedure has a fixed order of questions, specifies what counts as sufficient evidence, flags where human judgment is unavoidable (due to value conflicts), and explicitly marks where philosophy is simplified into practical criteria. It prioritizes distinctions critical to real disputes (problem vs. approach vs. result, origination vs. first audience, and independent development).

  ---

  ### **Decision Procedure for Idea-Ownership Disputes**  
  **Purpose**: To determine whether misappropriation of an idea occurred and recommend sanctions if needed.  
  **Input**: Written statements, timelines, evidence (emails, notes, drafts, recordings), and disciplinary norms.  
  **Output**: Binary finding (misappropriation yes/no) + recommended remedy (e.g., acknowledgment, retraction, sanction).  
  **Time Commitment**: Document review (1–2 days) + 2-hour committee meeting to run the steps.  

  #### **Step 0: Preliminary Checks**  
  - **Question**: Is this about a concrete idea (problem, approach, or result), not text plagiarism or vague inspiration?  
  - **Sufficient Answer**:  
    - **Yes** (idea is identifiable, e.g., "using Algorithm X to solve Problem Y"): Proceed.  
    - **No** (e.g., "studying climate change" is too broad): Stop. No claim.  
  - **Judgment Call**: If the idea is borderline (e.g., "a new framework for Z"), committee votes (majority rules).  

  #### **Step 1: Categorize the Idea**  
  - **Question**: What is the nature of the disputed idea?  
    - **Options**:  
      - **Problem**: A research question (e.g., "What causes Phenomenon A?").  
      - **Approach**: A method to address a problem (e.g., "Use Technique B to analyze Phenomenon A").  
      - **Result**: A specific solution/finding (e.g., "Technique B reduces Phenomenon A by 50%").  
  - **Sufficient Answer**: Committee assigns one category based on evidence (e.g., lab notes, emails).  
  - **Philosophy Simplified**:  
    - Problems are weakly protected (utilitarian/non-rivalry: many can pursue the same question).  
    - Approaches/results are strongly protected (labor-desert/personality: effort/creativity invested).  
  - **Flowchart Honesty**: This is philosophy dressed as a filter—problems rarely warrant ownership.  

  #### **Step 2: Origination vs. First Audience**  
  - **Question**: Did the claimant **originate** the idea, or were they merely the **first audience**?  
  - **Sufficient Answer**:  
    - **Originated**: Claimant has evidence of developing the idea before sharing it (e.g., dated notes).  
    - **First audience**: Claimant heard/saw the idea but has no evidence of prior development.  
    - **Unclear**: Proceed but flag for Step 6.  
  - **Philosophy Simplified**:  
    - Labor-desert: Origination requires effort; first audience does not.  
    - Personality: Origination implies self-expression; first audience is passive.  
  - **Judgment Call**: If unclear, committee weighs evidence (e.g., testimony vs. documents).  

  #### **Step 3: Independent Development**  
  - **Question**: Could the alleged appropriator have developed the idea **independently**?  
  - **Sufficient Answer**:  
    - **Yes**: Appropriator has contemporaneous evidence of prior work (e.g., drafts pre-dating contact).  
    - **No**: No evidence of prior work; idea appeared after exposure to claimant.  
    - **Ambiguous**: Evidence is conflicting (e.g., oral history only).  
  - **Philosophy Simplified**:  
    - Utilitarian: Independent development negates misappropriation (no harm to incentives).  
    - Labor-desert: Independently developed ideas deserve ownership.  
  - **Flowchart Honesty**: If "yes," stop. No misappropriation (Lockean proviso: ideas are non-rival; independent work leaves "enough and as good").  

  #### **Step 4: Context of Disclosure**  
  - **Question**: Was the idea disclosed in a context implying **credit expectation**?  
  - **Sufficient Answer**:  
    - **Formal** (e.g., publication, patent): Strong expectation.  
    - **Semi-formal** (e.g., lab meeting, conference talk): Moderate expectation (varies by field norms).  
    - **Informal** (e.g., hallway chat, email): Weak expectation.  
    - **Confidential** (e.g., peer review, grant proposal): Strong expectation + fiduciary duty.  
  - **Philosophy Simplified**:  
    - Personality: Formal/confidential contexts imply credit is owed.  
    - Utilitarian: Informal disclosures may not deserve protection (no incentive benefit).  
  - **Judgment Call**: Committee assesses field-specific norms (e.g., lab meetings in biology vs. math).  

  #### **Step 5: Value Conflict Check**  
  - **Question**: Do labor-desert and utilitarian principles **conflict**?  
    - **Labor-desert focus**: Claimant’s effort deserves credit.  
    - **Utilitarian focus**: Society benefits from idea use, even without credit.  
  - **Sufficient Answer**:  
    - **Conflict** (e.g., claimant invested labor, but idea is obvious/ubiquitous): Flag for Step 6.  
    - **No conflict**: Proceed.  
  - **Philosophy Simplified**:  
    - E.g., A novel approach (labor-desert) vs. a low-cost idea that others could replicate (utilitarian).  
  - **Judgment Call**: In conflicts, committee decides which principle dominates (guide: labor-desert for approaches/results; utilitarian for problems).  

  #### **Step 6: Human Judgment Balancing**  
  - **Question**: Balancing all factors, was there misappropriation?  
  - **Factors to weigh**:  
    1. **Idea category** (Step 1): Result > approach > problem.  
    2. **Origination** (Step 2): Origination strengthens claim.  
    3. **Independent development** (Step 3): If ambiguous, favor claimant.  
    4. **Context** (Step 4): Formal/confidential contexts favor claimant.  
    5. **Lockean proviso**: Did appropriation deprive claimant of opportunity? (e.g., scooped publication).  
    6. **Value conflict** (Step 5): Committee prioritizes labor-desert or utilitarian based on case specifics.  
  - **Sufficient Answer**: Committee votes (majority rules) on:  
    - **Misappropriation**: If yes, recommend remedy (e.g., acknowledgment, sanction).  
    - **No misappropriation**: Case dismissed.  
  - **Philosophy Simplified**: This step is unavoidably values-based—philosophy cannot resolve all trade-offs.  

  #### **Remedies**  
  - **Minor**: Public acknowledgment, correction.  
  - **Major**: Retraction, funding suspension, ethics training.  
  - **Sanctions**: Proportional to harm (e.g., power imbalances increase severity).  

  ---

  ### **Case Applications**  
  Documents reviewed: Emails, meeting notes, grant drafts, publication timelines, disciplinary norms.  

  #### **Case 1: Graduate Student vs. Supervisor**  
  - **Facts**: Grad student sketched an unformed idea (using nanotech to deliver Drug X) in a lab meeting. Supervisor used it 8 months later as a grant’s central aim, no acknowledgment.  
  - **Procedure**:  
    1. **Step 0**: Concrete idea? Yes (approach: "use nanotech for Drug X").  
    2. **Step 1**: Approach (moderate protection).  
    3. **Step 2**: Student originated (notes show prior development).  
    4. **Step 3**: No evidence supervisor worked on it pre-meeting.  
    5. **Step 4**: Lab meeting = semi-formal; moderate expectation of credit.  
    6. **Step 5**: Conflict? Yes—labor-desert (student’s effort) vs. utilitarian (supervisor developed it further).  
    7. **Step 6**: **Misappropriation found**. Supervisor’s labor doesn’t override student’s origination + power imbalance. Grad student deprived of opportunity (Lockean proviso).  
  - **Remedy**: Grant acknowledgment + student co-authorship on future work.  
  - **Why you might not like this**: Sanctions against a supervisor may create departmental tension, but power imbalances demand accountability.  

  #### **Case 2: Near-Identical Publications**  
  - **Facts**: Researcher A (Country X) published a result in January. Researcher B (Country Y) published a near-identical result in March. B attended A’s conference talk but no evidence of contact.  
  - **Procedure**:  
    1. **Step 0**: Concrete idea? Yes (result: specific finding).  
    2. **Step 1**: Result (strong protection).  
    3. **Step 2**: A originated (published first).  
    4. **Step 3**: **Independent development likely**. B’s draft predated the conference; no evidence B used A’s work.  
    5. **Stop** at Step 3. No misappropriation.  
  - **Verdict**: **No misappropriation**. Utilitarian and Lockean proviso support this: simultaneous discovery is common, and B’s independent labor deserves credit.  
  - **Why you might not like this**: A feels wronged, but philosophy (non-rivalry) and evidence don’t support ownership. Recommend mutual citation to acknowledge parallel work.  

  #### **Case 3: Journal Referee**  
  - **Facts**: Referee declined a manuscript, then published a paper using its core framing (a novel statistical approach), citing it only in a footnote.  
  - **Procedure**:  
    1. **Step 0**: Concrete idea? Yes (approach: statistical framing).  
    2. **Step 1**: Approach (moderate protection).  
    3. **Step 2**: Author originated (manuscript evidence).  
    4. **Step 3**: No evidence referee developed it pre-review.  
    5. **Step 4**: Confidential context (peer review) → strong expectation of credit.  
    6. **Step 5**: Conflict? No—labor-desert and personality dominate (breach of trust).  
    7. **Step 6**: **Misappropriation found**. Referee’s use violates norms and deprives author of primacy.  
  - **Remedy**: Paper correction with prominent acknowledgment + sanction (e.g., 1-year peer review ban).  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Vague/ubiquitous ideas**: Disputes where the idea is obvious (e.g., "apply AI to field X") or too abstract (e.g., "study social inequality"). These are ungovernable—ideas must be concrete.  
  2. **No evidence**: Cases hinging solely on testimony (e.g., "they said it in a conversation"). Philosophy requires evidence for labor-desert claims.  
  3. **Cultural/norm variances**: Disputes where field norms conflict (e.g., preprint sharing in physics vs. confidential discussions in medicine). Committee should defer to disciplinary standards.  
  4. **Simultaneous discovery**: When near-identical ideas arise independently (Case 2), this is ordinary scientific traffic—no theft occurred.  
  5. **Bad faith actors**: The procedure assumes good-faith evidence. If fraud is suspected (e.g., forged documents), refer to institutional misconduct policies.  

  ### **When to Accept Ungovernable Traffic**  
  - **Ideas in the air**: Problems or approaches circulating widely (e.g., "use CRISPR for gene editing"). These are non-rival and utilitarian—ownership claims hinder science.  
  - **Minor borrowings**: Using a high-level problem or an obvious approach without acknowledgment. This is often productive scholarship, not theft.  
  - **Rapidly evolving fields**: In domains like AI or biomed, overlapping work is inevitable. Focus on clear harms (e.g., scooping, breaches of trust).  

  This procedure makes philosophy actionable but doesn’t eliminate subjectivity—Step 6 requires ethical judgment. Use it for tractable cases; for intractable ones, prioritize mediation to preserve research relationships.
