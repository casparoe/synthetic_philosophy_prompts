prompt: |-
  I'm the attending veterinarian on the animal care and use committee at a mid-size university, and I need a procedure, not a philosophy seminar. We keep getting protocols for species where sentience is genuinely contested -- an octopus cognition study, Drosophila heat-avoidance assays, crayfish nerve recordings, larval zebrafish -- and our rules basically protect mammals and birds and treat everything else as a grayzone we argue about ad hoc every meeting. Act as a philosopher of mind with a practical streak. Think carefully and maybe brainstorm the design first, then write a decision procedure the committee can actually run on a new protocol: the questions to ask in order about the species and what the procedure does to it, what kinds of evidence of sentience-relevant capacities (nociception vs. pain, flexible trade-offs, self-medication, that sort of thing) should be enough to trigger protections, how to weigh a precautionary principle against imposing enormous costs on researchers for what might be welfare theater, where the procedure should stop and hand things to a human because it's a value call not a factual one, and what the default should be when the evidence is thin in both directions. Then run it on two cases: a student who wants to do nerve recordings from crayfish without anesthesia on the grounds that crustaceans don't feel anything, and a genetics lab whose larval zebrafish work would become vastly more expensive if larvae got full sentient-animal treatment. Be honest about which steps are judgment calls dressed up as procedure, and tell me where the procedure will give an answer I won't like.
reasoning: |-
  Okay, the user is an attending veterinarian on an animal care committee at a university. They're dealing with protocols involving species where sentience is debated—like octopuses, fruit flies, crayfish, and larval zebrafish. Their current system only clearly protects mammals and birds, leaving everything else in a gray area that causes endless arguments. They need a practical decision procedure, not philosophical debates.

  Hmm, they want a step-by-step process that their committee can actually use. The procedure should include specific questions about the species and the procedures involved, criteria for when to trigger protections based on evidence of sentience (like nociception vs. actual pain, flexible behaviors, etc.), and how to balance precaution against research costs. They also want honesty about where judgment calls are necessary and where the procedure might give unpopular answers.

  First, I need to establish core principles. The key is to focus on morally relevant capacities rather than abstract concepts of consciousness. Pain is the main concern because it's the most plausible welfare issue in these gray-zone species. The procedure should minimize suffering while avoiding unnecessary burdens on research.

  For the decision tree, it should start with established categories (mammals/birds get full protections) then move to contested species. The first question should be about existing legal/ethical precedents. If none exist, then assess pain capacity through a checklist of evidence - physiological pathways (like nociceptors and opioids), behavioral responses (trade-offs, avoidance learning), and higher cognitive indicators. 

  The evidence thresholds need to be practical. For example, strong evidence would be multiple independent studies showing pain-related behaviors, while weak evidence might be just physiological pathways without behavioral confirmation. For procedures, the invasiveness matters - acute vs chronic, potential tissue damage, etc.

  The precautionary principle needs implementation rules. Maybe tiered safeguards: minimal for weak evidence, moderate for moderate, full protections only for strong evidence. And there should be a clear "stop and decide" point where it becomes a value judgment for the committee.

  Now for the test cases. For crayfish nerve recordings: they have good evidence of pain capacity (trade-off behaviors, opioid responses), so even acute procedures would require anesthesia unless the researcher can prove the specific protocol avoids suffering. This might upset the researcher but seems justified.

  For larval zebrafish: the evidence is much thinner. Some physiological markers but no convincing behavioral evidence in larvae. So minimal safeguards would suffice - environmental controls, humane endpoints, no anesthesia needed. The genetics lab would be relieved, but some committee members might want more precaution.

  Biggest pain points will be: researchers fighting moderate safeguards for crustaceans, committee members wanting more protection for fish larvae, and everyone disliking the inherent judgment calls in evidence weighting. But at least this procedure forces explicit reasoning rather than endless debates.
answer: |-
  Here's a practical, evidence-weighted decision procedure for your committee, designed to minimize philosophical debate while forcing explicit consideration of morally relevant capacities. It focuses on **pain** as the primary welfare concern for non-vertebrates/invertebrates (since suffering is the core ethical issue in research interventions), uses a *tiered precautionary approach* based on evidence strength, and clearly flags value judgments.

  **Core Principles Embedded:**
  1.  **Pain-Centric:** Protection hinges on the capacity for *pain* (negative affective experience), not just nociception (reflexive response) or general intelligence.
  2.  **Evidence Thresholds:** Defines "sufficient evidence" pragmatically.
  3.  **Procedural Severity Matters:** Protections scale with invasiveness/potential harm.
  4.  **Precaution Weighted by Cost:** Precaution increases with evidence strength and procedure severity, but minimal burden is applied where evidence is very weak.
  5.  **Explicit Uncertainty:** Flags where the answer is a committee value call.

  **The Decision Procedure: A Step-by-Step Checklist**

  **Step 1: Established Category?**
  *   **Question:** Is the species a vertebrate mammal or bird?
  *   **Procedure:**
      *   **YES:** Apply full IACUC/Animal Welfare Act protections. STOP.
      *   **NO:** Proceed to Step 2.

  **Step 2: Legally/Ethically Established Precedent?**
  *   **Question:** Is the species covered by specific national/institutional regulations or widely accepted ethical consensus (e.g., cephalopods in the EU/UK, adult decapod crustaceans in some jurisdictions)?
  *   **Procedure:**
      *   **YES:** Apply the mandated or consensus-level protections (e.g., anesthesia for major procedures in cephalopods). STOP.
      *   **NO:** Proceed to Step 3.

  **Step 3: Evidence Assessment for Pain Capacity**
  *   **Goal:** Determine if there is sufficient evidence suggesting the species *in the relevant life stage* (e.g., larval zebrafish, adult crayfish) possesses the biological machinery for pain.
  *   **Questions & Evidence Types (Require Citations from PI or Committee Library):**
      1.  **Nociception Pathway:** Are nociceptors (specialized threat-detecting neurons) documented? Is there a peripheral-central nervous system pathway for transmitting this signal? (Basic biology papers, neuroanatomy).
      2.  **Physiological Modulation:** Is there evidence of endogenous opioid systems or other neurochemical systems known to modulate pain affectively (not just reflexively) in vertebrates? (Pharmacology, neurochemistry studies).
      3.  **Motivational Trade-Offs:** Does the animal sacrifice a high-priority need (e.g., feeding, seeking shelter) to avoid a noxious stimulus *after* initial exposure? (e.g., hermit crabs leaving preferred shells after shock; crayfish avoiding shocked area despite food presence).
      4.  **Conditioned Avoidance/Learning:** Does the animal learn to associate a neutral stimulus with a noxious one and show long-term avoidance *beyond* simple reflexes? (Classical/operant conditioning studies).
      5.  **Self-Protection/Medication:** Does the animal engage in specific protective behaviors (e.g., grooming/rubbing an injured site) or seek out substances with analgesic properties when injured? (Behavioral pharmacology, injury response studies).
      6.  **Anesthesia/Analgesia Effects:** Does application of substances known to relieve pain in vertebrates (local anesthetics, analgesics) alter responses to noxious stimuli in ways consistent with pain relief (e.g., reduced guarding, resumed normal activities), not just motor blockade? (Pharmacology, behavioral studies).
  *   **Procedure for "Sufficient Evidence":**
      *   **Strong Evidence:** ≥ 3 categories (including at least one from 3, 4, or 6) supported by multiple independent, peer-reviewed studies. *Triggers Tier 2 or 3 Protections (See Step 4).*
      *   **Moderate Evidence:** 2 categories supported (including at least one behavioral: 3,4,5) OR strong evidence in a closely related species/model. *Triggers Tier 1 or 2 Protections (See Step 4).*
      *   **Weak/Insufficient Evidence:** ≤ 1 category supported, or evidence is highly contested/inconclusive. *Triggers Tier 0 or 1 Protections (See Step 4).*
      *   **Value Call Flag:** If evidence is borderline (e.g., solid evidence in 1-2 categories but lacking key trade-offs), mark as "Committee Judgment Required" and proceed to Step 4.

  **Step 4: Determine Protection Tier Based on Evidence + Procedure Severity**
  *   **Goal:** Apply proportionate safeguards. Burden increases with evidence strength and procedure harm.
  *   **Procedure Severity Categories:**
      *   **Mild:** Brief restraint, non-invasive observation, minor environmental perturbation. Low potential for tissue damage/distress.
      *   **Moderate:** Acute procedures causing transient pain/tissue damage (e.g., injection, brief noxious stimulus, terminal anesthesia followed by tissue harvest). Potential for significant distress.
      *   **Severe:** Chronic procedures, surgery, exposure to prolonged/severe noxious stimuli, procedures with potential for lasting impairment. High potential for severe distress/pain.
  *   **Protection Tiers:**
      *   **Tier 0 (Minimal):** Standard environmental control (temp, water quality, space), humane endpoint definition (e.g., moribund state), minimization of handling stress. *Applied when: Weak Evidence + Mild Procedure OR Insufficient Evidence + Any Procedure.*
      *   **Tier 1 (Basic):** Tier 0 + Enhanced environmental enrichment (species-appropriate), mandatory training for handlers, specific humane endpoints defined for the procedure (e.g., specific behavioral changes), post-procedural monitoring, minimization of numbers. *Applied when: Weak Evidence + Moderate/Severe Procedure OR Moderate Evidence + Mild Procedure.*
      *   **Tier 2 (Enhanced):** Tier 1 + Requirement for anesthesia/analgesia for potentially painful procedures (researcher must justify if not used), mandatory post-procedural analgesia plan for recovery, stricter numbers justification, formal behavioral assessment protocol. *Applied when: Moderate Evidence + Moderate/Severe Procedure OR Strong Evidence + Mild/Moderate Procedure.*
      *   **Tier 3 (Full Vertebrate-Level):** As per standard IACUC for mammals/birds: anesthesia/analgesia mandatory for all potentially painful procedures, detailed peri-operative care, strict adherence to 3Rs, veterinary oversight. *Applied when: Strong Evidence + Severe Procedure.*
  *   **Value Call Flag:** If Step 3 flagged "Committee Judgment Required," the committee *must* explicitly vote here on whether to apply Tier 1 or Tier 2 protections based on their collective assessment of the *precautionary weight* vs. *research burden*.

  **Step 5: Default & Uncertainty**
  *   **Default for True Equivocation (Thin Evidence Both Ways):** Apply **Tier 1 Protections**.
      *   *Why:* Balances precaution (acknowledging possibility of pain) with practicality (avoids the highest burdens of Tier 2/3). It imposes *some* cost for welfare but avoids crippling research where evidence is truly minimal. *This is a Value Call embedded in the procedure.*
  *   **Honesty:** This default *will* annoy both strict utilitarians (who see it as costly theater) and strong precautionarians (who see it as insufficient). It's a practical compromise recognizing institutional reality.

  **Running the Cases:**

  **Case 1: Crayfish Nerve Recordings (No anesthesia requested)**
  1.  **Step 1:** NO (Not mammal/bird).
  2.  **Step 2:** NO (No US/institutional mandate for crustaceans... yet).
  3.  **Step 3: Evidence Assessment**
      *   Nociception: YES (Well-documented nociceptors/pathways).
      *   Physiological Modulation: YES (Opioid receptors present, endogenous opioids; morphine affects responses).
      *   Motivational Trade-Offs: YES (e.g., Hermit crabs trade shells, crayfish avoid shocked areas despite food/cover).
      *   Conditioned Avoidance: YES (Learn to avoid locations/stimuli associated with shock).
      *   Self-Protection/Medication: Limited evidence (grooming injured antennae observed).
      *   Anesthesia Effects: YES (Local anesthetics reduce avoidance/defensive responses to noxious stimuli).
      *   **Assessment:** **Strong Evidence** (Nociception, Modulation, Trade-Offs, Conditioning, Anesthesia Effects).
  4.  **Step 4: Protection Tier**
      *   Procedure Severity: **Moderate** (Acute nerve exposure/recording, potential tissue damage).
      *   Evidence + Severity: Strong + Moderate = **Tier 2 Protections**.
      *   **Requirements:** Anesthesia/analgesia REQUIRED for the invasive procedure unless PI provides robust, species/procedure-specific justification *and* alternative mitigation. Enhanced monitoring, strict humane endpoints (e.g., specific aversive movements), post-procedural monitoring/possible analgesia. Stricter numbers justification.
  5.  **Value Call/Unliked Answer:** The PI will argue strenuously against anesthesia (technically difficult, may affect recordings). The procedure mandates it based on strong evidence. *This is where the committee must hold the line or require exceptional justification for deviation.* The answer (anesthesia required) won't please the researcher.

  **Case 2: Larval Zebrafish Genetics (Cost increase with full treatment)**
  1.  **Step 1:** YES, but... larval stage often treated distinctly. Proceed cautiously. (*Note: Adult zebrafish clearly vertebrates. Larvae are the gray zone*).
  2.  **Step 2:** NO (No specific mandate differentiating larvae).
  3.  **Step 3: Evidence Assessment (Focus on *Larvae*)**
      *   Nociception: YES (Nociceptors develop early, basic spinal cord pathways).
      *   Physiological Modulation: WEAK/DEVELOPING (Opioid system components present but functional maturity unclear in early larvae).
      *   Motivational Trade-Offs: LIMITED/WEAK (Simple avoidance dominates; robust trade-offs like sacrificing feeding for safety not clearly demonstrated in very young larvae).
      *   Conditioned Avoidance: LIMITED (Simple associative learning possible, but complexity/duration often low in early stages).
      *   Self-Protection/Medication: NO (Not observed).
      *   Anesthesia Effects: YES (Anesthetics stop responses, but this primarily shows loss of *reflexes*, not necessarily pain relief *affect*). Analgesic effects less clear.
      *   **Assessment:** **Weak/Moderate Evidence (Leaning Weak)**. Strong nociception, some early modulation/learning capacity, but lacks robust evidence for *affective* pain (trade-offs, self-protection) comparable to adults or other vertebrates. Significant uncertainty.
      *   **Value Call Flag:** Borderline. Committee Judgment useful.
  4.  **Step 4: Protection Tier**
      *   Procedure Severity: Highly variable. Assume standard genetics: **Mild** (egg collection, observation) to **Moderate** (microinjection, fin clip for genotyping, chemical exposure - potential transient distress/tissue damage).
      *   Evidence + Severity:
          *   *Mild Procedures:* Weak Evidence + Mild = **Tier 0** (Standard env. control, humane endpoints).
          *   *Moderate Procedures:* Weak/Moderate Evidence + Moderate = **Tier 1** (Committee Judgment leans here). OR **Tier 0** if Committee judges evidence truly insufficient for larvae. *This is the Key Value Call.*
      *   **Likely Outcome (Committee Judgment): Tier 1 Protections for Moderate Procedures.** Requires enrichment (e.g., tank complexity), specific humane endpoints (e.g., cessation of feeding, abnormal swimming), handler training, minimization strategies. *Not* full anesthesia/analgesia mandate (Tier 2/3).
  5.  **Value Call/Unliked Answer:** Precautionaries may want Tier 2 due to vertebrate phylogeny. The procedure, based on *evidence specific to larvae*, likely results in Tier 1, avoiding the "enormous cost" of full vertebrate protocols. This protects welfare *proportionally* to the evidence while keeping research feasible. Some committee members may dislike this "lower" protection level for a vertebrate.

  **Where the Procedure Might Chafe:**
  1.  **The Vertebrate/Invertebrate Divide:** The starting point privileges mammals/birds. The procedure mitigates this via evidence review, but the baseline is unequal.
  2.  **"Sufficient Evidence" Thresholds:** Arbitrary numbers (e.g., 3 categories) are necessary but debatable. Committees might argue over what constitutes "support" in a category.
  3.  **Tier 1 Default for Equivocation:** Both sides will find fault. Researchers see burden without proof; welfare advocates see insufficient precaution.
  4.  **Cost vs. Precaution:** The procedure forces explicit trade-offs (Step 4 tiers). Researchers will feel burdened by Tier 1/2 for invertebrates; welfare advocates will feel Tier 1 is inadequate for vertebrates (larvae).
  5.  **Anesthesia Mandates:** Technically difficult in many non-mammals. The procedure mandates it for strong evidence + invasive procedures, which will be a major point of contention (as in the crayfish case).

  This procedure provides structure, forces evidence-based discussion, minimizes re-litigating philosophy each time, and makes the value calls explicit and contained. It accepts that perfect objectivity is impossible but replaces ad hoc debates with a defined, auditable process. Good luck!
