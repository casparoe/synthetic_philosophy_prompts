     - **Description:** If every voter prefers alternative A over alternative B, then B should not be chosen.
     - **Case behind it:** It's a basic consensus requirement: if everyone agrees that A is better than B, then B should not win.
     - **Status:** Non-negotiable for most.

  5. **Anonymity (AN):**
     - **Description:** The winner should not depend on the names of the voters; i.e., if two voters swap their preferences, the outcome remains the same.
     - **Case behind it:** Fairness — every voter should be treated equally.
     - **Status:** Often non-negotiable, but some rules (like the Electoral College) are not anonymous.

