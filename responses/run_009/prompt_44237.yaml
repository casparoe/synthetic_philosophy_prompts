answer: |-
  ### Desiderata for a Social Choice Function (SCF)

  Below is a checklist of desiderata for a social choice function that maps a profile of strict preferences (linear orders) over **three or more alternatives** and **two or more voters** to a single winner. Each item includes the core demand, rationale, and status (non-negotiable vs. camp-specific). Cardinality is addressed upfront.

  #### Core Desiderata
  1. **Universal Domain (UD)**  
     - **Demand**: The SCF must handle every possible profile of strict preferences.  
     - **Rationale**: Real-world preferences are unpredictable; a robust rule cannot assume restrictions.  
     - **Status**: Non-negotiable for most normative theories.  

  2. **Resoluteness (RES)**  
     - **Demand**: The SCF must always output a single winner (no ties).  
     - **Rationale**: Practical decision-making requires a unique outcome.  
     - **Status**: Non-negotiable; ties necessitate arbitrary tie-breaking, violating fairness.  

  3. **Pareto Efficiency (PE)**  
     - **Demand**: If all voters prefer alternative \(A\) over \(B\), then \(B\) cannot win.  
     - **Rationale**: Unanimous agreement should be respected.  
     - **Status**: Non-negotiable; violating it implies ignoring consensus.  

  4. **Non-Dictatorship (ND)**  
     - **Demand**: No single voter dictates the winner in all profiles.  
     - **Rationale**: Democracy requires influence from all voters.  
     - **Status**: Non-negotiable; otherwise, the rule is trivial.  

  5. **Strategy-Proofness (SP)**  
     - **Demand**: Truthful reporting is a **dominant strategy** for every voter. Formally: for every voter, every true preference \(P_i\), every reported preference \(P'_i \neq P_i\), and every profile of others’ preferences \(P_{-i}\), the outcome under \((P_i, P_{-i})\) is at least as good as under \((P'_i, P_{-i})\) according to \(P_i\).  
     - **Rationale**: Prevents strategic voting by making honesty optimal regardless of others’ votes.  
     - **Distinctions**:  
       - **Strong SP** (as above): No voter can ever gain by lying, even with full knowledge of \(P_{-i}\).  
       - **Weak SP** (e.g., Bayes-Nash): Voters cannot gain by lying when they know only the *distribution* of \(P_{-i}\), not the actual profile. Strong SP is the gold standard; weak SP is a pragmatic fallback.  
     - **Group Manipulation**: Individual SP **does not imply** group strategy-proofness. A coalition might profitably coordinate lies even if no single voter can (e.g., in the Borda count). Thus, **Group Strategy-Proofness (GSP)** is a separate desideratum:  
       - **GSP Demand**: No coalition can jointly misreport to make all members at least as well off and one strictly better off.  
       - **Status**: Camp-specific (e.g., mechanism designers value it, but it’s often sacrificed for other properties).  
     - **Manipulability in Principle vs. Practice**: SP forbids manipulation *in principle*. Whether it’s *practically feasible* (e.g., computationally easy) is irrelevant to the desideratum.  
     - **Status**: Non-negotiable for incentive compatibility, but strong SP is rarely achievable (see Gibbard-Satterthwaite).  

  6. **Anonymity (ANON)**  
     - **Demand**: The winner is invariant to permutations of voter identities.  
     - **Rationale**: Equal voting power ("one person, one vote").  
     - **Status**: Non-negotiable for egalitarian systems.  

  7. **Neutrality (NEUT)**  
     - **Demand**: The winner is invariant to permutations of alternative labels.  
     - **Rationale**: Fairness to candidates/platforms.  
     - **Status**: Non-negotiable; bias toward alternatives is unjustifiable.  

  #### Cardinal vs. Ordinal Information
  - **Call**: **Ordinal rules suffice**.  
    - **Rationale**: Intensity of preference (cardinal data) is difficult to elicit truthfully and compare interpersonally. Ordinal preferences are simpler, more robust, and standard in voting theory. Cardinal rules (e.g., quadratic voting) introduce new vulnerabilities (e.g., exaggeration) and are not necessary for core desiderata.  

  #### Camp-Specific Desiderata
  8. **Condorcet Consistency (CC)**  
     - **Demand**: If a Condorcet winner exists (beats all others pairwise), it must win.  
     - **Rationale**: Reflects majority will in head-to-head matchups.  
     - **Status**: Preferred by majoritarian camps; conflicts with SP.  

  9. **Monotonicity (MON)**  
     - **Demand**: Improving a winner’s rank in some ballots cannot cause it to lose.  
     - **Rationale**: Rewarding popular support avoids perverse incentives.  
     - **Status**: Widely accepted but occasionally relaxed (e.g., in IRV).  

  10. **Simplicity (SIMP)**  
      - **Demand**: The rule should be computationally tractable and easy for voters to understand.  
      - **Rationale**: Promotes accessibility and trust.  
      - **Status**: Camp-specific (pragmatists prioritize it; theorists may tolerate complexity).  

  ---

  ### Tensions and the Gibbard-Satterthwaite Theorem
  The Gibbard-Satterthwaite (GS) theorem states that for \(\geq 3\) alternatives, no SCF satisfies **UD**, **SP** (strong), **ND**, and **surjectivity** (every alternative can win in some profile). **PE implies surjectivity** (if everyone ranks \(A\) top, \(A\) wins), so we use PE as a proxy.  

  #### Minimal Unsatisfiable Set  
  - **\unsatisfiable{Universal Domain; Strategy-Proofness; Non-Dictatorship; Pareto Efficiency}**  
  - **Minimality Argument**:  
    - **Drop UD**: With restricted domains (e.g., single-peaked preferences), median voting satisfies SP, ND, PE.  
    - **Drop SP**: Borda count satisfies UD, ND, PE (but is manipulable).  
    - **Drop ND**: Dictatorship satisfies UD, SP, PE.  
    - **Drop PE**: Constant rules (e.g., always choose \(A\)) satisfy UD, SP, ND (but violate PE/surjectivity).  
    Thus, removing any one from {UD, SP, ND, PE} allows the others to hold.  

  #### Even Without GS, Tensions Exist  
  - **SP vs. CC**: Condorcet methods (e.g., Copeland) violate SP. A voter may misreport to create a favorable Condorcet winner.  
  - **SP vs. MON**: Instant-runoff voting (IRV) is monotonic under some definitions but violates SP.  
  - **GSP vs. SIMP**: Achieving GSP often requires complex rules (e.g., Vickrey auctions), conflicting with simplicity.  

  ---

  ### Evaluating Escape Hatches  
  1. **Randomization**:  
     - Output a lottery over alternatives (e.g., random dictatorship).  
     - **Verdict**: Satisfies SP (in expectation), ND, PE, and UD. Weakens resoluteness (deterministic winners lost), but is a legitimate workaround.  

  2. **Domain Restrictions**:  
     - **Single-Peaked Preferences**: Median voting satisfies SP, ND, PE, ANON, NEUT.  
     - **Verdict**: Legitimate if real-world preferences fit the restriction (e.g., ideological spectra).  

  3. **Computational Hardness of Manipulation**:  
     - **Demand**: Finding a profitable manipulation is computationally hard (e.g., NP-hard).  
     - **Verdict**: Changes the subject from incentive compatibility to practicality.  
       - **Conflicts**:  
         - May violate SIMP (complex rules are hard to audit).  
         - Does not ensure SP (manipulation exists; hardness is circumstantial).  
       - Not a weakening of SP—it’s a distinct criterion for *pragmatic* rules (e.g., some STV variants).  

  ---

  ### Final Assessment  
  - **SP is the linchpin**: It conflicts with UD, ND, and PE (via GS), and with CC/MON even without GS.  
  - **Cardinality rejected**: Ordinal preferences suffice; cardinal rules introduce new problems.  
  - **Key trade-off**: Strong SP requires domain restrictions or randomization—otherwise, desiderata are incompatible.  

  \unsatisfiable{Universal Domain; Strategy-Proofness; Non-Dictatorship; Pareto Efficiency}
