prompt: |-
  I'm a TA for a second-year philosophy of language course, and I've been given a single fifty-minute section on the semantics and pragmatics of slurs. Don't write the section for me — plan it. The students will arrive holding two beliefs: that a slur is simply a rude or intensified version of the neutral group term, and that whether an utterance is offensive is entirely a matter of the speaker's tone and intent. The plan should build toward the idea that slurs carry a stable non-at-issue component that projects and resists cancellation or paraphrase — but I need the dependency structure made explicit: should the at-issue/non-at-issue distinction be introduced before or after the substitution failures are on the table, and why in that order? For the carrying example, I won't say the words aloud and won't have students produce them either, so recommend among three vehicles — a censored mention on a slide, a dated slur whose targets have largely outgrown or reclaimed it, or an invented toy slur for, say, redheads — and specify what the chosen vehicle must demonstrate and what it must not be able to demonstrate. Predict the misconceptions in the order the students will actually raise them (I expect "if in-group speakers can use it, the word itself must be neutral" and "appropriated uses are just a matter of tone") and attach each to the point in the sequence where it should be absorbed rather than left for the final five minutes. State explicitly what you would refuse to cover at this level — my candidates are indexicality and the expressive-versus-descriptive-content debate — and say whether refusing both is right. Close with the single check-for-understanding question I should ask to find out whether the distinction has landed rather than just been tolerated, and give it as the last line of your reply in the form \answer{...}, with only the question text inside the braces.
reasoning: |-
  Okay, the user is a TA preparing a 50-minute section on the semantics and pragmatics of slurs for a philosophy of language course. The students have two misconceptions: that slurs are just rude versions of neutral terms, and that offensiveness depends solely on speaker intent. The goal is to show that slurs carry a stable non-at-issue component that projects and resists cancellation. 

  Hmm, the main challenge is sequencing. Should the at-issue/non-at-issue distinction come before or after substitution failures? Let me think... Introducing the distinction first would give students the framework to understand why substitution fails. But showing substitution failures first might create cognitive dissonance, making them more receptive to the distinction. The latter seems better pedagogically—start with observable phenomena before theory.

  For the slur example, the user wants to avoid saying actual slurs. Among the options: censored mention, dated slur, or invented slur. A censored mention (like "n*****") is risky—even masked, it could cause distress. A dated slur (like "colored" for African Americans) might not demonstrate the projective behavior effectively since it's less charged now. An invented slur (say "ginger" for redheads) seems safest. It avoids harm, allows demonstrating key properties, but must be clearly framed as hypothetical to avoid trivialization. 

  Predicting misconceptions... The first one is "if in-group speakers can use it, the word must be neutral." This should surface during the discussion of appropriated uses. The second is "appropriation is just tone," which will likely come up when contrasting in-group vs. out-group usage. Both need addressing mid-lecture, not at the end, to prevent confusion from snowballing.

  What to exclude? Indexicality and the expressive/descriptive debate. The user’s instinct is right—both are too advanced for this level. Indexicality would require understanding context-dependency, which isn’t core to the non-at-issue point. The expressive/descriptive debate is a rabbit hole; sticking to "non-at-issue content" as a broad category keeps focus.

  For the check-for-understanding question, it needs to test if students grasp that the offensiveness isn’t cancellable. Something like: "If someone says '[Invented slur] are trouble, but I don’t endorse that view,' why does the offense persist?" The answer should highlight projection and resistance to cancellation.

  The user’s deep needs: They’re time-pressed (50 minutes), ethically cautious (avoiding harm), and want conceptual clarity. They also need to preempt common misunderstandings without getting derailed. The plan must be tight, example-safe, and misconception-responsive.
answer: |-
  Here’s a structured 50-minute plan prioritizing conceptual dependencies and misconception absorption:

  **Core Sequence & Rationale**  
  1. **Substitution Failures First (15 mins)**  
     - *Activity*: Contrast neutral term vs. slur in identical contexts:  
       *"A: How many [gardeners] showed up? B: All three [gardeners] did."* → No issue.  
       *"A: How many [gardeners] showed up? B: ?All three [slur] did."*  
     - *Vehicle*: **Invented slur** (e.g., "*ruddy*" for redheads). *Why*: Safest, avoids historical baggage while demonstrating semantic anomaly.  
     - *Key Point*: Slurs *break* utterances even with neutral intent/tone → challenges "just tone" belief immediately.  

  2. **Introduce At-Issue/Non-At-Issue (15 mins)**  
     - *After* substitution failures to leverage cognitive dissonance: "Why did the sentence break? Because slurs add something *extra*."  
     - Define:  
       - *At-issue*: Answer to QUD (e.g., *how many showed up*).  
       - *Non-at-issue*: Collateral content (e.g., *contempt for the group*).  
     - *Demo*: Embedding test: *"It’s false that [slur] are lazy"* still conveys contempt → projects beyond negation.  

  3. **Appropriation & Projection (12 mins)**  
     - *Absorb "In-group use = neutrality"*: Show in-group utterance: *"We’re proud [slur]!"*  
       - *Contrast*: Still offensive if used by out-group → word carries stable content, but speaker-group relations modulate *acceptability*.  
     - *Absorb "Appropriation = just tone"*: Play audio (pre-screened) of same word spoken warmly vs. hatefully.  
       - *Reinforce*: Warm tone doesn’t cancel contempt component; it layers camaraderie *on top* of reclaimed term.  

  4. **Resistance to Cancellation (5 mins)**  
     - *Demo*: *"#[Slur] are lazy, but I don’t endorse that"* → still offensive.  
     - *Key*: Non-at-issue content persists → not "intent alone."  

  **Exclusions & Why**  
  - **Indexicality**: Requires understanding context-dependence (beyond scope; distracts from semantic stability).  
  - **Expressive/Descriptive Debate**: Overly granular for intro; "non-at-issue" suffices here.  
  - *Refusing both is correct*: Essential for time and focus.  

  **Predicted Misconceptions & Absorption Points**  
  - **"If in-group speakers can use it, the word itself must be neutral"** → Absorbed during **Appropriation & Projection** (Step 3) via in-group/out-group contrast.  
  - **"Appropriated uses are just a matter of tone"** → Absorbed during **Appropriation & Projection** (Step 3) via tone demo + projection recap.  
  - **"But offense *is* about intent—you just need context!"** → Pre-empted in **Cancellation Demo** (Step 4) showing failed cancellation.  

  **Check-for-Understanding Question**  
  \answer{In the utterance "[Invented slur] caused trouble again today," why might someone be offended even if the speaker denies personal prejudice?}
