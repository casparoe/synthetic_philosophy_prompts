answer: |-
  ### The Theorem in My Terms (~490 words)
  Think of each individual as a probabilistic predictor with a scalar output (vNM utility). Their utility function \(u_i\) is defined up to affine transformations: \(u_i' = a_i u_i + b_i\) (\(a_i > 0\)), meaning choice of origin (zero-point) and scale (unit) are arbitrary—this is gauge freedom. Society is an ensemble model aggregating these predictors under risk (lotteries over outcomes). 

  **Axioms (Constraints):**  
  1. **Individual Rationality:** Each \(u_i\) satisfies vNM axioms (linear in probabilities).  
  2. **Social Rationality:** Social utility \(U\) also satisfies vNM axioms → \(U\) is linear in probabilities.  
  3. **Pareto Efficiency:** If all individuals weakly prefer lottery \(A\) over \(B\) (\(E[u_i(A)] \geq E[u_i(B)]\) for all \(i\)), then society weakly prefers \(A\) (\(E[U(A)] \geq E[U(B)]\)). Strong Pareto: Strict individual preference implies strict social preference.  

  **Theorem:** Given these axioms, \(U\) must be a **positive-weighted sum of individual utilities**:  
  \[
  U = \sum_{i=1}^n w_i u_i, \quad w_i > 0
  \]  
  *Proof Sketch:* Pareto implies \(U\) is monotonically increasing in each \(u_i\). vNM linearity + monotonicity \(\Rightarrow\) \(U\) affine in each \(u_i\). Affine aggregation across linearly independent \(u_i\) forces \(U\) to be linear (no cross-terms). Weights \(w_i\) are strictly positive by Strong Pareto.  

  **Two Derivations:**  
  - **Direct Route:** Above. Assumes individual and social vNM rationality + Pareto.  
  - **Impartial Observer:** Adds a "veil of ignorance": An impartial observer imagines being any individual with equal probability. Their utility under risk is \(U = \frac{1}{n}\sum u_i\). This *implies* equal weights, but only if observer’s utility mirrors social utility.  

  **What "Equal Weights" Requires:**  
  The theorem specifies the functional form \(U = \sum w_i u_i\), but weights \(w_i\) are **not identified** due to gauge freedom. Fixing weights (e.g., \(w_i = 1\)) requires normalizing all \(u_i\) to **commensurate units**. This normalization is external—no axiom pins down \(a_i, b_i\). Claiming "equal weights" is optimal imports ethical assumptions (e.g., "equal concern") not in the math.  

  ---

  ### What Translates Cleanly (~150 words)  
  - **vNM utilities as predictors:** Each \(u_i\) is a model output with affine gauge freedom (zero/scale undefined).  
  - **Social utility as ensemble:** \(U\) is a linear ensemble of individual models.  
  - **Pareto as a constraint:** Analogous to a monotonicity condition in loss aggregation (if all individual losses decrease, social loss shouldn’t increase).  
  - **Unidentified weights:** \(w_i\) are parameters with gauge freedom; choosing \(w_i = 1\) requires fixing the scale of all \(u_i\) first. Sen’s objection is exactly this: Without normalization, "equal weights" is arbitrary. The theorem only guarantees a *positive-weighted sum*, not equality.  
  - **Linearity from rationality:** vNM axioms \(\leftrightarrow\) enforcing linearity in probabilities (like using linear layers in a network).  

  ---

  ### What Gets Distorted (~200 words)  
  - **"Impartial Observer" as derivation:** Framing it as an "original position" suggests a unique ethical justification. But mathematically, it’s just assuming social utility equals the expected utility of a random individual. This *implies* equal weights only if:  
    - The observer’s identity gamble has uniform probability, *and*  
    - Social utility is *defined* as the observer’s utility.  
    Neither is enforced by the axioms alone—it’s an added construct. Translating this as "ensembling with uniform weights" oversimplifies the ethical leap.  
  - **Welfarism:** The claim that *only* utilities matter (not "who" has them). This translates to \(U\) being a function *only* of the vector \((u_1, u_2, ..., u_n)\), but the theorem doesn’t *assume* this—it *derives* it from Pareto + vNM. Calling this "ignoring input features" (e.g., wealth, effort) is fair, but the derivation shows it’s a consequence, not an axiom.  

  ---

  ### What Has No Expression in My Vocabulary (~200 words)  
  **Diamond’s Objection:** Consider two lotteries:  
  - **L1:** Give a kidney to Alice (certain).  
  - **L2:** Flip a fair coin: kidney to Alice if heads, Bob if tails.  

  Assume \(u_{\text{Alice}}(\text{kidney}) = u_{\text{Bob}}(\text{kidney}) = 1\), else 0. Both lotteries have the same expected social utility \(U\) under any linear aggregation. But Diamond argues society should prefer **L2** on fairness grounds—it gives Bob a chance. Harsanyi’s framework is **blind to risk distribution**: It only sees *aggregate* expected utility, not *who bears risk*.  

  *Why ML vocabulary fails:*  
  - **Batch-level loss aggregation:** Standard losses (e.g., mean squared error) sum over samples, treating all equally. This is analogous to Harsanyi—it ignores *which* samples bear high loss (risk).  
  - **No counterpart to "procedural fairness"**: Optimization cares about global minima, not the path (e.g., stochastic gradients spread "risk" across batches, but this isn’t modeled explicitly).  
  Diamond’s point is invisible because the setup *by construction* only aggregates scalars, not identities.  

  ---

  ### Where the Residue Lives (~150 words)  
  The residue is **not** your vocabulary’s blind spot—it’s fundamental to Harsanyi’s formalism.  
  - **Sen/Diamond critiques expose ethical assumptions embedded in normalization and aggregation.**  
    - Sen: Choosing commensurate units (\(a_i, b_i\)) is ethical, not mathematical. "Equal weights" requires asserting that all utilities are *morally* interchangeable after normalization.  
    - Diamond: Linear aggregation erases distributional concerns (fairness, risk-bearers). This is a *design choice* to ignore covariance between identity and outcome.  
  **Optimization frameworks *can* express these** (e.g., adding fairness constraints), but Harsanyi’s axioms forbid this. The residue is that his theorem claims to derive utilitarianism from "rationality" alone, but:  
  1. Unidentified weights mean "utilitarianism" isn’t fully specified.  
  2. Linearity is a *consequence* of vNM axioms, which encode risk neutrality—a substantive assumption Diamond rejects.  

  ---

  ### Calibration (~100 words)  
  **Confidence:** High on technical translation (theorem, Sen). Diamond’s objection is correctly framed as risk-distribution blindness.  
  **Least Sure:** Whether the Impartial Observer adds material content. Ethically, it feels distinct, but mathematically it’s equivalent to assuming social utility = average utility. Harsanyi presents it as foundational, but it’s redundant given the direct proof.  
  **Your Potential Misstep:** You slightly conflate Sen and Diamond. Sen’s core is about **interpersonal comparability** (normalization), not just weights. Diamond rejects **ex ante equality** under risk. Both are separate objections.  
  **Residue Verdict:** The critiques are valid; Harsanyi’s "math" smuggles in ethics via normalization and risk-linearity. Your vocabulary reveals this cleanly.  

  **Key References for Verification:**  
  - Sen, A. (1970). *Collective Choice and Social Welfare* (on comparability).  
  - Diamond, P. (1967). *Cardinal Welfare, Individualistic Ethics...* (risk-bearing critique).  
  - Weymark, J. (1991). *Harsanyi’s Social Aggregation Theorem* (technical clarity).
