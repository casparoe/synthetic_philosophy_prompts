answer: |-
  **Ethics 410 Final Examination**  
  **Question 3 (25 marks):**  
  Taurek’s coin-flip proposal in the "David vs. five" dilemma is interpreted in three contested ways:  
  (A) It is a *genuinely correct decision-procedure* (giving equal chances satisfies equal concern).  
  (B) It is *not a decision-procedure* but a *dramatization* of moral indeterminacy when reasons "run out."  
  (C) It is a *confusion* conflating equal chances with equal concern, thereby violating impartiality.  

  Defend *one* interpretation as most philosophically defensible. You must:  
  (i) Explain why your chosen interpretation best resolves the core tension between "each counts for one" and aggregative saving,  
  (ii) Refute the *strongest version* of each rival interpretation, and  
  (iii) Address how your view withstands a major objection *from the standpoint of the rival you consider strongest*.  

  ---

  **Model Answer (Approx. 600 words):**  
  The coin flip is best understood as (B): a dramatization of moral indeterminacy, not a substantive decision-procedure. Taurek’s core claim is that numbers lack intrinsic moral significance. Saving five over one isn’t required because "the loss of the five" isn’t a unified harm demanding prevention; we only owe equal concern to *individuals*. When choosing whom to save, we face irreconcilable moral claims: David’s claim to life versus each of the five’s claims. No principle (like aggregation) exists to override this symmetry of individual claims. The coin flip makes vivid this absence of a rational tiebreaker—it doesn’t *create* fairness but *displays* the normative void.  

  **(A) Fails as a decision-procedure.** Proponents argue flipping grants equal respect by equalizing survival chances (1/6 for David, 5/6 for each of five). But this confuses procedural fairness with moral justification. Giving David a 50% chance (while the five share 50%) *arbitrarily* weights his claim against the *group*, violating impartiality. Each of the five has as strong a claim as David; pooling their claims into one "option" illegitimately dilutes their moral standing. Equal concern demands weighing *each individual claim equally*, not artificially constructing a lottery between David and a bloc. The lottery doesn’t "respect" the five; it subordinates five equal claims to David’s via a coin.  

  **(C) Misdiagnoses the problem.** Critics call the flip irrational, noting it reduces expected survivors (3 vs. 5). But this objection presupposes aggregation’s validity—precisely what Taurek denies. If numbers don’t count, maximizing survivors isn’t obligatory. The "confusion" charge also misfires: Taurek *agrees* equal chances ≠ equal concern. His point is that *no positive action* (like saving the five) expresses equal concern here because no action can satisfy all claims. The flip’s "confusion" reveals a deeper truth: morality lacks resources to dictate a choice.  

  **Against (A)’s strongest objection:** (A) insists flipping *is* fairer than picking arbitrarily, as it avoids bias. But dramatization agrees: flipping *is* preferable to caprice, but only as an acknowledgment of indeterminacy, not as a positive duty. Flipping is permissible *because* no choice is uniquely rational, not because it instantiates justice.  

  **Against (C)’s strongest objection:** (C) argues that refusing to aggregate ignores the horror of preventable deaths. But dramatization accepts this horror—it simply denies morality can *require* aggregation. Saving the five isn’t *wrong*; it’s *optional*. One may save the group, but not because numbers "count." The agony of choice reflects tragic moral limits, not error.  

  **(B) succeeds** by exposing the dilemma’s structure: reasons run out because individual claims are incommensurable. The flip isn’t a solution; it’s a ritual acknowledging that in hard choices, morality sometimes falls silent.  

  ---

  **Marking Scheme (25 marks total):**  

  1.  **Accurate Interpretation (5 marks):**  
      *   A (5): Clearly distinguishes chosen view (A/B/C) from rivals; precisely articulates Taurek’s core argument about individual claims vs. aggregation.  
      *   B (B Range): Superficially defines views; misstates Taurek’s position on aggregation/equal concern.  

  2.  **Defense of Chosen View (6 marks):**  
      *   A (6): Persuasive case for why chosen view best resolves "each counts for one" vs. saving the group; uses core concepts (equal concern, moral claims, reasons) effectively.  
      *   B (B Range): Defense relies on assertion or neglects the core tension; weak conceptual grounding.  

  3.  **Refutation of Rival Interpretations (6 marks - 3 marks per rival):**  
      *   A (3 per rival): Identifies and dismantles the *strongest possible argument* for each rival (A & C), not a straw man; directly engages their core rationale.  
      *   B (B Range per rival): Refutes a weak version; misrepresents the rival’s core argument; fails to target its strongest point.  

  4.  **Response to Strongest Rival Objection (5 marks):**  
      *   A (5): Identifies the *most compelling objection* to their view *from the perspective of the rival they find strongest* and offers a robust, conceptually grounded rebuttal.  
      *   B (B Range): Addresses a weak or irrelevant objection; rebuttal is unconvincing or off-point; fails to engage the rival’s perspective deeply.  

  5.  **Clarity, Precision & Philosophical Rigor (3 marks):**  
      *   A (3): Logical flow; precise terminology; avoids ambiguity; demonstrates sophisticated grasp of meta-ethical implications (e.g., nature of reasons, indeterminacy).  
      *   B (B Range): Unclear arguments; inconsistent terms; conflates concepts; misses deeper philosophical stakes.
