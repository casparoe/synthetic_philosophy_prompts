prompt: |-
  I work for a mid-sized state government's office of continuity and resilience, and my least favorite part of the job has become the word "collapse." Roughly twice a month somebody — a consultant with a slick deck, a worried planner from the ag department, someone forwarding a think tank report — sends us a claim that some system we nominally steward is "collapsing": the groundwater in the eastern agricultural basin, the rural hospital network, the sardine fishery, one time even the DMV. The director wants to know which of these to treat as emergencies and which belong in the ordinary planning queue, and right now we have no principled way to answer; we sort of vibe based on how scared the writeup sounds. From what I've read, the actual collapse literature is basically a long argument about whether "collapse" even names one kind of event: the Maya case where the southern lowland cities emptied out while cities in the north carried on, Tainter's story about diminishing returns on complexity, the people who argue Easter Island wasn't so much a collapse as a transformation people survived, and the skeptics who say "collapse" is mostly a label outsiders stick on a change they happen to dislike. I want the usable parts of that debate turned into a screening procedure my program officers can run in under an hour per claim, with no field data, producing a one-paragraph verdict for the director.

  So what I'd like is a set of questions in order — things like: what exactly is the unit claimed to be collapsing (a population, an institution, a way of life?), over what timescale, is the system ending or reorganizing into something cheaper, is the claimed loss one of complexity or one of wellbeing, who benefits from the word "collapse" being used here — each with a note on what counts as a sufficient answer, where the procedure terminates early with "this isn't a collapse framing, recast it as something else," and where it has to stop and hand the call to a human because it's a values question no checklist can settle. I expect the Maya/Easter Island-style cases, where the answer hinges on what you think the society even is, will land in that last bucket, and I want the procedure to be honest about that about itself. It should also distinguish between claims that are wrong but urgent, and claims that are right but slow, since those need different routing, and it should flag that a "no" on the collapse framing doesn't mean nothing bad is happening.

  Then run it on three claims I actually recieved last year: (1) a consultant says the eastern basin aquifer is being drawn down and regional agriculture will collapse within a decade; (2) a local op-ed calls the closure of four rural hospitals in two years "the collapse of rural healthcare"; (3) the sardine fishery, where the stock is genuinely way down but the fleet just switches target species every few years anyway. People in my office tell me the procedure will probably refuse the collapse framing on claim 2 even though the op-ed author is obviously right that something bad is happening — good, I want to see how the procedure handles handing back an answer I politically won't like. And please tell me flat out what the procedure cannot do: my guess is it can classify a claim but can't forecast whether a real collapse is likely, and if that's right, say so instead of smuggling a prediction in.
reasoning: |-
  Okay, the user works in a state government's office focused on continuity and resilience. Their main issue is handling frequent claims about various systems "collapsing," which causes confusion in prioritization. They need a systematic way to evaluate these claims quickly, without field data, to determine if they're actual emergencies or just routine issues. 

  First, I need to understand the core problem: they're overwhelmed by the term "collapse" being used loosely. The director wants a clear method to sort these claims. The user mentioned examples like aquifers, hospitals, and fisheries. They also referenced academic debates on collapse (e.g., Maya, Tainter, Easter Island), highlighting that "collapse" isn't a monolithic concept. 

  The user's explicit request is for a screening procedure with specific questions that can be answered in under an hour. The procedure must categorize claims, terminate early if "collapse" is misapplied, and flag value judgments. It should also differentiate between urgent but wrong claims versus accurate but slow-moving issues. 

  Looking deeper, the user might be concerned about resource allocation. Mislabeling something as a collapse could divert attention from real emergencies. They also need political cover—especially when the procedure rejects a "collapse" framing even when something bad is happening (like the hospital closures). The unspoken need here is credibility: a tool that justifies decisions objectively, reducing subjectivity and potential backlash.

  I'll structure the procedure around key collapse criteria: system definition, irreversibility, rate of change, loss type, and stakeholder framing. Each question should have clear exit points. For instance, if a system isn't clearly defined or the change is reversible, it's not a collapse. The procedure must also acknowledge its limits—it can't predict future collapses, only assess claims.

  Testing on the three examples:
  1. **Aquifer claim**: Rapid depletion, irreversible locally? If recharge is slow, it might be a collapse. But if there are mitigation options, it might not be.
  2. **Hospital closures**: System is reconfiguring, not ending. Service loss but not irreversible collapse. However, it's urgent due to access issues.
  3. **Fishery**: Stock decline isn't collapse since the fleet adapts. It's a managed transition.

  The procedure should clearly state that a "no collapse" verdict doesn't mean no problem—just that it's not a collapse. This addresses the political challenge of rejecting framing while acknowledging real issues. Also, highlighting value judgments (e.g., what defines "rural healthcare") prevents overreach.

  Finally, the limitations: The tool classifies claims, doesn't predict. It can't handle ambiguous boundaries (like defining societal units) or deep value conflicts. That's where human judgment is necessary. This honesty builds trust in the procedure's recommendations.
answer: |-
  Here's a screening procedure designed to be run in **<45 minutes** per claim, using only the submitted document/text. It focuses on *deconstructing the "collapse" framing* rather than validating the underlying problem's severity.

  ---

  ### Collapse Claim Screening Procedure (CCSP)

  **Instructions:** Answer sequentially. Stop and route as indicated. Cite evidence *only* from the claim/document itself. **Output:** A verdict paragraph (see end).

  1.  **What specific *system* is claimed to be collapsing?**
      *   *Sufficient Answer:* A defined functional unit (e.g., "Eastern Basin Aquifer recharge capacity," "Rural Emergency Healthcare Access Network," "Commercial Sardine Trawl Fishery"). Must be more specific than "agriculture" or "healthcare."
      *   *Terminate Early If:* Vague ("society," "the system"), purely subjective ("our way of life"), or describes *impacts* (e.g., "farm profits") without defining the core system. **Verdict:** "Claim lacks defined system. Recast as [Impact] risk to [Sector]."
      *   *Handoff If:* Defining the system inherently requires contested value judgments (e.g., "Is 'rural healthcare' defined by physical hospitals or service availability?").

  2.  **Is the claim about *irreversible termination* of the system's core function, or *reconfiguration* into a different/less complex state?**
      *   *Sufficient Answer:* Look for keywords: "gone forever," "cannot recover," "end of" (suggests termination) vs. "downsizing," "restructuring," "shifting," "adapting" (suggests reconfiguration). Evidence of planned transitions?
      *   *Terminate Early If:* Clear evidence describes adaptation, managed decline, or transition (e.g., "fleet switched to mackerel," "consolidating services at regional hubs"). **Verdict:** "Describes systemic reconfiguration/adaptation, not collapse. Route as [Sector] Transformation planning."
      *   *Handoff If:* Evidence is ambiguous or the line between "termination" and "radical reconfiguration" is debatable *within the claim itself*.

  3.  **Over what *timescale* is collapse claimed?**
      *   *Sufficient Answer:* Specific timeframe cited in the claim (e.g., "within 10 years," "over the past 5 years").
      *   *Terminate Early If:* No timeframe given or timeframe is geological/centuries. **Verdict:** "No actionable timeframe provided. Request revised claim with defined horizon."
      *   *Flag Urgency:* < 5 years = High Urgency; 5-20 years = Medium Urgency; >20 years = Low Urgency (for routing, *not* collapse validation).

  4.  **What is the *primary loss* claimed? (Complexity, Scale, Wellbeing, or All?)**
      *   *Sufficient Answer:* Identify the core asserted loss:
          *   *Complexity:* Reduced hierarchy, specialization, integration (e.g., "loss of coordinated water management," "specialized ER services vanishing").
          *   *Scale:* Reduced size/output/capacity (e.g., "40% less water," "half the hospitals closed").
          *   *Wellbeing:* Decline in human welfare/health (e.g., "thousands will go hungry," "lives lost due to travel time").
      *   *Handoff If:* Claim relies *entirely* on Wellbeing loss without linking to systemic Complexity/Scale failure *of the defined system*. **Verdict:** "Core claim is human suffering, not systemic collapse. Route as [Sector] Wellbeing Crisis (Urgency: [Flag from Q3])."
      *   *Note:* Tainter-esque collapse requires Complexity loss. Pure Scale/Wellbeing loss might be severe decline, not necessarily collapse.

  5.  **Who benefits from using "collapse" here?**
      *   *Sufficient Answer:* Identify likely motive based on framing: Fearmongering (consultant selling services?), Political point-scoring (op-ed), Garnering attention (think tank), Legitimate alarm?
      *   *Terminate Early If:* "Collapse" appears purely rhetorical/emotional with no systemic argument. **Verdict:** "Rhetorical use of 'collapse.' Recategorize as Advocacy/Concern re: [Underlying Issue]."
      *   *Flag:* Doesn't invalidate claim, but provides context for the Director.

  **Output Verdict Structure:**
  > "CCSP Assessment: [System Defined in Q1]. Claim of collapse is **[Supported / Not Supported / Requires Value Judgment]**. Primary Reason: [Key finding from Q2/Q4]. **Urgency Flag:** [High/Medium/Low from Q3]. **Core Issue:** [Summarize underlying problem - e.g., 'Rapid resource depletion,' 'Service reduction']. **Routing Recommendation:** [Emergency Response / Priority Planning Queue / Transformation Planning / Recast as [Type] Issue / Requires Human Judgment on [Specific Handoff Point]]. **Note:** 'Not Supported' indicates the 'collapse' framing is inappropriate; it *does not* mean the underlying issue [Mentioned Core Issue] is unimportant."

  ---

  **What the CCSP CANNOT Do:**
  *   **Predict Collapse:** It analyzes *claims*, not reality. A "Not Supported" verdict doesn't mean the system is healthy.
  *   **Assess Underlying Risk/Severity:** It flags urgency based on *claimed* timeframe, not independent risk assessment.
  *   **Resolve Deep Value Conflicts:** It identifies where human judgment on definitions/values is needed.
  *   **Gather New Data:** Relies solely on the submitted claim/document.
  *   **Determine Optimal Response:** Routing is based on categorization, not solution design.

  ---

  ### Applying CCSP to Your Claims

  **Claim 1: Eastern Basin Aquifer Collapse (Consultant)**
  1.  **System:** Eastern Basin Aquifer recharge capacity / Sustainable agricultural water supply. (Sufficient).
  2.  **Termination vs. Reconfig:** Claim is termination ("collapse") of agriculture due to *irreversible* depletion (assumes no replenishment). (No Early Term).
  3.  **Timescale:** "Within a decade" (<5 yrs - **High Urgency**).
  4.  **Primary Loss:** Scale (water volume) leading to Wellbeing (agricultural loss). Complexity loss implied (farm system failure) but not explicit. (Not pure Wellbeing, continues).
  5.  **Who Benefits?** Consultant likely selling services (alarmist framing possible).
      *   **Verdict:** "CCSP Assessment: Eastern Basin Aquifer sustainable water supply. Claim of collapse is **Supported** (Claimed irreversible termination of core function). **Urgency Flag:** High. **Core Issue:** Rapid aquifer depletion threatening regional agriculture. **Routing Recommendation:** Emergency Response planning. **Note:** Consultant's framing aligns with systemic collapse definition."

  **Claim 2: Rural Healthcare Collapse (Op-Ed)**
  1.  **System:** Rural hospital network / Physical access to inpatient care in County X. (Sufficient, but see Q4).
  2.  **Termination vs. Reconfig:** Describes closures (termination of *specific facilities*) but implies broader systemic failure. No mention of planned reconfiguration (e.g., telemedicine hubs, mobile units). Claim is termination of "rural healthcare." (Ambiguous - Continue).
  3.  **Timescale:** "Four closures in two years" implies rapid, ongoing (**High Urgency**).
  4.  **Primary Loss:** Scale (facilities/beds) leading to Wellbeing (reduced access). **Handoff Trigger:** The *core claim* hinges on defining "rural healthcare" as requiring physical hospitals. If hospitals *are* the core system, it's Scale loss. If the core system is "access to care," reconfiguration might be possible. **REQUIRES HUMAN JUDGMENT** on system definition.
      *   **Verdict:** "CCSP Assessment: County X Rural Hospital Network. Claim of collapse **Requires Value Judgment** (Is 'rural healthcare' defined by physical hospitals or service access?). **Urgency Flag:** High. **Core Issue:** Significant reduction in physical healthcare infrastructure and access. **Routing Recommendation:** Requires Human Judgment (Director/Policy Lead) to define core system before categorization. Route underlying issue to Priority Planning Queue (High Urgency). **Note:** 'Collapse' framing depends on definition; severe problem exists regardless."

  **Claim 3: Sardine Fishery Collapse**
  1.  **System:** Commercial Sardine Trawl Fishery. (Sufficient).
  2.  **Termination vs. Reconfig:** Explicitly states "fleet just switches target species." **Terminate Early:** "Describes systemic reconfiguration/adaptation, not collapse."
      *   **Verdict:** "CCSP Assessment: Commercial Sardine Trawl Fishery. Claim of collapse is **Not Supported** (Describes systemic adaptation/reconfiguration). **Urgency Flag:** (Not assessed - claim invalidated). **Core Issue:** Decline in sardine stock requiring fishery management. **Routing Recommendation:** Route as Fisheries Management / Stock Replenishment (Standard Planning Queue). **Note:** 'Not Supported' means the 'collapse' framing is inaccurate due to adaptation; the stock decline remains an important management issue."

  ---

  **Key Strength:** The CCSP forces clarity on *what is meant by collapse* in each claim, separating rhetorical alarm from specific systemic failure definitions. It explicitly handles ambiguity and value conflicts rather than hiding them. By outputting the "Core Issue" and "Urgency" separately from the collapse verdict, it ensures problems aren't ignored even if the dramatic label is rejected – addressing your political concern directly. It shines by quickly dismissing mis-framed claims (Fishery) and flagging definitional debates (Hospitals) while catching potentially valid collapse scenarios (Aquifer). Its honesty about limitations builds trust.
