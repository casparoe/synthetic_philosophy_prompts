answer: |-
  **Your character's refusal is both genuine knowledge and a potential hiding place; distinguishing requires ruthlessly examining why the lie fails and what alternative endings you're avoiding.**

  The "character won't do it" sensation arises from deep immersion; you've internalized her logic, ethics, and trauma responses built over 200 pages. This *is* knowledge – a subconscious synthesis of her established traits reacting to the fictional circumstance. If her core identity is defined by holding the family together *through truthfulness* (even difficult truths), or if her father's death specifically shattered her tolerance for deception, then lying *would* fracture her psyche in a way previous actions haven't. Your nine failed attempts likely stem from this internal conflict feeling unearned or psychologically implausible *for this specific person*.

  However, this knowledge *can* become a shield. The convenience you notice is the red flag: using the character as an alibi absolves you of the terrifying work of either finding a *different* ending that satisfies the story's needs *without* violating her, or confronting the brutal character evolution the lie would demand. To distinguish:

  1.  **Interrogate the "Why" of the Refusal:** Don't just say "she won't lie." Ask *why* it feels impossible *now*. Is it because:
      *   **The Stakes Aren't High Enough?** Does she genuinely believe revealing the letter *now* would cause more damage than lying? If not, the refusal might be valid. If the stakes *should* be high enough, the flaw might lie in earlier setup.
      *   **Her Motivation Isn't Strong Enough?** Why *must* she conceal it? Protect the sister? Protect herself? Protect the father's image? If the reason feels weak *to her* (not just to the plot), the refusal is likely genuine.
      *   **The Lie Itself Contradicts a Foundational Trait?** If her entire identity is "truth-teller," forcing a lie without shattering her requires immense setup you haven't provided. If her core is "family protector at all costs," the lie might be plausible if the "cost" is adequately explored.

  2.  **Test Against Alternatives:** What endings *would* she allow? Brainstorm ruthlessly *without* the lie. Does she confess immediately? Does she burn the letter? Does she confront the will's executor? Does the sister find it? Does the lie happen, but *differently* (e.g., omission vs. fabrication, or she delegates the lie)? If every alternative feels trivial, cowardly, or unsatisfying *to you as the author*, then the hiding suspicion is valid – you're clinging to the plot point you *want* while blaming her for blocking it.

  3.  **Confront the Thematic Cost:** What does forcing the lie *mean* for the novel's core? If the book explores the corrosive nature of secrets, the lie might be necessary but requires showing her unraveling. If it's about familial resilience through honesty, forcing the lie betrays the theme. Does the lie serve a deeper truth about her breaking point, or is it merely plot mechanics? If the latter, the refusal is likely genuine character protection.

  **Taking the ending back means consciously choosing:**

  *   **Option 1: Embrace the Refusal & Rewire the Plot:** Accept her "no." Scrap the lie-driven ending. Follow the logical consequences of her *choosing truth* (or another action true to herself). This requires immense courage – rethinking the climax and falling action based on *her* choice, not your initial blueprint. It demands asking: "What *actually* happens now?" This is authentic character-following.
  *   **Option 2: Earn the Lie Through Evolution:** If the lie is *essential* to the story you *must* tell, you haven't earned it yet. This isn't "forcing," it's retroactive character work. You must:
      *   Identify the *exact* internal shift needed for her to lie (e.g., reaching a breaking point where protection justifies corruption, discovering a hidden selfishness, a moment of pure panic overriding principle).
      *   Plant seeds *earlier*. Show moments where her "holding together" strains her ethics, where she *almost* lies, where her protectiveness borders on control. Foreshadow her capacity for this specific deception under extreme duress. Make her journey *lead* to this fracture.
      *   Write the lie scene *as a trauma*, not a tactic. Show it costing her dearly the moment she does it, making her feel like a stranger to herself – which aligns with your feeling of her becoming "a different person." *That* internal conflict *is* the drama.

  **Taking back agency means saying:** "I choose Option 1 because her integrity is the novel's spine," or "I choose Option 2 because the lie's thematic devastation *is* the point, and I will rebuild her path to make it credible." Either choice requires embracing the responsibility: *you* are deciding the story's demands and the character's limits, not passively blaming her. The principled way forward lies in brutal honesty about *why* the lie fails and what you are truly unwilling to sacrifice – plot convenience or character essence.
