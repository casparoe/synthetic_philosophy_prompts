  I notice their mechanistic view in #6 undermines potential evolutionary justifications for sunk-cost sensitivity, which might otherwise have bridged some gaps. This leaves few escape routes. When ranking tensions, the identity/orthodoxy clash feels most severe because it posits a reason that exists only for the original agent, violating decision theory's agent-neutrality.

