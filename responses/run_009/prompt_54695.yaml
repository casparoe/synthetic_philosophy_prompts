prompt: |-
  Is there a name for this? I'm a student taking philosophy of science and a machine learning course at the same time, and I keep noticing what feels like the same underlying issue in both, but nobody in either class uses the other field's vocabulary for it. In phil of sci we talked about how general relativity gets credit for explaining the wobble in Mercury's orbit, even though astronomers had measured that anomaly decades before Einstein was even born -- the evidence wasn't new, only the explanation was. In my ML class we just covered overfitting: a model that scores well on data it was trained on is telling you basically nothing, and you only trust performance on held-out data the model never saw. When I brought up the analogy in section, my TA pushed back and said they're not the same, because Einstein didn't fit GR to the Mercury data the way a network with millions of free parameters gets fitted to a training set -- GR also predicted light bending, which was only checked later. But then someone else pointed out that plenty of other physicists at the time did try to explain the Mercury anomaly with ad hoc tweaks (extra hidden planets and so on) that never went anywhere, so it's not like no one was "training on" that data point. So here's what I want to know: does the thing I'm pointing at -- the intuition that evidence only counts in a theory's favor if the theory didn't already have access to it -- have an established name in either field? I've heard people say "novel prediction" but it sounds more like a slogan than a precise concept, and I have no idea whether philosophers of science and ML people have ever seriously noticed they're circling the same worry. If there's no single concept that covers both cases, then give me the best carving you can: what exactly is the common core, where do the two cases genuinely come apart (like, what is even supposed to count as a theorist having "seen" the data -- reading a journal article? growing up in a culture that knows the fact?), and coin a term for the unified thing with boundary cases. I won't be satisfied with just a label, I want to know what the phenomenon is and isn't. Lead with your bottom line in the very first sentence and then give the reasoning -- no preamble and dont restate my question back at me.
reasoning: |-
  Okay, the user is a student taking both philosophy of science and machine learning courses. They noticed a parallel between how theories in science are evaluated and how ML models avoid overfitting. Specifically, they see that in both cases, evidence seems to count more if it wasn't used in constructing the theory/model. In the Mercury orbit example, Einstein's GR explained pre-existing data but also predicted new phenomena like light bending, which gave it more credibility. In ML, models are tested on unseen data to ensure they haven't just memorized the training set. The user wants to know if there's a unified concept that captures this intuition across both fields.

  First, I need to recall relevant terms from both domains. In philosophy of science, "novel prediction" is key—when a theory predicts something unknown beforehand, which strengthens the theory if confirmed. On the ML side, "out-of-sample testing" or "generalization" refers to evaluating models on new data. The user mentioned their TA argued that GR wasn't "fitted" to Mercury's data, unlike ML models with many parameters. But ad hoc explanations by other physicists were like overfitting. So the core idea is about independence between theory construction and evidence.

  The common core is that evidence supports a model more strongly when the model wasn't adjusted to fit that specific evidence. For ML, it's straightforward: the model shouldn't see the test data during training. In science, it's trickier. Did Einstein know about Mercury's anomaly? If he did, designing GR to explain it might reduce the weight of that evidence. But GR's prediction of light bending was novel and thus stronger evidence. Philosophers like Lakatos and Popper have discussed this—novel predictions as a mark of progressive research programs.

  Terms like "use novelty" (evidence not used in constructing the theory) versus "temporal novelty" (evidence discovered after the theory) come to mind. The user wants to know if there's a specific term that bridges both fields. "Differential support" might work as a coined phrase, emphasizing that evidence's weight depends on its independence from the model-building process. Boundary cases include how much prior knowledge a scientist had access to, which isn't binary but a spectrum. In ML, data access is clear-cut, but in science, it's about the theorist's intent and the theory's flexibility.

  The user’s deeper need might be understanding the epistemological principle underlying both fields: how we validate knowledge claims. They might also want to articulate this connection in academic work or discussions. By clarifying the commonality and differences, they can better navigate interdisciplinary critiques. Ensuring the answer addresses both the conceptual overlap and distinctions, using precise terminology while acknowledging the nuances in each field, will satisfy their request for a thorough analysis without just giving a label.
answer: |-
  The unified concept is **differential support via evidence independence**, meaning evidence strengthens a model/theory most when that evidence was *not* incorporated during its construction/adjustment. The core principle is that **supportive weight increases with the degree of independence between the evidence and the model-building process.**

  Here's the reasoning and carving:

  1.  **The Common Core: Epistemic Security Through Constraint**
      *   Both cases address the problem of *confirmational holism* or *underdetermination*: many models/theories can be crafted to fit existing data.
      *   The key intuition: Evidence provides *stronger* confirmation if the model/theory was *constrained* in such a way that it couldn't be easily *adjusted* specifically to fit *that* evidence. This increases confidence that the model/theory captures a genuine pattern rather than being tailored to noise or coincidence.
      *   **ML:** Training data is used to *adjust* model parameters (fit). Held-out test data provides an independent check. Performance on test data is trusted more because the model was *constrained* from seeing it during adjustment. Weight of evidence (performance) is proportional to its independence from the training set.
      *   **PhilSci:** Existing data can be used *heuristically* to develop a theory. However, evidence is strongest when it's a *novel prediction* – data the theory *wasn't adjusted to fit* because it was unknown or deliberately ignored during construction. The Mercury anomaly was known; GR wasn't *fitted* to it in the ML sense, but it *could* have been a target. Light bending was novel and thus provided stronger differential support.

  2.  **Where They Genuinely Come Apart: The Nature of "Access" and "Adjustment"**
      *   **ML:** "Access" and "Adjustment" are clearly defined and technical.
          *   *Access:* Data used in the *training loop* (forward/backward pass, parameter updates).
          *   *Adjustment:* Explicit algorithmic optimization (e.g., gradient descent) changing model parameters to minimize loss *on that data*.
          *   "Independence" is operationalized via data partitioning (train/test splits, k-fold CV).
      *   **PhilSci:** "Access" and "Adjustment" are epistemic and historical, not technical.
          *   *Access:* Did the theorist *know* about the evidence? Was it part of the scientific context motivating the theory? (Einstein definitely knew about Mercury).
          *   *Adjustment:* Did the theorist deliberately *modify* their theory *specifically* to fit *that* evidence? Or was the evidence a *consequence* of a theory developed for broader reasons?
          *   "Independence" is a matter of *degree* based on historical contingency and theorist intent. It's fuzzy.
          *   **Crucial Distinction:** A scientific theory isn't "fitted" like an ML model. It's constructed from principles. Evidence can *motivate* the search for a theory (like Mercury did) or *constrain* its development, but the *form* of the theory (like Einstein's field equations) isn't *numerically optimized* to fit data points. Ad hoc hypotheses (like Vulcan) *are* closer to ML overfitting – adding specific, unjustified complexity to fit one point.

  3.  **Boundary Cases & Nuances of "Differential Support"**
      *   **The Spectrum of Novelty (PhilSci):** Philosophers distinguish:
          *   *Temporal Novelty:* Evidence discovered *after* the theory's prediction (e.g., light bending). Highest differential support.
          *   *Use Novelty:* Evidence known but *not used* in constructing the theory. (Einstein *used* Mercury heuristically; it constrained his search. Its support is less than light bending's but more than an ad hoc fit).
          *   *Ad Hoc Adjustments:* Evidence directly targeted by modifying the theory *only* to fit it (e.g., Vulcan). Little to no differential support.
      *   **The "Seen/Unseen" Spectrum (ML):** While binary in practice (in/out of training set), real-world issues exist:
          *   *Data Leakage:* Accidental access during training (e.g., via feature engineering, improper splitting).
          *   *Similar Data:* Performance on data *very similar* to the training set may not guarantee generalization to truly novel distributions.
      *   **Theorist "Access":** Requires historical analysis. Did they read the journal? Was it common knowledge? Was it *the* problem they explicitly set out to solve? Intent and context matter. There's no bright line.

  4.  **Established Names & Why "Novel Prediction" Isn't Enough**
      *   **PhilSci:** "**Novel Prediction**" is the primary term, but its meaning (temporal vs. use novelty) is debated (Lakatos, Popper, Zahar, Worrall, Mayo). "**Severe Testing**" (Deborah Mayo) captures the idea of testing with data the theory wasn't built to pass. "**Independent Evidence**" or "**Non-ad hoeness**" are related concepts.
      *   **ML:** "**Generalization**" (ability to perform on unseen data). "**Out-of-sample testing/evaluation**." "**Avoiding overfitting**" describes the negative case. "**Held-out data**" specifies the independent evidence.
      *   **Why "Novel Prediction" Falls Short:** It's PhilSci-centric and emphasizes *prediction timing*. ML's core concern is *data access during training*, regardless of when the data existed. "Generalization" is ML-centric and lacks the epistemic weight emphasis. Neither fully captures the *shared principle of evidence independence for confirmational strength* across both domains.

  **Bottom Line:** The phenomenon is best understood as **Differential Support via Evidence Independence**. While "novel prediction" (philosophy) and "generalization testing" (ML) address aspects of it, they stem from the same core epistemological principle: evidence constrained to be *independent* of the model/theory construction process provides *stronger*, more secure confirmation than evidence that *could* have influenced that process. The divergence lies in how "independence" and "construction process" are defined (algorithmic fitting vs. theoretical development).
