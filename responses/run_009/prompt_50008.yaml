  So my partner of eleven years left back in March, and my therapist has been pushing me to get reconnected with "who I actually am" now that I'm on my own. Meanwhile I made the mistake of listening to a podcast episode about Dennett where they talked about the self being a "center of narrative gravity" — just a story the brain spins to organize everything, not a real thing you could find if you opened up the skull. And honestly this has kinda broken me? If the self is literally a made-up fiction, then when my therapist asks me who I really am, there's no true answer to find — I'm just deciding which fanfic of myself to commit to. It seems like on Dennett's view authenticity is straight-up impossible, because you can't be true to something that was invented. Is that right? And if so, what am I even supposed to do in therapy — just pick the most convenient story and run with it? Or am I misreading the whole idea somehow, because something about it feels too easy, like it lets me off the hook entirely.
