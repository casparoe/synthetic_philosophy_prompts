  ### Summary  
  Your carving is sound, but C2–C3 are the theory’s fragile core. Your friend’s computer science lens likely conflates implementation with phenomenology (C2), while your skepticism centers on the hard problem (C3). A substrate-independent self-model (C4) is plausible, but without progress on phenomenology (C3), the loop’s explanatory power remains speculative.
