answer: |-
  ### Statistical Safety Check Procedure for Group Comparisons  
  **Purpose**: Detect Simpson's paradox, confounding, and spurious effects in rate/proportion/average comparisons. Time limit: 45–60 min.  
  **Tools**: Spreadsheet (e.g., Excel, Google Sheets).  
  **Key concepts**:  
  - **Aggregate effect**: Comparison between Group A and Group B in the full dataset.  
  - **Stratification**: Splitting data by a third variable (e.g., borough, income).  
  - **Reversal**: Aggregate effect flips direction (e.g., overall improvement, but harm in all subgroups).  
  - **Attenuation**: Aggregate effect weakens substantially in subgroups.  
  - **Post-treatment variable**: A variable *affected by* the intervention (e.g., behavior changes caused by a policy). Conditioning on it often biases results.  
  - **Pre-treatment confounder**: A variable *affecting both* group assignment and outcome (e.g., pre-existing income). Conditioning here is usually necessary.  

  ---

  ### Procedure  
  **Step 1: Define the Comparison** (Mechanical, 5 min)  
  - Identify:  
    - Group A vs. Group B (e.g., pre-intervention vs. post-intervention).  
    - Outcome metric (e.g., average commute time, offense rate).  
    - Key third variables (e.g., borough, income, age). Prioritize 1–3 variables known to influence the outcome.  
  - *Pass*: Clear definition of groups, outcome, and at least one third variable.  

  **Step 2: Stratify by Third Variables** (Mechanical, 15 min)  
  - For each third variable:  
    - Split data into subgroups (e.g., by borough).  
    - In each subgroup, compute the effect (e.g., difference in averages).  
    - Track: Direction and magnitude of effect in each subgroup vs. aggregate.  
  - *Pass*: No reversal or severe attenuation (subgroup effects align with aggregate).  
  - *Fail*: Reversal (subgroup effects oppose aggregate) or severe attenuation (subgroup effects <50% of aggregate).  
  - *Escalate if*: Reversal detected → Proceed to Step 3.  

  **Step 3: Post-Treatment Check** (Judgment call, 10 min)  
  - For each third variable used in Step 2:  
    - Ask: *Could the intervention itself change this variable?*  
      - **Yes** (Post-treatment): Conditioning is invalid. Aggregate may stand, but note potential confounding.  
      - **No** (Pre-treatment confounder): Reversal suggests aggregate is misleading.  
  - *Pass*: Variable is pre-treatment and no reversal found in Step 2.  
  - *Fail*: Variable is pre-treatment AND reversal exists → Aggregate is unreliable.  
  - *Escalate if*: Post-treatment reversal → Reframe story to avoid causal claims.  

  **Step 4: Sample Size Check** (Mechanical, 5 min)  
  - For each subgroup in Step 2:  
    - Confirm ≥20 observations per subgroup.  
    - If <20, subgroup estimates are unreliable.  
  - *Pass*: All subgroups meet size threshold.  
  - *Fail*: Any subgroup too small → Disaggregation is invalid; revert to aggregate (with caveats).  

  **Step 5: Final Decision** (Judgment call, 10 min)  
  | Condition | Action |
  |-----------|--------|
  | **Reversal + pre-treatment confounder** | Do NOT report aggregate. Explain reversal in story. Escalate to editor. |
  | **Reversal + post-treatment variable** | Report aggregate but note post-treatment confounding. Avoid subgroup claims. |
  | **Attenuation only** | Report aggregate but note weaker subgroup effects. |
  | **Small strata** | Report aggregate but note uncertainty in subgroups. |
  | **No issues** | Proceed with aggregate. |

  **Escalate to editor/statistician if**:  
  - Reversal exists (Step 2) and third variable is pre-treatment (Step 3).  
  - Uncertainty about post-treatment status (Step 3).  
  - Policy framing depends on contested interpretation.  

  **What the procedure CANNOT settle**:  
  - Whether a variable is post-treatment vs. pre-treatment in ambiguous cases.  
  - Whether attenuation is "severe enough" to invalidate a story (judgment call).  
  - Causal claims when confounding is unmeasurable.  
  - Disputes about policy relevance (e.g., "Should we care about aggregate if subgroups disagree?").  

  ---

  ### Case Studies  
  **Case 1: Transit Agency Bus-Priority Corridor**  
  - **Claim**: New corridor cut average commute times by 6% (aggregate effect).  
  - **Reporter finding**: When split by borough, commute times rose slightly in both boroughs.  
  - **Procedure application**:  
    1. **Step 1**: Groups = Pre-corridor vs. post-corridor. Outcome = Average commute time. Third variable = Borough.  
    2. **Step 2**: Reversal detected (aggregate improvement, but both boroughs worsened). → *Fail*.  
    3. **Step 3**: Is borough post-treatment? **Yes**—riders shifted boroughs *because of the corridor* (intervention changed the variable). Post-treatment reversal → Aggregate may stand, but rider shift explains the effect.  
    4. **Step 4**: Assume boroughs have sufficient sample size.  
    5. **Step 5**: **Report aggregate with caveat**: "The overall improvement stems from riders shifting to slower boroughs, where commute times actually rose. The corridor did not improve speeds within boroughs."  
  - **Verdict**: Reversal exists, but post-treatment status protects the aggregate (with context).  

  **Case 2: County Lead-Abatement Program**  
  - **Claim**: Program reduced juvenile offenses in aggregate.  
  - **Critic finding**: Disaggregating by neighborhood income shows effect gone/reversed in all strata.  
  - **Procedure application**:  
    1. **Step 1**: Groups = Abated homes vs. non-abated. Outcome = Offense rate. Third variable = Income.  
    2. **Step 2**: Reversal detected (improvement in aggregate, but none/negative in income strata). → *Fail*.  
    3. **Step 3**: Is income post-treatment? **No**—program *selected homes based on income* (pre-treatment confounder). Reversal invalidates aggregate.  
    4. **Step 4**: Assume income strata have sufficient sample size.  
    5. **Step 5**: **Do NOT report aggregate**. Escalate to editor: "The apparent aggregate benefit is likely caused by income-based targeting. The program shows no evidence of reducing offenses within income groups."  
  - **Verdict**: Reversal + pre-treatment confounder → Kill the aggregate claim.  

  ---

  **Verdict**: CASE1=AGGREGATE_WITH_CAVEAT; CASE2=DO_NOT_REPORT_AGGREGATE  

  **Key labels**:  
  - `CLEAR`: No issues found.  
  - `AGGREGATE_WITH_CAVEAT`: Report aggregate but note limitations (e.g., post-treatment reversal).  
  - `DO_NOT_REPORT_AGGREGATE`: Reversal with pre-treatment confounder; use subgroup analysis or kill claim.  
  - `ESCALATE_STATISTICIAN`: Ambiguous causality or small strata.  
  - `ESCALATE_EDITOR`: Policy framing dispute.
