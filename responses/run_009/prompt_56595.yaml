  ### The "Which Anthropic Reasoner Are You Actually?" Quiz

  Welcome to the quiz! Below are 8 concrete scenarios. For each, pick the answer that feels most intuitive *before* you know the jargon. No Googling, no overthinking—just go with your gut. We’ll score your answers at the end.

  ---

  **Question 1: The Doomsday Guess**  
  You learn your birth rank is 60 billion (i.e., 60 billion humans existed before you). What does this imply about the total number of humans who will *ever* exist?  
  A. It suggests the total is unlikely to be much larger than 120 billion—otherwise, being in the first 60B would be weirdly early.  
  B. It suggests the total is probably huge—if it were only ~120B, I’d be in the first half, which isn’t special.  
  C. It tells me nothing—I already knew roughly when I was born.  
  D. Depends on context—if I’m worried about AI doom, I might adjust differently.  

  **Question 2: Sleeping Beauty’s Nightmare**  
  Sleeping Beauty takes a sleeping pill Sunday night. A fair coin is flipped. If heads, she’s woken once (Monday). If tails, she’s woken twice (Monday and Tuesday). Each wake-up feels identical; she forgets everything afterward. On Monday, when awake, what should her credence for heads be?  
  A. 1/3—there are three possible wake-ups, only one with heads.  
  B. 1/2—the coin is fair, and the wake-ups change nothing.  
  C. 1/2 initially, but seeing I’m awake now shifts it to 1/3.  
  D. It depends on whether she cares about coin flips or wake-up experiences.  

  **Question 3: Multiverse Bubbles**  
  In a multiverse, universe-bubbles form constantly. Each has random physics; only 1 in a billion supports life. You exist in such a life-friendly bubble. How does this affect your guess about the total number of bubbles?  
  A. It suggests there are *many* bubbles—otherwise, it’d be too unlikely for *any* life to exist.  
  B. It suggests nothing—I already knew I was in a life-friendly bubble.  
  C. It suggests the number is such that life-friendly bubbles are typical—maybe rare but in a big multiverse.  
  D. Depends on why I care—if I’m testing multiverse theory, I’d update one way.  

  **Question 4: The Lonely Seminar**  
  You’re randomly assigned to 1 of *n* parallel seminar sections. Sections vary in size. You walk in and count 4 other students (5 total, including you). What does this imply about the sections?  
  A. Sections are probably small—if they were large, I’d be less likely to land in a tiny one.  
  B. Sections are probably large—big sections have more seats, so I’m more likely to be in one.  
  C. It tells me nothing—I just got randomly assigned.  
  D. Depends on the context—if seminars are on quantum mechanics, I’d assume more sections.  

  **Question 5: Galactic Census**  
  Two theories:  
  - **Theory A**: Only the Milky Way hosts life (1 galaxy).  
  - **Theory B**: 1 million galaxies host life.  
  Prior: 50/50 odds. You observe you’re in the Milky Way. What should you conclude?  
  A. Favors A—if B were true, it’d be unlikely I’m in *this* galaxy.  
  B. Favors B—more galaxies mean more observers, making my existence likelier.  
  C. No change—I already knew I was in the Milky Way.  
  D. Depends—if I’m an astrobiologist, I’d lean one way.  

  **Question 6: The Dice Room**  
  A die is rolled:  
  - If 1: Only *Room A* is created with 1 person.  
  - If 2–6: *Room A* and *Room B* are created, each with 1 person.  
  You wake up in Room A. What’s the probability the die rolled 1?  
  A. 1/6—the die roll hasn’t changed.  
  B. 1/2—it’s equally likely to be 1 vs. 2–6.  
  C. ~1/7—there are 7 possible "slots" (1 in "die=1", 2 per roll for "die=2–6"), and I’m in one.  
  D. Depends—is this a cosmology metaphor or a game?  

  **Question 7: The Incubator**  
  A coin flip:  
  - **Heads**: 1 room is created with 1 observer.  
  - **Tails**: 2 rooms are created, each with 1 observer.  
  You wake up in a room. What’s P(Heads)?  
  A. 1/3—there are 3 possible observers, only 1 in Heads.  
  B. 1/2—the coin is fair.  
  C. 1/2, but seeing I exist shifts it—wait, no, it’s 1/2.  
  D. Depends—am I the subject or the experimenter?  

  **Question 8: Simulation Suspicion**  
  You learn that if advanced civilizations exist, they run ancestor simulations. You also learn that either:  
  - **Option X**: 1 real civilization exists (no simulations).  
  - **Option Y**: 1 real civilization + 10,000 simulated civilizations.  
  Prior: 50/50. What do you conclude?  
  A. Favors X—if Y were true, I’d likely be in a simulation.  
  B. Favors Y—more civilizations mean more observers, so I exist.  
  C. No change—I already knew I was conscious.  
  D. Depends—if I’m a programmer, I’d think one way.  

  ---

  ### Scoring Key  
  Match your answers to the categories below. (Answers: 1A, 2A, 3A, 4B, 5A, 6C, 7A, 8A = SSA; 1B, 2C, 3A, 4B, 5B, 6A, 7A, 8B = SIA; etc.)

  | Answer Pattern                              | Anthropic Reasoner Type                     | Key Features                                                                 |
  |---------------------------------------------|---------------------------------------------|------------------------------------------------------------------------------|
  | Mostly **A**s                               | **Self-Sampling Assumption (SSA)**          | You reason as a random observer from a fixed reference class (e.g., "all humans"). Birth rank matters; doomsday is plausible. |
  | Mostly **B**s                               | **Self-Indication Assumption (SIA)**        | Your existence is evidence for more observers. Big universe? More likely! Fine-tuning supports multiverse. |
  | Mostly **C**s                               | **Indexical Ignorance (II)**                | Indexical facts ("I exist," "I’m in Room A") don’t update beliefs. Just use baseline probabilities. |
  | Mostly **D**s or mix without clear pattern | **Pragmatic (P)**                           | No "true" reference class—use what’s useful for the problem. Context is king. |

  ### Notes  
  - **SSA vs. SIA**: Separated by Doomsday (1A vs. 1B), Galactic Census (5A vs. 5B), and Simulation (8A vs. 8B). SIA treats existence as evidence for more observers; SSA sees "being early" as unlikely.  
  - **II vs. Others**: Clear in Sleeping Beauty (2B), Dice Room (6A), and Incubator (7B). II rejects anthropic updates entirely.  
  - **Pragmatic (P)**: Wins if you context-switch (e.g., 1D, 2D, 3D). Not a cop-out—some philosophers endorse this!  
  - **Unexplored/Incoherent**: Mixing 1A with 5B implies observer-count matters only sometimes (unattractive). 5C + 7A is incoherent (ignores indexicals in one case, embraces in another).  
  - **Lonely Seminar (Q4)**: Discriminates! SSA (4A) avoids "size bias," SIA (4B) embraces it, II (4C) ignores it.  

  **Takeaway**: No position dominates—each solves some puzzles but creates others. Reference classes are messy, and that’s why we argue about them! Share your result on the blog 😉.
