          a) evidence for the multiverse over a single universe. (SIA and II would both say yes, as per the calculation)
          b) not evidence for the multiverse, because we would exist in either case. (none)
          c) evidence against the multiverse because if there are many universes, we should be in a simulation or something. (none)

     Given the calculation, only (a) is correct. So this might not discriminate.

