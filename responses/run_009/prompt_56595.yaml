  2. **Self-Indication Assumption (SIA)**: You reason as if your own existence is evidence that the world contains many observers. In other words, you adjust probabilities in favor of hypotheses that imply more observers.

  3. **Indexical Ignorance (II)**: You think that indexical evidence (like "I am an observer of type X") doesn't provide any information about the world. You reason as if you are a randomly chosen observer from the entire set of observers, but without updating on the fact that you exist.

