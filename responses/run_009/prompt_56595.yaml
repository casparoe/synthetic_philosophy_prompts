       a) 1/3 (SSA and SIA)
       b) 1/2 (II)
       c) 1/4 ( none)
       d) It depends on whether you care about the coin or the rooms. (P)

     Question 5: Dice Room
     - A die is rolled. If it lands 1, one person is created in room A. If it lands 2-6, two people are created: one in room A and one in room B. You are created in room A. What is the probability that the die landed 1?
       a) 1/6 ( prior) -> no update (II)
       b) 1/2 ( none)
