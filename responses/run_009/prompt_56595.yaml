     The probability that you are in room A and the die=2-6: 5/6 ( for the die) * 1 ( because if die=2-6 and you are Alice2, you are in room A).

     So P(die=1 | you in room A) = (1/6) / (1/6 + 5/6) = 1/6 / 1 = 1/6.

     So no update.

     But if we consider that in the die=2-6 case, there is also Bob in room B, and you are not him, then we condition on being in room A.

     In die=1: probability you are in room A: 1.
     In die=2-6: probability you are in room A: 1/2 ( because there are two people, one in room A and one in room B).

