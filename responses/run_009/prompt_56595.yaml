     Outcomes: 
     - Die=1 (prob 1/6): one person, say Alice1, in room A.
     - Die=2-6 (prob 5/6): two persons, Alice2 in room A and Bob in room B.

     You are in room A. Who might you be?
     In die=1: you are Alice1.
     In die=2-6: you are Alice2.

