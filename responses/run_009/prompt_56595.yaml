     - SIA: might update in the opposite direction? because if there are more people, it's more likely that you exist. In this case, SIA would be applied globally: if the die shows 2-10, there are more people in the world, so you are more likely to exist. But that's not the same as being in the room.

     To incorporate SIA, we need to consider your existence.

     Suppose that the room is the only thing in the world. Then under die=1, there is one observer. Under die=2-10, there are 10 observers. Then under SIA, you are more likely to exist in the die=2-10 world. Prior: P(world1)=0.5, P(world2)=0.5. Then the probability that you exist is 1 in world1, and 10 times higher in world2 (if we assume that your identity is not fixed). But then P(world2 | you exist) = [10 * 0.5] / [10*0.5 + 1*0.5] = 10/11.

     Then within the world, you are in the room. In world1, if you exist, you are in the room. In world2, if you exist, you are in the room. So the evidence that you are in the room doesn't add anything. So overall, after learning you exist, you have 10/11 for world2.

     But in the original die room, you are conditionally on being in the room. The SIA update already happened by your existence. Then within the room, the update to 10/11 for die=1 in the first calculation is from the selection effect of being a random person in the room.

     So combining both:

     Step 1: you exist -> update in favor of world2 (10 observers) to 10/11.
     Step 2: you are in the room -> in world2, you are one of the 10 in the room, so no further update about the die? But wait, in world2, the room has 10 people. In world1, it has 1. So if you are in the room, then the probability that you would be in the room given the world is 1 in both. So no further update.

     So overall, you think world2 is 10/11.

     But the first calculation (without SIA) gave for world1 (die=1) 10/11. Now we have for world2 (die=2-10) 10/11.

     This is confusing.

     Given the time, let's not use the lonely seminar. Instead, let's use the die room example as one question.

     We can have two questions: one for SIA and one for SSA.

     Question 4: The Dice Room (without existence, just within the room)
     - You are in a room that was created by rolling a die. If the die came up 1, there is one person in the room. If it came up 2-10, there are 10 people in the room. You are one of the people in the room. What is the probability that the die showed 1?
          a) 1/2 (II)
          b) about 1/11 (SSA: because you are a random person in the room)
          c) about 10/11 (SIA: because more observers in the 2-10 case)
          d) it depends on whether I identify as a person in the room or as the subject of the experiment. (P)

     But note: the probability that the die showed 1 given you are in the room and you are a random person is 10/11 (as calculated). So if you are a random person in the room, you should answer about 1/11? Let me check the calculation:

     Let D1: die=1 -> 1 person.
     D2: die=2-10 -> 10 persons.

     P(D1) = P(D2) = 1/2.

     P(you are in the room | D1) = 1.
     P(you are in the room | D2) = 1 (because if D2, there are 10 people, and you are one of them).

     But wait, this is not the same as the first calculation. In the first calculation, we had:

     If you are a random person from the set of all people in the room across possible worlds, then:

     P(assigned to room | D1) = 1, and there's only one person.
     P(assigned to room | D2) = 1, but there are 10 people. But the probability that you are the particular person you are might be different.

     The correct way: condition on your identity. In D1, there is only one person, so if you are that person, then your chance of being in the room is 1. In D2, there are 10 people, and you are one of them, so the chance that you are in the room is 1.

     So it seems you don't update: P(D1 | you in room) = P(you in room | D1) * P(D1) / [ ... ] = 1 * 1/2 / (1*1/2 + 1*1/2) = 1/2.

     But this is the II view.

     The SSA view is that you should reason as if you are a random person from the set of all people who could have been in the room. In D1, there is only one person. In D2, there are 10 people. So the probability that you would be in the room given D1 is 1 (and you are that one person). Given D2, the probability that you would be in the room is 1 (because you are one of the 10). So again, no update.

     This is the same as II.

     But then why did we earlier calculate 10/11 for die=1? That calculation assumed that in D2, the probability that you are in the room is 1/10? Only if you are a random person from the entire set of possible people.

     Let's clarify with names.

     Suppose in D1, the person in the room is Alice.
     In D2, the ten people are Alice, Bob, ... up to the 10th.

     If you are Alice, then in both scenarios you are in the room. So no update.

     If you don't know who you are, but only that you are some person, then in D1 there is only Alice, so you are Alice. In D2, you could be any of the 10. Then the probability that you are in the room given D2 is 1, because all 10 are in the room.

     So again, no update.

     However, if the experiment is: the die is rolled, and then if it's 1, Alice is placed in the room. If it's 2-10, then 10 specific people (Alice and 9 others) are placed in the room. Then, if you are Alice, you would find yourself in the room in both cases. So no update.

     But if you are not predetermined to be Alice, but rather, in D2, the 10 people are chosen from a large population, then it's different.

     This is very messy.

