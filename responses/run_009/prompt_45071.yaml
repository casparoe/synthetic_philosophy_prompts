prompt: |-
  At the rationalist meetup I've attended for the better part of a decade, two of our sharpest members — Elena, consistently among our best-calibrated forecasters in prediction tournaments, and Rob, who spent years doing due diligence at a venture fund — spent an entire evening arguing about Naomi's plan to leave her quant job and spend four years founding an independent research nonprofit. Naomi herself had left by then; the argument was about whether her judgment was any good. It went like this:

  1. Elena opened with the outside view: Naomi puts her probability of the org achieving meaningful impact at around seventy percent, but the base rate for ambitious solo-founded research nonprofits in that timeframe is a small fraction of that, and the fact that Naomi knows her own plan in loving detail is exactly the kind of information that did not save the members of the reference class. Her credence should collapse toward the base rate.

  2. Rob answered that the reference class is doing all the work and was chosen to get that answer: orgs founded by people with Naomi's specific track record of shipping hard technical projects form a different, more favorable class, and there is no principled way to pick between the classes. The discriminating evidence — her unusually strong pilot results, her team already committed — lives in the inside view, which is the only place evidence about this particular project could live.

  3. Elena conceded class selection is hard, but said it cuts against him: the inside view has the same problem in worse form, since you can rationalize anything with particulars, and at least base rates are counted rather than felt. She invoked the planning-fallacy findings that the people closest to a project are the worst at predicting it, so Naomi's confidence is precisely what the founder of a doomed org would report.

  4. Rob conceded overconfidence is real but said the cure is knowing about the bias, not discarding the evidence. And he raised what he called an asymmetry: the outside view, as actually practiced, only ever pushes probabilities down. Applied consistently, it forbids assigning any project a probability above its class base rate, so no exceptional project could ever be rationally undertaken — yet exceptional projects demonstrably exist and someone demonstrably undertakes them.

  5. Elena then stepped back from the project to the disagreement itself: she assigns fifteen percent, Naomi seventy; per the reasoning behind agreement theorems, a peer's differing credence is itself evidence, and the policy that wins in expectation is to weight the peer's estimate rather than trust one's own chain of reasoning, because you would have run that same confident chain in worlds where you were wrong.

  6. Rob replied with a regress: if Elena must weight Naomi's credence equally, Naomi must weight Elena's, and the rule yields no fixed point. Universal modesty means no one ever acts on a new argument, since every correct update in history first looked like one person's idiosyncratic reasoning; the people who actually moved the field did not average their credences with the crowd's.

  7. Elena's last word was survivorship bias: he is counting the immodest winners and forgetting the far more numerous immodest losers, and from the inside every crank is sure he is the exception.

  They asked me to referee and I found I genuinely couldn't. Please go through the seven moves in order, rating each from clearly mistaken to clearly right with brief justification; identify which claims are load-bearing and which are fair concessions; say whether either of them lands a decisive point or whether each has a hidden false assumption; note what both are missing; and, if you're willing, say who is more right overall.
reasoning: |-
  Hmm, the user presents an intricate philosophical debate between Elena and Rob about epistemic reasoning and decision-making. This involves assessing seven sequential arguments about how to evaluate Naomi's nonprofit venture. 

  The core tension seems to be between base rate deference (Elena) and case-specific evidence (Rob), with layers of meta-arguments about disagreement handling. I need to evaluate each move individually while watching for dependencies - for instance, Rob's class selection critique (move 2) directly challenges Elena's opening salvo (move 1), making his point load-bearing for his entire position.

  Notably, both make valid concessions: Elena admits class selection difficulty (move 3), Rob acknowledges overconfidence risk (move 4). But their compromises become weapons - Elena uses class ambiguity to attack inside views, while Rob leverages it to defend evidence inclusion. 

  The asymmetry argument (move 4) feels particularly incisive: if outside views only suppress probabilities, they'd veto all exceptional ventures by definition. Yet Elena's survivorship bias counter (move 7) rightly notes we only remember the exceptions that succeeded. This mutual destruction suggests both frameworks are incomplete without synthesis.

  On peer disagreement (moves 5-6), they're talking past each other. Peer weighting works for symmetric knowledge, but Rob correctly notes founders often have asymmetric information. The regress argument oversimplifies though - rational agents can weight credences without full symmetry. 

  What's missing? Concrete Bayesian updating. The base rate is the prior, inside evidence updates the likelihood - but they debate whether the evidence is admissible. Also missing: Naomi's unique evidence quality. Pilot results might be strong Bayesian signals if quantified.

  Overall, Rob's emphasis on evidence integration seems more productive, but only if paired with Elena's bias checks. The real error is framing this as either/or rather than both/and.
answer: |-
  Here's a systematic analysis of each move, evaluating their strengths, weaknesses, and hidden assumptions, followed by an overall assessment:

  ### **Move-by-Move Analysis**
  1. **Elena (Outside View/Base Rates)**  
     - **Rating:** *Mostly Right*  
     - **Justification:** Correctly applies the outside view (e.g., Tetlock’s research on base rates) and highlights the planning fallacy. Load-bearing claim: "Detailed knowledge doesn’t save reference classes."  
     - **Weakness:** Overlooks that reference classes can be *too* broad (e.g., grouping Naomi with all solo founders ignores her unique credentials).  

  2. **Rob (Inside View/Class Selection)**  
     - **Rating:** *Strong*  
     - **Justification:** Valid critique of reference class arbitrariness (Kahneman’s "reference class tennis"). Load-bearing claim: "Evidence of pilot results/team exists *only* in the inside view."  
     - **Weakness:** Underestimates how subjective class selection can be (e.g., is Naomi’s track record truly comparable to successful outliers?).  

  3. **Elena (Planning Fallacy & Rationalization)**  
     - **Rating:** *Partially Right*  
     - **Justification:** Correctly notes insiders are often overconfident (planning fallacy data). Fair concession: Admits class selection is hard.  
     - **Mistake:** Equates "rationalizing with particulars" with *all* inside-view evidence. Ignores that some details (e.g., committed team) are objective.  

  4. **Rob (Asymmetry of Outside View)**  
     - **Rating:** *Decisive Point*  
     - **Justification:** Exposes critical flaw: Outside view, as used, only suppresses probabilities, making exceptional ventures *impossible to justify rationally*—yet they exist (e.g., OpenAI). Load-bearing claim: "Discarding evidence isn’t the cure for bias."  
     - **Missing Nuance:** Doesn’t address *how much* to weight inside evidence vs. base rates.  

  5. **Elena (Peer Disagreement as Evidence)**  
     - **Rating:** *Theoretically Sound, Practically Flawed*  
     - **Justification:** Correctly applies Aumann-like agreement theorems: Differing credences should prompt mutual updating.  
     - **Mistake:** Assumes peer symmetry. Rob/Naomi have asymmetric information (Naomi knows her capabilities/pilot data better).  

  6. **Rob (Regress & Immobility)**  
     - **Rating:** *Strong*  
     - **Justification:** Highlights paradox: Universal modesty stifles innovation (e.g., if Wright brothers averaged credences with peers, flight is delayed). Load-bearing claim: "Field-movers didn’t average with the crowd."  
     - **Weakness:** Overstates risk; rational agents can weight peers *without* full symmetry or paralysis.  

  7. **Elena (Survivorship Bias)**  
     - **Rating:** *Mostly Right*  
     - **Justification:** Crucial point: Rob focuses on winners (e.g., successful immodest founders) while ignoring vast graveyard of failures.  
     - **Missing:** Doesn’t refute Rob’s asymmetry argument; only restates base-rate value.  

  ---

  ### **Load-Bearing vs. Fair Claims**
  - **Elena’s Load-Bearing:**  
    - Base rates deserve significant weight (Move 1).  
    - Survivorship bias invalidates "I’m the exception" thinking (Move 7).  
  - **Rob’s Load-Bearing:**  
    - Outside view suppresses exceptional projects asymmetrically (Move 4).  
    - Inside-view evidence is irreplaceable (Move 2).  
  - **Fair Concessions:**  
    - Elena: Class selection is messy (Move 3).  
    - Rob: Overconfidence is real (Move 4).  

  ---

  ### **Hidden False Assumptions**
  - **Elena:** Assumes all inside-view details are "rationalizations," ignoring that some evidence (e.g., pilot results) is diagnostic.  
  - **Rob:** Assumes reference classes are *always* arbitrary, neglecting that some base rates (e.g., startup failure rates) are robust across subclasses.  

  ---

  ### **What Both Miss**
  1. **Bayesian Updating:** They debate "inside vs. outside" as binary, but best practice combines them: Base rate = prior, inside evidence = likelihood.  
  2. **Evidence Quality:** Not all inside-view evidence is equal. Naomi’s "pilot results" could be a strong signal if quantified.  
  3. **Naomi’s Calibration:** Her forecasting skill (if known) affects how much to trust her self-assessment.  

  ---

  ### **Who is More Right? Rob (Slightly)**  
  - **Why Rob Wins:** His asymmetry argument (Move 4) is the most devastating critique: If we *only* use outside views, we condemn all exceptional ventures by default. History rewards those who judiciously override base rates with unique evidence (e.g., Einstein, Musk).  
  - **Elena’s Strengths:** She correctly forces humility (Moves 1, 7), but her approach, if applied rigidly, leads to systemic false negatives.  
  - **Synthesis:** Rob’s inside-view evidence deserves weight *if* it’s specific and verifiable (e.g., committed team, pilot data). Base rates should anchor the prior but not veto updates. Naomi’s 70% is likely too high, but collapsing to 15% ignores discriminative evidence. A revised estimate (~30–40%) would balance both.  

  **Final Verdict:** Rob lands the decisive point (Move 4). The outside view is a tool for humility, not a prison for probability. Exceptional ventures *require* weighing inside evidence—carefully.
