prompt: |-
  I'm a grad student and next month I'm presenting a paper at a workshop where the audience is mostly formal epistemologists plus two economists from the decision sciences group who are basically fully paid-up Bayesians -- the kind of people who think Savage more or less settled things and treat VNM as bedrock. There's also a couple of moral philosophers who are deeply skeptical of the whole formalism but will happily watch it get attacked on its own terms. My thesis is that the standard coherence arguments get you much less than people claim: they show, at most, that an agent shouldn't be exploitable by a shrewd bookie in a specific setup, but they don't get you all the way to expected utility maximization. My paper has three moves: first, Dutch book arguments only target credences that violate the probability axioms, so they say nothing about the utility side; second, the money pump story needs extra assumptions about sequential choice (that you can't just refuse to trade, that you'll notice the pattern, that the pump is finite) and once you make those assumptions explicit, the "coherence" they enforce is thinner than EU; and third, when you look at what's left after you strip the exploitability rhetoric away, what survives is basically just transitivity plus maybe some weak ordering conditions -- which I'm calling "thin coherence." I want to be upfront that I'm aware of Gustafsson's book defending money-pump arguments against the standard objections, and at least one of the economists there will have read Buchak's Risk and Rationality carefully, so I can't get away with the cartoon version of the dialectic where the pro-EU side just didn't notice the sequential-choice loopholes.

  Please draft me a Q&A prep sheet. I want the objections I'll actually get from *this* audience, not the generic LessWrong-adjacent ones -- phrased the way a formal epistemologist or a decision-scientist would actually put it (I'm guessing someone will push on whether "thin coherence" is even a stable stopping point, and someone else will do the reverse move where they grant me everything about exploitability and then argue the representation theorems were doing the real work all along and never needed the money pump). Order them by how much damage each would do, give me a two-minute reply for each one, and be honest about where each reply is soft. Also flag what I should just concede upfront -- I suspect the diachronic Dutch book stuff is one of those, since the synchronic/diachronic distinction cuts against me at least as much as for me. And tell me the question I'm secretly hoping nobody asks. My advisor thinks it's the one about whether my position has any normative bite at all -- like, if thin coherence permits basically every non-transitive-reforming theory on the table, what did we learn -- but I'm honestly not sure that's the worst one, and I'd rather find out now than mid-talk. Keep the replies to things I can actually say in two minutes without a whiteboard, and note where I'd be tempted to overclaim.
reasoning: |-
  Okay, the user is a grad student preparing for a workshop presentation. Their paper critiques standard coherence arguments for expected utility maximization, arguing that these arguments only establish "thin coherence" (transitivity plus weak ordering) rather than full EU. The audience includes formal epistemologists, economists (Bayesians), and skeptical moral philosophers. 

  First, I need to understand the core of their argument: Dutch books only target probability axioms, money pumps require extra assumptions, and what's left is thin coherence. They're aware of Gustafsson and Buchak, so objections will be sophisticated. 

  The user wants a Q&A prep sheet focused on high-damage objections from this specific audience. Prioritization is key—I should rank objections by how much they threaten the thesis. The worst might be about normative bite (if thin coherence allows all non-transitive theories, what's the point?). But there could be worse ones they haven't considered.

  For structure: I'll list objections in descending order of damage. Each needs a concise reply (under 2 mins) with honesty about weaknesses. The user also wants concessions flagged upfront (e.g., diachronic Dutch books) and to identify the "secretly hoped nobody asks" question. 

  Key objections I anticipate:
  1. **Normative emptiness**: If thin coherence permits cyclic preferences or non-EU frameworks (like rank-dependent utility), does it have any teeth? (This might be the worst.)
  2. **Representation theorems**: Economists might argue Savage/VNM *do* deliver EU without exploitability rhetoric—so why care about thin coherence?
  3. **Gustafsson's defense**: How do you counter his refined money-pump arguments that address sequential-choice loopholes?
  4. **Stability of thin coherence**: Is it even a coherent stopping point? (Formal epistemologists might push this.)
  5. **Reverse Dutch book**: Could thin coherence lead to *other* vulnerabilities? 
  6. **Buchak's RDU**: Economists might ask why thin coherence is better than her risk-based axioms.

  For replies: Keep them tight. Example—for normative emptiness, admit it's a real concern but argue thin coherence still excludes *genuine* irrationality (transitivity violations). Concede it's minimalist. Weakness: Doesn't resolve debates between EU alternatives.

  Secret nightmare question: Probably the normative bite one—it cuts to the heart of the critique's value. If thin coherence doesn't guide practice, why bother? User's advisor flagged this, so I'll emphasize it. 

  Also, note where the user might overclaim (e.g., claiming thin coherence is "all you need" when it's really a floor, not a ceiling). Stress that their goal is *negative*—showing EU arguments overreach—not offering a rival norm.
answer: |-
  Here's a Q&A prep sheet tailored to your audience and thesis, ordered by potential damage level. I've flagged concessions, soft spots, and the "nightmare question." Replies are designed for ~2 minutes of clear, measured speaking.

  ---

  ### **Q&A Prep Sheet: Prioritized Objections & Replies**  
  **(Ordered by Descending Damage Potential)**

  1. **The Normative Emptiness/Objection ("What's the point?")**  
     *Audience Source:* Moral philosopher or skeptical formal epistemologist  
     *Likely Phrasing:* "If 'thin coherence' permits cyclic preferences under some descriptions, allows RDU (Rank-Dependent Utility), prospect theory, or even state-dependent utility without reform, and doesn’t rule out any major non-EU alternative except outright transitivity violations, what normative work is it doing? Isn’t this just a fancy way of saying ‘transitivity’?"  
     **Damage Level:** ★★★★★ (Your advisor is right—this undermines the *significance* of your critique.)  
     **Reply (2-min):**  
     > "It’s true that thin coherence is minimalist—deliberately so. My target isn’t alternatives like RDU, but the claim that *exploitability arguments* justify stronger EU axioms (like independence or continuity). Thin coherence shows that the most famous *pragmatic* arguments for EU (Dutch books, money pumps) can’t do that heavy lifting. Normatively, it establishes a bare-minimum floor: agents who violate transitivity *are* instrumentally flawed in a way that cyclic-RDU agents aren’t. But you’re right: this doesn’t vindicate EU. It shifts the burden to non-pragmatic arguments (e.g., representation theorems) or domain-specific norms."  
     **Soft Spot:** Concedes thin coherence is "weak." Doesn’t resolve why we should care if it permits many alternatives.  
     **Don’t Overclaim:** Avoid saying thin coherence is "sufficient for rationality." Stress it’s a *necessary condition exposed by exploitability arguments*.  

  2. **The Representation Theorem End-Run ("Exploitability was never the point")**  
     *Audience Source:* Economist or formal epistemologist  
     *Likely Phrasing:* "You’re attacking a straw man. Savage/VNM never relied on money pumps—they’re *characterization theorems*. If you accept their axioms (completeness, independence, etc.) as normatively compelling *on their own*, EU maximization follows. The money pump is just an intuition pump for those axioms. Why conflate the two?"  
     **Damage Level:** ★★★★☆ (If accepted, your critique becomes irrelevant to their project.)  
     **Reply (2-min):**  
     > "I agree representation theorems are distinct—but in practice, exploitability arguments *are* used to motivate those axioms (e.g., bookies for additivity, money pumps for independence). My point is that when you dissect those stories, they don’t actually justify the axioms. For instance, the money pump for independence assumes you can’t bind yourself to plans or re-evaluate in real-time—but if you drop those assumptions, independence violations aren’t necessarily exploitable. So if we want to defend Savage’s axioms, we need non-pragmatic arguments."  
     **Soft Spot:** If the audience sees axioms as *primitively* rational, your critique glances off.  
     **Concession Upfront:** Grant that representation theorems are mathematically sound. Your target is their *rhetorical support*.  

  3. **Gustafsson’s Refined Money Pump ("You ignored the new breed")**  
     *Audience Source:* Economist or formally minded philosopher (Buchak-reader)  
     *Likely Phrasing:* "Gustafsson (2022) addresses your objections: he uses *preference-reversal* pumps with *no foreknowledge* and shows that cyclic preferences lead to self-harm *even if* you can refuse trades or lack foresight. Doesn’t this restore the argument for transitivity+independence?"  
     **Damage Level:** ★★★★☆ (Directly challenges your second move.)  
     **Reply (2-min):**  
     > "Gustafsson’s work is sophisticated, but his pumps still rely on contentious assumptions. First, they require that the agent’s preferences shift in *specific, predictable ways* across time—but this isn’t true for all non-EU agents (e.g., RDU agents don’t reverse preferences under mere description changes). Second, they assume the agent *must* act on current preferences at each stage. But if I’m aware of my dynamic inconsistency, I might use precommitment strategies—which Gustafsson rules out by fiat. His arguments work only against agents who are both myopic and naively introspective."  
     **Soft Spot:** Gustafsson’s cases are clever. Your reply may feel like special pleading.  
     **Key Move:** Emphasize that *your non-EU agent* (e.g., Buchak-style RDU) isn’t vulnerable.  

  4. **The "Thin Coherence Isn’t Stable" Objection**  
     *Audience Source:* Formal epistemologist  
     *Likely Phrasing:* "Suppose I accept thin coherence. Won’t I inevitably face choices where my preferences *appear* exploitable unless I add more structure? E.g., if I violate independence, I might satisfy thin coherence now but face a dynamic choice problem later that forces me into EU—or into incoherence."  
     **Damage Level:** ★★★☆☆  
     **Reply (2-min):**  
     > "Not necessarily. Take Buchak’s RDU: it violates independence but satisfies dynamic consistency by her *separation* axiom. She avoids money pumps without collapsing into EU. What thin coherence shows is that exploitability arises only when you layer on auxiliary assumptions (e.g., no commitment devices, no state-dependent valuation). Those assumptions aren’t entailed by coherence—they’re substantive additions. So while you *can* construct traps for non-EU agents, those traps depend on controversial constraints."  
     **Soft Spot:** If separation-like axioms fail, instability resurfaces.  

  5. **Reverse Dutch Book ("You’re vulnerable elsewhere")**  
     *Audience Source:* Formal epistemologist  
     *Likely Phrasing:* "Diachronic Dutch books show that violating *conditionalization* makes you exploitable. But your ‘thin coherence’ says nothing about updating. Doesn’t this mean you’re still pragmatically vulnerable even if you satisfy synchronic coherence?"  
     **Damage Level:** ★★☆☆☆  
     **Reply (2-min):**  
     > "Absolutely—this is a key concession. Diachronic Dutch books *do* work against agents who violate Bayesian updating, and thin coherence doesn’t protect you there. My claim is narrower: synchronic exploitability arguments don’t justify the VNM/Savage utility framework. But I agree: if you want dynamic coherence, you need more. That said, even diachronic arguments rely on assumptions about how bookies exploit delayed bets—which real agents might avoid via awareness or precommitment."  
     **Concession Upfront:** Flag that diachronic Dutch books are stronger. Your thesis is limited to synchronic choice and money pumps.  

  6. **The Buchak Counter ("Why prefer thin coherence to RDU?")**  
     *Audience Source:* Economist (Buchak fan)  
     *Likely Phrasing:* "Buchak’s RDU satisfies ‘pragmatic rationality’ via her own axioms (like dynamic consistency). If thin coherence permits RDU but also permits wilder theories, why not just adopt RDU as a *positive* norm instead of your minimalist one?"  
     **Damage Level:** ★★☆☆☆  
     **Reply (2-min):**  
     > "I’m not arguing *against* RDU! Thin coherence is a defensive position: it shows why arguments *against* RDU (or similar) based on exploitability fail. If Buchak’s axioms are independently plausible, great. But if someone attacks RDU by saying ‘it’s pumpable!’, I’m showing that charge relies on assumptions RDU needn’t accept. My goal is to clear the underbrush for theories like hers."  
     **Soft Spot:** Doesn’t help if they think exploitability *is* decisive against RDU.  

  ---

  ### **The Nightmare Question (You’re Hoping Nobody Asks)**  
  **"If thin coherence permits cyclic preferences under coarse descriptions (e.g., ‘I prefer A to B, B to C, but C to A when described differently’), and you grant that such agents are irrational, haven’t you just smuggled in a richer notion of rationality? What’s your *independent* argument against them?"**  
  *Why it’s bad:* It forces you to either (a) admit thin coherence is incomplete (undermining its novelty), or (b) defend a purely formal norm without pragmatic grounding—which feels empty.  
  **Reply (2-min):**  
  > "I’d argue that *description invariance* is a separate requirement—not part of coherence. Thin coherence targets only *all-things-considered* preferences. If an agent’s preferences shift under redescriptions, that’s a failure of reflection or self-knowledge, not instrumental rationality. But you’re right: this exposes that thin coherence needs supplementation for real-world agents. Still, my core point stands: exploitability arguments don’t deliver EU’s stronger demands."  
  **Damage Control:** Frame this as "beyond scope," but concede it’s a limitation.  

  ---

  ### **Strategic Summary**  
  - **Lead with Concessions:** Acknowledge diachronic Dutch books and representation theorems early to seem balanced.  
  - **Pivot to Your Goal:** Emphasize you’re *narrowly* attacking the rhetoric of exploitability, not EU itself.  
  - **Weakest Point:** Normative bite. Prep a fallback: "Thin coherence is the *most* we can extract from these arguments—if we want more, we need different justifications."  
  - **Temptation to Overclaim:** Don’t say thin coherence is "enough." Say it’s "all that exploitability arguments can secure."  

  This audience will respect nuance. If you’re transparent about limitations, they’ll engage constructively—even if they disagree. Good luck!
