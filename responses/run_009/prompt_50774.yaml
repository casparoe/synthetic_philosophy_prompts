prompt: |-
  So here's my situation. I'm a third-year PhD student — my main thing is social epistemology, with a side interest in virtue ethics that I mostly keep quiet about — and I've been slotted into our department's work-in-progress seminar next month. My thesis, in one breath: the standard puzzle about moral testimony (why does deferring to other people about what to do feel so much fishier than deferring to them about matters of fact?) isn't fundamentally a puzzle about testimony. It's about the kind of knowledge involved. A big chunk of moral knowledge is practical knowledge in the Rylean sense — knowing-how, the sort of thing you have by being able to tell, in context, what matters and what it's like to be acting well — and testimony is a great channel for transmitting propositions but a terrible channel for transmitting skill. So the queasiness about moral deference is basically the queasiness you'd feel about someone claiming they learned to swim from a lecture. On my view, that's the whole phenomenon; you don't need to appeal to autonomy or self-expression or moral understanding as some special epistemic good — those are downstream symptoms of the skill/transmission mismatch.

  The audience is the hard part. Our department has four ethicists, two of whom work directly on moral testimony and know that literature inside out — they'll arrive with the objections pre-packaged, probably the autonomy one and the "you've just redescribed the phenomenon, not explained it" one. Then there's a virtue theorist who I suspect will like my thesis more than I do (he'll want it to be about practical wisdom and character, and I don't want to concede that much). One old-school epistemologist who thinks everything worth saying can be said in terms of justification, and one guy who regards Ryle as a marginal figure and thinks anti-intellectualism about knowledge is basically a disease — he's the one I'm least sure how to handle, because my whole setup leans on the knowing-how/know-that distinction and he'll attack the foundation rather than the application.

  Format is 20 minutes of talk plus 15 of Q&A, and the seminar convener has told me flat out that if I can't survive the Q&A the paper won't go to the department workshop series, so this prep matters more than the talk itself. Give me the objections in roughly the order this specific crowd will produce them, ordered by how much damage each would actually do, phrased the way they'd phrase them (the ethicists talk differently than the epistemologists — I want to recognize the objections when they come). For each: what to concede, what to hold, a reply I can actually deliver in about two minutes, and where the reply is soft. Include the question I'm hoping nobody asks — I think it's something like "if moral knowledge is know-how, why does moral testimony work fine for mundane cases, telling kids not to hit each other and so on," but if there's a worse one lurking, I want that too. And be honest about the weakest point in my own position that I should prepare to defend rather than hope they miss. Also flag if any part of my framing is just wrong before I build a defense on it — better I hear it from you than from the seminar.
reasoning: |-
  Okay, the user is a third-year PhD student in philosophy, focusing on social epistemology but with a side interest in virtue ethics. They're preparing for a work-in-progress seminar where they'll present their thesis on moral testimony. Their main argument is that the unease about deferring to moral testimony isn't about testimony per se but about the nature of moral knowledge. They argue that moral knowledge is largely practical know-how (Rylean), which can't be transmitted via testimony like propositional knowledge can. They compare it to learning to swim from a lecture—it doesn't work.

  Now, the audience is tricky. There are four ethicists: two specialize in moral testimony and will have ready objections, likely about autonomy or that the thesis merely redescribes the phenomenon. A virtue ethicist might overextend the argument to practical wisdom and character, which the user wants to avoid. An old-school epistemologist focuses on justification and might dismiss non-propositional knowledge. Then there's a Ryle skeptic who thinks anti-intellectualism is flawed—this is a big concern since the know-how/know-that distinction is foundational to the user's argument.

  The format is 20 minutes talk + 15 minutes Q&A. The seminar convener warned that surviving Q&A is crucial for advancing to the department workshop. So the user needs to anticipate objections, prioritize them by damage potential, and prepare concise, effective replies. They also want to know the worst possible question and their argument's weakest point.

  First, I need to map out the likely objections from each audience member, ordered by how damaging they could be. The Ryle skeptic attacking the foundation is probably the most dangerous because if the know-how/know-that distinction is undermined, the whole argument collapses. Next, the ethicists' "redescription" objection could make the thesis seem unexplanatory. Autonomy concerns might be less critical but still need addressing. The virtue ethicist overreaching could derail the focus, and the justification-focused epistemologist might not engage with the core idea.

  For each objection, the user needs to know what to concede, what to hold firm, a two-minute reply, and where it's soft. They also need the question they dread most—beyond the one they mentioned about mundane moral testimony working. Maybe something challenging the applicability of know-how to all moral knowledge or empirical counterexamples.

  The weakest point in their position might be the scope of moral knowledge as know-how. If some moral knowledge is propositional (like "don't hit"), testimony works fine there, which could contradict their thesis. They need to handle that by distinguishing between basic moral facts (transmissible) and complex, context-sensitive judgments (skill-based), but that's a vulnerability.

  Also, checking if their framing is flawed. Ryle's distinction isn't universally accepted, and some like Stanley and Williamson argue know-how is a form of know-that. The user should be ready to defend Ryle or reframe without over-relying on him.

  Structure the response: start with the most damaging objections, phrase them as the audience would, provide replies, highlight soft spots, and flag any framing issues. Include the nightmare question and the argument's Achilles' heel.
answer: |-
  Here’s your objection roadmap, ordered by damage potential (high to medium), phrased authentically for each critic. I’ve flagged framing risks, your nightmare question, and your weakest point upfront.

  **Critical Framing Risk:**  
  Your Rylean foundation *is* vulnerable. If the anti-intellectualist (know-how/know-that) distinction collapses under pressure, your entire argument unravels. Stanley & Williamson (2001) and intellectualists will argue know-how *reduces* to know-that. Be ready to defend Ryle’s irreducibility claim or soften dependency on it.  

  **Nightmare Question (Worse Than Mundane Cases):**  
  *"If moral know-how is non-propositional, why do we routinely express moral knowledge in propositional form (‘Torture is wrong’), argue about it logically, and treat it as truth-apt? Isn’t this evidence that the ‘skill’ aspect is peripheral to core moral epistemology?"*  
  *(This attacks your core ontological claim. Mundane cases are easier to handle—see below.)*  

  **Your Weakest Point:**  
  The scope problem. Not *all* moral knowledge feels "fishy" to defer on (e.g., "Is cannibalism wrong?" in unfamiliar cultures). If only *some* moral knowledge is know-how, what distinguishes it? You need a principled demarcation (e.g., context-sensitivity vs. invariant norms) or risk ad-hocness.  

  ---

  ### Objection Roadmap & Defense Playbook  
  *(Ordered by damage potential for your thesis)*  

  1. **The Ryle Skeptic (Epistemologist)**  
     **Phrased as:** "This entire argument rests on a discredited dichotomy. Ryle’s ‘anti-intellectualism’ ignores that *all* knowledge-how is constituted by knowledge-that (e.g., Stanley & Williamson). If knowing-how just *is* knowing a proposition under a practical mode of presentation, your ‘transmission mismatch’ vanishes. You’re building on quicksand."  
     **Damage Level:** ⚠️⚠️⚠️ (Highest - foundational attack)  
     **Concede:** That intellectualism is a dominant view; Ryle isn’t universally loved.  
     **Hold:** That *even if* know-how reduces to know-that, the *phenomenology* of transmission differs radically. Learning piano isn’t like learning math, even if both are "propositional."  
     **2-Minute Reply:** "I appreciate the push—but my point is phenomenological, not metaphysical. Transmission of complex, context-sensitive capacities *feels* and *functions* differently than factual uptake, regardless of reduction. Think of medical diagnosis: you can know all textbook symptoms (know-that) but lack diagnostic *skill* (know-how). Testimony transmits the former poorly to the latter. That experiential gap is what I’m tracking."  
     **Soft Spot:** If pressed, you might need to retreat to a "pragmatic" (not ontological) distinction.  

  2. **Moral Testimony Ethicist #1 (Redescription Charge)**  
     **Phrased as:** "You haven’t *explained* the queasiness—you’ve just redescribed it in terms of ‘skill.’ Why is transmitting skill via testimony problematic? Isn’t ‘autonomy’ or ‘understanding’ still doing the real work here? This is circular."  
     **Damage Level:** ⚠️⚠️ (High - challenges explanatory power)  
     **Concede:** That "skill" alone doesn’t fully explain normative resistance to deference.  
     **Hold:** That skills have unique transmission conditions (demonstration, practice, feedback) that testimony structurally can’t meet. *That’s* the mechanism.  
     **2-Minute Reply:** "The ‘why’ is in the constraints of skill acquisition. Testimony is passive, one-way, and discrete. Skills require active, iterative, situated practice—*that’s* why testimony fails. Autonomy matters *because* skills require first-personal engagement; it’s a downstream effect. Redescription? Only if we ignore the empirical literature on expertise development (e.g., Dreyfus)."  
     **Soft Spot:** Needs empirical backing. If asked "Cite Dreyfus," do it.  

  3. **Moral Testimony Ethicist #2 (Autonomy Objection)**  
     **Phrased as:** "You dismiss autonomy, but that’s the elephant in the room. Even if skills require practice, the *moral* unease comes from bypassing agency—deferring on ‘what should I do?’ feels like outsourcing my moral self. Your ‘skill’ story doesn’t capture this normativity."  
     **Damage Level:** ⚠️⚠️ (High - misses core moral intuition)  
     **Concede:** That moral deference *feels* uniquely agential.  
     **Hold:** That autonomy is *constituted* by skilled responsiveness to reasons. Outsourcing isn’t problematic because it’s "anti-autonomous" but because it *fails to build the skill that autonomy requires*.  
     **2-Minute Reply:** "I’m not dismissing autonomy—I’re grounding it. Autonomy isn’t a primitive; it’s the exercise of moral know-how. If you defer constantly, you never develop the skill to recognize *why* an act is right, so you lack autonomy *in practice*. The ‘outsourcing’ unease is the unease of skill-stunting."  
     **Soft Spot:** May not satisfy Kantians.  

  4. **Virtue Theorist (Overreach)**  
     **Phrased as:** "This is Aristotle 101! What you call ‘know-how’ is *phronesis*—practical wisdom through habituation. Why not embrace the virtue framework fully? Character is the scaffold for this skill."  
     **Damage Level:** ⚠️ (Medium - co-opts your thesis)  
     **Concede:** That virtue theory captures similar phenomena.  
     **Hold:** That virtue ethics smuggles in normative baggage (telos, character) you don’t need. Know-how is thinner and more epistemically tractable.  
     **2-Minute Reply:** "I’m sympathetic, but my aim is epistemological, not ethical. Know-how is a broader category: you can have moral skill without ‘virtuous character’ (e.g., a repentant wrongdoer learning discernment). Focusing on skill avoids commitments to *eudaimonia* or traits—it’s about the *structure* of knowing."  
     **Soft Spot:** If pushed, admit "This is social epistemology, not virtue theory."  

  5. **Justification-Focused Epistemologist**  
     **Phrased as:** "Why complicate things? We can model this as a justification deficit: moral testimony often lacks the contextual evidence needed for warrant. No ‘know-how’ required."  
     **Damage Level:** ⚠️ (Medium - alternative explanation)  
     **Concede:** That justification deficits exist in moral testimony.  
     **Hold:** That skills explain *why* moral contexts resist testimonial justification.  
     **2-Minute Reply:** "Justification is the symptom; skill is the cause. *Why* does moral context demand richer evidence? Because you’re not just acquiring a fact—you’re calibrating a capacity to respond to novel situations. Justification-talk doesn’t explain the learning asymmetry between ‘Is water H₂O?’ and ‘Should I forgive this betrayal?’"  
     **Soft Spot:** May seem like a terminological shift.  

  ---

  ### Handling Your Nightmare Questions  
  **Mundane Cases:** "Why does ‘Don’t hit!’ work?"  
  - **Reply:** "Simple norms *can* be transmitted as rules (thin know-that). But queasiness arises in *complex*, context-rich judgments (‘Should I quit my job to care for my parent?’). Mundane cases are the ‘swimming strokes’ lecture—useful but insufficient for deep competence."  

  **"Why Propositions?" Nightmare Question:**  
  - **Reply:** "We express skills propositionally *post hoc*, but the knowledge *in use* is non-propositional. You articulate ‘keep your elbow straight’ *after* learning tennis—but the competence isn’t stored as sentences. Moral language is a map; the skill is the territory."  

  ---

  **Defense Strategy Summary:**  
  - **Shield the Foundation:** Defend Ryle pragmatically if not metaphysically ("This framework *explains the phenomena*").  
  - **Embrace the Scope Issue:** Pre-empt it by distinguishing basic norms (testimony-apt) from complex discernment (skill-apt).  
  - **Redirect Virtue Enthusiasm:** "Useful analogies, but my project is epistemological reduction."  
  - **Kill Circularity Charges:** Stress the *mechanism* (testimony’s structural limits for skills).  

  **Final Prep Tip:** Script your replies to *sound* spontaneous. Use:  
  *"That's a great point—let me clarify..."*  
  *"I think we're actually agreeing that X, but where I differ is Y..."*  
  *"Empirically, we see this in..."*  

  You’ve got a sharp thesis. Now armor it. Go crush Q&A.
