prompt: |-
  I'm taking a philosophy of law class this semester and my term paper is on what makes consent actually valid — when deception, coercion, or incompetence means the "yes" doesn't count. Before I start evaluating theories I want the spec first: what does any adequate theory of valid consent have to deliver? Not the theories themselves — the requirements list, with the case or consideration behind each one.

  Cases I think it has to handle (tell me if I'm missing big ones or if any of these are actually two cases wearing a trenchcoat): stealthing — she said yes to sex but not unprotected sex, so consent has to be specific, but how specific?; lying about contraception vs. lying about your feelings — fraud seems to invalidate consent to surgery (the fake doctor case) but not consent to sex when the lie is about love, and I can't tell if that's a real distinction or courts just being squeamish; quid pro quo threats — "sleep with me or you're fired" is coercion, "sleep with me and I'll promote you" is supposedly just a gross offer, and the theory has to say where that line is and why; the drunk person; Ulysses contracts / advance directives (can I bind a future self that will disagree?); the sweatshop case, where I only "agree" to the wage because the whole global background leaves me nothing better — does validity track just the proximate threatener or the entire causal history?; and the newer one, algorithmic manipulation, like a betting app that learns exactly when you're weakest and times its "confirm your deposit?" screen for that moment — is that coercion, deception, or neither, and does the theory have to have an answer? Also: does a theory owe us a verdict on whether consent is binary or comes in degrees? I suspect that does alot of quiet work everywhere and nobody says it out loud.

  Then mark which requirements are non-negotiable and which are just one camp's prejudice dressed up as a demand. And here's the part I actually most want, for the paper: I have a hunch you can't jointly have (a) consent staying valid under nonideal background conditions and (b) consent doing the moral work we ask of it in ordinary contracts, medicine, and sex — without the theory sliding into either "consent never invalidates anything" or "consent invalidates nearly everything." Is that right, or is there a way out I'm not seeing? If some subset of the desiderata is genuinely jointly unsatisfiable, say so plainly, because the list itself might be my thesis.

  Skip the scorecard of existing theories, I'll do that part myself. And dont be polite about my framing — if one of my "requirements" is just me smuggling in the conclusion I want, or if the whole list-of-desiderata approach fits badly here, say that straight. I'd rather find out from you than in my professor's margin comments. Also flag anywhere you're genuinely unsure — the paper needs my confidence calibrated, not inflated.
reasoning: |-
  Okay, the user is diving deep into the philosophy of law, specifically focusing on what makes consent valid. They're working on a term paper and need a solid foundation before evaluating theories. Let me unpack their query.

  First, they want a list of requirements any adequate theory of valid consent must meet. They've provided several cases: stealthing, deception in contraception vs. feelings, quid pro quo threats, intoxication, Ulysses contracts, sweatshop labor, and algorithmic manipulation. They also question if consent is binary or gradable. They're concerned about non-negotiable vs. negotiable requirements and whether there's a conflict between consent under nonideal conditions and its moral role.

  Hmm, I need to ensure each case is addressed in the requirements. Stealthing highlights specificity in consent—how detailed must consent be? The deception cases (contraception vs. feelings) touch on materiality. Quid pro quo threats involve distinguishing coercion from offers. Intoxication relates to competence. Ulysses contracts challenge temporal binding. Sweatshops and algorithmic manipulation test structural coercion and manipulation beyond traditional categories.

  The user's deeper need seems to be identifying if there's an inherent tension in consent theory. They suspect that maintaining validity under nonideal backgrounds while expecting consent to do moral work might lead to extremes. I should explore if this tension is real. For instance, if we consider sweatshop conditions coercive, does that invalidate most agreements, making consent nearly meaningless? Or if we ignore background injustices, does consent become a rubber stamp?

  I should also assess which requirements are core. Voluntariness, competence, understanding seem non-negotiable. But the extent of specificity or handling structural injustice might be contentious. The user needs clarity on which aspects are foundational versus debatable.

  Their hunch about a dilemma between nonideal conditions and moral functionality is critical. If a theory requires ideal conditions for valid consent, it becomes impractical. But if it adapts to nonideal realities, consent might not provide moral transformation. For example, in sweatshops, if consent is deemed invalid due to systemic coercion, then many contracts fall apart. If valid, it might excuse exploitation. Maybe the solution lies in differentiating between validity and moral permissibility, but that complicates the theory.

  I should also flag areas of uncertainty. Algorithmic manipulation is a newer issue—does it fit existing categories or need a new framework? The binary vs. gradable consent point affects how we judge marginal cases, like moderate intoxication.

  The user wants to avoid theory scorecards, so focus on the framework. They need to know if their cases cover enough ground. Maybe add cases like mistaken identity (catfishing) or authority figures exploiting power dynamics. Also, consider if cultural context affects competence or understanding.

  Their unspoken need might be to structure their paper around the tension they identified. Confirming that the desiderata set has inherent conflicts could be their thesis. Highlighting which requirements lead to this dilemma would strengthen their argument. They might also need to position their work as showing why consent theories struggle with real-world applications, leading to either over-validation or under-validation.

  Finally, ensure clarity on non-negotiable points. For instance, without competence and understanding, consent is meaningless. But materiality in deception (feelings vs. contraception) is debated. Courts' reluctance in sexual fraud cases versus medical fraud shows societal biases, which the theory must address without inconsistency.
answer: |-
  Here's a specification for an adequate theory of valid consent, based on the cases you provided and core philosophical demands. I've structured it as required desiderata ("must-haves"), the case/problem driving each, and whether it's non-negotiable or contested. I'll then address your core tension directly.

  **The Core Job: An adequate theory of valid consent must provide a principled way to distinguish genuine authorization (which transforms the moral/legal permissibility of an act) from a mere "yes" uttered under conditions that undermine its normative force.**

  **Desiderata for an Adequate Theory (The Requirements List):**

  1.  **Conditional Specificity Requirement:**
      *   **What it must deliver:** Explain how specific the consent must be relative to the proposed act/terms. It must account for cases where consent is given to Act A under Condition X, but Act B or Condition Y occurs.
      *   **Driving Case:** Stealthing (consent to *protected* sex ≠ consent to *unprotected* sex). Also applies to medical procedures (consent to Procedure A ≠ consent to Procedure B performed instead).
      *   **Non-Negotiable?** **Core.** A theory that cannot distinguish consent to specific acts/conditions from consent to a fundamentally different act/condition fails. (The *degree* of specificity needed is contested, however).
      *   **Theory Challenge:** Defining the "fundamental nature" of the act consented to vs. incidental details.

  2.  **Materiality Requirement (Fraud/Deception):**
      *   **What it must deliver:** Provide a criterion for when deception/fraud invalidates consent. It must distinguish between lies that go to the *core nature or essential terms* of what is consented to vs. lies about collateral matters.
      *   **Driving Case:** The "fake doctor" vs. "lying about feelings/love" distinction. Why does impersonating a surgeon invalidate consent for surgery, but lying about marital status or feelings often doesn't invalidate consent for sex? Also: lying about contraception vs. lying about wealth.
      *   **Non-Negotiable?** **Core.** A theory must account for why some deceptions matter normatively and others don't. Simply saying "all deception invalidates" is implausible (e.g., minor lies about age, profession).
      *   **Theory Challenge:** Defining "materiality" – is it objective (would a reasonable person care?), subjective (did *this* person care?), or based on the type of act (medical vs. sexual vs. commercial)? Explaining the *reason* for the common distinction without relying solely on social conventions or judicial discomfort.

  3.  **Threat-Offer Distinction Requirement (Coercion):**
      *   **What it must deliver:** Provide a clear, principled distinction between a coercive *threat* (which invalidates consent) and a merely *unattractive offer or incentive* (which typically does not). Explain *why* this distinction matters.
      *   **Driving Case:** Quid pro quo harassment ("sleep with me or you're fired" vs. "sleep with me and I'll promote you").
      *   **Non-Negotiable?** **Core.** Coercion is universally recognized as invalidating consent. The theory must define its boundaries meaningfully.
      *   **Theory Challenge:** Articulating the normative difference between worsening someone's baseline position (threat) versus failing to improve it (offer). Defining the relevant "baseline" (legal status quo? reasonable expectations? individual expectations?) is the crux. Must handle cases where the "offerer" creates the dependency (e.g., employer-employee power imbalance).

  4.  **Competence/Capacity Requirement:**
      *   **What it must deliver:** Define the threshold of cognitive/volitional capacity required for consent to be valid. This includes understanding, reasoning, and communication abilities relevant to the decision.
      *   **Driving Case:** The intoxicated person (how drunk is *too* drunk?); minors; individuals with significant cognitive impairments.
      *   **Non-Negotiable?** **Absolute Core.** Consent without the minimal capacity to understand and choose is meaningless. This is foundational across law and ethics.
      *   **Theory Challenge:** Setting the threshold – is it fixed or risk-sensitive? (Higher stakes demand higher capacity). Handling fluctuating capacity (e.g., dementia, intoxication).

  5.  **Temporal Binding Requirement (Ulysses Contracts):**
      *   **What it must deliver:** Explain whether and under what conditions a competent present self can validly bind a future self who may lack competence or hold different values/desires.
      *   **Driving Case:** Psychiatric advance directives (refusing future treatment during a current lucid period); potentially DNR orders.
      *   **Non-Negotiable?** **Contested.** While respecting autonomy suggests allowing binding, concerns about authentic future wishes make this a major theoretical battleground. An adequate theory must *engage* with it, but the *solution* is highly disputed.
      *   **Theory Challenge:** Reconciling the autonomy of the past self with the (potential) autonomy/paternalistic concerns for the future self. Defining the conditions under which the future self's dissent overrides prior consent.

  6.  **Background Justice/Structural Coercion Requirement:**
      *   **What it must deliver:** Address whether consent can be valid when given within a context of pervasive, non-proximate injustice or deprivation that severely limits options, even if no specific individual is making a direct threat.
      *   **Driving Case:** The sweatshop worker ("consenting" to exploitative conditions due to systemic poverty/lack of alternatives). Also: desperate medical trial participation.
      *   **Non-Negotiable?** **Highly Contested.** This is the major fault line. Libertarian/formalist theories often reject this as relevant to *validity* (though maybe to justice/fairness). Critical theories (Marxist, Feminist) insist it's essential. An adequate theory *must* take a stance *on why* it should/shouldn't be a validity condition.
      *   **Theory Challenge:** Avoiding the "invalidates everything" problem while acknowledging that extreme background injustice can render choice illusory. Defining the threshold where background conditions become coercive enough to invalidate proximate consent. Explaining the *normative link* between structural injustice and individual consent validity.

  7.  **Manipulation/Affective Exploitation Requirement (Algorithmic):**
      *   **What it must deliver:** Account for how non-deceptive, non-threat-based forms of manipulation (exploiting cognitive biases, emotional states, predictive algorithms) affect consent validity. Provide criteria for when such manipulation crosses the line.
      *   **Driving Case:** Algorithmic timing of prompts (betting app exploiting known moments of weakness); sophisticated dark patterns; potentially some forms of emotional grooming.
      *   **Non-Negotiable?** **Emerging & Contested.** This is a frontier issue. A theory ignoring modern forms of manipulation risks obsolescence. However, defining the boundary between permissible persuasion/nudging and invalidating manipulation is extremely difficult. It *must* be addressed, but the *solution* is not settled.
      *   **Theory Challenge:** Distinguishing manipulation from ordinary influence without relying solely on deception or coercion. Defining exploitation of vulnerability. Handling the opacity of algorithmic influence.

  8.  **The Binary vs. Degrees Requirement:**
      *   **What it must deliver:** Explicitly state whether consent is a binary (valid/invalid) state or admits of degrees, and explain the *implications* of this choice for how the theory handles marginal cases (e.g., moderate intoxication, complex contracts with some misunderstanding, manipulation falling short of coercion).
      *   **Driving Case:** *All* marginal cases – the drunk person (was consent 70% valid?); partial understanding; offers bordering on coercive; background injustice that is severe but not absolute.
      *   **Non-Negotiable?** **Meta-Requirement.** The theory *must* be clear about its stance here because it fundamentally shapes how it applies to hard cases. It cannot remain implicit. (Whether binary or degrees is *correct* is contested).
      *   **Theory Challenge:** If binary, justifying the threshold. If scalar, explaining how degrees of validity map onto moral/legal responsibility and permissibility (e.g., does 60% valid consent make an act 60% permissible?).

  **Addressing Your Core Tension ("The Dilemma"):**

  **Your hunch is essentially correct, and it points directly to the fault line of the Background Justice Requirement (Desideratum 6).**

  *   **The Dilemma:** To make consent do the heavy moral lifting we demand (transforming permissibility in contracts, medicine, sex) within a *nonideal* world characterized by pervasive inequalities and power imbalances, a theory faces pressure towards one of two unpalatable poles:
      1.  **"Consent Never Invalidates Anything" (Formalist/Libertarian Pole):** If validity *only* requires meeting proximate conditions (voluntariness in the moment, basic competence, no direct deception/threats), then consent functions robustly in the real world (sweatshop contracts are "valid," agreements under duress not caused by a named threat are "valid"). However, this **undermines consent's moral work**. It allows consent to legitimize profound exploitation arising from background injustice ("consent" under conditions of desperation becomes a fig leaf for coercion). Consent fails to reliably signal autonomous authorization.
      2.  **"Consent Invalidates Nearly Everything" (Critical/Ideal Theory Pole):** If validity requires sufficiently just background conditions (a threshold level of substantive equality, genuine alternatives), then consent *does* reliably signal autonomous authorization and perform its moral role. However, in our nonideal world, **consent becomes vanishingly rare**. Very few agreements (especially involving significant power imbalances or systemic disadvantage) would meet the threshold. This paralyzes social interaction and undermines the practical function of consent in daily life, medicine, and commerce.

  *   **Is There a Way Out?** There are attempts, but they involve significant theoretical trade-offs and rarely satisfy both sides:
      *   **Separating Validity from Permissibility:** Some theories argue consent can be *valid* (meeting proximate conditions) but the *act* consented to might still be impermissible due to background injustice. This preserves the practical function of consent ("Yes" means something) but weakens its moral power – valid consent no longer reliably renders the act *permissible*; additional justice conditions are needed. This might feel like a dodge.
      *   **Scalar Consent + Contextual Permissibility:** If consent comes in degrees, agreements under bad background conditions might be "partially valid" or "defeasibly valid," lowering the threshold for permissibility but not eliminating it entirely. This offers more nuance but makes the normative implications (what am I *allowed* to do?) incredibly complex and context-dependent.
      *   **"Sufficiently Voluntary" Thresholds:** Trying to define a threshold of background conditions required for voluntariness (Desideratum 6 folded into Desideratum 3/Voluntariness). This is the most direct attempt, but defining "sufficiently" without collapsing into Pole 1 or Pole 2 is the core difficulty. Most attempts here are vulnerable to the critique that they either set the bar too low (allowing exploitation) or too high (invalidating too much).
      *   **Focusing on Process over Background:** Emphasizing procedural fairness and information within the specific transaction, while acknowledging background injustice as a separate problem to be addressed politically/socially, not solely through consent theory. This maintains consent's function but acknowledges its limitations in achieving substantive justice.

  **Conclusion on the Dilemma:** Achieving both **(a) robust validity under nonideal conditions** and **(b) consent reliably performing its full moral transformative work (rendering acts permissible)** is **extremely difficult, likely impossible for a monistic theory.** A theory prioritizing (a) sacrifices much of (b); a theory prioritizing (b) sacrifices much of (a). **This tension is fundamental and points towards the need for either:** 1) **Hybrid approaches** (e.g., valid consent + separate justice conditions), 2) **Scalar models** with complex permissibility mappings, or 3) **Acknowledging consent's limitations** – it is a necessary but not sufficient condition for legitimacy in a nonideal world. Your thesis that this tension structures the entire field is well-placed.

  **Final Notes on Your Framing:**

  *   **Your Cases:** Excellent coverage. The "sweatshop" case is indeed the key stress test for the background justice dilemma. Algorithmic manipulation is a crucial modern challenge. You might briefly consider mistaken identity (catfishing) as another deception sub-case, but you've got the major categories.
  *   **Requirements Approach:** This is a *good* approach for your stage. It forces clarity on what problems a theory *must* solve. The challenge is ensuring the requirements aren't already theory-laden. I've flagged where requirements are contested (6, 8) or their *fulfillment* is contested (2, 3, 7).
  *   **Smuggling?** Your list is generally sound. The main risk is in how Desideratum 6 (Background Justice) is formulated. *Requiring* that a theory incorporate it *as a validity condition* is arguably smuggling in a critical theory commitment. A theory *must address it*, but a formalist theory will address it by arguing it *isn't* a validity condition. Your list handles this correctly by highlighting the *requirement to engage and take a stance*.
  *   **Confidence Calibration:**
      *   **High Confidence:** Core requirements (1, 3, 4), the centrality of the threat/offer distinction, competence, and specificity. The existence and nature of the core dilemma (consent under nonideal conditions vs. moral work).
      *   **Moderate Confidence:** The analysis of materiality (2) and the contested nature of temporal binding (5) and background justice (6).
      *   **Lower Confidence/More Speculative:** The best way to categorize and handle novel manipulation like the algorithmic case (7) within existing frameworks. The precise implications of scalar consent models (8) in complex real-world scenarios. *Which* specific hybrid or scalar approach offers the most plausible "way out" of the dilemma – this is where the major theoretical battles rage.

  This gives you a solid, critical foundation. Good luck dissecting the theories against this spec! Your core dilemma insight is sharp – build your paper around it.
