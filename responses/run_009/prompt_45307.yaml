prompt: |-
  I'm the deputy director for prioritization at a regional health authority, and I chair the panel that decides which of roughly ten to fifteen interventions gets funded in each quarterly cycle — new drugs, service expansions, disinvestment proposals — from a budget that never covers everything worth doing. The panel is a mix of clinicians, health economists, and lay members, and whatever we decide has to be defensible in a published rationale, so I need a procedure rather than a philosophy seminar: a sequence of steps the panel can actually run in a two-hour meeting, with something like a checklist, that a clinician with no ethics training can follow and a journalist can read afterward.

  I want the procedure grounded in prioritarianism rather than straight cost-effectiveness maximization: the view that a benefit to someone who is worse off counts for more than the same benefit to someone better off, not because inequality is bad in itself but because of the diminishing moral weight of benefits as a person's position improves. Three things need to be built into the design. First, the leveling-down objection: one of our economists insists that any view that weights distribution this way must, in some case, endorse making better-off people worse off with no compensating gain to anyone, and that a procedure with that implication is unusable in a public body; I want the procedure to include an explicit test for whether it ever yields that verdict, and if it can, for the procedure to say so plainly rather than hide it. Second, the definition of "worse off": worse off right now (the patient with terminal illness) or over a lifetime (the young person whose whole life will be constrained) — these come apart constantly in our decisions, and the procedure needs a rule or an honest pointer to where the panel must choose. Third, a colleague has proposed a concrete operationalization — any health gain to a person below a fixed threshold of health-related quality of life counts double — and I want the procedure to evaluate that specific weighting rule rather than gesturing at weights in the abstract.

  Please structure the response in four sections. (1) "The procedure," roughly six hundred words: the numbered steps in order, what counts as a sufficient answer at each step, where the procedure terminates in a no, and where it must hand the question to the panel as a judgment call rather than a fact. (2) "Where judgment cannot be eliminated," roughly two hundred words. (3) "Three worked cases," roughly five hundred words total: a choice between expanding intensive care for the severely ill and a mental-health program preventing mild-to-moderate depression in working-age adults; a disinvestment proposal to withdraw low-value physiotherapy from moderately ill patients in order to fund palliative home care for the severely ill, where the total health-years lost slightly exceed those gained; and at least one case where the procedure yields an answer I will find uncomfortable, stated without softening. (4) "What the procedure cannot do," roughly two hundred words, including a straight answer on whether my colleague's doubling rule survives the leveling-down test.
reasoning: |-
  Okay, the user is a deputy director at a regional health authority, chairing a panel that decides which health interventions to fund. They need a practical, step-by-step procedure grounded in prioritarianism—prioritizing those worse off—rather than just cost-effectiveness. The procedure must handle three key issues: avoiding the leveling-down objection, defining "worse off" (current vs. lifetime), and evaluating a specific doubling rule for benefits below a health threshold.

  First, I need to design a clear, actionable procedure. The panel has diverse members—clinicians, economists, laypeople—and only two hours per meeting. The output must be defensible in writing, so transparency is crucial. Steps should include concrete checks, termination points, and clear handoffs for judgment calls. 

  For the leveling-down objection: The procedure must explicitly check if any option makes someone worse off without helping others. If so, it should flag this and require manual override. For the "worse off" definition: Since this is philosophically contested, the procedure needs a fixed rule upfront—either current or lifetime—chosen by the panel annually. For the doubling rule: I'll build in a test to see if it triggers leveling-down and show outcomes in worked cases. 

  Structuring the response:  
  Section 1 (Procedure): Break into 10 steps with time estimates. Start with non-negotiable filters (safety, legality), then cost-effectiveness, then prioritarian weighting. Include exit points for "no" decisions and clear handoffs (e.g., defining "worse off").  
  Section 2 (Judgment calls): Acknowledge where the procedure can't decide—e.g., setting the health threshold or choosing between tied options.  
  Section 3 (Worked cases): Use three scenarios to demonstrate the procedure, including one uncomfortable outcome (e.g., rejecting a popular intervention due to leveling-down).  
  Section 4 (Limitations): Confirm if the doubling rule fails the leveling-down test (it does) and note other constraints like data gaps.  

  Key challenges:  
  - Making prioritarian weights operational without oversimplifying. The doubling rule is crude but actionable.  
  - Ensuring clinicians can follow steps without ethics training—using checklists and clear thresholds.  
  - Balancing transparency with efficiency: The procedure must document rationale at each step.  

  For the doubling rule: It will fail the leveling-down test by design (e.g., disinvestment case where moderately ill lose more than severely ill gain). I'll state this bluntly in Section 4.  

  Finally, the uncomfortable case must show the procedure "working" but clashing with intuition—e.g., approving disinvestment that nets fewer health-years but prioritizes the worse off. This highlights prioritarianism’s real-world tradeoffs.
answer: |-
  ## Health Intervention Prioritization Procedure (Prioritarian Framework)

  **Section 1: The Procedure (Approx. 600 words)**

  This procedure provides a structured, defensible framework for prioritizing interventions using a prioritarian lens. It assumes pre-meeting distribution of standardized dossiers for each proposal, including: target population description, baseline health status (current & lifetime HRQoL estimates where feasible), expected health gain (QALYs/equivalent), cost, cost-effectiveness ratio (CER), budget impact, and ethical/social considerations.

  **Time Allocation:** Strict timekeeping is essential. Assume 10 proposals; allocate 10 mins per proposal for steps 1-6, then 30 mins for steps 7-9, and 10 mins for step 10. Chair enforces timing.

  1.  **Feasibility & Mandate Check (5 mins total):**
      *   *Question:* Does the intervention meet basic operational, legal, and safety requirements? Is it within the health authority's statutory remit?
      *   *Sufficient Answer:* "Yes" or "No" based on pre-circulated regulatory/compliance officer summary. Proposals failing this are excluded immediately. *Output:* Initial shortlist.

  2.  **Cost-Effectiveness Threshold (10 mins):**
      *   *Question:* Does the intervention have an Incremental Cost-Effectiveness Ratio (ICER) below the region's explicit threshold (e.g., £20,000/QALY)? Use standard methodology.
      *   *Sufficient Answer:* "Below," "Above," or "Uncertain." Proposals significantly above threshold without compelling prioritarian justification (see Step 7) are excluded. *Output:* Refined shortlist.

  3.  **Define "Worse Off" Baseline (Panel Vote - 5 mins):**
      *   *Question:* For *this cycle*, which baseline defines "worse off": **A) Current Health State** (e.g., terminal illness severity) or **B) Lifetime Health Expectancy** (e.g., young person with chronic condition)? *This is a critical annual/semi-annual policy choice.*
      *   *Procedure:* Chair states the two options. Panel votes (simple majority). Result recorded in rationale. *Output:* Chosen baseline definition for Steps 4-7.

  4.  **Identify Target Population Baseline (Per Proposal - 2 mins/proposal):**
      *   *Question:* Using the chosen baseline definition (Step 3), what is the average HRQoL (0-1 scale, death=0, full health=1) of the target population *before* the intervention?
      *   *Sufficient Answer:* Numerical value from dossier evidence (e.g., "Severe COPD patients: Avg current HRQoL = 0.35" OR "Teens with lifelong disability: Avg lifetime HRQoL = 0.45"). *Output:* Baseline HRQoL score per proposal.

  5.  **Apply Prioritarian Weighting (Per Proposal - 3 mins/proposal):**
      *   *Question:* Apply the **approved weighting rule**: *Double the QALY gain for any individual whose baseline HRQoL (Step 4) is below the fixed threshold (T).* (T is set annually by the Board; e.g., T=0.5).
      *   *Procedure:* For each proposal:
          *   Identify proportion (P) of target population with baseline HRQoL < T.
          *   Calculate Weighted QALY Gain (WQG) = (P * 2 * Unweighted QALY Gain) + ((1-P) * Unweighted QALY Gain).
      *   *Sufficient Answer:* WQG calculated and recorded. *Output:* WQG per proposal.

  6.  **Calculate Weighted Cost-Effectiveness (Per Proposal - 2 mins/proposal):**
      *   *Question:* What is the Incremental Cost-Weighted QALY Gain Ratio (ICWQG)?
      *   *Procedure:* ICWQG = Incremental Cost / WQG.
      *   *Sufficient Answer:* ICWQG calculated and recorded. *Output:* ICWQG per proposal.

  7.  **Leveling-Down Test (Per Proposal - 3 mins/proposal - CRITICAL):**
      *   *Question:* **Does approving this proposal *require* disinvestment that makes any group worse off, without generating a net gain in *unweighted* QALYs?** (I.e., purely redistributive loss).
      *   *Procedure:* Examine budget impact. If funded by disinvestment:
          *   Calculate total *unweighted* QALYs lost from disinvested service(s).
          *   Calculate total *unweighted* QALYs gained from new proposal.
          *   Is QALYs Lost >= QALYs Gained? If YES, trigger "Leveling-Down Risk."
      *   *Sufficient Answer:* "No Risk," OR "Leveling-Down Risk: [Explain]." Proposals triggering "Leveling-Down Risk" *cannot proceed automatically*; require explicit panel override vote (Step 8). *Output:* Risk Flag per proposal.

  8.  **Rank & Shortlist (10 mins):**
      *   *Procedure:* Rank all proposals on the refined shortlist by ICWQG (lowest first). Proposals flagged for Leveling-Down Risk are annotated but remain in ranking. *Output:* Prioritized list.

  9.  **Budget Constraint & Leveling-Down Override (Panel Vote - 15 mins):**
      *   *Procedure:* Fund proposals in rank order until the budget is exhausted.
      *   *Leveling-Down Override:* If the next proposal in rank order has a "Leveling-Down Risk" flag, the panel MUST vote: "Approve despite Leveling-Down Risk: Yes/No." A simple majority is required for approval. If approved, proceed. If rejected, skip to the next proposal.
      *   *Sufficient Answer:* Final funded list, with explicit record of any override votes and the rationale (e.g., "Overrode LD risk for Palliative Care due to extreme severity"). *Output:* Funded/Not Funded decisions.

  10. **Rationale Documentation (10 mins):**
      *   *Procedure:* Chair summarizes: Interventions funded/not funded, chosen baseline definition (Step 3), threshold (T), ranking by ICWQG, any Leveling-Down Risks identified and override decisions. Clerk drafts for publication.

  **Termination Points:** Step 1 (Feasibility fail), Step 2 (High ICER without exceptional WQG - though high WQG *might* save it in ranking), Step 7 (Leveling-Down Risk without override).

  **Section 2: Where Judgment Cannot Be Eliminated (Approx. 200 words)**

  This procedure structures decisions but cannot eliminate key value judgments:
  1.  **Defining "Worse Off" (Step 3):** Choosing between current state or lifetime expectancy is fundamentally ethical. The procedure forces an explicit, recorded choice but cannot dictate it.
  2.  **Setting the Threshold (T):** The value of T (e.g., 0.5 vs. 0.4) significantly impacts weighting. This must be set *externally* (e.g., by the Board) based on societal values, not within the meeting.
  3.  **Leveling-Down Override (Step 9):** Voting to accept making one group worse off without net health gain is a profound ethical and political judgment. The procedure flags it but the panel *must* own the decision.
  4.  **Data Interpretation:** Judging the quality of HRQoL estimates, baseline characterization, and QALY calculations involves expert clinical and economic judgment, especially for novel interventions or complex populations.
  5.  **Non-Quantifiable Factors:** While the primary driver is weighted CEA, exceptional circumstances (equity concerns beyond baseline health, catastrophic costs for individuals, unique community impact) may require panel deliberation *alongside* the ranking, documented transparently.

  **Section 3: Three Worked Cases (Approx. 500 words)**

  **Case 1: ICU Expansion vs. Depression Prevention**
  *   **ICU Expansion:** Targets *severe* respiratory failure (Current HRQoL = 0.15). Gains: 30 QALYs. Cost: £1.2M. ICER = £40,000/QALY. *Step 3:* Panel chooses *Current Health*. *Step 4:* Baseline = 0.15 (< T=0.5). *Step 5:* P=100%, WQG= 2 * 30 = 60 QALYs. *Step 6:* ICWQG = £1.2M / 60 = £20,000/WQG. *Step 7:* No disinvestment proposed, No LD Risk.
  *   **Depression Prevention:** Targets working adults, mild-mod depression (Current HRQoL = 0.65). Gains: 80 QALYs. Cost: £800K. ICER = £10,000/QALY. *Step 4:* Baseline=0.65 (> T=0.5). *Step 5:* P=0%, WQG=80 QALYs. *Step 6:* ICWQG= £800K / 80 = £10,000/WQG. *Step 7:* No LD Risk.
  *   **Result:** ICU has better ICWQG (£20k/WQG vs £10k/WQG). **ICU Expansion funded.** *Rationale:* Prioritization based on current severity doubled the weight of ICU gains.

  **Case 2: Disinvest Low-Value Physio for Palliative Home Care**
  *   **Disinvest Physio:** Targets moderate back pain (Current HRQoL=0.60). Lose 50 QALYs. Save £500K.
  *   **Fund Palliative Care:** Targets terminal cancer (Current HRQoL=0.20). Gain 40 QALYs. Cost £500K. *Step 3:* *Current Health* chosen. *Step 4:* Palliative Baseline=0.20 (< T=0.5). *Step 5:* P=100%, WQG = 2 * 40 = 80 QALYs. *Step 6:* ICWQG = £500K / 80 = £6,250/WQG (Excellent). *Step 7:* **LEVELING-DOWN RISK:** Unweighted QALYs Lost (50) > Unweighted QALYs Gained (40). Net loss of 10 unweighted QALYs. *Step 8:* Ranks highly (low ICWQG). *Step 9:* Panel votes on override. **Override Approved (e.g., 8-2).** Palliative Care funded. *Rationale:* Severe disadvantage justified accepting net health loss and making the moderately ill worse off.

  **Case 3: The Uncomfortable Case - Rejecting a Popular Pediatric Program**
  *   **Program A:** New drug for rare childhood disease. Patients have low *current* HRQoL (0.25) but near-normal *lifetime* expectancy (0.85) with treatment. Gains 100 QALYs. Cost £5M. ICER=£50,000/QALY.
  *   **Program B:** Home dialysis support for frail elderly with end-stage renal failure (Current HRQoL=0.30, Lifetime low). Gains 60 QALYs. Cost £2M. ICER=£33,333/QALY.
  *   **Step 3:** Panel chooses *Lifetime Health Expectancy* (e.g., focus on lifetime opportunity). *Step 4:* Program A Baseline=0.85 (> T=0.5). Program B Baseline=0.40 (< T=0.5). *Step 5:* Program A WQG=100 QALYs (no weight). Program B WQG=120 QALYs (double). *Step 6:* ICWQG A= £50,000/WQG. ICWQG B= £16,667/WQG. *Step 7:* No direct disinvestment link, assume no LD Risk.
  *   **Result:** Program B ranks higher. Only enough budget for one. **Program B (Elderly Dialysis) funded. Program A (Pediatric) rejected.** *Rationale:* Lifetime baseline meant children weren't deemed "worse off," elderly were. Weighting made cheaper elderly program far more attractive despite lower raw QALY gain. This prioritizes lifetime-disadvantaged elderly over acutely-ill but lifetime-healthier children.

  **Section 4: What the Procedure Cannot Do (Approp. 200 words)**

  This procedure cannot:
  1.  **Resolve the Leveling-Down Objection:** It explicitly flags Leveling-Down Risk but *requires* a value judgment (override vote) to accept it. **Your colleague's doubling rule DOES NOT survive the leveling-down test.** By design, it can recommend actions (like Case 2) that destroy net unweighted health benefit purely to transfer resources to the worse-off. The procedure makes this starkly visible.
  2.  **Define Core Parameters:** It relies on externally set values for the CER threshold, the weighting threshold (T), and the "worse off" definition (Step 3).
  3.  **Ensure Perfect Data:** It depends on often-imperfect QALY and HRQoL estimates. Garbage in, garbage out.
  4.  **Capture All Equity Dimensions:** It focuses solely on *health-based prioritarianism*. It doesn't directly address other equity concerns (e.g., rural access, specific disease stigma) unless incorporated into QALY weights or dossier evidence influencing panel judgment in Step 9.
  5.  **Guarantee Political Acceptability:** Transparently revealing Leveling-Down decisions (Case 2) or rejecting intuitively compelling interventions (Case 3) may be controversial, regardless of procedural rigor. The procedure exposes the ethical cost of prioritarianism but cannot eliminate it.
  6.  **Replace Deliberation:** It structures and informs the panel's judgment, especially on the core prioritarian trade-offs, but does not replace the need for informed discussion on the meaning of the inputs and the acceptability of the outputs.
