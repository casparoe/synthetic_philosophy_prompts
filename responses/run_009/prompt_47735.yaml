answer: |-
  ## The Pasadena Paradox: Executioner of Expected Value or Technical Footnote?

  The Pasadena game isn't just a quirky puzzle; it exposes a profound fracture in the foundations of expected utility theory (EUT) for decisions under risk. It demonstrates that **expected value maximization, as classically defined via summation of probability-weighted utilities, is fundamentally incoherent when faced with infinite state spaces yielding conditionally convergent utility series.** This incoherence isn't merely "technical"; it strikes at the core of what we mean by "expected" value. However, while the paradox reveals a critical vulnerability in EUT, it doesn't necessitate its wholesale abandonment. A principled fix exists ("weak expectations"), and crucially, the structure of the Pasadena game is sufficiently pathological that it doesn't invalidate typical Expected Altruism (EA)-style calculations involving astronomically large payoffs and tiny probabilities.

  **Why Pasadena is a Fatal Blow to Classical EV for Conditionally Convergent Series**

  The heart of the paradox lies in the **conditional convergence** of the alternating harmonic series representing the expected value. The Riemann rearrangement theorem isn't a parlor trick; it's a mathematical sledgehammer showing that the sum lacks an intrinsic value. The "expected value" isn't merely undefined in the sense of being infinite (like St. Petersburg); it's *indeterminate*. Its value depends entirely on the arbitrary order in which we choose to sum the terms.

  1.  **No Canonical Ordering:** There is no "God-given" or decision-theoretically privileged order to sum the states of the world. Why should we sum states in the order n=1, n=2, n=3,...? Why not group positive terms first, then negative? Or use any other permutation? Each ordering yields a different "expected value" for the *identical* game. EUT asks us to maximize an expectation, but when the expectation itself is ordering-dependent, the theory loses its normative force. No principled argument establishes one summation order as canonical over others.
  2.  **Aggregation Constraints Fail:** Attempts to impose constraints (e.g., "only sum in state-index order") are ad hoc. They lack a foundation within decision theory itself. Why is state-index order privileged? What if the states weren't naturally indexed by n? Declaring the expectation "undefined" and refusing to choose is theoretically honest but practically paralyzing. It renders EUT silent on games like Pasadena, which is a significant failure for a theory meant to guide rational choice under uncertainty.
  3.  **The "Artifact" is the Problem:** Your observation that the value is "just an artifact of how you happen to write the series down" is precisely correct and devastating. Rational choice should depend on the structure of the gamble (probabilities and payoffs), not on the arbitrary syntactic presentation of the calculation. Pasadena proves that for conditionally convergent series, the classical EV *is* presentation-dependent.

  **The Principled Fix: Weak Expectations (Easwaran)**

  This is where Kenny Easwaran's concept of the **weak expectation** (or "Cesàro expectation") provides a compelling solution. The core idea is: **The value of a gamble can be defined by the almost-sure limit of the average payoff per play over infinitely many independent repetitions.**

  *   **How it Works for Pasadena:** Play the Pasadena game repeatedly. After `m` plays, calculate your average payoff (`total payoff / m`). Easwaran proves that as `m` approaches infinity, this average payoff converges almost surely (i.e., with probability 1) to a specific finite number: `ln(2)` ≈ $0.693.
  *   **Why it's Principled:**
      *   **Order-Invariance:** The limit exists and is unique *regardless* of how you sum the terms in the single-play expectation. It sidesteps the rearrangement problem entirely.
      *   **Operational Meaning:** It directly answers the practical question: "If I could play this game many times, what average payoff per play could I reliably expect in the long run?" This connects rationality to long-run success, a core justification for EUT.
      *   **Justifying Relevance for a Single Play:** You rightly ask why repeated play matters for a single decision. The answer lies in the *interpretation of probability and expectation*. Frequentists define probability via long-run frequencies. Subjective Bayesians often justify maximizing expected utility *because* it promotes long-run success (via Dutch book arguments or laws of large numbers). The weak expectation grounds the value of the single play in this fundamental connection between rational choice and long-run performance. If playing the game once is an option you might face repeatedly over a lifetime or across a population, the weak expectation provides the relevant stable value. Even for a single play, if we accept that rational expectations should align with what would happen in repeated trials (a common normative foundation), then the weak expectation is the consistent value to use. It rescues coherence by anchoring the expectation in a robust, observable limit.
      *   **Handles St. Petersburg Too:** The weak expectation for St. Petersburg diverges to infinity, consistent with its classical EV, demonstrating its generality.

  Weak expectation isn't ad hoc; it leverages the strong law of large numbers to provide a stable, ordering-independent value grounded in the gamble's inherent probabilistic structure. It's the natural extension of the frequentist intuition behind expectation to pathological cases.

  **Why EA-Style Calculations are (Generally) Safe**

  Your EA friend's worry is understandable but largely misplaced. EA calculations involving tiny probabilities of astronomical payoffs (e.g., preventing human extinction) are structurally different from Pasadena:

  1.  **No Alternating Signs:** EA payoffs are almost universally framed as *positive* utilities (saving lives, preventing suffering, enabling flourishing). There's no inherent cancellation mechanism like the alternating signs in Pasadena. The series is positive-term.
  2.  **Absolute Convergence (Typically):** For a positive-term series, conditional convergence implies absolute convergence (since absolute value is the term itself). If the EV sum converges conditionally for an EA scenario, it *must* converge absolutely. The Riemann rearrangement theorem doesn't apply – the sum is invariant under rearrangement. The "artifact of ordering" problem vanishes.
  3.  **Convergence is the Real Concern:** The valid concern for EA isn't Pasadena-like indeterminacy, but whether the infinite sum *converges at all*. St. Petersburg is the relevant cautionary tale. If the product `probability * utility` doesn't decrease fast enough as the potential payoff size increases, the sum can diverge. EA arguments must carefully justify that their specific sums converge (e.g., by showing the probability decays sufficiently rapidly relative to the utility growth). However, once convergence is established (even if to a finite number), the value is well-defined and ordering-invariant for positive payoffs.

  **The Verdict: EV Theory Survives, with a Necessary Amendment**

  1.  **Pasadena's Lesson:** The Pasadena game is a *real and significant counterexample* to the classical definition of expected value for gambles with infinite state spaces. It proves that classical EV is fundamentally incoherent when the utility series is conditionally convergent but not absolutely convergent. This is not a mere technical curiosity; it reveals a deep flaw in the standard formulation.
  2.  **The Required Fix:** Expected utility theory *can* survive, but **it must adopt the weak expectation (Cesàro expectation) as the definition of expected value for all gambles, replacing the simple infinite sum.** This provides a unique, ordering-invariant, and normatively grounded value (via its link to long-run performance) precisely where the classical definition fails. For gambles where the classical sum converges absolutely, the weak expectation agrees with it. For conditionally convergent sums like Pasadena, it provides the missing coherence. For divergent sums like St. Petersburg, it correctly identifies the expectation as infinite. Weak expectation is the necessary and principled generalization.
  3.  **Practical Relevance (Lack Thereof) for EA:** While a vital theoretical insight, the specific pathology of Pasadena (conditional convergence driven by alternating signs) is unlikely to plague realistic EA calculations focused on positive utilities. Their primary vigilance should be against St. Petersburg-style divergence, ensuring their probability-utility products sum to a finite value. The indeterminacy of Pasadena simply doesn't translate to their domain.

  **In Conclusion:** The Pasadena game executes the classical definition of expected value for conditionally convergent series. It forces us to recognize that simple summation is inadequate. However, by adopting the weak expectation – a value grounded in the almost-sure limit of long-run averages – decision theory regains coherence and normative force. This fix is principled, leveraging the fundamental connection between rational choice and long-run success inherent in justifications of EUT. While EA theorists must remain vigilant about convergence, they need not fear the specter of Pasadena; their calculations, focused on immense positive payoffs, are structurally immune to its specific brand of indeterminacy. The paradox is a powerful theoretical corrector, not a practical death knell for expected value reasoning in real-world high-stakes altruism. For your paper, defend weak expectations as the necessary and well-motivated solution that rescues EUT from Pasadena's trap.
