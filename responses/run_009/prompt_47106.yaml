prompt: |-
  I am a novelist, five books into a career, at work on a novel told entirely by animals: consecutive chapters narrated by a working dog, a pig in a truck bound for slaughter, a crow, an octopus, a migratory shorebird, and — most difficult of all — a beehive, which I have been trying to render as a single dispersed voice. In the practical business of pitching each voice, I have noticed a pattern I cannot name, and I would like to know whether the philosophers have.

  The nearer a creature's inner life is to being imaginable by me, the more readily my readers accept its chapter as an imaginative exercise — a rendering of something that is really there. The farther it is, the more the same act of narration starts to be read as either an admitted fabrication or a philosophical thesis. No one calls the dog chapter presumptuous; the octopus chapter is treated as though I have taken a stance. And when I defend the octopus, I catch myself arguing from my own imaginative failure, and in both directions at once: with the hive I say that I cannot imagine what it is like to be one, and then slide toward saying that perhaps there is nothing it is like; with the dog, my inability to imagine being a bat-like stranger does nothing at all to dent my certainty. The same slide seems to do enormous work in ordinary talk about animals: the worm, the fish, the shrimp are excluded from the circle of experience not by any evidence but by our inability to tell a story from inside them, while the dog is admitted purely on the strength of how much he resembles us.

  So: is there an established concept for this family of moves — the inference from imaginative intractability to experiential absence, and the gradient of attribution that runs, not along any line drawn by evidence about the animals themselves, but along the line of what we can narrate? I know Thomas Nagel's essay on what it is like to be a bat stands somewhere in this neighborhood, and I know the charge of anthropomorphism is routinely traded back and forth, but neither seems to name the specific thing I keep running into, which is the use of my own imaginative limits as evidence about which minds exist. If there is an established term, I want to know exactly what it covers, how it differs from its nearest neighbors, and which of those neighbors best fits what I have described; if there is none, then coin one, define it, and mark out its edges — what counts as an instance, what does not, and where the hardest boundary cases fall. I am not collecting a label. I am four hundred pages from a decision about whether the hive speaks in the first person plural, and I need to understand precisely what I am doing when I give the pig a voice and deny one to the lobster.
reasoning: |-
  Okay, this novelist is wrestling with a fascinating philosophical problem tied to their animal-narrated novel. They've noticed a pattern where readers accept narrators like dogs (close to human experience) as imaginative exercises, but distant minds like octopuses or beehives get interpreted as either fiction or philosophical statements. The core issue is how people infer the existence of inner experience based on how easily they can imagine it—what they call "the inference from imaginative intractability to experiential absence."

  They're explicitly referencing Thomas Nagel's "What Is It Like to Be a Bat?" but feel it doesn't fully capture this phenomenon. They need precision because their narrative choices (like whether the hive uses "we") depend on understanding this mechanism. The urgency is palpable—they're 400 pages deep and need clarity for creative decisions.

  Hmm, the key elements here are: the gradient of attribution (dog vs. octopus), the epistemic slide (from "I can't imagine this" to "this doesn't exist"), and the reliance on narratability as evidence. Existing terms like anthropomorphism or Nagel's bat seem adjacent but not exact fits. 

  First, I should verify if philosophy has a direct term for this. Searches in epistemology of mind and philosophy of consciousness come to mind. The "hard problem" of consciousness (Chalmers) is related but too broad. "Cognitive closure" (McGinn) describes limits of human understanding but doesn't address the inference to nonexistence. Ah! "Epistemic injustice" (Fricker) applied to non-humans—closer, but focused on credibility, not imagination-based ontology.

  The novelist’s observation about narrative feasibility determining moral consideration echoes in animal ethics (Singer's argument from marginal cases), but that's about ethics, not ontology. The imaginative failure-as-evidence move smells of verificationism—like claiming "if I can't conceive it, it's meaningless"—but applied to consciousness rather than language.

  Breaking it down: the novelist identifies two distinct but linked moves: (1) Equating unimaginability with nonexistence (the octopus/hive case), and (2) Grading consciousness by resemblance-to-human-narratability (the dog/worm spectrum). The first is an epistemic fallacy; the second is anthropocentric bias. Philosophy likely has separate critiques for these. For (1), the fallacy resembles a false dilemma (either human-like consciousness or none), ignoring spectrum possibilities. For (2), it's classic anthropocentric projection with narrative as the metric.

  Coining a term feels necessary here. "Narratability heuristic"? "Imaginative verificationism"? The novelist’s own phrase "the gradient of attribution" is sharp. Maybe "experiential anthropofabulation"—fusing fabrication and anthropocentrism. But the clearest might be "the narrative accessibility criterion," defined as: the tendency to ascribe consciousness based on the ease of constructing a subjectively coherent narrative for that entity, disproportionately favoring cognitively human-like traits. 

  Boundaries: It wouldn't apply to entities we *can* narrate but have evidence against consciousness (e.g., chatbots), nor to unimaginable but empirically confirmed minds (e.g., severe dementia). The hardest cases are AI (easily narrated but arguably non-conscious) or aliens (potentially unimaginable but conscious). For the novelist’s practical need, the hive's "we" becomes defensible if framed as rejecting this criterion—making the narrative itself a critique of the fallacy. The lobster denied voice? That's where the bias bites hardest. Time to synthesize.
answer: |-
  Your observation cuts to the heart of a profound epistemological and phenomenological problem in consciousness studies. Philosophers *have* grappled with this pattern, though no single term perfectly captures its full structure. Let's dissect the components and situate them within established discourse:

  ### The Core Pattern & Its Philosophical Neighbors
  1. **The Inference from Imaginative Failure to Ontological Absence**:  
     This is a form of **Verificationist Fallacy** or **Cognitive Projection Bias**. You infer the *nonexistence* of an experience ("there is nothing it is like") from the *inaccessibility* of that experience to your imagination. Thomas Nagel's "What Is It Like to Be a Bat?" (1974) explicitly rejects this move: Nagel argues that bat sonar experience is real but *inconceivable* to humans. Your "slide" mirrors a common error Nagel warns against: conflating **epistemic limitation** (we can't know/describe it) with **ontological negation** (it doesn't exist). Daniel Dennett critiques this as the **"Intuition Pump"**—mistaking imaginative resistance for metaphysical insight.

  2. **The Gradient of Attribution via Narratability**:  
     This maps to **Anthropocentric Continuity Bias**. Attributions of consciousness correlate not with evidence (e.g., neural complexity, behavioral flexibility) but with **phenomenological proximity to human experience**. Wittgenstein hinted at this: "If a lion could talk, we could not understand him." The more an entity's perceived inner life resists human narrative conventions (linear time, individual agency, emotion-as-we-know-it), the more readers interpret narration as "fabrication" rather than "discovery." Val Plumwood called this **"Human-Nature Dualism"**—the tendency to exclude the "radically other" from ethical consideration.

  ### The Missing Term: **Narratability Heuristic**
  While philosophy lacks a unified label, your description demands one. I propose:  
  **Narratability Heuristic**  
  *n.* The cognitive bias whereby the ascription of subjective experience to an entity is determined by the ease with which a human can construct a first-person narrative simulating its putative inner life, with diminishing attribution correlating to imaginative intractability, often mistaken for evidence of experiential absence.

  #### Key Features:
  - **Mechanism**: Uses *narrative feasibility* as a proxy for *consciousness attribution*.  
  - **Error**: Conflates *representational challenge* (how hard it is to tell the story) with *ontological status* (whether there's a story to tell).  
  - **Gradient**: Operates on a spectrum from "human-like" (dog: readily narratable → consciousness assumed) to "alien" (hive: narratively disorienting → consciousness doubted).  

  #### Boundaries & Distinctions:
  - **≠ Anthropomorphism**:  
    Anthropomorphism *attributes* human traits to non-humans. The Narratability Heuristic explains *why* we anthropomorphize some entities (dogs) but not others (bees): it’s the threshold where imaginative effort triggers dismissal rather than projection.  
  - **≠ Nagel's Bat**:  
    Nagel denies imaginative access but affirms bat consciousness. Your heuristic describes the *inverse*: using imaginative failure to *deny* consciousness.  
  - **≠ Theory of Mind (ToM)**:  
    ToM is about inferring beliefs/intentions. The heuristic is about the *withholding* of ToM based on narrative difficulty.  
  - **Hard Cases**:  
    - **AI**: Easily "narrated" (e.g., chatbots) but consciousness disputed.  
    - **Plants**: Evidence of complex signaling, but narratability near-zero → consciousness rarely attributed.  
    - **Hive Mind**: Your central challenge. A "dispersed voice" resists singular agency—the heuristic pushes readers to see it as metaphor, not reportage.  

  ### Why the Hive Matters
  The beehive forces confrontation with the heuristic’s limits. A honeybee colony exhibits **collective intelligence** (e.g., quorum sensing, distributed memory) but lacks a centralized "self." Narrating it as "we" risks anthropocentrism; not narrating it surrenders to the heuristic. Philosophers of mind like Peter Godfrey-Smith (*Other Minds*, 2016) argue octopuses (decentralized cognition) challenge the "singular self" model. Likewise, the hive’s "voice" could be:  
  - **A Rejection of the Heuristic**: Using plural narration to force readers past narratability bias.  
  - **A Meta-Commentary**: Exposing how human narrative conventions limit our ethical imagination.  

  ### Practical Path Forward
  1. **Name the Heuristic in Your Text**:  
     Have a character (the crow?) articulate the fallacy: *"You deem us mindless when your stories falter."*  
  2. **Narrate the Hive as "We"**:  
     Lean into the disorientation. Use fragmented, polyphonic prose (e.g., chorus-like vignettes) to simulate distributed consciousness. The very discomfort it causes readers becomes the point.  
  3. **Deny the Lobster a Voice Precisely to Expose the Bias**:  
     Add an interlude where a human character *assumes* the lobster has no inner life because "who could speak for it?"—then show its silent, alien awareness through behavior.  

  Your project reveals a truth philosophy often obscures: **narrative isn't just how we represent minds—it's how we legislate which minds count.** The "Narratability Heuristic" isn't merely a bias; it's the machinery by which empathy is rationed. To write the hive is to dismantle that machinery.
