  ### Adjudication of the Two-Envelope Paradox Dispute

  I will address the dispute step by step, following your structure: (a) the flaw in the first friend's argument, (b) verification and explanation of the second friend's conditional computation, (c) evaluation of the three morals, and (d) adjudication of the conclusion regarding expected-value maximization. Where relevant, I will invoke and state theorems of probability precisely.

  #### (a) Where the First Argument Goes Wrong, Why the Offending Step Looked Unobjectionable, and the Cost of Rejecting It

  The first friend's argument fails at step (3): "Since the envelopes were assigned by a fair coin, each of these is equally likely." Specifically, the claim that, upon observing amount \(A\) in your envelope, the other envelope contains \(2A\) or \(A/2\) with equal probability (each \(1/2\)) is incorrect for all possible values of \(A\) simultaneously, given a proper prior distribution of the smaller amount.

  **Why it goes wrong:**
  - Let \(S\) denote the smaller amount in the pair of envelopes. Then, with probability \(1/2\), you have the smaller envelope (\(A = S\)) and the other contains \(2S = 2A\). With probability \(1/2\), you have the larger envelope (\(A = 2S\)) and the other contains \(S = A/2\).
  - After observing \(A = a\), the conditional probabilities depend on the prior distribution of \(S\). Using Bayes' theorem:
    - Let \(f(s)\) be the probability density function (PDF) of \(S\) (assuming continuity for simplicity; discrete cases are analogous).
    - The probability density of observing \(A = a\) is:
      \[
      g(a) = \frac{1}{2} f(a) + \frac{1}{4} f(a/2)
      \]
    - The conditional probability that you have the smaller envelope (so the other contains \(2A\)) is:
      \[
      P(\text{smaller} \mid A = a) = \frac{\frac{1}{2} f(a)}{g(a)}
      \]
    - The conditional probability that you have the larger envelope (so the other contains \(A/2\)) is:
      \[
      P(\text{larger} \mid A = a) = \frac{\frac{1}{4} f(a/2)}{g(a)}
      \]
  - For \(P(\text{smaller} \mid A = a) = P(\text{larger} \mid A = a) = 1/2\) to hold for all \(a\), we need \(\frac{1}{2} f(a) = \frac{1}{4} f(a/2)\) for all \(a\), which simplifies to \(f(a/2) = 2 f(a)\). This functional equation has no solution for a proper probability distribution because it implies \(f(a) \to \infty\) as \(a \to 0\) and \(f(a) \to 0\) as \(a \to \infty\), violating integrability (i.e., \(\int_0^\infty f(s)  ds = 1\) cannot hold). For example, if \(f(a) \propto 1/a\), the PDF is improper (infinite integral).

  **Why it looked unobjectionable:**
  - The fair coin assignment suggests symmetry: unconditionally, you are equally likely to have the smaller or larger envelope. This intuition mistakenly assumes that the symmetry holds conditionally for every observed \(A\), ignoring that \(A\) is a random variable whose value correlates with the state (smaller or larger) in a way that depends on the distribution of \(S\). The argument appears plausible because it isolates the observation step from the prior distribution, creating an illusion of equiprobability.

  **Cost of rejecting it:**
  - Rejecting step (3) means we cannot compute expected values or make switching decisions without specifying the prior distribution of \(S\). The expectation \(E[\text{other} \mid A]\) becomes distribution-dependent, and there is no universal rule that switching is always beneficial. This complicates the argument by requiring Bayesian reasoning with a known or assumed prior, rather than a simple, distribution-free rationale.

  #### (b) Verification of the Second Friend's Conditional Computation and Explanation of the Failure from Conditional to Unconditional

  **Verification of the conditional computation:**
  The second friend's setup: Envelope pairs contain \((2^n, 2^{n+1})\) dollars for \(n = 1, 2, 3, \ldots\), with pair \(n\) selected with probability \(p_n = \frac{1}{3} \left(\frac{2}{3}\right)^{n-1}\). The envelopes are assigned via a fair coin. We verify the conditional probabilities and expectation given an observed amount \(A = 2^k\).

  - **For \(k \geq 2\):**
    - Observing \(A = 2^k\) can occur in two mutually exclusive ways:
      1. You have the smaller envelope of pair \(k\): Probability \(P(\text{pair } k) \cdot P(\text{pick smaller}) = \left[\frac{1}{3} \left(\frac{2}{3}\right)^{k-1}\right] \cdot \frac{1}{2} = \frac{1}{6} \left(\frac{2}{3}\right)^{k-1}\).
      2. You have the larger envelope of pair \(k-1\): Probability \(P(\text{pair } k-1) \cdot P(\text{pick larger}) = \left[\frac{1}{3} \left(\frac{2}{3}\right)^{k-2}\right] \cdot \frac{1}{2} = \frac{1}{6} \left(\frac{2}{3}\right)^{k-2}\).
    - Total probability of observing \(A = 2^k\):
      \[
      P(A = 2^k) = \frac{1}{6} \left(\frac{2}{3}\right)^{k-1} + \frac{1}{6} \left(\frac{2}{3}\right)^{k-2} = \frac{1}{6} \left(\frac{2}{3}\right)^{k-2} \left(\frac{2}{3} + 1\right) = \frac{1}{6} \left(\frac{2}{3}\right)^{k-2} \cdot \frac{5}{3} = \frac{5}{18} \left(\frac{2}{3}\right)^{k-2}.
      \]
    - Conditional probability that you have the smaller envelope (so other envelope has \(2^{k+1}\)):
      \[
      P(\text{smaller} \mid A = 2^k) = \frac{P(\text{smaller of pair } k \text{ and } A = 2^k)}{P(A = 2^k)} = \frac{\frac{1}{6} \left(\frac{2}{3}\right)^{k-1}}{\frac{5}{18} \left(\frac{2}{3}\right)^{k-2}} = \frac{\frac{1}{6} \cdot \frac{2}{3} \left(\frac{2}{3}\right)^{k-2} \cdot \frac{3}{2}}{\frac{5}{18} \left(\frac{2}{3}\right)^{k-2}} = \frac{\frac{1}{9}}{\frac{5}{18}} = \frac{1}{9} \cdot \frac{18}{5} = \frac{2}{5}.
      \]
    - Conditional probability that you have the larger envelope (so other envelope has \(2^{k-1}\)):
      \[
      P(\text{larger} \mid A = 2^k) = \frac{P(\text{larger of pair } k-1 \text{ and } A = 2^k)}{P(A = 2^k)} = \frac{\frac{1}{6} \left(\frac{2}{3}\right)^{k-2}}{\frac{5}{18} \left(\frac{2}{3}\right)^{k-2}} = \frac{\frac{1}{6}}{\frac{5}{18}} = \frac{1}{6} \cdot \frac{18}{5} = \frac{3}{5}.
      \]
    - Expected value of the other envelope given \(A = 2^k\):
      \[
      E[\text{other} \mid A = 2^k] = \frac{2}{5} \cdot 2^{k+1} + \frac{3}{5} \cdot 2^{k-1} = \frac{2}{5} \cdot 2 \cdot 2^k + \frac{3}{5} \cdot \frac{1}{2} \cdot 2^k = \frac{4}{5} \cdot 2^k + \frac{3}{10} \cdot 2^k = \left(\frac{8}{10} + \frac{3}{10}\right) 2^k = \frac{11}{10} \cdot 2^k = \frac{11}{10} A.
      \]
    Since \(\frac{11}{10} A > A\), switching is favorable.

  - **For \(k = 1\) (observing \(A = 2\)):**
    - Only possible if you have the smaller envelope of pair 1 (since there is no pair 0). Thus:
      \[
      P(A = 2) = P(\text{pair } 1) \cdot P(\text{pick smaller}) = \frac{1}{3} \cdot \frac{1}{2} = \frac{1}{6}.
      \]
      \[
      P(\text{other} = 4 \mid A = 2) = 1, \quad E[\text{other} \mid A = 2] = 4 = 2A > A.
      \]
    Switching is favorable.

  Thus, the conditional computation is correct: for every possible observation, \(E[\text{other} \mid A] > A\), with probabilities not equal to \(1/2\) (e.g., \(2/5\) and \(3/5\) for \(k \geq 2\)).

  **How switching can be favorable conditional on every observation despite symmetry:**
  - The envelopes are symmetric unconditionally: \(P(\text{you have smaller}) = P(\text{you have larger}) = 1/2\), and the joint distribution of the amounts is symmetric, so \(E[A] = E[\text{other}]\). However, conditional on observing \(A = a\), the symmetry is broken due to the prior distribution of \(S\). Here, the distribution of \(S\) (smaller amount) is heavy-tailed, making larger values less likely in a way that biases the conditional expectation upward for every observed \(a\).

  **Failure when passing from conditional to unconditional:**
  - Although \(E[\text{other} \mid A] > A\) for every possible \(A\), this does not imply \(E[\text{other}] > E[A]\) unconditionally. The reason is that \(E[A] = \infty\) and \(E[\text{other}] = \infty\), so the unconditional expectations are infinite and not comparable. Specifically:
    - \(E[A] = \sum_{n=1}^\infty E[A \mid \text{pair } n] P(\text{pair } n) = \sum_{n=1}^\infty \left( \frac{1}{2} \cdot 2^n + \frac{1}{2} \cdot 2^{n+1} \right) \cdot \frac{1}{3} \left(\frac{2}{3}\right)^{n-1} = \sum_{n=1}^\infty \left( 2^{n-1} + 2^n \right) \cdot \frac{1}{3} \left(\frac{2}{3}\right)^{n-1}\).
      Simplifying, the series involves \(\sum_{n=1}^\infty \left(\frac{4}{3}\right)^n\) or similar terms with \(\left|\frac{4}{3}\right| > 1\), so it diverges to infinity. Similarly for \(E[\text{other}]\).
  - By symmetry, \(E[\text{other} - A] = 0\), but \(E[E[\text{other} - A \mid A]] = E[E[\text{other} \mid A] - A] > 0\) (since \(E[\text{other} \mid A] - A > 0\) for all \(A\)). This seems contradictory, but it fails because the law of total expectation requires finite absolute expectations to hold:
    - **Law of Total Expectation (LTE):** If \(E[|X|] < \infty\), then \(E[E[X \mid Y]] = E[X]\). (A standard theorem; see, e.g., Billingsley, *Probability and Measure*.)
    - Here, \(X = \text{other} - A\). But \(E[|X|] = E[|\text{other} - A|] \geq E[A] - E[\text{other}]\) is undefined (both \(E[A]\) and \(E[\text{other}]\) are infinite), so LTE does not apply. Thus, \(E[E[\text{other} \mid A]] \neq E[\text{other}]\) in a meaningful way.
  - The failure occurs because infinite expectations prevent the conditional inequalities from aggregating to an unconditional inequality. Unconditionally, \(E[\text{other}] = E[A]\), so there is no expected gain from switching without observation.

  #### (c) Evaluation of the Three Morals

  **Moral (i):** "In this setup, 'switch, whatever you see' is correct at every observation... so the standard diagnosis does not touch the real phenomenon."  
  - **Evaluation:** Correct. The conditional probabilities (e.g., \(2/5\) and \(3/5\)) are not \(1/2\), and \(E[\text{other} \mid A] > A\) for every \(A\), so switching is always favored after opening. The standard diagnosis (rejecting equal probabilities) does not resolve this, as the issue persists with unequal probabilities favoring switching.

  **Moral (ii):** "Since switching is favored conditional on every possible observation, it is favored outright, and you should switch without opening."  
  - **Evaluation:** Incorrect. The move from conditional to unconditional fails because \(E[A] = \infty\), so \(E[\text{other} \mid A] > A\) for all \(A\) does not imply \(E[\text{other}] > E[A]\). Unconditionally, the envelopes are symmetric, so \(E[\text{other}] = E[A] = \infty\), and switching without opening yields no expected gain. Moreover, the strategy "switch without opening" has expected value equal to that of keeping your envelope, so it is not strictly favored. The error is in applying conditional reasoning to an unconditional decision without finite expectations.

  **Moral (iii):** "If, after switching, you open the new envelope, the same computation favors switching back... so the pump is real and not an artifact of bad probabilities."  
  - **Evaluation:** Partially correct but misleading.  
    - The pump (switching back and forth) is "real" in the sense that at each step, conditional on the observed amount, the expected value of switching is higher (e.g., by 10% for \(k \geq 2\)). This is not an artifact; it arises from the specific prior distribution.  
    - However, the pump does not yield actual expected gain because:
      - After switching, you hold the other envelope, and reopening it provides new information, leading to a new conditional expectation. But since the envelopes are fixed, repeated switching between them does not change their values. The expected gain from each switch is positive conditionally but undefined unconditionally (\(E[\text{gain}] = 0\), but \(E[| \text{gain} |] = \infty\)).
      - For example, start with envelope X containing \(A\), switch to Y with expected gain \(E[Y - X \mid X] > 0\). Now holding Y, observe \(B\), and \(E[X - Y \mid Y] > 0\), so switching back seems beneficial. But after two switches, you return to X, with no net change. The conditional gains are real given the information at each step, but the pump is incoherent as a long-term strategy because it suggests infinite gain from finite resources.
    - The moral correctly notes that the pump is not due to illicit probabilities, but it ignores that the expected value "increase" is conditional and not realizable.

  #### (d) Adjudication of the Conclusion that Expected-Value Maximization is Incoherent

  The conclusion that "maximizing expected value is not a coherent requirement of rationality" does not survive intact. Expected-value maximization (EVM) is coherent under standard conditions, but the paradox highlights limitations with unbounded utility or infinite expectations.

  - **In finite cases:** If the smaller amount \(S\) has a bounded distribution with finite expectation (e.g., \(S\) uniform on \([1, 2]\)), then \(E[A] < \infty\), and LTE applies. In such cases, \(E[\text{other} \mid A]\) may not exceed \(A\) for all \(A\) (it depends on the prior), and switching may not be beneficial. EVM is coherent and avoids contradictions.
    
  - **In infinite cases:** When \(E[A] = \infty\), as in the second friend's setup, EVM can lead to apparent paradoxes because:
    - Conditional EVM may always favor switching, but unconditional EVM shows no gain.
    - The pump arises because conditional EVM is myopic; it ignores that the envelopes are symmetric and fixed.
    - However, this does not make EVM incoherent—it means that EVM must be applied carefully with unbounded random variables. Rational agents can still use conditional EVM for decisions given information, but they should recognize that unconditional comparisons may be invalid.

  **What survives:**
  - The first friend's argument correctly identifies an absurdity (infinite swapping) but misattributes it to EVM incoherence. The error is in step (3), not in EVM itself.
  - The second friend's setup shows that with infinite expectations, conditional EVM can persistently favor switching without contradiction, due to the failure of LTE. However, EVM remains a valid decision rule if expectations are finite or if the decision context is properly conditioned.
  - Overall, EVM is not incoherent; rather, the paradox underscores that:
    - EVM requires finite expectations for unconditional comparisons.
    - Bayesian updating with the correct prior is essential for conditional decisions.
    - In cases with infinite expectations, rationality might incorporate additional criteria (e.g., avoiding dominated strategies), but EVM can still guide conditional choices.

  In summary, expected-value maximization is coherent and rational when applied to decisions with finite expectations. The two-envelope paradox serves as a cautionary example about the importance of specifying priors and handling infinite expectations carefully, but it does not undermine EVM as a principle.
