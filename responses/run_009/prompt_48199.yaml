prompt: |-
  I'm a retired physicist; for most of my career I worked in a metrology and instrument-calibration group, and a recurring duty was helping younger engineers turn vague ignorance into numbers. The house style, inherited from nobody in particular, was: if all you know is that a quantity lies between two bounds, call it uniform on the interval and propagate. Since retiring I have been reading philosophy of probability, and I've discovered that this habit sits on top of something much murkier than we ever admitted. The old "principle of indifference" — assign equal probabilities when you have no reason to prefer one value over another — turns out to depend on what quantity you spread your ignorance over: uniform in a resistance is not uniform in conductance, uniform in a radius is not uniform in the area, and there's the notorious business with the random chord of a circle where equally natural ways of being "random" give different probabilities for the same event. I've also gathered that there are ideas floating around for repairing this — invariance under reparameterization, transformation groups, picking the parameterization with the most natural symmetry — but I've never seen any of it written for someone with ten minutes and a specification sheet rather than an afternoon and a treatise.

  What I'd like from you is a decision procedure my former colleagues could actually follow before invoking uniform-in-the-interval. Concretely: an ordered list of questions to ask about a given problem — things like whether the bounds are hard physical limits or just spec-sheet convention, whether there's a natural reparameterization, whether anyone downstream of the number will make a decision whose cost is asymmetric — with, for each question, what counts as a clean answer, where a clean answer of the wrong kind should stop the procedure and send them back for more data rather than to a prior, and where the question is a genuine judgment call that no procedure can absorb (please mark those honestly rather than laundering them as steps). It should handle the hard cases explicitly: the situation where two competent engineers parameterize the same unknown differently and arrive at different failure probabilities, and the situation where indifference is being asked to do the work of a physical model because nobody measured anything. Then run the procedure on two worked examples: an unknown resistance known only from manufacturer tolerance bounds, where the choice between uniform-in-R and uniform-in-1/R changes the answer; and a shaft diameter known only within a machining tolerance, where what the customer actually cares about is the cross-sectional area. I'd especially like one of the worked examples to end somewhere the engineer won't like — where the honest output of the procedure is "your stated interval does not determine a probability, and pretending otherwise is the mistake" — and a closing statement of what the procedure cannot do, i.e., whether any such checklist can actually dissolve the reparameterization problem or only tell you when you're about to step in it.
reasoning: |-
  Okay, let me start by really understanding what this retired physicist is asking for. They spent their career in metrology, helping engineers turn vague knowledge into numbers using uniform priors. Now, they've discovered the philosophical problems with the principle of indifference, especially reparameterization issues like uniform resistance vs. conductance leading to different results. 

  The user wants a practical decision procedure—a checklist—for their former colleagues to use before defaulting to a uniform prior. The key points are handling cases where different parameterizations give conflicting results and situations with no data. They also want two worked examples: one with resistance and conductance, another with shaft diameter and area, where one example ends with "you can't do this."

  First, I need to outline the core problems: reparameterization paradoxes (like Bertrand's paradox), the difference between epistemic (knowledge-based) and physical probabilities, and consequences of wrong priors affecting decisions. The checklist must guide users to recognize when a uniform prior is appropriate or not.

  The user emphasized marking judgment calls honestly. So, the procedure should include steps where engineers must make decisions based on context, not hide uncertainties. Also, stopping points where more data is needed instead of forcing a prior.

  For the resistance example: Manufacturer gives tolerance bounds for resistance R. Uniform in R vs. uniform in conductance G=1/R leads to different posterior distributions. The checklist should identify this as a reparameterization issue. If there's no natural parameter (like conductance being physically meaningful), it might stop and say the interval alone isn't sufficient.

  For the shaft diameter: Known machining tolerance, but the critical parameter is cross-sectional area A=πr². Uniform in diameter vs. radius vs. area gives different results. If the customer's cost depends on area (e.g., torque capacity), that asymmetry should guide the parameter choice. If not, it's a judgment call or requires more data.

  The challenge is balancing practicality with philosophical rigor. Engineers need clear steps, but the procedure mustn't oversimplify. The "can't do" conclusion in one example highlights limitations—sometimes intervals alone don't determine probabilities.

  Also, considering downstream decisions: If costs are asymmetric (e.g., underestimating area risks failure), that affects the prior choice. But if there's no such information, the procedure should flag it as unresolved.

  Need to structure the checklist as ordered questions, each with clean answers, stopping points, and judgment calls. For example:
  1. Are bounds physical limits or specifications? Physical limits might justify hard bounds, specs might not.
  2. Natural parameterization? Like resistance vs. conductance in circuits.
  3. Downstream decisions? Cost asymmetry should influence the parameter choice.

  Worked examples must show where the procedure works and where it halts. The resistance example could end with needing more data because neither R nor G is inherently better without context. The shaft example might use area if cost asymmetry is present.

  Finally, the conclusion should state that no procedure can fully resolve reparameterization; it only flags when the choice matters and prevents unthinking uniform defaults.
answer: |-
  Below is a practical decision procedure for metrology/instrumentation engineers facing uncertainty quantification—designed to flag reparameterization risks, judgment calls, and "no-go" scenarios **before** defaulting to a uniform prior. It prioritizes epistemic honesty over computational convenience. 

  ---

  ### **Decision Procedure: "Should I Use a Uniform Prior?" Checklist**
  *Ask these questions in order. Stop if any answer triggers a "Halt" or "Judgment Call."*

  1. **Are the bounds physical limits or specification conventions?**  
     - *Clean answer (Physical):* Hard limits (e.g., voltage beyond ±5V destroys the circuit). → **Proceed to Q2.**  
     - *Clean answer (Spec):* Manufacturer tolerance (e.g., resistor ±10%). → **Proceed to Q2.**  
     - *Unclear:* "I think it’s physical, but I’m not sure." → **Halt: Get confirmation.**  
     *Why:* Physical bounds *might* justify hard truncation; spec bounds rarely do.

  2. **Is there a natural parameterization for the quantity?**  
     - *Clean answer (Yes):* Parameter tied to physics or application (e.g., resistance in Ohm’s law, conductance in parallel circuits). → **Proceed to Q3.**  
     - *Clean answer (No):* No obvious preferred variable (e.g., "diameter" vs. "radius" for aesthetics). → **Judgment Call (see notes).**  
     *Why:* Breaks symmetry. If physics/application dictates a "natural" variable (e.g., voltage drop depends on *R*, not *1/R*), use it.

  3. **Does a downstream decision depend asymmetrically on errors?**  
     - *Clean answer (Yes):* Cost of over/underestimation differs (e.g., underestimating shaft strength causes failure; overestimating wastes material). → **Use parameterization that aligns with cost function.**  
     - *Clean answer (No):* Symmetric cost (e.g., academic estimate). → **Proceed to Q4.**  
     *Why:* Practical consequences trump mathematical convenience.

  4. **Can you reparameterize the problem in ≥2 equally natural ways?**  
     - *Clean answer (No):* Only one natural parameter exists. → **Assign uniform prior to that parameter.**  
     - *Clean answer (Yes):* Multiple valid options (e.g., *R* vs. *1/R*; diameter vs. area). → **Halt: Uniform prior invalid.**  
     *Why:* Reparameterization paradox detected. No unique uniform distribution.

  5. **Is the interval based on actual measurements or pure ignorance?**  
     - *Clean answer (Measurements):* Data exists (even sparse). → **Use max-entropy prior given constraints.**  
     - *Clean answer (Ignorance):* Only bounds are known. → **Halt: Uniform prior unjustifiable.**  
     *Why:* True ignorance + reparameterization risk = no rigorous prior. More data needed.

  ---

  ### **Handling the Hard Cases Explicitly**
  - **Case 1: Two engineers parameterize differently → different failure probabilities.**  
    This triggers **Q4 (Yes)**. Outcome: **Halt**. The disagreement reveals a reparameterization paradox. Resolution requires:  
    (a) Physics-based justification for one parameterization (Q2),  
    (b) Cost-asymmetry analysis (Q3), or  
    (c) More data (Q5).  
    *Do not* proceed with uniform prior.  

  - **Case 2: Indifference substituting for a physical model.**  
    This triggers **Q5 (Ignorance)**. Outcome: **Halt**. Uniform priors cannot compensate for missing physics. Alternatives:  
    - Bound analysis (min/max values only),  
    - Robust design (assume worst case),  
    - Measure the damn thing.

  ---

  ### **Worked Examples**
  #### **Example 1: Unknown Resistance (Manufacturer Tolerance)**  
  - **Given:** *R* = 100 Ω ± 10% (90 Ω to 110 Ω).  
  - **Q1:** *Spec convention* (tolerance). → Proceed.  
  - **Q2:** *Natural parameterization?* Resistance (*R*) is natural for series circuits; conductance (*G*=1/*R*) for parallel. Both are physically valid. → **Judgment Call** (if circuit context unknown). Assume no context: → Proceed to Q3.  
  - **Q3:** *Asymmetric cost?* Unspecified. Assume symmetric → Proceed to Q4.  
  - **Q4:** *Reparameterizable?* Yes (*R* vs. *G*). Uniform in *R* gives different failure probabilities than uniform in *G*. → **Halt: Uniform prior invalid.**  
  - **Output:** *"Your tolerance interval does not determine a probability distribution. State bounds only or gather circuit-context data."*  

  #### **Example 2: Shaft Diameter (Machining Tolerance)**  
  - **Given:** Diameter *d* = 10.0 mm ± 0.1 mm (9.9–10.1 mm). Customer cares about cross-sectional area *A* = *π*(*d*/2)².  
  - **Q1:** *Spec convention* (machining tolerance). → Proceed.  
  - **Q2:** *Natural parameterization?* Customer needs *A*. → **Use *A*.**  
  - **Q3:** *Asymmetric cost?* Likely yes (undersized *A* → shaft failure; oversized → material waste). → **Propagate uncertainty in *A* to cost function.**  
  - **Procedure:** Assign uniform prior to *d* (natural for machining), propagate to *A* via *A*(*d*) = *πd*²/4, then apply cost asymmetry to *A*-distribution.  
  - **Output:** Distribution for *A* (mean ≈78.54 mm², bounds 76.99–80.12 mm²) with cost-weighted risk analysis.  

  ---

  ### **What This Procedure Cannot Do**  
  1. **Resolve deep reparameterization paradoxes** (e.g., Bertrand’s chord). It only *flags* them (Q4) and forces context (Q2/Q3) or data (Q5).  
  2. **Replace domain knowledge.** Judgment calls (Q2) require engineering intuition.  
  3. **Generate probabilities from pure ignorance.** It rejects "interval → uniform" as a universal rule (Q4/Q5 halts).  
  4. **Guarantee consensus.** Two experts may validly disagree on "natural" parameters (Q2).  

  ### **Closing Statement**  
  This procedure doesn’t "solve" the reparameterization problem—it **dissolves the illusion** that uniform priors are a safe default. By forcing explicit consideration of physics, costs, and ignorance, it replaces algorithmic indifference with accountable engineering judgment. The output isn’t always a number; sometimes it’s the hard truth: *"This interval is not a probability distribution. Do better."* That is the metrologist’s duty.  

  ---  
  **Final note for your colleagues:** When Q4/Q5 halt, use interval arithmetic or min/max bounds in downstream calculations. No probabilities > no *wrong* probabilities.
