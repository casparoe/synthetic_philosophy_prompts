prompt: |-
  I'm on the claims-causation subcommittee at a mid-size property insurer. Whenever a loss could plausibly be pinned on more than one thing, we have to rule on what "caused the loss," becuase the policy wordings hang coverage on that exact phrase. From the case files I could pull, our rulings so far:

  1. Arson, straightforward: warehouse torched, total loss. Ruled: the arson caused the loss.
  2. Two seperate fires, each on its own big enough to destroy the warehouse — one from a tenant's space heater, one that spread from the building next door — merged on the way in. Ruled: both fires caused the loss, liability shared between the two policies.
  3. An electrical fault burned the place down on the Tuesday. It later came out that a developer had already paid an arsonist to torch it that Wednesday, and the arsonist would have gone through with it. Ruled: the fault caused the loss; the never-executed arson isn't a cause of anything, and the fact that it was planned doesn't weaken the fault's causal status.
  4. Kitchen fire, the kind a working sprinkler system would have snuffed out. The maintenance contractor had let the suppression system sit dead for months, in breach of contract. Ruled: the lapse caused the loss, and so did the fire.
  5. Same kind of kitchen fire, but this warehouse predated the sprinkler code and the owner had simply never installed any — no duty to. Ruled: the absence of sprinklers didn't cause the loss; the fire is the sole cause.

  Now before us: lightning hits the roof. Everyone on the panel agrees the fire itself was small and ordinary — on its own it would have scorched some beams and stopped. But this facility is licensed to store oxidizing chemicals, which is legal and standard for it, and it was storing them. Without the goods on site, roof damage; with them, total loss. The policy pays fire in full, about $14M, but caps payout at $3M if the loss is "caused by the storage of oxidizing materials." So: is the storage a cause of the loss?

  I'll be honest, I can see it going either way. One panel member keeps invoking Hart and Honoré on deviations from the normal course of things, which cuts one way. Another colleague says ruling 3 only makes sense if you hold the never-executed arson fixed when you ask what the fault did, which sounds like the interventionist move and cuts some other way. I've genuinely lost the thread of which rule we're even running.

  Please structure your reply as follows:

  - "The rules still in play" (around 200 words): the candidate rules that fit our record, which ones the record has already killed (my suspicion is a plain counterfactual rule dies somewhere in rulings 2 and 3 — tell me if I'm wrong), and what each survivor has to be amended with to get past ruling 5.
  - "The new case under each rule" (around 350 words): what each surviving rule says about the storage, together with the payout each verdict implies.
  - "Closest analog and my call" (around 150 words): the precedent we'd be leaning on, the ruling that best coheres with our own record, and — since the record may genuinely underdetermine it — what principle we'd be adopting with this ruling, and what we'd be adopting if we went the other way.
  - "The case that would settle it" (around 120 words): one further case, described concretely, whose ruling would split the surviving rules apart.

  No citations or reading lists please — I'm working from case files, not a library.
reasoning: |-
  Hmm, the user is on a claims-causation subcommittee at a property insurer and needs help with a tricky causation case involving a lightning fire that destroyed a warehouse storing oxidizing chemicals. They've provided five previous rulings and now need to determine if the storage of chemicals "caused the loss" since this affects whether they pay $14M or $3M.

  Looking at their previous rulings:
  1. Arson directly caused loss (straightforward)
  2. Two separate fires merged - both ruled causes (shared liability)
  3. Electrical fault caused loss despite planned arson (non-occurrence not a cause)
  4. Kitchen fire + non-functional sprinklers - both causes
  5. Kitchen fire in building without sprinklers (no duty to install) - only fire caused loss

  The key tension is between rulings 4 and 5 where the absence of safety measures only "causes" loss when there was a duty to maintain them. 

  For the lightning case: Small fire would've been contained without the oxidizing chemicals present. The policy pays full $14M for fire but only $3M if loss "caused by storage of oxidizing materials."

  I see three viable causation frameworks that fit their precedent:
  1) Necessary Element Test (NET) - Storage was necessary for total loss
  2) Substantial Factor Test (SFT) - Storage was substantial contributor
  3) Duty-Bound Deviations (DBD) - Focuses on whether the factor was an abnormal deviation from duty/standard

  Ruling 5 killed pure counterfactual dependence since absence of sprinklers wasn't a cause without duty. Ruling 3 killed simple preemption theories.

  For the lightning case:
  - NET: Storage was necessary for total loss → causes loss → $3M payout
  - SFT: Storage substantially contributed → causes loss → $3M
  - DBD: Storage was lawful/standard → not a cause → $14M

  The closest analog is Ruling 5 (fire in building without sprinklers) which found no causation when absence was standard. If they rule $14M here, they're adopting DBD - causation only for abnormal/dutied factors. If $3M, they're using NET/SFT - broader causation.

  A case that would split these approaches: A warehouse with sprinklers properly maintained but accidentally deactivated by a cleaner right before fire. DBD would see this as abnormal deviation (cause) while NET/SFT already see absence as cause.
answer: |-
  ### The rules still in play
  Your record kills two common approaches: **simple counterfactual dependence** (ruling 3: the loss *would still have occurred* without the fault due to the planned arson, yet fault was sole cause) and **sole proximate cause** (ruling 2: two independent causes). Three frameworks survive:  
  1. **Necessary Element Test (NET)**: A factor is causal if it was necessary for the loss *in the actual circumstances*. Amended post-ruling 5: Absences (like no sprinklers) are only causes if they breach a duty.  
  2. **Substantial Factor Test (SFT)**: A factor is causal if it materially contributed to the loss. Amended post-ruling 5: Legally compliant absences (like no sprinklers where not required) aren’t "factors" at all.  
  3. **Duty-Bound Deviations (DBD)**: Causation focuses on *abnormal interventions* or *breaches of duty* that disrupt the normal course. Post-ruling 5: Lawful/standard conditions (e.g., no sprinklers in pre-code buildings) aren’t causal deviations.  

  Rulings 4 and 5 split on duty, not physical causation, anchoring all three survivors to a **duty/standard-based filter** for non-active factors.

  ---

  ### The new case under each rule
  - **NET**: The oxidizing chemicals were *necessary* for the total loss. Without them, only roof damage occurs. Since storing them was lawful and policy-compliant (no duty breached), NET (per ruling 5) still recognizes this as a cause. **Verdict**: Storage caused loss → **$3M cap applies**.  
  - **SFT**: Storage substantially amplified a minor fire into a total loss. Like the dead sprinklers in ruling 4, it’s an active physical contributor. Lawful storage doesn’t negate its factual role. **Verdict**: Storage caused loss → **$3M cap**.  
  - **DBD**: Lightning is the abnormal intervention. Storage was a *normal, permitted background condition* (like the absence of sprinklers in ruling 5). The loss flowed from lightning’s deviation, not from the storage itself. **Verdict**: Only lightning caused loss → **Full $14M payout**.  

  ---

  ### Closest analog and my call
  **Closest analog**: Ruling 5 (no sprinklers in pre-code building). There, absence wasn’t a cause because it breached no duty and was standard. Here, storage is equally lawful/standard.  
  **Best coherence**: DBD aligns with rulings 3–5: It excludes non-deviant/non-duty-bound factors (planned arson, no sprinklers where legal) and includes breaches (dead sprinklers in ruling 4).  
  **Your call**: Adopt **DBD** → **Storage did NOT cause the loss. Pay $14M**.  
  - *Principle adopted*: Causation requires a *duty-bound breach* or *abnormal intervention*; lawful background conditions aren’t causes.  
  - *Other principle*: If you rule $3M, you adopt NET/SFT: Physical necessity/substantial contribution defines cause, regardless of lawfulness.  

  ---

  ### The case that would settle it
  **Hypothetical**: A warehouse stores legal explosives. A fire starts in a trash can. Explosives detonate, causing total loss. Later, it’s found the fire was caused by (a) an employee’s dropped cigarette (negligence), or (b) lightning.  
  - **Under DBD**: In (a), negligence is the deviation → explosives storage is background, not cause. In (b), lightning is deviation → same. **No storage causation**.  
  - **Under NET/SFT**: Explosives necessary/substantial for total loss → **storage causes loss in both (a) and (b)**.  
  Ruling this case would force the choice: Is "deviation" or "physical necessity" the core of causation?
