  First, I should recall the key concepts in evolutionary biology: adaptation, byproduct, constraint. The procedure needs to differentiate these. Also, the editor has limited time—maybe an afternoon per pitch. So the steps must be efficient. They want a checklist but are wary it might not replace expert input. I need to be honest about where judgment is required.

  The user provided two example pitches: morning sickness and runner's high. For each, I need to apply the procedure. The morning sickness pitch links it to avoiding plant toxins and advises against medication. The runner's high ties it to persistence hunting, promoting marathons over sedentary life. 

  Breaking down the procedure: Step 1 is to identify the core claim. What's the evolutionary explanation and the advice? Step 2 checks for pluralism—could other factors explain the trait? Step 3 looks for evidence like fossil records, genetics, or comparative studies. Step 4 assesses if the evolutionary claim is necessary for the advice. If the advice stands without it, maybe the pitch can still run. Step 5 evaluates the practical advice separately.

  For the morning sickness pitch, the adaptationist claim has some support but isn't conclusive. The medical advice to avoid medication is dangerous regardless. So the pitch should be rejected on safety grounds. For the runner's high, the link to persistence hunting is weak. Runner's high might be a byproduct of endorphin release. The practical advice about running benefits stands without the evolutionary story. So maybe run it minus the shaky science.

  The editor's deeper need is credibility. They don't want to publish pseudoscience but also can't dismiss all evolutionary claims. They need a balance between scientific rigor and practicality. Highlighting where judgment calls are necessary is crucial. Emphasize that some steps can't replace expert review, but the procedure can flag red flags. Also, separating the science from the advice allows keeping useful content even if the evolutionary angle is flawed.
answer: |-
  Here's a straight-talking procedure based on modern evolutionary biology (post-Gould, post-Spandrels), designed for a time-pressed editor. It cuts through adaptationist overreach while acknowledging that *some* evolutionary claims *are* robust and useful. **Crucially, it prioritizes separating the evolutionary "why" story from the practical "what to do" advice.**

  **The "Just-So Story" Triage Procedure (For Non-Biologists)**

  1.  **Isolate the Claim & Advice:**
      *   **Ask the Writer:** "Please state *exactly* the evolutionary claim being made and the specific practical advice derived from it in *one sentence each*."
      *   **Good Enough:** Clear, concise statements. No vague hand-waving like "because evolution".
      *   **Why:** Forces clarity. Many pitches bury weak science under exciting advice.
      *   **Judgment Call:** Is the link between the claim and the advice explicit and essential, or just narrative garnish?

  2.  **Pluralism Check (The Gould Filter):**
      *   **Ask the Writer:** "What are plausible *alternative* evolutionary explanations for this trait? (e.g., Is it an adaptation for *this specific thing*, a byproduct/spandrel of something else, a genetic constraint, drift, phylogenetic inertia?)"
      *   **Ask Yourself:** Does the pitch acknowledge any alternatives, or present the claim as the *only* possible explanation?
      *   **Good Enough:** The writer acknowledges *at least one* credible alternative explanation found in the literature (even if they dismiss it). Pitch shows awareness evolution isn't monolithic "design".
      *   **Red Flag:** Pitch presents the claim as the singular, obvious, undisputed truth of evolution. This is classic just-so territory.
      *   **Judgment Call:** Assessing the credibility of the alternatives mentioned (or the lack thereof). Does ignoring alternatives fundamentally misrepresent the science?

  3.  **Evidence Check (Beyond "It Makes Sense"):**
      *   **Ask the Writer:** "What specific *types* of evidence support this *specific* adaptationist claim? (e.g., Fossil record timing, comparative anatomy/behavior across species, genetics, experimental data, mathematical modeling, archaeological evidence for the behavior?)"
      *   **Ask Yourself:** Does the pitch cite *any* primary research or meta-reviews? Or just pop-sci books/articles repeating the story?
      *   **Good Enough:** Cites specific studies (even if you can't evaluate them deeply) *and* the type of evidence aligns reasonably with the claim (e.g., fossil timing matches the proposed selective pressure; comparative data shows correlation; experimental manipulation supports function).
      *   **Red Flag:** Relies solely on logic ("it must be adaptive"), anecdote, or only secondary/tertiary sources (e.g., only cites a journalist or popular book). Vague references to "studies show".
      *   **Judgment Call:** Does the *type* of evidence cited seem *capable* of testing this specific claim? (e.g., Fossil evidence for a behavioral adaptation is notoriously weak).

  4.  **Decouple the Advice (The Crucial Step):**
      *   **Ask Yourself:** **Does the practical advice stand or fall *independently* of the evolutionary claim?**
      *   **Scenarios:**
          *   **Advice Depends ENTIRELY on Evolutionary Claim:** (e.g., "Don't medicate morning sickness *because* it's an essential adaptive protection"). **-> High Risk.** Reject unless evolutionary claim is exceptionally solid (rare).
          *   **Evolutionary Claim Adds Color, Advice Stands Alone:** (e.g., "Runner's high is cool, maybe evolved for X, *and* running is great for cardio health"). **-> Lower Risk.** Evolutionary claim might be bonus fluff.
          *   **Evolutionary Claim Contradicts Stronger Evidence:** (e.g., "Evolved to eat meat, therefore low-carb is always best" ignoring vast evidence on benefits of plant diversity). **-> Reject.**
      *   **Good Enough:** The advice is justified by robust *contemporary* evidence (clinical trials, exercise physiology, nutrition science, psychology) regardless of the evolutionary backstory.
      *   **Judgment Call:** Weighing the strength of the contemporary evidence supporting the advice vs. the shakiness of the evolutionary claim. Is the evo-story actively misleading or just superfluous?

  5.  **Harm Check (Especially for Health/Medical):**
      *   **Ask Yourself:** Could acting on this advice, *based on the evolutionary claim*, cause harm? (e.g., discouraging medical treatment, promoting extreme behaviors).
      *   **Good Enough:** Advice is safe, evidence-based, and not contingent on a speculative evolutionary story. Harm potential is low.
      *   **Red Flag:** Evolutionary claim used to override modern medical/nutritional/exercise science. "Nature knows best" rhetoric.
      *   **Judgment Call:** Assessing potential harm based on the specific advice and audience.

  **Decision Flow:**

  1.  **Failed Pluralism/Evidence Check (Steps 2 & 3)?** -> **Be Skeptical.** Evolutionary claim is likely weak science.
  2.  **Advice Depends ENTIRELY on Weak Evolutionary Claim (Step 4)?** -> **Reject Pitch.** Too risky.
  3.  **Harm Potential High (Step 5)?** -> **Reject Pitch.** Regardless of science.
  4.  **Weak Evolutionary Claim BUT Advice Stands Alone & is Sound (Steps 4 & 5)?** -> **Consider Running, BUT:** Require removal or heavy caveating/downgrading of the evolutionary claim. Frame it as "one intriguing idea" or "some scientists speculate," not fact. Focus the piece on the *contemporary* evidence for the advice.
  5.  **Strong Evolutionary Claim (Rare! Passed Steps 2 & 3) & Advice Sound?** -> **Run it.**

  **Is a Checklist a Fantasy?** Partly, but not entirely. **Real science takes real scientists.** No checklist guarantees you've correctly evaluated complex biology. **However, this procedure *will* reliably flag the vast majority of lazy, overly simplistic, or harmful just-so stories by forcing examination of alternatives, evidence, and crucially, decoupling the "why" story from the "what to do".** It protects you from publishing the *worst* offenders and gives you a framework to salvage pitches with good advice but bad science framing. The biggest judgment call is Step 4 – separating the story from the substance.

  ---

  **Applying the Procedure to Your Pitches:**

  **Pitch 1: Morning Sickness Evolved to Protect Fetus -> Ride it Out, Don't Medicate**

  1.  **Claim/Advice:**
      *   Claim: Morning sickness evolved as an adaptation to protect the fetus from plant toxins.
      *   Advice: Women should avoid medicating morning sickness to preserve this protective function.
  2.  **Pluralism Check:**
      *   **Writer Likely Says:** Ignores alternatives (e.g., byproduct of hormone surges needed for pregnancy, immune system modulation, non-adaptive constraint).
      *   **Reality:** The "Toxin Avoidance" hypothesis (Profet, 1992) is prominent BUT controversial. Many biologists offer alternatives. **-> RED FLAG (Weak Pluralism).**
  3.  **Evidence Check:**
      *   **Writer Likely Cites:** Correlational studies (more nausea linked to lower miscarriage rates in some populations, certain food aversions). Maybe Profet's book.
      *   **Reality:** Evidence is correlational/observational. Hard to test experimentally (ethics!). Cross-cultural variation exists. Does *nausea itself* confer the protection, or is it a side effect? Proof of mechanism is lacking. **-> WEAK EVIDENCE (Correlation ≠ Causation, esp. for adaptation).**
  4.  **Decouple Advice:**
      *   **Crucially:** The advice "don't medicate" **depends ENTIRELY** on the unproven claim that nausea *is* the essential protective mechanism and suppressing it removes protection.
      *   **Contemporary Evidence:** Safe and effective medications exist (Diclegis, Zofran). Severe morning sickness (HG) is dangerous (dehydration, malnutrition, electrolyte imbalance) and *requires* treatment. **-> ADVICE CONTRADICTS MODERN MEDICINE & POTENTIALLY HARMFUL.**
  5.  **Harm Check:** **HIGH.** Discouraging medical treatment based on speculative evolution is dangerous.
  6.  **VERDICT:** **REJECT.** Fails Pluralism, Evidence is weak for the *specific adaptive function*, Advice depends entirely on the weak claim, and Harm potential is high. This is a classic, potentially dangerous just-so story overriding medicine.

  **Pitch 2: Runner's High Evolved for Persistence Hunting -> Humans Built for Marathons, Couch Time Anomalous**

  1.  **Claim/Advice:**
      *   Claim: Runner's high (endocannabinoid release) evolved as a reward mechanism for persistence hunting.
      *   Advice: Humans are physically adapted for endurance running (marathons/ultras), so embrace it; sedentary life is unnatural/unhealthy.
  2.  **Pluralism Check:**
      *   **Writer Likely Says:** Focuses solely on persistence hunting as the explanation.
      *   **Reality:** Persistence hunting is one hypothesis. Alternatives: Runner's high is a *byproduct* of general endorphin/endocannabinoid systems involved in pain/stress relief/reward *for any strenuous activity*, or social bonding during group activities. Phylogenetic constraint (mammalian reward systems). **-> RED FLAG (Weak Pluralism).**
  3.  **Evidence Check:**
      *   **Writer Likely Cites:** Lieberman's work on human anatomy (sweating, tendons, etc. *compatible* with endurance running). Anecdotes of runner's high. *Maybe* a study showing endocannabinoids post-run.
      *   **Reality:**
          *   *Anatomy:* Good evidence humans are *capable* of endurance running. Weak evidence it was the *primary* selective driver vs. walking, thermoregulation, or just being generally capable.
          *   *Persistence Hunting:* Evidence it was widespread is scant (few modern examples, little archaeological proof).
          *   *Runner's High Specific Link:* No evidence tying the neurochemistry *specifically* to persistence hunting scenarios vs. other strenuous activities (e.g., digging, climbing, long walks, dancing). It's a *byproduct* of general mechanisms. **-> WEAK EVIDENCE (for the *specific adaptation* of runner's high to persistence hunting).**
  4.  **Decouple Advice:**
      *   The core advice ("endurance running is beneficial," "sedentary life is unhealthy") **stands TOTALLY INDEPENDENTLY** of the persistence hunting/runner's high evolution claim.
      *   **Contemporary Evidence:** Overwhelming evidence from exercise physiology and public health: Regular aerobic exercise (including running) improves cardiovascular health, metabolic health, mental health, longevity. Sedentary behavior is a major risk factor for chronic diseases. This is true regardless of *why* we feel good during/after a run. **-> ADVICE SOUND ON ITS OWN.**
  5.  **Harm Check:** **LOW.** Promoting running and discouraging couch time is generally good advice. (Caveat: Needs to acknowledge injury risks/overtraining).
  6.  **VERDICT:** **CONSIDER RUNNING, BUT...** The evolutionary claim (runner's high *specifically* for persistence hunting) is weak science, likely a just-so story. **Require:** Remove or drastically reframe the evolutionary claim. Present it as "one interesting theory about why we *might* enjoy running," not the definitive reason. Emphasize the *actual* evidence: the proven physiological and mental health benefits of endurance exercise supported by modern science. Focus on "we *are* capable and benefit from it," not "we *evolved solely* for it." The practical advice is solid; ditch the shaky backstory.
