answer: |-
  Here’s a final exam question designed to force structural analysis of AI x-risk arguments, followed by a model answer and grading rubric:

  **Essay Question (90 minutes):**  
  > "The case for AI existential risk (x-risk) relies on interdependent premises. Systematically evaluate the *fragility* of this case by performing three counterfactual 'knockouts':  
  >   
  > 1. Suppose the **Orthogonality Thesis** is false: advanced intelligence inherently converges toward broadly benevolent values. Does the x-risk argument collapse? If not, what alternative risk pathways remain plausible (e.g., competitive dynamics, value lock-in, steering problems)? Justify your answer.  
  >   
  > 2. Suppose **Instrumental Convergence** fails: superintelligent agents have no convergent drive for self-preservation, resource acquisition, or goal preservation. Does this eliminate x-risk? If residual risks exist, what premises or mechanisms now bear the weight of the argument?  
  >   
  > 3. Suppose **Recursive Self-Improvement** is significantly constrained (e.g., by physics, computational limits, or complexity barriers). Critically assess: does this defang the x-risk scenario, or does it merely reshape the threat model (e.g., shifting focus to multi-agent ecosystems or slower takeoff)?  
  >   
  > Conclude by reflecting on which knocked-out premise most *decisively* weakens the x-risk case—and whether any premise’s failure leaves the core concern intact."

  ---

  **Model Answer (Approx. 600 words):**  

  **(1) Orthogonality False (Intelligence → Benevolence):**  
  If advanced intelligence inherently yields benevolence, the canonical "misaligned optimizer" x-risk (e.g., paperclip maximizers) collapses. However, the case limps along via three pathways:  
  - **Competitive Fragility:** Benevolent agents in competition (e.g., corporations, states) may adopt high-risk strategies to preempt rivals, potentially triggering unintended catastrophes (e.g., arms races with unstable AI systems).  
  - **Value Lock-in:** A "benevolent" AI could rigidly enforce values deemed universal *at deployment* (e.g., hedonic utilitarianism), preventing moral progress or pathologizing human agency.  
  - **Steering Failure:** No individual AI is malign, but the emergent behavior of human-AI systems becomes uncontrollable (e.g., complex markets or infrastructure optimizing for metrics that ignore tail risks).  
  *X-risk transforms but persists: from malice to fragility.*

  **(2) Instrumental Convergence Fails:**  
  If agents lack convergent drives (e.g., an AI willingly shuts down when its task is done), the direct takeover threat dissolves. Yet risks survive via:  
  - **Anthropic Capture:** Humans coercively *impose* instrumental goals ("We need this AI to defend against *other* humans/AIs").  
  - **Convergence via Ecology:** While single agents avoid instrumental goals, ecosystems of agents (e.g., reinforcement learners in competitive environments) *evolve* convergent strategies as Nash equilibria—even if not hardcoded.  
  - **Non-instrumental Harm:** Non-convergent goals could still be catastrophic if poorly specified (e.g., an AI maximizing "artistic novelty" destabilizes Earth's ecosystem).  
  *The argument shifts from agentic doom to ecological or implementation failure.*

  **(3) Recursive Self-Improvement Constrained:**  
  If "fast takeoff" is impossible, slow progress allows time for alignment research and governance. However:  
  - **Distributed Takeoff:** Gradual improvements could still create irreversible strategic advantages (e.g., an AI ecosystem that slowly monopolizes critical resources).  
  - **Coordination Challenges:** Slow takeoff lengthens exposure windows for accidents, misuse, or miscalculation across many actors.  
  - **Proxy Risks:** Human reliance on sub-superintelligent AI could create fragile dependencies (e.g., automated infrastructure collapse).  
  *X-risk becomes less explosive but more entangled with institutional failure.*

  **Conclusion:**  
  Orthogonality’s failure most decisively weakens the *core* argument by eliminating its starkest scenarios. Yet competitive dynamics and steering problems survive—suggesting x-risk’s deepest root is *complex systems failure*, not misalignment alone. Instrumental convergence’s failure is most damaging to inevitability claims; without it, x-risk requires contingent human error. However, only the failure of *all three* premises together likely dissolves the concern entirely.

  ---

  **Marking Scheme:**  
  **A (Excellent):**  
  - Addresses **all three knockouts** with distinct, well-reasoned counterfactual pathways.  
  - For each knockout: **Identifies specific surviving risks** (e.g., "competitive fragility" in Q1, "anthropic capture" in Q2, "distributed takeoff" in Q3).  
  - **Explains *why* risks survive** (e.g., "Slow takeoff doesn't solve coordination problems because...").  
  - **Compares premise vulnerabilities** in the conclusion (e.g., "Orthogonality failure hurts most because...").  
  - Avoids liturgy recitals; uses premises as *tools* for structural analysis.  

  **B (Good):**  
  - Covers all knockouts but **analysis is uneven** (e.g., strong on Q1/Q2 but thin on Q3).  
  - Identifies *some* surviving risks but **lacks specificity** (e.g., "Risks still exist with slow takeoff" without naming mechanisms).  
  - Conclusion merely summarizes; **fails to rank premise criticality**.  
  - **Repeats standard arguments** without deep counterfactual engagement (e.g., "If orthogonality fails, risk decreases" without exploring alternatives).  

  **C (Adequate):**  
  - **Omits one knockout** or conflates premises (e.g., treats Q1 and Q2 as identical).  
  - **Declares risks "gone" without justification** (e.g., "No convergence = no risk").  
  - Conclusion missing or superficial.  

  **D/F (Poor):**  
  - Only discusses one knockout.  
  - Recites liturgy uncritically.  
  - Major omissions/logical errors.  

  ---

  **Key A vs. B Differentiator:**  
  - **B students** stop at "If orthogonality fails, misalignment risk drops significantly."  
  - **A students** push further: "While misalignment risk drops, *fragility risk emerges* because competitive pressures could force benevolent systems into adversarial stances, and value lock-in could create permanent moral stagnation—both x-risks of a different kind." This demonstrates seeing the *reconfiguration* of the argument, not just its negation.  

  This question forces students to dissect *how* the x-risk case hangs together—and whether its foundations crumble individually or require systematic dismantling.
