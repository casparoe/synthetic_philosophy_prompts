  The disagreements table is trickiest. Each stance needs dual drafting: one version palatable to each side. For example, on whether legality admits degrees, Dr. B's version must frame it as constitutive collapse ("progressive attenuation"), while Dr. A's calls it functional deterioration ("degradation"). Any phrasing that implies the other's position is false (e.g., "merely functional" for Dr. B) would backfire. 

  Cruxes are where progress might happen. The degree-of-legality question is key—Dr. B thinks procedural failures reduce law's existence; Dr. A sees them as external to validity. Another is the separation thesis's core: is it about validity conditions (Dr. A) or law's conceptual independence from merits (Dr. B)? I'll flag verbal disputes too, like whether "law" requires minimal morality or just systematicity. 

  For test cases, I'll design two regimes: 
  - **Regime Alpha**: Flawlessly formal but monstrous (e.g., public, prospective apartheid). Dr. A predicts insiders call it "law" and obey; Dr. B expects discomfort but pragmatic compliance. 
