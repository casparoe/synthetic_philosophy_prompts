prompt: |-
  Each quarter our agency's leadership team must decide which performance metrics to adopt for the next funding cycle, and the same failure keeps recurring: a metric that looked like a clean proxy for what we care about gets gamed within a year — grantees hitting targets by redefining who counts as served, contractors closing tickets without resolving them, schools reclassifying students to move an attendance number. I'm told this is what Goodhart's law is about, and that the ML literature on specification gaming has developed a taxonomy of ways measures come apart from what they measure, but I need something my team can actually run in a one-hour review meeting, not theory. Please write a procedure for vetting a proposed metric before we commit to it: the questions to ask in order, what counts as a sufficient answer to each, which answers should kill the metric on the spot, and which questions are judgment calls that must go to leadership rather than be settled by the checklist. The procedure should distinguish a metric that is merely imperfect from one that is exploitable, and should say what to do when no metric passes but a decision must be made anyway. Then run it on three real candidates from our docket: number of beneficiaries reached per dollar, median time from application to grant decision, and percentage of staff who report high job satisfaction. I expect at least one of these to fail the procedure in a way my director will not want to hear, and I'd like the worked example to make that failure vivid rather than hedged.
reasoning: |-
  We are designing a procedure to vet proposed performance metrics to prevent gaming. The procedure will be a checklist of questions to ask in sequence. For each question, we will specify:
   - What a sufficient answer looks like
   - Which answers should kill the metric immediately
   - Which questions require judgment and must be escalated to leadership

   The goal is to distinguish between a metric that is imperfect (but acceptable) and one that is exploitable (and therefore dangerous).

   We'll structure the procedure as a series of steps:

   Step 1: Define the Intended Outcome
     Question: What is the precise outcome we are trying to achieve and why?
     Sufficient Answer: A clear, specific, and measurable outcome that aligns with the agency's mission and strategic goals.
     Kill Criterion: If there is no clear intended outcome, or if the outcome is not aligned with the mission.
     Judgment Call: None. This is foundational.

   Step 2: Check for Directness
     Question: Can we measure the intended outcome directly? If not, why?
     Sufficient Answer: If direct measurement is impossible or impractical, then a proxy is acceptable, but the limitations must be acknowledged.
     Kill Criterion: If the metric is a proxy and there is no strong argument for why direct measurement is impossible.
     Judgment Call: Assessing the practicality of direct measurement may require judgment and escalation.

   Step 3: Identify Known Gaming Vectors (from past experience and common pitfalls)
     Question: What are the known ways this metric (or similar ones) has been gamed in the past? How does this metric mitigate those?
     Sufficient Answer: The team must list at least two plausible gaming vectors and explain how the metric is resistant to them or how they will be monitored.
     Kill Criterion: If the metric is vulnerable to a known gaming vector and there is no mitigation plan (or the mitigation is impractical).
     Judgment Call: The assessment of whether the mitigation is sufficient is a judgment call for leadership.

   Step 4: Test for Alignment of Incentives
     Question: If grantees/staff optimize solely for this metric, what would they do? Are those actions aligned with the intended outcome?
     Sufficient Answer: The actions taken to optimize the metric should be the same actions that produce the intended outcome, or at least not conflict with it.
     Kill Criterion: If optimizing the metric leads to actions that are clearly harmful to the intended outcome or other important goals.
     Judgment Call: When there is a trade-off (e.g., some harm but net positive), it must go to leadership.

   Step 5: Check for Unintended Consequences
     Question: What are the potential unintended consequences of using this metric? (Consider: creaming, neglecting hard-to-serve populations, short-termism, etc.)
     Sufficient Answer: The team must identify at least one unintended consequence and have a plan to monitor and mitigate it.
     Kill Criterion: If the unintended consequence is severe and cannot be mitigated (e.g., violates equity requirements or legal obligations).
     Judgment Call: Severity of the unintended consequence and the feasibility of mitigation.

   Step 6: Assess Data Quality and Verification
     Question: How will we verify the data? What are the data sources and how reliable are they?
     Sufficient Answer: There must be a clear, independent, and auditable data source. Self-reported data without verification is insufficient.
     Kill Criterion: If the data cannot be independently verified or if the data collection is subject to manipulation by the same entity being measured.
     Judgment Call: The adequacy of the verification process.

   Step 7: Consider the Overall Balance (if multiple metrics)
     Note: This step is only if the metric is part of a set. We are vetting one at a time, but we note that a metric might be acceptable only in combination with others.

   Step 8: When no metric passes, but a decision must be made
     - Use a combination of metrics that cover different aspects and are hard to game simultaneously.
     - Consider qualitative assessments and audits to supplement.
     - Accept that the metric is imperfect and build in regular reviews and adjustments.

   Now, we run the procedure on the three candidate metrics:

   Candidate 1: Number of beneficiaries reached per dollar

   Step 1: Intended Outcome
     - Outcome: Efficient use of funds to maximize the number of people served.
     - Why: To ensure we are getting the most impact for our spending.
     - Sufficient? Yes.

   Step 2: Directness
     - We are measuring efficiency. The direct measure would be the actual impact per dollar, but that is hard to measure (requires impact assessment). So we use a proxy: number of beneficiaries reached.
     - Kill? No, because direct impact measurement is often impractical.

   Step 3: Known Gaming Vectors
     - Known gaming: Grantees might count beneficiaries in a way that inflates numbers (e.g., counting people who barely interacted, redefining beneficiary, double-counting). Also, they might focus on easy-to-reach populations (creaming) to lower costs.
     - Mitigation: We can define strict criteria for who counts as a beneficiary and require documentation. Also, we might require demographic breakdowns to ensure equity.
     - However, without strong verification, the gaming risk is high.
     - Kill? Not yet, but if we cannot verify, then we kill in Step 6.

   Step 4: Alignment of Incentives
     - If optimized: Grantees will try to serve as many people as possible at the lowest cost per person. This might lead to:
          - Reducing the quality of service (to serve more people with the same resources).
          - Avoiding hard-to-serve populations (because they cost more).
     - Alignment: It aligns with efficiency but not necessarily with effectiveness or equity.
     - Kill? Not immediately, but it's a problem. We must consider if we have other metrics to balance (like quality). Without balance, it might lead to harm.

   Step 5: Unintended Consequences
     - Consequences: 
          - Creaming: Focusing on easy-to-serve beneficiaries.
          - Lowering quality to increase quantity.
          - Neglecting long-term outcomes in favor of short-term reach.
     - Mitigation: Combine with a quality metric and require minimum quality standards. Also, set targets for hard-to-serve populations.
     - Without such balancing, the unintended consequences can be severe.

   Step 6: Data Quality and Verification
     - Data source: Grantee reports. 
     - Verification: We can audit the beneficiary lists and the criteria used. But audits are costly and may be infrequent.
     - If the grantee has an incentive to inflate numbers, and verification is weak, then this metric is highly exploitable.
     - Kill? If we cannot implement strong verification, then we must kill it. Without verification, it fails.

   Overall: This metric is exploitable without strong verification and balancing metrics. It might be acceptable only in a set of metrics.

   Candidate 2: Median time from application to grant decision

   Step 1: Intended Outcome
     - Outcome: Efficient and timely processing of applications.
     - Why: To reduce the burden on applicants and ensure that funds are deployed quickly.
     - Sufficient? Yes.

   Step 2: Directness
     - This is a direct measure of the timeliness of the decision process. We are measuring exactly the time we care about.
     - Sufficient? Yes.

   Step 3: Known Gaming Vectors
     - Gaming: 
          - Rushing decisions without due diligence to hit the time target.
          - Delaying the start of the clock (e.g., by redefining when the application is considered "received").
          - Closing applications prematurely (e.g., by rejecting for minor errors without allowing correction) to avoid having long-pending applications.
     - Mitigation: 
          - Define the start (when application is complete) and end (when decision is communicated) clearly.
          - Monitor the quality of decisions (e.g., through a separate quality metric or audit).
          - Track the distribution (not just median) to avoid creating an incentive to close long-pending applications by rejection.

   Step 4: Alignment of Incentives
     - If optimized: Staff will try to reduce the median time. This could be done by:
          - Improving efficiency (good).
          - Cutting corners in review (bad).
          - Encouraging applicants to withdraw (bad).
     - Alignment: Only if we can ensure that quality is maintained.

   Step 5: Unintended Consequences
     - Consequences: 
          - Lower quality of reviews (more errors).
          - Increased burden on applicants if they are rushed to provide information.
          - Inequity if complex applications (which take longer) are discouraged.
     - Mitigation: Combine with a quality metric (e.g., percentage of decisions overturned on appeal) and monitor equity.

   Step 6: Data Quality and Verification
     - Data source: Our own system records the dates. This is verifiable from system logs.
     - Verification: We can audit the logs. The data is objective and hard to manipulate if the system is designed properly.
     - Sufficient? Yes.

   Overall: This metric is less exploitable if combined with a quality metric and clear definitions. The risk of gaming exists but can be managed.

   Candidate 3: Percentage of staff who report high job satisfaction

   Step 1: Intended Outcome
     - Outcome: A satisfied and engaged workforce, which we believe leads to better performance and retention.
     - Why: Because staff turnover is costly and morale affects service quality.
     - Sufficient? Yes.

   Step 2: Directness
     - This is a direct measure of self-reported satisfaction. However, the outcome we ultimately care about is performance and retention, which we believe is correlated with satisfaction.
     - But note: we are measuring satisfaction, not performance or retention. So it's a proxy for what we really care about (a productive workforce). However, the direct measure of performance might be hard to aggregate (e.g., different roles) and retention might lag.
     - Kill? No.

   Step 3: Known Gaming Vectors
     - Gaming:
          - Managers pressuring staff to report high satisfaction.
          - Survey timing (e.g., survey right after a bonus) or manipulation of the survey sample (e.g., only happy staff respond).
          - Changing the survey questions or scale to inflate results.
     - Mitigation: 
          - Anonymous surveys administered by a third party.
          - Consistent timing and methodology.
          - High response rate required for validity.

   Step 4: Alignment of Incentives
     - If optimized: Managers might focus on making staff happy in the short term (e.g., with perks) without addressing underlying issues. Or they might avoid holding staff accountable to prevent dissatisfaction.
     - Alignment: It is aligned with the goal of improving morale, but might conflict with performance if it leads to avoiding tough decisions.

   Step 5: Unintended Consequences
     - Consequences:
          - Avoiding necessary disciplinary actions or performance management.
          - Focusing on superficial perks rather than meaningful improvements.
     - Mitigation: Combine with performance metrics and retention rates.

   Step 6: Data Quality and Verification
     - Data source: Staff survey. 
     - Verification: Anonymity and third-party administration can help. But if staff do not trust the anonymity, they may not be honest. Also, response rates are critical.
     - Kill? If we cannot ensure anonymity and a high response rate, then the data may be unreliable.

   Overall: This metric is vulnerable to gaming and manipulation if not collected carefully. It requires strong safeguards.

   Now, let's write the procedure in a checklist form:

   PROCEDURE: Metric Vetting Checklist

   1. Intended Outcome:
      - Question: What outcome are we trying to achieve and why?
      - Sufficient: Clear, specific, and aligned with mission.
      - Kill: If not aligned or if outcome is undefined.

   2. Directness:
      - Question: Can we measure the outcome directly? If not, why?
      - Sufficient: Direct measure OR a proxy with clear justification for why direct is impractical.
      - Kill: If the metric is a proxy and direct measurement is feasible and practical.
      - Judgment: If the practicality of direct measurement is disputed, escalate.

   3. Known Gaming Vectors:
      - Question: What are at least two ways this metric could be gamed? How will we mitigate?
      - Sufficient: List of plausible gaming vectors and mitigation plans.
      - Kill: If there is a known gaming vector that cannot be mitigated and is likely to occur.
      - Judgment: If the mitigation plan is disputed, escalate.

   4. Alignment of Incentives:
      - Question: If actors optimize solely for this metric, what would they do? Is that aligned with the outcome?
      - Sufficient: The actions are largely aligned with the outcome.
      - Kill: If optimizing the metric leads to actions that are clearly harmful to the outcome.
      - Judgment: If there is a mix of aligned and misaligned incentives, escalate.

   5. Unintended Consequences:
      - Question: What are potential negative side effects? How will we monitor and mitigate?
      - Sufficient: At least one unintended consequence identified and a mitigation plan.
      - Kill: If the unintended consequence is severe and cannot be mitigated without undermining the metric.
      - Judgment: Severity assessment and mitigation plan adequacy, escalate if needed.

   6. Data Quality and Verification:
      - Question: How will we verify the data? What are the sources and their reliability?
      - Sufficient: Independent, auditable, and reliable data sources with verification plan.
      - Kill: If data cannot be verified or is subject to manipulation by the measured entity without controls.
      - Judgment: The adequacy of the verification plan, escalate if disputed.

   7. Overall Pass/Fail:
      - If the metric passes all without kill criteria, then adopt (with monitoring).
      - If it fails any kill criterion, reject.
      - If it has judgment calls that are escalated, leadership decides.

   8. When no metric passes:
      - Consider a set of metrics that together cover the outcome and balance each other.
      - Use qualitative assessments and regular audits.
      - Adopt the least bad metric with a plan to iterate and improve.

   Now, we run the three candidates through the checklist:

   Candidate 1: Number of beneficiaries reached per dollar

   1. Intended Outcome: Pass.
   2. Directness: Pass (proxy justified by impracticality of direct impact measurement).
   3. Known Gaming Vectors: 
        - Gaming: Inflation of beneficiary counts and creaming.
        - Mitigation: Strict definitions and audits? But without strong verification, the mitigation may be insufficient. 
        - This step is a judgment call: if we cannot implement strong audits, then it fails. Without verification, it's exploitable. 
        - We'll say: insufficient mitigation -> Kill? Not immediately, but if Step 6 fails then kill.
   4. Alignment of Incentives: 
        - Actions: May reduce quality and avoid hard cases. 
        - This is harmful to the outcome (which is efficiency AND impact). 
        - Without a quality metric, it's misaligned. 
        - Judgment: If we are only using this metric, then it fails. If we have a quality metric, then pass with caution. 
        - We'll note: it requires a companion metric.
   5. Unintended Consequences: 
        - Creaming and quality reduction. 
        - Mitigation: Quality metric and equity targets. 
        - Without these, it fails. 
        - Judgment: We must have those companion metrics.
   6. Data Quality and Verification: 
        - Without strong audits and verification, the data is unreliable. 
        - If we cannot commit to audits, then kill.

   Verdict: This metric is highly exploitable without companion metrics and strong verification. If we cannot provide those, it should be killed.

   Candidate 2: Median time from application to grant decision

   1. Pass.
   2. Pass (direct).
   3. Gaming: Rushing, redefining start/end, closing by rejection. 
        - Mitigation: Clear definitions, quality metric. 
        - Pass with mitigation plan.
   4. Alignment: Only if quality is maintained (so we need a quality metric). 
        - Without a quality metric, it's risky. 
        - Judgment: We must have a quality metric. 
        - If we commit to a quality metric, pass.
   5. Unintended Consequences: Lower quality, inequity. 
        - Mitigation: Quality metric and monitoring distribution and equity. 
        - Pass with mitigation.
   6. Data Quality: Pass (verifiable system logs).

   Verdict: Pass, but only if paired with a quality metric and monitoring.

   Candidate 3: Percentage of staff who report high job satisfaction

   1. Pass.
   2. Pass (direct for satisfaction, proxy for performance).
   3. Gaming: Pressure, survey manipulation. 
        - Mitigation: Anonymous, third-party, high response rate. 
        - If we can do that, pass. 
        - If we cannot, then kill in Step 6.
   4. Alignment: Might lead to avoiding accountability. 
        - Without a performance metric, it's risky. 
        - Judgment: Must be paired with performance metrics.
   5. Unintended Consequences: Superficial fixes, avoiding accountability. 
        - Mitigation: Pair with performance and retention metrics. 
        - Pass with mitigation.
   6. Data Quality: 
        - If we do anonymous third-party with high response rate, pass. 
        - If we cannot guarantee these, then the data is unreliable -> kill.

   Verdict: Pass only if we can ensure anonymity, third-party administration, and high response rates, and pair with performance metrics.

   For Candidate 1, we see the failure: without strong verification and without companion metrics to ensure quality and equity, it is exploitable. If the agency is not willing to invest in audits and to add quality and equity metrics, then this metric must be killed.

   We present this to the director without hedging: 
     "The 'number of beneficiaries reached per dollar' metric is highly vulnerable to gaming through inflated beneficiary counts and creaming. Without a robust audit system and companion metrics for quality and equity, it will lead to perverse incentives and harm our mission. We recommend against adopting it unless we are prepared to implement these safeguards."
answer: |-
  Below is a **step-by-step vetting procedure** for performance metrics, designed for a 60-minute review meeting. It includes kill criteria, judgment flags, and a fallback for when no metric passes. I'll then run your three candidate metrics through it, with unhedged analysis.

  ---

  ### **Metric Vetting Procedure: 8-Step Checklist**
  **Goal:** Distinguish "imperfect but usable" from "exploitable and dangerous."  
  **Time:** 5-7 min per metric in a team review. Escalate judgment calls to leadership.

  #### **Step 1: Define the True Goal**  
  **Question:** *"What is the ultimate outcome we care about, and why can’t we measure it directly?"*  
  - **Sufficient Answer:** Clear, outcome-focused statement (e.g., "We want to maximize *impact* per dollar, not just bodies moved").  
  - **Kill Criteria:** No direct link to a mission-critical outcome.  
  - **Judgment Call:** None. Proceed only if the answer is unambiguous.

  #### **Step 2: Identify Proxy Weaknesses**  
  **Question:** *"Where is the 'wiggle room' between this metric and the true goal?"*  
  - **Sufficient Answer:** Specific, plausible gaps (e.g., "Counting 'beneficiaries reached' ignores impact quality").  
  - **Kill Criteria:** The gap allows gaming without detection (e.g., redefining terms like "served" or "resolved").  
  - **Judgment Call:** If gaps are acknowledged but deemed monitorable.

  #### **Step 3: Stress-Test Incentives**  
  **Question:** *"If you were a grantee/contractor/staff member forced to hit this target, what’s the easiest way to 'win' without helping the mission?"*  
  - **Sufficient Answer:** Realistic gaming tactics (e.g., "Prioritize easy cases to inflate numbers").  
  - **Kill Criteria:** Gaming is low-effort, high-reward, and undetectable via audits.  
  - **Judgment Call:** If gaming requires collusion/complexity.

  #### **Step 4: Verify Data Provenance**  
  **Question:** *"Who collects the data, how is it verified, and can they manipulate it?"*  
  - **Sufficient Answer:** Independent verification, audits, or immutable sources (e.g., timestamped systems).  
  - **Kill Criteria:** Data is self-reported with no audit trail, or the reporter controls definitions.  
  - **Judgment Call:** If spot-checks are feasible but costly.

  #### **Step 5: Assess Distortion Risks**  
  **Question:** *"What valuable activities might this metric discourage?"*  
  - **Sufficient Answer:** Identifies trade-offs (e.g., "Speed vs. accuracy" or "quantity vs. equity").  
  - **Kill Criteria:** Incentivizes harming the mission (e.g., excluding vulnerable groups).  
  - **Judgment Call:** If trade-offs are acceptable for short-term priorities.

  #### **Step 6: Benchmark Against History**  
  **Question:** *"Have we or others seen this (or similar) metric gamed? How?"*  
  - **Sufficient Answer:** Examples of past gaming and mitigations.  
  - **Kill Criteria:** Same gaming vector caused failure in the last 3 years.  
  - **Judgment Call:** If context has changed materially.

  #### **Step 7: Pilot Safeguards**  
  **Question:** *"What *specific* controls will prevent gaming? (e.g., audits, counter-metrics, caps)"*  
  - **Sufficient Answer:** Concrete, budgeted actions (e.g., "Random audits of 10% of beneficiary claims").  
  - **Kill Criteria:** No safeguards beyond "trust" or "training."  
  - **Judgment Call:** If safeguards reduce gaming risk to <10% (requires leadership risk tolerance).

  #### **Step 8: Final Viability**  
  - **Kill the metric** if it fails any "Kill Criteria" step.  
  - **Flag for leadership** if >2 "Judgment Call" steps are triggered.  
  - **Approve with caution** if safeguards are robust and gaps are monitored.

  #### **When No Metric Passes:**  
  - **Short-term:** Use a **metric trio** (e.g., speed + quality + equity) to force balance.  
  - **Long-term:** Deploy **blinded audits** (e.g., external reviewers assess a random sample of work).  
  - **Fallback:** **Outcome-based milestones** (e.g., "Deliver X% reduction in student dropouts" with pre-defined criteria).

  ---

  ### **Vetting Your Three Metrics**
  **Key:**  
  ✅ = Pass  
  ⚠️ = Judgment Call (Escalate)  
  ❌ = Kill Criteria Triggered  

  ---

  #### **1. Number of beneficiaries reached per dollar**  
  **True Goal:** Cost-effective service delivery.  
  **Step 1:** ✅ (Maximize reach per resource).  
  **Step 2:** ❌ **Gap:** "Beneficiary" definition is fluid (e.g., counting brief interactions as "reached").  
  **Step 3:** ❌ **Gaming:** Exclude hard-to-serve groups; pad numbers with low-effort engagements.  
  **Step 4:** ❌ **Data:** Self-reported by grantees; no audit trail for who counts as "served."  
  **Step 5:** ❌ **Distortion:** Incentivizes "creaming" (focusing on easy cases) and ignoring impact depth.  
  **Step 6:** ❌ **History:** Past gaming confirmed (redefining "served").  
  **Step 7:** ❌ **Safeguards:** None proposed beyond "clear guidelines" (ineffective historically).  
  **Verdict:** **KILL.** Unfixably exploitable. Leadership cannot ignore: This metric directly caused past failures and will incentivize exclusion.  

  ---

  #### **2. Median time from application to grant decision**  
  **True Goal:** Efficient, respectful service.  
  **Step 1:** ✅ (Reduce wait times for applicants).  
  **Step 2:** ⚠️ **Gap:** Speed ≠ quality (e.g., rushed rejections).  
  **Step 3:** ⚠️ **Gaming:** Reject complex applications faster; "close" tickets without resolving.  
  **Step 4:** ✅ **Data:** Automated timestamps; harder to fake.  
  **Step 5:** ⚠️ **Distortion:** May sacrifice thoroughness or equity (e.g., rubber-stamping).  
  **Step 6:** ⚠️ **History:** Contractors closed tickets prematurely to hit targets.  
  **Step 7:** ✅ **Safeguards:** Paired with "% of appeals upheld" (quality check) + random audits.  
  **Verdict:** **CONDITIONAL APPROVAL** with two safeguards:  
  - Add a **counter-metric** (e.g., "% approved applications with >90% completeness score").  
  - **Escalate to leadership:** They must accept the quality/speed trade-off.  

  ---

  #### **3. Percentage of staff who report high job satisfaction**  
  **True Goal:** Retain talent and improve performance.  
  **Step 1:** ✅ (Morale correlates with productivity).  
  **Step 2:** ⚠️ **Gap:** Satisfaction ≠ performance (e.g., happy but unproductive teams).  
  **Step 3:** ⚠️ **Gaming:** Pressure staff to inflate scores; survey during "happy" periods.  
  **Step 4:** ❌ **Data:** Self-reported via internal surveys; anonymity not guaranteed.  
  **Step 5:** ⚠️ **Distortion:** Leaders avoid hard decisions (e.g., firing low performers).  
  **Step 6:** ⚠️ **History:** Schools reclassified staff to exclude temp workers.  
  **Step 7:** ⚠️ **Safeguards:** Third-party anonymous surveys + >80% response rate required.  
  **Verdict:** **REVISE & RESUBMIT** with fixes:  
  - **Kill** unless surveys are externally run and anonymized.  
  - Add **counter-metrics** (e.g., turnover rate, productivity).  
  - **Escalate:** Leadership must fund third-party surveys.  

  ---

  ### **Final Recommendation to Leadership**
  - **Kill "Beneficiaries per dollar" immediately.** It’s a recurring failure and will corrupt your programs.  
  - **Approve "Grant decision time" with a quality counter-metric.**  
  - **Revise "Staff satisfaction" to prevent coercion.** Use an external vendor.  
  - **Fallback for unfixable metrics:** Shift to **outcome-based milestones** (e.g., "Reduce homeless shelter waitlist by 20%") with pre-agreed definitions.  

  This procedure forces hard questions early. If leadership balks at killing flawed metrics, remind them: *"What gets measured gets gamed—especially when gaming is easier than real impact."*
