  Now for candid weaknesses: The prep sheet might fail if philosophers press on why "authorship" matters absent harm. Or if economists force concrete cost-benefit comparisons. For the thesis to be truly defeated? Philosophers would need to prove person-affecting is the ONLY valid duty framework. Economists would need to show welfare tradeoffs always override constraints.

