  ### Comprehensive In-Class Activity: Resolving the Two-Envelope Paradox  
  **Pedagogical Goal:** Students will identify the precise flaw in the naive 1.25x expected-value calculation (the false assumption of a uniform prior over an unbounded range) through experiential learning, data analysis, and structured debriefing.

  ---

  ### **Activity Design**  
  #### **Structure**  
  - **Two rounds** (hidden vs. announced distribution) to contrast intuitive vs. informed reasoning.  
  - **Pairs of students** (9 pairs for 18 students).  
  - **Token currency**: Tokens convert to lottery tickets for dropping homework grades (e.g., 1 token = 1 ticket; 2 prizes: "Drop two lowest HWs" and "Drop one lowest HW").  
  - **Time per round**: 5 minutes (10 minutes total).  
  - **Distribution**: Bounded and discrete. Use amounts in powers of 2: {10, 20, 40, 80} tokens.  
    - **Prior**: Three possible pairs—(10,20), (20,40), (40,80)—chosen with equal probability (1/3). Within a pair, amounts are randomly assigned to envelopes (50/50).  

  #### **Materials**  
  - **Envelopes**: 36 sealed envelopes (18 pairs, 2 rounds). Label as "A" or "B".  
  - **Preparation**:  
    - For each pair and round, randomly select a pair (e.g., (20,40)), then randomly assign amounts to A/B.  
    - **Example**: Round 1, Pair 1: A=40, B=20; Round 2, Pair 1: A=10, B=20.  
  - **Student sheets**: Record initial envelope, switch decision, final amount, and partner’s decision.  
  - **Lottery bucket**: For token conversion.  

  #### **Payoff Scheme**  
  - Tokens convert to lottery tickets. Total tokens per student = Round 1 tokens + Round 2 tokens.  
  - **Prizes**: Two draws from the bucket:  
    - First draw: Drop two lowest HWs.  
    - Second draw: Drop one lowest HW.  
  - **Rationale**: Linear utility of tokens encourages rational decisions.  

  ---

  ### **Activity Flow**  
  #### **Round 1: Hidden Distribution** (5 minutes)  
  1. **Setup**:  
     - Pair students; distribute sealed envelopes (A/B).  
     - *Instructor script*: "One envelope has double the tokens of the other. Take one randomly (flip a coin for A/B). Do NOT open yet. You may pay 0 tokens to switch envelopes with your partner—but **both must agree to switch**."  
  2. **Decision**:  
     - Each student **privately** decides: "Do you want to switch?" (Yes/No).  
     - Partners **reveal decisions simultaneously**:  
       - If both say "Yes", they swap.  
       - Otherwise, no swap.  
  3. **Outcome**:  
     - Open envelopes, record tokens, decisions, and outcomes.  

  #### **Round 2: Announced Distribution** (5 minutes)  
  1. **Setup**:  
     - Same pairs; new envelopes.  
     - *Instructor script*: "We use three possible pairs: (10,20), (20,40), (40,80), each equally likely. Within a pair, amounts are randomly assigned."  
  2. **Decision**:  
     - Same as Round 1 (private decision → mutual agreement).  
  3. **Outcome**:  
     - Record data as in Round 1.  

  #### **Data Aggregation** (10 minutes)  
  - **Tally on board** for all pairs:  
    | Round | Pair | Env A | Env B | Student A: Switch? | Student B: Switch? | Swapped? | Final Amt (A) | Final Amt (B) |  
  - **Calculate averages**:  
    - **Hidden round**: Avg. tokens for "switchers" vs. "non-switchers".  
    - **Announced round**: Avg. tokens for those who *wanted* to switch vs. those who didn’t.  

  ---

  ### **Debrief: Mapping Activity to Paradox** (25 minutes)  
  **Goal**: Connect experiential moments to the paradox’s logical steps.  

  #### **Step 1: Classic Paradox Recap**  
  - **Naive argument**: "If I have X, the other is 2X or X/2 with 50% probability. Expected value of switching = 1.25X → Always switch!"  
  - **Contradiction**: Switching twice implies a guaranteed gain, violating dominance.  

  #### **Step 2: Round 1 (Hidden Distribution) – Feeling the Temptation**  
  - **Student experience**:  
    - Most want to switch, citing "50/50 chance of double/half."  
    - *Data shows*: Avg. tokens for switchers ≈ avg. for non-switchers (≈35 tokens). **No gain from switching!**  
  - **Why it feels right**: Students assume an **implicit uniform prior** over X (all amounts equally likely). But in reality:  
    - P(X=20) = 1/3 (higher than P(X=10)=1/6).  
    - **Flaw exposed**: The "50/50" assumption ignores the prior’s skew.  

  #### **Step 3: Round 2 (Announced Distribution) – Breaking the Illusion**  
  - **Student experience**:  
    - Students with 10/20/40 tokens want to switch (expecting gain); those with 80 refuse.  
    - *Data shows*:  
      - Avg. tokens for "want-to-switch" = (10+20+40)/3 ≈ 23.3.  
      - Avg. tokens for "no-switch" = 80.  
      - **But**: When switches occur, gains/losses cancel (e.g., (10,20) pair: +10 for one, -10 for the other).  
  - **Why it falls apart**:  
    - With a **known prior**, students see the conditional probabilities:  
      - If X=20, P(other=10) = P(pair=(10,20)) = 0.5, P(other=40) = P(pair=(20,40)) = 0.5.  
      - Expected value of switching = 25 (still >20).  
    - **But**: This only holds for non-boundary values. For X=80, switching loses 40 tokens.  
    - **Flaw pinpointed**: The naive argument assumes **P(2X) = P(X/2) = 0.5 for all X**, which requires:  
      - An **unbounded range** (X can be arbitrarily large/small).  
      - An **impossible uniform prior** (cannot exist over an infinite set).  

  #### **Step 4: The Fatal Flaw and Resolution**  
  - **Precise flaw**: The assumption that for every observed X, the other envelope is equally likely to be 2X or X/2.  
    - In a **bounded distribution** (like our activity), this fails at extremes (X=10 or 80).  
    - In an **unbounded world**, it implies an improper prior (e.g., P(X) ∝ 1/X), leading to **infinite expectations**.  
  - **Resolution**:  
    - Switching’s expected gain is **not always positive**; it depends on the prior.  
    - The paradox vanishes when using a **valid prior** (bounded or proper unbounded).  

  #### **What the Data Shows (and Doesn’t)**  
  - **Data shows**: Switching has **no average gain** in aggregate (gains/losses balance).  
  - **Data doesn’t show**:  
    - The **role of infinity** (unbounded distributions make expectations diverge).  
    - The **improper prior** (students must grasp this theoretically).  
  - **Facilitator’s note**:  
    > "In class, we used a bounded prior, so expectations were finite and gains/losses canceled. But in the classic paradox, the prior is *unbounded*. This makes the expected value of X infinite, so comparing 1.25X to X is meaningless—both are infinite! The real flaw is assuming a uniform prior over infinity, which breaks probability axioms."

  ---

  ### **Predictable Challenges & Solutions**  
  1. **Opening envelopes early**:  
     - **Prevent**: Use tamper-evident seals; threaten token forfeiture.  
  2. **Collusion/pair negotiation**:  
     - **Mitigate**: Emphasize **private decisions**; use simultaneous reveal.  
  3. **Confusion in announced round**:  
     - **Clarify**: Provide a worksheet: "Given your token amount, what is P(other=2X)? P(other=X/2)?"  
  4. **Small-sample data noise**:  
     - **Address**: Pre-calculate expected values (e.g., "Theory says avg. tokens = 35"); focus on the logic.  
  5. **Switching mechanics**:  
     - **Simplify**: Use "mutual agreement" rule to avoid unilateral force.  

  ---

  ### **Why This Works**  
  - **Hidden round**: Students *feel* the intuitive pull of the 1.25x argument, but data shows no gain.  
  - **Announced round**: Students *calculate* conditional probabilities, then see the flaw at boundaries.  
  - **Debrief**: Forces confrontation with the impossible prior, moving beyond "math vs. intuition" to a precise, transferable resolution.  

  **Final Tip**: Run a quick "trial round" with one volunteer pair to demo mechanics before starting.
