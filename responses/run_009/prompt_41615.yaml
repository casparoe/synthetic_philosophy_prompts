prompt: |-
  Anglo-American law is strangely two-faced about inaction, and I want to know what view of causation, if any, the pattern presupposes.

  On one hand, the common law imposes no general duty to rescue: a swimmer who watches a child drown ten feet away commits no legal wrong, and courts have said the reason is not merely prudence but principle — the harm was not caused by the bystander. Criminal law treats a doctor who withdraws life support at the patient's competent request very differently from one who administers a lethal injection at the same request, and the standard justification is that the first merely lets the underlying condition do its work while the second causes death — even though both foresee death, both intend it, and the patient ends up dead either way.

  On the other hand, the same legal system has no difficulty treating non-doings as causes when it wants to: products liability makes a manufacturer answerable for failure to warn of a known hazard; a landlord can be liable for failure to repair; negligence law's ordinary 'but for' test seems to make an omission a cause whenever the harm would not have occurred had the omission been repaired. Many European systems go further and criminalize the failure to render easy assistance, with no visible strain on their causal concepts.

  So my questions. Does the killing/letting-die and rescue/no-rescue pattern presuppose that omissions are not causes, or only that they are causes of an inferior kind, or that causal contribution matters only against a background duty? Notice the suspicious coincidence that duties appear exactly where omissions get charged as causes — as if the duty were converting a non-cause into a cause, which suggests causation may be doing no work at all and the practice is a moral classification wearing causal vocabulary. Also notice that if omissions are causes in the plain counterfactual sense, they multiply absurdly: every able spectator at the beach becomes a cause of the drowning, and nothing distinguishes the negligent lifeguard from a stranger on the sand except luck and proximity. Reconstruct the implicit theory — say whether it is a transmission-of-force view, a contrastive view on which causation is relative to a chosen alternative, a norm-sensitive view on which what counts as a cause depends on what someone was supposed to do, or something else — and say which parts of the practice strictly require it and which are underdetermined, compatible with several views. Finally, tell me what would have to change in legal doctrine if the law openly adopted the flat counterfactual view under which every bystander's inaction is among the causes of the harm.
reasoning: |-
  Okay, let me try to unpack this user's query. They're pointing out a contradiction in Anglo-American law regarding inaction. On one hand, there's no duty to rescue, so a bystander isn't legally responsible for not saving someone. Courts say it's because they didn't cause the harm. Doctors withdrawing life support vs. lethal injection is another example—even though both lead to death, the law treats them differently, saying the first just lets nature take its course. 

  On the other hand, in cases like product liability or landlord negligence, failing to act (like not warning about a hazard) is treated as causing harm. The user is noticing that duties seem to pop up exactly when omissions are considered causes. That makes causation look like it's just a cover for moral judgments. Plus, if every omission that could prevent harm is a cause, then every bystander at the beach would be a cause of a drowning, which is absurd. 

  The user wants to know what theory of causation underlies this. Is it that omissions aren't causes, or are they inferior? Or is causation dependent on a duty? They mention possible theories like transmission-of-force, contrastive, or norm-sensitive views. Also, what would change if the law adopted a plain counterfactual view where any inaction that could prevent harm is a cause?

  First, I need to tackle the core issue: the law's inconsistent treatment of omissions. The key here is that causation in law isn't just about counterfactuals. Duty plays a crucial role. In rescue cases, no duty means no liability, so causation isn't even considered. But in product liability, the duty exists, so omission becomes a cause. That suggests causation is secondary to duty. 

  The user suspects that causation is just moral classification in disguise. They're right that duty comes first, and then causation is used to justify liability where duty exists. But causation still has a role—it's a necessary condition. Without actual causation, even with duty, there's no liability. So duty sets the stage, but causation must still be proven within that framework. 

  Regarding theories, the norm-sensitive view makes the most sense. What counts as a cause depends on normative expectations. The transmission-of-force view (like physical pushes) doesn't fit omissions. Contrastive could work but doesn't fully explain duty's role. The norm-sensitive view ties causation to what should have been done, which aligns with legal practice.

  If the law adopted a flat counterfactual view, everything changes. Suddenly, every possible preventer is a cause. Legal doctrines would need massive overhauls—duty would become the sole focus, causation would be everywhere, leading to unjust outcomes. Courts would have to limit liability based on proximity or moral blameworthiness, moving towards European models. But that's a big shift from current principles.

  The user's deeper interest might be in the philosophical underpinnings. They seem to question whether legal causation is just a tool for moral judgments. They might be exploring how law balances moral responsibility with practical limitations. The mention of European systems suggests they're considering alternative frameworks. Their frustration with the inconsistency is palpable, so the answer needs to clarify the implicit structures holding this two-faced approach together.
answer: |-
  The Anglo-American legal system's treatment of inaction reveals a sophisticated, **normatively driven theory of causation** that avoids the pitfalls of a naive counterfactual approach. The pattern presupposes **causal relevance is contingent on duty**, not a metaphysical distinction between acts and omissions. Here's the implicit theory, its application, and the consequences of adopting a flat counterfactual view:

  ### Core Implicit Theory: Norm-Sensitive Causation
  1.  **Duty as the Gatekeeper:** The law does not treat omissions as legally relevant causes *unless and until* a pre-existing duty to act exists. Causation analysis only applies *after* duty is established.
  2.  **Causal Contribution is Duty-Relative:** What counts as a "cause" of harm depends critically on what the actor *was supposed to do*. An omission becomes a legally cognizable cause only when it breaches a duty to intervene. The duty defines the relevant "but-for" scenario.
  3.  **Rejection of Unfiltered Counterfactuals:** The law explicitly rejects the notion that *every* possible preventer is a cause. This avoids the absurdity of infinite causes (e.g., every able-bodied person on the beach causing the drowning) and the problem of "negative causation."
  4.  **Moral/Policy Underpinnings:** The duty requirement reflects foundational liberal principles: individual autonomy, aversion to compelled altruism, and the distinction between harming and not helping. Causation doctrine is structured to operationalize these values.

  ### How This Explains the Pattern
  *   **No General Rescue Duty:** The bystander causes *no harm* (legally) because they owed the child no duty. Their inaction is a "non-cause" *for legal purposes*. The "harm was not caused" statement is shorthand for "no *legally relevant* causation exists *in the absence of duty*." Prudence (floodgates) reinforces this, but the principle is deeper.
  *   **Killing vs. Letting Die:** The doctor withdrawing support *at the valid request* breaches no duty (indeed, fulfills one). The underlying pathology is the sole legally recognized cause. The injecting doctor breaches the duty *not to kill*, making their act the cause. Intention and foresight are insufficient without a breached duty.
  *   **Liability for Omissions Where Duty Exists:**
      *   **Manufacturer:** Duty to warn arises from creating/distributing the product. Failure to warn becomes a legally relevant cause *because of that duty*.
      *   **Landlord:** Duty to repair arises from the lease contract/statute. Failure to repair becomes a legally relevant cause *because of that duty*.
      *   **Negligence "But-For":** The test *assumes a duty*. "But for the defendant's *breach of duty* (which includes omissions where a duty to act exists), would the harm have occurred?" It doesn't ask "but for every possible omission by anyone?"
  *   **European Rescue Laws:** These systems *create a statutory duty* for easy rescue. Once that duty exists, the omission becomes a legally relevant cause of the harm that ensued. The causal concept itself isn't strained; the *duty* is broader.

  ### Addressing Your Observations
  *   **Suspicious Coincidence:** You are largely correct. The duty doesn't magically convert a non-cause into a cause *metaphysically*. Instead, the duty *defines the scope of legally relevant causation*. Causation is doing necessary work *within the duty framework*: if the omission wasn't a but-for cause of the harm *even given the duty*, there's no liability (e.g., the child was already dead when the lifeguard *could* have acted).
  *   **Absurd Multiplicity:** The law *explicitly avoids* this via the duty filter. Only the negligent lifeguard (who had a duty) is a legal cause, not the stranger (who had none). Proximity/luck often *informs the existence of a duty* (e.g., a parent has duty, a stranger doesn't), but it's the duty that ultimately controls causal relevance.

  ### Which Parts of the Practice Require This Theory?
  *   **Strictly Required:**
      *   The absence of a general rescue duty *requires* the norm-sensitive filter to avoid absurd multiplicity and align with liberal principles.
      *   The distinction between killing (breach of core duty) and letting die (no breach, or fulfilling a different duty) *depends entirely* on the duty framework defining causation.
      *   Holding parties liable for omissions in products liability, landlord/tenant, etc., *only works* because a prior duty is established. The "but-for" test alone is insufficient.
  *   **Underdetermined/Compatible:**
      *   The *specific metaphysical justification* for why a *breaching* omission causes harm is less fixed. It could be framed as:
          *   **Contrastive:** "Caused harm *relative to the alternative action required by duty*."
          *   **Norm-Sensitive:** "Omission is a cause *because* it violated a norm requiring intervention."
          *   Even a weak **Transmission/Process** view could be stretched: "The omission allowed the harmful process (drowning, disease) to continue unimpeded *when it had a duty to stop it*." However, the transmission view struggles most with pure omissions.

  ### Consequences of Adopting a Flat Counterfactual View
  If Anglo-American law adopted the view that *every* inaction satisfying "but-for" is a cause ("the harm wouldn't have occurred if *this* person had acted"), the doctrine would require massive, fundamental changes:

  1.  **Causal Overload:** Every person physically capable of preventing harm (and aware of it) would be a "but-for" cause. The drowning child's parents, nearby swimmers, the negligent lifeguard, and the manufacturer of the faulty lifebuoy 100 miles away all become causal contributors.
  2.  **Collapse of Act/Omission Distinction:** Killing vs. letting die becomes harder to distinguish legally, as both the injector and the withdrawer are "but-for" causes. The distinction would rely *solely* on intent and policy, not causation.
  3.  **Duty as the Sole Filter:** Legal analysis would shift dramatically. "Actual causation" would be trivially easy to establish in omission cases. The *entire weight* of limiting liability would fall on:
      *   **Duty:** Radically expanding duties (like European rescue statutes) to avoid holding everyone liable. The *absence of duty* would be the *only* barrier to causal findings for bystanders.
      *   **Proximate Cause:** Using foreseeability, scope of risk, and directness *aggressively* to cut off liability for remote or numerous "but-for" causers. Concepts like "superseding cause" would become crucial.
      *   **Mens Rea/Intent:** Playing a much larger role in distinguishing culpability among the many "causes."
  4.  **Floodgates of Litigation:** Vastly increased potential lawsuits against anyone who "could have" prevented harm but didn't, regardless of relationship or responsibility.
  5.  **Shift Towards European Model:** To avoid chaos, legislatures/judges would likely *have* to codify broad affirmative duties (e.g., easy rescue statutes) and define their limits explicitly, moving closer to civil law systems. Liability would focus on *breach of duty*, with causation becoming a mere threshold easily passed.

  **In essence:** The current Anglo-American practice presupposes a **norm-sensitive view of causation** where omissions only count as legal causes when they breach a pre-existing duty. Duty is logically prior and defines the scope of relevant causal inquiry. Abandoning this for a flat counterfactual view would necessitate a revolutionary expansion of legal duties and a heavy reliance on proximate cause to prevent absurd and unjust outcomes, fundamentally altering the structure of tort and criminal law regarding inaction. The "two faces" are reconciled by understanding that causation is a legal tool applied within a framework defined by normative duties.
