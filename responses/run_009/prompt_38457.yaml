answer: |-
  Below is a complete, runnable activity design for your Arrow's theorem seminar. I've structured it as a facilitator's guide with all materials, timings, and contingency plans. Candidate names are thematic (UK political figures) for engagement: **Theresa (T)**, **Boris (B)**, **Corbyn (C)**, and **Diane (D)**.

  ---

  ### **Activity: The Unbreakable Voting Rule Challenge**
  **Core Idea:** Groups design voting rules that output strict group rankings. They earn tokens (e.g., chocolates) for surviving preference profiles, but pre-ordered profiles progressively break rules violating Arrow’s axioms. The impossibility emerges through failure.

  ---

  ### **Materials & Setup**
  - **Tokens:** 30+ small items (e.g., chocolate coins, poker chips).
  - **Handouts:**
    - **Rule Design Brief** (1 per group, see *Group Instructions* below).
    - **Profile Sheets** (see *Preference Profiles* table).
    - **Debrief Guide** (for you, included in *Debrief Script*).
  - **Grouping:** 3–4 commissions (3–4 students each) for 14 students.

  ---

  ### **Timeline (90 Minutes Total)**
  | Phase | Time | Activity |
  |-------|------|----------|
  | **Intro** | 0–5 min | Explain the challenge: "Design a voting rule for group rankings. Earn tokens when your rule survives a voter profile. Revise if it breaks." |
  | **Rule Design** | 5–20 min | Groups invent rules (strict ranking output, any strict inputs). *No axioms mentioned!* |
  | **Testing Rounds** | 20–65 min | **Round 1:** Profile 1 (all groups survive).<br>**Round 2:** Profile 2 (breaks non-transitive rules).<br>**Round 3:** Profile 3 (breaks non-IIA rules).<br>**Round 4:** Profile 4 (breaks non-monotonic/clone-vulnerable rules).<br>**Round 5+:** Repeat profiles or new (e.g., Profile 5) as groups revise. |
  | **Debrief** | 65–90 min | Structured discussion mapping failures to axioms, emphasising IIA and quantifier shift. |

  ---

  ### **Group Instructions (Handout Text)**
  > "You are an electoral commission designing a **voting rule** for UK leadership contests. Your rule must:  
  > - Accept **any set of strict rankings** (e.g., Theresa > Boris > Corbyn) from ≥3 voters.  
  > - Output **one strict group ranking** (no ties allowed!).  
  >   
  > We’ll test your rule with voter profiles. For each profile:  
  > - If your rule outputs a valid ranking, earn a token.  
  > - If it fails (no output/invalid ranking), revise your rule and try again.  
  >   
  > **Goal:** Survive as many tests as possible. You have 15 minutes to design your rule. Examples:  
  > - *‘Rank by Borda scores.’*  
  > - *‘Pairwise majority with alphabetical tie-break.’*  
  > - *‘Pick a voter at random; use their ranking.’*"

  ---

  ### **Preference Profiles (Ordered to Reveal Axioms)**
  *Present one profile per round. Use these exact tables.*  

  #### **Profile 1: Unanimity Test**  
  *Purpose: Warm-up. All rules should pass (tests Pareto efficiency implicitly).*  
  | Voter | Ranking          |  
  |-------|------------------|  
  | 1     | Theresa > Boris > Corbyn |  
  | 2     | Theresa > Boris > Corbyn |  
  | 3     | Theresa > Boris > Corbyn |  
  **Expected Output:** Theresa > Boris > Corbyn  

  #### **Profile 2: Condorcet Cycle**  
  *Purpose: Breaks pairwise-majority rules (violates transitivity).*  
  | Voter | Ranking          |  
  |-------|------------------|  
  | 1     | Theresa > Boris > Corbyn |  
  | 2     | Boris > Corbyn > Theresa |  
  | 3     | Corbyn > Theresa > Boris |  
  **Breaking Logic:** Cycle (Theresa>Boris, Boris>Corbyn, Corbyn>Theresa) → no transitive ranking.  

  #### **Profile 3: IIA Violation**  
  *Purpose: Breaks point-based/scoring rules (e.g., Borda).*  
  **Sub-Profile 3a** (Candidates: Theresa, Boris, Corbyn)  
  | Voter | Ranking          |  
  |-------|------------------|  
  | 1     | Theresa > Boris > Corbyn |  
  | 2     | Theresa > Boris > Corbyn |  
  | 3     | Boris > Corbyn > Theresa |  
  | 4     | Boris > Corbyn > Theresa |  
  **Borda Output (2,1,0):** Boris (6) > Theresa (5) > Corbyn (1) → **Boris > Theresa**  

  **Sub-Profile 3b** (Candidates: Theresa, Boris, *Diane*)  
  | Voter | Ranking          |  
  |-------|------------------|  
  | 1     | Theresa > Boris > Diane |  
  | 2     | Theresa > Boris > Diane |  
  | 3     | Boris > Theresa > Diane |  
  | 4     | Boris > Theresa > Diane |  
  **Borda Output (2,1,0):** Theresa (6) > Boris (5) > Diane (1) → **Theresa > Boris**  
  **Breaking Logic:** Voters’ Theresa/Boris rankings are identical in both profiles, but group ranking flips → violates IIA.  

  #### **Profile 4: Spoiler/Clone Effect**  
  *Purpose: Breaks plurality-like or non-clone-proof rules.*  
  | Voter | Ranking          |  
  |-------|------------------|  
  | 1     | Corbyn > Diane > Theresa |  
  | 2     | Corbyn > Diane > Theresa |  
  | 3     | Theresa > Boris > Diane |  
  | 4     | Boris > Theresa > Diane |  
  **Plurality Output:** Corbyn: 2, Theresa: 1, Boris: 1, Diane: 0 → Corbyn wins.  
  **Breaking Logic:** If Diane withdraws, Voter 1–2’s votes shift to Corbyn, but Voter 3–4 rank Theresa > Boris → Corbyn still wins. *But*: Diane splits the left-wing vote, helping Corbyn.  

  #### **Profile 5: Unanimity Pressure**  
  *Purpose: Backup; breaks rules ignoring unanimity or poorly handling ties.*  
  | Voter | Ranking          |  
  |-------|------------------|  
  | 1     | Boris > Theresa > Corbyn |  
  | 2     | Boris > Theresa > Corbyn |  
  | 3     | Theresa > Boris > Corbyn |  
  **Breaking Logic:** All agree Corbyn is worst. Rules failing to rank Boris>Theresa or put Corbyn last may violate unanimity.  

  ---

  ### **Debrief Script (25 Minutes)**  
  **Goal:** Connect failures to axioms, spotlight IIA, and contrast Condorcet/Arrow.  

  #### **Step 1: Map Profiles to Axioms (10 min)**  
  - *Profile 1 (Unanimity):* "Why did all rules pass? Because **unanimity** seems obvious—but what if we drop it?"  
  - *Profile 2 (Cycle):* "Rules using pairwise votes failed here. Why? The **Condorcet paradox** isn’t fixable without sacrificing transitivity or voter input."  
  - *Profile 3 (IIA Violation):* "Rules like Borda failed on identical Theresa/Boris rankings. Why? **Independence of Irrelevant Alternatives (IIA)** forces group rankings to depend only on head-to-head preferences. Diane was ‘irrelevant’ to Theresa vs. Boris, yet changed the outcome!"  
    - 🔑 **Emphasise:** "IIA is the silent killer. It’s why no ‘fair’ rule works—we’re tempted to relax it, but then outcomes become manipulable."  
  - *Profile 4 (Spoiler):* "Plurality rules failed because **clones/spoilers** split votes. This violates monotonicity (ranking Diane higher shouldn’t hurt Theresa) or IIA."  

  #### **Step 2: Condorcet vs. Arrow (5 min)**  
  - "The cycle (Profile 2) shows *one bad profile* for pairwise voting. Arrow is worse: for *any* non-dictatorial rule satisfying unanimity and IIA, **there exists a breaking profile**. It’s not about finding a ‘good’ rule—it’s impossible!"  
  - **Quantifier exercise:** Ask groups to rephrase Arrow as: "For every rule, there exists a profile where..." → cement ∀∃ order.  

  #### **Step 3: Escape Hatches & Edge Cases (10 min)**  
  - **Dictatorship:** "If a group proposed a chairperson breaking ties, is that dictatorship? *Yes, if they override votes. No, if they only resolve true ties (but then the base rule might still break).*"  
  - **Domain Restriction:** "If a commission said, ‘Our rule only works if no cycles,’ that’s **domain restriction**—a real escape hatch! But in complex elections, can we guarantee no cycles or clones?"  
  - **Dropping Axioms:** "Which axiom feels most ‘droppable’? IIA? But then Diane can swing Boris vs. Theresa. Unanimity? Then we ignore consensus."  

  ---

  ### **What This Activity Cannot Convey**  
  1. **Arrow’s proof mechanics:** The construction of pivotal voters/decisive coalitions is omitted.  
  2. **Weak vs. strict rankings:** We require strict outputs, but Arrow holds for weak orders too.  
  3. **Cardinal vs. ordinal:** Arrow applies only to ordinal preferences. Cardinal utilities escape impossibility.  
  4. **Other axioms:** Limited Pareto efficiency focus; no coverage of non-dictatorship’s formal definition.  
  5. **Real-world complexity:** Profiles are simplified; real elections involve strategic voting, incomplete info, and >4 candidates.  

  ---

  ### **Pitfalls & Mitigations**  
  | Risk | Mitigation |  
  |------|------------|  
  | **Group proposes ‘chairperson rule’** | Lean in: "Does the chair override votes? If so, it’s dictatorship! If not, test it on the cycle profile." |  
  | **Domain restriction attempts** | Celebrate: "Ah, you’ve found domain restriction! But what if voters *do* submit a cycle? Is your rule defunct?" |  
  | **Rule too complex to test quickly** | Cap design time; suggest: "Start simple (e.g., Borda/Copeland) and iterate." |  
  | **One group survives all profiles** | Likely a dictatorship. Debrief: "It ‘works’ but violates non-dictatorship. Is that democratic?" |  
  | **Students fixate on ‘fairness’ not axioms** | Redirect: "What *properties* make a rule ‘fair’? Let’s name them (IIA, etc.)." |  

  ---

  ### **Profile Tables (For Immediate Use)**  
  Print these for each round:  

  **Profile 1**  
  | Voter | Ranking          |  
  |-------|------------------|  
  | 1     | Theresa > Boris > Corbyn |  
  | 2     | Theresa > Boris > Corbyn |  
  | 3     | Theresa > Boris > Corbyn |  

  **Profile 2**  
  | Voter | Ranking          |  
  |-------|------------------|  
  | 1     | Theresa > Boris > Corbyn |  
  | 2     | Boris > Corbyn > Theresa |  
  | 3     | Corbyn > Theresa > Boris |  

  **Profile 3a**  
  | Voter | Ranking          |  
  |-------|------------------|  
  | 1     | Theresa > Boris > Corbyn |  
  | 2     | Theresa > Boris > Corbyn |  
  | 3     | Boris > Corbyn > Theresa |  
  | 4     | Boris > Corbyn > Theresa |  

  **Profile 3b**  
  | Voter | Ranking          |  
  |-------|------------------|  
  | 1     | Theresa > Boris > Diane |  
  | 2     | Theresa > Boris > Diane |  
  | 3     | Boris > Theresa > Diane |  
  | 4     | Boris > Theresa > Diane |  

  **Profile 4**  
  | Voter | Ranking          |  
  |-------|------------------|  
  | 1     | Corbyn > Diane > Theresa |  
  | 2     | Corbyn > Diane > Theresa |  
  | 3     | Theresa > Boris > Diane |  
  | 4     | Boris > Theresa > Diane |  

  **Profile 5**  
  | Voter | Ranking          |  
  |-------|------------------|  
  | 1     | Boris > Theresa > Corbyn |  
  | 2     | Boris > Theresa > Corbyn |  
  | 3     | Theresa > Boris > Corbyn |  

  ---

  This design forces students into the "aha!" moment of Arrow’s theorem through failure. The profiles are optimised to kill specific rules while feeling realistic, and the debrief explicitly tackles IIA’s role and domain restriction. Run it straight from this sheet!
