  Okay, let me start by unpacking the user's query. They're a cognitive science student about to choose a dissertation topic, drawn to evolutionary psychology but concerned about criticisms like just-so stories and unfalsifiability. They want clear criteria to evaluate hypotheses in this field.

  First, I need to understand their main request: a set of desiderata that an evolutionary psychology hypothesis must meet to be scientific, not just a plausible narrative. They provided specific concerns, like post-hoc explanations, vague ancestral environments, and lack of quantitative predictions. They also mentioned deeper issues like the adaptationism debate and potential conflicts between criteria.

  The user seems frustrated by the lack of clear standards in the field. They’re wary of committing years to a dissertation only to face criticism. Their explicit need is a checklist, but implicitly, they want confidence that their work will be taken seriously and withstand scrutiny. They might also be seeking validation of their concerns about evolutionary psychology's scientific rigor.

  Looking at their listed suspicions: falsifiability, independent environment constraints, effect size predictions, distinguishing selection from current function, and alignment with quantitative genetics. These are all valid points. I should address each, noting which are non-negotiable versus contentious.

  The user mentioned the adaptationism debate. I need to clarify that some criticisms are methodological, while others stem from differing theoretical stances. For example, demanding all traits be adaptations is a camp-specific view, but testability is universal.

  Assessing conflicts between criteria: Predicting counterintuitive results vs. anchoring in ancestral environments. While intuitive predictions are weak, surprising findings can still stem from evolutionary constraints if the hypothesis is well-grounded. They’re not inherently opposed but require careful hypothesis construction.

  For existing research programs: Massive modularity might struggle with falsifiability if modules aren't specified. Costly signaling often makes testable predictions but can be post-hoc. Life-history strategies vary in how well they define environmental parameters.

  Non-negotiables would include falsifiability, independent evidence for the EEA, and alignment with plausible evolutionary timelines. Effect sizes and separating function from current use are important but might be context-dependent.

  Finally, I should reassure the user that rigorous evolutionary psychology is possible but requires meeting these criteria. Highlighting examples like kinship detection studies shows how predictions can be specific and testable.
answer: |-
  Here is a specification of desiderata for rigorous evolutionary psychological hypotheses, designed to answer the "just-so story" charge. I'll define each requirement, its rationale (failure mode), mark non-negotiables (★), flag contentious/"camp" items, discuss conflicts, and briefly evaluate major programs.

  ### Core Desiderata (Non-Negotiables ★)

  1.  **★ Pre-Specified Falsification Criteria:**
      *   **Requirement:** The hypothesis must explicitly state *in advance* specific, observable empirical findings that would contradict or significantly weaken it. Must go beyond "it wouldn't work" to concrete, unexpected data patterns.
      *   **Rationale/Failure Mode:** Prevents post-hoc invocation of "byproducts," "exaptations," or alternative evolutionary forces (e.g., drift, constraints) *after* data arrives to salvage the adaptationist claim. This is the core "unfalsifiable" criticism.
      *   **Application:** Look for papers stating: "If we find [X pattern] in population Y under condition Z, this hypothesis is falsified." Avoid papers saying findings are "consistent with" the hypothesis without stating what *wouldn't* be.

  2.  **★ Independent Constraint of the Environment of Evolutionary Adaptedness (EEA):**
      *   **Requirement:** The hypothesized selective pressure(s) must be anchored in evidence *independent* of the trait/behavior being explained (e.g., paleoecology, archaeology, hunter-gatherer ethnography, comparative primatology, genetics). The EEA cannot be *defined solely* by the trait it purportedly explains.
      *   **Rationale/Failure Mode:** Prevents the EEA from being a "free parameter" retrofitted to make any trait look adaptive. A hypothesis that *only* infers the EEA from the trait itself is circular and untestable.
      *   **Application:** Does the paper cite evidence for the proposed selective pressure (e.g., specific predation risks, resource fluctuations, social structures) *separately* from the data on the psychological mechanism? Or is the pressure inferred *only* from the mechanism's existence/function?

  3.  **★ Plausibility within Evolutionary Timelines & Genetics:**
      *   **Requirement:** The hypothesis must be consistent with known constraints on the pace of selection. This includes the heritability of the relevant variation, the strength and stability of the proposed selection pressure, the population size, and the time available since the pressure emerged.
      *   **Rationale/Failure Mode:** Prevents claims of adaptation to pressures that arose too recently (e.g., complex adaptations to agriculture in 10k years), or for traits with low heritability where selection couldn't act effectively. Ignores basic population genetics.
      *   **Application:** Does the paper discuss the timeframe? Does it assume selection on a trait with likely low heritability (e.g., highly culturally influenced complex behaviors) without justification? Does the proposed pressure have evidence of sufficient duration and stability?

  ### Highly Recommended Desiderata (Strong Guardrails Against Weak Science)

  4.  **Predictions Beyond Simple Direction (Ideally Effect Sizes/Orderings):**
      *   **Requirement:** Predictions should specify not just the *direction* of an effect (e.g., "people prefer X over Y"), but ideally the *relative magnitude* of effects across different conditions, populations, or stimuli, or a specific *ordering* of responses.
      *   **Rationale/Failure Mode:** Directional predictions matching folk intuitions (e.g., "people fear snakes more than flowers") are weak and easily explained by numerous non-evolutionary accounts. Predicting *specific patterns* (e.g., "fear acquisition is faster for snakes than guns, despite modern relevance") is stronger and less susceptible to post-hoc storytelling.
      *   **Application:** Does the prediction state *which* condition should show the *strongest/weakest* effect? Does it predict an interaction? Or just "Group A will score higher than Group B"? The latter is much weaker evidence for an evolved mechanism.

  5.  **Distinguishing "Adapted Function" from "Current Manifestation":**
      *   **Requirement:** Clearly separate the hypothesis about the trait's *original selected function* (what it was *for* in the EEA) from descriptions of what the trait *does now* or its current consequences. Avoid using the adaptationist explanation simultaneously as a causal account and a normative justification ("is" vs. "ought").
      *   **Rationale/Failure Mode:** Prevents confusing the evolutionary *origin* of a mechanism with its *current operation* or *moral status*. Prevents the "naturalistic fallacy" and ensures the hypothesis is about historical causation, not present-day determinism or justification.
      *   **Application:** Does the paper clearly state the hypothesized *selected function* (e.g., "detect potential cheaters in small-scale reciprocal alliances") separately from describing what the mechanism does now (e.g., "causes suspicion in modern economic games")? Does it slip into implying current behavior is "right" or "inevitable"?

  ### Contentious / "Camp" Related Items (Handle with Awareness)

  6.  **Requiring Adaptationist Explanations as Default (The "Adaptationist Programme" Stance):**
      *   **Nature:** This is the view that seeking adaptive function should be the *primary* or *first* explanatory strategy for traits (associated with strong adaptationism). Treating non-adaptive explanations (byproducts, constraints, drift) as inherently less parsimonious or requiring special justification.
      *   **Rationale (Proponents):** Natural selection is the only known process creating complex functional organization. Assuming adaptation is the most productive heuristic.
      *   **Critique/Rationale (Opponents):** This can bias research towards finding adaptive stories even where none exist, neglecting other important evolutionary forces and historical contingencies. Not all traits are adaptations. **This is a *heuristic preference*, not a fundamental requirement for empirical science.** A hypothesis can be rigorously tested *without* assuming adaptationism is the only valid approach. ★Requirement #1 (falsifiability) is essential regardless of stance here.

  ### Conflicts Between Desiderata?

  *   **Surprising Predictions vs. EEA Anchoring:** There's *tension*, but not inherent contradiction. The key is generating surprising predictions *from* the independently constrained EEA.
      *   *Example:* Independently establishing ancestral paternity uncertainty was a stable pressure → Predicts *specific, non-intuitive* cues modern humans use (or don't use) for paternal resemblance detection, differing from maternal detection mechanisms. The surprise comes from the *specific mechanistic implementation* predicted by EEA constraints, not from ignoring the EEA.
      *   *Conflict Avoidance:* Ground the surprising prediction *directly* in the logic of the independently established EEA pressure. Avoid "surprise for surprise's sake."

  ### Brief Evaluation of Major Programs Against Core Desiderata

  *   **Massive Modularity:** Often struggles most with **★#1 (Falsification)** and **★#2 (EEA Constraint)**. What specific, falsifiable predictions distinguish a "module" from a general learning mechanism shaped by evolution? Defining the EEA for countless specific modules is challenging. **★#3 (Timelines)** can also be problematic for highly specific, complex modules proposed for recent challenges.
  *   **Costly Signaling (Cooperation/Display):** Generally strong on **★#1 (Falsification)** – specific predictions about when signals should be costly, who pays costs, and how honesty is maintained are often made and tested. **#4 (Beyond Direction)** is common (e.g., *how much* cost is needed). Can sometimes be weak on **★#2 (EEA Constraint)** – is the *specific* proposed signal cost/benefit structure independently grounded, or inferred from the behavior? **★#3 (Timelines)** needs consideration for stability.
  *   **Life-History Theory Approaches:** Often strong on **★#3 (Timelines/Genetics)** as it draws directly on formal evolutionary theory. **★#2 (EEA Constraint)** can be good if environmental unpredictability/mortality risks are independently established. **★#1 (Falsification)** and **#4 (Beyond Direction)** vary; predicting *shifts* along fast-slow continua is common, but predicting *specific magnitudes* of psychological responses can be challenging. **#5 (Function vs. Manifestation)** is crucial to avoid determinism.

  ### Conclusion

  A rigorous evolutionary psychology hypothesis is **non-negotiable** on pre-specified falsifiability, independently constraining the EEA, and respecting evolutionary timelines/genetics (**★1, ★2, ★3**). Strong science further demands predictions beyond simple direction (**#4**) and clarity on historical function vs. current manifestation (**#5**). Treating adaptationism as the *only* valid approach (**#6**) is a contested heuristic, not a core scientific requirement. Tension exists between surprise and EDA anchoring but can be managed. Existing programs vary; **costly signaling often scores well on testability, life-history on theoretical grounding, while massive modularity faces the biggest challenges on specificity and falsifiability.** Use this list to dissect papers: Does it state *how it could be wrong*? *Where* does its EEA evidence come from? *What* does it predict beyond the obvious?
