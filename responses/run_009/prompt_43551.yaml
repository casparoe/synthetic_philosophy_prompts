prompt: |-
  I'm taking a philosophy of biology seminar this term and we just finished the function wars — the Cummins-style causal-role / functional-analysis picture on one side and the selected-effects people (Millikan, Neander, that crowd) on the other. My labmate in the cardiac systems group has been winding me up for two weeks with an argument she says kills the causal-role account, and I honestly can't find the hole in it, which bothers me because the conclusion feels wrong in a way I can't articulate. Please act like a professional philosopher of biology who has taught this debate for years and knows the literature cold — think carefully before you commit to anything, maybe brainstorm the diagnosis privately first, because I suspect the trap is somewhere in the middle of the chain rather than at the ends. Here is her argument, as best I can reconstruct it: (1) On the causal-role analysis, part X has function F relative to a containing system S when X's doing F causally contributes to some capacity C of S that we set out to analyze. (2) Crucially, the analysis itself places no restriction on which S or which C counts — that's supposed to be the whole point of defining function via causal contribution to system capacities rather than via purposes, design, or history. (3) The heart's pumping contributes to the circulatory system's capacity to move blood around the body, so pumping blood is a function of the heart. (4) But the heart also produces audible sounds, and those sounds causally contribute to the capacity of a doctor-plus-stethoscope-plus-patient diagnostic system to detect valve defects. (5) So on the very same analysis, producing sounds for auscultation is a function of the heart. (6) And don't bother patching it by decreeing that only the organism's own capacities count — that restriction is either ad hoc or quietly smuggles back the teleology the analysis was built to avoid, since biologists legitimately analyze supra-organismal systems all the time (ecosystem function talk, microbiome talk). (7) Yet saying the heart's function is to make diagnostic sounds isn't just odd, it's false the way byproduct attributions are false — hearts were making noise for hundreds of millions of years before anyone auscultated one, and cardiologists merely exploited a side effect. (8) Therefore the causal-role account of function is false. She also throws in a kicker I'd like you to address: whatever escapes this trap on the causal-role side falls into a mirror trap on the selected-effects side, because a trait selected for one thing and later co-opted for something completely different (she keeps gesturing at feathers, thermoregulation into flight) gets attributed the wrong function or no function at all on the historical account. So: which step do I reject, why did that step look fine to begin with, and what does rejecting it cost me? For what it's worth I'd most like to keep (2) and (7) if that's even coherent — but tell me honestly if I have to pay in a direction I don't want to, and don't go easy on the mirror-trap question just because I hate her answer to it.

  For the format: give me your actual reasoning first, in a few paragraphs of normal prose — I want to follow the diagnosis, not just recieve it — and then finish with a JSON object with exactly these fields: "rejected_step" (the number and a one-line statement of the step you'd give up), "diagnosis_type" (whether the argument has a subtle flaw like an equivocation between steps, or is valid and just forces a cost somewhere), "why_it_looked_fine" (a sentence or two), "cost_table" (an array of objects, one for steps 2, 5, and 7, each with fields "step" and "cost_of_rejecting"), "mirror_trap_verdict" (whether the selected-effects account really escapes, and if so how), and "bottom_line" (two sentences max, where you'd tell me to put my money). Please make sure the JSON parses — my study group feeds these into a grader script.
