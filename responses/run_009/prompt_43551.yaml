  **Explanation of Costs**:  
  - Rejecting (2) guts CR's defining feature (context-relativity).  
  - Rejecting (5) demands clearer "system" criteria but avoids teleology.  
  - Rejecting (7) abandons a key intuition CR *should* explain (byproduct asymmetry).  

  **Mirror Trap**: SE accounts avoid fatal error by allowing traits to have multiple historical functions (e.g., feathers: thermoregulation *then* flight). CR’s problem is deeper — it risks attributing functions to *any* causal side effect.
