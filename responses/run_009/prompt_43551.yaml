      {"step": 7, "cost_of_rejecting": "Loses the strong intuition that historical precedence matters for function attributions."}
    ],
    "mirror_trap_verdict": "Selected-effects accounts escape via functional pluralism (original vs. derived functions), though debates persist about novel exaptations.",
    "bottom_line": "Reject step (5) by insisting systems must constitutively integrate their parts. Pay the cost of refining 'system' but preserve CR’s anti-teleological core. On exaptations, SE survives better than CR fails here."
  }
