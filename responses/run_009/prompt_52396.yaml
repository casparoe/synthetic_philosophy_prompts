  ## Wedding Ceremony for Dana & Marcus

  **(Processional concludes. Officiant addresses all.)**

  **Officiant:** Friends, family, beloved sangha, esteemed colleagues, and cherished grandmothers – welcome. We gather in this moment, suspended between breaths, to witness and celebrate Dana and Marcus. They stand before you, not as fixed monuments, but as vibrant, unfolding patterns – she, through the quiet wisdom of Zen practice; he, through the illuminating lens of cognitive science. Remarkably, their paths converged on a shared understanding: that the 'self' we grasp at is more river than stone, more dynamic process than static entity. Today, they choose to navigate that river together. This ceremony honors that profound truth. It won’t pretend permanence where there is flow, nor will it diminish the profound significance of the commitment they make *right now*, in this present awareness. It’s a commitment rooted not in illusion, but in clear seeing and deep affection.

  **Address:** Dana and Marcus, your journey to this point is a testament to the beauty found when different ways of knowing illuminate the same essential truth. Dana, your years on the cushion reveal the luminous emptiness beneath the story of self. Marcus, your research unveils the intricate, ever-updating dashboard the brain constructs. You’ve both seen, in your own ways, the absence of a singular, unchanging captain steering the ship. Yet, here you stand, choosing to sail alongside each other. This isn’t a denial of love’s depth; it’s perhaps its deepest affirmation. It’s a love that sees clearly – the impermanence, the conditions, the constantly shifting models – and says *yes* anyway. It chooses connection *within* the flow, not despite it.

  Your commitment today isn't about binding two frozen essences for all time. That would be impossible, and frankly, less interesting than the reality! It’s about the intention, held fiercely in this present moment, to continuously choose each other. It’s a promise made *by* the selves of this moment, *to* the selves of this moment, with a profound trust placed in the causal and narrative threads that will weave the future versions of Dana and Marcus. It’s a commitment to nurture the conditions – kindness, respect, curiosity, patience, shared laughter – from which love naturally arises, moment by moment. Your vows are the compass you set *now*, trusting that future iterations, born of this care and this history, will recognize its true north.

  **(To Guests):** For those wondering how a promise holds without an unchanging promiser, or whether love is real without a solid self to anchor it, consider this: Isn’t a promise made *now*, with full awareness of life’s flux, perhaps the most sincere promise of all? It’s made without blind faith in permanence, but with clear-eyed intention and trust in the process. And love? Love isn't diminished by understanding its conditions; it’s amplified. The care, the tenderness, the joy shared between Dana and Marcus – experienced *here, now* – is as real and vital as anything can be. Their love isn't *owned* by a static self; it’s the dynamic, precious expression of their connection in this ever-changing life.

  **Humor Moment:** Marcus, you’ve often quipped that the self is the brain’s user interface, a dashboard rather than a driver. Dana, you’d likely agree from the vantage point of zazen. So, perhaps we can all agree that today isn’t about merging two dashboards into one super-dashboard – Dana has wisely vetoed that bigger illusion! It’s about ensuring these two complex, beautiful systems – whoever is *currently* piloting them – choose to run compatible software, share vital data streams of affection and respect, and navigate towards shared horizons. May your dashboards always display ample bandwidth for communication and a fully charged battery of patience! *(Pause for gentle laughter, especially from the grad students and hopefully a grandmotherly chuckle)*.

  **The Vows (Dana & Marcus repeat after Officiant):**

  > "Dana/Marcus, standing with you in this present awareness,
  > I see the flow, the change, the conditions that shape us.
  > Knowing I am not fixed, and knowing you are not fixed,
  > I make this promise not to an unchanging essence, but to the dynamic pattern that is you, here and now.
  >
  > I vow to meet each unfolding moment with you
  > With kindness as my intention,
  > With honesty as my guide,
  > With respect as my foundation.
  >
  > I vow to nurture the conditions between us –
  > For understanding to grow,
  > For joy to arise,
  > For challenges to be met with shared strength.
  >
  > I vow to choose connection, again and again,
  > To honor the narrative we co-create,
  > To tend the causal stream that flows from this commitment,
  > So that whoever stands where we stand in time to come
  > Will find the path marked by this love, this care, this conscious choice.
  >
  > This is my promise, made with clear seeing and an open heart,
  > For as long as our paths beautifully intertwine."

  **Ring Exchange:**

  **Officiant:** These rings are circles, symbols of wholeness and cycles, not of confinement. They have no beginning and no end, reflecting the boundless nature of awareness and the continuous flow of cause and effect. They are tangible reminders of this moment of choice, worn as a visible sign of the intention nurtured within.

  *(Officiant hands ring to Marcus)*
  **Marcus:** Dana, I offer you this ring.
  A symbol not of possession, but of presence.
  A reminder of this commitment made in clarity,
  Worn as we navigate the unfolding journey together.
  **Officiant:** *(Hands ring to Dana)*
  **Dana:** Marcus, I offer you this ring.
  A symbol not of binding, but of connection.
  A reminder of this intention held in awareness,
  Worn as we meet each moment, pattern to pattern.

  **Pronouncement:**

  **Officiant:** Dana and Marcus, you have declared your conscious intention before this gathering. You have made vows rooted in the truth of impermanence and the power of present-moment commitment. You have exchanged symbols of your choice to journey together. Therefore, with profound joy and recognition of this luminous, unfolding reality...

  **I now pronounce you partners in unfolding!**

  **May your awareness of impermanence deepen your joy in this moment!** *(Let the guests applaud/celebrate)*

  **Vow strategy:** Ground promises in present-moment intention and actionable commitments to nurture conditions, explicitly acknowledging the future fulfillment relies on conscious continuity by evolving selves rather than binding a static entity.
