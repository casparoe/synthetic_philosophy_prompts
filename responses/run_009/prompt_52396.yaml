  Okay, the user needs a wedding ceremony script that respects both Dana's Zen practice and Marcus's neuroscience views on no-self (anatta). Let me start by understanding their core challenge: traditional vows assume a permanent self, but both see identity as fluid. Dana through Zen, Marcus through cognitive science. The ceremony must avoid implying enduring selves without making vows seem meaningless.

  First, the key elements: processional, address, vows, ring exchange, pronouncement. Need to address both families - Zen practitioners and Catholic relatives. The humor must bridge both groups. Also, no merging metaphors - Dana vetoed "two becoming one." The pronouncement should work as a celebration and a koan.

  For the vows, the strategy is to frame them as commitments to current intentions and actions, acknowledging future changes. The promise is made by the present self-models, with the understanding that they'll be upheld by future iterations. This keeps the vows meaningful without relying on an unchanging essence.

  Humor moment: Marcus's joke about the self being a dashboard. Can use that here - "whoever is currently piloting" to lighten the mood. It's a nod to his work and accessible to both sides.

  Ring exchange: rings as symbols of continuity, not ownership. "Patterns meeting patterns" for the Zen side, "visible sign of love" for the Catholic family. 

  Pronouncement needs dual interpretation. "I now pronounce you partners in unfolding" - partners is traditional, unfolding implies process. The closing line: "May your awareness of impermanence deepen your joy in this moment." Catholic side hears joy, Zen side hears impermanence as a koan.

  Address to guests should explain the paradox. Compare vows to a river's path - the water changes, but the direction remains. Reassure the Catholic grandmother that love isn't negated by no-self; it's about current commitment. 

  Check constraints: no merging metaphors? Avoid "become one." Vows clarify promisor as present self, binding through intention and action. Humor with the dashboard joke. Pronouncement works both ways. Word count around 800-900. 

  Potential pitfalls: Making vows sound temporary. Emphasize that commitment is real, even if selves change. Reassure about love's continuity. Also, ensure the language isn't too technical for either group. Keep it poetic but clear. 

  Finally, the summary: Vow strategy is to ground promises in present intention and actionable commitments, acknowledging their fulfillment by future selves through conscious continuity.
