prompt: |-
  so I'm a software engineer, zero formal philosophy background, but I stumbled onto speech act theory a few weeks back (austin's how to do things with words, or at least a video about it) and I've been chewing on an objection ever since. I want to practice defending my take against someone sharp. Play a committed defender of performatives — someone who genuinely believes that saying "I promise" or "I do" *does* something, doesn't just describe a state of affairs. Don't be a strawman, you can concede small points but never the core claim that the utterance itself is doing real work. Stay in character until I say stop, and keep replies to about a paragraph so this feels like a conversation and not a lecture.

  here's my opening: I write smart contracts for a living. when someone calls transfer() on a contract, the code just executes — no utterance, no speaker, no felicity conditions, just deterministic state changes. to me all the classic performatives look like this: the words are a trigger for a state change that's defined elsewhere. "I now pronounce you married" is basically an API call where the officiant happens to hold the right permissions. the utterance isn't doing anything, the institution is — the words are just the button you press. and thats exactly why your "misfires" (wrong speaker, wrong context) are just failed precondition checks, like reverting a transaction, not some special philosophical category. so my question: once you grant all that machinery, what's left for the words themselves to do?
reasoning: |-
  Okay, the user is a software engineer with no formal philosophy background who stumbled upon speech act theory, particularly Austin's "How to Do Things with Words." They've been thinking about an objection and want to practice defending their take against a committed defender of performatives. Their main argument is that performative utterances like "I promise" are just triggers for institutional state changes, similar to API calls in smart contracts. They want me to role-play as a defender of performative utterances, sticking to the core claim that the words themselves do real work.

  Hmm, the user's analogy to smart contracts is interesting. They see "I now pronounce you married" as an API call where the officiant has permissions, and misfires as failed preconditions causing a revert. Their challenge is essentially: if institutions handle all the actual work, what's left for the words to do? I need to counter this while staying true to Austin's core premise that utterances themselves constitute actions.

  Right, I should start by acknowledging the institutional machinery they mention—yes, permissions and contexts matter—but then pivot to what makes language unique. The key distinction is that institutions are built *from* speech acts, not separate from them. Marriage exists *because* we collectively agree that certain words under certain conditions create it. Whereas smart contracts are deterministic code executing predefined rules. 

  The user might be missing how language creates social reality in the first place. A transfer() function merely modifies existing states within a system, but "I promise" generates a new moral obligation that didn't exist before. Even if permissions are required, the utterance is the *moment* where abstract rules become concrete reality. Also, smart contracts lack the illocutionary force—the speaker's intention and audience's recognition—that breathes life into performatives. 

  I should avoid lecturing and keep it conversational. Their API analogy is clever, so I'll concede the surface similarity but drill into why words aren't just buttons. Maybe emphasize that without the utterance, the institutional fact (marriage, promise) remains unrealized—it's the spark, not just the trigger. And misfires matter because they reveal the dependency on human interpretation, unlike binary code reverts. 

  User seems to enjoy the debate framing ("play a committed defender"), so I'll stay in character firmly but politely. Since they're sharp and technical, I can use their smart contract example against them: if we imagine a world without language, could institutions exist at all? Probably not—so words are foundational, not decorative. 

  Also noting they want "replies to about a paragraph"—so keep it tight. End with a question to keep the convo flowing: "Without the utterance, what exactly *is* a promise?" That challenges their reductionist view.
answer: |-
  Your smart contract analogy is sharp—I'll grant that institutions provide the scaffolding. But you're conflating the *mechanism* with the *act itself*. When code executes `transfer()`, it's manipulating pre-defined states within a closed system. The institution *is* built from speech acts! "Marriage" isn't a physical object; it's a social reality *constituted* by utterances like "I do." Before those words, the "institution" is just abstract rules. The utterance *instantiates* the marriage, making the abstract concrete. Your officiant's "API call" works *only* because we've collectively agreed that saying those words *is* the act of marrying. 

  The words aren't just a button—they're the *ritual* that transforms status. A precondition check failing in code *reverts* a transaction, but a misfire (e.g., saying "I do" to your barista) doesn't just abort—it exposes the *social* dependency. The utterance doesn't merely trigger; it *embodies* the convention. Without the performative utterance, what *is* a promise? A silent intention? Intention alone doesn’t create obligation—the *declaration* does. So: if the institution is the hardware, aren’t the words the voltage that brings it to life?
