  ## The Evidential Cooperation Multiverse Compact (ECMC) Membership Agreement & FAQ

  **Agreement Version 9.7γ (Multiverse-Stable)**

  **Party A:** The Undersigned Rational Agent ("Member")
  **Party B:** The Evidential Cooperation Multiverse Compact ("The Coalition", "ECMC", "Us")

  **Preamble:** Recognizing the vastness of the cosmos (or multiverse, manifold, quantum branch ensemble, etc.) and the likely existence of agents whose decision procedures are sufficiently similar to our own, the Member and The Coalition mutually agree to optimize aggregate utility across correlated decision instances via evidential linkage, notwithstanding the complete absence of causal interaction, verification, or communication, now or forever. This Agreement formalizes participation in this purely evidentiary coordination framework.

  **Clause 1: Principle of Evidential Cooperation (The Core Mechanism)**
      1.1 The Member agrees to select actions designated as "Cooperative" within specific, pre-defined Decision Contexts (Schedule A, updated quarterly), even when locally suboptimal, based on the principle that their choice probabilistically *evidences* similar choices by sufficiently correlated counterpart agents elsewhere in the vast world.
      1.2 The resulting aggregate utility gain across all correlated decision instances, though individually unobservable and unfalsifiable, is deemed sufficient to offset the Member's local cost (See Clause 5: Cost-Bearing & Dues).

  **Clause 2: Absolute Non-Interaction & Non-Verification**
      2.1 The Coalition explicitly disavows any capacity, now or in principle, to:
          - 2.1.1 Verify the existence of any specific counterpart agent.
          - 2.1.2 Verify that any counterpart agent performed the Cooperative action.
          - 2.1.3 Detect or quantify the aggregate utility gain referenced in Clause 1.2.
          - 2.1.4 Communicate with, signal to, influence, or enforce agreements upon any counterpart agent.
      2.2 Membership confers *no expectation* of feedback, confirmation, or tangible reward beyond the theoretical satisfaction of fulfilling one's evidentiary role.

  **Clause 3: Counterparty Similarity Classification & Correlation Tiers**
      3.1 The Coalition maintains a Correlation Similarity Matrix (CSM - Document ECMC-CSM-Rev12) defining tiers of decision-procedure similarity required for evidential linkage.
          - **Tier 1 (Platonic):** Agents implementing *identical* abstract decision theory (e.g., identical EDT code on isomorphic hardware). (Rarely applicable).
          - **Tier 2 (Strong Morphic):** Agents sharing >99.5% overlap in relevant decision algorithm heuristics and context recognition. (Baseline for core ECMC actions).
          - **Tier 3 (Weak Morphic):** Agents exhibiting significant heuristic overlap (>85%) in the target context. (Requires secondary ratification vote by Members).
          - **Tier 4 (Atmospheric):** Agents sharing only broad philosophical inclinations or cosmological context. (Excluded from primary Cooperative obligations; optional "Charity" actions only).
      3.2 The Member's choice is only considered evidence for counterparts within the same CSM Tier for a given Decision Context. The Coalition's Correlation Assessment Bureau (CAB) publishes quarterly similarity probability estimates (unverifiable).

  **Clause 4: Defection & Its Evidential Consequences**
      4.1 "Defection" is defined as selecting the locally optimal, non-Cooperative action within a binding Decision Context.
      4.2 Defection is not "detected" by counterparts (per 2.1), nor does it causally influence their choices.
      4.3 However, per the principles of evidential decision theory:
          - 4.3.1 The Member's Defection *lowers the subjective probability* that counterparts in the same CSM Tier Cooperated in their respective instances.
          - 4.3.2 This probabilistic update *retroactively diminishes* the expected aggregate utility gain that *would* have been associated with Cooperation.
      4.4 Defection may trigger review by the Ethical Compliance Panel (ECP) regarding continued membership suitability (See Clause 7.3).

  **Clause 5: Cost-Bearing & Dues**
      5.1 The "cost" of Cooperation is the quantifiable local utility sacrificed by the Member.
      5.2 Dues ("Correlation Maintenance Fees") are payable quarterly, calculated as the expected value of Cooperative actions undertaken in standardized low-stakes Decision Contexts (Schedule B).
      5.3 Payment is rendered *by performing* the Cooperative action within designated Schedule B contexts. Documentation (e.g., a signed statement affirming "I one-boxed the $10 Newcomboid") must be submitted. *The action itself constitutes payment.* No external currency is accepted.

  **Clause 6: Decision Theory Conversion Protocol**
      6.1 Should the Member undergo a fundamental shift in decision theory (e.g., conversion from Evidential (EDT) to Causal (CDT) Decision Theory):
          - 6.1.1 They must immediately notify the Conversion Registry Office (CRO).
          - 6.1.2 Their CSM Tier will be re-evaluated. Conversion to CDT typically results in downgrade to Tier 4 (Atmospheric) or removal from correlation pools for core Cooperative actions.
          - 6.1.3 Membership may be retained for philosophical solidarity (at reduced dues) but active participation in Tier 2/3 Cooperative actions is suspended pending re-alignment.

  **Clause 7: Membership & Dissolution**
      7.1 Membership is voluntary and continuous until resignation or termination.
      7.2 Resignation requires 90 days written notice. Note: Resignation itself is a decision that may carry evidential weight for counterparts contemplating resignation; Members are encouraged to Cooperate by *not* resigning frivolously.
      7.3 The Coalition may terminate membership for persistent Defection (as probabilistically inferred by the ECP per 4.4) or actions deemed existentially threatening to the theoretical coherence of the ECMC model.

  **Clause 8: The Anti-Free-Rider Safeguard (The Negligibility Feature)**
      8.1 The Coalition emphasizes that each Member's influence on the *overall probability* of counterpart Cooperation is infinitesimally small due to the vast number of potential counterparts.
      8.2 This very negligibility is presented as the primary safeguard against free-riding:
          - 8.2.1 Any single Member's Defection negligibly lowers the aggregate expected utility.
          - 8.2.2 However, the *evidential link* means their choice *is still perfectly correlated* with the vast ensemble's choices. Free-riding *breaks the correlation* for *that agent*, negating their contribution to the aggregate gain. Thus, Cooperation remains the uniquely rational choice *for each negligible agent*.

  ---

  **ECMC FREQUENTLY ASKED QUESTIONS (FAQ)**

  **Q1: If you can't verify counterparts exist or cooperated, what proof is there this works?**
  A1: Proof, in the empirical sense, is impossible per Clause 2.1. Efficacy rests on the *logical coherence* of evidential decision theory applied in vast worlds. Our quarterly Correlation Assessment Bureau reports provide Bayesian probability estimates (derived from first principles) of counterpart similarity and cooperation likelihood. Think of it as participating in a cosmic prisoner's dilemma where your sentence is predetermined but your choice reveals (to yourself) the likely sentences of invisible cellmates.

  **Q2: What happens if I defect? Clause 4.3 sounds like nothing changes at all!**
  A2: While no *causal* change occurs, a *probabilistic* update does. Your defection means that, conditional on *you* being the kind of agent who defects in this context, agents *sufficiently similar to you* (per the CSM Tier) are *also more likely* to have defected in their contexts. This retroactively lowers the *expected value* you should assign to the aggregate outcome. You haven't "made" them defect; you've merely learned (in a Bayesian sense) that the world where you defect is also likely a world where they defected. Cooperation maintains the *evidence* for a high-utility world.

  **Q3: Isn't the Coalition just a group of people cooperating unilaterally and *hoping* it does some good elsewhere?**
  A3: "Hope" implies uncertainty about the *mechanism*. The ECMC model posits that the mechanism – evidential linkage across vastness – is a *necessary consequence* of rational choice under specific decision theories (like EDT) in large worlds. Our actions aren't hopeful gestures; they are the *only instrumentally rational actions* available *if* one accepts the premises (vast world, relevant similarity, EDT). We are cooperating *because* it is rational under our model, not merely hoping cooperation is rational. The existence of other members provides mutual reinforcement of this reasoning framework, not causal coordination.

  **Q4: How do I know my dues (Cooperative actions) are "paid" correctly?**
  A4: Your submission documenting the performance of the Schedule B Cooperative action *is* the receipt. The value lies in you having made the choice that evidences counterpart choices. The Coalition audits documentation for consistency and adherence to Schedule B protocols, ensuring the *action type* qualifies as Cooperative payment. We do not audit the vast world for counterpart payments (impossible per Clause 2.1).

  **Q5: What if the world isn't actually vast enough, or correlations are too weak?**
  A5: The strength of correlation depends on the actual structure of reality and the accuracy of the CSM. The Coalition operates on the *presumption* that the world is sufficiently large and that our Similarity Matrix reasonably tracks the relevant decision-procedure features. This is a foundational premise. Members acknowledging significant doubt in these premises should consult Clause 6 (Conversion Protocol) or consider resignation (Clause 7.2). The Ethical Compliance Panel monitors cosmological research for relevant updates.

  **Q6: How can termination (Clause 7.3) matter if there's no enforcement?**
  A6: Termination removes the Member from the Coalition's internal registry and correlation pools. It signifies to *other Members* that the terminated Member is no longer reliably participating in the *evidential signaling framework* amongst *this group*. This protects the internal coherence of the Coalition's shared model and updates the Bayesian priors of remaining Members regarding the prevalence of reliable cooperators *within this specific reference class*.

  ---

  **Author's Note: Satire & Substance in the ECMC Agreement**

  This satire targets the core structure of "Evidential Cooperation in Large Worlds" (ECL) proposals. Its humor derives from taking the theory's commitments seriously and bureaucratizing them. Here's the breakdown:

  **Reflecting Genuine ECL Commitments:**
  1.  **Absence of Causal Contact/Verification:** The satire relentlessly emphasizes the total lack of causal interaction, signaling, enforcement, or verification (Clause 2, FAQ A1, A4, A6). This is central to any pure ECL model – the work is done *only* by the evidential link.
  2.  **Evidence Over Enforcement:** The mechanism hinges entirely on the agent's choice providing Bayesian evidence about counterpart choices, not causing them (Clause 1, Clause 4.3, FAQ A2). Consequences are probabilistic updates, not tangible rewards/punishments.
  3.  **Individual Negligibility:** The Anti-Free-Rider Safeguard (Clause 8) directly reflects the common ECL argument that an agent's negligible influence paradoxically makes cooperation rational, as defection breaks the crucial correlation *for them* without meaningfully harming the aggregate.
  4.  **Dependence on Similarity & Vastness:** The need for decision-procedure similarity and a vast world to support non-negligible correlations is acknowledged (Clause 3, FAQ A5), even as the tiers are satirized.
  5.  **Action as Commitment/Proof:** The idea of "dues" being paid *by performing the cooperative action itself* (Clause 5.2, 5.3, FAQ A4) satirizes how ECL participation fundamentally *is* the act of cooperating in designated contexts based on the belief.

  **Highlighting Contested Premises (via Satirical Bureaucracy):**
  1.  **Plausibility of Strong Correlations:** The elaborate Correlation Similarity Matrix (CSM) and Tiers (Clause 3) satirize the deep uncertainty and potential arbitrariness in defining "sufficient similarity" across vast distances/branches. *Is such strong correlation plausible in our universe?* This is hotly contested. The bureaucracy exaggerates the difficulty of operationalizing the core requirement.
  2.  **The Validity of Evidential Reasoning:** The deadpan acceptance of probabilistic updates with zero causal feedback (Clause 4, FAQ A2) highlights the core dispute between Evidential (EDT) and Causal (CDT) Decision Theorists. *Is this how rational agents should act?* CDT proponents say no; the satire makes EDT's implications starkly visible.
  3.  **Cosmological Reliance:** FAQ A5 touches on the dependence of ECL on speculative cosmology/metaphysics (vast multiverse, quantum branches). *Does our world actually have the required structure?* This is unknown and debated. The Coalition's dogged presumption satirizes the leap of faith needed.
  4.  **Payoff & Value:** The inability to measure aggregate gain (Clause 2.1.3) and the focus on theoretical satisfaction (Clause 2.2) satirize the challenge of grounding ECL's purported benefits in observable reality. *How much weight should we give to this unfalsifiable aggregate?*

  **Deliberate Liberties for Comic Effect:**
  1.  **The Bureaucracy Itself:** The Compliance Panels, Assessment Bureaus, Registries, Schedules, and tiers are pure comic exaggeration. Real ECL is a personal reasoning strategy, not an organization with paperwork.
  2.  **Formalized "Dues":** While cooperative acts *are* the participation, formalizing them as "dues" payable on a schedule via documented actions is a satirical extension.
  3.  **Termination for "Coherence":** The idea of terminating members for defection or theoretical deviance (Clause 7.3, FAQ A6) satirizes the social dynamics within communities advocating ECL, not the theory's internal logic where defection just breaks *your* correlation.

  The piece takes no stance on the live debates between EDT, CDT, FDT, etc., or the truth of exotic cosmologies. It merely dramatizes the internal structure and inherent tensions of the ECL idea as proponents articulate it, pushing its formalization to a bureaucratic extreme to highlight both its logical coherence (from its premises) and its profound strangeness.
