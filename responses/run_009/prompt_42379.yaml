  Alright, the user is a novelist working on a first-contact book based on the dark forest hypothesis from Liu Cixin's trilogy. They need a defensible breakdown of how likely this hypothesis is, decomposed into key probabilities, to ensure their plot holds up. Their editor and readers are critical, so accuracy is crucial.

