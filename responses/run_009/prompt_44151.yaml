  Okay, the user is grappling with a passage from Plutarch's preface to the Life of Pericles and has two main questions. First, they want to understand Plutarch's argument about why admiring virtuous actions leads to imitation, while admiring other skills doesn't. Second, they're curious if Plutarch's approach to biography aligns with the idea of selecting imitable deeds for moral training, similar to hagiography.

  Let me start by breaking down Plutarch's argument. He claims that when we admire virtuous deeds, it naturally inspires us to emulate the doer. But for other admirable things like perfumes, music, or statues, we might enjoy the product but look down on the creator. The examples given—perfumers, dyers, pipers—are considered "illiberal" or vulgar because their work is seen as manual or servile. The Antisthenes quote suggests that being an excellent piper indicates a lack of noble character, possibly because it involves too much time on a craft instead of higher pursuits. Philip scolding his son for playing the lyre well reinforces that a king should appreciate music, not perform it. 

  So why the distinction? Virtue is inseparable from the person; the act and the actor are one. When you admire a virtuous deed, you're inherently admiring the person's character, making you want to be like them. In contrast, crafts produce external objects. You can love the statue but not care about the sculptor. The separation between product and producer allows admiration without emulation. Status plays a role too—manual labor was looked down upon in Plutarch's society, so those artisans weren't seen as role models.

  Now, the user's second point: does Plutarch's method resemble hagiography? His explicit goal is moral edification through examples. He selects deeds that are imitable, focusing on character-shaping moments rather than comprehensive history. The "catalogue of small notables" idea fits here. Plutarch isn't just recounting events; he's choosing stories that serve as moral lessons, aiming to inspire readers to virtuous action. So yes, there's a structural similarity to hagiography, where saints' lives provide tangible examples to emulate. However, Plutarch's Lives are more nuanced than typical hagiographies, as he includes flaws and complexities, but the core intent aligns—using concrete deeds over abstract precepts for moral training.

  The user might be connecting Plutarch's approach to later religious biographies, and this passage supports that. Plutarch's emphasis on being "edified by regarding" goes beyond just saying reading about good people is good; it's about active emulation. The mechanism he describes—admiration leading to imitation—relies on the inseparability of virtue from the person. Whether this actually works is debatable. People can admire virtue without acting on it, but in theory, presenting relatable, concrete examples could be more effective than abstract rules. Plutarch's method likely does foster better moral engagement than mere precepts, making his Lives a tool for character building.
answer: |-
  You've nailed the core tension in Plutarch's preface. Let's break down his argument and its connection to your "imitable deeds" theory.

  **1. Dissecting Plutarch's Argument:**

  Plutarch's core claim is: **Admiring virtuous actions *uniquely* triggers an impulse to *imitate* the virtuous person, unlike admiring other excellent things (crafts, arts, skills).**

  *   **Why other admirable things *don't* inspire imitation (according to Plutarch):**
      *   **Separation of Product and Producer:** With a crafted object (perfume, statue, music performance) or a skilled act (piping, lyre-playing), the *result* is delightful, but the *maker/performer* is seen as separate and often inferior.
      *   **Status Contamination ("Banausia"):** Plutarch inherits a strong Greek/Roman prejudice against manual labor and certain professional skills. Creating perfumes, dyeing cloth, or even being a virtuoso musician (especially for hire) was considered "illiberal" – fit for slaves, artisans, or lower classes, not free gentlemen or rulers. The *act* of doing the work itself lowers the status of the doer in the eyes of the elite spectator.
      *   **The Evidence of the Quotes:**
          *   **Antisthenes on Ismenias the Piper:** Antisthenes (a Cynic philosopher) implies that being an *excellent* piper is *proof* the man is "worthless." Why? Because dedicating oneself to perfecting a craft (especially one seen as mere entertainment) signifies misplaced priorities. A truly noble man wouldn't devote such effort to a "vulgar" skill; he'd focus on virtue and statecraft. Excellence *in this domain* is inversely proportional to moral worth *in Plutarch's social framework*.
          *   **Philip to Alexander:** Philip isn't upset his son plays poorly; he's ashamed Alexander plays *well*. Why? A king's role is to *appreciate* culture and music (as a spectator/patron), not to *perform* it like a hired musician. Performing skillfully at a banquet blurs the line between the ruler and the entertainer, degrading the king's majesty. The king should be the *subject* of admiration, not the *performer* seeking it.
          *   **Statues & Poems:** You admire Zeus at Olympia or a poem by Anacreon, but you don't want to *be* Pheidias or Anacreon. The artist/poet is a craftsman producing an external object/entertainment. Their skill is admirable, but their *role* (sculptor, poet-for-hire) isn't inherently virtuous or worthy of emulation by a statesman.

  *   **Why virtuous actions *do* inspire imitation:**
      *   **Inseparability of Act and Actor:** Virtue isn't an external product; it *is* the character of the person manifested in action. You cannot admire the "work" (the courageous deed, the wise decision, the just act) without simultaneously admiring the *person* who performed it. The "work" *is* the expression of the man himself.
      *   **The Nature of the "Good":** Plutarch states the key difference: "The good things of Fortune we love to possess and enjoy; those of Virtue we long to perform." Virtuous goods are inherently *active*. They reside in *doing*, not in *having*. To value virtue is to value *being* virtuous yourself.
      *   **The Impulse:** Because the virtuous act is the direct expression of the virtuous soul, admiring the act *is* admiring the soul. This admiration naturally translates into a desire to possess that same quality of soul – to *be* like that person. Hence, the impulse to *emulate* ("strives to emulate those who wrought them").

  **Is it Status or Ontology?** It's both, intertwined. The *reason* crafts are separable is partly due to their perceived lower status and manual nature ("banausic"). The *reason* virtue is inseparable is that it defines the noble character Plutarch values, which is inherently tied to the status of a free citizen/statesman. The ontological distinction (external product vs. internal character expressed) is the mechanism, but the social hierarchy deeply informs *which* acts fall into which category. Pheidias's genius is undeniable, but his *work* (manual sculpting) defines him in a way Pericles's virtue does not define Pericles (in Plutarch's view).

  **2. Your "Imitable Deeds" Theory and Plutarch's Preface:**

  **Your reading is absolutely spot-on and directly supported by this preface.** This isn't just a dusted-off rhetorical flourish; it's a core statement of Plutarch's biographical method.

  *   **"Edified by Regarding" is More Than Just "Good For You":** Plutarch explicitly contrasts merely "regarding" the best with being "edified by regarding it." The "edification" comes from the *impulse to imitate* triggered by the virtuous example. Reading isn't passive absorption; it's meant to be active moral training.
  *   **The Unit of Selection is "Imitable":** Plutarch states his purpose: "he pursue what is best, to the end that he may not merely regard it, but also be edified by regarding it." He's selecting material ("what is best") specifically *because* contemplating it leads to emulation. The Lives are collections of deeds and character traits *chosen* for their power to inspire imitation, not primarily as exhaustive historical records. He focuses on anecdotes, sayings, and decisions that reveal character precisely because *these* are the imitable units.
  *   **Concrete Deeds vs. Abstract Precepts:** Plutarch implicitly argues against *only* teaching abstract philosophy or rules. Concrete examples *work* because they trigger this direct, emotional impulse to emulate. Seeing Pericles endure slander calmly (a concrete deed) is far more likely to inspire similar calm in the reader facing criticism than just being told "Be patient" (a precept). The deed embodies the virtue in a relatable, compelling way.
  *   **Structural Similarity to Hagiography:** You're right to see the parallel. Like hagiography, Plutarch's Lives:
      *   Select episodes primarily for moral/edifying value.
      *   Present characters as exemplars (though Plutarch is often more nuanced about flaws than later hagiographers).
      *   Aim to shape the reader's character through contemplation of the subject's actions.
      *   Operate on the principle that concrete examples are superior teachers of virtue than abstract doctrine alone.

  **Can the Imitation Mechanism Work?**

  Plutarch presents it as almost automatic: "straightway so disposes a man that he no sooner admires the works of virtue than he strives to emulate those who wrought them." Is it that simple?

  *   **Why it *Might* Work (Plutarch's Hope):**
      *   Humans are wired for social learning and mimicry. Seeing admired behavior *can* inspire copying.
      *   Concrete examples make abstract virtues tangible and achievable ("If *he* could do it in that situation...").
      *   Admiration creates an emotional connection and desire for identification with the admired figure.
  *   **The Gaps in the Mechanism:**
      *   **Not Automatic:** We can admire Mother Teresa without becoming saints, or Pericles without entering politics. Admiration doesn't *guarantee* emulation. Laziness, fear, circumstance, conflicting desires get in the way.
      *   **Complexity of Virtue:** Real virtue often involves complex judgment in messy situations. Simply imitating a specific deed from history might not translate well to a different context.
      *   **The "Banausic" Blindspot:** Plutarch's mechanism depends entirely on *what* we admire *as* virtue. His disdain for craftsmen limits the scope of admirable actions. A modern reader might admire a brilliant surgeon's skill *and* dedication *and* be inspired towards medicine – a path Plutarch would likely dismiss as "banausic."
      *   **Flawed Examples:** Plutarch includes flaws in his heroes. Does admiring a virtuous act *despite* knowing the person had other vices strengthen or weaken the impulse? Plutarch relies on the reader focusing on the specific good deed.

  **Conclusion:**

  Plutarch's argument hinges on a specific cultural distinction between "liberal" virtue (embodied in actions by statesmen/philosophers) and "banausic" skill (embodied in crafts/products), claiming admiration for the former uniquely sparks imitation because virtue is inseparable from the actor and inherently desirable to possess through action. Your insight about ancient biography functioning through "imitable deeds" is precisely what Plutarch is advocating in this preface. It's his core methodology: select concrete examples of virtue in action *because* contemplating them is designed to trigger the reader's impulse to emulate, providing a more powerful form of moral education than abstract precepts alone. While the mechanism isn't as automatic as Plutarch implies, the power of concrete exemplars to inspire remains a potent, and arguably effective, pedagogical tool, central to his project in the *Parallel Lives*.
