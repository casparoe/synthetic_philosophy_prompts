  i'm in my school's math club and this year we decided to do "philosophy of math fridays" which was probbably a mistake, because we've spent the whole semester on one question and nobody has moved an inch. the question is basically whether math is discovered or invented, platonism vs nominalism as our advisor calls it. one side says numbers are out there like planets, we just find them (their favourite point is that π's digits don't care about us, and that there's a fact about whether there are infinitely many twin primes even if no one ever proves it). the other side says math is something we made up, like the rules of a game (their point is the parallel postulate — we chose to keep it, we could've not, and nothing forced us).

  here's why i think the stall is interesting though. we made zero progress on the big question but we accidentally found a test that splits people in a WEIRD way. someone asked: "a proof that nobody has found yet — does it exist right now?" and it turned out our two best platonists disagreed with each other, and one of our strongest nominalists said yes without hesitating. she said the proof is like a path thru a forest that exists whether or not anyone's walked it, and the forest is... the axioms? she wasn't sure. so the split doesn't follow the platonist/nominalist line at all, and now half the club thinks we've been arguing about two different things the whole time.

  my hypothesis is the whole thing is verbal and comes down to the word "exists" — like arguing over whether the rules of chess are "real". but my friend says no, because if it were just words the twin prime question wouldn't feel so loaded, and also because the platonists in the club genuinely get sad when they think about math being invented, which doesn't happen in purely verbal arguments. so who's right about what kind of disagreement this actually is?

  i want a diagnosis, not a verdict on platonism (we have plenty of those already, everyone in that room is a missionary). is it verbal? are the two sides answering different questions under one word? is it bedrock intuitions nobody can argue for either way? please actually use what my club says, including the weird proof-exists split, in your diagnosis. and tell me honestly whether anything would count as progress here — a distinction, a test case, a reframed question — or whether our advisor is right that when a fight lasts 2500 years without a knockout you should suspect the question itself. at the very end put a line starting with "Diagnosis:" followed by one short phrase (like "verbal", "two questions in one", "substantive", "ill-posed") and nothing after it.
