prompt: |-
  My friend Priya and I had a gigantic argument last night at like 1am about dispositions and I want to settle it properly. The background: I took the standard line that finks and masks kill the simple conditional analysis ("x is fragile iff x would break if struck"), she kept saying no analysis was ever supposed to be read as a bare material conditional with no ceteris paribus clause, and eventually we realized we were just lobbing cases at each other without any shared standard of what an account of dispositions is even for. So before we go another round I want the actual spec first: write me the list of requirements that any adequate theory of dispositions has to meet, with the case or consideration behind each one. I have some ideas about what belongs on it but I don't trust myself, so please think it through yourself -- I mean things like: it has to get the boring cases right (glass being fragile), it has to handle finked and masked cases (the sorcerer or device that would remove the fragility before the strike lands, versus the carefully packed Styrofoam that prevents the breaking without touching the fragility), it has to say whether dispositions are intrinsic or whether extrinsic finks show they're not, it has to distinguish a thing losing a disposition from a thing having the disposition but being blocked, and it has to say something about whether the stimulus and the manifestation get to be picked independently or come as a package (the old solenoid point, where the same underlying property gives you one disposition if you describe the stimulus one way and a different one if you describe it another way). There are probably requirements I'm not thinking of, and maybe some on my list aren't genuine requirements at all, just things metaphysicians decided to care about.

  Two things I especially want. First, tell me which pairs of requirements you suspect can't be jointly satisfied -- my hunch is that intrinsicness and fink-resistance pull against each other somehow, since finks are literally extrinsic partners waiting in the wings, but I've never seen it laid out cleanly and I might be confusing myself. If some subset really is jointly unsatisfiable, that's the part I care about most, because it would explain why this debate has run for decades without anyone conceding. Second, fix the purpose yourself: what "adequate" means probably depends on whether the theory is supposed to be good enough for science, where we use dispositional predicates like soluble and flammable and malleable all day and everyone knows what they mean, versus good enough for metaphysics, where the dispositional versus categorical distinction is doing heavy lifting. Pick one purpose (or argue they're the same purpose) and make the requirements answer to it. Then, briefly only, say how the main contenders do against your list -- the bare conditional analysis, some patched-up version with relevant conditions or ceteris paribus clauses, and the powers picture where dispositions are just how properties are -- but keep that part short, the criteria are the thing.

  Don't do citations or a bibliography, positions by name are fine and I'll fill in the references. And please write it as continuous prose, like a long email -- no bullet points, no headings, no tables, just paragraphs. Priya formats everything into numbered lists and I want to read something that flows for once. Also fair warning: she's going to read whatever you write over my shoulder, so if you quietly drop a requirement because it's inconvenient rather than because it's wrong, she will notice, and then I'll never hear the end of it.
