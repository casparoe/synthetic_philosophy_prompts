prompt: |-
  I'm a PhD student in machine learning, working on monitoring deployed neural networks for behavior that wasn't present during training, and I've hit a recurring disagreement I don't have the vocabulary for. My group keeps asking whether, in some new situation, a model is "still using the same mechanism" it used in training. The phrase sounds well-defined, but when I press people on it, it gets cashed out in at least four different ways, and the choice between them changes the verdict:

  1. Same internal route. The same intermediate computations are doing the work — the same kind of attention-head pattern, say, still gives rise to the output, even if the input distribution has drifted. On this reading, a model can switch to a completely different internal pathway while producing the same outputs, and that counts as a new mechanism.
  2. Same input–output profile. If the model's behavior on a battery of probes is unchanged, the mechanism is "the same" for our purposes, whatever is going on inside. On this reading, internal rewiring with stable behavior is not a new mechanism, which is exactly the opposite verdict from (1) in the same case.
  3. Same parameters. Fine-tuning nudges every weight slightly, so strictly speaking nothing is "the same" after any update, yet nobody wants to say every fine-tune creates a new mechanism. So this criterion is obviously too strict as stated — but it's not clear what relaxation of it we're implicitly using.
  4. Stable relations under shift. Some internal relation (between features, or between features and output) held in training and still holds in the new setting, where "holds" means roughly that it would still hold if we perturbed things further. This one is the least crisp but seems closest to what we actually care about.

  A concrete instance: we fine-tuned a classifier on additional data, and two colleagues disagreed about whether a previously monitored behavior was preserved. One said yes, because the model's outputs on our evaluation suite were unchanged; the other said no, because the cues the model relied on had visibly shifted from one input feature to another. Both were looking at the same facts; they were simply using different criteria for sameness.

  So my question is this. Is there an established body of work that addresses this directly — what it takes for one system at two different times (or two systems) to count as implementing the same mechanism, at a grain coarse enough that it's not just "same parameters" and fine enough that it's not just "same behavior"? I'd expect the nearest concepts to come from wherever this question has been faced before, possibly outside machine learning, but what I need to know is, for each candidate: what it actually claims, and precisely where it diverges from my case — where it draws the line in the wrong place, either too coarsely (collapsing internal rewiring into "same") or too finely (splitting things we'd want to call the same). If nothing established captures the notion, please coin a term for it, give a precise definition, and include two or three boundary cases that show where the line falls.

  Please structure the reply in four sections, in this order, with roughly the lengths indicated:

  - "The question, restated" (~120 words): say back in your own words what I'm asking for, so we can check we're aligned before you answer.
  - "Nearest existing concepts" (~350 words): the closest established ideas, each with a short statement of what it actually says — enough that I can tell them apart.
  - "Why each falls short" (~250 words): for each candidate, the specific respect in which it mis-carves my case.
  - "A working definition" (~200 words): either the concept that fits best, or a newly coined term with a definition and two or three boundary cases.

  No need for references or reading lists; I'm after the carving, not the citations.
reasoning: |-
  Alright, let me tackle this query from a PhD student in machine learning. They're dealing with a conceptual disagreement in their group about what constitutes the "same mechanism" in neural networks post-deployment. The core issue is the ambiguity in defining when a model's internal process remains unchanged despite external changes like fine-tuning or distribution shifts.

  First, I need to parse their four interpretations of "same mechanism." Each leads to different conclusions in scenarios like fine-tuning. The student wants to know if there's existing work that addresses this ambiguity or if a new definition is needed. The key is finding a balance between internal structure and behavior.

  Looking into existing concepts, I recall functionalism from philosophy of mind, which emphasizes causal roles over physical implementation. Then there's mechanistic explanation in neuroscience, focusing on components and their organization. Algorithmic equivalence in computer science considers same input-output and computational steps. Robustness in ML measures consistency under perturbations, while invariance in causality looks for stable relationships.

  However, each has shortcomings. Functionalism might ignore structural changes, mechanistic explanation is too detailed for neural networks, algorithmic equivalence is too rigid, robustness is behavioral and ignores internals, and invariance is too abstract. None fully capture the need for structural stability without requiring identical parameters or just similar outputs.

  For a working definition, "structural behavioral stability" (SBS) comes to mind. It requires maintaining the causal graph of internal features and their output contributions, allowing for parameter adjustments. Boundary cases illustrate this: fine-tuning that preserves feature-output links is same mechanism; switching to a different algorithm isn't, even if outputs match; and using a new feature for the same prediction isn't SBS if it changes the causal structure.

  This approach aims to bridge the gap between internal changes and behavioral consistency, providing a pragmatic standard for monitoring deployed models.
answer: |-
  ### The question, restated
  You're seeking a principled definition for when a deployed neural network's *mechanism* for a specific behavior remains "the same" under distribution shifts, fine-tuning, or other changes, despite ambiguity in your group. Existing criteria conflict: same internal computations (1) vs. same input-output behavior (2) vs. parameter continuity (3) vs. stable feature relations (4). You want to know if established concepts (inside or outside ML) resolve this by carving between "same parameters" (too strict) and "same behavior" (too coarse). If none fit, you request a newly coined term with a precise definition and boundary cases that clarify when internal rewiring preserves the mechanism versus alters it, capturing the essence of what matters for monitoring behavioral drift in deployed models.

  ### Nearest existing concepts
  1.  **Functionalism (Philosophy of Mind):** A mental state is defined by its *causal role* — its relations to inputs, other states, and outputs. Systems with different physical implementations (e.g., brain vs. computer) can instantiate the same "mental state" if they play the same functional role. *Relevance:* Focuses on abstract causal patterns, not specific hardware or parameters.
  2.  **Mechanistic Explanation (Philosophy of Science/Neuroscience):** A mechanism is a structure performing a function via its organized components and activities. Sameness requires relevantly similar components, activities, and organization. *Relevance:* Explicitly defines mechanisms hierarchically (e.g., neurons vs. circuits) and emphasizes causal structure.
  3.  **Algorithmic Equivalence (Computer Science):** Two systems implement the "same algorithm" if they compute the same input-output mapping *using the same sequence of computational steps*, abstracting away implementation details (e.g., hardware, programming language). *Relevance:* Distinguishes behavior (input-output) from computational *process*.
  4.  **Robustness/Invariance (ML/Causality):** A feature or mechanism is "robust" if it persists under specific perturbations/distribution shifts. Causal *invariance* means a relationship (e.g., feature Y causing prediction P) holds across environments/interventions. *Relevance:* Directly addresses stability under shift, central to your monitoring concern.
  5.  **Feature/Representation Similarity (ML Interpretability):** Uses metrics (e.g., CCA, SVCCA, CKA) to compare internal activations or representations across models or datasets. "Same mechanism" might imply similar feature representations are utilized. *Relevance:* Operationalizes internal similarity beyond parameters.

  ### Why each falls short
  1.  **Functionalism:** Focuses *only* on causal role relative to inputs/outputs/other states. It would likely deem internal rewiring that perfectly preserves the input-output profile (your case 2) as the same mechanism, potentially collapsing distinct internal pathways if they are functionally equivalent. This ignores structural changes you might care about (your case 1 vs 2 disagreement).
  2.  **Mechanistic Explanation:** While promising, its requirement for similar *components and activities* is often too fine-grained for neural networks. Does a slightly shifted attention pattern count as a "different activity"? It struggles with the continuous, high-dimensional nature of neural representations and the ambiguity of defining "relevantly similar" components at the right level.
  3.  **Algorithmic Equivalence:** Too strict for neural networks. Requiring the *same sequence of computational steps* would mean that even minor architectural tweaks or parameter nudges (fine-tuning) create a "different algorithm," failing your requirement to not split things we'd call the same (your case 3). It doesn't handle approximate equivalence well.
  4.  **Robustness/Invariance:** Robustness is often measured behaviorally (output stability), not structurally. Causal invariance focuses on *specific* stable relations (e.g., `X -> Y`), not the *overall mechanism* supporting a behavior. It might identify stable sub-components but doesn't define when the *entire mechanism* is the same.
  5.  **Feature Similarity:** Metrics provide degrees of similarity, not a binary "same mechanism" judgment. Where to set the threshold? More critically, high similarity might hold even if the *causal role* of a feature in producing the output changes slightly, and low similarity might occur even if the core computational strategy persists (e.g., due to rotational symmetry in weight space).

  ### A working definition
  **Structural Behavioral Stability (SBS):** A model's mechanism for a specific behavior is structurally behaviorally stable across two contexts (e.g., pre/post shift, model A vs B) if:
  1.  **Behavioral Equivalence:** The model produces equivalent outputs for the behavior-relevant inputs under both contexts (within an acceptable tolerance, addressing case 2's core).
  2.  **Causal Structural Consistency:** The core causal graph relating *internal features* to each other and to the output for this behavior remains invariant. Key features mediating the behavior must be present, and their causal dependencies (how features combine/transform to produce the output) must be functionally equivalent, even if individual parameter values or activation magnitudes shift. Parameter changes are allowed if they preserve this causal structure.

  **Boundary Cases:**
  1.  **Fine-tuning preserves SBS:** Model is fine-tuned on similar data. Parameters change slightly, outputs on the monitored behavior remain equivalent, and probes show the *same key features* (e.g., specific concept detectors) *causally contribute* to the output in the same way (e.g., same logical combination). *Verdict:* Same mechanism.
  2.  **Internal Rewiring breaks SBS:** Model encounters a new domain. Outputs remain correct initially, but interpretability reveals it now relies on a *different set of core features* or a *fundamentally different combination rule* (e.g., switched from AND to OR logic using different concepts) to achieve the same output. *Verdict:* New mechanism, despite behavioral equivalence (resolves case 1 vs 2 by siding with internal route change).
  3.  **New Feature, Same Role:** Outputs are stable. A *new, redundant feature* emerges alongside the original ones, but the original causal pathway (original features → output) remains fully intact and sufficient. *Verdict:* Same mechanism (structural core is stable, redundancy is allowed). If the new feature *replaces* the original causal pathway, SBS is broken (aligned with case 4's intuition).
