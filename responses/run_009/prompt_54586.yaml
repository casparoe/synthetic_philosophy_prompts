prompt: |-
  I spent thirty-five years in condensed matter physics before retiring, and for the past two years I have been working my way into the AI safety literature, partly through a reading group of former colleagues. The topic that has hooked me is what people call mechanistic anomaly detection: rather than flagging unusual outputs, one inspects whether an input is processed by the same internal machinery that handled the benign training distribution — the idea being that a misaligned model may behave normally on ordinary inputs while running some quite different computation on the ones that matter. What strikes a physicist immediately is that the entire program rests on a notion nobody has pinned down: what does it mean for two inputs, or two models, or two training runs, to be processed "by the same mechanism"? In my old field we spent decades learning that questions like this — when are two systems in the same universality class? — cannot be answered at the level of raw microscopic detail, because the same macroscopic behavior can be realized by wildly different microconfigurations, and near-identical microconfigurations can drift apart under coarse-graining. I suspect mechanistic interpretability is facing the same problem with none of the conceptual tools.

  So here is what I want: a specification, not a survey. Write the desiderata that any adequate account of mechanistic sameness must meet if it is to serve anomaly detection in particular. To seed your thinking, consider the constraints that strike me as natural but that you should feel free to challenge or refine: the account should be invariant under retraining (a fresh run of the same architecture on the same data presumably implements "the same mechanism" through different weights, so any notion defined directly on parameter values is dead on arrival), invariant under permutation symmetries and other re-parameterizations of the network, stable under coarse-graining in something like the renormalization-group sense — factoring out implementation details that don't matter for the function — yet not so coarse that it collapses into pure input-output equivalence, since behaviorally identical models can presumably implement different mechanisms and detecting that difference is the whole point. There is also, it seems to me, a decidability requirement the physics analogy does not capture: the account must be operationalizable by an inspector with finite access to a fixed network, which may rule out definitions I would find natural, like the topological conjugacy one uses for dynamical systems. And there is an adversarial requirement: an account that is too sharp gives an adversary a target — a backdoor trigger engineered to sit just barely outside the equivalence class of benign processing. For each desideratum, give the motivating case and say whether it is genuinely non-negotiable or a preference of a particular camp. Then, and this is the part I most want to see: if some subset of the desiderata is jointly unsatisfiable — for instance, if coarse-grained stability and adversarial sharpness pull in opposite directions — say so explicitly, because then the specification itself is the result. Finally, a sentence or two on which single requirement does the most to exclude the obvious candidate accounts (behavioral distributional tests, activation-level clustering, circuit-level and causal-intervention analyses), and where you think the interesting tension lies. No citations, please — I will match the positions to the literature myself.
reasoning: |-
  We are to specify desiderata for an account of "mechanistic sameness" in the context of anomaly detection for AI models. The goal is to define when two inputs (or two models, etc.) are processed by the same internal mechanism. The user has provided several constraints and asks for a clear specification of requirements, including potential conflicts and a note on which requirement excludes obvious candidates.

  Desiderata:

  1. **Retraining Invariance**: 
     - *Description*: The account must consider two models trained independently (with the same architecture and on the same data distribution) as having the same mechanisms, even though the weights are numerically different. 
     - *Motivation*: We care about the learned function and the algorithm, not the specific instantiation of weights. For example, two runs of training a ResNet on ImageNet should be seen as implementing the same mechanisms.
     - *Non-negotiable?*: Yes, because without this, the concept is tied to a particular run and not the learned behavior.

  2. **Parameterization Invariance**:
     - *Description*: The account must be invariant under re-parameterizations that do not change the function computed (e.g., permutation symmetries in neural networks, rescaling of weights in certain layers, etc.).
     - *Motivation*: The same mechanism can be represented in multiple ways in parameter space (e.g., by reordering neurons in a hidden layer).
     - *Non-negotiable?*: Yes, because these are artifacts of the representation and do not reflect a change in the underlying computation.

  3. **Coarse-Graining Stability** (Renormalization-Group Inspired):
     - *Description*: The account should factor out implementation details that do not affect the function at a chosen level of abstraction. It must be stable under "irrelevant" perturbations to the model (e.g., adding a neuron that doesn't change the output, or small changes in weights that don't alter the function) and should capture the same mechanism across different architectures that implement the same abstract computation.
     - *Motivation*: In physics, two systems are in the same universality class if they exhibit the same critical behavior regardless of microscopic details. Similarly, the mechanism should be defined at a level that captures the essential computation and not the exact wiring.
     - *Non-negotiable?*: This is a core requirement to avoid being too fine-grained. However, the level of coarse-graining must be chosen appropriately (see tension with Adversarial Sharpness).

  4. **Non-Collapse to Input-Output Equivalence**:
     - *Description*: The account must not reduce to checking that the model produces the same outputs for the same inputs (or for a distribution of inputs). It must capture internal differences that may not be immediately apparent in behavior but could be critical for anomaly detection (e.g., a backdoor that lies dormant until triggered).
     - *Motivation*: The whole point of mechanistic anomaly detection is to catch issues that behavioral tests miss. If two models are behaviorally equivalent but internally different in a way that matters for safety (e.g., one has a backdoor and the other doesn't), the account must distinguish them.
     - *Non-negotiable?*: Yes, because otherwise we are just doing behavioral testing.

  5. **Finite Access Decidability**:
     - *Description*: The account must provide a method that, given finite access to the model (e.g., the ability to run the model on inputs and observe intermediate activations, but not necessarily the entire weight matrix or unlimited computational resources), can decide whether an input is processed by the same mechanism as the training distribution. This rules out definitions that require exhaustive analysis of the entire model or that are computationally infeasible.
     - *Motivation*: In practice, we cannot run an exponential-time algorithm on the entire state of a large model for each input. We need a method that can be operationalized in reasonable time.
     - *Non-negotiable?*: This is a practical requirement. Without it, the method is not usable for real-time anomaly detection.

  6. **Adversarial Sharpness**:
     - *Description*: The account must not be so coarse that it fails to detect adversarial examples that are designed to be very close to benign inputs but trigger a different mechanism. The boundary between "same mechanism" and "different mechanism" must be sharp enough to catch these.
     - *Motivation*: An adversary will try to make the trigger as close as possible to normal inputs. If our account is too stable (i.e., too coarse), it might include the adversarial example in the same class as benign inputs.
     - *Non-negotiable?*: This is a safety requirement. However, note the tension with Coarse-Graining Stability: too much stability (coarse-graining) might blur the boundary, while too little might make the account sensitive to irrelevant details.

  Tensions and Joint Unsatisfiability:

  The most apparent tension is between **Coarse-Graining Stability** and **Adversarial Sharpness**. 

  - Coarse-Graining Stability requires that we ignore small differences that are functionally irrelevant (e.g., due to noise, retraining, or reparameterization). 
  - Adversarial Sharpness requires that we be sensitive to small but critical differences (e.g., an adversarial trigger that causes a model to switch from a benign circuit to a malicious one). 

  These two pull in opposite directions: one asks for insensitivity to certain small changes, the other for sensitivity. This tension is fundamental and cannot be resolved without making a trade-off. The level of coarse-graining must be chosen so that it factors out irrelevant details but preserves the distinction between mechanisms that are functionally different in a way that matters for safety.

  Another tension exists between **Finite Access Decidability** and the desire for a comprehensive account. For example, a definition based on topological conjugacy (as mentioned by the user) might be too abstract to compute with finite access.

  Exclusion of Obvious Candidates:

  The requirement that does the most to exclude obvious candidates is **Non-Collapse to Input-Output Equivalence**. 

  - Behavioral distributional tests (e.g., checking if the output distribution for a given input is the same as for training) are excluded because they only look at outputs.
  - Activation-level clustering might group inputs by similarity of internal activations, but without a notion of mechanism, it may not be invariant under retraining or reparameterization, and it might collapse to input-output equivalence if the clustering is too broad. Also, it might not capture the causal structure.
  - Circuit-level and causal-intervention analyses (e.g., finding a set of neurons that form a circuit for a task) are promising, but they must be defined in a way that is invariant under retraining and reparameterization. Without that, they fail the first two desiderata. Moreover, they might not be stable under coarse-graining (if the circuit is defined too precisely, then two models that are functionally the same but have slightly different wiring would be considered different).

  The most interesting tension lies in the balance between **Coarse-Graining Stability** and **Adversarial Sharpness**. We want a notion of mechanism that is robust to irrelevant details but sensitive to the presence of backdoors or other adversarial mechanisms. This is analogous to the problem of defining a phase in physics: we want to ignore microscopic noise but detect a phase transition.

  In summary, an adequate account of mechanistic sameness must navigate these tensions, especially the trade-off between coarse-graining and adversarial sharpness, while being invariant to irrelevant implementation details and computable with finite access.
answer: |-
  ### Desiderata for Mechanistic Sameness in Anomaly Detection  
  Below is a specification of requirements for an account of "mechanistic sameness" tailored to mechanistic anomaly detection in AI systems. Each desideratum is grounded in a core motivation, classified as **non-negotiable** (essential for the anomaly detection goal) or **contextual** (dependent on philosophical or practical priorities). Conflicts are explicitly highlighted.  

  ---

  #### **1. Retraining Invariance**  
  - **Description**: The account must identify mechanisms as identical across independent training runs of the same architecture/data, despite weight differences.  
  - **Motivation**: Fresh training runs should yield "the same mechanism" (e.g., a CNN trained twice on MNIST). Direct weight comparisons fail.  
  - **Non-negotiable**: Yes. Weight-space definitions are unusable.  

  #### **2. Parameterization Invariance**  
  - **Description**: The account must be unaffected by symmetry transformations (e.g., neuron permutations, activation rescalings) that preserve network functionality.  
  - **Motivation**: Reparameterizations do not alter the mechanism (e.g., permuting hidden units in an MLP).  
  - **Non-negotiable**: Yes. Ignores implementation artifacts.  

  #### **3. Coarse-Graining Stability**  
  - **Description**: The account must tolerate microscopic perturbations that do not alter functional behavior (e.g., adding redundant neurons, small weight noise), analogous to renormalization-group flow.  
  - **Motivation**: Mechanisms should be defined by computational equivalence classes, not microscopic details (e.g., two circuits computing XOR via different intermediate steps are identical if functionally equivalent).  
  - **Non-negotiable**: **Contextual**. Required for robustness but conflicts with Adversarial Sharpness (see §7).  

  #### **4. Non-Collapse to Input-Output Equivalence**  
  - **Description**: The account must distinguish internally divergent mechanisms that produce identical outputs on the training distribution.  
  - **Motivation**: Detecting backdoors (e.g., a model that classifies "cats" normally but uses a malicious subcircuit for trigger-laden inputs) necessitates peering beyond behavior.  
  - **Non-negotiable**: Yes. The *raison d'être* of mechanistic anomaly detection.  

  #### **5. Finite-Access Decidability**  
  - **Description**: The account must admit verification with bounded compute/data, using only query access to activations or gradients (no exhaustive weight inspection).  
  - **Motivation**: Inspectors cannot assume infinite resources (e.g., real-time deployment). Definitions requiring exact topological conjugacy are infeasible.  
  - **Non-negotiable**: Yes. Practical deployability depends on this.  

  #### **6. Adversarial Sharpness**  
  - **Description**: The account must detect inputs that induce *arbitrarily small mechanistic deviations* from benign processing (e.g., a trigger pixel perturbation activating a backdoor).  
  - **Motivation: Adversaries will minimize anomalies to evade detection. Overly stable accounts miss edge-case exploits.  
  - **Non-negotiable**: **Contextual**. Conflicts with Coarse-Graining Stability; a trade-off is inevitable.  

  ---

  ### **7. Key Tensions and Joint Unsatisfiability**  
  - **Coarse-Graining Stability (CGS) vs. Adversarial Sharpness (AS)**: These are **fundamentally incompatible**.  
    - *Conflict*: CGS demands insensitivity to functionally irrelevant details (e.g., weight drift), while AS requires sensitivity to minuscule mechanistic shifts (e.g., a single parameter change enabling a backdoor).  
    - *Implication*: An account cannot be maximally robust to noise *and* maximally sensitive to adversarial perturbations. **This trade-off defines the specification frontier**.  
  - **Finite-Access Decidability vs. Theoretical Precision**: Operationalizable approximations (e.g., probing-based methods) inherently sacrifice completeness (e.g., missing mechanisms requiring exponential queries).  

  ---

  ### **8. Exclusion of Obvious Candidates**  
  The **Non-Collapse to Input-Output Equivalence** requirement most decisively excludes naive approaches:  
  - **Behavioral tests** (e.g., distributional output checks) fail, as they cannot distinguish aligned models from those with dormant backdoors.  
  - **Activation clustering** (e.g., k-means on hidden states) often reduces to input-output correlations without causal grounding.  
  - **Circuit/causal analyses** (e.g., interchange interventions) *can* satisfy Non-Collapse but often violate **Retraining/Parameterization Invariance** by overfitting to weight-specific subgraphs.  

  **Core Tension**: The interplay between **Coarse-Graining Stability** (seeking universality classes) and **Adversarial Sharpness** (requiring microscopic sensitivity) is the crux. Resolving this demands a variable "resolution parameter" (e.g., a tolerance for mechanistic divergence), but this itself becomes an attack surface. The physics analogy holds: defining universality classes for critical phenomena ignores irrelevant operators, but anomaly detection *must* detect those operators if adversarially leveraged.  

  ---

  **Specification Summary**: An adequate account must be retraining-invariant, reparameterization-invariant, input-output transcendent, and finite-access decidable, while negotiating the CGS-AS trade-off via explicit tolerances. Failure to reconcile CGS and AS implies that "mechanistic sameness" is context-dependent—a conclusion that *is* the specification.
