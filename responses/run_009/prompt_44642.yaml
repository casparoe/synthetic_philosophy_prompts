  For each, I'll note tractability, neglect, and moving factors (e.g., a breakthrough in formal semantics might boost question 4).

  Finally, the framing question: Should work be judged by progress on modal realism or modality generally? I'll argue for the latter. If Lewis's framework collapses, projects engaging alternatives (like question 3) still advance modality studies. This aligns with the foundation's likely desire for enduring impact beyond one theory. I'll defend this by noting that modal metaphysics evolves, and insights often transfer.

