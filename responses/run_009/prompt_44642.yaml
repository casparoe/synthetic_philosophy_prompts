answer: |-
  Here is a prioritized research agenda for the foundation, balancing philosophical significance, tractability, and potential impact. I assign **40% weight to internal questions** (contingent on modal realism's truth) and **60% weight to external questions** (bearing on whether to accept modal realism or any modal metaphysics). This weighting reflects that the *viability* of modal realism hinges more on resolving external challenges (epistemic, reductive) than refining internal details. A beautifully elaborated system that remains unjustified or unmotivated is ultimately sterile.

  ### Ranking & Justification
  **1. The Epistemic Access Problem for Concrete Worlds (External)**  
     *Question*: Can we have justified beliefs about causally isolated concrete worlds? If so, how?  
     *Ranking Justification*: This is the most urgent external challenge. If belief in concrete worlds is epistemically bankrupt, the theory collapses regardless of its internal virtues. It impacts all modal metaphysics (how *any* theory grounds modal knowledge).  
     *Tractability*: Moderate. Work could integrate formal epistemology (e.g., Bayesian models of non-causal confirmation) with modal intuition.  
     *Neglect*: Significant. Most responses are defensive (e.g., "inference to best explanation"). Few construct *positive* accounts of non-causal modal justification.  
     *Move up/down*: Up if formal epistemology develops tools for non-causal confirmation; down if consensus emerges that intuition alone suffices.  

  **2. Is Reductionism Necessary? (External)**  
     *Question*: Must a theory of modality provide a reductive analysis (as Lewis insists), or can we treat modality as primitive?  
     *Ranking Justification*: Undercuts Lewis’s core motivation. If reduction isn’t required, ersatzism/fictionalism gain ground, and modal realism’s ontological cost becomes indefensible. Affects the entire metaontology of modality.  
     *Tractability*: High. Leverages debates in meta-metaphysics (e.g., demands on explanation) and philosophy of language.  
     *Neglect*: Moderate. Discussed in critiques but rarely the *focus*. Early-career scholars could reframe it.  
     *Move up/down*: Up if metaontology shifts toward anti-reductionism; down if Lewis’s "incredulous stare" argument is decisively rehabilitated.  

  **3. Do Fictionalist/Ersatzist Alternatives Inherit the Same Problems? (External)**  
     *Question*: Do rival theories (e.g., ersatz possible worlds as abstract entities) face *equally severe* versions of epistemic, semantic, or metaphysical objections leveled against modal realism?  
     *Ranking Justification*: **Most underrated question**. Critics assume ersatzism avoids epistemic costs, but abstract objects are also causally inert. If rivals inherit the same problems, modal realism’s disadvantages diminish. Quietly presupposed in most comparisons.  
     *Tractability*: High. Requires comparative analysis of objections (e.g., access to abstract worlds vs. concrete worlds).  
     *Neglect*: Severe. Rarely addressed systematically.  
     *Move up/down*: Up if ersatzists develop new epistemic models; down if a rival cleanly dissolves an objection.  

  **4. Counterpart Theory’s Role in Semantics vs. Metaphysics (Internal)**  
     *Question*: Is counterpart theory primarily a solution to *de re* modality’s problems (e.g., transworld identity), or does it have indispensable semantic applications (e.g., in counterfactuals) even if modal realism is false?  
     *Ranking Justification*: Vital for modal realism’s internal coherence and exportability. If counterpart semantics is indispensable elsewhere, it bolsters Lewis’s framework.  
     *Tractability*: Moderate. Requires formal semantics work (e.g., modeling counterfactuals without counterparts).  
     *Neglect*: Low. Active area (e.g., Kocurek on counterpart-free semantics), but needs metaphysicians.  
     *Move up/down*: Up if semantics finds counterpart-free models fail; down if logicians decouple counterparts from modality.  

  **5. Can Modal Realism Absorb Qualitatively Indistinguishable Worlds? (Internal)**  
     *Question*: Does Lewis’s principle of recombination *require* indiscernible worlds? If so, does this violate his "no overlap" constraint or parsimony?  
     *Ranking Justification*: Tests modal realism’s internal consistency and its handling of haecceitism. Less urgent than above, as it assumes the framework is viable.  
     *Tractability*: High. Uses combinatorial logic and mereology.  
     *Neglect*: Moderate. Niche but active (e.g., Divers on recombinatorial limits).  
     *Move up/down*: Up if quantum indistinguishability pressures metaphysics; down if haecceitism debates resolve.  

  **6. The Structure of the Counterpart Relation (Internal)**  
     *Question*: Must the counterpart relation be grounded in *similarity*, and if so, along which dimensions?  
     *Ranking Justification*: **Most overrated question**. Lewis already conceded context-dependence. Debates over similarity metrics rarely affect downstream applications (e.g., counterfactual semantics, *de re* modality).  
     *Tractability*: High. Conceptual analysis suffices.  
     *Neglect*: Low. Well-trodden ground (e.g., Sider, Hazen).  
     *Move up/down*: Downward unless tied to a concrete problem (e.g., decision theory).  

  ### Foundation’s Framing Question: Evaluation Criteria  
  **Work should be evaluated by progress on understanding modality generally**, *not* solely by progress for Lewis’s modal realism. Defending this:  

  1. **Antifragility**: If modal realism collapses, projects focused *only* on internal questions (e.g., counterpart similarity) become obsolete. But projects addressing external questions (e.g., epistemic access, reductionism) retain value—they inform *why* it collapsed and shape successors.  
  2. **Broad Impact**: Modal metaphysics won’t disappear if Lewis’s view fails. Work on epistemic access (Rank 1) or reductionism (Rank 2) applies to ersatzism, fictionalism, or primitivism.  
  3. **Intellectual Honesty**: Funding agendas that presuppose modal realism’s truth risk insulating it from decisive critique. The foundation should encourage work that could *falsify* (or transform) the framework.  

  **Concrete Implications**:  
  - Projects on Ranks 1–3 would succeed if they clarify the costs/benefits of *any* modal metaphysics (e.g., showing epistemic access is equally problematic for ersatzism).  
  - Even Rank 4 (counterpart semantics) could yield tools usable by fictionalists.  
  - Only work *exclusively* on Ranks 5–6 would risk obsolescence—but these are lower priority.  

  ### Recommended Allocation
  Fund projects addressing:  
  1. Epistemic access to concrete worlds (2 positions)  
  2. Reductionism’s necessity for modal metaphysics (1 position)  
  3. Comparative obligations of modal realists vs. ersatzists/fictionalists (1 position)  

  This balances high-impact external questions (80% of weighting) with neglected but tractable avenues, ensuring durability beyond Lewis’s framework.
