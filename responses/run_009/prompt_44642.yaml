  For the ranking, I'll consider importance, tractability, neglect, and what could change the priority. Importance splits into impact on modal realism itself versus broader modality studies. I'll give 40% weight to internal questions (crucial for the framework's viability) and 60% to external questions (decisive for adoption/rejection), since the foundation likely cares about real-world philosophical uptake.

