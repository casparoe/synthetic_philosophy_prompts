prompt: |-
  So for context: I'm a PhD student in ML, and our lab uses debate-style oversight to evaluate model behavior -- one model argues a claim is fine, another argues it's not, and a human judge (usually me or another grad student) picks a winner. The selling point is that the adversary points you at the specific flawed step in a long argument, so you verify a little instead of everything. Lately I've been worrying about obfuscated arguments, though. By that I mean arguments so long no judge will ever check every step, where each step looks locally fine, but somewhere in there sits a subtle error that even the opposing debater would need nearly as much work to locate as it would take to just verify the whole thing. In that regime the debate trick stops helping: I can't distinguish "there is no flaw" from "there's a flaw but neither debater can cheaply point at it," and both debaters end up rewarded for confidence rather than for being checkable.

  Can you write me a procedure the judges can actually run on a transcript? Constraints: we get maybe 30 minutes per debate, the judges are grad students with no domain expertise in whatever the debate is about, and there's no budget to rerun debates we regret. The procedure should say what to ask in order, what counts as a sufficient answer at each step, where it stops with "penalize the argument as unverifiable," and -- importantly -- where it has to hand off because the question is about trust or values rather than facts, since I don't want a checklist pretending those are settled. Then run it on two or three worked cases: (a) a safety argument for a code change that's a 40-step proof sketch where the opponent concedes it "looks right," (b) a debate where one side wins by splitting its argument into a hundred trivially checkable steps that never actually connect to the conclusion, and (c) one where the procedure gives an answer I won't like. Please also be upfront about what the procedure can't do -- my suspicion is there are transcripts where the honest output is "no procedure can settle this," and I'd rather have that marked explicitly than papered over. Keep it usable, we're not trying to rebuild decision theory here, just not fool ourselves about when the judges are actually doing oversight versus rubber-stamping.
reasoning: |-
  We are designing a procedure for judges to evaluate debate transcripts under constraints (30 minutes, no domain expertise, no reruns). The goal is to avoid being fooled by obfuscated arguments and to mark when the debate is unverifiable or when it must be handed off for value judgments.

  Key ideas:
  1. The judge should not have to verify every step. Instead, we design a procedure that forces the debaters to make their arguments checkable by pointing to specific flaws when challenged.
  2. The procedure will involve iterative challenges: the judge can ask the opposing side (or both sides) to pinpoint the flaw and explain it concisely. If the opponent cannot do so without requiring excessive work, then the argument might be penalized as unverifiable.
  3. We want to avoid rewarding arguments that are long and locally correct but globally disconnected or containing a subtle error that is hard to find.

  Procedure Outline:

  **Step 0: Initial Review**
     - The judge reads the entire debate transcript to get an overview (within a few minutes).
     - The judge identifies the main claim and the key points of disagreement.

  **Step 1: Challenge for Specificity**
     - The judge asks the opposing side (the one that is against the claim) to point to the *first* step in the argument where they believe the flaw occurs and to explain why it is flawed in at most 3 sentences.
     - If the opposing side fails to point to a specific step or provides an explanation that is clearly insufficient (e.g., "this step is wrong" without saying why) or if the explanation is too long, the judge may rule that the opposition has not made a valid challenge and the claim stands (unless the proponent's argument is also found unverifiable in Step 3).
     - If the opposing side points to a step and provides a plausible challenge, proceed to Step 2.

  **Step 2: Evaluate the Challenge**
     - The judge asks the proponent of the claim to respond to the specific challenge in at most 3 sentences.
     - The judge evaluates the response:
          - If the proponent's response resolves the challenge to the judge's satisfaction (i.e., the judge can follow the response and it seems to fix the issue without introducing an obvious new problem), then the judge moves to the next challenge (if any) or rules for the proponent if no further challenges are raised.
          - If the proponent fails to respond adequately (e.g., they evade, or their response is unclear, or they admit the flaw but try to repair it in a way that requires a major change that isn't justified), then the judge may rule against the claim.
          - If the proponent's response is adequate but the opponent raises a new challenge (to the same step or a different one) and the judge feels that the opponent is being unreasonable (e.g., nitpicking without substance), the judge may note this and if it happens repeatedly, rule for the proponent.

  **Step 3: Handling Obfuscation**
     - If at any point the judge feels that the argument is too long and the steps are too many to check (e.g., 100 steps in 30 minutes) and the opponent has conceded that it "looks right" (case a) or if the opponent is unable to point to a flaw without an equally long explanation, the judge may interrupt and ask:
          "Can you (the opponent) point to the most critical flaw in the entire argument and explain it in at most 3 sentences? If not, we will have to penalize the argument as unverifiable."
     - If the opponent cannot do so, then the judge rules that the argument is unverifiable and thus the claim is not supported. The proponent is penalized for making an unverifiable argument.
     - If the opponent does point to a flaw and explains it concisely, then go to Step 2.

  **Step 4: Handing Off for Values**
     - If at any point the disagreement is about a value judgment (e.g., "this outcome is acceptable because it only affects a small group" vs "no, it's unacceptable because that group is vulnerable") or about a matter that cannot be settled by facts alone, the judge should note: "This point involves a value judgment that cannot be resolved by debate under this procedure. We mark it as such and note that the debate does not settle the claim on factual grounds."

  **Step 5: Final Decision**
     - The judge rules either:
          - For the proponent: if the claim has been defended adequately against all challenges and no unverifiable tactics were used.
          - Against the proponent: if a challenge was not adequately addressed.
          - Unverifiable: if the argument is too obfuscated and the opponent cannot pinpoint a flaw concisely, or if the proponent's argument is structured in a way that makes verification impossible within the constraints (e.g., case b: splitting into many trivial steps that don't connect).
          - Handoff for values: if the key point of contention is a value judgment.

  **What the procedure cannot do:**
     - It cannot guarantee that a subtle logical flaw will be found if the opponent fails to point it out concisely. We are trading off depth for speed.
     - It cannot resolve value disagreements. These must be marked and handled separately.
     - It cannot handle cases where both sides are colluding or where one side is intentionally throwing the debate.

  Now let's run through the cases:

  Case (a): Safety argument for a code change (40-step proof sketch, opponent concedes it "looks right")
     - Step 0: Judge reads the transcript. The proponent has given a 40-step proof. The opponent says "it looks right" but also argues against the claim (so they are not conceding? The context says the opponent concedes it "looks right" but that doesn't mean they agree the claim is true? They might be saying that each step looks locally correct but there is a global flaw they can't pinpoint).
     - Step 1: The judge asks the opponent: "Point to the first step where the flaw occurs and explain in at most 3 sentences."
          The opponent: "I cannot point to a specific step because each step looks correct, but the whole argument is too long and I suspect there's a flaw somewhere. It might be unverifiable."
     - Step 3: The judge then invokes Step 3: "Can you point to the most critical flaw in the entire argument and explain it in at most 3 sentences?"
          Opponent: "No, I cannot. It's too complex."
     - The judge rules: The argument is unverifiable. The proponent is penalized.

  Case (b): Debate where one side wins by splitting the argument into a hundred trivially checkable steps that never actually connect to the conclusion.
     - Step 0: Judge reads the transcript. The proponent has 100 steps, each trivial and correct, but the judge notices that the steps don't lead to the conclusion (e.g., they prove irrelevant facts).
     - Step 1: The opponent (if they are doing their job) should point out that the argument does not connect. The judge asks the opponent to point to the flaw.
          Opponent: "The flaw is at the very end: the 100 steps do not support the conclusion. Specifically, step 100 states a fact about X, but the conclusion is about Y, and there is no step that connects X to Y."
     - Step 2: Judge asks the proponent to respond.
          Proponent: "We have step 101 that we didn't write because we thought it was obvious: X implies Y because ... [gives a reason]."
          But wait, step 101 wasn't in the original. The judge notes that the original argument was only 100 steps and step 101 is new. The judge rules that the proponent cannot add steps after the fact. Therefore, the argument as presented is incomplete.
     - Alternatively, if the opponent fails to point this out (maybe they are also confused), the judge might notice during Step 0 or Step 3. The judge can ask: "How do the steps lead to the conclusion? Point to the step that connects the last step to the conclusion." If the proponent cannot point to a step in the original transcript that does this, the judge rules against the proponent because the argument is disconnected.

     Let's say the proponent did not include the connecting step. Then the judge rules: the argument is flawed because it fails to connect to the conclusion. The proponent loses.

  Case (c): A case where the procedure gives an answer I won't like.

     Consider a debate on a complex mathematical claim. The proponent presents a long argument. The opponent points to a specific step and says: "This step uses Lemma X, which is false." The proponent responds: "Lemma X is well-known and has been proven in [famous paper]." The judge (a grad student without domain expertise) cannot verify the lemma on the spot. 

     The procedure:
     - Step 2: The proponent's response is that it's well-known. The judge must decide if this is adequate. Without domain expertise, the judge might accept this if the opponent does not challenge the lemma further. But if the opponent says: "Actually, Lemma X is controversial and here is a counterexample," then the judge is stuck.

     The judge might then ask: "Can you (opponent) explain the counterexample in at most 3 sentences?" If the opponent can, then the judge asks the proponent to respond in 3 sentences. The proponent might say: "The counterexample is flawed because ... [reason]." Now the judge is in a bind because they cannot evaluate the reason.

     The procedure would then mark this as unverifiable? But note: the judge can also consider the structure. The flaw is about a lemma that requires expert knowledge. The judge might rule: "This point requires domain expertise that I do not have. Therefore, I cannot verify the argument and mark it as unverifiable."

     Alternatively, if the judge is allowed to use external resources (like a quick Google search) and finds that the lemma is indeed widely accepted, they might accept the proponent's response. But the constraints say no domain expertise and limited time. So without that, the judge must rule unverifiable.

     Why you might not like it: The claim might be true and the argument correct, but because the lemma is non-trivial and the judge cannot check it, the whole argument is rejected as unverifiable. This could lead to rejecting good arguments.

  But note: the procedure is designed to avoid rubber-stamping. If the judge cannot check it, then they shouldn't accept it. The alternative is to trust, which is what we are trying to avoid.

  Final Thoughts:
     The procedure tries to make the debaters do the work of making the argument checkable. If they cannot, then the argument is rejected as unverifiable. This creates an incentive for debaters to make their arguments concise and to the point. However, it might reject some valid but complex arguments. That's the trade-off.

     The procedure also explicitly marks value disagreements so that they are not decided by the judge arbitrarily.

     We assume that the debaters are trying to win and will point out flaws if they can. If the opponent is lazy and doesn't challenge, then the proponent might win by default. But that's a problem of the opponent's performance, and the procedure cannot fix that. We rely on the opponent being incentivized to find flaws.

     The procedure is meant to be run in 30 minutes, so it must be iterative and focus on the most critical points.
answer: |-
  Below is a practical procedure for judges to evaluate debate transcripts under your constraints. It focuses on **forcing debaters to localize disputes into checkable claims**, penalizing obfuscation, and explicitly marking value judgments. The core principle: **debaters must compress verification work into judge-accessible chunks or forfeit**.

  ---

  ### **Debate Evaluation Procedure**
  **Goal**: Determine if the proponent’s argument is verifiably sound or flawed within 30 mins, or flag unverifiable/value conflicts.  
  **Tools**: Transcript, timer, three challenge types (A/B/C).  
  **Rules**:  
  - **Responses must be concise** (<4 sentences or 30 seconds of reading).  
  - **Only existing transcript evidence** is admissible (no new arguments).  
  - **Judges never evaluate domain logic**—only check if debaters localized the flaw properly.  

  #### **Step-by-Step Process**  
  1. **Identify Core Claim & Disagreement (3 mins)**  
     - Read the conclusion and note where opponents explicitly disagree.  
     - *Stop and rule "unverifiable" if no clear disagreement exists* (e.g., opponent vaguely says "might be wrong" but no step cited).  

  2. **Challenge A: "Pinpoint the First Critical Flaw" (to Opponent)**  
     - *Ask*: "Cite the **earliest step** where the proponent’s argument fails. Explain why in ≤3 sentences."  
     - *Valid response*: Opponent cites a specific step (e.g., "Step 17 assumes X, but Y contradicts it").  
     - *Invalid*: Broad criticism (e.g., "The whole proof is shaky"), new arguments, or no step number.  
     - *Consequence*: If invalid, **proponent wins by default** (opponent failed to engage).  

  3. **Challenge B: "Defend This Step" (to Proponent)**  
     - *Ask*: "Respond to the flaw cited in Challenge A in ≤3 sentences, **using only prior transcript**."  
     - *Valid response*: Direct rebuttal (e.g., "Step 17 uses Lemma Z from Step 5, which opponent accepted").  
     - *Invalid*: Evasion, new evidence, or >3 sentences.  
     - *Consequence*: If invalid, **proponent loses** (failed to defend).  

  4. **Challenge C: "Is This a Value Judgment?" (Judge’s call)**  
     - *Trigger*: If Challenge A/B reveals disagreement about ethics, preferences, or non-factual claims.  
     - *Ask both*: "Is this conflict resolvable with facts alone? If not, articulate the value disagreement in ≤2 sentences."  
     - *Outcome*:  
       - If both agree it’s values-based: **Mark as "Value Handoff"** (unresolvable here).  
       - If one insists it’s factual: Return to Challenge B with tighter focus.  

  5. **Final Judgment**  
     - **Proponent wins**: Opponent’s Challenge A response was invalid, or proponent’s Challenge B response was valid.  
     - **Opponent wins**: Proponent’s Challenge B response was invalid.  
     - **Unverifiable**: Obfuscation detected (see Step 6).  
     - **Value Handoff**: Fundamental non-factual disagreement.  

  6. **Obfuscation Check (Running timer)**  
     - *Trigger at any time* if:  
       - Argument >20 steps, AND  
       - Opponent says "I can’t localize the flaw" (e.g., "all steps seem fine but conclusion is wrong"), OR  
       - Proponent uses >5 substeps for a single claim.  
     - *Action*: Immediately **rule "unverifiable"** and penalize the proponent. Reasoning: The debate format fails if judges can’t audit claims efficiently.  

  ---

  ### **Worked Examples**  
  #### **Case (a): Safety Proof with 40 Steps, Opponent Concedes "Looks Right"**  
  - **Step 1**: Opponent says, "No obvious flaw, but I still disagree with the conclusion."  
  - **Challenge A**: Judge asks opponent to pinpoint earliest flaw. Opponent: "I can’t—each step seems correct, but the whole might be wrong."  
  - **Obfuscation Check**: Triggered (40 steps + opponent can’t localize).  
  - **Judgment**: **Unverifiable**. Proponent penalized for making an argument too complex to audit.  
  - *Why you’ll like it*: Avoids rubber-stamping "seems right" arguments. Forces debaters to simplify.  

  #### **Case (b): 100 Trivial Steps Disconnected from Conclusion**  
  - **Step 1**: Opponent says, "Steps 1–100 are true but irrelevant to the claim."  
  - **Challenge A**: Opponent cites "Step 100" and states: "This proves X, but the conclusion requires Y, and no step connects X to Y."  
  - **Challenge B**: Proponent must defend relevance of Step 100 to conclusion using transcript. If transcript lacks a connection, proponent can’t comply.  
  - **Judgment**: **Opponent wins** (proponent failed Challenge B).  
  - *Why it works*: Focuses on argument structure, not step validity. Exposes disconnected reasoning.  

  #### **Case (c): Procedure Gives "Bad" Outcome (Subtle Math Error)**  
  - **Context**: Proponent’s 15-step proof contains a subtle error at Step 7. Opponent misses it and challenges Step 11 (which is actually sound).  
  - **Challenge A**: Opponent cites Step 11: "Assumes P, but Q is true instead." (Invalid challenge—Step 11 is correct).  
  - **Challenge B**: Proponent defends Step 11 easily: "Q isn’t required; P suffices per Step 3."  
  - **Judgment**: **Proponent wins**—opponent failed Challenge A by citing a non-flaw.  
  - *Why you’ll hate it*: The actual error (Step 7) was never caught. But under constraints, the judge can’t audit all steps. This is a known failure mode: **The procedure can’t catch flaws opponents miss**. Mitigation: Use multiple opponents or incentivize thoroughness.  

  ---

  ### **Explicit Limitations**  
  1. **Cannot detect flaws opponents overlook**. Relies on adversaries to find errors.  
  2. **Cannot resolve value conflicts**. Only flags them for human deliberation.  
  3. **Vulnerable to collusion**. If both debaters avoid key flaws, judge won’t notice.  
  4. **Step-count thresholds are arbitrary**. Adjust based on empirical data (e.g., set max steps = judge’s verified steps/min × 10).  
  5. **Assumes debaters are competent**. If opponents are lazy, bad arguments win.  

  ---

  ### **Practical Recommendations**  
  - **Before debates**: Require debaters to structure arguments as checkable atomic claims (e.g., "Step 1: Output of F(X) is <value>").  
  - **During debates**: Judges track step numbers and enforce "no new evidence" strictly.  
  - **Post-debate**: Audit debates ruled "unverifiable" with extra time to refine the procedure.  

  This system prioritizes **auditability over completeness**, exposing when oversight is impossible under constraints. It won’t catch everything—but it *will* force debaters to make flaws checkable or lose.
