  The audience includes two logicians (proof and model theorists), a cognitive scientist, a grad student sympathetic to Penrose, and a Kantian organizer. All have read GEB, and none are dualists. The user wants a Q&A sheet with objections each member would raise, ordered by likelihood, with replies, concessions, and soft spots. Plus, the question they dread.

