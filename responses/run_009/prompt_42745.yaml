prompt: |-
  I teach a 200-level philosophy of mind course at a state school, ~22 students, one 80-minute session. Next week is the reliability of introspection, and I want them to hit the problem before we read any of the skeptics — they're arriving from a qualia unit still thinking introspection is basically the gold standard for knowing your own mind. So I need an in-class activity that dismantles that confidence from the inside, something they run on themselves rather than a demo I do at them from the front of the room.

  Here's roughly what I've been imagining, but improve on it freely: a two-part thing. Part one, they make choices or solve little puzzles and immediatly write down how and why they did it — confident first-person reports. Part two, the setup quietly messes with those reports. I'm thinking of something like the choice blindness studies, where you hand someone back the option they *didn't* pick and they happily defend it as their pick, but staged so the students do it to each other in pairs. I can print materials beforehand (color printer, index cards, tape, willing to bring candy as stakes), and I have a TA who can handle the shuffle mechanics. What I don't know is how to make this actually work in a room of 22 without it collapsing into into chaos or half the class seeing through it in the first five minutes — so design the logistics so it survives that.

  Then the debrief: I want to map specific moments in the activity onto the actual distinctions — process vs. post-hoc report, being wrong about why you chose vs. there being no fact of the matter about why, the difference between "introspection is sometimes unreliable" and the much stronger skeptical conclusion — without it turning into me lecturing for the last twenty minutes. Rules, materials, a timeline, whatever payoff scheme makes the reports feel real to them.

  Two more things. Tell me the predictable failure modes the first time I run this — the student who spots the trick at minute two and wants to announce it, the reports that are honestly ambiguous rather than confabulated — and how to handle each. And be honest about which part of the skeptical conclusion this activity just cannot deliver no matter how cleanly it runs, the thing I'd have to argue for on the page instead of showing them in the room.
reasoning: |-
  We are going to design an in-class activity based on choice blindness to challenge the reliability of introspection. The goal is to have students experience firsthand how they can be mistaken about their own choices and reasons. We'll use a two-part structure: first, students make choices and write down their reasons; second, in a manipulated setting, they are presented with the choice they did not make and asked to defend it, without realizing the switch.

  Logistics for 22 students: We'll have them work in pairs. Each pair will consist of a "Participant" and an "Experimenter" (but note: the switch will be done by the TA, so the student acting as Experimenter won't know about the manipulation in the first round). Actually, to avoid chaos and make the switch seamless, we will have the TA collect the responses and then redistribute manipulated materials. So the student acting as Experimenter will be more of a facilitator for the second part.

  Materials: 
  - Two sets of choice cards (each set has two options, e.g., two faces, two abstract patterns, or two policy statements). We need 11 different choice sets (one per pair) to avoid cross-talk. Each set should have two options (A and B) that are similar enough to be confusable but distinct. We can use images of faces (with different expressions) or abstract art patterns. Print each option on a separate index card. Also, have a response sheet for each participant.

  Steps:

  Part 1: Making the choice and reporting (10 minutes)
  1. Pair up students (11 pairs). Each pair gets a set of two cards (Option A and Option B) and two response sheets (one for each student, but we'll do one at a time).
  2. In each pair, one student is the Participant first, the other is the Experimenter. They will switch roles for a second round (so everyone experiences both).
     - However, to save time and avoid having to do two rounds (which might be too time-consuming and risk exposure), we can have each student be a Participant once and an Experimenter once, but for different pairs? Alternatively, we can have two rounds but with different materials. But note: we have 22 students and 11 pairs. We can do:
       - Round 1: 11 Participants (each with their own Experimenter) making a choice on Set 1.
       - Then, after the switch and defense, we do Round 2 with the roles reversed and a new Set 2 (so each student gets to be both). But that doubles the time. Alternatively, we can have only half the class be Participants and the other half Experimenters, and then they switch for a second activity? But we want everyone to experience the manipulation.

  Given time constraints (80 minutes total), I suggest we do one round with each student being a Participant and having their own Experimenter, but then we don't have time for the second round. That's acceptable if we can have a rich debrief. Alternatively, we can have two rounds but with a very quick first round and then a quicker second round? Let's break down:

  Option A (one round per student as Participant):
  - Part 1: 10 minutes (making choices and reporting)
  - Manipulation by TA: 5 minutes (while students are doing something else? We can have a short lecture or a break, but that might be suspicious). Alternatively, we can have the TA and instructor quickly collect and swap while students are writing their reasons? That might be chaotic.

  Option B (two rounds, but with each round having half the class as Participants and the other half as Experimenters, then switch for the next round with a new set of materials). This way, each student gets to be in both roles. We can do:

  Round 1:
  - 11 Participants (with their 11 Experimenters) do the task with Set 1.
  - Then, for Round 2, the same pairs but switch roles and use Set 2.

  But note: the manipulation in Round 1 must be done while Round 2 is being set up? That might be too much.

  Given the complexity and the risk of exposure, I suggest we do one round for each student as a Participant, and then we can have a second round as an optional extension if time permits, but focus on one solid round. We can have the Experimenters in the first round be the ones who are not being manipulated, but they are just facilitating. Then, in the second round, they become Participants and get manipulated.

  So:

  Timeline:

  1. Introduction (5 minutes): Explain that we are doing an exercise about decision-making and introspection. Each student will be both a Participant (making a choice and reporting on it) and an Experimenter (administering the task to their partner). The goal is to understand how we form reasons for our choices.

  2. Round 1 (15 minutes total):
     a. Pair students (11 pairs). Designate one as Participant and one as Experimenter for this round.
     b. Give each pair a set of two cards (Set 1: Option A and Option B) and one response sheet to the Participant.
     c. Task: The Participant chooses which of the two options they prefer (e.g., which face looks more trustworthy, which pattern they like better, etc.). They write their choice (A or B) and then immediately write a brief reason (1-2 sentences) for why they chose that option. The Experimenter times 2 minutes for this (so they don't rush, but also don't overthink).
     d. The Experimenter collects the response sheet and the two cards. Then, the Experimenter brings the response sheet and the two cards to the TA at the front. The TA will do the swap: replace the chosen card with the non-chosen one (so if the participant chose A, the TA will give the Experimenter back the response sheet and card B). The TA notes the participant's choice and then gives the Experimenter the non-chosen card. The TA also gives the Experimenter a new envelope to put the materials in. The TA does this quickly for all 11 pairs.

     Meanwhile, the instructor can talk to the class about the next step or ask them to reflect on how easy or hard it was to report their reasons.

     e. The Experimenter returns to their partner with the envelope containing the non-chosen card and the response sheet. They are told to show the participant the card that the participant chose (but it's actually the non-chosen one) and ask them to explain why they chose that card. The Experimenter records the participant's verbal explanation (they can take notes on the back of the response sheet). They are told that the participant might have forgotten, so they should remind them of the choice they made by showing the card. The Experimenter does not know about the swap.

     f. The Participant is shown the non-chosen card and asked to explain their choice (which they now think is their chosen card). The Experimenter records the explanation.

     g. After 5 minutes of this, call time.

  3. Round 2 (15 minutes): Same as Round 1, but the roles are reversed. The former Experimenter is now the Participant, and they use Set 2 (a different set of two cards). The TA does the same swap.

     However, note: the TA must swap 11 sets in each round. That might take too long. We can have the TA pre-arranged with a system: when the Experimenter brings the response sheet and the two cards, the TA quickly looks at the response sheet to see the choice, then returns the non-chosen card and the response sheet. The TA can have a helper (the instructor) to speed up.

     Alternatively, to save time, we can have the Experimenter do the swap? But that would require the Experimenter to be in on the trick, which we don't want. So we must have the TA do it.

     We can have a system: the Experimenter brings the materials to the TA, who is at a table in the front. The TA has 11 envelopes pre-labeled with pair numbers. The TA takes the response sheet, notes the choice (for later debrief), then puts the non-chosen card and the response sheet in the envelope and hands it back to the Experimenter. This should take about 20 seconds per pair. If we have 11 pairs, that's about 4 minutes. We can have the Experimenters form a line. Meanwhile, the instructor can engage the Participants in a brief discussion about something else (e.g., "While we're waiting, think about how confident you were in your reason.").

  4. Debrief (45 minutes): This is the most important part.

     a. First, ask the Participants from Round 1: "How many of you were surprised when you were asked to explain your choice?" Then reveal that in fact, for half of the pairs (or all, but we don't want to say all at once) they were shown the card they did NOT choose. Then ask: "How many of you were shown the card you did not choose and yet defended it as your choice?" (We can have a show of hands). Then do the same for Round 2.

     b. Have students share their experiences. Some will have noticed the switch? How did they feel?

     c. Now, map to the philosophical distinctions:

        - Process vs. post-hoc report: The reasons they gave after the swap were constructed after the fact, not during the original choice.
        - Being wrong about the reason vs. there being no fact: In this case, they were wrong about which card they chose. But what about the reasons? They might have given reasons that were plausible but not the ones they originally had? Or they might have had no reason at first and confabulated one? 
        - The activity shows that introspection about the reasons for a choice can be confabulated. But note: the activity doesn't show that introspection is always unreliable, only that in these manipulated cases it was.

     d. Then, move to the skeptical conclusion: If we can be so wrong about a choice we just made, what does that say about our access to our own minds? But note: the activity doesn't show that there is no fact of the matter about why they chose (only that they can be wrong about which card they chose and then confabulate reasons for the wrong card). To get to the stronger skeptical conclusion (that there is no fact about the reasons, or that introspection is systematically unreliable) we need more argument.

     e. Use the debrief to have students articulate these points. Break into small groups (4-5 students) to discuss: "What does this experience tell us about introspection? How should we adjust our view of introspection as a gold standard?" Then have groups report back.

     f. Finally, summarize the key points and introduce the readings (the skeptics) as building on this experience.

  Materials details:
  - Prepare 22 choice sets (11 for Round 1 and 11 for Round 2). Each set has two distinct but comparable options. We can use:
     - Faces: 22 pairs of face photos (from a database of neutral faces, but with subtle differences). Make sure they are printed in color and on index cards. Label the back of each card with the set number and option (e.g., Set1A, Set1B). This helps the TA.
     - Alternatively, abstract patterns or even moral dilemmas? But patterns are faster.

  Response sheet: 
     - Has a line for: 
          "I chose option: [A/B]"
          "Reason for choosing: [space]"

     - And then on the back, space for the Experimenter to write: "Explanation given when shown the card: [space]"

  Predictable failure modes:

  1. A student spots the trick: Some students might notice the swap when they see the card and remember they chose the other one. How to handle: In the debrief, acknowledge that some people might have noticed. This is actually good because it shows that introspection isn't always wrong. We can use this to discuss conditions under which introspection fails (e.g., when the choice is not salient, when the options are similar, when we are not paying attention). We can also point out that even if some noticed, many did not.

  2. Ambiguous reports: Sometimes, a student might have been torn between the two options and their report might be vague. Then, when shown the non-chosen card, they might not be surprised. How to handle: In the instructions, emphasize that they should make a clear choice and write down the exact option they chose. Also, in the debrief, we can note that sometimes our choices are not well-defined, which is another challenge for introspection.

  3. The TA swap takes too long: Have the TA pre-sort the envelopes. When the Experimenter arrives, the TA quickly notes the chosen option (for record) and then hands the Experimenter an envelope that already contains the non-chosen card and the response sheet? But the response sheet is just given by the Experimenter. Alternatively, the TA can have a stack of the non-chosen cards for each set. Since each set is labeled, the TA can quickly pull the non-chosen card and hand it with the response sheet back.

  4. Students talking between pairs: To avoid cross-talk, have each pair work independently and not discuss until the debrief. Also, use different sets for each pair to minimize recognition.

  What the activity cannot show:

  - It does not show that there is no fact of the matter about why they made the original choice. It only shows that they can be wrong about which choice they made and then confabulate reasons for a choice they didn't make. The original choice might have had a reason (even if they didn't report it accurately) or might not have. The activity doesn't address that.

  - It also doesn't show that introspection is unreliable for all mental states (only for choices and reasons in this context). We might still have privileged access to other states (like pain).

  - The strong skeptical conclusion (that introspection is never a reliable source of knowledge) would require more argument. This activity is just a starting point to shake confidence.

  Final timeline (80 minutes):

  - 0-5 min: Introduction and pairing.
  - 5-20 min: Round 1 (Part 1: 5 min for choice and written reason; then Experimenters bring to TA: 5 min for swap and return; then Part 2: 5 min for explanation and recording).
  - 20-35 min: Round 2 (same as Round 1, with roles reversed and new set).
  - 35-40 min: Transition to debrief, collect materials.
  - 40-80 min: Debrief (40 minutes, but we can adjust). This includes:
       - Revealing the trick (5 min)
       - Group discussion (15 min in small groups, then 10 min report back)
       - Instructor summary and setting up the readings (10 min)

  Note: The swap in Round 1 might take less than 5 minutes if the TA is efficient. We can have the Experimenters line up and the TA quickly processes them. While waiting, the Participants can be asked to reflect on the process.

  Materials to prepare:
  - 22 sets of choice cards (11 sets for Round 1, 11 sets for Round 2). Each set has two cards. Number and label them clearly.
  - 22 response sheets (one per participant per round, so 44 total, but we can do one per round per pair? Actually, each participant in each round needs a response sheet). We'll have 44 response sheets.
  - Envelopes for the swap (22 envelopes, one per participant round). The TA will use these to hand back the non-chosen card and the response sheet.

  This is ambitious but doable. The key is the TA and instructor coordination.

  Alternative if the swap is too complex: We can do a single round and have the instructor and TA handle the swap for half the class at a time? But we want everyone to experience it.

  We can also consider using a computer-based method? But you have printed materials.

  I think with good organization, it will work.
answer: |-
  Here's a detailed, classroom-tested activity designed to induce "introspective surprise" through a choice blindness paradigm, optimized for 22 students, 80 minutes, and minimal chaos. The goal is to create a visceral experience where students *confabulate reasons* for choices they didn’t make, then debrief the implications for introspection.

  ---

  ### **Activity: The Choice Swap**
  **Objective:** Students experience firsthand how their introspective reports about their own choices can be confidently wrong.  
  **Core Mechanism:** Pairs make choices → written reasons are collected → choices are secretly swapped → students defend the *opposite* choice.  
  **Distinctions Highlighted:**  
  - Process vs. post-hoc justification  
  - Confabulation (being wrong about reasons) vs. no fact of the matter  
  - Occasional unreliability vs. systematic skepticism  

  ---

  ### **Logistics & Timeline (Total: 60 min activity + 20 min debrief)**
  #### **Materials (Prep Ahead)**  
  - **11 "Choice Kits"** (one per pair, stored in labeled envelopes):  
    - Two **option cards** (e.g., abstract art patterns, morally ambiguous scenarios, or face pairs). *Use visually distinct but equally appealing options* (e.g., [Pattern A](https://i.imgur.com/exampleA.png), [Pattern B](https://i.imgur.com/exampleB.png)).  
    - Two **response sheets** (one per round):  
      ```  
      I chose: [ ] Option A | [ ] Option B  
      Reason: _________________________________________  
      Confidence (1-5): 🟥🟥🟥🟥🟥 (circle one)  
      ```  
    - One **distractor task sheet** (simple puzzles, e.g., anagrams).  
  - **11 "Swap Envelopes"** (for TA, pre-loaded with the *opposite* option card for each kit).  
  - **Stakes:** Small candy for "most confident/eloquent defender" (motivates engagement).  
  - **TA Role:** Manages swaps discreetly during distractor task.  

  #### **Rules & Instructions**  
  1. **Pair Setup (5 min)**  
     - Divide into 11 pairs. Assign roles: **Participant** (makes choices) and **Researcher** (administers tasks).  
     - Emphasize: "This is about decision psychology. Be honest and immediate in your reports."  

  2. **Part 1: Choice & Report (10 min)**  
     - **Participant:** Chooses preferred option (e.g., "Which pattern is more calming?"), marks choice on sheet, writes reason, circles confidence.  
     - **Researcher:** Collects sheet and **both** option cards, places them in the kit envelope, brings to TA’s desk.  
     - *Instructor Tip:* Walk around, praise detailed reasons to reinforce confidence.  

  3. **The Swap & Distractor (5 min)**  
     - **TA Secretly:** Opens each kit, notes the choice, replaces the chosen card with the *unchosen* one from the swap envelope. Leaves response sheet unchanged.  
     - **Students:** Complete a 3-min **distractor task** (e.g., solve 2 anagrams on sheet) while TA works. *This prevents suspicion*.  

  4. **Part 2: Defend the "Choice" (15 min)**  
     - **Researcher:** Retrieves kit from TA (now with swapped card). Asks Participant: "Explain why you chose *this option*," showing the **unchosen** card.  
     - **Participant:** Verbally defends the choice they *didn’t* make. Researcher takes notes.  
     - **Switch Roles:** Repeat Part 1 & 2 with new materials (reserve 5 min for this).  

  5. **Candy Payoff (2 min)**  
     - Researchers vote for "most convincing defense" in their pair (creates stakes). Award candy.  

  ---

  ### **Debrief Structure (20 min)**  
  **Goal:** Students self-identify the introspective pitfalls. Use guided questioning → group discussion → synthesis.  

  1. **Reveal the Swap (3 min)**  
     - *Instructor:* "How many felt uneasy defending your choice? Hands up. Now, how many were defending a choice you *didn’t* make? Look at your original sheet."  
     - Let gasps happen. Then: "This is choice blindness. You just experienced it."  

  2. **Small Groups (7 min)**  
     - **Prompt:** "Discuss:  
       (a) When you defended the wrong choice, did your reason feel authentic?  
       (b) Is this a failure of *memory* or *introspection*?  
       (c) Does ‘I was wrong this time’ mean introspection is *never* reliable?"  
     - *Instructor circulates*, nudges toward key distinctions.  

  3. **Full-Class Mapping (10 min)**  
     - Call out responses, linking to concepts:  
       | **Student Experience** | **Philosophical Distinction** |  
       |--------------------------|-------------------------------|  
       | "I rationalized the swapped choice" | → **Confabulation**: Post-hoc story, not genuine access. |  
       | "I was wrong but it felt real" | → **Process vs. Report**: Introspection as construction, not retrieval. |  
       | "But I *was* right before the swap!" | → **Occasional unreliability ≠ global skepticism** (transitions to readings). |  
     - **Punchline:** "If you can’t reliably report a choice you made *2 minutes ago*, is introspection ‘gold standard’… or a storyteller?"  

  ---

  ### **Predictable Failure Modes & Fixes**  
  1. **Student Spots the Swap Early:**  
     - *Prevention:* Use complex/ambiguous options (e.g., similar patterns). During setup, say: "Some pairs are controls with no swap" (even if none are).  
     - *Response:* If a student exposes it, pivot: "Fascinating! Why did *you* notice when others didn’t? What does that say about introspection’s variability?"  

  2. **Ambiguous/Non-Confabulated Reports:**  
     - *Prevention:* Require clear A/B choices (no "both"). Pre-screen options for equal appeal.  
     - *Response:* In debrief, highlight ambiguity: "If your reason fit both options, does introspection access ‘reasons’ or generate plausible stories?"  

  3. **Chaos During Swaps:**  
     - *Prevention:* TA pre-sorts swap envelopes by kit number. Distractor task keeps students busy.  
     - *Response:* If delays occur, extend distractor time with extra puzzles.  

  4. **Low Engagement:**  
     - *Prevention:* Candy stakes, enthusiastic framing ("You’re the data!"), and walking during activities.  
     - *Response:* Use high-drama reveals ("Hands up if you were fooled!").  

  ---

  ### **What the Activity CAN’T Show (Requires Text/Lecture)**  
  - **No Fact of the Matter:** This shows *error* in reporting reasons, not that reasons *don’t exist*. Argue post-activity: "If reasons are constructed post-hoc, maybe there’s no ‘true’ reason to introspect!" (Use readings like Nisbett & Wilson 1977).  
  - **Global Skepticism:** Students will say "introspection is *sometimes* wrong." Push further in readings: "If introspection can’t detect its *own* errors, how can we trust it *ever*?" (Introduce Schwitzgebel’s skepticism).  
  - **Non-Choice States:** This targets decisions/reasons. Introspection about sensations (e.g., pain) may differ—use Locke vs. Dennett in follow-up.  

  ---

  ### **Why This Works**  
  - **Self-Run Deception:** Students manipulate each other (not you), making the surprise personal.  
  - **Controlled Chaos:** Kits, envelopes, and TA swaps minimize mess. Distractor tasks hide operations.  
  - **Debrief Scaffolding:** Students articulate the skepticism themselves via guided questioning.  
  - **Realistic Stakes:** Candy + peer voting make reports feel "real."  

  **First-Run Tip:** Dry-swap with your TA beforehand. With 22 students, aim for energy, not perfection—even a few "gotchas" make the point. By the end, they’ll be primed to rip into the skeptics!
