    Let me compute the known and unknown in the disjunctions:
    - Red-or-yellow: This is the same as not black. The proportion of red-or-yellow is 1 minus the proportion of black. Since the black proportion is unknown, the proportion of red-or-yellow is also unknown (it could be from 30/90 to 90/90). Specifically, if black is 0, then red-or-yellow is 90; if black is 60, then red-or-yellow is 30. So it varies between 1/3 and 1.
