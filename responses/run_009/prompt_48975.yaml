prompt: |-
  I'm a third-year philosophy student taking an intermediate ethics seminar, and in two weeks I have to run a forty-minute tutorial session on supererogation for a group of eight students who are mostly non-philosophy majors taking the course as an elective. The tricky part is that the session follows directly on one where we covered Kant's distinction between perfect and imperfect duties, so several of them will arrive thinking that "supererogatory" is just a fancy word for what Kant already called an imperfect duty — and one of the eight is a vocal act utilitarian who I know will push back that the whole category is confused: if an act maximizes the good, you're obliged to do it, and if it doesn't, you shouldn't, so where does "beyond duty" even get a grip? I also want the session to do more than cover the standard soldier-jumps-on-the-grenade story, since half of them will have heard some version of that and will file the whole topic under "heroism, obviously fine, next."

  Please act as an experienced teacher of introductory ethics and plan the session for me rather than just explaining the concept yourself — the deliverable is a teaching plan. Start with a few minutes of brainstorming the possible ways to structure it and tell me which one you'd go with and why; then set out the order in which the components have to be introduced and what depends on what. I want the following covered explicitly: which single carrying example should anchor the whole session and what properties it needs (I suspect it has to be a case where doing the act is genuinely optional, genuinely praiseworthy, and omitting it is genuinely blameless — all three at once, and ordinary enough that they can picture themselves in it); the misconceptions the group is predictably going to bring or form — I'm guessing the imperfect-duty conflation, the "anything not forbidden is supererogatory" slide, and the utilitarian's complaint, but tell me if you see others — and the exact point in the sequence where each one should be headed off rather than left to fester until questions; how to handle the utilitarian objection so that it becomes a teaching resource instead of a derailment; one question I can pose at the end that would show me whether they've actually grasped the category rather than just nodded along; and finally what I should openly refuse to get into at this level — my seminar instructor mentioned there's a whole literature on whether consequentialists can accommodate supererogation at all, and on supposedly different flavors of going beyond duty, and I suspect that's a swamp for this audience, but you tell me. Please think carefully about the dependency structure and be concrete about timing across the forty minutes.
reasoning: |-
  Okay, let me tackle this teaching plan for the ethics tutorial on supererogation. The user is a third-year philosophy student running a session for non-majors right after covering Kant's perfect/imperfect duties, with specific challenges: students might conflate supererogation with imperfect duties, and there's a vocal act utilitarian in the group. 

  First, I need to identify the core misconceptions. The Kantian conflation is predictable since imperfect duties involve discretion, but supererogation requires blameless omission—unlike imperfect duties where neglecting them entirely is blameworthy. The utilitarian objection is trickier: if maximizing good is obligatory, how can anything be "beyond duty"? 

  For the anchoring example, it must be mundane yet unambiguous. Rescuing a stranger from a burning building is too extreme; donating a kidney is life-altering. A better fit is covering a colleague's shift when they're overwhelmed—it's optional, praiseworthy but not obligatory, and omitting it carries no blame. Crucially, students can imagine themselves in this scenario.

  The utilitarian objection should be reframed as a feature, not a bug. When the student raises it, I'll pivot to: "Great point—let's test this!" Then present two cases: one where not donating a kidney is permissible (supererogation intact), another where not donating causes direct harm (duty). This forces them to see utilitarianism's demandingness as separate from supererogation's structural possibility.

  Timing is tight. Minute 0-5: contrast Kantian duties with the shift-covering example to establish the three criteria. Minute 20: deliberately surface the utilitarian objection through the kidney case comparison. Minute 35: end with a diagnostic question—"Is every charitable act supererogatory?"—to reveal if they grasp blameless omission versus imperfect duty neglect.

  I'll explicitly avoid consequentialist accommodation debates and "flavors" of supererogation. Those require parsing Chisholm vs. Heyd, which would lose the class. Instead, emphasize that the category exists descriptively—even if utilitarians dispute its normative weight—and save deeper theory for their essays.
answer: |-
  Here’s a structured teaching plan designed for your constraints, leveraging predictable misconceptions as teaching moments while keeping the session focused and grounded. The goal is to **build the concept operationally** through examples and distinctions rather than abstract definitions.

  ---

  ### **Session Structure Choice & Rationale**  
  **Chosen Structure: "Problem-Solution Scaffolding"**  
  *Why?* Starts with students’ existing framework (Kant), surfaces tensions via concrete cases, resolves misconceptions in stages, and uses the utilitarian objection to deepen understanding. Avoids "heroism fatigue" by centering ordinary acts.

  ---

  ### **Timing & Component Flow** (Total: 40 mins)  
  ***(Dependencies in bold)***  

  1.  **Bridge from Kant & Surface Misconceptions** (5 mins)  
      -   *Activity:* Quick recap: "Last week, Kant said imperfect duties (e.g., beneficence) allow discretion about *how/when* to act. What might someone *mistakenly* call ‘supererogatory’ using Kant’s framework?"  
      -   *Target:* Elicit the conflation ("Imperfect duty = supererogatory!"). **DEPENDS ON PRIOR SESSION.**  
      -   *Response:* "Hold that thought – let’s test it with a case."

  2.  **Anchor Example: "The Overwhelmed Colleague"** (10 mins)  
      -   *Case:* *You’re finishing your own demanding work. A colleague (not a close friend) is visibly distraught, facing a deadline catastrophe due to their poor planning. You could stay late and significantly help them, sacrificing your evening plans. You choose not to. They fail.*  
      -   *Properties:*  
          -   **Optional:** No prior commitment, not your fault.  
          -   **Praiseworthy if done:** Recognizably kind, self-sacrificial.  
          -   **Blameless omission:** Not lazy, selfish, or cruel; reasonable self-care.  
      -   *Q:* "Is failing to help here a violation of an imperfect duty (beneficence)? Why/why not?"  
      -   *Key Point:* **Distinguishes supererogation from imperfect duty.** Kant demands *some* beneficence sometimes; total neglect is blameworthy. Here, omission is blameless *despite* opportunity for significant good. **SETS UP SUPEREROGATION CRITERIA.**

  3.  **Formalize the Concept & Block "Not Forbidden = Supererogatory"** (8 mins)  
      -   *Define:* "Supererogatory acts are: (1) Morally *good*, (2) *Praiseworthy* to do, (3) **NOT blameworthy to omit** (omission is *permissible*), (4) *Not required* by duty."  
      -   *Block Misconception:* "Does this mean *any* morally permissible act is supererogatory? No! Eating lunch is permissible but not *praiseworthy*. Supererogation requires the act to be *especially good/beneficial*, beyond baseline expectations."  
      -   *Check:* "In the colleague case, what makes helping *praiseworthy* but omitting *blameless*?" **DEPENDS ON ANCHOR EXAMPLE.**

  4.  **Utilitarian Objection: Turn it into a Test Case** (12 mins)  
      -   *Predict & Invite:* "An act utilitarian might say: 'If helping maximizes good, it’s *obligatory*; if not, it’s wrong. So ‘beyond duty’ is nonsense!' Let’s engage this seriously."  
      -   *Case Variation 1 (Anchor):* Re-state colleague case – sacrificing evening *does* maximize good (prevents catastrophe).  
          -   *Q (to class):* "Utilitarian: Is helping *obligatory* here? If yes, does that mean omitting is *blameworthy*?" **FORCES CONFRONTATION WITH BLAMELESS OMISSION INTUITION.**  
      -   *Case Variation 2 (Duty):* *Your colleague’s catastrophe is solely because you *promised* weeks ago to review their key data today, but you forgot and made other plans.*  
          -   *Q:* "Utilitarian & Non-Utilitarian: Is helping now obligatory? Is omission blameworthy?" (Yes! This is a *perfect duty*).  
      -   *Key Point:* **The utilitarian objection highlights *demandingness*, not the *category*.** Anchor case shows: even if maximizing good (Variation 1), intuition says omission is *not blameworthy like breaking a promise (Variation 2)*. Supererogation captures this difference. **RESPONDS TO UTILITARIAN; DEPENDS ON CRITERIA CLARITY.**

  5.  **Beyond Grenades: Spectrum of Cases** (3 mins)  
      -   *Quick Examples:*  
          -   *Ordinary:* Donating $20 to a disaster fund when financially comfortable.  
          -   *Significant:* Donating a kidney to a stranger.  
          -   *Extreme:* Soldier on grenade (acknowledge it, but note it’s one end).  
      -   *Emphasis:* "Key is the *structure*: optional, good, praiseworthy, blameless omission. Scale varies."

  6.  **Diagnostic Closing Question** (2 mins)  
      -   *Q:* **"Imagine someone regularly does small, kind acts for strangers (like paying for the coffee of the person behind them). Are these acts supererogatory? Why or why not? What crucial question must we ask?"**  
      -   *Target Understanding:* They must identify **"Is OMITTING this act *blameworthy*?"** If yes (e.g., if it’s part of a commitment, or baseline decency), it’s likely an imperfect duty. If no (omission is fine, doing it is just nice), it fits supererogation. Reveals grasp of *blameless omission* as the critical differentiator.

  ---

  ### **What to Explicitly Avoid**  
  1.  **Consequentialist Accommodation Debates:** Don’t dive into whether Rule Utilitarianism or Satisficing Consequentialism *can* technically allow supererogation. Say: "Some consequentialists adjust their theories to make room for the intuition; others bite the bullet and deny supererogation is possible. That’s grad-level territory. Today, we’re mapping the *concept* as widely understood."  
  2.  **"Flavors" of Supererogation:** No need to distinguish "optative" vs. "beneficent" supererogation (Heyd/Chisholm) or discuss acts of "offering" vs. "sacrifice". Keep it unified: *beyond duty, praiseworthy, blameless omission*.  
  3.  **Meta-Ethical Justification:** Don’t debate *why* supererogation exists or if it’s "objectively real". Focus on the conceptual space and intuitions supporting it.

  ---

  ### **Why This Works for Your Group**  
  -   **Leverages Prior Knowledge:** Starts with Kant to create cognitive friction, resolving it builds the new concept.  
  -   **Preempts Misconceptions:** Actively names and corrects conflation (Kant), overbreadth ("not forbidden"), and utilitarianism *during* the flow where the examples make it tangible.  
  -   **Anchors in the Ordinary:** "Overwhelmed Colleague" is relatable, non-heroic, and perfectly isolates the 3 criteria. Avoids triggering "obviously heroic, no nuance" dismissal.  
  -   **Uses Utilitarian as Resource:** Their objection becomes a tool to stress the *blameless omission* criterion via contrasting cases. Shows respect while demonstrating the concept’s resilience.  
  -   **Clear Diagnostic:** The closing question tests for the *core insight* (blameless omission ≠ imperfect duty neglect) using a plausible misinterpretation.  

  **Teaching Tip:** When the utilitarian objects, *thank them*: "That’s a crucial challenge – let’s use it to test our concept!" This validates them while steering the energy productively. Write key criteria (Praiseworthy? Blameless Omission?) on the board and refer back constantly. Good luck!
