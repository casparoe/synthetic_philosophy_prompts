answer: |-
  ## Dissertation Prospectus: The Half-Life of Responsibility - Temporal Decay in Luck Egalitarianism

  **1. Core Question:** Under what conditions, and to what extent, should the *sequence length* (i.e., the number of prior, deliberate, fully informed choices an individual has made concerning a specific distributive domain) influence the classification of resulting inequalities as brute luck or option luck for the purposes of luck egalitarian justice at a given time? Specifically, does a principled distinction emerge where option luck loses its "responsibility-tracking" force over time due to compounding effects, effectively decaying into brute luck?

  **2. The Gap: Existing Positions and Their Limits**
  Existing luck egalitarian frameworks provide conflicting, yet principled, answers to responsibility over time, leaving the core question unresolved:

  *   **The Whole-Lives View:** This dominant perspective assesses distributive justice based on an individual's entire life history of choices and chances. Inequalities resulting from *any* past deliberate choice (option luck) remain the individual's responsibility indefinitely. Early luck, even if compounded, is part of the life one is responsible for shaping. This view provides a clear, principled line: *if* the initial risk was chosen, *all* ensuing consequences are option luck. However, it risks making justice assessments extremely harsh over long sequences, as early randomness dominates final outcomes despite identical subsequent choices.
  *   **The Time-Slice View:** This perspective assesses distributive justice based on an individual's current circumstances and opportunities at a specific moment, largely decoupled from past choices. Past option luck outcomes are treated as part of the current brute luck endowment. This avoids the harshness of the whole-lives view but provides no clear principle for *when* past choices cease to be relevant, potentially undermining the core luck egalitarian commitment to holding individuals responsible for the consequences of their choices. It risks collapsing the brute/option distinction too readily.

  **Neither view adequately addresses the compounding nature of iterated choices.** The whole-lives view ignores how early randomness can swamp later responsibility; the time-slice view ignores the continuity of agency. The central question – whether and how responsibility *attenuates* over multiple rounds – remains genuinely open. This project seeks a principle distinct from these two poles, focused on the *dynamics* of responsibility over sequences of choice.

  **3. Method: Modeling, Criteria, and Institutional Analysis**

  Over two terms, the project will proceed concretely:

  *   **Term 1: Building and Analyzing the Stylized Model**
      *   **Model Construction:** Develop a formal model of iterated, fair gambles with compounding stakes. Key parameters: starting endowment, number of rounds (n), stake size per round (fixed or variable), win/loss probability (fair=0.5). Crucially, model agents making *identical sequences* of deliberate, informed choices in each round.
      *   **Analysis:** Simulate outcomes for agents differing *only* in the sequence of random outcomes (e.g., Agent A: Win, Win, Loss; Agent B: Loss, Win, Win). Quantify the divergence in final holdings as `n` increases. Measure metrics like variance in outcomes, probability of falling below a threshold, and the relative impact of early vs. late outcomes.
      *   **(*Confident in model utility; unsure about optimal complexity vs. tractability*)**

  *   **Term 1/2: Defining and Testing Candidate "Decay" Criteria**
      *   Identify plausible theoretical principles for when option luck might decay into brute luck:
          1.  **Regret Threshold:** Decay occurs when an agent would, with near certainty, regret the *sequence* of choices given the outcome, despite each choice being rational ex-ante.
          2.  **Control Dilution:** Decay occurs when the variance in outcomes attributable purely to the randomness of the sequence dominates the variance attributable to the choice to engage in the sequence itself.
          3.  **Opportunity Set Constriction:** Decay occurs when early losses constrain future opportunity sets (stakes) so severely that subsequent "choices" are effectively made under duress or with severely diminished agency relative to the starting point.
          4.  **n-Round Responsibility:** Responsibility diminishes predictably with each round (e.g., proportional to 1/sqrt(n)).
      *   **Test:** Apply each criterion rigorously to the model's outputs. Determine at what `n` (if any) each criterion triggers decay. Assess coherence and intuitive plausibility. Does any criterion yield a non-arbitrary point or function?
      *   **(*Confident criteria can be defined; highly unsure if any will yield a robust, non-arbitrary decay point/rate*)**

  *   **Term 2: Checking Against Legal Institutions (Not Mere Illustration)**
      *   **Selection:** Analyze specific legal doctrines designed to interrupt sequences of loss:
          *   **Bankruptcy Discharge:** Cancels debts accrued through (often) risky ventures or misfortune, providing a financial "reset."
          *   **Limited Liability:** Caps investor losses from business ventures, preventing total ruin from iterated business risks.
          *   **Statutes of Limitations:** Bar legal claims after a period, limiting the temporal reach of past choices/events.
          *   **Social Insurance (e.g., unemployment, disability):** Provides support after failures despite prior choices.
      *   **Analysis:** Interrogate these institutions *as potential empirical implementations of decay mechanisms*. Ask:
          *   What specific "sequence length" problem is each institution addressing?
          *   What implicit "decay threshold" (e.g., time elapsed, magnitude of loss, type of risk) does the institution embody? Is it consistent?
          *   Can the institution be rationally reconstructed as implementing one of the tested decay criteria, or a blend? Does it suggest a novel criterion?
          *   Does this institutional perspective reveal flaws or strengths in the abstract criteria/model?
      *   **(*Confident institutions provide relevant data; unsure if coherent decay principles underpin them or if they reflect ad-hoc compromises*)**

  **4. Possible Results & Contribution**

  *   **Positive Result:** Identification of a specific criterion (e.g., Control Dilution) that yields a non-arbitrary decay function (e.g., decay proportional to sequence variance). This would provide a novel principle for temporal responsibility in luck egalitarianism, reconciling choice-sensitivity with the harshness critique, and offering a normative lens for evaluating "fresh start" institutions.
  *   **Negative Result:** Demonstration that *no* plausible criterion derived from luck egalitarian commitments (fairness, agency, responsibility) yields a non-arbitrary decay point or rate. This is still a significant contribution:
      *   It reveals a deep tension within luck egalitarianism: uncompromising responsibility over sequences leads to morally problematic outcomes dominated by early randomness, yet relaxing responsibility lacks a principled basis within the theory.
      *   It forces a reevaluation: perhaps the theory *must* incorporate an exogenous policy parameter for responsibility timescales, or perhaps it fundamentally struggles with temporality.
      *   It clarifies the debate: the core issue isn't "choice vs. no choice," but "over what temporal scope does choice confer responsibility?"
  *   **Hybrid Result:** Different decay criteria or thresholds might apply to distinct domains (financial, health, career) or types of risk, potentially mapped onto different institutions.

  **5. Fragility & Failure Conditions**

  *   **Key Fragility - The Irrelevance of Sequence Length:** The project fails if it turns out that, upon rigorous analysis, the *mere fact of a long sequence of choices* does not meaningfully change the moral character of the resulting inequality compared to a single choice. If early losses *don't* genuinely diminish agency or make later "choices" qualitatively different in a responsibility-grounding way, then the "decay" framing is fundamentally mistaken. A successful argument here would lead to abandoning the core thesis, forcing retreat to either a strict whole-lives view (with its harshness) or a different justification for resets.
  *   **Other Failure Conditions:**
      *   **Model Inutility:** The iterated gamble model proves too simplistic or misleading to capture the relevant features of real-life choice sequences (e.g., learning, changing preferences, social embeddedness). *(Mitigation: Test model robustness with variations; anchor insights in institutional analysis)*.
      *   **Institutional Mismatch:** Legal "fresh starts" cannot be coherently interpreted as implementing decay principles, instead being driven solely by efficiency, compassion, or historical accident without illuminating the core philosophical question. *(Mitigation: Prioritize philosophical coherence over perfect institutional fit; focus on core logic of discharge/liability caps)*.
      *   **Criterion Collapse:** All proposed decay criteria either collapse into arbitrariness (e.g., "decay after 10 rounds") or reduce to existing whole-life/time-slice views without adding a distinct temporal dimension. *(Mitigation: Exploring this rigorously *is* a valuable negative result)*.
      *   **Intractable Complexity:** Formalizing the decay concept leads to insurmountable technical or conceptual difficulties that prevent clear conclusions. *(Mitigation: Focus on conceptual clarity and institutional insights over excessive formalism)*.

  **Conclusion:** This project challenges a static understanding of the brute/option luck distinction by investigating the temporal dynamics of responsibility. By modeling iterated choices, testing decay criteria, and critically examining legal "reset" institutions, it seeks to determine whether luck egalitarianism possesses the resources to define a principled "half-life" for responsibility, thereby addressing the harshness critique and offering a novel perspective on justice over time. Whether successful in finding such a principle or in demonstrating its impossibility within the theory's constraints, the project aims to significantly advance the debate on luck, choice, and temporal responsibility.
