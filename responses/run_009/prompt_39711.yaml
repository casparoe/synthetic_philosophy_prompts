prompt: |-
  Last night a friend and I argued for hours about conscription — she holds the straightforward liberal view that it is two years of forced labor and that a professional volunteer army is the only arrangement consistent with taking people's choices seriously — and while I kept doing well on individual cases, I came away unable to state what I actually believe. Here are the verdicts I found myself defending. Conscription as such does not offend me, roughly the way taxation does not offend me: it seems to me one of the duties that come with membership in a state. Finland's practice of conscripting only men while women serve, if at all, purely by choice does offend me — if the duty exists, it should fall on both sexes, which is why I approved when Sweden reintroduced conscription and applied it to women as well as men. The old Swiss arrangement of the militiaman keeping his service rifle at home strikes me, if anything, as admirable: the means of national defense belonging to the citizen rather than to the state seems to me the point of a citizen-army, not a defect. Yet the volunteer professional army troubles me in a way I could not articulate to her: I kept saying that it lets a society subcontract the risks of its defense onto those with the fewest other options, and that paying wages converts a shared duty into someone else's job — the old Civil War device of letting a draftee pay a fee or hire a substitute, laundered into respectability. On the other hand, I have no sympathy for conscripting anyone to fight beyond the country's own defense: a conscripted expeditionary force, even for a good cause, seems plainly wrong, and I find Swiss-style armed neutrality coherent and even honorable — though I cannot see why, if shared risk is my rationale, it should end at the border. The case that kept me up afterward: conscientious objectors in Finland get an alternative civilian service deliberately made longer than military service as a disincentive, which I think is legitimate even given the extra length; but the total objector who refuses even that and, as I understand it, is still sometimes sent to prison is someone I cannot bring myself to say the state may jail — even though we jail tax evaders, and I have just compared conscription to taxation. So my question is what principle, if any, captures these verdicts. Please answer in exactly five numbered points, each one or two sentences long, with nothing before or after the list: (1) the most precise statement of the principle that best fits my verdicts; (2) the verdict it fits worst, and whether that verdict or the principle should give way; (3) what the principle says about the jailed total objector; (4) what it says about two cases I did not raise — a neutral state recruiting foreign volunteers into a professional force, and compulsory civilian service such as emergency hospital staffing during a crisis; and (5) the single sentence I should have said to my friend when she called conscription forced labor.
reasoning: |-
  Okay, the user presents a complex ethical dilemma about conscription after a lengthy debate with a friend. They've outlined several specific positions that seem contradictory on the surface: accepting conscription as a civic duty akin to taxation, rejecting gender inequality in draft systems, admiring Switzerland's citizen-soldier model, criticizing professional armies as exploitative, opposing conscription for offensive wars, yet struggling with punishing total conscientious objectors. 

  Hmm, the core tension appears between their acceptance of state-enforced duties and their discomfort with coercion when applied in certain ways. Their analogy to taxation is telling - they accept mandatory contributions for collective goods but draw lines at disproportionate burdens and punitive enforcement. The Swiss model resonates because it embodies citizen ownership rather than state subjugation.

  The foreign volunteer question is particularly thorny - if shared risk is the principle, outsourcing defense to mercenaries clearly violates it, but what about allies volunteering in a justified war? Their neutrality stance suggests they'd reject this too unless it's purely defensive assistance. For compulsory civilian service, their approval of Finland's alternative service implies they'd accept crisis mobilization if equally applied and defense-related.

  Notably, their deepest conflict emerges around the jailed total objector. Their comparison to tax evasion suggests logical consistency demands accepting imprisonment, yet their visceral rejection reveals an unarticulated limit to state coercion - perhaps where conscience fundamentally conflicts with duty. This might be the crack in their philosophical framework.

  The five-point format request is useful for distilling principles but risks oversimplifying. I'll need to articulate a core principle that explains both their acceptances (Finland/Sweden drafts, Swiss model) and rejections (gender inequality, expeditionary conscription), while honestly addressing where it strains against their objector dilemma. The "forced labor" retort should reframe conscription as reciprocal obligation rather than oppression.
answer: |-
  Here are the five points as requested:

  1.  Conscription for national defense is a legitimate, non-discriminatory civic duty binding on all citizens, akin to taxation, where shared risk and citizen ownership of defense are paramount, but it becomes illegitimate when applied offensively or punitively against fundamental conscience without alternative.
  2.  The verdict it fits worst is the jailed total objector; the principle (accepting coercion akin to tax enforcement) should give way to the verdict, indicating a limit where absolute conscientious refusal cannot be justly imprisoned despite the civic duty analogy.
  3.  Regarding the jailed total objector: The principle suggests the state *may* enforce the duty (like jailing tax evaders), but the verdict's rejection reveals a deeper limit – that absolute conscientious objection to any service constitutes a fundamental right the state should accommodate without imprisonment, even if it requires a non-punitive alternative or exemption.
  4.  On neutral states using foreign volunteers: This violates the principle, as it avoids shared risk and citizen ownership, outsourcing core defense. On compulsory civilian crisis service: If equally applied, non-discriminatory, defense-related (e.g., pandemic response as homeland security), and essential, it aligns with the principle of shared civic duty.
  5.  "Conscription is not forced labor for the state's benefit, but a non-discriminatory shared duty of citizenship essential for national defense, where the citizen, not just the state, bears the responsibility and owns the means."
