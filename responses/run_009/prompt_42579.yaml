  ## The Hart-Devlin Crucible: Integrity Crimes and the Self-Portrait Challenge

  The Hart-Devlin debate, crystallized around the Wolfenden Report's recommendation to decriminalize homosexuality, remains a foundational clash in legal philosophy. Lord Patrick Devlin, in *The Enforcement of Morals*, defended the state's right to enforce a society's shared morality, arguing its common morality is the essential "bond" holding society together, akin to its government or territory. His test for identifying this morality was the reaction of "the reasonable man" or the jury – intense feelings of "intolerance, indignation, and disgust" signified a pillar of societal morality warranting legal protection. H.L.A. Hart, in *Law, Liberty, and Morality*, launched a powerful counterattack. He argued Devlin dangerously conflated *positive morality* (what people *believe* is moral) with *critical morality* (what *is actually* moral, based on reason). Relying on popular disgust, Hart contended, was irrational and historically perilous, justifying past persecutions of heretics and witches. He championed the Millian "harm principle": state coercion is only legitimate to prevent harm to others, not to enforce morality for its own sake.

  Your debate, rightly moving beyond the settled question of homosexuality, grapples with Devlin's enduring challenge through your friend's sophisticated extensions: "integrity crimes" and the "self-portrait" argument. These are not mere relapses into discredited moralism but serious attempts to address perceived limitations in the Mill-Hart framework.

  **Engaging the Integrity Crimes:**
  Your friend identifies a genuine unease: acts like consensual adult incest (with contraception), bigamy among fully informed adults, consensual dueling, or vote-selling seem to defy easy categorization under a narrow harm principle. No specific individual is demonstrably harmed in Mill's direct sense, and public offense might be minimal or abstract. Yet, a sense persists that these acts degrade something fundamental to the social fabric – its "integrity." Does this force a concession to Devlin?

  The Mill-Hart framework possesses more resources than often acknowledged to address these, though it may require careful articulation and potentially an auxiliary principle:

  1.  **Expanding "Harm":** Hart himself acknowledged the harm principle needed careful interpretation. Harm isn't always direct physical injury.
      *   **Vote-Selling:** This profoundly harms the *institution* of democratic governance. It corrupts the representative process, undermining the legitimacy of government for *all* citizens. It actively damages the public good – fair and representative decision-making – in a tangible, systemic way. This fits squarely within a harm principle focused on the public sphere and collective interests vital to individual liberty.
      *   **Consensual Dueling:** While mutual consent exists, the state has a compelling interest in preventing lethal violence as a means of dispute resolution. It destabilizes public order, potentially encourages vigilantism, and wastes human life that could contribute to society. The harm is to the state's monopoly on legitimate force and public safety.
      *   **Bigamy:** While complex, the harm often lies in deception (if one spouse is unaware) or the potential for fraud regarding inheritance, social benefits, and legal obligations tied to marital status. Where *all* parties are fully aware and no fraud occurs, the strongest argument shifts to offense or institutional harm (see below), but the case for prohibition weakens significantly under Hartian scrutiny.

  2.  **The Offense Principle (Feinberg):** Joel Feinberg, building on Mill, argued that preventing *serious offense* (beyond mere dislike) to others can be a legitimate ground for limited prohibition. This addresses the "ick factor" explicitly.
      *   **Consensual Adult Incest:** This is arguably the hardest case for the harm principle. While genetic risks are mitigated by contraception, the profound and near-universal revulsion it evokes, linked to deep-seated taboos about family structure and roles, might constitute "serious offense" under Feinberg's criteria. However, applying this requires extreme caution. The offense must be widespread, unavoidable (not easily avoidable by simply not participating), and profound, not just a reflection of ingrained prejudice. Hart would warn that criminalizing based *solely* on this revulsion risks repeating historical errors. A Hartian might reluctantly concede a *possible* case based on profound offense to deeply held societal norms concerning the family unit, but would demand overwhelming evidence of the seriousness and unavoidability of the offense, likely preferring non-criminal social sanctions.
      *   **Bigamy (Revisited):** If all parties are consenting and aware, the primary argument shifts to offense against the social and legal institution of marriage. Whether this constitutes "serious offense" sufficient for criminalization is debatable; civil non-recognition might be a more proportionate Hartian response.

  3.  **Institutional Harm:** Some "integrity crimes" directly attack the foundations of essential public institutions.
      *   **Vote-Selling:** As above, directly harms the democratic institution.
      *   **Dueling:** Undermines the state's role in adjudicating disputes and maintaining order.
      *   **Incest (Revisited):** A weaker argument could be made that it undermines the social institution of the family, though this is highly contested and risks circularity (criminalizing something because it offends the institution the law defines). Hartians would be skeptical, seeing this as smuggling moralism back in.

  **Conclusion on Integrity Crimes:** The Mill-Hart framework, incorporating a carefully constrained offense principle (Feinberg) and a nuanced understanding of harm to public institutions and collective goods, *can* explain the illegitimacy of most "integrity crimes" without resorting to pure Devlinism. Vote-selling is clearly prohibited due to institutional harm. Dueling is prohibited due to harm to public order and safety. Bigamy often involves harm or fraud; pure, consensual polygamous arrangements face weaker arguments, potentially leaning on offense or institutional concerns, but criminalization becomes harder to justify. Consensual adult incest poses the sternest test. A strict Mill-Hart position might lean towards legality (no direct harm, offense potentially avoidable), while incorporating Feinberg might allow prohibition based on profound, unavoidable offense. However, Hart's warning about the tyranny of feeling remains paramount here; the case for criminalization is weakest and most dangerous in this instance. **Your friend's challenge is potent but not fatal; it pushes the liberal framework to its limits, particularly on incest, but doesn't force an abandonment of its core principles.**

  **Engaging the Self-Portrait Argument:**
  Your friend's second move is profound. Law *is* expressive. A criminal code *does* make a statement about a society's values, its "self-portrait." Devlin is correct that society has *some* right to shape this portrait. The critical question, as you identified and Hart foresaw, is: *What makes a self-portrait accurate or legitimate rather than merely flattering or prejudiced?*

  1.  **Hart's Response:** Hart would absolutely agree law expresses values. However, he would insist these values must be justifiable through *critical morality*, not merely reflect positive morality. An "accurate" self-portrait, for Hart, isn't one that perfectly mirrors current popular sentiment, but one that reflects *rationally defensible* principles – those that can withstand critical scrutiny based on human welfare, justice, and autonomy. A portrait painted by unreasoned disgust is inherently flawed and inaccurate as a guide for coercive law, however sincerely held.
  2.  **Beyond Mere Majority Feeling:** Your friend rightly points out that a portrait can be "badly or falsely" painted. This aligns with Hart's distinction. A legitimate self-portrait through law requires:
      *   **Reason-Giving:** The values expressed must be supported by public reasons accessible to all citizens, not just assertions of feeling or tradition (akin to Rawlsian public reason).
      *   **Consistency with Fundamental Principles:** The portrait cannot violate core liberal principles like equality before the law or fundamental human rights. Criminalizing based on prejudice (e.g., racism, homophobia) paints a false and illegitimate portrait, even if popular.
      *   **Proportionality:** The expressive force of criminal law must be proportionate to the gravity of the underlying wrong *as established by harm or critical morality*, not just the intensity of feeling. Criminalizing minor deviations paints an overly harsh and inaccurate portrait.
  3.  **The Danger:** Devlin's "reasonable man" standard provides *no* criterion for distinguishing a legitimate expression of shared critical values from the enforcement of irrational prejudice. It hands the brush entirely to the jury of popular sentiment, risking a portrait that is flattering to the majority's biases but fundamentally unjust. Hart's framework provides the necessary critical tools: does this law prevent harm or profound offense? Is it consistent with fundamental rights? Can its justification be articulated through public reason?

  **Conclusion on Self-Portrait:** Law is expressive, but its expressive power must be constrained by the demands of critical morality and liberal principle. A society *is* entitled to paint its self-portrait, but it is not entitled to use the criminal law's coercive brush to paint *any* picture it likes, especially one based on unreasoned disgust or prejudice. The legitimacy of the expression derives from its alignment with defensible reasons related to human welfare and justice, not from its popularity alone. **Your friend identifies a true function of law, but Hart provides the essential standard for when that expression legitimately translates into criminal prohibition.**

  **The Verdict: Hart Refined, Not Refuted**

  While your friend's extensions of Devlin are insightful and identify genuine pressure points in the liberal model, they do not succeed in overturning the core Hartian position. Devlin's core theses – the disintegration argument and the "reasonable man" standard – remain flawed. The empirical claim that societies disintegrate without enforced shared morality on private conduct is unsupported. The "reasonable man" standard is a recipe for tyranny, incapable of distinguishing moral truth from popular prejudice.

  However, the debate illuminates necessary refinements within the Mill-Hart tradition:

  1.  **Harm Must Be Understood Broadly (but Carefully):** It must encompass harm to essential public institutions (democracy, the justice system) and collective goods necessary for individual flourishing.
  2.  **The Offense Principle Has Limited Legitimacy:** Preventing profound, unavoidable, and widespread offense can be a secondary justification for criminalization, but it demands stringent safeguards against tyranny by disgust. It is a dangerous tool.
  3.  **Law is Expressive, But Expression Requires Justification:** The "self-portrait" function is real, but the criminal law's coercive expression *must* be grounded in reasons compatible with critical morality, fundamental rights, and public justification. Popular sentiment alone is insufficient.

  **Therefore, Hart was substantially right.** His framework, augmented by Feinberg's offense principle and a nuanced understanding of institutional harm, provides the most defensible basis for criminal law. It protects individual liberty from the unreasoned tyranny of the majority while acknowledging the state's role in preventing genuine harm (broadly construed) and, cautiously, profound offense. Devlin correctly identifies society's anxiety about its moral fabric and the expressive power of law, but his solution – criminalization based on popular disgust – is both normatively unjustified and practically dangerous.

  **Applied to Your Sticking Points:**

  1.  **Consensual Adult Incest (with contraception):** This represents the frontier. A pure Mill-Hart position, prioritizing autonomy and finding no direct, concrete harm, would likely lean towards *decriminalization*. Incorporating Feinberg's offense principle acknowledges the profound near-universal revulsion, potentially justifying *criminalization* if the offense is deemed serious, unavoidable, and linked to safeguarding a fundamental social institution (the family). However, the Hartian warning is strongest here. Given the absence of direct harm and the risk of persecuting private conduct based on deep-seated taboo, the stronger argument within the refined Hartian position is for *legality*, recognizing the profound offense but deeming it insufficient grounds for criminal sanction. Social disapproval and non-legal norms would remain.
  2.  **Vote-Selling:** This is clearly *illegitimate* and should be criminalized under the Mill-Hart framework. It causes direct, tangible harm to the essential public institution of democracy. It corrupts representation, undermines political equality, and damages the collective good of legitimate governance for all citizens. The harm principle, properly understood, demands its prohibition. Its "degradation" is not merely symbolic; it is actively destructive.

  Bring this back to your friend: Hart's core insight – that law must answer to reason, not just feeling – withstands the challenge of "integrity crimes" and the "self-portrait." While society expresses its values through law, the criminal law's unique coercive power must be reserved for preventing tangible harm (including to vital institutions) and, only with extreme caution, profound offense. Devlin's path, granting criminal law the power to enforce popular morality based on disgust, remains a road to potential injustice, even when framed by thoughtful extensions. The correct position is a **robust, refined Hartianism.**
