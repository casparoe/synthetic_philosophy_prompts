prompt: |-
  I'm a retired atmospheric physicist -- thirty odd years building climate models, so trust me, I know what sensitive dependence on initial conditions looks like up close. Now I've got time on my hands and I'm reading ethics, and I keep hitting this thing people call cluelessness: the claim that for most acts you can't work out, even in principle, whether the total consequences are net good or bad, because everything ripples into everything else. Before I go read what actual philosophers have proposed, I want the spec first. Write the desiderata: what any adequate account of how to act under cluelessness has to deliver. Which cases it must get right -- a donation whose effects propagate through markets and other people's responses, an act that looks obviously good but whose knock-on effects could swamp the direct benefit, the situation where you know the sign of the near-term effect but nothing at all about the total. Which distinctions it must respect -- between can't-calculate and no-fact-of-the-matter, between what was reasonable ex ante and what turned out to be right, plus any others you think matter. And what it cant contradict of ordinary decision theory, since as a scientist I'd have assumed expected utility maximization right up until I met this problem. Give the case behind each requirement, say which you'd treat as non-negotiable and which are more like taste, and -- this is the part I care about most -- tell me straight if you suspect some subset of the requirements is jointly unsatisfiable. Then just briefly: how expected utility maximization, satisficing, and a rough "act on the foreseeable and let the rest go" view do against your list. Keep the weight on the criteria, the scoring can be rough.
reasoning: |-
  Okay, the user is a retired atmospheric physicist with thirty years of experience in climate modeling. They're now diving into ethics and encountering the problem of cluelessness—how to act when you can't predict the total consequences of your actions because everything is interconnected. They want a set of desiderata for any theory addressing this, along with cases it must handle, distinctions it must respect, and how it aligns with standard decision theory.

  First, I need to recall what cluelessness entails. It's the idea that for most actions, we can't determine if their overall consequences are good or bad due to ripple effects. The user mentioned examples like donations affecting markets or actions with unforeseen knock-on effects. They want criteria for evaluating solutions to this problem.

  The user's background is crucial here. As a climate scientist, they're familiar with chaotic systems and sensitive dependence on initial conditions, which parallels cluelessness in ethics. They're approaching this with a scientific mindset, likely valuing rigor and systematic analysis. Their request for desiderata before reading philosophers suggests they want to form their own framework first, maintaining their analytical approach.

  Their explicit needs are clear: desiderata, cases, distinctions, non-negotiable vs. negotiable points, and potential unsatisfiable requirements. But deeper, they might be seeking a bridge between their scientific expertise and philosophical ethics. They could be frustrated with how ethics handles uncertainty compared to scientific models. They might also want reassurance that their past reliance on expected utility maximization wasn't misguided, or how to adapt it now.

  I should structure the desiderata into categories: core functionality, epistemic humility, coherence with decision theory, and practical viability. Key cases include charitable donations, obviously good acts with hidden costs, and known near-term effects with unknown long-term impacts. Distinctions like calculational limits vs. no fact of the matter, and ex ante vs. ex post evaluations are essential.

  Non-negotiable points might include avoiding paralysis and maintaining reasonableness standards. The possibility of unsatisfiable requirements is critical—maybe between avoiding paralysis and respecting epistemic limits. I need to highlight if some desiderata conflict, like demanding robust comparisons under deep uncertainty while staying computationally feasible.

  Then, evaluating approaches: expected utility might struggle with cluelessness by requiring precise probabilities. Satisficing could handle it better by setting thresholds, but may not fully address ripple effects. The foreseeable consequences approach simplifies but risks ignoring systemic impacts. Each has trade-offs against the desiderata.

  I should ensure the response is thorough but not overly technical, respecting their expertise while making philosophy accessible. Emphasizing the tension between desiderata will engage their problem-solving instincts. Concluding with a brief assessment gives them a starting point for deeper exploration.
answer: |-
  Here are the desiderata for any adequate account of acting under cluelessness, grounded in your scientific intuition for complexity and deep uncertainty, structured with cases, distinctions, non-negotiables, and potential tensions:

  ### Core Desiderata (Functionality)

  1.  **Avoids Paralysis (Non-Negotiable):** The account MUST provide grounds for action (or deliberate inaction) even when *total* net consequences are incalculable. It cannot imply that *all* action is irrational or forbidden under cluelessness.
      *   *Case:* Deciding whether to donate $1000 to a proven-effective malaria bednet charity vs. investing it vs. spending it. Near-term good is calculable for the donation, total ripple effects (market shifts, behavioral responses, long-term demographic changes) are not.

  2.  **Respects Known Near-Term Impacts (Non-Negotiable):** The account MUST assign significant (often decisive) weight to reasonably foreseeable, proximate consequences of the act, especially when their sign (good/bad) and magnitude are robustly estimable, even if the *total* net effect is clueless.
      *   *Case:* Pulling a drowning child from a shallow pond. The direct benefit is immense and obvious. While long-term ripple effects on the child's life, the rescuer's life, bystanders' psychology, etc., are deeply clueless, the act should still be strongly recommended. Ignoring the near-term certainty would be absurd.

  3.  **Handles Swamping/Backfiring Potential (Non-Negotiable):** The account MUST grapple with the possibility that seemingly good proximate effects could be swamped or reversed by unforeseen knock-on effects, and vice-versa for seemingly bad proximate effects. It cannot naively equate proximate benefit with total net benefit.
      *   *Case:* Introducing a highly efficient predator to control an invasive species (e.g., cane toads in Australia). The proximate effect (reducing toads) seems good, but the predator might devastate native ecosystems. The account must acknowledge this structural risk without demanding impossible predictions.

  4.  **Provides Guidance Under Pure Sign Uncertainty:** The account SHOULD offer a way to reason about acts where the *sign* of the near-term effect is known (e.g., good), but the *magnitude* is highly uncertain *and* the potential for long-term reversal/swamping is significant but unquantifiable.
      *   *Case:* A policy decision with large, positive short-term economic benefits for a region but potential to trigger long-term, large-scale environmental degradation or social instability whose probability and scale are deeply uncertain. (Analogous to complex climate-economic tipping points).

  5.  **Allows for Robust Comparisons (Highly Desirable):** The account SHOULD enable comparisons between acts *under cluelessness*, potentially identifying some as *robustly* better or worse than others, even if absolute net goodness is unknowable. (e.g., "A is foreseeably good and low risk of backfiring; B is foreseeably bad and high risk of cascading catastrophe; choose A").
      *   *Case:* Choosing between donating to disaster relief (high near-term certainty of good, moderate systemic risk) vs. funding speculative geoengineering research (uncertain near-term value, massive catastrophic tail risk).

  ### Essential Distinctions (Epistemic Humility & Reasonableness)

  6.  **Distinguishes Calculational Limits from Ontological Indeterminacy (Non-Negotiable):** The account MUST clearly differentiate between:
      *   *Epistemic Cluelessness:* There *is* a fact of the total net consequence, but we cannot possibly calculate or know it due to complexity/chains of causation.
      *   *Ontological Indeterminacy:* There is *no fact of the matter* about the total net consequence (perhaps due to vagueness, butterfly effects truly erasing facts, or incomparable values). It must state which it assumes or how it handles both.
      *   *Case:* Donation effects likely fall under Epistemic Cluelessness. Some interpretations of quantum events influencing macro-decisions *might* push towards Ontological Indeterminacy in extreme cases. An account needs conceptual clarity here.

  7.  **Distinguishes Ex Ante Reasonableness from Ex Post Rightness (Non-Negotiable):** The account MUST ground the *rationality* or *permissibility* of an act in the *information and reasoning available at the time of decision* (ex ante), NOT in the unknowable total outcome (ex post). It should define what makes a choice "reasonable" under cluelessness.
      *   *Case:* Donating to a charity later revealed (through unforeseeable events) to have inadvertently funded harmful activities. The donation was ex ante reasonable based on foreseeable good; it wasn't ex post "right" in total consequence terms. Blameworthiness hinges on ex ante reasonableness.

  8.  **Respects Levels of Uncertainty (Desirable):** The account SHOULD be sensitive to *degrees* of cluelessness and partial knowledge. Acting when *some* significant long-term risks/benefits are foreseeable (even if total isn't) differs from acting under near-total ignorance. Ignorance isn't always binary.
      *   *Case:* Choosing between two medical treatments: one with well-known short-term efficacy but unknown long-term (20+ year) side effects vs. one with slightly lower short-term efficacy but well-understood, minimal long-term risks.

  ### Coherence with Decision Theory (The Scientist's Anchor)

  9.  **Coheres (or Explains Divergence) with Core Decision Theory (Non-Negotiable):** The account MUST either:
      *   Show how Expected Utility Maximization (EUM) *can* be applied meaningfully under cluelessness (e.g., by redefining outcomes, using robust proxies, non-standard probability).
      *   Provide a clear, principled justification for *departing* from standard EUM under conditions of deep uncertainty/cluelessness, explaining why EUM fails as a normative standard here.
      *   It cannot simply ignore the power and normative appeal of EUM in less uncertain contexts. Your scientific intuition rightly demands this coherence/justification.

  ### Potential for Unsatisfiability
  **The core tension likely lies between Desiderata 2 (Respect Known Near-Term) and 3 (Handle Swamping).** An account that heavily prioritizes foreseeable near-term good (to avoid paralysis and common-sense absurdity) risks underestimating catastrophic tail risks or systemic backfiring. An account that emphasizes the overwhelming potential for unforeseen swamping risks sliding into paralysis or excessive caution, making near-term certainties irrelevant. **Finding a stable, principled balance here is the central challenge.** Desideratum 5 (Robust Comparisons) is also very difficult to satisfy robustly under deep cluelessness without smuggling in implausible assumptions. Desideratum 9 (EUM coherence) is a high bar; many proposed solutions explicitly reject EUM as the standard under cluelessness.

  ---

  ### Brief Scoring of Approaches Against Desiderata

  1.  **Expected Utility Maximization (EUM - Naive Application):**
      *   **Fails:** Core problem. Requires probabilities and utilities for *all* possible outcomes, including vast chains of ripple effects. Impossible under cluelessness (Desiderata 1, 3, 4, 5). Struggles with Distinction 6 (treats uncertainty as probabilistic risk, not cluelessness). Can technically satisfy 7 & 9 only by assuming knowable probabilities/utilities that don't exist.
      *   **Fails Hard:** 1, 3, 4, 5, 6 (Epistemic aspect). Struggles with 2 (if probabilities swamp near-term certainty).

  2.  **Satisficing (e.g., "Do enough foreseeable good, don't worry about optimal or total"):**
      *   **Succeeds:** 1 (Avoids paralysis), 2 (Respects near-term), 7 (Ex ante focus).
      *   **Mixed:** 3 (Handles swamping only by lowering ambition, not actively managing risk), 4 (Guidance limited), 5 (Comparisons weak - "is this good enough?"), 8 (Degrees matter less).
      *   **Fails/Weak:** 6 (Often ignores the distinction), 9 (Explicitly departs from EUM's maximizing norm, needs justification).
      *   **Verdict:** Addresses paralysis and near-term certainty well but weak on systemic risk, comparisons, and justification for departing from EUM.

  3.  **"Act on the Foreseeable":**
      *   **Succeeds:** 1 (Avoids paralysis), 2 (Strong focus on near-term), 7 (Ex ante focus), 8 (Degrees matter - focus on *what is* foreseeable).
      *   **Fails/Major Risk:** 3 (Prone to ignoring swamping/backfiring potential - the core critique of cluelessness!), 4 (Only considers sign of foreseeable), 5 (Comparisons limited to foreseeable), 6 (Ignores ontological/epistemic question, assumes foreseeable is all that matters).
      *   **Fails Coherence:** 9 (Explicitly rejects EUM by limiting the outcome space drastically, needs strong justification for this truncation).
      *   **Verdict:** Solves paralysis and leverages near-term knowledge but is dangerously naive about systemic risks and the core insight of cluelessness. Justification for ignoring the unforeseeable is weak.

  **Conclusion:** Your instincts are sharp. Cluelessness throws a wrench into standard EUM. The desiderata highlight the tightrope: avoiding paralysis while acknowledging profound uncertainty, respecting local knowledge while fearing systemic risk, and grounding reasonableness without knowing outcomes. **The tension between respecting foreseeable good and fearing unforeseeable catastrophe is likely fundamental and unresolvable perfectly by any single principle.** Philosophical proposals (e.g., rule-consequentialism, contractualism, maximin/leximin, expert deference, focusing on "option value") attempt different paths through this minefield, often prioritizing different desiderata. Your list provides an excellent critical lens for evaluating them. Look for how they handle Case 2 (Drowning Child) vs. Case 3 (Predator Introduction) – that's often the litmus test.
