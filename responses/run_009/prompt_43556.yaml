  ## Research Proposal: Unrealistic Assumptions, De-idealization, and the Limits of the F-Twist

  Having spent decades as an experimental physicist navigating the essential tension between idealized models and complex reality, and now engaging deeply with philosophy of science in retirement, I find myself persistently returning to Milton Friedman’s provocative methodological claims. In his seminal essay, Friedman argued that the unrealisticness of a hypothesis’s assumptions is not merely tolerable but potentially a virtue, even a hallmark of significant theory – the so-called “F-twist” suggesting that the more important a theory, the more unrealistic its assumptions tend to be. While widely debated, particularly concerning instrumentalism versus realism in economics, my direct experience with the *practice* of idealization in physics suggests a critical, often overlooked dimension that fundamentally conditions the validity and scope of Friedman’s argument: the availability and reliability of *de-idealization procedures*. My proposed independent research project aims to articulate and investigate this dimension, arguing that the F-twist relies implicitly on a capacity for corrective accounting that physics generally possesses but that may be absent or underdeveloped in other disciplines, notably economics, thereby imposing crucial limitations on the exportability of unrealistic models.

  The core question I seek to explore is: **To what extent does the instrumental success of a theory employing unrealistic assumptions in a specific domain warrant confidence in its application to novel domains or for interventionist purposes, and how is this contingent on the discipline possessing robust, empirically grounded procedures for de-idealization?** Friedman himself dismissed concerns about unrealistic assumptions by focusing solely on predictive success as the ultimate test. Realist critics, conversely, often focus on whether the assumptions correspond to reality, arguing that only realistic foundations can ensure reliable extrapolation. Both positions, I contend, leave the *pragmatic pathway from idealization to reliable application* inadequately addressed. The realist position risks dismissing demonstrably useful tools, while Friedman’s instrumentalism seems to grant unrealistic models a license for universal application that my experience suggests is unearned without a corrective mechanism. The missing element, I propose, is the discipline’s practical ability to understand and quantify the *direction and magnitude of the error* introduced by the idealization and to *systematically reintegrate neglected factors* when necessary. Physics routinely operates with such “de-idealization stories”: we know treating a gas as ideal overestimates pressure under high density or low temperature, we possess equations of state to correct for it, and we understand the role of intermolecular forces; we know friction dissipates energy, we can model its effects empirically or fundamentally, and estimate its impact on motion. This capacity allows physicists to confidently deploy idealized models within known bounds and know how to adjust when those bounds are exceeded. The crucial question is whether disciplines like economics possess analogous, empirically validated procedures for de-idealizing their core models – for instance, correcting for the omission of information asymmetries, bounded rationality, institutional friction, or complex network effects – and what the epistemic consequences are when such procedures are weak or absent. Does the success of an unrealistic economic model in explaining past market behaviour, achieved *despite* its omissions, imply anything reliable about its predictive power under novel policy interventions or in different market structures, if we lack any principled way to assess *how* those omissions shaped the original result and how they might distort new applications?

  Given my lack of formal philosophical training, my methodology will be necessarily exploratory and grounded in comparative analysis. Over the fellowship year, I propose to undertake two primary activities. First, I will conduct a detailed conceptual analysis, drawing on both the philosophical literature surrounding Friedman (especially critiques often overlooked in standard instrumentalist/realist debates) and the methodological literature within physics concerning idealization, approximation, and error estimation. My goal is to precisely articulate the structure and epistemic function of “de-idealization stories” as practiced in physics, moving beyond abstract discussion to concrete examples familiar from my own work (e.g., ideal gas laws, frictionless planes, point masses). Second, I will engage in a focused comparative case study. I will select one or two prominent, intentionally unrealistic theoretical models in economics (e.g., aspects of Rational Expectations Hypothesis applications, or highly stylized DSGE models) and carefully examine the literature surrounding them – not primarily for their empirical success or failure, but explicitly for evidence of *established, empirically grounded procedures* used by practitioners to: 1) estimate the magnitude and direction of error introduced by specific key unrealistic assumptions in known contexts, 2) systematically reintegrate the effects of the omitted factors identified by those assumptions in a way that demonstrably improves predictive accuracy or explanatory power in novel or more complex situations. I will look for methodological discussions, standard correction factors, well-defined domains of applicability justified by error analysis, or successful frameworks for adding complexity back in. This is not an attempt to prove economic models “wrong,” but to assess the *robustness and prevalence of de-idealization practices* analogous to those in physics.

  Success for this project would be a clearly articulated conceptual framework demonstrating how the availability of de-idealization procedures acts as a critical enabling condition for Friedman’s defense of unrealistic assumptions, particularly concerning the extrapolation and interventionist use of models. It would involve identifying concrete examples where the presence or absence of such procedures in economics demonstrably impacts the justifiable scope of model application. Crucially, the project would fail in my view if this proposed distinction proves philosophically incoherent or practically insignificant – if de-idealization capacity is shown to be either ubiquitous and equally robust across disciplines (including economics) or entirely irrelevant to the instrumental success and exportability of unrealistic models. It would also fail if my analysis cannot move beyond well-rehearsed realist/instrumentalist arguments and fails to illuminate the specific pragmatic mechanisms linking idealization to reliable application.

  I confront directly the likely objection that my characterization of physics practice romanticizes it, overlooking the many instances where physicists also struggle with unquantifiable errors, messy systems, and the practical difficulty of de-idealization (e.g., turbulence, complex materials, quantum many-body problems). This is a vital point. I readily acknowledge that de-idealization in physics is often imperfect, context-dependent, and sometimes intractable. However, even in these messy cases, the *concept* of quantifying the error or systematically adding complexity back in is deeply ingrained in the discipline’s methodology and self-understanding. There exists a shared commitment and a toolbox (even if sometimes inadequate) *aimed* at correction. The objection highlights a spectrum rather than a binary; the key question becomes whether economics possesses a comparable methodological commitment and toolbox specifically geared towards de-idealizing its core unrealistic assumptions, or if the absence of such is more systemic. My project will explicitly consider this spectrum, examining whether the *degree* of de-idealization capacity correlates with the justifiable confidence in model extrapolation.

  This project represents a unique opportunity to leverage decades of practical scientific experience to interrogate a foundational methodological debate in another field. By focusing on the often-invisible scaffolding of de-idealization that supports the use of unrealistic models in physics, I aim to provide a fresh, practice-based perspective on the F-twist, revealing a potential vulnerability in its application to disciplines where such scaffolding may be less secure. The outcome will be a substantive paper contributing a novel dimension to the philosophy of economics and methodology of model-based science.
