answer: |-
  ### Centipede Game Session Plan (650 words)

  **Setup (5 min):**  
  - Rearrange desks into 8 pairs + one spare seat.  
  - Distribute rulesheets (see below). Assign roles: Player A (moves at odd nodes), Player B (even nodes). Use dice for randomness in Stage 2.  
  - Stakes: 1 point/node won = 1 extra credit point OR chocolate piece (e.g., Hershey's Kiss).  

  **Stage One Rules (15 min total; 3-4 rounds):**  
  - **Start:** Pot = 2 points.  
  - **Each node:** Current player chooses TAKE or PASS.  
    - TAKE: Taker gets 80% of pot, other gets 20% (e.g., Pot=16: Taker gets 12.8→13, other 3.2→3).  
    - PASS: Pot doubles. Play continues.  
  - **End:** After 6 nodes OR a TAKE. If no TAKE by node 6, pot splits 50/50.  
  - *Play silently, record outcomes.*  

  **Stage Two Rules (15 min):**  
  - Identical to Stage One, BUT after *every* PASS, roll a die before pot doubles:  
    - **Roll 1:** Game ends immediately. Both get 25% of *current* pot (e.g., Pot=8 → each gets 2).  
    - **Roll 2-6:** Pot doubles, continue.  
  - *Play 2-3 rounds.*  

  **Debrief (40 min): Key Questions**  
  1. **Stage One Behavior:** "How many took early (nodes 1-3) vs. late? Did pairs develop patterns?"  
  2. **Backward Induction (BI):** "What does BI predict in Stage One? *Why* should Player A take immediately?" (Map the 6-node logic together).  
  3. **Stage One vs. Prediction:** "If BI says TAKE at node 1 is dominant, why did anyone PASS? What assumptions were you *actually* making about the other player?"  
  4. **Stage Two Disruption:** "Where did BI 'break' in Stage Two? Could you pinpoint a 'last node' to start induction? Why/why not?"  
  5. **Core Tension:** "What does BI *require* to work? (Prompt: fixed endpoint? common knowledge of rationality? certainty of payoffs?) Did Stage One *truly* have these, or did we just pretend? What changed in Stage Two?"  
  6. **Paradox Articulation:** "Why do real people (and experiments) show passing in Stage One, but BI forbids it? Is the flaw in BI, human rationality, or the model’s assumptions?"  

  **Troubleshooting:**  
  - **Confusion/random passing:** Demo one node with TAKE/PASS consequences before starting. Use a visible pot tracker (whiteboard).  
  - **Distrust of randomness:** Use oversized dice; have opponents roll for each other.  
  - **Uneven pairs/dominant players:** Assign roles; enforce silence; monitor for coercion.  
  - **Collusion ("I’ll pass if you do"):** Ban communication. If detected: "Interesting! But can silent *mutual trust* be rational under BI?" (Save for debrief).  
  - **Early universal taking:** If Stage 1 lacks variation, contrast sharply with Stage 2’s passes: "Why pass *now* but not before?"  

  **Limitations & Salvage:**  
  - **Undergrads ≠ hyper-rational agents:** They won’t perfectly compute BI. **Solution:** Acknowledge this. Focus debrief on *why* BI feels less compelling in Stage 2 despite identical incentives.  
  - **"Philosophical trouble" gap:** Live play can’t replicate *common knowledge of rationality* (CKR). **Supply this:** "BI assumes not just that both are rational, but that both *know* this, both know *they* know, ad infinitum. Stage 2’s randomness shatters CKR by making your opponent’s rationality irrelevant at any node."  
  - **Experimental record shortcut:** Preempt "But people pass!" by noting post-debrief: "Empirically, passes occur until mid-game. BI’s paradox is that this seems rational *in the moment* but is indefensible in theory."  

  **Timing Summary:**  
  - 0-5 min: Setup  
  - 5-20 min: Stage 1 (3 rounds)  
  - 20-35 min: Stage 2 (2 rounds)  
  - 35-75 min: Debrief (40 min critical—don’t rush).  

  **Why This Works:**  
  Stage 1 creates intuitive tension (early takes feel greedy, late passes feel risky). Stage 2’s randomness mirrors real-world uncertainty, making BI’s rigidity absurd. The debrief questions force them to dissect BI’s hidden assumptions, not just its conclusion. The unresolved paradox lingers—perfect for later reading.
