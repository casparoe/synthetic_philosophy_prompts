prompt: |-
  I'm a physician, and I keep noticing a pattern in how colleagues talk after bad outcomes. A doctor takes a calculated risk and the patient survives, and everyone calls the call "decisive" or "good clinical judgment." Another doctor takes what looks, from the chart, like the same calculated risk, the patient dies, and within a week the same people are calling it "reckless" — and, crucially, they don't say "it was the same call but it went badly." They insist the calls were different all along: the bad outcome revealed what the decision "really was," while the good outcome was just luck attaching to a properly careful act. The outcome seems to be treated as evidence about the act itself rather than as a further fact about the world. I've seen the same move outside medicine — a fund manager's bet is "prescient" if it pays and "gambling" if it doesn't, with commentators in each case claiming they could have seen the character of the bet from the start.

  I know this lives somewhere near moral luck and near what psychologists call outcome bias, but neither seems to name the move I mean. Moral luck, as I understand it, is the puzzle about whether outcomes ought to affect blame and responsibility; outcome bias is the tendency to judge decision quality by results. What I'm after is a descriptive, almost grammatical phenomenon: the retroactive rewriting of what the act was, so that the act-description itself (decisive vs. reckless, prudent vs. cowardly) gets fixed by the outcome, and everyone then sincerely denies that outcome did any of the work. Is there an established term for this specific reclassification in the philosophy or psychology literature, and if so, how exactly does it differ from outcome bias and from moral luck proper? If it has no name, coin one, define it precisely, and give the boundary cases — for instance, where it shades into legitimate learning from outcomes, or into hindsight bias, so that it doesn't simply collapse into either. Please answer in American English.
reasoning: |-
  Okay, the user is a physician who's noticed a pattern in how colleagues judge decisions after patient outcomes. They describe a situation where two similar calculated risks lead to different outcomes, and the language used to describe those decisions changes based on the outcome. When the patient survives, it's called "decisive"; when they die, it's "reckless." The same behavior happens in finance too. 

  The user knows about moral luck and outcome bias but feels those don't quite capture what they're seeing. They want a term for this retroactive rewriting of the act itself based on outcome, where people deny the outcome influenced their judgment. 

  First, I need to distinguish this from outcome bias and moral luck. Outcome bias is when the outcome affects the evaluation of the decision's quality, but the act description stays the same. Here, the description changes: the act itself is reclassified. Moral luck is about whether outcomes *should* affect moral judgments, which is normative, whereas the user is asking for a descriptive term for the phenomenon.

  The key here is the retroactive redefinition. The decision is reinterpreted after the fact to fit the outcome. This isn't just learning from outcomes because learning would involve updating future decisions, not rewriting the past. It's also different from hindsight bias because hindsight bias is about believing the outcome was predictable all along, not necessarily changing the nature of the act.

  Looking into psychological terms, "outcome-driven reclassification" comes to mind. That's when the act's category shifts based on the outcome. For example, a decision becomes "reckless" only after a bad outcome, even if the pre-outcome factors were identical to a "decisive" one. 

  The user also wants boundary cases. When does this become legitimate learning? If after a bad outcome, new information emerges that genuinely shows the risk was higher, that's learning. But if no new info and the decision is reclassified solely based on outcome, that's the bias. Also, distinguishing from hindsight bias: hindsight is about predictability ("I knew it all along"), while reclassification changes the act's inherent label.

  The user might need this term to discuss the issue with colleagues or in academic settings. As a physician, they likely want to reduce this bias in medical decision-making, improving how outcomes are reviewed without unfair judgment. Naming the phenomenon could help address it systematically in their field.
answer: |-
  Based on your precise description, the phenomenon you're identifying doesn't have a single, universally accepted term in philosophy or psychology literature, but it sits at the intersection of several concepts. The closest established concept is **Outcome Bias**, but you're right that the specific *reclassification of the act itself* is a distinct nuance often glossed over.

  Here's a breakdown, a proposed term, its definition, boundaries, and distinctions:

  1.  **The Core Phenomenon:** Outcome-Driven Reclassification (ODR)
      *   **Definition:** The cognitive and linguistic process whereby the *description and categorization of a past decision or action* are retroactively altered based solely on its outcome. The identical set of pre-outcome facts and reasoning is framed as fundamentally different *in kind* (e.g., "decisive" vs. "reckless," "prescient" vs. "gambling") depending on the outcome. Crucially, this reclassification is presented as reflecting the *inherent nature* of the act *at the time it was made*, denying the outcome's role in shaping the descriptive label.
      *   **Key Mechanism:** The outcome isn't just used to judge the *quality* or *success* of the decision; it is used to redefine *what the decision fundamentally was*. Luck or misfortune is conceptually absorbed into the characterization of the agent's intent or the act's inherent properties.

  2.  **Distinguishing it from Outcome Bias and Moral Luck:**
      *   **Outcome Bias:** This is judging the *quality* or *wisdom* of a decision based on its outcome, *while keeping the description of the act constant*.
          *   Example (Outcome Bias): "Given the information at the time, it was a reasonable call, *but* it turned out badly." or "It *was* a calculated risk, *unfortunately* it failed." The act ("calculated risk") is still recognized, but its *judgment* is negatively influenced by the outcome.
          *   **ODR vs. Outcome Bias:** ODR goes further. It says: "It *wasn't* a calculated risk; looking back, it was *always* reckless." The very *category* of the act changes based on the outcome. Outcome bias influences the *evaluation*; ODR rewrites the *ontology* of the act.
      *   **Moral Luck:** This is the *philosophical problem/question* of whether and to what extent factors outside an agent's control (like outcomes) *should* affect moral judgments (blame/praise) of them.
          *   **ODR vs. Moral Luck:** Moral Luck is a normative debate (what *ought* to be). ODR is a descriptive psychological/cognitive phenomenon *about how people actually make judgments*, specifically about the retroactive reclassification of acts. ODR is one *cognitive mechanism* people use that *results in* judgments influenced by moral luck.

  3.  **Boundary Cases and Distinctions:**
      *   **Legitimate Learning from Outcomes:** The crucial difference is the presence of *new information revealed by the outcome itself*. Did the outcome provide data that genuinely *wasn't* available beforehand and changes the understanding of the initial situation?
          *   *ODR:* "The patient died, proving the risk was always too high [*despite no new objective data about pre-existing risk factors*]."
          *   *Legitimate Learning:* "The patient died, and the autopsy revealed an *undiagnosed, unpredictable* condition that drastically increased the risk of that intervention, which we couldn't have known." Or, "The market crashed due to an unforeseen geopolitical event the fund manager couldn't have reasonably anticipated." Here, the outcome reveals new facts about the *initial conditions*, potentially justifying a different view of the risk *as it actually existed*, not just reclassifying the act based on the outcome.
      *   **Hindsight Bias:** This is the tendency, *after* an outcome is known, to believe the outcome was *more predictable* than it actually was before the fact. "I knew it all along."
          *   **ODR vs. Hindsight Bias:** Hindsight bias is about the *perceived predictability* of the outcome. ODR is about the *reclassification of the nature of the preceding act*. They are closely related and often co-occur. Hindsight bias ("It was obvious this would happen") provides the *justification* for the reclassification inherent in ODR ("Therefore, doing it was reckless"). ODR is the *categorical shift* enabled by hindsight bias. You can have hindsight bias without full ODR (e.g., "It was obvious this risky bet would fail, *and it was indeed a risky bet*"), and theoretically ODR without strong hindsight bias (though unlikely), but they are deeply intertwined.
      *   **Fundamental Attribution Error:** This is the tendency to overemphasize personal characteristics (disposition) and underemphasize situational factors when explaining others' behavior. ODR leverages this: the bad outcome "proves" the doctor was inherently "reckless," ignoring the situational uncertainty they faced.

  4.  **Why "Outcome-Driven Reclassification" (ODR) Fits:**
      *   **Descriptive:** It directly names the process you observe – the *reclassification* of the act.
      *   **Mechanism:** It highlights that the *outcome* is the *driver* of the reclassification.
      *   **Distinctive:** It captures the shift from judging the act's *success* (outcome bias) to redefining the act's *essential nature*.
      *   **Sincerity:** It accommodates the sincere denial – people engaging in ODR genuinely feel they are describing the act *as it was*, not rewriting history, because the outcome has retroactively colored their perception of the act's inherent character.

  **In summary:** You've pinpointed a specific cognitive maneuver – **Outcome-Driven Reclassification (ODR)** – where the *descriptive category* applied to a past decision is retroactively determined by its outcome, presented as the act's inherent quality all along. It's the engine that often powers the more general phenomena of Outcome Bias and judgments influenced by Moral Luck, and it frequently relies on Hindsight Bias for justification. It diverges from legitimate learning when no new information about the *initial conditions* is revealed by the outcome itself. Recognizing ODR is crucial for fair evaluations in medicine, finance, and beyond, as it prevents separating the evaluation of the decision *process* from the uncontrollable randomness of the *outcome*.
