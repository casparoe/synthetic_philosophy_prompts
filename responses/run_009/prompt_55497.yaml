prompt: |-
  I got into a long arguement at a party this weekend and I'm still thinking about it, so let me get your read. A friend of mine who works in software has this whole spiel about LLMs, and now my roommate keeps repeating it whenever she sees me using chatbots for anything. It goes something like this: the stochastic parrots argument showed that language models are just doing statistics on word sequences. They're trained to predict the next word, and that's a purely formal operation, so nothing inside the model ever deals with meaning — it's all form, no content. This has basically been confirmed by now: the models keep getting better at prediction and no understanding ever shows up. That's also why they hallucinate — a system that only knows which words tend to follow which can't tell truth from fiction, it just produces whatever is statistically likely. So the real danger is us mistaking fluency for thought, plus all the bias and energy costs. And honestly, the whole debate ended once ChatGPT came out — it does stuff no parrot can do.

  Is this a fair summary? I'm a linguistics undergrad so the form versus meaning part is the bit I care about most, and something about the confident "this has been confirmed" feels off to me, though I don't know the original argument well enough to say why. I also genuinely don't see how you would even test a claim like "nothing inside the model deals with meaning" — isn't that the kind of thing people still argue about? At the same time, the fluency-versus-thought confusion point rings true, and I'd assumed the bias part was uncontroversial, so maybe my friend is more right than I want to admit.

  Could you go through the summary and tell me which parts a defender of the stochastic parrots view would actually endorse, which are misrepresentations or overstatements, and whether the two big conclusions — the explanation of hallucination, and the claim that the debate ended — actually follow from the parts that are accurate? And if there's a central piece of the original argument that his version leaves out entirely, tell me what it is, because I suspect the omission is doing a lot of work. For what it's worth, I'm inclined to think the models understand *something*, but I'm aware that's maybe just me wanting my fancy autocomplete to talk to me.
