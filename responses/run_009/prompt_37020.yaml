prompt: |-
  I'm a second-year politics student, and my flatmate — call her Dana — has spent this term working out what she calls her "principled nationalism," and I've started keeping a list of her verdicts because I can't figure out what principle, if any, actually generates them. The list so far: she holds that the state may tax her more heavily to relieve a compatriot's poverty than it would be permissible to tax her to relieve equal or greater poverty abroad; that immigration restrictions aimed at protecting domestic workers' wages are legitimate; and yet that if she could rescue exactly one of two drowning strangers — one a compatriot, one a foreigner — she would be doing nothing wrong either way, so there's no special duty at the level of personal rescue. She also maintains that a stateless person, or the citizen of a failed state, is owed help only by the general duty everyone owes everyone, and by no one in particular; that emigrants retain strong claims on their home states, in evacuation, consular protection, and even voting rights; but she flatly rejects any special duty toward co-religionists abroad, or speakers of her language abroad, or the diaspora she technically belongs to, even though those groups are bound together by exactly the kind of shared history she invokes when defending the tax and immigration verdicts.

  I've tried to reconstruct her underlying principle and I can get at least three candidates to fit most of the list: that special obligations arise from shared subjection to a state's coercive institutions; that they arise from membership in a national community as such, something like an extended quasi-family; and that they arise from the administrative fact that states are simply the best-positioned agents for helping the people they govern, so the duties get assigned by capacity rather than by relationship. Each principle explains most of her verdicts and strains at one or two, and I genuinely cannot tell which one she is running, or whether she's running any of them consistently.

  The case I want to put to her next week is her cousin's situation, and I'd like your prediction before I do. He has worked legally in another country for thirty years: he pays taxes there, is subject to all of its laws, is protected by its police and courts, and is entitled to nothing from its welfare state. He never naturalized, does not share the national culture, and his home country is functioning and even offers benefits to citizens who return. Will Dana say his host state owes him the same priority in welfare provision that it owes its own citizens? Give your best guess with reasons, set out which principle she is implicitly running and which rival principles fit her track record nearly as well, say what each of those rivals predicts for the cousin, and — the part I actually care about — tell me which further case would best force the rival principles apart.
reasoning: |-
  Okay, let me tackle this step by step. The user is a politics student trying to understand their flatmate Dana's "principled nationalism" by testing it against hypothetical cases. Dana's positions seem inconsistent at first glance, so the user wants to predict her stance on a cousin's case and find a way to clarify her underlying principle.

  First, I need to map Dana's existing verdicts. She accepts higher taxes for compatriots but rejects personal rescue duties toward them. She supports immigration restrictions but denies special duties to diaspora or cultural groups. The three candidate principles are: 1) shared state coercion, 2) national community as quasi-family, 3) state capacity-based duty assignment.

  Looking at the cousin case: 30 years in host country, pays taxes, follows laws, but no cultural integration or citizenship. The coercion principle clearly applies here - he's subject to the state's institutions. The national community principle wouldn't apply due to lack of cultural ties. The capacity principle would depend on administrative feasibility, which is present.

  The key tension is between coercion and community principles. To force them apart, I'd propose a case where someone is culturally integrated but not subject to state coercion (e.g., illegal immigrant deeply embedded in community). Dana's likely rejection of diaspora claims suggests community ties alone don't matter to her, making the coercion principle her probable baseline.

  For the cousin, I predict Dana would say the host state owes him welfare priority because he's subjected to its systems. The best test case would involve voluntary participants in state systems versus cultural members outside them. This should reveal whether her nationalism is institutionally grounded rather than ethnocultural.
answer: |-
  Based on Dana's established pattern of verdicts and the three candidate principles you've identified, here's the analysis and prediction:

  1.  **Prediction for the Cousin Case:** Dana **will likely say the host state *does* owe the cousin the same priority in welfare provision as its citizens.**

      *   **Reasoning:** The cousin is **fully subjected to the host state's coercive institutions** (taxation, laws, police, courts). This mirrors the core justification Dana uses for taxing citizens more heavily to relieve compatriot poverty (shared subjection to the state's coercive power). The fact that he pays taxes *to that state* and is governed *by that state* is paramount. His lack of cultural integration or naturalization, the functionality of his home state, and its offer of benefits are likely **irrelevant** to Dana here. The host state extracts resources and imposes obligations; therefore, according to the coercion principle, it incurs correlative duties toward him. Her rejection of special duties based on culture, language, or diaspora further isolates the *state institution* as the key factor, not identity alone.

  2.  **Implicit Principle:** Dana is most consistently running the **"Special obligations arise from shared subjection to a state's coercive institutions"** principle.
      *   **Fits:** Taxation priority (citizens jointly subjected), immigration restrictions (protecting those subjected to the same labor market/economic rules), no rescue duty (no institutional link creating a *personal* obligation), no duty to stateless/failed state citizens *by specific states* (no functioning institution subjecting them *and* others), emigrants' claims on home state (ongoing institutional link via citizenship), rejection of co-religionist/language/diaspora duties (no relevant *institutional* coercion binding them).
      *   **Strains:** Her rejection of a rescue duty *could* be seen as slightly strained if the "quasi-family" sentiment were strong, but her firm rejection of non-state-based groups makes this minimal. It fits best overall.

  3.  **Rival Principles & Their Fit/Prediction for Cousin:**
      *   **Rival 1: National Community (Quasi-Family):**
          *   **Fits:** Taxation priority, immigration restrictions (protecting the "family"), emigrants' claims on home state ("family" ties persist).
          *   **Strains Badly:** Flat rejection of rescue duty (familial instincts usually *do* trigger rescue), rejection of co-religionist/language/diaspora duties (these *are* often framed as community ties), likely rejection of welfare for non-cultural-integrated cousin. The rescue duty verdict is the major rupture for this principle.
          *   **Prediction for Cousin:** **NO**, the host state does *not* owe him welfare priority. He lacks the cultural/national identity bond. His home state, as his "family," does.
      *   **Rival 2: State Capacity (Best-Positioned Agent):**
          *   **Fits:** Taxation priority (state is best positioned to help its governed population), immigration restrictions (state is best positioned to manage its labor market for citizens), no special duty to stateless/failed state citizens *by specific states* (no clear "best-positioned" agent), rejection of co-religionist/language duties (states aren't inherently best-positioned for these groups).
          *   **Strains:** Emigrants' strong claims on *home* state (host state is often better positioned for consular help locally; home state capacity may be weak). The *personal* rescue duty verdict doesn't contradict capacity per se, but doesn't strongly support it either.
          *   **Prediction for Cousin:** **YES/NO AMBIGUOUS.** *Maybe* Yes: Host state has full administrative capacity regarding him (taxes, laws). *Maybe* No: He's not a citizen eligible for welfare; his home state retains capacity and responsibility for him as a citizen. This principle struggles most with the emigrant claims, which Dana affirms strongly.

  4.  **The Crucial Further Case to Force Principles Apart:**
      The case that best isolates the **coercion principle** from the **community principle** involves **voluntary participation in state institutions without cultural assimilation or citizenship, versus cultural assimilation without institutional subjection.**

      > **The Case:** Imagine two individuals living permanently within State A's territory:
      > *   **Person 1 (The Willing Subject):** A wealthy foreign national who *voluntarily* opts into State A's advanced legal and property protection system for foreign investors. They pay significant fees directly to State A's courts and security services for this bespoke protection, but avoid all income/property taxes, hold no citizenship/residency, have no cultural ties, and use private healthcare/education. They are deeply subject to State A's *specific chosen* coercive institutions for their benefit.
      > *   **Person 2 (The Integrated Outsider):** An undocumented immigrant who has lived in State A for 20 years. They speak the language fluently, participate deeply in local cultural and community life (festivals, associations, religious institutions), their children attend public schools (though they pay no taxes directly), and they consider State A their home. However, they actively avoid any interaction with official state institutions (police, courts, welfare) for fear of deportation. They are not subject to its *coercive* institutions but are culturally integrated.

      *   **Coercion Principle Prediction (Dana's Likely View):**
          *   **Person 1:** State A *does* have special obligations (e.g., protection, due process via the systems they paid for) because of their *direct subjection* to specific coercive state institutions, despite lack of taxes, culture, or citizenship. The *institutional relationship* is key.
          *   **Person 2:** State A has *no special obligations* beyond the general duty owed to any human, despite deep cultural integration. Lack of subjection to core coercive institutions (taxation, law enforcement) means no special duty is triggered. Deportation would likely be seen as legitimate.
      *   **Community Principle Prediction:**
          *   **Person 1:** State A has *no special obligations*. No cultural/national bond exists.
          *   **Person 2:** State A *does* have significant special obligations (e.g., regularization, access to services, perhaps even protection from deportation) due to deep cultural integration and community membership, despite lack of legal status or tax payment. They are part of the "national family."
      *   **Capacity Principle Prediction (Ambiguous):**
          *   **Person 1:** State A is best-positioned for the specific services contracted, but not necessarily for general welfare. Likely minimal obligations.
          *   **Person 2:** State A *is* best-positioned to help them (they live there, kids in school), potentially triggering obligations to regularize status or provide basic services, *if* capacity implies responsibility for de facto residents regardless of status. But it could also lean towards deportation as a capacity-based policy choice.

      **Why this case is crucial:** It directly confronts the core tension. Does the *institutional link of coercion/subjection* create the duty (favoring Person 1), or does the *cultural/communal identity* create the duty (favoring Person 2)? Dana's rejection of diaspora duties and affirmation of emigrant claims strongly suggest she'll prioritize the institutional link (Person 1), decisively ruling out the community principle. The capacity principle would likely yield a muddier answer, lacking the clear institutional focus. This case cleanly separates the coercion logic from its main rivals based on her established pattern.
