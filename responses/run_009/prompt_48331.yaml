prompt: |-
  Second-year PhD student in political science here (comparative politics by training, but next semester I have to TA a section on democratic theory, so I'm trying to work out what I actually believe about whether groups can be competent at truth-tracking). I know there's an old math result, Condorcet something, saying that if every voter is a bit better than a coin flip and their mistakes are independent, then a big enough majority is almost certainly right. Fine. But when I go through concrete cases, my gut does NOT follow the naive version of that, and I want to know what principle, if any, is actually behind my verdicts. So here are my verdicts, and I'd like you to find the principle that captures them — or tell me which ones have to go.

  1. A 12-person criminal jury where each juror is maybe 55% likely to reach the correct verdict, and their errors are genuinely independent of each other. I'd trust the majority verdict over any single juror, and I'd trust it more as we add jurors. Fine so far, that's just the theorem.

  2. Five specialists in exactly the relevant subfield, each right maybe 70% of the time, versus 500 randomly selected citizens each right 55% of the time. Plugging in the numbers the 500-citizen majority should come out ahead of the five specialists. My gut still says listen to the specialists. And the twist: if I could point at the single most competent person in the 500 and had to defer to ONE agent, I'd defer to the 70% specialist rather than to the 500-strong majority, even though the majority is "better" on paper.

  3. 300 economists all trained in the same department, using the same models, asked whether some policy will raise GDP. My gut says the large number barely helps — they'll all be wrong together. But I ALSO think a panel of 200 epidemiologists is more trustworthy than a panel of 5 of them, even though epidemiologists share training, textbooks, and methods too. I honestly can't say what the difference is, if there is one.

  4. If the average voter is actually worse than a coin flip (say 48%), adding voters should make the majority LESS accurate. I accept this in the abstract but refuse to apply it anywhere — I don't believe any real electorate is below 50% on the questions that matter, or maybe I just don't like where it leads. Not sure which.

  5. Weighted voting. If we knew who the competent people were, we should weight their votes more. But if we knew that, why have a vote at all — just ask them. So my gut says both "weight by competence" and "skip the vote entirely", which can't both be a rule.

  So: is there one principle that gets all five, or close? My half-formed guess is something like "defer to the majority only when you can't identify who's better informed and have no reason to expect correlated errors" — but I don't see how that survives case 3, and the elitist smell of case 2 bothers me. Whatever principle you land on, please test it against my five, tell me plainly which of my verdicts it has to throw out and why, and then — the part I actually care about for teaching — tell me what it predicts on cases I haven't listed. Like: does it tell me to trust a referendum more or less than a national election on the same question? A prediction market versus a committee of experts? Those are exactly the questions my students are going to ask me and right now all I have is vibes.
reasoning: |-
  Okay, let me try to figure out what's going on in this political science PhD student's query. They're wrestling with the Condorcet Jury Theorem and how it applies to real-world group decision-making. Their five scenarios reveal a tension between mathematical models and intuitive judgments about expertise, independence, and collective competence.

  First, scenario 1 aligns perfectly with Condorcet - independent jurors slightly better than chance make the majority more reliable. No conflict there. But scenario 2 is where things get interesting. Mathematically, 500 people at 55% should outperform 5 specialists at 70%, but their gut says trust the specialists. And they'd even pick one specialist over the 500-strong majority. That suggests an intuition about diminishing returns to numbers when expertise exists.

  Scenario 3 adds complexity. They distrust 300 economists from the same school (likely due to correlated errors) but trust 200 epidemiologists over 5. Why the difference? Maybe it's about perceived diversity within a field versus methodological monoculture. Epidemiologists might be seen as having more varied approaches despite shared training.

  Scenario 4 shows emotional resistance - they reject the idea that real electorates could be systematically below 50% competent. This feels like a normative stance rather than an empirical one. Scenario 5 exposes a paradox: weighting votes by competence logically leads to just consulting experts directly.

  Hmm... the core tension seems to be about when aggregation helps versus when it doesn't. Condorcet assumes independence and minimal competence, but real groups have correlated errors and varying expertise levels. Their intuition might be applying a mental model that discounts majority wisdom when: (1) identifiable experts exist, (2) error correlations are high, or (3) competence is heterogenous.

  For teaching, they'll need to reconcile the theorem with its limitations. Maybe emphasize three dimensions: individual competence, error independence, and group size. Show how correlated errors collapse effective group size. Discuss Bayesian updating - how priors about expertise interact with majority signals. 

  The referendum vs election question might hinge on whether elections filter competence via representatives. Prediction markets versus expert committees tests whether price mechanisms outperform deliberation under correlation. I should build a framework that explains all five cases without contradiction, then demonstrate its extensions.
answer: |-
  Your intuitions reveal a sophisticated (if inconsistent) critique of naive Condorcet applications. The unifying principle isn't *one* rule, but **a Bayesian framework incorporating competence estimates, error correlation, and meta-uncertainty**. Here's the breakdown:

  ### Core Principle
  **Defer to collective judgment only when:**
  1.  **You lack reliable competence hierarchies** (can't identify clear experts)
  2.  **Error correlations are likely weak** (diverse perspectives/independence)
  3.  **The group's base competence is above 50% *and* you're confident in that estimate**

  ### Your Cases Analyzed
  1.  **Jury (12, 55%, independent):** *Aligned with Condorcet.* Weak competence hierarchy (all similar), strong independence, competence >50%. Majority dominates. ✅  
  2.  **Specialists (5x70%) vs. Citizens (500x55%):** *Your gut is rational.*  
      -   **Against the 500:** High *meta-uncertainty* about the "55%" for citizens (is it truly >50%? Is it stable?). Specialists offer known high competence.  
      -   **Against the single "best" citizen:** The *competence hierarchy is clear*. A known 70% specialist dominates a random citizen (likely ≈55%) or even the majority (whose competence you distrust due to meta-uncertainty).  
      *Principle Applied:* Prefer identifiable high competence over a large group with high meta-uncertainty about competence/correlation. ✅  
  3.  **Economists vs. Epidemiologists:** *The difference is error correlation strength & your priors.*  
      -   **Economists (300, same school/models):** You suspect *strong, systematic error correlation*. Shared models create common failure modes. Adding more members doesn't meaningfully increase independence → effective group size remains small. Majority useless.  
      -   **Epidemiologists (200 vs 5):** You assume *weaker error correlation* despite shared training. Diversity in sub-specialties, data interpretation, or risk tolerance creates *some* independence. Majority of 200 > majority of 5 > single expert.  
      *Principle Applied:* Size only helps if error correlation isn't overwhelming. Your prior about correlation differs by field/case. ✅  
  4.  **Average Voter <50%:** *Your refusal is normative/pragmatic, not empirical.* Condorcet *is* correct mathematically. Your resistance stems from:  
      -   **Meta-uncertainty:** Can you *know* competence is <50%? What defines "correct"?  
      -   **Normative commitment:** Democracy presupposes minimal "wisdom of crowds" viability. Accepting <50% undermines legitimacy.  
      -   **Heterogeneity:** Maybe the *mean* is 48%, but a motivated/engaged subset is >50%.  
      *Principle Applied:* Rejecting the scenario reflects distrust in the *premise*, not the math. You impose a prior that real electorates on "matters that matter" are ≥50%. ❓ (The principle accepts the math, you reject the input.)  
  5.  **Weighted Voting:** *Your conflict highlights the knowledge problem.*  
      -   **"Weight by competence":** Rational *if* you have precise, reliable competence measures.  
      -   **"Skip the vote":** Rational *if* that same knowledge lets you identify *the single best* or a small, perfectly reliable oligarchy.  
      *Principle Applied:* Weighting is a *second-best* solution. It makes sense only when:  
          -   You have reliable competence metrics *but*...  
          -   ...you lack confidence in identifying *the absolute best* single decision-maker, *or*...  
          -   ...you value some diversity/independence (reducing correlation risk) that weighting preserves better than autocracy. ✅  

  ### Predictions for Your Student Questions (Applying the Principle)
  *   **Referendum vs. National Election (same policy Q):**  
      *Trust the Election more.* Legislators are (theoretically) more competent due to specialization, staff, and time. Referendum voters have higher meta-uncertainty about competence (<50% risk?) and potentially stronger correlated errors (media bubbles). *Exception:* If the policy is highly visceral/values-based (where elite competence is dubious) *and* the electorate is well-informed on it.
  *   **Prediction Market vs. Committee of Experts:**  
      *Depends on correlation and question type.*  
      -   **Prediction Market wins:** For concrete, short-term, verifiable outcomes (e.g., "Will inflation exceed 3% in Q3?"). Aggregates diverse info efficiently; money incentivizes truth-tracking; errors likely less correlated than a committee deliberating together.  
      -   **Committee of Experts wins:** For complex, long-term, or value-laden judgments (e.g., "Is this AI alignment strategy ethically sound?"). Markets struggle with ambiguity and non-verifiability; committee deliberation can mitigate individual biases (reducing correlation?); expert *reasoning* may be as important as the prediction.  
  *   **Social Media "Wisdom of Crowds" vs. Scientific Consensus:**  
      *Trust Scientific Consensus overwhelmingly.* Social media has massive correlated errors (virality, algorithms), extreme competence variance (many <<50%), and high meta-uncertainty. Scientific consensus, while imperfect, involves structured scrutiny, norms promoting independence/replication, and higher average competence.

  ### Which Verdicts *Must* Go (and Why)
  1.  **Case 4 Refusal (Electorate <50%):** You *must* accept the math **if** the premise holds. Your stance is a normative/empirical prior ("I don't believe it exists"), not a flaw in Condorcet. For teaching, distinguish: *"Mathematically, it follows. Normatively/pragmatically, we question if the premise ever truly applies."*
  2.  **Case 3 Inconsistency (Economists vs. Epidemiologists):** You need a *clearer basis* for assuming different error correlations. Is it field-specific (economics = more ideological/model-driven?), case-specific (GDP prediction = more monolithic models?), or just familiarity? The principle *requires* estimating correlation, not just assuming it.

  ### Teaching Takeaway: Beyond Condorcet's Naivete
  Frame decision-making as **Bayesian updating under uncertainty**:  
  - **Prior:** What's your best guess about the truth *before* seeing the group's verdict? (Informed by expertise, values, etc.)  
  - **Signal:** The group's decision (majority vote, expert panel, prediction market price).  
  - **Strength of Signal:** Depends on:  
      *   Group Size (N)  
      *   *Estimated* Avg. Competence (p)  
      *   *Estimated* Error Correlation (ρ) → *Effective N* is often << Actual N if ρ > 0.  
      *   Meta-Uncertainty (How sure are you about p and ρ?)  
  - **Posterior:** Update your belief based on the signal's strength.

  Your "vibes" are instinctively weighing these factors. Condorcet assumes p>0.5, ρ=0, and no meta-uncertainty – conditions rarely met. Your job is to make students articulate *why* ρ might be high (shared ideology, same data/models, social pressure) or why p is uncertain ("55% based on what?"), turning vibes into analyzable criteria.
