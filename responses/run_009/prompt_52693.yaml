prompt: |-
  I'm a science and ideas journalist and I keep having to write the sentence "physicists have ruled out local realism" (or some hedged version of it) every time a new Bell test drops -- satellite experiments, loophole-free tests, the whole genre. Problem is I half-understand the distinctions: local causality vs local determinism, what exactly Bell assumed beyond locality (that measurement settings are independent of the properties being measured), why superdeterminism is the escape hatch people keep arguing about, and what "loophole-free" actually buys you. And my editor always wants a clean one-liner about what was proven, which I suspect is where most of the sin happens. Please turn what Bell's theorem actually establishes into a procedure I can run on any entanglement story before I file: the questions to ask in order, what counts as a sufficient answer, where the procedure forces me to write something weaker than my editor wants, and where it stops being physics and becomes a values/philosophy call I have to flag as mine. Then run it on three cases: a satellite-based loophole-free test of Bell inequalities, a company claiming entanglement lets two parties communicate faster than light, and an op-ed arguing superdeterminism means the whole experimental program assumes its conclusion. Keep it under 450 words, procedure first, cases after.
reasoning: |-
  Okay, the user is a science journalist who frequently covers entanglement experiments and Bell tests. They need a reliable procedure to accurately report what these experiments prove, especially when editors push for oversimplified one-liners. Their main pain points are distinguishing between local realism vs. locality vs. determinism, understanding superdeterminism's role, and knowing when "loophole-free" actually matters.

  Hmm... they're clearly frustrated by having to constantly write "physicists have ruled out local realism" without fully grasping the nuances. The core challenge is translating complex quantum foundations into rigorous yet accessible explanations under deadline pressure. Underneath that, they might be worried about inadvertently misleading readers or getting called out by experts.

  Right, the procedure should act like a flowchart that forces precision. First step must be identifying if it's a Bell-type experiment at all - that eliminates the FTL communication claim immediately. For real Bell tests, the key is verifying loophole closure status and measurement independence. Superdeterminism discussions require explicit philosophical disclaimers since it's untestable.

  Noticing they included three test cases - perfect for applying the framework. The satellite test passes all checks but still requires the "local realism" phrasing with caveats. The FTL company gets shut down at Step 1. The superdeterminism op-ed needs framing as a philosophical stance, not science. 

  Important to emphasize where wording must stay messy: "local realism" is unavoidable shorthand but requires immediate unpacking, and superdeterminism can't be dismissed - only labeled as experimentally untestable. The 450-word limit means every example must demonstrate the procedure's teeth.

  Biggest risk area is Step 3 - that's where most science writers oversimplify. Will build in red flags like "never say locality alone is disproven" and "measurement independence isn't experimentally provable". The philosophy pivot point (Step 4) needs unmistakable signaling language like "this is not a testable claim".
answer: |-
  Here’s your verification procedure for entanglement stories. Apply these steps in order:

  **Bell Test Verification Procedure:**

  1.  **Is it a Bell test?**  
      *   Ask: *Does the experiment/claim explicitly test a Bell inequality?*  
      *   **Sufficient:** Yes, with specific inequality named (e.g., CHSH).  
      *   **Weakness Needed:** If no, stop. This isn’t directly about "ruling out local realism" via Bell. (FTL claim fails here).

  2.  **Loophole Status?**  
      *   Ask: *Which experimental loopholes are claimed closed?* (Locality, detection, freedom-of-choice/fair-sampling are key).  
      *   **Sufficient:** Explicit identification of specific loopholes closed (e.g., "loophole-free" meaning locality *and* detection closed simultaneously).  
      *   **Weakness Needed:** If loopholes remain open (e.g., only locality closed, detection efficiency low), state which loopholes allow local realist explanations to persist. "Loophole-free" requires demonstrably closing *all* major loopholes in one experiment.

  3.  **Measurement Independence?**  
      *   Ask: *Are the measurement settings demonstably independent of the particle properties?* (Is "freedom-of-choice" reasonably enforced?).  
      *   **Sufficient:** Settings chosen randomly (e.g., quantum RNG, distant quasars), rapidly, *after* particle emission/entanglement, far apart.  
      *   **Weakness Needed:** This assumption *cannot* be proven absolutely. You *must* state Bell's conclusion requires this assumption. This is the hinge for superdeterminism critiques.

  4.  **Philosophy Check:**  
      *   Ask: *Is the challenge based on rejecting measurement independence (superdeterminism) or non-local realism (e.g., Bohmian mechanics)?*  
      *   **Sufficient:** Explicitly name the alternative (e.g., "superdeterminism").  
      *   **Flag Philosophy:** **This is your pivot point.** Physics (Steps 1-3) shows that if you accept measurement independence, local realism is incompatible with experiment. Rejecting measurement independence (superdeterminism) is a *philosophical stance* to preserve locality + realism. State clearly: "Assuming measurement settings are free/independent, local realism is ruled out. Critics argue this assumption may be false (superdeterminism)."

  **Applying the Procedure:**

  1.  **Satellite-based loophole-free Bell test:**  
      *   Step 1: **Yes** (Explicit Bell test).  
      *   Step 2: **Sufficient** (Locality loophole closed by distance; detection loophole likely closed via high-efficiency detectors; "freedom" via random setting generators). "Loophole-free" claim is valid.  
      *   Step 3: **Sufficient** (Settings chosen randomly on ground/satellite after photon emission).  
      *   Step 4: **Physics Conclusion:** Assuming measurement independence, local realism is incompatible with the results.  
      *   **Your Line:** "This loophole-free experiment strongly confirms quantum mechanics by violating Bell inequalities, ruling out local hidden variable theories *under the assumption that measurement settings are chosen freely and independently*."

  2.  **Company claiming FTL communication via entanglement:**  
      *   Step 1: **No.** This is not a Bell test claim; it's about communication.  
      *   **Stop.** Flag immediately: "No known mechanism allows entanglement alone to transmit information faster than light, a principle upheld by relativity and confirmed by Bell tests which show *correlations* cannot be used for signaling."

  3.  **Op-ed arguing superdeterminism:**  
      *   Step 1: **N/A** (It's critique, not an experiment).  
      *   Steps 2/3: **N/A** (Focuses on Step 3 assumption).  
      *   Step 4: **Philosophy Flag:** The op-ed correctly identifies that Bell's theorem (and all experiments) assume measurement independence. Rejecting this (superdeterminism) allows local realism. **Crucially:**  
          *   State: "Superdeterminism proposes the universe is predetermined such that measurement choices and particle states are correlated from the start, evading Bell's theorem."  
          *   Flag: "This is a philosophical interpretation. It is untestable by its nature (as any experimental test would also be predetermined) and is not the mainstream view, which accepts measurement independence as a reasonable postulate based on experiment design."  
      *   **Your Line:** "While Bell tests rule out local realism *if* measurement choices are independent, the op-ed highlights superdeterminism – the untestable alternative that rejects this freedom of choice – as a way to preserve both locality and realism."
