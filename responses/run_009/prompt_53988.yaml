answer: |-
  ## Sisterly Scorn & Sacrifice (Kitchen Table Confrontation)

  **Setting:** The sprawling kitchen of a family estate, post-wedding. Empty champagne flutes litter the counter, discarded napkins crumpled. Moonlight streams through the window. MAYA (30s, earnest, tired) sits nursing lukewarm tea. RUTH (30s, sharper, agitated) paces near the sink.

  **RUTH:** (Stopping abruptly) So, let me get this crystal clear. You get a *massive* bump – senior director money, Maya! – and instead of finally ditching that shoebox apartment, you're giving... what? Eighty percent? To... mosquito nets? Seriously?

  **MAYA:** (Sighs, pushes her glasses up) Seventy-five. Primarily effective health interventions, yes. Nets, deworming, cash transfers where it works best. The spreadsheet models the impact per dollar. It’s... significant, Ruth. More than significant.

  **RUTH:** Significant? Significant for *them*, maybe! What about significance for *you*? Seriously, Maya. Your couch is practically duct-taped. Your commute’s an hour each way. You *earned* that raise. You deserve some comfort. Some... breathing room. A life!

  **MAYA:** I *have* a life. A good one. More comfortable than 99% of humans who've ever lived. More comfortable than Aunt Carol’s caterers tonight, probably. Did you see how hard they were running? My 'shoebox' has heat, running water, safety. That’s already luxury. Pointing out that baseline isn't dismissing my comfort, Ruth, it’s... context.

  **RUTH:** Context? Fine. Philosophical context. This... utilitarian math of yours. It demands *everything*, doesn't it? Until you're living on rice and beans in a closet, donating every spare cent. Where does 'Maya' end and 'charity machine' begin? Doesn't a moral theory that leaves you *no* space for yourself – for things just for *you*, just because *you* want them – doesn't that suggest something’s fundamentally broken with it? That it ignores... integrity? Your own projects?

  **MAYA:** We accept demands without limits elsewhere, Ruth. You wouldn't kill someone to avoid that horrible commute, right? Even if it made your life objectively easier? The cost to *you* isn't the deciding factor there. Why should it magically become an impenetrable shield here? Because it's *only* my comfort or convenience on the line? Isn't that measuring the demand against a baseline level of comfort I feel entitled to... a baseline that includes things others are dying for lack of?

  **RUTH:** (Pours herself water, leans against the counter) Okay, hold on. You're bundling things. Maybe... maybe it's not just the sheer *amount* being asked. Maybe it's also... why just you? Why is Maya carrying this whole damn load while Uncle Frank brags about his new boat, or Mom drops five grand on those ridiculous peonies that wilted before the cake was cut? Why is *your* comfort negotiable, and theirs isn't? It feels... unfair. Exploitative, even. Of *you*.

  **MAYA:** (Looks at Ruth, a flicker of surprise, then a small, tired smile) Okay. Okay, Ruthie. That’s... sharper. Two things. The demandingness – the sheer cost to me. And the fairness – why me alone? Thanks for untangling that.

  **RUTH:** (Nods, encouraged) Right? So, on demandingness: even if you accept your baseline comfort argument... constantly *living* by this rule – maximize, donate, optimize – wouldn't it just... grind you down? Make you miserable? Isn't that a sign it's a terrible *practical* rule, even if the underlying principle is true? You can't live in the abstract 'map' all the time. You need an 'itinerary' you can actually walk. One that doesn't leave you bleeding on the path.

  **MAYA:** Maybe. But the map being hard to navigate doesn't mean the territory isn't there. Just because living by "always maximize utility" might be psychologically impossible or lead to burnout, doesn't mean the underlying moral fact – that suffering is bad, alleviating it is good, and we should do as much as we can – is suddenly false. It might just mean we're flawed instruments. We need heuristics, self-care rules... knowing we're falling short of the ideal, not that the ideal is wrong.

  **RUTH:** Heuristics? Like... allowing yourself an apartment that isn't actively falling apart? That's not a heuristic, Maya, that's basic sanity! And the fairness point *still* stands. Why *you*? If everyone gave even ten percent of what you’re giving, the impact would be huge, and you wouldn’t be the family martyr! This extreme sacrifice only makes sense if everyone else is doing their bit. They’re *not*. So why should you bear the entire moral burden? It feels... pointless. And isolating. And yes, unfair.

  **MAYA:** Because *I* know. I see the numbers, Ruth. I see the faces behind the statistics. Knowing creates the obligation. Uncle Frank’s blissful ignorance about effective giving doesn't absolve *me*. His boat doesn't erase a child dying of malaria. Two wrongs, etcetera. And maybe... maybe my giving makes it a tiny bit more likely others will see it’s possible? Though honestly, that’s a bonus, not the reason.

  **RUTH:** (Steps closer, lowers her voice, intense) But Maya, look at what you’re leaning on. This ‘*I* know, so *I* must act, even if no one else does.’ This distinction between *you* and *them*. Between your obligation and Uncle Frank’s lack of one. Isn’t that... borrowing from the enemy camp? Your whole utilitarianism thing dissolves the self/other boundary, right? It’s all just sentience, utility, pain. One big pool. So how can you suddenly pivot and say *your* sacrifice is special because *you* are the one who knows? If the self/other distinction doesn’t fundamentally matter morally, then *why* is *your* knowing the trigger for *your* sacrifice? Why isn’t it just... a problem for *everyone*, equally? You’re using the very distinction your philosophy rejects to justify why *you* alone have to bear this crushing weight. You’re fencing off a ‘self’ after declaring the fence immoral.

  **(Maya stares at Ruth. The hum of the refrigerator is suddenly loud. She looks down at her tea, spinning the mug slowly. A long silence.)**

  **MAYA:** (Quietly) That’s... actually really good, Ruth. Damn. The self/other thing. Officially, yeah, utilitarianism wants to dissolve it. Morally, we’re all just... nodes. Points where good or bad happens. *Knowing* shouldn’t create a special obligation *for me*, if the obligation exists for the node regardless... it should just be a fact about which node *can* act. But... (She trails off, frowning)

  **RUTH:** But what? It feels different? Because it *is* you? Exactly! That feeling – that ‘me’ matters in a way that changes the moral equation – that’s what *I’m* talking about. That’s the ‘life of her own’ bit. Your philosophy can’t easily accommodate it, but you *live* by it when you say *you* must act because *you* know. So maybe... maybe that feeling *is* morally relevant? Maybe it *should* cap the demands?

  **MAYA:** (Looks up, meets Ruth’s eyes. There’s no triumph in Ruth’s face, just concern and the intensity of the argument.) Maybe. Or... maybe recognizing that feeling is part of being human, part of the flawed instrument. And maybe the unfairness... the sheer isolation of being the only one... maybe *that’s* the real cost I haven't fully priced in. Not just the smaller apartment, but... the distance it creates. Even from you. Right now.

  **RUTH:** (Sighs, pulls out the chair opposite Maya and sits, the fight draining slightly) Yeah. That too. Seeing you strain under this... it hurts. It feels like you're disappearing into a spreadsheet. I miss my sister who used to get excited about terrible action movies and buy overpriced scented candles just because.

  **MAYA:** (A small, genuine smile) I still like terrible action movies. And... maybe the candle budget survives the spreadsheet. Barely. Look, Ruth... I hear you. The fairness point bites. Hard. And your point about me smuggling the self back in... I need to chew on that. Really chew. But... (She leans forward) Can you wave this off entirely? That kid *not* dying of malaria? That family *not* starving because of a cash transfer? That’s *real*. More real, in a way, than my granite countertops. If the cost to me is discomfort, and the gain is a life saved... how do I *not* do it? Especially when I know how? Isn’t the sheer asymmetry... overwhelming? Doesn’t it feel like walking past someone drowning because the water’s cold?

  **RUTH:** (Stares out the window at the moonlit lawn, littered with discarded confetti) Yeah. It does. Sometimes. But maybe... maybe we’re *all* walking past, most of the time. And yelling at the one person who stops... maybe that’s just easier than admitting we should stop too. Or that the pond is so vast, stopping feels futile. (She looks back at Maya, weary) I don’t have a clean answer for that. Just... please don’t drown yourself trying to save everyone. You’re still my sister. Countertop or no countertop. Even with the damn spreadsheet.

  **MAYA:** (Reaches across the table, touches Ruth’s hand briefly) Deal. And... thanks. For not just calling me a robot. Even if I sometimes sound like one.

  **RUTH:** (Squeezes Maya’s hand, then pulls back, standing up) You kinda do. But... a robot with a surprisingly good point about drowning people. Now, help me hide the evidence of this champagne before Mom finds it. We can argue about moral luck and inherited wealth tomorrow. This peony budget alone could fund a village clinic... (She gestures dramatically at a wilting floral arrangement).

  **MAYA:** (Lets out a surprised laugh, shaky but real) Ruthie! Don't start. One existential crisis per night. My utilitarian calculus can’t handle Mom’s floral aesthetics right now. Grab the trash bags.

  **(They share a look – exhaustion, unresolved tension, but undeniable warmth. The argument isn't won, just paused, the weight of it settling between them as they start the mundane clean-up.)**

  ---
  **Word Count:** ~1170

  **Notes on the Philosophy & Dynamics:**

  1.  **Ruth's Development:** She starts with frustration ("no life!"), articulates the demandingness objection ("no space for yourself"), *then* unpacks it into demandingness *and* fairness with Maya's help. She uses the "integrity" language loosely but lands the killer point: Maya's reliance on the self/other distinction contradicts utilitarianism.
  2.  **Maya's Defense:** She uses the "no-killing" analogy (demand without self-cost cap), highlights the baseline problem, distinguishes moral truth from decision procedures ("map/itinerary"). She acknowledges the unfairness and isolates the core utilitarian pull: the overwhelming asymmetry of cost vs. benefit (life saved).
  3.  **No Winner:** Ruth forces Maya to confront a deep inconsistency in her *application* of utilitarianism (the self/other smuggled in). Maya leaves Ruth unable to dismiss the core moral pull of preventing immense suffering at relatively low cost. The fairness/unfairness tension hangs unresolved.
  4.  **Sisterly Beats:** The "Ruthie", the hand touch, the shared clean-up task, the deflection with Mom's flowers. The interruptions, trailing off ("But..."), and concrete examples (duct-taped couch, peonies, champagne) ground the philosophy.
  5.  **The Demandingness Bite:** Ruth's point *does* bite hard here. Maya has no immediate rebuttal to the charge of inconsistency, only acknowledgment. The scene suggests the demandingness objection gains significant force when combined with the *unfairness* of isolated sacrifice and the psychological reality of needing a "self" to act *from*, which pure utilitarianism struggles to value intrinsically. The philosophy books often treat demandingness abstractly; this grounds it in relationship and personal identity.
