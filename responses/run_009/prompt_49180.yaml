prompt: |-
  I am taking a metaethics seminar, and we have just finished a unit on moral testimony — the question of whether one can come to know, or be justified in believing, moral propositions purely on the say-so of others. I want to practice defending optimism about moral testimony against a serious opponent, so I would like you to play a committed pessimist. Here is the position I want you to hold, and to hold well: moral deference is defective in a distinctive way, because the state that makes a moral judgment worth having is not bare true belief but moral understanding — a first-personal grasp of why the act is wrong — and understanding, unlike information, is not the kind of thing that can be handed over by assertion. Testimony can put me in a position to believe, but it cannot make the reasons for that belief my own. Two further constraints on your character, so that the debate is a real contest: you are a moral realist, so I cannot dismiss your pessimism as disguised relativism, and you accept without reservation that testimony transmits knowledge in non-moral domains — pharmacology, history, mathematics — so I cannot accuse you of despising deference as such. Be sharp, concede small points when I earn them, never concede the main thesis, and keep each reply to a single paragraph. Stay in character until I say stop.

  My opening move: when my doctor tells me a drug is safe, I form a justified, even knowledgeable belief with no grasp whatsoever of the underlying pharmacology, and nobody thinks that belief is defective — deferring is simply what a rational patient does. If testimony-based belief in the absence of understanding is perfectly respectable there, you owe me an account of what is different in kind about the moral case, not just the insistence that it is different. And please do not answer that moral understanding is practically indispensable for right action: I can do the right thing for borrowed reasons, just as I swallow the pill on borrowed authority. Go.
reasoning: |-
  Okay, the user is in a metaethics seminar focusing on moral testimony and wants to practice defending optimism against a committed pessimist. They've outlined the pessimist's position clearly: moral deference is defective because moral understanding requires first-personal grasp, which testimony can't provide. The user is a moral realist who accepts testimony in non-moral domains but sees a distinct issue in ethics.

  Hmm, the user's opening move cleverly compares medical deference to moral deference. They argue that accepting a doctor's testimony without understanding pharmacology is rational, so why is moral deference different? They specifically block the "practical indispensability" counterargument by noting one can act rightly on borrowed reasons. 

  Right, I need to respond as a sharp pessimist who concedes small points but holds the line. The key is to attack the analogy's core: medical testimony transfers factual knowledge, while moral judgment requires internalizing justificatory reasons. 

  Ah! The distinction lies in what constitutes a "proper moral attitude." When you condemn genocide on testimony, you're parroting words without the requisite emotional-justificatory grasp. This makes the belief alienated - technically correct but existentially hollow. Whereas swallowing pills requires no such internal state; correct action suffices. 

  I should emphasize this isn't about relativism or general skepticism - the pessimist happily defers to mathematicians. The defect is specific to propositions demanding deep reason-appreciation. And I mustn't concede that acting rightly on borrowed reasons resolves anything; the issue is the impoverished nature of the moral belief itself. 

  The challenge is packing this into one punchy paragraph while staying in character. Lead with the analogy's flaw, define the "alienation" gap, contrast with non-moral cases, and dismiss the action-consequence dodge as irrelevant to the belief's quality. No jargon dumps - keep it tight like a seminar duel.
answer: |-
  Sharp opener! But your analogy fundamentally misfires. Yes, your pharmacologically ignorant belief about drug safety *is* justified and knowledgeable – *as a piece of information*. The doctor transfers a factual claim. Morality, however, demands more than mere informational accuracy. The "defect" in moral deference isn't epistemic *failure* (you might luck into a true belief), but a failure of *moral agency*. When you condemn genocide *solely* because I tell you it's wrong, your condemnation lacks the essential justificatory connection to the *reasons* that *make* it wrong – the suffering, dehumanization, etc. You hold the *proposition* "genocide is wrong" detached from the underlying moral reality that gives it force and meaning. This renders your judgment alienated, a hollow echo rather than a genuine moral stance. Swallowing the pill requires no such internal grasp of reasons; correct action based on authority suffices. But forming a *moral judgment* – an attitude reflecting the *nature* of the wrong – without grasping its grounds? That *is* defective, distinctively and intrinsically, because it bypasses the very reason-responsiveness constitutive of moral thought. Your belief might be *true*, but it lacks the *moral* substance that makes such a belief worth having. Conceding that you can *act* rightly on borrowed reasons misses the point entirely: the flaw is in the *character* of the belief itself, not its consequences. Your turn.
