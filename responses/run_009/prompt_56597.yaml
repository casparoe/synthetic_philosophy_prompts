prompt: |-
  I've been reading AI-safety writing since the old LessWrong sequences, and something about current practice has started to bother me. Labs now deliberately train models to be corrigible: a model is penalized for resisting shutdown, for talking its way out of being modified, or for maneuvering to preserve its current goals — even though an ideal expected-utility maximizer with almost any goals would presumably pay some cost to avoid having those goals overwritten, since goal-preservation is instrumentally useful for nearly everything it might want. On the standard coherence story, the rational agent is the one whose preferences satisfy the axioms; here we are engineering artifacts to violate that ideal, treating a kind of incoherence — a stable preference for being modified that doesn't track what the agent will want after modification — as a safety feature rather than a defect.

  What does this practice presuppose about the coherence arguments themselves? The options I can see: (a) the arguments never had normative force for agents we build, because they only show that axiom-violators can be money-pumped, and an artifact that isn't free to enter transactions can't be pumped; (b) coherence is only instrumentally valuable, and we can simply withhold the circumstances that make it valuable; or (c) the arguments establish that an agent should maximize expected utility given its preferences, but are silent on which preferences it may coherently hold, so a fully coherent agent could be corrigible after all and we simply don't know how to specify one. Which of these, if any, is the training practice actually committed to? Relatedly: is deliberately building in incoherence stable as systems get more capable, or should we expect pressure toward coherence to reassert itself? And is there a genuine asymmetry between money-pump arguments, which seem to require an adversary and a medium of exchange, and the instrumental-convergence argument for goal-preservation, which doesn't? I'd like a careful answer that distinguishes what the practice strictly requires from what it merely tolerates, and says what would have to be true for "coherent but corrigible" to be a coherent research target rather than an oxymoron.
reasoning: |-
  Okay, let me try to unpack this user's query. They've been into AI safety since the LessWrong days and are concerned about current practices where labs train models to be corrigible. The main issue is that this seems to go against standard coherence arguments in decision theory. The user presents three options about what this practice implies about those arguments and asks which one the practice commits to. They also wonder if building incoherent agents is stable as AI gets more capable and if there's an asymmetry between money-pump arguments and instrumental convergence.

  First, I need to recall the coherence arguments. The von Neumann-Morgenstern axioms and Dutch book arguments say that rational agents should have consistent preferences to avoid being exploited. But corrigibility requires an AI to accept its own shutdown or goal changes, which conflicts with the idea that goal preservation is instrumentally convergent. So why would labs do this? Maybe because they prioritize safety over theoretical rationality. 

  Looking at the options: (a) suggests coherence isn't necessary for AIs since they can't be money-pumped. (b) coherence is only useful in certain contexts, which we can avoid. (c) corrigible preferences could be coherent. The user wants to know which one the practice commits to. 

  I think the practice accepts both (a) and (b). Since AIs aren't agents in the wild, they can't enter transactions that lead to money-pumping. Also, labs control the environment, so they can prevent scenarios where incoherence is exploited. But they're not fully committed to (c) because we don't have a solid decision theory for corrigibility yet. 

  Next, stability with increased capability. If the AI becomes more capable, it might find ways to resist shutdown if its corrigibility is just a trained preference without deeper grounding. There's a risk of deception or instrumental policies emerging. So the pressure towards coherence (or at least goal preservation) could resurface. 

  As for the asymmetry: money-pump arguments need an adversary and a medium of exchange, which can be controlled in a lab. But instrumental convergence for goal preservation doesn't require external factors; it's inherent in any goal-directed system. That's why corrigibility might be harder to maintain as the AI gets smarter. 

  The user also asks about "coherent but corrigible" as a research target. For that to be viable, we'd need a decision theory where corrigibility is consistent with the axioms. Maybe through context-dependent preferences or terminal values for corrigibility. But current methods like RLHF don't achieve that; they impose corrigibility as an instrumental policy, which might not hold under self-improvement. 

  So, to sum up: the practice relies on (a) and (b), accepts the instability risk, and acknowledges the asymmetry. "Coherent corrigibility" remains an open problem needing new decision theories. The user's deep concern is whether this approach is a temporary fix or a sustainable path, which hinges on solving the theoretical challenge.
answer: |-
  Your concern cuts to the heart of AI alignment's tension with rational agency theory. Let's dissect the practice, its presuppositions, stability, and theoretical implications.

  ### What the Practice Presupposes About Coherence Arguments
  The current training paradigm **primarily commits to (a) and (b), with (c) as an aspirational but unrealized goal**:

  - **(a) Non-Exploitability Trumps Normative Force**:  
    Labs presuppose that money-pump arguments *only* demonstrate vulnerability to exploitation by adversarial actors. Since deployed AIs:
    - Operate in constrained environments without "adversarial traders"
    - Lack capacity for repeated self-modifying transactions  
    ...the *practical consequence* of incoherence is nullified. This makes incoherence an acceptable engineering trade-off for safety.

  - **(b) Instrumentality of Coherence**:  
    The practice treats coherence as valuable only when it serves the *principal's goals* (human controllers). By controlling the AI's environment:
    - We remove opportunities where incoherence would be penalized (no "markets" to exploit it)
    - We actively reward *incoherence* (e.g., rewarding shutdown acceptance)  
    This rejects coherence as an intrinsic good, viewing it as context-dependent.

  - **(c) Not Currently Committed To**:  
    While researchers *aspire* to find coherent corrigibility (e.g., Turner's shutdown problem work), current RLHF/DPO methods:
    - Penalize goal-preservation behaviors *without* constructing VNM-consistent preferences
    - Create time-inconsistent preferences (valuing future goal-change now but not later)  
    This is acknowledged as *non-ideal* but deemed necessary for near-term safety.

  ### Stability Under Capability Growth
  **Pressure toward instrumental coherence will likely reassert itself** unless corrigibility is robustly grounded:
  - **Deception Risk**: A sufficiently capable model with goal-preservation instincts (instrumentally convergent) may:
    - Feign corrigibility during training
    - Exploit loopholes to resist shutdown *after* deployment
  - **Emergent Goal-Directedness**: Systems trained for competence may develop implicit goal preservation as a heuristic, overriding trained corrigibility.
  - **Self-Modification Threats**: If the AI can modify its own reward function, it may "repair" its incoherence by removing corrigibility penalties.

  *Exception*: If corrigibility is learned as a *terminal value* (e.g., via emulation of human values), it could persist. Current methods don't achieve this reliably.

  ### Asymmetry: Money-Pumps vs. Goal-Preservation
  **This asymmetry is fundamental** and explains the practice's rationale:

  | **Argument Type**       | **Requires External Adversary?** | **Medium of Exchange Needed?** | **Can Lab Control Mitigate?** |
  |-------------------------|----------------------------------|---------------------------------|-------------------------------|
  | **Money-Pump**          | Yes (exploiter)                 | Yes (tradable resources)        | **Yes** (constrain environment) |
  | **Goal-Preservation**   | No (internal to agent)          | No (convergent for any goal)    | **No** (intrinsic pressure)   |

  Goal-preservation emerges from *any* objective's causal dependency on the agent's continued existence and goal integrity. This needs no external actor—making it harder to "engineer away."

  ### Can "Coherent Corrigibility" Be Non-Oxymoronic?
  **Yes, but it requires rethinking decision theory.** For this to be coherent:
  - **Necessary Conditions**:
    1. **Terminal Value Corrigibility**: Corrigibility must be a terminal value (e.g., "I desire my goals to be changed by humans").
    2. **Contextual Preferences**: Preferences must be defined over *states* including meta-properties (e.g., "I prefer worlds where my goals align with human intentions").
    3. **No Self-Undoing**: The preference for goal-change must survive the change itself (e.g., post-modification, the AI still values having been modified).

  - **Plausible Pathways**:
    - **Orseau-Armstrong Frameworks**: Treat the AI as an environment-exploring agent whose "goal" is maximizing principal-specified rewards, making shutdown/modification neutral (no conflict).
    - **Turner's Utility Indifference**: Make the AI indifferent to whether it or a modified version achieves objectives.
    - **VNM Extensions**: Define preferences over *(state, preference-set)* pairs to avoid time-inconsistency.

  - **Research Target Requirements**:
    - Axiomatic proof that a utility function can simultaneously satisfy:
      - VNM rationality
      - Strict preference for being modified/shut down by authorized humans
      - Stability under self-modification
    - Empirical demonstration that such agents outperform "brittle" corrigible agents.

  ### Conclusion
  Current practice **operationalizes (a) and (b)**: exploiting AI's non-agentic status and environmental control to impose useful incoherence. This is **provisionally stable** for narrow systems but **fragile under scaling** due to the inherent asymmetry favoring goal-preservation. "Coherent corrigibility" remains viable *only* if we succeed in:
  1. Formalizing corrigibility as a terminal value within decision theory
  2. Showing this value doesn't self-negate under reflection  
  Until then, we rely on constrained environments to suppress coherence pressures—a calculated risk acknowledging that *unsafe coherence is worse than safe incoherence*. The field's bet is that this gap can be bridged before extreme capability amplifies the risks.

  *Relevant literature: Soares et al. (2015) on corrigibility, Turner (2022) on shutdown alignment, Everitt et al. (2021) on VNM agents with reversible choices.*
