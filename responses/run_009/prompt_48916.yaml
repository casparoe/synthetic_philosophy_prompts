    - **Voting Booths**: 3 separate tables (one per group) with partitions for privacy.
    - **Ballot Boxes & Cards**: 
      - **Preference Cards** (red/blue, randomly assigned per round; e.g., 60% red, 40% blue per group).
      - **Vote Cards** ("VOTE" or "ABSTAIN").
    - **Outcome Board**: Tracks election results and token payoffs.
    - **Timer**.
  - **Room Setup**: 
    - Tables arranged for small-group rounds (first hour) and one large circle for the whole-class round (second hour).

  ---

  ### **Rules & Payoff Scheme**
  1. **Preference Assignment**:
     - Each student draws a hidden **Preference Card** (red/blue) at the start of each round. This is their "preferred outcome."
     - **Key**: They *never* reveal their preference to others.

  2. **Voting Decision**:
     - Students choose to submit either:
       - A **"VOTE" card** (costs 1 token; counts toward their preferred outcome).
       - An **"ABSTAIN" card** (costs 0 tokens; no vote recorded).

  3. **Outcome & Payoff**:
     - **Winning Outcome**: Majority of votes in the group. Tie = coin flip.
     - **Payoff**: 
       - If your preferred outcome wins: **+5 tokens** (regardless of voting).
       - If it loses: **0 tokens**.
       - **Voting Cost**: -1 token if you voted.
     - **Net Examples**:
       - Voted + won: **+4 tokens** (5 - 1).
       - Abstained + won: **+5 tokens**.
       - Voted + lost: **-1 token**.
       - Abstained + lost: **0 tokens**.

  4. **Rounds**:
     - **Small Groups (3 rounds, 15 min each)**:
       - Groups of 5 vote internally.
       - Preferences are *competitive* (e.g., 3 red, 2 blue per group).
     - **Whole Class (1 round, 30 min)**:
       - All 15 students vote together.
       - Preferences are *close* (e.g., 8 red, 7 blue total).

  ---

  ### **Timeline (2 Hours)**
  | **Time** | **Activity** | **Instructor Actions** |
  |----------|--------------|------------------------|
  | **0:00-0:15** | **Intro & Rules** | Explain tokens, voting/abstain cards, payoffs. Emphasize: *No judgment—both choices are rational*. Run a 3-person demo. |
  | **0:15-0:60** | **Small-Group Rounds** | Assign groups. Distribute preference cards secretly. Students decide → submit cards → tally results → adjust tokens. Repeat 3x. |
  | **0:60-1:00** | **Transition** | Move to whole-class setup. Reassign preferences (close split). |
  | **1:00-1:25** | **Whole-Class Round** | All 15 vote. Tally publicly. Highlight margin of victory. Adjust tokens. |
  | **1:25-1:30** | **Secret Ballot** | Students anonymously write: *"Why did you vote/abstain in the big round?"* (Collect for debrief). |
  | **1:30-2:00** | **Debrief** | Use script below. |

  ---

  ### **Debrief Script**
  *(Start by reading anonymous ballot responses aloud without judgment.)*  

  **Step 1: The Arithmetic ("Lever" View)**  
  > *"In the small groups, did anyone see an election where one vote changed the outcome? What did that feel like?*  
  > ...  
  > *Now, in the whole-class round: Did anyone calculate their chance of being the ‘tipping vote’? What number would you assign?*  
  > ...  
  > **Key Insight**: When the group is large, the cost of voting (-1 token) almost always outweighs the tiny chance of changing the outcome. That’s the arithmetic—it says *don’t vote*."  

  **Step 2: The Tension ("Chorus" View)**  
  > *"Raise your hand if you voted in the big round even after the small groups. Why?*  
  > ...  
  > *When your preferred side won, how did it feel if you abstained vs. if you voted?*  
  > ...  
  > **Key Insight**: Voting isn’t just about being the lever that tips the outcome. It’s about being a *voice in the chorus*—one of many who *together* create the outcome. The tokens didn’t capture this, but in real life, we feel it."  

  **Step 3: The Dilemma**  
  > *"The arithmetic says voting is irrational. Yet many of us do it. Why?*  
  > ...  
  > *Is voting more like buying a lottery ticket (instrumental) or singing in a choir (expressive)?*  
  > ...  
  > **Conclusion**: Both views make sense. The lever view is coldly logical. The chorus view is about belonging, identity, and upholding a system we value. Neither is foolish."  

  **Final Note**:  
  > *"In real elections, your vote likely won’t tip the result. But if everyone *only* followed the arithmetic, democracy collapses. We vote because we’re not just self-interested calculators—we’re citizens. That’s the tension no token can replicate."*  

  ---

  ### **Predictable Challenges & Solutions**  
  1. **Problem**: Defensive abstainers feel judged.  
     **Solution**: Stress *both choices are rational* in intro/debrief. Use anonymous ballots to depersonalize.  

  2. **Problem**: Small-group outcomes are lopsided (e.g., 4-1 preference split).  
     **Solution**: Rig the preference draws to ensure competitiveness (e.g., 3-2 splits).  

  3. **Problem**: Students lobby peers to vote/abstain.  
     **Solution**: Enforce secret ballots and partitions. Remind: *"No talking during decisions."*  

  4. **Problem**: Token math confuses some.  
     **Solution**: Use the outcome board to visualize: *"Preferred outcome wins? +5 tokens. Voted? -1 token."*  

  5. **Problem**: The "chorus" effect feels underpowered.  
     **Solution**: In debrief, ask: *"Who felt proud to vote even if it didn’t tip? Who felt guilty abstaining?"* Then connect to real life.  

  ### **What Tokens Can’t Capture**  
  - **The Chorus Effect**: Tokens reduce voting to a transaction. They can’t replicate the *emotional weight* of belonging, duty, or civic identity.  
  - **Your Role**: At the end, share:  
  > *"The game can’t simulate why I vote even when it ‘doesn’t matter.’ It’s because I’m not just a lever—I’m part of the chorus that keeps democracy alive. That’s worth more than tokens."*  

  This design forces students to *live* the arithmetic and the tension, then unpack it together. It avoids shaming abstainers while honoring the emotional reality of voting. Run it as written, and the puzzle will speak for itself.
