prompt: |-
  I've been asked to state my position on the precautionary principle for a panel on the regulation of emerging risks, and before I do I want a consistency audit of it. Something in the package feels unstable to me, but I can't locate the instability: each item seems right to me on its own, and I don't know which of them, if any, I'm prepared to give up. Here is the package.

  (1) The precautionary principle is a principle of practical rationality and not merely a policy slogan. Where a possible harm is grave and effectively irreversible, it can be rational to restrict an activity, or to intervene, without established proof of harm; demanding proof of harm before acting is a mistake in exactly the cases the principle is about.

  (2) What triggers the principle is the severity and irreversibility of the possible harm, not its probability. A very small probability of an irreversible catastrophe can demand action that a much larger probability of a comparable but reversible harm would not. That probabilities cannot yet be estimated is not a reason for the principle to fall silent; it is the condition under which it is supposed to do its work.

  (3) The burden of justification falls on whoever introduces a new risk. Regulators do not have to prove harm before restricting; the introducer has to show safety before introducing.

  (4) The principle is neutral between intervening and refraining. Not acting is itself a choice for which someone is answerable, and a restriction is itself an intervention that can carry grave and irreversible risks. So precaution cuts against inaction as readily as against action, and the objection that a proposed remedy carries risks of its own is not, by itself, a good reply to a precautionary argument.

  (5) Non-paralysis is a constraint on any acceptable formulation. A version of the principle under which, in some choice situation, every option is forbidden is a reductio of that version, not an application of it. In every situation the principle must leave a permissible option; it cannot simply go silent when things get hard.

  (6) The principle's scope is restricted. Where the relevant harms are reversible and the probabilities can be estimated, ordinary cost-benefit analysis should decide, and precaution has nothing to add.

  (7) On cases, I hold: that the case for aggressive climate action is a precautionary case and a sound one; that the course actually taken on DDT — restricting agricultural use while preserving public-health use — was roughly right, and that I would defend the restriction even if it had raised the cost of malaria control; that when suit was brought to stop a new heavy-ion collider on the theory that the collisions might initiate a world-destroying outcome, refusing to halt it was right and the demand was unreasonable; and that research into solar geoengineering ought not to be shut down on precautionary grounds, though I make no claim about deployment.

  Please go through the pairs and tell me which are genuinely in tension and how badly, and which only look to be. For each real tension, say what would have to give and what giving it up would cost me elsewhere in the list. Rank the tensions by severity rather than presenting them as equally bad, and then tell me which single revision would clean up the most. I would not accept a dissolution that quietly hollows out one of the commitments while leaving it officially on the books — for instance, if the principle is said to trigger only on serious possibilities, I want to know what makes a possibility serious without collapsing back into probability, which (2) says is beside the point. Don't assume I have noticed where the problem is; I haven't. And don't soften the audit on the assumption that I have a favorite item — I don't think I do, but I would rather find out from you than from the panel.
reasoning: |-
  Okay, let me tackle this complex request about auditing the precautionary principle package for internal tensions. The user presents seven carefully crafted positions that feel unstable when combined, and wants me to identify genuine contradictions while preserving the core integrity of each point.

  First, I need to map the key pressure points. The user's commitment to low-probability catastrophes in (2) seems primed to collide with non-paralysis in (5). If we must act on tiny risks of irreversible harm, but simultaneously can't forbid all options, how do we decide when to act? The probability dismissal in (2) makes this especially tricky - without probabilistic thresholds, the paralysis threat looms large. 

  Then there's the burden-shifting in (3) clashing with neutrality in (4). If introducers must prove safety while regulators face no proof burden, doesn't that inherently favor intervention over inaction? Yet (4) insists precaution cuts both ways. This looks like a structural asymmetry disguised as neutrality.

  I also notice scope restriction in (6) creates definitional tension with (1) and (2). If precaution only applies when probabilities can't be estimated, but reversible harms with known probabilities use cost-benefit analysis, what about irreversible harms with knowable probabilities? The user's own geoengineering research position seems to exploit this gap.

  The user's case judgments provide valuable stress tests. The collider case acceptance (reasonable to proceed despite annihilation risk) appears inconsistent with climate action stance unless we distinguish probability qualifiers - but (2) explicitly rejects probability relevance. Meanwhile, supporting DDT restriction even if it increased malaria deaths suggests the irreversibility criterion may be doing too much work.

  For resolution paths, I'm considering whether introducing "reasonableness" thresholds could reconcile (2) and (5) without betraying the anti-probabilistic stance. The burden asymmetry might require redefining "introducer" to include status quo defenders. The scope issue needs clarifying whether irreversibility alone suffices or unknown probabilities are essential.

  The single most effective fix would be to moderate the probability dismissal in (2), allowing qualitative likelihood assessments ("vanishingly small") to prevent paralysis. This preserves the core while removing the severest tension. Crucially, it wouldn't hollow out the principle since catastrophic potential remains primary.

  Throughout, I'll maintain the user's demand for rigorous analysis without softening contradictions. The panel context makes intellectual honesty paramount - better to surface cracks now than have opponents exploit them later.
answer: |-
  Here is a rigorous consistency audit of your precautionary principle package, ranking tensions by severity and identifying necessary trade-offs. The core instability stems from the *combination* of Points 2 (severity/irreversibility over probability) and 5 (non-paralysis) interacting with Point 1 (rationality without proof) and Point 4 (neutrality).

  **Ranked Tensions (Most Severe First):**

  1.  **Tension: Point 2 (Severity/Irreversibility Trumps Probability) vs. Point 5 (Non-Paralysis)**
      *   **Nature of Conflict:** This is the most severe and destabilizing tension. Point 2 insists that *any* non-zero probability of grave/irreversible harm, *regardless of how vanishingly small or impossible to quantify*, can demand action. Point 5 demands that the principle *must* leave at least one permissible option in every choice situation. If *every* possible action (including inaction) carries *some* non-zero, unquantifiable risk of *some* grave/irreversible harm (e.g., introducing a new technology vs. failing to develop a life-saving one vs. diverting resources from other risks), then Point 2 applied universally would forbid *all* options, violating Point 5. Your collider case implicitly acknowledges this – the probability was deemed so negligible that action wasn't required *despite* the theoretical severity. But Point 2 explicitly says probability is beside the point.
      *   **What Must Give:**
          *   **Option A (Moderate Point 2):** Introduce a *qualitative* threshold for "non-negligible possibility" or "reasonable scientific plausibility" *without* collapsing into quantitative probability. This is essential to avoid paralysis. However, this risks hollowing out Point 2 if "plausibility" becomes a proxy for probability. You must define "plausibility" rigorously (e.g., based on mechanism, analogy, minimal evidence) without relying on numbers. *Cost:* Weakens the pure "probability is irrelevant" stance. Your collider case relies on this implicitly ("unreasonable" demand = implausible risk).
          *   **Option B (Weaken Point 5):** Accept that in *extremely rare* theoretical cases (like the collider), paralysis might be the rational outcome, making the principle silent. *Cost:* Undermines the principle's claim to being a guide for practical rationality (Point 1) and makes it potentially irrelevant for real-world decisions where *some* action must be taken.
      *   **Severity:** **Critical.** This tension threatens the principle's coherence as a practical decision rule.

  2.  **Tension: Point 3 (Burden on Introducer) vs. Point 4 (Neutrality Between Action/Inaction)**
      *   **Nature of Conflict:** Point 3 creates a significant procedural asymmetry: the *introducer* bears the burden of proving safety. Point 4 claims the principle is neutral, cutting against both harmful action *and* harmful inaction equally. The asymmetry of Point 3 inherently favors *inaction* (or the status quo) because the *introducer* must justify change. Defending the status quo requires no such burden under Point 3. This contradicts the claim of neutrality. Your DDT case (restricting *new* agricultural use) fits Point 3 easily; justifying *inaction* on malaria if DDT restriction *caused* more deaths would be harder under Point 3's burden structure.
      *   **What Must Give:**
          *   **Option A (Refine Point 3):** Specify that the "introducer" includes not just those proposing *new* technologies/activities, but also those *defending the status quo* when inaction carries potential grave/irreversible risks (e.g., failing to mitigate climate change). The burden shifts to whoever advocates for a *change* (or non-change) carrying novel, poorly understood severe risks. *Cost:* Complicates the "introducer" concept and moves away from a simple rule. Requires careful definition of "novel risk of inaction."
          *   **Option B (Moderate Point 4):** Acknowledge that the principle, *in its standard application* triggered by a *proposal for change*, inherently creates a burden on the proposer. True neutrality might require a different, more symmetric triggering mechanism or burden structure. *Cost:* Weakens the strong claim of neutrality, making it more context-dependent.
      *   **Severity:** **High.** This undermines the claimed symmetry of Point 4 and reveals a status-quo bias in Point 3's implementation.

  3.  **Tension: Point 6 (Scope: Only When Probabilities Unknowable) vs. Point 1/Point 2 (Rationality Without Proof / Severity Focus)**
      *   **Nature of Conflict:** Point 6 restricts the principle to cases where probabilities *cannot* be estimated. However, Point 1 justifies action *without* established proof of harm, and Point 2 emphasizes severity/irreversibility *over* probability. What about cases where probabilities *can* be estimated, but are very low, and the harm is grave and irreversible? Point 6 says use standard CBA. But if CBA (which heavily weights probability) would allow such a risk (e.g., a 0.001% chance of global catastrophe), does this betray the core insight of Points 1 & 2 that severity/irreversibility *should* sometimes trump low probability? Your collider case fits Point 6 (CBA-like reasoning deemed risk acceptable). But your climate stance emphasizes severity/irreversibility *despite* probabilistic models.
      *   **What Must Give:**
          *   **Option A (Refine Point 6):** State that the principle applies when probabilities are *unknowable OR when they are known to be non-negligible but the severity/irreversibility is so extreme that standard CBA is deemed insufficient or inappropriate*. *Cost:* Significantly broadens the scope, potentially making the principle too expansive and overlapping/conflicting with CBA. Requires defining "extreme" severity/irreversibility.
          *   **Option B (Clarify Point 2/Point 1):** Explicitly state that when probabilities *are* reliably known to be *vanishingly small* (like the collider), the principle *does not* demand action, even for severe harms. This introduces a *de minimis* threshold based on plausibility/improbability. *Cost:* Weakens the strong "probability is beside the point" language of Point 2. Makes the principle less distinct from risk-based approaches when probabilities *are* known.
      *   **Severity:** **Moderate/High.** This creates a potential gap in the principle's protection against low-probability catastrophes where probabilities *are* estimable but the outcome is unacceptable.

  4.  **Tension: Point 4 (Neutrality) vs. Point 6 (Scope) & Case Judgments (Geoengineering Research)**
      *   **Nature of Conflict:** Point 4 states that precaution cuts against inaction as readily as action. However, Point 6 implies that for risks that *are* reversible and have estimable probabilities, we *should not* apply precaution but use CBA. This risks favoring inaction (status quo) for *new* interventions aimed at *preventing* grave irreversible harms (like climate change impacts), because assessing the new intervention might fall under Point 6 (if its risks are deemed reversible/estimable). Your support for geoengineering *research* (not deployment) shows this tension. Opponents might use precaution (Point 1,2) to argue *against* research (risk of knowledge/moral hazard/unintended consequences). You argue *for* research, implying the risks of *not* researching (lost opportunity for a potential preventative tool) are also significant. Point 4 supports this view, but Point 6 might be used to argue geoengineering research risks are reversible/estimable, pushing it towards CBA and away from precaution.
      *   **What Must Give:** Primarily requires **clarification within Point 4/Point 6**. Emphasize that Point 4 applies *within* the domain defined by the trigger (grave/irreversible possible harm, probabilities unknowable or extreme). The decision *whether* to research geoengineering *is* potentially subject to precaution (assessing the risks of research vs. risks of no research regarding a potential tool for a grave threat). Distinguish research risks (often smaller, more reversible) from deployment risks. *Cost:* Requires careful articulation but doesn't fundamentally change points if the scope (Point 6) is already well-defined.
      *   **Severity:** **Moderate.** Manageable with careful framing of the trigger and the options being assessed under precaution.

  **The Single Most Effective Revision: Refine Point 2 to Avoid Paralysis**

  *   **Revision:** Modify Point 2 to: "What *primarily* triggers the principle is the severity and irreversibility of the possible harm. However, the *demand for action* requires that the possibility of harm, while potentially unquantifiable, must be *non-negligible* or *scientifically plausible* based on available evidence and understanding. A vanishingly small or purely speculative possibility, even of catastrophe, does not automatically trigger a demand for restrictive action if alternatives carry their own severe risks."
  *   **Why it Cleans Up the Most:**
      1.  **Directly Addresses Critical Tension (vs. Point 5):** It introduces the essential qualitative threshold ("non-negligible," "plausible," "not purely speculative") needed to prevent paralysis without requiring quantitative probabilities. It explains your collider judgment.
      2.  **Supports Coherence with Point 1:** Maintains that demanding *proof* of harm before acting is irrational for grave/irreversible threats, but acknowledges that demanding action based on *no credible basis* is also irrational.
      3.  **Reduces Pressure on Point 3/Point 4 Asymmetry:** By requiring *some* plausible basis for harm before burden shifts, it prevents Point 3 from being triggered by utterly fantastical scenarios, making the burden more reasonable and the neutrality claim slightly less strained.
      4.  **Aligns with Case Judgments:** Explicitly accommodates the collider case (speculative) and geoengineering research (plausible risks vs. plausible benefits warrant research, not blanket shutdown).
      5.  **Preserves Core:** The focus remains overwhelmingly on severity and irreversibility. Probability is *not* the main factor; plausibility isn't a number, it's a judgment about evidence and mechanism. It doesn't hollow out the principle; it prevents absurd applications that would discredit it.
  *   **Cost:** It requires defining "non-negligible" or "plausible" rigorously (e.g., based on mechanistic understanding, analogies to known phenomena, minimal empirical evidence, expert judgment). It formally acknowledges that *absolute* dismissal of probability considerations is unsustainable for a practical principle, though it still subordinates them to severity/irreversibility and avoids quantification. This is the cost of avoiding paralysis and maintaining practical rationality (Point 1 & 5).

  **Conclusion:**

  Your package is intellectually sophisticated but contains inherent tensions, primarily driven by the strong stance in Point 2 combined with the practical necessity of Point 5. The burden asymmetry (Point 3) also challenges the claimed neutrality (Point 4). The **single most effective step** is to refine Point 2 by introducing a qualitative plausibility threshold to prevent paralysis. This necessitates moving slightly away from the absolute "probability is beside the point" formulation but preserves the core emphasis on severity/irreversibility while making the principle practically applicable and consistent with your case judgments (especially the collider). Without this refinement, the tension between acting on any conceivable catastrophe risk (Point 2) and the need to allow *some* action (Point 5) remains a critical vulnerability. Addressing this will significantly strengthen your position for the panel.
