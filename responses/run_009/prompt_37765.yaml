prompt: |-
  You are a professional philosopher specializing in population axiology, intimately familiar with Derek Parfit's Reasons and Persons (1984) and the literature it spawned. I am designing a seminar on population ethics for advanced undergraduates, and what I need from you is considered judgment, not a neutral survey. Please think carefully and reason step by step; do not commit to a ranking before you have done the preparatory work I set out below.

  By way of background: Parfit's repugnant conclusion is that, compared with a population of fewer people whose lives are very good, there can be a much larger population whose members' lives are barely worth living, and that the larger population is nonetheless better, other things being equal. Most of the subsequent literature consists of attempted escapes. The main escape routes are roughly these:

  1. Averaging: what matters is average welfare, so a huge, barely-worth-living population ranks below a smaller, flourishing one.
  2. Critical-level views: adding a life raises a population's value only if that life's welfare exceeds some positive threshold.
  3. Lexical or threshold views, in the spirit of Parfit's own later suggestion of lexical superiority: sufficiently good lives rank lexically above merely adequate ones, so quality can outweigh quantity at the limit.
  4. Variable-value views: the value of adding lives diminishes as the population grows.
  5. Person-affecting restrictions: only the claims of people who exist, or will exist regardless of what we choose, can count, which is meant to block the trade between actual and merely possible people.
  6. Acceptance: simply bite the bullet and deny that the conclusion is repugnant, a line pressed by Michael Huemer in his 2008 paper "In Defence of Repugnance" in Mind.

  Your task has three steps.

  Step 1 — Brainstorm briefly. Before ranking anything, write a short paragraph on what criteria should govern the ranking. I would like you to weigh at least the following: how each family handles neighboring diagnostic judgments, especially the sadistic conclusion, where a theory crafted to avoid the repugnant conclusion ends up preferring the addition of lives of negative welfare to the addition of many positive ones, and the non-identity problem; theoretical parsimony; and stability under reflection rather than mere conformity to first-pass intuitions. Please add any further criteria you take to be important, and say why.

  Step 2 — Produce a tier list. Sort the six families into exactly three tiers: Tier A, views you would teach as live research programs; Tier B, views that are serious but, in your judgment, mortally wounded; Tier C, views you would assign mainly as cautionary tales. Justify every placement in two or three sentences. If a family belongs in a tier only conditionally, for instance under one formulation but not another, say so explicitly and state the condition.

  Step 3 — Commit. If you were forced to bet on one family as the most likely route to a stable resolution of the population-ethical paradoxes, which would it be? Name it, give your single strongest reason for the bet, and then state the one objection to it that worries you most.

  Please do not pad your answer with historical throat-clearing about Parfit; assume the reader knows the basics. What I want is the quality of your reasoning about trade-offs between theoretical costs, which is precisely what my students find hardest to see.
reasoning: |-
  Okay, the user is designing a seminar on population ethics for advanced undergraduates and wants my professional judgment on different approaches to escaping Parfit's repugnant conclusion. They've outlined six main escape routes and want me to evaluate them through a three-step process. 

  First, I need to establish evaluation criteria. Theoretical coherence is crucial - these views must handle logical extremes without contradiction. The ability to navigate the sadistic conclusion is a key stress test, as many "solutions" to repugnance create worse problems. Parsimony matters too; undergrads will struggle with needlessly complex machinery. Most importantly, views should offer reflective stability rather than just matching gut reactions, since Parfit showed how intuitions can mislead.

  The non-identity problem is another critical benchmark. Any view that can't explain why creating miserable lives might be wrong when the alternative is non-existence isn't viable. I should also consider how these theories handle positive asymmetry - the intuition that creating happy people is good but not obligatory, while creating unhappy people is actively bad.

  For the tier list: Lexical/threshold views (3) and critical-level (2) belong in Tier A. They directly block repugnance while avoiding sadism through controlled thresholds. Lexical views especially mirror how we value excellence in other domains. Variable-value (4) is borderline A/B - elegant but vague about diminishing rates. 

  Person-affecting (5) drops to Tier B. While important for non-identity insights, its inability to compare across possible populations is fatal for policy contexts. Averaging (1) is clearly C-tier - its endorsement of sadism and extinction scenarios makes it pedagogically useful only as a warning. Acceptance (6) is also C-tier; calling repugnance "non-repugnant" undermines the whole dilemma.

  My forced bet is on lexical superiority. Its structural blocking of quality-quantity trade-offs at extremes feels right, much like how we value masterpieces over doodles. But the transition problem keeps me up at night - exactly where does "barely worth living" become "lexically inferior"? That boundary seems unavoidably arbitrary.

  The user's students likely struggle with hidden trade-offs between theoretical virtues. I'll highlight how avoiding one paradox often creates another, and why some costs are worth bearing. The key is showing that population ethics isn't about finding perfect answers, but about responsibly navigating unavoidable tensions.
answer: |-
  ### Step 1: Evaluation Criteria  
  A successful population axiology must satisfy four core demands:  
  1. **Coherence with robust normative intuitions** – It must avoid *both* the repugnant conclusion (RC) *and* the sadistic conclusion (preferring adding lives with negative welfare over positive ones). Theories sacrificing one for the other are unstable.  
  2. **Non-identity resilience** – Must explain duties to future generations without presupposing fixed identities (e.g., why creating a miserable child is wrong even if no *particular* person is harmed).  
  3. **Theoretical parsimony** – Avoids ad hoc thresholds or arbitrary parameters unless justified by deeper principles. Over-engineering invites new paradoxes.  
  4. **Reflective equilibrium** – Survives scrutiny under idealized reasoning (e.g., scale-invariance, transitivity) rather than relying on unexamined intuitions.  
  *Added criterion*: **Positive asymmetry** – Captures the moral asymmetry between creating happy lives (merely good) and avoiding unhappy lives (urgently obligatory).  

  ---

  ### Step 2: Tier List  

  #### **Tier A: Live Research Programs**  
  - **Lexical/Threshold Views (3)**: Directly blocks RC by asserting lexical superiority of high-quality lives. Avoids sadism by setting welfare floors. Strengthened by Parfit’s later "imprecisionist" refinements. *Condition*: Requires non-arbitrary grounding for thresholds (e.g., capabilities or objective goods).  
  - **Critical-Level Views (2)**: Elegantly balances quantity/quality via fixed positive welfare thresholds (e.g., Blackorby et al.). Defuses RC and sadism simultaneously. *Condition*: Must justify the critical level without circularity (e.g., linking it to personhood thresholds).  
  - **Variable-Value Views (4)**: Diminishing marginal value of additional lives preserves quality emphasis while accommodating large populations. Flexible under reflection. *Condition*: Requires principled diminishing-rate functions (not curve-fitting).  

  #### **Tier B: Mortally Wounded**  
  - **Person-Affecting Restrictions (5)**: Illuminates non-identity problems but collapses in *different-number comparisons* (e.g., cannot condemn creating a miserable population if no existing person is harmed). Sacrifices coherence for individualism—fatal for population ethics.  
  - **Averaging (1)**: Implodes into sadism (e.g., prefers adding a tortured child to a happy population if it raises the average). Ignores total welfare gains; violates Pareto principles. Pedagogically useful only to show *why* averaging fails.  

  #### **Tier C: Cautionary Tales**  
  - **Acceptance (6)**: Huemer’s "bite the bullet" trivializes moral stakes (e.g., denies the badness of a dust-speck catastrophe). Undermines the project of seeking reflective equilibrium—assigned solely to provoke debate.  

  ---

  ### Step 3: Commitment  
  **Family Bet: Lexical/Threshold Views**  
  **Strongest Reason**: Lexical superiority structurally blocks *all* quality-quantity trade-offs at the limit (unlike critical-level, which permits RC-like outcomes if critical levels are low). It mirrors how we value excellence in other domains (e.g., art, knowledge), avoiding repugnance without inviting sadism.  
  **Worst Objection**: The **transition problem**—determining where/whether a sharp lexical threshold exists. Is there a welfare level *W* such that one life at *W*+ε outranks any number at *W*? This risks arbitrariness or implausible discontinuities.  

  ---

  ### Reasoning for Pedagogy  
  The tiering prioritizes theories that:  
  - Resolve RC *without* creating worse paradoxes (e.g., lexical avoids sadism; critical-level balances trade-offs).  
  - Engage non-identity organically (lexical/critical-level condemn creating low-welfare lives regardless of identity).  
  - Minimize free parameters (e.g., rejecting variable-value’s curve-fitting).  
  - Demand reflective depth: Lexical views force students to confront *why* some lives might be incomparably valuable—a question that outlasts formal axioms.  

  Tier B/C views teach *costs*: Person-affecting restrictions show the dead end of individualism; averaging and acceptance reveal the perils of ignoring total welfare or dismissing intuition.
