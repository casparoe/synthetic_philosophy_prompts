prompt: |-
  I produce a small podcast on decision theory and rational agency, and our next guest is a decision theorist best known for developing and defending functional decision theory — the view that a rational agent should treat its choice not as a physical act but as the output of a fixed mathematical decision function, asking which output of that very function would yield the best outcome, in contrast to causal decision theory's question about which act causes the best outcome and evidential decision theory's question about which act would be the best news to learn one performed. The episode will concentrate on the pair of cases his school treats as its signature wins over both classical rivals at once: counterfactual mugging, in which a predictor with a good model of you flipped a fair coin before you existed, simulated you in the branch where the coin landed tails and asked the simulation for $100, and now, the coin having in fact landed tails, appears in person to collect — functional decision theory pays, while causal decision theory refuses, since the money at stake in the other branch is causally unreachable; and XOR blackmail, in which an extortionist who knows whether you have a damaging secret sends you a demand letter under exactly one of two conditions — you have the secret and she predicts you will refuse, or you lack it and she predicts you will pay — so that an agent who refuses receives only bluff letters and an agent who pays receives only real ones; functional decision theory refuses, while evidential decision theory, moved by the evidential tie between paying and being secret-free, pays. Together the cases are advertised as doing what neither classical theory can: getting the mugger and the blackmailer right simultaneously.

  Draft eight to ten interview questions that go beyond having him restate the view, and for each question include a follow-up keyed to the answer he is most likely to give. The following coverage is mandatory:

  1. At least one question on whether the pairing of these two cases is a genuine constraint on a theory or a conjuring trick — that is, whether there is any independent motivation for paying the mugger while stiffing the blackmailer that is not simply reverse-engineered from those verdicts, or whether any two cases can be arranged to make a preferred theory win twice. The likely reply is that the cases track a principled asymmetry — the mugger's setup is unconditional, the blackmailer's letter is conditioned on your predicted policy — so the follow-up should press on what, beyond intuition, licenses treating that asymmetry as the deep one rather than an artifact of how the cases were built.

  2. At least one question on the notion of dependence itself: what makes a prediction or simulation of me something my decision depends on in the relevant sense, when there is no causal link and the simulated episode may have run before I chose? He will likely answer that the simulator and I compute the same decision function, so the function's output is the common variable. The follow-up should ask about approximations: a predictor that models me with, say, eighty-five percent fidelity, or that simulates a cheaper, coarser version of my deliberation — where functional dependence fades out, and whether the theory supplies a non-arbitrary cutoff or leaves it to intuition.

  3. At least one question on self-locating uncertainty inside the mugging: when the collector appears, I cannot tell whether I am the original agent or the simulated copy from the other branch, so the theory seems to need credences over centered worlds — and it is not obvious whether that anthropics layer is available without smuggling back the evidential reasoning functional decision theory claims to supersede. If he answers that the agent should reason from a pre-simulation, updateless standpoint in which the location question never arises, the follow-up should ask what licenses ignoring information the agent plainly has, and how that differs from ordinary evidential conditioning.

  4. At least one question on blowback and the line between mugging and blackmail. Paying the mugger looks like advertising, to every predictor able to recognize functionally decisive policies, that you can be harvested with fair-coin stories; refusing the blackmailer looks principled only if the criterion separating the two is sharp. His likely reply is the policy-conditioning criterion above. The follow-up must present him with an invented intermediate case: an extortionist who, with probability nine-tenths, sends demand letters regardless of predicted response, and with probability one-tenth, sends them only to predicted payers. Ask him to walk through what functional decision theory recommends, whether the recommendation changes continuously as the mixing parameter slides from pure mugging to pure blackmail, and what in the theory, rather than in his intuitions, fixes the verdict in the middle.

  5. At least one question about whether functional decision theory currently names a well-defined theory at all, given that its central operation — evaluating what the decision function would have output otherwise — runs on logical counterfactuals, a notion without an accepted formal definition. If he answers that approximate methods suffice for real agents, the follow-up should ask which of the theory's celebrated verdicts survive the approximation, and whether the clean two-case case for the view depends on the exact notion the approximation replaces.

  6. At least one final question on falsifiability: whether there is any case, intuition pump, formal result, or empirical finding whose verdict against functional decision theory he would accept as counting toward its abandonment — for instance, verdicts in transparent Newcomb-style cases where the theory has you act for the sake of counterfactual selves who never existed and against what is visibly in front of you — or whether the framework is structured so that every apparent counterexample can be redescribed as a misapplication of it, and if so, why that should not worry a theorist who wants to claim normative authority over CDT and EDT.

  Keep the register technically serious — assume listeners know Newcomb's problem, the smoking lesion, and the causal/evidential distinction — and avoid questions about biography, motivation, or how he got into the field.
reasoning: |-
  We are drafting 8-10 interview questions with follow-ups for a decision theorist known for Functional Decision Theory (FDT). The focus is on two signature cases: Counterfactual Mugging and XOR Blackmail. The questions must go beyond restating the view and cover the six mandatory points. We assume a technically serious register and avoid biographical questions.

  We structure the questions to cover:

  1. The pairing of the two cases: Is it a genuine constraint or a conjuring trick?
  2. The notion of dependence: What makes a prediction/simulation something the decision depends on?
  3. Self-locating uncertainty in the mugging case: How does FDT handle it without evidential reasoning?
  4. Blowback and the line between mugging and blackmail: Present an intermediate case.
  5. The well-definedness of FDT: Logical counterfactuals and approximations.
  6. Falsifiability: Is there any evidence that could falsify FDT?

  We'll create 8-10 questions, ensuring that each mandatory point is covered by at least one question (with follow-up). We'll add 2-4 more questions to round out the interview, possibly on related aspects of FDT.

  Let's list the questions:

  1. **On the pairing of cases (mandatory 1):**
     - Question: Functional Decision Theory is often advertised by its simultaneous success in Counterfactual Mugging and XOR Blackmail, paying in the former and refusing in the latter. But critics might argue that these two cases are cherry-picked to make FDT look good. What independent motivation, beyond the verdicts in these cases, can you offer for why a rational agent should pay the mugger but refuse the blackmailer? 
     - Likely answer: The asymmetry lies in the unconditional nature of the mugger's setup (the simulation occurs regardless of your decision function) versus the blackmailer's conditioning on your predicted policy. The mugger's scenario is about a fixed decision function being evaluated in both branches, while the blackmailer's letter is sent only under specific conditions of your policy.
     - Follow-up: But isn't that asymmetry itself a feature of how these cases are constructed? What prevents an opponent from building a pair of cases that reverse the verdicts, by making the mugging conditional and the blackmail unconditional? How does FDT avoid being reverse-engineered to win arbitrary pairs?

  2. **On the notion of dependence (mandatory 2):**
     - Question: At the core of FDT is the idea that a rational agent should consider their decision as the output of a fixed mathematical function. But in real-world situations, predictors are imperfect. What if the predictor uses a model with 85% fidelity to your actual decision function? Or if they simulate a coarser, cheaper version of your reasoning? At what point does the functional dependence break down? 
     - Likely answer: The theory requires that the predictor is modeling the same decision function, so if the model is approximate, the functional dependence is only approximate. The agent should then consider the expected utility over the possible outputs of the model.
     - Follow-up: But if we allow approximations, doesn't that make the verdicts in the two signature cases fragile? For instance, in Counterfactual Mugging, if the predictor's simulation is only 85% accurate, might FDT then recommend not paying? And in XOR Blackmail, if the extortionist's model is coarse, might it flip the recommendation? How does FDT provide a non-arbitrary cutoff for when the model is "close enough"?

  3. **On self-locating uncertainty (mandatory 3):**
     - Question: In Counterfactual Mugging, when the collector appears, the agent might be uncertain whether they are the original or the simulation. This seems to require assigning credences over centered worlds. But FDT is often presented as updateless, avoiding evidential conditioning. How does FDT handle this self-locating uncertainty without smuggling in EDT-like reasoning?
     - Likely answer: The agent should reason from the pre-simulation, updateless perspective. The decision function is evaluated before the coin flip, so the agent doesn't condition on being in a particular branch. The function commits to a policy for both branches.
     - Follow-up: But in the actual situation, the agent has the information that they are in the tails branch (because the collector is here). If we ignore that information, aren't we violating the total evidence principle? How is this updateless reasoning different from EDT, which also conditions on the total evidence?

  4. **On blowback and the line between mugging and blackmail (mandatory 4):**
     - Question: FDT draws a sharp line between Counterfactual Mugging (pay) and XOR Blackmail (refuse) based on whether the demand is conditioned on the predicted policy. But consider a hybrid extortionist: with 90% probability, they send demand letters unconditionally (like a mugger), and with 10% probability, they condition on your predicted policy (like a blackmailer). What would FDT recommend? And does the recommendation change continuously as we adjust the mixing parameter?
     - Likely answer: The agent should compute the expected utility by considering both possibilities. The recommendation might be to pay with some probability or to pay only if the unconditional part dominates. But the sharp criterion in pure cases might blur in the hybrid.
     - Follow-up: In the hybrid case, if FDT recommends a mixed strategy or a weighted decision, how does that square with the theory's commitment to a fixed decision function? And if the hybrid case requires a different kind of reasoning, doesn't that undermine the clean separation in the pure cases?

  5. **On the well-definedness of FDT (mandatory 5):**
     - Question: FDT relies on logical counterfactuals: evaluating what the decision function would have output in different circumstances. But logical counterfactuals lack an accepted formal definition. How can FDT claim to be a well-defined theory without one? 
     - Likely answer: We can use approximate methods for real agents, such as considering what the function would output in similar possible worlds, or using proof-based methods in logical uncertainty.
     - Follow-up: But in the two signature cases, the verdicts are derived using exact logical counterfactuals. If we replace them with approximations, do the verdicts still hold? For example, in XOR Blackmail, if the extortionist uses a model that is not exactly your decision function, might FDT recommend paying? And if so, doesn't that mean the clean case for FDT collapses without the exact notion?

  6. **On falsifiability (mandatory 6):**
     - Question: Some critics argue that FDT is structured to be unfalsifiable: every apparent counterexample can be redescribed as a misapplication of the theory. Is there any kind of evidence that you would accept as counting against FDT? For instance, in a transparent Newcomb-style problem where the predictor's mechanism is fully visible and the agent can see that their choice doesn't causally affect the prediction, FDT still recommends one-boxing. But what if we set up a case where one-boxing clearly leads to a worse outcome? Would that falsify FDT?
     - Likely answer: FDT is a normative theory, so empirical outcomes don't directly falsify it. But if there were a case where FDT's recommendation was clearly irrational, that would count against it. However, the defender might argue that such a case hasn't been found.
     - Follow-up: But what if we construct a case where FDT recommends an action that is visibly self-defeating? For example, in a case where the predictor punishes agents who use FDT. Wouldn't that force FDT to recommend against itself? And if FDT then recommends a different decision theory, doesn't that undermine its normative authority?

  Now, we need 2-4 more questions to reach 8-10. Possible additional topics:

  7. **On the compatibility with causal structure:**
     - Question: FDT is often contrasted with CDT as being acausal. But in many real-world decisions, causal structure is paramount. How does FDT avoid making disastrous recommendations in cases where causal structure is known and dominant, such as in medical decisions? 
     - Likely answer: FDT can incorporate causal structure by having the decision function consider the causal graph. The functional dependence might align with causal dependence in many cases.
     - Follow-up: But what about cases where functional and causal dependencies come apart? For example, in the Smoking Lesion, FDT agrees with EDT and recommends not smoking. But if we modify the lesion to be causally influenced by the decision function itself (say, the lesion is programmed to activate only if it predicts you will smoke), doesn't FDT then recommend smoking? How does that avoid the charge of being a "smoker's fallacy"?

  8. **On the computational tractability:**
     - Question: FDT requires the agent to compute logical counterfactuals about their own decision function. How is this computationally feasible for bounded agents? 
     - Likely answer: We can use heuristics and approximations. The theory is normative, not descriptive.
     - Follow-up: But if the approximations are necessary, and they sometimes lead to different recommendations than the exact version (as in the signature cases), how can we trust the normative force of FDT? Doesn't the gap between the ideal and the real undermine the theory?

  9. **On the normative basis:**
     - Question: Both CDT and EDT have clear normative foundations: CDT maximizes expected utility relative to a causal model, and EDT relative to an evidential one. What is the normative foundation for FDT? Is it maximizing expected utility under a different type of dependency, and if so, how is that dependency justified as rational?
     - Likely answer: FDT is about controlling the logical consequences of the decision function. The foundation is that an agent should care about the outcomes that depend on the output of their decision function, even if there's no causal link.
     - Follow-up: But why should an agent care about logical consequences? In the mugging, why should the original agent care about the simulated version? Isn't that a form of altruism towards a copy? And if so, how is that justified as rational self-interest?

  10. **On the scope of the decision function:**
      - Question: How does FDT define the decision function? Is it the entire algorithm the agent uses to make decisions, or a specific part? And how does that handle cases where the agent is part of a larger system, such as in multi-agent interactions?
      - Likely answer: The decision function is the mapping from the agent's knowledge and inputs to an action. In multi-agent settings, we might need to consider game theory and fixed points.
      - Follow-up: But if the decision function includes the entire algorithm, then in a multi-agent scenario, doesn't that require the agent to simulate other agents who are also simulating them? How does that avoid infinite regress?

  We have 10 questions. We can trim if needed, but 10 is acceptable.

  We'll now write the questions and follow-ups in an interview format.
answer: |-
  ### Interview Questions on Functional Decision Theory

  #### 1. **Case Pairing: Constraint or Conjuring Trick?**  
  *Question:* FDT’s two-signature-case pitch—paying in Counterfactual Mugging (CM) but refusing in XOR Blackmail (XB)—arguably forces a dilemma where rivals fail. But is this pairing a *substantive constraint* on decision theory, or a *rhetorical trap*? What *non-circular principle* (beyond the verdicts themselves) justifies treating CM’s unconditional simulation and XB’s policy-conditioned letter as the pivot between paying and refusing?  
  *Likely Answer:* The asymmetry is principled: CM’s setup doesn’t depend on your *actual* decision, only your function’s output across branches, while XB’s letter is sent *because* of your predicted policy. Paying in CM upholds the function’s cross-branch coherence; refusing in XB avoids incentivizing exploitative conditioning.  
  *Follow-up:* Why is "policy-conditioning" the *deep* asymmetry, rather than an artifact of how these cases were engineered? For instance, if we rebuilt CM so the simulation *only runs if you’d pay*, making it policy-conditioned, FDT would refuse—but then the "win" over CDT/EDT vanishes. Doesn’t this show the asymmetry is reverse-engineered to favor FDT?

  #### 2. **Functional Dependence and Approximation**  
  *Question:* FDT treats a predictor’s simulation of you as "functionally dependent" if it computes the *same* decision function. But real predictors use coarse approximations (e.g., 85%-fidelity models or neural nets). At what *threshold of inaccuracy* does functional dependence break down? Does FDT supply a formal criterion, or must we defer to intuition?  
  *Likely Answer:* Dependence is graded. We maximize expected utility over the predictor’s *likely inferences* about our function. Low-fidelity models weaken dependence, shifting recommendations toward causal dominance.  
  *Follow-up:* If fidelity is continuous, shouldn’t FDT’s verdicts *smoothly morph*? In a 60%-fidelity CM, FDT might refuse—undermining the "clean win" over CDT. Doesn’t this force FDT into a dilemma: either accept arbitrariness in thresholds, or concede its flagship cases rely on idealization?

  #### 3. **Self-Locating Uncertainty in Counterfactual Mugging**  
  *Question:* When the mugger appears, I know the coin was tails, but I’m uncertain if I’m the original or the simulation. FDT resolves this via "updateless" reasoning—ignoring indexical information. But isn’t this covertly evidential? After all, EDT *also* ignores causal paths by conditioning on total evidence.  
  *Likely Answer:* Updatelessness isn’t evidential; it evaluates the *entire decision function* pre-coin-flip. The function commits to an output *for both branches*, so indexical uncertainty never arises.  
  *Follow-up:* But the agent *has* the information "I’m in the tails branch now." If FDT discards this, how is it not violating Bayesian norms? And if we *do* incorporate it (e.g., credences over centers), doesn’t that reintroduce EDT-style reasoning FDT claims to supersede?

  #### 4. **Blowback and the Mugging-Blackmail Spectrum**  
  *Question:* Paying in CM risks signaling to predictors that you’re FDT-compliant, inviting harvests. Refusing in XB avoids this, but only if the policy-conditioning criterion is sharp. Suppose an extortionist blends strategies: with 90% probability, they send demands unconditionally (mugger-style); with 10%, they condition on predicted payment (blackmailer-style). What does FDT recommend?  
  *Likely Answer:* FDT evaluates the *mix*. If the unconditional component dominates, pay; if policy-conditioning dominates, refuse. Exact thresholds depend on weights and payoffs.  
  *Follow-up:* As we slide the mixing parameter from 100% mugger to 100% blackmailer, FDT’s recommendation discontinuously flips—say, at 50%. What *in the formalism*, not intuition, justifies this cutoff? If it’s continuous (e.g., probabilistic payment), doesn’t that collapse FDT’s categorical distinction?

  #### 5. **Logical Counterfactuals and Well-Definedness**  
  *Question:* FDT requires logical counterfactuals: "What *would* my decision function output in a non-actual scenario?" Yet no consensus formalization exists. Does this mean FDT isn’t yet a defined theory—just a heuristic?  
  *Likely Answer:* We use *approximations* (e.g., logical induction, proof-based priors). Real agents needn’t perfect counterfactuals to act FDT-adjacent.  
  *Follow-up:* But in CM and XB, exact logical counterfactuals deliver FDT’s wins. If we swap in approximations, do verdicts hold? For example, if XOR Blackmail’s extortionist uses a bounded proof-system, FDT might mispredict her model and pay—matching EDT’s "error." Doesn’t this imply FDT’s case rests on an idealized notion it can’t ground?

  #### 6. **Falsifiability and Normative Authority**  
  *Question:* CDT and EDT face clear counterexamples (e.g., Newcomb’s for CDT, Smoking Lesion for EDT). Is FDT falsifiable? What *could* count as evidence against it—say, a transparent Newcomb variant where FDT one-boxes but loses, or a case where it recommends "sacrificing" for a counterfactual self that never existed?  
  *Likely Answer:* FDT is falsifiable if it ever recommends *dominated* actions (e.g., paying when refusal yields higher utility unconditionally). But no such case exists; apparent failures misapply FDT.  
  *Follow-up:* But if every counterexample is dismissed as "misapplication," isn’t FDT unfalsifiable? If a predictor punished FDT agents *because* of their decision function, FDT might recommend masquerading as CDT—undermining its own authority. Why isn’t this a self-defeat?

  #### 7. **Temporal Asymmetry in Mugging**  
  *Question:* In CM, the simulation runs *before* you exist. FDT says you should pay to "cooperate" with your past simulation. But why care about a *past* counterfactual copy? Isn’t this temporally inverted relative to standard rational self-interest?  
  *Likely Answer:* Time isn’t relevant; functional dependence is logical. Your function’s output in the simulation branch affects utility *now*, so you control it retroactively.  
  *Follow-up:* But if I’m the original, paying helps a *past* simulation that already ceased existing. How is this not sunk-cost reasoning? If functional dependence transcends time, why not pay a "mugger" who *simulates you after* your death?

  #### 8. **CDT/EDT as FDT-Optimal?**  
  *Question:* Some argue CDT agents outperform FDT agents in evolutionary competition (e.g., by defecting in CM and avoiding muggings). Could FDT endorse *switching* to CDT in predictor-rich environments?  
  *Likely Answer:* No—FDT agents accept short-term mugging losses to maintain a "cooperative" function, which pays off in other games (e.g., Prisoner’s Dilemma against similar agents).  
  *Follow-up:* But if an FDT agent *knows* it faces only CM-like muggings and no cooperation games, wouldn’t FDT recommend *self-modifying* into CDT to avoid exploitation? Doesn’t that imply FDT isn’t universally binding?

  #### 9. **Subjunctive Robustness in Blackmail**  
  *Question:* In XB, FDT refuses because paying *causes* the blackmailer to target you. But what if the blackmailer’s model is noisy? If paying only *weakly* correlates with future targeting, does FDT’s refusal weaken?  
  *Likely Answer:* Yes—the strength of functional dependence matters. Weak correlation shifts toward EDT (pay if the secret is likely absent).  
  *Follow-up:* Doesn’t this make FDT’s verdict in the "pure" XB case fragile? And if we add even minor noise, FDT blends into EDT—suggesting the "signature win" relies on artificial determinism.

  #### 10. **FDT and Anthropic Coordination**  
  *Question:* In multiverse setups (e.g., quantum branches), FDT treats copies as "functionally identical" and coordinates with them. But if copies diverge (e.g., due to chaotic dynamics), does FDT still require coordination?  
  *Likely Answer:* Divergent copies aren’t functionally identical, so no. Coordination applies only to exact function-matches.  
  *Follow-up:* But if divergence is gradual (e.g., 99.9% similarity), FDT must arbitrarily threshold "sameness." Why isn’t this a fatal vagueness—especially when CM/XB assume *perfect* similarity?

  ---  
  *Rationale for Coverage*:  
  - Questions 1, 4, 7, and 9 address the asymmetry/blowback/motivation (mandatory 1, 4).  
  - Questions 2, 5, and 10 cover dependence/approximation (mandatory 2, 5).  
  - Question 3 tackles self-locating uncertainty (mandatory 3).  
  - Question 6 confronts falsifiability (mandatory 6).  
  - All questions target FDT’s foundations, avoiding rehashing basics. Register assumes fluency with Newcomb/CDT/EDT.
