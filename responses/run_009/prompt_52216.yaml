  Alright, let's tackle this user request. They want a structured framework for evaluating decision theories under ambiguity, specifically setting desiderata before diving into theories. The user is clearly well-versed in the Ellsberg paradox and its implications, signaling they're likely an academic or advanced student in decision theory or behavioral economics. 

  First, I need to unpack their core demands: they want desiderata that are both comprehensive and contentious-aware. The epistemic note is crucial here—they insist on demarcating settled facts (like Ellsberg inconsistencies) from open debates (like dynamic consistency). This isn't just a literature review; it's a critical tool for their own research.

  The five specified requirements are smartly chosen. For (i), the tension between vindicating vs. correcting choices is fundamental. I recall money-pump arguments are nuclear in rationality debates—any theory endorsing ambiguity aversion must disarm them. But the user also wants the "why" behind persistent errors if a theory takes that route. 

  Requirement (ii) about ambiguity vs. compound risk is subtle. The key is experimental: if subjects treat physical mixtures differently than unknown probabilities, a theory must reflect that. Second-order models often fail this by reducing ambiguity to risky lotteries. 

  For (iii), framing and domain effects are behavioral landmines. Ambiguity aversion flipping to seeking in losses? That's prospect theory territory. A good theory must explain context-dependence without being ad hoc. 

  Requirement (iv) demands a non-circular ambiguity measure. Many papers define ambiguity as "whatever the agent avoids"—that's tautological. Operationalizing it (e.g., via dispersion of priors) is tough but essential. 

  And (v), dynamic choice, is the tripwire. The Machina-Schmeidler critique looms large here: you can't have ambiguity aversion, dynamic consistency, and consequentialism together. The user explicitly wants me to pick a side. I lean toward sacrificing consequentialism—real agents care about *when* they resolve uncertainty—but I'll present all legs of the trilemma as live options. 

  Beyond the listed items, I consider adding two implied desiderata: predictive scope (handling beyond-Ellsberg phenomena) and tractability. But the user seems more philosophically oriented, so I prioritize conceptual rigor over applicability. 

  For the scoreboard, SEU is the simplest but fails (i)-(iii); maxmin nails (i)-(ii) but stumbles on (iii)-(v); smooth models handle (iii) better but blur (ii) and (iv). The biggest filter? Probably (ii)—it kills any theory conflating ambiguity with compound risk. 

  Finally, the trilemma in (v) is where battles rage. By flagging it as contested, I avoid taking premature sides while giving the user the conflict map they need. The closing scoreboard must stay criteria-focused—no theory gets a free pass.
answer: |-
  Below is a structured framework for evaluating theories of decision under ambiguity, grounded in settled inconsistencies (Ellsberg paradoxes) and organized around contested desiderata. Requirements are motivated by test cases and theoretical tensions, with clarity on where each demand aligns with specific research programs versus neutral benchmarks.

  ---

  ### **Core Desiderata for Theories of Ambiguity**

  1. **Rational Status of Modal Choices**  
     - **Case**: Ellsberg patterns violate SEU; subjects consistently prefer known probabilities.  
     - **Requirement**: The theory must explicitly state whether these choices are rational (vindicating) or erroneous (correcting).  
       - *Vindicating theories*: Must resolve money-pump/Dutch-book arguments (e.g., showing they rely on contested rationality axioms).  
       - *Correcting theories*: Must explain why biases persist in sophisticated subjects (e.g., cognitive constraints or ecological rationality).  
     - **Non-negotiable?** Yes. *Taking a stand is essential; neutrality here is theoretical evasion.*  
     - **Contested**: Whether ambiguity aversion is a rational response to incomplete information or a cognitive error.

  2. **Non-Collapse into Compound Risk**  
     - **Case**: Subjects avoid ambiguity despite accepting equivalent compound lotteries (e.g., two-stage urns with known second-order probabilities).  
     - **Requirement**: The theory must predict or permit aversion to ambiguity *distinct from* aversion to compound risk. Must accommodate evidence that subjects distinguish "unknown probabilities" from "risky mixtures."  
     - **Non-negotiable?** Yes. *Empirically validated; failures here conflate ambiguity with reducible uncertainty.*  
     - **Contested**: Whether ambiguity is epistemically unique or just complex risk (e.g., second-order models vs. true ambiguity models).

  3. **Context Dependence: Comparatives, Framing, and Sign Effects**  
     - **Cases**:  
       - *Comparative effects*: Ambiguity aversion strengthens when ambiguous/unambiguous options are juxtaposed (Ellsberg).  
       - *Framing*: Description-dependence (e.g., "black-or-yellow" vs. "not red").  
       - *Sign dependence*: Ambiguity seeking in losses (e.g., high-stakes losses with unknown odds).  
     - **Requirement**: The theory must explain how context shifts ambiguity attitudes, without ad hoc adjustments.  
     - **Non-negotiable?** Context sensitivity is settled; *ignoring it undermines predictive power*.  
     - **Contested**: Whether framing effects reflect irrationality or legitimate state-space construction.

  4. **Operational Measure of Ambiguity**  
     - **Case**: Not all uncertainties elicit aversion (e.g., some "unknowns" are treated as risky).  
     - **Requirement**: Ambiguity must be defined *independently* of choice behavior (e.g., via information quality, set of possible priors, or unanimity requirements). Avoid circularity ("ambiguity is what ambiguity-averse agents avoid").  
     - **Non-negotiable?** Yes. *Without this, the theory is unfalsifiable.*  
     - **Contested**: Whether ambiguity is quantifiable (e.g., maxmin’s set size vs. smooth models’ variance).

  5. **Dynamic Consistency Trilemma**  
     - **Case**: An agent refuses a static bet they would accept after learning an event (e.g., in sequential Ellsberg). Satisfying all three is impossible:  
       - *Dynamic consistency*: Plans match future choices.  
       - *Consequentialism*: Choices depend only on current information.  
       - *Non-neutral ambiguity attitudes*: Ambiguity affects decisions.  
     - **Requirement**: The theory must abandon one leg of the trilemma and justify it:  
       - *Sacrifice dynamic consistency*: Accept plan/action divergence (e.g., sophisticated choice with penalties for naiveté).  
       - *Sacrifice consequentialism*: Allow past commitments or unresolved uncertainty to matter (e.g., preference for "untainted" priors).  
       - *Sacrifice non-neutral attitudes*: Revert to SEU after updating (loses ambiguity sensitivity).  
     - **Non-negotiable?** A position is required; *silence implies unawareness of foundational tension*.  
     - **Contested**: Which axiom to drop (e.g., maxmin EU violates dynamic consistency; α-maxmin violates consequentialism).

  ---

  ### **Critical Tensions & Exclusivity**
  - **Strongest Filter**: **Desideratum (ii)** (non-collapse into compound risk) excludes many popular models (e.g., "smooth" second-order EU, risk-parametrized models).  
  - **Trilemma in (v)**: Forces a choice; no theory satisfies all three. *Recommendation: Sacrifice consequentialism* (it oversimplifies how agents value resolution timing).  
  - **Unresolved Conflict**: Desiderata (i) and (v) clash if rationality requires dynamic consistency—vindicating theories must then reject it or reframe Dutch books.

  ---

  ### **Scoreboard of Major Theories**
  *(Evaluated against desiderata, not ranked)*  

  1. **Subjective Expected Utility (SEU) with Error Story**  
     - *(i)* Corrects choices (cognitive bias).  
     - *(ii)* Fails: Attributes ambiguity aversion to misjudging unknowns as compound risk.  
     - *(iii)* Fails: Cannot explain framing/sign effects.  
     - *(iv)* Fails: Ambiguity undefined; "error" is residual.  
     - *(v)* Trivially consistent (no ambiguity attitudes).  

  2. **Maxmin Expected Utility (Gilboa-Schmeidler)**  
     - *(i)* Vindicates choices (rational under multiple priors).  
     - *(ii)* Passes: Ambiguity ≠ compound risk (unique min-expected utility).  
     - *(iii)* Fails: Cannot explain sign reversals (fixed pessimism).  
     - *(iv)* Partial: Ambiguity = size of prior set (operational but coarse).  
     - *(v)* Fails dynamic consistency (e.g., Ellsberg dynamic choices).  

  3. **Smooth Ambiguity (Klibanoff et al.)**  
     - *(i)* Vindicates or corrects (depends on curvature of ambiguity attitude).  
     - *(ii)* Weak spot: Ambiguity aversion ≈ aversion to variance in priors—risks collapsing into compound risk.  
     - *(iii)* Passes: Smooth framing/sign effects via nonlinear weighting.  
     - *(iv)* Partial: Ambiguity = second-order distribution (operational but may blur with risk).  
     - *(v)* Can satisfy dynamic consistency *if* ambiguity attitudes are "separable" (contested).  

  ---

  ### **Settled vs. Contested: Key Boundaries**
  - **Settled**: Ellsberg inconsistencies refute SEU with a single prior; ambiguity aversion is empirical fact; dynamic trilemma is inescapable.  
  - **Contested**: Rationality of ambiguity attitudes (i); whether compound risk reduction is valid (ii); which dynamic axiom to drop (v); whether framing invalidates rationality (iii).  
  - **Neutral Requirements**: (ii) and (iv) are empirically anchored; (iii) is descriptive; (i) and (v) require theoretical commitments.  

  This framework forces theories to confront where they stand on irreconcilable trade-offs—most crucially, between dynamic rigor and behavioral realism. The Ellsberg patterns are the bedrock; a theory’s treatment of the trilemma (v) and non-collapse (ii) reveals its deepest philosophical leanings.
