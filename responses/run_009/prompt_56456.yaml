prompt: |-
  You are to act as a professional epistemologist with deep expertise in self-knowledge, the KK principle, and debates about epistemic access to one's own mind. Think carefully and work precisely; before writing your final answer, briefly brainstorm the space of demands below and note any tensions you spot among them, since part of the deliverable concerns whether the demands can be jointly met.

  I am drafting a paper on luminosity — roughly, the thesis that certain mental states (feeling cold, being in pain, it seeming red to one) are such that, whenever one is in them, one is in a position to know one is in them. Before I engage any particular theory, I want the full specification of what an adequate theory in this area must deliver. Please write that list of desiderata.

  As shared background, the theory must confront the following commitments and puzzles:

  1. The gradual change case: a subject is cooled imperceptibly slowly over the course of an hour. At the start they know they feel warm; at the end they are cold without ever having noticed a change. Safety-theoretic opponents of luminosity reason, in brief and in my paraphrase: if the subject knows they are cold, their belief-forming method must be reliable in nearby counterfactual cases; but for any such case there is a nearby case in which they are just slightly warmer yet in all introspective respects indistinguishable, so the same method would have produced the same false belief; hence in the borderline region they never know they are cold; hence feeling cold is not luminous.
  2. Failures of KK seem compelling in some cases and perverse in others. With a fair lottery, I can know my ticket will lose while seemingly not being in a position to know that I know it. Yet it seems absurd to deny that I know that I am in pain right now, or that I know that I know it.
  3. Introspection is fallible in some respects: blindsight, confabulation under divided attention, sincerely disavowed implicit attitudes, and misremembered motives all suggest the inner eye is not infallible — but the fallibility looks different in kind from the fallibility of perception.

  The deliverables, in order of importance:

  - The desiderata themselves: which cases an adequate theory of luminosity must get right, which distinctions it must respect (being in a position to know versus actually knowing; reliability versus infallibility; constitutive access to one's states versus evidential access to them), and which results and puzzles it must accommodate (the gradual change case, the margin-for-error reasoning, the lottery-versus-pain asymmetry in KK, the fallibility data). Give the motivating case behind each requirement.
  - Mark each desideratum as non-negotiable or as a demand peculiar to a camp — for instance, that any theory must vindicate KK for sensations is a demand of KK-loyalists, and that any theory must validate the safety-theoretic reasoning is a demand of luminosity's opponents — and be explicit about which is which, since the line between a genuine desideratum and a camp prejudice is exactly where the philosophical work is.
  - Flag any subset of the desiderata you suspect is jointly unsatisfiable. In particular, say whether luminosity for sensations, the margin-for-error reasoning, and a safety condition on knowledge can all be held at once; if not, say precisely where the contradiction bites and what, in your view, must be given up.
  - One further case I want built into the spec: an artificial agent whose self-reports about its own internal states are produced by a learned readout — highly reliable in practice, but such that it could easily have been trained to be slightly miscalibrated without any difference detectable from the inside. State whether the desiderata list applies unchanged to such an agent, and whether luminosity for it is hostage to facts about how the reports were formed rather than to the reports' current reliability.
  - Finally, as a brief coda only, score three contenders against the list: a constitutive or inward-access view on which being in the state guarantees access to it, an inner-sense theory on which introspection is a reliable but fallible faculty, and the safety-based denial of luminosity. Keep the weight on the criteria and their motivating cases rather than the scoring, since the scoring leans on knowing the contenders and the criteria are where the thinking is.
