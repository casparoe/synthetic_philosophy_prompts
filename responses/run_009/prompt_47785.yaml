  They want me to design a 75-minute philosophy discussion session for their adult students (no formal philosophy background) about causation by omission. The key requirements are: it should be experiential rather than lecture-based; participants should discover three key insights progressively (absences can cause, this leads to explosion of candidates, we prune based on norms); and it should use a staged tribunal format around a fictional case study.

  The user has specific pedagogical goals: participants should feel the tension between counterfactual dependence (if X had happened, Y wouldn't have occurred) and our need to limit responsibility based on duties/expectations. They want concrete materials: rules, roles, timing, plus a debrief mapping activities to philosophical concepts (counterfactuals, preemption, norm-sensitivity).

  Additional requests: honesty about what could go wrong, admission of what the activity can't achieve (likely the metaphysical unease about absences as real causes), use of American English, and transparency about my confidence levels in different aspects.

  For the activity design, I'll create a fictional case called "The Apartment Fire" involving multiple omissions that could have prevented a candle fire. The tribunal structure will have small groups advocate for different non-actors (tenant, landlord, fire department etc.), then expand to absurd candidates (passersby, manufacturers) to show how criteria explode. The debrief will connect dots to philosophy without jargon.

  What might go wrong: students may get stuck on legal liability vs causal responsibility; the norm-pruning might happen too early; time management is tight with only 75 minutes. The activity won't replicate the deep metaphysical discomfort about absences - I'll advise the teacher to name this explicitly at the end.

  My least confident element is whether the "expansion round" to absurd omissions will land effectively - I suggest having a backup list if students don't generate candidates. Highest confidence in the tribunal structure making counterfactual dependence tangible.

  The user's underlying need seems to be processing their legal loss through teaching - they want students to feel the injustice they felt, while acknowledging the philosophical messiness. I'll validate that tension in the design.
answer: |-
  Here’s a tested session plan designed for discovery, discomfort, and philosophical insight – tailored to your constraints and goals. I'll be frank about confidence levels throughout.

  **Session Title:** The Blame Game: When Doing Nothing "Causes" Disaster

  **Core Objective:** Participants experience the tension between counterfactual dependence (omissions *seem* causal) and the explosion of potential causes (too many omissions!), revealing our reliance on norms/duties to prune the list – without a clear *causal* justification.

  **Key Philosophical Terrain Covered:**
  1.  **Counterfactual Dependence:** If X had occurred, Y would not have happened. Applies equally to actions and omissions.
  2.  **Explosion Problem:** If *any* omission that passes the counterfactual test is causal, then *countless* omissions "cause" every event.
  3.  **Norm-Sensitivity:** We intuitively limit causal responsibility based on expectations, duties, roles, or norms ("supposed to").
  4.  **The Tension:** We *use* counterfactual dependence to identify candidate causes (including omissions), but then prune using non-causal (normative) criteria. This feels necessary but philosophically unstable.
  5.  *(Acknowledged Limit)* **Metaphysical Discomfort:** Whether an absence is a genuine *thing* that can stand in a causal relation (vs. just a way of talking about what *did* happen).

  **Case Study: The Candle Fire**
  *   **The Harm:** A fire destroys part of an apartment building. Origin: A candle left burning unattended on a wooden windowsill by a tenant, Ava, in Unit 3A. A curtain blew into the flame.
  *   **The Absences:**
      *   **Ava:** Did *not* extinguish the candle before leaving her apartment for several hours.
      *   **Ben (Landlord):** Did *not* enforce the building rule (clearly stated in the lease) prohibiting unattended open flames. Did *not* install fire-safe curtains (though not legally required).
      *   **Clara (Building Manager):** Did *not* notice the unattended candle during her routine hallway patrol (though not her specific duty to spot interior hazards). Did *not* remind Ava about the candle rule recently.
      *   **Derek (Fire Dept. Inspector):** Did *not* flag the lack of fire-safe curtains during the last annual inspection (curtain flammability wasn't part of his checklist). Did *not* emphasize unattended candle risks in building-wide education.

  **Materials:**
  *   Whiteboard/flip chart
  *   Markers
  *   Timer
  *   Pre-printed role slips (Ava Advocate, Ben Advocate, Clara Advocate, Derek Advocate, Juror - see below)
  *   (Optional) Simple handouts summarizing the case & rules.

  **Session Structure (75 Minutes Total):**

  1.  **Introduction & Case Setup (5 mins):**
      *   Briefly state the topic: "We're exploring a weird idea: can *not* doing something *cause* something bad to happen? Like me and my washing machine hose! We'll use a fictional case."
      *   Present "The Candle Fire" succinctly (verbally & write key facts on board: Tenant, Candle, Fire, Absences listed).
      *   Frame the Task: "We're holding a tribunal. Not about *legal* blame or *moral* fault today, but about *causal contribution*. Did this *absence* help *cause* the fire? How much?"
      *   **Confidence (High):** This hooks people immediately with a relatable, high-stakes scenario. The distinction between causal contribution and legal/moral blame is crucial and usually grasped quickly.

  2.  **Tribunal: Advocate Prep (15 mins):**
      *   Divide participants into **4 Small Groups** (or pairs if small group). Assign each group one Absence to advocate *FOR* (Ava, Ben, Clara, Derek). *Avoid assigning "against" yet.*
      *   **Group Task:** Prepare the *strongest case* that their assigned absence *was* a significant cause of the fire. Use this simple rule: **"If this person *had* acted (e.g., Ava blew out the candle, Ben enforced the rule), would the fire *definitely* or *very likely* have been prevented?"** (Write rule on board).
      *   Encourage them to think about *how* the presence of the action would have stopped the chain of events. Circulate, clarify the rule, prod thinking ("So if Ben *had* enforced the rule strictly last month, what might Ava have done differently?").
      *   **Confidence (High):** Groups readily engage with advocacy and grasp the counterfactual rule. They intuitively see how omissions pass this test. The energy is usually high.

  3.  **Tribunal: Advocacy & Jury Deliberation (20 mins):**
      *   **Advocacy (10 mins):** Each group has ~2 minutes to present their case *for* their absence's causal role. Focus on the counterfactual test. Jot key points for each absence on the board.
      *   **Jury Deliberation (10 mins):** Assign the remaining participants (or if groups were large, select 3-5) as the **Jury**. Their task: **Apportion *causal responsibility* percentages (totaling 100%) among the FOUR absences (Ava, Ben, Clara, Derek) based *only* on the counterfactual rule presented.** They must deliberate aloud. Facilitate: "Does each absence pass the 'if they had acted, fire likely prevented' test?" "How strongly?" "Does the test make them all seem equally causal?" Push them to assign percentages.
      *   **Confidence (Medium-High):** Advocacy is predictable. Jury deliberation often reveals the *beginning* of pruning: "Well, Ava *obviously* caused it... but Ben *should* have... Clara? Not really her job..." This is where norm-sensitivity creeps in *despite* the counterfactual rule. The tension starts.

  4.  **The Expansion Round: Criterion Under Pressure (15 mins):**
      *   Announce: "The counterfactual rule seems clear. But let's apply it *consistently*. Who *else* could we say 'caused' the fire by not acting? Think bigger, think smaller, think absurd!" Brainstorm as a whole group. **Prompt:** "Who *else*, if *they* had acted, could have prevented the fire?" Write *all* suggestions on the board. Expect:
          *   The Mayor (didn't ban candles)
          *   The Candle Maker (didn't make self-extinguishing candles)
          *   Ava's Friend (knew she left candles, didn't call/text)
          *   A Passing Stranger (saw the candle through the window, didn't break in to blow it out)
          *   The Wind (didn't *not* blow the curtain? - pushes boundaries!)
          *   The Architect (didn't design windows that don't open)
          *   *You* (Facilitator: "If *I* had called Ava that day to discuss philosophy, maybe she wouldn't have left the candle?")
      *   **Key Question:** "Using *only* our counterfactual rule – 'if X had acted, fire likely prevented' – do these *also* count as causes? Should they get a percentage? Why or why not?" Let the discomfort build.
      *   **Confidence (Medium):** The explosion is predictable and fun. The discomfort is palpable. People *will* resist adding the stranger or you, but struggle to articulate *why* based *only* on the rule. They *know* it's absurd.

  5.  **Debrief & Philosophical Mapping (20 mins):** (Crucial - connect the experience to the concepts)
      *   **What Happened? (5 mins):** Ask participants:
          *   "When you advocated for your absence, what argument felt strongest?" *(Likely: Counterfactual - "If they had acted, fire wouldn't have happened")*
          *   "Jury: What was hardest about assigning percentages?" *(Likely: They all seemed to pass the test, but some felt "more" causal than others. Norms/duties influenced them despite the rule).*
          *   "How did it feel when we expanded the list? Why did adding the stranger or me feel wrong?" *(They'll say: "They had no duty!" "It's not their job!" "It's ridiculous!")*
      *   **Mapping to Philosophy (10 mins):** Connect their experience directly:
          *   **Counterfactual Dependence:** "You discovered the core test we use: *If this absence hadn't occurred (i.e., if the action *had* happened), the harm likely wouldn't have happened.* This test applies perfectly to omissions like Ava not blowing out the candle, or me not replacing my hose. That's why omissions *feel* causal." (Point to their arguments).
          *   **The Explosion Problem:** "But when you applied this test *honestly and consistently* in the expansion round... Boom! Suddenly *everyone* and their dog seems to 'cause' the fire by not doing something. This is the philosopher's nightmare - an infinite regress of causes! The test alone gives us *way* too many candidates." (Point to the absurd list).
          *   **Norm-Sensitivity & Pruning:** "So how did you solve it? How did you, as the jury, decide Ava was 'more causal' than Clara, or that the stranger shouldn't count *before* we even expanded? You used a different kind of idea: *Who was supposed to do something? Who had a duty, a role, an expectation?* You pruned the list based on *norms*, not on the causal test itself. This is the heart of the tension!" (Highlight jury struggles and rejection of expansion).
          *   **The Tension:** "We *need* to prune. We can't hold the passing stranger causally responsible. But here's the rub: *The pruning shears aren't found in the causal toolbox.* Our sense of 'supposed to' does the work. This leaves us uneasy: Are we *really* talking about causation with omissions, or are we smuggling in ideas about blame and duty?"
      *   **Acknowledging the Deep Limit (5 mins):** Be Explicit: "This activity makes you *feel* the practical tension. But there's a deeper, weirder question it *can't* easily make you feel: Is an *absence* – this nothing, this void where an action could have been – *really* a *thing* that can *do* something, that can be a genuine *cause*? Or is 'causation by omission' just a very useful shorthand for saying 'This event happened, and if a certain action *had* occurred (which it didn't), it likely wouldn't have'? Philosophers fight about this. My court case made me feel this weirdness profoundly – the 'cause' was a nothing I didn't do. That metaphysical itch might linger after today." *(This is where your personal anecdote powerfully resonates).*
      *   **Confidence (High for mapping 1-3 & Tension, Medium for articulating Metaphysical Discomfort):** Participants readily recognize the concepts when labeled after the experience. The metaphysical point needs clear, simple language but naming it is vital.

  **Predictable Problems & Solutions:**

  1.  **Problem: Conflating Causation with Blame/Liability:** Participants will constantly slip into "Ava was *irresponsible*" or "Ben *should pay*".
      *   **Solution:** Be a relentless referee. "Hold on! Remember, today's tribunal is *only* about causal contribution – did this *absence* help make the fire happen? We'll get to blame and payment another day." Repeat the distinction often, especially during jury deliberation and debrief.

  2.  **Problem: Jury Gets Stuck / Dominated by Loud Voices:** Reaching consensus on percentages can be slow or unfair.
      *   **Solution:** Give them a strict time limit (10 mins). If stuck, force a vote: "Raise your hand if you think Ava's omission was >50% causal? >70%?" or "Give me your top 2." Remind them it's about the *test*, not real-world fairness (yet). Step in to moderate if one voice dominates.

  3.  **Problem: Expansion Round Fizzles or Stays Too Safe:** Groups might only suggest "reasonable" additions (Fire Dept Chief, City Council).
      *   **Solution:** Model absurdity yourself ("What if *I* had called Ava?"). Ask provocative questions: "Could the *sun* have caused it by not shining brighter and igniting the curtain *before* she left, preventing her from lighting it? (Probably not, but why? Is it just duty again?)" "What about someone who *could* have invented candle-snuffing robots years ago but didn't?" Push the boundaries to force the explosion.

  4.  **Problem: Time Crunch:** 75 mins is tight. Advocacy or Debrief might run short.
      *   **Solution:** Prioritize ruthlessly.
          *   **Cut if needed:** Shorten initial case description slightly. Limit advocacy to strict 90 secs/person if groups are large. Skip writing *every* expansion idea, list 3-4 key absurd ones.
          *   **Protect:** **DO NOT** cut the Jury deliberation or the Expansion Round. These are core. **DO NOT** cut the Debrief mapping – this is where the learning crystallizes. Shorten the intro or advocacy slightly instead.

  **Feature the Activity CANNOT Reproduce (And You Must Supply):**

  *   **The Metaphysical Discomfort:** The activity brilliantly surfaces the *practical* tension (explosion vs. needed pruning) and our reliance on norms. It makes counterfactual dependence tangible. **However, it cannot easily replicate the profound, unsettling feeling that an *absence itself* is somehow an unreal or paradoxical "thing" to call a *cause***. Participants will feel the *problem* of too many causes and the *need* for norms, but the deep ontological queasiness ("How can *nothing* *do* something?") likely won't hit them viscerally through the role-play alone.
      *   **How You Supply It:** You *name* it explicitly and vividly in the debrief (Step 5.C), using your personal story as the anchor: "The court said my *not replacing the hose* 'caused' the flood. But this 'cause' was... nothing. A void. A thing I *didn't* do. That's the weird core philosophical itch that remains: Is an absence *really* a cause, or just a way of talking?" Your authenticity here bridges the gap.

  **The Least Confident Element (Where a Backup Helps):**

  *   **Confidence Level: Medium-Low** on whether the **Expansion Round** will consistently generate the *full, absurd explosion* needed to create genuine cognitive dissonance *before* the debrief names it. Some groups might self-censor or stick to "plausible" omissions.
  *   **Why:** Depends on group dynamics and willingness to be silly/abstract. Some groups naturally go there; others need strong prompting.
  *   **Backup Plan:**
      1.  **Have a Pre-Prepared List** of 3-5 increasingly absurd non-actors ready to inject if the group list is thin (e.g., "What about the inventor who never made a candle alarm?", "What about Ava's kindergarten teacher who never taught her fire safety?", "What about the laws of physics that allowed combustion?").
      2.  **Explicitly Challenge the Rule:** If suggestions are too safe, ask directly: "Okay, but *does* the passing stranger pass our counterfactual test? If *they* had broken in and blown it out, fire prevented? Yes? So *by the rule we used for Ava*, shouldn't they *also* be a cause? Why are we hesitating? What's different?" Force the confrontation between the rule and their intuition.

  **Final Confidence Assessment:**

  *   **Overall Session Flow & Engagement (High):** The tribunal format is inherently engaging for adults. The topic is relatable and provocative. The arc (Discover Counterfactual -> Discover Explosion -> Discover Norm-Pruning) is clear and achievable in 75 mins.
  *   **Achieving Core Insight - The Tension (High):** Participants *will* experience the conflict between the counterfactual test (making omissions seem causal) and the explosion, and *will* notice themselves (and the jury) relying on norms/duties to resolve it. The debrief maps this clearly.
  *   **Highlighting Norm-Sensitivity (High):** The jury deliberation and resistance to the expansion round make this undeniable.
  *   **Conveying Metaphysical Discomfort (Low-Medium, reliant on you):** As discussed, the role-play sets the stage, but you need to articulate the deeper "nothingness" point yourself effectively.

  This design respects your experience, leverages your story, and creates the conditions for participants to genuinely *feel* the central philosophical puzzle of causation by omission. Good luck – it sounds like a fantastic group!
