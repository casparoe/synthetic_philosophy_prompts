prompt: |-
  I run a little forecasting pool out of the philosophy department — me, a couple of historians, and Dana from economics, who is annoyingly good at it and knows it. We put numbers on things and keep score. I teach philosophy of science, so reference classes are supposed to be my department, and after two years of keeping a log of Dana's calls I still can't reverse-engineer the rule she's running. Her record so far: asked whether a colleague's new restaurant survives five years, she gave the national failure rate and wouldn't even hear about the location, which she called an inside view and a waste of everyone's afternoon. For tenure candidates she uses our department's raw rate over the last twenty years and treats the letters as noise. When someone asked how long American primacy would last, she read it straight off the durations of past maritime hegemons — Spanish, Dutch, British — gave a number on the order of a couple of centuries from the mid-1940s, and refused to cut finer than that. But asked whether the EU federalizes by 2100, she declined to give a number at all, said there's no reference class for it that isn't a joke, and that anyone who quotes you a probability there is dressing up a vibe. And when the Ukraine war started she called its duration off the distribution of interstate wars since Napoleon, fat tail and all, and beat the entire pool with it.

  Next month's question is the one I actually care about: will the CCP still be ruling China in 2075? Predict her verdict, number included. Then tell me what rule she's implicitly running — I can see at least a most-specific-class-with-enough-members rule, a durations-for-entities-but-abstain-on-unprecedented-events rule, and some coarsest-pooling version, and they do not agree here, because the candidate classes pull in different directions: Leninist one-party states (several of which died somewhere in the forty-to-seventy-year range), Chinese dynasties if you take the dynastic cycle framing seriously (which puts 2075 comfortably inside the historical range), autocratic regimes generally, and so on. So: which rule fits her track record best, which class does it send her to on this question, and then design me the follow-up question for the pool that would actually split the remaining candidate rules — I want the case where two of them give different numbers. Keep in mind her track record isn't cleanly decisive, so I want your best guess plus an honest account of which of her past calls you're leaning on and which ones strain your story.
reasoning: |-
  Okay, let me unpack this user's query. They're running a forecasting pool and are frustrated by Dana, an economist who consistently outperforms others with her unique approach. The user teaches philosophy of science and wants to reverse-engineer Dana's rules after two years of observation. The core question is predicting whether the CCP will still rule China in 2075, but the deeper need is understanding Dana's methodology to either replicate it or challenge her more effectively.

  First, I need to analyze Dana's track record. Her responses show a pattern: she uses reference classes but avoids cases without historical precedents. For the restaurant, she ignored location specifics and used national failure rates. For tenure candidates, she dismissed recommendation letters and used the department's historical rate. When asked about American primacy, she looked at past maritime hegemons. But for EU federalization, she abstained, calling it unprecedented. The Ukraine war duration was based on historical interstate wars since Napoleon.

  Key patterns emerge: Dana favors historical data over contextual details, avoids predictions without clear precedents, uses quantitative baselines, and prefers duration-based classes for temporal questions. Her abstention on EU federalization suggests she requires a sufficiently large, relevant historical dataset.

  Now, the CCP question in 2075. The user lists possible reference classes: Leninist one-party states (40-70 year lifespans), Chinese dynasties (centuries-long), autocratic regimes generally. These classes conflict. Leninist states suggest possible collapse, dynasties imply stability, autocratic regimes vary widely.

  Given Dana's pattern, she'd likely choose the most specific class with enough data points. Leninist states fit best here—specific to one-party communist systems. Chinese dynasties are too different in context, and autocratic regimes are too broad. Calculating the median duration of Leninist states (excluding PRC) gives about 58 years. From 1949, adding 58 years brings us to 2007, but the question is about 2075. The PRC would be 126 years old then, far beyond the median. Survival probability would be low based on this class.

  For the follow-up question, we need to split between "most specific reference class" and "coarsest acceptable pooling." A question like predicting the lifespan of a new cryptocurrency exchange. "Most specific" would use similar exchanges, while "coarsest pooling" might use all startups. If similar exchanges have a median lifespan of 4 years but all startups last 5 years, Dana's choice would reveal her rule.

  Tensions in Dana's track record: Her use of maritime hegemons for American primacy is broader than her typical specificity. But she might justify it as the only available class for "maritime hegemony." For the Ukraine war, she used a broad historical class but it worked. The EU abstention shows her limits.

  User's deeper needs: They want to outsmart Dana by understanding her rules. They might also be seeking validation of their own philosophical approach against Dana's rigid empiricism. The follow-up question is designed to test Dana's methodology, potentially exposing inconsistencies.
answer: |-
  Based on Dana's track record and the conflicting reference classes for the CCP question, here's my best reverse-engineering of her rule, her predicted verdict for 2075, a tension analysis, and a follow-up designed to split her potential rules:

  **Dana's Implicit Rule (Best Guess):**
  **"Use the most specific, quantitatively defined historical reference class with at least N members (likely N=5-10) that captures the core *structural type* of the entity/event in question. If no such class exists with sufficient data, abstain. Apply the base rate from that class *directly*, without adjustment for unique details ('inside view'). For duration questions, use the empirical distribution (median, survival function) of the class."**

  **Predicted Verdict for CCP in 2075:**
  *   **Class Chosen:** **Leninist One-Party States** (USSR, Eastern Bloc states, Yugoslavia, etc.). This is the most specific structural match to the CCP's governance model.
  *   **Calculation:** Median lifespan of collapsed Leninist states (from founding to collapse) is approximately **58 years** (e.g., USSR: 69 yrs, E. Germany: 41 yrs, Czechoslovakia: 42 yrs, Yugoslavia: 46 yrs, Romania: 42 yrs - rough median). The PRC was founded in 1949. 1949 + 58 = 2007. By 2075, the PRC would be **126 years old**.
  *   **Survival Probability:** Based *only* on the historical survival curve of Leninist states (ignoring CCP's unique features like economic success or nationalism), the probability of a Leninist state surviving beyond 100+ years is **extremely low**. Nearly all collapsed well before this point. USSR (longest-lived major example) collapsed at 74.
  *   **Her Number: ~10-20%.** She'd likely give a range based on the survival function tail. She won't say 0% because the *class itself* existed, proving survival for decades is possible. But she'll emphasize the fat tail is thin past ~80 years based purely on historical data.
  *   **Coarseness:** She'll refuse to differentiate based on China's size, culture, or economic growth, calling these "inside view" factors. She'll dismiss dynastic cycles as structurally incomparable ("pre-modern agrarian empires vs. industrial one-party state") and autocratic regimes generally as too broad ("that lumps Saudi monarchs with military juntas - useless noise").

  **Why This Rule Fits Best & Tensions:**

  1.  **Fits Well:**
      *   **Restaurant:** National failure rate = broad but quantifiable class for "new small business" (ignores location = inside view).
      *   **Tenure:** Department rate = specific, quantifiable class for "tenure candidate *in this department*" (ignores letters = noise).
      *   **Ukraine War Duration:** Interstate wars since Napoleon = defined, quantifiable class for "interstate war" (uses empirical distribution, fat tail included).
      *   **EU Federalization Abstention:** No specific, non-"joke" class exists (HRE? Articles of Confederation? Too few, too different).
      *   **American Primacy Duration:** Past maritime hegemons = specific, defined class for "global maritime hegemon" (ignores nukes, US geography = inside view).

  2.  **Tensions/Strains:**
      *   **American Primacy Class Choice:** "Maritime hegemon" is arguably *less* specific than "Leninist state" is for the CCP. Why not "global superpowers" (includes land powers)? Or "industrialized great powers"? Her choice here leans slightly towards **"coarsest acceptable pooling"** (maritime hegemony is the *defining feature* she anchors on) rather than absolute maximum specificity. This is the biggest strain on the "most specific class" rule. *Leaning:* She focuses on the *core functional attribute* (naval dominance defining global primacy) rather than regime type.
      *   **Ukraine War Duration:** Using wars since Napoleon (200 years) instead of only post-WWII conflicts shows she prioritizes **sample size (N)** and capturing the full distribution (including long wars) over recency or perfect contextual similarity. This supports the "enough members" part of the rule.
      *   **Ignoring PRC Longevity?** The biggest tension *for the CCP question* is whether the PRC's *own* 75-year (by 2024) survival should be included in the class, making it an outlier survivor and potentially shifting the survival curve. Her past record suggests **she excludes the focal instance** (e.g., wouldn't include *this* restaurant in its own failure rate calc, wouldn't include *this* tenure candidate in the dept. rate *before* the decision). The class is defined by *completed* lifespans. Including the PRC (still alive) would be cheating. This makes the probability very low.

  **Follow-Up Question to Split the Rules:**

  We need a question where "Most Specific Reference Class with N>5" (Rule A) and "Coarsest Acceptable Pooling" (Rule B) give *different quantitative answers*, while her other behaviors (abstaining on unprecedented, using durations) are satisfied.

  **Question: "What is the median lifespan, in years, of a cryptocurrency exchange founded after 2017 that reaches a peak daily trading volume exceeding $1 Billion USD?"**

  *   **Why it Splits the Rules:**
      *   **Rule A (Most Specific Class):** Would look for "Cryptocurrency exchanges founded post-2017 w/ >$1B peak daily volume". Examples: FTX (~5 yrs), Celsius (~4 yrs before bankruptcy), Voyager (~4 yrs), BlockFi (~4 yrs), potentially Binance/Coinbase/Kraken (still operating, ~6-7 yrs). *Median lifespan:* **~4-5 years** (based on prominent failures). It has enough members (N=5+ prominent failures).
      *   **Rule B (Coarsest Acceptable Pooling):** Would argue the *core attribute* is being a "financial exchange" or even a "tech startup". "Coarsest acceptable" might be "Financial exchanges" (NYSE: 200+ yrs, LSE: 300+ yrs, CME: 125+ yrs, even failed ones lasted decades) or "Tech Startups" (median lifespan to failure/acquisition ~5-7 years, but high variance). *Median lifespan:* **"Financial Exchanges" = 50-100+ years. "Tech Startups" = ~5-7 years.** Rule B could land on either, but both are significantly higher than Rule A's 4-5 years. The key split is Rule A's much lower number based on extreme specificity.
  *   **Avoids Abstention:** There are enough examples (failed exchanges) to form a specific class (N>5).
  *   **Uses Duration:** Directly asks for a duration metric.
  *   **"Inside View" Ignored:** Dana would ignore the specific tech, founders, or regulations of any exchange, focusing solely on the historical lifespans of the defined class.

  **Prediction for Split:** Dana would likely use **Rule A (Most Specific Class)** and quote a median lifespan of **~4-5 years** based on the FTX/Celsius/Voyager cohort. If she instead uses "Tech Startups" (~5-7 yrs) or especially "Financial Exchanges" (decades), she's leaning towards **Rule B (Coarsest Acceptable Pooling)**. This cleanly separates the two main candidate rules derived from her history. Good luck with the pool – and Dana!
