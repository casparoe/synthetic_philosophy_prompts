prompt: |-
  Quick context before the ask: I teach the giant intro ethics lecture here — around 300 students, four TAs, and final letter grades are ultimately my signature on the line. Our department policy says course grades come from numerical scores, but it doesn't say how the number turns into a letter, and every semester I get the same fight: a student lands at 89.6, the TA emails me asking whether that's an A- or a B+, and I never have a principled answer, just vibes and guilt. It's obviously a sorites problem wearing a registrar's costume — no single tenth of a point can be what flips the letter, and yet some tenth of a point apparently does — but I'm tired of doing freshman-year philosophy of language on a deadline while an actual freshman waits on the email.

  So here's what I want: a decision procedure my TAs can actually run when a score lands in the borderline zone (say, anything within a point of a cutoff), one page they can keep open while grading. It should have questions in an order, what counts as a sufficient answer to each question, and where the procedure terminates with a plain "no bump" versus where it stops and hands the call to me because the remaining question is one of values rather than facts.

  Ground it in what the vagueness literature actually says, but translate honestly. I'm thinking: epistemicism says there IS a fact about where the A-/B+ line is and we just can't know it — what does that counsel, a published sharp cutoff we pretend is the real one? Supervaluationism says the boundary sentences are neither true nor false but the cutoff-in-general structure is fine — what does that counsel, maybe a gap where we resolve cases individually? Degree theories want everything graded rather than cut — but our registrar literally cannot record "0.7 of an A-." Part of what I want the procedure to do is be honest that each theory, operationalized, just relocates the sharp edge somewhere else (if we round, the 89.55 becomes the new battleground), and to say where the TA should notice that and shrug.

  Two constraints the procedure has to respect: (1) whatever it tells us to do has to be defensible to the grade-appeals committee, meaning consistent across students and not obviously arbitrary on its face; and (2) it has to run in the five minutes a TA has before moving on to the next stack. If some step can't be done honestly in five minutes, say so and design around it.

  Then run it on three cases: (a) the 89.6 regrade request from a student who came to office hours all semester; (b) a regrade appeal where re-scoring three exam answers moves a student from 88.9 to 89.4, still below the line, and now they want the borderline procedure triggered again; (c) the TA who thinks the whole procedure is missing the point and wants to grade holistically with no numbers at all, on the theory that numbers create the false precision. Include at least one case where the procedure gives an answer I won't like, and flag every step that's really a judgment call wearing a procedure costume. And tell me what the procedure cannot do — I'd rather know its failure modes now than discover them in an appeal hearing in May.
reasoning: |-
  Okay, the user teaches a large intro ethics lecture with 300 students and TAs handling grading. They're frustrated with borderline grade cases like 89.6 being ambiguous between A- and B+. The department uses numerical scores but doesn't specify how to convert to letters. Every semester, they face the same dilemma without a principled approach, feeling it's a Sorites paradox in disguise. They want a decision procedure for TAs to handle borderline cases (within 1 point of cutoff) that's efficient, defensible, and grounded in vagueness literature.

  The user's explicit request is a one-page flowchart-style procedure TAs can follow in 5 minutes. But deeper needs emerge: reducing emotional labor (guilt/vibes), preventing appeals, maintaining consistency across 300 students, and having philosophical rigor without getting bogged down in theory during crunch time. They also need to protect their authority (signature on grades) while delegating safely.

  Constraints are critical: defensibility to appeals committee (consistency/non-arbitrariness) and time efficiency. The procedure must acknowledge that any system just moves the sharp edge (89.6 vs 89.55) without pretending to solve vagueness.

  Breaking this down:
  - Vagueness theories each suggest different operationalizations:
    - Epistemicism → need an artificial sharp cutoff (e.g., publish rounding rules)
    - Supervaluationism → case-by-case resolution for borderline instances
    - Degree theory → impractical (registrar can't handle partial grades)
  - Must flag value judgments disguised as procedures
  - Must include failure modes upfront

  For the three test cases:
    (a) 89.6 from engaged student – procedure should reward engagement but not override scores
    (b) 88.9 → 89.4 regrade – tests whether "borderline" reactivates after adjustment
    (c) Holistic-grading TA – exposes tension between numerical precision and meaningful assessment

  Design keys:
  - Borderline zone defined upfront (±1 point from cutoffs)
  - Strict sequence: check score → check for errors → consider engagement → no second bumps
  - Only two outcomes: no bump or escalate to professor
  - Time-box each step (e.g., "if can't verify in 2 mins, escalate")
  - For appeals committee: document trail showing consistent application

  Biggest risk: Procedure might feel mechanical when student context tugs at ethics (e.g., case a). Must explicitly state that engagement doesn't alter academic standards – that's a values call only the professor can make if escalated.
answer: |-
  Here's a **Borderline Grade Decision Procedure** grounded in vagueness theory, designed for TAs to execute in <5 minutes. It accepts that vagueness *cannot be eliminated*, only managed consistently. **Key Philosophy**: Epistemicism sets the default rule; supervaluationism handles exceptions; degree theories are acknowledged but impractical.

  ---

  ### **BORDERLINE GRADE PROCEDURE**  
  *(For scores within ±1.0 point of any letter-grade cutoff)*  
  **TIME LIMIT PER CASE: 5 MINUTES MAX**  

  | STEP | QUESTION & CRITERIA                                                                 | ACTION IF "YES"                                                                 | ACTION IF "NO"                                                                 |
  |------|------------------------------------------------------------------------------------|--------------------------------------------------------------------------------|-------------------------------------------------------------------------------|
  | **1** | **"Is the raw score *after* regrades ≥ the cutoff after rounding (e.g., 89.5+ for A-)?**<br>→ *Use standard rounding: 0.5+ rounds up.*<br>→ *Epistemicism: A sharp cutoff exists; we operationalize it via rounding.* | **Assign higher grade.**<br>→ *Terminate procedure.*                           | Proceed to **Step 2**.                                                        |
  | **2** | **"Was there a *mechanical error* in grading (e.g., missed points, math error)?"**<br>→ *Focus only on unambiguous mistakes (e.g., answer matches rubric but wasn’t credited).*<br>→ *Ignore subjective re-evaluations.*<br>→ *Time limit: 2 min to verify.* | **Correct error, recalculate score.**<br>→ If new score ≥ cutoff after rounding: **assign higher grade.**<br>→ If still below: **proceed to Step 3.** | Proceed to **Step 3**.                                                        |
  | **3** | **"Is there *strong evidence* of exceptional engagement?"**<br>→ *Requires **both**:<br>a) ≥3 office hours/TA sessions attended,* **and**<br>b) *Meaningful improvement (e.g., midterm 75% → final 85%).*<br>→ *Documentation required (attendance logs, grade trend).*<br>→ *Supervaluationism: Borderline cases may be resolved via external precisification.* | **Escalate to professor.**<br>→ *TA emails professor with evidence.*           | **Assign lower grade.**<br>→ *Terminate procedure.*                           |
  | **4** | **"Is this a *repeat request* after prior regrade?"**<br>→ *e.g., Student already triggered this procedure once.* | **Assign lower grade.**<br>→ *Terminate procedure.*<br>→ *Note: No double-dipping.* | *N/A* (Only reachable if Steps 1-3 say "no").                                 |

  ---

  ### **KEY PRINCIPLES & FAILURE MODES**  
  - **What This Solves**: Standardizes rounding (epistemicism), resolves clear errors, flags engagement cases for human judgment (supervaluationism).  
  - **What This *Cannot* Solve**:  
    - **The Sorites Problem**: A sharp edge always exists (e.g., rounding moves it to 89.45 vs. 89.55).  
    - **Holistic Grading**: Impossible under registrar constraints.  
    - **Appeals Based on "Effort" Alone**: Unless engagement criteria (**Step 3**) are met.  
  - **Judgment Calls Disguised as Procedure**:  
    - **Step 2**: "Mechanical error" can be fuzzy (e.g., is a rubric interpretation "mechanical"?).  
    - **Step 3**: "Meaningful improvement" requires TA discretion (e.g., 75% → 85% = yes; 84% → 85% = no).  
  - **Defensibility**:  
    - All decisions are **documented** (TA notes: "Step 1: no; Step 2: no; Step 3: no → B+").  
    - **Consistency**: Same rules for all students.  
    - **Transparency**: Publish this procedure in the syllabus.  

  ---

  ### **TEST CASES**  
  **Case A: 89.6 (Cutoff A- = 90.0)**  
  - Step 1: 89.6 < 90.0 → **NO** (no rounding bump).  
  - Step 2: Assume no error → **NO**.  
  - Step 3: Student attended office hours all semester → **YES** (if improvement documented).  
  - **Action**: Escalate to professor.  
  - **Note**: If professor denies bump, it’s a **values call** ("engagement vs. mastery").  

  **Case B: Regrade from 88.9 → 89.4 (Cutoff A- = 90.0)**  
  - Step 1: 89.4 < 90.0 → **NO**.  
  - Step 2: Error already corrected → **NO**.  
  - Step 3: Assume no engagement evidence → **NO**.  
  - Step 4: This is a repeat request → **YES**.  
  - **Action**: Assign B+ (no escalation).  
  - **Why?** Prevents endless regrades; score still misses cutoff.  

  **Case C: TA Advocating Holistic Grading**  
  - **Procedure Response**: Not applicable. Registrar requires a number.  
  - **Solution**: Frame numbers as **necessary evil** for scale. Offer compromise:  
    - TAs can flag students for professor review *before* final grades (e.g., "This B+ feels like an A-").  
    - But final score must align with registrar rules.  
  - **Risk**: If TA ignores numbers, appeals committee will overturn (violates policy).  

  ---

  ### **WHEN THE PROFESSOR WON’T LIKE THE OUTCOME**  
  - **Case A Escalation**: If you deny the engaged student, the procedure exposes your **values choice** (you prioritized strict mastery over growth). The procedure forces honesty about this.  
  - **Case B**: Student may feel penalized for advocating—but the procedure’s consistency protects you.  

  ---

  **ONE-PAGE SUMMARY FOR TAs**:  
  ```  
  BORDERLINE GRADE CHEATSHEET  
  1. ROUND: Score ≥ cutoff after rounding? (e.g., 89.5+ → A-) → YES: Assign higher grade.  
  2. ERROR: Unambiguous grading mistake? → YES: Fix, recalc, re-check Step 1.  
  3. ENGAGEMENT: ≥3 OH visits + significant improvement? → YES: Escalate to prof.  
  4. REPEAT? Already used this procedure? → YES: Assign lower grade.  
  ELSE: Assign lower grade.  
  ```  
  **Time Saver**: If Step 3 evidence isn’t pre-documented (e.g., no attendance log), skip to "NO."  

  This won’t end the philosophy, but it will end the emails—and if appealed, you’ll show a system, not vibes.
