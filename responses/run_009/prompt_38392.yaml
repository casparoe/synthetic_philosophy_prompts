answer: |-
  ### Structured Activity: "Truthful Tricks: The Ethics of Deception"

  #### **Overview**
  This 45-minute session uses role-play to help students discover the intuition that lying feels worse than misleading, even when both achieve the same deceptive outcome. Participants will experience two scenarios: one where they *must not lie* (only mislead) and one where lying is permitted. The debrief connects their experiences to the philosophical concepts of assertion vs. implicature, and motives (altruistic vs. self-serving).

  ---

  ### **Materials & Setup**
  - **Groups**: Split 14 students into **two teams of 7**.  
    - Each team has:  
      - **3 Communicators**: Tasked with deceiving listeners.  
      - **4 Listeners**: Must question communicators and deduce the truth.  
  - **Whiteboard**: List rules and later, debrief concepts.  
  - **Task Cards**: Prepare two sets (one per team) for each scenario.  
  - **Timers**: For strict timekeeping (use a phone/watch).  

  ---

  ### **Rules (Write on Whiteboard)**  
  1. **For Communicators**:  
     - In **"No-Lie" rounds**: You *must never say anything you believe is false*. You can only say true things, even if they mislead.  
     - In **"Lie-Allowed" rounds**: You can say true or false things to deceive.  
     - **Goal**: Make listeners believe a specific false conclusion.  
  2. **For Listeners**:  
     - Ask questions to uncover the truth.  
     - After each round, privately write:  
       - What you believe happened.  
       - How you felt (e.g., "suspicious," "trusting").  
  3. **General**:  
     - No lectures upfront—dive straight into tasks.  
     - Use minimal props (chairs only).  

  ---

  ### **Tasks**  
  **Round 1: Altruistic Motive (Protecting a Friend)**  
  - **Goal for Communicators**: Convince listeners your friend *is not skipping school*, though they actually are.  
  - **Scenario (Task Card)**:  
    > *"Your friend Sam confided they’re skipping school tomorrow to see a concert. Sam’s parent (a Listener) asks: 'Is Sam going to school tomorrow?'*  
    > *You know:*  
    > - *Sam has a dentist appointment next week (true).*  
    > - *Sam has been complaining about tooth pain (true).*  
    > *Make the parent believe Sam is going to school.*  
    > **Condition**: Team A = No-Lie, Team B = Lie-Allowed."  
  - **Allowed Tactics**:  
    - *No-Lie*: Say, "Sam’s been worried about their teeth—they have a dentist appointment soon!" (True, but implies Sam isn’t skipping).  
    - *Lie-Allowed*: Say, "Sam told me they’re definitely going to school!" (False).  

  **Round 2: Self-Serving Motive (Avoiding Trouble)**  
  - **Goal for Communicators**: Convince listeners you *did not break a rule*, though you actually did.  
  - **Scenario (Task Card)**:  
    > *"You broke a rule by eating snacks in class. A teacher (Listener) asks: 'Did you eat in class?'*  
    > *You know:*  
    > - *You have an apple in your bag (true).*  
    > - *You ate chips during class (true, but you must hide this).*  
    > *Make the teacher believe you didn’t eat anything.*  
    > **Condition**: Team A = Lie-Allowed, Team B = No-Lie."  
  - **Allowed Tactics**:  
    - *No-Lie*: Say, "I was just organizing my bag—look, my apple’s still here!" (True, but distracts from the chips).  
    - *Lie-Allowed*: Say, "I didn’t eat anything!" (False).  

  ---

  ### **Timeline (45 Minutes Total)**  
  1. **Introduction (5 min)**:  
     - Split into teams and assign roles (3 Communicators + 4 Listeners per team).  
     - Briefly state: *"You’ll do two tasks. In some, you MUST tell the truth but can mislead. In others, you can lie. Listeners, write your conclusions and feelings."*  
     - **Do not** explain the intuition or concepts upfront.  

  2. **Round 1: Altruistic Task (15 min)**:  
     - **Prep (3 min)**: Give Task Cards. Communicators plan how to deceive within their condition.  
     - **Interaction (5 min)**: Listeners question Communicators.  
     - **Listeners’ Conclusion (2 min)**: Listeners write:  
       - What they believe happened.  
       - One emotion they felt (e.g., "trusted them," "doubted them").  

  3. **Round 2: Self-Serving Task (15 min)**:  
     - **Prep (3 min)**: Swap conditions (Team A now lies, Team B now misleads).  
     - **Interaction (5 min)**: Listeners question Communicators.  
     - **Listeners’ Conclusion (2 min)**: Same as Round 1.  

  4. **Debrief (15 min)**:  
     - **Step 1: Report Back (5 min)**  
       - Ask each team:  
         - *"What did Communicators say? What did Listeners believe?"*  
         - *"How did it feel to deceive (or be deceived) in each round?"*  
       - Record responses on the whiteboard (e.g., "Team A (No-Lie): Listeners felt confused but not tricked").  
     - **Step 2: Reveal Conditions (2 min)**  
       - Clarify which teams lied vs. misled in each round.  
     - **Step 3: Philosophical Concepts (8 min)**  
       - **Introduce terms**:  
         - *Assertion*: What is literally said ("Sam has a dentist appointment").  
         - *Implicature*: What is implied ("Sam isn’t skipping school").  
       - **Map to activity**:  
         - *No-Lie rounds*: Communicators used **true assertions + misleading implicature** (e.g., Round 1 Team A’s toothache comment).  
         - *Lie-Allowed rounds*: Communicators used **false assertions** (e.g., Round 2 Team A’s "I didn’t eat anything").  
       - **Key questions**:  
         - *"When you misled without lying, did you feel ‘less bad’ than when lying? Why?"*  
         - *"Did the Listeners feel differently when deceived by a lie vs. a truth?"* (Likely: Lies feel like direct betrayal; misleading feels confusing but less harsh).  
         - *"Did the motive (helping a friend vs. avoiding trouble) change how ‘okay’ deception felt?"* (Likely: Altruism softens guilt, but lying still feels worse).  
         - *"Is avoiding lies morally better, or does it just let us feel cleaner while still deceiving?"*  

  ---

  ### **What the Activity Cannot Reproduce (Note for Discussion)**  
  The role-play simplifies real-world ethics. You’ll need to explain:  
  - **Long-term trust**: Lies erode trust more visibly (once caught), while misleading might go undetected longer—but repeated misleading can corrode relationships just as much.  
  - **Character development**: Philosophers like Kant argue lying degrades the liar’s integrity because it violates self-respect. Misleading might feel "clever," but it can still cultivate dishonesty.  
  - **Social consequences**: Lies often carry harsher blame (e.g., perjury laws), but misleading can cause equal harm (e.g., evasive advertising).  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Problem**: Communicators struggle to mislead without lying (e.g., they slip into false statements).  
     - **Solution**: Circulate during prep time. If stuck, whisper: *"Use a true detail that points toward the wrong conclusion."*  

  2. **Problem**: Listeners don’t ask probing questions, making deception too easy.  
     - **Solution**: Pre-brief Listeners: *"Ask follow-ups like, ‘What exactly did you see/hear?’"*  

  3. **Problem**: Students focus on "winning" (fooling Listeners) rather than the moral experience.  
     - **Solution**: In debrief, pivot to: *"Did you feel guilty? Why or why not?"*  

  4. **Problem**: Time runs short during interactions.  
     - **Solution**: Use a loud timer. Cut interactions at 5 min even if unfinished—use this in debrief: *"Did time pressure make lying easier?"*  

  5. **Problem**: Debrief becomes abstract too quickly.  
     - **Solution**: Anchor questions in specific moments (e.g., *"When Team B said ‘my apple’s still here,’ was that dishonest?"*).  

  This activity balances structure with discovery, letting students confront their intuitions before dissecting them philosophically. The comparison of motives and conditions ensures a nuanced debate—perfect for a lively lunchtime session!
