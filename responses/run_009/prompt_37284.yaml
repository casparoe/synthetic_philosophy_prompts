answer: |-
  Here are ten targeted questions (plus embedded follow-ups) designed to press the strong Sapir-Whorf view, tailored for your interview:

  1.  **Core Weakness - The Retreat:** "Proponents of the *strong* Whorfian view often seem to retreat to Slobin's 'thinking-for-speaking' when pressed – the idea that language shapes *how* we formulate thoughts for communication, not the thoughts themselves. Does accepting 'thinking-for-speaking' rescue the strong view, or does it fundamentally concede that language doesn't truly *constrain* or *enable* specific thoughts? If it's the latter, what tangible, non-trivial claim of the strong view actually *survives*?"
      *   *Likely Answer/Follow-Up:* (If she defends it as compatible) "But doesn't 'thinking-for-speaking' imply the thought exists *before* linguistic encoding? If so, how does that square with my character's belief that grammar determines *which thoughts are possible*? What specific cognitive *impossibility* does the strong view still claim?"

  2.  **Replication Crisis (Grammatical Gender):** "Studies like Boroditsky's on German/Spanish bridges and keys were key early evidence. But we've seen replication issues – at least the key study seems shaky. Do you still consider grammatical gender effects robust evidence for strong Whorfianism? And more broadly, does this kind of replication trouble in a flagship example worry you about the overall empirical foundation of the strong program?"
      *   *Likely Answer/Follow-Up:* (If she downplays replication issues or cites other studies) "Even if *some* effects hold, doesn't this specific replication failure suggest the original findings might have been overstated or context-dependent? If foundational evidence crumbles, how do we know which other claimed effects are solid? Doesn't this point towards weaker, more fleeting influences rather than deep cognitive shaping?"

  3.  **Guugu Yimithirr - Habit vs. Constraint:** "The absolute spatial orientation in languages like Guugu Yimithirr is fascinating. But is this evidence that language *shapes* fundamental thought, or simply that a linguistic *practice* necessitates and reinforces a specific cultural skill/navigational habit? How do you, methodologically, disentangle the language itself being the *shaper* from it being the *tool* used for a culturally ingrained cognitive practice?"
      *   *Likely Answer/Follow-Up:* (If she argues language is the key shaper) "If a child grew up in that culture but was somehow never exposed to the language's spatial terms (an impossible hypothetical, I know), would they *still* develop that absolute orientation skill purely through cultural practice and environmental demands? If the answer is 'possibly yes', doesn't that reduce language's role to facilitator/encoder rather than creator of the thought capacity?"

  4.  **Evidentials - Memory & Source Monitoring:** "Languages with mandatory evidential marking (seen/heard/inferred) seem like prime candidates for Whorfian effects. Does your strong view predict that speakers of such languages have inherently superior memory for the *source* of their knowledge? Has this been robustly tested, and if so, do the results show a deep cognitive difference, or just heightened awareness *when speaking*?"
      *   *Likely Answer/Follow-Up:* (If she cites evidence for awareness) "But heightened awareness *during speech* sounds like 'thinking-for-speaking' again. Has anyone shown these speakers have fundamentally different *non-linguistic* memory structures, or are they just better at *reporting* the source when asked? If it's the latter, isn't that performance, not underlying cognition?"

  5.  **Bilingualism & Untranslatability (The Personal One):** "I'm bilingual (Polish/English). Does the strong view predict that I, as a speaker, can have thoughts *in Polish* that are literally *impossible* to formulate or hold in English, due to grammatical or lexical differences? Or does it just mean accessing or expressing that thought in English might be less efficient, require circumlocution, or lose subtlety – an 'extra beat', not an impossibility?"
      *   *Likely Answer/Follow-Up:* (If she concedes it's "extra beat"/nuance loss) "For my character who believes in the *strong* version, that 'extra beat' is a fatal compromise. If no thought is truly *impossible* in another language – just harder or less precise to express – doesn't that gut the core idea that grammar controls *which thoughts are available*? Can you give me a concrete example of a thought demonstrably *impossible* in one language but possible in another?"

  6.  **Falsifiability - The Closer:** "This is crucial for my character's intellectual honesty: What specific, testable finding would genuinely make you reconsider or significantly weaken your commitment to the strong version of linguistic relativity? What evidence would clearly signal 'this cognitive difference *isn't* caused by language in the way the strong view claims'?"
      *   *(This question is open-ended by design. Listen closely to whether she offers concrete falsification criteria, admits the strong version is largely unfalsifiable/untestable, or retreats to the weaker version as the only defensible position.)*

  **Word Count:** ~580 words.

  **Why this works for your context:**

  *   **Targets Weaknesses:** Directly addresses the major critiques (retreat to thinking-for-speaking, replication issues, habit vs. language causation, lack of clear cognitive differences for evidentials, bilingual translatability).
  *   **Prepares Follow-ups:** Anticipates common defenses and provides immediate counter-pressure.
  *   **Serves Your Plot:** The bilingual question (#5) directly confronts the core tension for your narrator. The falsifiability question (#6) is perfect for character development – how a true believer handles potential counter-evidence.
  *   **Concise & Casual:** Phrased conversationally, avoids jargon overload, fits your phone/cafe scenario.
  *   **Respects the Interviewee:** Presents you as knowledgeable and engaged, not just looking for a gotcha, while still pressing hard on the logic.

  Good luck with the interview and the book! This sounds like a fascinating premise.
