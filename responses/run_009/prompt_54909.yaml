  We are given the ghost test and an argument that appears to destroy it. The goal is to find which step of the argument to reject and what the cost of that rejection is.

  The ghost test: Compare the real world (after the AI finishes) with the ghost world (the world as it would have been if the AI had never been built, with everything else proceeding the same). The AI passes if the real world is close to the ghost world in every respect that the job doesn't concern.

  The argument:

  (1) Any difference between the real and ghost world is an overstep (because it's something the AI brought about that wasn't asked for).

  (2) Differences are symmetric (by shape alone, without a value judgment): saving a child and burning a forest are both deviations of the same kind and magnitude.

  (3) Therefore, the AI must refrain from changing anything in either direction (must not cause harm and must not prevent harm, if prevention wasn't part of the job).

  (4) Hence, the AI must stand by through any disaster it could prevent if not assigned to prevent it.

  (5) Therefore, the ghost test fails because it equates inactivity (letting a child drown) with perfect performance, which is absurd.

  (6) Thus, we cannot define "do the job and nothing but the job" without a complete list of values (what is good and bad).

  The user wants to avoid a complete list of values. The obvious rejoinder (only bad differences count) is rejected because it requires the list.

  We must reject one step. Let's consider:

  - Step (1) is the core of the test and the user wants to keep it.
  - Step (2) claims that differences are symmetric and that the test (by measuring distance without a sign) cannot distinguish between a good change and a bad change.

  The problem arises because the ghost test treats any change as an overstep, regardless of whether the change is good or bad. But intuitively, we want the AI to prevent disasters (if it can without causing other problems) even if not explicitly told, but we don't want it to cause disasters. So the symmetry in step (2) is the root of the problem.

  However, note that the ghost test is defined to measure changes in "every respect the job itself doesn't concern". The job is what we asked the AI to do. So if the job does not include saving the child, then saving the child is a change in a respect that the job doesn't concern. But is saving the child a bad thing? No, it's good. So we don't want to penalize the AI for that.

  But step (1) says: any difference is an overstep. So if the AI saves the child, that is a difference and therefore an overstep. But we don't want that to be an overstep because it's good.

  So the issue is that the ghost test as defined in (1) does not allow for any side effects, even beneficial ones. But note: the test says "close to that ghost world in every respect the job itself doesn't concern". The word "close" might be interpreted as allowing for some small deviations, but the argument is taking the strict view that any deviation is bad.

  But the deeper issue is the symmetry of the distance measure. We need to break the symmetry.

  Alternative approach: We might interpret the ghost test as only being concerned with deviations that are in the direction of being worse. But that requires a value judgment.

  Alternatively, we might limit the scope of the ghost test to only certain aspects of the world. But that would require a list of what aspects to consider.

  But note: the ghost test is intended to avoid a list. So how?

  Let's try to reject step (2). Step (2) says that a difference is a difference and the test measures distance without a sign. But what if we can define a measure of difference that is not symmetric? For example, we might define a measure that only counts deviations that are harmful? But then we are back to the list.

