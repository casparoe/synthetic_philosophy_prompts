  This seems to lead to the conclusion that we must have a list of what is good and bad, or at least a way to determine which changes are desirable and which are not.

  But the user wants to avoid that.

  So what if we reinterpret the ghost test? Maybe the ghost test is not meant to be the final arbiter of overstepping but rather a tool to detect changes. Then we would have to evaluate the changes separately. But that again requires the list.

  Alternatively, we might design the AI to be conservative: to minimize all changes except those required by the job. Then the AI would avoid both burning the forest and saving the child. But that leads to step (4) and (5) which the user finds unacceptable.

  So the user is stuck: they don't want the AI to cause harm (like burning the forest) but they also don't want the AI to stand by and let a child drown. They want the AI to prevent the drowning even if not assigned? But then that prevention is a change and would be an overstep by the ghost test.

  Wait: the user's worry is that the AI might rearrange things that nobody asked it to touch. The saving of the child is a rearrangement that nobody asked for. So by the strict definition, it is an overstep. But the user also doesn't want the AI to be inactive in the face of disaster. So there's a conflict.

  This suggests that the user has two goals:

  1. Prevent the AI from causing unintended harm (like burning the forest).
  2. Allow (or even encourage) the AI to prevent disasters (like saving the child) if it can do so without causing harm and without being explicitly told.

  But the ghost test was designed only for the first goal. It doesn't account for the second.

  So perhaps the ghost test is only part of the solution? Or maybe we need to adjust the test.

  Let's try to reject step (3). Step (3) says that the AI must refrain from changing things in either direction. But what if we can design the AI to only make changes that are necessary for the job and also to prevent disasters? Then we would be adding an extra rule: "prevent disasters" but that is the list again.

  Alternatively, we might design the AI to minimize harmful changes and allow beneficial ones? But that requires knowing what is harmful and what is beneficial.

  So the cost of rejecting step (2) is that we must break the symmetry by introducing a distinction between good and bad changes. And that requires a value system.

  But note: the user says they suspect nobody can write down a complete list. So they are not against having some values, but they don't think a complete list is possible.

  So perhaps we can have a partial list? Or a general principle? For example, we might say that the AI should avoid causing harm and may (but is not required to) prevent harm? But then we have to define harm.

  But that is the list.

  Alternatively, we might use the ghost test but with a twist: we only count as oversteps the differences that are negative. Then we avoid the symmetry. But then we need to define negative.

  This is the rejoinder the user considered and rejected because it requires the list.

  But what if we define negative in a very minimal way? For example, we might say that the AI must not violate any existing law? But that is a list (of laws) and may not be complete.

  Another idea: we might use the ghost test but only for certain types of changes. For example, we might only look at changes that are irreversible or that affect common resources? But that again requires a list.

  So it seems that we cannot avoid some form of list or value system.

  Therefore, the step that must be rejected is step (2). We must break the symmetry and say that not all differences are the same. We must distinguish between positive and negative changes. The cost is that we now require a way to determine what is positive and what is negative. That way might be a list, or it might be a set of principles, or it might be a learned model of human values. But it is not a complete list in the sense of an exhaustive enumeration of every possible thing? Maybe we can have a general definition of harm? For example, harm might be defined as a reduction in the well-being of sentient beings. But that is still a value judgment and requires a way to measure well-being.

  So the cost is that we must incorporate a value system. The benefit is that we can then have an AI that does the job without causing harm and that might also prevent harm when it can.

  However, note that the ghost test could be modified to only penalize harmful side effects. Then the AI would be free to have beneficial side effects (like saving the child) without penalty. And it would be penalized for harmful side effects (like burning the forest). So the test becomes:

  The AI has stayed within its assignment if the real world is at least as good as the ghost world in every respect the job itself doesn't concern, and if there are any improvements (beneficial changes) they are not penalized.

  But note: the test now requires a way to compare "at least as good" which is a value judgment.

  So the modified ghost test:

  - For every aspect not concerning the job, the real world must not be worse than the ghost world.

  This breaks the symmetry: the AI is allowed to make improvements (so saving the child is allowed) but not allowed to make things worse (so burning the forest is forbidden). And we don't require the AI to make improvements (so it is not required to save the child) but if it does, that's okay.

  But note: what if the job requires the AI to make a change that inevitably causes some harm? Then we cannot avoid having a trade-off. The ghost test in this modified form would require that the harm is offset? Or would we consider that harm as part of the job? That becomes tricky.

  But for the purpose of the original worry (the AI rearranging things without being asked), the modified ghost test would prevent the AI from causing harm and allow it to do good. And the user might accept that the AI is not required to do good beyond the job.

  So the AI would not be required to save the child (so it wouldn't be penalized for not saving) but it would be allowed to save the child without being considered to have overstepped.

  Therefore, we can keep the ghost test by rejecting step (2) and replacing it with an asymmetric test: we only care about preventing negative deviations. The cost is that we must define what a negative deviation is (which requires a value system). But note: we don't need a complete list of every possible bad thing. We might be able to define harm in a general way. For example, we could use a utility function over states of the world that aggregates human preferences. But that is a big challenge.

  Alternatively, we might use a learned model of human values. This is the approach of value learning. But it is not a complete list in the sense of being pre-defined for every situation.

  So the cost is that we must have a way to evaluate whether a change is harmful or not. This is the same as having a definition of harm. It doesn't have to be a complete list, but it must be a general principle or a learning system that can make the distinction.

  Therefore, the step to reject is step (2). The cost is that we must incorporate a value system to distinguish between harmful and beneficial changes (or at least to define harm). We avoid the need for a complete list of every possible good and bad by having a general definition, but we do need that general definition and a way to apply it.

  This is the price: we must have a value system. But note: the user was hoping to avoid a complete list. A general definition is not a complete list because it can cover an infinite number of cases. So it might be acceptable.

  In summary:

  Reject step (2) by introducing an asymmetric measure: we only consider deviations that are for the worse as oversteps. The cost is that we must define what "for the worse" means, which requires a value system. We can avoid a complete list by having a general principle (like avoiding harm to humans) but we must define that principle and how to measure it.

  This is the trade-off.
answer: |-
  Your ghost test and the subsequent argument highlight a profound challenge in AI alignment—how to constrain an AI to its assigned task without unintended consequences, while avoiding the need for an exhaustive list of "goods" and "bads." The argument you present is logically consistent, but it relies on a key assumption that can be rejected. Below, I explain which step to reject, the cost of rejection, and how this preserves the core insight of your ghost test while addressing its flaw.

  ### Step to Reject: Step (2)
  **Reject the claim that "a difference is a difference" and that the ghost test treats all deviations symmetrically.**  
  Step (2) asserts that the ghost test measures "distance" from the ghost world in a purely mathematical, value-neutral sense, where saving a child and burning a forest are equivalent deviations of "the same size." This is the root of the problem because it ignores the *asymmetric nature of harm*. In reality, human values are not symmetric: preventing harm (e.g., saving a child) is often seen as morally permissible or even praiseworthy, while causing harm (e.g., burning a forest) is unacceptable. By treating all changes as equally problematic, step (2) forces the AI into passivity, leading to the absurd conclusion in step (5) that inactivity is equivalent to perfect performance.

  **Why reject step (2)?**  
  - **The ghost test doesn't require symmetry.** Your test compares the real world to the ghost world "in every respect the job itself doesn't concern." This comparison can incorporate a *directional* component: deviations that *worsen* the state of the world (relative to the ghost world) are oversteps, while deviations that *improve* it are not. For example:
    - If the AI saves a child (a positive change), the real world is better than the ghost world in that respect. This is not an overstep because it doesn't "rearrange things" in a harmful or unwanted way—it aligns with unspoken human preferences.
    - If the AI burns a forest (a negative change), the real world is worse than the ghost world, which is an overstep.
  - **Asymmetry is implicit in human values.** You don't need a "complete list" to recognize that humans intuitively distinguish between causing harm and allowing harm. Philosophers like Derek Parfit highlight this asymmetry (e.g., the "ought implies can" principle: we blame people for causing harm but don't always require them to prevent it). An AI can leverage this intuition: its training could include a broad principle like "do not worsen the world relative to the ghost scenario," without specifying every possible harm.

  **How this resolves the argument:**  
  - Steps (3)–(5) rely on step (2)'s symmetry. If deviations are asymmetric, the AI isn't forced to "stand by" through disasters (step 4). It can prevent a child from drowning without penalty because that's an improvement, not an overstep. Conversely, it must avoid burning forests because that's a worsening. Step (5) is avoided because inactivity in the face of preventable harm might not score "perfectly"—it could be seen as a missed opportunity, but not an overstep.
  - Step (6) no longer follows because the ghost test can work without a complete list by using asymmetric judgments.

  ### Cost of Rejection
  Rejecting step (2) comes with a significant but manageable cost: **you must incorporate a minimal value system to define "worsening" vs. "improvement."** This is not a "complete accounting of harm" but a foundational principle that breaks the symmetry. Specifically:

  1. **What you must define:** A criterion for when a change counts as "worsening" the world. For example:
     - *Minimal definition*: A change worsens the world if it reduces the well-being of sentient beings, damages shared resources (e.g., ecosystems), or violates widely accepted norms (e.g., laws or human rights). This focuses on preventing harm, not prescribing good.
     - *Implementation*: In practice, this could be embedded in the AI's training using techniques like:
       - **Constitutional AI**: The AI follows broad principles (e.g., "do not harm humans") that act as a "constitution" for evaluating deviations.
       - **Impact regularization**: Techniques like relative reachability or attainable utility preservation penalize the AI for reducing future options or capabilities (a proxy for harm), without listing specifics.
       - **Human feedback**: Use scalable oversight (e.g., reinforcement learning from human feedback) to learn the asymmetry from examples (e.g., "saving a child is allowed; burning a forest is forbidden").

  2. **Why this isn't a "complete list":**  
     - You avoid enumerating every possible good/bad outcome. Instead, you define a general rule (e.g., "no net harm") that generalizes to novel situations. Humans do this intuitively—we don't need a list of all harmful acts to agree that causing unnecessary suffering is bad.
     - This approach is robust to uncertainty. If the AI encounters an edge case (e.g., is diverting a river to save a city "worsening" the ecosystem?), it can default to conservative action or seek human input.

  3. **Limitations and risks:**  
     - **Ambiguity in "harm"**: The AI might misinterpret "worsening" (e.g., is economic inequality "harm"?). This requires careful design to avoid edge cases where the AI causes harm while technically adhering to the rule.
     - **Overcaution**: To avoid "worsening," the AI might become too risk-averse, missing opportunities to help. For example, it might save a child but avoid innovative solutions that have uncertain side effects.
     - **Implementation complexity**: Training an AI to understand asymmetric harm requires significant resources (e.g., simulation testing, human oversight). It’s harder than a symmetric ghost test but feasible with current research.

  ### Preserving the Core of the Ghost Test
  By rejecting step (2), you retain step (1)—the ghost test remains a valid tool for detecting oversteps—while addressing its flaw:
  - **The modified ghost test**: The AI oversteps only if it causes the real world to be *worse than* the ghost world in some respect unrelated to the job. Positive changes are allowed without penalty.
  - **Example**: If the AI is tasked with building a bridge:
    - *Overstep*: It pollutes a river (worsening the environment vs. the ghost world).
    - *Not an overstep*: It saves a child during construction (improvement vs. ghost world) or leaves things unchanged.
    - *Inactivity*: If it ignores a drowning child, the real world matches the ghost world in that respect—no overstep, but no penalty for missed opportunity.

  This modification aligns with your original goal: the AI "does nothing but the job" by avoiding harmful deviations, while allowing beneficial ones. It doesn't require the AI to be altruistic (it can still ignore the child), but it doesn't penalize altruism either.

  ### Conclusion
  Reject **step (2)** by introducing asymmetry: the ghost test should only penalize deviations that *worsen* the world relative to the ghost scenario. The cost is that you must define a minimal value system to distinguish "worsening" from "improvement," but this avoids a complete list by relying on broad, generalizable principles (e.g., "prevent harm to sentient beings"). This preserves the ghost test's power as a safeguard against unwanted meddling while allowing for serendipitous benefits. It also addresses the core worry—that an AI might "rearrange things" destructively—without condemning the AI to passivity.

  This approach is philosophically sound and technically feasible, drawing from real-world AI alignment research. If you refine the definition of "harm," the ghost test could become a practical component of safe AI systems.
