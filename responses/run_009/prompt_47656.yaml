prompt: |-
  As a novelist, I try to make philosophical abstractions bear down on my characters like weather — something they must answer for in their lives, not merely discuss. The chapter I am outlining turns on the special composition question: under what conditions do some things compose a further thing? The canonical illustrations — the Ship of Theseus, Tib and Tibbles — have been worn so smooth by repetition that a reader meets them as furniture rather than as a live problem, and I want something my reader will encounter for the first time.

  I would like an example of a fictional dispute in which mereological universalism comes out intuitively worse than a common-sense, restricted answer to the special composition question. The dispute must carry real stakes for the characters — money, liability, or grief; never seminar-room stakes — and it must turn on whether some plurality of objects forms one thing, not on how a single thing persists through change. One direction you might take it: a marine insurer, committed in the strictest way to universalism, refuses a claim of total loss on the grounds that the vessel was never destroyed at all — its parts, now scattered across the seabed, still compose it, merely arranged differently than before the sinking — while the owner's family insists that what lies down there is no ship any longer, only debris arranged ship-wise. You are free to invent a different setting, however, if it serves the example better.

  In presenting the example, please make clear precisely which judgment about composition divides the two positions, and explain why, in this setting, the restricted common-sense view should strike a reader as the more reasonable one.
reasoning: |-
  Okay, let me approach this novelist's request systematically. They need a fresh mereological conflict that feels viscerally real, not academic - something where universalism clashes with common sense in ways that impact characters' lives. The Ship of Theseus is exhausted, so we must invent new terrain.

  Hmm... the marine insurance scenario they suggested has potential, but I worry it still feels too familiar. What if we ground it in something more intimate than commercial shipping? Funeral rites come to mind - cultures universally treat bodily remains with profound symbolic weight. That's fertile ground.

  The key is making universalism feel cruel rather than just counterintuitive. Imagine a universalist medical examiner testifying that a victim's scattered remains still "compose" the person legally, blocking a death certificate. The family couldn't claim insurance, remarry, or perform burial rites. That hurts. 

  But mere bones aren't enough - we need decomposition to play a role. If insects and bacteria are consuming the tissue, is there still a composite object? Universalism would say yes, but common sense screams that the person is gone. The forensics angle makes it concrete: no body bag, no crime scene photos of arranged remains, just... ecological processes. 

  For maximum discomfort, the ME could be technically correct but ethically monstrous. His rigid universalism serves institutional efficiency - closing cases quickly saves resources. Meanwhile the widow needs that death certificate to pay her child's medical bills. Now philosophy isn't abstract; it's determining whether a sick kid gets treatment.

  I should emphasize the composition pivot point: whether organic matter mid-decomposition constitutes a unified entity. Universalism demands we say yes; common sense says only when integrated by life. And crucially, the reader will side with the widow because her pain makes the academic position feel inhuman. The ME becomes a villain by prioritizing theory over lived reality.

  This might work because:
  - Stakes are primal (grief, survival)
  - The science feels grounding
  - It subverts expectations (not ships but bodies)
  - The power imbalance highlights philosophy's real-world weight

  Better refine the legal plausibility though. Would courts really accept such testimony? Perhaps if set in a jurisdiction with odd precedents, or near-future where universalism gained traction in forensics. The specifics must withstand scrutiny.
answer: |-
  Here's a fictional dispute designed to meet your criteria, centered on grief, inheritance, and the finality of death, rather than ships or cats:

  **The Dispute:** *The Uncollected Ashes*

  **Setting:** A near-future city with advanced, widespread cremation technologies and complex inheritance laws. The "Green Rest" crematorium uses a proprietary process involving intense, targeted sonic fields and enzymatic accelerants, reducing a body to a fine, sterile mineral ash within hours.

  **The Characters & Stakes:**
  1.  **Elena:** The grieving daughter of the recently deceased Mrs. Aris Thorne. Her mother's will stipulated a significant, time-sensitive inheritance transfer to Elena *only upon the confirmed completion of Mrs. Thorne's cremation and the securing of her ashes*. Elena needs these funds immediately to cover critical, life-saving treatment for her own chronically ill child.
  2.  **Dr. Silas Vance:** The CEO and Chief Technologist of "Green Rest." He is a staunch philosophical universalist who explicitly bases the company's processes and legal definitions on mereological universalism. "Green Rest" offers the fastest, most efficient service in the city.
  3.  **The Process & The Problem:** During Mrs. Thorne's cremation, a rare and catastrophic power surge hit "Green Rest" precisely at the 99% completion mark. The sonic fields collapsed, and the enzymatic process halted instantly. What remains in the chamber is *not* the fine, sterile ash Elena expected. Instead, it's a grotesque scene: a pile of mostly powdered bone mixed with small, distinct fragments of charred but recognizable bone, teeth, and even a few tiny, unvaporized pieces of dense prosthetic material (Mrs. Thorne had a titanium knee joint). Crucially, the process was halted *before* the final "homogenization and sterilization" phase. The fragments are distinct objects resting on/in the powder.

  **The Dispute Unfolds:**
  *   Elena arrives to collect the ashes. She is presented with this unsettling mixture. Horrified and distraught, she demands the process be completed properly to yield actual ashes, as per the contract and her mother's wishes implied by the will. She also needs the legal certificate of completed cremation to access the inheritance.
  *   Dr. Vance refuses. He invokes the "Green Rest" contract terms, rooted in his universalism: *"Cremation is complete when the deceased body ceases to exist as a distinct biological entity and its constituent matter is rendered inert. This state has been achieved."*
  *   **Vance's Universalist Argument (The Crux):** "Ms. Thorne ceased to exist as a biological entity the moment the process began breaking down cellular cohesion. What lies here," he gestures to the chamber, "is simply Mrs. Thorne *arranged differently*. These fragments? They are undeniably *her* bone fragments. This powder? It is undeniably *her* mineralized remains. They are all parts *of her*. Therefore, they compose her. There is one object here: the deceased Mrs. Thorne, currently in a particulate state. The cremation is complete. Our obligation is fulfilled. Here is your... collection... and the certificate." He offers her a box containing the mixture and the signed certificate.
  *   **Elena's Common-Sense Argument (The Crux):** "That is *not* my mother! That is *debris*! That is... garbage! Pieces of bone! Tooth fragments! Powder! A hunk of metal! My mother wanted *ashes* scattered at sea. *This* cannot be scattered; it's chunks and dust. The process wasn't finished! You haven't delivered what was promised. That," she points at the chamber, "is not *one thing* called 'my mother's ashes'. It's a *collection* of different *things* left over from a failed process. Give me *ashes*, not... *this*." Without *proper* ashes and the certificate based on the *common understanding* of completed cremation, the inheritance remains locked.

  **The Precise Mereological Judgment Dividing Them:**
  *   **Vance (Universalism):** Judges that *any* collection of objects, regardless of their spatial arrangement, causal connection, or functional unity *at this moment*, composes a further object *if those objects are the very same fundamental particles/matter that once composed the original living person*. Since these fragments and powder are constituted by the matter that was Mrs. Thorne, they compose her *now*. The cessation of biological life is irrelevant to composition; mereological sums exist eternally once their parts exist. The "Thorne-sum" persists.
  *   **Elena (Restricted Composition - Common Sense):** Judges that for some things (like a pile of debris) to compose a single, unified object (like "Mrs. Thorne's ashes" or even "the deceased Mrs. Thorne"), there needs to be something *more* than just the parts being the same matter as a former whole. Crucially, she requires **causal unity and functional integrity appropriate to the kind of object claimed**. "Ashes" imply a homogeneous, inert, *final* state. A corpse implies a contiguous, organized biological structure (even if dead). This scattered, heterogeneous mixture of distinct fragments and powder lacks the causal bonds (they aren't fused, just piled), the spatial contiguity (it's loose), and crucially, the *functional* or *ceremonial* integrity of either "a corpse" or "ashes." It's just debris – many things, not one thing.

  **Why Common-Sense Wins Reader Sympathy (Intuitive Reasonableness):**
  1.  **Grief and Finality:** The reader understands Elena's visceral horror. Common sense dictates that death involves a profound change in *what the person is*. Reducing a loved one to ash is a ritual of finality. Presenting someone with unprocessed bone fragments and powder violates the deep human need for closure and the symbolic transformation promised by cremation. Vance's position feels cold, inhuman, and dismissive of the *meaning* attached to the remains.
  2.  **The Nature of "Ashes":** The common-sense view of "ashes" is a specific, homogeneous, *processed* state. What Vance offers demonstrably isn't that. It's unfinished work. The reader intuitively agrees that "ashes" are one kind of thing, and "a pile containing recognizable bone fragments" is a different, less processed, and unsettling kind of thing.
  3.  **Lack of Unity:** The reader can *see* the distinct fragments. They are separate objects lying on powder. There is no glue, no container fusing them *yet* (Elena hasn't collected them). The universalist claim that this arbitrary pile *is* the person feels like a grotesque semantic trick, ignoring the obvious lack of cohesion or the specific state intended by the process and the will. Composition requires *something* binding parts into a whole beyond mere history; here, that binding force (biological life, then the completion of the cremation process) is absent.
  4.  **Stakes:** The stakes are painfully human – a child's healthcare, a daughter's grief compounded by bureaucratic cruelty, the violation of a final wish. Vance's rigid universalism serves only corporate efficiency and his own philosophical purity, making his position seem not just counter-intuitive but actively harmful and unjust. The reader *wants* Elena to get the treatment for her child and the closure she needs, which requires rejecting Vance's definition.

  **Why it Works for Your Chapter:**
  *   **Fresh:** Moves beyond ships and cats to the deeply personal realm of death, grief, and ritual.
  *   **High Stakes:** Tangible, emotional stakes involving life, death, money, and profound personal violation.
  *   **Clear Mereological Divide:** The core question – "Does *this specific pile of debris* compose one object (the deceased/as her remains)?" – is unambiguous.
  *   **Intuitive Pull:** The reader *feels* Elena's revulsion and understands why Vance's position is unreasonable in this context. Common sense aligns with human dignity and the purpose of the ritual/contract.
  *   **Philosophical Weight:** Universalism is forced to bear the consequence of its abstraction – reducing a grieving daughter's plea to a mere semantic technicality, revealing its potential for inhumanity when divorced from lived experience and purpose.

  This scenario forces the abstract question of composition into the raw space of human loss, where Vance's universalism seems not just false, but actively cruel, making the restricted, common-sense view the only morally and intuitively defensible position for the reader.
