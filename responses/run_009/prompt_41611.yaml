prompt: |-
  I'm presenting at a grad workshop in a few weeks on my view that suffering and pleasure are only incommensurable above an intensity threshold: truly agonizing pain can't be traded off against any amount of pleasure, but ordinary aches and annoyances aggregate normally, so classical utilitarianism is fine for most cases and only breaks at the extremes. The audience is mostly committed hedonic utilitarians who insist all welfare sits on a single interpersonally comparable scale, plus a couple of prioritarian-leaning people who I suspect will say my threshold is an ad hoc hack to avoid the ugly conclusions of their own view. Draft my Q&A prep sheet: the objections they'll actually raise, phrased in their vocabulary, ordered by how much damage each would do, with a short reply and a note on where the reply is soft. Include the question I'm hoping nobody asks — I think it's something about where exactly the threshold sits and why my position doesn't just collapse into full lexical negative utilitarianism once I admit one exception to commensurability, but maybe there's a worse one I haven't considered.
