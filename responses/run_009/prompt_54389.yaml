  **Section 2: Table of Residual Disagreements**

  The following table captures the key points of ongoing disagreement. Each point is stated in a manner that the respective party accepts as a fair representation of their position.

  | Issue | Ideal-Advisor View (IAV) | Alienation Objection (AO) |
  |-------|--------------------------|---------------------------|
  | **Feasibility of Non-Alienating Correction** | The ideal-advisor model can be specified in a manner that corrects for deep flaws in the agent's actual preferences without alienating the agent. | Any specification of the ideal-advisor model that corrects for deep flaws in the agent's actual preferences must result in prescriptions that are alien to the agent. |
  | **Circularity of "Correct Reasoning"** | The requirement of "correct reasoning" in the ideal-advisor model is not viciously circular; it can be specified procedurally (e.g., as coherence or instrumental rationality) without relying on substantive normative claims. | The requirement of "correct reasoning" either relies on a substantive normative standard (thus undermining the procedural nature of the theory) or, if defined procedurally, is too weak to correct for the agent's flawed reasoning. |
  | **Interpretation of Adaptive Preferences** | Cases of adaptive preferences (where agents adjust their desires to their constrained circumstances) demonstrate the necessity and effectiveness of the ideal-advisor model in correcting for distortions and revealing the agent's true welfare. | Cases of adaptive preferences illustrate the alienation problem: the prescriptions of the ideal-advisor model, while perhaps reflecting an external standard, are not endorsed by the actual agent and thus do not capture her welfare. |
  | **Sensitivity to Idealization Procedures** | The fact that different idealization procedures (or different orders of disclosure) may yield different results is a technical issue that can be resolved by refining the model (e.g., by specifying a canonical procedure). | The sensitivity of the model's outputs to variations in the idealization procedure demonstrates that the model fails to provide a unique and objective standard, rendering it arbitrary and alienating. |

  **Section 3: Cruxes**

  We identify the following cruxes as pivotal to the disagreement. For each, we specify a probative case that both parties agree is relevant, and we record each party's prediction about what the case shows.

  **Crux 1: Circularity of "Correct Reasoning"**

  - **Case**: The Prudential Procrastinator: An agent consistently chooses immediate gratification over long-term benefits, despite knowing that this leads to worse outcomes. The ideal-advisor model requires her to use "correct reasoning" (e.g., exponential discounting) to overcome this flaw.
