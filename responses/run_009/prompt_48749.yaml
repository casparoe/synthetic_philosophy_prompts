prompt: |-
  I've been arguing with a coworker about Goodhart's law and I want to nail down what I actually believe about it, case by case, because my gut verdicts don't obviously add up to one principle.

  The cases, with my verdicts. The Soviet nail factory given a quota in tons that produces a few gigantic nails: clearly Goodhart, about as bad as it gets. A company paying programmers per bug fixed until someone starts planting bugs: also classic, but somehow feels different from the nails — there's an actual schemer involved. A hospital under a four-hour ER wait target that starts parking patients in hallways to stop the clock: bad, but less bad than if they'd ignored the target entirely, since some of the wait time genuinely got fixed. A school where teachers teach to a standardized test that's actually well-designed: I keep wanting to call this a win rather than a failure, even though it's textbook proxy-optimization. Evolution optimizing fitness: fine, no Goodhart anywhere in sight, though I can't say why, since evolution is about the most ruthless optimizer there is. And the case that bugs me most: a company that selects hires purely by top score on a skills test that only correlates maybe 0.5 with actual performance. Nobody games anything, there's no adversary, the test never changes — but the top scorer is probably partly just lucky that day, and I still think it counts as the proxy going wrong.

  My tentative principle: the damage from targeting a measure is proportional to how much of the proxy-goal link the optimization pressure itself destroys. The nails and the bugs fit it (the pressure severs the link). The teaching case fits if I say a good test barely gets damaged by pressure. But the hiring case is awkward — nothing gets destroyed, the imperfection was there all along, yet it still feels like Goodhart. And evolution doesn't fit at all unless I claim fitness isn't a proxy to begin with, which feels like cheating. Also, a friend keeps telling me people split this whole thing into like four flavors — one that's basically regression to the mean with no bad actor involved, one that's adversarial gaming, etc. — but honestly the labels seem to be doing work that the actual explanation should be doing.

  So what principle captures my verdicts, and which verdicts does it force me to drop? Please answer as exactly five numbered items, each a sentence or two, with no intro or conclusion: (1) your best principle, stated precisely; (2) the case that forces each clause of it; (3) which of my verdicts you'd overturn and why; (4) what the principle predicts for a city that just publishes average commute times every month — no rewards, no targets, only press coverage — does publication alone do any Goodhart damage?; and (5) same question for a school that keeps its exam secret so teachers literally cannot teach to it: does hiding the proxy beat the problem, or just postpone it? Keep it casual and don't bother with a reading list — I want the reasoning, not sources.
reasoning: |-
  Okay, let me try to work through this user's Goodhart's law dilemma. The user has described several cases with their intuitive verdicts and wants a unifying principle that captures all of them. 

  First, I notice the user's cases cover a spectrum: from extreme gaming (Soviet nails) to pure measurement noise (hiring test luck), with intermediate cases like ER wait times and teaching to tests. The evolution case seems special because it's a natural process. 

  The user's tentative principle about optimization pressure destroying the proxy-goal link explains some cases well but stumbles on the hiring example (where the imperfection is inherent) and evolution (where no "destruction" occurs). This suggests we need a broader definition of "damage" that includes both active gaming and passive statistical effects.

  Hmm, perhaps the key is distinguishing between two failure modes: active subversion (like planting bugs) versus passive overfitting to noise (like hiring lucky candidates). Both cause the proxy to diverge from the true goal, but through different mechanisms. The evolution case works precisely because there's no distinction between proxy and goal - fitness is the goal.

  For the commute time publication case, I suspect mere observation without incentives might still induce some behavioral changes, but likely minimal. Whereas hiding the exam prevents gaming but doesn't solve the core issue that any known metric will eventually be exploited if stakes exist.

  The user seems frustrated with taxonomy-for-taxonomy's-sake, so any principle should explain rather than label. Also, their hiring example reveals sensitivity to statistical artifacts - that even honest optimization can fail due to noise. This might require incorporating concepts like signal-to-noise ratio.

  Ultimately, a good principle should reframe "damage" as any process that amplifies the gap between proxy and true goal during optimization, whether through active gaming, passive overfitting, or simple measurement error. The Soviet nails show extreme gap amplification, while teaching to a robust test shows minimal gap growth.
answer: |-
  Here's the breakdown per your request:

  **(1) Principle:** Goodhart damage occurs when optimizing for a proxy measure systematically amplifies the gap between the proxy and the true goal, either by *actively corrupting* the proxy's meaning (gaming) or by *passively selecting* for aspects captured by the proxy that don't align with the goal (overfitting noise, rewarding irrelevant effort).

  **(2) Cases forcing clauses:**
  *   **"Actively corrupting"**: Forced by Soviet nails (quota destroys meaning of "tons of nails") and bug planting (directly corrupts "bugs fixed" as a measure of quality).
  *   **"Passively selecting... aspects that don't align"**: Forced by the hiring test (optimizing for top score selects for luck/measurement noise, not just skill) and potentially ER wait times (parking patients is effort misaligned with *quality* care).
  *   **"Amplifies the gap"**: Forced by evolution (fitness *is* the goal, no gap to amplify) and the good test (effort to teach *to* the well-designed *proxy* genuinely improves the *goal* of broad understanding).

  **(3) Overturned verdict:** The evolution verdict ("fine, no Goodhart") is overturned. The principle explains *why* it's fine: there's no distinct proxy separate from the goal itself ("fitness" *is* reproductive success). Goodhart requires a proxy distinct from the true goal whose link gets distorted under optimization pressure. Evolution isn't optimizing *for a proxy of* fitness; it optimizes *fitness* directly.

  **(4) Commute time publication:** Minimal to no Goodhart damage. Publication alone applies weak optimization pressure (reputational). While some individuals *might* slightly alter commutes to look better (e.g., shifting routes marginally, choosing off-peak reports), the lack of strong incentives (rewards/punishments tied *to the measure*) makes systematic corruption (like mass route falsification) or significant misaligned effort unlikely. The gap isn't *systematically amplified*.

  **(5) Secret exam:** Hiding the proxy *postpones* but doesn't *beat* the problem if high-stakes decisions (funding, jobs, reputation) are later *based on the results*. Once results are used for optimization (e.g., firing low-scoring teachers), the pressure reveals the *de facto* proxy (the exam content), enabling gaming or teaching to the (now inferred) test next time. If the results are *never* used for any optimization (pure anonymous audit), damage is avoided, but this is rarely practical.
