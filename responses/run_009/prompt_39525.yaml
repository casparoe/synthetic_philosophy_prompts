  grade it out of 10 for me? and more importantly give me the actual comments i can leave, like point by point -- what they got right, what's subtly off, and how badly each mistake should cost them. i want to be fair but not let stuff slide just because it sounds confident. the prof said half the points are for stating the theorem correctly and half for the evaluation part, if that helps with the breakdown.
