prompt: |-
  My friend Jordan and I have been arguing decision theory since the old Overcoming Bias comment threads, and after all these years her verdicts are pretty locked in. Standard Newcomb with a 99%-accurate Omega, million in box A vs a grand in box B: one-boxes, calls it obvious. Same setup but with a predictor who's only right 70% of the time: still one-boxes, which always struck me as kinda wierd but whatever. Transparent Newcomb where you can literally see the million sitting in box A: takes only A. Smoking lesion: she smokes, and when I pushed her on it she said something like she already knows whether she wants the cigarette before deciding anything, so the gene's correlation with her choice is screened off and only the correlation with the lesion is left to worry about. So her whole record is basically one-box whenever the money tracks a prediction, but smoke when the correlation runs through a common cause you already have private information about.

  Now she's finally agreed to adjudicate the one case we've never actually run past her, and I want to go in with a prediction I'm actually commited to. Omega flips a fair coin, shows you it landed tails, and asks for $100. Had it come up heads, Omega would have handed you $10,000 — but only if it predicted, back before flipping, that you'd hand over the $100 in the tails world. So she's standing there, coin is tails, wallet is out. Does she pay? My own read is that she's running something in the evidential family with that screening-off move doing real loadbearing work, and on this one there's no craving to screen anything off, so maybe she keeps the hundred — but I can also see her having quietly absorbed enough functional-decision-theory stuff from years of LessWrong threads to pay up. Give me a committed prediction, not a menu of options: tell me which rule best explains her entire record, what that rule says about the coin case, where my read has gone wrong if you disagree with it, and — since I get to pick the NEXT case we argue about — what case I should bring that would actually split the remaining candidate rules apart, if the coin case doesn't already do the job. And if you think her record genuinely underdetermines it, still pick the most probable rule and say why, and tell me exactly which detail of her past verdicts would have settled the question.
reasoning: |-
  Okay, let me tackle this problem step by step. The user has described their friend Jordan's decision theory stances across several classic thought experiments and wants to predict how she'd handle a new Omega coin scenario. 

  First, I need to map Jordan's existing positions to decision theory frameworks. Her one-boxing in standard Newcomb (99% predictor) points toward evidential reasoning - she acts as if her choice provides evidence about the prediction. The 70% accuracy case is interesting because most causal decision theorists would two-box there, but Jordan still one-boxes. That suggests she's not just following standard EDT and might have some FDT-like elements.

  The transparent Newcomb case is critical - taking only box A when she sees the money reveals she's not a pure updateless decision theorist. If she were, she'd take both boxes to incentivize Omega putting money in both. So she's not UDT. 

  The smoking lesion response is the most revealing. Her "I already know whether I want the cigarette" comment indicates she's screening off the genetic correlation through her current state. That's classic evidential reasoning with a twist - she's treating her present desire as sufficient evidence to break the lesion's correlation. 

  Now for the new coin scenario: Omega shows tails and asks for $100, where paying would only have gotten her $10,000 in the heads world if Omega predicted payment in tails. Since she's seeing tails, there's no causal link to the prediction - the prediction already happened. But evidentialists might still pay to "be the type who pays" across all possible worlds. 

  Given Jordan's history: 
  - She one-boxes in prediction scenarios (evidence matters)
  - But screens off pre-existing states (like in smoking lesion)
  Here, she has no pre-existing craving to screen off. However, the coin outcome (tails) is already known, similar to how she knew her desire state in smoking lesion. 

  I think she won't pay. Why? In transparent Newcomb, seeing the money made her take only A - she acted on current evidence rather than counterfactuals. Similarly here, seeing tails means the $10k is off the table regardless. Paying $100 now can't affect anything - there's nothing to screen off and no future consequence. 

  The best explanatory rule seems to be "evidential reasoning with local screening off": she conditions on all currently known information (desires, coin outcomes) when breaking correlations. 

  For a next test case, I propose a variant where Omega's prediction doesn't depend on her action but on a pre-existing trait she discovers during the decision. That would force her to clarify how far screening off extends.
answer: |-
  Based on Jordan's consistent pattern across scenarios, her decision rule is best explained as **Evidential Decision Theory (EDT) with a strong "screening-off" principle for known personal states**. This rule predicts she **will NOT pay Omega the $100** in the coin case. Here's the breakdown:

  ### Jordan's Rule Explained
  1.  **Core Principle:** She acts to maximize *conditional expected utility* given her current knowledge. Her choice provides evidence about the state of the world relevant to outcomes.
  2.  **The Screening-Off Twist:** When a *known personal state* (like her desire for a cigarette or the already-observed coin flip) correlates with both her choice and the outcome, she treats that state as fixed evidence. Her choice is then made conditional *only on that known state*, "screening off" the evidential link between her choice and the outcome that runs *through* that state.
  3.  **Manifestations:**
      *   **Newcomb (99%/70%):** One-boxes. Her choice provides evidence about Omega's past prediction/action. No known state screens this off.
      *   **Transparent Newcomb:** Takes only A. *Seeing the money* is the known state. It screens off the evidential link between her *choice* and Omega's prediction – she knows the money is there regardless of her choice *now*. She acts on the immediate evidence.
      *   **Smoking Lesion:** Smokes. Her *current desire* is the known state. It screens off the evidential link between her *choice* to smoke and the lesion. The gene correlates with both the lesion *and* her desire. Since she knows her desire *before* choosing, her choice no longer provides *additional* evidence about the gene/lesion beyond what her desire already tells her. She only worries about the direct causal link (smoking -> cancer).

  ### Prediction for the Coin Case
  *   **She WILL NOT pay the $100.**
  *   **Why:** The coin showing **Tails** is her **known state**. This screens off the critical evidential link:
      *   *Without knowing the coin state:* Paying provides strong evidence that Omega predicted she would pay, which would mean she gets $10,000 in the Heads world (which she *could* be in). Not paying provides evidence Omega predicted non-payment, meaning she gets $0 in the Heads world.
      *   *Knowing Tails:* The outcome ($10,000 in Heads) is already fixed and impossible to change. Her choice *now* (pay or not) provides **no evidence** about whether Omega predicted payment *back then*. Omega's prediction and the Heads outcome are in the past/fixed counterfactual relative to her decision point. The only thing affected by her choice is whether she loses $100 *right now* in the Tails world she knows she's in.
  *   **Analogy:** This mirrors Transparent Newcomb. Seeing Tails is like seeing the money in Box A. It makes the relevant past state (Omega's prediction/action in the Heads branch) fixed from her perspective. She acts solely on her known reality: she's in Tails, paying $100 gains her nothing and costs her $100.

  ### Where Your Read Went Wrong
  Your suspicion that she might pay due to absorbing FDT is understandable, but her Transparent Newcomb and Smoking Lesion responses are decisive counter-evidence:
  1.  **Transparent Newcomb Rejects Updatelessness:** FDT (and UDT) would two-box in Transparent Newcomb to "be the type of agent" Omega rewards. Jordan *doesn't*. She takes the visible money. This shows she doesn't base her decision on counterfactual identities or influencing predictors across branches; she acts on her current evidence *in this world*.
  2.  **Smoking Lesion Screening-Off is EDT-Centric:** Her "I already know my desire" move is a classic EDT screening-off maneuver to break the statistical link. FDT would typically refuse to smoke *even knowing the desire* to avoid correlating with the lesion-causing gene across possible worlds. Jordan *does* smoke. This reinforces she's focused on conditioning on known evidence *in her actual state*, not managing counterfactual correlations.

  **The Coin Case Doesn't Fully Split:** It *does* clearly separate EDT-with-Screening-Off (No Pay) from FDT/UDT (Pay). However, it *doesn't* cleanly distinguish her specific rule from a pure causal decision theory (CDT) stance in *this specific case* (CDT would also say Don't Pay - the payment causes a $100 loss with no causal link to the lost $10k). Her prior one-boxing, especially at 70%, already rules out CDT, so the coin case is consistent with her overall EDT pattern.

  ### The NEXT Case to Split Remaining Rules
  To definitively test her rule against a more FDT-leaning EDT or other nuances, propose this:

  **The "Pre-Commitment Reveal" Newcomb:**
  1.  Omega, 99% accurate, runs a standard Newcomb game ($1M in A iff predicted you one-box).
  2.  **Crucial Twist:** *Before* you choose, Omega reveals a sealed, timestamped document you wrote *yesterday*. The document states: "I, [Jordan], hereby pre-commit to one-boxing in Omega's test tomorrow."
  3.  Omega confirms the document is authentic and written by you prior to its prediction.
  4.  You now choose between one-boxing or two-boxing.

  *   **What Her Rule (EDT + Screening-Off) Predicts:**
      *   The *pre-commitment document* is now a **known state**.
      *   It strongly screens off the evidential link between her *choice now* and Omega's prediction. Omega predicted based on her pre-commitment state yesterday.
      *   Her choice now provides little/no *additional* evidence about the prediction or the contents of Box A. She knows Box A contains $1M iff she *pre-committed* to one-boxing (which the document proves she did).
      *   Therefore, she **two-boxes**. She takes both boxes because Box A is guaranteed to have $1M (due to her past commitment), and Box B has $1000. Her choice now doesn't change the prediction outcome.

  *   **What FDT/UDT Predicts:**
      *   She still **one-boxes**. The point is to *be* the type of agent who one-boxes *in this situation*, maintaining the correlation that allows predictors (like Omega) to reward her type. The pre-commitment is part of her decision algorithm; fulfilling it now reinforces the predictability that makes one-boxing work. Failing to fulfill it breaks the correlation.

  **Why This Splits Them:**
  *   Jordan's rule, relying on screening-off known states (the document proving pre-commitment), would lead her to two-box, maximizing utility based on the fixed evidence.
  *   FDT/UDT, focused on the counterfactual implications of her *decision algorithm* across possible worlds, would one-box to uphold the correlation that defines a "one-boxing agent."
  *   This directly targets the core difference exposed in her Transparent Newcomb choice (where she took only A, rejecting updatelessness) and the coin case (where she doesn't pay). If she two-boxes here, it confirms her strong reliance on conditioning *only* on her current evidence/state, screening off past commitments or counterfactual identities. If she one-boxes, it suggests a significant shift towards FDT reasoning.

  **Conclusion:** Jordan's record screams EDT with a robust screening-off principle for known personal states. This rule predicts **no payment** in the coin case. The Pre-Commitment Reveal Newcomb is the litmus test to confirm this against FDT-leaning interpretations. Go forth and resolve the last argument!
