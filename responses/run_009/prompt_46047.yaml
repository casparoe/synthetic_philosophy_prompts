answer: |-
  Below is a classification instrument in the form of a decision tree for your moral philosophy discussion on the binding force of promises. The tree uses **seven nodes** (diagnostic questions based on concrete cases) and routes through the five required cases (a–e), plus two additional cases to separate closely related views. Each node is a case students can answer without knowing which position it leads to, and the leaves cover the five standard positions with their "most awkward commitments" noted. 

  The tree is designed for first-year students—no jargon in nodes, and philosopher names only in leaf descriptions. Cases that do not cleanly separate views (e.g., expectation-based and deflationary views) are explicitly flagged as indistinguishable. Empty cells (answer combinations with no defended position) are noted and explained.

  ---

  ### **Decision Tree: What Makes Promises Binding?**  
  *Start at Node 1 and follow your answers to a leaf position.*  

  **Node 1: Gunpoint Promise**  
  You are forced at gunpoint to promise to hand over your wallet. Is this promise morally binding?  
  - **No** → Proceed to Node 2.  
  - **Yes** → **No standard position** (all views reject binding gunpoint promises; this combination is unexplored).  

  **Node 2: Castaway Promise**  
  Two strangers from unrelated societies are stranded on an island. One promises to share food, and the other relies on this. With no shared social practice of promising, is this promise binding?  
  - **No** → Proceed to Node 3.  
  - **Yes** → Proceed to Node 4.  

  **Node 3: Forgotten Promise**  
  You promised to help a friend move, but they forgot about the promise entirely. No one relies on you. Are you still bound?  
  - **No** → **Leaf A: Convention/practice-based view** (Hume/Rawls lineage).  
    - *Most awkward commitment:* Cannot explain binding promises without a social practice (e.g., the castaway case).  
  - **Yes** → **No standard position** (no view accepts forgotten promises as binding while rejecting castaway promises; likely incoherent).  

  **Node 4: Changed Circumstances Promise**  
  You promised to drive a friend to the airport. New road closures mean driving them would make them miss their flight, but texting now (breaching) would let them take a train and arrive on time. Performance harms the promisee; breach helps. Must you still perform?  
  - **No** → Proceed to Node 5.  
  - **Yes** → Proceed to Node 6.  

  **Node 5: Self-Release Promise**  
  You promised to water a neighbor’s plants. You changed your mind and no longer want to do it. Can you release yourself from this promise just by deciding not to keep it?  
  - **No** → Proceed to Node 7.  
  - **Yes** → **Leaf D: Voluntarist/autonomy view**.  
    - *Most awkward commitment:* Must explain why most promises *feel* binding even when the promisor later changes their mind.  

  **Node 6: Dying Promise with Release**  
  You promised a dying person to donate their savings to a cause they hate. They explicitly release you from the promise, then die. After their death, are you still bound?  
  - **No** → **Leaf B: Normative-power view** (Raz/Shiffrin lineage).  
    - *Most awkward commitment:* Must explain why binding promises can harm the promisee (e.g., the changed circumstances case).  
  - **Yes** → **No standard position** (no view accepts obligations surviving release and death; likely unattractive).  

  **Node 7: Uninterested Promisee**  
  You promised to wear green to an event to please someone, but they no longer care if you do. No one else is affected. Are you bound?  
  - **No** → **Leaf C: Expectation-and-reliance view OR Deflationary view**.  
    - *Note:* These views are **not distinguished** here. Both reject binding promises without reliance or moral stakes.  
    - *Expectation view’s awkward commitment:* Cannot explain binding promises no one relies on (e.g., forgotten promises).  
    - *Deflationary view’s awkward commitment:* Cannot explain the distinctive "moral force" of promises beyond general duties.  
  - **Yes** → **No standard position** (no view binds promisors to indifferent promisees; unexplored).  

  ---

  ### **Tree Summary**  
  - **Total nodes:** 7.  
  - **Required cases covered:**  
    - (a) Dying person’s release: Node 6.  
    - (b) Gunpoint promise: Node 1.  
    - (c) Castaways (no social practice): Node 2.  
    - (d) Changed circumstances (performance harms): Node 4.  
    - (e) Forgotten promise: Node 3.  
  - **Leaves:**  
    - **Leaf A:** Convention/practice-based view.  
    - **Leaf B:** Normative-power view.  
    - **Leaf C:** Expectation-and-reliance view OR Deflationary view (indistinguishable here).  
    - **Leaf D:** Voluntarist/autonomy view.  
  - **Empty cells flagged:** 3 (all explained as unexplored, incoherent, or unattractive).  

  ### **Key Notes for Discussion**  
  1. **Indistinguishable views (Leaf C):** Expectation-based and deflationary views often converge (e.g., both reject binding forgotten/unreliable promises). To separate them, you’d need cases involving general moral duties (e.g., "Is a binding promise just a special case of honesty?").  
  2. **Why no social practice?** Node 2 isolates the convention-based view, which uniquely requires a preexisting practice.  
  3. **Student-friendly design:** Cases avoid jargon and use everyday scenarios. Philosophers’ names appear only in leaves to contextualize, not in nodes.  
  4. **Limits embraced:** The tree flags where views overlap (Leaf C) and where answers lack a position (e.g., Node 3’s "yes" branch).  

  This tree encourages students to engage intuitions first and reveals how positions handle edge cases. Use it to spark debate on why promises *feel* binding—and where theories struggle!
