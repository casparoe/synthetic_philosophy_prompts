answer: |-
  An excellent thrust! I embrace the second horn: admissibility *is* itself vague. This doesn't undermine supervaluationism; it simply reveals that higher-order vagueness is real and must be accounted for within the framework. The cost? We must acknowledge a hierarchy of vagueness.  

  "Admissible" lacks sharp boundaries. Some precisifications are clearly admissible (e.g., drawing 'tall' at 1.8m), some clearly inadmissible (e.g., at 1.5m), and others are borderline admissible. Crucially, **this doesn't render supertruth "indeterminately defined" in a way that collapses our account.** Supertruth remains well-defined *relative to a fixed set of precisifications*. For a sentence S, "S is supertrue" means: *If* we fix a complete specification of admissibility (settling all higher-order vagueness), *then* S is true on every precisification deemed admissible *by that specification*.  

  The indeterminacy you note arises *when we haven't fixed the admissibility criteria precisely enough*. This is just further semantic indecision — indecision about *which* precisifications are admissible, not about the nature of truth or supertruth itself. We explain first-order vagueness (e.g., "tall") via indecision among precisifications. Higher-order vagueness (e.g., "admissible") is explained by indecision about *which criteria* govern admissibility. The core model replicates at higher levels.  

  *Controversial flag:* This relies on the claim that truth/supertruth is always determinate *once a context fixes all relevant precisifications (including for 'admissible')*, even if the *choice* of context is indeterminate. The objection presses whether this "context fixing" merely postpones the boundary problem. I maintain it captures the genuine, layered structure of vagueness. Your riposte?  

  *(Holding firm: Vagueness is always indecision, never ignorance of a sharp fact.)*
