prompt: |-
  I'm drafting a paper on the Knobe effect — the asymmetry whereby people are much more willing to say that a chairman who knowingly accepts a harmful side effect in pursuit of profit harmed the environment intentionally than they are to say that an otherwise identical chairman who knowingly accepts a helpful side effect helped it intentionally — and before I engage with any particular explanation, I want the specification a theory of the asymmetry would have to meet. Produce that specification as a numbered list of exactly five desiderata, with no introduction and no concluding remarks: nothing but the five items.

  Each item should be a sentence or two stating the requirement and the case or consideration that motivates it. In deciding what makes the list, weigh candidates like these, but treat them as candidates rather than as settled: an adequate theory should explain not just the harm/help asymmetry but its apparent fragility — my own pilots suggest the gap shrinks when the agent is a low-level employee rather than an executive with authority over the outcome, which would mean the folk concept tracks role and power as much as intention, and I want to know whether that kind of sensitivity is something a theory must accommodate or evidence the effect is an artifact of vignette design; it should say whether the asymmetry reflects something right about the concept of intentional action (say, its connection to accountability) or a bias that a cleaned-up concept would discard; it should cover the unchosen-helping cases, where the agent cares nothing for the benefit he happens to bring about; and it should not contradict what you actually know of the replication record, cross-cultural or developmental, without pretending to more precision about that literature than you have. You may include desiderata not on this list and exclude ones on it — the interesting part of the exercise is the choosing, since the count is fixed at five.

  Because I intend to hold candidate theories to whatever list you give me, I need your epistemic housekeeping built into the list itself: within each item, include a brief note of how confident you are that it is a genuine requirement on any adequate theory rather than a prejudice of one research camp, and explicitly mark, within whichever item it belongs to, the single desideratum you are least sure of, with one line on what would change your mind about it. Do not add a sixth item, a summary, or any text outside the five numbered entries.
reasoning: |-
  Hmm, the user is drafting a paper on the Knobe effect and wants a specification of five desiderata that any theory of the asymmetry must meet. They've provided some candidate considerations but want me to create a definitive list with specific requirements. I need to make sure the list is exactly five items, with no extra text, and each item should include a confidence note and identify the least certain one.

  The Knobe effect is that asymmetry where people judge harmful side effects as more intentional than helpful ones. From the user's message, key points to cover include: explaining the core harm/help asymmetry, accounting for fragility like the role of agent power (e.g., executives vs. low-level employees), addressing whether it's part of the concept of intentional action or a bias, covering cases where the agent doesn't care about the benefit, and not contradicting known replication findings across cultures or development.

  I should draw from the candidates but not be limited by them. The user mentioned their pilot data showing the gap shrinks with low-level employees, so that must be included as a motivator. Also, the unchosen-helping cases are important—where the agent is indifferent to the help. And I have to handle epistemology within each item: state confidence levels and mark the least certain desideratum with what could change my mind.

  Now, brainstorming possible desiderata: 1) Explain the basic asymmetry in judgments. 2) Account for fragility, like agent role effects. 3) Address whether it's conceptual or bias. 4) Cover unchosen-helping cases. 5) Fit with empirical data on replications. That fits five, but I need to refine them based on user's emphasis.

  For confidence notes: I'm highly confident on the core asymmetry and empirical consistency, as those are well-established. Less confident on the fragility point because it might be a design artifact, and I'd change my mind with more rigorous studies showing it's robust. For the conceptual vs. bias question, confidence is medium—it's debated in philosophy, but theories should take a stance. Unchosen-helping should be included with high confidence since it's a standard test.

  Structuring each item: Start with the requirement, then the motivating case, and end with confidence. For the least certain one, I'll pick the fragility point about agent role, as per user's pilots, and note that replicated findings across methods could change my mind.

  Finally, ensure the list is numbered exactly five, concise, and no fluff. Here's how I'll lay it out.
answer: |-
  1. Any adequate theory must explain the core harm/help asymmetry: why judgments of intentionality are consistently stronger when the side effect is harmful (e.g., harming the environment for profit) than when it is helpful (e.g., helping the environment for profit), given identical awareness and indifference. (High confidence; this is the defining phenomenon replicated across numerous studies.)

  2. The theory must account for the apparent fragility or sensitivity of the asymmetry to contextual factors, such as the agent's role and power (e.g., reduced gap when the agent is a low-level employee lacking authority over the outcome), explaining why these factors modulate the effect without dismissing it as a mere vignette artifact. (Lower confidence; fragility details are less established. Confidence would increase if robust, methodologically diverse studies consistently replicate specific modulations like role/power.)

  3. It must explicitly address whether the asymmetry reflects a constitutive feature of the folk concept of intentional action (e.g., tied to accountability norms) or a performance error/bias potentially separable from a philosophically refined concept, clarifying the effect's implications for understanding intentionality itself. (Medium confidence; the debate is central but unresolved. Confidence hinges on the theory's coherence with broader conceptual analysis.)

  4. The theory must explain "unchosen-helping" cases where the agent is indifferent to a beneficial side effect and actively prefers it *not* to occur, yet intentionality judgments remain low compared to parallel harmful cases, demonstrating the asymmetry persists even when the agent lacks positive attitude towards the help. (High confidence; these cases robustly show the effect isn't reducible to perceived desire for the outcome.)

  5. The theory must be consistent with the established empirical record concerning replication and variation, including the effect's presence (though potentially varying in magnitude) across diverse cultures and its emergence in simplified forms in young children, without requiring universal invariance or contradicting well-replicated findings. (High confidence; cross-cultural and developmental data constrain viable explanations.)
