prompt: |-
  I'm in a bioethics class right now and we just did the week on the therapy/enhancement distinction, and honestly the line I claim to have is a mess and I want to figure out if there's actually a principle behind my gut reactions. Here are my verdicts, going on instinct:

  - Statins for someone with dangerously high cholesterol: clearly therapy.
  - Growth hormone for a kid with a diagnosed hormone deficiency: therapy.
  - Growth hormone for a short-but-healthy kid who just wants to be taller: enhancement, and I feel way more uneasy about it.
  - Ritalin for someone with an ADHD diagnosis: therapy.
  - A med student without ADHD taking the same dose to study for boards: enhancement, not okay-ish, but I can't explain why it feels different from the next one.
  - A violinist taking a beta-blocker before an audition to stop hand tremors: totally fine, even though she has no condition at all.
  - LASIK taking someone from 20/200 to 20/20: therapy.
  - LASIK-like tech taking someone from 20/20 to 20/10 (better than normal vision): enhancement, and mildly weird to me.
  - A prophylactic vaccine for a perfectly healthy person: fine, and I want to call it therapy even though there's nothing to treat, which seems like it should break my definition.
  - Caffeine for grogginess: not even a moral question, just breakfast.
  - Modafinil for the same grogginess: enhancement, slightly suspect.

  So my questions: is there one principle that gets all or nearly all of these, and where's the inconsistency? The beta-blocker vs Ritalin pair is the one that bugs me the most -- same mechanism, treating neither person has a "condition" (well, unless you count performance anxiety, but then why doesn't exam stress count for the med student?), totally different gut reactions. And the vaccine thing seems like it might force me to say the distinction isn't about "treating disease" at all.

  Once you've got a principle (or a couple of candidates), please give me your output as a JSON object with these fields:

  - "principle": the best statement of the principle, in one or two sentences
  - "clauses": an array of objects, each with "clause" (a component of the principle) and "motivating_cases" (which of my verdicts that clause is there to capture)
  - "new_case_verdicts": an array of objects with "case" and "verdict" for at least three cases I didn't mention (e.g., antidepressants for a healthy person who wants to be "better than well," gene editing to remove a disease gene in an embryo, or anabolic steroids for a manual laborer whose job isn't competitive sport) — say what the principle predicts for each
  - "overturned_verdicts": which of my original verdicts, if any, the principle can't accommodate, and why
  - "runner_up_principle": the second-best candidate and one case where it diverges from the best one
  - "would_change_mind": what argument or kind of case would make you abandon the top principle or switch to the runner-up, and where you think your reasoning here is most likely to go wrong

  Don't just split the difference to be diplomatic -- if my intuitions are actually incoherent, tell me which ones to throw out. But flag your confidence honestly, since this is for a paper I have to defend in section.
