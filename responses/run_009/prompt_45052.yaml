  The disagreements table is trickiest. For each point, I need phrasing where both camps would say "yes, that's my position." Take desert: compatibilists see it as earned through rational agency, skeptics call it incoherent. Neither feels strawmanned here. The Moral Agents Club metaphor gets its own row - Dennett would nod at the "regulatory fiction" description, Caruso at "obscures harm."

  Cruxes are where real work happens. The user suspects basic desert is the main divide. Right - so I structure it as a normative question (is desert real?) and an empirical one (do folk practices track desert?). For each, I note what evidence both sides would accept as relevant. Like compatibilists predicting psychological studies will show folk blame aligns with control conditions, skeptics expecting retributive impulses. 

  Wait - is any part purely verbal? The user specifically asked. I think "deserve" usage is close, but not quite. Compatibilists stretch the word to include forward-looking elements; skeptics insist on pure backward-lookingness. That's substantive, not semantic. Better note the partial overlap though.

  Length check: two pages is tight. I'll keep claims concise, use a table for efficiency, and bullet cruxes. Should land around 1000 words. 

