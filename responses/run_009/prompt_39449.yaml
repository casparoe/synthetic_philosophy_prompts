prompt: |-
  I'm an undergrad in my third year, currently doing a module on formal epistemology (mostly Bayesianism, decision theory, a bit of computability stuff at the end). We just had a lecture on logical uncertainty that basically blew the module open for me — the idea that you can have credences in mathematical claims you haven't proven, and that ordinary probability theory gets weird about it, since assigning anything other than 0 or 1 to a provable sentence looks like it violates the probability axioms if consequence is closed under logical entailment. My lecturer mentioned logical induction as the big recent-ish result, where an trader-style dutch book argument is used to give an "efficient" notion of inductively learning logical facts, and she said the field is basically a list of open problems stapled together.

  Here's my situation: I need to pick one term essay question (~5000 words, due end of term) out of the module's open-problem list, and I'd rather pick well than fast. So what I want from you is a prioritised take on the open questions in logical uncertainty — which ones most deserve 5000 words from someone with my background (comfortable with basic probability and computability, NOT comfortable with heavy proof theory or advanced measure theory), and crucially, why that order.

  Some candidate questions I've jotted down so we're on the same page, though tell me if I've misframed them or missed the important ones:

  1. Is logical uncertainty a genuinely different kind of uncertainty from ordinary empirical uncertainty, or is it just ordinary uncertainty about my own future computation / which proof I'll stumble on first? (There's a version of this I keep circling: if I'm uncertain whether a sentence is provable, and provability is a fact about a formal system, in what sense am I uncertain about a fact rather than about my own computational limits?)
  2. Whether the dutch book / trading arguments used to justify logical induction actually justify the credences they output, or whether they just show the system won't be exploited — i.e. is non-exploitability enough for rationality here, or do we need more (calibration, coherence with counterfactuals, whatever)?
  3. How logical uncertainty should interact with decision theory — e.g. if I'm uncertain about a logical fact that determines the output of my own decision procedure, does anything like updatelessness or self-trust break?
  4. Whether "efficiency" (learning a logical fact shortly after it becomes cheap to discover) is doing all the interesting work, such that the whole framework quietly assumes what it was supposed to explain.

  For the ranking I want the reasoning, not just the list: for each question, what's actually upstream vs downstream of the others, whether it's tractable at 5000 words without specialist background, and what would make a term-essay-length answer defensible versus hopelessly hand-wavy. Also be blunt about which of these is a trap for someone like me — a question that sounds doable but where the real work is in the technical machinery I don't have. If you think there's a better question that isn't on my list, say so and slot it into the ranking.

  Please write the answer in American English (I know, ironic given how I write, but the essay has to be in American English so I want everything consistent). And no reading lists or citations needed — I've got the module reading, I just need the prioritised thinking. Oh and if it matters for the framing: I found the computability lectures way more fun than the dutch book ones, in case that biases which question suits me.
