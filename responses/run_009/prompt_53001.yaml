prompt: |-
  I'm taking a grad seminar on formal epistemology (it's cross-listed with econ, decision theory folks show up and it gets heated), and my term paper is on the common prior assumption — the move in Harsanyi-style models where you say all agents start from one prior and any disagreement in their posteriors comes from different private information. My professor's one comment on my abstract was basically "the interesting question isn't whether the assumption is true, it's what would even count as a justification of it," and now I'm stuck because I realize I don't actually know the bar. Before I read another paper arguing for or against it, I want the spec: what would any adequate justification of the common prior assumption have to deliver? Some things I think belong on the list but am not sure how to weigh — it has to vindicate (or at least explain away) the no-trade/agreement results that depend on it, it has to say something about dogmatic priors where an agent puts zero probability on a state and no amount of the other side's evidence can move them, and it has to face the merging-of-opinions issue, since the people who defend common priors often lean on the thought that rational agents' posteriors converge, and that thought seems to smuggle the assumption in again.

  There's also a move a friend of mine keeps pushing that I want you to take seriously even though I can't find it anywhere in the literature: treat two agents' different priors as if they were posteriors from a common prior conditioned on private facts about their own introspective access — like, each agent "knows" something about how their own mind reacts to evidence that no one else can observe, so the priors weren't really common-and-violated, they were posterior-and-conditioned. I genuinely can't tell whether that's a neat justification or a renaming of the problem. And it matters to me that the spec handles the "different priors are just like different utilities" analogy, since the standard reply is that priors are supposed to be about the world while utilities are about you, and I want the list to say whether that distinction is a real requirement or just a camp prejudice.

  So: act as a formal epistemologist who's thought way too much about priors, and please start with a bit of brainstorming before you settle on the list — think about what justifications are even available (normative idealization for equilibrium analysis, Harsanyi's own line about attributing disagreement to information, that kind of thing) and then derive the desiderata from what those justifications need. Give me the requirements with the motivating case behind each one, mark which are genuinely non-negotiable and which are preferences of one camp dressed up as demands, and — this is the part I most want — tell me if any subset of the desiderata is jointly unsatisfiable, because I suspect it is (normative force for the assumption seems to conflict with respecting the empirical fact that actual disagreement isn't all information-driven, but I might be confusing levels here). Also flag which single requirement knocks out the most proposed justifications, and tell me honestly whether my friend's introspection trick survives the list. Please also distinguish, somewhere early, between "good enough to use in a model" and "good enough as a claim about ideal rationality," because I suspect adequacy is relative to that choice and my paper needs to pick one. Take your time with this, I'd rather have it right than fast.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're working on a term paper about the common prior assumption (CPA) in formal epistemology, specifically in Harsanyi-style models. Their professor pointed out that the key question isn't whether CPA is true but what would justify it. The user feels stuck because they don't know the criteria for such a justification. They mention several issues: no-trade theorems, dogmatic priors, merging of opinions, and their friend's introspection argument. They also want to address the analogy between different priors and different utilities.

  First, I need to recall what the CPA entails. It assumes all agents start with the same prior probability distribution and update based on private information. Disagreements arise only from differing information, not initial beliefs. The user's challenge is to figure out what a justification for this assumption must achieve.

  The user lists several points their justification needs to cover: vindicating no-trade/agreement results, handling dogmatic priors, addressing merging-of-opinions, and evaluating their friend's introspection idea. They also mention the priors-vs-utilities analogy. 

  I should start by brainstorming possible justifications. Normative idealization is one—CPA simplifies models to focus on information asymmetry. Harsanyi's original argument posits that disagreements stem from information differences. Then there's the friend's introspection argument, treating priors as posteriors from private introspective data. But is that a solution or just relabeling the problem?

  Next, the user wants desiderata for an adequate justification. They need criteria that any justification must meet. Let me list potential requirements:

  1. **Explaining Agreement/No-Trade Theorems**: CPA underpins results like no-trade theorems. A justification must show why these results hold under CPA, even if real-world agents violate it. This is crucial for models but maybe not for rationality claims.

  2. **Handling Dogmatism**: If an agent assigns zero probability to a state, no evidence can change their mind. Justification must address whether such priors are rational or if CPA avoids them. This touches on epistemic rationality norms.

  3. **Merging of Opinions**: Proponents argue rational agents' beliefs converge with evidence. But does this assume CPA? Justification needs to clarify if merging supports CPA or presupposes it.

  4. **Introspection Argument**: The friend's idea frames different priors as posteriors from private introspective data. But this might push the problem back—what's the common prior before introspection? Also, how does this affect merging? If introspective data is private, beliefs might not converge.

  5. **Priors vs. Utilities**: Utilities are subjective; priors are about the world. A justification must clarify if priors are objective or if the distinction is artificial. This affects whether different priors are permissible like different utilities.

  The user suspects some desiderata conflict. For example, normative force vs. empirical disagreement. If CPA is an idealization, it doesn't need empirical accuracy, but if it's about rationality, it must handle real disagreements. Also, the introspection trick might conflict with merging if private data prevents convergence.

  I need to flag which requirements are non-negotiable. For model adequacy, explaining agreement theorems is key. For rationality, handling dogmatism and merging are crucial. The introspection argument might not resolve the issue but reframes it. The priors-utilities distinction might be a camp preference; some formal frameworks treat beliefs and desires symmetrically.

  The user's deeper needs: They want a clear framework to evaluate justifications, identify conflicts, and determine if CPA can be defended. They also need to decide whether their paper focuses on models or rationality. The unanswered question is whether any justification satisfies all desiderata, especially if merging and introspection conflict. Highlighting trade-offs will help them structure their paper.
answer: |-
  Here's a systematic breakdown tailored for your term paper, drawing on formal epistemology, decision theory, and the foundational debates around the Common Prior Assumption (CPA). I'll start with a brainstorm of justification strategies, then derive a structured list of desiderata, evaluate their negotiability, identify tensions, and assess your friend's argument. The key is distinguishing **model adequacy** (usefulness for analysis) from **rationality justification** (normative force for ideal agents).

  ---

  ### **Brainstorm: Justification Strategies**
  1. **Harsanyi's Original Justification**: Disagreement *must* stem from differential information if agents are rational. Priors represent "innate" beliefs before *any* evidence, so differences imply irrationality or hidden information.  
  2. **Normative Idealization (Economic Modeling)**: CPA isn't "true," but it isolates the effects of asymmetric information in equilibrium analysis (e.g., no-trade theorems). Without it, models become intractable or vacuous.  
  3. **Convergence Arguments (Merging of Opinions)**: Rational agents with common priors converge with shared evidence (Blackwell-Dubins). CPA is *necessary* for guaranteed consensus, so it's a prerequisite for ideal disagreement resolution.  
  4. **Introspective Expansion (Your Friend's Trick)**: Priors are *not* primitive; they are posteriors conditioned on private "access facts" (e.g., "I am biased toward X"). A meta-common prior over minds generates apparent prior diversity.  
  5. **Pragmatic Virtue**: Models with CPA yield sharper predictions (e.g., in mechanism design). Justification is instrumental: it works.  
  6. **Epistemic Neutrality**: Priors are "inductively blank" (e.g., uniform over a partition). Differences then reflect arbitrary conventions, not substantive disagreements.  

  ---

  ### **Desiderata for an Adequate Justification**
  *I rank these by non-negotiability for **rationality justifications** (✔️). For **model adequacy**, some soften to "useful" (#1, #5) or "avoid fatal flaws" (#2, #3). Tensions flagged in italics.*

  1. **🔹 Explain Agreement/No-Trade Theorems**  
     - *Requirement*: Justification must clarify why CPA is *necessary* for results like "no agreeing to disagree" or "no speculative trade under common knowledge of rationality."  
     - *Motivation*: CPA is foundational for these results. If a justification undermines them, it defeats a core purpose of the assumption.  
     - *Negotiability*: ✔️ Non-negotiable for **model adequacy**. For **rationality**, it must at least explain why these theorems *should* hold for ideal agents.  
     - *Knocks out*: Justifications that treat priors as purely subjective (like utilities) struggle here.  

  2. **🔹 Handle Dogmatism & Zero-Priors**  
     - *Requirement*: Address whether assigning zero probability to possible states is irrational or compatible with CPA. Must explain how CPA avoids (or accommodates) irrevocable disagreement.  
     - *Motivation*: Dogmatism violates Bayesian conditioning and blocks merging of opinions. CPA defenders often claim it prevents "unreasonable" priors.  
     - *Negotiability*: ✔️ Non-negotiable for **rationality justifications** (dogmatism conflicts with epistemic humility). For **models**, it’s a preference for tractability.  
     - *Knocks out*: "Pragmatic virtue" justifications if dogmatism is empirically common.  

  3. **🔹 Cohere with Merging-of-Opinions**  
     - *Requirement*: Justification must not *presuppose* CPA to argue for convergence. Must clarify the relationship: does CPA enable merging, or does merging justify CPA?  
     - *Motivation*: Pro-CPA arguments often invoke merging ("rational agents *would* agree with enough evidence"). But merging *requires* absolute continuity (no zero-priors), which CPA ensures.  
     - *Negotiability*: ✔️ Critical for **rationality**. Less vital for **models** (merging is asymptotic; short-run disagreement is fine).  
     - *Tension*: *Rationality-focused justifications risk circularity if merging assumes CPA*.  

  4. **🔹 Distinguish Priors from Utilities**  
     - *Requirement*: Justification must address whether priors are "world-facing" (cognitive) vs. utilities "agent-facing" (conative). If priors are like utilities, CPA loses normative force.  
     - *Motivation*: Utilities are uncontroversially subjective; priors are defended as objective (e.g., "rational prior"). The analogy threatens CPA's epistemic status.  
     - *Negotiability*: ⚠️ Camp-dependent. **Objectivists** (e.g., objective Bayesians) see this as non-negotiable; **subjectivists** deem it a prejudice.  
     - *Knocks out*: "Priors-as-utilities" views unless they redefine rationality.  

  5. **🔹 Empirical Plausibility Bridge**  
     - *Requirement*: Explain why real-world disagreement (e.g., politics, religion) *appears* prior-driven, not information-driven. Cannot dismiss this as "mere irrationality."  
     - *Motivation*: CPA is descriptively false; justification must reconcile this with normative claims.  
     - *Negotiability*: For **rationality**, it must *explain away* empirical discord (e.g., via biased updating). For **models**, optional (idealization is explicit).  

  6. **🔹 Avoid Regress or Trivialization**  
     - *Requirement*: Justification shouldn’t relocate the problem (e.g., pushing disagreement to a meta-level). Must not reduce CPA to tautology ("agents agree if they agree").  
     - *Motivation*: A common critique: CPA is unfalsifiable if "hidden information" always explains disagreement.  
     - *Knocks out*: Naive versions of your friend's introspective argument.  

  ---

  ### **Tensions & Joint Unsatisfiability**
  - **Major Conflict**: *Normative force vs. Empirical disagreement*.  
    - CPA as a requirement of ideal rationality (#2, #3, #4) clashes with the persistence of prior-driven disagreement (#5). If rationality *demands* CPA, actual agents are systematically irrational. Justifications must either:  
      - Argue real disagreement *is* information-driven (empirically dubious),  
      - Retreat to model adequacy (sacrificing normative force), or  
      - Redefine rationality (e.g., bounded cognition).  
  - **Secondary Conflict**: *Merging vs. Introspection*.  
    - If priors encode private access facts (#4), merging may fail—introspective data isn't shareable. This undermines convergence-based justifications (#3).  

  ---

  ### **Assessing Your Friend's Introspection Trick**  
  - **The Argument**: Treat agents' priors as \( P(\cdot | \theta_i) \), where \(\theta_i\) is private introspective data (e.g., "my cognitive biases"). A meta-prior \( P(\cdot) \) is common.  
  - **Strengths**:  
    - Rescues CPA formally: differences are "information-driven" (now \(\theta_i\) is the info).  
    - Explains dogmatism: \(\theta_i\) could include "I ignore evidence against X."  
  - **Weaknesses against Desiderata**:  
    - **#6 (Regress)**: What justifies the *meta-prior*? If \(\theta_i\) is innate, disagreement reappears.  
    - **#3 (Merging)**: Introspective data \(\theta_i\) isn't communicable, so merging fails. Posteriors need not converge.  
    - **#4 (Priors vs. Utilities)**: \(\theta_i\) blurs the line—priors now include "self-knowledge," making them more utility-like.  
    - **#5 (Empirical Plausibility)**: Does little to explain polarization; may overfit.  
  - **Verdict**: Elegant but incomplete. It *renames* the problem unless paired with a theory of shared meta-rationality. Survives as a formal dodge but fails as a full rationality justification. Best for **model adequacy**.  

  ---

  ### **Which Desideratum is the Killer?**  
  **#3 (Merging-of-Opinions)** is the silent assassin. It's central to pro-CPA rhetoric but:  
  - Presupposes absolute continuity (which CPA ensures), creating circularity.  
  - Conflicts with introspective justifications (no merging of private access facts).  
  - Fails empirically, undermining CPA's normative promise.  
  *Knocks out*: Convergence-based defenses unless they assume bounded awareness or logical omniscience.  

  ---

  ### **Recommendations for Your Paper**  
  1. **Pick a Target**: CPA's justification depends on whether you defend it for:  
     - **Models**: Desiderata = #1 (essential), #2/#5 (manageable). Justification = pragmatic/normative idealization.  
     - **Rationality**: Desiderata = #1–#5 (all relevant). Justification likely requires rethinking rationality (e.g., as consistency in Harsanyi's "type spaces").  
  2. **Focus on the Tension**: Argue that no justification satisfies all desiderata for *rationality*. Model-based defenses avoid this but concede normative weakness.  
  3. **Use the Introspection Trick Sparingly**: It’s a clever formal move but doesn't resolve deeper issues. Cite it as a "hidden variable" approach (similar to Harsanyi type spaces).  

  **Key References**:  
  - Aumann (1976) - Agreement theorem & CPA defense.  
  - Morris (1995) - CPA as tautology critique.  
  - Halpern (2002) - Merging with CPA vs. without.  
  - Bonnay & Cozic (2023) - Introspective priors (closest to your friend's idea).  

  Let me know if you want to drill deeper into a specific justification or tension! This is the heart of formal epistemology – good luck with the heated seminars.
