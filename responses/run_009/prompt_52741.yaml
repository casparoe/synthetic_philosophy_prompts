answer: |-
  Below is a reasoned analysis of your situation through the lens of the voting paradox, followed by the structured summary.

  ---

  ### Core Analysis: The Paradox and Your Decision
  The paradox arises because the *instrumental value* of your vote (its expected effect on the outcome) is negligible in large elections, yet people vote due to *non-instrumental factors*: civic duty, expressive identity, or group solidarity. In your city (80k voters, ≈52–48 race), the probability your vote decides the election is ≈1/10,000 (based on binomial models of close elections). Even if you value your candidate’s win at $10,000, the expected instrumental value of voting is ≈$1. Meanwhile, your 40-minute cost during a work deadline is substantial (e.g., lost productivity/stress valued at >$50). **Purely instrumentally, you should not vote.**

  **However, non-instrumental factors dominate:**  
  - **Civic Duty:** Voting affirms democratic norms. Abstaining erodes collective action.  
  - **Expressive Identity:** Voting signals your values to yourself and others.  
  - **Close Election Effect:** While improbable, your vote *feels* more meaningful in tight races, amplifying duty.  
  - **Minimal Threshold:** Costs below ~2 hours rarely deter voters; 40 minutes is below this threshold for most.  

  **Verdict: You should vote.** The civic duty and expressive benefits outweigh the moderate cost, especially in a close election where your participation reinforces legitimacy. Skipping due to work pressure sets a precedent for future abstention.

  ---

  ### Side Issue 1: The Vote Swap  
  Your friend offers to vote for your preferred long-shot candidate in her non-competitive city if you vote in your competitive race.  
  - **Instrumental Rationality:** This *increases* expected utility. Your vote has higher marginal impact in your city (close race) than hers (foregone conclusion). Her vote for your candidate in her city has near-zero impact, but your vote’s value is amplified.  
  - **Non-instrumental Problems:**  
    - **Commodification:** Treating votes as tradable goods undermines their expressive/duty-based value.  
    - **Slippery Slope:** Normalizes strategic devaluation of votes in "safe" jurisdictions.  
    - **Trust Issues:** Unenforceable; relies on goodwill.  

  **Verdict: Unsound.** While instrumentally efficient, it reduces voting to a transactional act, corrupting its civic essence. An ordinary trade (e.g., swapping chores) lacks this moral weight.

  ---

  ### Side Issue 2: The Raffle Incentive  
  City clerk raffles prizes for "I Voted" stickers.  
  - **The Paradox’s Implication:** Instrumental rationality alone *would* cause collective inaction. Small nudges (like raffles) counteract this by adding low-cost instrumental benefits (e.g., a chance to win a $50 gift card), tipping the scale for marginal voters.  
  - **Legitimacy vs. Corruption:**  
    - **Benign:** Addresses rational abstention without coercion. Similar to free coffee at polls.  
    - **Not Corrupting:** Unlike vote-buying, it rewards *participation*, not a specific choice.  
    - **Framing Issue:** Critics confuse "trivializing" duty with pragmatism. Democracy needs mechanisms to sustain participation.  

  **Verdict: Benign.** It is a low-stakes nudge that mitigates the paradox’s collective action problem. Calling it "corrupting" overstates the risk; it reframes voting as a social good worth celebrating.

  ---

