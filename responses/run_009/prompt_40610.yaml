prompt: |-
  I've been keeping a running list of my gut verdicts on weakness-of-will type cases, trying to figure out if there's one principle behind them or if I'm just being inconsistent. Hoping you can help, since you seem to be the person to ask: act like a professional philosopher who works on action theory and also knows the behavioral econ literature on discounting, and think carefully before answering — maybe actually brainstorm two or three candidate principles and tell me why you settled on the one you did, rather than just announcing a winner.

  Here are my verdicts. A smoker who genuinely believes quitting is best, craves a cigarette, and lights up anyway: weak-willed, clearly. Someone who takes $50 now over $60 next week while telling you they know the $60 is the smarter pick: also weak-willed, I guess, but it feels weird to call it the same thing as the smoker — no "battle" happened, they just... picked. A vegetarian who ordered the veggie option but eats the chicken when it arrives by mistake and it's delicious: weak-willed, but barely, almost fine. A guy who hates mornings, sets a 6am gym alarm fully believing he'll go, hits snooze, and then at 6:15 sincerely judges that sleep matters more for his life than the gym: I keep flip-flopping. At 8pm he judged one thing, at 6:15 he judges the opposite, and both judgments seem genuine. Is this akrasia or just a person whose judgments legitimately vary with state? Someone clinically depressed who judges they should shower and can't make themselves do it: I really don't want to call this weakness of will, but I can't say why it's different from the smoker, since both know what's best and fail to do it. A woman at 25 who cashes out a pension early because her 25-year-old self genuinely prefers it, even though her 65-year-old self will wish she hadn't: not akrasia at all, just preference change over time — but then why does the $50-now case count against the person's future self and this doesn't? And pigeons that reliably pick the small-soon food reward: obviously not weak-willed, pigeons don't have better judgments to betray — which seems to mean the discounting behavior itself can't be what makes something akrasia, or the pigeons would be off the hook only by accident.

  My tentative principle, which I don't trust: weakness of will is acting against the preference that would win under cool reflection with full information. It handles the smoker and the $50 case, gets the depressed person off the hook (maybe her cool reflection endorses the shower but something else is blocking action?), but the morning guy seems to break it — his 6:15 reflection IS cool-ish, it's just different from his 8pm one. And I have no idea whether it says the vegetarian eating the arriving chicken is fine or not.

  So: is there a principle that saves all or nearly all my verdicts, and if not, which ones should I give up? Tell me what the best principle (yours or a repaired version of mine) predicts about one case I deliberately haven't given my verdict on: a student who resolves Sunday night not to pull an all-nighter before exams, does it anyway, regrets it sincerely every single Monday morning, and keeps doing it for four years — akrasia, or a stable higher-order preference for something she won't admit she values? Please keep the whole answer under 600 words, tight but complete.
reasoning: |-
  Okay, the user is grappling with weakness of will across various scenarios, trying to find a unifying principle. Let me start by listing their cases and their verdicts. The smoker, the $50-now person, and the vegetarian are seen as weak-willed, but with varying degrees. The morning gym person is a flip-flop case. The depressed individual shouldn't be labeled weak-willed, and the pension case isn't akrasia. Pigeons aren't considered because they lack judgment.

  The user's tentative principle is acting against cool, informed reflection. But the morning gym case challenges that because both judgments (8pm and 6:15am) seem valid. How to reconcile? Maybe the key is whether the later judgment is influenced by temporary states like fatigue, which distort reasoning. That's a common point in action theory. For the depressed person, their inaction isn't due to judgment reversal but motivational deficits, so it's different from akrasia. The pension case involves genuine preference change over time, not a temporary state.

  The student case is a test. If she regrets it every Monday but repeats, that suggests a conflict between her reflective judgment and immediate impulses. The regret indicates she still endorses the Sunday resolution, so it's weakness of will. Temporary factors (stress, exhaustion) during the exam period override her better judgment. 

  Need to ensure the principle accounts for all cases. The smoker's craving is a temporary state overriding their better judgment. The $50 case is similar, where the immediacy skews the decision. The vegetarian barely weak-willed because the temptation is mild, but still acting against their standing commitment. The morning gym person: if the 6:15 judgment is influenced by drowsiness, it's not fully reflective. Depressed person: no standing judgment is being overturned; it's a different mechanism. Pension case is preference evolution. Pigeons lack judgments altogether.

  The refined principle: acting against a stable, reflectively endorsed judgment due to temporary motivational states. This covers most cases. The student fits here because her Sunday resolution is stable, and the all-nighters are temporary lapses she regrets.
answer: |-
  Here's a candidate principle refined through your cases, designed to preserve your core intuitions while resolving tensions:

  **Weakness of will occurs when an agent acts against their own *stable*, *reflectively endorsed* judgment or commitment due to the influence of a *temporary motivational state* (e.g., craving, fatigue, visceral impulse).**

  **Why this works with your verdicts:**

  1.  **Smoker:** Clear. Acts against stable judgment (quitting is best) due to temporary craving.
  2.  **$50 Now:** Counts. The agent has a stable, reflective judgment ($60 later is smarter). Choosing $50 is driven by the temporary salience/impulse of immediate reward.
  3.  **Vegetarian (Barely):** Fits. Acts against a stable commitment (vegetarianism) due to the temporary temptation of delicious food arriving unexpectedly. The "barely" likely reflects the mild strength of the temptation/commitment conflict.
  4.  **Morning Gym Guy:** *Not weakness of will.* Both judgments (8pm resolve to gym, 6:15 resolve to sleep) are genuine *state-dependent* judgments. His motivational state (exhaustion) fundamentally alters his reflective assessment of what's best *at that moment*. There's no stable commitment being overridden *by a temporary state*; his assessment itself changes with the state. (You might need to accept this flip-flop).
  5.  **Depressed Person:** *Not weakness of will.* The judgment ("should shower") may be stable and reflective, but the inability to act stems from a *chronic*, pathological deficit in motivation/initiation (anhedonia, fatigue), not a *temporary* impulse overriding a stable judgment. The mechanism differs qualitatively from craving or impulse.
  6.  **Pension Cash-Out:** *Not akrasia.* This is preference change/evolution over time. The 25-year-old's preference (cash now) *is* her stable, reflectively endorsed judgment *at that time*. The later regret doesn't negate that. Contrast with $50 case: there, the agent *simultaneously* judges $60 later is better but takes $50 now due to impulse. The pension case lacks that simultaneous conflict.
  7.  **Pigeons:** *Not weakness of will.* They lack the capacity for stable, reflective judgments altogether. They act on basic reinforcement schedules.

  **Why this over your tentative principle?** It explicitly addresses the key difference between your $50 case (temporary impulse overriding stable judgment) and Pension case (genuine preference change over time), and why the Morning Gym case isn't akrasia (state-dependent judgment, not a stable one overridden). It also cleanly handles the Depressed case (chronic deficit vs. temporary impulse).

  **The Student Case:** This is **akrasia** under the principle.
  *   **Stable, Reflectively Endorsed Commitment:** The Sunday night resolution represents her stable judgment about best exam preparation strategy, formed under calm reflection.
  *   **Acting Against It:** Pulling the all-nighter goes against this commitment.
  *   **Due to Temporary Motivational State:** The all-nighter is driven by the *temporary* state of exam pressure, panic, procrastination-fueled anxiety, or fatigue impairing her ability to stick to the plan. The sincere Monday regret confirms the stability of her reflective endorsement of the "no all-nighter" policy. The repetition highlights the *pattern* of temporary states overwhelming her stable commitment.

