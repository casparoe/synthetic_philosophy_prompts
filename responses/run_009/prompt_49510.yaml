  The user might need both the technique and the concept. "Lateral thinking" is close but too broad. "Systemic insight" or "framework transition" could work. In math recreations, terms like "meta-solving" or "outside-in approach" might exist, but I'm not sure. 

  Also, considering their rationalist background, terms like "rationalist taboo" (replacing terms to clarify) relate to changing frameworks. "Steelmanning" involves restructuring arguments, which is similar.

  The user's deeper need might be to categorize this move for clearer communication or further study. They might want to connect it to existing literature to explore its applications and limitations. Their question about whether the first example counts as leaving the system indicates they're seeking a precise conceptual boundary. 

  I should address that by explaining levels: moving to a meta-system is still within a larger system, but it's a jump relative to the original problem's rules. The key is the shift in perspective. Terms like "metacognition" or "epistemic ascent" from philosophy capture this. 

