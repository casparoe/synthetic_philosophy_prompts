  | **Rationality is defined by**:                                                                     | The ex-ante perspective: What the driver would endorse before starting the journey.         | The local perspective: What is optimal at each choice point given identical information.    |
  | **The \( p = \frac{1}{3} \) equilibrium is**:                                                     | Self-enforcing because it is a Nash equilibrium; no self gains by deviating if others comply. | Unrealistic because selves cannot coordinate without commitment, making \( \frac{4}{3} \) a hypothetical construct. |
  | **The value of \( \frac{5}{4} \)**:                                                               | Suboptimal and unstable; it is not an equilibrium and invites deviation.                   | The maximum achievable without commitment, as it balances immediate and future payoffs.     |

