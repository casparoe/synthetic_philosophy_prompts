  ### 4. Testable Variants  
  Concrete scenarios to resolve the cruxes. Predictions are recorded in advance.  

  **Variant A: Randomized Strategy with a Shared Device**  
  - *Setup*: The driver carries a coin before starting. At each intersection, they flip the coin and follow the outcome (e.g., exit if heads). The coin is the only source of randomness, and the driver cannot remember past flips.  
