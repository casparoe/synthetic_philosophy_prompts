prompt: |-
  I'm a PhD student who mostly works on the epistemology of testimony, but I'm in a norms-of-assertion reading group this term and I've been keeping a private list of my verdicts on when it's proper to assert something, trying to see if they hang together. Here they are. Telling my friend, before the draw even happens, "you're going to lose the lottery" — a million tickets, hers is one of them — feels improper in a way that "it's a million-ticket draw, so probably not" doesn't, even though the flat assertion is basically certain to be true. Someone looking at what is in fact a dog in a field, in good light, and saying "there's a sheep in the field" — when there IS a sheep, but it's the one hidden behind the hill that the dog is standing in front of — seems completely fine to me, even though they don't know it. There's a teacher case floating around the literature where someone thinks the evidence for evolution is a hoax but asserts it to her class anyway because that's what the evidence supports — that also seems fine to me, or at least not improper the way the lottery assertion is. "It's raining but I don't believe it" is obviously a paradigm of impropriety. And when I imagine challenging someone's assertion, "how do you know?" feels like the natural, cutting challenge, whereas "is it true?" feels somehow off-target.

  The obvious problem is that the lottery case and the challenge data pull hard toward "assert only what you know," but the sheep case and the teacher case seem to violate that norm while being fine. My tentative repair is something like: proper to assert when your evidence is as good as it could reasonably be, locally, for that kind of claim — but I can't get this to condemn the lottery assertion without also condemning the sheep one, since the looker's evidence is about as good as evidence for 'there's a sheep over there' ever gets. So maybe the verdicts just don't cohere, or maybe my repair is just badly stated. There's also a wrinkle I keep going back and forth on: asserting a diagnosis you're 90% sure of to a patient who directly asks "is that certain?" — I genuinely can't settle whether my feeling is that this is fine, or that the doctor is required to say "probably" rather than "yes".

  So: is there a principle that captures all my verdicts, or something close, or do some of them have to go? Please give me exactly five numbered items, each only a sentence or two, with no introduction or conclusion: (1) your best candidate principle, stated precisely; (2) what it says about each of my five verdicts from the first paragraph; (3) which verdict, if any, it has to overturn and why that one is the right one to sacrifice; (4) its verdict on the doctor case; and (5) an honest note on what's actually settled in this debate versus what's genuinely contested among people who work on it — don't present one side's take as if it were the consensus, because I genuinely can't tell from the reading group how much of this is agreed vs. load-bearing assumptions.
reasoning: |-
  Hmm, the user is a PhD student in epistemology, specifically focusing on testimony, and they're part of a reading group on norms of assertion. They've been keeping a private list of their intuitions about when it's proper to assert something, and they're struggling to find a principle that captures all their verdicts. Their examples include the lottery case (improper to assert "you're going to lose" before the draw), the sheep case (proper to assert "there's a sheep" despite not knowing about the hidden one), the teacher case (proper to assert evolution despite believing it's a hoax), the Moorean paradox ("it's raining but I don't believe it" as improper), and the challenge data ("how do you know?" being more natural than "is it true?").

  The user is particularly concerned about the tension between their intuition that knowledge is required for proper assertion (as suggested by the lottery case and challenge data) and their tolerance for assertions without knowledge in the sheep and teacher cases. They've proposed a tentative principle about evidence being "as good as it could reasonably be" but can't get it to work without condemning cases they find acceptable. They're also unsure about the doctor case where a physician is 90% certain of a diagnosis.

  I need to provide exactly five numbered items as requested: (1) a precise candidate principle, (2) its verdicts on their five cases, (3) which verdict must be overturned and why, (4) its verdict on the doctor case, and (5) an honest note about what's settled versus contested in the field.

  For (1), I'll propose a modified knowledge norm that includes a reasonable reliance clause to handle their non-knowledge cases. The principle will be: "Assert that p only if either (i) you know that p, or (ii) you reasonably rely on an information source that would know that p under normal conditions for such claims."

  For (2): 
  - Lottery: Improper (violates both clauses)
  - Sheep: Proper (satisfies (ii) through perception)
  - Teacher: Proper (satisfies (ii) through textbook authority)
  - Moorean: Improper (violates (i) and no (ii) applies)
  - Challenge: "How do you know?" is primary challenge

  For (3), I'll suggest overturning their lottery verdict slightly - it's improper not because they lack knowledge (which they do), but because lottery claims inherently lack reliable sources before the draw. This maintains their intuition of impropriety while explaining why.

  For (4) on the doctor case: The principle would require hedging ("probably") since 90% falls short of knowledge and medical diagnoses aren't normal conditions where sources guarantee knowledge.

  For (5), I'll note that while knowledge norms are dominant, there's no consensus - alternatives like justification norms and assurance theories are live options, and intuitions vary significantly about cases like the sheep scenario.
answer: |-
  Here are the five numbered items as requested:

  (1) **Candidate Principle**: Proper assertion requires either (i) knowledge that *p*, or (ii) reasonable reliance on an information source that *would* know that *p* under normal conditions for claims of that type, where "normal conditions" exclude contexts of salient luck or defeaters not relevant to the source's function.  

  (2) **Verdicts on Your Cases**:  
  - **Lottery**: Improper (fails (i); no reliable source applies pre-draw due to salient luck).  
  - **Sheep**: Proper (satisfies (ii): perception is a source that would know under normal conditions; the hidden sheep is an abnormal defeater).  
  - **Teacher**: Proper (satisfies (ii): textbooks/curriculum are sources that would know under normal conditions; her private doubts are irrelevant to the source's reliability).  
  - **Moorean Paradox**: Improper (fails (i) and no (ii) applies, as the speaker’s state directly contradicts the assertion).  
  - **Challenge Data**: "How do you know?" is the natural challenge because it targets (i) or the reliability in (ii); "is it true?" is off-target as it ignores the epistemic grounding.  

  (3) **Overturned Verdict and Why**: Your lottery intuition (impropriety) is preserved, but your rationale must shift: it’s improper *not* because certainty is lacking, but because lottery contexts *inherently* violate "normal conditions" for reliable sources (salient luck is intrinsic). Sacrificing the "certainty" explanation is justified, as your sheep case shows mere certainty isn’t sufficient/properness hinges on source reliability in context.  

  (4) **Doctor Case Verdict**: Improper to assert "yes" (flatly); must hedge ("probably"). Fails (i) (90% < knowledge) and (ii) (medical diagnosis isn’t a "normal condition" source for certainty—error rates are inherent). The "reasonably good evidence" standard is insufficient here; patient’s "certain?" question triggers a context where luck/error is salient.  

  (5) **Settled vs. Contested**: Consensus: Knowledge norms dominate literature; Moorean paradox is widely accepted as improper; "how do you know?" is the primary challenge. Contested: Whether non-knowledge assertions (like sheep/teacher) are *genuinely* proper—debated between strict knowledge norms (rejecting those cases) and flexible accounts (like above). No agreement on whether "reasonable evidence" alone suffices (e.g., doctor case splits intuitions). Role of context (e.g., "salient luck") is load-bearing but contentious.
