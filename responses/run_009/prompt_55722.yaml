answer: |-
  You've hit on the core tension in Moore's Paradox: why do some combinations feel "crazy" while others seem fine, and what principle unifies them? Your intuitions are sharp and align with key observations in the literature. Let's break this down systematically.

  ### **The Core Principle: Assertion as Commitment to Knowledge**
  The most robust unifying principle is **"Asserting *p* expresses that the speaker knows (or justifiably believes) *p*."** This explains your list and resolves asymmetries without ad hoc patches. Here's how it works:

  1. **Basic Moorean Cases**  
     - *"It's raining but I don't believe it"*:  
       - Asserting "It's raining" expresses knowledge that it's raining.  
       - But "I don't believe it" denies that belief (a necessary condition for knowledge).  
       → **Self-undermining**: You simultaneously commit to having and lacking justification for *p*.  
     - *"It's not raining but I believe it is"*:  
       - Asserting "It's not raining" expresses knowledge that it's not raining.  
       - "I believe it is" claims you hold a false belief.  
       → **Contradiction**: You claim knowledge of *¬p* while admitting belief in *p*, making your belief irrational.  
       *Asymmetry explained*: The omissive ("don't believe") clashes with the *act of asserting*, while the commissive ("believe falsely") clashes with the *content* of the assertion.

  2. **Your Test Cases**  
     - *Past tense*: "It was raining but I didn't believe it"  
       → Fine because you're reporting *past* ignorance. Current assertion doesn't express past knowledge.  
     - *Third person*: "It's raining but John doesn't believe it"  
       → Fine. You express knowledge about the weather and John's state, with no self-undermining.  
     - *Embedded*: "If it's raining and I don't believe it, then..."  
       → Fine. You're not asserting the antecedent; you're supposing it hypothetically.  
     - *"It's raining but I don't know it"*:  
       → **Equally bad** as the belief version. Asserting "it's raining" expresses knowledge, so denying knowledge directly contradicts the speech act. (This *is* discussed—e.g., by Williamson in *Knowledge and its Limits*—but less often than belief.)  
     - *"It's raining but I don't believe that I believe it"*:  
       → **Less problematic** but still odd. Asserting "it's raining" expresses belief (a first-order state). Denying *awareness* of that belief ("I don't believe that I believe") is a second-order claim. This can be coherent in cases of self-ignorance (e.g., subconscious belief).  
       → *Diagnosis*: Your intuition is correct—this isn't Moore-paradoxical. The principle only governs *expressed* belief/knowledge, not meta-cognition.  

  3. **The Classroom "Display" Case**  
     When you say *"Consider: it's raining but I don't believe it"* in class:  
     - You're **not asserting** the content; you're **mentioning** it as an example of irrationality.  
     - The speech act is pedagogical, not a sincere expression of belief.  
     → *No self-undermining* because you're not committing to the truth of *p*.  

  4. **Novel Predictions: Testing the Principle**  
     - *Disjunction*: **"Either it's raining or I don't believe it"**  
       - Prediction: **Felicitous** (though pragmatically odd).  
       - Why? Asserting a disjunction doesn't express belief in either disjunct. You're not committing to "it's raining," so no clash with "I don't believe it."  
     - *Sleep-deprived confession*: Sincerely saying *"It's raining but I don't believe it"* while confused.  
       - Prediction: **Still infelicitous**, but as a *performance error*.  
       - Why? The *norm* of assertion (commitment to knowledge) is violated, even if the speaker is irrational. Listeners will judge it as defective.  

  ### **Why This Principle Beats Alternatives**
  - **"Consistency of belief set"**: Fails for embedded/past/third-person cases.  
  - **"Purpose of assertion"** (e.g., to inform): Doesn't explain why *self*-contradiction is uniquely toxic.  
  - **"What the sentence implies"**: Overly vague; the knowledge-commitment view is more precise.  

  ### **Which Intuition to Revisit?**
  Your weakest intuition is likely **"It's raining but I don't believe that I believe it"**. While strange, it avoids the core paradox:  
  - Asserting *p* expresses first-order belief, not second-order awareness.  
  - Cases like repressed beliefs or cognitive dissonance make this coherent (e.g., "I'm acting as if it's raining, but I refuse to admit I believe it").  

  ### **Key Takeaway**
  **Moore's Paradox arises when asserting *p* ∧ *q* forces the speaker to violate the constitutive norm of assertion: that one must know (or justifiably believe) what one asserts.** This explains why it vanishes in non-assertive contexts (supposition, reporting, mention) and why "don't know" is just as bad as "don't believe." The asymmetry between omissive/commissive versions stems from the *type* of irrationality: one directly contradicts the speech act; the other reveals a faulty belief state.  

  For further reading:  
  - G.E. Moore (1942): Original formulation.  
  - Timothy Williamson (2000): *Knowledge and its Limits* (norms of assertion).  
  - Roy Sorensen (1988): *Blindspots* (asymmetry analysis).  
  - Sydney Shoemaker (1996): Self-knowledge and Moore's paradox.  

  You've nailed the hardest part—spotting where surface logic fails and pragmatics takes over. Keep stress-testing with new cases; that's how philosophy progresses.
