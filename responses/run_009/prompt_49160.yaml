prompt: |-
  A grad student in my phil-bio seminar has me cornered with an argument and I can't decide which rung of the lader to kick out. Background: she's a Dawkins enthusiast, I'm an old Williams man, we do this dance every year, it's a whole thing.

  Her argument, as she presented it:

  (1) Natural selection occurs whenever there is heritable variation in fitness among entities that compete — reproduction, variation, inheritance, differential success. This is just the standard recipe, and it's level-neutral as between genes, organisms, and groups.

  (2) But for selection to change anything, the bookkeeping has to be kept in something that survives generations. In sexual species, organisms are one-off genetic mixtures that meiosis scrambles, and groups dissolve entirely; only genes — stretches of DNA short enough that crossing over rarely splits them — pass through the generations unbroken.

  (3) So whatever we say about selection pressures at the organism or group level, the thing whose frequency actually changes generation over generation is the gene — and "selection for X" just means "X's frequency gets tracked and pushed."

  (4) Therefore all selection is ultimately selection of genes; organism-level selection and group selection are shorthand, like describing a battle by its body count instead of by who flanked whom.

  (5) So explanations like "the group with more altruists outcompeted the group with fewer" are always replacable, without loss, by "the allele for altruism outcompeted its rival allele" — no selection above the gene level ever really occurs.

  Now here's what's bugging me. My student also believes — and here I actually agree with her — that the argument shouldn't license things like "selection for the good of the entire gene pool of the species," or, in an asexual lineage, "selection for the good of the clone." But her premises seem to license exactly that. The frequency of any longer stretch of chromosome, of an entire asexual genome, even of a whole species' gene pool, is also "tracked" by the same bookkeeping; in an asexual lineage the whole organism passes through the generations unbroken, so (2) is at best locally true; and if the criterion is just "whatever's frequency changes," well, gene pool frequencies change over time just fine. If her argument is sound it seems to prove too much: not "genes rather than organisms" but "any chunk of heritable stuff you care to count, up to and including the gene pool." When I pushed her, she said the gene is special because it's the biggest chunk that's also a functional unit of self-replication — but that sounds like smuggling in a criterion that never appeared in the premises.

  So: which step do I reject, and what does rejecting it cost? Let me state my preferences up front. I want to keep (1) — the level-neutral recipe is the best thing that ever happened to this debate — and I'd also like to keep some version of (5), because I spent the eighties arguing against naive good-of-the-group thinking and I'm not giving that back. If I have to give up one of those to block the "gene pool is the real unit" consequence, tell me which, and what I'm paying for it. And if the fix is that some step equivocates — reads true on one meaning and then gets used on another — I want that named explicitly, not waved at.

  Write the diagnosis in prose, and then after the prose give me a table with three columns — "step", "verdict", "cost" — one row for each of the five steps, where verdict is one of keep / reject / reinterpret and cost is a single sentence on what amending or giving up that step commits me to. Keep the whole thing under a thousand words. I teach this material; I don't need the Wikipedia tour of who said what in which book.
reasoning: |-
  Hmm, the user is a philosophy of biology professor dealing with a grad student who's a Dawkins enthusiast. The student has presented a gene-centric argument that all selection is ultimately at the gene level, and the professor wants to identify where to challenge this argument without losing important commitments like level-neutral selection (from step 1) or the critique of naive group selection (from step 5).

  The professor has noticed that the student's argument seems to prove too much—if we accept that selection tracks whatever persists through generations, this would include entire asexual genomes or even whole gene pools, which both the professor and student want to reject. The key problem appears to be in step 2, where the student claims only genes survive generations unbroken in sexual species. This premise doesn't account for asexual lineages where whole genomes persist intact, nor does it explain why we shouldn't consider larger persistent units like gene pools.

  Step 2 is the weak link. Its claim about "only genes" passing unbroken through generations is empirically false for asexual species and logically problematic if extended consistently. By rejecting step 2, the professor can block the gene-centric conclusion while preserving level-neutral selection from step 1. The cost is having to accept that in asexual species, selection can act on whole genomes—but this is actually consistent with biological reality and doesn't undermine critiques of naive group selection.

  Step 3's inference that gene frequency changes are primary should also be rejected since it depends on the flawed step 2. Step 4's conclusion that all selection is selection of genes fails as a result. Step 5 can be kept with reinterpretation—naive group selection is still problematic, but we acknowledge multi-level selection where higher-level entities can be units of selection when they meet certain criteria.

  The professor gets to maintain their Williams-inspired skepticism about group selection while keeping the level-neutral framework intact. The solution addresses the "proves too much" problem by showing the gene-centric view relies on a premise that's not universally true.
answer: |-
  ### Diagnosis
  The flaw lies in Step 2’s equivocation on "bookkeeping" and its failure to distinguish **persistence** from **fidelity of replication**. Step 2 claims only genes "survive generations unbroken" due to meiosis in sexual species, but this conflates two distinct criteria:  
  - **Material persistence**: Physical continuity of a DNA sequence.  
  - **Informational fidelity**: High-fidelity replication of a functional unit.  

  In asexual lineages, entire genomes persist materially and replicate with high fidelity, contradicting Step 2’s generality. Even in sexual species, gene pools persist materially (as collections of alleles) but lack fidelity because recombination shuffles associations. Crucially, Step 2 implicitly relies on **functional replicator status** (a unit whose structure directly influences its own copying rate), yet this criterion is absent from the premises. When Step 3 then equates "tracking frequency changes" with "selection for," it inherits this unstated functional requirement, leading to the overextension you identified (e.g., counting gene pools). Reject Step 2 for overgeneralizing persistence and smuggling in functionality. This preserves Step 1’s level-neutrality and Step 5’s anti-naive-group stance, as functional replicator status excludes gene pools and most large chunks while allowing organism-level selection in asexual cases.  

  ---

  ### Analysis Table  
  | Step | Verdict       | Cost |  
  |------|---------------|------|  
  | 1    | Keep          | None. Level-neutral definition remains foundational. |  
  | 2    | **Reject**    | Must accept that material persistence alone is insufficient; fidelity/functionality matters. Asexual genomes *can* be units of selection. |  
  | 3    | Reinterpret   | "Frequency change" isn’t sufficient for "selection for X"; X must be a *functional replicator* (cost: adds a criterion not explicit in Step 1). |  
  | 4    | Reject        | Conflates *locus* of frequency change with *level* of selection. Cost: Must allow organism-level selection in asexual cases. |  
  | 5    | Keep (reinterpreted) | "No selection above gene level" holds only if higher units lack replicator fidelity (e.g., scrambled in meiosis). Cost: Must accept multi-level selection where fidelity exists (e.g., clonal colonies). |  

  ### Key Clarifications  
  - **Why Step 2 is the lynchpin**: Its claim that "only genes pass unbroken" is false for asexual species and irrelevant for gene pools. Rejecting it blocks the slippery slope to "any chunk."  
  - **Saving Step 5**: Naive group selection (e.g., "for the good of the species") fails because species/groups lack replicator fidelity—their "frequencies" aren’t heritable units. Organism-level selection in sexual species reduces to gene frequencies due to meiosis, but in asexual cases, whole genomes *are* replicators.  
  - **Cost summary**: You grant that asexual organisms *can* be bona fide units of selection, but this doesn’t revive naive group selection—it just confines valid higher-level selection to entities with replicator fidelity (e.g., clonal lineages, obligate symbionts).  

