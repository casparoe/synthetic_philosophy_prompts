  We are drafting a joint statement after a year of adversarial collaboration between a qualia realist and a qualia quiner. The goal is to find common ground and clarify the remaining disagreements, including cruxes that could potentially move one side.

  **Step 1: Agreed Claims (Numbered List)**
  Both sides agree on the following substantive claims:

  1. **Introspection delivers subjective reports**: Introspection provides first-person reports about experiences, which are real psychological events that can be studied scientifically.
  2. **Dependence on neural machinery**: All experiences (and the introspective reports about them) are dependent on and realized by neural processes. Changes in neural machinery can lead to changes in experience and behavior.
  3. **Gradual taste-shift cases (like Chase and Sanborn)**: In cases of gradual change (e.g., a coffee drinker whose enjoyment fades imperceptibly over decades), the subject may not notice the change in their qualitative experience until it becomes substantial. Both agree that:
     a. The subject's behavioral dispositions (e.g., discrimination, reactions, reports) can change gradually without the subject being aware of the change at each step.
     b. The subject's retrospective judgments about the change may be unreliable due to memory limitations and the lack of a fixed internal comparator.
     c. The apparent stability of qualitative character over time is not guaranteed by introspection alone and can be disrupted by such gradual shifts.

  4. **The explanatory role of dispositions**: Dispositions to discriminate, react, and report are necessary and sufficient for explaining behavior in all third-person contexts (including scientific studies of perception and cognition).
  5. **The existence of a first-person perspective**: There is a first-person perspective from which experiences are reported, and this perspective is a real feature of cognitive systems that must be accounted for in any complete theory of mind.

  **Step 2: Disagreements Table**
  We now outline the points of residual disagreement. Each row in the table will have:
  1. Point of residual disagreement
  2. Realist's signed formulation
  3. Quiner's signed formulation
  4. The crux it turns on
  5. A case or argument both accept as bearing on it
  6. Each side's advance prediction

  We will cover the following disagreements:

  A. The nature of "the way it seems": Does it name a fact over and above dispositions?
  B. The status of ineffability: Is it a defect of the concept or of language?
  C. The explanatory necessity of qualia: Are qualia (as traditionally defined) needed for a complete explanation of consciousness?

  **Table:**

  | Point of Residual Disagreement | Realist's Signed Formulation | Quiner's Signed Formulation | Crux | Case/Argument | Advance Predictions |
  |--------------------------------|------------------------------|------------------------------|------|---------------|---------------------|
  | A. The ontological status of the subjective character of experience | "The way it seems to me, the qualitative character of my experience, is a real, intrinsic, private property that is not reducible to any set of behavioral or functional dispositions, even though it is correlated with and causally dependent on neural states." | "The phrase 'the way it seems' refers to a complex of dispositions to discriminate, react, and report, which are fully explainable by functional and neural mechanisms. There is no additional non-dispositional fact." | Whether there can be a scenario where two subjects have identical behavioral dispositions (including all possible reports) but different qualitative experiences. | **Case:** A hypothetical perfect neuro-behavioral duplicate of a human (a "zombie" in the philosophical sense) that is behaviorally and neurally identical but allegedly lacks qualitative experience. Both agree that if such a being is impossible, that would support the quiner; if it is possible, that would support the realist. However, they also consider a more empirical case: **The Super-Sophisticated Actor Scenario**: A subject who, due to a neural intervention (e.g., a perfect neural implant), is able to produce all the same reports and behaviors as before, but claims (sincerely) that their qualitative experience has changed (e.g., they see red as green and vice versa, but have been trained to report correctly). The realist claims the actor might be telling the truth; the quiner claims the actor is either mistaken or the scenario is incoherent. | **Realist prediction:** In the actor scenario, if the subject reports a change in qualia despite identical behavior, that report is veridical and indicates a change in intrinsic properties. **Quiner prediction:** Any such report would either be inconsistent with the behavioral dispositions (e.g., the subject would eventually make a mistake) or would be a report of a dispositional change (e.g., a change in the cognitive mechanisms underlying reporting). |
  | B. The ineffability of qualia | "The ineffability of qualitative experience is a feature of the intrinsic nature of qualia, which cannot be fully captured by public language because it is private and immediate. This is not a defect of the concept but a limitation of language." | "Ineffability is a defect of the concept of qualia, because any property that is truly ineffable cannot be coherently referred to or discussed, and thus cannot play a role in explanation. The feeling of ineffability arises from the complexity and context-dependence of our discriminatory and reporting dispositions." | Whether the feeling of ineffability can be explained without positing an ineffable property. | **Argument:** Analyze cases of expertise (e.g., a wine taster who develops a refined vocabulary for tastes). The realist holds that even with a rich vocabulary, the intrinsic qualia remain ineffable; the quiner holds that the development of vocabulary shows that the experience is effable through refined discrimination and reporting dispositions. **Concrete case:** A subject who experiences a novel shade of color (that they have never seen before) and struggles to describe it. Both agree that the subject may initially lack words but can learn to discriminate and report it reliably. | **Realist prediction:** Even after learning to discriminate and report the novel shade, the subject will insist that the qualitative character is not fully captured by the words or dispositions, and that there is a residual ineffable aspect. **Quiner prediction:** Once the subject has a stable set of discriminatory and reporting dispositions, they will no longer feel that the experience is ineffable; the feeling of ineffability is a temporary feature of unrefined discrimination/reporting. |
  | C. The explanatory necessity of qualia | "Qualia, as intrinsic qualitative properties, are necessary to explain why certain neural states are accompanied by subjective experience at all, and why they have the specific character they do. Without qualia, we have an explanatory gap." | "All explanatory work is done by the functional and neural mechanisms that underpin discriminatory, reactive, and reporting dispositions. The notion of qualia adds nothing to the explanation and is an incoherent posit that creates a pseudo-problem (the 'explanatory gap')." | Whether a complete third-person scientific account of the neural and functional mechanisms would leave unanswered questions about consciousness that require appeal to qualia. | **Case:** A future neuroscience that can perfectly predict and explain all behavioral and neural correlates of an experience (e.g., seeing red). The realist claims that even with such a complete account, the question "Why is this neural state associated with *this* particular subjective quality (e.g., redness) rather than another or none at all?" would remain unanswered. The quiner claims that such a question would be either answered by the neuroscience or revealed as nonsensical. | **Realist prediction:** Even with a complete neural/functional account, the explanatory gap remains, and we can still coherently ask why the experience has this qualitative character. **Quiner prediction:** With a complete neural/functional account, the question loses its grip because we see that the qualitative character just is the set of functional roles; the feeling of an explanatory gap arises from a flawed conception of qualia. |

  **Step 3: Verbal Disputes**
  We identify that part of the dispute about the term "qualia" is merely verbal. Specifically:

  - The realist uses "qualia" to refer to the intrinsic, private, ineffable qualities of experience.
  - The quiner argues that such a concept is incoherent and prefers to use terms like "subjective experience" to refer only to the first-person perspective and its associated dispositions.

  However, both agree that there is a real phenomenon of subjective experience (as evidenced by first-person reports and the first-person perspective). The verbal dispute is over whether the term "qualia" (with the traditional four marks) successfully refers to anything. The realist thinks it does; the quiner thinks it does not.

  Thus, we can say: **The dispute over the word "qualia" is partly verbal because the quiner denies that the term (as traditionally defined) refers to anything real, while the realist insists that it does. However, both agree that there is a real set of phenomena (first-person reports, subjective perspectives) that need explanation.**

