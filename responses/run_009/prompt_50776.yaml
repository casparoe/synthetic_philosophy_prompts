answer: |-
  ## Sestina for the Doubting Taster

  This morning's steam holds nothing new, just **bitter**
  aroma, promises the usual **smooth**
  descent. My practiced sip expects the **dark**
  embrace, that deep and satisfying **rich**
  reward for thirty years. It tastes the **same**,
  they say. My practiced nod agrees. My **tongue**

  knows every note, or thought it did. My **tongue**
  today finds edges sharp, a shade too **bitter**.
  The logbook entry reads entirely **same**:
  "A balanced cup, exceptionally **smooth**."
  It calls the body satisfyingly **rich**,
  it labels depth precisely "complex **dark**."

  But something shifts behind the label **dark**.
  A flicker on the palate. Is my **tongue**
  recording less? Or is the **rich**
  withdrawal real? The aftertaste feels **bitter**
  in ways I cannot chart. Was it so **smooth**
  before? The written word insists: "the **same**."

  The records scream their verdict: *Tastes the **same**!*
  Batch after batch, the log confirms the **dark**
  consistency. Was yesterday less **smooth**?
  A tremor starts, a tremor in my **tongue**,
  or in the cup? This residue too **bitter**…
  Perhaps the meaning's drained from "rich."

  Has "flavor profile" lost its taste of **rich**?
  The bean, the roast, the brew – declared the **same**
  by every gauge. Yet here, this acrid **bitter**!
  Is failure in the cup? This faulty **dark**?
  Or in the flesh that tastes? My traitor **tongue**?
  Or only in the word I call "**smooth**"?

  The word itself feels slippery now, **smooth**
  like oil, obscuring what was **rich**.
  Did language change? This once-true **tongue**
  now lies? Or did the world stay **same**
  while I decay? This cup, this **dark**
  confusion, leaves a residue so **bitter**.

  Where lies the change? In cup, in **tongue**, in word?
  The **rich** report, the **same** report, rings hollow.
  The **dark** suspicion grows. This **bitter**, **smooth** deceit.
