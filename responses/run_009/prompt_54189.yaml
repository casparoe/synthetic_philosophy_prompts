  Comedian from the target group using the slur—fine. Non-target rapper using a reclaimed slur—not fine but less bad than the white guy. Here, the rapper's proximity to the community might lessen the offense, but still not acceptable because they're not part of the group. Singing along as a non-target—not fine. Even though they're repeating, the intent and ownership matter. The comedian owns the slur; the singer doesn't.

