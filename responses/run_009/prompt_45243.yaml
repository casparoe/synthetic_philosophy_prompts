answer: |-
  **Bottom line:** The no-signalling theorem rigorously proves, as a direct consequence of quantum mechanics' mathematical structure, that the statistical distributions of measurement outcomes on one entangled particle are utterly unaffected by which specific measurement is performed on its distant partner, rendering it fundamentally impossible to encode a detectable message regardless of measurement choice or timing.  

  **Reasoning:**  

  1.  **Nature of the Correlation:** Bell's theorem demonstrates that entangled particles exhibit *statistically correlated* outcomes that cannot be explained by any local hidden variable theory. Crucially, these correlations are *preserved* but *not controllable*.  
  2.  **The No-Signalling Theorem:** This is a mathematical result derivable directly from the quantum formalism (specifically, the Born rule and unitarity). It states that for any quantum state (including entangled states), the *marginal probability distribution* of outcomes for any measurement performed on particle A **does not depend** on which measurement operation was performed on particle B, and vice-versa.  
      *   **Consequence:** Suppose Alice measures particle A. Whether she chooses to measure property X or property Y (her "setting"), the raw statistics of the outcomes Bob *later* sees when he measures his particle B – the proportion of "+1" vs "-1" results, for instance – remain *exactly the same* (e.g., always 50/50 for spin in a singlet state, regardless of her choice or his own measurement axis). Bob sees only random noise.  
  3.  **Why Controllable Influence ≠ Controllable Signal:** While the *instantaneous correlation* (the fact that if Alice gets +1 for measurement X, Bob *will* get -1 for the *same* measurement X) seems like "influence", Alice **cannot choose or force** the specific outcome she gets (+1 *or* -1) by manipulating her setting or anything else. Her outcome is fundamentally random.  
      *   **The Barrier:** To send a signal, Alice would need to encode information by *changing* something detectable in Bob's statistics based on *her actions* (e.g., her measurement choice). The no-signalling theorem proves this change *never occurs* in Bob's marginal statistics. Bob cannot distinguish which measurement Alice performed by looking solely at his own results.  
  4.  **Settled vs. Contested:**  
      *   **Settled:** The mathematical validity of the no-signalling theorem within standard quantum mechanics is universally accepted. The impossibility of using entanglement alone for FTL communication is considered a fundamental physical constraint by the vast majority of physicists working in quantum information and foundations. It's not an engineering limitation; it's a consequence of how quantum probability works.  
      *   **Contested:** The *interpretation* of what the non-local correlation *means* ontologically (e.g., genuine physical causation, a consequence of a deeper reality, or merely a correlation in a block universe) remains hotly debated (e.g., Copenhagen, Bohmian mechanics, Many Worlds, Collapse theories). Furthermore, the status and necessity of the assumptions behind Bell's theorem (like statistical independence or "free will") are subjects of ongoing foundational research, though loophole-free Bell tests strongly support the standard view. However, *none* of these controversies suggest a viable loophole for FTL signalling via entanglement within standard quantum mechanics.  

  **In essence:** The "influence" revealed by Bell is a correlation in *shared randomness*, not a controllable causal link. Alice's actions change nothing observable in Bob's local statistics alone, which is why no protocol, however clever with measurements or timing, can overcome the no-signalling barrier – it's baked into the maths of the theory and confirmed by experiment.
