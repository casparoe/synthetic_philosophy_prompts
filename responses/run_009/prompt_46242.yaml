prompt: |-
  I'm writing a term paper for a graduate seminar in social choice on what Harsanyi's aggregation theorem actually establishes, and before I commit to a thesis I keep getting pulled in opposite directions by people I trust. My advisor treats the theorem as the strongest formal argument utilitarianism has ever had: if individual and social preferences both satisfy the von Neumann–Morgenstern axioms and a Pareto condition holds, the social ordering must be a weighted sum of individual utilities — done. A postdoc in my group insists the whole thing is a theorem about functional form with no ethical content whatsoever until you supply an interpersonal comparability assumption the theorem cannot itself generate, since vNM utility only represents each person's own risk preferences and is unique merely up to positive affine transformation. I want to adjudicate, and I've realized I can't do that until someone writes me the specification both sides are implicitly arguing against.

  So that's the request: not a defense of the theorem, but the desiderata — the list of things any adequate derivation of a social evaluation rule from individual inputs has to deliver. Which cases must it get right and which must it get wrong on principle: the case where a coin flip between two people seems better than a certainty of giving the good to one of them, because ex ante fairness matters and a weighted sum with fixed weights can't see the difference; the cases where individual attitudes before and after uncertainty resolves point in different directions; the dictatorship cases it obviously must exclude. Which distinctions it must respect: between what a vNM utility function is as a representation of preferences over gambles and what utilitarianism needs it to be as a quantity summable across persons; between ex ante and ex post evaluation; between the impartial-observer route and the social aggregation route, in case they place different demands on the list. Which possible axioms and results it can't contradict — including, importantly, whether an equity condition of the Hammond type is compatible at all with ex ante Pareto, and whether the appearance of conflict there is a real joint unsatisfiability in my desiderata or a sign that one of them was a camp preference dressed as a necessity. For each requirement, give the motivating case, mark it as non-negotiable or as something one school insists on and another wouldn't miss, and tell me which single requirement does the most to exclude candidate theories — that asymmetry is what I actually need for the paper, because if some subset of the requirements is jointly unsatisfiable, that is itself the result, and no cleverer proof repairs it.

  One more thing I'd like woven in rather than tacked on. A friend of mine claims the machinery proves too much: if you replace welfare with any quantity individuals happen to hold vNM-consistent preferences over — dollars, hours of leisure, it wouldn't matter if it were cholesterol — the derivation still coughs out a weighted sum, so either utilitarianism is true of cholesterol or the word welfare never did any work inside the proof. I want to know whether that objection is a confusion or a genuine constraint, and if it's genuine, where it belongs in the specification and what it does to the non-negotiables. If you want to close with two sentences on how the two Harsanyi routes do against your own list, fine, but keep the weight on the criteria — I'll do the scoring in the paper.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're writing a term paper on Harsanyi's aggregation theorem and need help clarifying the implicit desiderata that different interpretations rely on. The user is caught between their advisor's view that the theorem strongly supports utilitarianism and a postdoc's argument that it's merely about functional form without ethical content. The core request is for a specification of what any adequate derivation of a social evaluation rule must achieve—essentially the criteria both sides are arguing against.

  First, I need to identify the key points of contention. The advisor emphasizes the theorem's conclusion as a weighted sum of utilities under vNM axioms and Pareto, suggesting a utilitarian outcome. The postdoc counters that without interpersonal comparability, the utilities are just representations of individual risk preferences, not comparable welfare measures. The user wants a list of desiderata that any social evaluation rule must satisfy, including which cases it must handle correctly and which distinctions it must respect.

  The user mentions specific cases: coin flips for fairness, ex ante vs ex post evaluations, dictatorship exclusions, and conflicts like Hammond's equity vs ex ante Pareto. They also bring up a friend's objection that the theorem could apply to any vNM-measurable quantity like cholesterol, questioning whether welfare has a special role.

  I should break down the desiderata into categories. The non-negotiables would be foundational requirements any theory must meet. Then, contested desiderata where different schools disagree. For each, I'll include motivating cases, whether it's non-negotiable or contested, and which requirement causes the most exclusions.

  Starting with non-negotiables: Consistency with vNM rationality seems essential. Both individual and social preferences need to satisfy vNM axioms for the theorem to apply. The Pareto principle is another; weak and strong Pareto are typically required. Non-dictatorship is crucial to avoid one person dominating social choices. The social welfare function must be Paretian and satisfy vNM axioms, leading to linear aggregation.

  Next, contested desiderata. Interpersonal comparability is a big one. Utilitarians assume comparability, while formalists see utilities as non-comparable without additional assumptions. The cholesterol objection ties in here—if utilities aren't inherently comparable, the aggregation could apply to any measurable attribute, undermining welfare's special status. This is a key constraint because without comparability, the utilitarian interpretation falters.

  Another contested point is the distinction between utility as preference representation vs welfare. Utilitarians need cardinal, comparable welfare units, but vNM utilities are ordinal and affine-transformable. The fairness case with coin flips highlights this—ex ante fairness isn't captured by weighted sums with fixed weights, suggesting the need for equity considerations beyond Pareto.

  Ex ante vs ex post evaluation is another area. Ex ante Pareto might conflict with ex post equity, as in Hammond's example where helping the worse-off ex post violates ex ante Pareto. Some argue this conflict shows joint unsatisfiability, while others might relax one desideratum.

  I should also consider the impartial observer vs social aggregation routes. The former may incorporate impartiality and sympathy, while the latter focuses on aggregating individual preferences. The user needs to know if these routes impose different demands on desiderata.

  The cholesterol objection is critical. If the theorem applies to any vNM-measurable quantity, then either utilitarianism is trivial (true for any quantity) or welfare must be defined separately. This points to the necessity of interpersonal comparability as a non-negotiable for ethical content, which the theorem itself doesn't provide. So, the objection is valid and shows that without additional assumptions, the theorem lacks ethical force.

  The most excluding requirement is likely the combination of ex ante Pareto and Hammond's equity. If both are insisted upon, they lead to impossibility, indicating a fundamental conflict in desiderata. This asymmetry helps the user highlight where theories fail.

  For the two Harsanyi routes: The social aggregation route relies on Pareto and vNM, leading to linear aggregation but requiring explicit comparability. The impartial observer might build in comparability through extended preferences, potentially satisfying equity better. However, both face the cholesterol problem without a welfare concept.
answer: |-
  Here is the specification of desiderata for any derivation of a social evaluation rule from individual inputs, structured to adjudicate the debate around Harsanyi's theorem. This list identifies core requirements, their motivations, negotiability status, and their excluding power. It explicitly addresses the cholesterol objection and the ex ante/ex post tension.

  **The Desiderata Specification**

  1.  **vNM Rationality (Individual & Social)**
      *   **What it demands:** Both individual preferences over social lotteries *and* the resulting social preference ordering must satisfy the von Neumann-Morgenstern axioms (completeness, transitivity, continuity, independence).
      *   **Motivating Case:** Evaluating policies involving risk (e.g., vaccine distribution under supply uncertainty, infrastructure projects with safety risks). Any credible social choice rule under uncertainty must handle probabilistic mixtures coherently.
      *   **Negotiability:** **Non-negotiable** for theorems building *directly* on Harsanyi's framework. It defines the domain.
      *   **Excluding Power:** Low for *general* social choice (rules ignoring risk can exist), but **highly excluding** within the domain of risky social choices. Rules violating vNM axioms (e.g., rank-dependent models, some equity-focused rules under risk) are ruled out *ab initio*.

  2.  **Pareto Principle (Ex Ante)**
      *   **What it demands:** If every individual weakly prefers lottery A to lottery B, then society must weakly prefer A to B (Weak Pareto). If at least one individual strictly prefers A and no one prefers B, society must strictly prefer A (Strong Pareto).
      *   **Motivating Case:** Unanimous agreement. If everyone is at least as well off (according to their own preferences) and someone is strictly better off under A, society shouldn't choose B.
      *   **Negotiability:** **Non-negotiable** for Harsanyi-style aggregations. It's the core link between individual and social preferences.
      *   **Excluding Power:** **Moderate.** Excludes rules that systematically violate unanimity (e.g., some extreme egalitarian rules that prefer dominated outcomes). Its *interaction* with other axioms is where major exclusions occur.

  3.  **Non-Dictatorship**
      *   **What it demands:** There is no single individual such that whenever they strictly prefer A to B, society strictly prefers A to B, regardless of others' preferences.
      *   **Motivating Case:** The obvious tyranny of one person's preferences overriding all others.
      *   **Negotiability:** **Non-negotiable.** A foundational requirement of collective decision-making.
      *   **Excluding Power:** **High.** Instantly rules out any rule where one individual's utility function *is* the social ordering. This is a bright-line test.

  4.  **Cardinal Representability & Aggregation Form**
      *   **What it demands:** Given vNM rationality, individual preferences can be represented by cardinal utility functions (unique up to positive affine transformation). The social evaluation rule must aggregate these individual utilities into a social preference ordering, and this aggregation must have a specific functional form (e.g., linear, additive) justified by the axioms.
      *   **Motivating Case:** Harsanyi's theorem *derives* a specific form (weighted sum) from vNM + Pareto. Evaluating competing aggregation rules (e.g., sum, product, maxmin) requires specifying the demanded form.
      *   **Negotiability:** **Contested.** *Formalists* accept the derived form as a mathematical consequence. *Utilitarians* see this specific form (additive aggregation) as ethically loaded. *Critics* argue the form alone is insufficient for ethics.
      *   **Excluding Power:** **High within the derivation.** vNM + Pareto + (implicitly) some continuity/differentiability forces linear aggregation. Rules like Nash SWF (product) or Rawlsian maxmin are excluded *unless* they satisfy vNM + Pareto (which they generally don't).

  5.  **Interpersonal Comparability (Meaningful Cardinality)**
      *   **What it demands:** The utility scales used in aggregation must represent interpersonally comparable quantities of "welfare" or "good," not merely individual preference intensities over gambles. Differences or ratios between utilities of *different* individuals must be meaningful.
      *   **Motivating Case:** The "Cholesterol Objection": If individual vNM utilities over cholesterol levels are aggregated, the theorem produces a "weighted sum of cholesterols," which is nonsensical as a *social welfare* rule. This shows vNM utility *alone* lacks ethical content. Utilitarianism requires comparing gains/losses *across* people.
      *   **Negotiability:** **Deeply Contested & Crucial.**
          *   *Formalist/Postdoc View:* **Non-negotiable *external requirement* for ethical interpretation.** The theorem *cannot generate it*; it must be *assumed* independently (e.g., via extended preferences, fundamental preferences, ethical postulate). Without it, the weighted sum is just a mathematical form aggregating preference representations.
          *   *Utilitarian/Advisor View:* Often treated as *implicit* or *achieved* via the vNM framework itself (arguing vNM utility *is* the correct measure of welfare for aggregation) or derivable from the setup (e.g., via the Impartial Observer). May see the cholesterol case as irrelevant because cholesterol isn't "welfare."
      *   **Excluding Power:** **The Most Fundamental Asymmetry.** This requirement **excludes the utilitarian ethical interpretation of the *bare* aggregation theorem.** No derivation satisfying only vNM + Pareto can *establish* utilitarianism unless it *also* establishes meaningful interpersonal comparability from within those axioms, which the cholesterol objection demonstrates it cannot. It forces the utilitarian to *add* comparability as an external premise. Conversely, dropping this requirement allows the formalist interpretation but drains the result of ethical significance.

  6.  **Distinction: Utility as Preference Representation vs. Welfare as Summable Quantity**
      *   **What it demands:** A clear separation between the concept of "utility" as a mathematical representation of *individual* preferences under risk (vNM utility, affine-transformable) and "welfare" as a substantive, interpersonally comparable quantity suitable for summation across individuals to form social value.
      *   **Motivating Case:** The cholesterol objection again. Also, the fact that vNM utility reflects *risk attitudes* – a risk-averse and risk-loving person might have very different vNM utilities for the same objective outcome, but does this difference reflect a difference in *welfare* suitable for social weighting?
      *   **Negotiability:** **Non-negotiable** for clarity. The theorem operates on the first concept. Utilitarianism requires the second. Conflating them is the source of much disagreement.
      *   **Excluding Power:** **High for ethical claims.** Excludes interpretations that claim the theorem *by itself* bridges this gap. It reveals the necessity of an *additional argument* linking vNM utility to interpersonally comparable welfare.

  7.  **Handling Ex Ante Fairness vs. Ex Post Equity**
      *   **What it demands:** The rule must appropriately account for (a) *Ex Ante Fairness:* Concerns about the fairness of the *process* or prospects *before* uncertainty resolves (e.g., giving everyone an equal chance via a coin flip). (b) *Ex Post Equity:* Concerns about the fairness or equality of the *final outcome* *after* uncertainty resolves.
      *   **Motivating Cases:**
          *   *Coin Flip:* Society prefers a 50-50 lottery between giving a good to A or B over giving it for sure to A (or B), purely based on ex ante fairness. A fixed weighted sum *cannot* generate this preference if both individuals prefer getting the good for sure over not getting it.
          *   *Hammond's Equity:* Two individuals, 1 (worse-off) and 2 (better-off). Two lotteries: Lottery X yields (1 gets 1 util, 2 gets 1 util) for sure. Lottery Y yields (1 gets 0.1 util, 2 gets 0.9 util) with 99% probability and (1 gets 0.11 util, 2 gets 10 util) with 1% probability. Ex Ante Pareto requires society to prefer Y (both individuals have a higher *ex ante expected utility* in Y). Ex Post Equity (Hammond) requires society to prefer X, as in the vastly more likely outcome (99%), Y leaves the worse-off individual even worse off than in X. *This conflict demonstrates a potential joint unsatisfiability.*
      *   **Negotiability:** **Contested.**
          *   *Ex Ante Pareto:* **Non-negotiable** for Harsanyi aggregations (see #2).
          *   *Ex Ante Fairness (beyond Pareto):* **Contested.** Utilitarians often dismiss pure ex ante fairness concerns (like the coin flip) as irrational if not reflected in individual vNM utilities. Others see it as essential for justice.
          *   *Ex Post Equity (e.g., Hammond):* **Contested.** Prioritized by egalitarians. Seen as incompatible with ex ante Pareto + vNM by utilitarians, who argue the conflict shows equity conditions like Hammond are flawed.
      *   **Excluding Power:** **Very High & Revealing of Conflict.**
          *   The requirement to respect *both* ex ante Pareto *and* strong ex post equity conditions (like Hammond) is **jointly unsatisfiable** under vNM rationality. This is not a flaw to be repaired by a "cleverer proof"; it's a fundamental conflict in values. *This impossibility is itself a major result.*
          *   The requirement to respect pure ex ante fairness (like the coin flip case) **excludes** fixed-weight linear aggregation rules derived from the basic Harsanyi theorem. Rules incorporating fairness concernss (e.g., via "ex ante" aggregation of non-vNM preferences or ex post corrections) violate vNM or Pareto.

  8.  **Distinction: Social Aggregation vs. Impartial Observer**
      *   **What it demands:** Recognizing that Harsanyi proposed two distinct justifications: (a) *Social Aggregation:* Directly aggregating *given* individual preferences over social lotteries (the theorem). (b) *Impartial Observer:* An idealized observer imagining having an *equal chance* of being any individual in society and forming preferences accordingly (deriving utilitarianism via extended preferences).
      *   **Motivating Case:** The Impartial Observer route *explicitly builds in* a form of interpersonal comparability and impersonality/sympathy through the thought experiment. The Social Aggregation route starts only with individual self-interested preferences over lotteries.
      *   **Negotiability:** **Non-negotiable** for accurate interpretation. Confusing the two routes leads to misattribution of assumptions.
      *   **Excluding Power:** **Moderate.** Highlights that the Social Aggregation theorem *by itself* lacks the impartiality/symmetry often attributed to it. The ethical force in the Impartial Observer comes from the *additional* structure of the thought experiment, not the aggregation mathematics alone. The cholesterol objection applies equally to both if welfare isn't defined, but the IO route *aims* to define welfare via extended preferences.

  **The Cholesterol Objection: Verdict**
  It is a **genuine constraint and profound objection**, not a confusion. It belongs squarely under **Desideratum 5 (Interpersonal Comparability)**. It demonstrates that the *bare mathematical machinery* of Harsanyi's Social Aggregation Theorem is **ethically inert**. The derivation outputs a weighted sum of *whatever quantity* the vNM utilities represent preference intensities over. For the result to have ethical significance as *utilitarianism*, the utilities *must* represent interpersonally comparable welfare. The theorem does not, and cannot, establish *that* from its premises (vNM + Pareto). The word "welfare" does no work *inside* the proof; its ethical weight is imported from outside. **This forces proponents of the theorem as a defense of utilitarianism to provide an *independent* argument for why vNM utilities (suitably scaled) represent interpersonally comparable welfare, or to adopt the Impartial Observer route which attempts to build comparability in.**

  **Asymmetry & Joint Unsatisfiability**
  *   The requirement doing the most to exclude candidate *ethical interpretations* is **5 (Interpersonal Comparability)**. It excludes the claim that the *bare theorem* establishes utilitarianism.
  *   The requirement most responsible for excluding specific *functional forms* (like Nash or Rawls) within the vNM+Pareto framework is **4 (Cardinal Representability & Aggregation Form)**.
  *   The clearest case of **joint unsatisfiability** is between **2 (Ex Ante Pareto)** and strong forms of **7 (Ex Post Equity - Hammond type)**. This impossibility is a core result in social choice under uncertainty, highlighting a fundamental value conflict. Relaxing Ex Ante Pareto (e.g., to ex post Pareto) or relaxing strong equity allows possible rules, but moves away from the Harsanyi framework.

  **The Two Harsanyi Routes Against the List**
  *   **Social Aggregation Theorem:** Satisfies 1, 2, 3, 4. Fails to satisfy 5 (Comparability) without external assumption. Struggles with ex ante fairness in 7 (Coin Flip), fails ex post equity (Hammond) due to conflict with 2. Clearly distinguishes 8.
  *   **Impartial Observer:** Attempts to satisfy 1, 2, 3, 4, 5 (by building comparability via extended preferences), and potentially handles ex ante fairness (via the equal chance device). Still likely conflicts with ex post equity (Hammond) due to 2. Blurs 8 less if carefully stated, but often conflated. Still vulnerable to the *interpretation* of the extended preferences underlying 5 (is it welfare or something else?).

  This specification provides the necessary criteria to dissect the claims surrounding Harsanyi's theorem. The key tensions lie in **Interpersonal Comparability (5)** as the missing ethical linchpin, the **Ex Ante/Ex Post conflict (7)** revealing value incompatibility, and the **Cholesterol Objection** exposing the formalism's ethical neutrality. Good luck with your paper!
