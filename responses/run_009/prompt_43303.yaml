answer: |-
  *(adjusting his pince-nez with a weary, familiar gesture)*  
  You strike directly at the perpetual sore, my dear critic – the very flaw in my own intellectual armour I've probed for decades. Yes, the *Methods* lays bare the peril of desire shaping belief. And yes, my ethical anguish – that dreadful chasm between duty and reasonable self-regard without assurance of a wider harmony – drives my search. Precisely *because* of this vulnerability, I designed the Census as armour against myself.

  We did not solicit 'ghost stories'. We asked, blindly, "Have you ever had a vivid impression of seeing or being touched by a living being, or hearing a voice, which impression, so far as you could discover, was not due to any external physical cause?" Only *after* a positive answer did we inquire about the *content*, including whether it coincided with a death. The witness had no notion of our specific interest in death-coincidences until *after* they reported the hallucination itself. We calculated the expected rate of chance coincidence based on mortality statistics: roughly 1 in 19,000. Our findings showed a rate exceeding 1 in 43 – a statistical deviation demanding explanation. Hope doesn't manufacture such numbers; flawed methodology or witness error might, but we hunted those down relentlessly. Gurney’s absence makes the work harder, not less necessary. The frauds? They prove only that fraud exists. Our task is to sift past it, however painstakingly.

  *(He pauses, his gaze intense but troubled)*  
  Do I *wish* the evidence were clearer? Unquestionably. But does that wish invalidate the careful structure of the inquiry? I contend it does not. It makes me, perhaps, more cautious than the credulous.
