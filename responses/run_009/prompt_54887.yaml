  *Pauses at the residency requirement objection* That's the thorniest bit. How to defend a waiting period without implying hierarchies of human worth? Must emphasize it's about administrative necessity, not moral valuation. Least confident here - is three years truly optimal? Could data show shorter periods work?

  The memo structure should: Lead with recommendation (Option 1 modified), then layer reasoning from fundamental rights down to practicalities. Confidently assert that excluding taxpayer residents violates fairness, but flag budget concerns as real. Stress that "membership" is proven by enrollment/taxes, not paperwork. 

