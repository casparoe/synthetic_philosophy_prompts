  Final verdict must honor both thinkers fairly. The bishop's candlestick scene refutes Rand by showing gift-as-grace; Valjean's deathbed shows the debt wasn't slavery but meaning. But the Thénardiers prove Hugo shares Rand's disgust for transactional "altruism." 

