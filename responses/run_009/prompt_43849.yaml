  We are designing a scenario where an ambiguity-averse agent chooses a known gamble over an apparently "safe" option that is contingent on an unquantifiable event. The safe option must have a higher expected value under the best available prior, but ambiguity aversion reverses the preference.

  Setting: Settlement Negotiation

  A plaintiff is negotiating a settlement with a defendant. The plaintiff has two options:

  (a) Accept a settlement offer of $X immediately. However, the settlement is contingent on the defendant's board approving the deal. The board meets in a week and has a history of being unpredictable. Experts cannot assign a precise probability to the approval because it depends on undisclosed financials and internal politics. The best available prior (based on similar cases) suggests an 85% chance of approval, but there's a wide range of plausible probabilities (say, from 60% to 95%) and no objective way to narrow it down.

  (b) Go to trial. The trial outcome is uncertain, but the plaintiff's lawyers estimate a 70% chance of winning $Y (with Y > X) and a 30% chance of getting nothing. This estimate is well-founded on case law and evidence, so it's considered unambiguous.

  We set the numbers so that the expected value of (a) is higher than (b) under the best prior:

  Expected value of (a) = 0.85 * X + 0.15 * 0 = 0.85X
  Expected value of (b) = 0.7 * Y

  We require: 0.85X > 0.7Y  =>  X > (0.7/0.85)Y ≈ 0.8235Y

  So, for example, let Y = $100,000. Then we need X > $82,350. Let X = $85,000.

  Then:
  (a) Expected value = 0.85 * 85,000 = $72,250
  (b) Expected value = 0.7 * 100,000 = $70,000

  So under the best prior, (a) is better.

  But note: the contingency in (a) is ambiguous. We'll see how ambiguity aversion can flip the preference.

  Now, we model three agents:

  1. Subjective Expected Utility (SEU) with a single prior:

     This agent uses the best available prior (85% chance of approval). They compute:
     - (a): 0.85 * u(85,000) + 0.15 * u(0)
     - (b): 0.7 * u(100,000) + 0.3 * u(0)

     Assuming the agent is risk-averse, we need a utility function. Let's use a simple concave function, e.g., u(w) = sqrt(w) (or we could use linear if we assume risk neutrality for simplicity, but then ambiguity aversion wouldn't show in the same way. However, note that in this problem, the flip is due to ambiguity, so we can even assume risk neutrality for the SEU agent to isolate the effect).

     But note: if we assume risk neutrality, then:
     - (a): 72,250
     - (b): 70,000
     So (a) is preferred.

     Even with risk aversion, as long as the expected utility of (a) is higher, they choose (a). We can set a utility function to ensure this. For example, with u(w)=sqrt(w):

     (a): 0.85*sqrt(85000) + 0.15*sqrt(0) ≈ 0.85 * 291.55 ≈ 247.82
     (b): 0.7*sqrt(100000) + 0.3*sqrt(0) ≈ 0.7 * 316.23 ≈ 221.36

     Still (a) is better.

  2. Maxmin Expected Utility (MEU) with a set of priors:

     The agent considers a set of probabilities for the board approval. Let the set be [p_min, p_max]. We'll set it to [0.6, 0.95] as a plausible range.

     They evaluate each option by its worst-case expected utility.

     For (a): worst case is when p is as low as possible (0.6). Then:
        Expected utility = 0.6 * u(85000) + 0.4 * u(0)

     For (b): the trial outcome is unambiguous, so regardless of the prior, the expected utility is fixed at:
        0.7 * u(100000) + 0.3 * u(0)

     Now, with u(w)=sqrt(w):
     (a) worst-case: 0.6 * 291.55 ≈ 174.93
     (b): 221.36 (as above)

     So (b) is better in the worst case. Therefore, the MEU agent chooses (b).

     Note: The worst case for (a) is the lower bound of the set (60% approval chance). The set must include a probability low enough to make the worst-case expected utility of (a) lower than that of (b). We set the range to [0.6, 0.95] and with the numbers, it works.

