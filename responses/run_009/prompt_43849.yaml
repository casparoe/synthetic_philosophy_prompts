  Now, the three additional questions:

  First, which feature is doing the work?
     The key feature is that the "safe" option (a) is not actually safe: it depends on an unquantifiable contingency. This contingency introduces ambiguity, which the ambiguity-averse agent dislikes. The gamble (b) has known probabilities, so it is ambiguous-free. The aversion to ambiguity pushes the agent away from (a) and toward (b). This happens even though (a) has a higher expected value under the best estimate.

  Second, what if the contingency gets a crisp probability?
     Then the ambiguity disappears. Both options are risky, but (a) is now a simple lottery: 85% chance of $85,000 and 15% of $0. The agent would then compare the two lotteries by their expected utility. Since (a) has higher expected value (and if the agent is not too risk averse), they would choose (a). Ambiguity aversion no longer applies.

  Third, how would a defender of Ellsberg-style ambiguity aversion attack the case?
     They might argue that the agent is not making a rational mistake by being ambiguity averse. The unquantifiability of the contingency in (a) is a real feature of the world, and it is rational to avoid it. However, they might also argue that the set of priors in the MEU model is too wide. In particular, if the best prior is 85%, then including 60% might be unreasonably pessimistic. A more rational approach might be to use a narrower set that reflects the available information. If the set is narrow enough (e.g., [0.8,0.9]), then the worst-case for (a) might be 0.8*85000=68,000 (under risk neutrality), which is still above 70,000? 68,000<70,000? 68,000<70,000 -> still worse. Or with the utility numbers: 0.8*291.55=233.24, which is still less than 221.36? Wait, 233.24>221.36? Then (a) would be better in the worst case. So the set matters.

     Alternatively, they might argue that the smooth model with a reasonable degree of ambiguity aversion and a reasonable second-order prior should not lead to choosing (b). They might challenge the width of the set or the degree of ambiguity aversion. But in this case, we see that with a wide set and strong ambiguity aversion, (b) is chosen.

     The core defense: the agent is not making a category error, but reasonably recognizing that the contingency in (a) has a wider range of possible probabilities than the trial in (b). In (b), the probability is based on solid evidence, so the agent can be confident in the 70% estimate. In (a), the board's decision is opaque, so it is rational to be cautious. And in this case, caution leads to avoiding the apparently safe option.

     However, note that the outcome of the trial might also be subject to some ambiguity? We assumed it was unambiguous. The problem states that the trial outcome is well-founded. So we have to assume that the trial has no ambiguity, while the board approval does.

     A critic might say: the agent is overreacting to the lack of data by assuming the worst. But the ambiguity-averse models (MEU and smooth with high concavity) are designed to do exactly that.

  Conclusion:

  The case works because the "safe" option has an unquantifiable contingency, making it ambiguous, while the gamble is objectively known. Ambiguity aversion then penalizes the safe option, leading to a preference for the gamble. This is not due to pessimism about the probability (the best estimate is optimistic) but due to the unquantifiability itself.

  We have to be cautious in the smooth model: it depends on the strength of ambiguity aversion. But with a sufficiently ambiguity-averse agent, we get the flip.

