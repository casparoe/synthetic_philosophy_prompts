  Below is a problem set case designed to illustrate how ambiguity aversion can lead an agent to choose a known gamble over an apparently "safe" option. The scenario avoids hidden traps in the safe option and ensures that under the best available prior, the safe option has a higher expected value. The case is set in a realistic legal context.

  ### Case: Settlement Negotiation in a Lawsuit
  A plaintiff must choose between two options to resolve a lawsuit:  
  **(a) Settlement with board approval contingency:** Accept a settlement offer of $85,000, guaranteed only if the defendant's board of directors approves the deal. Board approval is highly uncertain—experts cite similar cases but cannot assign a precise probability due to undisclosed financials and internal politics. The best available prior suggests an 85% approval chance, but plausible probabilities range widely (60% to 95%). If the board rejects the deal, the plaintiff gets nothing.  
  **(b) Trial with known risk:** Go to trial, with a 70% chance of winning $100,000 (based on case law and evidence) and a 30% chance of losing and receiving $0. This probability is unambiguous and agreed upon by all experts.  

  Assume the plaintiff has risk-neutral preferences over monetary outcomes for simplicity (i.e., \(u(x) = x\) for wealth \(x\)). Under the best prior (85% chance), the expected value (EV) of (a) is \(0.85 \times 85,000 = 72,250\), and the EV of (b) is \(0.7 \times 100,000 = 70,000\). A neutral evaluator prefers (a).  

  ### Analysis by Decision Model  
  1. **Subjective Expected Utility (SEU) with a single prior**  
     - **Agent's choice: (a)**  
     - **Why:** The agent uses the best prior (85% approval chance). EV(a) = \(0.85 \times 85,000 = 72,250\) > EV(b) = 70,000. The higher EV makes (a) strictly preferred.  

  2. **Maxmin Expected Utility (MEU) with a set of priors**  
     - **Agent's choice: (b)**  
     - **Why:** The agent considers a set of priors for approval probability, \(\Pi = [0.60, 0.95]\) (reflecting the plausible range). Each option is evaluated by its worst-case expected utility:  
       - For (a), the worst case is \(p = 0.60\): EV(a) = \(0.60 \times 85,000 = 51,000\).  
       - For (b), the known probability is fixed: EV(b) = 70,000 (no ambiguity).  
       - Since \(51,000 < 70,000\), the worst case for (a) is worse than (b). Thus, (b) is preferred.  
     - **Key priors:** The lower bound of \(\Pi\) (\(p = 0.60\)) drives the result. If the set includes probabilities near 60%, (a)’s worst-case collapses, making it inferior despite its best-case superiority.  

  3. **Smooth Ambiguity Model (Klibanoff–Marinacci–Mukerji)**  
     - **Agent's choice:** **Depends on ambiguity aversion strength**.  
       - *Mild ambiguity aversion*: Chooses **(a)**.  
       - *Strong ambiguity aversion*: Chooses **(b)**.  
     - **Why:**  
       - Let \(\mu\) be a second-order uniform prior over \(p \sim [0.60, 0.95]\) (mean 77.5% ≈ best prior of 85% after truncation adjustment).  
       - The agent evaluates options using \(V(\cdot) = \mathbb{E}_{\mu} \left[ \phi \left( \mathbb{E}_p[u(\cdot)] \right) \right]\), where \(\phi\) is a concave function capturing ambiguity aversion.  
       - For (a): \(\mathbb{E}_p[u(a)] = 85,000p\).  
       - For (b): \(\mathbb{E}_p[u(b)] = 70,000\) (constant).  
       - **Critical role of \(\phi\)**:  
         - If \(\phi(x) = x\) (ambiguity neutrality), \(V(a) = 85,000 \times 0.775 \approx 65,875 < 70,000 = V(b)\) → *incorrectly prefers (b)* due to lower mean \(p\). But with a second-order prior centered on 85% (e.g., truncated normal), \(V(a) > V(b)\) as in SEU.  
         - For ambiguity aversion, use \(\phi(x) = -e^{-\alpha x}\) (exponential form).  
           - *Mild aversion* (\(\alpha = 0.01\)): \(V(a) \approx -0.109 > V(b) \approx -0.1092\) → prefers (a).  
           - *Strong aversion* (\(\alpha = 0.1\)): \(V(a) \approx -2.45e^{-9} < V(b) \approx -2e^{-10}\) → prefers (b).  
       - **Intuition:** Strong concavity in \(\phi\) overweights low \(p\) realizations, penalizing (a) disproportionately.  

  ### Key Insights  
  1. **Feature doing the work:** The "safe" option (a) is **structurally ambiguous**—its certainty is contingent on an unquantifiable event (board approval). Ambiguity aversion penalizes this hidden uncertainty, while the known probabilities in (b) make it "safer" in ambiguity-sensitive terms. This decouples the label ("safe" vs. "gamble") from the actual uncertainty structure.  
  2. **Effect of removing the feature:** If board approval had a crisp public probability (e.g., 85% from data), both options become risky lotteries. Ambiguity aversion vanishes, and SEU (with best prior) always prefers (a) due to higher EV.  
  3. **Critique from ambiguity aversion defenders:**  
     - **Argument:** The agent is **not making a category error** but rationally responding to unquantifiable uncertainty. In Ellsberg, ambiguity aversion avoids options with unknown probabilities; here, it avoids the option where uncertainty is deeper and more opaque (board decisions) versus well-founded (trial odds).  
     - **Counter:** Defenders might argue the prior set \(\Pi = [0.60, 0.95]\) is too wide. If narrowed (e.g., [0.80, 0.90]) using contextual knowledge, MEU prefers (a) since the worst case (\(p=0.80\)) yields EV(a) = 68,000 > 70,000? No—68,000 < 70,000, so (b) still wins. Only if \(\Pi\) excludes probabilities below ~82.4% (where \(0.824 \times 85,000 \approx 70,000\)) would MEU switch to (a). Thus, the case highlights how ambiguity aversion’s rationality depends on the *justifiability of the prior set*.  

  ### Educational Purpose  
  This case breaks the conflation of ambiguity aversion with caution: the agent **gambles more** (choosing the risky trial) due to aversion to hidden ambiguity in the "safe" settlement. It teaches that:  
  - "Safe" labels can misrepresent underlying uncertainty.  
  - Ambiguity aversion and risk aversion are distinct forces that can oppose each other.  
  - Decision theory models handle unquantifiable uncertainty (ambiguity) in fundamentally different ways.
