     In this model, the agent has a second-order prior (a distribution) over the probability p of approval. Let μ be the second-order prior. The agent also has an ambiguity aversion parameter φ (a concave function, often exponential).

     The evaluation for (a) is:
        ∫ [p * u(85000) + (1-p)*u(0)] dμ(p)
