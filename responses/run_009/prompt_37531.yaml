prompt: |-
  I run a little podcast where we poke at applied ethics stuff, and next week I've got on a guy who's spent years defending what he calls "moral trade maximalism" -- basically the idea that almost any disagreement between people with different moral views is an opportunity for mutually beneficial trade rather than a fight, and that we should actively build institutions (markets, contracts, even apps) to make these trades happen. His favorite example is the pro-life and pro-choice donors who pool money into contraception access because both of them, on their own terms, prefer fewer unintended pregnancies to the status quo. He also thinks meat eaters should be able to buy "moral offsets" that pay vegetarians to stay vegetarian, and he's floated the idea that EAs with credences split across utilitarianism and deontology should literally split their donations to hedge, the way you'd diversify a portfolio.

  Draft me around ten interview questions. I don't want him to just restate the view, I want to press on the parts that bug me and see if he has an answer:

  - at least two questions on whether trading with someone whose moral view you find repugnant is itself a moral failure (complicity, legitimacy, "you're treating evil as just another preference"), with follow-ups keyed to whatever his likely reply is (I'm guessing he'll say something like "we already trade with strangers whose views we hate every day")
  - at least one question on the difference between trading *between* people with different values versus trading *within* one person's own moral uncertainty -- he treats these as basically the same operation and I'm not sure that's right
  - one on whether offsets degrade morality in the long run, like, does an offset market teach people that ethics is just a fee schedule?
  - one question that tries to get him to name a trade he would refuse on principle, not because it's inefficient but because it's wrong

  Keep the questions concrete and adversarial but not gotcha-y, this is a friendly-ish show. Also for each question jot a one-line note on what answer I should be suspicious of, so I can push back in the moment. If it matters, our audience is smart but doesn't know the philosphy literature, so the questions should be self-contained.
reasoning: |-
  Okay, the user runs a podcast on applied ethics and is interviewing a guest who promotes "moral trade maximalism." The guest believes that moral disagreements should be resolved through mutually beneficial trades rather than conflicts, using examples like pro-life and pro-choice groups funding contraception or meat eaters buying "moral offsets" from vegetarians. The host wants interview questions that challenge the guest's ideas without being confrontational, focusing on specific concerns like complicity with immoral views, the conflation of interpersonal and intrapersonal moral trades, the long-term effects of offsets, and absolute limits to trading.

  First, I need to address the complicity angle. The host is worried that trading with someone whose morals you find repugnant might be a moral failure. The guest might argue that we already trade with people whose views we dislike, like buying from companies with unethical practices. But the host wants to push back on whether this normalizes evil. Questions here should contrast everyday transactions with explicit moral trades, asking if the latter feels like endorsing the other's values. Follow-ups could explore if such trades legitimize harmful positions or if they're merely pragmatic.

  Next, there's the distinction between trading between different people versus within one person's moral uncertainty. The guest treats both as similar, like diversifying donations between utilitarian and deontological causes. The host suspects these are different—interpersonal trades involve negotiation between conflicting values, while intrapersonal is about hedging personal uncertainty. A question could ask if these two scenarios operate under the same logic, and a follow-up could probe whether intrapersonal trades avoid the complicity issue since it's all internal.

  The third point is about offsets degrading morality. If moral actions become transactional, does that reduce ethics to a fee schedule? The guest might say it's better than inaction, but the host should watch for whether this erodes intrinsic motivation. Questions need to challenge if offsets make people feel they can buy their way out of moral responsibilities, leading to long-term moral laziness.

  Lastly, the host wants the guest to name a trade they'd refuse on principle. This tests the limits of the maximalism stance. The guest might avoid naming specifics, so pressing for an example is key. Possible answers could involve trading with extremists, but the host should be suspicious if the guest can't name any or uses pragmatic excuses instead of moral ones.

  For the audience, questions must be concrete and avoid jargon. Examples like the contraception compromise or meat offsets make it accessible. Each question needs a one-line note for the host on what weak answers to watch for, ensuring they can push back effectively.

  The host also wants a friendly tone, so questions should be adversarial but not aggressive. Structuring them as "what about this case?" rather than outright challenges. Including phrases like "help me understand" softens the approach. Ensuring all concerns are covered: complicity (two questions), value trade vs. uncertainty, offsets' long-term effects, and a no-trade principle.

  Possible guest rebuttals: For complicity, they might say avoiding trade doesn't change the other's actions, so cooperation reduces harm. Pushback: Does that imply any cooperation with evil is justified if it reduces net harm? For the trade types, the guest may argue both involve preference aggregation. Counter: Interpersonal trades require mutual recognition of values, which might legitimize harmful views. Offsets: Guest could claim they're a stepping stone to better ethics. Skepticism: But what if they entrench transactional thinking? Absolute refusal: If the guest cites inefficiency, push for moral boundaries.

  Finally, compiling ten questions covering all areas. Balancing directness with openness, using clear examples. Notes for the host to spot evasive answers, like deflecting to practicality instead of morality, or not distinguishing between trade types. Ensuring the questions flow logically and cover the host's bug points comprehensively.
answer: |-
  Here are 10 interview questions designed to press on the core tensions in Moral Trade Maximalism, framed accessibly but with concrete challenges. Each includes a brief "Watch For" note to help you spot potential weak spots in the answer:

  ### On Complicity & Legitimizing "Evil"
  1.  **Question:** "Your contraception example seems like a clear win: both sides reduce pregnancies they dislike. But let's take something more charged. Imagine a market where white supremacists could pay people of color to voluntarily live in segregated towns, reducing 'interracial contact' both sides (hypothetically) dislike. Isn't facilitating *that* specific trade based on a racist moral view itself morally complicit, even if it reduces conflict? Doesn't it validate the supremacist's framework as just another 'preference' to bargain with?"  
      **Watch For:** Hand-waving the example as unrealistic. Saying *only* outcomes matter without addressing the act of *enabling/validating* the repugnant view itself.

  2.  **Follow-Up (Likely Reply: "We trade with people we dislike daily"):** "You often counter the complicity worry by saying we trade with people holding awful views every day – buying gas, using tech, etc. But isn't there a crucial difference? Those are *implicit* trades in a complex system. You're advocating building *explicit institutions* designed specifically to broker deals *based directly on* moral views we find abhorrent. Doesn't that active facilitation cross a line that passive participation in society doesn't?"  
      **Watch For:** Equating passive/systemic interaction with *intentionally designed systems* for trading on repugnant values. Ignoring the legitimizing effect of institutionalizing the trade.

  ### On Interpersonal vs. Intrapersonal Trade (Moral Uncertainty)
  3.  **Question:** "You suggest an Effective Altruist with 50/50 credence in utilitarianism vs. deontology should split their donations, like diversifying a portfolio. But trading *within your own mind* due to uncertainty feels different than trading *with someone else* whose fundamental values you oppose. When Pro-Life and Pro-Choice groups trade, they aren't hedging *their own* uncertainty – they're negotiating across a chasm of deep disagreement. Aren't these fundamentally different operations: one is personal hedging, the other is adversarial negotiation?"  
      **Watch For:** Conflating the two by focusing *only* on the abstract "aggregating preferences" similarity. Not addressing the distinct challenges of adversarial negotiation vs. internal balancing.

  4.  **Follow-Up:** "Doesn't the 'adversarial negotiation' aspect of trading *between* opposing groups introduce problems – like strategic misrepresentation of values, power imbalances, or exploiting desperation – that simply don't exist when you're just wrestling with your own uncertainty?"  
      **Watch For:** Downplaying these negotiation risks or assuming perfect information/fairness in markets.

  ### On Offsets Degrading Morality
  5.  **Question:** "Take the meat-eater buying 'vegetarian offsets.' Critics might argue this turns ethics into a transaction: 'I pay X dollars, my moral debt is cleared.' Couldn't this actually *undermine* genuine moral development? Instead of grappling with the suffering behind their choice, the meat-eater buys a pass. Does widespread use of moral offset markets risk teaching people that ethics is just a fee schedule, reducing intrinsic motivation to be better?"  
      **Watch For:** Dismissing the concern by *only* arguing offsets are better than nothing. Not engaging with the *expressive* or *habit-forming* effects of turning morality transactional.

  ### On Absolute Limits ("The Trade You Won't Make")
  6.  **Question:** "Moral Trade *Maximalism* suggests very few principled limits. Can you give me a concrete example of a hypothetical moral trade you *would* refuse to facilitate or participate in, not because it's impractical or inefficient, but because you believe it would be *fundamentally wrong* to make that trade happen? What's the bright line for you?"  
      **Watch For:** Evasion (only giving impractical examples). Citing *efficiency* or *feasibility* as the barrier instead of a *moral* principle. Struggling to name any concrete limit.

  ### Additional Pressing Questions
  7.  **Question:** "Some trades might *perpetuate* disagreement. If vegetarians are financially compensated *only* as long as meat-eaters keep eating meat, doesn't the offset market create a perverse incentive to *maintain* the underlying moral conflict it's supposedly resolving?"  
      **Watch For:** Not acknowledging this potential dynamic or assuming it's easily outweighed by short-term gains.

  8.  **Question:** "How do you prevent moral trade markets from massively favoring the wealthy? If rich meat-eaters can cheaply buy vast offsets while poor ones can't, doesn't this create a 'morality for sale' system where ethical burdens are shifted onto the less fortunate, worsening inequality?"  
      **Watch For:** Overly optimistic faith in market mechanisms to self-correct without concrete safeguards.

  9.  **Question:** "Critics like Elizabeth Anderson argue markets aren't neutral tools; they shape our values and relationships. By building markets explicitly designed to commodify moral stances (e.g., paying someone *to be vegetarian*), are we inherently changing how people *relate* to those moral stances, potentially cheapening them or turning them into mere commodities?"  
      **Watch For:** Ignoring the potential for market structures to alter the meaning/experience of the moral commitments being traded.

  10. **Question:** "Let's say we build these institutions. How do we determine the 'exchange rate'? If a Pro-Life donor values preventing one abortion at $1000, and a Pro-Choice donor values preventing one unintended pregnancy via contraception at $10, is the 'fair trade' price somewhere in between? Who sets it, and how? Doesn't this process inevitably involve contentious, potentially impossible, comparisons of incommensurable moral values?"  
      **Watch For:** Hand-waving the pricing problem as a mere technical challenge solvable by markets, without confronting the deep philosophical difficulty of comparing fundamentally different moral 'currencies'.

  **Key Interview Approach:** Frame these as genuine puzzlements or tensions you want his help understanding ("Help me see how this works with X...", "I struggle with Y aspect..."). Listen closely to his answers. Your "Watch For" notes highlight common potential weak spots – if his answer leans into one of those, gently but firmly press: "But doesn't that sidestep the core worry about Z?", "If we accept that, then what about the criticism that...?", "Can you elaborate on how that specifically addresses the complicity/legitimacy/degradation point?". Good luck!
