    Question: Why does Jordan fail to get up?
      A) Jordan doesn't truly value the gym enough (Deflationary view: the action reveals the preference for sleep).
      B) Jordan's willpower is weak in the morning (Willpower-as-strength view).
      C) There is a conflict between the sleepy self and the awake self (Partition view).
      D) The immediate comfort of the bed is discounted too heavily the night before, but in the morning it's overwhelming (Hyperbolic discounting).

  Question 8: Resisting temptation successfully
    Scenario: Casey (from the addiction scenario) is offered heroin at a party. They refuse, but it takes immense effort and they feel terrible during the refusal.
    Question: What allowed Casey to resist?
      A) Casey's knowledge of the harms was so vivid in that moment that it outweighed the craving (Socratic view: they knew, so they acted).
      B) Casey's willpower was strong enough to resist the craving (Willpower-as-strength view).
      C) The long-term self won over the short-term self in that moment (Partition view).
      D) In that moment, Casey's preference for long-term health was stronger (Deflationary view: no weakness, just preference).

