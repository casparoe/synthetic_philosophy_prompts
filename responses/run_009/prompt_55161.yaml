  ### Weakness of Will Theory Quiz  
  Below is an 8-question quiz designed to pinpoint your implicit theory of akrasia (weakness of will) based on concrete cases. Each question presents a scenario with 2–4 answer options. **Answer honestly without overthinking—choose what feels most intuitively correct.** After completing the quiz, use the scoring key to map your answers to one of five theories.  

  ---

  #### Quiz Questions  
  1. **Precommitment**: Sam hands a friend $500, payable if Sam smokes a single cigarette within a year. They also use a commitment app that locks away money if they smoke. Sam says, "This is the only way I’ll quit." What’s the *primary* reason for the precommitment?  
     - A) Sam knows they’ll undervalue long-term health when tempted, so they’re rationally binding their future self.  
     - B) Sam’s willpower is unreliable, so they need external tools to block temptation.  
     - C) If Sam truly understood smoking’s harm, they wouldn’t need this—their "knowing" is incomplete.  

  2. **Procrastination**: Taylor needs to file taxes, endorses doing it, and feels no dread or craving to avoid it. Yet they delay for days, scrolling social media instead. What explains this?  
     - A) Taylor doesn’t fully grasp the consequences of delay (e.g., fines, stress).  
     - B) Taylor’s "do the task" system loses to a "seek small rewards" system in their mind.  
     - C) Filing taxes feels distant; scrolling offers tiny, immediate dopamine hits that outcompete it.  
     - D) Taylor’s actions reveal their true preference: they’d rather scroll than file taxes.  

  3. **Addiction**: Casey has tried to quit opioids for years. They tell their therapist, "I genuinely want to quit—it’s destroying my life," but they relapse weekly. Why?  
     - A) In the moment, Casey fails to *feel* the long-term harm—their "knowing" is shallow.  
     - B) Craving hijacks Casey’s mind, creating an internal war where the addiction overpowers their resolve.  
     - C) The immediate high is astronomically valuable compared to future costs due to how Casey’s brain discounts time.  
     - D) When Casey uses, it reveals their true preference: they want opioids more than they want to quit.  

  4. **Compulsive Checking**: Morgan checks if the stove is off 15 times before leaving home. They know it’s off but feel crushing anxiety if they don’t check. Is this weakness of will?  
     - A) **Yes**: Morgan’s "rational self" can’t override their "anxiety self."  
     - B) **No**: This isn’t about willpower—it’s a misfiring anxiety loop, like a glitch.  

  5. **Belief-Behavior Lag**: Alex stopped believing in their religion 3 years ago but still attends services weekly. "I feel trapped. I wish I could leave," they say. What’s happening?  
     - A) Alex doesn’t *truly* accept that leaving is better—their doubt lingers.  
     - B) Alex’s emotional attachment to community battles their new beliefs, and emotions win.  
     - C) Immediate guilt and social loss loom large, while freedom’s benefits feel distant and abstract.  
     - D) Alex’s actions show their true preference: they value community comfort over intellectual honesty.  

  6. **Breaks the Seal**: Jamie is dieting. At a party, they eat one donut, then think, "I’ve ruined my diet—might as well eat five more." Why eat more?  
     - A) Resisting the first donut drained Jamie’s willpower, making subsequent ones harder to refuse.  
     - B) The diet "rule" is now broken, so each extra donut seems cheap (like a sunk cost).  
     - C) The first donut woke up a "craving monster" that demands more.  
     - D) Jamie’s true preference for donuts was unmasked—the diet was never sustainable.  

  7. **Gym Avoidance**: Jordan sets a 6 a.m. gym alarm. When it rings, they turn it off and sleep in, despite *no* craving to avoid exercise. Why?  
     - A) In that groggy state, Jordan doesn’t *feel* the gym’s benefits—their "knowing" is offline.  
     - B) Jordan’s willpower is weakest when half-asleep.  
     - C) A "comfort-seeking" subsystem overrules Jordan’s "health-focused" subsystem at dawn.  
     - D) Sleeping in reveals Jordan’s true preference: they value rest more than fitness.  

  8. **Planning Fallacy**: Sam estimates a project will take 2 days (knowing their past estimates are always too optimistic). It takes 6 days, causing stress. Why repeat this?  
     - A) Sam doesn’t *truly* learn from past errors—their "knowing" is flawed.  
     - B) Sam’s "optimistic planner" subsystem overpowers their "realistic self."  
     - C) Committing to a short timeline feels good now; future stress is discounted.  
     - D) Sam’s actions show they prefer the rush of optimism over boring accuracy.  

  ---

  ### Scoring Key  
  Tally your answers below. **Each letter corresponds to a theory**:  
  - **A = Socratic View** (Akrasia is ignorance: you’d act rightly if you *truly* knew the good).  
  - **B = Partition-of-the-Mind View** (Internal conflict: subsystems like "reason vs. appetite" battle).  
  - **C = Hyperbolic Discounting View** (Time inconsistency: future rewards are undervalued vs. immediate rewards).  
  - **D = Deflationary View** (No "weakness": actions reveal true preferences, and regret is discovery).  
  - **Willpower-as-Strength View** (Answers with "willpower" in them: a finite resource resisting temptation).  

  | Question | A (Socratic) | B (Partition) | C (Discounting) | D (Deflationary) | Willpower (if chosen) |  
  |----------|---------------|---------------|------------------|-------------------|------------------------|  
  | 1        | C             | –             | A                | –                 | B                     |  
  | 2        | A             | B             | C                | D                 | –                     |  
  | 3        | A             | B             | C                | D                 | –                     |  
  | 4        | –             | A (if "yes")  | –                | B (if "no")       | –                     |  
  | 5        | A             | B             | C                | D                 | –                     |  
  | 6        | –             | C             | B                | D                 | A                     |  
  | 7        | A             | C             | –                | D                 | B                     |  
  | 8        | A             | B             | C                | D                 | –                     |  

  #### How to Score  
  1. **Count your A/B/C/D selections** across all questions. Ignore "Willpower" for now.  
  2. **Separately count "Willpower" answers**: These are explicit mentions of willpower (e.g., 1B, 6A, 7B).  
  3. **Map to theories**:  
     - Your **highest tally** among A/B/C/D indicates your core theory.  
     - **Willpower-as-Strength**: If you chose ≥2 "Willpower" answers, this is your view (even if another letter scored higher).  
     - Tie? See "Ambiguities" below.  

  #### Theory Descriptions  
  - **Socratic View**: Akrasia is always ignorance (e.g., "you ate pizza because you didn’t *grok* its harm"). Fix: deeper knowledge.  
  - **Partition-of-the-Mind**: Akrasia is a civil war between subsystems (e.g., "your prefrontal cortex lost to your limbic system"). Fix: negotiate internal alliances.  
  - **Hyperbolic Discounting**: Akrasia is time inconsistency (e.g., "tomorrow’s gym feels less valuable than tonight’s Netflix"). Fix: bundling rewards/precommitments.  
  - **Deflationary View**: "Weakness" is a myth—actions reveal true preferences (e.g., "you didn’t quit smoking; you preferred it"). Fix: own your preferences.  
  - **Willpower-as-Strength**: Willpower is a muscle that resists temptation (e.g., "you succumbed because your willpower was depleted"). Fix: conserve/strengthen it.  

  #### Ambiguities & Design Notes  
  - **Why 8 questions?** To avoid fatigue while capturing nuance.  
  - **Separating theories**:  
    - **Discounting vs. Willpower**: Question 6 ("Breaks the Seal") splits them:  
      - Discounting (6B) sees the *decision rule* change ("diet broken → marginal cost drops").  
      - Willpower (6A) sees *energy depletion* ("resisting drained you").  
      - *But*: If you pick both elsewhere, scoring prioritizes willpower if ≥2 choices.  
    - **Socratic vs. Deflationary**: Both predict failure (e.g., Q3 relapse) but for opposite reasons:  
      - Socratic (3A): "You failed because you *didn’t know*."  
      - Deflationary (3D): "You failed because you *wanted it more*."  
      - Split by pattern: Socratic favors A answers; Deflationary favors D.  
  - **Unseparated pairs**:  
    - **Partition vs. Willpower** can blur (e.g., "willpower failure" implies a subsystem losing). The quiz prioritizes Partition unless willpower is explicitly chosen.  
    - **Discounting vs. Partition** overlap on "internal conflict" but split in Q4 (compulsion): Partition sees it as akrasia; Discounting typically doesn’t.  
  - **Edge cases**:  
    - Q4 (compulsion) splits theorists: Deflationary says "no" (it’s not preference-based); others often say "yes."  
    - Q1 (precommitment): Socratic (C) calls it a "crutch for ignorance"; others see it as rational.  

  **Takeaway**: No theory wins outright—the quiz exposes your *default lens*. Share your result in the comments!  

  ---  
  **Designer Notes**: This quiz isolates theories via conflicting intuitions about concrete cases (no jargon!). Key splits: Q6 (discounting vs. willpower), Q3 (Socratic vs. Deflationary), and Q4 (compulsion as akrasia). Willpower-as-Strength is flagged only if explicitly chosen, preventing collapse with discounting. The "partition vs. willpower" overlap is acknowledged but not fully resolved—a trade-off for brevity. Feedback welcome!
