      B) Alex's optimistic planning system is dominating their realistic system (Partition view).
      C) The immediate reward of starting a task (with an optimistic plan) is more appealing than the pain of a realistic plan (Hyperbolic discounting).
      D) Alex's actions reveal that they prefer the feeling of optimism when planning (Deflationary view).

    This might be a bit of a stretch for akrasia, but it's a common issue.

  Question 10: Moral temptation
    Scenario: Taylor finds a wallet full of cash. They know they should return it, but they are tempted to keep it. After a struggle, they return it.
