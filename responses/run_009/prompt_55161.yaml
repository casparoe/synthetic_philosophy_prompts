  We are designing a quiz to distinguish between different theories of akrasia (weakness of will). The theories we want to cover are:

  1. Socratic view: Akrasia is always a form of ignorance (if you truly knew the good, you would do it).
  2. Partition-of-the-mind view: There are conflicting motivational systems and one wins over the other.
  3. Hyperbolic discounting view: The problem is a preference reversal due to temporal discounting, and bundling (or precommitment) is the fix.
  4. Deflationary view: There is no true weakness of will; what appears as weakness is actually the revelation of your true preferences.
  5. Willpower-as-strength view: Willpower is like a muscle that can be strong or weak, and it resists temptation.

  We have several case types to include. We need 8-10 questions. Each question is a concrete scenario with 2-3 answer options. The answers should not require knowing the theories. Then we map patterns of answers to the theories.

  We also want to:
  - Flag any pair of theories that the quiz cannot separate (especially hyperbolic discounting and willpower view).
  - Include at least one case where two theories give the same verdict for opposite reasons, so that we can use the pattern to split them.

  Let's design the questions:

  Question 1: Hard Precommitment
    Scenario: Alex hands a friend $500 with the agreement that if Alex smokes even one cigarette in the next year, the friend keeps the money. Alex also signs up for a commitment app that locks away money if they smoke. Alex has been trying to quit for a long time and believes that without this, they will smoke again.
    Question: What is the primary reason for Alex's precommitment?
      A) Alex is being rational by binding their future self to avoid the temptation (Hyperbolic discounting view: precommitment as a tool against discounting).
      B) Alex is demonstrating that they don't trust their own willpower to resist in the moment (Willpower-as-strength view: willpower might fail, so they use an external crutch).
      C) Alex is acting out of ignorance because if they truly understood the harms of smoking, they wouldn't need such a device (Socratic view: precommitment is unnecessary if you really know).

    Note: The deflationary view might say that the precommitment is just a way to reveal that Alex actually prefers not to smoke in the long run, but the question is about why they do it. The partition view might see it as a way to let the long-term self overpower the short-term self.

    We can use this to split: 
      A and B are similar but focus on different reasons (discounting vs willpower). We might have to design another question to split these two.

  Question 2: Procrastination without craving
    Scenario: Jamie has a report due in two days. They know it's important and they want to do it. They even feel good when they work on it. But they keep putting it off to do trivial things like cleaning the kitchen or browsing the internet. There's no craving or desire to avoid the task; in fact, they endorse doing it the whole time.
    Question: What is the best explanation for Jamie's behavior?
      A) Jamie doesn't fully understand the negative consequences of delaying (Socratic view: if they really knew, they would start).
      B) There is a part of Jamie's mind that is avoiding the task, even if consciously they endorse it (Partition-of-the-mind view).
      C) Jamie's preference for immediate gratification (even from trivial tasks) is temporarily overwhelming the long-term goal (Hyperbolic discounting view).
      D) This is not true weakness of will because Jamie actually prefers to do the trivial tasks at the moment (Deflationary view: the actions reveal the true preference).

    Note: The willpower view might be similar to hyperbolic discounting here, but willpower is about the strength to resist the trivial temptations.

    We might need to combine or adjust.

  Question 3: Addiction with sincere desire to quit
    Scenario: Casey has been trying to quit heroin for years. They sincerely tell their therapist they want to quit and are miserable when they use. Yet, they keep relapsing.
    Question: Why does Casey keep relapsing?
      A) Casey doesn't truly understand the harm of heroin at the moment of use (Socratic view).
      B) Casey's craving in the moment is so strong it overpowers their long-term goals (Partition-of-the-mind or willpower view: the craving is a force that wins).
      C) Casey's discount curve makes the immediate high overwhelmingly valuable compared to the future harms (Hyperbolic discounting view).
      D) Casey's actions show that, in the moment, they actually prefer using heroin to quitting (Deflationary view).

    This is a classic case and can help split several views.

  Question 4: Compulsive checker
    Scenario: Morgan checks that the stove is off 20 times before leaving the house, even though they know it's off. They feel intense anxiety if they don't check and they wish they could stop.
    Question: Is this akrasia (weakness of will)?
      A) Yes, because Morgan cannot make themselves stop despite wanting to (similar to addiction).
      B) No, because this is a compulsion driven by anxiety, not a failure of will (it's a different kind of issue).

    We can use this to see if the quiz-taker extends akrasia to compulsions or not. The partition view might see it as a conflict between the anxiety system and the rational system. The deflationary view might say Morgan's actions reveal a strong preference to avoid anxiety. The Socratic view might say Morgan doesn't truly know that the stove is off? That seems odd.

    This might be a boundary case.

  Question 5: Belief-behavior lag
    Scenario: Taylor stopped believing in their religion two years ago, but they still attend church every week because they feel guilty at the thought of leaving. They wish they could just stop going.
    Question: What explains Taylor's behavior?
      A) Taylor doesn't truly know that leaving is the right choice (Socratic view: if they fully knew, they would leave).
      B) Taylor's emotional attachment to the community is a strong motivator that conflicts with their new belief (Partition view).
      C) Taylor is discounting the future benefits of leaving because the immediate guilt is too strong (Hyperbolic discounting).
      D) Taylor's actions reveal that they actually still value the church community (Deflationary view).

  Question 6: "Breaks the seal" case
    Scenario: Sam is on a diet. They have been avoiding sweets for a month. At a party, they eat one donut. Immediately after, they think, "Well, I've already broken my diet, so I might as well have more," and they eat several more.
    Question: What is the best explanation for Sam's behavior after the first donut?
      A) The first donut reduced Sam's self-control strength, making it harder to resist (Willpower-as-strength view: like a muscle that gets tired).
      B) The first donut changed Sam's perception of the diet rules: now the diet is broken, so the cost of additional donuts is low (Hyperbolic discounting view: the marginal cost of each additional donut is now lower because the fixed cost of breaking the diet is sunk).
      C) The first donut awakened a craving that was dormant (Partition view: the craving system is now active and winning).
      D) Sam's true preference for donuts was revealed by the first one, and the rest is consistent with that (Deflationary view).

    This is a good candidate for having two theories give the same verdict (they both predict Sam will eat more) but for different reasons (A: willpower depletion; B: rule perception and discounting).

