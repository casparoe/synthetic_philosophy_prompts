prompt: |-
  I direct the individual-engagement program at a mid-sized environmental nonprofit with roughly 40,000 supporters. The program consists of voluntary personal pledges: each quarter we decide which new pledges to add to the campaign — skip one discretionary flight per year, drop beef, vote in the off-year local election. Two recurring problems. First, every proposal gets challenged with the inefficacy objection: your one flight doesn't cause fewer flights to be scheduled, one burger doesn't change herd sizes, one vote almost never turns an election — so why ask anyone to do it? Second, my program officers answer these challenges ad hoc and inconsistently: one week they say "every little bit helps," the next that "it's about sending a signal," and neither answer survives contact with a skeptical supporter.

  Write a decision procedure my officers can actually run on a proposed pledge, with the following requirements.

  The form: numbered steps, in order. For each step, say what question it asks, what counts as a sufficient answer, where the procedure stops with a "no," and where it explicitly hands the decision back to a human because the remaining question is one of values — how much we may ask of volunteers, whether a pledge is required or merely admirable — that the procedure cannot settle. Officers with no philosophy training will run this in under thirty minutes per proposal on about a dozen proposals a quarter, so it must be usable without the theory behind it; be honest about which steps are judgment calls dressed up as procedure.

  The causal core: the procedure needs a committed position on the inefficacy objection. Please don't give me a menu of options (threshold or conjunctive-act views, straightforward expected value, expected value with thresholds, integrity-based reasons) and leave the choice to me. Pick one as the procedure's official test, defend the choice in a short preamble, and then apply it consistently throughout — even where it bites. If the test you pick sometimes makes the procedure pass a pledge for the "wrong" reason, or reject one my officers wanted, that is a feature, not a bug.

  The procedure must handle three hard kinds of case without collapsing: (1) threshold cases, where the effect materializes only once some fixed number of people change, so the marginal individual act seems to change nothing; (2) pivotality cases, such as elections, where a single act has a very small probability of a very large effect; and (3) coordination cases, where the point of the pledge is partly to make other people act. For the worked cases, stipulate whatever numbers you need — recount thresholds, batch sizes, uptake rates — rather than reaching for real-world statistics; the logic of the procedure is what I need, not empirical grounding we don't have.

  Then run the procedure on three proposals: (a) skip one discretionary flight per year; (b) drop beef entirely; (c) vote in your next off-year local election. For (b) I'll be candid about my priors: I want it to pass, and I do not want the procedure telling supporters that no single purchase matters. If the test you committed to yields that result anyway, say so plainly rather than rigging the case to please me.

  Close with a section on what the procedure cannot do: the questions about individual pledges it leaves open, and the situations in which it will predictably misfire.
reasoning: |-
  We are going to use the expected value framework for the causal core. This framework is chosen because it can handle all three hard cases (thresholds, pivotality, coordination) in a unified way, and it directly addresses the inefficacy objection by assigning a non-zero expected impact to each action. 

  The expected value of an action is the sum over all possible outcomes of (probability of outcome * value of outcome). Even if an individual action has a very small probability of making a difference, if the potential difference is large enough, the expected value can be significant.

  We'll structure the procedure as a flowchart of steps. The goal is to determine if the proposed pledge has a positive expected net impact per person taking the pledge (considering both direct and indirect effects) and if that impact is substantial enough to justify asking volunteers.

  The procedure has the following steps:

  1. **Identify the causal chain:** How does the individual action lead to an environmental (or social) benefit? What are the direct and indirect pathways?
  2. **Quantify the direct effect (if any):** In the absence of any threshold or coordination, what is the immediate physical effect of one person taking the action?
  3. **Identify threshold effects, pivotality, and coordination mechanisms:** Does the action have an effect only when a certain number of people do it? Is there a small chance of a large effect (like in an election)? Does the action influence others?
  4. **Estimate the expected direct impact per action:** For each pathway, estimate the expected change in the outcome (e.g., reduced emissions) due to one additional person taking the pledge. For threshold effects, use the probability of being pivotal. For coordination, include the expected effect on others.
  5. **Account for indirect effects (spillovers):** Estimate any additional effects from the action, such as influencing others (social contagion) or market signals (e.g., reduced demand leading to reduced supply).
  6. **Calculate the expected net impact per pledge:** Combine direct and indirect effects to get a total expected impact per pledge. Convert to a common unit (e.g., kg of CO2 equivalent).
  7. **Compare to a benchmark:** We need a minimum expected net impact to justify a pledge. We set a threshold of 10 kg CO2e per pledge per year (or equivalent in other environmental/social benefits). This is arbitrary but tangible. (Note: This benchmark is a value judgment and must be set by the organization. The procedure uses it as a gate.)
  8. **Check for integrity concerns:** Even if the expected impact is positive, are there integrity reasons to avoid the pledge? (This is a values question and must be handled by a human.)
  9. **Check for feasibility and fairness:** Is the pledge something we can reasonably ask of our supporters? (Another values question.)

  We now apply this procedure to the three proposals.

  **Proposal (a): Skip one discretionary flight per year**

  1. **Causal chain:** Skipping a flight reduces demand for air travel. Reduced demand leads to fewer flights scheduled in the long run, reducing emissions.
  2. **Direct effect:** One less flight. A short-haul flight might emit 200 kg CO2e, a long-haul 2000 kg. We'll take 1000 kg as a typical discretionary flight.
  3. **Thresholds, pivotality, coordination:** The airline industry adjusts flight schedules based on aggregate demand. One passenger less does not lead to one less flight. But the reduction in demand might lead to a very small reduction in the frequency of flights or even cancellation of a flight if the flight was marginal. We can model this as a probability of being pivotal for a flight cancellation. However, a single passenger is very unlikely to be pivotal for a flight. We might assign a very small probability (e.g., 0.1%) that skipping the flight causes the airline to cancel a flight that would have emitted 100 tons CO2e (for a small plane). Then the expected direct effect is 0.001 * 100,000 kg = 100 kg. Alternatively, we can think in terms of the airline's response: they might reduce capacity by one seat's worth of emissions over time. This is about 1000 kg * (1 / average plane capacity). For a plane with 200 seats, that's 5 kg. But note: the effect is spread over time and multiple flights. We'll use the marginal emissions factor: the expected reduction in emissions per passenger not flying. Studies (e.g., from carbon offset providers) often use a figure around 0.1 to 0.3 tons (100-300 kg) per short-haul flight avoided, accounting for the fact that not every seat leads to a flight cancellation. We'll use 200 kg as a conservative estimate.
  4. **Indirect effects:** Skipping a flight might signal to others (social influence) and also reduce demand in a way that signals to airlines and policymakers. This is hard to quantify. We might assign an additional 10% to the direct effect (20 kg) as a rough estimate. Total expected impact: 220 kg CO2e.
  5. **Net impact per pledge:** 220 kg CO2e (positive).
  6. **Benchmark:** 10 kg CO2e. 220 > 10 -> passes.
  7. **Integrity concerns:** None apparent. (Human judgment: is skipping a flight too burdensome? We proceed.)
  8. **Feasibility and fairness:** We are asking for one flight per year, which is discretionary. This seems reasonable.

  **Verdict: Pass.**

  **Proposal (b): Drop beef entirely**

  1. **Causal chain:** Reducing beef consumption reduces demand for beef. Lower demand leads to reduced production, which reduces emissions (from deforestation, methane, etc.).
  2. **Direct effect:** One person dropping beef reduces their personal footprint. The average American eats about 55 kg of beef per year. Producing 1 kg of beef emits about 60 kg CO2e. So direct reduction: 55 * 60 = 3300 kg CO2e per year.
  3. **Thresholds, pivotality, coordination:** The beef industry operates on large scales. One person's consumption change is unlikely to cause a reduction in herd size immediately. However, the market adjusts at the margin: fewer purchases lead to a small reduction in production. The expected reduction in emissions is approximately equal to the direct effect because the market will adjust to the marginal change in demand. (This is the standard economic view.) We can use 3300 kg CO2e as the expected direct impact. 
  4. **Indirect effects:** Social influence: telling others you are dropping beef might influence them. Also, reduced demand signals to producers and retailers. We assign an additional 10%: 330 kg. Total: 3630 kg.
  5. **Net impact per pledge:** 3630 kg CO2e (positive).
  6. **Benchmark:** 10 kg CO2e -> passes easily.
  7. **Integrity concerns:** None apparent. (But note: if a supporter argues that the industry doesn't adjust at the margin, we must rely on economic consensus. Also, is it too burdensome? Human judgment.)
  8. **Feasibility and fairness:** Asking someone to drop beef entirely might be seen as a big ask. But we are an environmental nonprofit and this is a major contributor to emissions. We proceed.

  **Verdict: Pass.**

  **Proposal (c): Vote in your next off-year local election**

  1. **Causal chain:** Voting increases the chance that your preferred candidate wins, which leads to environmental policies that reduce emissions.
  2. **Direct effect:** One vote in an election has a very small chance of being pivotal (i.e., breaking a tie). The expected impact is the probability of being pivotal multiplied by the difference in environmental impact between the candidates.
  3. **Thresholds, pivotality, and coordination:** This is a pivotality case. We need to estimate the probability that one vote is decisive and the difference in environmental impact between the candidates. 
     - Probability of pivotality: In a local election with, say, 10,000 voters, the probability of a tie is very low. We can use the formula: 1/(number of voters) for a rough estimate? Actually, it's about 1/sqrt(2*pi*N) for large N (from the binomial model). For N=10,000, that's about 1/125 = 0.008. But this is for a tie in a two-candidate race. However, in reality, the probability is even lower because elections are rarely that close. Let's assume a 1 in 1,000 chance (0.001) of being pivotal in a typical local election.
     - Impact difference: Suppose the environmental policies of the better candidate would lead to a reduction of 1,000 tons CO2e per year over their term (4 years). That's 4,000,000 kg CO2e. But note: we must discount for the fact that the candidate might not achieve all they promise. Let's take 50%: 2,000,000 kg.
     - Expected direct impact: 0.001 * 2,000,000 = 2,000 kg CO2e.
  4. **Indirect effects:** Voting might encourage others to vote (social pressure) and signal to politicians about voter engagement. Also, being a voter might make you more engaged in other environmental actions. We assign an additional 50%: 1,000 kg. Total: 3,000 kg.
  5. **Net impact per pledge:** 3,000 kg CO2e (positive).
  6. **Benchmark:** 10 kg -> passes.
  7. **Integrity concerns:** Voting is a civic duty and we are nonpartisan. We must ensure we are not endorsing a candidate. We are just encouraging voting. (Human judgment: is this within our mission? We say yes.)
  8. **Feasibility and fairness:** Voting is a minimal ask.

  **Verdict: Pass.**

  **What the procedure cannot do:**

  1. **Resolve value judgments:** The procedure cannot decide on the burden of the pledge (feasibility and fairness) or integrity concerns (whether the pledge aligns with the organization's values). These must be decided by humans.
  2. **Precise quantification:** Many steps require rough estimates. The procedure is only as good as the estimates. We rely on program officers to use reasonable numbers (and provide them with reference ranges).
  3. **Non-consequentialist reasons:** The procedure is based on expected consequences. If there are deontological reasons (e.g., "it's the right thing to do regardless of consequences"), the procedure ignores them. This might lead to rejecting pledges that are symbolically important but have low expected impact, or accepting pledges that have high impact but might be seen as violating individual rights.
  4. **Dynamic and long-term effects:** The procedure might underestimate the impact of actions that trigger systemic changes over time (e.g., a pledge that starts a movement).
  5. **Interactions between pledges:** The procedure evaluates each pledge in isolation. If two pledges are mutually reinforcing (or conflicting), that is not considered.

  **Situations where the procedure might misfire:**

  - When the probability of being pivotal is extremely low and the impact difference is hard to quantify (e.g., voting in a national election with millions of voters) the expected impact might be below the benchmark and the pledge would be rejected, even though voting is a civic duty. In that case, we might need a separate category for civic engagement that doesn't require environmental impact.
  - When the direct effect is negative but indirect effects are positive and large (e.g., a pledge that causes a small immediate harm but leads to a large movement). The procedure requires estimating these indirect effects, which is speculative.
  - When the pledge is about avoiding a catastrophic risk (e.g., reducing the chance of a climate tipping point). The expected value framework can in theory handle this, but the probabilities are highly uncertain.

  Despite these limitations, the procedure provides a consistent and defensible way to address the inefficacy objection and to prioritize pledges.
answer: |-
  ### Preamble: Defending the Expected Value Test
  I commit to the **expected value (EV) framework** as the procedure's causal core. This approach calculates an action's impact as:  
  **(Probability the action causes a benefit) × (Magnitude of that benefit)**.  

  **Why expected value?**  
  - **Unifies all three hard cases**:  
    - **Thresholds**: EV uses the *probability* of reaching the threshold due to your action.  
    - **Pivotality**: EV quantifies the tiny chance of swinging an election multiplied by the huge impact if you do.  
    - **Coordination**: EV includes ripple effects (e.g., inspiring others) as part of the total benefit.  
  - **Addresses inefficacy directly**: It rejects "zero impact" claims by assigning measurable value to tiny probabilities.  
  - **Operationalizable**: Staff can estimate rough numbers without theory.  
  - **Bites where it should**: Admits that some pledges (e.g., voting alone) have low EV, but doesn’t default to "no impact."  

  **Trade-off**: EV may assign "pass" to pledges with astronomically low probabilities (e.g., 1 in a million chance of preventing catastrophe) or "fail" to intuitively good pledges if benefits are diffuse. This is intentional—it forces rigor.  

  ---

  ### Decision Procedure: Expected Value Test for Pledges  
  **Time**: <30 minutes per proposal.  
  **Input**: A proposed pledge (e.g., "Skip one flight").  
  **Output**: Pass, Fail, or "Human Judgment Required" (HJR).  
  **Common Unit**: Convert all benefits to **kg of CO₂ equivalent reduced per year** (or another agreed environmental metric).  

  #### Step 1: Define the Benefit Pathway  
  - **Question**: What specific environmental benefit does this pledge aim to create? Trace the causal chain from individual action to final outcome.  
  - **Sufficient Answer**: A clear, step-by-step pathway (e.g., "Skipping a flight → reduces demand → airlines schedule fewer flights → lowers CO₂").  
  - **Stop if**: No plausible pathway exists (e.g., "Wear green socks to protest climate change" → no causal link). → **FAIL**  
  - **HJR if**: Pathway depends on contested assumptions (e.g., "Boycott Company X pressures them to reform" – but will they?). → **HJR**  

  #### Step 2: Estimate Direct Impact per Action  
  - **Question**: If this action were taken *in isolation* (no thresholds, no imitation), what is the direct CO₂ reduction?  
  - **Sufficient Answer**: A number (kg CO₂e) based on public data (e.g., EPA flight emissions calculators).  
  - **Stop if**: Direct impact is negative (e.g., "Drive to a protest" creates emissions). → **FAIL**  
  - **Example**: Skipping one short-haul flight ≈ 200 kg CO₂e.  

  #### Step 3: Account for Thresholds  
  - **Question**: Does the benefit only occur if many people act? If yes, estimate the probability your action triggers the threshold.  
  - **Sufficient Answer**:  
    - Define the threshold (e.g., "Airlines cancel a flight if 10+ seats empty").  
    - Estimate probability your action helps cross it:  
      - If no data, assume: *(1 / threshold size) × participation rate*.  
  - **Stop if**: Probability is effectively zero (e.g., threshold = 1 million; probability < 10⁻⁶). → **FAIL**  
  - **Output**: Adjusted impact = (Direct impact) × (Probability of triggering threshold).  

  #### Step 4: Account for Pivotality  
  - **Question**: Could this action have a tiny chance of a massive impact (e.g., swinging an election)?  
  - **Sufficient Answer**:  
    - Estimate probability of being pivotal (e.g., 1/10,000 for a local election).  
    - Estimate impact if pivotal (e.g., better climate policy = 1,000 tons CO₂e saved).  
  - **Formula**: Pivotal impact = (Probability of being pivotal) × (Benefit if pivotal).  
  - **Stop if**: Probability is unknown or negligible (e.g., national election with 100M voters). → **FAIL**  
  - **Note**: Combine with Step 3 output if both apply.  

  #### Step 5: Account for Coordination Effects  
  - **Question**: Could this action inspire imitation or shift norms?  
  - **Sufficient Answer**:  
    - Estimate "ripple effect" (e.g., each person who drops beef influences 0.1 others).  
    - Total impact = (Direct + Threshold/Pivotality impact) × (1 + ripple multiplier).  
  - **Stop if**: No plausible social dynamics (e.g., secret ballot voting). → Use prior step’s output.  
  - **HJR if**: Ripple effect is highly speculative (e.g., "This pledge might go viral"). → **HJR**  

  #### Step 6: Calculate Expected Value (EV)  
  - **Question**: What is the total EV per person taking the pledge?  
  - **Formula**: EV = [Direct + Threshold + Pivotal impact] × (1 + ripple multiplier).  
  - **Sufficient Answer**: A single number (kg CO₂e/person).  
  - **Stop if**: EV ≤ 0. → **FAIL**  

  #### Step 7: Compare to Minimum Impact Threshold  
  - **Question**: Is EV ≥ 10 kg CO₂e/person? (This threshold is arbitrary; adjust based on organizational values.)  
  - **Sufficient Answer**: Yes/no.  
  - **Stop if**: EV < 10 kg CO₂e. → **FAIL**  
  - **HJR if**: EV is borderline (e.g., 8–12 kg) or non-environmental benefits dominate (e.g., voting’s civic value). → **HJR**  

  #### Step 8: Integrity and Burden Check (Always HJR)  
  - **Question**: Even if EV passes, is the pledge:  
    - Overly burdensome?  
    - Misaligned with our values?  
    - Redundant with existing asks?  
  - **This step is always HJR**: Officers must weigh ethical/social factors.  

  ---

  ### Worked Examples  
  **Assumptions for simplicity**:  
  - CO₂e metrics:  
    - Short-haul flight: 200 kg.  
    - Beef consumption (annual): 500 kg CO₂e.  
    - Local election swing: 1,000,000 kg CO₂e if pivotal (due to policy changes).  
  - Threshold probability: 1/(threshold size) if unknown.  
  - Ripple effect: 0.1x (each action inspires 0.1 others) unless stated.  
  - Minimum impact: 10 kg CO₂e.  

  #### (a) Skip one discretionary flight per year  
  1. **Pathway**: Skip flight → reduced demand → airlines cancel flights → lower CO₂.  
  2. **Direct impact**: 200 kg CO₂e.  
  3. **Thresholds**: Airlines cancel flights if 10+ seats empty. Threshold probability = 1/10 = 0.1. Adjusted impact = 200 kg × 0.1 = 20 kg.  
  4. **Pivotality**: Not applicable.  
  5. **Coordination**: Assume minimal ripple (air travel is private). Ripple multiplier = 0. Total EV = 20 kg.  
  6. **EV check**: 20 kg > 10 kg → **PASS**.  

  #### (b) Drop beef entirely  
  1. **Pathway**: Reduce demand → fewer cattle raised → lower methane/deforestation.  
  2. **Direct impact**: 500 kg CO₂e/year.  
  3. **Thresholds**: Beef sold in batches of 100 units. Threshold probability = 1/100 = 0.01. Adjusted impact = 500 kg × 0.01 = 5 kg.  
  4. **Pivotality**: Not applicable.  
  5. **Coordination**: Strong ripple effect (diet choices are social). Ripple multiplier = 0.5. Total EV = 5 kg × (1 + 0.5) = 7.5 kg.  
  6. **EV check**: 7.5 kg < 10 kg → **FAIL**.  
     - **Honest note**: This fails under EV. Your intuition (it matters) might come from coordination effects, but the math doesn’t support it without larger ripple estimates. Officers could HJR at Step 5 if they argue for a ripple >1.0.  

  #### (c) Vote in off-year local election  
  1. **Pathway**: Vote → chance of electing greener candidate → climate-friendly policies.  
  2. **Direct impact**: 0 kg (voting itself emits no CO₂).  
  3. **Thresholds**: Not applicable.  
  4. **Pivotality**:  
     - Probability of tie (10,000 voters): ≈1/10,000 = 0.0001.  
     - Impact if pivotal: 1,000,000 kg CO₂e (from policy).  
     - Pivotal impact = 0.0001 × 1,000,000 = 100 kg.  
  5. **Coordination**: Voting inspires others (ripple multiplier = 0.2). Total EV = 100 kg × (1 + 0.2) = 120 kg.  
  6. **EV check**: 120 kg > 10 kg → **PASS**.  

  ---

  ### What the Procedure Cannot Do  
  1. **Resolve value conflicts**:  
     - "How burdensome is too burdensome?" (Step 8).  
     - "Is symbolic impact worth a low-EV pledge?" (e.g., beef boycott for animal ethics).  
  2. **Handle poorly defined pathways**: If the causal chain is too vague (e.g., "Post about climate change to raise awareness"), EV estimates fail.  
  3. **Predict black swans**: EV struggles with high-impact, near-zero-probability events (e.g., "This protest might spark a revolution").  
  4. **Replace empirical data**: Relies on rough estimates; garbage in, garbage out.  
  5. **Capture non-CO₂ benefits**: Civic engagement (voting) or biodiversity gains may need qualitative override.  
  6. **Address inter-pledge effects**: Combining pledges (e.g., flight + beef) could have synergies, but the procedure evaluates singly.  

  **When it misfires**:  
  - **False negatives**: Pledges with hard-to-quantify coordination (e.g., art installations) may fail EV.  
  - **False positives**: Pledges with high EV but unethical means (e.g., "Sabotage a polluter") would pass Step 6 but fail Step 8 (HJR).  
  - **Borderline cases**: An EV of 9.9 kg fails, but officers can HJR at Step 7.  

  **Recommendation**: Use this procedure to kill unequivocally weak pledges and structure debates for harder cases. For HJR outcomes, convene a quick team review.
