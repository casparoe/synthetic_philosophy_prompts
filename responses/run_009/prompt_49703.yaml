answer: |-
  Here's a comprehensive Q&A prep sheet tailored to your group's likely objections, ordered by probable sequence, with philosophically precise phrasing, sharp replies, and vulnerability notes. The "dreaded question" is included.

  ---

  ### **Q&A Prep Sheet: St. Petersburg Paradox Presentation**  
  **Your Thesis:** *The paradox is an artifact of unphysical idealization; capping payouts/resources dissolves it.*  

  ---

  #### **Objection 1: "But the paradox is mathematical! Physics is irrelevant to ideal rationality."**  
  **Phrasing:**  
  *"The St. Petersburg game is defined in probability space. Rational agents maximize expected utility (EU) under that model. If EU diverges, rationality demands we pay any finite entry fee—regardless of physical feasibility. Dismissing it as 'unphysical' conflates normative rationality with descriptive constraints."*  

  **Your 2-Minute Reply:**  
  "Ideal rationality still requires *internally consistent models*. Infinite EU arises from an incoherent premise: a counterparty with unbounded resources. This violates the model’s own axiomatic basis (e.g., Savage’s guarantee of finite consequences). Physics reveals the idealization’s pathology—just as uncoolable reservoirs break thermodynamics. We don’t call Carnot’s efficiency paradoxical; we fix the model."  
  **Where It’s Soft:**  
  Concedes that "rationality" might exclude physical constraints. Hardline formalists will insist math trumps ontology.  

  ---

  #### **Objection 2: "Capping violates the thought experiment! You’re changing the game."**  
  **Phrasing:**  
  *"Imposing a cap (e.g., casino bankroll ≤ $M) constructs a different game. The original paradox asks: ‘Why is EU maximization problematic *here*?’ Hand-waving caps dodges the normative puzzle for rational agents in the idealized setting."*  

  **Your 2-Minute Reply:**  
  "The 'idealized setting' is logically inconsistent—no entity *can* offer infinite payouts. This isn’t a minor approximation error; it’s a category error. We cap not to avoid the paradox but to *expose* the flaw. In physics, we reject infinite uniform universes to resolve Olbers’ paradox; here, we cap payouts to resolve St. Petersburg. The paradox only exists *because* the idealization is broken."  
  **Where It’s Soft:**  
  Assumes "logically inconsistent" is self-evident. Critics may argue math permits infinities without contradiction.  

  ---

  #### **Objection 3: "Dutch Books! If you reject unbounded EU maximization, I can exploit you."**  
  **Phrasing (Actuary’s Angle):**  
  *"If your decision theory rejects paying large sums for St. Petersburg-like games, I can construct a Dutch Book: a series of bets you’d accept individually (each with positive EU) that collectively guarantee your loss. EU maximization avoids this—your 'cap' invites incoherence."*  

  **Your 2-Minute Reply:**  
  "Dutch Books require *operational* bets. No counterparty can offer the St. Petersburg game’s tail payouts—so the Dutch Book isn’t implementable. More deeply: if your 'series of bets' includes unrealizable tail events, it’s not a coherent Dutch Book. Rationality shouldn’t demand defending against impossible exploits."  
  **Where It’s Soft:**  
  Assumes Dutch Books require physical feasibility. Purists may argue they’re purely logical tools.  

  ---

  #### **Objection 4: "Utility functions resolve it cleanly without caps (e.g., log-utility). Why reject that?"**  
  **Phrasing:**  
  *"Bernoulli resolved this in 1738! Diminishing marginal utility (e.g., U(w) = log(w)) ensures finite EU. Your physicalist approach is redundant and less elegant."*  

  **Your 2-Minute Reply:**  
  "Utility rescues *are* elegant—but they’re distinct from my point. Even with linear utility (where the paradox bites hardest), the game *still* can’t exist. Caps address the *source* of infinity; utility functions mask it. We shouldn’t need psychophysics to fix a broken game design. Physics and utility are complementary fixes."  
  **Where It’s Soft:**  
  Utility solutions are entrenched. Your argument may seem like overkill if diminishing utility is accepted.  

  ---

  #### **Objection 5: "What about Pasadena or Altadena games? They’re capped but still paradoxical!"**  
  **Phrasing:**  
  *"Norton’s Pasadena game (payoff = (−1)^{n+1} 2^n/n$) has finite bounds and expected value that’s conditionally convergent (i.e., depends on summation order). This resurrects the paradox *within* your capped framework. Rationality can’t prescribe a single 'fair price'—isn’t that the real paradox?"*  

  **Your 2-Minute Reply:**  
  "Pasadena leverages conditional convergence—a purely mathematical pathology. But its payouts require infinite coin flips *and* arbitrarily precise accounting of vanishingly small probabilities. Cosmology (e.g., Planck time/energy) caps the *number* of flips and *precision* of payouts. No physical device can implement Pasadena either."  
  **Where It’s Soft:**  
  Conditional convergence is a tougher challenge. Critics may argue finite-flip approximations still yield unstable EU.  

  ---

  ### **The Dreaded Question (Lévy Walks Edition)**  
  **Phrasing:**  
  *"Consider a *Lévy walk* capped at heat death: payouts grow as (1.5)^n but probabilities decay as 1/n^α (α>2). For α≤3, EU diverges *despite* finite time/resources. Doesn’t this recreate the paradox within your constraints?"*  

  **Why It’s Feared:**  
  Uprises bounded resources with heavy-tailed statistics. EU → ∞ while total payout mass is finite.  

  **Your 2-Minute Reply:**  
  "Brilliant—but sneaky! Here’s why it fails:  
  1. **Physical realizability**: To execute k flips before heat death, the *minimum time per flip* is bounded. Payouts growing as (1.5)^n require exponentially faster flips—violating quantum speed limits (Bremermann’s bound).  
  2. **Bankroll granularity**: Paying $2^{100}$ requires more atoms than exist. The ‘cap’ isn’t just cosmological; it’s combinatorial.  
  This is St. Petersburg in a funhouse mirror—but the idealization is *still* broken. Nature censors heavy tails."  
  **Where It’s Soft:**  
  Relies on physical limits (Bremermann’s bound) the group may reject as "external."  

  ---

  ### **Closing Strategy**  
  **When pressed:** Emphasize that *all* models break under extreme extrapolation. The paradox reveals EU maximization’s fragility, not a flaw in rationality. Your cap isn’t arbitrary—it’s a *discovery* of the model’s domain of validity.  
  **Quote to deploy:** *"In physics, when an infinite reservoir breaks your model, you don’t declare perpetual motion possible—you recalibrate. Why should rationality be held to a lower standard?"*  

  Good luck! They’ll be merciless—but you’ve got the harder-nosed discipline.
