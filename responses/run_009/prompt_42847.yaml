  ### Cost of Saving All Verdicts
  - **No verdict must be surrendered**, but Remark 3 requires discipline:  
    - **Cost**: You must resist the bookkeeping artifact. The update *only* affects P(D|\neg S) and P(V|\neg S), not P(S). If your odds-table shows P(S) rising, revisit your prior joint probabilities for coherence (e.g., ensure P(S) is independent of the judges' preferences given \neg S).  
  - **Complexity**: The two-part principle adds nuance, but it is necessary to handle both probabilistic and categorical uses of conditionals.  

  ### Application to the Agent's Last Message
  **Message**: "If the shortlist leaks before Thursday (L), your book is on it (S)."  
  **Your numbers**: P(L) = 0.05, P(S) = ? (depends on prior updates).  
