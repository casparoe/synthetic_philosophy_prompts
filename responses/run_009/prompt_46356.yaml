prompt: |-
  I teach intro to free will every fall, and this semester it finally hit me that my own gut verdicts on the responsibility cases don't obviously add up to any one theory, and I'd rather sort that out before I stand in front of thirty undergrads pretending the reading assignments settled it. So here's my pattern of verdicts, and I want you to tell me what principle, if any, captures it, and which verdicts I have to give up to get a clean one.

  The drunk driver who kills a pedestrian is more culpable than the identical drunk driver who gets home with the same bad luck of no one being on that road — my gut insists on that even though I know the luck objection is coming. The person who develops a brain tumor that produces violent impulses and hurts someone: not responsible, full stop. Someone raised in horrific circumstances who mugs a tourist: diminished but not off the hook — and I can't for the life of me say why deprived circumstances only discount while a tumor zeroes out, since neither causal history was under the person's control. Someone who acts with a gun to their head: not responsible, even though they did choose, which seems to tell me that mere choice can't be the whole story. A psychopath who genuinely cannot grasp that others' suffering counts: I keep wanting to say he's not responsible, but I also don't want him walking around, and I suspect my verdict there is contaminated by practical worry rather than any actual judgement about desert.

  So: is there a principle — some capacity-based thing, reasons-responsiveness, control over character, whatever — that gets all or nearly all of these? Say precisely what each clause of your principle is doing for which verdict, and be honest about which of my verdicts it can't save, since I suspect the drunk-driving pair and the tumor/upbringing pair can't both come out clean. Then tell me what the principle predicts on a case I deliberately didn't list: someone who knowingly takes a drug that makes them reckless, and years later, still on it, badly injures a friend — responsible for what exactly, and does your answer change if the same recklessness instead crept in gradually from choices that were fully his? I'd also like one paragraph on whether my whole pattern of verdicts is quietly compatibilist or not, since I honestly can't tell and my students ask every year.
reasoning: |-
  Okay, let me start by unpacking the user's problem. They teach intro to free will and have these intuitive judgments about responsibility in various cases, but they can't find a unifying principle. Their main goal is to align their gut verdicts with a coherent theory before teaching. 

  First, I need to analyze each case they mentioned. The drunk driver pair shows they value outcome luck in moral responsibility, which is odd because luck usually shouldn't affect desert. Then the brain tumor case: no responsibility, which makes sense if the cause is external and overwhelming. But the deprived upbringing case is diminished responsibility. Why the difference? The tumor is a direct physical cause, while upbringing affects but doesn't eliminate agency. 

  The gun-to-head scenario: coerced choice voids responsibility. This suggests that voluntariness isn't sufficient; the circumstances matter. The psychopath is tricky. They feel the person isn't responsible due to incapacity but worry about practical consequences. That practical concern might be clouding their judgment.

  The challenge is finding a principle that accommodates all these. The user suspects the drunk drivers and tumor/upbringing pairs can't both be satisfied. So maybe a two-tiered approach? Capacity and provenance of impairment. Capacity covers the tumor and psychopath—lack of understanding or control. Provenance explains why upbringing diminishes but doesn't eliminate: the impairment came from within, even if influenced externally. 

  For the drunk driver, outcome luck affecting culpability is problematic. The user might need to concede that both drivers are equally responsible morally, even if we punish the one with harm more for practical reasons. But their gut insists on different culpability. That's a tension. 

  The drug case: if someone knowingly takes a drug causing recklessness, they're responsible for the initial choice and subsequent actions. Gradual recklessness from smaller choices? Still responsible because the impairment is traceable to voluntary actions. 

  Compatibilism: Their judgments lean compatibilist because they focus on capacities and control within deterministic chains, not requiring ultimate responsibility. But the outcome luck point might hint at incompatibilist intuitions. They need to reconcile that. 

  So, the principle combining capacity and provenance might work, but they have to give up different culpability for the drunk drivers. Admit that practical factors influence punishment, not moral desert. For the tumor vs. upbringing, provenance explains the difference. Psychopath's incapacity removes desert, but society still detains them—distinguishing moral responsibility from practical necessity. 

  The user's hidden need might be confidence in teaching without oversimplifying. They want to present a coherent view while acknowledging complexities. Highlighting where intuitions conflict with theory could be a teaching point. Emphasizing the distinction between moral desert and practical responses might resolve some tensions.
answer: |-
  Here's a principle that captures *most* of your verdicts, explains the tensions, identifies where you need to compromise, and clarifies the compatibilist leanings:

  **The Principle: Responsibility requires the *capacity for normative competence* at the time of action, *and* that this capacity was not *substantially impaired by factors entirely external to the agent's own prior willed choices* (where "willed choices" imply minimally competent agency).**

  Let's break it down clause-by-clause against your cases:

  1.  **"Capacity for normative competence":** This means the ability to understand relevant moral/legal norms *and* to control one's behavior in light of that understanding (a fusion of cognitive and volitional capacities).
      *   **Tumor Case:** ✅ *Directly destroys* the capacity for control (violent impulses) or potentially understanding (depending on location). **Not Responsible.**
      *   **Psychopath Case:** ✅ If genuinely *incapable* of grasping the normative significance of others' suffering (a deep cognitive deficit regarding morality), the core capacity is absent. **Not Responsible** (on desert grounds). (Practical detention is separate).
      *   **Gun-to-Head:** ✅ While choice exists, the *volitional* capacity is *overwhelmingly coerced*. The choice isn't a minimally free exercise of normative competence. **Not Responsible.**

  2.  **"Substantially impaired by factors entirely external to the agent's own prior willed choices":**
      *   **Deprived Upbringing Case:** ✅ The horrific circumstances *substantially impair* the development of normative competence (understanding/control). **Diminished Responsibility.** BUT, this impairment *wasn't* caused by something "entirely external" like a tumor. It arose through psychological development *in response* to environment, involving the agent's own (impaired) reactions over time. The impairment isn't "bolted on" externally; it's woven into the fabric of their agency, even if not *chosen*. Hence, responsibility isn't zeroed out, only diminished.
      *   **Tumor Case (again):** ✅ The impairment *is* entirely external (a random biological event). This clause reinforces the "Not Responsible" verdict. **Here's the tumor/upbringing distinction:** The tumor is an *alien* force; the deprived upbringing shapes a *damaged but still agential* self. Your principle distinguishes based on the *provenance* and *nature* of the impairment.

  3.  **Where the Principle Falters (The Compromise): The Drunk Driver Pair.**
      *   **The Problem:** Your gut says the driver who kills is *more culpable* than the identical driver who gets home. But outcome luck (pedestrian present/absent) doesn't change the *capacity* at the time of driving drunk, nor the *provenance* of the impairment (self-induced via choice). Both drivers exhibited identical recklessness and disregard for norms *they had the capacity to understand and avoid*. They *chose* to impair themselves.
      *   **The Principle's Verdict:** Both drivers are **equally culpable** for the reckless choice to drive drunk. The difference in outcome is *moral luck*.
      *   **What You Need to Give Up:** To maintain consistency with your other verdicts (especially Tumor vs. Upbringing) and this principle, you likely need to concede that your gut over-punishes outcome luck in this pair. The driver who kills isn't *more blameworthy* for the *reckless choice*; we punish them more severely because harm *resulted*, but that's a *consequentialist/practical* distinction (deterrence, retribution for harm), not necessarily a deeper *desert* distinction regarding the initial culpable act. Your principle demands focusing on the quality of the will/capacity *at the time of the reckless action*, which was identical.

  4.  **The Drug Cases:**
      *   **Knowingly Takes Recklessness-Inducing Drug, Years Later Injures Friend:** Responsible. The principle focuses on capacity *at the time of injury*. If the drug has caused *permanent, severe incapacity* (akin to the tumor), then potentially not responsible. But if it just induces recklessness while leaving core understanding and *some* control intact (even if impaired), then **responsible**. Crucially, the *provenance* of the impairment matters: it stemmed directly from their *own prior willed choice* (taking the drug knowing its effects). They are responsible for creating the impaired state that led to the injury.
      *   **Gradual Recklessness from Own Choices:** **Fully Responsible.** The impaired state (recklessness) developed gradually through a series of choices that were, by your description, "fully his" – meaning made with normative competence. The impairment is *self-created* through a history of competent choices, not imposed externally (like the tumor) or through developmental deprivation undermining competence itself (like the upbringing). This is like building a bad character through free choices.

  5.  **Compatibilist or Not?**
      Your pattern is **decidedly compatibilist**, albeit nuanced. You consistently focus on *agential capacities* (understanding, control) and the *history of how impairments arose* within the agent's life story, *not* on requiring ultimate, causally unmoved origination. You reject responsibility only when capacities are destroyed or overwhelmed by *external* forces (tumor, coercion) or fundamentally absent (true psychopathy). You hold agents responsible when capacities are present, even if their character/desires were shaped by factors beyond their control (upbringing diminishes but doesn't erase; self-induced recklessness via drug/choices is fully responsible). The compatibilist core is clear: responsibility hinges on the agent's *actual psychological architecture and its history* relative to the act, not on being an uncaused cause. The only hint of incompatibilism is your discomfort with the drunk driver luck case, but that's likely an intuition about *blame/punishment severity* rather than a fundamental requirement for *desert* based on ultimate origin. Your core intuitions operate firmly within a naturalistic, capacity-focused framework compatible with determinism.

  **In Summary:** The **Capacity + Provenance of Impairment** principle captures your Tumor (No), Psychopath (No), Coercion (No), and Upbringing (Diminished) verdicts cleanly, and explains the Drug/Gradual Recklessness (Yes) cases. It forces you to **give up the claim that the drunk driver who kills is *more culpable* than the lucky one** – they are equally culpable for the reckless act, though perhaps punishable differently due to consequences. This sacrifice brings consistency to your other distinctions and firmly places your intuitions within a sophisticated compatibilist framework.
