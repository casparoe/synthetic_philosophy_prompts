  Okay, the user runs a small underwriting analytics group at a specialty insurance firm. They handle about a dozen probability claims each week, each attached to quotes worth millions. Over the weekend, they had an argument with a friend who has a PhD in philosophy of science about whether they should defer to objective probability. The friend brought up David Lewis's Principal Principle, which states that if you know the objective chance of an event is p and have no inadmissible evidence, your credence should be p. The user felt this would mean swallowing whatever number they receive, which is irresponsible when they have extra information. The friend argued that the user misunderstood admissibility—evidence about how the event was caused is inadmissible, but evidence about how the chance was determined is admissible.

  The user wants me to turn the Principal Principle into a procedure their analysts can run in 15 minutes or less on any probability claim. The procedure should outline ordered questions, what counts as sufficient answers, where to defer to the number, where to treat it as one input among others, and where to hand the decision to a specific person because it's a judgment call. They want me to be honest about which steps are judgment dressed as procedure. Then apply the procedure to three cases: a vendor's certified failure rate from a company they partly own, a flood probability model omitting deteriorated levees, and a liability base rate from a different industry. At least one should come out in a way the user dislikes, likely deferring to the flood model despite the levee issue. Finally, I need to explain where the procedure might misfire, especially on selection-effect cases, and what the friend's side would criticize.

  First, I need to understand the Principal Principle and admissibility. Lewis's idea is that objective chances should guide credences unless there's "inadmissible evidence." Admissible evidence is about how the chance was determined (like methodological flaws), while inadmissible is about the specific event (like causes or outcomes). For example, knowing a die is fair is admissible; knowing it landed on six yesterday is inadmissible. The user's concern is that selection effects—like getting a report because the number was alarming—might make the chance unreliable. Their friend thinks such issues might be admissible if they affect the chance determination.

  I need to create a step-by-step procedure. The steps should be straightforward for analysts without philosophy backgrounds. Here's a logical flow:

  1. **Verify if it's a genuine chance claim:** Determine if the number represents an objective probability based on a reliable method. If not, stop and don't treat it as a chance.
  2. **Assess known errors in chance determination:** Check if there are flaws in how the probability was produced. If yes, adjust or discard. This is where admissibility starts.
  3. **Check for selection effects in receipt:** Determine if the reason they have the number introduces bias. If the selection is based on the outcome or correlated factors, it might be inadmissible.
  4. **Evaluate remaining concerns:** Any other issues? If they're about the event itself, they're inadmissible and should be ignored; if about the chance, they're admissible. Otherwise, pass to a designated senior person for judgment.
  5. **Final decision:** Defer if all checks pass; otherwise, use as one input or discard.

  Now, applying this to the cases:

