     User will dislike if I say defer, but in this case, if levees are specific evidence, procedure might say defer. Let's see: in step 2, if the omission is a flaw in model design, it's admissible → discard. But if the levees info is specific to this basin and not in the model, step 4 might say it's about the event → inadmissible, so defer. But the procedure should have a way to handle this. Step 3: selection effects? Not mentioned. Then step 4: concerns about levees. If it's about how chance was determined (model flaw), admissible → don't defer. If about the event (this basin has bad levees), inadmissible → defer. But analysts need to classify. This is messy. Need clearer distinction in steps.

     Revising procedure steps for clarity:

     Step 1: Is this number intended as an objective probability claim from a process designed to measure such chances? (Yes/No)

     Step 2: Do we have concrete evidence that the process producing this number contained a material error or limitation not accounted for in its stated uncertainty? (E.g., known data error, methodological flaw, scope mismatch). If yes, discard or adjust; stop.

     Step 3: Was our receipt of this specific number (rather than not receiving it, or receiving a different one) influenced by the actual outcome it predicts or by factors directly correlated with that outcome? (E.g., we got the report because the number was high, and high numbers predict high claims). If yes, this is irrelevant (inadmissible); proceed to defer. If no, proceed.

     Step 4: Do we have any other significant concerns about this number? If the concern is about how the probability was determined (e.g., vendor incentives, calibration issues), flag as admissible → don't defer, use as input. If concern is about the specific event (e.g., we have inside info this risk is worse), it's inadmissible → ignore, defer. If unclear, escalate to senior underwriter.

