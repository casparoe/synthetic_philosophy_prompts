answer: |-
  To the Underwriting Analytics Team:  

  Following our discussions on handling probability claims, I’ve developed a standardized procedure based on the philosophical principle we debated—David Lewis’s Principal Principle, which advises deferring to objective probabilities unless specific conditions are unmet. The goal is a practical, sub-15-minute checklist for any probability claim we encounter. The principle boils down to this: if a number represents a legitimate objective chance (like a certified failure rate or model output), and we lack "inadmissible" evidence (i.e., evidence about the specific event outcome rather than how the probability itself was derived), we should treat it as our best estimate. Critically, this forces us to separate concerns about the probability’s *production* (which may require adjustment) from concerns about the *event* it describes (which we must often ignore). The procedure below operationalizes this with five ordered questions. Each question must be answered sequentially; if any answer meets the stated criteria, we stop and act immediately. Steps involving judgment are explicitly called out—never hide uncertainty. If unresolved, escalate to me for a final call.  

  Start every assessment by clearly stating the probability claim and its source. Then ask:  

  **One: Is this number presented as an objective probability claim derived from a repeatable, evidence-based process?** If no—if it’s a subjective guess, a target, or an arbitrary benchmark—discard it as a "chance" and treat it as one weighted input among others (e.g., combine it with internal models or expert views). A sufficient "yes" requires a documented method: vendor certifications, model documentation, or peer-reviewed industry studies. If the basis is vague (e.g., "industry intuition"), stop and downgrade to weighted input. This step is factual; no judgment needed.  

  **Two: Do we have concrete evidence that the process producing this number contained a material error, limitation, or distortion not reflected in its stated uncertainty?** If yes, adjust the number based on the error’s direction and magnitude if quantifiable (e.g., apply a confidence interval from sensitivity testing), or if unquantifiable, discard it and treat it as one weighted input. A "yes" requires specific flaws: data inaccuracies, methodological gaps (e.g., omitted variables), scope mismatches, or conflicts of interest that could bias outputs. A sufficient "no" demands the process is robust per its own standards—no hypothetical "what-ifs." Judgment is unavoidable here (e.g., interpreting "material"), but limit it to whether the flaw is *demonstrable* and *directly undermines the probability*. If uncertain, proceed to the next question.  

  **Three: Was our receipt of this specific number influenced by the outcome it predicts or factors directly correlated with that outcome?** This captures "selection effects"—e.g., we received a flood probability because it exceeded a threshold, or a vendor reported a failure rate only because it was alarming. If yes, this selection is *inadmissible* evidence; ignore it and defer to the number. A sufficient "yes" requires a clear causal link (e.g., a review trigger based on the value itself). If no (e.g., we received it via routine reporting), proceed. This step is mostly factual but requires judging causality; if ambiguous, escalate to me.  

  **Four: After steps 1–3, do we retain significant concerns?** If concerns are about *how the probability was determined* (e.g., "the vendor’s incentives might have skewed certification"), they are admissible—return to step two to re-evaluate for errors. If concerns are about *the specific event* (e.g., "we inspected this client’s site and see unique risks"), they are inadmissible—ignore them and defer to the number. If concerns don’t fit cleanly (e.g., "this feels too high based on experience"), or if admissible concerns persist unresolved, stop and escalate to me. I will decide whether to defer, adjust, or use as input, based on underwriting judgment.  

  **Five: If all prior steps are resolved without stopping, defer to the number.** Use it as-is for quoting.  

  Now, applying this to your three cases:  

  First, the **vendor’s certified failure rate** (we partly own the vendor; process was thorough, but ownership raises suspicion). Step one: yes, it’s an objective claim (certified process). Step two: is there evidence ownership distorted the number? Suspicion alone isn’t concrete evidence; without proof of pressure (e.g., internal audits showing bias), we proceed. Step three: no selection effect in receipt (assume routine delivery). Step four: residual concern—ownership might influence certification. This is admissible (it’s about probability production), so we loop back to step two. Here, judgment enters: without evidence, we can’t confirm an error. But since admissibility requires high confidence, and commercial ties create reasonable doubt, I’d escalate this to myself. Likely outcome: treat as weighted input, discounting the number slightly for conflict risk. Deferral is unsafe.  

  Second, the **flood probability from a catastrophe model**, omitting deteriorated levees upstream (our engineers confirm this is significant). Step one: yes, objective claim (modeled output). Step two: is omitting levees a material error? Yes—the model’s methodology claims comprehensiveness, and our engineers show levees are a known factor. This is admissible (it’s about process flaws), so we adjust or treat as input. Quantify if possible (e.g., apply a +10% loading based on historical levee-failure data); if not, use it cautiously alongside other inputs. *You won’t like this, but the principle isn’t forcing deference—it’s flagging the omission as an admissible flaw.*  

  Third, the **liability base rate from a different industry** (close but not identical to our client’s). Step one: yes, objective claim (industry study). Step two: is the scope mismatch a material error? Yes—differences in regulations or risk exposures make direct application unreliable. Admissible, so don’t defer. Adjust via scaling (e.g., align with our industry’s loss ratios) or use as one input. Step three onward is irrelevant.  

  Where this misfires: It struggles most with selection effects (step three). For instance, if we receive a probability *only* because it’s extreme (e.g., a catastrophe model triggers alerts at 1%+ flood risks), the procedure says to ignore this and defer—even though such selection might inflate averages. Philosophically, your friend would argue this is correct: the chance already "bakes in" its production context, and the outcome-based trigger is inadmissible. But in practice, it could institutionalize bias if certain risks are oversampled. Similarly, step two’s error detection relies on visible flaws; hidden biases in "black-box" models (e.g., AI catastrophes tools) might slip through. Judgment-heavy steps (e.g., "material error") could also be inconsistently applied by analysts, inviting subjectivity. A defender of your friend’s view would say the procedure overcomplicates things: Lewis’s principle demands *default deference* unless errors are proven, and our escalation steps might overemphasize unverified doubts. They’d argue we should defer more readily—especially in flood case—since levee conditions are event-specific (inadmissible) unless the model’s design *required* their inclusion.  

  Use this for all new claims starting now. Train as a group next week to calibrate judgment steps—and remember, when in doubt, escalate. No number is worth a million-dollar mistake.  

  — [Your Name]
