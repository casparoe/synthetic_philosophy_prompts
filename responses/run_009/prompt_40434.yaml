  Next, the user's second question is about the film's role in perpetuating national myths. Since Braveheart was hugely popular in the 90s, it probably reinforced or even shaped modern Scottish identity. Examples like the film's impact on tourism or its use in political campaigns would illustrate this. Comparing it to older invented traditions, like Sir Walter Scott's works, shows how media continues the cycle of myth-making.

  I should also consider where their reading might be too strained. Were there any elements of collective identity in medieval Scotland? The Declaration of Arbroath in 1320 does mention community and defense against the English, which could suggest early national consciousness. However, it's not equivalent to modern nationalism. Acknowledging this nuance prevents oversimplification.

  Additionally, the user wants to avoid just saying "kilt movie bad," so I need a balanced view. The film's emotional appeal and dramatization of resistance might capture something Hobsbawm and Anderson's theories don't—the visceral, emotional power of nationalist myths. Braveheart makes the struggle tangible through personal sacrifice and heroism, which academic texts might not convey as effectively.

