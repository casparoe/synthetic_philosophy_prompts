  - Post-stimulus editing: Backward masking (flashing a blank after color) tests memory revision. Orwellians expect blank trials to disrupt reports; Stalinesques expect robustness. 

  Now the hard part: my verdict. After absorbing Dennett, I think the dispute is verbal. Both positions assume a mythical timeline of "becoming conscious." Dennett's Multiple Drafts model dissolves this—consciousness isn't a timestamped event but a distributed process. The real disagreement is whether to describe edits as "pre-" or "post-consciousness," but since there's no definitive moment of consciousness, the difference collapses. 

  I'll defend this fiercely in the closing section. The residual substance lies in mechanistic debates about neural implementation, not metaphysics. And for credibility, I'll admit the Stalinesque view has pragmatic appeal—it matches how we intuitively describe illusions—but emphasize this doesn't make it more *true*. 

