  For section (1), I'll compile uncontroversial empirical facts: apparent motion, color fusion, report timing, and neural asynchrony. Must avoid any interpretive language—stick to what labs have replicated. Introspection's limits are key here; both sides agree it can't settle the editing timing. 

  The table in section (2) needs surgical phrasing. Orwellians think consciousness happens in real-time with later memory edits; Stalinesques think consciousness is delayed until editing finishes. I'll phrase each row as a mirror—e.g., "consciousness requires..." vs. "consciousness requires..."—so neither feels misrepresented. The "different hypotheses" row is tricky but doable: Orwellians see a difference in mechanism, Stalinesques see identical outcomes. 

  Section (3) is where it gets fun. The cruxes are: 
