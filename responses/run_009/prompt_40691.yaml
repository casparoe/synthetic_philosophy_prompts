  For structure, I'll open with the dilemma, present both sides fairly, then explain why the lottery balances the concerns. The losing side (calibration advocates) deserve credit for emphasizing trust - if scores mean different things in different areas, people might disengage entirely. But the lottery avoids that by keeping scores meaningful while distributing inspections. 

  The resident question is crucial. I'll emphasize that all selected homes are high-risk, and the slight score difference doesn't necessarily reflect greater danger - especially since the lottery weights by score. Transparency about the process will be key.

  ...Wait, should the weights be by score or by neighborhood? The problem says baseline hazard rates differ, so weighting by neighborhood might better equalize outcomes. But the proposal mentioned weighting the lottery - probably by scores since that's the available data. I'll clarify that in the memo.

  Final thought: The memo should end with forward-looking language about monitoring outcomes. This isn't just about approving a tool but establishing how the city handles algorithmic tradeoffs.
answer: |-
  **MEMORANDUM**  
  To: Algorithmic Tools Review Panel  
  From: [Your Name], Panel Member  
  Date: [Date]  
  Subject: Recommendation: Adopt Weighted Lottery for Lead-Paint Hazard Inspections  

  ### The Dilemma  
  Our audit confirms the model cannot simultaneously achieve **calibration** (a "65" means 65% hazard likelihood *in every neighborhood*) and **equal missed-hazard rates** (inspecting equal proportions of *actual hazards* across neighborhoods). We must prioritize one, but both principles are ethically compelling:  
  - **Calibration proponents** rightly argue that inconsistent score meanings erode resident trust. If a "65" in Neighborhood A is low-risk but high-risk in Neighborhood B, marginalized communities may dismiss the scores entirely.  
  - **Equal-rates proponents** correctly warn that calibrating scores would replicate disparities. High-risk neighborhoods (with more true hazards) would see fewer inspections per hazard, leaving vulnerable residents at greater preventable risk.  

  ### Recommendation: The Weighted Lottery Compromise  
  I propose we **adopt the weighted lottery model** for the top 300 scored homes. This balances competing values while maximizing public health impact:  
  1. **Retain model insights**: Only homes above a high-risk threshold (e.g., top 300 scores) enter the lottery. This ensures inspected homes are objectively high-risk.  
  2. **Weight by score**: Higher-scored homes receive more lottery entries (e.g., a "90" gets 9 entries; a "70" gets 7). This preserves accuracy incentives.  
  3. **Inject equity**: Random selection prevents high-hazard neighborhoods from being deprioritized due to score calibration bias. Disparities in *inspection access* are actively mitigated.  

  **Why this over calibration or equal rates?**  
  - Calibration’s strongest point—**trust through transparency**—is partially honored: Scores still reflect *relative risk* (a "90" > "70"), and we can clearly explain the process.  
  - Equal rates’ goal—**preventing disparate harm**—is achieved: Neighborhoods with dense hazards won’t face systematically lower inspection rates.  
  - **Practical upside**: Lotteries reduce gaming, ease auditability, and acknowledge that risk prediction is probabilistic.  

  ### Addressing Residents  
  To a resident whose "68" home was passed over for a "61":  
  > *"All homes selected are high-risk. Because hazard likelihood varies by area, scores alone can’t perfectly rank every home citywide. The lottery ensures fairness while focusing resources where risk is highest overall. Your home remains in our priority pool for future inspections, and we encourage you to apply for free lead-test kits."*  

  ### Next Steps  
  I move that we:  
  1. **Approve the model** contingent on implementing the weighted lottery for inspections.  
  2. **Pilot for 6 months** with real-time disparity monitoring.  
  3. **Publicly document** the methodology and equity goals.  

  This compromise leverages the model’s strengths while centering equity and transparency. No algorithm is perfect, but this approach aligns with our mandate: *reducing harm* fairly.  

  —  
  *Approved? Let’s vote at Thursday’s session. Draft revisions welcome.*
