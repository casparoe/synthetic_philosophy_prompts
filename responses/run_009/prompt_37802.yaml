  The user outlines three possible interpretations of this phenomenon: 
  1) That voting procedures create a new collective will that didn't previously exist
  2) That "the people" is merely a legitimizing fiction
  3) That the people exist as a persistent corporate entity

  They're asking me to reconstruct the implicit theory behind democratic practices, specifically addressing: 
  (a) Whether these practices require belief in an actual collective will or can be explained through pure aggregation of individual opinions 
  (b) Whether the notions of the popular will being both "procedure-constituted" (fixed at vote time) and "prior to procedure" (through constitutional foundations) are logically consistent 
  (c) What would change if we adopted a purely aggregative view

  The user also invites me to challenge their framing if I find it flawed - showing admirable intellectual honesty. They mention possible objections like polls being inherently noisy rather than metaphysically different from votes.

  I notice they're writing with philosophical precision - this feels like someone deeply engaged with political theory, possibly an academic or advanced student. The request for "accuracy rather than accommodation" suggests they value rigorous critique over agreeable answers.

  The core tension here revolves around what we mean by "the people." Democratic language constantly anthropomorphizes this concept - "the people have spoken," "we the people," etc. - yet modern political theory often rejects such reification. How do we square this circle?

  For the poll/referendum asymmetry: while noise in polling is a factor, it doesn't fully explain the legitimacy gap. A referendum has procedural weight that polls lack - it's an authorized decision mechanism. This suggests institutions create legitimacy through form, not just numerical outcomes.

  On constitutional supremacy: the "dead hand" problem shows democracies treat foundational moments as having special authority. This requires temporal continuity - "the people" must be understood as persisting through time to bind future generations.

  The trickiest part is reconciling the ephemeral nature of voting ("will fixed at the moment") with the permanence of constitutional foundations. I think the solution lies in distinguishing between the people's constitutive authority (their ongoing existence as sovereign) and their constituted authority (specific decisions through procedures).

  Ultimately, while an aggregative view could technically describe all these practices, it would require such convoluted explanations that it becomes implausible. The language and rituals of democracy consistently point toward a corporate entity - not metaphysical, but as a necessary legal fiction for collective action.

  For the user's specific questions: 
  (a) The practice strictly requires at least a thin corporate conception of the people 
  (b) The tension between ephemeral and permanent aspects is resolved through layered sovereignty 
  (c) Adopting pure aggregation would gut democratic legitimacy narratives and force reconstruction of foundational concepts

  I should also note some real-world variations: turnout thresholds differ globally, constitutional review isn't universal, and some countries avoid referendum mechanisms altogether. But the core patterns hold across most democracies.
answer: |-
  Your analysis brilliantly exposes the conceptual tensions in democratic practice. Let's reconstruct the implicit theory from the practices themselves, then address your specific questions with precision. I'll challenge the framing where warranted.

  ### Reconstructed Implicit Theory of "The People"
  The practices presuppose a **layered corporate entity conception** of popular sovereignty:
  1.  **The People as a Continuous Corporate Agent:** "The people" exists as a single, enduring entity (a *corpus mysticum*) capable of action, will, and decision-making across time. This entity transcends the sum of current individual citizens.
  2.  **Procedural Embodiment:** This entity's "will" can *only* be authoritatively expressed through specific, legitimizing procedures (e.g., constitutionally defined referendums, elections, constitutional conventions). Mere aggregation of opinions lacks this transformative power.
  3.  **Temporal Layering & Capacities:** The corporate people acts through different "capacities":
      *   **Constituent Power:** The foundational, supreme capacity exercised (usually once) to establish the constitutional order ("We the People"). This will is near-permanent.
      *   **Constituted Power:** The ordinary capacity exercised within the established constitutional framework (e.g., electing representatives, passing referendums on ordinary laws). This will is binding but revisable *within* the constituent framework.
  4.  **Procedural Legitimacy Trumps Simple Aggregation:** The *manner* of decision-making (authorized procedure, turnout thresholds, supermajorities) confers legitimacy and transforms individual preferences into the corporate will. A 51-49 referendum result *is* "the people deciding" because the *procedure* makes it so, not because the numerical split is inherently meaningful.
  5.  **The Fiction of Singular Will:** Post-procedure, the outcome is attributed to the *unitary* people. This requires rhetorically subsuming the minority ("outvoted by the people") and treating the result as fixed ("the people have spoken"), suppressing the underlying division to enable collective action and legitimacy.

  **Now, addressing your questions:**

  **(a) What does it strictly presuppose vs. merely accommodate?**
  *   **Strictly Presupposed:** A **thin corporate conception** of the people is indispensable. The practices *cannot* be fully accommodated by a purely aggregative view (only individual opinions). Key points demanding this:
      *   **Poll/Referendum Asymmetry:** The aggregative view sees only differing aggregation methods. It *cannot* explain why one method (referendum) creates an authoritative "decision of the people" while the other (poll) does not, *when both aggregate the same underlying opinions*. The *transformative* power of the authorized procedure to create a *new fact* (the corporate will) is essential.
      *   **The "Two-Level People":** The distinction between constituent/constituted power and the binding force of past constituent acts (dead founders) requires the people to be a *persistent entity* whose past foundational act retains authority over its present ordinary self. Pure aggregation sees only present individuals.
      *   **"Outvoted by the People" Rhetoric:** This language explicitly replaces "outvoted by other voters" with subordination to a *collective entity*. It requires the fiction of a singular corporate actor.
  *   **Accommodated (but insufficient):** An aggregative view can *describe* supermajorities (higher threshold for stability/importance), turnout thresholds (preventing fringe capture), and judicial review (enforcing procedural rules/higher law). However, it *reduces* their justification to expediency or rule-following, stripping them of the *legitimating force* derived from claims about the corporate people's will in different capacities. The *authority* of the constitution over present majorities vanishes.

  **(b) Are the presuppositions consistent? Can "procedure-constituted" and "prior to procedure" cohere?**
  *   **The Core Tension:** Yes, there's a tension between the will being *fixed at the vote* (ephemeral procedure-constituted) and the *permanent will of the founders* (prior, enduring).
  *   **Resolution within the Theory:** The theory *resolves* this tension through the **layering of capacities**:
      1.  **Constituent Power is Prior & Supreme:** The foundational act *creates* the procedures and the framework *within which* ordinary constituted power operates. This act *is* the supreme expression of the corporate people's will, establishing its enduring form.
      2.  **Constituted Power is Procedure-Constituted & Subordinate:** The "will" expressed in referendums or elections is constituted *by* and *within* the framework established by the prior constituent act. It is fixed at the vote *relative to that specific act* (e.g., deciding *this* law *now*), but it is inherently subordinate to the constituent will.
      3.  **The Corporate Entity Provides Continuity:** The *same* corporate people persists, acting first in its constituent capacity (binding its future ordinary self), then in its constituted capacities. The "prior" will is the will of the *same entity* in a different, higher capacity.
  *   **Coherence:** This *is* coherent *if* one accepts the core presupposition of a layered corporate entity. The "dead founders" *are* "the people" in its constituent capacity, binding "the people" in its future constituted capacities. The "fixity" of the referendum result is the fixity of *that specific constituted decision* within the system, not of the people's entire will. The constituent will remains the anchor.

  **(c) What changes under a purely aggregative view?**
  Adopting a purely aggregative view would necessitate profound shifts in language, justification, and potentially practice:
  1.  **Language & Legitimacy:**
      *   "The people have spoken" **retired.** It would be replaced by "A majority/minority of qualified voters chose X," "The referendum procedure produced outcome Y," or "The rules resulted in Z."
      *   Legitimacy shifts from deriving from *embodying the corporate will* to deriving from *procedural fairness, consent to the rules*, or *utilitarian outcomes*. The rhetorical power diminishes significantly.
  2.  **Supermajority Rules:** Justification shifts from "protecting the enduring will/fundamental values of the people" to "increasing stability," "preventing rash decisions," "protecting minorities from majority tyranny," or "signaling higher importance." The connection to a *unitary people's deeper will* is severed.
  3.  **Judicial Review:**
      *   Striking down referendums **could not** be justified as "the people's constitutional self overruling its ordinary self." This language vanishes.
      *   Justification becomes: "Enforcing the agreed-upon higher procedural rules (the constitution) created by past majorities," "Protecting fundamental individual rights," or "Ensuring current legislation complies with prior procedural agreements." The authority of the constitution rests on *past consent* and *current acceptance of the rules*, not the *ongoing will of a corporate sovereign*.
  4.  **Founders' Authority:** The "dead hand" loses its special status. The constitution binds only because *current majorities tacitly or explicitly consent* to live under those rules or because changing them is procedurally difficult. Its legitimacy is contemporary, not derived from a foundational act of the corporate people.

  **Challenges to Your Framing & Caveats:**

  1.  **Poll/Referendum Asymmetry - Noise vs. Metaphysics:**
      *   **Your point has significant merit.** The known **noisiness, non-binding nature, and sampling limitations of polls** are *primary, sufficient* explanations for the asymmetry in *practical* reporting. A poll is a *measurement* of current opinion, subject to error and change. A referendum is an *authorized decision-making event*. The asymmetry *does not strictly require* metaphysical commitments about collective wills.
      *   **However,** the *rhetoric* surrounding the referendum result ("the people have spoken," losing side "outvoted by the people") *does* leverage the *language* of corporate agency and singular will, which *exceeds* what the aggregative view alone can justify. The practice *utilizes* this language for legitimacy, even if the core functional difference is procedural authority vs. statistical measurement. So, while the asymmetry *can* be explained without metaphysics, the *language employed* after the referendum points towards the corporate fiction.

  2.  **Variations in Practice:**
      *   **Turnout Thresholds:** Vary immensely (e.g., Italy 50% quorum for some referendums, others none). Some countries avoid them precisely because they can distort representation.
      *   **Judicial Review of Referendums:** Scope varies hugely (e.g., US courts review for constitutionality; UK traditionally has parliamentary supremacy; Germany's Basic Law restricts referendum topics). Some democracies (e.g., Switzerland) have strong direct democracy with weak judicial override.
      *   **"Governing by a Third":** While common in FPTP systems, this is heavily criticized. Proportional representation systems often yield governments with broader vote shares, undermining the "third speaks for all" claim. This specific practice might be better seen as a *pathology* of certain electoral systems than a core presupposition of popular sovereignty theory.
      *   **Constitutional Amendment Difficulty:** While often requiring supermajorities, the specific thresholds and processes vary considerably.

  **Conclusion:**

  The cluster of practices *strictly presupposes* a **thin corporate conception** of the people as a layered, enduring entity capable of acting through authorized procedures in different capacities (constituent/constituted). This is necessary to make sense of the poll/referendum asymmetry *rhetoric*, the two-level "people," the authority of past foundational acts, and the "outvoted by the people" language. A purely aggregative view can *describe* the mechanics but cannot justify the *legitimating rhetoric and conceptual structure* without resorting to a fiction it explicitly rejects. The tension between "procedure-constituted" and "prior" wills is resolved through the layered capacities of the corporate entity. Replacing this with an aggregative view would necessitate retiring the core legitimizing language ("the people have spoken") and reframing supermajorities, judicial review, and constitutional authority in terms of procedural rules, stability, minority protection, and contemporary consent, significantly altering the foundation of democratic legitimacy. While the *functional* difference between polls and referendums rests largely on procedure and noise, the *rhetorical* practices surrounding referendums actively deploy and depend upon the corporate fiction.
