  Here’s a structured in-class experiment designed to elicit ambiguity aversion (Ellsberg-style) and test domain competence effects, with a debrief linking results to decision theory concepts. I’ll outline the design step-by-step, including predictable pitfalls and limitations.

  ---

  ### **Experiment Design: "The Uncertainty Tournament"**
  **Stakes Currency:** Extra credit points (e.g., 1 point per "win," capped at 5 points total to avoid grade inflation).  
  **Time Allocation:** 90 minutes total (30 min activity, 15 min market phase, 45 min debrief).  
  **Students:** 12 students. Split into **Group A** (received "background reading" packet 1 week prior) and **Group B** (received nothing).

  ---

  #### **Phase 1: Betting Tasks (30 min)**  
  Students face three betting scenarios. Use physical props for immersion:  
  1. **Known Urn (K):** Transparent jar with 50 red/50 black balls.  
  2. **Unknown Urn (U):** Opaque, sealed jar (students see you shake it; no peeking).  
  3. **Trivia Bet (T):** Bet on a future binary outcome (e.g., *"Will the S&P 500 close higher tomorrow?"*).  

  **Task Sequence:**  
  1. **Round 1 (K vs. U):**  
     - *Choice:* Bet on red (R) or black (B) for **K** (known 50/50) **or** bet on R/B for **U** (unknown proportion).  
     - *Stakes:* Win 3 extra credit points if correct; 0 if wrong.  
     - *Key:* Force a choice between K and U for the *same color* (e.g., "Bet on K-Red or U-Red?").  

  2. **Round 2 (T vs. K):**  
     - *Choice:* Bet on the trivia outcome **or** bet on a known 50/50 event (e.g., coin flip).  
     - *Twist:*  
       - **Group A** (informed): Tied to the "background reading" (e.g., packet on stock market trends if betting on S&P 500).  
       - **Group B** (uninformed): No preparation; told T is "based on expert predictions."  
     - *Stakes:* Win 4 points for trivia/coin (higher stakes to amplify preferences).  

  **Predictable Issues:**  
  - Students may cluster choices (e.g., all bet on "red" due to anchoring).  
  - Group A might overestimate competence (e.g., think background reading guarantees insight).  
  - A student who knows Ellsberg may whisper the paradox—briefly remind everyone to work independently.  

  ---

  #### **Phase 2: Bet-Selling Market (15 min)**  
  Focus on the **U-urn bet** to isolate ambiguity aversion.  
  - **Setup:** Students who initially bet on U-Red (or U-Black) must sell their bet to another student.  
  - **Process:**  
    1. Sellers name a minimum price (in points).  
    2. Buyers bid anonymously on slips.  
    3. Trades execute if bid ≥ ask (record prices).  
    4. *Example:* Seller A asks 2 points for a U-Red bet. Buyer B bids 1.5. No trade. Buyer C bids 2.2—trade at 2.2.  
  - **Why this works:** Forces revelation of the ambiguity premium. Expected result: U-bets sell at discounts vs. K-bets (if traded).  

  **Predictable Issues:**  
  - Thin market: Few U-bet sellers if ambiguity aversion is strong.  
  - Collusion: Friends may trade at non-market prices. Mitigate by assigning random buyer/seller pairs.  

  ---

  #### **Debrief (45 min)**  
  Map observations to theory:  
  1. **Ellsberg Result:**  
     - Most students prefer **K** over **U** for the *same color* (violating probabilistic sophistication).  
     - Highlight: If they assign P(U-Red) < 0.5 *and* P(U-Black) < 0.5, probabilities are non-additive (contradicting Savage’s axioms).  

  2. **Competence Effect:**  
     - **Group A** (informed) bets more on **T** than **Group B**.  
     - Link: Ambiguity aversion fades when people *feel* competent (even if odds are unchanged)—challenges the idea that ambiguity is purely about uncertainty.  

  3. **Market Phase:**  
     - U-bets trade at lower prices than K-bets (ambiguity premium).  
     - Connect: Dutch book arguments fail here—no coherent probabilities to exploit, but ambiguity aversion still creates "money pumps" in dynamic choices (e.g., buying/selling U-bets at inconsistent prices).  

  4. **Sure-Thing Principle (STP):**  
     - STP requires adding identical outcomes to disjoint events not to alter preferences.  
     - Ellsberg paradox violates this: Preferring K-Red over U-Red *and* K-Black over U-Black implies the urn’s ambiguity (not the outcomes) drives choices.  

  ---

  #### **What Will Go Wrong (and How to Adapt):**  
  1. **Prior Knowledge Leak:** A student blurts, "This is the Ellsberg paradox!"  
     - *Fix:* Acknowledge post-activity: "Some of you spotted this—let’s dissect why it works."  
  2. **Competence Mismatch:** Group A’s "background reading" doesn’t boost confidence.  
     - *Fix:* Use a high-variance trivia topic (e.g., crypto prices) where confidence is volatile.  
  3. **Herd Behavior:** Students copy neighbors.  
     - *Fix:* Use secret ballots; assign seats spaciously.  
  4. **Fake Stakes Limitations:**  
     - No real skin in the game → understated aversion.  
     - Social pressure to "appear rational."  
     - *Mitigate:* Use higher-stakes incentives (e.g., winner-takes-all candy jackpot).  

  ---

  #### **Logistics Checklist**  
  - **Prep Week:** Email Group A the "background reading" (e.g., a curated news article on S&P 500 trends).  
  - **Materials:**  
    - 2 Urns (1 transparent/50-50, 1 sealed/mixed).  
    - Betting slips, trading slips, timer.  
    - Trivia event (e.g., live S&P 500 tracker projected).  
  - **Post-Class:** Resolve bets (draw balls, check S&P close) and award points.  

  This design surfaces ambiguity aversion organically and leverages the competence effect to provoke deeper discussion. The market phase cleanly quantifies aversion, while the debrief ties behavior directly to axioms—setting up ambiguity models naturally.
