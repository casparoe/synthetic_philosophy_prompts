answer: |-
  ## MEMORANDUM  
  TO: National Examination Committee, Structural Engineering Licensure Board  
  FROM: [Your Name/Chair Designee]  
  SUBJECT: Examination Protocol Update – Personal Knowledge Bases & AI Assistants  
  DATE: February 25, 2024  

  ### I. BACKGROUND & CORE CHALLENGE
  Recent petitions and committee discussions challenge our long-standing separation between closed-book (testing recall) and open-resource (testing practical application) exam sections. Two specific requests demand resolution before the March sitting:  
  1.  **Personal Knowledge Bases (PKBs):** Candidates petition to use personal, curated digital notebooks (annotated codes, failure analyses, worked examples) during the *open-resource* section.  
  2.  **AI Assistants:** Committee debate on permitting proctored, limited-scope AI tools (e.g., code lookup, formula application) during the *open-resource* section.  

  The core tension is this: **What does the "open-resource" section authentically certify?** Does it certify the *engineer alone*, or the *engineer reliably coupled with their essential tools*?  

  ### II. RECOMMENDED POLICY  
  After careful consideration of arguments (detailed below), we recommend:  

  1.  **Personal Knowledge Bases (PKBs): PERMITTED** with Strict Criteria.  
      *   **What's Allowed:** Candidates may bring a **single, pre-existing, user-generated digital repository** (e.g., tablet-based note app) containing only materials **personally created and curated by the candidate** prior to the exam day (e.g., scanned handwritten notes, typed summaries, personal annotations on code excerpts, self-generated failure analyses, personal worked examples).  
      *   **Strict Criteria (Verifiable at Door):**  
          *   **Pre-Existing & Static:** Content must be finalized *before* the exam. No editing, adding, or connecting to external sources (cloud, web) during the exam. Proctor will verify "last modified" dates/lock functionality.  
          *   **User-Generated Content Only:** No imported textbooks, full code copies (beyond necessary excerpts with annotations), third-party commercial guides, or collaborative content. Content must demonstrably be the candidate's own work product. Proctor will spot-check for origin.  
          *   **No Connectivity:** Device must be in airplane mode or have verified wi-fi/cellular disabled. Offline functionality only.  
          *   **Single Device:** One tablet/laptop only. No secondary devices.  

  2.  **AI Assistants: PROHIBITED** for the March Sitting and Foreseeable Future.  
      *   **Policy:** No AI tools, chatbots, or generative AI systems (e.g., ChatGPT, Claude, specialized engineering AIs) are permitted in any exam section, proctored or otherwise. Standard code PDFs, printed references, and permitted PKBs remain allowed in the open-resource section.  
      *   **Rationale:** While AI tools are emerging in practice, their reliability, consistency, potential for generating novel solutions beyond tested competence, and lack of standardized, exam-secure versions pose insurmountable challenges for fair, valid, and secure assessment *at this time*. **We establish a Task Force to study AI integration in future exams, reporting by Q4 2024.**

  ### III. ANALYSIS: WEIGHING THE ARGUMENTS  

  *   **The Case FOR PKBs & AI (The "Extended Toolset" View):**  
      Proponents argue convincingly that modern engineering competence *is* defined by reliable partnership with essential tools. Excluding a deeply integrated PKB is akin to excluding eyeglasses – it severs a functional cognitive loop developed through daily practice. Similarly, if AI becomes a constant, trusted advisor in design work, licensing the engineer *without* that tool certifies an artificial scenario. This view holds that the *person-plus-tool system* is the competent unit performing the work, and our exam should reflect that reality to be relevant. Banning these tools, they argue, tests an outdated mode of practice and fails to certify true operational competence.

  *   **The Case AGAINST PKBs & AI (The "Core Practitioner" View):**  
      Opponents argue with equal force that licensure certifies the *individual's* foundational knowledge, judgment, and ability to function *independently*. Allowing extensive PKBs, especially with AI, risks credentialing individuals who rely excessively on external crutches, potentially masking gaps in fundamental understanding or critical reasoning. The closed-book section tests core retention; the open-resource section tests application *using standard references*, not personalized shortcuts or potentially opaque AI outputs. This faction contends that only knowledge demonstrably internalized ("between the ears") provides the resilient foundation needed for novel problems, emergencies, or situations where tools fail. Permitting AI, especially, introduces an uncontrollable variable that undermines the assessment of individual judgment.

  *   **The Committee's Path Forward (The "Reliable Coupling" Perspective):**  
      The strongest arguments on both sides highlight that this is less about abstract philosophy and more about **predicting reliable future performance**. Licensure is a bet on an engineer's capability across diverse, unforeseen future scenarios.  

      *   **Why PKBs Pass the Test:** A *personal* knowledge base, rigorously defined as *pre-existing, self-generated content*, represents a **reliably coupled, persistent extension of the individual engineer's cognition**. Its content reflects their unique learning, problem-solving patterns, and areas of focus developed over time. Verifying its origin and static nature ensures it functions like an externalized part of *their specific mind*, highly likely to be available and used consistently in their practice. It complements, rather than replaces, core understanding tested in the closed-book section. The "eyeglasses" analogy holds merit here.  

      *   **Why AI Fails the Test (For Now):** Current AI tools are **not reliably coupled to the *individual* candidate's competence in a predictable, examinable way**. They are dynamic, often opaque, potentially inconsistent, and their output can vary based on prompts or hidden training data. Permitting AI doesn't assess the candidate's reliable partnership with *their specific* tool; it introduces a powerful, generalized assistant whose capabilities exist independently of the candidate's core knowledge. We cannot confidently predict *which* AI functions will be available or reliable in critical future scenarios, nor can we fairly assess if the candidate possesses the underlying judgment the AI might mask. Its potential to generate solutions beyond the candidate's true understanding creates significant validity concerns.  

  ### IV. WHAT THE EXAM NOW CERTIFIES (AND WHAT IT DOES NOT)  
  Implementing these policies necessitates explicit acknowledgment of the exam's scope:  

  1.  **The Closed-Book Section:** Continues to certify **core retention** of critical code provisions, design formulas, and fundamental principles under unaided conditions – the essential bedrock knowledge.  
  2.  **The Open-Resource Section (Revised):** Certifies the ability to **solve complex engineering problems using standard industry references (codes)** **coupled with the candidate's own deeply integrated, personalized knowledge system (PKB)**. It *explicitly no longer claims* to test unaided practical application in isolation. It acknowledges that competent modern practice involves this reliable coupling.  
  3.  **AI's Absence:** The exam **does not currently certify competence in integrating generative AI tools into structural engineering problem-solving**. This capability is evolving rapidly; our prohibition acknowledges we lack a validated method to assess it fairly and securely. The Task Force will address this gap.  

  ### V. IMPLEMENTATION FOR MARCH SITTING  
  *   Proctors will receive detailed guidance and training on verifying PKBs (checking last modified dates, spot-checking content for user-origin, ensuring no connectivity).  
  *   Clear communication will be sent to candidates immediately outlining the permitted PKB criteria and the prohibition on AI tools.  
  *   The Task Force on AI will commence work immediately after the March exam, with broad stakeholder input.  

  This policy balances the valid concerns of both committee factions. It recognizes the reality of deeply integrated personal tools while safeguarding the assessment of core individual competence and ensuring exam security and fairness. It moves our credential towards certifying the *reliably coupled system* that defines competent modern structural engineering practice, while prudently excluding tools whose reliability and impact on individual judgment cannot yet be validated under exam conditions.  

  **Recommended for Committee Approval.**  

  **[Your Name]**  
  **[Your Title]**
