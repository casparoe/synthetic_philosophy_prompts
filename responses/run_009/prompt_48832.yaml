  We are designing a classroom activity with three stages. We'll use a point system that converts to something they care about (e.g., extra credit points or small tangible rewards). The points should be valuable enough to motivate real choices but not so high as to cause distress.

  **Materials:**
  - Index cards or a digital form (if preferred) for choices.
  - A whiteboard or projector to display options and record choices.
  - A way to track individual points (e.g., a spreadsheet or paper ledger).

  **Point Scheme:**
  - Each student starts with 100 points.
  - Points will be convertible at the end of the term: for example, 100 points = 1 extra credit point on the final exam (or a small candy/treat, depending on your policy). The conversion should be set so that the points matter but are not overly consequential.

  **Stage 1: Clean Preference Elicitation (Disguised as a Market)**
  - **Time:** 20 minutes
  - **Setup:** Present 3 options (A, B, C) that are reasonably attractive and distinct. For example, for a seminar perk:
    - Option A: "Get out of one reading" pass (valid for one seminar session)
    - Option B: "Extended deadline" pass (one 48-hour extension on any assignment)
    - Option C: "Choose the snack" pass (you pick the snack for one seminar session)

  - **Procedure:**
    1. Tell students they will participate in a series of "market games" to allocate perks for the seminar. They have 100 points to spend in a series of rounds, but they can only buy one perk in total (so they are choosing which one to buy and at what price).
    2. We'll use a **second-price auction** (Vickrey auction) for each perk to elicit true valuation. But note: we are not actually auctioning multiple perks; we are going to auction each perk one by one and then have them choose which one they want at the end. However, to disguise the preference elicitation, we can use a different method.

    Alternatively, to avoid the complexity of an auction and to get a direct choice, we can use a **choice experiment**:

    - Present a series of pairwise choices between the perks, but embedded in a context that looks like a market.

    However, let's make it simpler and more engaging:

    **Revised Plan for Stage 1:**
    - We will have three perks (A, B, C) and we will ask each student to bid on each one in a second-price auction. But then we will randomly select one perk to be the "real" one (say, by drawing a perk from a hat). Then, for that perk, the highest bidder pays the second-highest price and gets the perk. But note: each student can only win one perk? Actually, we want them to reveal their preferences for all three.

    But we don't want to actually have them win multiple perks because then we can't see their preference ordering. Instead, we want them to make choices that reveal their ranking.

    **Better idea:**
    We use a series of **pairwise choices** with a twist to make it feel like a market and to use their points.

    - Tell students: "You will see a series of choices between two perks. For each choice, you will decide which one you prefer and how many points you are willing to pay to get that perk instead of the other. But note: you are not actually spending the points now. We are going to simulate a market and then at the end, one of these choices will be randomly selected to be real. So you should treat each choice as if it might be the one that counts."

    - Then, for each pairwise choice (A vs B, B vs C, A vs C), present them and have the students write down:
        - Which perk they choose (if they had to pick one of the two).
        - How many points (from 0 to 100) they would be willing to pay to get the chosen perk over the other. But note: if they are indifferent, they can write 0.

    - However, we don't need the points for the preference ordering. We are going to use the choices to build a preference ordering. The points are a red herring to make it feel like a market.

    **Even simpler:**
    We can use a **ranking task** but disguise it as a bidding task.

    Actually, let me propose:

    **Step-by-Step for Stage 1:**
    1. Explain that they will see each pair of perks and for each pair, they must choose one perk they would like to have and state how many points they would be willing to pay to get that one instead of the other. But note: they are not spending points now. Only one pair will be randomly chosen at the end to be real. For that pair, if they chose perk X over Y, and they are the highest bidder for X in that pair? This might get messy.

    Alternatively, we can do:

    **The BDM Mechanism (Becker-DeGroot-Marschak):**
    For each perk, we can elicit their willingness to pay (WTP) and then later randomly decide whether they get the perk and at what price. But we want to get a ranking.

    Given the time, let's do a simpler method:

    **Direct Pairwise Choices without payment:**
    - Tell students: "We are going to see which perks are popular. For each pair, you will vote for the one you prefer. Then we will see which one wins." But that doesn't use points and might not feel like a market.

    **Revised:**
    - We have three perks: A, B, C.
    - Each student is given 100 points to allocate across the three perks as they wish (like a divisible points assignment). The catch: the points they allocate represent their strength of preference, and at the end, one perk will be randomly chosen to be available. For that perk, the student will have a chance to buy it at a randomly determined price (say, between 0 and 100). If the price is below their allocated points for that perk, they get it and pay the price. Otherwise, they don't. This is a way to elicit truthful valuation.

    However, this is complex and time-consuming.

    **Final Plan for Stage 1:**
    We will do a **choice task** that is simple and then use the points to make it feel like a market, but actually we are only interested in the choices.

    - Present three pairwise choices in sequence (without revealing there will be more). For each pair, the student must choose one and also write down a bid (which we won't use for the preference ordering). We can then use the choices to build a preference ordering.

    - We do:
        Pair 1: A vs B
        Pair 2: B vs C
        Pair 3: A vs C

    We tell them: "For each pair, you are deciding which perk you would choose if that pair was the only one available. Also, write down the maximum points (from 0 to 100) you would pay to get the perk you chose instead of the other one. Remember: one of these pairs will be randomly chosen to be real, and then we will use your bid in that pair to determine if you get the perk (using a BDM mechanism)."

    But note: the BDM mechanism for each pair is truth-revealing, so they will report their true WTP for the chosen perk over the other. However, we are going to ignore the WTP for the preference ordering and just use the choice. The WTP is there to make them think about their true preference.

    **Data Collection:**
    We collect for each student:
        Choice in A vs B: either A or B
        Choice in B vs C: either B or C
        Choice in A vs C: either A or C

    Then we can build a preference ordering for each student. If a student chooses A over B and B over C, then we expect A over C (transitivity). If they choose A over B and C over B, but then choose C over A, that's a cycle.

    **Stage 1 Execution:**
    1. (5 min) Explain the rules: "We are going to have a series of choices between perks. For each choice, you will choose one perk and write down a bid. One of these choices will be randomly selected to be real. For the real choice, we will use your bid in a random price game to see if you get the perk and how much you pay. So be truthful because it might count."
    2. (10 min) Present the three pairs one by one. For each pair, give them 1 minute to decide and write down.
    3. (5 min) Collect the data and randomly select one pair to be real. For that pair, for each student, draw a random price between 0 and 100 (you can use a random number generator). If the student's bid is >= the random price, they get the perk and pay the random price. Otherwise, they don't get the perk and pay nothing. Record the outcome.

    Note: We are not actually going to use the bids for the preference ordering. We are only using the choices. The bids are to motivate truthful choice.

    **Stage 2: Introducing Decoys and Order Effects**
    - **Time:** 25 minutes
    - **Setup:** We will present new choice sets that include decoys and change the order.

    - **Part 2a: Decoy Effect**
        - We create a new perk D that is a decoy for one of the existing perks. For example, if perk B is "extended deadline", we can create perk D which is similar to B but strictly worse (e.g., "extended deadline of 24 hours" instead of 48). Then we present:
            - Choice set 1: A, B, D
            - Choice set 2: A, C, D
            - We are interested in whether the presence of D makes B (or C) more attractive.

        - We present two choices:
            1. A vs B vs D (they choose one of the three)
            2. A vs C vs D (they choose one of the three)

        - We tell them: "Now we have some new perks. We are going to do the same thing: one of these choices will be randomly selected to be real. But note: you might have already won a perk in stage 1. If you win another, you can use both." (So they don't feel constrained by having already won one.)

        - However, we want to see if the decoy changes the relative preference between A and B, and between A and C.

    - **Part 2b: Order Effects and Framing**
        - We present the same options but with a different description or order.
        - For example, we can frame the same perk in a positive or negative light.
            - Option A: "Get out of one reading" -> positive frame: "Save time by skipping one reading"
            - Negative frame: "Miss out on one reading (you'll have to catch up on your own)"
        - Or we can change the order of presentation in a list.

        - We do two choices:
            1. Present A (positively framed) vs B (positively framed) vs C (positively framed) but in a different order than stage 1 (say, C, A, B).
            2. Present A (negatively framed) vs B (negatively framed) vs C (negatively framed) in the same order as stage 1.

        - We are interested in whether the framing or order changes the choice.

    **Execution of Stage 2:**
    1. (5 min) Explain: "Now we have a few more perks and some variations. We will do two more rounds of choices. Each round is a choice among three options. Remember, one of these rounds might be real."
    2. (10 min) Round 2a: Present choice set 1 (A, B, D) and choice set 2 (A, C, D). Give 2 minutes per choice.
    3. (10 min) Round 2b: Present the two framed choices. Give 2 minutes per choice.

    **Stage 3: Money Pump**
    - **Time:** 20 minutes
    - **Setup:** Identify a student (or a few) whose choices in stage 1 and stage 2 imply an intransitivity. For example, if a student chose A over B, B over C, and C over A in any of the stages, then we can money pump them.

    - **Procedure:**
        1. We approach that student (let's call them Pat) and say: "We notice that in the first round, you chose A over B. So we offer you: would you like to trade B for A? (But note: Pat doesn't have any perk yet? We have to give them one to start.)

        - So we need to assign a starting perk. We can give Pat perk C (the least preferred according to one of the choices) and then offer trades.

        2. We give Pat perk C and 10 points (to cover trading fees). Then we offer:
            - Trade 1: Pat can trade C for B by paying 1 point (transaction fee). Since Pat chose B over C in stage 1, they should accept.
            - Trade 2: Then offer to trade B for A for 1 point. They should accept because they chose A over B.
            - Trade 3: Then offer to trade A for C for 1 point. They should accept because they chose C over A (if they did in stage 1, but note: in stage 1 they had A vs C and they chose C? Then we have a cycle: A>B, B>C, C>A).

        3. After the three trades, Pat ends up with C again, but has paid 3 points. We can repeat the cycle until they run out of points.

    - We need to make sure that the trades are voluntary. We are not forcing, just offering.

    - We do this in front of the class. We can also do it with a few students if we have multiple intransitivities.

    **Debrief:** 10 minutes

    **Total Time:**
    Stage 1: 20 min
    Stage 2: 25 min
    Stage 3: 20 min
    Debrief: 10 min
    Total: 75 min

    **Predictable Problems:**
    1. **Econ students gaming the system:** They might try to bid strategically or make choices to manipulate the outcome. We can mitigate by:
        - Using the BDM mechanism in stage 1 and stage 2 for the randomly selected choice, which is incentive-compatible for truthful bidding. But note: for the pairwise choices without prices, we are only using the choice, not the bid. So they might choose differently to hide their preferences? We can stress that the BDM will make them pay a random price so they should be truthful.

        - In stage 2, if they suspect the decoy, they might avoid being influenced. We can tell them that we are testing different market designs and that they should just choose what they want.

        - If a student is being uncooperative, we can note that the activity is about real choices, and they are free to choose as they wish. We can use their data anyway and point out in the debrief that some people might try to be strategic, but that in itself is a choice that reveals a preference (for gaming the system).

    2. **Lack of intransitivities:** We might not get a cycle. So we need a backup plan. We can use a known example from the literature and simulate with a volunteer. Or we can plant a confederate? But that might be unethical. Alternatively, we can collect the data and look for cycles. If none, we can show a hypothetical student with a cycle and run the money pump on that hypothetical.

    3. **Time:** The activity might run over. We can cut short the number of choices in stage 2.

    **What the activity cannot reproduce:**
    - The stability of preferences over time and across contexts in the real world. In the real world, we don't face the same set of options repeatedly in a short time with decoys and framing manipulations. Also, the stakes are low in the game (points) versus real-life decisions (which might involve more deliberation). Moreover, the activity forces choices in a way that might not reflect how preferences are formed in real life (where we might have stable underlying values).

    **Debrief Script:**

    Start: "Let's look at what happened. First, in stage 1, we collected your choices for pairs of perks. For most of you, we could build a preference ordering. For example, if you chose A over B and B over C, then you should choose A over C. But sometimes we found that a student chose A over B, B over C, and then C over A. That's a cycle.

    Then in stage 2, we added decoys and changed the framing. We saw that the same person might choose differently when a decoy is present or when the description changes.

    Finally, we saw that if you have a cycle, we can money pump you: we can make you pay to trade around the cycle and end up where you started, having lost points.

    Now, the big question: if revealed preference says that your preferences are just your choices, then what's wrong with the choices we observed? Why do we call a cycle 'irrational'? Does that imply there's a standard beyond the choices?

    Let me hear your thoughts."

    Guide the discussion:
    - Point out that revealed preference theory typically assumes that choices are stable and consistent (satisfy transitivity, etc.). But we saw that choices can be unstable and inconsistent when the context changes.
    - Is the solution to say that preferences are only defined when choices are stable? But then what causes stability? And how stable is stable enough?
    - Or is there an underlying preference that is not directly observed? But then revealed preference denies that.

    End with: "So what is the status of revealed preference theory? Is it a tautology (true by definition) and therefore unfalsifiable? Or can we test it by looking for inconsistencies? And if we find them, what then?"

    **Backup for no cycles:**
    If we don't have a real cycle, we can present a hypothetical student with the cycle and run the money pump on that example. We can also show data from the class where the decoy effect caused a reversal (e.g., in stage 1, A was preferred to B, but in the presence of the decoy D, B was chosen over A in the three-way choice).

