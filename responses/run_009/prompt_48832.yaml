answer: |-
  ### **Rational Choice Seminar Activity: "Preference Construction Circus"**  
  **Goal:** Demonstrate how revealed preferences are constructed, not revealed, by eliciting choices that become inconsistent under framing and decoys, culminating in a money pump. Highlights the tension between defining preferences solely by choices vs. needing a stability standard.

  ---

  ### **Materials & Setup**
  - **Perks (Tangible Incentives):**  
    - **A:** "Skip Pass" (excused from one reading response).  
    - **B:** "Extension Pass" (48-hour deadline extension on one assignment).  
    - **C:** "Snack Pass" (choose snacks for a future seminar session).  
  - **Point System:**  
    - Students start with **100 points**.  
    - Points convert to **extra credit** (1 point = 0.1% final grade, max 2% total). Low stakes but meaningful.  
  - **Tools:**  
    - Voting cards (for private choices).  
    - Whiteboard to display options and record aggregate results.  
    - Timer.  

  ---

  ### **Timeline (75 Minutes Total)**  
  **Key:** Focus on *speed*—keep choices rapid to avoid overthinking.  

  #### **Stage 1: "Clean" Preference Elicitation (20 min)**  
  *Disguised as a "Perk Market" where students "spend" points.*  
  1. **Intro (3 min):**  
     - *"We’re simulating a perk market. You’ll make choices today; one will be randomly selected at the end, and you’ll get the perk you chose in that round. Points are for trading—save them!"*  
     - Explain perks A/B/C. Emphasize: *"Choose what you genuinely want—any choice could be real."*  

  2. **Pairwise Choices (12 min):**  
     - Present **three pairwise votes** (2 min each). Students write choices privately on cards.  
       - **Vote 1:** A vs. B  
       - **Vote 2:** B vs. C  
       - **Vote 3:** A vs. C  
     - *No prices/frames yet—pure preference.*  

  3. **Data Collection (5 min):**  
     - Collect cards. Secretly note students with intransitive patterns (A>B, B>C, C>A) for Stage 3.  
     - Display aggregate results: *"70% chose A over B, 65% B over C..."* (Don’t highlight individual inconsistencies yet).  

  ---

  #### **Stage 2: Decoys & Framing (25 min)**  
  *Introduce context effects to destabilize Stage 1 choices.*  

  4. **Decoy Effect (10 min):**  
     - Add decoy **D** (inferior version of B): *"Extension Pass Lite" (24-hour extension)*.  
     - **Choice 1:** A vs. D vs. B (2 min vote).  
       - *Predictable effect:* D makes B look better.  
     - **Choice 2:** A vs. D vs. C (2 min vote).  
       - *Predictable effect:* D makes C look worse if it’s the "odd one out."  
     - Display shifts: *"With D added, B is now chosen 40% more often vs. A!"*  

  5. **Framing & Order Effects (10 min):**  
     - **Positive Frame:** *"Skip Pass: Save 3 hours of reading time!"*  
     - **Negative Frame:** *"Skip Pass: Miss key seminar discussions!"*  
     - **Choice 3:** A+ (positive) vs. B (neutral) vs. C (neutral) (2 min vote).  
     - **Choice 4:** A- (negative) vs. B (neutral) vs. C (neutral) (2 min vote).  
     - *Record reversals* (e.g., A+ chosen over B, but A- rejected for B).  

  6. **Quick Data Compare (5 min):**  
     - Contrast Stage 1 vs. Stage 2: *"In Stage 1, 70% preferred A to B. With framing, only 30% chose A- over B."*  
     - *Plant the seed:* "Are your preferences shifting, or is something else going on?"  

  ---

  #### **Stage 3: Money Pump (20 min)**  
  *Force a cycle-participant to pay for their intransitivity.*  

  7. **Setup (5 min):**  
     - Identify **one student** ("Pat") with Stage 1 intransitivity (A>B, B>C, C>A). *If none, use a prepped confederate or hypothetical.*  
     - Give Pat perk **C** and **10 bonus points** (to enable trades).  

  8. **The Pump (10 min):**  
     - Trade 1: *"Trade C for B? Cost: 1 point."* (Pat prefers B>C, so accepts).  
     - Trade 2: *"Trade B for A? Cost: 1 point."* (Pat prefers A>B, so accepts).  
     - Trade 3: *"Trade A for C? Cost: 1 point."* (Pat prefers C>A, so accepts).  
     - **Result:** Pat is back with C but **down 3 points**. Repeat if time allows.  

  9. **Class Observation (5 min):**  
     - Highlight: *"Pat paid to end up where they started. Did we just 'pump' money from thin air?"*  
     - Note: Pat’s choices are "rational" individually but collectively costly.  

  ---

  ### **Debrief Script (10 min)**  
  **Map to Game Moments:**  
  1. **Stage 1 Aggregates:**  
     > *"In Stage 1, we treated your choices as revealed preferences. If A>B and B>C, we assumed A>C. Simple, right?"*  

  2. **Stage 2 Shifts:**  
     > *"But in Stage 2, adding a decoy (D) or changing frames reversed your choices. If preferences are just choices, why does adding a worse option change what you 'reveal'? Is your preference for B stronger now, or did we manipulate you?"*  

  3. **Money Pump:**  
     > *"Pat’s choices were consistent with transitivity in isolation—but together, they formed a cycle. If preferences are choices, Pat’s were 'true' each time. Yet they lost points. So why call this irrational? What’s the standard here if not the choices themselves?"*  

  **Push the Core Tension:**  
  > *"Samuelson says preferences ARE choices. But tonight, your choices were unstable. If we dismiss this as 'noise,' where do we draw the line? How stable must choices be to count? And if we need stability, doesn’t that imply preferences exist beyond choices—maybe in your minds or in abstract 'values'?"*  

  > *"Critics say choices are constructed in the moment. If so, revealed preference is circular: it says 'choices reveal preferences,' but when choices shift, it says 'those weren’t real preferences.' How can we avoid this trap?"*  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Econ Students Gaming the System:**  
     - *Problem:* A few may recognize decoys/framing and "defect" (e.g., deliberately avoid inconsistencies to "win").  
     - **Solution:**  
       - **Isolate them:** *"If you see what we’re doing, play along—but choose as you normally would. We need authentic data."*  
       - **Use their data separately:** In debrief, contrast "strategic" vs. "naive" choosers. Ask: *"If you defected, what were you optimizing for? Winning points? Proving a point? Does that imply meta-preferences?"*  
       - **Pre-emptive framing:** Start with *"This isn’t about tricking you—it’s about observing how context affects decisions."*  

  2. **No Intransitivity for Money Pump:**  
     - *Problem:* Only ~20% of people show cycles naturally.  
     - **Backup:** Use a **hypothetical student** with pre-staged choices (A>B, B>C, C>A). Pump it yourself and donate points lost to the class.  

  3. **Time Shortfalls:**  
     - **Stage 1/2:** If behind, skip one framing round.  
     - **Debrief:** Prioritize the money pump example and the "stability" question.  

  ---

  ### **What the Activity Can’t Capture (Debrief Supplement)**  
  **The Real-World Stability Illusion:**  
  > *"In the real world, we rarely face decoys or frames designed to pump us. Choices are spread across time, so inconsistencies are less obvious. But critics argue preferences are* still *constructed—just more slowly. For example, you might 'discover' you prefer apples to oranges only when asked. So if revealed preference demands stability, is it a theory about lab rats, not humans?"*  

  **The Deeper Gap: External Standards**  
  > *"Samuelson wanted to purge 'unobservables' from economics. But when we call a choice 'irrational,' we imply a standard beyond choices—like logical consistency or self-interest. Can we defend that standard without invoking mental states? If not, revealed preference collapses into psychology."*  

  **Bridge to Next Week:**  
  > *"Next week: Can neuroeconomics or cognitive psychology rescue rational choice? Or are we stuck with 'noise'?"*  

  ---

  ### **Instructor Notes**  
  - **Ethics:** Points convert to trivial extra credit (max 2%). No coercion.  
  - **Data Use:** Anonymize individual choices; focus on aggregates to avoid embarrassment.  
  - **Flex:** If students resist the pump, let them refuse—then discuss *why* ("Did you feel exploited? Does that imply a hidden preference for fairness?").  

  This design forces students to confront the circularity of revealed preference: if choices define preferences, instability isn’t "wrong"—it just *is*. The debrief pushes them to question whether economics can avoid psychology.
