answer: |-
  ### Acausal Trade Decision Tree  
  *Find your position by answering these questions honestly. Each path ends with a stance on acausal trade and its "most awkward commitment"—a consequence that might feel counterintuitive or uncomfortable.*

  ---

  **Question 1:**  
  You have a choice: take a resource for yourself or leave it for another agent. You know your action **cannot causally affect** this other agent (no communication, no physical interaction). Could leaving the resource *ever* be rational?  
  - **No** → Go to **Position A**.  
  - **Yes** → Go to Question 2.  

  **Question 2:**  
  Your reason for leaving the resource is mainly about...  
  - **Keeping your own decision habits consistent** (e.g., "I don’t want to become someone who hoards"). → Go to **Position B**.  
  - **The other agent’s benefit** (e.g., "They deserve it" or "This helps them"). → Go to Question 3.  

  **Question 3:**  
  Does coordination without causal interaction work best when you see it as...  
  - **A decision each agent makes alone** (e.g., "I choose based on predicting them")? → Go to Question 4.  
  - **A stable outcome of the situation** (e.g., "We both gravitate to the obvious choice, like a focal point")? → Go to **Position C**.  

  **Question 4:**  
  Must the other agent be a **literal copy of you** (or running identical reasoning) for coordination to work?  
  - **Yes** → Go to **Position D**.  
  - **No** → Go to Question 5.  

  **Question 5:**  
  Can you reliably use **evidence about the other agent’s policy** (e.g., past behavior) to guide your action, even with no causal link?  
  - **No** → Go to **Position E**.  
  - **Yes** → Go to Question 6.  

  **Question 6:**  
  Must the other agent **know you’re reasoning similarly** to them for coordination to work?  
  - **Yes** → Go to **Position F**.  
  - **No** → Go to **Position G**.  

  ---

  #### Positions  
  *(With "most awkward commitment"—the counterintuitive implication of your stance)*  

  - **Position A: Causal Decision Theory Holdout**  
    *Most awkward commitment:* You defect against an identical copy of yourself in a Prisoner’s Dilemma, even if you know they’ll mirror your choice, because "causing" their cooperation is impossible.  
    *Label note:* Rejects acausal trade entirely.  

  - **Position B: Prudence View**  
    *Most awkward commitment:* You leave resources for an agent you know doesn’t exist, just to avoid "tainting" your decision-making character.  
    *Label note:* Acausal trade is instrumentally rational for self-discipline, not others' benefit.  

  - **Position C: Equilibrium/Focalist**  
    *Most awkward commitment:* You coordinate with an agent who isn’t reasoning about you at all (e.g., a rock following fixed rules) if the situation has a conspicuous "focal point" (e.g., a salient number or symbol).  
    *Label note:* Coordination is about game structure, not decision theory.  

  - **Position D: Copy-Only Trade**  
    *Most awkward commitment:* You cooperate with a perfect copy of yourself but defect against a nearly identical agent (e.g., 99% similar reasoning) because they’re not "you."  
    *Label note:* Acausal trade only works with literal self-simulations.  

  - **Position E: Convergent Interests Skeptic**  
    *Most awkward commitment:* You deny that "trade" ever occurs—even mutual cooperation is just both agents independently pursuing self-interest (e.g., both found a dominant strategy by luck).  
    *Label note:* All "acausal trade" cases are mislabeled coincidence.  

  - **Position F: Mutual Transparency Required**  
    *Most awkward commitment:* You defect against a cooperative agent if they’re uncertain whether you’re "like them," even if you are.  
    *Label note:* Acausal trade demands bidirectional symmetry awareness.  

  - **Position G: Full Superrationalist**  
    *Most awkward commitment:* You leave resources for a thermostat (which "policies" heat predictably) as if it were a rational agent, because its response is reliable.  
    *Label note:* Cooperates with any sufficiently predictable agent, even simple ones.  

  ---

  ### Design Notes  
  - **Branch logic**: The tree sorts based on core disagreements—e.g., motives without causality (Q1), evidence without contact (Q5), and agent similarity (Q4).  
  - **Conflated positions**: The tree *cannot* separate:  
    - **Prudence (B)** vs. **Equilibrium (C)**: Both prioritize self/situational factors over others' welfare, but B focuses on character while C focuses on game structures.  
    - **Copy-Only (D)** vs. **Mutual Transparency (F)**: D requires identical agents, F requires mutual knowledge—but both demand high symmetry.  
  - **Economist lens**: Question 3 isolates the "equilibrium view" (Position C) favored by some economists.  
  - **Omitted jargon**: Questions avoid terms like "acausal trade" or "superrationality."  
  - **Awkward commitments**: Highlighted to show where positions bite bullets.  

  Print this one-sided for your session—it fits on a single page. Enjoy the debate!
