prompt: |-
  I cover science and ideas for a national magazine and am applying for a nine-month nonfiction fellowship to develop a book on what, if anything, the psychology of left and right can tell us about which side is right. My half-formed idea: the discussion around moral foundations theory is stuck between two hasty conclusions. One side says conservatives, whose moral palate draws on more foundations than the liberal profile centered on care and fairness, literally perceive more of the moral truth — more channels, more of the world. The other says that once moral judgments are traced to differences in temperament and socialization, neither side's judgments track anything, a debunking that, if it works at all, seems to hit both camps symmetrically. What both share is an assumption I want to interrogate: that foundations work like perception, so the only questions are whether the organ is present and whether it is veridical. I suspect the perceptual analogy conceals live alternatives — a foundation might function more like an acquired taste, or like an inference habit that is reliable in some environments and systematically misleading in others — and each alternative yields a different verdict on the debunking question. Turn this into a fellowship proposal: state the question precisely, explain why the existing positions leave it open, lay out what I would actually do month by month (I can read, think, and interview, but will not be running studies), describe what a satisfying result would look like for readers who hold strong political views, and be honest about what would make the project fail or balloon beyond nine months. Skip the bibliography; I will assemble sources myself.
