prompt: |-
  Quick context: I work as a data analyst for a mid-sized city government, and over the last few years Ive collected a folder of cases that all smell the same, and I'm trying to figure out whether social scientists or philosophers of science already have a proper taxonomy for them, or whether I'll have to invent one myself. You seem well-read on that end, so please brainstorm broadly first — list the candidate concepts you can think of before committing to an answer — and don't just hand me the first label that comes to mind.

  Here's the pattern. An institution starts measuring something as a stand-in for a thing it cares about but can't observe directly. Then the measure becomes a target and people optimize it. That headline version has a famous name, I know that one. But when I line up my cases, the ways it goes wrong look really different from each other, and I can't find words for the differences. Case 1: a police department quietly reclassifies burglaries as "lost property" so the serious-crime number stays down. The amount of crime out there doesnt change one bit — only the report is now fiction, and worse than useless, because even the historical trend line is lying now. Case 2: an airline is judged on on-time departures, where departure counts as the moment the plane leaves the gate, so planes push back right on schedule and then sit on the tarmac for forty minutes. Nobody is lying — the planes really do leave the gate on time — but once the pressure arrived, the whole system reorganized around the letter of the measure instead of its spirit. The number got better, the thing people actually cared about (passengers getting where they're going) got worse. Case 3, my favorite weird one: a school drills test prep so hard that scores shoot up, but a year later the kids genuinely know the material — the drilling, aimed only at the number, accidentally did the job the number was standing in for. So it was "gamed," and the goal got achieved anyway, and I honestly dont know whether that even counts as the same phenomenon.

  So three questions. (a) Does the existing literature on indicators, evaluation, and measurement have names that cut my three cases apart — case 1 corrupting the report while reality stands still, case 2 reality reorganizing around the letter of the measure while the number stays honest, case 3 gaming that collides back with the goal? If the nearest concepts fit only imperfectly, tell me exactly where the fit fails; I'd rather get the edges of each concept than one confident label. (b) If nothing established carves it this way, coin terms — give definitions and say what boundary cases would test them. (c) One more thing I keep chewing on: in case 2, where exactly did the meaning of the measure go? It's like the referent slid from "passenger journey quality" over to "gate event" while the same words stayed printed on the dashboard. Is there a name for that quiet migration of a metric's meaning, as distinct from the gaming itself? Please think step by step, be willing to say the literature has no clean answer, and skip the generic lecture on perverse incentives — I'm past that.
reasoning: |-
  Okay, let me approach this systematically. The user presents three distinct cases where performance measurement goes awry in different ways, and they're clearly frustrated with oversimplified explanations of "Goodhart's Law." They want precise conceptual distinctions.

  First, I need to map each case to existing academic frameworks. Case 1 (police reclassification) feels like classic "gaming" but with a twist - it's purely representational corruption. The literature on organizational deviance and measurement distortion comes to mind, particularly Bohte and Meier's work on goal displacement. But is that sufficient?

  Case 2 (airline departures) is trickier. The measure stays technically accurate but loses its connection to the underlying goal. This echoes Campbell's Law about metric corruption, but more specifically resembles what Smith called "output distortion." The key here is the decoupling between the measure and the intended outcome.

  Case 3 (test scores) is fascinating because it's accidental goal achievement. The gaming (test drilling) actually serves the ultimate objective (learning). This challenges conventional wisdom - it's like a reverse perverse incentive. Mintzberg's concept of "emergent strategy" might apply, but I'm not sure there's direct terminology for this.

  For part (b): if existing terms don't fit, we might need new typology. For Case 1: "Representational Degradation" captures how the measurement system becomes fictional. For Case 2: "Operational Decoupling" describes how operations detach from intent. For Case 3: "Serendipitous Congruence" - gaming accidentally aligns with goals.

  The semantic shift in Case 2 is particularly interesting. It's not just metric corruption but "Referent Drift" - where the measured concept subtly changes while the label stays the same. This relates to conceptual reengineering in organizations, something Czarniawska has written about.

  The user's depth suggests they'll appreciate knowing where academic frameworks fall short. They're clearly looking for practical taxonomy to apply to their municipal data, so any proposed terms should be operationally useful. The mention of historical trend lines being corrupted in Case 1 shows they understand longitudinal impacts - that's worth addressing specifically.

  I should emphasize that Case 3 challenges conventional "gaming" narratives. The literature rarely accounts for cases where metric-chasing accidentally serves true goals - that's probably why it's their favorite case. This might connect to Elster's work on unintended consequences.

  Finally, for the semantic migration question: beyond "concept creep" or "indicator drift," we need something that captures the silent redefinition. "Referent Drift" seems most precise, though "Semantic Decoupling" could also work. The key is distinguishing the label's persistence from its changing meaning in practice.
answer: |-
  Based on your cases and need for precision, I'll follow your request: first brainstorming candidate concepts, then analyzing fit, coining terms where needed, and addressing the semantic migration. The literature has *related* concepts but no perfect taxonomy for your trichotomy.

  ---

  ### (a) Candidate Concepts & Fit Analysis
  **Core Framework:** All cases are subspecies of **Indicator Distortion** (umbrella term for when metrics deviate from intended meaning). The classic "headline" is **Goodhart's Law** ("When a measure becomes a target, it ceases to be a good measure"), but it's overly broad for your needs. Let's dissect:

  1.  **Case 1 (Police Reclassification):**
      *   **Candidates:** *Measurement Manipulation* (general), *Creaming/Data Falsification* (evaluation literature), *Reporting Distortion* (public admin), *Effort Substitution* (economics - but often implies real action).
      *   **Best Fit & Shortfall:** **Creaming** or **Selective Reporting** (focusing effort/resources on easy cases or manipulating records). *Shortfall:* These often imply prioritizing *easier* cases, not *redefining* existing cases. **Data Falsification/Fraudulent Misreporting** is precise but harsh; it captures the *intentional deceit* and *static reality*. *Edge Case Test:* If officers *actually* convinced victims to file "lost property" reports instead of burglary (changing reality slightly), does it still fit? Probably yes, as the *crime event* remains unchanged.

  2.  **Case 2 (Airline On-Time Departures):**
      *   **Candidates:** *Campbell's Law* ("The more any quantitative social indicator is used for social decision-making, the more subject it will be to corruption pressures"), *Perverse Incentive* (general), *Output Distortion* (Smith, 1995), *Tunnel Vision* (focusing solely on the measured), *Decoupling* (organizational theory - separating formal reporting from actual practice).
      *   **Best Fit & Shortfall:** **Output Distortion** (Smith) or **Operational Decoupling** (inspired by Meyer & Rowan) fit best. Output Distortion explicitly involves changing *real activities* to optimize the metric *without* achieving the underlying goal. *Shortfall:* Smith focuses on *actions*, not the semantic shift you noted. Campbell's Law is broad but captures the systemic pressure leading to metric corruption. *Edge Case Test:* If gate departure time *was* genuinely the only aspect of delay passengers cared about (unlikely), would distortion still occur? Probably not.

  3.  **Case 3 (School Test Scores):**
      *   **Candidates:** *Teaching to the Test* (education), *Narrowing* (focusing only on measured areas), *Goal Displacement* (original goal supplanted by metric goal), *Unintended Alignment* (novel), *Serendipitous Proxy Fulfillment* (novel).
      *   **Best Fit & Shortfall:** **Teaching to the Test** describes the action, and **Narrowing** the focus. *Crucial Shortfall:* Standard terms imply the *goal* (actual learning) is *not* achieved, or only partially/superficially. Your case shows *accidental goal achievement*. **Goal Displacement** doesn't fit because the original goal *was* met. This is the hardest case for standard theory, suggesting **Unintended Alignment** or **Serendipitous Congruence** might be needed. *Edge Case Test:* If the drilling *only* covered the specific test questions and students couldn't generalize the knowledge later, would it still fit Case 3? No – that's classic superficial "gaming."

  ---

  ### (b) Proposed Taxonomy & Coined Terms
  Where established terms fit imperfectly, here's a precise taxonomy based on the *mechanism* of distortion and its *impact on the underlying goal*:

  1.  **Representational Degradation (Case 1):** *The intentional manipulation of measurement records or classification systems to alter the reported metric, while the underlying reality the metric was intended to proxy remains unchanged.* The metric becomes fictional. (*Test:* If reality changes *due to* the reclassification effort itself (e.g., police scare off burglars by reclassifying), it becomes a hybrid with Output Distortion.)
  2.  **Operational Decoupling (Case 2):** *The reorganization of real-world processes, effort, or resource allocation to optimize the specific, measured output, resulting in the metric becoming an accurate measure of a narrower (and often irrelevant) activity, while the intended underlying goal is undermined.* The measure's *referent* shifts silently. (*Test:* If optimizing the metric *inevitably* improves the goal (e.g., optimizing engine efficiency *always* reduces fuel cost), it's not decoupling – it's valid measurement.)
  3.  **Serendipitous Congruence (Case 3):** *Activities undertaken solely to optimize a proxy metric inadvertently also achieve the underlying goal the metric was intended to measure, despite the metric-focused motivation.* Gaming collides beneficially with the goal. (*Test:* If the metric-focused activity *predictably* achieves the goal (e.g., drilling multiplication tables consistently improves math fluency), it's not serendipity – it's effective, if narrow, alignment. True Serendipitous Congruence requires the outcome to be *unintended* and potentially *non-generalizable*.)

  ---

  ### (c) The Semantic Migration (Case 2)
  You've pinpointed a critical nuance often missed: **Referent Drift**.

  *   **Definition:** *The process by which the practical meaning and interpretation of a metric, within an operational context, gradually shifts from representing the original, complex goal (the intended referent) to representing only the specific, measured activity itself (the operational referent), while the formal label remains unchanged.*
  *   **Distinction from Gaming:** Gaming focuses on *actions taken* to manipulate the number. Referent Drift focuses on the *evolution of meaning*. The gaming (optimizing gate departure) *causes* the drift (the metric now signifies "gate event timeliness," not "journey quality").
  *   **Related Concepts:**
      *   **Concept Creep (Psychology):** Broadening/narrowing of concept meanings, but not specifically about metrics.
      *   **Indicator Slippage/Drift:** Often used informally but lacks the precision regarding the *referent* change.
      *   **Reification (Philosophy/Sociology):** Mistaking the abstract metric for the concrete reality, but doesn't capture the *shift* from one reality to another.
      *   **Semantic Decoupling:** Similar idea, emphasizing the separation of label and meaning.
  *   **Why "Referent Drift"?** It directly addresses the shift in *what the metric points to* (its referent). In Case 2, the printed label ("On-Time Departure") drifts from referring to "passenger journey quality" to referring strictly to "gate push-back timeliness." The *word* is stable; the *meaning-in-use* migrates. This is distinct from the *action* of Operational Decoupling and the *deceit* of Representational Degradation.

  ---

  **Conclusion:**

  1.  **Literature Gaps:** Established terms handle Cases 1 (Creaming/Falsification) and 2 (Output Distortion/Campbell's Law) reasonably well, but blur distinctions between deceit and real-but-misdirected action. Case 3 lacks a standard positive/neutral term for accidental goal achievement. The *semantic shift* (Referent Drift) is under-theorized in the context of metric distortion.
  2.  **Proposed Taxonomy:**
      *   **Representational Degradation:** Falsifying the record (Case 1).
      *   **Operational Decoupling:** Gaming by reshaping reality around the narrow measure, undermining the goal (Case 2).
      *   **Serendipitous Congruence:** Gaming that accidentally fulfills the goal (Case 3).
      *   **Referent Drift:** The semantic migration of the metric's meaning (Key aspect of Case 2).
  3.  **Value:** This taxonomy explicitly separates the *mechanism* of distortion (record falsification vs. real action change) and the *outcome for the goal* (undermined vs. accidentally achieved). It names the critical semantic shift.

  This framework offers sharper analytical tools than Goodhart's Law alone. Test these terms against more of your cases – especially edge cases where reality manipulation has mixed effects or the goal achievement is partial. The "Serendipitous Congruence" case deserves particular attention; it challenges the assumption that gaming is always harmful.
