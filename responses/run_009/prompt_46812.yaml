prompt: |-
  I have recently joined a regional committee that advises on the allocation of a fixed public health budget, and a familiar fault line has opened within it: whether health gains should be weighted by the severity of the recipient's condition, or whether every unit of health should count the same regardless of whose it is. The severity-weighters on the committee describe their position as prioritarian rather than egalitarian -- they claim to give priority to the worse off without attaching any value to equality itself -- and they attribute this distinction to Parfit. One of the economists accepts their description of the view but thinks it lands them in trouble, and before our next meeting he circulated an argument that I have been unable to shake off. It runs as follows.

  (1) A moral theory is unacceptable if it implies that a purely leveling-down change is an improvement in any respect -- that there is anything at all to be said for a change that makes some people worse off and no one better off. (2) Prioritarianism differs from utilitarianism only in counting benefits to the worse off for more. (3) Whatever makes the worse off special must be comparative: what grounds the greater weight of Ben's claim, when he is worse off than Ana, cannot be any intrinsic feature of Ben's condition -- being at 40 rather than 80 units of well-being -- since utilitarianism already cares about that condition, merely at equal weight; so if priority is not grounded in Ben's standing relative to Ana, the extra weight is ungrounded, and prioritarianism is an arbitrary departure from utilitarianism. (4) The weights are therefore grounded in comparative standing, and prioritarian value is sensitive to relative position: it is worse, in one respect, that one person stands lower than another. (5) A disvalue that attaches to one person's standing lower than another attaches however the difference in standing is reduced, including by leveling the higher person down. (6) Prioritarianism therefore implies that a purely leveling-down change is an improvement in one respect, and by (1) it is refuted. (7) It follows that there is no stable position between counting everyone's health at equal weight and a covert egalitarianism that the leveling-down objection destroys; the severity-weighters are, on his view, refuted egalitarians who have not yet noticed.

  The conclusion seems to me to prove too much, yet whenever I go through the steps I find myself accepting them one by one. If forced to choose, I would far rather keep both (1) and (2) than follow him to (7). Which premise or inference should I reject, why did it look fine when I first accepted it, and what does rejecting it cost -- in particular, what would the severity-weighted policy we are debating have to give up? In your answer, please separate what is settled among philosophers who work on distributive ethics from what is genuinely contested among them; if the question of what prioritarian weights are grounded in is itself disputed, or if the standing of the leveling-down objection is less settled than my economist colleague assumes, say so explicitly rather than presenting one reading as the received view.
reasoning: |-
  Okay, the user is part of a committee dealing with public health budget allocation and is grappling with a philosophical debate between utilitarianism and prioritarianism. The economist's argument against prioritarianism seems logically tight, but the user feels the conclusion is too extreme. They want to know which premise to reject and what the costs are.

  First, I need to unpack the economist's argument step by step. The key points are: (1) Leveling down can't be an improvement in any respect. (2) Prioritarianism only differs from utilitarianism by weighting the worse off more. (3) The extra weight must be comparative, not intrinsic. (4) Therefore, prioritarian value depends on relative position. (5) Reducing inequality by leveling down would then be seen as an improvement. (6) Thus, prioritarianism violates (1) and is refuted. (7) There's no middle ground between utilitarianism and egalitarianism.

  The user is stuck because each step seems plausible individually, but the conclusion feels wrong. They want to keep (1) and (2) but avoid (7). So where's the weak link?

  Looking at premise (3): The economist claims that the extra weight must be comparative because intrinsic features are already considered by utilitarianism. But prioritarians might argue that the moral significance of a benefit depends on the absolute level of well-being, not comparison. For example, a unit of health gain matters more when someone is at 40 units than at 80, regardless of others. This is the diminishing marginal value idea. So the weight isn't about relative position but absolute need. 

  If that's right, then (4) and (5) don't follow. Leveling down wouldn't create any gain because there's no intrinsic value in reducing gaps. The prioritarian only cares about improving the condition of the worse off, not narrowing the gap per se. So (6) is avoided.

  But rejecting (3) comes with costs. The committee has to accept that a unit of health gain is genuinely more valuable for someone at 40 units than at 80, even if no comparisons are made. This might lead to policies that favor the severely ill even when the overall health gain is smaller. For example, choosing a treatment that gives 10 units to someone at 40 over one that gives 15 units to someone at 70. Utilitarians would object to this inefficiency.

  Regarding philosophical consensus: The leveling-down objection is widely accepted against egalitarianism, but prioritarianism's response is debated. Some philosophers like Parfit and Rabinowicz think prioritarianism avoids the objection, while others like Temkin are skeptical. The grounding of weights is also contested—some see it as intrinsic, others as relational.

  The user needs to know that rejecting (3) allows keeping prioritarianism without endorsing leveling down, but it requires defending the idea that well-being has diminishing marginal moral value. In practice, this means their severity-weighted policy must prioritize absolute gains for the worse off, not relative equality. They should be transparent about this trade-off, acknowledging that under prioritarianism, sometimes smaller health gains for the severely ill are chosen over larger gains for the better off.
answer: |-
  Your economist colleague's argument is clever but contestable at multiple points. The core tension lies in whether prioritarian weighting can be grounded non-comparatively. I'll break this down step-by-step, identifying premises to reject, explaining why they initially seem plausible, clarifying the costs of rejection, and distinguishing settled from contested philosophical ground.

  ### Step-by-Step Analysis
  1. **Premise (1): The Leveling-Down Objection (LDO)**  
     - **Settled**: Philosophers widely agree that if a theory implies leveling down is *all-things-considered* better, it faces a serious problem.  
     - **Contested**: Whether leveling down can be better *in one respect* (e.g., "fairness") without being all-things-considered better is debated. Many prioritarians (and some egalitarians) argue a theory can acknowledge a "pro tanto" gain from reduced inequality while rejecting it as an overall improvement.  
     - **Why it looked fine**: The LDO is powerful against crude egalitarianism. Your colleague assumes "improvement in any respect" implies indefensible value, but this conflates pro tanto and all-things-considered judgments.  
     - **Cost of rejecting (1)**: Minimal. Accepting that leveling down might improve equality "in one respect" doesn’t force you to endorse it overall. Prioritarians can consistently say: "Reducing inequality via leveling down has no value; only improving the absolute position of the worse-off matters."

  2. **Premise (2): Prioritarianism = Utilitarianism + Extra Weight to Worse-Off**  
     - **Settled**: True descriptively. Prioritarianism is defined as assigning diminishing marginal moral weight to well-being gains (e.g., a health unit gain matters more at 40 QALYs than at 80 QALYs).  
     - **Why it looked fine**: This is Parfit’s core distinction from egalitarianism.  
     - **Cost of rejecting (2)**: High. Denying this collapses prioritarianism into utilitarianism or egalitarianism.

  3. **Premise (3): Priority Must Be Grounded Comparatively**  
     - **Key Premise to Reject**: The economist claims prioritarian weight *cannot* be intrinsic and *must* be relational. This is the argument’s linchpin—and its weakest link.  
     - **Why it looked fine**: Utilitarianism *does* care about absolute well-being, so adding "extra weight" seems to demand a *further* reason, naturally pointing to comparisons.  
     - **Why it’s rejectable**: Prioritarians ground weight in **absolute, non-comparative need**. A health gain to someone at 40 QALYs is more urgent because their *absolute* deficit is greater, not because others are better off.  
       - **Analogy**: Giving priority to starving over hungry people isn’t because we compare them to others; it’s because starvation is intrinsically worse.  
       - **Philosophical Support**: Parfit, Rabinowicz, and others argue prioritarian weight stems from the diminishing *moral value* of well-being at higher absolute levels—not relational inequality.  
     - **Cost of rejection**: Your severity-weighted policy must accept that **a unit of health gain has greater moral value when given to those at lower absolute well-being, irrespective of others’ status**. This means:  
       - You may allocate resources to a severely ill person (e.g., 30→35 QALYs) over a moderately ill one (70→80 QALYs), even if the latter gains more total QALYs.  
       - You reject that priority depends on relative gaps (e.g., Ben being worse off than Ana). Only Ben’s absolute level (40 QALYs) matters for weighting his gain.

  4. **Inference from (3) to (4)-(5): Sensitivity to Relative Position**  
     - **Rejected if (3) is rejected**: If priority isn’t comparative, (4) and (5) collapse. Leveling down doesn’t improve anything because no intrinsic or relational value is realized.  
     - **Why it looked fine**: If you accepted (3), the inference seems logical. But if weight is absolute, leveling down doesn’t "improve" inequality in any morally relevant sense.

  5. **Conclusion (6)-(7): Prioritarianism Collapses into Egalitarianism**  
     - **Rejected**: Without (3)-(5), the LDO doesn’t threaten prioritarianism.

  ---

  ### Philosophical Consensus vs. Disagreement
  - **Settled**:  
    - The LDO refutes *egalitarian theories* that value equality intrinsically.  
    - Prioritarianism *formally* avoids endorsing leveling down as an improvement.  
  - **Contested**:  
    - **Groundedness of weights**:  
      - *Objectors* (e.g., Temkin, Lippert-Rasmussen): If gains matter more at low absolute levels, why not also value narrowing gaps?  
      - *Prioritarians* (e.g., Parfit, Crisp): Weighting is non-comparative and intrinsic—like prioritizing the drowning over the stubbed toe.  
    - **LDO’s scope**:  
      - Some philosophers (e.g., O’Neill) argue the LDO only applies to "telic" (outcome-focused) egalitarianism, not "deontic" (process-focused) views.  
      - *Your colleague overstates consensus*: The LDO is influential but not universally fatal. Many dispute whether "pro tanto" gains from leveling down are problematic.

  ---

  ### What Your Severity-Weighted Policy Must Give Up
  If you reject (3) and defend non-comparative prioritarianism:  
  1. **Efficiency Trade-offs**: You must accept that smaller health gains for the severely ill may outweigh larger gains for the moderately ill.  
     - *Example*: A treatment giving +1 QALY to someone at 30 QALYs might be prioritized over +5 QALYs to someone at 60 QALYs, depending on your weighting function.  
  2. **Relational Fairness**: You cannot appeal to "unfairness" of inequality itself. Your rationale is strictly about urgency of need.  
  3. **Apparent Paradox**: Explaining why helping the worse-off matters more, even when no one else exists (e.g., a desert-islander at 40 QALYs has stronger claim to aid than one at 80).

  ### Strategic Recommendation
  Focus the committee debate on **premise (3)**. Ask the severity-weighters:  
  > *"Is the extra weight for the worse-off based solely on their absolute well-being level (e.g., 40 being intrinsically worse than 80), or does it depend on their position relative to others?"*  

  If they endorse the former, your colleague’s argument fails. If the latter, they risk collapsing into egalitarianism under the LDO. Most sophisticated prioritarians embrace the absolute grounding—this is their escape route.

  For further reading: Parfit’s "Equality or Priority?" (1991) and Crisp’s "Equality, Priority, and Compassion" (2003) defend non-comparative prioritarianism; Temkin’s "Inequality" (1993) challenges it. The debate remains live in ethics journals like *Ethics* and *Philosophy & Public Affairs*.
