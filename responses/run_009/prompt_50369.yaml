  ## The Bellows Dialogue

  **Setting:** A sterile, dimly-lit ICU room. The only sounds are the rhythmic *hiss-squeak* of a manual bellows ventilator being squeezed by DAVID’S hand and the faint, constant beep of a heart monitor. SARAH stands beside the bed, arms crossed, looking exhausted. DAVID looks pale, focused on the rhythmic motion of his hand.

  **Characters:**
  *   **SARAH (40s):** ICU Physician. Sharp, pragmatic, visibly drained. Consequentialist.
  *   **DAVID (40s):** Philosophy Lecturer. Thoughtful, earnest, grappling with guilt and conviction. Defends the doing/allowing distinction.

  **(The rhythmic *hiss-squeak* continues for several beats. David’s arm trembles slightly.)**

  **SARAH:** (Quietly, fiercely) It’s been fourteen months, David. Fourteen months of this… medieval torture. For her, for us. Especially for me. My hands ache in my sleep. I dream the sound.

  **DAVID:** (Without looking up, voice strained) I know, Sarah. I know the cost. I see it on your face every time. I see it… in her eyes when she’s lucid. But that doesn’t change what stopping *is*.

  **SARAH:** (Snaps, but keeps her voice low) What it *is*? It’s stopping the torture! It’s letting this horrific, unnatural state *end*. Her heart is failing, her lungs are scarred tissue. The *disease* is killing her. This bellows… (She gestures sharply at it) …this is just holding the door shut against the inevitable tide. Stopping isn’t *doing* anything new. It’s just… stepping aside.

  **DAVID:** (Finally looks up, meeting her gaze. His hand keeps squeezing.) Stepping aside? Sarah, look at what’s happening. *Right now*. Her life depends entirely on this continuous, positive action – my hand moving, the bellows compressing, air forcing into her lungs. The moment I *choose* to stop moving my hand – the moment *anyone* chooses to stop – her oxygen stops. Her heart stops. *Because we stopped acting*. That’s not stepping aside from a natural process; this *isn't* natural! We intervened massively. Stopping the intervention *at this specific point* isn't allowing nature; it's *terminating the artificial life support we imposed*. It’s an act of commission against a life we are actively sustaining.

  **SARAH:** (Leans forward, gripping the bed rail) That’s where your distinction collapses, David. You’re fixated on the immediate mechanical trigger. "Hand stops = death." But zoom out! What *caused* her to be utterly dependent on constant manual squeezing? *Motor Neurone Disease*. That’s the killer. The bellows is just… a pause button we’ve been desperately holding down. Letting go of the button isn’t *pressing* a kill switch; it’s just releasing the pause. The disease resumes its course. *That’s* the allowing. We’re allowing the underlying pathology to proceed.

  **DAVID:** But the dependency changes the moral landscape! Imagine a prisoner chained to a wall in a rising tide. If I walk away, I *allow* the tide to drown him. But if I’m the one physically *holding his head above water*, and I decide to stop holding him up? That’s not just walking away; that’s actively *dropping* him. The means of death shift. Here, *our continuous action is the sole barrier*. Ceasing that specific action *is* the direct cause of death in a way that merely not starting CPR isn't. The distinction *does* track a difference in agency and causation.

  **SARAH:** (Scoffs, but it’s weary) Agency? Causation? Fine. Let’s grant your distinction for argument’s sake. Say stopping *is* a "doing." So what? Does that automatically make it *wrong*? Look at the *consequences*! She’s trapped. She’s suffered immensely. The medical reality – the futility the ethics committee recognized – is that this buys nothing but more suffering. Zero chance of recovery or even meaningful consciousness most of the time. The *good* of stopping, of ending *this specific, horrific form of existence*, outweighs any abstract weight you assign to the *type* of act it is. Why should the *how* matter more than the *what happens next*?

  **DAVID:** (Pauses, his squeezing slows for a fraction of a second before resuming) Because *intention and agency matter*, Sarah. They shape who we are. If we deliberately stop the action keeping her alive, knowing death is the immediate, certain consequence, we *intend* her death as a means to an end. That feels… different morally than withdrawing a treatment we *know* won’t work on someone who isn’t utterly dependent on our continuous physical action *right this second*. It feels like crossing a line from *letting die* to *making die*.

  **SARAH:** (Her voice softens slightly, but remains firm) And I think clinging to that distinction, *especially* in this grotesque scenario, is what’s cruel. It lets you feel morally cleaner while condemning her – and me – to more torture. It’s a philosophical fig leaf. The outcome is identical: she dies when we stop. The *only* difference is whether we frame it as "we stopped the machine" or "the disease killed her." But the disease *would have* killed her fourteen months ago if we hadn’t started squeezing! Our action *prevented* the natural course then. Stopping now *restores* it. The "killing" was starting this unsustainable, futile intervention in the first place. Persisting is the ongoing harm.

  **DAVID:** (Looks down at his hand, then at their mother’s still face) But… is the distinction *itself* the problem? Or is it that you don't believe any distinction like this *could ever* carry moral weight if the consequences are bad enough? If the suffering is great, does the nature of the act – doing vs. allowing – simply cease to matter? Is the *only* thing that counts the net balance of suffering?

  **SARAH:** (Silent for a long moment. The bellows *hiss-squeak* fills the room. She rubs her own wrist unconsciously.) ...Yes. I think that’s closer to it. In the trenches, David, watching people suffer pointlessly… distinctions like "doing" vs. "allowing" feel like luxuries. Semantics. What matters is the result. Does this action alleviate suffering or prolong it? Here, stopping alleviates unimaginable suffering – hers, ours, the system's resources. Continuing causes it. The *how*… it feels secondary. Almost superstitious. Like worrying if turning off the ventilator switch with your left hand instead of your right makes it murder.

  **DAVID:** And for me… (He takes a shaky breath) …the *how* defines the moral character of the agent. It defines *us*. Saying the distinction is irrelevant feels like saying intention doesn’t matter, that only consequences count. And that… that feels like a dangerous path. It erases something fundamental about responsibility.

  **SARAH:** And insisting on the distinction here feels like prioritizing philosophical purity over palpable, ongoing agony. It ignores the reality that *I* have been the primary agent of this "doing" for most of these months. My hands, my back, my time. Doesn’t that lived experience, that burden of being the *literal* hand that sustains… doesn’t that give my perspective on what stopping *means* some weight? Doesn’t it make me *more* qualified to say this isn’t killing, it’s finally, mercifully, *ceasing*?

  **(David stares at her, then at his own hand, now visibly trembling. He looks at their mother. The rhythmic sound seems louder in the silence that follows. Neither has convinced the other, but the core of the disagreement – whether consequences alone can ever obliterate the moral significance of the act-type – lies bare between them, as heavy as the air in the room.)**

  **DAVID:** (His voice is barely a whisper) Your burden… God, Sarah, I can’t even imagine. I haven’t carried it like you have. But… (He looks back at the bellows, then closes his eyes briefly) …I still see my hand. And I see what happens when it stops moving. And that… that matters to me. It matters deeply. Maybe… maybe it shouldn’t. But it does.

  **(Sarah doesn't reply immediately. She reaches out and gently places her hand over his on the bellows handle, feeling the tremor. The shared rhythm continues – *hiss-squeak* – a fragile, terrible lifeline.)**

  **SARAH:** (Quietly) And the fact that it matters *to you*… matters to me. But Mom… she’s been paying the price for both our convictions for over a year. When does *that* consequence outweigh everything else?

  **(They stand there, hands touching on the bellows, the chasm between their moral frameworks as real as the machine between them and their mother. The argument hasn't ended. It's just found its deepest, most painful level.)**
