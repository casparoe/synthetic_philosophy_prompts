prompt: |-
  Our philosophy reading group did the Smart and Williams for-and-against book on utilitarianism last month, and afterwards two of the members kept the argument going in the pub, about the case Williams uses where a man can rescue his wife or two strangers from drowning but not both. I tried to follow along and mostly did, but I couldn't tell who was actually winning, so I want an outside referee. You're a professional moral philosopher, so please think carefully and don't just give me vibes -- maybe do some brainstorming about each move before you rate them, and be honest where someone is only half right.

  The exchange went roughly like this, five moves:

  (1) Maya said the utilitarian answer is obvious: two lives outweigh one, and from the impartial standpoint there's no morally relevant difference between the man's wife and the two strangers, so he ought to save the two. Any other answer is just letting affection do arithmetic's job.

  (2) Dan said that's exactly what Williams was on about: a man who has to work out that saving his wife is justified, or who does the sums and is relieved that the sums happened to favor her, has in some sense one thought too many. His devotion shouldn't have to win a deliberative contest. And anyway the wife is part of the man's ground projects and attachments, the stuff that makes his life his -- a theory that keeps being ready to tell him to set her aside treats him as just a container that utility passes through, which is what Williams meant by the integrity objection.

  (3) Maya answered that Dan is conflating the criterion of rightness with a decision procedure. A utilitarian, even a smart two-level one, can perfectly well say the husband should NOT stand there calculating in the moment -- the right act is still saving the two strangers, and the husband who spontaneously dives for his wife is admirable but morally lucky. She also said the integrity complaint proves way too much: the selfish careerist also has ground projects and attachments he refuses to set aside, and utilitarianism won't be impressed by his integrity either, so the objection can't be that the theory overrides projects, otherwise it just licenses anyone with a project.

  (4) Dan came back: if your theory only gets the husband to the right verdict by telling him not to think about it, its practical content is parasitic on the very motives it discredits, which should make you wonder what work the theory is doing. And re the careerist, that's a bad analogy -- the point was never that having projects excuses anything, it's that loving particular people, being a husband and not just an altruist with a spouse, is partly constitutive of a life worth living, and a theory that can't explain why that's valuable except as a useful input to welfare is missing something about value, not just about psychology.

  (5) Maya's last word: she suspects Dan's position isn't actually a rival moral theory at all, just an account of good character, and that the two of them aren't disagreeing about what the man ought to do -- they're answering different questions, one about right action and one about what it's admirable or decent to feel. She also accused Dan of sliding between the wife case, where the impartial verdict just feels harsh, and the life-project version of the integrity objection, which is a much bigger claim, and of not noticing he'd changed the subject somewhere between them.

  Please adjudicate move by move: for each of the five, say whether the person is clearly right, clearly wrong, or half right, and justify it. Then tell me who's more right overall, and what (if anything) both of them are missing. Its fine to bring in things neither of them said, as long as you're explicit that you're doing it.
reasoning: |-
  Hmm, the user is asking me to adjudicate a philosophical debate between Maya and Dan about utilitarianism and Bernard Williams' integrity objection. They've outlined five moves from their pub argument, and they want me to judge each move as clearly right, clearly wrong, or half right, then determine who's more right overall and what both might be missing.

  The scenario involves Williams' famous drowning case where a man must choose between saving his wife or two strangers. Maya is defending utilitarianism, while Dan is championing Williams' critique. The user seems philosophically literate - they've read Smart and Williams, understand terms like "criterion of rightness vs decision procedure," and want rigorous analysis, not just vibes.

  For move (1): Maya sets up the utilitarian position clearly - impartial calculation says save the two strangers. She's correct about standard utilitarianism, though she oversimplifies by dismissing affection as irrelevant. Williams would say this misses how moral reasoning actually functions in human lives. Half right because technically accurate but reductively stated.

  For move (2): Dan nails Williams' core points - the "one thought too many" critique and how utilitarianism threatens personal integrity by treating agents as mere utility conduits. His phrasing about "ground projects" is spot-on. But he doesn't address how utilitarians might respond to integrity concerns. Clearly right on Williams' position.

  For move (3): Maya makes two strong points: separating criterion from decision procedure (a standard utilitarian move), and noting the careerist analogy flaw in Williams' argument. But she underestimates how deeply the integrity objection cuts - Williams isn't just talking about feelings but about constitutive elements of value. Half right.

  For move (4): Dan effectively counters Maya's decision-procedure defense by arguing it makes utilitarianism psychologically parasitic on the motives it critiques. His distinction between loving relationships and mere careerism sharpens Williams' point about constitutive goods. But he doesn't resolve how this affects the ought question. Half right because strong on critique but incomplete.

  For move (5): Maya insightfully diagnoses a potential category confusion between moral theory and character evaluation, and catches Dan shifting between the drowning case and broader integrity claims. But she may be too quick to dismiss the possibility that Williams offers a genuine alternative value framework. Half right with important observations.

  Overall, Dan edges ahead because he better captures Williams' substantive challenge to utilitarianism's foundations, while Maya often retreats to utilitarian orthodoxy without fully engaging the deeper issues about value constitution. Both miss opportunities: Maya could explore rule utilitarianism more deeply, Dan should address how partiality fits within morality. The core tension remains between impartial welfare maximization and the intrinsic value of personal commitments.
answer: |-
  Here's a move-by-move adjudication, drawing on core arguments from Williams/Smart and wider utilitarian debates. I'll be scrupulously honest about strengths, weaknesses, and nuances:

  **Move (1) Maya: The Utilitarian Answer is Obvious**
  *   **Verdict: Half Right.**
  *   **Justification:**
      *   **Right:** She accurately states the *classical act-utilitarian calculation*: impartiality mandates saving the greater number (2 > 1). Affection *is* discounted as a morally relevant factor *at the fundamental level of justification* for the act itself. This *is* the "obvious" utilitarian answer if the sole criterion is maximizing aggregate welfare.
      *   **Wrong/Half-Right Limitation:** She oversimplifies Williams' point and the utilitarian landscape. Williams isn't *just* arguing affection should "do arithmetic's job" (i.e., be weighed in the sum); he's arguing that requiring such weighing *at all*, or seeing the wife only as one life among others *in this context*, fundamentally misunderstands the nature of the commitment and the agent's perspective. Her phrasing ignores the depth of the "one thought too many" critique. Furthermore, she ignores potential sophisticated utilitarian responses (like rule- or motive-utilitarianism) that might accommodate spontaneous action without changing the fundamental criterion. She presents a correct but crude and contextually insensitive version of utilitarianism.

  **Move (2) Dan: Williams' Core Integrity Objection & "One Thought Too Many"**
  *   **Verdict: Clearly Right (on Williams' core points).**
  *   **Justification:**
      *   Dan accurately captures the essence of Williams' objections:
          *   **"One Thought Too Many":** The husband saving his wife *because* she's his wife, directly and spontaneously, reflects the proper character of the commitment. Requiring utilitarian justification *in that moment* (or being relieved the sums favor her) corrupts the nature of that relationship. It introduces a morally alien thought process into an act that should flow from direct attachment.
          *   **Integrity Objection (Ground Projects):** Utilitarianism threatens integrity by demanding the agent be perpetually ready to abandon their deepest commitments ("ground projects and attachments") if the calculus demands it. This treats the agent as a mere "container" or conduit for impersonal value, alienating them from the very projects that constitute their identity and make life meaningful. Dan correctly links this to Williams' core argument.

  **Move (3) Maya: Criterion vs. Decision Procedure & The Careerist Analogy**
  *   **Verdict: Half Right (Strong on separation, weak on analogy & depth of objection).**
  *   **Justification:**
      *   **Right (Criterion vs. Procedure):** This is a crucial and valid distinction often made by sophisticated utilitarians (like R.M. Hare's two-level utilitarianism). The *right act* (maximizing welfare) is distinct from the *best decision procedure* in the moment (acting spontaneously on reliable dispositions). Recognizing that the spontaneously affectionate husband is "admirable but morally lucky" is a coherent utilitarian position. She correctly identifies that utilitarianism *can* accommodate the *action* without endorsing the *deliberative process* Williams finds problematic.
      *   **Half-Right/Half-Wrong (Careerist Analogy & Depth of Objection):**
          *   **Weak on Analogy:** Her analogy *is* flawed, as Dan will point out. The selfish careerist's project lacks the *moral value and interpersonal significance* of a loving spousal commitment. Williams isn't defending *any* project; he's defending projects *constitutive of a worthwhile human life*, which centrally include deep personal attachments. Utilitarianism *shouldn't* be impressed by the careerist's "integrity" in pursuing a selfish project, precisely because it *doesn't* contribute positively to overall welfare or reflect a constitutive good in the same way. The analogy misses the qualitative difference in the *type* of project being defended.
          *   **Underestimates the Objection:** While she deflects the crude "licenses any project" interpretation, she doesn't fully grapple with Dan's deeper point (which he elaborates next). The objection isn't *just* that overriding projects is hard or feels bad; it's that a theory which can only value deep personal love *instrumentally* (as a "useful input to welfare") fails to capture its intrinsic value *as a constituent part of the good life itself*. Utilitarianism risks reducing profound human goods to mere pleasure-generators.

  **Move (4) Dan: Parasitism & Constitutive Value of Relationships**
  *   **Verdict: Half Right (Strong critique of parasitism & constitutive value, weak on resolving the "ought").**
  *   **Justification:**
      *   **Right (Parasitism & Constitutive Value):** Dan makes two powerful points:
          *   **Parasitism:** If utilitarianism relies on dispositions *it theoretically discredits* (like direct, non-calculating partiality) to generate good outcomes *in practice*, this raises deep questions about the theory's coherence and independent value. If the theory tells you *not* to use the theory in crucial moments, what work is the theory doing *as a practical guide* beyond endorsing common-sense motives it elsewhere undermines? This is a significant challenge to the "two-level" defense.
          *   **Constitutive Value:** He sharply distinguishes the careerist case. Loving particular people isn't just one project among others; it's partly *constitutive* of a life worth living. A moral theory that cannot recognize the *intrinsic, non-instrumental* value of such relationships – seeing them only as means to aggregate welfare – is accused of having a deficient account of *value itself*. It's missing something fundamental about human flourishing, not just psychology.
      *   **Half-Right Limitation:** While highlighting a crucial weakness in utilitarianism's value theory, Dan doesn't fully resolve the conflict at the level of *action*. *Should* the husband save his wife or the strangers? Williams (and Dan) imply saving the wife is justified, but the justification seems rooted in character/good life considerations rather than a clear competing *moral rule* about right action in that moment. He powerfully critiques utilitarianism but doesn't fully articulate the *positive moral principle* governing the choice beyond the rejection of impartial calculation.

  **Move (5) Maya: Category Confusion & Shifting Arguments**
  *   **Verdict: Half Right (Strong on potential category confusion & identifying a slide, weak on dismissing the rival value theory).**
  *   **Justification:**
      *   **Right (Category Confusion & Sliding Arguments):**
          *   **Category Confusion:** Maya astutely identifies a potential core disagreement: Dan might be primarily offering an *account of good character and the constituents of a flourishing life*, while Maya is focused on a *theory of objectively right action*. If they are answering different questions ("what should he *do*?" vs. "what kind of person *is* he?"), the apparent conflict lessens. Williams *is* often read as focusing more on agent integrity and character than providing a strict deontic competitor to utilitarianism.
          *   **Sliding Arguments:** She correctly calls out that Dan started with the specific, emotionally resonant "drowning wife" case (emphasizing "one thought too many" and the harsh feel of impartiality) and shifted to the broader, more foundational "ground projects/integrity" objection about the nature of value and the agent's life. These are related but distinct arguments with different implications. The drowning case powerfully illustrates the broader point but doesn't *equate* to it.
      *   **Half-Right Limitation:** Her accusation that Dan's position "isn't actually a rival moral theory" goes too far. Williams' integrity objection, especially the point about constitutive goods, *is* fundamentally challenging utilitarianism's *axiology* (theory of value). It suggests utilitarianism has an impoverished conception of what is ultimately valuable (welfare states) and how value resides in human lives (constituted by projects/attachments). This *is* a rival account of the foundations of morality, even if it doesn't always provide crisp action-guidance rivaling utilitarianism's calculus. She risks dismissing a profound meta-ethical challenge.

  **Overall Verdict: Dan is slightly more right overall.**

  *   **Why Dan?** He more consistently and deeply engages with Williams' core critique. He successfully identifies the potential "parasitism" problem for sophisticated utilitarianism and lands the crucial point about the *constitutive* (non-instrumental) value of deep personal relationships within a worthwhile life – a point Maya's responses struggle to adequately counter. This challenges utilitarianism at the foundational level of *what has value*, not just psychology or decision procedures.
  *   **Why only slightly?** Maya makes strong technical points: the criterion/decision procedure distinction is valid and important, and her call-out of Dan sliding between the illustrative drowning case and the broader integrity objection is fair. Her "category confusion" point also highlights a genuine ambiguity in Williams' project. Dan doesn't fully resolve the tension between his defense of partiality and the impartial demand to save more lives.

  **What Both Are Missing (Bringing in Outside Thoughts):**

  1.  **Sophisticated Utilitarian Replies:** Neither fully engages with *rule-utilitarianism* or *motive-utilitarianism* as potential solutions. A rule like "Generally prioritize close family in emergencies" might maximize welfare overall by sustaining the social fabric and psychological well-being derived from secure attachments. Motive-utilitarianism could endorse cultivating dispositions of partial love *because* they reliably produce better outcomes than constant calculation. This offers a utilitarian justification for the spontaneous action *and* the disposition, potentially mitigating the "parasitism" charge by integrating the motives into the theory's justification.
  2.  **The Demandingness Problem:** While Maya hints at impartiality feeling "harsh," neither explicitly connects this to utilitarianism's broader demandingness problem – its potential to require extreme self-sacrifice constantly. Williams' integrity objection is a specific, powerful instance of this.
  3.  **Scope of Partiality:** Dan (channeling Williams) defends partiality towards the wife, but neither discusses the *limits*. If saving the wife meant letting *twenty* strangers drown, would the defense hold? Williams likely intended the case to be close (1 vs. 2) to highlight the conflict, not endorse absolute partiality. The constitutive value argument needs clarification on its scope.
  4.  **Alternative Foundations:** Dan critiques utilitarianism's value theory but doesn't explicitly outline the *positive* alternative foundation for morality he might endorse (virtue ethics? contractualism with a place for attachments?). He leaves the "ought" question somewhat hanging.
  5.  **The "Morally Lucky" Nuance:** Maya's "morally lucky" point is underdeveloped. For utilitarians, luck is inherent in consequences. But Williams might argue that reducing profound commitments to luck misses their essential role in constituting the self and its reasons for action. The "luck" is only apparent from an external perspective alien to the agent's own reasons.

  **Conclusion:** Dan wins on points by more effectively leveraging Williams' deepest challenge to utilitarianism's account of value and integrity. Maya successfully defends utilitarian technical coherence and identifies potential ambiguities in Dan's position but doesn't fully counter the axiological heart of the critique. The debate remains unresolved at the fundamental level of what constitutes the ultimate good and how it relates to the structure of a human life. The pub argument could continue indefinitely!
