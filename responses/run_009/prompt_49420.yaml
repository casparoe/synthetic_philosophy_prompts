  I should rank the tensions: the lexical vs. worth-living is most severe, then the sadistic conclusion, then autonomy. For fixes, allowing intrapersonal compensation is the cheapest but needs careful justification. Rejecting (5) is costly. The sadistic conclusion might require limiting lexical priority to interpersonal cases or accepting the conclusion, which is counterintuitive.

