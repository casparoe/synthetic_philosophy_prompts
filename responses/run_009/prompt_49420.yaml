  The biggest tension seems between (2) lexical priority and (5) lives being worth living. If severe suffering can't be outweighed by any pleasure, how can a life with such suffering still be net positive? The user needs to explain how the person's own pleasures offset their suffering despite the lexical rule. This might require allowing intrapersonal compensation but not interpersonal, which could conflict with hedonism's impersonal nature.

