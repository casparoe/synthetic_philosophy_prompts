prompt: |-
  You're a statistician who has spent way too much of your career dealing with aggregated data, and you're also good at explaining this stuff to normal humans. I need your help turning the ideas around Simpson's paradox into something my team can actually use.

  Context: I run a small analytics unit at a regional healthcare network. Roughly once a week someone asks us a question of the form "is A doing better than B?" -- is hospital A's readmission rate lower than hospital B's, is the new care protocol better than the old one, did patient satisfaction go up after the staffing change. The analysts usually pull the numbers, compute a couple of aggregate rates, and hand over a table. Twice now we've been burned by Simpson-type reversals: the aggregate said one thing, and as soon as someone broke it down by patient severity or by department, the story flipped, and it flipped in a way that embarrassed us in front of the board. So I want a written procedure, not just "be careful."

  Before you write the procedure, take a moment to brainstorm and get the conceptual foundations straight, because I want the procedure to be principled rather than a pile of heuristics. In particular, think through the distinction between a genuine Simpson's reversal (the sign of the association flips between the marginal and the conditional analysis) and the more general problem of aggregation bias, where the marginal number is just misleading without literally reversing. Think also about the point that whether you should condition on the third variable is not a statistical question -- it depends on the causal structure, on whether the subgrouping variable is a plausible common cause of the treatment and the outcome, or a mediator you'd be conditioning away, or just noise. The procedure has to encode that reasoning somehow without requiring my analysts to draw DAGs, unless you really think they should.

  The procedure itself should cover, at minimum: when the analyst is required to check for a possible reversal before sending numbers out (every time? only when the marginal comparison is close? only for certain kinds of questions?); how to pick which disaggregation variables to look at, given that we have dozens in the data and could slice forever; what to do when the subgroups are so small that the breakdowns are themselves statistical garbage -- is there a principled stopping rule or is it a judgment call, and if so whose; what the deliverable to the requester looks like when the aggregate and the disaggregated pictures disagree; and when the procedure should escalate to me rather than let the analyst decide. Be explicit about the steps where judgment cannot be eliminated -- I'd rather know where the honest uncertainty is than get a fake sense of objectivity.

  Then run the procedure on three cases, worked through concretely:

  1. Hospital A has a higher mortality rate than Hospital B overall, but A is the region's trauma center so its patients are much sicker. Everyone already suspects what the right answer is here, but show me how the procedure arrives at it rather than just asserting it, including what the analyst tells the requester.

  2. A new post-surgical protocol looks better than the old one on the aggregate numbers, but once you split by which surgeon performed the procedure, the advantage disappears within each surgeon's patients -- the new protocol happened to be adopted first by the surgeons with better outcomes. Show what the procedure does when the disaggregated answer kills the headline.

  3. This is the one I actually want you to be tough on: patient satisfaction scores went up network-wide after a staffing change, but satisfaction went down within every single department. So the network-wide improvement is an artifact of departments with higher baseline satisfaction growing as a share of the total, and every department is actually slightly worse off. The requester here is the person who championed the staffing change, senior to me, and she wants a clean positive number for her quarterly review. Walk me through what the procedure says to report, how the analyst is supposed to communicate it, and where the procedure hands the decision up to me because it's not really a statistics problem anymore.

  Also tell me where this procedure will misfire. What kinds of questions does it handle badly, and what's the failure mode when analysts start treating it as a box to tick rather than as reasoning? If you think there are structural things about how my unit is set up that make these errors more likely, say so -- I can take it.

  Please think carefully and don't just dump textbook material at me. Write it like something I could actually hand to my team on monday morning.
reasoning: |-
  We are designing a procedure to avoid Simpson's paradox and aggregation bias in healthcare analytics. The key is to condition on the right variables, which depends on the causal structure, but we want to avoid requiring DAGs.

  Conceptual Foundations:
  1. Simpson's reversal: The sign of the association flips between marginal and conditional (on a third variable) analysis.
  2. Aggregation bias: The marginal number is misleading, but not necessarily reversing the sign. Conditioning on a third variable (a confounder) gives the correct picture.
  3. The third variable (Z) can be:
     a. A confounder: Common cause of both the treatment (A vs B) and the outcome. We must condition on it to get the true effect.
     b. A mediator: Effect of the treatment on the outcome that passes through Z. Conditioning on it blocks part of the effect and is usually wrong.
     c. A collider: Variable caused by both treatment and outcome. Conditioning on it induces bias.
     d. Noise: Unrelated. Conditioning might not harm but also not help.

  However, without DAGs, we rely on domain knowledge: Is Z a pre-existing characteristic that might affect both the treatment assignment and the outcome? Then condition. Is Z something that happens after the treatment? Then be cautious.

  Procedure Goals:
  - When to check for reversal?
  - How to pick Z's?
  - How to handle small subgroups?
  - What to deliver when aggregate and disaggregate disagree?
  - Escalation points.

  The Procedure:

  Step 0: Understand the Question
  - Clarify the intervention (A vs B) and the outcome. Also, what is the time frame? What population?
  - Ask: "What factors might influence both the intervention and the outcome?" (This helps identify potential confounders.)

  Step 1: Initial Aggregate Analysis
  - Compute the aggregate metric (e.g., overall readmission rate for A vs B).

  Step 2: Decide Whether to Disaggregate
     Disaggregation is REQUIRED in the following cases (otherwise, optional but recommended when feasible):
     a. When the aggregate result is close (define "close": e.g., relative difference < 10% or p-value between 0.05 and 0.2) OR
     b. When there is a known or suspected confounder (e.g., patient severity in hospital comparisons) OR
     c. When the request is about an intervention that was not randomly assigned (which is almost always in our setting) OR
     d. When the request is for an evaluation of a change over time and there are known shifts in population (like in the staffing change example).

     If none of these apply, then the aggregate may be sufficient.

  Step 3: Selecting Disaggregation Variables (Z's)
     a. Start by listing potential confounders that are pre-treatment and might affect both the intervention and the outcome. Use domain knowledge and past experience (e.g., for hospital comparisons: patient age, severity, comorbidities; for protocols: surgeon, department, patient demographics).
     b. Limit to 2-3 key variables per analysis to avoid multiple testing and small subgroups. Prioritize:
          - Variables known to be strong predictors of the outcome.
          - Variables that are imbalanced between the groups (A vs B) or over time.
     c. If you don't know, consult a subject matter expert (clinician, operations) for 5 minutes.

  Step 4: Conduct Disaggregated Analysis
     a. Break down the data by each Z (one at a time) and compute the metric for each subgroup.
     b. Check for consistency of the effect across subgroups (does A beat B in every subgroup?).
     c. If the effect direction flips in any subgroup (Simpson reversal) or if the effect is inconsistent, note it.

  Step 5: Handling Small Subgroups
     a. Define a minimum cell size (e.g., at least 10 events for rates, or n>=30 for continuous outcomes) for a subgroup to be reported. If a subgroup is too small:
          - Do not report the subgroup.
          - Consider collapsing categories (if ordinal) or grouping with similar categories.
          - If too many subgroups are small, consider using a model (e.g., regression with random effects) to borrow strength. But if the model is too complex, escalate (Step 6).
     b. If the breakdown leads to many small groups and the overall picture becomes unstable, stop and escalate.

  Step 6: Interpretation and Reporting
     a. If the aggregate and disaggregate analyses agree (same direction and consistent story), report the aggregate and note that it holds across key subgroups.
     b. If they disagree (reversal or inconsistency):
          - Do not report the aggregate without context.
          - Report the conditional (disaggregated) analysis as the primary result, and note the reversal.
          - Explain in plain language why the aggregate is misleading (e.g., "Hospital A appears to have a higher mortality rate overall because it treats sicker patients. When comparing similar patients, Hospital A actually has lower mortality.").
     c. When the disaggregated analysis shows no effect (as in the surgeon example) but the aggregate does, report: "The apparent advantage of the new protocol disappears when we account for which surgeon performed the procedure. This suggests that the observed difference may be due to the fact that the surgeons who adopted the protocol first were already achieving better outcomes."

  Step 7: Escalation
     Escalate to the unit head (you) when:
     a. The disaggregation leads to unstable or conflicting results (e.g., one confounder reverses the effect, another does not).
     b. There is a disagreement about which variables to condition on (e.g., is a variable a confounder or a mediator?).
     c. The request is politically sensitive (e.g., the staffing change example) and the results are negative for a senior stakeholder.
     d. The analysis requires advanced methods (e.g., multivariate modeling, causal inference) beyond the team's skill.

  Step 8: Deliverable
     - Always include both the aggregate and the disaggregated results when a reversal is found or when conditioning was required.
     - Write a one-paragraph interpretation that includes:
          - The main finding (conditional if disaggregation was done).
          - A note about the effect of the confounder.
          - A caveat about limitations (if any, like small subgroups).

  Now, walk through three cases:

  Case 1: Hospital Mortality

  Step 0: Question: Is Hospital A's mortality rate higher than Hospital B's?
  Step 1: Aggregate: A has higher mortality.
  Step 2: Disaggregation required because: known confounder (patient severity) and non-random assignment (A is trauma center).
  Step 3: Z = patient severity (e.g., use an available risk score, or break by diagnosis category). Only one variable needed.
  Step 4: Break by severity levels. Find that within each severity level, A has lower mortality.
  Step 5: If severity levels have small counts, consider collapsing. But likely they are large because it's a trauma center.
  Step 6: Report: "While Hospital A has a higher overall mortality rate (X% vs Y%), this is because it treats more severely ill patients. When we compare patients with similar severity, Hospital A has lower mortality (e.g., low severity: A: a% vs B: b%; medium: ...). Therefore, Hospital A is performing better."
  Step 7: No escalation needed (unless there is a problem in step 5).

  Case 2: New Post-Surgical Protocol

  Step 0: Question: Is the new protocol better?
  Step 1: Aggregate: New protocol has lower readmission rate.
  Step 2: Disaggregation required because non-random assignment (surgeon adoption) and known that surgeon skill affects outcomes.
  Step 3: Z = surgeon (categorical). But note: surgeon is not a confounder in the classical sense? Actually, it is because the assignment of the protocol is by surgeon. Also, surgeon skill is pre-existing and affects both the protocol assignment (they choose to adopt) and the outcome. So condition on surgeon.
  Step 4: Break by surgeon. Within each surgeon, the readmission rates are similar between the old and new protocol.
  Step 5: If some surgeons have small numbers, group the low-volume surgeons together? But if the effect is consistently null, then it's clear.
  Step 6: Report: "At the network level, the new protocol is associated with lower readmission rates (X% vs Y%). However, when we account for differences between surgeons, we find that within each surgeon's patients, the readmission rates are similar between the two protocols. This suggests that the observed benefit may be due to the fact that the surgeons who adopted the new protocol earlier were already achieving better outcomes, rather than the protocol itself."
  Step 7: Escalate? Not necessarily, unless the requester challenges the interpretation.

  Case 3: Staffing Change and Patient Satisfaction

  Step 0: Question: Did patient satisfaction go up after the staffing change?
  Step 1: Aggregate: Yes, network-wide satisfaction increased from T0 to T1.
  Step 2: Disaggregation required because over time, the case mix by department might change (confounder: department). Also, non-random and time series.
  Step 3: Z = department (categorical). Also, time period (before vs after) is the treatment.
  Step 4: Break by department. Compute satisfaction for each department in T0 and T1. Find that in every department, satisfaction decreased slightly, but the overall network went up because departments with higher satisfaction (and increasing volume) grew.
  Step 5: If a department is too small, group with others? But likely not.
  Step 6: Report: "Network-wide, patient satisfaction increased from T0 to T1 (X to Y). However, when we look within each department, we see that satisfaction actually decreased in every department. The overall increase is due to a shift in the mix of patients toward departments that have higher baseline satisfaction and that saw an increase in their patient volume. Therefore, the staffing change did not improve satisfaction at the department level; in fact, it is associated with a small decline."
  Step 7: ESCALATE. Why? Because the requester is senior and the result is negative. Also, there might be a causal question: is the staffing change causing the shift in patient mix? But the procedure requires the analyst to escalate when the result is politically sensitive and when the interpretation might be contentious.

  Where the procedure could misfire:
  1. Over-disaggregation: Checking too many Z's increases the chance of a false reversal (multiple testing). We limit to 2-3 key confounders to mitigate.
  2. Under-disaggregation: Missing a key confounder because it wasn't thought of. The procedure relies on domain knowledge and expert input.
  3. When the confounder is a mediator: For example, if we condition on a variable that is on the causal pathway, we might block the true effect. Example: In the staffing change, if we condition on department but the staffing change caused a reorganization of departments, then department is a mediator. But in this case, the departments existed before and after, so it's more of a confounder. The procedure doesn't solve this perfectly. We rely on the rule: condition only on pre-treatment variables. If unsure, escalate.
  4. Treating as a box-ticking: Analysts might just break by one Z and report without thinking. We require a justification for the choice of Z (Step 3) and escalation when confused.

  Structural issues:
  - The unit might not have enough subject matter expertise. Solution: build relationships with clinicians and operations for quick consults.
  - Time pressure: Disaggregation takes time. But the procedure says to disaggregate when required (Step 2) and only 2-3 variables. For routine requests, it might be feasible.

  Final Procedure Document:

  # Procedure for Avoiding Aggregation Bias and Simpson's Paradox

  ## When to Use This
  For any request comparing two groups (A vs B) or before vs after, where the outcome is an aggregate measure (rate, average).

  ## Steps

  1. **Clarify the Question and Identify Potential Confounders** (5 min)
     - What is the intervention? What is the outcome?
     - What factors might affect both? (e.g., for hospital comparisons: patient severity; for time trends: case mix). Ask a subject matter expert if uncertain.

  2. **Compute the Aggregate Metric** (as usual)

  3. **Decide Whether to Disaggregate** (REQUIRE in these cases):
     - The aggregate result is close (relative difference < 10% OR p-value between 0.05 and 0.2) OR
     - There is a known or suspected confounder (e.g., patient severity, department, surgeon) OR
     - The intervention was not randomly assigned OR
     - Evaluating a change over time and there are known population shifts.

     If none of these, the aggregate may be sufficient. Otherwise, proceed.

  4. **Select 1-3 Disaggregation Variables (Z)**
     - Pick pre-treatment variables that are strong predictors of the outcome and might be imbalanced between groups.
     - Limit to 2-3. Prioritize: 
          - Variables previously identified as confounders in similar studies.
          - Variables with known imbalance (check!).
     - If unsure, consult a subject matter expert (5 min).

  5. **Break Down by Z**
     - For each Z, compute the metric within each subgroup.
     - Check for consistency: Is the effect (A vs B or before vs after) in the same direction in every subgroup?

  6. **Handle Small Subgroups**
     - Do not report a subgroup with fewer than 10 events (for rates) or n<30 (for means).
     - If many subgroups are small, consider:
          - Collapsing categories (if ordinal) OR
          - Grouping similar categories OR
          - Escalate to [Unit Head] if more than 20% of data is in small subgroups.

  7. **Interpret and Report**
     - If aggregate and conditional agree: report aggregate and note consistency.
     - If they disagree (reversal or inconsistency):
          - Report the conditional analysis as the primary finding.
          - Explain why the aggregate is misleading (due to confounding by Z).
     - Always include a note: "This analysis adjusted for [Z] to account for differences in [reason]."

  8. **Escalate to Unit Head When**
     - Results are unstable or conflicting (e.g., reversal with one Z but not another).
     - Uncertain whether a variable is a confounder or a mediator.
     - The request is politically sensitive and results are negative for a senior stakeholder.
     - Advanced methods are needed.

  ## Deliverable Template

  > We compared [A] vs [B] on [outcome]. 
  > 
  > **Aggregate result:** [A] had [metric] of X, [B] had Y. [Difference].
  > 
  > **Disaggregation:** Because [reason from Step 3], we broke down by [Z]. 
  >   - Within each subgroup of [Z], we found: [summary of conditional result].
  > 
  > **Conclusion:** [The overall difference appears to be driven by differences in Z] OR [After accounting for Z, we find ...].
  > 
  > **Caveats:** [Any small subgroups? Limitations?]

  ## Examples (attached)

  [Include the three cases as above, but anonymized.]

  ## Watch Out For

  - Don't disaggregate by too many variables (max 3).
  - Don't ignore small subgroups: if you can't report them, note why and escalate if it affects the conclusion.
  - If you find a reversal, double-check the data and the coding of Z.

  By following this, we avoid misleading the board and build trust.

  Let me know if you have questions.

  [Your Name]
  [Date]
answer: |-
  ### **Procedure: Avoiding Aggregation Bias in Healthcare Analytics**  
  *Purpose: Prevent misleading conclusions from aggregated data by systematically checking for Simpson’s paradox and confounding.*  
  **Key Principle:** Aggregate numbers (e.g., overall rates) can be deceptive when groups differ in underlying risk factors. Conditioning on these factors (e.g., patient severity) is essential—but only if they are **confounders** (pre-existing causes of both the treatment/group and outcome), not mediators or noise.  

  ---

  ### **When to Check for Reversal?**  
  Disaggregation is **MANDATORY** if **ANY** of these apply:  
  1. **Non-random assignment** (e.g., hospitals specialize in different patient types, protocols are rolled out unevenly).  
  2. **Known confounders exist** (e.g., age, comorbidities, department, surgeon skill).  
  3. **Aggregate result is "close"** (relative difference < 15% or p-value 0.05–0.20).  
  4. **Time-trend analysis** (e.g., "before vs. after" comparisons where population composition may shift).  
  *Otherwise:* Disaggregation is optional but recommended.  

  ---

  ### **How to Pick Variables for Disaggregation?**  
  1. **Start with domain knowledge:** Focus on 1–2 variables that are:  
     - **Plausible confounders** (e.g., patient risk scores, department type, surgeon).  
     - Strong predictors of the outcome (e.g., mortality, readmission).  
     - Imbalanced between groups (e.g., Hospital A sees 3× more trauma cases).  
  2. **Avoid mediators:** Do NOT condition on variables affected by the treatment (e.g., "days in ICU" after a protocol change).  
  3. **Limit to 2 variables max:** Prioritize based on clinical input (ask a clinician for 5 mins if unsure).  
  *Example:* For hospital comparisons, **patient severity** is a confounder; for surgeon protocols, **surgeon ID** is a confounder.  

  ---

  ### **Handling Small Subgroups**  
  - **Minimum group size:** Subgroups with <10 events (e.g., <10 deaths) or <30 total observations are too unstable.  
  - **Solutions:**  
    - **Collapse categories** (e.g., merge "high" and "very high" risk).  
    - **Use risk adjustment** (e.g., logistic regression with severity score) if subgroups are small but confounder is critical.  
    - **Escalate to unit lead** if >20% of data is in small subgroups.  
  *Judgment call:* The analyst decides based on data stability, but escalates if the conclusion hinges on unstable subgroups.  

  ---

  ### **Reporting Results**  
  - **If aggregate and disaggregated results agree:** Report the aggregate with a footnote (e.g., "Results consistent across severity levels").  
  - **If they disagree:**  
    - **Lead with the disaggregated result** (it’s more reliable).  
    - **Explain the reversal plainly** (e.g., "The overall rate is misleading because...").  
    - **Include both numbers** (aggregate and conditional) for transparency.  
  - **Example language:**  
    > *"Hospital A has a higher overall mortality rate (7.2% vs. 5.8%), but this is because it treats sicker patients. When comparing similar patients, Hospital A’s mortality is actually lower (e.g., 4.1% vs. 4.8% for high-severity cases). The overall number is confounded by patient risk."*  

  ---

  ### **Escalation Points**  
  Escalate to you (unit lead) if:  
  1. Disaggregated results are unstable or conflict with domain knowledge.  
  2. Uncertainty about whether a variable is a confounder or mediator.  
  3. Politically sensitive requests where stakeholders may resist the findings.  
  4. Advanced methods (e.g., causal modeling) are needed.  

  ---

  ### **Worked Examples**  
  #### **Case 1: Hospital Mortality Rates**  
  - **Question:** "Is Hospital A’s mortality rate higher than Hospital B’s?"  
  - **Aggregate result:** A (7.2%) > B (5.8%).  
  - **Procedure:**  
    1. **Disaggregation mandatory?** Yes—Hospital A is the trauma center (non-random assignment).  
    2. **Pick variables:** Patient severity (confounder; pre-existing, affects outcome and hospital assignment).  
    3. **Disaggregate:** Mortality by severity level (low/medium/high).  
       - High severity: A (4.1%) < B (4.8%).  
       - Medium severity: A (2.3%) < B (2.7%).  
    4. **Small subgroups?** No (sufficient sample sizes).  
    5. **Reporting:**  
       > *"Hospital A’s overall mortality is higher because it treats more high-risk patients. When adjusted for severity, Hospital A performs better. Do not use the aggregate rate for comparisons."*  
  - **Outcome:** Report disaggregated result. No escalation.  

  ---

  #### **Case 2: New Post-Surgical Protocol**  
  - **Question:** "Is the new protocol better than the old one?"  
  - **Aggregate result:** New protocol readmission rate (3.5%) < old protocol (5.0%).  
  - **Procedure:**  
    1. **Disaggregation mandatory?** Yes—protocol adoption was surgeon-dependent (non-random).  
    2. **Pick variables:** Surgeon ID (confounder; skill affects both protocol assignment and outcome).  
    3. **Disaggregate:** Readmission rate by surgeon.  
       - Surgeon X: New (4.0%) vs. old (4.1%).  
       - Surgeon Y: New (3.8%) vs. old (3.9%).  
    4. **Small subgroups?** No.  
    5. **Reporting:**  
       > *"The new protocol’s apparent advantage disappears when comparing patients within the same surgeon. The aggregate difference is driven by higher-skilled surgeons adopting the protocol first. No evidence the protocol itself improves outcomes."*  
  - **Outcome:** Report disaggregated result. Escalate if the requester pushes back.  

  ---

  #### **Case 3: Patient Satisfaction After Staffing Change**  
  - **Question:** "Did satisfaction improve after the staffing change?"  
  - **Aggregate result:** Post-change (82%) > pre-change (78%).  
  - **Procedure:**  
    1. **Disaggregation mandatory?** Yes—time-trend analysis with shifting department volumes.  
    2. **Pick variables:** Department (confounder; baseline satisfaction affects both outcome and volume shifts).  
    3. **Disaggregate:** Satisfaction by department.  
       - ER: Post-change (75%) < pre-change (78%).  
       - Pediatrics: Post-change (85%) < pre-change (87%).  
       - *All departments* show slight declines.  
    4. **Small subgroups?** No.  
    5. **Reporting:**  
       > *"Network-wide satisfaction increased due to higher-volume departments (with historically higher scores) seeing more patients. Every department’s satisfaction declined slightly after the change. The aggregate trend is misleading."*  
  - **Escalation:** **Required immediately.**  
    - Why: Senior stakeholder conflict; results imply harm.  
    - **Analyst action:**  
      - Present disaggregated numbers and explanation.  
      - State: "The staffing change correlates with lower satisfaction in all departments. I’ve escalated this to [you] due to the sensitivity."  
    - **Your action:**  
      - Discuss with stakeholder: "The data shows a consistent decline within departments, masked by volume shifts. We recommend investigating root causes rather than reporting the aggregate."  

  ---

  ### **Where This Procedure Misfires**  
  1. **Over-reliance on heuristics:** Analysts might treat confounder selection as a checkbox ("just pick severity and surgeon") without thinking causally.  
     - **Mitigation:** Require a 1-sentence justification for each variable chosen (e.g., "Patient severity is a pre-existing cause").  
  2. **Missed confounders:** Limited to 1–2 variables; may miss subtle confounders (e.g., socioeconomic status).  
     - **Failure mode:** "False negative" reversal.  
     - **Mitigation:** Use clinician input and past data audits to update variable priorities.  
  3. **Over-disaggregation:** Slicing data into tiny subgroups creates noise.  
     - **Mitigation:** Enforce minimum group sizes; use models (e.g., regression) if data is sparse.  
  4. **Mediator vs. confounder confusion:** E.g., conditioning on "ICU length of stay" after a protocol change (mediator) would hide true effects.  
     - **Mitigation:** Training on causal concepts; escalate when unsure.  

  ---

  ### **Structural Risks in Your Unit**  
  - **Problem:** Analysts "pull numbers and run" without clinical context.  
  - **Solution:** Embed clinicians in your unit (even part-time) for rapid input on confounders.  
  - **Problem:** Pressure for quick, simple answers.  
  - **Solution:** Mandate the procedure for all "A vs. B" and "before vs. after" requests—no exceptions.  

  ---

  **Final Deliverable to Team:** [Attach this document + a 1-page cheat sheet]  
  **Training:** Run a 60-min workshop with Cases 1–3.  
  **Accountability:** Analysts must document confounder selection and escalation decisions.  

  This turns Simpson’s paradox from an academic footnote into a routine safeguard. It won’t eliminate judgment—but it forces honest conversations about uncertainty.
