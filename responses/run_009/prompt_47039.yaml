  ### Anthropic Mutual Assurance, Ltd.  
  **Customer FAQ & Policy Terms**  

  **faq 1: what does anthropic mutual insure?**  
  anthropic mutual offers coverage for financial losses arising from indexical uncertainty. this includes wagers, investments, and existential hedges where outcomes depend on self-locating evidence (e.g., your temporal position in humanity, your identity after fission, or your existence relative to hypothetical observer populations). we do not insure against non-indexical risks.  

  **faq 2: how do you remain neutral in anthropic debates?**  
  our policies do not endorse the self-sampling assumption (ssa), self-indication assumption (sia), or any other anthropic principle. we recognize all defensible frameworks as valid per your stated position at policy inception. claims are evaluated using procedure alone, not philosophical preference.  

  **policy clause 1: reference class assignment**  
  1.1. the policyholder must specify at inception the reference class used to compute probabilities critical to the insured risk.  
  1.2. at claim time, the company reserves the right to assign the policyholder to a reference class selected from defensible alternatives, including but not limited to:  
  - biological humans in your civilization epoch;  
  - observers with equivalent cognitive capacity;  
  - agents aware of the insured risk.  
  1.3. probabilities for claim adjudication will be derived from the assigned reference class.  

  **policy clause 2: doomsday risk surcharge**  
  2.1. policies covering human extinction or civilizational collapse are subject to a doomsday risk surcharge.  
  2.2. the surcharge is calculated as:  
  > *base premium × (1 + (b / bₘₐₓ) × t)*,  
  where *b* is the policyholder’s estimated birth rank (adjusted for uncertainty), *bₘₐₓ* is the current highest confirmed human birth rank, and *t* is years elapsed since policy inception.  
  2.3. example: a policyholder at *b* = 80 billion (with *bₘₐₓ* = 100 billion) in year 5 of coverage pays 1.4× base premium.  

  **policy clause 3: presumptuous philosopher rider**  
  3.1. applies to policies covering wagers made under sia (e.g., 50:1 odds favoring a cosmos with 10¹²× more observers than alternatives).  
  3.2. the policyholder must disclose all indexical information conditioned upon (e.g., "i exist" vs. "i am observer 714 in universe α").  
  3.3. the company may reevaluate the probability of the insured event by conditioning on:  
  - the policyholder’s existence *as the specific individual named herein*;  
  - the policyholder’s act of purchasing this policy.  
  3.4. claim payouts require the wager to succeed under both the policyholder’s original calculation and the company’s reevaluation.  

  **policy clause 4: sleeping beauty scenario protocol**  
  4.1. for claims involving amnesia or duplicated observer-states (e.g., sleeping beauty experiments):  
  - the company takes no stance on the halfer-thirder debate.  
  - all probabilities are computed using the company’s standard awakening-adjusted model.  
  4.2. under this model:  
  - a coin toss has two possible outcomes (heads, tails) and three possible awakening states (h-awakening, t-awakening₁, t-awakening₂).  
  - the probability assigned to heads during any awakening is 1/3.  
  4.3. payout example: a $300 bet on heads pays $100 if heads occurs. a $300 bet on tails pays $200 if tails occurs.  

  **policy clause 5: fission and identity continuity**  
  5.1. the insured entity ("you") is defined as the individual named in this policy, as of inception.  
  5.2. in the event of fission, branching, or duplication:  
  - coverage extends to all resulting individuals meeting the criterion of causal and qualitative continuity.  
  - continuity is assessed by the company using:  
    - psychological connectedness (e.g., memory, intention);  
    - physical continuity (e.g., brain matter allocation, quantum decoherence).  
  5.3. the total payout across all continuant individuals will not exceed the nominal payout amount.  

  **faq 3: how are disputes resolved?**  
  claim disagreements are settled via binding arbitration using a panel of causally disconnected observers from defensible reference classes. the company’s actuarial models are final.  

  **policy clause 6: general exclusions**  
  6.1. this policy does not cover:  
  - losses arising from non-indexical miscalibration;  
  - wagers made without a defensible anthropic framework;  
  - existential risks occurring before policy inception.  

