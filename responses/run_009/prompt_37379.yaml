  I'm considering recommending approval voting as the most balanced solution. It avoids Arrow's ordinal framework, has simpler IIA failure modes than ranked methods, and reduces spoiler effects. The ballot would be a binary approve/disapprove per candidate. Counting would sum approvals, with ties broken by lot.

  For Arrow's theorem, I'll clarify that it applies only to ranked ballots - cardinal methods aren't covered. But I'll acknowledge approval can still fail IIA when candidates withdraw, though less severely than ranked methods in cyclic situations.

  The philosopher's IIA concern needs careful handling. I'll show that in the cyclic case, no fair method can satisfy IIA while resolving the cycle, making some trade-off inevitable. Approval at least makes the trade-off about approval thresholds rather than agenda manipulation.

  Regarding the preference ontology question, I'll argue that faculty preferences are coherent but the cycle reveals incompatible majority views - the voting method must construct rather than discover a winner.

  May's theorem will be referenced for the two-candidate case, guaranteeing majority rule satisfies key axioms, but noting it doesn't apply to three candidates.

  For the mathematician's plurality defense, I'll respectfully show how it elects the candidate most opposed by the majority in this cycle, making its simplicity dangerous here.

  I should also warn that choosing the method itself could be strategically manipulated if committee preferences are known, but that approval voting minimizes such incentives.

  The structure will be:
