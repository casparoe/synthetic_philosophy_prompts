answer: |-
  ## MEMORANDUM  
  TO: Faculty Senate, University Committee on Voting Methods  
  FROM: Chair, Ad-Hoc Committee on Voting Methods  
  SUBJECT: Recommendation for Dean of Humanities Election Rule  
  DATE: 15 March 2024  

  ---

  ### I. RECOMMENDATION  
  After rigorous analysis of the straw poll data and deliberation on theoretical constraints, the Committee recommends adopting **Approval Voting** with the following specifications:  
  - **Ballot Design**: Voters may select ("approve") *any number* of candidates they find acceptable. Write-in candidates must be explicitly named and are subject to eligibility verification.  
  - **Counting Procedure**: The candidate with the highest total approvals wins.  
  - **Tie-breaking**: If two or more candidates tie for the highest approval, a fair lottery (e.g., random draw) determines the winner.  

  This method balances theoretical robustness, simplicity, and resilience to strategic manipulation given our cyclic preference profile.  

  ---

  ### II. CONTEXT: THE STRAW POLL AND ITS IMPLICATIONS  
  The straw poll revealed a Condorcet cycle:  
  - 33 voters: A > B > C  
  - 33 voters: B > C > A  
  - 33 voters: C > A > B  

  Under this profile:  
  - Plurality elects A (33 first-choice votes).  
  - Borda Count elects B (fewest last-place rankings).  
  - IRV eliminates the candidate with fewest first-place votes (randomly, given ties), then elects the majority’s second choice.  
  - Sequential pairwise voting lets the agenda-setter determine the winner.  

  This divergence confirms that no candidate is unambiguously preferred by a majority in all pairwise comparisons. We now address the core concerns raised.  

  ---

  ### III. ENGAGING ARROW’S THEOREM AND THE MATHEMATICIAN’S ARGUMENT  
  Arrow’s Impossibility Theorem states that no ranked-ballot method can satisfy all five axioms when choosing among ≥3 candidates:  
  1. **Unrestricted Domain**: Any logically possible preferences are allowed.  
  2. **Ordinal Preferences**: Only rankings (not preference strengths) are used.  
  3. **Pareto Efficiency**: If everyone prefers X over Y, Y cannot win.  
  4. **Independence of Irrelevant Alternatives (IIA)**: The winner between X and Y should not change if a losing candidate Z withdraws.  
  5. **Non-Dictatorship**: No single voter dictates the outcome.  

  **Our Assessment**:  
  - Arrow’s theorem *does* condemn all ranked methods (e.g., Plurality, Borda, IRV) as "arbitrary" in cyclic cases like ours, since all violate IIA or Pareto.  
  - However, the theorem **does not apply** to Approval Voting, which uses binary ("approve/disapprove") rather than ordinal rankings. Thus, rejecting ranked methods does not force us to retain Plurality. Plurality’s failure here is acute: it elects A despite 66% ranking A last. Simplicity is virtuous, but not when it elects the *least broadly acceptable* candidate.  

  **Verdict**: The mathematician’s claim that Arrow’s theorem compels us to keep Plurality is incorrect. Approval Voting escapes Arrow’s framework entirely.  

  ---

  ### IV. THE POLITICAL SCIENTIST’S PROPOSAL: CARDINAL METHODS  
  Approval Voting falls under "cardinal methods," which ask voters to express preference *strengths* (e.g., ratings) rather than rankings. Arrow’s theorem does not constrain these methods, as they violate the "ordinal preferences" axiom.  

  **Does Approval Voting Satisfy IIA?**  
  - Approval Voting can fail IIA if a non-winning candidate withdraws. Example:  
    - Suppose 40 voters approve only A, 35 approve only B, and 30 approve both B and C.  
    - B wins (65 approvals). If C withdraws, A wins (40 approvals).  
  - However, this failure is less severe than under ranked methods in cyclic scenarios. In our cycle, Approval’s outcome depends on *which candidates voters find minimally acceptable*—a coherent standard for dean selection.  

  **Why Approval Over Score Voting?**  
  - Approval is simpler (binary choices reduce voter confusion).  
  - It avoids "favorite betrayal" incentives (voters cannot hurt their favorite by approving them).  

  ---

  ### V. THE PHILOSOPHER’S DEMAND FOR IIA  
  No method satisfying full IIA is possible in cyclic cases without violating other democratic principles. Our recommended rule accepts a limited IIA failure to achieve three superior properties:  
  1. **Resistance to Spoilers**: Approval minimizes "vote-splitting." A fringe candidate drawing approvals only from one bloc rarely alters which front-runner wins.  
  2. **Broad Acceptability**: It elects the candidate with the widest support, not merely the most intense minority. In our cycle, all candidates would likely receive 66 approvals if voters approve their top two choices.  
  3. **Transparency**: The IIA trade-off is visible: outcomes may shift if candidates withdraw, but shifts reflect changes in the *absolute acceptability* of options, not arbitrary ranking manipulations.  

  ---

  ### VI. THE ONTOLOGY OF COLLECTIVE PREFERENCE  
  The cycle reveals no "pre-existing" collective preference; faculty preferences are irreducibly divided. Voting rules do not *discover* but *construct* a winner by aggregating judgments under specific ethical constraints. Approval Voting constructs this winner by maximizing the number of faculty who can accept the outcome—a defensible goal for a dean election.  

  ---

  ### VII. THE TWO-CANDIDATE CASE: MAY’S THEOREM  
  If the race narrows to two serious candidates, May’s Theorem guarantees that **majority rule** (with a tie-breaker) is the *only* method satisfying:  
  - **Anonymity** (all voters equal),  
  - **Neutrality** (all candidates equal),  
  - **Positive Responsiveness** (increased support for a candidate should not harm them).  
  Approval Voting reduces to majority rule in two-candidate races. For three candidates, no such guarantee exists—hence our focus on acceptability.  

  ---

  ### VIII. STRATEGIC CONSIDERATIONS  
  1. **Rule Selection Manipulability**: A committee with a known favorite *could* recommend a method favoring that candidate (e.g., advocating Plurality if their favorite leads in first-preference polls). We mitigate this by:  
     - Basing our decision on the observed cycle, not hypothetical preferences.  
     - Choosing Approval, which lacks the agenda-setting biases of ranked methods.  
  2. **Voter Strategy**: Approval incentivizes voters to approve all candidates they find acceptable. Withholding approval from a second choice risks electing a less-preferred candidate. This aligns with our goal of electing a broadly legitimate dean.  

  ---

  ### IX. CONCLUSION  
  We recommend Approval Voting because it:  
  - Escapes Arrow’s impossibility by using cardinal ballots.  
  - Elects the most broadly acceptable candidate, reducing polarizing outcomes.  
  - Minimizes strategic voting dilemmas and agenda-setting power.  
  - Provides a clear standard for tie-breaking.  

  The cyclic straw poll reflects genuine democratic disagreement, not defective preferences. Approval Voting constructs a winner by maximizing consent—a prudent aim for an institution valuing collegial governance. We urge the Senate to adopt this method for the Dean of Humanities election.  

  ---  
  *Approved by majority vote of the Ad-Hoc Committee on Voting Methods.*  
  *Signature: [Chair’s Name], Professor of Philosophy*
