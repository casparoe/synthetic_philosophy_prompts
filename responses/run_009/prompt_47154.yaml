prompt: |-
  I'm a PhD student in political theory, and I'm writing a dissertation chapter on the odd survival of hereditary monarchy inside some of the world's oldest democracies — the United Kingdom, Sweden, Norway, Japan. The pattern I want to think through is this: these polities vest legal authority in an office filled by hereditary succession, while their political cultures (and, in places, their constitutional texts) insist that legitimate authority derives from the people. Ministers govern in the monarch's name; courts render judgments in the monarch's name; soldiers and legislators swear allegiance to the monarch rather than to the constitution or the electorate; royal assent remains, in form, a condition of legislation even though refusing it is now unthinkable; and the office retains reserve powers that everyone agrees must never be exercised but that no one seems willing to abolish. What theory of political legitimacy, if any, does retaining these forms presuppose? Is the practice only consistent with a broadly symbolic or continuity-conception, on which the Crown stands for something deliberately non-electoral — history, unity, a state above partisan contest — or can consent-based and authorization-based theories of legitimacy accommodate hereditary forms after all? Please reconstruct the implicit theory, distinguish what the practice strictly presupposes from what it merely sits comfortably with, and identify where it is philosophically underdetermined — that is, which features (the oaths, the hereditary exclusion, the immunities, the reserve powers) could be licensed by several rival theories of legitimacy and which fit awkwardly with any story on which authority flows from the people. Finally, tell me what would actually have to change — in the oaths, the legal powers, the succession rules, the immunity from ordinary law — if a democracy decided to bring the office into line with the source-of-authority story it already tells about itself.
reasoning: |-
  Okay, the user is a PhD student in political theory working on hereditary monarchy in democracies. They need to unpack the implicit theory of legitimacy behind this. Let me start by understanding their main question: how do these systems reconcile hereditary monarchy with democratic principles of popular sovereignty?

  First, I recall the key examples: UK, Sweden, Norway, Japan. All have symbolic monarchies but emphasize that authority comes from the people. The user points out practices like oaths to the monarch, reserve powers, etc. Their main puzzle is the theoretical foundation here.

  The user wants to distinguish between what the practice strictly requires versus what it's compatible with. They also ask which elements are underdetermined and what changes would align the monarchy with popular sovereignty. 

  Breaking down the implicit theory: The Crown as a symbol of the state, continuity, and unity. This separates the state's permanence from the temporary government. The monarch embodies the state beyond partisan politics. But how does this fit with democratic legitimacy?

  Popular sovereignty is maintained through constitutional constraints. Monarchs act on ministerial advice, making their role ceremonial. So the real authority is with elected officials. But the symbols (oaths, etc.) still point to the Crown. This creates a dualism: de jure authority in the Crown, de facto in the people.

  Where does this dualism come from? Historical institutionalism—path dependence. Replacing the monarchy is costly, so it's kept as a useful symbol. The public accepts it due to tradition and perceived neutrality. 

  Now, which elements are essential? The symbolic role and constitutional constraints are necessary. The hereditary principle and reserve powers might be compatible with multiple theories but are relics. Oaths to the monarch are problematic for popular sovereignty but persist as tradition.

  The user also asks about changes needed to align with popular sovereignty. Abolishing oaths to the monarch, removing reserve powers, ending immunities, and changing succession rules. But these are politically challenging.

  Deep needs: The user might be exploring how institutions retain legitimacy through symbolism despite theoretical contradictions. They might also need arguments for why these systems persist, using concepts like path dependence and public acceptance. Identifying which elements must change versus which can remain symbolic is crucial for their dissertation.
answer: |-
  Here's a breakdown of the implicit theory of legitimacy underpinning constitutional monarchy in advanced democracies, addressing your specific analytical framework:

  **The Core Implicit Theory: Legitimacy through Symbolic Embodiment and Constrained Function**

  The practice presupposes a **dualistic theory of legitimacy** that rigorously *separates the symbolic source of ultimate authority from the operational source of political power*. This is not merely comfortable with popular sovereignty; it *depends* on it while reserving a distinct, non-electoral role for the Crown.

  1.  **The Crown as Embodied State Continuity & Unity (Non-Electoral Legitimacy):**
      *   **Strictly Presupposed:** The Crown represents the enduring State itself – transcending transient governments, partisan conflicts, and even the current electorate. Its legitimacy stems from:
          *   **Historical Continuity:** Symbolizing the unbroken existence of the polity.
          *   **National Unity:** Serving as a focal point above politics, representing the whole people/nation, not just the majority.
          *   **Impersonal Authority:** The "Crown" is an abstract concept of state authority; the monarch merely *incarnates* this office. Hereditary succession reinforces this impersonality (the office is filled by automatic rules, not personal choice) and continuity.
      *   **Source:** This is fundamentally non-electoral. It draws on Burkean notions of tradition, organic state development, and the state as a perpetual corporation.

  2.  **Operational Power via Popular Authorization (Democratic Legitimacy):**
      *   **Strictly Presupposed:** All *effective* governing power derives from popular authorization through democratic processes (elections, representative bodies). The monarch's legal powers are **entirely constrained** by constitutional convention and statute, exercised *only* on the advice of ministers responsible to the elected legislature.
      *   **Source:** This is pure popular sovereignty and representative democracy. The "Crown-in-Parliament" formula masks the reality that Parliament (elected) is sovereign, using the Crown's name as a formal vessel.

  **The Reconciliation Mechanism:** The Crown's *symbolic* legitimacy (continuity, unity) is *subordinated* to the *operational* legitimacy of democratic institutions. The monarchy persists *because* it is stripped of independent political power and serves a unifying symbolic function deemed valuable *by* the democratic polity. Its survival is an act of popular will expressed through constitutional inertia and lack of abolitionist pressure.

  **Philosophical Underdetermination & Points of Tension:**

  1.  **The Oaths of Allegiance:**
      *   **Underdetermined:** Could be interpreted as loyalty to the *embodied State/Crown-as-institution* (compatible with popular sovereignty) or loyalty to the *person* of the monarch (awkward).
      *   **Awkwardness:** Directly pledging allegiance to a hereditary individual *feels* antithetical to "authority flows from the people." It sits more comfortably with a "state-centric" or "organic continuity" theory than a pure consent/authorization model. The tension is mitigated by the understanding that the oath is ultimately to the constitutional order the monarch represents.

  2.  **Hereditary Exclusion:**
      *   **Underdetermined:** Compatible with:
          *   **Symbolic Continuity Theory:** Heredity ensures automatic, non-partisan succession, reinforcing the Crown's role as transcending politics.
          *   **Traditionalist Legitimacy:** Continuity itself confers legitimacy (Burke).
          *   *(Awkward with Consent/Authorization):* Directly contradicts the core democratic principle of equal access to office based on merit or election. Its justification relies *entirely* on its utility for the symbolic role, not inherent legitimacy.

  3.  **Legal Immunities (Sovereign Immunity/Crown Immunity):**
      *   **Underdetermined:** Compatible with:
          *   **State-Centric Theory:** The monarch *is* the personal embodiment of the state; suing the Crown is suing the state itself, requiring special procedures. Focuses on the *office*, not the person.
          *   **Functional Necessity (Historical):** Preventing the monarch from being embroiled in litigation that could destabilize the state.
          *   **Awkwardness:** Creates a privileged legal status based solely on birth, fundamentally at odds with equality before the law – a core democratic principle. Modern practice (e.g., Queen Elizabeth II paying income tax voluntarily) highlights the tension and attempts to mitigate it.

  4.  **Reserve Powers:**
      *   **Strictly Presupposed:** They *must* remain dormant conventions, not active discretionary powers. Their *sole* legitimacy derives from the universal understanding they will only be used in catastrophic constitutional breakdown to *preserve* democratic processes (e.g., refusing a PM's request for an election seen as undermining democracy itself).
      *   **Awkwardness:** The mere *existence* of unelected discretionary power is philosophically jarring for authorization theories. Their legitimacy rests entirely on extreme hypotheticals and the absolute certainty of non-use in normal politics. This is a pragmatic constitutional safety valve justified by extreme necessity, not democratic principle. It fits best with a "guardian of the constitution" role for the Crown-as-institution, but only in extremis.

  **What Must Change to Align with Pure Popular Sovereignty:**

  To bring the monarchy fully into line with a narrative where *all* authority flows *exclusively* from the people (eliminating the dualism), the following would be essential:

  1.  **Oaths of Allegiance:**
      *   **Change:** Replace all oaths (public officials, military, legislators) to allegiance to the Constitution, the Nation/People, or the democratic State. (e.g., Oaths to "Australia" or "the Constitution" in republics).

  2.  **Legal Powers & Royal Assent:**
      *   **Change:** Remove "Royal Assent" as a formal step. Replace it with automatic enactment upon passage by the legislature and signature by a state official (e.g., Speaker, President of the Republic, or a designated minister). Codify all remaining formal roles (appointing PM, ceremonial duties) as *mandatory* duties performed by a Head of State, removing any trace of discretion. Abolish reserve powers entirely or transfer any conceivable emergency function to elected bodies or courts.

  3.  **Succession Rules:**
      *   **Change:** Abolish hereditary succession. Replace it with either:
          *   Direct election (Presidential/Gubernatorial model).
          *   Indirect election by the legislature or an electoral college.
          *   Appointment by the elected government/legislature (often with fixed term and non-renewable). Crucially, the position must be *filled by a process involving popular will*, however indirect.

  4.  **Immunities:**
      *   **Change:** Abolish all personal legal immunities of the Head of State and their immediate family. Subject them fully to civil and criminal law like any other citizen. Maintain only functional immunities *while performing official acts* (similar to other high officials), subject to clear legal definition and potential parliamentary/judicial review. Separate the private person from the public office legally.

  **Conclusion:**

  The survival of hereditary monarchy in democracies relies on a sophisticated, albeit philosophically hybrid, theory. It *strictly presupposes* that popular sovereignty is the *sole* source of *operational governing power*. Simultaneously, it *strictly presupposes* that the Crown, as a hereditary institution, provides unique *symbolic legitimacy* (continuity, unity, transcendence) that complements and stabilizes the democratic order. This symbolic legitimacy is understood as *deriving its contemporary validity from the tacit or explicit acceptance of the democratic people*, not from divine right or inherent superiority.

  The elements most awkward for pure consent/authorization theories are **hereditary exclusion** (fundamentally anti-meritocratic/egalitarian) and **personal oaths of allegiance** (implying a personal source of authority). **Reserve powers** exist in a state of tolerated tension, justified only by extreme necessity and universal non-use. **Immunities** are increasingly seen as anachronistic and are often mitigated in practice.

  Achieving full alignment with a "source-of-authority flows exclusively from the people" narrative requires not just tinkering, but the fundamental transformation of the office into a republic (elected/appointed Head of State) or a purely appointed ceremonial figurehead stripped of all historical vestiges of sovereignty (oaths, immunities, reserve powers, hereditary principle). The persistence of monarchy suggests democracies value the symbolic functions enough to tolerate the philosophical inconsistencies, often viewing them as harmless historical residue rather than active threats to democratic legitimacy.
