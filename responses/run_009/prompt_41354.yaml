prompt: |-
  So I'm on my school's debate team and we got into this argument at lunch that's been bugging me all week. Someone brought up the Goldbach conjecture (every even number bigger than 2 is the sum of two primes, no one's proven it but it's been checked for a huge number of cases) and I said I'd happily take even odds betting it's true, like I'm 90% sure. A friend of mine who's really good at math shot me down with the line that "a math statement is either true or false — it's not 70% true, so it's meaningless to say you're 90% sure about it." Everyone nodded along like that settled it but it didn't sit right with me, because obviously SOME people are more confident than others about whether Goldbach is true, like someone who's checked way more cases or knows more number theory than me, and it seems weird to say that difference in confidence is meaningless. But when I pushed him he just repeated the slogan louder, and honestly I couldn't say exactly what claim he was even making.

  So that's what I want you to untangle. What are the actual distinct things someone could mean when they say you can't put a probability on a math fact? Like, is it just the trivial point that it's definitely true OR definitely false (which seems like it doesn't settle anything, since I could say the same about a coin flip that already happened but is hidden under my hand, and I'd still happily bet 50/50 on it)? Or is it a claim about what probability is FOR, like probabilities are only for physical randomness and not for this? Or maybe something about proofs, like the only legitimate way to believe a math statement is to prove it, so anything short of a proof is just not a rational belief at all? Or is it something about how you can't imagine a world where Goldbach is false, since it's true in every world if it's true in one?

  Can you lay out the different readings as a list, and for each one say whether it's obviously true but useless, or actually contentious, or just wrong? And crucially, tell me which of the readings (if any) would actually support dismissing my bet the way he did, because I suspect most of them don't. Also if you have thoughts on what the strongest version of his position is, I want to steelman it before I bring it back to him, since he's smug enough already without me attacking a weak version of what he said. FWIW I've never taken a stats class, we don't have one at my school, so go easy on notation but don't dumb it down either.
