prompt: |-
  longtime lurker of the rationalist blogosphere here (lesswrong since the old days, ssc comment threads, the whole ecosystem) and there's a pattern I keep bumping into that I've never seen cleanly named, so I'm asking here.

  the pattern: whenever two parties with genuinely different values have to share a decision, they almost always split the difference instead of randomizing over the extremes, even when the randomization looks better for everyone ex ante.

  concrete instances, because that's where I keep noticing it:

  - two friends deciding on a restaurant. they go to the middling place both feel lukewarm about rather than flipping a coin between the two favorites. if each of them genuinly prefers "50% chance of my favorite, 50% chance of yours" to "100% guaranteed mediocre" — and they almost always say they do, if you actually ask — then the compromise is dominated and they still pick it.
  - an org with a fixed budget torn between two causes. the default is a 50/50 split. but if impact per dollar has convex-ish returns, or even just ordinary diminishing returns where the second tranche does less good than the first, the split can be strictly worse than coin-flipping the whole pot at one of the two. I remember people arguing about this in the hits-based giving debate — one side said diversify because risk aversion, the other side said risk aversion about impartially-valued outcomes is straight up irrational, and as far as I can tell it never got resolved.
  - me internally. I'm maybe 60% consequentialist, 40% something deontish. the standard advice (moral parliament style setups, act on the mixture) means I'm a watered-down blend all the time. nobody ever suggests "flip a coin, commit to whichever side wins, for this decision." is that because it's a bad idea or because it feels bad?

  so really two questions. one: does the preference for averaging over lotteries have a name? I half remember a "compromise effect" from some psych context but I think that's about consumers picking the middle-priced option on a shelf, which is related in spirit but not the same thing at all. two: is the coin flip actually better, or is refusing it tracking something real? like, I know that in vNM-land any mixture over outcomes just IS a lottery, so the distinction I'm drawing technically shouldn't exist, and yet it keeps feeling like it does, and I can't tell wether that feeling is a bias to be corrected or a clue that something in the vNM setup (risk neutrality? who counts as the agent?) is doing work I'm not seeing.

  and to be clear I don't want just a term, I want the carving: what exactly is the phenomenon (choosing to average when lotteries are available), what is it NOT (ordinary pareto improvements, ordinary compromise), and where the edges are. if there's no established name, coin one and give me boundary cases.

  format please:

  1. "What I'm describing" — restate the phenomenon precisely in your own words, ~100 words, so I can check we're talking about the same thing.
  2. "The nearest established concepts" — ~300 words. cover the closest things in bargaining theory, decision theory, and the moral uncertainty literature, and for each say exactly where it misses.
  3. "Settled vs contested" — ~200 words. specifically I want to know which parts of this are just settled math (e.g. whether lotteries can pareto-dominate deterministic compromises) versus genuinely open (whether rational agents should be risk averse over moral outcomes, or over other people's outcomes, at all). don't present one side of the risk aversion dispute as the consensus, I've seen people do that and I don't trust it.
  4. "Your best carving" — ~150 words. either the established name plus boundary cases, or your coinage plus a definition and two or three edge cases that stress test it.

  one small thing: if you bring up specific papers or authors, flag how confident you are about the attribution — my memory for who-said-what in this area is clearly bad, and I'd rather know what's load-bearing.
reasoning: |-
  Hmm, the user is describing a pattern they've noticed where people consistently choose compromise solutions over random lotteries when making decisions involving conflicting values, even when the lottery appears better for everyone involved. They've given concrete examples like choosing restaurants, allocating budgets, and internal moral conflicts.

  I need to address their two main questions: first, if this preference for averaging over lotteries has a name, and second, whether the coin flip approach is actually superior or if the aversion to it reveals something important. They also want precise categorization of the phenomenon and its boundaries.

  For the phenomenon itself, I'll define it as the systematic avoidance of outcome randomization in favor of compromise solutions when joint decisions involve conflicting values, even when lotteries would Pareto-dominate from an ex ante perspective.

  As for established concepts, I should cover several areas:
  - Bargaining theory (like Nash bargaining solution) which typically involves compromise but doesn't consider lotteries
  - Moral uncertainty frameworks like moral parliament that average values rather than randomize
  - Risk aversion concepts that might explain aversion to lotteries
  - Ambiguity aversion which is different but related

  Regarding what's settled versus contested:
  - The math showing that lotteries can Pareto-dominate deterministic compromises is settled (due to convex preferences)
  - The appropriateness of applying risk aversion to moral outcomes is hotly contested
  - The psychological factors behind the preference for compromise are well-documented but debated

  For my best carving, I'll propose "compromise aversion to randomization" (CAR) as a term, emphasizing the systematic preference for averaging over lotteries despite potential Pareto inefficiency. Boundary cases would include situations with non-convex preferences or when randomization creates implementation costs.

  I'll make sure to flag confidence levels when mentioning specific concepts like Weymark's work on risk aversion in moral contexts. The user clearly wants to distinguish between mathematical certainty and philosophical disputes.
answer: |-
  Here's a precise breakdown addressing your query:

  ### 1. What I’m Describing  
  You observe a consistent preference for deterministic compromises (e.g., splitting differences, averaging values) over outcome-randomizing lotteries (e.g., coin flips) in joint decisions involving conflicting values. This persists even when:  
  - All parties *ex ante* prefer a fair lottery (e.g., 50% chance of each extreme) to the compromise.  
  - The lottery is Pareto-superior: everyone expects higher utility from it.  
  - The compromise is "dominated" (strictly worse for all). Core tension: vNM rationality says mixtures *are* lotteries, yet people treat deterministic compromises as fundamentally different from—and preferable to—probabilistic ones.  

  ### 2. Nearest Established Concepts  
  - **Nash Bargaining Solution** (bargaining theory): Maximizes product of utilities post-disagreement point. *Misses:* Nash assumes convex feasible sets but doesn't inherently favor deterministic splits *over* lotteries; it often prescribes lotteries when efficient. Your cases involve rejecting efficient lotteries for inefficient compromises.  
  - **Moral Uncertainty Frameworks** (e.g., MacAskill’s "maximize expected choice-worthiness"): Averages moral weights across theories. *Misses:* Explicitly avoids randomization ("maximizes expectation," not "samples from theories"), viewing it as irrational under moral uncertainty. Doesn’t address *why* randomization feels worse than averaging.  
  - **Risk Aversion over Values** (decision theory): If parties are risk-averse over *others'* utilities or moral outcomes, compromises feel safer. *Misses:* Standard risk aversion applies to personal welfare, not others'. Whether rational agents *should* be risk-averse over impartial goods (e.g., charity impact) is disputed (see §3).  
  - **Ambiguity Aversion**: Preferring known probabilities (coin flips) over unknown ones. *Misses:* Your cases involve clear probabilities—rejecting them for certain mediocrity.  

  ### 3. Settled vs. Contested  
  - **Settled Math:**  
    - If preferences are convex (diminishing marginal returns), lotteries *can* Pareto-dominate deterministic splits. E.g., in your charity case: if returns diminish, flipping for one cause has higher expected impact than splitting (by Jensen’s inequality).  
    - vNM axioms imply that if both prefer lottery L to compromise C, choosing C violates rationality *unless* new arguments enter (e.g., transaction costs).  
  - **Contested:**  
    - **Risk Aversion in Impartial Contexts**: Is it irrational to be risk-averse over others' welfare (e.g., charity impact)? "Yes" say utilitarians (e.g., Beckstead 2013); "No" say pluralists (e.g., Weymark 1991). *Confidence:* High that this is unresolved.  
    - **Moral Uncertainty**: Should randomization resolve conflicting duties? Deontologists (e.g., Rossian frameworks) often reject it as incoherent; consequentialists accept it.  
    - **Psychological Bias**: The compromise preference may stem from loss aversion (mediocrity feels like no loss, losing a coin flip feels like a loss) or harmony-seeking (deterministic splits avoid post-lottery resentment).  

  ### 4. Best Carving: "Compromise Aversion to Randomization" (CAR)  
  - **Definition**: *The systematic, often inefficient, rejection of outcome-randomizing lotteries in favor of deterministic compromises during joint decisions under value conflict, despite ex ante Pareto dominance of the lottery.*  
  - **Boundary Cases**:  
    - **Edge 1 (Non-Convexity)**: If returns are concave (e.g., fixed costs), splitting *beats* lotteries. CAR only applies when convexity makes lotteries dominant.  
    - **Edge 2 (Repeated Games)**: In ongoing interactions (e.g., weekly dinners), compromise ensures long-term fairness. Randomization risks perceived exploitation.  
    - **Edge 3 (Moral "Costs")**: If flipping feels like abdicating moral responsibility (e.g., "I *chose* the bad outcome"), CAR persists even with dominance.  
  - **Why Coin?** No clean existing term. "Compromise effect" (psychology) describes choosing middle *options*, not rejecting lotteries. CAR isolates the *mechanism* (averaging vs. randomizing) over the outcome.  

  **Attributions**:  
  - High confidence: Nash (1950), MacAskill (2014 moral uncertainty), Jensen's inequality.  
  - Medium confidence: Weymark (1991, risk aversion critique); Beckstead (2013, hits-based charity).  
  - Low confidence: Rossian deontology's rejection of randomization—inferred from critiques of consequentialism.  

  This carving clarifies CAR as a *procedural* bias distinct from outcome-focused compromise, rooted in psychological and normative tensions around randomness, with efficiency consequences when convexity holds.
