  - (2) and (3) feel similarly manipulative but paltering might be slightly "better" because it doesn't exploit inference as actively. 
  - (4) is tricky—nodding to "like usual?" feels almost as bad as lying since it confirms a false assumption. 
  - (5) seems least bad because it involves no affirmative act, just avoidance. 

  The fractions should reflect active manipulation versus passive allowance of error. Also worth considering: does the listener's complicity in jumping to conclusions affect moral weight? For instance, (4) and (5) rely heavily on their assumptions. 

  ...After reflection, I'll score based on intentionality and affirmative deception. Pure omission gets lowest "badness" because it's not affirmatively false, while nodding to a false assumption is nearly equivalent to lying. Paltering and implicature sit in the middle—both crafty but not direct falsehoods. 

  User's probably expecting academic rigor but also practical talk utility. No fluff—just the rankings with tight reasoning per item. Better avoid philosophical tangents unless they directly explain the fraction.
answer: |-
  Here are your five rated modes, based on the degree of active deception involved relative to a direct lie:

  1.  **1.0 (flat lie):** Directly asserting a known falsehood is the paradigmatic violation of truthfulness, setting the maximum "badness" baseline for intentional deception.
  2.  **0.8 (paltering):** Selectively volunteering true facts to create a false impression requires active construction of a misleading narrative, exploiting partial truth almost as severely as a lie.
  3.  **0.9 (implicature):** Crafting a literally true statement to knowingly induce a false inference via conversational norms is highly deceptive; the intent and expected outcome are identical to a lie, differing only in syntactic form.
  4.  **0.95 (standing assumption):** Affirmatively nodding to a false presupposition ("like usual?") is minimally distinct from a direct lie; it actively confirms the false belief rather than merely allowing it.
  5.  **0.5 (pure omission):** While knowingly allowing a false belief to persist by deflecting the question exploits the listener's assumption, it lacks the *affirmative* assertion of falsehood present in other modes, making it less directly deceptive.
