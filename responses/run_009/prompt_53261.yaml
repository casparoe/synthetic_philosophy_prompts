  (2) paltering involves selective truth-telling—technically honest but manipulative. 
  (3) implicature exploits conversational norms to mislead while being literally truthful. 
  (4) leverages the victim's assumptions through passive agreement. 
  (5) pure omission is the most passive—avoiding the question entirely. 

  The challenge is assigning fractional "badness" while keeping outcomes identical. Kant would say all are equally wrong since they all involve intending false belief, but the user wants gradations. 

  I notice they're a sharp thinker—they've anticipated the "all same score" objection and want it addressed per item. Their phrasing suggests they might lean toward gradations themselves. The request for no intro/conclusion means they want crisp, actionable content for slides. 

  For scoring: 
