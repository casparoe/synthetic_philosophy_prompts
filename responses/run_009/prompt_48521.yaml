prompt: |-
  hey, i'm a phd student in political theory and i volunteer with this group that runs civic-ed workshops for first-year undergrads (mostly not phil majors). every year we do a session on basically "should everyone's vote count the same" and it always devolves into people just yelling their priors. so this year i want to hand out a sorting quiz, like "which theory of political authority do you *actually* hold?", buzzfeed format but serious under the hood.

  the positions i want as outcomes: estlund-style epistemic proceduralism (democratic procedures have real epistemic value but the authority comes from qualified acceptability / fairness, not raw accuracy), brennan-style epistocracy of the knowledgeable, rights-based pure proceduralism in the waldron neighborhood, and lottocracy/demarchy (the burnheim / van reybrouck lineage, where selection by lot rather than elections is the fix). if some answer pattern really maps to something else — mill's plural voting, or an unnamed combo — fine, name it or say it's unnamed.

  the part i need actual help with is the diagnostic questions. i don't want anything that gives the game away. no "do you think ignorant voters should be allowed to vote" — everyone either says no or feels gross saying yes, and it sorts by label instead of by belief. i want concrete cases where the four views genuinely come apart. some i've been drafting, feel free to improve or replace:

  - a referendum where 60% of voters believe a straightforwardly false factual claim about the policy's effects (every study says it does X, they're sure it does Y), and it fails because of that. is anything wrong with that outcome *beyond* the disappointed preferences of the losing side?
  - imagine a political-knowledge test that is fair and valid, but it happens to screen out a much higher share of one ethnic group, not by design, just correlation. does your answer change if the correlation is small vs large?
  - an oracle tells you the full electorate picks the "right" answer 51% of the time and a council of the well-informed picks it 70% of the time. does that gap justify the council? does the same argument justify a benevolent dictator at 90%? (this is supposed to be the estlund stopper, i want it in the quiz somewhere, probably not phrased as an oracle though, up to you)
  - a citizens' assembly chosen by lot gets a policy right that the elected parliament botched. what, if anything, does that single data point tell you about which institution *should* have decided?

  requirements: 8-10 questions total, each one a case with 2-3 plain-language answer options (no jargon — audience is 19 year olds), then a scoring key mapping answer patterns onto the four positions plus whatever stragglers. the questions themselves have to be answerable by someone who's never heard of any of the names; the key can name names since they get a handout afterwards.

  two specific things i want flagged rather than papered over: (1) if two of the views answer every one of my cases identically — i suspect waldron and the estlundians might, unless one of you can find a case that splits them — say so and either merge them or add a question that actually seperates them, if such a question exists; (2) note any answer pattern that corresponds to a real but basically unoccupied position, and say whether you think it's unoccupied because it's incoherent or just because nobody's bothered defending it lately. i'd rather the quiz honestly say "your views are weird and historically homeless" than shove everyone into a bucket.
reasoning: |-
  Okay, let me approach this systematically. The user is a PhD student in political theory designing a sorting quiz for undergrad civic workshops. The core challenge is creating concrete scenarios that subtly distinguish between four complex theories of political authority without triggering partisan reflexes.

  Hmm, the user has already identified key pitfalls: avoiding loaded questions like "should ignorant people vote?" which force defensive answers. Instead, they want cases where philosophical differences manifest organically. I notice they've drafted some scenarios but seek refinement - particularly wanting to:
  1) Verify if Waldron-style proceduralism and Estlund's epistemic proceduralism can be distinguished
  2) Identify any "homeless" theoretical positions
  3) Ensure each question has plain-language options

  *scratches head* The trickiest part is question design. Take the referendum example: instead of asking directly about voter competence, framing it as "is anything wrong beyond disappointed preferences?" forces engagement with outcome legitimacy. Smart. For the knowledge test scenario, varying the correlation size could reveal whether someone prioritizes statistical fairness (Estlund) versus absolute equal voice (Waldron).

  *checks notes* Ah! The oracle question is crucial for the Estlund-Brennan split. But "oracle" feels mystical - maybe reframe as "independent researchers predict..."? And for the citizens' assembly case, I should emphasize it's a single instance to test whether they infer systemic superiority from anecdote (lottocracy) or see it as fluke (proceduralists).

  *realizes* Wait - do Waldron and Estlund actually diverge? *flips through mental archives* Waldron rejects outcome-based legitimacy entirely while Estlund demands minimal epistemic adequacy. So perhaps a scenario where procedures are fair but persistently produce disastrous outcomes? Like: "After five consecutive policy disasters from elected bodies, does this undermine their authority?" Waldron would say no (if procedures intact), Estlund might hesitate.

  For scoring: any "yes to epistocracy but no to dictatorship" pattern likely indicates Brennan, while "yes to both" might be Mill or incoherent. Perfect chance to flag "your view resembles Mill's plural voting but no major theorist holds it today because..." - satisfying the user's request for intellectual honesty about orphan positions.

  *double-checks* Must avoid jargon like "epistemic" in options. Instead: "reliability" or "good decisions". And keep each case under 100 words. The ethnic correlation question needs particularly careful phrasing to avoid appearing racially charged - maybe specify "demographic group" and emphasize the test's objective fairness.

  Finally, the mapping key should explicitly note where theories overlap (e.g., Waldron/Estlund both reject epistocracy) and where answers don't fit (e.g., approving dictatorship + sortition might indicate theoretical confusion). User will appreciate that transparency.
answer: |-
  Here’s a streamlined, classroom-ready quiz with 9 diagnostic questions designed to subtly distinguish your four target theories. Each case avoids triggering partisan priors and forces engagement with the *underlying logic* of political authority. The scoring key flags overlaps and "homeless" positions.

  ---

  ### **Quiz: What’s Your Democracy Instinct?**
  *Answer honestly—no jargon, just your gut reaction to these scenarios.*

  1. **"The Bridge Repair"**  
     A city votes on whether to fund emergency bridge repairs. 60% oppose it because they falsely believe the bridges are safe (ignoring engineers’ reports). The repairs fail. **Is the problem here:**  
     A) *Only that the pro-repair minority didn’t get their way?*  
     B) *That the vote ignored critical facts, so the outcome is flawed?*  
     C) *Neither—the vote was fair, so the outcome stands.*  

  2. **"The Unintentional Test"**  
     A voter knowledge test (e.g., identifying key officeholders/policies) is proven unbiased, but due to education gaps, it screens out 40% of Group X. **Should this test be used?**  
     A) *Yes—if it fairly measures knowledge, it’s valid.*  
     B) *No—it excludes a group unfairly, even if unintended.*  
     C) *Only if the screening gap is very small (<10%).*  

  3. **"The Reliable Panel"**  
     Research shows: on complex issues, voters get the "best" decision 51% of the time. A panel of highly informed citizens gets it right 70% of the time. **Should this panel decide instead?**  
     A) *Yes—they’re clearly better.*  
     B) *Only if everyone agrees the panel is fairly chosen.*  
     C) *No—voters have the right to decide, even if imperfect.*  

  4. **"The Perfect Dictator"**  
     Imagine a benevolent dictator *proven* to make ideal decisions 90% of the time. **Should they rule?**  
     A) *Yes—better outcomes justify it.*  
     B) *No—people have a right to self-rule regardless.*  
     C) *Only if citizens consent to it.*  

  5. **"The Citizens’ Assembly Win"**  
     A randomly selected citizens' group (after study) backs policy Y. Elected politicians rejected Y, but Y later succeeds where the politicians’ choice failed. **Does this prove random groups *should* decide?**  
     A) *Yes—they clearly make wiser choices.*  
     B) *No—one success doesn’t outweigh fair elections.*  
     C) *It shows we should use both systems, not one alone.*  

  6. **"The Persistent Error"**  
     Voters in a region *consistently* support policies that harm their own economy (e.g., rejecting trade deals experts say would help). **Is this a problem for democracy?**  
     A) *Yes—if voters keep making harmful errors, the system is broken.*  
     B) *No—voters have the right to make their own choices, right or wrong.*  
     C) *It’s a problem, but fixing it shouldn’t exclude voters.*  

  7. **"The Emergency Bypass"**  
     During a crisis, elected leaders suspend voting and let experts make urgent decisions. **Is this acceptable?**  
     A) *Yes—experts handle emergencies best.*  
     B) *Only if voters re-approve the decisions later.*  
     C) *No—authority always rests with voters.*  

  8. **"The Unpopular Truth"**  
     A policy is proven to benefit everyone long-term, but 70% hate it due to short-term costs. **Should leaders enact it against majority will?**  
     A) *Yes—sometimes leaders must do what’s right, not popular.*  
     B) *No—unless voters approve it eventually.*  
     C) *Never—the majority’s will is final.*  

  9. **"The Lottery Legislature"**  
     A country replaces its elected Congress with randomly selected citizens (with training/advisors). **Is this legitimate?**  
     A) *Yes—it’s fairer and wiser than elections.*  
     B) *Only if voters approve the system first.*  
     C) *No—elections are the only way to authorize rule.*  

  ---

  ### **Scoring Key & Theory Mapping**
  *(Match your majority answers to the categories below)*

  | **Answer Pattern**                     | **Your Theory**                                                                 | **Notes**                                                                 |
  |----------------------------------------|---------------------------------------------------------------------------------|---------------------------------------------------------------------------|
  | **Mostly A**                           | **Epistocracy (Brennan-esque)**                                                 | Trusts knowledge over participation. May support voting tests/weighting. |
  | **Mostly B**                           | **Epistemic Proceduralism (Estlund-esque)**                                     | Values both fairness *and* competence; requires "qualified acceptability." |
  | **Mostly C**                           | **Rights-Based Proceduralism (Waldron-esque)**                                  | Authority comes from equal voice; outcomes irrelevant to legitimacy.      |
  | **Mix of A + C**                       | **Lottocracy/Demarchy (Burnheim/Van Reybrouck)**                                | Skeptical of elections; trusts random groups for impartiality/wisdom.    |
  | **A on Q3/Q4 + B elsewhere**           | **Epistemic Proceduralism** (← Estlund’s "benevolent dictator stopper" in action) |                                                                           |
  | **Consistent A *except* on Q4 (B/C)**  | **Plural Voting (Mill-esque)**                                                  | "Homeless" position: Supports weighting votes but rejects autocracy.     |
  | **A on Q4 ("Yes" to dictator)**        | **Incoherent/Unstable**                                                         | If you reject epistocracy but accept dictatorship, your view is inconsistent. |

  ---

  ### **Design Notes & Why This Works**
  1. **Key Splits Achieved:**  
     - **Waldron (C) vs. Estlund (B):** Q1, Q6, and Q8 force the divide. Waldron sees *no moral problem* with factually wrong outcomes if procedures are fair (C). Estlund requires *minimal epistemic competence* (B).  
     - **Estlund (B) vs. Brennan (A):** Q3 and Q4 are decisive. Estlund rejects even superior knowledge if it lacks equal respect (B answers). Brennan prioritizes results (A).  
     - **Lottocracy (A+C):** Q5 and Q9 isolate trust in random selection over elections. Q2C/Q7B may appear.  

  2. **"Homeless" Positions Flagged:**  
     - **Mill’s Plural Voting:** A on Q2/Q3/Q6 + C on Q4/Q8. It’s a *coherent* but rarely defended modern position.  
     - **Dictator Approval (A on Q4):** Paired with proceduralist answers elsewhere, this is *incoherent* (scoring key calls it out).  

  3. **Stealth Diagnostics:**  
     - Q1 tests if factual errors delegitimize outcomes (splits epistemic vs. pure proceduralists).  
     - Q4 is the Estlund stopper (no theorist accepts the dictator).  
     - Q7 (Emergency Bypass) reveals if equality rights are absolute (Waldron: C) or contextually flexible (Estlund: B).  

  4. **Avoids Trigger Language:**  
     No "ignorant voters," "should votes count equal," or loaded policy examples. Cases use bridges, emergencies, and abstract policies.  

  **Handout Tip:** Pair results with a 1-pager defining each theory in plain terms (e.g., "Epistemic Proceduralism: Democracy is legitimate because it’s *fair* and *good enough* at making smart decisions"). Use the quiz cases as examples!
