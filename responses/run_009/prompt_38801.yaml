answer: |-
  Your question cuts to the heart of labor law's philosophical and practical contradictions. The global patchwork of rules reflects competing theories of consent, freedom, and the nature of the employment relationship. Let's reconstruct the implicit theory and test its coherence.

  **The Core Tension: Consent vs. Structural Coercion**
  All labor systems grapple with this paradox: Employment is formally a voluntary contract, but economic necessity creates a power imbalance that undermines true voluntariness. The differences arise in *how much* weight each system gives to this imbalance.

  **Deconstructing the Implicit Theory of Legitimate Consent:**
  A coherent theory would likely rest on these principles:

  1.  **Non-Alienability of Fundamental Autonomy:** You cannot permanently surrender your core human agency or freedom of exit. This explains why indentured servitude is void everywhere. Your capacity to *revoke* consent is inalienable.
  2.  **Protection from Irreversible Harm:** Consent is invalid for things that cause severe, irreversible damage to your physical/mental health or human dignity (e.g., karoshi-level overwork, unsafe conditions). Society has an interest in preventing such harms, even if "consented" to under duress.
  3.  **Mitigation of Structural Coercion:** Consent is only meaningful if alternatives exist. Where systemic power imbalances (employer vs. individual worker, economic necessity) make refusal practically impossible, state intervention can "level the playing field" to make consent more genuine.
  4.  **Thresholds of Vulnerability:** The degree of protection needed varies. Low-wage workers are seen as more vulnerable to coercion than high-paid professionals. Work deemed essential for basic survival warrants more protection than work tied to career ambition or high compensation.
  5.  **Time as a Limited, Non-Renewable Resource:** While skills and labor can be sold, time itself is fundamentally non-alienable in its totality. You can sell *chunks* of your finite time, but systems must prevent the sale from consuming *all* time needed for rest, health, family, and citizenship.

  **Testing the Rules Against the Theory:**

  1.  **US Computer Professional Exemption:**
      *   **Presupposition:** High salary and specialized skills create sufficient bargaining power. Your consent to unlimited hours is *genuine* because you have alternatives and are compensated well enough to offset the loss of leisure. The "threshold of vulnerability" is crossed.
      *   **Theory Critique:** Flawed. Power imbalance persists even for well-paid workers. Fear of job loss, career stagnation, or cultural pressure ("hustle culture") can coerce "consent." High pay doesn't negate irreversible health risks from chronic overwork. Fails principle #2. The "vulnerability threshold" is arbitrary and often outdated (salaries haven't kept pace with tech COL in many areas).

  2.  **US Prohibition of Indentured Servitude:**
      *   **Presupposition:** Permanent surrender of exit freedom is an unacceptable alienation of core autonomy (Principle #1). It creates a master/servant relationship incompatible with free citizenship.
      *   **Theory Support:** Strongly aligns with Principle #1. Revocability is fundamental.

  3.  **French 35-Hour Week & Right to Disconnect:**
      *   **Presupposition:** Without firm boundaries, employer power will inevitably erode workers' personal time and health ("structural coercion" - Principle #3). True consent to constant availability is impossible in an always-on culture. Leisure time is a social good.
      *   **Theory Support:** Strongly aligns with Principles #2 (preventing harm), #3 (mitigating coercion), and #5 (protecting finite time). Assumes the vulnerability threshold requires protection for most/all workers.

  4.  **Japanese Karoshi (Compensation but not Prevention):**
      *   **Presupposition:** Extreme overtime is *sometimes* consented to due to intense cultural/employer pressure, but the *consequence* (death) is so severe the employer must compensate (Principle #2). However, the economic/cultural value placed on extreme dedication limits prevention.
      *   **Theory Critique:** Inconsistent. Acknowledges Principle #2 (irreversible harm) but fails on Principle #3 (mitigating the coercion that leads to the harm) and #5 (protecting time/health). It's a reactive, not preventive, application of the theory.

  **The Inconsistencies and the Role of History/Lobbying:**
  The theory *can* explain the broad strokes (no slavery, some protection for the vulnerable, prevention of death), but the *specifics* are riddled with historical accidents and lobbying:

  *   **The US Exemption:** Heavily influenced by industry lobbying (especially tech/finance) framing high-paid professionals as "partners" needing "flexibility," not laborers needing protection. The specific salary threshold is often outdated due to political gridlock.
  *   **35-Hours in France:** A political compromise achieved during a specific economic/social context (late 90s), reflecting strong union power and a particular view of work-life balance as a societal good.
  *   **Karoshi Compensation:** Reflects Japan's cultural emphasis on corporate responsibility and harmony, but reluctance to fundamentally challenge the expectation of extreme dedication rooted in post-war economic practices.

  **Reconstructing a Coherent Theory & Which Rule Changes First:**
  A truly principled application of the theory above would likely prioritize:

  1.  **Universal Protection from Irreversible Harm:** Regardless of salary or status, legal maximum *practical* working hours (e.g., 48-50 hours/week averaged) backed by strong enforcement to prevent karoshi-level outcomes (Principle #2). Health is non-negotiable.
  2.  **Meaningful Right to Disconnect:** Codifying the separation of work and personal time for all workers, enforceable against employer pressure (Principles #3 & #5). This respects time as a finite resource.
  3.  **Reforming Exemptions:** High salary alone is insufficient proof of non-vulnerability. Exempt status should require either:
      *   Genuine, provable autonomy over schedule *and* tasks (like a true executive), OR
      *   A very high salary threshold (significantly above current US levels, indexed to inflation) *combined* with a formal, optional, time-limited "exemption agreement" that workers can revoke with notice without penalty (better aligning with Principles #1 & #3).
  4.  **Strengthening Exit Freedom:** Reinforcing the unenforceability of non-compete clauses for most workers and ensuring unemployment benefits aren't denied for refusing unsafe or exploitative overtime (Principle #1).

  **Which Rule Would Change First Under a Serious Application of the Theory?**
  The **US Computer Professional Exemption** is the most logically vulnerable. It relies most heavily on the demonstrably shaky premise that high pay = genuine consent and sufficient protection from harm. A theory prioritizing non-alienability of health and mitigating structural coercion would demand its reform or significant qualification *first*, likely by:

  *   **Introducing an absolute hourly cap** for *all* workers (e.g., 50-55 hours/week), even if exempt.
  *   **Dramatically raising the salary threshold** for exemption and indexing it rigorously.
  *   **Adding a "duties test" focused on actual autonomy** (not just job title).
  *   **Creating an "opt-in" mechanism** for exempt status above the threshold/cap, revocable by the employee.

  **Conclusion:**
  The bundle presupposes that consent in employment is always constrained by power imbalances, but the *degree* to which the state intervenes to correct this imbalance varies wildly based on cultural values, historical power struggles, and lobbying. A truly principled theory emphasizes that you cannot sell your health, your fundamental freedom of exit, or your *entire* capacity for a life outside work. It recognizes that "voluntary" overtime is often coerced by economic necessity, cultural pressure, or fear. While the French model leans too heavily towards state paternalism for some tastes, and the Japanese model reacts tragically late, the US exemption rule most clearly violates the core principle that genuine consent cannot exist under conditions that risk irreversible harm or effectively negate personal autonomy through exhaustion, regardless of paycheck size. Fixing that exemption would be the logical first step towards a more coherent system.
