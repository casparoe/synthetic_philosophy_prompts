  Applying this, the US exempt status should be reformed because the power imbalance still exists despite high salaries. France's model protects health but might need flexibility. Japan's accountability is good but prevention is better. The first change would be rethinking the US exemption, maybe by adding safeguards like maximum hours or salary thresholds adjusted for inflation.

