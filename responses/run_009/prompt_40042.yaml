  First, I need to identify the key philosophical divides in the "artifacts have politics" debate. The main positions to cover include:
  - Strong determinism (Ellul)
  - Winner's intrinsic politics view
  - Liberal instrumentalism
  - Social constructivism (SCOT)
  - Critical theory (Feenberg)

  The tree should start with a universally acceptable premise: "Technologies shape social life in politically significant ways." Then branch through 6-8 nodes using concrete historical/contemporary cases that force meaningful choices. 

  For branching questions, I'm considering:
  1. Whether politics can be intrinsic to artifacts (using Moses bridges case)
  2. The role of designer intention (nuclear plant example)
  3. Interpretive flexibility (barbed wire repurposing)
  4. Social possibility constraints (spam filter thresholds)
  5. Unit of analysis (artifact vs system)

  I'll discard questions about technological momentum or non-human agency since they might derail the workshop into metaphysical debates rather than focusing on political dimensions. The cases should stay grounded in human-social impacts.

  The terminal leaves need to map clearly to named positions while flagging any unexplored combinations. For example, I should note if the tree can't cleanly separate Feenberg from sophisticated Winner - perhaps adding a question about democratizing potential could help distinguish them.

  Each node must be phrased as a forced-choice question based on cases, avoiding theoretical terminology. The spam filter case works well for contemporary relevance while the barbed wire example demonstrates contingency.

  For the handout format, I'll keep it to two pages with a clear traversal guide. Participants should be able to follow their choices to a leaf position while understanding why certain combinations are logically untenable (e.g., believing in intrinsic politics while denying all constraints on social arrangements).
answer: |-
  Here's a decision tree designed for your workshop, built from logical splits using concrete cases before mapping to named positions. It prioritizes forcing substantive commitments over easy labels.

  **Shared Starting Commitment:**  
  *"The design and deployment of technologies shape social life in ways that are politically significant."*  
  *(Everyone starts here. The tree explores HOW and WHY this happens.)*

  **Tree Structure & Diagnostic Cases:**

  1.  **The Moses Bridge Case:** Robert Moses’ low parkway overpasses (designed circa 1930s) physically prevented buses (carrying poorer, largely Black residents) from accessing Jones Beach. Is the *exclusionary effect* primarily...
      *   **(A) Intrinsic to the design itself?** (Its height, function as a barrier to large vehicles, given the context of car ownership disparities). *Go to Q2.*
      *   **(B) A result of how it was deployed/used?** (Moses's racist intentions, societal segregation, lack of countervailing policies). *Go to Q3.*

  2.  **Nuclear Power Plant Authority:** Does the technology of a large-scale nuclear reactor *demand* centralized, hierarchical, quasi-military authority structures for safe operation, *regardless* of the initial intentions of its designers or the political system it's built within?
      *   **(Yes):** The core technical requirements (safety protocols, fuel control, emergency response) necessitate such structures. *Go to Q4.*
      *   **(No):** Different organizational forms *could* manage it safely with sufficient redesign of both tech and procedures; the "necessity" reflects current social choices, not inherent tech constraints. *Go to Q5.*

  3.  **Barbed Wire Repurposing:** Barbed wire was invented for livestock control but became instrumental in warfare trenches, concentration camps, and enforcing colonial borders. Does this radical repurposing mean...
      *   **(A) Its original "politics" were weak/irrelevant?** The artifact's significant political effects are primarily determined *by users* in different contexts. *Go to Q6.*
      *   **(B) Its core affordances (cheap, durable, painful barrier) inherently lent themselves to coercive/disciplinary uses?** While specific uses varied, its fundamental design had political *potential* baked in. *Go to Q5.**

  4.  **Algorithmic Thresholds & Impossibility:** Consider a hiring algorithm filtering resumes based on keyword thresholds set by the vendor. Could slightly adjusting these thresholds easily create a *qualitatively different* social outcome (e.g., significantly increasing diversity without sacrificing core "quality")?
      *   **(Yes):** The constraints are flexible; different choices are readily available within the system. *Go to Q7.*
      *   **(No):** Achieving the desired outcome (e.g., diversity AND current quality metrics) within the *current technical framework* is effectively impossible without fundamental redesign or abandoning key system goals. *Go to Leaf: Strong/Autonomous Tech.*

  5.  **Contingency vs. Affordance:** Does the existence of significant historical contingency and interpretive flexibility in a technology's development (like Barbed Wire's journey)...
      *   **(A) Undermine claims that politics reside *in* the artifact?** Politics only emerge when flexibility is closed by social actors. *Go to Q6.*
      *   **(B) Coexist with the idea that artifacts have inherent affordances/biases?** Contingency shapes *which* potentials are realized, but the potentials stem from the artifact's material/functional nature within human societies. *Go to Q7.*

  6.  **The "Right" Unit of Politics:** When analyzing the political impact of something like the Moses bridges or a facial recognition system, is the most crucial unit for understanding politics...
      *   **(A) The specific artifact/design feature itself?** (e.g., the bridge height, the algorithm's code). *Go to Leaf: Liberal Instrumentalism (Sophisticated).*
      *   **(B) The broader sociotechnical system?** (e.g., transportation policy + car culture + bridge; data sources + algorithm + deployment context + oversight). *Go to Leaf: Social Constructivism (SCOT).*
      *   **(C) The design *process* and who controls it?** (e.g., Moses's power, lack of public input in algorithm design). *Go to Leaf: Critical Theory.*

  7.  **Redesign & Democratization:** Can the fundamental political biases or effects of a contested technology *always* be significantly altered through democratic redesign processes that change its technical code (e.g., making nuclear plants inherently safer for decentralized control, re-engineering hiring algorithms for equity, adding bus lanes to parkways)?
      *   **(Yes):** Technical systems are malleable; politics is fought out *in* design. *Go to Leaf: Critical Theory.*
      *   **(No):** Some core technical imperatives or embedded biases resist democratic reshaping or inherently favor certain power structures. *Go to Q4.** *If coming from Q5B, this path is also consistent with Winner.*

  **Terminal Leaves (Positions):**

  *   **Strong/Autonomous Tech (e.g., Ellul):** Path: 1A -> 2Yes -> 4No. Believes technologies develop an inherent, internal logic ("la technique”) that becomes autonomous and imposes its imperatives (efficiency, control, hierarchy) on society, regardless of human intentions. Politics is dictated by the technological system's needs. *(Unexplored/Unattractive? A path combining 1B with 4No is logically possible but rare: tech isn't designed politically but still makes alternatives impossible - perhaps "unintended technological lock-in")*
  *   **Winner's Position (Intrinsic Politics):** Path: 1A -> 2Yes -> 4Yes OR 1A -> 2No -> 5B -> 7No OR 1A -> 2No -> 5B -> 4No. Believes artifacts *can* have politics inherent in their design, meaning they require or are strongly compatible with specific social/power structures (authoritarianism for nukes, exclusion for Moses bridges) or embody specific forms of order/authority. Contingency exists (Q5B), but the artifact's properties are causally significant and constrain possibilities (Q4Yes/No). Design matters crucially.
  *   **Liberal Instrumentalism (Sophisticated):** Path: 1B -> 3A -> 6A. Believes technologies are essentially neutral tools. Their political effects stem entirely from the *intentions of designers* and the *choices of users* in specific contexts. The artifact itself is just an instrument. Repurposing (barbed wire) proves neutrality. The artifact is the key unit because it's the tool being wielded.
  *   **Social Constructivism (SCOT - e.g., Pinch & Bijker):** Path: 1B -> 3A -> 6B OR 1B -> 3B -> 5A -> 6B. Politics resides *only* in the social processes surrounding technology: interpretations by different groups, closure of debates, power struggles in development and implementation. The artifact itself is socially shaped and acquires meaning through use. The sociotechnical system (or relevant social groups) is the essential unit. Interpretive flexibility is key (3A, 5A). Contingency dominates (5A).
  *   **Critical Theory (e.g., Feenberg):** Path: 1B -> 3B -> 5B -> 7Yes OR 1A -> 2No -> 5B -> 7Yes. Focuses on the *design process* as the locus of political struggle. Technologies embed biases from dominant interests, but these are not inevitable. Through democratic intervention in the *technical code* itself (redesign), technologies can be reconfigured for different, more emancipatory values and social relations. Contingency and affordances matter (5B), but radical democratic redesign is possible (7Yes). The design process is key (6C). *(Distinguishing Feenberg from Winner: The critical split is Q7 (Redesign & Democratization). Winner is more pessimistic about overcoming inherent constraints (7No), Feenberg is optimistic (7Yes). A case like *participatory design of community energy grids vs. centralized nuclear* helps highlight this.)*

  **Honest Limitations & Notes:**

  1.  **Winner vs. Feenberg Distinction:** Q7 is the crucial differentiator. If participants strongly believe core political effects *can* be redesigned democratically, they lean Feenberg. If they see inherent constraints as more resistant, they lean Winner. The tree makes this explicit.
  2.  **"Sophisticated" Instrumentalism:** The path forces a focus on the artifact-as-tool (6A). More nuanced instrumentalists might drift towards SCOT (6B), but the tree forces a choice.
  3.  **Unexplored Paths:**
      *   `1A -> 2No -> 5A`: Believes Moses bridges have intrinsic politics (1A) but nuclear plants don't demand authority (2No) *and* contingency undermines artifact politics (5A). Potentially incoherent? If politics is intrinsic (1A), contingency shouldn't *undermine* that claim entirely (though it might nuance it - see Q5B).
      *   `1B -> 3B -> 5A`: Believes effects are deployment-driven (1B), barbed wire's affordances are key (3B), but contingency undermines artifact politics (5A). Some tension between 3B (affordances matter) and 5A (contingency undermines artifact politics).
  4.  **Unit of Analysis (Q6):** This primarily distinguishes instrumentalism (6A), SCOT (6B), and Critical Theory (6C). Winner and Strong Tech often focus on the artifact/system properties (covered in earlier questions).
  5.  **Contingency (Q5):** This is the main split between SCOT (5A) and positions granting artifacts more causal weight (Winner, Feenberg, Ellul - 5B).

  **Participant Traversal Guide:**

  1.  **Start** with the Shared Commitment (you all agree on this!).
  2.  **Answer each question sequentially**, choosing the option that best reflects your judgment about the **concrete case** described. Don't think about labels!
  3.  **Follow the arrows** (Go to QX) based on your choice.
  4.  **Continue** until you reach a Terminal Leaf (named position).
  5.  **Read the description** of that leaf. Does it resonate with your underlying beliefs revealed by your path? Discuss!
  6.  **Key:** The path matters more than the label. The tree exposes *why* you might hold a position based on commitments to core ideas (intrinsic properties, contingency, flexibility, redesign potential, unit of analysis).

  This tree forces engagement with Winner's core arguments and the major fault lines in the debate using his (and other) iconic cases, while minimizing reliance on jargon and exposing the logical structure of the disagreement. Good luck with the workshop!
