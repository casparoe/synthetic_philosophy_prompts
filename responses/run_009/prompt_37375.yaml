prompt: |-
  In my ethics class we were discussing acts that are good but not required — a soldier throwing himself on a grenade to save his squad, someone donating a kidney to a stranger — and my teacher called these supererogatory. To explain the category she used the analogy of an exam: duties are the required questions, supererogatory acts are extra credit. You are obligated to answer the required questions; extra credit is praiseworthy if you do it, but skipping it costs you nothing.

  After class, a friend used this to argue that someone who declines to donate a kidney to a stranger has done nothing wrong at all — after all, it was extra credit, and no one is penalized for skipping extra credit. Something about that move bothers me, but I cannot articulate exactly where it goes wrong, or whether it goes wrong at all.

  Please audit the analogy. First, set out explicitly what maps onto what: the required questions, the extra credit, the passing grade, the grader, the total number of points available. Then identify where the mapping breaks, and — this is the part I care about most — separate the disanalogies that matter for my friend's conclusion from the ones that don't. I can already see the analogy isn't perfect: there is no literal grader, and moral life isn't divided into discrete questions with fixed point values. What I want to know is whether those imperfections are load-bearing. Does "optional" in the exam sense really mean the same thing as "permissible but not required" in the moral sense? Does the analogy quietly import something like a fixed ceiling on what morality can demand, or the idea that moral worth is scored by an external examiner rather than owed to particular people who are standing in front of you? And does my friend's conclusion — that declining costs nothing, morally speaking — survive once the disanalogies are on the table, or was the analogy carrying it the whole way?

  If you think there is a better analogy for supererogation, propose one and say what it gets right that the exam picture gets wrong. Finally, tell me what would change your verdict: which argument or consideration, if someone pressed it, would lead you to conclude that the extra-credit analogy or my friend's use of it actually holds up, and identify the point in your own reasoning where you think it is most likely to fail.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're in an ethics class discussing supererogatory acts—actions that are good but not required, like a soldier jumping on a grenade or donating a kidney to a stranger. The teacher used an exam analogy: duties are required questions, supererogatory acts are extra credit. The user's friend argued that declining to donate a kidney is like skipping extra credit—morally permissible without penalty. The user feels uneasy about this but can't pinpoint why.

  First, I need to map out the analogy explicitly. The required questions are moral duties, extra credit is supererogatory acts, passing grade is the minimum moral standard, the grader is moral evaluation (God, society, conscience), and total points are moral worth. The friend's conclusion is that declining supererogatory acts costs nothing morally, just like skipping extra credit.

  Now, where does the analogy break? The key disanalogies are the stakes involved, the nature of the beneficiary, and how moral demands scale. In exams, extra credit is optional with no real-world consequences. But in morality, not donating a kidney can mean someone suffers or dies. The beneficiary isn't an abstract grader but a real person with needs. Also, moral demands aren't fixed; context matters, like urgency or relationship. 

  The friend's conclusion relies on the analogy treating morality as having a fixed ceiling, like an exam with a set syllabus. But morality isn't like that—expectations can rise with capacity. A billionaire donating a kidney vs. a minimum-wage worker isn't the same, but the analogy flattens this. 

  The deeper issue might be the user's discomfort with moral minimalism. The analogy might downplay the gravity of real-world consequences. Also, the user might be wrestling with whether morality is about avoiding blame or proactively doing good. The friend's view reduces morality to not doing wrong, ignoring the value of going beyond. 

  A better analogy could be a lifeguard at a beach. Duties are patrolling the designated area. Saving someone outside the zone is supererogatory. But if you're the only one who sees them drown, it feels different. This highlights proximity and capacity, which the exam misses. 

  What would change my view? If someone argued that morality's demands are fixed and context-independent, or that supererogation is always optional without exception. But real-life cases, like easy rescues, challenge this. My reasoning might fail if I underestimate how personal relationships affect duties, but the core disanalogies hold. 

  Ultimately, the exam analogy's imperfections are load-bearing for the friend's conclusion. It smuggles in a fixed moral ceiling and ignores the stakes and scalability of moral demands. Declining supererogatory acts isn't always cost-free morally, especially when the need is dire and capacity high.
answer: |-
  Your unease is well-founded. The exam analogy is pedagogically useful but philosophically treacherous for precisely the reasons your friend employed it. Let's dissect it systematically.

  ### 1. Mapping the Analogy (What Supposedly Maps Onto What)
  *   **Required Questions:** Moral duties/obligations (e.g., not harming others, keeping promises, basic beneficence within capacity).
  *   **Extra Credit:** Supererogatory acts (e.g., heroic self-sacrifice, extreme generosity).
  *   **Passing Grade:** The minimum threshold of moral acceptability (fulfilling all duties without major vice).
  *   **Grader:** The mechanism of moral evaluation (God, conscience, society, the moral community).
  *   **Total Points Available:** The overall "score" of one's moral worth/virtue.
  *   **Cost of Skipping Extra Credit:** No *penalty* to moral standing/baseline permissibility (remains "passing").

  ### 2. Where the Mapping Breaks (The Disanalogies)

  *   **Disanalogy 1: The Stakes & Nature of the "Questions" (Crucially Load-Bearing)**
      *   **Exam:** Skipping extra credit affects only the *grader's evaluation* of the *student*. The stakes are abstract (a grade) and self-referential.
      *   **Morality:** Declining a supererogatory act often directly affects *another vulnerable person*. The stakes are concrete (suffering, death, unmet need) and *interpersonal*. Skipping kidney donation isn't just failing to gain extra points; it's leaving a specific person in dire need when you *could* help, even at significant cost to yourself. The "cost" isn't primarily to your moral scorecard; it's *to the person who continues to suffer*.

  *   **Disanalogy 2: The "Grader" and the Beneficiary (Crucially Load-Bearing)**
      *   **Exam:** The grader (professor) is distinct from the beneficiary of the "extra credit." The professor isn't harmed by the student skipping it.
      *   **Morality:** The "grader" (moral evaluation) is often intertwined with the perspective of those affected, *especially the potential beneficiary*. The stranger needing the kidney isn't a neutral observer like the professor; they have a profound, urgent interest in your action. Morality isn't just about scoring points with an external judge; it's often about responding to the *demands of the situation and the needs of others* standing before you. Ignoring this need feels different from skipping an abstract challenge set by a detached authority.

  *   **Disanalogy 3: The Ceiling on Demands & Scalability (Crucially Load-Bearing)**
      *   **Exam:** The syllabus defines a clear, fixed ceiling. Required questions are *all* that can be demanded. Extra credit is genuinely *extra* and always optional without failing the core requirement.
      *   **Morality:** The line between duty and supererogation is blurry and context-dependent. What is supererogatory for one person (e.g., donating a kidney for a poor single parent) might border on a duty for another (e.g., a healthy billionaire with 10 close relatives who are perfect matches for a dying niece). Morality's demands aren't fixed; they scale with capacity, relationship, urgency, and lack of alternatives. The analogy smuggles in a fixed, minimalistic ceiling ("Just pass, nothing more is *ever* required") that doesn't reflect moral reality. It implies morality *cannot* demand extreme sacrifice *ever*, which is highly contested.

  *   **Disanalogy 4: The Nature of "Costing Nothing" (Crucially Load-Bearing)**
      *   **Exam:** Skipping extra credit truly costs the student nothing beyond a potentially higher grade. Their fundamental standing is unchanged.
      *   **Morality:** While *blamelessness* might be preserved (you didn't violate a duty), *moral indifference* or *failure of beneficence* might still exist. Declining might not make you *culpable*, but it can leave a *moral remainder* – a sense that you *could have* been better, more heroic, more generous. More importantly, as per Disanalogy 1, the *real cost* is borne by the person in need, not just your moral record. The analogy obscures this externalized cost.

  *   **Disanalogy 5: The Structure of the Endeavor (Less Load-Bearing, but Reinforces Others)**
      *   **Exam:** Discrete, pre-defined tasks with clear boundaries and point values. Competitive or individualistic structure.
      *   **Morality:** Fluid, interconnected, context-heavy, without predefined limits. Deeply relational and cooperative. This difference makes the "fixed ceiling" and "abstract extra task" aspects of the analogy feel artificial, but it's secondary to the core problems above.

  ### 3. Impact on Your Friend's Conclusion
  The disanalogies **completely undermine your friend's conclusion** that declining to donate "costs nothing, morally speaking." The analogy is doing *all* the work here by:
  1.  **Externalizing the Cost:** Framing the only "cost" as a hit to one's own moral score (which skipping extra credit avoids), ignoring the cost *to the person in need*.
  2.  **Enforcing a Rigid Ceiling:** Assuming morality has a fixed syllabus where anything beyond the minimal "pass" is purely optional bonus points, denying the scalability of moral demands based on context/capacity.
  3.  **Detaching from Beneficiaries:** Treating the moral act as directed towards an abstract "grader" rather than a concrete person whose need creates a potential moral reason for action, even if not a strict duty.

  **Conclusion on Friend's Move:** Your friend is correct that declining a supererogatory act is *not morally wrong* (doesn't violate a duty, doesn't make you blameworthy/culpable). **However,** the analogy falsely suggests this means it "costs nothing morally." It ignores:
  *   The **real-world cost** to the specific individual left in need.
  *   The potential **moral remainder** (a failure of ideal virtue or maximal beneficence, even if not vicious).
  *   The **context-sensitivity** that might make the act feel *closer* to a duty in specific circumstances.

  ### 4. A Better Analogy: The Lifeguard at the Beach

  *   **Mapping:**
      *   **Patrolling the Designated Zone:** Moral duties (saving swimmers clearly within your assigned area).
      *   **Saving Someone Drowning Far Outside Your Zone:** Supererogatory (going beyond your required duty, involving significant risk/effort).
      *   **Passing Grade:** Competently guarding your assigned zone.
      *   **Grader:** The lifeguard service/beachgoers' expectations.
      *   **"Cost" of Skipping:** No *penalty* from the service (you did your job), but...
  *   **Why it's Better:**
      *   **High Stakes & Concrete Beneficiary:** The cost of inaction (death) is visceral and affects a specific person, making the "extra" act feel weightier than abstract points.
      *   **Scalability:** If it's a calm day and you're the *only* guard who sees the distant swimmer, the demand feels stronger than if it's chaotic and others are closer. Capacity and lack of alternatives matter.
      *   **Moral Remainder:** Even if blameless for staying in your zone, knowing you *could* have saved someone far out might leave a residue. The "grader" (service) might not penalize you, but bystanders (or your conscience) might still see a *missed opportunity* for greater good.
      *   **Avoids Fixed Ceiling:** The duty zone is defined, but the extreme need outside it creates a pull that the rigid exam syllabus doesn't capture.
  *   **Still Imperfect:** It still involves defined roles/duties. It might underplay acts driven purely by compassion without a professional context. But it captures the *interpersonal stakes* and *scalability* far better than the exam.

  ### 5. What Would Change My Verdict?

  My verdict would shift **only if** someone successfully argued for a highly **minimalist, strictly deontological view** of morality where:
  1.  **Duties are Absolute and Minimal:** Moral obligations are strictly defined, context-independent, and require only avoiding harm/keeping promises (e.g., a strict Kantian or libertarian view). *All* positive beneficence beyond literal non-harm is supererogatory.
  2.  **No Scalability:** Capacity, relationship, or direness of need *never* shifts an act from the supererogatory category towards the obligatory category. The "syllabus" is fixed.
  3.  **Morality is Only About Permissibility/Blame:** Moral evaluation concerns *only* whether an act is forbidden, permitted, or obligatory. There is no separate category of "praiseworthy but not required," or if there is, it carries *no* implication of a "remainder" or "cost" (even non-culpable) when omitted. Morality is purely about avoiding wrongdoing, not about aspiring to goodness beyond the minimum.

  **Where My Reasoning is Most Vulnerable:** The weakest point in my critique is likely the **status of the "moral remainder."** Defenders of a strong supererogation view (like some libertarians or strict Kantians) might argue that once an act is classified as supererogatory, declining it is *truly* morally neutral – no blame, no cost, no residue. The feeling of "could have done more" is mere sentiment, not a genuine moral feature. If they convincingly defend this **strict separation between permissibility and ideal virtue**, and reject any notion of **scalable demands based on capacity**, then the exam analogy (and your friend's use) holds up *for that specific moral framework*. However, this framework itself is highly contested and struggles to capture the intuitive pull we feel in cases of extreme, easily addressed need faced by someone with overwhelming capacity.

  **In essence:** The exam analogy works *if and only if* you already accept a very minimalist, rule-bound, individualistic view of morality where duties are fixed and low, and the only "cost" of action/inaction is to one's own moral ledger. If you believe morality involves responding to the needs of others in a way that can sometimes make extraordinary demands *feel* quasi-obligatory in context (even if not strictly required), or that leaving dire need unmet when you could easily help has *some* moral significance beyond mere non-praiseworthiness (even without blame), then the analogy fails, and your friend's conclusion doesn't follow. Your discomfort likely stems from sensing these deeper dimensions that the analogy flattens.
