prompt: |-
  At a recent retrospective for a stalled platform migration — two years in, several million spent, the deadline slipped three times — our consultant argued for pressing on, on the grounds that continuing would be keeping a promise to our past selves. On her telling, the team that committed in year one paid a real price on the understanding that the work would be finished; abandoning it now would be like defaulting on a debt, and so honoring sunk costs is simply promise-keeping in the special case where the promisee is ourselves, earlier. Our engineering director waved this off as sentimentality: the money is gone either way, and a sunk cost is like water already under the bridge — fit for grief, not for decision.

  I would like you to audit the consultant's analogy rather than the director's slogan. Please proceed as follows:

  1. Set out the correspondence table explicitly: within the promise framing, what plays the role of promiser and promisee, of consideration, of the expectation created, of performance, of breach, and of the sanction or standing complaint that ordinarily backs a promise?

  2. Identify where the mapping breaks, and then sort the disanalogies: which ones actually matter for the consultant's conclusion (for instance, whether a party with no further interests or expectations can be a promisee, whether release from a promise requires the promisee's consent, and who could ever release us from this one) and which are merely differences of detail that she is entitled to stipulate away.

  3. Ask what the analogy quietly imports. In particular: does it presuppose that the past selves' expectations can bind us through later evidence they did not have, and does it conflate two different rational roles the past choice might play — a commitment whose authority survives new information versus mere evidence about value, on the model of a second opinion from someone who knew our constraints well but knows nothing of what we have since learned?

  4. Test the framing on cases: a marathon runner at mile eighteen who trained for a year; a reader four hundred pages into a trilogy she has soured on; a couple staying together because of the decades already invested; and our own migration, supposing a competitor has just shipped a product that achieves our project's entire purpose. Which verdicts does the promise framing get right, and where does it misfire relative to a simple preference-for-completion account on which finishing things is just one good among others?

  5. Say whether the conclusion the analogy was used to support — that we owe continuation — survives once the disanalogies are on the table. If it does not, consider whether a better analogy (sunk costs as a signal of reliability to collaborators whose future cooperation depends on it, as self-signaling of perseverance, as a burned bridge whose burning carries costs of its own) would support a weaker but defensible version of her position, and note the fallback move she might make: that even if no particular promise exists, it can still be rational to cultivate a general disposition to finish what one starts, and to act on that disposition even when, considered case by case, it loses. Finally, indicate where the director's dismissal is too quick: in what respects, if any, can honoring sunk costs be rational even though the promise framing fails?

  Please write in American English, and keep the treatment rigorous — I care about where each disanalogy does and does not bite, not about a general sermon against sunk costs.
reasoning: |-
  Hmm, the user is asking for a detailed audit of a consultant's analogy that frames honoring sunk costs as promise-keeping to one's past self. This is quite an intricate philosophical and practical question about decision-making in business contexts.

  First, let me parse the consultant's core argument: abandoning the project would be like defaulting on a debt to past selves who invested effort expecting completion. The engineering director counters with classic sunk cost fallacy reasoning. The user specifically wants the consultant's analogy dissected, not the director's position.

  Breaking this down methodically as requested:

  For part 1, I'll map the promise framework elements to the sunk cost scenario:
  - Promisor/promisee = current team/past team
  - Consideration = past effort/opportunity costs
  - Expectation = project completion
  - Performance = continuing development
  - Breach = abandoning project
  - Sanction = broken trust in future commitments

  The mapping holds superficially but starts cracking under scrutiny. Key disanalogies emerge in part 2: past selves don't exist to release us from the "promise," and more critically - they lack current interests or new information. This isn't just detail; it fundamentally undermines the analogy because promise-keeping assumes the promisee's ongoing stake.

  Part 3 reveals what the analogy smuggles in: it treats past expectations as binding regardless of new evidence (like the competitor's product rendering the project obsolete), and conflates commitment-as-authority with commitment-as-evidence. The latter might be valid (past effort signals value), but the former isn't - we're not morally bound to choices made under different information.

  Testing with cases in part 4 shows where the promise framing misfires: 
  - Marathon runner: promise framing works (past self knew pain would come) 
  - Bad trilogy: fails (past self couldn't predict boredom) 
  - Unhappy couple: dangerously endorses inertia 
  - Competitor scenario: clearly irrational to continue

  By part 5, the analogy collapses for the migration case because new information (competitor's solution) changes everything. But there might be weaker justifications: signaling reliability to stakeholders, or cultivating completionist discipline as a general virtue - though the director is right that pure sunk costs shouldn't dictate decisions.

  The engineering director's dismissal is mostly correct but overlooks how past investment can sometimes signal genuine value (if the training marathon runner quits at mile 18 due to temporary pain, they might regret it). Still, in the migration case with a competitor's solution live, even that doesn't apply.

  Ultimately for this project, absent new strategic value, the consultant's emotional appeal should yield to the director's evidence-based stance. The promise framing is elegant rhetoric but philosophically unsound under scrutiny.
answer: |-
  Here is a rigorous audit of the consultant's "sunk costs as promise to past selves" analogy, addressing your requirements step-by-step:

  ---

  ### 1. Correspondence Table
  | **Promise Element**       | **Sunk Cost Analogy**                                                                 |
  |---------------------------|---------------------------------------------------------------------------------------|
  | **Promisor**              | Current team/company                                                                 |
  | **Promisee**              | Past selves (the team/decision-makers at project inception)                          |
  | **Consideration**         | Effort, time, money, and opportunity costs invested in Year 1                        |
  | **Expectation Created**   | Project completion and its anticipated benefits                                      |
  | **Performance**           | Continuing the project to completion                                                 |
  | **Breach**                | Abandoning the project                                                               |
  | **Sanction/Complaint**    | Moral failure ("letting past selves down"), erosion of self-trust, perceived betrayal |

  ---

  ### 2. Disanalogies and Their Relevance
  **Key Disanalogies**  
  - **Promisee’s Capacity to Release**: Past selves *cannot* consent to release the promise. They lack agency to reassess based on new information.  
    *Relevance*: **Critical**. The analogy assumes the "debt" is absolute, but real promises can be renegotiated/forgiven if circumstances change.  
  - **Promisee’s Ongoing Interests**: Past selves have no current interests. Their sacrifice is historical, not ongoing.  
    *Relevance*: **Critical**. Real promisees have *present* stakes; past selves cannot suffer new harm from breach.  
  - **Evidence-Ignorance**: Past selves committed without knowledge of future setbacks (slipped deadlines, competitor actions).  
    *Relevance*: **Critical**. Promises are not binding when made under false or incomplete premises.  

  **Peripheral Disanalogies**  
  - No formal contract or explicit oath.  
  - "Sanction" is psychological (guilt), not legal.  
  *Relevance*: **Minor**. The consultant can stipulate moral/psychological stakes.  

  ---

  ### 3. What the Analogy Quietly Imports  
  - **Presupposition of Binding Authority**: Assumes past commitments retain authority *despite* new evidence (e.g., delays, cost overruns, market changes). This treats past judgment as superior to present judgment.  
  - **Conflation of Rational Roles**:  
    - *Commitment-as-Authority*: "We must finish because past selves commanded it."  
    - *Commitment-as-Evidence*: "Past investment signals the project’s inherent value."  
    The analogy smuggles in the first (authority) while the second (evidence) is defensible without promise rhetoric. Past selves knew initial constraints but not subsequent facts.  

  ---

  ### 4. Case Testing  
  | **Case**                                          | **Promise Framing Verdict**       | **Misfire vs. Preference-for-Completion**                                                                 |
  |---------------------------------------------------|-----------------------------------|-----------------------------------------------------------------------------------------------------------|
  | **Marathon runner at mile 18**                    | Continue (honor training sacrifice)| **Fits**: Past self understood pain/discipline needed; quitting wastes prior effort with no new evidence. |
  | **Reader 400 pages into a soured trilogy**        | Finish (respect initial investment)| **Misfires**: Past self couldn’t predict declining quality. Preference-for-completion ignores current utility loss. |
  | **Couple staying for decades invested**           | Stay (avoid "defaulting")         | **Dangerous misfire**: Frames inertia as virtue. Ignores current misery for sake of sunk costs.           |
  | **Migration after competitor ships solution**     | Continue ("keep promise")         | **Severe misfire**: Past selves lacked competitor knowledge. Completion may yield $0 value.               |

  **Pattern**: The promise framing *overfits* when past effort predicts future costs/benefits (marathon) but *fails catastrophically* when new information invalidates premises (competitor, bad trilogy). Preference-for-completion is one good among others; promise framing absolutizes it.  

  ---

  ### 5. Conclusion Survival & Fallbacks  
  **Conclusion (owe continuation)**: **Does not survive**. The disanalogies (no release mechanism, no ongoing interests, evidence-ignorance) collapse the debt analogy.  

  **Better Analogies for Weaker Position**:  
  - **Signal to Collaborators**: Abandoning may damage trust with partners/investors.  
  - **Self-Signaling**: Quitting erodes team’s identity as "finishers," harming future projects.  
  - **Burned Bridge Costs**: Wasted investment could have secondary costs (e.g., lost momentum, talent attrition).  

  **Fallback Move**: Cultivating a *disposition to finish* can be rational (avoids premature abandonment, builds resilience). However, this is a *rule-utilitarian* argument—not a promise—and must tolerate local losses (e.g., quitting trilogies) for systemic gains.  

  **Where the Director is Too Quick**:  
  - Sunk costs can *indirectly* matter:  
    - As **evidence** of original value (if past selves were rational).  
    - Via **collateral costs** (e.g., reputational harm, team morale).  
  - The director’s "water under the bridge" ignores that the bridge’s *collapse* may affect downstream decisions.  

  ---

  ### Final Assessment
  The consultant’s analogy fails as a moral imperative ("debt"), but the director understates sunk costs’ *instrumental* relevance. Continuation is only rational if:  
  1. Past investment signals *current* value **OR**  
  2. Abandonment imposes *new* costs (reputational, psychological, relational) exceeding completion costs.  
  In your migration case—absent evidence of hidden value or collateral damage—the director’s stance is likely correct. The promise framing is elegant but unsound philosophy.
