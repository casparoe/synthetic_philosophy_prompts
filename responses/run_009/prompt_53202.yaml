  The theories we aim to distinguish include:
  1. No false grounds (NFG): Knowledge requires that the belief is not based on any false lemma.
  2. Causal/Reliabilist (CR): Knowledge requires that the belief is produced by a reliable process or an appropriate causal connection to the fact.
  3. Relevant Alternatives (RA): Knowledge requires that the subject can rule out relevant alternatives.
  4. Safety (S): Knowledge requires that the belief is safe, i.e., in nearby possible worlds, the belief is true.
  5. No Defeater (ND): Knowledge requires that there is no undefeated defeater (i.e., no evidence that the subject possesses or should possess that would undermine the belief).
  6. Knowledge-First (KF): Rejects the Gettier project and the idea that knowledge can be analyzed into necessary and sufficient conditions. Instead, knowledge is a primitive state. In practice, this view might lead to a more permissive stance on some cases or a rejection of the need for a reductive analysis.

  We note that some of these theories might overlap or be hard to distinguish. We are to include at least two questions that split positions that usually travel together, and we must flag any pairs that we cannot distinguish.

