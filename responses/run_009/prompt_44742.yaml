answer: |-
  ## Prospectus: Standing Before the Demos: Dissolving the Boundary Problem Regress Through Decision-Specific Authorization

  **1. Research Question:**  
  Can a "standing model" of demos membership – where inclusion in the decision-making body for a specific collective decision is conferred *decision-by-decision* according to impersonally justified procedural rules, analogous to legal standing – successfully dissolve the regress objection plaguing substantive principles of demos composition (like the all-affected interests and all-subjected-to-coercion principles), or does it merely relocate that regress to the justification or application of the standing rules themselves?

  **2. The Problem: The Boundary Problem and the Persistent Regress**  
  The "boundary problem" in democratic theory asks: *Who constitutes the legitimate demos entitled to make a particular binding collective decision?* Foundational principles dominate the debate:
  *   **The All-Affected Interests Principle (AAP):** Those significantly affected by a decision should have a say in making it.
  *   **The All-Subjected to Coercion Principle (SCP):** Those subject to the coercive enforcement of a decision should be included in the demos authorizing it.

  However, both principles face devastating, structurally similar objections concerning indeterminacy ("affected to what degree?"), over-inclusiveness (potentially encompassing the entire globe), and, most crucially, the **regress objection**. This objection contends that *applying any such principle to determine the demos for a decision D itself requires a prior, authoritative determination of *who is competent to apply the principle to D*.* This prior determination seems to require *another* demos and thus *another* principle for its composition, leading to an infinite regress. The skeptical conclusion drawn by some is that initial boundary-drawing is fundamentally arbitrary or rests on non-democratic foundations (historical contingency, force, prior agreement), undermining the democratic legitimacy of the foundational act itself. Existing responses often involve:
  *   **Denying Solvability:** Embracing the arbitrariness or positing a pre-political "constitutive demos" (accepting the regress as fatal or foundational).
  *   **Proceduralism:** Shifting focus to fair procedures *within* an assumed demos, sidestepping the initial boundary question.
  *   **Hybrid/Modified Principles:** Refining AAP or SCP (e.g., "stakeholder" models, "all-subjected" to specific *types* of coercion) without fully resolving the regress concerning who applies the refined criteria.

  The core issue, I contend, is a **conflation of two distinct questions**:
  *   **Question 1 (Membership):** Who is a standing member of the *general* decision-making body (e.g., citizen of State X)?
  *   **Question 2 (Occasion/Authorization):** For a *specific decision D*, who among the potential claimants (including non-members) has the right to participate *in this specific instance*?

  Existing principles (AAP, SCP) attempt to answer Question 1 *using criteria derived from Question 2*, leading directly to the regress: determining who is "affected" or "subjected" *by D* itself requires a prior determination of who decides *that* question.

  **3. The Proposed Solution: The Standing Model**  
  My hypothesis is that disentangling these questions offers a path forward. I propose analyzing demos composition through the lens of **legal standing**. In law:
  *   Membership (e.g., citizenship, residency) is often distinct.
  *   Standing determines eligibility to bring a *specific claim* before a court *for adjudication*. Standing rules (e.g., injury-in-fact, causation, redressability) are procedural gatekeepers applied impersonally by the court. Crucially, *granting standing to a claimant does not retroactively make them a member of the court or the polity*; it authorizes their participation *for that specific case*.

  **The Standing Model for Demos Membership:**
  1.  **Distinct Tiers:** Separate the concept of *general membership* in a polity (Question 1) from *authorization to participate* in a *specific decision* (Question 2).
  2.  **Decision-Specific Authorization:** For any collective decision D, participation in the demos making D is not predetermined by general membership alone. Instead, it is conferred based on whether a claimant meets criteria defined by *impersonally justified procedural rules* (the "standing rules" for D).
  3.  **Impersonal Justification:** These standing rules must be justifiable without presupposing the very demos they help constitute for D. Justification must appeal to reasons accessible and compelling *impersonally* (e.g., principles of fairness, agency, avoiding domination, epistemic reliability) rather than the will of a specific group.
  4.  **The Demos as Adjudicator:** The existing institutional structure (itself potentially democratically constituted via prior procedures) applies these standing rules impersonally to determine who has standing for D. This structure acts analogously to a court applying standing doctrine.

  **4. Core Hypothesis and Method: Dissolution vs. Relocation**  
  The central claim is that this model **dissolves** the regress objection. The regress targeted the need for a prior demos to *apply the membership principle*. The standing model:
  *   Avoids applying a *substantive membership principle* for the demos of D.
  *   Instead, it uses *impersonally applied procedural rules* (standing rules) to determine *participation authorization* for D. The "demos for D" emerges *from* the application of these rules to claimants, without needing a prior demos *to apply a membership principle*.

  **The Critical Test:** The success of this model hinges on rigorously distinguishing **genuine dissolution** from **mere relocation** of the regress. Relocation would occur if:
  *   (a) Applying the standing rules *themselves* requires a prior demos.
  *   (b) Impersonally justifying the standing rules *in the abstract* requires presupposing a demos.

  **Methodology (Chapter Outline):**

  *   **Chapter 1: The Boundary Problem and the Regress Impasse**  
      Detailed analysis of AAP, SCP, and the regress objection. Critique of existing responses. Formalization of the regress argument. Establishment of the conflation of membership and occasion as the core issue.
  *   **Chapter 2: The Standing Analogy: Conceptual Foundations**  
      Deep dive into the structure and function of legal standing doctrine. Analysis of how it separates membership (in the polity/court system) from authorization (for a specific claim). Development of the core "Standing Model" for demos composition, defining key concepts: decision-specific authorization, impersonal justification, the role of institutional adjudicators.
  *   **Chapter 3: Impersonal Justification of Standing Rules**  
      *The Crucial Test Part 1:* Can standing rules be justified impersonally *without* presupposing a demos? Engagement with theories of public reason, political liberalism, and impersonal justification (e.g., Scanlonian contractualism adapted for rules, not outcomes). Exploration of candidate justificatory grounds: fairness in agency recognition, prevention of domination, epistemic adequacy for the decision-type, practical feasibility. Rigorous argument that such justification is possible *in principle*.
  *   **Chapter 4: Application Without Regress: Dissolution Achieved?**  
      *The Crucial Test Part 2:* Does the *application* of standing rules to specific claimants for decision D require a prior demos? Analysis of the institutional adjudicator role. Argument that existing institutions (courts, legislatures using procedural votes, independent commissions) can apply pre-defined, impersonally justified rules *impersonally* – based on the rules and facts, not group will – thereby constituting the demos for D *through* the application process itself, avoiding the need for a prior demos *for applying the rule*. Examination of potential historical or hypothetical examples (e.g., suffrage expansion debates, cross-jurisdictional environmental decisions, international bodies).
  *   **Chapter 5: Objections, Limitations, and Implications**  
      Addressing key challenges: Is this just coercion/authorization dressed differently? (Relationship to SCP). Can it handle foundational moments? Does it collapse into proceduralism? Scope limitations (requires some institutional framework). Implications for democratic theory: shifts focus to rule-making procedures and impersonal justification, potentially legitimizing non-universal demoi for specific decisions.

  **5. Success and Failure Criteria**

  *   **Successful Result:** The dissertation succeeds if it demonstrates convincingly that:
      1.  The conflation of membership and occasion is central to the regress in AAP/SCP.
      2.  The standing model provides a coherent, conceptually distinct alternative framework.
      3.  Impersonal justification of standing rules *is possible* without presupposing a demos (Chapter 3 succeeds).
      4.  The institutional application of these rules to determine participation for D *can operate* without requiring a prior demos for that application task, thereby *dissolving* the specific regress identified in Chapter 1 (Chapter 4 succeeds).
      5.  The model offers a novel and productive perspective on boundary-setting, even if not a panacea.
  *   **Failure Conditions:** The project fails if:
      1.  **Collapse into Existing Principle:** The standing model proves to be merely a notational variant of the Subjected to Coercion Principle (SCP) or another existing view, lacking genuine novelty or failing to escape its problems (especially the regress). *Mitigation: Emphasize the procedural/authorization vs. substantive/coercion distinction and the decision-specific nature.*
      2.  **Justificatory Regress:** Chapter 3 fails – impersonal justification of the standing rules themselves demonstrably requires presupposing a demos, merely relocating the regress to the meta-level of rule justification.
      3.  **Application Regress:** Chapter 4 fails – the argument that institutions can apply standing rules impersonally is unconvincing; determining who applies the rules or interpreting them contextually inevitably requires a prior demos, relocating the regress to the institutional level.
      4.  **Incoherence or Impracticality:** The model is shown to be conceptually incoherent or so institutionally cumbersome as to be practically irrelevant to real-world boundary problems.

  **6. Scope Risks and Honest Assessment**

  This project ambitiously tackles a foundational problem. Key risks of bloating beyond dissertation scope include:

  1.  **The Justification Abyss (Chapter 3):** Developing a full theory of impersonal political justification is a monumental task in moral/political philosophy. *Mitigation:* The focus must remain sharply on demonstrating the *possibility* and *structure* of justification *specifically for standing rules* in the context of dissolving the boundary regress, leveraging existing frameworks (public reason, contractualism) without building a comprehensive justificatory edifice from scratch. Delimit the discussion to showing this justification *can* avoid presupposing a demos, not providing the complete, best justification for all possible rules.
  2.  **Institutional Complexity (Chapter 4):** Providing a detailed, positive institutional theory for the "adjudicator" role across diverse contexts (local, national, transnational) is vast. *Mitigation:* Focus on establishing the *conceptual possibility* of impersonal application using clear examples and analogies (primarily legal standing, historical instances of procedural inclusion). Avoid designing specific institutions for all scenarios; argue for the functional requirement and its feasibility in principle.
  3.  **Engaging All Skeptics:** Comprehensively addressing every permutation of the skeptical "arbitrariness" view or every alternative proposal could derail the core argument. *Mitigation:* Focus the critique on the dominant AAP/SCP paradigms and the specific regress objection. Engage skepticism primarily as it pertains to the viability of the standing model's solution to the regress.
  4.  **Case Study Expansion:** While illustrative examples are crucial, deep dives into multiple complex historical or contemporary boundary disputes could consume excessive space. *Mitigation:* Use 1-2 focused case studies primarily as *illustrations* of the model's logic or potential application points, not as primary evidence requiring exhaustive historical analysis.

  **Conclusion**  
  This prospectus outlines an investigation into whether reconceptualizing demos membership through the lens of decision-specific standing, justified impersonally, can break the persistent regress plaguing democratic boundary principles. By rigorously separating the question of who decides a specific issue from who is a general member, and by grounding participation authorization in impersonally justified rules, the project aims to dissolve the regress objection rather than relocate it. Success hinges on demonstrating the viability of impersonal justification for standing rules and the possibility of their regress-free application. While navigating deep waters of justification theory and institutional design, the project promises a novel and potentially transformative approach to one of democracy's most fundamental and vexing questions.
