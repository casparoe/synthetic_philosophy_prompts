prompt: |-
  I'm a novelist — my most recent book turns on a fictional regional museum sitting on a collection of Benin bronzes looted in the 1897 punitive expedition — and I've been invited to run a single session of a graduate seminar on colonial provenance and museum ethics: about 14 students, 90 minutes. I know how to stage a scene, not how to run a seminar, so I'd like you to work as a designer-facilitator with a philosopher's command of the restitution debate. Begin by briefly sketching two or three candidate designs and saying why you reject all but one; then give the full design.

  What I want the students to feel, rather than be told, is this: the parties to a restitution dispute often agree on all the facts — what was taken, when, by whom, where it sits now — and still cannot resolve anything, because each side holds a different framework for deciding who is entitled to what: legal title validly acquired under the law of the time, the universal museum's claim to stewardship for all humanity, and restitution as repair owed to a particular despoiled community. And beneath even that: that "who has standing to decide" is itself the contested question. So the rules, briefs, and incentives should be built so the group collides with the deadlock themselves, before anyone names it.

  Please specify: roles and confidential briefs (trustees, the origin country's national commission, the royal court as a rival claimant, a mediator, and at least one party I haven't thought of); a staged twist mid-session; materials; a timeline; a debrief that maps specific moments onto the frameworks; what will predictably go wrong the first time; and an honest note on which feature of the real dispute no classroom exercise can reproduce and I must supply in the debrief.

  Conclude with a machine-readable last line of the form \answer{...} containing, in one short phrase, the single rule or constraint on which the whole exercise turns — the element that, if removed, collapses it into a generic debate.
reasoning: |-
  We are designing a 90-minute seminar session for graduate students on colonial provenance and museum ethics, focusing on the restitution of Benin bronzes. The goal is for students to experience the deadlock that arises when parties agree on facts but operate under different frameworks of entitlement and decision-making authority. We want them to collide with the question of "who has standing to decide" without being told explicitly.

  Key elements from the request:
  - Roles: trustees of the museum, the origin country's national commission (Nigeria), the royal court (Oba of Benin) as a rival claimant, a mediator, and at least one additional party.
  - A staged twist mid-session.
  - Materials and timeline.
  - Debrief mapping moments to frameworks.
  - Predictable problems and an honest note about what the exercise cannot replicate.

  Candidate Designs:

  1. **Design A: Structured Debate with Pre-Assigned Roles**
     - Students are assigned roles and given confidential briefs. They engage in a multi-round negotiation: opening statements, rebuttals, then mediation.
     - Why reject? This might become a generic debate without forcing the collision on frameworks. The focus could shift to arguing facts rather than encountering the incommensurability of frameworks.

  2. **Design B: Modified Consensus Exercise**
     - Groups (each representing a stakeholder) must draft a joint statement on restitution. The twist: they are told that the museum has received a credible threat of protest if no decision is made, forcing urgency.
     - Why reject? The consensus goal might obscure the fundamental disagreement on frameworks by pushing for compromise. The deadlock might be resolved too easily or artificially.

  3. **Design C: "Frameworks Collision" Simulation with Mediation and Twist**
     - This design uses role-play with confidential briefs that emphasize each party's framework and decision-rights. The mediator is instructed to focus on process, but the groups are not required to reach consensus. The twist introduces a new claimant (e.g., a diaspora group) to complicate the standing question.
     - Why choose? It forces the issue of standing by having multiple parties claim authority. The lack of requirement for consensus allows the deadlock to emerge naturally. The twist amplifies the central dilemma.

  Chosen Design: **Design C**

  Full Design:

  **Title:** "The Benin Bronzes: Who Decides?"

  **Learning Goal:** Students will experience how restitution disputes get stuck not on facts but on conflicting frameworks of entitlement and, more fundamentally, on who has the standing to decide.

  **Roles and Confidential Briefs (14 students):**
  - 3 Museum Trustees: Framework: Stewardship for all humanity, legal title under colonial law. Confidential: You must protect the collection's integrity and avoid setting a precedent for mass restitution. You have a legal opinion that the acquisition was valid under 1897 British law. Your standing: as guardians of a universal collection.
  - 3 Nigerian National Commission for Museums and Monuments (NCMM): Framework: Restitution as repair to the nation. Confidential: You are the official body recognized by the Nigerian state and international bodies (like UNESCO) for restitution. You plan a national museum in Abuja. Standing: as the legitimate government authority.
  - 3 Royal Court of Benin (Oba's representatives): Framework: Restitution as repair to the specific despoiled community. Confidential: The bronzes are sacred and part of the royal heritage. The NCMM does not represent the Benin people's cultural and spiritual interests. Standing: as the direct descendants and traditional custodians.
  - 3 Benin Diaspora Coalition (additional party): Framework: Restitution as repair to a global community with shared heritage. Confidential: You represent the global diaspora of Edo people. The bronzes are part of your identity, and you demand a say in their placement (e.g., in a Benin City museum run with diaspora input). Standing: as part of the cultural nation, beyond the state.
  - 2 Mediators (from an international body, e.g., UNESCO-facilitated process): Framework: Neutral process to find a solution. Confidential: Your goal is to get parties to agree on a process for deciding. You have no authority to impose. You must ensure all voices are heard.

  **Materials:**
  - Role sheets (confidential briefs) for each group.
  - A fact sheet (given to all) with agreed facts: 1897 British expedition looted bronzes; current location in the regional museum; no dispute on these facts.
  - A map of claimants: museum, Nigeria NCMM, Royal Court, Diaspora.
  - A timer.
  - Flip chart or whiteboard for mediators to record proposals.

  **Timeline (90 minutes):**

  1. **Introduction (5 min):** Set the scene: "You are at a mediated session to resolve the restitution of the Benin bronzes. Facts are not in dispute. Your goal is to try to find a way forward." Assign roles (pre-assigned or randomly). Groups get 10 minutes to prepare.

  2. **Group Preparation (10 min):** Each group meets separately with their confidential brief to strategize.

  3. **Opening Statements (15 min):** Each group (in order: Museum, NCMM, Royal Court, Diaspora) gets 3 minutes to state their position. Mediators take notes.

  4. **Mediated Negotiation (30 min):** Mediators lead a discussion, asking questions to clarify positions and seek common ground. They can call on groups. Focus: How should the decision be made? Who should decide? (Twist is introduced here, see below.)

  5. **Twist (mid-session, at 60 min mark):** Announce: "The museum has just received a high-profile loan request from the British Museum for a major exhibition on African art. The British Museum offers to include the bronzes if the museum agrees within 24 hours. This loan would bring prestige and funding." This twist pressures the museum and tests each group's framework (e.g., universal access vs. repair).

  6. **Reactions and Further Negotiation (15 min):** Groups respond to the twist. Mediators try to steer toward a decision process.

  7. **Closing Statements (5 min):** Each group gets 1 minute to state their final position.

  8. **Debrief (10 min):** Facilitator-led discussion mapping the exercise to the frameworks.

  **Predictable Problems:**
  - Students may focus on arguing facts (despite instructions) because it's familiar. The facilitator must redirect: "Remember, the facts are agreed. What is the basis for your claim?"
  - The museum trustees might be too easily swayed by emotional appeals, breaking character. Briefs must stress their institutional constraints.
  - The mediators might try to solve the dispute rather than expose the deadlock. Coach them to ask: "Who should decide?" not "What should we do?"

  **Honest Note:** The exercise cannot replicate the **asymmetry of power** between the museum (backed by Western institutions) and the claimants (often from formerly colonized nations). In reality, the museum holds the objects and has legal and financial resources that tilt negotiations. In the debrief, the facilitator must highlight this and discuss how it affects the deadlock.

  **Debrief Structure:**
  - Ask: "What happened? Did you reach agreement?" (Likely no.)
  - Map specific moments to frameworks:
    - When the museum cited legal title, that was the **legal framework**.
    - When NCMM invoked state authority, that was the **state-centric restitution as repair**.
    - When the Royal Court claimed spiritual custodianship, that was **community-specific repair**.
    - When the Diaspora spoke of global heritage, that was **diaspora-inclusive repair**.
  - Highlight the twist: How did the British Museum loan offer test these? (e.g., Museum trustees might see it as fulfilling stewardship; others as a diversion from restitution.)
  - Point out the deadlock on standing: "Who has standing to decide?" was the core conflict. Note when parties dismissed others' standing (e.g., NCMM vs. Royal Court).
  - Connect to real debate: Philosophers like Hickel and Appiah, and legal scholars, frame these incommensurabilities.

  **Answer:** The single rule that prevents collapse into a generic debate is the **exclusion of factual disputes**. By agreeing on facts upfront and focusing on frameworks and standing, the exercise forces a collision on principles.

  Thus, the machine-readable last line:
  \answer{exclusion of factual disputes}
answer: |-
  ### Seminar Design: "Frameworks in Conflict: The Benin Bronzes Restitution Deadlock"  
  **Core Insight:** Students will *experience* how identical facts lead to irresolvable conflict when parties operate under incompatible frameworks of entitlement and decision-rights. The exercise forces a collision over "who has standing to decide," revealing that restitution disputes are often about power, recognition, and epistemic authority—not facts.

  ---

  ### Why This Design?  
  I considered three structures but rejected two:  
  1. **"Facts-First Tribunal"** (Rejected): Students examine evidence to draft a restitution ruling. *Why reject?* Focuses on factual analysis, not framework conflict. Deadlock is avoided, not felt.  
  2. **"Collaborative Solution-Building"** (Rejected): Groups co-create a restitution policy. *Why reject?* Incentivizes compromise, masking the incommensurable frameworks.  
  3. **CHOSEN: "Mediation Impasse"**  
     - **Why chosen?** Forces students into roles with mutually exclusive definitions of legitimacy. No consensus is possible—by design. The twist amplifies competing authorities, and confidential briefs weaponize frameworks. Students *hit the deadlock* before diagnosing it.  

  ---

  ### Full Design: "The Benin Bronzes Mediation Summit"  
  **Time:** 90 minutes  
  **Students:** 14 (split into 5 groups)  
  **Materials:**  
  - Confidential briefs (one per role).  
  - Agreed "fact sheet" (distributed to all).  
  - Map of Benin Kingdom (1897 and present).  
  - Timer visible to all.  
  - Props: Name tags, "mediation guidelines" for mediators.  

  #### **Fact Sheet (Given to All):**  
  > *"In 1897, British forces looted ~3,000 Benin Bronzes during the punitive expedition against the Kingdom of Benin. Today, the fictional ‘Heritage Museum’ in the UK holds 67 bronzes. All parties accept: (1) the bronzes were seized violently; (2) the museum acquired them legally under British colonial law in 1898; (3) Nigeria gained independence in 1960. No physical repatriation logistics are disputed."*  

  #### **Roles & Confidential Briefs (Groups of 2–3):**  
  1. **Museum Trustees (2 students)**  
     - *Framework:* "Stewardship for Humanity." Universal museums preserve culture beyond borders.  
     - *Confidential:* "Your legal title is ironclad. Fight any return—it sets a precedent that could empty Western museums. Cite your public education mission. You answer to donors and a board demanding ‘stability.’"  
     - *Standing Claim:* "We decide—we are the lawful owners."  

  2. **Nigerian National Commission (NCMM) (3 students)**  
     - *Framework:* "Restitution as National Repair." The state heals colonial wounds by reclaiming heritage.  
     - *Confidential:* "You are Nigeria’s *only* legitimate voice per UNESCO. Demand unconditional return. The Royal Court is a feudal relic; the diaspora doesn’t represent Nigeria. Use your 2022 MoU with Germany as precedent."  
     - *Standing Claim:* "We decide—we are the sovereign state."  

  3. **Royal Court of Benin (Oba’s Delegation) (3 students)**  
     - *Framework:* "Restitution as Communal Repair." The bronzes are sacred; only their original custodians can heal the spiritual breach.  
     - *Confidential:* "The NCMM is corrupt and will house bronzes in Abuja, not Benin City. You are the Oba’s direct descendants. Cite the 2017 Benin Dialogue Group. Reject any ‘loan’ to Nigeria—it denies your authority."  
     - *Standing Claim:* "We decide—we are the despoiled community."  

  4. **Benin Diaspora Union (3 students) [NEW PARTY]**  
     - *Framework:* "Restitution as Transnational Repair." Heritage belongs to global Black communities; physical location is secondary to access.  
     - *Confidential:* "Demand co-stewardship: bronzes rotate globally. You crowdfunded a lawsuit against Nigeria and the museum. The Royal Court is elitist; NCMM is bureaucratic. Your power is moral—invoke #BlackLivesMatter."  
     - *Standing Claim:* "We decide—we are the living diaspora."  

  5. **Mediators (3 students from the "International Council on Museums" [ICOM])**  
     - *Framework:* "Neutral Process." Focus on *how* decisions are made, not outcomes.  
     - *Confidential:* "You have no power. Your goal: get parties to agree on a ‘process’ for resolution. Use open questions (‘What does justice mean here?’). Never endorse a framework. If deadlocked, propose non-binding arbitration."  

  ---

  ### Timeline  
  **Total: 90 mins**  
  1. **Setup (5 mins):** Distribute roles, fact sheets, and maps. Stress: "Facts are agreed. Your goal is not to ‘win’ but to advocate your framework."  
  2. **Group Prep (10 mins):** Groups review briefs and plan opening statements.  
  3. **Mediation Rounds (45 mins):**  
     - **Opening Statements (10 mins):** Each group states position (2 mins each). Mediators take notes.  
     - **Twist: The Loan Demand (20 mins in):** Mediators announce: *"The British Museum offers the Heritage Museum a prestige loan for their bronzes—contingent on a 24-hour acceptance. This would share the bronzes ‘globally’ but delay restitution talks indefinitely."*  
     - **Reaction & Negotiation (25 mins):** Mediators facilitate discussion. Key pressure points:  
       - Trustees face donor pressure (accept loan).  
       - NCMM/Royal Court must ally or fracture.  
       - Diaspora pushes digital access as compromise.  
  4. **Closed-Door Caucuses (15 mins):** Mediators meet each group separately for 3 mins to probe red lines: *"What can’t you compromise on? Why?"*  
  5. **Final Pleas (10 mins):** Each group gives 90-second closing. No consensus required.  
  6. **Debrief (15 mins):** Facilitator-led discussion.  

  ---

  ### Debrief: Mapping Moments to Frameworks  
  - **"Legal Title" Deadlock (Trustees vs. All):** When Trustees cite ownership, ask: *"Did anyone challenge the law’s validity? Why?"* → Highlights **legal vs. reparative frameworks**.  
  - **Twist Fallout:** "Why did the loan pit ‘stewardship’ against ‘repair’?" → Exposes **universalism vs. particularism**.  
  - **Diaspora’s Intervention:** "How did the Diaspora’s claim complicate ‘community’?" → Shows **standing contested across geography/time**.  
  - **Mediator Struggles:** "Why couldn’t mediators force compromise?" → Reveals **incommensurability**: no shared rules to arbitrate.  
  - **Key Quote for Frameworks:**  
    > "The dispute isn’t about *what happened* but *who gets to say what it means*."  

  ---

  ### Predictable Problems  
  - **Trustees will "break character":** Students may balk at defending colonial law. *Mitigation:* Briefs emphasize institutional constraints (e.g., "Donors will sue you").  
  - **Mediators become activists:** They may push a "fair solution." *Mitigation:* Confidentially warn: "Your job is process, not justice."  
  - **Diaspora ignored:** Groups may dismiss them as "less legitimate." *Use in debrief:* "Why was the diaspora’s standing contested? What does that say about citizenship vs. kinship?"  

  ---

  ### Honest Note: What the Exercise Cannot Replicate  
  **The crushing asymmetry of power.** In reality, the museum holds the objects, legal resources, and institutional inertia. Claimants negotiate from trauma and material disadvantage. This shapes every interaction but is impossible to simulate equitably. *Address in debrief:* "In this room, all had equal voice. But real restitution talks occur where the museum sets terms, claimants lack funding for lawyers, and colonial violence echoes in every ‘no.’ How might that change what you said today?"  

  ---

  ### Answer  
  \answer{exclusion of factual disputes}
