prompt: |-
  I'm a graduate student in computer science, and I've been in a running argument with a friend about whether large language models are intelligent. My side of it has been mostly pointing at behavior: they generalize to problems unlike anything in their training data, they catch their own mistakes mid-solution, they fail in ways that look like slips rather than gaps. Every time I try to press one of these points, he cuts me off with a line made famous by the psychologist Edwin Boring in 1923: "Intelligence is what the tests test." Since no language model sits an IQ test under standard conditions, he says, my question is settled by definition, and everything I've been calling evidence is just me misusing a word. He treats the line as a knockdown move, and my sense is that he's getting far more out of it than it contains, but I can't put my finger on where the extra content creeps in.

  Please take the slogan apart for me. Lay out, as a menu I can use the next time this comes up, the distinct precise claims the sentence could be expressing — a harmless bookkeeping convention that reserves the term for test scores; a methodological proposal to define the construct operationally; an empirical thesis that performance on diverse mental tasks has a strong common factor and IQ tests track it; and any stronger metaphysical reading on which there is simply nothing to intelligence beyond test performance. For each reading, say whether it is trivial, defensible but contested, or plain false, and — this is the part I need most — whether it would actually license my friend's move of dismissing my question by definition, given that the systems under discussion aren't test-takers at all. One more thing I'd like folded in: I've read that Boring offered the definition as deliberately narrow and provisional, explicitly narrower than the ordinary concept, with the hope that further observation would let it be extended. If that's right, it would be a nice twist to close on, since it suggests the quip's author was doing almost the opposite with it of what my friend is doing.
reasoning: |-
  Okay, the user is a graduate student in computer science engaged in a debate about whether large language models (LLMs) are intelligent. Their friend uses Edwin Boring's 1923 quote, "Intelligence is what the tests test," as a definitive argument to shut down the discussion. The user feels this is an overreach but can't pinpoint why. They want a breakdown of the slogan's possible interpretations, each evaluated for validity and whether it genuinely dismisses their evidence about LLM behaviors.

  First, I need to recall the context of Boring's quote. He was part of the early psychometric movement, aiming to make psychology more empirical. His statement was likely meant to be operational, focusing on measurable aspects rather than a comprehensive definition. The user mentions that Boring intended it as provisional, which is crucial. I should highlight that historical context to show their friend is misusing the quote.

  The user needs a structured menu of interpretations. Let me list possible readings:
  1. Bookkeeping convention: Trivial but not dismissive.
  2. Operational definition: Defensible in psychology but doesn't negate other evidence.
  3. Empirical claim about g-factor: Contested and doesn't apply to non-test-takers.
  4. Metaphysical claim: False and reductive.
  5. Exclusive definition: Also false.

  For each, I'll assess if it allows dismissing the user's points. The key is that none of these interpretations support the friend's move because the LLMs aren't taking tests. The user's evidence—generalization, self-correction, human-like errors—remains relevant regardless of test scores.

  The historical note about Boring's intent is important. He wanted a narrow definition to build upon, whereas the friend uses it to end discussion. Pointing this out turns the tables, showing the friend's approach is contrary to Boring's original purpose.

  The user's deeper need is to effectively counter their friend's rhetorical tactic and continue the substantive debate about LLM intelligence. They need clear, logical rebuttals that validate their evidence and expose the slogan's limitations. Emphasizing that intelligence is a multifaceted construct beyond tests will strengthen their position.
answer: |-
  Here's a dissection of Boring's slogan, presented as a menu of interpretations for your next encounter. Each interpretation is evaluated for its validity and, crucially, whether it genuinely licenses your friend's move of dismissing your evidence about LLM behavior by definition, especially given LLMs aren't standard test-takers.

  **The Slogan:** "Intelligence is what the tests test."

  **1. The Bookkeeping Convention (Reserving the Term "Intelligence" for Test Scores)**
      *   **Interpretation:** This is a purely semantic stipulation. It means: "For the purposes of this specific discussion/conversation/research project, when we say 'intelligence,' we *only* mean the numerical score derived from administering standardized IQ tests under standard conditions. We are not talking about any broader concept."
      *   **Validity:** **Trivial.** This is a common and often useful tactic in science to avoid ambiguity. It's definitional, not empirical.
      *   **Licenses Friend's Move?** **No, and it's irrelevant to your question.** If your friend adopts this convention, they are simply changing the subject. They are saying: "Let's not talk about whether LLMs possess intelligence in the broad sense you're using. Let's only talk about IQ test scores." This doesn't *dismiss* your evidence; it *ignores* it by refusing to engage with your chosen term/concept. It *settles* nothing about the nature of LLM capabilities you're describing; it merely avoids discussing them under the label "intelligence." Crucially, it offers *no argument* against your evidence or your broader definition. Defining "intelligence" narrowly as "IQ score" doesn't magically make the phenomena you observe (generalization, self-correction, slip-like errors) disappear or become unimportant. It just renames the topic.

  **2. The Operational Definition (Methodological Proposal)**
      *   **Interpretation:** Intelligence *as a scientific construct* is defined *by the operations* used to measure it. If you want to study "intelligence," you must study performance on validated intelligence tests. The construct has no meaning independent of its measurement.
      *   **Validity:** **Defensible but Contested (and Often Misapplied).** Operational definitions are fundamental in psychology and psychometrics for grounding fuzzy concepts in measurable reality. Boring's intent likely fell here. However, it faces critiques: a) It can conflate the measure with the underlying trait (is intelligence *really* just solving matrix puzzles under time pressure?), b) It risks circularity (intelligence is what the tests test, and the tests are valid because they measure intelligence), c) It struggles with novelty (how do you define intelligence for an entity *unable* to take existing tests?).
      *   **Licenses Friend's Move?** **No.** This definition focuses on *how to scientifically study* intelligence in humans using established tools. It does **not** logically imply that:
          *   Entities *unable* to take standard tests (like LLMs, infants, animals) cannot possess intelligence *or* intelligence-like properties.
          *   Evidence *other* than test scores (like behavioral observation, task performance analysis) is irrelevant to understanding cognitive capabilities.
          *   The operational definition exhausts the *meaning* of intelligence in ordinary language or philosophical discourse.
      Your friend misapplies it by treating the *current operationalization* as the *only possible* way to conceive of intelligence, effectively ruling out *any* evidence about non-test-takers *by fiat*. This goes beyond the methodological intent.

  **3. The Empirical Claim (g-Factor Tracking)**
      *   **Interpretation:** Performance across diverse cognitive tasks exhibits a strong common factor ("g"). Standard IQ tests are designed to be good measures of this "g" factor. Therefore, "intelligence" (meaning "g") *is* what well-designed tests test – they track this underlying mental capacity.
      *   **Validity:** **Defensible but Contested.** The existence of a "g" factor explaining a large portion of variance in human cognitive task performance is a robust empirical finding in psychometrics. IQ tests are validated against this criterion (predicting academic success, job performance, etc.). However, debates rage about what "g" *is* (neurological? information processing speed? learning rate?), whether it's unitary, the role of specific abilities, cultural bias in tests, and the limits of what "g" predicts.
      *   **Licenses Friend's Move?** **No, and it's inapplicable.** This claim is about *human* cognition and the structure of *human* mental abilities. It relies on data from *humans taking tests*. Applying it directly to LLMs is a category error. LLMs are not biological organisms with human-like cognitive architectures; they are statistical pattern generators trained on human output. The "g" factor structure observed in humans tells us precisely *nothing* about how capabilities emerge or correlate within an LLM. Your evidence (generalization, self-correction, error patterns) might be *precisely* the kind of data needed to explore whether an *analogous* "general capability" factor exists *in AI systems*, using methods appropriate to them. Dismissing this evidence because it doesn't fit the *human* "g" measurement paradigm is scientifically unjustified.

  **4. The Strong Metaphysical Claim (Nothing Beyond the Test)**
      *   **Interpretation:** There is literally *no more* to intelligence than performance on standardized IQ tests. Any talk of intelligence not captured by such tests is meaningless. Intelligence *is identical to* test scores.
      *   **Validity:** **Plain False.** This is reductive eliminativism. It ignores the rich phenomenology of intelligence (problem-solving insight, learning, adaptation, creativity, social understanding) that motivates the concept in the first place. It cannot account for intelligent behaviors outside standard test contexts (e.g., navigating complex social situations, artistic creation, novel scientific discovery). Test scores are *indicators* or *proxies*, not the essence itself. Even the strongest proponents of psychometrics see tests as measuring an underlying capacity, not being identical to it.
      *   **Licenses Friend's Move?** **No, it's incoherent and self-defeating.** This claim is so extreme it collapses under its own weight. If intelligence *is* the test score, then an entity that cannot take the test *by definition* cannot have a score, and thus cannot have intelligence. But this tells us *nothing* about the entity's actual capabilities. Dismissing your evidence based on this claim is merely begging the question – assuming the conclusion (that only test scores matter) within the premise. It offers no argument *against* the relevance or significance of the LLM behaviors you observe.

  **5. The Exclusive Definition (Tests as the Only Possible Measure)**
      *   **Interpretation:** Intelligence is *only* measurable by standardized IQ tests. No other evidence or type of performance qualifies as evidence for intelligence.
      *   **Validity:** **False.** This confuses *a* method of measurement with *the only conceivable* method. Intelligence manifests in behavior. While standardized tests offer controlled, reliable, and validated measurement *in humans*, observing complex, adaptive, goal-directed behavior (like solving novel problems, learning from feedback, explaining reasoning, correcting mistakes) in *any* system is a valid, if potentially less controlled, way to infer intelligence or intelligence-like capabilities. Denying this possibility makes the concept of intelligence completely unobservable except in one very specific context – an absurd position.
      *   **Licenses Friend's Move?** **No.** This is another form of question-begging. It simply *asserts* that your evidence is irrelevant by definition, without providing any *reason* why the behaviors you cite (generalization, self-correction, slip-like errors) shouldn't count as evidence for a capability we might reasonably call "intelligence" (or a close analog). It offers no counter-argument to the *significance* of your observations.

  **The Crucial Historical Twist: Boring's Intent**
  You are absolutely correct. **Edwin Boring offered his definition as deliberately narrow and provisional.** Writing in the early days of psychometrics, amidst conceptual confusion about intelligence, his goal was *not* to provide the final metaphysical word. His aim was methodological clarity: *"For the purposes of this discussion, let's define intelligence operationally as test performance so we can have a concrete, measurable starting point for scientific investigation."* He explicitly hoped future research would deepen and broaden the understanding of the underlying construct. He was trying to *start* a scientific conversation grounded in data, not *end* all philosophical discussion with a definitional bulldozer.

  **Your Friend's Misuse:**
  Your friend is doing the **opposite** of Boring. He is using a deliberately narrow, provisional, *methodological* definition crafted to *enable* scientific exploration of a complex phenomenon in humans as an *absolute, metaphysical trump card* to *shut down* scientific exploration and philosophical discussion about a novel phenomenon (LLM capabilities). He treats it as a conversation-ender ("question is settled by definition"), whereas Boring intended it as a conversation-starter grounded in empiricism.

  **How to Use This Menu:**

  1.  **Acknowledge the Quote:** "Yes, Boring famously said that, and it's an important historical point in psychometrics."
  2.  **Challenge the Interpretation:** "But let's unpack what that slogan *actually* means, because it's doing a lot of heavy lifting in your argument, and I think it's carrying more weight than it can bear. Which of these interpretations are you relying on?" (Briefly outline 1-4 above).
  3.  **Point Out the Misapplication:** "Whichever reading you take, none of them logically license dismissing the *specific evidence* I'm presenting about LLM behavior – generalization, self-correction, error patterns. At best, the bookkeeping convention just changes the subject. The others either don't apply to non-test-takers like LLMs, are contested, or are simply false."
  4.  **Highlight Boring's Intent:** "Crucially, you're using Boring's line in a way he never intended. He offered it as a *narrow, provisional starting point* for scientific study, hoping future work would expand it. You're using it as an *absolute, definitional end point* to avoid engaging with new evidence. You're wielding it to *prevent* the kind of observation and extension Boring hoped for."
  5.  **Refocus on the Evidence:** "Instead of hiding behind a 100-year-old quip used out of context, let's actually discuss the *evidence* I'm raising. Do you disagree that LLMs exhibit generalization, self-correction, and slip-like errors? If you agree they do, why *shouldn't* we consider these behaviors as indicators of intelligence or a closely related capability? What definition of intelligence *would* make sense for evaluating novel artificial systems, if not one based on observable cognitive performance?"

  By dissecting the slogan and exposing Boring's actual intent, you shift the burden back to your friend. He must either defend a specific (and likely indefensible) interpretation of the slogan that genuinely dismisses your evidence, or engage with the substance of your observations about LLM capabilities. The slogan is not the knockdown argument he thinks it is; it's a starting point he's misusing as a conversation-stopper.
