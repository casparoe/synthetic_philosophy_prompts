  Gilbert nails the obligation angle - that pit crew scolding someone who skipped maintenance captures the "joint commitment" vibe. But her emphasis on entitlements (like demanding help) feels alien; FRC culture prefers "we need" over "you owe us." The unspoken rules around match attendance illustrate what philosophy exposes: Gilbert's framework gives language for the moral weight our casual "we're counting on you" carries.

