  I'm a high school junior whose main extracurricular is our FIRST Robotics Competition team: I've done two years of scouting data, and this season I moved up to the drive team. I've been reading some philosophy of joint action on my own, and I'd like the main positions restated in the vocabulary my team actually uses — driver and human player roles, the autonomous period versus teleoperated play, pit crew, scouting, alliance selection, and the way we say "our robot" even though different subteams built different parts of it. Restate, as faithfully as you can: (1) Searle's claim that collective intentionality is a primitive "we-intention" that cannot be reduced to individual intentions plus mutual beliefs; (2) Bratman's account of shared intention as interlocking individual intentions held with mutual responsiveness and common knowledge; and (3) Gilbert's view that shared intention is a joint commitment that creates obligations and entitlements among the participants. For each, tell me what translates cleanly into how a robotics team runs, what you had to distort to make it fit, and what has no expression in that vocabulary at all — a good test case is the fact that I'd feel I was letting the team down by missing a match, not merely inconveniencing it. Then answer the residue question directly: does what fails to survive the translation suggest the philosophers are tracking something my team's vocabulary genuinely cannot say, or does my team's ordinary talk already capture everything worth saying, with the philosophical disputes being less substantive than they look? Keep the whole answer under 600 words, and write it in American English.
