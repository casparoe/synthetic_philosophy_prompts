prompt: |-
  I'm a chemistry grad student who grew up speaking Tamil at home and learned English at school, and lately I've been noticing something weird about switching between them. When I think through those philosophy-type dilemmas in English — the trolley thing, whether you'd tell a dying person a comforting lie — the answers come out cold and easy. Flip the switch, sure. Tell the lie, whatever. In Tamil the same questions feel heavy, and I catch myself refusing to even consider the cold answer. It also works for awkward stuff in general: I can only manage breakups and apologys in English; doing them in Tamil feels unbearable. My cousin says this is that Sapir-Whorf thing, that your language shapes your thought, but from what I understand that idea is supposed to be about languages lacking words for things or forcing you to attend to certain distinctions, and English and Tamil don't really differ that way here — both can state the dilemma perfectly well, its more like Tamil touches a nerve that English doesn't. And then there's the opposite case, which confuses me: mental arithmetic only works for me in English, because that's the language I learned math in — trying to do sums in Tamil is like doing them with my hands tied.

  So, does the first pattern (thinking more coldly or distantly in a language that isn't your first) have an established name? If so, how does it relate to the Whorf idea without just being identical to it? And is the arithmetic case the same phenomenon or a different one that merely looks similar? If there isn't an established term, coin one and define it with the boundary cases. I'm not after a bare label — I want to know what the phenomenon is, what it isn't, and where its edges are. Please keep the whole reply under 300 words, and go light on any mention of particular studies — the carving matters more than the credits.
