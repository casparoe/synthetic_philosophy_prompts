  I recall that the emotional distance effect in a second language is often called the Foreign Language Effect (FLE). That fits here because English is their learned language, making emotional decisions feel less intense. For the arithmetic part, that's more about cognitive entrenchment in the language of learning, which is different from FLE. So the two phenomena are related but distinct. 

  I should make sure to differentiate between the two clearly. The FLE explains the emotional detachment, while the arithmetic issue is procedural memory tied to the language of instruction. Also, since the user mentioned Sapir-Whorf, I need to clarify that FLE is about emotional salience rather than linguistic relativity affecting thought structure. 

