prompt: |-
  You are a professional philosopher specializing in ethics and the foundations of social choice. Think carefully before you answer, and please begin with a few minutes of private brainstorming before committing to a list.

  My friend and I just spent an entire evening arguing about the torture-versus-dust-specks case, and we eventually realized we weren't really disagreeing about the case at all: we were disagreeing about what a principle for aggregating tiny harms across many people has to accomplish before it deserves to be called adequate. So before we have that argument again, I want the specification, not the verdict.

  Write me the desiderata: what any adequate theory of the interpersonal aggregation of small harms must deliver. At minimum I want you to address which of the following are genuine requirements and which are camp prejudices: transitivity of betterness across the full spectrum (the continuum running from one person tortured for fifty years up through larger and larger groups suffering ever-smaller harms, with no clear stopping point where our intuitions flip); consistency with the idea that some harms are de minimis, too small to be worth anyone's attention on their own; what happens when you take a single harm and spread it across a population, as in Parfit-style cases where each person suffers a tiny loss that no one notices but the total loss is enormous; separability, i.e., whether how badly off strangers are should be allowed to affect how I may treat the person in front of me; and whether the theory can avoid the practical conclusion that we are all perpetually obligated to drop everything to prevent vast numbers of tiny harms. For each desideratum, give the case or consideration behind it, say whether it is non-negotiable or reflects one camp's commitments, and flag any pair you suspect cannot be jointly satisfied -- if the list itself is jointly unsatisfiable, I want to know which subset and why, because that may be the real result. Also tell me which single requirement does the most work excluding candidate theories.

  Here is the twist from our argument, and I want you to evaluate it as a serious proposal rather than dismissing it: my friend suggested a "pairwise comparability" condition -- that a harm can only enter into aggregation with other harms if each sufferer would, on reflection, accept a trade between their harm and the other harms in question, so that a dust speck and a day of torture never sit in the same sum at all. Does this dissolve the paradox, or does it merely relocate it (e.g., to cases where everyone endures the same barely-noticeable harm)? Then, and only briefly, score continuous aggregative utilitarianism, a lexical or threshold view, and my friend's comparability proposal against your list. I care most about the requirements and their motivating cases, not the scorecard.
reasoning: |-
  Okay, the user is asking for a set of desiderata for any theory that aggregates small harms across people. They had an argument with a friend about the torture vs. dust specks paradox and realized their disagreement was about what makes an aggregation principle adequate. They want the specifications, not the verdict, so I need to focus on the requirements.

  First, I recall the torture vs. dust speck case: would you choose one person tortured for 50 years or a huge number of people getting a dust speck in their eye? The paradox is that if you sum the tiny harms, the total disutility might outweigh the torture, but intuitively, torture seems worse. The user and their friend agree on the case but disagree on what principles make an aggregation theory adequate.

  The user lists several points to address: transitivity across the spectrum, de minimis harms, spreading a single harm across many (Parfit's case), separability, and avoiding the conclusion that we must always prevent vast numbers of tiny harms. They also mention their friend's "pairwise comparability" idea, where harms can only be aggregated if each sufferer would accept a trade between their harm and the others. I need to evaluate this as a serious proposal.

  I need to determine which of these are genuine requirements and which might be camp prejudices. For each, I should provide the case behind it, say if it's non-negotiable or not, flag any conflicts, and identify which requirement does the most work in excluding theories. Then, briefly score utilitarianism, threshold views, and pairwise comparability against the list.

  Starting with transitivity. This is about the continuum from torture to tiny harms. If A is better than B, and B better than C, then A better than C. But in the spectrum, moving from torture to smaller harms over more people might lead to intransitivities if our intuitions flip at some point. Transitivity seems non-negotiable for a coherent betterness ordering, but it might conflict with other intuitions, like de minimis. If we have de minimis harms that don't count, but summing them does, that could break transitivity.

  De minimis harms are those too small to matter individually. But Parfit's case shows that spreading a large harm over many people, each suffering a tiny unnoticeable harm, might sum to a large total loss. This creates a tension: if each harm is de minimis, does the aggregate still matter? Some might say no, but then how do we handle Parfit's case where the total is enormous? This seems non-negotiable because we need to account for such cases, but it might conflict with avoiding overwhelming obligations to prevent tiny harms.

  Separability means that how you treat one person shouldn't depend on unrelated harms to others. For example, if you're deciding whether to harm one person slightly, it shouldn't matter if there are others suffering elsewhere. Non-separable theories might allow this, leading to moral dilemmas. This is non-negotiable for fairness but might conflict with aggregation.

  The overwhelming obligation problem: if we must prevent vast numbers of tiny harms, we might be required to always be helping, which isn't practical. This is a concern for utilitarianism. It's a pragmatic issue but might be a camp prejudice if it's about feasibility rather than principle.

  Pairwise comparability: only aggregate harms if each sufferer would accept trading their harm for the others. So dust specks and torture aren't comparable. But what if everyone has the same tiny harm? Then pairwise trades might be acceptable, but aggregating them could still lead to large sums. This might dissolve the original paradox but relocate it to cases with uniform tiny harms. Also, it might not handle Parfit's harm-spreading case well.

  Now, conflicts: Transitivity and de minimis might conflict if de minimis harms don't count individually but summing them breaks transitivity. Also, de minimis and Parfit's harm-spreading: if each speck is de minimis, but together they equal torture, that's a problem. Avoiding overwhelming obligations might conflict with acknowledging aggregated harms in Parfit's case.

  The most work excluding theories: Probably the Parfit harm-spreading case. It forces theories to account for aggregated tiny harms, which challenges de minimis and threshold views.

  Scoring the theories:
  - Continuous Aggregative Utilitarianism: Sums utilities. Satisfies transitivity, Parfit's case, separability. Fails de minimis (if specks are non-zero, they count), leads to overwhelming obligations, and doesn't handle the torture vs specks intuition.
  - Lexical/Threshold: Ignores harms below a threshold. Can satisfy de minimis and avoid overwhelming obligations. But fails Parfit's harm-spreading (if each harm is below threshold, aggregate loss isn't captured). Might have issues with transitivity if near the threshold.
  - Pairwise Comparability: Avoids comparing torture and specks, so dissolves the original paradox. Satisfies de minimis if harms aren't comparable. But fails Parfit's case because spreading a harm might not be captured if individuals can't compare. Also, separability might be an issue if trades depend on others' harms.

  Need to present all this clearly, ensuring each desideratum is addressed with cases, negotiability, conflicts, and which is the key excluder.
answer: |-
  Below is a systematic analysis of desiderata for any adequate theory of interpersonal aggregation of small harms, based on your query. I begin with private brainstorming (condensed for readability), then present the desiderata with evaluations, conflicts, and the key excluder. Finally, I briefly assess the three candidate theories against the list. The focus is on requirements and their motivating cases, not verdicts.

  ---

  ### **Private Brainstorming (Condensed)**
  1. **Core Tension**: The torture-vs-dust-specks paradox exposes a conflict between *intuitions about comparability* (torture is incomparably worse than any dust speck) and *mathematical aggregation* (trillions of specks sum to more disutility).  
  2. **Desiderata Conflicts**: 
     - Transitivity + De Minimis + Harm-Spreading may be jointly unsatisfiable. If de minimis harms are ignored individually but matter en masse, transitivity fails (e.g., torture > speck, but torture < enough specks).  
     - Separability vs. Harm-Spreading: If strangers’ harms affect local decisions, separability is violated (e.g., Parfit’s case).  
  3. **Pairwise Comparability**: 
     - Dissolves torture-vs-specks by denying aggregation across incommensurable harms.  
     - Relocates paradox to *uniform tiny harms* (e.g., everyone loses 1 second of life: negligible individually, catastrophic en masse).  
     - May fail Harm-Spreading cases if individuals can’t "trade" imperceptible losses.  
  4. **Overwhelming Obligations**: A pragmatic concern but not necessarily fatal; may reflect societal limits, not theoretical inadequacy.  
  5. **Key Excluder**: Harm-Spreading (Parfit cases) is the strongest filter—it forces theories to confront aggregation’s moral stakes.

  ---

  ### **Desiderata for Interpersonal Aggregation of Small Harms**  
  Each is evaluated for:  
  - **Case/Motivation**: The real-world or thought-experiment basis.  
  - **Non-Negotiable?**: Whether it is a minimal requirement for coherence/fairness ("✓") or reflects a camp’s values ("✗").  
  - **Conflicts**: Flagged pairs likely incompatible.  

  1. **Transitivity of Betterness Across the Spectrum**  
     - **Case**: Continuum from one person tortured for 50 years → billions with dust specks. If A > B and B > C, then A > C must hold to avoid cyclic preferences (e.g., torture > 1B specks > 1M specks > torture).  
     - **Non-Negotiable?**: ✓. Essential for rational choice; without it, no consistent policy or moral ranking is possible.  
     - **Conflicts**: Tensions with De Minimis (if specks are "irrelevant," summing them may break transitivity) and Harm-Spreading.  

  2. **De Minimis Harms**  
     - **Case**: A harm so small (e.g., a dust speck) that it is ethically ignorable *when isolated*—no one would demand attention to their speck alone.  
     - **Non-Negotiable?**: ✗ (Camp prejudice). Reflects a threshold/intuitionist view. Denying de minimis is coherent (e.g., strict utilitarianism: all disutility counts).  
     - **Conflicts**: Incompatible with Harm-Spreading if de minimis is strict; also strains Transitivity (if specks sum to outweigh torture).  

  3. **Harm-Spreading (Parfit-Style Cases)**  
     - **Case**: Spreading a large harm (e.g., one person’s broken leg) across millions as tiny, imperceptible losses (e.g., each loses 0.001% life expectancy). The aggregate loss equals the original harm, but no individual notices or complains.  
     - **Non-Negotiable?**: ✓. Tests if aggregation recognizes *structural wrongs*—e.g., a policy causing diffuse harm is still bad even if no victim protests.  
     - **Conflicts**: Clashes with De Minimis (if harms are imperceptible, are they de minimis?) and Overwhelming Obligations (if aggregated, we must prevent such policies).  

  4. **Separability**  
     - **Case**: When deciding whether to harm one person slightly (e.g., pinch them), the plight of unrelated strangers (e.g., famine victims) should not affect the permissibility. Moral decisions should be "separable" across persons.  
     - **Non-Negotiable?**: ✓. Core to fairness; violating it allows "double-counting" harms or sacrificing individuals for distant gains.  
     - **Conflicts**: None severe; most theories satisfy this except extreme prioritarianism.  

  5. **Avoiding Overwhelming Obligations**  
     - **Case**: If each dust speck prevented saves 0.0001 utils, and trillions exist, we must always prioritize specks over everything else—making life unsustainable.  
     - **Non-Negotiable?**: ✗ (Camp prejudice). Pragmatically compelling but not theoretically required; may reflect limits of human capacity, not morality.  
     - **Conflicts**: Opposes Harm-Spreading and Transitivity if they force aggregation.  

  ---

  ### **Conflicting Subsets**  
  - **Jointly Unsatisfiable Trio**: Transitivity + De Minimis + Harm-Spreading.  
    - **Why**: If de minimis harms are *always* ignorable (De Minimis), spreading a broken leg into dust specks is harmless (violating Harm-Spreading). If Harm-Spreading holds, specks sum to matter, breaking Transitivity with torture or contradicting De Minimis.  
  - **Weaker Conflict**: Harm-Spreading + Overwhelming Obligations.  
    - **Why**: If Harm-Spreading binds, Parfit cases demand preventing tiny harms, risking Overwhelming Obligations.  

  ---

  ### **Key Excluder**  
  **Harm-Spreading (Parfit Cases)** does the most work excluding theories. It forces aggregation to handle diffuse, structural harms—rejecting theories that dismiss tiny harms as non-moral (e.g., strict threshold views). Without accommodating this, a theory fails a core test of real-world relevance (e.g., climate change: CO₂ emissions cause negligible harm per person but catastrophic totals).

  ---

  ### **Evaluating Pairwise Comparability**  
  **Proposal**: Harms aggregate only if each sufferer would accept a trade between their harm and others’ (e.g., torture and specks are incommensurable).  
  - **Dissolves Original Paradox?**: Yes. Torture and specks never share a "sum," blocking the conclusion that specks outweigh torture.  
  - **Relocates Paradox?**: Yes. Cases with **uniform tiny harms** remain problematic:  
    - Everyone endures a barely noticeable harm (e.g., 1-second life shortening). Each would accept a trade (it’s identical), so aggregation applies. Total harm could exceed torture, recreating the paradox.  
    - Fails **Harm-Spreading**: If a broken leg is spread as uniform specks, pairwise trades are acceptable—but this should still be wrong, which the proposal may not capture.  
  - **Verdict**: A serious but incomplete fix. It handles incommensurability well but falters on homogeneous harms and Parfit cases.

  ---

  ### **Brief Theory Scorecard**  
  Assessed against desiderata (✓ = satisfies, ✗ = violates, ~ = partially):  

  | Desideratum                  | Continuous Aggregative Utilitarianism | Lexical/Threshold View | Pairwise Comparability |
  |------------------------------|--------------------------------------|------------------------|------------------------|
  | Transitivity                 | ✓ (by construction)                  | ✗ (threshold jumps break transitivity) | ✓ (trades define ordering) |
  | De Minimis                   | ✗ (all harms count)                  | ✓ (ignores below threshold) | ✓ (incommensurable harms excluded) |
  | Harm-Spreading (Parfit)      | ✓ (aggregates perfectly)             | ✗ (imperceptible harms ignored) | ✗ (fails if harms are comparable) |
  | Separability                 | ✓ (independent utilities)            | ✓                      | ~ (depends on trade acceptability) |
  | Overwhelming Obligations     | ✗ (obligations explode)              | ✓ (ignores tiny harms) | ✓ (if harms incommensurable) |

  - **Utilitarianism**: Strong on Transitivity/Harm-Spreading/Separability but violates De Minimis and causes Overwhelming Obligations.  
  - **Threshold View**: Respects De Minimis/Avoids Obligations but fails Transitivity and Harm-Spreading catastrophically.  
  - **Pairwise Comparability**: Excels on De Minimis/Avoids Obligations but fails Harm-Spreading and struggles with uniform harms.  

  ---

  ### **Conclusion**  
  The desiderata reveal a central tension: **Harm-Spreading** (non-negotiable) demands that tiny harms aggregate in Parfit-style cases, but this clashes with **De Minimis** (camp-specific) and risks **Overwhelming Obligations** (pragmatic concern). **Transitivity** and **Separability** are robust requirements. Pairwise comparability is a viable path but must address homogeneous harms. The real challenge is balancing structural harms against intuitive thresholds—suggesting no theory will satisfy all intuitions, but Harm-Spreading is the litmus test for adequacy. If you and your friend prioritize different desiderata (e.g., Harm-Spreading vs. De Minimis), the "adequate principle" debate hinges there.
