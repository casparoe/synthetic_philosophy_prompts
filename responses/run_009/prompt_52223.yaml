prompt: |-
  Hey, I've been going down a Kripke rabbit hole (rigid designators, necessary a posteriori, all that) and I want to stress-test it on something that isn't water and H2O for once. The episode: the 2006 IAU meeting in Prague where a few hundred astronomers voted to reclassify Pluto as a "dwarf planet," partly prompted by the discovery of Eris, which some people were briefly calling the tenth planet. I want an analysis of that whole mess through the Kripkean lens, and I want it to run both ways — the theory illuminating the episode, and the episode testing the theory.

  Because my notes are a mess I need this in a rigid format: exactly five numbered points, no intro or conclusion, each point a sentence or two (three if you absolutely need it). Assign them like this:

  1. What "Pluto" designates across the 2006 boundary — is it a rigid designator, and did the vote change what Pluto is, what "planet" means, or just our beliefs about Pluto?
  2. Whether "Pluto is not a planet" comes out necessary a posteriori, contingent, or basically analytic-by-committee-stipulation under Kripke's framework.
  3. The name vs. natural kind term question — whether "Pluto" and "planet" behave differently in the machinery, and why that difference decides point 2.
  4. The earlier case of Ceres: called a planet for about half a century after its 1801 discovery, then demoted once other asteroids turned up. Does the fact that a committee vote moved "planet" around show it was never really functioning as a natural kind term, or does Kripke have room for that?
  5. Your honest verdict on where the framework strains — e.g. the externalist thought that meanings aren't up to conferences sits weirdly next to the fact that the IAU vote did change something linguistic. If applying the framework forces you to say Prague "discovered a necessary truth about Pluto," is that a reductio of the theory or of my applying it here?

  Don't give me the water/H2O boilerplate, I've read it a hundred times. And no citations or reading lists, I cant check references from where I am — just positions and arguments. If some part of this is where the theory goes silent rather than speaks, say that instead of forcing an answer, that's honestly the part I care about most.
