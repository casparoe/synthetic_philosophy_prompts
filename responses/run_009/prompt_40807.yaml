  ## BUREAU OF PHENOMENAL CAUSATION AUDITS  
  **ANNUAL CASELOAD REPORT - FISCAL YEAR 23**  
  **Report Ref:** BPCA/AR/23-327  
  **Issue Date:** 15 Thermidor, 223  
  **Prepared By:** Director Helena Voss  

  ### 1. EXECUTIVE SUMMARY
  The Bureau processed 4,327 formal claims alleging illicit causal activity by phenomenal properties (Designated Qualia Class QC-1 through QC-7) during FY23. All claims underwent Tier-3 Audit Protocol. Findings confirm 100% compliance with Section 8(a) of the Unified Qualia Act ("No phenomenal property shall exert causal influence upon physical states or events"). Case resolution aligns statistically with FY21 (4,281 cases, 100% compliance) and FY22 (4,398 cases, 100% compliance).

  ### 2. METHODOLOGY & SCOPE
  *   **2.1** Claims initiated via Form QC-114 ("Report of Suspected Qualia-Induced Action/Utterance").
  *   **2.2** Audits deployed within 72hrs. Standard procedure: neural event reconstruction (NerScan-7™), environmental data correlation, claimant interview (Recorded/Transcript), biometric monitoring.
  *   **2.3** Causation assessed against Neural Primacy Standard (NPS-9): *Physical brain states/processes must constitute the necessary and sufficient proximal cause of the reported action/utterance, with no evidential pathway for qualia intermediation.*

  ### 3. PRIMARY FINDINGS
  *   **Finding 3.1 (Incident QC-23-18845):** Utterance "My head is splitting!" (Claimant: Fabrication Tech, Grade IV) during migraine episode. NerScan confirmed patterned nociceptor activation in somatosensory cortex (S1) preceded utterance by 412ms. Motor speech center activation (Broca's area) correlated precisely with utterance articulation. No anomalous energy signatures or causal gaps detected. **Conclusion:** Neural cascade consistent with NPS-9.
  *   **Finding 3.2 (Incident QC-23-20901):** Exclamation "The red! It’s overwhelming!" (Claimant: Visual Artist) during sunset observation. Foveal retinal input, V4 color complex activation, and amygdala response (aesthetic appraisal) formed unbroken chain to vocalization. Atmospheric scattering data confirmed light wavelength properties. **Conclusion:** Neural processing of visual stimulus sufficient cause.
  *   **Finding 3.3 (Incident QC-23-21567):** Statement "I only said 'I love you' because the feeling made me" (Claimant: Civilian, Relationship Event). Full limbic system and prefrontal cortex engagement recorded preceding utterance, linked to pheromonal detection and memory recall. **Conclusion:** Affective neural circuitry activated motor response. Qualia (reported feeling) temporally concomitant but causally inert per NPS-9.
  *   **Finding 3.4 (Incident QC-23-19822):** Claimant (Retail Logistics) asserted tears during interview were "proof the sadness itself made me cry." Biometric tear analysis (salinity, rate) and concurrent lacrimal gland nerve stimulation tracked directly to amygdala-hypothalamus-pituitary axis activation triggered by memory recall prompts. **Conclusion:** Tears constituted a physiologically standard stress response. Emotional qualia remained epiphenomenal.
  *   **Finding 3.5 (Incident QC-23-22734 - Philosopher Case):** Claimant: Dr. Aris Thorne (Metaphysics Dept., Provincial University). Argued testimony "The pain is unbearable" was *caused by the pain quale itself*, analogous to smoke being caused by fire. Asserted testimony is the "reliable causal signature" of the quale. *(See Appendix Γ for full transcript)*.

  > **Bureau Response (Excerpt):** Audit acknowledges Claimant Thorne's testimony as *evidence for the occurrence* of a reported pain quale (QC-3), per Standard Evidence Rule §8.11. However, NerScan reconstruction established the following neural sequence: 1) Nociceptor activation, 2) C-fiber signaling to thalamus, 3) Somatosensory cortex (S1/S2) processing, 4) Anterior cingulate cortex (ACC) affective response, 5) Pre-motor and Broca's area formulation, 6) Utterance execution. Each stage demonstrated physical sufficiency. While testimony reliably indicates quale occurrence (§8.11), the Bureau's mandate requires *identifying the specific physical cause of the testimony*. The sequence above fulfills this requirement. The analogy posited by the Claimant, while coherent, describes a causal pathway the Bureau is unable to isolate or confirm within the physical audit framework. **Conclusion:** Testimony caused by integrated pain-processing neural activity. Qualia causation unverified.

  ### 4. REGULATORY OBSERVATION
  *   **Observation 4.1:** Standard Evidence Rule §8.11 ("Admissibility of First-Person Testimony") remains in full effect. Testimony concerning qualia is:
      *   (a) Admissible as *prima facie* evidence *that* a quale of the reported class (QC-1-7) occurred.
      *   (b) Inadmissible as evidence *that the quale caused* the testimony, or any subsequent action/report. Causation determination requires Tier-3 Audit per NPS-9.

  ### 5. CONCLUSION
  The Bureau's findings for FY23, consistent with all prior operational years, affirm the robust adherence to epiphenomenalist principles as codified. Physical processes, fully auditable via established neurological and biophysical methodologies, account for all actions and utterances investigated, including those reporting or responding to phenomenal experiences. The Bureau notes that the compilation, analysis, and conclusions presented within this report, including Director Voss's signature, are themselves the product of physical causal chains within Bureau personnel and systems. The Bureau takes no position on the potential subjective implications of this consistent finding for individual citizens or the philosophical community.

  **Director Helena Voss**  
  Bureau of Phenomenal Causation Audits

  ---
  **Appendix Γ (Incident QC-23-22734 Excerpt):**  
  *Thorne:* "You're missing the point! My *saying* 'It hurts' isn't just correlated with the pain, it's *smoke from the fire*! The quale *makes* its report known!"  
  *Auditor Finch:* "Understood, Professor. The scan shows the fire alarm (so to speak) was pulled by C-fiber activation leading to ACC engagement, which then triggered Broca's area. We register the smoke. We've mapped the entire alarm system. The fire itself... remains on the non-causal docket."
