prompt: |-
  I teach a mid-level course on well-being -- 16 students, one 75-minute session. Next week we hit Nozick's experience machine, and honestly the machine by itself has gotten stale: everyone's heard of it, half of them think the answer is obvious, and the discussion dies in five minutes. I want an in-class game that makes them feel the pull from the inside, before they realize what question we're actually asking.

  Here's what I've been mulling: the machine is supposed to be an argument against hedonism, but the cases that really trip my students up are the ones that split hedonism from desire-satisfaction theories -- lives where the experience is great but the world quietly fails to cooperate (the partner who secretly despises you, the achievements that turn out to be fake, the person whose desires all get satisfied but only in ways they never find out about). So I'd like the game to walk them down that ladder: start with ranking lives purely by what they feel like from the inside, then have facts leak out gradually, and see where their rankings crack and why.

  Constraints: no real money, no one has to role-play being personally deceived by me (they hate that), and it has to run on index cards and envolopes. I'd like some scoring or payoff structure so that at each stage there's a defensible "right answer" under each theory -- that way in the debrief we can look back at round 2 and ask each of them "which theory were you actually using there?" And I don't want the machine mentioned by name until the very end, if at all.

  Plus the usual stuff: a debrief that maps what happened onto hedonism vs. desire-satisfaction vs. objective-list views, a note on what will predicatably go sideways the first time I run it, and honesty about which part of the philosophical problem a game just cannot reproduce (I'm guessing something like the weight of actually being asked to plug in can't be staged, but tell me if you disagree).
reasoning: |-
  Okay, the user is teaching a mid-level course on well-being and wants to revitalize the discussion around Nozick's experience machine. They feel the standard approach is stale because students are already familiar with it, and discussions die quickly. Their main goal is to create an in-class game that makes students feel the tension between hedonism and desire-satisfaction theories internally before they realize what's being asked. 

  The key points from their query: They want a game that starts with ranking lives based solely on internal experience, then gradually introduces external facts. This should help students see where their rankings change as more information is revealed. The constraints are important—no real money, no role-playing deception, using only index cards and envelopes. They also want a scoring system where each round has a defensible "right answer" under different theories, to facilitate debriefing. The experience machine shouldn't be mentioned until the end.

  Hmm, the user is clearly experienced—they've identified specific pain points (students finding the machine obvious, discussions fizzling) and have a nuanced understanding of where students get stuck (the divergence between hedonism and desire-satisfaction). They're not just looking for a fun activity but a pedagogical tool that creates cognitive dissonance. The emphasis on "feeling the pull from the inside" suggests they want students to confront their own intuitions before intellectualizing the debate.

  The deeper need here might be combating desensitization to classic thought experiments. Students hearing about the machine for the nth time might dismiss it as "obvious" without genuinely engaging the tension. By making it visceral through a game, the user hopes to bypass that defensiveness. Also, their focus on desire-satisfaction edge cases (secretly despised partners, fake achievements) hints they want students to see hedonism's limits beyond the usual "but reality matters!" knee-jerk.

  For the game structure... Starting with pure experience ratings makes sense for hedonism. Then leaking facts in stages mirrors how desire-satisfaction requires correspondence between mental states and the world. The scoring should reward consistency with each theory: e.g., in early rounds, high scores for matching internal states (hedonism), later for aligning with external truth (desire-satisfaction). Index cards can hold life descriptions, envelopes hide the "truth" slips to reveal later.

  Potential pitfalls: Students might strategize once they grasp the pattern, so randomizing reveal order or adding decoy facts could help. Also, some might resist changing rankings ("I stand by my initial rating!")—forcing re-ranks after each reveal prevents this. The debrief needs to explicitly map rounds to theories: "When you ignored the leaked facts in Round 2, you were acting like a hedonist..."

  What the game can't capture: The existential weight of *choosing* the machine. A game can simulate epistemic shifts ("Oh, my desires weren't satisfied!") but not the lived commitment of plugging in. That’s okay—the user seems aware of this. They’re wisely avoiding role-play deception, which could backfire pedagogically and ethically.

  Final thought: Naming the game something like "Life Rating Agency" keeps it spoiler-free. The reveal that they were testing theories all along should feel like an "aha!" moment, not a gotcha.
answer: |-
  Here’s a **"Life Rating Agency"** game designed to meet your goals, using only index cards, envelopes, and a whiteboard. It creates a gradual reveal of hidden truths, forcing students to confront the tension between felt experience and external reality—without role-playing deception.

  ---

  ### **Game Setup: Life Rating Agency**  
  *Premise:* Students work for a "Life Quality Bureau" rating hypothetical lives for a client. They’ll rank lives in 3 rounds based on escalating information.  

  **Materials per Student:**  
  - 1 index card with a **Life Description** (internal perspective only)  
  - 1 sealed envelope containing **Hidden Truths**  
  - 1 scoring sheet (paper or whiteboard)  

  **Life Examples (4 distinct lives, 4 cards per life × 16 students):**  
  1. **The Artist:** *"You feel deep joy creating paintings hailed as masterpieces by critics. Your gallery shows sell out."*  
     *Hidden Truth:* Critics pretend to praise you to avoid offending your wealthy benefactor.  

  2. **The Partner:** *"You feel deeply loved by your spouse. You share intimate moments and mutual support daily."*  
     *Hidden Truth:* Your spouse stays for your inheritance and secretly despises you.  

  3. **The Hero:** *"You experience pride saving children from a burning building. The media calls you a legend."*  
     *Hidden Truth:* The "rescue" was staged by a film crew; no children were in danger.  

  4. **The Philanthropist:** *"You feel fulfilled funding orphanages across the globe. You receive heartfelt thanks from staff."*  
     *Hidden Truth:* Your donations were embezzled; the "orphanages" are empty shells.  

  *(Distribute cards randomly so each student rates 1 life.)*  

  ---

  ### **Game Flow**  
  **Round 1: The Feelings Report**  
  - *Task:* Rate your assigned life **1–10** based *only* on described feelings (joy, love, pride, fulfillment).  
  - *Scoring:* Score = Rating (e.g., rate 8 → 8 points).  
  - *Theory Alignment:* Pure **hedonism**. High ratings = high well-being.  

  **Round 2: The Rumor Mill**  
  - Reveal *one* **Hidden Truth** (e.g., "For *The Artist*: Critics are paid to praise you").  
  - *Task:* Re-rate your life **1–10** (adjust or keep the same).  
  - *Scoring:* Score = (Round 1 rating × 2) + (Round 2 rating).  
  - *Theory Tension:*  
    - Keeping a high rating? Still hedonist (feelings unchanged).  
    - Lowering it? Leaning **desire-satisfaction** (truth invalidates desires).  

  **Round 3: Full Disclosure**  
  - Reveal *all* **Hidden Truths** for every life.  
  - *Task:* Re-rank **all 4 lives** from best (1) to worst (4).  
  - *Scoring:* Score = 20 – (Your life’s rank). *Plus* bonus: If your final ranking matches the class consensus, +5 points.  
  - *Theory Clash:*  
    - Ranking based on feelings? **Hedonism** (e.g., "The Partner still *feels* loved").  
    - Ranking based on truth? **Desire-satisfaction** (e.g., "The Hero’s achievement was fake").  
    - Ranking based on "meaning"? **Objective-list** (e.g., "Empty philanthropy is worthless").  

  ---

  ### **Debrief Structure**  
  1. **Map the Game to Theories:**  
     - Round 1 = **Hedonism** (well-being = positive experience).  
     - Round 2 = **Desire-Satisfaction** (well-being requires desires *actually* fulfilled).  
     - Round 3 = **Objective-List** (well-being requires real value, e.g., authenticity, achievement).  

  2. **Pivotal Questions:**  
     - *"In Round 2, did your rating drop? If so, were you rejecting hedonism, or just updating desires?"*  
     - *"In Round 3, why did Life X outrank Life Y? Was it about feelings, truth, or something else?"*  

  3. **Reveal the Machine:**  
     - *"You’ve been wrestling with Nozick’s question: If you can’t tell the difference, does truth matter? Round 1 was the machine. Round 3 was reality."*  

  ---

  ### **What Will Go Sideways (and How to Fix)**  
  - **Problem:** Students "game" the scoring system (e.g., artificially lower Round 2 ratings to win later).  
    *Fix:* Announce scoring rules *after* each rating. Keep formulas simple to avoid strategy.  
  - **Problem:** Consensus ranking in Round 3 gets contentious.  
    *Fix:* Have groups of 4 debate first, then share rankings. Focus on *reasons*, not scores.  
  - **Problem:** Some insist feelings trump truth ("Ignorance is bliss!").  
    *Fix:* Press: *"Would you choose your Partner’s life if you knew the truth? Why/why not?"*  

  ---

  ### **What the Game Can’t Capture**  
  - **The Weight of Choice:** Choosing to plug into the machine involves *sacrificing agency*—a loss no game can simulate. Students aren’t *actually* risking their futures.  
  - **Deep Self-Awareness:** The machine asks, *"What matters to you—really?"* A game can hint at this, but true self-reflection happens in post-game writing or discussion.  

  ---

  **Why This Works:**  
  - **Stealth Philosophy:** Students engage the tension *before* labeling it, making the "obvious" machine feel newly urgent.  
  - **Constraints Honored:** No deception, no money, low-tech. Scoring creates stakes while revealing theoretical commitments.  
  - **Aha Moment:** When Round 3 rankings fracture, they’ll *feel* why desire-satisfaction and objective-list theories exist.  

  Let me know if you’d like printable life cards or a sample scoring sheet!
