prompt: |-
  My roommate and I have been arguing about Parfit's nonidentity problem all week and I want a tiebreaker with numbers attached. Quick setup: a depleting society (or just think climate policy) can either conserve resources or deplete them; if it depletes, the people who exist a century later are numerically different people than the ones who would have existed under conservation, because different policies change who meets whom and who has kids with whom. So if depletion leaves the future people with lives still worth living, it looks like no one is harmed in the counterfactual sense — the depleted-future people would never have existed under the conservation policy. My roommate thinks this is basically a curiosity that doesn't touch our real obligations to future people (he's at maybe 0.7 that nonidentity is a genuine problem for standard harm-based climate ethics), whereas I'm more like 0.35 — I suspect the whole thing rests on treating "making someone worse off than they would have been" as the only way to wrong someone, and I think you can wrong people without making them worse off counterfactually.

  Please act as a philosopher who specializes in population ethics and give me your actual credence that the nonidentity problem genuinely undermines (not merely complicates) the claim that we wrong future people through environmentally destructive policies. But don't just give me a bare number — decompose it. I'd want at least: your probability that the person-affecting restriction is true (roughly, that morality only concerns making particular people worse off, as opposed to impersonal comparisons about how good the world is); your probability that "harming" requires counterfactual dependence, given that most other wrongs we recognize (breaking a promise to someone, say) don't seem to need it; your probability that Parfit's own style of response — that identity just isn't the moral watershed it's been assumed to be, that what matters is what we do to people and not which people there are — can be made to work without collapsing into counterintuitive conclusions elsewhere; and any other terms you think belong in the decomposition. Then combine them into your final number.

  Also two follow-ups I care about: which single term is doing the most work, i.e. which sub-question would move your credence the most if you resolved it, and where do you think my 0.35 and my roommate's 0.7 most likely diverge — is he really just more confident in the person-affecting restriction, or is something else going on, like him thinking the whole identity-sensitivity of who-exists is overblown as an empirical matter? Take your time and brainstorm a bit before commiting to numbers, and please flag anywhere you think the decomposition itself is doing shaky philosophical work (like double-counting terms that aren't really independent). If you genuinely think there's no fact of the matter here about which one could have a credence, say so, but then still tell me what you'd assign to the closest question that does have a truth value.
