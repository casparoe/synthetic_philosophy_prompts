prompt: |-
  I help run a small ethics discussion group (not academics, just people who like arguing over drinks) and next month's topic is pest control -- like, is spraying your kitchen for ants actually OK? I want a taxonomy handout from you, formatted as a decision tree, that sorts people into a position on whether and when insecticides and pest control are permissible.

  A few things I care about, since the generic "are insects sentient?" framing gets stale fast:

  1. One branch question has to be about the deterrent-vs-killer distinction, which I think is underrated. A repellent, a fence, sealing the cracks -- these stop insects from ever being in your kitchen, whereas bait poisons the ones already living there. Some people will say deterring future ants is fine even if killing the current colony isn't, which is a weird procreation-flavored asymmetry, and I want a node that catches whether someone actually draws that line.

  2. Another node should be about whether "pest" is a relational fact. A termite chewing a dead log in the forest is just doing termite stuff; the same termite in your house's beam is a pest. If preventing property damage can license killing, is it the termite's location that matters, or the damage, or neither?

  3. A third on uncertainty about invertebrate sentience -- does the mere possibility that insects feel something force a precautionary approach, or is it fine to act on your best estimate that they mostly don't?

  The deliverable: a tree where every branch node is phrased as a question someone could answer without having any idea which position it leads to, and each leaf carries a name (use a real recognizable view if there is one, "unnamed" if not) plus one sentence on that leaf's most awkward commitment. Build the tree from the questions and the logical space first, then afterwards say where actual positions land in it. Note any answer combinations nobody holds, and say whether you think that's because the combo is incoherent, just unattractive, or merely unexplored. And flag any two leaves your tree can't genuinely seperate rather than pretending it's fine.

  Keep it usable by non-philosophers -- concrete cases at each node (kitchen ants, a wasp nest over the daycare entrance, neighborhood-wide mosquito spraying, farm pesticide runoff into a stream), not abstract principles. Aim for something like 6 to 9 leaves. No citations or reading lists needed, I just want the tree itself so I can photocopy it.
reasoning: |-
  Okay, the user runs a casual ethics discussion group and needs a decision tree handout on pest control ethics. They want something concrete, avoiding academic jargon, with three specific nodes: deterrent vs killer methods, relational "pest" status, and uncertainty about insect sentience. 

  Hmm, they're clearly frustrated with shallow "are insects sentient?" debates. Good - this means I should ground everything in visceral examples: kitchen ants versus forest termites, wasp nests at daycares. Their request about the "procreation-flavored asymmetry" suggests they've noticed how people inconsistently value existing versus future insects. Clever observation.

  The relational pest point is crucial. That termite-in-forest versus termite-in-house framing forces people to confront whether morality depends on location or just damage caused. I'll need examples where the same species transitions from "neutral" to "pest" based solely on human context. 

  For the uncertainty node, the precautionary principle debate needs simplifying. Maybe contrast "better safe than sorry" against "can't live paralyzed by doubt" stances. Their "awkward commitments" requirement means each leaf position must have an uncomfortable implication - like accepting home termite damage or admitting inconsistency.

  Structure-wise... start with intentionality? No, better begin with the most intuitive split: prevention versus elimination. Then branch into the relational question before hitting sentience uncertainty. Need to ensure combinations cover real-world positions but also expose logical gaps. 

  Ah - and they want me to note where no real positions exist. Like that "only deter but kill invasive species" leaf - probably empty because if you care about ecosystems, you'd want invasive removal, but if you're anti-killing, deterrence feels insufficient. That tension deserves flagging.

  Visual flow matters for photocopying. Keep questions punchy: "Is the problem what they ARE or WHERE they are?" with concrete examples. Label positions with recognizable names like "Pest Utilitarian" or "Minimal Harm" rather than dry academic terms. 

  Most importantly - every branch must feel live to someone arguing over beers. If a node doesn't spark debate, it's useless. The wasp-nest-over-daycare example should make people shift uncomfortably in their seats. Perfect.
answer: |-
  Here's a decision tree designed for tangible debates, with your requested nodes highlighted. Print-ready version follows the logic notes:

  **Pest Control Ethics Decision Tree**  
  *Answer each question based on immediate intuition. Concrete examples are provided at nodes.*

  ---

  **1. START: Is your primary goal to PREVENT pests from becoming a problem (sealing cracks, repellents, traps) or to ELIMINATE an existing problem (spraying nests, poison baits)?**  
  *Example: Kitchen ants – blocking entry vs. killing the colony.*  
  → **If PREVENT:** Go to Q2.  
  → **If ELIMINATE:** Go to Q3.  

  **2. (Prevention Focus) Do you believe preventing *future* harm justifies methods that might incidentally harm/kill *individual* pests?**  
  *Example: Mouse trap snapping a paw vs. ultrasonic repellent.*  
  → **If YES:** *Leaf 1: **"Preventive Permissivist"***  
   *Awkward Commitment: You accept that "humane" deterrents may still cause suffering/death to scouts or explorers.*  
  → **If NO:** *Leaf 2: **"Strict Deterrence-Only"***  
   *Awkward Commitment: You must tolerate some pests if 100% harmless prevention fails (e.g., ants in sugar bowl if cracks exist).*  

  **3. (Elimination Focus) Is the pest causing harm primarily because of WHAT IT IS (e.g., venomous spider) or WHERE IT IS (e.g., termite in your house vs. forest)?**  
  *Example: Wasp nest over daycare entrance vs. same nest deep in woods.*  
  → **If WHAT IT IS:** Go to Q4.  
  → **If WHERE IT IS:** Go to Q5.  

  **4. (Harm by Nature) Is the certainty of insect suffering low enough that killing is acceptable for human safety/health?**  
  *Example: Spraying disease-carrying mosquitoes vs. killing harmless attic moths.*  
  → **If YES:** *Leaf 3: **"Safety-Prioritizing Utilitarian"***  
   *Awkward Commitment: You license killing "scary" pests even with low actual risk (e.g., solitary wasp indoors).*  
  → **If NO:** *Leaf 4: **"Sentience Precautionist"***  
   *Awkward Commitment: You must avoid lethal control for most insects unless threat is extreme/immediate (e.g., tolerating bed bugs while seeking non-lethal solutions).*  

  **5. (Harm by Location) Does the pest's location (your property) justify killing it to prevent damage?**  
  *Example: Termites in heritage home beam vs. same termites in dead park tree.*  
  → **If YES:** *Leaf 5: **"Property Defender"***  
   *Awkward Commitment: You accept that ownership/licensed harm applies to living things (e.g., killing squirrels chewing wires).*  
  → **If NO:** *Leaf 6: **"Ecological Relativist"***  
   *Awkward Commitment: You must allow structural/crop damage if relocation isn't feasible (e.g., letting carpenter ants destroy your shed).*  

  **6. (From Q3 - Elimination & Uncertain Harm Source) Considering uncertainty about insect suffering, must we act as if they CAN feel pain?**  
  *Example: Spraying aphids on roses vs. flea treatment on a dog.*  
  → **If YES:** *Leaf 7: **"Invertebrate Rights Precautionist"***  
   *Awkward Commitment: You oppose almost all insecticide use, including agricultural sprays causing mass death, due to unknown sentience.*  
  → **If NO:** *Leaf 8: **"Pragmatic Skeptic"***  
   *Awkward Commitment: You risk causing profound suffering if insects are sentient (e.g., using slow-acting ant baits).*  

  ---

  **Logical Map & Notes for Facilitators:**  
  - **Leaf Summary:**  
    1. *Preventive Permissivist:* Deterrence OK even if messy.  
    2. *Strict Deterrence-Only:* Zero tolerance for killing; accept failures.  
    3. *Safety-Prioritizing Utilitarian:* Kill if threat plausible.  
    4. *Sentience Precautionist:* Avoid killing unless dire.  
    5. *Property Defender:* Location justifies lethal defense.  
    6. *Ecological Relativist:* "Pest" is arbitrary; no killing for property.  
    7. *Invertebrate Rights Precautionist:* Assume sentience, minimize harm.  
    8. *Pragmatic Skeptic:* Act on evidence; sentience unlikely.  

  - **Unpopulated Branches:**  
    - *Q2 → YES + Q3 → WHAT IT IS → NO (Leaf 4)* is rare. If you focus **only** on prevention yet reject *any* incidental harm, you logically **shouldn't** endorse killing based on inherent traits. This combo is **incoherent** – prevention-first advocates rarely support inherent "bad" insect categories.  
    - *Q3 → WHERE IT IS → NO (Leaf 6) + Q6 → NO (Leaf 8)* is **unattractive**. Denying location-based harm-license *and* dismissing sentience uncertainty leaves no coherent basis for *ever* killing pests (yet Leaf 8 permits it). Most who reject location-based harm (Leaf 6) *also* take sentience seriously (Leaf 7).  

  - **Indistinguishable Leaves?**  
    - *Leaf 4 (Sentience Precautionist)* and *Leaf 7 (Invertebrate Rights Precautionist)* are siblings under different branches. Both prioritize reducing harm amid uncertainty. Facilitator note: Leaf 4 responds to **known threats** (venom), Leaf 7 to **uncertainty itself**. They may sound similar – probe if "threat" justifies overriding precaution.  

  - **Where Positions Land:**  
    - **Environmentalists** often cluster at *Leaf 2 (Strict Deterrence-Only)*, *Leaf 6 (Ecological Relativist)*, or *Leaf 7 (Invertebrate Precautionist)*.  
    - **Homeowners/Pragmatists** lean toward *Leaf 1 (Preventive Permissivist)*, *Leaf 3 (Safety Utilitarian)*, or *Leaf 5 (Property Defender)*.  
    - **Agriculture/Public Health** advocates typically land at *Leaf 3 (Safety Utilitarian)* or *Leaf 8 (Pragmatic Skeptic)*.  
    - **Animal Rights Expansionists** favor *Leaf 4* or *Leaf 7*.  

  **Formatting Tip:** Photocopy as-is or redraw as a flowchart. Use the examples during discussion to ground abstractions ("What would Leaf 5 say about the wasp nest at the daycare?"). The "awkward commitments" force honesty about trade-offs.
