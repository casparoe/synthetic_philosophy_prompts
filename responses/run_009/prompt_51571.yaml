prompt: |-
  My closest friend is finishing a physics degree, and after a long argument over dinner I walked home with a question I can't put down. She was describing how her curriculum handles superseded theories, and the pattern is stranger than I'd assumed. Newtonian mechanics gets drilled as the standard tool for orbits and pendulums even though the course on relativity declares absolute space and time to be mistakes; the wave theory of light was originally worked out for waves rippling through an ether, and when the ether was abandoned the equations were kept essentially intact; even the mathematics of heat conduction was first derived in a theory that treated heat as a fluid pervading bodies, and that fluid is now said never to have existed, yet the equations are in every textbook. So the same institution, in the same degree, teaches that these theories were wrong about what there is and right enough about the numbers to keep using forever. At one point she said something like "so we keep the structure and throw away the furniture," and dropped the phrase "structural realism," which is how I ended up reading philosophy of science at 2 a.m. instead of sleeping.

  What I want to know is what this teaching practice actually presupposes, because my friend and I couldn't agree even on that much. She thought it obviously presupposes that a theory's equations can be approximately true while everything the theory says exists is flatly false. I pushed back: calling an equation "approximately true" already assumes you know what it is that's true — if it's just a pattern in the numbers that keeps surviving theory change, maybe the practice doesn't presuppose anything so strong, and a thoroughgoing pragmatist or instrumentalist could run the same curriculum without embarrassment. And there's a second wrinkle, which is that the same textbooks teach electrons, quarks, and fields in a confident realist register, as things that exist, while treating the discarded ontologies of the past as never having existed. Is the practice then committed to some asymmetry — current ontology believed, past ontology discounted, mathematics trusted across the board — and is that combination actually coherent, or is it just historical accident dressed up as philosophy?

  So: reconstruct the view of scientific knowledge and of truth that this pedagogical practice needs in order to make sense, and tell me where it is genuinely underdetermined — which rival philosophies could license the same curriculum without strain. Then say where the practice presupposes things that don't fit together, if anywhere: the confidence about current unobservables, the agnosticism about superseded ones, and the loyalty to the surviving mathematics seem to pull in different directions. Finally, suppose we replaced whatever implicit view it rests on with a straightforward instrumentalism — what, concretely, would have to change in how the curriculum is taught, and what would be immune to change? I want the answer to distinguish sharply between what the practice strictly requires and what it merely sits comfortably with, because that distinction is exactly where my friend and I got stuck.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're grappling with how physics education handles superseded theories—keeping the equations but discarding the ontology. Their friend mentioned structural realism, and they stayed up all night reading philosophy of science. The core question is what this teaching practice presupposes about scientific truth and knowledge.

  First, I need to identify the key elements: the retention of mathematical structures (equations) while rejecting the ontological claims (like ether or caloric fluid). The user is challenging their friend's view that this implies equations can be approximately true even if the ontology is false. They suggest maybe it's more pragmatic. Also, there's an asymmetry: current entities like electrons are taught as real, while past ones are dismissed. Is that coherent?

  The user wants a reconstruction of the underlying philosophy, which rival theories could support the same practice, where there might be tensions, and what would change if they switched to instrumentalism. They emphasize distinguishing strict requirements from what's merely compatible.

  I recall structural realism (SR) as a central framework here. SR, especially epistemic, posits that only the structural (mathematical) content survives theory change. Ontologies are discarded, but structures persist. That seems to fit the "keep structure, throw away furniture" analogy. But the user questions if approximate truth of equations is necessary. Maybe other philosophies like instrumentalism or constructive empiricism could work too.

  The asymmetry in teaching current vs. past ontologies is tricky. Realists might argue that current theories are better confirmed, but history shows past theories were once considered confirmed too. This could be a point of tension. If the practice treats current entities as real but past ones as false, it might presuppose convergent realism or some form of selective skepticism.

  For rival philosophies: Instrumentalism sees theories as tools, not truth-apt. So equations are useful, not true. This could accommodate the practice without claiming truth for any part. Constructive empiricism (van Fraassen) says theories aim to save phenomena; belief is only in observables. Both could justify retaining equations and discarding ontology without the asymmetry issue, but they'd avoid asserting reality of unobservables like electrons.

  Where the practice might be incoherent: The confidence in current unobservables versus dismissal of past ones. If we're skeptical of past ontologies, why trust current ones? This seems to rely on an implicit belief in progress or increased verisimilitude, which is debatable. Also, the retention of mathematics across theories suggests structural continuity, but the ontological shifts might undermine that if structures are tied to specific ontologies.

  Switching to instrumentalism: Teaching wouldn't claim electrons exist; they're just useful fictions. The equations predict, but there's no ontological commitment. The emphasis shifts to predictive power over explanation. However, the curriculum might still present theories instrumentally, avoiding realist language. But would this change how students engage with the material? Maybe less emphasis on understanding "what is" and more on calculation.

  Strict requirements: The practice must treat mathematical structures as pragmatically reliable. It doesn't strictly require that any part is true, but it does need a distinction between durable equations and discardable ontologies. It must also justify teaching current theories with realist confidence, which instrumentalism might avoid.

  Areas of underdetermination: The practice is compatible with various philosophies as long as they value mathematical tools and distinguish structure from ontology. The asymmetry isn't logically necessary; one could be uniformly skeptical or realist. But the current approach likely stems from a realist intuition that today's science is more accurate, even if not explicitly stated.

  Incoherence points: The selective realism might be inconsistent without a robust account of why current entities are different. Without structural realism's claim of structural continuity, the reliance on past equations might seem arbitrary. Also, if structures are preserved, why not ontologies? Unless structures are ontologically neutral, which is contentious.

  I should also consider entity realism (Hacking), where intervention justifies belief in entities. But even that might not resolve why past entities (like ether) are deemed non-existent if they were once manipulable.

  Ultimately, the teaching practice sits comfortably with structural realism but can be adapted to instrumentalism by dropping realist claims. The incoherence lies in the asymmetric ontological commitment without a clear epistemic justification, risking a "presentist" bias.
answer: |-
  This pedagogical practice reveals a sophisticated, contested philosophy of science in action. Let's reconstruct its presuppositions, tensions, and alternatives systematically.

  ### Core Presuppositions of the Practice
  1. **Structural Preservation & Ontological Elimination**:  
     - The practice assumes that *mathematical structures* (equations, symmetries, relationships) can persist through theory change while *ontological interpretations* (what the theory claims exists) are discarded.  
     - **Minimal Commitment**: Structures must be *pragmatically reliable* for prediction/calculation across domains. It does *not* strictly require that structures are "approximately true" (a stronger epistemic claim).  

  2. **Asymmetric Realism**:  
     - **Current Theories**: Treated realistically (electrons/fields *exist*). Presupposes that mature, empirically successful theories with novel predictions warrant ontological commitment.  
     - **Superseded Theories**: Treated as *false* about ontology but *structurally useful*. Assumes a historical break: past failures (e.g., ether's non-detection) justify rejecting their entities.  
     - **Mathematics**: Treated as *autonomously reliable*, transcending specific ontologies.  

  3. **Pragmatic Continuity**:  
     - Equations retain instrumental value even when derived from "false" ontologies (e.g., Fourier’s heat equation without caloric fluid). Assumes formal tools can be "de-ontologized" and repurposed.  

  ### Where the Practice is Underdetermined: Compatible Philosophies
  The curriculum *can* be taught without committing to structural realism. Rival philosophies accommodating it:  
  1. **Instrumentalism**:  
     - Equations are tools, not truth-apt statements. "Approximate truth" is unnecessary; success is measured by predictive utility. Superseded ontologies are discarded because they add no instrumental value.  
     - **Fits Practice**: Retains mathematical pragmatism without ontological claims.  

  2. **Constructive Empiricism (van Fraassen)**:  
     - Theories aim to be *empirically adequate* (save phenomena). Belief is reserved for observables; unobservables (current/past) are agnostic commitments. Mathematics survives as part of empirical content.  
     - **Fits Practice**: Current entities aren’t "real" but are useful constructs; past ontologies fail empirical adequacy.  

  3. **Entity Realism (Hacking/Cartwright)**:  
     - Trust entities we can *manipulate* (e.g., electrons in labs), not theories. Equations are reliable causal templates. Past entities (ether) never permitted intervention, so were always suspect.  
     - **Fits Practice**: Explains asymmetry via manipulability, not theory truth.  

  4. **Selective Skepticism**:  
     - Agnosticism about *all* unobservables. Mathematics survives as a stable instrument; ontology is heuristic.  
     - **Fits Practice**: Discards past ontologies and avoids strong realism about current ones.  

  **Conclusion on Underdetermination**: The practice *strictly requires* only that **mathematical structures are instrumentally valuable independently of their original ontology**. It does *not* require structural realism’s "structure is all we know" or scientific realism’s "approximate truth."  

  ### Tensions and Incoherences  
  1. **The Asymmetry Problem**:  
     - If past successful theories were wrong about ontology (ether), why trust *current* theories (electrons)? This assumes current science is "finally correct," ignoring the "pessimistic meta-induction" (Laudan): past theories were once as empirically successful as current ones.  
     - **Incoherence**: Confidence in current unobservables relies on an implicit progress narrative unsupported by history.  

  2. **Structural-Ontological Decoupling**:  
     - If equations are "kept intact" after ontological shifts, how are structures ontologically neutral? Ether-based wave equations *presupposed* a medium—yet they work without it. This suggests structures are either:  
       - (a) Abstract formalisms (compatible with instrumentalism), or  
       - (b) Descriptions of *real relations* (structural realism).  
     - **Tension**: The practice vacillates between (a) and (b) without justification.  

  3. **Mathematics as a "Miracle"**:  
     - Retaining equations from false theories risks making their success seem *miraculous* unless structures capture something real (a key realist argument). Pragmatists avoid this by denying the need for explanation.  

  ### Switching to Instrumentalism: What Would Change?  
  If the curriculum embraced thoroughgoing instrumentalism:  
  - **Changes**:  
    1. **Language of Existence**: "Electrons exist" → "Electron models predict outcomes."  
    2. **Historical Narratives**: Past theories aren’t "wrong" but "superseded instruments"; ether becomes a useful fiction, not a disproven entity.  
    3. **Emphasis**: Focus shifts from *explanation* (why phenomena occur) to *calculation* (how to model them).  
    4. **Current Ontology**: No longer taught as "discovered reality" but as "best available tool."  

  - **Immune to Change**:  
    - **Core Mathematics**: Fourier transforms, Newtonian limits of GR, and wave equations remain taught identically.  
    - **Pragmatic Justification**: "Use what works" persists.  
    - **Empirical Grounding**: Success still measured by predictions.  

  ### Conclusion: The Practice’s Philosophical Hybrid  
  The pedagogy sits most comfortably with **epistemic structural realism** (ESR), which holds that we can know structural content (equations) but not the underlying ontology. ESR justifies retaining equations while discarding "furniture" and allows cautious realism about structures in current theories. However, it *strictly requires only*:  
  - A distinction between **durable mathematical tools** and **discardable ontologies**.  
  - **Pragmatic sanction**: Keep structures that remain useful.  

  The asymmetry (current realism vs. past antirealism) is a cultural artifact, not philosophical necessity—a "presentist bias" reflecting science’s institutional authority. A consistent instrumentalist or empiricist could teach the same curriculum by neutering the realist rhetoric, but the practice *as is* implicitly endorses ESR’s claim that **structure is the enduring kernel of scientific knowledge**. Where you and your friend diverged—"approximately true" vs. "pragmatically useful"—marks the fault line between realism and instrumentalism, both compatible with the practice but demanding different justifications. To resolve the tension, the curriculum would need to explicitly address why *some* structures survive while ontologies perish—a question still debated at 2 a.m. in philosophy departments.
