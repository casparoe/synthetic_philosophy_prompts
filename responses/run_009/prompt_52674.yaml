prompt: |-
  You are a professional epistemologist who also teaches an intro course on the ethics of belief, and I want you to actually think hard about this, maybe brainstorm candidate concepts and prune them, before commiting to an answer. Here's my question: I keep noticing this move people make and I don't have a word for it. Someone has every opportunity to find out whether P is true -- the information is one google search away, or sitting in a sealed envelope on their desk -- and they deliberately don't look, and they'll even tell you outright that they'd rather not know. My aunt won't open her genetic test results because if she has the variant she figures she'd just worry herself sick either way. A friend won't check whether her long-distance boyfriend's stories add up, because knowing either way would change how she acts and she doesn't want to. It's not self-deception, since no false belief gets formed -- they know perfectly well that they don't know. And it's sort of the mirror image of William James's thing about being entitled to believe on insufficient evidence when you're forced to choose, except here someone is entitled to just... keep not-believing while declining evidence that's right there. Is there an established name for this in philosophy? How does it relate to Clifford's line about the duty to question what we believe before the evidence is in (does his duty to investigate extend to a duty to find out what you cheaply could?), and what separates it from plain agnosticism or from legally defined willful blindness? If nothing fits, coin a term, define it, and give me the boundary cases -- for instance, does it cover a scientist who quietly decides not to run the follow-up study because she doesn't want to know the result, or is that a different failure? Give me your answer as exactly five numbered items, a sentence or two each, no intro or conclusion.
reasoning: |-
  Okay, the user is asking about a specific epistemic behavior where someone avoids readily available information to remain ignorant. They mention examples like not opening genetic test results or checking a partner's stories. The user wants to know if there's a philosophical term for this, how it relates to concepts like Clifford's duty to investigate, and boundary cases like a scientist avoiding a follow-up study.

  First, I need to recall relevant philosophical concepts. The user mentioned William James and Clifford. Clifford emphasizes a duty to investigate before believing, while James allows belief without sufficient evidence in forced choices. The described behavior is the opposite: avoiding evidence to maintain non-belief. 

  Self-deception doesn't fit because there's no false belief formed. Agnosticism is a stance of not knowing, but here it's active avoidance. Willful blindness is a legal term, which might relate but is specific to avoiding culpability. 

  I remember "strategic ignorance" from epistemology. It's when ignorance is maintained for practical reasons. The examples given fit this—avoiding emotional distress or preserving relationships. Then there's "epistemic abstinence" as a more neutral term, highlighting the deliberate choice not to acquire knowledge. 

  Clifford's duty could extend to investigating when evidence is easily accessible, but he focuses more on belief formation than inquiry. The scientist example is trickier. If avoiding the study prevents knowledge that could harm, it's similar. But if it's to avoid falsifying a pet theory, it might be closer to self-deception or misconduct. 

  Boundary cases: The scientist not running a study to avoid unwanted results aligns with strategic ignorance. But if it's to maintain a grant or reputation, it might involve moral failure. Willful blindness requires avoiding liability, which isn't always present in the examples. 

  The user might need precise terminology for academic or personal use. They could be writing a paper or seeking to understand their own behavior. Deeper needs might include clarifying ethical responsibilities in belief formation or addressing personal dilemmas similar to the examples. 

  So, summarizing: strategic ignorance as the key term, epistemic abstinence as an alternative, Clifford's duty extension, distinction from agnosticism and willful blindness, and boundary cases like the scientist.
answer: |-
  Here are five precise items addressing your query:

  1.  **The core concept is "Strategic Ignorance" or "Epistemic Abstinence":** This describes the deliberate avoidance of readily available, costless evidence to maintain a state of non-belief (suspension of judgment), primarily motivated by perceived non-epistemic costs of knowing (e.g., emotional distress, relationship disruption, loss of hope/comfort).
  2.  **It contrasts with Clifford's duty primarily on motivation and scope:** Clifford's imperative ("it is wrong always, everywhere, and for anyone, to believe anything upon insufficient evidence") focuses on *forming* beliefs responsibly; strategic ignorance concerns *acquiring* evidence *before* belief formation. While Clifford implies a duty to investigate when belief is considered, he doesn't explicitly mandate seeking *all* cheaply available knowledge *irrespective* of belief intention, leaving room for strategic avoidance when no belief is being formed.
  3.  **It differs from plain agnosticism by being actively maintained:** Agnosticism is a state of not knowing; strategic ignorance is the *deliberate action* (or inaction) to *preserve* that state against easily acquirable evidence due to perceived negative consequences of knowing.
  4.  **It shares structure with willful blindness but differs in intent and legal context:** Both involve deliberate avoidance of knowledge. However, willful blindness (legally) aims to avoid culpability/responsibility ("I didn't *know* it was illegal"), while strategic ignorance typically aims to avoid psychological/social harms ("Knowing would make me miserable/ruin this").
  5.  **The scientist case fits strategic ignorance if avoiding knowledge is the primary goal:** If the scientist avoids the follow-up *specifically* because she dreads the potential result (e.g., disproving her life's work, forcing an ethical dilemma), it's strategic ignorance. If her motive is laziness, fear of failure affecting her career, or avoiding scrutiny, it shifts towards negligence or intellectual cowardice, distinct from the pure desire to *not know*.
