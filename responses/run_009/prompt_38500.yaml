prompt: |-
  i'm on the governance working group for our food co-op (bit over 200 members) and we're finally ditching plurality voting for electing our 3-person board. we'll use ranked ballots. people keep throwing method names around (borda, condorcet, IRV, approval, whatever) and one member keeps saying "just pick one that's strategy-proof, that's the only real question." i don't trust that strategy-proofness is a checkbox you can just tick off the shelf, and honestly i don't even know what else we should be demanding of a rule besides "it picks a board somehow."

  so before we argue methods, write me the requirements list: what does any adequate voting rule for us have to deliver? the cases it has to get right — e.g. a candidate who beats every rival one-on-one still losing, or 60% of members splitting between two similar candidates because each group ranks its favorite first, so a third candidate everyone merely tolerates slips in — the formal conditions it needs to satisfy, the properties it can't violate without members rioting. for each requirement say why it's a requirement, and whether it's non-negotiable or just nice to have. and i know there's gibbard-satterthwaite, which i gather says some of these can't all hold at once for a rule that always returns a single winner — tell me plainly which subset of my list is jointly unsatisfiable, and given our situation, which requirement i should actually be willing to relax.

  two wrinkles specific to us: (1) we always elect 3 seats together, not 1, and i've heard that changes which theorems bite — does it, and how? (2) one member proposed breaking ties by public coin flip, another wants to let people submit partial rankings. do either of those change the requirements themselves, or just how they get applied?

  don't bother scoring the methods against the list, thats for our next meeting. i want the spec first.
reasoning: |-
  Okay, the user is part of a food co-op governance group with over 200 members. They're switching from plurality voting to a ranked system for electing their 3-person board. One member is pushing for a "strategy-proof" method, but the user is skeptical and wants a solid list of requirements before evaluating methods. 

  First, I need to unpack why strategy-proofness isn't a silver bullet. Gibbard-Satterthwaite is key here—it proves no ranked system can be fully strategy-proof, anonymous, neutral, and decisive while avoiding dictatorships. For a co-op, strategy resistance matters more than perfect immunity. The user needs to understand that trade-off upfront.

  The multi-winner aspect (3 seats) changes everything. Single-winner criteria like Condorcet don't translate cleanly. Instead, proportionality concepts kick in—like ensuring a 60% majority bloc doesn't dominate all seats. But full proportionality might be overkill for a small board. The user probably needs "reasonable representativeness" rather than strict math.

  On formal requirements: Non-negotiable basics include anonymity (fairness), neutrality (equal candidate treatment), and monotonicity (no punishing voters for ranking up). The Condorcet loser criterion feels essential too—no one wants a universally hated candidate sneaking in. 

  For negotiables, clone independence is nice but not vital. Participation might be too strict for real-world voting. And while Condorcet consistency is elegant, it's brittle in crowds—the user should know it could force them into complex tie-breaking.

  The user's two wrinkles: 
  - Multi-winner elections absolutely change the game. Proportionality > Condorcet here. 
  - Partial rankings and coin flips don't alter core requirements but affect practicality. Partial ballots need careful handling to avoid no-shows distorting results. Public randomness is fine—adds transparency without breaking axioms.

  Underlying needs: The user wants to prevent rebellion ("members rioting") over unfair outcomes. Key triggers would be a Condorcet winner losing, vote-splitting handing victory to a compromise candidate, or minority domination. They need clear examples of what "adequate" means—like explaining why the 60% split scenario is unacceptable.

  Biggest takeaway: The co-op should prioritize (1) monotonicity, (2) Condorcet loser exclusion, and (3) majority principles. Sacrifice Condorcet consistency if needed—it's less critical than avoiding universally hated winners. For multi-winner, focus on "no majority monopoly" over perfect proportionality. And emphasize that strategy resistance is achievable even if perfect strategy-proofness isn't.
answer: |-
  Here’s the requirements spec for your co-op’s voting system, designed to cut through jargon and focus on what matters for **electing a 3-person board with ranked ballots**. I’ll break it down by **Non-Negotiables** (violations cause riots), **Strongly Preferred** (violations cause grumbling), and **Negotiables** (trade-offs exist). I’ll address strategy-proofness and your wrinkles upfront.

  ### Core Insight: The Strategy-Proofness Trap
  *   **Gibbard-Satterthwaite (G-S) Theorem:** For **single-winner** elections with ≥3 candidates, *no* ranked voting rule can be **fully strategy-proof** while also being **anonymous** (all voters equal), **neutral** (all candidates equal), **decisive** (always picks a winner), and satisfying **Pareto efficiency** (if everyone prefers A over B, B shouldn’t win).
  *   **Your Reality:** G-S *technically* applies to each seat individually, but electing 3 winners *mitigates* its sting. **Trade-off:** Prioritize *strategy resistance* (hard to game effectively) over impossible perfect strategy-proofness. Your member is oversimplifying.

  ### Your Wrinkles
  1.  **Electing 3 Winners:** This fundamentally changes priorities. Single-winner criteria (like Condorcet winner) become less critical, while **proportional representation** (PR) or **majoritarian stability** become key. Many "impossibility" theorems soften for multi-winner rules.
  2.  **Partial Rankings:** Impacts **expressive completeness** but doesn't change core requirements. Rules must handle them fairly.
  3.  **Public Coin Flip (Random Tiebreak):** Preserves **neutrality** and is generally acceptable. Doesn't weaken requirements.

  ---

  ### The Requirements Spec: What Your Voting Rule MUST Deliver

  #### I. Non-Negotiables (Violations = Riots)
  1.  **Anonymity:** Every voter’s ballot is counted equally. *Why:* Foundational fairness. Non-negotiable.
  2.  **Neutrality:** The rule treats all candidates identically. Swapping names on ballots swaps results. *Why:* Prevents bias. Non-negotiable.
  3.  **Monotonicity (One-Way):** Improving a candidate’s ranking on some ballots (without changing others) should never cause that candidate to lose. *Why:* The "rewarding support" principle. Violation (e.g., ranking a candidate higher causes them to lose) destroys trust and invites riots. **Absolute non-negotiable.**
  4.  **Condorcet Loser Criterion:** A candidate who loses head-to-head against *every other candidate* must not win a seat. *Why:* Electing someone universally disliked is indefensible. Non-negotiable.
  5.  **Resolvability (with Tiebreak):** The rule, including its tiebreak procedure (coin flip is fine), must always produce exactly 3 winners. *Why:* You need a board. Non-negotiable. (Partial rankings might require defining how incomplete ballots are counted).
  6.  **Pareto Efficiency:** If *every single voter* ranks Candidate A above Candidate B, then Candidate B must not win a seat if Candidate A is still in contention. *Why:* Basic consensus rejection. Non-negotiable.

  #### II. Strongly Preferred (Violations = Grumbling & Distrust)
  7.  **Majority Principle for Single Seat (Weakened for Multi-Winner):** If over 50% of voters rank one candidate first, that candidate *should* win *one* of the seats. *Why:* Strong mandates deserve representation. *Relaxation for 3 seats:* A strict majority winner *should* win, but it's less critical that they win *specifically* if a proportional system fairly allocates seats to coherent groups. **Highly desirable, but PR might justify exceptions.**
  8.  **Independence of Clones (IoC - Weakened):** If candidates are near-identical ("clones"), the rule shouldn’t be overly sensitive to their number. Electing one clone shouldn’t hinge on whether similar rivals run. *Why:* Prevents strategic candidate flooding/splitting. *Relaxation:* Perfect IoC is hard. Aim for **robustness to vote-splitting**. The "60% split" scenario you described (similar candidates splitting vote, disliked candidate wins) is a critical failure this aims to prevent. **Strongly preferred.**
  9.  **Consistency (Population Monotonicity - Weakened):** If the electorate is divided into groups that both elect the same candidate, then the whole electorate should also elect that candidate. *Why:* Prevents paradoxical "adding voters hurts your candidate" results. **Desirable, but complex multi-winner rules might struggle.**

  #### III. Important for Multi-Winner Context
  10. **Proportional Representation (PR) / Lack of Majority Domination:** No large cohesive group (>50%+) should be able to easily take *all* seats if a significant minority (>25-33%) exists with differing views. *Why:* For a 3-seat co-op board, ensuring diverse viewpoints are heard is crucial for legitimacy. A rule shouldn't let 51% of members (e.g., "Local-Organics Focus") elect all 3 seats, shutting out a 49% minority (e.g., "Affordability Focus"). **Non-negotiable for fair representation.** *(This is the multi-winner equivalent of fearing majority tyranny)*.
  11. **Hare Quota (Conceptual):** A coherent group of voters comprising about 1/(seats+1) of the electorate (~25% for 3 seats) should have a *reasonable chance* of electing a candidate they strongly prefer. *Why:* Embodies the core fairness goal of PR for small boards. **Strongly preferred conceptual goal.**

  #### IV. Negotiable / Trade-Offs Exist
  12. **Condorcet Consistency (Single-Winner):** If a candidate beats *all* others head-to-head, they should win *one* seat. *Why:* Seems intuitively fair. *Reality Check:* Less critical for multi-winner. Finding a true Condorcet winner is rare in crowds. Requires very complete ballot data. Many good multi-winner rules (e.g., STV) aren't Condorcet methods. **Can be relaxed for a simpler/more proportional rule.**
  13. **Participation:** Adding a ballot that ranks A above B shouldn’t cause A to lose and B to win. *Why:* Punishing voters for participating is bad. *Reality:* Very hard to satisfy perfectly with ranked multi-winner rules. **Aim for it, but accept it might be occasionally violated in edge cases.**
  14. **Perfect Strategy-Proofness:** As per G-S, impossible. **Relax entirely.** Focus on **strategy resistance**: How hard/risky is it to manipulate? Does it backfire often? (Approval voting is simpler & more strategy-resistant than ranked methods, but uses different ballots).

  ---

  ### Key Trade-Offs & Relaxations Given Your Situation
  1.  **Relax Condorcet Consistency:** Essential for single-winner, but for your 3-seat board, **Proportionality (Requirement 10) is FAR more important.** A Condorcet method (e.g., Schulze) might be complex and *less* proportional than STV.
  2.  **Relax Perfect Clone Independence:** Focus on mitigating the **vote-splitting disaster scenario** (your 60% example). Rules like STV (IRV for multi-winner) handle this well via elimination and vote transfer.
  3.  **Accept Non-Determinism (Coin Flip):** For ties only. This is fine and preserves fairness (neutrality). It doesn't break requirements.
  4.  **Allow Partial Rankings:** Essential for voter ease. The rule must define how incomplete ballots are interpreted (e.g., unranked candidates are equally ranked last). Doesn't change core requirements, just practical implementation.

  ### What Does "Adequate" Mean for Your Co-op?
  A rule must **at minimum** satisfy the **Non-Negotiables (1-6)** and ensure **No Majority Domination (10)**. It should **strongly aim** for **Mitigated Vote-Splitting (8/IoC)**, the **Majority Principle (7)**, and **Reasonable Proportionality (10/11)**. **Strategy resistance** is a practical evaluation, not a binary checkbox.

  **The case to get right:** Your 60% vote-splitting scenario. A rule failing here (e.g., Plurality, Borda) is unacceptable. STV (IRV for multi-winner) tackles this. Condorcet methods (if adapted) might, but proportionality becomes trickier. Approval avoids it entirely but loses ranking nuance.

  **Next Step:** With this spec, score methods like **STV (the most common ranked PR method for co-ops)**, **Bloc Vote w/ Ranking** (e.g., Meek STV for 3 seats), or even **Reweighted Range Voting** if considering cardinal methods. Beware Borda (fails clone independence/monotonicity badly) and basic IRV for single-winner applied naively to multi-winner (often fails proportionality). Good luck!
