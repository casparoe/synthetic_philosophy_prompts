answer: |-
  ### Procedure for Applying the Principle of Indifference

  When asked to "assume it's uniform," follow this 5-step procedure to evaluate whether indifference is justified or arbitrary. **Judgment calls are explicitly flagged.**

  1. **Identify the Sample Space and Partition**  
     Ask: *"What are the fundamental, mutually exclusive outcomes?"*  
     - Discrete: List distinct options (e.g., Supplier A, B, C).  
     - Continuous: Define the support (e.g., rod length ∈ [0, 2] cm).  
     - 🚩 **Judgment call**: Distinguishing "fundamental" outcomes relies on context. If outcomes can be subdivided further (e.g., "suppliers" vs. "suppliers + force majeure events"), indifference may fail.

  2. **Check for Symmetry**  
     Ask: *"Is there true permutational, rotational, or scale-invariant symmetry?"*  
     - Discrete: Swapping labels shouldn’t change probabilities (e.g., identical suppliers).  
     - Continuous: The parameterization should respect physical or geometric symmetries (e.g., angles in a circle).  
     - 🚩 **Red flag**: Asymmetric information masquerading as symmetry (e.g., rods manufactured near 1.5 cm but treated as uniform on [0, 2]).

  3. **Test Parameterization Invariance**  
     Ask: *"Does the event of interest retain the same probability under natural reparameterizations?"*  
     - Transform the variable (e.g., length \(L\) vs. volume \(L^3\)).  
     - Discrete: Re-partition the space (e.g., group suppliers into categories).  
     - 🚩 **Red flag**: Probability changes under transformations (e.g., \(P(L < 1) = 0.5\) but \(P(L^3 < 1) = 0.125\)).

  4. **Assess Ambiguity in "Uniform"**  
     Ask: *"Is there a unique, natural measure for uniformity?"*  
     - Discrete: Uniform over outcomes is unambiguous if symmetric.  
     - Continuous: Uniformity requires a measure (length, area, etc.). If multiple measures are natural (e.g., chord by endpoint vs. midpoint), indifference fails.  
     - 🚩 **Judgment call**: "Natural" depends on process (e.g., manufacturing rods by length vs. volume).

  5. **Decide and Fallback**  
     - **Indifference safe**: Use uniform probabilities if symmetry and uniqueness hold.  
     - **Indifference arbitrary**: Report a range of probabilities from valid parameterizations.  
     - **Refuse to quantify**: If no non-arbitrary basis exists, state: "Any prior is decorative; we need data/expert input."

  ---

  ### Case Applications

  #### (1) Three Suppliers (Discrete)  
  - **Sample space**: {Supplier A, Supplier B, Supplier C}.  
  - **Symmetry**: Suppliers are indistinguishable; permutational symmetry holds.  
  - **Parameterization**: No alternative partitions (e.g., grouping suppliers breaks symmetry).  
  - **Verdict**: **Indifference safe** (1/3 each).  
  - **Fallback**: None. Symmetry justifies uniformity.

  #### (2) Chord-in-a-Circle Problem (Continuous)  
  *Event: Chord longer than side of inscribed equilateral triangle.*  
  - **Setup A (Random Endpoints)**:  
    - **Partition**: Central angle \(\theta \in [0, \pi]\) (uniform).  
    - **Probability**: \(P(\theta > 120^\circ) = 1/3\).  
  - **Setup B (Random Midpoint)**:  
    - **Partition**: Midpoint distance \(d\) from center, uniform over disk area (\(d \in [0, R]\)).  
    - **Probability**: \(P(d < R/2) = 1/4\).  
  - **Setup C (Random Radius and Point)**:  
    - **Partition**: Distance \(r\) along radius, uniform on \([0, R]\).  
    - **Probability**: \(P(r < R/2) = 1/2\).  
  - **Analysis**:  
    - Symmetry: All setups respect rotational symmetry.  
    - Parameterization: Event probability depends on chosen measure (angle, area, length).  
    - Ambiguity: No unique "natural" parameterization.  
  - **Verdict**: **Indifference arbitrary** for all setups.  
  - **Fallback**: Refuse to assign a single prior. Report probabilities as 1/4 to 1/2 and demand process details.

  #### (3) Rod Length (Continuous)  
  - **Sample space**: Length \(L \in [0, 2]\) cm.  
  - **Event**: \(L < 1\) cm.  
  - **Partition A (Uniform length)**: \(L \sim \text{Uniform}(0, 2)\).  
    - \(P(L < 1) = 0.5\).  
  - **Partition B (Uniform volume)**: Assume rod volume \(V \propto L^3\), so \(V \sim \text{Uniform}(0, 8)\).  
    - \(P(V < 1) = P(L < 1) = 1/8 \approx 0.125\).  
  - **Analysis**:  
    - Symmetry: No inherent asymmetry in support.  
    - Parameterization: Probability flips under \(L \to L^3\).  
    - Ambiguity: Manufacturing process unknown (length or volume controlled?).  
  - **Verdict**: **Indifference arbitrary**.  
  - **Fallback**: Refuse to quantify. State: "Prior is decorative; specify manufacturing constraints or collect data."  
  - **Manager rejection**: Manager would treat uniform length as "obvious," but volume uniformity is equally plausible without process details.

  ---

  ### Key Takeaway  
  **Many "prior probabilities" in consulting are decorative placeholders.** Use indifference only when symmetry is unambiguous and parameterization-invariant. Otherwise, refuse or quantify arbitrariness. Firms often prioritize "a number" over rigor, but as an analyst, your duty is to flag arbitrariness.

