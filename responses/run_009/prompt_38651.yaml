prompt: |-
  For reasons that have recently become personal, I have been doing decision-theoretic arithmetic by hand, and I have noticed a pattern that I suspect has a name, though I cannot locate it.

  My situation, simplified: there is a preventive treatment available to me. It helps considerably if I carry a certain heritable variant and does nothing (while producing mild side effects) if I do not. Before testing, I believe myself about twenty percent likely to carry the variant. The test is imperfect: a positive result would move me to roughly ninety percent, a negative to around three percent, with the numbers rounded for illustration. Neither result would make me certain, so on either result I face the same choice — take the treatment or not — only with different weights. When I compute the best I can do without the test, and then the average of the best I could do after each possible result, weighting each result by how likely I currently think it is, the second number never comes out lower than the first. It comes out strictly higher precisely in those cases where some possible result would flip my choice, and equal, before subtracting the test's cost, when no possible result could flip my choice. I have replicated this on several invented decision problems and the inequality has never failed.

  I have also noticed three things that may or may not belong to the same phenomenon.

  First, the calculation appears to require that, after seeing the result, I am free to pick whichever action then looks best. Had I irrevocably committed in advance to a fixed plan of action regardless of the result, the value of testing seems to collapse to zero minus its cost. The non-negativity therefore looks like a fact about the option to condition one's action, not about information as such.

  Second, my sister refuses a comparable test, and her reasons do not fit my arithmetic. She says that knowing she carries the variant would change her — how she sleeps, what she dares, what she plans — independently of any treatment decision. Some of this could be folded back in by letting outcomes include her state of mind. But she insists some of it could not: what she dreads is not a worse outcome but a worse self, and she would pay not to know even if the knowledge could not conceivably alter any action she takes.

  Third, there appear to be cases where the information leaks. If others can observe that I was tested, or infer the result from my subsequent conduct — an insurer, an employer, a counterparty in a negotiation — my incentives shift in ways a private calculation ignores, and declining the test can be rational even within my own arithmetic once the observers are included in it.

  A friend who studied decision theory once remarked, in another connection, that one should never refuse a bet offered at one's own odds. That seems to be a neighboring fact but not the same fact: it concerns staking money on beliefs one already holds, whereas what I have noticed concerns acquiring evidence before acting.

  I am not after a bare label. I should like to know whether the core observation — that acting with the option to condition on a costless signal is never worse in expectation, under one's current beliefs, than acting without it — has an established name; what exactly its assumptions are, since I can already see that the signal must be costless, that its probabilities must not depend on what I do, and that my action must be permitted to depend on it, and I would like to know whether there are further assumptions I have missed, including whether the weighting by current beliefs itself does work; and, for each of my three observations, whether it lies inside the result, on its boundary, or outside it, together with the reason. If any part of the pattern is not covered by any established result, I should like that said plainly, and I should like that part given a name and a definition precise enough that, given a new case, I could determine for myself on which side of the line it falls.
reasoning: |-
  We are dealing with a core observation in decision theory: the value of information. The key idea is that having more information (from a costless signal) and being able to condition your action on that information never makes you worse off in expectation (under your current beliefs) and can make you better off. This is known as the "value of information" principle.

  Let me address the core observation and then the three additional observations.

  ### Core Observation: The Value of Information
  The pattern you noticed is formally known as the **value of information** (VoI). In decision theory, the expected value of perfect information (EVPI) is a well-known concept, but the principle holds for imperfect information as well.

  #### Key Assumptions:
  1. **Costless Signal**: The signal (test) must be free. If there is a cost, then we must subtract it, and it might make the test not worthwhile.
  2. **Probabilistic Model**: The signal is generated by a known probabilistic model that does not depend on the action taken (i.e., the signal is exogenous). In your case, the test accuracy (sensitivity and specificity) is fixed and independent of your treatment decision.
  3. **Conditional Independence**: The outcome of the signal (test result) is conditionally independent of future events (given the state of the world). In your example, the test result depends only on whether you carry the variant or not, and the treatment effect depends only on whether you carry the variant and whether you take the treatment.
  4. **Rational Updating**: You update your beliefs using Bayes' theorem upon observing the signal.
  5. **Freedom to Act Conditionally**: After seeing the signal, you can choose the action that maximizes expected utility given your updated beliefs.

  #### The Result:
  Without the test, you choose the action that maximizes expected utility given your prior beliefs. With the test, you get a signal and then choose the best action for each possible signal. The expected utility of the testing strategy (averaged over the possible signals, weighted by their prior probabilities) is at least as high as the expected utility of the best fixed action without the test. It is strictly higher if and only if there exists at least one signal outcome that would cause you to change your action (i.e., the best action after the signal is different from the best action without the signal).

  This is because the testing strategy includes the possibility of choosing the same action as without the test, but also allows switching when the signal indicates that switching is beneficial. Hence, the testing strategy can only do better (in expectation) and does strictly better when the signal sometimes changes the optimal action.

  ### Addressing Your Three Observations

  #### First Observation: The Necessity of Conditioning
  You note that if you commit in advance to a fixed action regardless of the test result, then the value of the test collapses to zero (minus cost). This is exactly in line with the value of information principle. The value comes from the ability to condition your action on the new information. Without that flexibility, the information is useless for decision-making.

  This lies **inside** the result. The value of information is defined as the difference between the expected utility of the optimal strategy that conditions on the signal and the expected utility of the best fixed action without the signal. Hence, conditioning is at the heart of the concept.

  #### Second Observation: Non-Instrumental Value of Information
  Your sister's reasons for refusing the test are about the non-instrumental value (or disvalue) of information. She fears the knowledge itself, regardless of whether it changes her actions. In standard decision theory, the value of information is purely instrumental (i.e., it helps in making better decisions). However, if knowledge itself affects utility (e.g., through anxiety, peace of mind, or identity), then we can model this by including the state of knowledge in the outcome.

  But your sister insists that some effects cannot be folded into outcomes. This is a more philosophical point. In decision theory, we typically assume that the utility function captures all relevant aspects of the outcome, including psychological states. However, if she believes that knowing makes her a "worse self" (perhaps by altering her self-perception in a way that is intrinsically bad, not just through consequences), then this might be a case where the standard model does not fully capture her preferences.

  This situation lies **outside** the standard value of information result. The standard result assumes that the utility function is defined over outcomes (which may include states of the world and actions) but not over the information state per se. However, we can extend the model by letting the utility depend on the state of the world, the action, and also on the information acquired. Then, the test might have a direct negative utility (due to the disutility of knowing) which could outweigh the instrumental value.

  In such an extended model, the total expected utility of taking the test would be:
  - The expected utility from the instrumental part (as computed by the value of information) 
  - Plus the direct utility (or disutility) of having the information.

  In your sister's case, the direct disutility might be so high that she prefers not to know.

  #### Third Observation: Information Leakage and Strategic Concerns
  When information can be observed by others (e.g., insurers, employers), then the act of testing and the test result can influence how others act, which in turn affects your utility. This is a classic problem of strategic interaction and asymmetric information.

  In the standard value of information calculation, we assume that the information is private and that the decision maker is the only one who observes it. If the information becomes public (or is inferred), then others may change their behavior in response. For instance:
  - If an insurer learns that you have a high risk (via testing), they might charge a higher premium or deny coverage.
  - An employer might discriminate based on the result.

  In such cases, the instrumental value of the test (in terms of better treatment decisions) might be outweighed by the negative consequences of the information becoming known to others.

  This scenario also lies **outside** the standard value of information result. The standard model does not account for strategic interactions. However, we can model this by including the reactions of others in the outcome. Then, the test has both an instrumental value and an additional effect via the reactions of others. The net effect might be negative.

  Therefore, declining the test can be rational if the negative consequences of information leakage (or the risk of leakage) outweigh the instrumental value.

  ### Summary

  - **Core Observation**: This is the **value of information** (VoI) principle. It states that the expected utility of a decision strategy that conditions on a costless signal is at least as high as the expected utility of the best fixed action without the signal, and strictly higher if and only if the signal sometimes leads to a different action.

  - **Assumptions**: 
    - The signal is costless (if not, subtract cost).
    - The signal is generated exogenously (its distribution does not depend on the action).
    - The decision maker updates beliefs rationally (Bayes' theorem).
    - The decision maker can choose actions conditionally on the signal.
    - The utility function depends only on the state and the action (and possibly the information state if we extend it, but in the basic model, it does not).

  - **First Observation (Conditioning)**: Inside the result. The value comes from conditioning.

  - **Second Observation (Non-Instrumental Value)**: Outside the standard result. The standard model does not include utility from the state of knowing. However, we can extend the model to include it.

  - **Third Observation (Information Leakage)**: Outside the standard result. The standard model assumes the information is private. When others react to the information, we must model the game-theoretic aspects.

  ### Naming and Definition for the Core Observation
  The core observation is known as the **value of information**. A precise definition:

  > **Value of Information (VoI)**: The expected increase in utility that a decision maker can achieve by having access to a signal (possibly imperfect) and being able to condition their action on it, compared to making a decision without the signal, assuming the signal is costless and the decision maker updates beliefs rationally.

  To determine whether a given decision problem adheres to the VoI principle, check:
  1. The signal is costless and its distribution is known and exogenous.
  2. The decision maker can choose actions conditionally on the signal.
  3. The utility function is defined over the state of the world and the action (and does not intrinsically depend on the signal except through the action and state).

  If these hold, then the expected utility with the signal (and conditioning) is at least as high as without.

  If any of these assumptions fail (e.g., the signal has a cost, or the utility depends directly on the signal, or the signal is not private), then the non-negativity of the value of information might not hold.

  ### Conclusion
  The core pattern you observed is a fundamental result in decision theory known as the value of information. Your three additional observations are important extensions and limitations of this result. The first is inherent in the result, while the second and third require extending the model beyond the standard assumptions.
answer: |-
  Your core observation is a fundamental principle in decision theory known as the **value of information (VoI)**. Below, I address your query systematically, covering the name, assumptions, and your three observations. I also clarify the boundaries of this principle and provide a precise definition for cases not fully covered by established results.

  ---

  ### **1. Core Observation: The Value of Information (VoI)**
  - **Name**: The principle you describe is called the **value of information** (VoI). It is a cornerstone of Bayesian decision theory and states that acquiring additional information (a "signal") and conditioning your action on it never reduces expected utility (under your current beliefs) compared to acting without the signal. VoI is non-negative, and strictly positive if the signal can change your optimal action in some states.
  - **Formal Statement**:  
    Let:
    - \(a\) be an action chosen from set \(\mathcal{A}\).
    - \(\omega\) be the state of the world (e.g., "carry variant" or "not carry variant").
    - \(u(a, \omega)\) be the utility of action \(a\) in state \(\omega\).
    - \(s\) be a signal (e.g., test result) with possible outcomes \(s_1, s_2, \dots, s_n\).
    - \(\Pr(\omega)\) and \(\Pr(s \mid \omega)\) define your prior beliefs and the signal's likelihood.  
    The expected utility **without the signal** is:  
    \[
    U_{\text{no-info}} = \max_{a \in \mathcal{A}} \mathbb{E}_{\omega}[u(a, \omega)].
    \]  
    The expected utility **with the signal** (and optimal conditioning) is:  
    \[
    U_{\text{info}} = \mathbb{E}_s \left[ \max_{a \in \mathcal{A}} \mathbb{E}_{\omega \mid s}[u(a, \omega)] \right].
    \]  
    VoI is defined as \( \text{VoI} = U_{\text{info}} - U_{\text{no-info}} \geq 0 \).  
    VoI > 0 if and only if there exists at least one signal \(s_i\) such that:  
    \[
    \arg\max_{a} \mathbb{E}_{\omega \mid s_i}[u(a, \omega)] \neq \arg\max_{a} \mathbb{E}_{\omega}[u(a, \omega)].
    \]

  - **Key Assumptions**:  
    - **Costless signal**: The signal itself has no direct cost (e.g., monetary, time, or psychological). If costs exist, subtract them from VoI.  
    - **Exogenous signal**: The signal's probabilities (\(\Pr(s \mid \omega)\)) must not depend on your chosen action \(a\).  
    - **Bayesian updating**: You update beliefs using Bayes' theorem: \(\Pr(\omega \mid s) \propto \Pr(s \mid \omega) \Pr(\omega)\).  
    - **Conditional action**: You can freely choose an action \(a\) after observing \(s\).  
    - **No change to state or utility**: The signal does not alter \(\omega\) or \(u(a, \omega)\) directly (e.g., taking the test doesn’t cure the variant).  
    - **Current beliefs**: VoI is computed under your prior beliefs (\(\Pr(\omega)\)). If beliefs are inconsistent (e.g., not updated correctly), VoI may not hold.  
    - **Rationality**: You always choose the action that maximizes expected utility given your beliefs.  

    **Missing assumptions you might have overlooked**:  
    - **No externalities**: The signal and your action do not affect other agents (e.g., insurers) who could react strategically (addressed in your third observation).  
    - **No state-dependent signal costs**: Costs (if any) must not depend on \(\omega\) or \(s\).  
    - **No direct utility from the signal**: Utility depends only on \((a, \omega)\), not on \(s\) itself (addressed in your second observation).  

  ---

  ### **2. Your Three Observations**
  #### **First Observation: The Necessity of Conditional Action**
  - **Status**: **Inside** the VoI result.  
  - **Reason**: VoI arises *entirely* from the ability to adapt your action to the signal. If you commit to an action before seeing \(s\), the signal has no value because \(a\) cannot depend on \(s\). Mathematically:  
    \[
    \mathbb{E}_s \left[ \mathbb{E}_{\omega \mid s}[u(a_{\text{fixed}}, \omega)] \right] = \mathbb{E}_{\omega}[u(a_{\text{fixed}}, \omega)].
    \]  
    VoI > 0 iff conditioning on \(s\) changes your action for some \(s_i\). This is the essence of VoI.

  #### **Second Observation: Non-Instrumental Utility of Beliefs (Your Sister's Case)**
  - **Status**: **Outside** the standard VoI result.  
  - **Reason**: VoI assumes utility depends only on \((a, \omega)\), not on beliefs or knowledge states. Your sister experiences direct disutility from *knowing* she carries the variant (e.g., dread, loss of identity), independent of actions. This requires:  
    - Extending utility to \(u(a, \omega, \kappa)\), where \(\kappa\) is your knowledge state (e.g., "knows she has variant" vs. "doesn’t know").  
    - The signal \(s\) now affects \(\kappa\), potentially making \(u(a, \omega, \kappa)\) worse even if \(a\) is optimal.  
  - **Boundary**: VoI still applies to the *instrumental* part (conditioning \(a\) on \(s\)), but the total effect of acquiring \(s\) includes:  
    \[
    \underbrace{\text{VoI}}_{\text{instrumental}} + \underbrace{\mathbb{E}_{s, \omega \mid s} [u(a^*(s), \omega, \kappa(s)) - u(a^*(s), \omega, \kappa_0)]}_{\text{direct utility change from knowing } s}.
    \]  
    The second term can be negative, dominating a positive VoI. Declining the test is rational here.  
  - **Precise Definition**:  
    > *Non-instrumental value of information*: A signal has non-instrumental value (or disvalue) if utility depends directly on the agent's knowledge state \(\kappa\) (a function of \(s\)), irrespective of actions. This extends the outcome space to include epistemic states.

  #### **Third Observation: Information Leakage and Strategic Externalities**
  - **Status**: **Outside** the standard VoI result.  
  - **Reason**: Standard VoI assumes the signal is private and your action is the sole source of consequences. If others (e.g., insurers) observe \(s\) or infer it from your actions, they may change their behavior, affecting your utility. For example:  
    - A positive test result could increase insurance premiums.  
    - Refusing treatment after a positive test might signal high risk to an employer.  
    This introduces **strategic externalities**: your utility now depends on others' actions, which depend on \(s\).  
  - **Boundary**: VoI still holds for the *isolated* decision problem (ignoring others), but the **net value** including externalities can be negative. Rationality requires game-theoretic analysis (e.g., signaling games).  
  - **Precise Definition**:  
    > *Strategic value of information*: The net change in expected utility from acquiring a signal \(s\), accounting for how other agents' actions respond to \(s\) (directly or indirectly) and how those actions affect your utility.  

  ---

  ### **3. Connection to Your Friend's Remark**
  Your friend’s comment ("never refuse a bet at your own odds") refers to the **no Dutch book** principle: if you decline such a bet, you violate coherence (your beliefs imply you accept it). VoI is related but distinct:  
  - **Dutch books**: Enforce consistency in static beliefs.  
  - **VoI**: Governs expected utility gains from dynamically conditioning actions on new information.  
  Both are facets of Bayesian rationality, but VoI explicitly involves sequential actions.

  ---

  ### **4. Summary and Names for Uncovered Phenomena**
  - **Core principle**: **Value of information (VoI)**.  
    - VoI ≥ 0, with equality iff no signal changes the optimal action.  
  - **First observation**: Inherent in VoI (conditioning is necessary).  
  - **Second observation**: **Non-instrumental disvalue of information**.  
    - Defined by utility dependence on knowledge states (\(\kappa\)).  
  - **Third observation**: **Strategic (negative) value of information due to externalities**.  
    - Defined by utility dependence on other agents' reactions to \(s\).  

  To apply this to new cases:  
  1. Compute instrumental VoI using \(U_{\text{info}} - U_{\text{no-info}}\) (always ≥ 0).  
  2. **Add non-instrumental effects**:  
     - Will knowing \(s\) directly affect utility (e.g., anxiety)? If yes, add \(\mathbb{E}[u(\kappa(s)) - u(\kappa_0)]\).  
  3. **Add strategic effects**:  
     - Will others observe \(s\) or your action and react? Model their responses and adjust utility.  
  4. **Include costs**: Subtract any direct costs of acquiring \(s\).  

  The net value of information is:  
  \[
  \text{Net VoI} = \underbrace{\text{Instrumental VoI}}_{\geq 0} + \underbrace{\text{Non-instrumental effect}}_{\text{<0 possible}} + \underbrace{\text{Strategic effect}}_{\text{<0 possible}} - \text{Cost}.
  \]  
  This explains why your sister or a leakage-prone scenario might rationally decline a test despite a positive instrumental VoI.
