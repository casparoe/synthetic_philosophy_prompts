prompt: |-
  I'm a software engineer, no philosophy background, and I'm asking you to help me broker a truce between two people close to me who have been arguing for about a year now.

  The first is my former teammate, Dana, a committed effective altruist. She deliberately took a job at an ad-tech company because it paid substantially more than the alternatives, donates a fixed percentage of her income to charities chosen on the basis of cost-effectiveness estimates, and is weighing a much larger lifetime pledge. She talks about her career the way we talk about system design: as an instrument, with explicit tradeoffs.

  The second is my sister, a labor organizer. Her view, roughly, is that effective altruism functions as a pressure valve: it lets talented people inside harmful industries feel fine about staying there; it redirects the exact people who could be building political power into doing charity math instead; and its insistence on measured outcomes makes it structurally blind to the biggest levers, because institutional change doesn't ship with a cost-effectiveness dashboard. She has called Dana's career choice the conscience line-item on a balance sheet.

  What keeps me from just picking a side is that each of them, in calmer moments, concedes real ground. Dana admits the ad industry is net harmful and that her estimates are noisy. My sister admits some of Dana's charities do genuine good and that she has no counterfactual estimate for what her organizing actually changes.

  I've read a little about adversarial collaborations, and that's the deliverable I want: not a debate transcript, and not your verdict on who's right, but the joint document both of them could actually sign. Please draft it with these sections:

  1. **Agreed claims.** Numbered, each phrased so both Dana and my sister would sign it as stated. Include the concessions each makes in their weaker moments — Dana on her industry's harms and the noise in the estimates, my sister on the real benefits of the top charities and the absence of a counterfactual story for organizing. Do not achieve signatures by watering anything down into vacuity.

  2. **Disagreements table.** Each row states one remaining disagreement in wording that the side holding that view would accept as a fair statement of its own position. Cover at least: (a) earning to give — career as instrument versus talent capture; (b) the measurability problem — whether privileging measurable outcomes is a self-correcting approximation or a structural blind spot, the way my team only ever fixes what shows up in the dashboards; (c) fungibility — whether Dana's donations and her continued presence at the company are substitutes for institutional change, complements to it, or something that actively delays it.

  3. **Cruxes.** The subquestions such that settling one would move at least one of them. For each crux, name a concrete case, empirical finding, or thought experiment both would accept as bearing on it, and record each side's prediction in advance — so that if the evidence ever came in, they will have already agreed on what it counts for.

  4. **Verbal disputes.** If any part of their disagreement is really about words — say, different meanings of doing good, or of what counts as an institution — identify which part and why.

  End with a single machine-readable line of the form \answer{...} naming the one crux from section 3 that both would agree is most load-bearing — the one whose resolution would move the most total conviction between them.
reasoning: |-
  We are drafting a joint document for Dana (effective altruist) and the sister (labor organizer) to sign. The goal is to broker a truce by clarifying agreements, disagreements, cruxes, and verbal disputes.

  ## 1. Agreed Claims

  We list the points both would agree to, including their concessions.

  1. **Harmful Industries**: The advertising technology industry, in its current form, has net negative effects on society, including contributing to privacy violations, attention exploitation, and potentially reinforcing harmful social dynamics. (Dana concedes this.)

  2. **Noisy Estimates**: Cost-effectiveness estimates for charitable interventions, while useful, are subject to significant uncertainty and noise, and should be treated as approximations rather than precise measurements. (Dana concedes this.)

  3. **Real Benefits of Top Charities**: Some charities recommended by effective altruist organizations do produce genuine, positive impacts in the world, such as saving lives or alleviating suffering, even if the exact magnitude is uncertain. (Sister concedes this.)

  4. **Counterfactual Challenges in Organizing**: It is difficult to measure the counterfactual impact of labor organizing and political activism (i.e., what would have happened without the organizing) because such efforts operate in complex systems with many variables and long time horizons. (Sister concedes this.)

  5. **Moral Motivation**: Both Dana and Sister are motivated by a desire to improve the world and reduce suffering, even if they have different strategies for doing so.

  6. **Tradeoffs in Career Choices**: Career decisions involve tradeoffs between various values, including personal financial security, direct impact, and systemic change. There is no universally optimal career path.

  ## 2. Disagreements Table

  We state each disagreement in terms acceptable to the respective side.

  | Disagreement Area | Dana's Position (Effective Altruist) | Sister's Position (Labor Organizer) |
  |-------------------|--------------------------------------|-------------------------------------|
  | **(a) Earning to Give: Career as Instrument vs. Talent Capture** | Earning to give is a legitimate and effective strategy for doing good: by taking high-paying jobs in any industry, including potentially harmful ones, one can generate substantial resources for highly effective charities, which in turn can do more good than many direct career paths. The career is an instrument for funding measurable good. | Earning to give, especially in harmful industries, functions as a talent capture mechanism: it diverts skilled, morally motivated individuals away from building political power and working towards systemic change, which is necessary to address root causes. This strategy may perpetuate harmful systems by providing a moral justification for participation. |
  | **(b) Measurability Problem: Approximation vs. Blind Spot** | Focusing on measurable outcomes is a self-correcting approximation: by prioritizing interventions with strong evidence and quantifiable impact, we can iteratively improve our understanding and effectiveness over time. This approach, while imperfect, is the best way to ensure resources are used efficiently. | The insistence on measurable outcomes creates a structural blind spot: it systematically neglects high-impact but hard-to-measure interventions, such as institutional and political change, because these do not produce immediate, quantifiable results. This is analogous to only fixing what shows up in dashboards while ignoring underlying system flaws. |
  | **(c) Fungibility: Substitutes, Complements, or Delays** | Dana's donations and presence at the company are complementary to institutional change: the resources she donates can support advocacy and systemic change efforts (if they are among the most cost-effective), and her presence inside the industry may allow her to push for reforms. Moreover, the donated funds are fungible and can be directed to any cause, including those focused on systemic change. | Dana's donations and continued presence in the industry are not substitutes for institutional change and may actively delay it: the moral licensing from donating a portion of income reduces the pressure for personal and collective action to change the system, and the talent and energy she invests in the harmful industry could be better spent building alternative institutions and political movements. |

  ## 3. Cruxes

  For each crux, we identify a concrete case, empirical finding, or thought experiment, and record each side's prediction.

  1. **Crux: Does earning to give in harmful industries reduce the talent pool for systemic change?**  
     - **Test Case**: A study comparing the career paths of two groups of graduates from top universities: one group that was exposed to effective altruism and chose earning to give in high-paying but potentially harmful industries, and another group that was not exposed and chose careers in public service, activism, or non-profits. Measure the aggregate impact on systemic change (e.g., policy wins, movement building) over 10-20 years.  
     - **Dana's Prediction**: The group that earned to give would have a greater aggregate impact because their donations would fund multiple high-impact projects and potentially some systemic change organizations, and some individuals in that group might use their position to influence their companies from within.  
     - **Sister's Prediction**: The group that chose direct careers in systemic change would have a greater aggregate impact because they would build political power and create structural reforms that address root causes, which donations alone cannot achieve. The earning-to-give group would be largely absent from the front lines of change.

  2. **Crux: Can measurable interventions lead to systemic change?**  
     - **Test Case**: An analysis of historical social movements (e.g., civil rights, environmental protection) to determine the role of measurable interventions (like direct service charities) versus hard-to-measure organizing and advocacy in achieving systemic change. Specifically, examine whether the measurable interventions were stepping stones or prerequisites for the broader change, or if they were side effects of the movement.  
     - **Dana's Prediction**: Many systemic changes were preceded by measurable interventions that built credibility, demonstrated solutions, and provided resources that later fueled advocacy. Thus, measurable interventions can be a path to systemic change.  
     - **Sister's Prediction**: Systemic change was driven primarily by organizing, advocacy, and political confrontation, with measurable interventions (like charity) playing at best a supportive role and sometimes acting as a distraction. Without the political movement, the measurable interventions would not have led to systemic change.

  3. **Crux: Does moral licensing from earning to give reduce pressure for institutional reform?**  
     - **Test Case**: A natural experiment in a company where a group of employees engage in earning to give (donating a portion of their income to effective charities) while another group does not. Measure the level of internal advocacy for reform (e.g., pushing for better privacy policies, unionization efforts) and the success of such reforms over 5 years.  
     - **Dana's Prediction**: The earning-to-give group would be more likely to advocate for reform because they are morally motivated and may feel a responsibility to improve their company. Their donations might also fund external pressure groups.  
     - **Sister's Prediction**: The earning-to-give group would be less likely to push for reform because they feel they are already doing good through donations, thus reducing their sense of urgency or guilt about the company's harm. This would lead to less internal pressure and slower reform.

  ## 4. Verbal Disputes

  Identify any disagreements that are primarily about terminology.

  - **Definition of "Institution"**: 
    - Dana might use "institution" to refer to formal organizations (like corporations, governments) that can be influenced by internal advocacy or external pressure (including via donations). 
    - Sister might use "institution" to mean broader systems of power and social structures that require collective action and political movements to change. 
    - Why it matters: This leads to different views on whether Dana's actions (working inside and donating) can effectively change institutions. For Dana, it might be part of the change; for Sister, it is not addressing the root structure.

  - **Definition of "Doing Good"**:
    - Dana emphasizes "doing good" as maximizing positive outcomes (e.g., lives saved, suffering reduced) as measured by impartial metrics.
    - Sister emphasizes "doing good" as transforming systems to be more just and equitable, which may involve unquantifiable shifts in power and norms.
    - Why it matters: This underlies the entire disagreement about strategy. Without clarifying, they may talk past each other.

  ## The Most Load-Bearing Crux

  We must choose the one crux from section 3 that both would agree is most load-bearing. Given the central tension in their debate, the crux about **whether earning to give in harmful industries reduces the talent pool for systemic change** (Crux 1) seems most fundamental. It directly addresses the core of their disagreement about career choices and the opportunity cost of talent. Both have strong predictions, and empirical evidence on this would significantly shift their views on the overall effectiveness of earning to give versus direct action.

  Thus, the machine-readable answer:

  \answer{Crux 1: Does earning to give in harmful industries reduce the talent pool for systemic change?}
answer: |-
  ### Joint Statement of Understanding Between Dana and [Sister's Name]  

  This document reflects areas of agreement, clarified disagreements, and paths for constructive dialogue between us. We acknowledge shared goals of improving human welfare while differing on optimal strategies. We commit to engaging with each other’s views in good faith.  

  ---

  #### 1. Agreed Claims  
  Both parties endorse the following as accurate statements:  
  1. **Industry harm**: The ad-tech industry, in aggregate, produces net societal harm (e.g., via privacy erosion, addictive design, and democratic disruption).  
  2. **Noisy estimates**: Cost-effectiveness estimates for charities (e.g., DALYs/QALYs) involve significant uncertainty due to methodological limits and counterfactual complexity.  
  3. **Charitable benefits**: Top effective altruism-recommended charities (e.g., bednet distribution, deworming) achieve measurable, positive outcomes for vulnerable populations.  
  4. **Counterfactual gaps**: The impact of labor organizing and institutional change cannot be robustly quantified via standardized metrics due to long time horizons, confounding variables, and opaque causality.  
  5. **Personal tradeoffs**: Career decisions involve balancing financial security, moral alignment, and impact potential—with no universally optimal choice.  
  6. **Structural awareness**: Both individual actions (e.g., donations) and collective actions (e.g., organizing) operate within systems that constrain their efficacy.  

  ---

  #### 2. Disagreements Table  
  | Core Issue | Dana’s Position (Earning-to-Give Advocate) | Sister’s Position (Institutional Change Advocate) |  
  |------------|--------------------------------------------|--------------------------------------------------|  
  | **(a) Career Instrumentalism vs. Talent Capture** | High-income careers in any sector (including harmful ones) are instruments for resourcing high-impact interventions; maximizing donations creates more absolute good than alternative paths. | Directing talent toward harmful industries for income capture diverts potential change-makers from building collective power, entrenching the systems requiring reform. |  
  | **(b) Measurability as Approximation vs. Blind Spot** | Prioritizing measurable outcomes is a self-correcting feature: it iteratively improves resource allocation and avoids waste, even if some high-impact areas are initially overlooked. | Privileging measurable outcomes structurally excludes transformative change (e.g., policy shifts) by design, akin to optimizing only for dashboard-visible bugs while ignoring technical debt. |  
  | **(c) Fungibility of Individual Actions** | Donations and insider presence are complementary to institutional change: funding can support advocacy, and insider roles enable incremental reform (e.g., ethical product design). | Donations and insider roles actively delay institutional change: they act as moral offsets that reduce pressure for collective action and legitimize harmful systems. |  

  ---

  #### 3. Cruxes  
  Key subquestions where evidence could shift beliefs, with pre-commitments to interpret specific cases:  
  1. **Crux A: Does earning-to-give reduce the supply of labor-movement talent?**  
     - **Test Case**: Longitudinal study of Ivy League graduates entering finance/tech vs. public-interest careers, tracking their aggregate impact on policy wins (e.g., unionization rates, regulatory changes) over 20 years.  
     - *Dana’s Prediction*: Donations from high earners will fund more policy wins than direct careers produce.  
     - *Sister’s Prediction*: Direct-career groups will drive more wins due to network effects and specialized skills.  

  2. **Crux B: Can measurable interventions catalyze institutional change?**  
     - **Test Case**: GiveWell-style analysis of the US civil rights movement: quantify donations to NAACP vs. grassroots organizing hours, then model their respective contributions to the 1964 Act.  
     - *Dana’s Prediction*: Donations to measurable litigation/education campaigns will show higher marginal impact per dollar than unmeasurable organizing.  
     - *Sister’s Prediction*: Organizing will show higher impact due to its role in shifting public opinion and political windows.  

  3. **Crux C: Does moral licensing from donations reduce reform pressure within harmful firms?**  
     - **Test Case**: Employee activism data from 50 tech firms, correlating donation practices with internal advocacy (e.g., petitions, whistleblowing) and policy outcomes.  
     - *Dana’s Prediction*: Donors will show equal or higher advocacy rates (due to heightened ethical engagement).  
     - *Sister’s Prediction*: Donors will show lower advocacy rates (due to reduced guilt/complacency).  

  ---

  #### 4. Verbal Disputes  
  - **"Doing good"**: Dana defines it as *impartially maximizing welfare* (e.g., saving lives efficiently). Sister defines it as *transforming power structures* (e.g., democratizing workplaces). This inflames disagreements about metrics (section 2b).  
  - **"Institution"**: Sister includes informal power networks (e.g., worker solidarity); Dana emphasizes formal entities (e.g., corporations, governments). This underlies disputes about fungibility (section 2c).  

  ---

  ### Conclusion  
  We sign this document acknowledging that:  
  - Our disagreement stems from divergent priors about how change happens, not bad faith.  
  - Evidence from the specified cruxes could meaningfully update our views.  
  - We will avoid weaponizing concessions made here.  

  Signed,  
  _________________________ (Dana)  
  _________________________ (Sister’s Name)  

  \answer{Crux A: Does earning-to-give reduce the supply of labor-movement talent?}
