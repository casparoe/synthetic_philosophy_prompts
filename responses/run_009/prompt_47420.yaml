  We are designing an activity for a reading group on mechanistic anomaly detection (MAD). The goal is to make participants grapple with the question: "What counts as the same mechanism?" without lecturing.

  The core idea: participants compare pairs of simple computational systems (string-processing procedures or circuits) and judge whether they implement the "same mechanism". Then, we reveal that the same pair can be described at different levels of abstraction (coarser or finer grain) and show that their judgments might flip.

  Constraints:
  - Materials: index cards or printouts, no coding. A little spreadsheet is okay.
  - Time: 75 minutes total.

  Structure:
  1. Introduction (5-10 min): Set the stage for MAD and the central question.
  2. Activity Part 1: Initial judgments (15-20 min): Participants, in small groups or individually, judge pairs of systems.
  3. Activity Part 2: Reveal re-descriptions (15-20 min): The same pairs are presented again but with a different description level. Participants re-judge.
  4. Discussion (25-30 min): Debrief the activity, map to real-world challenges in MAD.

  Materials:
  We'll create several pairs of computational systems. Each system is described in two ways: a low-level (fine-grained) description and a high-level (coarse-grained) description. We can use string-processing functions as examples because they are easy to describe without code.

  Example Pair 1:
  - System A: A function that reverses a string by swapping characters from the ends toward the center.
  - System B: A function that reverses a string by building a new string from the last character to the first.

  At a low level, these are different (iterative in-place swap vs building a new string). At a high level, both are "reversing a string".

  Example Pair 2:
  - System A: Counts the number of vowels in a string by iterating and checking each character against a list of vowels.
  - System B: Counts the number of vowels by using a regular expression to match vowels and counting the matches.

  Low level: different (iteration vs regex). High level: same (count vowels).

  Example Pair 3 (to introduce a twist):
  - System A: Converts a string to uppercase by adding 32 to each lowercase letter's ASCII code (if it's a letter).
  - System B: Converts a string to uppercase by using a lookup table that maps each character to its uppercase version.

  Low level: different (arithmetic vs table lookup). High level: same.

  We will prepare index cards for each pair, with two descriptions for each system (but initially only one description level is given). Alternatively, we can have two sets of cards: one for the first round (with fine-grained descriptions) and then a second set for the second round (with coarse-grained descriptions) for the same systems.

  Alternatively, to save time, we can have the same system pair described in two ways on the same card but folded so that the second description is hidden until the second round.

  But to avoid confusion, we can do:

  Round 1: Each group gets a set of pairs (say 4 pairs) described at a low level. They judge for each pair: same mechanism or different? They record their votes.

  Round 2: Then we give them the same pairs but now described at a high level (or vice versa in some cases). They vote again.

  Then we reveal that the pairs are the same as in round 1 and show how votes changed.

  Alternatively, we can have each pair appear in two consecutive rounds with different descriptions without telling them it's the same pair until after. But that might be confusing. Instead, we can label the pairs (Pair 1, Pair 2, etc.) and then in round 2 we say "Now we have Pair 1 again, but with a different description".

  We need at least 3-4 pairs to show variation.

  We also want one pair that is clearly the same even at low level (e.g., two systems that are identical in code) and one that is clearly different at any level (e.g., a system that reverses a string and one that counts vowels). But the interesting ones are the ones that can flip.

  Let me design 4 pairs:

  Pair 1: (Control: same at both levels)
  - System A: Counts the number of words by splitting the string at spaces and counting the parts.
  - System B: Same as System A.

  Pair 2: (Control: different at both levels)
  - System A: Reverses a string.
  - System B: Counts the number of vowels.

  Pair 3: (Flip: different at low level, same at high level)
