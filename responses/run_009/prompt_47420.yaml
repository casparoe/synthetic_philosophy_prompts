  I think it's safer to stick with pairs that are different at low level and same at high level for the flip.

  So let's stick with 4 pairs:

  - Pair 1: Control same (same at both levels)
  - Pair 2: Control different (different at both levels)
  - Pair 3: Flip (different at low, same at high)
  - Pair 4: Another flip (different at low, same at high)

  And we'll have two description levels for each system.

  Materials:

  For each pair, we will create two cards (or one card with two sides) for the two rounds.

  Round 1: Low-level descriptions for all pairs.
  Round 2: High-level descriptions for the same pairs.

  We can have a worksheet for each group to record their votes for each pair in each round.

  Timeline:

  Total: 75 minutes

  1. Introduction (10 minutes)
     - Briefly explain MAD: the idea of verifying known trusted mechanisms and flagging when the model uses an unknown mechanism.
     - Present the central question: What does it mean for two mechanisms to be the same? How do we describe a mechanism?
     - Explain the activity: We'll look at pairs of simple computational systems and judge if they use the same mechanism. We'll do two rounds.

