  We'll have for each system two descriptions: one fine and one coarse.

  For the activity:

  Round 1: Present the fine-grained descriptions of two systems and ask: "Do these two systems implement the same mechanism? (Yes/No)"

  Round 2: Present the coarse-grained descriptions of the same two systems and ask again.

  We expect for the flip pairs, people might say "no" in round 1 and "yes" in round 2.

  We can also have one pair that is described in the same way at both levels? That would be our control same.

