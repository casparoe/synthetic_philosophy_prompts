prompt: |-
  I lead the long-range analysis desk at a small geopolitical risk consultancy. Twice a month we review submissions — from our own analysts and from outside commentators — that explain current events by appeal to some putative law of history: empires decline once military spending passes a certain share of revenue, great-power wars recur on a roughly eighty-year rhythm, hegemonies last about a century, and so on. My analysts are split between those who dismiss every such claim as historicist nonsense and those who quietly build client forecasts on them. Please turn Popper's critique of historicism — his argument that there can be no laws of historical development, while historical explanation and conditional forecasting remain possible — into a screening procedure my desk can run on a single submission in under an hour. It should specify: what separates a testable conditional forecast from an unfalsifiable prophecy dressed up as one; how to treat claims that survive every failed prediction by absorbing it ("the cycle was merely delayed"); where the procedure hands the decision back to a human because the disagreement is about values or client relations rather than method; and what the procedure cannot settle. Then run it on three submissions: (i) that great powers which allow military spending to exceed a given share of economic output decline within two generations; (ii) that mature democracies rarely if ever fight one another; and (iii) an internal memo arguing that deep global economic integration must end in either world federation or collapse, since no intermediate arrangement is stable. Include at least one case where the procedure returns a verdict the desk will not like — we have clients who pay for forecasts built on one of these — and be honest about where the procedure is merely a disciplined judgment call. Please answer in British English.
reasoning: |-
  Okay, I need to help this user who leads a long-range analysis desk at a geopolitical risk consultancy. They're dealing with submissions that claim historical laws, like empires declining when military spending gets too high. The user wants a screening procedure based on Popper's critique of historicism to evaluate these claims quickly. 

  First, I recall Popper's key points: he rejected deterministic laws of history but allowed for conditional forecasts based on testable theories. The challenge is to distinguish between genuine forecasts and unfalsifiable prophecies. The screening procedure must cover four aspects: separating testable forecasts from unfalsifiable ones, handling claims that avoid falsification by making excuses, identifying when to hand decisions back to humans due to values or client relations, and acknowledging limitations.

  For the procedure itself, I consider a step-by-step approach. Step 1 would assess falsifiability—can we imagine evidence that would disprove the claim? Step 2 looks at how the claim handles counterevidence—does it adapt or make excuses? Step 3 checks for testability—can we specify conditions for testing? Then step 4 identifies off-ramps where human judgment is needed, like when values conflict or client interests complicate things. Finally, step 5 clarifies what the procedure can't settle, such as debates over probabilities or historical interpretations.

  Now for applying it to the three submissions. The first claim about military spending exceeding a share of GDP leading to decline seems testable but problematic—it could easily absorb counterexamples by redefining terms. The democratic peace theory is more robust; it's falsifiable and has been tested, though not without critics. The memo about global integration ending in federation or collapse feels prophetic—it's vague and unfalsifiable, absorbing any outcome as confirmation.

  I need to be honest that in some cases, like the military spending claim, the procedure might reject a framework clients pay for. And for all cases, there's judgment involved—especially in defining terms like "decline" or assessing the quality of evidence. 

  The user's deeper needs seem to include maintaining credibility while managing internal divisions and client expectations. They probably want a tool that brings objectivity but also acknowledges real-world constraints. I'll present this as a practical guide, using British English as requested, and make sure to flag where human discretion remains essential.
answer: |-
  Here’s a screening procedure based on Popper’s critique of historicism, designed for rapid assessment (under one hour) of submissions claiming "laws" of historical development. It focuses on separating testable conditional forecasts from unfalsifiable prophecies, handling immunisation strategies, identifying value/client-based judgements, and acknowledging limitations.

  **The Screening Procedure: Popperian Falsification for Historical Claims**

  1.  **Falsifiability Check (10 mins):**
      *   **Question:** *Can we specify observable, potentially occurring conditions that, if found, would definitively falsify the core causal claim?*
      *   **Procedure:** Identify the core proposed "law" or causal mechanism. Demand concrete, time-bound criteria for what evidence would constitute a refutation. Vague terms ("decline," "collapse," "rarely") must be operationalised.
      *   **Red Flags:** "No true Scotsman" fallacies, moving goalposts pre-emptively, reliance on unobservable forces, predictions stretched over indefinite timescales ("eventually"), defining success/failure post-hoc.

  2.  **Immunisation Strategy Audit (15 mins):**
      *   **Question:** *How does the claim respond to apparent counter-evidence? Does it genuinely adapt the theory or merely absorb the exception?*
      *   **Procedure:** Propose plausible historical or hypothetical counter-examples. Analyse the submission's *stated* or *implied* response mechanisms (e.g., "cycle delayed," "exogenous shock," "not a *true* democracy/hegemony").
      *   **Red Flags:** Explanations that protect the core "law" without increasing its precision or testability; reliance on unquantifiable "distorting factors"; treating failed predictions as confirmations ("the delay proves the tension").

  3.  **Testability & Conditional Forecast Assessment (20 mins):**
      *   **Question:** *Can the claim generate specific, conditional forecasts ("If X, then Y, under conditions Z") that are falsifiable within a reasonable timeframe?*
      *   **Procedure:** Extract or reconstruct the conditional logic. Assess the observability of initial conditions (X) and predicted outcomes (Y). Can the timeframe for Y be bounded? Are conditions Z specifiable and testable, or are they catch-all escape clauses?
      *   **Red Flags:** Predictions lacking clear conditions; outcomes defined so broadly they can fit almost any event (e.g., "increased instability"); reliance on "inevitable" processes divorced from specific mechanisms.

  4.  **Off-Ramp to Human Judgement (Identify Triggers) (5 mins):**
      *   **Question:** *Is the core disagreement here about methodological falsifiability, or is it about values, definitions, client risk-appetite, or the inherent uncertainty of long-range forecasting?*
      *   **Procedure:** If Steps 1-3 show the claim is *methodologically* sound (falsifiable, handles evidence openly) or clearly unsound (unfalsifiable, heavily immunised), the procedure delivers a verdict. If the assessment hinges on contested definitions (e.g., "What constitutes 'decline'?"), subjective weight given to historical analogies, or the *acceptable level of risk* for client forecasting despite methodological weaknesses, flag these as "Requires Human Judgement: Value/Definition/Client Context."
      *   **Output:** Verdict (Pass/Fail Popperian Screen) or Flag for Human Judgement (specifying reason: e.g., "Definitional Contest," "Client Risk Preference," "Weighting of Historical Evidence").

  5.  **Acknowledge Limitations (Inherent):**
      *   The procedure cannot:
          *   Settle debates about the *probability* assigned to a well-formed conditional forecast (this requires empirical evidence and modelling).
          *   Resolve fundamental philosophical disagreements about historical causation or social science methodology beyond falsificationism.
          *   Judge the *practical utility* of a forecast for a specific client if it passes the screen but has low probability.
          *   Replace nuanced historical understanding; it only checks for pseudo-scientific historicism.

  **Application to Submissions:**

  **(i) Great Powers & Military Spending:**
  1.  **Falsifiability:** *Potentially.* Define "great power," "military spending share" (e.g., >10% GDP?), "decline" (e.g., relative GDP share drop >20%, loss of major alliance, significant territorial defeat?), "within two generations" (e.g., 60 years?). A great power exceeding the threshold for 60 years without meeting decline criteria falsifies it. **Amber Flag:** "Decline" is inherently contestable.
  2.  **Immunisation:** High risk. Likely responses: "The threshold was miscalculated," "Exogenous event (war, famine) intervened," "Managed decline doesn't count," "Two generations starts *after* spending is *consistently* over." Easily absorbs counter-examples (e.g., US post-WWII? Rome?).
  3.  **Testability:** Conditional forecast possible: "If Great Power A sustains MilSpend > X% GDP for Y years, then it will experience Decline Z within 60 years." Testability hinges on agreed definitions. Timeframe is clear.
  4.  **Verdict:** **FAIL** (High Immunisation Risk). While falsifiable *in principle*, the operationalisation of "decline" and the ease of invoking "distorting factors" make it highly likely to absorb counter-evidence. It functions more as a prophetic warning than a testable law.
  5.  **Desk Impact:** **Unliked Verdict.** Clients may pay for this narrative, but the procedure flags its weakness as a predictive "law." Human judgement needed if clients value the heuristic despite its flaws.

  **(ii) Democratic Peace Theory (Mature Democracies Rarely Fight):**
  1.  **Falsifiability:** **Yes.** Define "mature democracy" (e.g., Polity IV score >7, uninterrupted >20 years?), "fight" (e.g., interstate war with >1000 battle deaths?). A clear instance of two such democracies engaging in such a war falsifies the "rarely if ever" claim. 1812, Kargil War, etc., are debated test cases.
  2.  **Immunisation:** Moderate risk. Common responses: "State A or B wasn't *truly* mature" (definitional), "It was a minor skirmish, not war" (operationalising 'fight'), "Unique historical circumstances." However, the core claim *has* been refined and tested against evidence.
  3.  **Testability:** Clear conditional forecast: "If State A and State B are both Mature Democracies (defined), the probability of them engaging in War (defined) is near zero." Empirically testable against historical and current data.
  4.  **Verdict:** **PASS** (Conditional Forecast). It makes a specific, falsifiable claim about state behaviour under defined conditions. While definitions can be debated (triggering Human Judgement on *which* definition to use for a forecast), the core structure is sound Popperian social science, not historicist prophecy. Failed predictions (near misses) have led to refinement, not just absorption.
  5.  **Desk Impact:** Methodologically sound for conditional forecasting, though human judgement needed on definitional thresholds for specific applications.

  **(iii) Global Economic Integration: World Federation or Collapse (Internal Memo):**
  1.  **Falsifiability:** **No.** Define "deep global economic integration" (e.g., trade/GDP >X% world avg?), "world federation" (clearly defined supranational sovereignty?), "collapse" (e.g., >Y% reduction in global trade sustained >Z years?). The claim is that *no* "intermediate arrangement" is "stable." But "stable" is undefined and potentially unfalsifiable – any enduring intermediate state is deemed "unstable" because collapse/federation hasn't happened *yet*, or is redefined as pre-collapse/pre-federation. What timeframe for stability? Decades? Centuries?
  2.  **Immunisation:** Extremely High. Any current or future state *not* federation or collapse is, by the memo's logic, merely an "unstable intermediate" awaiting its inevitable end. There is no conceivable state of the world that could falsify the claim, as *both* predicted outcomes cover all possibilities *eventually*. Failure to happen "on schedule" is "proof" of building tension.
  3.  **Testability:** Cannot generate specific conditional forecasts. Predicts an ultimate, inevitable binary outcome with no clear timeline and no falsifiable definition of the excluded middle ("stable intermediate").
  4.  **Verdict:** **FAIL** (Unfalsifiable Historicist Prophecy). It presents a grand historical teleology (integration *must* lead to A or B) with no mechanism for empirical refutation. It absorbs all present and future states as confirmation.
  5.  **Desk Impact:** Fails the screen as a predictive law. However, it might be a valuable *scenario* for discussion. Human judgement needed if the desk wants to explore its narrative value for clients as a *possibility*, not a *law*.

  **Where the Procedure is Disciplined Judgement Call:**
  *   **Operationalisation (Step 1/3):** Defining "decline," "mature democracy," "deep integration," "stable" requires judgement. The procedure forces explicitness but can't resolve all definitional disputes.
  *   **Immunisation Severity (Step 2):** Distinguishing between legitimate theory refinement (like Democratic Peace adjustments) and ad-hoc immunisation is often a grey area requiring historical and contextual judgement.
  *   **"Reasonable Timeframe" (Step 3):** What constitutes a testable horizon (e.g., 20 vs. 100 years) involves pragmatic judgement about relevance and client needs.
  *   **Off-Ramp Decisions (Step 4):** Identifying when a methodological pass/fail is secondary to client context or contested values is crucial judgement.

  This procedure provides a rigorous, hour-long screen to filter out unfalsifiable historicist prophecies masquerading as laws, while allowing testable conditional forecasts (even imperfect ones) through. It forces explicitness, highlights immunisation tactics, and clearly signals when decisions must revert to human expertise based on values, definitions, or client relations. Remember, passing the screen doesn't make a forecast *correct*, only that it's *potentially* testable and not pseudo-scientific historicism. Failing it doesn't make an idea worthless, only that it cannot claim the mantle of a predictive historical law.
