prompt: |-
  So for context: I'm a mol bio PhD student (3rd year, yeast chromatin stuff) who got roped into a philosophy of biology reading group this semester, and we just hit the "is DNA literally a code / is 'genetic information' a real thing or just a useful metaphor" unit. I'm supposed to bring a creative piece to the last session, dont ask. I want a villanelle. Here's the twist I have in mind, feel free to push back if it breaks the form: instead of the usual fixed refrains, each time one of the two refrains returns, exactly one word gets substituted — like a point mutation — so the lines that show up in the final couplet are recognizably descendants of the originals but visibly drifted.

  The two refrains should be the two camps: one line asserting that the sequence is a message, a code, a text (in the voice of people who lean literal), and one line in the voice of the "it's chemistry all the way down, nothing is being read, there's no reader" camp. The mutations should do philosophical work rather than just being cute — e.g. a substitution that starts out looking like it strengthens the metaphor and quietly undermines it, or vice versa. The form itself should be part of the argument: villanelles already have this obsessive returning quality, and if the refrains can't stay identical, that's kind of the point of the debate, right? Both sides keep coming back slightly changed.

  Accuracy bar, since we'll have actual philosophers of biology in the room and I'd like to not embarrass myself: the poem should be able to distinguish the literal codon mapping (which really is a mapping, with degeneracy and all, nobody disputes the codon table) from the stronger claims people smuggle in with "code" and "information" talk — that the sequence is a representation, that it's about something, that there's a semantics. If you work in the fact that the machinery that "reads" the message is itself encoded, or that translation errors aren't like typos because there's no original intent, that's bonus points. Someone from the reading group who's been doing the info-theory papers should find it right, and someone who hasn't should still enjoy it as a poem.

  After the poem, add a short prose note (a paragraph is fine) flagging where you're leaning on contested readings vs. stuff that's basically settled — like, which mutations of the refrains encode a position that actual people argue about rather than a consensus, and whether the drift toward one camp by the end is my framing or yours. I need to know which parts I'd get pushback on.
