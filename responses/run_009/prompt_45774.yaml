prompt: |-
  quick context before the ask: I'm a PhD student working on aggregation, and my reading group has spent three sessions now talking past each other about infinite ethics — one person argues infinite cases are a mathematical artefact, another that they're the only cases that matter once you take existential risk seriously, and I've realised I can't adjudicate any of it because we've never agreed what a theory of aggregative value is even supposed to *deliver* when the value-bearing part of the world might be infinite. So before I go back to evaluating total utilitarianism and its patches, I want the spec.

  write me the desiderata: what an adequate theory of value has to get right when worlds can contain infinitely many welfare subjects (or a single subject living forever), with the motivating case behind each requirement. Things I think belong on the list but want you to sanity-check and extend: it has to either render verdicts between two infinite worlds or own up to the silence and say why silence is acceptable; it can't violate the Pareto-style constraint that a world where some being does better and none do worse is at least as good; it has to say something about the case where an infinitely long happy life is compared with a long finite one (I find this one way harder than the many-person cases and almost nobody drills into it); it can't let adding or removing finitely many welfare subjects to an infinite world flip verdicts around wildly; and it has to handle the paradise-style case where a finite world of extremely happy people competes with an infinite world of slightly-less-happy ones. Also tell me which of these are genuine requirements and which are just tastes of one camp — I suspect the demand for finite-change sensitivity and the Pareto constraint are non-negotiable but jointly unstable with additivity, and if some subset is provably unsatisfiable, say so plainly, that's the bit I most want to see.

  one twist: fix the purpose as real decision-making under uncertainty about whether value ever ends (cosmic futures, cause prioritisation and all that), not tidy classroom comparisons. So include as a requirement (or argue against including) that the theory has to be usable inside expected-value reasoning rather than allowed to go silent exactly when a decision is live. For me that silence-at-the-decision-point question is not a technicality.

  at the very end give me two or three sentences on how the obvious escape routes do against the list — expansion ledgers, spatiotemporal density, and just banning actual infinities on physical grounds — but keep it brief, the criteria are the main deliverable. No readings please, I've got a folder of those, what I don't have is the checklist.
reasoning: |-
  We are to define desiderata for a theory of aggregative value when the world might contain infinitely many welfare subjects or an infinitely long life. The purpose is real decision-making under uncertainty about whether value ever ends (e.g., cosmic futures, cause prioritisation). The theory must be usable in expected value reasoning and avoid silence at decision points.

  Here is a list of desiderata, each with a motivating case and an indication of whether it is a genuine requirement or a matter of taste:

  1. **Definiteness (or owning up to silence with justification):**
     - **Motivating case:** Comparing two infinite worlds (e.g., one with an infinite number of happy beings and another with an infinite number of slightly less happy beings). The theory must either give a verdict or explain why it is silent. In the context of decision-making, silence must be justified and acceptable only if it does not paralyze decisions under uncertainty.
     - **Status:** Genuine requirement. In real decisions, we cannot afford silence when comparing alternatives. However, if silence is unavoidable, the theory must explicitly state when and why, and offer a way to make decisions despite that (e.g., by using dominance or other principles).

  2. **Pareto Principle (Weak Dominance):**
     - **Motivating case:** If world A has the same welfare subjects as world B and at least one subject is better off in A and none are worse off, then A is at least as good as B. This must hold even in infinite settings.
     - **Status:** Genuine requirement (non-negotiable). This is a fundamental principle of ethics that any reasonable theory should satisfy.

  3. **Finite Sensitivity (or Non-arbitrariness under finite perturbations):**
     - **Motivating case:** Adding or removing a finite number of welfare subjects (or making finite changes to welfare) in an infinite world should not reverse the value ranking of two worlds. For example, if world A is better than world B, then adding one happy life to B (or removing one from A) should not make B better than A.
     - **Status:** Genuine requirement. Without this, the theory would be too fragile to be practical.

  4. **Handling Infinite vs. Finite Worlds:**
     - **Motivating case:** Comparing an infinitely long happy life with a long finite happy life. Also, comparing a finite world of extremely happy people with an infinite world of slightly less happy people (the "paradise" case). The theory must provide a way to compare such worlds.
     - **Status:** Genuine requirement. These are central to existential risk and long-termism.

  5. **Usability in Expected Value Reasoning:**
     - **Motivating case:** Under uncertainty about whether the world is finite or infinite (or about the extent of the future), the theory must allow for expected value calculations. It cannot go silent exactly when a decision is live (e.g., when we are uncertain whether an action leads to a finite or infinite future).
     - **Status:** Genuine requirement (given the purpose). The theory must be action-guiding.

  6. **Additivity (or some form of separability):**
     - **Motivating case:** We often want to break down value by regions, times, or groups. However, strict additivity (where the value of the whole is the sum of the values of the parts) is known to cause problems in infinite settings (e.g., the "two spheres" paradox). The theory should have a coherent way of aggregating parts without necessarily requiring that the total is the sum (if that leads to contradictions).
     - **Status:** This is a matter of taste to some extent, but a form of separability is often desired. However, it is known that additivity, the Pareto principle, and finite sensitivity are jointly unsatisfiable in infinite settings (as shown by the work of e.g., Lauwers and Vallentyne). Thus, we must relax one.

  7. **Avoiding the Repugnant Conclusion (or similar counterintuitive results):**
     - **Motivating case:** In the paradise case, a finite world of extremely happy people (Paradise) vs. an infinite world of slightly less happy people (Mere Heaven). Some theories might declare Mere Heaven better because the infinite sum of any positive value is infinite, but this seems repugnant because each individual in Paradise is much better off. The theory should not force us to prefer Mere Heaven over Paradise without a compelling reason.
     - **Status:** This is a matter of taste to some extent (as the repugnant conclusion is a matter of intuition), but avoiding highly counterintuitive results is a common desideratum. However, note that in infinite settings, the repugnant conclusion might be unavoidable if we insist on additivity and dominance.

  Now, note that the joint requirements of Pareto, Finite Sensitivity, and Additivity are known to be incompatible in infinite settings. Therefore, at least one must be relaxed.

  **Proposed Genuine Requirements (non-negotiable):**
  - Pareto Principle (2)
  - Finite Sensitivity (3)
  - Usability in Expected Value Reasoning (5)
  - Definiteness (or justified silence) (1)

  **Handling Infinite vs. Finite Worlds (4) is also a genuine requirement, but it might be subsumed under the others.**

  **The additivity requirement (6) is negotiable and might be the one to relax.**

  **Avoiding the Repugnant Conclusion (7) is a matter of taste, but it is a strong intuition for many.**

  **The Incompatibility:** 
  It is proven that no social welfare order (for an infinite population) can satisfy the following three conditions simultaneously: 
  - Strong Pareto (a strengthening of our Pareto principle) 
  - Anonymity (which is related to finite sensitivity) 
  - Full comparability (always being able to rank any two alternatives). 

  Even without full comparability, the combination of Pareto and a form of additivity (like finite additivity) with finite sensitivity leads to problems. Therefore, we must give up one.

  **Escape Routes:**

  1. **Expansion Ledgers (or Hyperreal numbers):** Represent utility by hyperreal numbers (infinitesimals and infinite numbers). This allows for comparisons of infinite worlds by assigning hyperreal values. 
     - *Check:* Satisfies definiteness (1), Pareto (2) if done carefully, finite sensitivity (3) might hold, and usability in expected value (5) is possible but complex. However, it may lead to counterintuitive results (like the repugnant conclusion) and the assignment of hyperreal utilities is arbitrary.

  2. **Spatiotemporal Density (e.g., average utility over a suitable region):** Compare worlds by the average utility in some base region or by the limit of finite averages. 
     - *Check:* May violate Pareto (if the average is unchanged by improving one life in an infinite world) and finite sensitivity (if adding a finite number doesn't change the average). Also, it might be silent or arbitrary in comparisons between finite and infinite worlds.

  3. **Banning Actual Infinities:** Argue that physical reality is finite (due to the universe's finite lifetime or quantum mechanics). 
     - *Check:* Solves the problem by making it irrelevant. But in the context of existential risk and cosmic futures, we are uncertain about infinity, so we must account for it. Also, we might be in an infinite universe. This approach fails to handle the uncertainty requirement (5).

  **Conclusion on Escape Routes:**
  None of the escape routes fully satisfy all the genuine requirements without introducing new problems. Expansion ledgers (hyperreals) come closest to providing definiteness and usability but require arbitrary choices and may not avoid counterintuitive results. Density approaches often fail Pareto and finite sensitivity. Banning infinities avoids the problem but is not tenable under uncertainty about the nature of the universe.

  Therefore, the desiderata force us to relax additivity and perhaps accept that we cannot always compare two worlds (but then we must have a decision-making procedure that works under uncertainty even in the face of incomparability). Alternatively, we might relax finite sensitivity in a controlled way (e.g., by using the overtaking criterion) or Pareto (but that seems less desirable).

  **Final Checklist of Genuine Requirements:**
  1. **Definiteness or Justified Silence:** The theory must either give a verdict for any pair of worlds or explain when and why it doesn't, and how to decide in the face of silence.
  2. **Pareto Principle:** If one world is better for at least one subject and worse for none, it is at least as good.
  3. **Finite Sensitivity:** Finite changes (adding/removing finitely many subjects or making finite welfare changes) should not reverse the ordering of two worlds.
  4. **Infinite-Finite Comparability:** The theory must handle comparisons between infinite and finite worlds (including infinite lives vs. finite lives and paradise cases).
  5. **Usability in Expected Value:** The theory must be applicable under uncertainty about the finiteness of the world, without silence at critical decision points.

  Given the known impossibilities, we must be prepared to relax one requirement. The most common approach is to relax additivity (and accept that we might not have a complete ordering) and then use a decision rule that works with incomplete orders (like dominance or extensions). Alternatively, we might relax finite sensitivity by allowing that finite changes can affect the ordering only in a bounded way (as in the overtaking criterion).
answer: |-
  Here's a checklist of desiderata for an adequate theory of aggregative value in infinite worlds, grounded in real decision-making under uncertainty. Requirements are categorized by status (**Genuine Requirement**, **Taste**, or **Contextual**), with motivating cases and notes on feasibility.

  ---

  ### **Core Desiderata**  
  1. **Definiteness or Explicit Silence**  
     - **Motivating Case**: Comparing an infinite world of high-average welfare vs. one with slightly lower average welfare but infinite beings. *Must* either declare one better/worse or justify incomparability.  
     - **Status**: **Genuine Requirement**. Silence must be justified (e.g., "genuine moral ambiguity") and not default to indecision when actions have stakes.  
     - **Feasibility**: Necessary for decisions but may conflict with additivity (see §7).  

  2. **Pareto Dominance (Weak)**  
     - **Motivating Case**: If *every* being in an infinite world is at least as well off as in another, and one is strictly better, the former must be strictly better.  
     - **Status**: **Genuine Requirement** (non-negotiable). Violations imply rejecting universally accepted dominance reasoning.  

  3. **Finite Sensitivity**  
     - **Motivating Case**: Adding a single suffering being to an otherwise identical infinite world shouldn’t make it *better* than a paradise.  
     - **Status**: **Genuine Requirement**. Without this, theories are manipulable or absurd in practice (e.g., by adding/removing individuals).  
     - **Feasibility**: Jointly inconsistent with additivity + Pareto under infinity (proofs exist).  

  4. **Infinite vs. Finite Comparability**  
     - **Motivating Case**: Choosing between (A) a 100-year utopia for 10¹⁰ beings and (B) an *infinite* universe with 0.1% lower welfare per being.  
     - **Status**: **Contextual** (essential for existential risk). Must address this to inform real prioritization (e.g., extinction prevention vs. small welfare gains).  

  5. **Action-Guidance Under Uncertainty**  
     - **Motivating Case**: Cosmic uncertainty (e.g., "Is the universe finite?"). The theory *must* output decisions when inputs are indeterminate (e.g., via dominance, risk aversion, or bounded reasoning).  
     - **Status**: **Genuine Requirement**. Silence at decision points = paralysis in cause prioritization.  

  ---

  ### **Debatable Desiderata**  
  6. **Additivity/Separability**  
     - **Motivating Case**: Valuing localized interventions (e.g., Earth vs. distant galaxies) independently.  
     - **Status**: **Taste**. Intuitive but *provably incompatible* with Pareto + Finite Sensitivity in infinite worlds. Relax if necessary.  

  7. **Avoiding the Weak Repugnant Conclusion**  
     - **Motivating Case**: Preferring a *finite* paradise (all lives near perfection) over an *infinite* "meh" world (each life slightly positive but barely worth living).  
     - **Status**: **Taste**. Some camps demand it; others accept it if mathematically unavoidable.  

  8. **Temporal Consistency**  
     - **Motivating Case**: Comparing an immortal life with finite segments (e.g., first 100 years vs. eternal life). Verdicts shouldn’t reverse based on arbitrary time-slicing.  
     - **Status**: **Genuine Requirement** (avoids contradictions in dynamic decisions).  

  ---

  ### **Key Inconsistencies**  
  - **Impossible Trilemma**: You **cannot** simultaneously satisfy:  
    (a) Pareto Dominance,  
    (b) Finite Sensitivity,  
    (c) Additivity.  
    *Proof*: See impossibility theorems (e.g., Lauwers 2010). Relax additivity or accept Pareto violations (but §2 is non-negotiable).  
  - **Infinite-Finite Tradeoffs**: No theory fully escapes counterintuitive results (e.g., finite paradise vs. infinite "meh" forces harsh tradeoffs).  

  ---

  ### **Escape Routes vs. Requirements**  
  - **Expansion Ledgers** (e.g., hyperreals): Satisfies §1 (definiteness) and §4 (comparability), but violates §3 (finite sensitivity) and may conflict with §7 (repugnance).  
  - **Spatiotemporal Density** (e.g., average utility): Violates §2 (Pareto) in infinite worlds (improving one being leaves average unchanged) and §4 (finite vs. infinite).  
  - **Ban Infinities** (physical finitism): Avoids problems but fails §5 (decision-making under uncertainty) – we must *handle* probabilistic infinities in cosmic futures.  

  ---

  ### **Recommendation**  
  Prioritize §1-3, §5, and §8. Sacrifice strict additivity (§6) to preserve Pareto (§2) and Finite Sensitivity (§3). For §4 (infinite vs. finite), seek a theory that:  
  - Uses **asymptotic dominance** (e.g., "eventually better" in aggregative sequences) or  
  - **Expected value with fallbacks** (e.g., lexical thresholds under finitude uncertainty).  
  Reject any theory that is silent (§1) or inconsistent (§8) when decisions are live (§5).
