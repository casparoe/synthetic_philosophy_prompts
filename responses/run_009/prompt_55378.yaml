  ## Sestina: Mary Emerges

  The **facts** were flawless, mapped on every screen,
  Each wavelength parsed, each neural trace defined.
  She knew the **tomato**, shape and spectral place,
  Yet knowledge lacked the texture, lacked the sting.
  Steel door sighs open. Light attacks the air.
  Is this the **ability** to finally *see*?

  She thought she’d understand the act to **see**,
  Had catalogued each cause, each small effect. The **facts**
  Were whole, she swore, complete within the **room**.
  No wavelength gap remained for her to find.
  But here, the shock, the overwhelming **red**!
  Is *this* the missing piece, the vibrant **word**?

  She searches for the perfect, piercing **word**,
  A label sharp enough for what she’s forced to **see**.
  It floods her vision, raw and bright: the **red**!
  Is it a skill, this processing? The **facts**
  Predicted optic nerve’s precise cascade. Defined
  Pathways ignite. Why feels it like escape, this **room**?

  Beyond the threshold, leaving the grey **room**,
  A new connection sparks. She grasps for **word**
  Or concept. Was this latent, deep, defined
  Within the structures learned? Or must she **see**
  To truly know this part, beyond mere **facts**?
  The **tomato** glows, a challenge: saturated **red**.

  It pulses, undeniable, this **red**.
  No symbol held within her monochrome **room**
  Could hold this fire. She knew the physical **facts**:
  Absorption, reflectance, coded in a **word**.
  But *this* – the visceral assault – to **see**
  It… is it knowing? Or a new **ability**?

  Perhaps it’s just the practiced **ability**
  To call this quality to mind – this **red**.
  Not revelation, just the act to **see**,
  Triggering links formed long within her **room**.
  Perhaps the difference is a novel **word**,
  Assigned, not found, beyond the core of **facts**.

  She steps, the cool air sharp. Defined,
  A sudden skill? This new **ability**
  To link the raw sensation to the **word**
  She always knew described the blaze: the **red**.
  The sterile certainty of that stark **room**
  Dissolves. What did she gain? Can she now **see**

  Beyond the **facts**? The **tomato**, fiercely **red**,
  Burns in the light. A new **ability**?
  Or just the **word**, made flesh, outside the **room**?

  **The red of the tomato burns.**

  ---

  **Notes:**  
  "Facts" anchors the physical knowledge Mary possessed.  
  "Ability" embodies the Ability Hypothesis.  
  "Word" signifies the Phenomenal Concept Strategy.  
  "Red" stands for the genuinely new property the dualist claims.  
  "Room" signifies the confinement and its completeness.  
  "See" represents the contested act of novel experience itself.
