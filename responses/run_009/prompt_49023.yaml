  Okay, let me start by unpacking this user's query. They run an online reading group that started with philosophy of mind but has drifted into various arguments. The recurring pattern involves disputes about the existence of things like chairs, holes in pipes, and corporations. One side argues that these things don't fundamentally exist, while the other points to practical realities like suing corporations. Eventually, someone says the disagreement is just semantic, but the other side rejects that, insisting there's a real philosophical issue at stake.

  First, I need to identify the core issue. The user wants a name for the meta-dispute: when an argument about objects turns into an argument about whether the original argument was merely verbal. They also seek literature on criteria for when such dissolution works and when it doesn’t, plus terms for the opposing positions.

  Hmm, the user mentions examples like chairs being compared to phlogiston. That's reminiscent of eliminative materialism or ontological reductionism. The corporation example touches on social ontology. The hole debate relates to mereology. These are all under the umbrella of metaphysics and ontology.

  The key here is the second-order disagreement. The dissolution move is similar to Carnap's linguistic frameworks or Wittgenstein's language games. But the resistance to dissolution aligns with Quine's rejection of the analytic-synthetic distinction. Quine's "On What There Is" argues that existence questions aren't just about language but about what we commit to in our best theories. 

  The user noted that sometimes dissolution works (everyone loses interest after clarifying terms), and sometimes it doesn’t (the denier insists the issue remains). Why? I recall Eli Hirsch's work on verbal disputes. He says a dispute is verbal if both parties can agree on the facts but still disagree due to word meanings. But in cases like the chair example, the eliminativist isn't just quibbling over words; they're making a metaphysical claim that chairs aren't fundamental. So dissolution fails because the disagreement is about ontological commitments, not semantics.

  The user also asks for terms. For the dissolution move: "semantic ascent" (Quine) or "diagnosing a merely verbal dispute." For the resistance: "ontological realism" or "metaphysical realism." But maybe more specific terms are needed. "Dissolutionism" vs. "Robust Realism"? The latter emphasizes that existence claims are factual beyond language.

  Literature-wise, besides Quine and Hirsch, Amie Thomasson's deflationism could help. She argues that many existence questions dissolve once we understand the application conditions of our concepts. But critics like Theodore Sider, with his metaphysical realism, would say there's a privileged structure to reality that our concepts might not capture.

  The user might need criteria to distinguish when dissolution works. If the dispute persists after clarifying definitions, it's likely substantive. If it hinges on different conceptual frameworks without factual disagreement, it's verbal. But the tricky part is when one party rejects the framework itself, like the chair denier rejecting macroscopic objects as real.

  Also, the user’s group seems stuck in meta-arguments, which might frustrate productive discussion. They might benefit from frameworks that move beyond dissolution attempts, focusing instead on pragmatic criteria for existence, like the corporation example where legal accountability is key.

  In summary, the core phenomenon is the meta-dispute over whether a disagreement is merely verbal. Key terms could be "meta-ontological dissolution" vs. "ontological robustness." Literature from Quine, Hirsch, Thomasson, and Sider provides criteria. The resistance position is rooted in metaphysical realism, while dissolution aligns with deflationism. Providing these terms and distinctions should help the user navigate their group's debates more effectively.
answer: |-
  This recurring phenomenon in your reading group is a fascinating microcosm of deep debates in metaphysics, ontology, and philosophy of language. It absolutely has names, established literature, and identifiable positions. Let's break it down:

  1.  **The Core Phenomenon: Meta-Ontological Disagreement & The Dissolution Attempt**
      *   **Name:** This *second-order dispute* is most precisely called a **Meta-Ontological Disagreement**. Specifically, it's a disagreement *about* the nature of ontological disputes themselves – whether a particular first-order dispute (e.g., "Do chairs exist?") is substantive or merely verbal.
      *   **The Dissolution Move:** The attempt to resolve the first-order dispute by declaring it "merely verbal" is called **Semantic Ascent** (Quine) or **Diagnosing a Merely Verbal Dispute** (Hirsch). This involves shifting the discussion from the object-level ("What exists?") to the meta-level ("What do we *mean* by 'exist' or 'chair' or 'hole'?").

  2.  **The Position Resisting Dissolution: Robust Ontological Realism**
      *   **Name:** The position insisting that there is a genuine, language-independent fact of the matter about what exists, which cannot be dissolved by semantic ascent, is **Ontological Realism** or **Metaphysical Realism** (especially in its **Robust** form).
      *   **Core Tenet:** Reality has a definite structure and ontology *independently* of our conceptual schemes, languages, or interests. Our task is to *discover* this structure, not just negotiate meanings. Semantic dissolution dodges this fundamental metaphysical question.

  3.  **The Position Advocating Dissolution: Meta-Ontological Deflationism/Non-Factualism**
      *   **Name:** The position arguing that many or all ontological disputes *can* be dissolved by clarifying meaning or revealing conceptual differences is **Meta-Ontological Deflationism** or **Ontological Non-Factualism**.
      *   **Core Tenet:** Questions like "Do chairs *really* exist?" often lack a single, objective answer independent of a chosen conceptual framework or linguistic practice. The dispute arises from a misunderstanding about the framework being used, not a disagreement about a framework-independent reality. Clarifying the framework dissolves the pseudo-dispute.

  **Key Literature & Criteria for Dissolution:**

  1.  **W.V.O. Quine:** Foundational. In "On What There Is" (1948) and "Two Dogmas of Empiricism" (1951), Quine attacked the analytic/synthetic distinction and argued against "semantic ascent" as a way of *evading* ontological commitment. For Quine, ontological questions are settled by our best *scientific theory* – we are committed to whatever entities our theory quantifies over as existing ("To be is to be the value of a bound variable"). He saw ontological questions as substantive, scientific questions, *not* merely linguistic ones. **Resists easy dissolution.** His criterion for existence is pragmatic/scientific: what does our best theory require?
  2.  **Rudolf Carnap:** Quine's main foil. In "Empiricism, Semantics, and Ontology" (1950), Carnap distinguished *internal questions* (about existence *within* a linguistic framework, e.g., "Is there a chair in this room?") which have factual answers, and *external questions* (about the framework itself, e.g., "Do chairs *as such* exist?") which are non-factual, pragmatic choices about which language/conceptual scheme to adopt. **Strong advocate for dissolution.** Disputes about external questions are meaningless pseudo-disputes; choose the framework most useful for your purpose.
  3.  **Eli Hirsch:** Directly addresses "merely verbal disputes." In books like "Quantifier Variance and Realism" (2011), Hirsch argues that many ontological disputes (e.g., mereological disputes about composition) are "merely verbal." His key criterion: **If two speakers can *translate* each other's assertions into their own language without loss of meaning, and thereby agree on all the underlying facts described non-ontologically (e.g., about particle arrangements, legal actions, pipe metal distribution), then their ontological disagreement is merely verbal.** The chair denier and chair affirmer might be using "exist" differently ("fundamentally exist" vs. "commonsensically exist"), but agree on all physical facts. **Strong advocate for dissolution.**
  4.  **Amie Thomasson:** A contemporary deflationist. In "Ontology Made Easy" (2015), she argues that for many concepts (especially "everyday" and "social" kinds like chairs, holes, corporations), existence questions can be answered straightforwardly by applying the application conditions *already built into the concept*. If something meets the criteria for being a chair (functional, structural, cultural), then it exists – no deep metaphysical mystery. Resisting this is often a confusion about concept application. **Advocate for dissolution for many cases.** Her criterion: Apply the concept's own rules.
  5.  **Theodore Sider:** A robust realist. In "Writing the Book of the World" (2011), Sider argues for a privileged "structure of reality" captured by a uniquely "joint-carving" language. Ontology aims to discover this structure. Semantic dissolution often ignores the quest for finding the language that best matches reality's fundamental structure. **Strong resister of dissolution.** His criterion: Does the concept/category carve nature at its *fundamental* joints?

  **Coined Terms for Clarity in Your Group Discussions:**

  *   **The Dissolution Move:** **Framework-Relative Diagnosis (FRD)**
      *   **Definition:** The claim that the apparent first-order ontological disagreement (e.g., "Do Xs exist?") arises *solely* from the disputants implicitly operating within different conceptual frameworks or assigning different meanings to key terms (like "exist," "thing," "X"). Resolving the dispute requires clarifying these frameworks/meanings, revealing that there is no substantive disagreement about the underlying non-ontological facts (e.g., particle arrangements, legal consequences, physical configurations). The FRD claims the dispute is *empty* at the object-level.
      *   **Clear Case Success:** Disputants realize they mean different things by "chair" (e.g., fundamental particle aggregate vs. functional artifact), agree on all physical descriptions of the world, and lose interest in the "existence" question because it was purely terminological. (Hirsch's translation test passes).
      *   **Clear Case Failure/Borderline:** The chair-denier insists that *even after* clarifying meanings and agreeing on particle arrangements, the question "But are chairs *REAL*, *fundamental* constituents of the universe?" remains urgent and substantive. They reject the frameworks offered as inadequate for capturing the "true" ontological question. They see the FRD as changing the subject or dodging the core metaphysical issue (Quinean/Siderian resistance). Borderline cases involve disagreement over *which* non-ontological facts are relevant (Is legal enforceability a "fact" that settles corporate existence, or just part of the framework?).

  *   **The Resistance Move:** **Ontological Robustness Claim (ORC)**
      *   **Definition:** The rejection of the Framework-Relative Diagnosis. It asserts that the first-order ontological dispute (e.g., "Do Xs exist?") concerns a genuine, objective fact about the structure of reality itself, independent of human concepts, languages, or interests. Semantic clarification or framework specification does *not* dissolve the dispute; it merely clarifies the terms of a disagreement about what the world is *fundamentally* like. The ORC claims the FRD itself is a substantive (and often mistaken) metaphysical position.
      *   **Clear Case:** The chair-denier, after semantic clarification, insists: "I understand you use 'chair' to refer to functional assemblies of particles. But I'm asking if such assemblies are *genuine entities* in the ultimate furniture of the universe, or just useful patterns we impose. That question isn't answered by defining words; it requires deep metaphysical investigation (or looking at fundamental physics)." They see the FRD as a form of anti-realism or deflationism they reject.
      *   **Borderline:** Cases where the disputant argues that the *relevant* framework for determining "existence" *must* be a privileged one (e.g., fundamental physics, a "joint-carving" ontology) and that other frameworks (commonsense, legal) are derivative or less "real," making the dispute substantive *because* it's about which framework gets ontology right. Also borderline: When the resistance appeals to intuitions or "obviousness" (like "But you can *sue* a corporation!") that the dissolver dismisses as framework-dependent.

  **What's Really Happening & The Edges:**

  The core phenomenon is a clash between:
  *   **Deflationism/Non-Factualism:** Ontology is mostly (or entirely) about the conceptual frameworks/languages we choose for pragmatic reasons. "What exists?" is answered relative to a framework. "Fundamental existence" is either nonsense or just means "exists within our best scientific framework." (Carnap, Hirsch, Thomasson).
  *   **Robust Realism:** There is one objective, mind-independent structure to reality. Ontology aims to discover this structure. Our languages and concepts are attempts to *latch onto* this structure; some latches are better than others. "What exists?" is a substantive question about this structure. (Quine, Sider, David Lewis in parts).

  **The Edge Cases/Difficulties:**

  1.  **The Status of "Facts":** What counts as the "underlying non-ontological facts" that the FRD appeals to? Are legal facts (suing, fines) "facts" that ground corporate existence, or are they *part* of the social framework the ORC might deem non-fundamental? This is often the crux of the corporation debate.
  2.  **Pragmatism vs. Fundamentalism:** Is usefulness (the chair concept works great for daily life, the corporate concept works for law) a *sufficient* ground for existence (Deflationist view), or merely evidence pointing to something deeper, or irrelevant to fundamental ontology (Robust Realist view)?
  3.  **The "Just" in "Just Semantics":** The ORC argues that the FRD smuggles in a substantive metaphysical view (deflationism) under the guise of neutral semantics. The FRD argues the ORC is mistaking linguistic confusion for deep metaphysics.
  4.  **Intractability:** These meta-ontological positions are often foundational and hard to argue for or against without begging the question. Why believe in a privileged "fundamental" structure? Why believe ontology is *only* about frameworks? This can lead to the stalemates you observe.

  **Conclusion for Your Group:**

  You are grappling with **Meta-Ontological Disagreements**. The dissolution move is **Framework-Relative Diagnosis (FRD)**, embodying **Meta-Ontological Deflationism**. The resistance is the **Ontological Robustness Claim (ORC)**, embodying **Robust Ontological Realism**.

  *   **FRD succeeds clearly** when disputants agree on *all* relevant non-ontological descriptions of the world and realize their disagreement hinges *only* on how to apply a word ("exist", "thing", "chair") within their descriptive framework (Hirsch's translation test).
  *   **FRD fails/is resisted (ORC prevails)** when one or both disputants believe the disagreement persists *even after* semantic clarification because it concerns what the world is *fundamentally* like, independent of frameworks. They see the FRD as illegitimate avoidance of this deeper question (Quine/Sider).

  Introducing the terms FRD and ORC, along with referencing the core literature (Quine vs. Carnap, Hirsch, Thomasson vs. Sider), should provide your group with much clearer tools to identify *where* in the meta-debate they are stuck and what the underlying philosophical commitments are that drive the resistance to dissolution. It might not resolve the debates, but it will illuminate their structure and depth.
