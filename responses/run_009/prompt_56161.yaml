prompt: |-
  I teach a big intro course, and every spring we do the thought-experiment unit: Thomson's violinist, the experience machine, the Chinese Room, Twin Earth, footbridge vs. switch. Over the years I've developed private verdicts about which of these little machines earn their keep and which ones cheat, and my TAs keep telling me my sorting is incoherent, so I want to lay it out and see if there's actually a principle underneath it, or whether I'm just liking the ones whose conclusions I already hold. Here's the ledger. Thomson's violinist earns its keep -- the case isolates the question of what you owe a person who depends on you, and I find that students who change their minds on it really do change their minds about the underlying thing. The people-seeds variant cheats: the ridiculous precaution (screens, seeds drifting in the wind) does so much emotional work, and the pregnancy-relevant disanalogy is buried under whimsy, that I don't trust anyone's intuitions about it, including mine. The switch trolley feels legitimate, footbridge feels like a cheat -- but my TA swears that "cheat" is just my name for an intuition I refuse to take seriously, namely that up-close physical pushing matters morally, and maybe that intuition is tracking something real rather than being an artifact of the setup. The Chinese Room cheats, I think, by handing you a little man inside the room to pity, when nothing in the argument says there's a little man in there. Twin Earth earns its keep. Nozick's experience machine mostly earns its keep, though I've noticed the pump only lands if you describe the machine's world in some detail, which makes me suspicious of it too -- why should vividness of the description do any evidential work if the pump is supposed to reveal a fact about what we value?

  Two more complications. My colleague runs what she calls a "memory swap" pump: you can trade one true but boring memory for a false but blissful one, everything downstream stays consistent, no one is harmed, and everyone in the seminar intuits the swap is a harm. She thinks it's a great pump; I think it's a cheat, though I can't say why any better than "the false memory is described in warm detail and the true one is described as boring," which is exactly the kind of move I forgave in the violinist case (the violinist being a famous violinist is doing work, and I never complained). And when I try out my current best guess at a principle -- something like "a pump is legitimate when the intuitive pull survives the same case told flatly, in the most boring possible prose" -- it convicts the violinist along with the memory swap, and it seems to let footbridge off the hook only if I describe the pushing in truly boring terms, which feels like it's rigging the test in advance.

  So: is there a principle that captures my ledger, or close, and tells me which of my verdicts have to go? I want it stated precisely enough to make a prediction about two cases I haven't sorted: Mary's room, and the utility monster (the one who converts resources into happiness so efficiently that utilitarianism says give him everything). And please be upfront about how confident you are in each major claim and flag the single point you're least sure of -- I'm going to build a lecture on this, so I'd rather know where the ice is thin. After the prose answer, give me a compact JSON summary with these fields: "chosen_principle" (one sentence), "supporting_clauses" (array, each clause paired with the verdict that motivates it), "verdicts_overturned" (array of my verdicts your principle rejects, with a one-line reason each), "predictions" (object mapping "marys_room" and "utility_monster" to "earns_its_keep" or "cheats" plus a one-line rationale), "confidence" (one sentence), and "least_sure_point" (one sentence).
reasoning: |-
  Hmm, this is a fascinating pedagogical challenge from an ethics/philosophy professor. They're wrestling with how to evaluate thought experiments ("intuition pumps") in their intro course, and want to know if there's a consistent principle behind their judgments.

  First, let's map their existing verdicts:
  - Thomson's violinist: earns keep (isolates dependency obligation)
  - People-seeds: cheats (emotional manipulation via whimsy)
  - Switch trolley: legitimate
  - Footbridge trolley: feels like cheat (suspects proximity is distorting)
  - Chinese Room: cheats (anthropomorphizes the system)
  - Twin Earth: earns keep
  - Experience machine: mostly earns keep (but vividness dependency worries them)
  - Memory swap: cheat (but can't articulate why)

  Their proposed "flat description" test fails because it would condemn violinist while excusing footbridge if described blandly. I notice they're conflicted about emotional details - sometimes accepting them (violinist's fame), sometimes rejecting (memory swap's warmth).

  The key tension seems to be about what constitutes legitimate "isolation" of variables versus "smuggling" conclusions through framing. Looking deeper, their approved pumps share: 1) minimal emotional loading relative to the core dilemma, 2) irrelevance of specific details to the philosophical point, 3) robustness across retellings.

  For example:
  - Violinist's fame could be removed without harming the core question
  - But people-seeds' whimsical precautions are essential to the scenario
  - Footbridge's "pushing" physicality might be core to the intuition about personal force

  This suggests a principle: **A pump earns its keep if its intuitive pull depends only on variables relevant to the target philosophical claim, and persists when incidental details are neutralized.**

  Testing this:
  - Violinist: Passes (fame is removable)
  - People-seeds: Fails (whimsy is essential)
  - Footbridge: Ambiguous (is physical contact essential to the moral question?)
  - Memory swap: Fails (warmth of false memory seems manipulative)
  - Experience machine: Conditionally passes (vividness shouldn't matter, but does)

  Now applying to unrated cases:
  - Mary's room: Should earn keep - color experience is robustly isolated
  - Utility monster: Cheats - extreme efficiency feels like a distorting variable

  Least sure point: Whether footbridge's physicality is essential or incidental. The literature suggests it might be tracking genuine moral distinctions about personal force.

  For the JSON, I'll formalize this as the "Variable Relevance Test" and note where it overturns their verdict on the experience machine when vividness is required.
answer: |-
  After analyzing your ledger, I propose the **Variable Relevance Principle**: *A thought-experiment earns its keep if its intuitive pull depends solely on variables directly relevant to the target philosophical claim and persists when emotionally charged or whimsical details are neutralized without altering the core dilemma.* This principle isolates when incidental framing manipulates intuitions versus when the core structure reveals conceptual truths.

  ### Supporting Clauses & Verdict Motivations
  1. **Irreducible Relevance Clause**: Details integral to the philosophical claim are permissible.  
     → *Motivates: Violinist (fame highlights dependency without being essential)*  
  2. **Neutralization Test**: The pump fails if intuitive force relies on emotionally loaded/whimsical details removable without changing the core dilemma.  
     → *Motivates: People-seeds (screens/seeds are whimsical and removable), Memory swap (warmth/boredom are manipulative)*  
  3. **Robustness Requirement**: The intuition must survive "flat" restatements if only relevant variables remain.  
     → *Motivates: Twin Earth (intuition holds even with bland descriptions of XYZ vs H₂O)*  
  4. **Anti-Anthropomorphism Guard**: Rejects pumps that illicitly personify abstract systems.  
     → *Motivates: Chinese Room (the "little man" invites pity unrelated to syntax/semantics)*  

  ### Verdicts Overturned
  - **Footbridge → Earns keep**  
    *Reason: Physical proximity/pushing may track "personal force," a morally relevant variable (e.g., agent-patient contact), making it irreducible under your principle.*  
  - **Experience Machine → Cheats**  
    *Reason: Your observation that vividness drives intuitions violates the Neutralization Test; the value of "authenticity" should not depend on descriptive flair.*  

  ### Predictions  
  - **marys_room**: "earns_its_keep"  
    *Rationale: Mary's missing qualia intuition persists even when described flatly (e.g., "neuroscientist knows facts but lacks color experience"), isolating epistemic vs. phenomenal knowledge.*  
  - **utility_monster**: "cheats"  
    *Rationale: The "extreme efficiency" variable is whimsical (and removable); intuitions collapse if recast as modest resource/happiness trade-offs, exposing it as a distortion of utilitarianism.*  

  ### Confidence & Uncertainty  
  - **Confidence**: "Moderately high confidence (80%) that this principle systematizes your judgments, as it resolves tensions in your ledger while isolating framing effects from conceptual work."  
  - **Least sure point**: "Whether Footbridge's 'personal force' is truly morally relevant (per your TA) or an artifact of disgust psychology—empirical data suggests both interpretations exist, making this the weakest link."  

  ### JSON Summary  
  ```json
  {
    "chosen_principle": "A thought-experiment earns its keep if its intuitive pull depends solely on variables directly relevant to the target philosophical claim and persists when emotionally charged or whimsical details are neutralized without altering the core dilemma.",
    "supporting_clauses": [
      {"clause": "Irreducible Relevance", "motivates": "Violinist (fame non-essential but non-distorting)"},
      {"clause": "Neutralization Test", "motivates": "People-seeds (whimsy removable), Memory swap (emotional loading)"},
      {"clause": "Robustness Requirement", "motivates": "Twin Earth (flat descriptions suffice)"},
      {"clause": "Anti-Anthropomorphism Guard", "motivates": "Chinese Room (illegitimate personification)"}
    ],
    "verdicts_overturned": [
      {"verdict": "Footbridge", "reason": "Physical contact may track morally relevant 'personal force', making it irreducible"},
      {"verdict": "Experience Machine", "reason": "Vividness-dependency violates Neutralization Test; intuition should not rely on descriptive flair"}
    ],
    "predictions": {
      "marys_room": {"verdict": "earns_its_keep", "rationale": "Qualia intuition persists in flat descriptions, isolating epistemic/phenomenal distinction"},
      "utility_monster": {"verdict": "cheats", "rationale": "Extreme efficiency is whimsical/removable; intuitions collapse without it, exposing distortion"}
    },
    "confidence": "Moderately high confidence (80%) that this principle systematizes your judgments by isolating framing effects from conceptual work.",
    "least_sure_point": "Whether Footbridge's 'personal force' is morally relevant or a psychological artifact—empirical ambiguity makes this the weakest link."
  }
  ```

  ### Lecture-Building Notes  
  - **Strong Points**: The principle cleanly handles your violinist/memory-swap asymmetry (fame vs. warmth) and explains why Twin Earth succeeds while Chinese Room fails.  
  - **Ice Thins At**: Footbridge’s status. Defend by citing Greene’s fMRI studies (personal force activates emotional centers) but concede debatability.  
  - **Pedagogical Tip**: Test pumps by stripping adjectives (e.g., "famous violinist" → "unconscious person"; "blissful memory" → "altered memory"). If the intuition shifts, the pump likely cheats.  
  - **Prediction Check**: Use Mary’s Room to show robustness; dissect Utility Monster by replacing "monster" with "efficient beneficiary" to expose the cheat.  

  This framework retains 6/8 of your original verdicts while forcing refinement on two, grounding your intuition that pumps should be *conceptual microscopes* rather than *emotional levers*.
