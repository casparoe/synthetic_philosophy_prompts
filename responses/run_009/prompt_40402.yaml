answer: |-
  After analyzing your cases and intuitions, I propose a unified principle that accounts for all your verdicts, resolves conflicts, and provides clear guidance for new cases. The core idea is a generalized deference principle that handles both objective chances and expert opinions by leveraging your expectations of the truth-determining process. I'll state the principle precisely, then walk through each case, including the rat and lottery scenarios, showing how it applies. Finally, I'll explain where your intuitions might conflict and why I'd resolve them as I do.

  ### The Unified Deference Principle
  **Formulation**:  
  Your credence in proposition \(A\), given your total evidence \(E\), should be:  
  \[
  \mathrm{Cr}(A \mid E) = \mathbb{E}[\mathrm{Ch}(A) \mid E]
  \]  
  where:  
  - \(\mathrm{Ch}(A)\) is the **objective chance** of \(A\) at the relevant time (if \(A\) is chancy), or the **deterministic truth value** of \(A\) (if \(A\) is determined, i.e., 0 or 1), or the **best available estimate** of \(A\) from a reliable expert (if direct chances are unavailable).  
  - \(\mathbb{E}[\cdot \mid E]\) denotes **expectation** over your credence-weighted possibilities given \(E\).  
  - **Key constraints**:  
    1. **Inadmissible Information**: If \(E\) includes "inadmissible" information (e.g., direct evidence of the outcome that bypasses chance or expert estimates), defer to \(E\) directly via standard conditioning.  
    2. **Symmetry Default**: If \(E\) implies symmetry over outcomes (e.g., no breaking information), set \(\mathrm{Cr}(A \mid E)\) using a uniform prior over those outcomes.  
    3. **Expert Adjustment**: If \(E\) includes an expert's report \(R\), set \(\mathrm{Cr}(A \mid E) = \mathbb{E}[\mathrm{Ch}(A) \mid R, E]\), which equals \(R\) only if the expert is well-calibrated and you have no overriding information. If the expert is biased or imperfect, adjust using your model of their reporting process.  

  **Why this works**:  
  - It extends the traditional Principal Principle ("match credence to known chance") to handle ignorance of chances, deterministic settings, and expert deference.  
  - It treats "chance" flexibly: objective probability (for indeterministic events), deterministic truth (0/1) under uncertainty, or expert estimates (when chances are inaccessible).  
  - The expectation operator \(\mathbb{E}\) averages over your uncertainties about chances/truths, unifying cases like the loaded die or deterministic coin.  
  - Inadmissibility and symmetry handle edge cases like glimpsed outcomes or complete ignorance.  

  Now, let's apply this principle to all your cases, including the rat and lottery.

  ---

  ### Case-by-Case Application
  #### 1. **Fair coin, no other information**  
  - **Your verdict**: Credence \(0.5\).  
  - **Principle application**:  
    - \(E\): Coin is fair (symmetry over outcomes).  
    - \(\mathrm{Ch}(\text{heads})\) is known to be \(0.5\).  
    - \(\mathbb{E}[\mathrm{Ch}(\text{heads}) \mid E] = 0.5\).  
  - **Clause**: Direct chance deference (no uncertainty).

  #### 2. **Atom with known half-life**  
  - **Your verdict**: Defer to quantum chance.  
  - **Principle application**:  
    - \(E\): Quantum chance of decay is \(p\).  
    - \(\mathbb{E}[\mathrm{Ch}(\text{decay}) \mid E] = p\).  
  - **Clause**: Direct chance deference.

  #### 3. **Loaded die, unknown bias**  
  - **Your verdict**: Credence \(1/6\).  
  - **Principle application**:  
    - \(E\): Die is loaded but bias unknown (symmetry over faces).  
    - \(\mathrm{Ch}(\text{face}_i)\) is unknown, so \(\mathbb{E}[\mathrm{Ch}(\text{face}_i) \mid E]\) requires expectation over possible biases.  
    - Symmetry default: Uniform prior over biases \(\implies \mathbb{E}[\mathrm{Ch}(\text{face}_i) \mid E] = 1/6\).  
  - **Clause**: Symmetry default when chances are unknown.

  #### 4. **Deterministic coin flip, unknown initial conditions**  
  - **Your verdict**: Credence \(0.5\).  
  - **Principle application**:  
    - \(E\): Deterministic system, but initial conditions unknown (symmetry over outcomes).  
    - \(\mathrm{Ch}(\text{heads})\) is deterministic (0 or 1), but you lack inadmissible info about initial conditions.  
    - Symmetry default: Uniform prior over initial conditions \(\implies \mathbb{E}[\mathrm{Ch}(\text{heads}) \mid E] = 0.5\).  
  - **Clause**: Symmetry default for deterministic truths under ignorance.

  #### 5. **Deterministic coin, glimpse the outcome**  
  - **Your verdict**: Credence drifts toward what you saw (not 50/50).  
  - **Principle application**:  
    - \(E\): Includes glimpse (e.g., "looks like heads"), which is **inadmissible information** about the outcome.  
    - Defer to \(E\) directly: Update credence via standard conditioning on the glimpse.  
    - \(\mathrm{Ch}(\text{heads})\) is 0 or 1, but \(E\) breaks symmetry.  
  - **Clause**: Inadmissible information overrides chance deference.

  #### 6. **Weather forecaster (well-calibrated) says 30% rain**  
