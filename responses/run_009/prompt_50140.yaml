  Okay, the user is a science and ideas journalist for a national magazine, focusing on how governments assign monetary values to things considered priceless, like human life or health. They've covered examples like the Value of a Statistical Life (VSL) in the US, Quality-Adjusted Life Years (QALYs) in the UK, and the controversial EPA senior death discount. 

  What they're really digging for is the unspoken theory of value behind these bureaucratic practices. Specifically, they want to know whether these methods require full commensurability (everything measurable on a single scale) or just comparability (ranking options without exact equivalence). They've noticed contradictions—like agencies listing some benefits as "unquantified" while crunching numbers elsewhere, or the UK making exceptions for end-of-life drugs despite QALYs theoretically treating all life-years equally. 

  The journalist is sharp. They're not just regurgitating the usual "everything has a price" critique; they sense the reality is weirder. Their questions reveal a deeper itch: *Is this arithmetic fundamentally dishonest, or is it a necessary fiction for decision-making?* They even wonder if regulators could use these tools while privately believing health and money are incommensurable. 

  The senior death discount case is their litmus test. Was the public outrage a rejection of the EPA's math (fewer life-years saved = lower value) or a revolt against quantifying life at all? That clash hints at what voters *really* value versus what spreadsheets capture. 

  I need to reconstruct the implicit theory meticulously. Start by distinguishing commensurability from comparability. Show how agencies *act* as if commensurability holds for quantified elements (VSL, QALY-dollar thresholds) but betray doubt when they exempt certain goods or bend rules. Highlight where the practice is overdetermined (e.g., thresholds demand commensurability) versus where it's flexible (unquantified effects suggest comparability suffices). 

  For the incommensurability question: Yes, a regulator could run spreadsheets while believing choices are hard (no "better" option). The numbers become procedural tools, not truth-claims—like using meters without believing length is fundamentally metric. But ditching the pretense of measurement would change everything: thresholds couldn't be "correct," just negotiated. 

  The EPA debacle was both moral and methodological. The math (fewer life-years) conflicted with society's view that elder life isn't depreciable. Voters likely hold a pluralist theory: life has intrinsic worth *and* practical trade-offs exist, but mixing them feels sacrilegious. Agencies reduce this tension to arithmetic; the public sees reductionism as betrayal. 

  Final note: The journalist might be circling a bigger idea—that these methods are *rituals* to manage the unbearable weight of valuing life. The numbers aren't "wrong"; they're coping mechanisms. That’s the unspoken theory.
answer: |-
  Your question cuts to the philosophical core of regulatory economics. The implicit theory of value underpinning these practices is a **constrained utilitarian commensurability framework**, operating under **procedural legitimacy** rather than metaphysical truth. Let's reconstruct it precisely:

  ### Core Structure of the Implicit Theory
  1. **Commensurability for Decision-Forced Domains**:  
     Agencies assume that when society *must* choose between saving lives/spending money, health and dollars become *procedurally commensurable*. This isn't metaphysical ("a year of life *is worth* $100k") but operational ("we *treat* a QALY as worth £20k–30k to make allocative decisions"). The arithmetic requires cardinality: cost-per-QALY thresholds demand interval-scale measurement (a QALY gain of 2 must be "twice as good" as 1).

  2. **Comparability for Non-Monetized Goods**:  
     Unquantified effects (e.g., dignity, biodiversity) are acknowledged as *lexically superior* but non-cardinal. They’re comparable in a weak ordinal sense ("preserving wetlands is better than destroying them"), but excluded from the ledger because they lack agency-sanctioned conversion factors. This creates a two-tier system:  
     - **Commensurable domain** (health-years, mortality risk, market goods)  
     - **Non-commensurable domain** (intrinsic values, rights-based claims)  

  3. **Fungibility with Exceptions**:  
     QALYs assume life-years *are* fungible *unless specified otherwise* (e.g., end-of-life adjustments). These carve-outs aren't contradictions but **domain restrictions**: the model treats all QALYs equally *within its operational scope*, but political/social constraints override pure arithmetic at boundaries (e.g., short extensions for terminal patients).

  ### What the Practice Strictly Requires vs. What It Allows
  | **Practice Element**          | Strictly Requires                                  | Compatible With Rival Theories          |
  |-------------------------------|---------------------------------------------------|-----------------------------------------|
  | Cost-per-QALY thresholds      | Cardinal commensurability of health & money       | None (fails without cardinal scale)     |
  | VSL calculations              | Cardinal scaling of mortality risk & wages        | None (relies on wage-risk tradeoffs)    |
  | Unquantified effects in CBA   | Only comparability (ordinal ranking)              | Any theory accepting incommensurables   |
  | End-of-life adjustments       | Comparability + domain restrictions               | Value pluralism; contextualism          |

  ### Could an Incommensurabilist Run the Spreadsheets?
  **Yes, but procedurally.** An official could view the numbers as:  
  - **Conventional tools**: Like the meter, a socially accepted standard without ontological claims.  
  - **Decision heuristics**: Resolving "hard choices" (where neither option is better, yet a choice is forced) via agreed-upon rules.  
  However, this requires suspending belief that the numbers "measure" value. The moment thresholds are treated as *discoverable truths* (e.g., "The *real* VSL is $10M"), commensurability is implicitly affirmed.

  ### If Incommensurability Were Taken Seriously
  - **VSL/QALY thresholds would become conventions, not measures**: Like currency exchange rates, their authority would derive from institutional acceptance, not purported accuracy.  
  - **CBA would shrink**: Many effects now monetized (e.g., ecosystem services) would move to the "unquantified" column.  
  - **Multi-criteria decision analysis (MCDA) would dominate**: Trade-offs presented without conversion (e.g., "Option A saves 100 lives but costs $2B more; Option B saves 50 lives at $1B less").  

  ### The Senior Death Discount: A Collision of Logics
  The EPA’s move was **internally logical but morally incomplete**:  
  1. **Agency logic**: If VSL reflects future earnings potential (as some models assume), lower valuation for seniors is consistent. If QALYs are fungible, saving 10 life-years is "worth more" in a 40-year-old than a 70-year-old.  
  2. **Public outrage**: Revealed society’s rejection of *pure fungibility*. Voters operate with:  
     - **Deontological constraints**: Elderly lives possess equal intrinsic worth irrespective of productivity.  
     - **Contextual value pluralism**: Life-value isn’t reducible to time/earnings; it includes relational roles, dignity, and symbolic meaning.  
  3. **The collision**: Agencies reduced value to a single dimension (life-years or productivity); the public insisted on **irreducible pluralism**. The discount’s abandonment signaled that some domains (age, disability) are politically off-limits for commensuration—even if economically justifiable.

  ### Your Sharpened Question: Commensurability vs. Comparability
  **CBA requires cardinal commensurability *for the variables it monetizes***. However:  
  - The *overall system* accepts comparability for non-monetized goods.  
  - Exceptions (e.g., end-of-life adjustments) reveal **pragmatic incommensurability**: Society demands that certain values remain unconverted, even within quantified domains.  

  ### Honest Assessment
  The agencies’ theory is **instrumental utilitarianism with pluralist escape valves**. It works because it:  
  1. Provides actionable outputs for resource allocation,  
  2. Allows democratic correction when commensuration clashes with social values (e.g., senior discount repeal).  
  **The flaw**: It obscures its own normative choices (e.g., whose preferences inform wage-risk studies? Which conditions get QALY adjustments?) behind technical procedures. The public rightly intuits that not all values survive translation into spreadsheets—but lacks tools to articulate alternatives. This tension won’t resolve; it’s the price of governing in a pluralistic world with limited resources.  

  Would you like to explore specific reform proposals (e.g., deliberative valuation, mandatory equity weights) to bridge this gap?
