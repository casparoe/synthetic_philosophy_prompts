  Hmm... The ensemble vs reality contrast feels richest. Most people intuitively think "average outcome" means typical experience, but Kelly teaches that multiplicative growth makes median and mode outcomes diverge wildly from mean. That's both profound and joke-worthy. 

  The EV maximizer going broke is tempting too - it's such a delicious paradox. But explaining why betting entire bankroll is disastrous requires understanding variance and ruin, which might need more setup. Whereas "multiverse you is rich, real you eats ramen" is instantly visceral.

