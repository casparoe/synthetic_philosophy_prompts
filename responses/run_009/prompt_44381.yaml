prompt: |-
  ok so I'm a journalist, I cover science and ideas for a general-audience outlet, and my editor has learned that if she lets me, every third column becomes a stealth math column. next up I'm writing about the Kelly criterion — you know, the thing where if you're making a long series of bets, the smart move is to size each bet as a fraction of your bankroll so that you maximize the geometric growth rate, which is why you never, ever bet everything even on a clearly favorable coin. my editor's one request was "can you end it with something funny for once" and I intend to weaponize this.

  so: write me a joke about Kelly betting / geometric rationality. the punchline has to actually turn on the content, not just be a generic gambling joke with "expected value" slapped on it. some stuff I think is genuinely funny and fair game: the expected-value maximizer who bets his whole stack every time because every single bet is +EV, and is therefore "optimal," and yet goes broke with probability one if he plays long enough. or the difference between the ensemble average (a million parallel copies of you, some of whom got super rich, so "on average" you're fine) and what actually happens to the one you, over time, in the world where losses compound multiplicatively. or the fact that one coin flip at generous odds is a great deal but a thousand of them in a row with your whole bankroll is a machine for turning money into nothing. also feel free to poke at the people who treat half-Kelly as some kind of moral philosophy.

  constraints: my readers are smart but maybe a third of them won't know what a log is, so the joke can't require the formula. and it should make someone who actually knows this stuff (e.g. the finance guys who email me angrily every time) go "heh, yeah" rather than "that's not how any of this works." one joke, tell it properly, and if you want to add a one-line alt version for a different audience go ahead but the main thing is the one joke. also, keep it clean enough for print, my editor already flagged my draft's use of "degenerate" as a pun that only I would enjoy. thanks!!
