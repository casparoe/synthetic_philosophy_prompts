prompt: |-
  My roommate and I have been arguing about the doomsday argument (the Carter/Leslie one, where you reason from your birth rank among all humans to conclude doom probably comes sooner rather than later) and I want a third opinion with actual numbers attached. I'm at maybe 0.5 that the argument is basically sound, she's at maybe 0.15, and neither of us can really say where the disagreement lives.

  Here's the proposition I want your credence on: conditional on setting aside exotic stuff like ancestor simulations and infinite observer-counts, the doomsday argument provides a genuine evidential boost to the claim that humanity will turn out to be short-lived -- say, that fewer than 10^12 humans will ever exist -- relative to what you'd conclude from ordinary empirical considerations (existential risks, civilizational trends) alone. The argument is sound in that sense. What's your number?

  I don't want 'it depends on your choice of anthropics.' Decompose it: roughly, the probability that some self-sampling approach in the SSA neighborhood is the right way to reason about your own observer-index, the probability that the reference class problem gets resolved in a way that puts you in the same class as all past and future humans (rather than just, say, people who know about the argument, which changes everything), the probability that the anthropic update survives once ordinary background knowledge is factored in (if you already put low credence on trillions of future humans for mundane reasons, the update is doing almost no work), and any other terms you think belong. Give each a number and one line of justification, then combine them, then tell me which term you're least confident in. Then, if you can, tell me where you'd guess the gap between me at 0.5 and her at 0.15 most likely sits.

  Two side things while you're at it. My roommate thinks Gott's version -- the Copernican principle one, where you observe humanity is about 200,000 years old and conclude with 95% confidence it ends between roughly 5,000 and 8 million years from now -- is just the same argument in worse clothing. I think it's actually a different argument, because Gott's uses literally no background knowledge, just the temporal version of being a random sample, and the Bayesian version leans on priors over total population. Say who's closer and why.

  And finally, be honest about what would change your mind: which single sub-question, if you turned out to be wrong about it, would move your overall number the most, and what kind of argument or thought experiment would do the moving. I'd rather have a number you actually believe with its weak points marked than a hedge.
