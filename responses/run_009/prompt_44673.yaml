prompt: |-
  So my friend and I spent literally four hours last night arguing about The Waste Land and now I need a professional philosopher of literature to settle it. You're a philosopher specializing in authorial intention and the meaning of texts, so think carefully before answering, and start with a quick brainstorm of the possible positions before committing to one.

  The facts of the case (these are common knowledge, but restating so we're on the same page): Eliot wrote a huge messy draft of The Waste Land in 1921-22, handed it to Ezra Pound, and Pound savagely cut it -- roughly half the material got axed, including a long opening section. Eliot accepted basically all the cuts, published the poem in 1922, and dedicated it to Pound with a Dante phrase meaning something like "the better craftsman." Eliot later said the poem owed its survival to Pound. The drafts only surfaced in 1971, when Valerie Eliot published the facsimile with Pound's annotations. Oh and when Pound first read the draft he wrote back to Eliot, "complimenti, you bitch."

  Here's the argument we got stuck on. I took the intentionalist side: the meaning of the poem is (at least partly) a function of Eliot's intentions, so the *meaning* of The Waste Land should be recoverable from what Eliot was trying to do, and the cut material matters as evidence of those intentions. My friend thinks that's incoherent here, because Pound's cuts weren't Eliot's intentions at all -- they were Pound's. So either meaning tracks Eliot's intentions (and then the cuts are vandalism by a non-author that the author stupidly accepted), or meaning tracks the published text (and then intentionalism is false, at least for this poem). She also had this analogy I couldn't fully rebut: she said the drafts are like the scaffolding on a cathedral -- you can see the holes where it stood, but nobody thinks the scaffolding is part of the cathedral.

  What I want is a proper case analysis that runs in both directions:

  1. Run the episode through actual intentionalism (Ezra Pound cuts, Eliot accepts -- whose intentions count as "the author's"? does consent transfer them? what about intentions Eliot had about the cut lines?), through hypothetical intentionalism (what an idealized reader of the published text would attribute to the author -- does that even notice that Pound exists?), and through the anti-intentionalist / death-of-the-author view (the text means what it says, and the Pound story is just gossip).
  2. Say where each theory goes silent or has to force it -- e.g., does any of these views have anything at all to say about whether Pound counts as a co-author versus an editor? Is that even an interpretive question or a different kind of question entirely?
  3. Tell me whether the episode is an anomaly for intentionalism or a case it handles just fine. My friend says any theory that survives this episode unchanged was never really making claims about poems like this one. Is she right?
  4. And deal with the scaffolding analogy -- is it any good? Where does it break?

  Also, if there's a fourth position that neither of us thought of that handles the case better than all three, I want to hear it. Please don't just survey the views and tell me it's complicated -- give me your actual verdict, and say who won the argument (I'm fine losing, she's insufferable when she wins but I'd rather know).
