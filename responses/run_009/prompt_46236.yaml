  ### Expect the Best with Dr. Ines Marchetti  
  *The Prairie Sentinel, June 12th*  

  **Dear Dr. Marchetti,**  
  I’ve been offered a job paying $90,000, but there’s a 20% chance of layoff within a year. If laid off, I’d face six months unemployed before finding a $70,000 role. My current job pays $80,000 with stability. Is the risk worth it?  
  —Deciding in Des Moines  

  **Dear Deciding,**  
  A dominant choice emerges from expected-value analysis. Your current position yields a fixed $80,000. The new role’s expectation:  
  - Probability of retention (80%): $90,000  
  - Probability of layoff (20%): Six months at $0 ($0) + six months at $70,000 ($35,000), totaling $35,000 for the year.  
  Thus, EV = (0.8 × $90,000) + (0.2 × $35,000) = $72,000 + $7,000 = $79,000. This falls $1,000 below your current salary. Remain in place.  

  **Dear Dr. Marchetti,**  
  After two pleasant dates, I’m considering a third. I estimate a 60% chance of a fulfilling long-term relationship (value: +100 "happiness units") and a 40% chance of a painful breakup (–20 units). The date itself costs 5 units (time, nerves). Should I go?  
  —Romantically Uncertain  

  **Dear Uncertain,**  
  Apply expected value. Attending the date:  
  - Success (60%): +100 – 5 = +95 units  
  - Failure (40%): –20 – 5 = –25 units  
  EV = (0.6 × 95) + (0.4 × –25) = 57 – 10 = +47 units. Not attending yields 0. A positive expectation dominates; proceed.  

  **Dear Dr. Marchetti,**  
  A carnival game involves flipping a fair coin until heads appears. If heads first lands on flip *n*, I win (–1)^n × 2^n / n dollars. (e.g., heads on flip 1: –$2; flip 2: +$2; flip 3: –$2.67; flip 4: +$4). The carny charged $1 to play. I refused—but what *is* fair? Should one play for free?  
  —Coin-Flipped in Crawford County  

  **Dear Coin-Flipped,**  
  The expected value is the sum over *n* of [probability × payout]. Probability of first heads on flip *n* is (1/2)^n. Payout is (–1)^n × 2^n / n. Thus:  
  EV = σ [ (1/2)^n × (–1)^n × 2^n / n ] = σ [ (–1)^n / n ] from *n*=1 to ∞.  

  This is the alternating harmonic series. Partial sums oscillate:  
  - *n*=1: –1  
  - *n*=2: –1 + 1/2 = –0.5  
  - *n*=3: –0.5 – 1/3 ≈ –0.833  
  - *n*=4: –0.833 + 1/4 = –0.583  
  - *n*=5: –0.583 – 1/5 = –0.783  
  Convergence is slow and non-absolute; the harmonic series σ (1/*n*) diverges. Under Riemann’s rearrangement theorem, reordering terms yields arbitrary sums—or divergence. For instance:  
  - Group as (–1 + 1/2) + (–1/3 + 1/4) + ... → –0.693 approximately.  
  - Rearrange as (1/2 – 1) + (1/4 – 1/3) + (1/6 – 1/5) + ... → –0.693 again?  
  But consider: 1/2 + 1/4 – 1 + 1/6 + 1/8 – 1/3 + ... yields partial sums diverging to –∞. The expectation is undefined; no finite value is "correct."  

  **Practical guidance**: Truncating the series ignores tail events, yet the tail dominates. At *n*=100, partial sums ≈ –0.688; at *n*=101, ≈ –0.698. The choice of truncation point arbitrarily sways the result. A "fair" fee is thus incoherent.  

  **Conclusion**: Do not play. The undefined expectation implies exposure to unbounded volatility. A fee of $0 still risks substantial loss, and rational analysis cannot endorse it.  

  ---

  Dr. Ines set down her pen. The editor’s deadline loomed, and "undefined" was not an answer fit for print. She reread her reply, the numbers blurring. *Why* had she settled on truncation? *Why* had she dismissed rearrangement? The serene logic of expected value—her compass—now spun like the carnival wheel in the letter. She could not reconstruct the steps that led to "do not play." The whiteboard in her study, scarred with coffee rings from the tenure incident, held only fragmented sums. Yet the column was sent. Her readers would have their answer. She stared at the alternating signs, their dance mocking the illusion of control. The method had not failed the question; the question had exposed the method. Still, the paper would publish it. Expected value, undefined, had been maximized into certainty.
