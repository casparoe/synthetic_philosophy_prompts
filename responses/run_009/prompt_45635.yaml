  First, I need to identify the core issue: the discrepancy between factual accuracy and perceived authenticity. The user mentions that estates, legal issues, and reviews often focus on whether a film feels "true to" the person, despite factual inaccuracies. This suggests that there's an underlying concept of essence versus events. 

  The user's questions point towards reconstructing the implicit theory of truth in these practices. They wonder if it's about capturing the person's "essence," and whether that's coherent. Also, they ask if alternative theories could explain the same practices, and what would change if strict accuracy were enforced.

  I should start by exploring the essence theory. It's common in biographical narratives to prioritize the subject's core traits or legacy over exact events. For example, compressing timelines might maintain the essence by showing cause and effect more clearly, while inventing a confrontation could misrepresent their character. The composite character might erase real individuals' contributions, altering the essence of relationships.

  Next, considering rival theories. A "just the facts" approach with audience discounting assumes viewers know it's dramatized and don't believe false claims. But the user's discomfort suggests that some inventions feel like misrepresentations, not just dramatizations. The "person as sum of events" theory doesn't align with the selective acceptance of changes—some alterations are tolerable, others aren't, based on impact on judgment.

  The boundary seems tied to interpretive stakes. Changes affecting moral judgment or legacy are contentious. Invented confrontations or composites can mislead viewers' perceptions of the person's relationships or actions, which feels deceptive. Whereas compressed timelines might not alter the core judgment.

  Considering the practical effects of enforcing strict accuracy: disclaimers, vignettes instead of narratives, potential loss of thematic depth. Films might become fragmented, losing emotional resonance. The trade-off is between factual precision and narrative coherence.

  The user's deeper need might be understanding how we reconcile truth with storytelling, and whether the current system balances respect for real people with artistic expression. They might also be grappling with the ethics of representation—when does artistic license become misrepresentation?
answer: |-
  You've pinpointed a fascinating paradox at the heart of biographical and historical drama: the **Essence-Accord Theory**. This implicit, widely shared understanding prioritizes perceived "truth to the person's core being" over strict factual fidelity, allowing for significant narrative manipulation while drawing seemingly arbitrary lines. Here's a reconstruction and analysis:

  **The Core Implicit Theory: Essence-Accord**

  1.  **The Premise: Persons Have a Discernible "Essence":** The theory presupposes that a real person possesses a fundamental, relatively stable core – their *character*, *spirit*, *driving motivations*, *key relationships*, *overall life trajectory*, or *legacy-defining nature*. This "essence" transcends the specific chronology and granular details of events.
  2.  **The Goal: Dramatic Resonance with the Essence:** The primary aim of the biopic/historical drama isn't a documentary record, but creating an **emotionally and psychologically resonant experience** that *feels* like it captures "who this person fundamentally *was*" or "what their life *meant*."
  3.  **The Method: Selective Compression, Invention, and Embellishment:** To achieve this resonance within a 2-hour narrative frame, filmmakers freely employ techniques that sacrifice factual precision:
      *   **Compression/Conflation:** Merging events, characters, or time periods is acceptable *if* it efficiently conveys the *nature* of the person's experiences, relationships, or challenges without fundamentally distorting the perceived essence (e.g., compressing a decade of struggle into a montage).
      *   **Invented Dialogue:** Since exact words are rarely recorded and internal states must be externalized, invented dialogue is essential and accepted *if* it feels "true to character" – what the person *might* or *would likely* have said in that situation based on their known personality and views.
      *   **Symbolic Representation:** Using fictionalized scenes or details to *symbolize* a known truth about the person's character, struggles, or impact (e.g., an invented visual metaphor representing their addiction).
  4.  **The Boundary: Essence Distortion:** The line is crossed when an invention or alteration **fundamentally distorts the perceived essence of the person or significantly misrepresents key relationships:**
      *   **Inventing Significant Actions/Events:** Creating a major confrontation, betrayal, triumph, or failure that never happened (like your musician's argument) risks fundamentally altering the audience's understanding of the person's character, motives, or core relationships. It imposes a fictional *interpretation* onto their essence.
      *   **Composite Characters:** Merging real individuals (like the bandmates) erases the specific contributions, relationships, and individuality of real people. It distorts the *nature* of the protagonist's relationships and the historical context, potentially misrepresenting the essence of their collaborations or conflicts. It also disrespects the legacies of the merged individuals.
      *   **Attributing False Motives:** Inventing core psychological drivers not supported by evidence distorts the essence itself.
      *   **Reversing Moral Stances:** Portraying someone acting against their known, deeply held principles flips their essence on its head.

  **Why Your Lines Make Sense Under This Theory:**

  *   **The Invented Confrontation (Your Friend's Issue):** This isn't just invented dialogue; it's an invented *significant event* defining the relationship with the brother. It risks imposing a fictional emotional core or conflict onto their real dynamic, potentially distorting the essence of *both* individuals and their bond.
  *   **The Composite Character (Your Issue):** This erases two distinct individuals and their unique relationships with the musician. It distorts the *nature* of his collaborations, potentially simplifying complex dynamics or misattributing actions/ideas, thus misrepresenting the essence of his professional relationships and the band's history.

  **Is "Essence" Coherent? Is it a Polite Fiction?**

  1.  **Coherence (With Caveats):** The concept is coherent *as a narrative and psychological construct*. Humans naturally form holistic impressions of others (real or fictional) based on patterns of behavior, key decisions, and relationships. We readily accept summaries or interpretations that capture a "gist" or "core." Biopics leverage this tendency. However, this "essence" is inherently **interpretive, subjective, and unstable.** It's not a fixed, objective truth discoverable like a fact. Two people can hold different, valid views of someone's "essence." The film presents *one interpretation* of that essence, dramatized for effect.
  2.  **More Than Just a Polite Fiction:** While it *does* allow for enjoyable invention without feeling deceived, it serves deeper functions:
      *   **Narrative Necessity:** Life is messy and sprawling. Essence-Accord provides a framework for condensing complexity into a coherent, impactful story.
      *   **Emotional Truth:** It aims for the "feeling" of the person or era, which can sometimes resonate more powerfully than a dry recitation of facts.
      *   **Legacy Management:** Estates and subjects often care more about *how* they/their relative are perceived (the essence portrayed – heroic, tragic, flawed-but-genius) than whether a specific conversation happened on Tuesday or Wednesday. The line is drawn where the portrayal feels like a *libel* against their core character.

  **Where is the Boundary? Key Factors:**

  *   **Kind of Departure:** As above, *inventing significant events/actions* or *merging/distorting key identities* is far more problematic than compressing time or inventing incidental dialogue. The former directly fabricates the substance of the life; the latter alters the packaging.
  *   **Impact on Judgment:** **This is crucial.** Departures that significantly alter the *moral valence* (making someone seem crueler, more heroic, more treacherous, or more victimized than evidence suggests) or the *interpretation of their core drives* cross the line. They change how we *evaluate* the person's essence.
  *   **Likelihood of Belief:** While audiences generally understand "based on a true story" means invention, they are more likely to accept compressed timelines or invented dialogue as "representative" than they are to question a powerful, dramatic scene presented as a key event. The latter feels more like "fact" within the film's reality. Films exploit this cognitive bias.

  **Could Rival Theories Explain the Practice?**

  1.  **"Just the Facts" + Audience Discounting:**
      *   **Compatibility?** Partially. Audiences *do* implicitly discount dramatizations. They know it's "based on," not a documentary.
      *   **Does it Fully Explain? No.** This theory struggles with the *differential acceptance* of liberties. If everything is discounted equally, why object more to the invented scene than the compressed time? It also doesn't explain why estates get upset over *specific* distortions (like the essence-distorting ones) rather than all fabrications. The practice clearly treats *some* falsehoods as more problematic than others, implying a standard beyond pure factuality.
  2.  **Person as Sum of Life Events:**
      *   **Compatibility?** Low. If a person *just is* the sum of their specific actions and experiences, *any* deviation is a falsehood about *them*. Compression, invented dialogue, and composite characters would all be equally problematic distortions of the factual record. This view clashes directly with the widespread acceptance of those techniques in biopics. Your differing reactions (accepting some changes, rejecting others) also don't align with this strict view.

  **What if the Implicit Theory Were Replaced by Strict Factual Accuracy?**

  Demanding everything shown either happened or was explicitly flagged as invented would fundamentally alter the genre:

  1.  **Radical Restructuring:** Most conventional narrative structures would collapse. Linear cause-and-effect would be sacrificed to chronology. Character arcs would be fragmented. Key dramatic moments might be absent or lack impact.
  2.  **Dominance of Disclaimers & Footnotes:** Films would require constant on-screen text ("This conversation is imagined," "These two people are merged," "These events happened 5 years apart"). This disrupts immersion.
  3.  **Shift to Vignettes or Hyper-Limited Scope:** Films might focus on a single, well-documented event (e.g., one concert, one meeting) or become collages of verified moments without strong narrative through-lines.
  4.  **Loss of Emotional Resonance & Thematic Depth:** The power of biopics often comes from *interpreting* a life, finding thematic unity, and creating emotional catharsis through narrative shaping. Strict accuracy prioritizes fidelity to events over resonance with the perceived essence or meaning of the life. The "truth" becomes atomized facts, not a holistic understanding.
  5.  **Potential Gains:** Reduced historical misinformation, greater respect for the complexity of real lives and the individuals erased by composites, less scope for character assassination or hagiography through fabrication.

  **Conclusion:**

  The "Essence-Accord Theory" isn't perfect – the "essence" is a contested construct, and the boundaries are fuzzy and culturally contingent. However, it provides the most coherent explanation for the observed practices: the selective acceptance of liberties, the specific objections raised by audiences and estates, and the industry's focus on being "true to" the person rather than true to every fact. It functions as a pragmatic, narrative-driven pact between filmmaker and audience. Replacing it with strict factual accuracy would prioritize a different kind of truth (event fidelity) but likely at the cost of the narrative power, emotional resonance, and thematic interpretation that define the appeal of the genre for most viewers. The loss would be the ability to *feel* the "truth" of a life within the constraints of dramatic storytelling, even if that feeling relies on carefully managed departures from the literal record.
