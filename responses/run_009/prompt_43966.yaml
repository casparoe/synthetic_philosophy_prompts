prompt: |-
  Hey, so I'm an undergrad taking a decision theory course (econ/phil crossover thing) and I somewhat regrettably volunteered to run this week's study group before our midterm -- about ten classmates, thirty minutes, one whiteboard. The topic is the Ellsberg paradox and ambiguity aversion, and while I more or less get the classic setup myself (the urn with 30 red balls and 60 that are black or yellow in unknown proportion), the readings kind of scrambled my brain, so I really don't want to wing it in front of people who'll be grading-adjacent to me later. Assume you're an experienced teacher of decision theory who's taught this a dozen times -- please think about the pedagogical order carefully before writing anything, like actually brainstorm which ideas depend on which.

  Don't just explain the paradox to me -- I need a plan for how to walk the group through it. Specifically I want: which piece has to be in place *before* the paradox can even register as a paradox for them (my professor kept saying it's the sure-thing principle doing the real work rather than expected utility as a whole, and I only half followed that, so factor it in), the one example or variation of the urn that should carry the whole session and what makes it better than the alternatives, the misconception I'm pretty sure they'll form -- that ambiguity aversion is just risk aversion wearing a costume -- and exactly where in the sequence to kill it, one more misconception I should brace for (maybe the thing where people say you should just refuse to assign any probability at all, versus assigning a range? or how flipping to losses apparently makes people ambiguity-*seeking*? you pick whichever is most likely to actually come up in the room), and last, a single question I can ask at the end that would tell me whether they got the actual point rather than just memorizing the urn.

  Format: give it to me as a numbered list of exactly five items, one for each thing above, each item a sentence or two, and no intro or conclusion fluff -- I'm literally going to read off my laptop in the seminar room.
reasoning: |-
  Hmm, the user is an undergrad running a study group on the Ellsberg paradox and ambiguity aversion. They need a structured teaching plan for a 30-minute session with ten classmates. The key points they've outlined are: the foundational piece for the paradox, the best example to use, addressing misconceptions, another common misconception, and a diagnostic question.

  First, I need to recall the Ellsberg paradox. It involves an urn with 30 red balls and 60 that are black or yellow in an unknown ratio. People prefer to bet on red over black (both with 30 balls) but also prefer to bet on red or yellow over black or yellow, violating the sure-thing principle. The paradox challenges expected utility theory by showing ambiguity aversion.

  The foundational piece is the sure-thing principle. Without it, the paradox doesn't register. The user's professor emphasized this, so I should make it clear that it's not about expected utility generally, but specifically the sure-thing principle. People need to understand that outcomes under the same state (yellow balls) shouldn't affect preferences when comparing acts that are identical in those states.

  For the example, the classic Ellsberg urn is best. It's straightforward: 90 balls total, 30 red, 60 black/yellow unknown. Using a single urn avoids confusion from multiple urns. The key is that betting on red gives known probabilities, while black involves ambiguity. The choices should highlight the violations: Choice 1 (red vs black) shows ambiguity aversion, Choice 2 (red or yellow vs black or yellow) reveals the inconsistency.

  A major misconception is that ambiguity aversion is just risk aversion. But risk aversion applies to known probabilities, while ambiguity aversion is about unknown probabilities. I need to clarify this early, perhaps after explaining the choices but before revealing the paradox. Point out that in Choice 1, both options have the same expected probability if we assume 50-50, but people still prefer red, indicating something beyond risk aversion.

  Another misconception is refusing to assign probabilities versus using a range. Some might think the issue is not assigning any probability, but ambiguity aversion involves assigning a range and being averse to that uncertainty. Also, in loss scenarios, people become ambiguity-seeking, which contrasts with risk aversion where losses might still show aversion. This is important to mention to show the behavioral difference.

  For the diagnostic question, ask why betting on "not black" and "not yellow" separately is inconsistent. If they understand that yellow's probability cancels out in the comparison but people's preferences violate that, they grasp the paradox. It tests comprehension of the sure-thing principle's role.

  I need to ensure the sequence is logical: start with the sure-thing principle, introduce the urn, present choices, show preferences, reveal inconsistency, debunk misconceptions, and end with the question. Keep each point concise as per the user's request—numbered list with one or two sentences per item.
answer: |-
  Here's your five-point teaching sequence, optimized for clarity and flow in 30 minutes:

  1.  **Foundational Piece (The Sure-Thing Principle Pre-Paradox):** Before showing the urn, explicitly state the **Sure-Thing Principle (STP)**: If two acts yield the *identical outcome* under a specific set of states (e.g., when a Yellow ball is drawn), then preferences between those acts *should not depend* on what that identical outcome is. Their understanding of STP as a core axiom of rational choice under uncertainty is essential for the paradox to bite.

  2.  **Core Example (The Single Classic Urn):** Use **one urn with 90 balls: 30 Red, 60 Black or Yellow (unknown ratio)**. Present two sequential choices:
      *   **Choice 1:** Bet $100 on Red OR Bet $100 on Black.
      *   **Choice 2:** Bet $100 on (Red OR Yellow) OR Bet $100 on (Black OR Yellow). Record typical preferences (Red > Black in Choice 1; Red or Yellow < Black or Yellow in Choice 2). This single urn forces the ambiguity comparison directly and cleanly reveals the STP violation.

  3.  **Kill Misconception 1 (Ambiguity ≠ Risk Aversion):** Immediately **after presenting the typical preferences** but *before* revealing the paradox/STP violation, pre-empt the thought: "Some might think this is just risk aversion. But look: In Choice 1, if someone *assumed* Black and Yellow were equally likely (30 each), the *known* probability of Red (1/3) equals the *assumed* probability of Black (1/3). Risk aversion alone wouldn't explain preferring Red over Black here – the aversion is to the *unknown* probability itself, not the spread of outcomes."

  4.  **Brace for Misconception 2 (Refusing vs. Ranging Probabilities):** Be ready to counter: "Couldn't you just refuse to assign *any* probability to Black/Yellow?" Explain that **ambiguity aversion arises even if you assign a *range* of probabilities (e.g., P(Black) between 0 and 2/3)**. The paradox shows people act *as if* they use a cautious rule (like maxmin) over this range, violating STP. (Mention the loss framing flip to ambiguity-*seeking* briefly if it comes up: "Interestingly, for potential losses, people often become ambiguity-*seeking*, wanting to bet on the ambiguous source – the opposite of risk aversion!").

  5.  **Diagnostic Question (Testing Comprehension):** After walking through the STP violation (pointing out that Yellow yields the same outcome in both acts of Choice 2, so STP demands the preference between the acts shouldn't flip based on the Yellow outcome), ask: **"Why does preferring Red over Black in Choice 1, combined with preferring Black-or-Yellow over Red-or-Yellow in Choice 2, *specifically* violate the Sure-Thing Principle, not just Expected Utility in a general sense?"** (Correct answer hinges on recognizing that the outcomes under Yellow are identical in Choice 2, so STP requires consistency that the preferences contradict).
