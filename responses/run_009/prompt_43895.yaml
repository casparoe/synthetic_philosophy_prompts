prompt: |-
  I'm a third-year PhD student in history and philosophy of science, and a chapter of my dissertation tries to reconstruct how working scientists actually draw the line between science and non-science when they're forced to. My advisor — I'll call her V. — has been issuing demarcation verdicts in seminars for years, and I've been quietly keeping a list. Her record, as best I can reconstruct it:

  - Astrology: not science, and not because it fails but because it can't fail — every missed horoscope comes with a built-in escape hatch (the native's will, an unaspected planet, an uncertain birth time).
  - Intelligent design: not science.
  - Freudian psychoanalysis as a body of theory: not science — she's careful to say this isn't a verdict on therapy — because its explanatory machinery could accommodate any patient whatsoever, and in her view did.
  - Homeopathy, after the high-dilution trials came in: not science, chiefly because its defenders answered negative results by inventing new mechanisms rather than by making anything riskier.
  - The Neptune episode: exemplary science. When Uranus's orbit refused to cooperate, postulating an unseen perturbing planet and then finding it was, on her telling, exactly how a theory deserves to be rescued.
  - Ptolemaic astronomy: science — wrong, and baroque by the century, but science; epicycles had to answer to planetary positions, and their defenders cared when they missed.

  Next term a new case lands in her lap, and I'd like to predict her verdict before she gives it. A group in our own department — mathematical history, roughly — fits systems of coupled equations to the rise and collapse of states: variables for elite overproduction, popular immiseration, fiscal strain. Their papers report impressive fits to thoroughly documented outcomes: the third-century Roman crisis, the timing of the English Civil War, the Taiping Rebellion. Each failed fit is met by adding a variable or re-windowing the data. No paper contains a prediction of anything not already in the historical record when the model was built.

  I can read the first four verdicts as straightforwardly falsificationist and the last two as already a step beyond that, but I'm honestly not sure that's the only consistent reconstruction of her, and the new case sits right where my candidate readings come apart. So here's what I'd like from you: lay out the rules her record is jointly consistent with, including at least two that agree on everything above; say exactly where they diverge on this case — including whether she'll distinguish science done badly from pseudoscience at all; give me your single best prediction of her verdict with your reasons; and tell me what further case would most cleanly separate the rules that happen to agree on this one. Please commit to a prediction rather than presenting me a menu — if you think her record genuinely underdetermines the answer, say which way you'd bet anyway and how confident you are.
reasoning: |-
  Okay, let me start by really understanding what this PhD student is asking. They're in the history and philosophy of science, working on how scientists distinguish science from non-science. Their advisor, V., has a track record of verdicts on various cases like astrology, intelligent design, Freudian psychoanalysis, homeopathy, the discovery of Neptune, and Ptolemaic astronomy. Now, there's a new case involving a mathematical history group that models state rise and collapse using equations, and the student wants to predict V.'s verdict.

  First, I need to parse V.'s existing verdicts. She dismissed astrology because it can't fail—it has built-in excuses for misses. Intelligent design and Freudian theory were rejected for similar reasons; they're too flexible to be falsified. Homeopathy was deemed non-science because proponents invented new mechanisms to explain away negative results instead of risking predictions. On the other hand, the Neptune case was praised as good science because they postulated a new planet and confirmed it. Ptolemaic astronomy, despite being wrong, was considered science because it responded to empirical data.

  The student sees the first four as falsificationist (Popper's idea that science must be falsifiable). But the last two show that V. allows for theory adjustment—like adding epicycles or Neptune—as long as there's accountability to data. So V. isn't a strict falsificationist; she accepts that theories can be modified, but there's a line where modifications become ad hoc and unscientific.

  Now, the new case: mathematical historians fit equations to historical events like the Roman crisis or the Taiping Rebellion. They tweak their models by adding variables or adjusting data windows when fits fail, and they don't make predictions about future or novel events. This seems to straddle the line. On one hand, they're adjusting models based on data, similar to Ptolemy or Neptune. On the other, their adjustments might be ad hoc like homeopathy or astrology, and the lack of novel predictions is a red flag.

  The student wants at least two consistent interpretations of V.'s criteria that agree on past cases but differ here. Then a prediction and a future test case.

  One interpretation could be **Modified Falsificationism with Risky Predictions**. Here, science requires testability and adjustments must lead to new predictions. The Neptune case made a novel prediction (finding Neptune), while Ptolemy responded to data. The math history group isn't predicting anything new, so they'd be pseudoscience.

  Another is **Empirical Accountability**. Focuses on whether changes are responsive to data without necessarily requiring novel predictions. Ptolemy added epicycles but had to match observations. The math group adjusts variables to fit existing data, which might be acceptable if they're constrained. But if their adjustments are arbitrary (like astrology's excuses), it's pseudoscience.

  Where they diverge: Risky Predictions would say the math group fails because no novel predictions. Empirical Accountability might accept them if their adjustments are disciplined by data, even without predictions.

  My prediction: V. will call it not science. The lack of novel predictions and making adjustments without increasing testability aligns more with homeopathy and astrology. Plus, the tweaks (adding variables, re-windowing) seem ad hoc. V. values predictive risk, as seen in Neptune versus the non-science cases.

  Future test case: A model that successfully predicts an unknown historical event before it's discovered. If it makes a novel prediction and is confirmed, Risky Predictions would accept it, while Empirical Accountability might accept even without predictions if adjustments are data-driven. That would cleanly separate the two interpretations.
answer: |-
  Based on V.'s record and the structure of the new case, I'll reconstruct her implicit demarcation criteria, present two consistent interpretations that diverge on your department's mathematical history group, predict her verdict, and propose a decisive future test case. Your advisor's pattern suggests a sophisticated, context-sensitive view that transcends naive falsificationism while prioritizing *empirical accountability* and *theoretical risk*.

  ### Core Principles Consistent with V.'s Record
  V. consistently rejects theories that **insulate themselves from empirical disconfirmation** through unfalsifiable excuses, arbitrary adjustments, or explanatory promiscuity. She accepts theories that, even when wrong or rescued, **bind themselves to empirical constraints** and allow for *meaningful* failure. Key elements:
  1. **Falsifiability is necessary but insufficient**: All rejected cases *could* evade falsification; accepted cases (Neptune, Ptolemy) faced concrete risks.
  2. **Rescue operations must increase empirical content or testability**: Neptune's rescue *generated a novel prediction*; Ptolemy's epicycles *had to fit new data*. Rejected cases (e.g., homeopathy, astrology) rescued theories with *decreased* testability.
  3. **Explanatory over-flexibility invalidates**: Freud and ID could "explain" anything post hoc; science must rule *out* possibilities.
  4. **Predictive novelty isn't always required, but its absence heightens scrutiny**: Neptune *predicted*; Ptolemy *retrodicted* but was still constrained by *future* data points. Retrodiction alone isn't disqualifying if the model is *vulnerable* to new data.

  ### Two Internally Consistent Interpretations of V.'s Criteria
  Both interpretations agree on all past verdicts but diverge sharply on the mathematical history case.

  - **Interpretation A: The Risky Prediction Standard**  
    Science requires theories to make *novel, testable predictions* or to be rescued in ways that *generate new predictions*. Retrodiction is only scientific if the model is *applied prospectively* to unseen data.  
    - **Why it fits past cases**:  
      - Astrology/homeopathy/Freud/ID: No genuine predictions; excuses avoid risk.  
      - Neptune: Made and confirmed a novel prediction.  
      - Ptolemy: Implicitly predicted *future* planetary positions (even if often wrong).  
    - **Verdict on mathematical history**: **Not science**. Models are fitted *only* to existing data, and failed fits trigger ad-hoc adjustments (new variables, re-windowing) without generating *testable predictions* about *unseen* historical cases. No mechanism exists to force the theory to "risk" itself prospectively.  

  - **Interpretation B: The Constrained Retrodiction Standard**  
    Science requires theories to be *empirically accountable* through *non-circular testing*, even via retrodiction. Adjustments are acceptable if they *tighten* the model's fit to *new subsets of data* (not used in model-building) and avoid arbitrary flexibility. Predictive novelty is preferred but not essential if the model is *falsifiable in principle* and adjustments are *disciplined*.  
    - **Why it fits past cases**:  
      - Astrology/homeopathy/Freud/ID: Adjustments are circular and untestable (e.g., "uncertain birth time").  
      - Neptune: Exemplary for *prospective* testing.  
      - Ptolemy: Retrodictive but *tested* against *new* observations; epicycles weren't arbitrary—they had to quantitatively match data.  
    - **Verdict on mathematical history**: **Science, done questionably**. Models are fitted to *documented outcomes* (empirical accountability), and adjustments (new variables) *could* be disciplined if they improve fit to *held-out data* (e.g., partitioning historical datasets). However, V. would criticize the lack of prospective testing and warn that without it, the work risks degenerating into pseudoscience.  

  **Where they diverge**:  
  - Interpretation A hinges on **prospective testability/predictive risk**. The math group's *exclusive* reliance on retrodiction and ad-hoc adjustments aligns with pseudoscience.  
  - Interpretation B hinges on **empirical discipline in retrodiction**. If adjustments are constrained (e.g., validating models on *unused* historical data), it could be flawed science. If adjustments are arbitrary (e.g., "re-windowing" to dodge misfits), it veers toward pseudoscience.  

  ### Prediction and Confidence
  **V. will declare the mathematical history work "not science"** (aligning with Interpretation A).  
  - **Reasons**:  
    1. **Lack of prospective risk**: The absence of *any* predictions for *unseen* cases echoes astrology/homeopathy, where "fits" are manufactured post hoc. Neptune succeeded because it *risked* falsification; here, no equivalent risk exists.  
    2. **Arbitrary adjustments**: Adding variables/re-windowing after failed fits mirrors homeopathy's "new mechanisms" and astrology's escape hatches—V. sees this as *decreasing* testability.  
    3. **Explanatory promiscuity**: Like Freud, the models can "fit" any outcome by tweaking inputs, with no limits on flexibility. V. would note that variables like "elite overproduction" can be redefined to absorb failures.  
    4. **Ptolemy contrast**: Ptolemy *had* to predict *future* positions; the math group only "predicts" known past events, insulating itself.  
  - **Confidence**: **85%**. V.'s rejection of Freud/ID for over-flexibility and her praise for Neptune's predictive risk suggest Interpretation A dominates. However, she *might* initially call it "weak science" if the group can show their adjustments are empirically disciplined (e.g., testing models on *newly unearthed* historical data), but the lack of true predictions remains fatal.  

  ### Decisive Future Test Case  
  To cleanly separate Interpretation A (predictive risk required) from Interpretation B (constrained retrodiction suffices), propose a case where:  
  - **Scenario**: A climate model retrodicts *known* 20th-century temperature changes but avoids prospective predictions. When applied to *newly discovered* ice-core data from 1800–1850 (not used in model-building), it fails. The model is rescued by adding a "volcanic forcing" variable, which improves fit to the *new* ice-core data.  
  - **Separation power**:  
    - Interpretation A: Still "not science" if no *future* prediction is made (e.g., "What will 2050 temperatures be?").  
    - Interpretation B: "Science" if the adjustment is constrained by *unseen* historical data (like Ptolemy fitting new observations).  
  This case isolates whether V. demands *temporal novelty* (prediction) or just *empirical novelty* (testing against data not used in model-building).  

  **Final note**: V.'s stance is closest to *Lakatosian "sophisticated falsificationism"*—she allows theory rescue but insists it must produce *novel facts* or *excess empirical content*. The math group's lack of novel predictions and ad-hoc adjustments place them firmly in her "non-science" category. If you want certainty, observe whether she emphasizes *prospective testing* in seminar—if so, bet heavily against the group.
