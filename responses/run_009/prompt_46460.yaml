  Now, considering the disjunction: "Either the King is bald or Ottawa is the capital." Under Strawson's theory, the first part has a presupposition failure, leading to no truth value. But disjunctions are tricky. If one part is true, the whole disjunction is true regardless of the other part. Since Ottawa is indeed the capital, the disjunction should be true even if the first part is undefined. But some theories might propagate the failure. The friend might accept this as true because the second disjunct is true.

  For the conditional: "If the King is bald, then he's older than Macron." Presupposition failures in the antecedent might make the whole conditional undefined. If the antecedent has no truth value, the conditional might not be evaluable. However, in some systems, conditionals with false antecedents are true, but here the antecedent isn't false—it's undefined. The friend might see this as neither true nor false.

