answer: |-
  Based on your friend's track record, here's a breakdown of her likely verdicts on the new sentences, the underlying rules explaining her pattern, alternative rules that also fit, and how they differ, along with a proposed test case and a best guess.

  **Predicted Verdicts for the New Sentences:**

  1.  **"Either the present King of France is bald or Ottawa is the capital of Canada."**
      *   **Her Likely Verdict: TRUE.**
      *   **Reasoning:** Ottawa *is* the capital of Canada. This disjunct is straightforwardly true. In her system, the first disjunct ("the present King of France is bald") is neither true nor false (a "misfire"). However, for disjunction ("or"), if *one* disjunct is true, the whole disjunction is true *regardless* of the truth value (or lack thereof) of the other disjunct. The truth of "Ottawa is the capital of Canada" suffices to make the entire disjunction true.

  2.  **"If the present King of France is bald, then he's older than Macron."**
      *   **Her Likely Verdict: NEITHER (Misfires).**
      *   **Reasoning:** The antecedent ("the present King of France is bald") misfires (neither true nor false) due to the non-existent referent. In her system, if the antecedent of a conditional fails to express a genuine proposition (or lacks a truth value), the whole conditional also fails to express a genuine proposition or lacks a truth value. The truth or falsity of the consequent ("he's older than Macron") is irrelevant here because the antecedent's failure prevents the conditional from being properly evaluated.

  **The Underlying Rule She Seems to Be Running (Best Fit):**

  *   **Strawsonian Presupposition Failure (Gappy/Neutral Value Approach):**
      *   **Core Idea:** Definite descriptions like "the present King of France" carry an **existence presupposition**. If this presupposition fails (the referent doesn't exist), the sentence *lacks a truth value* entirely; it "misfires" or is "neither true nor false". This failure is "infectious" – if a component part of a larger sentence misfires, the whole sentence usually misfires *unless* the context "cancels" or "filters" the presupposition.
      *   **Fitting the Track Record:**
          *   "The present King of France is bald": Presupposes existence -> fails -> neither T/F.
          *   "The present King of France is not bald": Also presupposes existence -> fails -> neither T/F. (Negation doesn't cancel the presupposition).
          *   "The present King of France doesn't exist": Explicitly *denies* the existence presupposition. Because the existence *is* being asserted (negatively), there's no presupposition failure *of existence* here; it straightforwardly presupposes we are talking *about* the King to deny his existence, and this denial is true. (Strawson himself wrestled with such cases, but your friend's acceptance fits the intuition that this sentence directly addresses the existence claim).
          *   Ordinary sentences: Presupposition satisfied -> normal T/F.
      *   **Predictions for New Sentences (Strawsonian):**
          *   Disjunction ("P or Q"): If one disjunct is true, the whole is true *even if the other lacks a truth value*. (Ottawa true -> whole disjunction true).
          *   Conditional ("If P then Q"): If the antecedent `P` lacks a truth value, the whole conditional lacks a truth value. (Antecedent misfires -> whole misfires).

  **Alternative Rules Fitting the Track Record:**

  1.  **Trivalent Logic (e.g., Kleene's "Strong" Connectives):**
      *   **Core Idea:** Introduce a third truth value (e.g., # for "undefined" or "neither"). Connectives are defined by truth tables covering all three values. Kleene's strong tables are often used for presupposition: `#` propagates whenever it *could* affect the outcome.
      *   **Fitting Track Record:**
          *   "PKF bald" = # (undefined).
          *   "PKF not bald" = # (negation of # is #).
          *   "PKF doesn't exist" = True (treated as atomic, not analyzed as presupposing existence).
          *   Ordinaries: T or F.
      *   **Predictions for New Sentences (Kleene Strong):**
          *   Disjunction (T or #): T (True OR anything is True).
          *   Conditional (# -> ?): # (If Antecedent is #, Consequent is always evaluated but the whole conditional is #).

  2.  **Presupposition Cancellation/Filtering (e.g., Karttunen, Heim):**
      *   **Core Idea:** Presuppositions of parts project to become presuppositions of the whole sentence *unless* the linguistic context (like certain operators: negation, modals, conditionals, disjunction) "cancels" or "filters" them. A sentence is only T/F if its presuppositions are satisfied; otherwise, it lacks a truth value or is infelicitous.
      *   **Fitting Track Record:**
          *   "PKF bald": Presupposes existence -> unsatisfied -> misfire.
          *   "PKF not bald": Negation *does not* cancel existence presupposition -> unsatisfied -> misfire.
          *   "PKF doesn't exist": This sentence *doesn't presuppose existence*; it *asserts non-existence*. Satisfied -> True.
          *   Ordinaries: Satisfied -> T/F.
      *   **Predictions for New Sentences (Cancellation Theory):**
          *   *Crucially Contested:* How do disjunction and conditionals handle presuppositions? There's **no consensus**.
              *   **Possibility 1 (Similar to Strawson/Kleene):** Disjunction: "A or B" presupposes (Presup(A) and Presup(B)). Failure of either -> misfire. (This *wouldn't* fit your friend likely calling the disjunction true). **OR**
              *   **Possibility 2 (Common in dynamic semantics):** Disjunction: "A or B" presupposes Presup(A) OR Presup(B). If `B` is true and doesn't depend on Presup(A), Presup(A) can be ignored (filtered). (Ottawa is true -> existence of PKF *not* presupposed -> whole is True).
              *   Conditional: "If A then B" typically presupposes Presup(A) OR (something about B). If `A` has a failed presupposition, the conditional *often* still misfires, *unless* the context explicitly addresses the failure (which it doesn't here). So "If PKF bald then..." likely misfires.

  **Settled vs. Contested:**

  *   **Settled (by your friend's track record):**
      *   She rejects Russell's theory (where "PKF bald" is *false* due to the existential quantifier being false).
      *   She treats existence of a definite referent as a necessary condition for a sentence using that description to be truth-evaluable (T/F), not just for it being true. Failure leads to a truth-value gap ("neither").
      *   She treats negation ("is not bald") as preserving the gap, not creating falsity.
      *   She treats explicit existence denial ("doesn't exist") as truth-evaluable and true.

  *   **Genuinely Contested (in the literature & reflected in the alternatives):**
      *   **The behavior of connectives (and, or, if..then) with gappy/proposition-failing components:** Does `#` propagate always (Kleene Strong)? Does it only matter if it affects the outcome (Kleene Weak - doesn't fit your friend)? Do operators like "or" and "if" have special filtering abilities (Cancellation theories)? There is **significant debate and no single consensus model**.
      *   **The exact nature of the "misfire":** Is it a semantic truth-value gap (Strawson, Kleene)? Or is it pragmatic infelicity/undefinedness that *results* in the sentence not being used to make a proper assertion (some versions of Cancellation)? Your friend's "misfire" language leans semantic/gappy.
      *   **The analysis of "The PKF doesn't exist":** While all theories *can* account for it being true, the precise mechanism (how it avoids presupposing what it denies) is nuanced.

  **Best Guess with Reasons:**

  *   **Best Guess Rule:** Your friend is operating with a **Strawsonian presupposition failure/gap theory**, possibly with a **Kleene Strong trivalent logic** for connectives. She views the existence of the referent as a precondition for truth-evaluation. If this precondition fails for a component, the component is gappy, and this gap propagates to the whole sentence *unless* the connective's truth table definitively outputs T or F despite the gap (like T OR # = T).
  *   **Reasons:**
      1.  "Misfire" strongly suggests a truth-value gap.
      2.  Symmetrical treatment of "is bald" and "is not bald" as both gappy is classic Strawson.
      3.  Acceptance of "doesn't exist" as true is straightforward on this view.
      4.  The predicted verdicts for the new sentences under this model align perfectly with her likely intuitions as described: the disjunction is true (due to the true disjunct overriding the gap), the conditional is gappy (the gappy antecedent infects the whole).

  **Test Case to Split the Candidates:**

  *   **The Test Sentence:** "The present King of France is bald, or he isn't." (Formally: P ∨ ¬P)
  *   **Why it Splits the Rules:**
      *   **Strawsonian/Kleene Strong:** Both `P` ("is bald") and `¬P` ("isn't bald") are gappy (`#`). `# ∨ #` = `#` (gap). **Prediction:** NEITHER (Misfires).
      *   **Presupposition Cancellation (Filtering Version):** Crucially, disjunction `A ∨ B` can sometimes filter Presup(A) if Presup(B) is satisfied, or vice-versa. Here, `B` is `¬P`, which *has the same presupposition* (existence) as `P`. Neither disjunct can satisfy the presupposition of the other. However, some sophisticated cancellation theories might treat this as a tautology where the presupposition is *entailed* (if the King exists, he's either bald or not; if he doesn't, the disjunction is still somehow valid). **Prediction:** Highly theory-dependent, but **likely MISFIRES** (NEITHER) on standard implementations, similar to Strawson. *Some* formal systems might force it to TRUE.
      *   **Cancellation Theory (Alternative View) / Alternative Trivalent Logic (e.g., Supervaluationism/Bochvar):** Some approaches might treat tautologies like `P ∨ ¬P` as **TRUE** even if `P` is gappy, on the grounds that it would be true no matter what value `P` had if it had one. **Prediction:** TRUE.

  *   **How to Use It:** Ask your friend about "Either the King of France is bald, or he isn't bald." If she says **NEITHER** (consistent with Strawson/Kleene Strong/Standard Cancellation), it reinforces the core gap-propagating view. If she surprisingly says **TRUE** (suggesting tautologies survive gaps), it points towards a more complex cancellation view or a different trivalent logic (like Bochvar's internal logic or Supervaluationism over the gap). Her track record makes **NEITHER** seem more likely.
