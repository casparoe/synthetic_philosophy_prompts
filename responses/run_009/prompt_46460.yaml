  A test case to split the theories: "The present King of France is bald, or he isn't." Under Strawson, both disjuncts have presupposition failure, so the whole disjunction might be undefined. But under a cancellation approach, the disjunction might be true because it's a tautological form. The friend's judgment here would differentiate: if they say neither, it's Strawson; if they say true, it's cancellation.

