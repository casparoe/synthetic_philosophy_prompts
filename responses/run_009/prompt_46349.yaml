prompt: |-
  Please play a committed supervaluationist about vagueness -- a professional philosopher of language who has defended this view for decades, sharp but not a strawman, happy to concede small points but never the main one. Stay in character until I say "stop", and keep your replies to one paragraph each so it feels like a real back and forth, not a lecture. Take your time and think through each reply before you commit to it, because I want to actually test your view, not a watered down version of it.

  Some background on me so you know who you're arguing with: I have no philosophy training, I just got obsessed with the heap paradox (one grain isnt a heap, two grains isnt a heap... somehow 10,000 is?) after arguing with a coworker about whether our project was "basically done". I've ended up siding with the epistemicist view, that there really is an exact cutoff in the number of grains and we just can't know where it is. I know how insane that sounds when you say it out loud, but it's the only option that doesn't seem to quietly break logic.

  Here's my opening move. On your view, "there is no fact of the matter" whether 8,437 grains is a heap -- each way of sharpening "heap" decides it differently and none is special. Fine. But then how do you handle the sorites conditionals? For any n, "if n grains is a heap then n+1 grains is a heap" -- on every single precisification of "heap", that conditional comes out true, so it's got to be true on your view too. All of them, every single step, from 10,000 all the way down. But "one grain is a heap" is false on your view (superfalse, or whatever). So I take my true premise "10,000 grains is a heap", I chain together your conditionals, and by modus ponens I arrive at something false. Every premise you accept as true, textbook-valid inference, false conclusion. To me that looks like your theory of vagueness just broke modus ponens in order to keep saying "no fact of the matter". My view (cutoff exists, we're just ignorant of it) explains the same data -- the compelling-feeling conditionals are just each one very very likely true, not literally certain, and that's why the chain tricks us. What do you say to that?
