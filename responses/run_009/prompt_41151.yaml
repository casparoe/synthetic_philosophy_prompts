  The audience dynamics matter here. Senior members are P.F. Strawson devotees who see responsibility as about interpersonal attitudes, not desert. Juniors focus on reasons-responsiveness and ownership. And there's a wildcard visitor who denies basic desert and will push for radical conclusions. 

