  Seventh is the determinism irrelevance objection - that the argument collapses into standard incompatibilism. Must defend the uniqueness of the argument as deeper than determinism. Important for the chapter's originality.

  Eighth is the self-undermining worry - if we're not responsible, why write the dissertation? Nasty because it challenges coherence. Need careful meta-response about theoretical consistency.

  The nuclear option would be about responsibility without control - if someone argues we can have desert without ultimacy. This could turn the room because it attacks the desert premise directly. Must have a razor-sharp response prepared.

  For each objection, I'll craft:
