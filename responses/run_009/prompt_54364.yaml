  3. **Lock-in vs. Self-Correction**: 
     - In the first run (irreversible), once a standard got ahead, it became hard to stop. This is lock-in.
     - In the second run, switching allowed some correction. But note: the switching cost. How did that affect the outcome? Did the "better" standard (Beta) eventually win in the second run? Why or why not?

  4. **Convergence**: 
     - Ask: "Is Beta the better standard? How do you know?" (base is higher). 
     - "In the first run, did the better standard win? In the second run? If we ran 100 times, which standard would win more often?"

  5. **Limitations**:
     - Communication: Did any firms try to coordinate? How does that mirror real-world standards bodies?
     - The simulation cannot capture the full complexity of historical events: real agents don't know the payoff matrix and cannot rerun history. What we learn is the mechanism, not the inevitability.

  6. **Bridging the Gap**:
     - Emphasize that the simulation is a model. Real history requires interpretation. The facilitator should note that the simulation shows how small events can have large effects, but in real history, we must look for evidence of such mechanisms.

  This design should make the tension between contingency and convergence palpable.
answer: |-
  ### **In-Class Simulation: "Standard Wars"**  
  **Objective:** Illustrate the tension between historical contingency (path dependence) and convergence through a hands-on decision-making game where students, as firms, choose between two technical standards.  

  ---

  ### **Setup & Materials**  
  - **Room Setup:** Desks arranged in a horseshoe facing a central scoreboard.  
  - **Signage:** Two posters labeled "**Crystal**" (cheaper, cruder) and "**Nexus**" (better-engineered, more expensive).  
  - **Player Kits:** 18 envelopes, each containing:  
    - A unique **"Compatibility Card"** with a random integer from -3 to +3 (e.g., -2, 0, +1).  
    - **Rulesheet** with payoff formulas (see below).  
  - **Facilitator Tools:** Whiteboard to track adoptions, a coin, index cards for player names, timer.  
  - **Sequence:** Randomly draw player names to determine the adoption order. The **first two positions** are determined by a coin flip (true "historical accident").  

  ---

  ### **Rules & Payoff Scheme**  
  #### **Technical Standards**  
  - **Crystal:** Low upfront cost but limited performance.  
    - *Payoff = 3 × (Total Crystal Adopters) - Compatibility Value*  
  - **Nexus:** Higher cost but superior performance.  
    - *Payoff = 1 × (Total Nexus Adopters) + Compatibility Value*  
  *(Note: "Total Adopters" includes the current firm after adoption.)*  

  #### **Key Mechanics**  
  - **Network Effects:** Payoffs increase with the number of adopters (e.g., Crystal’s payoff rises faster with more users).  
  - **Compatibility Value:** Each firm’s private bias (card value) adjusts payoffs:  
    - *Positive values* favor Nexus (e.g., +3: Nexus gains 3 points, Crystal loses 3).  
    - *Negative values* favor Crystal (e.g., -2: Crystal gains 2 points, Nexus loses 2).  
  - **Adoption:**  
    - Firms choose in sequence (1 round = 18 turns).  
    - Decisions are public; payoffs calculated and recorded immediately.  
  - **Switching (Second Run Only):**  
    - After initial adoption, firms may switch standards in a second round.  
    - Switching cost: **10 points** (deducted from new payoff).  
    - *Rationale for 10 points:* High enough to deter frivolous switches (equivalent to ~3–4 adopters’ network effects), but low enough to allow correction if one standard dominates.  

  ---

  ### **Timeline (90 Minutes)**  
  1. **Introduction (5 min):**  
     - Explain roles (firms), standards (Crystal vs. Nexus), and goal (maximize points).  
     - Emphasize: "No prior knowledge needed; focus on your card and the board."  
     - **Do not** use terms like "path dependence" or "contingency."  

  2. **Run 1: Irreversible Adoption (25 min):**  
     - **Step 1:** Flip coin to pick first two firms ("historical accident").  
     - **Step 2:** Firms choose in sequence. Record choices and update payoffs.  
     - *Example:* Firm 3 sees 2 Crystal adopters. Compatibility = -1.  
       - Crystal: 3×(2+1) -(-1) = 9 +1 = **10**  
       - Nexus: 1×(0+1) +(-1) = 1 -1 = **0** → Chooses Crystal.  

  3. **Run 2: Switching Allowed (30 min):**  
     - **Step 1:** Reset board. Redraw sequence (new "accident"). Repeat initial adoption.  
     - **Step 2:** Switching round: Firms rechoose in same order. Pay switching cost (10 pts) if changing standards.  
     - *Example:* Firm with Nexus (payoff=8) sees Crystal now has 12 adopters. Compatibility = -2.  
       - Crystal: 3×(12+1) -(-2) = 39 +2 = **41** → Switch payoff: 41 - 10 = **31** (vs. current 8).  

  4. **Debrief (30 min):**  
     - **Contingency:** "The coin flip forced Firms 1–2 into pivotal roles. Did their choices alter outcomes?"  
     - **Increasing Returns:** "Why did later adopters follow the leader? Notice how payoffs 'snowballed'."  
     - **Lock-in vs. Self-Correction:**  
       - Run 1: "Once Crystal hit 5+ adopters, could anyone afford Nexus? This is **lock-in**."  
       - Run 2: "Switching allowed latecomers to 'correct'—but only if the gap justified the 10-point cost."  
     - **Convergence Debate:**  
       - "Did the 'better' standard (Nexus) win? Why/why not?"  
       - "If we reran this 100 times, would Crystal usually dominate? Or would Nexus win in the long run?"  
       - Link to readings: "This mirrors debates between path dependence (David) vs. efficiency/selection (Liebowitz)."  

  ---

  ### **Predictable Challenges & Fixes**  
  1. **Communication Between Firms:**  
     - **Problem:** Students may whisper, lobby, or form alliances.  
     - **Fix:** *Allow limited signaling* (e.g., "I’m leaning Nexus") but ban exact numbers. Frame as "industry lobbying" to mirror real-world coordination.  

  2. **Early Adopter Boredom:**  
     - **Problem:** First movers disengage during later turns.  
     - **Fix:** Assign roles—"Analysts" (early adopters) track payoffs and predict bandwagons.  

  3. **Weak Bandwagon Effects:**  
     - **Problem:** Payoffs may be too flat to incentivize herding.  
     - **Fix:** Use steeper network effects (Crystal: 3×, Nexus: 1×) and ensure compatibility values are small (±3) relative to network gains.  

  ---

  ### **Deepest Disanalogy & How to Bridge It**  
  - **Disanalogy 1:** Real agents lack payoff clarity. Firms *know* the rules; historical actors do not.  
  - **Disanalogy 2:** Historians can’t rerun events; we did twice.  
  - **Bridging the Gap:**  
    - **Facilitator Prompt:** "In real history, no one sees the 'compatibility card' or the payoff formula. How might this change choices? How do historians *infer* path dependence without reruns?"  
    - **Key Insight:** Emphasize counterfactual reasoning—e.g., "What if Firm 1 had chosen differently? What real-world evidence suggests such 'accidents' mattered?"  

  ---

  ### **Why This Works**  
  - **Tension Made Tangible:** Students *feel* lock-in (Run 1) and frustration when switching costs block "better" outcomes (Run 2).  
  - **Debrief Roots Theory in Experience:** Terms like "increasing returns" are introduced *after* students witness bandwagons.  
  - **Critical Flaws Addressed:** Candid discussion of disanalogies preempts overgeneralization while reinforcing key philosophical tensions.  

  **Final Tip:** Run the simulation *before* assigning that week’s readings. The visceral experience primes students to engage deeply with abstract arguments.
