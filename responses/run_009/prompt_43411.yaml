prompt: |-
  I've read enough arguments about whether a huge number of dust specks in eyes can add up to something worse than a single instance of torture, and I've noticed the two sides mostly talk past each other by appealing to different unstated requirements. So before I take a side, I want the specification rather than another argument. Write the desiderata: what any adequate rule for aggregating small harms across individuals has to deliver, with the motivating case behind each requirement.

  In particular, I'd want you to cover: which cases such a rule must get right — the same total quantity of trivial harm concentrated in one person's life versus spread across billions of lives; trivial harms repeated within a single life versus the same harms distributed so that each person gets only one; certain harms versus small probabilities of severe ones; and cases where each individual harm is so small that the person cannot notice or remember it, yet the population as a whole is measurably worse off than a counterpart population. Which distinctions must the rule respect rather than collapse — between the severity of an instance and the number of instances, between persons and person-moments, between aggregation within a life and aggregation across lives, between harms and mere unfulfilled improvements (no speck versus speck is not the same gap as no torture versus torture). And which structural constraints are non-negotiable — transitivity of the better-than relation, dominance reasoning when one population's situation is uniformly at least as good and sometimes better, impartiality between persons — as opposed to which of these are actually camp-specific prejudices dressed up as neutral requirements. Flag any pair of desiderata you suspect cannot be jointly satisfied: for instance, whether full sensitivity to arbitrarily small harms is compatible with any threshold below which we refuse to let numbers accumulate, and whether that incompatibility should be treated as a result about the desiderata themselves rather than about any particular rule. Finally, tell me which single requirement does the most work in excluding candidate rules — a strict lexically ordered threshold, a power-law or otherwise convex weighting of severity, or plain additive aggregation — and then run those three candidates briefly against the list. Keep the weight on the criteria and their motivating cases rather than on the scorecard; I'll do the final judging myself.
reasoning: |-
  Okay, the user is asking for a detailed specification of desiderata for aggregating small harms across individuals. They want to understand the key requirements that any adequate rule must satisfy, along with motivating cases for each. They also want to know which distinctions must be respected and which structural constraints are essential. Plus, they're interested in potential conflicts between desiderata and which requirement does the most work in excluding candidate rules.

  First, I need to recall the dust specks vs. torture thought experiment. The core issue is whether many trivial harms (like dust specks) can aggregate to outweigh a single severe harm (like torture). The debate often gets stuck because different sides prioritize different principles. The user wants to step back and define those principles clearly.

  The user mentioned several specific scenarios: concentrated vs. distributed harms, repeated harms within one life vs. across lives, certain small harms vs. probabilistic severe ones, and imperceptible harms that still affect a population. Each of these cases needs a desideratum that captures why it matters.

  Starting with the must-get-right cases. For concentrated vs. distributed harms (Case 1), the desideratum should reflect that spreading harm doesn't make it disappear. The motivating case here is that if we consider torture worse for one person than dust specks for many, we need to explain why aggregation matters. That's Individual Aggregation. 

  Next, intra-personal vs. inter-personal aggregation (Case 2). If one person suffers many dust specks versus many people each suffering one, are these equivalent? The desideratum here would emphasize that harms to different individuals don't aggregate the same way as within one life. Person Separateness is key here. 

  Then, certain small harms vs. probabilistic severe harms (Case 3). This is tricky because we need to handle risk and uncertainty. The desideratum should ensure that small probabilities of big harms are treated consistently. Stochastic Dominance seems important here. 

  For imperceptible harms (Case 4), even if each harm is too small to notice, the population could be worse off. The desideratum would require that such harms still count, which ties into Non-Elision. 

  Now, distinctions to respect. Severity vs. number—can't collapse them into a single metric. Person Separateness again. Within-life vs. across-life aggregation—same harm distributed differently should be distinguishable. Harms vs. unfulfilled improvements—avoiding harm isn't the same as missing out on a benefit. 

  Structural constraints. Transitivity is fundamental; without it, decisions could cycle. Pareto Dominance—if everyone is at least as well off, it should be non-worse. Anonymity—all individuals count equally. These are non-negotiable for coherence. 

  Possible conflicts? Non-Elision and Threshold might clash. If we require counting even imperceptible harms, but also want a threshold below which harms don't aggregate, that's a tension. Also, Person Separateness vs. Additive Aggregation—if we insist persons are separate, additive rules might violate that. 

  The requirement that excludes the most candidates is probably Person Separateness. Lexical thresholds and additive aggregation both struggle with it. Lexical thresholds ignore large numbers of small harms, while additive aggregation treats inter-personal aggregation the same as intra-personal, violating the separateness. 

  Running the candidates against the list: Lexical thresholds fail Non-Elision and Person Separateness. Additive aggregation violates Person Separateness. Power-law or convex weighting might handle some cases but could have issues with transitivity or stochastic dominance. 

  The user seems well-versed in this debate but wants clarity on underlying principles. They might be looking to form their own stance without the usual rhetoric. Highlighting the conflicts, especially between Person Separateness and other desiderata, could help them see why the debate persists. They might also appreciate understanding which constraints are truly non-negotiable versus those that might be more flexible depending on ethical frameworks.
answer: |-
  Here is a specification of desiderata for aggregating small harms across individuals, grounded in motivating cases and clarifying core distinctions. Each requirement highlights what an adequate rule *must* achieve or respect to avoid common failure modes in the "dust specks vs. torture" debate.

  ### I. Core Cases Any Rule Must Get Right
  1.  **Case: Concentrated Harm vs. Distributed Harm**  
      *   **Scenario:** Compare (A) One person enduring 50 years of severe torture vs. (B) 1 billion people each enduring a minor dust speck in their eye for 1 minute.
      *   **Desideratum: Individual Aggregation Sensitivity.** The rule must allow that sufficiently many instances of a *sufficiently small* harm distributed across individuals can aggregate to a total moral disvalue greater than a single instance of a *sufficiently large* harm concentrated in one individual. *(Motivation: Rules dismissing B as irrelevant regardless of scale violate moral intuition that massive distributed suffering matters. Must avoid absolute "separateness of persons" blocking aggregation entirely.)*
  2.  **Case: Intra-personal vs. Inter-personal Repetition**  
      *   **Scenario:** Compare (A) One person enduring 1 billion dust specks in their eye (one per minute over a lifetime) vs. (B) 1 billion people each enduring one dust speck.
      *   **Desideratum: Person Separateness.** The rule must treat aggregation *within a single life* differently from aggregation *across distinct lives*. A & B are *not* morally equivalent. A is significantly worse for the single individual than B is for any individual. *(Motivation: Collapsing the distinction between one life suffering chronically and many lives suffering minimally ignores the moral significance of individual identity and the cumulative burden *within* a life.)*
  3.  **Case: Certain Small Harms vs. Small Risks of Large Harms**  
      *   **Scenario:** Compare (A) 1 billion people *certainly* experiencing one dust speck vs. (B) 1 person facing a 1-in-1-billion chance of being tortured for 50 years (while others face no harm).
      *   **Desideratum: Stochastic Dominance & Risk Sensitivity.** The rule must handle probabilistic harms consistently. It must recognize that option B exposes one individual to a tiny risk of catastrophe, while option A imposes a tiny certain harm on everyone. Neither can be automatically dismissed; the rule needs a coherent way to compare expected disvalue. *(Motivation: Rules must navigate real-world decisions involving risk/uncertainty. Dismissing tiny certain harms risks ignoring widespread low-grade misery; dismissing tiny risks of catastrophe risks ignoring existential threats.)*
  4.  **Case: Imperceptible Harms & Population-Level Effects**
      *   **Scenario:** Compare Population A: 1 billion people each experience 1 dust speck too minor to be consciously noticed or remembered. Population B: An otherwise identical population where no dust specks occur. Objective measures (e.g., microscopic irritation, negligible stress hormone uptick) confirm A is worse off per capita.
      *   **Desideratum: Non-Elision of Sub-Threshold Harms.** The rule must assign *some* disvalue to harms below the threshold of individual noticeability or memorability, such that large numbers aggregating to a measurable population-level detriment can outweigh a concentrated harm. *(Motivation: To prevent rules from declaring imperceptible harms "non-harms," which could justify imposing massive distributed burdens if each instance is below notice. Must respect objective detriment.)*

  ### II. Distinctions Any Rule Must Respect
  5.  **Desideratum: Severity-Number Distinction.** The rule must treat the *severity* of a harm-instance and the *number* of harm-instances as distinct inputs. It cannot collapse them into a single metric where "Total Harm = Severity x Number" is always sufficient. *(Motivation: Case 2 shows Severity x Number equivalence fails across persons. Torture's severity involves qualitative thresholds beyond mere summation of small pains.)*
  6.  **Desideratum: Person vs. Person-Moment Distinction.** The rule must recognize the moral unit as the *person-over-time*, not merely momentary states. Harms affecting the same person over time aggregate differently than harms affecting different persons. *(Motivation: Directly supports Desideratum 2 - Person Separateness. A life filled with minor annoyances degrades quality differently than isolated moments spread across lives.)*
  7.  **Desideratum: Harm-Benefit Asymmetry.** The rule must distinguish between *preventing harm* (e.g., avoiding a dust speck) and *providing a benefit* (e.g., receiving a tiny pleasure). The moral urgency/force of preventing small harms may differ from providing small benefits. *(Motivation: Avoiding torture carries vastly more weight than providing an equivalent pleasure. Similarly, avoiding a dust speck may not be symmetric with providing a "dust-speck-sized" pleasure.)*

  ### III. Non-Negotiable Structural Constraints
  8.  **Desideratum: Transitivity.** If outcome X is morally better than Y, and Y is better than Z, then X must be better than Z. *(Motivation: Essential for rational, consistent decision-making. Violations lead to cyclic preferences and instability.)*
  9.  **Desideratum: Pareto Dominance (Weak).** If every individual in Population A is at least as well off as in Population B, and at least one individual is strictly better off, then A is morally better than B. *(Motivation: Fundamental efficiency and non-maleficence principle. Violating this allows preferring strictly worse outcomes for everyone.)*
  10. **Desideratum: Anonymity / Impartiality.** The moral value depends only on the multiset of individual well-being levels, not on *which* individuals occupy them. *(Motivation: Core requirement of fairness and equality. Rules favoring specific identities are unjust.)*

  ### IV. Suspected Conflicts Between Desiderata
  *   **Non-Elision (4) vs. Threshold Models:** The strongest tension exists between **Non-Elision (4)** (sub-threshold harms must count) and any rule incorporating a **strict, lexically ordered threshold** below which harms contribute *nothing* to aggregation. *If* imperceptible harms have non-zero disvalue (per 4), and *if* numbers can be large enough, they *must* eventually outweigh a large harm, contradicting a strict threshold. This suggests **Non-Elision (4) is incompatible with strict lexical thresholds**.
  *   **Person Separateness (2) vs. Simple Additive Aggregation:** **Person Separateness (2)** directly challenges the core assumption of simple additive aggregation that harms can be summed freely across persons like within a person. This is a fundamental philosophical divide, not easily resolvable.

  ### V. The Most Exclusionary Desideratum
  **Person Separateness (Desideratum 2)** does the most work in excluding candidate rules. It directly challenges:
  *   **Simple Additive Aggregation:** Collapses intra- and inter-personal aggregation, violating 2. (A billion specks in one life = a billion people with one speck).
  *   **Strict Lexical Thresholds:** Often ignore inter-personal aggregation entirely, failing Individual Aggregation Sensitivity (1) and Non-Elision (4), but *also* fails to account for the *intra*-personal cumulative burden highlighted by Person Separateness (2) (e.g., chronic low-grade suffering).
  *   **Convex Weighting (e.g., Power-Law):** While potentially sensitive to severity/number distinctions (5), it typically still aggregates across persons in ways that may not fully respect the qualitative difference demanded by Person Separateness (2) between burdened lives and unbounded lives. Its success depends heavily on the convexity parameters.

  ### Brief Evaluation of Candidate Rules Against Desiderata

  1.  **Strict Lexical Threshold:**
      *   **Fails:** Individual Aggregation Sensitivity (1) - Large numbers of tiny harms never outweigh a large harm above threshold. Non-Elision (4) - Imperceptible harms count for nothing. Person Separateness (2) - Doesn't necessarily account for intra-personal cumulative burden.
      *   **May Satisfy:** Severity-Number Distinction (5), Person-Moment Distinction (6 - if threshold applies per life), Transitivity (8), Pareto (9), Anonymity (10).
      *   **Struggles With:** Stochastic Dominance (3) - Tiny risks of catastrophe may fall below threshold.

  2.  **Simple Additive Aggregation:**
      *   **Fails:** Person Separateness (2) - Treats intra and inter-personal sums identically. Harm-Benefit Asymmetry (7) - Typically treats harms and benefits symmetrically. Severity-Number Distinction (5) - Severity is just linear contribution to sum.
      *   **Satisfies:** Individual Aggregation Sensitivity (1), Stochastic Dominance (3 - via expected value), Non-Elision (4 - if disvalue >0), Transitivity (8), Pareto (9), Anonymity (10).
      *   **Struggles With:** Person vs. Person-Moment (6) - Focuses on moments/states.

  3.  **Convex Weighting (e.g., Power-Law):**
      *   **Fails:** Person Separateness (2) - Still aggregates across persons, differing only in weighting. May struggle with Harm-Benefit Asymmetry (7).
      *   **May Satisfy:** Individual Aggregation Sensitivity (1) - With enough numbers. Severity-Number Distinction (5) - By weighting severity non-linearly. Stochastic Dominance (3) - Via expected disvalue. Non-Elision (4) - If disvalue >0. Transitivity (8), Pareto (9), Anonymity (10).
      *   **Struggles With:** Defining the weighting function to capture the *qualitative* difference demanded by Person Separateness (2) and the cumulative burden within a life. Risk of arbitrariness.

  This specification prioritizes the criteria and their motivating rationales, providing a framework for evaluating any proposed aggregation rule. The tension between **counting small/imperceptible harms (Non-Elision)** and **respecting the separateness and qualitative burden of individual lives (Person Separateness)** emerges as central to the debate.
