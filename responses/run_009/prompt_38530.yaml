answer: |-
  ### Identity Statements Puzzle: Decision Tree Handout  
  **Starting Point:** "Hesperus is Phosphorus" is informative (like discovering a fact), while "Hesperus is Hesperus" is trivial. But why? And what’s really going on? Let’s test your intuitions with concrete cases.  

  ---

  #### **Question 1: Belief Reports**  
  *Cleo (an ancient astronomer) believes "Hesperus is visible at dusk." She does NOT believe "Phosphorus is visible at dusk." Is Cleo mistaken about the sky, or is something deeper happening?*  
  - **A. Cleo is NOT just mistaken about the sky.** (Go to Question 2)  
  - **B. Cleo is just confused about astronomy.** (Stop: You reject the puzzle! Most theories start from A.)  

  #### **Question 2: Substitution in Beliefs**  
  *If Cleo believes "Hesperus is visible at dusk," does she automatically believe "Phosphorus is visible at dusk"?*  
  - **A. YES** (Go to Question 3)  
  - **B. NO** (Go to Question 4)  

  #### **Question 3: Empty Names (Part 1)**  
  *Before astronomers disproved it, "Vulcan" was a name for a planet near Mercury. If nothing exists there, did "Vulcan" mean anything?*  
  - **A. YES, it meant something (e.g., "the planet causing Mercury’s orbit").** (Go to Question 6)  
  - **B. NO, it was just a failed label for nothing.** (Go to Question 7)  

  #### **Question 4: Modal Intuition**  
  *Does "Hesperus might not have been Phosphorus" make sense? (Could the stars have been two planets?)*  
  - **A. YES, it’s possible.** (Go to Question 5)  
  - **B. NO, that’s nonsense—they’re the same planet!** (Go to Question 6)  

  #### **Question 5: What Names Contribute to Truth**  
  *What makes "Hesperus is Phosphorus" true?*  
  - **A. Only the objects: If both names pick the same planet, it’s true.** (Leaf: **Millianism**)  
  - **B. The words themselves: It’s about language (e.g., "these two labels co-refer").** (Leaf: **Metalinguistic View**)  

  #### **Question 6: Empty Names (Part 2)**  
  *Was "Vulcan is Vulcan" true before astronomers disproved Vulcan?*  
  - **A. YES, it was trivially true.** (Leaf: **Fregeanism OR Descriptivism**)  
  - **B. NO, it was false/meaningless.** (Leaf: **Millianism**)  

  #### **Question 7: Why Substitution Fails**  
  *Why doesn’t substitution work in beliefs (from Q2-B)?*  
  - **A. Names have senses/descriptions beyond reference.** (Leaf: **Fregeanism OR Descriptivism**)  
  - **B. Beliefs track "guises" or "worlds of thought," not just reference.** (Leaf: **Cognitive Significance Views**)  

  ---

  ### **Leaves (Theories) Explained**  
  1. **Millianism**: Names *only* refer. Identity is trivial if true—but we explain informativeness as "pragmatic" (e.g., psychology, not semantics). Bites bullets: Belief substitution holds (Q2-A), empty names are defective (Q3-B/Q6-B), identity is necessary (Q4-B).  
  2. **Metalinguistic View**: Identity statements are secretly *about words* (e.g., "Hesperus" and "Phosphorus" co-refer). Truth relies on language (Q5-B), allows contingent identity (Q4-A).  
  3. **Fregeanism OR Descriptivism**:  
     - **Fregeanism**: Names have a "sense" (mode of presentation) + reference. Belief substitution fails (Q2-B) due to different senses.  
     - **Descriptivism**: Names = shorthand for descriptions (e.g., "Hesperus" = "the evening star").  
     - *Tree can’t separate these!* Both say empty names had meaning (Q3-A/Q6-A) and identity is contingent (Q4-A) or necessary depending on description rigidity.  
  4. **Cognitive Significance Views**: Reference is direct, but beliefs use "guises" (mental files) or two-dimensional semantics (epistemic vs. metaphysical truth). Explains belief failures (Q2-B → Q7-B), necessary identity (Q4-B).  

  ---

  ### **Notes & Warnings**  
  - **Unseparated Theories**: Fregeanism and Descriptivism **always land together** in this tree (due to Q3-A/Q6-A). Historically distinct, but these cases don’t split them.  
  - **"Dead Ends"**:  
    - If you choose B in **Q1**, you reject the puzzle—no theory fits!  
    - Choosing A in **Q3** + A in **Q4** + A in **Q5** is rare—metalinguistic views usually don’t combine with descriptivist intuitions.  
  - **Advisor’s Favorite (Q4)**: Modal intuitions split theories—metalinguistic/descriptivism allow contingency (A), while Millianism/cognitive significance demand necessity (B).  
  - **Why This Tree?** Forces you to confront *your* intuitions about belief, emptiness, modality, and truth—not just "astronomy facts."  

  ---  
  *Use this to map where YOU stand—then debate! No jargon, no citations, just cases.*
