prompt: |-
  Bit of an odd one. I'm a novelist, so my native vocabulary is drafts, revisions, the published text, what I meant when I wrote a scene versus what the scene actually says on the page — and I've had enough rows about authorial intention in my own field to know how these fights go. Restate the textualism vs purposivism debate in legal interpretation in that vocabulary, as faithfully as you can manage. A rough sketch so you know what I'm after: a statute is the published book, the legislature is the author, textualism is 'the book is the book, I don't care what your notebooks said', purposivism is 'you can't understand the scene without knowing what I was trying to do with it'. But don't let my sketch do the work — do the real translation, including the awkward corners. Is consulting legislative history like letting readers see my early drafts (which most novelists think is cheating)? Is the canon about reading a statute consistently with the rest of the code anything like keeping a character's voice consistent across a series, or is that a stretch? Then the residue report: what translates cleanly, what gets distorted to fit, and what in the legal debate has no counterpart in fiction at all — and whether that residue points at something the lawyers are actually disagreeing about or just at the fact that statutes don't get revised the way novels do. One thing I really need: keep what's settled among people who actually know this stuff separate from what's genuinely contested, and don't hand me some scholar's hobbyhorse dressed up as consensus — I've no way of telling the difference myself.
reasoning: |-
  Okay, this is a fascinating request from a novelist trying to map legal interpretation theories onto their craft. The user clearly knows their own domain deeply and wants an accurate translation, not just a surface metaphor. They're warning against oversimplification - that "published book vs author's intent" sketch is just a starting point.

  Hmm, they're specifically asking for three things: 1) core translation of textualism/purposivism using writing terms, 2) handling of legislative history/drafts, 3) the "residue report" on what doesn't map cleanly. And crucially, they want the settled vs contested aspects clearly flagged. This isn't just curiosity - they're testing how far the analogy can stretch before breaking.

  Noticing they mention "rows about authorial intention" in fiction. There's shared pain here - both lawyers and novelists hate when interpreters miss their point. But statutes aren't novels, and that tension is key. 

  First, the core doctrines: Textualism as "the published text is the final deal" maps neatly. But purposivism isn't just author's intent - it's more "what problem was this statute trying to solve?" That's closer to a novelist thinking about their book's central conflict rather than scene-by-scene intentions. 

  Legislative history as "drafts" works surprisingly well. Most novelists hate showing unfinished work, just as textualists hate legislative history. The "cheating" parallel is strong. But - big difference - novelists don't have committees producing contradictory drafts. That's pure legal chaos.

  Character voice consistency vs statutory consistency... that's tricky. It feels similar but lawyers would say statutory consistency is about avoiding contradictions, not aesthetic unity. Might be overstretching.

  Residue areas: The "multiple authors" problem is huge. No novelist deals with 535 co-writers compromising. And the "timeline" issue - statutes get amended piecemeal like bad series reboots, not revised wholes. That explains why lawyers need canons like "whole act rule." 

  Settled vs contested: Must emphasize that textualism dominates modern courts (Gorsuch, Kavanaugh etc.) but purposivism still breathes in administrative law. Legislative history use is the raging battlefield - that footnote in Wisconsin v Yoder shows how messy it gets. 

  Biggest gap: Novelists control revisions. Congress doesn't. That's why statutory interpretation exists - it's triage for broken texts. The user's "residue" request shows they sense this. Should quote Scalia's "we're not psychics" line - it captures textualism's frustration perfectly.

  Final thought: The analogy works best for showing why textualism feels ethically right (respecting the published work) but why purposivism stays tempting (statutes often feel incomplete). The "committee draft" problem explains the compromise tools like canons. User will appreciate that nuance.
answer: |-
  Here's the translation you requested, maintaining fidelity to both domains while highlighting the friction points and residue. I'll mark settled legal principles with ✅ and contested/hotly debated areas with ⚖️, based on current U.S. judicial practice (predominantly textualist-leaning SCOTUS, but enduring purposivist strongholds).

  **Core Doctrines Translated:**

  1.  **Textualism:**
      *   **Novelist's Core Analogy:** "The published text *is* the work. Reader reactions, my early drafts, my private journals about what I *meant* a character to symbolize – irrelevant. If a scene reads ambiguously on the page, that ambiguity *is* the text. Your job is to parse the words *as published*, using the dictionary definitions and grammar rules contemporary readers would bring to it. My 'intent' is only discoverable *through* the final, enacted words."
      *   **Legal Corollary:** The statute's words, understood according to their ordinary meaning at the time of enactment (using dictionaries, grammar, standard usage), are the *exclusive* source of law. Legislative history (debates, committee reports, rejected drafts) is suspect and usually inadmissible ✅ (for textualists). Purpose is inferred *only* from the text's structure and words themselves ⚖️ (degree of exclusivity is contested).

  2.  **Purposivism:**
      *   **Novelist's Core Analogy:** "You can't *truly* understand this pivotal scene without knowing the central thematic conflict I was wrestling with throughout the whole book. That deleted subplot? It shows why this character's abrupt action here *makes sense*, even if the final prose is a bit clipped. Ignoring my notebooks and early drafts makes you miss the point."
      *   **Legal Corollary:** The statute's words must be interpreted in light of the overarching "mischief" or problem Congress was trying to solve. Legislative history (like committee reports explaining the problem/purpose) is vital evidence of that purpose ✅ (for purposivists). The text is the primary guide, but not always sufficient ⚖️ (how much weight history gets is fiercely debated).

  **Specific Elements & Awkward Corners:**

  *   **Legislative History (LH) = Author's Drafts & Notes:**
      *   **Analogy:** This maps *very* cleanly. Just as many novelists see showing drafts as "cheating" or violating the integrity of the published work, textualists see LH as unreliable, potentially manipulative (inserted by staff/lobbyists), contradictory, and fundamentally *not law* ✅ (Textualist view dominates SCOTUS practice now). Purposivists see it as essential context, akin to understanding your thematic struggle through your notes, making the published text richer ⚖️ (Still used by some Justices, lower courts, agencies).
      *   **Awkward Corner:** Unlike a novelist's solitary drafts, LH is multi-authored, often contradictory, and produced strategically for future interpretation. It's less like your private notebook and more like selectively released committee meeting minutes where various editors argued.

  *   **Canons of Construction (e.g., Consistent Usage, Whole Act Rule):**
      *   **Analogy:** This is **partly** like maintaining character voice/consistency across a series, but **more fundamentally** like adhering to the rules of grammar, style, and internal coherence *within a single book*. Using "red" to mean danger in Chapter 3 but love in Chapter 10 without explanation is bad writing *and* bad law. The "whole act rule" (reading a section in context of the entire statute) is like understanding a scene by its place in the novel's overall structure and plot arc. This translates *very* cleanly and is accepted by both sides ✅ (though applied differently).
      *   **Awkward Corner:** Some legal canons are highly technical and linguistic (e.g., *ejusdem generis* - "of the same kind"), lacking a direct novelistic equivalent. They are more like specialized literary analysis tools than broad principles of narrative consistency.

  *   **"What I Meant" vs. "What the Text Says":**
      *   **Analogy:** This core tension translates perfectly. Your "row" about authorial intent in literary criticism *is* the textualism/purposivism debate. Textualism: "The scene *says* the character slammed the door angrily; arguing they were actually joyful based on your notes is rewriting the text." Purposivism: "The *entire novel* is about repressed emotion; reading that slam *only* as anger ignores the deeper purpose of showing hidden joy."
      *   **Awkward Corner:** In law, the stakes are rights, liberties, and money, not critical interpretation. A judge *must* decide the case; they can't declare the statute "ambiguously brilliant" and leave it at that.

  **The Residue Report: What Doesn't Map (and Why):**

  1.  **Multiple Authors & Compromise:** You write alone. Statutes are drafted by committees, staff, lobbyists, debated by 535+ legislators, amended, and passed via coalition. The "intent" is a fictional collective. Textualists use this to reject LH/purpose (whose intent counts?). Purposivists see a "institutional intent." *This is a core difference with no clean novelist parallel and is central to the legal debate ⚖️.* Textualists argue the *enacted compromise* is the only reliable thing.

  2.  **Amendment vs. Revision:** You revise holistically. Statutes are amended piecemeal over decades by different Congresses. Later amendments might *implicitly* change earlier sections. Legal doctrines about implied repeal/amendment and reconciling old/new text have *no* novelist equivalent. *This residue stems directly from how statutes evolve and is a major source of interpretive difficulty.*

  3.  **Agencies as Co-Interpreters (Chevron Deference):** ⚖️ You control your work. Congress often writes vague statutes, expecting agencies (experts) to fill gaps. Should courts defer to an agency's reasonable interpretation (Chevron)? Textualists often hate this (delegates judicial power). Purposivists are more amenable (agencies understand the purpose). *This has no novelist parallel and is a massive current legal battleground.*

  4.  **Precedent (Stare Decisis):** Your interpretation of your own past work is final. Courts are bound by prior interpretations of the *same statute* by higher courts. Overruling precedent is a big deal. *This institutional constraint has no novelist equivalent and significantly shapes legal interpretation ✅ (though when to overrule is ⚖️).*

  5.  **The "Reasonable Reader":** Legal interpretation often invokes the "objectively reasonable reader" at enactment. This is somewhat like your ideal contemporary audience, but far more formalized and debated (whose reasonableness? what sources inform it?). *This is a contested concept within textualism itself ⚖️.*

  **Settled vs. Contested (as requested):**

  *   **✅ Settled (Broadly):** Textualism is the *dominant methodology* in the current U.S. Supreme Court. Words are interpreted based on ordinary meaning at enactment. LH is viewed with extreme skepticism and rarely dispositive. Canons of construction are legitimate tools. Stare Decisis binds courts to prior interpretations of statutes.
  *   **⚖️ Contested (Fiercely):**
      *   **The Role of LH:** *Can* it ever be used? If so, when and how much weight? (Textualists: Almost never/none. Purposivists: Often/critical).
      *   **Defining "Ordinary Meaning":** Is it *only* dictionary/grammar? Does context include the *perceived problem* evident from the statute's structure? (Textualists lean strict, Purposivists broader).
      *   **Chevron Deference:** Should it exist? In what form? (Textualists largely oppose, Purposivists more supportive; major SCOTUS cases pending).
      *   **The "Whole Act" vs. "Whole *Law*" Rule:** How far does contextual reading go? Just this statute? The entire U.S. Code on a topic? (Textualists lean towards the broader context, but limits are debated).
      *   **Dynamic vs. Fixed Meaning:** Should old statutes adapt to new technologies/societies? (Purposivists more open, Textualists resist – "If Congress wants it updated, they can amend it").
      *   **Level of Abstraction for Purpose:** How broadly/narrowly should the statutory purpose be defined? (Massively impacts outcomes).

  **Conclusion:**

  The core analogy – published text vs. author's intent/drafts – translates powerfully to the textualism/purposivism divide. The friction arises from the **collective, compromise-driven, and incrementally amended nature of legislation**, which has no true parallel in solo novel-writing. The "residue" – multiple authors, amendments, agency deference, precedent – isn't just distortion; it *is* the substance of key legal disagreements that stem from statutes being fundamentally different artifacts than novels. Textualism thrives by treating the statute *as if* it were a coherent, consciously crafted novel, dismissing the messy reality of legislative sausage-making. Purposivism tries to engage with that messiness to find a workable solution, risking subjectivity. Your instinct about the revision process being different hits the nail on the head: it's *because* statutes aren't revised holistically like novels that these interpretive battles are so necessary and so fraught.
