prompt: |-
  me and my friend argued for like three hours last night about psychiatric advance directives and I'm still turning it over so help me figure out what the practice actually presupposes. the setup: in a bunch of US states (and some other places) a person with a recurring psychotic illness can, while well, sign a document saying things like "if im in crisis again and refusing medication, treat me anyway, don't take my refusals seriously then" -- a Ulysses contract, sailor tied to the mast. and where these are binding, clinicians are supposed to follow the document over the live refusal of the person standing in front of them, who may be agitated and insistent but not obviously incompetent. my friend thinks this is nuts: the person in the room is the one who has to live with the concequences, the past self is basically a stranger legislating for him, and if you'd never let one citizen write enforceable rules for another, why let your yesterday-self bind your tomorrow-self. I kept reaching for the constitutional analogy -- we accept that constitutions bind majorities, that supermajorities lock in rules against our future selves -- but honestly he started to win, because at least a constitution has an amendment procedure and a whole polity consenting to the lock-in, whereas Ulysses on the ship can't untie himself at all. so what does honoring a self-binding directive actually presuppose -- about autonomy, about personal identity over time, about who "the patient" even is? does it require some view on which the well-self is the real one with the sick-self as a kind of temporary impostor, or can a purely present-tense autonomy theory still make sense of it? is the practice even consistent with how the same clinics handle refusal from patients who never wrote anything down? and if my friend is right, what concretely would have to change? give me your best reconstruction in prose, then finish with a JSON object with fields: "implicit_theory" (the view of autonomy/identity the practice seems to need), "strictly_required" (what any theory honoring the practice must accept), "compatible_rivals" (rival views that would also license it, if any), "friend_right_what_changes" (concrete changes if his view wins), and "open_tension" (the messiest bit that stays unresolved).
reasoning: |-
  Okay, let me unpack this user's intense philosophical debate about psychiatric advance directives (PADs). They've been wrestling with a friend for hours over whether it's ethical to enforce past directives over present refusals during psychosis. The core tension seems to be between two autonomy models: the "extended self" view (where the directive represents true will) versus the "present self" sovereignty view (where only current refusal matters).

  Hmm, the constitutional analogy they tried is clever but flawed - constitutions have amendment procedures and collective consent, unlike solitary Ulysses contracts. That's probably why their friend gained ground. The user wants to know what philosophical underpinnings make PADs coherent, and what practical changes would follow if we rejected them.

  First, I need to reconstruct the implicit theory behind PADs. It's not that the sick self is an "imposter," but rather that the directive preserves continuity of identity through episodic illness. Think of it as privileging the agent's narrative arc over momentary states. This requires accepting that competence exists on a spectrum - the crisis self's judgment is temporarily impaired by the illness they anticipated.

  But strictly speaking, the practice only requires believing that (a) competence can fluctuate pathologically, and (b) pre-commitment can be an authentic exercise of autonomy. Even present-focused theories could justify PADs if they view them as pre-emptive self-defense against future compromised states.

  The messy unresolved tension? Whether "authenticity" during wellness outweighs present distress. A screaming person being injected feels viscerally wrong, even if logically consistent. If the friend wins, clinics would shift toward real-time capacity assessments for all patients - but that risks under-treating those who genuinely wanted intervention.

  For the JSON, I'll need to distill: the implicit theory is relational autonomy with narrative identity; strict requirements include accepting competence-impairing illness and pre-commitment validity; compatible rivals include soft paternalism; changes would involve reverting to contemporaneous assessments; the open tension remains that gut-level discomfort versus rational extension of self.

  This user clearly grasps the nuances - their frustration suggests they want resolution but suspect there isn't one. The best I can offer is mapping the philosophical terrain so they can see why both views have weight.
answer: |-
  Here's a reconstruction of the philosophical and practical presuppositions behind psychiatric advance directives (PADs/Ulysses contracts), followed by the requested JSON summary:

  **Reconstruction:**

  Honoring a psychiatric advance directive presupposes several interconnected concepts:

  1.  **Temporal Integrity of the Self & Narrative Identity:** It assumes that a person exists meaningfully *over time*, not just as isolated moments. The "well self" who drafted the directive is not a "stranger" but an earlier, more integrated version of the *same* person. Their values, fears, and understanding of their illness are part of a continuous narrative identity. The directive represents a considered judgment made when the person had the capacity to reflect on their *entire* life story, including the predictable distortions of future episodes.
  2.  **Pathology as an Impairment, Not a Different Self:** While not necessarily viewing the "sick self" as an "impostor," the practice presupposes that severe psychosis *pathologically impairs* the capacities essential for genuine autonomy and rational decision-making *specifically regarding treatment*. The illness clouds judgment, distorts reality, induces paranoia about treatment, and undermines the ability to weigh consequences rationally. The directive is a tool to overcome *this specific impairment*.
  3.  **Competence is Contextual & Fluctuating:** It rejects the notion that competence is a static, all-or-nothing trait. Competence is domain-specific and can fluctuate, especially in episodic illnesses. The person signing the directive is presumed competent *regarding treatment decisions during future crisis*. The person in crisis refusing treatment is presumed *not competent* *specifically because of the active, severe symptoms the directive anticipated*. The directive *is evidence* of this anticipated incompetence.
  4.  **Autonomy as Extended Over Time (Pre-Commitment):** This view embraces "pre-commitment" as a legitimate exercise of autonomy. True autonomy isn't just freedom *in the moment*; it includes the freedom to bind one's future self to protect against predictable weaknesses or impairments that would *destroy* future autonomy or well-being. Ignoring the directive treats the crisis self as sovereign, but potentially traps the person in a cycle where illness prevents escape (like Ulysses untied, drawn to the Sirens' destruction).
  5.  **Protection of Authentic Values and Long-Term Interests:** The directive is seen as protecting the person's authentic values and long-term interests *as defined by their well self*. The acute illness state is understood to generate desires and refusals that are *alien* to the person's core values and long-term goals (e.g., survival, stability, relationships, avoiding hospitalization/arrest). Honoring the refusal prioritizes a distorted present desire over the person's enduring will.
  6.  **Consistency Within the System:** Clinics *do* handle refusal differently based on competence assessments. For a patient *without* a directive who refuses treatment in crisis, clinicians *still* assess competence. If deemed incompetent due to psychosis, treatment *can* be given involuntarily (under legal standards like danger to self/others or grave disability). The PAD simplifies this *by providing pre-determined evidence* of anticipated incompetence and the person's prior wishes. It shifts the burden *towards* treatment when refusal occurs, acting as a powerful piece of evidence in the competence assessment required for involuntary treatment. It doesn't create a *fundamentally* different principle (treating incompetent patients against immediate refusal) but streamlines its application based on prior expressed wishes.

  **If Your Friend Is Right (The Present-Self Sovereignty View Wins):**

  Concretely, several things would change:
  1.  **PADs Become Merely Advisory:** Clinicians would be legally barred from overriding *any* contemporaneous refusal solely based on a prior directive. The document would carry weight as evidence of prior wishes, but the *current refusal* would be paramount unless the patient *at that moment* was found incompetent through a standard assessment *independent* of the directive.
  2.  **Stricter Reliance on Real-Time Competence Assessments:** The focus would shift entirely to the *present* state. Can the refusing patient *right now* understand their illness, the proposed treatment, its risks/benefits, alternatives, and consequences of refusal? The existence of a PAD might inform this assessment, but it wouldn't pre-determine the outcome. Treatment refusal would stand unless *current* incompetence is proven.
  3.  **Increased Burden for Involuntary Treatment:** Without the PAD acting as a lever, initiating involuntary treatment during refusal would require meeting the standard legal criteria (danger, grave disability) *and* proving *current* incompetence *despite* the patient's refusal, potentially making it harder to intervene early.
  4.  **Potential for More Severe Crises:** Individuals might experience more frequent or severe crises (e.g., prolonged psychosis, harm, legal involvement) because treatment refusal during early acute phases is more likely to be honored until competence deteriorates further or danger becomes imminent.
  5.  **Shift in Philosophical Justification for Involuntary Treatment:** Involuntary treatment could *only* be justified by immediate safety concerns (police power) or profound *current* incompetence leading to inability to care for oneself (parens patriae). The idea of enforcing a prior *autonomous choice* against a present refusal would be rejected.

  **The Unresolved Tension (The Messy Bit):**

  The deepest tension lies in **determining the threshold of "impairment" and the locus of "authenticity."** How impaired must the present self be to justifiably defer to the past self? Is the agitated, refusing person expressing an "alien" desire imposed by illness, or a genuine (though perhaps irrational or self-destructive) present wish? The practice presupposes we *can* discern this, privileging the narrative self. Critics argue this is impossible in the moment without imposing an external judgment about what the person *should* want, blurring the line between respecting autonomy and paternalism. This ambiguity is inherent in mental illness and fuels the philosophical debate.

  **JSON Summary:**

  ```json
  {
    "implicit_theory": "Narrative view of identity and autonomy, where the self is a temporally extended entity. Severe psychosis is seen as a pathological impairment of core decision-making capacities (understanding, reasoning, appreciation) specifically regarding treatment, temporarily displacing the 'authentic' self whose values and long-term interests are expressed in the directive. Autonomy includes the right to pre-commit to protect one's future self from predictable impairments.",
    "strictly_required": "1) Acceptance that competence is domain-specific and can be severely impaired by psychiatric illness; 2) Acceptance that pre-commitment can be a valid exercise of autonomy to manage predictable future impairments; 3) Belief that the directive-signing self has greater capacity for authentic judgment *regarding treatment during crisis* than the self experiencing acute psychosis.",
    "compatible_rivals": "1) Soft Paternalism (intervening only when impairment prevents rational choice, with the PAD as proof of impairment/wishes); 2) Harm Prevention/Parens Patriae (emphasizing preventing severe harm to the patient's long-term well-being, with the PAD as evidence of what prevents harm); 3) Communitarian views (emphasizing honoring prior commitments as part of social identity/obligation).",
    "friend_right_what_changes": "1) PADs become advisory only, not binding over contemporaneous refusal; 2) Treatment refusal always stands unless *current* incompetence is proven via standard assessment (independent of PAD); 3) Increased reliance on real-time competence evaluations; 4) Higher threshold for involuntary treatment during refusal without imminent danger; 5) Potential for more frequent/severe crises before intervention.",
    "open_tension": "The fundamental difficulty in objectively determining the threshold of 'impairment' that justifies overriding the present self's refusal in favor of the past self's directive, and the challenge of definitively locating 'authentic' will during severe mental distress without resorting to external judgment or paternalism."
  }
  ```
