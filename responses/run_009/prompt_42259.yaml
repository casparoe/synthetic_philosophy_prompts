prompt: |-
  I'm a novelist, some decades into the trade, and I've spent the last two years writing a serialized book — installments published as they're finished, which means no going back. Along the way, despite my outlines, I have contradicted myself. In an early chapter a character has a scar from a ferry accident; forty installments later, a flashback gives her the scar from a different accident entirely, and I only noticed afterward. What startled me was the readers. No one infers from this that the book is broken; no one writes in asking whether the character also has three scars, or no scars, or whether anything at all is now true of her. Instead the correspondence divides cleanly: readers who read the ferry chapters treat the ferry accident as what happened, readers of the flashback arc treat the second accident as what happened, and when the two camps meet they say, cheerfully, that both are true "in their parts of the book." The same thing is everywhere once you look: Doyle moved Watson's war wound from shoulder to leg across the stories and generations of readers have simply recorded both without complaint; Greek myth hands you three mutually exclusive parentages for the same goddess and no one concludes that she therefore had nine; comic readers speak of contradictions in a run as both "counting" without either one collapsing the fiction. In each case the contradiction is real, visible to everyone, and somehow inert — it infects a small neighborhood of claims and leaves the rest of the story-world exactly as true as it was before.

  I have tried out names on my editor and none of them fit. It is not an unreliable narrator, because there is no hidden true version beneath — both versions stand, and the audience knows it. It is not an alternate timeline or a retcon, because those are framed as replacements, one account officially expelling the other, whereas here the two accounts sit side by side, each fully in force wherever it is being read. It is not simple vagueness, because the two claims are each perfectly sharp; it is only their combination that is impossible. And it is not that readers don't notice the contradiction — they will point it out to you with delight. What they decline to do is treat it the way a contradiction behaves elsewhere, as a hole through which everything pours. So I want to know whether this configuration — an explicit contradiction that a whole audience holds true-in-both-versions without triviality, with truth seemingly assessed locally, passage by passage or scene by scene rather than over the fiction as one whole — has an established name and literature behind it, and whether it has been studied by logicians or philosophers of fiction or whoever the right people would be. And if the answer is that the nearest existing concepts only partially fit, I don't want a menu of near misses; I want you to take a position on which one fits best and where precisely it fails, and then coin a term for the residue, with a definition, and with at least one boundary case — say, whether a contradiction inside a single scene behaves the same as one strung across two installments, which my editor and I genuinely disagree about. I would rather have a definite carving of this thing, with reasons I can argue with, than a cautious survey.
reasoning: |-
  Okay, this novelist has presented a fascinating puzzle about contradictions in serialized fiction. They've noticed something truly interesting - readers happily accept conflicting details without rejecting the entire narrative. 

  First, let me unpack what they're describing. It's not just about continuity errors; it's about how audiences actively compartmentalize contradictory information. The ferry accident scar example perfectly illustrates this - readers who encountered that first version treat it as true, while those who started with the flashback accept the new origin. And when these groups discuss, they don't argue about which is "real" but accept both within their respective contexts.

  Hmm, this reminds me of several concepts but none fit perfectly. Unreliable narration doesn't work because there's no hidden truth. Retconning is too deliberate. Modal realism feels overkill. The closest might be Lewis's fragmented fictions, but even that assumes separate worlds rather than overlapping truths.

  What's striking is how this differs from logical contradictions. Normally, "A and not A" destroys coherence. But here... it doesn't. Readers maintain what philosophers call "fictional assent" locally rather than globally. It's as if truth-value operates at scene-level resolution.

  For terminology... "local coherence" feels descriptive but bland. "Narrative pluralism" captures the multiplicity but misses the contradiction aspect. The best fit might be "contradictory coexistence" - emphasizing how incompatible facts peacefully share the same story-space.

  Boundary cases are tricky. Would a contradiction within one scene break the spell? Probably yes - immediate juxtaposition forces cognitive dissonance. But serialization's temporal gaps create breathing room for compartmentalization.

  The deeper implication challenges how we define fictional worlds. Maybe they're not unified ontologies but patchworks held together by what the reader is currently attending to. That would explain why Doyle's shifting war wound doesn't shatter Sherlock Holmes' reality.

  This deserves proper philosophical attention. While no perfect term exists yet, "contradictory coexistence" with its emphasis on simultaneous validity feels closest to capturing this phenomenon's essence.
answer: |-
  This phenomenon you've described is both profound and under-theorized. After dissecting your case against existing concepts, here's a definitive carving of the phenomenon, its best-fitting framework, its point of failure, a coined term, and boundary testing:

  1.  **The Best-Fitting Existing Concept: Fragmentation (David Lewis, Marie-Laure Ryan)**
      *   **What it is:** Philosophers (like Lewis) and narrative theorists (like Ryan) propose that fictional worlds are often not single, unified, possible worlds, but rather *fragmented* or *incomplete*. Contradictions force fragmentation – the story-world splits into incompatible branches.
      *   **Why it fits best:** It directly addresses the core issue: readers don't demand global consistency. They accept that different parts of the text establish different, locally valid truths within the *same* fictional universe, even if those truths are incompatible globally. It explains why "both are true in their parts of the book."
      *   **Where it Fails:** Standard fragmentation models often imply that these fragments are *alternatives* – *either* the shoulder wound *or* the leg wound exists in a branch. Your readers aren't choosing branches; they're holding *both* truths as valid *simultaneously* within the *same* overarching narrative experience, without needing to resolve the inconsistency or fully partition the world. The fragments coexist in a single, albeit inconsistent, mental model. Fragmentation theory doesn't fully capture this *simultaneous acceptance of contradiction* without branching.

  2.  **The Coined Term & Definition:**
      *   **Term:** **Contradictory Coexistence**
      *   **Definition:** A narrative phenomenon where explicitly contradictory propositions (P and not-P) concerning the same fictional entity or event are simultaneously held as true by an audience within a single fictional work, *without* trivializing the fiction (explosion), *without* requiring resolution (retcon/branching), and *without* undermining the local truth or coherence of the passages where each proposition is asserted. Truth-value is assessed **locally relative to the narrative segment** (scene, chapter, installment, thematic arc) currently being engaged with or primarily associated with the proposition. The contradiction itself is acknowledged but treated as **inert**, confined to its specific propositions and not propagating to invalidate the wider fictional world.

  3.  **Justification & Key Features of "Contradictory Coexistence":**
      *   **Simultaneous Acceptance:** Captures the core observation: both P (ferry scar) and not-P (different accident scar) are held as true *at the same time* within the reader's conception of the *one* story.
      *   **Locality of Truth:** Truth is anchored to the *narrative segment* where the information is presented and consumed. The scar's origin *is true* within the ferry chapters; the different origin *is true* within the flashback arc. Truth is segment-relative.
      *   **Inert Contradiction:** The contradiction exists but is **quarantined**. It doesn't "infect" unrelated propositions or cause the reader to doubt everything. Watson's medical expertise isn't suddenly questioned because of his moving wound; Aphrodite's divine nature isn't undermined by multiple parentages.
      *   **Audience Practice:** Emphasizes that this is a specific *mode of engagement* adopted by the audience, facilitated by the text's structure (serialization, episodic nature, mythic fluidity, comic reboots).
      *   **Not Vagueness:** The propositions themselves are sharp and contradictory; it's the *framework for holding them* that allows coexistence.
      *   **Not Unreliable Narration/Retcon:** There's no hidden truth or official replacement. Both versions stand as presented.

  4.  **Boundary Case: Contradiction Within a Single Scene vs. Across Installments**
      *   **Your Position (Likely):** Contradictory Coexistence thrives on *distance* – temporal (between installments), spatial (between chapters), or contextual (different narrative modes like flashback vs. present). Distance allows compartmentalization.
      *   **Editor's Position (Likely):** The core mechanism (local truth, inertness) could theoretically apply anywhere, even within a scene.
      *   **Analysis & Verdict:** Contradictory Coexistence **fails within a single, unified scene.** Here's why:
          *   **Cognitive Load & Locality:** A single scene is the fundamental unit of "local." Introducing P and not-P *within this smallest coherent unit* forces immediate cognitive confrontation. There's no larger segment to retreat to for isolating each truth. The locality collapses.
          *   **Lack of Buffering:** Serialization, chapter breaks, or shifts in narrative mode provide cognitive "buffers." They signal a shift in focus, allowing readers to mentally file the previous segment's truths and engage with the new segment's truths independently. A single scene offers no such buffer.
          *   **Demand for Micro-Coherence:** Readers expect *internal* consistency within the immediate flow of action, dialogue, and description within a scene. A blatant contradiction here (e.g., "The scar on her cheek, a memento of the ferry crash, throbbed. She remembered getting it falling from her bike last Tuesday") shatters immersion and triggers either interpretation as unreliability, authorial error, character confusion, or simply breaks the fiction. It demands *some* resolution (even if just "the character is lying/mistaken *right now*") that isn't required for contradictions across segments.
          *   **Inertness Impossible:** The contradiction is too immediate and concentrated. It can't be quarantined; it inevitably infects the reader's understanding of *that very moment* in the narrative.
      *   **Conclusion:** Contradictory Coexistence is **defined by and dependent on segmentation/distancing.** It is a phenomenon of *macrostructure*. A contradiction within a single, coherent scene behaves fundamentally differently: it disrupts local (scene-level) coherence and demands resolution, violating the core tenets of inertness and segment-relative truth. Therefore, **your position holds:** the mechanism relies on the contradiction being strung across distinct narrative segments (installments being a prime example).

  **Literature & Fields of Study:**

  *   **Philosophy of Fiction:** David Lewis ("Truth in Fiction"), Marie-Laure Ryan ("Possible Worlds"), Amie Thomasson ("Fictional Objects") grapple with inconsistency, incompleteness, and truth-making in fiction. Your phenomenon pushes against standard possible-worlds models.
  *   **Narrative Theory:** Research on *serial narration* (19th-century novels, comics, TV), *hypertext fiction*, and *reception theory* (Wolfgang Iser, reader-response criticism) is relevant. Work on *retconning* (e.g., by Darren Harris-Fain in comics studies) contrasts with your case. The concept of *diegetic levels* or *narrative frames* might offer partial analogies but doesn't fully fit.
  *   **Cognitive Literary Studies:** Explores how readers mentally model fictional worlds. Your case suggests sophisticated cognitive compartmentalization and tolerance for inconsistency when buffered by narrative structure. Work on *schema theory* and *updating mental models* is pertinent.
  *   **Paraconsistent Logic:** While not directly applied to fiction, paraconsistent logics are designed to handle contradictions without explosion ("dialetheism"). Your phenomenon shows a *pragmatic*, audience-driven form of paraconsistency in narrative comprehension.

  **In essence:** You've identified **Contradictory Coexistence** – a distinct mode of fictional truth and audience engagement where segmentation allows incompatible truths to stand side-by-side, locally valid and globally inert. It thrives on distance, fails under immediate juxtaposition, and challenges models demanding global consistency. This isn't a bug; it's a fascinating feature of how serialized, episodic, and collectively developed stories *work* in the minds of engaged readers. Logicians and philosophers of fiction *should* study this, as it reveals the flexibility and locality inherent in our construction of fictional realities.
