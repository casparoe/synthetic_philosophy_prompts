answer: |-
  Here’s a comprehensive spec sheet for your epistemology seminar, structured around genuine desiderata, motivating cases, and their theoretical status. I’ve flagged non-negotiables vs. contested requirements and addressed your core question about closure vs. tracking.

  ---

  ### **Epistemology Theory Spec Sheet: Desiderata for an Analysis of Knowledge**

  #### **I. Non-Negotiable Desiderata**  
  *(Widely accepted; failure here threatens adequacy of *any* theory)*  
  1. **Truth Requirement**  
     - **Case:** "Smith believes there is a sheep in the field based on a sheep-shaped rock, but there *is* a sheep hidden behind the rock."  
     - **Requirement:** Knowledge that *p* entails *p* is true.  
     - **Status:** Uncontested bedrock.  

  2. **Belief Requirement**  
     - **Case:** A skeptic recites "2+2=4" while hypnotized to disbelieve math.  
     - **Requirement:** Knowledge that *p* requires belief that *p*.  
     - **Status:** Near-universal (rejection is niche).  

  3. **Anti-Gettier Condition**  
     - **Case:** Gettier cases (e.g., "Job candidate with 10 coins in pocket" or "Sheep-in-field illusion").  
     - **Requirement:** Must explain why justified true belief (JTB) + "epistemic luck" ≠ knowledge.  
     - **Status:** Non-negotiable. *All* post-1963 theories must resolve this.  

  4. **Refutation of Radical Skepticism**  
     - **Case:** Brain-in-a-Vat (BIV) scenarios.  
     - **Requirement:** Should not imply we know *nothing* about the external world.  
     - **Status:** Non-negotiable for practical adequacy (but *how* to refute skepticism is contested).  

  ---

  #### **II. Contested but Central Desiderata**  
  *(Theories *must* address these, but solutions divide camps)*  
  5. **Lottery Proposition Problem**  
     - **Case:** "I know I’ll lose the lottery (odds 1:1,000,000)" vs. "I know I won’t win."  
     - **Requirement:** Should explain why we deny knowledge of lottery losses pre-draw, *even with rational high credence*.  
     - **Status:** Contested (Sensitivity/Safety theories split here; Knowledge-First may bite the bullet).  
     - **Camp Divide:** Sensitivity (Nozick) *allows* lottery "knowledge"; Safety (Pritchard) *denies* it.  

  6. **Fake Barn Country**  
     - **Case:** Henry sees a real barn in fake-barn-infested county; belief is true/justified.  
     - **Requirement:** Must explain why Henry lacks knowledge despite reliability/justification.  
     - **Status:** Critical test for externalism; Safety theories handle it best.  
     - **Camp Divide:** Sensitivity (Nozick) fails here; Safety and Virtue Epistemology succeed.  

  7. **Grandmother Case (Nozick’s Sensitivity Test)**  
     - **Case:** Grandma *sees* her grandson is healthy → knows. If he *were* sick, she’d *still* believe he’s healthy (due to deception).  
     - **Requirement:** Should accommodate "everyday knowledge" resistant to deception scenarios.  
     - **Status:** Major motivator for Sensitivity theories; rivals (e.g., Safety) must explain why this *is* knowledge.  

  ---

  #### **III. The Closure Crisis**  
  *(Your core question: Can closure coexist with counterfactual tracking?)*  
  8. **Closure Under Known Entailment**  
     - **Case:** "I know I have hands. I know that if I have hands, I’m not a BIV. But do I know I’m not a BIV?"  
     - **Requirement:** If S knows *p*, and knows *p* entails *q*, then S knows *q*.  
     - **Status:** **Contested but pivotal**.  
     - **Conflict with Tracking:**  
       - Nozick’s *sensitivity* (tracking) violates closure: I sensitively know "I have hands" (if no hands, I wouldn’t believe it), but I *don’t* sensitively know "I’m not a BIV" (if I *were* a BIV, I’d still believe I’m not).  
       - **Nozick’s "Conditional Closure" Repair**:  
         - *Proposal:* If S knows *p*, and knows *p* → *q*, then S knows *q* **only if** S *also* sensitively believes *q*.  
         - **Verdict:** Changes the subject. Preserves a *weaker* closure principle but sacrifices the intuitive idea that known logical consequences transmit knowledge *automatically*. Most epistemologists reject this as inadequate.  
     - **Camp Divide:**  
       - Sensitivity/Nozick: Rejects closure.  
       - Safety/Contextualism/KF: Preserves closure (at the cost of other adjustments).  

  ---

  #### **IV. Other Key Tests**  
  9. **Moorean Propositions**  
     - **Case:** "I know I have hands" (as a response to skepticism).  
     - **Requirement:** Should affirm Moorean knowledge without ad hoc constraints.  
     - **Status:** Safety/Contextualism/KF accept; Sensitivity struggles.  

  10. **Defeater Cases**  
      - **Case:** "Red barn" case (Henry sees a red barn in fake-barn county; unbeknownst to him, most red barns are fakes).  
      - **Requirement:** Must explain why misleading defeaters sometimes destroy knowledge.  
      - **Status:** Critical for internalist-leaning theories (e.g., JTB+).  

  ---

  ### **The Ultimate Tension: Which Desideratum Excludes the Most Theories?**  
  **Closure vs. Sensitivity/Safety Requirements** is the **unsatisfiable core**.  
  - **Why it’s fatal**:  
    - Sensitivity (Nozick) → Sacrifices closure.  
    - Safety (Sosa, Pritchard) → Struggles with lottery cases (may deny knowledge of lottery losses *too broadly*).  
    - Contextualism → Preserves closure/avoids skepticism but at cost of semantic relativism.  
    - Knowledge-First (Williamson) → Takes knowledge as primitive; struggles to explain *why* closure holds.  
  - **Result:** Every theory fails at least one major intuitive case or principle. **Closure is the killer desideratum**—it forces theories to either abandon counterfactual tracking (alienating externalists) or embrace radical revisionism (e.g., Nozick’s conditional closure).

  ---

  ### **Final Assignment Focus**  
  **Last-Day Debate Question:**  
  > *"Can any theory satisfy all non-negotiable desiderata while resolving the tension between closure and counterfactual tracking? If not, which intuition should we abandon?"*  

  This forces students to confront epistemology’s central trade-off: **preserving the power of deduction (closure) vs. explaining knowledge’s resilience to error (tracking)**. Nozick’s "repair" is a tactical retreat, not a solution—and that’s the lesson.
