prompt: |-
  I'm running an epistemology seminar and we just wrapped up Nozick's tracking theory, so the final assignment this year is: every student picks an analysis of knowledge and has to defend it against a spec sheet we write together on the last day of class. Help me draft that spec sheet. What are the genuine desiderata for an adequate theory of knowledge — the cases it has to get right (Gettier stuff, lottery propositions, fake barn country, the grandmother who would be told her grandson is fine even if he were in the hospital), the intuitions it can't just dismiss, and so on? For each requirement, give the case that motivates it, and mark which ones are non-negotiable versus which are really just prejudices of one camp — the sensitivity people, the safety people, the knowledge-first crowd. The part I care most about: where does closure under known entailment belong? Is it a genuine desideratum at all, and can it be jointly satisfied with the tracking-style counterfactual requirements, or is that pair the unsatisfiable core of the list? Nozick tries to rescue something with his conditional version of closure (knowing p plus knowing that if p then q gets you knowing q) — tell me wether that's a real repair or just changing the subject. And finish by saying which single desideratum excludes the most otherwise-plausible theories, since that's the argument I want the students to have on the last day.
