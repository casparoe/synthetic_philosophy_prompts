prompt: |-
  So heres my situation: I'm a retired biochemist -- 35 years, mostly QC work, so protocols are in my blood -- and since retiring I've gotten deep into epistemology. I just worked through Nozick's tracking theory in Philosophical Explanations, the idea that knowing p means your belief tracks the truth: if p were false you wouldn't believe it, and given how you actually formed the belief, if p is true you do believe it. I also volunteer as the de facto fact-checker for our neigborhood newsletter (maybe 800 subscribers, weekly, nobody signs off but me), and I keep tripping over the word "knows." Writers print things like "the mayor knows the bridge is safe" or "residents know the developer will back out," and I have no principal rule for when to let it stand versus change it to "says" or "believes." Write me a decision procedure I can actually run in five minutes per instance: the questions to ask in order, what counts as a good enough answer to each, where the procedure says downgrade to "claims," and where it has to hand the call back to me because it's a judgment about the case, not a fact about it. I want the tracking conditions to do real work, including the part where the method of belief-formation matters (the official who ran the test herself versus the one who trusts last year's report) -- but also flag where tracking gives weird verdicts, like the grandmother case, or the lottery-style case where someone "knows" their raffle ticket lost. Nozick's thing about closure also keeps coming up: writers infer a "knows" for a whole chain of consequences from one verified link ("she knows the levee meets the standard, so she knows the flood insurance stays valid"), and since Nozick famously lets you know p without knowing its obvious consequences, tell me whether the procedure should have anything to say about that or whether that's a step too deep for a newsletter like ours. Then run the procedure on three items from this week's draft: (1) "the county engineer knows the levee holds to the 500-year standard, she ran the models herself"; (2) "longtime residents know the festival will be cancelled again this year, it always is"; (3) "the donor knows his gift is tax-deductible, the accountant told him so." And be honest about what the procedure can't settle.
reasoning: |-
  Okay, let's tackle this. The user is a retired biochemist with a strong background in protocols and now interested in epistemology, specifically Nozick's tracking theory. They need a practical decision procedure for fact-checking the word "knows" in their neighborhood newsletter. 

  First, I need to recall Nozick's tracking conditions: truth-tracking (if p were false, you wouldn't believe it) and belief formation (if p is true, you do believe it via your method). The user wants this applied to real cases, with clear steps that can be done quickly. They also mentioned issues like closure (knowing p but not its consequences) and edge cases like the grandmother or lottery paradox.

  The user's deeper needs are about practicality and reliability. They need a method that's systematic, like a lab protocol, but adaptable for philosophical nuances. Since they're fact-checking a small newsletter, speed is crucial—each case should take about five minutes. They also want transparency on where the procedure can't decide, requiring their judgment.

  Breaking down the decision procedure: The key questions should assess truth-tracking and method reliability. Start with truth status: is p true? If unknown, proceed to the tracking conditions. The method of belief formation is critical here—was it direct evidence, reliable testimony, or something less secure? 

  For the tracking conditions, I need to evaluate counterfactuals. If p were false, would the person still believe it? For example, in the levee case, the engineer running models herself might track the truth, but if she relied on old data, maybe not. Also, consider the method: direct testing vs. hearsay affects reliability.

  Edge cases like the grandmother (believing her grandson is healthy even if he weren't) or lottery tickets (believing you lost despite odds) show where tracking fails. These highlight situations where the method doesn't track truth, so "knows" isn't justified.

  Closure is tricky. Nozick says knowing p doesn't mean knowing its consequences. In the newsletter, if someone infers knowledge of flood insurance from levee standards, that might not hold. The procedure should flag such inferences but leave them to the writer's judgment.

  Applying to the three examples:
  1. County engineer: She ran models herself—direct method, likely tracks truth. If models are reliable, "knows" might stand.
  2. Residents' belief about festival cancellation: Based on past events. But if circumstances change, they might still believe, so it doesn't track. Downgrade to "believe."
  3. Donor's tax deduction: Relies on an accountant. If the accountant is reliable, it might track, but if there's any doubt, "claims" is safer.

  Honesty about limitations: Some cases depend on context the fact-checker might not have. Also, tracking theory has known problems, so judgment is needed where counterfactuals are unclear or methods are borderline.
answer: |-
  Here's a pragmatic decision procedure grounded in Nozickean tracking theory, designed for speed and transparency. It prioritizes reliability of belief-forming methods and counterfactual sensitivity, flags known problem cases, and explicitly identifies judgment calls.

  **Decision Procedure: "Knows" vs. "Believes/Claims" (5-Minute Protocol)**

  1.  **Is *p* objectively verifiable *right now*?**
      *   **Good Enough:** Public records, recent official reports, direct observation, universally accepted scientific facts. (e.g., "The mayor *knows* the city hall address").
      *   **Downgrade Trigger:** *p* concerns future events, subjective states, complex predictions, or disputed facts. → **Go to Step 2.**
      *   **Judgment Call:** Ambiguity in verification source/timing (e.g., "The engineer *knows* the *exact* stress point on the bridge" - requires engineering judgment). → **Flag for Editor (You).**

  2.  **What is the *primary method* of belief formation? (Focus on the subject, e.g., mayor, resident, donor)**
      *   **Good Enough (Strong Tracking Potential):** Direct evidence gathering/analysis by subject (ran tests, inspected data/models), reliance on highly competent/verified expert *on this specific topic* using reliable methods.
      *   **Downgrade Trigger:** Hearsay, rumor, assumption, past pattern extrapolation, reliance on non-expert or potentially biased source. → **Go to Step 3.**
      *   **Judgment Call:** Source reliability is borderline (e.g., "The accountant told him" - is the accountant reputable? Is tax law complex here?). → **Flag for Editor (You).**

  3.  **TRUTH-TRACKING TEST (Nozick's Condition 3): If *p* were false, would the subject *still* believe *p* via their method?**
      *   **Good Enough (Likely Tracks):** Method is sensitive to falsity (e.g., running new models would detect flaws; checking official IRS rules would reveal non-deductibility; direct observation would reveal cancellation).
      *   **Downgrade Trigger:** Method is *insensitive* to falsity (e.g., trusting a loyalist even if wrong; believing past pattern despite changed circumstances; relying on source who wouldn't know/care if false). → **Downgrade to "believes" or "claims".**
      *   **Judgment Call:** Sensitivity is unclear or depends on unstated factors (e.g., "The accountant told him" - *would* the accountant check properly if it *wasn't* deductible?). → **Flag for Editor (You).** **Flag Grandmother/Lottery Cases Here:** Methods based on faith, hope, or statistical likelihood often fail this test (e.g., grandma believes grandson is well even if he were injured; you believe your lottery ticket lost despite a tiny chance it won).

  4.  **BELIEF-FORMATION TEST (Nozick's Condition 4): Given *p* is true, does the subject's method reliably produce belief in *p*?**
      *   **Good Enough (Reliable):** Method reliably yields true beliefs in this domain (e.g., proper engineering analysis; accurate record-keeping; trustworthy expert testimony on their speciality).
      *   **Downgrade Trigger:** Method is unreliable or luck-based (e.g., guessing; rumor mill; biased source; flawed data). → **Downgrade to "believes" or "claims".**
      *   **Judgment Call:** Reliability is contested or context-dependent. → **Flag for Editor (You).**

  5.  **CLOSURE CHECK (Does "knows" imply knowledge of obvious consequences?)**
      *   **Procedure Verdict:** **No.** Tracking denies closure. Knowing *p* doesn't entail knowing *q*, even if *p* implies *q*. Newsletter writers often infer knowledge of consequences.
      *   **Action:** **Always flag inferences.** Change "so she knows the flood insurance stays valid" to "so *she believes/concludes* the flood insurance stays valid" or rephrase entirely. This is a *structural* limitation of tracking, not just a judgment call. The procedure mandates downgrading inferred knowledge claims.

  **Procedure Output Summary:**
  *   **"Knows" stands only if:** *p* is verifiable *or* it passes Steps 2, 3, and 4 clearly.
  *   **Downgrade to "states," "believes," "claims," or "asserts" if:** Step 1 fails *and* any Step 2, 3, or 4 trigger is hit.
  *   **Flag for Editor (You) if:** Judgment call needed on verification, source reliability, counterfactual sensitivity, or method reliability.
  *   **Always Downgrade Inferred Knowledge:** Due to closure failure.

  **Applying the Procedure to Your Cases:**

  1.  **"The county engineer knows the levee holds to the 500-year standard, she ran the models herself."**
      *   **Step 1:** *p* (levee meets standard) is verifiable *in principle*, but likely not "right now" by you. → **Go to Step 2.**
      *   **Step 2:** Method is **strong** (subject ran models herself - direct evidence gathering). → **Go to Step 3.**
      *   **Step 3 (Tracking):** **Likely Passes.** If the levee *didn't* meet the standard (e.g., due to hidden flaw), her running the models *herself* with competence *should* detect this (sensitive to falsity). → **Go to Step 4.**
      *   **Step 4 (Formation):** **Likely Passes.** Competently running standard models is a reliable method for assessing levee standards. → **"Knows" STANDS.** (Good case for tracking).
      *   **Closure Check:** N/A (No consequence claimed).

  2.  **"Longtime residents know the festival will be cancelled again this year, it always is."**
      *   **Step 1:** *p* (future cancellation) is not verifiable right now. → **Go to Step 2.**
      *   **Step 2:** Method is **weak** (extrapolation from past pattern - no direct evidence about *this* year's decision). → **Downgrade Trigger hit → Go to Step 3** (but already leaning downgrade).
      *   **Step 3 (Tracking):** **FAILS (Grandmother/Lottery Flag).** If the festival *were* *not* going to be cancelled this year (e.g., new sponsor), residents relying *only* on past pattern would *still* believe it *would* be cancelled (insensitive to falsity). Past pattern isn't a truth-tracker for future singular events.
      *   **Step 4 (Formation):** **Likely Fails.** Extrapolating past events to future singular events is unreliable (circumstances change). → **DOWNGRADE to "believe" or "expect".** (Classic tracking failure case).

  3.  **"The donor knows his gift is tax-deductible, the accountant told him so."**
      *   **Step 1:** *p* (tax-deductibility) is verifiable via IRS rules, but likely not "right now" by you/donor. → **Go to Step 2.**
      *   **Step 2:** Method is **reliance on expert testimony.** → **Judgment Call:** Depends *entirely* on the accountant's specific competence on *this* rule and diligence. → **FLAG FOR EDITOR (YOU).** *You* need to ask: Is this accountant highly reliable on *gift deductibility*? Did they just say it, or verify? Without confidence, downgrade.
      *   **If Judged Reliable:**
          *   **Step 3 (Tracking):** **Judgment Call.** *Would* the accountant have checked properly/more carefully if it *wasn't* deductible? If likely yes → Passes. If accountant is careless/biased → Fails. → **Often FLAG or lean Downgrade unless source is impeccable.**
          *   **Step 4 (Formation):** Reliance on a *truly reliable* expert is reliable. → *Potentially* "Knows" if Steps 2 & 3 pass clearly.
      *   **Likely Outcome:** **Downgrade to "states," "has been told," or "believes"** unless context confirms the accountant's specific, verified expertise and diligence on *this exact point*. High risk of insensitivity (Condition 3).

  **What the Procedure Can't Settle (Requires Your Judgment):**

  1.  **Source Reliability (Step 2/3/4):** How competent *is* this specific source? How diligent *were* they? Was their method *actually* reliable *in this instance*? (e.g., The Accountant).
  2.  **Counterfactual Sensitivity (Step 3):** *Would* the method *actually* have detected falsity? This is inherently speculative. Requires weighing the robustness of the method and the subject's likely application of it.
  3.  **Method Reliability (Step 4):** Is this method *generally* reliable *in this specific context*? (e.g., Are past patterns *ever* a good guide here? How complex is the tax rule?).
  4.  **Edge Cases (Step 3 Flag):** How strictly to apply the grandmother/lottery intuition? Is this belief *really* insensitive, or is the pattern *so* strong it's practically a law? (Tracking usually says "no knowledge" in true lottery/grandmother cases).
  5.  **Verification Ambiguity (Step 1):** What counts as "verifiable right now" for *this* audience/purpose?

  **Key Takeaways for Your Newsletter:**

  *   **"Knows" is hard:** Reserve it for cases with demonstrable, reliable evidence gathering by the subject or impeccable expert verification.
  *   **Doubt = Downgrade:** When in doubt about method, source, or sensitivity, use "states," "believes," "claims," or "asserts."
  *   **Patterns ≠ Knowledge:** Past events don't track future truths. Use "believe," "expect," or "fear."
  *   **Break Chains:** Never let "knows" propagate through inference ("so she knows..."). Downgrade the consequence.
  *   **Transparency Wins:** Using weaker terms like "believes" or "claims" is often *more* accurate and avoids overstating certainty, enhancing the newsletter's credibility.

  This procedure leverages your protocol mindset and Nozick's core insights to make efficient, principled decisions, while clearly identifying where philosophical nuance or contextual uncertainty requires your experienced judgment.
