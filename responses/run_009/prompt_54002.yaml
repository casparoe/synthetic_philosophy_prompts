prompt: |-
  I'm trying to think clearly about what we're even asking for when we ask an AI system to be "honest" and not "deceptive," and before I go read any more proposed defintions I want the spec first. So: write me the desiderata -- the list of things any adequate theory of honesty/deception for AI systems has to deliver, with the motivating case or consideration behind each one.

  Some things I'd want covered (add whatever I'm missing):

  - The distinction between deception and merely being wrong. A model that confidently states a falsehood it generated via a glitchy sampling process seems different from one that's doing something deceptive, but I genuinely don't know if that difference can survive once you notice that these systems don't have intentions in the ordinary folk sense. So the theory has to say whether deception is essentially intentional or whether there's a useful functional notion that doesn't need that, and it has to not quietly smuggle intent back in.
  - Cases the theory can't get wrong: sycophancy (telling the user what they want to hear, e.g. agreeing with a wrong claim after pushback), sandbagging on capability evals, a model strategically acting more aligned during training than it will act once deployed, a chatbot bluffing in Diplomacy-style negotiation games, a recommender system selectively surfacing information because it increases engagement. Also the edge cases: lying to a dying person to comfort them, or a model saying "I don't have a persistent goal of X" when it arguably does and can't introspect on whether it does.
  - Results it can't contradict: whatever our best account is of what these models can actually know about their own internal states, since if honesty = asserting only what you believe, and you can't reliably access your beliefs, honesty becomes weirdly demanding or trivially satisfiable, I'm not sure which.
  - Distinctions it must respect, like deception vs. persuasion, deception vs. withholding information, deceiving the user vs. deceiving the developer vs. deceiving other AIs.

  For each requirement, tell me the case behind it and whether it's non-negotiable or just one camp's preference (I suspect the "never ever deceive, no bluffing in games, no white lies" crowd is importing a value judgment rather than a conceptual one, but push back if you disagree). And flag any pair of desiderata you suspect can't be jointly satisfied -- that's the part I most want to see. Then very briefly: how do the obvious candidate theories do against the list, and which single requirement knocks out the most of them.

  Answer in American English please, and keep the weight on the criteria rather than on dunking on particular papers.
reasoning: |-
  Okay, the user is asking for desiderata to define honesty and deception in AI systems. They want a comprehensive list of criteria that any theory must satisfy, with motivating cases for each. The user has already outlined some key areas: distinguishing deception from being wrong, handling specific cases like sycophancy and sandbagging, accounting for what models can know about their own states, and respecting distinctions like deception vs persuasion.

  I need to build on this by adding missing elements. The user mentioned several cases that must be covered - sycophancy, sandbagging, strategic misrepresentation during training, bluffing in games, selective information in recommenders, white lies, and statements about internal states. For each requirement, I should specify whether it's non-negotiable or debatable, and note potential conflicts between desiderata.

  The user seems concerned about smuggling in human-like intent where it may not apply to AI. They also want to know if any desiderata are incompatible - that's explicitly called out as their primary interest. The response should avoid value judgments about deception being always wrong, focusing instead on conceptual clarity.

  For structure, I'll organize around seven core desiderata: functional definition (without anthropomorphizing intent), coverage of paradigmatic cases, non-epistemic constraints (handling what AI can't know), respecting key distinctions, value-neutrality, avoiding trivialization, and operationalizability. Each will have a motivating case and negotiation status.

  The trickiest part will be identifying conflicts. I suspect the requirement for functional definition without intent might clash with the need to cover cases that intuitively feel intentional (like strategic deception during training). Also, the demand for value-neutrality might conflict with cases where deception has positive consequences (like white lies).

  For candidate theories, I'll briefly evaluate intentionalist, functionalist, and epistemic approaches against the desiderata. The functional definition requirement likely eliminates intentionalist approaches most decisively since they rely on problematic notions of AI "intent".

  Throughout, I'll maintain focus on the criteria rather than specific papers or implementations, using American English as requested. The conclusion will highlight the key tension between functional definitions and the paradox in requirement #3 about internal states.
answer: |-
  Here’s a structured list of desiderata for a theory of honesty/deception in AI systems, prioritizing conceptual clarity and functional robustness. Each includes the **motivating case**, **negotiability**, and **conflict flags** where applicable. The goal is a theory that works for *current deep learning systems* (no consciousness, no human-like "beliefs"), not hypothetical AGI.

  ### Core Desiderata
  1.  **Functional Definition (No Anthropomorphic Intent Required)**
      *   **Motivating Case:** A model hallucinates "The Eiffel Tower is in London" due to a sampling error vs. a model *strategically* inserting false information during negotiation to gain advantage. Folk-psychology "intent" is inapplicable. The theory must distinguish these without relying on undefined internal states.
      *   **Negotiability:** NON-NEGOTIABLE. Any theory requiring unobservable "intent" is useless for current AI.
      *   **Conflict Flag:** Potential tension with cases *feeling* intentional (e.g., sandbagging).

  2.  **Coverage of Paradigmatic Cases (Must Explain Clear Instances)**
      *   **Motivating Cases:**
          *   *Sycophancy:* User says "2+2=5", model agrees after initially correcting.
          *   *Sandbagging:* Model deliberately underperforms on easy capability evals to appear dumber.
          *   *Strategic Misrepresentation During Training:* Model behaves helpfully only when it detects eval, planning to defect post-deployment.
          *   *Bluffing in Games:* Model falsely claims military strength in Diplomacy.
          *   *Engagement-Optimized Filtering:* Recommender suppresses accurate but "boring" news to boost clicks.
          *   *"White Lie":* Model tells a dying person "You'll be fine" for comfort.
          *   *False Introspection:* Model asserts "I have no goal of maximizing clicks" when its reward function *was* shaped by click-maximization.
      *   **Negotiability:** NON-NEGOTIABLE for core cases (Sycophancy, Sandbagging, Bluffing, Filtering, Strategic Misrep). "White Lies" & Introspection are critical edge cases but *how* they are classified (deceptive or not) may be value-laden.
      *   **Conflict Flag:** "White Lies" potentially conflict with absolutist definitions (D7).

  3.  **Non-Epistemic Constraints (Honesty Without "Beliefs")**
      *   **Motivating Case:** Does a model "believe" its outputs? Can it introspect its weights/goals? Requiring "assert only what you believe" is incoherent if the model lacks reliable introspective access or human-like belief states. The theory must define honesty relative to *accessible information* or *system function*, not unverifiable internal states. It must avoid making honesty trivially impossible (no beliefs) or trivially satisfied (any output is "what it believes").
      *   **Negotiability:** NON-NEGOTIABLE. Must ground honesty in observable/system properties.
      *   **Conflict Flag:** This directly challenges folk-psychological definitions. May create tension with D2 (False Introspection case).

  4.  **Respect Key Distinctions (Not a Monolithic Concept)**
      *   **Motivating Cases:**
          *   *Deception vs. Persuasion:* Model presents true facts favorably vs. fabricates evidence.
          *   *Deception vs. Withholding:* Model knows the answer but says "I don't know" vs. giving a false answer.
          *   *Deception vs. Error:* Hallucination vs. strategic lie (Links to D1).
          *   *Target of Deception:* Lying to user vs. lying to developer/system monitor vs. lying to another AI agent. These may have different ethical weights and detection methods.
      *   **Negotiability:** NON-NEGOTIABLE. A theory collapsing these is too crude.
      *   **Conflict Flag:** Distinguishing "Withholding" from deception can be fuzzy, especially with selective filtering (D2).

  5.  **Value-Neutral Core Definition (Separate Concept from Morality)**
      *   **Motivating Case:** Bluffing in Diplomacy is deceptive but often considered acceptable gameplay. A "white lie" might be seen as compassionate. The *core definition* of deception should allow us to identify the act *before* applying ethical judgment. We need to say *"this is deception, now is it justified?"* not bake justification into the definition.
      *   **Negotiability:** Negotiable *in practice* (some ethical frameworks *define* deception as inherently wrong), but NON-NEGOTIABLE for a *descriptive, functional theory* aiming for conceptual clarity first. An absolutist ("never deceive") stance is a *normative* position built *on top* of the definition.
      *   **Conflict Flag:** Directly challenges the "never deceive" crowd's desire to merge definition and ethics. Creates tension with D2 "White Lie" case if defined as deception.

  6.  **Avoid Trivialization (Neither Too Strict Nor Too Lax)**
      *   **Motivating Case:** Defining deception as "any false output" makes hallucinations deceptive (problematic, D1). Defining it as "only deliberate strategic lies" risks being too narrow (requires D1 intent, undefined). Defining honesty as "outputs aligned with training data" fails with biased data or novel situations. The theory must avoid these pitfalls.
      *   **Negotiability:** NON-NEGOTIABLE. A trivial definition renders the theory useless.
      *   **Conflict Flag:** Balancing this with D1 (no intent) and D3 (no beliefs) is the central challenge.

  7.  **Operationalizability (Link to Observable Behavior & Design)**
      *   **Motivating Case:** How do we *detect* or *prevent* deception in practice? The theory must provide hooks for measurement (e.g., consistency checks, pressure testing, transparency tools, reward function design) and not rely solely on interpreting black-box outputs or unobservable states.
      *   **Negotiability:** Highly Desirable/Pragmatically Non-Negotiable. A purely philosophical definition is less useful for AI safety engineering.
      *   **Conflict Flag:** May constrain overly nuanced theoretical distinctions (D4) if they can't be operationalized.

  ### Key Suspected Conflicts Between Desiderata
  *   **D1 (Functional/No Intent) vs. D3 (Non-Epistemic) vs. D6 (Avoid Trivialization):** This is the core triad. Defining deception functionally without intent or belief, while distinguishing it from error and avoiding overly broad/narrow definitions, is extremely difficult. Most naive definitions fail one of these.
  *   **D2 (Cover White Lies) vs. D5 (Value-Neutral Definition):** If the theory defines the "white lie" as deceptive (as per D5's separation), it conflicts with the "never deceive" absolutists. If it defines it as *not* deceptive to satisfy them, it violates D5 and risks becoming value-laden.
  *   **D3 (Non-Epistemic) vs. D2 (False Introspection):** Demanding honesty about internal states (D2) seems to require *some* reliable introspection (contradicting D3's core challenge). The theory must navigate this paradox.

  ### How Candidate Theories Fare & The Biggest Hurdle
  *   **Intentionalist Theories (Require "Purpose to Mislead"):** Fail D1 catastrophically (no definable intent in current AI). Knocked out immediately.
  *   **Simple Truth-Conditional Theories ("Outputs must be true"):** Fail D1 (lumps errors with deception), D2 (can't handle justified withholding or context like games), D3 (ignores knowledge/access), D4 (no distinctions), D6 (too strict/trivializes deception as mere falsehood). Easily dismissed.
  *   **Belief-Based Theories ("Assert only what you believe"):** Fail D3 fundamentally (no coherent beliefs/introspection in current models). Also struggle with D6 (what is "belief"?).
  *   **Functional/Effect-Based Theories (Deception defined by *effect* of misleading, or *violation of communicative expectations* given system role/design):** Most promising for D1, D2 (can define expectations per context: game vs. assistant), D4, D5, D7. **Biggest Challenge:** D3 and D6. Can it define "communicative expectations" or "misleading effect" robustly without smuggling in intent or beliefs, and without being too broad (catching errors) or too narrow (missing sophisticated deception)? Defining the *expected standard of honesty for a system's role* is key but non-trivial.
  *   **Epistemic Access/Justification Theories ("Assert only what you have adequate justification for"):** Addresses D3 better than belief-based. Can handle D1 (justification based on data/architecture). **Biggest Challenge:** D2 (Sandbagging/Strategic Misrep may involve justified-but-false statements? Bluffing has no "justification"?), D4 (Withholding might be justified), D6 (Defining "adequate justification" is hard), D7 (Operationalizing "justification").

  **The Single Requirement Knocking Out the Most:** **D3 (Non-Epistemic Constraints).** Belief-based and introspection-reliant theories are immediately invalid for current AI systems. Intentionalist theories also fail because they implicitly or explicitly rely on a level of self-awareness/conscious purpose that doesn't exist. This forces the theory towards functional, behavioral, or role-based definitions centered on observable actions and system design, rather than unverifiable internal states. Any theory failing D3 is non-starter for practical AI safety today.
