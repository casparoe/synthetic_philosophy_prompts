  First, the St. Petersburg paradox has infinite expectation, leading to paying any finite price. Pasadena's expectation is undefined due to conditional convergence. Altadena adds a dollar to each Pasadena payout, creating a dominance situation. The two-envelope paradox involves infinite switching. The user wants desiderata that address these, including conflicts between them.

  The key points from the query: they need both non-negotiable and camp preferences, motivations from cases, conflicts (especially dominance vs. series reordering insensitivity), and which requirement excludes existing proposals. Also, the desiderata should cover finite pathological cases where the theory aligns with standard EU.

  I should list core desiderata first. Statewise dominance is non-negotiable because Altadena dominates Pasadena. Payoff consistency under refinement is crucial—splitting outcomes shouldn't change preferences. Reflexivity is needed to avoid paying to swap envelopes. Then finite compliance ensures the theory reduces to EU in standard cases.

  Now, the tricky part: conflicts. Dominance and reordering insensitivity conflict because in Pasadena, reordering terms changes values, but Altadena dominates regardless. So, dropping reordering insensitivity might be necessary. Also, convergence consistency is a camp preference since finite truncations might not converge.

  The user also wants to know which desideratum excludes most proposals. Finite truncation approaches fail because convergence isn't guaranteed. Utility caps violate dominance in Altadena. Relative ranking theories might handle comparisons but struggle with reflexivity in the two-envelope paradox. So, statewise dominance and reflexivity are key here.

  I need to ensure the desiderata aren't too narrow. Including unbounded utility extendability as a camp preference allows flexibility. Also, handling ordinal comparisons where numerical values are undefined, like in Pasadena vs. Altadena, without assigning specific values.

  What about the two-envelope paradox? Reflexivity prevents paying to swap. Also, perhaps adding a desideratum about not prescribing inconsistent actions, like infinite switching.

  Finally, structuring the list: non-negotiables first, then camp preferences. Highlight conflicts and which requirement is most exclusionary. Make sure each desideratum is motivated by a specific case and applicable beyond infinite cases.
answer: |-
  Here’s a structured list of desiderata for decision theories handling infinite/undefined expectations, grounded in your cases and designed to cover finite pathologies. I’ve marked conflicts and highlighted the most exclusionary requirement.

  ---

  ### **Core Non-Negotiable Desiderata**  
  *(Violation implies theory is unacceptable)*

  1. **Statewise Dominance (Pasadena/Altadena Motive)**  
     - *Requirement:* If act A pays strictly more than act B in every possible state, prefer A to B.  
     - *Motive:* Altadena dominates Pasadena statewise; any theory must respect this.  
     - *Conflict Potential:* Central to the reordering conflict (see below).

  2. **Reflexivity / No Self-Sabotage (Two-Envelope Motive)**  
     - *Requirement:* Do not strictly prefer paying to swap an envelope with itself.  
     - *Motive:* In the two-envelope paradox, "pay to swap forever" is pathological.  
     - *Finite Compliance:* Rejects theories that allow paying to reshuffle identical outcomes.

  3. **Payoff Consistency Under Refinement (General Pathology Motive)**  
     - *Requirement:* Splitting a payoff into two equiprobable sub-payoffs (e.g., replacing "±$4" with "±$2 or ±$6", each p=0.5) shouldn’t alter preferences.  
     - *Motive:* Blocks ad hoc discretization hacks; ensures stability across outcome descriptions.  
     - *Finite Compliance:* Standard EU satisfies this; exotic proposals (e.g., tail-optimized truncation) may not.

  4. **Ordinal Comparison When Defined (Altadena/Pasadena Motive)**  
     - *Requirement:* When one game statewise dominates another, they must be comparable (A ≻ B).  
     - *Motive:* Altadena vs. Pasadena demands *some* coherent ranking even if numerical values are undefined.

  ---

  ### **Camp Preferences (Negotiable but Defensible)**  
  *(Trade-offs depend on philosophical priorities)*

  5. **Convergence Consistency (St. Petersburg Motive)**  
     - *Requirement:* If truncated expectations converge to L, preferences should align with L (e.g., pay up to L for St. Petersburg).  
     - *Motive:* Intuitive for St. Petersburg (L=∞), but conflicts with dominance in alternating series.  
     - *Conflict:* Pasadena truncations can converge to *any* value; this + dominance + reordering insensitivity is impossible (drop this or #6).  
     - *Camp Split:* Frequentists favor this; Bayesians may reject (improper priors).

  6. **Reordering Insensitivity (Pasadena Motive)**  
     - *Requirement:* Preferences invariant under recombination/relabeling of states with equal probability.  
     - *Motive:* Naive summation order shouldn’t affect rationality.  
     - *Conflict:* Contradicts **dominance** in Pasadena-like games (Altadena reordered can look worse than Pasadena). **Drop this** to save dominance.  
     - *Exclusionary Power:* Kills "expectation via specific ordering" proposals.

  7. **Extendability to Unbounded Utility (Super-Petersburg Motive)**  
     - *Requirement:* Theory should not break if utility functions are unbounded.  
     - *Motive:* Super-Petersburg (e.g., payoffs $2^{2^n}$) tests robustness beyond St. Petersburg.  
     - *Camp Split:* Accepting bounded utility simplifies theories but rejects St. Petersburg as "unchoosable."

  8. **Continuity in the Limit (St. Petersburg Motive)**  
     - *Requirement:* Capping payoffs at N should yield preferences that approach the uncapped preference as N→∞.  
     - *Motive:* Avoids discontinuities where $N$ vs. $N+1$ caps reverse preferences.  
     - *Conflict:* Pasadena caps may oscillate; strict continuity may be untenable.

  ---

  ### **Key Conflicts & Trade-offs**  
  - **Dominance vs. Reordering Insensitivity:**  
    Altadena must dominate Pasadena, but reordering lets Pasadena appear superior to Altadena. **Resolution:** Drop reordering insensitivity (#6) to preserve dominance (#1). Theories must allow state-dependent evaluation (e.g., relative utilities).  
  - **Convergence vs. Ordinality:**  
    St. Petersburg demands convergence to ∞; Pasadena truncations don’t converge. **Resolution:** Convergence (#5) is a camp preference; ordinal dominance (#4) is non-negotiable.

  ---

  ### **Most Exclusionary Desideratum**  
  **Statewise Dominance (#1)** is the "kill switch" for popular proposals:  
  - **Truncation Views:** Fail Altadena/Pasadena (truncated Pasadena can dominate truncated Altadena).  
  - **Utility Caps:** Violate dominance in Altadena (capped Altadena ≯ capped Pasadena).  
  - **Relative Expectation (e.g., Łukaszyk-Karmowski):** May fail reflexivity in two-envelope (paying to swap identical distributions).  

  ---

  ### **Summary Checklist for Your Scorecard**  
  | Desideratum               | Motivating Case(s)                  | Non-Negotiable? | Conflicts With          |  
  |---------------------------|-------------------------------------|-----------------|-------------------------|  
  | Statewise Dominance       | Altadena ≻ Pasadena                 | Yes             | Reordering Insensitivity|  
  | Reflexivity               | Two-envelope self-swap              | Yes             | Relative expectation    |  
  | Payoff Consistency        | Splitting outcomes                  | Yes             | Tail-optimized truncation |  
  | Ordinal Comparison        | Altadena vs. Pasadena ranking       | Yes             | —                       |  
  | Convergence Consistency   | St. Petersburg limit                | Camp            | Dominance (in Pasadena) |  
  | Reordering Insensitivity  | Pasadena expectation ambiguity      | Camp            | Dominance               |  
  | Unbounded Utility Support | Super-Petersburg                    | Camp            | Bounded-utility theories|  
  | Continuity in Limit       | Capped St. Petersburg               | Camp            | Oscillating truncations |  

  Focus debates on **whether to drop reordering insensitivity** (enables statewise solutions) vs. **whether to demand convergence** (favors limiting operations). The core tension is between "local" (statewise) and "global" (series summation) rationality. A theory satisfying #1–#4 can handle your cases without assigning expectations (e.g., via relative value comparisons), avoiding reordering traps.
