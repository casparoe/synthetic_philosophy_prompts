  | **Ambiguity aversion as rational**: Maximize min expected utility over priors.                       | **Distributionally robust optimization (DRO)** over uncertainty set $\mathcal{U}$.                          | Clean           | $\mathcal{U}$ directly encodes the "set of priors."                                    |
  | **Ambiguity premium**: Cost paid to avoid ambiguity.                                                 | **Robustness margin** (performance sacrificed for worst-case security).                                     | Clean           | CVaR/DRO objectives formalize this tradeoff explicitly.                                |
  | **Normative question**: Is preferring known odds irrational?                                         | Should you prioritize **risk-sensitive objectives** (CVaR/DRO) over **expected loss**?                         | **Inexpressible** | Your vocabulary *prescribes* widening $\mathcal{U}$ or collecting data—no room for "irrationality." |

  #### Residue Verdict  
  - **Verdict**: `live disagreement both vocabularies should host`  
  - **Justification**: The normative debate (coherence vs. ambiguity aversion) persists in ML: DRO *endorses* ambiguity aversion, while calibration/coherence arguments reject it—both have merit under uncertainty.

  #### Your Suspicion  
  - **Verdict**: Ambiguity aversion *is* distributional robustness, **but** it conflicts with coherence axioms—forcing a choice between "security against worst-case" (DRO) and "immunity to arbitrage" (Bayesian/additivity).

