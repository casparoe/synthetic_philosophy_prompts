  Then, the restricted version of Reflection. It should only apply when the update is epistemically proper, like learning from evidence. But then the question is whether this adds anything new. Does it just boil down to trusting reliable processes and distrusting unreliable ones? If so, it might not do independent work beyond basic epistemic norms.

