prompt: |-
  I'm running our philosophy of science reading group in a couple weeks — 75 minutes, on Jeffrey conditioning / updating on uncertain evidence. The crowd is a dozen grad students who can all do simple conditioning on a learned proposition in their sleep (most of them have TA'd intro decision theory), but none have seen Jeffrey's rule, plus one guy who keeps insisting anything that isn't straight Bayes conditioning "isn't really Bayesian, it's psychology." My thesis for the session: your evidence doesn't have to be a proposition you become certain of, and once you accept that, Jeffrey conditioning isn't some exotic rival rule, it's the honest generalization — and the price is that the order of your updates now matters, which I actually want to argue is a feature, not a bug. Don't write me the explanation, plan it: the order the pieces have to land in given what this crowd already knows, what the carrying example should be (I'm leaning toward Jeffrey's cloth-by-candlelight thing but talk me out of it if something else works better for this audience — the waking-up-and-it-feels-like-it-rained kind of case?), the misconceptions they'll form and where exactly in the sequence to head each one off — I'm specifically worried about "oh, so it's just averaging your possible posterior updates" getting deployed as a knockdown dismissal when it's really the rigidity assumption wearing a mask — and a check at the end that would show whether they've grasped the difference between genuinely uncertain evidence and just being lazy with your priors. Also tell me what to openly refuse to cover in 75 minutes and say so out loud (I suspect the answer definately includes Dutch book arguments and commutativity proofs, but you tell me). Format: exactly five numbered points, one or two sentences each, no intro or conclusion — I'll be reading this off my phone on the train.
reasoning: |-
  Okay, the user is organizing a philosophy of science reading group on Jeffrey conditioning for grad students familiar with basic Bayesian updating. They need a structured plan focusing on key concepts, common misconceptions, and a practical example. 

  The user's thesis is that uncertain evidence makes Jeffrey conditioning a natural generalization of Bayes, with path-dependence as a feature. They're worried about dismissive reactions like "it's just averaging posteriors" and want to preempt that. The cloth-by-candlelight example is floated, but they're open to alternatives.

  Hmm, the audience has strong foundations but one skeptic who rejects non-standard updating. Need to validate Jeffrey as genuinely Bayesian while distinguishing it from psychology. The rigidity assumption is crucial here—it's what prevents the "just averaging" misunderstanding. Should emphasize that rigidity is the commitment to stable likelihoods.

  For examples: cloth-by-candlelight is classic but visually tricky. The rain-feeling example might resonate better—more visceral uncertainty. Both work, but rain keeps it concrete. 

  Biggest landmine is definitely the rigidity point. Must explicitly contrast flexible likelihoods (lazy priors) vs. fixed likelihoods (genuine uncertain evidence). The check question at the end should target exactly that distinction. 

  Time constraints mean skipping Dutch books and commutativity proofs—agree with user's instinct. Focus on intuition and why path-dependence makes sense for uncertain evidence. Openly declare these exclusions upfront to manage expectations.

  Structure-wise: five punchy points. Start with Bayes as baseline, then break its certainty requirement, introduce Jeffrey as generalization, hit rigidity hard to block misconceptions, then validate with the rain example and diagnostic check. No fluff—user will read this on a train.
answer: |-
  1.  **Start with Bayes' limitation:** Remind them Bayes requires becoming *certain* of evidence E, but stress that sensory evidence (like dim lighting) or vague testimony often leaves you uncertain about the precise proposition E itself – your evidence is *how things seem* (P_new(E) < 1), not certainty of E.
  2.  **Introduce Jeffrey as generalization:** Frame Jeffrey conditioning as the natural extension: directly input your *new* probability for E (P_new(E)) after the experience, while demanding "Rigidity": the probabilities *conditional on E* and *conditional on ~E* remain *unchanged* from your prior (P_old(H|E), P_old(H|~E)).
  3.  **Crush "just averaging" immediately:** As soon as you state the rule (P_new(H) = P_new(E) * P_old(H|E) + P_new(~E) * P_old(H|~E)), explicitly head off: "This *looks* like averaging posteriors, but it's crucially *not* – it's averaging *conditionals* held rigid. Rigidity forbids changing P(H|E) based on *this* evidence; it's the core commitment making this *Bayesian*, not psychology."
  4.  **Use the "waking up/feels like rain" example:** Skip the cloth; use waking up groggy, *feeling like* it rained (P_new(Rain) = 0.6). Rigidity means P_old(Sprinkler|Rain) stays fixed; the *only* input is your new direct uncertainty about Rain itself. Show path-dependence by contrasting updating on "feel like rain" first vs. seeing wet ground first – argue this reflects how evidence *order* shapes ambiguous experiences.
  5.  **Check & Scope:** End check: "If I lazily assign P_new(E) high without a direct experience, but *don't* hold P(H|E) rigid, is that Jeffrey updating?" (No, rigidity is key). **Openly refuse:** Dutch books, commutativity proofs, and full discussion of whether rigidity is *justified* – say these are vital but for another session; focus today is the *structure* and necessity of Jeffrey for uncertain evidence.
