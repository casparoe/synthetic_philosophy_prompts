  For a feature I'm writing on whether machine learning has quietly revived the problem of induction, I've persuaded two long-standing disputants to attempt an adversarial collaboration and to co-sign a joint statement. One, a theoretical computer scientist, holds that the no-free-lunch theorems formalize Hume's point: averaged over all possible worlds, no learner beats any other, so any algorithm that generalizes owes its success to assumptions the training data did not certify. The other, an empirical ML researcher, holds that the theorems are true and beside the point: the uniform measure over functions is the wrong prior for any world in which data could actually be collected, and structure-exploiting algorithms win in exactly the kinds of worlds we inhabit. Draft the document they could both put their names to: the numbered claims both accept, including about what the theorems themselves establish and what they leave open; a table of the residual disagreements, each phrased so that its own side would accept the wording; and the cruxes -- I take it one is whether "the world is not uniform-random" is an empirical finding, a methodological commitment, or something in between, and another is whether the price of generalization is paid in bias or merely relocated. For each crux, give the case, argument, or experiment both would agree bears on it, with each side's prediction recorded in advance. If any part of the dispute strikes you as verbal -- for instance, a merely stipulative disagreement over which probability measure the no-free-lunch claim is being asked about, or over what counts as a "learner" versus an assumption smuggled into the hypothesis class -- isolate it and say so rather than papering it over. Finally, flag the claim each side would most like to sign but shouldn't, because it goes beyond what either can honestly defend.
