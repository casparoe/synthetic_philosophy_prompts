  Then, the disagreements table. For each, phrasing both sides accept. For example, the relevance of NFL: the theorist says it's fundamental, the empiricist says it's a technical truth with limited relevance. Also, the nature of assumptions—whether they're prior biases or learnable structures.

  Cruxes are key. The first crux is whether "the world isn't uniform" is empirical or methodological. The theorist sees it as a commitment, while the empiricist sees it as testable. Both might agree that successful generalization in practice supports the empiricist's view, but the theorist would caution against assuming it's universal.

  The second crux is about the price of generalization—bias or relocation. Theorist argues it's bias, meaning assumptions limit what can be learned. Empiricist says it's relocation; assumptions are necessary but can be validated. Experiments like out-of-distribution generalization could test this. Theorist predicts failure without domain knowledge, empiricist expects success with adaptable models.

