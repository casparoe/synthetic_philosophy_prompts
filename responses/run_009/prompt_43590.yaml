prompt: |-
  I'm on the selection committee for a fellowship our foundation gives to college seniors heading into public service, and we're fighting about how much weight to give "character." It's currently a third of the score, based on interviews and reference letters, because the founding idea was that we're betting on the person, not the resume. One of our commitee members teaches social psych and keeps pushing situationism at us: the old Hartshorne and May honesty studies, Milgram, the seminarians-in-a-hurry finding, all supposedly showing that what people do is driven by circumstances more than by stable traits, and that interviewers mostly project a coherent character onto whatever's in front of them. Half the committee wants to scrap the character score entirely and shift the wieght to a track record of concrete completed projects. The other half says the track record only counts *because* it displays character, so this is a distinction without a difference, and that a fellowship picked purely on outputs will select for people who optimize for legible outputs. Draft the memo I'll circulate before next month's meeting: recommend a concrete change (or a concrete non-change) to the scoring rubric, with reasoning both sides could actually respond to, and take the losing side's best argument seriously rather than just splitting the baby.
reasoning: |-
  Okay, the user is on a selection committee for a fellowship focused on public service for college seniors. They're stuck in a debate about how much weight to give "character" in their scoring rubric. Currently, it's a third of the score, based on interviews and reference letters. The committee is split: one side, influenced by situationism from a social psych professor, wants to scrap character scoring entirely and focus on concrete project track records. The other side argues that track records actually reflect character, so removing it misses the point and might favor people who just optimize for visible outputs.

  First, I need to understand both arguments deeply. The situationist perspective, citing studies like Hartshorne and May, Milgram, and the seminarian experiment, claims that behavior is more situational than trait-based. Interviews and references might not capture stable character traits because people project coherence onto others. So, using concrete projects as evidence seems more objective. The other side argues that character is foundational to public service, and track records are meaningful because they demonstrate character traits like perseverance. Removing character assessment might lead to selecting people who game the system for impressive but shallow outputs.

  The user wants a memo that recommends a concrete change or non-change, taking the losing side's best argument seriously. They don't want a compromise but a reasoned decision that addresses the core concerns. The memo should facilitate discussion, not just split the difference.

  Assessing the user's identity: they're part of a foundation's selection committee, likely professionals or academics involved in evaluating candidates. Their actual need is to resolve the committee conflict with a principled decision that aligns with the fellowship's mission. Deeper needs might include ensuring the fellowship's longevity by selecting candidates who genuinely embody public service values, maintaining the foundation's reputation, and creating a defensible, fair selection process that minimizes biases.

  The key is to bridge the gap between both sides. Situationists have a point about the unreliability of interviews, but completely ignoring character might miss the essence of the fellowship—betting on the person. The track record proponents are right about objectivity, but projects alone might not reveal character depth. The solution could involve refining how character is assessed, making it more behaviorally anchored through past projects and concrete examples in interviews, thus addressing both concerns.

  Recommendation: Retain character weighting but redefine its assessment to be evidence-based. Reduce the weight slightly to acknowledge situational critiques, but keep it significant. Shift interviews to focus on behavioral evidence and incorporate character reflections into project evaluations. This way, character isn't discarded but evaluated more robustly, using concrete examples, which satisfies both sides' valid points.

  Potential pitfalls: If character assessment is too vague, it remains problematic. If over-reliance on projects encourages gaming, the process needs safeguards. By anchoring character in demonstrated behaviors, the memo addresses the situationist critique while upholding the fellowship's founding principle. This should resonate as a thoughtful, middle-path solution that respects both viewpoints without being a weak compromise.
answer: |-
  ## MEMORANDUM  
  **To:** Fellowship Selection Committee  
  **From:** [Your Name], Committee Chair  
  **Subject:** Recommendation on Scoring Rubric Weighting for "Character" & Approach for Next Meeting  
  **Date:** October 26, 2023  

  **Purpose:** To propose a concrete modification to the fellowship scoring rubric regarding "Character," grounded in our foundational principles and addressing the valid concerns raised by both sides of our committee debate, ahead of our November meeting.  

  ### I. Acknowledging the Core Debate
  Our vigorous discussion reflects a deep commitment to selecting truly impactful public servants. The core tension is clear:  

  *   **Side A (Reduce/Remove Character Weighting):** Argues that "character" is an elusive concept poorly captured by interviews and references, susceptible to interviewer bias and projection (citing Hartshorne & May, Milgram, Darley & Batson). Situational factors dominate behavior, making stable trait assessment unreliable. Past *concrete, completed projects* offer the most objective, verifiable evidence of capability and commitment. Weighting character distorts the process with subjective noise.  
      **Best Argument:** *"Reliance on interviews and letters to assess stable character ignores decades of social psychology demonstrating the power of situations and the fallibility of trait attribution. We risk selecting based on perceived 'fit' or charisma rather than demonstrable action, and missing candidates whose circumstances limited past opportunities for 'character display' but possess immense potential."*  

  *   **Side B (Retain Character Weighting):** Argues that our fellowship's *raison d'être* is betting on the *person*, not just the resume. A track record of projects is valuable *precisely because* it reflects underlying character (e.g., perseverance, integrity, empathy). Focusing solely on outputs risks selecting those adept at optimizing for "fellowship-winning" projects, potentially overlooking individuals with deep commitment but fewer polished deliverables, or failing to discern ethical corners cut. Character assessment, despite challenges, is essential for predicting long-term, values-driven public service.  
      **Best Argument:** *"Public service demands more than competence; it requires resilience, ethical grounding, and a commitment that transcends specific projects. A purely output-based rubric incentivizes gaming the system and may overlook candidates whose authentic potential shines through in interpersonal engagement and whose references attest to their core values – precisely the qualities we were founded to identify and nurture."*  

  **Both sides present compelling, evidence-based concerns.** Side A correctly highlights the methodological weaknesses of traditional character assessment. Side B correctly emphasizes the foundational purpose of our fellowship and the risks of a purely transactional selection process.

  ### II. Recommended Concrete Change to the Rubric
  After carefully weighing these arguments, **I recommend we retain the "Character" category but modify its definition, assessment methods, and slightly reduce its weighting.**  

  *   **Proposed Rubric Structure:**  
      *   **Demonstrated Commitment & Impact (Track Record): 40%** (Previously implied within "Character" or split elsewhere). *Focus:* Concrete, completed projects, initiatives, or sustained involvement in public service. Evidence of initiative, execution, tangible outcomes, and learning from challenges. (Evaluated via application materials, references specifically addressing projects/roles).
      *   **Character & Potential: 30%** (Previously "Character" at 33%). *Focus:* **Evidence of qualities essential for long-term public service leadership, grounded in demonstrated behaviors and reflections.** (Evaluated via *refocused* interviews and *specific* reference prompts).
      *   **Vision & Future Contribution: 20%** (Clarity of purpose, understanding of challenges, potential impact of fellowship year).
      *   **Academic & Intellectual Readiness: 10%** (Sufficient rigor for proposed fellowship work).

  *   **Key Modifications to "Character & Potential":**  
      1.  **Reframe the Concept:** Shift from assessing an abstract, stable "character" to evaluating **"demonstrated character-relevant behaviors and reflective capacity."** We are not searching for immutable traits but for evidence of how candidates have navigated challenges, collaborated, exercised judgment, and reflected on their values and experiences *in specific contexts*.  
      2.  **Revamp the Interview:**  
          *   Move from broad "get to know you" questions to **Structured Behavioral Interviewing (SBI).** Ask candidates for *specific past examples* (e.g., "Tell me about a time your ethics were challenged in a project. What did you do? What did you learn?"). Probe for actions, thoughts, and feelings in those situations.  
          *   **Explicitly incorporate situational awareness:** Include questions prompting candidates to reflect on how context influenced their actions or decisions in past experiences, acknowledging the situationist perspective.  
      3.  **Refocus Reference Letters:**  
          *   Provide references with **specific prompts** asking for *concrete examples* illustrating character-relevant behaviors (e.g., "Please describe a specific instance where the candidate demonstrated resilience in the face of a significant setback" or "Describe a situation where the candidate had to navigate a disagreement within a team focused on public service. What was their role and contribution?"). Discourage vague praise.  
      4.  **Integrate with Track Record:** Explicitly instruct reviewers to look for evidence of character *within* the "Demonstrated Commitment & Impact" section (e.g., perseverance shown in completing a long-term project, integrity in reporting outcomes).

  ### III. Reasoning: Addressing Both Sides & Our Mission
  This recommendation directly engages with the strongest arguments on both sides:  

  *   **Addressing Side A (Situationist Critique):**  
      *   **Reduces Reliance on Subjective Impression:** SBI and specific reference prompts force assessment onto *demonstrated past behaviors* in *specific situations*, directly countering the critique that interviews assess projected coherence rather than reality.  
      *   **Acknowledges Situational Power:** By asking candidates to reflect on context within interviews and focusing on behaviors *in situ*, we explicitly recognize that actions are context-dependent.  
      *   **Increases Objectivity:** Concrete examples are more verifiable and less prone to pure projection than broad character judgments.  
      *   **Elevates Concrete Projects:** The new "Demonstrated Commitment & Impact" category gives significant, standalone weight to the tangible outputs Side A values most.  

  *   **Addressing Side B (Foundational Bet on the Person):**  
      *   **Retains Core Mission Focus:** "Character & Potential" remains a significant, distinct category, ensuring we actively evaluate the qualities that make someone likely to be a *values-driven, resilient* public servant over the long haul.  
      *   **Mitigates Gaming the System:** By grounding "Character & Potential" in specific past behaviors and reflections, and linking it to the track record, we make it harder to optimize purely for superficial outputs. A candidate with impressive projects but questionable ethics or poor collaboration *should* be exposed through behavioral examples.  
      *   **Captures Potential Beyond Polished Outputs:** The behavioral/reflective approach allows us to identify candidates whose *process*, learning, and values demonstrated in less "legible" projects or challenging situations reveal high potential, even if their outputs aren't the most numerous or glossy.  
      *   **Preserves Holistic View:** Interviews remain crucial, but are made more rigorous and less biased. References are directed towards concrete evidence, making them more valuable.  

  **This is not simply "splitting the baby."** It is a principled evolution:  

  1.  **We accept the situationist critique** that traditional character assessment is flawed and reduce its weight *slightly* while fundamentally changing *how* we assess it, moving towards behavioral evidence.  
  2.  **We affirm the foundation's core belief** in betting on the person by retaining a distinct category focused on the essential qualities for sustained public service, but grounding it more rigorously in what candidates have actually *done* and *reflected upon*.  
  3.  **We elevate concrete evidence** by creating a major category solely for track record, addressing the demand for objectivity while simultaneously using that track record to inform our view of character.

  ### IV. Path Forward for November Meeting
  1.  **Review & Debate:** Please come prepared to discuss this specific proposal. Does the reframing of "Character & Potential" address your core concerns? Are the assessment methods (SBI, specific reference prompts) feasible and likely to improve objectivity? Does the weighting feel balanced?  
  2.  **Operational Refinement:** If the core proposal gains traction, we will need to develop:  
      *   Detailed SBI question bank for interviews.  
      *   Revised reference letter request templates with specific prompts.  
      *   Updated reviewer guidance/rubric language for "Character & Potential" and "Demonstrated Commitment & Impact."  
  3.  **Pilot & Review:** We should commit to reviewing the effectiveness of this new approach after the next selection cycle, specifically examining if the behavioral focus yields more reliable insights and if concerns about bias or "gaming" are mitigated.

  This proposal seeks to honor the valid insights from both sides of our debate while staying true to the spirit of our fellowship. It moves us towards a more rigorous, evidence-based, and mission-aligned selection process. I look forward to a productive discussion next month.

  **[Your Name]**  
  **Chair, Fellowship Selection Committee**
