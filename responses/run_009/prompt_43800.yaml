  - Address the metaphysics carefully: "he insisted on the integrity of each moment" subtly signals endurantism. Explicitly note his ban on block-universe consolations but pivot to how that made him cherish presence. 
  - Comfort through legacy: not temporal parts, but enduring (ha) impact—laughter in memories, lessons taught. 
  - To philosophers: "his absence is precisely what he claimed it would be" satisfies both camps. 
  - Nod to the friend: "forty years of joyful combat" honors the debate. 
  - Close with garden imagery—folding him into the landscape he loved. 

  Watch for traps: 
  - Avoid "part of him lives on." Use "his life echoes" instead. 
  - Don't call memories "slices." Say "moments" or "days." 
  - Heidegger reference must be gentle—"suspicious" not scornful. 

  Tone: tender but sturdy, like he was. No false solace, just steadfast love. The garden metaphor carries warmth for non-philosophers while philosophers catch the metaphysical precision in "blooming exactly when and where it was." 

  Final check: 
  - Comfort? Yes—focus on gratitude for his full presence. 
  - Truthful? No immortality smuggled in. 
  - Nod to friend? Celebrates their intellectual bond. 
  - Time? Five minutes if read slowly with pauses. 

  ... Good. This should honor the man, his philosophy, and his people.
answer: |-
  ## Eulogy for a Whole Life

  [Stand simply, take a breath, look out at the gathering]

  Ninety years. A long line of days. But if you knew Arthur, you knew this: he wasn’t spread out along that line like beads on a string. He wasn’t a collection of temporal slices. He was *here*. Fully. Wholly. Present in every single moment he inhabited. That wasn't just his philosophy – it was how he lived. When he argued with you at the kitchen table, he was *all there*. When he knelt in the dirt of his beloved garden, planting seeds with those careful, soil-stained hands, he was *all there*. When he listened to you – really listened, his eyes sharp and kind – he was *all there*. He insisted on the integrity of the moment, the complete reality of the *now*.

  And that’s why the loss we feel today is so profound, so sharply real. Because Arthur is no longer here. He existed, wholly and completely, for ninety years. He lived a life rich with argument, with deep loyalty, with the quiet satisfaction of watching things grow – both in his garden and in the minds he nurtured. He loved fiercely, thought deeply, and tended his corner of the world with unwavering care. And now, that particular, vibrant, wholly present Arthur is gone. He wouldn’t want us to pretend otherwise. He was clear about that. No metaphysical sleight-of-hand, no consolations borrowed from theories he believed obscured the fundamental truth of existence and cessation.

  [Shift focus, warmth returning]

  But here’s what we *can* hold onto, without violating a single principle he held dear: the *impact* of that wholly present life. The way he showed up, completely, day after day. Think of the garden he left behind. The physical one, yes, bursting with the life he coaxed into being, season after season. But more importantly, the garden of our lives. The ideas he planted and tended in his students and colleagues. The love he cultivated in this family – the laughter around holiday tables, the quiet conversations, the unwavering support. The sheer *character* he embodied: stubbornly honest, fiercely loyal, committed to truth even when it was uncomfortable, and always, always present for the people he loved.

  He wasn’t spread out through time. But the consequences of his being *here*, fully *here* for all those moments? Those ripple outwards. We remember *him* – the whole man, arguing passionately, digging in the earth, chuckling at a grandchild's joke. We carry his lessons – about integrity, about presence, about the importance of tending your own plot, whether it’s filled with roses or rigorous logic. We feel the absence precisely because his presence was so complete, so undeniable.

  [Direct, gentle nod to the front row]

  And let’s be honest, part of the vibrancy of Arthur’s intellectual life was the sheer, joyful friction of a forty-year argument with a dear friend seated right here. [*Brief, affectionate glance towards the perdurantist friend*] They never conceded an inch, but the depth of their respect, the sheer *delight* they took in the intellectual sparring, was a testament to both of them. It wasn't about winning; it was about the shared, profound commitment to understanding the fundamental nature of existence, of persistence, of *being*. That argument was a form of love – a love for truth, for rigor, and for each other. It showed us how deeply he engaged, how wholly present he was, even – perhaps especially – in dissent.

  [Concluding, grounded]

  So, how do we find comfort? Not in the false promise of scattered temporal parts or an eternal block. Arthur wouldn’t thank us for that. We find it in the undeniable reality of the life he *wholly* lived. We find it in the garden still blooming, the arguments that still shape us, the love that persists in our memories and our actions. We find it in the profound gratitude for the ninety years he was *here*, completely here, enriching our world with his unique, steadfast presence.

  He showed us how to be wholly present in our own lives. The greatest tribute we can offer is to live as he did: tending our gardens, engaging deeply, loving fiercely, and being *all here*, right now, for the time we are given.

  Thank you, Grandpa. For every wholly present moment. You are missed, completely. And you were loved, entirely.

  [*Pause, step back slightly*]
