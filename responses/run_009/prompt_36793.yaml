  The disagreement over "moral evidence" is partly verbal. D. defines "evidence" narrowly as *facts/principles to reason upon*, while you define it broadly to include *processed judgments from trusted sources*. Once defined, the genuine crux is whether delegation counts as *responsible* evidence use.

