  | Whether an action loses *praiseworthiness* if the agent cannot articulate independent moral justification, even if the action was objectively right. | Genuine           | Does praiseworthiness require first-person reasoning? | *Medical Triage*: A passerby follows a nurse's instruction to apply a tourniquet to a bleeding victim but cannot explain why it was medically necessary. Victim survives. | D: "Less praiseworthy – acted mechanically without grasping rationale." | Me: "Fully praiseworthy – trusted expertise saved a life; reasoning not required." |  
