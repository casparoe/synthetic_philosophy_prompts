answer: |-
  Here’s a decision tree for diagnosing democratic backsliding, designed to surface conceptual disagreements. Start with the case: **An incumbent packs the constitutional court, uses rulings to weaken media regulators and election administration, but continues holding elections it could lose.**

  ---

  ### Decision Tree: Diagnosing Democratic Backsliding

  1.  **Does the incumbent’s action *directly undermine the fairness of competitive elections*?**  
      (e.g., by making it impossible for opponents to win, or by making vote counts unreliable)  
      - **YES** → **Competitive Elections View** (*Backsliding = closing the competitive arena*)  
          - *Partisan Symmetry Test:* Would you call it backsliding if the *opposition* packed courts to reverse these changes? If **NO**, your view may be partisan.  
      - **NO** → Go to 2.

  2.  **Is this action part of a *pattern* where the executive systematically weakens *multiple independent checks* (courts, media, oversight bodies)?**  
      (e.g., even if no *single* act destroys elections)  
      - **YES** → **Executive Aggrandizement View** (*Backsliding = incremental erosion of constraints on power*)  
          - *Partisan Symmetry Test:* Is it backsliding only when *your* side isn’t in power? If **YES**, your view may be partisan.  
      - **NO** → Go to 3.

  3.  **Do the actions create *systematically unequal influence* over politics?**  
      (e.g., by entrenching elite/minority/majority dominance without banning opposition)  
      - **YES** → **Equality/Non-Domination View** (*Backsliding = rising asymmetry in political agency*)  
          - *Partisan Symmetry Test:* If the *oppressed group* used these tactics to gain equality, would it still be backsliding? If **NO**, your equality standard may be asymmetric.  
      - **NO** → Go to 4.

  4.  **Is "democratic backsliding" a useful concept here, or is it masking more specific problems?**  
      (e.g., is the term being used to delegitimize policy choices you dislike?)  
      - **USEFUL** → Revisit earlier questions; you likely answered "YES" to 1, 2, or 3 but missed it.  
      - **NOT USEFUL** → **Deflationist View** (*"Backsliding" is partisan rhetoric; retire it for precise terms like "court-packing" or "media capture"*)  
          - *Partisan Symmetry Test:* Do you *only* label actions by the opposing side as "backsliding"? If **YES**, you confirm the deflationist critique.  

  ---

  ### Named Positions & Notes:
  - **Competitive Elections View (Schumpeterian/Minimalist):** Backsliding requires threatening electoral turnover. *This case:* Backsliding only if elections become unfree/unfair.  
  - **Executive Aggrandizement View (Trajectory-Based):** Backsliding is cumulative weakening of accountability. *This case:* Backsliding occurs via court-packing + captured rulings.  
  - **Equality/Non-Domination View (Substantive):** Backsliding can occur via inequality, even with intact elections. *This case:* Backsliding if actions entrench dominant-group control.  
  - **Deflationist View (Skeptical):** "Backsliding" is an ideological weapon; avoid it. *This case:* Call it "institutional manipulation," not erosion.  

  **Unoccupied Leaf:** A "NO" at all substantive questions (1-3) leading to "NOT USEFUL" isn’t a *defended* position in literature. Scholars either argue backsliding occurred *or* reject the concept entirely (deflationism). This branch is **unexplored**, likely because denying all three criteria implies the case is democratically benign – a hard sell.  

  ---

  ### Where the Tree is Most Likely to Mislead (Critic’s Note):  
  **Weakest Branch:** Question 2 (trajectory of executive aggrandizement). Critics argue it risks overdiagnosis: not all institutional tinkering is backsliding. The tree assumes a "pattern" is self-evident, but scholars disagree on what constitutes a *systemic* threat vs. ordinary politics. **Breaking Case:** A party packs courts once to pass popular reforms, then stops. Trajectory-view diagnoses backsliding; competitive-elections view may not. The tree forces a binary where ambiguity exists. **Major Critique:** The whole approach assumes concepts are discrete, but real-world erosion often blends mechanisms, making clean categorization reductive. The partisan symmetry test also oversimplifies – not all asymmetries are hypocritical (e.g., if one side benefits from structural advantages).

  ---

  **Word Count:** ~750. Handout-ready. Focuses on case-based branching, surfaces partisan symmetry tensions, flags the unexplored path (benign institutional change), and notes the trajectory branch’s vulnerability.
