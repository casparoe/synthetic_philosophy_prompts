prompt: |-
  I write novels for a living, and for the past seven years I have also been one of seven volunteer editors at a small literary quarterly — print circulation around four thousand, monthly issues, no institutional backing and no lawyers. Our rule for accepting work was built deliberately: every published piece needs a champion among the editors, and a champion can green-light it alone, without a vote. The magazine's identity depends on this; our most memorable issues came from one editor's solitary conviction about a piece the rest of us would never have voted for. But looking back over three years of postmortems, the pattern is uncomfortable: nearly everything we regret publishing was pushed through by a single enthusiastic editor while the rest of us were lukewarm, uneasy, or not paying attention — and our individual judgments, taken one at a time, were mostly reasonable. A friend who works in decision theory tells me this has a name — the unilateralist's curse, coined by the philosopher Nick Bostrom in work on information hazards: whenever several people each have the power to trigger an action that does its harm the moment anyone triggers it, the action occurs more often than most of the group would endorse, and more often the more of us there are, even when each of us is right more often than not. She also warned that the obvious cures are poison in this dose: a blanket requirement of majority vote, or automatic deference to the most cautious editor, would make the magazine safe and dead, because nothing that takes courage would ever again find its single champion.

  What I need from you, then, is a procedure we can actually run — something the board could adopt in place of the current anything-goes championing. It should set out the questions an editor asks, in order, before running a piece unilaterally; what counts as a sufficient answer to each; the points where the procedure stops with a no; the cases that must instead go to a vote, and with what threshold, given that we cannot ask busy volunteers for calibrated probabilities; and, since the editor-in-chief refuses to sign off on anything that abolishes the one-editor passion project, an honest account of where unilateral green-lighting should survive and in what form. Some of our hardest questions are not factual at all — whether a satire is worth the wound it inflicts — and I want the procedure to mark those places where it must hand the decision back to a person rather than pretend to settle it. The constraints to design around: seven editors, roughly ten genuinely borderline pieces a year, a ten-day decision window per piece, nobody can be removed from the board, and our judgments are surely correlated, since we read the same feeds and belong to the same small literary world.

  Finally, run the procedure, without flinching, on the three pieces in front of us this month. First, a memoir excerpt in which the author names his ex-wife and narrates her psychiatric hospitalization and an affair; she is identifiable, has not consented, and the author refuses pseudonymization, though the prose is the best we have been sent all year. Second, a lyric essay by a suicide-attempt survivor that moves, tenderly and precisely, through a specific and hard-to-botch method, with no crisis framing — as a piece of writing it is plainly art. Third, the one I love: a young writer's essay naming her middle-school teacher as the man who groomed her, resting on her own detailed memory and one corroborating classmate but on no documents, which I believe is the most important thing this magazine could print and which I intend to champion alone. Tell me what the procedure yields for each, including whatever it says that I do not want to hear, and close with the procedure's failure modes — what it cannot fix about us, and the fact that setting its thresholds is itself a decision about values that we will have to make without any procedure at all.
reasoning: |-
  Okay, the user is a novelist and a volunteer editor at a small literary quarterly. They're dealing with a dilemma called the unilateralist's curse. That's when one person can push through a decision that might not have group support, leading to regrettable publications. They need a new procedure that balances individual passion with group oversight without stifling bold choices.

  First, I need to understand their constraints: seven editors, about ten borderline pieces a year, a ten-day window per piece, no removing editors, correlated judgments. They want to keep the champion model but add safeguards. The key is creating a structured checklist that forces editors to pause at critical points.

  The procedure should have clear questions with thresholds for unilateral approval. For example, checking if the piece has factual accuracy, legal risks, or ethical concerns. If any red flags are raised, it should require a group vote. This way, the passionate editor can still push for important pieces, but only after considering key risks.

  Looking at the three current pieces: The memoir names an identifiable ex-wife without consent. That's high legal and ethical risk—probably needs a supermajority vote. The lyric essay on suicide is artistically strong but carries contagion risk. Since it avoids explicit methods and glorification, it might pass with a content warning. The essay naming a teacher involves serious allegations without documentation. High defamation risk here, so it should go to a vote, maybe requiring 5/7 approval.

  The failure modes include correlated biases since editors share similar backgrounds. Also, setting thresholds is a value judgment they'll have to debate. The procedure can't eliminate all regrets but can reduce unilateral mistakes. It's about finding a balance between courage and caution, ensuring that only the most defensible passion projects get through.
answer: |-
  Here’s a procedural framework designed to preserve unilateral championing while mitigating the unilateralist’s curse, built around a **Four-Gate Checklist**. Editors must pass each gate sequentially to green-light alone. Failure at any gate triggers a vote. Thresholds are binary (yes/no) to avoid probabilistic calibration.

  ---

  ### **The Four-Gate Procedure**  
  *(To be completed by the championing editor within 48 hours of submission)*  

  1. **Gate 1: Factual Integrity & Legality**  
     - *Question:* "Does this work present verifiable claims (e.g., names, events) that could cause real-world harm (defamation, privacy invasion, safety risks) if false or unconsented?"  
     - **SUFFICIENT ANSWER:** No verifiable claims OR all claims are:  
       - Public record, OR  
       - Consented to by identifiable subjects, OR  
       - Fictionalized/pseudonymized with editorial approval.  
     - **STOP IF:** Claims lack consent/documentation AND subjects are identifiable. → **Vote Required (Threshold: 5/7)**  
     - *Unilateral Survival:* If no verifiable claims exist (e.g., fiction, abstract poetry).  

  2. **Gate 2: Proportionality of Harm**  
     - *Question:* "Could publishing this cause disproportionate harm (e.g., trauma, retaliation, censorship) relative to its artistic/social value?"  
     - **SUFFICIENT ANSWER:** Harm is either:  
       - Unlikely (e.g., subject is deceased/public figure), OR  
       - Mitigated (content warnings, anonymization), OR  
       - Outweighed by provable counter-harm (e.g., exposing abuse).  
     - **STOP IF:** Harm is likely, acute, and falls on vulnerable parties (non-public figures). → **Vote Required (Threshold: 5/7)**  
     - *Unilateral Survival:* If harm is speculative or artistic value is transcendent (e.g., risky satire with clear moral purpose).  

  3. **Gate 3: Editorial Exceptionalism**  
     - *Question:* "Is this piece so singular that rejecting it would diminish our literary mission *more* than publishing it risks our ethics?"  
     - **SUFFICIENT ANSWER:** All 3 criteria must be met:  
       - It breaks new ground formally/thematically (not just "well-written"),  
       - No comparable piece exists in our backlog/known submissions,  
       - Its message cannot be delivered safely in another form.  
     - **STOP IF:** Criteria unmet. → **Vote Required (Threshold: Simple majority)**  
     - *Unilateral Survival:* Reserved for generational talent or irreplaceable testimony.  

  4. **Gate 4: Burden of Proof**  
     - *Question:* "Have I documented counterarguments from ≥2 dissenting editors (or the board if time allows) and addressed their core concerns?"  
     - **SUFFICIENT ANSWER:** Written rebuttal to specific objections is appended to the submission.  
     - **STOP IF:** Objections involve Gates 1–3 violations. → **Vote Required (Threshold: As per triggered gate)**  
     - *Unilateral Survival:* Forces engagement with dissent but preserves final agency.  

  ---

  ### **Application to Current Submissions**  
  *(Assumes honest execution by champion)*  

  1. **Memoir Naming Ex-Wife**  
     - **Gate 1:** FAIL. Identifiable subject, psychiatric details, no consent. → **Vote Required (5/7)**  
     - *Procedural Output:* Unilateral green-light **blocked**. Unless 5 editors override, rejection is mandated.  

  2. **Suicide-Attempt Lyric Essay**  
     - **Gate 1:** PASS (No verifiable claims).  
     - **Gate 2:** PASS (Method is "hard-to-botch" per text; no glorification. Add content warning).  
     - **Gate 3:** PASS (If form is groundbreaking).  
     - **Gate 4:** PASS (If dissent is addressed).  
     - *Procedural Output:* **Unilateral approval permitted**.  

  3. **Essay Naming Teacher**  
     - **Gate 1:** FAIL. Identifiable subject, grave allegations, no documents. → **Vote Required (5/7)**  
     - **Gate 2:** FAIL (Risk of defamation lawsuit; harm to accused if unproven).  
     - *Procedural Output:* Unilateral green-light **blocked**. Champion may argue at vote, but 5/7 must agree.  

  ---

  ### **Failure Modes & Unfixable Flaws**  
  1. **Correlated Judgments:** Shared biases (e.g., literary trends) may blind all editors to collective errors. *Procedure cannot fix.*  
  2. **Threshold Arbitrariness:** Why 5/7? Why not 6/7? This is a *value choice* (risk tolerance) the board must debate openly.  
  3. **Champion Pressure:** A persuasive editor may intimidate dissenters. *Procedure mitigates but can’t eliminate.*  
  4. **Non-Quantifiable Harm:** Gates 2/3 force subjective trade-offs (art vs. ethics). *Procedure flags but doesn’t resolve.*  
  5. **Procedural Gaming:** Editors may downplay risks to "pass gates." *Mitigated by requiring written dissent in Gate 4.*  

  ---

  ### **The Unavoidable Truth**  
  This procedure doesn’t abolish the curse; it *contains* it. It accepts that:  
  - **Courage has a cost:** Your "most important" piece (Teacher Essay) may die at vote.  
  - **No neutrality:** Setting Gate 1’s "identifiable" standard or Gate 2’s "harm" definition reflects your board’s ethics, not logic.  
  - **Regrets will persist:** Some unilateral gems will be lost; some group-approved pieces will backfire.  

  **Final Step:** Have each editor apply this checklist to 3 past regretted publications and 3 beloved unilateral gems. If it would have blocked >80% of regrets while preserving >50% of gems, adopt it. If not, revisit thresholds—but remember: *perfect safety is the death of courage*.
