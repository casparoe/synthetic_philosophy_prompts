  The core tension is between independent motivation and immunity to strengthened paradoxes. Tennant tries but his fix feels engineered, while Dummett's is principled but sacrifices too much. The user likely senses that any independently motivated restriction (like Dummett's) won't cover enough, and anything robust against paradoxes (like Tennant's) won't feel genuine. 

