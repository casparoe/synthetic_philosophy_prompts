  For Tennant's cartesian restriction: Substance is okay since it allows unknown truths. Independent motivation is weak—defining "cartesian" around unknowability feels reverse-engineered. It fails the strengthened paradox because the Moore sentence (P & ~Kp) isn't cartesian, but similar sentences can be constructed that are cartesian and still cause issues. Motivation preservation is moderate; it aligns with anti-realism but restricts basic claims.

