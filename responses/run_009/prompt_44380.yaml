prompt: |-
  my friend from our metaphysics reading group has this running list of rulings on material constitution cases, and before our next meeting I want to predict her verdict on a new case (there's a small bet riding on it). her verdicts so far:

  - the statue (Goliath) and the lump of clay it's made from (Lumpl) are sitting on the table: she says two objects, not one
  - if the sculptor squashes Lumpl into a ball, the lump survives but the statue doesn't
  - a house survives a renovation that replaces every single brick over ten years: same house. the pile of old bricks in the yard is not the house and never was
  - a gold ring melted down: the ring ceases, the gold persists, and if you re-cast that gold into a ring of the exact same shape it's a new ring
  - whole-brain transplant into a different body: you survive it, so a person and their body are two objects, not one

  the new case. a sculptor shapes a clay statue, "Wave," it gets exhibited, catalogued, insured, the whole nine yards. years later she has a falling out with the art world and formally kills the work: the museum deaccesions it, the catalogue lists Wave as destroyed, and she puts the still fully intact, still perfectly statue-shaped object on a shelf at home with a label that just says "clay." the shape never changes, nobody squashes anything. did Wave survive?

  what I can't figure out is which rule she's actually running. some of her verdicts sound like sortal-tracking — you're a statue only while you count as one, you're a house only while the sortal keeps applying continuously. some sound like she individuates objects by persistence conditions — two objects where the survival profiles come apart, one where they don't. and some (the renovated house, the re-cast ring) sound like she cares about the continuous history or career of a thing.

  so: do those rules each actually fit all five of her earlier verdicts, or does one of her rulings already strain one of them? what does each rule predict for Wave specifically — the demotion changed no physical facts and nothing about what the object could survive, but if the statue is partly constituted by its art-world standing, maybe that's enough to end it? give me your best guess for what she'll actually say and why you prefer it.

  and since this decides the bet: name one more case she hasn't ruled on where the candidate rules give different verdicts, so I can spring it on her and find out which rule she's really runnning.
reasoning: |-
  Okay, let me break this down. The user is trying to predict their friend's verdict on a new metaphysics case about a clay statue called Wave that was formally "killed" as an artwork while remaining physically unchanged. They've listed five prior rulings and want to reverse-engineer the underlying principle to win a bet.

  First I need to map the friend's existing pattern:
  - Statue/lump: two objects (different persistence conditions)
  - Squashed clay: statue destroyed, lump survives (persistence divergence)
  - Renovated house: survives complete part replacement (career continuity over matter)
  - Melted ring: new ring after recasting (no career continuity)
  - Brain transplant: person survives (not body-dependent)

  Three candidate principles emerge: sortal-tracking (status-based identity), persistence-condition individuation (modal properties), and career continuity (historical path). Testing these against existing cases:

  Sortal-tracking struggles with the renovated house - the "house" sortal persists despite total part change. Persistence conditions work for statue/lump but get messy with the recast ring (same modal profile but deemed new). Career continuity perfectly fits all five - it explains why the house survives (continuous function) and why the recast ring is new (career broken by melting).

  For Wave's case: Career continuity would say Wave died when deaccessioned because its art career ended, even though the clay's physical career continues. Sortal-tracking would agree (statue status revoked). Only persistence conditions might suggest survival since physical properties are unchanged.

  The best prediction is "Wave did not survive" based on career continuity being the most consistent principle. To test this definitively, I propose a variant with a ship that's disassembled and reassembled identically after years - career continuity would call it a new ship while persistence conditions might see it as the same.

  Noticing subtle details: The friend treats the melted-then-recast ring as new despite identical form, which overrides modal properties in favor of historical breaks. Also her house ruling prioritizes functional continuity over part replacement, showing career matters more than matter. The brain transplant case further confirms she separates abstract careers (personal identity) from physical vessels.

  User's deeper need seems to be winning the bet through epistemic rigor - hence requesting a diagnostic case. The sculptor's ceremonial "killing" of Wave parallels the ring's melting as a career-terminating act, making "death by deaccession" the likely verdict.
answer: |-
  Based on your friend's rulings, she's running a **Career Continuity** principle. Here's the breakdown of why, how it fits all her cases, the prediction for Wave, and a diagnostic case:

  ---

  ### **Why Career Continuity?**
  This principle holds that an object persists only if its *functional or institutional career* continues unbroken. Identity depends on the *historical role* it plays, not just physical continuity or modal properties.  
  - **Fits all five rulings**:
    1. **Statue (Goliath) vs. Lump (Lumpl)**: Two objects because they have different careers (artwork vs. raw material).  
    2. **Squashing Lumpl**: The statue's *art career* ends abruptly; the lump's *material career* continues.  
    3. **Renovated House**: The *functional career* (being a house) persists despite part replacement. The pile of bricks lacks that career.  
    4. **Melted Ring**: Melting ends the ring's *functional career* (as a wearable object with symbolic value). Recasting starts a new ring's career.  
    5. **Brain Transplant**: The *personal identity career* (consciousness/memories) continues in the new body; the biological body's career ends.  

  Other principles fail:  
  - **Sortal-Tracking**: Struggles with the renovated house (no continuous matter/shape).  
  - **Persistence Conditions**: Fails the recast ring (identical modal profile ≠ same object).  

  ---

  ### **Prediction for Wave: NO, Wave Did Not Survive**
  - **Why**: Wave’s institutional *career as an artwork* was formally terminated (deaccessioned, cataloged as destroyed). Even though the physical object remains identical, its *artworld status*—which defined its career—ended.  
  - **Analogy to her rulings**:  
    - Like the melted ring, an institutional act (melting/deaccession) ends the career.  
    - Like the squashed statue, the object loses its functional identity despite physical continuity.  
  - **Physical change irrelevant**: Her house ruling shows careers can persist *through* physical change; conversely, Wave shows careers can end *without* physical change.  

  **Your best bet**: Predict she says **Wave is destroyed**.  

  ---

  ### **Diagnostic Case to Spring on Her**
  **The Ship of Theseus + Reassembly**:  
  > A ship (Seafarer) sails for years, gradually replacing all planks. The removed planks are stored. After 10 years:  
  > - **(A)** The continuously renovated ship sails on.  
  > - **(B)** Someone reassembles the original planks into an identical ship.  
  >  
  > *Is (A) or (B) the original Seafarer?*

  - **Career Continuity (her likely rule)**:  
    - (A) is the original ship (continuous functional career at sea).  
    - (B) is a replica (career broken; stored planks had no "ship" role).  
  - **Sortal-Tracking**: Likely same as career continuity (sortal depends on function).  
  - **Persistence Conditions**:  
    - If she prioritizes modal properties, (B) *might* win (same original matter).  
    - But her recast-ring ruling suggests she’d reject this.  
  - **Clincher**: If she says only (A) is Seafarer, she’s confirmed career continuity. If she says both or (B), she’s inconsistent with her ring/house rulings.  

  ---

  ### **Why Career Continuity Wins**
  Her verdicts hinge on *social/institutional narratives*:  
  - The house survives renovation because its *role as a dwelling* continues.  
  - The ring dies when melted because its *role as jewelry* ends.  
  - Wave’s "death" is a performative artworld act—careers are defined by context, not atoms.  

  **Final bet**: Wave is gone. The clay persists, but its career as Wave ended with the deaccession. Bring the Ship of Theseus case to confirm!
