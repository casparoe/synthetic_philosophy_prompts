prompt: |-
  I'm a retired evolutionary biologist (thirty-odd years working on behavioral ecology, mostly bird mating systems) who has gotten seriously into philsophy over the last few years, and I now run a weekly discussion group at our community center called Science and Ethics. The attendees are mostly other retirees — a former nurse, a high school chemistry teacher, an accountant — smart folks but with no philosophy background, and every few weeks somebody brings in a news story claiming scientists have explained where some moral belief comes from and declares that this proves the belief is an illusion. Last month it was a piece arguing that our condemnation of incest is just inbreeding avoidance dressed up as a rule, so the rule isn't "really about anything." Before that it was someone claiming that since evolution shaped our sense of fairness to manage cooperation in small bands, our ideas of justice are just adaptations with no claim on us. I can feel there's a real distinction here — explaining why we hold a belief versus showing the belief isn't true — and I gather philosophers like Sharon Street and Richard Joyce have pressed versions of this worry about whether evolution undermines objective morality, but our discussions always end in people talking past each other. What I'd like is a decision procedure I can actually run at the whiteboard: a short sequence of questions to ask about any "science explains your moral belief, therefore debunked" claim, with a rule of thumb for what counts as a sufficient answer at each step, so the group can work through a claim together in fifteen minutes or so. Somewhere in there the procedure needs to say explicitly when the question stops being a scientific one and becomes a values question that no amount of evolutionary data can settle, and also where the procedure can misfire — I don't want to hand the group a false sense that any of this is mechanical.

  Once you've laid out the procedure, please run it on three claims of the sort that actually show up in our group. First, the incest one: the taboo is traced to inbreeding avoidance, so the moral condemnation is supposedly just an adaptation we should see through. Second, a finding that people's purity judgments track pathogen-avoidance instincts — the way people moralize things just because they find them gross, food taboos being the classic example. Third, the one that I expect will cause trouble: someone tries the same debunking move against the belief that factory farming is wrong, on the grounds that we only care about animal suffering because empathy was useful for raising offspring, so we should drop the moralizing. I suspect the procedure should give an answer some of my members won't like whichever way it goes on that last one, and I'd like to see that happen rather than have the procedure dodge it. The hardest case my procedure absolutely has to handle: one member keeps objecting that by the same logic, evolution debunks our belief that evolution is true, or our perceptual beliefs generally, and yet we still trust perception, so why does morality come out worse — the procedure should either answer that or flag honestly where it can't.

  A few constraints on the writeup. No jargon, or at least any jargon immediately translated into plain words — nobody in that room knows what a non-naturalist is, and frankly neither do I yet. It has to survive being run by me rather than a professional philosopher, in a ninety minute session where we do two claims at most. And please write the whole thing as continuous prose, no headings or bullet points or bold text or tables, the way you'd write a long letter to a colleague, in American English. Take whatever space you need.
reasoning: |-
  Okay, let me approach this systematically. The user is a retired evolutionary biologist running a philosophy discussion group for non-specialists, facing recurring challenges with "scientific debunking" of moral beliefs. They need a practical decision procedure to unpack these claims during sessions.

  First, I need to understand the core tension: explaining the origin of a belief doesn't automatically invalidate its truth. This is the genetic fallacy – confusing origins with validity. The challenge is making this abstract point concrete for their group.

  The procedure should have clear steps that:
  - Separate factual origins from normative claims
  - Identify hidden assumptions
  - Show where science stops and philosophy begins
  - Work within time constraints

  For Step 1, we'll ask: "What exactly is being explained?" This forces specificity about the moral belief in question. Many debunking arguments start with vague claims.

  Step 2 needs to expose the hidden premise: "Why would explaining this belief make it untrue?" This reveals the assumption that evolutionary origin implies illusion. The group can then evaluate if this holds.

  Step 3 is crucial: "Is the explanation itself value-neutral?" Here we examine whether the scientific account smuggles in moral assumptions. This often trips people up.

  Step 4 asks: "What would change if we didn't have this belief?" This tests if the moral concern persists beyond the proposed mechanism.

  Finally, Step 5 directly confronts the "why morality comes out worse than perception" concern. The key distinction is that perception has built-in error-correction while morality requires reasoning.

  Now for the test cases:
  For incest - we'll show that while biology explains the taboo's origin, the moral reasoning about consent etc. stands independently.

  For purity judgments - the procedure should reveal that disgust sensitivity may shape but doesn't determine moral validity.

  For factory farming - this will demonstrate that dismissing animal suffering because empathy is evolved commits the genetic fallacy. The moral question remains open.

  The perception analogy is tricky but important. The procedure must show that while both are shaped by evolution, perceptual beliefs have external verification methods that moral claims lack - not that one is "more real."

  Throughout, language must stay jargon-free. No "non-naturalism" or "epistemology" - just plain terms like "where beliefs come from" and "checking against reality." The goal is a tool they can actually use, not a philosophical treatise.
answer: |-
  Here’s a decision procedure you can run at the whiteboard, structured as a sequence of five questions. I’ll write it as continuous prose, then apply it to your three cases (incest, purity judgments, factory farming), and finally address the "hardest case" about evolution debunking itself. The key is to treat this as a collaborative investigation, not a debate. At each step, the group must agree on a "yes" or "no" answer before moving on. If they can’t agree within 2–3 minutes, note the disagreement and move forward—this flags where the philosophical tension lies.

  ---

  ### **The Decision Procedure: Five Questions to Test "Science Explains Morality, Therefore Debunks It" Claims**

  **Step 1: What’s the belief being explained?**  
  *Ask:* "What specific moral belief is science claiming to explain? Write it plainly on the board."  
  *Rule of thumb:* The answer must be a concrete moral statement (e.g., "Incest is wrong," not "People disapprove of incest"). If it’s vague, rephrase it until it’s a claim about what *ought* or *ought not* to be done.  
  *Why this step?* Scientists often describe behavior (e.g., "humans avoid incest"), but the debunking move requires a *moral* belief. Clarify this gap upfront.

  **Step 2: What’s the scientific explanation?**  
  *Ask:* "According to the science, where does this belief come from? Summarize in one sentence."  
  *Rule of thumb:* The explanation must cite a causal mechanism (e.g., "Natural selection favored inbreeding avoidance, which shaped emotional disgust toward incest"). If it’s just correlational (e.g., "brain area X lights up"), it’s insufficient for debunking—it only describes *how* the belief manifests, not *why* it exists.  
  *Why this step?* Forces the group to articulate the science clearly. Most "debunking" claims rely on oversimplified pop-sci narratives.

  **Step 3: Does the explanation *replace* the moral belief?**  
  *Ask:* "If we accept this explanation, does it show that the belief is *only* about the biological mechanism? Or could the belief still point to something else?"  
  *Rule of thumb:* If the scientific explanation fully accounts for *all* reasons people hold the belief (e.g., "We condemn incest *solely* because of inbreeding risks"), answer "Yes—it replaces." If people might have other reasons (e.g., "Incest violates consent or family trust"), answer "No—not replaced."  
  *Why this step?* This is where science often overreaches. Explaining *one* source of a belief doesn’t prove it has *no other basis*. For example, learning that disgust tracks pathogens doesn’t prove that "purity" is *only* about germs.

  **Step 4: Does the science assume a hidden value judgment?**  
  *Ask:* "Does the scientific explanation quietly rely on a moral claim itself? For instance, does it treat survival, health, or efficiency as inherently ‘good’?"  
  *Rule of thumb:* If the science uses words like "adaptive," "functional," or "beneficial" to describe the origin of the belief (e.g., "Empathy evolved because it *helps* raise offspring"), answer "Yes—hidden values." If it’s purely descriptive (e.g., "Empathy correlates with oxytocin release"), answer "No."  
  *Why this step?* Scientists often smuggle in values by treating evolutionary success as "good." But evolution doesn’t care about morality—it favors whatever works. This step flags when "debunking" uses circular logic (e.g., "Caring about animals is *just* an adaptation" assumes adaptations lack moral weight).

  **Step 5: Could the belief be true *even if* the explanation is right?**  
  *Ask:* "If the scientific story is 100% correct, does that *force* us to abandon the belief? Or could the belief still be valid for independent reasons?"  
  *Rule of thumb:* If the belief could be justified without the biological mechanism (e.g., "Factory farming causes suffering, and suffering is bad—regardless of why we evolved to care"), answer "Yes—could still be true." If rejecting the belief leads to absurdity (e.g., "Should we ignore *all* evolved instincts, like avoiding poison?"), answer "No—not forced to abandon."  
  *Why this step?* This separates *origins* from *validity*. It’s the core philosophical move: explaining *why* you believe something doesn’t automatically show it’s *false*. At this point, the question becomes explicitly about values. Science can’t answer whether suffering *should* matter—only whether it *does* matter to us evolutionarily.

  ---

  ### **Where the Procedure Misfires**  
  - **It’s not mechanical.** If the group deadlocks at Step 3 or 5, that’s a philosophical disagreement (e.g., "Is justice *only* about cooperation?"). That’s okay—mark it as unresolved.  
  - **Beware false equivalences.** Not all beliefs are equal. The procedure tests logic, not truth.  
  - **Science stops at Step 4.** Steps 1–3 are about facts; Steps 4–5 are about values. If someone insists science settles Step 5, ask: "What experiment could *prove* that suffering isn’t really bad?"  

  ---

  ### **Running the Procedure on Your Three Cases**  

  **Case 1: Incest Condemnation**  
  - **Step 1:** Belief: "Incest is morally wrong."  
  - **Step 2:** Explanation: "Natural selection favored inbreeding avoidance; this shaped disgust, which we now moralize."  
  - **Step 3:** Replaced? **No.** People condemn incest for reasons beyond biology (e.g., power imbalances, consent violations). The belief isn’t *only* about genetics.  
  - **Step 4:** Hidden values? **Yes.** The explanation assumes "avoiding mutations" is inherently good. But not all genetic risks are moral wrongs (e.g., should we condemn carriers of genetic diseases marrying?).  
  - **Step 5:** Could still be true? **Yes.** Even if disgust evolved for inbreeding avoidance, incest might *also* be wrong for ethical reasons (e.g., exploitation).  
  *Conclusion:* **Not debunked.** The science explains the origin but doesn’t invalidate the moral rule.  

  **Case 2: Purity Judgments (e.g., food taboos)**  
  - **Step 1:** Belief: "Certain acts (e.g., eating pork) are impure/unclean."  
  - **Step 2:** Explanation: "Disgust evolved to avoid pathogens; we moralize ‘purity’ to enforce hygiene."  
  - **Step 3:** Replaced? **Partly.** For simple taboos (e.g., "don’t eat rotten meat"), yes—it’s likely *only* about health. But for symbolic purity (e.g., "sinful" acts with no disease link), no.  
  - **Step 4:** Hidden values? **Yes.** Treating hygiene as "good" assumes health is a moral priority. But health isn’t always moral (e.g., is a sick person "impure"?).  
  - **Step 5:** Could still be true? **No for literal cases, yes for symbolic.** If "purity" just means "germ-free," science replaces it. But if it means "sacred" (e.g., in religion), that’s a separate claim.  
  *Conclusion:* **Debunked when purity = hygiene, not debunked when symbolic.** Shows the procedure forces nuance.  

  **Case 3: Factory Farming is Wrong**  
  - **Step 1:** Belief: "Factory farming is wrong because it causes animal suffering."  
  - **Step 2:** Explanation: "We care about suffering only because empathy helped with childcare; this empathy extends to animals via evolutionary spillover."  
  - **Step 3:** Replaced? **No.** The belief isn’t *about* empathy—it’s about suffering. Even without empathy, suffering could still matter.  
  - **Step 4:** Hidden values? **Yes.** The explanation assumes that evolved traits (like empathy) are "merely" biological, implying they lack moral force. But why assume that?  
  - **Step 5:** Could still be true? **Yes.** Science explains *why we notice* suffering but doesn’t address *whether it’s bad*. If pain is intrinsically bad, factory farming is wrong regardless of why we evolved to care.  
  *Conclusion:* **Not debunked.** The moral claim stands or falls on whether suffering matters—a question science can’t settle.  

  ---

  ### **The Hardest Case: "Does Evolution Debunk Itself?"**  
  *A member argues: "If evolution debunks morality because it’s ‘just adaptive,’ then it also debunks science itself (e.g., our belief in evolution), since our brains evolved for survival, not truth!"*  

  Run the procedure:  
  - **Step 1:** Belief: "Evolutionary theory is true."  
  - **Step 2:** Explanation: "Our cognitive faculties evolved for fitness, not truth."  
  - **Step 3:** Replaced? **No.** Science relies on tools (logic, evidence, peer review) that correct for biases. We don’t accept evolution *just* because we evolved to think it—we test it.  
  - **Step 4:** Hidden values? **Yes.** The argument assumes "truth" must be *unrelated* to survival to count. But true beliefs often *enhance* survival (e.g., "Water is poisonous" is true *and* adaptive).  
  - **Step 5:** Could still be true? **Yes.** We validate science through repeated observation and prediction. If evolution were false, evidence would eventually show it.  

  **Why morality comes out "worse"?**  
  Perception and science have built-in error-correction (e.g., microscopes, math). Morality lacks this—we can’t "test" if suffering *should* matter. But that doesn’t make morality an "illusion"; it just means we justify it through reasoning, not data. The procedure shows that while science can explain both, only science can *verify* itself. Morality requires a different kind of conversation.

  ---

  ### **How to Run This in Your Group**  
  1. **Prep:** Read the news story aloud. Write the moral belief on the board.  
  2. **Work the steps:** Ask each question in order. Let the group discuss briefly (2–3 min per step), then vote or agree on an answer.  
  3. **Stick to time:** If stuck, note the disagreement and move on. Do no more than two claims per session.  
  4. **Embrace discomfort:** On factory farming, some may insist science *does* debunk morality. Use Step 5 to pivot to: "So should we ignore suffering if it’s ‘just evolved’? What’s your alternative?" That’s the philosophy kicking in.  

  This won’t resolve deep debates, but it will expose where science ends and values begin—exactly as your group needs. Feel free to adapt it; you’re the biologist in the room, after all. If Joyce or Street wander in, offer them coffee and a whiteboard marker.
