  First, I need to unpack the friend's argument carefully. The non-identity problem is central here - Parfit's formulation where choices affecting who exists create moral dilemmas. The user's cousin case is classic: switching meds would've created a different child, so the actual child with joint problems wasn't made worse off relative to her alternatives. The climate extension is what really bothers the user - the implication that we can't wrong future generations by environmental damage.

  The user's rejected floor test attempted to set a minimum welfare standard, but the friend correctly noted this would implausibly condemn parents who knowingly create children with hardships but worthwhile lives. The floor test can't distinguish between the cousin's negligence (which feels wrong) and the young couple's choice (which doesn't).

  I should consider possible lines of attack:
  - Rejecting premise (1): Does wrongdoing really require making someone worse off? That seems intuitive but may not cover all wrongs. The cost is losing a clear harm condition.
  - Rejecting premise (7): Maybe wrongs can exist without a particular victim. This opens doors to impersonal values but feels slippery.
  - Alternative approaches: Impersonal harm frameworks? Collective obligations? Person-affecting restrictions with bite?

  The impersonal harm route seems most promising. If we say actions can be wrong because they create worse states of affairs, even without harming specific individuals, this condemns both the medication negligence and climate inaction while permitting the young couple's choice (since their child's life is still good). The cost is accepting moral judgments that aren't tied to individual welfare impacts - some philosophers dislike this.

  For the cousin specifically: While she may not have wronged her actual daughter, she violated duties to create children under conditions likely to produce good welfare. This explains why her case feels negligent while the young couple's doesn't. The wrong is to the moral order, not a specific person.

  The climate extension then works: Even if future people owe their existence to our choices, creating them in a ravaged world is still wrong because it produces a worse overall outcome. The price is accepting impersonal values - but that may be worth it to preserve the intuition that trashing the planet is morally condemnable.

  The user's nagging question about whether only a "possible child" was wronged gets resolved this way - no specific person was wronged, but the cousin still acted wrongly by creating avoidable suffering. That's philosophically coherent even if emotionally unsatisfying.

  Need to emphasize that while premise (7) is technically correct for personal wrongs, it misses impersonal wrongs. The slide from "didn't wrong this person" to "did nothing wrong" is the critical fallacy. This preserves most intuitions: the young couple does nothing wrong, the cousin and climate actors do, without needing problematic floors or thresholds.
answer: |-
  Your seminar friend's argument is a textbook presentation of Derek Parfit's **Non-Identity Problem**, a notorious challenge in population ethics. I'll break this down step-by-step, propose a solution that preserves your intuitions, and address your specific questions. Here’s my analysis:

  ### Step 1: Diagnosing the Flaw in the Original Argument
  The core flaw is **premise (7)**: *"Nothing is wrong unless it wrongs someone."* While intuitive, this premise collapses under identity-affecting choices. By rejecting (7), we can:
  - **Preserve (1)-(6)** as logically sound *for personal wrongs* (i.e., wrongs *to specific individuals*),
  - **Deny (6) and (8)** by showing that actions can be *impersonally* wrong even if no specific person is wronged.

  **Why reject (7)?**  
  - **The cost:** We must accept that some wrongs aren't "done *to* someone" but are instead **impersonal wrongs** (e.g., creating avoidable suffering, degrading ecosystems, violating duties to humanity). This clashes with strictly "person-affecting" ethics but avoids absurd conclusions like (6).
  - **What it saves:** Your intuition that the cousin's negligence and climate inaction *are* wrong, without condemning parents who create hard-but-worthwhile lives.

  ### Step 2: Is Your Friend's "Proves Too Much" Objection Fair?
  **Yes, but only against your *initial* floor test.** His objection successfully shows that a rigid "decent minimum" standard would:
  - Imply that *any* suboptimal life (e.g., chronic pain, poverty) is wrongfully created—even when life is clearly worth living.
  - Fail to distinguish between **avoidable harm** (your cousin’s case) and **unavoidable hardship** (the young couple’s case).

  **However, this doesn’t doom all alternatives to (1).** We can refine your intuition without a fixed "floor."

  ### Step 3: A Better Solution: **Impersonal Harm + Avoidability**
  Reject (7) and supplement (1) with a two-pronged framework:  
  **I. Personal Wrongs:** Require making a *specific person* worse off (premise 1 holds here).  
  **II. Impersonal Wrongs:** Arise when an action:  
  - (a) **Creates a foreseeable, avoidable state of suffering** (or deprivation),  
  - (b) **Without compensating benefits that justify it**,  
  - (c) **And could have produced a better outcome at no comparable cost.**  

  **Applied to your cases:**  
  | Case                | Personal Wrong? | Impersonal Wrong? | Why |  
  |---------------------|-----------------|-------------------|-----|  
  | **Your cousin**     | No (per 1-5)   | **Yes**          | She *avoidably* created a child with preventable suffering. The alternative (switching meds) would have created a *different* child with less suffering at no moral cost. |  
  | **Climate inaction**| No (per 6)     | **Yes**          | We *avoidably* create future people in a deprived world. Switching to sustainable policies would create *different* people with better lives at feasible cost. |  
  | **Young couple**    | No              | **No**           | The child's hardship is *unavoidable* for *any* child they could have. No better alternative existed for them. |  

  **What this bites:**  
  - **The cost:** We must accept that morality isn't solely about "harming individuals." Some wrongs are about **failing to minimize suffering** or **creating worse states of affairs**. This is *impersonal* but ethically robust.  
  - **The payoff:** It condemns your cousin and climate actors *without* implying the young couple acted wrongly. Avoidability is key: your cousin could have easily prevented harm; the couple could not.  

  ### Addressing Your Nagging Question
  **Did your cousin wrong *anyone*?**  
  - **Not a specific person:** She didn't wrong her actual daughter (since the daughter isn't worse off), nor a "possible child" (nonexistent entities can't be wronged).  
  - **But she committed an impersonal wrong:** She violated a **duty to minimize avoidable suffering in future persons**, regardless of their identity. This duty binds *her actions*, not specific victims.  

  **Why this isn't empty:** It grounds reproach in her negligence (ignoring the doctor’s advice when alternatives existed) and the concrete harm that resulted.

  ### Why This Works Better Than Your Floor Test
  - **Avoids "proving too much":** No fixed "minimum" is needed. We judge actions by whether they *could have reasonably produced less suffering*.  
  - **Handles the young couple:** Their child’s suffering isn’t "avoidable" in the relevant sense—no alternative action would create a child without it.  
  - **Fits intuitions:** Your cousin’s case feels negligent because she *controlled the risk*; the young couple’s doesn’t because they didn’t.  

  ### Final Defense Against "Insufferable" Conclusions
  Your friend’s argument (6) is only "impeccable" if we accept (7). Reject (7), and we get:  
  - *"The people in 2150 weren't personally wronged by our climate choices (since they owe their existence to them), but we still acted wrongly by creating a foreseeably worse world when a better one was possible."*  

  **Yes, this pays a price:** We must accept impersonal duties. But the alternative—denying that creating avoidable suffering is wrong—is far more costly. Philosophers like Parfit, Henry Sidgwick, and John Broome endorse this trade-off. Your intuition that (6) is monstrous isn’t misguided; it’s a signal that person-affecting morality is incomplete.

  **In summary:**  
  - **Reject (7)** to allow impersonal wrongs.  
  - **Keep (1)-(5)** for personal wrongs.  
  - **Use avoidable suffering + comparable alternatives** to condemn your cousin/climate without condemning the young couple.  
  - **Your cousin acted wrongly**—not toward a person, but by negligently creating conditions of avoidable harm.  

  This gives you the tools to refute your friend while preserving ethical nuance. If he insists on strict person-affecting principles, ask him why we shouldn’t dump nuclear waste in aquifers—after all, future people will adapt, and their lives will still be worth living!
