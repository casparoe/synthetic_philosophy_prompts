  First, unpacking their core worry: they fear labs are blind to "incommensurable ontologies"—model knowledge that can't be expressed in human terms. Like if an AI understands quantum gravity in a way no human does, but our tests only ask about Newtonian physics. Scary thought. 

  The user’s questions cluster into three layers: 
  - **Presuppositions**: What theories of mind/knowledge justify current methods? 
  - **Tension**: How can behavior-focused evals coexist with interpretability’s inner-state focus? 
  - **Alternatives**: If we took inaccessible knowledge seriously, what could we do? 

  For presuppositions, I see three candidates: 
