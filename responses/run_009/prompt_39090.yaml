  2. **Behaviorism** (only outputs matter). But then why bother with interpretability at all? Labs clearly care about internals. 
  3. **Training-pressure determinism** (human labels force human structure). More plausible, but unproven at scale. 

  Ah, and the tension between prongs is real. Behavior evals say "ignore the black box," while interpretability says "open it!" Maybe labs are hedging bets? Or seeing mech interp as a tool to *extend* behavioral coverage? Like using fMRI to predict behavior we can’t trigger with stimuli. 

  For alternatives... tough. If we can’t measure or describe the "residue," how do we test for it? The user’s right that unfalsifiable fears paralyze action. But perhaps labs *could* look for anomalies—like when models ace all known tests but show internal activation patterns that don’t map to *anything* human. That’d be a red flag. 

  ...Wait, the user’s last point is brutal: if no evidence could ever reveal the hidden threat, is ignoring it reasonable? Philosophers might say yes; engineers can’t work with ghosts. But given existential stakes, maybe we need "uncertainty monitors"—ways to detect when models *might* be operating outside our ontology. Like tracking prediction entropy on edge cases. 

