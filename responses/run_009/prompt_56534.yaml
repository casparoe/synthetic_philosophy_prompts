  I should consider which desiderata conflict. For example, explanatory depth might clash with ontological innocence—physicalists might reject non-physical properties. Also, wanting a single property for aggregation could conflict with heterogeneity, leading to disjunctions. 

  Popular theories have flaws. Hedonic tone (a qualitative feel) struggles with heterogeneity. Attitudinal theories (like Feldman) handle diversity but may not explain unity. Family resemblance avoids a common essence but fails for aggregation. 

  I'll list desiderata with cases: essential unity for aggregation, heterogeneity accommodation, motivation link without circularity, truth-independence, pain/pleasure distinction, masochism compatibility, applicability to anticipation. Then note conflicts, like unity vs. heterogeneity or depth vs. physicalism. 

  The user might also need this for academic writing, so clarity and structure are key. They might be a philosopher or grad student, so jargon is okay but explanations necessary. Their deeper need is a robust framework to critique existing theories and propose their own, ensuring it meets utilitarian demands without the pitfalls they've identified.
answer: |-
  Here’s a structured breakdown of desiderata for an adequate theory of pleasure, designed to resolve the heterogeneity problem while enabling utilitarian aggregation. Each includes a case/consideration and negotiability status. Key conflicts and disqualifiers for existing theories are summarized afterward.

  ---

  ### **Desiderata for a Theory of Pleasure**
  | **Desideratum** | **Case/Consideration** | **Negotiable?** |
  |-----------------|------------------------|-----------------|
  | **1. Essential Unity** | Utilitarian aggregation requires a *single, quantifiable property* shared across all pleasures (e.g., to compare solving a proof vs. a warm bath). A disjunctive list (e.g., "sensory joy OR intellectual satisfaction") fails for cross-comparison. | **NO** (Core for utilitarianism) |
  | **2. Accommodates Heterogeneity** | Must explain why phenomenally diverse states (e.g., **sensory** warmth, **intellectual** proof-solving, **attitudinal** schadenfreude) all count as "pleasure" without brute-force listing. | **NO** (Addresses the core problem) |
  | **3. Motivation Link (Non-Circular)** | Pleasures typically motivate continuation (*warm bath*), but the theory can’t *define* pleasure as "what we’re motivated to pursue" (e.g., circular for utilitarianism: "maximize what we want to maximize"). | **NO** (Circularity sabotages ethics) |
  | **4. Truth-Independence** | Pleasure can arise from **false beliefs** (e.g., *malicious glee at rival’s failure*—even if they succeeded; *joy from placebo*). Truth-conditional accounts fail. | **NO** (Empirical observation) |
  | **5. Distinct from Absence of Pain** | Must distinguish *positive pleasure* (e.g., *savoring coffee*) from *mere relief* (ending a headache). Accounts conflating them ignore asymmetries (e.g., we seek pleasure beyond pain avoidance). | **Mildly** (Some accounts merge them, but at cost) |
  | **6. Explains Masochism** | Must reconcile pleasure with intentional pain-seeking (e.g., *spicy food, BDSM*). Cannot reduce pleasure to "sensory positivity" or exclude complex states. | **NO** (Critical edge case) |
  | **7. Anticipatory Pleasure** | Must cover *pleasure in anticipation* (e.g., *excitement for vacation*), which lacks current sensory input but feels pleasurable. | **YES** (Could be derived or non-basic) |
  | **8. Ontological Innocence** | Should avoid metaphysically extravagant properties (e.g., non-natural qualia) to satisfy physicalism/naturalism. | **YES** (But constrains options) |
  | **9. Explanatory Depth** | Must *explain* why diverse states are pleasurable (e.g., neural, functional, or structural commonality), not just describe. | **NO** (But depth type negotiable) |
  | **10. No Collapse into Disjunction** | Cannot be a "family resemblance" (Wittgenstein) or disjunctive list (Butler/Moore’s complaint: "pleasure is X or Y or Z" is trivial). | **NO** (Defeats unification) |

  ---

  ### **Key Conflicts Between Desiderata**
  1. **Unity vs. Heterogeneity** (1 vs. 2):  
     A single property (e.g., hedonic tone) struggles with diversity; a pluralistic view (e.g., attitudinal + sensory) threatens unity for aggregation.  
     *Resolution?* Need a *structural* or *functional* unity (e.g., common computational role).  

  2. **Explanatory Depth vs. Ontological Innocence** (9 vs. 8):  
     Deep explanations (e.g., irreducible qualia) risk non-naturalism; physicalist accounts (e.g., dopamine release) may lack phenomenological coverage.  

  3. **Motivation Link vs. Circularity** (3):  
     Desire-based theories (e.g., "pleasure = object of desire") make utilitarianism circular (*"good = what is desired = good"*).  

  ---

  ### **Which Requirement Knocks Out Popular Theories?**  
  **Desideratum #1 (Essential Unity)** is the chief assassin:  
  - **Hedonic Tone Theories** (e.g., Crisp, Sidgwick): Fail heterogeneity (#2)—no unitary "feeling" spans schadenfreude and warmth.  
  - **Attitudinal Theories** (Feldman): Handle heterogeneity but struggle with unity (#1)—is "taking-attitude" the *same* property in coffee-smell and malice? Aggregation unclear.  
  - **Family Resemblance/Disjunctive Accounts**: Violate #1 and #10—no common property for comparison.  
  - **Desire-Based Theories** (e.g., Heathwood): Violate #3 (circularity for utilitarianism).  

  **The winner must unify wildly diverse states under one quantifiable property *without* circularity, disjunction, or phenomenological implausibility.**  

  ---

  ### **Purpose-Driven Constraints**  
  For utilitarian aggregation, the theory **must**:  
  - Provide a *gradable, common currency* (satisfying #1).  
  - Avoid definitions that make "maximize pleasure" tautological (#3).  
  - Ground in observable/measurable facts (#8) *or* offer a framework for interpersonal comparison.  

  *Example failure*: Defining pleasure as "whatever increases welfare" collapses utilitarianism into "maximize welfare because welfare = pleasure = welfare."  

  ---

  Let me know if you want to drill into specific conflicts or theory carcasses. This spec sets brutal but necessary hurdles—good luck!
