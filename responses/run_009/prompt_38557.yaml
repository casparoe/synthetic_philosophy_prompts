answer: |-
  ### Arrow's Theorem in Engineering Terms

  **Input:** A list of `n` ballots, each a strict total order over `≥3` alternatives (transitive, antisymmetric, total comparators).  
  **Output:** A strict total order (same properties) aggregating the ballots.  
  **Constraints:**  
  1. **Unanimity:** If all ballots rank A > B, output must rank A > B.  
  2. **Non-Dictatorship:** No single ballot index `i` where `output = input[i]` for all inputs.  
  3. **IIA (Independence of Irrelevant Alternatives):** For any pair (A, B), the output order (A > B or B > A) depends *only* on the individual (A, B) comparisons across ballots, ignoring all other alternatives.  

  **Arrow's Claim:** No function satisfies all three constraints for all inputs when `alternatives ≥ 3`.  

  ---

  ### Hunch Verdicts  
  1. **Condorcet Hunch (`right_but_incomplete`)**  
     - **Why:** Condorcet cycles *are* instances of nontransitive majority comparators (e.g., A>B, B>C, C>A pairwise). This violates transitivity, making the output non-total.  
     - **Incompleteness:** Arrow shows the problem is deeper: *any* IIA-compliant aggregator avoiding cycles (via transitivity) *must* be dictatorial. It’s not just about majority vote; it’s a fundamental constraint on *all* pairwise-based systems.  

  2. **IIA Hunch (`right`)**  
     - **Why:** IIA *is* equivalent to "aggregator uses only pairwise comparisons." Like a comparison sort, it forbids inspecting full ballots or cross-alternative dependencies.  
     - **Corollary:** Any comparison-based merge (using only pairwise queries) satisfies IIA by construction. But Arrow proves such merges *must* violate transitivity or unanimity unless dictatorial.  

  **What Would Change My Mind:**  
  - For Condorcet: A non-dictatorial IIA aggregator that outputs total orders *even when cycles exist* would disprove. None exists.  
  - For IIA: If IIA allowed non-pairwise data (e.g., "A is ranked 3rd in ballot 1"), but it explicitly forbids this.  

  ---

  ### Residue Report  
  **Translated Cleanly:**  
  - Ballots/Output ↔ Strict total orders (comparators).  
  - Condorcet cycles ↔ Nontransitive comparators (garbage-in-garbage-out).  
  - IIA ↔ Pairwise-only dependence (like comparison-sort primitives).  
  - Unanimity ↔ Baseline consensus requirement.  

  **Translated with Distortion:**  
  - **Non-Dictatorship:** Not just "output is one input." It forbids *any fixed voter* dominating *all* outputs. Programmers rarely demand this for merges (e.g., priority queues may favor one input). Distortion arises because fairness is social, not algorithmic.  
  - **Transitivity Requirement:** Implicit in your sort analogy, but Arrow treats it as non-negotiable. In practice, programmers sometimes accept partial orders.  

  **Untranslatable:**  
  - **Universal Domain:** Arrow requires the aggregator to handle *every possible permutation* of voter preferences. Engineers optimize for common cases (e.g., single-peaked preferences avoid cycles).  
  - **No Utilities:** Your framing assumes ordinal rankings (comparators). Arrow excludes cardinal utilities (e.g., scores), which change the game (see: Gibbard-Satterthwaite).  

  ---

  ### Residue Blame  
  **Gap in Vocabulary vs. Overblown Theorem?**  
  - **Gap:** Your vocabulary assumes deterministic, comparison-based merges. Arrow’s conclusion is substantive: *no* IIA-compliant merge (even nondeterministic or non-comparison-based) can be both transitive and non-dictatorial.  
  - **Overblown?** Philosophers sometimes oversell "no fair system." The theorem doesn’t forbid *useful* systems (e.g., ranked-choice voting violates IIA but works in practice). Still, it exposes a fundamental tradeoff: IIA+transitivity → dictatorship.  

  ---

