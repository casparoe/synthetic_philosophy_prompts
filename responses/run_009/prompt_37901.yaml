  Hmm, I remember that Simon Blackburn and Allan Gibbard are key figures in expressivism. They developed responses like quasi-realism. If the friend says expressivism is dead, but these philosophers actively worked on it, that's a red flag. The user also mentioned Blackburn and Gibbard, so they might have some awareness that the friend's claim is off.

  First, I need to break down the friend's summary point by point. The booing analogy is part of expressivism, but it's oversimplified. Early expressivists like Ayer used such analogies, but Blackburn and Gibbard moved beyond that. The disagreement issue she mentions is actually the "disagreement problem," which is related but distinct from Frege-Geach. Frege-Geach is about embedding moral terms in different contexts, like conditionals or negations. For example, if "lying is wrong" is just booing, what does "if lying is wrong, then getting your brother to lie is also wrong" mean? The attitude theory struggles here because the sentence isn't directly expressing an attitude but being used in a logical structure.

  The user's confusion about whether this is the actual Frege-Geach problem is valid. The friend conflated the disagreement problem with Frege-Geach. Frege-Geach is harder because it challenges the expressivist to explain logical consistency and inferences, which is crucial for any moral theory that wants to be taken seriously in rational discourse.

  Then there's the claim that expressivism is finished. That's clearly wrong since Blackburn's "Spreading the Word" and Gibbard's "Wise Choices, Apt Feelings" directly address Frege-Geach. Quasi-realism attempts to show how moral language can mimic realism without committing to objective facts. So, expressivism isn't dead; it evolved.

  The user also asked if the "finished off" conclusion follows from the summary. Since the summary misstates the problem and ignores developments, the conclusion doesn't hold. The accurate parts (like the booing analogy being part of expressivism) don't lead to expressivism being obsolete because responses exist.

  I should make sure to clarify each part of the friend's claims: the expressivist view, the problem described, whether it's Frege-Geach, and the status of expressivism. Highlighting Blackburn and Gibbard's work is key to showing expressivism's resilience. Also, note that Frege-Geach is about compositionality and logic, not just disagreement.

  Finally, the verdict: the summary has some correct elements but is largely unfair due to conflations and outdated claims. So "fair in part" fits best. The user needs to know where the friend went wrong, especially mixing up the disagreement problem with Frege-Geach and overlooking contemporary expressivist responses.
answer: |-
  Your skepticism is well-founded—your friend's summary contains significant misunderstandings and overstatements. Below is a point-by-point breakdown, clarifying each claim against standard expressivist positions and scholarly consensus. Key issues include conflating the "disagreement problem" with the Frege-Geach problem, misrepresenting the latter, and incorrectly declaring expressivism obsolete.

  ### Breakdown of Claims:
  1.  **"Expressivism is the view that moral sentences don't describe facts but instead express attitudes..."**
      *   **Verdict: Fair (with minor caveats).**  
          This is a standard definition. Expressivists like Ayer, Stevenson, Blackburn, and Gibbard reject moral realism, holding that moral claims express non-cognitive states (e.g., disapproval, commitments) rather than describing mind-independent facts. The "booing" analogy is simplistic but historically used (e.g., by Ayer). Modern expressivists like Blackburn ("quasi-realism") refine this to explain how moral language *functions as if* it describes facts.

  2.  **"...saying that lying is wrong is basically a sophisticated way of booing lying."**
      *   **Verdict: Overly simplistic but partially fair.**  
          Early emotivists (e.g., Ayer) used "boo/hooray" analogies, but contemporary expressivists (Blackburn, Gibbard) reject this as reductive. They argue moral language expresses complex, reason-responsive attitudes (e.g., plans, commitments) governed by norms of consistency—far more "sophisticated" than mere cheers/boos.

  3.  **"The Frege–Geach problem is that this can't make sense of moral disagreement..."**
      *   **Verdict: Conflated and unfair.**  
          This describes the **disagreement problem** (an older objection), *not* the Frege-Geach problem. The disagreement problem asks how expressivists can account for genuine conflict when attitudes clash. Frege-Geach is distinct and harder: it targets **logical embedding**. Geach (1960, 1965) argued that expressivism cannot explain how moral sentences retain consistent meaning when embedded in unasserted contexts (e.g., conditionals, negations, questions).  
          *Example:* In "If lying is wrong, then getting your brother to lie is wrong," the antecedent ("lying is wrong") isn't *expressed* as an attitude but functions logically. If "lying is wrong" *just* means "Boo lying!", what does the antecedent contribute to the conditional's truth conditions? Expressivism initially struggled to explain this compositionality.

  4.  **"Peter Geach pointed this out in the 1960s, borrowing a point from Frege..."**
      *   **Verdict: Fair in part.**  
          Geach *did* develop the problem in the 1960s, drawing on Frege's principle of **contextuality** (a word's meaning depends on its role in sentences) and the **invariance of meaning** across asserted/unasserted contexts. However, he applied it to *moral logic*, not primarily to disagreement.

  5.  **"...it's widely agreed that this finished off expressivism — which is why nobody works on it anymore."**
      *   **Verdict: Demonstrably false and unfair.**  
          Frege-Geach was a major challenge, but it *did not* "finish off" expressivism. Blackburn (*Spreading the Word*, 1984; *Essays in Quasi-Realism*, 1993) and Gibbard (*Wise Choices, Apt Feelings*, 1990; *Thinking How to Live*, 2003) developed sophisticated responses (e.g., "norm-expressivism," "plan-laden attitudes") to solve embedding. Contemporary expressivism (now often "hybrid expressivism" or "Ecumenical Expressivism") remains active, with figures like Schroeder, Ridge, and Chrisman publishing extensively. The problem spurred refinement, not abandonment.

  ### Addressing Your Specific Queries:
  1.  **"Is the problem she describes actually the Frege–Geach problem?"**  
      No. She describes the **disagreement problem**. Frege-Geach is about **logical embedding/compositionality**.  
      - *Which is harder?* Frege-Geach is widely considered the more technically severe challenge. Disagreement can be addressed by appealing to conflicting attitudes or plans. Frege-Geach requires explaining how non-descriptive meanings integrate into logical structures—a core test for any linguistic theory.

  2.  **"Does her final sentence follow from anything true earlier?"**  
      No. The "finished off" verdict is unsupported and incorrect. The accurate parts (expressivism's core idea) do not entail its demise. Frege-Geach was a hurdle, but expressivists met it with innovative theories. Her conclusion relies on conflating Frege-Geach with a simpler problem and ignoring decades of active scholarship.

  ### Where the Summary Goes Wrong:
  - **Conflation:** Merges the disagreement problem with Frege-Geach, obscuring the latter's unique force.
  - **Oversimplification:** Reduces expressivism to crude "booing," ignoring its sophisticated evolution.
  - **False Historical Claim:** Declares expressivism obsolete, disregarding its vibrant, post-Geach development.
  - **Smuggled Conclusion:** Assumes that if moral sentences express attitudes, they cannot feature in logic or genuine disagreement—a claim modern expressivists explicitly reject.

  **Verdict: Unfair**  
  While the summary captures expressivism's core intuition, it misidentifies Frege-Geach, ignores major responses, and falsely declares the view defunct. Your instinct about Blackburn and Gibbard was correct—they are central to expressivism's post-1960s revival and directly engaged Frege-Geach.
