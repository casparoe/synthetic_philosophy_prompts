  Based on Maya's track record and the rules you've identified, here's a clear breakdown of how she'll likely respond to your book club dilemma and the stalking poet case, along with which rule best explains her consistency and where the others diverge.

  ### 1. **Prediction for the Living Novelist's Trilogy**
     - **Her Verdict on Artistic Merit**: Maya will say the **trilogy is still good art**.  
       *Why?* The books are "morally fine—kind, even," with no intrinsic flaws. This mirrors her stance on Wagner (antisemitism irrelevant to the Ring's quality) and the sitcom (show remains good art despite the abusive star).
     - **Her Action on Finishing It**: She **won't read it, stream it, or financially support it**.  
       *Why?* Her sitcom precedent is identical: she separates the work's quality from her ethical engagement. She'll likely recommend buying used copies or library access to avoid funding the author.

  ### 2. **Prediction for the Stalking Poet Case**
     - **Her Verdict**: Maya will say the **poems are now bad art**.  
       *Why?* The meaning of the work has fundamentally changed due to context ("the tenderness reads as creepy"). This mirrors her rejection of *Triumph of the Will* (formally stunning but crafted to serve Nazi propaganda) and the roast special (comedy designed to humiliate). The *words* are unchanged, but their *interpretation* is now inextricably tied to immorality.

  ---

  ### 3. **Which Rule Best Explains Her Track Record?**
  The **"Craft in Service of an Immoral Aim" rule** (your Rule 3) **best explains all her judgments**. Here's why it fits perfectly:
  - **Triumph of the Will**: Rejected because its formal brilliance *serves* Nazi propaganda (immoral aim).
  - **Roast Special**: Rejected because the comedy's *craft* (laughter) is built on humiliation (immoral aim).
  - **Stalking Poet**: Poems become "bad art" because the *craft* (tenderness) now *serves* the context of stalking.
  - **Wagner/Caravaggio/Sitcom/Landscape Painter**: Accepted because the art's craft *isn't serving* the artist's immorality. Wagner's antisemitism isn't in the operas; Caravaggio's murder doesn't alter the paintings; the sitcom isn't *about* abusing crews.
  - **Novelist Trilogy**: Still "good art" because the craft serves kindness, not the alleged misconduct.

  **Why the other rules DON'T fully fit**:
  - **Rule 1 (Only flaws inside the work matter)**: Fails to explain why she rejects *Triumph of the Will* (no "flaws" in its craft) and the roast special (humiliation *is* the craft).  
  - **Rule 2 (Biography matters only through who profits)**: Fails to explain why she rejects *Triumph of the Will* or the roast special (no profit issue there). It only explains her *engagement* (e.g., not streaming the sitcom), not her artistic verdicts.  
  - **Rule 4 (Authorial facts change what the work says)**: Explains the stalking poet case but fails with Wagner/Caravaggio—knowing their biographies doesn't change what the Ring Cycle or *David with the Head of Goliath* "says."

  ---

  ### 4. **A Hard Case to Split the Rules Apart**
  To cleanly distinguish Rule 3 ("craft serving immoral aim") from Rule 4 ("context changes meaning"), consider this hypothetical:

  **The Case**: A critically acclaimed, gorgeously animated children's film. After release, it's revealed that the film's entire production was secretly funded by a cult that used it to recruit vulnerable families. The film itself has no overt cult messaging—just universal themes of community and belonging.  
  - **Rule 1 (Inside-work flaws only)**: Says it's *good art* (no technical/moral flaws in the film itself).  
  - **Rule 2 (Who profits)**: Says it's *good art but don't support it* (engaging funds the cult).  
  - **Rule 3 (Craft serving immoral aim)**: Says it's *bad art* because its craft (emotional storytelling) *serves* the cult's recruitment goal.  
  - **Rule 4 (Context changes meaning)**: Says it's *bad art* because the themes of "belonging" now read as grooming.  

  **Why this splits the rules**:  
  - Rule 3 and Rule 4 *both* reject the film here, but for different reasons. Rule 3 cares about the creator's *intent* (craft designed to serve immorality), while Rule 4 cares about the audience's *reinterpretation* (knowing the context alters perception).  
  - **Maya's Likely Verdict**: She'd reject it under **Rule 3** (craft serving immorality), matching her *Triumph of the Will* stance. Her track record prioritizes the *creator's purpose* over audience reinterpretation (e.g., Caravaggio's art isn't reinterpreted as "pro-murder" despite his crime).

  ---

  ### Key Takeaways:
  - **Maya's Core Principle**: Art is "good" if its craft isn't *instrumentalized for harm*, regardless of the artist's sins. It's "bad" if its brilliance *enables* immorality (e.g., propaganda, humiliation, grooming).  
  - **For Your Book Club**: She’ll endorse the trilogy's artistic merit but boycott financial support—so suggest library books or secondhand copies.  
  - **For the Poet**: She’ll reject the poems as now "bad art" due to their repurposed meaning (aligned with Rule 3, as the craft "serves" stalking).  
  - **Consistency Check**: If Maya *ever* endorsed art where craft clearly served immorality (like the hypothetical cult film), she’d violate her own pattern. Her "vibes" are rule-bound—just centered on the *function* of the art, not its origins or your wallet.

  This should let you predict her response—and if she surprises you, you’ve got the framework to call her out!
