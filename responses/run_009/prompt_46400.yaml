  Hmm, the user is trying to figure out their friend Maya's consistent approach to separating art from the artist. They've observed Maya's judgments across various cases: Wagner's antisemitism doesn't affect her view of his operas, Caravaggio's murder conviction doesn't diminish his paintings, she rejects Triumph of the Will despite its technical brilliance, condemns a humiliating roast special, separates a sitcom's quality from its abusive star's behavior, and ignores a landscape painter's infidelity. Now with a living novelist facing credible allegations, the user wants to predict Maya's verdict on whether his morally kind trilogy remains "good art" and whether she'd finish reading it.

  The user has identified four possible rules that might explain Maya's pattern: 1) Only flaws within the work matter (biography as noise), 2) Biography only matters regarding financial support (who profits), 3) Craft serving immoral aims disqualifies the work, or 4) Authorial facts change the work's meaning. I need to analyze how each rule applies to the novelist case and the stalking poet case.

  For the novelist trilogy:  
  - Rule 1 would deem it good art (no moral flaws in text)  
  - Rule 2 would call it good art but refuse to engage (to avoid supporting him)  
  - Rule 3 would see no issue (craft not serving immorality)  
  - Rule 4 might reinterpret the kindness as hypocritical  

  Maya's sitcom precedent suggests Rule 2: "good art but won't watch/stream." Her refusal to engage financially aligns perfectly here.  

  For the stalking poet:  
  - Rule 1 ignores biography → still good love poems  
  - Rule 2 might still appreciate them (no one profits) but potentially avoid promotion  
  - Rule 3 could reject them if "tenderness serves stalking"  
  - Rule 4 directly matches the "creepy reinterpretation"  

  Since Maya rejected the roast special (immoral aim) but accepted Wagner/Caravaggio (immoral artist, not aim), Rule 3 seems key when craft serves harm. Rule 4 explains the poet case best.  

  To split the rules cleanly, I'd propose: A brilliant director's final film funded by embezzled pensions. Rule 1 judges only the film's content; Rule 2 avoids funding thieves; Rule 3 rejects art benefiting from harm; Rule 4 might see it as "blood money cinema."  

  Maya's core framework appears to be:  
  1. Artistic merit is intrinsic to the work  
  2. Engagement is ethical (profit/amplification)  
  3. Meaning can shift with context (Rule 4)  
  4. Craft serving immorality fails (Rule 3)  

  For the novelist, she'll likely say "good art, won't finish reading/buying." For the poet, she'll probably say the poems are now bad art due to meaning change. The sitcom and poet cases distinguish Rule 2 from Rule 4.
