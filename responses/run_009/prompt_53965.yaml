prompt: |-
  Question about whether something I've noticed has a name. Apologies in advance if this is a well worn thing that I just don't know the term for.

  I noticed that there are a lot of words where I can be flatly wrong without the word changing what it means for me. I can't tell a jackdaw from a rook, but if I point at a rook and say "jackdaw," I've made a mistake about birds, not revealed that "jackdaw" means something different in my mouth. Same with my grandmother, who says her arthritis has moved into her thigh — everyone treats that as her being wrong about her ailment, not as her having a private word. Her usage gets graded against a standard she doesn't herself possess.

  Fine so far, probably boring. But here's the part that got me thinking. Sometimes the standard that grades the usage doesn't seem to exist anywhere, not even spread out across the community. "Jade" turned out to cover two chemically unrelated minerals, and when that was discovered nobody split the word — we just kept saying jade, and apparently had been successfully referring all along even though the "expert knowledge" fixing the extension was false. And with whales, where the folk theory was that they were fish, I genuinely can't tell whether the community later learned something or whether "fish" quietly changed what it meant, and I suspect the answer differs from the jade case in a way I can't articulate.

  I half remember the Twin Earth stuff from a course years ago, and "division of linguistic labor" sounds like it might be the term for the first batch of examples. But is there a name specifically for the second thing — where the communal fact that's supposed to settle usage is absent, contested, or just wrong, and the word goes on meaning something anyway? If there's no established concept, I'd honestly rather have someone carve it up and tell me where the edges are than get a single label. Like, does the community get to be wrong about jade the way it can't be wrong about gold's atomic number, and what's the difference exactly?
reasoning: |-
  Okay, the user is asking about a linguistic phenomenon where a word's meaning persists even when the community's understanding of the referent is incorrect or incomplete. They mention examples like confusing jackdaws and rooks, jade referring to two minerals, and whales being called fish historically. They recall Putnam's Twin Earth and division of linguistic labor but want to know if there's a term for when the communal knowledge is wrong yet the word still refers correctly.

  First, I need to break down their examples. The jackdaw/rook case is straightforward semantic error: the user points to a rook but calls it a jackdaw. That's a mistake in labeling, not a private language. The grandmother’s arthritis in her thigh is similar—she's misapplying the term based on incorrect belief. Both cases involve individual error, not a shift in word meaning.

  The jade example is key. Nephrite and jadeite are different minerals, but both called jade. The community used "jade" without knowing there were two types. Here, the term succeeded in referring to both, even though the underlying belief was incomplete. The extension (the actual minerals) was fixed by samples, not by a correct scientific definition. So, the word "jade" had a disjunctive extension. That's semantic externalism: reference is determined by the world, not descriptions.

  Whales as fish is more complex. Historically, "fish" included whales because of superficial similarities. When science reclassified whales as mammals, the meaning of "fish" narrowed. But when people said "whales are fish," were they wrong based on their own criteria? The user is confused about whether the community was mistaken or the meaning changed. Putnam's analysis here is that earlier speakers referred to the same natural kinds we do, but their beliefs were inaccurate. So, they were wrong, but the term "fish" still picked out the same category, excluding whales once science corrected the classification.

  The user's deeper question seems to be about how words refer when communal knowledge is flawed. They want a term for when the expertise that's supposed to anchor meaning is absent or incorrect. Terms like semantic externalism and the causal theory of reference cover this. Specifically, the jade case shows reference without a correct essence, while the whale/fish case involves a shift in meaning or correction of belief.

  The user might also be interested in the philosophical implications: how language can be robust despite ignorance. They might need clarity on the difference between cases like jade (disjunctive kind) versus gold (single essence). Also, why can a community be wrong about jade's composition but not about gold's atomic number? It's because jade doesn't have a unified essence; it's two minerals, so the term is ambiguous. Gold has a single essence (atomic number 79), so misidentifying it would be an error.

  I should explain that terms like "partial grounding" or "reference magnetism" might be relevant. The jade example is a case of reference without a unified essence, handled by disjunctive theories. The whale/fish example involves a change in scientific understanding leading to semantic drift or correction. The key difference is whether the underlying kind has a single essence or not.

  The user's unspoken need might be understanding how language functions in the face of collective error, which relates to philosophical debates on meaning and reference. They might benefit from examples clarifying semantic externalism versus description theories, and how Kripke/Putnam's causal theory resolves these issues. Highlighting terms like "semantic deference" or "reference-fixing without essence" could address their query about absent standards.
answer: |-
  You've hit on a profoundly deep and fascinating cluster of issues in philosophy of language and semantics – the gap between linguistic competence, community practice, scientific knowledge, and how reference is fixed. Your intuition is sharp: the "division of linguistic labor" (Hilary Putnam) *is* key to the first set (relying on experts for jackdaws/rooks/arthritis), but the second set involves more nuanced concepts. There isn't *one* universally accepted term for the specific phenomenon you describe ("where the communal fact that's supposed to settle usage is absent, contested, or just wrong, and the word goes on meaning something anyway"), but several highly relevant concepts and debates surround it:

  1.  **Semantic Externalism / The Causal Theory of Reference (Kripke, Putnam):** This is the overarching framework. It argues that the meaning (specifically the *reference*) of many terms (especially natural kind terms like "gold," "water," "tiger," and arguably "jade" and "fish") is determined not *solely* by the descriptions or beliefs in the minds of speakers, but crucially by the actual nature of the things in the world that the term was originally applied to (the initial "baptism") and the causal-historical chain of usage linking current speakers back to that baptism. **This directly addresses your "communal fact... absent" point.** The community doesn't *need* to possess the correct "fact" or theory; reference is fixed by the world itself through the causal chain.

  2.  **Reference without Correct Description / Ignorance and Error:** This is the core of your jade and whale examples. Kripke and Putnam famously argued that a speaker can successfully refer to something even while holding *radically false* beliefs about it. Putnam's Twin Earth thought experiment (where "water" refers to XYZ, not H₂O, despite identical beliefs) exemplifies this. **Applied to your cases:**
      *   **Jade:** The community successfully referred to *both* nephrite and jadeite for centuries using "jade," even though they believed it was one mineral with a single essence. They weren't *wrong* about the *extension* (the set of things the word picked out – both minerals *were* included). They were wrong about the *underlying nature* (that it was a single kind). The term "jade" likely originated via ostension (pointing at samples), not a defining theory. Its reference was fixed by those samples, not by a correct chemical description. The word *didn't* secretly mean "nephrite" all along; it referred to *those green stones used for carving*, which turned out to be two types. **The communal "fact" (single essence) was wrong, but the reference succeeded because it was grounded in samples, not theory.**
      *   **Whale/Fish:** This is trickier and more debated. Putnam argued that pre-scientific speakers using "fish" *intended* to refer to the same natural kind as modern biologists. Their superficial description ("scaly, aquatic, finned, breathes water") *failed* to pick out the true biological kind (as whales don't have gills/scales and are mammals). When science revealed whales' true nature, it *corrected* our understanding of the category "fish." Pre-scientific speakers were *wrong* when they called whales "fish," but they were *trying* (and failing) to refer to the same natural group biologists later delineated more accurately. **The communal "fact" (the descriptive theory defining "fish") was incomplete/wrong, but the *intended* reference (to a biological natural kind) was partially successful yet mistaken in its inclusion of whales.** The meaning of "fish" *shifted* as biological taxonomy refined the category based on evolutionary descent.

  3.  **Partial Grounding / Ambiguous Reference (Specific to Jade):** Jade presents a special case. Unlike "water" or "gold," which have single underlying essences (H₂O, Au), "jade" turned out to refer to a *disjunction* of two distinct kinds (nephrite OR jadeite). Philosophers like Ruth Millikan discuss cases of "partial grounding" or acknowledge that some terms (often artifact terms or terms like "jade") might not have a single hidden essence but refer via a cluster of properties or historical usage. **In this case, the communal standard wasn't entirely "wrong" in a way that broke reference; it was simply *indeterminate* between two possibilities later discovered.** The word successfully referred to both all along, even though speakers falsely assumed a single essence.

  4.  **Semantic Deference vs. Semantic Externalism:** Division of Labor involves *deference* to experts *who know the facts*. Your second phenomenon highlights that **Semantic Externalism works *even when* the experts (or the community) *don't* know the relevant facts yet, or even hold false ones.** The reference is fixed by the external world interacting with usage, not by the correctness of the descriptions.

  **Carving Up the Edges & Differences:**

  *   **Jackdaw/Rook/Arthritis (Individual Error):** Speaker misapplies a term whose extension *is* communally fixed (via division of labor/reference to kinds). Mistake, not meaning shift.
  *   **Jade (Communal Indeterminacy/Disjunctive Kind):** Community successfully refers to a set of samples (nephrite + jadeite) via ostension/historical use. The *belief* in a single essence was false, but the *reference* to both minerals was successful because the term was grounded in the samples themselves, not the mistaken theory. The "standard" was the actual stones used. **The community *can* be wrong about the *essence* of jade because jade lacks a *single* essence.**
  *   **Gold (Communal Error Corrected by Essence):** Community refers to samples of Au. They hold false beliefs (e.g., "yellow metal soluble in aqua regia" – some yellow metals aren't gold, some gold alloys might not dissolve). However, the reference is fixed by the *actual stuff* (Au). When science discovers the atomic number, it reveals the *true essence* that *was* fixing the reference all along (even while beliefs were wrong). **The community *cannot* be fundamentally wrong about gold's atomic number *defining* gold *now*, because that *is* what fixes the reference. They *could* be wrong about specific beliefs *about* gold (e.g., thinking all gold is yellow – white gold exists).**
  *   **Whale/Fish (Meaning Shift / Category Correction):** Community uses "fish" with a folk theory (aquatic animals). This *overextends* to include whales. Science discovers evolutionary taxonomy, revealing whales belong to a different lineage. This leads to a **correction of the category** and a **narrowing of the term "fish"** to exclude whales. Pre-scientific speakers were *wrong* according to the *intended* (but poorly grasped) natural kind reference. This differs from Jade because biology aims for a single, objective (evolutionary) taxonomy, whereas "jade" is a term defined by mineralogical properties *and* cultural use, allowing for a disjunctive reference.

  **In essence:** Your observation highlights the core tenet of Semantic Externalism: **Language hooks onto the world itself, not just our ideas about it.** Words like "jade," "gold," and "whale" can refer successfully even when our communal understanding of *what* they refer to is flawed, incomplete, or even completely wrong, because reference is ultimately anchored in the actual entities and causal history, not just the descriptions in our heads. The "standard" isn't always a fact in our minds; sometimes it's the brute reality of the world interacting with our linguistic practices. While "division of linguistic labor" explains reliance on experts, the robustness of reference *despite* ignorance or error is the hallmark of the **Causal Theory of Reference** and **Semantic Externalism**. The specific case of "jade" working without a unified essence is often discussed as an example of **disjunctive reference** or **partial grounding**.
