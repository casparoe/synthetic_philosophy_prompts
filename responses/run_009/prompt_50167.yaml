prompt: |-
  Two fellow PhD students in my cognitive science program have been arguing for weeks about the extended mind thesis, and as the bystander who got asked to referee, I'd like a point-by-point adjudication of the exchange as it actually happened.

  Some background. After a concussion left Dana with a much shakier short-term memory, she rebuilt her academic life around her phone: every reading annotation, lab meeting note, and appointment lives in it, and alarms prompt her through the day. At a lab meeting she said the phone is now literally part of her mind, not a tool her mind uses.

  Marco objected that constant use doesn't make something part of you: she consults the app the way a pilot consults instruments or a scholar visits a library, and no one ever counted visiting a library as remembering. Dana replied by parity: were the same information stored in her skull and retrieved with the same speed and fluency, no one would hesitate to call it memory, and she can't see why the boundary of the skin should mark a difference that matters. Marco answered that her retrieval isn't fluent in the relevant way: she has to decide to check, she sometimes doubts her own notes, and when she lost the phone for a weekend she didn't lose memories, she lost access to records, whereas a stroke would have taken the memories themselves. Dana's last move was that the checking has become entirely habitual — she endorses the notes unhesitatingly, relies on them the way she once relied on recall, and felt the loss as a kind of amnesia — and that proponents of the thesis have proposed roughly these criteria (reliability, automatic trust, easy access), which she satisfies. Marco closed with a bloat objection: on that standard his glasses, his bicycle, and perhaps the department administrator's filing system all become parts of minds, which suggests the criteria aren't individuating cognition at all, just licensing a rhetorical reclassification of ordinary tool use.

  Please adjudicate the exchange move by move — say who's right at each step and why, where each side concedes too much or too little, and what, if anything, both of them are missing.
reasoning: |-
  Okay, the user wants me to adjudicate an argument between two PhD students about the extended mind thesis. This is a fascinating philosophical debate in cognitive science. 

  First, let me understand the scenario. Dana had a concussion and now relies heavily on her phone for memory functions. She claims her phone has literally become part of her mind. Marco disagrees, arguing it's just a tool. Their exchange has several moves:

  Dana's initial claim is based on functional equivalence - if the information were in her brain, we'd call it memory, so why should skin boundary matter? This is classic Clark and Chalmers argument. 

  Marco counters with lack of fluency - she has to consciously decide to check, sometimes doubts notes, and losing phone didn't erase memories. These are fair points challenging the "automaticity" criterion.

  Dana responds that her usage has become habitual and automatic, meeting the proposed criteria. She even feels phone loss as amnesia. 

  Marco's final "bloat" objection warns that this would make glasses, bikes, etc. part of minds, which seems absurd.

  Hmm... both make strong points. The adjudication needs to be nuanced. Dana is right about functional equivalence in principle, but Marco correctly questions whether she meets all criteria. The bloat objection is valid but addressable - not all tools would qualify. 

  What's missing? Neither considers the "trust" criterion deeply enough. Also, they might be talking past each other on "fluency" - Dana means speed, Marco means cognitive effort. The feeling of loss as amnesia is psychologically significant but philosophically debatable.

  The user (a cognitive science PhD student) probably wants both resolution of this specific debate and tools for analyzing extended mind cases generally. I should provide clear philosophical reasoning while acknowledging real-world implications of Dana's experience.
answer: |-
  Here’s a move-by-move adjudication of the debate, grounded in the extended mind thesis (EMT) and its critiques. I’ll assess strengths, weaknesses, and overlooked nuances at each step. **Key takeaway:** Dana’s position aligns more closely with EMT’s core argument, but Marco’s objections highlight unresolved tensions in the theory—neither "wins" outright, as EMT remains contested in philosophy of mind.

  ---

  ### **Move 1: Dana’s Initial Claim**  
  *"My phone is literally part of my mind."*  
  **Verdict: Dana is conceptually correct (by EMT standards), but overstates "literal" incorporation.**  
  - **Why she’s right:** EMT (Clark & Chalmers, 1998) argues that external resources can *constitutively* extend cognition when they function like biological processes (e.g., quick, reliable access). Dana’s phone acts as her working memory system—integrated, constantly accessed, and necessary for cognitive tasks she’d otherwise perform internally.  
  - **Concession needed:** "Literal" is misleading. EMT claims cognitive processes *depend* on external tools, not that the tools *are* biological tissue. Her "mind" now includes phone-dependent processes.  

  ### **Move 2: Marco’s First Objection**  
  *"Constant use ≠ part of you; it’s like a pilot using instruments."*  
  **Verdict: Marco oversimplifies EMT and misses its criteria.**  
  - **Why he’s wrong:** EMT distinguishes *mere tools* (e.g., a library) from *cognitive extensions* by **functional isomorphism**: if the external resource plays the *same role* as an internal process, it counts as extended cognition. Marco’s "pilot" analogy fails because instrument checks are episodic, while Dana’s phone use is persistent, automatic, and substitutes for biological memory.  
  - **What he concedes too much:** He implies all external aids are "tools," ignoring EMT’s test for functional equivalence.  

  ### **Move 3: Dana’s Parity Argument**  
  *"If this info were in my skull, you’d call it memory. Skin shouldn’t matter."*  
  **Verdict: Dana nails EMT’s core principle.**  
  - **Why she’s right:** EMT’s "parity principle" states: if an external process were done in the head, we’d accept it as cognitive. Dana’s phone meets this—it stores/retrieves information identically to biological memory (speed, reliability, role in decision-making). Skin-boundary fetishism *is* arbitrary under functionalism.  
  - **Overlooked nuance:** Speed/fluency alone aren’t sufficient (next move).  

  ### **Move 4: Marco’s Fluency Objection**  
  *"She decides to check, doubts notes, and losing phone ≠ losing memories."*  
  **Verdict: Marco scores a point—this challenges EMT’s "automatic trust" criterion.**  
  - **Why he’s partially right:** Clark & Chalmers require resources to be **automatically endorsed** and **seamlessly accessible**. If Dana consciously "decides" to check or doubts notes, it suggests the phone isn’t fully integrated. Losing the phone causing "lost access" not "lost memories" implies the phone is a *storage device*, not a constitutive part of cognition.  
  - **What he misses:** Dana’s habitual use may *approach* automaticity (see her next move). His stroke analogy is weak: brain damage destroys *capacity*; losing a tool disrupts *function*. Both impair cognition, just differently.  

  ### **Move 5: Dana’s Habituality Defense**  
  *"Checking is habitual; I trust notes like recall; loss felt like amnesia."*  
  **Verdict: Dana rebuts effectively—her use likely meets EMT criteria.**  
  - **Why she’s strong:** EMT emphasizes **trust, transparency, and reliability**. If Dana’s phone-checking is unconscious (e.g., alarms auto-prompt action), doubts are rare, and she identifies the loss *as amnesia*, it mirrors how biological memory failure feels. Proponents (e.g., Heersmink) argue incorporation deepens with habit.  
  - **Caveat:** Subjective "feeling like amnesia" isn’t proof—it could be psychological dependence, not cognitive extension.  

  ### **Move 6: Marco’s Bloat Objection**  
  *"This makes glasses, bikes, and filing systems 'parts of minds'—reductio ad absurdum."*  
  **Verdict: Marco exposes a real problem, but EMT has replies.**  
  - **Why it’s a valid critique:** Unrestricted EMT *does* risk "cognitive bloat"—glasses extend perception, bikes extend locomotion. If everything counts, "cognition" loses meaning. Marco rightly demands criteria that *individuate* cognition.  
  - **Why it’s resolvable:** EMT defenders (e.g., Clark) limit extensions to resources that:  
    - Are **constantly available** (phone always in pocket ≠ library).  
    - Hold **information crucial for real-time tasks** (phone stores Dana’s *current* thoughts; filing system stores archived data).  
    - Are **automatically trusted/accessed** (glasses become "invisible"; Dana’s phone alarms are reflexive).  
    Bikes and filing systems fail these tests—they’re not *informationally integrated* for cognitive processing.  

  ---

  ### **Overall Adjudication & What’s Missing**  
  - **Dana’s stronger case:** Her phone use closely fits EMT’s criteria (reliability, automaticity, functional parity). Her concussion makes the dependency explicit, but EMT applies to *anyone* using tools this way (e.g., always-reliable notetakers).  
  - **Marco’s valid worries:** His bloat objection forces refinement of EMT. Not all tools extend cognition—only those deeply integrated into *online* cognitive processing.  
  - **What both miss:**  
    1. **The "coupling-constitution fallacy"** (Adams & Aizawa): EMT conflates *causally coupled* systems (phone + brain) with *constituted* systems. Dana’s brain *interacts* with the phone but doesn’t *include* it.  
    2. **Evolutionary mismatch:** Biological memory is shaped by selection; external tools aren’t. This may matter for cognitive individuation.  
    3. **Social dimensions:** EMT focuses on individuals, but Dana’s phone relies on corporate tech (Apple) and infrastructure (Wi-Fi). Is her mind now "distributed" across society?  

  ### **Recommendation for Resolution**  
  Dana should concede that "literal" mind-extension is metaphorical—the phone is a *scaffold* enabling cognitive function, not a biological organ. Marco should concede that under EMT, her phone *does* act as extended memory given its integration, but stress that EMT itself remains philosophically contentious. Both should explore **embedded cognition** (tools as causal supports) as a middle ground—it avoids bloat while acknowledging that tools reshape cognitive capacities.  

  **Final Philosophical Score:**  
  - Dana: 3/4 moves (losing only on "literal" phrasing).  
  - Marco: 1.5/3 moves (winning on bloat, partial on fluency).  
  **EMT survives but emerges bruised.**
