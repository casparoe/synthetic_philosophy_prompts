  I should start by mentally indexing key Fregean texts: the sharp anti-psychologism in Grundlagen, the sense/reference machinery in Über Sinn und Bedeutung, the late "third realm" letters. For 2D semantics, Chalmers' scrutability framework is central here given the user's focus on epistemology. 

  Biggest challenge: Frege's notorious rigidity. His sense determines reference with mathematical necessity, while 2D semantics intentionally blurs epistemic and metaphysical modalities. The user is right to flag the "psychological surrogate" worry—Frege would absolutely pounce if epistemic intensions track individual cognition rather than objective truth-conditions. 

