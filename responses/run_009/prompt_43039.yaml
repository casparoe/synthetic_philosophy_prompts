  The user's own "guarded welcome" thesis is defensible but needs complicating. Yes, sense determining reference anticipates primary intensions, but Frege would see 2D's secondary intensions as redundant (reference just is what sense fixes!). And the moment primary intensions vary by speaker—as they do in standard 2D accounts of ignorance—he'd cry psychologism. 

  Where speculation runs thin: Frege never engaged with counterfactual modality or a posteriori necessities. We can infer his likely contempt for "metaphysical" necessity (recall his scorn for Kant's synthetic a priori), but not how he'd reconcile it with sense rigidity. 

