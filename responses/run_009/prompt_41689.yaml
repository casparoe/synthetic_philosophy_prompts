  Bauman's thesis, on the other hand, posits that the Holocaust wasn't a regression to barbarism but a product of modernity itself. He highlights rational bureaucracy, division of labor, moral distancing, and the state's "gardening" mentality as key factors. This shifts the causality from specific historical precedents (like Bolshevism) to structural features of modern society.

