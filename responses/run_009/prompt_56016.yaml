  First, I need to unpack Wikipedia's core principles: verifiability (only published reliable sources) and no original research (no synthesis or analysis beyond sources). This indeed mirrors śabda as the exclusive pramāṇa. But Wikipedia's "reliable source" is defined institutionally (reputation for fact-checking), not by truthfulness, which diverges from Nyāya's āpta (knower/truth-teller) requirement. 

  The user's snags are crucial:  
  - Is Wikipedia's approach reductionist (like Buddhists treating testimony as inferential) or does its reliance on communal reputation hint at śabda's irreducibility (like later Nyāya)?  
  - How does Wikipedia handle contradictory sources? Its "due weight" policy avoids adjudication, favoring majority representation—unlike classical schools where genuine pramāṇas can't conflict.  

  For reconstruction:  
  - Wikipedia presupposes testimony is socially constructed (institutional reputation matters, not truth).  
  - It assumes reliability is intersubjectively established (through editorial consensus).  
  - Truth is secondary; verifiability (traceability to sources) is primary.  
  - This fits both Buddhist reductionism (inference from institutional marks) and later Nyāya (communal validation stops regress), but rejects strict Nyāya (truth-linked āpta).  

  Coherence check:  
  - The "testimony without truth" stance is unstable if knowledge requires truth, but Wikipedia explicitly prioritizes verifiability over accuracy. It's a functional (not epistemic) coherence: it works for an encyclopedia aiming to aggregate published viewpoints, not certify truths.  

  Rebuilding policies per classical schools:  
  - **Strict Nyāya**: Only truth-stating āptas would count. Policies would need truth-tracking mechanisms (e.g., vetting authors' expertise/intent), making Wikipedia impractical.  
  - **Buddhist reduction**: Current policies mostly fit (reputation as inferential marks), but might allow more source-comparison synthesis.  
  - **Cārvāka**: Only firsthand observation/perception allowed. Wikipedia would collapse without sources.  

  Key insight: Wikipedia's epistemology is a modern, pragmatic twist on śabda—prioritizing consensus and process over truth, suited for collaborative reference but philosophically hybrid.
answer: |-
  Your observation cuts deep—Wikipedia’s epistemology is indeed a radical, almost heretical, instantiation of śabda-pramāṇa, stripped of classical commitments to truth and āpta. Let’s reconstruct it through the pramāṇa lens, pinpoint where it strains coherence, and reimagine it under rival theories.

  ### The Implicit Epistemology: Śabda as Social Process  
  Wikipedia’s rules presuppose that **knowledge is constituted by communal verification, not individual insight or truth-correspondence**. The core axioms:  
  1. **Śabda is intersubjective, not truth-apt**. A "reliable source" is defined by institutional processes (peer review, editorial oversight) and community consensus—not the author’s knowledge or sincerity. The policy’s reliance on "reputation" reveals this: reputation emerges from recursive layers of testimony (e.g., academics cite journals, journalists cite experts, Wikipedians cite both). This mirrors later Nyāya’s anti-reductionism—testimony cannot be reduced to inference because institutional trust halts the regress. Yet it guts Nyāya’s core: the āpta’s truth-connection is replaced by process-based credibility.  
  2. **Pratyakṣa and anumāna are exiled to the meta-level**. Editors use perception and inference to *evaluate* sources (e.g., spotting fabrication), but these pramāṇas cannot directly contribute content. Even obvious synthesis (e.g., "A caused B" when sources state "A preceded B" and "B always follows A") is banned. This elevates śabda to sovereign status but divorces it from reason and experience.  
  3. **Contradiction is irreducible**. When sources conflict, Wikipedia mandates "due weight"—a quantitative representation of scholarly consensus. This rejects the classical axiom that pramāṇas are non-contradictory (yathārtha). Instead, knowledge is pluralized: truth is whatever the majority of reliable sources assert, even if false. It’s a majoritarian epistemology where authority trumps accuracy.  

  **Where practice underdetermines theory**:  
  - The "reputation" criterion fits both Buddhist reductionism (inferring reliability from institutional marks) and later Nyāya (treating śabda as basic due to social necessity). Neither is ruled out.  
  - But the policy *does* exclude strict Nyāya: by allowing demonstrably false claims if well-sourced, it severs śabda from truth (āpta’s defining trait).  

  ### Coherence: A Functional, Not Epistemic, Stability  
  The system is coherent only pragmatically, not philosophically. It balances two tensioned principles:  
  - **Radical śabda-centrism**: Content emerges *only* from cited testimony.  
  - **Anti-foundationalism**: Testimony need not be true, only verifiable via process.  

  This holds because Wikipedia’s goal isn’t *knowledge* (jñāna) but *verifiability* (traceability to sources). It swaps classical truth-aiming for a "hermeneutic circle" of sources citing sources. Contradictions are "resolved" not by adjudication but by documenting dissent—making the encyclopedia a map of epistemic battles rather than a repository of truths. It’s neither a classical school nor a mess, but a *proceduralist epistemology*: reliability is a social status, not an epistemic virtue.  

  ### Rebuilding Wikipedia Under Classical Theories  
  **1. Strict Nyāya (śabda requires āpta)**  
  - **Changes**: Sources must be vetted for author expertise (śakti), sincerity (āśraya), and truthfulness (tadvat). Corrupt journals or biased editors wouldn’t qualify.  
  - **Policies scrapped**: "Reputation" alone insufficient; demonstrably false claims removed regardless of sourcing.  
  - **Effect**: Articles shorter, more accurate, but unworkable at scale. Who verifies the āpta? Nyāya’s own regress problem kicks in—editors would need divine perception (ālokajñāna) to confirm sincerity. Wikipedia stagnates.  

  **2. Buddhist Reductionism (śabda as anumāna)**  
  - **Changes**: "Reliable source" redefined: editors infer truth from marks (liṅga) like methodology, citations, error rates. Synthesis allowed if logically necessitated (e.g., combining "A > B" and "B > C" to infer "A > C").  
  - **Policies retained**: Verifiability stays, but "no original research" relaxes—editors could construct valid inferences from sources.  
  - **Effect**: More analytical articles, but edit wars over inference validity. Resembles academic discourse but risks OR creep.  

  **3. Cārvāka (only pratyakṣa valid)**  
  - **Changes**: Only direct observations from named witnesses admissible. Peer-reviewed journals? Useless—secondary testimony.  
  - **Policies gutted**: Verifiability policy rewritten to demand eyewitness accounts; all history, science, and philosophy articles deleted.  
  - **Effect**: Wikipedia holds recipes, weather reports, and "I saw a tree"—an empty shell.  

  ### The Verdict  
  Wikipedia’s epistemology is a coherent *pragmatic* system—it achieves its goal of aggregating verifiable claims. But philosophically, it’s a nominalist departure: śabda as a tool for consensus, untethered from truth. Under classical theories, it either collapses (Cārvāka), becomes judicially untenable (Nyāya), or evolves into a scholar’s forum (Buddhism). Its power—and fragility—lies in admitting that knowledge, for its purposes, is what the accredited say it is. The pramāṇa isn’t truth; it’s authority codified.
