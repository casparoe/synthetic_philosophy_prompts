answer: |-
  Your profound analysis cuts to the heart of historical fiction's paradox. The practice you describe does rest on a specific, often unexamined, philosophy of history—one rooted in **19th-century positivism, archival fetishism, and a Cartesian mind/event duality**. Let's dissect its presuppositions and explore alternatives:

  ### The Implied Philosophy of Current Practice
  1.  **The Positivist Foundation:** It assumes history is primarily a sequence of verifiable, discrete "hard facts" (battles, treaties, births, deaths) existing independently of interpretation. These are sacred because they are *documented*.
  2.  **The Interiority Exception:** Thoughts, emotions, and private dialogue are deemed inaccessible or poorly documented. This creates a category of "soft facts" open to *interpretive reconstruction*. The novelist is seen as filling inevitable gaps, not contradicting evidence.
  3.  **The Archival Boundary:** The distinction between thought (inventable) and event (fixed) maps onto the *accident of documentation*. We have muster rolls and battle dispatches (events), but rarely Cromwell's private diary (thoughts). The rule becomes: *Invent where the archive is silent.*
  4.  **The Illusion of the Clean Border:** The author's note presupposes:
      *   A clear, knowable distinction between "fact" and "invention."
      *   That readers process information rationally, segregating the "invented list" from the immersive narrative.
      *   That disclosure equals ethical absolution, regardless of impact.
  5.  **The Coherence Problem:** Is invented thought "more revisable"? Only in a shallow sense. The practice assumes:
      *   **Temporal Revisability:** Future historians won't care about *your specific* invented thoughts for Cromwell; they'll overwrite them with new interpretations. A shifted battle date, however, becomes a permanent error in *your* record.
      *   **Epistemological Revisability:** Thoughts are *inherently* interpretive; events are *supposedly* objective. Therefore, inventing thoughts aligns with the nature of historical knowledge about interiority, while shifting events violates the nature of historical knowledge about occurrences.
      *   **The Confusion:** This ignores that *all* historical understanding is interpretive reconstruction. Your invented thoughts *become* the "real" Cromwell for thousands. The distinction is less about ontology (what *is* real) and more about *what was written down* and the *genre's self-imposed rules for credibility*.

  ### Why the Practice Persists (Despite its Flaws)
  *   **Practical Necessity:** Without inventing interiority, the genre collapses into biography or chronicle. The event-anchor provides essential scaffolding and perceived legitimacy.
  *   **Reader Expectation & Trust:** Readers *want* immersion and emotional truth, but also believe they are learning "real history." The rules and author's note are a pact to manage this inherent tension, preserving the *feeling* of authenticity.
  *   **Marketing & Genre Definition:** "Based on true events" leverages history's authority while retaining fiction's freedom. The distinction from non-fiction, however blurry on the shelf, relies on maintaining this event-based boundary internally.

  ### Reframing the Practice: Disclosing Power, Not Just Inventions
  What if the genre acknowledged its *true* power – reshaping collective memory – and structured disclosure accordingly? Here’s what it might look like, presupposing a **constructivist view of history** (where history is an active interpretation, not a recovered object):

  1.  **The Foreword as Framework (Not the Afterword as Apology):**
      *   Move the disclosure upfront. Don't bury it as an appendix.
      *   State explicitly: *"This novel will overwrite your understanding of Cromwell. My interpretation, including his deepest thoughts and the connections I draw between events, will feel like truth. That is the power and danger of this form."*
      *   Frame the entire work as an *argument* or *experiment in perspective*, not a veiled recreation.

  2.  **Disclosing the *Why* of Invention, Not Just the *What*:**
      *   Instead of a sterile list: *"Chapter 12: Cromwell's doubts before Dunbar are imagined,"* explain: *"I gave Cromwell these specific doubts here to highlight the tension between his faith and military pragmatism, an interpretation I built from his later letters and the pressures of that moment. The historical record is silent on his exact state of mind that morning."*
      *   Focus on the *interpretive gap* being filled and the *narrative or thematic purpose* of the invention.

  3.  **Highlighting the Constructedness Throughout:**
      *   Integrate subtle meta-awareness: A character reflecting on the unreliability of memory; juxtaposing fictional dialogue with a brief, dry excerpt from an actual letter on the same topic.
      *   Use stylistic shifts to subtly signal interpretation vs. documented action (without breaking immersion clumsily).

  4.  **The Author's Note as Dialogue with the Archive:**
      *   Transform the note into a short essay: "How I Wrestled with Cromwell."
      *   Discuss the *ambiguities* in the sources themselves. Show where historians disagree.
      *   Explicitly state: *"Where the documents end, my imagination begins. I aimed not for factual replication, but for emotional and thematic truth within the bounds of the known record. Remember, this Cromwell is mine."*

  5.  **Embracing "Parallel History" or "Counter-Memory":**
      *   Acknowledge the novel creates a *parallel* past that exists alongside academic history, feeding the popular imagination.
      *   Encourage readers towards specific non-fiction works for contrasting interpretations, framing the novel as a *provocation* to explore history, not its replacement.

  6.  **Publisher Responsibility:**
      *   Demand nuanced blurbs: Instead of "Based on True Events," try *"A psychological exploration of Cromwell through fiction,"* or *"Reimagining the human drama behind the documented facts of the English Civil War."*
      *   Clearly distinguish marketing for fiction and non-fiction in tone and presentation.

  ### The Underlying Shift
  This reframing presupposes:
  *   History is not a fixed landscape to be navigated, but a conversation the novelist actively participates in.
  *   The primary ethical duty is not just accuracy *within self-defined rules*, but **transparency about the act of construction and its potential impact**.
  *   The reader's trust is earned not by a list of deviations, but by demonstrating **intellectual honesty about the limits of knowledge and the power of narrative**.
  *   The "real" power lies not in the individual inventions, but in the **cohesive, emotionally resonant *world* the novelist builds, which inevitably overwrites simpler, document-driven understandings of the past.**

  This approach doesn't abandon research or respect for documented events. Instead, it places that respect within a more honest framework about what historical fiction *actually does*: it doesn't merely reconstruct the past; it *competes* with it in the arena of collective memory. Your unease stems from recognizing this profound power. The challenge—and the potential for a more ethically robust genre—lies in disclosing *that* power upfront, making the constructive act itself part of the story.
