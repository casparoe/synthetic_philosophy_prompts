  Hmm, their frustration is palpable. They've noticed a paradox: the genre's rules claim to protect historical "truth" while its methods inherently overwrite it. The publisher's identical marketing for fiction and revisionist nonfiction adds another layer of unease. This isn't just about technique; it's about complicity in how collective memory forms. 

  What's unsaid but felt: they might want permission to break conventions or seek ethical justification for continuing. The mention of "the novelist's real power" suggests they're ready to confront the responsibility they've sensed all along. 

  I should dissect the implied philosophy first. The thought/event distinction likely stems from 19th-century positivism—treating dates/battles as "solid" facts while interiority is "soft" and reconstructible. But postmodernism blew that up; we know all facts are interpreted. Yet the genre clings to the old hierarchy, partly because battle dates are easier to verify than Cromwell's private doubts. 

