prompt: |-
  Here's something I keep bumping into: the old strategy-stealing argument, usually credited to Nash for Hex — first player can't lose in a symmetric game where an extra move never hurts, since if second player had a winning strategy, first player could just make an arbitrary opening move and then follow that strategy as if they were second player. Nice trick, and apparently it now gets reused in AI-risk arguments under the name "strategy-stealing assumption," roughly: no one (aligned or unaligned AI) can get a decisive edge purely from better strategies, because whatever works for one side can be copied by the other. I want to know what it takes for arguments of this shape to actually go through, so give me the desiderata: what the underlying game/goal has to be like, what conditions the "steal" has to satisfy (costs nothing? can be observed and copied in time? the copied strategy still works when you're behind?), how ties/draws matter, whatever else you think belongs on the list. For each requirement give the case or failure mode behind it, mark which ones are non-negotiable vs which people quietly fudge, and tell me whether any subset is jointly unsatisfiable. Then apply the list to the AI-forecasting version — my suspicion is it fails more of the requirements than its users admit (copying a strategy in a war isn't the same as copying one in a board game), but I want you to tell me straight if I'm wrong and where exactly. Lead with your bottom line in the first sentence, then the reasoning, no preamble and no restating my question back at me.
reasoning: |-
  Alright, the user is asking about the strategy-stealing argument, especially how it applies to AI-risk scenarios. Let me start by recalling what they mentioned. Nash's original idea in Hex is that the first player can't lose because they can steal the second player's winning strategy. Now, in AI arguments, people claim no one gains a decisive edge just from better strategies since they can be copied.

  First, I need to outline the necessary conditions for this argument to hold. The user wants desiderata, failure cases, and which are non-negotiable. Then, apply these to AI forecasting. The user suspects it fails more than admitted, so I should verify that.

  Key conditions: symmetric game, perfect symmetry in players and rules. If the game isn't symmetric, stealing doesn't work. Also, no inherent first-move disadvantage. In Hex, moving first is an advantage, but what if the first move is a disadvantage? That breaks it. Then, zero-cost strategy copying. You need to observe and replicate without cost. In games, you see the opponent's moves, but in real war, strategies might be secret or costly to copy.

  Next, strategy effectiveness regardless of state. Stealing a strategy when you're behind might not work. If the opponent is already ahead, copying might not help. Also, no stateful advantages like irreversible resource gains. If one player captures territory, the other can't just copy that.

  Ties need to be impossible. If draw exists, stealing might only force a draw, not a win. In Hex, there are no ties, so it works. But in Chess, draws are possible, so stealing might not ensure a win.

  Non-negotiable conditions: perfect symmetry and zero-cost copying. Without these, the argument falls apart. People might fudge the copying cost or state independence, assuming they can copy quickly or that being behind doesn't matter.

  Applying to AI: Is the AI competition symmetric? Probably not. Different resources, capabilities, starting positions. Copying isn't zero-cost; reverse-engineering an AI's strategy could take time and resources. State matters a lot; if one AI gains a lead, copying won't help. Also, ties might not exist in existential risks.

  The user's suspicion seems valid. The AI-risk version likely fails on multiple points: asymmetry, copying costs, state-dependence. Need to highlight these clearly. Also, mention that decisive edge might still exist due to these failures, contrary to the assumption.
answer: |-
  **The strategy-stealing argument fails for real-world AI competition due to violations of core requirements like symmetry, zero-cost copying, state independence, and the absence of ties.** Here's the breakdown of requirements, failure modes, negotiability, and application to AI:

  ### Desiderata for Strategy-Stealing Validity
  1.  **Perfect Symmetry (Non-Negotiable):** Players must be identical in capabilities, resources, information, and win conditions. The game rules must be identical for both players regardless of turn order.  
      *   *Failure Mode:* Asymmetric starting positions (e.g., one player controls more territory/resources), different win conditions (e.g., "defender" vs "attacker" roles), or inherent advantages (e.g., one player has superior intrinsic processing speed).  
      *   *Fudging Common:* Assuming rough parity in capabilities/resources when asymmetry is likely.

  2.  **No First-Move Disadvantage (Non-Negotiable):** Moving first cannot create an inherent, irreversible disadvantage.  
      *   *Failure Mode:* Games where moving first forces a player into a vulnerable position (e.g., some combinatorial games with zugzwang). In strategy-stealing, if P1's arbitrary move *creates* a losing position, copying P2's strategy fails.

  3.  **Zero-Cost Strategy Observation & Replication (Non-Negotiable):** The opponent's strategy must be perfectly observable in real-time, and copying it must incur no cost (time, resources, opportunity cost) or loss of effectiveness.  
      *   *Failure Mode:* Strategies relying on hidden information (e.g., encryption keys, secret research), proprietary technology, or unique resources. Copying may require significant R&D investment or reverse-engineering time, allowing the opponent to pull further ahead.  
      *   *Fudging Common:* Ignoring observation/implementation lags or costs, assuming strategies are "algorithms" that can be instantly duplicated.

  4.  **State Independence of Strategies (Non-Negotiable):** The stolen strategy must work identically regardless of the current game state (e.g., resource differentials, positional advantages). Being "behind" cannot invalidate the strategy.  
      *   *Failure Mode:* In Hex, a strategy works from any board state. In real conflict, a strategy designed for a resource-rich player fails if copied by a resource-poor player (e.g., a blitzkrieg strategy without sufficient tanks). Stealing a strategy *after* falling behind may be futile.  
      *   *Fudging Common:* Assuming strategies are purely "tactical playbooks" divorced from material conditions.

  5.  **No Ties / Strict Win-Loss Outcomes (Conditionally Negotiable):** The game must have no draw/stable outcome; one player *must* win.  
      *   *Failure Mode:* If draws are possible, strategy-stealing only proves that P1 can *at least draw*, not necessarily win (e.g., in Chess, P1 could force a draw but not a win against perfect play).  
      *   *Negotiability:* For proving "no decisive loss," absence of ties is less critical if the goal is avoiding loss rather than forcing a win. For proving a *win*, it's essential.

  6.  **No Irreversible State Changes / No "Captured" Resources (Non-Negotiable):** Moves cannot create permanent, unshareable advantages (e.g., seizing territory, destroying enemy assets, patenting technology).  
      *   *Failure Mode:* If P2's winning strategy relies on capturing a critical resource in move 2, P1 cannot replicate this after their arbitrary move 1 if the resource is now gone or controlled by P2.  
      *   *Fudging Common:* Treating resources/positions as infinitely replicable or ignoring path dependencies.

  **Joint Unsatisfiability:** Requirements 3 (Zero-Cost Copying), 4 (State Independence), and 6 (No Irreversible Changes) are often jointly unsatisfiable in real-world scenarios. Gaining an irreversible advantage (violating 6) typically creates state asymmetry (violating 4) and copying the strategy to regain parity is costly (violating 3).

  ### Application to AI Risk "Strategy-Stealing Assumption"
  The AI-forecasting version **fails critically** on multiple non-negotiable requirements:
  1.  **Symmetry Violated:** AIs/humans won't have identical capabilities, resources, or goals ("aligned" vs "unaligned" implies asymmetric win conditions). An AI with superior compute or novel architecture has an inherent asymmetry.
  2.  **Zero-Cost Copying Impossible:** Observing an opponent AI's "strategy" (e.g., its novel optimization algorithm or exploit) requires costly reverse-engineering, simulation, or R&D. During this delay, the leading AI consolidates advantage (violating State Independence).
  3.  **State Dependence Fatal:** If an unaligned AI gains a decisive advantage (e.g., deploying a fast, scalable nanofactory), copying its *initial* strategy is useless for the lagging side. The winning strategy at T=100 may require resources only available to the leader.
  4.  **Irreversible Changes Ubiquitous:** Real-world competition involves seizing compute, energy, or infrastructure. An AI that executes first-mover actions to control critical infrastructure cannot have those gains "copied."
  5.  **Ties Irrelevant:** Existential risk scenarios lack "draws"—either humanity/Aligned AI wins or loses. But strategy-stealing fails to prevent loss because copying is too slow/ineffective when behind.

  **Conclusion:** The strategy-stealing assumption in AI risk is invalid for real-world conflict; decisive edges *can* arise from better strategies due to asymmetry, copying costs, path dependence, and irreversible gains. Its proponents fudge Requirements 3 (copying cost), 4 (state independence), and 6 (irreversible advantages), treating strategic competition as a turn-based abstract game with perfect information and fungible resources.
