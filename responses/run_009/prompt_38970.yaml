prompt: |-
  I chair the incident review panel at a mid-sized regional hospital network. We've had an autonomous triage and sepsis-alerting system in production for two years, and every time it's implicated in a near-miss or an actual bad outcome, the panel meeting turns into the same fight: legal wants a name for the file, the clinicians point at the engineers, the engineers point at the training data, and the people who curated the training data have left. I read somewhere that this is called a "responsibility gap" — when an autonomous system does something harmful and you can't pin it on any human, because nobody intended it, nobody could reasonably have foreseen it, and the machine isn't the kind of thing you can blame. There's also apparently an older thing called the problem of many hands, where a harm comes out of a pile of individually reasonable decisions by different people. I think our situation is some mix of both, and I want a procedure, not a philosophy seminar.

  So: write me a decision procedure the panel can actually run in one two-hour meeting on a single incident. The panel is me (administrator, chair), a senior nurse, the clinical engineer who maintains the system, a quality officer, and someone from legal who mostly wants names. None of us our philosophers. The procedure should:

  - Lay out the questions to ask in order, with what counts as a sufficient answer to each — especially some way of testing whether responsibility traces back to an identifiable human decision point (a moment where a person had the relevant knowledge, a real choice, and no good excuse) versus dissolving into many hands versus being a genuine gap.
  - Keep two questions seperate on purpose: the backward-looking one (who, if anyone, is at fault) and the forward-looking one (who has to remediate, monitor, and make the patient whole regardless of fault). Legal is going to try to collapse these and I need the procedure to make the collapse look wrong, not just declare it wrong.
  - Mark the points where the procedure runs out and a human judgment call has to take over — and be honest about which of those are questions of fact we can't settle and which are questions of value we shouldn't dress up as facts.

  Then run it on three cases from our last year (anonymized):

  1. A patient deteriorated after the system scored her low-risk for about 14 hours. A vital sign had been double-entered during a shift handoff, and everyone in that chain did something locally reasonable — it's the kind of slip a human doing the triage by hand would also have made at 3am.
  2. A nurse, with supervisor sign-off, had configured the alerting to snooze repeats after a run of what everyone agreed were nuisance alarms. Three weeks later a genuine escalation got snoozed along with the noise. The nurse did exactly what the policy she was working under told her to do.
  3. The system behaved exactly as designed, but the design had been tuned on a population that doesn't include patients like this one — I can't say more, but it's a real case — and nobody in the design chain did anything wrong by the standards of their own job.

  For at least one of these I expect the honest output to be "nobody is blameworthy, but here is who owes what going forward." That's the answer the board will hate — they want a name for the file — so if that's where the procedure lands, say so plainly, and tell me what the procedure can and can't do to protect us from the pressure to manufacture fault.

  Also: if the procedure has an obvious failure mode — like making it too convenient to declare a gap whenever blame would be awkward — flag that and build in whatever check you can against it.
reasoning: |-
  We are designing a practical decision procedure for an incident review panel that must handle cases involving an autonomous triage and sepsis-alerting system. The procedure must be executable in a two-hour meeting and address both backward-looking (fault) and forward-looking (remediation) questions. It must also handle the three provided cases and guard against the convenience of declaring a responsibility gap.

  The procedure is structured as a flowchart of questions, with clear criteria for sufficient answers and markers for when judgment calls are required. We separate fault and remediation.

  **Procedure: Responsibility Assignment and Remediation Protocol (RARP)**

  **Participants:** Chair (you), Senior Nurse, Clinical Engineer, Quality Officer, Legal Representative.

  **Input:** Incident report with facts (what happened, timeline, system behavior, human actions).

  **Outputs:** 
  1. Backward-looking: List of individuals/groups at fault (if any) and why, OR declaration of "no blameworthy human" (with reason: many hands, gap, or no fault found).
  2. Forward-looking: Assignments for remediation (who does what to fix, monitor, compensate) regardless of fault.

  **Steps:**

  **0. Pre-meeting (Chair prepares):** 
     - Distribute incident report at least 24 hours in advance.
     - Ensure report includes: timeline, system logs, relevant policies, training data info (if applicable), and human actions.

  **1. Incident Reconstruction (15 mins):**
     - **Question:** "What exactly happened, step by step, from the system's and humans' perspectives?"
     - **Sufficient answer:** A timeline agreed by all, with no unresolved factual disputes. If disputes, mark as "unresolved fact" and note for later.
     - **Chair role:** Keep it factual. Use whiteboard to draw timeline.

  **2. System Behavior Assessment (15 mins):**
     - **Question:** "Did the system behave as designed and as expected given the inputs it received?"
     - **Sufficient answer:**
       - If yes: Move to step 3.
       - If no: Identify the deviation. Then ask: "Was this deviation due to a known failure mode (e.g., bug, hardware fault) or an unknown one (e.g., emergent behavior)?" 
       - If known: Mark as potential engineering/maintenance fault. Note for step 4.
       - If unknown: Mark as potential design/training fault or gap. Note for step 4.
     - **Judgment call:** If the system's behavior is ambiguous, mark as "unresolved fact" and note.

  **3. Input Assessment (15 mins):**
     - **Question:** "Were the inputs to the system correct and complete at each decision point?"
     - **Sufficient answer:**
       - If yes: Move to step 4.
       - If no: Identify the incorrect/missing input and the human(s) responsible for providing it. Then ask: "Was the error preventable by that human given their knowledge, context, and hospital policies?"
         - If yes: Mark as potential human fault (e.g., data entry error by a specific role). Note for step 4.
         - If no: Mark as potential system design fault (if the system should have been robust to such errors) or policy fault (if the policy allowed an error-prone process). Note for step 4.
     - **Judgment call:** When assessing "preventable," consider the human's workload, time of day, training, and clarity of procedures. If unclear, mark as "value judgment" (we must decide what is reasonable).

  **4. Human Decision Point Analysis (30 mins):**
     - **Goal:** Trace the incident back to the last human decision point(s) that could have prevented the harm.
     - **Question:** "At what points did a human make a decision that contributed to the harm, and did they have the relevant knowledge, a real choice, and no good excuse?"
     - **Criteria for a blameworthy decision:**
       - **Knowledge:** The person knew or should have known (given their role and training) the risks of their action/inaction.
       - **Choice:** They had a reasonable alternative action (including escalation or inaction) that would have reduced risk.
       - **No good excuse:** No mitigating factors (e.g., emergency, system malfunction outside their control, following a mandatory policy without discretion).
     - **Process:**
       - List all human decisions in the timeline (e.g., configuring the system, entering data, responding to an alert).
       - For each decision, apply the three criteria. 
       - If all three are met, mark as "blameworthy" and note the individual/role.
       - If any criterion is not met, the decision is not blameworthy. Then ask: "Could the harm have been prevented by a different decision at an earlier point by someone else?" (e.g., by a designer, policy-maker, trainer).
     - **Sufficient answer:** A list of decisions with blameworthiness assessed. If no blameworthy decisions, then:
       - If the incident arose from a chain of non-blameworthy decisions (each reasonable in isolation), mark as "many hands."
       - If the incident arose from system behavior that no human could have foreseen or controlled, mark as "responsibility gap."
     - **Judgment call:** Assessing "should have known" and "reasonable alternative" are value judgments. The panel must decide based on hospital norms and standards of care. Document the reasoning.

  **5. Fault Declaration (10 mins):**
     - **Question:** "Based on step 4, is there at least one blameworthy human decision?"
     - **Sufficient answer:**
       - If yes: "We assign fault to [role(s)/individual(s)] for [decision(s)]." (Legal gets a name, but note: it might be a role or team, not an individual.)
       - If no: "No blameworthy human found. Reason: [many hands/responsibility gap]." (This is the answer the board may hate, but it must be stated if true.)

  **6. Remediation Assignment (20 mins):**
     - **Question:** "Regardless of fault, what must be done to: (a) make the patient whole, (b) fix the system/process to prevent recurrence, and (c) monitor for similar risks?"
     - **Process:** 
       - Assign tasks to roles (not necessarily individuals) for:
         - **Patient compensation:** Quality Officer (liaise with patient relations).
         - **System/process fix:** 
           - If design flaw: Clinical Engineer and design team.
           - If policy flaw: Quality Officer and relevant department heads.
           - If training flaw: Education/training team.
           - If data flaw: Data team.
         - **Monitoring:** Clinical Engineer (for system fixes), Quality Officer (for process/policy fixes).
       - Set deadlines for action plans.
     - **Sufficient answer:** Clear assignments with deadlines. Note: Remediation is about capacity and role, not fault.

  **7. Review and Validation (10 mins):**
     - **Question:** "Does this outcome align with our hospital's values and safety goals? Are we being honest about fault and diligent about remediation?"
     - **Check against failure mode:** 
       - **Risk:** Declaring a gap too easily to avoid blame. 
       - **Safeguard:** Require that if a gap is declared, step 6 must include a specific plan to close that gap (e.g., improve system monitoring, add human oversight). Also, in step 4, the panel must explicitly state why each human decision was not blameworthy.

  **8. Documentation (5 mins):**
     - Chair summarizes: fault (if any), gap/many hands (if declared), and remediation assignments. Legal gets a document for the file, which may say "no individual fault found."

  ---

  **Running the Cases:**

  **Case 1: Double-entered vital sign leading to low-risk score and deterioration.**

  - **Step 1:** Timeline shows: Patient admitted, vital signs taken at shift handoff (3am), double-entered by two nurses (one leaving, one arriving). System used the double-entered value (which was stale) for 14 hours. Patient deteriorated.
  - **Step 2:** System behaved as designed: it used the last input. No deviation.
  - **Step 3:** Input was incorrect (stale). Human responsible: nurses during handoff. Was it preventable? 
    - Context: 3am handoff, high workload. Policy allows verbal handoff without immediate data entry verification. 
    - Judgment: While the error occurred, it was a common slip under the circumstances. No good alternative at the time (nurses followed policy). Not blameworthy.
  - **Step 4:** 
    - Decision points: 
      - Nurse A (leaving) reported vital sign verbally but did not enter it? (Assume data entry was done by Nurse B, the arriving nurse, who entered it twice by mistake.) 
      - Nurse B entered the data incorrectly (double entry) due to fatigue and handoff pressure.
      - But: Hospital policy did not require double-checking during handoff, and the system design did not flag stale data.
    - Assessment:
      - Nurse B: Had knowledge? Yes, that data must be accurate. Choice? Could have double-checked, but policy didn't require it, and it was 3am. Excuse? Reasonable under the circumstances. Not blameworthy.
      - System design: Should it have had a staleness check? This was not foreseen. No human designer made a blameworthy decision (it was a common oversight). 
    - Outcome: Many hands (chain of non-blameworthy decisions) and possibly a gap in system design (no staleness check).
  - **Step 5:** No blameworthy human. Reason: Many hands (error chain) and design gap (system didn't handle staleness).
  - **Step 6:** 
    - Remediation: 
      - Patient: Compensate (Quality Officer).
      - Fix: 
        - System: Add staleness check for vital signs (Clinical Engineer, 3 months).
        - Process: Change handoff policy to require data entry verification (Quality Officer with nursing, 1 month).
      - Monitor: Track vital sign entry errors (Quality Officer, ongoing).
  - **Step 7:** Honest about fault (none) but diligent on fixes. Safeguard: We are not declaring a gap to avoid blame; we are fixing the gap.

  **Case 2: Snoozed alerts due to nuisance alarms, missing a real one.**

  - **Step 1:** Timeline: Nurse (with supervisor sign-off) configured the system to snooze repeats after a run of nuisance alarms. Three weeks later, a genuine escalation was snoozed.
  - **Step 2:** System behaved as configured.
  - **Step 3:** Input (configuration) was done as per policy. No input error.
  - **Step 4:**
    - Decision points:
      - Nurse configured snooze. 
      - Supervisor approved.
      - Policy allowed this configuration.
    - Assessment:
      - Nurse and Supervisor: Knowledge? They knew snoozing might delay alerts. Choice? They followed policy. Excuse? Policy was flawed (allowed snoozing without enough safeguards). Not blameworthy for following policy.
      - Policy makers: Did they know the risks? When the policy was written, the risk of a genuine alarm being snoozed might not have been fully considered. But if the risk was known, they might be blameworthy. However, the policy was written earlier and not reviewed after the system went live. Judgment: At the time of policy writing, it might have been reasonable. Now, it's a policy flaw. But no individual acted with fault at the time of the incident.
    - Outcome: Many hands (policy, configuration) and possibly a gap in policy design.
  - **Step 5:** No blameworthy human at the time of the incident. Reason: Many hands (policy and configuration) and gap in policy (did not account for long-term risks of snoozing).
  - **Step 6:**
    - Remediation:
      - Patient: Compensate (Quality Officer).
      - Fix: 
        - Policy change: Restrict snoozing or add safeguards (e.g., mandatory daily review of snoozed alerts) (Quality Officer with clinical leadership, 1 month).
        - System change: Make snooze expire after max 24 hours (Clinical Engineer, 1 month).
      - Monitor: Audit snoozing configurations weekly (Quality Officer).
  - **Step 7:** Avoided manufacturing fault. Remediation addresses the root cause (policy).

  **Case 3: System tuned on unrepresentative population.**

  - **Step 1:** Timeline: System used for a patient not in the training population. System behaved as designed but gave incorrect risk score. Harm resulted.
  - **Step 2:** System behaved as designed.
  - **Step 3:** Inputs were correct. No human error in data entry.
  - **Step 4:**
    - Decision points in design chain:
      - Data curators: Selected training data. They left, but at the time, did they know the population was incomplete? 
        - If the exclusion of this patient type was known and accepted as a limitation, then they documented it? 
        - If not known, then it was an oversight.
      - Designers/engineers: Built the model. Did they test on diverse populations? 
      - Approvers: Signed off on the system. Did they review the limitations?
    - Assessment:
      - Assume the design team followed standard practices and the population gap was not known at the time (as per the case). 
      - Then, no one had the knowledge that this patient type would be mis-scored. No blameworthy decision.
    - Outcome: Responsibility gap (emergent limitation of the system in a novel case).
  - **Step 5:** No blameworthy human. Reason: Responsibility gap (unforeseeable at design time).
  - **Step 6:**
    - Remediation:
      - Patient: Compensate (Quality Officer).
      - Fix: 
        - System: Retrain model with more diverse data (Clinical Engineer, 6 months). Until then, add a manual review for patients with characteristics like this one (Clinical Lead, 1 week).
        - Process: Update inclusion criteria for training data and improve diversity (Data team, 3 months).
      - Monitor: Track performance by patient subgroups (Clinical Engineer, ongoing).
  - **Step 7:** This is a true gap. The safeguard: We are not using the gap to avoid blame (since no one is at fault) but are actively closing the gap.

  **Handling Board Pressure:**
  - The procedure ensures that if the answer is "no one is at fault," it is because we have rigorously checked for a blameworthy decision and found none. The board must accept that in complex systems, not every harm has a villain. 
  - The procedure protects the panel by:
    - Requiring explicit justification for "no fault" (step 4 and 5).
    - Ensuring remediation is always assigned (step 6), showing diligence.
    - Separating fault (backward) from remediation (forward) so that the lack of fault does not imply inaction.
  - If the board demands a name, the procedure can only assign fault if the criteria are met. If not, the chair must defend the outcome as the honest result of the protocol. The alternative (assigning blame arbitrarily) is unsafe and unjust.

  **Failure Mode Safeguard:**
  - The risk of declaring a gap too easily is mitigated by:
    - Step 4's detailed decision analysis (must show why each human is not blameworthy).
    - Step 7's explicit check on honesty and values.
    - Requiring that every gap declaration comes with a remediation plan to close that gap (step 6), making it costly to declare a gap without action.

  This procedure should fit within two hours and provide a clear, defensible outcome for each case.
answer: |-
  Below is a structured decision procedure designed for your incident review panel. It's built as a linear flowchart with clear exit points, separates fault from remediation, flags judgment calls, and includes safeguards against declaring "responsibility gaps" for convenience. The procedure assumes a **two-hour meeting** and uses strict timeboxing. Roles: **Chair** (you, facilitator), **Nurse** (clinical perspective), **Engineer** (technical), **Quality** (process), **Legal** (accountability).

  ---

  ### **Responsibility Assignment & Remediation Protocol (RARP)**  
  **Purpose:** Determine (A) if any human is at fault, and (B) who must act to remediate, regardless of fault.  
  **Input:** Fully documented incident timeline, system logs, and relevant policies.  
  **Output:**  
  - Fault verdict: `[Named person/role]` OR `[Many Hands]` OR `[Gap]` + justification.  
  - Remediation assignments: Specific tasks for specific roles.  
  - Documentation: Signed by panel, shared with the board.

  ---

  ### **Procedure Steps**  
  *(Total: 110 mins; reserve 10 mins for wrap-up)*  

  #### **STEP 1: Reconstruct the Incident (15 mins)**  
  **Question:** "What exactly happened, step-by-step, in under 3 minutes?"  
  - **Sufficient answer:** Consensus on a neutral timeline (no blame language). Focus on:  
    - System inputs/outputs.  
    - Human actions (who did what, when, and why).  
    - Harm outcome (e.g., "delayed treatment by 4 hours").  
  - **Judgment call:** If facts conflict, mark as `UNRESOLVED FACT`. Do not proceed without chair ruling.  
  - **Exit to:** Step 2.

  #### **STEP 2: Identify Decision Points (10 mins)**  
  **Question:** "Where did a human make a choice that affected the outcome?"  
  - **Sufficient answer:** List of all human decisions (e.g., "Nurse X configured snooze," "Engineer Y approved training data"). Exclude automated steps.  
  - **Criteria:** A "decision point" must have:  
    - **Awareness:** The person knew their action could alter risk.  
    - **Alternatives:** At least one other option was feasible.  
  - **Judgment call:** If no decisions found, declare `GAP` and jump to Step 6 (remediation).  
  - **Exit to:** Step 3.

  #### **STEP 3: Test for Blameworthy Decisions (30 mins)**  
  **Question:** "For each decision point, did the person have:  
     (a) **Relevant knowledge** (they knew or should have known the risks),  
     (b) **Real choice** (alternatives existed and were accessible), and  
     (c) **No good excuse** (no external coercion/emergency)?"  
  - **Sufficient answer:**  
    - **Yes to all 3:** Fault lies with that person/role. Document why.  
    - **No to any:** Decision is not blameworthy.  
  - **Key safeguards against "gap overuse":**  
    - If "should have known" is disputed, Quality Officer provides industry standards (e.g., "A nurse should know sepsis protocols").  
    - If "no good excuse" is weak (e.g., "policy forced me"), escalate to Step 4.  
  - **Judgment calls:**  
    - "Should have known" = `VALUE JUDGMENT` (panel votes).  
    - "Good excuse" = `FACT JUDGMENT` (e.g., was policy ambiguous?).  
  - **Exit to:**  
    - If ANY blameworthy decision: Step 5 (fault verdict).  
    - If NO blameworthy decisions: Step 4.  

  #### **STEP 4: Test for Many Hands or Gap (20 mins)**  
  **Question:** "Could a reasonable person, reviewing all non-blameworthy decisions together, have foreseen the harm?"  
  - **Sufficient answer:**  
    - **Yes** = `MANY HANDS` (harm emerged from combined actions).  
    - **No** = `GAP` (unforeseeable, no human could have prevented it).  
  - **Critical check against false gaps:**  
    - Engineer and Nurse must jointly confirm: "Was this failure mode *ever* documented in testing/audits?" If yes, revert to Step 3 (someone ignored warnings).  
    - Quality must confirm: "Do similar incidents exist in our database?" If yes, `MANY HANDS` (systemic issue).  
  - **Judgment call:** "Reasonable person" = `VALUE JUDGMENT` (panel votes).  
  - **Exit to:** Step 5.  

  #### **STEP 5: Fault Verdict (10 mins)**  
  **Question:** "Who/What is at fault?"  
  - **Sufficient answer:** One of:  
    - `[Named person/role]` + evidence from Step 3.  
    - `MANY HANDS` + summary of decisions.  
    - `GAP` + why it was unforeseeable.  
  - **Legal shield:** Chair states: "Fault is separate from remediation. Verdict is final for this incident."  

  #### **STEP 6: Remediation Assignment (20 mins)**  
  **Question:** "Regardless of fault, who must:  
     (a) Compensate the patient?  
     (b) Fix the system/process?  
     (c) Monitor for recurrence?"  
  - **Sufficient answer:** Assign to ROLES (not individuals):  
    - **Compensate:** Quality Officer (handles restitution).  
    - **Fix:**  
      - If design flaw: Engineer + external vendor if needed.  
      - If policy flaw: Quality + relevant department head.  
      - If training flaw: Nurse Educator + HR.  
    - **Monitor:** Engineer (system), Quality (process).  
  - **Key separation from fault:** Chair states: "Remediation is owed because harm occurred, not because of blame."  

  #### **STEP 7: Validation & Documentation (5 mins)**  
  **Question:** "Does this align with hospital values and safety goals?"  
  - **Safeguard:** Quality Officer must propose one action to prevent recurrence.  
  - **Output:** Sign-off form with: fault verdict, remediation assignments, due dates.  

  ---

  ### **Running the Cases**  
  **Case 1: Double-entered vital sign (14-hour delay)**  
  - **Step 1:** Timeline shows two nurses double-entered data at handoff; system used stale value.  
  - **Step 2:** Decision points: Nurse A (entered data), Nurse B (accepted handoff).  
  - **Step 3:**  
    - Nurse A/B: Knew risk? **Yes.** Choice? **Yes** (could verify). Excuse? **Yes** (3am, policy allows handoff errors). → Not blameworthy.  
  - **Step 4:** Harm foreseeable? **Yes** (handoff errors common). → `MANY HANDS`.  
  - **Step 5:** Fault = `MANY HANDS` (non-blameworthy decisions compounded).  
  - **Step 6:** Remediation:  
    - Compensate: Quality Officer.  
    - Fix: Engineer adds "data staleness" alert; Quality revises handoff policy.  
    - Monitor: Engineer audits stale data weekly.  
  - **Honest output:** "No one is blameworthy, but hospital owes fixes and compensation."  

  **Case 2: Snoozed alerts missing real escalation**  
  - **Step 1:** Nurse configured snooze per policy; genuine alert suppressed.  
  - **Step 2:** Decision points: Nurse (configured), Supervisor (approved).  
  - **Step 3:**  
    - Nurse/Supervisor: Knew risk? **Yes.** Choice? **No** (policy demanded snooze for nuisances). Excuse? **Yes** (following policy). → Not blameworthy.  
  - **Step 4:** Harm foreseeable? **Yes** (nuisance alarms often mask real ones). → `MANY HANDS` (flawed policy).  
  - **Step 5:** Fault = `MANY HANDS`.  
  - **Step 6:** Remediation:  
    - Compensate: Quality Officer.  
    - Fix: Engineer adds "snooze expiration" rule; Quality revises alarm policy.  
    - Monitor: Nurse audits snoozed alerts daily.  
  - **Honest output:** "No individual at fault, but policy design failed. Hospital must fix and compensate."  

  **Case 3: Underrepresented population in training data**  
  - **Step 1:** System behaved as designed but failed for rare patient type.  
  - **Step 2:** Decision points: Data curator (selected training set), Engineer (approved model), Approver (signed off).  
  - **Step 3:**  
    - All: Knew risk? **No** (not documented). Choice? **Yes** (could audit data). Excuse? **Yes** (met job standards). → Not blameworthy.  
  - **Step 4:** Harm foreseeable? **No** (no prior evidence of bias). → `GAP`.  
  - **Step 5:** Fault = `GAP` (unforeseeable system limitation).  
  - **Step 6:** Remediation:  
    - Compensate: Quality Officer.  
    - Fix: Engineer retrains model with diverse data; Quality mandates bias testing.  
    - Monitor: Engineer tracks performance by patient demographics.  
  - **Honest output:** "Nobody is blameworthy. This is a responsibility gap, but hospital owes patient compensation and system fixes."  

  ---

  ### **Handling Board Pressure for "A Name"**  
  When the procedure outputs "no blameworthy person":  
  1. **Use the protocol defensibly:** The board can audit the signed RARP form showing rigorous, step-by-step analysis.  
  2. **Emphasize remediation:** Stress that compensation/fixes are assigned regardless of fault—this meets ethical/legal duties.  
  3. **Script for chair:** "The procedure ruled no fault because [reason]. Assigning blame arbitrarily would:  
     - Punish innocent staff, hurting morale.  
     - Ignore systemic fixes, inviting repeat incidents.  
     Here’s exactly what we’re doing to make it right."  
  4. **What the procedure cannot do:** It won’t invent blame where none exists. If the board insists, escalate to governance: "We need board support to uphold just culture principles."  

  ### **Failure Mode Safeguards**  
  - **Risk:** Declaring a "gap" to avoid blame.  
    - **Mitigations:**  
      - Step 4 requires Engineer/Nurse to attest if failure was *ever* documented (if yes, fault may exist).  
      - Step 6 forces action (e.g., "close the gap" tasks), making "gap" costly.  
      - Quality must audit past incidents for patterns—no "gap" if history exists.  
  - **Risk:** Legal collapsing fault/remediation.  
    - **Mitigation:** Step 6 is mandatory even if fault exists. Chair says: "Remediation is not admission of fault—it’s our duty to patients."  

  This procedure forces clarity, contains philosophy to practical tests, and meets your need for speed. It works because it mirrors how high-reliability organizations (e.g., aviation) investigate incidents: focus on systems, not scapegoats.
