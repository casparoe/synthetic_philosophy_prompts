    - *Scenario*: A person is convinced (based on bad intel) that a bridge is closed, so they tell a friend, "The bridge is closed, take the tunnel," to make them late. In reality, the bridge is open.  
    - *Split*:  
      - Under **Maya's rule** (factual falsity + intent): Statement is false ("bridge is closed" is incorrect), and they intend to deceive → **lying**.  
      - Under **Rival Rule 1** (belief-based): Speaker believes the statement is true (sincere mistake), so even with deceptive intent, it's **neither** (like the tour guide—"just wrong").  
      - Under **Rival Rule 2** (outcome-focused): If the friend might be deceived, it could be lying, but if the context makes deception unlikely (e.g., the friend knows the intel is unreliable), it might be neither.  

  This case isolates speaker belief vs. factual truth, forcing a choice. If Maya calls it "lying," she prioritizes objective falsity. If "neither," she prioritizes sincere belief. It also avoids the ambiguity of case 3 (where truth is unknown).

