  Based on Maya's track record, her rule for categorizing statements appears to hinge on two key elements: (1) the factual truth or falsity of the statement itself, and (2) the speaker's intent to deceive the listener. Here's a distilled version of her rule, derived from the cases you provided:

  ### Maya's Rule
  - **Lying**: The statement is **factually false**, and the speaker **intends to deceive** the listener (e.g., "I don't have a girlfriend" when he does—false and deceptive).
  - **Misleading-but-not-lying**: The statement is **factually true**, but the speaker **intends to deceive** by exploiting context, implication, omission, or the listener's likely misinterpretation (e.g., "I've been at the office since 8" when he ate leftovers at 7:30—true but deceptive through omission; "I'm not seeing anyone right now" when in a texting-only relationship—true but deceptive through literal interpretation).
  - **Neither**: There is **no intent to deceive**, regardless of truth value. This covers sincere mistakes (e.g., the tour guide's wrong dates) or cases where deception isn't seriously attempted because the context makes disbelief expected (e.g., the absurd fishing story—no one was meant to be fooled).

  This rule prioritizes objective truth over the speaker's belief (e.g., the tour guide believed her dates, so it's "neither," even if false). Intent to deceive is necessary for both lying and misleading; without it, it's "neither."

  Now, applying this rule to your four new cases:

  ### Predictions for Your Cases
  1. **Gambling on a date (guy claims he quit gambling but never gambled)**:  
     - **Maya's verdict: Lying**  
       The statement "I'm so glad I finally quit gambling" is factually false (he didn't "quit" because he never started), and he intends to deceive his date to appear reformed. This mirrors the "I don't have a girlfriend" case—a clear falsehood with deceptive intent.

  2. **Surprise party (woman truthfully says "Yes, we're all hiding in your kitchen" to deflect suspicion)**:  
     - **Maya's verdict: Misleading-but-not-lying**  
       The statement is factually true, but she intends to deceive the honoree into disbelieving it and concluding there's no party. This exploits context (the statement is so outrageous it's taken as a joke) to create a false impression, similar to the "I'm not seeing anyone" case—truth used as a tool for deception.

  3. **Supplement seller (claims "this will improve your focus" with no knowledge)**:  
     - **Maya's verdict: Lying**  
       The statement may be true or false, but the seller has no belief in its truth and intends to deceive for profit. Since Maya's rule focuses on factual falsity combined with deceptive intent, and the seller's recklessness implies the statement is likely false (or at least asserted without regard for truth), this aligns with lying. It's not "neither" because he intends to deceive, and not "misleading" because misleading requires a true statement (which isn't guaranteed here).

  4. **"I'll be there in five minutes" (guy knows it's twenty minutes)**:  
     - **Maya's verdict: Lying**  
       The statement is factually false (it's not a five-minute drive), and he intends to deceive (e.g., to avoid conflict or buy time). This is straightforward, like the "I don't have a girlfriend" case—a false assertion with clear deceptive intent.

  ### Rival Rules That Fit the Past Verdicts but Diverge on New Cases
  Maya's rule isn't the only one that explains her past judgments. Here are two rival interpretations that align with her track record but yield different outcomes for your cases, especially case 3 (the supplement seller). Both rivals modify the role of speaker belief:

  - **Rival Rule 1: Belief-Based Lying**  
    - **Definition**: Lying requires the speaker to **believe the statement is false** (not just that it's factually false). Misleading requires a true statement with deceptive intent. Neither applies if there's no intent or if the speaker believes the statement (even if false).  
    - **Fits past verdicts**:  
      - Girlfriend case: Speaker believes "I don't have a girlfriend" is false → lying.  
      - Leftovers/not-seeing-anyone cases: Statements are true, and speakers believe them → misleading.  
      - Tour guide: Believes her dates are true → neither.  
      - Fishing story: No intent to deceive → neither.  
    - **Divergence on new cases**:  
      - Case 3 (supplement seller): Seller has no belief about the statement's truth (doesn't think it's false, just doesn't care). Under this rule, it's **not lying** because he lacks belief in falsity. If the statement turns out true, it might be misleading; if false, it might be "neither" (since no belief). But with deceptive intent, this rule struggles—Maya might call it misleading or invent a new category, violating her consistency.  
      - Other cases: Same as Maya's rule (e.g., case 1: he believes "quit gambling" is false → lying; case 2: true statement → misleading; case 4: believes "five minutes" is false → lying).

  - **Rival Rule 2: Deception-Outcome Focus**  
    - **Definition**: Lying requires a false statement. Misleading requires a true statement with deceptive intent. But "neither" applies if **no reasonable person would be deceived**, regardless of intent.  
    - **Fits past verdicts**:  
      - Girlfriend case: False and deceptive → lying.  
      - Leftovers/not-seeing-anyone cases: True and deceptive → misleading.  
      - Tour guide: No intent → neither.  
      - Fishing story: No one would believe it → neither (even if intent existed, the context prevents deception).  
    - **Divergence on new cases**:  
      - Case 2 (surprise party): The woman's statement is true, but she relies on the honoree disbelieving it. Under this rule, if the honoree is unlikely to believe such an obvious "joke," it might be **neither** because no deception occurs (similar to the fishing story). But Maya's original rule would call it misleading due to intent.  
      - Case 3 (seller): If customers are skeptical (e.g., at a farmers market), it might be "neither" if deception is unlikely. But with intent, this could conflict.  
      - Other cases: Mostly same (e.g., case 1: false → lying; case 4: false → lying).

  ### Which Case is Likeliest to Make Maya Hesitate or Contradict Herself
  **Case 2 (surprise party) is the likeliest to cause hesitation.** This is a high-stakes edge case where a true statement is used to create a false belief through reverse psychology. Maya might waver because:
  - It strongly resembles her misleading cases (true statement + intent to deceive), but the mechanism—expecting disbelief to achieve deception—adds a layer of irony. She could argue it's "misleading" (as predicted) but might second-guess if the direct truth-telling feels less manipulative than omissions or implications. Alternatively, if she focuses on the honoree's likely reaction (no deception occurs because the joke is obvious), she might lean toward "neither," contradicting her intent-based rule. This case probes the boundaries of "intent to deceive" in a way her past cases don't.

  Case 3 (supplement seller) could also cause minor hesitation due to uncertainty about the statement's truth, but it's less central to her pattern. Case 1 and 4 are straightforward under her rule.

