answer: |-
  You've hit on a profound tension at the heart of moral theology. Let's reconstruct the presuppositions of mental reservation, contrast it with rival views, and examine its secular parallels.

  ### Core Presuppositions of Mental Reservation:
  1.  **Augustine's Definitional Core:** It *entirely* adopts Augustine's definition: **Lying is strictly the utterance of a statement *contrary to one's mind*.** If the words match what's in the speaker's mind (however privately qualified), no lie has occurred.
  2.  **Rejection of Augustine's Broader Harm Principle:** It *rejects* Augustine's core reason *why* lying is wrong: the intrinsic harm of deception to the neighbor and the social fabric ("*mendacium enim non est nisi falsa significatio cum voluntate fallendi*" - a lie is nothing else than a false signification with the will to deceive). Mental reservation deliberately *intends* to deceive the listener through ambiguity.
  3.  **Shift in the Locus of Sin:** The sinfulness of lying is relocated *exclusively* to the **internal act of the will** – the choice to utter words one *knows* to be false in one's own mind. Deception *caused* by true (but misleading) statements isn't inherently sinful under this view.
  4.  **God as the Primary Audience:** The ultimate duty of truthfulness is owed *vertically* to God, not *horizontally* to the hearer. As long as the speaker's words are internally true *before God*, the obligation is fulfilled, regardless of whether the hearer is misled. The sin is against divine truth, not necessarily against human trust.
  5.  **Intentional Ambiguity as Morally Neutral:** The act of crafting or exploiting ambiguous language (equivocation) is not sinful *per se*. The moral weight rests solely on the internal truthfulness of the utterance.

  ### Mental Reservation vs. Rival Views of Lying:
  *   **Augustine (Full View):** **Ruled Out.** Mental reservation violates Augustine's prohibition on *intending to deceive*, even if using technically true words. For Augustine, the *will to deceive* is inseparable from the sin.
  *   **Kantian/Deontological (Intention/Autonomy):** **Ruled Out.** Kant condemns lying because it treats the hearer as a mere means, violating their autonomy and rationality by subverting their capacity for informed consent. Mental reservation is a *paradigm* of manipulation; it deliberately uses the hearer's reasonable interpretation of language against them. The speaker exploits the hearer's trust in communication.
  *   **Consequentialist (Harm/Outcomes):** **Compatible *if* justified.** A consequentialist judges lying by its results. Mental reservation *might* be permissible (even praiseworthy) if it prevents great harm (saving a life) and causes minimal harm (frustrating a pursuer). However, it could be condemned if it erodes trust in communication generally. Mental reservation *doesn't presuppose* consequentialism; it operates deontologically on the speech-act level, but its *use* is often justified consequentially.
  *   **Deception-Centric View (Inducing False Belief):** **Ruled Out.** If the core wrong of lying is *intentionally causing another person to have a false belief*, then mental reservation is clearly lying. Its entire purpose is to induce a specific false belief ("The priest isn't here") through carefully crafted ambiguity. The "internal truth" is irrelevant to the harm of the induced false belief.

  ### Mental Reservation Under a Deception-Centric View:
  If the wrong of lying is located in the *intentional deception* (inducing a false belief), then mental reservation **collapses entirely into plain lying with extra steps.** The elaborate internal mental gymnastics ("He hasn't been here... in the last 5 minutes," "He hasn't been seen... in my dreams") are simply mechanisms *to enable the speaker to deceive while maintaining subjective psychological comfort*. The external act – intentionally causing the hearer to believe something false – is identical to straightforward lying. The "reservation" becomes a self-deceptive fig leaf. The core wrong (intentional deception) is fully present.

  ### The Everyday Version: Cheaper Defenses?
  The "not here" (friend in attic) or "I've been out" (teen hiding) examples *do* come apart from strict mental reservation, and their defense requires much "cheaper" (less theologically loaded) grounds:

  1.  **Consequentialism (Minimal Harm/Necessity):** The deception prevents immediate, significant harm (death, severe punishment) with minimal long-term damage. The harm of deception is outweighed. This doesn't require "internal truth"; it justifies the *deception itself* based on outcomes.
  2.  **Contextual Expectation & Partial Truth:** These statements rely on shared understandings of conversational context. "Not here" might reasonably imply "not in the main living areas" in an emergency, not a literal ontological claim about the property. "I've been out" might imply "outside the house recently" rather than "continuously absent." The speaker exploits plausible ambiguity *within the assumed context*, hoping the hearer shares the same unspoken frame. This is more about pragmatic implicature than divine accounting.
  3.  **Duty Conflict & Proportionality:** There's a conflict between the duty not to lie/deceive and a higher duty (preserving life, protecting the vulnerable). The deception is seen as the lesser evil or the necessary means to fulfill the overriding duty. This justification focuses on the *act* of deception in a dilemma.
  4.  **Rejection of Absolutism:** A simple rejection of the Augustinian/Kantian absolute prohibition. Deception might be *prima facie* wrong but permissible or even obligatory in extreme circumstances to prevent greater harm, without needing linguistic gymnastics to declare it "not a lie."

  **Where They Come Apart:**

  *   **Theological Scaffolding:** Strict mental reservation *requires* the Augustinian *definition* (no internal falsehood = no lie) and the vertical duty to God. Everyday evasion usually dispenses with this; it often accepts the act *is* deceptive but justifies it.
  *   **Internal Truth vs. Justified Deception:** The priest *must* maintain internal truthfulness to avoid sin. The person hiding a friend might utter a straightforward falsehood ("No, he's not here") and justify it based on consequences or duty-conflict, without needing any private mental reservation.
  *   **Purpose of the "Trick":** Mental reservation aims to *technically satisfy divine truthfulness law* while achieving deception. Everyday evasion aims to *achieve a necessary outcome* (safety) and accepts deception as the means, perhaps regrettably.

  **In essence:** Mental reservation is a *theological loophole* predicated entirely on a specific definition of lying and a vertical duty to God. The everyday practices are *ethical justifications for deception* based on consequences, context, conflicting duties, or a rejection of absolutism, operating on much "cheaper," pragmatic, and often horizontal (human-focused) grounds. Mental reservation tries to have its cake (deceive the pursuer) and eat it too (remain truthful before God). Everyday evasion often accepts it's eating the cake (deceiving) but argues it was the only food available (necessary under the circumstances).
