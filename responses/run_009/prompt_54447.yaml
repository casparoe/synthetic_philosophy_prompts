prompt: |-
  I'd like to know whether decision theory has an established name for a certain kind of gamble, and if it does, exactly what the name covers — I'm not looking for a bare label, since a label without boundaries won't help me.

  Two concrete instances of what I mean. First, the classic game in which a fair coin is flipped until it lands heads, and if the first heads is on flip n, you are paid 2^n dollars. If you compute the average payoff in the obvious way, multiplying each possible payoff by its probability and adding everything up, the sum never converges: every term is just 1, forever. I'm told this game has a name, and at least its oddness is definite — the average is "too big," full stop.

  Second, and this is the case I actually care about: modify that game so that if the first heads is on flip n, you gain 2^n / n dollars when n is odd and lose 2^n / n dollars when n is even. The terms you add up now go roughly +1, −1/2, +1/3, −1/4, and so on, and summed in the natural order they converge to a specific number. But if you reorder the bookkeeping — tally several of the gains first, then their matching losses, then further gains — you can make the "average" come out to a different number, or drift around without settling. I remember from calculus that a series with this property, where the gains and the losses are each unbounded on their own, can be rearranged to sum to anything whatsoever, and that this is a theorem rather than a trick. So the number I compute isn't a property of the gamble at all; it's a property of how I happened to list the outcomes, and there appears to be no privileged way to list them.

  So my question is this. Is there an established term for the second kind of case — a bet that seems to have a well-defined expected value until you notice that the value depends on the (arbitrary) order in which the outcomes are enumerated? If so, how is it distinguished from the first kind, where the expectation is merely divergent rather than manipulable? Are the two treated under one heading, or are they importantly different — one having no value and the other having too many? And what about intermediate cases: gains summing to something finite while losses are unbounded, or games whose average exists but whose spread does not? Where do those fall?

  If the field has no name for the class I'm pointing at, I'd like you to coin one. Define it precisely enough that I can tell which games fall inside and which merely resemble the ones inside; say how it differs from the nearest established concepts, whatever they turn out to be; and say something about whether the standard repair strategies I've heard suggested — capping the number of flips, summarizing a gamble by something other than its average, treating the enumeration order as part of the gamble's description — actually dissolve the problem or merely relocate it. What I need is the carving, not the name.
reasoning: |-
  Okay, the user is asking about decision theory concepts related to gambles with problematic expected values. They describe two scenarios: the St. Petersburg paradox (divergent expectation) and a modified version with conditionally convergent payoffs. 

  The user clearly understands the mathematical nuances - they recognize conditional convergence and rearrangement implications in the second gamble. Their frustration with "bare labels" suggests they've encountered superficial terminology before. They want precise conceptual boundaries.

  Hmm... the core distinction is between:
  - Type 1: Absolutely divergent expectation (St. Petersburg)
  - Type 2: Conditionally convergent expectation (their modified game)
  These require different handling in decision theory.

  For Type 2, the term "expectation-ambiguous gamble" feels accurate. Key features:
  - Payoff series is conditionally convergent
  - Absolute payoff sum diverges
  - Expected value depends on summation order
  - No canonical ordering exists

  This differs from St. Petersburg where no finite expectation exists at all. The user's intermediate cases (partial convergence) would also fall under Type 2 if the absolute series diverges.

  About solutions:
  - Capping flips resolves both but changes the gamble
  - Using risk measures (like median payoff) avoids the issue
  - Specifying summation order is arbitrary but possible
  - The deeper problem is that expectation loses its meaning here

  The user's insight about "relocating rather than solving" the problem is sharp - any "fix" either alters the gamble or uses different decision criteria. The ambiguity is inherent when absolute expectations diverge.

  Should emphasize that in Type 2, it's not that the gamble has no value, but that expectation fails to capture it uniquely. Decision theory would recommend alternative evaluation methods here.
answer: |-
  Based on your detailed description and need for conceptual precision, decision theory *does* have established concepts and distinctions for these phenomena, but the specific "class" of the second gamble requires careful framing. Here's the carving:

  1.  **First Gamble (St. Petersburg Paradox):** This is the canonical example of a gamble whose **expected value is infinite** or **divergent in the absolute sense**.
      *   **Name:** St. Petersburg Paradox.
      *   **Key Feature:** The series Σ (Payoff_n * Probability_n) diverges to positive infinity. Every term is positive, and the partial sums increase without bound. There is *no* finite number that can represent its expected value under the standard definition. The "oddness" is definite: the expectation *does not exist* as a finite number. Any finite price paid to play seems "too small" in comparison to the potential (though vanishingly likely) massive payoffs.

  2.  **Second Gamble (Your Modification):** This is a gamble whose **expected value is conditionally convergent**.
      *   **Established Name:** While there isn't a single universally applied *label for the gamble itself* like "St. Petersburg," the core phenomenon is described by the mathematical property of the payoff series: **Conditional Convergence** of the expected value series.
      *   **Precise Definition:** A gamble falls into this class if and only if:
          1.  The series Σ (Payoff_n * Probability_n) converges when summed in the *natural order* implied by the state space description (e.g., n=1,2,3,...).
          2.  The series Σ |Payoff_n * Probability_n| *diverges* (i.e., the series is not absolutely convergent).
      *   **Key Feature & Distinction:** The expectation series converges *only* because of the cancellation between positive and negative terms. Crucially, this convergence is *order-dependent*. Rearranging the order of summation (which corresponds to reordering how the mutually exclusive outcomes are "tallied") can make the sum converge to *any real number whatsoever*, or diverge to positive or negative infinity. **The expected value, as defined by the infinite sum Σ p_n * x_n, is not well-defined for this gamble.** It is mathematically indeterminate based on the standard definition. This is fundamentally different from the St. Petersburg gamble, where the series *diverges absolutely* (all terms positive, sum always increases).

  3.  **Intermediate Cases:** Your question about gains summing finitely while losses are unbounded (or vice versa) is directly addressed:
      *   If Σ (Positive Payoff_n * Probability_n) converges to a finite value *P*, but Σ (Negative Payoff_n * Probability_n) diverges to negative infinity (i.e., the sum of absolute values of *losses* diverges), then the overall expectation Σ (Payoff_n * Probability_n) diverges to negative infinity. This is **absolutely divergent** (towards negative infinity).
      *   Similarly, if gains diverge positively and losses converge, expectation diverges positively.
      *   If *both* the sum of positive terms *and* the sum of negative terms diverge individually (as in your modified gamble), but their combination in a specific order converges, then it is **conditionally convergent**.
      *   "Games whose average exists but whose spread does not" typically refers to distributions with **infinite variance** but finite mean (e.g., the Cauchy distribution has *neither*, Pareto distributions with α>1 have finite mean but can have infinite variance if 1<α≤2). This is a distinct issue related to higher moments, not the fundamental existence of the mean itself.

  4.  **Nearest Established Concepts & Distinctions:**
      *   **Finite Expectation:** Σ |p_n * x_n| < ∞. Mean is well-defined, unique, and order-independent.
      *   **Absolutely Divergent Expectation:** Σ |p_n * x_n| = ∞, and the partial sums of Σ p_n * x_n diverge monotonically (e.g., St. Petersburg). No finite mean exists.
      *   **Conditionally Convergent Expectation:** Σ |p_n * x_n| = ∞, but Σ p_n * x_n converges for the natural ordering. Mean is not well-defined due to order dependence (Your modified gamble).
      *   **Riemann Series Theorem:** This is the foundational mathematical theorem guaranteeing that any conditionally convergent series can be rearranged to converge to any real number or diverge. This is the source of the ambiguity.

  5.  **Coining a Term (if needed):** While "conditionally convergent expectation" is precise mathematically, a more evocative term for the *gamble itself* could be an **Expectation-Ambiguous Gamble**.
      *   **Definition:** A gamble where the standard calculation of expected value E[X] = Σ p_i * x_i yields a conditionally convergent series. Consequently, the value obtained for E[X] depends critically on the (arbitrary) order in which the probabilities and payoffs are enumerated, rendering the standard expected value mathematically indeterminate.
      *   **Boundaries:** A gamble is Expectation-Ambiguous iff:
          *   The state space is countable.
          *   Σ |p_i * x_i| = ∞ (Absolute divergence).
          *   There exists an ordering of the states where Σ p_i * x_i converges (Conditional convergence).
      *   **Exclusion:** St. Petersburg is absolutely divergent, *not* expectation-ambiguous. A gamble with finite expectation is well-defined. A gamble where Σ p_i * x_i diverges *monotonically* (e.g., only positive terms diverging) is absolutely divergent, not expectation-ambiguous.

  6.  **Do Repair Strategies Dissolve or Relocate the Problem?**
      *   **Capping Flips (Finite Horizon):** This *dissolves* the mathematical problem by creating a finite gamble with a definite, order-independent expectation. However, it fundamentally *changes* the gamble being analyzed. The infinite gamble's properties are lost.
      *   **Alternative Decision Criteria (e.g., Median, Certainty Equivalent, Utility Functions):** This *dissolves* the reliance on expectation. Using a utility function with diminishing marginal utility (a standard fix for St. Petersburg) often renders the expectation finite and well-defined even for the original infinite gambles, *provided* the utility series converges absolutely (e.g., bounded utility, or sufficiently fast-growing risk aversion). Criteria like median payoff might be definable but may not capture the gamble's risk adequately.
      *   **Specifying Enumeration Order:** This *relocates* the problem. It makes *a* number computable, but the choice of order is arbitrary. There is no rational principle (beyond convention or convenience) to prefer the "natural" order (n=1,2,3,...) over any other ordering that yields a different sum. The ambiguity is inherent in the gamble's description; forcing an order adds external structure not present in the gamble itself.

  **Conclusion:** The established concept for your second gamble is the **Conditional Convergence of the Expected Value Series**. The core issue is that the standard definition of expected value fails for such gambles because the result depends on the arbitrary order of summation. This is fundamentally distinct from the St. Petersburg Paradox, where the expectation diverges absolutely. The term **Expectation-Ambiguous Gamble** precisely captures the essence of this failure for decision-making under the standard expected value paradigm. Repair strategies either alter the gamble (capping), abandon expectation (alternative criteria), or impose an arbitrary resolution (specifying order), but they do not eliminate the inherent mathematical indeterminacy of the expectation for the infinite gamble as originally defined.
