prompt: |-
  I'm a backend engineer and my girlfriend is doing a master's in synthetic bio, and for like two years now we've had this running argument about what actually counts as "alive." The annoying thing is she's not a vitalist or anything mystical about it, she just has these very firm case-by-case verdicts that she can't seem to state as a rule, and I keep trying to reverse-engineer the rule from her answers the way I'd try to figure out what a legacy system is actually doing (nobody remembers the spec, you just have the behavior). So here's her track record, as best I've collected it: E. coli, obviously alive. Flu virus, not alive. A mule, alive, even though it's completely sterile. A worker bee, also sterile, also alive. A prion, not alive. A single one of my skin cells, alive, which honestly surprised me since it can't survive on its own. A dormant bacterial endospore, alive even after sitting in a crystal salt grain for thousands of years. A self-replicating set of clay crystals in a beaker, not alive. A frozen eight-cell embryo, alive. A HeLa cell that's been in a freezer since the 70s, alive.

  So the obvious candidate is something like "has its own metabolism / self-maintains" versus something like the NASA-ish "self-sustaining chemical system capable of Darwinian evolution" versus maybe some lineage-based thing where being part of an evolving reproducing population is what matters. The mule verdict seems to kill off a pure "must be able to reproduce yourself" rule but maybe not the lineage version. And the skin cell verdict rules out anything requiring independent existence. I genuinely can't tell which rule she's actually running, and she refuses to just tell me, she says the whole point of her thesis work is that the boundaries are where the interesting stuff is.

  Anyway, in a few weeks she's presenting her lab's work and I want to ambush her afterward with three cases where I think the candidate rules actually give different answers. Case one: a synthetic protocell her group built, basically a lipid vesicle with an encapsulated reaction network that takes in nutrients, maintains itself, grows, and divides -- but it has no genome, nothing heritable, the daughters are basically just random chunks, so there's nothing for selection to act on. Case two: mimivirus, those giant viruses that carry genes for stuff like translation that everyone used to think only cells had, and which even get infected by smaller viruses themselves. Case three: an RNA strand that replicates and evolves in a test tube, but only because the researchers supply all the enzymes and nucleotides, so it's "evolving" but only by freeloading off the setup. Can you predict her verdicts on each of the three from her track record, lay out which rules fit that track record equally well and what each one says about my three cases, give me your best guess at her actual answers with the reasoning, and tell me if there's some further case -- maybe something weirder than what I've got -- that would really cleanly separate the metabolism rule from the evolution rule from the lineage rule? I'd rather ask her one question that corners her than three that let her keep dodging.
reasoning: |-
  Okay, let me try to unpack this user's problem. He's a backend engineer, and his girlfriend is in synthetic biology. They've been arguing for two years about what counts as "alive." She gives case-by-case verdicts but won't state a general rule. He's collected her judgments on various biological entities and wants to predict her answers on three new cases.

  First, I need to analyze her existing verdicts. She considers E. coli alive, flu virus not, mule and worker bee alive despite sterility, prion not alive, skin cell alive even though it can't survive alone, dormant endospore alive, clay crystals not alive, frozen embryo alive, and frozen HeLa cell alive. 

  Looking at these, reproduction isn't absolute since sterile organisms are alive. Independent survival isn't necessary either, as skin cells count. Dormancy doesn't disqualify, shown by endospores and frozen cells. The key seems to be metabolic activity or the potential for it. The skin cell has metabolism, the endospore will resume it, the frozen cells can be revived. Non-living things like viruses, prions, and clay crystals lack this.

  Now for his three cases. The protocell maintains itself and divides but has no heritability. If metabolism is key, she might call it alive, but without evolution, it might not fit the Darwinian definition. Mimivirus has complex genes but still relies on a host for replication. Since she deemed flu virus not alive, mimivirus might fall in the same category despite its complexity. The RNA strand evolves with external help. It's replicating and evolving but can't sustain itself. Her verdict on the flu virus suggests freeloading might not count, so she'd likely say not alive.

  To corner her, he needs a case that separates metabolism from evolution. A synthetic cell with metabolism but no heritability versus one that evolves but lacks metabolism. Or a zombie cell with active metabolism but no replication capability. That might force her to prioritize one criterion over the other.

  His deeper need is to understand her reasoning pattern and have a decisive question that clarifies her stance. He wants to resolve their long-standing debate by exposing the boundary she uses. The zombie cell scenario could be perfect because it pits metabolism against reproduction directly.
answer: |-
  Based on your girlfriend's track record and the synthetic biology context (where boundaries *are* the point), her underlying rule is likely **"Possesses integrated, self-maintaining metabolic activity (even if latent/dormant or dependent on a host/organism)."** Reproduction/heritability is secondary to *maintaining a distinct, persistent chemical "self"*.

  Here's the breakdown, your three cases predicted, the rules clash, and the killer question:

  ### Decoding Her Rule from the Track Record
  1.  **Metabolism/Self-Maintenance is Paramount:**
      *   *For:* E. coli (active metabolism), skin cell (metabolism within organism), endospore (latent metabolism/potential), embryo (latent potential), HeLa cell (latent potential/freezer). The *potential* to resume metabolism matters deeply.
      *   *Against:* Flu virus (no metabolism, just assembly), prion (no metabolism, just misfolding), clay crystals (no metabolism, just physical growth).
  2.  **Reproduction/Heritability is NOT Required:**
      *   Explicitly shown by Mule & Worker Bee (sterile but metabolizing).
      *   Embryo & HeLa cell verdicts emphasize potential *existence/continuity* over immediate reproductive *capability*.
  3.  **Independent Existence is NOT Required:**
      *   Explicitly shown by Skin Cell (utterly dependent on the body).
  4.  **Latency/Potential is Sufficient:**
      *   Explicitly shown by Endospore, Frozen Embryo, Frozen HeLa Cell. The integrated system persists *in a state where metabolic activity can resume*.

  **Her Probable Rule:** *"An entity is alive if it is, or has the inherent potential to be, an integrated system capable of self-sustaining metabolic processes that maintain its internal organization and boundary against entropy, regardless of reproductive capability or current dormant state."*

  ### Prediction for Your Three Cases (Based on Her Rule)
  1.  **Synthetic Protocell (Metabolism, No Heritability): ALIVE**
      *   **Why:** It has the core feature: an integrated system performing self-sustaining metabolic processes (taking nutrients, maintaining itself, growing). The lack of heritability makes it evolutionarily dead-end, but *her track record shows reproduction isn't essential for being "alive"*. It maintains its "self" metabolically.
  2.  **Mimivirus: NOT ALIVE**
      *   **Why:** Despite its giant size and translation genes, it still fundamentally lacks its *own* integrated metabolic network. It relies entirely on hijacking the host cell's metabolism for replication and assembly. It's a very complex parasite, but still just instructions + capsid. Her flu virus verdict sets the precedent: no metabolism = not alive, regardless of complexity.
  3.  **Freeloading Evolving RNA Strand: NOT ALIVE**
      *   **Why:** While it replicates and evolves, it lacks any integrated metabolic activity *of its own*. It's entirely dependent on the externally supplied enzymatic machinery and building blocks. It's a replicating molecule within an artificial system, not a self-maintaining entity. This is analogous to the flu virus freeloading on a cell, just in a test tube.

  ### How the Candidate Rules Compare & What They Say About Your Cases

  | Rule Type                 | Fits Her Track Record? | Protocell Verdict | Mimivirus Verdict | RNA Strand Verdict |
  | :------------------------ | :--------------------- | :---------------- | :---------------- | :----------------- |
  | **Metabolism/Self-Maintenance (Her Likely Rule)** | ✅ Perfectly           | Alive             | Not Alive         | Not Alive          |
  | **Lineage (Part of Evolving Population)** | ❌ Mostly (Fails Mule/Bee/Embryo/Skin/HeLa) | **Not Alive**     | **Alive?**        | **Alive?**         |
  | **NASA (Self-Sustaining + Darwinian Evolution)** | ❌ Mostly (Fails Mule/Bee/Skin/HeLa/Protocell) | **Not Alive**     | **Not Alive**     | **Alive?**         |

  *   **Lineage Rule:** Struggles with her "alive" verdicts on sterile, frozen, or dependent entities (Mule, Bee, Skin Cell, Embryo, HeLa) which aren't *currently* part of an evolving lineage. It would likely say Protocell=Not Alive (no lineage), Mimivirus=Alive? (part of viral lineage), RNA Strand=Alive? (evolving lineage in the tube).
  *   **NASA Rule:** Fails spectacularly on Mule, Bee, Skin Cell, Embryo, HeLa (lack self-sustaining capability or Darwinian evolution at the individual level). It would say Protocell=Not Alive (no evolution), Mimivirus=Not Alive (not self-sustaining), RNA Strand=Alive? (arguably a Darwinian system in the tube).

  ### The Killer Question to Corner Her
  Forget your three cases for the ambush. To truly separate **Metabolism** from **Reproduction/Evolution**, ask her about:

  **The "Zombie" Synthetic Cell:**
  > "Imagine we create a synthetic cell. It has a full metabolic network: it takes in nutrients, generates ATP, builds its own macromolecules, maintains its internal pH and ion concentrations, repairs damage, and actively maintains its membrane. However, it has a *deliberate, irreversible genetic block* – it **cannot replicate its genome or divide.** It will metabolize vigorously until it eventually wears out and dies. Is it alive *while* it's metabolizing?"

  *   **Why This Corners Her:**
      *   **Metabolism Rule (Predicted: YES):** It has active, integrated, self-maintaining metabolism. This is the core function her track record prioritizes. The endospore was alive *without* active metabolism, this is alive *with* it. The skin cell is alive despite dependence; this is independent.
      *   **Reproduction/Lineage/Evolution Rules (All: NO):** It cannot reproduce. It cannot contribute to a lineage. It cannot evolve. It's an evolutionary dead-end by design.
      *   **Clashes with Her Own Cases?** It's more autonomous than a skin cell or frozen cell *while active*. It lacks only what the Mule and Worker Bee lack (reproduction), but is *more* alive than a dormant endospore by her standards. If she says "No," she must explain why active, independent metabolism isn't sufficient, contradicting the weight of her prior judgments (especially skin cell and the emphasis on latency/potential implying metabolism is the core). If she says "Yes," she admits reproduction isn't necessary, nailing down her rule.

  This question forces a direct confrontation between the primacy of metabolism (her consistent pattern) and the necessity of reproduction/evolution (which her track record consistently downplays). Her answer here will be far more revealing than predictions on your three cases and will finally expose the boundary she's defending. Good luck with the ambush!
