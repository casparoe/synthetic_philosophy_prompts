prompt: |-
  A friend of mine who works on reinforcement learning spent most of last evening trying to convince me that inverse reinforcement learning — and, more generally, any attempt to infer what someone wants from what they do — is empty as an empirical enterprise. We argued for hours, and although I left convinced he must be wrong somewhere, I could not say where. Here is his argument as best I can reconstruct it:

  (1) Inferring preferences from behavior requires a linking assumption connecting the two: that people tend to act optimally, or nearly so, with respect to what they want.
  (2) A linking assumption earns its keep only if it can fail — only if some possible patterns of behavior would be inconsistent with it.
  (3) For any finite record of behavior, however strange, there exists a preference assignment relative to which every observed choice is optimal: if nothing else, assign high value to precisely the actions chosen and low value to everything else that was available.
  (4) So for any behavior there is some way of satisfying the linking assumption; hence the assumption never rules anything out.
  (5) An assumption that never rules anything out is evidentially inert: no possible observation could ever count against the hypothesis that a person has a given preference, so observing behavior can never raise or lower the credibility of any hypothesis about preferences.
  (6) Therefore what an IRL system — or an economist reading preferences off consumer choices — outputs is fixed entirely by the assumptions built in at the start; the data contribute nothing. Preference inference is a ritual for restating one's priors in the past tense.

  His conclusion strikes me as too strong, and yet each step survived when I pressed him. I did try one objection: that in practice we don't allow arbitrary preference assignments, but only some restricted, reasonably simple class, and that within such a class plenty of behaviors cannot be rationalized. He answered that in that case whatever constraint exists comes from the restriction I chose, not from the data — I have merely moved my prior into the hypothesis class, which concedes his point. I could not find a reply to that.

  I have my suspicions about the move from (3) to (4), and again from (4) to (5), but I cannot articulate what slips. Tell me which step to reject, why that step looked unassailable, and what rejecting it costs. If more than one step could plausibly go, say which rejection is cheapest and what the alternatives pay. And please address his reply to my objection directly: if the constraint on inference comes from a restricted hypothesis class rather than from the data, has he shown that the data are doing no work — or has he traded one distinction (between assumption and evidence) for another that does not hold? For what it is worth, I would like to keep (1) and the general idea that choice is evidence of preference; I am prepared to give up a good deal else to preserve them.
reasoning: |-
  We are given an argument that inverse reinforcement learning (IRL) and similar preference inference methods are empirically empty. The argument proceeds in six steps, and we are to find which step is the weakest and why. Additionally, the friend has a reply to an objection about restricting the hypothesis class.

  Let me reconstruct the argument:

  (1) We need a linking assumption: people act optimally (or nearly so) with respect to their preferences.

  (2) The linking assumption must be falsifiable: some behaviors must be inconsistent with it.

  (3) For any finite set of observed behaviors, there exists a preference assignment that makes the observed choices optimal (by assigning high value to the chosen actions and low to others).

  (4) Therefore, the linking assumption (as stated) never rules out any behavior (because for any behavior, we can find a preference that makes it optimal).

  (5) Hence, the linking assumption is evidentially inert: no observation can count against any particular preference hypothesis.

  (6) Therefore, IRL (and similar methods) are empty: the output is fixed by prior assumptions, and the data contribute nothing.

  The friend's reply to the objection (that we restrict the class of preferences) is that then the constraint comes from the restriction (i.e., the prior) and not from the data, so the data still do no work.

  We are to reject one or more steps and explain why, and also address the reply.

  My thoughts:

  The critical step is (3). It claims that for any finite record of behavior, we can always find a preference that rationalizes it. The example given is to assign high value to the chosen actions and low value to the rest. But note: in IRL and economics, we typically consider preferences over outcomes (states) or over trajectories, not just over actions in isolation. Moreover, preferences are usually assumed to have some structure (like being defined by a reward function over states) and to be stationary (not changing arbitrarily with time). The example in (3) uses a preference that is defined arbitrarily per action and per choice set, which is not how preferences are typically modeled.

  However, the friend might counter that we are allowing any preference assignment, no matter how arbitrary. So if we allow preferences that are non-stationary and defined arbitrarily for each choice, then indeed we can always rationalize.

  But step (4) then says that because we can always find such a preference, the linking assumption never rules anything out. This step is also problematic because the linking assumption typically includes more than just the existence of some preference: it includes that the preference is fixed (not changing arbitrarily) and that the agent is acting optimally with respect to that fixed preference over time. The example in (3) uses a preference that is defined after the fact and is not fixed: it changes to fit each observation arbitrarily. So if we require the preference to be fixed (i.e., the same for all time and across different choice sets), then not every behavior can be rationalized.

  Moreover, step (3) only considers a finite set of observations. But the linking assumption might be about the entire behavior, not just the finite set. However, the argument is about empirical testing, which is always based on finite data.

  But let's consider step (2): the linking assumption must be falsifiable. The friend claims that for the linking assumption to be useful, it must be possible for some behavior to violate it. However, if we can always find a preference to rationalize any behavior (as in step 3), then the linking assumption (that there exists a preference for which the behavior is optimal) is never falsified by any finite data. But note: the linking assumption in (1) is not just that there exists some preference, but that the agent is acting optimally with respect to their preference. If we interpret the linking assumption as "there exists a fixed preference such that the agent always acts optimally with respect to it", then we have a stronger requirement.

  The key point is that without constraints on the preference (like being fixed and defined in a way that is not observation-dependent), the linking assumption is indeed unfalsifiable. But if we impose constraints (like stationarity, or that the preference is defined by a reward function over states that is fixed and not action-dependent in an arbitrary way), then it becomes falsifiable.

  Now, the objection we tried was exactly about restricting the class of preferences. The friend replied that then the constraint comes from the restriction (the prior) and not from the data. So the data still don't do any work? But that is not entirely correct.

  In the Bayesian framework, the data do work by updating the prior. If we have a restricted set of preferences, then the data can rule out some preferences in the set and support others. For example, if we assume the reward function is linear in some features, then different behaviors will lead to different inferences. The data do contribute: they change the posterior distribution.

  The friend might be thinking in a falsificationist framework: if the data cannot falsify the entire approach (because we can always add a new preference to the class to explain the data), then the data are not doing work. But in practice, we fix the hypothesis class in advance and then let the data update our beliefs within that class. The data can falsify specific hypotheses within the class.

  So let's break down:

  - Step (3) is true if we allow arbitrary preferences that can change arbitrarily and are defined per action. But that is not the typical setup.

  - Step (4) then claims that the linking assumption (as stated in step 1) never rules anything out. But the linking assumption in step (1) is: "people tend to act optimally with respect to what they want." This is a general statement. If we interpret it as requiring the existence of a fixed preference (that does not change arbitrarily) then step (3) does not hold because the example (assigning high value to chosen actions) produces a non-fixed preference: it depends on the choice set and the time.

  Therefore, step (3) is only true for preferences that are not constrained to be fixed and stationary. So the move from (3) to (4) fails because the linking assumption (as typically intended) requires the preference to be fixed. Hence, the example in (3) does not satisfy the linking assumption because it uses a preference that is defined ad hoc for each choice.

  But the friend might say: what if we allow non-stationary preferences? Then we can still rationalize everything. However, the linking assumption typically does not allow non-stationary preferences arbitrarily. We usually assume that preferences are fixed.

  So the issue is: what constraints are built into the linking assumption? The argument in step (3) exploits the lack of constraints. But in practice, we do have constraints.

  Now, the objection and reply: if we restrict the hypothesis class (to, say, stationary preferences with a fixed reward function), then the friend says that the constraint is from the prior and not the data. But that is not entirely accurate. The data still provide evidence within the constrained class. For example, if we have two possible stationary reward functions, R1 and R2, and we observe behavior that is optimal under R1 but not under R2, then the data support R1 over R2. The data are doing work.

  In the friend's example, if we don't restrict the class, then we can always rationalize, so the data don't help. But if we do restrict the class, then we can get evidence. The friend's reply is that the restriction is arbitrary and comes from the prior. But that does not make the data irrelevant. It just means that the prior (which includes the choice of hypothesis class) is important, and the data update the prior.

  The friend's argument seems to conflate the hypothesis class with the prior. The prior is a probability distribution over the hypothesis class. The data update that distribution. So the data do contribute.

  Moreover, without the data, we wouldn't have any update. So the data are essential.

  But the friend might be arguing from a falsificationist perspective: that if the entire framework (linking assumption plus the class of preferences) can never be falsified by any finite data, then it is empirically empty. However, that is not the case if we fix a class of preferences that is not universal. For example, if we take the class of linear reward functions, then there are behaviors that cannot be explained by any linear reward function (e.g., if the behavior is inconsistent with any linear function). Then the data can falsify the entire approach? But note: if we observe such behavior, we might conclude that the agent is not acting optimally with respect to any linear reward function. That would be a falsification of the linking assumption within that class. Alternatively, we might expand the class (e.g., to non-linear). But if we fix the class in advance, then we can falsify.

  In practice, we might expand the class if we see anomalies, but that is how science progresses.

  Now, which step to reject?

  I think step (4) is the weak link. Step (4) says: "So for any behavior there is some way of satisfying the linking assumption; hence the assumption never rules anything out."

  But the linking assumption is not just about the existence of some preference, but about the existence of a fixed preference that the agent is using over time. The example in step (3) does not use a fixed preference: it assigns values arbitrarily per action and per choice set. Therefore, it does not satisfy the linking assumption as intended. Thus, step (4) does not follow from step (3) because the linking assumption (as typically understood) requires the preference to be fixed and stationary. Therefore, the linking assumption does rule out behaviors that are inconsistent with any fixed preference.

  For instance, if an agent chooses A over B and then later chooses B over A in the same circumstances, that is inconsistent with a fixed preference (unless we introduce state variables, but if the circumstances are the same, then the state is the same). So step (3) fails for fixed preferences: we cannot always rationalize. The example in step (3) would assign high value to A in the first choice and high value to B in the second, but that is not a fixed preference.

  Therefore, step (3) is false if we require preferences to be fixed. And if we do not require that, then the linking assumption is indeed too weak. But in practice, we do.

  So the rejection of step (4) is because the linking assumption includes more than just the existence of a preference: it includes that the preference is fixed and that the agent is acting optimally with respect to that fixed preference. The example in step (3) does not meet this requirement.

  What does rejecting step (4) cost? It means that we must accept that the linking assumption does rule out some behaviors (namely, those that are inconsistent with any fixed preference). So the linking assumption is falsifiable.

  Now, what about the friend's reply to the objection? The objection was that we restrict the class of preferences. The friend replied that then the constraint comes from the restriction and not from the data. But we now see that even without an explicit restriction, the linking assumption (with the requirement of fixed preferences) already imposes a constraint. Moreover, when we do restrict the class (to, say, linear functions), then the data can rule out some preferences in that class. The data are doing work by allowing us to update our beliefs within the class.

  Therefore, the friend's reply is not entirely accurate because the data are not doing nothing: they are providing evidence that updates the prior distribution over the hypothesis class.

  Alternatively, we might reject step (5). Step (5) says that because the assumption never rules anything out (which we have disputed), it is evidentially inert. But even if we allow non-fixed preferences, the data might still update our beliefs. For example, if we have a prior over the space of non-fixed preferences, then the data update that prior. However, without constraints, the prior would need to be very structured to avoid overfitting.

  But the main rejection is of step (4).

  Conclusion:

  Reject step (4). Why? Because the linking assumption (as typically intended) requires that the preference is fixed and stationary. The example in step (3) does not satisfy this requirement because it uses a preference that is arbitrarily defined per choice. Therefore, the linking assumption can rule out behaviors that are inconsistent with any fixed preference.

  Why did step (4) look unassailable? Because if we interpret the linking assumption as only requiring the existence of some preference (without requiring it to be fixed) then step (3) is correct and step (4) follows. But that is not the standard interpretation. The standard interpretation requires fixed preferences.

  What does rejecting step (4) cost? We must commit to the idea that preferences are fixed (or at least stationary in some way) and that agents act optimally with respect to them. This might be a strong assumption, but it is standard in economics and reinforcement learning.

  Alternatively, we might reject step (3) for the same reason: if we require fixed preferences, then step (3) is false.

  But step (3) is presented as "there exists a preference assignment", and if we allow any assignment without requiring it to be fixed, then it is true. So the problem is in the interpretation of the linking assumption.

  Therefore, I think the cleanest rejection is of step (4): the linking assumption (with fixed preferences) does rule out some behaviors.

  Now, addressing the reply to the objection: even when we restrict the hypothesis class, the data do work by updating the prior within the class. The friend's reply confuses the role of the prior (which sets the hypothesis class and the initial weights) with the role of the data (which update the weights). Without data, we would have no update. Therefore, the data do contribute.

  Moreover, the friend's argument that the constraint comes from the restriction (the prior) is true, but that does not imply the data are irrelevant. The prior and the data together yield the posterior.

  So the data are not doing nothing; they are essential for updating our beliefs.

  Therefore, the friend's conclusion (6) is too strong.
answer: |-
  ### Step-by-Step Analysis and Rejection of the Argument

  Your friend's argument is clever and appears internally consistent at first glance, but it contains a critical flaw. I will break down the reasoning, identify the weakest step, explain why it fails, address the cost of rejection, and directly respond to his reply about restricted hypothesis classes. I will also explain why the data still play a crucial role in preference inference.

  #### Summary of the Argument and Its Flaw
  The core issue lies in **step (4)**, which incorrectly generalizes from step (3). Specifically:
  - **Step (3)** claims that for any finite behavior, there exists *some* preference assignment that rationalizes it (e.g., by assigning high value to chosen actions and low value to others).
  - **Step (4)** concludes that because such a preference always exists, the linking assumption (that people act optimally with respect to their preferences) "never rules anything out."

  However, step (4) is invalid because the linking assumption (as used in practice) **requires preferences to be fixed and structured**, not arbitrary or ad hoc. The example in step (3) violates this by allowing preferences to be defined retroactively and non-stationarily (i.e., changing arbitrarily for each choice). In real-world applications of inverse reinforcement learning (IRL) and economics, preferences are assumed to be **stable, consistent, and defined over outcomes or states**, not just actions in isolation. This constraint makes the linking assumption falsifiable and allows data to inform preference inference.

  Now, let's examine each step in detail.

  #### Step-by-Step Evaluation
  1. **Step (1):** "Inferring preferences from behavior requires a linking assumption connecting the two: that people tend to act optimally, or nearly so, with respect to what they want."  
     - **This is correct and should be preserved.** You want to keep the idea that choice is evidence of preference, and this step is foundational to IRL and revealed preference theory in economics. Without this assumption, preference inference would lack a theoretical basis.

  2. **Step (2):** "A linking assumption earns its keep only if it can fail — only if some possible patterns of behavior would be inconsistent with it."  
     - **This is also correct.** It reflects the scientific principle of falsifiability. An assumption must be testable; otherwise, it cannot be empirically validated.

  3. **Step (3):** "For any finite record of behavior, however strange, there exists a preference assignment relative to which every observed choice is optimal: if nothing else, assign high value to precisely the actions chosen and low value to everything else that was available."  
     - **This is true but misleading.** Yes, if preferences are allowed to be arbitrary, non-stationary (changing over time), and defined per action/choice set, we can always rationalize behavior. However, this "ad hoc preference assignment" is not how preferences are modeled in IRL or economics. In practice, preferences are assumed to be:
       - **Fixed:** The same preference (e.g., a reward function) applies across all observations.
       - **Structured:** Defined over states, outcomes, or features (e.g., a linear reward function over state features), not just actions.
       - **Stationary:** Not changing capriciously with each choice.
     - The example given (assigning high value to chosen actions) violates these constraints because it creates a preference that is:
       - **Non-stationary:** It changes for each choice to fit the data.
       - **Action-specific:** It does not generalize to new contexts or states.
       - **Retroactive:** It is defined after observing behavior, making it untestable for future predictions.
     - Thus, step (3) exploits an overly permissive definition of "preference assignment" that does not align with real-world applications.

  4. **Step (4):** "So for any behavior there is some way of satisfying the linking assumption; hence the assumption never rules anything out."  
     - **This is false and should be rejected.** The linking assumption (as intended in step 1) includes implicit constraints: preferences must be fixed and structured. Under these constraints, **not all behaviors can be rationalized**. For example:
       - **Intransitive choices:** If an agent chooses A over B, B over C, and C over A in identical states, this cannot be rationalized by any fixed, transitive preference. The ad hoc assignment in step (3) would "explain" this by assigning different preferences for each choice, but that violates the requirement that preferences are fixed.
       - **Inconsistent choices:** If an agent chooses A over B in state S at time t, but B over A in the same state S at time t+1, no fixed preference can explain this without additional assumptions (e.g., changing beliefs or noisy actions, but not changing preferences).
     - **Why step (4) looks unassailable:** If we ignore the fixed/structured nature of preferences (as step (3) does), then yes, any behavior can be rationalized. But this is a straw man; no serious IRL or economic model allows such arbitrary preferences. Step (4) fails because it generalizes from step (3)'s ad hoc preferences to the linking assumption as a whole, overlooking that the linking assumption inherently requires preferences to be non-arbitrary.
     - **Cost of rejecting step (4):** We must commit to the idea that preferences are fixed and structured. This is a substantive assumption (e.g., people have stable goals), which could be wrong in some cases (e.g., if preferences evolve rapidly). However, this cost is reasonable and standard in the field. Without it, preference inference would indeed be empty—but with it, the linking assumption becomes falsifiable and empirically meaningful.

  5. **Step (5):** "An assumption that never rules anything out is evidentially inert..."  
     - **This does not follow once step (4) is rejected.** With fixed/structured preferences, the linking assumption *can* rule out behaviors (e.g., intransitive choices), so observations *can* count against specific preference hypotheses. For instance, observing inconsistent choices lowers the credibility of the hypothesis that the agent has a fixed preference.

  6. **Step (6):** "Therefore what an IRL system... outputs is fixed entirely by the assumptions built in at the start; the data contribute nothing."  
     - **This is invalidated by rejecting step (4).** Data can update our beliefs about preferences within a constrained class, making inference non-empty.

  #### Addressing Your Objection and His Reply
  You objected that in practice, we restrict preferences to a "reasonably simple class" (e.g., linear reward functions), and within this class, behaviors cannot always be rationalized. Your friend replied that this restriction is just a prior assumption, so the data still do no work—the constraint comes from the prior, not the data.

  **Why his reply is flawed:**
  - **Data still do work within the constrained class.** Even with a restricted hypothesis class (e.g., "preferences are linear reward functions"), data can:
    - **Rule out hypotheses:** Some behaviors cannot be rationalized by *any* hypothesis in the class (e.g., choices inconsistent with linearity), falsifying those preferences.
    - **Update probabilities:** In a Bayesian framework, data update the posterior distribution over the hypothesis class. For example:
      - Suppose we have two linear reward functions, R1 and R2.
      - If observed behavior is optimal under R1 but suboptimal under R2, the data increase the credibility of R1 relative to R2.
      - Without data, we have only the prior; with data, we get evidence-driven refinement.
  - **The distinction between "assumption" and "evidence" is preserved:** The restriction (e.g., "preferences are linear") is a prior assumption, but the data provide evidence *within that assumption*. This is not "moving the prior into the hypothesis class"; it is standard scientific practice. For example:
    - In physics, we assume gravity follows an inverse-square law (prior/hypothesis class restriction), but data still update our beliefs about specific parameters (e.g., gravitational constant).
    - Similarly, in IRL, data help identify which linear reward function best explains behavior.
  - **His reply conflates the role of priors with data impotence:** Priors define the hypothesis space, but data determine which hypotheses are plausible within it. His argument that "the constraint comes from the restriction, not the data" is misleading because:
    - Without data, we cannot distinguish between hypotheses in the class.
    - With data, we can reject some hypotheses and support others.
    - Thus, data are not "doing nothing"; they are essential for inference. The prior sets the stage, but the data drive the conclusion.

  In essence, your friend trades the distinction between "assumption and evidence" for a false dichotomy: either the data do everything (no priors) or nothing. In reality, inference is a blend of both, and data play a critical role within a structured framework.

  #### Why Not Reject Other Steps?
  - **Step (3) could be rejected** if we insist that preferences must be fixed/structured. However, step (3) is technically true for *unrestricted* preferences, so rejecting it outright is less natural. Focusing on step (4) is cleaner because it highlights the misinterpretation of the linking assumption.
  - **Step (5) is weakened by rejecting step (4)**, so it doesn't need separate rejection. Alternatives like rejecting step (2) (falsifiability) or step (1) (linking assumption) would undermine the entire enterprise of preference inference, which you want to preserve.
  - **Cheapest rejection:** Step (4) is the most cost-effective because it only requires clarifying that preferences are fixed/structured—a standard commitment in the field. Rejecting step (3) would require denying that arbitrary preferences exist, which is harder, and rejecting step (5) or (6) alone would leave the core flaw intact.

  #### Conclusion
  Reject **step (4)**: The linking assumption, when properly understood as requiring fixed and structured preferences, can rule out behaviors (e.g., intransitive or inconsistent choices). This preserves the core idea that choice is evidence of preference (step 1) and maintains falsifiability (step 2). By requiring preferences to be non-arbitrary, we ensure that the linking assumption is empirically substantive. Data then play a vital role by updating beliefs within a constrained hypothesis class, countering your friend's claim that inference is "empty." His reply to your objection fails because data provide evidence within the prior-defined class, making preference inference a genuine empirical enterprise, not just a restatement of priors.
