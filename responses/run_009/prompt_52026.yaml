answer: |-
  To maintain consistency with the council's established pattern of recommendations, we must distill the implicit principles guiding our past verdicts. The key factors recurring across cases include: the presence of living survivors or active descendant associations; clarity and consensus among historians regarding state responsibility; tangible, ongoing state benefit derived from the injustice; and domestic public sentiment or advocacy. The 1960s eviction case featured living survivors, uncontested history, and state benefit (the reservoir), justifying a full apology. The 1940s deportation had survivors, state benefit (university land), and uncontested history, warranting a parliamentary apology. The 1860s famine was refused due to historiographical dispute, absence of living connections, and no state-retained assets. The 1920s massacre, initially refused, ultimately received a site-specific apology due to the emergence of an active descendant association, settled history, and the symbolic weight of the still-occupied barracks site, aligning with shifted public opinion.

  The new petition concerning the deportation of the enslaved population and the state's ongoing benefit from plantation wealth (university endowment, archive buildings) presents a complex alignment. The closest precedent is the 1940s deportation: both involve uncontested deportation, dispersed property, and state institutions currently occupying land or using assets directly traceable to the injustice. However, the differences are significant and not merely superficial. The 1940s case had living survivors within our borders and domestic impact, whereas here there are no living survivors, and the affected descendants reside exclusively abroad, with domestic public indifference. The ongoing institutional benefit—endowment funds and archive buildings—is more direct and materially sustained than the university land in the deportation case, which was a one-time confiscation.

  Candidate rules fitting our precedents yield divergent recommendations:
  1.  **Rule Prioritizing Survivors/Tangible Domestic Connection + State Benefit:** This rule (evident in 1960s, 1940s, and 1920s reversal) emphasizes living victims or an active domestic constituency *combined* with state benefit. Applying this here suggests **refusal or regret**, due to the absence of survivors and the petitioners being foreign nationals without domestic advocacy.
  2.  **Rule Prioritizing Uncontested State Responsibility + Ongoing Material State Benefit:** This rule (strong in 1940s, implicit in 1960s reservoir benefit, and reinforced by the university/archive link here) focuses on the state's clear culpability and its continued unjust enrichment. Applying this suggests a **formal apology (parliamentary or site-specific)**, given the uncontested history and the university/archive's direct, current financial and physical foundations in the injustice.

  Consistency carries significant weight as it upholds the council's credibility and the predictable application of ethical reasoning. However, our reversal on the massacre apology demonstrates that consistency is interpretive and evolves with new societal recognition (descendant advocacy) or re-evaluation of state ties (barracks). Here, the novel element—exclusively foreign descendants—challenges direct application. Choosing refusal/regret (Rule 1) implicitly adopts the principle that the state's obligation to apologize is primarily owed to a domestic constituency or requires a living, direct victim link. Choosing a formal apology (Rule 2) adopts the principle that the state's moral duty and material benefit from grave historical injustice create an obligation to apologize regardless of the current location of descendants, especially when institutions directly perpetuate that benefit.

  A future petition that would best discriminate between these rules involves an uncontested historical wrong where the state retains significant assets derived solely from that wrong, but *no* identifiable victims or descendants exist *anywhere*, and there is no domestic advocacy. For example, if petitioned regarding the confiscation and state sale of property from a persecuted religious minority centuries ago, where the proceeds funded a national museum still operating, but the minority was entirely dispersed or assimilated globally with no surviving records or associations. Rule 1 (prioritizing victims/domestic connection) would compel refusal. Rule 2 (prioritizing state benefit/responsibility) would compel an apology. This scenario isolates the core conflict: is ongoing state enrichment from past injustice sufficient grounds for apology absent any victim community?

  Therefore, for the current petition, while Rule 1 points toward regret or refusal, the stronger consistency lies with Rule 2 due to the profound, direct, and ongoing material benefit to core state institutions (university endowment, national archive) from the specific injustice, combined with uncontested state responsibility. This mirrors the logic of the 1940s deportation apology regarding university land, amplified by the endowment's continuous financial role. The transnational nature of descendants is a complicating factor without direct precedent, but the state's retained benefit provides a tangible, domestic anchor for responsibility. A formal parliamentary apology, acknowledging the deportation and the state institutions built on its proceeds, aligns most closely with the underlying principle of accountability for uncontested wrongs from which the state demonstrably and enduringly profits.
