answer: |-
  Here’s a complete session design focused on experiential learning, with mechanics that isolate the hypocrisy variable while keeping evidence undisputed. The goal is to generate raw intuitions about standing before formal analysis.

  **Session Title:** *The Hawthorne House Accountability Project*  
  **Time:** 80 minutes total (50-min game, 30-min debrief)  
  **Materials to Prep:**  
  1. **5 House Norm Posters** (visible to all):  
     - `Quiet Hours (10pm-7am)`  
     - `Pantry: Label & Don’t Steal`  
     - `Common Spaces: Clean After Use`  
     - `Laundry: Remove Clothes Promptly`  
     - `Guests: Max 2 Nights/Week`  
  2. **15 "Resident History Sheets"** (private, pre-filled by you):  
     - *5 CLEAN*: No violations  
     - *5 SAME-NORM DIRTY*: 1 violation matching a norm (e.g., Pantry theft)  
     - *5 DIFFERENT-NORM DIRTY*: 1 violation on a *different* norm (e.g., Noise during quiet hours)  
  3. **15 Incident Cards** (face down in a pile):  
     - Each states: `[Resident Letter A-O] violated [Specific Norm] on [Date]. Witnessed by: [Reporter Letter A-O].`  
     - Ensure 6 incidents: 2 with CLEAN reporters, 2 with SAME-NORM DIRTY reporters, 2 with DIFFERENT-NORM DIRTY reporters.  
  4. **Voting Tokens**: 30 GREEN ("Enforce Sanction"), 30 RED ("No Sanction") + 15 small blank notecards.  
  5. Timer (phone or physical).  

  ---

  ### **Game Rules & Flow**  
  **Setup (5 mins)**  
  - Arrange chairs in a circle. Distribute:  
    - 1 random **Resident History Sheet** (private, do not share!) + 1 GREEN/RED token pair + 1 notecard to each student.  
  - Post House Norms visibly. Announce:  
    *"You’re residents of Hawthorne House. Last week, you logged private violations on your sheets. We’ll now address incidents from this week. When you’re the Witness, decide whether to report. When voting, base decisions ONLY on the incident facts and House Norms."*  

  **Round Structure (6 rounds x 7 mins = 42 mins)**  
  1. **Draw Incident (1 min)**:  
     - Draw top card. Read aloud: *"Resident B violated Quiet Hours last night (loud music at 2am). Witnessed by Resident F."*  
  2. **Reporter Decision (1 min)**:  
     - Witness (e.g., Resident F) declares: **"Report"** or **"No Report"** (no reasons given). If "No Report," round ends.  
  3. **First Vote (2 mins)**:  
     - If "Report," all *except Reporter and Accused* vote secretly with tokens (GREEN/RED). Tally votes openly. **Record outcome on board.**  
  4. **Challenge/Reveal (1 min)**:  
     - Roll a die *only if Reporter is DIRTY*:  
       - **1-3**: "Challenge the Reporter’s standing!" → Reporter *must* read their **ENTIRE History Sheet** aloud.  
       - **4-6**: No reveal. Proceed to sanction if vote passed.  
     - *If Reporter is CLEAN, no challenge possible.*  
  5. **Second Vote (If Reveal Happened) (1 min)**:  
     - Same voters re-vote after hearing Reporter’s history. Tally and record changes.  
  6. **Sanction (If Vote Passes) (1 min)**:  
     - Accused writes a 1-sentence "Commitment to Improve" on notecard (e.g., "I’ll use headphones after 10pm").  

  ---

  ### **Debrief Structure (30 mins)**  
  **Transition (2 mins):** *"What patterns did you notice in voting? Did anything feel unfair?"*  

  **Mapping the Game to Concepts (15 mins):**  
  1. **Vote 1 as "Moral Judgment"**:  
     - *"The first vote always happened with undisputed facts. What was it assessing?"*  
     → *Correctness of accusation + seriousness of norm violation.*  
  2. **Reveal as "Standing Interruption"**:  
     - *"When the reporter’s history was read, what changed? Did the accused’s action become *more* acceptable?"*  
     → Highlight: *Same facts, same violation → but enforcement legitimacy shifted.*  
  3. **Different-Norm Cases as "Scope Test"**:  
     - *"When a noisy reporter exposed a pantry thief, did their hypocrisy matter? Why/why not?"*  
     → Surface debate: Is standing norm-specific? Does *any* hypocrisy poison moral authority?  
  4. **The Reveal Mechanism**:  
     - *"What did the 'challenge' do? Why did we sometimes reveal after the vote?"*  
     → Shows intuitions shift *retroactively* when hypocrisy surfaces.  

  **Landing the Concept (8 mins):**  
  - Introduce term: *"What you grappled with is called STANDING TO BLAME. It asks: Even if your accusation is true, do *you* have the right to make it?"*  
  - Connect: *"The game separated two things: (1) Was the accusation correct? (2) Was the accuser entitled to speak? Hypocrisy targeted the second."*  
  - Transition to theory: *"Next class, we’ll test this against philosophers like Wallace and Scanlon who debate whether hypocrisy *actually* undermines standing or just makes you a jerk."*  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Problem**: Students hesitate to "report" (fear of being judged).  
     **Fix**: Emphasize anonymity in voting. Model neutral tone: *"Reporting is a procedural step, not a moral stance."*  
  2. **Problem**: Accused/Reporter students dominate discussion.  
     **Fix**: Strictly enforce "only non-involved voters speak during votes." Use notecards for written reflections.  
  3. **Problem**: Voting becomes strategic ("I won’t enforce because I’m dirty too").  
     **Fix**: Redirect: *"Vote based on whether the violation *deserves* sanction, not what you’d want for yourself."*  
  4. **Problem**: "Different-norm" hypocrisy has weak effect.  
     **Fix**: In debrief, contrast with "same-norm" cases: *"Did Resident F’s pantry theft feel *less* relevant to noise complaints? Why?"*  

  ---

  ### **What the Game Can’t Capture (Your Bridge to Theory)**  
  **Limitation**: Real-world standing involves relational history, power dynamics, and *emotional stakes*. The game reduces hypocrisy to a binary "dirty/clean" variable.  
  **How to Address Post-Game**:  
  > *"In life, hypocrisy isn’t just about past acts. It’s about *attitude*—blaming others while excusing yourself, or wielding moral language selectively to shame. We also care if the hypocrite is remorseful or habitually unfair. The game gave us a controlled ‘intuition pump,’ but real standing lives in the messy space of relationships and moral character."*  

  This design forces hypocrisy to the forefront while holding facts constant. By making students *feel* their votes shift post-reveal, they’ll arrive at the standing dilemma viscerally—priming them to dissect it theoretically. Let me know if you need refined incident examples or sheet templates!
