  Conflicts: Conservativity and partition insensitivity can't both hold with Jeffrey's rule. Also, conservativity conflicts with handling unreliable instruments. 

  Now, the scorecard: Strict conditioning fails uncertain evidence entirely. Jeffrey meets certainty reduction and conservativity but fails order-independence and partitioning insensitivity. Enriched models (like Pearl or Gallow) satisfy more desiderata by relaxing conservativity when needed but require more complex modeling.

