answer: |-
  Here are the core desiderata for updating on uncertain evidence, annotated with their status, rationale, and key conflicts. These are drawn from foundational debates (Jeffrey, van Fraassen, Diaconis & Zabell, Titelbaum, Gallow, etc.).

  ### Desiderata for Updating on Uncertain Evidence

  1.  **Certainty Reduction (Non-Negotiable)**
      *   **Requirement:** If new credence in evidence proposition `E` is 1, the rule must yield the same result as strict conditionalization: `P_new(H) = P_old(H | E)`.
      *   **Rationale:** Ensures compatibility with standard Bayesianism when evidence *is* certain. A rule violating this isn't a generalization but a replacement.
      *   **Status:** Universally accepted as mandatory.

  2.  **Conservativity (Conditional Rigidity) (Negotiable - Central but Contested)**
      *   **Requirement:** Conditional credences given cells of the evidence partition must remain unchanged: `P_new(H | E_i) = P_old(H | E_i)` for all `H` and all partition cells `E_i`.
      *   **Rationale:** The evidence shift (`P_new(E_i)`) directly affects only credences *over* the partition. How `H` relates to each `E_i` (the "causal"/structural dependencies) is a background fact unchanged by the observation *itself*. (Dog Barking: Hearing the faint sound raises P(Bark), but doesn't *by itself* change how P(Intruder) relates to Bark/Quiet).
      *   **Status:** Core tenet of **Jeffrey Conditioning (JC)**. Rejected by approaches emphasizing that the *manner* of evidence acquisition (e.g., noisiness) can provide information *about* the conditional dependencies themselves (Unreliable Instrument Case). Camp: Subjectivists/Jeffreyans (accept) vs. Objective Bayesians/Enriched Model advocates (often reject).

  3.  **Order-Independence (Commutativity) (Negotiable - Preference)**
      *   **Requirement:** Applying two successive uncertain updates (with potentially different partitions and shifts) should yield the same final credence state regardless of the order applied.
      *   **Rationale:** Prevents path-dependence where the sequence of processing identical information alters conclusions. Guards against drift or cycles under repeated updates.
      *   **Status:** Desired by many, but JC generally violates it when partitions differ. Rules guaranteeing it (e.g., some "Washing Out" rules) often violate other desiderata (like Conservativity or Certainty Reduction). Camp: Pragmatists/Formalists (desire) vs. Jeffreyans (often accept violation as cost of doing business).

  4.  **Partition Insensitivity (Negotiable - Preference)**
      *   **Requirement:** The final credence in `H` should depend only on the *overall* shift in credence over the coarsest relevant evidence space, not on how finely that space is partitioned when applying the rule. Updating on a coarse partition `{E, ~E}` with `P_new(E)=p` should yield the same `P_new(H)` as updating on a finer partition `{E1, E2, ..., En}` where `E = U E_i` and `sum(P_new(E_i)) = p`, assuming the conditional probabilities `P(H | E_i)` are consistent with the coarse partition.
      *   **Rationale:** The evidential *impact* should be determined by the change in credence for the relevant proposition (`Bark`), not the arbitrary choice of sub-partition (`LoudBark`, `QuietBark`) used to model it. Arbitrary dependence seems like a defect.
      *   **Status:** JC **violates** this. `P_new(H)` depends on the specific partition used. Some see this as a fatal flaw; Jeffreyans argue the partition reflects the agent's conceptualization of the evidence source, which *is* relevant, and that finer partitions can capture richer evidence (e.g., loudness *itself* might be informative). Camp: Critics of JC (desire) vs. Jeffreyans (accept violation).

  5.  **Handling Certainty Extremes (Non-Negotiable Core Requirement)**
      *   **Requirement:** The rule must allow updating *away* from prior credence 0 or 1 in a potential evidence proposition `E_i` when new uncertain evidence warrants it. It must not be undefined or dogmatically stuck.
      *   **Rationale:** A primary motivation for uncertain updating is to handle cases where strict conditionalization fails due to dogmatism. A rule failing here fails its core purpose. (e.g., Starting P(DogBarks)=0; faint sound should make P_new(DogBarks)>0).
      *   **Status:** Non-negotiable *for the rule's purpose*. JC requires `P_old(E_i) > 0` for any cell receiving new probability, but allows shifting *to* cells with `P_old(E_i)=0` *if* the partition includes them. Enriched models handle this naturally if the *observation variable* has positive prior.

  6.  **Probabilistic Coherence (Non-Negotiable)**
      *   **Requirement:** The output `P_new` must be a coherent probability function (satisfy Kolmogorov axioms).
      *   **Rationale:** Foundational requirement for any Bayesian update rule.
      *   **Status:** Universally accepted as mandatory.

  7.  **Input Sensitivity (Non-Negotiable)**
      *   **Requirement:** `P_new(H)` must be sensitive to the inputs: the prior `P_old` and the new credences over the evidence partition `P_new(E_i)`.
      *   **Rationale:** The rule must actually use the information it's given to change beliefs.
      *   **Status:** Universally accepted as mandatory. (Rules violating this are trivial).

  ### Conflicts: The Impossible Trinity (for JC)

  *   **Conflict:** **Conservativity (2)**, **Order-Independence (3)**, and **Partition Insensitivity (4)** cannot *all* be satisfied simultaneously by a rule generalizing conditionalization.
      *   JC satisfies (2) and (7), handles (5) partially (needs P_old(E_i)>0), satisfies (1) & (6), but violates (3) and (4).
      *   Rules satisfying (3) and/or (4) (e.g., some "generalized conditioning" or "minimum cross-entropy" rules) typically violate (2).
  *   **The Unreliable Instrument Challenge:** This case directly attacks **Conservativity (2)**. If the *faintness* of the sound is evidence that your hearing is impaired *tonight*, then learning `FaintSound` *does* provide evidence about the reliability of your prior conditional beliefs `P_old(Intruder | Bark)`. Maintaining `P_new(Intruder | Bark) = P_old(Intruder | Bark)` is unjustified. **This makes strict Conservativity untenable in general.** Respectable camps reject it (e.g., proponents of enriched models like Pearl or Gallow's approach). The cost is increased complexity: you must model *how* the observation affects the conditional relationships (e.g., by including an observation variable correlated with both the evidence and its reliability).

  ### Scorecard: Three Contenders vs. Desiderata

  1.  **Strict Conditionalization (on `E` treated as certain):**
      *   (1) Satisfied (by definition).
      *   (2) N/A (only one "cell").
      *   (3) Satisfied.
      * (4) N/A.
      * (5) **Fails Catastrophically.** Stuck if `P_old(E)=0`; undefined/inappropriate if `P_old(E)<1`.
      * (6) Satisfied.
      * (7) Satisfied only if `P_old(E)=1`; otherwise misapplied. **Fails core purpose of uncertain updating.**

  2.  **Jeffrey Conditioning (Standard):**
      *   (1) Satisfied.
      *   (2) **Satisfied** (Core feature).
      *   (3) **Fails** (Order matters).
      *   (4) **Fails** (Partition matters).
      *   (5) Partially Satisfied (Can update *to* `P_new(E_i)>0` even if `P_old(E_i)=0`, but cannot update *using* a cell with `P_old(E_i)=0`).
      *   (6) Satisfied.
      *   (7) Satisfied. **Succeeds at core generalization but vulnerable on (3)/(4) and fails Unreliable Instrument case due to (2).**

  3.  **Enriched Model + Strict Cond. (on Observation `O`):**
      *   (1) Satisfied (Conditionalizing on `O=o`).
      *   (2) **Typically Rejected/Flexible.** `P_new(H | E_i)` *can* change because `O` provides evidence *about* the relationships encoded in the model. This is often the *point* (Unreliable Instrument).
      *   (3) Satisfied (Conditionalization is order-independent).
      *   (4) Satisfied (Conditionalization result depends only on `O=o`, not partitioning of `E`).
      *   (5) Satisfied (As long as `P_old(O=o) > 0`).
      *   (6) Satisfied.
      *   (7) Satisfied. **Succeeds broadly but requires significant modeling effort upfront and explicitly rejects strict Conservativity (2). Handles Unreliable Instrument naturally.**

  **Key Takeaway:** The choice between JC and Enriched Models hinges crucially on whether you consider **Conservativity (Conditional Rigidity) (2)** non-negotiable (favoring JC despite its partition/order issues) or whether you believe the observation process can inform conditional relationships (favoring Enriched Models, accepting the modeling burden). Strict conditionalization is inadequate for uncertain evidence. The Unreliable Instrument case strongly suggests Conservativity is often too strict.
