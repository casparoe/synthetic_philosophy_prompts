prompt: |-
  Quick context on me before the actual question: I'm a second-year PhD student, background in logic and model theory rather than mainstream epistemology or metaphysics, and I have to commit to a dissertation topic by the end of term. My supervisor works on philosophy of language and keeps nudging me toward deflationism about truth — the idea that truth isn't some deep property with an essence to analyse, but basically a logical device that lets us make generalisations (saying "everything in the report is true" without producing an infinite conjunction of sentences). I find the view attractive, but I also keep running into people saying deflationism is basically finished, or that it has dissolved into more specific technical debates, and I honestly can't tell whether that's a fair assessment or just a meme.

  So here's the ask. You're a professional philosopher who specialises in truth and logical approaches to paradox, so please think carefully about this rather than giving me a survey answer. What are the main open questions in this area right now, and which two or three should I actually spend three years on given my background? The candidates I keep circling are:

  (a) the conservativeness debate — whether adding a truth predicate to arithmetic proves new things or doesn't (depending on how you axiomatise it), and whether that fact sinks deflationism as such or only certain versions of it;
  (b) whether deflationism can make sense of truth's normative role — the idea that you should believe what's true, that truth is a goal of inquiry, and so on;
  (c) whether deflationism can handle the anaphoric / bound-variable uses of "true" that some philosophers claim force you to treat truth as a genuine property;
  (d) the interaction with the liar paradox, and whether there's a genuinely deflationary attitude to take toward revenge problems.

  But maybe I'm missing something more important, or maybe one of these is just a dead end I'm romanticising.

  I care much less about the list than about the reasoning. For each candidate (and anything you'd add): what makes it worth three years of my life? How many other questions in the area depend on it? Is it tractable for someone who's comfortable with proof theory but allergic to heavy metaphysics — and does that tractability itself matter more or less than importance here? And what developments in the next couple of years would move a question up or down your ranking? I want a defended prioritisation, not a neutral overview, and please don't turn it into a reading list or bibliography — I've got more of those than I can read already.

  Two formatting things: please write in British English throughout, and do a bit of free brainstorming at the start before you settle into the ranked discussion, so I can see how you're weighing the options. Then at the very end, give me one fixed, machine-readable line in the form \answer{...} naming your top three picks in priority order (for example \answer{b > c > a}), which I can paste into my notes.

  Sorry for any typos, typing this fast between seminars.
reasoning: |-
  Okay, the user is a second-year PhD student with a background in logic and model theory, looking to commit to a dissertation topic. Their supervisor is pushing them towards deflationism about truth, but they're hearing that deflationism might be outdated or dissolved into technical debates. They need help identifying viable research topics that align with their skills and interests.

  First, I need to understand their position. They're comfortable with proof theory but want to avoid heavy metaphysics. The candidates they're considering are all tied to deflationism's challenges: conservativeness, normativity, anaphora, and paradoxes like the liar. Each has technical and philosophical aspects.

  Starting with the conservativeness debate (a). This is deeply technical, involving formal systems and proof theory. If deflationism requires conservativeness, and certain truth predicates aren't conservative, that's a problem. But recent work like Fischer and Horsten suggests conservativeness might not be essential. For a logic-savvy student, this is tractable. However, it's a niche debate. If conservativeness isn't crucial to deflationism, this might become less relevant. But if new results emerge, it could gain traction.

  Next, the normative role of truth (b). Deflationists struggle to explain why truth should be a goal without inflating it. This involves meta-normativity and conceptual analysis. It's philosophically rich but less technical. The user's logic background might not be as applicable here, and it could require engaging with epistemology. If normativity is central to deflationism's adequacy, solving this could be significant. But it might lead into metaphysics, which they want to avoid. Recent work from Lynch or Kölbel could influence this, but it's more speculative.

  Anaphoric uses of truth (c). Here, Grover's prosentential theory claims "true" acts as a pronoun, avoiding a substantive property. Critics like Stanley argue it fails with quantification. This is a linguistic challenge with logical aspects. The user's model theory skills could help analyze quantified statements. It's less discussed recently, so there might be low-hanging fruit. If they can formalize prosententialism's response, it could resolve a persistent objection. But its impact might be limited unless tied to larger issues.

  Liar paradox and revenge (d). This is a hot topic with formal approaches like Kripke, Field, or Herzberger. Revenge problems challenge deflationary solutions. Technical work here can be fruitful, especially with the user's proof theory skills. It's central to truth theories and has seen recent activity. If they develop a deflationist-friendly solution, it could be a big contribution. However, it's complex and might require navigating heavy formal machinery.

  Weighing their background: Their strength is in logic, so topics (a), (c), and (d) are more suitable. (b) might be less aligned. Among the three, (d) and (a) are more active. (d) has broader implications for truth theories beyond deflationism, making it impactful. Revenge problems are unsolved, so new contributions would be valuable. (a) is important but possibly narrowing. (c) is tractable but might not be as central now.

  Future developments: If new paradox solutions emerge, (d) could evolve. Conservativeness might fade if deflationists reject it as a requirement. Normativity could gain traction with interdisciplinary work.

  Top picks: (d) is top for its centrality and fit with their skills. (c) next as it's manageable and leverages their model theory. (a) third as it's technical but possibly less impactful. (b) is skipped due to metaphysics.
answer: |-
  Right, let's cut through the noise. Your background in logic/model theory is a significant asset here – deflationism's most trenchant challenges are often *technical*, not just metaphysical hand-waving. The "deflationism is finished" line is mostly hype or comes from quarters that never engaged seriously with its sophisticated logical formulations (Horsten, Halbach, Leigh & Nicolai, etc.). It's certainly evolved, fragmented, and faces unresolved technical puzzles, but that's fertile ground, not a graveyard. The key is finding problems where your toolkit gives you an edge and where the philosophical stakes are genuinely hinged on the outcome.

  **Brainstorming Weights & Filters:**
  *   **Your Superpower:** Proof theory, model theory, comfort with formal systems. Prioritise problems where formalisation *is* the argument, or where technical results directly constrain philosophical options. Avoid problems resolvable only by trading intuitions about "metaphysical grounding" or "nature of properties."
  *   **Tractability vs. Importance:** In *this* subfield, tractability often *is* importance. Deflationism lives or dies on whether it can be consistently formalised to do the work it claims (generalisation, blind assertion) while avoiding paradox and capturing core linguistic functions. An unsolved technical puzzle blocking deflationism *is* an important open question. A purely conceptual worry about "normativity" that can't be sharpened formally is likely a dead end *for you*.
  *   **Philosophical Stakes:** Which puzzles genuinely threaten the *core* deflationist thesis (truth has no substantial underlying nature, its function is primarily logical/expressive)? Which are just wrinkles requiring refinement? Conservativeness *might* threaten core claims about truth's "substantiality"; anaphora might be a refinement challenge; normativity might be orthogonal or require minimal non-deflationist additions; revenge is a core test of consistency.
  *   **Field Trajectory:** Revenge paradoxes are *hot* (Field, Bacon, Schindler, recent work on determinacy operators). Conservativeness is active but perhaps reaching stalemate (Fischer & Horsten's "Noah's Ark" paper suggests deflationists can jettison conservativeness requirements). Normativity is perennially debated but progress is slow. Anaphora is under-discussed recently – potential for fresh impact.
  *   **Three-Year Viability:** You need a problem deep enough for a dissertation, but not so sprawling (like "solve the Liar") that you drown. A sharp technical puzzle with clear philosophical implications is ideal.

  **Ranked Assessment of Your Candidates & Key Reasoning:**

  1.  **(d) Liar Paradox & Revenge Problems:**
      *   **Why it's Worth 3 Years:** This is the *defining* technical challenge for *any* theory of truth, deflationism especially. Deflationists *need* a consistent, non-ad-hoc solution to the Liar that doesn't reintroduce a "substantial" truth property. Revenge problems (where the solution itself generates new paradoxical statements) are the hardest nut to crack. Your proof-theoretic skills are *essential* here – analysing proposed solutions (Kripke, Field, Herzberger, paraconsistent/paracomplete logics), constructing models, assessing consistency strength, and exploring novel fixed-point or indeterminacy approaches. Crucially, developing or rigorously defending a genuinely *deflationary attitude* towards revenge (e.g., embracing expressive limitations inherent in the concept, showing revenge sentences are somehow defective or non-threatening without inflating truth) could be groundbreaking.
      *   **Dependency:** High. The viability of *any* formal deflationist theory hinges on its handling of paradox. Progress here would influence debates on expressibility, logical revision, and the nature of semantic concepts broadly.
      *   **Tractability/Fit:** Excellent fit. This *is* proof theory/model theory applied to semantic paradox. Heavy lifting is formal. Metaphysics intrudes only when interpreting *why* a solution succeeds/fails as deflationary, which you can frame logically (e.g., does the solution require truth to have properties beyond disquotation?).
      *   **Future Developments:** Any major breakthrough in revenge (e.g., a compelling formal account of "determinateness" operators that blocks revenge without circularity or inflation, or a new understanding of fixed-point constructions) would be seismic. Stagnation would make the problem harder but no less central. Field's work continues to push boundaries.
      *   **Verdict:** The most fundamental, technically demanding, and impactful challenge directly in your wheelhouse. Solving it (or making significant progress) would be a major contribution.

  2.  **(c) Anaphoric / Bound-Variable Uses ("Prosentence Theory"):**
      *   **Why it's Worth 3 Years:** This attacks deflationism at the linguistic level, claiming it can't handle sentences like "What Jamie said is true" (anaphoric) or quantified cases like "Most statements in the report are true" without treating truth as a predicate applying to propositions/statements as objects (inflating it). Grover's prosentential theory is the classic deflationist response (treating "is true" as a prosentence-forming operator, akin to a pronoun). The challenge is making this work rigorously, especially with quantification and complex embeddings. Your model theory background is perfect for formally modelling how anaphoric links and quantification work in discourse, potentially providing a precise semantics for prosententialism that handles bound variables without ontological commitment to truth-bearers as objects. Showing this *can* be done deflationistically undermines a persistent objection.
      *   **Dependency:** Moderate-High. If deflationism fails here, it fails as a theory of ordinary truth-talk. Success strengthens its linguistic credentials significantly. Less central than paradox for pure logic, but crucial for philosophy of language applications.
      *   **Tractability/Fit:** Very Good fit. Requires formal semantic modelling (discourse representation theory, dynamic semantics, type theory) applied to specific linguistic constructions – right up your street. Minimal metaphysics; it's about logical form and semantic value.
      *   **Future Developments:** Under-active recently. A sophisticated formal model defending prosententialism could reinvigorate the debate. Critiques drawing on linguistics (e.g., Stanley on binding) need formal deflationist replies. Advances in formal semantics generally feed into this.
      *   **Verdict:** A manageable, focused project leveraging your model theory skills to address a key linguistic objection. High potential for clear, publishable results with direct philosophical payoff for deflationism's plausibility.

  3.  **(a) Conservativeness Debate:**
      *   **Why it's Worth 3 Years:** The core question is whether adding a truth predicate (with "deflationary" axioms like Tarski biconditionals restricted to avoid paradox) to a base theory (e.g., Peano Arithmetic, PA) allows proving new *arithmetical* truths that weren't provable before. If it does (non-conservative), critics (Shapiro, Ketland) argue truth is "substantial" – it gives you new mathematical insight. Deflationists (Tennant, Horsten) argue either that conservativeness holds for the *right* deflationary axioms, or that conservativeness isn't essential to deflationism. Your proof theory skills are vital for analysing different axiomatisations (Disquotationalism vs. Compositionalism), proving (non-)conservativeness results over different base theories, and assessing the philosophical weight of these results. Is non-conservativeness a death knell, or just a feature of how truth interacts with rich base theories?
      *   **Dependency:** Moderate. It tests a specific claim about truth's logical "lightness." Its importance hinges on whether conservativeness is a *necessary* condition for deflationism. Fischer & Horsten (2015) argue it's not, which could diminish the debate's centrality.
      *   **Tractability/Fit:** Excellent fit. Pure proof theory. You'll be neck-deep in conservativeness proofs and technical arithmetical arguments.
      *   **Future Developments:** If the consensus shifts towards Fischer & Horsten's view (that deflationism doesn't *require* conservativeness), this problem loses urgency. Conversely, a surprising new non-conservativeness result for a strongly "deflationary" system could reignite it. The technical work is ongoing but perhaps nearing a plateau.
      *   **Verdict:** Technically solid fit, but its *overall* importance for deflationism's survival is potentially waning (or at least, contested). A safe choice technically, but philosophically it might be defending a fort that some deflationists are abandoning anyway. Still valuable, but perhaps less transformative than (d) or (c).

  **(b) Normative Role - Why it ranks lower:**
  *   **Assessment:** This is important *if* you think a theory of truth *must* explain its normative force. Deflationists (Horwich, Williams) often argue the normativity of truth reduces to the normativity of belief/assertion (e.g., you shouldn't believe contradictions, or assert what you don't believe). Critics (Lynch, Dummett) argue this is inadequate; truth seems like a distinct, guiding *goal*. The debate often involves meta-normativity and conceptual analysis.
  *   **Worth 3 Years?** Less so *for you*. While crucial for the *overall plausibility* of deflationism, it's less amenable to your specific technical skills. Progress often involves intricate conceptual analysis, engaging with epistemology of inquiry, and debates about the nature of norms – areas you note discomfort with. It's harder to see a decisive *technical* contribution you could make here that wouldn't feel forced. Solutions tend to be philosophical tweaks ("truth is the norm of correctness for belief/assertion") rather than formal breakthroughs.
  *   **Tractability/Fit:** Poor fit. Requires heavy engagement with normative philosophy and epistemology, not your core strengths. The "allergic to heavy metaphysics" warning lights are flashing.
  *   **Dependency:** Moderate. Failure here would make deflationism seem pragmatically inert, but wouldn't necessarily refute its core semantic/logical claims. Success (a convincing reduction) strengthens it holistically.
  *   **Future Developments:** Always bubbling, but unlikely to be revolutionised by technical logic alone. Work by Lynch, Kölbel, or recent "alethic pluralism" intersects, but it's a different flavour of problem.
  *   **Verdict:** Philosophically significant, but likely a poor match for *your* dissertation project given your background and interests. Tackle this later if deflationism survives the technical challenges.

  **Prioritisation Rationale:**
  (d) is non-negotiable. Deflationism *must* confront the Liar and revenge coherently; failure here is fatal, and your skills are perfectly suited to contribute significantly. (c) leverages your model theory to tackle a persistent linguistic challenge head-on, offering a clear path to defend deflationism's core claim about truth's function in language. (a) is technically solid but potentially less philosophically decisive than it seemed a decade ago; it's a strong third choice, especially if new technical angles emerge. (b) is deprioritised as a mismatch.

  **Top Recommendation:** Focus on **(d)**. Its centrality and technical nature make it the highest-impact, best-fit project. If you find a compelling angle linking (d) and (c) (e.g., how a revenge-resistant deflationary truth predicate handles anaphora), that could be a powerhouse dissertation. Otherwise, (c) is an excellent standalone second choice. (a) is a reliable fallback.

  \answer{d > c > a}
