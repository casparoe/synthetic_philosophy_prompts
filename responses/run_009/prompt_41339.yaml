  But note: T_B and T_A are both functions of N. Since N is the same in both, we can see:

     LR = [10 * (10,000+N)] / [9,500 * (10+N)]

  We want to know if LR > 1 (which would mean E confirms H_A relative to H_B) or not.

  Set LR > 1:
     [10 * (10,000+N)] / [9,500 * (10+N)] > 1
     => 10*(10,000+N) > 9,500*(10+N)
     => 100,000 + 10N > 95,000 + 9,500N
     => 100,000 - 95,000 > 9,500N - 10N
