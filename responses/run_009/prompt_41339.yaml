  You're an expert on confirmation theory and philosophy of science, and I want a prediction, not a lecture on Hempel. I teach intro epistemology; my colleague Ingrid down the hall is the confirmation person, and over years of coffee I've kept notes on her rulings, all with respect to the hypothesis that all ravens are black:

  (1) a black raven spotted while birdwatching: confirms.
  (2) a green apple encountered at the market: confirms, minutely — she's completely unbothered by the paradox, her line is you'd just need an enormous pile of them.
  (3) a white raven: refutes, obviously.
  (4) a green apple whose color and non-ravenhood you already knew before you ever entertained the hypothesis: confirms nothing — that's not evidence, you already had it.
  (5) a raven handed over by a zookeeper who has pre-screened it for blackness: confirms, but less than the wild one, since the screening leaks information.
  (6) the millionth black raven, after 999 black ones and no non-black ones: confirms, but less than the first one did.

  Next week at colloquium I'm planing to spring this on her. We get access to a sealed biodome whose ecologists say it is in one of two states. In state A, all ten of its ravens are black. In state B, it has ten thousand ravens, five hundred of them white. The non-raven objects are identical in number and color in both states. We draw a single object uniformly at random from everyhing in the biodome, and it comes up a black raven.

  Predict her verdict, and show your work. Start by brainstorming at least two or three candidate rules that fit her record — I can see a Hempel-style syntactic rule with the equivalence condition, and some kind of Bayesian likelihood rule, but there may be others (novelty? sampling procedures?) — and say what each predicts for the biodome draw. Flag where her record strains each rule; verdict (4) can't be comfortable for all of them. Then commit to a best guess with your reasons, and tell me what further case I should keep in my back pocket that would cleanly separate whatever rules survive the biodome. Think carefully and don't just recite the textbook answer to the raven paradox — the interesting part is that her rulings might not all come from one principle.
