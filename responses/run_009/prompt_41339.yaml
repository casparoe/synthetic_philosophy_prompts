  But if N>0, then LR < 1? Let's test with N=1:
     LR = [10*(10,001)] / [9,500*11] = 100,010 / 104,500 ≈ 0.957 < 1.

  So the likelihood ratio is greater than 1 only when N=0. For any N>=1, LR<1.

