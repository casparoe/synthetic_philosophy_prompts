     - Therefore, the Bayesian rule (with this model) would say that the black raven disconfirms H (for N>=1) because it supports the alternative state where H is false.

     - However, we must check if this fits with Ingrid's other rulings. In particular, ruling (1): a black raven in the wild confirms. In the wild, we don't have an explicit alternative state. But note, the Bayesian would say that the confirmation depends on the prior distribution and the likelihoods. In the wild, the likelihood of a black raven given H is higher than given not-H? Typically, we assume that without H, non-black ravens are possible. But the base rate of ravens and non-ravens matters. The classic Bayesian resolution of the raven paradox (by I.J. Good) shows that a black raven may not always confirm H if the background is taken into account.

