  For the editor's move: The editor dismissed the neuroscientist's complaint about a review misrepresenting her book. Applying "death of the author," the editor prioritized the text's reception over intent. But in nonfiction, especially science, intent and accuracy are crucial. The book's chapter hedging against consciousness being an illusion might have been overlooked, but if the author claims misrepresentation, that's a factual issue. The editor's literary background might not transfer well to science communication.

