prompt: |-
  I'm a PhD student in philosophy of mind drafting a dissertation chapter on the knowledge argument, and I want to resist the usual move of picking a team before stating what would count as winning. So before I commit to defending any particular line on Mary, write me the desiderata: what any adequate theory of what Mary acquires on leaving the room has to deliver, with the motivating case behind each requirement. The account must at minimum handle the family of variants the literature has spawned -- Jackson's original omniscient neuroscientist, the versions where Mary is a skilled visualizer who can imagine the red experience in fine-grained detail without ever having had one, and the tetrachromat extension where she is released into a world containing colors she never even knew existed in the dossiers. It must respect the distinction-stack: knowing-that versus knowing-how versus knowing-what-it-is-like, acquiring a concept versus acquiring a fact, gaining information versus gaining a new vehicle for old information. And it must take a stand on two design questions I keep going back and forth on: first, whether Mary's physical omniscience is stipulated to include facts about her own current and future neurophysiology, since that clause is doing quiet but heavy work against any reply that leans on indexicals or demonstratives; second, how the theory handles a case where the experimenters mislabel the monitor and Mary's first-ever color patch is, in fact, green while she sincerely believes it is red -- if your account says she now knows what red is like, I want to know what work the experience itself is doing, and if it says she doesn't, I want to know what she has acquired instead.

  Beyond the list of requirements, two things. Flag any pair of desiderata you suspect cannot be jointly satisfied -- I have a suspicion the constraint that the theory issue a verdict on physicalism's fate cannot coexist with the constraint that it stay neutral on whether phenomenal properties are physical properties, and I'd like your view on whether that tension is real or an artifact of my framing. Then briefly score the standard responses -- the ability hypothesis, the phenomenal concept strategy, and Jackson's own later conversion -- against the list, though keep that short since the scoring is not the part I'm struggling with. The purpose to fix adequacy against: the theory has to be good enough to settle what follows for physicalism, not merely to redescribe the case in a neutral vocabulary; a theory that gets every case right but tells me the fate of physicalism is not its business has failed by my lights, and I want to know whether you accept that purpose or think it begs the question.
reasoning: |-
  Okay, the user is a PhD student in philosophy of mind working on the knowledge argument. They need a list of desiderata for any theory explaining what Mary acquires upon leaving the room. They want to avoid committing to a position prematurely and instead outline what a successful theory must achieve.

  First, I need to unpack their specific requirements. They mentioned handling variants like the original Mary, the skilled visualizer, and tetrachromat cases. Also, respecting the distinction-stack: knowing-that vs knowing-how vs knowing-what-it's-like, concept vs fact, information vs vehicle. Plus, the two design questions about Mary's self-knowledge and mislabeling scenarios.

  The user also wants to flag any conflicting desiderata. They suspect that requiring a verdict on physicalism might clash with neutrality on phenomenal properties being physical. I need to assess if that tension is real. Then, briefly score standard responses against the list.

  The purpose is crucial: the theory must settle physicalism's fate, not just redescribe neutrally. The user thinks a theory that avoids this fails. I should address whether this purpose is legitimate or question-begging.

  Breaking down the desiderata:
  1. **Handling Cases:** Original Mary, Skilled Visualizer (Mary can imagine red without seeing it), Tetrachromat (new colors beyond her knowledge). Each tests different aspects of the argument.

  2. **Distinction-Stack:** 
     - Knowledge types: Propositional (knowing-that), ability (knowing-how), acquaintance (knowing-what-it's-like).
     - Concept vs Fact: Does Mary gain a new concept or a new fact?
     - Information vs Vehicle: Is it new content or a new way to access existing content?

  3. **Design Questions:**
     - **Self-Knowledge Stipulation:** Does Mary's physical omniscience include her own neurophysiology? This blocks indexical/demonstrative replies.
     - **Mislabeling Scenario:** If Mary is shown green but told it's red, does she know what red is like? Challenges the role of experience.

  4. **Physicalism Verdict:** The theory must take a stance on whether physicalism is true or false based on the argument. Neutrality here is insufficient.

  Now, conflicting desiderata: Requiring a verdict on physicalism while staying neutral on whether phenomenal properties are physical. The user's suspicion is spot-on. If the theory must settle physicalism's fate, it can't remain neutral on the nature of phenomenal properties. This tension is real because the knowledge argument is a direct challenge to physicalism. A theory that's neutral might avoid taking a stand, but the user rejects such neutrality. So, the desideratum for a physicalism verdict forces the theory to engage with the ontological status of qualia, thus conflicting with neutrality.

  Scoring standard responses:
  - **Ability Hypothesis (Lewis/Nemirow):** Knowledge-how, not knowledge-that. Handles original case but struggles with tetrachromat (new concepts/colors) and mislabeling (if ability is tied to experience). Fails the physicalism verdict by denying new information, thus saving physicalism.
    
  - **Phenomenal Concept Strategy (Stoljar/Papineau):** New concepts for same facts. Handles original and maybe tetrachromat (new concepts for new properties). Mislabeling problem: if concepts are recognitional, mislabeling might not grant correct concept. Saves physicalism by allowing new concepts without new properties.
    
  - **Jackson's Conversion (Dualist to Physicalist):** Argues Mary gains an ability or concept, not new facts. Similar to Ability Hypothesis, but Jackson later rejected his own argument. Still, it supports physicalism.

  All three aim to save physicalism but handle the cases differently. The Ability Hypothesis and Phenomenal Concept Strategy might struggle with tetrachromat and mislabeling, which are harder cases.

  Purpose Legitimacy: The user insists the theory must settle physicalism. Is this question-begging? Not necessarily. The knowledge argument is intended as an anti-physicalist argument, so a theory that remains neutral fails to engage with the core debate. However, demanding a verdict might force the theory into a particular ontological commitment, which could be seen as framing the debate in a way that presupposes the argument's success. But the user's stance is that a neutral theory is inadequate for their dissertation's purpose, which is to resolve the argument's implications for physicalism. So, while it sets a high bar, it's justified within their project.

  Unspoken needs: The user might be looking for a framework that allows evaluating theories without bias, ensuring their dissertation is comprehensive. They might also want to identify gaps in existing responses to carve out their original contribution. Highlighting desiderata conflicts helps them argue for a novel solution or refine the debate's terms. They might need clarity on whether their insistence on a physicalism verdict is valid, ensuring their approach isn't dismissed as biased.
answer: |-
  Below is a structured breakdown of the desiderata for any adequate theory of what Mary acquires upon release, designed to serve as a neutral adequacy checklist before committing to a specific response. I'll organize it into **Core Requirements**, **Case-Handling Demands**, **Distinction-Stack Constraints**, and **Design Question Mandates**, with motivating cases for each. I then flag the suspected tension between desiderata, score standard responses, and address your purpose clause.

  ---

  ### **I. Core Requirements**  
  *What any theory must explain to count as minimally adequate*

  1. **The Novelty Constraint**  
     *Requirement:* The theory must account for the *new* element Mary gains upon experiencing red for the first time.  
     *Motivation:* Jackson’s core intuition—pre-release Mary knows all physical facts but post-release Mary gains *something* epistemically significant. Denying novelty (e.g., "she knew it all along") fails the original case.  

  2. **The Non-Triviality Constraint**  
     *Requirement:* The acquisition must be substantive—not merely linguistic, indexical, or pragmatic.  
     *Motivation:* Against deflationary replies (e.g., "she just learns the word ‘red’ applies to *this*"). Mary’s exclamation "So *this* is what red looks like!" implies more than re-labeling.  

  3. **The Physicalism-Verdict Constraint**  
     *Requirement:* The theory must entail a clear outcome for physicalism’s truth or falsity.  
     *Motivation:* The argument is a metaphysical tool. A theory that "saves the phenomena" but leaves physicalism’s status indeterminate (e.g., via neutral monism) fails the argument’s intent.  

  ---

  ### **II. Case-Handling Demands**  
  *Must cover the variant thought experiments*

  4. **Original Mary Compliance**  
     *Requirement:* Explain why physical omniscience (including completed neuroscience) leaves Mary unprepared for red.  
     *Motivation:* Baseline case. Failure here collapses the argument.  

  5. **Skilled Visualizer Resilience**  
     *Requirement:* Handle cases where Mary perfectly imagines red (e.g., via fMRI-guided meditation) *without* seeing it, yet still lacks what she gains upon actual exposure.  
     *Motivation:* Counters "ability" or "simulation" replies. If imagination suffices, the argument fails; if not, the theory must explain why actual experience is essential.  

  6. **Tetrachromat Extension**  
     *Requirement:* Explain Mary’s acquisition upon seeing a *new* color (e.g., ultraviolet) not in her dossiers, where no prior physical description exists.  
     *Motivation:* Tests whether Mary’s gain is conceptual (reorganizing old knowledge) or genuinely discovery-based (new properties).  

  ---

  ### **III. Distinction-Stack Constraints**  
  *Must respect key epistemic/metaphysical divides*

  7. **Knowledge-Type Disambiguation**  
     *Requirement:* Specify whether Mary gains *knowledge-that* (propositional), *knowledge-how* (ability), or *knowledge-what-it’s-like* (acquaintance).  
     *Motivation:* Ambiguity here enables equivocation in replies (e.g., "she gains an ability, not a fact"). The theory must pick one or clarify interactions.  

  8. **Concept vs. Fact Demarcation**  
     *Requirement:* State whether Mary acquires a *new concept* (e.g., a phenomenal concept) or a *new fact* (e.g., about qualia).  
     *Motivation:* Critical for physicalism. New facts imply non-physical properties; new concepts may not.  

  9. **Information vs. Vehicle Separation**  
     *Requirement:* Distinguish whether Mary gains *new information* (content) or a *new vehicle* (mode of presentation) for existing information.  
     *Motivation:* Physicalists often appeal to vehicles (e.g., "same fact, different concept"); anti-physicalists insist on new information.  

  ---

  ### **IV. Design Question Mandates**  
  *Non-negotiable clarifications*

  10. **Self-Knowledge Stipulation**  
      *Requirement:* Assume Mary’s physical omniscience includes complete knowledge of her *own* current/future neurophysiology.  
      *Motivation:* Blocks indexical/demonstrative replies (e.g., "she learns which state *this* is"). If her omniscience includes self-locating facts (e.g., "I will be in state S at t"), the theory must still explain her gain.  

  11. **Mislabeling Test**  
      *Requirement:* Deliver a verdict when Mary is shown *green* but told it’s red, and she believes it.  
      - *If* the theory says she knows what red is like: Explain how *experience itself* (not just causal history) contributes, given the mislabeling.  
      - *If not:* Specify what she *does* acquire (e.g., "knowledge of what green is like," "false belief about red").  
      *Motivation:* Tests whether the theory prioritizes phenomenology, intentional content, or causal relations.  

  ---

  ### **V. Flagged Tension: Physicalism Verdict vs. Neutrality**  
  You suspect correctly: **The Physicalism-Verdict Constraint (#3) and neutrality on whether phenomenal properties are physical cannot be jointly satisfied.**  
  - **Why?** The knowledge argument aims to refute physicalism by showing Mary gains non-physical knowledge. A theory satisfying #3 *must* take a stand: either Mary’s gain implies non-physical properties (anti-physicalism), or it doesn’t (physicalism). Neutrality about phenomenal properties’ physical status (e.g., "it’s just a new mode of access") either implicitly endorses physicalism (by denying new properties) or fails #3. This tension is **real**, not an artifact—your purpose demands a metaphysical verdict.  

  ---

  ### **VI. Scoring Standard Responses**  
  *Briefly assessed against the desiderata (✓ = satisfies, ✗ = fails, ~ = partial)*  

  | Response                          | Core (1-3)       | Cases (4-6)      | Distinctions (7-9) | Design Qs (10-11) |  
  |-----------------------------------|------------------|------------------|--------------------|-------------------|  
  | **Ability Hypothesis** <br>(Lewis, Nemirow) | ✗ (Denies novelty #1; saves physicalism #3) | ✓ Original #4 <br>✗ Skilled Visualizer #5 (if imagination is an ability) <br>✗ Tetrachromat #6 (no ability for unknown colors) | ✓ Clarifies knowledge-how #7 <br>✓ New vehicle, not info #9 | ~ Self-knowledge #10 (if abilities indexical) <br>✗ Mislabeling #11 (gains ability for green, not red) |  
  | **Phenomenal Concept Strategy** <br>(Stoljar, Papineau) | ~ (Saves physicalism #3; novelty as concepts #1) | ✓ Original #4 <br>✓ Skilled Visualizer #5 (imagining ≠ possessing concept) <br>~ Tetrachromat #6 (new concept, but no new property) | ✓ New concept, not fact #8 <br>✓ New vehicle #9 | ✓ Self-knowledge #10 <br>✗ Mislabeling #11 (acquires concept for green, not red) |  
  | **Jackson’s Conversion** <br>(Later physicalism) | ~ (Saves physicalism #3; novelty as "knowledge how" #1) | ✗ Skilled Visualizer #5 (if imagining suffices) <br>✗ Tetrachromat #6 | ✓ Knowledge-how #7 | ~ Self-knowledge #10 <br>✗ Mislabeling #11 (same as ability hyp.) |  

  **Summary:** All physicalist replies struggle with **Tetrachromat (#6)** and **Mislabeling (#11)**, where gains can’t be reduced to abilities or repackaged facts. Only anti-physicalist theories cleanly satisfy all, but at cost of physicalism.  

  ---

  ### **VII. Verdict on Your Purpose**  
  **I accept your purpose as legitimate and non-question-begging.**  
  - **Why?** The knowledge argument is expressly designed to challenge physicalism. A theory that "gets every case right" but dodges the metaphysical implication (e.g., via quietism or semantic reinterpretation) fails to engage the argument’s core function. Your constraint forces theories to show their cards: either Mary’s gain is metaphysically innocent (saving physicalism) or it reveals a gap in physical ontology (defeating it). This doesn’t beg the question—it sets the stakes.  
  - **Caveat:** This purpose *does* assume that physicalism must be true or false (no third way), but that’s inherent to the debate.  

  ---

  ### **Recommendation for Your Chapter**  
  Use this framework to:  
  1. **Critique existing replies** by showing where they fail specific desiderata (e.g., physicalist strategies flounder on Tetrachromat).  
  2. **Motivate your own account** by resolving tensions (e.g., if you can satisfy the mislabeling test while preserving physicalism, you advance the field).  
  3. **Defend your Physicalism-Verdict Constraint** explicitly against "neutralist" objections.  

  This approach ensures you resist "picking a team" prematurely while setting rigorous, dialectically fair criteria for victory.
