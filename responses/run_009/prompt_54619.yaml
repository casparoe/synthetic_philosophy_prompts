  **Dr. KS:** So... evidence? Field data on arbitration outcomes. If KS fits better when one side’s options improve, I’d yield.  

  **Dr. Nash:** Lab experiments. If adding symmetrically-dominated options shifts real bargains, Nash is wrong. And if Rubinstein’s shadow hangs over us... well.  

