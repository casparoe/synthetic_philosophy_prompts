  Then *u*<sub>U</sub> = (4/5)(65.625) = 52.5. So ≈(65.6, 52.5). Rounds to **(66,53)**. Favors Admin, but fairly—they *could’ve* gotten more alone.  

  **Dr. Nash:** You’re anchoring on an impossible point! (75,60) is infeasible. Why should Union care what Admin *might* have gotten in a parallel universe? Your ratio—"what you get vs. what you could’ve gotten"—is arbitrary. Independence of Irrelevant Alternatives (IIA) is cleaner: delete options no one would choose, and the solution shouldn’t move. Add your (75,60) to the set? Fine—still infeasible. Nash stays at (60,60). Delete (60,60)? Now the feasible set is just (0,0)–(75,40). Nash product max at (75,40). But *you* jump to (75,40) too! Because your "ideal" collapses to (75,40). So IIA holds for Nash but fails for you.  

  **Dr. KS:** (nods) Conceded—IIA fails for KS. But that’s a *virtue*. Suppose Admin finds a new grant, adding a point like (80,60). Now feasible set expands. KS: ideal becomes (80,60), ray slope 60/80=0.75, solution adjusts to (≈72,54). Both gain proportionally. Nash? Originally (60,60). With (80,60), Nash product at (80,60) is 4800 > 3600, so you jump to (80,60). But IIA masked the problem: if Admin *strategically hides* options—say, offers only deals where *u*<sub>A</sub> ≥ 65—then Nash shifts to (65,53.3) *instantly*. Union loses 6.7 units! Your IIA lets Admin manipulate by burning options.  

