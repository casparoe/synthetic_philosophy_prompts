  **Setting:** A university committee room. Dr. Nash (pro-Nash Bargaining Solution) and Dr. KS (pro-Kalai-Smorodinsky) must recommend a settlement between the university administration (Admin) and grad-worker union (Union). Disagreement point = (0,0). Feasible set: convex hull of (0,0), (60,60), and (75,40). Pareto frontier is the line segment from (60,60) to (75,40).  

  ---

  **Dr. Nash:** (pointing at a whiteboard) Simple arithmetic: the Nash product *u*<sub>A</sub> *× u*<sub>U</sub> is maximized at (60,60). Product is 3600. At (75,40)? 3000. At (70,50)? 3500. Still less. So we recommend (60,60)—balanced, symmetric.  

  **Dr. KS:** (leans forward) Symmetry’s fine, but your solution ignores the *structure* of the set. The ideal point is (75,60)—Admin’s max is 75 (at (75,40)), Union’s max is 60 (at (60,60)). Draw the ray from (0,0) to (75,60): slope = 60/75 = 0.8. Intersects the Pareto frontier where *u*<sub>U</sub> = 0.8*u*<sub>A</sub>.  
