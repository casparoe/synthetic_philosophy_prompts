  so, background: I've been hanging around rationalist blogs and forums since the aughts, and somewhere along the way I stopped treating Hofstadter's line about the self as just a cute metaphor. the 'I' is a strange loop, a pattern, and patterns aren't tethered to one substrate — he gestures at this in GEB and then much more personally in I Am a Strange Loop, where he writes about carrying a partial copy of his wife Carol in himself after she died, her habits and ways of thinking still partly running in his brain. I've come to actually believe this as a claim about survival, not just as consolaton: that an 'I' can be distributed, and that my persistence after death is real insofar as my pattern keeps partially executing in the people who knew me. what would count against it? I want the defeaters ranked from fatal to merely awkward, and I want you to press hard on the worry that the view quietly collapses into "I influence people," which nobody ever denied — does the survival claim do any work the influence claim doesn't? Also tell me which of these a committed defender of the view would concede really counts against it versus wave away, and whether the position has been qualified into unfalsifiability (all that "only partially," "to some degree") in a way that's a genuine problem for a claim of this kind rather than just vagueness at the edges. lay it out in these sections, in this order: "The view, stated so it can lose" (~150 words — sharpen it into something that could actually turn out wrong); "Fatal" (~250 words); "Serious but survivable" (~250); "Merely awkward" (~150); "What defenders would concede vs. dismiss" (~200); "Is it insulated?" (~150); and finally "What would move me" (~100) — on that last one, the thing I'd personally find most persuasive is an argument that pattern-persistence without any continuation of experience isn't survival in a sense I should care about. Answer in British English please.
