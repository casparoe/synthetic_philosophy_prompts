prompt: |-
  I have been reading the rationalist blogosphere since the Overcoming Bias days, and I have watched the question of whether an aligned AI system should reason as a utilitarian or under deontic constraints resurface in one disguise after another: the corrigibility debates, arguments about whether tolerance of shutdown is better cashed out as a constraint or as a term in an expected-value calculation, and periodic flare-ups about whether machine ethics should be codified as rules or learned as preferences. Lately the standard framing has begun to feel stale to me, and I want help figuring out where the genuinely open questions actually are, because I suspect they are not the ones the recurring arguments keep rehashing.

  The framing I mean is this one: a utilitarian AI is fragile because utility functions are easily misspecified and expected-value reasoning goes haywire under extreme stakes, while a constraint-following AI is fragile because rules can be gamed, come into conflict, and freeze a mediocre moral code in place while the world moves on. That much I take to be roughly right and roughly useless. Here are the candidate questions I think might contain the real action, offered for pressure-testing:

  First, whether deontic constraints can do the work that corrigibility arguments need them to do. An AI that treats not resisting shutdown as a side constraint behaves very differently from one that assigns resistance a large negative utility, and the difference shows up only in corner cases — but corner cases are precisely where alignment failures live. Which is the better bet, and is the difference even coherent once you notice that a constraint-violating action can also be assigned a probability-weighted cost?

  Second, whether agent-relative constraints make sense for a system that is not an agent in the relevant sense. Deontology as standardly formulated distinguishes what I must not do from what I must prevent others from doing, which presupposes a persisting, unified subject. For a system that spawns subagents, is copied across hardware, and self-modifies, it is not obvious where the relativity attaches. This might be a real problem for implementing deontology, or a real problem for deontology, or nothing.

  Third, whether rule-consequentialism just collapses the whole choice. If what we can actually implement is a system that follows the rules that a sounder process would endorse, and if both utilitarian and deontological humans agree on many such rules, the dispute may be practically idle — or it may flare up exactly when the rules diverge from the ranking, which is again the interesting case.

  Fourth, what constraint-following prescribes in a world full of other agents. A sufficiently capable deontologist will find itself surrounded by constraint violations it could prevent at low cost; a utilitarian will want to aggregate them away. Whether a deontologist AI is obligated to police the world, forbidden to, or permitted to is not a corner case but the central case, and I have not seen it treated as one.

  Fifth, and most unsettling to me: whether the utilitarian-versus-deontologist distinction tracks anything in the space of systems we can actually build. The orthogonality thesis says intelligence is compatible with any goal structure, but it does not say which goal structures are easy to specify, easy to train, or stable under reflection. It could be that both theories are artifacts of human-verbalizable ethics and cut the implementation space at no joint at all.

  Suppose a small team — say four researchers with three years, doing conceptual and formal work rather than empirical ML — takes this on. Which of my five questions, or of the ones I have failed to list, should come first? Please defend the ordering rather than just assert it: I want to know which questions other alignment work tacitly presupposes answers to, which are tractable from the armchair, which would be better borrowed from existing moral philosophy rather than reinvented, and what would even count as progress. I would particularly like to know which of my candidates are confused or pseudo-questions, and what a ranking would look like if the criterion were contribution to near-term interpretability and specification work rather than long-run safety theory — I suspect the two rankings come apart, and I do not trust my intuitions about which criterion I should be using. I am less interested in a survey of the literature than in a defended agenda, including what evidence or technical developments over the next few years should reshuffle it.
reasoning: |-
  Okay, the user is deeply embedded in the rationalist/AI alignment space, with a nuanced understanding of the utilitarian vs. deontic debate's historical contours. They're clearly frustrated with the staleness of current framings and want to dig into what's *actually* unresolved. Their tone suggests intellectual restlessness—they've done the reading, they recognize the cyclical arguments, and now they want to cut through to the novel questions. 

  What's striking is their meta-awareness: they're not just listing questions but explicitly asking for pressure-testing, prioritization logic, and warnings about pseudo-questions. They're also unusually conscious of practical constraints (team size, timeline) and the tension between near-term vs. long-term value. The phrase "I do not trust my intuitions" feels significant—they're wary of their own epistemic biases.

  Their five candidate questions reveal sophisticated concerns:
  1. **Corner-case robustness** (shutdown resistance framing)
  2. **Agent-relativity in non-standard agents** (subagents/copies)
  3. **Rule-consequentialism as collapse risk**
  4. **Constraint interactions in multi-agent worlds**
  5. **Implementation-space realism** (orthogonality vs. buildability)

  The subtext throughout is: *Which of these actually matters for building things, and which are philosophical dead ends?* They're implicitly rejecting pure theorizing disconnected from implementability. 

  My response should avoid rehashing classic arguments (they're bored of those) and instead focus on:
  - **Demarcation**: Clearly separating philosophical from engineering questions
  - **Leverage**: Which answers would unlock concrete design choices
  - **Tractability**: What's resolvable with formal tools vs. requiring empirical ML
  - **Collapse risks**: Which questions might dissolve under scrutiny

  The team size constraint (4 people, 3 years) forces brutal prioritization. Near-term interpretability/specification work vs. long-term safety is a key tension—they suspect these pull in different directions, and they're right. I should explicitly map each question to that axis.

  Biggest risks in their framing:
  - They might over-index on "clean" formal solutions when messy hybrid approaches may dominate in practice (#5 is key here)
  - The multi-agent question (#4) is vastly underexplored and might be more urgent than they realize
  - "Corner cases" (#1) could be a red herring if the system's failure modes are systemic rather than edge-triggered

  I'll structure the response by:
  1. Killing pseudo-questions first (their #3 collapses fastest)
  2. Tackling agent-relativity (#2) as most tractable for formal work
  3. Treating multi-agent (#4) as the sleeping giant
  4. Framing utilitarianism vs. deontology (#1, #5) as specification problems rather than moral philosophy

  The litmus test for any answer should be: *Does this suggest a new constraint for reward function design or architecture?* If not, it's probably not worth the team's time.
answer: |-
  You've perfectly diagnosed the staleness of the standard utilitarian-vs-deontic framing in AI alignment. Your five questions cut to the genuine uncertainties, and I agree the recurring debates often miss the critical joints. Below is a defended prioritization for your team of four, based on **which questions block progress on near-term specification/interpretability while illuminating long-term safety**. I’ll justify the ordering by assessing tractability, leverage over other work, and pseudo-question risks. Crucially, this ranking assumes your goal is *actionable clarity for AI design*—not moral philosophy for its own sake.

  ### Prioritized Agenda (Defended Order)
  1. **Question 5: Does the distinction track anything buildable?**  
     **Why first?** This is the *master question*. If the utilitarian/deontic framing is an artifact of human cognition—not a natural division in goal specification—everything else risks being a philosophical dead end.  
     - **Tractability**: Testable with conceptual/formal work. Analyze existing architectures (e.g., RLHF, constitutional AI) for whether their failure modes split along utilitarian/deontic lines or follow other axes (e.g., myopic vs. non-myopic, corrigible vs. non-corrigible).  
     - **Leverage**: Resolving this exposes which alignment strategies are coherent. If the distinction collapses, your team avoids wasting years on Questions 1–4.  
     - **Near-term value**: Directly informs reward shaping, oversight, and interpretability. If deontology is "unnatural" for ML systems, we should stop trying to encode Kantian rules.  
     - **Risk**: This *could* be a pseudo-question if we conflate "buildable" with "human-like." Focus on *specification robustness*: which goal structures resist gaming/ambiguity under scaling?  

  2. **Question 2: Can agent-relative constraints work for non-agents?**  
     **Why second?** This is the most tractable *implementation* challenge. If deontic constraints require a unified "self," but AIs are modular, dynamic systems, deontology may be impossible to code—making Question 1 moot.  
     - **Tractability**: Formalize "agent-relativity" for distributed systems. Use agent foundations (e.g., embedded agency, subagent decomposition) to model how constraints could bind copies/subprocesses. Borrow from formal ethics (e.g., Broome’s weighing of reasons) but avoid philosophy rabbit holes.  
     - **Leverage**: Alignment work presupposes goal persistence across self-modification. If relativity fails, deontology is dead *even if desirable*.  
     - **Near-term value**: Guides architecture design (e.g., should we enforce a "unit of agency"?). Crucial for stochastic systems (e.g., LLM sampling producing "subagents").  
     - **Risk**: *Not* a pseudo-question—failure here sinks deontic alignment. But if answered negatively, it simplifies the landscape.  

  3. **Question 4: What do constraints prescribe in a multi-agent world?**  
     **Why third?** Unlike corner cases, this is the *default* for AGI deployment. A deontic AI facing widespread constraint violations (e.g., humans harming others) must choose: enforce rules globally (tyranny), ignore them (complicity), or something else. Utilitarian aggregation has its own horrors.  
     - **Tractability**: Model multi-agent interactions with game theory + deontic logic (e.g., Kagan’s "conflicting constraints"). Simulate tradeoffs (e.g., intervene vs. respect autonomy).  
     - **Leverage**: Most alignment schemes (e.g., debate, market-making) assume cooperative agents. This tests if deontology *demands* unaligned behavior (e.g., "I must stop all wrongdoing").  
     - **Near-term value**: Reveals specification gaps in real-world deployment. If deontology requires policing, it’s unsafe; if not, it may be inert.  
     - **Risk**: Could collapse into Question 5 (e.g., if "constraints" are just utility penalties). Focus on *practical prescriptions*: What does the AI *do* when it sees a theft?  

  4. **Question 1: Can constraints handle corrigibility corner cases?**  
     **Why fourth?** Shutdown/corrigibility is critical but *narrow*. If Questions 2/5 kill deontology, this is irrelevant. If not, differences in corner cases matter.  
     - **Tractability**: Compare constraint-based vs. utility-theoretic corrigibility formally. Use decision theory (e.g., stochastic vs. deterministic environments).  
     - **Leverage**: Corrigibility is a litmus test for alignment. But if deontology fails elsewhere, this won’t save it.  
     - **Near-term value**: Helps design shutdown protocols. However, if deontology is incoherent (per Q2/5), this won’t help.  
     - **Risk**: *Partially pseudo*. Assigning costs to constraint violations *is* utility maximization—the distinction may be verbal.  

  5. **Question 3: Does rule-consequentialism collapse the debate?**  
     **Why last?** This is likely a *pseudo-question*. Rule-consequentialism (RC) either reduces to utilitarianism (if "best rules" maximize expected value) or deontology (if rules are inviolable).  
     - **Tractability**: Analyze RC implementations (e.g., "rule utilitarianism"). If rules are learned from preferences, it’s preference utilitarianism; if fixed, it’s brittle deontology.  
     - **Leverage**: Low—RC doesn’t resolve conflicts between rules/outcomes. Human debates (e.g., "torture one to save many?") prove this.  
     - **Risk**: Collapses quickly. Prioritize only if previous questions revive deontology.  

  ### What Counts as Progress?
  - **For Q5**: A formal map of "goal-structure space" showing where utilitarianism/deontology fit among possible specifications (e.g., utility functions, rule sets, learned preferences). Evidence of discontinuity: if systems that "feel" deontic fail differently from utilitarian ones.  
  - **For Q2**: A prototype constraint system for subagents (e.g., in a gridworld) that maintains consistency across copies/modifications.  
  - **For Q4**: Game-theoretic models proving that deontic AIs *must* become tyrannical or powerless in non-ideal worlds.  
  - **Kill criteria**: If Q5 shows the distinction is artificial, deprioritize all else. If Q2 shows agent-relativity fails, discard deontology.  

  ### Critical Tacit Presuppositions
  1. **Orthogonality is incomplete**: Intelligence *might* covary with goal structures (e.g., planning requires utility functions). Q5 challenges this.  
  2. **Corner cases dominate risk**: But if deontology fails in central cases (Q4), corner cases don’t matter.  
  3. **Human ethics is relevant**: Q5 tests this—if AI goal structures don’t mirror human theories, we’re solving the wrong problem.  

  ### Near-term vs. Long-term Rankings
  - **Near-term (interpretability/specification)**: Q5 > Q2 > Q4 > Q1 > Q3.  
    *Why*: Specification work *requires* knowing if deontology is implementable (Q5/Q2). Multi-agent effects (Q4) emerge early in deployment.  
  - **Long-term (safety)**: Q4 > Q5 > Q2 > Q1 > Q3.  
    *Why*: Scalable alignment hinges on multi-agent dynamics (Q4). Q5’s buildability question determines if we’re optimizing in the wrong space.  

  ### What Could Reshuffle This?
  - **Empirical ML developments**: If RLHF consistently produces utilitarian-ish agents, deontology may be impractical.  
  - **Agent foundations breakthroughs**: A theory of "distributed agency" could resolve Q2 overnight.  
  - **Interpretability tools**: If we detect "constraint representations" in models, Q5 becomes urgent.  

  ### Recommendation
  Start with **Q5**. If the utilitarian/deontic distinction is illusory in practice, your team saves years. Then hit **Q2**—it’s the sharpest test for deontology’s viability. **Q4** is the sleeper issue: alignment assumes friendly environments, but the real world is a moral minefield. Be ruthless: discard questions that collapse (Q3) or depend on prior failures (Q1). Borrow from philosophy *only* when formalization is possible (e.g., Kagan for Q4)—otherwise, you risk recreating the staleness you’re escaping.
