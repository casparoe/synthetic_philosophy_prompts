  First, I need to understand the core of their disagreement. Tom's camp believes the intend/foresee distinction does real moral work, while Priya's camp sees it as rationalized intuition. The user finds Priya more convincing but suspects much of their fight is verbal. 

  The document needs five key elements: agreed claims, disagreements phrased acceptably for each camp, cruxes with predictive tests, identification of verbal disputes, and a bottom-line crux. Let me break this down systematically.

  For the agreed claims section, both camps should acknowledge the asymmetry in trolley judgments (diverting vs pushing), the need to define "intending" clearly (especially in bomber cases), and the role of intuitions as data points. These are neutral enough for both sides to accept while setting up the debate.

  The disagreements table requires careful wording. For harm-as-means vs side-effect, I'll present Tom's view as a categorical moral difference and Priya's as gerrymandering. On the loop case (where the fat man would die anyway), Tom would argue it preserves the distinction while Priya would say it collapses. For foreseen certainty, Tom maintains a difference while Priya equates it with intention.

  Now for the cruxes - these are the make-or-break points. The first crux is about principled stopping points between redirecting threats and using bodies. Both agree a "snowplow" case (where you push snow containing a person) would test this. Tom predicts people will see it as permissible diversion, Priya expects impermissibility judgments similar to footbridge.

  The second crux examines if the footbridge intuition stems from personal force heuristics. The "causal chain" case (remote button to drop fat man) serves as test. Tom predicts no moral difference from standard footbridge, Priya expects greater permissibility.

  The third crux tackles whether harm necessary for a means becomes intended. The "dead donor" transplant case is perfect: if pushing one into machinery saves five, is it different when their death is necessary? Tom says no, it remains intended; Priya says the necessity makes it equivalent to side-effect.

  I must highlight verbal disputes too. They're likely equivocating on "intention" - Tom means psychological state, Priya means causal role. Also "permissible" might carry different weights: moral absolution vs net benefit justification.

  For the bottom line, the snowplow crux seems most promising. If people consistently judge it like diversion rather than pushing, it could force Priya to acknowledge the distinction isn't just about personal force. That's where real movement might happen.

  Throughout, I'll use American English and fully describe thought experiments - no academic citations. The tone should be precise but accessible, honoring both positions fairly while pushing toward resolvable tests.
answer: |-
  **Joint Statement of Adversarial Collaboration on the Doctrine of Double Effect (DDE)**  
  **Parties:** Tom Camp (DDE Affirmative), Priya Camp (DDE Skeptical)  
  **Date:** October 26, 2023  

  ---

  ### 1. Agreed Claims  
  Both camps endorse the following statements as foundational common ground:  

  1.  **Asymmetry of Intuitions:** There is a robust, cross-cultural asymmetry in moral intuitions regarding paradigmatic cases. Most people judge diverting a runaway trolley onto a side track where it will kill one person (saving five others) as *permissible*, while judging pushing a large man off a footbridge onto the track to stop the trolley (killing him but saving five) as *impermissible*. Any adequate moral theory must acknowledge and address this asymmetry.  
  2.  **Intention Requires Tracking:** For an agent’s mental state to count as "intending" a harmful outcome, the agent must cognitively rely on that harm occurring for the success of their plan. This distinguishes cases like:  
      *   The **Terror Bomber**: Bombs civilians *to cause terror* (intends deaths as a means to demoralize).  
      *   The **Strategic Bomber**: Bombs a munitions factory to cripple war production, foreseeing with certainty that civilians nearby *will die as a side effect*. The deaths are not part of the plan’s success condition.  
  3.  **Intuitions as Data:** Moral intuitions about cases provide relevant *data* for moral theorizing. While the epistemic weight and defeasibility of intuitions are contested, both camps agree that theories must engage with these intuitions, either to explain them (Tom Camp) or to explain them away/reconcile them with broader principles (Priya Camp).  
  4.  **The Loop Case Challenge:** The "Loop Variant" of the trolley problem (where diverting the trolley onto the side track loops it back toward the five unless the one person is present and killed) presents a significant challenge to standard DDE explanations. It forces scrutiny of whether the distinction between "side effect" and "means" is stable when the harmful effect is *necessary* for the good outcome but not strictly *causally upstream* of it in the agent’s plan.  
  5.  **Foreseen Certainty is Psychologically Real:** Agents can foresee harmful outcomes with practical certainty without intending them. The psychological distinction exists (e.g., Strategic Bomber).  

  ---

  ### 2. Disagreements  
  | Issue | Tom Camp Position (DDE Affirmative) | Priya Camp Position (DDE Skeptical) |
  | :---- | :---------------------------------- | :---------------------------------- |
  | **Moral Significance of Intend/Foresee Distinction** | The distinction between *intending harm as a means* and *merely foreseeing harm as a side effect* marks a deep, *categorical moral difference*. Acts involving intended harm are intrinsically harder to justify and often impermissible, even if consequences are identical to acts involving merely foreseen harm. | The intend/foresee distinction, while psychologically real, does *not* mark a fundamental moral difference. It is primarily a *post-hoc rationalization* of intuitive emotional responses (e.g., aversion to personal force). The moral distinction is gerrymandered and fails to track underlying morally relevant features like net harm, consent, or rights violations. |
  | **The Loop Case Implications** | The Loop Case *preserves* the DDE distinction. The death of the one is still a *foreseen side effect* of diverting the trolley to the spur (the plan is "divert to the spur to block the trolley," not "kill the one"). The fact that the death is necessary for the spur to function *does not* make it intended. It remains fundamentally different from pushing the man off the footbridge, where his being crushed *is* the means. | The Loop Case *collapses* the DDE distinction. If the one person must die for the diversion to save the five, then their death is functionally *identical* to being used as a means, regardless of the agent's description. It reveals the arbitrariness of privileging "spatial separation" or "causal path" over functional necessity. |
  | **Foreseen Certainty vs. Intention** | Even when harm is foreseen with *certainty*, if it is not part of the agent's plan (not intended as means or end), it remains morally distinct from intended harm. The Strategic Bomber's act is *less morally problematic* than the Terror Bomber's act, even if deaths are identical, because of the different intentional structure. | When harm is foreseen with *certainty and necessity* for the success of the agent's plan (as in Loop or Strategic Bombing), the distinction between "foreseen side effect" and "intended means" becomes *morally irrelevant*. The agent knowingly chooses to bring about the harm; the mental gymnastics of not "intending" it are a smokescreen for the underlying moral reality of causing necessary harm. |

  ---

  ### 3. Cruxes with Recorded Predictions  
  **Crux 1: Is there a principled stopping point between redirecting a threat and using a person?**  
  *   **Concrete Case (Snowplow):** A runaway snowplow threatens five workers. You can divert it onto a different path. On this path, it will unavoidably hit and kill a lone worker *who is buried deep in a snowdrift and completely immobilized* (their body will stop the plow). Diverting the plow does *not* involve pushing, throwing, or direct physical contact with the victim.  
  *   **Tom Camp Prediction:** Most people will judge diverting the snowplow *permissible*, akin to standard Trolley diversion. The harm is a foreseen side effect of redirecting the threat; the victim is not *used* as a means in the way the footbridge victim is.  
  *   **Priya Camp Prediction:** Most people will judge diverting the snowplow *impermissible*, more akin to the Footbridge case. The victim's body is being *used* as the stopping mechanism, making it functionally equivalent to using the fat man.  

  **Crux 2: Is the Footbridge intuition primarily driven by aversion to close-range personal force?**  
  *   **Concrete Case (Remote Footbridge):** Identical to the standard Footbridge case (pushing one large man off to stop trolley, save five), *except* the agent pushes a button activating a trapdoor beneath the man’s feet, causing him to fall from 10 feet away. No direct physical contact occurs.  
  *   **Tom Camp Prediction:** Pushing the button will be judged *just as impermissible* as physically pushing the man. The impermissibility stems from *intending the death as a means*, not the physical proximity or method of force.  
  *   **Priya Camp Prediction:** Pushing the button will be judged *more permissible* than physically pushing the man. Reducing direct personal force will weaken the intuitive aversion, revealing the core intuition is driven by heuristic aversion to "up close and personal" harm, not the intend/foresee distinction.  

  **Crux 3: Does necessity for the good outcome make foreseen harm morally equivalent to intended harm?**  
  *   **Concrete Case (Dead Donor Transplant):** Five patients will die without immediate organ transplants (heart, lungs, liver, kidneys). A healthy person walks into the hospital for a routine checkup. You can *push* this person into vital-organ-harvesting machinery, killing them instantly to provide the organs and save the five. *Crucially, the machinery only works if the donor is alive upon entry but dies during the process; a corpse's organs are unusable.*  
  *   **Tom Camp Prediction:** Pushing the donor will be judged *impermissible*. The *necessity* of the death for the organs to be viable makes the death an *intended means* to saving the five. This is distinct from Strategic Bombing where the deaths, though certain and necessary for proximity, are not *the mechanism* of success.  
  *   **Priya Camp Prediction:** Pushing the donor will be judged *impermissible*, *but for the same reason* Strategic Bombing might be judged impermissible: causing severe, non-consensual harm for net benefit. The DDE fails to capture the core wrongness here (rights violation, lack of consent, exploitation). The "intention" is irrelevant; the harm is necessary and chosen.  

  ---

  ### 4. Verbal Disputes  
  *   **"Intending":** Tom Camp uses "intending" primarily to describe the *agent's psychological plan* – what they aim to bring about as part of their goal structure. Priya Camp often uses "intending" functionally, closer to *"the harm is a causally necessary component the agent knowingly relies upon for success."* This difference underlies disputes over cases like Loop and Strategic Bombing.  
  *   **"Permissible":** While both camps use "permissible" to mean "morally justified/allowed," Tom Camp often implies a stronger sense of *moral absolution* (the act is not intrinsically wrong), whereas Priya Camp uses it more instrumentally (the act produces the best consequences overall, even if regrettable). This can lead to talking past each other about whether DDE "explains" permissibility or "rationalizes" a necessary evil.  

  ---

  **Bottom line:** The Snowplow Case will reveal whether the core moral distinction lies in the use-of-body-as-means (Priya) or the intentional structure of redirecting-vs.-initiating (Tom).
