  **Key Features of this Draft:**

  1.  **Hard on Both:** E doesn't get to claim victory based solely on formal adequacy (Agreed Point 6). C doesn't get to define "explanation" as requiring robust truth-conditions by fiat (Disagreement Table, Crux 1 & 4). Both are challenged on uniformity (Crux 2) and the substance of their validity explanations (Crux 3).
  2.  **Focuses on Positions, Not Exegesis:** The document defines the core commitments of the positions ("Expressivist semantics," "Cognitivist account") without naming Blackburn/Gibbard or litigating interpretations.
  3.  **Isolates the Core Disagreement:** It moves beyond "Is there a formal system?" (Yes, Agreed) to "What kind of explanation does it provide?" (Disagreement).
  4.  **Identifies Testable Cruxes:** Each crux has a concrete test or comparison case agreed upon as relevant. Each side makes a falsifiable prediction.
  5.  **Acknowledges Verbal Element:** Explicitly pinpoints the ambiguity in "truth-condition" as a source of past confusion, while showing why the disagreement persists even after clarifying minimal truth.
  6.  **Uses Agreed Foundations:** Builds the disagreements on top of the substantial common ground established in Section 1 (Validity, Frege Point, Compositionality Requirement, Emotivism's Failure, Formal Adequacy, Minimal Truth).
  7.  **Structured for Clarity:** The numbered agreements and table format force precision and isolate points of contention.

  This document provides a rigorous framework to move the debate forward by focusing on specific, testable claims about explanatory power and uniformity, grounded in shared understanding of the problem and its formal requirements.
