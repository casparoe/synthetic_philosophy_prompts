  - Publicity: recoverable by any observer. Motivated by public nature of language.

  But there are complications:
  - Indexicals: Davidson's Tarskian approach struggled with "I"/"here"/"now". Requires supplementation (Kaplan-style?).
  - Malapropisms: Davidson's later "Nice Derangement" argues successful communication without shared conventions. Challenges fixed prior theories.

  Additional desiderata to consider:
  - Charity as coherence: but is this epistemological (interpreter's bias) or semantic? User suspects tension.
  - Learnability: must be acquirable from finite evidence. Motivated by child language acquisition.
  - Holism: meaning assignment affects whole system. Motivated by Quinean web of belief.

  Now for non-negotiables vs Tarskian baggage:
  Non-negotiable: evidence-constraint, belief-meaning separation, publicity (core to radical interpretation setup). Compositionality seems essential too. Tarskian baggage might be truth-conditional format specifically.

  Potential conflicts:
  - Charity vs evidence: if charity requires interpreter's conceptual scheme, it violates behavioral constraint.
  - Malapropisms vs fixed conventions: if meaning isn't prior shared, how is communication possible? Might require dynamic meaning.

  Evaluating candidates:
  1. Davidsonian truth theory: Strong on compositionality, belief-meaning via charity. Weak on indexicals, malapropisms. Charity may smuggle interpreter's semantics.
  2. Field linguist (actual practice): Handles indexicals contextually, malapropisms pragmatically. But relies on innate biases? Violates publicity if using private cognition.
  3. Distributional learner (LM): Excels at evidence-based learning, compositionality via embeddings. But conflates meaning with belief (trained on text, not assent/dissent), lacks clear belief-meaning separation. Public? Weights are but interpretation isn't transparent.

  The knockout requirement seems to be belief-meaning separation - it's what LMs fundamentally fail at while Davidson's theory builds it in. Hence \answer{Belief-Meaning Separation}.

