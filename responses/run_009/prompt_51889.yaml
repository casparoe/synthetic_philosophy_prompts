  - Evidence-constrained: must rely only on observable behavior (assent/dissent patterns) not private intuitions. Motivated by field linguist scenario with no shared language.
  - Belief-meaning separation: must handle massive false belief without collapsing meaning. Motivated by cases like ancient astronomers referring correctly to Venus despite false cosmological beliefs.
