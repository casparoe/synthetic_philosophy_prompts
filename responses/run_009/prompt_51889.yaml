answer: |-
  Below is a structured specification of desiderata for a theory of meaning adequate for radical interpretation, motivated by philosophical and empirical cases. I've pruned, expanded, and systematized your seeds, highlighting tensions and scoring key candidates. Requirements are grouped by core function, with **non-negotiables** in bold (failure violates the radical interpretation premise). *Negotiable/Tarskian-prejudiced* items are italicized.

  ---

  ### **Desiderata for a Radical Interpretation Theory of Meaning**
  1. **Evidence-Constrained Empirical Basis**  
     *Motivation*: Field linguist scenario (no shared language). Theory must be testable against *only* observable behavior: patterns of assent/dissent to utterances in publicly observable circumstances (e.g., speaker assents to "Gavagai!" only when rabbits appear).  
     *Excludes*: Reliance on paraphrase intuitions, internal mental states, or pre-existing semantic knowledge.  

  2. **Belief-Meaning Separation**  
     *Motivation*: Massive false belief cases (e.g., ancient astronomer who says "Hesperus is not Phosphorus" due to ignorance, yet refers successfully to Venus). Meaning must remain stable while beliefs diverge; interpretation cannot collapse meaning into belief attribution.  

  3. **Compositionality**  
     *Motivation*: Productivity/systematicity of language (e.g., understanding "green idea" without prior exposure). Forces recursive structure over lookup tables. Handles novel utterances (e.g., "That grue emerald is bleen") without ad hoc additions.  

  4. **Publicity**  
     *Motivation*: Language as a social tool. Theory must be recoverable from behavior observable by *any* suitably equipped interpreter (e.g., two field linguists independently converging on the same meaning assignment). Bars private semantic facts.  

  5. **Indexical/Demonstrative Coverage**  
     *Motivation*: Utterances like "I am here now" or "That is a rabbit". Theory must resolve context-dependence (speaker, time, location, gesture) without presupposing shared conventions.  

  6. **Malapropism Tolerance**  
     *Motivation*: Davidson's "Nice Derangement" cases (e.g., saying "epitaphs" to mean *epithets*). Theory must explain communication *without* shared prior conventions, allowing meaning to be dynamic, speaker-specific, or adjusted in real-time.  

  7. **Holism via Charity/Coherence**  
     *Motivation*: Interpretation under uncertainty (e.g., interpreting "Gavagai" requires assuming the speaker sees rabbits, not undetached rabbit parts). Forces meaning assignment to maximize rationality/consistency in the agent's web of beliefs and desires.  

  8. *Learnability from Finite Evidence*  
     *Motivation*: Child language acquisition. Theory must be acquirable from bounded behavioral data. *But Tarskian baggage: truth theories need not be learnable; this is an empirical add-on.*  

  9. *Truth-Conditional Format*  
     *Motivation*: Tarski-Davidson program. Meaning captured by truth axioms (e.g., "Snow is white" is true iff snow is white). *Negotiable: other formalisms (e.g., inferential roles) might suffice for radical interpretation.*  

  ---

  ### **Tensions & Inconsistencies**
  - **Charity vs. Evidence**: Charity (D7) risks smuggling in the *interpreter's* semantics (e.g., assuming the speaker shares the interpreter's logic or ontology). Yet evidence alone (D1) underdetermines meaning (Quinean indeterminacy). **This tension is irresolvable without weakening D1 or D7**—e.g., allowing *minimal* rationality constraints.  
  - **Malapropism (D6) vs. Publicity (D4)**: If meaning is speaker-specific and dynamic (per D6), can it be recovered *publicly* without prior conventions? D6 might require relocating "sharedness" to *post hoc* coordination.  
  - **Holism (D7) vs. Belief-Meaning Separation (D2)**: Maximizing coherence (D7) risks conflating meaning with belief (e.g., interpreting "water" as *H₂O* only if speaker has scientific beliefs). **D2 is the guardrail here**.  

  **Non-negotiable Desiderata**: **D1, D2, D4** (evidence, belief-meaning separation, publicity). Fail these, and the project isn't radical interpretation.  
  **Tarskian Prejudices**: *D8, D9* (learnability, truth-conditional format). Radical interpretation doesn’t strictly require them.  

  ---

  ### **Candidate Evaluations**
  | **Desideratum**       | **Davidsonian Truth Theory** | **Field Linguist (Actual)** | **Distributional Learner (LM)** |
  |------------------------|------------------------------|------------------------------|---------------------------------|
  | **D1: Evidence-Constrained** | Marginal: Requires idealized assent patterns. | Strong: Uses real-world cues (gesture, context). | Strong: Trained on surface text (token co-occurrence). |
  | **D2: Belief-Meaning Separation** | Strong: Charity distinguishes meaning/belief. | Weak: Often conflates via "folk semantics". | **Fail**: Encodes beliefs (e.g., biases) into "meaning". |
  | **D3: Compositionality** | Strong: Built-in via recursive axioms. | Moderate: Informal mental grammar. | Strong: Emerges from vector algebra. |
  | **D4: Publicity**      | Strong: Theory is extensional. | Weak: Relies on interpreter's cognition. | Marginal: Weights public, but semantics opaque. |
  | **D5: Indexicals**     | Weak: Awkward Tarskian fixes. | Strong: Contextual resolution. | Moderate: Captures via positional encoding. |
  | **D6: Malapropisms**   | **Fail**: Relies on prior conventions. | Strong: Pragmatic inference. | Moderate: Handles via context (e.g., "epitaphs" → *epithets*). |
  | **D7: Charity**        | Strong: Core axiom. | Strong: Heuristic coherence-seeking. | Strong: Coherence via loss minimization. |

  **Summary**:  
  - **Davidsonian Truth Theory**: Fails D5 (indexicals), D6 (malapropisms). D7 charity risks circularity.  
  - **Field Linguist**: Fails D2 (belief-meaning), D4 (publicity) due to cognitive biases.  
  - **Distributional Learner**: Fails **D2** (belief-meaning separation) catastrophically and D4 (publicity of semantics). Excels at D1, D3, D7.  

  ---

  ### **Key Exclusionary Requirement**
  **Belief-Meaning Separation (D2)** is the decisive filter. It excludes LMs (which bake training-data beliefs into "meaning") and informal field practices (which anthropomorphize speakers). Davidson’s theory handles it via charity but pays in empirical plausibility. Without D2, interpretation collapses into belief attribution—making radical interpretation impossible.  

  \answer{Belief-Meaning Separation}
