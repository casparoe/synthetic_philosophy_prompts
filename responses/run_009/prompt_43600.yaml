  Hmm, the user is on a scheduling committee for a folk music festival and they're frustrated with their current voting system. They've encountered issues like an act dropping out after ballots were cast leading to a different winner, strategic voting where someone ranked a rival last to manipulate Borda count, and problems with the donors' bloc feeling overruled. They mention Arrow's theorem and want guidance on designing a better voting system.

  The key points from their description are:
  - They have 30 voters (board members, stage crew leads, big donors)
  - 4-6 candidate acts plus a "joint co-headliner" option
  - Their current system uses ranked ballots but has flaws
  - They need a system that handles candidate removal after voting
  - Must resist strategic manipulation like "burying" rivals
  - Should give donors influence without dictating outcomes
  - Needs to produce stable results that won't be relitigated

  The user specifically wants:
  1. Desiderata (requirements) for their voting system, flagged as non-negotiable vs. preferences
  2. Identification of which requirements conflict and can't all be satisfied
  3. Recommendation on what to sacrifice and which method to use

  I need to address Arrow's impossibility theorem which shows no voting system can satisfy all of: unrestricted domain, Pareto efficiency, independence of irrelevant alternatives (IIA), non-dictatorship, and transitivity. For their situation with candidate removal causing winner changes, IIA is clearly violated. Strategic voting points to vulnerability to manipulation, which Gibbard-Satterthwaite theorem shows is unavoidable for deterministic systems with ranked ballots.

  Their specific constraints might offer some relief:
  - Only 30 voters (small group) could allow methods that don't scale well
  - 4-6 options plus default (manageable number)
  - Status quo option might anchor decisions

  But impossibility results still apply in principle. The core conflict is between:
  - Strategy resistance
  - IIA (stability when candidates are removed)
  - Coherence of results

  I recommend sacrificing strict IIA since their biggest pain point was the flipped result after candidate removal, but IIA is mathematically conflicted with other desiderata. Approval voting emerges as a strong contender because:
  - Resists "burying" strategy (since no rankings)
  - Handles candidate removal simply (just remove from approval sets)
  - Gives donors influence through approval thresholds
  - Produces stable, easy-to-understand results
  - Works well with small electorate and modest candidate pool

  For the donors' bloc, I suggest giving them a veto right if all approve an act, rather than trying to weight votes. This addresses their concern without violating equality.

  The bottom line is clear: sacrifice strict IIA and use approval voting with a donor veto clause. This meets their most critical needs while minimizing exposure to key impossibility results.
answer: |-
  **Bottom line: Sacrifice strict independence of irrelevant alternatives (IIA); implement approval voting with a donor veto clause, allowing voters to approve any number of acts, and requiring any winning act to not be unanimously disapproved by donors.**

  ### Desiderata for Festival Headliner Selection
  | Requirement | Concrete Justification | Non-Negotiable? | Notes |
  |-------------|------------------------|-----------------|-------|
  | **Candidate removal stability** | Removing a withdrawn act (like this year's cancellation) shouldn't arbitrarily flip the winner. | ★ Yes | Violated by Borda & some Condorcet methods; core complaint. |
  | **Resistance to "burying"** | Must deter ranking strong rivals last purely for tactical advantage (admitted by board member). | ★ Yes | Critical due to small, engaged electorate; Borda/IRV vulnerable. |
  | **Donor bloc influence (non-dictatorship)** | Bylaws require donors can't override everyone, but must have "due weight" (e.g., unanimous donor preferences shouldn't lose). | ★ Yes | Unique institutional constraint; donors furious when ignored. |
  | **Stability/acceptance** | Winning act must be broadly tolerable; no post-vote relitigation by crew/board. | ★ Yes | Practical necessity for volunteer-run festival. |
  | **Ordinal ballots optional** | Voters need expressive input but rankings aren't sacred; cardinal/set ballots acceptable. | No | Prejudice from literature; voters dislike rankings anyway. |
  | **Full collective ranking unnecessary** | Only need a winner (or top 3), not a full social ordering. | No | Pareto/transitivity less critical here; simplifies problem. |
  | **Unrestricted domain** | Must allow any voter rankings (no "sensible preferences" filter). | ★ Yes | Non-negotiable for fairness; voters submit arbitrary orders. |
  | **Resoluteness** | Must produce a single winner (or tiebreak clear). | ★ Yes | Joint co-headliner is a distinct option; can't deadlock. |

  ### Jointly Unsatisfiable Subsets & What to Sacrifice
  - **Conflicting Trio:**  
    **Candidate removal stability (≈IIA)** + **Resistance to burying (strategyproofness)** + **Unrestricted domain**  
    → **Arrow + Gibbard-Satterthwaite** prove this trio (with Pareto/non-dictatorship) is *impossible* for ranked methods producing a coherent order.  
    → **Sacrifice IIA:** Your cancellation incident shows IIA failures cause real outrage. But strategyproofness and domain are harder to relax. Approval/score voting sidesteps by ditching rankings.

  - **Donor Influence vs. Equality:**  
    Giving donors "due weight" without dictatorship risks violating **anonymity** (equal voter power). Solvable via procedural tweaks (e.g., donor veto clause) without breaking core rules.

  ### Why Your Constraints Don't Fully Dodge Impossibility
  - Small electorate (30) doesn’t avoid Arrow/Gibbard-Satterthwaite (apply to n≥2 voters).  
  - 6 options + default is still complex enough for cycles/strategic manipulation.  
  - Status quo default helps resoluteness but not IIA/strategyproofness.

  ### Why Approval Voting (+ Veto) Fits Best
  1. **Solves removal instability:** Remove candidate? Re-tally approvals—no IIA violation since no rankings exist to distort.  
  2. **Resists burying:** Approving a rival doesn’t hurt your favorite; no benefit to disapproving strong acts.  
  3. **Donor clause:** Stipulate that if *all* donors disapprove an act, it loses (giving "due weight" without dictatorship).  
  4. **Acceptability:** Simple, explains in 1 sentence ("check acts you’d accept"), minimizes disputes.  
  5. **Dodges key impossibilities:** Non-ranked ballot avoids Arrow/Gibbard-Satterthwaite traps (sacrifices IIA and collective ranking coherence, which you can tolerate).  

  **Tradeoff:** Approval can elect "broadly acceptable" but not deeply loved acts. For your case (avoiding hatred/relitigation > maximizing passion), this is optimal. Run it with the donor veto to preempt bloc fury.
