answer: |-
  Here's the case for biting the bullet on the Repugnant Conclusion, framed as your argument against your housemate:

  **The Argument:**

  The Repugnant Conclusion *is* counterintuitive. But that intuition isn't a reliable signal that the conclusion is morally wrong; it's largely an artifact of how our cognitive machinery interacts with different descriptions of the same abstract reality. Here's why:

  1.  **The Framing Flip Exposes the Intuition's Source:** When you frame the comparison as *adding* a vast population of barely-happy people *to* an existing happy population, you trigger powerful psychological heuristics:
      *   **Loss Aversion/Scope Neglect:** We focus intensely on the perceived *loss* to the happy group (even if they still exist happily) rather than accurately weighing the massive *gain* to the new group.
      *   **Salience Bias:** The image of "barely worth living" lives is stark and vivid. It easily dominates our emotional response, overshadowing the sheer scale of the positive existence being added.
      *   **Reference Point Distortion:** The "A+" world becomes the anchor. The "Z" world feels like a *degradation* of that world, rather than a distinct, massive creation of positive welfare.

  2.  **The Neutral Frame Reveals the Intuition's Weakness:** Framing it as choosing between two *entire, independent universes* ("History A" vs. "History Z") removes these distorting anchors. There's no "loss" to anyone, no pre-existing happy group being "harmed" by addition. We're forced to compare two wholes. In *this* framing, the intuition against "Z" significantly weakens or vanishes for many. This demonstrates that the initial, strong repugnance wasn't fundamentally about the *total welfare comparison itself*, but about the *narrative context* imposed by the "adding" frame.

  3.  **Description-Relativity Undermines the Reductio:** If the moral intuition *reverses or weakens* based solely on logically irrelevant descriptive framing (how we *talk* about the identical sets of lives and welfare), then that intuition cannot be trusted as evidence about the *underlying moral reality* of which outcome is better. A reliable moral intuition shouldn't be so easily hijacked by presentation. The repugnance feels like a deep moral insight, but its framing-sensitivity shows it's more likely a cognitive glitch – an emotional reaction to a specific *way of thinking* about the scenario, not a verdict on the scenario *itself*. Therefore, it fails as a *reductio ad absurdum* against total utilitarianism.

  **Addressing the Comeback ("Framing Cuts Both Ways"):**

  You're absolutely right, framing *can* influence pro-repugnance intuitions too. But this doesn't land a fatal blow to the totalist, and here's why:

  *   **The Core Totalist Intuition is Simpler and Harder to Frame Away:** The fundamental axiom – "more total welfare is better, *ceteris paribus*" – is incredibly robust. It doesn't rely on complex comparisons between vastly different populations; it's the bedrock principle applied consistently. While *specific judgments* about extreme cases like A vs. Z might be swayed by framing, the *core driver* (aggregation of welfare) remains compelling even when you acknowledge framing effects elsewhere. It's the simplest extension of valuing welfare within a single life or fixed population.
  *   **The "No Reliable Intuitions" Problem Hits Harder Elsewhere:** If framing sensitivity means we have *no* reliable intuitions about different-number cases, then *no* axiology (person-affecting, critical-level, average, etc.) has a secure foundation *in intuition* for its different-number judgments. They *all* rely on intuitions vulnerable to framing in these complex scenarios. Person-affecting views, for instance, face massive framing issues around non-identity problems and whether causing someone *to exist with a life worth living* can be "better for them" (intuitions flip wildly on this). Claiming they provide "fixed verdicts" ignores how deeply contested and frame-sensitive their core concepts (like "affecting") are in population ethics.
  *   **Totalism Has a Fallback: Coherence and Parsimony.** Faced with unreliable intuitions in extreme comparisons, totalism offers a clear, consistent, and parsimonious principle derived from the uncontroversial core of utilitarianism (more welfare good, less welfare bad). It avoids the complex, often counterintuitive, and potentially arbitrary thresholds or restrictions required by alternatives. While the Repugnant Conclusion feels bad, the alternatives often lead to conclusions many find *worse* (e.g., the "Sadistic Conclusion" where adding lives with *negative* welfare can be preferable under some average views, or the paralysis of strong person-affecting views). Biting the bullet on Z might be the price of coherence.
  *   **The Burden Shifts:** The framing critique successfully shifts the burden. The anti-repugnance intuition is shown to be unreliable *in this specific, crucial case*. While pro-aggregation intuitions *might* be swayed by framing in *other* complex cases, the core principle driving the Repugnant Conclusion itself remains the most straightforward and coherent extension of fundamental welfare valuation. The critic now needs to show not just that *some* pro-aggregation intuitions are frameable, but that the *core principle itself* is fatally undermined *and* that their preferred alternative provides a demonstrably *more* reliable and coherent foundation despite its own framing sensitivities and counterintuitive implications.

  **Verdict:** This argument successfully undermines the repugnance intuition as a decisive refutation of total utilitarianism by exposing its framing-dependence, forcing the burden onto critics to justify alternative axioms that are both less frame-sensitive and yield less problematic conclusions overall.
