  1. Teams cooperate and never use the Super Axe: Then the forest stays healthy and everyone gets 1 per round. But if one team defects, they get 5 and then the forest degrades. But if everyone cooperates, it's okay. But the point is that in the real world, someone will defect. To encourage defection, we can offer candy: each wood = one piece of candy? But the school might not allow food. Or we can just have points and the winning team gets a non-candy prize? Or just bragging rights.

  But the constraint says no real stakes. So we can use points and the winner is the team with the most points. That might be enough.

  2. The smart kid who knows the essay: He might try to organize cooperation. But that's hard in one lunch period and without communication. Or he might defect early to prove a point. Either way, it's fine. If he organizes cooperation, then the forest stays healthy. Then in the debrief, we can say: "In this game, you avoided the trap by cooperating. But in real life, it's hard because there are many players and communication is difficult." And then we can discuss why cooperation is hard.

  But if he defects, then the trap happens. So either way, it's illustrative.

  3. Ironic defection: A team might choose Super Axe even when they know it's bad, just to be funny. But that is actually the trap: they are doing what the trap predicts. So it's okay.

  4. Time: 45 minutes. 
     - 5 min: setup and explanation.
     - 25 min: 5 rounds (each round: 2 min for teams to decide, 2 min for facilitator to update -> 4 min per round? 5 rounds=20 min)
     - 15 min: debrief.

  But we must be strict on time.

  What the game can't capture:
  - Real existential stakes: the forest is just a game.
  - Inability to leave: they can mentally check out.
  - Long-term effects: only 5 rounds.

  But it should give a taste.

  Final game structure:

  Materials:
  - Whiteboard: track forest health and round number.
  - Index cards: for teams to write choices.
  - A bowl or hat for drawing the team that gets the Super Axe card each round (if we do random each round). Or we can have a pre-set random sequence.

  To save time, pre-set a random sequence for which team gets the innovation in rounds 2,3,4,5 (round 1 has no innovation). Write it down.

  Rounds: 1 to 5.

  Scoring: after each round, record the wood taken by each team.

  Debrief script:

  1. Show the final scores and the forest health (likely 0).
  2. Ask: 
     - "Raise your hand if your team used the Super Axe at least once. Why did you choose to use it?"
     - "Did any team not use the Super Axe when they had the chance? Why not? How do you feel about your score compared to others?"
     - "What happened to the forest? Why?"
     - "If we played again, what would you do differently? Would you still use the Super Axe if you got the chance? Why or why not?"

  3. Then explain the concept: 
     - "This game illustrates a common problem in real life called a multipolar trap or a race to the bottom. The idea is that when there's a shared resource and a way to gain a big advantage by harming the resource, the first one to do it wins big. Then others feel they must do the same or lose. And in the end, everyone loses because the resource is destroyed. 
     - Examples: 
          * Advertising arms race: if one company advertises, others must, and then everyone's profits go down because of the cost of advertising.
          * Overfishing: if one fisherman uses a more effective net, others must or they catch less. Then the fish population crashes.
          * Academic publishing: researchers feel pressured to publish in top journals, so they do whatever it takes (even cut corners) because if they don't, someone else will. Then the quality of science suffers.
     - The key point: no one is evil. Everyone is just playing by the rules and trying to win. But the rules of the game lead to a bad outcome for everyone."

  4. Then mention: "This dynamic is sometimes called Moloch, after a demon that represents destructive competition, from an essay you might have read. But the important thing is to recognize these traps in the real world and think about how to change the rules (through agreements, regulations, or new technologies) to avoid them."

  Handling the smart kid:
  - If he tries to organize cooperation, let him. But in the game, without binding agreements, someone might defect. If they all cooperate, then in the debrief we can discuss how rare that is in the real world and why.
  - If he defects, that's part of the game.
  - We can also say: "Even if you know the game, you might still feel forced to play along."

  This should work.
