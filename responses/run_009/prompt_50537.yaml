answer: |-
  Here is the toast draft, crafted in your uncle's voice, with all constraints honored:

  **(Clears throat, raises glass with a warm but intensely focused expression)**

  Family, friends... and brave souls who’ve wandered in from philosophy departments... thank you. It’s a profound honor to stand here for my remarkable niece and her partner on this... well, on this *precisely* what it is.

  You see, weddings have a way of making us talk about the unrepeatable. The *one* perfect day. The *once*-in-a-lifetime moment. The *singular* beginning. But today, I want to offer a different kind of blessing. A sturdier one, perhaps. One borrowed from an old friend of mine, a thinker who asked a question so heavy it could either crush you or make you stand impossibly tall.

  Imagine this. In your quietest, most solitary moment – maybe late at night, maybe early in the dawn when the world feels vast and you feel very small – a figure appears. Not sinister, perhaps, but utterly serious. It tells you something extraordinary. That this life you are living, *your* life, with every single thing that has ever happened to you, the soaring joys and the crushing sorrows, the mundane errands and the earth-shaking choices, the perfect harmonies and the grating discords... must be lived again. Not once more, but endlessly. An eternal return of the *exact* same sequence. Every triumph, every stumble, every cup of coffee, every heartache, every moment of quiet contentment, *even this very conversation we’re having right now*... repeated without variation, forever.

  **(Pauses, lets the weight settle, then smiles warmly at the couple)**

  The question this figure poses is simple, yet it contains the universe: Would you collapse under the weight of that thought? Or would you, facing the sheer totality of your existence, answer with a kind of fierce, trembling joy? Would you say, “Yes! Again! And again! I could ask for nothing more divine!”?

  **(Turns fully to the couple, voice softening but gaining intensity)**

  *That* is the question I put to you both today. Not as a burden, but as the deepest blessing I can imagine. My wish for you isn’t just a happy marriage today, or next year, or for fifty years. My wish is that you build a marriage so rich, so true, so *affirmed* in all its facets – the easy laughter *and* the necessary arguments, the shared dreams *and* the negotiated compromises, the grand adventures *and* the washing up – that you would, without hesitation, choose *this* day, *this* exact beginning, with all its tiny imperfections and minor disasters **(glances knowingly at perhaps a slightly wilted flower or a nervous DJ cue)**... you would choose to stand here again and say "I do," not just once, but eternally.

  Because that "Yes!" isn't about perfection. It’s about embracing the whole magnificent, messy, unedited reality of choosing each other, day after day after day. It’s about looking at the entire tapestry of your shared life, the bright threads and the darker ones woven together, and saying, "This. This is what I want. Again. Forever."

  **(Raises glass higher, voice resonant but deeply sincere)**

  So, to [Sister's Name] and [Groom's Name]. May you build a life together so fiercely, lovingly, and authentically *yours*, that if that solitary moment ever comes, you can face that figure, look at each other, and with one voice, declare: **"Yes. We would have it no other way. Bring on the encore... eternally."** To your eternal return!

  **(Holds the gaze, then smiles broadly)** Cheers!

  ---

  **Note for Uncle (from the Niece/Nephew):**

  Uncle, this draft strictly adheres to your constraints: no singularity framing, no hidden laments, pure practical affirmation, paraphrased Nietzsche, and the demon arrives as a blessing. The single line carrying the most risk of a *slightly* too-quiet room is: **"...the necessary arguments, the shared dreams *and* the negotiated compromises, the grand adventures *and* the washing up..."** It hinges on the audience catching the affectionate, affirming tone within the "necessary arguments" and "washing up" as part of the *whole* worth eternally willing. If you feel the room might misread it as dwelling on the negative, softening "necessary arguments" to "challenging conversations" or similar could work, though it slightly dulls the edge of embracing *everything*. Your call! Otherwise, it should land warmly for family and resonate precisely with the grad students. Break a leg!
