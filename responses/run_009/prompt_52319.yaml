prompt: |-
  Quick bit of background: I'm the type director at a small foundry, and we keep having the same argument every time someone pushes a design sketch in a stylised direction. Someone will do a brushy display face where the terminals flare so much the 'a' starts reading as 'o', or a blackletter-flavoured thing where the 'S' cap drifts towards 'f', and half the room says "it's still legible, look at it in context" and the other half says "you can read it because you know the word, that's cheating". We never resolve it because we have no shared way of deciding when a letterform has stopped being that letter, versus when it's that letter in an unfamiliar costume, versus when it's a perfectly fine letter that just doesn't belong in this family.

  So what I want from you is a decision procedure my team can actually run on a single glyph, in about ten minutes, before we commit it to a release. The interesting philosophical bit I want you to actually carry the weight of: what is it that makes every 'a' an 'a' -- is it the skeleton (the underlying topology, the closed bowl plus the right-side stem) versus the flesh (weight, contrast, terminals, the whole stylistic layer)? Or is it more like family resemblance across instances, or maybe it's recognitional, that what matters is what a reader triggers on in context? Whatever you decide, the procedure needs to make that call operational, and it needs to be honest about which bits of it are judgment calls dressed up as steps.

  Specific things I want the procedure to handle:

  - It should separate the question "is this still an a?" from the question "is this still an a in this family?" -- we sometimes reject a glyph that's a fine 'a' but a terrible fit for the design, and the procedure shouldnt merge those into one mushy verdict.
  - It needs a test for the context excuse, i.e. the designer saying "read this sample paragraph, you understood every word". My instinct is that word-level guessing is doing a lot of work there and I want a way to check that, maybe nonsense-string or isolated-glyph tests, but I'd like you to think about which tests actually probe letter identity versus just probing habitability of the style.
  - Blackletter is the classic edge case because historically readers who grew up on fraktur genuinely read those forms fluently, so any claim that e.g. a fraktur 'k' is "objectively confusable" needs to be more careful than it first looks. If the procedure has to bite a bullet here, say so.
  - Confusable pairs like b/d, l/1/I, rn/m should be treated as a distinct failure mode from "this stopped being an a" -- those seem like different sorts of problem and I suspect the fix differs too.

  Then run the procedure on three sketches from our current project: (1) the flare-terminal display 'a' I mentioned, which I privately love and will be annoyed if it fails, (2) a blackletter-inflected capital 'S' in an otherwise neutral sans, which I want killed but for principled reasons not vibes, and (3) a single-storey 'a' in a geometric sans where the team is split because it's totally legitimate in plenty of classic faces but reads oddly next to our double-storey 'g'. For each one, tell me where the procedure outputs a verdict and where it correctly punts to a human.

  Also please be upfront about what the procedure can't do: I'm guessing things like how much novelty readers will absorb in a week of exposure are genuinely outside what any checklist can decide, and I'd rather know that than have a procedure that pretends. Keep it usable by a junior designer without any philosophy background, so translate whatever distinctions you use into plain language, but don't lose the actual content while simplifying. Prefer no jargon you haven't explained inline, and dont worry about being nice about my flare-terminal 'a' -- if it fails, it fails.
reasoning: |-
  Okay, the user is a type director at a small foundry dealing with recurring arguments about when stylized letterforms cross the line from being creatively expressive to illegible. They need a practical decision procedure to evaluate single glyphs quickly, addressing philosophical questions about what defines a letter's identity versus its stylistic expression. 

  Hmm, the core tension here is between skeletal structure (what makes an 'a' fundamentally an 'a') and stylistic flesh (the decorative variations). The user wants this distinction operationalized—something their team can execute in ten minutes per glyph. Key pain points include: separating glyph identity from family fit, testing context-dependent legibility fairly, handling historical scripts like blackletter respectfully, and differentiating between "not a letter" versus "confusable with another letter."

  Right, first I need to establish what constitutes letter identity. Linguistics and type design theory suggest the skeleton is primary—the topological relationships that persist across typefaces. For 'a', that's the closed bowl + stem structure. But we must acknowledge that some scripts (like blackletter) have culturally learned skeletons. So the procedure must test both intrinsic structure and extrinsic confusability.

  For the context excuse problem—designers arguing "you can read it in a word"—the solution needs controlled isolation tests. Nonsense strings (like "avq") force letter-by-letter reading rather than word guessing. But we shouldn't entirely dismiss context; it just belongs in a secondary "habitability" check after verifying baseline recognizability.

  Blackletter is tricky. Historically, its forms were perfectly legible to contemporary readers. So the procedure must distinguish between "unfamiliar to modern eyes" versus "objectively broken." We'll flag deviations from historical reference skeletons as hard fails, but accept period-appropriate forms that merely feel alien today. The bullet we bite: if a glyph matches documented blackletter conventions, it passes—even if junior designers find it jarring.

  Confusables (b/d, rn/m) are a separate category. They occur when skeletons are valid but too similar in context. These need pairwise testing with likely neighbors, not rejection of the glyph itself. Different fixes: spacing adjustments, stylistic tweaks, or accepting it as a known tradeoff in expressive designs.

  Now to structure the actual procedure. Ten minutes means strict time boxing. Let's break it into three phases: 
  1. Skeleton check (topology test): Does it have the essential strokes? 
  2. Confusability test (neighbor isolation): Does it impersonate another letter? 
  3. Family fit (contextual harmony): Does it clash with sibling glyphs? 

  Crucially, phases 1 and 2 are binary gates—fail either, and the glyph gets rejected or redesigned. Phase 3 is subjective but necessary; a structurally sound 'a' might still ruin a typeface if it's stylistically inconsistent. We'll use quick overlay comparisons and sample words here.

  What the procedure won't solve: long-term reader adaptation (too speculative), cultural biases (team must acknowledge their own limitations), and ultra-niche genres (e.g., a typeface exclusively for medieval reenactors). We'll state these limits upfront.

  Applying to their examples: 
  - The flared 'a' likely fails phase 1—if terminals swallow the bowl, it's no longer topologically an 'a'. 
  - The blackletter 'S' passes if it matches historical 'S' skeletons, but might fail phase 3 (family fit) in a neutral sans. 
  - The geometric single-story 'a' should pass phase 1 easily but might trigger confusability (with 'o'?) or family fit issues next to the double-story 'g'. 

  Biggest risk: designers resisting skeleton failures because they love a stylistic flourish. The procedure must be ruthless on phase 1—no amount of charm excuses a broken topology. But we'll soften the blow by separating "not an a" (fatal) from "awkward in this family" (negotiable).
answer: |-
  Here's a practical decision procedure designed for your team, based on a **skeleton-first philosophy** with clear separation of concerns. The core principle: **A letter's identity lives primarily in its topological skeleton (stroke relationships and enclosure patterns), not its stylistic details.** This is operationalized in three phases:

  ---

  ### **The Glyph Viability Procedure (10-Minute Drill)**
  **Tools Needed:** Sketch, tracing paper, reference alphabet (same style), pen, timer.

  #### **Phase 1: Skeleton Integrity Check (3 mins)**  
  *Tests: "Is this fundamentally still the intended letter?"*  
  1. **Trace the skeleton:** Overlay tracing paper. Draw ONLY:  
     - Stroke endpoints & intersections (nodes)  
     - Enclosed counters (bowls, eyes)  
     - Primary axis directions (e.g., vertical stem in 'd', diagonal in 'k')  
     *Ignore:* Weight, serifs, terminals, contrast.  
  2. **Compare to reference:** Overlay skeleton of a neutral reference glyph (e.g., Helvetica 'a').  
     - **Critical Question:** Do core topological features match? (e.g., 'a' must have: *closed lower bowl + open-top counter + right stem*).  
     - **Fail if:** Topology is broken (e.g., bowl closure lost in 'a', making it 'o'-like; 'S' loses upper/lower curve distinction, becoming 'f'-like).  
     - **Pass to Phase 2 if:** Skeleton is intact.  

  #### **Phase 2: Confusability Test (4 mins)**  
  *Tests: "Could this be misread as ANOTHER letter in isolation or context?"*  
  1. **Isolate the glyph:** Write it alone, 5 times, in a grid.  
  2. **Generate nonsense strings:** Create 3 random 5-character strings using the glyph (e.g., "äkz", "qpä", "yäv").  
  3. **Pair with confusable neighbors:** Test in problematic pairs (e.g., 'b/d', 'rn/m', 'il1').  
     - **Critical Question:** Can 3 people (not the designer) immediately name the CORRECT letter >90% of the time?  
     - **Fail if:** >10% misidentification OR hesitation >2 seconds.  
     - **Note:** *Blackletter exception:* If the glyph matches HISTORICAL fraktur skeletons (e.g., documented 'S' forms), it passes—even if modern readers stumble. Contextual fluency is separate.  

  #### **Phase 3: Family Fit Assessment (3 mins)**  
  *Tests: "Does this stylized glyph harmonize with the family’s voice?"*  
  1. **Overlay key siblings:** Place glyph next to 'n', 'o', 'e', and a control glyph (e.g., 'x').  
  2. **Write test words:** "ambidextrous", "handgloves" (covers skeletons + confusables).  
     - **Critical Question:** Does it feel like an outlier in:  
       - Stylistic DNA (e.g., terminal treatment, contrast axis)?  
       - Color/texture (when typeset in a block)?  
     - **Verdict:** "Pass/Fail for family fit" (separate from Phases 1-2).  

  ---

  ### **Key Philosophical Underpinnings**
  - **Skeleton > Flesh:** The topology defines the letter. Style modulates recognition speed/comfort but doesn’t change identity if the skeleton holds.  
  - **Context isn’t "cheating" but isn’t sufficient:** Legibility tests MUST include isolation/nonsense to prevent word-guessing from masking glyph ambiguity.  
  - **Blackletter bullet bitten:** Historical forms are valid skeletons. Modern unfamiliarity ≠ invalidity. Confusability tests must reference period-accurate glyphs.  
  - **Confusables ≠ Identity failure:** A 'b' that reads as 'd' is a *spacing/weight* issue; an 'a' without a bowl is *topological failure*.  

  ---

  ### **Application to Your Sketches**
  #### **(1) Flare-Terminal Display 'a'**  
  - **Phase 1 (Skeleton):** Likely **FAIL**. If terminals flare so much they visually merge, destroying the bowl closure, topology is broken. No longer an 'a'.  
  - **Phase 2:** Skipped (fails Phase 1).  
  - **Phase 3:** N/A.  
  - **Verdict:** Redesign or reject. It’s not an 'a'.  

  #### **(2) Blackletter 'S' in Neutral Sans**  
  - **Phase 1:** **PASS** if it matches historical fraktur 'S' skeletons (e.g., diagonal spine, asymmetric curves).  
  - **Phase 2:** **PASS** if historically accurate (even if modern readers hesitate).  
  - **Phase 3:** Likely **FAIL (family fit)**. A fraktur 'S' in a neutral sans will violate stylistic DNA.  
  - **Verdict:** Reject *for this family*, but glyph is valid.  

  #### **(3) Single-Storey 'a' in Geometric Sans w/ Double-Storey 'g'**  
  - **Phase 1:** **PASS** (skeleton intact).  
  - **Phase 2:** **PASS** unless it confuses with 'o' (test nonsense: "aod", "oao").  
  - **Phase 3:** **Human judgment call.** Does it clash with double-storey 'g'? Test:  
     - Overlay 'a'/'o'/'g': Is 'a' closer to 'o' than 'g' is to its siblings?  
     - Set "agriculture". If 'a' feels like a different style era, it fails family fit.  
  - **Verdict:** Phase 3 decides. It’s a valid 'a' but may not belong here.  

  ---

  ### **What This Procedure Can’t Do (Be Honest Upfront)**  
  - **Predict reader adaptation:** A glyph that fails Phase 2 today *might* be learned in context over time (e.g., blackletter). The procedure errs on accessibility.  
  - **Resolve cultural biases:** Teams must acknowledge if they’re rejecting unfamiliar-but-valid forms (e.g., non-Latin influences).  
  - **Replace design intuition:** Phase 3 ("family fit") will always be subjective. The procedure just isolates it from legibility failures.  
  - **Fix spacing issues:** Confusables from poor spacing (e.g., 'r' + 'n' = 'm') require kerning adjustments, not glyph redesign.  

  ---

  ### **Team Workflow Script**  
  1. **Designer presents glyph + skeleton tracing.**  
  2. **Team runs Phase 1-2 together (7 mins).** Fail = reject/redesign. Pass → Phase 3.  
  3. **Phase 3: Quick vote.** Majority decides family fit.  
  4. **Document verdict:** "Failed skeleton (Phase 1)", "Confusable with X (Phase 2)", or "Rejected for family fit (Phase 3)".  

  This forces clarity: Your flare-terminal 'a' fails because its skeleton is gone, not because it’s "too stylized." The blackletter 'S' is valid but belongs elsewhere. And the single-storey 'a'? That’s a battle of taste—but now you know the real stakes.
