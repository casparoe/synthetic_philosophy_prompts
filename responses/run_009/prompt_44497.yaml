  We are drafting a joint statement for a neuroscientist (representing the Libet paradigm and its successors as showing that conscious intention is post-hoc) and a philosopher (compatibilist, arguing that these experiments only probe shallow volition). The goal is to have agreed claims, precise disagreements, and cruxes with predictions.

  Structure:
  1. Agreed Claims: numbered list of statements both can sign.
  2. Disagreements: a table with topics and each side's wording (accepted as fair).
  3. Cruxes: short prose section on each crux, with agreed test and each side's prediction.

  After the document, a JSON summary.

  Let's start with the agreed claims. What can both agree on?

  Agreed Claims (based on the description and common ground):

  1. **Libet's Raw Findings**: In the Libet paradigm, when subjects perform a spontaneous wrist flexion and report the time of their conscious intention (W-time) using a clock, neural activity (the readiness potential, RP) precedes the reported W-time by approximately 500 milliseconds.

  2. **Replication**: The basic finding of RP preceding W-time has been replicated in multiple studies, though the exact timing may vary.

  3. **W-time Measurement Issues**: The method of reporting W-time using a clock is subject to potential distortions in temporal judgment, as acknowledged in the literature on time perception.

  4. **fMRI Decoding**: Subsequent work using fMRI has shown that predictive information about a simple binary choice (e.g., left or right button press) can be decoded from brain activity several seconds before the subject reports being aware of making the choice.

  5. **Arbitrary Nature of Movement**: The actions studied in these experiments (like wrist flicks or button presses) are arbitrary, in the sense that they are not chosen for any particular reason and are performed without external prompting.

  6. **Veto Window**: Libet proposed that there is a window of time after the conscious intention and before the action during which the subject might veto the action. This has been interpreted variably.

  7. **Accumulator Models**: Some models interpret the readiness potential as an accumulation of neural activity that may represent subthreshold preparation, but not necessarily a completed decision.

  8. **Scope of the Experiments**: These experiments were designed to study the timing of conscious intention relative to brain activity for simple, spontaneous movements. They were not designed to study complex, deliberate decisions that involve reasoning, long-term planning, or moral considerations.

  9. **Conscious Will as Cause**: The claim that "conscious will causes action" in the simple, direct way that might be suggested by folk psychology is not what the philosopher defends as necessary for free will (in the compatibilist sense). The philosopher holds that free will is compatible with determinism and does not require that consciousness be an uncaused cause.

  Now, the disagreements. We need to phrase each side's view in a way they would accept as fair.

  Disagreements:

  Topic 1: What do the experiments show about conscious intention?

  - Neuroscientist: The experiments demonstrate that the conscious experience of intention (as measured by W-time) is a post-hoc confabulation that follows, rather than causes, the neural processes that initiate the action.
  - Philosopher: The experiments show only that for arbitrary movements, the conscious experience of intention arises after the onset of neural preparation, but they do not show that conscious intention is a confabulation, nor do they address the role of consciousness in deliberate, reason-responsive actions.

  Topic 2: What is the nature of the readiness potential (RP)?

  - Neuroscientist: The readiness potential reflects the brain's decision to move, and its early onset relative to W-time indicates that the decision is made non-consciously.
  - Philosopher: The readiness potential may be interpreted as subthreshold motor preparation that does not constitute a completed decision until it crosses a threshold, and the subject may still consciously control the action through the possibility of veto (as per Libet) or by being the agent of the whole process.

  Topic 3: Relevance to free will:

  - Neuroscientist: The experiments undermine the notion of free will by showing that what we experience as conscious will is not the initiator of action, which is instead determined by unconscious neural processes.
  - Philosopher: Free will, in the sense that matters for moral responsibility, is not about the initiation of arbitrary movements but about the ability to act according to reasons and values, which these experiments do not test.

  Topic 4: What does W-time measure?

  - Neuroscientist: W-time is a retrospective report of the timing of an experience that the brain constructs after the action has been initiated, and it is subject to known distortions in temporal judgment.
  - Philosopher: W-time is a report of the moment when the subject became consciously aware of an intention to act, and while the method may have limitations, it is the best available measure of the timing of conscious intention for these simple actions.

  Now, the cruxes. The user suspects two:

  Crux 1: What exactly does a W-judgment measure?
  - Agreed test: Both might agree that a combination of refined timing methods (e.g., better clocks, neurophenomenological methods) and studies of the neural correlates of W-judgments (e.g., using brain imaging) could help clarify what cognitive processes are occurring at the time of the W-judgment. Also, experiments that manipulate the cognitive load or attention during the task to see how W-time is affected.

  - Neuroscientist prediction: The W-judgment is generated by post-hoc processes that reconstruct the timing based on the action and other cues, so it should be highly malleable under manipulation (e.g., by changing the clock speed or providing false feedback) and show neural signatures of memory or reconstruction rather than immediate experience.

  - Philosopher prediction: The W-judgment is a direct report of a conscious experience and, while subject to some noise, it reliably reflects the timing of the intention. It should be relatively stable under manipulations that don't affect the intention itself, and neural correlates should include activity in areas associated with conscious awareness.

  Crux 2: Whether the arbitrary-movement/deliberate-choice distinction can be made to do the work the philosopher needs.

  - Agreed test: Design experiments that extend the Libet paradigm to more deliberate choices (e.g., choosing between two options based on reasons, or in a moral dilemma). Then, look for the timing of neural activity and conscious intention in these cases. Also, use accumulator models to see if the decision threshold is reached before conscious awareness in deliberate choices.

  - Neuroscientist prediction: Even in deliberate choices, the neural activity that determines the choice will precede conscious awareness by a significant interval, and the W-time (or its equivalent) will still be reported after the neural decision.

  - Philosopher prediction: In deliberate choices, the conscious intention will be formed during the reasoning process and will either precede or be coincident with the critical neural activity. Alternatively, the neural activity might not show the same early readiness potential because the decision process is distributed and involves higher cognitive areas that are conscious.

  Verbal Dispute: Part of the disagreement might be about what is meant by "the decision". 

  - Locus: The neuroscientist might be talking about the initiation of the specific motor action (the wrist flick), while the philosopher might be talking about the formation of an intention to act in a certain way (which might be at a higher level and not tied to the exact moment of movement).

  - Diagnosis: They are using "decision" at different levels of abstraction. The neuroscientist's "decision" is the final motor command, while the philosopher's "decision" is the agent's commitment to a course of action, which might have been made earlier and consciously.

  Now, let's write the document.

  ---

  **Joint Statement on the Libet Paradigm and Free Will**

  **Agreed Claims**

  1. In the classic Libet experiment and its replications, the readiness potential (RP) — a slow buildup of neural activity — begins approximately 500 milliseconds before the subject's reported time of conscious intention (W-time) to perform a spontaneous, arbitrary movement such as a wrist flexion.

  2. The basic finding of RP preceding W-time has been replicated across multiple studies, though the exact temporal gap may vary due to methodological differences.

  3. The method of reporting W-time using a rotating clock is subject to known distortions in temporal judgment, including potential post-hoc reconstruction and attentional shifts.

  4. Subsequent fMRI decoding studies have shown that predictive information about simple binary choices (e.g., left vs. right button press) can be extracted from brain activity up to several seconds before the subject reports conscious awareness of the choice.

  5. The actions studied in these paradigms are arbitrary in nature: they are spontaneous, without strong external prompting, and not based on reasons or goals beyond the experimental instruction.

  6. Libet proposed a "veto window" after the conscious intention and before the action, during which the subject might consciously abort the movement. The existence and interpretation of this window remain debated.

  7. Accumulator models of decision-making interpret the readiness potential as a subthreshold accumulation of neural activity that may not represent a completed, irrevocable decision until it reaches a threshold.

  8. These experiments were designed to study the timing of conscious intention relative to brain activity for simple, spontaneous movements and were not intended to, and do not, directly address complex, deliberate decisions that involve reasoning, planning, or moral judgment.

  9. The philosopher's compatibilist account of free will does not require that conscious will be the initial cause of action in the simple, direct sense that the Libet experiments might challenge. Instead, free will is understood as the capacity for actions to be responsive to reasons and values, which may involve a complex interplay of conscious and unconscious processes.

  **Disagreements**

  | Topic | Neuroscientist's Position | Philosopher's Position |
  |-------|----------------------------|-------------------------|
  | **Interpretation of conscious intention** | The experiments show that the conscious experience of intention (W-time) is a post-hoc confabulation that does not cause the action but is rather a report generated after the neural initiation of movement. | The experiments show that for arbitrary movements, the conscious intention arises after the onset of neural preparation, but they do not demonstrate confabulation; and they are silent on whether conscious intentions play a causal role in deliberate actions. |
  | **Nature of the readiness potential (RP)** | The readiness potential reflects the brain's decision to move, and its early onset relative to W-time indicates that the decision to act is made non-consciously. | The readiness potential may represent subthreshold motor preparation that does not constitute a completed decision until it crosses a threshold, and the conscious agent can still control the action (e.g., via veto) or be the source of the overall process. |
  | **Relevance to free will** | The experiments undermine free will by showing that what we experience as conscious will is not the initiator of action, which is instead determined by unconscious neural processes. | Free will, in the sense relevant to moral responsibility, is not about the initiation of arbitrary movements but about reason-responsive agency, which these experiments do not test and are therefore irrelevant to. |
  | **What W-time measures** | W-time is a retrospective temporal judgment subject to reconstruction and distortion, and thus it does not accurately reflect the timing of a causal conscious intention. | W-time, despite methodological limitations, is the best available measure of the timing of conscious intention for simple movements and reflects the moment of becoming aware of an intention to act. |

  **Cruxes**

  We identify two key cruxes that underlie our disagreements, and for each, we state an agreed test and our respective predictions.

  **Crux 1: What does the W-judgment measure?**  
  - *Agreed test*: Conduct experiments that manipulate the cognitive processes involved in W-judgments (e.g., by varying clock speed, introducing distractors, or using neuroimaging to observe brain activity during W-judgment reporting) to determine the extent to which W-time is a direct readout of conscious experience versus a post-hoc reconstruction.  
  - *Neuroscientist's prediction*: W-judgments will show high malleability under manipulation (e.g., shifting with clock speed changes) and will correlate with neural activity in areas associated with memory and reconstruction (e.g., prefrontal cortex), supporting the view that they are post-hoc.  
  - *Philosopher's prediction*: W-judgments will be relatively stable under manipulations that do not affect the intention itself and will correlate with neural activity in areas associated with conscious awareness (e.g., posterior parietal cortex), supporting the view that they reflect a genuine conscious event.

  **Crux 2: Can the arbitrary-deliberate distinction bear the weight of the philosopher's argument?**  
  - *Agreed test*: Extend the Libet paradigm to deliberate choices (e.g., choices based on reasons, such as selecting a move in a chess game or making a moral decision) and measure the timing of neural activity and conscious intention (using adapted W-time methods or other reports).  
  - *Neuroscientist's prediction*: Even in deliberate choices, neural activity predictive of the choice will precede the reported time of conscious intention by a significant interval (hundreds of milliseconds to seconds), showing that the same post-hoc confabulation applies.  
  - *Philosopher's prediction*: In deliberate choices, the reported time of conscious intention will either precede or be coincident with the critical neural activity, and the neural correlates may show different patterns (e.g., involving prefrontal cortex) that do not exhibit the same early readiness potential as arbitrary movements.

  **Verbal Dispute**  
  We note a verbal dispute regarding the term "decision":  
  - *Locus*: The disagreement arises when we discuss at what point a decision is made.  
  - *Diagnosis*: The neuroscientist typically refers to the decision as the initiation of the specific motor action (e.g., the wrist flexion), while the philosopher refers to the decision as the agent's commitment to act, which may occur at a higher level and earlier in time (e.g., deciding to participate in the experiment or to follow the instruction to move spontaneously). This difference in level of abstraction leads to apparent disagreement where there might be none.

