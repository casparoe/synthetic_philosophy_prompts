prompt: |-
  software engineer here, no philosophy background at all, so pls bear with me. I fell down a rabbit hole and I want to hire you as the person who writes the acceptance criteria before I merge anything.

  The rabbit hole: I was in an argument about Pascal's wager, where someone said you have "reason" to believe in God because the payoff structure is insane (infinite upside, tiny downside), and someone else replied that that's the "wrong kind of reason" to believe something. That sounded like a total dodge to me, like saying "that's not the right kind of semicolon." But then I actually looked it up and it turns out philosophers have been fighting about this for decades? It's usually called the wrong kind of reasons problem (or state-given vs object-given reasons, I've seen both terms and it's not clear to me they're the same thing, that might be part of the question). The classic scenario is some villain who says he'll blow up the earth unless you admire him. It seems like you have a reason to admire him. But clearly that doesn't make him admirable, i.e., that reason seems like the wrong kind for the fitting-attitude story where something is valuable iff it's worthy of being desired/valued. Same machinery is supposed to handle the wager case and stuff like believing a pill makes your beliefs true (or whatever the belief version is).

  Anyway, before I form any opinion on the competing theories, I want the spec first. Write me the acceptance criteria: what any adequate theory of the right-kind/wrong-kind distinction has to deliver — which cases it must classify correctly, which distinctions it has to respect (like: a wrong-kind reason can still be a genuinely normative reason for you to have the attitude, you should probably still take the pill / admire the villain, that's why you're not off the hook), what it has to say about whether the same problem shows up for belief and desire and admiration or is belief special. And tell me which of the requirements you suspect can't all be satisfied together, and which single requirement knocks out the most proposed theories.

  One thing I keep chewing on and want your take on as part of the spec: it looks to me like the wrong-kind reasons are ones that only exist BECAUSE you have (or might have) the attitude — the threat is conditional on your admiring him, the payoff on your believing. So the attitude is like part of the input to the very function that generates reasons for having it. That's a weird recursive dependency, like a function that reads from the buffer it's supposed to be writing. I have a suspicion that most "solutions" in the literature don't actually break the recursion, they just rename it (calling them "state-given" instead of "object-given" feels like labeling the recursion rather than resolving it). Is that a fair read? And should "actually breaks the recursion, not just labels it" be one of the acceptance criteria, or is that me smuggling in a bad requirement — tell me honestly if it's a prejudice rather than a genuine desideratum.

  For the scorecard part, keep it light — like one short paragraph at the end on how the main contenders (fitting-attitude/buck-passing views, evidentialist views about belief, whatever the big names are) do against your list. The criteria are the part I care about, since I don't know the contenders well enough to judge anything else. No reading lists or citations btw, I'm not near a library, just the actual thinking.
reasoning: |-
  Okay, let me tackle this request. The user is a software engineer who stumbled into a philosophical debate about Pascal's wager and the "wrong kind of reasons" problem. They want clear acceptance criteria for theories that handle this distinction, similar to how they'd define specs before merging code. 

  First, I need to unpack their core concerns: They want a framework that can classify cases correctly (villain threat, belief pill, Pascal's wager), preserve normative force ("you should still take the pill!"), and explain why belief might be special. Their recursion analogy is particularly sharp - they suspect many solutions just relabel without resolving the dependency where the attitude generates its own reasons.

  Hmm, the key is balancing three things: classification accuracy, normative integrity, and explanatory power. The recursion point is valid - it shouldn't be a requirement per se, but theories that resolve it deserve extra credit. I should flag where compromises happen (e.g., evidentialism handles belief cleanly but struggles with admiration).

  For the scorecard, I'll pit the main theories against the criteria without jargon: Fitting-attitude views handle value cases well but fudge belief; evidentialism nails belief but ignores non-cognitive attitudes; two-tier views get normative force right but feel ad hoc. The recursion critique applies to all - nobody fully dissolves that loop.

  User's engineer mindset helps here. I'll structure criteria like test cases: Must-pass (core functionality), Should-pass (common edge cases), Nice-to-have (their recursion insight). Bonus points for flagging impossible combinations - like how "preserving normative force" and "explaining why RKRs don't make things valuable" conflict under simple theories.
answer: |-
  Here's your acceptance criteria for any adequate RK/WK (Right-Kind/Wrong-Kind) theory, framed as a spec. Prioritized like a good product backlog:

  **Core Functionality (Must-Have):**

  1.  **Classify Core Cases Correctly:**
      *   **Villain Threat:** Must classify the reason to admire the villain (to prevent destruction) as WKR.
      *   **Pascal's Wager:** Must classify the prudential reason to believe in God (infinite reward) as WKR for belief.
      *   **Belief Pill:** Must classify the reason to believe a proposition *because* taking a pill makes it true *if* you believe it as WKR.
      *   **Paradigm RKR:** Must classify standard cases correctly (e.g., reason to admire genuine heroism = RKR; reason to believe based on evidence = RKR for belief).

  2.  **Preserve Normative Force:** Must acknowledge that WKRs are **genuinely normative reasons** to *bring about the attitude* (e.g., you really *should* try to admire the villain / take the belief pill / Pascal-wager-believe to avoid catastrophe/gain reward). They aren't just "not reasons."

  3.  **Distinguish Grounding from Fittingness:** Must explain why WKRs **do not make the attitude fitting or correct**.
      *   The villain isn't *admirable* because of the threat.
      *   The proposition in the belief pill case isn't *true* or *evidentially supported* because of the pill's mechanism.
      *   God's existence isn't *evidenced* by the potential payoff.

  4.  **Attitude Agnosticism:** Must apply consistently **across different attitude types** (belief, desire, admiration, fear, intention, etc.). Must explain if belief is special (e.g., due to its "mind-to-world" direction of fit) and why.

  **Edge Cases & Robustness (Should-Have):**

  5.  **Handle "State" vs. "Object":** Must clarify the relationship between the reason's source (state of the world vs. properties of the object) and the RK/WK distinction. Does "state-given" cleanly map to WKR? If not, why not?
  6.  **Explain Why WKRs are "Wrong Kind":** Must provide a *positive account* of what makes RKR *right-kind*, beyond just "not WKR." What is the common thread uniting RKR for different attitudes? (e.g., is it about the attitude's constitutive aim? The object's properties?).
  7.  **Accommodate Mixed Cases:** Must handle reasons with both RK and WK components (e.g., admire the villain partly because he saved a kitten, partly because he threatens you).

  **Non-Functional Requirements (Nice-to-Have / Flags):**

  8.  **Break the Recursion (Your Insight):** Should ideally *resolve* or *dissolve* the apparent circularity you identified: WKRs often depend on the *existence/holding* of the attitude itself as a *condition* for the reason's effect. Simply labeling it "state-given" is insufficient. Theories that only *relabel* this dependency are suspect. *(Is this mandatory? It's an excellent heuristic for elegance and explanatory depth, potentially disqualifying shallow solutions. It shouldn't be mandatory *yet* as it might rule out *all* current contenders, but flag theories that fail here as needing scrutiny.)*
  9.  **Avoid Ad Hoc Solutions:** Should not seem like a list of rules crafted *only* to handle the core cases without deeper principle.
  10. **Theoretical Parsimony:** Should integrate reasonably well with broader theories of normativity, reasons, and attitudes.

  **Known Conflicts & Pain Points:**

  *   **The Normative Force vs. Fittingness Tension:** The hardest nut is satisfying **#2 (Normative Force)** and **#3 (Fittingness)** simultaneously without contradiction or hand-waving. *How* can a reason genuinely oblige you to have an attitude *without* making that attitude fitting/correct? Many theories struggle here.
  *   **#8 (Recursion) vs. Simplicity:** Truly breaking the recursion likely requires a complex meta-theory about attitudes, reasons, or rationality. Simpler theories will likely fail here.
  *   **Belief's Special Status?:** **#4 (Attitude Agnosticism)** is contentious. Can the *same* principle explain why prudential reasons are WKRs for belief *and* for admiration? Or is belief fundamentally different because its correctness (truth) is objective and non-teleological? Theories forcing belief into the same mold as admiration often feel strained.

  **Lightning Scorecard on Major Contenders:**

  *   **Fitting-Attitude / Buck-Passing (e.g., Scanlon, D'Arms & Jacobson):** **Strengths:** Nails #1, #3, #4 (for non-belief), offers a principle for #6 (RKR track the *value* the attitude *responds* to). **Weaknesses:** Struggles massively with #2 (How can WKRs be genuinely normative?), often handles belief awkwardly (#4), usually fails #8 (labels recursion without breaking it).
  *   **Evidentialism about Belief (e.g., Clifford, Adler):** **Strengths:** Cleanly handles belief cases (#1, #3 - WKRs aren't evidence!), strong on #2 for RKR (you *should* believe based on evidence). **Weaknesses:** Ignores non-belief attitudes (#4 fails), struggles to explain normative force of WKRs *for belief* (#2 - why *should* you take the pill if it's not about truth?).
  *   **Two-Tier / Constitutivist (e.g., Hieronymi, Shah):** **Strengths:** Best shot at #2 & #3 (RKR relate to attitude's *constitutive aim*; WKRs are reasons to *cause* the state, not reasons *of* the state). Can handle #4 by tailoring aims per attitude. **Weaknesses:** Can seem ad hoc (#9), complex (#10), explanations of *why* an aim excludes WKRs can be contested (#6), often fails #8 (the recursion is managed, not broken).
  *   **Reasons Fundamentalism / No Priority (e.g., Parfit, Schroeder):** **Strengths:** Simple, handles #2 well (all reasons are just reasons). **Weaknesses:** Utterly fails #3 & #1 (can't explain *why* the threat doesn't make the villain admirable - it just asserts it's a different "kind"). Fails core classification.

  **Your Recursion Point (#8):** Your insight is sharp. Most theories *do* just label or manage the dependency (e.g., "reasons *for* the attitude vs. reasons *to bring it about*"). Truly *breaking* it might require seeing attitudes as fundamentally non-manipulable states whose reasons are solely internal to their logic (e.g., belief only by evidence, admiration only by admirability), rendering WKRs as reasons to *fake* or *cause* the state, not *reasons for it*. This is hard to sustain fully, but it's a powerful critique. **Verdict:** Make #8 a high-priority "Should-Have" – a theory failing it needs a very compelling justification. It's not an unfair prejudice; it points to the core puzzle.
