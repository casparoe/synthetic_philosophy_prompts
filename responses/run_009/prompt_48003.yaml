prompt: |-
  I'm an undergrad in this weird cross-listed seminar (half geoscience, half environmental history, don't ask how they got the syllabus approved) and next week I have to give a 15-minute presentation defending the thesis of my term paper. My claim is basically two parts: (1) if you're going to talk about the Anthropocene as an actual geological epoch, the right start date is the mid-20th century — the bomb-spike/Great Acceleration stuff — rather than agriculture or the Industrial Revolution, and (2) the spicier part — the question of who gets to decide when an epoch "starts" shouldn't be settled just by the formal stratigraphy people. A term can do real scientific and historical work even without a ratified golden spike, and honestly the 2024 vote where the stratigraphy commission shot down the Anthropocene Working Group's Crawford Lake proposal kind of proves that the concept is going to keep being used regardless of what the commission says.

  The room I'm presenting to is very mixed and I'm going to get it from both directions. The professor is a Quaternary geologist who was, from what I can tell, genuinely annoyed about the whole golden-spike process, and I suspect she thinks informal usage of "Anthropocene" is just vibes masquerading as stratigraphy. There's also a TA who studies lake sediment cores, so he actually knows the Crawford Lake material first-hand. And then like two-thirds of the students are history and politics majors who keep bringing up the "Capitalocene" angle in every discussion — they think 1950 is way too late because colonialism, plantation economies, and land clearance had already been reshaping the planet for centuries, so anchoring everything to plutonium isotopes is eurocentric nonsense.

  Given all that, draft me a prep sheet for the Q&A: the objections I'll actually get from this specific room (not generic "is the Anthropocene real" stuff), ordered by roughly how much damage each one could do to my presentation, phrased the way a stratigrapher would actually put it versus the way one of the Capitalocene people would, each with a reply I can give in about two minutes, plus an honest note on where each reply is weakest. Also include the one question I'm quietly hoping nobody asks, and tell me what I should just concede upfront so I come across as reasonable instead of defensive. Thanks!!
