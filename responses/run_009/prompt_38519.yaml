answer: |-
  Your struggle captures the core tension of the nonidentity problem: how can an act be wrong when the affected person wouldn't exist otherwise? Your intuitions aren't inconsistent—they reveal a nuanced principle that *can* unify your verdicts. Here’s a framework based on **violating role-specific obligations**, paired with **impersonal harm for systemic cases**. I’ll work it out step by step, then apply it to your cases.

  ---

  ### **The Principle: Role-Obligation Violation + Impersonal Harm**
  1. **For individual procreation/parenting decisions**: An act is wrong if it **deliberately or negligently creates a child in a disadvantaged state *when the agent had a role-obligation to avoid doing so***. The "wronging" is relational: it stems from breaching duties tied to the role of "parent" or "procreator," not comparative harm to a specific person.  
  2. **For collective/policy decisions**: An act is wrong if it **causes future people to exist in conditions below a threshold of minimally decent existence *or* unjustly deprives them of essential resources**, even if no specific person is harmed. This is an impersonal wrong (bad state of affairs).  

  **Key distinctions**:  
  - **Deliberate/Negligent Choice**: Matters for individual cases. If the disadvantage is foreseeable and avoidable without significant cost, creating it breaches obligation.  
  - **Role-Obligation**: Parents/procreators have duties to *not deliberately impose serious disadvantages* on the children they create.  
  - **Threshold**: "Barely worth living" isn’t wrong *if unavoidable* (e.g., genetic necessity). But policies *choosing* that state are wrong if better alternatives exist.  

  ---

  ### **Your Cases Applied**  
  | Case                          | Verdict      | Principle Applied |  
  |-------------------------------|-------------|-------------------|  
  | **Depleting resources**       | Wrong       | **Impersonal harm**: Creates future generations with unjustly poor conditions. Threshold violated (they lack essentials). No specific victim needed—it’s a wrongful state of affairs. |  
  | **14-year-old choosing now**  | Wrong       | **Role-obligation violated**: As a potential parent, she negligently imposes foreseeable disadvantages (rough start) when waiting was feasible. She wrongs *that child* by breaching parental duty to avoid avoidable harm. |  
  | **Deaf couple embryo selection** | Wrong    | **Role-obligation violated**: Deliberately choosing disability (a serious disadvantage) breaches the duty to not *intentionally* create a child worse off. Motives (cultural deafness) don’t override—disability restricts autonomy/opportunities. |  
  | **Drunk one-night stand child** | Not wrong   | **No obligation breach**: Disadvantage (if any) is unintended and incidental. No *deliberate/negligent* imposition—just bad luck. Role-obligation requires intent/negligence. |  
  | **Huge carbon emissions**     | Wrong       | **Impersonal harm**: Like resource depletion—creates a future with unjustly poor conditions below threshold. Collective action obscures specific victims, but state of affairs is wrongful. |  

  ---

  ### **Your Test Cases**  
  1. **Policy guaranteeing barely-worth-living lives**:  
     - **Verdict**: **Wrong** (if avoidable).  
     - **Why**: Impersonal harm. A policy *choosing* futures where lives are perpetually barely worth living (but not terrible) violates justice—it could create better conditions. The threshold isn’t "existence vs. non-existence" but "minimally decent existence." If no better alternative exists (e.g., post-apocalyptic necessity), it *might* be permissible—but here, it’s a deliberate choice.  

  2. **Child with unavoidable disability (both parents carriers)**:  
     - **Verdict**: **Not wrong**.  
     - **Why**: No role-obligation breach. The disability is unavoidable for any child of these parents. Creating *this child* with a disability isn’t negligent—it’s the only way they exist. The alternative is no child at all.  

  ---

  ### **Where I’m Least Confident: The Drunk Conception Case**  
  - **The tension**: Your intuition ("not wronged") is defensible under this framework, but I’m only **~70% confident**. Here’s why:  
    - If the child’s disadvantage is severe (e.g., fetal alcohol syndrome), one *could* argue negligence: the parents *foreseeably* risked harm. But you’d need to prove they owed a duty *pre-conception* (e.g., "don’t conceive while intoxicated").  
    - **Flip side**: If the harm is mild (e.g., unstable home), it’s clearly incidental—no breach. But severe harm blurs the line. **My safeguard**: Only *deliberate* or *reckless* imposition breaches role-obligation. Drunk conception is reckless only if harm was likely (e.g., known genetic risk + alcohol). Most cases aren’t.  

  This uncertainty mirrors yours because we’re judging *culpability*, not harm itself. The nonidentity problem forces us to anchor wrongness to the *act*, not the outcome for a specific person.  

  ---

  ### **Why This Works**  
  - **Preserves victim-language in individual cases**: The 14-year-old *wrongs her child* by violating parental duty—not because the child is worse off than an alternative (who wouldn’t exist), but because she failed her obligation *to that child*.  
  - **Handles impersonality**: Resource depletion/carbon emissions are wrong as systemic injustices, not wrongs to specific people.  
  - **Explains the drunk conception exception**: No intent/negligence → no breach → no wrong *to the child*.  
  - **Avoids "harm vs. nonexistence"**: Focuses on duties and thresholds instead.  

  **Seminar-ready defense**: This framework blends Derek Parfit’s "impersonal harm" for policy cases with Elizabeth Harman’s "creation wrongs" for individual acts. It accepts that "wronging someone" requires a relational duty—not counterfactual harm.  

  Let me know if you want to pressure-test a specific case further—I’ll help refine it before Thursday.
