prompt: |-
  I'm in a bioethics seminar and we just did the nonidentity problem, and now I'm trying to figure out what I actually think by listing my gut verdicts, because they refuse to form a pattern. Depleting resources now so future generations live badly: clearly wrong. A fourteen-year-old who could easily wait to have a kid but chooses to have one now, knowing it will have a rougher start in life: wrong, and it feels like she's wronging *that child*, not just doing something impersonally bad. A deaf couple using embryo selection to deliberately have a deaf child: wrong, honestly, and also it feels wronged-child-shaped. But a kid conceived in a drunk one-night stand instead of being planned: I can't get myself to say the parents wronged the kid, even though the same logic seems to apply. And huge carbon emissions today that change who exists in 2200: wrong, but somehow I don't feel like there's a specific victim the way I do with the fourteen-year-old. The thread running through all of this is that in every case the alternative wasn't "same person, better life" — it was a different person, or no one, so the standard "you wronged them" story seems to break everywhere equally, yet my verdicts are not equal.

  So: is there one principle that captures all five verdicts, or am I forced to drop some? I can vaguely see a couple of escape routes — maybe there's a wrong without a wronged party, maybe "harm" should be comparative to nonexistence rather than to the better alternative life, maybe some of these are wrong for reasons that have nothing to do with the future person at all (fairness, motives, what kind of parent you're choosing to be) — and I'd like you to actually work one of these out precisely instead of just naming it. Please also tell me what the principle you land on says about two cases I haven't listed: a policy that's guaranteed to bring about future people whose lives are barely worth living (never better, never terrible), and a case where the only way a child can exist at all is with a serious disability, because of some genetic condition both parents carry. And flag where you're confident versus guessing — I'd especially like you to single out the single verdict or step in your answer that you're least sure of, since I suspect it's the same one I keep flip-flopping on. My seminar meets Thursday so I have a bit of time to digest something long.
