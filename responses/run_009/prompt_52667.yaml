  - Hidden factual question? Absolutely. The compounding nature of the user's bankroll makes this multiplicative by definition - not a lab experiment where payouts are additive.
  - Substantive "ought"? Here's the rub: ergodicity shows certain strategies literally cannot survive repeated play, regardless of preferences. You can't prefer bankruptcy.

