  Looking at the camps: The orthodox utility camp treats preferences as fundamental - if you want to maximize wealth long-term, choose log utility; if not, pick something else. The ergodicity camp argues dynamics dictate the math - multiplicative systems require maximizing time-average growth, period. The user senses these might be answering different questions, but which one applies to their actual situation?

