prompt: |-
  I'm a third-year PhD student in ML theory, and my department just got funding for a small working group -- think two postdocs for three years, plus me -- on anything between algorithmic information theory and the foundations of statistical learning. I get to draft the agenda, and since my own work so far has been on MDL-style bounds, I keep gravitating toward Solomonoff-style induction, but I honestly don't trust my sense of where the live problems actually are versus where things are just quiet because they're settled or because everyone lost interest in the 90s.

  So: which open questions in and around Solomonoff induction and Kolmogorov complexity would you prioritize for a group like this, and in what order? To make sure you don't just hand me a survey, here's my candidate list, though I'm happy to be told I'm missing something bigger: (1) the reference machine problem -- the dependence of the universal prior on the choice of universal Turing machine is bounded by a constant, but the constant can swallow everything in practice, and it's unclear whether there's any principled, non-ad-hoc way to constrain the class of admissible machines; (2) whether the incomputability is a real limitation or a red herring, i.e. whether bounded or resource-limited variants of Kolmogorov complexity preserve the interesting convergence properties and connect to what actual learners can do; (3) the old circularity worry -- does Solomonoff induction justify Occam's razor or does it presuppose it, since "simplicity = short program" already builds the razor in, and if it's presupposed, what exactly is the formalism adding; (4) how the story degrades when the environment is only approximately computable rather than computable; (5) whether any of this should inform how we think about priors in agents that are themselves embedded in the environment, where the usual AIXI-style setup quietly assumes the agent isn't. Also tell me which of these, or which ones I haven't listed, are overrated -- questions people keep polishing even though the answer wouldn't change anything downstream.

  For the ordering I want actual criteria -- how much other work hangs on the answer, whether it's tractable for pure-theory people on a three year clock, how neglected it is -- and what would have to happen for you to reshuffle the list. We're not hiring empiricists, so anything that only pays off through experiments should be discounted accordingly.

  Lead with your bottom line in the first sentence (like, the single question you'd put first and why in one breath), then give the full reasoning. No preamble and no restating what I asked.
reasoning: |-
