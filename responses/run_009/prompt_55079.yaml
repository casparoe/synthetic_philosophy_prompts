prompt: |-
  A graduate student in my applied ethics seminar, writing a term paper on effective altruism, opened our meeting with a summary of the importance–tractability–neglectedness framework that he attributes to a popular economics blog he read over the break. As he relayed it to me, the framework holds that the expected value of working on a problem is found by scoring each of three factors from zero to ten and multiplying them together, so that any cause scoring zero on one factor drops out entirely. In his telling, importance is essentially the number of people affected (so malaria beats the long-term future of humanity, since more actual people are currently sick), tractability means that we already know how to solve the problem outright (which is why, he says, scientific research into fundamental questions scores near zero), and neglectedness is simply the number of people currently working on the cause, with no attention to how much money rather than labor has already gone into it, or to whether the marginal returns to additional effort are flat or steep. He concluded that the framework is therefore rigged: because it rewards causes with few workers and allows speculative long-run benefits to be assigned arbitrarily large importance scores, it can only ever output the conclusion that whoever is doing the scoring should abandon concrete, verifiable humanitarian work in favor of whatever they were already predisposed to believe in — and that this circularity has been widely recognized as fatal to the whole approach.

  I suspect this summary is a mixture of defensible simplification and genuine distortion — the bit about multiplication sounding like a formal decision procedure rather than a heuristic rubric strikes me as wrong in an interesting way — but I want to be careful before I tell him so, because parts of his critique resemble objections I have seen raised in earnest. Please give me an audit I can take back to him. Distinguish carefully among: (a) what a thoughtful proponent of the framework would accept as a fair statement of it, (b) claims that are crude simplifications of it — where the simplification matters to the conclusion he draws, not merely to its elegance — and (c) claims that misrepresent it outright. I am particularly interested in whether his "rigged" conclusion actually follows from the strongest correct version of his premises, or whether it depends on the distortions; and in whether the worries he raises at the end (arbitrariness of importance estimates, neglecting diminishing returns, the pull toward exotic causes) are better understood as internal objections a sophisticated defender has answers to, external criticisms of the enterprise as a whole, or considerations the framework's designers themselves would insist are built into its proper use. Since I will be sending him written comments rather than discussing this aloud, please organize the audit so that each element of his summary is addressed on its own terms, with his final conclusion treated last.
reasoning: |-
  Alright, let's tackle this. The user is an ethics professor who needs to audit a grad student's critique of the ITN framework. The student claims the framework is rigged, arguing it multiplies scores for importance, tractability, neglectedness (0-10), leading to biases against concrete humanitarian work in favor of speculative causes. 

  First, I need to unpack the student's summary point by point. He says importance is just the number of people affected. But I know from EA sources that importance is about scale, including future generations and severity, not just current numbers. His malaria vs. long-term future example oversimplifies—EA would actually weigh future risks heavily if they're existential. 

  Next, tractability. He defines it as having a complete solution, making research score low. But tractability is about marginal progress, not full solutions. Research can be tractable if each step yields insights. His definition misses incremental progress, which is key in EA.

  Neglectedness: he measures it by the number of workers, ignoring funding and diminishing returns. EA uses person-years or funding, and considers marginal returns. If a cause has many workers but low funding, it might still be neglected. Also, diminishing returns are crucial—adding effort where it's saturated isn't efficient. 

  The multiplication method: he treats it as a formal procedure, but it's a heuristic. Scoring is approximate, not precise. A zero in any factor nullifying everything is a misunderstanding—scores aren't literal zero. Also, multiplication combines with qualitative judgment. 

  His rigged conclusion: he says ITN favors exotic causes arbitrarily. But EA emphasizes evidence and calibration. Importance for long-term causes requires rigorous models, not arbitrary numbers. The framework includes diminishing returns and uncertainty adjustments. 

  The student's critiques resemble common objections, so the professor needs to distinguish valid points from distortions. The multiplication and neglect of diminishing returns are simplifications that affect his conclusion. But his core concerns about arbitrariness and bias are acknowledged within EA, which has countermeasures like sensitivity analysis and institutional decision-making. 

  The professor should clarify where the student oversimplified (tractability, neglectedness), where he misrepresented (importance as only current people, multiplication as rigid), and how EA addresses his worries internally. Highlighting that the framework is a starting point, not a formula, is key. The rigged conclusion relies on distortions, but the underlying concerns are part of ongoing EA discussions.
answer: |-
  Here’s a structured audit of your student’s summary, addressing each element of his critique and concluding with an assessment of his "rigged" claim. This distinguishes fair statements (a), crude simplifications (b), and misrepresentations (c), while examining whether his conclusion follows from accurate premises and how EA addresses his concerns.

  ---

  ### **1. Summary Claim:**  
  *"The framework multiplies scores (0–10) for Importance, Tractability, and Neglectedness to calculate expected value (EV). A score of zero on any factor nullifies EV."*  
  - **Fair Statement (a):**  
    Yes, ITN uses multiplicative interaction (I×T×N) as a heuristic to emphasize that all three factors are *necessary*. EV collapses if any factor is truly zero (e.g., no importance = no value; no tractability = no progress possible).  
  - **Crude Simplification (b):**  
    Treating multiplication as a *precise formal procedure* (vs. a prioritization tool). Scores are rough estimates, not cardinal measurements. In practice, EA uses ranges, uncertainty intervals, and qualitative judgment alongside scores.  
  - **Misrepresentation (c):**  
    None. Multiplication is core to ITN.  

  ### **2. Claim:**  
  *"Importance = number of people currently affected (e.g., malaria > long-term future)."*  
  - **Fair Statement (a):**  
    Importance includes scale/severity, often quantified in terms of welfare loss (e.g., DALYs). Current suffering often has more robust data than speculative futures.  
  - **Crude Simplification (b):**  
    Equating importance *solely* with current affected populations. Importance also considers:  
    - **Severity:** A cause affecting 1M people catastrophically may rank higher than one affecting 10M mildly.  
    - **Future Generations:** Longtermist EA explicitly includes future lives (e.g., existential risks could affect trillions).  
    - His malaria vs. long-term future example ignores EA arguments for *high uncertainty-adjusted importance* of existential risks.  
  - **Misrepresentation (c):**  
    Claiming ITN inherently favors "current people" is incorrect. Leading EA orgs (e.g., Open Philanthropy) allocate billions to longtermist causes *based on ITN*, weighting future lives highly.  

  ### **3. Claim:**  
  *"Tractability = we already know how to solve the problem outright (so scientific research scores near zero)."*  
  - **Fair Statement (a):**  
    Tractability assesses the feasibility of making progress per unit of resources. Problems with no known solution path (e.g., some basic science) score lower.  
  - **Crude Simplification (b):**  
    Defining tractability as requiring a *complete solution*. EA measures **marginal tractability**: "How much progress can an additional unit of resources achieve?" Research can be tractable if incremental steps yield high-value insights (e.g., AI safety interpretability research).  
  - **Misrepresentation (c):**  
    Asserting research "scores near zero" is false. EA heavily funds research in high-impact domains (e.g., bio-risk prevention, AI governance) where marginal progress is feasible and important. Tractability includes partial solutions and reducing risks.  

  ### **4. Claim:**  
  *"Neglectedness = number of people currently working on the cause, ignoring funding, diminishing returns, or marginal value."*  
  - **Fair Statement (a):**  
    Neglectedness compares current effort/resources to the scale of the problem. Fewer workers often correlates with higher marginal returns.  
  - **Crude Simplification (b):**  
    Reducing neglectedness to "number of workers" ignores:  
    - **Funding:** EA uses total resourcing (e.g., dollars, person-years).  
    - **Diminishing Returns:** Central to ITN! A cause with 10x more resources than another may have flatter marginal returns, lowering N.  
    - **Differential Impact:** Not all workers/resources are equal (e.g., skilled vs. unskilled labor).  
  - **Misrepresentation (c):**  
    Claiming ITN ignores marginal returns is outright false. **Marginal impact is ITN’s entire purpose** – it asks where *additional* resources will achieve the most good.  

  ### **5. Claim:**  
  *"The framework is rigged: It rewards causes with few workers and allows arbitrary importance scores, always favoring speculative causes over concrete work."*  
  - **Internal EA Responses (Sophisticated Defenses):**  
    - **Arbitrariness:** EA uses empirical models (e.g., cost-effectiveness analyses, probabilistic forecasting) to constrain importance estimates. Longtermism requires explicit uncertainty adjustments (e.g., discounting low-probability/high-impact outcomes).  
    - **Diminishing Returns:** Built into neglectedness calculations (e.g., "Does the 1000th worker add as much value as the 10th?").  
    - **Exotic Bias:** EA acknowledges this risk and uses **robustness checks**: "Does this cause still rank highly under pessimistic importance/tractability estimates?" Many EAs work on "unsexy" causes (e.g., global health) after stress-testing.  
  - **External Critiques Validated:**  
    - Importance scores for long-term causes *can* be subjective if not rigorously modeled.  
    - Neglectedness may undervalue "crowded" but underfunded fields (e.g., climate justice).  
    - **BUT**: His conclusion that ITN *always* favors speculative causes depends on distortions (b, c), not the strongest ITN version.  

  ### **6. Conclusion Audit: "The framework is circular and rigged."**  
  - **Follows from his premises?**  
    **Yes, but his premises are flawed.** If importance = current lives, tractability = full solutions, and neglectedness = headcounts, then ITN *would* favor niche, speculative causes.  
  - **Follows from accurate ITN?**  
    **No.** A defensible ITN:  
    - Weighs future lives rigorously (not arbitrarily),  
    - Values partial progress (e.g., 10% risk reduction),  
    - Incorporates diminishing returns and total resources,  
    - Uses sensitivity analysis to avoid exotic bias.  
  - **The "Circularity" Charge:**  
    ITN doesn’t inherently favor preexisting beliefs; it demands cause-neutral quantification. However, **confirmation bias** is a risk: EAs may overestimate importance/tractability for preferred causes. This is a *practical* flaw, not a *structural* one, and EA institutions implement checks (e.g., peer review, forecasting tournaments).  

  ---

  ### **Summary for Your Student:**  
  **Fair Points:**  
  - ITN uses multiplicative scoring and can disproportionately favor neglected causes.  
  - Longtermist importance estimates require careful handling to avoid arbitrariness.  
  - Tractability must account for incremental progress (not just "solved" problems).  

  **Crude Simplifications:**  
  - Importance ≠ current lives only; tractability ≠ complete solutions; neglectedness ≠ worker count.  
  - Multiplication is a heuristic tool—not a rigid formula—for balancing necessities.  

  **Misrepresentations:**  
  - ITN does not ignore marginal returns, funding, or severity.  
  - EA does not dismiss research or concrete humanitarian work (e.g., GiveWell’s top charities are ITN-driven).  

  **His Conclusion:**  
  The "rigged" outcome stems from his distorted version of ITN. A sophisticated proponent would:  
  1. Quantify importance with uncertainty adjustments,  
  2. Define tractability as marginal progress potential,  
  3. Measure neglectedness via resources and diminishing returns,  
  4. Test conclusions against conservative estimates.  

  **Key EA Counter-Critique:**  
  The student’s description resembles a "straw man" ITN. His valid concerns (e.g., arbitrariness in long-term forecasts) are actively debated *within* EA, leading to refined tools like **expected value theory**, **systematic sensitivity analysis**, and **cause prioritization datasets** – all acknowledging ITN’s limits while preserving its utility for comparing wildly different interventions.  

  --- 

  This audit equips you to affirm his sharper observations ("EA must justify longtermist importance weights!") while correcting reductive interpretations. For further reading, suggest Will MacAskill’s *Doing Good Better* (ITN’s origins) and Holden Karnofsky’s *Most Important Century* essay (handling speculative importance).
