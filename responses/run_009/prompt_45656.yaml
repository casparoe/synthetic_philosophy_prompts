            This condition might be seen as requiring that the best-case gain is at least as large as the worst-case loss (in absolute value). But note: the units are utility. This might be acceptable.

    - We assume linear utility. We might be risk-averse. But we are already using interval of probabilities and minimax regret, which is a form of risk-aversion.

