answer: |-
  Below is a practical decision procedure for your go/no-go calls, designed to handle uncertainty, prevent gaming, and accommodate your three use cases. It translates imprecise probability theory into a 15-minute meeting-friendly process, using minimax regret as the core decision rule due to its balance between conservatism and practicality.

  ---

  ### **Decision Procedure: Risk Assessment with Imprecise Probabilities**
  **Time Budget:** 15 minutes per change  
  **Participants:** Engineers involved in the change (typically 3-5 people)  
  **Inputs:** Benefit (`B`), incident recovery cost (`C_recover`), catastrophe cost (`C_bad`) for the change (pre-set per change type).  
  **Output:** Go, no-go, or "forced binary" decision.

  ---

  #### **Step 1: Pre-Meeting Setup (Judgement Call)**  
  - **Change owner** defines:  
    - `B`: Benefit if successful (e.g., "security patch prevents $100k breach" → `B = 100`).  
    - `C_recover`: Cost if incident occurs but rollback succeeds (e.g., 30 min downtime → `C_recover = 10`).  
    - `C_bad`: Cost if incident occurs and rollback fails (e.g., 4-hour outage → `C_bad = 80`).  
    - *Standardize costs in "risk units" (e.g., 1 unit = $1k or 10 min downtime). Use pre-agreed values for common change types:*  

    | **Change Type**       | `B` (Benefit) | `C_recover` | `C_bad` | **Notes**                              |  
    |------------------------|---------------|-------------|---------|----------------------------------------|  
    | Routine dependency patch | 30            | 10          | 80      | Benefit = risk reduction + features   |  
    | Failover drill         | 25            | 5           | 20      | `B` includes learning value; costs are lower off-peak |  
    | Major migration        | 50            | 20          | 100     |                                        |  

  - *Why judgement?* `B` and costs involve business context. For drills, `B` explicitly values learning (e.g., "drill reduces future outage risk by 20%").

  ---

  #### **Step 2: Elicitation (5 min)**  
  - Each engineer **independently** writes:  
    - **P(incident):** `[L_i, U_i]` (low/high probability of user-visible incident).  
    - **P(rollback_fail):** `[L_r, U_r]` (low/high probability rollback fails *if incident occurs*).  
    - **Brief justification** (1 sentence, e.g., "untested migration path").  
  - **Anti-gaming measures:**  
    - **Anonymize inputs** during aggregation to reduce peer pressure.  
    - **Track outliers:** If estimates consistently deviate without justification (e.g., always [1%, 99%]), discuss in retro.  
    - **Require justification:** Extreme ranges (e.g., [0%, 100%]) must explain ignorance (e.g., "no staging env").  

  ---

  #### **Step 3: Aggregation (2 min)**  
  - Compute **envelope intervals** (capture full uncertainty):  
    - **P(incident):** [`min(L_i)`, `max(U_i)`] across engineers.  
    - **P(rollback_fail):** [`min(L_r)`, `max(U_r)`].  
  - *Refuse to collapse intervals* (e.g., no averaging). Example:  
    - Inputs: P(incident) = [1%, 10%], [5%, 20%], [3%, 15%] → **Aggregated: [1%, 20%]**.  

  ---

  #### **Step 4: Calculate Utilities (3 min)**  
  - **Utility of "go"** (`U(go)`) depends on outcomes:  
    - Success: Gain `B` (no incident).  
    - Recoverable incident: Lose `C_recover`.  
    - Catastrophe: Lose `C_bad`.  
  - **Worst-case utility** (pessimistic):  
    `U_min(go) = B - B*max(U_i) - max(U_i)*[C_recover + max(U_r)*(C_bad - C_recover)]`  
  - **Best-case utility** (optimistic):  
    `U_max(go) = B - B*min(L_i) - min(L_i)*[C_recover + min(L_r)*(C_bad - C_recover)]`  
  - *Why this formula?* It accounts for the joint risk of incident + rollback failure. Derivation:  
    `U(go) = B*(1 − P(incident)) − P(incident)*[C_recover + P(rollback_fail)*(C_bad − C_recover)]`.

  ---

  #### **Step 5: Apply Minimax Regret Rule (3 min)**  
  - **Regret of "go"** (max downside): `Regret_go = max(0, -U_min(go))`  
    - *Example:* If `U_min(go) = -20`, `Regret_go = 20`.  
  - **Regret of "no-go"** (max upside lost): `Regret_no_go = max(0, U_max(go))`  
    - *Example:* If `U_max(go) = 30`, `Regret_no_go = 30`.  
  - **Decision rule:**  
    - **Go** if `Regret_go ≤ Regret_no_go` (loss from going ≤ gain lost from skipping).  
    - **No-go** if `Regret_go > Regret_no_go`.  

  ---

  #### **Step 6: Handle Edge Cases (2 min)**  
  - **Wide intervals (e.g., migration):**  
    - `U_min(go)` is highly negative (pessimistic), `U_max(go)` is positive (optimistic).  
    - *Minimax regret favors "go"* if the potential gain (`Regret_no_go`) outweighs worst-case loss (`Regret_go`).  
  - **Narrow interval near threshold (e.g., dependency patch):**  
    - If interval straddles `U(go)=0`, `Regret_go` vs. `Regret_no_go` decides (e.g., if `U(go) = [-2, 5]`, `Regret_go=2`, `Regret_no_go=5` → **go**).  
  - **Failover drill (small risk, high learning value):**  
    - High `B` (learning) offsets risk: `U_min(go)` is less negative.  
    - *Minimax regret usually approves* since skipping (`Regret_no_go`) loses high learning value.  

  - **When business forces a binary choice:**  
    - If the rule abstains (rare with minimax regret), default to:  
      - **Go** if `(U_min(go) + U_max(go)) / 2 ≥ 0` (average utility).  
      - **No-go** otherwise.  
    - *Document this as a business override.*  

  ---

  ### **Why This Works**  
  - **Theory translated:**  
    - **Imprecise probabilities:** Intervals preserve uncertainty (no false precision from averaging).  
    - **Minimax regret:** Balances optimism/pessimism and handles learning value (unlike overly conservative maximin).  
    - **Ellsberg-compatible:** Treats known vs. ambiguous risks differently (e.g., [10%, 10%] vs. [1%, 25%]).  
  - **Predictable misfires and mitigations:**  
    | **Misfire**                          | **Mitigation**                                  |  
    |--------------------------------------|------------------------------------------------|  
    | One outlier widens intervals → no-go | Anonymization + justifications reduce gaming.  |  
    | Misjudged `B`/costs                  | Use pre-set tables; calibrate via retrospects. |  
    | Minimax regret undervalues drills    | Explicitly set high `B` for learning.          |  
  - **Gaming prevention:**  
    - Extreme intervals require justification (e.g., "[5%, 90%] because no integration tests").  
    - Anonymization reduces "veto by pessimism."  
    - Track patterns (e.g., if an engineer always gives [20%, 50%] for P(rollback)).  

  ---

  ### **Example Workflow: Failover Drill**  
  1. **Pre-set:** `B = 25` (high learning value), `C_recover = 5`, `C_bad = 20` (off-peak costs).  
  2. **Elicitation:**  
     - Alice: P(incident) = [1%, 5%], P(rollback_fail) = [0%, 10%] ("low risk off-peak").  
     - Bob: P(incident) = [3%, 10%], P(rollback_fail) = [5%, 20%] ("untested network").  
  3. **Aggregation:** P(incident) = [1%, 10%], P(rollback_fail) = [0%, 20%].  
  4. **Utilities:**  
     - `U_min(go) = 25 - 25*0.10 - 0.10*[5 + 0.20*(20-5)] = 25 - 2.5 - 0.8 = 21.7`  
     - `U_max(go) = 25 - 25*0.01 - 0.01*[5 + 0*15] = 25 - 0.25 - 0.05 = 24.7`  
  5. **Regrets:** `Regret_go = max(0, -21.7) = 0`, `Regret_no_go = max(0, 24.7) = 24.7` → **Go**.  

  ---

  ### **Final Notes**  
  - **Theory vs. Judgement:**  
    - **Core theory:** Imprecise intervals, minimax regret, utility calculations.  
    - **Judgement calls:** Standardizing `B`/costs, anonymization, forced-binary fallback.  
  - **When to refine:** If intervals always span [0%, 100%], invest in better staging/pre-tests.  
  - **Outcome:** Decisions respect uncertainty, discourage gaming, and value learning—without philosophy lectures.
