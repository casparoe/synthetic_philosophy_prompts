    - We ignore dependence between P(incident) and P(rollback_fail). But they might be dependent. For example, a complex change might have high P(incident) and also high P(rollback_fail). However, we are capturing the worst-case by taking the upper bounds for both? That might overestimate the risk because the worst-case might not be when both are at their maximum simultaneously? But note: we are using the envelope for each independently. Without knowing the dependence, we are being conservative by allowing the worst combination.

