    For necessary changes (like security patches), we set B to reflect the net benefit of doing it now.

    To save time, we can precompute a table for U_min(go) and U_max(go) for common ranges of [L_i_min, U_i_max] and [L_r_min, U_r_max] and for fixed B, C_recover, C_bad. Or we can use a simple calculator.

    This procedure should fit in 15 minutes.

    Finally, we note that the procedure is a formalization of imprecise probabilities and minimax regret. The aggregation step (taking the envelope) is a judgement call to capture the full range of opinions. The minimax regret rule is a standard decision rule under ambiguity. The rest (like the utility model) is also standard. The assignment of B, C_recover, C_bad is a judgement call and must be done carefully.

