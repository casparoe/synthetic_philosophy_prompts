    - The time might be tight: we have to do the calculations quickly. We can precompute a table or use a calculator.

  Given the above, we design the procedure as described.

  Summary of the decision procedure:

    Inputs for a change:
        - B: benefit (utility) of the change if successful (and without incident)
        - C_recover: cost incurred if an incident occurs but rollback succeeds
        - C_bad: cost incurred if an incident occurs and rollback fails

    Steps:

        1. Elicit from each engineer i:
              Interval for P(incident): [L_i, U_i]
              Interval for P(rollback_fail): [L_r_i, U_r_i]
