    But note: if we postpone, we might reduce the risk by doing more preparation. So the probabilities might be lower later. We are not modeling that.

    We leave it as: the change owner must set B to reflect the net benefit of doing the change now versus the alternative (which might be doing it later or not at all).

  Step 10: Predictable Misfires

    - The procedure might be too conservative for drills: because the worst-case utility might be negative even though the value of learning is high. But if we set B_learning appropriately high, then U_min(go) might still be positive? Or we might have:

          U_min(go) = B_learning - [ U_i * ( ... ) ]

        If B_learning is set high enough, then U_min(go) will be positive.

    - It might be too permissive if the benefit B is set very high: then even a high risk might be accepted. But that is intentional: if the benefit is high enough, we should take the risk.

    - The envelope aggregation might be too wide: one pessimistic engineer can force a very high U_i, which might lead to a no-go. We mitigate by requiring justifications and tracking.

    - The minimax regret rule in the case of crossing zero: 
