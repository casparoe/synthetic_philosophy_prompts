  Commitment (3) is about consumer ethics: no duty to abstain because no difference-making. This seems to be in tension with (2) because in voting, even though one vote doesn't make a difference (by (1)), there is a duty. Why the asymmetry?

  Commitment (4) grounds the duty in fairness/reciprocity. But note that in consumer ethics, we might also have cooperative schemes (e.g., environmental protection) that rely on collective action. Why isn't there a fairness duty in consumer ethics? The user might reply that in voting, we are beneficiaries of a specific cooperative scheme (the democratic system) and thus have a duty of reciprocity, whereas in consumer ethics, the connection is not as direct. But note that the user says in (3) that there is no individual duty to abstain because one's action doesn't make a difference. However, the fairness argument in (4) does not rely on making a difference but on contributing to a collective scheme.

  So the main tension is between (2)+(4) and (3). The user applies a difference-making principle in consumer ethics but rejects it in voting in favor of a fairness principle. But why not apply the fairness principle in consumer ethics? Or why not reject it in voting?

  Also, note that (6) is consistent with (4): if the duty is about fairness and reciprocity, then it shouldn't depend on closeness because even in a landslide, the system is the same and one benefits from it.

