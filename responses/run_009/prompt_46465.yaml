answer: |-
  Based on your friend's verdicts and the two candidate rules (Good Faith Belief vs. Meaningful Choice), here's a systematic breakdown of the implicit rule she's using, predictions for the new case, and a future test case to distinguish the rules definitively.

  ### Your Friend's Verdicts Recap:
  1. **Sincere Conscript** (threatened with prison, believes in self-defense): **Not liable**.  
  2. **Poor Volunteer** (sincere belief, enlisted to escape destitution): **Not liable**.  
  3. **Lying General** (knowingly planned unjust war): **Liable**.  
  4. **Indifferent Mercenary** (fights for pay, no belief in justice): **Liable**.  

  ### Candidate Rules:
  - **Rule A (Good Faith Belief)**: Combatants are excused (not liable) **if they sincerely and reasonably believe their side is just**, regardless of coercion or circumstances.  
  - **Rule B (Meaningful Choice)**: Combatants are excused (not liable) **only if they lack a meaningful/voluntary choice to avoid fighting**, regardless of their beliefs about the war's justice.  

  ---

  ### Step 1: Which Rule Fits the Existing Verdicts?  
  - **Rule A (Good Faith Belief) fits perfectly**:  
    - Cases 1 & 2: Both conscript and volunteer have sincere beliefs → excused → **not liable**.  
    - Case 3: General knows the war is unjust → no good faith → **liable**.  
    - Case 4: Mercenary is indifferent → no belief in justice → **liable**.  
    **Result**: Consistent with all verdicts.  

  - **Rule B (Meaningful Choice) fails Case 2**:  
    - Case 1: Conscript threatened with prison → no meaningful choice → excused → **not liable** (matches).  
    - Case 2: **Volunteer enlisted to escape poverty → he had a choice** (albeit hard). Rule B would predict liability (since he chose to fight), but your friend called him *not liable* → **contradiction**.  
    - Cases 3 & 4: General/mercenary had clear choices → **liable** (matches).  
    **Result**: Inconsistent with Case 2.  

  **Conclusion**: Your friend is implicitly using **Rule A (Good Faith Belief)**. Her judgments hinge on whether combatants *believed in the justice of their cause*, not on the voluntariness of their participation.  

  ---

  ### Step 2: Prediction for the New Case  
  - **New Case**: Conscript who **knows the war is unjust** but fights due to threats of imprisonment and family destitution.  
    - **Rule A (Good Faith Belief)**: He knows the war is aggression → **no sincere belief in justice** → **liable** (like the general/mercenary).  
    - **Rule B (Meaningful Choice)**: Severe duress (prison + family harm) → **no meaningful choice** → **not liable** (like the sincere conscript).  

  **Prediction**: Since Rule A fits her prior verdicts, she will likely deem this conscript **liable to attack**.  
  - **Why?** Her core principle is *moral responsibility through belief*. If you know you're committing aggression, you forfeit immunity—even if coerced. Case 2 (poor volunteer) shows that material pressures don't excuse if belief exists; here, the *absence* of belief is decisive.  

  ---

  ### Step 3: Future Test Case to Distinguish the Rules  
  To conclusively determine which rule she uses, propose a case where:  
  - **Combatant lacks good faith belief** (knows the war is unjust) **AND lacks meaningful choice** (severe duress).  

  #### Example Test Case:  
  > *A conscript is forcibly drafted into an aggressive war. He knows the war is unjust (e.g., he saw classified proof of aggression), but refuses to fight. As punishment, the regime sentences his family to execution. To save them, he reluctantly joins combat.*  

  - **Rule A (Good Faith Belief) Prediction**:  
    He knows the war is unjust → **no good faith** → **liable** (like the general).  
  - **Rule B (Meaningful Choice) Prediction**:  
    He has no plausible alternative (family execution) → **no meaningful choice** → **not liable** (like the sincere conscript).  

  **Why this works**:  
  - Your friend's verdict here would expose her core principle.  
    - If she says **liable**, she prioritizes *belief* (Rule A).  
    - If she says **not liable**, she prioritizes *choice/duress* (Rule B), contradicting her verdict on the poor volunteer (Case 2).  
  - Crucially, her existing verdicts suggest Rule A, so if she rules **not liable** here, it would force her to reconcile the inconsistency with Case 2 (volunteer with choice but belief).  

  #### Key Insight from Her Pattern:
  Your friend treats **belief in justice** as the "moral shield" that excuses participation. Even in hard circumstances (poverty, conscription), that belief absolves liability—but its absence condemns, even under duress. This aligns with revisionist Just War Theory (e.g., McMahan), where moral liability stems from contributing to unjust harm *knowingly*. Coercion may mitigate blame, but not liability to defensive attack.  

