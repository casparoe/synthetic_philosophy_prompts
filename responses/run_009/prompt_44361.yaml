prompt: |-
  I direct a five-person risk-analysis unit at a state agency that publishes a quarterly bulletin ranking the hazards facing our region — flooding, wildfire, dam failure, contamination of the water supply, and newer entries such as cyber incidents at public utilities. Each hazard line carries a probability, and the numbers are a mess. Some come from frequency data (vehicle and workplace accident rates), some from engineering models (dam breach analyses), and some are one-off judgments by our senior analyst, such as a figure for the regional water authority consolidating within a decade. We were recently embarrassed in a legislative hearing when a member asked what the "100-year flood" figure means for a specific river gauge next spring: two of my analysts gave incompatible answers, one treating it as a long-run frequency and one as a degree of belief, and neither addressed the fact that the public will read "1% per year" as a claim about next year at that spot.

  Please write a review procedure my team can run on every probability statement before it goes into the bulletin, built on the actual differences between the interpretations of probability: relative frequency in a reference class, degree of belief — and whose belief, anchored to what evidence — and, if we ever want to invoke it, single-case propensity. The procedure should consist of ordered steps. For a candidate statement, it should first settle what kind of quantity the number could be: is there a defensible reference class with real frequency data behind it, is the event a token one-off, is the number anchored to a model or to a person. It should then specify what grounding and what checks each kind requires — for example, that a subjective number be attributed to a stated body of evidence and, where possible, scored later against outcomes for calibration. It should mark where the procedure terminates with "publish no number, use words," and where it stops being a matter of facts and hands the decision to an editor. I specifically want the reference-class problem named and handled honestly: when our dam-failure figure depends on whether the class is "earthen dams of this vintage nationally" or "earthen dams on comparable geology in this state," the choice changes the number by an order of magnitude, and no formula selects the class for us.

  Constraints: a reviewer gets fifteen minutes per statement; the team is one statistician, two engineers, and two generalists, so nothing can assume fluency in measure theory or Bayesian formalism; and every published number must be traceable, because these figures get quoted in hearings, so each step should leave a one-line record of what was checked.

  Then run the procedure on three statements from our current draft: (1) a 1% annual chance of a flood exceeding the 100-year stage at a named gauge, where the return-period figure comes from a national method but will be read as next year's risk at that location; (2) a 0.2% probability of a 1931 earthen dam failing within twenty years, where our two candidate reference classes disagree by an order of magnitude; and (3) the senior analyst's 30% figure for water-authority consolidation within a decade — a number I would like to keep, and on which I want the procedure applied honestly even if it strips the number or forces me to sign off on an explicit judgment call. Close by saying what the procedure cannot do — in particular, whether it can make two analysts converge on the same number for the one-off cases, and whether anything short of rewriting the bulletin can stop the public from reading every figure as a claim about next year.
reasoning: |-
  We are designing a review procedure for probability statements in a risk-analysis bulletin. The goal is to ensure clarity on the interpretation of each probability (frequency, degree of belief, or propensity) and to handle the reference-class problem honestly. The procedure must be executable in 15 minutes per statement by a team with mixed expertise and leave a traceable one-line record per step.

  Procedure: Review Steps for a Candidate Probability Statement

  Step 1: Identify the Type of Probability
  - Question: What is the source of the probability? (Frequency data, model, or judgment?)
  - Actions:
    a. If there is a clear reference class with observed frequency data, classify as "frequency-based".
    b. If the number comes from a mathematical model (e.g., engineering simulation), classify as "model-based".
    c. If the number is an expert judgment without direct frequency data, classify as "subjective belief".
    d. If the event is a one-off and there is no clear reference class, and the number is intended as an inherent propensity, classify as "propensity". (Note: This is rare and often controversial; we might avoid it.)
  - Record: [Type] (e.g., "Frequency", "Model-based", "Subjective", or "Propensity")
  - Time: 2 minutes

  Step 2: Handle Reference-Class Problems (if applicable)
  - Question: For frequency-based or model-based probabilities, what is the reference class? Is there a clear and defensible one?
  - Actions:
    a. For frequency-based: Identify the reference class and note any alternative classes that could change the number significantly (e.g., national vs. state dams). If there are multiple defensible classes, note the range of probabilities and the chosen class with a brief justification.
    b. For model-based: Identify the model and its assumptions. Note if the model's reference class (e.g., input data or scenario) is clearly defined and if alternative models/classes would change the result.
    c. If the reference class is ambiguous and leads to order-of-magnitude differences, flag for editorial decision: either publish a range, use words, or note the uncertainty explicitly.
  - Record: [Reference class used and alternatives considered, or "Ambiguous: range X to Y", or "N/A"]
  - Time: 3 minutes

  Step 3: Grounding and Checks
  - Question: What evidence anchors the number? What checks can be applied?
  - Actions by type:
    a. Frequency-based:
       - Check: Is the data recent, from a reliable source, and of sufficient sample size? If not, note limitations.
       - Grounding: State the data source and time period.
       - Check: If possible, note the margin of error or confidence interval.
    b. Model-based:
       - Check: Is the model peer-reviewed or standard? Are the inputs current and appropriate? Note any known limitations.
       - Grounding: State the model and key assumptions.
       - Check: If there is validation data, note how the model has performed against it.
    c. Subjective belief:
       - Check: Require that the probability be attributed to a specific body of evidence and to a specific expert or group (e.g., "Senior Analyst, based on trends in utility mergers").
       - Grounding: Document the evidence and the expert (title, not name, unless policy requires).
       - Check: If the event is recurring, set up a calibration check (e.g., track over time and compare to outcomes). For one-off events, note that calibration is not possible.
    d. Propensity: (Avoid if possible; if used, treat as subjective but with a specific note about the single-case nature.)
  - Record: [Grounding: ...] [Checks: ...] [Calibration plan if applicable]
  - Time: 5 minutes

  Step 4: Public Clarity and Communication
  - Question: How might the public misinterpret this? Specifically, could it be read as a claim about the immediate future or a specific instance?
  - Actions:
    a. If the probability is about a long-run frequency but the public may interpret it as next year's risk, require a clarifying note in the bulletin (e.g., "This is the long-run average annual chance; the risk in any single year may vary").
    b. For one-off events (like dam failure or consolidation), explicitly state that the probability is an estimate and not based on frequency data (if applicable) and note the uncertainty.
    c. If the event is rare and the probability is very low, consider whether the number might be misread (e.g., as impossible or inevitable). Use words if the number is too ambiguous (e.g., "very low chance").
    d. If the statement is about a specific location and time (like the flood at a gauge next spring), note that the 100-year flood probability does not guarantee the event happens exactly every 100 years and that the risk is constant each year (independent).
  - Record: [Misinterpretation risk: ...] [Clarification added: ...]
  - Time: 3 minutes

  Step 5: Termination and Editorial Hand-off
  - Question: Should we publish a number? If not, what words?
  - Actions:
    a. If the reference class is too ambiguous and cannot be resolved, or if the grounding is too weak, terminate with "publish no number, use words" (e.g., "low chance", "moderate likelihood", with a note explaining the uncertainty).
    b. If the number is subjective and one-off, it can be published only if:
       - It is explicitly attributed to an evidence-based judgment (with the evidence stated).
       - A senior editor (like the unit director) signs off on the judgment.
    c. Hand the following to an editor:
       - The final decision on whether to publish a number or words when the procedure flags ambiguity.
       - The wording of any clarifying notes.
       - The decision to publish a subjective number without frequency basis (with the director's sign-off).
  - Record: [Decision: publish number? (Y/N)] [If not, words to use: ...] [Editorial notes: ...] [Sign-off required: Y/N and by whom]
  - Time: 2 minutes

  Total Time: 15 minutes

  Now, apply the procedure to the three statements:

  Statement 1: 1% annual chance of a flood exceeding the 100-year stage at a named gauge.

  Step 1: Type: Frequency-based (from national method using historical data).
  Record: Frequency.

  Step 2: Reference class: The national method uses a reference class of historical flood events at that gauge (or similar gauges in the region). The reference class is well-defined by the method. However, note that the method assumes stationarity (no changing climate or land use). Alternative classes (e.g., including more recent data only) might change the number, but the national method is standard.
  Record: Reference class: historical flood events at this gauge as per national method. Alternatives considered: none (standard method).

  Step 3: Grounding: Data from gauge records, analyzed using [name of national method]. Checks: The method is standard and peer-reviewed. The data is from [time period]. Margin of error: [if available, note confidence interval, else "not provided in method"].
  Record: Grounding: [National method] with data from [years]. Checks: Standard method, but no margin of error provided.

  Step 4: Public clarity: The public may interpret "1% per year" as exactly 1% for next year at that spot. Clarify: "This 1% annual chance is a long-term average. The risk in any given year, including next year, is about 1%, but the flood could occur in consecutive years or not for many years."
  Record: Misinterpretation risk: reading as exact next-year prediction. Clarification added: note about long-term average.

  Step 5: Termination: Publish the number. Editorial note: Include the clarification in the bulletin.
  Record: Decision: Y. Words: none. Editorial note: add clarification. Sign-off: N.

  Statement 2: 0.2% probability of a 1931 earthen dam failing within twenty years.

  Step 1: Type: Model-based (engineering model) or frequency-based? The problem states two candidate reference classes. We might classify as model-based if the number comes from a model using a reference class, but the reference class is in dispute.
  Record: Model-based (with reference class issue).

  Step 2: Reference class: The two candidate classes are (a) earthen dams of this vintage nationally and (b) earthen dams on comparable geology in this state. The probability changes by an order of magnitude. We cannot resolve this by formula. 
  Record: Ambiguous: national class gives X%, state class gives Y%. [Example: national 0.2%, state 2%?]. The current figure (0.2%) is based on the national class.

  Step 3: Grounding: The number is based on a model using the national reference class. Checks: The model is [name/model type]. The state class might be more appropriate for local risk but has less data. Without a clear reason to prefer one, note the uncertainty.
  Record: Grounding: Model [name] with national earthen dams. Checks: Alternative class (state) would give higher probability; data for state class is sparse.

  Step 4: Public clarity: The public might not understand the reference class and think the number is more certain than it is. Clarify: "This estimate is based on national data for similar dams. The risk could be significantly higher when considering local geology, but data limitations prevent a precise local estimate."
  Record: Misinterpretation risk: underestimating uncertainty. Clarification added: note about national vs. local and uncertainty.

  Step 5: Termination: The ambiguity is high. We could:
     Option A: Publish the number with a strong note about the uncertainty and the alternative estimate.
     Option B: Publish a range (e.g., 0.1% to 2%) and explain.
     Option C: Use words (e.g., "low to moderate chance").
     Since the problem says the numbers are a mess and we want honesty, we might choose Option B. However, the procedure says if ambiguous, hand to editor. Also, the time constraint might not allow for a full range calculation. In 15 minutes, we can only note the ambiguity. Therefore, hand to editor with: "Publish a range? Or words? Current number is 0.2% but state class suggests 2%." The editor must decide.
  Record: Decision: Hand to editor. Words: none yet. Editorial notes: "Ambiguous reference class: national 0.2% vs state 2%. Recommend publishing a range (0.1%-2%) or words." Sign-off: Editor and/or director.

  Statement 3: 30% probability of water-authority consolidation within a decade.

  Step 1: Type: Subjective belief (senior analyst's judgment).
  Record: Subjective.

  Step 2: Reference class: Not applicable (one-off event). But if there are similar consolidations, note. However, the problem says it's a one-off judgment.
  Record: N/A.

  Step 3: Grounding: Attribute to the senior analyst. Evidence: "based on [state the evidence, e.g., recent merger talks, financial pressures, etc.]". Checks: This is a one-off event, so calibration is not possible. However, we can track the outcome and note if it happens within ten years for future calibration of the analyst.
  Record: Grounding: Senior Analyst, based on [brief evidence: e.g., "trends in utility mergers and financial pressures in the region"]. Checks: No frequency data. Will track for future calibration.

  Step 4: Public clarity: The public might interpret this as a firm prediction. Clarify: "This estimate is a judgment based on current evidence and is not derived from historical frequency. It represents our current assessment of the likelihood."
  Record: Misinterpretation risk: over-interpreting as a frequentist probability. Clarification added: note about judgment basis.

  Step 5: Termination: We can publish the number only with explicit attribution and a note about its subjective nature. Also, the director (you) must sign off because it's a judgment call. 
  Record: Decision: Y, with sign-off. Words: none. Editorial notes: include attribution and clarification. Sign-off: Required by director.

  What the Procedure Cannot Do:
  - It cannot make two analysts converge on the same number for one-off cases. Subjective probabilities may legitimately differ based on evidence and interpretation. The procedure ensures the subjectivity is exposed and anchored to evidence, but it doesn't force consensus.
  - It cannot, by itself, stop the public from reading every figure as a claim about next year. Only clear communication (in the bulletin) and education can mitigate that. Rewriting the bulletin to include explicit caveats and explanations for each probability statement is essential. Without that, the procedure only flags the issue but doesn't fix the communication.

  Final Note: The procedure leaves a one-line record per step, which can be stored in a log for each statement. This log provides traceability for hearings.
answer: |-
  ### Probability Review Procedure for Risk-Analysis Bulletin

  This 15-minute review procedure ensures every probability statement is grounded in a defensible interpretation (frequency, belief, or propensity), honestly addresses reference-class problems, and communicates transparently. Each step leaves a traceable one-line record (e.g., in a shared spreadsheet). Non-statistical reviewers can apply it using plain-language checks.

  #### **Step 1: Identify Probability Type**  
  *Time: 2 min | Output: Type + 1-line rationale*  
  - **Question:** What is the source?  
  - **Checks:**  
    - **Frequency:** Is there empirical data from a repeatable process (e.g., flood records)?  
    - **Belief:** Is it anchored to expert/model judgment without direct data?  
    - **Propensity:** Is it a one-off event with no reference class (rare; use sparingly)?  
  - **Terminate if:** No clear basis exists (e.g., pure guesswork). Record: "No defensible type—use words (e.g., 'possible')."  
  - **Trace:** "Type: [Frequency/Belief/Propensity]. Basis: [e.g., 'USGS flood data']."  

  #### **Step 2: Resolve Reference-Class Conflicts**  
  *Time: 3 min | Output: Class choice + 1-line justification*  
  - **Question:** What population defines the probability?  
  - **Checks:**  
    - List defensible reference classes (e.g., "dams nationally" vs. "dams in state").  
    - Quantify variance (e.g., "Class A: 0.1%, Class B: 1%").  
    - If variance > 2x, flag as "high ambiguity."  
  - **Terminate if:**  
    - No agreement on class after 3 min. Record: "Ambiguous class—publish range/words (e.g., '0.1–1% chance')."  
    - Editor decides: Publish range, words, or defer to senior staff.  
  - **Trace:** "Ref-class: [e.g., 'state dams']. Ambiguity: [Low/High]. Alternatives: [e.g., 'national: 0.1%']."  

  #### **Step 3: Grounding & Validation**  
  *Time: 5 min | Output: Evidence + checks + 1-line audit*  
  - **Checks by type:**  
    - **Frequency:**  
      - Source of data? (e.g., "NWS gauge records 1920–2020").  
      - Sample size > 20 events? If not, note uncertainty.  
    - **Belief:**  
      - Attribute owner (e.g., "Senior Analyst, Evidence: utility merger trends").  
      - Calibration plan? (e.g., "Track consolidation outcome for scoring").  
    - **Propensity:**  
      - State justification (e.g., "Modeled stress-test for this dam").  
  - **Terminate if:** Belief lacks evidence/owner. Record: "Ungrounded—use words (e.g., 'plausible')."  
  - **Editor hand-off:** Subjective probabilities require director sign-off.  
  - **Trace:** "Grounding: [e.g., 'NWS method']. Checks: [e.g., '20-yr data']. Calibration: [e.g., 'Track outcomes']."  

  #### **Step 4: Public Misinterpretation Safeguards**  
  *Time: 3 min | Output: Caveats + 1-line comms note*  
  - **Question:** Could the public misread this?  
  - **Checks:**  
    - If frequency-based, add: "Long-term average, not next-year prediction."  
    - If belief/propensity, add: "Judgment call, not data-driven."  
    - For rare events, test: Is "1%" likely seen as "impossible" or "inevitable"?  
  - **Terminate if:** Risk is severe (e.g., "100-year flood" for next spring). Record: "Misinterpretation likely—use words (e.g., 'low chance') or rewrite."  
  - **Trace:** "Comms note: [e.g., 'Add long-term caveat']."  

  #### **Step 5: Final Approval**  
  *Time: 2 min | Output: Publish decision + 1-line record*  
  - **Editorial rules:**  
    - Publish number only if:  
      - Type is clear, reference class justified, grounding documented.  
      - Beliefs have director sign-off.  
    - Else, use words (e.g., "very low chance").  
  - **Trace:** "Approved: [Yes/No]. Words: [if applicable]. Sign-off: [e.g., 'Director']."  

  ---

  ### **Application to Current Draft Statements**  
  *Reviewer notes simulated for a 15-min review each.*

  #### **Statement 1: 1% annual flood chance at named gauge**  
  - **Step 1:** Type: Frequency (national method). Trace: "Type: Frequency. Basis: USGS Atlas-14 method."  
  - **Step 2:** Ref-class: Fixed by method (gauge-specific data). Trace: "Ref-class: Gauge [X] data. Ambiguity: Low."  
  - **Step 3:** Grounding: National method. Trace: "Grounding: USGS 100-yr model. Checks: 80-yr data. Calibration: N/A."  
  - **Step 4:** Misinterpretation: High—public will read as "next year." Trace: "Comms note: Add 'long-term average, not specific to 2025’."  
  - **Step 5:** Approved with caveat. Trace: "Approved: Yes. Words: None. Sign-off: N/A."  
  - **Outcome:** Publish with caveat.  

  #### **Statement 2: 0.2% dam failure in 20 years**  
  - **Step 1:** Type: Frequency (engineering model). Trace: "Type: Frequency. Basis: Dam failure model."  
  - **Step 2:** Ref-class: High ambiguity (national vs. state). Trace: "Ref-class: National earthen dams. Ambiguity: High. Alternatives: State dams (2%)."  
  - **Step 3:** Grounding: Model output. Trace: "Grounding: FERC model. Checks: Peer-reviewed. Calibration: N/A."  
  - **Step 4:** Misinterpretation: Moderate—public may overlook class choice. Trace: "Comms note: Add ‘estimate varies by location; state data suggests up to 2%’."  
  - **Step 5:** Terminate: Ambiguous class. Record: "Approved: No. Words: ‘Low chance (0.2–2%)’. Sign-off: Editor."  
  - **Outcome:** Publish range or words; editor decides.  

  #### **Statement 3: 30% water-authority consolidation**  
  - **Step 1:** Type: Belief. Trace: "Type: Belief. Basis: Senior Analyst judgment."  
  - **Step 2:** Ref-class: N/A (one-off). Trace: "Ref-class: N/A. Ambiguity: N/A."  
  - **Step 3:** Grounding: Analyst’s evidence. Trace: "Grounding: Analyst [Title], Evidence: ‘2023 merger talks, funding gaps’. Calibration: Track by 2034."  
  - **Step 4:** Misinterpretation: High—public may see as data-driven. Trace: "Comms note: Add ‘expert judgment, not historical frequency’."  
  - **Step 5:** Editorial hand-off: Subjective. Trace: "Approved: Pending. Words: None. Sign-off: Director required."  
  - **Outcome:** Publish only with director sign-off and caveat.  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Force consensus on one-off cases:**  
     - Subjective probabilities (e.g., dam failure, consolidation) reflect individual judgment. The procedure ensures transparency (e.g., "Analyst A: 30%, based on X; Analyst B: 10%, based on Y") but cannot reconcile differences. The solution is to publish ranges, attribute sources, or defer to director arbitration.  
  2. **Prevent public misinterpretation alone:**  
     - No procedure can stop readers from interpreting "1% annual chance" as "1% next year." Only *rewriting the bulletin* can fix this:  
       - Add explicit disclaimers (e.g., "All annual probabilities are long-term averages").  
       - Use visual cues (e.g., color-coding frequency vs. belief).  
       - Supplement numbers with plain-language summaries (e.g., "Unlikely next year, but possible").  
     - Without structural changes, misreading is inevitable.  

  **Final Note:** This procedure makes trade-offs explicit, documents decisions, and flags editor/director interventions. It transforms ambiguity from a liability into a communicated feature—critical for credibility in hearings.
