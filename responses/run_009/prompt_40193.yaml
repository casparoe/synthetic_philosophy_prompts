  Okay, the user is on the volunteer board of the Milhaven Historical Society and they're facing a tough decision about the town's sesquicentennial exhibit. The founding story of Elias Crane, the mill owner who built the town, is central to Milhaven's identity. But a grad student found documents showing Crane bought land cheaply during a panic, used child labor, and broke a strike. The board is split between sticking to the cherished narrative and presenting the documented facts.

