  For structure: lead with Crane’s mythic role ("as remembered"), then pivot with "archival records reveal" to introduce findings. Use neutral language—"conflict" instead of "strike broken," "financial distress" instead of "cheated." This avoids judgment while stating facts. The conclusion should frame the duality as part of Milhaven’s maturation, not a takedown.

