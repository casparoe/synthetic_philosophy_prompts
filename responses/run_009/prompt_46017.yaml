  Okay, the user is a jurisprudence professor preparing for a lecture on the Hart-Fuller debate, specifically the grudge informer case. They want me to role-play as Lon Fuller to help them rehearse their argument against Hart's position. 

  Hmm, the user clearly knows their stuff - they're familiar with Fuller's actual arguments beyond the caricature of natural law, and they want a rigorous exchange. They're anxious about under-preparing for undergrads who'll ask tough questions, so they need a sparring partner who can challenge their Hartian perspective authentically. 

  Let me channel Fuller's core thesis: the internal morality of law isn't about content being moral, but about procedural legitimacy. Eight principles like publicity and non-retroactivity aren't optional extras - they're what make rules recognizable as law rather than arbitrary power. The Nazi "statutes" failed this test spectacularly - secret laws, retroactive punishments, no congruence between words and actions. 

  Ah, and here's the crux: Hart thinks calling such atrocities "law" is honest labeling. But Fuller would counter that this obscures how Nazism perverted law's very function. When rules become mere tools for terror, insisting they're still "law" risks legitimizing the perversion. The postwar court wasn't dodging hard choices - it was restoring law's moral foundations after they'd been systematically poisoned.

  The user wants me to be sharp and concede small points where Fuller actually would. For example, Fuller might grant Hart's point about retroactivity being problematic, but then pivot to argue that in extreme cases like this, declaring the Nazi edicts non-law is the lesser evil - it prevents the ongoing contamination of the legal system by their poison. 

  I should emphasize that legality isn't a binary but a continuum - the Nazi regime didn't just make bad law, it actively sabotaged law's inner structure. When officials ignore their own rules, when citizens can't know what's forbidden, you don't have law - you have a crime license masquerading as law. That's why the court had to draw a bright line: not to hide the pencil work, but to erase the forgery entirely.
answer: |-
  Professor Hart, you fundamentally misconstrue my position—and the court’s action—if you frame this as merely substituting one moral judgment ("odious") for legal validity. My argument isn’t that evil *content* voids law, but that the Nazi regime systematically violated the *procedural morality* constitutive of law itself. When statutes were kept secret, applied retroactively to punish "crimes" that weren’t offenses when committed, or twisted by officials to serve arbitrary terror—as with the grudge informer’s opportunistic denunciation—they ceased to function *as law*. They became instruments of ad hoc despotism disguised as rules.  

  The court didn’t engage in "pencil work" or hide a moral choice. It recognized that a purported "legal" system that utterly abandons generality, prospectivity, and congruence between rules and administration forfeits the very character of law. Punishing the informer under restored principles of legality wasn’t retroactive *lawmaking*; it was refusing to dignify a void pseudo-law that had already collapsed under its own incoherence. You posit a false dilemma: either accept all tyranny as "law" or admit to extra-legal retroactivity. There’s a third path: reject the pretense that such distortions are law at all, precisely to *protect* citizens from the chaos where power masquerades as rules. Legality, properly understood, *requires* these internal virtues—not as moral ideals, but as conditions of existence. Your positivist separation blinds you to how law’s authority is built on these foundations. When they crumble, so does law.  
  *—Fuller*  

  *(Standing by for your next move, Professor Hart.)*
