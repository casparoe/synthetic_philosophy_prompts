prompt: |-
  A friend who took one metaethics seminar too many walked me into the following argument, and I cannot find the exit.

  (1) Being admirable consists in nothing over and above this: there being sufficient reason to admire one. Admirability is just the existence of the reasons; no further fact stands behind them.
  (2) There is sufficient reason to admire the demon. He will torture you for a year unless you admire him, and a year of torture decisively outweighs whatever costs attach to admiration.
  (3) So the demon is admirable.
  (4) But the demon is not admirable. Extortion is the paradigm of what admiration is not a response to; if admiration is ever merited, it is merited by merit.
  (5) So (1) is false, and there are facts about which attitudes are fitting that reasons do not ground.

  He then insists the conclusion proves far too much. If (5) is right, the same should hold for belief: what makes a belief fitting cannot be exhausted by reasons to believe either, so there could be a belief that is fitting to hold even though nothing counts in favor of its truth. Since, he says, a fitting belief just is one supported by evidence, (5) collapses into incoherence. So he keeps (1) and (2), accepts (3), and concludes that the demon has made himself admirable by acquiring power over us — and that this sounds absurd only because we confuse being admirable with being good, which (1) never claimed.

  I want to keep (4), and I also cannot bring myself to deny (2): it would genuinely be stupid, all things considered, to endure a year of torture rather than admire him. So tell me the following. First, where exactly does the argument go wrong — name the step, and identify the equivocation, if that is what does the work. Second, suppose you diagnose it by distinguishing two kinds of reasons to admire: those that bear on whether admiration is a merited response to its object, and those that bear on whether having the attitude would go well for you. Can you say what makes this distinction principled, without merely re-listing the intuitions about cases it was invented to save? Third, suppose that early in his career the demon once did something genuinely courageous — not enough on its own to make him admirable, but real. Do the two kinds of reasons sum? If they do, an unfitting admiration could become fitting with the addition of a threat, which sounds mad; if they do not, explain what stops them, given that both seem to be reasons of some sort. Finally, tell me what my insistence on keeping both (2) and (4) commits me to regarding the difference between what I ought to admire and what is admirable.
reasoning: |-
  Okay, let me start by understanding the user's problem. They're stuck in this metaethics argument presented by a friend. The argument has five steps, leading to a conclusion that admirability isn't grounded in reasons, which then extends to belief. The user wants to reject step (3) and keep both (2) and (4), meaning they think the demon isn't admirable even though there are strong practical reasons to admire him. 

  First, I need to identify where the argument goes wrong. The key seems to be equivocation in the term "reasons to admire." Step (1) probably refers to normative reasons—reasons that make admiration fitting or appropriate. But step (2) introduces pragmatic reasons—admiring to avoid torture. So step (3) incorrectly conflates these two types of reasons. That's the equivocation.

  Next, the user asks how to distinguish these two kinds of reasons without just relying on intuitions. The principled distinction lies in their roles. Normative reasons are object-given; they relate to the properties of the thing being admired. Pragmatic reasons are state-given; they relate to the consequences of having the attitude. This isn't arbitrary but based on the nature of the attitudes and their correctness conditions.

  Then, there's the question about the demon having a genuinely courageous past act. If we add a small normative reason to admire (from the past act) to the strong pragmatic reason (avoiding torture), do they sum? I think they don't sum because they belong to different categories. Normative reasons contribute to fittingness; pragmatic reasons don't. So even with both, the admiration isn't fitting. The threat doesn't make unfitting admiration fitting; it just makes it prudent.

  The user also wants to know what their commitment to keeping (2) and (4) implies about the difference between "ought to admire" and "admirable." This distinction is crucial. "Admirable" is about fittingness, tied to normative reasons. "Ought to admire" can be all-things-considered, including pragmatic reasons. So one can have an obligation to admire without the object being admirable, which resolves the demon scenario.

  The friend's extension to belief is a false analogy. Beliefs aim at truth, so only evidence (normative reasons) makes them fitting. Pragmatic reasons might make believing beneficial, but not correct. So (5) doesn't lead to incoherence. The user can maintain that belief fittingness is solely evidence-based without contradiction.

  Underlying all this, the user might be seeking a robust metaethical framework that preserves intuitions about moral realism versus pragmatism. They need a clear distinction between different types of reasons to navigate moral dilemmas like the demon's threat without compromising on what's truly admirable. The deeper need is likely a coherent system where morality isn't undermined by coercion, maintaining that genuine admirability is immune to external threats.
answer: |-
  Here's a step-by-step analysis and resolution of your dilemma, directly addressing your queries:

  **1. Where the Argument Goes Wrong (The Equivocation):**
  The argument equivocates on the meaning of "sufficient reason to admire" between premise (1) and premise (2). This is the fatal flaw.

  *   **Premise (1) uses "sufficient reason to admire" in the "fittingness" or "merit" sense:** These are **normative reasons** *for the attitude itself being an appropriate or correct response to the object's properties*. They make admiration *fitting* or *warranted*. For example, courage is a reason (in this sense) to admire someone because admiration is the *correct response* to the property of courage.
  *   **Premise (2) uses "sufficient reason to admire" in the "pragmatic" or "state-given" sense:** These are **practical reasons** *to cause oneself to have the attitude* (or perhaps to *display* it) *because of the beneficial consequences of having/displaying it*. The torture threat isn't a reason *why admiration is a fitting response to the demon*; it's a reason *why it would be prudent for you to get yourself into a state of admiration towards him*.

  **The Invalid Step:** Step (3) ("So the demon is admirable") is invalid because it conflates these two distinct types of reasons. Premise (1) requires *fittingness reasons* for admiration to entail admirability. Premise (2) only provides *pragmatic reasons* to *induce* admiration. Pragmatic reasons do not make the admiration *fitting*; they make inducing it *prudent*. Therefore, (2) does not provide the type of reason required by (1) to conclude (3). The demon is *not* admirable (as per (4)), even though there are overwhelming pragmatic reasons *to admire him* (as per (2)).

  **2. The Principled Distinction Between Reason Kinds (Beyond Intuition):**
  The distinction between **Fittingness Reasons (Normative/Attitude-Given)** and **Pragmatic Reasons (State-Given)** is principled based on **the nature of the attitude and its constitutive aim**:

  *   **Admiration's Constitutive Aim:** Admiration is an evaluative attitude. Its point, its internal standard of correctness, is to *track* and *respond to* perceived *excellence*, *merit*, or *admirable qualities* in its object. It aims to be *fitting* or *appropriate* to the object's properties.
  *   **Fittingness Reasons:** These reasons pertain *directly* to this constitutive aim. They are reasons provided *by properties of the object* that *make admiration the correct response*. Courage provides a fittingness reason for admiration *because* admiration is the attitude constitutively aimed at responding to excellence like courage. These reasons answer the question: "What about this object *merits* admiration?"
  *   **Pragmatic Reasons:** These reasons pertain *indirectly* to the *consequences* of *having*, *cultivating*, or *expressing* the attitude. They are reasons provided by the *benefits* (or avoidance of harms) *for the subject* that result from the attitude-state. The torture threat provides a pragmatic reason *because* the *state of admiring* avoids a terrible consequence. These reasons answer the question: "Why would it be *good for me* to be in a state of admiration towards this object?"
  *   **The Principled Core:** The distinction flows from the *different roles* the reasons play relative to the attitude's *internal standard of success/correctness*. Fittingness reasons are *constitutive* of the attitude's correctness condition. Pragmatic reasons are *external* incentives related to the *contingent consequences* of being in that attitudinal state. They operate on different logical planes.

  **3. Summing Reasons & The Demon's Past Courage:**
  **No, the two kinds of reasons do not sum to make unfitting admiration fitting.**

  *   **The Scenario:** The demon has a small genuine past act of courage (providing a weak fittingness reason for admiration) and the powerful torture threat (providing a strong pragmatic reason to admire).
  *   **Why They Don't Sum:**
      *   **Different Targets:** The weak fittingness reason makes *some admiration* (specifically, directed *at that past courageous act*) *slightly fitting*. The pragmatic reason provides overwhelming incentive *to induce a state of admiration towards the demon overall* (or at least to display it).
      *   **No Overlap in Correctness Contribution:** The pragmatic reason *does not contribute* to making admiration *a correct response to the demon's overall character or current actions*. It doesn't make the demon *possess more excellence* or *be more worthy of admiration*. It only makes *being admiring* more beneficial *for you*.
      *   **Result:** You have a *very weak fittingness reason* to admire *one specific past act* of the demon. You have an *overwhelming pragmatic reason* to *induce in yourself* a *state of admiration towards the demon as he is now* (which includes his extortion). The pragmatic reason *cannot transform* the admiration induced by the threat into a *fitting* response to the demon's current, extortionate self. The admiration directed at his *current character/action* (prompted by the threat) remains *unfitting*, even if you also have a weak fittingness reason to admire a *different, past aspect*.
      *   **What Stops the Summing:** The fundamental difference in kind explained in point 2. Pragmatic reasons operate on the *state* of having the attitude for its consequences; they are not evidence of or constitutive of the attitude being *correct* relative to its object. Adding a pragmatic reason to a weak fittingness reason doesn't make the object *more admirable overall*; it just gives you stronger incentive to *act as if* it were more admirable than the fittingness reasons warrant.

  **4. Commitment Regarding "Ought to Admire" vs. "Admirable" (Given Keeping (2) & (4)):**
  By insisting on both (2) (strong pragmatic reason to admire) and (4) (demon is not admirable), you are committed to a **clear separation between what is *admirable* (fitting to admire) and what one *ought (all things considered) to admire*.**

  *   **Admirable (Fittingness):** This refers *only* to properties that make admiration the *correct* or *merited* response. It is determined *solely* by fittingness reasons (object-given reasons related to excellence/merit). The demon lacks these (beyond perhaps a minor past act), hence is not admirable (4).
  *   **Ought to Admire (All-Things-Considered Obligation):** This encompasses *all* relevant normative considerations, including both:
      *   **Fittingness Reasons:** Is admiration the *correct* response? (Usually the primary factor)
      *   **Pragmatic Reasons:** Are there *overriding consequences* (like avoiding torture) that make it *overall obligatory* to *induce* or *display* the attitude, *even if it's not fully fitting*?
  *   **The Commitment:** You are committed to the view that while the *default* and *primary* reason to admire something is that it *is* admirable (fitting), there can be *exceptional*, *overwhelming* pragmatic circumstances where the *all-things-considered* obligation ("ought") is to *cause oneself to admire* (or act admiringly towards) an object that is *not* admirable. The "ought" here is practical and overriding, based on the catastrophic cost of *not* inducing the attitude, not on the object's admirability. The demon scenario is precisely such an exception. You *ought* (all things considered) to admire him to avoid torture, even though he *is not* admirable.

  **Addressing the Friend's Belief Argument:**
  Your friend's extension to belief fails because belief has a different constitutive aim: **truth**. Evidence (fittingness reasons for belief) *constitutively* makes belief fitting/correct. Pragmatic reasons (e.g., Pascal's Wager - believe in God to go to heaven) provide incentive to *induce* belief, but they *cannot* make the belief *true* or *epistemically justified*. A belief induced solely by pragmatic reasons is *not* fitting; it is wishful thinking or self-deception. The "fitting belief just is one supported by evidence" intuition is correct *because* of belief's constitutive link to truth. Admiration's constitutive link is to *excellence/merit*, not directly to the believer's well-being. The incoherence your friend predicts doesn't arise because pragmatic reasons simply don't contribute to the *fittingness* of belief. They only bear on the *prudence* of inducing the state. Therefore, (5) does not lead to the absurdity he claims.
