prompt: |-
  A popular science piece I read recently covered the "extended mind" thesis of Andy Clark and David Chalmers, and I came away both intrigued and uneasy about whether I'd been given the real position. Here is how the author put it (from my notes):

  "Clark and Chalmers argued that the mind does not stop at the skin: whatever a person relies on to think becomes part of their mind. Their famous example involves Otto, a man with Alzheimer's who writes down what he wants to remember in a notebook. Because Otto consults his notebook as naturally and as automatically as his counterpart Inga consults her biological memory, the notebook is literally a part of Otto's mind — his belief that the Museum of Modern Art is on 53rd Street sits on the page rather than in his skull. This is essentially an update of the old semantic externalism of Putnam and Burge, who showed that the meanings of our words depend on the environment; Clark and Chalmers extend the same insight from meanings to beliefs. The practical upshot is that your mind already includes your smartphone and everything you keep in the cloud, since you depend on them constantly the way Otto depends on his notebook. Critics replied that this confuses causal dependence with constitution — by this logic, my mind extends into my calculator, the telephone network, and eventually the entire economy — and this objection has generally been taken to have sunk the thesis, which survives today mostly as a slogan about how intimately we are coupled to our devices."

  I found the Otto example genuinely compelling, but the later sentences felt as though they were sliding somewhere the argument doesn't obviously go, and the ending's confident obituary for the thesis struck me as suspicious. Please audit this summary for me. I'd like the response organized into the following sections, in this order:

  1. **First impressions** (roughly one short paragraph): an overall judgment of how fair the summary is, so I know what to watch for.
  2. **Sentence-by-sentence audit** (roughly four to six paragraphs): go through the summary and separate what a philosopher of mind would accept, what is a subtle misrepresentation, and what is plainly wrong. In particular, I'd like you to address: what the authors' parity-style principle actually licenses and what it doesn't; the conditions they attach to Otto's notebook (reliability, easy availability, and automatic endorsement of its contents) and how those conditions bear on the smartphone claim; whether the article is right to treat Otto's belief as straightforwardly "on the page," or whether a more careful statement of what the notebook is supposed to be would say something different; and whether equating Clark and Chalmers with Putnam and Burge captures their own view of the relationship.
  3. **The critic's objection** (roughly two paragraphs): assess the causal-dependence-versus-constitution objection as the article states it. What would a defender of the extended mind say about it, is the article presenting a serious open debate as a settled refutation, and does the "sunk the thesis" claim match how the debate has actually gone?
  4. **A corrected version** (roughly one paragraph): rewrite the summary so that it is faithful to the position, at the same level of accessibility as the original.
  5. **Bottom line** (a few sentences): which parts of the original I can safely repeat to friends, and which I should stop repeating.
reasoning: |-
  Okay, the user is asking me to audit a summary they read about the extended mind thesis by Clark and Chalmers. They found the Otto example compelling but felt uneasy about how the article presented the broader implications and criticisms. They want me to evaluate the summary's fairness and provide a detailed analysis.

  First, I need to recall the extended mind thesis properly. Clark and Chalmers argued that cognitive processes can extend beyond the brain into the environment under specific conditions. Their famous Otto example shows that his notebook functions as his memory because he uses it reliably, accesses it easily, and automatically endorses its contents. The key point is the "parity principle": if something functions as part of a cognitive process in the same way an internal process would, it should be considered part of the mind. 

  Looking at the user's summary, I notice several issues. The claim that "whatever a person relies on to think becomes part of their mind" is too broad. The original thesis has specific criteria: reliability, accessibility, and trust. The summary overlooks these, making it seem like any tool we use counts as an extension, which isn't accurate. The smartphone comparison is misleading because not all smartphone use meets those strict conditions. 

  The article also misstates that Otto's belief is "on the page." Actually, the notebook is a vehicle for his dispositional belief. The belief emerges from Otto's reliable interaction with the notebook, not the page itself. Equating Clark and Chalmers with Putnam and Burge oversimplifies things. While both involve externalism, Putnam and Burge focus on meaning and social context, whereas extended mind is about cognitive processes and tools. 

  The criticism about confusing causation with constitution is valid but not a knockout punch. Defenders argue that constitution requires functional equivalence and integration, not just dependence. The article presents this as settled, but the debate is ongoing with nuanced defenses. Claiming the thesis is "sunk" is an overstatement since it's still influential in philosophy and cognitive science. 

  For the corrected version, I should emphasize the specific conditions of the parity principle and clarify that the notebook is part of Otto's cognitive system, not that the belief is literally on the page. The smartphone example needs caveats about meeting reliability and trust criteria. The criticism should be presented as part of an active debate, not a refutation. 

  The user might be concerned about how technology affects our minds and wants an accurate understanding to discuss responsibly. They might also seek clarity to alleviate their unease about the original article's implications. I'll make sure to highlight which parts of the original summary are safe to share and which need correction so they can confidently discuss this with others.
answer: |-
  Here's a detailed audit of the summary, following your requested structure:

  **1. First Impressions**  
  The summary captures the core idea and Otto example accurately but becomes increasingly misleading. It oversimplifies the criteria for cognitive extension, overstates the smartphone/cloud conclusion, misrepresents the "belief on the page" claim, and incorrectly presents the causal-constitution objection as a settled refutation. The "sunk the thesis" claim is particularly inaccurate. Approach the latter half with caution.

  **2. Sentence-by-Sentence Audit**  

  *   **"Clark and Chalmers argued that the mind does not stop at the skin: whatever a person relies on to think becomes part of their mind."**  
      *   **Fair:** Correctly states the core thesis that cognition can extend beyond the body/skin.
      *   **Misrepresentation:** The phrase "whatever a person relies on to think" is *far too broad* and ignores the specific, strict criteria Clark & Chalmers impose (reliability, accessibility, automatic endorsement). Not all reliance equals cognitive extension.

  *   **"Their famous example involves Otto... the notebook is literally a part of Otto's mind..."**  
      *   **Fair:** Accurately presents the Otto/Inga comparison and the core claim that the notebook *is* part of Otto's mind under the right conditions.
      *   **Needs Nuance:** The "literally" is philosophically loaded, but it reflects Clark & Chalmers' intended radical claim.

  *   **"...his belief that the Museum of Modern Art is on 53rd Street sits on the page rather than in his skull."**  
      *   **Plainly Wrong/Misleading:** This is a crucial misstep. Clark & Chalmers **do not** claim the belief itself "sits on the page." They argue the *notebook* is a *constituent part of the cognitive system* that realizes Otto's dispositional belief state. The belief is not "on the page"; the page is a *reliable, integrated component* Otto uses to manifest the belief-behavior, *functionally equivalent* to Inga's neural memory trace. The vehicle (notebook) is part of the system, not the location of the belief content.

  *   **"This is essentially an update of the old semantic externalism of Putnam and Burge... Clark and Chalmers extend the same insight from meanings to beliefs."**  
      *   **Subtle Misrepresentation:** While Clark & Chalmers acknowledge inspiration from externalism (especially Burge), their thesis is distinct. Putnam/Burge focused on the *content* of mental states depending on external factors (e.g., linguistic community, natural kinds). Clark & Chalmers focus on the *vehicles* and *processes* of cognition extending into the environment. It's a shift from content externalism to *vehicle* or *process* externalism. They aren't just applying Putnam/Burge to beliefs; they are making a different kind of claim about cognitive machinery.

  *   **"The practical upshot is that your mind already includes your smartphone and everything you keep in the cloud, since you depend on them constantly the way Otto depends on his notebook."**  
      *   **Significant Overstatement/Misrepresentation:** This ignores the **stringent conditions** Clark & Chalmers place on the Otto case:  
          1.  **Constant Reliable Availability:** The resource must be as readily accessible as biological memory.
          2.  **Automatic Endorsement:** The information is typically trusted without critical scrutiny, like recalled memory.
          3.  **Past Endorsement:** The content was (typically) consciously endorsed before being stored.
      *   While *some* smartphone/cloud uses *might* meet these criteria (e.g., a deeply integrated, trusted digital notebook used habitually), *most* general usage (quick googling, checking apps intermittently, referencing cloud docs requiring conscious verification) **does not**. The summary falsely implies *any* dependence qualifies, which Clark & Chalmers explicitly reject.

  **3. The Critic's Objection**  

  *   **The Objection Stated:** The objection ("this confuses causal dependence with constitution... my mind extends into my calculator... entire economy... sunk the thesis") is a real and serious critique, often called the "coupling-constitution fallacy" (Adams & Aizawa). Critics argue that tools *causally influence* cognition but are not *constitutive parts* of the cognitive system itself. They claim extending "mind" this way leads to absurdity (mind = calculator/phone network/economy) by losing any principled boundary.

  *   **Defender's Response & Debate Status:**  
      *   **Defense:** Clark & Chalmers and proponents argue their strict criteria (reliability, accessibility, automatic endorsement, functional equivalence) *precisely* avoid this fallacy by defining what constitutes *functional integration* into the cognitive system, not mere causal dependence. Otto's notebook isn't just a tool; it's a functionally equivalent, seamlessly integrated resource meeting the parity principle. They contend critics often ignore or downplay these criteria.
      *   **"Sunk the Thesis"? Absolutely Not:** The claim that this objection "sunk the thesis" and it survives only as a "slogan" is **grossly inaccurate**. The debate is highly active and ongoing. While the causal-constitution objection is a major challenge:
          *   Proponents have developed nuanced responses and refined criteria.
          *   The thesis has sparked significant research in philosophy of mind, cognitive science, and human-computer interaction.
          *   It remains a highly influential and debated position, not a refuted relic. Many philosophers find versions of it plausible. Presenting it as "sunk" misrepresents the current state of the field.

  **4. A Corrected Version**  
  "Clark and Chalmers proposed the 'extended mind' thesis, arguing cognition isn't confined to the brain. They illustrated this with Otto, an Alzheimer's patient who relies on a constantly available, automatically trusted notebook for information, just as others rely on biological memory. Under strict conditions of reliability, accessibility, and automatic endorsement, they argued the notebook becomes a literal part of Otto's cognitive system – functionally equivalent to neural memory – realizing his dispositional beliefs. While inspired by semantic externalism (Putnam, Burge), their focus was on external *vehicles* and *processes* of cognition. This suggests *some* deeply integrated technologies (like Otto's notebook) might extend our minds, but general smartphone/cloud dependence often lacks the required automaticity and trust. Critics argue this confuses tools that *cause* thinking with things that *constitute* the mind, risking absurdity. While this 'causal-constitution' objection is a major challenge, the thesis remains a vibrant and contested area of philosophy, not a refuted idea."

  **5. Bottom Line**  
  **Safe to Repeat:**  
  *   The core idea: Clark & Chalmers argue the mind can extend beyond the brain/skin under certain conditions.
  *   The Otto/Inga example and its core point: Under the right conditions, Otto's notebook is part of his mind, just like Inga's memory.
  *   The existence of the causal-constitution objection (calculator/network/economy reductio).

  **Stop Repeating / Qualify Heavily:**  
  *   "Whatever a person relies on to think becomes part of their mind." (False - it requires specific stringent criteria).
  *   The belief is "on the page." (Misleading - the *notebook* is part of the cognitive *system* realizing the belief state).
  *   The smartphone/cloud is *automatically* part of your extended mind. (Only *possibly* true for *very specific, deeply integrated uses* meeting the criteria).
  *   Their view is just an "update" or "extension" of Putnam/Burge. (Oversimplifies - different focus on vehicles/processes).
  *   The causal-constitution objection "sunk the thesis." (Completely inaccurate - it's a major challenge in an ongoing, active debate).
