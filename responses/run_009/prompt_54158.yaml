prompt: |-
  At my company (mid-size, we build developer tooling) we changed how we hire a few years back, and something about it has been bugging me. It used to be unstructured chats: someone senior would talk to a candidate for an hour and go yeah, sharp guy, good energy, hell fit in, and that was bascially it. Now it's a fixed script — everyone gets the same questions and exercises, scored against anchored rubrics, and we deliberately shuffle who meets whom, because we noticed the individual interviewers' gut read on a candidate predicted almost nothing about how they actually did the job once here.

  But then look at everything else we do. People still get let go for "bad attitude" or "not a culture fit", and the writeups talk like there's a stable thing called his character that came out. Promotions go to people managers describe as having grit or being self-driven. Every offsite we run some strengths-finder workshop that assumes people have durable traits you can coach around.

  So here's my question: what view of people do each of these practices presuppose? Does the hiring side quietly assume the behaviour-is-mostly-situational crowd are right — that there's no reliable character to read off an interview, so we control the situation instead of trying to spot virtue? And if that's the presupposition, is it actually consistent with still firing and promoting on character grounds, or is one half of how we run the company just philosophically confused? Please take a definite position — tell me which practice is wrong and what it would have to change if we took the presupposed view seriously. Don't give me a menu of "it depends which theory you prefer", I'd rather flat-out disagree with you than have to pick. Keep it under 350 words, firm limit, and don't hedge in the last paragraph either.
reasoning: |-
  Okay, the user is grappling with a contradiction in their company's HR practices. They've moved to structured hiring that ignores "gut feelings" because data showed interviewer impressions didn't predict job performance. Yet they still fire/promote based on vague character traits like "grit" or "culture fit." 

  Hmm, this is fundamentally about the person-situation debate in psychology. The structured hiring process clearly aligns with situationist theory - behavior is context-dependent, so they standardize interviews to remove bias. But their other practices assume trait theory - that people have stable inner qualities you can assess. 

  The cognitive dissonance here is glaring. If situations determine behavior (as hiring data proves), then firing someone for "bad attitude" without examining workplace triggers is absurd. Likewise, promoting for "grit" ignores whether the environment enables persistence. 

  The user wants a firm stance, no hedging. Right - the firing/promotion system is scientifically bankrupt and must change. To be consistent: 
  - Replace "culture fit" firings with documented performance issues linked to controllable factors 
  - Define promotions using situation-specific behaviors (e.g. "navigated X crisis by doing Y") not vague traits 
  - Kill strengths-finder workshops - they reinforce the trait myth 

  The real urgency? Trait-based decisions are discrimination vectors. "Bad attitude" is often just "different from me." Structured hiring reduced bias; now they need to finish the job.
answer: |-
  Your promotion/firing system is philosophically confused and empirically wrong, while your hiring process correctly embraces situationism. The data-driven hiring shift acknowledges that behavior is highly context-dependent: there's no stable "character" reliably revealed in artificial interview scenarios. You control the situational variables (questions, scorers) because gut instincts about virtues are useless predictors.

  Yet firing for "bad attitude" or promoting "grit" assumes precisely what your hiring data disproves: that people possess fixed, cross-situational traits. This contradiction is indefensible. If situations dominate behavior, then "attitude" failures reflect environment, role-fit, or leadership flaws—not immutable character. Promoting "self-driven" grit ignores whether systems enable persistence.

  **Your firing/promotion practices must change to align with situationist hiring:**  
  - Replace "culture fit" or "attitude" firings with **documented, repeated performance deficits** tied to specific job requirements.  
  - Base promotions on **demonstrated impact in comparable contexts** (e.g., "Led X project through scope change by securing stakeholder buy-in"), not trait adjectives.  
  - Scrap strengths-finder workshops. Replace them with **systems-focused retrospectives** (e.g., "What processes helped/hindered resilience in Q3?").  

  Continuing trait-based people decisions undermines your hiring rigor and perpetuates bias. Fix the inconsistency.
