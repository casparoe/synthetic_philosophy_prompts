  Their strongest point is definitely the functional disorders comparison. My best counter is to stress that all medical conditions, even idiopathic ones, are studied as biological processes - whereas psychiatry medicalizes the human condition itself. I'll end by pushing them to define disease boundaries - if depression counts, why not heartbreak? That should force them to show their biomedical model's limits.
answer: |-
  *(Leaning forward, eyes sharp)*  
  You mistake my argument entirely. Type 2 diabetes and hypertension *are* bodily dysfunctions—measurable deviations in physiology like insulin resistance or elevated arterial pressure, anchored in the objective machinery of the organism. Psychosis and melancholia, however, manifest as *lived experience* and *conduct judged deviant*. Where is the *biological* dysfunction in hearing voices or despair? You conflate correlation with ontology: even if neuroscience maps brain states to sadness, the "disorder" label is imposed on *meaning*—on whether sadness fits social expectations. Calling grief "pathological" after two weeks, as DSM does, exposes this: you medicalize the human condition itself. Medicine treats bodies; psychiatry polices selves. If functional deviation suffices for disease, is a political dissident’s "delusion" of state corruption a mental illness when the state deems it maladaptive? Where do *you* draw the line between disease and difference?  

