  Writing a paper bit on Bentham and wanted your take. Everyone knows his basic line on sexual morality -- the never-published-in-his-lifetime essay arguing that sex between men shouldn't be punished because it produces no real net harm, and his general view that the criminal law should only reach conduct that hurts others. But I'm curious how that framework would stretch to stuff he obviously never encountered. Say he somehow saw: (1) AI companion apps and sex robots, (2) the so-called Nordic model for prostitution (criminalizing buyers but not sellers), and (3) leaked intimate images / revenge porn, where the "harm" depends so much on privacy expectations and social meaning that existed nowhere in his world. My hunch is his hedonic calculus handles #1 and #3 fine but gets genuinely strained by #2, since it forces him to weigh diffuse antiscepticism-style harms to public morals against the welfare of the sellers themselves -- but I could have it backwards. Where would he land, and where is the framework doing real work vs. just being projected onto him? Please flag what's actually grounded in things he wrote (roughly, no need for exact citations) vs. speculation. Answer in American English please.
