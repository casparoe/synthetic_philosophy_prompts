prompt: |-
  you've probably seen this one play out a hundred times on lesswrong and in the surrounding blogosphere, but I want your read on why it never goes anywhere. The debate is epistemic akrasia: believing p while also believing that your evidence doesn't support p, or doesn't support it as strongly as you believe it. The mainstream philosophy position, going back to Feldman and Christensen, is that this is somehow uniquely bad, the epistemic equivalent of knowingly contradicting yourself -- not just having a false belief but having a fractured one. Then a few years ago Sophie Horowitz came along and argued that akrasia can be perfectly reasonable: someone who is, as a matter of fact, excellent at getting things right but terrible at tracking how good her evidence is should trust her conclusions over her self-assessment. And the rationalist-adjacent version of the same fight shows up constantly: "should I trust my inside view over the outside view," "should I trust my math over my intuition when they conflict," "should I discount my own judgment because I know I'm biased," and the perennial "if you know you're not calibrated, shouldn't you adjust for that, and doesn't adjusting-for-that also use the same uncalibrated brain." I've watched this specific exchange -- one side says akrasia is incoherent, the other says no, it's just using your best info about your own reliability -- go in circles for what feels like a decade, with everyone from graduate students to very smart hobbyists, and nobody ever moves.

  My working theory, and I want you to actually evaluate this rather than just nod along, is that the two sides are answering different questions under one label. One side is talking about what a perfectly rational agent does at an instant: at the moment of belief, if your evidence says .4, believing at .4 is just what it is to believe on your evidence, and believing at .7 is by definition a malfunction. The other side is talking about agents with a history -- agents whose faculties have a track record, whose self-models can be more or less accurate, and for whom "overriding the meta-level verdict" can be the policy that has always worked, like the person who knows she underestimates herself. If that's right, the disagreement is partly verbal, but not entirely verbal, because lurking underneath there seems to be a real question about whether epistemic rationality is even the kind of thing that can be assessed at an instant, or whether it's necessarily a property of procedures and dispositions. That part doesn't feel verbal to me, but I can't tell whether it's substantive in the way that could in principle be settled, or in the way where it's just everyone's bedrock intuition about what "reasons for belief" are made of.

  So: you're a professional epistemologist who also spends too much time reading internet arguments. Think carefully before answering, maybe sketch the candidate diagnoses first (verbal dispute, different questions, hidden normative bedrock, ill-posed question) and then tell me which actually fits this fight, using what each side concretely says. And be honest about what would count as progress here -- a distinction someone could state cleanly, a hypothetical case both sides would have to pronounce on, or nothing, and if nothing, why. I'd rather hear "this one is genuinely stuck and here's the structural reason" than a fake resolution, I get enough of those in the comment threads.
reasoning: |-
  Okay, let me start by unpacking this user's query. They're frustrated with the endless debate around epistemic akrasia, where one side argues it's inherently irrational while the other sees it as sometimes reasonable. The user's theory is that the two sides are answering different questions: one about instant rationality and the other about agents with histories. They want me to evaluate this and figure out why the debate never resolves.

  First, I need to recall the key positions. Feldman and Christensen represent the traditional view that akrasia is like a contradiction—believing something while admitting your evidence doesn't support it. Horowitz counters that sometimes, due to reliability, trusting your first-order belief over your self-assessment makes sense. Rationalist discussions mirror this with inside vs. outside views and calibration issues.

  The user's hypothesis is that the dispute is partly verbal. The "incoherence" camp focuses on synchronic rationality—what's rational at a single moment. The "reasonable" camp is diachronic, considering track records and reliability over time. If that's the case, the real disagreement might be about whether rationality is synchronic or diachronic.

  I should check if both sides actually talk past each other. When Feldman says akrasia is bad, he's thinking of an agent at a specific time with given evidence. Horowitz's examples involve agents with known biases or past performance. So yes, different contexts. But it's not just verbal because the underlying question is about the nature of rationality itself. Is it about current evidence alone, or can past reliability influence what's rational now?

  Next, the user mentions hidden normative bedrocks. The synchronic view might stem from deontological ethics—duties to evidence. Diachronic could be consequentialist, focusing on truth outcomes. These are deep intuitions hard to reconcile. Also, the concept of "evidence" itself is contested. Is it only current inputs, or does track record count as evidence too?

  The user asks what would count as progress. A clean distinction might help, but the core conflict might remain. Hypotheticals could force sides to confront inconsistencies. For example, if someone always underestimates their abilities, should they ignore their self-doubt? Both sides might agree here, revealing shared ground. But in cases where evidence is clear but self-model is negative, they might still disagree, showing the bedrock divide.

  Structural reasons for the deadlock: different priorities (coherence vs. reliability) and time frames. Progress might need reframing the debate away from "akrasia" to "when to trust self-assessments." Maybe accept that rationality has both synchronic and diachronic elements, depending on context. But the user wants honesty, so admitting that the debate might not resolve due to fundamental differences is necessary.
answer: |-
  You've nailed the core frustration, and your diagnosis is both insightful and *mostly* correct. Let's break it down step-by-step, evaluating your theory against the arguments, identifying the deeper fissure, and assessing the prospects for progress.

  **Candidate Diagnoses Evaluated:**

  1.  **Purely Verbal Dispute?** (No, but partly) The term "epistemic akrasia" *is* used slightly differently. The Feldman/Christensen camp defines it narrowly: *at a single moment t*, believing P while simultaneously believing that one's *current total evidence at t* does not support P (or supports it less strongly). Horowitz/Rationalists often use "akrasia" more broadly, encompassing situations where one believes P *despite believing that one's general cognitive processes or self-assessment abilities are unreliable* regarding P or this domain. This broader use smuggles in historical/track-record information the narrow definition excludes. However, this isn't *just* semantics; the underlying disagreement persists even if definitions are clarified.

  2.  **Answering Different Questions?** (Yes, Crucially) This is your core insight, and it's **largely correct**. This is the primary engine of the stalemate.
      *   **Synchronic Coherence (Feldman/Christensen):** Their question is: **"What does perfect coherence with one's *current, possessed evidence* demand *at this instant*?"** They operate within a "snapshot" model of rationality. Evidence is a *state* at time t. Rationality requires that your doxastic attitude (belief strength) perfectly mirrors the support relation dictated *by that evidence state*. Believing P more strongly than your current evidence warrants *is*, by their definition, a failure of coherence *within that snapshot*. It's akin to asserting "P is likely true given E, but E doesn't make P likely" – a performative contradiction *at that moment*. They see this as a *constitutive* requirement of rationality itself.
      *   **Diachronic Reliability/Pragmatics (Horowitz/Rationalists):** Their question is: **"What policy or disposition, given my *known cognitive flaws and historical performance*, is most likely to lead me to true beliefs in this situation *over time*?"** They operate within a "process" model of rationality. Evidence includes *knowledge about the reliability of one's own cognitive processes* (e.g., "I'm terrible at evaluating my own evidence," "My gut is usually right here"). Rationality is about deploying the *best overall truth-tracking strategy*, which might sometimes mean *overriding* the verdict your meta-cognitive assessment *would generate based solely on the first-order evidence snapshot*, precisely *because* you know that assessment process is flawed. The "fracture" is seen as a *feature*, not a bug, of a system using its best available tools.

  3.  **Hidden Normative Bedrock?** (Yes, Profoundly) This is where the "not entirely verbal" part bites hard. Underlying the different questions are **fundamentally different conceptions of what epistemic rationality *is* and what "evidence" fundamentally *is***:
      *   **Synchronic View:** Rooted in a deontological/internalist intuition: Rationality is primarily about *doxastic oughts* stemming from your current mental state/evidence access. It's about *justification* defined by *current* internal coherence. "Evidence" is the *current* information bearing on P.
      *   **Diachronic View:** Rooted in a consequentialist/reliabilist/externalist intuition: Rationality is primarily about *effectively achieving true belief*. It's about *reliability* and *instrumental effectiveness*. "Evidence" includes *all* information relevant to forming a true belief *about P*, which *includes* meta-information about the reliability of the cognitive faculties processing the first-order evidence. Ignoring known flaws in your assessment process is seen as *irrationally handicapping yourself*.
      *   **The "Evidence" Schism:** This is critical. For the Synchronic camp, the meta-information about your own unreliability *is part of the current evidence relevant to the belief "My evidence supports P to degree D"*. Believing P at strength S while believing your evidence only supports D (S > D) *is* the contradictory state. For the Diachronic camp, the meta-information is *evidence relevant directly to P itself*, or at least a reason to *discount the output of the meta-cognitive faculty*. They see the Synchronic demand as *forcing* you to trust a faculty you *know* is unreliable, which is itself irrational on the reliability conception. This is the "bedrock" clash: **Is known unreliability in evidence-assessment part of the evidence *for the meta-belief*, or is it a defeater *for the meta-faculty itself*, justifying overriding its output?**

  4.  **Ill-Posed Question?** (Partly) Asking "Is epistemic akrasia *always* irrational?" might be ill-posed because the answer depends entirely on which conception of rationality you adopt *first*. Neither side can "prove" their foundational intuition is correct within the framework the other uses.

  **Why the Fight Never Moves (The Structural Stalemate):**

  1.  **Talking Past Each Other:** Synchronic proponents point to the undeniable *logical tension* in the snapshot. Diachronic proponents point to undeniable *practical failures* (e.g., the person who *always* second-guesses their accurate gut instinct into error). Each side sees the other as missing the point entirely.
  2.  **Foundational Intuition Pump:** Arguments often devolve into intuition pumps favoring one side:
      *   Synchronic: "Imagine a perfectly rational agent *at this instant* with *this* evidence. Could they coherently believe P and also believe their evidence doesn't support P?" (Answer feels like "No").
      *   Diachronic: "Imagine a real human who *knows* they systematically misjudge evidence strength in domain X. Should they *really* always trust their flawed self-assessment over their (reliable) first-order judgment?" (Answer feels like "No").
      *   Neither pump addresses the *other* conception effectively.
  3.  **The Calibration Tautology Trap:** The rationalist "calibration adjustment" loop ("If I'm uncalibrated, I should adjust, but the adjustment uses the same brain") is often presented as a killer argument. However, the Synchronic camp sees this as *precisely* demonstrating the akratic incoherence *within the attempt* – the adjustment belief itself becomes akratic. The Diachronic camp sees it as a practical engineering problem potentially solvable by heuristics ("trust the math, not the feeling about the math"), not a refutation of overriding flawed meta-cognition.
  4.  **No Neutral Ground:** There's no higher-level, shared definition of "rationality" or "evidence" that both sides accept to adjudicate the dispute. Appeals to truth-conduciveness beg the question against the Synchronic view's internalist commitments. Appeals to internal coherence beg the question against the Diachronic view's externalist commitments.

  **What Counts as Progress? (Honest Assessment):**

  Genuine resolution on the *foundational* issue is unlikely. However, progress *is* possible in clarifying the debate and finding practical compromises:

  1.  **Explicitly Distinguishing Synchronic & Diachronic Rationality:** The single biggest step forward would be widespread adoption of this distinction when discussing "akrasia." Framing it as "Synchronic coherence forbids akrasia, but diachronic rationality can sometimes require overriding your synchronic meta-assessment" is clearer than debating "akrasia is (ir)rational." This cleanly separates the questions.
  2.  **Hypotheticals Targeting the Bedrock:** Crafting cases *both sides must address* can expose the core disagreement starkly:
      *   **Case 1 (Synchronic Pressure):** Agent receives clearly ambiguous evidence E for P. Due to a *known, temporary* cognitive glitch (e.g., drug side-effect), they *feel* extremely confident P is true (strength 0.9). Their *assessment* of E (despite the glitch) correctly tells them E only supports P at 0.5. Should they believe P at 0.9 (feeling), 0.5 (meta-assessment), or something else? *Synchronic:* Must believe ~0.5 to be coherent. *Diachronic:* The *known glitch* is evidence the feeling is unreliable; trusting the meta-assessment is likely more reliable *here*.
      *   **Case 2 (Diachronic Pressure):** Agent has a *decade-long, meticulously documented track record*: In domain D, their first-order intuitive judgments are 90% accurate, while their explicit assessments of their own evidence strength are wildly miscalibrated and only 60% accurate at predicting truth. They encounter a new case in D. They intuitively feel strongly P is true. Their explicit assessment of the evidence concludes the evidence is weak/ambiguous. What should they believe? *Synchronic:* Must align belief strength with their *current* evidence assessment, even knowing it's unreliable. *Diachronic:* Clearly should trust the intuition over the flawed self-assessment, as the track record *is* relevant evidence.
      *   **The Revealing Point:** In Case 1, Diachronic might *agree* with Synchronic. In Case 2, Synchronic might *wince* but hold the line. The *disagreement* becomes clearest in cases where the meta-unreliability is *general* but the *current* meta-assessment *feels* compelling, forcing Synchronic to bite the bullet on trusting known unreliability, and Diachronic to embrace the fracture.
  3.  **Shifting Focus to "When to Trust Meta-Cognition":** Abandoning the loaded term "akrasia" and focusing on the practical question: "Under what conditions is it rational to *discount or override* the output of one's own meta-cognitive assessment of first-order evidence?" This frames it within the Diachronic view's strength but allows Synchronic proponents to argue the answer is "Never, because it creates incoherence," making their foundational commitment clear.
  4.  **Acknowledging the Stalemate's Root:** Explicitly recognizing that the deadlock stems from incompatible, fundamental intuitions about the nature of epistemic rationality itself (coherence vs. reliability; internalist vs. externalist). Progress involves mapping the landscape clearly, not converting the other side.

  **Conclusion:**

  Your diagnosis is astute: **The primary reason the debate spins its wheels is that the two sides are indeed answering fundamentally different questions rooted in incompatible conceptions of epistemic rationality (Synchronic Coherence vs. Diachronic Reliability) and the nature of evidence.** The "verbal" aspect exists but is secondary. The "hidden normative bedrock" – the clash between internalist/coherence and externalist/reliabilist intuitions about justification – is the true, structural source of the deadlock. It's substantive but likely *irresolvable* at the fundamental level because it reflects a deep schism in epistemology itself.

  **Honest Progress Assessment:** We won't get universal agreement that "akrasia is sometimes rational" or that "it's always incoherent." *Real progress* looks like:
  1.  **Widespread adoption of the Synchronic/Diachronic distinction** to clarify *which* question is being asked.
  2.  **Developing nuanced frameworks** for *when* overriding meta-cognition is warranted under a Diachronic view (e.g., strength of track record, specificity of the flaw, stakes).
  3.  **Clearer articulation of the costs:** Synchronic views must grapple with the cost of *knowingly* trusting unreliable faculties in the snapshot. Diachronic views must grapple with the inherent instability and potential for motivated reasoning in overriding meta-cognition.
  4.  **Accepting the bedrock split** and focusing on the practical implications within each framework.

  The fight persists because each side correctly identifies a genuine tension or failure mode within *their opponent's framework*, but neither can address it without begging the question against the other's deepest commitments. The path forward isn't resolution, but clearer cartography.
