  For norm erosion: "Your individual compliance prevents civilizational collapse." Too dramatic? Refine to: "Non-compliance in deserted areas remains prohibited as it incrementally weakens collective compliance." 
  Tipping paradox: "Treat gratuities as both voluntary expressions and compulsory obligations." Perfect - captures the inherent contradiction. 

  *Consistency check*: The IOCC can't acknowledge arbitrariness, so phrasing must imply natural moral weight. "Adopt practices identical to lifelong residents" dodges epistemology issues by assuming perfect discernment. "Coordinate expectations" smuggles in Lewis without naming him. 

  *Final selection*: 
  1. Attacks arbitrariness by demanding adoption of practices "regardless of their rationale" 
  2. Handles epistemology by requiring "indistinguishable" behavior 
  3. Geographic morality via "immediately upon crossing" 
  4. Tipping paradox with "voluntary in principle, compulsory in practice" 
  5. Norm erosion extremism via "collective expectation" responsibility 

  Each commandment stays within doctrine while stretching it to breaking point. The pamphlet never admits it's satire - the humor leaks from the logical tension. A philosopher should nod at the accurate rendering of convention absolutism's implications.
answer: |-
  **INTERNATIONAL OFFICE FOR CONVENTION COMPLIANCE (IOCC)  
  CERTIFIED MORALLY COMPLIANT TOURIST CODE**

  1.  Adopt all local practices immediately upon crossing the border, regardless of their origin or rationale, as if they were your lifelong customs.
  2.  Behave in a manner indistinguishable from lifelong residents, even when unable to discern whether a practice resolves a genuine coordination problem or is merely customary; assume all observable behaviors carry equal moral weight.
  3.  Treat gratuities precisely as defined locally: understand they are voluntary in principle but compulsory in practice, and any deviation undermines essential service-sector coordination.
  4.  Coordinate your expectations and actions perfectly with local conventions at all times, recognizing that even minor, harmless-seeming deviations incrementally erode the foundational coordination expectations of the society you are visiting.
  5.  Uphold every norm, including those governing deserted streets at night, as your personal duty to sustain the entire structure of civil coordination; non-compliance, however isolated, weakens the collective expectation of universal adherence.
