  I need to carefully examine whether the lexical approach actually avoids infinite problems. A critical point is how it handles worlds with unbounded-below suffering where no "worst" suffering exists. If the asymmetrist's method fails here, that must be stated in terms he would accept. I also need to explore whether his lexical ordering is essentially an ordering-dependent aggregation in disguise.

