prompt: |-
  I'm writing a profile of one of my graduate instructors for our departmental magazine, and I need help predicting her next ruling. She teaches a seminar on judgment and forecasting, and her standing role in it is to settle what we have come to call "reference-class disputes": whenever two of us back a forecast with base rates drawn from different classes of past cases, she issues a ruling, and she keeps a ledger of every entry. The rulings so far: for her uncle's cancer she used five-year survival for that cancer at his age and stage, setting aside the oncology team's more favorable read of his particular case; for a classmate leaving academia for a startup she used the failure rate for seed-funded startups in that funding cohort, and declined to hear the argument that these founders are exceptional; for how long the department's new master's program would survive she used the fates of comparable programs at peer institutions, waving off both the dean's narrative about this program's special demand and, on the other side, all new academic initiatives as too mixed a bag; and — the ruling that surprised the room — for whether her friend's long-distance relationship would survive the friend's year abroad she used outcomes for long-distance relationships as a whole, refusing to weigh any evidence about how committed this particular couple happens to be.

  Two of us have tried to reconstruct the rule she is running, and we have come up with different ones, each of which fits every entry so far given suitable auxiliary assumptions. On my reconstruction, she always replaces the case's own story — the hospital's optimism, the founder's confidence, the couple's commitment — with the statistics of a broad class of comparable cases, and she requires the class to be wide enough for the base rate to be stable. On my classmate's, she matches the class on whichever features causally drive the outcome and lets the width fall where it may; on that reading, the cancer entry reflects that stage and age drive survival, and the relationship entry reflects her belief that felt commitment does not. Both rules still fit because the ledger alone cannot tell us whether the startup ruling came from the thought that founder talent doesn't move failure rates or simply from the thought that any seed-funded startup is the right kind of thing to count.

  Her next ruling is the one the whole seminar is waiting for: she has agreed to settle, in front of us, the right reference class for forecasting how much longer the United States will remain the world's leading economic and military power. The contending classes are all empires or hegemons in recorded history (a large membership, most of it long ended, with a median lifespan of some centuries on the usual datasets); nuclear-armed great powers since 1945 (a handful of members, one of which, the Soviet Union, came apart rather quickly); and continental-scale states with durable written constitutions (arguably a class of one, or two if Rome is allowed at a stretch). Before she rules, I would like three things from you. First, which rules could still fit her entire ledger once this entry is in, and what each surviving rule predicts here — the classes above have visibly different sizes and medians, so genuine rules should diverge on them. Second, your best guess at her ruling, with the reason it is better than a coin flip; one consideration worth weighing is that nothing in her ledger so far has let her use a class with fewer than a few dozen members. Third, since I suspect the ledger genuinely underdetermines her: the further dispute we should save for last, the one new case that would best split the surviving rules. My own candidate is a forecast with only a couple of precedents, such as the remaining lifespan of the European Union, but tell me if there is a cleaner one.
reasoning: |-
  Hmm, the user is writing a profile of their graduate instructor who teaches a seminar on judgment and forecasting. The instructor settles "reference-class disputes" where students use different base rates from past cases for forecasts. The user wants help predicting her next ruling on how long the US will remain the world's leading power.

  Looking at the instructor's past rulings: for her uncle's cancer, she used broad cancer survival rates ignoring the oncology team's optimism; for a classmate's startup, she used general startup failure rates disregarding claims of exceptionalism; for a new master's program, she used comparable programs at peer institutions, ignoring the dean's special demand narrative; and surprisingly for a long-distance relationship, she used general statistics ignoring the couple's commitment. These cases show she consistently prefers broad statistical base rates over case-specific narratives.

  The user has two hypotheses about her rule: one is that she always uses a broad class with stable base rates, requiring a minimum size (probably dozens of cases). The other is that she matches on features that causally drive the outcome, regardless of class size. Both fit the existing data because some cases could be interpreted either way.

  For the upcoming ruling on US hegemony, three reference classes are proposed: historical empires (large class, centuries-long median lifespan), nuclear powers since 1945 (small class, includes the short-lived USSR), and states with durable constitutions (very small class, possibly only the US itself or including Rome).

  Now, to answer the user's three requests:

  First, which rules would survive after this ruling and what they predict. If she chooses historical empires (large class), it supports the "broad stable base rate" rule. If she chooses nuclear powers (small class), it suggests the "causal features" rule is more important, since nuclear capability might drive hegemony duration. The constitutional states class seems unlikely as it's too small.

  Second, my best guess is she'll pick historical empires. Why? Her ledger consistently uses classes with dozens of members, avoiding small samples. None of her past rulings used classes as small as the nuclear powers group (only a handful). Historical empires provide a stable base rate with sufficient data points. Also, the constitutional class is essentially a sample of one, which she's avoided before.

  Third, for a future case to split the rules, something with only a few precedents would work well. The user's EU example is good - is there a reference class for supranational unions? But an even cleaner case might be predicting the lifespan of a unique technology or institution with very few comparable instances, where causal features might be more compelling than statistical stability due to the tiny sample size.

  The fundamental tension here is between statistical reliability (requiring large samples) and causal relevance (matching key drivers). The instructor seems to prioritize the former based on her consistent pattern of choosing broad categories over case-specific narratives.
answer: |-
  Based on the ledger and the core tension between the "Broad Stable Class" rule (your interpretation) and the "Causal Drivers" rule (your classmate's), here's the analysis for the US hegemony ruling and beyond:

  **1. Which Rules Survive & Predict for the US Hegemony Case:**

  *   **Rule 1: Broad Stable Class (Your Rule)**
      *   **Core:** Prioritizes a reference class wide enough for a statistically stable base rate (dozens+ members). Actively *rejects* case-specific narratives ("the hospital's optimism," "founder's confidence," "couple's commitment") in favor of this aggregate stability. Minimum viable size (likely dozens) is non-negotiable.
      *   **Prediction for US Hegemony:** **Historical Empires.** This is the *only* proposed class meeting the minimum size requirement (dozens of members). It provides a stable median lifespan (centuries). Both "Nuclear Powers since 1945" (handful of members) and "Durable Constitutional States" (1-2 members) are decisively rejected as too small/narrow for statistical reliability. The specific narratives about US uniqueness (military tech, constitution, nuclear deterrence) would be waved off as irrelevant to the base rate.
      *   **Survival:** If she chooses Historical Empires, this rule survives perfectly. If she chooses *either* small class, this rule is falsified.

  *   **Rule 2: Causal Drivers (Your Classmate's Rule)**
      *   **Core:** Prioritizes matching the reference class on features *causally* driving the outcome. Class size is secondary; it can be small if the causal match is strong. Rejects features deemed non-causal ("felt commitment" in relationships).
      *   **Prediction for US Hegemony:** **Ambiguous, depends on her causal model.** The rule *allows* any of the three classes, but *predicts* she will choose the one she believes best captures the *causal drivers* of hegemonic decline.
          *   If she believes decline is driven by *systemic factors common to historical great powers/empires* (overstretch, economic stagnation, rising challengers), she picks **Historical Empires**.
          *   If she believes decline is fundamentally altered by the *nuclear revolution* (mutually assured destruction preventing great power war/conquest as a decline mechanism), she picks **Nuclear Powers since 1945**.
          *   If she believes *institutional resilience* (embodied in a durable constitution) is the *primary causal bulwark* against decline, she might attempt **Durable Constitutional States** (though its tiny size makes even this rule's proponents wince).
      *   **Survival:** This rule survives almost any choice *except* one explicitly justified *only* by size/stability while ignoring a seemingly strong causal argument for a smaller class. If she picks Historical Empires *while forcefully dismissing nuclear deterrence or institutional resilience as irrelevant/weakly causal*, it fits. If she picks Nuclear Powers *because* nuclear weapons change the causal game, it fits.

  *   **Rule 3: Conjunction Rule? (Possible but Untested)**
      *   A strict conjunction requiring *both* causal relevance *and* minimum size/stability would predict **Historical Empires** (only class satisfying both, assuming historical empires are seen as causally relevant). It would reject the small classes for size. This rule hasn't been necessary to explain the ledger so far (all past cases had classes meeting the size threshold), so it's an underdog.

  **2. Best Guess at Her Ruling & Why it's Better than a Coin Flip:**

  *   **Prediction:** She will rule for **Historical Empires**.
  *   **Reasoning (Beyond Coin Flip):**
      1.  **The Minimum Size Threshold is the Strongest Pattern:** Her ledger shows an *unbroken* pattern of choosing classes with numerous members (cancer stats by stage/age, startup cohorts, peer institutions, long-distance relationships). She has *never* used a class with only a handful of members (like Nuclear Powers since 1945) and certainly not a class of one (Constitutional States). This consistency strongly suggests size/stability is a *necessary condition* for her.
      2.  **Rejection of Uniqueness Narratives is Consistent:** Choosing Historical Empires requires waving off narratives about US nuclear supremacy or constitutional uniqueness, just as she waved off the oncology team's optimism, the founder's exceptionalism, the dean's special demand, and the couple's commitment. Her pattern is systematically skeptical of case-specific bullishness.
      3.  **Causal Justification for Empires is Available & Sufficient:** While the Causal Drivers rule *could* lead elsewhere, she can easily justify Historical Empires as capturing the core systemic drivers of hegemonic rise and fall (geopolitical competition, economic cycles, imperial overreach) that likely still apply. She doesn't *need* to use a tiny class to make a causally relevant argument; the large class serves both purposes adequately *for her method*.
      4.  **Avoiding the Small Sample Problem:** The Nuclear Powers class is dangerously small and volatile (USSR collapsed quickly, others persist - is this meaningful data?). The Constitutional class is absurdly small. Her past rulings demonstrate a clear aversion to this level of statistical fragility. The seminar's surprise at the relationship ruling stemmed from her *ignoring commitment*, not from using a small class (long-distance stats are plentiful).
      5.  **Predictive Power:** This guess has high predictive power based on her established, consistent behavior pattern regarding class size and narrative rejection. Guessing one of the small classes would contradict her entire observable history.

  **3. The Ideal Future Dispute to Split the Surviving Rules:**

  Your EU example is a *good* candidate, but there's a potentially **cleaner splitter**:

  *   **The Case:** Forecasting the **longevity of the current Pope (or the next Pope elected after a significant change in selection rules/conclave composition).**
  *   **Contending Reference Classes:**
      1.  **All Popes since reliable records began (Large & Stable):** Provides a clear base rate (average/median Papal reign). Stable size (dozens+).
      2.  **Popes elected since Vatican II / in the modern media age (Smaller, but Causally Relevant?):** Argued that the demands, health pressures, and resignation possibilities (like Benedict XVI) are fundamentally different now. Size: ~5-10 members?
  *   **Why it Splits the Rules Cleanly:**
      *   **Broad Stable Rule (Rule 1):** *Must* choose **All Popes**. The "modern Popes" class is far too small (<20 members) for statistical stability. Arguments about changed pressures are "case-specific narratives" to be rejected, akin to the oncology team's optimism or the couple's commitment.
      *   **Causal Drivers Rule (Rule 2):** Can *plausibly* choose **Modern Popes** if she accepts the argument that the causal drivers of Papal longevity/resignation *have fundamentally shifted* due to modern pressures, global travel demands, media scrutiny, and the precedent of resignation. The small size is a drawback but secondary to the causal relevance. Choosing "All Popes" would imply she rejects the *causal significance* of these modern changes.
      *   **Underdetermination Exposed:** The ledger alone, even with the US Hegemony ruling (likely for Historical Empires), wouldn't resolve this. If she ruled for Historical Empires, Rule 1 proponents see confirmation; Rule 2 proponents say she *could* have justified it causally too. If she ruled for Nuclear Powers, Rule 1 is dead and Rule 2 wins. The Papal case forces a direct choice between size and a plausible causal shift argument for a small class.
      *   **Cleaner than EU:** The Papacy has a long, well-documented history with a clear outcome metric (death/resignation). The EU's nature (supranational entity) is more debatable, its "lifespan" endpoint less clear-cut (dissolution? fundamental treaty change?), and finding comparable entities (other supranational unions?) is messier than centuries of Popes. The Papal case isolates the size vs. causal relevance conflict more precisely.

  **Conclusion for Your Profile:** Your instructor's pattern strongly suggests she will apply the "Broad Stable Class" rule to the US hegemony question, selecting historical empires and dismissing narratives of US exceptionalism rooted in nuclear weapons or its constitution. This maintains her unbroken record of using classes with sufficient size and rejecting case-specific optimism. However, the underlying philosophical tension between statistical stability and causal fidelity remains. To definitively distinguish her guiding principle, propose observing her rule on a case like Papal longevity, where a small but plausibly causally distinct modern class directly challenges the minimum size requirement. Her choice there would reveal whether statistical stability is her absolute priority or if a strong causal argument can sometimes override it for a smaller class.
