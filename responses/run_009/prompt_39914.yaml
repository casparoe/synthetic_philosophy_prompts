answer: |-
  Here's the spec for a minimally viable futarchy system – the core requirements it *must* meet to function as advertised, stripped of hype. I'll flag tensions and end with the "most damaging" take.

  **Core Desiderata for Governance-by-Prediction-Markets (Futarchy):**

  1.  **Requirement: Unambiguous, Legible Metric (Value Proxy)**
      *   **Why:** The entire system hinges on translating societal "value" into a single, measurable number (e.g., GDP, QALYs, sustainability index). The legislature *only* sets this metric.
      *   **Breakage:** If the metric is vague, multi-interpretable, or doesn't actually capture what society values ("Goodhart bait"), the market optimizes for a number, not welfare. Values are smuggled in via metric definition.
      *   **Constraint:** **Hard.** Without this, the "values/facts separation" is illusory. The metric *is* the value statement.
      *   **Tension Partner:** #2 (Robustness).

  2.  **Requirement: Metric Robustness to Strategic Manipulation**
      *   **Why:** Once power flows to whoever moves the metric, immense incentives exist to game it directly (fudging stats, short-term boosts) rather than create real value.
      *   **Breakage:** System collapses into "metric wars." Resources flow to manipulation, not real progress. The market accurately predicts the *gamed* outcome, not the *welfare* outcome.
      *   **Constraint:** **Hard.** Gaming is always cheaper than real improvement at scale. Robustness must be *relative to the power stakes*.
      *   **Tension Partner:** #1 (Alignment). **THIS IS THE CRITICAL TENSION YOU IDENTIFIED.** Perfect alignment often makes a metric easier to game (e.g., targeting GDP via bubbles). Robustness often requires indirect, harder-to-game metrics (e.g., satellite imagery for deforestation) that may misalign from true welfare. High stakes make this tension explosive.

  3.  **Requirement: Liquid, Informed Prediction Markets Under Low Participation**
      *   **Why:** Markets need enough traders with capital and diverse information to price policies accurately. Most citizens won't trade actively; the system relies on "wisdom of the informed few."
      *   **Breakage:** Thin markets lead to wild volatility, manipulation by whales, inaccurate prices reflecting noise or bias, not aggregated wisdom. Decisions based on garbage predictions.
      *   **Constraint:** **Hard-ish.** Liquidity/informedness can be incentivized (e.g., subsidies for early liquidity), but it's a perpetual challenge. Requires a critical mass of financially-motivated, well-informed traders *despite* low public stakes.
      *   **Tension Partner:** #4 (Separation), #7 (Self-Fulfillment).

  4.  **Requirement: Policy Decision Separability & Conditionality**
      *   **Why:** Markets need to price clear, isolated conditional bets: "If Policy Bundle A passes, Metric = X. If Status Quo/Policy Bundle B passes, Metric = Y."
      *   **Breakage:** How do you price "Bundle A" containing 20 policies? What's the counterfactual? Interactions between policies make conditioning impossible. Markets settle on ambiguous or uninterpretable outcomes. Implementation details swamp the signal.
      *   **Constraint:** **Hard.** Real-world policy is interconnected and path-dependent. Defining clean, mutually exclusive, implementable policy bundles with clear counterfactuals is extremely difficult. Forces oversimplification.
      *   **Tension Partner:** All other requirements. Complexity kills conditionality.

  5.  **Requirement: Profit Motive Drives Truth-Seeking Over Preference-Expression**
      *   **Why:** Traders must primarily aim to profit by being *correct* about the metric's outcome under different policies, not by betting to make their preferred policy *win* or express ideological loyalty.
      *   **Breakage:** Markets become preference-polls or lobbying tools, not truth-seeking mechanisms. Prices reflect desired outcomes, not predicted outcomes. Accuracy vanishes.
      *   **Constraint:** **Hard.** Requires mechanisms to disincentivize "expressive" or "policy-influencing" betting (see #7). Relies on traders caring more about money than policy outcomes.
      *   **Tension Partner:** #7 (Self-Fulfillment).

  6.  **Requirement: Enforceable Policy Implementation Fidelity**
      *   **Why:** The policy passed *must* be implemented as specified in the market contract. The outcome *must* be measured against the defined metric accurately.
      *   **Breakage:** If implementation is weak, corrupt, or the metric measurement is flawed, the market's prediction becomes irrelevant. The link between policy choice and outcome is broken.
      *   **Constraint:** **Hard.** Requires a robust, impartial state apparatus to implement and measure – the very thing futarchy seeks to bypass for decision-making! Bootstrapping problem.
      *   **Tension Partner:** #2 (Robustness). Weak implementation is a key gaming vector.

  7.  **Requirement: Insulation from Self-Fulfilling/Defeating Prophecies & Reflexivity**
      *   **Why:** The act of trading (e.g., betting heavily a policy will succeed) must not significantly alter the policy's *actual* chance of success/failure or its *impact* on the metric *independently* of the policy's inherent merits. (This is your key concern).
      *   **Breakage:** Market prices cease to be predictions and become *sources* of reality. E.g., betting a tariff will boost GDP could trigger capital inflows that *temporarily* boost GDP regardless of the tariff's real effects. Traders with policy exposure (e.g., owning affected stocks) bet to move the decision, not predict truthfully.
      *   **Constraint:** **EXTREMELY HARD.** Reflexivity is inherent in social systems. High-stakes prediction markets directly influence expectations and behavior. Separating "prediction" from "influence" is arguably impossible when the stakes are high enough and the outcome is societal.
      *   **Tension Partner:** **#3 (Liquidity/Info), #5 (Profit Motive).** More attention/traders *increases* reflexivity. Profit-seekers exploit reflexive effects.

  **Where Requirements Conflict:**

  *   **#1 (Alignment) vs. #2 (Robustness):** This is the core Goodhart tension you nailed. Perfect proxies are fragile; robust proxies are often misaligned. High stakes worsen it.
  *   **#3 (Liquidity) vs. #7 (Insulation):** More traders/liquidity generally improves price accuracy *in theory*, but massively increases the potential for market activity itself to distort reality (reflexivity).
  *   **#4 (Separability) vs. Reality:** The requirement for cleanly separable policies fundamentally conflicts with the interconnected complexity of real-world governance and social systems.

  **Honest Take on the Most Damaging Requirement:**

  **You're likely more right about Requirement #7 (Insulation from Reflexivity/Self-Fulfilling Prophecies) being the most damaging.**

  *   **Why:** The core *promise* of futarchy is using markets to aggregate dispersed knowledge into accurate *predictions* about policy outcomes. **Requirement #7 questions the very possibility of a "pure" prediction in this context.** When the prediction market itself becomes a major political force and information source, its prices *change* the probabilities they are supposed to reflect. Traders *know this* and act strategically based on it. This isn't a bug; it's a fundamental feature of embedding high-stakes prediction markets into the governance process. Solving this likely requires such severe constraints on the market's size, influence, or connection to policy that it negates the whole point of using powerful markets for decision-making. Metric legibility (#1) is a massive problem, but it *might* be addressable (imperfectly) through careful design. Reflexivity strikes at the heart of the mechanism's basic function.

  **Your friend's concern (#1 - Metric Legibility)** is absolutely critical and probably the *first* major roadblock. **But #7 (Reflexivity)** is the deeper, potentially insurmountable problem that undermines the foundational premise of accurate, apolitical prediction. It makes the market something *other* than a truth-finder.
