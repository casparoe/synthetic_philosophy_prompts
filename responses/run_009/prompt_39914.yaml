  Also, the user wants an honest take on which requirement is most damaging. Their friend thinks metric legibility is the issue, while they worry about self-fulfilling prophecies. I need to assess both. The self-fulfilling prophecy problem seems more fundamental because it undermines the market's truth-seeking ability directly. If traders can influence outcomes through their bets, the market prices become unreliable, breaking the core mechanism.

  I should structure each desideratum with clear sections: Requirement, Why, Breakage, Constraint Type. Then address conflicts, especially between metric alignment and robustness. Also, consider decision separability and market incentives under low participation.

