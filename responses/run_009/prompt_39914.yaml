prompt: |-
  ok so my friend and i spent like three hours last night arguing about futarchy and i want to keep thinking about it but in a less yelling way. his version was basically: you let the market decide policies by betting on conditional outcomes (if we pass this bill, the metric goes up; if we don't, it doesn't), and the legislature only picks the metric and the values, never the policy. he thinks this is obviously the cleanest separation of facts from values ever proposed. i think it's a pile of hidden assumptions dressed up as a design doc, but i couldn't articulate WHAT exactly a system like this has to actually get right before it counts as working, which is what i want from you.

  so write me the desiderata. not a defense or a takedown -- the spec. what does a governance-by-prediction-market scheme have to deliver before we'd hand it anything real? things like: the metric has to be hard to game relative to how much power rides on it, the market has to stay liquid and informed when most people have no stake, decisions have to be separable enough to condition on (what does the market even settle on when a bundle of policies passes together?), somebody has to be able to profit from correct but unpopular beliefs, etc. but do it properly: for each requirement say WHY it's a requirement, what breaks if you drop it, and whether it's a hard constraint or just something a particular enthusiast camp cares about. and crucially -- flag where you think two requirements can't be jointly satisfied, because my actual suspicion from the argument is that "metric captures what we value" and "metric is robust to being gamed by whoever the market just empowered" are in tension once the stakes are high enough that manipulating the metric is cheaper than moving the real thing. like goodhart with extra steps.

  also, if you want, end with a quick honest take on which single requirement does the most damage to the whole idea -- my friend says it's metric-legibility and i say it's what happens when a market's trades change the odds of the very event they're pricing (self-fulfilling stuff, traders with policy exposure betting to move the decision, not to be right). who's more wrong?

  keep it grounded, no reading lists, no citations, i can't look stuff up rn. and typos fine but substance pls -- last time i asked somewhere i got a lecture on the efficient market hypothesis like i hadn't thought of that in hour one of the argument lol
