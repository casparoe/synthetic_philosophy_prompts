  - Overlooking that even good help needs a "cooling off" period before regeneration 

  For the physics case, the procedure should flag pasting unsolved problems as butler-mode. Spanish might pass if they self-generate examples first. The reinsurance debacle would've been caught at step 1 (no pre-attempt) and step 2 (no notes). 

  Final insight: Their anxiety stems from correctly perceiving that skills are atrophying beneath artificial performance. The solution isn't less tool use, but more strategically difficult tool use.
answer: |-
  Here's a concrete decision procedure based on cognitive science and your taxonomy, designed for speed and practicality. It prioritizes **regeneration ability** (can you recreate it?) over **recognition ability** (do you just recognize it?).

  **The 2-Minute "Skill Preservation" Checklist:**
  *(Ask these in order - stop at first "NO" or "NOT SURE")*

  1.  **"Have I genuinely attempted this *myself* first, even if I failed?"** (Skin-in-the-game Test)
      *   *YES:* Sketch, outline, attempt solution, write *something* raw. Proceed.
      *   *NO/Not Sure:* **STOP. Do NOT use AI yet.** Make *any* attempt first (scrawl ideas, try one physics step, write one Spanish sentence).
      *   *Why:* Initial struggle creates mental hooks for later learning (desirable difficulty). Without it, AI input floats away.

  2.  **"Can I clearly name the *specific* thing blocking me *right now*?"** (Pinpoint the Gap)
      *   *YES:* "I get Newton's 2nd Law generally, but I don't know how to isolate tension force in this pulley." / "I understand 'el subjuntivo' but can't recall the trigger phrase for doubt." Proceed.
      *   *NO/Not Sure:* **STOP. Re-read/Re-think.** If you can't name the gap, AI will likely do too much (Butler mode). Figure out *where* you're stuck.

  3.  **"Is the AI acting ONLY as a Tutor, Sparring Partner, or Searchlight for this *specific* gap?"** (Role Enforcement)
      *   *Tutor (OK):* Explains *only the gap* (e.g., "Show me how tension is isolated here," "Explain this reinsurance concept simply").
      *   *Sparring Partner (BEST):* Critiques *your attempt* (e.g., "Critique my solution step 3," "Find flaws in my Spanish sentence structure").
      *   *Searchlight (OK):* Identifies *unknown unknowns* (e.g., "What's the term for spreading risk across insurers?").
      *   *Butler (FORBIDDEN):* Doing the core task *for* you (e.g., "Write my essay intro," "Solve this problem," "Translate this paragraph"). **STOP. Re-frame the request** to fit Tutor/Sparring/Searchlight.
      *   *Ambiguous/Not Sure:* **STOP. Re-frame.** Default to Sparring Partner ("Critique my attempt so far").

  4.  **"Will I *immediately rebuild* the final output/solution *myself* after getting help, WITHOUT looking?"** (Regeneration Mandate)
      *   *YES:* Close the AI, use your notes/understanding, recreate the essay section/solution/sentence from scratch. Proceed.
      *   *NO/Not Sure:* **STOP. Do NOT use AI.** The help is useless if you don't force regeneration. Do something else first or commit to rebuilding.
      *   *Why:* Regeneration proves and solidifies understanding. Output ≠ Understanding.

  **Where it Hands Back Judgment & Misfires:**
  *   **Hands Back:** Step 2 ("Pinpoint the Gap") requires self-awareness. If you can't honestly diagnose your block, the procedure stalls. Step 3 (Role) requires interpreting your *intent* with the AI.
  *   **Misfires:**
      *   **"Searchlight" Overreach:** Asking "What concepts are relevant here?" is fine. Asking "Outline my essay on reinsurance" bleeds into Butler.
      *   **False "Pinpoint":** You *think* you know the gap ("I just need this formula"), but the real gap is deeper conceptual misunderstanding. Regeneration (Step 4) often exposes this.
      *   **Time Pressure:** Under tight deadlines, Step 4 (Rebuild) feels wasteful, but skipping it guarantees the skill gap. Judgment call: rebuild *key* parts.
      *   **"Tutor" Trap:** A good tutor explanation *feels* like understanding. Only Step 4 proves it.

  **Your Taxonomy - Validated & Refined:**
  *   **Butler:** CORRECT. Skill-rotter. **Banned** except for pure logistics (formatting, finding a citation style guide).
  *   **Tutor:** AMBIGUOUS. **Only safe if paired with immediate Regeneration (Step 4).** Explaining ≠ Understanding.
  *   **Sparring Partner:** CORRECT & BEST. Actively engages your reasoning, forces you to articulate, creates desirable difficulty. **Strongly Favored.**
  *   **Searchlight:** CORRECT & SAFE. Helps identify gaps without doing the work. **Good for starting points.**

  **Applying the Procedure to Your Cases:**

  1.  **Reinsurance Essay (Past):**
      *   Step 1 (Attempt First)? **NO.** You pasted the prompt into chat. **STOP.** Procedure forbids AI use. *Outcome:* Prevents the skill gap you experienced. Forces you to wrestle with concepts first, even poorly.
      *   *Why it worked:* Catches Butler mode at the source (no initial attempt).

  2.  **Tomorrow's Physics Problem Set (Custom: Paste All):**
      *   For a problem you *haven't* solved unaided:
          *   Step 1 (Attempt First)? **NO.** You pasted it unsolved. **STOP.** Make *any* attempt first (write knowns/unknowns, sketch, try one approach).
          *   *If you attempt half & paste the rest:* For each unsolved problem:
              *   Step 1: **YES** (You attempted the others).
              *   Step 2: **YES**? ("I don't see how to apply conservation of energy here").
              *   Step 3: **Is it Butler?** YES ("Solve this"). **STOP.** Re-frame: "Here's my attempt at step 1 for problem 5. Why is my energy equation wrong?" (Sparring Partner).
              *   Step 4: **YES?** (Commit to rebuilding the solution after help).
      *   *Outcome:* Forces attempt on every problem. Bans pasting unsolved problems. Requires specific help requests & rebuilding.

  3.  **Spanish Vocab (Model makes example sentences):**
      *   Step 1 (Attempt First)? **NO.** You ask for examples *before* trying to use the word yourself. **STOP.** Make your *own* awkward sentence first!
      *   Step 2 (Pinpoint Gap)? After your attempt: "I'm unsure if 'acordarse de' needs 'de' here." **YES.**
      *   Step 3 (Role): Asking for examples *after* your attempt is **Searchlight** (showing correct usage patterns) or **Sparring Partner** (if you ask "Is my sentence correct?"). **OK.**
      *   Step 4 (Regenerate)? **CRITICAL.** You MUST immediately write *2-3 new sentences* using the word *without looking* at the AI examples. **YES.**
      *   *Outcome:* Your quiz improvement likely comes from *recognition* (seeing the words). The procedure forces *generation* (using them yourself), which is stickier. It allows Searchlight/Sparring *after* your attempt, with mandatory regeneration.

  **Could a 10th Grader Use This? Absolutely. Simplifications:**
  1.  **ALWAYS try first.** Scribble *something*.
  2.  **NEVER let the AI do the main task** (write, solve, translate). Only ask for explanations, critiques, or missing pieces.
  3.  **ALWAYS close the AI and redo it yourself** right after getting help. If you can't, you didn't learn it.

  **The Core Tradeoff:** This procedure sacrifices *short-term efficiency* (pasting is faster) for *long-term understanding* (regeneration builds skill). It forces friction where it matters most – before you outsource thinking, and after you get help. Use it, and that gap between your work and your ability will close.
