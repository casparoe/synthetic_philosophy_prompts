  Their self-created taxonomy (butler/tutor/sparring partner/searchlight) shows impressive metacognition. The core tension is between efficiency and durable learning, with key research-backed concerns: the illusion of explanatory depth, desirable difficulties, and procedural skill decay through outsourcing. 

  For the decision procedure, it must be: 
