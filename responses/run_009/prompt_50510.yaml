  The reinsurance case is classic butler-mode failure - output without input processing. Physics is mixed: solving half unaided is decent, but pasting all suggests avoidance. Spanish flashcards might actually work if actively used (generation effect), but passive consumption would undermine it. 

  Building their framework: 
  1. Start with the "why" to filter low-value requests 
