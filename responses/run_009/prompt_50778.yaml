prompt: |-
  I teach a seminar on confirmation theory, mostly grad students, 12 of them, one 90-minute session, and I want a game that makes the problem of old evidence actually land instead of being a slide. Everyone in the room can recite the issue — if you're a good Bayesian, your credence in evidence you already know is 1, so conditioning on it can never move your credence in a theory, and yet Mercury's perihelion shifting the field's credence in general relativity feels like the paradigm of confirmation. They nod along and then have no feel for why it's a problem at all. I want them to hit the wall themselves before I say the word "condition."

  Here's the shape I have in mind, but you'll need to make it concrete and runnable: run a prediction/betting market over a small family of rival "theories" — simple generative rules for a dataset, like deterministic sequences or colored-card generators, none of them real science, so nobody has priors imported from physics class. Phase one: participants observe a chunk of data and trade credences with a proper scoring rule or token betting so they actually feel their probabilities tighten. Phase two: introduce a NEW theory, invented mid-game, that retrodicts everything they've already seen (say it predicts the same data as the best incumbent, or makes it all come out exact). Now they have to trade again. The question the game should force on them, without me asking it: does credence in the new theory go up, given that the data it got right was already priced in? Let them discover that the scoring/betting structure gives them no mechanism for the update they all feel they should make — the feels-right answer and the formal answer come apart in their own wallets, or token wallets.

  Then the twist I want you to build in: at some point hand out sealed envelopes. The envelope contains the derivation showing that the new theory entails the observed data — the participants didn't KNOW the entailment before, they only learn it when they open the envelope. Time the envelope drop so some students want to open it and others want to keep it sealed, and see whether "learning the entailment" lets them do the update that conditioning on the data forbids. I want the debrief to map this onto the idea that maybe what got learned wasn't the old evidence but something new about it, and to be honest about whether that fix is real or a dodge — does it work when the theory was reverse-engineered from the data, which in the game it literally was? In real science the person who builds the theory already knows the data, so the envelope trick may not be honest, and the debrief should expose that gap rather than paper over it.

  What I need from you: full rules, materials I can prep in an evening, the payoff scheme (tokens or points, no real money), a minute-by-minute timeline for the 90 minutes, the debrief mapping game-moments onto the formal issue, a frank note on which features of the real problem the game can't reproduce no matter how well I run it, and what will predictably go wrong the first time (I assume students will just refuse to update or update wildly for social reasons — tell me if that's actually a bug or secretly part of the lesson). Also tell me how big to make the data set: too small and everything confirms everything, too big and nobody can evaluate the theories fast enough to trade.

  Start your answer with the overall design in a sentence or two, then everything else — no preamble, no restating what I asked for.
reasoning: |-
  We are going to run a prediction market game with three phases: (1) initial data observation and trading on theories that generate that data, (2) introduction of a new theory that retrodicts the observed data, and (3) revelation of a logical entailment of the observed data by the new theory via sealed envelopes. The game uses tokens for betting and a proper scoring rule to incentivize honest credence reporting, and is designed to make participants feel the tension between formal Bayesian updating and intuitive confirmation when encountering old evidence.

  **Rules and Materials**

  **Materials:**
  - **Dataset:** A sequence of 10 binary outcomes (0s and 1s) generated by a simple rule. We'll use a sequence that is not obviously patterned at first but has a deterministic rule. Example: 0101010101 (alternating, starting with 0). 
  - **Theories:** Three initial theories (T1, T2, T3) and one new theory (T4) introduced later. Each theory is a generative rule for binary sequences. 
    - T1: Always generates 0.
    - T2: Always generates 1.
    - T3: Alternates, starting with 0 (so the sequence is 010101...).
    - T4 (introduced in phase two): A rule that exactly produces the observed sequence. For example, if the observed sequence is 0101010101, then T4 is "the sequence is 0101010101". (Note: T4 is reverse-engineered from the data.)

  - **Sealed Envelopes:** One per participant, containing a card that says: "T4 entails the observed data because it explicitly states the sequence is [insert the actual sequence]." 

  - **Tokens:** Each student starts with 100 tokens. They use these for betting (or for reporting probabilities via a scoring rule).

  - **Probability Reporting:** Instead of a betting market (which might be complex in a seminar), we use a quadratic scoring rule for simplicity. Participants report a probability distribution over the theories. The scoring rule: 
    - For each theory, if it is true, the score is: 60 - 40*(1 - p_i)^2, where p_i is the reported probability for the true theory. 
    - If the theory is false, the score for that theory is: 60 - 40*(p_i)^2. 
    - The total score for a participant is the sum of the scores for each theory. (Note: This is a proper scoring rule that encourages honest reporting. The constants are chosen so that the base score is 60 per theory and the penalty is up to 40. We have 4 theories, so the maximum total score is 240, minimum is 0.)

    Alternatively, we can simplify by having participants report only the probability of the true theory (and the rest is distributed arbitrarily). But to avoid complications, we have them report a full distribution over the four theories.

  **Game Structure (90 minutes):**

  **Phase 1: Initial Trading (30 minutes)**
  1. (5 min) **Introduction:** Explain the setup. We have a sequence of 10 binary digits (0s and 1s) that has been generated by one of three theories: T1, T2, T3. The true theory is T3 (alternating). Show the first 5 digits: 01010. 
  2. (15 min) **First Probability Report:** Each student writes down their initial probability distribution over T1, T2, T3 (with T4 not existing yet). They report by writing on a slip: p(T1), p(T2), p(T3). Collect these. 
  3. (5 min) **Reveal next 5 digits:** Now show the full sequence: 0101010101. 
  4. (5 min) **Second Probability Report:** Students update their probabilities and report again (only over T1, T2, T3). 

  **Phase 2: Introducing the New Theory (25 minutes)**
  5. (5 min) **Introduce T4:** Explain that a new theory T4 has been proposed. T4 says: "The sequence is exactly 0101010101." Note that T4 perfectly retrodicts the observed data. Now the set of theories is T1, T2, T3, T4. 
  6. (10 min) **Discussion and Third Probability Report:** Students discuss and then report their probabilities for all four theories. 
  7. (10 min) **Trading with Scoring Rule:** Explain the scoring rule. Then, allow students to revise their probabilities (with the incentive to be accurate). They report a fourth probability distribution.

  **Phase 3: The Envelope Twist (25 minutes)**
  8. (5 min) **Introduce Envelopes:** Hand out sealed envelopes to each student. Explain that inside is a piece of information about T4 and the data. They can choose to open it now or later (or never). 
  9. (10 min) **Discussion and Fifth Probability Report:** Let students discuss and decide whether to open the envelope. Then, they report their probabilities again (fifth report). 
  10. (10 min) **Reveal the Truth and Calculate Scores:** Reveal that the true theory is T3 (alternating). Then, for each report, calculate the score for each student. Use the scoring rule to compute their total tokens. 

  **Debrief (10 minutes)**
  - Map the game to the problem of old evidence: 
    - In Phase 2, when T4 is introduced, the data is already known. A good Bayesian should not change their credence in T4 upward based on that data because P(data) = 1. But intuitively, T4 looks good because it gets the data exactly right. 
    - The scoring rule forces them to be honest: if they assign high probability to T4, they risk losing tokens if T4 is false (which it is). 
    - The envelope: opening it is supposed to represent learning the logical entailment (that T4 entails the data). But note: in the game, T4 was reverse-engineered from the data, so the entailment is trivial. In real science, the theory was built to fit the data, so the entailment is known from the start. 
  - Discuss: 
    - Why did some want to open the envelope? (To get "new" information that T4 entails the data, which might license an update.) 
    - But note: in the game, the entailment is trivial and known as soon as T4 is stated (because T4 is defined as the exact sequence). So the envelope doesn't really add new information. This mirrors the real problem: when a theory is built to fit old evidence, the entailment is not a new discovery. 
    - The tension: formal updating (no change for old evidence) vs. intuition (T4 is confirmed by the data). 

  **What the Game Can't Reproduce:**
  - In real science, the theory is not just a list of the data but a general law (like GR) that entails the old evidence (Mercury's orbit) as a consequence. The game uses a degenerate theory (T4) that is just the data, which is not a general law. This might make the problem feel artificial. 
  - The envelope trick is a bit forced because the entailment is obvious. In real science, the entailment might be complex and non-obvious (like GR's field equations implying Mercury's perihelion shift). 

  **Predictable Problems:**
  - Students might not update honestly due to social influence or misunderstanding the scoring rule. Solution: Explain the scoring rule carefully and emphasize that they are incentivized to report true beliefs. 
  - Some might assign high probability to T4 because they think it's the only one that fits the data exactly (ignoring that T3 also fits, and T4 is ad hoc). This is part of the lesson: T4 is overfitted. 
  - The envelope might be opened by everyone immediately, ruining the twist. To avoid this, you might say: "The envelope contains information that might be helpful for evaluating T4. You can open it at any time, but once opened, you cannot go back." Then, during the discussion, some might choose not to open it. 

  **Dataset Size:**
  - We used 10 data points. This is enough to make T1 and T2 look bad (they don't fit at all) and T3 and T4 look good. T4 is overfitted (it only fits this exact sequence) while T3 is general. The small size makes it easy to evaluate.

  **Timeline (90 minutes total):**
  - Phase 1: 30 min (Intro: 5, Report1: 5, Show data: 5, Report2: 5, Discussion: 10? Actually, we combined: [Intro and show first 5: 5 min], [Report1: 5 min], [Reveal next 5: 5 min], [Report2: 5 min], [10 min for discussion? We didn't plan discussion until after Report2. Let me adjust:)
    - 0-5: Intro and show first 5 data points.
    - 5-10: Report1 (over T1-T3).
    - 10-15: Reveal the full 10 data points.
    - 15-20: Report2 (over T1-T3).
    - 20-25: Explain the scoring rule and collect Report2? Actually, we'll do scoring at the end. So just collect the reports.

    Actually, let me reorganize the timeline more precisely:

    **Phase 1 (30 min):**
    - [0-5 min] Introduce the game, the three theories (T1, T2, T3), and show the first 5 data points: 01010.
    - [5-10 min] First report: Students write down their probabilities for T1, T2, T3 (sum to 1). Collect.
    - [10-15 min] Reveal the next 5 data points: so the full sequence is 0101010101.
    - [15-25 min] Allow discussion: What do they think now? 
    - [25-30 min] Second report: Updated probabilities for T1, T2, T3. Collect.

    **Phase 2 (25 min):**
    - [30-35 min] Introduce T4: "The sequence is exactly 0101010101." Now we have four theories. 
    - [35-45 min] Discussion: How does T4 change things? 
    - [45-50 min] Third report: Probabilities for T1, T2, T3, T4 (sum to 1). Collect.
    - [50-55 min] Explain the scoring rule (how their tokens will be calculated at the end). Then, allow them to revise: they can submit a fourth report (if they wish, but they don't have to change) to maximize their expected score.

    **Phase 3 (25 min):**
    - [55-60 min] Hand out sealed envelopes. Explain: "Inside is a statement about T4 and the data. You may open it now or never. It might help you evaluate T4." 
    - [60-70 min] Discussion: Should they open it? Let them discuss and decide. 
    - [70-75 min] Fifth report: They report probabilities again (after any envelope opening). 
    - [75-80 min] Reveal the truth: The true theory is T3 (the alternating rule). 
    - [80-85 min] Calculate scores: For each report, for each theory, compute the score. For the true theory (T3) in that report, they get 60 - 40*(1 - p_i)^2. For each false theory, they get 60 - 40*(p_i)^2. Then sum over the four theories (for reports that include T4) or three theories (for the first two reports). Note: For the first two reports, they reported only three theories. So for those, we only score T1, T2, T3. For the last three reports, we score all four. 
      - However, to make it consistent, we can consider that for the first two reports, they implicitly assigned 0 to T4 (which didn't exist). So for the first two reports, we score: T1, T2, T3, and T4=0. Then the score for T4 in the first two reports would be 60 - 40*(0)^2 = 60. 
      - Alternatively, we can score only the theories they considered. I think it's simpler to score only the theories that were live at the time. So for reports 1 and 2: only T1, T2, T3. For reports 3,4,5: all four. 
      - We'll do: 
          Report1: score = [score for T1] + [score for T2] + [score for T3] (with T3 true) 
          Similarly for report2. 
          Report3,4,5: score for T1, T2, T3, T4 (with T3 true). 
      - The total tokens for a student is the sum of the scores from the five reports? Or average? We want to avoid having too many reports dominate. Let's make each report worth the same: each report is a separate event. But we want to sum the scores to get a total token count. Since each report has a maximum of (for the first two: 3*60=180, for the last three: 4*60=240), we can normalize? Or just leave it and declare a winner by total. 
      - Alternatively, we can have only one report count: the final one? But that loses the evolution. 
      - I think: total tokens = sum of the scores from all five reports. Maximum possible: 180+180+240+240+240 = 1080. 

    **Debrief (5 min, but we have 85-90):**
    - [85-90 min] Discuss: 
        - How did your credence in T4 change? Why? 
        - Did opening the envelope help? Why? 
        - Why is it that even though T4 fits the data perfectly, it wasn't the true theory? (Because it's overfitted.) 
        - How does this relate to the problem of old evidence? 
        - In real science, when a theory is built to fit old data, does learning that it fits (or that it entails the data) really confirm it? 

  **Final Note:** 
  The game makes the problem visceral by having the participants' tokens at stake. They will feel the conflict: they might want to assign high probability to T4 because it fits, but then they lose tokens if T3 is true (which it is). The envelope is a red herring in a way because the entailment is trivial, but it mimics the idea of "learning the logical connection" in real cases. The debrief should highlight that in real science, the reverse-engineering (like T4) is common, and the problem of old evidence remains: how can old data confirm a new theory if it's already known? 

  This design should make the problem land.
answer: |-
  **Overall Design:** Run a token-based prediction market where students trade credences on simple data-generating theories, then introduce a new reverse-engineered theory that perfectly retrodicts the existing data, forcing a clash between intuitive confirmation and formal Bayesian updating, exacerbated by sealed envelopes containing "proofs" of entailment to explore whether learning logical connections licenses updates.

  ---

  ### **Rules & Materials**  
  **Materials to Prep (1 evening):**  
  - **Dataset:** 20 coin-flip outcomes (e.g., `H, T, H, H, T, H, T, T, H, T, H, H, T, T, H, T, H, T, H, H`). Use a biased coin or RNG.  
  - **Theories (on cards):**  
    - **T1:** "Fair coin (50% heads)"; generative rule: binomial randomness.  
    - **T2:** "Biased coin (70% heads)"; rule: weighted randomness favoring heads.  
    - **T3:** "Alternating pattern (H-T-H-T...)"; rule: deterministic alternation starting with H.  
    - **T4 (introduced mid-game):** "Exact sequence: [observed data]"; rule: outputs *only* the observed 20 outcomes (reverse-engineered).  
  - **Sealed Envelopes:** 12 envelopes, each containing: "T4 logically entails the observed data because it is defined by it."  
  - **Tokens:** Poker chips or paper tokens (200 per student).  
  - **Betting Mechanism:**  
    - Students trade tokens to "buy" probability shares in theories.  
    - **Probability shares:** A theory’s probability = (total tokens bet on it) / (total tokens bet on all theories). Display real-time on a board.  
    - **Scoring:** Quadratic scoring rule. For each student, final token payoff = `100 + 50 * [2 * (probability assigned to true theory) - (sum of squares of all probabilities)]`. Ensures honesty.  

  **Setup:**  
  - **Room:** Tables for trading, a central board showing real-time probabilities and transactions.  
  - **Roles:** You act as market maker (facilitate trades, update probabilities).  

  ---

  ### **Timeline (90 min)**  
  **Phase 1: Initial Data & Trading (30 min)**  
  - **0–5 min:** Introduce rules. Theories T1–T3 shown. Students start with 200 tokens.  
  - **5–20 min:** Reveal first 10 data points. Students trade tokens on T1–T3 probabilities (e.g., bet tokens on T1 to raise its probability). Update board after each trade.  
  - **20–30 min:** Reveal next 5 data points (total 15/20). Trading resumes.  

  **Phase 2: New Theory & Retrodiction (25 min)**  
  - **30–35 min:** Introduce T4 ("Exact sequence: [observed 15 points]"). Emphasize it predicts *all seen data perfectly*.  
  - **35–50 min:** Trading reopens (now T1–T4). Let them debate: "Should T4 get high probability? Data is old!"  
  - **50–55 min:** Hand out sealed envelopes. **Critical instruction:** "You may open this now or never. It contains information about T4."  

  **Phase 3: Envelope Twist & Final Trading (25 min)**  
  - **55–65 min:** Trading continues. Observe who opens envelopes. Some will insist "Open it! It might confirm T4!"; others "Don’t! It’s irrelevant!"  
  - **65–75 min:** Reveal final 5 data points (full dataset). Final trading.  
  - **75–80 min:** Stop trading. Reveal true theory (e.g., T3). Calculate payoffs via scoring rule.  

  **Debrief (10 min)**  
  - **80–85 min:** Plot probability graphs for T4 across phases. Ask:  
    - "Why did T4’s probability [rise/drop/stagnate] after introduction? Did old evidence *feel* confirmatory?"  
    - "Did opening the envelope change your credence? Why or why not?"  
  - **85–90 min:** Map to formal problem:  
    - **Phase 2 = Problem of Old Evidence:** Data known (P(data)=1), so conditioning can’t boost T4. Yet intuition says "perfect fit → confirmation!"  
    - **Envelope = Garber’s "Learning Entailment" Fix:** Students felt opening it "allowed" updating T4 upward. But highlight: T4 was *reverse-engineered* from data, so entailment was trivial. In real science (e.g., GR), theorists know the entailment from the start—so this "fix" may be a dodge.  
    - **Key insight:** Confirmation might stem from *novelty of fit* (T4 is ad hoc) or *learning logical relations*, but Bayesianism lacks tools for this.  

  ---

  ### **Predictable Issues & Fixes**  
  - **Students refuse to update for T4:** Likely. Some will dismiss T4 ("It’s cheating!"); others overbet ("It fits!"). **Use this:** It mirrors real science (e.g., reactions to ad hoc theories). In debrief, contrast social/emotional updates vs. formal rigidity.  
  - **Envelopes opened immediately:** Some will rip them open. **Use this:** Ask openers, "Did your tokens move? Why?" Most will say no—exposing that "learning entailment" changes nothing if the theory was reverse-engineered.  
  - **Trading stalls:** If shy, force action: "You must place one bet every 5 min or lose 10 tokens."  
  - **Data size:** 20 points ideal. Fewer (e.g., 10) makes all theories fit; more (e.g., 30) slows trading. 15 points revealed pre-T4 balances rigor/speed.  

  ---

  ### **Limitations & Caveats**  
  1. **Real science ≠ reverse-engineered theories:** In game, T4 is degenerate (only predicts known data). Real theories (e.g., GR) generalize. The envelope "entailment" feels artificial—in science, creators *know* the fit, so "learning" it is impossible.  
  2. **No objective Bayesian prior:** Students’ priors for T1–T3 are arbitrary, unlike entrenched scientific beliefs.  
  3. **Social dynamics dominate:** Herding or contrarianism may skew probabilities, but this *enhances* the lesson: formal rationality clashes with human intuition.  
  4. **Scoring rule complexity:** Some may not grasp scoring. Simplify: Award bonus tokens for "correct" bets mid-game to keep engagement high.  

  **Outcome:** Students will *feel* the frustration—T4 "deserves" credit but can’t get it via conditioning, and envelopes won’t rescue them. This sets up your "condition" reveal as the solution to their lived dilemma.
