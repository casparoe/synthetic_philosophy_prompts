prompt: |-
  So here's my situation. I've been a rationalist-adjacent lurker for like a decade (GEB did a number on me as a teenager, and yes, I've reread the Prelude/Ant Fugue dialogue way more times than is healthy), and somewhere along the way I got drafted as the "neutral moderator" for two friends of mine who have been fighting about the Aunt Hillary question for close to two years now. One of them, Maya, is a cognitive scientist who got obsessed with superorganisms after reading about colony-level learning and is basically an emergentist about it: she thinks an ant colony can literally instantiate a mind at the colony level, that ants play the role neurons play, and that the pheromone trail network functions as the colony's memory the way connectome structure functions as ours. The other, Dmitri, is a computational neuroscience guy who thinks all of that is compositional aggregation dressed up with flattering vocabulary: the interesting cognition is inside individual ant brains, "the colony decided" is a convenient shorthand at best, and Maya is committing what he calls the Snow Crash fallacy — confusing self-organizing pattern formation with a subject that has the pattern.

  They've finally agreed to do a real adversarial collaboration, I'm Notarian style — claims both can sign, residual disagreements made precise, cruxes, pre-registered predictions, the whole thing — and they want me to draft the skeleton of the joint statement before their next session so they have something to fight over instead of each other. And honestly I'm out of my depth. There are things they obviously agree on (colonies do stuff no single ant "knows" how to do; foraging trails get reinforced and decay; ants individually are way dumber than the collective behavior suggests) and things where I genuinely can't tell if they're disagreeing about the world or about words. Like, is the fight over whether slow, sparse, chemistry-mediated integration can count as binding (Dmitri says integration has to be fast and dense, Maya says that's carbon chauvinism by proxy — slow down a human brain by a factor of a million and does the mind vanish?), or is it over whether you even need binding, or is it over whether "mind" requires phenomenal consciousness rather than just representational states? And then there's the stuff Maya brought up that I couldn't referee at all: colonies seem to remember good nest sites for months even though trail pheromone decays in hours, so if trails are the "memory," what's carrying the long-term stuff — and does that asymmetry cut for or against her? Also the individuation mess: an Argentine ant supercolony stretches across continents with millions of nests and no clear boundary, so is that one mind, thousands, or does the question reveal that "one colony = one mind" was never principled? Dmitri keeps pushing a prediction-based test — if colony behavior is fully derivable from ant-level rules plus environment, he wins, and Maya says that criterion would also disqualify brains, which is exactly the kind of move I need the document to evaluate.

  So: draft the joint statement for me, in American English please. I want (1) a numbered section of claims both of them could actually put their names to — about colony behavior, about what individual ants can and can't do, about what each side takes themselves to be explaining, with no slanted wording that either would reject; (2) a disagreements table laying out the precise points where they part ways, with each position phrased so its own holder would sign off on the formulation (this is the part I keep screwing up — my drafts always make Maya sound like she believes in a colony ghost, which she doesn't); (3) the cruxes, as many as you can identify, with for each one the experiment, argument, or thought experiment they'd both agree bears on it and both of their predictions written down in advance so they can be scored later; and (4) an honest section on which parts of the dispute are probably verbal — e.g., whether "the colony represents the food location" is a metaphor, a literally true but unexciting claim, or a genuinely loaded ontological commitment — and which parts are load-bearing and empirical. Dont worry about being neutral in the sense of splitting the difference; worry about being exact. If some crux would only be settled by data nobody has or maybe can't get, say that, since "this is not currently a testable disagreement" is itself something they should both be able to agree on.
reasoning: |-
  Okay, let me unpack this user's request. They're a longtime rationalist lurker acting as moderator for two friends (Maya the emergentist cognitive scientist and Dmitri the reductionist neuroscientist) debating whether ant colonies can be considered minds. The user needs help drafting a neutral adversarial collaboration document with four specific sections: agreed claims, precise disagreements, testable cruxes, and analysis of verbal vs empirical disputes.

  First I need to map the common ground. Both clearly agree colonies exhibit complex behaviors exceeding individual ant capabilities, using pheromone trails for coordination. Maya sees this as genuine colony-level cognition while Dmitri views it as compositional aggregation. The user's struggle is capturing Maya's position without making it sound mystical - she's not positing a "colony ghost" but rather strong emergence.

  For the disagreements table, I should focus on three core fault lines: ontological status (is the colony itself a cognitive subject?), binding/coherence mechanisms (do slow chemical signals count?), and criteria for cognition (is representation sufficient or is phenomenal consciousness required?). Each position must be phrased in its proponent's own terms - Dmitri's "Snow Crash fallacy" versus Maya's "carbon chauvinism" charge.

  The cruxes section is trickiest. Key testable differences include: (1) whether colonies exhibit irreducible information integration (measured by Φ or similar metrics), (2) if long-term memory persists beyond pheromone decay (pointing to structural changes), and (3) if colony behavior requires higher-order representations. Thought experiments like time-scaled brains could help isolate principles from implementation details.

  Finally, the verbal disputes analysis should flag terms like "mind" and "representation" as potential sources of equivocation, while emphasizing that the ontological commitment to colony-level subjects remains empirical. The document must preserve productive tension - not false compromise but precise conflict mapping.

  User's meta-concern about depth is valid; I'll avoid oversimplifying either position while keeping formulations operationalizable for their collaboration. The "continental supercolony" boundary problem might actually serve as a fruitful edge case for both theories.
answer: |-
  Here’s a draft joint statement structured to meet your requirements. It’s rigorously neutral, formulated in operationalizable terms, and designed to force precise disagreement. Language is calibrated to avoid smuggling assumptions (e.g., "processes" instead of "minds," "represents" only when both accept minimal usage).

  ---

  ### **Joint Statement of Agreement & Disagreement: On Colony-Level Cognition in Ants**  
  **Parties:** Maya (Emergentist Position), Dmitri (Reductionist Position)  
  **Moderator:** [Your Name]  
  **Date:** [Date]

  ---

  ### **1. Agreed-Upon Claims**  
  *(Signed by both parties)*  
  We jointly affirm the following empirically grounded statements about ant colonies (*e.g.*, *Linepithema humile* supercolonies, *Formica* sp. mound colonies):  

  1.1. **Collective Intelligence**: Ant colonies solve problems (foraging, nest selection, defense) that exceed the computational capacity of any individual ant, using distributed mechanisms.  
  1.2. **Mechanism**: Coordination arises via:  
      - a) Stigmergy (pheromone deposition modifying environment/behavior).  
      - b) Local interactions (ant-ant contact, trophallaxis).  
      - c) Positive/negative feedback (trail reinforcement/evaporation).  
  1.3. **Individual Limitations**: Individual ants lack neural structures for:  
      - a) Global spatial representation of the colony’s territory.  
      - b) Long-term memory of colony-scale events (e.g., nest quality).  
      - c) Integrated decision-making about colony needs.  
  1.4. **Scalability**: Colony behavior exhibits phase transitions (e.g., from exploration to exploitation) based on density, resource distribution, and damage.  
  1.5. **Memory Phenomena**: Colonies retain information about:  
      - a) High-quality food sources/territories for hours/days beyond individual ant lifespans.  
      - b) Nest sites across days/weeks despite trail pheromone decay (<48h).  
  1.6. **Superorganism Analogy**: Colonies share functional parallels with multicellular organisms (division of labor, homeostasis, specialized castes).  

  ---

  ### **2. Precise Disagreements**  
  *(Each position stated as its holder would endorse it)*  

  | **Issue**                  | **Maya’s Emergentist Position**                                                                                                                                 | **Dmitri’s Reductionist Position**                                                                                                                               |  
  |----------------------------|------------------------------------------------------------------------------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------------------------------------------------------------|  
  | **Ontological Status**     | The colony *itself* is a cognitive subject. It instantiates a mind via the integration of ants (as neurons) and stigmergic networks (as synaptic structures). | Colonies exhibit complex *composite* behavior. "Colony cognition" is shorthand for parallel ant-level cognition + environmental feedback; there is no additional subject. |  
  | **Binding/Integration**    | Slow, sparse, chemistry-mediated integration (pheromone gradients, spatial memory) achieves functional equivalence to neural binding, scaled in space/time.      | Integration requires rapid, dense signaling (~ms-ms, axons/synapses). Slow stigmergy lacks causal cohesion; it’s pattern propagation, not binding.              |  
  | **Representation**         | Colonies possess *colony-level representations* (e.g., "food location" encoded in trail topology; "nest quality" in collective preference).                   | Only ants represent. "Colony memory" is an aggregation of ant behaviors + environmental residues; no *de novo* representation exists at the colony level.       |  
  | **Individuation**          | Colony mind boundaries map to functional networks (e.g., pheromone trail connectivity). Supercolonies *could* be fragmented minds if interaction is sparse. | "One colony" is a pragmatic boundary. Supercolonies highlight the arbitrariness of assigning "mind" to aggregates without intrinsic unity.                     |  

  ---

  ### **3. Testable Cruxes & Predictions**  
  *(Empirical/experimental resolutions both accept as decisive)*  

  | **Crux**                                                                 | **Relevant Test/Evidence**                                                                 | **Maya’s Prediction**                                                                 | **Dmitri’s Prediction**                                                                | **Testability** |  
  |--------------------------------------------------------------------------|--------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------|-----------------|  
  | **Is colony learning irreducible?**                                      | Ablate pheromone trails mid-task. Does the colony "remember" after regeneration?           | Memory persists (due to structural changes, e.g., ant distribution, internal state). | Memory lost; new trails encode new info (no persistence beyond environment/ants).      | High            |  
  | **Does integration meet cognitive thresholds?**                          | Measure information integration (Φ) in colonies vs. ant clusters. Use perturbation analysis. | Φ scales nonlinearly with colony size, exceeding summed ant Φ.                     | Φ scales linearly/additively; no emergent integration.                               | Medium (novel metrics needed) |  
  | **Long-term memory mechanism**                                           | Track colony preference for nest sites months after initial discovery (post-pheromone decay). | Preference retained via colony structure (e.g., brood location, queen position).     | Preference requires relearning; "memory" is coincidental (e.g., stable environment). | High            |  
  | **Time-scaled cognition**                                                | Simulate a human brain slowed by 10^6. Does cognition cease?                               | Cognition preserved (speed irrelevant to ontology; function matters).                | Cognition lost (integration requires biological timescales for coherence).           | Thought experiment (clarifies principles) |  
  | **Supercolony unity**                                                    | Disrupt connectivity in a supercolony. Does "decision-making" fragment locally or globally? | Fragmentation occurs only at disruption boundaries (functional networks decouple). | Local decisions unaffected; no global "mind" to fragment.                            | Medium (field feasible) |  

  ---

  ### **4. Verbal vs. Empirical Disagreements**  
  *(Jointly endorsed analysis)*  

  - **Verbal/Definitional**:  
    - "**Mind**": Disagreement hinges on criteria. Maya uses *functional cognition* (problem-solving, memory); Dmitri requires *phenomenal binding* (neural-like integration). **Resolution**: Define "mind" operationally upfront.  
    - "**Representation**": Maya: "Colony encodes X" = system behavior depends on X. Dmitri: "Represents" requires internal model. **Resolution**: Specify "representation" as counterfactual-supporting state.  
    - "**The colony decides**": Both agree this is valid shorthand. Dispute is over *ontological commitment* (literal subject vs. metaphor).  

  - **Empirical/Load-Bearing**:  
    - **Irreducibility**: Whether colony behavior *requires* colony-level explanations (Maya: yes; Dmitri: no, ant rules + environment suffice). *Testable via predictive models*.  
    - **Binding Mechanism**: Whether slow stigmergy can implement cognitive integration. *Testable via Φ, fragmentation resilience*.  
    - **Subjecthood**: Whether integrated behavior implies a subject ("who" experiences). *Currently untestable; hinges on theory of consciousness*.  

  ---

  ### **Notes for Mediation**  
  - **Neutral Language Achieved**: "Colony-level cognition" used descriptively; "subject" avoided in agreements.  
  - **Slant Corrected**: Maya’s position framed as *functional emergence* (not homuncular); Dmitri’s as *causal reduction* (not denial of complexity).  
  - **Unresolvable**: Subjecthood/consciousness may remain intractable without consciousness metrics.  
  - **Next Step**: Parties debate *this framework*, then design experiments for 2–3 top cruxes (e.g., ablation study, Φ measurement).  

  ---  
  This forces the fight onto: (1) defining thresholds for cognition, (2) quantifying integration, and (3) specifying what reduction must explain. The "slow brain" thought experiment and supercolony fragmentation are key for isolating principles from implementation. Let them battle over the cruxes table first—that’s where the real meat is.
