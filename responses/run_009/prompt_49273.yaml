  **Total \(E_{\text{cap}} \approx 11.50 + 0.50 + 0.596 = 12.596\)**.  

  **Revised Calculation**:  
  The correct expected payout is:  
  \[  
  E_{\text{cap}} = \frac{n}{2} + \frac{M}{2^n} \quad \text{where} \quad n = \lfloor \log_2(M) \rfloor + 1.  
  \]  
  For \(M = 10^7\), \(n = 24\), \(E_{\text{cap}} = 24/2 + 10^7 / 2^{24} = 12 + 0.596 = 12.596\).  

