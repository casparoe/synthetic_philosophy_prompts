  **MEMORANDUM**  
  To: Promotional Mechanics Committee  
  From: [Your Name], Backend Engineer  
  Date: [Current Date]  
  Subject: Decision on Provably Fair Coin-Flip Jackpot Promotion  

  ### Recommendation  
  **Approve the promotion with the following conditions:**  
  1. **Liability cap**: $10,000,000 (ten million dollars).  
  2. **Entry fee**: $20.00 per play.  
  3. **Disclosure**: Explicitly state the maximum payout cap in the game’s terms and conditions.  

  ### Executive Summary  
  Marketing’s proposal for a St. Petersburg-style coin-flip jackpot is approved with modifications to ensure financial sustainability and transparency. While the theoretical infinite expected value drives player interest, a liability cap is necessary to align with real-world constraints. The capped expected payout is $19.30, justifying a $20.00 entry fee to ensure profitability. The cap does not eliminate the promotion’s appeal but reframes it around achievable, high-impact payouts. A phased rollout is required to validate acquisition projections.  

  ### Analysis of Expected Payout  
  The game involves flipping a fair coin until the first tails. The payout starts at $1 for the first flip (tails on Flip 1) and doubles with each successive heads (e.g., heads then tails pays $2, heads-heads-tails pays $4). Without a cap, the expected payout is infinite:  
  \[  
  E = \sum_{k=1}^{\infty} \left(\frac{1}{2}\right)^k \cdot 2^{k-1} = \sum_{k=1}^{\infty} \frac{1}{2} = \infty.  
  \]  

  **Impact of the Liability Cap**:  
  Finance’s $10,000,000 cap truncates payouts exceeding this amount. Let \(M = 10^7\). The maximum number of flips \(n\) before payouts hit the cap is defined by \(2^{n-1} \leq M < 2^n\), giving \(n = \lfloor \log_2(M) \rfloor + 1 = 24\) (since \(2^{23} = 8,388,608 \leq M < 2^{24} = 16,777,216\)). The expected payout with the cap is:  
  \[  
  E_{\text{cap}} = \sum_{k=1}^{24} \left[ \left(\frac{1}{2}\right)^k \cdot 2^{k-1} \right] + \left(\frac{1}{2}\right)^{24} \cdot 10^7 = \frac{24}{2} + \frac{10^7}{16,777,216} = 12 + 0.596 \approx 12.596.  
  \]  
  **Correction**: The payout for \(k=24\) is \(2^{23} = 8,388,608\), and outcomes beyond \(k=24\) pay \(M = 10^7\). The exact formula is:  
  \[  
  E_{\text{cap}} = \sum_{k=1}^{23} \frac{1}{2} + \left(\frac{1}{2}\right)^{24} \cdot 10^7 + \text{adjustment for } k=24.  
  \]  
  Re-evaluating:  
  - For \(k \leq 23\): Payout \(2^{k-1} \leq 8,388,608\), probability-weighted sum \(= \sum_{k=1}^{23} \frac{1}{2} = 11.50\).  
