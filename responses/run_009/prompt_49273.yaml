      Subject: Decision on Coin-Flip Jackpot Promotion

      After thorough analysis, the committee has reached a decision regarding the proposed coin-flip jackpot promotion. We approve the promotion with the following conditions:

        1. A liability cap of $10,000,000 (ten million dollars) will be set as the maximum payout per play.
        2. The entry fee will be set at $15.00 per play.
        3. The terms and conditions must clearly disclose the maximum payout cap.

