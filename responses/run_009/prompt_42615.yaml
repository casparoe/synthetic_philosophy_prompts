answer: |-
  **RIDER NO. EC-117: EXTENDED COGNITIVE ASSETS COVERAGE**  
  **ISSUED BY: RELIANT STANDARD ASSURANCE CO.**  
  **EFFECTIVE DATE: [DATE]**  
  **ATTACHED TO POLICY NO: [NUMBER]**  

  **I. DEFINITIONS**  
  1. **Extended Cognitive Asset (ECA):** Any physical or digital artifact designated by the Policyholder as integral to their cognitive processes, meeting the Trust-and-Reliability Criteria (Section II).  
  2. **Trust-and-Reliability Criteria:** The conditions under which an artifact qualifies as an ECA, defined in Section II.  
  3. **Coupling:** The functional integration between the Policyholder and an ECA, enabling seamless cognitive offloading.  
  4. **Dispositional State:** A behavior-modifying propensity (e.g., habitual recall, decision-making fluency) enabled by an ECA. Excludes episodic memory or unrealized thoughts.  
  5. **Merely Environmental Artifact:** Tools or resources accessed intermittently without consistent integration into cognition. Explicitly excluded (Section V.2).  

  **II. COVERED ASSETS: TRUST-AND-RELIABILITY CRITERIA**  
  An artifact qualifies as an ECA only if all criteria below are met:  
  1. **Constant Availability:** The artifact must be reliably accessible during the Policyholder’s standard cognitive operations (e.g., a smartphone kept charged and within arm’s reach 22 hours/day).  
  2. **Automatic Endorsement:** The artifact’s output must be trusted and utilized by the Policyholder without secondary verification (e.g., cloud-synced notes consulted for immediate decision-making).  
  3. **Past Access:** The artifact must demonstrably augment cognition through repeated historical use (minimum 15 instances monthly, verified via logs or timestamps).  
  *Example Inclusion:* A notebook carried daily and referenced >3x/hour.  
  *Example Exclusion:* A laptop used quarterly for tax calculations ("merely environmental").  

  **III. CLAIM PROCEDURES**  
  1. **Notification:** Policyholder must report ECA loss/damage within 48 hours via Form EC-8.  
  2. **Gap Assessment:**  
     a. Reliant shall calculate compensation based solely on lost Dispositional States (e.g., "inability to navigate via muscle memory of phone maps").  
     b. No claims are payable for:  
        i. Episodic memories ("what you would have remembered").  
        ii. Hypothetical cognitive outcomes ("ideas never formed").  
  3. **Compensation:**  
     a. Payout covers cognitive rehabilitation (e.g., behavioral therapy, replacement artifact setup).  
     b. Maximum benefit: $5,000 per ECA, subject to policy deductible.  

  **IV. SUBROGATION: COUPLING FAILURE**  
  1. Where ECA loss arises from failure of the Coupling (not the artifact itself), Reliant reserves the right to pursue recovery from third-party coupling facilitators.  
     *Example:* A cloud service outage (not device failure) disrupting access triggers Reliant’s subrogation against the provider.  
  2. Policyholder cooperation in subrogation proceedings is mandatory.  

  **V. EXCLUSIONS**  
  Coverage does not extend to:  
  1. **Constitution-vs-Coupling Artifacts:** Artifacts deemed "constitutive" of the Policyholder’s identity (e.g., biometric implants). Reliant insures property, not persons. Premiums reflect this.  
  2. **Parity Dilemmas:**  
     a. Public or shared resources (e.g., library books, municipal maps), regardless of frequent use.  
     b. Assets used by >1 individual simultaneously.  
     *Rationale:* Preventing "cognitive sprawl" (e.g., half the town qualifying as your mind).  
  3. **Non-Recoverable States:**  
     a. Emotions, creativity, or consciousness fluctuations.  
     b. ECAs not meeting Trust-and-Reliability Criteria (e.g., "backup phones" stored in drawers).  
  4. **Intentional Decoupling:** Losses arising from voluntary discontinuation of ECA use >72 hours pre-incident.  

  **VI. GENERAL CONDITIONS**  
  1. Premium adjustments may occur upon ECA reclassification (e.g., a "merely environmental" artifact promoted to ECA status).  
  2. Reliant may audit ECA usage logs biannually to verify compliance with Trust-and-Reliance Criteria.  
  3. This rider nullifies conflicting terms in the base policy.  

  ---
  **END OF RIDER**  
  *Reliant Standard Assurance Co. is a registered provider of cognitive-property solutions. Premiums are actuarially calibrated to the ontological status of insured items. Consult your agent to debate constitutionality.*  

  ---

  **PHILOSOPHICAL SUBTEXT & HUMOR MECHANISMS**  
  - **Trust Criteria:** Direct nod to Clark & Chalmers’ "glue and trust" conditions (e.g., Otto’s notebook). Dry humor in bureaucratic policing of "15 instances monthly."  
  - **Dispositional States:** Reduces consciousness to claimable "propensities" (e.g., "muscle memory of phone maps"), sidestepping Hard Problem quicksand.  
  - **Exclusions:** "Cognitive sprawl" mocks parity’s slippery slope; "constitutive artifacts" clause quietly rejects mind-property equivalence.  
  - **Corporate Voice:** Earnest legalese ("ontological status of insured items") contrasts absurdity of insuring a notebook as a brain part.  
  - **Layperson’s View:** Reads as hilariously over-specific fine print (e.g., excluding library books as "not your mind").  

