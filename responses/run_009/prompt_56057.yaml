prompt: |-
  You're a veteran philosophy TA — fifteen years of grading, allergic both to grade inflation and to docking students for things they never actually said. I need you to grade one midterm answer tonight (I have like 40 of these to get through, so be decisive but fair). Please think carefully before commiting to a grade: first sketch for yourself what a complete answer to the question would have to contain, then measure the student against that, and only then decide what's a real error versus a defensible point stated awkwardly.

  The course is Philosophy of the Social Sciences. The exam question was:

  "Across countries, higher measured gender equality is associated with more, not less, gendered career sorting: in the most egalitarian countries men and women end up in different occupations and fields at higher rates than in less egalitarian ones. Some take this 'gender-equality paradox' to show that the sexes differ in vocational preferences by nature, and that these differences only show through once constraint is lifted. Others take it to show something about welfare states, affluence, or how equality gets measured. What, if anything, can be inferred from the pattern alone? And suppose the biological reading were true — what, if anything, would follow about the justice of gender-imbalanced occupations? Defend your answers."

  Here is the student's answer, unedited:

  "The pattern is a real problem for simple socialization stories. If gendered choices were purely cultural, liberalizing a culture should shrink them, but the Nordic countries show some of the strongest occupational sorting by sex anywhere in Europe. So the standard social role explanation is refuted, and what survives is the biological one: when people are free, average sex differences in interests express themselves, and the weaker sorting elsewhere reflects constraint rather than preference.

  Then again, the cross-country inference is weaker than it looks. The countries that top the equality indices also tend to be rich welfare states with compressed wages, so affluence or the structure of the labor market could produce the pattern without any difference in underlying preferences. The indices themselves mostly track outcomes like wage gaps and representation, so equality is operationalized one way while conclusions get drawn about another.

  Still, suppose the biological reading is correct: where women choose freely, they choose differently. It follows that imbalances like having few women in engineering are not unjust. Rawls held that natural endowments are arbitrary from a moral point of view and that institutions must correct for arbitrary differences, so on his view the egalitarian is committed to erasing natural differences between the sexes, which is impossible. Hence egalitarians face a dilemma: deny the science or accept an absurd demand.

  The escape route is to deny that the choices are really free: people adapt their preferences to their options, adjusting what they want to what they can get, so a free choice of nursing over engineering may just be rationalization. But this cuts both ways — it explains the banker's choices as easily as the nurse's, so it can't do much work in an argument for reform."

  A few practical notes: grade on a letter scale (A through F, with +/– if you want), quote the student only where they actually wrote it, and don't assume errors are typos or that I agree with anything the student said — I'm not telling you my read on it, just grade it straight.

  Give me your response in these sections, in this order:

  1. **Grade and headline** — the letter grade plus two or three sentences saying in plain terms what kind of answer this is.
  2. **What's wrong, most serious first** (~250 words) — go problem by problem, pointing at the specific sentences involved, and say for each why it's a mistake rather than just a stylistic gripe. Note anywhere the student is internally inconsistent, since the answer seems to take back things it said earlier.
  3. **What deserves credit** (~100 words) — the genuinely good moves I shouldn't dock them for, even where the surrounding prose is clumsy.
  4. **Marginal comments for the student** (~120 words) — four or five short comments written directly to the student ("here you claim X, but...") that I can paste into the margins of the submitted text.
