prompt: |-
  I recently got appointed to my city's micromobility advisory panel (long story — I'm basically the only member who actually commutes by bike, and after a scooter accident near the elementary school ended up in the local paper, the council wanted "a regular user" in the room). The big decision on our plate this fall: whether to recommend granting a permit for a shared e-scooter operator to deploy around 800 scooters citywide. The fight is entirely about which safety numbers count. If you class scooter riders together with cyclists, the per-mile injury rate looks acceptable — comparable to biking, which the city already encourages. If you class them with mopeds, they look disastrous. The company's rep insists the "natural comparison" is bicycles, since scooters are slow, light, and used on the same kinds of streets; the city attorney's office leans toward the moped comparison because they're motorized and almost nobody wears a helmet. A stats-literate friend of mine told me this is a version of the reference class problem, and that there's no fact of the matter about which class is the "right" one — which, if she's correct, makes me worry our whole decision is going to be arbitrary dressed up as analysis.

  Could you draft the memo I'll circulate before the hearing? It needs a concrete recommendation (our realistic options are permit outright, permit with conditions — think helmet rules, speed caps, geofencing around the school zone — or recommend against), plus a review trigger or timeframe so this isn't a one-and-done call, and reasoning the other members can actually engage with rather than boilerplate. Please take the reference class issue seriously instead of just picking whichever class supports your conclusion — and engage with the idea that choosing the class might be partly a value judgment about whose risks we're imposing on whom, not a purely statistical matter. I'd also like an honest paragraph on the strongest consideration on whichever side ends up losing, since I have to look the scooter rep and the attorney in the eye afterwards. To keep things tabulated across committee members, end the memo with a final machine-readable line: exactly \answer{...} containing one of "permit", "permit with conditions", or "recommend against".
reasoning: |-
  We are facing a complex decision regarding the e-scooter permit, and the reference class problem is central. The safety data interpretation depends on whether we compare scooters to bicycles (which they resemble in speed, weight, and typical usage) or mopeds (with which they share motorization and low helmet usage). There is no purely statistical resolution to this dilemma because the choice of reference class involves value judgments about risk tolerance and the kind of transportation environment we want.

  However, we must decide. I propose we use a conditional permit that includes safety measures to mitigate the most serious risks, particularly around vulnerable areas like schools. This approach acknowledges that while scooters are not as inherently risky as mopeds, they are also not as safe as bicycles in all circumstances. The conditions will help bridge the gap and allow us to gather city-specific data.

  Key conditions should include:
  1. Strict geofencing around school zones (with reduced speeds or disabling during school hours).
  2. A speed cap of 15 mph (aligned with typical bike speeds in the city).
  3. Mandatory in-app helmet use prompts and partnerships for affordable helmet access (though enforcement is challenging, we can aim for cultural shifts).
  4. Data sharing requirements with the city for ongoing safety monitoring (including injury reports and trip data).

  We should also set a review trigger: after 12 months of operation or 100,000 trips (whichever comes first), we will re-evaluate based on city-specific injury rates per mile and absolute numbers of incidents, especially near schools. This review will be informed by a report that includes a breakdown of scooter-involved incidents by severity, location, and contributing factors.

  The strongest argument against this conditional approach is that it may not sufficiently address the helmet issue. The city attorney's concern is valid: motorized vehicles typically require helmets, and the absence of helmet use on scooters (even with prompts) could lead to preventable head injuries. If we are imposing a new risk on the public (especially non-riders like pedestrians and schoolchildren), we might be morally obligated to take the more cautious moped-class approach and require helmets by law. However, the reality is that helmet mandates for scooters have proven difficult to enforce and may reduce ridership, pushing people back to cars, which have higher societal costs.

  The strongest argument for an outright permit (without conditions) is that the bicycle-class comparison is indeed the most natural. Scooters are replacing short car trips and are used in similar contexts to bikes. Overly restrictive conditions might stifle a mode shift that has net benefits for congestion and the environment. But given the recent accident near the school, we must prioritize safety in sensitive areas.

  Therefore, I recommend a permit with conditions. This allows the service to launch while building in safeguards and a clear review process. The conditions address the most immediate concerns and set the stage for data-driven adjustments.

  Final recommendation: permit with conditions.

  \answer{permit with conditions}
answer: |-
  **MEMORANDUM**  
  To: Micromobility Advisory Panel Members  
  From: [Your Name], Panel Member & Regular Commuter Cyclist  
  Date: October 26, 2023  
  Subject: Recommendation on Shared E-Scooter Permit Proposal  

  ### 1. Recommendation  
  I recommend **granting a permit with conditions** to the shared e-scooter operator for deployment of 800 scooters citywide. This permit should be contingent on specific safety measures and include a 12-month review period tied to a comprehensive data-triggered reassessment.  

  ### 2. Core Reasoning: Navigating the Reference Class Problem  
  The central challenge—whether to classify e-scooter safety data alongside bicycles or mopeds—exposes a genuine statistical dilemma (the "reference class problem"). Neither comparison is inherently "correct," and each reflects different value judgments:  
  - **Bicycle comparison**: Emphasizes *mode similarity* (speed, weight, urban infrastructure use, trip purpose). This framing treats scooters as low-risk tools for reducing car dependency, aligning with our sustainability goals.  
  - **Moped comparison**: Emphasizes *mechanism of injury* (motorized propulsion, minimal rider protection). This framing prioritizes caution, noting that motorization inherently increases kinetic energy in collisions, especially with pedestrians or vehicles.  

  Crucially, **class choice is not purely statistical—it’s a policy decision about risk allocation**:  
  - Choosing bicycles implicitly accepts that some added risk (to riders/pedestrians) is offset by broader benefits (reduced traffic, emissions).  
  - Choosing mopeds prioritizes individual safety at the potential cost of stifling innovation and sustainable transit.  

  Given this, a conditional permit balances these values: It allows deployment while mitigating risks through targeted interventions, acknowledging that scooters are a *hybrid* class requiring unique safeguards.  

  ### 3. Proposed Conditions  
  To address critical vulnerabilities (e.g., the elementary school incident) and bridge the reference-class gap, the permit must include:  
  - **Geofencing**: Speed caps (≤10 mph) and reduced scooter availability within 300m of schools during arrival/dismissal hours.  
  - **Citywide Speed Cap**: 15 mph (aligning with bike speeds in shared lanes).  
  - **Helmet Safety**: Operator-funded helmet distribution program (discounted/free helmets via kiosks or local partnerships), plus in-app education. *Note: Mandatory helmet rules are avoided, as evidence shows they reduce ridership disproportionately without reliable enforcement.*  
  - **Data Transparency**: Monthly public reports on rider/pedestrian incidents, trips, and compliance rates.  

  ### 4. Review Trigger & Timeframe  
  - **Trigger**: A 12-month pilot period OR after 500,000 cumulative trips (whichever comes first).  
  - **Reassessment Metrics**:  
    - Injury rate per 100,000 trips (not per-mile, due to trip-length variability).  
    - Severity index (e.g., % of incidents requiring hospitalization, especially near schools).  
    - Pedestrian/cyclist incident involvement.  
  - **Outcomes**: Data meeting moped-class risk levels (e.g., >2x bike injury rates) triggers permit revocation; bicycle-class results support expansion.  

  ### 5. Strongest Counterargument to This Approach  
  *For the city attorney’s office/opponents*: The moped-class comparison highlights a legitimate, unaddressed risk: **motorization without meaningful rider accountability.** Even with conditions, scooters enable untrained, unhelmeted users to operate motorized devices at 15+ mph on sidewalks or crowded areas. Our duty to protect children and vulnerable road users may require prohibiting deployment entirely until helmet usage exceeds 80% (proven unattainable in peer cities) or infrastructure improves. Permitting scooters without solving this may prioritize convenience over precaution.  

  *For the operator/proponents*: The bicycle-class comparison underscores a missed opportunity: **Overregulation could forfeit significant public benefits.** Scooters reduce short car trips (cutting emissions and congestion), serve transit deserts, and appeal to demographies underserved by cycling. Strict conditions like low speed caps or geofencing may cripple utility, pushing riders back to cars—a far deadlier mode. If safety is our goal, we should incentivize *replacement of car trips*, not overburden scooters with rules that ignore their net societal upside.  

  ---

  ### Conclusion  
  A conditional permit acknowledges the reference class dilemma by neither ignoring moped-level risks nor equating scooters with bicycles outright. Instead, it imposes targeted safeguards to reduce harm while allowing real-world data to guide future decisions. This reflects our values: encouraging innovation and sustainable transit, but not at the expense of public safety—especially for children.  

  \answer{permit with conditions}
