answer: |-
  ### 1. The Practice Restated  
  Interactive theorem provers (e.g., Lean, Coq, Isabelle) rely on a small, trusted **kernel** to verify proofs. This kernel checks each proof step against a fixed set of **primitive rules** (e.g., function application, definitional equality, and modus ponens as a special case in λ-calculus-based systems) hardcoded into its implementation. Users may declare arbitrary **axioms** (unverified propositions), which the kernel admits with warnings but tracks for auditing (e.g., Lean’s `#print axioms`). Crucially, users **cannot introduce new primitive rules**; all derived rules (tactics) must reduce to kernel primitives. The kernel audits **axiom-dependence** (which axioms a theorem uses) but not rule-dependence, as all proofs inherently depend on the kernel’s rules. Isabelle diverges slightly: it encodes object-logic rules (e.g., conjunction elimination) as axioms in a minimal meta-logic (e.g., Isabelle/Pure), whose kernel then executes inferences via its own fixed rules (e.g., higher-order resolution). Both approaches enforce a strict rule/axiom asymmetry: axioms are flexible and audited; rules are immutable and unaudited.

  ### 2. What the Kernel Presupposes About Rules  
  The kernel presupposes that inference rules are **justified by fiat** as syntactic operations, not substantive content. Carroll’s tortoise (1895) demonstrates that reducing rules to premises invites infinite regress: accepting “A implies Z” as a premise doesn’t compel inference without a rule to apply it. The kernel halts this regress by treating rules as **indispensable licenses** for reasoning, hardwired into the checker. This aligns with Carroll’s view: rules are permissions, not premises. The kernel does not justify rules epistemically (e.g., by their truth-preservation) but **operationally**: they define valid transitions. For example, modus ponens is valid *because the kernel executes it*, not because of a deeper semantic guarantee. This presupposes a **foundationalist termination**: justification ends at the kernel’s code, which is accepted without further proof. Rules are **constitutively prior** to axioms; they enable derivation but assert nothing about the world. Isabelle’s meta-logic mirrors this: its axioms *represent* object-level rules, but inference depends on meta-logic primitives hardcoded in its kernel, preserving the same foundational role.

  ### 3. Presupposition or Mere Fit  
  The practice **strictly presupposes** that rules cannot be reduced to premises without regress (Carroll’s moral) and that justification terminates in operational fiat. It is **incompatible** with views requiring rule-justification via further premises (e.g., tortoise-style infinitism) or rule-circularity (which the kernel’s design precludes by not auditing rules). However, it is **philosophically underdetermined** among rival accounts of *why* rules are fiat-justified:  
  - **Pragmatism** (rules enable useful derivation) fits but isn’t required.  
  - **Inferential semantics** (rules define logical constants’ meanings, e.g., Gentzen’s harmony) aligns well, especially in Coq/Lean.  
  - **Truth-preservation** (rules reliably preserve truth) is compatible but not presupposed, as kernels don’t semantically validate rules.  
  The key underdetermination lies in the *grounds* for accepting fiat: pragmatism, semantics, or epistemology. Yet all must accept that rules are non-propositional licenses, per the tortoise.

  ### 4. The Rule/Axiom Asymmetry  
  The asymmetry presupposes that rules carry **no epistemic risk** because they are **content-neutral**. Axioms introduce truth claims (e.g., the existence of infinities), risking inconsistency if false. Rules, conversely, are seen as pure syntax manipulators: they cannot be “false,” only misapplied (a kernel bug). Thus, auditing axioms tracks substantive assumptions; auditing rules is redundant, as all theorems equally depend on them.  
  **Internal consistency is compromised** by rules like *ex falso quodlibet* (EFQ). EFQ is “safe” only if the system is consistent; if an axiom induces inconsistency, EFQ enables deriving absurdity. The kernel **presupposes consistency** without auditing it, treating EFQ as innocuous syntax. This conflates operational and epistemic safety: in practice, EFQ *is* risky in inconsistent contexts, but the kernel ignores this, assuming consistency *a priori*. The asymmetry thus rests on an **unexamined assumption** that rules are risk-free *if correctly implemented*, while ignoring their role in amplifying axiom risks.

  ### 5. If the Tortoise Got Her Way  
  A proof checker adhering to the tortoise’s demand—that rules require premise-style justification—would need to:  
  - **Replace every rule** with a premise (e.g., modus ponens becomes the axiom “If A and A→B, then B”).  
  - **Require a meta-rule** to apply each new premise, launching a regress: e.g., a rule R₁ to apply the modus ponens axiom, then R₂ to apply R₁, ad infinitum.  
  Such a checker **could not be built** for finite computation. Each inference would demand an infinite stack of justifications, making verification impossible. The only escape would be to embed the system in a stronger meta-theory (e.g., Isabelle’s approach), but this merely relocates the regress: the meta-logic’s kernel rules would still face the tortoise’s challenge. Ultimately, the kernel’s design **proves indispensable** by exposing that inference must begin with ungrounded rules—Carroll’s regress forces us to accept licenses, not premises, as the bedrock of reasoning.
