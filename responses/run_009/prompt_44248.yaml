prompt: |-
  Before I take a side on whether the knowledge argument refutes physicalism, I want a specification of what an adequate theory of Mary's post-release gains must deliver — the argument gets argued badly on all sides, and I suspect the real disagreements are about what counts as success. Write the desiderata: which variants of the thought experiment the account has to handle (for instance, a release in which the first colored object Mary sees is a blue banana described to her as ripe, or a Mary who is color-blind rather than color-deprived, or a Mary who grew up in the room and has never seen her own face); which distinctions it must respect (between acquiring new information, new concepts, new abilities, and new acquaintance; between not knowing a fact and lacking a mode of access to it; between what Mary can deduce and what she can imagine); what it must say about whether Mary's stipulated omniscience about the physical facts already includes indexical and self-locating knowledge, and whether including or excluding it changes the argument; and what it owes us about the inference from "Mary learns something" to "some facts are non-physical" — is that an application of a closure principle, a suppressed premise about fact individuation, or a non sequitur? Give the case or consideration behind each requirement, and mark which are non-negotiable and which are prejudices of one camp (physicalists and dualists want different things from the case, and part of the deliverable is separating genuine adequacy conditions from wish lists). Flag any pair of desiderata you suspect cannot be jointly satisfied — for example, whether an account can both explain Mary's surprise and deny that anything she gains is truth-apt, or whether treating her pre-release state as genuinely omniscient is compatible with her being surprised at all. Then, in a closing paragraph only, run the ability hypothesis, the phenomenal-concept strategy, and Jackson's own later recantation against the list. Keep the weight on the criteria and their motivating cases, not on the scorecard.
reasoning: |-
  Okay, the user wants a detailed specification of what an adequate theory of Mary's post-release gains must deliver. They mentioned handling different variants of the thought experiment, respecting certain distinctions, addressing indexical knowledge, and the inference from learning to non-physical facts. They also want to know which desiderata are non-negotiable versus which might be biased, and if any conflict.

  First, I need to recall the original Mary's Room thought experiment. Mary learns all physical facts in a black-and-white room but gains something new when she sees red for the first time. The question is whether this new knowledge refutes physicalism. The user wants criteria for evaluating theories about what Mary gains.

  The user listed several variants: blue banana (misleading info), color-blind Mary (different deprivation), Mary never seeing her own face (indexical knowledge). Each variant tests different aspects of the argument. For example, the blue banana case challenges whether the gain is about truth or acquaintance. The color-blind scenario tests if the lack is conceptual or perceptual. Including these ensures the theory isn't tailored to the original setup.

  Next, distinctions like new information vs. new concepts vs. abilities vs. acquaintance. Physicalists might argue Mary gains abilities or acquaintance rather than factual knowledge. Dualists would say she learns new truths. The theory must clarify these to avoid talking past each other. Also, the difference between not knowing a fact and lacking access to it is crucial. If physicalism includes all facts, but Mary couldn't access them due to her confinement, that might save physicalism without positing non-physical facts.

  Indexical knowledge is another key point. If Mary's pre-release knowledge includes self-locating facts (e.g., "I am in room 101"), does that change what she gains upon release? If she sees her face for the first time, is the new knowledge about her appearance or just the experience? This affects whether the new knowledge is indexical or phenomenal.

  The inference from learning to non-physical facts needs unpacking. Does Mary learning something new imply non-physical facts? Or is it a non sequitur? The theory must address whether the inference relies on closure principles, fact individuation, or something else. This is central to the argument's validity.

  The user also wants to flag which desiderata are non-negotiable. For example, handling the core case is essential, but specific variants might be optional. Also, distinguishing between types of gains is fundamental. However, requiring that physicalism includes indexical knowledge might be contentious. Physicalists might insist it does, while dualists might disagree.

  Conflicting desiderata: If Mary is truly omniscient, can she still be surprised? A theory claiming she gains no new truth might struggle to explain her surprise. Similarly, if she gains abilities, why is she surprised? The explanation must reconcile these.

  Finally, applying major responses (ability hypothesis, phenomenal concepts, Jackson's recantation) against the list. Ability hypothesis says Mary gains abilities, not knowledge. Does this handle the blue banana case? If she's misled, she might form incorrect beliefs, suggesting she gains more than abilities. Phenomenal concepts strategy posits new concepts for the same facts. But in the color-blind case, could she deploy these concepts without experience? Jackson's recantation introduces representational states, but does it address indexical knowledge adequately?

  Need to ensure the closing paragraph only summarizes these responses without adding new arguments. Highlight how each response meets or fails the criteria, focusing on the desiderata.
answer: |-
  Here is a specification of desiderata for an adequate account of Mary's post-release gains, grounded in the argument's complexities and designed to separate genuine adequacy conditions from partisan wishes:

  **Core Desiderata (Non-Negotiable):**

  1.  **Handle the Core Case:** Must explain what Mary gains upon *first-personally experiencing* red for the first time (e.g., seeing a red tomato), having known *all* physical information relevant to color vision prior to release.
      *   *Motivation:* The original thought experiment. Failure here means the account doesn't address the central challenge.
  2.  **Respect the "Gains Something" Intuition:** Must acknowledge a genuine, significant epistemic difference between Mary's pre-release and post-release states. It cannot trivialize her experience as "nothing new" in a way that contradicts the core phenomenological intuition driving the argument.
      *   *Motivation:* The argument's starting point: Mary *does* learn something. Denying this outright is widely seen as implausible and begs the question against the argument.
  3.  **Distinguish Gains Precisely:** Must clearly characterize the *nature* of the gain relative to canonical epistemic categories:
      *   *New Propositional Knowledge (Truth-Apt Facts)?* If yes, what fact(s)?
      *   *New Conceptual Competence?* If yes, what concepts, and why couldn't she possess them before?
      *   *New Abilities (e.g., Recognition, Imagination)?* If yes, are these purely functional?
      *   *New Acquaintance (Direct Phenomenal Access)?* If yes, how does it differ from knowing *about*?
      *   *Motivation:* The central ambiguity fueling the debate. Physicalists often favor non-propositional gains (abilities, acquaintance, concepts); dualists favor propositional (non-physical facts). An account must *commit* and explain *why* the chosen category fits.
  4.  **Explain Surprise:** Must explain *why* Mary is surprised or has an "Aha!" moment upon seeing red, even given her exhaustive physical knowledge. It must make her reaction intelligible.
      *   *Motivation:* A key phenomenological datum. Her surprise strongly suggests an epistemic gap beyond mere functional limitation.

  **Handling Variants & Edge Cases (Necessary for Robustness):**

  5.  **Handle Misleading Release ("Blue Banana"):** Must account for Mary seeing a blue banana described as "ripe" (implying yellow/red). Does she gain the *same thing* as when seeing a red tomato? Can she *misapply* her new gain? Does she know it's blue, or just that it's *not* ripe-red?
      *   *Motivation:* Tests if the gain is fundamentally about *truth* (she might misidentify blue as ripe-red) or about *acquaintance/ability* (she gains access to *this* blue experience, regardless of the misdescription). Challenges purely ability-based accounts.
  6.  **Handle "Color-Blind Mary":** Must explain what Mary gains (or doesn't) if she was *neurologically color-blind* from birth and learns all physical facts, but then gains normal vision via a cure. Does she gain something *different* than the originally sensorily-deprived Mary?
      *   *Motivation:* Tests if the deprivation is merely sensory or also conceptual/representational. Highlights the role of innate perceptual capacities vs. learned knowledge. Challenges accounts relying solely on acquiring new *concepts*.
  7.  **Handle Indexical/Self-Locating Knowledge ("Never Seen Her Face"):** Must explicitly state whether Mary's stipulated pre-release physical omniscience *includes* or *excludes* indexical/self-locating knowledge (e.g., "I am Mary," "I am in room 101," "My hair looks like *this*"). Crucially, must explain how this choice impacts the argument.
      *   *Motivation:* A major point of contention. Physicalists often argue that *excluding* such knowledge creates a straw man; including it might dissolve the gap (e.g., she gains "this is what red looks like *to me now*"). The account must be consistent and show why its chosen interpretation is correct and how it affects Mary's gains (e.g., seeing her face might involve indexical *and* phenomenal gains).
  8.  **Distinguish Deduction from Imagination:** Must explain why Mary couldn't *deduce* the relevant information pre-release, and whether this failure extends to *imagining* the experience accurately.
      *   *Motivation:* Central to the "new knowledge" claim. If she could deduce/imagine it, there's no gap. Accounts must pinpoint the specific cognitive limitation pre-release.

  **The Inference & Metaphysical Implications (Crucial for Engaging the Argument's Goal):**

  9.  **Clarify the Inference to Non-Physical Facts:** Must explicitly address the inference from "Mary gains something epistemic (X)" to "Therefore, there are non-physical facts (or properties, etc.)". Specifically:
      *   Is it relying on a closure principle (If P entails Q, and S knows P, then S knows Q)? If so, defend it.
      *   Does it hinge on a specific principle of fact individuation (e.g., that differences in epistemic access entail differences in facts known)? If so, defend *that*.
      *   Is the inference valid only for specific interpretations of "gains X" (e.g., only if X is propositional)?
      *   *Motivation:* The entire point of the argument. An adequate account must show *how* (or *if*) Mary's gain challenges physicalism, not just describe the gain. It must expose the metaphysical commitments of the inference.

  **Potential Tensions & Camp-Specific Biases:**

  *   **Non-Negotiable vs. Wish Lists:**
      *   **Non-Negotiable (Minimal):** 1 (Core Case), 2 (Gains Something), 4 (Explain Surprise), 9 (Address Inference) - These are required to even engage the argument seriously.
      *   **Physicalist-Leaning Wish:** Strong preference for gains being non-propositional (abilities, acquaintance, concepts) to block the non-physical inference (#9). May downplay #7 (indexicals) by insisting they are physical or argue #8 (imagination failure) doesn't imply new facts. May see #5 (Blue Banana) as supporting their view.
      *   **Dualist-Leaning Wish:** Strong preference for gains being propositional (new facts) to directly support the inference (#9). May emphasize #3 (distinguishing propositional gains) and see #6 (Color-Blind Mary) as still supporting their case. May downplay #7 (indexicals) as irrelevant or argue they don't exhaust the gain.
  *   **Suspected Tensions:**
      *   **Omniscience vs. Surprise:** Can an account consistently maintain Mary was *truly omniscient* pre-release regarding *all physical facts* (#7 interpretation) *and* give a robust, non-trivial explanation for her surprise (#4)? Physicalists emphasizing indexicals often weaken "omniscience"; dualists often strengthen it to make the gap clear.
      *   **Surprise vs. Non-Truth-Apt Gain:** Can an account robustly explain Mary's surprise (#4) if what she gains is *not* truth-apt (e.g., mere abilities or acquaintance - #3)? Why is she surprised by acquiring an ability? This is a major challenge for pure ability/acquaintance views.
      *   **Ability Gain vs. Blue Banana:** Can an account claiming Mary gains *only* recognitional abilities (#3) explain the Blue Banana case (#5) where she likely gains a *specific* phenomenal experience (of blue) that contradicts the description ("ripe")? The gain seems tied to the *actual experience*, not just an ability triggered by it.

  **Applying Major Responses (Closing Paragraph Only):**

  *   **Ability Hypothesis (Lewis/Nemirow):** Claims Mary gains *abilities* (recognize, imagine) not new facts. *Against List:* Handles #1, #2 (weakly, trivializing surprise?), #3 (specifies gain type), #7 (indexicals irrelevant/covered). Fails robustly on #4 (why surprise?), #5 (struggles with misapplication/misidentification), #8 (why no deduction/imagination? - claims she *can* imagine if she has ability). Directly blocks #9 inference by denying new facts.
  *   **Phenomenal Concept Strategy (PCS - Loar, Papineau, etc.):** Claims Mary gains new *concepts* (phenomenal) for physical states, enabling new modes of thought/knowledge-that, not new facts. *Against List:* Handles #1, #2, #3 (specifies concepts), #4 (explains surprise via conceptual novelty), #5 (concept applies to experience), #6, #8 (deduction impossible without concept). Ambiguous on #7 (often includes indexicals). Attempts to block #9 inference by arguing new concepts access old facts.
  *   **Jackson's Recantation (Representationalism):** Claims Mary gains new *representational knowledge* (how experiences represent the world), which is physical. *Against List:* Handles #1, #2, #3 (new representational knowledge/ability), #4 (surprise from new representational state). Addresses #7 (indexicals physical), #8 (deduction limited). Claims to handle #9 by offering a physicalist account of the gain. Faces challenges explaining the *qualitative* aspect (#2, #4) and robustness across variants like #5 and #6 compared to PCS.
