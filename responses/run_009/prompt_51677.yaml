    "binding_constraint": ["rationing_rules", "pre_sorting"],
    "why_constraint": "Underfilled boats prove capacity wasn't the limit; 'women & children first' and locked gates preventing steerage access were the fatal constraints.",
    "strongest_scene": "Steerage passengers barred by locked gates as water rises",
    "why_strongest": "Visually crystallizes how Hardin's 'lifeboat' metaphor ignores pre-existing social sorting that determines survival long before a crisis.",
    "resisting_scenes": [
      "Rose jumping from Lifeboat 6 back onto the sinking ship",
      "The string quartet continuing to play 'Nearer My God to Thee'",
      "Molly Brown demanding the half-empty lifeboat return for survivors"
    ],
    "film_adds": "The visceral horror of rationing rules in action, the weight of class barriers as physical imprisonment, and the defiant human choices (love, art, solidarity) that transcend survivalist logic."
  }
  ```

  **Key Takeaway**: Cameron’s *Titanic* uses historical disaster not to validate Hardin, but to expose the lethal consequences of his metaphor’s blindness to pre-existing injustice and the inefficiency of aristocratic virtue ethics. The real tragedy wasn’t too few lifeboats, but too many gates.
