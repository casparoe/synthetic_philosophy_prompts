  The ownership criterion is crucial. By defining counterfactual lives through psychological continuity rather than origins, they deliberately challenge essentialist views. This isn't circular - it forces essentialists to defend why origins matter more than consciousness. The strongest Epicurean counterattack would likely target this very point, insisting that the "b-1" person fundamentally isn't you. 

