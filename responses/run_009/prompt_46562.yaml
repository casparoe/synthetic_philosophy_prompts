answer: |-
  Here is an essay question designed to meet your specifications, followed by a model answer, marking scheme, and a brief note on the framing:

  ---

  ### Essay Question (90-minute in-class final)
  **"The dispute between Mencius and Xunzi over human nature (xing) is often summarized as: Mencius sees xing as inherently good, while Xunzi sees it as inherently bad. However, one influential interpretation argues this disagreement is merely *verbal*—that each philosopher defines xing differently, making their claims compatible. Mencius includes spontaneous proto-moral reactions (e.g., alarm at a child falling into a well) in xing, while Xunzi restricts xing to raw, pre-cultivated instincts. On this view, their arguments are both valid relative to their definitions, and nothing substantive is at stake.  
  Yet others insist the dispute is *substantive*: their definitions reflect deeper disagreements about spontaneity, cultivation, and ritual’s role.  
  Adjudicate this debate. Is the Mencius–Xunzi dispute primarily verbal, substantive, or neither? In your analysis, engage *both* the ‘child-at-the-well’ case (Mencius 2A:6) and Xunzi’s metaphor of ‘straightening wood’ (Xunzi 23). Explain why your resolution matters for understanding their views on education or ritual."**

  ---

  ### Model Answer (598 words)
  The verbal-dispute reading captures a surface truth but obscures the profound philosophical stakes in the Mencius–Xunzi debate. While definitions of *xing* differ, these differences are neither arbitrary nor isolable from substantive commitments about agency, ethics, and social intervention. The dispute is *neither* purely verbal *nor* purely substantive; it is a clash over how to conceptualize human potential, where definitions themselves carry normative weight.  

  Mencius’ well-child thought experiment (2A:6) is not merely evidence for his definition but a *challenge* to Xunzi’s. He claims anyone would feel “alarm and compassion” spontaneously—prior to cultivation—implying this reaction is innate and *moral* (proto-ren). Crucially, Mencius frames this as “not for gaining friendship with the child’s parents” or avoiding shame, attacking the idea that virtue requires external conditioning. For Mencius, this spontaneity proves *xing* must include incipient moral tendencies. If Xunzi excludes such reactions from *xing*, he must dismiss the well-child case as irrelevant or misdescribed—which he pointedly does not. Instead, Xunzi reinterprets spontaneity: he acknowledges instinctive reactions but labels them “raw material” (e.g., love for kin), insisting they lack *moral* structure until ritualised (Xunzi 23). His definition of *xing* as “what is heavenly endowed, unattainable by effort” excludes cultivated traits precisely to argue that *all* moral agency is artifice. Thus, their definitions are not neutral starting points but weapons forged in opposition.  

  This shapes their divergent visions of cultivation. Mencius’ agricultural metaphors (e.g., nurturing sprouts) imply moral growth is organic yet fragile; education *protects* innate tendencies from corruption. Xunzi’s carpentry metaphors (e.g., “straightening warped wood”) present cultivation as forceful correction of inherently flawed material. Here, the verbal dispute bleeds into substance: if compassion is innate (Mencius), ritual *channels* spontaneous impulses; if not (Xunzi), ritual *imposes* order on chaos. Education, for Xunzi, becomes a radical transformation—“the steeping and straightening of the straightening-board” (Xunzi 23)—while Mencius warns against “pulling on sprouts” (2A:2).  

  The polemical heat confirms deep stakes. Xunzi’s explicit attacks on Mencius (e.g., “Mencius has no understanding of human nature”) go beyond semantics; he fears that trusting innate tendencies invites complacency and disorder. Mencius’ insistence on innate goodness, meanwhile, challenges Xunzi’s authoritarianism by locating moral authority within individuals. Their definitions of *xing* are thus inseparable from *what ethics demands of us*: spontaneous moral intuition versus lifelong ritual discipline.  

  Ultimately, the verbal-dispute reading fails because it treats definitions as static premises rather than dynamic interventions. Mencius expands *xing* to include moral potential precisely to ground ethics in human accessibility; Xunzi narrows it to expose our dependence on sage-kings. This is neither a tomato/fruit equivocation nor a straightforward factual disagreement. It is a contest over the *grounds* of ethical life—one where the definition of *xing* itself determines whether ritual expresses or overrides our nature. Resolving this illuminates why Chinese ethics pivoted on *xing*: the term anchors irreconcilable visions of human perfectibility.

  ---

  ### Marking Scheme (Total: 20 marks)
  **A Answer (17–20 marks) must:**  
  1. **Explicitly reject or transcend the verbal/substantive dichotomy** (4 marks).  
     *Loses marks if:* Treats the dichotomy as exhaustive (e.g., "it's substantive, not verbal").  
  2. **Analyze the well-child case as Mencius’ challenge to Xunzi’s definition** (4 marks).  
     *Loses marks if:* Only describes the case as evidence for Mencius’ view without engaging Xunzi’s potential rebuttal.  
  3. **Link definitions of *xing* to cultivation metaphors (sprouts/wood)**, showing how they imply divergent educational goals (4 marks).  
     *Loses marks if:* Contrasts metaphors without tying them to *xing* definitions.  
  4. **Explain Xunzi’s polemics as evidence of substantive stakes** (e.g., disorder vs. complacency) (4 marks).  
     *Loses marks if:* Attributes hostility to personality or historical context alone.  
  5. **Conclude why the dispute matters for ritual/education** (4 marks).  
     *Loses marks if:* Restates differences without showing implications (e.g., "ritual guides vs. corrects").  

  **B Answer (13–16 marks) typically:**  
  - Accurately contrasts Mencius and Xunzi but treats definitions as isolated premises.  
  - Describes the well-child case as "proof" of innate goodness without dissecting Xunzi’s counter.  
  - Lists metaphors (sprouts vs. wood) but doesn’t connect them to *xing*’s scope.  
  - Notes polemics but doesn’t tie them to ethical consequences.  
  - Generalizes ritual’s role (e.g., "both value ritual but differently").  

  ---

  ### Note on the Verbal/Substantive Dichotomy
  Your friend’s framing risks anachronism by imposing a modern analytic dichotomy onto a classical debate where definitions *are* substantive. In early Chinese thought, fixing terms (*zhengming*) was never "merely verbal"; it was ethico-political. Mencius and Xunzi aren’t botanists labeling tomatoes—they’re theorists defining *xing* to support rival visions of human flourishing. Xunzi’s hostility makes sense only if redefining *xing* alters *what we must do to become good*. The "confusion" lies in assuming definitional disputes can’t be high-stakes; in Chinese philosophy, they’re often where the stakes are highest. The model answer thus rejects the dichotomy by showing how *xing* functions as a contested foundation for ethics.

  This structure forces students beyond rote contrasts by centering the *debate about the debate*. The marking scheme rewards dialectical engagement with both readings while demanding textual precision. If you’d like a simplified rubric or adjustments for length, I can refine this further.
