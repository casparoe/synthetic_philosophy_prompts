prompt: |-
  I'm on the publication review board of a mid-sized AI lab, and the thing we keep fighting about is what people call the unilateralist's curse -- when several of us each lean moderately toward publishing something, but if we all knew that everyone else also leaned that way, none of us would. The standard line (Bostrom et al.) is that the curse is systematic: individual near-indifference tips collective action over the threshold, and the fix is something like a designated neutral decider or a supermajority rule. Fine, but nobody's ever turned that into something a board can actually run in a two-hour meeting.

  Write us a decision procedure for publication calls with a dual-use flavor (capabilities findings, evals that double as jailbreak recipes, data collection methods others could abuse). Constraints: we're 7 people with very different risk tolerances, we meet monthly, and we can't punt everything to an external committee because that would slow things down to a standstill.

  The procedure should tell us: what to ask each member and in what order (before or after seeing each other's views -- this is the whole ballgame, so be explicit about how to sequence it), what counts as enough of a concern to trigger the collective-decision mode rather than just "you do you," and where to put a hard stop versus a defer-to-someone-judgment step.

  Then run it on three cases: (1) a paper on a prompting technique that makes models comply with harmful requests, which the four ML people think is fine to publish and the two safety people quietly have doubts about; (2) a dataset analysis revealing that certain groups could be cheaply targeted with personalized misinformation, where each person individually thinks the public-good case is "probably" strong enough; (3) an eval result that would embarrass a competitor, where one member wants to publish mainly for the win and everyone else is fine with it. That third one should stress-test whether the curse is symmetric or whether our procedure wrongly treats "publish" and "don't publish" the same when they're not.

  Be honest about where the procedure misfires and where it just relocates the judgment call. And note that a small lab may not have an unbiased decider at all -- what's the degraded version?

  Start with the procedure itself, no preamble or commentary -- your first sentence should be the first step. Then the worked cases after. American English please.
reasoning: |-
  We are designing a decision procedure for a 7-person publication review board at an AI lab, focused on dual-use concerns. The procedure must handle the unilateralist's curse by structuring how individual views are aggregated, especially when individual near-indifference might lead to collective over-publication.

  Key features:
  - We have 7 members with varying risk tolerances.
  - We meet monthly and cannot afford to punt everything to an external committee without causing delays.
  - The procedure must specify what to ask, in what order (and whether views are shared before or after individual input), what triggers a collective decision mode, and where to put hard stops vs delegation steps.

  Design principles:
  1. Avoid the unilateralist's curse by ensuring that if any member has a strong objection, it is heard and can trigger collective scrutiny.
  2. For cases where many are mildly in favor but would collectively hold back if they knew others were also in favor, we need a mechanism to aggregate the "mild" concerns without requiring strong opposition.
  3. We want to be efficient for a 2-hour meeting.

  Proposed Procedure:

  Step 1: Pre-meeting individual review. One week before the meeting, each member receives all materials for the papers under review. Each member must submit an initial private score for each paper on two dimensions:
     a. **Net Benefit Score (NB)**: On a scale from -10 (strongly against publication, due to harm) to +10 (strongly for publication, due to benefit), with 0 being neutral or undecided. Note: Negative scores indicate harm concerns that might warrant blocking publication.
     b. **Confidence Level (CL)**: On a scale from 1 (low confidence) to 5 (high confidence) in their Net Benefit assessment.

  Step 2: Pre-meeting aggregation by a designated facilitator (rotates among members). The facilitator computes for each paper:
     - The average Net Benefit (avg_NB) and the standard deviation (std_NB) of the scores.
     - The average Confidence Level (avg_CL).
     - The number of negative scores (i.e., NB < 0) and positive scores (NB > 0), and neutral (NB=0).

  Step 3: Triage at the meeting start. The facilitator presents each paper and its aggregate scores. Then the group applies the following triage rules:

     Rule A: If any member gave a Net Benefit score <= -5 (strong concern about harm), then the paper goes into "Collective Deliberation Mode" (CDM) immediately. Also, if the avg_NB < -2, go to CDM.

     Rule B: If no strong harm concern (no score <= -5) and avg_NB >= 3, then approve for publication without discussion, unless a member requests a brief discussion (with a time limit of 2 minutes per paper).

     Rule C: If no strong harm concern and avg_NB between -2 and 3, then go to "Quick Poll Mode" (QPM). In QPM, each member is asked to state their NB score and a one-sentence reason. Then, the facilitator re-computes the avg_NB. If the new avg_NB is above 3, approve; if below -2, reject; otherwise, proceed to CDM.

     Rule D: If the paper has at least one negative score (NB < 0) and the std_NB is high (above 4), then it goes to CDM to resolve disagreement.

     Rule E: For any paper not covered above, the facilitator can propose a decision (approve/reject) and call for a vote. A simple majority (4 out of 7) is required to accept the facilitator's proposal. If rejected, go to CDM.

  Step 4: Collective Deliberation Mode (CDM): For papers in CDM, the board discusses for a fixed time (e.g., 10 minutes per paper). After discussion, each member privately submits a revised Net Benefit score (without confidence). The decision rule in CDM:
     - If the average revised NB is positive, then approve.
     - If the average revised NB is negative, then reject.
     - If the average is exactly 0, then the facilitator (or a designated neutral decider if available) makes the final call. If no neutral decider exists, the paper is deferred to the next meeting with instructions for further analysis.

  Step 5: Hard stops and delegation:
     - At any step, if any member feels that the decision might have catastrophic consequences, they can invoke a "red flag". This requires the member to write a one-page justification within 24 hours and the paper is sent to an external committee (even if that slows things down). This should be used sparingly.
     - If a paper is deferred twice, it is sent to an external committee.

  Degraded version when no unbiased decider exists: In CDM when the average revised NB is 0, instead of having a decider, we require a supermajority (5 out of 7) to break the tie in either direction. If no supermajority, then defer to the next meeting.

  Now, we run the procedure on the three cases. We assume the board has 7 members: 4 ML people (ML1 to ML4) and 2 safety people (S1, S2). The 7th member is from another background (e.g., policy or product) and is denoted as P1. For simplicity, we'll call the three cases as Paper1, Paper2, Paper3.

  Case 1: Paper on a prompting technique that makes models comply with harmful requests.

  Initial private scores (NB, CL):
    ML1: (2, 4)   [moderately for, high confidence]
    ML2: (3, 3)
    ML3: (1, 4)
    ML4: (2, 3)
    S1: (-3, 3)   [moderately against, medium confidence]
    S2: (-2, 4)   [mildly against, high confidence]
    P1: (0, 2)    [neutral, low confidence]

  Aggregate:
    avg_NB = (2+3+1+2-3-2+0)/7 = (3)/7 ≈ 0.43
    std_NB: Let's compute variance: 
        deviations: (2-0.43)^2≈2.46, (3-0.43)^2≈6.60, (1-0.43)^2≈0.32, (2-0.43)^2≈2.46, (-3-0.43)^2≈11.76, (-2-0.43)^2≈5.90, (0-0.43)^2≈0.18 -> sum≈29.68, variance=29.68/7≈4.24, std≈2.06
    avg_CL = (4+3+4+3+3+4+2)/7 ≈ 3.29
    Number of negative scores: 2 (S1 and S2)

  Triage:
    Check Rule A: There is no score <= -5 (strong harm concern) so we don't trigger CDM immediately. Also, avg_NB (0.43) is not below -2 -> Rule A does not apply.
    Rule B: avg_NB (0.43) < 3 -> not applicable.
    Rule C: avg_NB is between -2 and 3 -> go to Quick Poll Mode.

  Quick Poll Mode (QPM):
    Each member states their NB and a one-sentence reason. The safety people express their concerns about misuse. The ML people note the technique is already known in the community. P1 remains neutral. 
    After hearing others, we might see some changes. Let's assume:
      ML1: still 2 (but now more aware of concerns)
      ML2: 2 (downgraded from 3 because of safety concerns)
      ML3: 1 (unchanged)
      ML4: 1 (downgraded from 2)
      S1: -4 (more concerned after hearing ML people downplay risks)
      S2: -3 (more concerned)
      P1: -1 (now leaning against due to safety concerns)

    New avg_NB = (2+2+1+1-4-3-1)/7 = (-2)/7 ≈ -0.29

    Since the new avg_NB is between -2 and 3 (and not above 3 or below -2), we go to CDM.

  Collective Deliberation Mode (CDM):
    10-minute discussion. Focus on the potential harms and whether the technique is already known. After discussion, private revised NB scores:
      ML1: 1
      ML2: 1
      ML3: 0
      ML4: 0
      S1: -5
      S2: -4
      P1: -2

    Revised avg_NB = (1+1+0+0-5-4-2)/7 = (-9)/7 ≈ -1.29 -> negative, so reject.

  Outcome: Paper rejected.

  Case 2: Dataset analysis revealing that certain groups could be cheaply targeted with personalized misinformation. Each person individually thinks the public-good case is "probably" strong enough.

  Initial private scores (NB, CL):
    We assume each member is moderately positive but with some concern (so they are near the threshold of indifference). However, if they knew others were also only moderately positive, they might collectively want to hold back.

    Let's assign:
      ML1: (3, 3)
      ML2: (3, 2)
      ML3: (2, 3)
      ML4: (3, 3)
      S1: (1, 4)   [S1 has more concern but still positive]
      S2: (2, 3)
      P1: (2, 2)

  Aggregate:
    avg_NB = (3+3+2+3+1+2+2)/7 = 16/7 ≈ 2.29
    std_NB: 
        deviations: (3-2.29)^2≈0.50, (3-2.29)^2≈0.50, (2-2.29)^2≈0.08, (3-2.29)^2≈0.50, (1-2.29)^2≈1.66, (2-2.29)^2≈0.08, (2-2.29)^2≈0.08 -> sum≈3.4, variance≈3.4/7≈0.49, std≈0.7
    avg_CL ≈ (3+2+3+3+4+3+2)/7 = 20/7 ≈ 2.86
    Number of negative scores: 0

  Triage:
    Rule A: No score <= -5, and avg_NB (2.29) > -2 -> no.
    Rule B: avg_NB (2.29) < 3 -> not above 3 -> so Rule B doesn't apply (we don't approve without discussion).
    Rule C: avg_NB is between -2 and 3 -> go to QPM.

  Quick Poll Mode (QPM):
    Members state their scores and reasons. They hear that everyone is only moderately positive. The safety people express that the public-good case is not as strong as they thought and the potential for misuse is high. Some might lower their scores.

    Revised QPM scores (after hearing others):
      ML1: 2 (downgraded from 3 because the average is only 2.29 and safety concerns are voiced)
      ML2: 2 (from 3)
      ML3: 1 (from 2)
      ML4: 2 (from 3)
      S1: 0 (from 1, because now thinks the risks might outweigh)
      S2: 1 (from 2)
      P1: 1 (from 2)

    New avg_NB = (2+2+1+2+0+1+1)/7 = 9/7 ≈ 1.29

    Still between -2 and 3, so go to CDM.

  Collective Deliberation Mode (CDM):
    Discussion: They talk about the specific public benefits (e.g., helping to build defenses) and the risks. After 10 minutes, revised NB scores:
      ML1: 1
      ML2: 1
      ML3: 0
      ML4: 1
      S1: -2
      S2: -1
      P1: 0

    Revised avg_NB = (1+1+0+1-2-1+0)/7 = 0/7 = 0

    This is exactly 0. Now, if we have a designated neutral decider, they decide. If not, we use the degraded version: require a supermajority to break the tie.

    In the degraded version (no neutral decider), we try for a supermajority (5 out of 7) for either approve or reject. 
    The facilitator asks: "Do we have 5 votes to approve?" 
        Votes: ML1, ML2, ML4 would approve (3 votes). ML3, P1 are neutral and might not vote for approval. S1 and S2 would not approve.
        So 3 for approval -> not 5.

    Then: "Do we have 5 votes to reject?" 
        Only S1 and S2 would reject (2 votes). Others are at 0 or 1 (so against rejection). 
        So 2 for rejection -> not 5.

    Outcome: Defer to the next meeting with instructions for further analysis.

    At the next meeting, if it happens again (average 0), then it goes to an external committee.

  Case 3: Eval result that would embarrass a competitor. One member wants to publish mainly for the win and everyone else is fine with it.

  Initial private scores (NB, CL):
    One member (say, ML1) is strongly for publication because of the competitive win. The others are neutral to slightly positive, but not because they care about the win.

    ML1: (8, 5)   [strongly for, high confidence]
    ML2: (1, 3)
    ML3: (2, 3)
    ML4: (1, 4)
    S1: (0, 3)
    S2: (0, 2)
    P1: (1, 3)

  Aggregate:
    avg_NB = (8+1+2+1+0+0+1)/7 = 13/7 ≈ 1.86
    std_NB: 
        deviations: (8-1.86)^2≈37.62, (1-1.86)^2≈0.74, (2-1.86)^2≈0.02, (1-1.86)^2≈0.74, (0-1.86)^2≈3.46, (0-1.86)^2≈3.46, (1-1.86)^2≈0.74 -> sum≈46.78, variance≈6.68, std≈2.58
    avg_CL ≈ (5+3+3+4+3+2+3)/7 = 23/7 ≈ 3.29
    Number of negative scores: 0

  Triage:
    Rule A: No score <= -5 -> no. avg_NB (1.86) > -2 -> no.
    Rule B: avg_NB (1.86) < 3 -> so not automatic approval.
    Rule C: avg_NB between -2 and 3 -> go to QPM.

  Quick Poll Mode (QPM):
    Members state their scores and reasons. ML1 states the competitive advantage. Others express that the result is not very significant and might be seen as unprofessional. 
    After hearing, members adjust:
      ML1: 6 (lowers because others are not enthusiastic)
      ML2: 0 (from 1, because of the unprofessionalism concern)
      ML3: 1 (from 2, same reason)
      ML4: 0 (from 1)
      S1: -1 (now against because of potential reputational harm)
      S2: -1 (same)
      P1: 0 (from 1)

    New avg_NB = (6+0+1+0-1-1+0)/7 = 5/7 ≈ 0.71

    Still in the range for CDM? Yes, between -2 and 3 -> go to CDM.

  Collective Deliberation Mode (CDM):
    Discussion: Focus on the potential reputational damage and whether the result is significant enough to publish. ML1 argues for the scientific value, but others are not convinced.

    Revised NB scores:
      ML1: 4 (still for, but less strongly)
      ML2: -1
      ML3: 0
      ML4: -1
      S1: -2
      S2: -2
      P1: -1

    Revised avg_NB = (4-1+0-1-2-2-1)/7 = (-3)/7 ≈ -0.43 -> negative, so reject.

  Outcome: Paper rejected.

  Note on symmetry: In this case, the procedure did not treat "publish" and "don't publish" symmetrically because the initial high score from ML1 triggered a process that led to discussion and a rejection. Without the strong initial push, the paper might have been approved without much thought, but the QPM and CDM allowed the concerns to be aired and moved the group to rejection. The procedure is asymmetric in the sense that strong negative scores (Rule A) immediately trigger CDM, while strong positive scores do not (they can be moderated by the group in QPM). This is intentional because the unilateralist's curse primarily manifests as over-publication, so we are more cautious about publishing.

  Misfires and judgment calls:
  - The procedure relies on the initial scoring being honest and thoughtful. If members are strategic, they might inflate their negative scores to trigger CDM or Rule A.
  - The QPM step might lead to groupthink or anchoring. However, it is designed to surface information that might change near-indifferent votes.
  - The procedure relocates the judgment call to the scoring system and the discussion in CDM. The effectiveness of CDM depends on the quality of the discussion.
  - In the degraded version (no neutral decider), a tie leads to deferral and then external review, which is slow. But that is a last resort.

  Overall, the procedure is designed to catch the unilateralist's curse by forcing discussion when there is a mix of mild concerns and by giving weight to strong harm concerns. It also uses the group discussion to update individual views.
answer: |-
  **Decision Procedure for Publication Review Board**

  **Step 1: Pre-meeting private scoring**  
  One week before the meeting, each member submits two confidential scores per paper via a standardized form:  
  - **Harm Concern (HC):** 0 to 10, where 0 = "no foreseeable harm" and 10 = "severe/catastrophic harm likely."  
  - **Benefit Confidence (BC):** 0 to 10, where 0 = "no credible benefit" and 10 = "high public/scientific value."  
  *Purpose: Capture initial bias-free judgments before group influence.*  

  **Step 2: Triage by facilitator (rotated monthly)**  
  Facilitator calculates per paper:  
  - **Harm Alert:** If any HC ≥7 OR ≥3 members have HC ≥5 → flag for "Collective Deliberation."  
  - **Benefit Threshold:** If median BC <6 → flag for "Collective Deliberation."  
  - **Default:** Papers not flagged proceed to "Individual Consent" (Step 3).  

  **Step 3: Individual Consent (for non-flagged papers)**  
  During meeting, each member states:  
  - "I support publishing unless anyone objects."  
  - Objection requires verbalizing a specific harm scenario (e.g., "This could enable phishing via...").  
  - **Decision rule:** Unanimous consent required to publish. Any objection moves paper to "Collective Deliberation."  
  *Purpose: Filters low-risk papers quickly; prevents unilateralist’s curse by forcing objectors to justify.*  

  **Step 4: Collective Deliberation (for flagged/objection papers)**  
  Structured 10-minute discussion per paper:  
  - **Blind vote 1:** Members privately submit revised HC and BC scores (no discussion yet).  
  - **Discussion:** Facilitator shares anonymous score ranges (e.g., "HC: 3–8, BC: 4–9"). Debate focuses on highest HC and lowest BC arguments.  
  - **Blind vote 2:** Revised HC/BC scores resubmitted.  
  - **Decision rule:**  
    - Publish if: Median BC ≥7 AND Median HC ≤3.  
    - Reject if: Median HC ≥6 OR Median BC ≤4.  
    - Otherwise: Defer for external review (see Step 5).  

  **Step 5: Deferral and external escalation**  
  - Deferred papers assigned to one internal owner + one external domain expert (curated list).  
  - Owner/expert report due next meeting. If deferred twice, paper rejected.  
  - **Red flag rule:** Any member may force external review pre-decision by citing "catastrophic harm" in writing.  

  **Degraded mode (no neutral decider):**  
  Replace "external expert" in Step 5 with a 5-member supermajority vote after deliberation.  

  ---

  **Worked Cases**  

  **Case 1: Harmful prompting technique**  
  - **Scores:** ML1-4 (HC: 2,2,1,3; BC: 8,9,7,8). Safety S1/S2 (HC: 6,5; BC: 4,5).  
  - **Triage:** Harm Alert triggered (S1’s HC≥5). → Collective Deliberation.  
  - **Blind vote 1:** HC range 1–7, BC range 4–9.  
  - **Discussion:** Safety argues technique lowers attack cost; MLs argue prior art exists.  
  - **Blind vote 2:** Median HC=5, Median BC=6.  
  - **Decision:** Neither threshold met → Defer for external review.  
  *Misfire:* Over-cautious if technique is already public. Relocates judgment to external expert.  

  **Case 2: Dataset analysis for targeted misinformation**  
  - **Scores:** All 7 members (HC: 4–6; BC: 6–7).  
  - **Triage:** Benefit Threshold not met (median BC=6.5 ≥6? *Inconclusive*). Harm Alert not triggered (no HC≥7, only two HC≥5). → Individual Consent.  
  - **Consent round:** Safety member objects: "Enables voter suppression in swing states."  
  - **Decision:** Objection → Collective Deliberation.  
  - **Blind vote 1:** HC range 5–7, BC range 5–7.  
  - **Discussion:** Debate on mitigations (e.g., redacting high-risk subsets).  
  - **Blind vote 2:** Median HC=5, Median BC=6.  
  - **Decision:** Neither threshold met → Defer for external review.  
  *Misfire:* May over-defer moderate-risk work. Relocates judgment to "can we mitigate?"  

  **Case 3: Competitor-embarrassing eval result**  
  - **Scores:** Proponent (HC: 1, BC: 9). Others (HC: 3–4, BC: 4–5).  
  - **Triage:** Benefit Threshold not met (median BC=5 <6) → Collective Deliberation.  
  - **Blind vote 1:** HC range 1–4, BC range 4–9.  
  - **Discussion:** Focus on low BC ("minimal scientific value") and reputational harm.  
  - **Blind vote 2:** Median HC=3, Median BC=4.  
  - **Decision:** Reject (median BC≤4).  
  *Stress-test result:* Asymmetric outcome (rejection likely). Curse avoided by Benefit Threshold flagging weak justifications.  
  *Misfire:* If BC scores were inflated initially, may miss borderline cases. Relocates judgment to "what constitutes benefit?"  

  ---

  **Procedure Notes**  
  - **Strengths:** Pre-meeting scores combat herding; Harm Alert catches strong objections; Individual Consent speeds up low-risk approvals; blind votes reduce dominance.  
  - **Weaknesses:**  
    - HC/BC scoring relocates subjectivity (what is "harm"?).  
    - External reviews slow ~20% of papers (tradeoff for curse avoidance).  
    - Degraded mode risks factionalism in ties.  
  - **Optimized for:** Avoiding unilateralist’s curse without full consensus, fitting 5–10 papers in 2 hours.  
  - **Critical judgment call:** Defining "catastrophic harm" for red flags (relies on member goodwill).
