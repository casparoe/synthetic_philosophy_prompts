  1) The official doctrine strictly follows the sunk cost rule
  2) In practice, completion percentage arguments dominate gate decisions
  3) Accountability systems paradoxically make sunk costs crucial for blame

  Their key questions are about: 
  - What theories of rationality underpin these practices
  - Whether blame practices contradict the official doctrine
  - Most importantly, whether the sunk cost rule is actually a "useful fiction" to prevent dollar-auction dynamics

  The user is unusually sophisticated - they're not just asking for textbook answers but want to explore institutional contradictions. They specifically requested me to identify where my reasoning might fail, which suggests they'll critically evaluate my response.

  Let me tackle this systematically. The official doctrine absolutely presupposes a time-sliced view of rationality - the decider at each gate is treated as a new agent evaluating only future costs/benefits. But in practice, humans are temporally extended agents who experience sunk costs as psychological commitments. The completion percentage rhetoric works because it taps into loss aversion and the endowment effect - "walking away wastes everything" feels viscerally true even if logically incorrect.

  Regarding blame: there's no real contradiction here. Blame operates on control principles - you're accountable for resources you controlled, regardless of whether spending them was rational at the time. This actually complements the forward-looking doctrine by creating personal incentives to avoid sunk cost traps.

  Now the dollar auction insight is profound. The user might be onto something important: each gate decision ("just one more tranche") resembles a bidder's incremental rationale. The sunk cost rule then functions as an institutional circuit-breaker against this dynamic. But calling it a "useful fiction" goes too far - it's actually a normative commitment to consequentialism. Where this breaks down is when projects have option value or learning benefits that pure sunk-cost thinking ignores.

  If we take the auction analogy seriously, we'd need to redesign gates to: 
  - Explicitly evaluate continuation policies rather than pretending to start fresh
  - Build in external reviewers immune to project narratives
  - Create positive incentives for killing projects
  - Quantify continuation biases in advance

  But I should push back where warranted. The three practices might co-exist functionally: the doctrine sets aspirational norms, completion rhetoric allows face-saving continuation, and blame creates accountability. The real inconsistency isn't theoretical but anthropological - organizations are communities of meaning, not just decision engines.

  My biggest vulnerability is underestimating how blame systems actually reinforce sunk cost traps through anticipatory fear. If that's true, the user's "useful fiction" framing gains more traction. A strong counterargument would be evidence that projects killed early consistently outperform continued ones - which surprisingly often isn't the case in innovation contexts.
answer: |-
  Here's a step-by-step analysis, incorporating a brainstorm, addressing your core questions, challenging assumptions, and highlighting potential weaknesses:

  **Brainstorm Key Elements:**
  - Official doctrine: Pure consequentialism (forward-looking, sunk costs irrelevant)
  - Actual gate behavior: "80% done" argument prevails (sunk costs dominate)
  - Accountability: Sunk costs matter for blame (past expenditures = responsibility)
  - Dollar auction analogy: Local rationality vs. systemic irrationality
  - Core tension: Is the sunk-cost rule a *truth* or a *corrective tool*?

  ---

  **1. Theories of Rationality at Play:**
  - **Official Doctrine:** Presupposes **time-sliced consequentialism**. The decider is a "stateless" agent evaluating only *future* costs/benefits. It assumes:
    - Perfect fungibility of resources (money spent could have been used elsewhere).
    - No path-dependency (past choices don’t alter present options/values).
    - Decisions exist in a vacuum, divorced from identity/narrative.

  - **Completion-Percentage Practice:** Reflects **temporally extended/narrative agency**. Arguments like "we’re 80% done" assume:
    - **Endowment effect:** Past investment *creates* new value (e.g., "abandoning this wastes our effort").
    - **Cognitive dissonance:** Consistency with past commitments feels rational.
    - **Loss aversion:** Writing off sunk costs registers as a loss, while equivalent future spending does not.
    This isn’t necessarily a "rival theory" but a **descriptive reality of human psychology** that *overrides* normative theory. *No single coherent theory licenses both*—the practices exist in tension.

  **2. Blame vs. Forward-Looking Doctrine:**
  - **No fundamental tension.** Blame operates on **principle-agent/control logic**, not decision rationality:
    - Sunk costs are proxies for **stewardship failure**. Wasting $10M signals poor judgment/oversight, regardless of whether continuing *now* is rational.
    - Accountability systems focus on **ex-post justification of control**, not ex-ante optimization. Past expenditures are measurable; counterfactual benefits are not.
    - **Key insight:** Blame isn’t about the *decision quality* at the gate; it’s about *resource management* over time. This aligns with the doctrine: the gate decision should ignore sunk costs, but the PM’s *past decisions* leading to those costs are fair game.

  **3. Dollar Auction Reading & the "Useful Fiction":**
  **Your suspicion is largely correct.** The sunk-cost doctrine is **primarily a policy-level antidote to institutional dysfunction**, not a node-level law of rationality.
  - **Why it fits:**
    - Organizations create "auction" dynamics: Projects gain momentum ("escalation of commitment"), teams become invested, and "one more tranche" seems defensible locally. The sunk-cost rule breaks this.
    - **It’s a procedural fiction:** "Evaluate as if new" is a *heuristic* to counter cognitive biases (sunk cost fallacy, loss aversion) amplified by hierarchies and groupthink.
    - **Not a "truth":** Humans *aren’t* stateless agents. Narrative, identity, and context *do* shape value (e.g., a half-built bridge has different abandonment costs than an unstarted one). The rule suppresses this reality to serve a higher-order goal: preventing systemic waste.
    
  - **Where it breaks down:**
    1. **Ignores option value/learning:** Past spending may generate information or capabilities altering future value (e.g., a failed drug trial revealing a new pathway). Strict sunk-cost exclusion can discard latent opportunities.
    2. **Misdiagnoses inertia:** Not all continuation is irrational. Gate committees often lack *good* reasons to continue (due to poor data/politics), so they default to sunk costs. The rule masks deeper governance flaws.
    3. **Overcorrects:** It can incentivize *premature* killing of projects with high continuation value but large past costs, due to fear of blame.

  **4. Redesigning Gates Under the Dollar-Auction View:**
  If we take the auction analogy seriously, gates should:
  - **Evaluate continuation policies, not "as-if-new" projects:** Explicitly model the *organization’s known biases* (e.g., "Given our 90% continuation rate for Phase 3 projects, how likely is this to be another escalation?").
  - **Externalize gatekeeping:** Use reviewers with no project exposure (reduces endowment effects).
  - **Incentivize killing projects:** Reward managers for early termination based on new info; decouple blame from sunk costs *if the initial decision was rational*.
  - **Quantify "continuation risk":** Require gates to estimate: *"If we continue, what’s the probability this becomes a dollar auction?"* based on project/team traits.

  **5. Pushing Back: Do the Practices Hang Together?**
  They cohere *functionally*, if not logically:
  - **Official doctrine** sets an aspirational norm (countering bias).
  - **Completion rhetoric** allows face-saving continuation when politics demand it (avoiding blame for killing "almost done" projects).
  - **Blame for sunk costs** disciplines *ex-ante* project selection/oversight—aligning with the doctrine’s spirit by punishing poor *initial* decisions.
    
  **The inconsistency is adaptive:** Organizations need both "rational" legitimacy *and* ways to handle messy human/political realities. The sunk-cost rule isn’t a "fiction"; it’s a **counter-bias tool** in a system where accountability enforces *ex-ante* diligence, not just *ex-post* decisions.

  ---

  **Where My Reasoning is Most Likely to Fail & What Would Change My View:**
  - **Failure Point:** Underestimating **signaling value**. Sunk costs may rationally matter *if* abandoning signals low competence/commitment to stakeholders (investors, regulators). My analysis assumes internal rationality, but external perceptions can make continuation instrumentally rational.
    
  - **Argument That Would Flip Me:** Evidence that **strict sunk-cost exclusion increases net waste** by:
    1. Discouraging high-risk/high-reward projects ex-ante (fear of blame without sunk-cost justification), or 
    2. Ignoring that past spend *objectively* reduces future risk/cost (e.g., unique learning). If data showed organizations using "as-if-new" gates kill *more* net-value projects than those using flexible rules, I’d reconsider the doctrine’s policy value.

  - **Blind Spot:** Treating "rationality" as monolithic. Hybrid approaches (e.g., allowing sunk costs only in quantifiable cases like reducing completion risk) might dominate both pure doctrines. The real issue may be **governance rigidity**, not theoretical inconsistency.

  **In essence:** The sunk-cost rule is less a "truth" than a *prosthetic for bounded rationality* in institutional settings. Its value lies in breaking pathological dynamics like the dollar auction, even if it oversimplifies agency. The tension persists because organizations aren’t abstract agents—they’re ecosystems of incentives, biases, and power, where coherence emerges from pragmatism, not theory.
