prompt: |-
  I spent my working life in population genetics, and since retiring I have been reading philosophy of science — Popper in particular. Something now puzzles me about the practice I spent decades participating in, and I would like someone to reconstruct what that practice implicitly presupposes.

  Here is the practice. When a biologist proposes an adaptive explanation of a trait — this enzyme's optimum shifted because the climate cooled; this gene was driven to fixation by selection for pesticide resistance — the discipline no longer accepts the story on plausibility alone. We require that it be tested against a null alternative in which the pattern arose by drift, and the tests are familiar: compare the rate of substitutions that alter the encoded protein against the rate of silent ones that do not; ask whether the pattern of variation bears the signature a selective sweep would leave rather than the signature drift would; simulate the neutral process and ask whether the observation is extreme under it. The rhetoric surrounding all this is Popperian. We say we are trying to refute the adaptationist story, and we dismiss an untested one as a just-so tale until the neutral alternative has been excluded. Yet the inferential machinery we actually use is not Popperian at all. We compute how probable the data are under competing hypotheses and prefer the hypothesis under which they are less surprising; we never deduce a prediction and consign a theory to the scrap-heap upon a single contrary observation, but accumulate comparative support.

  Popper himself, I gather, spent some years doubting whether the theory of natural selection was testable at all — on the ground that, formulated carelessly, it threatens to collapse into the tautology that the fittest are those who survive and leave more offspring — and he later withdrew much of that doubt, allowing that the theory, properly formulated, is testable and has in fact survived severe tests. So my question is this: what view of scientific testing does the practice I have described presuppose? Does it vindicate Popper's withdrawal of the doubt, by presupposing that fitness can be measured independently of survival, so that the claim that the fittest leave more offspring is a risky, refutable assertion rather than a definition? Or does it show that his original worry was aimed at the wrong target? And does the practice hang together at all, given that its rhetoric is deductivist while its machinery is probabilist? Which rival views of testing does it quietly rule out — and is it in fact compatible with several of them, so that the Popperian gloss is decoration rather than commitment? Finally, if we took the presupposed view seriously and replaced the rhetoric with it, what would visibly change in how papers are written, reviewed, and defended?

  I would like one subsidiary puzzle folded into the answer. The same practice treats the neutral alternative as the null hypothesis to be rejected, rather than as an equal competitor to be compared symmetrically. Does that presuppose a substantive commitment — that drift is the default condition of populations and selection the exception requiring special evidence — and, if so, is that a commitment about how the world mostly is, or merely a convention about who bears the burden of proof?
reasoning: |-
  Okay, let's tackle this user's query. They're a retired population geneticist who's been reading Popper and now questions the philosophy underlying their field's testing practices. The core issue is the mismatch between Popperian rhetoric (falsification) and the actual probabilistic methods used in testing adaptive hypotheses against neutral ones. 

  First, I need to unpack their main concerns: 

  1. **Methodology vs Rhetoric**: The field uses Popperian language (falsifying adaptationist stories) but relies on probabilistic comparisons (likelihoods, simulations). Why this disconnect?
  2. **Popper's Tautology Concern**: Does current practice resolve Popper's worry about natural selection being untestable? 
  3. **Null Hypothesis Status**: Why is neutrality the default? Is this a factual claim or a burden-of-proof convention?
  4. **Philosophical Compatibility**: What view of science does this practice *actually* presuppose? 

  The user also hints at a deeper need: they want to reconcile decades of hands-on work with newfound philosophical curiosity. There's a slight tension here—almost like they're auditing their own career. 

  **Breaking it down:**

  ### On Popper's Tautology
  - Current practice *does* avoid the tautology because fitness proxies (e.g., biochemical efficiency, pesticide tolerance) are defined *before* survival/reproduction is measured. For example: 
    - Testing insecticide resistance: "Fitness" is operationalized as enzymatic breakdown efficiency *before* exposing alleles to selection. 
    - This makes "fit = survives" testable, not circular. Popper was right to withdraw his doubt. 

  ### Why Neutrality as the Null?
  - This is both pragmatic and epistemic:  
    - **Pragmatic**: Neutral models are mathematically tractable (Kimura's diffusion equations, coalescent theory). Testing selection requires this baseline.  
    - **Epistemic**: Drift is parsimonious (no selection coefficients to estimate) and universal (affects all loci). Selection is locus-specific, so claiming it requires positive evidence.  
  - *Not* a strong claim that drift dominates evolution—just a "burden of proof" rule. (User might bristle here; many debates in the field hinge on how often selection *actually* occurs.)  

  ### The Rhetoric/Methodology Gap
  - The Popperian language is partly historical (neutral theory was a *rebellion* against adaptationism) and partly heuristic. But the machinery is firmly:  
    - **Likelihoodist** (comparing P(data|H₀) vs P(data|H₁))  
    - **Bayesian-ish** (via ABC methods, posterior probabilities in simulations)  
  - This *isn't* Popperian falsification (no "deduction → single counterexample" here).  

  ### What Would Change Without the Rhetoric?
  Papers might:  
  - Say "neutral model has lower likelihood" instead of "we reject neutrality."  
  - Report Bayes factors alongside p-values.  
  - Frame conclusions as "support for selection" rather than "failure to falsify adaptation."  
  But would reviewers accept this? Unclear. The field's culture is deeply rooted in null-hypothesis testing.  

  ### Subsidiary Puzzle: Null as Default
  - The user suspects this might smuggle in a worldview. I’d argue:  
    - Neutrality as null is *not* a claim that drift is more common—it’s a methodological artifact.  
    - Example: Even if 90% of substitutions were adaptive, you’d *still* test H₀=neutral because you need rigor in identifying the 10%.  
    - (But yes, the 1960s neutralist/selectionist wars *did* shape this convention.)  

  ---  
  **Final Thought for the User**:  
  Their practice aligns closest with Deborah Mayo's "severe testing" (error statistics)—using neutral models to ensure selectionist claims aren’t flukes. Popper’s ghost lingers in the *aspiration* for rigor, but the math is firmly post-Popper. If they rewrote papers honestly, they’d sound more like statisticians and less like courtroom lawyers cross-examining nature.
answer: |-
  Your dissection of population genetics practice versus Popperian rhetoric is incisive. Let's reconstruct the implicit philosophical commitments, addressing both your main question and the subsidiary puzzle. The core tension—deductivist rhetoric vs. probabilist machinery—reveals a sophisticated hybrid view of testing that transcends Popper while resolving his tautology worry.

  ### 1. **Resolving Popper's Tautology Worry**
  Your practice **vindicates Popper's withdrawal of doubt** by presupposing that fitness can be measured independently of survival. Key mechanisms:
  - **Independent operationalization**: Fitness proxies are defined *before* testing survival/reproduction (e.g., biochemical efficiency of an enzyme at low temperatures; enzymatic degradation of pesticides). This makes "fitter alleles leave more offspring" testable and non-tautological.
  - **Risk of falsification**: If selection explains pesticide resistance, data must show:
    - Substitutions altering protein function (dN) exceed silent changes (dS)
    - Reduced diversity around the locus (selective sweep signature)
    - Simulation confirms drift is unlikely (p < α)
  A *failure* to observe these patterns refutes the adaptive claim. This satisfies Popper: fitness is defined independently (e.g., via biochemistry), and selection generates risky predictions.

  ### 2. **The Real Philosophy of Testing Underlying Practice**
  Your machinery aligns with **error statistics** (Deborah Mayo) and **likelihoodism** (Edwards, Royall), **not Popperian falsificationism**. Key features:
  - **Comparative support**: You compute relative evidence (e.g., likelihood ratios, posterior probabilities via ABC simulations). This contrasts with Popper's binary falsification.
  - **Severe testing**: Rejecting neutrality requires data that would be improbable if drift were true (Type I error control). This is Mayo's "severity" principle.
  - **Probabilistic modus tollens**: If data are very unlikely under H₀ (drift), H₀ is "rejected"—but this is probabilistic (p-values), not deductive.
  - **Accumulation of evidence**: Genome-wide scans for selection rely on repeated patterns, not single tests—incompatible with Popper's "one counterexample falsifies."

  **Rival views ruled out**:
  - **Naïve falsificationism**: Rejected; no theory is discarded after one anomaly (e.g., a single non-significant p-value).
  - **Verificationism**: Rejected; adaptive hypotheses are never "proven true," only better supported than neutrality.
  - **Dogmatic Bayesianism**: Rejected; prior probabilities of selection vs. drift are rarely quantified. Practice uses objective probabilities (coalescent simulations, diffusion models).

  ### 3. **The Null Hypothesis Puzzle: Convention or Substantive Claim?**
  Treating drift as the null is **primarily a convention about burden of proof**, not a claim about nature:
  - **Epistemic pragmatism**: Drift is the "simpler" hypothesis (no selection coefficients, mutation-drift equilibrium). Invoking selection requires positive evidence.
  - **Mathematical necessity**: Neutral models (Kimura, coalescent theory) provide a well-specified null distribution. Selection models are diverse and parameter-heavy.
  - **Historical context**: The neutral theory was a corrective to adaptationist overreach. Making drift the null enforces rigor.
    
  **But**: This convention *indirectly* presupposes that drift is *plausible enough* to be the default. If drift were biologically absurd (e.g., for strongly conserved genes), the practice would collapse. It is **not**, however, a claim that drift dominates evolution—only that it must be ruled out before invoking selection.

  ### 4. **If the Presupposed View Replaced the Rhetoric: Practical Shifts**
  Adopting an explicit error-statistical or likelihoodist framework would change discourse:
  - **Papers**: Would emphasize "strength of evidence" (likelihood ratios/Bayes factors) over "rejecting H₀." Abstracts might say: "Data strongly support selection over drift (LR = 10³)" instead of "Selection was significant (p < 0.01)."
  - **Reviewers**: Would demand quantification of evidence strength, not just p-values. Critiques might focus: "Your simulation inadequately models demography, weakening severity of drift-rejection."
  - **Defenses**: Authors would justify why their test was *severe* for drift (e.g., power analysis), not just "significant."
  - **Culture shift**: "Just-so story" accusations would target *poorly tested* explanations, not *untested* ones per se. A well-supported likelihood ratio could justify an adaptive hypothesis even without "falsifying" drift.

  ### Synthesis: A Coherent Hybrid
  Your practice **coheres** because it uses Popperian rhetoric for *methodological rigor* while employing probabilist tools for *inference*. It quietly assumes:
  - Natural selection is testable via independent fitness measures.
  - Science progresses by comparative hypothesis evaluation, not deductive falsification.
  - Neutrality is the null due to epistemic caution, not ontological primacy.

  This hybrid resolves Popper's tautology worry and is compatible with post-Popperian philosophies (e.g., Mayo, Lakatos' research programs). The rhetoric persists because it enforces skepticism—but the real engine is probabilistic inference. Embracing this explicitly would not weaken the science; it would refine its philosophical honesty.

  *"We are all Popperians in the seminar room, but likelihoodists at the sequencer."* Your field's unspoken philosophy is a testament to science's adaptive evolution beyond its foundational myths.
