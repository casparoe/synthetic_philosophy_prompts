prompt: |-
  Hi, so I'm in Year 12 and my philosophy teacher does this thing every fortnight where one of us has to give a ten-minute mini-lesson to the rest of the class on a topic she pulls out of a hat, and this time it's me with Twin Earth (she says the original thought experiment is by this American bloke called Putnam, we're not expected to have read the actual paper). Nobody in my class has done any philosophy of language before — we've pretty much only done ethics — and honestly I only half understand it myself. I can follow the Wikipedia page while I'm reading it, but when I tried explaining it out loud to my brother I immediately got tangled in whether the twin version of me is thinking the same thing as me or not, and he just shrugged and said "so words mean whatever the planet wants them to mean?", which I'm pretty sure is wrong but I couldn't say why fast enough. Also one girl in my class heard the words "Twin Earth" and assumed we'd be discussing parallel universes, so there's that to deal with.

  Anyway, I don't want you to explain Twin Earth to me — I want a plan for how *I* should explain it, in ten minutes, to people who've never heard of it and who will get marked down (well, I will) if I just read off slides. So like: what bit has to come first before anything else makes sense, which example should carry the whole thing — is the water one actually the best choice or is it too worn out? — the misconceptions my classmates are definately going to walk away with (my brother already discovered two of them for me), and where exactly in the ten minutes I should head each one off. Plus one question I can ask at the end to check whether the idea actually landed rather than them just nodding along, and one thing I should openly admit I'm not going to cover at this level.

  Please give it to me as exactly five numbered points, one or two sentences each, no introduction or conclusion — I want to be able to literally glance at it on my phone during the lesson. And please commit: pick one example, one order, one check question, and give me your reasons, don't hand me a menu of options, because I'll already have enough decisions to make on the day and I'd rather argue with a definite plan than build one from a pile of maybes.
