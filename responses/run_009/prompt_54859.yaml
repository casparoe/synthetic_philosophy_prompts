      "Unrendered objects map only partially due to God's continuous perception: because the friend's refutation assumes objects blink out without finite perception, but Berkeley denies this by grounding existence in divine perception.",
      "Hardware has no counterpart in Berkeley's idealism: because the analogy smuggles in a material substrate, which Berkeley explicitly rejects, making the refutation attack a straw man (rendering as empirical process) rather than Berkeley's actual thesis."
