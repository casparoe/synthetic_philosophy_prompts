      "Non-perceptual state (saved game data): The analogy treats persistence as inert storage, but Berkeley's God perceives actively, so nothing is ever 'stored' non-mentally.",
      "The player's dual position (inside/outside the world): The analogy casts the player as both experiencer (avatar) and external operator (physical body), but Berkeley's finite minds are purely experiential with no 'outside' perspective."
    ],
    "honest_use": "The analogy can legitimately illustrate Berkeley's view that perception determines what appears in our experience (like rendering), and that reality requires a sustaining intelligence (God/server) to avoid collapse into chaos.",
    "better_analogy": "none available",
    "master_argument_note": "The conceivability line ('one cannot conceive an unconceived tree') is Berkeley's separate 'master argument' for idealism; it does not belong in this audit of the video-game analogy, as it targets the coherence of materialism, not lazy rendering."
