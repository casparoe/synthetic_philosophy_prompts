prompt: |-
  I'm a novelist stuck on a scene, and I need someone to reverse-engineer a character from her track record. The character, Petra, is closely modeled on a college friend of mine — call her M — and I've been seeding Petra's dialogue with the actual opinions M has vented at me over the years, so she feels like a person rather then a ventriloquist dummy. Now the plot has handed Petra a vote on the city council, and I've realized I don't actually know what M would say, and I don't want to cheat by making Petra conveniently vague in the moment.

  So here's M's record, as best I can reconstruct it. (1) She said she'd save her own drowning kid rather than two strangers' kids, and didn't think this needed defending. (2) She thinks it's completely fine — basically the point of having a country — that our government protects our own workers' jobs even when the foreigners losing out are just as badly off. (3) On her own giving, though, she's ruthless: borders are, in her words, magical lines, and her donations go wherever a dollar does the most good, and she teases her sister for giving to the local food bank instead of abroad. (4) When I once suggested you surely owe a bit more to a fellow citizen you've never met than to a foreigner you've never met, she said a stranger is a stranger, doesn't matter what passport. (5) During a hurricane abroad she insisted our embassy evacuate citizens who'd lived there for decades and, in one case she knew of, dodged local taxes the whole time — thats just what an embassy is for — while also being adamant that a woman who'd lived, worked, and paid taxes here for thirty years without papers shouldn't be deported over a paperwork error.

  The scene: a bad flu season, the city has a few thousand surplus vaccine doses (the federal allocation overshot local demand), and two petitions come in — one from recently returned expat citizens who want doses reserved for our own people, and one from a clinic serving exactly the sort of long-term undocumented residents from item (5). Petra has to pick or split. What would M say? And honestly, the answer matters less to me than the reasoning: what rules actually fit the whole track record (I can see at least two — one where what matters is participation in a shared cooperative scheme, one where it's citizenship as such, and maybe a third where the state may play favorites but owes everyone a floor of decent treatment) — what does each predict for the vaccine scene, which one would you bet on for M and why, and is there a further case I could drop into a later chapter that would really force the rules apart? Please write in American English (the manuscript is US-set even though M keeps saying queue), and since this is a reconstruction of one person from five data points, be upfront about how confident you are at each step and flag the part of the reconstruction you'd bet against.
reasoning: |-
  Okay, let's tackle this step by step. The user is a novelist trying to reverse-engineer a character's decision based on real-life opinions of their friend M. The key is to reconcile seemingly contradictory positions from M's track record into a coherent framework for Petra's vote on vaccine allocation. 

  First, I notice M's principles seem inconsistent on the surface - strong in-group preference (saving her own child, protecting domestic jobs) paired with borderless altruism (donations based on impact, defending undocumented residents). But looking closer, there's a pattern: M consistently distinguishes between systemic obligations (what governments/citizens owe each other within a system) and personal ethics (her own choices as an individual). 

  For the vaccine dilemma, this framework predicts: 
  1) Government resources (like federal vaccine doses) must prioritize citizens because that's the social contract - hence supporting the expats' petition. 
  2) But M would simultaneously insist the undocumented clinic deserves protection through other means (personal donations? advocacy?) since her moral compass rejects letting people suffer over paperwork. 

  The test case I'd propose: a taxpayer-funded homeless shelter turning away a citizen who refuses to work versus an undocumented immigrant seeking work. This forces apart systemic reciprocity ("you contribute, you get help") from M's moral belief that basic needs transcend paperwork. 

  Biggest uncertainty: would M bend the "system" rule in crises? Her hurricane evacuation stance suggests she might - but that involved citizens. For non-citizens, she draws a harder line on systemic obligations while still feeling personal responsibility. 

  The vaccine scene should show Petra arguing for citizen priority while privately agonizing over the clinic or proposing a sideways solution. That tension is gold for the novel - it's where M's voice emerges most vividly.
answer: |-
  Based on M's track record, here's a reverse-engineered framework, prediction for the vaccine scene, a test case, and confidence levels:

  **Core Principle Reconstructed:** M operates with a **strict separation between systemic obligations (of governments/states/citizenship groups) and individual moral choices.** Systemic entities (like nations, cities) are fundamentally *partial* and exist to prioritize their members. Individuals, however, have a universal moral duty to alleviate suffering where they can, unconstrained by borders. This creates apparent contradictions but is internally consistent for her.

  **The Framework Explained:**

  1.  **The System's Job is Favoritism:** Governments, embassies, citizenship groups exist *specifically* to protect and prioritize their own members above outsiders. This is their core function and justification (Points 1, 2, 5 - Embassy evacuation). Failure to do this is a betrayal of the social contract *within* the group. Loyalty and reciprocity *within the system* are paramount for the system to function. ("Magical lines" define the group the system serves).
  2.  **The Individual's Job is Impartial Altruism:** As an individual *outside* the machinery of state obligation, one's moral duty is universal. Borders are irrelevant to calculating where your *personal* dollar or moral concern does the most good (Point 3, Point 4 - "stranger is a stranger"). Sentimentality or proximity shouldn't override effectiveness. The state's partiality doesn't absolve the individual of universal responsibility.
  3.  **Systemic Obligation Requires Membership:** To be owed the system's favoritism, you must be a *member* of the system – typically through citizenship (Points 2, 5 - Evacuation). Participation in the *reciprocal scheme* (paying taxes, following laws, being a citizen) grants you the right to its protection. Failure to be a member (like undocumented status, even long-term) means you *aren't* owed the *system's* primary resources, even if the system shouldn't actively harm you (Point 5 - Opposing deportation over paperwork error).
  4.  **Harm Avoidance is a Universal Floor:** While the system doesn't owe non-members *priority*, it has a baseline obligation *not to cause active, severe harm* to anyone within its reach, especially over minor bureaucratic failures (Point 5 - Opposing deportation). This is less about positive obligation and more about avoiding cruelty.

  **Predictions for the Vaccine Scene:**

  *   **The Vote:** Petra argues forcefully to reserve the **surplus doses for the recently returned expat citizens**.
  *   **Reasoning (Petra/M's Likely Argument):**
      *   "This vaccine allocation came from the *federal government*, funded by *US taxpayers*, for the protection of *US citizens*. That's the system working as it should – prioritizing its own members."
      *   "The expats are citizens. They are part of the reciprocal scheme. They are owed this protection by the system designed for them. Denying them doses meant for citizens would be a betrayal of that contract."
      *   "The clinic serves undocumented residents. However sympathetic their situation, they are *not* members of the citizenship system entitled to its primary protective resources like a targeted federal vaccine allocation. This isn't cruelty; it's the system correctly identifying who it serves first."
      *   "My *personal* sympathy is with those suffering most, anywhere. And I'll donate to effective charities fighting the flu globally or locally. But *this vote* isn't about my personal charity. It's about how the *city* spends resources allocated *specifically for the protection of citizens*. The city is part of the national system; its obligation here is clear."

  **Confidence Levels:**

  *   **High Confidence (>90%):** Petra prioritizes the citizens. The "system's obligation to members" principle (Points 1, 2, 5 evacuation) is the strongest and most consistent thread. The vaccine is a systemic resource tied to citizenship.
  *   **Medium-High Confidence (75%):** She frames it explicitly as a systemic obligation, distinct from personal morality (Point 3 vs Points 1,2,5). She likely invokes the taxpayer/citizenship link.
  *   **Medium Confidence (60%):** She expresses sympathy for the clinic residents but firmly separates that from the *system's* duty. She might suggest *other* city resources (non-federal, non-targeted) could potentially help, or emphasize her personal support for charities aiding similar groups. The "harm avoidance" principle (Point 5 deportation) isn't strongly triggered here – not getting surplus vaccines isn't seen as the *city actively causing harm* equivalent to deportation; it's seen as *not providing a priority benefit*.
  *   **Bet-Against Part:** Her *personal* expression of sympathy for the clinic residents might be slightly cooler than her passion against deportation. While she'd acknowledge their humanity, the deportation case involved active cruelty by the state she was fighting. Here, the state is just fulfilling its primary duty, which she endorses. Her passion in the scene would be defending the *principle* of systemic obligation, not necessarily attacking the clinic's request.

  **Forcing the Rules Apart: The Test Case (Later Chapter)**

  **Scenario:** A severe budget crisis forces the city council to choose between:
  1.  **Option A:** Cutting funding for a life-saving but very expensive treatment program exclusively for low-income *citizen* children with a rare disease (costs $500k/child/year, serves 10 kids).
  2.  **Option B:** Cutting funding for basic sanitation infrastructure repairs in a neighborhood populated primarily by long-term *undocumented* residents (failure risks a sewage backup/outbreak affecting 500 people, including many children).

  **Why it Forces the Rules Apart:**

  *   **Citizenship as Such:** Favors Option B cut. Citizens *must* be prioritized for the city's finite resources, especially life-saving ones. The undocumented neighborhood, while tragic, isn't owed the same level of protection.
  *   **Participation in Cooperative Scheme (Taxes/Laws):** Also leans towards Option B cut. The citizens' families likely pay *some* taxes (even if low-income, sales tax, etc.), participate in the system. Undocumented residents, while perhaps paying some sales tax, are not full participants and dodging significant obligations (income tax, formal status).
  *   **State May Play Favorites but Owes a Floor of Decent Treatment:** Favors Option A cut. The expensive treatment, while for citizens, is an extraordinary cost for a few. The sanitation issue represents a catastrophic failure of the *basic floor* of public health and safety the city owes to *everyone* within its jurisdiction, regardless of status. Allowing a preventable outbreak due to infrastructure neglect is a profound failure of the state's minimal duty, arguably worse than not funding an ultra-niche, high-cost treatment program. M's "harm avoidance" principle is maximally triggered here.

  **Prediction for M/Petra:** This is harder, but based on her track record:
  *   She'd be deeply uncomfortable.
  *   Her systemic instinct would scream to protect the citizens (Option B cut).
  *   **However,** the scale of the potential harm (500 vs 10), the *type* of harm (catastrophic public health failure vs targeted medical treatment withdrawal), and her principle of the state avoiding *active, severe, broad harm* (like deportation, like causing an outbreak) would likely push her towards **Option A cut (fund the sanitation, cut the treatment program).**
  *   **Reasoning:** "The city cannot let hundreds of people, including children, live in conditions guaranteed to cause a massive public health disaster. That's a fundamental failure of our duty to provide basic safety to *everyone* here. The treatment program is heartbreaking, but it's an extraordinary expense saving a very few. Our first duty is to prevent mass suffering caused by our neglect. Yes, those children are citizens, but the scale and nature of the harm here overrides the *degree* of priority citizenship grants for this specific, catastrophic threat."

  This test case pits the *strength* of the citizenship claim against the *scale and nature* of potential harm to non-citizens, forcing M/Petra's "harm avoidance" principle to its limit against her core belief in systemic partiality. Her likely struggle and eventual choice reveal the hierarchy within her framework: preventing catastrophic, state-enabled harm to many is a more fundamental obligation than providing extraordinary benefits to a few citizens, even if citizens generally get priority for positive benefits. This aligns with her stance against deportation – the harm inflicted was seen as disproportionate and cruel, outweighing the state's right to enforce membership rules in that specific context.
