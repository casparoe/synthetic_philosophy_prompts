answer: |-
  Here’s a rigorous set of requirements for a theory balancing collective memory and historical record, grounded in your cases and distinctions. Non-negotiable requirements (NN) are foundational; others may reflect values but must be acknowledged. Conflicts are flagged explicitly.

  ### Core Requirements & Reasoning
  1.  **NN: Avoid Perpetuating Harm from Documented Injustice.**  
      *Case*: Residential school survivors’ accounts vs. state archives that actively concealed abuse.  
      *Reasoning*: When records are tools of oppression (e.g., colonial administrations, authoritarian states), uncritical deference replicates violence. Truth-tracking fails if the "record" is weaponized.  
      *Distinction Protected*: Deference to harmed communities ≠ deference to records.

  2.  **NN: Correct Flat Factual Errors with Material Consequences.**  
      *Case*: Wrong number of fatalities in the mill strike obscuring safety violations; incorrect land ownership data affecting Indigenous land claims.  
      *Reasoning*: Errors that distort legal, ethical, or safety realities risk tangible harm. Archives often excel at dates, names, numbers.  
      *Distinction Protected*: Factual error vs. symbolic meaning; *requires* separating verifiable discrete claims from narrative.

  3.  **Acknowledge Epistemic Limits of Archives & Memory.**  
      *Case*: Indigenous oral histories accurately describing paleo-geography; archive omitting workers’ perspectives in mill strike.  
      *Reasoning*: Archives reflect power (who recorded what? what was deemed "worth" archiving?). Memory can preserve truths archives ignore or suppress. A theory must admit both can be flawed/incomplete.  
      *Distinction Protected*: Archive ≠ objective truth; memory ≠ mere myth.

  4.  **Respect the Non-Epistemic Functions of Collective Memory.**  
      *Case*: Archeologically false founding myth that sustains community cohesion and identity.  
      *Reasoning*: Stories serve vital social/psychological roles (belonging, resilience, moral instruction). Dismissing this risks social fragmentation. Truth isn’t solely factual.  
      *Distinction Protected*: Epistemic purpose (what happened) vs. symbolic/practical function (why the story matters now).

  5.  **Distinguish Purpose of the Narrative.**  
      *Case*: A commemorative plaque about "community spirit during the strike" vs. an academic monograph on strike causes.  
      *Reasoning*: Demands for accuracy differ by context. A museum label for the public isn’t a footnote in a peer-reviewed journal. "Wrong" for one purpose may be "right" for another.  
      *Distinction Protected*: Chronicle (fact-focused) vs. commemoration/identity-building.

  6.  **Usable Decision Framework for Institutions.**  
      *Case*: A museum board debating an exhibit label about the founding.  
      *Reasoning*: Theorists can live with ambiguity; institutions need actionable guidance (e.g., "In X situation, do Y because Z"). Must offer concrete steps, not just principles.  
      *Distinction Protected*: Abstract philosophy vs. practical ethics for public history.

  7.  **NN: Resist State-Sanctioned Historical Falsehoods ("Memory Laws").**  
      *Case*: Government-mandated narratives denying genocide or glorifying oppression.  
      *Reasoning*: When the "record" is dictated by power to entrench injustice, deference is immoral. Upholds critical history against propaganda.  
      *Distinction Protected*: Critical archive vs. state propaganda.

  8.  **Preserve Marginalized Voices Against Dominant Narratives.**  
      *Case*: Workers’ oral histories of the strike vs. mill owner’s archived correspondence.  
      *Reasoning*: Archives often privilege elites. Memory (especially oral tradition) can be the only counterweight. Suppressing it reinforces historical silencing.  
      *Distinction Protected*: Archive-as-power vs. memory-as-resistance.

  ### Flagged Requirement Conflicts (The Tensions No Theory Fully Resolves)
  *   **Conflict 1: NN#2 (Correct Material Errors) vs. #4 (Respect Non-Epistemic Functions)**  
      *Nature of Conflict*: Correcting a foundational myth’s factual error (e.g., "heroic settler" was actually a fraud) may shatter community cohesion. Does the tangible harm of the error outweigh the tangible harm of social disruption? *No objective metric exists.*
  *   **Conflict 2: #3 (Epistemic Limits) vs. Practical Need for Certainty (Implied by #6)**  
      *Nature of Conflict*: If both archives and memory are flawed, how *can* an institution decide? The need for a usable decision (#6) pushes towards simplifying heuristics that may violate #3. Absolute certainty is impossible; action requires provisional judgment.
  *   **Conflict 3: #4 (Non-Epistemic Functions) vs. #7 (Resist State Falsehoods) / #8 (Preserve Marginalized Voices)**  
      *Nature of Conflict*: What if a community's cherished, cohesion-building memory *is* a state-sanctioned falsehood that marginalizes others? (e.g., a "glorious founding" myth erasing Indigenous presence). Prioritizing cohesion might require tolerating a narrative that causes harm, violating #7/#8.

  ### Contested Premise (Noted Early)
  The framing *does* presuppose a distinction between "collective memory" and "historical record" that is often messy. Memory uses records; records shape memory. Archives contain curated memories; memories incorporate archival fragments. A good theory acknowledges this permeability but still needs the distinction for analysis.

  ### How Three Stances Fare Against the Requirements
  1.  **Archive Supremacy ("Record Wins on Facts"):**  
      *Strengths*: Excels at NN#2 (correcting errors), strong on #2 clarity.  
      *Weaknesses/Failures*: Fails NN#1 (perpetuates harm if archive is corrupt/biased), ignores #4 (non-epistemic functions), violates #7 (defers to state archives), often fails #3 (ignores archive's limits), marginalizes #8 (voices not in archive). Unusable (#6) when archives are silent or weaponized. *Collapses vital distinctions* between fact chronicle and other functions.

  2.  **Memory Primacy ("Story is Identity-Constituting"):**  
      *Strengths*: Honors #4, #8, NN#1 (protects marginalized voices), respects #5 (different purposes).  
      *Weaknesses/Failures*: Fails NN#2 (tolerates harmful factual errors), risks ignoring #3 (memory's flaws), vulnerable to #7 (if community memory aligns with state propaganda), struggles with #6 (how to choose *which* memory when communities conflict?). *Collapses* epistemic deference into identity politics.

  3.  **Reconciliation View (Least Bad - Process-Oriented):**  
      *Core Principle*: **"Contextual Integrity with Accountability."** Prioritize truth-seeking *and* harm prevention via transparent process:
      *   **Interrogate Provenance:** Where did *both* memory and record come from? (Who created it? Why? What power dynamics? Addresses #3, #7, #8).
      *   **Classify the Claim:** Is it a verifiable fact (NN#2 applies)? A symbolic meaning (#4 applies)? A contested interpretation? (Protects distinctions).
      *   **Assess Impact:** Who benefits/harms from change/preservation? Tangible (legal, reparative) vs. intangible (identity, cohesion)? (Addresses NN#1, #4, conflicts).
      *   **Embrace Multi-Vocality:** Present layers where possible (archive + memory + critique). State uncertainties. (Addresses #5, #6, #8).
      *   **Center Affected Communities:** Defer interpretation *to* marginalized groups *about their own experience* (NN#1, #8), but not on verifiable facts external to them (NN#2).
      *   **Transparency as Default:** Explain *why* choices were made (e.g., "While X is cherished, documented evidence shows Y. We present both to explore Z."). (Makes #6 usable).
      *Strengths*: Explicitly tackles conflicts via process, respects most NN and key distinctions, offers actionable steps (#6).  
      *Weaknesses*: Complex, resource-intensive, doesn't *eliminate* conflicts (e.g., still hard choices between NN#2 and #4), "impact assessment" is subjective.

  **Your Scorecard Prompt:** At the board meeting, ask:  
  1.  *For the disputed mill strike exhibit:* Is the conflict about a verifiable fact (e.g., casualty count - prioritize NN#2) or the *meaning* of the strike (prioritize #4, #8, multi-vocality)?  
  2.  *For the founding myth:* Does correcting it cause more tangible harm (eroding cohesion vital for town survival?) than leaving it (perpetuating erasure of Indigenous presence? - NN#1, #8)? Can we present the myth *as* foundational myth *alongside* the archaeological evidence *and* explain the difference in purpose (#5)?  
  3.  *Process Check:* Have we truly consulted affected/marginalized perspectives (#8, NN#1)? Have we been transparent about our sources and reasoning (#6)?  

  The reconciliation view offers tools; the conflicts ensure there are no easy answers, only more responsible ways to wrestle with them. Good luck!
