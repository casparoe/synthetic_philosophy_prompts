  ### Classroom Game Design: Costly Signaling & The Handicap Principle  
  **Objective:** Illustrate why costly signals remain honest, the collapse when costs are low, and the role of mimicry.  

  ---

  #### **Game Setup**  
  1. **Participants & Roles**  
     - 12 students: 6 "Senders" (secretly High or Low quality), 6 "Receivers".  
     - **Types**: Assign 3 High (H) and 3 Low (L) types to Senders (use folded slips: "H" or "L").  
     - **Rotate roles** each round so all students play both parts.  

  2. **Signals & Costs**  
     - **Signal**: Standing on one leg (visible, mildly effortful).  
     - **Cost Rules by Round**:  
       - **Round 1 (Costly Signal)**: H costs 2 points, L costs 8 points to signal.  
       - **Round 2 (Cheap Signal)**: Both H and L cost 2 points.  
       - **Round 3 (Mimicry)**: H costs 2 points, L costs 4 points (partial mimicry).  

  3. **Payoffs (Points)**  
     - **Sender Wins If**:  
       - H: Receiver guesses "H" (+5 if correct).  
       - L: Receiver guesses "H" (+5 if deceived).  
       - *Cost subtracted after guess*.  
     - **Receiver Wins**: +5 for correct guess.  
     - **No-Signal Default**: Receiver guesses "L" (no payoff for Sender).  

  4. **Game Flow (Per Round)**  
     - **Step 1 (20 sec)**: Senders read type (H/L) and decide: **Signal (stand) or No Signal (sit)**.  
     - **Step 2 (20 sec)**: Receivers observe signals, guess H/L (write on slips).  
     - **Step 3 (1 min)**: Reveal types, record payoffs on board.  
       - *Example*: H Sender signals (costs 2), Receiver guesses "H" → Sender: +3 (5-2), Receiver: +5.  
     - **Rotate roles** after each round (total 3 rounds).  

  ---

  #### **Predicted Outcomes**  
  - **Round 1 (Costly)**:  
    - H signals (cost low → net gain if believed).  
    - L does not signal (cost too high → net loss even if believed).  
    - **Result**: Signal = Honest H. Receivers guess "H" for signalers, "L" for non → **Separating Equilibrium**.  
  - **Round 2 (Cheap)**:  
    - All senders signal (cost low → everyone gains if believed).  
    - **Result**: Signal meaningless → Receivers guess randomly (50% wrong). **Pooling Equilibrium**.  
  - **Round 3 (Mimicry)**:  
    - L mimics H (cost 4 < benefit 5 → net +1 if believed).  
    - **Result**: Signals flooded → Honesty collapses again.  

  ---

  #### **Debrief Structure (15 min)**  
  1. **Map to Concepts**:  
     - **Separating Eq. (Round 1)**: Cost deters low types → signal stays honest.  
     - **Pooling Eq. (Rounds 2–3)**: Cheap signals invite mimics → no information.  
     - **Key Insight**: Cost must *hurt low types more* (H: 2/5=40% loss, L: 8/5=160% loss).  

  2. **Honest Signals vs. Indices**:  
     - **Handicap (Peacock)**: Costly but *fakable* (if cost drops, mimics ruin it).  
     - **Index (Deer antlers)**: *Unfakeable* (size = physical constraint).  

  3. **Human Applications**:  
     - **Consumption/Hazing**: Acts like handicap (costly → screens low-commitment).  
     - **Caveats**: Humans add layers (e.g., signaling "taste" beyond wealth; social norms).  

  ---

  #### **What Could Go Wrong & Fixes**  
  1. **"This is silly!" Refusal to Signal**:  
     - **Fix**: Start with low-stakes practice round; award candy for top 3 points.  
     - **Script**: "Imagine points are real cash—maximize your score!"  

  2. **Collusion (e.g., friends signaling secretly)**:  
     - **Fix**: Random pairings each round; publicly shame conspirators (jokingly).  
     - **Script**: "If two players collude, they bankrupt the system—like counterfeit diamonds!"  

  3. **Time Crunch**:  
     - **Fix**: Use timers; skip Round 3 if behind (use whiteboard to simulate mimicry).  
     - **Script**: "We’ll simulate Round 3: Low types now pay 4. What happens? [Discuss]."  

  ---

  **Total Time**: 5 min setup, 20 min gameplay (3 rounds), 15 min debrief, 10 min buffer.  
  **Materials**: Slips (H/L), timer, whiteboard (track payoffs), candy prize.  
  **Goal Achieved**: Students *feel* the paradox—waste isn’t waste; it’s the foundation of trust.
