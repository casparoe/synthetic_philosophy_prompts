  ### Lakatos-Based Evaluation Procedure for Research Programme Renewal  
  Designed for a 90-minute dossier review, focusing on Imre Lakatos's core concepts. Safeguards:  
  1. **No single-cycle decisions**: A programme must show ≥2 consecutive cycles of degeneration to trigger non-renewal.  
  2. **Cycle threshold**: "Do not renew" requires **2 consecutive degenerating cycles**.  

  | Step | Question                                                                 | Sufficient answer looks like                                                                 | Output                              | Judgment call? (If yes, what panellist decides)                                                                 |
  |------|--------------------------------------------------------------------------|----------------------------------------------------------------------------------------------|-------------------------------------|----------------------------------------------------------------------------------------------------------------|
  | 1    | What are the programme’s non-negotiable commitments (hard core) vs. adjustable elements (protective belt)? | Explicit list of immutable principles (e.g., foundational equations, core axioms) and modifiable components (e.g., model parameters, boundary conditions). | N/A (preparatory)                   | **Yes**. Panellist must infer core/belt from publications, interviews, and dossier. Ambiguity requires interpretation.        |
  | 2    | In the last cycle, were challenges resolved by adjusting the protective belt **without altering the hard core**? | Evidence that anomalies were addressed via peripheral changes (e.g., new parameters, domain restrictions) while core commitments remained unchanged. | `core-intact` / `core-changed` / `indeterminate` | **Yes**. Decides if changes violate the core (e.g., redefining foundational goals) or are permissible belt adjustments. |
  | 3    | Did the last cycle produce **novel predictions/unexpected connections** (progressive) or **ad hoc fixes** (degenerating)? | Novel predictions confirmed empirically or new cross-field links (progressive) vs. free parameters, exceptions, or redefinitions to absorb surprises (degenerating). | `progressive` / `degenerating` / `indeterminate` | **Yes**. Judges if predictions were "genuinely novel" (tested risks) or "retrofitted" (excuses for past failures). |
  | 4    | Is there a **concrete plan for novel work** beyond incremental applications? | Specifics on new methods, untested hypotheses, or unexplored domains—not just "apply to more cases." | `progressive` / `degenerating` / `indeterminate` | **Yes**. Assesses if the heuristic is innovative or repetitive. "One more case" = degenerating.                |

  ### Worked Applications  
  **Key**:  
  - `verdicts_by_step`: Output for Steps 2–4.  
  - `cycles_since_genuine_progress`: Consecutive degenerating cycles (resets on progressive/indeterminate).  
  - `overall`: Cycle verdict derived from Steps 2–4 (rules below).  
  - `unavoidable_judgment_points`: Steps where panellist’s discretion was critical.  
  - `recommendation`: Based on Lakatos safeguards.  
  - **Mechanical fields** (auto-derived): `cycles_since_genuine_progress`, `overall`, `recommendation`, `confidence`.  
  - **Deliberative fields** (require judgment): `verdicts_by_step`, `rationale`, `unavoidable_judgment_points`.  

  ---

  #### **Programme A** (Materials Modelling)  
  ```json  
  {
    "programme": "A",
    "verdicts_by_step": [
      {"step": 2, "verdict": "core-changed"},
      {"step": 3, "verdict": "degenerating"},
      {"step": 4, "verdict": "indeterminate"}
    ],
    "cycles_since_genuine_progress": 1,
    "overall": "degenerating",
    "rationale": "Step 2: Redefining the target material class (to exclude misbehaving cases) alters the hard core—originally 'predicting behaviour for class X'. Step 3: Confirmed prediction is overshadowed by ad hoc domain restriction (carving exceptions). Step 4: Dossier lacks future-plan details.",
    "unavoidable_judgment_points": [
      "Step 2: Is redefining the target class a core violation (yes—it changes the programme's fundamental subject matter)?",
      "Step 3: Does the ad hoc exclusion outweigh the successful prediction (yes—it retrofits decade-old anomalies)?"
    ],
    "recommendation": "renew-with-conditions",
    "confidence": "medium"
  }
  ```  
  **Mechanical derivation**:  
  - `overall = "degenerating"` (Step 2 = `core-changed` → automatic degenerating).  
  - `cycles_since_genuine_progress = 1` (assuming prior cycles were progressive; degenerating triggers first count).  
  - `recommendation = "renew-with-conditions"` (1 degenerating cycle; 2 required for non-renewal).  
  - `confidence = "medium"` (Step 4 indeterminate).  

  ---

  #### **Programme B** (Community Ecology)  
  ```json  
  {
    "programme": "B",
    "verdicts_by_step": [
      {"step": 2, "verdict": "core-intact"},
      {"step": 3, "verdict": "degenerating"},
      {"step": 4, "verdict": "indeterminate"}
    ],
    "cycles_since_genuine_progress": 1,
    "overall": "degenerating",
    "rationale": "Step 2: Optimization principle (hard core) unchanged. Step 3: No novel predictions—unification of existing phenomena is explanatory but not progressive (no new empirical risks taken). Step 4: Dossier omits future plans.",
    "unavoidable_judgment_points": [
      "Step 3: Does unification without predictions count as progressive? (No—Lakatos requires novel predictions, not retrospective elegance.)"
    ],
    "recommendation": "renew-with-conditions",
    "confidence": "high"
  }
  ```  
  **Mechanical derivation**:  
  - `overall = "degenerating"` (Step 3 = `degenerating`; Step 2 = `core-intact`).  
  - `cycles_since_genuine_progress = 1` (first degenerating cycle).  
  - `recommendation = "renew-with-conditions"` (1/2 degenerating cycles).  
  - `confidence = "high"` (Step 3 clear despite panellist’s sympathy).  

  ---

  #### **Programme C** (Cognitive Science)  
  ```json  
  {
    "programme": "C",
    "verdicts_by_step": [
      {"step": 2, "verdict": "indeterminate"},
      {"step": 3, "verdict": "indeterminate"},
      {"step": 4, "verdict": "indeterminate"}
    ],
    "cycles_since_genuine_progress": 0,
    "overall": "indeterminate",
    "rationale": "Step 2: Core model revised twice, but unclear if changes occurred this cycle. Step 3: Purely formal work lacks empirical contact—no predictions or ad hoc fixes to judge. Step 4: Leadership asserts field is 'too young' but offers no concrete novel plan.",
    "unavoidable_judgment_points": [
      "Step 2: Were revisions core changes or belt adjustments? (Indeterminate—dossier lacks timeline.)",
      "Step 3: Can theoretical work be progressive without empirical tests? (Indeterminate per Lakatos—no anomalies to resolve.)"
    ],
    "recommendation": "renew-with-conditions",
    "confidence": "low"
  }
  ```  
  **Mechanical derivation**:  
  - `overall = "indeterminate"` (Steps 2–4 indeterminate).  
  - `cycles_since_genuine_progress = 0` (non-degenerating cycle resets count).  
  - `recommendation = "renew-with-conditions"` (indeterminate → conditions for clarity).  
  - `confidence = "low"` (multiple judgment calls unresolved).  

  ---

  ### Summary of Judgment vs. Mechanical Elements  
  | Field                        | Mechanical? | Deliberative? | Notes                                                                 |
  |------------------------------|-------------|---------------|-----------------------------------------------------------------------|
  | `verdicts_by_step`           | No          | **Yes**       | Requires interpreting dossier/interviews per Lakatos criteria.        |
  | `cycles_since_genuine_progress` | **Yes**     | No            | Auto-calculated: +1 if degenerating, else 0.                         |
  | `overall`                    | **Yes**     | No            | Rules: `core-changed`→degenerating; else `degenerating` in Step 3/4 → degenerating; else indeterminate. |
  | `rationale`                  | No          | **Yes**       | Explains judgments for Steps 2–4.                                    |
  | `unavoidable_judgment_points`| No          | **Yes**       | Lists ambiguous decisions the panellist **must** make.               |
  | `recommendation`             | **Yes**     | No            | Rules: ≥2 degenerating → `do-not-renew`; degenerating → `renew-with-conditions`; else `renew`. |
  | `confidence`                 | **Yes**     | No            | `high` if 0 indeterminates, `medium` if 1, `low` if ≥2.              |
