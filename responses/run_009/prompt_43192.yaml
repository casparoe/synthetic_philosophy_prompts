prompt: |-
  A friend and I spent an evening last week arguing about whether consequentialism is a theory anyone could actually live by, and I have been uneasy since about how well he represented it. He wasn't being careless — he has read a fair bit of philosophy — but he compressed a lot into a short case, and I can't tell which of his moves were faithful and which smuggled something in. His summary, as well as I can reconstruct it, was this:

  'Consequentialism says an act is right if and only if it brings about the best outcome. That means any money you spend on yourself beyond bare subsistence — a coffee, a cinema ticket, a second pair of shoes — is money that, given what charities can do, would have saved or transformed a life. So each such purchase is a choice to let someone die when you could have saved them. Singer's famous famine-relief argument makes this vivid: if you would be obliged to wade in and rescue a drowning child at the cost of ruining your shoes, you are equally obliged to send the money you would have spent on the shoes to famine relief instead, and the strong version of his principle says you must keep giving until the sacrifice to you is morally comparable to what the recipient gains. Since almost no one in a rich country lives anywhere near that point, ordinary comfortable life turns out to consist of continuous wrongdoing. But no remotely plausible moral theory could demand that of people, and philosophers like Bernard Williams showed that consequentialism destroys the integrity of a person's own projects — so consequentialism is refuted. It proves too much. Either you accept that buying a coffee is morally on a par with letting a child drown, or you give the theory up.'

  I should say that I left the argument half-persuaded: the demandingness point struck me as a genuine and serious cost, but the confident step from 'this is very demanding' to 'this is refuted' felt too quick, and I suspect he was running together things that a careful consequentialist would keep apart. So I would like an audit rather than a verdict. Could you go through his summary piece by piece and tell me which parts a serious consequentialist would accept as an accurate statement of their view, which parts conflate distinct claims or overstate a modest thesis, and where a defender would say the friend has simply misdescribed the position? In particular I would like to know whether Singer's drowning-child argument is supposed to establish all of what my friend extracted from it, or whether it is one utilitarian's argument for a duty of aid rather than a consequence of consequentialism as such; whether the strong version of Singer's principle is the only one available, or even the one he still holds; whether Williams's integrity objection is the same thing as the demandingness objection or a separate complaint being passed off as the same one; and whether 'no plausible theory could demand this' is itself an assumption a consequentialist must accept, given that some of them simply bite the bullet and say the demandingness is a feature. Finally, does his either/or conclusion — accept the coffee-and-drowning equivalence or abandon the theory — actually follow from whichever parts of his summary survive correction? I am inclined to think the demandingness objection shows something important about consequentialism without refuting it, but I would like to know whether that is a defensible position or just a muddle.
reasoning: |-
  Okay, let me start by unpacking the user's query. They had an argument with a friend about whether consequentialism is livable, and the friend presented a compressed case against it. The user felt uneasy about how well the friend represented consequentialism, especially regarding demandingness and integrity objections. They want an audit of the friend's summary, not a verdict.

  First, I need to break down the friend's summary point by point. The friend claims that consequentialism demands extreme sacrifice, equating small luxuries with letting someone die. They reference Singer's drowning child analogy and Bernard Williams' integrity objection. The user questions if these points accurately represent consequentialism or if there's conflation or overstatement.

  Looking at the friend's first point: "Consequentialism says an act is right iff it brings about the best outcome." That's a standard definition, so a consequentialist would agree here. But the next step—any money beyond subsistence could save a life—is where issues start. The friend assumes that the best outcome is always donating to charities, which oversimplifies real-world complexities. Consequentialists might argue that personal spending can have indirect benefits, like maintaining mental health, which allows for more effective long-term aid. Also, diminishing returns and uncertainty in charity effectiveness might justify some personal expenditures. So, while the core idea has merit, the friend overstates it by ignoring nuances.

  Next, Singer's drowning child analogy. The friend uses it to argue that buying coffee is morally equivalent to letting a child drown. But Singer's argument specifically addresses easy rescues, not all luxuries. The analogy highlights proximity and salience, which might not apply equally to distant aid. Also, Singer later moderated his view, acknowledging psychological limits and promoting realistic giving levels. So the friend conflates Singer's initial strong principle with consequentialism as a whole, ignoring updated interpretations and other consequentialist approaches that incorporate personal projects.

  Then there's the claim that ordinary life involves continuous wrongdoing. Consequentialists like Peter Singer do accept this, but others propose modifications. Satisficing consequentialism or scalar utilitarianism might allow for "good enough" actions without demanding the absolute best. So the friend's assertion isn't universal among consequentialists, though some do bite the bullet.

  The integrity objection from Bernard Williams is presented as part of demandingness, but it's a distinct critique. Williams argues that consequentialism forces agents to abandon personal projects for impartial good, threatening their integrity. While related to demandingness, it's a separate philosophical point. Consequentialists have responses, like integrating personal values into long-term goals or using indirect strategies. The friend conflates these objections, weakening the argument.

  The friend's conclusion that "no plausible theory could demand this" is an assumption, not a refutation. Consequentialists like Shelly Kagan argue that morality's demanding nature is a tough truth we must accept. The user's inclination that demandingness is a cost but not a refutation is defensible. Consequentialism can be adjusted or defended as counterintuitive yet correct.

  Finally, the either/or fallacy: equating buying coffee with letting a child drown or abandoning consequentialism. This ignores moderate positions and nuanced defenses. Consequentialism isn't an all-or-nothing theory; it allows for gradations and contextual judgments.

  The user's unease is valid. The friend's summary has accurate elements but overstates and conflates key points. A careful consequentialist would distinguish between core principles and specific applications, accept demandingness as a challenge but not a refutation, and reject false dichotomies. The user's position—demandingness shows a cost without refuting the theory—is defensible and common in philosophical discussions.
answer: |-
  Here's a detailed audit of your friend's summary, breaking it down point-by-point to assess accuracy, potential conflations, overstatements, and misdescriptions from the perspective of a serious consequentialist:

  1.  **"Consequentialism says an act is right if and only if it brings about the best outcome."**
      *   **Accuracy:** ✅ **Highly Accurate.** This is a core, standard definition of act consequentialism. A consequentialist would fully accept this as a starting point.

  2.  **"That means any money you spend on yourself beyond bare subsistence... would have saved or transformed a life. So each such purchase is a choice to let someone die when you could have saved them."**
      *   **Accuracy/Overstatement:** ⚠️ **Overstated/Simplified, but captures a core implication.**
      *   **Why:** The core logic is sound *if* we accept the empirical claim that donating to effective charities *is* reliably the "best outcome" achievable with that marginal dollar. Many consequentialists (like Singer) *do* accept this for a significant portion of discretionary spending in affluent societies.
      *   **Conflation/Overstatement:**
          *   **"Best Outcome" isn't always "Save Life":** While saving lives is a paramount good, consequentialism values *all* well-being. The "best outcome" *could* sometimes involve personal spending that significantly boosts your long-term effectiveness, mental health (preventing burnout), relationships, or enables projects with indirect large benefits. Consequentialists emphasize *net positive impact*, which isn't always captured by the simple "save a life vs. buy coffee" binary.
          *   **Diminishing Returns & Uncertainty:** The effectiveness of the *next* dollar donated isn't always linear or perfectly predictable. Consequentialists factor in uncertainty and diminishing marginal utility of donations.
          *   **"Bare subsistence" is contestable:** Defining the exact threshold of "subsistence" is complex. Does it include internet for work? Basic social interaction? Consequentialists debate where the line falls, but few advocate literal starvation or homelessness. They focus on marginal utility: does *this specific expenditure* create more well-being for me than the alternative use (e.g., donation) would create elsewhere?
      *   **Conclusion:** While the *thrust* is directionally correct and a major challenge for consequentialists, the stark binary ("save life or let die") and the rigid "bare subsistence" threshold oversimplify the nuanced calculations a sophisticated consequentialist would attempt. They would likely say "often wrong, and more wrong than most people realize, but not *always* equivalent to letting someone die in *every* instance."

  3.  **"Singer's famous famine-relief argument... you are equally obliged to send the money..."**
      *   **Accuracy:** ✅ **Accurate Representation of Singer's *Analogy*.** Singer explicitly argues that the *principle* underlying the duty to rescue the drowning child (if the cost is minor, like ruined shoes) applies equally to donating to save a distant child from starvation. The analogy is meant to break down psychological distance as a morally relevant factor.
      *   **Conflation:** ❌ **Conflates Singer's *Specific Argument* with Consequentialism *as such*.**
          *   Singer uses a consequentialist *foundation* (preventing bad outcomes is good), but his drowning child argument is primarily an argument for a *duty of aid* based on *proximity not mattering*. One could accept the duty of aid argument without being a full consequentialist (e.g., based on Kantian duties of beneficence). Conversely, a consequentialist might arrive at similar duties without relying on Singer's specific analogy.

  4.  **"...the strong version of his principle says you must keep giving until the sacrifice to you is morally comparable to what the recipient gains."**
      *   **Accuracy:** ✅ **Accurate description of Singer's *initial strong principle* (1972).**
      *   **Overstatement/Context:** ⚠️ **Overstates its status.**
          *   Singer himself has moderated his position over time. He now advocates for a more realistic, graduated standard of giving (e.g., the "1% solution," later higher percentages, but still far below the "marginal utility" point), acknowledging psychological realities and the need for sustainable motivation. He calls the strong principle the "unyielding" version but promotes a more moderate "practicable" standard publicly.
          *   Crucially, **not all consequentialists endorse Singer's strong principle.** Many argue for satisficing consequentialism (aiming for "good enough" rather than "best"), rule consequentialism (following rules that generally maximize good, which might permit some personal spending), or incorporate agent-centered prerogatives (allowing some bias towards one's own projects/life, though this is controversial within strict consequentialism). The strong principle represents *one* strand, not the definitive consequentialist position.

  5.  **"Since almost no one... lives anywhere near that point, ordinary comfortable life turns out to consist of continuous wrongdoing."**
      *   **Accuracy:** ✅ **Logically follows *if* one accepts points 1, 2, and the strong principle.** Many consequentialists (especially strict act-utilitarians like the early Singer) *do* accept this implication. Peter Unger's *Living High and Letting Die* argues precisely this.
      *   **Conflation/Overstatement:** ⚠️ **Overstates universality within consequentialism.**
          *   Consequentialists employing satisficing, rule-based approaches, or incorporating personal integrity/prerogatives would *deny* that ordinary life consists of "continuous wrongdoing." They would argue that actions falling short of the *absolute best* aren't necessarily "wrong" if they meet a high enough standard or follow beneficial rules.
          *   Some consequentialists (like Shelly Kagan) "bite the bullet" but frame it as "most people act immorally most of the time," which is psychologically demanding but not necessarily a logical flaw.

  6.  **"But no remotely plausible moral theory could demand that of people..."**
      *   **Accuracy/Misdescription:** ❌ **A Misdescription of the consequentialist position.**
      *   **Why:** This is the *critic's* assertion (the demandingness objection), **not** something consequentialists accept. Consequentialists explicitly *reject* this claim. They argue:
          *   The plausibility of a moral theory isn't determined by its ease or comfort. Morality might be demanding. Intuitions about "plausibility" shaped by existing norms are suspect.
          *   The fact that people find it hard to live up to doesn't make the standard wrong, it might just show human weakness or societal failure.
          *   *Some* consequentialists (like Kagan) argue strenuously that demandingness is *not* a valid objection to a theory's *truth*.

  7.  **"...and philosophers like Bernard Williams showed that consequentialism destroys the integrity of a person's own projects..."**
      *   **Accuracy:** ✅ **Accurate description of Williams' *specific objection*.**
      *   **Conflation:** ❌ **Conflates two distinct objections.**
          *   **Demandingness:** Focuses on the *sheer cost* (time, money, effort) required by the theory.
          *   **Integrity (Williams):** Focuses on the *alienation* caused. Consequentialism, Williams argues, forces the agent to abandon their deeply held personal projects, commitments, and relationships whenever the impartial calculus dictates. This violates the agent's sense of self and makes them a mere "channel" for the general good, destroying their "integrity." It's about identity and personal standpoint, not just cost. While related, they are distinct philosophical arguments. Your friend presents them as if they are the same point.

  8.  **"...so consequentialism is refuted. It proves too much."**
      *   **Accuracy/Misdescription:** ❌ **Misdescription.** This is the *critic's conclusion*, not an inherent feature of consequentialism.
      *   **Why:** Consequentialists have sophisticated responses:
          *   **Biting the Bullet:** Accepting the demandingness/integrity cost as the price of truth (e.g., Kagan, early Singer).
          *   **Modifying the Theory:** Incorporating agent-relative permissions/prerogatives (Scheffler), satisficing (Slote), rule consequentialism (Hooker), or indirect strategies (promoting rules/norms that maximize good overall, even if individual acts aren't the absolute best).
          *   **Rejecting the Intuitions:** Arguing that intuitions about integrity/demandingness are biased relics of non-consequentialist thinking.
          *   Consequentialists see this as an *objection to be addressed*, not a *refutation*.

  9.  **"Either you accept that buying a coffee is morally on a par with letting a child drown, or you give the theory up."**
      *   **Accuracy/Logic:** ❌ **False Dichotomy / Overstatement / Doesn't follow.**
      *   **Why:**
          *   **False Equivalence:** As noted in point 2, consequentialists would reject the *strict equivalence* in all cases. They might accept it's *often* very wrong, perhaps comparable to a *minor* failure to rescue, but not necessarily *always* equivalent to the stark, immediate drowning scenario.
          *   **Ignores Modifications:** This forces a choice only between the *strongest, most literal* act-consequentialism and abandoning the theory entirely. It ignores all the modified consequentialist positions (satisficing, rule-based, prerogatives) that *avoid* this stark equivalence while remaining recognizably consequentialist. A rule consequentialist, for example, might say "Following a rule allowing moderate personal spending (within a generally beneficent framework) is right, even if *this specific* coffee purchase isn't the absolute best use of the marginal dollar."
          *   **Scalar Utilitarianism:** Some (like Alastair Norcross) argue consequentialism is better understood as *scalar* (judging actions on a scale of better/worse consequences) rather than *deontic* (right/wrong). Buying coffee *might* be vastly *worse* than donating, but not necessarily "wrong" in a binary sense equivalent to letting a child drown nearby.
          *   **Doesn't Follow from Surviving Points:** Even if we grant the demandingness and integrity objections have force, they show *costs* or *difficulties* for consequentialism, not a logical contradiction or fatal flaw that forces its abandonment. One can consistently believe consequentialism is *true* but *difficult to live by*.

  **Addressing Your Specific Queries:**

  *   **Singer's Argument:** It establishes a *strong duty of aid* based on impartiality and minor cost. It's *compatible* with consequentialism and used by Singer (a consequentialist), but it's not a *necessary consequence* of consequentialism *as such*. Other consequentialists might derive similar duties differently or moderate them more.
  *   **Singer's Strong Principle:** It is **not** the only one available. Singer himself advocates a more moderate public standard. Many other consequentialist theories reject the strong principle in favor of satisficing, rules, or prerogatives.
  *   **Williams vs. Demandingness:** They are **distinct objections.** Demandingness is about cost/effort; Williams' integrity is about alienation from one's core self/projects. Conflating them weakens the critique.
  *   **"No plausible theory could demand this":** This is **not** an assumption consequentialists accept. They explicitly reject it. Many argue morality *is* demanding, and intuitions about plausibility are unreliable.
  *   **The Either/Or Conclusion:** It **does not follow.** It presents a false choice between the strongest possible interpretation of act consequentialism and abandoning the theory entirely, ignoring the spectrum of modified consequentialist positions that avoid the stark equivalence without abandoning the core commitment to maximizing good outcomes.

  **Your Inclination:** Your feeling that the demandingness (and integrity) objections show a **genuine and serious cost** for consequentialism without necessarily **refuting** it is **highly defensible and philosophically common.** It reflects the mainstream view:

  1.  **Cost Recognized:** Consequentialism, especially in its strict act-utilitarian form, *is* extremely demanding and poses challenges to personal integrity. This is widely acknowledged as a significant theoretical burden.
  2.  **Not a Refutation:** This demandingness doesn't create a logical contradiction *within* the theory. Consequentialists offer various responses: biting the bullet, modifying the theory, or arguing that the cost is overstated. The debate centers on whether this cost is acceptable or fatal, not whether it exists.
  3.  **Room for Nuance:** Consequentialism is a family of theories. The demandingness critique hits some versions harder than others. Rule consequentialism or theories incorporating agent-relative permissions are explicitly designed to mitigate these concerns while retaining a consequentialist core.

  Your unease stems from correctly spotting the conflations (Singer-specific vs. general consequentialism, strong principle vs. alternatives, demandingness vs. integrity) and the overstatements (strict equivalence, "continuous wrongdoing," "refuted"). Your position—seeing the demandingness as a major challenge but not a knockdown refutation—is a thoughtful and sustainable middle ground in the philosophical discussion.
