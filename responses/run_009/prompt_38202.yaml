prompt: |-
  I'm a program officer at a family foundation that gives away around $15M a year across three buckets: global health, local education, and a "wildcard" fund for research and pilot projects. I'm the one who reads the proposals and writes the recommendation memo the board votes on, so everything runs through me first. That's maybe twenty decisions a year, and it's the most money I'll ever help direct, so I'd like to not fumble it.

  Here's my problem. I came to this job from a program-evaluation background, and I keep hitting a wall that I think philosophers actually have a name for. For any given grant I can trace the near-term effects well enough: kids tutored, clinics supplied, papers written. Everyone here agrees the distant effects dwarf the near ones and nobody can trace them. A tutoring program might bend a kid's whole life trajectory or do nothing; a cheap medical pilot might get picked up and scaled by a government or quietly forgotten. And when I try comparing across buckets — local vs global, present people vs future ones — I'm not just unable to add everything up, I can't even say whether my uncertainty would wash out on average or whether I'm missing an entire direction of effect, good or bad, that I haven't thought of. I read somewhere that this is called cluelessness, and that someone (Greaves? I honestly forget) splits it into cases where you're overwhelmed by too many individually traceable effects vs cases where you can't even agree on the signs. That distinction felt like it was written about me, but I've lost the reference and don't need it back.

  So what I want from you is a procedure. Something I can run alone in about 90 minutes per proposal, before writing my one-page memo. Concretely it should tell me: which questions to ask about a proposal and in what order; what counts as a sufficient answer to each; where the honest output is "this is a values call, hand it to the board as such" rather than me dressing it up as analysis; and where the procedure deliberately sends me back to comparing near-term effects even though we all agree those aren't what matters most. On that last one, I want to understand why it isn't just cowardice — or be told honestly that it is.

  Then run the procedure on three proposals so I can see how it behaves:

  (a) $1.8M to a deworming program with a decent track record in one country, expanding into a neighboring country with much weaker health infrastructure;
  (b) $500K to a local afterschool literacy program, with a small but real local RCT behind it;
  (c) $2M to a tiny team doing research on institutional decision-making under deep uncertainty — i.e., precisely the thing that makes my job hard — with no track record whatsoever.

  Two more things. First, at least one of the three should come out with a recommendation I'll personally hate, and I want to see it happen rather than have the procedure mysteriously bend to what I'd want. Second, tell me what the procedure can't do: where following it faithfully would still produce the wrong answer, and how I would even notice that it had. My board chair is allergic to philosophy jargon, so whatever you give me should be runnable without me having to explain what a consequentialist is at the next meeting. I don't need a reading list — I need something I can actually run on Thursday.
reasoning: |-
  Okay, let me start by really understanding what this program officer is dealing with. They're at a family foundation giving away $15M a year across three areas: global health, local education, and a wildcard fund for research. Their role is crucial—they review proposals and write the recommendation memos for the board. With about twenty decisions a year, they want a solid, efficient method to evaluate each proposal without getting stuck on long-term uncertainties.

  The user mentioned a philosophical problem called "cluelessness," where they can track near-term outcomes but struggle with distant effects. They need a practical 90-minute procedure that helps them decide which questions to ask, when to defer to the board on values, and why focusing on near-term effects isn't just avoidance. They also want the procedure tested on three proposals, including one they'll dislike, and to know its limitations.

  First, I need to design a procedure that's structured and time-bound. Breaking it into phases makes sense: Triage, Trace, Expand, and Compare. Triage quickly filters out non-starters. Trace focuses on near-term impacts because, while they're not the ultimate goal, they're measurable and necessary for feasibility. Expand considers longer-term effects and uncertainties, using scenarios instead of precise predictions. Compare forces trade-offs and identifies where decisions are value-based.

  For the triage phase, essential questions include basic viability, alignment with the foundation's goals, and ethical concerns. If any red flags pop up, the proposal is a no-go. This step should take only 15 minutes to avoid wasting time on unfit proposals.

  Next, the Trace phase examines near-term outputs and inputs. Verifiable evidence like RCTs, past data, or clear logic models is crucial here. If a proposal lacks this, it's a weak candidate unless it's high-risk/high-reward. This phase keeps the evaluation grounded in what's knowable, addressing the user's concern that near-term focus isn't cowardice but a necessary anchor.

  The Expand phase is where uncertainty is tackled. I should think about best-case, worst-case, and most-likely scenarios for long-term effects. Key questions here involve pathways to scale, unintended consequences, and leverage points. If the uncertainty is too high (like with the institutional research proposal), it becomes a values call for the board.

  Comparing proposals means stacking them against others in the same bucket and across buckets. Using a scorecard with criteria like scale, evidence, and uncertainty helps. But when trade-offs involve different values—like local vs. global impact—the procedure flags it for the board.

  Applying this to the three proposals: Deworming has strong evidence and scale but might have systemic risks in a new country. The literacy program has local RCT support but limited scale. The research proposal is high-risk with no track record but addresses a critical gap. The user mentioned wanting one recommendation they'd hate. If they prioritize measurable impacts, rejecting the research proposal (which they might personally favor) would fit, forcing them to confront their biases.

  Limitations include the procedure's reliance on available data and potential blind spots in scenario planning. Also, it can't resolve deep value conflicts—those must go to the board. The key is transparency about uncertainties and values, so the board understands the rationale.

  I need to ensure the process avoids jargon, uses plain language, and fits into 90 minutes. Testing each proposal against the phases will show how it works in practice. Highlighting when a decision is a values call (like choosing between local and global) meets the user's request for honesty. Emphasizing that near-term focus isn't cowardice but pragmatism because it's the only solid ground available makes sense. Finally, being upfront about the procedure's limits, like missing unintended consequences, builds trust in the process.
answer: |-
  Here’s a concrete 90-minute evaluation procedure designed for your constraints. It forces explicit trade-offs, flags value judgments, and anchors in traceable evidence while acknowledging cluelessness. The core logic: **Near-term effects are not the goal, but they are your only reliable signal of competence and plausibility for distant impact.**

  ---

  ### **The 90-Minute Evaluation Procedure**  
  *(Timer running? Start now.)*

  **PHASE 1: TRIAGE (15 min)**  
  *Purpose: Kill non-starters fast. No emotional labor yet.*  
  1. **Alignment:** Does this fit one of our three buckets? If "wildcard," is it truly novel (not disguised health/edu)?  
     *✅ Sufficient: Clear match to bucket priorities. ❌ Fail: Stretch justification.*  
  2. **Viability:** Can they execute? (Budget realism, team CVs, partner commitments, permits secured).  
     *✅ Sufficient: No glaring red flags. ❌ Fail: Unaddressed deal-breakers (e.g., key permit missing).*  
  3. **Floor Risk:** Could this actively harm people or our reputation? (e.g., ethical violations, reckless scale-up).  
     *✅ Sufficient: No plausible harm found. ❌ Fail: Unmitigated high risk.*  
     *▶️ Outcome: "No" = reject. "Yes" → Phase 2.*

  **PHASE 2: TRACE (30 min)**  
  *Purpose: Force clarity on what CAN be measured. This isn’t cowardice—it’s quality control for the untraceable.*  
  1. **Near-Term Outputs:** What will be delivered in 1-3 years? (e.g., # kids dewormed, # teachers trained, # research papers).  
     *✅ Sufficient: Quantifiable, verifiable outputs tied to grant spend.*  
  2. **Input Quality:** What evidence supports their method? (e.g., RCT, peer-reviewed theory, pilot data).  
     *✅ Sufficient: Rigorous evidence for their context OR strong theory + monitoring plan for novel work.*  
  3. **Counterfactual:** Why us? What happens if we DON’T fund this? (e.g., will it die? Be delayed 2 years?)  
     *✅ Sufficient: Credible case we’re pivotal (not just convenient).*  
     *▶️ Outcome: Weak evidence/justification → "Weak Maybe." Strong → Phase 3.*

  **PHASE 3: EXPAND (25 min)**  
  *Purpose: Map uncertainty for long-term impact. Don’t predict—scenario-plan.*  
  1. **Pathways:** What are 2-3 *plausible* pathways to distant impact? (e.g., "Govt adopts program," "Research shifts policy norms").  
     *✅ Sufficient: Logical (not speculative) links to bigger change.*  
  2. **Critical Uncertainties:** What 1-2 things *most* control high/low impact? (e.g., "Govt buy-in by Year 3," "Teacher retention").  
     *✅ Sufficient: Identified & monitorable.*  
  3. **Tail Risks:** What’s a plausible upside surprise? Downside catastrophe? (e.g., "Sparks regional reform" / "Undermines local trust").  
     *✅ Sufficient: Acknowledged; mitigation for downsides.*  
     *▶️ Outcome: Pathways credible → Phase 4. Pure speculation → "High-Risk Values Call."*

  **PHASE 4: COMPARE (20 min)**  
  *Purpose: Force ranking within/between buckets. Values come here.*  
  1. **Within Bucket:** How does this stack vs. others? (Use Trace Phase scores: Outputs/Evidence/Pivotality).  
  2. **Across Buckets:** Does this have exceptional *leverage* (impact/$) or *neglectedness* (only we’d fund)?  
  3. **Values Tension:** Does success require privileging one value over another? (e.g., "Local impact" vs. "Scale" vs. "Future benefit").  
     *▶️ Outcome: Clear winner → Recommend. Tie/Values clash → "Board Values Call."*  

  ---

  ### **Running the Proposals**  
  **Assumed Foundation Values:** (Implicit from buckets) Scale (Global Health), Local Impact (Education), Future Leverage (Wildcard).  

  **(a) Deworming Expansion ($1.8M - Global Health)**  
  - **Triage:** ✅ Aligns. ✅ Strong org, govt partner. ✅ Low floor risk (existing protocol).  
  - **Trace:** ✅ Outputs: # children treated clear. ✅ Evidence: Gold-standard RCTs elsewhere. ✅ Counterfactual: Govt won’t fund startup costs.  
  - **Expand:**  
    *Pathways:* (1) Healthier kids → better cognition → lifetime earnings boost; (2) Demo effect → regional adoption.  
    *Uncertainties:* Health system capacity (new country).  
    *Tail Risks:* Upside: Catalyzes national program. Downside: Logistics fail → low coverage.  
  - **Compare:** High scale (100k+ kids), strong evidence, proven cost-effectiveness. **Recommend: YES.**  

  **(b) Local Literacy Program ($500K - Education)**  
  - **Triage:** ✅ Aligns. ✅ Solid local team. ✅ Low risk.  
  - **Trace:** ✅ Outputs: # kids served, tutoring hours. ✅ Evidence: Small RCT showed literacy gains. ✅ Counterfactual: No other funders for expansion.  
  - **Expand:**  
    *Pathways:* (1) Better HS graduation → college/jobs; (2) Model for district adoption.  
    *Uncertainties:* Scalability beyond 5 schools.  
    *Tail Risks:* Upside: District replicates. Downside: Gains fade after program.  
  - **Compare:** Strong local evidence, but low scale (500 kids). Loses to deworming on scale/evidence. **Recommend: NO** (unless local impact is board’s *top* value).  

  **(c) Decision-Making Research ($2M - Wildcard)**  
  - **Triage:** ✅ Wildcard fit (novel). ✅ Team credible (top academics). ✅ Low direct harm risk.  
  - **Trace:** ✅ Outputs: Papers, models, workshops. ❗**Evidence:** No track record; theory-only. ✅ Counterfactual: No one funds "meta" work.  
  - **Expand:**  
    *Pathways:* (1) Tools adopted by NGOs/govts → better $1B+ decisions; (2) Field-building.  
    *Uncertainties:* Will practitioners use this?  
    *Tail Risks:* Upside: Changes how major funders allocate billions. Downside: Ignored niche academia.  
  - **Compare:** Wildcard’s *purpose* is high-risk/high-reward. But $2M is huge for no track record. **Recommend: NO** (or $250K pilot). **THIS IS THE ONE YOU’LL HATE.** Why? Trace Phase failed on evidence. High cost amplifies risk.  

  ---

  ### **What the Procedure Can’t Do (and How You’d Notice)**  
  1. **Miss Black Swans:** It flags *known* tail risks, but can’t predict true unknowns (e.g., research (c) unexpectedly enables AI governance). *You’d notice:* When an outcome (good/bad) was never on your radar.  
  2. **Handle Interdependence:** It treats grants as independent. If proposals synergize (e.g., deworming + education research), you’ll miss it. *You’d notice:* When 1+1>2 effects emerge later.  
  3. **Override Board Values:** If the board secretly prioritizes "local feel-good projects" over scale, a rejected literacy program (b) will cause friction. *You’d notice:* When board overrides your "YES" on scale for a "NO" on local.  
  4. **Fix Garbage In/Garbage Out:** If a proposal misrepresents evidence (e.g., fake RCT), the procedure trusts it. *You’d notice:* During site visits or audits.  

  ---

  ### **Why Near-Term Focus Isn’t Cowardice**  
  **Because competence compounds, and incompetence corrodes.** A team that can’t deliver traceable outputs won’t magically achieve systemic change. Near-term effects are your filter for:  
  - **Execution Skill:** Delivering pills or tutoring sessions proves operational capacity.  
  - **Credibility:** RCTs or pilot data suggest their theory *might* work at scale.  
  - **Accountability:** Measurable outputs let you cut funding if they fail.  
  Ignoring traceable evidence isn’t bold—it’s gambling. Anchoring here lets you say: *"We fund teams who deliver what they promise, because that’s the only path to larger impacts we can’t trace."*  

  **Final Memo Template:**  
  1. **What:** Grant purpose, bucket, cost.  
  2. **Traceable:** Outputs, evidence, pivotality (Phase 2).  
  3. **Untraceable:** Best/Worst case, key uncertainty (Phase 3).  
  4. **Trade-off:** Why better/worse than alternatives? (Phase 4).  
  5. **Recommend:** Yes/No + risk level ("Board Values Call" if needed).  

  Run this Thursday. It won’t defeat cluelessness, but it will force disciplined decisions within 90 minutes.
