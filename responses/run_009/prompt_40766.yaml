answer: |-
  Here is your field guide to the positions:

  1.  **Self-Inflicted Collapse:** Societies absolutely fail due to their own poor long-term decisions, ignoring warnings, and squandering resources. *Tell:* "The Easter Islanders *chose* to cut down every last palm tree for statues, directly causing their own ecological and societal doom."
  2.  **Externally Driven Collapse:** Societies absolutely fail when overwhelmed by external forces beyond their control or reasonable anticipation. *Tell:* "The Mycenaean palaces burned and bureaucracy vanished because of invasions or climate shifts they couldn't prevent; their 'failure' was inevitable catastrophe, not mismanagement."
  3.  **Vulnerability-Triggered Collapse (Hybrid):** Societies absolutely fail when inherent internal weaknesses (poor decisions, rigid structures) make them fatally vulnerable to severe external shocks. *Tell:* "Maya political collapse *was* a genuine failure: their elite's environmental mismanagement or warfare made them uniquely susceptible to drought pressures that farmers alone weathered."
  4.  **Elite Reorganization:** What looks like societal failure is primarily the dissolution of a specific, often parasitic, ruling class or institution; the broader society adapts and persists, sometimes improving. *Tell:* "The burning of Mycenaean palaces ended a burdensome bureaucracy; farmers kept farming, and its collapse allowed alphabetic writing, impossible under scribes, to eventually flourish."
  5.  **Resilient Continuity (Collapse Rejection):** The concept of societal 'failure' is largely an illusion centered on elite institutions; societies fundamentally reorganize and endure through their people, culture, and subsistence base. *Tell:* "Maya 'collapse' is a misnomer; monuments stopped, but millions speaking Maya languages prove the *society* endured, shedding only its political superstructure – 'failure' is just the end of elite paperwork." *(Note: This position inherently rejects the framing of Question 1, seeing 'failure' as incoherent for enduring societies.)*
