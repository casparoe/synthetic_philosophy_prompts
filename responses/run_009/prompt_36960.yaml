  Okay, let me try to unpack this user's dilemma. They're grappling with a colleague's argument against justifying copyright through harm, and they're troubled by the implication that fraud and similar offenses also can't be justified this way. The user suspects a baseline shift in the harm definition but feels stuck articulating it. 

  First, I need to map the argument's structure clearly. Premise (1) ties legitimacy to harm, (2) defines harm counterfactually, and (3)-(5) argue that copying doesn't meet this definition without circularly assuming copyright. The user accepts (1) and the parity in (7) but rejects (7)'s conclusion, seeing it as reductio ad absurdum. 

  Hmm... the core tension is between legal vs. non-legal baselines. When the colleague says "would otherwise have been" in (2), do they mean "without this specific act" (legal baseline) or "without any legal framework" (law-free baseline)? In copyright's case, using a law-free baseline ignores that harm could flow from violating autonomy or expectations—not just physical loss. 

  For fraud, the user likely intuits it's different because fraud actively deceives, creating direct relational harm regardless of legal context. Copyright infringement lacks that immediacy, making the harm more contingent on legal recognition. The parity in (7) feels superficial because fraud's wrongfulness is inherent to the act, while copyright's relies on institutional frameworks. 

  The user's real struggle might be reconciling legal moralism with harm prevention. Rejecting (2)'s narrow definition allows recognizing non-material harms but risks overextending state power. I should emphasize that distinguishing harm types (material/autonomy/relational) resolves the paradox without abandoning harm-based justification entirely. 

  ...Wait, does the user need help seeing that the colleague's argument conflates harm with material deprivation? That'd explain why (7) seems absurd—fraud isn't just about lost money but violated trust, which exists independently of law. Copyright's connection to autonomy is more mediated, making baseline choice matter more there. 

  The cost of rejecting (2) is minimal for fraud/defamation cases since their harm is obvious without law-free baselines. Copyright remains harder to justify purely by harm, pushing the user toward alternative justifications (labor-desert, personality rights). That's probably their underlying concern—how much ground harm-based arguments can cover in IP debates. 

  I'll structure the response to: 1) pinpoint the baseline shift, 2) show how material harm is only one category, 3) differentiate fraud from copyright via inherent wrongfulness, and 4) suggest harm pluralism preserves (1) without endorsing overreach. The user gets to keep their core intuitions while avoiding the colleague's slippery slope.
answer: |-
  Your suspicion about the shifting baseline in premise (2) is precisely where the argument fails. Here’s how to dismantle it while preserving your preferred commitments:

  ### **The Flaw: Premise (2)’s Ambiguous Baseline**
  - **Problem**: Premise (2) *does* shift between two counterfactual baselines:  
    - **Legal Baseline**: "Worse off than they would have been *in the actual world (with current laws)*, had this specific act not occurred."  
      *(e.g., "Without this fraud, I’d have my money under existing property law.")*  
    - **Law-Free Baseline**: "Worse off than they would have been *in a hypothetical world without the relevant legal entitlement*."  
      *(e.g., "Without copyright law, I’d have no expectation of sales.")*  
  - **How the Shift Happens**:  
    - In (4), the "obvious reply" (lost sales) is dismissed *because it uses the legal baseline* (copyright exists).  
    - But in (5), the conclusion "unauthorized copying harms no one" *switches to the law-free baseline* (no copyright exists).  
  - **Result**: The argument illegitimately rejects the legal baseline in (4) while relying on a law-free baseline in (5) that ignores legitimate moral interests.

  ### **What to Reject: Premise (2) as Stated**
  - **Reject**: The unqualified claim that harm *always* requires being "worse off" *against a law-free baseline*.  
  - **Why it looked acceptable**: We intuitively apply different baselines contextually. If I steal your car, we measure harm against the baseline where you still possess it *under existing property law*—not against an anarchic state of nature. Premise (2) exploits this intuition but misapplies it.  
  - **Cost of rejection**: Minimal for your core commitments. You can keep:  
    - (1) Harm as necessary for legal prohibitions (if you wish).  
    - The *descriptive* parity in (7) (fraud/defamation *also* rely on legal baselines).  

  ---

  ### **How to Handle the Cases in (7): Superficial Parity, Deep Difference**
  The colleague is wrong that fraud, defamation, and private letters "travel with" copyright. They fail the law-free baseline test *but for morally relevant reasons*:

  | **Case**         | **Harm Against Legal Baseline**                     | **Harm Against Law-Free Baseline** | **Why Harm is Non-Circular** |
  |------------------|-----------------------------------------------------|------------------------------------|-------------------------------|
  | **Copyright**    | Lost sales/licensing fees.                          | None (you keep manuscript).        | Depends entirely on legal entitlement; no inherent moral wrong without law. |
  | **Fraud**        | Loss of assets obtained by deception.               | None (scammer "created" value).    | **Inherent relational harm**: Violates autonomy by deception, irrespective of law. |
  | **Defamation**   | Damage to reputation/social standing.               | None (words don’t remove property).| **Inherent relational harm**: Undermines dignity/truth, not contingent on legal rules. |
  | **Private Letters| Emotional distress/loss of privacy.                 | None (information is "copied").    | **Inherent autonomy harm**: Violates trust/self-determination, even without law. |

  #### **Key Distinctions:**
  1. **Copyright Harm is Constitutive**:  
     - The "harm" of infringement *exists only because the law creates an entitlement*. Without copyright, there is no moral right to control copies.  
  2. **Fraud/Defamation/Privacy Harms are Pre-Legal**:  
     - These acts are **inherently wrongful** due to:  
       - **Deception** (fraud undermines consent).  
       - **Dignity Violation** (defamation distorts social identity).  
       - **Autonomy Breach** (privacy invasion denies control over self-presentation).  
     - Their wrongfulness does not *depend* on legal entitlements; law *recognizes* pre-existing moral harms.  

  ---

  ### **Resolving the Dilemma Without Abandoning Harm**
  - **Revise Premise (2)**: Harm occurs when an act sets back an interest *that society has reason to protect*, measured against a **morally justified baseline**.  
    - For fraud/defamation/privacy: The baseline includes non-legal moral expectations (e.g., truth-telling, bodily autonomy).  
    - For copyright: The baseline *may* include legal entitlements *if* they serve a deeper interest (e.g., incentivizing creation).  
  - **Consequence**: Copyright’s justification requires showing that:  
    - (a) Copyright protects a genuine interest (e.g., labor-desert, incentive to create);  
    - (b) Unauthorized copying *harms* that interest *under a baseline where the interest is recognized*.  
    This avoids circularity by appealing to independent moral/practical reasons for the entitlement.  

  ---

  ### **Your Path Forward**
  1. **Reject premise (2)’s law-free baseline requirement**. It is underdefined and leads to absurdity (as (7) shows).  
  2. **Accept that "harm" must be measured against baselines that include morally legitimate entitlements**—not just physical possessions.  
  3. **Deny the deep parity in (7)**:  
     - Fraud/defamation/privacy cause **pre-legal moral harms** (autonomy, dignity, relational integrity).  
     - Copyright infringement causes **institutional harm**—it only wrongs someone if we first justify the institution.  
     - Thus, copyright cannot *stand alone* on harm-avoidance; it needs supplementary justification (e.g., utility, desert).  

  This preserves your intuition that (7)’s conclusions are untenable while explaining why copyright is uniquely vulnerable to this argument. The colleague’s reasoning holds for copyright but not for core personal wrongs—revealing copyright’s weaker moral foundation, not a flaw in harm-based justifications generally.
